name: Secret & Sensitive Data Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'
  push:
    branches:
      - '**'
    tags:
      - '**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-commits:
    name: Scan All Commits (PR & Push Gate)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner unit & regression tests
        # language=bash
        run: |
          python -m pip install pytest
          pytest tools/security/test_scan_secrets.py -v

      - name: Collect force-pushed / historical PR commit SHAs
        id: extra_shas
        uses: actions/github-script@v7
        with:
          # language=javascript
          script: |
            const shas = new Set();
            const zeroSha = '0000000000000000000000000000000000000000';
            if (context.payload.before && context.payload.before !== zeroSha) {
              shas.add(context.payload.before);
            }
            if (context.payload.pull_request) {
              try {
                const events = await github.rest.activity.listRepoEvents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 50,
                });
                const prHeadRef = `refs/heads/${context.payload.pull_request.head.ref}`;
                for (const ev of events.data) {
                  if (ev.type === 'PushEvent' && ev.payload && ev.payload.ref === prHeadRef) {
                    if (ev.payload.before && ev.payload.before !== zeroSha) {
                      shas.add(ev.payload.before);
                    }
                    if (ev.payload.head && ev.payload.head !== zeroSha) {
                      shas.add(ev.payload.head);
                    }
                  }
                }
              } catch (err) {
                core.info(`Skipping repo events lookup: ${err.message}`);
              }
            }
            core.setOutput('shas', Array.from(shas).join(' '));

      - name: Resolve commit range to scan
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXTRA_SHAS: ${{ steps.extra_shas.outputs.shas }}
        # language=bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"
          fi

          # New branch/tag pushes report an all-zero "before" SHA, and force-pushes may report a
          # SHA that is no longer fetchable. Without a valid base the scan would walk the entire
          # repository history, so fall back to the merge-base with the default branch.
          git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || true
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git merge-base "origin/${DEFAULT_BRANCH}" "$HEAD_SHA" || true)"
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "::error::Could not resolve a base commit for the secret scan." >&2
            exit 1
          fi

          VALID_EXTRA=""
          for sha in $EXTRA_SHAS; do
            git fetch --no-tags origin "$sha" 2>/dev/null || true
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              VALID_EXTRA="$VALID_EXTRA $sha"
            fi
          done

          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "extra=${VALID_EXTRA# }" >> "$GITHUB_OUTPUT"

      - name: Scan every commit and blob in range
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          EXTRA_SHAS: ${{ steps.range.outputs.extra }}
        # language=bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          for sha in $EXTRA_SHAS; do
            EXTRA_ARGS+=("--extra-commit" "$sha")
          done

          python3 tools/security/scan_secrets.py \
            --mode commits \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            "${EXTRA_ARGS[@]}" \
            --markdown-out commit_scan_report.md \
            --json-out commit_scan_findings.json \
            --github-annotations

      - name: Run gitleaks (upstream vendor rules) over every commit in range
        if: ${{ success() || failure() }}
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          GITLEAKS_VERSION: '8.24.2'
          GITLEAKS_SHA256: 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e'
        # language=bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            .

      - name: Post redacted alert comment on PR if secrets were detected
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          # language=javascript
          script: |
            const fs = require('fs');
            if (!fs.existsSync('commit_scan_report.md')) return;
            const report = fs.readFileSync('commit_scan_report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });

      - name: Open or update security-leak-alert issue on failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          # language=javascript
          script: |
            const fs = require('fs');
            const report = fs.existsSync('commit_scan_report.md')
              ? fs.readFileSync('commit_scan_report.md', 'utf8')
              : 'Secret scan failed during commit history inspection.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const refLabel = context.payload.pull_request
              ? `PR #${context.payload.pull_request.number}`
              : `commit ${context.sha.slice(0, 12)}`;
            const title = `🚨 [Security Alert] Potential secret or internal reference pushed in ${refLabel}`;
            const body = `${report}\n\n**Workflow Run:** ${runUrl}\n**Triggered By:** \`@${context.actor}\` on \`${context.eventName}\``;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-leak-alert',
              per_page: 20,
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-leak-alert'],
              });
            }

  scan-entire-repo:
    name: Scan Entire Repository History & All Refs
    runs-on: ubuntu-latest
    # Not a PR gate: refs/pull/* cannot be cleaned without GitHub support, so a leak in one PR
    # would otherwise fail every unrelated PR. PR commits are gated by scan-commits above.
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository with all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all heads, tags, and pull request refs
        # language=bash
        run: |
          git fetch --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/origin/pr/*' || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan all reachable blobs across the entire repository
        # language=bash
        run: |
          python3 tools/security/scan_secrets.py \
            --mode full-repo \
            --baseline .github/security_baseline.json \
            --markdown-out full_repo_report.md \
            --json-out full_repo_findings.json \
            --github-annotations

      - name: Alert via GitHub Issue if unbaselined repo-wide secrets are found
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/github-script@v7
        with:
          # language=javascript
          script: |
            const fs = require('fs');
            const report = fs.existsSync('full_repo_report.md')
              ? fs.readFileSync('full_repo_report.md', 'utf8')
              : 'Full-repository secret scan failed.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '🚨 [Security Alert] Unbaselined secret or sensitive reference detected in repository history';
            const body = `${report}\n\n**Workflow Run:** ${runUrl}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-leak-alert',
              per_page: 20,
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-leak-alert'],
              });
            }
