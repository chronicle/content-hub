name: Auto-update Parser Index
on:
  push:
    paths:
      - 'content/parsers/third_party/**'
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-and-update:
    name: Check and Update
    permissions:
      contents: write # Required to commit and push updated parser index files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Fetch all history so git diff can access the main branch history
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check Branch Differences
        id: check_changes
        run: |
          # Fetch the latest main to compare against
          git fetch origin main

          # Use 3-dot diff to find all files changed on this branch since splitting from main
          # git diff --quiet returns exit code 1 if differences exist
          if git diff --quiet origin/main...HEAD -- "content/parsers/third_party/"; then
            echo "No changes found in target directory for this entire branch."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in content/parsers/third_party/."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate Index
        if: steps.check_changes.outputs.has_changes == 'true'
        run: python3 tools/parsers/scripts/generate_index.py

      - name: Commit and Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "secops-parsers-helper-bot"
          git config --global user.email "secops-parsers-helper-bot@google.com"
          git add content/parsers/third_party/COMMUNITY_INDEX.json content/parsers/third_party/PARTNER_INDEX.json

          if git diff-index --quiet HEAD; then
            echo "No index files were changed. Skipping commit."
          else
            git commit -m "Automated update of parser indexes [skip ci]"
            git push origin "HEAD:${GITHUB_REF}"
          fi
