name: RI Breaking-Change Check

# Deterministic check that a pull request does not break customers who already
# use a Response Integration (removed/renamed components, removed or newly
# mandatory parameters, parameter type changes, removed JSON result keys).
# Works for fork PRs with a read-only token: results are reported through
# workflow annotations and the job summary only. See
# .github/scripts/ri_breaking_change_check.py for the rules and escape hatches.

on:
  pull_request:
    # labeled/unlabeled let authors apply the `breaking-change` escape hatch
    # without pushing a new commit. The `paths` filter applies to the files
    # changed by the PR, so these events only run for PRs that touch RI content.
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths:
      - 'content/response_integrations/**'
      - '.github/workflows/ri_breaking_change_check.yml'
      - '.github/scripts/ri_breaking_change_check.py'
      - '.github/scripts/test_ri_breaking_change_check.py'

permissions:
  contents: read

# A newer event for the same PR (push or label change) supersedes the running
# check; the superseded run shows as "cancelled" but the latest run determines
# the status of the check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  breaking-change-check:
    name: Check for breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR merge base and both commits are available locally;
          # the check never needs the network afterwards, so no credentials are kept.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        # language=bash
        run: python -m pip install --quiet 'pyyaml>=6,<7'

      - name: Detect changes to the check itself
        id: self
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # language=bash
        run: |
          # `A...B` diffs against the merge base. Any failure to compute it (exit
          # code other than 0/1) counts as "changed" so the unit tests still run.
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
              .github/workflows/ri_breaking_change_check.yml \
              .github/scripts/ri_breaking_change_check.py \
              .github/scripts/test_ri_breaking_change_check.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests for the check
        if: steps.self.outputs.changed == 'true'
        # language=bash
        run: |
          python -m pip install --quiet 'pytest>=8,<10'
          python -m pytest .github/scripts/test_ri_breaking_change_check.py -q -p no:cacheprovider

      - name: Run breaking-change check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # JSON so label names containing commas cannot be mis-split; passed through
          # the environment (never interpolated into the script) to avoid injection.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        # language=bash
        run: |
          python .github/scripts/ri_breaking_change_check.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --labels "$PR_LABELS"
