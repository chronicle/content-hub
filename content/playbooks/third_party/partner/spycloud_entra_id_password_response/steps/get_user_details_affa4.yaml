name: AzureActiveDirectory_Enrich User
description: Read the affected user's Entra ID profile so the next step can compare the
    account's last password change against the exposure's publish date. Runs only when
    the "Any Passwords Remain?" condition took the Yes branch. The lookup is advisory -
    if it fails or returns nothing the rotation check treats the exposure as live and
    the reset still goes ahead.
