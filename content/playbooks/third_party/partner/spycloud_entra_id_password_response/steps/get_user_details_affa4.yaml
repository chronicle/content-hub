# NOTE: unlike the Okta playbook's lookup, this action takes no explicit username - it
# enriches the User entities in the case scope. The SpyCloud connector creates no USER
# entities itself, so on a tenant whose ontology does not map the exposed identity this
# returns nothing. That degrades safely: the rotation check then sees an empty
# timestamp and reports that a reset is still required, which is the pre-existing
# behavior. If the tenant needs the check to work without entity mapping, swap this for
# an action that accepts an explicit user (see "List User's Groups Membership", which
# takes a "User Name" parameter) and bind it to the Filter Passwords By Policy email.
-   step_id: affa4948-23e9-479b-a781-bfd0d3fb645b
    playbook_id: e3322e99-6ba6-4317-9b64-cc14ffa48dc6
    name: ScriptParametersEntityFields
    value: '{"Fields To Return":"userPrincipalName,mail,lastPasswordChangeDateTime"}'
