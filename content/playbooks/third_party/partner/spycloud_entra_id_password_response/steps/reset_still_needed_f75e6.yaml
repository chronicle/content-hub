name: Condition
description: Evaluate whether the exposed credential is still live, i.e. the Check
    Password Rotation script result is greater than zero. The "Yes" branch resets the
    user's Entra ID password; the "No" branch means the user already changed their
    password after the exposure was published, so the playbook skips the reset and
    carries on to the session check.
