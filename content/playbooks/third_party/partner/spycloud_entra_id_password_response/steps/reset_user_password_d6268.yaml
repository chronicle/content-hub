# The Username comes from the Filter Passwords By Policy JSON result rather than the
# case User entity: the connector emits UDM events and creates no USER entities itself,
# so on a tenant whose ontology does not map the exposed identity to a User entity the
# action would run with an empty Username and reset nothing.
# getByIndex("0") takes the first affected identity only; cases carrying exposures for
# more than one identity need a loop step.
# PLACEHOLDER: set the new Password (stored encrypted) in the UI on import. The
# action forces the user to change it on next login.
-   step_id: d6268c9b-a1e4-49ac-b533-690e3180a0f4
    playbook_id: e3322e99-6ba6-4317-9b64-cc14ffa48dc6
    name: ScriptParametersEntityFields
    value: '{"Username":"[Filter Passwords By Policy.JsonResult| \"emails_with_remaining_passwords\"
        | getByIndex(\"0\")]","Password":""}'
