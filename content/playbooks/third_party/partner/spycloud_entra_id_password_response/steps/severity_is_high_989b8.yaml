name: Condition
description: Evaluate whether the case carries a severity 30 (SpyCloud "Session Cookie
    Theft") exposure. The "Yes" branch revokes the user's active Entra ID sessions;
    below severity 30 the playbook skips ahead to the remediation check. This step is
    a join reached from all three ways the password path can end - the reset audit step
    (a reset was attempted), the "No" branch of "Any Passwords Remain?" (nothing to
    reset), and the "No" branch of "Reset Still Needed?" (already rotated) - so the
    session check always runs regardless of the password outcome.
