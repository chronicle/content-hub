# UNVERIFIED: "lastPasswordChangeDateTime" is the Microsoft Graph user field carrying
# the last password change, and "EntityResult." is the prefix the Azure AD enrichment
# results use in the Content Hub's own Azure AD playbook. Confirm the placeholder
# resolves against the real JSON result of Enrich User in the UI.
# "Email" scopes the comparison to the identity being reset, so a newer exposure for a
# different user on the same case cannot block this user's skip.
-   step_id: 393c8491-15dd-4b6e-907d-36bee2769bbd
    playbook_id: e3322e99-6ba6-4317-9b64-cc14ffa48dc6
    name: ScriptParametersEntityFields
    value: '{"Last Password Reset Time":"[Get User Details.JsonResult|
        \"EntityResult.lastPasswordChangeDateTime\"]","Email":"[Filter Passwords By
        Policy.JsonResult| \"emails_with_remaining_passwords\" |
        getByIndex(\"0\")]","Password Exposures Only":"true"}'
