name: SpyCloudEnterprise_Check Password Rotation
description: Compare the account's last Entra ID password change against the publish
    date of the case's SpyCloud password exposures. The script result value is 1 when
    the exposed credential may still be live and 0 when the user already changed their
    password after the newest exposure was published. A missing or unusable timestamp
    reports 1, so an exposure that cannot be proven stale is still remediated.
