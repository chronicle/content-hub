# "lastPasswordChangeDateTime" is the Microsoft Graph user field carrying the last
# password change. Enrich User is entity-scoped, so its JsonResult is a list of
# {Entity, EntityResult} pairs and the field selector yields a list, not a scalar.
# Check Password Rotation feeds this straight into parse_timestamp, which cannot
# read a list and falls back to RESET_NEEDED - so getByIndex("0") is required to
# narrow it to the single timestamp. Note the pipeline order: the field selector
# comes first and getByIndex last, matching the Email binding below and every other
# getByIndex use in content/playbooks. The "EntityResult." prefix matches how the
# Content Hub's own azure_ad_enrichment playbook reads this same Enrich User action
# (| "EntityResult.userPrincipalName").
# "Email" scopes the comparison to the identity being reset, so a newer exposure for a
# different user on the same case cannot block this user's skip.
-   step_id: 393c8491-15dd-4b6e-907d-36bee2769bbd
    playbook_id: e3322e99-6ba6-4317-9b64-cc14ffa48dc6
    name: ScriptParametersEntityFields
    value: '{"Last Password Reset Time":"[Get User Details.JsonResult|
        \"EntityResult.lastPasswordChangeDateTime\" | getByIndex(\"0\")]","Email":"[Filter
        Passwords By Policy.JsonResult| \"emails_with_remaining_passwords\" |
        getByIndex(\"0\")]","Password Exposures Only":"true"}'
-   step_id: 393c8491-15dd-4b6e-907d-36bee2769bbd
    playbook_id: e3322e99-6ba6-4317-9b64-cc14ffa48dc6
    name: SelectedScopeName
