# Branches are evaluated in order and the first match wins. LogicalOperator 1 is OR.
# "Remediation Failed" comes first: if either remediation ran and returned "false"
# the case stays open, even when the other one succeeded, so a partial remediation
# never auto-closes. "Yes" then closes the case when at least one remediation
# returned "true". A step that did not run on this path resolves to an empty value,
# which matches neither "true" nor "false", so a skipped remediation affects neither
# branch.
