name: Condition
description: Evaluate whether either remediation actually succeeded - the Entra ID
    password reset or the Entra ID session revoke. This step is a join - it is reached
    both from the session-revoke audit step (sessions were revoked) and directly from
    the "No" branch of "Severity 30 Present?" (no session cookie theft exposure), so it
    runs on every path through the playbook. The "Yes" branch closes the case; the "No"
    branch ends the playbook and leaves the case open for an analyst.
