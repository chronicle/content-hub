name: SpyCloud Enterprise - Entra ID Password Response
description: This playbook runs on SpyCloud Enterprise cases that carry a user's
  exposed credentials. It reads the case's credential table and the password policy
  configured on the "Filter Passwords By Policy" step (minimum length and symbol
  requirement), drops any exposed passwords that do not match the policy, and — when
  at least one policy-conforming password remains — checks whether the user has already
  changed their Microsoft Entra ID password since the exposure was published, and
  resets it only if they have not. The session check runs independently of the password
  outcome — when the case includes a severity 30 (session cookie theft) exposure, the
  user's active Entra ID sessions (refresh tokens) are revoked whether or not a
  password was reset. If either remediation succeeds the playbook closes the case; if
  neither does, the case is left open for an analyst. Every remediation action is
  recorded to the alert context for audit.
