-   description: Initial release of the SpyCloud Enterprise Entra ID Password Response playbook. Filters the case's exposed passwords against a configurable password policy, skips the reset when the user has already changed their Entra ID password since the exposure was published, resets the affected user's Microsoft Entra ID password when a policy-conforming exposure remains and is still live, and revokes the user's active Entra ID sessions when a severity 30 (session cookie theft) exposure is present - the session check runs whether or not a password was reset. Closes the case when either remediation succeeds, and records all remediation actions to the alert context for audit.
