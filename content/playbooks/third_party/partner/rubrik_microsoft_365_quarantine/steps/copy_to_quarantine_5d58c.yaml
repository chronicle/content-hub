name: AzureApi_Execute HTTP Request
description: Asks Graph to copy the file into the quarantine folder server-side, so
    its content never passes through SOAR (no size ceiling, no corruption, nothing
    stored on the case). Graph answers 202 with a monitor URL in the Location header.
    A name clash is renamed, never overwritten.
