name: AzureApi_Execute HTTP Request
description: Resolves the quarantine DESTINATION from the share link supplied in the
    DSPM Input Block, which the URL Encoder pack base64url-encodes via URL Encoder.encode_url().
    Restored to the originally shipped /shares form after the PM chose an absolute
    destination over a folder created in the file's own drive. $select=id is deliberately
    NOT set -- Direct Upload needs parentReference.driveId from this same response
    to target the destination drive.
