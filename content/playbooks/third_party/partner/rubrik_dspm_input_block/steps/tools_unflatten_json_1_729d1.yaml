name: Tools_Unflatten JSON
description: Builds quarantine_path from the share link the admin pastes, base64url-encoding
    it with the URL Encoder pack so the M365 quarantine block can pass it straight
    to GET /shares/{token}/driveItem. Encoding happens HERE and nowhere else -- the
    shipped playbook also applied encode_url() again at the Classification to OneDrive
    call site, which double-encoded that branch and would have broken it.
