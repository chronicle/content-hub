name: MicrosoftDefenderATP_List Machines
description: 'Looks up the Defender-registered machine matching the violation''s reported
    physicalHost, which RSC returns either as a DNS name or as an IP address depending
    on how the host was registered. Whichever form it takes populates the matching
    filter; the other is empty and therefore ignored. NOTE: the result is not checked
    for how many machines it matched -- see N2 in the review; both forms can legitimately
    match several records in a Defender tenant.'
