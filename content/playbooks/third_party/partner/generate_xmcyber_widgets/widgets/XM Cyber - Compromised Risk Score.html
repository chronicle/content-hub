<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XM Cyber - Compromised Risk Score</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.2/echarts.min.js"
      integrity="sha512-VdqgeoWrVJcsDXFlQEKqE5MyhaIgB9yXUVaiUa8DR2J4Lr1uWcFm+ZH/YnzV5WqgKf4GPyHQ64vVLgzqGIchyw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Lexend", sans-serif !important;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      body {
        margin: 20px;
        text-align: center;
        background-color: #344262 !important;
      }

      .chart-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }
      .chart {
        min-width: 450px;
      }
    </style>
  </head>

  <body>
    <div class="chart-container">
      <div
        id="compromisedRiskScoreChart"
        style="width: 50%; height: 450px"
        class="chart"
      ></div>
    </div>
    <script>
      const entitiesData = [XMCyber_Get Event Data JSON_1.JsonResult];

      function createBarChart(id, data) {
        let chart = echarts.init(document.getElementById(id), "dark", {
          renderer: "svg",
        });

        const sorted = Object.entries(data).sort((a, b) => a[1] - b[1]);
        const categories = sorted.map((item) => item[0]);
        const values = sorted.map((item) => item[1]);

        let option = {
          title: {
            text: "No Compromised Risk Score data found",
            left: "center",
            top: "center",
            show: categories.length === 0,
          },
          tooltip: { trigger: "axis" },
          yAxis: {
            show: categories.length > 0,
            type: "category",
            data: categories,
            axisLabel: {
              overflow: "truncate", // Automatically truncates long labels
              width: 100,
            },
          },
          xAxis: { type: "value", minInterval: 1, show: values.length > 0 },
          series: [{ type: "bar", data: values }],
          grid: {
            left: 130, // Adjust left margin to accommodate long Y-axis labels
          },
        };

        chart.setOption(option);
      }

      function getDataForNumbers(field) {
        // Iterate through the entities
        return Object.entries(entitiesData).reduce(
          (accumulator, [entityID, entityData]) => {
            // Fetch field value from each entity and use a global accumulator
            if (!entityData[field]) return accumulator;

            accumulator[entityID] = entityData[field] || 0;
            return accumulator;
          },
          {}
        );
      }

      createBarChart(
        "compromisedRiskScoreChart",
        getDataForNumbers("Compromise Risk Score")
      );
    </script>
  </body>
</html>
