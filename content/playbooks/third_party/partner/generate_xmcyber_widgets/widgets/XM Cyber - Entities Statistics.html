<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XM Cyber - Statistics</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.2/echarts.min.js"
      integrity="sha512-VdqgeoWrVJcsDXFlQEKqE5MyhaIgB9yXUVaiUa8DR2J4Lr1uWcFm+ZH/YnzV5WqgKf4GPyHQ64vVLgzqGIchyw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Lexend", sans-serif !important;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      body {
        margin: 20px;
        text-align: center;
        background-color: #344262 !important;
      }

      .card {
        padding: 20px 0;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: -webkit-fill-available;
        background-color: #100c2a; /* #26334f */
        color: white;
      }

      .card-body {
        padding: 0;
      }

      .card h2 {
        margin: 0;
        color: white;
        font-size: 1.2em;
      }

      .card p {
        font-size: 3.6em;
        font-weight: 500;
        margin: 0;
        color: #e91e63; /* #007bff # */
      }
      @media (min-width: 1200px) {
        .fs-1 {
          font-size: 3.5rem !important;
        }
      }
      @media (max-width: 992px) {
        /* Medium screens */
        .fs-1 {
          font-size: 2.5rem !important;
        }
      }
      @media (max-width: 768px) {
        /* Small screens */
        .fs-1 {
          font-size: 1.5rem !important;
        }
      }
      @media (max-width: 576px) {
        /* Extra small screens */
        .fs-1 {
          font-size: 1rem !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-3 col-sm-3 mb-3">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="fs-4 fs-md-5 fs-sm-6">MFA Disabled Users</h5>
              <p class="fs-1" id="mfaCount"></p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-sm-3 mb-3">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="fs-4 fs-md-5 fs-sm-6">Critical Assets</h5>
              <p class="fs-1" id="criticalAssetsCount"></p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-sm-3 mb-3">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="fs-4 fs-md-5 fs-sm-6">Privileged Users</h5>
              <p class="fs-1" id="privilegedUsersCount"></p>
            </div>
          </div>
        </div>
        <div class="col-md-3 col-sm-3 mb-3">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="fs-4 fs-md-5 fs-sm-6">Enabled Accounts</h5>
              <p class="fs-1" id="enabledAccountsCount"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.min.js"
      integrity="sha512-3dZ9wIrMMij8rOH7X3kLfXAzwtcHpuYpEgQg1OA4QAob1e81H8ntUQmQm3pBudqIoySO5j0tHN4ENzA6+n2r4w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      const entitiesData = [XMCyber_Get Event Data JSON_1.JsonResult];

      function countUsers(field) {
        return Object.values(entitiesData).filter((entity) => entity[field])
          .length;
      }

      document.getElementById("mfaCount").textContent =
        countUsers("User without MFA");
      document.getElementById("privilegedUsersCount").textContent =
        countUsers("Highly Privileged");
      document.getElementById("enabledAccountsCount").textContent =
        countUsers("Enabled");
      document.getElementById("criticalAssetsCount").textContent =
        countUsers("Is Critical Asset");
    </script>
  </body>
</html>
