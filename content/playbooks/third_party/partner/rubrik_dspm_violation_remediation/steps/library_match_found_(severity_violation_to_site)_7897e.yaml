name: Condition
description: 'Routes to ''No Match'' (Record Unmatched Library) if the extracted leading
    segment didn''t resolve to a real library on this site; otherwise proceeds to
    Strip Library Prefix from File Path. Confirmed live (case 2827) that a stray direct
    edge to the loop''s End step, left over from this branch''s original construction,
    stalls the workflow engine -- removed; Flag Unmatched Library already reconverges
    to End on its own. Rebuilt (case 2845) after this gate was found never to have
    taken its No Match branch on any run: it tested the JSONPath array [Match Drive
    For File.JsonResult| "matches"], and an empty array stringifies to "[]" for the
    condition evaluator, so no emptiness test can ever see it as blank. Proven across
    three live re-runs -- Is Empty returned false and Is Not Empty returned true on
    the same genuinely empty {"matches": []}, so the operators agree and the value,
    not the operator, was the problem. The gate now tests Extract Drive Id''s Regex
    ScriptResult, which is genuinely empty on no-match, matching the proven [<Regex>.ScriptResult]
    + Not Empty shape used by the Already Under Quarantine Path? gates. Extract Drive
    Id was moved ahead of this gate to make that possible; it reads only Resolve Drive
    (Site) and Extract Leading Segment, never Strip Library Prefix, so the reorder
    breaks no data dependency. Match Drive For File, retained after that as a no-op
    with no consumer, was removed on 2026-09-23.'
