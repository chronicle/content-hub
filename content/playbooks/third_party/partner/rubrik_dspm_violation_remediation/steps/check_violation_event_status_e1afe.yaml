name: Condition
description: 'Only an OPEN violation is processed. IN_PROGRESS is excluded deliberately:
    this playbook sets In Progress as its first write-back, and RSC raises a fresh
    alert for that change - admitting IN_PROGRESS re-ran the playbook on its own update.
    A violation left In Progress by a run with quarantine failures is therefore not
    retried automatically; the failure summary comment on its case says why.'
