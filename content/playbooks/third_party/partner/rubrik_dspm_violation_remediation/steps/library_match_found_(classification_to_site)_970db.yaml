name: Condition
description: 'This condition determines the progress of the playbook. Conditions are
    built based on cases data (cases, alerts, vents, entities and environment properties)
    as-well as data that comes back from previous playbook steps. Rebuilt (case 2941)
    to match the Severity Violation to Site gate. This condition previously tested
    the JSONPath array [Match Drive For File.JsonResult| "matches" | first(1)]; an
    empty array stringifies to "[]" for the condition evaluator, so no emptiness test
    can ever see it as blank and the fall-through branch never fired. Proven on the
    Severity branch across three live rounds -- Is Empty returned false and Is Not
    Empty returned true on the same genuinely empty {"matches": []} -- and fixed there
    by testing Extract Drive Id''s Regex ScriptResult instead, which is genuinely
    empty on no-match. Extract Drive Id (Classification to Site) was moved ahead of
    this gate to make that possible; it reads only Resolve Drive Classification and
    Extract Leading Segment, never String Functions_1, so the reorder breaks no data
    dependency. Match Drive For File, retained after that as a no-op with no consumer,
    was removed on 2026-09-23. Branch 2 relabelled from ''Branch'' to ''No Match''.'
