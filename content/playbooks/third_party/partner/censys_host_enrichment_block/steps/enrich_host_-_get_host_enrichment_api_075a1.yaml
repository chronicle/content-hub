name: Censys_Enrich Host - Get Host Enrichment API
description: "This action retrieves focused enrichment data for a host (IP address)\n\
    \    using the Censys get host enrichment API. This API is purpose-built to help\n\
    \    security teams operationalize external internet data and assess risk for\
    \ an\n    IP by providing a curated, fixed subset of host data designed specifically\
    \ for\n    high-volume, automated lookups in SOC environments. This action differs\
    \ from\n    the Enrich Host - Get Host API action in that it uses the get host\
    \ enrichment\n    API instead of the get host API. Learn more at https://docs.censys.com/docs/host-enrichment."
