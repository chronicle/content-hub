name: Condition
description: >-
    Evaluates the result of the "Enrich Host - Get Host Enrichment API" step.
    Routes to Enrich Host - Get Host API when the Get Host Enrichment API step
    could not be used for this Censys instance: the get host enrichment API is
    disabled for the instance (completes with a false result), an account-level
    API error occurred (unauthorized, forbidden, feature not enabled or rate
    limited - the step fails and is configured with AutoSkipOnFailure so this
    condition still evaluates), or per-IP failures occurred with no host
    enriched. Hosts that Censys simply does not have (not found) do not
    trigger the fallback, since it would repeat the same lookup. Proceeds
    directly to the remaining enrichment steps otherwise.
