name: Condition
description: Evaluate whether the alert carries a SpyCloud source severity 30 ("Session
    Cookie Theft") exposure. The "Yes" branch clears the user's active Okta sessions;
    any other severity skips ahead to the remediation check. This step is a join
    reached from all three ways the password path can end - the reset audit step (a
    reset was attempted), the "No" branch of "Any Passwords Remain?" (nothing to
    reset), and the "No" branch of "Reset Still Needed?" (already rotated) - so the
    session check always runs regardless of the password outcome.
