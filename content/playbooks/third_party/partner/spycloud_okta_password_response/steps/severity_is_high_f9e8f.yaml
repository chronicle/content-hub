# This branch gates on the raw SpyCloud severity, not on the SOAR case priority.
# [Case.Priority] carries the normalized SOAR scale (low=40, medium=60, high=80,
# critical=100 - see SOAR_SEVERITY_MAP in spycloud_udm_converter.py), so any
# threshold around 30 is true for every exposure case. The connector preserves the
# original SpyCloud severity on each alert event as spycloud_source_severity
# (Parser.flatten_udm_event_for_alert), where 30 is Session Cookie Theft.
# SpyCloud only emits 2/5/20/25/30, so "Equal 30" is the exact gate - no
# greater-than-or-equal operator is needed.
