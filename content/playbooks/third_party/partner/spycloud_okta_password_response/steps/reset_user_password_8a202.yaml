name: Okta_Reset Password
description: Reset the affected user's Okta password by generating a one-time reset
    token (and emailing the user). Runs only when the "Reset Still Needed?" condition
    took the Yes branch, i.e. a policy-conforming exposed password remained after
    filtering and the account has not already been rotated since the exposure was
    published.
