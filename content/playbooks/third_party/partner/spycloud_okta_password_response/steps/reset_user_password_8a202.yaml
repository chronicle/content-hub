# The target login comes from the Filter Passwords By Policy JSON result rather than
# the case entity scope: the connector emits UDM events and creates no USER entities
# itself, so on a tenant whose ontology does not map the exposed identity to a User
# entity the action ran against an empty scope and reset nothing. "Send Email" issues
# the Okta reset email to the user.
# "Also Run On Scope" is false on purpose - with an explicit login supplied, leaving it
# true would reset (and email) the same user twice on tenants that DO map User entities.
# Turn it back on in the UI if you would rather drive this action off the entity scope,
# and blank out "User IDs Or Logins" if you do.
# NOTE: getByIndex("0") takes the first affected identity only. Cases carrying
# exposures for more than one identity need the entity scope (above) or a loop step.
-   step_id: 8a202275-5058-433a-8406-9cf25148dc48
    playbook_id: 7ef9edae-891c-4514-b062-e3e800355e32
    name: ScriptParametersEntityFields
    value: '{"User IDs Or Logins":"[Filter Passwords By Policy.JsonResult| \"emails_with_remaining_passwords\"
        | getByIndex(\"0\")]","Send Email":true,"Also Run On Scope":false}'
-   step_id: 8a202275-5058-433a-8406-9cf25148dc48
    playbook_id: 7ef9edae-891c-4514-b062-e3e800355e32
