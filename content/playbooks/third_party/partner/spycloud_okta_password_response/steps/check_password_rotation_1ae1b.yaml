# UNVERIFIED: "passwordChanged" is the Okta user object field carrying the last
# password change. Confirm the placeholder resolves against the real JSON result of
# Okta_Get User in the UI - if the action returns a list, this needs
# | getByIndex("0") the way the Filter Passwords By Policy bindings do.
# "Email" scopes the comparison to the identity being reset, so a newer exposure for
# a different user on the same case cannot block this user's skip.
-   step_id: 1ae1b74d-45fc-4135-870f-221856767e68
    playbook_id: 7ef9edae-891c-4514-b062-e3e800355e32
    name: ScriptParametersEntityFields
    value: '{"Last Password Reset Time":"[Get User Details.JsonResult| \"passwordChanged\"]","Email":"[Filter
        Passwords By Policy.JsonResult| \"emails_with_remaining_passwords\" |
        getByIndex(\"0\")]","Password Exposures Only":"true"}'
