name: Condition
description: Evaluate whether the remediations succeeded - the Okta password reset
    and the Okta session clear. This step is a join - it is reached both from the
    session audit step and directly from the "No" branch of "Severity 30 Present?" (no
    session cookie theft exposure), so it runs on every path through the playbook. If
    either remediation ran and failed, the "Remediation Failed" branch ends the playbook
    and leaves the case open for an analyst. Otherwise the "Yes" branch closes the case
    when at least one remediation succeeded, and the "No" branch leaves it open.
