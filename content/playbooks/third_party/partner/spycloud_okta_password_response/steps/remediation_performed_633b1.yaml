name: Condition
description: Evaluate whether either remediation actually succeeded - the Okta password
    reset or the Okta session clear. This step is a join - it is reached both from the
    session-clear audit step (sessions were cleared) and directly from the "No" branch
    of "Severity 30 Present?" (no session cookie theft exposure), so it runs on every
    path through the playbook. The "Yes" branch closes the case; the "No" branch ends
    the playbook and leaves the case open for an analyst.
