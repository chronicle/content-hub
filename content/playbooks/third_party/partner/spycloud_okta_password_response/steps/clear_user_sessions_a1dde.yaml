# Binds to "all_exposed_emails", NOT "emails_with_remaining_passwords". This step is
# reached whenever a severity 30 exposure is present, including on a case whose only
# exposure is the session cookie theft itself - and such a case has no exposed
# password, so "emails_with_remaining_passwords" is an empty list and the action would
# run with no identifier. "all_exposed_emails" lists every exposed identity on the
# case regardless of the password outcome, which is what this path needs.
# The identity comes from the JSON result instead of the case entity scope (see the
# comment on the Reset User Password step); "Also Run On Scope" is false to match.
-   step_id: a1dde574-9f80-420b-922c-ce6fcf48dfe6
    playbook_id: 7ef9edae-891c-4514-b062-e3e800355e32
    name: ScriptParametersEntityFields
    value: '{"User IDs Or Logins":"[Filter Passwords By Policy.JsonResult| \"all_exposed_emails\"
        | getByIndex(\"0\")]","Also Run On Scope":false}'
-   step_id: a1dde574-9f80-420b-922c-ce6fcf48dfe6
    playbook_id: 7ef9edae-891c-4514-b062-e3e800355e32
    name: SelectedScopeName
    value: All entities
