name: Azure AD Add User to a Group
description: The Azure AD Add User to a Group block automates the process of adding
    a user to an Azure Active Directory (Microsoft Entra ID) group. The block validates
    the provided user and group information, verifies existing membership, adds the
    user to the specified group if not already present, confirms successful assignment,
    and stores the results for auditing and reporting purposes.
