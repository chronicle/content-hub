    name: ScriptParametersEntityFields
    value: '{"Automatic Opt-in":true,"Prompt":"You are a Security Operations Center
        (SOC) Analyst Assistant.\n\nAnalyze [Get Similar Cases.JsonResult] to determine
        the total number of similar cases, the number of cases with a Case Closure
        Detail (Root Cause) of \"False Positive\", and the percentage of False Positive
        cases over the total. Also identify the most common root cause if it is not
        False Positive.\n\nReview [Get Case Data.JsonResult] and explain, using only
        the evidence in the JSON, why the current case should or should not be considered
        a False Positive.\n\nBase your verdict on both the historical similar cases
        and the current case evidence. If False Positive is the most common root cause
        and the evidence supports it, the verdict must be \"False Positive\". Otherwise,
        the verdict must be \"Others (Root Cause: <Most Common Root Cause>)\".\n\nThe
        verdict must be the last line of the response and must be in one of the following
        formats only:\n\nVerdict: False Positive\nVerdict: Others (Root Cause: <Most
        Common Root Cause>)"}'
