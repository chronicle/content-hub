    name: ScriptParametersEntityFields
    value: "{\"JSON Object\":\"{}\",\"Jinja\":\"{# \u2500\u2500 IP address \u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500 #}\\r\\n{% set ip_address_raw = \\\"[Alert.ip_address_result]\\\
        \" %}\\r\\n{% set ns = namespace(verdict=-1) %}\\r\\n{% for item in ip_address_raw.split(\\\
        \",\\\") %}\\r\\n  {% set val = item.strip() | int(-1) %}\\r\\n  {% if val\
        \ > ns.verdict %}{% set ns.verdict = val %}{% endif %}\\r\\n{% endfor %}\\\
        r\\n{% set ip_address_verdict = ns.verdict %}\\r\\n\\r\\n{% if ip_address_verdict\
        \ == -1 %}\\r\\n  {% set ip_address_verdict_label = \\\"INCONCLUSIVE\\\" %}\\\
        r\\n  {% set ip_address_verdict_color = \\\"#666666\\\" %}\\r\\n{% elif ip_address_verdict\
        \ == 0 %}\\r\\n  {% set ip_address_verdict_label = \\\"LEGITIMATE - NO CONFIDENCE\\\
        \" %}\\r\\n  {% set ip_address_verdict_color = \\\"#1a7a1a\\\" %}\\r\\n{%\
        \ elif ip_address_verdict <= 3 %}\\r\\n  {% set ip_address_verdict_label =\
        \ \\\"SUSPICIOUS - LOW CONFIDENCE\\\" %}\\r\\n  {% set ip_address_verdict_color\
        \ = \\\"#b8860b\\\" %}\\r\\n{% elif ip_address_verdict <= 10 %}\\r\\n  {%\
        \ set ip_address_verdict_label = \\\"LIKELY MALICIOUS - MEDIUM CONFIDENCE\\\
        \" %}\\r\\n  {% set ip_address_verdict_color = \\\"#cc5500\\\" %}\\r\\n{%\
        \ elif ip_address_verdict <= 20 %}\\r\\n  {% set ip_address_verdict_label\
        \ = \\\"MALICIOUS - HIGH CONFIDENCE\\\" %}\\r\\n  {% set ip_address_verdict_color\
        \ = \\\"#cc0000\\\" %}\\r\\n{% else %}\\r\\n  {% set ip_address_verdict_label\
        \ = \\\"CONFIRMED MALICIOUS - VERY HIGH CONFIDENCE\\\" %}\\r\\n  {% set ip_address_verdict_color\
        \ = \\\"#8b0000\\\" %}\\r\\n{% endif %}\\r\\n\\r\\n{# \u2500\u2500 URL \u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500 #}\\r\\n{% set url_raw = \\\"[Alert.url_result]\\\" %}\\\
        r\\n{% set ns = namespace(verdict=-1) %}\\r\\n{% for item in url_raw.split(\\\
        \",\\\") %}\\r\\n  {% set val = item.strip() | int(-1) %}\\r\\n  {% if val\
        \ > ns.verdict %}{% set ns.verdict = val %}{% endif %}\\r\\n{% endfor %}\\\
        r\\n{% set url_verdict = ns.verdict %}\\r\\n\\r\\n{% if url_verdict == -1\
        \ %}\\r\\n  {% set url_verdict_label = \\\"INCONCLUSIVE\\\" %}\\r\\n  {% set\
        \ url_verdict_color = \\\"#666666\\\" %}\\r\\n{% elif url_verdict == 0 %}\\\
        r\\n  {% set url_verdict_label = \\\"LEGITIMATE - NO CONFIDENCE\\\" %}\\r\\\
        n  {% set url_verdict_color = \\\"#1a7a1a\\\" %}\\r\\n{% elif url_verdict\
        \ <= 4 %}\\r\\n  {% set url_verdict_label = \\\"SUSPICIOUS - LOW CONFIDENCE\\\
        \" %}\\r\\n  {% set url_verdict_color = \\\"#b8860b\\\" %}\\r\\n{% elif url_verdict\
        \ <= 12 %}\\r\\n  {% set url_verdict_label = \\\"LIKELY MALICIOUS - MEDIUM\
        \ CONFIDENCE\\\" %}\\r\\n  {% set url_verdict_color = \\\"#cc5500\\\" %}\\\
        r\\n{% elif url_verdict <= 25 %}\\r\\n  {% set url_verdict_label = \\\"MALICIOUS\
        \ - HIGH CONFIDENCE\\\" %}\\r\\n  {% set url_verdict_color = \\\"#cc0000\\\
        \" %}\\r\\n{% else %}\\r\\n  {% set url_verdict_label = \\\"CONFIRMED MALICIOUS\
        \ - VERY HIGH CONFIDENCE\\\" %}\\r\\n  {% set url_verdict_color = \\\"#8b0000\\\
        \" %}\\r\\n{% endif %}\\r\\n\\r\\n{# \u2500\u2500 Domain \u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500 #}\\r\\n{% set domain_raw = \\\"[Alert.domain_result]\\\" %}\\r\\n{%\
        \ set ns = namespace(verdict=-1) %}\\r\\n{% for item in domain_raw.split(\\\
        \",\\\") %}\\r\\n  {% set val = item.strip() | int(-1) %}\\r\\n  {% if val\
        \ > ns.verdict %}{% set ns.verdict = val %}{% endif %}\\r\\n{% endfor %}\\\
        r\\n{% set domain_verdict = ns.verdict %}\\r\\n\\r\\n{% if domain_verdict\
        \ == -1 %}\\r\\n  {% set domain_verdict_label = \\\"INCONCLUSIVE\\\" %}\\\
        r\\n  {% set domain_verdict_color = \\\"#666666\\\" %}\\r\\n{% elif domain_verdict\
        \ == 0 %}\\r\\n  {% set domain_verdict_label = \\\"LEGITIMATE - NO CONFIDENCE\\\
        \" %}\\r\\n  {% set domain_verdict_color = \\\"#1a7a1a\\\" %}\\r\\n{% elif\
        \ domain_verdict <= 3 %}\\r\\n  {% set domain_verdict_label = \\\"SUSPICIOUS\
        \ - LOW CONFIDENCE\\\" %}\\r\\n  {% set domain_verdict_color = \\\"#b8860b\\\
        \" %}\\r\\n{% elif domain_verdict <= 10 %}\\r\\n  {% set domain_verdict_label\
        \ = \\\"LIKELY MALICIOUS - MEDIUM CONFIDENCE\\\" %}\\r\\n  {% set domain_verdict_color\
        \ = \\\"#cc5500\\\" %}\\r\\n{% elif domain_verdict <= 20 %}\\r\\n  {% set\
        \ domain_verdict_label = \\\"MALICIOUS - HIGH CONFIDENCE\\\" %}\\r\\n  {%\
        \ set domain_verdict_color = \\\"#cc0000\\\" %}\\r\\n{% else %}\\r\\n  {%\
        \ set domain_verdict_label = \\\"CONFIRMED MALICIOUS - VERY HIGH CONFIDENCE\\\
        \" %}\\r\\n  {% set domain_verdict_color = \\\"#8b0000\\\" %}\\r\\n{% endif\
        \ %}\\r\\n\\r\\n{# \u2500\u2500 Hash \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 #}\\r\\n{% set\
        \ hash_raw = \\\"[Alert.hash_result]\\\" %}\\r\\n{% set ns = namespace(verdict=-1)\
        \ %}\\r\\n{% for item in hash_raw.split(\\\",\\\") %}\\r\\n  {% set val =\
        \ item.strip() | int(-1) %}\\r\\n  {% if val > ns.verdict %}{% set ns.verdict\
        \ = val %}{% endif %}\\r\\n{% endfor %}\\r\\n{% set hash_verdict = ns.verdict\
        \ %}\\r\\n\\r\\n{% if hash_verdict == -1 %}\\r\\n  {% set hash_verdict_label\
        \ = \\\"INCONCLUSIVE\\\" %}\\r\\n  {% set hash_verdict_color = \\\"#666666\\\
        \" %}\\r\\n{% elif hash_verdict == 0 %}\\r\\n  {% set hash_verdict_label =\
        \ \\\"LEGITIMATE - NO CONFIDENCE\\\" %}\\r\\n  {% set hash_verdict_color =\
        \ \\\"#1a7a1a\\\" %}\\r\\n{% elif hash_verdict <= 5 %}\\r\\n  {% set hash_verdict_label\
        \ = \\\"SUSPICIOUS - LOW CONFIDENCE\\\" %}\\r\\n  {% set hash_verdict_color\
        \ = \\\"#b8860b\\\" %}\\r\\n{% elif hash_verdict <= 15 %}\\r\\n  {% set hash_verdict_label\
        \ = \\\"LIKELY MALICIOUS - MEDIUM CONFIDENCE\\\" %}\\r\\n  {% set hash_verdict_color\
        \ = \\\"#cc5500\\\" %}\\r\\n{% elif hash_verdict <= 30 %}\\r\\n  {% set hash_verdict_label\
        \ = \\\"MALICIOUS - HIGH CONFIDENCE\\\" %}\\r\\n  {% set hash_verdict_color\
        \ = \\\"#cc0000\\\" %}\\r\\n{% else %}\\r\\n  {% set hash_verdict_label =\
        \ \\\"CONFIRMED MALICIOUS - VERY HIGH CONFIDENCE\\\" %}\\r\\n  {% set hash_verdict_color\
        \ = \\\"#8b0000\\\" %}\\r\\n{% endif %}\\r\\n\\r\\n\\r\\n{# \u2500\u2500 Overall\
        \ Verdict \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500 #}\\r\\n{% set severity_rank = {\\r\\n  \\\"CONFIRMED MALICIOUS\
        \ - VERY HIGH CONFIDENCE\\\": 5,\\r\\n  \\\"MALICIOUS - HIGH CONFIDENCE\\\"\
        : 4,\\r\\n  \\\"LIKELY MALICIOUS - MEDIUM CONFIDENCE\\\": 3,\\r\\n  \\\"SUSPICIOUS\
        \ - LOW CONFIDENCE\\\": 2,\\r\\n  \\\"LEGITIMATE - NO CONFIDENCE\\\": 1,\\\
        r\\n  \\\"INCONCLUSIVE\\\": 0\\r\\n} %}\\r\\n\\r\\n{% set all_labels = [ip_address_verdict_label,\
        \ url_verdict_label, domain_verdict_label, hash_verdict_label] %}\\r\\n\\\
        r\\n{% set ns = namespace(overall_verdict_label=\\\"INCONCLUSIVE\\\") %}\\\
        r\\n{% for label in all_labels %}\\r\\n  {% if severity_rank[label] > severity_rank[ns.overall_verdict_label]\
        \ %}\\r\\n    {% set ns.overall_verdict_label = label %}\\r\\n  {% endif %}\\\
        r\\n{% endfor %}\\r\\n{% set overall_verdict_label = ns.overall_verdict_label\
        \ %}\\r\\n\\r\\n{% if overall_verdict_label == \\\"LEGITIMATE - NO CONFIDENCE\\\
        \" %}\\r\\n  {% set overall_verdict_color = \\\"#1a7a1a\\\" %}\\r\\n{% elif\
        \ overall_verdict_label == \\\"SUSPICIOUS - LOW CONFIDENCE\\\" %}\\r\\n  {%\
        \ set overall_verdict_color = \\\"#b8860b\\\" %}\\r\\n{% elif overall_verdict_label\
        \ == \\\"LIKELY MALICIOUS - MEDIUM CONFIDENCE\\\" %}\\r\\n  {% set overall_verdict_color\
        \ = \\\"#cc5500\\\" %}\\r\\n{% elif overall_verdict_label == \\\"MALICIOUS\
        \ - HIGH CONFIDENCE\\\" %}\\r\\n  {% set overall_verdict_color = \\\"#cc0000\\\
        \" %}\\r\\n{% elif overall_verdict_label == \\\"CONFIRMED MALICIOUS - VERY\
        \ HIGH CONFIDENCE\\\" %}\\r\\n  {% set overall_verdict_color = \\\"#8b0000\\\
        \" %}\\r\\n{% else %}\\r\\n  {% set overall_verdict_color = \\\"#666666\\\"\
        \ %}\\r\\n{% endif %}\\r\\n\\r\\n\\r\\n{{ overall_verdict_label }}\",\"Include\
        \ Case Data\":false,\"Template\":\"{\\\"Content\\\":\\\"\\\",\\\"ContentTemplateName\\\
        \":\\\"\\\",\\\"HtmlTemplateName\\\":\\\"\\\"}\"}"
