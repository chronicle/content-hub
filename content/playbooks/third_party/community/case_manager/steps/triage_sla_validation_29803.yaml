name: SLA Manager
description: This block calculates and applies the appropriate case SLA status based
    on the computed Breach and Critical SLA values. The block evaluates whether a
    case is in a Good, Critical, or Breached state, updates the case SLA accordingly,
    and stores the active SLA type and priority in case context for tracking and reporting.
