name: Credential Leakage - User Login History
description: The block retrieves and analyzes the login history of potential leaked
    users using UDM queries. It collects authentication events, including login timestamps,
    source IP addresses, locations, and login outcomes, to identify suspicious activity.
    Extracted IP addresses are saved for Google Threat Intelligence enrichment to
    support credential leakage investigations.
