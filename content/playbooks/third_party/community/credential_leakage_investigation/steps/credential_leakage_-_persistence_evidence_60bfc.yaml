name: Credential Leakage - Persistence Evidence
description: The block searches for persistence-related activity associated with potential
    leaked user accounts using UDM queries. It reviews Windows Service installation
    events (Event ID 4697 and 7045) to identify newly installed services that may
    indicate unauthorized persistence mechanisms. The findings provide additional
    context to support credential leakage investigations and risk assessment.
