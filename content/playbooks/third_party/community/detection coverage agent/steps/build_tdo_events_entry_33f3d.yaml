        set rpc_err = rd.get(''error'') -%}\n{%- set err = '''' -%}\n{%- if res.get(''isError'')
        and content and (content | first) is mapping -%}{%- set err = (content | first).get(''text'',
        '''') -%}\n{%- elif rpc_err is mapping -%}{%- set err = rpc_err.get(''message'',
        '''') -%}\n{%- elif rpc_err -%}{%- set err = rpc_err | string -%}{%- endif
        -%}\n{%- if not err and not same -%}{%- set err = ''generate_synthetic_events
        failed or returned no response for this TDO'' -%}\n{%- elif not err and not
        udms -%}{%- set err = ''generate_synthetic_events returned 0 synthetic events''
        -%}{%- endif -%}\n{%- if udms -%}\n{{ ({''threatDetectionOpportunityId'':
        ''[Loop.Item]'', ''udmsJson'': udms} | tojson) }}\n{%- else -%}\n{{ ({''threatDetectionOpportunityId'':
        ''[Loop.Item]'', ''udmsJson'': [], ''error'': (err | string)[:400]} | tojson)
        }}\n{%- endif -%}","Include Case Data":false,"Template":"{\"Content\":\"\",\"ContentTemplateName\":\"\",\"HtmlTemplateName\":\"\"}"}'
