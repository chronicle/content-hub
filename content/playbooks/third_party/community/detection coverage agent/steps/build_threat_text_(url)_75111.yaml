        total_p = d.h.count(''</p>'') -%}\n{%- set art = d.h.split(''<article'', 1)[1].split(''>'',
        1)[-1].rsplit(''</article>'', 1)[0] if ''<article'' in d.h else '''' -%}\n{%-
        set mn = d.h.split(''<main'', 1)[1].split(''>'', 1)[-1].rsplit(''</main>'',
        1)[0] if ''<main'' in d.h else '''' -%}\n{%- if art and art.count(''</p>'')
        * 2 >= total_p -%}{%- set d.h = art -%}\n{%- elif mn and mn.count(''</p>'')
        * 2 >= total_p -%}{%- set d.h = mn -%}{%- endif -%}\n{%- for tag in [''script'',
        ''style'', ''noscript'', ''svg'', ''nav'', ''header'', ''footer'', ''aside'',
        ''form'', ''button'', ''iframe'', ''template'', ''select''] -%}\n{%- set parts
        = d.h.split(''<'' ~ tag) -%}\n{%- set ns = namespace(out=parts[0]) -%}\n{%-
        for p in parts[1:] -%}{%- set q = p.split(''</'' ~ tag ~ ''>'', 1) -%}{%-
        set ns.out = ns.out ~ (q[1] if q | length > 1 else '''') -%}{%- endfor -%}\n{%-
        set d.h = ns.out -%}\n{%- endfor -%}\n{%- set parts = d.h.split(''<pre'')
        -%}\n{%- set ns = namespace(out=parts[0]) -%}\n{%- for p in parts[1:] -%}{%-
        set q = p.split(''</pre>'', 1) -%}{%- set ns.out = ns.out ~ ''<pre'' ~ (q[0]
        | replace(''\\n'', SEP)) ~ ((''</pre>'' ~ q[1]) if q | length > 1 else '''')
        -%}{%- endfor -%}\n{%- set d.h = ns.out | replace(''<li>'', SEP ~ ''- <li>'')
        | replace(''<li '', SEP ~ ''- <li '') | replace(''</td>'', '' | </td>'') |
        replace(''</th>'', '' | </th>'') -%}\n{%- for t in [''</p>'', ''</div>'',
        ''</li>'', ''</h1>'', ''</h2>'', ''</h3>'', ''</h4>'', ''</h5>'', ''</h6>'',
        ''<br>'', ''<br/>'', ''<br />'', ''</tr>'', ''</pre>'', ''</blockquote>'',
        ''</table>'', ''</ul>'', ''</ol>'', ''</section>'', ''</figcaption>'', ''</dt>'',
        ''</dd>''] -%}\n{%- set d.h = d.h | replace(t, t ~ SEP) -%}\n{%- endfor -%}\n{%-
        set ns = namespace(lines=[]) -%}\n{%- for ln in d.h.split(SEP) -%}{%- set
        c = ln | striptags | trim -%}{%- if c and c not in [''-'', ''|'', ''- |'']
        -%}{%- set ns.lines = ns.lines + [c] -%}{%- endif -%}{%- endfor -%}\n{%- set
