filter {
  mutate {
    replace => {
      "sourcetype" => ""
      "recordid" => ""
      "file_md5" => ""
      "file_sha256" => ""
      "filetype" => ""
      "verdict" => ""
      "threatname" => ""
      "mitre_tactics" => ""
      "mitre_tekniks" => ""
      "event_time" => ""
      "analysis_time" => ""
      "children_md5" => ""
      "security_result" => ""
    }
  }
  mutate {
    gsub => ["message", '\\"event\\"', '\"event_data\"']
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_error"
  }
  if [sourcetype] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{sourcetype}"
      }
      on_error => "no_sourcetype"
    }
  }
  mutate {
    replace => {
      "recordid" => "%{event_data.recordid}"
    }
    on_error => "no_recordid"
  }
  if [recordid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{recordid}"
      }
      on_error => "no_recordid_found"
    }
  }
  mutate {
    replace => {
      "file_md5" => "%{event_data.file_md5}"
    }
    on_error => "no_file_md5"
  }
  if [file_md5] =~ "^(.){1,255}$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.md5" => "%{file_md5}"
      }
      on_error => "file_md5_not_found"
    }
  }
  mutate {
    replace => {
      "file_sha256" => "%{event_data.file_sha256}"
    }
    on_error => "no_file_sha256"
  }
  if [file_sha256] =~ "^(.){1,255}$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{file_sha256}"
      }
      on_error => "file_sha256_not_found"
    }
  }
  mutate {
    replace => {
      "filetype" => "%{event_data.filetype}"
    }
    on_error => "no_filetype"
  }
  if [filetype] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.mime_type" => "%{filetype}"
      }
      on_error => "filetype_not_found"
    }
  }
  mutate {
    replace => {
      "verdict" => "%{event_data.verdict}"
    }
    on_error => "no_verdict"
  }
  if [verdict] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{verdict}"
      }
      on_error => "verdict_not_found"
    }
  }
  mutate {
    replace => {
      "threatname" => "%{event_data.threatname}"
    }
    on_error => "no_threatname"
  }
  if [threatname] not in ["", "None", "NA"] {
    mutate {
      replace => {
        "security_result.threat_name" => "%{threatname}"
      }
      on_error => "threatname_not_found"
    }
  }
  mutate {
    replace => {
      "mitre_tactics" => "%{event_data.mitre_tactics}"
    }
    on_error => "no_mitre_tactics"
  }
  if [mitre_tactics] not in ["", "None", "NA"] {
    mutate {
      split => {
        source => "mitre_tactics"
        separator => "|"
        target => "tactics_list"
        on_error => "mitre_tactics_split_error"
      }
    }
    for tactic in tactics_list {
      mutate {
        replace => {
          "tactic_id" => ""
          "tactic_name" => ""
          "technique_id" => ""
          "subtechnique_id" => ""
          "technique_name" => ""
        }
      }
      if [tactic] not in ["", "None", "NA"] {
        mutate {
          replace => {
            "tactic_id" => "%{tactic}"
          }
          on_error => "tactic_id_not_found"
        }
        mutate {
          gsub => ["tactic_id", "TAC", "TA0"]
        }
        mutate {
  replace => {
    "technique_data" => ""
    "tactics_data" => ""
  }
}

