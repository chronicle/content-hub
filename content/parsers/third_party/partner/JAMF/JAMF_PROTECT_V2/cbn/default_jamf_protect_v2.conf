  # load the logs fields from the default message field
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }

  # drop the message if it is not json
  if [_not_json] {
    drop {tag => "TAG_UNSUPPORTED"}
  }


  # Common Jamf Protect literals all alert events
  mutate { replace => { "event1.idm.read_only_udm.principal.platform" => "MAC" } on_error => "principal.platform_replace_failed" }
  mutate { replace => { "event1.idm.read_only_udm.metadata.log_type" => "JAMF" } on_error => "metadata.log_type_replace_failed" }
  # End common literals

  # Common mappings across all alert events
  # "thread.uuid" -> "udm.thread.uuid"
  if [thread][uuid] != "" {
    # Default to string value for additional fields
    mutate {
      replace => {
        "additional_field_thread_uuid.key" => "thread.uuid"
        "additional_field_thread_uuid.value.string_value" => "%{thread.uuid}"
      }
      on_error => "thread_uuid_additional_replace_failed"
    }
    if ![thread_uuid_additional_replace_failed] {
      mutate {
        merge => { "event1.idm.read_only_udm.additional.fields" => "additional_field_thread_uuid" }
        on_error => "thread_uuid_additional_merge_failed"
      }
    }
  } # End nullable check

  # "thread.thread_id" -> "udm.thread.thread_id"
  if [thread][thread_id] != "" {
    mutate { convert => { "thread.thread_id" => "string" } }
    # Default to string value for additional fields
    mutate {
      replace => {
        "additional_field_thread_thread_id.key" => "thread.thread_id"
        "additional_field_thread_thread_id.value.string_value" => "%{thread.thread_id}"
      }
      on_error => "thread_thread_id_additional_replace_failed"
    }
    if ![thread_thread_id_additional_replace_failed] {
      mutate {
        merge => { "event1.idm.read_only_udm.additional.fields" => "additional_field_thread_thread_id" }
        on_error => "thread_thread_id_additional_merge_failed"
      }
    }
  } # End nullable check

  # "action_type_name" -> "udm.action_type_name"
  if [action_type_name] != "" {
    # Default to string value for additional fields
    mutate {
      replace => {
        "additional_field_action_type_name.key" => "action_type_name"
        "additional_field_action_type_name.value.string_value" => "%{action_type_name}"
      }
      on_error => "action_type_name_additional_replace_failed"
    }
    if ![action_type_name_additional_replace_failed] {
      mutate {
        merge => { "event1.idm.read_only_udm.additional.fields" => "additional_field_action_type_name" }
        on_error => "action_type_name_additional_merge_failed"
      }
    }
  } # End nullable check

  # "event_type" -> "udm.event_type"
  if [event_type] != "" {
