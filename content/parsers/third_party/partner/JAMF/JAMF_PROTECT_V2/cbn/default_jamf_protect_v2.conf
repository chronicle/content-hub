      }
    }
  } # End nullable check

  # "time" -> "udm.metadata.event_timestamp"
  if [time] != "" {
    date { match => ["time", "yyyy-MM-dd HH:mm:ss.SSS", "RFC3339", "UNIX", "ISO8601", "UNIX_MS"] target => "event1.idm.read_only_udm.metadata.event_timestamp" on_error => "timestamp_not_set" }
  } # End nullable check

  # "metadata.product" -> "udm.metadata.product_name"
  if [metadata][product] != "" {
    mutate { replace => { "event1.idm.read_only_udm.metadata.product_name" => "%{metadata.product}" } on_error => "metadata_product_name_replace_failed" }
    mutate { uppercase => [ "event1.idm.read_only_udm.metadata.product_name" ] }
  } # End nullable check

  # "host.protectVersion" -> "udm.metadata.product_version"
  if [host][protectVersion] != "" {
    mutate { replace => { "event1.idm.read_only_udm.metadata.product_version" => "%{host.protectVersion}" } on_error => "metadata_product_version_replace_failed" }
