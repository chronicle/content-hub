    mutate { uppercase => [ "event1.idm.read_only_udm.metadata.vendor_name" ] }
  } # End nullable check

  # "host.hostname" -> "udm.principal.asset.hostname"
  if [host][hostname] != "" {
    mutate { replace => { "event1.idm.read_only_udm.principal.hostname" => "%{host.hostname}" } on_error => "principal.hostname_replace_failed" }
    mutate { replace => { "event1.idm.read_only_udm.principal.asset.hostname" => "%{host.hostname}" } on_error => "principal.asset.hostname_replace_failed" }
  } # End nullable check

  # "host.os" -> "udm.principal.platform_version"
  if [host][os] != "" {
    mutate { replace => { "event1.idm.read_only_udm.principal.platform_version" => "%{host.os}" } on_error => "principal_platform_version_replace_failed" }
  } # End nullable check

  # "host.provisioningUDID" -> "udm.principal.asset_id"
  if [host][provisioningUDID] != "" {
    mutate { replace => { "event1.idm.read_only_udm.principal.asset_id" => "JamfProtect:%{host.provisioningUDID}" } on_error => "principal.asset_id_replace_failed" }
    mutate { replace => { "event1.idm.read_only_udm.principal.asset.product_object_id" => "%{host.provisioningUDID}" } on_error => "principal.asset.product_object_id_replace_failed" }
  } # End nullable check

  # "host.serial" -> "udm.principal.asset.hardware.serial_number"
  if [host][serial] != "" {
    mutate { replace => { "_hardware" => "" } on_error => "hardware_replace_failed" }
    mutate { replace => { "_hardware.serial_number" => "%{host.serial}" } on_error => "hardware.serial_number_replace_failed" }
    mutate { merge => { "event1.idm.read_only_udm.principal.asset.hardware" => "_hardware" } on_error => "hardware_merge_failed" }
  } # End nullable check

  # "host.ips" -> "udm.principal.ip"
  if [host][ips] != "" {
    for ip in host.ips {
      grok {
        match => { "ip" => "%{IP:ip}" }
        overwrite => ["ip"]
        on_error => "ip_not_present"
      }
      if ![ip_not_present] {
        mutate { merge => {
          "event1.idm.read_only_udm.principal.ip" => "ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "ip"
        } on_error => "no_Ip" }
        if ![no_Ip] {
          mutate { replace => { "has_principal" => "true" } on_error => "has_principal_replace_failed" }
        }
      }
    } # end for
  } # End nullable check

  # "match.uuid" -> "udm.metadata.product_log_id"
  if [match][uuid] != "" {
    mutate { replace => { "event1.idm.read_only_udm.metadata.product_log_id" => "%{match.uuid}" } on_error => "metadata_product_log_id_replace_failed" }
  } # End nullable check

  # "match.severity" -> "udm.security_result.severity"
  if [match][severity] != "" {
    mutate { convert => { "match.severity" => "string" } }
    if [match][severity] == "0" {
      mutate { replace => { "security_result.severity" => "INFORMATIONAL" } on_error => "severity_replace_failed" }
      mutate { replace => { "security_result.severity_details" => "INFORMATIONAL" } on_error => "severity_details_replace_failed" }
    } else if [match][severity] == "1" {
      mutate { replace => { "security_result.severity" => "LOW" } on_error => "severity_replace_failed" }
      mutate { replace => { "security_result.severity_details" => "LOW" } on_error => "severity_details_replace_failed" }
    } else if [match][severity] == "2" {
      mutate { replace => { "security_result.severity" => "MEDIUM" } on_error => "severity_replace_failed" }
      mutate { replace => { "security_result.severity_details" => "MEDIUM" } on_error => "severity_details_replace_failed" }
    } else if [match][severity] == "3" {
      mutate { replace => { "security_result.severity" => "HIGH" } on_error => "severity_replace_failed" }
      mutate { replace => { "security_result.severity_details" => "HIGH" } on_error => "severity_details_replace_failed" }
    } else {
      mutate { replace => { "security_result.severity_details" => "%{match.severity}" } on_error => "severity_details_replace_failed" }
    }
  } # End nullable check

  # "match.version" -> "udm.security_result.rule_version"
  if [match][version] != "" {
    mutate { convert => { "match.version" => "string" } on_error => "security_result_rule_version_convert_failed" }
    mutate { replace => { "security_result.rule_version" => "%{match.version}" } on_error => "security_result_rule_version_replace_failed" }
  } # End nullable check

  # "match.quarantine_path" -> "udm.security_result.about.file.full_path"
  if [match][quarantine_path] != "" {
    mutate { replace => { "security_result.about.file.full_path" => "%{match.quarantine_path}" } on_error => "security_result_about_file_full_path_replace_failed" }
  } # End nullable check

