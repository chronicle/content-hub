#########################################################################################
# Product: Honeywell Cyber Proactive Defense
# Description: This is a parser to convert the Honeywell CPD syslog to UDM events.
# Category: Schema
# Supported Format: Syslog
# Last Updated: 2026-10-05
#########################################################################################


filter {

        # The Honeywell Cyber Proactive Defense log should be a valid Syslog
        # Tag the message as TAG_MALFORMED_MESSAGE if invalid event

    grok {

        match => {

         "message" => [

            "CEF:(?P<header_version>[^|]+)\\|(?P<device_vendor>[^\\|]+)\\|(?P<device_product>[^\\|]+)\\|(?P<device_version>[^\\|]+)\\|(?P<signature_id>[^\\|]+)\\|(?P<event_name>[^\\|]+)\\|(?P<severity>[^\\|]+)\\|%{GREEDYDATA:cef_event_attributes}"

                ]

                }

        overwrite => ["message"]

        on_error => "not_a_valid_syslog"

    }

    # If the event is not a valid syslog, drop it with a tag

    if [not_a_valid_syslog] {

        drop {

            tag => "TAG_MALFORMED_MESSAGE"

        }

    }

    if [cef_event_attributes] =~ "=" {

        kv {

            source => "cef_event_attributes"

            field_split => "|"

            value_split => "="

            target => "cef_fields"

        }

        mutate {

            add_field => { "security_result" => "{}" }

        }

        # Map severity levels from numerical values to string representation

        if [severity] in ["1", "2", "3"] {

            mutate {

                replace => { "security_result.severity" => "LOW" }

            }

        }

        else if [severity] in ["4", "5", "6"] {

            mutate {

                replace => { "security_result.severity" => "MEDIUM" }

            }

        }

        else if [severity] in ["7", "8"] {

            mutate {

                replace => { "security_result.severity" => "HIGH" }

            }

        }

        else if [severity] in ["9", "10"] {

            mutate {

                replace => { "security_result.severity" => "CRITICAL" }

            }

        }

        else {

            mutate {

                replace => { "security_result.severity" => "INFORMATIONAL" }

            }

        }

        # Populate UDM (Unified Data Model) fields with extracted values

        mutate {

            replace => {

            "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"

            "event.idm.read_only_udm.metadata.vendor_name" => "%{device_vendor}"

            "event.idm.read_only_udm.metadata.product_name" => "%{device_product}"

            "event.idm.read_only_udm.metadata.product_version" => "%{device_version}"

            "security_result.description" => "%{event_name}"

            }

        }

        # Merge security result into event structure

        mutate {

            merge => {

            "event.idm.read_only_udm.security_result" => "security_result"

            }

        }

        # Process System.TimeCreated field
        
        mutate {
            replace => {
            "created_time" => "%{cef_fields.System.TimeCreated}"
            }
            on_error => "on_created_time_created_replace_error"
        }

        if ![on_created_time_created_replace_error] {
            mutate {
                replace => {
                    "additional_created_time" => ""
                }
            }
            mutate {
                replace => {
                "additional_created_time.key" => "created_time"
                "additional_created_time.value.string_value" => "%{cef_fields.System.TimeCreated}"
                }
            on_error => "system_time_key_value_replace_failed"
            }
            mutate {
                merge => {
                    "event.idm.read_only_udm.additional.fields" => "additional_created_time"
                }
                on_error => "created_time_merge_error"
            }
        }

        # Process device product field

        mutate {

            replace => {

            "site_source" => "%{device_product}"

            }

            on_error => "on_device_product_replace_error"

        }

        if ![on_device_product_replace_error] {

            mutate {

                replace => {

                    "additional_deviceproduct" => ""

                }

            }

            mutate {

                replace => {

                "additional_deviceproduct.key" => "site_source"

                "additional_deviceproduct.value.string_value" => "%{device_product}"

                }

            on_error => "device_product_key_value_replace_failed"

            }

            mutate {

                merge => {

                    "event.idm.read_only_udm.additional.fields" => "additional_deviceproduct"

                }

                on_error => "device_product_merge_error"

            }

        }

        # Process signature id field

        mutate {

            replace => {

            "id" => "%{signature_id}"

            }

            on_error => "on_signature_id_replace_error"

        }

        if ![on_signature_id_replace_error] {

            mutate {

                replace => {

                    "additional_signatureid" => ""

                }

            }

            mutate {

                replace => {

                "additional_signatureid.key" => "id"

                "additional_signatureid.value.string_value" => "%{signature_id}"

                }

            on_error => "signature_id_key_value_replace_failed"

            }

            mutate {

