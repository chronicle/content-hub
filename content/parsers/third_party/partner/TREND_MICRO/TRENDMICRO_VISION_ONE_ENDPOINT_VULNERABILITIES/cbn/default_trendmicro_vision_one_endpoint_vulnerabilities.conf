# Product: TREND MICRO VISION ONE ENDPOINT VULNERABILITIES
# Category: schema
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-03-14
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "has_cveRecords" => "false"   # Set marker to detect schema type - will be cleared if cveRecords loop runs
      "deviceName" => ""
      "id" => ""
      "criticality" => ""
      "osName" => ""
      "osPlatform" => ""
      "lastDetectDateTime" => ""
      "cveCount" => ""
      "latestRiskScore" => ""
      "has_principal" => "false"
    }
  }
  mutate {
    gsub => ["message",'\"Asset group\"','\"Assetgroup\"']
  }
  # Parse the JSON - expects single device object (NOT array)
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_error"
  }
  # Process schema2 - CVE Records - create one event per CVE
  for cve in cveRecords {
    # Initialize empty fields
    mutate {
      replace => {
        "event" => ""
        "extensions" => ""
        "security_result" => ""
        "cve_affectedComponents_event_data_available" => "false"
        "cve_affectedComponents_additional_data" => ""
        "has_principal" => "false"
        "temp_risk" => ""
        "cve_id" => ""
        "cve_globalExploitActivityLevel" => ""
        "mitigation_status_label" => ""
        "exploit_attempt_label" => ""
        "cvss_base_score" => ""
        "has_cveRecords" => "true"
      }
    }
    # Extract device-level information - REQUIRED
    if [deviceName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{deviceName}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{deviceName}"
          "has_principal" => "true"
        }
        on_error => "no_device_name"
      }
    }
    if [id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.asset_id" => "device:%{id}"
        }
        on_error => "no_device_id"
      }
    }
    # Build security_result object for this CVE
    mutate {
      replace => {
        "security_result.summary" => "Vulnerability detected"
      }
      on_error => "no_security_result"
    }

    # Extract IP addresses
    for deviceIndex,device_ip in ip {
      grok {
        match => {
          "device_ip" => "%{IP:device_ip}"
        }
        overwrite => ["device_ip"]
        on_error => "device_ip_grok_fail"
      }
      if ![device_ip_grok_fail] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "device_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "device_ip"
          }
          on_error => "no_device_ip"
        }
        if ![no_device_ip] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }

    # Add criticality
    mutate {
      uppercase => ["criticality"]
    }
    if [criticality] != "" {
      if [criticality] =~ "(?i)CRITICAL" {
        mutate {
          replace => {
            "security_result.severity" => "CRITICAL"
          }
        }
      }
      else if [criticality] =~ "(?i)HIGH" {
        mutate {
          replace => {
            "security_result.severity" => "HIGH"
          }
        }
      }
      else if [criticality] =~ "(?i)MEDIUM" {
        mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      }
      else if [criticality] =~ "(?i)LOW" {
        mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      }
      else if [criticality] =~ "(?i)INFORMATIONAL" {
        mutate {
          replace => {
            "security_result.severity" => "INFORMATIONAL"
          }
        }
      }
      else {
        mutate {
          replace => {
            "criticality_label.key" => "criticality"
            "criticality_label.value" => "%{criticality}"
          }
          on_error => "no_criticality_label"
        }
        if ![no_criticality_label] {
          mutate {
            merge => {
              "security_result1.detection_fields" => "criticality_label"
            }
            on_error => "no_criticality_label_merge_fail"
          }
        }
      }
    }

    # Add last scanned datetime
    mutate {
      replace => {
        "last_scanned_label.value.string_value" => "%{lastScannedDateTime}"
      }
      on_error => "last_scanned_label_not_found"
    }
    if ![last_scanned_label_not_found] and [last_scanned_label][value][string_value] != "" {
      mutate {
        replace => {
          "last_scanned_label.key" => "last_scanned_datetime"
        }
        on_error => "no_last_scanned_label_key"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "last_scanned_label"
        }
        on_error => "last_scanned_label_merge_fail"
      }
    }

    # Create vulnerability object for this CVE
    mutate {
      replace => {
        "vul" => ""
      }
    }
    mutate {
      convert => {
        "scanTime" => "string"
      }
      on_error => "convert_scantime_error"
    }
    date {
      match => ["scanTime","UNIX","UNIX_MS"]
      target => "vul.scan_end_time"
      on_error => "scantime_date_match_failed"
    }
    # CVE ID - critical field
    mutate {
      replace => {
        "cve_id" => "%{cve.id}"
      }
      on_error => "cve_id_not_found"
    }
    if [cve_id] != "" {
      mutate {
        replace => {
          "vul.cve_id" => "%{cve_id}"
        }
        on_error => "no_cve_id"
      }
      mutate {
        replace => {
          "security_result.description" => "CVE %{cve_id} detected"
        }
        on_error => "no_cve_id_in_description"
      }
    }

    # Vendor - always set
    mutate {
      replace => {
        "vul.vendor" => "TREND VISION ONE"
      }
      on_error => "no_vendor"
    }

    # Description with global exploit level
    mutate {
      replace => {
        "cve_globalExploitActivityLevel" => "%{cve.globalExploitActivityLevel}"
      }
      on_error => "cve_globalExploitActivityLevel_not_found"
    }
    if [cve_globalExploitActivityLevel] != "" {
      mutate {
        replace => {
          "vul.description" => "Global Exploit Activity: %{cve_globalExploitActivityLevel}"
        }
        on_error => "vul_description_not_found"
      }
    }

    # CVSS Score - copy as numeric value
    mutate {
      convert => {
        "cve.cvssScore" => "string"
      }
      on_error => "no_cvss_base_score_string_convert"
    }
    mutate {
      replace => {
        "cvss_base_score" => "%{cve.cvssScore}"
      }
      on_error => "no_cvss_base_score"
    }
    if [cvss_base_score] != "" {
      mutate {
        replace => {
          "vul.cvss_base_score" => "%{cvss_base_score}"
        }
        on_error => "no_cvss_base_score_replace_fail"
      }
      mutate {
        convert => {
          "vul.cvss_base_score" => "float"
        }
        on_error => "no_cvss_base_score_float_convert_fail"
      }
    }

    # Risk level for severity mapping
    mutate {
      replace => {
        "temp_risk" => "%{cve.eventRiskLevel}"
      }
      on_error => "no_risk_level"
    }
    mutate {
      uppercase => ["temp_risk"]
    }
    # Set severity based on risk level
    if [temp_risk] == "LOW" {
      mutate {
        replace => {
          "vul.severity" => "LOW"
        }
      }
    }
    else if [temp_risk] == "MEDIUM" {
      mutate {
        replace => {
          "vul.severity" => "MEDIUM"
        }
      }
    }
    else if [temp_risk] == "HIGH" {
      mutate {
        replace => {
          "vul.severity" => "HIGH"
        }
      }
    }
    else if [temp_risk] == "CRITICAL" {
      mutate {
        replace => {
          "vul.severity" => "CRITICAL"
        }
      }
    }

    # Add vulnerability to arrays
    mutate {
      merge => {
        "extensions.vulns.vulnerabilities" => "vul"
      }
      on_error => "vul_merge_fail"
    }

    # Mitigation Status
    mutate {
      replace => {
        "mitigation_status_label.value" => "%{cve.mitigationStatus}"
      }
      on_error => "mitigation_status_label_not_found"
    }
    if ![mitigation_status_label_not_found] and [mitigation_status_label][value] != "" {
      mutate {
        replace => {
          "mitigation_status_label.key" => "mitigation_status"
        }
        on_error => "mitigation_status_label_key_not_found"
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "mitigation_status_label"
        }
        on_error => "mitigation_status_label_merge_fail"
      }
    }

    # Exploit Attempt Count
    mutate {
      convert => {
        "cve.exploitAttemptCount" => "string"
      }
      on_error => "no_exploit_attempt"
    }
    mutate {
      replace => {
        "exploit_attempt_label.value" => "%{cve.exploitAttemptCount}"
      }
      on_error => "exploit_attempt_label_not_found"
    }
    if ![exploit_attempt_label_not_found] and [exploit_attempt_label][value] != "" {
      mutate {
        replace => {
          "exploit_attempt_label.key" => "exploit_attempt_count"
        }
        on_error => "exploit_attempt_label_key_not_found"
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "exploit_attempt_label"
        }
        on_error => "exploit_attempt_label_merge_fail"
      }
    }
    # Affected Components
    for component in cve.affectedComponents {
      mutate {
        replace => {
          "cve_affectedComponents_value_array" => ""
        }
      }
      mutate {
        replace => {
          "cve_affectedComponents_value_array.string_value" => "%{component}"
        }
        on_error => "cve_affectedComponents_value_array_not_found"
      }
      mutate {
        merge => {
          "cve_affectedComponents_additional_data.value.list_value.values" => "cve_affectedComponents_value_array"
        }
        on_error => "cve_affectedComponents_value_array_merge_fail"
      }
      if [cve_affectedComponents_value_array] != "" {
        mutate {
          replace => {
            "cve_affectedComponents_event_data_available" => "true"
          }
        }
      }
    }
    if [cve_affectedComponents_event_data_available] == "true" {
      mutate {
        replace => {
          "cve_affectedComponents_additional_data.key" => "affected_component"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cve_affectedComponents_additional_data"
        }
        on_error => "cve_affectedComponents_additional_data_merge_fail"
      }
    }
    # Published DateTime
    mutate {
      replace => {
        "temp_timestamp" => "%{cve.publishedDateTime}"
      }
      on_error => "no_published_date"
    }

    if ![no_published_date] {
      date {
        match => ["temp_timestamp", "ISO8601"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "no_timestamp"
      }
    }
    for protectionRuleIndex,protectionRule in cve.protectionRules {
      mutate {
        convert => {
          "protectionRuleIndex" => "string"
        }
        on_error => "protectionRuleIndex_string_convert_error"
      }
      mutate {
        replace => {
          "cve_protectionRules_id_label" => ""
          "cve_protectionRules_product_label" => ""
          "cve_protectionRules_name_label" => ""
        }
      }
      mutate {
        replace => {
          "cve_protectionRules_id_label.value" => "%{protectionRule.id}"
        }
        on_error => "cve_protectionRules_id_label_not_found"
      }
      if ![cve_protectionRules_id_label_not_found] and [cve_protectionRules_id_label][value] != "" {
        mutate {
          replace => {
            "cve_protectionRules_id_label.key" => "protectionRules_id %{protectionRuleIndex}"
          }
          on_error => "cve_protectionRules_id_label_key_not_found"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "cve_protectionRules_id_label"
          }
          on_error => "cve_protectionRules_id_label_merge_fail"
        }
      }
      mutate {
        replace => {
          "cve_protectionRules_product_label.value" => "%{protectionRule.product}"
        }
        on_error => "cve_protectionRules_product_label_not_found"
      }
      if ![cve_protectionRules_product_label_not_found] and [cve_protectionRules_product_label][value] != "" {
        mutate {
          replace => {
          "cve_protectionRules_product_label.key" => "protectionRules_product %{protectionRuleIndex}"
          }
          on_error => "cve_protectionRules_product_label_key_not_found"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "cve_protectionRules_product_label"
          }
          on_error => "cve_protectionRules_product_label_merge_fail"
        }
      }
      mutate {
        replace => {
          "cve_protectionRules_name_label.value" => "%{protectionRule.name}"
        }
        on_error => "cve_protectionRules_name_label_not_found"
      }
      if ![cve_protectionRules_name_label_not_found] and [cve_protectionRules_name_label][value] != "" {
        mutate {
          replace => {
            "cve_protectionRules_name_label.key" => "protectionRules_name %{protectionRuleIndex}"
          }
          on_error => "cve_protectionRules_name_label_key_not_found"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "cve_protectionRules_name_label"
          }
          on_error => "cve_protectionRules_name_label_merge_fail"
        }
      }
    }
    # Set metadata - REQUIRED
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "TREND VISION ONE VULNERABILITIES"
        "event.idm.read_only_udm.metadata.vendor_name" => "TREND VISION ONE VULNERABILITIES"
        "event.idm.read_only_udm.metadata.product_event_type" => "CVE Vulnerability Scan"
      }
    }
    # Rename fields to UDM structure

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "security_result_merge_fail"
      }
    }

    if [extensions] != "" {
      mutate {
        rename => {
          "extensions" => "event.idm.read_only_udm.extensions"
        }
      }
    }
    if [vul] != "" and [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "SCAN_VULN_HOST"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    # Output the mapped fields as an UDM event
    mutate {
      merge => {
        "@output" => "event"
      }
    }

  }  # End for cve in cveRecords

  # Process schema1 - device summary without CVE details
  if [has_cveRecords] == "false" {
    # Initialize empty fields
    mutate {
      replace => {
        "security_result1" => ""
        "installedAgents_event_data_available" => "false"
        "discoveredBy_event_data_available" => "false"
        "vul1" => ""
      }
    }

    # Set event timestamp - REQUIRED
    date {
      match => ["firstSeenDateTime", "ISO8601"]
      target => "event1.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_event_timestamp"
    }

    # Extract device-level information - REQUIRED
    if [deviceName] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.hostname" => "%{deviceName}"
          "event1.idm.read_only_udm.principal.asset.hostname" => "%{deviceName}"
          "has_principal" => "true"
        }
        on_error => "device_name_not_found"
      }
    }
    if [id] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.asset.asset_id" => "device:%{id}"
        }
        on_error => "device_id_not_found"
      }
    }
    mutate {
      convert => {
        "cveCount" => "string"
      }
      on_error => "no_cve_count_string_convert"
    }
    if [cveCount] != "" {
      mutate {
        replace => {
          "security_result1.description" => "Device has %{cveCount} CVEs"
        }
        on_error => "no_cve_count_replace_fail"
      }
      # Add CVE count
      mutate {
        replace => {
          "cve_count_label.key" => "cve_count"
          "cve_count_label.value" => "%{cveCount}"
        }
        on_error => "cve_count_label_not_found"
      }
      if ![cve_count_label_not_found] {
        mutate {
          merge => {
            "security_result1.detection_fields" => "cve_count_label"
          }
          on_error => "cve_count_label_merge_fail"
        }
      }
    }

    # Extract IP addresses
    for deviceIndex,device_ip in ip {
      grok {
        match => {
          "device_ip" => "%{IP:device_ip}"
        }
        overwrite => ["device_ip"]
        on_error => "device_ip_grok_has_fail"
      }
      if ![device_ip_grok_has_fail] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.ip" => "device_ip"
            "event1.idm.read_only_udm.principal.asset.ip" => "device_ip"
          }
          on_error => "device_ip_merge_has_fail"
        }
        if ![device_ip_merge_has_fail] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }

    # Add criticality
    mutate {
      uppercase => ["criticality"]
    }
    if [criticality] != "" {
      if [criticality] =~ "(?i)CRITICAL" {
        mutate {
          replace => {
            "security_result1.severity" => "CRITICAL"
          }
        }
      }
      else if [criticality] =~ "(?i)HIGH" {
        mutate {
          replace => {
            "security_result1.severity" => "HIGH"
          }
        }
      }
      else if [criticality] =~ "(?i)MEDIUM" {
        mutate {
          replace => {
            "security_result1.severity" => "MEDIUM"
          }
        }
      }
      else if [criticality] =~ "(?i)LOW" {
        mutate {
          replace => {
            "security_result1.severity" => "LOW"
          }
        }
      }
      else if [criticality] =~ "(?i)INFORMATIONAL" {
        mutate {
          replace => {
            "security_result1.severity" => "INFORMATIONAL"
          }
        }
      }
      else {
        mutate {
          replace => {
            "criticality_label.key" => "criticality"
            "criticality_label.value" => "%{criticality}"
          }
          on_error => "no_criticality_label"
        }
        if ![no_criticality_label] {
          mutate {
            merge => {
              "security_result1.detection_fields" => "criticality_label"
            }
          }
        }
      }
    }
    # Add latest risk score
    mutate {
      convert => {
        "latestRiskScore" => "string"
      }
      on_error => "no_latest_risk_score_string_convert"
    }
    if [latestRiskScore] =~ "([0-9]+)" {
      mutate {
        replace => {
          "security_result1.risk_score" => "%{latestRiskScore}"
        }
        on_error => "riskscore_invalid"
      }
      mutate {
        convert => {
          "security_result1.risk_score" => "float"
        }
        on_error => "riskscore_invalid"
      }
    }

    # Add last detect datetime
    if [lastDetectDateTime] != "" {
      mutate {
        replace => {
          "last_detect_label.key" => "last_detect_datetime"
          "last_detect_label.value.string_value" => "%{lastDetectDateTime}"
        }
        on_error => "no_last_detect"
      }
      if ![no_last_detect] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "last_detect_label"
          }
          on_error => "last_detect_label_merge_fail"
        }
      }
    }
    # Add OS information
    if [osName] != "" {
      mutate {
        replace => {
          "os_name_label.key" => "os_name"
          "os_name_label.value" => "%{osName}"
        }
        on_error => "os_name_label_error"
      }
      if ![os_name_label_error] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.resource.attribute.labels" => "os_name_label"
          }
          on_error => "os_name_label_merge_error"
        }
      }
    }
    if [osPlatform] != "" {
      if [osPlatform] =~ "(?i)win" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.asset.platform_software.platform" => "WINDOWS"
          }
        }
      }
      else if [osPlatform] =~ "(?i)mac" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.asset.platform_software.platform" => "MAC"
          }
        }
      }
      else if [osPlatform] =~ "(?i)lin" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.asset.platform_software.platform" => "LINUX"
          }
        }
      }
      else if [osPlatform] =~ "(?i)android" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.asset.platform_software.platform" => "ANDROID"
          }
        }
      }
      else if [osPlatform] =~ "(?i)ios" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.asset.platform_software.platform" => "IOS"
          }
        }
      }
      else {
        mutate {
          replace => {
            "os_platform_label.key" => "os_platform"
            "os_platform_label.value" => "%{osPlatform}"
          }
          on_error => "os_platform_label_error"
        }
        if ![os_platform_label_error] and [os_platform_label][value] != "" {
          mutate {
            merge => {
              "event1.idm.read_only_udm.principal.resource.attribute.labels" => "os_platform_label"
            }
            on_error => "os_platform_label_merge_error"
          }
        }
      }
    }

    # Add installedAgents as comma-separated list
    for agent in installedAgents {
      mutate {
        replace => {
          "installedAgents_value_array" => ""
        }
      }
      mutate {
        replace => {
          "installedAgents_value_array.string_value" => "%{agent}"
        }
        on_error => "installedAgents_value_array_failed"
      }
      mutate {
        merge => {
          "installedAgents_additional_data.value.list_value.values" => "installedAgents_value_array"
        }
        on_error => "installedAgents_value_array_merge_failed"
      }
      if [installedAgents_value_array] != "" {
        mutate {
          replace => {
            "installedAgents_event_data_available" => "true"
          }
        }
      }
    }
    if [installedAgents_event_data_available] == "true" {
      mutate {
        replace => {
          "installedAgents_additional_data.key" => "installedAgents"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "installedAgents_additional_data"
        }
        on_error => "installedAgents_additional_data_merge_failed"
      }
    }
    # Add discoveredBy as comma-separated list
    for discovery in discoveredBy {
      mutate {
        replace => {
          "discoveredBy_value_array" => ""
        }
      }
      mutate {
        replace => {
          "discoveredBy_value_array.string_value" => "%{discovery}"
        }
        on_error => "discoveredBy_value_array_failed"
      }
      mutate {
        merge => {
          "discoveredBy_additional_data.value.list_value.values" => "discoveredBy_value_array"
        }
        on_error => "discoveredBy_value_array_merge_failed"
      }
      if [discoveredBy_value_array] != "" {
        mutate {
          replace => {
            "discoveredBy_event_data_available" => "true"
          }
        }
      }
    }
    if [discoveredBy_event_data_available] == "true" {
      mutate {
        replace => {
          "discoveredBy_additional_data.key" => "discovered_by"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "discoveredBy_additional_data"
        }
        on_error => "discoveredBy_additional_data_merge_failed"
      }
    }
    for AssetGroupIndex, AssetGroupData in platformAssetTags.Assetgroup {
      mutate {
        convert => {
          "AssetGroupIndex" => "string"
        }
        on_error => "asset_group_index_string_convert_error"
      }
      mutate {
        replace => {
          "asset_group_label" => ""
        }
      }
      mutate {
        replace => {
          "asset_group_label.value" => "%{AssetGroupData}"
        }
        on_error => "asset_group_label_error"
      }
      if ![asset_group_label_error] and [asset_group_label][value] != "" {
        mutate {
          replace => {
            "asset_group_label.key" => "asset_group %{AssetGroupIndex}"
          }
          on_error => "asset_group_label_key_error"
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.resource.attribute.labels" => "asset_group_label"
          }
          on_error => "asset_group_label_merge_error"
        }
      }
    }
    for customAssetTagIndex, customAssetTagData in customAssetTags.1 {
      mutate {
        convert => {
          "customAssetTagIndex" => "string"
        }
        on_error => "custom_asset_tag_index_string_convert_error"
      }
      mutate {
        replace => {
          "custom_asset_tag_label" => ""
        }
      }
      mutate {
        replace => {
          "custom_asset_tag_label.value" => "%{customAssetTagData}"
        }
        on_error => "custom_asset_tag_label_error"
      }
      if ![custom_asset_tag_label_error] and [custom_asset_tag_label][value] != "" {
        mutate {
          replace => {
            "custom_asset_tag_label.key" => "custom_asset_tag %{customAssetTagIndex}"
          }
          on_error => "custom_asset_tag_label_key_error"
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.resource.attribute.labels" => "custom_asset_tag_label"
          }
          on_error => "custom_asset_tag_label_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "security_result1.summary" => "Vulnerability summary"
      }
    }
    mutate {
      convert => {
        "scanTime" => "string"
      }
      on_error => "convert_scantime_error"
    }
    date {
      match => ["scanTime","UNIX","UNIX_MS"]
      target => "vul1.scan_end_time"
      on_error => "scantime_date_match_failed"
    }
    if [security_result1] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.security_result" => "security_result1"
        }
        on_error => "no_security_result1"
      }
    }
    if [vul1] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.extensions.vulns.vulnerabilities" => "vul1"
        }
        on_error => "no_vul"
      }
    }
    # Set metadata - REQUIRED
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_name" => "TREND VISION ONE VULNERABILITIES"
        "event1.idm.read_only_udm.metadata.vendor_name" => "TREND VISION ONE VULNERABILITIES"
        "event1.idm.read_only_udm.metadata.product_event_type" => "CVE Vulnerability Scan"
      }
    }
    # Set event type
    if [vul1] != "" and [has_principal] == "true" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "SCAN_VULN_HOST"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    # Output the mapped fields as an UDM event
    mutate {
      merge => {
        "@output" => "event1"
      }
    }
  }
}
