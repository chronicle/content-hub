    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target_file] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [source] != "" {
    mutate {
      rename => {
        "source" => "event.idm.read_only_udm.src"
      }
    }
  }

  if [target_udm] != "" {
    mutate {
      rename => {
        "target_udm" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "_"
    }
  }

  # Merge the objects to respective UDM structure
  # As we want to append the data to these UDM fields

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "_"
    }
  }

  # Output the mapped fields as an UDM event
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
