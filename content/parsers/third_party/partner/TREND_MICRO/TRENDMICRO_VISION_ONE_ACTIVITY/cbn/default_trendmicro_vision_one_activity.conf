  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }
  if [json_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  mutate {
    replace => {
      "metadata.event_type" => "GENERIC_EVENT"
      "metadata.vendor_name" => "TREND VISION ONE ACTIVITY"
      "metadata.product_name" => "TREND VISION ONE ACTIVITY"
    }
  }

  if [groupId] != "" {
    mutate {
      replace => {
        "groupId_label.value.string_value" => "%{groupId}"
      }
      on_error => "no_groupId"
    }
    if ![no_groupId] {
      mutate {
        replace => {
          "groupId_label.key" => "groupId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "groupId_label"
        }
        on_error => "no_groupId_label"
      }
    }
  }
  if [scanType] != "" {
    mutate {
