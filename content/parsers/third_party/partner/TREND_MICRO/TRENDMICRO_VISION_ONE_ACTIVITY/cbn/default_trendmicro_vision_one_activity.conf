          "security_result.detection_fields" => "eventSourceType_label"
        }
        on_error => "no_eventSourceType_label"
      }
    }
  }
  if [mailRecipientIp] != "" {
    grok {
      match => {
        "mailRecipientIp" => ["%{DATA:target_hostname}\\[%{IP:target_ip}\\]:%{INT:target_port}"]
      }
      on_error => "no_mailRecipientIp_match_found"
      overwrite => ["target_hostname", "target_ip", "target_port"]
    }
    if ![no_mailRecipientIp_match_found] {
      if [target_ip] != "" {
        mutate {
          merge => {
            "target_udm.ip" => "target_ip"
            "target_udm.asset.ip" => "target_ip"
          }
          on_error => "no_target_ip"
        }
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
      if [target_hostname] != "" {
        mutate {
          replace => {
            "target_udm.hostname" => "%{target_hostname}"
            "target_udm.asset.hostname" => "%{target_hostname}"
          }
          on_error => "no_target_hostname"
        }
      }
      if [target_port] != "" {
        mutate {
          convert => {
            "target_port" => "string"
          }
          on_error => "no_target_port_convert"
        }
        mutate {
          replace => {
            "target_udm.port" => "%{target_port}"
          }
          on_error => "no_target_port"
        }
        mutate {
          convert => {
            "target_udm.port" => "integer"
          }
          on_error => "convert_target_port_fail"
        }
      }
    }
