# Product Documentation: https://docs.censys.com
# Log Format: JSON
# Log Shape: one Censys risk event per log, as ingested by the
#   censys_supplier_risk data connector (one element of
#   GET /v1/risk-events -> result.risk_events[]):
#   {"id", "inserted_at", "change_type", "occurred_at", "risk_instance": {...}}

filter {
  mutate {
    replace => {
      "token_metadata"   => ""
      "token_target"     => ""
      "token_network"    => ""
      "token_sr"         => ""
      "lbl"              => ""
      "assoc"            => ""
      "confidence_str"   => ""
      "rapid_resp_str"   => ""
      "host_ip_val"      => ""
      "web_hostname_val" => ""
      "app_proto_val"    => ""
      "ip_proto_val"     => ""
      "risk_cat_val"     => ""
      "severity_val"     => ""
    }
  }
  # split_columns is required: without it the for loops over
  # remediations / tags / suppliers never iterate.
  json {
    source         => "message"
    array_function => "split_columns"
    on_error       => "json_parse_failed"
  }
  if [json_parse_failed] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  # ---------------------------------------------------------------- metadata
  mutate {
    replace => {
      "token_metadata.vendor_name"  => "Censys"
      "token_metadata.product_name" => "Supplier Risk"
      "token_metadata.event_type"   => "GENERIC_EVENT"
    }
  }
  mutate {
    replace => { "token_metadata.product_log_id" => "%{id}" }
    on_error => "id_not_found"
  }
  date {
    match => [
      "occurred_at",
      "ISO8601",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ssZ"
    ]
    target   => "token_metadata.event_timestamp"
    on_error => "occurred_at_date_failed"
  }
  date {
    match => [
      "inserted_at",
      "ISO8601",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ssZ"
    ]
    target   => "token_metadata.collected_timestamp"
    on_error => "inserted_at_date_failed"
  }
  mutate {
    replace => {
      "token_metadata.url_back_to_product" => "%{risk_instance.platform_url}"
    }
    on_error => "platform_url_not_found"
  }

  # ------------------------------------------------------------------ target
  mutate {
    replace  => { "host_ip_val" => "%{risk_instance.host.ip}" }
    on_error => "host_ip_not_found"
  }
  if ![host_ip_not_found] and [host_ip_val] != "" {
    mutate {
      convert  => { "host_ip_val" => "ipaddress" }
      on_error => "invalid_host_ip"
    }
    if ![invalid_host_ip] {
      mutate {
        merge    => { "token_target.ip" => "risk_instance.host.ip" }
        on_error => "host_ip_merge_failed"
      }
    }
  }
  mutate {
    replace  => { "web_hostname_val" => "%{risk_instance.web.hostname}" }
    on_error => "web_hostname_not_found"
  }
  if ![web_hostname_not_found] and [web_hostname_val] != "" and
    [web_hostname_val] =~ "^.{1,255}$" {
    mutate {
      replace  => { "token_target.hostname" => "%{web_hostname_val}" }
      on_error => "target_hostname_failed"
    }
  }
  # numeric JSON values cannot be interpolated with %{} until converted
  mutate {
    convert  => { "risk_instance.service.port" => "string" }
    on_error => "service_port_to_string_failed"
  }
  mutate {
    convert  => { "risk_instance.web.port" => "string" }
    on_error => "web_port_to_string_failed"
  }
  # service.port (host assets) and web.port (web assets) are both the
  # destination port of the exposed service, so both map to target.port.
  mutate {
    replace  => { "token_target.port" => "%{risk_instance.service.port}" }
    on_error => "service_port_not_found"
  }
  if ![service_port_not_found] {
    mutate {
      convert  => { "token_target.port" => "integer" }
      on_error => "service_port_convert_failed"
    }
    if [service_port_convert_failed] {
      mutate { remove_field => ["token_target.port"] }
    }
  }
  mutate {
    replace  => { "token_target.port" => "%{risk_instance.web.port}" }
    on_error => "web_port_not_found"
  }
  if ![web_port_not_found] {
    mutate {
      convert  => { "token_target.port" => "integer" }
      on_error => "web_port_convert_failed"
    }
    if [web_port_convert_failed] {
      mutate { remove_field => ["token_target.port"] }
    }
  }

  # ----------------------------------------------------------------- network
  mutate {
    replace  => { "app_proto_val" => "%{risk_instance.service.protocol}" }
    on_error => "app_proto_not_found"
  }
  # Targets must be valid UDM Network.ApplicationProtocol enum names.
  # Censys protocols with no UDM equivalent (MYSQL, REDIS, VNC, ...) fall
  # back to UNKNOWN_APPLICATION_PROTOCOL and the raw value is kept in
  # security_result.detection_fields[service_protocol].
  if ![app_proto_not_found] and [app_proto_val] != "" {
    translate {
      source     => "risk_instance.service.protocol"
      target     => "token_network.application_protocol"
      dictionary => {
        "AFP"          => "AFP"
        "AMQP"         => "AMQP"
        "APPC"         => "APPC"
        "ATOM"         => "ATOM"
        "BEEP"         => "BEEP"
        "BITCOIN"      => "BITCOIN"
        "BIT_TORRENT"  => "BIT_TORRENT"
        "BITTORRENT"   => "BIT_TORRENT"
        "CFDP"         => "CFDP"
        "CIP"          => "CIP"
        "COAP"         => "COAP"
        "COTP"         => "COTP"
        "DCERPC"       => "DCERPC"
        "DDS"          => "DDS"
        "DEVICE_NET"   => "DEVICE_NET"
        "DHCP"         => "DHCP"
        "DICOM"        => "DICOM"
        "DNP3"         => "DNP3"
        "DNS"          => "DNS"
        "ENRP"         => "ENRP"
        "E_DONKEY"     => "E_DONKEY"
        "FAST_TRACK"   => "FAST_TRACK"
        "FINGER"       => "FINGER"
        "FREENET"      => "FREENET"
        "FTAM"         => "FTAM"
        "FTP"          => "FTP"
        "GOOSE"        => "GOOSE"
        "GOPHER"       => "GOPHER"
        "GRPC"         => "GRPC"
        "H323"         => "H323"
        "HL7"          => "HL7"
        "HTTP"         => "HTTP"
        "HTTPS"        => "HTTPS"
        "IEC104"       => "IEC104"
        "IEC_104"      => "IEC104"
        "IMAP"         => "IMAP"
        "IRCP"         => "IRCP"
        "KADEMLIA"     => "KADEMLIA"
        "KRB5"         => "KRB5"
        "KERBEROS"     => "KRB5"
        "LDAP"         => "LDAP"
        "LPD"          => "LPD"
        "MIME"         => "MIME"
        "MMS"          => "MMS"
        "MODBUS"       => "MODBUS"
        "MQTT"         => "MQTT"
        "MSSQL"        => "TDS"
        "NETCONF"      => "NETCONF"
        "NFS"          => "NFS"
        "NIS"          => "NIS"
        "NNTP"         => "NNTP"
        "NTCIP"        => "NTCIP"
        "NTP"          => "NTP"
        "OSCAR"        => "OSCAR"
        "PNRP"         => "PNRP"
        "POP3"         => "POP3"
        "PTP"          => "PTP"
        "QUIC"         => "QUIC"
        "RDP"          => "RDP"
        "RELP"         => "RELP"
        "RIP"          => "RIP"
        "RLOGIN"       => "RLOGIN"
        "RPC"          => "RPC"
        "RTMP"         => "RTMP"
        "RTP"          => "RTP"
        "RTPS"         => "RTPS"
        "RTSP"         => "RTSP"
        "SAP"          => "SAP"
        "SDP"          => "SDP"
        "SFTP"         => "SFTP"
        "SIP"          => "SIP"
        "SLP"          => "SLP"
        "SMB"          => "SMB"
        "SMTP"         => "SMTP"
        "SNMP"         => "SNMP"
        "SNTP"         => "SNTP"
        "SSH"          => "SSH"
        "SSMS"         => "SSMS"
        "STYX"         => "STYX"
        "SV"           => "SV"
        "TCAP"         => "TCAP"
        "TDS"          => "TDS"
        "TELNET"       => "TELNET"
        "TOR"          => "TOR"
        "TSP"          => "TSP"
        "VTP"          => "VTP"
        "WEB_DAV"      => "WEB_DAV"
        "WEBDAV"       => "WEB_DAV"
        "WHOIS"        => "WHOIS"
        "X400"         => "X400"
        "X500"         => "X500"
        "XMPP"         => "XMPP"
      }
      override => true
      fallback => "UNKNOWN_APPLICATION_PROTOCOL"
      on_error => "app_proto_translate_failed"
    }
    if [token_network][application_protocol] == "UNKNOWN_APPLICATION_PROTOCOL" {
      mutate { replace => { "lbl" => "" } }
      mutate {
        replace => {
          "lbl.key"   => "service_protocol"
          "lbl.value" => "%{app_proto_val}"
        }
        on_error => "service_protocol_label_failed"
      }
      mutate {
        merge    => { "token_sr.detection_fields" => "lbl" }
        on_error => "service_protocol_merge_failed"
      }
    }
  }
  mutate {
    replace  => { "ip_proto_val" => "%{risk_instance.service.transport_protocol}" }
    on_error => "ip_proto_not_found"
  }
  # Targets must be valid UDM Network.IpProtocol enum names; anything else
  # falls back to UNKNOWN_IP_PROTOCOL with the raw value kept in
  # security_result.detection_fields[transport_protocol].
  if ![ip_proto_not_found] and [ip_proto_val] != "" {
    translate {
      source     => "risk_instance.service.transport_protocol"
      target     => "token_network.ip_protocol"
      dictionary => {
        "EIGRP"   => "EIGRP"
        "ESP"     => "ESP"
        "ETHERIP" => "ETHERIP"
        "GRE"     => "GRE"
        "ICMP"    => "ICMP"
        "ICMP6"   => "ICMP6"
        "ICMPV6"  => "ICMP6"
        "IGMP"    => "IGMP"
        "IP6IN4"  => "IP6IN4"
        "PIM"     => "PIM"
        "SCTP"    => "SCTP"
        "TCP"     => "TCP"
        "UDP"     => "UDP"
        "VRRP"    => "VRRP"
      }
      override => true
      fallback => "UNKNOWN_IP_PROTOCOL"
      on_error => "ip_proto_translate_failed"
    }
    if [token_network][ip_protocol] == "UNKNOWN_IP_PROTOCOL" {
      mutate { replace => { "lbl" => "" } }
      mutate {
        replace => {
          "lbl.key"   => "transport_protocol"
          "lbl.value" => "%{ip_proto_val}"
        }
        on_error => "transport_protocol_label_failed"
      }
      mutate {
        merge    => { "token_sr.detection_fields" => "lbl" }
        on_error => "transport_protocol_merge_failed"
      }
    }
  }

  # --------------------------------------------------------- security_result
  mutate {
    replace  => { "token_sr.threat_id" => "%{risk_instance.id}" }
    on_error => "threat_id_not_found"
  }
  mutate {
    replace  => { "token_sr.threat_name" => "%{risk_instance.risk_name}" }
    on_error => "threat_name_not_found"
  }
  mutate {
    replace  => { "token_sr.rule_id" => "%{risk_instance.risk_type_id}" }
    on_error => "rule_id_not_found"
  }
  mutate {
    replace  => { "token_sr.description" => "%{risk_instance.description}" }
    on_error => "description_not_found"
  }
  mutate {
    replace  => { "risk_cat_val" => "%{risk_instance.risk_category}" }
    on_error => "risk_category_not_found"
  }
  if ![risk_category_not_found] and [risk_cat_val] != "" {
    mutate {
      merge    => { "token_sr.category_details" => "risk_instance.risk_category" }
      on_error => "risk_category_merge_failed"
    }
  }
  mutate {
    convert  => { "risk_instance.score" => "string" }
    on_error => "score_to_string_failed"
  }
  mutate {
    replace  => { "token_sr.risk_score" => "%{risk_instance.score}" }
    on_error => "risk_score_not_found"
  }
  if ![risk_score_not_found] {
    mutate {
      convert  => { "token_sr.risk_score" => "float" }
      on_error => "risk_score_convert_failed"
    }
    if [risk_score_convert_failed] {
      mutate { remove_field => ["token_sr.risk_score"] }
    }
  }
  mutate {
    replace  => { "severity_val" => "%{risk_instance.severity}" }
    on_error => "severity_not_found"
  }
  if ![severity_not_found] and [severity_val] != "" {
    translate {
      source     => "risk_instance.severity"
      target     => "token_sr.severity"
      dictionary => {
        "CRITICAL"      => "CRITICAL"
        "HIGH"          => "HIGH"
        "MEDIUM"        => "MEDIUM"
        "LOW"           => "LOW"
        "INFORMATIONAL" => "INFORMATIONAL"
        "NONE"          => "NONE"
        "ERROR"         => "ERROR"
      }
      override => true
      fallback => "UNKNOWN_SEVERITY"
      on_error => "severity_translate_failed"
    }
  }

  # confidence is a float in [0, 1]: keep the raw value as confidence_score
  # and bucket it into the confidence enum.
  mutate {
    convert  => { "risk_instance.confidence" => "string" }
    on_error => "confidence_to_string_failed"
  }
  mutate {
    replace  => { "confidence_str" => "%{risk_instance.confidence}" }
    on_error => "confidence_not_found"
  }
  if ![confidence_not_found] and [confidence_str] != "" {
    mutate {
      replace  => { "token_sr.confidence_score" => "%{confidence_str}" }
      on_error => "confidence_score_replace_failed"
    }
    mutate {
      convert  => { "token_sr.confidence_score" => "float" }
      on_error => "confidence_score_convert_failed"
    }
    if [confidence_score_convert_failed] {
      mutate { remove_field => ["token_sr.confidence_score"] }
    } else if [confidence_str] =~ "^(1(\\.0*)?|0?\\.[7-9][0-9]*)$" {
      mutate { replace => { "token_sr.confidence" => "HIGH_CONFIDENCE" } }
    } else if [confidence_str] =~ "^0?\\.[4-6][0-9]*$" {
      mutate { replace => { "token_sr.confidence" => "MEDIUM_CONFIDENCE" } }
    } else if [confidence_str] =~ "^0?\\.(0*[1-9]|[1-3])[0-9]*$" {
      mutate { replace => { "token_sr.confidence" => "LOW_CONFIDENCE" } }
    } else {
      mutate { replace => { "token_sr.confidence" => "UNKNOWN_CONFIDENCE" } }
    }
  }

  # first_detected_at, falling back to created_at
  date {
    match => [
      "risk_instance.first_detected_at",
      "ISO8601",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ssZ"
    ]
    target   => "token_sr.first_discovered_time"
    on_error => "first_detected_at_date_failed"
  }
  if [first_detected_at_date_failed] {
    date {
      match => [
        "risk_instance.created_at",
        "ISO8601",
        "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSZ",
        "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
        "yyyy-MM-dd'T'HH:mm:ssZ"
      ]
      target   => "token_sr.first_discovered_time"
      on_error => "created_at_date_failed"
    }
  }
  date {
    match => [
      "risk_instance.last_detected_at",
      "ISO8601",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ssZ"
    ]
    target   => "token_sr.last_discovered_time"
    on_error => "last_detected_at_date_failed"
  }
  date {
    match => [
      "risk_instance.resolve_time",
      "ISO8601",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ",
      "yyyy-MM-dd'T'HH:mm:ssZ"
    ]
    target   => "token_sr.last_updated_time"
    on_error => "resolve_time_date_failed"
  }

  # detection_fields: one label per raw field
  mutate { replace => { "lbl" => "" } }
  mutate {
    replace  => { "lbl.value" => "%{change_type}" }
    on_error => "no_change_type"
  }
  if ![no_change_type] and [lbl][value] != "" {
    mutate { replace => { "lbl.key" => "change_type" } }
    mutate {
      merge    => { "token_sr.detection_fields" => "lbl" }
      on_error => "change_type_merge_failed"
    }
  }

  mutate { replace => { "lbl" => "" } }
  mutate {
    replace  => { "lbl.value" => "%{risk_instance.status}" }
    on_error => "no_status"
  }
  if ![no_status] and [lbl][value] != "" {
    mutate { replace => { "lbl.key" => "status" } }
    mutate {
      merge    => { "token_sr.detection_fields" => "lbl" }
      on_error => "status_merge_failed"
    }
  }

  mutate { replace => { "lbl" => "" } }
  mutate {
    replace  => { "lbl.value" => "%{risk_instance.asset_type}" }
    on_error => "no_asset_type"
  }
  if ![no_asset_type] and [lbl][value] != "" {
    mutate { replace => { "lbl.key" => "asset_type" } }
    mutate {
      merge    => { "token_sr.detection_fields" => "lbl" }
      on_error => "asset_type_merge_failed"
    }
  }

  mutate { replace => { "lbl" => "" } }
  mutate {
    replace  => { "lbl.value" => "%{risk_instance.supply_chain_id}" }
    on_error => "no_supply_chain_id"
  }
  if ![no_supply_chain_id] and [lbl][value] != "" {
    mutate { replace => { "lbl.key" => "supply_chain_id" } }
    mutate {
      merge    => { "token_sr.detection_fields" => "lbl" }
      on_error => "supply_chain_id_merge_failed"
    }
  }

  mutate { replace => { "lbl" => "" } }
  mutate {
    replace  => { "lbl.value" => "%{risk_instance.evidence}" }
    on_error => "no_evidence"
  }
  if ![no_evidence] and [lbl][value] != "" {
    mutate { replace => { "lbl.key" => "evidence" } }
    mutate {
      merge    => { "token_sr.detection_fields" => "lbl" }
      on_error => "evidence_merge_failed"
    }
  }

  mutate { replace => { "lbl" => "" } }
  mutate {
    replace  => { "lbl.value" => "%{risk_instance.resolve_reason}" }
    on_error => "no_resolve_reason"
  }
  if ![no_resolve_reason] and [lbl][value] != "" {
    mutate { replace => { "lbl.key" => "resolve_reason" } }
    mutate {
      merge    => { "token_sr.detection_fields" => "lbl" }
      on_error => "resolve_reason_merge_failed"
    }
  }

  mutate {
    convert  => { "risk_instance.rapid_response" => "string" }
    on_error => "rapid_response_to_string_failed"
  }
  mutate {
    replace  => { "rapid_resp_str" => "%{risk_instance.rapid_response}" }
    on_error => "no_rapid_response"
  }
  if ![no_rapid_response] and [rapid_resp_str] != "" {
    mutate { replace => { "lbl" => "" } }
    mutate {
      replace => {
        "lbl.key"   => "rapid_response"
        "lbl.value" => "%{rapid_resp_str}"
      }
      on_error => "rapid_response_label_failed"
    }
    mutate {
      merge    => { "token_sr.detection_fields" => "lbl" }
      on_error => "rapid_response_merge_failed"
    }
  }

  for rem_idx, rem_item in risk_instance.remediations {
    mutate { replace => { "lbl" => "" } }
    mutate {
      replace  => { "lbl.value" => "%{rem_item}" }
      on_error => "no_remediation"
    }
    if ![no_remediation] and [lbl][value] != "" {
      mutate { replace => { "lbl.key" => "remediations" } }
      mutate {
        merge    => { "token_sr.detection_fields" => "lbl" }
        on_error => "remediation_merge_failed"
      }
    }
  }

  for tag_idx, tag_item in risk_instance.tags {
    mutate {
      convert  => { "tag_idx" => "string" }
      on_error => "tag_idx_convert_failed"
    }
    mutate { replace => { "lbl" => "" } }
    mutate {
      replace  => { "lbl.value" => "%{tag_item.display_name}" }
      on_error => "no_tag_display_name"
    }
    if ![no_tag_display_name] and [lbl][value] != "" {
      mutate {
        replace  => { "lbl.key" => "tag_display_name_%{tag_idx}" }
        on_error => "tag_display_name_key_failed"
      }
      if ![tag_display_name_key_failed] {
        mutate {
          merge    => { "token_sr.detection_fields" => "lbl" }
          on_error => "tag_display_name_merge_failed"
        }
      }
    }
    mutate { replace => { "lbl" => "" } }
    mutate {
      replace  => { "lbl.value" => "%{tag_item.id}" }
      on_error => "no_tag_id"
    }
    if ![no_tag_id] and [lbl][value] != "" {
      mutate {
        replace  => { "lbl.key" => "tag_id_%{tag_idx}" }
        on_error => "tag_id_key_failed"
      }
      if ![tag_id_key_failed] {
        mutate {
          merge    => { "token_sr.detection_fields" => "lbl" }
          on_error => "tag_id_merge_failed"
        }
      }
    }
  }

  # suppliers -> security_result.associations
  for sup_idx, sup_item in risk_instance.suppliers {
    mutate { replace => { "assoc" => "" } }
    mutate {
      replace  => { "assoc.id" => "%{sup_item.id}" }
      on_error => "supplier_id_not_found"
    }
    mutate {
      replace  => { "assoc.name" => "%{sup_item.display_name}" }
      on_error => "supplier_name_not_found"
    }
    if [assoc] != "" {
      mutate {
        merge    => { "token_sr.associations" => "assoc" }
        on_error => "supplier_assoc_merge_failed"
      }
    }
  }

  # ------------------------------------------------------------------ output
  mutate {
    rename => {
      "token_metadata" => "event.idm.read_only_udm.metadata"
    }
    on_error => "metadata_rename_failed"
  }
  if [token_target] != "" {
    mutate {
      rename   => { "token_target" => "event.idm.read_only_udm.target" }
      on_error => "target_rename_failed"
    }
  }
  if [token_network] != "" {
    mutate {
      rename   => { "token_network" => "event.idm.read_only_udm.network" }
      on_error => "network_rename_failed"
    }
  }
  if [token_sr] != "" {
    mutate {
      merge    => { "event.idm.read_only_udm.security_result" => "token_sr" }
      on_error => "security_result_merge_failed"
    }
  }
  mutate {
    merge    => { "@output" => "event" }
    on_error => "output_merge_failed"
  }
}
