    mutate {
      replace => {
        "deviceRiskIndex_label.key" => "deviceRiskIndex"
        "deviceRiskIndex_label.value.string_value" => "%{event_data.riskDetails.deviceRiskIndex}"
      }
      on_error => "no_riskDetails_deviceRiskIndex"
    }
    if ![no_riskDetails_deviceRiskIndex] {
      mutate {
        merge => {
          "additional.fields" => "deviceRiskIndex_label"
        }
        on_error => "no_riskDetails_deviceRiskIndex_label"
      }
    }
  }

  if [event_data][routeName] != "" {
    mutate {
      replace => {
        "routeName_label.key" => "routeName"
        "routeName_label.value.string_value" => "%{event_data.routeName}"
      }
      on_error => "no_routeName"
