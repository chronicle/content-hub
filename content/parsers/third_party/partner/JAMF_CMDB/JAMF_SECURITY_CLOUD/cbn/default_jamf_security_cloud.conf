        }
        on_error => "no_dns_recordType_label"
      }
    }
  }

  if [event_data][dns][responseStatus] == "NOERROR" and [event_data][dns][responseStatus] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.dns.response" => "true"
      }
      on_error => "no_dns_responseStatus"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.dns.response" => "boolean"
      }
    }
  }
  else {
    mutate {
      replace => {
        "network.dns.response" => "false"
      }
      on_error => "no_dns_responseStatus"
    }
    mutate {
      convert => {
        "network.dns.response" => "boolean"
      }
      on_error => "no_dns_responseStatus"
    }
  }

  if [event_data][dns][ttl] != "" {
    mutate {
      rename => {
