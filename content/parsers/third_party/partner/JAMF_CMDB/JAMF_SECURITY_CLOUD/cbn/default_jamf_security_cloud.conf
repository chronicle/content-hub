  mutate {
    gsub => ["message","metadata","md1"]
    on_error => "no_md1"
  }

  mutate {
    gsub => ["message","event","event_data"]
    on_error => "no_event_data"
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_fail"
  }
  if [message] =~ "Hello" {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [event_data][account][customerId] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{event_data.account.customerId}"
        "has_user" => "true"
      }
      on_error => "no_customer_id"
    }
  }
  if [event_data][account][name] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{event_data.account.name}"
        "has_user" => "true"
      }
      on_error => "no_account_name"
    }
  }
  if [event_data][account][parentId] != "" {
    mutate {
      replace => {
        "parentId_label.key" => "account_parentId"
        "parentId_label.value.string_value" => "%{event_data.account.parentId}"
      }
      on_error => "no_account_parentId"
    }
    if ![no_account_parentId] {
      mutate {
        merge => {
          "additional.fields" => "parentId_label"
        }
        on_error => "no_account_parentId_label"
      }
    }
  }
  if [event_data][action] != "" {
    mutate {
      replace => {
        "action_label.key" => "action"
        "action_label.value.string_value" => "%{event_data.action}"
      }
      on_error => "no_action"
    }
