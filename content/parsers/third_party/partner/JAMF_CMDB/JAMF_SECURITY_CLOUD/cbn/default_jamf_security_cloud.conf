      mutate {
        merge => {
          "additional.fields" => "action_label"
        }
        on_error => "no_action_label"
      }
    }
  }
  if [event_data][application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{event_data.application}"
      }
      on_error => "no_application"
    }
  }

  if [event_data][blockReason] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{event_data.blockReason}"
      }
      on_error => "no_blockReason"
    }
  }
  if [event_data][blocked] != "" {
    mutate {
      convert => {
        "event_data.blocked" => "string"
      }
      on_error => "no_blocked"
    }
    mutate {
      lowercase => ["event_data.blocked"]
      on_error => "no_blocked"
    }
    if [event_data][blocked] == "true" {
      mutate {
        replace => {
          "actionforBlocked" => "BLOCK"
        }
        on_error => "no_blocked"
      }
    }
    else {
      mutate {
        replace => {
          "actionforBlocked" => "ALLOW"
        }
        on_error => "no_blocked"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "actionforBlocked"
      }
      on_error => "no_actionforBlocked"
    }
  }

  if [event_data][destination][ips] != "" {
    for ip in event_data.destination.ips {
      mutate {
        merge => {
          "target.ip" => "ip"
          "target.asset.ip" => "ip"
        }
        on_error => "no_destination_ips"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
        on_error => "no_target"
      }
    }
  }
  if [event_data][destinationIp] != "" {
    mutate {
      merge => {
        "target.ip" => "event_data.destinationIp"
        "target.asset.ip" => "event_data.destinationIp"
      }
      on_error => "no_destinationIp"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
      on_error => "no_target"
    }
  }
  if [event_data][destination][ip] != "" {
    mutate {
      merge => {
        "target.ip" => "event_data.destination.ip"
        "target.asset.ip" => "event_data.destination.ip"
      }
      on_error => "no_destination_ip"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
      on_error => "no_target"
    }
  }
  if [event_data][destination][name] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{event_data.destination.name}"
        "target.asset.hostname" => "%{event_data.destination.name}"
      }
      on_error => "no_destination_name"
    }
    if ![no_destination_name] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [event_data][destination][port] != "" {
