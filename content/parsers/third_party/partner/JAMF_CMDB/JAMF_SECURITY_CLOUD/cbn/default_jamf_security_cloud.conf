    }
    on_error => "no_device_os_osType"
  }
  if [event_data][device][osType] != "" or [event_data_device_os_osType] != "" {
    if [event_data][device][osType] =~ "Win" or [event_data_device_os_osType] =~ "Win" {
      mutate {
        replace => {
          "target.platform" => "WINDOWS"
        }
        on_error => "no_device_osType"
      }
    }
    else if [event_data][device][osType] =~ "IOS" or [event_data_device_os_osType] =~ "MAC_OS" {
      mutate {
        replace => {
          "target.platform" => "MAC"
        }
        on_error => "no_device_osType"
      }
    }
    else if [event_data][device][osType] =~ "Lin" or [event_data_device_os_osType] =~ "Lin" {
      mutate {
        replace => {
          "target.platform" => "LINUX"
        }
        on_error => "no_device_osType"
      }
    }
    else {
      mutate {
        replace => {
          "target.platform" => "UNKNOWN_PLATFORM"
        }
        on_error => "no_device_osType"
      }
    }
  }
  mutate {
