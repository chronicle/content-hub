# Product: JAMF
# Category: Computer Inventory
# Supported Format: JSON
# Reference: https://developer.jamf.com/jamf-pro/reference/computer-inventory-1
# Last Updated: 2024-05-28
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "general.reportDate" => ""
      "general.name" => ""
      "general.id" => ""
      "general.supervised" => ""
      "general.itunesStoreAccountActive" => ""
      "general.enrolledViaAutomatedDeviceEnrollment" => ""
      "general.userApprovedMdm" => ""
      "general.lastEnrolledDate" => ""
      "general.lastReportedIp" => ""
      "general.ipAddress" => ""
      "general.extensionAttributes" => ""
      "capableUser" => ""
      "general.jamfBinaryVersion" => ""
      "general.jamfVersion" => ""
      "general.site.name" => ""
      "general.lastIpAddress" => ""
      "general.platform" => ""
      "general.serialNumber" => ""
      "extensionAttribute.name" => ""
      "extensionAttribute.description" => ""
      "permission" => ""
      "udid" => ""
      "id" => ""
      "data.deviceId" => ""
      "data.details.location.username" => ""
      "traceId" => ""
      "new_time" => ""
      "username" => ""
      "wifiMacAddress" => ""
      "softwareUpdateDeviceId" => ""
      "extensionAttributes.0.extensionAttribute.0.name" => ""
      "extensionAttributes.0.extensionAttribute.0.id" => ""
      "extensionAttributes.0.extensionAttribute.0.value" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }

  if [_not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  else {
    if [message] =~ "phoneNumber" and [message] =~ "softwareUpdateDeviceId" {
      mutate {
        replace => {
          "event.idm.entity.entity.asset.type" => "MOBILE"
        }
        on_error => "invalid_type"
      }

      # Mobile device name
      if [name] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.hostname" => "%{name}"
          }
          on_error => "invalid_name"
        }
      }

      # User relationship
      if [username] != "" {
        mutate {
          replace => {
            "relations.entity.user.userid" => "%{username}"
          }
          on_error => "invalid_username"
        }
        mutate {
          replace => {
            "relations.entity_type" => "USER"
            "relations.relationship" => "OWNS"
          }
        }
        mutate {
          merge => {
            "event.idm.entity.relations" => "relations"
          }
          on_error => "_ex_no_entity_relation"
        }
      }

      # Platform
      if [type] == "ios" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.platform_software.platform" => "IOS"
          }
        }
      }

      # OS Version
      if [softwareUpdateDeviceId] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.platform_software.platform_version" => "%{softwareUpdateDeviceId}"
          }
          on_error => "invalid_deviceid"
        }
      }

      # MAC address
      if [wifiMacAddress] != "" {
        mutate {
          merge => {
            "event.idm.entity.entity.mac" => "wifiMacAddress"
          }
          on_error => "invalid_mac"
        }
      }

      # Serial number
      if [event] != "" {
        mutate {
          replace => {
            "label_serialno.key" => "serialNumber"
            "label_serialno.value" => "%{serialNumber}"
          }
          on_error => "invalid_serial"
        }
        if not [invalid_serial] {
          mutate {
            merge => {
              "event.idm.entity.entity.user.attribute.labels" => "label_serialno"
            }
            on_error => "invalid_label"
          }
        }
      }

      # Model
      if [model] != "" {
        mutate {
          replace => {
            "hardware_info.model" => "%{model}"
          }
          on_error => "invalid_model"
        }
        mutate {
          merge => {
            "event.idm.entity.entity.asset.hardware" => "hardware_info"
          }
          on_error => "invalid_hardware"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.entity.entity.asset.type" => "LAPTOP"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.entity.metadata.vendor_name" => "JAMF"
        "event.idm.entity.metadata.product_name" => "JAMF Pro"
        "event.idm.entity.metadata.entity_type" => "ASSET"
        "software_details.name" => "JAMF Pro"
        "software_details.version" => "%{general.jamfBinaryVersion}"
      }
    }
    if [general][jamfVersion] != "" {
      mutate {
        replace => {
          "software_details.version" => "%{general.jamfVersion}"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.entity.entity.asset.product_object_id" => "%{udid}"
      }
      on_error => "udid_absent"
    }
    if [udid] != "" {
      mutate {
        replace => {
          "event.idm.entity.entity.asset.asset_id" => "%{udid}"
        }
        on_error => "udid_absent"
      }
    }
    else {
      if [data][deviceId] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.asset_id" => "%{data.deviceId}"
          }
        }
      }
    }
    if [id] != "" {
      mutate {
        replace => {
          "label_id.key" => "id"
          "label_id.value" => "%{id}"
        }
        on_error => "invalid_id"
      }
      if not [invalid_id] {
        mutate {
          merge => {
            "event.idm.entity.entity.asset.attribute.labels" => "label_id"
          }
          on_error => "invalid_label_id"
        }
      }
    }

    if [data][deviceId] != "" {
      mutate {
        replace => {
          "event.idm.entity.metadata.product_entity_id" => "%{data.deviceId}"
        }
      }
    }
    else if [general][id] != "" {
      mutate {
        replace => {
          "event.idm.entity.metadata.product_entity_id" => "%{general.id}"
        }
      }
    }
    if [data][details][location][username] != "" {
      mutate {
        replace => {
          "event.idm.entity.entity.user.userid" => "%{data.details.location.username}"
        }
      }
    }
    if [general][name] != "" {
      mutate {
        replace => {
          "event.idm.entity.entity.asset.hostname" => "%{general.name}"
        }
      }
    }
    if [traceId] != "" {
      mutate {
        replace => {
          "event.idm.entity.entity.user.windows_sid" => "%{traceId}"
        }
        on_error => "no_traceId"
      }
    }
    if [general][reportDate] != "" {
      date {
        match => ["general.reportDate", "ISO8601", "yyyy-MM-dd HH:mm:ss"  ]
        target => "event.idm.entity.entity.asset.last_discover_time"
        on_error => "date_mismatch"
      }
    }
    if [general][lastEnrolledDate] != "" {
      date {
        match => ["general.lastEnrolledDate", "ISO8601" ]
        target => "event.idm.entity.entity.asset.first_discover_time"
      }
    }

    if [general][lastIpAddress] != "" {
      mutate {
        merge => {
          "event.idm.entity.entity.asset.nat_ip" => "general.lastIpAddress"
        }
      }
    }

    if [general][lastReportedIp] != "" {
      grok {
        match => {
          "general.lastReportedIp" => "%{IP:ip_add}"
        }
        on_error => "invalid_ip"
        overwrite => ["ip_add"]
      }
      if not [invalid_ip] {
        mutate {
          merge => {
            "event.idm.entity.entity.asset.ip" => "general.lastReportedIp"
          }
          on_error => "invalid_ip"
        }
      }
    }

    if [general][ipAddress] != "" {
      mutate {
        merge => {
          "event.idm.entity.entity.asset.nat_ip" => "general.ipAddress"
        }
      }
    }

    if [general][platform] == "Mac" {
      mutate {
        replace => {
          "event.idm.entity.entity.asset.platform_software.platform" => "MAC"
        }
      }
    }

    if [general][serialNumber] != "" {
      mutate {
        replace => {
          "label_serialno.key" => "serialNumber"
          "label_serialno.value" => "%{general.serialNumber}"
        }
      }
      mutate {
        merge => {
          "event.idm.entity.entity.user.attribute.labels" => "label_serialno"
        }
      }
    }

    if [general][site][name] != "" {
      mutate {
        replace => {
          "label_site.key" => "siteName"
          "label_site.value" => "%{general.site.name}"
        }
      }
      mutate {
        merge => {
          "event.idm.entity.entity.user.attribute.labels" => "label_site"
        }
      }
    }

    if [general][supervised] == true {
      mutate {
        replace => {
          "label_value" => "True"
        }
      }
    }
    else {
      mutate {
        replace => {
          "label_value" => "False"
        }
      }
    }
    mutate {
      replace => {
        "label_0.key" => "supervised"
        "label_0.value" => "%{label_value}"
      }
    }
    mutate {
      merge => {
        "event.idm.entity.entity.user.attribute.labels" => "label_0"
      }
    }

    for capableUser in general.mdmCapable.capableUsers {
      if [capableUser] != "" {
        mutate {
          replace => {
            "relations.entity.user.userid" => "%{capableUser}"
          }
        }
        mutate {
          replace => {
            "relations.entity_type" => "USER"
            "relations.relationship" => "OWNS"
          }
        }
      }
      mutate {
        merge => {
          "event.idm.entity.relations" => "relations"
        }
        on_error => "_ex_no_entity_relation"
      }
    }

    if [general][itunesStoreAccountActive] == true {
      mutate {
        replace => {
          "label_value" => "True"
        }
      }
    }
    else {
      mutate {
        replace => {
          "label_value" => "False"
        }
      }
    }
    mutate {
      replace => {
        "label_1.key" => "itunesStoreAccountActive"
        "label_1.value" => "%{label_value}"
      }
    }
    mutate {
      merge => {
        "event.idm.entity.entity.user.attribute.labels" => "label_1"
      }
    }

    if [general][enrolledViaAutomatedDeviceEnrollment] == true {
      mutate {
        replace => {
          "label_value" => "True"
        }
      }
    }
    else {
      mutate {
        replace => {
          "label_value" => "False"
        }
      }
    }
    mutate {
      replace => {
        "label_2.key" => "enrolledViaAutomatedDeviceEnrollment"
        "label_2.value" => "%{label_value}"
      }
    }
    mutate {
      merge => {
        "event.idm.entity.entity.user.attribute.labels" => "label_2"
      }
    }

    if [general][userApprovedMdm] == true {
      mutate {
        replace => {
          "label_value" => "True"
        }
      }
    }
    else {
      mutate {
        replace => {
          "label_value" => "False"
        }
      }
    }
    mutate {
      replace => {
        "label_3.key" => "userApprovedMdm"
        "label_3.value" => "%{label_value}"
      }
    }
    mutate {
      merge => {
        "event.idm.entity.entity.user.attribute.labels" => "label_3"
      }
    }
    if [extensionAttributes] != "" {
      mutate {
        replace => {
          "permission1" => ""
        }
      }
      if [extensionAttributes][0][extensionAttribute][0][name] != "" {
        mutate {
          replace => {
            "permission1.name" => "%{extensionAttributes.0.extensionAttribute.0.name}"
          }
        }
        mutate {
          merge => {
            "software_details.permissions" => "permission1"
          }
        }
      }

      if [extensionAttributes][0][extensionAttribute][0][id] != "" {
        mutate {
          replace => {
            "label_id.key" => "permissionid"
            "label_id.value" => "%{extensionAttributes.0.extensionAttribute.0.id}"
          }
        }
        mutate {
          merge => {
            "event.idm.entity.entity.user.attribute.labels" => "label_id"
          }
        }
      }
      if [extensionAttributes][0][extensionAttribute][0][value] != "" {
        mutate {
          replace => {
            "label_value.key" => "permissionvalue"
            "label_value.value" => "%{extensionAttributes.0.extensionAttribute.0.value}"
          }
        }
        mutate {
          merge => {
            "event.idm.entity.entity.user.attribute.labels" => "label_value"
          }
        }
      }
    }

    for index, extensionAttribute in general.extensionAttributes {
      mutate {
        replace => {
          "permission" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "invalid_conversion"
      }

      if [extensionAttribute][name] != "" {
        mutate {
          replace => {
            "permission.name" => "%{extensionAttribute.name}"
          }
        }
      }

      mutate {
        replace => {
          "permission.description" => "%{extensionAttribute.description}"
        }
        on_error => "description_not_found"
      }

      if ![description_not_found] {
        mutate {
          merge => {
            "software_details.permissions" => "permission"
          }
        }
      }
    }

    mutate {
      merge => {
        "event.idm.entity.entity.asset.software" => "software_details"
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
