    mutate {
      replace => { "prompt_dlp_check" => "%{PanOSIsPromptDLPRequested}" }
      on_error => "prompt_dlp_not_found"
    }
    if ![prompt_dlp_not_found] and [prompt_dlp_check] != "" {
      mutate {
        replace => { "lbl_prompt_dlp" => "" }
      }
      if [PanOSIsPromptDLPRequested] == "1" or
         [PanOSIsPromptDLPRequested] =~ "(?i)^true$" or
         [PanOSIsPromptDLPRequested] =~ "(?i)^yes$" {
        mutate {
          replace => { "lbl_prompt_dlp.value" => "true" }
        }
      } else if [PanOSIsPromptDLPRequested] == "0" or
                [PanOSIsPromptDLPRequested] =~ "(?i)^false$" or
                [PanOSIsPromptDLPRequested] =~ "(?i)^no$" {
        mutate {
          replace => { "lbl_prompt_dlp.value" => "false" }
        }
      }
