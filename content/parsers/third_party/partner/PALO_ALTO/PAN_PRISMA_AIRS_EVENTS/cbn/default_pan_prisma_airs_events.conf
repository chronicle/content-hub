# Product Documentation: https://docs.paloaltonetworks.com/ai-runtime-security
# Log Format: Syslog RFC5424 + CEF (Common Event Format)
filter {
  mutate {
    replace => {
      "token_metadata"           => ""
      "token_principal"          => ""
      "token_target"             => ""
      "token_observer"           => ""
      "token_intermediary"       => ""
      "token_intermediary_list"  => ""
      "token_additional"         => ""
      "main_security_result"     => ""
      "cef_extensions"           => ""
    }
  }

  grok {
    match => {
      "message" => [
        "^(?:%{INT:syslog_octet_count} )?<%{INT:pri}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:PanOSTimeGeneratedHighResolution} %{NOTSPACE:dvchost} %{NOTSPACE:app_name} %{NOTSPACE:proc_id} %{NOTSPACE:msg_id} %{NOTSPACE:structured_data} CEF:%{INT:cef_version}\\|%{DATA:DeviceVendor}\\|%{DATA:DeviceProduct}\\|%{DATA:DeviceVersion}\\|%{DATA:DeviceEventClassID}\\|%{DATA:Name}\\|%{DATA:CEFSeverity}\\|%{GREEDYDATA:cef_extensions}"
      ]
    }
    overwrite => [
      "syslog_octet_count", "pri", "syslog_version", "PanOSTimeGeneratedHighResolution",
      "dvchost", "app_name", "proc_id", "msg_id", "structured_data",
      "cef_version", "DeviceVendor", "DeviceProduct", "DeviceVersion",
      "DeviceEventClassID", "Name", "CEFSeverity", "cef_extensions"
    ]
    on_error => "message_grok_parse_failed"
  }

  if ![message_grok_parse_failed] and [cef_extensions] != "" {
    kv {
      source      => "cef_extensions"
      field_split => " "
      value_split => "="
      on_error    => "cef_kv_parse_failed"
    }

    # The kv filter above splits on a single space, so any CEF extension value
    # containing spaces is truncated at its first space and the remainder is
    # dropped as an orphan token. In this log source that affects the two CEF
    # timestamp fields, whose format is "MMM dd yyyy HH:mm:ss":
    #   rt=Aug 24 2026 00:58:06   -> kv yields rt="Aug"
    #   start=Aug 24 2026 00:58:06 -> kv yields start="Aug"
    # Both date{} blocks below then fail to convert, leaving
    # metadata.event_timestamp unset on every event.
    # These groks re-extract the full values and overwrite the kv output.
    # Patterns anchor on the literal CEF timestamp shape rather than on a
    # lookahead, so they are RE2-safe and do not depend on field ordering.
    grok {
      match => {
        "cef_extensions" => [
          "rt=(?P<rt>[A-Za-z]{3} \\d{1,2} \\d{4} \\d{2}:\\d{2}:\\d{2})"
        ]
      }
      overwrite => ["rt"]
      on_error  => "cef_rt_recover_failed"
    }

    grok {
      match => {
        "cef_extensions" => [
          "start=(?P<start>[A-Za-z]{3} \\d{1,2} \\d{4} \\d{2}:\\d{2}:\\d{2})"
        ]
      }
      overwrite => ["start"]
      on_error  => "cef_start_recover_failed"
    }
  }

  date {
    match    => ["rt", "MMM dd yyyy HH:mm:ss", "ISO8601"]
    target   => "token_metadata.collected_timestamp"
    on_error => "rt_date_conversion_failed"
  }

  date {
    match    => ["start", "MMM dd yyyy HH:mm:ss", "ISO8601"]
    target   => "token_metadata.event_timestamp"
    on_error => "start_date_conversion_failed"
  }

  mutate {
    replace => { "message_check" => "%{message}" }
    on_error => "message_not_found"
  }

  if ![message_not_found] and
     [message] =~ "panwlogs" and
     [message] =~ "CEF:0\\|Palo Alto Networks\\|LF\\|" and
     [message] =~ "AI-SECURITY-API" {

    mutate {
      replace => {
        "token_metadata.event_type"    => "USER_RESOURCE_ACCESS"
        "token_metadata.vendor_name"   => "Palo Alto Networks"
        "token_metadata.product_name"  => "Palo Alto Prisma AIRS Events"
      }
    }

    mutate {
      replace => { "token_principal.user.userid" => "%{PanOSAIApplicationUserName}" }
      on_error => "principal_userid_not_found"
    }

    mutate {
      replace => {
        "token_principal.administrative_domain" => "%{PanOSAIAppUserDomain}"
      }
      on_error => "principal_admin_domain_not_found"
    }

    mutate {
      replace => {
        "token_principal.group.product_object_id" => "%{PanOSAIAppUserGroupID}"
      }
      on_error => "principal_group_product_object_id_not_found"
    }

    mutate {
      replace => {
        "token_principal.group.group_display_name" => "%{PanOSAIAppUserGroupName}"
      }
      on_error => "principal_group_display_name_not_found"
    }

    mutate {
      replace => {
        "token_target.resource.product_object_id" => "%{PanOSAppId}"
      }
      on_error => "target_resource_product_object_id_not_found"
    }

    mutate {
      replace => { "token_target.resource.name" => "%{PanOSAIApplicationName}" }
      on_error => "target_resource_name_not_found"
    }

    mutate {
      replace => { "lbl_csp_name" => "" }
    }
    mutate {
      replace => {
        "lbl_csp_name.value" => "%{PanOSAIAppCSPName}"
      }
      on_error => "no_lbl_csp_name_value"
    }
    if ![no_lbl_csp_name_value] and
       [lbl_csp_name][value] != "" {
      mutate {
        replace => { "lbl_csp_name.key" => "PanOSAIAppCSPName" }
      }
      mutate {
        merge => { "token_target.resource.attribute.labels" => "lbl_csp_name" }
        on_error => "lbl_csp_name_merge_failed"
      }
    }

    mutate {
      replace => { "cloud_provider_check" => "%{PanOSAIAppCloudProvider}" }
      on_error => "cloud_provider_not_found"
    }
    if ![cloud_provider_not_found] and [cloud_provider_check] != "" {
      if [PanOSAIAppCloudProvider] =~ "(?i)aws" or
         [PanOSAIAppCloudProvider] =~ "(?i)amazon" {
        mutate {
          replace => {
            "token_target.resource.attribute.cloud.environment" =>
            "AMAZON_WEB_SERVICES"
          }
        }
      } else if [PanOSAIAppCloudProvider] =~ "(?i)gcp" or
                [PanOSAIAppCloudProvider] =~ "(?i)google" {
        mutate {
          replace => {
            "token_target.resource.attribute.cloud.environment" =>
            "GOOGLE_CLOUD_PLATFORM"
          }
        }
      } else if [PanOSAIAppCloudProvider] =~ "(?i)azure" or
                [PanOSAIAppCloudProvider] =~ "(?i)microsoft" {
        mutate {
          replace => {
            "token_target.resource.attribute.cloud.environment" =>
            "MICROSOFT_AZURE"
          }
        }
      } else {
        mutate {
          replace => {
            "token_target.resource.attribute.cloud.environment" =>
            "UNSPECIFIED_CLOUD_ENVIRONMENT"
          }
        }
      }
    }

    mutate {
      replace => { "lbl_app_env" => "" }
    }
    mutate {
      replace => {
        "lbl_app_env.value" => "%{PanOSAIAppEnvironment}"
      }
      on_error => "no_lbl_app_env_value"
    }
    if ![no_lbl_app_env_value] and
       [lbl_app_env][value] != "" {
      mutate {
        replace => { "lbl_app_env.key" => "PanOSAIAppEnvironment" }
      }
      mutate {
        merge => { "token_target.resource.attribute.labels" => "lbl_app_env" }
        on_error => "lbl_app_env_merge_failed"
      }
    }

    mutate {
      replace => { "token_target.ai.display_name" => "%{PanOSAIModelName}" }
      on_error => "target_ai_display_name_not_found"
    }

    mutate {
      replace => { "dvchost_check" => "%{dvchost}" }
      on_error => "dvchost_not_found"
    }
    if ![dvchost_not_found] and [dvchost_check] != "" {
      if [dvchost] =~ "(^.{0,255}$)" {
        mutate {
          replace => { "token_observer.hostname" => "%{dvchost}" }
          on_error => "observer_hostname_not_found"
        }
      }
    }

    mutate {
      replace => { "app_name_check" => "%{app_name}" }
      on_error => "app_name_not_found"
    }
    if ![app_name_not_found] and [app_name_check] != "" {
      if [app_name] == "logforwarder" {
        mutate {
          replace => {
            "token_observer.application" => "Log Forwarding Service"
          }
        }
      } else {
        mutate {
          replace => { "token_observer.application" => "%{app_name}" }
          on_error => "observer_application_not_found"
        }
      }
    }

    # observer.asset.software is a REPEATED field (repeated Software), so it
    # cannot be populated by assigning dotted sub-paths directly - that yields
    # a single message where an array is required. Build one Software entry in
    # a temporary object, then merge it into the repeated field.
    mutate {
      replace => { "sw_entry" => "" }
    }

    mutate {
      replace => { "dev_product_check" => "%{DeviceProduct}" }
      on_error => "dev_product_not_found"
    }
    if ![dev_product_not_found] and [dev_product_check] != "" {
      if [DeviceProduct] == "LF" {
        mutate {
          replace => {
            "sw_entry.name" => "Log Forwarding Service"
          }
        }
      } else {
        mutate {
          replace => {
            "sw_entry.name" => "%{DeviceProduct}"
          }
          on_error => "observer_asset_software_name_not_found"
        }
      }
    }

    mutate {
      replace => {
        "sw_entry.version" => "%{DeviceVersion}"
      }
      on_error => "observer_asset_software_version_not_found"
    }

    mutate {
      replace => { "dev_vendor_check" => "%{DeviceVendor}" }
      on_error => "dev_vendor_not_found"
    }
    if ![dev_vendor_not_found] and [dev_vendor_check] != "" {
      if [DeviceVendor] == "Palo Alto Networks" {
        mutate {
          replace => {
            "sw_entry.vendor_name" =>
            "Palo Alto Networks Inc."
          }
        }
      } else {
        mutate {
          replace => {
            "sw_entry.vendor_name" =>
            "%{DeviceVendor}"
          }
          on_error => "observer_asset_software_vendor_not_found"
        }
      }
    }

    if [sw_entry][name] != "" or
       [sw_entry][version] != "" or
       [sw_entry][vendor_name] != "" {
      mutate {
        merge => { "token_observer.asset.software" => "sw_entry" }
        on_error => "observer_asset_software_merge_failed"
      }
    }

    mutate {
      replace => {
        "token_observer.asset.product_object_id" => "%{deviceExternalID}"
      }
      on_error => "observer_asset_product_object_id_not_found"
    }

    mutate {
      replace => {
        "token_observer.group.product_object_id" => "%{LogSourceGroupID}"
      }
      on_error => "observer_group_product_object_id_not_found"
    }

    mutate {
      replace => { "token_observer.asset_id" => "%{PanOSAssetID}" }
      on_error => "observer_asset_id_not_found"
    }

    mutate {
      replace => {
        "token_observer.resource.resource_subtype" => "%{PanOSLogSource}"
      }
      on_error => "observer_resource_resource_subtype_not_found"
    }

    mutate {
      replace => { "lbl_log_tz" => "" }
    }
    mutate {
      replace => {
        "lbl_log_tz.value" => "%{PanOSLogSourceTimeZoneOffset}"
      }
      on_error => "no_lbl_log_tz_value"
    }
    if ![no_lbl_log_tz_value] and
       [lbl_log_tz][value] != "" {
      mutate {
        replace => {
          "lbl_log_tz.key" => "PanOSLogSourceTimeZoneOffset"
        }
      }
      mutate {
        merge => {
          "token_observer.asset.attribute.labels" => "lbl_log_tz"
        }
        on_error => "lbl_log_tz_merge_failed"
      }
    }

    mutate {
      replace => { "mcp_server_check" => "%{PanOSMCPServer}" }
      on_error => "mcp_server_not_found"
    }
    if ![mcp_server_not_found] and [mcp_server_check] != "" {
      if [PanOSMCPServer] =~ "(^.{0,255}$)" {
        mutate {
          replace => { "token_intermediary.hostname" => "%{PanOSMCPServer}" }
          on_error => "intermediary_hostname_not_found"
        }
      }
    }

    mutate {
      replace => {
        "token_observer.resource.product_object_id" =>
        "%{PanOSCortexDataLakeTenantID}"
      }
      on_error => "observer_resource_product_object_id_not_found"
    }

    mutate {
      replace => {
        "token_observer.group.group_display_name" => "%{PanOSTSGID}"
      }
      on_error => "observer_group_display_name_not_found"
    }

    mutate {
      replace => { "proc_id_check" => "%{proc_id}" }
      on_error => "proc_id_not_found"
    }
    # "-" is the RFC 5424 NILVALUE for an absent PROCID, not a real PID.
    # Without this guard it was stored literally as observer.process.pid="-".
    if ![proc_id_not_found] and [proc_id_check] != "" and
       [proc_id_check] != "-" {
      mutate {
        replace => { "token_observer.process.pid" => "%{proc_id}" }
        on_error => "observer_process_pid_not_found"
      }
      if ![observer_process_pid_not_found] and
         [token_observer][process][pid] != "" {
        mutate {
          convert => { "token_observer.process.pid" => "integer" }
          on_error => "observer_process_pid_convert_failed"
        }
      }
    }

    mutate {
      replace => {
        "platform_type_check" => "%{PlatformType}"
      }
      on_error => "platform_type_not_found"
    }
    if ![platform_type_not_found] and [platform_type_check] != "" {
      if [platform_type_check] == "AI_RUNTIME_SECURITY_API" {
        mutate {
          replace => {
            "token_observer.platform" => "UNKNOWN_PLATFORM"
          }
        }
      }

      # observer.platform is an OS enum with no member matching
      # AI_RUNTIME_SECURITY_API, so UNKNOWN_PLATFORM (the zero value) is
      # emitted and protobuf omits it - the value was lost entirely.
      # Preserve the raw value in additional.fields.
      mutate {
        replace => { "lbl_platform_type" => "" }
      }
      mutate {
        replace => {
          "lbl_platform_type.value.string_value" => "%{PlatformType}"
        }
        on_error => "no_lbl_platform_type_value"
      }
      if ![no_lbl_platform_type_value] and
         [lbl_platform_type][value][string_value] != "" {
        mutate {
          replace => { "lbl_platform_type.key" => "PlatformType" }
        }
        mutate {
          merge => { "token_additional.fields" => "lbl_platform_type" }
          on_error => "lbl_platform_type_merge_failed"
        }
      }
    }

    mutate {
      replace => { "scan_start_check" => "%{PanOSScanStartTime}" }
      on_error => "scan_start_not_found"
    }
    if ![scan_start_not_found] and [scan_start_check] != "" {
      mutate {
        replace => { "lbl_scan_start_ts" => "" }
      }
      mutate {
        replace => {
          "lbl_scan_start_ts.value.string_value" => "%{PanOSScanStartTime}"
        }
        on_error => "no_lbl_scan_start_ts_value"
      }
      if ![no_lbl_scan_start_ts_value] and
         [lbl_scan_start_ts][value][string_value] != "" {
        mutate {
          replace => {
            "lbl_scan_start_ts.key" => "PanOSScanStartTime"
          }
        }
        # metadata.event_timestamp_attributes is repeated enum
        # (EventTimestampAttribute: COLLECTED, CREATED, LAST_MODIFIED, ...),
        # not a Label container, so a timestamp value cannot be written to it
        # in any shape. Routed to additional.fields instead, which preserves
        # the value and matches how the other struct-style labels are emitted.
        mutate {
          merge => {
            "token_additional.fields" =>
            "lbl_scan_start_ts"
          }
          on_error => "lbl_scan_start_ts_merge_failed"
        }
      }
    }

    mutate {
      replace => { "completed_ts_check" => "%{PanOSCompletedTS}" }
      on_error => "completed_ts_not_found"
    }
    if ![completed_ts_not_found] and [completed_ts_check] != "" {
      mutate {
        replace => { "lbl_completed_ts" => "" }
      }
      mutate {
        replace => {
          "lbl_completed_ts.value.string_value" => "%{PanOSCompletedTS}"
        }
        on_error => "no_lbl_completed_ts_value"
      }
      if ![no_lbl_completed_ts_value] and
         [lbl_completed_ts][value][string_value] != "" {
        mutate {
          replace => {
            "lbl_completed_ts.key" => "PanOSCompletedTS"
          }
        }
        # See note above: event_timestamp_attributes is a repeated enum,
        # so PanOSCompletedTS is routed to additional.fields as well.
        mutate {
          merge => {
            "token_additional.fields" =>
            "lbl_completed_ts"
          }
          on_error => "lbl_completed_ts_merge_failed"
        }
      }
    }

    mutate {
      replace => { "lbl_ts_high_res" => "" }
    }
    mutate {
      replace => {
        "lbl_ts_high_res.value.string_value" =>
        "%{PanOSTimeGeneratedHighResolution}"
      }
      on_error => "no_lbl_ts_high_res_value"
    }
    if ![no_lbl_ts_high_res_value] and
       [lbl_ts_high_res][value][string_value] != "" {
      mutate {
        replace => {
          "lbl_ts_high_res.key" =>
          "pan_ostime_generated_high_resolution"
        }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_ts_high_res" }
        on_error => "lbl_ts_high_res_merge_failed"
      }
    }

    mutate {
      replace => { "scan_id_check" => "%{PanOSScanID}" }
      on_error => "scan_id_not_found"
    }
    mutate {
      replace => { "sub_req_id_check" => "%{PanOSScanSUBRequestID}" }
      on_error => "sub_req_id_not_found"
    }
    if ![scan_id_not_found] and [scan_id_check] != "" {
      mutate {
        replace => {
          "token_metadata.product_log_id" => "%{PanOSScanID}"
        }
        on_error => "metadata_product_log_id_scan_not_found"
      }
      if ![sub_req_id_not_found] and [sub_req_id_check] != "" {
        mutate {
          replace => {
            "scan_log_id_combined" =>
            "%{PanOSScanID}:%{PanOSScanSUBRequestID}"
          }
          on_error => "scan_log_id_combined_not_found"
        }
        # A single scan emits one record per triggered detector, and every
        # record repeats the same ScanID with SUBRequestID=0, so
        # ScanID:SUBRequestID collided across up to seven events per scan
        # holding conflicting verdicts. Append the incident subtype - or the
        # incident type when the subtype is empty, as on ai-traffic records -
        # so each detector record keeps a distinct product_log_id.
        mutate {
          replace => { "log_id_discriminator" => "" }
        }
        mutate {
          replace => {
            "log_id_discriminator" => "%{PanOSAIIncidentSubtype}"
          }
          on_error => "log_id_subtype_missing"
        }
        if [log_id_subtype_missing] or [log_id_discriminator] == "" {
          mutate {
            replace => {
              "log_id_discriminator" => "%{PanOSAIIncidentType}"
            }
            on_error => "log_id_type_missing"
          }
        }
        if ![scan_log_id_combined_not_found] and
           [log_id_discriminator] != "" {
          mutate {
            replace => {
              "scan_log_id_combined" =>
              "%{scan_log_id_combined}:%{log_id_discriminator}"
            }
            on_error => "scan_log_id_discriminator_failed"
          }
        }
        if ![scan_log_id_combined_not_found] {
          mutate {
            replace => {
              "token_metadata.product_log_id" => "%{scan_log_id_combined}"
            }
            on_error => "metadata_product_log_id_combined_not_found"
          }
        }
      }
    }

    mutate {
      replace => { "lbl_sub_req_id" => "" }
    }
    mutate {
      replace => {
        "lbl_sub_req_id.value.string_value" => "%{PanOSScanSUBRequestID}"
      }
      on_error => "no_lbl_sub_req_id_value"
    }
    if ![no_lbl_sub_req_id_value] and
       [lbl_sub_req_id][value][string_value] != "" {
      mutate {
        replace => { "lbl_sub_req_id.key" => "pan_osscan_subrequest_id" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_sub_req_id" }
        on_error => "lbl_sub_req_id_merge_failed"
      }
    }

    mutate {
      replace => { "transaction_id_check" => "%{PanOSTransactionID}" }
      on_error => "transaction_id_not_found"
    }
    if ![transaction_id_not_found] and [transaction_id_check] != "" {
      mutate {
        replace => { "lbl_transaction_id" => "" }
      }
      mutate {
        replace => {
          "lbl_transaction_id.value.string_value" =>
          "%{PanOSTransactionID}"
        }
        on_error => "no_lbl_transaction_id_value"
      }
      if ![no_lbl_transaction_id_value] and
         [lbl_transaction_id][value][string_value] != "" {
        mutate {
          replace => {
            "lbl_transaction_id.key" => "pan_ostransaction_id"
          }
        }
        mutate {
          merge => { "token_additional.fields" => "lbl_transaction_id" }
          on_error => "lbl_transaction_id_merge_failed"
        }
      }
    }

    mutate {
      replace => {
        "main_security_result.rule_set" => "%{PanOSAISecurityProfileID}"
      }
      on_error => "security_result_rule_set_not_found"
    }

    mutate {
      replace => {
        "main_security_result.rule_set_display_name" =>
        "%{PanOSAISecurityProfileName}"
      }
      on_error => "security_result_rule_set_display_name_not_found"
    }

    mutate {
      replace => {
        "main_security_result.rule_id" => "%{PanOSAISecurityPolicyID}"
      }
      on_error => "security_result_rule_id_not_found"
    }

    mutate {
      replace => {
        "main_security_result.rule_name" => "%{PanOSAISecurityPolicyName}"
      }
      on_error => "security_result_rule_name_not_found"
    }

    mutate {
      replace => { "cef_severity_check" => "%{CEFSeverity}" }
      on_error => "cef_severity_not_found"
    }
    # CEF severity arrives either as a word (Critical/High/Medium/Low/
    # Informational) or as the numeric CEF scale 0-10. This log source emits
    # the numeric form (CEFSeverity=3), which matched none of the word
    # branches, so security_result.severity was never set on any event.
    # Numeric buckets follow the CEF spec: 0-3 Low, 4-6 Medium,
    # 7-8 High, 9-10 Critical.
    if ![cef_severity_not_found] and [cef_severity_check] != "" {
      if [CEFSeverity] =~ "(?i)Critical" {
        mutate {
          replace => { "main_security_result.severity" => "CRITICAL" }
        }
      } else if [CEFSeverity] =~ "(?i)High" {
        mutate {
          replace => { "main_security_result.severity" => "HIGH" }
        }
      } else if [CEFSeverity] =~ "(?i)Medium" {
        mutate {
          replace => { "main_security_result.severity" => "MEDIUM" }
        }
      } else if [CEFSeverity] =~ "(?i)Low" {
        mutate {
          replace => { "main_security_result.severity" => "LOW" }
        }
      } else if [CEFSeverity] =~ "(?i)Informational" {
        mutate {
          replace => { "main_security_result.severity" => "INFORMATIONAL" }
        }
      } else if [CEFSeverity] =~ "^(9|10)$" {
        mutate {
          replace => { "main_security_result.severity" => "CRITICAL" }
        }
      } else if [CEFSeverity] =~ "^(7|8)$" {
        mutate {
          replace => { "main_security_result.severity" => "HIGH" }
        }
      } else if [CEFSeverity] =~ "^(4|5|6)$" {
        mutate {
          replace => { "main_security_result.severity" => "MEDIUM" }
        }
      } else if [CEFSeverity] =~ "^(0|1|2|3)$" {
        mutate {
          replace => { "main_security_result.severity" => "LOW" }
        }
      }
    }

    # CEFSeverity is a constant 3 on this log source, so the mapping above
    # graded every event LOW - blocked malicious scans and clean benign ones
    # alike - leaving severity with no analytic value. PanOSVerdict is the
    # field that actually separates a detection from a clean scan, so let it
    # drive severity and keep the raw CEF value in severity_details.
    mutate {
      replace => { "severity_verdict_check" => "%{PanOSVerdict}" }
      on_error => "severity_verdict_not_found"
    }
    if ![severity_verdict_not_found] and [severity_verdict_check] != "" {
      if [severity_verdict_check] =~ "(?i)^malicious$" {
        mutate {
          replace => { "main_security_result.severity" => "HIGH" }
        }
      } else if [severity_verdict_check] =~ "(?i)^benign$" {
        mutate {
          replace => { "main_security_result.severity" => "INFORMATIONAL" }
        }
      }
    }

    mutate {
      replace => { "lbl_event_class" => "" }
    }
    mutate {
      replace => {
        "lbl_event_class.value" => "%{DeviceEventClassID}"
      }
      on_error => "no_lbl_event_class_value"
    }
    if ![no_lbl_event_class_value] and
       [lbl_event_class][value] != "" {
      mutate {
        replace => { "lbl_event_class.key" => "DeviceEventClassID" }
      }
      mutate {
        merge => {
          "main_security_result.detection_fields" => "lbl_event_class"
        }
        on_error => "lbl_event_class_merge_failed"
      }
    }

    mutate {
      replace => {
        "main_security_result.summary" => "%{Name}"
      }
      on_error => "security_result_summary_not_found"
    }

    mutate {
      replace => {
        "main_security_result.threat_id" => "%{PanOSAIIncidentReportID}"
      }
      on_error => "security_result_threat_id_not_found"
    }

    mutate {
      replace => { "incident_subtype_check" => "%{PanOSAIIncidentSubtype}" }
      on_error => "incident_subtype_not_found"
    }
    if ![incident_subtype_not_found] and [incident_subtype_check] != "" {
      mutate {
        merge => {
          "main_security_result.category_details" =>
          "PanOSAIIncidentSubtype"
        }
        on_error => "incident_subtype_merge_failed"
      }
    }

    mutate {
      replace => { "incident_type_check" => "%{PanOSAIIncidentType}" }
      on_error => "incident_type_not_found"
    }
    if ![incident_type_not_found] and [incident_type_check] != "" {
      if [PanOSAIIncidentType] =~ "(?i)ai-traffic" {
        mutate {
          merge => {
            "main_security_result.category_details" =>
            "PanOSAIIncidentType"
          }
          on_error => "incident_type_cat_merge_failed"
        }
      } else if [PanOSAIIncidentType] =~ "(?i)ai-model-protection" {
        mutate {
          merge => {
            "main_security_result.category_details" =>
            "PanOSAIIncidentType"
          }
          on_error => "incident_type_cat_merge_failed"
        }
      } else if [PanOSAIIncidentType] =~ "(?i)ai-data-protection" {
        mutate {
          merge => {
            "main_security_result.category_details" =>
            "PanOSAIIncidentType"
          }
          on_error => "incident_type_cat_merge_failed"
        }
      } else if [PanOSAIIncidentType] =~
                "(?i)ai-application-protection" {
        mutate {
          merge => {
            "main_security_result.category_details" =>
            "PanOSAIIncidentType"
          }
          on_error => "incident_type_cat_merge_failed"
        }
      }
    }

    # security_result.category (the UDM enum) was never assigned anywhere in
    # this parser, so every event landed with the vendor strings in
    # category_details and an empty category, and any rule or dashboard
    # pivoting on the enum matched nothing. Grade off the granular subtype
    # first, falling back to the incident type when the subtype is empty, as
    # on ai-traffic records.
    mutate {
      replace => { "var_category" => "" }
    }
    if ![incident_subtype_not_found] and [incident_subtype_check] != "" {
      if [PanOSAIIncidentSubtype] =~ "(?i)^prompt-injection$" {
        mutate { replace => { "var_category" => "EXPLOIT" } }
      } else if [PanOSAIIncidentSubtype] =~ "(?i)^agent-security$" {
        mutate { replace => { "var_category" => "EXPLOIT" } }
      } else if [PanOSAIIncidentSubtype] =~ "(?i)^malicious-code$" {
        mutate { replace => { "var_category" => "SOFTWARE_MALICIOUS" } }
      } else if [PanOSAIIncidentSubtype] =~ "(?i)^dlp$" {
        mutate { replace => { "var_category" => "DATA_EXFILTRATION" } }
      } else if [PanOSAIIncidentSubtype] =~ "(?i)^url-security$" {
        mutate {
          replace => { "var_category" => "NETWORK_CATEGORIZED_CONTENT" }
        }
      } else if [PanOSAIIncidentSubtype] =~ "(?i)^toxic-content$" {
        mutate { replace => { "var_category" => "POLICY_VIOLATION" } }
      }
    }
    if [var_category] == "" and ![incident_type_not_found] and
       [incident_type_check] != "" {
      if [PanOSAIIncidentType] =~ "(?i)^ai-model-protection$" {
        mutate { replace => { "var_category" => "EXPLOIT" } }
      } else if [PanOSAIIncidentType] =~ "(?i)^ai-data-protection$" {
        mutate { replace => { "var_category" => "DATA_EXFILTRATION" } }
      } else if [PanOSAIIncidentType] =~
                "(?i)^ai-application-protection$" {
        mutate { replace => { "var_category" => "SOFTWARE_MALICIOUS" } }
      } else if [PanOSAIIncidentType] =~ "(?i)^ai-traffic$" {
        # ai-traffic is the generic bucket and carries no subtype, so lean on
        # the verdict: a blocked malicious scan is a confirmed finding, while
        # a benign one is only an observation.
        if [severity_verdict_check] =~ "(?i)^malicious$" {
          mutate { replace => { "var_category" => "NETWORK_MALICIOUS" } }
        } else {
          mutate { replace => { "var_category" => "NETWORK_SUSPICIOUS" } }
        }
      }
    }
    # category is a repeated UDM field, so it has to be merged from a field
    # name rather than replaced with an interpolated scalar - the same idiom
    # the action block above uses.
    if [var_category] != "" {
      mutate {
        merge => {
          "main_security_result.category" => "var_category"
        }
        on_error => "security_result_category_merge_failed"
      }
    }

    mutate {
      replace => {
        "main_security_result.description" => "%{PanOSAISubtypeDetails}"
      }
      on_error => "security_result_description_not_found"
    }

    mutate {
      replace => { "pan_action_check" => "%{PanOSAction}" }
      on_error => "pan_action_not_found"
    }
    if ![pan_action_not_found] and [pan_action_check] != "" {
      if [PanOSAction] =~ "(?i)Allow_With_Modification" {
        mutate {
          replace => {
            "var_action" => "ALLOW_WITH_MODIFICATION"
          }
        }
      } else if [PanOSAction] =~ "(?i)Allow" {
        mutate {
          replace => { "var_action" => "ALLOW" }
        }
      } else if [PanOSAction] =~ "(?i)Block" {
        mutate {
          replace => { "var_action" => "BLOCK" }
        }
      } else if [PanOSAction] =~ "(?i)Challenge" {
        mutate {
          replace => { "var_action" => "CHALLENGE" }
        }
      } else if [PanOSAction] =~ "(?i)Fail" {
        mutate {
          replace => { "var_action" => "FAIL" }
        }
      } else if [PanOSAction] =~ "(?i)Quarantine" {
        mutate {
          replace => { "var_action" => "QUARANTINE" }
        }
      } else if [PanOSAction] =~ "(?i)Unknown" {
        mutate {
          replace => { "var_action" => "UNKNOWN_ACTION" }
        }
      }
      if [var_action] != "" {
        mutate {
          merge => {
            "main_security_result.action" => "var_action"
          }
          on_error => "pan_action_merge_failed"
        }
      }
    }

    mutate {
      replace => {
        "main_security_result.severity_details" => "%{PanOSVendorSeverity}"
      }
      on_error => "security_result_severity_details_not_found"
    }

    # PanOSVendorSeverity is absent from the CEF AI-SECURITY-API records, so
    # this field was always empty. Preserve the raw CEF severity instead, so
    # the vendor's own value stays visible now that security_result.severity
    # is derived from the verdict.
    if [security_result_severity_details_not_found] or
       [main_security_result][severity_details] == "" {
      if ![cef_severity_not_found] and [cef_severity_check] != "" {
        mutate {
          replace => {
            "main_security_result.severity_details" => "%{CEFSeverity}"
          }
          on_error => "security_result_severity_details_cef_not_found"
        }
      }
    }

    mutate {
      replace => { "verdict_check" => "%{PanOSVerdict}" }
      on_error => "verdict_not_found"
    }
    if ![verdict_not_found] and [verdict_check] != "" {
      mutate {
        replace => { "lbl_verdict" => "" }
      }
      mutate {
        replace => { "lbl_verdict.value" => "%{PanOSVerdict}" }
        on_error => "no_lbl_verdict_value"
      }
      if ![no_lbl_verdict_value] and [lbl_verdict][value] != "" {
        mutate {
          replace => { "lbl_verdict.key" => "PanOSVerdict" }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" => "lbl_verdict"
          }
          on_error => "lbl_verdict_merge_failed"
        }
      }
    }

    mutate {
      replace => { "fprompt_action_check" => "%{PanOSFinalPromptAction}" }
      on_error => "fprompt_action_not_found"
    }
    if ![fprompt_action_not_found] and [fprompt_action_check] != "" {
      mutate {
        replace => { "var_fprompt_action" => "%{PanOSFinalPromptAction}" }
        on_error => "var_fprompt_action_not_found"
      }
      if ![var_fprompt_action_not_found] {
        mutate {
          lowercase => ["var_fprompt_action"]
        }
      }
      if [var_fprompt_action] =~ "(?i)allow_with_modification" {
        mutate {
          replace => { "var_fprompt_enum" => "ALLOW_WITH_MODIFICATION" }
        }
      } else if [var_fprompt_action] =~ "(?i)allow" {
        mutate {
          replace => { "var_fprompt_enum" => "ALLOW" }
        }
      } else if [var_fprompt_action] =~ "(?i)block" {
        mutate {
          replace => { "var_fprompt_enum" => "BLOCK" }
        }
      } else if [var_fprompt_action] =~ "(?i)challenge" {
        mutate {
          replace => { "var_fprompt_enum" => "CHALLENGE" }
        }
      } else if [var_fprompt_action] =~ "(?i)fail" {
        mutate {
          replace => { "var_fprompt_enum" => "FAIL" }
        }
      } else if [var_fprompt_action] =~ "(?i)quarantine" {
        mutate {
          replace => { "var_fprompt_enum" => "QUARANTINE" }
        }
      } else if [var_fprompt_action] =~ "(?i)unknown" {
        mutate {
          replace => { "var_fprompt_enum" => "UNKNOWN_ACTION" }
        }
      }
      if [var_fprompt_enum] != "" {
        mutate {
          merge => {
            "main_security_result.action" => "var_fprompt_enum"
          }
          on_error => "fprompt_action_merge_failed"
        }
      }
    }

    mutate {
      replace => { "fprompt_verdict_check" => "%{PanOSFinalPromptVerdict}" }
      on_error => "fprompt_verdict_not_found"
    }
    if ![fprompt_verdict_not_found] and [fprompt_verdict_check] != "" {
      mutate {
        replace => { "lbl_fprompt_verdict" => "" }
      }
      mutate {
        replace => {
          "lbl_fprompt_verdict.value" => "%{PanOSFinalPromptVerdict}"
        }
        on_error => "no_lbl_fprompt_verdict_value"
      }
      if ![no_lbl_fprompt_verdict_value] and
         [lbl_fprompt_verdict][value] != "" {
        mutate {
          replace => {
            "lbl_fprompt_verdict.key" => "PanOSFinalPromptVerdict"
          }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" =>
            "lbl_fprompt_verdict"
          }
          on_error => "lbl_fprompt_verdict_merge_failed"
        }
      }
    }

    mutate {
      replace => { "fresponse_action_check" => "%{PanOSFinalResponseAction}" }
      on_error => "fresponse_action_not_found"
    }
    if ![fresponse_action_not_found] and [fresponse_action_check] != "" {
      mutate {
        replace => { "var_fresponse_action" => "%{PanOSFinalResponseAction}" }
        on_error => "var_fresponse_action_not_found"
      }
      if ![var_fresponse_action_not_found] {
        mutate {
          lowercase => ["var_fresponse_action"]
        }
      }
      if [var_fresponse_action] =~ "(?i)allow_with_modification" {
        mutate {
          replace => { "var_fresponse_enum" => "ALLOW_WITH_MODIFICATION" }
        }
      } else if [var_fresponse_action] =~ "(?i)allow" {
        mutate {
          replace => { "var_fresponse_enum" => "ALLOW" }
        }
      } else if [var_fresponse_action] =~ "(?i)block" {
        mutate {
          replace => { "var_fresponse_enum" => "BLOCK" }
        }
      } else if [var_fresponse_action] =~ "(?i)challenge" {
        mutate {
          replace => { "var_fresponse_enum" => "CHALLENGE" }
        }
      } else if [var_fresponse_action] =~ "(?i)fail" {
        mutate {
          replace => { "var_fresponse_enum" => "FAIL" }
        }
      } else if [var_fresponse_action] =~ "(?i)quarantine" {
        mutate {
          replace => { "var_fresponse_enum" => "QUARANTINE" }
        }
      } else if [var_fresponse_action] =~ "(?i)unknown" {
        mutate {
          replace => { "var_fresponse_enum" => "UNKNOWN_ACTION" }
        }
      }
      if [var_fresponse_enum] != "" {
        mutate {
          merge => {
            "main_security_result.action" => "var_fresponse_enum"
          }
          on_error => "fresponse_action_merge_failed"
        }
      }
    }

    mutate {
      replace => {
        "fresponse_verdict_check" => "%{PanOSFinalResponseVerdict}"
      }
      on_error => "fresponse_verdict_not_found"
    }
    if ![fresponse_verdict_not_found] and
       [fresponse_verdict_check] != "" {
      mutate {
        replace => { "lbl_fresponse_verdict" => "" }
      }
      mutate {
        replace => {
          "lbl_fresponse_verdict.value" => "%{PanOSFinalResponseVerdict}"
        }
        on_error => "no_lbl_fresponse_verdict_value"
      }
      if ![no_lbl_fresponse_verdict_value] and
         [lbl_fresponse_verdict][value] != "" {
        mutate {
          replace => {
            "lbl_fresponse_verdict.key" => "PanOSFinalResponseVerdict"
          }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" =>
            "lbl_fresponse_verdict"
          }
          on_error => "lbl_fresponse_verdict_merge_failed"
        }
      }
    }

    mutate {
      replace => { "is_prompt_check" => "%{PanOSIsPrompt}" }
      on_error => "is_prompt_not_found"
    }
    if ![is_prompt_not_found] and [is_prompt_check] != "" {
      mutate {
        replace => { "lbl_is_prompt" => "" }
      }
      mutate {
        replace => { "lbl_is_prompt.value" => "%{PanOSIsPrompt}" }
        on_error => "no_lbl_is_prompt_value"
      }
      if ![no_lbl_is_prompt_value] and [lbl_is_prompt][value] != "" {
        mutate {
          replace => { "lbl_is_prompt.key" => "PanOSIsPrompt" }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" => "lbl_is_prompt"
          }
          on_error => "lbl_is_prompt_merge_failed"
        }
      }
    }

    mutate {
      replace => { "is_response_check" => "%{PanOSIsResponse}" }
      on_error => "is_response_not_found"
    }
    if ![is_response_not_found] and [is_response_check] != "" {
      mutate {
        replace => { "lbl_is_response" => "" }
      }
      mutate {
        replace => { "lbl_is_response.value" => "%{PanOSIsResponse}" }
        on_error => "no_lbl_is_response_value"
      }
      if ![no_lbl_is_response_value] and
         [lbl_is_response][value] != "" {
        mutate {
          replace => { "lbl_is_response.key" => "PanOSIsResponse" }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" => "lbl_is_response"
          }
          on_error => "lbl_is_response_merge_failed"
        }
      }
    }

    mutate {
      replace => { "req_response_check" => "%{PanOSRequestResponse}" }
      on_error => "req_response_not_found"
    }
    if ![req_response_not_found] and [req_response_check] != "" {
      mutate {
        replace => { "lbl_req_response" => "" }
      }
      mutate {
        replace => {
          "lbl_req_response.value" => "%{PanOSRequestResponse}"
        }
        on_error => "no_lbl_req_response_value"
      }
      if ![no_lbl_req_response_value] and
         [lbl_req_response][value] != "" {
        mutate {
          replace => {
            "lbl_req_response.key" => "PanOSRequestResponse"
          }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" => "lbl_req_response"
          }
          on_error => "lbl_req_response_merge_failed"
        }
      }
    }

    mutate {
      replace => { "content_masked_check" => "%{PanOSContentMasked}" }
      on_error => "content_masked_not_found"
    }
    if ![content_masked_not_found] and [content_masked_check] != "" {
      mutate {
        replace => { "lbl_content_masked" => "" }
      }
      mutate {
        replace => {
          "lbl_content_masked.value" => "%{PanOSContentMasked}"
        }
        on_error => "no_lbl_content_masked_value"
      }
      if ![no_lbl_content_masked_value] and
         [lbl_content_masked][value] != "" {
        mutate {
          replace => {
            "lbl_content_masked.key" => "PanOSContentMasked"
          }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" =>
            "lbl_content_masked"
          }
          on_error => "lbl_content_masked_merge_failed"
        }
      }
    }

    mutate {
      replace => { "content_type_check" => "%{PanOSContentType}" }
      on_error => "content_type_not_found"
    }
    if ![content_type_not_found] and [content_type_check] != "" {
      mutate {
        replace => { "lbl_content_type" => "" }
      }
      mutate {
        replace => {
          "lbl_content_type.value" => "%{PanOSContentType}"
        }
        on_error => "no_lbl_content_type_value"
      }
      if ![no_lbl_content_type_value] and
         [lbl_content_type][value] != "" {
        mutate {
          replace => {
            "lbl_content_type.key" => "PanOSContentType"
          }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" => "lbl_content_type"
          }
          on_error => "lbl_content_type_merge_failed"
        }
      }
    }

    mutate {
      replace => { "is_code_check" => "%{PanOSIsCode}" }
      on_error => "is_code_not_found"
    }
    if ![is_code_not_found] and [is_code_check] != "" {
      mutate {
        replace => { "lbl_is_code" => "" }
      }
      mutate {
        replace => { "lbl_is_code.value" => "%{PanOSIsCode}" }
        on_error => "no_lbl_is_code_value"
      }
      if ![no_lbl_is_code_value] and [lbl_is_code][value] != "" {
        mutate {
          replace => { "lbl_is_code.key" => "PanOSIsCode" }
        }
        mutate {
          merge => {
            "main_security_result.detection_fields" => "lbl_is_code"
          }
          on_error => "lbl_is_code_merge_failed"
        }
      }
    }

    mutate {
      replace => { "prompt_agent_check" => "%{PanOSIsPromptAgentRequested}" }
      on_error => "prompt_agent_not_found"
    }
    if ![prompt_agent_not_found] and [prompt_agent_check] != "" {
      mutate {
        replace => { "lbl_prompt_agent" => "" }
      }
      if [PanOSIsPromptAgentRequested] == "1" or
         [PanOSIsPromptAgentRequested] =~ "(?i)^true$" or
         [PanOSIsPromptAgentRequested] =~ "(?i)^yes$" {
        mutate {
          replace => { "lbl_prompt_agent.value" => "true" }
        }
      } else if [PanOSIsPromptAgentRequested] == "0" or
                [PanOSIsPromptAgentRequested] =~ "(?i)^false$" or
                [PanOSIsPromptAgentRequested] =~ "(?i)^no$" {
        mutate {
          replace => { "lbl_prompt_agent.value" => "false" }
        }
      }
      if [lbl_prompt_agent][value] != "" {
        mutate {
          replace => {
            "lbl_prompt_agent.key" => "PanOSIsPromptAgentRequested"
          }
        }
        mutate {
          merge => {
            "main_security_result.rule_labels" => "lbl_prompt_agent"
          }
          on_error => "lbl_prompt_agent_merge_failed"
        }
