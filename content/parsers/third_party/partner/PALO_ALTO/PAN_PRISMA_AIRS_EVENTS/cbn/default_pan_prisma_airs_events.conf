          "token_metadata.product_version" => "%{syslog_version}"
        }
        on_error => "metadata_product_version_syslog_not_found"
      }
    }

    mutate {
      replace => { "lbl_dtz" => "" }
    }
    mutate {
      replace => {
        "lbl_dtz.value.string_value" => "%{dtz}"
      }
      on_error => "no_lbl_dtz_value"
    }
    if ![no_lbl_dtz_value] and [lbl_dtz][value][string_value] != "" {
      mutate {
        replace => { "lbl_dtz.key" => "dtz" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_dtz" }
        on_error => "lbl_dtz_merge_failed"
      }
    }

    # metadata.product_event_type is defined as a short, human-readable,
    # product-specific event name. It previously received "%{message}" - the
    # entire raw syslog+CEF line (~900 bytes) - which bloated every event and
    # made the field useless for grouping. DeviceEventClassID is the CEF
    # event class and is exactly what this field is meant to carry.
    mutate {
      replace => {
        "token_metadata.product_event_type" => "%{DeviceEventClassID}"
      }
      on_error => "metadata_product_event_type_not_found"
    }

    mutate {
      replace => { "lbl_msg_id" => "" }
    }
    mutate {
      replace => {
        "lbl_msg_id.value.string_value" => "%{msg_id}"
      }
      on_error => "no_lbl_msg_id_value"
    }
    if ![no_lbl_msg_id_value] and
       [lbl_msg_id][value][string_value] != "" {
      mutate {
        replace => { "lbl_msg_id.key" => "msg_id" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_msg_id" }
        on_error => "lbl_msg_id_merge_failed"
      }
    }

    mutate {
      replace => { "lbl_pri" => "" }
    }
    mutate {
      replace => {
        "lbl_pri.value.string_value" => "%{pri}"
      }
      on_error => "no_lbl_pri_value"
    }
    if ![no_lbl_pri_value] and
       [lbl_pri][value][string_value] != "" {
      mutate {
        replace => { "lbl_pri.key" => "pri" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_pri" }
        on_error => "lbl_pri_merge_failed"
      }
    }

    mutate {
      replace => { "struct_data_check" => "%{structured_data}" }
      on_error => "struct_data_not_found"
    }
    if ![struct_data_not_found] and [struct_data_check] != "" {
      mutate {
        replace => { "lbl_struct_data" => "" }
      }
      mutate {
        replace => {
          "lbl_struct_data.value.string_value" => "%{structured_data}"
        }
        on_error => "no_lbl_struct_data_value"
      }
      # "-" is the RFC 5424 NILVALUE for absent STRUCTURED-DATA; skip it
      # rather than emitting additional.fields[structured_data]="-".
      if ![no_lbl_struct_data_value] and
         [lbl_struct_data][value][string_value] != "" and
         [lbl_struct_data][value][string_value] != "-" {
        mutate {
          replace => { "lbl_struct_data.key" => "structured_data" }
        }
        mutate {
          merge => { "token_additional.fields" => "lbl_struct_data" }
          on_error => "lbl_struct_data_merge_failed"
        }
      }
    }

    mutate {
      replace => { "lbl_syslog_ver" => "" }
    }
    mutate {
      replace => {
        "lbl_syslog_ver.value.string_value" => "%{syslog_version}"
      }
      on_error => "no_lbl_syslog_ver_value"
    }
    if ![no_lbl_syslog_ver_value] and
       [lbl_syslog_ver][value][string_value] != "" {
      mutate {
        replace => { "lbl_syslog_ver.key" => "syslog_version" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_syslog_ver" }
        on_error => "lbl_syslog_ver_merge_failed"
      }
    }

    mutate {
      replace => { "lbl_tool_name" => "" }
    }
    mutate {
      replace => {
        "lbl_tool_name.value.string_value" => "%{PanOSToolName}"
      }
      on_error => "no_lbl_tool_name_value"
    }
    if ![no_lbl_tool_name_value] and
       [lbl_tool_name][value][string_value] != "" {
      mutate {
        replace => { "lbl_tool_name.key" => "PanOSToolName" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_tool_name" }
        on_error => "lbl_tool_name_merge_failed"
      }
    }

    mutate {
      replace => { "lbl_csp_id" => "" }
    }
    mutate {
      replace => {
        "lbl_csp_id.value.string_value" => "%{PanOSCSPID}"
      }
      on_error => "no_lbl_csp_id_value"
    }
    if ![no_lbl_csp_id_value] and
       [lbl_csp_id][value][string_value] != "" {
      mutate {
        replace => { "lbl_csp_id.key" => "PanOSCSPID" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_csp_id" }
        on_error => "lbl_csp_id_merge_failed"
      }
    }

    mutate {
      replace => { "lbl_api_region" => "" }
    }
    mutate {
      replace => {
        "lbl_api_region.value.string_value" => "%{PanOSAPIRegion}"
      }
      on_error => "no_lbl_api_region_value"
    }
    if ![no_lbl_api_region_value] and
       [lbl_api_region][value][string_value] != "" {
      mutate {
        replace => { "lbl_api_region.key" => "PanOSAPIRegion" }
      }
      mutate {
        merge => { "token_additional.fields" => "lbl_api_region" }
        on_error => "lbl_api_region_merge_failed"
      }
    }

  }

  if [token_metadata] != "" {
    mutate {
      rename => {
        "token_metadata" =>
        "token_event.idm.read_only_udm.metadata"
      }
    }
  }

  if [token_principal] != "" {
    mutate {
      rename => {
        "token_principal" =>
        "token_event.idm.read_only_udm.principal"
      }
    }
  }

  if [token_target] != "" {
    mutate {
      rename => {
        "token_target" =>
        "token_event.idm.read_only_udm.target"
      }
    }
  }

  if [token_observer] != "" {
    mutate {
      rename => {
        "token_observer" =>
        "token_event.idm.read_only_udm.observer"
      }
      on_error => "token_observer_rename_failed"
    }
  }

  # intermediary is a REPEATED Noun, so a single object cannot be renamed
  # into it directly - it must be wrapped in a list first, the same way
  # security_result is handled below. Populated only when PanOSMCPServer is
  # present, so this path is dormant for logs without an MCP server.
  if [token_intermediary] != "" {
    mutate {
      merge => { "token_intermediary_list" => "token_intermediary" }
      on_error => "token_intermediary_merge_failed"
    }
    mutate {
      rename => {
        "token_intermediary_list" =>
        "token_event.idm.read_only_udm.intermediary"
      }
      on_error => "token_intermediary_rename_failed"
    }
  }

  if [token_additional] != "" {
    mutate {
      rename => {
        "token_additional" =>
        "token_event.idm.read_only_udm.additional"
      }
    }
  }

  if [main_security_result] != "" {
    mutate {
      merge => { "token_security_result" => "main_security_result" }
      on_error => "main_security_result_not_found"
    }
  }
  mutate {
    rename => {
      "token_security_result" =>
      "token_event.idm.read_only_udm.security_result"
    }
    on_error => "token_security_result_rename_failed"
  }


  mutate {
    replace => {
      "udm_event_type" =>
      "%{token_event.idm.read_only_udm.metadata.event_type}"
    }
    on_error => "udm_event_type_not_found"
  }

  if ![udm_event_type_not_found] {
    mutate {
      replace => {
        "principal_present" => "false"
        "target_present" => "false"
        "target_ip_present" => "false"
        "principal_machine_id_present" => "false"
        "target_machine_id_present" => "false"
        "src_machine_id_present" => "false"
        "target_process_present" => "false"
        "target_file_present" => "false"
        "src_file_present" => "false"
        "dns_question_present" => "false"
        "principal_user_present" => "false"
        "target_user_present" => "false"
        "target_registry_present" => "false"
        "principal_process_present" => "false"
        "target_application_present" => "false"
        "extensions_auth_present" => "false"
        "network_dhcp_present" => "false"
        "target_resource_present" => "false"
        "extensions_vulns_present" => "false"
        "target_process_product_specific_process_id_present" => "false"
        "target_process_file_present" => "false"
        "target_registry_registry_key_present" => "false"
        "network_direction" => ""
      }
    }
    mutate {
      replace => {
        "network_direction" =>
        "%{token_event.idm.read_only_udm.network.direction}"
      }
      on_error => "network_direction_replace"
    }
    for k,v in token_event.idm.read_only_udm.target map {
      if [k] == "ip" and [v] != "" {
        mutate {
          replace => { "target_ip_present" => "true" }
        }
      }
      if [k] in ["ip", "hostname", "mac", "asset_id"] {
        if [v] != "" {
          if [k] == "asset_id" {
            mutate {
              replace => {
                "asset_id_temp" => ""
                "vendor_template" => ""
              }
            }
            grok {
              match => {
                "v" => "%{DATA:vendor_template}:%{DATA:asset_id_temp}"
              }
              overwrite => ["vendor_template", "asset_id_temp"]
              on_error => "grok_not_matched"
            }
            if ![grok_not_matched] and [asset_id_temp] != "" {
              mutate {
                replace => { "target_machine_id_present" => "true" }
              }
            }
          } else {
            mutate {
              replace => { "target_machine_id_present" => "true" }
            }
          }
        }
      } else if [k] == "application" {
        if [v] != "" {
          mutate {
            replace => { "target_application_present" => "true" }
          }
        }
      }
      if [v] != "" {
        mutate {
          replace => { "target_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.principal map {
      if [k] in ["ip", "hostname", "mac", "asset_id"] {
        if [v] != "" {
          if [k] == "asset_id" {
            mutate {
              replace => {
                "asset_id_temp" => ""
                "vendor_template" => ""
              }
            }
            grok {
              match => {
                "v" => "%{GREEDYDATA:vendor_template}:%{GREEDYDATA:asset_id_temp}"
              }
              overwrite => ["vendor_template", "asset_id_temp"]
              on_error => "grok_not_matched"
            }
            if ![grok_not_matched] and [asset_id_temp] != "" {
              mutate {
                replace => { "principal_machine_id_present" => "true" }
              }
            }
          } else {
            mutate {
              replace => { "principal_machine_id_present" => "true" }
            }
          }
        }
      }
      if [v] != "" {
        mutate {
          replace => { "principal_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.src map {
      if [k] in ["ip", "hostname", "mac", "asset_id"] {
        if [v] != "" {
          if [k] == "asset_id" {
            mutate {
              replace => {
                "asset_id_temp" => ""
                "vendor_template" => ""
              }
            }
            grok {
              match => {
                "v" => "%{DATA:vendor_template}:%{DATA:asset_id_temp}"
              }
              overwrite => ["vendor_template", "asset_id_temp"]
              on_error => "grok_not_matched"
            }
            if ![grok_not_matched] and [asset_id_temp] != "" {
              mutate {
                replace => { "src_machine_id_present" => "true" }
              }
            }
          } else {
            mutate {
              replace => { "src_machine_id_present" => "true" }
            }
          }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.target.process map {
      if [v] != "" {
        mutate {
          replace => { "target_process_present" => "true" }
        }
      }
      if [k] == "file" {
        if [v] != "" {
          mutate {
            replace => { "target_process_file_present" => "true" }
          }
        }
      } else if [k] == "product_specific_process_id" {
        if [v] != "" {
          mutate {
            replace => {
              "target_process_product_specific_process_id_present" => "true"
            }
          }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.principal.process map {
      if [v] != "" {
        mutate {
          replace => { "principal_process_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.target.file map {
      if [v] != "" {
        mutate {
          replace => { "target_file_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.src.file map {
      if [v] != "" {
        mutate {
          replace => { "src_file_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.principal.user map {
      if [k] in ["userid", "windows_sid", "email_addresses", "employee_id"] {
        if [v] != "" {
          mutate {
            replace => { "principal_user_present" => "true" }
          }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.target.user map {
      if [k] in ["userid", "windows_sid", "email_addresses", "employee_id"] {
        if [v] != "" {
          mutate {
            replace => { "target_user_present" => "true" }
          }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.target.registry map {
      if [v] != "" {
        mutate {
          replace => { "target_registry_present" => "true" }
        }
      }
      if [k] == "registry_key" {
        if [v] != "" {
          mutate {
            replace => { "target_registry_registry_key_present" => "true" }
          }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.target.resource map {
      if [v] != "" {
        mutate {
          replace => { "target_resource_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.extensions.auth map {
      if [v] != "" {
        mutate {
          replace => { "extensions_auth_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.extensions.vulns map {
      if [v] != "" {
        mutate {
          replace => { "extensions_vulns_present" => "true" }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.network.dns map {
      if [k] == "questions" {
        if [v] != "" {
          mutate {
            replace => { "dns_question_present" => "true" }
          }
        }
      }
    }
    for k,v in token_event.idm.read_only_udm.network.dhcp map {
      if [v] != "" {
        mutate {
          replace => { "network_dhcp_present" => "true" }
        }
      }
    }
    if [udm_event_type] in ["SETTING_CREATION", "SETTING_DELETION",
    "SETTING_MODIFICATION", "SETTING_UNCATEGORIZED"] {
      mutate {
        replace => {
          "token_event.idm.read_only_udm.target.resource.resource_type"
          => "SETTING"
        }
      }
    }
    if [udm_event_type] in ["SCHEDULED_TASK_CREATION",
    "SCHEDULED_TASK_DELETION", "SCHEDULED_TASK_DISABLE",
    "SCHEDULED_TASK_ENABLE", "SCHEDULED_TASK_MODIFICATION",
    "SCHEDULED_TASK_UNCATEGORIZED"] {
      mutate {
        replace => {
          "token_event.idm.read_only_udm.target.resource.resource_type"
          => "TASK"
        }
      }
    }
    if [udm_event_type] in ["MUTEX_CREATION", "MUTEX_UNCATEGORIZED"] {
      mutate {
        replace => {
          "token_event.idm.read_only_udm.target.resource.resource_type"
          => "MUTEX"
        }
      }
    }
    if [udm_event_type] == "NETWORK_DNS" {
      mutate {
        replace => {
          "token_event.idm.read_only_udm.network.application_protocol"
          => "DNS"
        }
      }
    }
    if [udm_event_type] == "NETWORK_DHCP" {
      mutate {
        replace => {
          "token_event.idm.read_only_udm.network.application_protocol"
          => "DHCP"
        }
      }
    }
    if [udm_event_type] in ["FILE_MODIFICATION", "FILE_CREATION",
    "FILE_DELETION", "FILE_UNCATEGORIZED", "SCAN_FILE", "FILE_READ",
    "FILE_OPEN"] and
    ([principal_machine_id_present] == "false" or
    [target_file_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["FILE_MOVE", "FILE_COPY"] and
    ([principal_machine_id_present] == "false" or
    [target_file_present] == "false" or
    [src_file_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "FILE_SYNC" and
    ([principal_machine_id_present] == "false" or
    [target_present] == "false" or
    ([target_file_present] == "false" and
    [src_file_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["GROUP_CREATION", "GROUP_UNCATEGORIZED",
    "GROUP_DELETION", "GROUP_MODIFICATION"] and
    ([principal_user_present] == "false" or
    [target_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["RESOURCE_CREATION", "RESOURCE_DELETION",
    "RESOURCE_PERMISSIONS_CHANGE", "RESOURCE_READ", "RESOURCE_WRITTEN"] and
    ([principal_user_present] == "false" or
    [target_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["SETTING_CREATION", "SETTING_DELETION",
    "SETTING_MODIFICATION", "SETTING_UNCATEGORIZED"] and
    [principal_machine_id_present] == "false" {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "NETWORK_CONNECTION" and
    ([principal_machine_id_present] == "false" or
    ([principal_process_present] == "false" and
    [target_process_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
      if ([network_direction] in ["INBOUND", "OUTBOUND"] and
      [target_ip_present] == "false") {
        mutate { replace => { "udm_event_type" => "GENERIC_EVENT" } }
      }
    } else if [udm_event_type] == "NETWORK_CONNECTION" and
    (([principal_machine_id_present] == "false" and
    [src_machine_id_present] == "false") or
    [target_machine_id_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["NETWORK_UNCATEGORIZED", "NETWORK_FLOW",
    "NETWORK_FTP", "NETWORK_HTTP", "NETWORK_SMTP"] and
    (([principal_machine_id_present] == "false" and
    [src_machine_id_present] == "false") or
    [target_machine_id_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "NETWORK_DNS" and
    ([principal_machine_id_present] == "false" or
    [dns_question_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "NETWORK_DHCP" and
    ([principal_machine_id_present] == "false" or
    [network_dhcp_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["PROCESS_UNCATEGORIZED", "PROCESS_LAUNCH",
    "PROCESS_INJECTION", "PROCESS_TERMINATION", "PROCESS_OPEN"] and
    ([principal_machine_id_present] == "false" or
    [target_process_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "PROCESS_PRIVILEGE_ESCALATION" and
    ([principal_process_present] == "false" or
    [principal_user_present] == "false" or
    [target_present] == "false" or
    [principal_machine_id_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "PROCESS_MODULE_LOAD" and
    ([principal_machine_id_present] == "false" or
    [principal_process_present] == "false" or
    [target_process_present] == "false" or
    ([target_process_product_specific_process_id_present] == "false" and
    [target_process_file_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["REGISTRY_UNCATEGORIZED",
    "REGISTRY_MODIFICATION", "REGISTRY_DELETION", "REGISTRY_CREATION"] and
    ([principal_machine_id_present] == "false" or
    [target_registry_present] == "false" or
    [target_registry_registry_key_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["SERVICE_UNSPECIFIED", "SERVICE_CREATION",
    "SERVICE_DELETION", "SERVICE_MODIFICATION", "SERVICE_START",
    "SERVICE_STOP"] and
    ([principal_machine_id_present] == "false" or
    ([target_process_present] == "false" and
    [target_application_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["SCAN_PROCESS_BEHAVIORS", "SCAN_PROCESS"]
    and ([principal_machine_id_present] == "false" or
    ([principal_process_present] == "false" and
    [target_process_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["SCAN_VULN_HOST", "SCAN_VULN_NETWORK"] and
    ([principal_machine_id_present] == "false" or
    [extensions_vulns_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["USER_LOGIN", "USER_LOGOUT",
    "USER_BADGE_IN"] and
    ([target_present] == "false" or
    [extensions_auth_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["USER_CHANGE_PASSWORD",
    "USER_CHANGE_PERMISSIONS"] and
    ([target_present] == "false" or
    ([target_user_present] == "false" and
    [principal_user_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["USER_CREATION", "USER_DELETION"] and
    ([target_user_present] == "false" or
    [principal_user_present] == "false" or
    ([target_application_present] == "false" and
    [principal_machine_id_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["USER_RESOURCE_CREATION",
    "USER_RESOURCE_UPDATE_CONTENT",
    "USER_RESOURCE_UPDATE_PERMISSIONS"] and
    ([principal_user_present] == "false" or
    [target_resource_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "USER_COMMUNICATION" and
    [principal_user_present] == "false" {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] == "USER_UNCATEGORIZED" and
    (([target_present] == "false" and
    [principal_user_present] == "false" and
    [principal_machine_id_present] == "false") or
    ([target_user_present] == "false" and
    [target_machine_id_present] == "false" and
    [principal_user_present] == "false")) {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["SCHEDULED_TASK_CREATION",
    "SCHEDULED_TASK_DELETION", "SCHEDULED_TASK_DISABLE",
    "SCHEDULED_TASK_ENABLE", "SCHEDULED_TASK_MODIFICATION",
    "SCHEDULED_TASK_UNCATEGORIZED"] and
    ([principal_user_present] == "false" or
    [principal_machine_id_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["SYSTEM_AUDIT_LOG_UNCATEGORIZED",
    "SYSTEM_AUDIT_LOG_WIPE"] and
    ([principal_user_present] == "false" or
    [principal_machine_id_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    } else if [udm_event_type] in ["MUTEX_CREATION", "MUTEX_UNCATEGORIZED"]
    and ([principal_machine_id_present] == "false" or
    [principal_process_present] == "false" or
    [target_resource_present] == "false") {
      mutate { replace => { "udm_event_type" => "STATUS_UPDATE" } }
    }
    if ([network_direction] in ["INBOUND", "OUTBOUND"] and
    [target_ip_present] == "false") {
      if [udm_event_type] in [
      "PROCESS_UNCATEGORIZED", "PROCESS_LAUNCH", "PROCESS_INJECTION",
      "PROCESS_PRIVILEGE_ESCALATION", "PROCESS_TERMINATION", "PROCESS_OPEN",
      "PROCESS_MODULE_LOAD", "REGISTRY_UNCATEGORIZED", "REGISTRY_CREATION",
      "REGISTRY_MODIFICATION", "REGISTRY_DELETION", "SETTING_UNCATEGORIZED",
      "SETTING_CREATION", "SETTING_MODIFICATION", "SETTING_DELETION",
      "MUTEX_UNCATEGORIZED", "MUTEX_CREATION", "FILE_UNCATEGORIZED",
      "FILE_CREATION", "FILE_DELETION", "FILE_MODIFICATION", "FILE_READ",
      "FILE_COPY", "FILE_OPEN", "FILE_MOVE", "FILE_SYNC",
      "SCAN_UNCATEGORIZED", "SCAN_FILE", "SCAN_PROCESS_BEHAVIORS",
      "SCAN_PROCESS", "SCAN_HOST", "SCAN_VULN_HOST", "SCAN_VULN_NETWORK",
      "SCAN_NETWORK", "SCHEDULED_TASK_UNCATEGORIZED",
      "SCHEDULED_TASK_CREATION", "SCHEDULED_TASK_DELETION",
      "SCHEDULED_TASK_MODIFICATION", "SCHEDULED_TASK_ENABLE",
      "SCHEDULED_TASK_DISABLE", "SERVICE_UNSPECIFIED", "SERVICE_CREATION",
      "SERVICE_DELETION", "SERVICE_START", "SERVICE_STOP",
      "STATUS_UNCATEGORIZED", "STATUS_HEARTBEAT", "STATUS_STARTUP",
      "STATUS_SHUTDOWN", "STATUS_UPDATE", "SYSTEM_AUDIT_LOG_UNCATEGORIZED",
      "SYSTEM_AUDIT_LOG_WIPE"] {
        mutate { replace => { "udm_event_type" => "GENERIC_EVENT" } }
      }
    }
    if [udm_event_type] in ["STATUS_UPDATE", "STATUS_UNCATEGORIZED",
    "STATUS_HEARTBEAT", "STATUS_STARTUP", "STATUS_SHUTDOWN",
    "SCAN_UNCATEGORIZED", "SCAN_HOST", "SCAN_NETWORK",
    "DEVICE_CONFIG_UPDATE", "DEVICE_PROGRAM_DOWNLOAD",
    "DEVICE_FIRMWARE_UPDATE", "DEVICE_PROGRAM_UPLOAD"] and
    [principal_machine_id_present] == "false" {
      mutate { replace => { "udm_event_type" => "GENERIC_EVENT" } }
    }
    mutate {
      replace => {
        "token_event.idm.read_only_udm.metadata.event_type"
        => "%{udm_event_type}"
      }
    }
  }

  mutate {
    remove_field => [
      "token_metadata", "token_principal", "token_target",
      "token_observer", "token_intermediary", "token_additional",
      "token_security_result", "main_security_result",
      "syslog_octet_count", "pri", "syslog_version", "PanOSTimeGeneratedHighResolution",
      "dvchost", "app_name", "proc_id", "msg_id", "structured_data",
      "cef_version", "DeviceVendor", "DeviceProduct", "DeviceVersion",
      "DeviceEventClassID", "Name", "CEFSeverity", "cef_extensions",
      "rt", "start", "dtz",
      "message_check", "cloud_provider_check", "dev_product_check",
      "dev_vendor_check", "sw_entry", "token_intermediary_list", "lbl_platform_type", "dvchost_check", "app_name_check",
      "proc_id_check", "platform_type_check", "scan_start_check",
      "completed_ts_check",
      "scan_id_check", "sub_req_id_check", "transaction_id_check",
      "cef_severity_check", "incident_subtype_check",
      "incident_type_check", "pan_action_check", "verdict_check",
      "fprompt_action_check", "fprompt_verdict_check",
      "fresponse_action_check", "fresponse_verdict_check",
      "is_prompt_check", "is_response_check", "req_response_check",
      "content_masked_check", "content_type_check", "is_code_check",
      "prompt_agent_check", "prompt_dlp_check", "prompt_mc_check",
      "prompt_pi_check", "prompt_tc_check", "prompt_tg_check",
      "prompt_urlf_check", "det_svc_flags_check", "max_latency_check",
      "resp_agent_check", "resp_cg_check", "resp_dbs_check",
      "resp_dlp_check", "resp_mc_check", "resp_tc_check",
      "resp_tg_check", "resp_urlf_check", "agent_framework_check",
      "agent_id_check", "mcp_server_check", "struct_data_check",
      "scan_log_id_combined", "log_id_discriminator",
      "severity_verdict_check", "var_category",
      "var_action", "var_fprompt_action", "var_fprompt_enum",
      "var_fresponse_action", "var_fresponse_enum",
      "lbl_csp_name", "lbl_app_env", "lbl_ts_high_res",
      "lbl_sub_req_id", "lbl_transaction_id", "lbl_event_class",
      "lbl_verdict", "lbl_fprompt_verdict", "lbl_fresponse_verdict",
      "lbl_is_prompt", "lbl_is_response", "lbl_req_response",
      "lbl_content_masked", "lbl_content_type", "lbl_is_code",
      "lbl_prompt_agent", "lbl_prompt_dlp", "lbl_prompt_mc",
      "lbl_prompt_pi", "lbl_prompt_tc", "lbl_prompt_tg",
      "lbl_prompt_urlf", "lbl_det_svc_flags", "lbl_scan_type",
      "lbl_max_latency", "lbl_resp_agent", "lbl_resp_cg",
      "lbl_resp_dbs", "lbl_resp_dlp", "lbl_resp_mc", "lbl_resp_tc",
      "lbl_resp_tg", "lbl_resp_urlf", "lbl_agent_framework",
      "lbl_agent_id", "lbl_text_records", "lbl_tokens64", "lbl_latency",
      "lbl_dtz", "lbl_msg_id", "lbl_pri", "lbl_struct_data",
      "lbl_syslog_ver", "lbl_tool_name", "lbl_csp_id", "lbl_api_region",
      "lbl_scan_start_ts", "lbl_completed_ts",
      "dev_vendor_check", "sw_entry", "token_intermediary_list", "lbl_platform_type",
      "principal_present", "target_present", "target_ip_present",
      "principal_machine_id_present", "target_machine_id_present",
      "src_machine_id_present", "target_process_present",
      "target_file_present", "src_file_present", "dns_question_present",
      "principal_user_present", "target_user_present",
      "target_registry_present", "principal_process_present",
      "target_application_present", "extensions_auth_present",
      "network_dhcp_present", "target_resource_present",
      "extensions_vulns_present",
      "target_process_product_specific_process_id_present",
      "target_process_file_present",
      "target_registry_registry_key_present",
      "network_direction", "asset_id_temp", "vendor_template",
      "udm_event_type", "udm_event_type_not_found"
    ]
  }

  mutate {
    merge => { "@output" => "token_event" }
  }
}
