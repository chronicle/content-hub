filter {
  mutate {
    replace => {
      "action" => ""
      "sport" => ""
      "prettyType" => ""
      "destinationIp" => ""
      "destinationCountry" => ""
      "clientIP" => ""
      "sourceIp" => ""
      "fieldsMap.domain_name" => ""
      "fieldsMap.rule_name" => ""
      "fieldsMap.rule_id" => ""
      "fieldsMap.pop_name" => ""
      "fieldsMap.os_type" => ""
      "fieldsMap.ip_protocol" => ""
      "fieldsMap.categories" => ""
      "fieldsMap.ISP_name" => ""
      "fieldsMap.dest_ip" => ""
      "fieldsMap.dest_port" => ""
      "fieldsMap.src_ip" => ""
      "fieldsMap.src_isp_ip" => ""
      "fieldsMap.action" => ""
      "fieldsMap.dest_country" => ""
      "fieldsMap.event_sub_type" => ""
      "fieldsMap.event_type" => ""
      "time_str" => ""
      "dest_port" => ""
      "dest_ip" => ""
      "src_ip" => ""
      "os_type" => ""
      "pop_name" => ""
      "domain_name" => ""
      "account_id" => ""
      "event_sub_type" => ""
      "rule_name" => ""
      "rule_id" => ""
      "user_id" => ""
      "http_host_name" => ""
      "dns_name" => ""
      "dns_query" => ""
      "dns_record_type" => ""
      "event_count" => ""
      "event_type" => ""
      "flow_id" => ""
      "client_ip" => ""
      "server_ip" => ""
      "application_type" => ""
      "src_endpoint_type" => ""
      "is_cloud_app" => ""
      "dest_endpoint_type" => ""
      "src_site_name" => ""
      "insertionDate" => ""
      "internalId" => ""
      "subnet_name" => ""
      "categories" => ""
      "app_stack" => ""
      "custom_categories" => ""
      "src_country_code" => ""
      "dest_country_code" => ""
      "is_sanctioned_app" => ""
      "src_is_site_or_vpn" => ""
      "ISP_name" => ""
      "src_site" => ""
      "rule" => ""
      "src_isp_ip" => ""
      "application" => ""
      "ip_protocol" => ""
      "src_country" => ""
      "dest_country" => ""
      "sourceCountry" => ""
      "tar_ip" => ""
      "prin_ip" => ""
      "risk_level" => ""
      "severity" => ""
      "user_principal_name" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "sr_action" => ""
      "security_result" => ""
      "time" => ""
      "client_version" => ""
      "user_name" => ""
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "intermediary" => ""
      "ad_name" => ""
      "host_ip" => ""
      "host_mac" => ""
      "internal_id" => ""
      "event_id" => ""
      "link_type" => ""
      "os_version" => ""
      "src_site_id" => ""
      "tunnel_protocol" => ""
      "visible_device_id" => ""
      "vpn_user_email" => ""
      "account_name" => ""
      "static_host" => ""
      "event_message" => ""
      "alert_id" => ""
      "connector_name" => ""
      "connector_type" => ""
      "epp_engine_type" => ""
      "full_path_url" => ""
      "incident_id" => ""
      "parent_connector_name" => ""
      "recommended_actions" => ""
      "device_name" => ""
      "configured_host_name" => ""
      "status" => ""
      "threat_name" => ""
      "threat_type" => ""
      "title" => ""
      "vendor" => ""
      "vendor_device_id" => ""
      "engine_type" => ""
      "logged_in_user.0" => ""
      "event_data_available" => "false"
      "device_posture_profile" => ""
      "user_sid" => ""
      "trust_level" => ""
      "application_risk" => ""
      "application_id" => ""
      "cato_app" => ""
      "client_class" => ""
      "congestion_algorithm" => ""
      "custom_category" => ""
      "custom_category_id" => ""
      "custom_category_name" => ""
      "http_request_method" => ""
      "network_rule" => ""
      "public_ip" => ""
      "qos_priority" => ""
      "tcp_acceleration" => ""
      "threat_verdict" => ""
      "tls_inspection" => ""
      "traffic_direction" => ""
      "user_object_id" => ""
      "always_on_configuration" => ""
      "connect_on_boot" => ""
      "device_certificate" => ""
      "office_mode" => ""
      "pac_file" => ""
      "split_tunnel_configuration" => ""
      "trusted_networks" => ""
      "vpn_lan_access" => ""
      "src_or_dest_site_id" => ""
      "src_port" => ""
      "connection_origin" => ""
      "application_name" => ""
      "dest_is_site_or_vpn" => ""
      "dest_site_id" => ""
      "dest_site_name" => ""
      "admin" => ""
      "admin_id" => ""
      "change" => ""
      "change_type" => ""
      "creation_date" => ""
      "insertion_date" => ""
      "model_name" => ""
      "model_type" => ""
      "module" => ""
      "change_After_overrideCategories" => ""
      "change_Before_overrideCategories" => ""
      "admin_name" => ""
      "change_After_publish" => ""
      "macAddress" => ""
      "flowLogGUID" => ""
      "category" => ""
      "flowLogResourceID" => ""
      "targetResourceID" => ""
      "flowLogVersion" => ""
      "operationName" => ""
      "macAddress_data" => ""
      "source_ip" => ""
      "destination_ip" => ""
      "destination_port" => ""
      "source_country" => ""
      "source_site" => ""
      "signature_id" => ""
    }
  }
  mutate {
    gsub => ["message","change.After.overrideCategories","change_After_overrideCategories"]
  }
  mutate {
    gsub => ["message","change.Before.overrideCategories","change_Before_overrideCategories"]
  }
  mutate {
    gsub => ["message","change.After.publish","change_After_publish"]
  }
  json {
    source   => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }

  if [_not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "category"
      }
      on_error => "category_failure"
    }
  }
  for index, field in fields {
    mutate {
      convert => {
        index => "string"
      }
      on_error => "index_already_string"
    }
    mutate {
      replace => {
        "field_name_data" => ""
        "field_value_name_label" => ""
        "field_value_id_label" => ""
        "field_value_type_label" => ""
        "model_type_label" => ""
        "field_name" => ""
      }
    }
    mutate {
      replace => {
        "field_name" => "%{field.name}"
      }
      on_error => "field_name_empty"
    }
    if [field_name] == "admin_id" {
      mutate {
        replace => {
          "admin_id" => "%{field.value.string}"
        }
        on_error => "admin_id_empty"
      }
    }
    if [field_name] == "account_id" {
      mutate {
        replace => {
          "account_id" => "%{field.value.string}"
        }
        on_error => "account_id_empty"
      }
    }
    if [field_name] == "change_type" {
      mutate {
        replace => {
          "change_type" => "%{field.value.string}"
        }
        on_error => "change_type_empty"
      }
    }
    if [field_name] == "module" {
      mutate {
        replace => {
          "module" => "%{field.value.string}"
        }
        on_error => "module_empty"
      }
    }
    if [field_name] == "model_name" {
      mutate {
        replace => {
          "model_name" => "%{field.value.string}"
        }
        on_error => "model_name_empty"
      }
    }
    if [field_name] == "change_After_publish" {
      mutate {
        replace => {
          "change_After_publish" => "%{field.value.string}"
        }
        on_error => "change_After_publish_empty"
      }
    }
    if [field_name] == "insertion_date" {
      mutate {
        replace => {
          "insertion_date" => "%{field.value.date}"
        }
        on_error => "insertion_date_empty"
      }
    }
    if [field_name] == "creation_date" {
      mutate {
        replace => {
          "creation_date" => "%{field.value.string}"
        }
        on_error => "creation_date_empty"
      }
    }
    if [field_name] == "model_type" {
      mutate {
        replace => {
          "model_type_label.value.string_value" => "%{field.value.string}"
        }
        on_error => "model_type_label_value_empty"
      }
      if ![model_type_label_value_empty] {
        mutate {
          replace => {
            "model_type_label.key" => "model_type"
          }
          on_error => "model_type_label_key_empty"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "model_type_label"
          }
          on_error => "model_type_label_empty"
        }
      }
    }
    if [index] == "0" {
      mutate {
        replace => {
          "field_name_data" => "%{field.name}"
        }
        on_error => "field_name_data_replace_failure"
      }
      if [field_name_data] != "" {
        mutate {
          replace => {
            "field_name_data.name" => "%{field_name_data}"
          }
          on_error => "field_name_data_name_empty"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.attribute.roles" => "field_name_data"
          }
          on_error => "field_name_data_failure"
        }
      }
    }
    mutate {
      replace => {
        "field_value_name_label.value" => "%{field.value.name}"
      }
      on_error => "field_name_value_name_label_value_empty"
    }
    if ![field_name_value_name_label_value_empty] and [field_value_name_label][value] != "" {
      mutate {
        replace => {
          "field_value_name_label.key" => "name_detail"
        }
        on_error => "field_name_value_name_label_key_empty"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.labels" => "field_value_name_label"
        }
        on_error => "field_name_value_name_label_empty"
      }
    }
     mutate {
      replace => {
        "field_value_id_label.value" => "%{field.value.id}"
      }
      on_error => "field_value_id_label_value_empty"
    }
    if ![field_value_id_label_value_empty] and [field_value_id_label][value] != "" {
      mutate {
        replace => {
          "field_value_id_label.key" => "id_detail"
        }
        on_error => "field_value_id_label_key_empty"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.labels" => "field_value_id_label"
        }
        on_error => "field_value_id_label_empty"
      }
    }
    mutate {
      replace => {
        "field_value_type_label.value" => "%{field.value.type}"
      }
      on_error => "field_value_type_label_value_empty"
    }
    if ![field_value_type_label_value_empty] and [field_value_type_label][value] != "" {
      mutate {
        replace => {
          "field_value_type_label.key" => "type_detail"
        }
        on_error => "field_value_type_label_key_empty"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.labels" => "field_value_type_label"
        }
        on_error => "field_value_type_label_empty"
      }
    }
  }
  mutate {
    convert =>  {
      "start"        => "string"
      "file_size"    => "uinteger"
      "server_port"  => "integer"
    }
  }
  date {
    match => ["start", "UNIX_MS" ]
    on_error => "start_not_found"
  }
  if [start_not_found] {
    date {
      match => ["fieldsMap.time", "UNIX_MS"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "not_found"
    }
  }
  if [time_str] != "" {
    date {
      match => ["time_str", "ISO8601", "yyyy-MM-ddTHH:mm:ssZ", "UNIX_MS", "UNIX"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "time_str_empty"
    }
  }
  else if [time] != "" {
    date {
      match => ["time", "ISO8601", "yyyy-MM-ddTHH:mm:ssZ", "UNIX_MS", "UNIX"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "time_empty"
    }
  }
  if [creation_date] != "" {
    date {
      match => ["creation_date", "UNIX_MS"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "creation_date_empty"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Cato Networks"
      "event.idm.read_only_udm.metadata.product_name" => "SASE"
    }
  }
  if [user_principal_name] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "user_principal_name"
      }
    }
    mutate {
      replace => {
        "has_principal_user" => "true"
      }
    }
  }
  if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  if [prettyType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{prettyType}"
      }
    }
  } else if [fieldsMap][event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{fieldsMap.event_type}"
      }
    }
  } else if [model_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{model_type}"
      }
      on_error => "model_type_empty"
    }
  }
  else if [operationName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{operationName}"
      }
      on_error => "operationName_empty"
    }
  }

  # Target
  if [destinationIp] != "" {
    mutate {
      replace => {
        "tar_ip" => "%{destinationIp}"
      }
      on_error => "tar_ip_empty"
    }
  } else if [fieldsMap][dest_ip] != "" {
    mutate {
      replace => {
        "tar_ip" => "%{fieldsMap.dest_ip}"
      }
      on_error => "fieldsMap_dest_ip_empty"
    }
  }else if [dest_ip] != "" {
    mutate {
      replace => {
        "tar_ip" => "%{dest_ip}"
      }
      on_error => "dest_ip_empty"
    }
  }

  if [tar_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "tar_ip"
        "event.idm.read_only_udm.target.asset.ip" => "tar_ip"
      }
      on_error => "tar_ip_failure"
    }
    if ![tar_ip_failure] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [dest_port] != "" {
    mutate {
      convert => {
        "dest_port" => "integer"
      }
    }
    mutate {
      rename => {
        "dest_port" => "event.idm.read_only_udm.target.port"
      }
    }
  }

  if [clientIP] != "" {
    mutate {
      replace => {
        "prin_ip" => "%{clientIP}"
      }
      on_error => "prin_ip_empty"
    }
  } else if [fieldsMap][src_ip] != "" {
    mutate {
      replace => {
        "prin_ip" => "%{fieldsMap.src_ip}"
      }
      on_error => "fieldsMap_src_ip_empty"
    }
  } else if [src_ip] != "" {
    mutate {
      replace => {
        "prin_ip" => "%{src_ip}"
      }
      on_error => "src_ip_empty"
    }
  }

  if [prin_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "prin_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "prin_ip"
      }
      on_error => "principal_ip_failure"
    }
    if ![principal_ip_failure] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  # Src
  if [src_isp_ip] != "" {
    mutate {
      replace => {
        "sourceIp" => "%{src_isp_ip}"
      }
      on_error => "sourceIp_not_found"
    }
  }

  if [sourceIp] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.nat_ip" => "sourceIp"
      }
      on_error => "sourceIp_empty"
    }
  } else if [fieldsMap][src_isp_ip] != "" and [fieldsMap][src_isp_ip] != "0.0.0.0" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.nat_ip" => "fieldsMap.src_isp_ip"
      }
      on_error => "src_isp_ip_empty"
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "action_field.value.string_value" => "%{action}"
      }
      on_error => "action_not_available"
    }
    if ![action_not_available] {
      mutate {
        replace => {
          "action_field.key" => "action"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "action_field"
        }
      }
    }
  }

  if [action] == "" {
    mutate {
      replace => {
        "action" => "%{fieldsMap.action}"
      }
      on_error => "action_empty"
    }
  }
  # Action
  mutate {
    uppercase  => ["action"]
  }
  if [action] in ["MONITOR","ALERT","SUCCEEDED","ALLOW","WHITELIST"]{
    mutate {
      replace => {
        "sr_action" => "ALLOW"
      }
    }
  }
  else if [action] in ["BLOCK","ACCESS_DENIED"] {
    mutate {
      replace => {
        "sr_action" => "BLOCK"
      }
    }
  }
  else if [action] == "FAILED" {
    mutate {
      replace => {
        "sr_action" => "FAIL"
      }
    }
  }
  else if [action] == "PROMPT" {
    mutate {
      replace => {
        "sr_action" => "CHALLENGE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "sr_action" => "UNKNOWN_ACTION"
      }
    }
  }
  if [fieldsMap][action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{fieldsMap.action}"
      }
    }
  }

  if [fieldsMap][dest_country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{fieldsMap.dest_country}"
      }
      on_error => "fieldsMap_dest_country_empty"
    }
  } else if [destinationCountry] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{destinationCountry}"
      }
      on_error => "destinationCountry_empty"
    }
  } else if [dest_country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{dest_country}"
      }
      on_error => "dest_country_empty"
    }
  }

  if [fieldsMap][dest_port] != "" {
    mutate {
      rename => {
        "fieldsMap.dest_port" => "event.idm.read_only_udm.principal.port"
      }
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
  } else if [sport] != "" {
    mutate {
      rename => {
        "sport" => "event.idm.read_only_udm.principal.port"
      }
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
  }
  else if [src_port] != "" {
    mutate {
      convert => {
        "src_port" => "string"
      }
      on_error => "src_port_already_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
      on_error => "src_port_already_integer"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "src_port_empty"
    }
  }

  if [fieldsMap][domain_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.administrative_domain" => "%{fieldsMap.domain_name}"
      }
      on_error => "fieldsMap_domain_name_empty"
    }
  }else if [domain_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.administrative_domain" => "%{domain_name}"
      }
      on_error => "domain_name_empty"
    }
  }

  if [fieldsMap][event_sub_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{fieldsMap.event_sub_type}"
      }
      on_error => "fieldsMap_event_sub_type_empty"
    }
  }else if [event_sub_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{event_sub_type}"
      }
      on_error => "event_sub_type_empty"
    }
  }

  if [fieldsMap][categories] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "fieldsMap.categories"
      }
    }
  }

  if [fieldsMap][ip_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{fieldsMap.ip_protocol}"
      }
      on_error => "fieldsMap_ip_protocol_empty"
    }
  }
  else if [ip_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{ip_protocol}"
      }
      on_error => "ip_protocol_empty"
    }
  }

  if [fieldsMap][os_type] =~ "LINUX" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "LINUX"
      }
    }
  }
  if [os_type] == "OS_WINDOWS" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform"  => "WINDOWS"
      }
    }
