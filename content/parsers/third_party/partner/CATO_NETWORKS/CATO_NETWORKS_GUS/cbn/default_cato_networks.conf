          "has_principal" => "true"
        }
      }
    }

    # UDM > Network
    mutate {
      replace => {
        "lease" => "86400"
        "mac" => "01:23:45:ab:cd:ef"
      }
    }

    mutate {
      convert => {
        "lease" => "uinteger"
      }
    }

    mutate {
      rename => {
        "lease" => "event.idm.read_only_udm.network.dhcp.lease_time_seconds"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "DHCP"
        "event.idm.read_only_udm.network.dhcp.type" => "ACK"
        "event.idm.read_only_udm.network.dhcp.opcode" => "BOOTREPLY"
        "event.idm.read_only_udm.network.dhcp.client_hostname" => "%{device_name}"
