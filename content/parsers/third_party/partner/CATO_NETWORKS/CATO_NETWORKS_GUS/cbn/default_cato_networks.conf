          "security_result.detection_fields" => "vpn_lan_access_field"
        }
        on_error => "vpn_lan_access_field_not_available"
      }
    }
  }
  if [src_or_dest_site_id] != "" {
    mutate {
      convert => {
        "src_or_dest_site_id" => "string"
      }
      on_error => "src_or_dest_site_id_not_available_convert"
    }
    mutate {
      replace => {
        "src_or_dest_site_id_field.key" => "src_or_dest_site_id"
        "src_or_dest_site_id_field.value" => "%{src_or_dest_site_id}"
      }
      on_error => "src_or_dest_site_id_not_available"
    }
    if ![src_or_dest_site_id_not_available] {
      mutate {
        merge => {
          "security_result.detection_fields" => "src_or_dest_site_id_field"
        }
        on_error => "src_or_dest_site_id_field_not_available"
      }
    }
  }
  if [src_is_site_or_vpn] != "" {
    mutate {
      replace => {
        "detection_src_is_site_or_vpn.value" => "%{src_is_site_or_vpn}"
      }
      on_error => "src_is_site_or_vpn_empty"
    }
    if ![src_is_site_or_vpn_empty] {
      mutate {
        replace => {
          "detection_src_is_site_or_vpn.key" => "src_is_site_or_vpn"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_src_is_site_or_vpn"
        }
        on_error => "detection_src_is_site_or_vpn_empty"
      }
    }
  }

  if [dest_is_site_or_vpn] != "" {
    mutate {
      replace => {
        "dest_is_site_or_vpn_field.value" => "%{dest_is_site_or_vpn}"
      }
      on_error => "dest_is_site_or_vpn_empty"
    }
    if ![dest_is_site_or_vpn_empty] {
      mutate {
        replace => {
          "dest_is_site_or_vpn_field.key" => "dest_is_site_or_vpn"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "dest_is_site_or_vpn_field"
        }
        on_error => "dest_is_site_or_vpn_field_empty"
      }
    }
  }
  if [dest_site_id] != "" {
    mutate {
      convert => {
        "dest_site_id" => "string"
      }
      on_error => "dest_site_id_is_string"
    }
    mutate {
      replace => {
        "dest_site_id_label.value" => "%{dest_site_id}"
      }
      on_error => "dest_site_id_empty"
    }
    if ![dest_site_id_empty] {
      mutate {
        replace => {
          "dest_site_id_label.key" => "dest_site_id"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "dest_site_id_label"
        }
        on_error => "dest_site_id_label_empty"
      }
    }
  }
  if [dest_site_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{dest_site_name}"
      }
      on_error => "dest_site_name_empty"
    }
  }
  else if [flowLogResourceID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{flowLogResourceID}"
      }
      on_error => "flowLogResourceID_empty"
    }
  }
  if [connection_origin] != "" {
    mutate {
      replace => {
        "connection_origin_field.value.string_value" => "%{connection_origin}"
      }
      on_error => "connection_origin_not_available"
    }
    if ![connection_origin_not_available] {
      mutate {
        replace => {
          "connection_origin_field.key" => "connection_origin"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection_origin_field"
        }
        on_error => "connection_origin_field_not_available"
      }
    }
  }
  if [application] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{application}"
      }
      on_error => "application_empty"
    }
  }

  if [application_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{application_name}"
      }
      on_error => "application_name_empty"
    }
  }
  if [module] != "" {
    mutate {
      replace => {
        "module_field.key" => "module"
        "module_field.value.string_value" => "%{module}"
      }
      on_error => "module_not_available"
    }
    if ![module_not_available] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "module_field"
        }
        on_error => "module_field_not_available"
      }
    }
  }
  if [model_name] != "" {
    mutate {
      replace => {
        "model_name_field.key" => "model_name"
        "model_name_field.value.string_value" => "%{model_name}"
      }
      on_error => "model_name_not_available"
    }
    if ![model_name_not_available] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "model_name_field"
        }
        on_error => "model_name_field_not_available"
      }
    }
  }
  if [insertion_date] != "" {
    mutate {
      convert => {
        "insertion_date" => "string"
      }
      on_error => "insertion_date_not_available_convert"
    }
    mutate {
      replace => {
        "insertion_date_field.key" => "insertion_date"
        "insertion_date_field.value.string_value" => "%{insertion_date}"
      }
      on_error => "insertion_date_not_available"
    }
    if ![insertion_date_not_available] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "insertion_date_field"
        }
        on_error => "insertion_date_field_not_available"
      }
    }
  }
  if [change_After_publish] != "" {
    mutate {
      replace => {
        "after_publish_field.key" => "change_After_publish"
        "after_publish_field.value.string_value" => "%{change_After_publish}"
      }
      on_error => "after_publish_not_available"
    }
    if ![after_publish_not_available] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "after_publish_field"
        }
        on_error => "after_publish_field_not_available"
      }
    }
  }
  if [macAddress] != "" {
     mutate {
      gsub => [
        "macAddress", "^([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})$", "$1:$2:$3:$4:$5:$6"
      ]
    }
    grok {
      match => {
        "macAddress" => [
          "%{MAC:macAddress_data}"
        ]
      }
      overwrite => ["macAddress_data"]
      on_error => "macAddress_not_valid"
    }
    if ![macAddress_not_valid] and [macAddress_data] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.mac" => "macAddress_data"
          "event.idm.read_only_udm.principal.asset.mac" => "macAddress_data"
        }
        on_error => "macAddress_empty"
      }
      if ![macAddress_empty] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [targetResourceID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{targetResourceID}"
      }
      on_error => "targetResourceID_empty"
    }
  }
  for flowIndex, flow in flowRecords.flows {
    mutate {
      convert => {
        "flowIndex" => "string"
      }
      on_error => "flow_index_already_string"
    }
    mutate {
      replace => {
        "aclID_label" => ""
      }
    }
    mutate {
      replace => {
        "aclID_label.value" => "%{flow.aclID}"
      }
      on_error => "aclID_label_replace_failed"
    }
    if ![aclID_label_replace_failed] and [aclID_label][value] != "" {
      mutate {
        replace => {
          "aclID_label.key" => "flowRecords_aclID %{flowIndex}"
        }
        on_error => "aclID_label_key_replace_failed"
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "aclID_label"
        }
        on_error => "aclID_label_merge_failed"
      }
    }
    for flowGroupIndex, flowGroup in flow.flowGroups {
      mutate {
        convert => {
          "flowGroupIndex" => "string"
        }
        on_error => "flow_group_index_already_string"
      }
      mutate {
        replace => {
          "rule_label" => ""
        }
      }
      mutate {
        replace => {
          "rule_label.value" => "%{flowGroup.rule}"
        }
        on_error => "rule_label_replace_failed"
      }
      if ![rule_label_replace_failed] and [rule_label][value] != "" {
        mutate {
          replace => {
            "rule_label.key" => "flowRecords_flowGroups_rule %{flowIndex} %{flowGroupIndex}"
          }
          on_error => "rule_label_key_replace_failed"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "rule_label"
          }
          on_error => "rule_label_merge_failed"
        }
      }
      for flowTupleIndex, flowTuple in flowGroup.flowTuples {
        mutate {
          convert => {
            "flowTupleIndex" => "string"
          }
          on_error => "flow_tuple_index_already_string"
        }
        mutate {
          replace => {
            "flowTuple_label" => ""
          }
        }
        mutate {
          replace => {
            "flowTuple_label.value" => "%{flowTuple}"
          }
          on_error => "flowTuple_label_replace_failed"
        }
        if ![flowTuple_label_replace_failed] and [flowTuple_label][value] != "" {
          mutate {
            replace => {
              "flowTuple_label.key" => "flowRecords_flowGroups_flowTuples %{flowIndex} %{flowGroupIndex} %{flowTupleIndex}"
            }
            on_error => "flowTuple_label_key_replace_failed"
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "flowTuple_label"
            }
            on_error => "flowTuple_label_merge_failed"
          }
        }
      }
    }
  }
  if [change_After_overrideCategories] != "" {
    mutate {
      replace => {
        "after_override_categories_field.key" => "After overrideCategories"
        "after_override_categories_field.value.string_value" => "%{change_After_overrideCategories}"
      }
      on_error => "after_override_categories_not_available"
    }
    if ![after_override_categories_not_available] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "after_override_categories_field"
        }
        on_error => "after_override_categories_field_not_available"
      }
    }
  }
  if [change_Before_overrideCategories] != "" {
    mutate {
      replace => {
        "before_override_categories_field.key" => "Before overrideCategories"
        "before_override_categories_field.value.string_value" => "%{change_Before_overrideCategories}"
      }
      on_error => "before_override_categories_not_available"
    }
    if ![before_override_categories_not_available] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "before_override_categories_field"
        }
        on_error => "before_override_categories_field_not_available"
      }
    }
  }
  if [change_type] != "" {
    mutate {
      replace => {
        "change_type_field.key" => "change_type"
        "change_type_field.value.string_value" => "%{change_type}"
      }
      on_error => "change_type_not_available"
    }
    if ![change_type_not_available] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "change_type_field"
        }
        on_error => "change_type_field_not_available"
      }
    }
  }
  # Logs containing fieldsMap
  if [ISP_name] != "" {
    mutate {
      replace => {
        "fieldsMap.ISP_name" => "%{ISP_name}"
      }
      on_error => "ISP_name_empty"
    }
  }
  if [fieldsMap][ISP_name] != "" {
    mutate {
      replace => {
        "additional_fields.value.string_value" => "%{fieldsMap.ISP_name}"
      }
      on_error => "ISP_name_not_available"
    }
    if ![ISP_name_not_available] {
      mutate {
        replace => {
          "additional_fields.key" => "ISP Name"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_fields"
        }
      }
    }
  }
  if [event][idm][read_only_udm][metadata][event_type] == "GENERIC_EVENT" {
    if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_principal_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  if [sr_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
      on_error => "security_result_action_empty"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => { "event.idm.read_only_udm.security_result" => "security_result" }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
