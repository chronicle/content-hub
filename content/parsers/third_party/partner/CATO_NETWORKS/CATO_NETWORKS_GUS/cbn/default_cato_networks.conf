    # we don't have a MAC address, so let's take the username
    mutate {
      replace => {
        "mac1" => "%{sourceName}"
      }
    }

    # we need valid hex chars, so replace anything that isn't
    # - get more dat, in case of non alpha chars
    mutate {
      gsub => [
        "mac1", "[gGhHiIjJkKlLmMnNoOpPqQrRsStTuUvVwWxXyYzZ ]", "0"
      ]
    }

    # build a fake mac
    grok {
      match => {
        "mac1" => "^(?P<a>..)(?P<b>..)(?P<c>..)"
      }
    }

    # finally, make the mac
    mutate {
      replace => {
        "mac" => "%{a}:%{b}:%{c}:%{c}:%{b}:%{a}"
      }
    }

    # make lowercase
    mutate {
      lowercase => [ "mac" ]
    }

    # check the MAC is correct length
    grok {
      match => {
        "mac" => "^(?P<is_it_a_mac>(?:[a-f0-9]{2}\:){5}(?:[a-f0-9]{2}))$"
      }
      on_error => "_grok_not_a_mac"
    }

    if [_grok_not_a_mac] {
      drop{}
    }

    # UDM > Metadata
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_DHCP"
      }
    }

    # UDM > Principal
