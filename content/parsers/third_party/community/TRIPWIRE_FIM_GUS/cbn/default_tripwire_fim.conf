# Product: Tripwire
# Category: DLP
# Supported Format: SYSLOG
# Reference: https://www.tripwire.com/products/tripwire-file-integrity-manager
# Last Updated: 2026-02-10
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "elementOID" => ""
      "blVersion" => ""
      "cs1" => ""
      "cs2" => ""
      "cs3" => ""
      "cs4" => ""
      "cs5" => ""
      "cs6" => ""
      "cn1" => ""
      "content" => ""
      "contentLabel" => ""
      "timezone" => ""
      "dvchost" => ""
      "severity" => ""
      "Size" => ""
      "SHA-1" => ""
      "dhost" => ""
      "MD5" => ""
      "sproc" => ""
      "start" => ""
      "dvc" => ""
      "duser" => ""
      "fname" => ""
      "rt" => ""
      "temp_data" => ""
      "licurl" => ""
      "time" => ""
      "cef_extension" => ""
      "device_event_class_id" => ""
      "device_version" => ""
      "event_name" => ""
      "device_product" => ""
      "application" => ""
      "assObj" => ""
      "category" => ""
      "change_type" => ""
      "ChangeType" => ""
      "datetime" => ""
      "desc" => ""
      "EventType" => ""
      "event_type" => ""
      "log_level" => ""
      "loguser" => ""
      "ldap_details" => ""
      "msg" => ""
      "metadata_description" => ""
      "nodeid" => ""
      "NodeIp" => ""
      "NodeName" => ""
      "process_id" => ""
      "processes" => ""
      "principal_user" => ""
      "product_logid" => ""
      "role" => ""
      "rules" => ""
      "security_action" => "ALLOW"
      "sevs" => ""
      "software_update" => ""
      "source_ip" => ""
      "source_hostname" => ""
      "target_hostname" => ""
      "target_ip" => ""
      "username" => ""
      "registry_key" => ""
      "registry_value" => ""
      "AffectedIP" => ""
      "AffectedHost" => ""
      "FileName" => ""
      "OS-Type" => ""
      "cs4Label" => ""
      "principal_mid_present" => "false"
      "TripwireEnterpriseIds" => ""
      "TripwireEnterpriseLogLevel" => ""
      "TripwireEnterpriseNodeId" => ""
      "src" => ""
      "cat" => ""
      "suser" => ""
      "deviceFacility" => ""
      "externalId" => ""
      "shost" => ""
      "hstname" => ""
      "file_path" => ""
      "user_id" => ""
      "summary" => ""
      "host" => ""
      "TripwireEnterpriseChangeType" => ""
      "TripwireEnterpriseElementId" => ""
      "TripwireEnterpriseElementName" => ""
      "TripwireEnterpriseNodeType" => ""
      "TripwireEnterpriseRule" => ""
      "TripwireEnterpriseRuleId" => ""
      "TripwireEnterpriseRuleType" => ""
      "TripwireEnterpriseSeverity" => ""
      "TripwireEnterpriseSeverityRange" => ""
      "TripwireEnterpriseUrl" => ""
      "TripwireEnterpriseVersionSha1" => ""
      "TripwireEnterpriseVersionSha512" => ""
      "deviceExternalId" => ""
      "fsize" => ""
      "dtz" => ""
      "actionDetail" => ""
      "asm_log_element" => ""
      "query" => ""
      "target_mid_present" => "false"
      "is_network_connection"  => "false"
    }
  }

  if [message] =~ "CEF:" {
    grok {
      match => {
        "message" => [
          "(?:<%{INT}>|%{DATA:temp_data})CEF:%{INT:version}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|(?:%{DATA:event_name}\\||)(?P<severity>Medium|MEDIUM|Low|LOW|HIGH|High|Unknown|%{INT})(?:\\||)%{GREEDYDATA:cef_extension}"
        ]
      }
      overwrite => ["version" ,"device_event_class_id", "device_product", "device_version", "event_name", "severity", "temp_data", "cef_extension"]
      on_error => "not_grok_pattern"
    }
  }

  if [cef_extension] != "" {
    mutate {
      gsub => ["cef_extension", "\\|", " "]
    }
    mutate {
      gsub => ["cef_extension", "(\\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
    }
    kv {
      source => "cef_extension"
      field_split => "^"
      value_split => "="
      whitespace => "strict"
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP:datetime} %{IP:source_ip} TE: %{GREEDYDATA:log_level} HostName=%{HOSTNAME:source_hostname} LogId=%{GREEDYDATA:product_logid} LogCategory=%{GREEDYDATA:category} LogUser=(?P<loguser>(([^=]+))) %{GREEDYDATA:desc}",
        "<%{INT}>%{GREEDYDATA:datetime} %{HOSTNAME:source_hostname} %{WORD}: %{WORD} (?P<principal_user>(CN=([^=]+),))%{GREEDYDATA:ldap_details} on %{HOSTNAME:target_hostname} by %{GREEDYDATA:msg}",
        "<%{INT}>%{GREEDYDATA:datetime} %{HOSTNAME:source_hostname} %{WORD}: %{WORD} %{GREEDYDATA:software_update} on %{HOSTNAME:target_hostname} by %{GREEDYDATA:msg}",
      ]
    }
    overwrite => ["datetime", "source_ip", "log_level", "source_hostname", "loguser", "desc", "username", "category", "principal_user", "target_hostname", "msg", "software_update", "product_logid", "ldap_details"]
    on_error => "grok_failure"
  }

  if [temp_data] != "" {
    grok {
      match => {
        "temp_data" => "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:time} %{HOSTNAME:hstname}.*"
      }
      overwrite => ["time", "hstname"]
      on_error => "temp_data_failure"
    }
  }
  if [hstname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{hstname}"
        "event.idm.read_only_udm.observer.asset.hostname" => "%{hstname}"
      }
      on_error => "hstname_failure"
    }
  }
  if [TripwireEnterpriseIds] != "" {
    mutate {
      replace => {
        "additional_TripwireEnterpriseIds.key" => "TripwireEnterpriseIds"
        "additional_TripwireEnterpriseIds.value" => "%{TripwireEnterpriseIds}"
      }
      on_error => "TripwireEnterpriseIds_failure"
    }
    if ![TripwireEnterpriseIds_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_TripwireEnterpriseIds"
        }
        on_error => "TripwireEnterpriseIds_merge_failure"
      }
    }
  }
  if [TripwireEnterpriseLogLevel] != "" {
    mutate {
      replace => {
        "additional_TripwireEnterpriseLogLevel.key" => "TripwireEnterpriseLogLevel"
        "additional_TripwireEnterpriseLogLevel.value" => "%{TripwireEnterpriseLogLevel}"
      }
      on_error => "TripwireEnterpriseLogLevel_failure"
    }
    if ![TripwireEnterpriseLogLevel_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_TripwireEnterpriseLogLevel"
        }
        on_error => "TripwireEnterpriseLogLevel_merge_failure"
      }
    }
  }
  if [TripwireEnterpriseNodeId] != "" {
    mutate {
      replace => {
        "additional_TripwireEnterpriseNodeId.key" => "TripwireEnterpriseNodeId"
        "additional_TripwireEnterpriseNodeId.value" => "%{TripwireEnterpriseNodeId}"
      }
      on_error => "TripwireEnterpriseNodeId_failure"
    }
    if ![TripwireEnterpriseNodeId_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_TripwireEnterpriseNodeId"
        }
        on_error => "TripwireEnterpriseNodeId_merge_failure"
      }
    }
  }
  if [TripwireEnterpriseChangeType] != "" {
    mutate {
      replace => {
        "additional_TripwireEnterpriseChangeType.key" => "TripwireEnterpriseChangeType"
        "additional_TripwireEnterpriseChangeType.value" => "%{TripwireEnterpriseChangeType}"
      }
      on_error => "TripwireEnterpriseChangeType_failure"
    }
    if ![TripwireEnterpriseChangeType_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_TripwireEnterpriseChangeType"
        }
        on_error => "TripwireEnterpriseChangeType_merge_failure"
      }
    }
  }
  if [TripwireEnterpriseElementId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{TripwireEnterpriseElementId}"
      }
      on_error => "TripwireEnterpriseElementId_failure_observer"
    }
  }
  if [TripwireEnterpriseElementName] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.file.names" => "TripwireEnterpriseElementName"
      }
      on_error => "TripwireEnterpriseElementName_failure_observer"
    }
  }
  if [TripwireEnterpriseNodeType] =~ "(?i)Windows" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform" => "WINDOWS"
      }
      on_error => "TripwireEnterpriseNodeType_failure_windows"
    }
  }
  else if [TripwireEnterpriseNodeType] =~ "(?i)Linux" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform" => "LINUX"
      }
      on_error => "TripwireEnterpriseNodeType_failure_linux"
    }
  }
  if [TripwireEnterpriseRule] != "" {
    mutate {
      replace => {
        "sec_result.rule_name" => "%{TripwireEnterpriseRule}"
      }
      on_error => "TripwireEnterpriseRule_failure_observer"
    }
  }
  if [TripwireEnterpriseRuleId] != "" {
    mutate {
      replace => {
        "sec_result.rule_id" => "%{TripwireEnterpriseRuleId}"
      }
      on_error => "TripwireEnterpriseRuleId_failure_observer"
    }
  }
  if [TripwireEnterpriseRuleType] != "" {
    mutate {
      replace => {
        "sec_result.rule_type" => "%{TripwireEnterpriseRuleType}"
      }
      on_error => "TripwireEnterpriseRuleType_failure_observer"
    }
  }
  if [TripwireEnterpriseSeverity] != "" {
    mutate {
      replace => {
        "additional_TripwireEnterpriseSeverity.value" => "%{TripwireEnterpriseSeverity}"
      }
      on_error => "TripwireEnterpriseSeverity_failure"
    }
    if ![TripwireEnterpriseSeverity_failure] {
      mutate {
        replace => {
          "additional_TripwireEnterpriseSeverity.key" => "TripwireEnterpriseSeverity"
        }
        on_error => "TripwireEnterpriseSeverity_failure"
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "additional_TripwireEnterpriseSeverity"
        }
        on_error => "TripwireEnterpriseSeverity_merge_failure"
      }
    }
  }
  if [TripwireEnterpriseSeverityRange] != "" {
    mutate {
      replace => {
        "additional_TripwireEnterpriseSeverityRange.value" => "%{TripwireEnterpriseSeverityRange}"
      }
      on_error => "TripwireEnterpriseSeverityRange_failure"
    }
    if ![TripwireEnterpriseSeverityRange_failure] {
      mutate {
        replace => {
          "additional_TripwireEnterpriseSeverityRange.key" => "TripwireEnterpriseSeverityRange"
        }
        on_error => "TripwireEnterpriseSeverityRange_failure"
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "additional_TripwireEnterpriseSeverityRange"
        }
        on_error => "TripwireEnterpriseSeverityRange_merge_failure"
      }
    }
  }
  if [TripwireEnterpriseUrl] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.url_back_to_product" => "%{TripwireEnterpriseUrl}"
      }
      on_error => "TripwireEnterpriseUrl_failure"
    }
  }
  if [TripwireEnterpriseVersionSha1] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha1" => "%{TripwireEnterpriseVersionSha1}"
      }
      on_error => "TripwireEnterpriseVersionSha1_failure"
    }
  }
  if [TripwireEnterpriseVersionSha512] =~ "^[0-9a-f]{64}$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{TripwireEnterpriseVersionSha512}"
      }
      on_error => "TripwireEnterpriseVersionSha512_failure"
    }
  }
  if [dtz] != "" {
    mutate {
      replace => {
        "dtz_label.key" => "dtz_value"
        "dtz_label.value" => "%{dtz}"
      }
      on_error => "dtz_failure"
    }
    if ![dtz_failure] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "dtz_label"
        }
        on_error => "dtz_merge_failure"
      }
    }
  }
  if [deviceExternalId] != "" {
    mutate {
      replace => {
        "deviceExternalId_label.value" => "%{deviceExternalId}"
      }
      on_error => "deviceExternalId_failure"
    }
    if ![deviceExternalId_failure] {
      mutate {
        replace => {
          "deviceExternalId_label.key" => "deviceExternalId"
        }
        on_error => "deviceExternalId_failure"
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "deviceExternalId_label"
        }
        on_error => "deviceExternalId_merge_failure"
      }
    }
  }
  if [fsize] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.size" => "%{fsize}"
      }
      on_error => "fsize_failure"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.file.size" => "uinteger"
      }
      on_error => "fsize_convert_failure"
    }
  }
  if [src] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "src"
        "event.idm.read_only_udm.target.asset.ip" => "src"

      }
      on_error => "src_failure"
    }
    if ![src_failure] {
      mutate {
        replace => {
          "target_mid_present" => "true"
        }
      }
    }
  }
  if [cat] != "" {
    mutate {
      merge => {
        "sec_result.category_details" => "cat"
      }
      on_error => "cat_failure"
    }
  }
  if [suser] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{suser}"
      }
      on_error => "suser_failure"
    }
  }
  if [deviceFacility] != "" {
    mutate {
      replace => {
        "device_facility_label.key" => "device_facility_label"
        "device_facility_label.value" => "%{deviceFacility}"
      }
      on_error => "device_facility_label_not_found"
    }
    if ![device_facility_label_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.observer.resource.attribute.labels" => "device_facility_label"
        }
        on_error => "device_facility_label_not_found"
      }
    }
  }
  if [externalId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{externalId}"
      }
      on_error => "external_id_not_found"
    }
  }
  if [shost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{shost}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{shost}"
      }
      on_error => "shost_failure"
    }
    if ![shost_failure] {
      mutate {
        replace => {
          "target_mid_present" => "true"
        }
      }
    }
  }
  if [msg] != "" {
    grok {
      match => {
        "msg" => ["'%{DATA:file_path}' accessed by '%{DATA:user_id}'. Type '%{DATA:summary}'.\\\\n\\\\nApplication: '%{DATA:application}'\\\\n",
                  "Automatically applied Tagging Profile '%{DATA:summary}' to Node: %{GREEDYDATA:target_hostname}.",
                  "Axon Agent %{GREEDYDATA:host} connected with capabilities \\[%{GREEDYDATA:processes}\\]",
                  "Modified %{DATA:file_path} on %{GREEDYDATA:host} for %{GREEDYDATA:summary}"
        ]
      }
      overwrite => ["user_id", "file_path", "summary", "application", "target_hostname", "host", "processes"]
      on_error => "msg_failure"
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "host_label.key" => "host_label"
        "host_label.value" => "%{host}"
      }
      on_error => "host_failure"
    }
    if ![host_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "host_label"
        }
        on_error => "host_merge_failure"
      }
    }
  }
  if [file_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{file_path}"
      }
      on_error => "file_path_failure"
    }
  }
  if [user_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{user_id}"
      }
      on_error => "user_id_failure"
    }
  }
  if [summary] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{summary}"
      }
      on_error => "summary_failure"
    }
  }
  grok {
    match => {
      "cef_extension" => "msg=%{DATA:application} %{HOSTNAME:hostname} connected with capabilities \\[%{GREEDYDATA:processes}\\]"
    }
    overwrite => ["application", "processes"]
    on_error => "msg_failure"
  }
  if [application] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{application}"
      }
      on_error => "application_failure"
    }
  }
  if [processes] != "" {
    mutate {
      replace => {
        "labels0.key" => "CAPABILITIES"
        "labels0.value" => "%{processes}"
      }
      on_error => "processes_failure"
    }
    if ![processes_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.labels" => "labels0"
        }
        on_error => "processes_merge_failure"
      }
    }
  }

  if [grok_failure] {
    mutate {
      replace => {
        "msg" => ""
      }
    }
  }

  if [rt] != "" {
    date {
      match => ["rt", "MMM dd yyyy HH:mm:ss", "MM dd yyyy HH:mm:ss ZZZ"]
      on_error => "rt_failure"
    }
  }

  if [start] != "" {
    date {
      match => ["start", "MMM d yyyy HH:mm:ss"]
      target => "event.idm.read_only_udm.target.resource.attribute.creation_time"
      on_error => "start_failure"
    }
  }

  if [AffectedIP] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "AffectedIP"
      }
      on_error => "AffectedIP_failure"
    }
    mutate {
      replace => {
        "principal_mid_present" => "true"
      }
    }
  }

  if [OS-Type] =~ "(?i)WINDOWS" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "WINDOWS"
      }
    }
  }
  else if [OS-Type] =~ "(?i)Solaris" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "LINUX"
      }
    }
  }

  if [dvc] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "dvc"
        "event.idm.read_only_udm.principal.asset.ip" => "dvc"
      }
      on_error => "dvc_failure"
    }
    mutate {
      replace => {
        "principal_mid_present" => "true"
      }
    }
  }

  if [duser] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{duser}"
      }
    }
  }


  if [AffectedHost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{AffectedHost}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{AffectedHost}"
        "principal_mid_present" => "true"
      }
      on_error => "AffectedHost_failure"
    }
  }
  if [FileName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{FileName}"
      }
    }
  }
  if [dvchost] not in ["", "null"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{dvchost}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{dvchost}"
        "principal_mid_present" => "true"
      }
      on_error => "dvchost_failure"
    }
  }
  if [dhost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{dhost}"
      }
      on_error => "dhost_failure"
    }
    if ![dhost_failure] {
      mutate {
        replace => {
          "target_mid_present" => "true"
        }
      }
    }
  }

  if [fname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{fname}"
      }
    }
  }

  if [MD5] not in ["" ,"Not available"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.md5" => "%{MD5}"
      }
    }
  }
  if [SHA-1] != "" {
    grok {
      match => {
        "SHA-1" => ".*After=%{GREEDYDATA:sha_1}"
      }
      on_error => "sha_1_failure"
    }
    if ![sha_1_failure] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.sha256" => "%{sha_1}"
        }
      }
    }
  }
  if [Size] != "" {
    grok {
      match => {
        "Size" => ".*After=%{GREEDYDATA:size}"
      }
      on_error => "Size_failure"
    }
    if ![Size_failure] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.size" => "%{size}"
        }
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.file.size" => "uinteger"
        }
      }
    }
  }

  if [sproc] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.src.process.command_line" => "%{sproc}"
      }
    }
  }

  if [cs1] != "" {
    mutate {
      replace => {
        "additional_cs1.key" => "%{cs1Label}"
        "additional_cs1.value" => "%{cs1}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_cs1"
      }
    }
  }

  if [cs2] not in ["", "null"] {
    mutate {
      replace => {
        "additional_cs2.key" => "%{cs2Label}"
        "additional_cs2.value" => "%{cs2}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_cs2"
      }
    }
  }

  if [cs3] not in ["", "null"] {
    mutate {
      replace => {
        "additional_cs3.key" => "%{cs3Label}"
        "additional_cs3.value" => "%{cs3}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_cs3"
      }
    }
  }

  if [cs4] != "" {
    if [cs4Label] != "" {
      mutate {
        replace => {
          "additional_cs4.key" => "%{cs4Label}"
          "additional_cs4.value" => "%{cs4}"
        }
        on_error => "cs4_failure"
      }
    }
    else {
      mutate {
        replace => {
          "additional_cs4.key" => "cs4"
          "additional_cs4.value" => "%{cs4}"
        }
        on_error => "cs4_failure"
      }
    }
    if ![cs4_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_cs4"
        }
        on_error => "cs4_merge_failure"
      }
    }
  }

  if [cs5] != "" {
    mutate {
      replace => {
        "additional_cs5.key" => "%{cs5Label}"
        "additional_cs5.value" => "%{cs5}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_cs5"
      }
    }
  }

  if [cs6] != "" {
    mutate {
      replace => {
        "additional_cs6.key" => "%{cs6Label}"
        "additional_cs6.value" => "%{cs6}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_cs6"
      }
    }
  }

  if [cn1] != "" {
    mutate {
      replace => {
        "additional_cn1.key" => "%{cn1Label}"
        "additional_cn1.value" => "%{cn1}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_cn1"
      }
    }
  }

  if [content] != "" and [contentLabel] != "" {
    mutate {
      replace => {
        "additional_content.key" => "%{contentLabel}"
        "additional_content.value" => "%{content}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_content"
      }
    }
  }
  if [timezone] != "" {
    mutate {
      replace => {
        "additional_timezone.key" => "%{timezoneLabel}"
        "additional_timezone.value" => "%{timezone}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_timezone"
      }
    }
  }

  if [elementOID] != "" {
    mutate {
      replace => {
        "additional_elementOID.key" => "%{elementOIDLabel}"
        "additional_elementOID.value" => "%{elementOID}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_elementOID"
      }
    }
  }

  if [blVersion] != "" {
    mutate {
      replace => {
        "additional_blVersion.key" => "%{blVersionLabel}"
        "additional_blVersion.value" => "%{blVersion}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_blVersion"
      }
    }
  }

  if [licurl] not in ["","Not available"] {
    mutate {
      replace => {
        "uri_about.url" => "%{licurl}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "uri_about"
      }
    }
  }

  if [severity] in ["0", "1", "2", "3", "LOW"] {
    mutate {
      replace => {
        "sec_result.severity" => "LOW"
      }
    }
  }
  else if [severity] in ["4", "5", "6", "MEDIUM"] {
    mutate {
      replace => {
        "sec_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] in ["7", "8", "HIGH"] {
    mutate {
      replace => {
        "sec_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] in ["9", "10", "VERY-HIGH"] {
    mutate {
      replace => {
        "sec_result.severity" => "CRITICAL"
      }
    }
  }


  if [category] != "" {
    mutate {
      gsub => ["category", '\"', ""]
    }
  }

  if [desc] != "" {
    kv {
      source => "desc"
      value_split => "="
      field_split => " "
      on_error => "not_utf"
    }
  }

  if [category] in [ "System", "Element Check" ] {
    grok {
      match => {
        "desc" => [
          "Msg=\\\"Axon Agent %{HOSTNAME:hostname} connected with capabilities \\[%{GREEDYDATA:processes}\\]",
          "Msg=\\\"Transaction \\(%{GREEDYDATA:process} %{INT:process_id}\\) %{GREEDYDATA}"
          "Msg=\\\"The node \\'%{HOSTNAME:hostname}\\' %{GREEDYDATA:data} was skipped for the following rules:\\[LF\\] - %{GREEDYDATA:rules}\"",
          "Msg=\\\"%{GREEDYDATA:msg}. \\(%{GREEDYDATA} %{DATESTAMP:date}%{DATA:AMPM}.\\)",
          "Msg=\\\"Rule %{GREEDYDATA:rules}.\\[LF\\]%{GREEDYDATA:msg}",
          "Msg=\\\"%{GREEDYDATA:msg}",
        ]
      }
      overwrite => ["nodeid",  "target_hostname", "target_ip", "assObj", "rules", "process_id", "processes", "hostname", "msg", "process" ]
      on_error => "desc_failure"
    }

    if [category] == "Element Check" or  [rules] != "" {
      mutate {
        replace => {
          "event_type" => "SCAN_HOST"
        }
      }
      if [msg] != "" && [rules] != "" {
        grok{
          match => {
            "rules" => ["\\'%{GREEDYDATA:rules}\\' %{GREEDYDATA:summary_temp}"]
          }
          overwrite => ["rules", "summary_temp"]
          on_error => "rules_failure"
        }
        mutate {
          replace => {
            "change_type" => "%{rules} %{summary_temp}"
          }
        }
      }
    }
    else if [process_id] != "" {
      grok {
        match => {
          "desc" => "Msg=\\\"%{GREEDYDATA:msg}\\\""
        }
        overwrite => ["msg"]
        on_error => "description_failure"
      }
      mutate {
        replace => {
          "event_type" => "PROCESS_INJECTION"
          "event.idm.read_only_udm.target.process.pid" => "%{process_id}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "application" => "Axon Agent"
          "event_type" => "NETWORK_CONNECTION"
          "is_network_connection" => "true"
        }
      }

      if [msg] =~ "shut down" {
        mutate {
          replace => {
            "event_type" => "SERVICE_STOP"
          }
        }
      }

      if [processes] != "" {
        mutate {
          replace => {
            "labels0.key" => "CAPABILITIES"
            "labels0.value" => "%{processes}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.labels" => "labels0"
          }
        }
      }
    }
  }
  else if [category] in [ "Task Stop", "Task Run", "Asset View Change" ] {
    grok {
      match => {
        "desc" => [
          "Msg=\\\"Task '%{GREEDYDATA:application}'",
          "\\'%{HOSTNAME:target_hostname}\\' %{GREEDYDATA} \\'%{GREEDYDATA:msg}\\'. \\(%{GREEDYDATA} %{DATESTAMP:date} %{DATA:AMPM}.\\)"
          "Msg=\\\"Node \'%{HOSTNAME:target_hostname}\' %{GREEDYDATA} \'%{GREEDYDATA:msg}\'",
          "Msg=\\\"%{GREEDYDATA:msg}: %{HOSTNAME:target_hostname}"
        ]
      }
      overwrite => ["application", "target_hostname", "msg"]
      on_error => "desc_grok_pattern_failure"
    }
    mutate {
      replace => {
        "security_action" => "ALLOW"
      }
    }

    if [category] == "Task Stop" {
      if [application] == "" {
        mutate {
          replace => {
            "application" => "%{category}"
          }
        }
      }
      mutate {
        replace => {
          "event_type" => "SERVICE_STOP"
        }
      }
    }
    else if [category] == "Task Run" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.resource_type" => "TASK"
          "event_type" => "SCHEDULED_TASK_UNCATEGORIZED"
        }
      }
    }
    else if [category] == "Asset View Change" {
      mutate {
        replace => {
          "event_type" => "STATUS_UNCATEGORIZED"
        }
      }
    }

    if [desc] =~ ("timed out|timeout|error|Error") {
      mutate {
        replace => {
          "security_action" => "BLOCK"
        }
      }
    }
  }
  else if [category] == "Security" {
    grok {
      match => {
        "desc" => "Msg=\\\"User \'%{GREEDYDATA:username}\'"
      }
      overwrite => ["username"]
      on_error => "match_error"
    }
    if [username] != "" {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          "loguser" => "%{username}"
        }
      }
    }
  }
  else if [category] == "Action" {
    grok {
      match => {
        "desc" => ["Msg=\\\"Promoting Element \\''%{GREEDYDATA:software_update}\\' from Node \\'%{HOSTNAME:target_hostname}\\' and Rule \\'%{GREEDYDATA:rules}\\''",
                   "Msg=\\\"Promoting Node \'%{GREEDYDATA:hostname}\'",
                   "Msg=\\\"Promoting Element Version \\''%{GREEDYDATA}\\' of Element \\'(?P<principal_user>(CN=([^=]+))) %{GREEDYDATA:ldap_details}\' from Node \\'%{HOSTNAME:target_hostname}\\' and Rule \\'%{GREEDYDATA:msg}\\''"
                   "Msg=\\\"Promoting Element Version \\''%{GREEDYDATA}\\' of Element \\'(?P<principal_user>(CN=([^=]+),))%{GREEDYDATA:ldap_details} from Node \\'%{HOSTNAME:target_hostname}\\' and Rule \\'%{GREEDYDATA:msg}\\''"
                   "Msg=\\\"Promoting Element Version \\''%{GREEDYDATA}\\' of Element \\'%{GREEDYDATA:software_update}\\' from Node \\'%{HOSTNAME:target_hostname}\\' and Rule \\'%{GREEDYDATA:msg}\\''"
                   "Msg=\\\"Executed Action %{GREEDYDATA:actionDetail} on Element %{DATA:asm_log_element} from %{GREEDYDATA} Rule %{GREEDYDATA:rules}\\."
                   "Msg=\\\"%{GREEDYDATA}Query=%{DATA:query}\\' from Node \\'%{DATA:target_hostname}:\\' and Rule %{GREEDYDATA:rules}\\."
                  ]
      }
      overwrite => ["nodeid", "nodeid1", "assObj", "rules", "target_hostname", "target_ip", "software_update", "hostname", "principal_user", "msg", "ldap_details","actionDetail","asm_log_element","query"]
      on_error => "action_grok_failure"
    }
    mutate {
      replace => {
        "event_type" => "STATUS_STARTUP"
      }
    }

    if [software_update] != "" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
          "event.idm.read_only_udm.target.asset.platform_software.platform" => "WINDOWS"
          "event.idm.read_only_udm.target.resource.name" => "%{software_update}"
        }
      }
    }
    else if [desc] =~ "CN=" {
      mutate {
        replace => {
          "event_type" => "STATUS_UNCATEGORIZED"
        }
      }
    }
  }
  else if [category] =~ "SOAP Client" {
    grok {
      match => {
        "desc" => ["DSR %{GREEDYDATA:software_update} Promoted %{GREEDYDATA:data}"]
      }
      overwrite => ["software_update"]
      on_error => "soap_client_grok_failure"
    }
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
        "event.idm.read_only_udm.target.asset.platform_software.platform" => "WINDOWS"
        "event.idm.read_only_udm.target.resource.name" => "DSR Windows Integration"
      }
    }
  }
  else if [category] in ["Change", "Node Change", "Policy Score Change"] {

    grok {
      match => {
        "desc" => ["Msg=\\\"The score for Node \\'%{HOSTNAME:target_hostname}\\' under Policy \\'%{GREEDYDATA:software_update}\\' changed from %{GREEDYDATA:change_type}",
                   "Msg=\\\"%{GREEDYDATA:metadata_description} %{GREEDYDATA} \\'%{GREEDYDATA:software_update}\\'",
                   "Msg=\\\"%{GREEDYDATA} \'%{GREEDYDATA:software_update}\'"]
      }
      overwrite => ["software_update", "target_hostname", "metadata_description", "change_type"]
      on_error => "change_grok_failure"
    }

    mutate {
      replace => {
        "event_type" => "RESOURCE_WRITTEN"
        "event.idm.read_only_udm.target.asset.platform_software.platform" => "WINDOWS"
        "event.idm.read_only_udm.target.resource.name" => "%{software_update}"
        "event.idm.read_only_udm.target.resource.resource_type" => "SETTING"
      }
    }
  }
  else if [category] == "Audit Event" {
    mutate {
      replace => {
        "CN" => ""
      }
    }
    grok {
      match => {
        "desc" => ["Msg=\\\"'%{GREEDYDATA:registry_key} %{GREEDYDATA:registry_value}\\' accessed by \\'%{GREEDYDATA:principal_user}\\'. Type \\'%{GREEDYDATA:change_type}\\'.%{GREEDYDATA}Application:",
                   "Msg=\\\"'%{GREEDYDATA}. Type \\'%{GREEDYDATA:change_type}\\'"]
      }
      overwrite => ["change_type", "principal_user", "application","registry_key","registry_value"]
      on_error => "audit_event_grok_failure"
    }

    if [desc] =~ "HKEY" {
      if [registry_key] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.registry.registry_key" => "%{registry_key}"
            "event_type" => "REGISTRY_MODIFICATION"
          }
        }
      }
      if [registry_value] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.registry.registry_value_data" => "%{registry_value}"
            "event_type" => "REGISTRY_MODIFICATION"
          }
        }
      }
      if [AppType] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{AppType}"
          }
        }
      }
    }
    else if [EventType] != "" && [message] !~ "CN=" {
      grok {
        match => {
          "desc" => ["AppType=(?P<application>([^=])*) %{GREEDYDATA} Msg=\\\"'%{GREEDYDATA:filepath}\\' accessed by \\'%{GREEDYDATA:principal_user}\\'. Type \\'%{GREEDYDATA}\\'.%{GREEDYDATA}%{WORD}:"]
        }
        overwrite => [ "principal_user", "application", "filepath"]
        on_error => "grok_desc_failure_occurred"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{filepath}"
          "event_type" => "RESOURCE_DELETION"
          "change_type" => ""
        }
      }
    }
    else {
      grok {
        match => {
          "desc" => ["(?P<principal_user>(CN=([^=]+))) %{GREEDYDATA:ldap_details} accessed by"]
        }
        overwrite => ["principal_user", "ldap_details"]
        on_error => "match_error"
      }
      mutate {
        replace => {
          "event_type" => "GROUP_MODIFICATION"
        }
      }
    }
  }
  else if [category] == "" && [message] =~ "CN=" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
    if [msg] =~ "Configuration" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{msg}"
        }
      }
      mutate {
        replace => {
          "msg" => ""
        }
      }
    }
  }
  else if [category] == "" && [message] =~ "Windows Installed Software" {
    if [software_update] != "" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
          "event.idm.read_only_udm.target.asset.platform_software.platform" => "WINDOWS"
          "event.idm.read_only_udm.target.resource.name" => "%{software_update}"
        }
      }
    }
  }
  else if [category] == "" && [software_update] =~ "HKEY" {
    grok {
      match => {
        "message" => [
          "HKEY_%{GREEDYDATA:registry_key} %{GREEDYDATA:registry_value} on %{HOSTNAME:target_hostname} by %{GREEDYDATA:msg}"
          "HKEY_%{GREEDYDATA:registry_key}\\|%{GREEDYDATA:registry_value} on %{HOSTNAME:target_hostname} by %{GREEDYDATA:msg}"
          "HKEY_%{GREEDYDATA:registry_key} on %{HOSTNAME:target_hostname} by %{GREEDYDATA:msg}"
        ]
      }
      overwrite => ["msg", "registry_value", "registry_key", "target_hostname"]
      on_error => "registry_grok_failure"
    }
    if [registry_key] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.registry.registry_key" => "HKEY_%{registry_key}"
          "event_type" => "REGISTRY_MODIFICATION"
        }
      }
    }
    if [registry_value] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.registry.registry_value_data" => "%{registry_value}"
          "event_type" => "REGISTRY_MODIFICATION"
        }
      }
    }
  }
  else if [category] == "" && [software_update] =~ "(:|hotfixes|Computer|enumerate_groups|network)" {
    if [software_update] =~ "exe" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{software_update}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{software_update}"
        }
      }
    }
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  # Start of log mapping
  if [datetime] != "" {
    date {
      match => [datetime, "MMM d HH:mm:ss", "yyyy-MM-dd HH:mm:ss", "MM/dd/yyyy h:m A"]
      rebase => true
      on_error => "date_error"
    }
  }

  if [log_level] == "Information" {
    mutate {
      replace => {
        "sevs" => "INFORMATIONAL"
      }
    }
  }
  else if [log_level] == "Warning" {
    mutate {
      replace => {
        "sevs" => "MEDIUM"
      }
    }
  }
  else if [log_level] == "Error" {
    mutate {
      replace => {
        "sevs" => "ERROR"
      }
    }
  }
  else if [log_level] == "Critical" {
    mutate {
      replace => {
        "sevs" => "CRITICAL"
      }
    }
  }
  # End of log mapping
  # Start of IP, hostname mapping
  if [NodeIp] != "" {
    mutate {
      replace => {
        "target_ip" => "%{NodeIp}"
      }
    }
  }

  if [NodeName] != "" {
    mutate {
      replace => {
        "target_hostname" => "%{NodeName}"
      }
    }
  }

  if [source_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "source_ip"
      }
      on_error => "no_source_ip"
    }
    mutate {
      replace => {
        "principal_mid_present" => "true"
      }
    }
  }
  if [target_ip] != "" {
    grok {
      match => {
        "target_ip" => ["%{IP:target_ip}"]
      }
      overwrite => ["target_ip"]
      on_error => "target_ip_grok_failure"
    }
    if ![target_ip_grok_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "target_ip"
        }
        on_error => "target_ip_merge_failed"
      }
      if ![target_ip_merge_failed] {
        mutate {
          replace => {
            "target_mid_present" => "true"
          }
        }
      }
    }
  }
  # End of IP, hostname mapping

  if [principal_user] != "" {
    if [ldap_details] != "" {
      mutate {
        replace => {
          "ldap_details" => "%{principal_user} %{ldap_details}"
        }
      }
      if [ldap_details] =~ "OU=" {
        grok {
          match => {
            "ldap_details" => ["(?:(CN=()),)?((?:(?P<ldap_details>(OU).*?),)?((?:DC=.*)+))$"]
          }
          overwrite => ["ldap_details"]
          on_error => "ldap_details_grok_failure"
        }
        if [event_type] != "USER_UNCATEGORIZED" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.user.group_identifiers" => "ldap_details"
            }
          }
        }
        else {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.user.group_identifiers" => "ldap_details"
            }
          }
        }
      }
    }

    if [principal_user] =~ "CN=" {
      mutate {
        gsub => ["principal_user", "CN=", ""]
      }

      if [principal_user] =~ "[(]" {
        grok {
          match => {
            "principal_user" => ["%{GREEDYDATA:principal_user}\\("]
          }
          overwrite => ["principal_user"]
          on_error => "principal_user_grok_failure"
        }
      }

      mutate {
        gsub => ["principal_user", "[ ]+$", ""]
      }
    }

    grok {
      match => {
        "principal_user" => ["%{GREEDYDATA:adminsitrative_domain}\\\\%{WORD:principal_user}"]
      }
      on_error => "domain_exists"
      overwrite => ["principal_user"]
    }

    mutate {
      gsub => ["principal_user", ",$", ""]
    }

    if [event_type] != "USER_UNCATEGORIZED" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{principal_user}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{principal_user}"
        }
      }
    }
    if ![domain_exists] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{adminsitrative_domain}"
        }
      }
    }
  }

  if [loguser] != "" {
    mutate {
      gsub => ["loguser", '\"', ""]
    }
    if [event_type] != "" && [event_type] != "USER_LOGIN" && [principal_user] == "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{loguser}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{loguser}"
        }
      }
    }
  }

  if [product_logid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{product_logid}"
      }
    }
  }

  if [target_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
      }
      on_error => "no_target_hostname"
    }
    if ![no_target_hostname] {
      mutate {
        replace => {
          "target_mid_present" => "true"
        }
      }
    }
  }

  if [application] != "" {
    mutate {
      gsub => ["application", '\"', ""]
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{application}"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "File Integrity Monitoring"
      "event.idm.read_only_udm.metadata.vendor_name" => "TRIPWIRE"
    }
  }
  if [source_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{source_hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{source_hostname}"
        "principal_mid_present" => "true"
      }
      on_error => "no_source_hostname"
    }
  }
  # End of common fields

  if [device_product] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{device_product}"
      }
    }
  }

  if [device_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{device_version}"
      }
    }
  }

  if [event_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_name}"
      }
    }
  }

  if [device_event_class_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.product_object_id" => "%{device_event_class_id}"
      }
    }
  }

  if [rules] != "" {
    mutate {
      gsub => ["rules", '\'', ""]
    }
    mutate {
      replace => {
        "sec_result.rule_name" => "%{rules}"
      }
    }
  }
  if [actionDetail] != "" {
    mutate {
      gsub => ["actionDetail", '\'', ""]
    }
    mutate {
      replace => {
        "sec_result.action_details" => "%{actionDetail}"
      }
      on_error => "no_action_detail"
    }
  }
  if [asm_log_element] != "" {
    mutate {
      gsub => ["asm_log_element", '\'', ""]
    }
    mutate {
      replace => {
        "asm_log_element_label.value" => "%{asm_log_element}"
        "asm_log_element_label.key" => "asm_log_element"
      }
      on_error => "no_asm_log_element"
    }
    if ![no_asm_log_element] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "asm_log_element_label"
        }
        on_error => "asm_log_element_merge_failed"
      }
    }
  }

  if [change_type] != "" {
    mutate {
      gsub => ["change_type", '\"', ""]
    }
    mutate {
      replace => {
        "sec_result.summary" => "%{change_type}"
      }
    }
  }

  if [category] != "" && [category] != [application] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{category}"
      }
    }
  }

  if [msg] != "" {
    mutate {
      gsub => ["msg", '\"', ""]
    }
    mutate {
      replace => {
        "sec_result.description" => "%{msg}"
      }
    }
  }
  else if [desc] != "" {
    grok {
      match => {
        "desc" => "Msg=\\\"%{GREEDYDATA:msg}\\.\\\""
      }
      overwrite => ["msg"]
      on_error => "match_error"
    }
    mutate {
      replace => {
        "sec_result.description" => "%{msg}"
      }
    }
  }

  if [metadata_description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{metadata_description}"
      }
    }
  }
  mutate {
    rename => {
      "ElementId" => "addition.ElementId"
      "NodeId" => "addition.NodeId"
      "AssociatedObjects" => "addition.AssociatedObjects"
      "VerId" => "addition.VerId"
      "query" => "addition.query"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [value] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "no_key_found"
      }
      mutate {
        replace => {
          "_field.value.string_value" => "%{value}"
        }
        on_error => "no_value_found_for_key_in_string_value"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "_field"
        }
        on_error => "addition_merge_failed"
      }
    }
  }

  if [is_network_connection] == "true" && [msg] !~ "shut down"{
    if [principal_mid_present] == "true" && [target_mid_present] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => ""
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      rename => {
        "event_type" => "event.idm.read_only_udm.metadata.event_type"
      }
    }
  }
  else if [event_type] == "NETWORK_CONNECTION" and [target_hostname] == "" and [target_ip] == "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
      }
    }
  }
  else if [principal_mid_present] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [sevs] != "" {
    mutate {
      replace => {
        "sec_result.severity" => "%{sevs}"
      }
    }
  }

  mutate {
    merge => {
      "sec_result.action" => "security_action"
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "sec_result"
    }
  }

  # End of Mapping
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
