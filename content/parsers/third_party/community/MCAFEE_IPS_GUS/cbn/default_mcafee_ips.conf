# Product: McAfee IPS
# Category: IDS/IPS
# Supported Format: SYSLOG, JSON, SYSLOG+KV
# Reference: https://docs.mcafee.com/bundle/network-security-platform-9.1.x-product-guide/page/GUID-750BEAAA-2C67-40F1-9A8E-A638C400FEEA.html
# Last Updated: 2026-09-07
# Copyright 2026 Google SecOps

filter {
    mutate {
        replace => {
            "severity" => ""
            "result" => ""
            "principal_ip" => ""
            "principal_port" => ""
            "target_ip" => ""
            "target_port" => ""
            "protocol" => ""
            "alert_message" => ""
            "_principal" => ""
            "_target" => ""
            "_conn_direction" => ""
            "_action" => ""
            "_category" => ""
            "_network" => ""
            "_result" => ""
            "_intermediary" => ""
            "sysdate" => ""
            "scanHost" => ""
            "forwarderName" => ""
            "_security_result" => ""
            "_event_description" => ""
            "has_principal" => "false"
            "has_target" => "false"
            "array_principal_ip"  => ""
            "_sev_block" => ""
            "btp_block" => ""
            "BTP" => ""
            "timestamp" => ""
            "year" => ""
            "header_timestamp" => ""
            "priority" => ""
            "GEO" => ""
            "appname" => ""
            "facility" => ""
            "SRC_IP" => ""
            "hostname" => ""
            "DEST_IP" => ""
            "dst_port" => ""
            "Action" => ""
            "Direction" => ""
            "time" => ""
            "product_id" => ""
            "security_description" => ""
            "threat_id" => ""
            "rule_name" => ""
            "threat_name" => ""
            "severity_number" => ""
            "company_name" => ""
            "interface" => ""
            "collection_time" => ""
            "destination_network_type" => ""
            "message_type" => ""
            "category_detail" => ""
            "target_location" => ""
            "ts" => ""
            "time_1" => ""
            "kv_data" => ""
            "deviceSeverity" => ""
            "admin_domain" => ""
            "sensor" => ""
            "deviceInboundInterface" => ""
            "act" => ""
            "signature_id" => ""
            "cat" => ""
            "sub_cat" => ""
            "signature" => ""
            "direction" => ""
            "sec_cat" => ""
        }
    }
    mutate {
        gsub => ["message", '“Direction', '"Direction']
    }
    mutate {
        gsub => ["message", 'SRC IP', 'SRC_IP']
    }
    mutate {
        gsub => ["message", 'DEST IP', 'DEST_IP']
    }
    json {
        source => "message"
        array_function => "split_columns"
        on_error => "json_parse_failed"
    }
    if ![json_parse_failed] {
        grok {
            match => {
                "message" => [
                    "%{DATA:time}\\s+:\\s+%{DATA:scanHost}\\s+detected\\s+%{DATA:_conn_direction}\\s+attack\\s+%{DATA:protocol}:?\\s+%{DATA:threat_name}\\s+\\(severity = %{DATA:severity}\\)\\s+\\(BTP=\\s+%{DATA:BTP}\\).\\s+%{IP:principal_ip}:%{INT:principal_port}\\s+%{DATA}\\s+\\[%{DATA:target_ip}\\]:%{INT:target_port}\\s+\\(result\\s+=\\s+%{DATA:result}\\)",
                    "%{DATA:time}\\s+:\\s+%{DATA:scanHost}\\s+detected\\s+%{DATA:_conn_direction}\\s+attack\\s+%{DATA:protocol}:?\\s+%{DATA:threat_name}\\s+\\(severity = %{DATA:severity}\\)\\s+\\(BTP\\s*=\\s*%{DATA:BTP}\\).\\s+(?:%{IP:principal_ip}:%{INT:principal_port}|%{DATA}:%{DATA})\\s+%{DATA}\\s+%{DATA}\\s+\\(result\\s+=\\s+%{DATA:result}\\)",
                    "%{DATA:time}\\s+:\\s+%{DATA:scanHost}\\s+matched\\s+%{DATA:_conn_direction}\\s+source\\s+%{DATA:GEO}\\s+%{IP:principal_ip}\\s+%{DATA}\\s+destination (?P<destination_network_type>reserved/private)\\s+%{IP:target_ip}:%{INT:target_port}\\s+\\(%{DATA:protocol}\\)\\s+=\\s+%{GREEDYDATA:Action}",
                    "%{DATA:collection_time}\\s+:\\s+%{DATA:product_id}\\|%{DATA:message_type}\\|%{DATA:time}\\|\"%{DATA:security_description}\"\\|%{DATA:threat_id}\\|%{DATA:severity}\\s+\\|%{DATA:rule_name}\\|%{INT:severity_number}\\|%{DATA:company_name}\\s+\\|%{DATA:scanHost}\\|%{DATA:interface}\\|%{IP:principal_ip}\\|%{DATA:principal_port}\\s+\\|%{IP:target_ip}\\|%{INT:target_port}\\|%{DATA:_conn_direction}\\s+\\|%{DATA:category_detail}\\s+\\|%{GREEDYDATA:result}",
                    "%{DATA:collection_time}\\s+:\\s+%{DATA:product_id}\\|%{DATA:message_type}\\|%{DATA:time}\\s+\\|\"%{DATA:security_description}\"\\|%{DATA:threat_id}\\|%{DATA:severity}\\s+\\|%{DATA:rule_name}\\|%{INT:severity_number}\\|%{DATA:company_name}\\s+\\|%{DATA:scanHost}\\|%{DATA:interface}\\|%{IP:principal_ip}\\|%{DATA:principal_port}\\s+\\|\\[%{GREEDYDATA:target_ip}",
                    "\\.\\.\\.%{DATA:target_ip}\\]\\|%{INT:target_port}\\|%{DATA:_conn_direction}\\s+\\|%{DATA:threat_name}\\s+\\|%{GREEDYDATA:result}",
                    "%{DATA:time}\\s+:\\s+%{DATA:scanHost}\\s+matched\\s+%{DATA:_conn_direction}\\s+source\\s+---\\s+%{IP:principal_ip}%{DATA}destination\\s+---\\s+%{IP:target_ip}:%{DATA:target_port}\\s+\\(%{DATA:protocol}\\)\\s+=\\s+%{GREEDYDATA:Action}",
                    "%{DATA:time}\\s+:\\s+%{DATA:scanHost}\\s+matched\\s+%{DATA:_conn_direction}\\s+source\\s+%{DATA:GEO}\\s+%{IP:principal_ip}%{DATA}destination\\s+%{DATA:target_location}\\s+%{IP:target_ip}:%{DATA:target_port}\\s+\\(%{DATA:protocol}\\)\\s+=\\s+%{GREEDYDATA:Action}"
                ]
            }
            on_error => "_not_found_json_grok"
            overwrite => ["time", "scanHost", "_conn_direction", "GEO", "principal_ip", "target_ip", "target_port", "protocol", "result", "product_id", "security_description", "threat_id", "severity", "rule_name", "principal_port", "BTP", "threat_name", "Action", "severity_number", "company_name", "interface", "collection_time", "destination_network_type", "message_type", "category_detail", "target_location"]
        }
        if [time] != "" {
            date {
                match => ["time", "MMM dd, yyyy HH:mm:ss", "yyyy-MM-dd HH:mm:ss ZZZ", "RFC3339", "ISO8601"]
                target => "event.idm.read_only_udm.metadata.event_timestamp"
                on_error => "no_time_found"
            }
        }
        if [collection_time] != "" {
            date {
                match => ["collection_time", "MMM dd, yyyy HH:mm:ss"]
                target => "event.idm.read_only_udm.metadata.collected_timestamp"
                on_error => "no_collection_time"
            }
        }
        if [product_id] != "" {
            mutate {
                replace => {
                    "event.idm.read_only_udm.metadata.product_log_id" => "%{product_id}"
                }
                on_error => "no_product_id"
            }
        }
        if [security_description] != "" {
            mutate {
                replace => {
                    "_security_result.description" => "%{security_description}"
                }
                on_error => "no_security_description"
            }
        }
        if [threat_id] != "" {
            mutate {
                replace => {
                    "_security_result.threat_id" => "%{threat_id}"
                }
                on_error => "no_threat_id"
            }
        }
        if [rule_name] != "" {
            mutate {
                replace => {
                    "_security_result.rule_name" => "%{rule_name}"
                }
                on_error => "no_rule_name"
            }
        }
        if [threat_name] != "" {
            mutate {
                replace => {
                    "_security_result.threat_name" => "%{threat_name}"
                }
                on_error => "no_threat_name"
            }
        }
        mutate {
            convert => {
                "priority" => "string"
            }
            on_error => "no_priority"
        }
        if [priority] != "" {
            mutate {
                replace => {
                    "priority_label.key" => "priority"
                    "priority_label.value" => "%{priority}"
                }
                on_error => "no_priority_label"
            }
            if ![no_priority_label] {
                mutate {
                    merge => {
                        "_security_result.detection_fields" => "priority_label"
                    }
                    on_error => "no_priority_merge_failed"
                }
            }
        }
        mutate {
            convert => {
                "facility" => "string"
            }
            on_error => "no_facility"
        }
        if [facility] != "" {
            mutate {
                replace => {
                    "facility_label.key" => "facility"
                    "facility_label.value" => "%{facility}"
                }
                on_error => "no_facility_label"
            }
            if ![no_facility_label] {
                mutate {
                    merge => {
                        "_security_result.detection_fields" => "facility_label"
                    }
                    on_error => "no_facility_merge_failed"
                }
            }
        }
        if [hostname] != "" {
            mutate {
                replace => {
                    "_principal.hostname" => "%{hostname}"
                    "_principal.asset.hostname" => "%{hostname}"
                    "has_principal" => "true"
                }
                on_error => "no_principal_hostname"
            }
        }
        if [SRC_IP] != "" {
            grok {
                match => {
                    "SRC_IP" => ["%{IP:SRC_IP}"]
                }
                overwrite => ["SRC_IP"]
                on_error => "no_src_ip"
            }
            if ![no_src_ip] {
                mutate {
                    merge => {
                        "_principal.ip" => "SRC_IP"
                        "_principal.asset.ip" => "SRC_IP"
                    }
                    on_error => "principal_ip_failed"
                }
                if ![principal_ip_failed] {
                    mutate {
                        replace => {
                            "has_principal" => "true"
                        }
                    }
                }
            }
        }
        if [DEST_IP] != "" {
            grok {
                match => {
                    "DEST_IP" => ["%{IP:DST_IP}(?::%{INT:dst_port})?"]
                }
                overwrite => ["DST_IP", "dst_port"]
                on_error => "no_dst_ip"
            }
            if ![no_dst_ip] {
                mutate {
                    merge => {
                        "_target.ip" => "DST_IP"
                        "_target.asset.ip" => "DST_IP"
                    }
                    on_error => "no_target_ip"
                }
                if ![no_target_ip] {
                    mutate {
                        replace => {
                            "has_target" => "true"
                        }
                    }
                }
                mutate {
                    replace => {
                        "_target.port" => "%{dst_port}"
                    }
                    on_error => "target_port_failed"
                }
                mutate {
                    convert => {
                        "_target.port" => "integer"
                    }
                    on_error => "no_dst_port"
                }
            }
        }
        if [Action] =~ "(?i)(deny|drop)" {
            mutate {
                replace => {
                    "_action" => "BLOCK"
                }
            }
        }
        if [GEO] != "" {
            mutate {
                replace => {
                    "_principal.location.country_or_region" => "%{GEO}"
                }
                on_error => "no_principal_location"
            }
        }
        if [target_location] != "" {
            mutate {
                replace => {
                    "_target.location.country_or_region" => "%{target_location}"
                }
                on_error => "no_target_location"
            }
        }
        if [severity_number] != "" {
            mutate {
                replace => {
                    "_security_result.severity_details" => "%{severity_number}"
                }
                on_error => "no_severity_details"
            }
        }
        if [company_name] != "" {
            mutate {
                replace => {
                    "_principal.user.company_name" => "%{company_name}"
                }
                on_error => "no_company_name"
            }
        }
        if [interface] != "" {
            mutate {
                replace => {
                    "interface_label.key" => "interface"
                    "interface_label.value" => "%{interface}"
                }
                on_error => "no_interface_label"
            }
            if ![no_interface_label] {
                mutate {
                    merge => {
                        "_security_result.detection_fields" => "interface_label"
                    }
                    on_error => "no_interface_merge_failed"
                }
            }
        }
        if [Direction] != "" {
            mutate {
                replace => {
                    "_conn_direction" => "%{Direction}"
                }
                on_error => "no_direction"
            }
        }
        if [message_type] != "" {
            mutate {
                replace => {
                    "message_type_label.key" => "message_type"
                    "message_type_label.value" => "%{message_type}"
                }
                on_error => "no_message_type_label"
            }
            if ![no_message_type_label] {
                mutate {
                    merge => {
                        "_security_result.detection_fields" => "message_type_label"
                    }
                    on_error => "no_message_type_merge_failed"
                }
            }
        }
        if [category_detail] != "" {
            mutate {
                merge => {
                    "_security_result.category_details" => "category_detail"
                }
                on_error => "no_category_detail"
            }
        }
    }
    else if [message] =~ "(?i)severity" {
        # SYSLOG part
        grok {
            match => {
                "message" => [
                    "<%{NONNEGINT:facility}>%{SYSLOGTIMESTAMP:sysdate}(\\s+GMT)?\\s+%{NOTSPACE:forwarderName}(\\s+AlertLog:)?\\s+%{NOTSPACE:scanHost}\\s+detected"
                    "<%{NONNEGINT:facility}>%{SYSLOGTIMESTAMP:sysdate} %{DATA:forwarderName}: %{GREEDYDATA:timestamp} : %{DATA:scanHost} detected"
                    "<%{NONNEGINT:facility}>%{SYSLOGTIMESTAMP:sysdate} %{DATA:forwarderName}:",
                    "%{SYSLOGTIMESTAMP:ts} %{DATA:appname}: %{DATA:time_1} :\\s+%{GREEDYDATA:kv_data}"
                ]
            }
            overwrite => ["facility", "sysdate", "forwarderName", "scanHost", "timestamp", "ts", "appname", "time_1", "kv_data"]
            on_error => "_not_match_grok"
        }

        # Severity
        grok {
            match => {
                "message" => ["(?P<_sev_block>\\(severity = (?P<severity>.*?)\\)\\.) (?P<btp_block>\\(BTP = (?<BTP>.*?)\\)\\.)",
                "(?P<_sev_block>\\(severity = (?P<severity>.*?)\\)\\.)"]
            }
            overwrite => ["severity", "_sev_block", "btp_block", "BTP"]
            on_error => "_not_found_severity"
        }

        # IPs Involved
        grok {
            match => {
                "message" => [
                    "N/A:%{NOTSPACE} %{NOTSPACE:arrow} %{IPORHOST:target_ip}:%{NOTSPACE}"
                    "%{IPORHOST:principal_ip}:%{POSINT:principal_port} %{NOTSPACE:arrow} %{IPORHOST:target_ip}:%{POSINT:target_port}",
                    "%{IPORHOST:principal_ip}:%{NOTSPACE} %{NOTSPACE:arrow} %{IPORHOST:target_ip}:%{NOTSPACE}"
                ]
            }
            on_error => "_not_found_ips_ports"
            overwrite => ["principal_ip", "principal_port", "target_ip", "target_port"]
        }

        # Protocol
        grok {
            match => {
                "message" => [
                    "attack (?P<_proto>%{NOTSPACE:protocol}:)",
                    "\\s(?P<protocol>TCP)\\s",
                ]
            }
            on_error => "_not_protocol"
            overwrite => ["protocol"]
        }

        # Conection Direction
        grok {
            match => {
                "message" => [
                    "detected %{NOTSPACE:_conn_direction} attack "
                ]
            }
            on_error => "_not_found_direction"
            overwrite => ["_conn_direction"]
        }

        # Alert message
        grok {
            match => {
                "message" => [
                    "detected %{NOTSPACE} attack %{NOTSPACE}: %{DATA:alert_message} \\(seve",
                    "detected %{NOTSPACE} attack %{DATA:alert_message} \\(seve",
                ]
            }
            on_error => "_not_found_alert_message"
            overwrite => ["alert_message"]
        }

        # Result
        grok {
            match => {
                "message" => ["(?P<_res_block>\\(result = (?P<result>.*)\\))"]
            }
            on_error => "_not_found_result"
            overwrite => ["result"]
        }



        # meta description
        grok {
            match => {
                "message" => [
                    "(?P<_event_description>detected %{NOTSPACE} attack %{NOTSPACE}):",
                    "(?P<_event_description>detected %{NOTSPACE} attack)"
                ]
            }
            on_error => "_not_found_event_description"
            overwrite => ["_event_description"]
        }
    }
    else if [message] !~ "(?i)severity" {
        # SYSLOG part
        grok {
            match => {
                "message" => [
                    "<%{NONNEGINT:facility}>%{SYSLOGTIMESTAMP:sysdate} %{DATA:forwarderName}: ...0%{DATA:array_principal_ip}\\]:%{INT:principal_port} (?P<_res_block>\\(result = (?P<result>.*)\\))",
                    "<%{NONNEGINT:facility}>%{SYSLOGTIMESTAMP:sysdate} %{DATA:forwarderName}: ...%{DATA:array_principal_ip}\\]:%{INT:principal_port} (?P<_res_block>\\(result = (?P<result>.*)\\))",
                    "<%{NONNEGINT:facility}>%{SYSLOGTIMESTAMP:sysdate} %{DATA:forwarderName}: ....%{DATA:array_principal_ip}\\]:%{INT:principal_port} (?P<_res_block>\\(result = (?P<result>.*)\\))"
                ]
            }
            on_error => "severity_found_error"
            overwrite => ["sysdate", "forwarderName", "array_principal_ip", "principal_port", "result", "facility"]
        }
    }
    if [kv_data] != "" {
        mutate {
            gsub => ["kv_data", '=\"', '=']
        }
        mutate {
            gsub => ["kv_data", '\" ', '#']
        }
        kv {
            source => "kv_data"
            field_split => "#"
            value_split => "="
            on_error => "kv_failed"
        }
    }
    date {
        match => ["sysdate", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
        rebase => true
        on_error => "no_date"
    }
    if [timestamp] != "" {
        grok {
            match => {
                "timestamp" => ["%{WORD} %{INT}, %{YEAR:year} %{TIME}"]
            }
            overwrite => ["year"]
            on_error => "_not_found_timestamp"
        }
    }
    mutate {
        replace => {
            "header_timestamp" => "%{year} %{sysdate}"
        }
        on_error => "_not_found_header_timestamp"
    }
    if [header_timestamp] != "" {
        date {
            match => ["header_timestamp", "yyyy MMM dd HH:mm:ss", "yyyy MMM d HH:mm:ss"]
            on_error => "no_date_header_timestamp"
        }
    }
    if [_event_description] != "" {
        mutate {
            gsub => ["_event_description", "detected ", "Detected "]
        }
    }
    if [time_1] != "" {
        date {
            match => ["time_1", "MMM dd, yyyy HH:mm:ss", "yyyy-MM-dd HH:mm:ss ZZZ", "RFC3339", "ISO8601"]
            target => "event.idm.read_only_udm.metadata.event_timestamp"
            on_error => "no_time_1_found"
        }
    }
    mutate {
        convert => {
            "collection_time" => "string"
        }
        on_error => "no_ts_string"
    }
    if [ts] != "" {
        date {
            match => ["ts", "MMM dd HH:mm:ss"]
            rebase => true
            target => "event.idm.read_only_udm.metadata.collected_timestamp"
            on_error => "no_ts_found"
        }
    }
    else if [collection_time] != "" {
        date {
            match => ["collection_time", "UNIX", "UNIX_MS"]
            target => "event.idm.read_only_udm.metadata.collected_timestamp"
            on_error => "no_collection_time_found"
        }
    }
    if [admin_domain] != "" {
      mutate {
        replace => {
          "_intermediary.administrative_domain" => "%{admin_domain}"
        }
        on_error => "admin_domain_error"
      }
    }
    if [sensor] != "" {
        mutate {
            replace => {
                "_principal.hostname" => "%{sensor}"
                "_principal.asset.hostname" => "%{sensor}"
                "has_principal" => "true"
            }
            on_error => "no_sensor"
        }
    }
    if [deviceSeverity] != "" and [severity] == "" {
        mutate {
            replace => {
                "severity" => "%{deviceSeverity}"
            }
            on_error => "no_deviceSeverity"
        }
    }
    if [signature_id] != "" {
        mutate {
            replace => {
                "_security_result.rule_id" => "%{signature_id}"
            }
            on_error => "no_signature_id"
        }
    }
    if [cat] =~ "PolicyViolation" {
        mutate {
            replace => {
                "sec_cat" => "POLICY_VIOLATION"
            }
            on_error => "security_result_cat_error"
        }
    }
    if [sec_cat] != "" {
        mutate {
            merge => {
                "_security_result.category" => "sec_cat"
            }
            on_error => "sec_cat_merge_failure"
        }
    }
    if [sub_cat] != "" {
        mutate {
            merge => {
                "_security_result.category_details" => "sub_cat"
            }
            on_error => "no_sub_cat"
        }
    }
    mutate {
        rename => {
            "appname" => "addition.appname"
            "deviceInboundInterface" => "addition.deviceInboundInterface"
            "count" => "addition.count"
            "signature" => "addition.signature"
        }
    }
    for key, value in addition map {
        mutate {
            replace => {
                "_field" => ""
                "_check" => ""
            }
        }
        mutate {
            convert => {
                "value" => "string"
            }
            on_error => "value_conversion_error"
        }
        mutate {
            replace => {
                "_check" => "%{value}"
            }
            on_error => "no_value"
        }
        if ![no_value] and [_check] != "" {
            mutate {
                replace => {
                "_field.key" => "%{key}"
                }
            }
            if [key] in ["appname", "signature"] {
                mutate {
                    replace => {
                        "_field.value" => "%{value}"
                    }
                }
                mutate {
                    merge => {
                        "_security_result.detection_fields" => "_field"
                    }
                    on_error => "addition_merge_failed"
                }
            }
            else if [key] == "deviceInboundInterface" {
                mutate {
                    replace => {
                        "_field.value" => "%{value}"
                    }
                }
                mutate {
                    merge => {
                        "_target.resource.attribute.labels" => "_field"
                    }
                    on_error => "addition_merge_failed"
                }
            }
            else {
                mutate {
                    replace => {
                        "_field.value.string_value" => "%{value}"
                    }
                }
                mutate {
                    merge => {
                        "event.idm.read_only_udm.additional.fields" => "_field"
                    }
                    on_error => "addition_merge_failed"
                }
            }
        }
    }
    # EVENT TYPE - MCAFEE_IPS is about scan network
    if [scanHost] != "" {
        mutate {
            replace => {
                "_intermediary.hostname" => "%{scanHost}"
            }
            on_error => "no_scanHost"
        }
    }
    if [array_principal_ip] != "" {
        mutate {
            split => {
                source => "array_principal_ip"
                separator => ","
                target => "principalips"
                on_error => "no_principalips"
            }
        }
    }
    for ip in principalips {
        grok {
            match => {
                "ip" => ["%{IP:principalip}"]
            }
            overwrite => ["principalip"]
            on_error => "not_ip"
        }

        if ![not_ip]{
            mutate {
                merge => {
                    "_principal.ip" => "principalip"
                    "_principal.asset.ip" => "principalip"
                }
                on_error => "principalip_merge_failed"
            }
            mutate {
                replace => {
                    "has_principal" => "true"
                }
            }
        }
    }
    # PRINCIPAL
    if [principal_ip] != "" and [principal_ip] != "N/A" {
        grok {
            match => {
                "principal_ip" => ["%{IP:principal_ip}"]
            }
            overwrite => ["principal_ip"]
            on_error => "principal_ip_check_failed"
        }
        if ![principal_ip_check_failed] {
            mutate {
                merge => {
                    "_principal.ip" => "principal_ip"
                }
                on_error => "no_principal_ip"
            }
            if ![no_principal_ip]{
                mutate {
                    replace => {
                        "has_principal" => "true"
                    }
                    on_error => "no_has_principal"
                }
            }
        }
    }
    if [principal_port] != "" and [principal_port] != "N/A" {
        mutate {
            convert => {
                "principal_port" => "integer"
            }
            on_error => "no_principal_port"
        }
        mutate {
            rename => {
                "principal_port" => "_principal.port"
            }
        }
    }

    if [_principal] != "" {
        mutate {
            rename => {
                "_principal" => "event.idm.read_only_udm.principal"
            }
        }
    }


    # TARGET
    if [target_ip] != "" and [target_ip] != "N/A" {
        mutate {
            split => {
                source => "target_ip"
                separator => ","
                target => "targetips"
                on_error => "no_targetips"
            }
        }
        for ip in targetips {
            grok {
                match => {
                    "ip" => ["%{IP:targetip}"]
                }
                overwrite => ["targetip"]
                on_error => "not_targetip"
            }
            if ![not_targetip]{
                mutate {
                    merge => {
                        "_target.ip" => "targetip"
                        "_target.asset.ip" => "targetip"
                    }
                    on_error => "targetip_merge_failed"
                }
                if ![targetip_merge_failed]{
                    mutate {
                        replace => {
                            "has_target" => "true"
                        }
                    }
                }
            }
        }
    }

    if [target_port] != "" and [target_port] != "N/A" {
        mutate {
            convert => {
                "target_port" => "integer"
            }
            on_error => "no_target_port"
        }
        mutate {
            rename => {
                "target_port" => "_target.port"
            }
        }
    }

    if [destination_network_type] != "" {
        mutate {
            replace => {
                "destination_network_type_label.key" => "destination_network_type"
                "destination_network_type_label.value" => "%{destination_network_type}"
            }
            on_error => "no_destination_network_type_label"
        }
        if ![no_destination_network_type_label] {
            mutate {
                merge => {
                    "_target.asset.attribute.labels" => "destination_network_type_label"
                }
                on_error => "no_destination_network_type_merge_failed"
            }
        }
    }

    if [_target] != "" {
        mutate {
            rename => {
                "_target" => "event.idm.read_only_udm.target"
            }
        }
    }

    # NETWORK
    if [protocol] == "HTTP" {
        mutate {
            replace => {
                "_network.ip_protocol" => "TCP"
                "_network.application_protocol" =>"HTTP"
            }
        }
    } else if [protocol] =~ "(?i)SSL" {
        mutate {
            replace => {
                "_network.ip_protocol" => "TCP"
                "_network.application_protocol" =>"HTTPS"
            }
        }
    } else if [protocol] =~ "(?i)ICMP" {
        mutate {
            replace => {
                "_network.ip_protocol" => "ICMP"
            }
        }
    } else if [protocol] == "SNMP" {
        if [alert_message] =~ "Empty UDP Attack DoS" {
            mutate {
                replace => {
                    "_network.ip_protocol" => "UDP"
                }
            }
        }
    } else if [protocol] == "TCP" {
        mutate {
            replace => {
                "_network.ip_protocol" => "TCP"
            }
        }
    }
    else if [protocol] =~ "(?i)telnet" {
        mutate {
            replace => {
                "_network.application_protocol" => "TELNET"
            }
        }
    }
    else if [protocol] =~ "(?i)dns" {
        mutate {
            replace => {
                "_network.application_protocol" => "DNS"
            }
        }
    }
    if [direction] != "" and [_conn_direction] == "" {
        mutate {
            replace => {
                "_conn_direction" => "%{direction}"
            }
            on_error => "no_conn_direction"
        }
    }
    if [_conn_direction] == "Inbound" {
        mutate {
            replace => {
                "_conn_direction" => "INBOUND"
            }
        }
    } else if [_conn_direction] == "Outbound"  {
        mutate {
            replace => {
                "_conn_direction" => "OUTBOUND"
            }
        }
    } else {
        mutate {
            replace => {
                "_conn_direction" => ""
            }
        }
    }

    if [_conn_direction] != "" {
        mutate {
            replace => {
                "_network.direction" => "%{_conn_direction}"
            }
            on_error => "no_conn_direction"
        }
    }

    if [_network] != "" {
        mutate {
            rename => {
                "_network" => "event.idm.read_only_udm.network"
            }
        }
    }

    # SECURITY RESULT
    if [alert_message] in [
        "Attempt to Read Password File", "Microsoft Index Sever Directory Traversal",
        "WordPress Portable phpMyAdmin Plugin Authentication Bypass Vulnerability",
        "Microsoft Browser Information Disclosure Vulnerability (CVE-2017-0068)",
        "IIS newdsn.exe File Creation", "IIS root.exe Execute Command"]
    {
        mutate {
            replace => {
                "_category" => "ACL_VIOLATION"
            }
        }
    } else if [alert_message] in [
        "HTTP Login Bruteforce Detected",
        "Kerberos Login Bruteforce Detected"]
    {
        mutate {
            replace => {
                "_category" => "AUTH_VIOLATION"
            }
        }
    } else if [alert_message] in [
        "Adobe ColdFusion Directory Traversal Information Disclosure Vulnerability",
        "Adobe ColdFusion Remote File Retrieval Information Disclosure",
        "Adobe XML External Entity Injection",
        "Blind SQL Injection Timing",
        "Linear eMerge E3 Series Unauthenticated Command Injection Vulnerability (CVE-2019-7256)",
        "php.cgi Buffer Overflow",
        "Bare Push Probe",
        "Dasan GPON Home Routers Authentication Bypass (CVE-2018-10561)",
        "Free Download Manager Remote Control Server HTTP Authorization Header Buffer Overflow",
        "htmlscript Retrieve Infomation",
        "IMail Long Bind Remote Buffer Overflow 2",
        "OpenSSL Client Hello Cipher Length Overflow",
        "PHP CGI Argument Injection Remote Vulnerability (CVE-2012-2335)",
        "PHP Exif Header Parsing Integer Overflow Vulnerability",
        "Response UTF16/32 Encoding",
        "RFC 2397 Data URL Usage to Bypass Detection",
        "SQL Injection Attempt Detected",
        "SqlMap SQL Injection Scanning I",
        "Wget Command Injection Vulnerability",
        "ZyXEL NAS weblogin.cgi OS Command Injection",
        "XML External Entity Information Disclosure"]
    {
        mutate {
            replace => {
                "_category" => "EXPLOIT"
            }
        }
    } else if [alert_message] in [
        "Empty UDP Attack DoS", "OPT Denial of Service",
        "Microsoft IIS ..SLASH..DenialofService",
        "Possible attack to exploit BlackNurse vulnerability"]
    {
        mutate {
            replace => {
                "_category" => "NETWORK_DENIAL_OF_SERVICE"
            }
        }
    } else if [alert_message] in [
        "Masscan Scanner Traffic Detected",
        "Timestamp Probe",
        "XMAS with SYN Probe",
        "NMAP",
        "NULL Probe",
        "SYN FIN Based Probes",
        "Illegal FIN Probe"]
    {
        mutate {
            replace => {
                "_category" => "NETWORK_RECON"
            }
        }
    } else if [alert_message] in [
        "GhostRat Traffic Detected",
        "IoTroop Botnet Activity Detected II",
        "Trojan Shell Script",
        "File Mismatch Detected",
        "njRat Traffic Detected",
        "Pushdo Bot SSL DoS"]
    {
        mutate {
            replace => {
                "_category" => "SOFTWARE_MALICIOUS"
            }
        }
    }

    # Reset category based on result
    # Mcafee doc: The alert was raised for suspicious
    # but not necessarily malicious, traffic.
    if [result] == "n/a" {
        mutate {
            replace => {
                "_category" => "NETWORK_SUSPICIOUS"
            }
        }
    }

    # set result on desctiption
    if [result] != "n/a" {
        mutate {
            replace => {
                "_result" => " (%{result})"
            }
        }
    }
    if [_event_description] != "" {
        mutate {
            replace => {
                "_security_result.summary" => "%{_event_description}"
                "_security_result.description" => "%{alert_message}%{_result}"
            }
        }
    }
    if [_category] != "" {
        mutate {
            merge => {
                "_security_result.category" => "_category"
            }
        }
    }
    if [act] != "" and [result] == "" {
        mutate {
            replace => {
                "result" => "%{act}"
            }
            on_error => "no_act"
        }
    }
    # mcafee doc: Attacks blocked or had no impact
    if [result] == "Attack Blocked" or [result] == "Attack Failed" or [result] == "Attack SmartBlocked" {
        mutate {
            replace => {
                "_action" => "BLOCK"
            }
        }
    # mcafee doc: The attack was successful.
    } else if [result] == "Attack Successful" {
        mutate {
            replace => {
                "_action" => "ALLOW"
            }
        }

    # mcafee doc: The result of the attack is not known.
    } else if [result] ==  "Inconclusive" {
        mutate {
            replace => {
                "_action" => "UNKNOWN_ACTION"
            }
        }
    }
    if [act] != "" {
        mutate {
            replace => {
                "_security_result.action_details" => "%{act}"
            }
            on_error => "no_act_details"
        }
    }

    if [alert_message] =~ "File Submitted .*? for Analysis" {
        mutate {
            replace => {
                "_action" => "QUARANTINE"
            }
        }
    }

    if [_action] != "" {
        mutate {
            merge => {
                "_security_result.action" => "_action"
            }
        }
    }

    if [severity] == "Informational" {
        mutate {
            replace => {
                "_security_result.severity" => "INFORMATIONAL"
            }
        }
    } else if [severity] == "Low" {
        mutate {
            replace => {
                "_security_result.severity" => "LOW"
            }
        }
    } else if [severity] == "Medium" {
        mutate {
            replace => {
                "_security_result.severity" => "MEDIUM"
            }
        }
    } else if [severity] == "High" {
        mutate {
            replace => {
                "_security_result.severity" => "HIGH"
            }
        }
    }
    mutate {
        uppercase => ["BTP"]
        on_error => "no_BTP_uppercase"
    }
    if [BTP] =~ "LOW" {
        mutate {
            replace => {
                "_security_result.confidence" => "LOW_CONFIDENCE"
            }
            on_error => "no_low_confidence"
        }
    }
    else if [BTP] =~ "MEDIUM" {
        mutate {
            replace => {
                "_security_result.confidence" => "MEDIUM_CONFIDENCE"
            }
            on_error => "no_medium_confidence"
        }
    } else if [BTP] =~ "HIGH" {
        mutate {
            replace => {
                "_security_result.confidence" => "HIGH_CONFIDENCE"
            }
            on_error => "no_high_confidence"
        }
    }
    else if [BTP] =~ "UNKNOWN" {
        mutate {
            replace => {
                "_security_result.confidence" => "UNKNOWN_CONFIDENCE"
            }
            on_error => "no_unknown_confidence"
        }
    }

    if [has_principal] == "true"  and [has_target] == "true" {
    mutate {
            replace => {
                "_event_type" => "NETWORK_CONNECTION"
            }
        }
    }
    else if [has_principal] == "true"  and [has_target] == "false" {
        mutate {
            replace => {
                "_event_type" => "STATUS_UPDATE"
            }
        }
    }
    else {
        mutate {
            replace => {
                "_event_type" => "GENERIC_EVENT"
            }
        }
    }

    mutate {
        replace => {
            "event.idm.read_only_udm.metadata.event_type" => "%{_event_type}"
            "event.idm.read_only_udm.metadata.vendor_name" => "MCafee"
            "event.idm.read_only_udm.metadata.product_name" => "MCafee IPS"
        }
    }
    if [_security_result] != "" {
        mutate {
            merge => {
                "event.idm.read_only_udm.security_result" => "_security_result"
            }
            on_error => "no_security_result"
        }
    }
    if [_intermediary] != "" {
        mutate {
            merge => {
                "event.idm.read_only_udm.intermediary" => "_intermediary"
            }
            on_error => "no_intermediary"
        }
    }

    mutate {
        merge => {
            "@output" => "event"
        }
    }
}
