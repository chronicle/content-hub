# Google SecOps Default CBN Parser (MCAFEE_IPS)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/MCAFEE_IPS/default/mcafee_ips.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "MCAFEE"
      "event.idm.read_only_udm.metadata.product_name" => "MCAFEE_IPS"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
