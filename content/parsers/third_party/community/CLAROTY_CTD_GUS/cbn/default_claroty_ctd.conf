        mutate {
          replace => {
            "event_type" => "DEVICE_PROGRAM_UPLOAD"
            }
          on_error =>"no_metadata_event_type"
        }
    } else if [target_machine_id_present] == "true" && [has_principal_device] == "true" && [ctdeventtype] in ["Denial Of Service", "Known Threat Alert", "Known Threat Event", "Man-in-the-Middle Attack", "Policy Rule Match", "Policy Violation", "Suspicious Activity", "Suspicious File Transfer", "Protocol"] {
        mutate {
          replace => {
            "event_type" => "NETWORK_UNCATEGORIZED"
          }
          on_error =>"no_metadata_event_type"
        }
    } else if [suser] != "" && [ctdeventtype] in ["New Asset", "New Conflict Asset"] {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_CREATION"
          }
          on_error =>"no_metadata_event_type"
        }
    } else if [has_principal_device] == "true" && [ctdeventtype] == "Host Scan" {
        mutate {
          replace => {
            "event_type" => "SCAN_HOST"
          }
          on_error =>"no_metadata_event_type"
        }
    } else if [has_principal_device] == "true" && [ctdeventtype] == "Port Scan" {
        mutate {
          replace => {
            "event_type" => "SCAN_NETWORK"
          }
          on_error =>"no_metadata_event_type"
        }
    } else if [has_principal_device] == "true" && [ctdeventtype] in ["Memory Reset", "Online Edit", "Settings Change"] {
        mutate {
          replace => {
            "event_type" => "SETTING_MODIFICATION"
            "target.resource.type" => "SETTING"
          }
          on_error =>"no_metadata_event_type"
        }
    } else if [has_principal_device] == "true" && [ctdeventtype] == "Login" {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
          }
          on_error =>"no_metadata_event_type"
        }
    } else if [has_principal_device] == "true" && [target_machine_id_present] == "true" {
        mutate {
          replace => {
            "event_type" => "NETWORK_CONNECTION"
          }
          on_error =>"no_metadata_event_type"
        }
    }
    else if [has_principal_device] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
        on_error =>"no_metadata_event_type"
      }
    }
  }

  if [event_type] == "" {
    if ([has_principal_device] == "true" or [has_principal] == "true")
    and [has_target] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_principal_user] == "true" && ([msg] =~ "disconnected the server" or [msg] =~ "logged off" or [msg] =~ "disconnected") {
      mutate {
        replace => {
          "event_type" => "USER_LOGOUT"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [has_principal_user] == "true" && ([has_target_hostname] == "true" or [has_target_resource] == "true") && ([msg] =~ "opened the session" or [msg] =~ "connected" or [msg] =~ "logged into" or [msg] =~ "log into" or [msg] =~ "connect" or [msg] =~ "open the session") {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [has_principal_user] == "true" && ([has_target_hostname] == "true" or [has_target_resource] == "true") && [msg] =~ "deleted" {
      mutate {
        replace => {
          "event_type" => "RESOURCE_DELETION"
        }
      }
    }
    else if [has_principal_user] == "true" && ([has_target_hostname] == "true" or [has_target_resource] == "true") && [msg] =~ "modified" {
      mutate {
        replace => {
          "event_type" => "SETTING_MODIFICATION"
        }
      }
    }
    else if [has_principal_user] == "true" && [has_target_user] == "true" && [msg] =~ "added user" {
      mutate {
        replace => {
          "event_type" => "GROUP_MODIFICATION"
        }
      }
    }
    else if ([has_principal_user] == "true" && [has_target_user] == "true") && [msg] =~ "enabled" {
      mutate {
        replace => {
          "event_type" => "USER_CHANGE_PERMISSIONS"
        }
      }
    }
    else if [has_principal_user] == "true" || [has_target_user] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_target_resource] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else if [has_principal] == "true" and [has_principal_device] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "invalid_event_type"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [device_vendor] != "" {
    mutate {
      replace => {
        "metadata.vendor_name" => "%{device_vendor}"
      }
      on_error => "product_metadata_mapping_failure"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.vendor_name" => "CLAROTY"
      }
    }
  }
  if [device_product] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{device_product}"
      }
      on_error => "product_metadata_mapping_failure"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.product_name" => "CTD"
      }
    }
  }
  if [device_version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{device_version}"
      }
      on_error => "product_metadata_mapping_failure"
    }
  }
  if [target_machine_id_present] == "true" && [has_principal_device] == "true" && [ctdeventtype] in ["Known Threat Alert", "Known Threat Event"] && [security_description] != ""
  {
    grok {
        match => {
      "security_description" => [ ".*ET TROJAN (?P<threat_name>\\S+)\\s.*" ]
    }
    on_error => "not_valid_threat_name"
    overwrite => ["threat_name"]
    }
    if [threat_name] != ""
    {
      mutate {
        replace => {
          "security_result.threat_name" => "%{threat_name}"
        }
        on_error => "threat_name_not_present"
      }
    }
  }


  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_not_present"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_not_present"
    }
  }
  mutate {
    merge => {
      "event.idm.read_only_udm.extensions.vulns.vulnerabilities" => "vulns.vulnerabilities"
    }
    on_error => "merge_error_extensions"
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

