          "(?:<%{INT}>)?(?<timestamp>%{MONTH} +%{MONTHDAY} +%{YEAR} %{TIME})\\s+%{HOSTNAME:logging_device_name}?\\s?CEF:%{INT:version}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|(?:%{DATA:event_name}\\||)(?P<severity>Medium|MEDIUM|Low|LOW|HIGH|High|Unknown|Very-High|%{INT})(?:\\||)%{GREEDYDATA:cef_extension}",
