        ]
      }
      overwrite => ["version", "device_event_class_id", "event_name", "severity", "temp_header_data", "timestamp", "device_product", "device_vendor", "device_version", "cef_extension", "logging_device_name"]
      on_error => "not_grok_pattern"
    }

  if [not_grok_pattern] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }

  if [message] != "" {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:ts} %{DATA:obs} %{DATA}"
        ]
      }
      overwrite => ["obs"]
      on_error => "obs_grok_failed"
    }
    if ![obs_grok_failed] {
      grok {
        match => {
          "obs" => [
            "%{IP:obs}"
          ]
        }
        overwrite => ["obs"]
        on_error => "obs_host_grok_failed"
      }
      if ![obs_host_grok_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.observer.ip" => "obs"
          }
          on_error => "obs_host_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.hostname" => "%{obs}"
          }
          on_error => "obs_host_replace_failed"
        }
      }
    }
  }

