# Product: Duo Context
# Category: Identity and Access Management
# Supported Format: JSON
# Reference: https://duo.com/product/multi-factor-authentication-mfa
# Last Updated: 2022-03-14
# Copyright 2022 Chronicle LLC



filter {
  mutate {
    replace => {
      "device_name" => ""
      "email" => ""
      "epkey" => ""
      "firewall_status" => ""
      "hardware_uuid" => ""
      "os_build" => ""
      "os_family" => ""
      "os_version" => ""
      "disk_encryption_status" => ""
      "password_status" => ""
      "security_agents" => ""
      "trusted_endpoint" => ""
      "type" => ""
      "username" => ""
      "username1" => ""
      "last_seen" => ""
      "activated" => ""
      "phone_id" => ""
      "user_entity" => ""
      "relations" => ""
      "number" => ""
      "model" => ""
      "user_id" => ""
      "encrypted" => ""
      "fingerprint" => ""
      "token_id" => ""
    }
  }

  # - change bools to string
  mutate {
    gsub => ["message", "\"activated\":(false|true)", "\"activated\":\"$1\""]
  }

  # add Z for ISO8601 date module to work
  mutate {
    gsub => ["message", "\"last_seen\": \"(.*?)\"", "\"last_seen\":\"$1Z\""]
  }

  # parse log as json
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  else {
    for idx, user in users {
      if [idx] == 0 {
        mutate {
          replace => {
            "email" => "%{user.email}"
            "user_id" => "%{user.user_id}"
            "username" => "%{user.username}"
          }
          on_error => "no_email_or_user"
        }
      }
      if [idx] == 1 {
        mutate {
          replace => {
            "username1" => "%{user.username}"
          }
          on_error => "no_email_or_user"
        }
      }
    }

    if [device_name] == "" and [user_id] == "" {
      drop {
        tag => "TAG_NO_SECURITY_VALUE"
      }
    }
    mutate {
      replace => {
        "metadata.vendor_name" => "Duo"
        "metadata.product_name" => "Duo Entity Context Data"
        "metadata.entity_type" => "ASSET"
      }
    }

    if [type] =~ /(?i)mobile/ {
      mutate {
        replace => {
          "asset_entity.asset.type" => "MOBILE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "asset_entity.asset.type" => "LAPTOP"
        }
      }
    }

    if [number] != "" {
      mutate {
        merge => {
          "user_entity.user.phone_numbers" => "number"
        }
      }
    }

    if [model] != "" {
      mutate {
        replace => {
          "hardware.model" => "%{model}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.hardware" => "hardware"
        }
      }
    }

    if [username] != "" {
      grok {
        match => {
          "username" => "^(?P<_username>.*?)@"
        }
        on_error => "grok_username_fail"
      }

      if [grok_username_fail] {
        mutate {
          replace => {
            "_username" => "%{username}"
          }
        }
      }

      mutate {
        replace => {
          "user_entity.user.userid" => "%{_username}"
        }
      }
    }

    if [email] != "" and [email] =~ "@" {
      mutate {
        merge => {
          "user_entity.user.email_addresses" => "email"
        }
      }
      mutate {
        replace => {
          "relations.entity_type" => "USER"
          "relations.relationship" => "OWNS"
        }
      }
    }
    else if [email] == "" {
      if [username] != "" and [username] =~ "@" {
        mutate {
          merge => {
            "user_entity.user.email_addresses" => "username"
          }
        }
        mutate {
          replace => {
            "relations.entity_type" => "USER"
            "relations.relationship" => "OWNS"
          }
        }
      }
      else if [username1] != "" and [username1] =~ "@" {
        mutate {
          merge => {
            "user_entity.user.email_addresses" => "username1"
          }
        }
        mutate {
          replace => {
            "relations.entity_type" => "USER"
            "relations.relationship" => "OWNS"
          }
        }
      }
      else {
        drop {
          tag => "TAG_NO_SECURITY_VALUE"
        }
      }
    }

    if [hardware_uuid] != "" {
      mutate {
        replace => {
          "asset_entity.asset.asset_id" => "%{hardware_uuid}"
        }
      }
    }
    else if [user_id] != "" {
      mutate {
        replace => {
          "asset_entity.asset.asset_id" => "%{user_id}"
        }
      }
    }

    if [epkey] != "" {
      mutate {
        replace => {
          "asset_entity.asset.product_object_id" => "%{epkey}"
        }
      }
    }
    else if [phone_id] != "" {
      mutate {
        replace => {
          "asset_entity.asset.product_object_id" => "%{phone_id}"
        }
      }
    }
    else if [token_id] != "" {
      mutate {
        replace => {
          "asset_entity.asset.product_object_id" => "%{token_id}"
        }
      }
    }

    if [device_name] != "" {
      mutate {
        replace => {
          "asset_entity.asset.hostname" => "%{device_name}"
        }
      }
    }

    for browser in browsers {
      mutate {
        replace => {
          "software.name" => "%{browser.browser_family}"
          "software.version" => "%{browser.browser_version}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.software" => "software"
        }
      }
      mutate {
        replace => {
          "software" => ""
        }
      }
    }

    if [activated] == "false" {
      mutate {
        replace => {
          "asset_entity.asset.deployment_status" => "DECOMISSIONED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "asset_entity.asset.deployment_status" => "ACTIVE"
        }
      }
    }

    if [last_seen] != "" {
      date {
        match => ["last_seen", "ISO8601" ]
        target => "asset_entity.asset.last_discover_time"
      }
    }

    if [os_family] != "" {
      if [os_family] =~ "(?i)windows" {
        mutate {
          replace => {
            "asset_entity.asset.platform_software.platform" => "WINDOWS"
          }
        }
      }
      else if [os_family] =~ "(?i)linux" {
        mutate {
          replace => {
            "asset_entity.asset.platform_software.platform" => "LINUX"
          }
        }
      }
      else if [os_family] =~ "(?i)mac" {
        mutate {
          replace => {
            "asset_entity.asset.platform_software.platform" => "MAC"
          }
        }
      }
      mutate {
        replace => {
          "asset_entity.asset.platform_software.platform_version" => "%{os_version}"
        }
      }
    }

    # UDM > Entity >Asset > Attribute Labels
    if [disk_encryption_status] != "" {
      mutate {
        lowercase => [ "disk_encryption_status" ]
      }
      mutate {
        replace => {
          "label_disk_encryption_status.key" => "disk_encryption_status"
          "label_disk_encryption_status.value" => "%{disk_encryption_status}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.attribute.labels" => "label_disk_encryption_status"
        }
      }
    }

    if [firewall_status] != "" {
      mutate {
        lowercase => [ "firewall_status" ]
      }
      mutate {
        replace => {
          "label_firewall_status.key" => "firewall_status"
          "label_firewall_status.value" => "%{firewall_status}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.attribute.labels" => "label_firewall_status"
        }
      }
    }

    if [password_status] != "" {
      mutate {
        lowercase => [ "password_status" ]
      }
      mutate {
        replace => {
          "label_password_status.key" => "password_status"
          "label_password_status.value" => "%{password_status}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.attribute.labels" => "label_password_status"
        }
      }
    }

    if [trusted_endpoint] != "" {
      mutate {
        lowercase => [ "trusted_endpoint" ]
      }
      mutate {
        replace => {
          "label_trusted_endpoint.key" => "trusted_endpoint"
          "label_trusted_endpoint.value" => "%{trusted_endpoint}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.attribute.labels" => "label_trusted_endpoint"
        }
      }
    }

    if [encrypted] != "" {
      mutate {
        lowercase => [ "encrypted" ]
      }
      mutate {
        replace => {
          "label_encrypted.key" => "Encrypted"
          "label_encrypted.value" => "%{encrypted}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.attribute.labels" => "label_encrypted"
        }
      }
    }

    if [fingerprint] != "" {
      mutate {
        lowercase => [ "fingerprint" ]
      }
      mutate {
        replace => {
          "label_fingerprint.key" => "Finger Print"
          "label_fingerprint.value" => "%{fingerprint}"
        }
      }
      mutate {
        merge => {
          "asset_entity.asset.attribute.labels" => "label_fingerprint"
        }
      }
    }

    if [security_agents] != "" {
      for agent in security_agents {
        mutate {
          replace => {
            "software.name" => "%{agent.security_agent}"
            "software.version" => "%{agent.version}"
          }
        }
        mutate {
          merge => {
            "asset_entity.asset.software" => "software"
          }
        }
        mutate {
          replace => {
            "software" => ""
          }
        }
      }
    }

    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.entity.metadata"
        }
      }
    }

    if [asset_entity] != "" {
      mutate {
        rename => {
          "asset_entity" => "event.idm.entity.entity"
        }
      }
    }

    if [user_entity] != "" {
      mutate {
        rename => {
          "user_entity" => "relations.entity"
        }
      }
    }

    if [relations] != "" {
      mutate {
        merge => {
          "event.idm.entity.relations" => "relations"
        }
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
