    }
    if [ClientIP] != "" {
      grok {
        match => {
          "ClientIP" => "%{IP:client_ip}:%{INT:client_port}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "client_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "client_ip"
        }
        on_error => "no_client_ip"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{client_port}"
        }
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
      }
    }

    if [IPString] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "IPString"
        }
        on_error => "no_ip_string"
      }
      if ![no_ip_string] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [UserSID] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.windows_sid" => "%{UserSID}"
          "has_user" => "true"
        }
        on_error => "field_not_set"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{Hostname}"
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        "has_target" => "true"
      }
    }
  } else if [EventID] == "140" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{UserName}"
        "has_user" => "true"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCHEDULED_TASK_MODIFICATION"
        "event.idm.read_only_udm.target.resource.resource_type" => "TASK"
      }
    }
  } else if ([EventID] in ["1002","33","58"]) or ([EventID] == "5" and [SourceName] == "Microsoft-Windows-User Profiles Service") {
    mutate {
      replace => {
        "security_result.description" => "Error Code: %{hrError}"
      }
      on_error => "field_not_set"
    }
    if [EventID] in ["33","58"] and [SourceName] == "volsnap" {
      grok {
        match => {
          "Message" => ".*volume %{WORD:directory}:"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{directory}://"
        }
      }
    } else if [EventID] == "5" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{File}"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  } else if [EventID] in ["4624","4648","4672","4625"] {
    if [TargetUserSid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.windows_sid" => "%{TargetUserSid}"
          "has_user" => "true"
        }
        on_error => "field_not_set"
      }
    }

    if [TargetServerName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{TargetServerName}"
          "has_target" => "true"
        }
        on_error => "field_not_set"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{LogonProcessName}"
      }
      on_error => "field_not_set"
    }

    if [LogonType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "%{LogonType}"
      }
      on_error => "logon_type_not_set"
    }
    }

    if [LogonType] == "" and [SubjectLogonId] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.auth_details" => "%{SubjectLogonId}"
        }
        on_error => "SubjectLogonId_not_set"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{AuthenticationPackageName}"
      }
      on_error => "field_not_set"
    }

    if [TargetUserName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{TargetUserName}"
          "has_user" => "true"
        }
        on_error => "field_not_set"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.administrative_domain" => "%{TargetDomainName}"
      }
      on_error => "field_not_set"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{ProcessName}"
      }
      on_error => "field_not_set"
    }

    if [PrivilegeList] != "" {
      mutate {
        replace => {
          "PrivilegeList" => "{\"PrivilegeList\":[\"%{PrivilegeList}\"]}"
        }
      }
      mutate {
        gsub => ["PrivilegeList", "\\r\\n\\t\\t\\t", "\",\""]
      }
      mutate {
        gsub => ["PrivilegeList", "\\n\\t\\t\\t", "\",\""]
      }
      json {
        source => "PrivilegeList"
        array_function => "split_columns"
        on_error => "privilege_list_not_json"
      }
      for name in PrivilegeList {
        mutate {
          replace => {
            "privilege_list.name" => "%{name}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.attribute.permissions" => "privilege_list"
          }
          on_error => "privilege_list_not_set"
        }
      }
    }

    if [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "has_user" => "true"
        }
      }
    }
    if [SubjectDomainName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{SubjectDomainName}"
        }
        on_error => "no_subject_domain_name"
      }
    }
  } else if [EventID] == "4634" {
    if [LogonType] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{TargetUserName}"
          "event.idm.read_only_udm.target.administrative_domain" => "%{TargetDomainName}"
          "event.idm.read_only_udm.target.user.windows_sid" => "%{TargetUserSid}"
          "event.idm.read_only_udm.extensions.auth.auth_details" => "%{LogonType}"
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "has_user" => "true"
        }
      }
    }
  } else if [EventID] == "57405" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{AppDomain}"
        "security_result.description" => "%{SerializedException}"
        "event.idm.read_only_udm.metadata.event_type" => "FILE_READ"
      }
    }
  } else if [EventID] in ["7036","8224","903","50037"] {
    if [EventID] == "7036" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{param1}"
        }
        on_error => "param1_not_set"
      }
      mutate {
        replace => {
          "security_result.action_details" => "%{param2}"
        }
        on_error => "param2_not_set"
      }
    } else if [EventID] in ["8224","50037"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{SourceName}"
        }
      }
    } else if [EventID] == "903" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "Software Protection"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SERVICE_STOP"
      }
    }
  } else if [EventID] in ["900","16384","902","4104"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "Software Protection"
        "event.idm.read_only_udm.metadata.event_type" => "SERVICE_START"
      }
    }
  } else if [EventID] == "9001" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{UncPath}"
        "event.idm.read_only_udm.metadata.event_type" => "GROUP_UNCATEGORIZED"
      }
    }
  } else if [EventID] in ["5058","5061"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{KeyName}"
        "has_user" => "true"
      }
    }
    if [SubjectDomainName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{SubjectDomainName}"
        }
        on_error => "no_subject_domain_name"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{KeyFilePath}"
      }
      on_error => "field_not_set"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  } else if ([EventID] == "102" and [SourceName] == "ESENT") or ([EventID] == "4" and [SourceName] == "Microsoft-Windows-Servicing") {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "Event Logging Service"
        "event.idm.read_only_udm.metadata.event_type" => "SERVICE_UNSPECIFIED"
      }
    }
  } else if ([EventID] == "4" and [SourceName] == "Microsoft-Windows-User Profiles Service") {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{SourceName}"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
      }
    }
  } else if ([EventID] == "4" and [SourceName] != "Microsoft-Windows-Servicing") or ([EventID] == "5" and [SourceName] == "TransparentInstaller") {
    mutate {
      merge => {
        "security_result.category_details" => "category"
      }
      on_error => "field_not_set"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{EventTid}"
      }
      on_error => "field_not_set"
    }
    if [EventID] == "4" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{EventID}"
        }
        on_error => "field_not_set"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_UNCATEGORIZED"
      }
    }
  } else if [EventID] in ["4103","4100"] {
    mutate {
      gsub => ["ContextInfo", " = ", "="]
    }
    mutate {
      gsub => ["ContextInfo", "\\s\\s+", ";"]
    }
    mutate {
      gsub => ["ContextInfo", "(\\w+) (\\w+)=", "$1$2="]
    }
    kv {
      source => "ContextInfo"
      field_split => ";"
      value_split => "="
      whitespace => "strict"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{HostName}"
        "event.idm.read_only_udm.target.asset_id" => "Host Id:%{HostID}"
        "event.idm.read_only_udm.target.process.command_line" => "%{HostApplication}"
        "event.idm.read_only_udm.metadata.event_type" => "SERVICE_START"
        "has_target" => "true"
      }
    }
  } else if [EventID] == "53504" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{param1}"
        "event.idm.read_only_udm.target.application" => "%{param2}"
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_OPEN"
      }
    }
  } else if [EventID] == "4816" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "PeerName"
      }
      on_error => "field_not_set"
    }
    if ![field_not_set] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_FLOW"
      }
    }
  }
  if [event][idm][read_only_udm][principal][user][userid] == "" and [target_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{target_user}"
        "has_user" => "true"
      }
      on_error => "target_user_not_set"
    }
    if ![target_user_not_set] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
        on_error => "event_type_not_set"
      }
    }
  }

  if [security][user_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{security.user_id}"
      }
      on_error => "security_user_id_not_set"
    }
  }
  for detail in details.AdditionalContext {
    kv {
      source => "detail"
      field_split => ""
      value_split => ":"
      whitespace => "strict"
      on_error => "kv_not_found"
    }
  }
  mutate {
    replace => {
      "Activity_ID" => "%{Activity ID}"
    }
    on_error => "activity_id_not_set"
  }
  if [Activity_ID] != "" {
    mutate {
      convert => {
        "Activity_ID" => "string"
      }
      on_error => "activity_id_not_string"
    }
    mutate {
      replace => {
        "Activity_ID_label.key" => "Activity_ID"
        "Activity_ID_label.value" => "%{Activity_ID}"
      }
      on_error => "activity_id_not_set"
    }
    if ![activity_id_not_set] {
      mutate {
        merge => {
          "security_result.detection_fields" => "Activity_ID_label"
        }
        on_error => "activity_id_not_set"
      }
    }
  }
  mutate {
    replace => {
      "Instance_ID" => "%{Instance ID}"
    }
    on_error => "instance_id_not_set"
  }
  if [Instance_ID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{Instance_ID}"
      }
      on_error => "instance_id_not_set"
    }
  }
  mutate {
    replace => {
      "Client_IP" => "%{Client IP}"
    }
    on_error => "client_ip_not_set"
  }
  if [Client_IP] != "" {
    grok {
      match => {
        "Client IP" => "%{IP:Client_IP}"
      }
      overwrite => ["Client_IP"]
      on_error => "client_ip_not_grok"
    }
    if ![client_ip_not_grok] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "Client_IP"
          "event.idm.read_only_udm.principal.asset.ip" => "Client_IP"
        }
        on_error => "client_ip_not_merged"
      }
      if ![client_ip_not_merged] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  mutate {
    replace => {
      "Local_IP" => "%{Local IP}"
    }
    on_error => "local_ip_not_set"
  }
  if [Local_IP] != "" {
    grok {
      match => {
        "Local IP" => "%{IP:Local_IP}"
      }
      overwrite => ["Local_IP"]
      on_error => "local_ip_not_grok"
    }
    if ![local_ip_not_grok] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "Local_IP"
          "event.idm.read_only_udm.target.asset.ip" => "Local_IP"
        }
        on_error => "local_ip_not_merged"
      }
      if ![local_ip_not_merged] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  mutate {
    replace => {
      "Local_Port" => "%{Local Port}"
    }
    on_error => "local_port_not_set"
  }
  if [Local_Port] != "" {
    grok {
      match => {
        "Local Port" => "%{INT:Local_Port}"
      }
      overwrite => ["Local_Port"]
      on_error => "local_port_not_grok"
    }
    if ![local_port_not_grok] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{Local_Port}"
        }
        on_error => "local_port_not_set"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
        on_error => "local_port_not_string"
      }
    }
  }

  mutate {
    replace => {
      "User_Agent" => "%{User Agent}"
    }
    on_error => "user_agent_not_set"
  }
  if [User_Agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{User_Agent}"
        "is_http" => "true"
      }
      on_error => "user_agent_not_set"
    }
    if ![user_agent_not_set] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.parsed_user_agent" => "%{User_Agent}"
        }
        on_error => "parsed_user_agent_not_set"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.network.http.parsed_user_agent" => "parseduseragent"
        }
        on_error => "parsed_user_agent_not_string"
      }
    }
  }

  if [SubjectUserSid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.windows_sid" => "%{SubjectUserSid}"
        "has_user" => "true"
      }
      on_error => "SubjectUserSid_not_set"
    }
  }

  if [SubjectUserName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{SubjectUserName}"
        "has_user" => "true"
      }
      on_error => "SubjectUserName_not_set"
    }
  }
  if [event][idm][read_only_udm][metadata][event_type] =~ "GENERIC_" and [Hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  if [event][idm][read_only_udm][metadata][event_type] in ["GENERIC_EVENT", "STATUS_UPDATE", "USER_UNCATEGORIZED"] {
    if [has_principal] == "true" and [has_target] == "true" and [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [has_principal] == "true" and [has_target] == "true" and [is_http] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        }
      }
    }
    else if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
  }
  # Setting UDM Nouns

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_not_found"
    }
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_not_found"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
