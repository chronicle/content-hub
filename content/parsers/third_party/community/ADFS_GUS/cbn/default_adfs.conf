# Product: ADFS
# Category: LDAP
# Supported Format:JSON
# Reference: https://docs.microsoft.com/en-us/windows-server/identity/active-directory-federation-services
# Last Updated: 2026-01-20
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "Category" => ""
      "SourceModuleType" => ""
      "ProcessID" => ""
      "ActivityID" => ""
      "AccountName" => ""
      "AccountType" => ""
      "TaskName" => ""
      "Path" => ""
      "ClientIP" => ""
      "IPString" => ""
      "InstanceId" => ""
      "TaskInstanceId" => ""
      "QueuedTaskInstanceId" => ""
      "InstancePath" => ""
      "SessionId" => ""
      "PrivilegeList" => ""
      "SessionID" => ""
      "Hostname" => ""
      "Message" => ""
      "url_absolute_path" => ""
      "query_string" => ""
      "local_port" => ""
      "email" => ""
      "user_email" => ""
      "instance_id" => ""
      "User_Id" => ""
      "Ip_Address" => ""
      "Proxy_Server" => ""
      "SchemaVersion" => ""
      "RuleName" => ""
      "RuleId" => ""
      "ModifyingUser" => ""
      "ModifyingApplication" => ""
      "TargetUserSid" => ""
      "TargetServerName" => ""
      "TargetUserName" => ""
      "SubjectDomainName" => ""
      "SubjectUserSid" => ""
      "SubjectLogonId" => ""
      "SubjectUserName" => ""
      "UserID" => ""
      "UserSID" => ""
      "System.Channel" => ""
      "System.EventId" => ""
      "System.EventRecordID" => ""
      "System.Keywords" => ""
      "System.Level" => ""
      "System.Opcode" => ""
      "System.ProcessID" => ""
      "System.ProviderName" => ""
      "System.Task" => ""
      "System.ThreadID" => ""
      "System.TimeCreated" => ""
      "SystemTime" => ""
      "System.UserId" => ""
      "System.Version" => ""
      "System.Computer" => ""
      "EventTime" => ""
      "security_result" => ""
      "usersid" => ""
      "ThreadID" => ""
      "Keywords" => ""
      "Level" => ""
      "xml_data" => ""
      "EventData.xml_data" => ""
      "AuditType" => ""
      "AuditResult" => ""
      "FailureType" => ""
      "ErrorCode" => ""
      "RelyingParty" => ""
      "ClaimsProvider" => ""
      "UserId" => ""
      "PrimaryAuth" => ""
      "DeviceAuth" => ""
      "DeviceId" => ""
      "MfaPerformed" => ""
      "MfaMethod" => ""
      "TokenBindingProvidedId" => ""
      "TokenBindingReferredId" => ""
      "SsoBindingValidationLevel" => ""
      "OAuthClientId" => ""
      "Server" => ""
      "AuthProtocol" => ""
      "NetworkLocation" => ""
      "IpAddress" => ""
      "ForwardedIpAddress" => ""
      "ProxyIpAddress" => ""
      "NetworkIpAddress" => ""
      "ProxyServer" => ""
      "Endpoint" => ""
      "OAuthGrant" => ""
      "RecordNumber" => ""
      "SourceName" => ""
      "EventID" => ""
      "Severity" => ""
      "cribl" => ""
      "cribl_pipe" => ""
      "_raw.Event.System.Computer" => ""
      "_raw.Event.System.EventRecordID" => ""
      "_raw.Event.System.Channel" => ""
      "_raw.Event.System.Keywords" => ""
      "_raw.Event.System.Task" => ""
      "_raw.Event.System.Level" => ""
      "_raw.Event.System.EventID._value" => ""
      "_raw.Event.System.EventID.Qualifiers" => ""
      "source" => ""
      "index" => ""
      "sourcetype" => ""
      "host" => ""
      "about" => ""
      "event_data_available" => "false"
      "SLD_ctl_ADFS_rte" => ""
      "EventData.Data" => ""
      "has_principal" => "false"
      "Channel" => ""
      "principal_user" => ""
      "event.idm.read_only_udm.principal.user.userid" => ""
      "target_user" => ""
      "EventType" => ""
      "url" => ""
      "has_target" => "false"
      "has_user" => "false"
      "is_http" => "false"
      "TargetDomainName" => ""
      "KeyName" => ""
      "LogonType" => ""
      "security.user_id" => ""
      "Activity_ID" => ""
      "Client_IP" => ""
      "Instance_ID" => ""
      "Local_IP" => ""
      "Local_Port" => ""
      "User_Agent" => ""
    }
  }

  mutate {
    gsub => ["message","%2","xml_data"]
  }
  mutate {
    gsub => ["message","\\r\\n\\s+",""]
  }
  mutate {
    gsub => ["message","Additional Context","AdditionalContext"]
  }
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:ts} %{IP:ip} %{GREEDYDATA:message}"
    }
    overwrite => ["message"]
    on_error => "no_header"
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_error"
  }

  if [json_parse_error] {
    if [message] =~ "<Event" {
      for index, _ in xml(message,/Event) {
        xml {
          source => "message"
            xpath => {
              "/Event[%{index}]/System/EventID" => "EventID"
              "/Event[%{index}]/System/Provider/@Guid" => "ProviderGuid"
              "/Event[%{index}]/System/Provider/@Name" => "SourceName"
              "/Event[%{index}]/System/Version" => "System.Version"
              "/Event[%{index}]/System/Correlation/@ActivityID" => "ActivityID"
              "/Event[%{index}]/System/Level" => "Level"
              "/Event[%{index}]/System/Opcode" => "System.Opcode"
              "/Event[%{index}]/System/Task" => "System.Task"
              "/Event[%{index}]/System/EventRecordID" => "RecordNumber"
              "/Event[%{index}]/System/Keywords" => "Keywords"
              "/Event[%{index}]/System/Computer" => "Hostname"
              "/Event[%{index}]/System/Channel" => "Channel"
              "/Event[%{index}]/System/Security/@UserID" => "usersid"
              "/Event[%{index}]/System/Execution/@ProcessID" => "ProcessID"
              "/Event[%{index}]/System/Execution/@ThreadID" => "ThreadID"
              "/Event[%{index}]/System/TimeCreated/@SystemTime" => "SystemTime"
              "/Event[%{index}]/RenderingInfo/Message" => "Message"
              "/Event[%{index}]/RenderingInfo/Keywords/Keyword[1]" =>"EventType"
              "/Event[%{index}]/EventData/Data" => "event_data"
              "/Event[%{index}]/EventData/Data[@Name='param1']" => "param1"
              "/Event[%{index}]/EventData/Data[@Name='param2']" => "param2"
            }
            on_error => "xml_error"
        }
      }
      if [EventID] in ["1202", "410", "404"] {
        mutate {
          replace => {
            "Message" => ""
          }
        }
      }
      grok {
        match => {
          "message" => [
                      "%{DATA}%{EMAILADDRESS:target_user}-This user %{GREEDYDATA}",
                      "%{DATA}%{EMAILADDRESS:target_user}-The user %{GREEDYDATA}",
                      "%{DATA}%{USERNAME:target_user}-The user name %{GREEDYDATA}",
                      "%{DATA}%{USERNAME:target_user}-This user %{GREEDYDATA}"]
        }
        overwrite => ["target_user"]
        on_error => "no_account_name"
      }
    }
    else {
      mutate {
        replace => {
          "message" => "{\"System\":%{message}"
        }
      }
      json {
        source => "message"
        array_function => "split_columns"
        on_error => "json_parse_error"
      }
      if [json_parse_error] {
        drop {
          tag => "TAG_MALFORMED_MESSAGE"
        }
      }
    }
  }

  if [EventData][xml_data] != "" {
    mutate {
      gsub => ["EventData.xml_data","\\n",""]
    }
    grok {
      match => {
        "EventData.xml_data" => "%{DATA:test}(?P<xml_data><AuditBase.*)"
      }
      overwrite => ["xml_data"]
      on_error => "not_xml"
    }

    xml {
      source => "xml_data"
      xpath => {
        "/AuditBase/AuditType" => "AuditType"
        "/AuditBase/AuditResult" => "AuditResult"
        "/AuditBase/FailureType" => "FailureType"
        "/AuditBase/ErrorCode" => "ErrorCode"
      }
    }
    for index, _ in xml(xml_data,/AuditBase/ContextComponents/Component) {
      xml {
        source => "xml_data"
        xpath => {
          "/AuditBase/ContextComponents/Component[%{index}]/RelyingParty" =>"RelyingParty"
          "/AuditBase/ContextComponents/Component[%{index}]/ClaimsProvider" => "ClaimsProvider"
          "/AuditBase/ContextComponents/Component[%{index}]/UserId" => "UserId"
          "/AuditBase/ContextComponents/Component[%{index}]/PrimaryAuth" => "PrimaryAuth"
          "/AuditBase/ContextComponents/Component[%{index}]/DeviceAuth" => "DeviceAuth"
          "/AuditBase/ContextComponents/Component[%{index}]/DeviceId" => "DeviceId"
          "/AuditBase/ContextComponents/Component[%{index}]/MfaPerformed" => "MfaPerformed"
          "/AuditBase/ContextComponents/Component[%{index}]/MfaMethod" => "MfaMethod"
          "/AuditBase/ContextComponents/Component[%{index}]/TokenBindingProvidedId" => "TokenBindingProvidedId"
          "/AuditBase/ContextComponents/Component[%{index}]/TokenBindingReferredId" => "TokenBindingReferredId"
          "/AuditBase/ContextComponents/Component[%{index}]/SsoBindingValidationLevel" => "SsoBindingValidationLevel"
          "/AuditBase/ContextComponents/Component[%{index}]/OAuthClientId" => "OAuthClientId"
          "/AuditBase/ContextComponents/Component[%{index}]/OAuthGrant" => "OAuthGrant"
          "/AuditBase/ContextComponents/Component[%{index}]/Server" => "Server"
          "/AuditBase/ContextComponents/Component[%{index}]/AuthProtocol" => "AuthProtocol"
          "/AuditBase/ContextComponents/Component[%{index}]/NetworkLocation" => "NetworkLocation"
          "/AuditBase/ContextComponents/Component[%{index}]/IpAddress" => "Client IP"
          "/AuditBase/ContextComponents/Component[%{index}]/ForwardedIpAddress" => "ForwardedIpAddress"
          "/AuditBase/ContextComponents/Component[%{index}]/ProxyIpAddress" => "ProxyIpAddress"
          "/AuditBase/ContextComponents/Component[%{index}]/NetworkIpAddress" => "NetworkIpAddress"
          "/AuditBase/ContextComponents/Component[%{index}]/ProxyServer" => "ProxyServer"
          "/AuditBase/ContextComponents/Component[%{index}]/UserAgentString" => "User Agent"
          "/AuditBase/ContextComponents/Component[%{index}]/Endpoint" => "Endpoint"
        }
      }
    }
  }

  if [EventData][Data] not in ["","-"] {
    mutate {
      gsub => ["EventData.Data","\\n",""]
    }
    grok {
      match => {
        "EventData.Data" => "%{DATA:test}(?P<xml_data><AuditBase.*)"
      }
      overwrite => ["xml_data"]
      on_error => "not_xml"
    }
    xml {
      source => "xml_data"
      xpath => {
        "/AuditBase/AuditType" => "AuditType"
        "/AuditBase/AuditResult" => "AuditResult"
        "/AuditBase/FailureType" => "FailureType"
        "/AuditBase/ErrorCode" => "ErrorCode"
      }
      on_error => "xml_error"
    }
    for index, _ in xml(xml_data,/AuditBase/ContextComponents/Component) {
      xml {
        source => "xml_data"
        xpath => {
          "/AuditBase/ContextComponents/Component[%{index}]/RelyingParty" =>"RelyingParty"
          "/AuditBase/ContextComponents/Component[%{index}]/ClaimsProvider" => "ClaimsProvider"
          "/AuditBase/ContextComponents/Component[%{index}]/UserId" => "UserId"
          "/AuditBase/ContextComponents/Component[%{index}]/PrimaryAuth" => "PrimaryAuth"
          "/AuditBase/ContextComponents/Component[%{index}]/DeviceAuth" => "DeviceAuth"
          "/AuditBase/ContextComponents/Component[%{index}]/DeviceId" => "DeviceId"
          "/AuditBase/ContextComponents/Component[%{index}]/MfaPerformed" => "MfaPerformed"
          "/AuditBase/ContextComponents/Component[%{index}]/MfaMethod" => "MfaMethod"
          "/AuditBase/ContextComponents/Component[%{index}]/TokenBindingProvidedId" => "TokenBindingProvidedId"
          "/AuditBase/ContextComponents/Component[%{index}]/TokenBindingReferredId" => "TokenBindingReferredId"
          "/AuditBase/ContextComponents/Component[%{index}]/SsoBindingValidationLevel" => "SsoBindingValidationLevel"
          "/AuditBase/ContextComponents/Component[%{index}]/OAuthClientId" => "OAuthClientId"
          "/AuditBase/ContextComponents/Component[%{index}]/OAuthGrant" => "OAuthGrant"
          "/AuditBase/ContextComponents/Component[%{index}]/Server" => "Server"
          "/AuditBase/ContextComponents/Component[%{index}]/AuthProtocol" => "AuthProtocol"
          "/AuditBase/ContextComponents/Component[%{index}]/NetworkLocation" => "NetworkLocation"
          "/AuditBase/ContextComponents/Component[%{index}]/IpAddress" => "Client IP"
          "/AuditBase/ContextComponents/Component[%{index}]/ForwardedIpAddress" => "ForwardedIpAddress"
          "/AuditBase/ContextComponents/Component[%{index}]/ProxyIpAddress" => "ProxyIpAddress"
          "/AuditBase/ContextComponents/Component[%{index}]/NetworkIpAddress" => "NetworkIpAddress"
          "/AuditBase/ContextComponents/Component[%{index}]/ProxyServer" => "ProxyServer"
          "/AuditBase/ContextComponents/Component[%{index}]/UserAgentString" => "User Agent"
          "/AuditBase/ContextComponents/Component[%{index}]/Endpoint" => "Endpoint"
        }
        on_error => "xml_error2"
      }
    }
    if [xml_data] == "" {
      mutate {
        replace => {
          "event_data_label.key" => "EventData"
          "event_data_label.value" => "%{EventData.Data}"
        }
        on_error => "no_event_data"
      }
      if ![no_event_data] {
        mutate {
          merge => {
            "security_result.detection_fields" => "event_data_label"
          }
          on_error => "no_event_data_label"
        }
      }
    }
  }

  mutate {
    convert => {
      "EventTime" => "string"
    }
    on_error => "already_string"
  }
  mutate {
    gsub => ["EventTime","(\\d{10})\\d+" ,"$1" ]
  }

  date {
    match => ["EventTime", "yyyy-MM-dd HH:mm:ss","ISO8601","UNIX","UNIX_MS"]
    on_error => "date_not_in_proper_format"
  }
  for data in _raw.Event.EventData.Data {
    mutate {
      replace => {
        "value_array" => ""
      }
    }
    mutate {
      replace => {
        "value_array.string_value" => "%{data}"
      }
      on_error => "additional_data_empty"
    }
    mutate {
      merge => {
        "additional_data.value.list_value.values" => "value_array"
      }
      on_error => "additional_data_not_found"
    }
    if [value_array] != "" {
      mutate {
        replace => {
          "event_data_available" => "true"
        }
      }
    }
  }
  if [event_data_available] == "true" {
    mutate {
      replace => {
        "additional_data.key" => "EventData"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_data"
      }
      on_error => "additional_data_field_not_found"
    }
  }
  for criblpipe in cribl_pipe {
    mutate {
      replace => {
        "value_array" => ""
      }
    }
    mutate {
      replace => {
        "value_array.string_value" => "%{criblpipe}"
      }
      on_error => "additional_criblpipe_empty"
    }
    mutate {
      merge => {
        "additional_criblpipe.value.list_value.values" => "value_array"
      }
      on_error => "additional_criblpipe_not_found"
    }
  }
  if [cribl_pipe] != "" {
    mutate {
      replace => {
        "additional_criblpipe.key" => "cribl_pipe"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_criblpipe"
      }
      on_error => "additional_criblpipe_field_not_found"
    }
  }
  if [SystemTime] != "" {
    mutate {
      replace => {
        "SystemTime_label.key" => "TimeCreated SystemTime"
        "SystemTime_label.value.string_value" => "%{SystemTime}"
      }
      on_error => "SystemTime_empty"
    }
    if ![SystemTime_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "SystemTime_label"
        }
        on_error => "SystemTime_label_empty"
      }
    }
  }
  if [_raw][Event][System][Computer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{_raw.Event.System.Computer}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{_raw.Event.System.Computer}"
        "has_principal" => "true"
      }
      on_error => "Computer_empty"
    }
  }
  if [_raw][Event][System][EventRecordID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{_raw.Event.System.EventRecordID}"
      }
      on_error => "EventRecordID_empty"
    }
  }
  if [_raw][Event][System][Channel] != "" {
    mutate {
      replace => {
        "Channel_label.value.string_value" => "%{_raw.Event.System.Channel}"
      }
      on_error => "Channel_empty"
    }
    if ![Channel_empty] {
      mutate {
        replace => {
          "Channel_label.key" => "Channel"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Channel_label"
        }
        on_error => "Channel_label_empty"
      }
    }
  }
  if [_raw][Event][System][Keywords] != "" {
    mutate {
      replace => {
        "Keywords_label.value.string_value" => "%{_raw.Event.System.Keywords}"
      }
      on_error => "Keywords_empty"
    }
    if ![Keywords_empty] {
      mutate {
        replace => {
          "Keywords_label.key" => "Keywords"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Keywords_label"
        }
        on_error => "Keywords_label_empty"
      }
    }
  }
  if [_raw][Event][System][Task] != "" {
    mutate {
      replace => {
        "Task_label.value.string_value" => "%{_raw.Event.System.Task}"
      }
      on_error => "Task_empty"
    }
    if ![Task_empty] {
      mutate {
        replace => {
          "Task_label.key" => "Task"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Task_label"
        }
        on_error => "Task_label_empty"
      }
    }
  }
  if [_raw][Event][System][Level] != "" {
    mutate {
      replace => {
        "Level_label.value.string_value" => "%{_raw.Event.System.Level}"
      }
      on_error => "Level_empty"
    }
    if ![Level_empty] {
      mutate {
        replace => {
          "Level_label.key" => "Level"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Level_label"
        }
        on_error => "Level_label_empty"
      }
    }
  }
  if [_raw][Event][System][EventID][_value] != "" {
    mutate {
      replace => {
        "EventID" => "%{_raw.Event.System.EventID._value}"
      }
      on_error => "EventID_empty"
    }
    mutate {
      replace => {
        "_value_label.value.string_value" => "%{_raw.Event.System.EventID._value}"
      }
      on_error => "_value_empty"
    }
    if ![_value_empty] {
      mutate {
        replace => {
          "_value_label.key" => "_value"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "_value_label"
        }
        on_error => "_value_label_empty"
      }
    }
  }
  if [_raw][Event][System][EventID][Qualifiers] != "" {
    mutate {
      replace => {
        "Qualifiers_label.value.string_value" => "%{_raw.Event.System.EventID.Qualifiers}"
      }
      on_error => "Qualifiers_empty"
    }
    if ![Qualifiers_empty] {
      mutate {
        replace => {
          "Qualifiers_label.key" => "Qualifiers"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Qualifiers_label"
        }
        on_error => "Qualifiers_label_empty"
      }
    }
  }
  for Index, data in xml(message,/Event/EventData/Data) {
    mutate {
      convert => {
        "Index" => "string"
      }
      on_error => "index_already_string"
    }
    if [Index] == "1" {
      mutate {
        replace => {
          "Activity ID" => "%{data}"
        }
        on_error => "activity_id_not_found"
      }
    }
    else if [Index] == "2" {
      mutate {
        replace => {
          "request_id_label.key" => "Request ID"
          "request_id_label.value" => "%{data}"
        }
        on_error => "request_id_not_found"
      }
      if ![request_id_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "request_id_label"
          }
          on_error => "request_id_label_not_found"
        }
      }
    }
    else if [Index] == "4" {
      if [data] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "data"
            "event.idm.read_only_udm.principal.asset.ip" => "data"
          }
          on_error => "ip_not_valid"
        }
        if ![ip_not_valid] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    else if [Index] == "5" {
      if [data] not in ["" , "-"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.http.method" => "%{data}"
            "is_http" => "true"
          }
          on_error => "request_method_not_found"
        }
      }
    }
    else if [Index] == "6" {
      mutate {
        replace => {
          "url" => "%{data}"
        }
        on_error => "url_not_found"
      }
    }
    else if [Index] == "7" {
      if [url] != "" {
        mutate {
          replace => {
            "data" => "%{url}%{data}"
          }
          on_error => "data_not_found"
        }
      }
      if [data] not in ["" , "--"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.http.referral_url" => "%{data}"
            "is_http" => "true"
          }
          on_error => "referral_url_not_found"
        }
      }
    }
    else if [Index] == "8" {
      if [data] not in ["" , "-"] {
        mutate {
          convert => {
            "data" => "integer"
          }
          on_error => "is_valid_response_code"
        }
        if ![is_valid_response_code] {
          mutate {
            convert => {
              "data" => "string"
            }
            on_error => "response_code_already_string"
          }
          mutate {
            replace => {
              "event.idm.read_only_udm.network.http.response_code" => "%{data}"
              "is_http" => "true"
            }
            on_error => "user_agent_not_found"
          }
          mutate {
            convert => {
              "event.idm.read_only_udm.network.http.response_code" => "integer"
            }
            on_error => "response_code_already_string"
          }
        }
      }
    }
    else if [Index] == "9" {
      if [data] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "data"
            "event.idm.read_only_udm.target.asset.ip" => "data"
          }
          on_error => "ip_not_found"
