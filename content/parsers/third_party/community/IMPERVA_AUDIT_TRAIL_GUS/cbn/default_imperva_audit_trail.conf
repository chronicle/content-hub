# Product: IMPERVA_AUDIT_TRAIL
# Category: IT infrastructure
# Supported Format: JSON, SYSLOG
# Reference: NA
# Last Updated: 2025-04-03
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "timestamp" => ""
      "msg_data" => ""
      "msg_data_label" => ""
      "event_data" => ""
      "event_data.provider" => ""
      "event_data.dataset" => ""
      "event_data_provider" => ""
      "event_data_provider_label" => ""
      "event_data_dataset" => ""
      "city" => ""
      "country" => ""
      "ip_address" => ""
      "imperva.ids" => ""
      "ids_account_id" => ""
      "ids_account_name" => ""
      "imperva.audit_trail" => ""
      "imperva.audit_trail.event_data_action" => ""
      "imperva.audit_trail.event_data_action_description" => ""
      "audit_trail_event_data_action" => ""
      "audit_trail_resource_type" => ""
      "audit_trail_resource_type_description" => ""
      "description_label" => ""
      "audit_trail_resource_name" => ""
      "resource_name_label" => ""
      "imperva.audit_trail.event_data_context_description" => ""
      "imperva.audit_trail.event_data_context" => ""
      "audit_trail_event_data_context" => ""
      "detection_fields_event_data_context" => ""
      "user_email" => ""
      "user.email" => ""
      "email_address" => ""
      "event_data.action" => ""
      "event_data_action" => ""
      "event_data_action_label" => ""
      "observer.geo" => ""
      "observer.geo.name" => ""
      "geo_name" => ""
      "geo_name_label" => ""
      "bgp" => ""
      "bgp.id" => ""
      "bgp_id" => ""
      "bgp.connection_id" => ""
      "bgp_connection_id" => ""
      "bgp.connection_name" => ""
      "bgp_connection_name" => ""
      "bgp.connection_type" => ""
      "bgp_connection_type" => ""
      "bgp.peer_ip" => ""
      "bgp_peer_ip" => ""
      "principal_mid_present" => ""
      "principal_user_present" => ""
      "nip" => ""
      "message_data" => ""
      "data" => ""
      "json_format" => ""
      "accountId" => ""
      "asn" => ""
      "asn_labels" => ""
      "ipRange" => ""
      "target_ip" => ""
      "securityPolicy" => ""
      "securityPolicy_label" => ""
      "description" => ""
      "parentPolicyEnforcedStatus" => ""
      "parentPolicyEnforcedStatus_label" => ""
      "onDemandStatus" => ""
      "onDemandStatus_label" => ""
      "activationType" => ""
      "activationType_label" => ""
      "userId" => ""
      "enableAclStatus" => ""
      "enableAclStatus_label" => ""
      "templatedStatus" => ""
      "templatedStatus_label" => ""
      "templatedDetectionStatus" => ""
      "templatedDetectionStatus_label" => ""
      "status" => ""
      "status_label" => ""
      "addRangeType" => ""
      "addRangeType_label" => ""
      "int_id" => ""
      "lastModified" => ""
      "lastModifiedBy" => ""
      "rules" => ""
      "id" => ""
      "name" => ""
      "type" => ""
      "type_label" => ""
      "ip_1" => ""
      "ip_2" => ""
      "ip_3" => ""
      "ip_4" => ""
      "ip_5" => ""
      "ip_6" => ""
      "ip_7" => ""
      "ip_8" => ""
      "user_id_present" => ""
      "event_type" => ""
      # udm noun
      "metadata" => ""
      "target" => ""
      "principal" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "intermediary" => ""
      "src" => ""
    }
  }
  mutate {
    gsub => ["message","@timestamp","timestamp"]
  }
  mutate {
    gsub => ["message","message","msg_data"]
  }
  mutate {
    gsub => ["message","event","event_data"]
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP}\\s+%{GREEDYDATA:message}"
      ]
    }
    overwrite => [ "message" ]
    on_error => "grok_failure"
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  mutate {
    convert => {
      "timestamp"  =>  "string"
    }
    on_error => "already_string"
  }
  mutate {
    replace => {
      "add_timestamp.value.string_value" => "%{timestamp}"
      "add_timestamp.key" => "timestamp"
    }
    on_error => "invalid_timestamp"
  }
  mutate {
    merge => {
      "additional.fields" => "add_timestamp"
    }
    on_error => "add_timestamp_merge_failed"
  }
  if [timestamp] != "" {
    date {
      match => [ "timestamp",  "UNIX_MS", "ISO8601" ]
      on_error => "wrong_match"
    }
  }

  if [msg_data] != "" {
    grok {
      match => {
        "msg_data" => [
          "(?P<msg_data>Successfully signed-in) from %{DATA:city}, %{DATA:country} \\(%{IP:ip_address}\\)",
          "(?P<msg_data>Successfully SSO signed-in) from %{DATA:city}, %{DATA:country} \\(%{IP:ip_address}\\)",
          "(?P<msg_data>Successfully SSO signed-in) from %{DATA:country} \\(%{IP:ip_address}\\)",
          "%{DATA:msg_data}:\\s+\\(%{GREEDYDATA:json_format}\\)"
        ]
      }
      overwrite => [ "city", "country", "ip_address", "msg_data", "json_format" ]
      on_error => "grok_failure"
    }
    if [msg_data] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{msg_data}"
        }
        on_error => "msg_data_not_merged"
      }
    }
    if [city] != "" {
      mutate {
        replace => {
          "target.location.city" => "%{city}"
        }
        on_error => "city_not_merged"
      }
    }
    if [country] != "" {
      mutate {
        replace => {
          "target.location.country_or_region" => "%{country}"
        }
        on_error => "country_not_merged"
      }
    }
    if [ip_address] != "" {
      mutate {
        merge => {
          "principal.ip" => "ip_address"
          "principal.asset.ip" => "ip_address"
        }
        on_error => "ip_address_not_merged"
      }
      if ![ip_address_not_merged] {
        mutate {
          replace => {
            "principal_mid_present" => "true"
          }
        }
      }
    }
    if [data] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "data"
        }
        on_error => "data_not_merged"
      }
    }
    mutate {
      gsub => ["json_format",'\\\\\\"',""]
    }
    if [json_format] != "" {
      json {
        source => "json_format"
        array_function => "split_columns"
        on_error => "not_json"
      }
    }
    if [accountId] != "" {
      mutate {
        convert => {
          "accountId" => "string"
        }
        on_error => "accountId_already_string"
      }
      mutate {
        replace => {
          "target.user.product_object_id" => "%{accountId}"
        }
        on_error => "invalid_account_id"
      }
    }
    if [asn] != "" {
      mutate {
        convert => {
          "asn" => "string"
        }
        on_error => "asn_already_string"
      }
      mutate {
        replace => {
          "asn_labels.key" => "asn"
          "asn_labels.value" => "%{asn}"
        }
        on_error => "asn_labels_error"
      }
      if ![asn_labels_error] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "asn_labels"
          }
          on_error => "labels_merge_error"
        }
      }
    }
    if [ipRange] != "" {
      mutate {
        gsub => ["ipRange", '\\\"', ""]
      }
      grok {
        match => {
          "ipRange" => "%{IP:target_ip}"
        }
        overwrite => [ "target_ip" ]
        on_error => "ipRange_failure_grok"
      }
      if [target_ip] != "" {
        mutate {
          merge => {
            "target.ip" => "target_ip"
            "target.asset.ip" => "target_ip"
          }
          on_error => "target_ip_error"
        }
      }
    }
    if [securityPolicy] != "" {
      mutate {
        replace => {
          "securityPolicy_label.key" => "securityPolicy"
          "securityPolicy_label.value" => "%{securityPolicy}"
        }
        on_error => "securityPolicy"
      }
      if ![securityPolicy] {
        mutate {
          merge => {
            "security_result.detection_fields" => "securityPolicy_label"
          }
          on_error => "securityPolicy_merge_error"
        }
      }
    }
    if [description] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
        on_error => "description_not_merged"
      }
    }
    mutate {
      convert => {
        "parentPolicyEnforcedStatus" => "string"
      }
      on_error => "parentPolicyEnforcedStatus_already_string"
    }
    if [parentPolicyEnforcedStatus] != "" {
      mutate {
        replace => {
          "parentPolicyEnforcedStatus_label.key" => "parentPolicyEnforcedStatus"
          "parentPolicyEnforcedStatus_label.value.string_value" => "%{parentPolicyEnforcedStatus}"
        }
        on_error => "parentPolicyEnforcedStatus_invalid"
      }
      if ![parentPolicyEnforcedStatus_invalid] {
        mutate {
          merge => {
            "additional.fields" => "parentPolicyEnforcedStatus_label"
          }
          on_error => "parentPolicyEnforcedStatus_label_merge_failed"
        }
      }
    }
    mutate {
      convert => {
        "onDemandStatus" => "string"
      }
      on_error => "onDemandStatus_already_string"
    }
    if [onDemandStatus] != "" {
      mutate {
        replace => {
          "onDemandStatus_label.key" => "onDemandStatus"
          "onDemandStatus_label.value.string_value" => "%{onDemandStatus}"
        }
        on_error => "onDemandStatus_invalid"
      }
      if ![onDemandStatus_invalid] {
        mutate {
          merge => {
            "additional.fields" => "onDemandStatus_label"
          }
          on_error => "onDemandStatus_label_merge_failed"
        }
      }
    }
    if [activationType] != "" {
      mutate {
        replace => {
          "activationType_label.key" => "activationType"
          "activationType_label.value.string_value" => "%{activationType}"
        }
        on_error => "activationType_invalid"
      }
      if ![activationType_invalid] {
        mutate {
          merge => {
            "additional.fields" => "activationType_label"
          }
          on_error => "activationType_label_merge_failed"
        }
      }
    }
    mutate {
      convert => {
        "enableAclStatus" => "string"
      }
      on_error => "enableAclStatus_already_string"
    }
    if [enableAclStatus] != "" {
      mutate {
        replace => {
          "enableAclStatus_label.key" => "enableAclStatus"
          "enableAclStatus_label.value.string_value" => "%{enableAclStatus}"
        }
        on_error => "enableAclStatus_invalid"
      }
      if ![enableAclStatus_invalid] {
        mutate {
          merge => {
            "additional.fields" => "enableAclStatus_label"
          }
          on_error => "enableAclStatus_label_merge_failed"
        }
      }
    }
    mutate {
      convert => {
        "templatedStatus" => "string"
      }
      on_error => "templatedStatus_already_string"
    }
    if [templatedStatus] != "" {
      mutate {
        replace => {
          "templatedStatus_label.key" => "templatedStatus"
          "templatedStatus_label.value.string_value" => "%{templatedStatus}"
        }
        on_error => "templatedStatus_invalid"
      }
      if ![templatedStatus_invalid] {
        mutate {
          merge => {
            "additional.fields" => "templatedStatus_label"
          }
          on_error => "templatedStatus_label_merge_failed"
        }
      }
    }
    mutate {
      convert => {
        "templatedDetectionStatus" => "string"
      }
      on_error => "templatedDetectionStatus_already_string"
    }
    if [templatedDetectionStatus] != "" {
      mutate {
        replace => {
          "templatedDetectionStatus_label.key" => "templatedDetectionStatus"
          "templatedDetectionStatus_label.value.string_value" => "%{templatedDetectionStatus}"
        }
        on_error => "templatedDetectionStatus_invalid"
      }
      if ![templatedDetectionStatus_invalid] {
        mutate {
          merge => {
            "additional.fields" => "templatedDetectionStatus_label"
          }
          on_error => "templatedDetectionStatus_label_merge_failed"
        }
      }
    }
     # status
    if [status] != "" {
      mutate {
        replace => {
          "status_label.key" => "status"
          "status_label.value.string_value" => "%{status}"
        }
        on_error => "status_invalid"
      }
      if ![status_invalid] {
        mutate {
          merge => {
            "additional.fields" => "status_label"
          }
          on_error => "status_label_merge_failed"
        }
      }
    }
    if [addRangeType] != "" {
      mutate {
        replace => {
          "addRangeType_label.key" => "addRangeType"
          "addRangeType_label.value.string_value" => "%{addRangeType}"
        }
        on_error => "addRangeType_invalid"
      }
      if ![addRangeType_invalid] {
        mutate {
          merge => {
            "additional.fields" => "addRangeType_label"
          }
          on_error => "addRangeType_label_merge_failed"
        }
      }
    }
  }
    mutate {
      gsub => ["json_format",'\\\\\\"',""]
    }
    mutate {
      gsub => ["json_format", '\\\\\\\\"', ""]
    }
    if [id] != "" {
      mutate {
        convert => {
          "id" => "string"
        }
        on_error => "id_already_string"
      }
      mutate {
        replace => {
          "target.user.userid" => "%{id}"
        }
        on_error => "id_not_merged"
      }
      if ![id_not_merged] {
        mutate {
          replace => {
            "user_id_present" => "true"
          }
        }
      }
    }
    if [name] != "" {
      mutate {
        replace => {
          "target.resource.name" => "%{name}"
        }
        on_error => "name_not_merged"
      }
    }
    if [description] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
        on_error => "description_not_merged"
      }
    }
    if [accountId] != "" {
      mutate {
        convert => {
          "accountId" => "string"
        }
        on_error => "accountId_already_string"
      }
      mutate {
        replace => {
          "target.user.product_object_id" => "%{accountId}"
        }
        on_error => "invalid_account_id"
      }
    }
    if [type] != "" {
      mutate {
        replace => {
          "type_label.key" => "type"
          "type_label.value.string_value" => "%{type}"
        }
        on_error => "type_invalid"
      }
      if ![type_invalid] {
        mutate {
          merge => {
            "additional.fields" => "type_label"
          }
          on_error => "type_label_merge_failed"
        }
      }
    }
    if [lastModified] != "" {
      date {
        match => [ "lastModified", "MMM d, yyyy, H:mm:ss A" ]
        on_error => "lastModified_match_failed"
      }
    }
    if [lastModifiedBy] != "" {
      mutate {
        convert => {
          "lastModifiedBy" => "string"
        }
        on_error => "lastModifiedBy_already_string"
      }
      mutate {
        replace => {
          "src.user.userid" => "%{lastModifiedBy}"
        }
        on_error => "invalid_lastModifiedBy"
        }
      }
      if [rules] != "" {
      mutate {
        replace => {
          "rules_array" => "{\"rules_array\":[\"%{rules}\"]}"
        }
        on_error => "rules_array_invalid"
      }
      mutate {
        gsub => ["rules_array", "," , "\", \""]
      }
      mutate {
        gsub => ["rules_array", "\\n", ""]
      }
      json {
        source => "rules_array"
        array_function => "split_columns"
        on_error => "not_json"
      }
    for rule in rules_array {
      if [rule] != "" {
        grok {
          match => {
            "rule" => [
              "%{DATA}%{IP:validated_ip}\\/%{GREEDYDATA}"
            ]
          }
          overwrite => [ "validated_ip" ]
          on_error => "rule_not_ip"
        }
        if ![rule_not_ip] {
          mutate {
            merge => {
              "target.ip" => "validated_ip"
              "target.asset.ip" => "validated_ip"
            }
            on_error => "validated_ip_not_merged"
          }
          if ![validated_ip_not_merged] {
            mutate {
              replace => {
                "ip_present" => "true"
              }
            }
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "event_data_provider" => "%{event_data.provider}"
    }
    on_error =>  "provider_not_present"
  }
  if [event_data_provider] != "" {
    mutate {
      replace => {
        "event_data_provider_label.key" => "event_data_provider"
        "event_data_provider_label.value.string_value" => "%{event_data_provider}"
      }
      on_error => "event_data_provider_invalid"
    }
    if ![event_data_provider_invalid] {
      mutate {
        merge => {
          "additional.fields" => "event_data_provider_label"
        }
        on_error => "event_data_provider_label_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "event_data_dataset" => "%{event_data.dataset}"
    }
    on_error =>  "dataset_not_present"
  }
  if [event_data_dataset] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{event_data_dataset}"
      }
      on_error => "event_data_dataset_not_merged"
    }
  }
  mutate {
    replace => {
      "ids_account_id" => "%{imperva.ids.account_id}"
    }
    on_error =>  "ids_account_id_not_present"
  }
  if [ids_account_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{ids_account_id}"
      }
      on_error => "ids_account_id_not_found"
    }
    if ![ids_account_id_not_found] {
      mutate {
        replace => {
          "principal_user_present" => "true"
          "user_id_present" => "true"
        }
      }
    }
  }
    else if [userId] != "" {
      mutate {
        convert => {
          "userId" => "string"
        }
        on_error => "userId_already_string"
      }
      mutate {
        replace => {
          "principal.user.userid" => "%{userId}"
        }
        on_error => "invalid_userId"
      }
      if ![invalid_userId] {
        mutate {
          replace => {
            "user_id_present" => "true"
          }
        }
      }
    }
  mutate {
    replace => {
      "ids_account_name" => "%{imperva.ids.account_name}"
    }
    on_error =>  "ids_account_name_not_present"
  }
  if [ids_account_name] != "" {
    mutate {
      replace => {
        "principal.user.company_name" => "%{ids_account_name}"
      }
      on_error => "ids_account_name_not_found"
    }
  }
  mutate {
    replace => {
      "audit_trail_event_data_action" => "%{imperva.audit_trail.event_data_action}"
    }
    on_error =>  "action_empty"
  }
  if [audit_trail_event_data_action] != "" {
    mutate {
      replace => {
        "detection_fields_event_data_action.key" =>
        "%{imperva.audit_trail.event_data_action}"
        "detection_fields_event_data_action.value" =>
        "%{imperva.audit_trail.event_data_action_description}"
      }
      on_error => "event_data_action_description_empty"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "detection_fields_event_data_action"
      }
      on_error => "detection_fields_event_data_action_not_merged"
    }
  }
  mutate {
    replace => {
      "audit_trail_resource_type" => "%{imperva.audit_trail.resource_type}"
    }
    on_error =>  "resource_type_empty"
  }
  if [audit_trail_resource_type] != "" {
    mutate {
      replace => {
        "principal.resource.resource_subtype" => "%{audit_trail_resource_type}"
      }
      on_error => "resource_type_invalid"
    }
  }
  mutate {
    replace => {
      "audit_trail_resource_type_description" => "%{imperva.audit_trail.resource_type_description}"
    }
    on_error =>  "resource_type_description_empty"
  }
  if [audit_trail_resource_type_description] != "" {
    mutate {
      replace => {
        "description_label.key" => "audit_trail_resource_type_description"
        "description_label.value.string_value" => "%{audit_trail_resource_type_description}"
      }
      on_error => "resource_type_description_invalid"
    }
    if ![resource_type_description_invalid] {
      mutate {
        merge => {
          "additional.fields" => "description_label"
        }
        on_error => "description_label_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "audit_trail_resource_name" => "%{imperva.audit_trail.resource_name}"
    }
    on_error =>  "resource_name_empty"
  }
  if [audit_trail_resource_name] != "" {
    mutate {
      replace => {
        "principal.resource.name" => "%{audit_trail_resource_name}"
      }
      on_error => "resource_name_invalid"
    }
  }
  mutate {
    replace => {
      "audit_trail_event_data_context" => "%{imperva.audit_trail.event_data_context}"
    }
    on_error =>  "event_data_context_empty"
  }
  if [audit_trail_event_data_context] != "" {
    mutate {
      replace => {
        "detection_fields_event_data_context.key" =>
          "%{imperva.audit_trail.event_data_context}"
        "detection_fields_event_data_context.value" =>
          "%{imperva.audit_trail.event_data_context_description}"
      }
      on_error => "event_data_context_description_empty"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "detection_fields_event_data_context"
      }
      on_error => "detection_fields_event_data_context_not_merged"
    }
  }
  mutate {
    replace => {
      "user_email" => "%{user.email}"
    }
    on_error =>  "user_email_empty"
  }
  if [user_email] != "" {
    grok {
      match => {
        "user_email" => "%{EMAILADDRESS:email_address}"
      }
      overwrite => ["email_address"]
      on_error => "email_address_failure_grok"
    }
    if [email_address] != "" {
      mutate {
        merge => {
          "principal.user.email_addresses" => "email_address"
        }
        on_error => "email_address_error"
      }
      if ![email_address_error] {
        mutate {
          replace => {
            "principal_user_present" => "true"
          }
        }
      }
    }
  }
  mutate {
    replace => {
      "event_data_action" => "%{event_data.action}"
    }
    on_error =>  "event_data_action_empty"
  }
  if [event_data_action] != "" {
    mutate {
      replace => {
        "event_data_action_label.key" => "event_data_action"
        "event_data_action_label.value.string_value" => "%{event_data_action}"
      }
      on_error => "event_data_action_invalid"
    }
    if ![event_data_action_invalid] {
      mutate {
        merge => {
          "additional.fields" => "event_data_action_label"
        }
        on_error => "event_data_action_label_merge_failed"
      }
    }
  }


  mutate {
    replace => {
      "geo_name" => "%{observer.geo.name}"
    }
    on_error =>  "geo_name_empty"
  }
  if [geo_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.cloud.project.name" => "%{geo_name}"
      }
      on_error => "geo_name_is_not_present"
    }
  }
  mutate {
    convert => {
      "bgp.id" => "string"
    }
    on_error => "bgd_id_is_already_string"
  }
  mutate {
    replace => {
      "bgp_id" => "%{bgp.id}"
    }
    on_error =>  "bgp_id_empty"
  }
  if [bgp_id] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{bgp_id}"
      }
      on_error => "bgp_id_is_not_present"
    }
  }
  mutate {
    convert => {
        "bgp.connection_id" => "string"
      }
      on_error => "bgd_connection_is_already_string"
  }
  mutate {
    replace => {
      "bgp_connection_id" => "%{bgp.connection_id}"
    }
    on_error => "bgp_connection_id_empty"
  }
  if [bgp_connection_id] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{bgp_connection_id}"
      }
      on_error => "bgp_connection_id_is_not_present"
    }
  }
  mutate {
    replace => {
      "bgp_connection_name" => "%{bgp.connection_name}"
    }
    on_error => "bgp_connection_name_empty"
  }
  if [bgp_connection_name] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{bgp_connection_name}"
      }
      on_error => "bgp_connection_name_is_not_present"
    }
  }
  mutate {
    replace => {
      "bgp_connection_type" => "%{bgp.connection_type}"
    }
    on_error => "bgp_connection_type_empty"
  }
  if [bgp_connection_type] != "" {
    mutate {
      replace => {
        "target.resource.resource_subtype" => "%{bgp_connection_type}"
      }
      on_error => "bgp_connection_type_is_not_present"
    }
  }
  mutate {
    replace => {
      "bgp_peer_ip" => "%{bgp.peer_ip}"
    }
    on_error => "bgp_peer_ip_type_empty"
  }
  if [bgp_peer_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "bgp_peer_ip"
        "principal.asset.ip" => "bgp_peer_ip"
      }
      on_error => "bgp_peer_ip_is_not_present"
    }
    if ![bgp_peer_ip_is_not_present] {
      mutate {
        replace => {
          "principal_mid_present" => "true"
        }
      }
    }
  }
# udm noun
  mutate {
    replace => {
      "metadata.vendor_name" => "IMPERVA_AUDIT_TRAIL"
      "metadata.product_name" => "Imperva_Audit_Trail"
    }
  }
  if [event_type] == "" {
    if [principal_user_present] == "true" &&  [msg_data] =~ "(Successfully signed-in|Successfully SSO signed-in)" {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
    } else if [principal_mid_present] == "true" {
        mutate {
          replace => {
            "event_type" => "STATUS_UPDATE"
          }
        }
      } else if [user_id_present] == "true" {
          mutate {
            replace => {
              "event_type" => "USER_UNCATEGORIZED"
            }
          }
        } else {
            mutate {
              replace => {
                "event_type" => "GENERIC_EVENT"
              }
            }
          }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_invalid"
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [src] != "" {
    mutate {
      rename => {
        "src" => "event.idm.read_only_udm.src"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_invalid"
    }
  }

  mutate {
    merge => {
     "@output" => "event"
    }
  }
}
