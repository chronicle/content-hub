# Product: THALES_LUNA_HSM
# Category: THALES_LUNA_HSM specific
# Supported Format: JSON/SYSLOG
# Reference: https://thalesdocs.com/gphsm/ptk/5.4/docs/Content/PTK-C_Admin/Audit/audit_overview.htm
# Last Updated: 2025-09-12
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "msg" => ""
      "prin_host" => ""
      "user_id" => ""
      "process_id" => ""
      "group_id" => ""
      "app" => ""
      "full_path" => ""
      "port" => ""
      "ip" => ""
      "service_name" => ""
      "unit" => ""
      "event_type" => ""
      "desc" => ""
      "dhcp_id" => ""
      "sha256" => ""
      "ssh2" => ""
      "shadata" => ""
      "date_time" => ""
      "src_ip" => ""
      "src_port" => ""
    }
  }

  grok {
    match => {
      "message" => ["<%{INT}>%{GREEDYDATA:msg}"]
     }
      overwrite => ["msg"]
      on_error => "msg_grok_error"
   }
   if [msg_grok_error] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
   }
   if [msg] != "" {
     grok {
       match => {
        "msg" => [
          "%{SYSLOGTIMESTAMP:date_time} %{IP:ip}\\s+%{SYSLOGTIMESTAMP:date_time1} %{HOSTNAME:prin_host} %{WORD:word}\\: %{GREEDYDATA:desc}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}:%{GREEDYDATA:desc} %{GREEDYDATA:group_id}\":%{GREEDYDATA:desc}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{WORD:app}:%{GREEDYDATA:desc} %{GREEDYDATA:user_id}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{GREEDYDATA:app}\\(%{GREEDYDATA:full_path}\\)\\[%{INT:process_id}(\\])?(:)? %{GREEDYDATA:desc}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:desc} %{DATA:user_id} %{IP:ip} %{DATA} %{INT:port} %{DATA}\\]",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:desc} %{DATA} %{IP:ip} %{DATA} %{INT:port} %{DATA:shadata}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:desc}; %{GREEDYDATA} rhost=%{IP:ip}  user=%{WORD:user_id}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:dec} %{IP:ip} port %{DATA:port}:%{GREEDYDATA}: %{GREEDYDATA:desc}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:desc} %{IP:ip}/%{INT:port}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:event_type} %{DATA} %{IP:ip} \\(xid=%{GREEDYDATA:dhcp_id}\\)",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA}\\] %{GREEDYDATA:desc}: %{DATA} name%{GREEDYDATA:service_name} unit%{GREEDYDATA:unit}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:desc} %{GREEDYDATA}\\\"%{WORD:user_id}%{GREEDYDATA:shadata}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}]: %{GREEDYDATA:desc}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}\\[%{INT:process_id}(\\])?(:)? %{GREEDYDATA:desc}",
          "%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_host} %{DATA:app}:%{GREEDYDATA:desc}",
          "%{SYSLOGTIMESTAMP:date_time} %{DATA:prin_host} %{DATA:app}(?:\\[%{INT:process_id}\\])?: %{GREEDYDATA:desc}"
        ]
      }
      overwrite => ["msg","date_time", "prin_host", "user_id", "process_id", "group_id", "app", "full_path", "port", "ip", "service_name", "unit", "event_type", "desc", "dhcp_id","shadata"]
      on_error => "msg_grok_error"
    }
  }

  if [prin_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{prin_host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{prin_host}"
      }
      on_error => "prin_host_empty"
    }
  }

  if [desc] != "" {
    grok {
      match => {
        "desc" => [
          "(Accepted|Postponed) publickey for %{NOTSPACE:user_id}",
          "user login : %{NOTSPACE:user_id}.*"
          "session closed for user %{NOTSPACE:user_id}"
          "Command: exit  : %{NOTSPACE:user_id}"
          "NTLS Client \\\"%{NOTSPACE:user_id}\\\" connected and authenticated"
          "Failed password for invalid user %{GREEDYDATA:user_id}"
          "Failed password for %{NOTSPACE:user_id}"
          "Accepted password for %{NOTSPACE:user_id}"
          "Connection from UDP: \\[%{IP:src_ip}\\]:%{NUMBER:src_port}->\\[%{IP:ip}\\]:%{NUMBER:port}"
        ]
      }
      overwrite => ["user_id", "src_ip", "src_port", "port", "ip"]
      on_error => "user_id_grok_error"
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{user_id}"
      }
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
      }
      on_error => "src_ip_empty"
    }
  }
  if [src_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
      on_error => "src_port_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "src_port_empty"
    }
  }

  if [app] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{app}"
      }
    }
  }

  if [full_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{full_path}"
      }
    }
  }

  if [group_id] != "" {
     mutate {
        gsub => [ "group_id", "\"", "" ]
      }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.user.group_identifiers" => "group_id"
      }
    }
  }

  if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{process_id}"
      }
    }
  }

  if [ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "ip"
      }
    }
  }

  if [port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{port}"
      }
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
    }
  }

  if [service_name] != "" {
    mutate {
        gsub => [ "service_name", "='", "" ]
      }
   mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{service_name}"
      }
    }
  }

  if [unit] != "" {
    mutate {
      gsub => [ "unit", "='", "" ]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.group.group_display_name" => "%{unit}"
      }
    }
  }

  if [event_type] == "DHCPACK" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.dhcp.type" => "ACK"
         "event.idm.read_only_udm.network.dhcp.opcode" => "BOOTREPLY"
         "event.idm.read_only_udm.network.application_protocol" => "DHCP"
       }
     }
  }

  if [desc] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{desc}"
      }
    }
  }
  if [desc] =~ "IPv6" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "IP6IN4"
      }
    }
  }
  else if [desc] =~ "UDP" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "UDP"
      }
    }
  }

  if  [msg] =~ "Failed password" or [msg] =~ "password check failed" or [msg] =~ "authentication failure" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [msg] =~ "Disconnected from invalid user" or [msg] =~ "The user disconnected" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [msg] =~ "finished logrotate" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_TERMINATION"
      }
    }
  }
  else if [msg] =~ "not met by user" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  else if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"
      }
    }
  }
  else if [prin_host] != "" {
    if  [ip] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "THALES_LUNA_HSM"
      "event.idm.read_only_udm.metadata.vendor_name" => "CCFOUNDATION"
    }
  }

  date {
    match => ["date_time", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
    rebase => true
    on_error => "date_time_error"
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
