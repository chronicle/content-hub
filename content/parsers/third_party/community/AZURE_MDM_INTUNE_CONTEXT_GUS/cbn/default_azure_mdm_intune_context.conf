# Product: AZURE_MDM_INTUNE_CONTEXT
# Category: Mobile Device Management
# Supported Format: Json
# Reference: https://learn.microsoft.com/en-us/mem/intune/fundamentals/review-logs-using-azure-monitor#use-audit-logs-throughout-intune
# Last Updated: 2024-09-19
# Copyright 2024 Chronicle LLC
filter {
  mutate {
    replace => {
      "category" => ""
      "correlationId" => ""
      "identity" => ""
      "operationName" => ""
      "resultDescription" => ""
      "resultType" => ""
      "tenantId" => ""
      "time" => ""
      "Category_label" => ""
      "PartnerTenantId_label" => ""
      "isDelegatedAdmin_label" => ""
      "ActorType_label" => ""
      "identity_label" => ""
      "ActivityDate_label" => ""
      "ActivityResultStatus_label" => ""
      "properties.ActivityDate" => ""
      "properties.ActivityResultStatus" => ""
      "properties.ActivityType" => ""
      "properties.Actor.ActorType" => ""
      "properties.Actor.Application" => ""
      "properties.Actor.ApplicationName" => ""
      "properties.Actor.isDelegatedAdmin" => ""
      "properties.Actor.PartnerTenantId" => ""
      "properties.Actor.UserPermissions" => ""
      "properties.AuditEventId" => ""
      "properties.Category" => ""
      "has_user" => "false"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "invalid_json_data"
  }
  if [invalid_json_data] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [category] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result.category_details" => "category"
      }
      on_error => "category_merge_failed"
    }
  }
  if [correlationId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{correlationId}"
      }
      on_error => "no_correlationId"
    }
  }
  if [identity] != "" {
    mutate {
      replace => {
        "identity_label.key" => "identity"
        "identity_label.value" => "%{identity}"
      }
      on_error => "no_identity"
    }
    if ![no_identity] {
      mutate {
        merge => {
          "security_result.detection_fields" => "identity_label"
        }
        on_error => "identity_merge_failed"
      }
    }
  }
  if [operationName] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{operationName}"
      }
      on_error => "no_operationName"
    }
  }
  if [resultDescription] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{resultDescription}"
      }
      on_error => "no_resultDescription"
    }
  }
  if [resultType] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{resultType}"
      }
      on_error => "no_resultType"
    }
  }
  if [tenantId] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{tenantId}"
        "has_user" => "true"
      }
      on_error => "no_tenantId"
    }
  }
  if [time] != "" {
    date {
      match => ["time", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "date_parse_failed"
    }
  }
  if [properties][ActivityDate] != "" {
    mutate {
      replace => {
        "ActivityDate_label.key" => "ActivityDate"
        "ActivityDate_label.value" => "%{properties.ActivityDate}"
      }
      on_error => "no_ActivityDate"
    }
    if ![no_ActivityDate] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ActivityDate_label"
        }
        on_error => "ActivityDate_merge_failed"
      }
    }
  }
  if [properties][ActivityResultStatus] != "" {
    mutate {
      convert => {
        "properties.ActivityResultStatus" => "string"
      }
      on_error => "already_converted"
    }
    mutate {
      replace => {
        "ActivityResultStatus_label.key" => "ActivityResultStatus"
        "ActivityResultStatus_label.value" => "%{properties.ActivityResultStatus}"
      }
      on_error => "no_ActivityResultStatus"
    }
    if ![no_ActivityResultStatus] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ActivityResultStatus_label"
        }
        on_error => "ActivityResultStatus_merge_failed"
      }
    }
  }
  if [properties][ActivityType] != "" {
    mutate {
      convert => {
        "properties.ActivityType" => "string"
      }
      on_error => "already_converted"
    }
    mutate {
      replace => {
        "ActivityType_label.key" => "ActivityType"
        "ActivityType_label.value" => "%{properties.ActivityType}"
      }
      on_error => "no_ActivityType"
    }
    if ![no_ActivityType] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ActivityType_label"
        }
        on_error => "ActivityType_merge_failed"
      }
    }
  }
  if [properties][Actor][ActorType] != "" {
    mutate {
      convert => {
        "properties.Actor.ActorType" => "string"
      }
      on_error => "already_converted"
    }
    mutate {
      replace => {
        "ActorType_label.key" => "ActorType"
        "ActorType_label.value" => "%{properties.Actor.ActorType}"
      }
      on_error => "no_ActorType"
    }
    if ![no_ActorType] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ActorType_label"
        }
        on_error => "ActorType_merge_failed"
      }
    }
  }
  if [properties][Actor][Application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{properties.Actor.Application}"
      }
      on_error => "Application_empty"
    }
  }
  if [properties][Actor][ApplicationName] != "" {
    mutate {
      replace => {
        "principal.resource.name" => "%{properties.Actor.ApplicationName}"
      }
      on_error => "ApplicationName_empty"
    }
  }
  if [properties][Actor][isDelegatedAdmin] != "" {
    mutate {
      convert => {
        "properties.Actor.isDelegatedAdmin" => "string"
      }
      on_error => "already_converted"
    }
    mutate {
      replace => {
        "isDelegatedAdmin_label.key" => "isDelegatedAdmin"
        "isDelegatedAdmin_label.value" => "%{properties.Actor.isDelegatedAdmin}"
      }
      on_error => "no_isDelegatedAdmin"
    }
    if ![no_isDelegatedAdmin] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "isDelegatedAdmin_label"
        }
        on_error => "isDelegatedAdmin_merge_failed"
      }
    }
  }
  if [properties][Actor][PartnerTenantId] != "" {
    mutate {
      replace => {
        "PartnerTenantId_label.key" => "PartnerTenantId"
        "PartnerTenantId_label.value" => "%{properties.Actor.PartnerTenantId}"
      }
      merge => {
        "principal.user.attribute.labels" => "PartnerTenantId_label"
      }
      on_error => "PartnerTenantId_merge_failed"
    }
  }
  mutate {
    replace => {
      "UserPermissions_list.value" => ""
    }
  }
  for permission in properties.Actor.UserPermissions {
    mutate {
      replace => {
        "UserPermissions_label" => ""
      }
    }
    mutate {
      replace => {
        "UserPermissions_label.string_value" => "%{permission}"
      }
      on_error => "UserPermissions_label_not_found"
    }
    if [UserPermissions_label][string_value] != "" {
      mutate {
        merge => {
          "UserPermissions_list.value.list_value.values" => "UserPermissions_label"
        }
        on_error => "UserPermissions_label_not_found"
      }
    }
  }
  if [UserPermissions_list][value] != "" {
    mutate {
      replace => {
        "UserPermissions_list.key" => "UserPermissions"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "UserPermissions_list"
      }
      on_error => "UserPermissions_list_not_found"
    }
  }
  mutate {
    replace => {
      "TargetObjectIds_list.value" => ""
    }
  }
  for TargetObjectIds in properties.TargetObjectIds {
    mutate {
      replace => {
        "TargetObjectIds_label" => ""
      }
    }
    mutate {
      replace => {
        "TargetObjectIds_label.string_value" => "%{TargetObjectIds}"
      }
      on_error => "TargetObjectIds_label_not_found"
    }
    mutate {
      merge => {
        "TargetObjectIds_list.value.list_value.values" => "TargetObjectIds_label"
      }
      on_error => "TargetObjectIds_label_not_found"
    }
  }
  if [TargetObjectIds_list][value] != "" {
    mutate {
      replace => {
        "TargetObjectIds_list.key" => "TargetObjectIds"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "TargetObjectIds_list"
      }
      on_error => "TargetObjectIds_list_not_found"
    }
  }
  mutate {
    replace => {
      "TargetDisplayNames_list.value" => ""
    }
  }
  for TargetDisplayNames in properties.TargetDisplayNames {
    mutate {
      replace => {
        "TargetDisplayNames_label" => ""
      }
    }
    mutate {
      replace => {
        "TargetDisplayNames_label.string_value" => "%{TargetDisplayNames}"
      }
      on_error => "TargetDisplayNames_label_not_found"
    }
    if [TargetDisplayNames] not in ["<null>", ""] {
      mutate {
        merge => {
          "TargetDisplayNames_list.value.list_value.values" => "TargetDisplayNames_label"
        }
        on_error => "TargetDisplayNames_label_not_found"
      }
    }
  }
  if [TargetDisplayNames_list][value] != "" {
    mutate {
      replace => {
        "TargetDisplayNames_list.key" => "TargetDisplayNames"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "TargetDisplayNames_list"
      }
      on_error => "TargetDisplayNames_list_not_found"
    }
  }
  if [properties][AuditEventId] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{properties.AuditEventId}"
      }
      on_error => "AuditEventId_empty"
    }
  }
  if [properties][Category] != "" {
    mutate {
      convert => {
        "properties.Category" => "string"
      }
      on_error => "already_converted"
    }
    mutate {
      replace => {
        "Category_label.key" => "Category"
        "Category_label.value" => "%{properties.Category}"
      }
      on_error => "no_Category"
    }
    if ![no_Category] {
      mutate {
        merge => {
          "security_result.detection_fields" => "Category_label"
        }
        on_error => "Category_merge_failed"
      }
    }
  }
  for tar in properties.Targets {
    for mproper in tar.ModifiedProperties {
      mutate {
        replace => {
          "Name_label" => ""
          "New_label" => ""
          "Old_label" => ""
        }
      }
      mutate {
        replace => {
          "Name_label.key" => "Name"
          "Name_label.value" => "%{mproper.Name}"
        }
        on_error => "Name_label_not_found"
      }
      if ![Name_label_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "Name_label"
          }
          on_error => "Name_merge_failed"
        }
      }
      mutate {
        replace => {
          "New_label.key" => "New"
          "New_label.value" => "%{mproper.New}"
        }
        on_error => "New_label_not_found"
      }
      if ![New_label_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "New_label"
          }
          on_error => "New_merge_failed"
        }
      }
      mutate {
        replace => {
          "Old_label.key" => "Old"
          "Old_label.value" => "%{mproper.Old}"
        }
        on_error => "Old_label_not_found"
      }
      if ![Old_label_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "Old_label"
          }
          on_error => "Old_merge_failed"
        }
      }
    }
  }
  if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Microsoft Intune Context"
      "event.idm.read_only_udm.metadata.vendor_name" => "Microsoft"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
