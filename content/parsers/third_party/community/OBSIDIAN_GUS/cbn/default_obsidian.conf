      ]
    }
    mutate {
      gsub => [
        "description_field", ": ", ":"
      ]
    }
    mutate {
      gsub => [
        "description_field", "\\n", "&"
      ]
    }
    grok {
      match => {
        "description_field" => "Target:%{DATA:application}&Target"
      }
      on_error => "grok_fail_app"
      overwrite => ["application"]
    }
    if ![grok_fail_app] {
      mutate {
        replace => {
          "target.application" => "%{application}"
        }
        on_error => "app_fail"
      }
    }
    kv {
      source => "description_field"
      field_split => "&"
      value_split => ":"
      target => "description_kv"
      on_error => "no_description_kv"
    }
  }
