    replace => {
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "network" => ""
      "security_result" => ""
      "extensions" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "user_login" => "false"
      "groupId" => ""
      "orgId" => ""
      "eventdata" => ""
      "content.action" => ""
      "content.requestId" => ""
      "created" => ""
      "content.notSupported.gitignore" => ""
      "content.http_method" => ""
      "content.snyk_request_id" => ""
      "content.url" => ""
      "id" => ""
      "URL" => ""
      "project_id" => ""
      "event" => ""
      "version" => ""
      "limit" => ""
      "project" => ""
      "newIssues" => ""
      "org" => ""
      "group" => ""
      "content_url" => ""
      "org_group_id" => ""
      "org_group_name" => ""
      "org_created" => ""
      "group_id" => ""
      "group_name" => ""
      "group_url" => ""
      "group_created" => ""
      "project_name" => ""
      "project_origin" => ""
      "project_type" => ""
      "project_readOnly" => ""
      "project_isMonitored" => ""
      "project_testFrequency" => ""
      "project_totalDependencies" => ""
      "project_issueCountsBySeverity_low" => ""
      "project_issueCountsBySeverity_medium" => ""
      "project_issueCountsBySeverity_high" => ""
      "project_issueCountsBySeverity_critical" => ""
      "project_imageTag" => ""
      "project_lastTestedDate" => ""
      "project_browseUrl" => ""
      "project_branch" => ""

    }
  }
  mutate {
    gsub => ["message",'\\"event\\":',"\"eventdata\":"]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "no_json"
  }
  if [no_json] {
    drop{
      tag => "TAG_UNSPECIFIED"
    }
  }
  if [groupId] != "" {
    mutate {
      replace => {
        "principal.user.groupid" => "%{groupId}"
      }
      on_error => "no_group_id"
    }
  }
  if [orgId] != "" {
    mutate {
      replace => {
        "orgId_label.key" => "orgId"
        "orgId_label.value" => "%{orgId}"
      }
      on_error => "no_org_id"
    }
    if ![no_org_id] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "orgId_label"
        }
        on_error => "no_orgId_label"
      }
    }
  }
  if [eventdata] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventdata}"
      }
      on_error => "no_event"
    }
  }
  if [content][action] not in ["", "null"] {
    mutate {
      replace => {
        "security_result.action_details" => "%{content.action}"
      }
      on_error => "no_action"
    }
  }
  if [content][requestId] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{content.requestId}"
      }
      on_error => "no_session_id"
    }
  }
  if [created] != "" {
    date {
      match => ["created", "RFC3339" , "TIMESTAMP_ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "no_created_time"
    }
  }
  if [content][notSupported][gitignore] not in ["", "null"] {
    mutate {
      replace => {
        "gitignore_label.key" => "gitignore"
        "gitignore_label.value" => "%{content.notSupported.gitignore}"
      }
      on_error => "no_gitignore"
    }
    if [no_gitignore] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "gitignore_label"
        }
        on_error => "no_gitignore_label"
      }
    }
  }
  if [content][http_method] not in ["", "null"] {
    mutate {
      replace => {
        "network.http.method" => "%{content.http_method}"
      }
      on_error => "no_http_method"
    }
