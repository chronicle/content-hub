    on_error => "no_content_url"
  }
  if [content_url] not in ["", "null"] {
    grok {
      match => {
        content_url =>[
          "%{DATA}project_id=%{DATA:project_id}&version=%{DATA:version}&limit=%{INT:limit}"
        ]
      }
      overwrite => ["project_id", "version", "limit"]
      on_error => "no_grok_url"
    }
    if [project_id] != "" {
      mutate {
        replace => {
          "project_id_label.key" => "project_id"
          "project_id_label.value" => "%{project_id}"
        }
        on_error => "no_project_id"
      }
      if ![no_project_id] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "project_id_label"
          }
          on_error => "no_project_id_label"
        }
      }
    }
    mutate {
      replace => {
        "target.url" => "%{content_url}"
