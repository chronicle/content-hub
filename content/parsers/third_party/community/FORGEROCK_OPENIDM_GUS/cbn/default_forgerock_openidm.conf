# Product: FORGEROCK_OPENIDM
# Category: DATA SECURITY
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2025-02-13
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "network" => ""
      "target" => ""
      "principal" => ""
      "metadata" => ""
      "additional" => ""
      "intermediary" => ""
      "security_result" => ""
      "_id" => ""
      "level" => ""
      "topic" => ""
      "source" => ""
      "userId" => ""
      "result" => ""
      "action" => ""
      "entries" => ""
      "mapping" => ""
      "fluentTag" => ""
      "eventName" => ""
      "timestamp" => ""
      "client.ip" => ""
      "server.ip" => ""
      "situation" => ""
      "client.port" => ""
      "server.port" => ""
      "trackingIds" => ""
      "linkQualifier" => ""
      "transactionId" => ""
      "principalData" => ""
      "targetObjectId" => ""
      "sourceObjectId" => ""
      "security_action" => ""
      "response.status" => ""
      "request.protocol" => ""
      "request.operation" => ""
      "http.request.path" => ""
      "context.queryId" => ""
      "context.roles" => ""
      "status" => ""
      "_eventId" => ""
      "objectId" => ""
      "_normalized.fieldNames" => ""
      "context.ipAddress" => ""
      "context.component" => ""
      "context.moduleId" => ""
      "http.request.secure" => ""
      "http.request.method" => ""
      "response.statusCode" => ""
      "response.elapsedTime" => ""
      "context.authenticationId" => ""
      "context.userRolesProperty" => ""
      "context.authenticationIdProperty" => ""
      "http.request.headers.user_agent" => ""
      "http.request.headers.host.0" => ""
      "http.request.headers.x-forwarded-port" => ""
      "http.request.headers.x-forwarded-for" => ""
      "request.detail.taskName" => ""
      "response_detail_reason" => ""
      "response.elapsedTimeUnits" => ""
      "user_present" => "false"
      "target_present" => "false"
      "principal_present" => "false"
      "network_http_present" => "false"
      "entries_data" => ""
      "process_name" => ""
      "handler" => ""
      "http_message" => ""
      "transaction_id" => ""
      "status_code" => ""
      "kv_data" => ""
      "content_length" => ""
      "content_type" => ""
      "Date" => ""
      "exchange_id" => ""
      "http_version" => ""
      "Host" => ""
      "accept_encoding" => ""
      "request_method" => ""
      "user_agent" => ""
      "Accept" => ""
      "accept_language" => ""
      "origin_hop" => ""
      "cache_control" => ""
      "true_client_ip" => ""
      "x_forwarded_for" => ""
      "Connection" => ""
      "Cookie" => ""
      "Pragma" => ""
      "Via" => ""
      "refferal_url" => ""
      "x_forwarded_ip" => ""
      "not_parsed" => ""
      "X-content_type-Options" => ""
      "kv_data1" => ""
      "kv_data_obj" => ""
      "elapsed_time" => ""
    }
  }

  mutate {
    gsub => ["message","principal","principalData"]
  }

  mutate {
    gsub => ["message","user-agent","user_agent"]
  }

  mutate {
    gsub => ["message","\\r\\n"," "]
  }

  grok {
    match => {
      "message" => "(?P<entries_data>entries.*\\])"
    }
    overwrite => ["entries_data"]
    on_error => "no_entries"
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    mutate {
      replace => {
        "not_parsed" => "true"
      }
    }
  }
  else {
    mutate {
      replace => {
        "not_parsed" => "false"
      }
    }
  }

  if [not_json] and [message] !~ "entries" {
    mutate {
      replace => {
        "message" => "{\"entries\":%{message}}"
      }
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    json {
      source => "entries.0.message"
      array_function => "split_columns"
      on_error => "not_a_json"
    }
    if [not_json] and [not_a_json] and [not_parsed] != "false" {
      mutate {
        replace => {
          "not_parsed" => "true"
        }
      }
    }
    else {
      mutate {
        replace => {
          "not_parsed" => "false"
        }
      }
    }
  }
  else if [entries_data] != "" {
    mutate {
      replace => {
        "entries_data" => '{\"%{entries_data}}'
      }
    }
    json {
      source => "entries_data"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] and [not_parsed] != "false" {
      mutate {
        replace => {
          "not_parsed" => "true"
        }
      }
    }
    else {
      mutate {
        replace => {
          "not_parsed" => "false"
        }
      }
    }
  }
  if [not_parsed] == "true" {
    if [not_json] {
      mutate {
        gsub => ["message","□","^"]
      }
      mutate {
        gsub => ["message","\\[CONTINUED\\]","^"]
      }
      mutate {
        gsub => ["message","\\^+","^"]
      }
      mutate {
        gsub => ["message","Content-Length","content_length"]
      }
      mutate {
        gsub => ["message","Content-Type","content_type"]
      }
      mutate {
        gsub => ["message","Accept-Encoding","accept_encoding"]
      }
      mutate {
        gsub => ["message","User-Agent","user_agent"]
      }
      mutate {
        gsub => ["message","Accept-Language","accept_language"]
      }
      mutate {
        gsub => ["message","Akamai-Origin-Hop","origin_hop"]
      }
      mutate {
        gsub => ["message","Cache-Control","cache_control"]
      }
      mutate {
        gsub => ["message","True-Client-IP","true_client_ip"]
      }
      mutate {
        gsub => ["message","Referer","refferal_url"]
      }
      mutate {
        gsub => ["message","X-Forwarded-For","x_forwarded_for"]
      }
      mutate {
        gsub => ["message","x-forwarded-for","x_forwarded_for"]
      }
      grok {
        match => {
          "message" => "%{DATA}\\|\\s+%{DATA:level}\\s+\\|\\s+%{DATA:process_name}\\s+\\|\\s+%{DATA:handler}\\s+\\|\\s+%{GREEDYDATA:http_message}"
        }
        overwrite => ["level","process_name","handler","http_message"]
        on_error => "no_grok"
      }
      mutate {
        gsub => ["http_message","}$",""]
      }
      if [http_message] != "" {
        grok {
          match => {
            "http_message" => ["\\(response\\)\\s+exchangeId:%{DATA:exchange_id} %{DATA}transactionId:%{DATA:transaction_id} %{DATA}HTTP/%{DATA:http_version} %{INT:status_code}%{DATA}\\^%{GREEDYDATA:kv_data}",
                        "\\(request\\)\\s+exchangeId:%{DATA:exchange_id} transactionId:%{DATA:transaction_id} --->(\\^)?%{WORD:request_method} %{DATA:refferal_url} HTTP/%{DATA:http_version}(\\^| )%{GREEDYDATA:kv_data}",
                        "\\(response\\)\\s+exchangeId:%{DATA:exchange_id} %{DATA}transactionId:%{DATA:transaction_id} %{DATA}HTTP/%{DATA:http_version} %{INT:status_code} %{GREEDYDATA:kv_data1}"
                        "Elapsed time: %{GREEDYDATA:elapsed_time}"
                        ]

          }
          overwrite => ["exchange_id","transaction_id","status_code","kv_data","http_version","request_method","refferal_url","kv_data1","elapsed_time"]
          on_error => "no_grok"
        }
        mutate {
          replace => {
            "not_parsed" => "false"
          }
        }
      }
      if [kv_data] != "" {
        kv {
          source => "kv_data"
          value_split => ": "
          field_split => "^"
          on_error => "no_kv"
        }
      }
      if [kv_data1] != "" {
        mutate {
          gsub => ["kv_data1","(\\S+:)","^$1"]
        }
        kv {
          source => "kv_data1"
          value_split => ": "
          field_split => "^"
          target => "kv_data_obj"
          on_error => "no_kv1"
        }
      }
    }
  }
  if [not_parsed] == "true" {
   drop {
      tag => "TAG_UNSUPPORTED"
    }
  }
  for key,value in kv_data_obj map {
    mutate {
      replace => {
        "additional_label" => ""
      }
    }
    mutate {
      replace => {
        "additional_label.key" => "%{key}"
        "additional_label.value.string_value" => "%{value}"
      }
      on_error => "no_label"
    }
    if ![no_label] and [value] != "" {
      mutate {
        merge => {
          "additional.fields" => "additional_label"
        }
        on_error => "invalid_label_label"
      }
    }
  }

  if [elapsed_time] != "" {
    mutate {
      replace => {
        "additional_elapsed_time.key" => "Elapsed time"
        "additional_elapsed_time.value.string_value" => "%{elapsed_time}"
      }
      on_error => "no_elapsed_time"
    }
    if ![no_elapsed_time] {
      mutate {
        merge => {
          "additional.fields" => "additional_elapsed_time"
        }
        on_error => "invalid_elapsed_time_label"
      }
    }
  }
  if [content_length] != "" {
    mutate {
      convert => {
        "content_length" => "string"
      }
      on_error => "invalid_Content_Length"
    }
    mutate {
      replace => {
        "additional_ContentLength.key" => "Content-Length"
        "additional_ContentLength.value.string_value" => "%{content_length}"
      }
      on_error => "no_Content_Length"
    }
    if ![no_Content_Length] {
      mutate {
        merge => {
          "additional.fields" => "additional_ContentLength"
        }
        on_error => "invalid_Content_Length_label"
      }
    }
  }
  if [refferal_url] != "" {
    mutate {
      replace => {
        "network.http.referral_url" => "%{refferal_url}"
        "network_http_present" => "true"
      }
      on_error => "no_refferal_url"
    }
  }
  if [accept_encoding] != "" {
    mutate {
      replace => {
        "additional_accept_encoding.key" => "Accept-Encoding"
        "additional_accept_encoding.value.string_value" => "%{accept_encoding}"
      }
      on_error => "no_accept_encoding"
    }
    if ![no_accept_encoding] {
      mutate {
        merge => {
          "additional.fields" => "additional_accept_encoding"
        }
        on_error => "invalid_accept_encoding_label"
      }
    }
  }
  if [true_client_ip] != "" {
    grok {
      match => {
        "true_client_ip" => "%{IP:true_client_ip}"
      }
      on_error => "invalid_true_client_ip"
      overwrite => ["true_client_ip"]
    }
    if ![invalid_true_client_ip] {
      mutate {
        merge => {
          "principal.ip" => "true_client_ip"
          "principal.asset.ip" => "true_client_ip"
        }
        on_error => "invalid_true_client_ip_label"
      }
    }
    if ![invalid_true_client_ip_label] {
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
    }
  }
  if [request_method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{request_method}"
        "network_http_present" => "true"
      }
      on_error => "no_request_method"
    }
  }
  if [user_agent] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{user_agent}"
        "network_http_present" => "true"
      }
      on_error => "no_user_agent"
    }
    mutate {
      convert => {
        "user_agent" => "parseduseragent"
      }
      on_error => "invalid_user_agent"
    }
    mutate {
      rename => {
        "user_agent" => "network.http.parsed_user_agent"
      }
    }
  }
  if [Accept] != "" {
    mutate {
      replace => {
        "additional_Accept.key" => "Accept"
        "additional_Accept.value.string_value" => "%{Accept}"
      }
      on_error => "no_Accept"
    }
    if ![no_Accept] {
      mutate {
        merge => {
          "additional.fields" => "additional_Accept"
        }
        on_error => "invalid_Accept_label"
      }
    }
  }
  if [accept_language] != "" {
    mutate {
      replace => {
        "additional_accept_language.key" => "Accept-Language"
        "additional_accept_language.value.string_value" => "%{accept_language}"
      }
      on_error => "no_accept_language"
    }
    if ![no_accept_language] {
      mutate {
        merge => {
          "additional.fields" => "additional_accept_language"
        }
        on_error => "invalid_accept_language_label"
      }
    }
  }
  if [origin_hop] != "" {
    mutate {
      replace => {
        "additional_origin_hop.key" => "Akamai-Origin-Hop"
        "additional_origin_hop.value.string_value" => "%{origin_hop}"
      }
      on_error => "no_origin_hop"
    }
    if ![no_origin_hop] {
      mutate {
        merge => {
          "additional.fields" => "additional_origin_hop"
        }
        on_error => "invalid_origin_hop_label"
      }
    }
  }
  if [cache_control] != "" {
    mutate {
      replace => {
        "additional_cache_control.key" => "Cache-Control"
        "additional_cache_control.value.string_value" => "%{cache_control}"
      }
      on_error => "no_cache_control"
    }
    if ![no_cache_control] {
      mutate {
        merge => {
          "additional.fields" => "additional_cache_control"
        }
        on_error => "invalid_cache_control_label"
      }
    }
  }
  if [Connection] != "" {
    mutate {
      replace => {
        "additional_Connection.key" => "Connection"
        "additional_Connection.value.string_value" => "%{Connection}"
      }
      on_error => "no_Connection"
    }
    if ![no_Connection] {
      mutate {
        merge => {
          "additional.fields" => "additional_Connection"
        }
        on_error => "invalid_Connection_label"
      }
    }
  }
  if [Cookie] != "" {
    mutate {
      replace => {
        "additional_Cookie.key" => "Cookie"
        "additional_Cookie.value.string_value" => "%{Cookie}"
      }
      on_error => "no_Cookie"
    }
    if ![no_Cookie] {
      mutate {
        merge => {
          "additional.fields" => "additional_Cookie"
        }
        on_error => "invalid_Cookie_label"
      }
    }
  }
  if [Pragma] != "" {
    mutate {
      replace => {
        "additional_Pragma.key" => "Pragma"
        "additional_Pragma.value.string_value" => "%{Pragma}"
      }
      on_error => "no_Pragma"
    }
    if ![no_Pragma] {
      mutate {
        merge => {
          "additional.fields" => "additional_Pragma"
        }
        on_error => "invalid_Pragma_label"
      }
    }
  }
  if [Via] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{Via}"
      }
      on_error => "no_Via"
    }
  }
  if [Host] != "" {
    grok {
      match => {
        "Host" => "%{IP:src_ip}:%{INT:src_port}"
      }
      overwrite => ["src_ip","src_port"]
      on_error => "no_ip"
    }
    if [no_ip] {
      mutate {
        replace => {
          "principal.hostname" => "%{Host}"
          "principal.asset.hostname" => "%{Host}"
          "principal_present" => "true"
        }
        on_error => "no_Host"
      }
    }
    else {
      mutate {
        merge => {
          "principal.ip" => "src_ip"
          "principal.asset.ip" => "src_ip"
        }
        on_error => "invalid_ip_label"
      }
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
      mutate {
        replace => {
          "principal.port" => "%{src_port}"
        }
        on_error => "invalid_local_port"
      }

      mutate {
        convert => {
          "principal.port" => "integer"
        }
        on_error => "already_integer"
      }
    }
  }
  if [exchange_id] != "" {
    mutate {
      replace => {
        "additional_exchange_id.key" => "exchange_id"
        "additional_exchange_id.value.string_value" => "%{exchange_id}"
      }
      on_error => "no_exchange_id"
    }
    if ![no_exchange_id] {
      mutate {
        merge => {
          "additional.fields" => "additional_exchange_id"
        }
        on_error => "invalid_exchange_id_label"
      }
    }
  }
  if [transaction_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{transaction_id}"
      }
      on_error => "no_transaction_id"
    }
  }
  if [X-content_type-Options] != "" {
    mutate {
      gsub => ["X-content_type-Options","}",""]
    }
    mutate {
      replace => {
        "additional_X-content_type-Options.key" => "X-Content-Type-Options"
        "additional_X-content_type-Options.value.string_value" => "%{X-content_type-Options}"
      }
      on_error => "no_X-content_type-Options"
    }
    if ![no_X-content_type-Options] {
      mutate {
        merge => {
          "additional.fields" => "additional_X-content_type-Options"
        }
        on_error => "invalid_X-content_type-Options_label"
      }
    }
  }
  if [content_type] != "" {
    mutate {
      replace => {
        "additional_contentType.key" => "Content-Type"
        "additional_contentType.value.string_value" => "%{content_type}"
      }
      on_error => "no_content_type"
    }
    if ![no_content_type] {
      mutate {
        merge => {
          "additional.fields" => "additional_contentType"
        }
        on_error => "invalid_content_type_label"
      }
    }
  }
  if [http_version] != "" {
    mutate {
      replace => {
        "network.application_protocol_version" => "%{http_version}"
      }
      on_error => "no_http_version"
    }
  }
  if [status_code] != "" {
    mutate {
      convert => {
        "status_code" => "integer"
      }
      on_error => "status_code_conversion_error"
    }
    if ![status_code_conversion_error] {
      mutate {
        rename => {
          "status_code" => "network.http.response_code"
        }
        on_error => "status_code_not_found"
      }
    }
  }
  if [process_name] != "" {
    mutate {
      replace => {
        "additional_process_name.key" => "process_name"
        "additional_process_name.value.string_value" => "%{process_name}"
      }
      on_error => "no_process_name"
    }
    if ![no_process_name] {
      mutate {
        merge => {
          "additional.fields" => "additional_process_name"
        }
        on_error => "invalid_process_name_label"
      }
    }
  }
  if [handler] != "" {
    mutate {
      replace => {
        "additional_handler.key" => "handler"
        "additional_handler.value.string_value" => "%{handler}"
      }
      on_error => "no_handler"
    }
    if ![no_handler] {
      mutate {
        merge => {
          "additional.fields" => "additional_handler"
        }
        on_error => "invalid_handler_label"
      }
    }
  }
  if [x_forwarded_for] != "" {
    mutate {
      replace => {
        "x_forwarded_for" => '{\"x_forwarded_for\":["%{x_forwarded_for}"]}'
      }
      on_error => "no_x_forwarded_for"
    }
    json {
      source => "x_forwarded_for"
      array_function => "split_columns"
      on_error => "invalid_x_forwarded_for"
    }
    for index, x_forwarded_ip in x_forwarded_for {
      grok {
        match => {
          "x_forwarded_ip" => "%{IP:x_forwarded_ip}"
        }
        overwrite => ["x_forwarded_ip"]
        on_error => "invalid_x_forwarded_ip"
      }
      if ![invalid_x_forwarded_ip] {
        mutate {
          merge => {
            "target.ip" => "x_forwarded_ip"
            "target.asset.ip" => "x_forwarded_ip"
          }
          on_error => "invalid_x_forwarded_ip_label"
        }
      }
      mutate {
        replace => {
          "target_present" => "true"
        }
      }
    }
  }
  if [_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{_id}"
      }
      on_error => "invalid_id"
    }
  } else if [trackingIds] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{trackingIds.0}"
      }
      on_error => "no_trackingIds"
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp","ISO8601"]
      on_error => "date_pattern_not_matched"
      target => "metadata.event_timestamp"
    }
  }

  if [eventName] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventName}"
      }
      on_error => "invalid_eventname"
    }
  }

  if [userId] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{userId}"
      }
      on_error => "invalid_userid"
    }
    if not [invalid_userid] {
      mutate {
        replace => {
          "user_present" => "true"
        }
      }
    }
  } else if [principalData] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{principalData.0}"
      }
      on_error => "invalid_principalData"
    }
    if not [invalid_principalData] {
      mutate {
        replace => {
          "user_present" => "true"
        }
      }
    }
  }

  if [client][ip] != "" {
    mutate {
      gsub => ["client.ip","\\:","."]
    }
    mutate {
      replace => {
        "client_ip" => "%{client.ip}"
      }
      on_error => "invlaid_clientip"
    }
    mutate {
      convert => {
        "client.ip" => "ipaddress"
      }
      on_error => "not_ip"
    }
    if not [not_ip] {
      mutate {
        merge => {
          "principal.ip" => "client_ip"
          "principal.asset.ip" => "client_ip"
        }
        on_error => "invalid_client_ip"
      }
      if not [invalid_client_ip] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
    }
  }

  if [context][ipAddress] != "" {
    mutate {
      replace => {
        "context_ip" => "%{context.ipAddress}"
      }
      on_error => "invalid_context_ip"
    }
    mutate {
      convert => {
        "context.ipAddress" => "ipaddress"
      }
      on_error => "not_ip"
    }
    if not [not_ip] {
      mutate {
        merge => {
          "principal.ip" => "context_ip"
          "principal.asset.ip" => "context_ip"
        }
        on_error => "invalid_ipAddress"
      }
      if not [invalid_ipAddress] {
        mutate {
          replace => {
