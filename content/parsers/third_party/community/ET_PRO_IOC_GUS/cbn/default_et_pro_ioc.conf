# Product: ET_PRO
# Category: IOC
# Supported Format: CSV
# Reference: https://www.proofpoint.com/us/threat-insight/et-pro-ruleset
# Last Updated: 2022-11-28
# Copyright 2022 Chronicle LLC


filter {

  # Dropping csv headers
  if [message] =~ "domain, category, score, first_seen, last_seen, ports (|)" or [message] =~ "ip, category, score, first_seen, last_seen, ports (|)" {
    drop { tag => "TAG_UNSPECIFIED" }
  }
  csv {
    source => "message"
  }

  mutate {
    copy => {
      "@timestamp" => "@collectionTimestamp"
    }
  }

  mutate {
    rename => {
      "column1" => "ip_or_domain"
      "column2" => "category"
      "column3" => "score"
      "column4" => "first_seen"
      "column5" => "last_seen"
      "column6" => "ports"
    }
  }
  mutate {
    replace => {
      "host" => ""
      "categorization" => ""
    }
  }

  grok {
    match => {
      "ip_or_domain" => ["%{IP:ip}%{GREEDYDATA:host}"
                        "%{IP:ip}"
                         ]
    }
    on_error => "no_ip"
  }

  if ![no_ip] and [host] == "" {
    mutate {
      replace => {
        "event.ioc.ip_and_ports.ip_address" => "%{ip_or_domain}"
      }
    }
    mutate {
      convert => {
        "event.ioc.ip_and_ports.ip_address" => "ipaddress"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.ioc.domain_and_ports.domain" => "%{ip_or_domain}"
      }
    }
  }

  # Categorization Mapping
  # "1":  "Malware Command and Control Server",
  # "2":  "Known Infected Bot",
  # "3":  "Known Spam Source",
  # "4":  "Drop site for logs or stolen credentials",
  # "5":  "Spyware Reporting Server",
  # "6":  "Questionable Gaming Site",
  # "7":  "Driveby Source",
  # "9":  "POLICY Chat Server",
  # "10": "POLICY Tor Node",
  # "13": "Known compromised or Hostile",
  # "15": "P2P Node",
  # "16": "Proxy Host",
  # "17": "IP Check Services",
  # "19": "Known Good Public Utility",
  # "20": "Target of a DDoS",
  # "21": "Host Performing Scanning",
  # "23": "SSH or other brute forcer",
  # "24": "Fake AV and AS Products",
  # "25": "Domain or IP Related to a Dynamic DNS Entry or Request",
  # "26": "Undesirable but not illegal",
  # "27": "Abused or free TLD Related",
  # "28": "Self Signed SSL or other suspicious encryption",
  # "29": "Blackhole or Sinkhole systems",
  # "30": "GoToMyPC and similar remote access services",
  # "31": "Distributed CnC Nodes",
  # "33": "Domain or SEO Parked",
  # "34": "VPN Server",
  # "35": "Observed serving executables",
  # "37": "Known CnC for Mobile specific Family",
  # "38": "Spyware CnC specific to mobile devices",
  # "39": "Observed Skype Bootstrap or Supernode",
  # "40": "Bitcoin Mining and related",
  # "41": "DDoS Source"

  if [category] == "1" {
    mutate {
      replace => {
        "categorization" => "Malware Command and Control Server"
      }
    }
  }
  else if [category] == "2" {
    mutate {
      replace => {
        "categorization" => "Known Infected Bot"
      }
    }
  }
  else if [category] == "3" {
    mutate {
      replace => {
        "categorization" => "Known Spam Source"
      }
    }
  }
  else if [category] == "4" {
    mutate {
      replace => {
        "categorization" => "Drop site for logs or stolen credentials"
      }
    }
  }
  else if [category] == "5" {
    mutate {
      replace => {
        "categorization" => "Spyware Reporting Server"
      }
    }
  }
  else if [category] == "6" {
    mutate {
      replace => {
        "categorization" => "Questionable Gaming Site"
      }
    }
  }
  else if [category] == "7" {
    mutate {
      replace => {
        "categorization" => "Driveby Source"
      }
    }
  }
  else if [category] == "9" {
    mutate {
      replace => {
        "categorization" => "POLICY Chat Server"
      }
    }
  }
  else if [category] == "10" {
    mutate {
      replace => {
        "categorization" => "POLICY Tor Node"
      }
    }
  }
  else if [category] == "13" {
    mutate {
      replace => {
        "categorization" => "Known compromised or Hostile"
      }
    }
  }
  else if [category] == "15" {
    mutate {
      replace => {
        "categorization" => "P2P Node"
      }
    }
  }
  else if [category] == "16" {
    mutate {
      replace => {
        "categorization" => "Proxy Host"
      }
    }
  }
  else if [category] == "17" {
    mutate {
      replace => {
        "categorization" => "IP Check Services"
      }
    }
  }
  else if [category] == "19" {
    mutate {
      replace => {
        "categorization" => "Known Good Public Utility"
      }
    }
  }
  else if [category] == "20" {
    mutate {
      replace => {
        "categorization" => "Target of a DDoS"
      }
    }
  }
  else if [category] == "21" {
    mutate {
      replace => {
        "categorization" => "Host Performing Scanning"
      }
    }
  }
  else if [category] == "23" {
    mutate {
      replace => {
        "categorization" => "SSH or other brute forcer"
      }
    }
  }
  else if [category] == "24" {
    mutate {
      replace => {
        "categorization" => "Fake AV and AS Products"
      }
    }
  }
  else if [category] == "25" {
    mutate {
      replace => {
        "categorization" => "Domain or IP Related to a Dynamic DNS Entry or Request"
      }
    }
  }
  else if [category] == "26" {
    mutate {
      replace => {
        "categorization" => "Undesirable but not illegal"
      }
    }
  }
  else if [category] == "27" {
    mutate {
      replace => {
        "categorization" => "Abused or free TLD Related"
      }
    }
  }
  else if [category] == "28" {
    mutate {
      replace => {
        "categorization" => "Self Signed SSL or other suspicious encryption"
      }
    }
  }
  else if [category] == "29" {
    mutate {
      replace => {
        "categorization" => "Blackhole or Sinkhole systems"
      }
    }
  }
  else if [category] == "30" {
    mutate {
      replace => {
        "categorization" => "GoToMyPC and similar remote access services"
      }
    }
  }
  else if [category] == "31" {
    mutate {
      replace => {
        "categorization" => "Distributed CnC Nodes"
      }
    }
  }
  else if [category] == "33" {
    mutate {
      replace => {
        "categorization" => "Domain or SEO Parked"
      }
    }
  }
  else if [category] == "34" {
    mutate {
      replace => {
        "categorization" => "VPN Server"
      }
    }
  }
  else if [category] == "35" {
    mutate {
      replace => {
        "categorization" => "Observed serving executables"
      }
    }
  }
  else if [category] == "37" {
    mutate {
      replace => {
        "categorization" => "Known CnC for Mobile specific Family"
      }
    }
  }
  else if [category] == "38" {
    mutate {
      replace => {
        "categorization" => "Spyware CnC specific to mobile devices"
      }
    }
  }
  else if [category] == "39" {
    mutate {
      replace => {
        "categorization" => "Observed Skype Bootstrap or Supernode"
      }
    }
  }
  else if [category] == "40" {
    mutate {
      replace => {
        "categorization" => "Bitcoin Mining and related"
      }
    }
  }
  else if [category] == "41" {
    mutate {
      replace => {
        "categorization" => "DDoS Source"
      }
    }
  }

  if [categorization] != "" {
    mutate {
      replace => {
        "event.ioc.categorization" => "%{categorization}"
      }
    }
  }

  if [score] != "" {
    mutate {
      replace => {
        "event.ioc.confidence_score" => "%{score}"
      }
    }
  }

  mutate {
    replace => {
      "event.ioc.raw_severity" => "Malicious"
    }
  }

  date {
    match => ["first_seen","yyyy-MM-dd"]
    target => "event.ioc.active_timerange.start"
  }

  date {
    match => ["last_seen","yyyy-MM-dd"]
    target => "event.ioc.active_timerange.end"
  }

  mutate {
    gsub => ["ports", " ", "\",\""]
  }
  mutate {
    replace => {
      "ports" => "{\"ports\":[\"%{ports}\"]}"
    }
  }

  json {
    source => "ports"
    array_function => "split_columns"
  }

  for port in ports {
    if [port] != "" {
      mutate {
        convert => {
          "port" => "uinteger"
        }
      }
      if ![no_ip] and [host] == ""{
        mutate {
          merge => {
            "event.ioc.ip_and_ports.ports" => "port"
          }
        }
      }
      else {
        mutate {
          merge => {
            "event.ioc.domain_and_ports.ports" => "port"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "event.ioc.feed_name" => "ET Intelligence Rep List"
    }
  }

  # End of IOC Mapping

  # Start of UDM mapping
  mutate {
    replace => {
      "event.idm.entity.metadata.vendor_name" => "ET_PRO_IOC"
    }
  }

  mutate {
    replace => {
      "port_data" => ""
    }
  }
  for index,port in ports {
    if [port] != "" {
      if index == 0 {
        mutate {
          replace => {
            "event.idm.entity.entity.port" => "%{port}"
          }
          convert => {
            "event.idm.entity.entity.port" => "integer"
          }
        }
        mutate {
          replace => {
          "port_data" => "%{port}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "port_data" => "%{port_data},%{port}"
          }
        }
      }
    }
  }

  # Adding ports into a label, as entity.port accepts only one value
  if [port_data] != "" and [port_data] =~ "," {
    mutate {
      replace => {
        "port_label.key" => "ports"
        "port_label.value" => "%{port_data}"
      }
    }
    mutate {
      merge => {
        "event.idm.entity.entity.labels" => "port_label"
      }
    }
  }

  if ![no_ip] and [host] == "" {
    mutate {
      replace => {
        "event.idm.entity.metadata.entity_type" => "IP_ADDRESS"
      }
    }
    mutate {
      merge => {
        "event.idm.entity.entity.ip" => "ip_or_domain"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.entity.metadata.entity_type" => "DOMAIN_NAME"
        "event.idm.entity.entity.hostname" => "%{ip_or_domain}"
      }
    }
  }

  mutate {
    replace => {
      "threat_det.threat_name" => "ET Intelligence Rep List"
      "threat_cat" => "SOFTWARE_MALICIOUS"
    }
  }
  mutate {
    merge => {
      "threat_det.category_details" => "categorization"
      "threat_det.category" => "threat_cat"
    }
  }

  mutate {
    merge => {
      "event.idm.entity.metadata.threat" => "threat_det"
    }
  }

  date {
    match => ["first_seen","yyyy-MM-dd"]
    target => "event.idm.entity.metadata.interval.start_time"
  }
  date {
    match => ["last_seen","yyyy-MM-dd"]
    target => "event.idm.entity.metadata.interval.end_time"
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
