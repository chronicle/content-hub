# Product: Azure VNET Flow
# Category: Netflow log type
# Supported Format: JSON
# Reference: NA
# Last Updated: 2025-07-18
# Copyright 2025 Google SecOps

filter {
  if [message] !~ "records" {
    mutate {
      replace => {
        "message" => "{\"records\":\[%{message}\]}"
      }
      on_error => "message_not_found"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [records] != "" {
    for Index, record in records {
      for flowrecordflow in record.flowRecords.flows {
        for flowgroup in flowrecordflow.flowGroups {
          for flowtuple in flowgroup.flowTuples {
            mutate {
              convert => {
                "Index" => "string"
              }
              on_error => "Index_not_found"
            }
            mutate {
              remove_field => [ "event", "intermediary", "security_result" ]
            }
            mutate {
              replace => {
                "record_category" => ""
                "record_time" => ""
                "record_flowLogGUID" => ""
                "record_flowLogResourceID" => ""
                "record_flowLogVersion" => ""
                "record_macAddress" => ""
                "record_operationName" => ""
                "rule_label" => ""
                "aclID_label" => ""
                "src_ip" => ""
                "dst_ip" => ""
                "src_port" => ""
                "dst_port" => ""
                "network_protocol" => ""
                "network_direction" => ""
                "flow_state" => ""
                "Connection_Unencrypted" => ""
                "sentpackets" => ""
                "sentbytes" => ""
                "receivedpackets" => ""
                "receivedbytes" => ""
                "flow_state_field" => ""
                "security_result_action" => ""
                "Connection_Unencrypted_field" => ""
                "flow_log_name" => ""
                "has_principal" => "false"
                "has_target" => "false"
              }
            }
            csv {
                source => "flowtuple"
                separator => ","
                target => "flow_tuple"
                on_error => "csv_parsing_failed"
            }
            mutate {
              replace => {
                "timestamp" => "%{flow_tuple.column1}"
              }
              on_error => "timestamp_replace_error"
            }
            mutate {
              replace => {
                "src_ip" => "%{flow_tuple.column2}"
              }
              on_error => "src_ip_replace_error"
            }
            mutate {
              replace => {
                "dst_ip" => "%{flow_tuple.column3}"
              }
              on_error => "dst_ip_replace_error"
            }
            mutate {
              replace => {
                "src_port" => "%{flow_tuple.column4}"
              }
              on_error => "src_port_replace_error"
            }
            mutate {
              replace => {
                "dst_port" => "%{flow_tuple.column5}"
              }
              on_error => "dst_port_replace_error"
            }
            mutate {
              replace => {
                "network_protocol" => "%{flow_tuple.column6}"
              }
              on_error => "network_protocol_replace_error"
            }
            mutate {
              replace => {
                "network_direction" => "%{flow_tuple.column7}"
              }
              on_error => "network_direction_replace_error"
            }
            mutate {
              replace => {
                "flow_state" => "%{flow_tuple.column8}"
              }
              on_error => "flow_state_replace_error"
            }
            mutate {
              replace => {
                "Connection_Unencrypted" => "%{flow_tuple.column9}"
              }
              on_error => "Connection_Unencrypted_replace_error"
            }
            mutate {
              replace => {
                "sentpackets" => "%{flow_tuple.column10}"
              }
              on_error => "sentpackets_replace_error"
            }
            mutate {
              replace => {
                "sentbytes" => "%{flow_tuple.column11}"
              }
              on_error => "sentbytes_replace_error"
            }
            mutate {
              replace => {
                "receivedpackets" => "%{flow_tuple.column12}"
              }
              on_error => "receivedpackets_replace_error"
            }
            mutate {
              replace => {
                "receivedbytes" => "%{flow_tuple.column13}"
              }
              on_error => "receivedbytes_replace_error"
            }
            if [receivedbytes] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.received_bytes" => "%{receivedbytes}"
                }
                on_error => "receivedbytes_empty"
              }
              mutate {
                convert => {
                  "event.idm.read_only_udm.network.received_bytes" => "uinteger"
                }
                on_error => "receivedbytes_conversion_failure"
              }
            }

            if [receivedpackets] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.received_packets" => "%{receivedpackets}"
                }
                on_error => "receivedpackets_empty"
              }
              mutate {
                convert => {
                  "event.idm.read_only_udm.network.received_packets" => "integer"
                }
                on_error => "receivedpackets_already_uinteger"
              }
            }

            if [sentbytes] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.sent_bytes" => "%{sentbytes}"
                }
                on_error => "sentbytes_empty"
              }
              mutate {
                convert => {
                  "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
                }
                on_error => "sentbytes_already_uinteger"
              }
            }
            if [sentpackets] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.sent_packets" => "%{sentpackets}"
                }
                on_error => "sentpackets_empty"
              }
              mutate {
                convert => {
                  "event.idm.read_only_udm.network.sent_packets" => "integer"
                }
                on_error => "sentpackets_already_uinteger"
              }
            }
            if [network_protocol] == "6" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.ip_protocol" => "TCP"
                }
              }
            }
            else if [network_protocol] == "17" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.ip_protocol" => "UDP"
                }
              }
            }
            if [network_direction] == "I" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.direction" => "INBOUND"
                }
              }
            }
            else if [network_direction] == "O" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.direction" => "OUTBOUND"
                }
              }
            }
            if [src_ip] != "" {
              mutate {
                merge => {
                  "event.idm.read_only_udm.principal.ip" => "src_ip"
                  "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
                }
                on_error => "src_ip_not_found"
              }
              if ![src_ip_not_found] {
                mutate {
                  replace => {
                    "has_principal" => "true"
                  }
                }
              }
            }

            if [src_port] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.principal.port" => "%{src_port}"
                }
                on_error => "src_port_empty"
              }
              mutate {
                convert => {
                  "event.idm.read_only_udm.principal.port" => "integer"
                }
                on_error => "src_port_conversion_error"
              }
            }

            if [dst_ip] != "" {
              mutate {
                merge => {
                  "event.idm.read_only_udm.target.ip" => "dst_ip"
                  "event.idm.read_only_udm.target.asset.ip" => "dst_ip"
                }
                on_error => "dst_ip_not_found"
              }
              if ![dst_ip_not_found] {
                mutate {
                  replace => {
                    "has_target" => "true"
                  }
                }
              }
            }

            if [dst_port] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.port" => "%{dst_port}"
                }
                on_error => "dst_port_empty"
              }
              mutate {
                convert => {
                  "event.idm.read_only_udm.target.port" => "integer"
                }
                on_error => "dst_port_convert_error"
              }
            }
            if [flow_state] == "B" {
              mutate {
                replace => {
                  "flow_state" => "Begin"
                }
              }
            }
            else if [flow_state] == "C" {
              mutate {
                replace => {
                  "flow_state" => "Continue"
                }
              }
            }
            else if [flow_state] == "E" {
              mutate {
                replace => {
                  "flow_state" => "End"
                }
              }
            }
            else if [flow_state] == "D" {
              mutate {
                replace => {
                  "flow_state" => "Deny"
                }
              }
            }
            if [flow_state] != "" {
              mutate {
                replace => {
                  "flow_state_field.value.string_value" => "%{flow_state}"
                }
                on_error => "flow_state_empty"
              }
              if ![flow_state_empty] and [flow_state_field][value][string_value] != "" {
                mutate {
                  replace => {
                    "flow_state_field.key" => "flow_state"
                  }
                }
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "flow_state_field"
                  }
                  on_error => "flow_state_field_empty"
                }
              }
            }
            if [flow_state] == "Deny" {
              mutate {
                replace => {
                  "security_result_action" => "BLOCK"
                }
              }
            }
            else if [flow_state] == "Continue" {
              mutate {
                replace => {
                  "security_result_action" => "ALLOW"
                }
              }
            }
            if [security_result_action] != "" {
              mutate {
                merge => {
                  "security_result.action" => "security_result_action"
                }
                on_error => "security_result_action_not_found"
              }
            }
            if [Connection_Unencrypted] == "X" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "encrypted"
                }
              }
            }
            else if [Connection_Unencrypted] == "NX" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "unencrypted"
                }
              }
            }
            else if [Connection_Unencrypted] == "NX_HW_NOT_SUPPORTED" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "Hardware is unsupported"
                }
              }
            }
            else if [Connection_Unencrypted] == "NX_SW_NOT_READY" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "Software isn't ready"
                }
              }
            }
            else if [Connection_Unencrypted] == "NX_NOT_ACCEPTED" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "Drop due to no encryption"
                }
              }
            }
            else if [Connection_Unencrypted] == "NX_NOT_SUPPORTED" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "Discovery is unsupported"
                }
              }
            }
            else if [Connection_Unencrypted] == "NX_LOCAL_DST" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "Destination is on the same host"
                }
              }
            }
            else if [Connection_Unencrypted] == "NX_FALLBACK" {
              mutate {
                replace => {
                  "Connection_Unencrypted" => "Fall back to no encryption"
                }
              }
            }

            if [Connection_Unencrypted] != "" {
              mutate {
                replace => {
                  "Connection_Unencrypted_field.value.string_value" => "%{Connection_Unencrypted}"
                }
                on_error => "Connection_Unencrypted_empty"
              }
              if ![Connection_Unencrypted_empty] {
                mutate {
                  replace => {
                    "Connection_Unencrypted_field.key" => "Connection_Unencrypted"
                  }
                }
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "Connection_Unencrypted_field"
                    }
                  on_error => "Connection_Unencrypted_field_empty"
                }
              }
            }
            if [timestamp] != "" {
              mutate {
                gsub => ["timestamp","(\\d{10})\\d+" ,"$1" ]
              }
              date {
                match => ["timestamp", "UNIX"]
                target => "event.idm.read_only_udm.metadata.event_timestamp"
                on_error => "record_time_not_found"
              }
            }
            mutate {
              convert => {
                "flowrecordflow.aclID" => "string"
              }
              on_error => "aclID_not_found"
            }
            mutate {
              replace => {
                "aclID_label.value" => "%{flowrecordflow.aclID}"
              }
              on_error => "aclID_not_found"
            }
            if ![aclID_not_found] {
              mutate {
                replace => {
                  "aclID_label.key" => "aclID"
                }
              }
              mutate {
                merge => {
                  "security_result.detection_fields" => "aclID_label"
                }
                on_error => "aclID_label_merge_fail"
              }
            }
            mutate {
              convert => {
                "flowgroup.rule" => "string"
              }
              on_error => "rule_not_found"
            }
            mutate {
              replace => {
                "rule_label.value" => "%{flowgroup.rule}"
              }
              on_error => "rule_not_found"
            }
            if ![rule_not_found] {
              mutate {
                replace => {
                  "rule_label.key" => "rule"
                }
              }
              mutate {
                merge => {
                  "security_result.detection_fields" => "rule_label"
                }
                on_error => "rule_label_merge_fail"
              }
            }
            mutate {
              convert => {
                "record.flowLogGUID" => "string"
              }
              on_error => "flow_log_guid_not_found"
            }
            mutate {
              replace => {
                "record_flowLogGUID" => "%{record.flowLogGUID}"
              }
              on_error => "flow_log_guid_not_found"
            }
            if [record_flowLogGUID] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.metadata.product_log_id" => "%{record_flowLogGUID}"
                }
                on_error => "flow_log_guid_not_found"
              }
            }
            mutate {
              replace => {
                "record_flowLogResourceID" => "%{record.flowLogResourceID}"
              }
              on_error => "record_flowLogResourceID_not_found"
            }
            if [record_flowLogResourceID] != "" {
              mutate {
                replace => {
                  "security_result.about.resource.name" => "%{record_flowLogResourceID}"
                }
                on_error => "record_flowLogResourceID_not_found"
              }
            }
            grok {
              match => {
                "record_flowLogResourceID" => [
                  "/%{GREEDYDATA:subscription}/%{GREEDYDATA:subscriptionid}/RESOURCEGROUPS/%{GREEDYDATA:rscgrp}/PROVIDERS/%{GREEDYDATA:appname}/NETWORKWATCHERS/%{GREEDYDATA:network_watcher_name}/FLOWLOGS/%{GREEDYDATA:flow_log_name}"
                ]
              }
              overwrite => ["subscription", "subscriptionid", "rscgrp", "appname", "network_watcher_name", "flow_log_name"]
              on_error => "record_flowLogResourceID_grok_failure"
            }
            if [flow_log_name] != "" {
              mutate {
                replace => {
                  "intermediary.hostname" => "%{flow_log_name}"
                }
                on_error => "flow_log_name_not_found"
              }
            }
            if [intermediary] != "" {
              mutate {
                merge => {
                  "event.idm.read_only_udm.intermediary" => "intermediary"
                }
                on_error => "intermediary_not_found"
              }
            }
            if ![record_flowLogResourceID_grok_failure] {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.application" => "%{appname}"
                  "NETWORKWATCHERS_name_label" => "{\"key\":\"NETWORK WATCHERS\", \"value\":\"%{network_watcher_name}\"}"
                  "subscriptionid_label" => "{\"key\":\"Subscription Id\", \"value\":\"%{subscriptionid}\"}"
                  "resource_group_label" => "{\"key\":\"Resource Group\", \"value\":\"%{rscgrp}\"}"
                  "FLOWLOGS_label" => "{\"key\":\"FLOWLOGS\", \"value\":\"%{flow_log_name}\"}"
                }
                on_error => "no_label"
              }
              if ![no_label] {
                mutate {
                  replace => {
                    "security_label" => "{\"labels\":[%{NETWORKWATCHERS_name_label}, %{subscriptionid_label}, %{resource_group_label}, %{FLOWLOGS_label}]}"
                  }
                }
                json {
                  source => "security_label"
                  target => "about_labels"
                  on_error => "security_label_not_found"
                }

                mutate {
                  rename => {
                    "about_labels.labels" => "security_result.about.resource.attribute.labels"
                  }
                }
              }
            }
            mutate {
              convert => {
                "record.flowLogVersion" => "string"
              }
              on_error => "record_flowLogVersion_not_found"
            }
            mutate {
              replace => {
                "record_flowLogVersion" => "%{record.flowLogVersion}"
              }
              on_error => "record_flowLogVersion_not_found"
            }
            if [record_flowLogVersion] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.metadata.product_version" => "%{record_flowLogVersion}"
                }
                on_error => "record_flowLogVersion_not_found"
              }
            }
            mutate {
              replace => {
                "record_macAddress" => "%{record.macAddress}"
              }
              on_error => "mac_address_not_found"
            }
            if [record_macAddress] != "" {
              mutate {
                uppercase => ["record_macAddress"]
                gsub => ["record_macAddress", "(..)(..)(..)(..)(..)(..)", "\$1:\$2:\$3:\$4:\$5:\$6"]
              }
              mutate {
                merge => {
                  "event.idm.read_only_udm.principal.mac" => "record_macAddress"
                }
                on_error => "mac_address_not_found"
              }
              mutate {
                replace => {
                  "has_principal" => "true"
                }
              }
            }
            mutate {
              replace => {
                "record_operationName" => "%{record.operationName}"
              }
              on_error => "operation_name_not_found"
            }
            if [record_operationName] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.metadata.product_event_type" => "%{record_operationName}"
                }
                on_error => "operation_name_not_found"
              }
            }
            mutate {
              replace => {
                "record_category" => "%{record.category}"
              }
              on_error => "category_not_found"
            }
            if [record_category] != "" {
              mutate {
                replace => {
                  "security_result.rule_type" => "%{record_category}"
                }
                on_error => "category_not_found"
              }
            }
            mutate {
              replace => {
                "record_targetResourceID" => "%{record.targetResourceID}"
              }
              on_error => "record_resourceid_empty"
            }
            if [record_targetResourceID] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.resource.product_object_id" => "%{record_targetResourceID}"
                }
                on_error => "record_resourceid_empty"
              }
            }
            grok {
              match => {
                "record_targetResourceID" => [
                  "/%{GREEDYDATA:subscription}/%{GREEDYDATA:subscriptionid}/resourceGroups/%{GREEDYDATA:rscgrp}/providers/%{GREEDYDATA:appname}/virtualNetworks/%{GREEDYDATA:rscname}"
                ]
              }
              overwrite => ["subscription", "subscriptionid", "rscgrp", "appname", "rscname"]
              on_error => "record_targetResourceID_grok_failure"
            }
            if ![record_targetResourceID_grok_failure] {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.application" => "%{appname}"
                  "virtualNetworks_name_label" => "{\"key\":\"Virtual Networks\", \"value\":\"%{rscname}\"}"
                  "subscriptionid_label" => "{\"key\":\"Subscription Id\", \"value\":\"%{subscriptionid}\"}"
                  "resource_group_label" => "{\"key\":\"Resource Group\", \"value\":\"%{rscgrp}\"}"
                }
                on_error => "no_label"
              }
              if ![no_label] {
                mutate {
                  replace => {
                    "target_label" => "{\"labels\":[%{virtualNetworks_name_label}, %{subscriptionid_label}, %{resource_group_label}]}"
                  }
                }
                json {
                  source => "target_label"
                  target => "resource_labels"
                  on_error => "target_label_not_found"
                }

                mutate {
                  rename => {
                      "resource_labels.labels" => "event.idm.read_only_udm.target.resource.attribute.labels"
                  }
                }
              }
            }
            if [has_principal] == "true" and [has_target] == "true" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.metadata.event_type" => "NETWORK_FLOW"
                }
              }
            }
            else if [has_principal] == "true" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
                }
              }
            }
            else {
              mutate {
                replace => {
                  "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
                }
              }
            }
            if [security_result] != "" {
              mutate {
                merge => {
                  "event.idm.read_only_udm.security_result" => "security_result"
                }
                on_error => "security_result_not_found"
              }
            }
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.vendor_name" => "Microsoft"
                "event.idm.read_only_udm.metadata.product_name" => "Azure VNET Flow"
              }
            }
            if [event] != "" {
              mutate {
                merge => {
                  "@output" => "event"
                }
              }
            }
          }
        }
      }
    }
  }
}

