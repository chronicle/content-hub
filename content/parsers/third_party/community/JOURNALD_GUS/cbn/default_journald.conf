# Product: Journald
# Category: Log Aggregation and SIEM Systems
# Supported Format: JSON
# Last Updated: 2025-10-03
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "metadata" => ""
      "additional" => ""
      "target" => ""
      "security_result" => ""
      "network" => ""
      "src" => ""
      "insertId" => ""
      "jsonPayload.CODE_FILE" => ""
      "jsonPayload.CODE_FUNC" => ""
      "jsonPayload.CODE_LINE" => ""
      "jsonPayload.INVOCATION_ID" => ""
      "jsonPayload.MESSAGE" => ""
      "jsonPayload.MESSAGE_ID" => ""
      "jsonPayload.PRIORITY" => ""
      "jsonPayload.SYSLOG_FACILITY" => ""
      "jsonPayload.SYSLOG_IDENTIFIER" => ""
      "jsonPayload.UNIT" => ""
      "jsonPayload._BOOT_ID" => ""
      "jsonPayload._CAP_EFFECTIVE" => ""
      "jsonPayload._CMDLINE" => ""
      "jsonPayload._COMM" => ""
      "jsonPayload._EXE" => ""
      "jsonPayload._GID" => ""
      "jsonPayload._HOSTNAME" => ""
      "jsonPayload._MACHINE_ID" => ""
      "jsonPayload._PID" => ""
      "jsonPayload._SELINUX_CONTEXT" => ""
      "jsonPayload._SOURCE_REALTIME_TIMESTAMP" => ""
      "jsonPayload._SYSTEMD_CGROUP" => ""
      "jsonPayload._SYSTEMD_SLICE" => ""
      "jsonPayload._SYSTEMD_UNIT" => ""
      "jsonPayload._TRANSPORT" => ""
      "jsonPayload._UID" => ""
      "jsonPayload.__CURSOR" => ""
      "jsonPayload.__MONOTONIC_TIMESTAMP" => ""
      "labels.bp_csoc" => ""
      "labels.bp_env_id" => ""
      "labels.chronicle_log_tag" => ""
      "labels.cloud.region" => ""
      "labels.host.name" => ""
      "labels.os.type" => ""
      "logName" => ""
      "receiveTimestamp" => ""
      "resource.labels.location" => ""
      "resource.labels.namespace" => ""
      "resource.labels.node_id" => ""
      "resource.labels.project_id" => ""
      "resource.type" => ""
      "timestamp" => ""
      "MESSAGE" => ""
      "PRIORITY" => ""
      "SYSLOG_FACILITY" => ""
      "SYSLOG_IDENTIFIER" => ""
      "SYSLOG_PID" => ""
      "_BOOT_ID" => ""
      "_CMDLINE" => ""
      "_COMM" => ""
      "_EXE" => ""
      "_GID" => ""
      "_HOSTNAME" => ""
      "_MACHINE_ID" => ""
      "_PID" => ""
      "_SOURCE_REALTIME_TIMESTAMP" => ""
      "_SYSTEMD_CGROUP" => ""
      "_SYSTEMD_SLICE" => ""
      "_SYSTEMD_UNIT" => ""
      "_TRANSPORT" => ""
      "_UID" => ""
      "__CURSOR" => ""
      "__MONOTONIC_TIMESTAMP" => ""
      "_CAP_EFFECTIVE" => ""
      "CODE_FUNCTION" => ""
      "CODE_FILE" => ""
      "UNIT" => ""
      "CODE_LINE" => ""
      "MESSAGE_ID" => ""
      "RESULT" => ""
      "msg_id" => ""
      "kv_data" => ""
      "uid" => ""
      "from" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "target_user_present" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }

  if [insertId] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{insertId}"
      }
      on_error => "insertId_empty"
    }
  }

  if [jsonPayload][CODE_FILE] != "" {
    mutate {
      replace => {
        "src.file.full_path" => "%{jsonPayload.CODE_FILE}"
      }
      on_error => "jsonPayload.CODE_FILE_not_found"
    }
  }

  if [jsonPayload][CODE_FUNC] != "" {
    mutate{
      replace =>{
        "jsonPayload_CODE_FUNC_label.key" => "jsonPayload.CODE_FUNC"
        "jsonPayload_CODE_FUNC_label.value.string_value" => "%{jsonPayload.CODE_FUNC}"
      }
      on_error => "jsonPayload_CODE_FUNC_is_not_present"
    }

    if ![jsonPayload_CODE_FUNC_is_not_present] {
      mutate{
        merge =>{
          "additional.fields" => "jsonPayload_CODE_FUNC_label"
        }
        on_error => "jsonPayload_CODE_FUNC_is_not_present"
      }
    }
  }

  if [jsonPayload][CODE_LINE] != "" {
    mutate{
      replace =>{
        "jsonPayload_CODE_LINE_label.key" => "jsonPayload.CODE_LINE"
        "jsonPayload_CODE_LINE_label.value.string_value" => "%{jsonPayload.CODE_LINE}"
      }
      on_error => "jsonPayload_CODE_LINE_is_not_present"
    }
    if ![jsonPayload_CODE_LINE_is_not_present] {
      mutate{
        merge =>{
          "additional.fields" => "jsonPayload_CODE_LINE_label"
        }
        on_error => "jsonPayload_CODE_LINE_is_not_present"
      }
    }
  }

  if [jsonPayload][INVOCATION_ID] != "" {
    mutate{
      replace =>{
        "jsonPayload_INVOCATION_ID_label.key" => "jsonPayload.INVOCATION_ID"
        "jsonPayload_INVOCATION_ID_label.value.string_value" => "%{jsonPayload.INVOCATION_ID}"
      }
      on_error => "jsonPayload_INVOCATION_ID_is_not_present"
    }
    if ![jsonPayload_INVOCATION_ID_is_not_present] {
      mutate{
        merge =>{
          "additional.fields" => "jsonPayload_INVOCATION_ID_label"
        }
        on_error => "jsonPayload_INVOCATION_ID_is_not_present"
      }
    }
  }

  if [jsonPayload][MESSAGE] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{jsonPayload.MESSAGE}"
      }
      on_error => "msg_empty"
    }
  }

  if [jsonPayload][MESSAGE_ID] != "" {
    mutate {
      replace => {
        "jsonPayload_MESSAGE_ID_label.key" => "jsonPayload.MESSAGE_ID"
        "jsonPayload_MESSAGE_ID_label.value" => "%{jsonPayload.MESSAGE_ID}"
      }
      on_error => "jsonPayload_MESSAGE_ID_is_not_present"
    }
    if ![jsonPayload_MESSAGE_ID_is_not_present] {
      mutate {
        merge => {
          "security_result.detection_fields" => "jsonPayload_MESSAGE_ID_label"
        }
        on_error => "jsonPayload_MESSAGE_ID_is_not_present"
      }
    }
  }

  if [logName] != "" {
    mutate {
      replace => {
        "additional_logname.key" => "logName"
        "additional_logname.value.string_value" => "%{logName}"
      }
      on_error => "logname_add_value_missing"
    }
    if ![logname_add_value_missing] {
      mutate {
        merge => {
          "additional.fields" => "additional_logname"
        }
        on_error => "additional_logname_merge_failed"
      }
    }
  }

  mutate {
    convert => {
      "jsonPayload.PRIORITY" => "string"
    }
    on_error => "jsonPayload_PRIORITY_is_not_present"
  }

  if [jsonPayload][PRIORITY] != "" {
    mutate {
      replace => {
        "security_result.priority_details"=> "%{jsonPayload.PRIORITY}"
      }
      on_error => "jsonPayload_PRIORITY_is_not_present"
    }
  }

  if [jsonPayload][SYSLOG_FACILITY] != "" {
    mutate {
      replace => {
        "syslog_facility_label.value" => "%{jsonPayload.SYSLOG_FACILITY}"
      }
      on_error => "no_syslog_facility"
    }
    if ![no_syslog_facility] {
      mutate {
        replace => {
          "syslog_facility_label.key" => "SYSLOG_FACILITY"
        }
      }
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "syslog_facility_label"
        }
        on_error => "syslog_facility_label_empty"
      }
    }
  }

  if [jsonPayload][SYSLOG_IDENTIFIER] != "" {
    mutate {
      replace => {
        "SYSLOG_IDENTIFIER_label.value" => "%{jsonPayload.SYSLOG_IDENTIFIER}"
      }
      on_error => "no_SYSLOG_IDENTIFIER"
    }
    if ![no_SYSLOG_IDENTIFIER] {
      mutate {
        replace => {
          "SYSLOG_IDENTIFIER_label.key" => "SYSLOG_IDENTIFIER"
        }
      }
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "SYSLOG_IDENTIFIER_label"
        }
        on_error => "SYSLOG_IDENTIFIER_label_empty"
      }
    }
  }

  if [jsonPayload][UNIT] != "" {
    mutate {
      replace => {
        "jsonPayload_UNIT_label.key" => "jsonPayload.UNIT"
        "jsonPayload_UNIT_label.value.string_value" => "%{jsonPayload.UNIT}"
      }
      on_error => "jsonPayload_UNIT_is_not_present"
    }
    if ![jsonPayload_UNIT_is_not_present] {
      mutate {
        merge => {
          "additional.fields" => "jsonPayload_UNIT_label"
        }
        on_error => "jsonPayload_UNIT_is_not_present"
      }
    }
  }

  if [jsonPayload][_BOOT_ID] != "" {
    mutate {
      replace => {
        "jsonpayload_boot_id.value" => "%{jsonPayload._BOOT_ID}"
      }
      on_error => "no_jsonpayload_boot_id"
    }

    if ![no_jsonpayload_boot_id] {
      mutate {
        replace => {
          "jsonpayload_boot_id.key" => "jsonpayload_boot_id"
        }
        on_error => "jsonpayload_boot_id_empty"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "jsonpayload_boot_id"
      }
      on_error => "jsonpayload_boot_id_empty"
    }
  }

  if [jsonPayload][_CAP_EFFECTIVE] != "" {
    mutate {
      replace => {
        "_CAP_EFFECTIVE_label.value" => "%{jsonPayload._CAP_EFFECTIVE}"
      }
      on_error => "no__CAP_EFFECTIVE"
    }
    if ![no__CAP_EFFECTIVE] {
      mutate {
        replace => {
          "_CAP_EFFECTIVE_label.key" => "CAP_EFFECTIVE"
        }
      }
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "_CAP_EFFECTIVE_label"
        }
        on_error => "_CAP_EFFECTIVE_label_empty"
      }
    }
  }

  if [jsonPayload][_CMDLINE] != "" {
    mutate {
      replace => {
        "principal.process.command_line" => "%{jsonPayload._CMDLINE}"
      }
      on_error => "no__CMDLINE"
    }
  }

  if [jsonPayload][_COMM] != "" {
    mutate {
      merge => {
        "principal.process.file.names" => "jsonPayload._COMM"
      }
      on_error => "no_jsonPayload__COMM"
    }
  }

  if [jsonPayload][_EXE] != "" {
    mutate {
      replace => {
        "principal.process.file.full_path" => "%{jsonPayload._EXE}"
      }
      on_error => "no_jsonPayload__EXE"
    }
  }

  if [jsonPayload][_GID] != "" {
    mutate {
      replace => {
        "jsonPayload_GID.value" => "%{jsonPayload._GID}"
      }
      on_error => "_GID_not_found"
    }
    if ![_GID_not_found] {
      mutate {
        replace => {
          "jsonPayload_GID.key" => "GID"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "jsonPayload_GID"
        }
      }
    }
  }

  if [jsonPayload][_HOSTNAME] != "" {
    mutate {
      replace => {
      "principal.hostname" => "%{jsonPayload._HOSTNAME}"
      "has_principal" => "true"
      }
      on_error => "no_jsonpayload_HOSTNAME"
    }
  }

  if [jsonPayload][_MACHINE_ID] != "" {
    mutate {
      replace => {
        "_MACHINE_ID_label.value.string_value" => "%{jsonPayload._MACHINE_ID}"
      }
      on_error => "_MACHINE_ID_empty"
    }
    if ![_MACHINE_ID_empty] {
      mutate {
        replace => {
          "_MACHINE_ID_label.key" => "MACHINE_ID"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "_MACHINE_ID_label"
        }
        on_error => "_MACHINE_ID_label_empty"
      }
    }
  }

  if [jsonPayload][_PID] != "" {
    mutate {
      replace => {
        "target.process.pid" => "%{jsonPayload._PID}"
      }
      on_error => "no_pid"
    }
  }

  if [jsonPayload][_SELINUX_CONTEXT] != "" {
    mutate {
      replace => {
        "jsonPayload_SELINUX_CONTEXT_label.key" => "jsonPayload._SELINUX_CONTEXT"
        "jsonPayload_SELINUX_CONTEXT_label.value" => "%{jsonPayload._SELINUX_CONTEXT}"
      }
      on_error => "jsonPayload_SELINUX_CONTEXT_is_not_present"
    }
    if ![jsonPayload_SELINUX_CONTEXT_is_not_present] {
      mutate {
        merge => {
          "principal.labels" => "jsonPayload_SELINUX_CONTEXT_label"
        }
        on_error => "jsonPayload_SELINUX_CONTEXT_is_not_present"
      }
    }
  }

  if [jsonPayload][_SOURCE_REALTIME_TIMESTAMP] != "" {
    mutate {
      replace => {
        "jsonPayload_SOURCE_REALTIME_TIMESTAMP_label.key" => "jsonPayload._SOURCE_REALTIME_TIMESTAMP"
        "jsonPayload_SOURCE_REALTIME_TIMESTAMP_label.value" => "%{jsonPayload._SOURCE_REALTIME_TIMESTAMP}"
      }
      on_error => "no__SOURCE_REALTIME_TIMESTAMP"
    }
    if ![no__SOURCE_REALTIME_TIMESTAMP] {
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "jsonPayload_SOURCE_REALTIME_TIMESTAMP_label"
        }
        on_error => "_SOURCE_REALTIME_TIMESTAMP_label_empty"
      }
    }
  }

  if [jsonPayload][_SYSTEMD_CGROUP] != "" {
    mutate {
      replace => {
        "_SYSTEMD_CGROUP_label.value" => "%{jsonPayload._SYSTEMD_CGROUP}"
      }
      on_error => "no__SYSTEMD_CGROUP"
    }
    if ![no__SYSTEMD_CGROUP] {
      mutate {
        replace => {
          "_SYSTEMD_CGROUP_label.key" => "SYSTEMD_CGROUP"
        }
      }
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "_SYSTEMD_CGROUP_label"
        }
        on_error => "_SYSTEMD_CGROUP_label_empty"
      }
    }
  }

  if [jsonPayload][_SYSTEMD_SLICE] != "" {
    mutate {
      replace => {
        "_SYSTEMD_SLICE_label.value" => "%{jsonPayload._SYSTEMD_SLICE}"
      }
      on_error => "no__SYSTEMD_SLICE"
    }
    if ![no__SYSTEMD_SLICE] {
      mutate {
        replace => {
          "_SYSTEMD_SLICE_label.key" => "SYSTEMD_SLICE"
        }
      }
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "_SYSTEMD_SLICE_label"
        }
        on_error => "_SYSTEMD_SLICE_label_empty"
      }
    }
  }

  if [jsonPayload][_SYSTEMD_UNIT] != "" {
    mutate {
      replace => {
        "additional_SYSTEMD_UNIT.value" => "%{jsonPayload._SYSTEMD_UNIT}"
      }
      on_error => "systemd_unit_not_found"
    }
    if ![systemd_unit_not_found] {
      mutate {
        replace => {
          "additional_SYSTEMD_UNIT.key" => "SYSTEMD_UNIT"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "additional_SYSTEMD_UNIT"
        }
      }
    }
  }

  if [jsonPayload][_TRANSPORT] != "" {
    mutate {
      replace => {
        "_TRANSPORT_label.value" => "%{jsonPayload._TRANSPORT}"
      }
      on_error => "no__TRANSPORT"
    }
    if ![no__TRANSPORT] {
      mutate {
        replace => {
          "_TRANSPORT_label.key" => "TRANSPORT"
        }
      }
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "_TRANSPORT_label"
        }
        on_error => "_TRANSPORT_label_empty"
      }
    }
  }

  if [jsonPayload][_UID] not in  ["", "0"] {
    mutate {
      replace => {
        "target.user.userid" => "%{jsonPayload._UID}"
        "has_user" => "true"
      }
      on_error => "no_uid"
    }
  }

  if [jsonPayload][__CURSOR] != "" {
    mutate {
      replace => {
        "jsonPayload_CURSOR_label.key" => "jsonPayload.__CURSOR"
        "jsonPayload_CURSOR_label.value.string_value" => "%{jsonPayload.__CURSOR}"
      }
      on_error => "jsonPayload_CURSOR_is_not_present"
    }
    if ![jsonPayload_CURSOR_is_not_present] {
      mutate {
        merge => {
          "additional.fields" => "jsonPayload_CURSOR_label"
        }
        on_error => "jsonPayload_CURSOR_is_not_present"
      }
    }
  }

  if [jsonPayload][__MONOTONIC_TIMESTAMP] != "" {
    mutate {
      replace => {
        "jsonPayload_MONOTONIC_TIMESTAMP_label.key" => "MONOTONIC_TIMESTAMP"
        "jsonPayload_MONOTONIC_TIMESTAMP_label.value.string_value" => "%{jsonPayload.__MONOTONIC_TIMESTAMP}"
      }
      on_error => "jsonPayload_MONOTONIC_TIMESTAMP_is_not_present"
    }
    if ![jsonPayload_MONOTONIC_TIMESTAMP_is_not_present] {
      mutate {
        merge => {
          "additional.fields" => "jsonPayload_MONOTONIC_TIMESTAMP_label"
        }
        on_error => "jsonPayload_MONOTONIC_TIMESTAMP_is_not_present"
      }
    }
  }

  if [labels][bp_csoc] != "" {
    mutate {
      replace => {
        "labels_bp_csoc.value" => "%{labels.bp_csoc}"
      }
      on_error => "no_bp_csoc"
    }
    if ![no_bp_csoc] {
      mutate {
        replace => {
          "labels_bp_csoc.key" => "bp_csoc"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "labels_bp_csoc"
        }
        on_error => "labels_bp_csoc_empty"
      }
    }
  }

  if [labels][bp_env_id] != "" {
    mutate {
      replace => {
        "labels_bp_env_id.value" => "%{labels.bp_env_id}"
      }
      on_error => "no_bp_env_id"
    }
    if ![no_bp_env_id] {
      mutate {
        replace => {
          "labels_bp_env_id.key" => "bp_env_id"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "labels_bp_env_id"
        }
        on_error => "labels_bp_env_id_empty"
      }
    }
  }

  if [labels][chronicle_log_tag] != "" {
    mutate {
      replace => {
        "labels_chronicle_log_tag.value" => "%{labels.chronicle_log_tag}"
      }
      on_error => "no_chronicle_log_tag"
    }
    if ![no_chronicle_log_tag] {
      mutate {
        replace => {
          "labels_chronicle_log_tag.key" => "chronicle_log_tag"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "labels_chronicle_log_tag"
        }
        on_error => "labels_chronicle_log_tag_empty"
      }
    }
  }

  if [labels][cloud][region] != "" {
    mutate {
      replace => {
        "labels_cloud_region.value" => "%{labels.cloud.region}"
      }
      on_error => "no_cloud_region"
    }
    if ![no_cloud_region] {
      mutate {
        replace => {
          "labels_cloud_region.key" => "cloud_region"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "labels_cloud_region"
        }
        on_error => "labels_cloud_region_empty"
      }
    }
  }

  if [labels][os][type]=~"(?i)linux"{
    mutate{
      replace=>{
        "target.platform"=>"LINUX"
      }
    }
  }
  else if [labels][os][type]=~"(?i)windows"{
    mutate{
      replace=>{
        "target.platform"=>"WINDOWS"
      }
    }
  }
  else if [labels][os][type]=~"(?i)mac"{
    mutate{
      replace=>{
        "target.platform"=>"MAC"
      }
    }
  }



  if [timestamp] != "" {
    date {
      match => ["timestamp","ISO8601"]
      on_error => "not_in_iso_format"
    }
  }

  if [resource][labels][location] != "" {
    mutate {
      replace => {
        "target.location.name" => "%{resource.labels.location}"
      }
      on_error => "no_location"
    }
  }

  if [resource][labels][namespace] != "" {
    mutate {
      replace => {
        "target.namespace" => "%{resource.labels.namespace}"
      }
      on_error => "no_resource_labels_namespace"
    }
  }

  if [resource][labels][project_id] != "" {
    mutate {
      replace => {
        "cloud_project_id_label.key" => "project_id"
        "cloud_project_id_label.value" => "%{resource.labels.project_id}"
      }
      on_error => "no_resource_labels_project_id"
    }

    mutate {
      merge => {
        "target.resource.attribute.labels" => "cloud_project_id_label"
      }
      on_error => "no_resource_labels_project_id"
    }
  }

  if [resource][type] != "" {
    mutate {
      replace => {
        "target.resource.type" => "%{resource.type}"
      }
    }
  }
  if [MESSAGE] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{MESSAGE}"
      }
      on_error => "MESSAGE_not_found"
    }
    grok {
      match => {
        "MESSAGE" => "%{DATA:msg_id}:(\\s+)?%{GREEDYDATA:kv_data}"
      }
      overwrite => ["msg_id", "kv_data"]
      on_error => "message_grok_failed"
    }
    mutate {
      gsub => ["kv_data", " ([A-Za-z0-9\\s]+)=", "#$1="]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "not_kv_data"
    }
  }
  if [msg_id] != "" {
    mutate {
      replace => {
        "network.email.mail_id" => "%{msg_id}"
      }
      on_error => "message_id_not_replaced"
    }
  }
  if [from] != "" {
    mutate {
      replace => {
        "src.user.user_display_name" => "%{from}"
      }
      on_error => "from_not_replaced"
    }
  }
  if [uid] != "" {
    mutate {
      replace => {
        "src.user.userid" => "%{uid}"
      }
      on_error => "uid_not_found"
    }
  }

  if [_HOSTNAME] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{_HOSTNAME}"
        "has_principal" => "true"
      }
      on_error => "no__HOSTNAME"
    }
  }

  if [_UID] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{_UID}"
        "has_user" => "true"
      }
      on_error => "no__UID"
    }
  }

  if [_GID] != "" {
    mutate {
      replace => {
        "GID_label.value" => "%{_GID}"
      }
      on_error => "_GID_not_replaced"
    }
    if ![_GID_not_replaced] {
      mutate {
        replace => {
          "GID_label.key" => "GID"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "GID_label"
        }
        on_error => "_GID_label_empty"
      }
    }
  }

  if [_PID] != "" {
    mutate {
      replace => {
        "target.process.pid" => "%{_PID}"
      }
      on_error => "no__PID"
    }
  }
