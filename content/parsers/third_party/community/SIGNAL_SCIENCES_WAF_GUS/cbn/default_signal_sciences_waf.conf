# Product: Signal Sciences WAF
# Category: WAF
# Supported Format: JSON
# Reference: https://info.signalsciences.com/10-key-capabilities-of-signal-sciences
# Last Updated: 2024-05-13
# Copyright 2024 Chronicle LLC

filter {

  mutate {
    replace => {
      "alert" => ""
      "grp_idn" => ""
      "client_ip" => ""
      "created" => ""
      "timestamp" => ""
      "protocol" => ""
      "tlsProtocol" => ""
      "tlsCipher" => ""
      "responseCode" => ""
      "serverHostname" => ""
      "remoteIP" => ""
      "responseSize" => ""
      "uri" => ""
      "remoteHostname" => ""
      "serverName" => ""
      "userAgent" => ""
      "method" => ""
      "remoteCountryCode" => ""
      "id" => ""
      "message_data" => ""
      "event_type" => ""
      "eventType" => ""
      "username" => ""
      "userid" => ""
      "msgData.detailLink" => ""
      "msgData.name" => ""
      "msgData.changes" => ""
      "msgData.actions" => ""
      "msgData.reason" => ""
      "msgData.conditions" => ""
      "msgData.sites" => ""
      "security_result" => ""
      "security_result_headin" => ""
      "URI" => ""
      "ModuleVersion" => ""
      "data" => ""
      "has_target" => "false"
      "has_principal" => "false"
    }
  }
  if [message] =~ "RPC.PreRequest" {
    grok {
      match => {
        "message" => [
          "RPC.PreRequest Request: %{GREEDYDATA:message}"
          "RPC.PostRequest Request:%{GREEDYDATA:message}"
        ]
      }
      overwrite => ["message"]
      on_error => "not_grok_pattern"
    }
    if [not_grok_pattern] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }

    mutate {
      gsub => ["message","Protocol","protocol"]
    }
    mutate {
      gsub => ["message","HeadersIn","headersIn"]
    }
    mutate {
      gsub => ["message","ServerName","serverHostname"]
    }
    mutate {
      gsub => ["message","RemoteAddr","remoteIP"]
    }
    mutate {
      gsub => ["message","TLSprotocol","tlsProtocol"]
    }
    mutate {
      gsub => ["message","TLSCipher","tlsCipher"]
    }
    mutate {
      gsub => ["message","ResponseCode","responseCode"]
    }
    mutate {
      gsub => ["message","ResponseSize","responseSize"]
    }
    mutate {
      gsub => ["message","Method","method"]
    }
  }
  else {
    mutate {
      gsub => ["message","message","message_data"]
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failure"
  }

  if [data] == "" {
    if [ModuleVersion] != "" {
      mutate {
        replace => {
          "label.key" => "ModuleVersion"
          "label.value" => "%{ModuleVersion}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.metadata.ingestion_labels" => "label"
        }
      }
    }
    if [URI] not in ["","/"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.url" => "%{URI}"
        }
      }
    }
    if [timestamp] != "" {
      date {
        match => [ "timestamp","RFC3339" ]
        rebase => true
      }
    }
    else if [created] != "" {
      date {
        match => [ "created","ISO8601" ]
        rebase => true
      }
    }

    if [protocol] == "HTTP/1.1" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "HTTP"
        }
      }
    }

    if [tlsProtocol] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.version" => "%{tlsProtocol}"
        }
      }
    }

    if [tlsCipher] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.cipher" => "%{tlsCipher}"
        }
      }
    }

    mutate {
      convert => {
        "responseCode" => "string"
      }
      on_error => "already_string"
    }
    if [responseCode] != "" and [responseCode] !~ "[-]"{
      mutate {
        convert => {
          "responseCode" => "integer"
        }
        on_error => "convert_failed"
      }

      mutate {
        rename => {
          "responseCode" => "event.idm.read_only_udm.network.http.response_code"
        }
      }
    }

    if [serverHostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{serverHostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{serverHostname}"
          "has_principal" => "true"
        }
        on_error => "serverHostname_empty"
      }
    }

    if [remoteIP] != "" {
      mutate {
        gsub => ["remoteIP", "%([0-9]+)", ""]
      }
      grok {
        match => {
          "remoteIP" => "%{IP:remoteIP}"
        }
        overwrite => ["remoteIP"]
        on_error => "remoteIP_failure"
      }
      if ![remoteIP_failure] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "remoteIP"
            "event.idm.read_only_udm.target.asset.ip" => "remoteIP"
          }
          on_error => "remote_ip_failure"
        }
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }

    mutate {
      convert => {
        "responseSize" => "string"
      }
      on_error => "already_string"
    }
    if [responseSize] != "" and [responseSize] !~ "[-]" {
      mutate {
        convert => {
          "responseSize" => "uinteger"
        }
        on_error => "convert_failed"
      }

      mutate {
        rename => {
          "responseSize" => "event.idm.read_only_udm.network.received_bytes"
        }
      }
    }

    for idx, hInfo in headersIn {
      if [hInfo][0] == "X-ARR-SSL" {
        mutate {
          replace => {
            grp_idn => "%{hInfo.1}"
          }
        }
      }
      if [hInfo][0] == "CLIENT-IP" {
        mutate {
          replace => {
            client_ip => "%{hInfo.1}"
          }
        }
      }
      if [hInfo][0] not in ["CLIENT-IP", "X-ARR-SSL"] {
        mutate {
          replace => {
            "sec_res_headin" => ""
          }
        }
        mutate {
          replace => {
            "sec_res_headin.key" => "%{hInfo.0}"
            "sec_res_headin.value" => "%{hInfo.1}"
          }
        }
        if [hInfo][1] != "/" {
          mutate {
            merge => {
              "security_result_headin.about.labels" => "sec_res_headin"
            }
          }
        }
        if [idx] == 0 and [security_result_headin] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.security_result" => "security_result_headin"
            }
          }
        }
      }
    }

    for idxheadout, headout in headersOut {
      mutate {
        replace => {
          "sec_res_headout" => ""
        }
      }
      mutate {
        replace => {
          "sec_res_headout.key" => "%{headout.0}"
          "sec_res_headout.value" => "%{headout.1}"
        }
      }
      mutate {
        merge => {
          "security_result_headout.about.labels" => "sec_res_headout"
        }
      }
      if [idxheadout] == 0 {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result_headout"
          }
        }
      }
    }

    for idxtag, tag in tags {
      mutate {
        replace => {
          "security_result_tag" => ""
          "detector_field" => ""
          "detector_field_value" => ""
          "link_field_value" => ""
          "location_field_value" => ""
          "redaction_field_value" => ""
          "type_field_value" => ""
          "value_field_value" => ""
          "link_field" => ""
          "location_field" => ""
          "redaction_field" => ""
          "type_field" => ""
          "value_field" => ""
        }
      }
      mutate {
        replace => {
          "detector_field_value" => "%{tag.detector}"
        }
        on_error => "tag_detector_field_empty"
      }
      if [detector_field_value] != "" {
        mutate {
          replace => {
            "detector_field.value" => "%{detector_field_value}"
          }
          on_error => "tag_detector_field_value_empty"
        }
        if ![tag_detector_field_value_empty] {
          mutate {
            replace => {
              "detector_field.key" => "detector"
            }
          }
          mutate {
            merge => {
              "security_result_tag.detection_fields" => "detector_field"
            }
            on_error => "detector_field_empty"
          }
        }
      }

      mutate {
        replace => {
          "link_field_value" => "%{tag.link}"
        }
        on_error => "tag_link_field_empty"
      }
      if [link_field_value] != "" {
        mutate {
          replace => {
            "link_field.value" => "%{link_field_value}"
          }
          on_error => "tag_link_field_value_empty"
        }

        if ![tag_link_field_value_empty] {
          mutate {
            replace => {
              "link_field.key" => "link"
            }
          }
          mutate {
            merge => {
              "security_result_tag.detection_fields" => "link_field"
            }
            on_error => "link_field_empty"
          }
        }
      }

      mutate {
        replace => {
          "location_field_value" => "%{tag.location}"
        }
        on_error => "tag_location_field_empty"
      }
      if [location_field_value] != "" {
        mutate {
          replace => {
            "location_field.value" => "%{location_field_value}"
          }
          on_error => "tag_location_field_value_empty"
        }

        if ![tag_location_field_value_empty] {
          mutate {
            replace => {
              "location_field.key" => "location"
            }
          }
          mutate {
            merge => {
              "security_result_tag.detection_fields" => "location_field"
            }
            on_error => "location_field_empty"
          }
        }
      }

      mutate {
        replace => {
          "redaction_field_value" => "%{tag.redaction}"
        }
        on_error => "tag_redaction_field_empty"
      }
      if [redaction_field_value] != "" {
        mutate {
          replace => {
            "redaction_field.value" => "%{redaction_field_value}"
          }
          on_error => "tag_redaction_field_value_empty"
        }

        if ![tag_redaction_field_value_empty] {
          mutate {
            replace => {
              "redaction_field.key" => "redaction"
            }
          }
          mutate {
            merge => {
              "security_result_tag.detection_fields" => "redaction_field"
            }
            on_error => "redaction_field_empty"
          }
        }
      }

      mutate {
        replace => {
          "type_field_value" => "%{tag.type}"
        }
        on_error => "tag_type_field_empty"
      }
      if [type_field_value] != "" {
        mutate {
          replace => {
            "type_field.value" => "%{type_field_value}"
          }
          on_error => "tag_type_field_value_empty"
        }

        if ![tag_type_field_value_empty] {
          mutate {
            replace => {
              "type_field.key" => "type"
            }
          }
          mutate {
            merge => {
              "security_result_tag.detection_fields" => "type_field"
            }
            on_error => "type_field_empty"
          }
        }
      }

      mutate {
        replace => {
          "value_field_value" => "%{tag.value}"
        }
        on_error => "tag_value_field_empty"
      }
      if [value_field_value] != "" {
        mutate {
          replace => {
            "value_field.value" => "%{value_field_value}"
          }
          on_error => "tag_value_field_value_empty"
        }

        if ![tag_value_field_value_empty] {
          mutate {
            replace => {
              "value_field.key" => "value"
            }
          }
          mutate {
            merge => {
              "security_result_tag.detection_fields" => "value_field"
            }
            on_error => "value_field_empty"
          }
        }
      }
      if [security_result_tag] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result_tag"
          }
        }
      }
    }

    # Mapping Certificate Issuer
    if [grp_idn] != "" {
      grok {
        match => {
          "grp_idn" => "([^|]*)\\|([^|]*)\\|(?P<grp_idn1>([^|]*))\\|(?P<grp_idn2>([^|]*))"
        }
        overwrite => ["grp_idn1", "grp_idn2"]
      }

      kv {
        source => "grp_idn1"
        field_split => ", "
        value_split => "="
      }
    }
    mutate {
      rename => {
        "O" => "event.idm.read_only_udm.network.tls.client.certificate.issuer"
      }
    }

    # Mapping Client Port
    if [client_ip] != "" {
      grok {
        match => {
          "client_ip" => [
            "%{IP}:%{INT:client_port}"
            "\\[%{IP}\\]:%{INT:client_port}"
          ]
        }
        overwrite => ["client_port"]
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{client_port}"
        }
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
      }
    }

    if [uri] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{uri}"
        }
      }
    }

    if [remoteHostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{remoteHostname}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{remoteHostname}"
          "event_type" => "NETWORK_HTTP"
        }
      }
    }

    if [serverName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.network_domain" => "%{serverName}"
        }
      }
    }

    if [userAgent] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{userAgent}"
        }
      }
    }

    if [method] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{method}"
        }
      }
    }

    if [remoteCountryCode] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.location.country_or_region" = "%{remoteCountryCode}"
        }
      }
    }

    if [id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{id}"
        }
      }
    }

    if [eventType] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{eventType}"
        }
      }
    }

    if [message_data] != "" {
      grok {
        match => {
          "message_data" => "%{DATA:username} \\(%{GREEDYDATA:userid}\\)"
        }
        overwrite => ["username", "userid"]
        on_error => "match_error"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{message_data}"
        }
      }
    }

    if [username] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.user_display_name" => "%{username}"
        }
      }
    }

    if [userid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{userid}"
        }
      }
    }

    for index, attachment in attachments {
      for field in attachment.Fields {
        mutate {
          replace => {
            "label" => ""
          }
        }
        mutate {
          convert => {
            "field.Short" => "string"
          }
          on_error => "field_not_found"
        }

        mutate {
          replace => {
            "label.key" => "%{field.Title}"
            "label.value" => "%{field.Value}, Short - %{field.Short}"
          }
          on_error => "no_field"
        }

        if [label] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.metadata.ingestion_labels" => "label"
            }
          }
        }
      }
    }

    if [msgData][detailLink] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{msgData.detailLink}"
          "event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }

    if [msgData][name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{msgData.name}"
          "event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }

    if [msgData][changes] != "" {
      mutate {
        replace => {
          "changes_label.key" => "changes"
          "changes_label.value" => "%{msgData.changes}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "changes_label"
        }
      }
    }

    if [msgData][actions] =~ "(?i)allow" {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
      }
    }

    if [msgData][reason] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{msgData.reason}"
        }
      }
    }

    if [msgData][conditions] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{msgData.conditions}"
        }
      }
    }

    if [msgData][sites] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{msgData.sites}"
        }
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }


    if [event_type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
        }
      }
    }
    else if [has_target] == "true" and [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        }
      }
    }
    else if [has_target] == "false" and [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "Signal Sciences"
        "event.idm.read_only_udm.metadata.product_name" => "Signal Sciences WAF"
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  } else if [data] != "" {
    for details in data {
      mutate {
        replace => {
          "event" => ""
          "proto" => ""
          "target_ip" => ""
          "respcode" => ""
          "resSize" => ""
          "security_result" => ""
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{details.serverHostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{details.serverHostname}"
          "has_principal" => "true"
        }
        on_error => "serverHostname_empty"
      }

      mutate {
        replace => {
          "target_ip" => "%{details.remoteIP}"
        }
        on_error => "remoteIP_empty"
      }

      if ![remoteIP_empty] and [target_ip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "target_ip"
            "event.idm.read_only_udm.target.asset.ip" => "target_ip"
          }
          on_error => "target_ip_empty"
        }
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{details.uri}"
        }
        on_error => "uri_empty"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{details.remoteHostname}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{details.remoteHostname}"
          "has_target" => "true"
          "event_type" => "NETWORK_HTTP"
        }
        on_error => "remoteHostname_empty"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.network_domain" => "%{details.serverName}"
        }
        on_error => "serverName_empty"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{details.userAgent}"
        }
        on_error => "userAgent_empty"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{details.method}"
        }
        on_error => "method_empty"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.location.country_or_region" = "%{details.remoteCountryCode}"
        }
        on_error => "remoteCountryCode_empty"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{details.id}"
        }
        on_error => "id_empty"
      }

      mutate {
        replace => {
          "proto" => "%{details.protocol}"
        }
        on_error => "protocol_empty"
      }

      if [proto] == "HTTP/1.1" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "HTTP"
          }
          on_error => "proto_empty"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.version" => "%{details.tlsProtocol}"
        }
        on_error => "tlsProtocol_empty"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.cipher" => "%{details.tlsCipher}"
        }
        on_error => "tlsCipher_empty"
      }

      mutate {
        convert => {
          "details.responseCode" => "string"
        }
        on_error => "already_string"
      }
      mutate {
        replace => {
          "respcode" => "%{details.responseCode}"
        }
        on_error => "ResponseCode_empty"
      }
      if [respcode] != "" and [respcode] !~ "[-]"{
        mutate {
          convert => {
            "respcode" => "integer"
          }
          on_error => "convert_failed"
        }
        mutate {
          rename => {
            "respcode" => "event.idm.read_only_udm.network.http.response_code"
          }
        }
      }

      mutate {
        convert => {
          "details.responseSize" => "string"
        }
        on_error => "already_string"
      }
      mutate {
        replace => {
          "resSize" => "%{details.responseSize}"
        }
        on_error => "responseSize_empty"
      }
      if [resSize] != "" and [resSize] !~ "[-]" {
        mutate {
          convert => {
            "resSize" => "uinteger"
          }
          on_error => "convert_failed"
        }
        mutate {
          rename => {
            "resSize" => "event.idm.read_only_udm.network.received_bytes"
          }
        }
      }

      for index,hInfo in details.headersIn {
        mutate {
          replace => {
            "sec_res_headin" => ""
          }
        }
        mutate {
          convert => {
            "index" => "string"
          }
          on_error => "index_already_string"
        }
        mutate {
          replace => {
            "sec_res_headin.value" => "%{hInfo.1}"
          }
          on_error => "name_empty"
        }
        if ![name_empty] {
          mutate {
            replace => {
              "sec_res_headin.key" => "headersIn %{hInfo.0}"
            }
          }
        }
        mutate {
          merge => {
            "security_result.about.resource.attribute.labels" => "sec_res_headin"
          }
        }
      }

      for index,hInfo in details.headersOut {
        mutate {
          replace => {
            "sec_res_headOut" => ""
          }
        }
        mutate {
          convert => {
            "index" => "string"
          }
          on_error => "index_already_string"
        }
        mutate {
          replace => {
            "sec_res_headOut.value" => "%{hInfo.1}"
          }
          on_error => "name_empty"
        }
        if ![name_empty] {
          mutate {
            replace => {
              "sec_res_headOut.key" => "headersOut %{hInfo.0}"
            }
          }
        }
        mutate {
          merge => {
            "security_result.about.resource.attribute.labels" => "sec_res_headOut"
          }
        }
      }
      for idxtag, tag in details.tags {
        mutate {
          replace => {
            "detector_field" => ""
            "detector_field_value" => ""
            "link_field_value" => ""
            "location_field_value" => ""
            "redaction_field_value" => ""
            "type_field_value" => ""
            "value_field_value" => ""
            "link_field" => ""
            "location_field" => ""
            "redaction_field" => ""
            "type_field" => ""
            "value_field" => ""
          }
        }
        mutate {
          replace => {
            "detector_field_value" => "%{tag.detector}"
          }
          on_error => "tag_detector_field_empty"
        }
        if [detector_field_value] != "" {
          mutate {
            replace => {
              "detector_field.value" => "%{detector_field_value}"
            }
            on_error => "tag_detector_field_value_empty"
          }
          if ![tag_detector_field_value_empty] {
            mutate {
              replace => {
                "detector_field.key" => "detector"
              }
            }
            mutate {
              merge => {
                "security_result.detection_fields" => "detector_field"
              }
              on_error => "detector_field_empty"
            }
          }
        }

        mutate {
          replace => {
            "link_field_value" => "%{tag.link}"
          }
          on_error => "tag_link_field_empty"
        }
        if [link_field_value] != "" {
          mutate {
            replace => {
              "link_field.value" => "%{link_field_value}"
            }
            on_error => "tag_link_field_value_empty"
          }

          if ![tag_link_field_value_empty] {
            mutate {
              replace => {
                "link_field.key" => "link"
              }
            }
            mutate {
              merge => {
                "security_result.detection_fields" => "link_field"
              }
              on_error => "link_field_empty"
            }
          }
        }

        mutate {
          replace => {
            "location_field_value" => "%{tag.location}"
          }
          on_error => "tag_location_field_empty"
        }
        if [location_field_value] != "" {
          mutate {
            replace => {
              "location_field.value" => "%{location_field_value}"
            }
            on_error => "tag_location_field_value_empty"
          }

          if ![tag_location_field_value_empty] {
            mutate {
              replace => {
                "location_field.key" => "location"
              }
            }
            mutate {
              merge => {
                "security_result.detection_fields" => "location_field"
              }
              on_error => "location_field_empty"
            }
          }
        }

        mutate {
          replace => {
            "redaction_field_value" => "%{tag.redaction}"
          }
          on_error => "tag_redaction_field_empty"
        }
        if [redaction_field_value] != "" {
          mutate {
            replace => {
              "redaction_field.value" => "%{redaction_field_value}"
            }
            on_error => "tag_redaction_field_value_empty"
          }

          if ![tag_redaction_field_value_empty] {
            mutate {
              replace => {
                "redaction_field.key" => "redaction"
              }
            }
            mutate {
              merge => {
                "security_result.detection_fields" => "redaction_field"
              }
              on_error => "redaction_field_empty"
            }
          }
        }

        mutate {
          replace => {
            "type_field_value" => "%{tag.type}"
          }
          on_error => "tag_type_field_empty"
        }
        if [type_field_value] != "" {
          mutate {
            replace => {
              "type_field.value" => "%{type_field_value}"
            }
            on_error => "tag_type_field_value_empty"
          }

          if ![tag_type_field_value_empty] {
            mutate {
              replace => {
                "type_field.key" => "type"
              }
            }
            mutate {
              merge => {
                "security_result.detection_fields" => "type_field"
              }
              on_error => "type_field_empty"
            }
          }
        }

        mutate {
          replace => {
            "value_field_value" => "%{tag.value}"
          }
          on_error => "tag_value_field_empty"
        }
        if [value_field_value] != "" {
          mutate {
            replace => {
              "value_field.value" => "%{value_field_value}"
            }
            on_error => "tag_value_field_value_empty"
          }

          if ![tag_value_field_value_empty] {
            mutate {
              replace => {
                "value_field.key" => "value"
              }
            }
            mutate {
              merge => {
                "security_result.detection_fields" => "value_field"
              }
              on_error => "value_field_empty"
            }
          }
        }
      }

      if [security_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
          on_error => "security_result_empty"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.vendor_name" => "Signal Sciences"
          "event.idm.read_only_udm.metadata.product_name" => "Signal Sciences WAF"
        }
      }
      if [event_type] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
          }
          on_error => "event_type_empty"
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
}
