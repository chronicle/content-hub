# Product: Fortinet_FortiAuthenticator
# Category: Security
# Supported Format: SYSLOG + KV, KV
# Reference: N/A
# Last Updated: 2025-05-06
# Copyright 2025 Google SecOps.

filter {
  mutate {
    replace => {
      "nas" => ""
      "level" => ""
      "status" => ""
      "subcategory" => ""
      "category" => ""
      "typeid" => ""
      "action" => ""
      "sec_action" => ""
      "prin_user" => ""
      "user" => ""
      "date_time" => ""
      "kv_data" => ""
      "prin_hostname" => ""
      "prin_ip" => ""
      "msg" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "additional" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "has_target_user" => "false"
      "has_user_login" => "false"
      "has_user_logout" => "false"
      "has_principal_ip" => "false"
      "extensions" => ""
      "user_ip" => ""
      "intermediary" => ""
    }
  }

  grok {
    match => {
      "message" => [
        '<%{INT}>%{SYSLOGTIMESTAMP:date_time} %{HOSTNAME:prin_hostname} %{DATA}\\[%{INT:pid}\\]:\\s+ (?P<kv_data>category=.*") %{GREEDYDATA:msg}',
        "<%{INT}>%{TIMESTAMP_ISO8601:date_time} %{HOSTNAME:prin_hostname} %{DATA}\\[%{INT:pid}\\]:\\s+%{DATA}/%{DATA}: %{IP:prin_ip} %{GREEDYDATA:msg}",
        "<%{INT:data}>%{SYSLOGTIMESTAMP:date_time}\\s+%{HOSTNAME:prin_hostname}\\s+%{DATA}\\[%{INT:pid}\\]\\:\\s+%{DATA:kv_data}\\s+status\\=%{DATA:status}\\s+%{GREEDYDATA:msg}",

      ]
    }
    overwrite => ["date_time", "prin_hostname", "prin_ip", "msg", "kv_data" , "status"]
    on_error => "grok_failure"
  }

  if [grok_failure] {
    mutate {
      replace => {
        "devname" => ""
        "devid" => ""
        "vd" => ""
        "faclogindex" => ""
        "logid" => ""
        "logdesc" => ""
        "type" => ""
        "subtype" => ""
        "level" => ""
        "user" => ""
        "userip" => ""
        "status" => ""
        "date_time" => ""
        "tz" => ""
        "date" => ""
        "time" => ""
      }
    }
    mutate {
      gsub => ["message", "([A-Za-z0-9]+)=", "#$1="]
    }
    mutate {
      gsub => ["message",'\"',""]
    }
    kv {
      source => "message"
      field_split => "#"
      value_split => "="
      on_error => "not_kv_data"
    }
    if [not_kv_data] {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }

    if [devname] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{devname}"
          "principal.asset.hostname" => "%{devname}"
          "has_principal" => "true"
        }
        on_error => "devname_empty"
      }
    }

    if [devid] != "" {
      mutate {
        replace => {
          "principal.asset.asset_id" => "fort:%{devid}"
        }
        on_error => "devid_empty"
      }
    }

    if [user] == "" and [vd] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{vd}"
          "has_target_user" => "true"
        }
        on_error => "vd_empty"
      }
    }
    else {
      mutate {
        replace => {
          "target.user.user_display_name" => "%{vd}"
        }
        on_error => "vd_empty"
      }
    }

    if [faclogindex] != "" {
      mutate {
        convert => {
          "faclogindex" => "string"
        }
        on_error => "faclogindex_conversion_error"
      }
      mutate {
        replace => {
          "index_label.key" => "faclogindex"
          "index_label.value" => "%{faclogindex}"
        }
        on_error => "faclogindex_empty"
      }
      if ![faclogindex_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "index_label"
          }
          on_error => "index_label_empty"
        }
      }
    }

    if [userip] != "" {
      grok {
        match => {
          "userip" => "%{IP:user_ip}"
        }
        overwrite => ["user_ip"]
        on_error => "userip_grok_failure"
      }
      if ![userip_grok_failure] {
        mutate {
          merge => {
            "principal.ip" => "user_ip"
            "principal.asset.ip" => "user_ip"
          }
          on_error => "userip_empty"
        }
        mutate {
          replace => {
            "has_principal_ip" => "true"
          }
        }
      }
      else {
        mutate {
          replace => {
            "userip_label.key" => "userip"
            "userip_label.value" => "%{userip}"
          }
          on_error => "userip_empty"
        }
        if ![userip_empty] {
          mutate {
            merge => {
              "security_result.detection_fields" => "userip_label"
            }
            on_error => "userip_label_empty"
          }
        }
      }
    }

    if [date] != "" and [time] != "" and [tz] != "" {
      mutate {
        replace => {
          "date_time" => "%{date} %{time} %{tz}"
        }
        on_error => "date_time_empty"
      }
      date {
        match => ["date_time","yyyy-MM-dd HH:mm:ss Z"]
        target => "metadata.event_timestamp"
        on_error => "no_date_time"
      }
    }

    if [logid] != "" {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{logid}"
        }
        on_error => "no_logid"
      }
    }

    if [logdesc] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{logdesc}"
        }
        on_error => "no_desc"
      }
    }

    if [type] != "" {
      mutate {
        replace => {
          "type_label.key" => "Type"
          "type_label.value" => "%{type}"
        }
        on_error => "no_type"
      }
      if ![no_type] {
        mutate {
          merge => {
            "security_result.detection_fields" => "type_label"
          }
          on_error => "type_label_empty"
        }
      }
    }

    if [subtype] != "" {
      mutate {
        replace => {
          "security_result.about.resource.resource_subtype" => "%{subtype}"
        }
        on_error => "no_sub_type"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "Fortinet"
      "metadata.product_name" => "FortiAuthenticator"
    }
  }

  if [msg] != "" {
    grok {
      match => {
        "msg" => ["Added Remote LDAP User: %{NOTSPACE:prin_user}",
        "%{DATA:mesg}\\s+PAG\\s+AD\\s+\\(%{IPV4:prin_ip}\\)%{GREEDYDATA:mesg2}",
        "Sending authentication notification to User\\[%{USERNAME:prin_user}"],
      }
      overwrite => ["prin_user", "prin_ip", "mesg2" , "mesg"]
      on_error => "msg_grok_failure"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", '\\"', ""]
    }
    mutate {
      gsub => ["kv_data", " ([A-Za-z0-9\\s]+)=", "#$1="]
    }

    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "not_kv"
    }
  }

  if [typeid] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{typeid}"
      }
      on_error => "typeid_empty"
    }
  }

  if [prin_user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{prin_user}"
        "has_principal_user" => "true"
      }
      on_error => "prin_user_empty"
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{user}"
        "has_target_user" => "true"
      }
      on_error => "user_empty"
    }
  }

  if [nas] != "" {
    grok {
      match => {
        "nas" => "%{IP:nas_ip}"
      }
      overwrite => ["nas_ip"]
      on_error => "nas_grok_failure"
    }
    if ![nas_grok_failure] {
      mutate {
        merge => {
          "principal.nat_ip" => "nas_ip"
        }
        on_error => "nas_ip_empty"
      }
    }
    else {
      mutate {
        replace => {
          "nas_label.key" => "nas"
          "nas_label.value" => "%{nas}"
        }
        on_error => "nas_empty"
      }
      if ![nas_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "nas_label"
          }
          on_error => "nas_label_empty"
        }
      }
    }
  }

  if [prin_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "prin_ip"
        "principal.asset.ip" => "prin_ip"
      }
      on_error => "prin_ip_empty"
    }
    mutate {
      replace => {
        "has_principal_ip" = "true"
      }
    }
  }

  if [prin_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" = "%{prin_hostname}"
      }
      on_error => "inter_hostname_empty"
    }
  }

  if [msg] != "" {
    mutate {
      replace => {
        "metadata.description" = "%{msg}"
      }
      on_error => "msg_empty"
    }
  }

  if [level] == "warning"  {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [level] == "notice" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [level] in [ "information", "info" ] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [level] == "error" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }

  if [status] == "Success" {
    mutate {
      replace => {
        "sec_action" => "ALLOW"
        "has_user_login" => "true"
      }
    }
  }
  else if [status] == "Failed" {
    mutate {
      replace => {
        "sec_action" => "BLOCK"
        "has_user_logout" => "true"
      }
    }
  }

  if [status] != "" {
    mutate {
      gsub => ["status", '\"', '']
    }
    mutate {
      replace => {
        "security_result.action_details" => "%{status}"
      }
      on_error => "status_empty"
    }
  }

  if [sec_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sec_action"
      }
      on_error => "sec_action_empty"
    }
  }

  if [subcategory] != ""  {
    mutate {
      replace => {
        "security_result.description" => "%{subcategory}"
      }
      on_error => "subcategory_empty"
    }
  }

  if [has_user_login] == "true" and [has_target_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "extensions.auth.type" => "MACHINE"
      }
    }
  }
  else if [has_user_logout] == "true" and [has_target_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGOUT"
        "extensions.auth.type" => "MACHINE"
      }
    }
  }
  else if [has_principal] == "true" and [has_principal_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" or [has_principal_ip] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_target_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "action_label.value.string_value" => "%{action}"
      }
      on_error => "action_empty"
    }
    if ![action_empty] {
      mutate {
        replace => {
          "action_label.key" => "action"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "action_label"
        }
        on_error => "action_label_empty"
      }
    }
  }

  if [category] != "" {
    mutate {
      replace => {
        "category_label.value.string_value" => "%{category}"
      }
      on_error => "category_empty"
    }
    if ![category_empty] {
      mutate {
        replace => {
          "category_label.key" => "category"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "category_label"
        }
        on_error => "category_label_empty"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  # Generate output
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
