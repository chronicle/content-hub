# Product: NETIQ_ACCESS_MANAGER
# Category: Security
# Supported Format: SYSLOG + KV
# Reference: N/A
# Last Updated: 2026-01-22
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "priority"            => ""
      "timestamp"           => ""
      "host"                => ""
      "version"             => ""
      "vendor"              => ""
      "product"             => ""
      "product_version"     => ""
      "event_id"            => ""
      "name"                => ""
      "severity"            => ""
      "extension"           => ""
      "has_principal"       => "false"
      "has_target"          => "false"
      "has_user"            => "false"
      "device_name"         => ""
      "src_ip"              => ""
      "target_ip"           => ""
      "id_sub_event"        => ""
      "result"              => ""
      "dst_ip"              => ""
      "cef_version"         => ""
      "principal"           => ""
      "target"              => ""
      "metadata"            => ""
      "security_result"     => ""
      "host_name"           => ""
      "json_message"        => ""
      "process_name"        => ""
      "A"                   => ""
      "B"                   => ""
      "D"                   => ""
      "F"                   => ""
      "G"                   => ""
      "H"                   => ""
      "I"                   => ""
      "L"                   => ""
      "M"                   => ""
      "O"                   => ""
      "S"                   => ""
      "T"                   => ""
      "U"                   => ""
      "V"                   => ""
      "Y"                   => ""
      "_group_identifier"   => ""
      "1"                   => ""
      "2"                   => ""
      "3"                   => ""
      "event_type"          => ""
      "security_category"   => ""
      "appName"             => ""
      "timeStamp"           => ""
      "eventId"             => ""
      "subTarget"           => ""
      "stringValue1"        => ""
      "stringValue2"        => ""
      "stringValue3"        => ""
      "originator"          => ""
      "intermediary"        => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n"," "]
  }
  mutate {
    gsub => ["message","\\n",""]
  }
  mutate {
    gsub => ["message","<@>","@"]
  }
  mutate {
    gsub => ["message","target","evttarget"]
  }
  grok {
    match => {
        "message" => [
          "<%{INT:priority}>%{TIMESTAMP_ISO8601:timestamp}\\s*%{GREEDYDATA:host}\\s*CEF:\\s*%{INT:cef_version}\\|%{DATA:vendor}\\|%{DATA:product}\\|%{DATA:product_version}\\|%{DATA:event_id}\\|%{DATA:name}\\|%{INT:severity}\\|%{GREEDYDATA:extension}",
          "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host_name} %{DATA:process_name} @%{GREEDYDATA:json_message}@",
          "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host_name} %{GREEDYDATA:json_message}"
        ]
    }
    overwrite => ["priority","timestamp","host","cef_version","vendor","product","product_version","event_id","name","severity","extension","host_name","json_message","process_name"]
    on_error => "format_error"
  }
  json {
    source => "json_message"
    array_function => "split_columns"
    on_error => "json_fail"
  }
  if [timeStamp] != "" {
    mutate {
      replace => {
        "timestamp" => "%{timeStamp}"
      }
      on_error => "timeStamp_error"
    }
  }
  if [A] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{A}"
      }
      on_error => "A_error"
    }
  }
  if [B] != "" {
    mutate {
      replace => {
        "target.resource.id" => "%{B}"
      }
      on_error => "B_error"
    }
  }
  if [D] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{D}"
      }
      on_error => "D_error"
    }
  }
  else if [stringValue3] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{stringValue3}"
      }
      on_error => "stringValue3_error"
    }
  }
  if [F] != "" {
    mutate {
      replace => {
        "principal.application" => "%{F}"
      }
      on_error => "F_error"
    }
  }
  else if [appName] != "" {
    mutate {
      replace => {
        "principal.application" => "%{appName}"
      }
      on_error => "appName_error"
    }
  }
  if [G] != "" {
    mutate {
      replace => {
        "g_label.key" => "G"
        "g_label.value" => "%{G}"
      }
      on_error => "G_error"
    }
    if ![G_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "g_label"
        }
        on_error => "g_label_merge_error"
      }
    }
  }
  if [H] != "" {
    mutate {
      replace => {
        "h_label.key" => "H"
        "h_label.value" => "%{H}"
      }
      on_error => "H_error"
    }
    if ![H_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "h_label"
        }
        on_error => "h_label_merge_error"
      }
    }
  }
  if [I] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{I}"
      }
      on_error => "I_error"
    }
  }
  else if [eventId] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{eventId}"
      }
      on_error => "eventId_error"
    }
  }
  if [L] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{L}"
      }
      on_error => "L_error"
    }
  }
  else if [subTarget] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{subTarget}"
      }
      on_error => "subTarget_error"
    }
  }
  if [M] != "" {
    mutate {
      replace => {
        "m_label.key" => "M"
        "m_label.value" => "%{M}"
      }
      on_error => "M_error"
    }
    if ![M_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "m_label"
        }
        on_error => "m_label_merge_error"
      }
    }
  }
  if [O] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{O}"
      }
      on_error => "O_error"
    }
  }
  if [S] != "" {
    mutate {
      replace => {
        "_group_identifier" => "%{S}"
      }
      on_error => "S_error"
    }
    if ![S_error] {
      mutate {
        merge => {
          "target.user.group_identifiers" => "_group_identifier"
        }
        on_error => "group_identifiers_merge_error"
      }
    }
  }
  if [T] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{T}"
      }
      on_error => "T_error"
    }
  }
  if [U] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{U}"
      }
      on_error => "U_error"
    }
    if ![U_error] {
      mutate {
        replace => {
          "has_user" => "true"
        }
        on_error => "has_user_error"
      }
    }
  }
  if [V] != "" {
    mutate {
      replace => {
        "v_label.key" => "V"
        "v_label.value" => "%{V}"
      }
      on_error => "V_error"
    }
    if ![V_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "v_label"
        }
        on_error => "v_label_merge_error"
      }
    }
  }
  if [Y] != "" {
    mutate {
      replace => {
        "target.url" => "%{Y}"
      }
      on_error => "Y_error"
    }
  }
  mutate {
    replace => {
      "metadata.product_name" => "Netiq_Access_Manager"
      "metadata.vendor_name" => "Netiq"
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "%{vendor}"
    }
    on_error => "vendor_name_error"
  }
    if [product] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{product}"
      }
      on_error => "product_name_error"
    }
  }
  if [product_version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{product_version}"
      }
      on_error => "product_version_error"
    }
  }
  if [event_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{event_id}"
      }
      on_error => "product_log_id_error"
    }
  }
  if [priority] != "" {
    mutate {
      replace => {
        "security_result.priority_details" => "%{priority}"
      }
      on_error => "priority_details_error"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "RFC3339"]
      target => "metadata.event_timestamp"
      on_error => "date_error"
    }
  }
  if [host] != "" {
    mutate{
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "hostname_error"
    }
  }
  else if [originator] != "" {
    mutate{
      replace => {
        "principal.hostname" => "%{originator}"
        "principal.asset.hostname" => "%{originator}"
        "has_principal" => "true"
      }
      on_error => "originator_error"
    }
  }
  if [host_name] != "" {
    mutate{
      replace => {
        "principal.hostname" => "%{host_name}"
        "principal.asset.hostname" => "%{host_name}"
        "has_principal" => "true"
      }
      on_error => "hostname_error"
    }
    mutate {
      replace => {
        "intermediary.hostname" => "%{host_name}"
      }
      on_error => "intermediary_hostname_error"
    }
  }
  if [cef_version] != "" {
    mutate {
      replace => {
        "version.key"       => "CEF"
        "version.value"     => "%{cef_version}"
      }
      on_error => "cef_version_error"
    }
    if ![cef_version_error] {
      mutate {
        merge => {
          "about.resource.attribute.labels"  => "version"
        }
      on_error => "about_labels_merge_error"
     }
    }
  }
  if [name] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{name}"
      }
      on_error => "sr_action_details_error"
    }
  }
  if [severity] != "" {
    if [severity] == "1" {
      mutate {
        replace => {
          "security_result.severity_details" => "TRACE"
        }
        on_error => "sr_sd_trace_error"
      }
    }
    else if [severity] == "2" {
      mutate {
        replace => {
          "security_result.severity_details" => "DEBUG"
        }
        on_error => "sr_sd_debug_error"
      }
    }
    else if [severity] == "4" {
      mutate {
        replace => {
          "security_result.severity_details" => "INFO"
        }
        on_error => "sr_sd_info_error"
      }
    }
    else if [severity] == "6" {
      mutate {
        replace => {
            "security_result.severity_details" => "WARN"
        }
        on_error => "sr_sd_warn_error"
      }
    }
    else if [severity] == "8" {
      mutate {
        replace => {
          "security_result.severity_details" => "ERROR"
        }
        on_error => "sr_sd_error_error"
      }
    }
  }
  grok {
    match => {
        "extension" => [
            "%{DATA}=%{DATA:device_name}\\s+%{DATA}=%{IP:src_ip}%{GREEDYDATA}cs6=%{IP:dst_ip}%{GREEDYDATA}flexString1=%{INT:id_sub_event}%{GREEDYDATA}outcome=%{GREEDYDATA:result}"
        ]
    }
    overwrite => ["device_name","src_ip","target_ip","id_sub_event","result","dst_ip"]
    on_error => "extension_error"
  }
  if [device_name] != "" {
    mutate{
      replace => {
        "target.user.userid" => "%{device_name}"
      }
      on_error => "device_name_error"
    }
  }
  if [device_name] != "" {
    mutate{
      replace => {
          "metadata.product_event_type" => "%{id_sub_event}"
      }
      on_error => "id_sub_event_error"
    }
  }
  if [result] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{result}"
      }
      on_error => "sr_summary_error"
    }
  }
  mutate {
    merge => {
      "event.idm.read_only_udm.about" => "about"
    }
    on_error => "about_labels_merge_error"
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "src_ip_merge_error"
    }
    if ![src_ip_merge_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [dst_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "dst_ip"
        "target.asset.ip" => "dst_ip"
      }
      on_error => "dst_ip_merge_error"
    }
    if ![dst_ip_merge_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [process_name] != "" {
    mutate {
      replace => {
        "target.application" => "%{process_name}"
      }
      on_error => "process_name_error"
    }
  }
  if [stringValue1] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{stringValue1}"
      }
      on_error => "stringValue1_error"
    }
  }
  if [stringValue2] != "" {
    mutate {
      replace => {
        "impersonatee_session_id_label.key" => "impersonatee_session_id"
        "impersonatee_session_id_label.value" => "%{stringValue2}"
      }
      on_error => "stringValue2_error"
    }
    if ![stringValue2_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "impersonatee_session_id_label"
        }
        on_error => "impersonatee_session_id_label_merge_error"
      }
    }
  }
  mutate {
    rename => {
      "1" => "addition.ip_1"
      "2" => "addition.ip_2"
      "3" => "addition.ip_3"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [value] not in ["","0"] {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "key_error"
      }
      mutate {
        replace => {
          "_field.value.string_value" => "%{value}"
        }
        on_error => "value_error"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "_field"
        }
        on_error => "addition_merge_failed"
      }
    }
  }
  if [I] == "" and [eventId] != "" {
    mutate {
      replace => {
        "I" => "%{eventId}"
      }
      on_error => "product_log_id_error"
    }
  }
  if [I] in ["002E0505","002E001E","002E0046"] {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "security_action" => "BLOCK"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
      on_error => "metadata_event_type_error"
    }
    if [security_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_action"
        }
      }
    }
  }
  else if [I] == "002E0525"{
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_UNCATEGORIZED"
        "security_action" => "ALLOW"
      }
      on_error => "metadata_event_type_error"
    }
    if [security_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_action"
        }
      }
    }
  }
  else if [I] in ["002E0007","002E000C"] {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
      on_error => "metadata_event_type_error"
    }
  }
  else if [I] == "002E0045" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "security_action" => "ALLOW"
      }
      on_error => "metadata_event_type_error"
    }
    if [security_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_action"
        }
      }
    }
  }
  else if [has_principal] == "true"  and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sr_merge_error"
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_error"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}


