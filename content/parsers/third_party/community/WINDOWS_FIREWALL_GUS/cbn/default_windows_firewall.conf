# Product: Microsoft Windows Firewall
# Category: Firewall
# Supported Format: Space Separated Value
# Reference: https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-firewall/configure-the-windows-firewall-log
# Last Updated: 2021-08-26
# Copyright 2021 Chronicle LLC

#
# File Header: date time action protocol src-ip dst-ip src-port dst-port size tcpflags tcpsyn tcpack tcpwin icmptype icmpcode info path


filter {

  if [message] =~ /^#/ {
    drop{
      tag => TAG_NO_SECURITY_VALUE
    }
  }

  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp}"
    }
  }

  csv {
    source => "message"
    separator => " "
  }

  mutate{
    rename => {
      "column3"  => "action"
      "column4"  => "protocol"
      "column5"  => "src_ip"
      "column6"  => "dst_ip"
      "column7"  => "src_port"
      "column8"  => "dst_port"
      "column9"  => "size"
      "column10" => "tcpflags"
      "column11" => "tcpsyn"
      "column12" => "tcpack"
      "column13" => "tcpwin"
      "column14" => "icmptype"
      "column15" => "icmpcode"
      "column16" => "info"
      "column17" => "direction"
    }
  }

  # timestamp parsing
  date {
    match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
  }

  # UDM > Metadata
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type"   => "NETWORK_CONNECTION"
      "event.idm.read_only_udm.metadata.vendor_name"  => "Microsoft"
      "event.idm.read_only_udm.metadata.product_name" => "Windows Firewall"
    }
  }

  # UDM > Principal
  mutate {
    merge => {
      "event.idm.read_only_udm.principal.ip" => "src_ip"
    }
  }
  if [src_port] != "-" {
    mutate {
      convert => {
        "src_port" => "integer"
      }
    }
    mutate {
      rename => {
        "src_port" => "event.idm.read_only_udm.principal.port"
      }
    }
  }

  # UDM > Target
  mutate {
    merge => {
      "event.idm.read_only_udm.target.ip" => "dst_ip"
    }
  }
  if [dst_port] != "-" {
    mutate {
      convert => {
        "dst_port" => "integer"
      }
    }
    mutate {
      rename => {
        "dst_port" => "event.idm.read_only_udm.target.port"
      }
    }
  }

  # UDM > Network
  if [protocol] != "-" and [protocol] in ["TCP", "UDP", "ICMP"]{
    mutate {
      rename => {
        "protocol" => "event.idm.read_only_udm.network.ip_protocol"
      }
    }
  }
  if [size] != "-" {
    mutate {
      convert => {
        "size" => "uinteger"
      }
    }
  }
  if [direction] == "SEND" or [direction] == "FORWARD"{
    if [size] != "-" {
      mutate {
        rename => {
          "size" => "event.idm.read_only_udm.network.sent_bytes"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "OUTBOUND"
      }
    }
  } else if [direction] == "RECEIVE" {
    if [size] != "-" {
      mutate {
        rename => {
          "size" => "event.idm.read_only_udm.network.received_bytes"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "INBOUND"
      }
    }
  }

  # UDM > Security Result
  if [action] == "INFO-EVENTS-LOST" {
    drop{
      tag => "TAG_MALFORMED_MESSAGE"
    }
  } else if [action] == "DROP" {
    mutate {
      replace => {
        "sr_action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "sr.action" => "sr_action"
      }
    }
  } else if [action] == "ALLOW" {
    mutate {
      merge => {
        "sr.action" => "action"
      }
    }
  }

  if [info] != "-" {
    mutate {
      rename => {
        "info" => "sr.summary"
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "sr"
    }
  }

  # UDM > About > Labels
  if [tcpflags] != "-" {
    mutate {
      replace => {
        "labels1.key"   => "tcpflags"
        "labels1.value" => "%{tcpflags}"
      }
    }
    mutate {
      merge => {
        "about.labels" => "labels1"
      }
    }
  }

  if [tcpsyn] != "-" {
    mutate {
      replace => {
        "labels2.key"   => "tcpsyn"
        "labels2.value" => "%{tcpsyn}"
      }
    }
    mutate {
      merge => {
        "about.labels" => "labels2"
      }
    }
  }

  if [tcpack] != "-" {
    mutate {
      replace => {
        "labels3.key"   => "tcpack"
        "labels3.value" => "%{tcpack}"
      }
    }
    mutate {
      merge => {
        "about.labels" => "labels3"
      }
    }
  }

  if [tcpwin] != "-" {
    mutate {
      replace => {
        "labels4.key"   => "tcpwin"
        "labels4.value" => "%{tcpwin}"
      }
    }
    mutate {
      merge => {
        "about.labels" => "labels4"
      }
    }
  }

  if [icmptype] != "-" {
    mutate {
      replace => {
        "labels5.key"   => "icmptype"
        "labels5.value" => "%{icmptype}"
      }
    }
    mutate {
      merge => {
        "about.labels" => "labels5"
      }
    }
  }

  if [icmpcode] != "-" {
    mutate {
      replace => {
        "labels6.key"   => "icmpcode"
        "labels6.value" => "%{icmpcode}"
      }
    }
    mutate {
      merge => {
        "about.labels" => "labels6"
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.about" = "about"
    }
    on_error => "_not_labels_set"
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
