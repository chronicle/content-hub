# Product: SAP Hana
# Category: Database log types
# Supported Format: CSV
# Reference: N/A
# Last Updated: 2026-02-19
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "event_timestamp_str" => ""
      "csv_data" => ""
      "principal_IP" => ""
      "target_IP" => ""
      "has_target_resource" => "false"
    }
  }
  grok {
    match => {
      "message" => "%{GREEDYDATA:csv_data}"
    }
    overwrite => ["csv_data"]
    on_error => "grok_failed_for_csv"
  }
  if [csv_data] != "" {
    csv {
      source => "csv_data"
      separator => ","
      on_error => "csv_failure"
    }
  }
  mutate {
    rename => {
      "column1" => "system_id"
      "column2" => "principal_hostname"
      "column4" => "date"
      "column5" => "time"
      "column6" => "sap_client"
      "column7" => "principal_userid"
      "column8" => "application"
      "column10" => "principal_ip"
      "column11" => "target_ip"
      "column12" => "message_id"
      "column13" => "program_name"
      "column14" => "description"
      "column16" => "object_name"
    }
  }
  if [date] != "" and [time] != "" {
    mutate {
      replace => {
        "event_timestamp_str" => "%{date} %{time}"
      }
      on_error => "timestamp_combine_failed"
    }
    if ![timestamp_combine_failed] {
      date {
        match => [ "event_timestamp_str", "dd.MM.yyyy HH:mm:ss" ]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "timestamp_parse_failed"
      }
    }
  }
  if [principal_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{principal_hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{principal_hostname}"
      }
      on_error => "principal_hostname_not_found"
    }
    if ![principal_hostname_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [principal_userid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{principal_userid}"
      }
      on_error => "principal_userid_not_found"
    }
    if ![principal_userid_not_found] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }
  if [application] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{application}"
      }
      on_error => "application_not_found"
    }
  }
  if [principal_ip] != "" {
    grok {
      match => {
        "principal_ip" => "%{IP:principal_IP}"
      }
      overwrite => ["principal_IP"]
      on_error => "principal_ip_empty"
    }
    if ![principal_ip_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "principal_IP"
          "event.idm.read_only_udm.principal.asset.ip" => "principal_IP"
        }
        on_error => "principal_ip_not_found"
      }
      if ![principal_ip_not_found] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [target_ip] != "" {
    grok {
      match => {
        "target_ip" => "%{IP:target_IP}"
      }
      overwrite => ["target_IP"]
      on_error => "target_ip_empty"
    }
    if ![target_ip_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "target_IP"
          "event.idm.read_only_udm.target.asset.ip" => "target_IP"
        }
        on_error => "target_ip_not_found"
      }
      if ![target_ip_not_found] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [message_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{message_id}"
      }
      on_error => "message_id_not_found"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "description_not_found"
    }
  }
  if [object_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{object_name}"
      }
      on_error => "object_name_not_found"
    }
    if ![object_name_not_found] {
      mutate {
        replace => {
          "has_target_resource" => "true"
        }
      }
    }
  }
  mutate {
    rename => {
      "program_name" => "addition.program_name"
      "sap_client" => "addition.sap_client"
      "system_id" => "addition.system_id"
    }
  }
  for key1,value1 in addition map {
    mutate {
      replace => {
        "field1" => ""
        "check" => ""
      }
    }
    mutate {
      convert => {
        "value1" => "string"
      }
      on_error => "value1_string"
    }
    mutate {
      replace => {
        "check" => "%{value1}"
      }
      on_error => "check_empty"
    }
    if ![check_empty] && [check] != "" {
      mutate {
        replace => {
          "field1.key" => "%{key1}"
        }
        on_error => "key1_empty"
      }
      if [key1] in ["sap_client", "system_id"] {
        mutate {
          replace => {
            "field1.value" => "%{value1}"
          }
          on_error => "value_not_found_principal"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "field1"
          }
          on_error => "principal_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "field1.value.string_value" => "%{value1}"
          }
          on_error => "value_not_found_additional"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field1"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }
  if [has_principal] == "true" && [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_target_resource] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "SAP"
      "event.idm.read_only_udm.metadata.product_name" => "SAP_HANA"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
