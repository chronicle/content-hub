# Product: Windows Application Loacker
# Category: Application Locker
# Supported Format: SYSLOG + KV + JSON + XML
# Reference: https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/applocker/using-event-viewer-with-applocker
# Last Updated: 2023-10-17
# Copyright 2022 Chronicle LLC

filter {
  mutate {
    replace => {
      "message1" => ""
      "sourceName" => ""
      "timezone" => ""
      "RuleAndFileData" => ""
      "event_type" => "GENERIC_EVENT"
      "UserID" => ""
      "filePath" => ""
      "udm_event_type" => ""
      "json_data" => ""
      "ProcessID" => ""
      "xml" => ""
      "xml_data" => ""
      "is_not_xml" => "false"
    }
  }
  mutate {
    convert => {
      "is_not_xml" => "boolean"
    }
  }
  mutate {
    gsub => ["message", "[\\r\\n\\t]*", ""]
  }
  grok {
    match => {
      "message" => [
        "(?P<kv_data>(?P<event_time>.*?)(?P<message>\\\w+=\\\".*\\\w+=\\\".*?\\\")(\\\]$?) %{GREEDYDATA:message1})"
        "(?P<kv_data>(?P<event_time>.*?)(?P<message>\\\w+=\\\".*))"
        "<%{INT}>(?P<event_time>.*?): %{GREEDYDATA:json_data}"
        "<Event>%{GREEDYDATA:xml}</Event>"
      ]
    }
    overwrite => ["message", "message1", "json_data", "xml"]
    on_error => "_"
  }
  # Extract timestamp and hostname from syslog header.
  grok {
    match => {
      "event_time" => [
        ".* %{TIMESTAMP_ISO8601:syslog_ts} %{DATA:syslog_host} %{DATA:sourceName} "
        "%{TIMESTAMP_ISO8601:syslog_ts} %{DATA:syslog_host} %{WORD:severity}"
        "%{SYSLOGTIMESTAMP:syslog_ts} %{SYSLOGHOST:syslog_host} %{DATA:sourceName}\\[%{INT}\\]"
        "%{SYSLOGTIMESTAMP:syslog_ts} %{SYSLOGHOST:syslog_host}"
      ]
    }
    overwrite => ["sourceName"]
    on_error => "no_header"
  }
  grok {
    match => {
      "syslog_host" => "%{IP:principal_ip1}"
    }
    on_error => "no_principal_ip1"
  }
  if [no_principal_ip1] {
    mutate {
      rename => {
        "syslog_host" => "Hostname"
      }
    }
  }
  else if [principal_ip1] not in [ "", "-" ] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "principal_ip1"
      }
      on_error => "_"
    }
  }
  grok {
    match => {
      "syslog_ts" => "%{TIMESTAMP_ISO8601:syslog_ts}%{ISO8601_TIMEZONE:timezone}"
    }
    overwrite => [ "syslog_ts", "timezone" ]
    on_error => "_"
  }
  date {
    match => ["syslog_ts", "yyyy-MM-ddTHH:mm:ss Z"]
    on_error => "_"
  }
  if [message] != "" {
    mutate {
      gsub => ["message", " ([a-zA-Z0-9]+(.[a-zA-Z0-9]+)?=)", "#$1"]
    }
  }
  if [xml] != "" {
    mutate {
      replace => {
        "xml_data" => "<Event>%{xml}</Event>"
      }
      on_error => "is_not_xml"
    }
  }
  if ![is_not_xml] {
    xml {
      source => "xml_data"
      xpath => {
        "/Event/EventID" => "EventID"
        "/Event/EventTime" => "EventTime"
        "/Event/Hostname" => "Hostname"
        "/Event/EventType" => "EventType"
        "/Event/Severity" => "Severity"
        "/Event/SeverityValue" => "SeverityValue"
        "/Event/SourceName" => "SourceName"
        "/Event/ProviderGuid" => "ProviderGuid"
        "/Event/Version" => "Version"
        "/Event/Task" => "Task"
        "/Event/OpcodeValue" => "OpcodeValue"
        "/Event/RecordNumber" => "RecordNumber"
        "/Event/ProcessID" => "ProcessID"
        "/Event/ThreadID" => "ThreadID"
        "/Event/Channel" => "Channel"
        "/Event/Domain" => "Domain"
        "/Event/AccountName" => "AccountName"
        "/Event/UserID" => "UserID"
        "/Event/AccountType" => "AccountType"
        "/Event/Message" => "Message"
        "/Event/Opcode" => "Opcode"
        "/Event/EventReceivedTime" => "EventReceivedTime"
        "/Event/SourceModuleName" => "SourceModuleName"
        "/Event/SourceModuleType" => "SourceModuleType"
      }
      on_error => "xml_parsing_failed"
    }
  }
  if [xml_parsing_failed] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  if [json_data] != "" {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "not_json"
    }
  }
  kv {
    source => "message"
    field_split => "#"
    value_split => "="
    trim_value => "\""
    on_error => "not_kv"
  }
  # Drop logs which are not in KV format.
  if [not_kv] and [not_json]{
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  mutate {
    convert => {
      "EventID" => "integer"
    }
  }
  if [EventID] in [ 8002,8005, 8006, 8020 ] {
    mutate {
      replace => {
        "event_type" => "PROCESS_OPEN"
      }
    }
    if [ProcessID] != "" {
      mutate {
        convert => {
          "ProcessID" => "string"
        }
        on_error => "already_string"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{ProcessID}"
        }
      }
    }
    if [RuleAndFileData] != "" {
      if [RuleAndFileData][RuleId] != "" {
        mutate {
          gsub => ["RuleAndFileData.RuleId", "[{}]", ""]
        }
      }
      mutate {
        rename => {
          "RuleAndFileData.FullFilePath" => "event.idm.read_only_udm.target.process.file.full_path"
          "RuleAndFileData.TargetProcessId" => "event.idm.read_only_udm.target.process.pid"
          "RuleAndFileData.RuleId" => "security_result.rule_id"
          "RuleAndFileData.RuleName" => "security_result.rule_name"
          "RuleAndFileData.PolicyName" => "security_result.summary"
        }
      }
      mutate {
        replace => {
          "ssdl.key" => "Security Descriptor Definition Language"
          "ssdl.value" => "%{RuleAndFileData.RuleSddl}"
        }
        on_error => "no_old_sddl"
      }

      if ![no_old_sddl] {
        mutate {
          merge => {
            "security_result.about.labels" => "ssdl"
          }
        }
      }
    } else {
      if [message1] =~ "allowed to run" {
        grok {
          match => {
            "message1" => "(?:\\s|)%{DATA:filePath} %{GREEDYDATA:desc}"
          }
          overwrite => ["filePath"]
          on_error => "no_file_path"
        }
        if ![no_file_path] {
          mutate {
            rename => {
              "filePath" => "event.idm.read_only_udm.target.process.file.full_path"
            }
          }
        }
      }
    }
  }
  if [ProviderGuid] != "" {
    mutate {
      gsub => ["ProviderGuid", "[{}]", ""]
    }
  }
  if [RuleAndFileData] == "" {
    mutate {
      replace => {
        "security_result.rule_name" => "EventID: %{EventID}"
      }
      on_error => "_"
    }
  }
  mutate {
    convert => {
      "ThreadID" => "string"
    }
    on_error => "already_string"
  }
  mutate {
    rename => {
      "Hostname" => "event.idm.read_only_udm.principal.hostname"
       "AccountName" => "event.idm.read_only_udm.principal.user.userid"
       "SourceModuleType" => "event.idm.read_only_udm.observer.application"
       "UserID" => "event.idm.read_only_udm.target.user.userid"
       "Domain" => "event.idm.read_only_udm.principal.administrative_domain"
       "ProviderGuid" => "event.idm.read_only_udm.target.resource.product_object_id"
       "ThreadID" => "security_result.threat_id"
    }
  }
  if [message1] =~ "allowed to run" {
    mutate {
      replace => {
        "security_action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "security_action"
      }
    }
  }
  mutate {
    replace => {
      "roles.name" => "%{AccountType}"
    }
    on_error => "value_not_present"
  }
  if ![value_not_present] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.attribute.roles" => "roles"
      }
      on_error => "_"
    }
  }
  mutate {
    replace => {
      "security_result.description" => "%{message1}"
    }
  }
  if [EventType] == "INFO" or [EventType] == "Informational" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  } else if [EventType] == "ERROR" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  } else if [EventType] == "WARNING" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
       "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  mutate {
    convert => {
      "EventID" => "string"
    }
    on_error => "already_string"
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Microsoft"
      "event.idm.read_only_udm.metadata.product_name" => "%{sourceName}"
      "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{EventID}"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
