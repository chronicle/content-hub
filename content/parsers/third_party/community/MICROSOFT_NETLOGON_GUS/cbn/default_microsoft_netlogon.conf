# Product: MICROSOFT_NETLOGON
# Category: Authentication
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2024-12-24
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "ts" => ""
      "session_id" => ""
      "product_event_type" => ""
      "description" => ""
      "userid" => ""
      "src_host" => ""
      "domain" => ""
      "src_ip" => ""
      "principal" => ""
      "network" => ""
      "target" => ""
      "metadata.event_type" => "GENERIC_EVENT"
    }
  }

  grok {
    match => {
      "message" => [
        "(?P<ts>%{INT}/%{INT} %{TIME}) \\[%{WORD:product_event_type}\\] \\[%{INT:session_id}\\] %{DATA:description}$"
      ]
    }
    overwrite => ["ts", "session_id", "product_event_type", "description"]
    on_error => "syslog_error"
  }

  if [ts] != "" {
    date {
      match => ["ts", "M/dd HH:mm:ss", "MM/dd HH:mm:ss", "M/d HH:mm:ss", "MM/d HH:mm:ss"]
      rebase => true
      on_error => "no_ts"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "domainController" => ""
      }
    }
    grok {
      match => {
        "description" => [
          ".*\\[%{GREEDYDATA:domainController}]"
        ]
      }
      overwrite => ["domainController"]
      on_error => "no_domainController"
    }

    if [domainController] != "" {
      mutate {
        replace => {
          "principal.administrative_domain" => "%{domainController}"
        }
        on_error => "no_domainController"
      }
    }
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  if [product_event_type] == "MAILSLOT" {
    grok {
      match => {
        "description" => [
          "from %{DATA:userid}\\(.*? %{HOSTNAME:src_host}"
          "to %{DATA:userid} "
          "%{IP:src_ip}"
        ]
      }
      overwrite => ["userid", "src_host","src_ip"]
      on_error => "no_domain"
    }
  }
  else if [product_event_type] == "LOGON" {
    grok {
      match => {
        "description" => [
          "Transitive Network logon of %{DATA:userid}\\\\%{DATA:domain} from %{HOSTNAME:src_host}",
          "MsvAvNbDomainName:'%{DATA:domain}' MsvAvDnsDomainName:'%{HOSTNAME:src_host}"
        ]
      }
      overwrite => ["userid", "domain", "src_host"]
      on_error => "no_domain"
    }
  }

  if [session_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{session_id}"
      }
      on_error => "no_session_id"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "no_product_event_type"
    }
  }

  if [domain] != "" {
    mutate {
      replace => {
        "target.administrative_domain" => "%{domain}"
      }
      on_error => "no_domain"
    }
  }

  if [src_host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{src_host}"
        "principal.asset.hostname" => "%{src_host}"
        "metadata.event_type" => "STATUS_UPDATE"
      }
      on_error => "no_src_host"
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "no_src_ip"
    }
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [userid] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{userid}"
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "no_userid"
    }
  }

  if [product_event_type] == "LOGON" and [userid] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  # statedump{}
  mutate{
    replace => {
      "metadata.product_name" => "MICROSOFT_NETLOGON"
      "metadata.vendor_name" => "MICROSOFT_NETLOGON"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
