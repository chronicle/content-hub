# Product: DNS_SINKHOLE
# Category: Server Mqnagement
# Supported Format: Syslog+KV
# Reference : N/A
# Last Updated: 2022-11-21
# Copyright 2022 Chronicle LLC


filter {

  mutate {
    gsub => ["message", "\"", ""]
  }

  mutate {
    gsub => ["message", "(\\d{4}-\\d{2}-\\d{2})", "\",\"$1"]
  }

  mutate {
    gsub => ["message", "^\",\"", ""]
  }

  mutate {
    replace => {
      "message" => "{\"messages\":[\"%{message}\"]}"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  for msg in messages {
    mutate {
      replace => {
        "event" => ""
        "Path" => ""
        "Host" => ""
        "Connection" => ""
        "security_result" => ""
        "User-Agent" => ""
        "Accept-Encoding" => ""
        "user_name" => ""
        "method" => ""
        "Referer" => ""
        "kv_data" => ""
        "summary" => ""
        "src_ip" => ""
        "src_port" => ""
        "temp" => ""
        "severity" => ""
        "dst_ip" => ""
        "timestamp" => ""
      }
    }

     mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.product_name" => "DNS_SINKHOLE"
        "event.idm.read_only_udm.metadata.vendor_name" => "DNS_SINKHOLE"
      }
    }

    grok {
      match => {
        "msg" => ["%{TIMESTAMP_ISO8601:timestamp},%{INT} - %{USERNAME:user_name} - %{DATA:severity} - %{WORD:method}%{DATA},( \\(\\'%{IP:src_ip}\\', %{INT:src_port}\\):%{NOTSPACE:summary})?%{SPACE}%{GREEDYDATA:kv_data}",
                  "%{GREEDYDATA:kv_data}"
                 ]
      }
      overwrite => ["user_name", "severity", "method", "src_ip", "src_port", "kv_data", "summary", "Path", "temp", "date", "timestamp"]
    }

    if [timestamp] != "" {
      date {
        match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
        on_error => "timestamp_not_present"
      }
    }

    if [kv_data] != "" {
      mutate {
        gsub => [ "kv_data", "([A-Za-z_-]+):", "#$1:" ]
      }
      mutate {
        gsub => [ "kv_data", "#http", "http" ]
      }
      kv {
        source => "kv_data"
        value_split => ": "
        field_split => "#"
      }
    }

    if [Host] != "" {
      grok {
        match => {
          "Host" => ["%{IP:dst_ip}"]
        }
        overwrite => ["dst_ip"]
        on_error => "not_dst_ip"
      }
      if ![not_dst_ip] {
        mutate {
          merge => {
              "event.idm.read_only_udm.target.ip" => "dst_ip"
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{Host}"
          }
        }
      }
    }


    if [Host]!= "" and [src_ip] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [user_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }

    if [severity] != "" {
      if [severity] in ["ERROR", "CRITICAL"] {
        mutate {
          replace => {
            "security_result.severity" => "%{severity}"
          }
        }
      } else if [severity] == "INFO" {
         mutate {
          replace => {
            "security_result.severity" => "INFORMATIONAL"
          }
        }
      } else if [severity] == "MINOR" {
         mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      } else if [severity] == "WARNING" {
         mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      }
    }

    if [src_ip] != ""  {
      mutate {
        merge => {
            "event.idm.read_only_udm.principal.ip" => "src_ip"
        }
      }
    }
    if [src_port] != ""  {
      mutate {
        convert => {
            "src_port" => "integer"
        }
      }
      mutate {
        rename => {
            "src_port" => "event.idm.read_only_udm.principal.port"
        }
      }
    }

    if [Referer] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{Referer}"
        }
      }
    }

    if [Path] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{Path}"
        }
      }
    }

    if [summary] != "" {
      mutate {
        replace => {
        "security_result.summary" => "%{summary}"
        }
      }
    }

    if [Accept-Encoding] != ""{
      mutate {
        replace => {
          "accept_encoding_label.key" => "Accept-Encoding"
          "accept_encoding_label.value" => "%{Accept-Encoding}"
        }
        merge => {
          "security_result.about.labels" => "accept_encoding_label"
        }
      }
    }

    if [User-Agent] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{User-Agent}"
        }
      }
    }

    if [user_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
        }
      }
    }

    if [method] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{method}"
        }
      }
    }

    mutate {
      replace => {
        "accept_language_label.value" => "%{Accept-Language}"
      }
      on_error => "no_accept_language"
     }

    if ![no_accept_language] {
      mutate {
        replace => {
          "accept_language_label.key" => "Accept-Language"
        }
        merge => {
          "security_result.about.labels" => "accept_language_label"
        }
      }
    }

    if [Connection] != "" {
      mutate {
        replace => {
          "connection_label.key" => "Connection"
          "connection_label.value" => "%{Connection}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "connection_label"
        }
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
