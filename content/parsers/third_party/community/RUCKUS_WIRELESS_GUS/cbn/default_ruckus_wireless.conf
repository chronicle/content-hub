# Product: RUCKUS
# Category: Wireless
# Supported Format: SYSLOG + KV
# Reference: https://docs.cloud.ruckuswireless.com/LTE/GUID-22F36FBD-8D66-474E-BE69-1875CEAC9DC6.html
# Last Updated: 2025-10-31
# Copyright 2025 Google SecOps
filter {
  mutate {
    replace => {
      "event_type" => ""
      "msg" => ""
      "process" => ""
      "process_id" => ""
      "prin_host" => ""
      "prin_resource" => ""
      "ping_status" => ""
      "serial" => ""
      "pwd" => ""
      "user" => ""
      "cmd_line" => ""
      "prin_user" => ""
      "prin_cmd_line" => ""
      "radio" => ""
      "rogueMac" => ""
      "ssid" => ""
      "wlanId" => ""
      "zoneUUID" => ""
      "apLocation" => ""
      "apMac" => ""
      "apName" => ""
      "principal" => ""
      "target_mac" => ""
      "kv_data" => ""
      "additional_field" => ""
      "company_name" => ""
      "hostapd" => ""
      "network_interface" => ""
      "dst_mac" => ""
      "auth_status" => ""
      "security_result" => ""
      "description" => ""
      "severity" => ""
      "summary" => ""
      "ip" => ""
      "type" => ""
      "uid" => ""
      "auid" => ""
      "ses" => ""
      "subj" => ""
      "pam_msg" => ""
      "op" => ""
      "grantors" => ""
      "acct" => ""
      "exe" => ""
      "res" => ""
      "cmd" => ""
      "sequenceId" => ""
      "audit_msg" => ""
      "t_user" => ""
      "p_user" => ""
      "t_uid" => ""
      "p_uid" => ""
      "cwd" => ""
      "event_name" => ""
      "src_ip" => ""
      "auth_type" => ""
      "t_host" => ""
      "auth_method" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "has_target_user" => "false"
      "event.idm.read_only_udm.metadata.vendor_name" => "RUCKUS"
      "event.idm.read_only_udm.metadata.product_name" => "RUCKUS_WIRELESS"
     }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>1 %{TIMESTAMP_ISO8601:event_time} %{NOTSPACE:prin_host} Core - - - @@%{INT},%{DATA:event_name},%{GREEDYDATA:kv_data}",
        "%{TIMESTAMP_ISO8601:event_time} %{DATA:prin_host} type=%{DATA:type} - - \\[meta sequenceId=%{DATA}%{INT:sequenceId}%{DATA}\\] msg=%{GREEDYDATA:audit_msg}",
        "<%{INT}>1 %{TIMESTAMP_ISO8601:event_time} %{NOTSPACE:prin_host} (?P<process>sudo) %{INT:process_id} - \\[%{DATA} sequenceId=%{DATA}%{INT:sequenceId}%{DATA}\\]\\s+%{WORD:prin_user} : PWD=%{DATA:pwd} ; USER=%{DATA:user} ; COMMAND=%{GREEDYDATA:cmd_line}",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:event_time} %{DATA:prin_host} (?P<process>sudo) %{INT:process_id} - \\[%{DATA} sequenceId=%{DATA}%{INT:sequenceId}%{DATA}\\] *%{DATA} ?: PWD=%{DATA:pwd} ; USER=%{DATA:user} ; COMMAND=%{GREEDYDATA:cmd_line}",
        "<%{INT}>1 %{TIMESTAMP_ISO8601:event_time} %{NOTSPACE:prin_host} sudo - - - %{DATA:prin_user} : TTY=%{DATA} ; PWD=%{DATA:pwd} ; USER=%{DATA:user} ; COMMAND=%{GREEDYDATA:cmd_line}",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:event_time} %{DATA:prin_host} (?P<process>CROND) %{INT:process_id} - \\[%{DATA} sequenceId=%{DATA}%{INT:sequenceId}%{DATA}\\] \\(%{DATA:user}\\) CMD \\(%{DATA:cmd_line}\\).*",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:event_time} %{DATA:prin_host} %{WORD:process} %{INT:process_id} - \\[%{DATA} sequenceId=%{DATA}%{INT:sequenceId}%{DATA}\\] %{GREEDYDATA:msg}",
        "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:prin_host} %{WORD:process}: .* TTY=%{DATA:tty} .*PWD=%{DATA:pwd} .*%{DATA:user} .*COMMAND=%{DATA:cmd_line} .*",
        "%{SYSLOGTIMESTAMP:event_time} %{DATA:company_name} %{DATA:severity} hostapd: (?P<hostapd>%{DATA:network_interface}: %{NOTSPACE} %{MAC:dst_mac} %{DATA:auth_status}: %{DATA}: %{DATA}: %{GREEDYDATA:description})",
        "%{SYSLOGTIMESTAMP:event_time} %{DATA:company_name} %{DATA:severity} %{DATA:process}\\[%{DATA:process_id}\\]: %{DATA} UE\\[%{MAC:dst_mac}\\]\\[%{DATA:network_interface}\\] %{GREEDYDATA:description}",
        "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:prin_host} %{WORD:process}: .* serial80=%{GREEDYDATA:serial}",
        "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:prin_host} %{WORD:process}(\\[%{INT:process_id}\\]|): %{GREEDYDATA:msg}"
        "%{SYSLOGTIMESTAMP:event_time} %{DATA:company_name} %{DATA:severity} %{DATA:process}\\[%{DATA:process_id}\\]: %{GREEDYDATA:description}"
        "%{SYSLOGTIMESTAMP:event_time} %{DATA:company_name} %{DATA:severity} %{DATA:process}:\\s?(\\[%{DATA}\\] )?%{GREEDYDATA:description}"
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:event_time} %{DATA:prin_host} %{DATA:company_name} %{INT:process_id} %{WORD} %{WORD:process}: %{GREEDYDATA:summary} %{WORD} %{IP:ip} %{WORD:severity}: %{GREEDYDATA:description}"
        "<%{INT}>1 %{TIMESTAMP_ISO8601:event_time} %{DATA:prin_host} %{DATA:process} ?(%{INT:process_id}|-)? - (%{DATA}|-)(\\]| ) %{GREEDYDATA:description}",
      ]
    }
    overwrite => ["msg","process","process_id","prin_host","event_time","serial","pwd","user","cmd_line", "company_name", "hostapd", "network_interface", "dst_mac", "auth_status", "description", "severity" , "summary" , "ip", "type", "sequenceId", "audit_msg", "t_user", "p_user", "event_name", "prin_user", "kv_data"]
    on_error => "grok_failure"
  }
  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "=\\\"", "=\""]
    }
    kv {
      source => "kv_data"
      field_split => ","
      value_split => "="
      trim_value => "\""
      on_error => "kv_data_failure"
    }
  }
  if [process] == 'sudo' and [msg] =~ "pam_unix" {
    grok {
      match => {
        "msg" => [
          "pam_unix\\(sudo:session\\): session closed for user %{DATA:t_user}",
          "pam_unix\\(sudo:session\\): session opened for user %{DATA:t_user} by \\(uid=%{INT}\\)"
        ]
      }
      overwrite => ["t_user"]
      on_error => "sudo_pam_grok_failed"
    }
    if not [sudo_pam_grok_failed] {
      if [msg] =~ "session opened" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{t_user}"
            "has_target" => "true"
          }
          on_error => "target_user_id_not_found"
        }
        if ![target_user_id_not_found] and [has_target] == "true" {
          mutate {
            replace => {
              "event_type" => "USER_LOGIN"
              "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
            }
          }
        }
      } else if [msg] =~ "session closed" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{t_user}"
            "has_target" => "true"
          }
          on_error => "target_user_id_not_found_for_logout"
        }
        if ![target_user_id_not_found_for_logout] and [has_target] == "true" {
          mutate {
            replace => {
              "event_type" => "USER_LOGOUT"
              "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
            }
          }
        }
      }
    }
  }
  else if [msg] =~ "pam_unix" {
    grok {
      match => {
        "msg" => [
          "(?P<auth_method>pam_unix)\\(.+?\\): session opened for user %{DATA:t_user}\\(uid=%{INT:t_uid}\\) by %{WORD:p_user}\\(uid=%{INT:p_uid}\\).*"
        ]
      }
      overwrite => ["t_user", "p_user", "t_uid", "p_uid", "auth_method"]
      on_error => "pam_session_grok_failed"
    }
    if not [pam_session_grok_failed] {
      if [auth_method] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.extensions.auth.auth_details" => "%{auth_method}"
          }
          on_error => "auth_method_empty"
        }
      }
      if [t_user] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{t_user}"
            "has_target" => "true"
          }
          on_error => "target_user_id_not_found_for_pam_session"
        }
        if ![target_user_id_not_found_for_pam_session] and [has_target] == "true" {
          mutate {
            replace => {
              "event_type" => "USER_LOGIN"
              "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
            }
          }
        }
        mutate {
          convert => {
            "t_uid" => "string"
          }
          on_error => "t_uid_already_string"
        }
        mutate {
          replace => {
            "target_uid_label.key" => "uid"
            "target_uid_label.value" => "%{t_uid}"
          }
          on_error => "t_uid_not_found"
        }
        if ![t_uid_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.user.attribute.labels" => "target_uid_label"
            }
          }
        }
      }
      if [p_user] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{p_user}"
            "has_principal" => "true"
          }
          on_error => "p_user_not_found"
        }
        mutate {
          convert => {
            "p_uid" => "string"
          }
          on_error => "p_uid_already_string"
        }
        mutate {
          replace => {
            "principal_uid_label.key" => "uid"
            "principal_uid_label.value" => "%{p_uid}"
          }
          on_error => "p_uid_not_found"
        }
        if ![p_uid_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.user.attribute.labels" => "principal_uid_label"
            }
          }
        }
      }
    }
  }

  if [sequenceId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{sequenceId}"
      }
      on_error => "sequenceId_invalid"
    }
  }

  if [type] != "" {
    grok {
      match => {
        "audit_msg" => [
          "audit\\(%{DATA}\\): pid=%{INT:process_id} uid=%{INT:uid} auid=%{DATA:auid} ses=%{DATA:session_id} subj=%{DATA:subj} msg='(?P<pam_msg>.*)"
        ]
      }
      overwrite => ["process_id", "uid", "auid", "session_id", "subj", "pam_msg"]
      on_error => "audit_msg_grok_failure"
    }
    if [type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
        }
        on_error => "type_not_found"
      }
    }
    if not [audit_msg_grok_failure] {
      mutate {
        gsub => ["pam_msg", "'\\r", ""]
      }
      mutate {
        gsub => ["pam_msg", "'$", ""]
      }
      mutate {
        gsub => ["pam_msg", '\\\"', ""]
      }
      mutate {
        gsub => ["pam_msg", "=\\?", "=null"]
      }
      kv {
        source => "pam_msg"
        field_split => " "
        value_split => "="
        whitespace => "strict"
        on_error => "pam_kv_failure"
      }
      if [auid] != "" {
        mutate {
          replace => {
            "principal_user_audit_uid_label.key" => "auid"
            "principal_user_audit_uid_label.value" => "%{auid}"
          }
          on_error => "auid_label_not_found"
        }
        if ![auid_label_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.user.attribute.labels" => "principal_user_audit_uid_label"
            }
            on_error => "auid_label_merge_failed"
          }
        }
      }
      if [subj] != "" {
        mutate {
          replace => {
            "subj_label.key" => "subj"
            "subj_label.value" => "%{subj}"
          }
          on_error => "subj_label_not_found"
        }
        if ![subj_label_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.user.attribute.labels" => "subj_label"
            }
            on_error => "subj_merge_failed"
          }
        }
      }
      if [op] != "" {
        mutate {
          replace => {
            "security_result.action_details" => "%{op}"
          }
          on_error => "op_invalid"
        }
      }
      if [grantors] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.extensions.auth.auth_details" => "%{grantors}"
          }
          on_error => "grantors_invalid"
        }
      }
      if [cwd] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.process.file.full_path" => "%{cwd}"
          }
          on_error => "cwd_invalid"
        }
      }

      if [type] == "USER_CMD" and [cmd] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.command_line" => "%{cmd}"
          }
        }
      }

      if [res] == "success" {
        mutate {
          replace => {
            "security_action_var" => "ALLOW"
          }
        }
        mutate {
          merge => {
            "security_result.action" => "security_action_var"
          }
        }
      } else if [res] != "" and [res] != "null" {
         mutate {
          replace => {
            "security_action_var" => "BLOCK"
          }
        }
        mutate {
          merge => {
            "security_result.action" => "security_action_var"
          }
        }
      }
      if [session_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{session_id}"
          }
          on_error => "session_id_invalid"
        }
      }

      if [acct] != "" and [acct] != "null" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{acct}"
            "has_target" => "true"
          }
          on_error => "acct_invalid"
        }
      }

      if [exe] != "" and [exe] != "null" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.full_path" => "%{exe}"
          }
          on_error => "exe_invalid"
        }
      }

      if [uid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{uid}"
            "has_principal" => "true"
          }
          on_error => "uid_not_found"
        }
      }

      if [type] == "USER_ACCT" and ([has_principal] == "true" or [has_target] == "true") {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      } else if [type] == "CRED_REFR" and ([has_principal] == "true" or [has_target] == "true") {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      } else if [type] == "USER_CMD" and ([has_principal] == "true" or [has_target] == "true") {
         mutate {
          replace => {
            "event_type" => "PROCESS_UNCATEGORIZED"
          }
        }
      }
      if [pam_msg] != "" {
        mutate {
          replace => {
            "security_result.description" => "%{pam_msg}"
          }
          on_error => "pam_msg_not_found"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.description" => "%{audit_msg}"
        }
        on_error => "audit_msg_not_found"
      }
    }
  }
  else if [msg] != "" {
    grok {
      match => {
        "msg" => [
          "(Received|Sending) %{WORD:ping_status} (from|to) %{GREEDYDATA:prin_resource}",
          "\\(%{WORD:prin_user}\\) CMD \\(%{DATA:prin_cmd_line}\\)"
         ]
      }
      overwrite => ["ping_status","prin_resource","prin_user","prin_cmd_line"]
      on_error => "msg_failure"
    }

    if [msg_failure] {
      grok {
        match => {
          "message" => [
            "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:prin_host} %{WORD:process}(\\[%{INT:process_id}\\]|): .*%{WORD},%{GREEDYDATA:kv_data}"
          ]
        }
        overwrite => ["kv_data","process","process_id","prin_host","event_time","serial","pwd","user","cmd_line"]
        on_error => "grok_failure"
      }

      if [kv_data] != "" {
        mutate {
          gsub => ["kv_data", "\\\"", ""]
        }

        kv {
          source => "kv_data"
          field_split => ","
          value_split => "="
          trim_value => "\""
          on_error => "not_kv"
        }
        if [not_kv] {
          drop {
            tag => "TAG_MALFORMED_MESSAGE"
          }
        }
        if [rogueMac] != "" {
          mutate {
            lowercase => ["rogueMac"]
          }
          mutate {
            replace => {
              "target_mac" => "%{rogueMac}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.mac" => "target_mac"
            }
            on_error => "no_target_mac"
          }
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
        if [ssid] != "" {
          mutate {
            replace => {
              "principal.user.user_display_name" => "%{ssid}"
            }
          }
        }
        if [apLocation] != "" {
          mutate {
            replace => {
              "principal.location.country_or_region" => "%{apLocation}"
            }
          }
        }

        if [apName] != "" {
          mutate {
            replace => {
              "principal.user.userid" => "%{apName}"
            }
          }
        }
        if [principal] != "" {
          mutate {
            rename => {
              "principal" => "event.idm.read_only_udm.principal"
            }
          }
        }
        if [apMac] != "" {
          mutate {
            lowercase => ["apMac"]
          }
          mutate {
            replace => {
              "principal_mac" => "%{apMac}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.mac" => "principal_mac"
            }
            on_error => "no_principal_mac"
          }
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
        if [radio] != "" {
          mutate {
            replace => {
              "additional_ratio_field.key" => "radio"
              "additional_ratio_field.value.string_value" => "%{radio}"
             }
           }
           mutate {
             merge => {
               "event.idm.read_only_udm.additional.fields" => "additional_ratio_field"
             }
           }
        }
        if [wlanId] != "" {
          mutate {
            replace => {
              "additional_wlanid_field.key" => "wlanId"
              "additional_wlanid_field.value.string_value" => "%{wlanId}"
             }
           }
            mutate {
             merge => {
               "event.idm.read_only_udm.additional.fields" => "additional_wlanid_field"
             }
           }
        }
        if [zoneUUID] != "" {
          mutate {
            replace => {
              "additional_zoneid_field.key" => "zoneUUID"
              "additional_zoneid_field.value.string_value" => "%{zoneUUID}"
             }
           }
            mutate {
             merge => {
               "event.idm.read_only_udm.additional.fields" => "additional_zoneid_field"
             }
           }
        }
      }
    }
  }

  if [process] == "statd" {
    grok {
      match => {
        "description" => [
          "app = %{DATA:application_name},",
          "app:%{NOTSPACE:application_name}"
        ]
      }
      on_error => "app_name_not_found"
    }

    if ![app_name_not_found] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{application_name}"
        }
      }
    }
  }

  if [company_name] != "" {
    grok {
      match => {
        "company_name" => ["%{DATA:company_name}-_.*"]
      }
      overwrite => ["company_name"]
      on_error => "invalid_company"
    }
    mutate {
      rename => {
        "company_name" => "event.idm.read_only_udm.principal.user.company_name"
      }
    }
  }

  if [auth_status] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "%{auth_status}"
      }
    }
  }

  if [prin_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{prin_user}"
        "has_principal" => "true"
      }
    }
  }

  if [prin_cmd_line] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.command_line" => "%{prin_cmd_line}"
      }
    }
  }

  if [user] != "" {
    if [process] == "CROND" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{user}"
          "has_principal_user" => "true"
        }
        on_error => "user_not_found_in_principal"
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{user}"
          "has_target_user" => "true"
        }
        on_error => "user_not_found_in_target"
      }
    }
  }

  if [cmd_line] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{cmd_line}"
      }
    }
  }

  if [pwd] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{pwd}"
      }
    }
  }

  if [serial] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{serial}"
      }
    }
  }

  if [prin_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{prin_host}"
        "has_principal" => "true"
      }
      on_error => "prin_host_not_found"
    }
  }

  if [event_type] == "" and [has_principal_user] == "true" or [has_target_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  if [prin_host] != "" and [event_type] == "" and [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [process] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{process}"
      }
    }
  }

  if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{process_id}"
      }
    }
  }

  if [dst_mac] != "" {
    mutate {
      lowercase => ["dst_mac"]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.mac" => "dst_mac"
      }
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
    if [dst_mac] != "" and [has_target] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
  }

  if [prin_resource] != ""  {
    mutate {
      replace => {
        "att_label.key" => "prin_resource"
        "att_label.value" => "%{prin_resource}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "att_label"
      }
    }
  }

  if [ping_status] !="" {
    mutate {
      replace => {
        "additional_field.key" => "ping_status"
        "additional_field.value.string_value" => "%{ping_status}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_field"
      }
    }
  }

  if [hostapd] != "" {
    mutate {
      replace => {
        "hostapd_additional_field.key" => "hostapd"
        "hostapd_additional_field.value" => "%{hostapd}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "hostapd_additional_field"
      }
    }
  }

  if [network_interface] != "" {
    mutate {
      replace => {
        "network_interface_label.key" => "network_interface"
        "network_interface_label.value" => "%{network_interface}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "network_interface_label"
      }
    }
  }

  if [summary] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{summary}"
      }
      on_error => "summary_not_found"
    }
  }

  if [ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip"
        "event.idm.read_only_udm.principal.asset.ip" => "ip"
      }
      on_error => "ip_not_found"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [severity] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{severity}"
      }
    }

    if [severity] =~ "(?i)Info" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [severity] =~ "(?i)(Error|Err)" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [severity] =~ "(?i)(Warning|Warn)" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
    }
  }

  date {
    match => ["event_time", "LDAP", "UNIX", "ISO8601", "yyyy-MM-ddTHH:mm:ssZZ" ]
    on_error => "batch_timestamp_failure"
  }
  if [event_type] == "" {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
