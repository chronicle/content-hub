# Product: Rubrik Security Cloud
# Category: Security Violation, Login, Anomaly, Threat Monitoring, Threat Hunt
# Supported Format: JSON
# Reference: https://developer.rubrik.com/Rubrik-Security-Cloud-API/Observability/Events/
# Last Updated: 2026-02-09
# Copyright 2026 Google SecOps

filter {
  mutate {
    gsub => ["message", "\\r\\n", ""]
  }

  mutate {
    gsub => ["message", "\\n", ""]
  }
  mutate {
    replace => {
      "event" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "security_result" => ""
      "additional" => ""
      "extensions" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "is_ip_assigned" => "false"
      "is_user_name_assigned" => "false"
      "is_object_name_assigned" => "false"
      "is_object_type_assigned" => "false"
      "is_severity_assigned" => "false"
      "action_name" => ""
      "summary" => ""
      "source" => ""
      "severity" => ""
      "timestamp" => ""
      "class" => ""
      "custom_details.seriesId" => ""
      "custom_details.seriesID" => ""
      "custom_details.id" => ""
      "custom_details.objectId" => ""
      "custom_details.objectName" => ""
      "custom_details.objectType" => ""
      "custom_details.status" => ""
      "custom_details.clusterId" => ""
      "custom_details.clusterName" => ""
      "custom_details.eventName" => ""
      "custom_details.errorId" => ""
      "custom_details.errorCode" => ""
      "custom_details.errorRemedy" => ""
      "custom_details.errorReason" => ""
      "custom_details.auditUserName" => ""
      "custom_details.auditUserId" => ""
      "custom_details.location" => ""
      "custom_details.url" => ""
      "custom_details.customerID" => ""
      "custom_details.dataTransferredInBytes" => ""
      "custom_details.effectiveThroughput" => ""
      "custom_details.errorMessage" => ""
      "custom_details.logicalSizeInBytes" => ""
      "custom_details.type" => ""
      "location" => ""
      "group" => ""
      "component" => ""
      "custom_details.ipAddress" => ""
      "custom_details.isPolarisAudit" => ""
      "custom_details.orgID" => ""
      "custom_details.userNote" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }
  if [json_failed] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  else {
    grok {
      match => {
        "timestamp" =>
        "(?<date>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}) %{TIME:time}\\.(?<milliseconds>\\d{3})\\d*"
      }
      on_error => "date_grok_match_failed"
    }

    mutate {
      replace => {
        "timestamp" => "%{date} %{time}.%{milliseconds}"
      }
      on_error => "timestamp_assignment_failed"
    }

    if [timestamp] != "" {
      date {
        match => ["timestamp","ISO8601","yyyy-MM-dd HH:mm:ss.SSS"]
        target => "metadata.event_timestamp"
        on_error => "no_timestamp"
      }
    }

    if [custom_details][eventName] in [
      "LoginBlockedIP",
      "LoginFailedDueToAccountLock",
      "LoginFailedInsufficientPermissions",
      "LoginFailedSSOUnauthorizedForGroups",
      "PasswordLoginFailedUnknownUser"] {
      grok {
        match => {
          "summary" => "(Login by %{DATA:user_email} \\(SSO\\) failed\\. User does not belong to any of the SSO groups authorized in RSC\\. User's SSO groups: \\(%{DATA:groups}\\)|Login by %{DATA:user_email} from %{IP:ip_address} blocked because the request came from outside of the IP whitelist\\.|Login failed for %{DATA:user_name} because the user is locked\\.|Login by %{DATA:user_name} \\(%{DATA:domain}\\) from %{IP:ip_address} failed because the user does not have any assigned roles\\.|Login failed\\. User %{DATA:user_name} does not exist\\.)"
        }
        on_error => "login_grok_match_failed_1"
      }
    }
    else if [custom_details][eventName] in [
      "PasskeyLoginFailed",
      "PasswordLoginFailedKnownUser",
      "TotpLoginFailed"] {
      grok {
        match => {
          "summary" => "(Known user, %{DATA:user_name}, was unable to login with an invalid password\\.|%{DATA:user_name} failed to login with (passkey|Rubrik Two-Step Verification)\\.)"
        }
        on_error => "login_grok_match_failed_2"
      }
    }
    else if [custom_details][eventName] in [
      "ClientAuthenticationFailed",
      "ClientIdInvalid"] {
      grok {
        match => {
          "summary" => "(%{DATA:client_name} unable to authenticate with invalid secret\\.|Unable to authenticate with invalid service account ID, %{DATA:client_id}\\.)"
        }
        on_error => "login_grok_match_failed_3"
      }
    }
    else if [custom_details][eventName] in [
      "LoginSucceeded",
      "LoginSucceededWithNotification",
      "LogoutSucceeded"] {
      grok {
        match => {
          "summary" => "(%{DATA:user_name} logged in\\.|%{DATA:user_name} was logged out %{DATA:reason}\\.)"
        }
        on_error => "login_grok_match_failed_4"
      }
    }
    else if [custom_details][eventName] in [
      "ResetPasswordMailSent",
      "UpdateUserPasswordFailed",
      "UpdateUserPasswordSucceeded"] {
      grok {
        match => {
          "summary" => "(Password reset email sent for %{DATA:user_name}\\.|%{DATA:user_name} (was unable to update|succeeded to update) their password\\.( Reason: %{DATA:reason}\\.)?)"
        }
        on_error => "login_grok_match_failed_5"
      }
    }
    else if [custom_details][eventName] == "RkcliLogin" {
      grok {
        match => {
          "summary" => "Admin user logged in to rkcli on the %{DATA:node} node from %{IP:ip_address}\\."
        }
        on_error => "login_grok_match_failed_6"
      }
    }
    else if [custom_details][eventName] in [
      "RadarThreatHuntCancelled",
      "RadarThreatHuntCsvDownload",
      "RadarThreatHuntStarted",
      "RadarTurboThreatHuntStarted",
      "ThreatHuntStarted"] {
      grok {
        match => {
          "summary" => "(%{DATA:user_name} canceled the threat hunt ['\"]%{DATA:hunt_name}['\"] started on %{DATA:hunt_date}\\.|%{DATA:user_name} started a CSV download of threat hunt ['\"]%{DATA:hunt_name}['\"] created on %{DATA:hunt_date}\\.|%{DATA:user_name} started an advanced threat hunt ['\"]%{DATA:hunt_name}['\"] on %{DATA:hunt_date}\\.|%{DATA:user_name} started a fast turbo-charged threat hunt ['\"]%{DATA:hunt_name}['\"] on %{DATA:hunt_date}\\.|%{DATA:user_email} initiated %{DATA:hunt_type} threat hunt: %{DATA:hunt_name}\\.)"
        }
        on_error => "threat_hunt_grok_match_failed_1"
      }
    }
    else if [custom_details][eventName] in [
      "ThreatHuntAborted",
      "ThreatHuntCanceled",
      "ThreatHuntFailed"] {
      grok {
        match => {
          "summary" => "(Threat hunt %{DATA:hunt_name} was aborted due to file match limit exceeded\\..*|Threat hunt %{DATA:hunt_name} was canceled\\.|Threat hunt %{DATA:hunt_name} failed to complete\\. Reason: %{DATA:reason}\\.)"
        }
        on_error => "threat_hunt_grok_match_failed_2"
      }
    }
    else if [custom_details][eventName] in [
      "ThreatHuntPartiallySucceeded",
      "ThreatHuntSucceeded"] {
      grok {
        match => {
          "summary" => "(Threat hunt %{DATA:hunt_name} partially succeeded with %{NUMBER:obj_succeeded:int} objects successful, %{NUMBER:obj_partially_succeeded:int} objects partially successful, and %{NUMBER:obj_failed:int} objects failing\\. There were %{NUMBER:object_matches:int} object matches and %{NUMBER:file_matches:int} file matches\\.|Threat hunt %{DATA:hunt_name} completed successfully for all the objects\\. There were %{NUMBER:object_matches:int} object matches and %{NUMBER:file_matches:int} file matches\\.)"
        }
        on_error => "threat_hunt_grok_match_failed_3"
      }
    }
    else if [custom_details][eventName] in [
      "ThreatMonitoringAnalysisFailed",
      "ThreatMonitoringAnalysisStarted",
      "ThreatMonitoringAnalysisSucceeded"] {
      grok {
        match => {
          "summary" => "(Failed to run Threat Monitoring analysis of snapshot taken on %{DATA:snapshot_date} of ['\"]%{DATA:snappable_name}['\"]: %{DATA:failure_reason}\\.|Started Threat Monitoring analysis of snapshot taken on %{DATA:snapshot_date} of ['\"]%{DATA:snappable_name}['\"]\\.|Completed Threat Monitoring analysis of snapshot taken on %{DATA:snapshot_date} of ['\"]%{DATA:snappable_name}['\"]\\.)"
        }
        on_error => "threat_monitoring_grok_match_failed_1"
      }
    }
    else if [custom_details][eventName] in [
      "ThreatMonitoringFullAnalysisFailed",
      "ThreatMonitoringFullAnalysisStarted",
      "ThreatMonitoringFullAnalysisSucceeded"] {
      grok {
        match => {
          "summary" => "(Failed to run a full Threat Monitoring analysis on ['\"]%{DATA:snappable_name}['\"] using Threat Feed %{DATA:threat_feed_type}: %{DATA:failure_reason}\\.|Started a full Threat Monitoring analysis on ['\"]%{DATA:snappable_name}['\"] using Threat Feed: %{DATA:threat_feed_type}\\.|Completed full Threat Monitoring analysis on ['\"]%{DATA:snappable_name}['\"] using Threat Feed: %{DATA:threat_feed_type}\\.)"
        }
        on_error => "threat_monitoring_grok_match_failed_2"
      }
    }
    else if [custom_details][eventName] in [
      "ThreatMonitoringFullHashAnalysisMatchesFound",
      "ThreatMonitoringFullHashAnalysisNoMatchesFound"] {
      grok {
        match => {
          "summary" => "Completed full Threat Monitoring hash analysis on ['\"]%{DATA:snappable_name}['\"] using Hash Threat Feed version %{DATA:hash_tf_version}\\. (Found %{NUMBER:num_hash_matches:int} hash matches\\.|No matches found\\.)"
        }
        on_error => "threat_monitoring_grok_match_failed_3"
      }
    }
    else if [custom_details][eventName] in [
      "ThreatMonitoringFullYaraAnalysisMatchesFound",
      "ThreatMonitoringFullYaraAnalysisNoMatchesFound"] {
      grok {
        match => {
          "summary" => "Completed full Threat Monitoring YARA analysis on ['\"]%{DATA:snappable_name}['\"] using (Threat Feed|YARA Threat Feed) version %{DATA:yara_tf_version}\\. (Found %{NUMBER:num_yara_rule_matches:int} YARA rule matches\\.|No matches found\\.)"
        }
        on_error => "threat_monitoring_grok_match_failed_4"
      }
    }
    else if [custom_details][eventName] in [
      "ThreatMonitoringHashMatchesFound",
      "ThreatMonitoringYaraMatchesFound"] {
      grok {
        match => {
          "summary" => "(Found file hash matches for %{NUMBER:num_files_with_matches:int} files\\.|Found %{NUMBER:num_yara_rule_matches:int} YARA rule matches\\.)"
        }
        on_error => "threat_monitoring_grok_match_failed_5"
      }
    }
    else if [custom_details][eventName] == "ThreatMonitoringYaraError" {
      grok {
        match => {
          "summary" => "Error while analyzing YARA rule matches: %{DATA:failure_reason}\\."
        }
        on_error => "threat_monitoring_grok_match_failed_6"
      }
    }
    else if [custom_details][eventName] in [
      "AdIrRemediationFailed",
      "AdIrRemediationStarted",
      "AdIrRemediationSuccess"] {
      grok {
        match => {
          "summary" => "(Failed to remediate AD IR risk ['\"]%{DATA:risk_name}['\"] with ['\"]%{DATA:remediation_type}['\"] on %{DATA:object_name}\\.|Initiating remediation of AD IR risk ['\"]%{DATA:risk_name}['\"] with ['\"]%{DATA:remediation_type}['\"] on %{DATA:object_name}\\.|Remediated AD IR risk ['\"]%{DATA:risk_name}['\"] with ['\"]%{DATA:remediation_type}['\"] on %{DATA:object_name}\\.)"
        }
        on_error => "security_violation_grok_match_failed_1"
      }
    }
    else if [custom_details][eventName] in [
      "EntraIdIrRemediationFailed",
      "EntraIdIrRemediationStarted",
      "EntraIdIrRemediationSuccess"] {
      grok {
        match => {
          "summary" => "(Unable to remediate Entra ID IR risk ['\"]%{DATA:risk_name}['\"] with ['\"]%{DATA:remediation_type}['\"] on %{DATA:object_name}\. Error: %{DATA:reason}\. %{DATA:remedy}\\.|Initiating remediation of Entra ID IR risk ['\"]%{DATA:risk_name}['\"] with ['\"]%{DATA:remediation_type}['\"] on %{DATA:object_name}\\.|Remediated Entra ID IR risk ['\"]%{DATA:risk_name}['\"] with ['\"]%{DATA:remediation_type}['\"] on %{DATA:object_name}\\.)"
        }
        on_error => "security_violation_grok_match_failed_2"
      }
    }
    else if [custom_details][eventName] in [
      "CriticalSeverityDataViolationClosed",
      "CriticalSeverityDataViolationDetected",
      "CriticalSeverityDataViolationDismissed",
      "CriticalSeverityDataViolationInProgress",
      "CriticalSeverityDataViolationRemediated",
      "CriticalSeverityDataViolationReOpen"] {
      grok {
        match => {
          "summary" => "Critical severity violation of policy %{DATA:policy_name} (detected on %{GREEDYDATA:object_name}|on %{DATA:object_name} (was closed automatically|was dismissed|changed status to in progress|was remediated|changed status to open))"
        }
        on_error => "security_violation_grok_match_failed_3"
      }
    }
    else if [custom_details][eventName] in [
      "HighSeverityDataViolationClosed",
      "HighSeverityDataViolationDetected",
      "HighSeverityDataViolationDismissed",
      "HighSeverityDataViolationInProgress",
      "HighSeverityDataViolationRemediated",
      "HighSeverityDataViolationReOpen"] {
      grok {
        match => {
          "summary" => "High severity violation of policy %{DATA:policy_name} (detected on %{GREEDYDATA:object_name}|on %{DATA:object_name} (was closed automatically|was dismissed|changed status to in progress|was remediated|changed status to open))"
        }
        on_error => "security_violation_grok_match_failed_4"
      }
    }
    else if [custom_details][eventName] in [
      "LowOrMediumSeverityDataViolationClosed",
      "LowOrMediumSeverityDataViolationDetected",
      "LowOrMediumSeverityDataViolationDismissed",
      "LowOrMediumSeverityDataViolationInProgress",
      "LowOrMediumSeverityDataViolationRemediated",
      "LowOrMediumSeverityDataViolationReOpen"] {
      grok {
        match => {
          "summary" => "%{DATA:severity_name} severity violation of policy %{DATA:policy_name} (detected on %{GREEDYDATA:object_name}|on %{DATA:object_name} (was closed automatically|was dismissed|changed status to in progress|was remediated|changed status to open))"
        }
        on_error => "security_violation_grok_match_failed_5"
      }
    }
    else if [custom_details][eventName] in [
      "DataViolationExportActionsLogRemediationFailed",
      "DataViolationExportActionsLogRemediationSuccess"] {
      grok {
        match => {
          "summary" => "(Failed to download actions log for object ['\"]%{DATA:resource_name}['\"] in violation of policy ['\"]%{DATA:policy_name}['\"]\\.|Actions log for object ['\"]%{DATA:resource_name}['\"] in violation of policy ['\"]%{DATA:policy_name}['\"] downloaded\\.)"
        }
        on_error => "security_violation_grok_match_failed_6"
      }
    }
    else if [custom_details][eventName] in [
      "DataViolationExportPermissionsRemediationFailed",
      "DataViolationExportPermissionsRemediationSuccess"] {
      grok {
        match => {
          "summary" => "(Failed to download permissions for object ['\"]%{DATA:resource_name}['\"] detected in violation of ['\"]%{DATA:policy_name}['\"]\\.|Permissions for object ['\"]%{DATA:resource_name}['\"] (where|were) downloaded and detected in violation of ['\"]%{DATA:policy_name}['\"]\\.)"
        }
        on_error => "security_violation_grok_match_failed_7"
      }
    }
    else if [custom_details][eventName] in [
      "DataViolationMipLabelRemediationFailure",
      "DataViolationMipLabelRemediationFinished",
      "DataViolationMipLabelRemediationSkipped",
      "DataViolationMipLabelRemediationStarted",
      "DataViolationMipLabelRemediationSuccess"] {
      grok {
        match => {
          "summary" => "(Failed to assign label ['\"]%{DATA:label_name}['\"] to %{NUMBER:failed_document_count:int} out of %{NUMBER:document_count:int} documents detected in violation ['\"]%{DATA:policy_name}['\"] on object ['\"]%{DATA:object_name}['\"]\\.|Completed assignment of label ['\"]%{DATA:label_name}['\"] to %{NUMBER:document_count:int} documents detected in violation ['\"]%{DATA:policy_name}['\"] on object ['\"]%{DATA:object_name}['\"]\\.|Skipped assignment of label ['\"]%{DATA:label_name}['\"] to %{NUMBER:skipped_document_count:int} out of %{NUMBER:document_count:int} documents, which were detected in violation ['\"]%{DATA:policy_name}['\"] on object ['\"]%{DATA:object_name}['\"]\\.|Beginning assignment of label ['\"]%{DATA:label_name}['\"] to %{NUMBER:document_count:int} documents detected in violation ['\"]%{DATA:policy_name}['\"] on object ['\"]%{DATA:object_name}['\"]\\.|Successfully assigned label ['\"]%{DATA:label_name}['\"] to %{NUMBER:successful_document_count:int} out of %{NUMBER:document_count:int} documents detected in violation ['\"]%{DATA:policy_name}['\"] on object ['\"]%{DATA:object_name}['\"]\\.)"
        }
        on_error => "security_violation_grok_match_failed_8"
      }
    }
    else if [custom_details][eventName] in [
      "IdentityRevokeAccessRemediationFailed",
      "IdentityRevokeAccessRemediationSuccess"] {
      grok {
        match => {
          "summary" => "(Failed to revoke|Successfully revoked) access for ['\"]%{DATA:identity_name}['\"] to %{NUMBER:document_count:int} files in object %{DATA:object_name}\\."
        }
        on_error => "security_violation_grok_match_failed_9"
      }
    }
    else if [custom_details][eventName] in [
      "OverExposureRevokeAccessRemediationFailed",
      "OverExposureRevokeAccessRemediationPartialSuccess",
      "OverExposureRevokeAccessRemediationStarted",
      "OverExposureRevokeAccessRemediationSuccess"] {
      grok {
        match => {
          "summary" => "(Failed to revoke|Partially revoked|Initiating revoke|Successfully revoked) ['\"]%{DATA:access_type}['\"] access from %{NUMBER:document_count:int} files in object %{DATA:object_name}\\."
        }
        on_error => "security_violation_grok_match_failed_10"
      }
    }
    else if [custom_details][eventName] in [
      "RevokeAccessRemediationInProgressForMultipleIdentities",
      "RevokeAccessRemediationInProgressForSingleIdentity"] {
      grok {
        match => {
          "summary" => "Revoking access in progress for (%{NUMBER:num_of_violating_identities:int} identities|['\"]%{DATA:identity_name}['\"]) from %{NUMBER:total_accessible_files_at_risk_count:int} files in object %{DATA:object_name}\\."
        }
        on_error => "security_violation_grok_match_failed_11"
      }
    }
    else if [custom_details][eventName] in [
      "AnomalyResolved",
      "AnomalyResolveReportedFalsePositiveAndDirectoriesSnoozed",
      "NonfilesystemAnomalyResolved",
      "NonfilesystemAnomalyResolvedAndFalsePositiveReported"] {
      grok {
        match => {
          "summary" => "%{DATA:user_name} resolved( and reported anomaly as a false positive)?( anomaly)? (for snapshot taken on %{DATA:snapshot_date}|detected on %{DATA:detection_time}) of %{DATA:snappable_type} ['\"]%{DATA:snappable_name}['\"]\\.( %{NUMBER:directories_snoozed:int} directories were snoozed\\.)?"
        }
        on_error => "anomaly_grok_match_failed_1"
      }
    }
    else if [custom_details][eventName] in [
      "EncryptionNotRunAnomalyDetectedInfo",
      "EncryptionNotRunAnomalyDetectedWarning",
      "RansomwareStrainDetected",
      "RansomwareStrainDetectedWarning",
      "SnappableElevatedEncryption",
      "SnappableElevatedEncryptionWithSuspiciousFilesInfo",
      "SnappableLowEncryptionInfo",
      "SnappableLowEncryptionWarning"] {
      grok {
        match => {
          "summary" => "Detected (potential ransomware strain ['\"]%{DATA:strain_name}['\"] with|anomalous filesystem activity with) %{DATA:confidence}( confidence)?( and %{DATA:encryption_level} levels of encryption)? \\(File Change: %{NUMBER:files_created_count:int} Added, %{NUMBER:files_modified_count:int} Modified, %{NUMBER:files_removed_count:int} Removed(, %{NUMBER:files_suspicious_count:int} Suspicious)?\\)"
        }
        on_error => "anomaly_grok_match_failed_2"
      }
    }
    else if [custom_details][eventName] == "DirectoriesRemovedFromSnooze" {
      grok {
        match => {
          "summary" => "%{NUMBER:directories_unsnoozed:int} directories unsnoozed by %{DATA:user_name} on %{DATA:action_date}\\."
        }
        on_error => "anomaly_grok_match_failed_3"
      }
    }
    else if [custom_details][eventName] == "VMHostAnomalyDetected" {
      grok {
        match => {
          "summary" => "Detected anomalous activity on %{DATA:snappable_name} \\(%{INT:vm_count} Virtual Machines affected\\)"
        }
        on_error => "anomaly_grok_match_failed_4"
      }
    }

    for key, value in custom_details.eventInfo map {
      mutate {
        replace => {
          "event_info_label" => ""
        }
      }
      mutate {
        convert => {
          "key" => "string"
        }
        on_error => "event_info_key_not_converted"
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "event_info_value_not_converted"
      }
      mutate {
        replace => {
          "event_info_label.value" => "%{value}"
        }
        on_error => "event_info_not_found"
      }

      # overwrite the if there is same field extracted from summary
      if [key] == "AnomalyConfidence" {
        mutate {
          replace => {
            "confidence" => "%{value}"
          }
          on_error => "confidence_not_assigned"
        }
      }
      else if [key] == "EncryptionConfidence" {
        mutate {
          replace => {
            "encryption_level" => "%{value}"
          }
          on_error => "encryption_level_not_assigned"
        }
      }
      else if [key] == "DetectionTime" {
        mutate {
          replace => {
            "detection_time" => "%{value}"
          }
          on_error => "detection_time_not_assigned"
        }
      }
      else if [key] == "FilesAdded" {
        mutate {
          replace => {
            "files_created_count" => "%{value}"
          }
          on_error => "files_created_count_not_assigned"
        }
      }
      else if [key] == "FilesDeleted" {
        mutate {
          replace => {
            "files_removed_count" => "%{value}"
          }
          on_error => "files_removed_count_not_assigned"
        }
      }
      else if [key] == "FilesModified" {
        mutate {
          replace => {
            "files_modified_count" => "%{value}"
          }
          on_error => "files_modified_count_not_assigned"
        }
      }
      else if [key] == "SuspiciousFilesAdded" {
        mutate {
          replace => {
            "files_suspicious_count" => "%{value}"
          }
          on_error => "files_suspicious_count_not_assigned"
        }
      }
      else if [key] == "SnapshotDate" {
        mutate {
          replace => {
            "snapshot_date" => "%{value}"
          }
          on_error => "snapshot_date_not_assigned"
        }
      }
      else if ![event_info_not_found] and [event_info_label][value] != "" {
        mutate {
          replace => {
            "event_info_label.key" => "%{key}"
          }
          on_error => "event_info_key_missing"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "event_info_label"
          }
          on_error => "event_info_not_merged"
        }
      }
    }

    for key, value in custom_details.auditInfo map {
      mutate {
        replace => {
          "audit_info_label" => ""
        }
      }
      mutate {
        convert => {
          "key" => "string"
        }
        on_error => "audit_info_key_not_converted"
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "audit_info_value_not_converted"
      }
      mutate {
        replace => {
          "audit_info_label.value.string_value" => "%{value}"
        }
        on_error => "audit_info_not_found"
      }
