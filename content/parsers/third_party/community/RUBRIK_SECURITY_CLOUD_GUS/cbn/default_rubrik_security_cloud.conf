      on_error => "remedy_not_converted"
    }
    mutate {
      replace => {
        "remedy_label.value" => "%{remedy}"
      }
      on_error => "no_remedy"
    }
    if ![no_remedy] and [remedy_label][value] != "" {
      mutate {
        replace => {
          "remedy_label.key" => "remedy"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "remedy_label"
        }
        on_error => "no_remedy_label"
        remove_field => ["remedy_label"]
      }
    }

    mutate {
      convert => {
        "reason" => "string"
      }
      on_error => "reason_not_converted"
    }
    mutate {
      convert => {
        "failure_reason" => "string"
      }
      on_error => "failure_reason_not_converted"
    }
    mutate {
      replace => {
        "reason_label.value" => "%{reason}"
      }
      on_error => "no_reason"
    }
    mutate {
      replace => {
        "reason_label.value" => "%{failure_reason}"
      }
      on_error => "no_failure_reason"
    }
    if (![no_reason] or ![no_failure_reason]) and [reason_label][value] != "" {
      mutate {
        replace => {
          "reason_label.key" => "reason"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "reason_label"
        }
        on_error => "no_reason_label"
        remove_field => ["reason_label"]
      }
    }

    mutate {
      convert => {
        "action_date" => "string"
      }
      on_error => "action_date_not_converted"
    }
    mutate {
      replace => {
        "action_date_label.value" => "%{action_date}"
      }
      on_error => "no_action_date"
    }
    if ![no_action_date] and [action_date_label][value] != "" {
      mutate {
        replace => {
          "action_date_label.key" => "action_date"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "action_date_label"
        }
        on_error => "action_date_label_not_merged"
        remove_field => ["action_date_label"]
      }
    }


    if [severity] != "" {
      mutate {
        convert => {
          "severity" => "string"
        }
        on_error => "severity_not_converted"
      }
      mutate {
        replace => {
          "security_result.severity_details" => "%{severity}"
        }
        on_error => "no_severity1"
      }
      if ![no_severity1] {
        mutate {
          replace => {
            "is_severity_assigned" => "true"
          }
        }
        mutate {
          uppercase => ["severity"]
          on_error => "severity_not_converted_to_upper"
        }
        if [severity] in ["HIGH", "MEDIUM", "LOW",
        "INFORMATIONAL", "CRITICAL"] {
          mutate {
            replace => {
              "security_result.severity" => "%{severity}"
            }
            on_error => "no_severity2"
          }
          if ![no_severity2] {
            mutate {
              replace => {
                "is_severity_assigned" => "true"
              }
            }
          }
        }
        else if [severity] == "INFO" {
          mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
          }
        }
        else if [severity] == "WARNING" {
          mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
          }
        }
      }
    }
    if [is_severity_assigned] == "false" {
      mutate {
        convert => {
          "severity_name" => "string"
        }
        on_error => "severity_name_not_converted"
      }
      mutate {
        replace => {
          "security_result.severity_details" => "%{severity_name}"
        }
        on_error => "no_severity_name1"
      }
      if ![no_severity_name1] {
        mutate {
          uppercase => ["severity_name"]
          on_error => "severity_name_not_converted_to_upper"
        }
        if [severity_name] in ["HIGH", "MEDIUM", "LOW",
        "INFORMATIONAL", "CRITICAL"] {
          mutate {
            replace => {
              "security_result.severity" => "%{severity_name}"
            }
            on_error => "no_severity_name2"
          }
        }
        else if [severity_name] == "INFO" {
          mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
          }
        }
        else if [severity_name] == "WARNING" {
          mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
          }
        }
      }
    }

    if [class] == "SecurityViolation" {
      mutate {
        replace => {
          "category_temp" => "POLICY_VIOLATION"
        }
      }
    }
    else if [class] == "Login" and [custom_details][status] == "Failure" {
      mutate {
        replace => {
          "category_temp" => "AUTH_VIOLATION"
        }
      }
    }
    else {
      mutate {
        replace => {
          "category_temp" => "UNKNOWN_CATEGORY"
        }
      }
    }
    mutate {
      merge => {
        "security_result.category" => "category_temp"
      }
      on_error => "category_temp_not_merged"
    }

    mutate {
      convert => {
        "snappable_type" => "string"
      }
      on_error => "snappable_type_not_converted"
    }
    mutate {
      replace => {
        "snappable_type_label.value.string_value" => "%{snappable_type}"
      }
      on_error => "no_snappable_type"
    }
    if ![no_snappable_type]
    and [snappable_type_label][value][string_value] != "" {
      mutate {
        replace => {
          "snappable_type_label.key" => "snappable_type"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "snappable_type_label"
        }
        on_error => "snappable_type_label_not_merged"
      }
    }

    mutate {
      convert => {
        "snappable_name" => "string"
      }
      on_error => "snappable_name_not_converted"
    }
    mutate {
      replace => {
        "snappable_name_label.value.string_value" => "%{snappable_name}"
      }
      on_error => "no_snappable_name"
    }
    if ![no_snappable_name]
    and [snappable_name_label][value][string_value] != "" {
      mutate {
        replace => {
          "snappable_name_label.key" => "snappable_name"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "snappable_name_label"
        }
        on_error => "snappable_name_label_not_merged"
      }
    }

    mutate {
      convert => {
        "snapshot_date" => "string"
      }
      on_error => "snapshot_date_not_converted"
    }
    mutate {
      replace => {
        "snapshot_date_label.value.string_value" => "%{snapshot_date}"
      }
      on_error => "no_snapshot_date"
    }
    if ![no_snapshot_date]
    and [snapshot_date_label][value][string_value] != "" {
      mutate {
        replace => {
          "snapshot_date_label.key" => "snapshot_date"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "snapshot_date_label"
        }
        on_error => "snapshot_date_label_not_merged"
      }
    }

    mutate {
      convert => {
        "node" => "string"
      }
      on_error => "node_not_converted"
    }
    mutate {
      replace => {
        "node_label.value.string_value" => "%{node}"
      }
      on_error => "no_node"
    }
    if ![no_node] and [node_label][value][string_value] != "" {
      mutate {
        replace => {
          "node_label.key" => "node"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "node_label"
        }
        on_error => "node_label_not_merged"
      }
    }

    mutate {
      convert => {
        "label_name" => "string"
      }
      on_error => "label_name_not_converted"
    }
    mutate {
      replace => {
        "label_name_label.value.string_value" => "%{label_name}"
      }
      on_error => "no_label_name"
    }
    if ![no_label_name] and [label_name_label][value][string_value] != "" {
      mutate {
        replace => {
          "label_name_label.key" => "label_name"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "label_name_label"
        }
        on_error => "label_name_label_not_merged"
      }
    }


    if [custom_details][effectiveThroughput] != "" {
      mutate {
        convert => {
          "custom_details.effectiveThroughput" => "string"
        }
        on_error => "effectiveThroughput_not_converted"
      }
      mutate {
        replace => {
          "effectiveThroughput_label.value.string_value" =>
          "%{custom_details.effectiveThroughput}"
        }
        on_error => "no_effectiveThroughput"
      }
      if ![no_effectiveThroughput]
      and [effectiveThroughput_label][value][string_value] != "" {
        mutate {
          replace => {
            "effectiveThroughput_label.key" => "effective_throughput"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "effectiveThroughput_label"
          }
          on_error => "effectiveThroughput_label_not_merged"
        }
      }
    }

    if [custom_details][isPolarisAudit] != "" {
      mutate {
        convert => {
          "custom_details.isPolarisAudit" => "string"
        }
        on_error => "isPolarisAudit_not_converted"
      }
      mutate {
        replace => {
          "isPolarisAudit_label.value.string_value" =>
          "%{custom_details.isPolarisAudit}"
        }
        on_error => "no_isPolarisAudit"
      }
      if ![no_isPolarisAudit]
      and [isPolarisAudit_label][value][string_value] != "" {
        mutate {
          replace => {
            "isPolarisAudit_label.key" => "is_polaris_audit"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "isPolarisAudit_label"
          }
          on_error => "isPolarisAudit_label_not_merged"
        }
      }
    }

    if [custom_details][orgID] != "" {
      mutate {
        convert => {
          "custom_details.orgID" => "string"
        }
        on_error => "orgID_not_converted"
      }
      mutate {
        replace => {
          "orgID_label.value.string_value" => "%{custom_details.orgID}"
        }
        on_error => "no_orgID"
      }
      if ![no_orgID] and [orgID_label][value][string_value] != "" {
        mutate {
          replace => {
            "orgID_label.key" => "org_id"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "orgID_label"
          }
          on_error => "orgID_label_not_merged"
        }
      }
    }

    if [custom_details][type] != "" {
      mutate {
        convert => {
          "custom_details.type" => "string"
        }
        on_error => "type_not_converted"
      }
      mutate {
        replace => {
          "type_label.value.string_value" => "%{custom_details.type}"
        }
        on_error => "no_type"
      }
      if ![no_type] and [type_label][value][string_value] != "" {
        mutate {
          replace => {
            "type_label.key" => "type"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "type_label"
          }
          on_error => "type_label_not_merged"
        }
      }
    }
    if [group] != "" {
      mutate {
        convert => {
          "group" => "string"
        }
        on_error => "group_not_converted"
      }
      mutate {
        replace => {
          "group_label.value.string_value" => "%{group}"
        }
        on_error => "no_group"
      }
      if ![no_group] and [group_label][value][string_value] != "" {
        mutate {
          replace => {
            "group_label.key" => "group"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "group_label"
          }
          on_error => "group_label_not_merged"
        }
      }
    }

    if [custom_details][userNote] != "" {
      mutate {
        convert => {
          "custom_details.userNote" => "string"
        }
        on_error => "userNote_not_converted"
      }
      mutate {
        replace => {
          "userNote_label.value.string_value" => "%{custom_details.userNote}"
        }
        on_error => "no_userNote"
      }
      if ![no_userNote] and [userNote_label][value][string_value] != "" {
        mutate {
          replace => {
            "userNote_label.key" => "user_note"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "userNote_label"
          }
          on_error => "userNote_label_not_merged"
        }
      }
    }

    if [has_target] == "true" and [class] == "Login" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGIN"
          "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [has_principal] == "true" and  [class] == "ThreatHunt" {
      mutate {
        replace => {
          "metadata.event_type" => "SCAN_HOST"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      replace => {
        "metadata.product_name" => "RUBRIK SECURITY CLOUD"
        "metadata.vendor_name" => "RUBRIK"
      }
    }

    if [source] != "" {
      mutate {
        convert => {
          "source" => "string"
        }
        on_error => "source_not_converted"
      }
      mutate {
        replace => {
          "metadata.product_name" => "%{source}"
        }
        on_error => "no_source"
      }
    }

    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
        on_error => "principal_rename_error"
      }
    }
    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
        on_error => "target_rename_error"
      }
    }
    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
        on_error => "metadata_rename_error"
      }
    }
    if [network] != "" {
      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
        on_error => "network_rename_error"
      }
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "no_security_result"
      }
    }
    if [extensions] != "" {
      mutate {
        rename => {
          "extensions" => "event.idm.read_only_udm.extensions"
        }
        on_error => "extensions_rename_error"
      }
    }
    if [additional] != "" {
      mutate {
        rename => {
          "additional" => "event.idm.read_only_udm.additional"
        }
        on_error => "additional_rename_error"
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
      on_error => "event_merge_error"
    }
  }
}
