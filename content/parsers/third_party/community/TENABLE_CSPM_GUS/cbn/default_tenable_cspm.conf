# Product: TENABLE_CSPM
# Category: Cloud Security
# Supported Format: JSON
# Reference: NA
# Last Updated: 2025-02-17
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "security_result" => ""
      "metadata" => ""
      "principal" => ""
      "additional" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "target" => ""
      "network" => ""
      "source" => ""
      "sentBy" => ""
      "category" => ""
      "findingType" => ""
      "id" => ""
      "identityProviderAccount" => ""
      "link" => ""
      "status" => ""
      "subStatus" => ""
      "title" => ""
      "type" => ""
      "accountId" => ""
      "accountName" => ""
      "accountPath" => ""
      "compliances" => ""
      "cloudProvider" => ""
      "creationTime" => ""
      "description" => ""
      "principal_user" => ""
      "has_target_resource" => "false"
      "policyName" => ""
      "resourceOwnerPrincipals.0.principal.mail" => ""
      "remediation.console.steps" => ""
      "severity" => ""
      "starred" => ""
      "statusUpdateTime" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [creationTime] != "" {
    date {
      match => ["creationTime", "ISO8601"]
      on_error => "creationTime_error"
    }
  }
  if [statusUpdateTime] != "" {
    mutate {
      replace => {
        "statusUpdateTime_label.key" => "statusUpdateTime"
        "statusUpdateTime_label.value.string_value" => "%{statusUpdateTime}"
      }
      on_error => "statusUpdateTime_error"
    }
    if ![statusUpdateTime_error] {
      mutate {
        merge => {
          "additional.fields" => "statusUpdateTime_label"
        }
        on_error => "statusUpdateTime_label_error"
      }
    }
  }
  if [starred] != "" {
    mutate {
      replace => {
        "starred_label.key" => "starred"
        "starred_label.value.string_value" => "%{starred}"
      }
      on_error => "starred_error"
    }
    if ![starred_error] {
      mutate {
        merge => {
          "additional.fields" => "starred_label"
        }
        on_error => "starred_label_error"
      }
    }
  }
  if [severity] == "Low" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] == "Medium" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] == "High" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] == "Critical" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }
  if [remediation][console][steps] != "" {
    mutate {
      replace => {
        "steps_label.key" => "steps"
        "steps_label.value.string_value" => "%{remediation.console.steps}"
      }
      on_error => "steps_error"
    }
    if ![steps_error] {
      mutate {
        merge => {
          "additional.fields" => "steps_label"
        }
        on_error => "steps_label_error"
      }
    }
  }
  if [resourceOwnerPrincipals][0][principal][mail] != "" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "resourceOwnerPrincipals.0.principal.mail"
      }
      on_error => "resourceOwnerPrincipals_error"
    }
    if ![resourceOwnerPrincipals_error] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }
  if [accountId] != "" {
    mutate {
      replace => {
        "target.resource.id" => "%{accountId}"
        "has_target_resource" => "true"
      }
      on_error => "account_id_error"
    }
  }
  if [policyName] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{policyName}"
      }
      on_error => "policy_name_error"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "description_error"
    }
  }
  grok {
    match => {
      "description" => ["(User|user) %{DATA:principal_user} (was|has)"]
    }
    on_error => "principal_user_error"
    overwrite => ["principal_user"]
  }
  if [principal_user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{principal_user}"
        "has_user" => "true"
      }
      on_error => "principal_user_error"
    }
  }
  if [accountName] != "" {
    mutate {
      replace => {
        "accountName_label.key" => "accountName"
        "accountName_label.value" => "%{accountName}"
      }
      on_error => "account_name_error"
    }
    if ![account_name_error] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "accountName_label"
        }
        on_error => "account_name_label_error"
      }
    }
  }
  if [accountPath] != "" {
    mutate {
      replace => {
        "accountPath_label.key" => "accountPath"
        "accountPath_label.value" => "%{accountPath}"
      }
      on_error => "accountPath_error"
    }
    if ![accountPath_error] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "accountPath_label"
        }
        on_error => "accountPath_label_error"
      }
    }
  }
  if [cloudProvider] == "Azure" {
    mutate {
      replace => {
        "target.cloud.environment" => "MICROSOFT_AZURE"
      }
    }
  }
  else if [cloudProvider] == "AWS" {
    mutate {
      replace => {
        "target.cloud.environment" => "AMAZON_WEB_SERVICES"
      }
    }
  }
  if [source] != "" {
    mutate {
      replace => {
        "source_label.key" => "source"
        "source_label.value" => "%{source}"
      }
      on_error => "source_error"
    }
    if ![source_error] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "source_label"
        }
        on_error => "source_label_error"
      }
    }
  }
  for index,complaince in compliances {
    mutate {
      replace => {
        "complaince_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "complaince_index_error"
    }
    mutate {
      replace => {
        "complaince_label.key" => "complaince_%{index}"
        "complaince_label.value.string_value" => "%{complaince}"
      }
      on_error => "complaince_error"
    }
    if ![complaince_error] {
      mutate {
        merge => {
          "additional.fields" => "complaince_label"
        }
        on_error => "complaince_label_error"
      }
    }
  }
  for index1, label in labels {
    mutate {
      replace => {
        "label_label" => ""
      }
    }
    mutate {
      convert => {
        "index1" => "string"
      }
      on_error => "label_index_error"
    }
    mutate {
      replace => {
        "label_label.key" => "label_%{index1}"
        "label_label.value.string_value" => "%{label}"
      }
      on_error => "label_error"
    }
    if ![label_error] {
      mutate {
        merge => {
          "additional.fields" => "label_label"
        }
        on_error => "label_label_error"
      }
    }
  }
  for index2,environment in resourceEnvironment {
    mutate {
      replace => {
        "environment_label" => ""
      }
    }
    mutate {
      convert => {
        "index2" => "string"
      }
      on_error => "environment_index_error"
    }
    mutate {
      replace => {
        "environment_label.key" => "environment_%{index2}"
        "environment_label.value" => "%{environment}"
      }
      on_error => "environment_error"
    }
    if ![environment_error] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "environment_label"
        }
        on_error => "environment_label_error"
      }
    }
  }
  for index3,owner in resourceOwner {
    mutate {
      replace => {
        "owner_label" => ""
      }
    }
    mutate {
      convert => {
        "index3" => "string"
      }
      on_error => "owner_index_error"
    }
    mutate {
      replace => {
        "owner_label.key" => "owner_%{index3}"
        "owner_label.value" => "%{owner}"
      }
      on_error => "owner_error"
    }
    if ![owner_error] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "owner_label"
        }
        on_error => "owner_label_error"
      }
    }
  }
  for index4,resource in resources {
    mutate {
      replace => {
        "resource_label" => ""
      }
    }
    mutate {
      convert => {
        "index4" => "string"
      }
      on_error => "resource_index_error"
    }
    mutate {
      replace => {
        "resource_label.key" => "resource_%{index4}"
        "resource_label.value" => "%{resource}"
      }
      on_error => "resource_error"
    }
    if ![resource_error] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "resource_label"
        }
        on_error => "resource_label_error"
      }
    }
  }
  for index5,serviceNowIncidentUrl in serviceNowIncidentUrls {
    mutate {
      replace => {
        "serviceNowIncidentUrl_label" => ""
      }
    }
    mutate {
      convert => {
        "index5" => "string"
      }
    }
    mutate {
      replace => {
        "serviceNowIncidentUrl_label.key" => "serviceNowIncidentUrl_%{index5}"
        "serviceNowIncidentUrl_label.value.string_value" => "%{serviceNowIncidentUrl}"
      }
      on_error => "serviceNowIncidentUrl_error"
      }
    if ![serviceNowIncidentUrl_error] {
      mutate {
        merge => {
          "additional.fields" => "serviceNowIncidentUrl_label"
        }
        on_error => "serviceNowIncidentUrl_label_error"
      }
    }
  }
  for index6,ticketLink in ticketLinks {
    mutate {
      replace => {
        "ticketLink_label" => ""
      }
    }
    mutate {
      convert => {
        "index6" => "string"
      }
    }
    mutate {
      replace => {
        "ticketLink_label.key" => "ticketLink_%{index6}"
        "ticketLink_label.value.string_value" => "%{ticketLink}"
      }
      on_error => "ticketLink_error"
    }
    if ![ticketLink_error] {
      mutate {
        merge => {
          "additional.fields" => "ticketLink_label"
        }
        on_error => "ticketLink_label_error"
      }
    }
  }
  if [sentBy] != "" {
    if [principal_user] == "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{sentBy}"
        }
        on_error => "sentBy_error"
      }
      if ![sentBy_error] {
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "sentBy_label.key" => "sentBy"
          "sentBy_label.value.string_value" => "%{sentBy}"
        }
        on_error => "sentBy_error"
      }
      if ![sentBy_error] {
        mutate {
          merge => {
            "additional.fields" => "sentBy_label"
          }
          on_error => "sentBy_label_error"
        }
      }
    }
  }
  mutate {
    convert => {
      "category" => "string"
    }
    on_error => "category_conversion_error"
  }
  if [category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "category"
      }
      on_error => "category_error"
    }
  }
  if [findingType] != "" {
    mutate {
      replace => {
        "findingType_label.key" => "findingType"
        "findingType_label.value.string_value" => "%{findingType}"
      }
      on_error => "findingType_error"
    }
    if ![findingType_error] {
      mutate {
        merge => {
          "additional.fields" => "findingType_label"
        }
        on_error => "findingType_label_error"
      }
    }
  }
  if [id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id}"
      }
      on_error => "id_error"
    }
  }
  if [identityProviderAccount] != "" {
    mutate {
      replace => {
        "identityProviderAccount_label.key" => "identityProviderAccount"
        "identityProviderAccount_label.value.string_value" => "%{identityProviderAccount}"
      }
      on_error => "identityProviderAccount_error"
    }
    if ![identityProviderAccount_error] {
      mutate {
        merge => {
          "additional.fields" => "identityProviderAccount_label"
        }
        on_error => "identityProviderAccount_label_error"
      }
    }
  }
  if [link] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{link}"
      }
      on_error => "link_error"
    }
  }
  if [status] != "" {
    mutate {
      replace => {
        "status_label.key" => "status"
        "status_label.value.string_value" => "%{status}"
      }
      on_error => "status_error"
    }
    if ![status_error] {
      mutate {
        merge => {
          "additional.fields" => "status_label"
        }
        on_error => "status_label_error"
      }
    }
  }
  if [subStatus] != "" {
    mutate {
      replace => {
        "subStatus_label.key" => "subStatus"
        "subStatus_label.value.string_value" => "%{subStatus}"
      }
      on_error => "subStatus_error"
    }
    if ![subStatus_error] {
      mutate {
        merge => {
          "additional.fields" => "subStatus_label"
        }
        on_error => "subStatus_label_error"
      }
    }
  }
  if [title] != "" {
    mutate {
      replace => {
        "title_label.key" => "title"
        "title_label.value.string_value" => "%{title}"
      }
      on_error => "title_error"
    }
    if ![title_error] {
      mutate {
        merge => {
          "additional.fields" => "title_label"
        }
        on_error => "title_label_error"
      }
    }
  }
  if [type] != "" {
    mutate {
      replace => {
        "type_label.key" => "type"
        "type_label.value.string_value" => "%{type}"
      }
      on_error => "type_error"
    }
    if ![type_error] {
      mutate {
        merge => {
          "additional.fields" => "type_label"
        }
        on_error => "type_label_error"
      }
    }
  }
  if [has_user] == "true" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "metadata.product_name" => "Tenable CSPM"
      "metadata.vendor_name" => "Tenable CSPM"
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
