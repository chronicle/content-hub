# Product: FORTINET_WEBPROXY
# Category: Web Proxy
# Supported Format: SYSLOG + KV
# Reference: N/A
# Last Updated: 2026-09-29
# Copyright 2026 Google SecOps
filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "network" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "extensions" => ""
      "kv_data" => ""
      "date" => ""
      "devname" => ""
      "devid" => ""
      "logid" => ""
      "level" => ""
      "vd" => ""
      "policyid" => ""
      "poluuid" => ""
      "policytype" => ""
      "sessionid" => ""
      "user" => ""
      "group" => ""
      "srcip" => ""
      "srcport" => ""
      "srccountry" => ""
      "srcintf" => ""
      "srcintfrole" => ""
      "srcintfrole_labels" => ""
      "srcintfrole_labels_error" => ""
      "srcintfrole_labels_merge_error" => ""
      "subtype" => ""
      "time" => ""
      "eventtime" => ""
      "transid" => ""
      "url" => ""
      "referralurl" => ""
      "group_label" => ""
      "devid_label" => ""
      "srcintf_label" => ""
      "srcintfrole_label" => ""
      "srcuuid" => ""
      "dstip" => ""
      "dstport" => ""
      "dstcountry" => ""
      "dstcountry_label" => ""
      "dstintf" => ""
      "dstintf_label" => ""
      "dstintf_label_error" => ""
      "dstintf_label_merge_error" => ""
      "dstintfrole" => ""
      "dstintfrole_label" => ""
      "dstuuid" => ""
      "ts" => ""
      "proto" => ""
      "proto_type_label" => ""
      "proto_value_invalid" => ""
      "profile" => ""
      "profile_label" => ""
      "profile_value_invalid" => ""
      "direction" => ""
      "action" => ""
      "action_word" => ""
      "hostname" => ""
      "agent" => ""
      "agent_label" => ""
      "agent_value_invalid" => ""
      "filtername" => ""
      "filter_name_label" => ""
      "filename" => ""
      "filesize" => ""
      "filetype" => ""
      "msg" => ""
      "eventtype" => ""
      "type" => ""
      "service" => ""
      "has_network" => "false"
      "catdesc" => ""
      "sentbyte" => ""
      "rcvdbyte" => ""
      "httpmethod" => ""
      "reqtype" => ""
      "ratemethod" => ""
      "cat" => ""
      "method" => ""
      "logdesc" => ""
      "reason" => ""
      "reason_label" => ""
      "status" => ""
    }
  }
  mutate {
    replace => {
      "metadata.product_name" => "FORTINET_WEBPROXY"
      "metadata.vendor_name" => "FORTINET_WEBPROXY"
    }
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{GREEDYDATA:kv_data}"
      ]
    }
    overwrite => ["kv_data"]
    on_error => "not_grok"
  }
  mutate {
    gsub => ["kv_data", "(\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
  }
  mutate {
    gsub => ["kv_data", '\\\"', ""]
  }

  kv {
    source => "kv_data"
    field_split => "^"
    value_split => "="
    on_error => "not_kv"
  }
  if [devname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{devname}"
        "principal.asset.hostname" => "%{devname}"
        "has_principal" => "true"
      }
     on_error => "no_devname"
    }
  }
  if [devid] != "" {
    mutate {
      replace => {
        "devid_label.key" => "devid"
        "devid_label.value" => "%{devid}"
      }
      on_error => "devid_label_error"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "devid_label"
      }
      on_error => "devid_label_merge_error"
    }
  }
  if [logid] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{logid}"
      }
      on_error => "no_product_log_id"
    }
  }
  if [level] == "warning" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [level] == "notice" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [level] in ["information", "info"] {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  if [vd] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{vd}"
      }
      on_error => "no_vd"
    }
  }
  if [policyid] != "" {
    mutate {
      replace => {
        "policyid_label.key" => "PolicyID"
        "policyid_label.value" => "%{policyid}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "policyid_label"
      }
      on_error => "no_policyid"
    }
  }
  if [poluuid] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{poluuid}"
      }
      on_error => "poluuid_error"
    }
  }
  if [policytype] != "" {
    mutate {
      replace => {
        "security_result.rule_type" => "%{policytype}"
      }
      on_error => "invalid_policytype"
    }
  }
  if [sessionid] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{sessionid}"
      }
      on_error => "no_sessionid"
    }
  }
  if [transid] != "" {
    mutate {
      replace => {
        "transid_label.key" => "TransID"
        "transid_label.value.string_value" => "%{transid}"
      }
      on_error => "transid_replace_error"
    }
    if ![transid_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "transid_label"
        }
        on_error => "transid_merge_error"
      }
    }
  }
  if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
      }
      on_error => "no_user"
    }
  }
  if [group] != "" {
    mutate {
      replace => {
        "group_label.key" => "Group"
        "group_label.value.string_value" => "%{group}"
      }
      on_error => "group_value_invalid"
    }
    if ![group_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "group_label"
        }
        on_error => "group_label_merge_error"
      }
    }
  }
  if [srcip] != "" {
    mutate {
      merge => {
        "principal.asset.ip" => "srcip"
        "principal.ip" => "srcip"
      }
      on_error => "no_srcip"
    }
    if ![no_srcip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
        on_error => "has_principal_error"
      }
    }
  }
  if [srcport] != "" {
    mutate {
      convert => {
        "srcport" => "integer"
      }
      on_error => "no_srcport1"
    }
    mutate {
      rename => {
        "srcport" => "principal.port"
      }
      on_error => "no_srcport"
    }
  }

  if [srccountry] != "Reserved" and [srccountry] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{srccountry}"
      }
      on_error => "srccountry_merge_failed"
    }
  }
  if [srcintf] != "" {
    mutate {
      replace => {
        "srcintf_label.key" => "srcintf"
        "srcintf_label.value" => "%{srcintf}"
      }
      on_error => "srcintf_label_error"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "srcintf_label"
      }
      on_error => "srcintf_label_merge_error"
    }
  }
  if [srcintfrole] != "" {
    mutate {
      replace => {
        "srcintfrole_label.key" => "srcintfrole"
        "srcintfrole_label.value" => "%{srcintfrole}"
      }
      on_error => "srcintfrole_label_error"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "srcintfrole_label"
      }
      on_error => "srcintfrole_label_merge_error"
    }
  }
  if [srcuuid] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{srcuuid}"
      }
      on_error => "srcuuid_value_invalid"
    }
  }
  grok {
    match => {
      "dstip" => [
        "%{IP:dstip}"
      ]
    }
    overwrite => ["dstip"]
    on_error => "dstip_error"
  }
  if ![dstip_error] and [dstip] != ""{
    mutate {
      merge => {
        "target.ip" => "dstip"
        "target.asset.ip" => "dstip"
      }
      on_error => "dstip_merge_failed"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
      on_error => "has_target_error"
    }
  }
  if [dstport] not in ["", "N/A"] {
    mutate {
      convert => {
        "dstport" => "integer"
      }
      on_error => "no_dstport1"
    }
    mutate {
      rename => {
        "dstport" => "target.port"
      }
      on_error => "no_dstport"
    }
  }
  if [dstcountry] != "" {
        mutate {
          replace => {
            "target.location.country_or_region" => "%{dstcountry}"
          }
          on_error => "dstcountry_merge_failed"
        }
  }
  if [dstintf] != "" {
    mutate {
      replace => {
        "dstintf_labels.key" => "dstintf"
        "dstintf_labels.value" => "%{dstintf}"
      }
      on_error => "invalid_dstintf"
    }
    if ![invalid_dstintf] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "dstintf_labels"
        }
        on_error => "invalid_dstintf_label"
      }
    }
  }
  if [dstintfrole] != "" {
    mutate {
      replace => {
        "dstintfrole_labels.key" => "dstintfrole"
        "dstintfrole_labels.value" => "%{dstintfrole}"
      }
      on_error => "invalid_dstintfrole"
    }
    if ![invalid_dstintfrole] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "dstintfrole_labels"
        }
        on_error => "invalid_dstintfrole_label"
      }
    }
  }
  if [dstuuid] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{dstuuid}"
      }
      on_error => "dstuuid_value_invalid"
    }
  }
  if [eventtype] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventtype}"
      }
      on_error => "eventtype_value_invalid"
    }
  }
  if [eventtime] != "" {
    grok {
      match => {
        "eventtime" => "(?<eventtime_sec>[0-9]{10})(?<eventtime_nano>[0-9]+)"
      }
      on_error => "eventtime_grok_error"
    }
    if ![eventtime_grok_error] {
      mutate {
        replace => {
          "eventtime" => "%{eventtime_sec}.%{eventtime_nano}"
        }
        on_error => "eventtime_replace_error"
      }
    }
    date {
      match => ["eventtime", "UNIX"]
      target => "metadata.event_timestamp"
      on_error => "eventtime_invalid"
    }
  }
  mutate {
    replace => {
      "ts" => "%{date} %{time} %{tz}"
    }
    on_error => "ts_error"
  }
  if [ts] != "" {
    date {
      match => ["ts", "yyyy-MM-dd HH:mm:ss Z"]
      target => "metadata.collected_timestamp"
      on_error => "ts_value_invalid"
    }
  }
  if [type] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{type}"
      }
      on_error => "type_value_invalid"
    }
  }
    if [proto] == "17" {
      mutate {
        replace => { "network.ip_protocol" => "UDP" }
      }
    }
    else if [proto] == "6" or [subtype] == "wad" {
      mutate {
        replace => { "network.ip_protocol" => "TCP" }
      }
    }
    else if [proto] == "41" {
      mutate {
        replace => { "network.ip_protocol" => "IP6IN4" }
      }
    }
    else if [service] == "PING" or [proto] == "1" or [service] =~ "ICMP" {
      mutate {
        replace => { "network.ip_protocol" => "ICMP" }
      }
    }
  if [service] in ["HTTP", "HTTPS"] {
    mutate {
      replace => {
        "network.application_protocol" => "%{service}"
        "has_network" => "true"
      }
      on_error => "service_value_invalid"
    }
  }
  if [profile] != "" {
    mutate {
      replace => {
        "profile_label.key" => "Profile"
        "profile_label.value.string_value" => "%{profile}"
      }
      on_error => "profile_value_invalid"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "profile_label"
      }
      on_error => "profile_value_invalid"
    }
  }
  if [direction] in ["incoming", "inbound", "response"] {
    mutate {
      replace => {
        "network.direction" => "INBOUND"
      }
      on_error => "direction_value_invalid"
    }
  }
  else if [direction] in ["outgoing", "outbound"] {
    mutate {
      replace => {
        "network.direction" => "OUTBOUND"
      }
      on_error => "direction_invalid"
    }
  }
  if [action] == "blocked" {
    mutate {
      replace => {
        "action" => "BLOCK"
      }
      on_error => "action_value_invalid"
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
      on_error => "action_value_invalid"
    }
  }
  else if [action] in ["accept","passthrough"] {
    mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }
  else if [action] == "auth-logon" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
      }
      on_error => "action_value_invalid"
    }
  }
  else if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "action_details_value_invalid"
    }
  }
  if [status] =~ "(?i)fail" {
    mutate {
      replace => {
        "action" => "FAIL"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
      on_error => "status_value_invalid"
    }
  }
  else if [status] =~ "(?i)(allow|success)" {
    mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
      on_error => "status_action_value_invalid"
    }
  }
  if [url] != "" {
    mutate {
      replace => {
        "target.url" => "%{url}"
      }
      on_error => "no_resource_url"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{hostname}"
      }
      on_error => "no_resource_hostname"
    }
  }
  if [agent] != "" {
    mutate {
      replace => {
        "agent_label.key" => "Agent"
        "agent_label.value.string_value" => "%{agent}"
      }
      on_error => "agent_value_invalid"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "agent_label"
      }
      on_error => "agent_value_invalid"
    }
  }
  if [filtername] != "" and [filtername] != "-" {
    mutate {
      replace => {
        "filter_name_label.key" => "FilterName"
        "filter_name_label.value" => "%{filtername}"
      }
      on_error => "filter_name_label_error"
    }
    mutate {
      merge => {
        "security_result.about.resource.attribute.labels" => "filter_name_label"
      }
      on_error => "filter_name_label_merge_error"
    }
  }
  if [filename] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{filename}"
      }
      on_error => "no_filename"
    }
  }
  if [filesize] != "" {
    mutate {
      convert => {
        "filesize" => "uinteger"
      }
      on_error => "no_filesize"
    }
    mutate {
      rename => {
         "filesize" => "target.file.size"
      }
      on_error => "no_filesize"
    }
  }
  if [filetype] != "" {
    mutate {
      replace => {
        "target.file.mime_type" => "%{filetype}"
      }
      on_error => "no_filetype"
    }
  }
  if [msg] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{msg}"
      }
      on_error => "no_msg"
    }
  }
  if [subtype] != "" {
    mutate {
      replace => {
        "subtype_label.value.string_value" => "%{subtype}"
      }
      on_error => "subtype_value_invalid"
    }
    if ![subtype_value_invalid] {
      mutate {
        replace => {
          "subtype_label.key" => "Subtype"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "subtype_label"
        }
        on_error => "subtype_merge_invalid"
      }
    }
  }
  if [logdesc] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{logdesc}"
      }
      on_error => "logdesc_value_invalid"
    }
  }
  if [reason] != "" {
    mutate {
      replace => {
        "reason_label.key" => "Reason"
        "reason_label.value" => "%{reason}"
      }
      on_error => "reason_value_error"
    }
    if ![reason_value_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "reason_label"
        }
        on_error => "reason_value_invalid"
      }
    }
  }
  if [catdesc] != "" {
    mutate {
      replace => {
        "catdesc_label.value.string_value" => "%{catdesc}"
      }
      on_error => "catdesc_value_invalid"
    }
    if ![catdesc_value_invalid] {
      mutate {
        replace => {
          "catdesc_label.key" => "CatDesc"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "catdesc_label"
        }
        on_error => "catdesc_merge_invalid"
      }
    }
  }
  if [sentbyte] != "" {
    mutate {
      convert => {
        "sentbyte" => "uinteger"
      }
      on_error => "no_sentbyte"
    }
    mutate {
      rename => {
         "sentbyte" => "network.sent_bytes"
      }
      on_error => "not_sentbyte"
    }
  }
  if [rcvdbyte] != "" {
    mutate {
      convert => {
        "rcvdbyte" => "uinteger"
      }
      on_error => "no_rcvdbyte"
    }
    mutate {
      rename => {
         "rcvdbyte" => "network.received_bytes"
      }
      on_error => "not_rcvdbyte"
    }
  }
  if [referralurl] != "" {
    mutate {
      replace => {
        "network.http.referral_url" => "%{referralurl}"
      }
      on_error => "no_referralurl"
    }
  }
  if [httpmethod] in ["GET", "POST"] {
    mutate {
      replace => {
      "network.http.method" => "%{httpmethod}"
      }
      on_error => "no_httpmethod"
    }
  }
  if [reqtype] != "" {
    mutate {
      replace => {
        "reqtype_label.value.string_value" => "%{reqtype}"
      }
      on_error => "no_reqtype"
    }
    if ![no_reqtype] {
      mutate {
        replace => {
          "reqtype_label.key" => "ReqType"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "reqtype_label"
        }
        on_error => "reqtype_merge_invalid"
      }
    }
  }
  if [ratemethod] != "" {
    mutate {
      replace => {
        "ratemethod_label.value" => "%{ratemethod}"
      }
      on_error => "no_ratemethod"
    }
    if ![no_ratemethod] {
      mutate {
        replace => {
          "ratemethod_label.key" => "RateMethod"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "ratemethod_label"
        }
        on_error => "ratemethod_merge_invalid"
      }
    }
  }
  if [method] != "" {
    mutate {
      replace => {
        "method_label.key" => "method"
        "method_label.value" => "%{method}"
      }
      on_error => "no_method"
    }
    if ![no_method] {
      mutate {
        merge => {
          "security_result.detection_fields" => "method_label"
        }
        on_error => "method_merge_invalid"
      }
    }
  }
  if [cat] != "" {
    mutate {
      replace => {
        "cat_label.value" => "%{cat}"
      }
      on_error => "no_cat"
    }
    if ![no_cat] {
      mutate {
        replace => {
          "cat_label.key" => "Cat"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "cat_label"
        }
        on_error => "cat_merge_invalid"
      }
    }
  }

  if [has_network] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
