# Product: SPUR_FEEDS
# Category: Vulnerability Management
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-05-10
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "ip" => ""
      "client.behaviors" => ""
      "client.proxies" => ""
      "location.city" => ""
      "location.state" => ""
      "location.country" => ""
      "tunnels" => ""
      "organization" => ""
      "services.0" => ""
      "risks" => ""
      "token_ip_geo_artifact" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_error"
  }

  if [ip] != "" {
    mutate {
      replace => {
        "token_ip_geo_artifact.ip" => "%{ip}"
        "metadata.event_type" => "STATUS_UPDATE"
      }
      merge => {
        "principal.ip" => "ip"
        "principal.asset.ip" => "ip"
      }
      on_error => "no_ip"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [location][country] != "" {
    mutate {
      replace => {
        "token_ip_geo_artifact.location.country_or_region" =>
        "%{location.country}"
      }
      on_error => "no_country"
    }
  }

  if [location][city] != "" {
    mutate {
      replace => {
        "token_ip_geo_artifact.location.city" => "%{location.city}"
      }
      on_error => "no_city"
    }
  }

  if [location][state] != "" {
    mutate {
      replace => {
        "token_ip_geo_artifact.location.state" => "%{location.state}"
      }
      on_error => "no_state"
    }
  }

  if [organization] != "" {
    mutate {
      replace => {
        "token_ip_geo_artifact.as_owner" => "%{organization}"
      }
      on_error => "no_organization"
    }
  }

  if [client][behaviors] != "" {
    for behavior in client.behaviors {
      mutate {
        merge => {
          "artifact_client.behaviors" => "behavior"
        }
        on_error => "no_behavior"
      }
    }
  }

  if [client][proxies] != "" {
    for proxy in client.proxies {
      mutate {
        merge => {
          "artifact_client.proxies" => "proxy"
        }
        on_error => "no_proxy"
      }
    }
  }

  if [tunnels] != "" {
    for tunnel in tunnels {
      mutate {
        replace => {
          "tunnels_data" => ""
        }
      }
      mutate {
        replace => {
          "tunnels_data.provider" => "%{tunnel.operator}"
        }
        on_error => "no_operator"
      }
      mutate {
        replace => {
          "tunnels_data.type" => "%{tunnel.type}"
        }
        on_error => "no_type"
      }
    }
    mutate {
      merge => {
        "token_ip_geo_artifact.tunnels" => "tunnels_data"
      }
      on_error => "no_tunnels"
    }
  }

  if [risks] != "" {
    for risk in risks {
      mutate {
        merge => {
          "token_ip_geo_artifact.risks" => "risk"
        }
        on_error => "no_risk"
      }
    }
  }

  mutate {
    rename => {
      "artifact_client" => "token_ip_geo_artifact.artifact_client"
    }
  }

  mutate {
    convert => {
      "tunnels.0.anonymous" => "string"
    }
    on_error => "convert_failure"
  }

  mutate {
    replace => {
      "token_ip_geo_artifact.anonymous" => "%{tunnels.0.anonymous}"
    }
    on_error => "no_anonymous_field"
  }


  mutate {
    convert => {
      "token_ip_geo_artifact.anonymous" => "boolean"
    }
  }

  if [services][0] in ["AFP", "AMQP", "APPC", "ATOM", "BEEP", "BIT_TORRENT",
      "BITCOIN", "CFDP", "COAP", "DCERPC", "DDS", "DEVICE_NET", "DHCP",
      "DNS", "E_DONKEY", "ENRP", "FAST_TRACK", "FINGER", "FREENET", "FTAM",
      "GOPHER", "H323", "HL7", "HTTP", "HTTPS", "IRCP", "KADEMLIA", "KRB5",
      "LDAP", "LPD", "MIME", "MODBUS", "MQTT", "NETCONF", "NFS", "NIS",
      "NNTP", "NTCIP", "NTP", "OSCAR", "PNRP", "QUIC", "RDP", "RELP", "RIP",
      "RLOGIN", "RPC", "RTMP", "RTP", "RTPS", "RTSP", "SAP", "SDP", "SIP",
      "SLP", "SMB", "SMTP", "SNTP", "SSH", "SSMS", "STYX", "TCAP", "TDS",
      "TOR", "TSP", "VTP", "WEB_DAV", "WHOIS", "X400", "X500", "XMPP"] {
        mutate {
          replace => {
            "token_ip_geo_artifact.network.application_protocol" =>
            "%{services.0}"
          }
        }
      }

  if [token_ip_geo_artifact] != "" {
    mutate {
      merge => {
        "principal.ip_geo_artifact" => "token_ip_geo_artifact"
      }
      on_error => "failed_merge_orig_cc"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "SPUR_FEEDS"
      "metadata.product_name" => "SPUR_FEEDS"
    }
  }

  mutate {
    rename => {
      "metadata" => "event.idm.read_only_udm.metadata"
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
    }
  }


  mutate {
    merge => {
      "@output" => "event"
    }
  }
}


