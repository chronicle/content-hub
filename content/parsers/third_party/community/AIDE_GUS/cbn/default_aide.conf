# Product: AIDE
# Category: Alert
# Supported Format: SYSLOG
# Reference: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/7/html/security_guide/sec-using-aide#sec-Installing_AIDE
# Last Updated: 2025-03-10
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "host" => ""
      "aidemsg" => ""
      "total_files" => ""
      "added_files" => ""
      "removed_files" => ""
      "changed_files" => ""
      "path" => ""
      "old_size" => ""
      "new_size" => ""
      "old_timestamp" => ""
      "new_timestamp" => ""
      "old_md5" => ""
      "new_md5" => ""
      "old_sha256" => ""
      "new_sha256" => ""
      "old_perms" => ""
      "new_perms" => ""
      "old_acl" => ""
      "new_acl" => ""
      "old_inode" => ""
      "new_inode" => ""
      "file_path" => ""
    }
  }

  grok {
    match => {
      "message" => "%{DATA}: %{UNIXPATH:file_path}"
    }
    overwrite => ["file_path"]
    on_error => "grok_parse_error"
  }
  if [file_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.file.full_path" => "%{file_path}"
      }
      on_error => "no_file_path"
    }
  }

  grok {
    match => {
      "message" => [
        "^<%{INT}>(%{INT} )?(%{TIMESTAMP_ISO8601}|%{ISO8601_TIMEZONE}|%{SYSLOGTIMESTAMP}) %{HOSTNAME:host} aide - - - %{GREEDYDATA:aidemsg}"
      ]
    }
    overwrite => ["host", "aidemsg"]
    on_error => "header_parsing_error"
  }

  if ![header_parsing_error] {
    # header matches, treat as aide log
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "aide"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
      }
      on_error => "no_hostname"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "AIDE"
        "event.idm.read_only_udm.metadata.product_name" => "AIDE"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }

    grok {
      match => {
        "aidemsg" => [
          "^( )?summary;total_number_of_files=%{DATA:total_files};added_files=%{DATA:added_files};removed_files=%{DATA:removed_files};changed_files=%{DATA:changed_files}$",
          "^( )?AIDE %{GREEDYDATA} found differences between database and filesystem!!$",
          "^( )?(dir|file)=%{DATA:path};(Size_old=%{DATA:old_size};Size_new=%{DATA:new_size};)?Mtime_old=%{TIMESTAMP_ISO8601:old_timestamp}( %{ISO8601_TIMEZONE})?;Mtime_new=%{TIMESTAMP_ISO8601:new_timestamp}( %{ISO8601_TIMEZONE})?;Inode_old=%{DATA:old_inode};Inode_new=%{DATA:new_inode}MD5_old=%{DATA:old_md5};MD5_new=%{DATA:new_md5};%{GREEDYDATA}SHA256_old=%{DATA:old_sha256};SHA256_new=%{DATA:new_sha256}$",
          "^( )?(dir|file)=%{DATA:path};Perm_old=%{DATA:old_perms};Perm_new=%{DATA:new_perms};ACL_old=%{DATA:old_acl};ACL_new=%{DATA:new_acl}$",
          "^( )?(dir|file)=%{DATA:path};Inode_old=%{DATA:old_inode};Inode_new=%{DATA:new_inode}$",
          "^( )?(dir|file)=%{DATA:path};Mtime_old=%{TIMESTAMP_ISO8601:old_timestamp}( %{ISO8601_TIMEZONE})?;Mtime_new=%{TIMESTAMP_ISO8601:new_timestamp}( %{ISO8601_TIMEZONE})?$",
          "^( )?(dir|file)=%{DATA:path};( )?added$"
        ]
      }
      overwrite => ["total_files", "added_files", "removed_files", "changed_files", "path", "old_size", "new_size", "old_timestamp", "new_timestamp", "old_md5", "new_md5", "old_sha256", "new_sha256", "old_perms", "new_perms", "old_acl", "new_acl", "old_inode", "new_inode"]
      on_error => "unknown_aide_format"
    }

    if ![unknown_aide_format] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }

    if [path] != "" {
      # if path exits, its a change detail log
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.file.full_path" => "%{path}"
        }
        on_error => "no_path"
      }
      if [aidemsg] =~ /added$/ {
        mutate {
          replace => {
            "sr.summary" => "A file or directory has been added"
          }
        }
      } else {
        mutate {
          replace => {
            "sr.summary" => "A file or directory has changed"
          }
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "sr"
        }
        on_error => "no_security_result"
      }
    }

    if [aidemsg] =~ /found differences/ {
      # if "found differences" its a change notice log
      mutate {
        replace => {
          "sr.summary" => "AIDE detected filesystem changes"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "sr"
        }
        on_error => "no_security_result"
      }
    }


    if ([total_files] != "" and [added_files] != "" and [removed_files] != "" and [changed_files] != "") {
      # process summary log
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          "sr.summary" => "AIDE summary of detected filesystem changes"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "sr"
        }
        on_error => "no_security_result"
      }

      mutate {
        replace => {
          "total_label.key" => "Total_Files"
          "total_label.value" => "%{total_files}"
        }
        on_error => "no_total_files"
      }

      if ![no_total_files] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.attribute.labels" => "total_label"
          }
          on_error => "no_total_label"
        }
      }
      mutate {
        replace => {
          "added_label.key" => "Added_Files"
          "added_label.value" => "%{added_files}"
        }
        on_error => "no_added_files"
      }

      if ![no_added_files] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.attribute.labels" => "added_label"
          }
          on_error => "no_added_label"
        }
      }
      mutate {
        replace => {
          "removed_label.key" => "Removed_Files"
          "removed_label.value" => "%{removed_files}"
        }
        on_error => "no_removed_files"
      }
      if ![no_removed_files] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.attribute.labels" => "removed_label"
          }
          on_error => "no_removed_label"
        }
      }
      mutate {
        replace => {
          "changed_label.key" => "Changed_Files"
          "changed_label.value" => "%{changed_files}"
        }
        on_error => "no_changed_files"
      }
      if ![no_changed_files] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.attribute.labels" => "changed_label"
          }
          on_error => "no_changed_label"
        }
      }
    }
    # end of summary log processing

    if ( [old_timestamp] != "" and [new_timestamp] != "") {
      # process timestamp changes
      mutate {
        replace => {
          "old_ts_label.key" => "Timestamp"
          "old_ts_label.value" => "%{old_timestamp}"
        }
        on_error => "no_old_timestamp"
      }
      mutate {
        replace => {
          "new_ts_label.key" => "Timestamp"
          "new_ts_label.value" => "%{new_timestamp}"
        }
        on_error => "no_new_timestamp"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "old_ts_label"
        }
        on_error => "no_old_ts_label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "new_ts_label"
        }
        on_error => "no_new_ts_label"
      }
    }

    if ( [old_perms] != "" and [new_perms] != "") {
      # process file or directory permissions change
      mutate {
        replace => {
          "old_perms_label.key" => "Permissions"
          "old_perms_label.value" => "%{old_perms}"
        }
        on_error => "no_old_perms"
      }
      mutate {
        replace => {
          "new_perms_label.key" => "Permissions"
          "new_perms_label.value" => "%{new_perms}"
        }
        on_error => "no_new_perms"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "old_perms_label"
        }
        on_error => "no_old_perms_label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "new_perms_label"
        }
        on_error => "no_new_perms_label"
      }
    }

    if ( [old_acl] != "" and [new_acl] != "") {
      # process ACL changes
      mutate {
        replace => {
          "old_acl_label.key" => "ACL"
          "old_acl_label.value" => "%{old_acl}"
        }
        on_error => "no_old_acl"
      }
      mutate {
        replace => {
          "new_acl_label.key" => "ACL"
          "new_acl_label.value" => "%{new_acl}"
        }
        on_error => "no_new_acl"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "old_acl_label"
        }
        on_error => "no_old_acl_label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "new_acl_label"
        }
        on_error => "no_new_acl_label"
      }
    }

    if ( [old_size] != "" and [new_size] != "") {
      # Process file size difference
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.file.size" => "%{old_size}"
        }
        on_error => "no_old_size"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.size" => "%{new_size}"
        }
        on_error => "no_new_size"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.file.size" => "uinteger"
        }
        on_error => "no_old_size"
      }
      if [no_old_size] {
        mutate {
          rename => {
            "event.idm.read_only_udm.principal.file.size" => "sizedata"
          }
        }
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.file.size" => "uinteger"
        }
        on_error => "no_new_size"
      }
      if [no_new_size] {
        mutate {
          rename => {
            "event.idm.read_only_udm.target.file.size" => "sizedata_target"
          }
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.file.full_path" => "%{path}"
        "event.idm.read_only_udm.target.file.full_path" => "%{path}"
      }
      on_error => "no_path"
    }

    if ( [old_md5] != "" and [new_md5] != "" ) {
      # Process MD5 change
      mutate {
        replace => {
          "old_md5_label.key" => "MD5"
          "old_md5_label.value" => "%{old_md5}"
        }
        on_error => "no_old_md5"
      }
      mutate {
        replace => {
          "new_md5_label.key" => "MD5"
          "new_md5_label.value" => "%{new_md5}"
        }
        on_error => "no_new_md5"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "old_md5_label"
        }
        on_error => "no_old_md5_label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "new_md5_label"
        }
        on_error => "no_new_md5_label"
      }
    }

    if ( [old_sha256] != "" and [new_sha256] != "" ) {
      # Process SHA256 change
      mutate {
        replace => {
          "old_sha256_label.key" => "SHA256"
          "old_sha256_label.value" => "%{old_sha256}"
        }
        on_error => "no_old_sha256"
      }
      mutate {
        replace => {
          "new_sha256_label.key" => "SHA256"
          "new_sha256_label.value" => "%{new_sha256}"
        }
        on_error => "no_new_sha256"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "old_sha256_label"
        }
        on_error => "no_old_sha256_label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "new_sha256_label"
        }
        on_error => "no_new_sha256_label"
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.vendor_name" => "AIDE"
        "event.idm.read_only_udm.metadata.product_name" => "AIDE"
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
