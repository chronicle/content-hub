# Product: UNIFI_AP
# Category: Switches and Routers
# Supported Format: SYSLOG + KV, SYSLOG + JSON
# Reference: https://help.ui.com/hc/en-us/articles/204959834-UniFi-How-to-View-Log-Files
# Last Updated: 2025-11-24
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "SRC" => ""
      "DST" => ""
      "FLOWLBL" => ""
      "HOPLIMIT" => ""
      "WINDOW" => ""
      "ID" => ""
      "MAC" => ""
      "intermediary" => ""
      "PROTO" => ""
      "IN" => ""
      "kvdata" => ""
      "mac" => ""
      "eventtype" => ""
      "description" => ""
      "data1" => ""
      "hostname" => ""
      "auth_ts" => ""
      "vap" => ""
      "json_data" => ""
      "message_type" => ""
      "event_type" => ""
      "security_result" => ""
      "time" => ""
      "product_event_type" => ""
      "product_version" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "principal_mac" => ""
      "details" => ""
      "assoc_status" => ""
      "event_id" => ""
      "dns_resp_seen" => ""
      "avg_rssi" => ""
      "pid" => ""
    }
  }
  mutate {
    gsub => ["message", "\\r\\n", ""]
  }
  mutate {
    gsub => ["message", "\\n", ""]
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{GREEDYDATA:data1},%{DATA:product_version}: (?P<product_event_type>switch): %{GREEDYDATA:description}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{GREEDYDATA:data1},%{DATA:product_version}: %{WORD:product_event_type}: stahtd\\[%{INT:pid}\\]%{GREEDYDATA}stahtd_dump_event\\(\\):%{GREEDYDATA:json_data} - %{GREEDYDATA}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{GREEDYDATA:data1},%{DATA:product_version}: %{WORD:product_event_type}: stahtd\\[%{INT:pid}\\]%{GREEDYDATA}stahtd_dump_event\\(\\):%{GREEDYDATA:json_data}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{GREEDYDATA:data1},%{DATA:product_version} %{WORD:product_event_type}: %{DATA:auth_ts} %{WORD:vap}: track: %{MAC:mac}: %{GREEDYDATA:description}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{DATA:data1} %{DATA:principal_mac},%{DATA:product_version}: %{DATA:product_event_type}\\[%{INT:pid}\\]: %{DATA:description}: {%{GREEDYDATA:json_data}}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{DATA:data1} %{DATA:principal_mac},%{DATA:product_version}: %{DATA:product_event_type}\\[%{INT:pid}\\]: %{GREEDYDATA:auth_ts}: %{GREEDYDATA:description}: %{GREEDYDATA:details}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{DATA:data1} %{DATA:principal_mac},%{DATA:product_version}: %{DATA:product_event_type}: \\[%{DATA:pid}\\] %{GREEDYDATA:auth_ts}: %{GREEDYDATA:details}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{GREEDYDATA:data1},%{DATA:product_version} %{WORD:product_event_type}: %{DATA:auth_ts} %{GREEDYDATA:kvdata}"
        "<%{INT}>(?P<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{DATA:data1} %{DATA:principal_mac},%{DATA:product_version}: %{DATA:product_event_type}\\[%{DATA:pid}\\]: %{GREEDYDATA:details}"
        "<%{INT}>(?<time>%{MONTH}\\s+%{MONTHDAY} %{TIME}) %{GREEDYDATA:data1}\\[%{DATA:test}\\] %{GREEDYDATA:kvdata}"
      ]
    }
    overwrite => ["kvdata","mac","description","data1","auth_ts","vap","json_data","time","product_event_type","product_version","principal_mac","details","pid"]
    on_error => "grok_failure"
  }

  if [time] != "" {
    date {
      match => ["time", "MMM d HH:mm:ss", "MMM  d HH:mm:ss", "MMM  dd HH:mm:ss","MMM dd HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      rebase => true
    }
  }

  if [kvdata] != "" {
    kv {
      source => "kvdata"
      value_split => "="
      field_split => " "
      on_error => "kv_failure"
    }
  }
  if [details] != "" {
    kv {
      source => "details"
      value_split => "="
      field_split => " "
      on_error => "kv_details_failure"
    }
  }

  if [json_data] != "" {
    json {
      source   => "json_data"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] {
      mutate {
        replace => {
          "json_data" => "{%{json_data}}"
        }
        on_error => "json_data_invalid"
      }
      json {
        source   => "json_data"
        array_function => "split_columns"
        on_error => "not_json_retry"
      }
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_invalid"
    }
  }

  if [SRC] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "SRC"
        "event.idm.read_only_udm.principal.asset.ip" => "SRC"
      }
      on_error => "no_src_ip"
    }
    if ![no_src_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [DST] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "DST"
        "event.idm.read_only_udm.target.asset.ip" => "DST"
      }
      on_error => "no_dst_ip"
    }
    if ![no_dst_ip] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  mutate {
    convert => {
      "DPT" => "integer"
      "SPT" => "integer"
    }
  }
  mutate {
    rename => {
      "DPT" => "event.idm.read_only_udm.target.port"
      "SPT" => "event.idm.read_only_udm.principal.port"
    }
  }

  if [PROTO] not in ["ICMPv6","47",""] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{PROTO}"
      }
      on_error => "proto_invalid"
    }
  }
  else if [PROTO] == "ICMPv6" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "ICMP6"
      }
      on_error => "proto_invalid"
    }
  }
  else if [PROTO] == "47" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "GRE"
      }
      on_error => "proto_invalid"
    }
  }

  if [mac] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "mac"
      }
      on_error => "no_principal_mac"
    }
    if ![no_principal_mac] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [MAC] != "" {
    grok {
      match => {
        "MAC" => [
          "%{IP:ip}:%{MAC:mac}"
          "%{MAC:mac}"
        ]
      }
      overwrite => ["mac"]
    }

    mutate {
      merge => {
        "intermediary.ip" => "ip"
      }
      on_error => "no_intermediary_ip"
    }

    mutate {
      merge => {
        "intermediary.mac" => "mac"
      }
      on_error => "no_intermediary_mac"
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }

  if [FLOWLBL] != "" and [FLOWLBL] != "0" {
    mutate {
      replace => {
        "additional_field_0.key" => "FLOWLBL"
        "additional_field_0.value.string_value" => "%{FLOWLBL}"
      }
      on_error => "flowlbl_invalid"
    }
    if ![flowlbl_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_0"
        }
        on_error => "flowlbl_invalid_merge"
      }
    }
  }

  if [HOPLIMIT] != "" {
    mutate {
      replace => {
        "additional_field_1.key" => "HOPLIMIT"
        "additional_field_1.value.string_value" => "%{HOPLIMIT}"
      }
      on_error => "hoplimit_invalid"
    }
    if ![hoplimit_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_1"
        }
        on_error => "hoplimit_invalid_merge"
      }
    }
  }

  if [IN] != "" {
    mutate {
      replace => {
        "additional_field_2.key" => "IN"
        "additional_field_2.value.string_value" => "%{IN}"
      }
      on_error => "in_invalid"
    }
    if ![in_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_2"
        }
        on_error => "in_invalid_merge"
      }
    }
  }

  if [WINDOW] != "" {
    mutate {
      replace => {
        "additional_field_3.key" => "WINDOW Size"
        "additional_field_3.value.string_value" => "%{WINDOW}"
      }
      on_error => "window_invalid"
    }
    if ![window_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_3"
        }
        on_error => "window_invalid_merge"
      }
    }
  }

  if [ID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{ID}"
      }
      on_error => "id_invalid"
    }
  }

  if [message_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{message_type}"
      }
      on_error => "message_type_invalid"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "description_invalid"
    }
  }

  if [data1] != "" {
    grok {
      match => {
        "data1" => ["%{HOSTNAME:hostname} %{GREEDYDATA:principal_mac}"
          "%{HOSTNAME:hostname}"]
      }
      on_error => "_"
      overwrite => ["hostname", "principal_mac"]
    }
  }
  if [principal_mac] != "" {
    grok {
      match => {
        "principal_mac" => "^%{MAC:principal_mac}:?$"
      }
      overwrite => ["principal_mac"]
      on_error => "not_mac_format"
    }
    if [not_mac_format] {
      mutate {
        remove_field => ["not_mac_format"]
      }
      mutate {
        gsub => ["principal_mac", "([0-9a-zA-Z]{2})", "$1:"]
      }
      grok {
        match => {
          "principal_mac" => "%{MAC:principal_mac}:"
        }
        overwrite => ["principal_mac"]
        on_error => "not_mac_format"
      }
    }
    if ![not_mac_format] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.mac" => "principal_mac"
        }
        on_error => "principal_mac_invalid"
      }
      if ![principal_mac_invalid] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "hostname_invalid"
    }
  }

  if [auth_ts] != "" {
    mutate {
      gsub => ["auth_ts","\\]",""]
    }
    mutate {
      gsub => ["auth_ts","\\[",""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "Auth ts - %{auth_ts}"
      }
      on_error => "auth_ts_invalid"
    }
  }

  if [vap] != "" {
    mutate {
      replace => {
        "label.key" => "Vap"
        "label.value" => "%{vap}"
      }
      on_error => "vap_invalid"
    }
    if ![vap_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.metadata.ingestion_labels" => "label"
        }
        on_error => "label_invalid"
      }
    }
  }
  if [details] != "" {
    mutate {
      replace => {
        "details_label.key" => "details"
        "details_label.value.string_value" => "%{details}"
      }
      on_error => "details_invalid"
    }
    if ![details_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "details_label"
        }
        on_error => "details_label_invalid"
      }
    }
  }
  if [assoc_status] != "" {
    mutate {
      replace => {
        "assoc_status_label.key" => "assoc_status"
        "assoc_status_label.value" => "%{assoc_status}"
      }
      on_error => "assoc_status_invalid"
    }
    if ![assoc_status_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "assoc_status_label"
        }
        on_error => "assoc_status_label_invalid"
      }
    }
  }
  if [event_id] != "" {
    mutate {
      convert => {
        "event_id" => "string"
      }
      on_error => "event_id_invalid_convert"
    }
    mutate {
      replace => {
        "event_id_label.key" => "event_id"
        "event_id_label.value.string_value" => "%{event_id}"
      }
      on_error => "event_id_invalid"
    }
    if ![event_id_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_id_label"
        }
        on_error => "event_id_label_invalid"
      }
    }
  }
  if [dns_resp_seen] != "" {
    mutate {
      replace => {
        "dns_resp_seen_label.key" => "dns_resp_seen"
        "dns_resp_seen_label.value" => "%{dns_resp_seen}"
      }
      on_error => "dns_resp_seen_invalid"
    }
    if ![dns_resp_seen_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "dns_resp_seen_label"
        }
        on_error => "dns_resp_seen_label_invalid"
      }
    }
  }
  if [avg_rssi] != "" {
    mutate {
      convert => {
        "avg_rssi" => "string"
      }
      on_error => "avg_rssi_invalid_convert"
    }
    mutate {
      replace => {
        "avg_rssi_label.key" => "avg_rssi"
        "avg_rssi_label.value" => "%{avg_rssi}"
      }
      on_error => "avg_rssi_invalid"
    }
    if ![avg_rssi_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "avg_rssi_label"
        }
        on_error => "avg_rssi_label_invalid"
      }
    }
  }
  if [pid] != "" {
    mutate {
      convert => {
        "pid" => "string"
      }
      on_error => "pid_invalid_convert"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
      on_error => "pid_invalid"
    }
  }

  if [event_type] != ""{
    mutate{
      replace => {
        "security_result.action_details" => "%{event_type}"
       }
     }
   }

  if [event_type] == "failure" {
    mutate {
      replace => {
        "sr_action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
    }
  }  else if [event_type] == "fixup" {
    mutate {
      replace => {
        "sr_action" => "ALLOW_WITH_MODIFICATION"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
    }
  }

  if [security_result] !=""{
    mutate {
       merge => {
         "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_invalid"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [product_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{product_version}"
      }
      on_error => "product_version_invalid"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "UNIFI_AP"
      "event.idm.read_only_udm.metadata.vendor_name" => "UNIFI"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
