# Product: CYLANCE PROTECT
# Category: Alerts
# Supported Format: SYSLOG + KV
# Reference: https://docs.blackberry.com/content/dam/docs-blackberry-com/release-pdfs/en/cylance-products/syslog-guides/Cylance%20Syslog%20Guide%20v2.0%20rev12.pdf
# Last Updated: 2025-05-16
# Copyright 2025 Google SecOps

filter {
  grok {
    match => {
      "message" => "(?P<message><.*)"
    }
    overwrite => ["message"]
    on_error => "grok_message_error"
  }

  mutate {
    gsub => ["message", '\"', "" ]
  }

  mutate {
    gsub => ["message", "(<\\d+>)", "\",\"$1"]
  }

  mutate {
    gsub => ["message", "^\",", ""]
  }

  mutate {
    gsub => ["message", "\\\\", "\\\\"]
  }
  mutate {
    gsub => ["message", "\\t", ""]
  }
  if [grok_message_error] {
    mutate {
      replace => {
        "message" => "{\"message\":[\"%{message}\"]}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "message" => "{\"message\":[%{message}\"]}"
      }
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
  }

  for msg in message {
    mutate {
      replace => {
        "event1" => ""
        "security_result" => ""
        "kvdata" => ""
        "intermediary" => ""
        "Severity" => ""
        "target_process_command_line" => ""
      }
    }

    grok {
      match => {
        "msg" => [
          "(?P<syslogtime>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}T%{HOUR}:%{MINUTE}:%{SECOND}.*) %{IPORHOST:cylancehost} Cylance((?P<product_name>PROTECT|OPTICS)) - - (-|\\[.*?\\]) %{GREEDYDATA:kvdata}"
        ]
      }
      overwrite => ["kvdata", "syslogtime", "cylancehost", "product_name"]
      on_error => "grok_syslog_fail"
    }
    if [grok_syslog_fail] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    mutate {
      convert => {
        "cylancehost" => "ipaddress"
      }
      on_error => "dvcNotIp"
    }

    if [dvcNotIp] == true {
      mutate {
        replace => {
          "intermediary.hostname" => "%{cylancehost}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "int_ip" => "%{cylancehost}"
        }
        merge => {
          "intermediary.ip" => "int_ip"
        }
      }
    }

    if [intermediary] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.intermediary" => "intermediary"
        }
      }
    }

    kv {
      source => "kvdata"
      value_split => ":"
      field_split => ","
      on_error => "kv_fail"
    }

    grok {
      match => { "kvdata" => [ "Zone Names: \\((?P<zone_names>.*?)\\)(,\\s|$)" ] }
      overwrite => ["zone_names"]
      on_error => "grok_message_fail"
    }
    grok {
      match => { "kvdata" => [ "Logged On Users: \\((?P<logged_on_users>.*?)\\)(,\\s|$)" ] }
      overwrite => ["logged_on_users"]
      on_error => "grok_message_fail"
    }
    grok {
      match => { "msg" => [ "IP Address: \\((?P<ip_address>.*?)\\)(,\\s|$)" ] }
      on_error => "grok_ip_fail"
    }

    mutate {
      replace => {
        "security_result.summary" => ""
        "event_type" => "%{Event Type}"
        "event_name" => "%{Event Name}"
      }
    }

    # --------------------------------------------
    # Parse date
    date {
      match => ["syslogtime", "RFC3339"]
    }

    # ----------------------------------------------------------------------
    # Field Assignment

    # Default Values
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.vendor_name" => "Cylance"
        "event1.idm.read_only_udm.metadata.product_name" => "%{product_name}"
        "event1.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
        "event1.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_log_id" => "%{Event Id}"
      }
      on_error => "event_id_not_present"
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.hostname" =>  "%{Device Name}"
      }
      on_error => "principal_device_name_not_set"
    }
    if [principal_device_name_not_set] {
      mutate {
        gsub => ["Device Names" , "[()]" ,""]
      }
      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.hostname" =>  "%{Device Names}"
        }
        on_error => "device_names_not_present"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_version" => "%{Agent Version}"
      }
      on_error => "agent_version_not_present"
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.asset_id" =>  "Cylance:%{Device Id}"
      }
      on_error => "principal_device_id_not_set"
    }
    if [principal_device_id_not_set] {
      mutate {
        gsub => ["Device Ids" , "[()]" ,""]
      }
      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.asset_id" =>  "Cylance:%{Device Ids}"
        }
        on_error => "principal_device_ids_not_set"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.user.userid" =>  "%{User Name}"
      }
      on_error => "user_name_not_present"
    }

    mutate {
      replace => {
        "principal_user" => "%{User}"
      }
      on_error => "principal_user_not_present"
    }
    if ![principal_user_not_present] {
      if [principal_user] != "" {
        grok {
          match => {
            "principal_user" => "%{GREEDYDATA:user_name} \\(%{GREEDYDATA:user_email}\\)"
          }
          on_error => "user_name_grok_fail"
        }
        if ![user_name_grok_fail] {
          mutate {
            replace => {
              "event1.idm.read_only_udm.principal.user.userid" => "%{user_name}"
            }
            merge => {
              "event1.idm.read_only_udm.principal.user.email_addresses" => "user_email"
            }
          }
        }
      }
    }

    mutate {
      replace => {
        "operating_sys" => "%{OS}"
      }
      on_error => "os_not_present"
    }
    if ![os_not_present] {
      if [OS] =~ "Windows" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.platform" => "WINDOWS"
          }
        }
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.platform_version" => "%{Kernel Version}"
      }
      on_error => "kernel_version_not_present"
    }

    mutate {
      replace => {
        "instigating_process_sha256" => "%{Instigating Process ImageFileSha256}"
      }
      on_error => "instigating_process_sha256_not_present"
    }
    if ![instigating_process_sha256_not_present] {
      mutate {
        lowercase => [ "instigating_process_sha256" ]
      }
      if [instigating_process_sha256] != "unknown" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.process.file.sha256" => "%{instigating_process_sha256}"
          }
          on_error => "file_sha256_not_present"
        }
      }
    }
    mutate {
      lowercase => ["SHA256","MD5"]
    }
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.process.file.sha256" => "%{SHA256}"
      }
      on_error => "field__SHA256_not_present"
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.process.file.md5" => "%{MD5}"
      }
      on_error => "field_MD5_not_present"
    }
    mutate {
      replace => {
        "instigating_process_owner" => "%{Instigating Process Owner}"
        "instigating_process_owner_domain" => ""
      }
      on_error => "instigating_process_owner_not_found"
    }

    if ![instigating_process_owner_not_found] {
      grok {
        match => {
          "instigating_process_owner" => [
              "^(?P<instigating_process_owner_domain>[^\/]+)\/\/(?P<instigating_process_owner>[^$]+)$"
           ]
        }
        overwrite => ["instigating_process_owner","instigating_process_owner_domain"]
        on_error => "grok_instigating_user"
      }
      if ![grok_instigating_user] {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.userid" => "%{instigating_process_owner}"
          }
        }
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.administrative_domain" => "%{instigating_process_owner_domain}"
          }
          on_error => "domain_not_present"
        }
      }
      else {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.userid" => "%{instigating_process_owner}"
          }
        }
      }
      mutate {
        replace => {
          "instigating_process_name" => "%{Instigating Process Name}"
        }
        on_error => "instigating_process_name_not_present"
      }
      if ![instigating_process_name_not_present] {
        if [instigating_process_name] != "" {
          mutate {
            replace => {
              "event1.idm.read_only_udm.principal.process.file.full_path" => "%{instigating_process_name}"
            }
            on_error => "instigating_process_name_not_present"
          }
        }
      }
    }

    mutate {
      replace => {
        "target_process_owner" => "%{Target Process Owner}"
      }
      on_error => "target_process_owner_not_found"
    }

    if ![target_process_owner_not_found] {
      grok {
        match => {
          "target_process_owner" => [ "^(?P<target_process_owner_domain>[^\/]+)\/\/(?P<target_process_owner>[^$]+)$" ]
        }
        overwrite => ["target_process_owner"]
        on_error => "grok_target_optics_user"
      }
      mutate {
        replace => {
          "event1.idm.read_only_udm.target.user.userid" => "%{target_process_owner}"
        }
      }
      if ![grok_target_optics_user] {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.administrative_domain" => "%{target_process_owner_domain}"
          }
        }
      }
    }

    mutate {
      lowercase => [ "Target Process ImageFileSha256" ]
    }
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.process.file.sha256" => "%{Target Process ImageFileSha256}"
      }
      on_error => "field_not_present"
    }

    mutate {
      replace => {
        "security_result.description" => "Zone_Names: %{zone_names}"
      }
      on_error => "zone_name_not_present"
    }

    mutate {
      replace => {
        "security_result.rule_name" => "%{Policy Name}"
      }
      on_error => "policy_name_not_present"
    }

    mutate {
      replace => {
        "rule_label_interpreter.key" => "Interpreter"
        "rule_label_interpreter.value" => "%{Interpreter}"
      }
      on_error => "interpreter_not_present"
    }
    if ![interpreter_not_present] {
      mutate {
        merge => {
          "security_result.rule_labels" => "rule_label_interpreter"
        }
      }
    }

    mutate {
      replace => {
        "rule_label_interpreter_version.key" => "Interpreter Version"
        "rule_label_interpreter_version.value" => "%{Interpreter Version}"
      }
      on_error => "interpreter_version_not_present"
    }
    if ![interpreter_version_not_present] {
      mutate {
        merge => {
          "security_result.rule_labels" => "rule_label_interpreter_version"
        }
      }
    }

    mutate {
      replace => {
        "logged_on" => "%{logged_on_users}"
      }
      on_error => "logged_on_users_not_present"
    }

    if ![logged_on_users_not_present] {
      if [logged_on_users] != "()" and [logged_on_users] != "" {
        mutate {
          gsub => ["logged_on_users", " ", ""]
        }
        mutate {
          gsub => ["logged_on_users", "[()]", ""]
        }
        mutate {
          gsub => ["logged_on_users", ",", '","']
        }
        mutate {
          gsub => ["logged_on_users", "[\\\\]+", "#"]
        }
        mutate {
          replace => {
            "logged_on_users" => "{\"logged_on_users\":[\"%{logged_on_users}\"]}"
          }
        }
        json {
          source => "logged_on_users"
          array_function => "split_columns"
        }
        for i in logged_on_users {
          mutate {
            replace => {
              "about" => ""
              "domain" => ""
              "username" => ""
            }
          }
          grok {
            match => {
              "i" => ["%{GREEDYDATA:domain}#%{GREEDYDATA:username}"]
            }
            overwrite => ["domain", "username"]
            on_error => "grok_message_fail"
          }
          mutate {
            replace => {
              "about.administrative_domain" => "%{domain}"
              "about.user.userid" => "%{username}"
            }
            on_error => "no_abc"
          }
          mutate {
            merge => {
              "event1.idm.read_only_udm.about" => "about"
            }
          }
        }
      }
    }

    mutate {
      replace => {
        "security_result.severity_details" => "%{Cylance Score}"
        "cylance_score" => "%{Cylance Score}"
      }
      on_error => "cylance_score_not_present"
    }
    if ![cylance_score_not_present] {
      if [cylance_score] != "" and [cylance_score] != "n/a" {
        mutate {
          convert => {
            "cylance_score" => "integer"
          }
        }
        if [cylance_score] > 67 {
          mutate {
            replace => {
              "security_result.severity" => "HIGH"
            }
          }
        }
        else if [cylance_score] > 33 {
          mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
          }
        }
        else {
          mutate {
            replace => {
              "security_result.severity" => "LOW"
            }
          }
        }
      }
    }

    mutate {
      replace => {
        "label_detected_by.key" => "Detected By"
        "label_detected_by.value" => "%{Detected By}"
      }
      on_error => "detected_by_not_present"
    }
    if ![detected_by_not_present] {
      mutate {
        merge => {
          "security_result.detection_fields" => "label_detected_by"
        }
      }
    }

    grok {
      match => {
        "ip_address" => [ "^(?P<ip_address1>[^,]+)(?:,|$)(?:\\s)?(?:(?P<ip_address2>[^,]+)(?:,|$))?(?:\\s)?(?:(?P<ip_address3>[^,]+)(?:,|$))?(?:\\s)?(?:(?P<ip_address4>[^,]+)(?:,|$))?(?:\\s)?(?:(?P<ip_address5>[^,]+)(?:,|$))?" ]
      } on_error => "grokip_address_fail"
    }

    mutate { merge => { "event1.idm.read_only_udm.principal.ip"       =>  "ip_address1" } on_error => "noip_address1" }
    mutate { merge => { "event1.idm.read_only_udm.principal.ip"       =>  "ip_address2" } on_error => "noip_address2" }
    mutate { merge => { "event1.idm.read_only_udm.principal.ip"       =>  "ip_address3" } on_error => "noip_address3" }
    mutate { merge => { "event1.idm.read_only_udm.principal.ip"       =>  "ip_address4" } on_error => "noip_address4" }
    mutate { merge => { "event1.idm.read_only_udm.principal.ip"       =>  "ip_address5" } on_error => "noip_address5" }

    grok {
      match => {
        "MAC Address" => [
          "\\((?P<macAddr1>\\S{2})(?P<macAddr2>\\S{2})(?P<macAddr3>\\S{2})(?P<macAddr4>\\S{2})(?P<macAddr5>\\S{2})(?P<macAddr6>\\S{2})"
        ]
      }
      on_error => "grok_mac_fail"
      overwrite => ["macAddr1","macAddr2","macAddr3","macAddr4", "macAddr5", "macAddr6"]
    }

    mutate {
      replace => {
        "macAddr" => "%{macAddr1}:%{macAddr2}:%{macAddr3}:%{macAddr4}:%{macAddr5}:%{macAddr6}"
      }
      on_error => "mac_not_in_proper_format"
    }
    if ![mac_not_in_proper_format] {
      mutate {
        lowercase => ["macAddr"]
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.mac" => "macAddr"
        }
      }
    }

    # ************************* ScriptControl *************************
    if [event_type] == "ScriptControl" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "SCAN_HOST"
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.target.hostname" => "%{Device Name}"
        }
        on_error => "device_name_not_present"
      }

      mutate {
        replace => {
        "event1.idm.read_only_udm.target.file.full_path" => "%{File Path}" }
        on_error => "file_path_not_present"
      }

      mutate {
        replace => {
          "sr_category" => "SOFTWARE_SUSPICIOUS"
          "sr_action" => "BLOCK"
        }
      }
    }
    # ************************* AuditLog *************************
    else if [event_type] == "AuditLog" {
      if [event_name] =~ "Login" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          }
        }

        mutate {
          replace => {
            "event1.idm.read_only_udm.extensions.auth.type" => "MACHINE"
            "auth_mechanism" => "REMOTE"
            # UDM Validation requires a target field, so use Product Name
            "event1.idm.read_only_udm.target.application" => "Cylance %{product_name}"
          }
          on_error => "field_not_set"
        }

        if [event_name] =~ "Success" {
          mutate {
            replace => {
              "sr_action" => "ALLOW"
            }
          }
        } else {
          # it wasn't a success, i.e., Failure
          mutate {
            replace => {
              "sr_category" => "AUTH_VIOLOATION"
              "sr_action" => "BLOCK"
            }
          }
        }
      }
    }

    # ************************* Device Control *************************
    else if [event_type] == "DeviceControl" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }

      mutate {
        replace => {
          "security_result.summary" => "%{External Device Name}"
          "sr_category" => "POLICY_VIOLATION"
          "sr_action" => "ALLOW"
        }
        on_error => "field_not_set"
      }
    }

    # ************************* OpticsCaeRegistryEvent *************************
    else if [event_type] == "OpticsCaeRegistryEvent" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "REGISTRY_MODIFICATION"
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.target.registry.registry_key" => "%{Target Registry KeyPath}"
        }
      }
      mutate {
        rename => {
          "Destination Port" => "event1.idm.read_only_udm.target.port"
        }
      }

      mutate {
        replace => {
          "security_result.summary" => "%{Description}"
          "sr_action" => "ALLOW"
        }
      }
    }

    # ************************* OpticsCaeNetworkEvent *************************
    else if [event_type] == "OpticsCaeNetworkEvent" {
      mutate {
        convert => {
          "Destination Port" => "integer"
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }

      mutate {
        replace => {
          # Network
          "event1.idm.read_only_udm.network.ip_protocol" => "TCP"
        }
      }

      mutate {
        rename => {
          "Destination Port" => "event1.idm.read_only_udm.target.port"
        }
      }

      mutate {
        replace => {
          "security_result.summary" => "%{Description}"
          "sr_action" => "ALLOW"
          "sr_category" => "NETWORK_SUSPICIOUS"
        }
      }

      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip" => "Destination IP"
        }
      }
    }

    # ************************* OpticsCaeDnsEvent *************************
    else if [event_type] == "OpticsCaeDnsEvent" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_DNS"

          # Target
          "a.name" => "%{Resolved Address}"

          # Network
          "q.name" => "%{Target Domain Name}"
          "event1.idm.read_only_udm.network.application_protocol" => "DNS"
        }
      }

      mutate {
        merge => {
        "event1.idm.read_only_udm.network.dns.questions" => "q"
        }
      }

      mutate {
        merge => {
        "event1.idm.read_only_udm.network.dns.answers" => "a"
        }
      }

      mutate {
        replace => {
          "security_result.summary" => "%{Description}"
          "sr_action" => "ALLOW"
        }
      }
    }

    # ************************* OpticsCaeProcessEvent *************************
    else if [event_type] == "OpticsCaeProcessEvent" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.target.process.file.full_path" => "%{Target Process Name}"
        }
        on_error => "target_process_field_not_set"
      }
      if ![target_process_field_not_set] {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"
            # UDM validation requires target
            "event1.idm.read_only_udm.target.hostname" => "%{Device Name}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
          }
        }
      }

      mutate {
        replace => {
          "security_result.summary" => "%{Description}"
          "sr_action" => "ALLOW"
        }
      }
    }

    # ************************* Device *************************
    else if [event_type] == "Device" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
      mutate {
        replace => {
          "sr_action" => "ALLOW"
        }
      }
    }

    # ************************* Exploit Attempt *************************
    else if [event_type] == "ExploitAttempt" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "SCAN_HOST"
          "event1.idm.read_only_udm.target.hostname" => "%{Device Name}"
          "event1.idm.read_only_udm.principal.user.userid" => "%{User Name}"
          "event1.idm.read_only_udm.principal.process.pid" => "%{Process ID}"
          "event1.idm.read_only_udm.principal.process.file.full_path" => "%{Process Name}"
        }
        on_error => "field_not_present"
      }

      # UDM > Security Results
      if [event_name] =~ "(blocked|terminated)" {
        mutate {
          replace => { "sr_action" => "BLOCK" }
        }
      } else {
        # allow|none
        mutate {
          replace => { "sr_action" => "ALLOW" }
        }
        # as it was allowed, flag as an alert
      }

      mutate {
        replace => {
          "security_result.summary" => "%{event_type}: %{Violation Type}"
          "security_result.threat_name" => "%{Violation Type}"
          "sr_category" => "EXPLOIT"
        }
      }
    }

    # ************************* Threat *************************
    else if [event_type] == "Threat" {
    # threat_found, threat_removed, threat_quarantined, threat_waived, threat_changed
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "SCAN_HOST"
          "event1.idm.read_only_udm.target.hostname" => "%{Device Name}"
          "event1.idm.read_only_udm.principal.process.file.full_path" => "%{Path}%{File Name}"
        }
      }

      mutate {
        replace => {
          "security_result.threat_name" => "%{Threat Classification}"
          "sr_category" => "SOFTWARE_MALICIOUS"
        }
      }
      if[event_name] == "Blocked" {
        mutate {
          replace => {
            "sr_action" => "BLOCK"
          }
        }
      }
      else if [Status] == "Quarantined" {
        mutate {
          replace => {
            "sr_action" => "QUARANTINE"
          }
        }
      }
      else if [Status] == "Cleared" {
        mutate {
          replace => {
            "sr_action" => "ALLOW_WITH_MODIFICATION"
          }
        }
      }
    }

    mutate {
      merge => {
        "event1.idm.read_only_udm.principal.ip" =>  "Source IP"
      }
      on_error => "source_ip_error"
    }

    mutate {
      replace => {
        "target_process_command_line" => "%{Target Process Command Line}"
      }
      on_error => "target_process_command_line_not_present"
    }

    if ![target_process_command_line_not_present] and [target_process_command_line] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.target.process.command_line" => "%{target_process_command_line}"
        }
        on_error => "target_process_cmd_line_not_present"
      }
    }

    if [Severity] != "" {
      mutate {
        uppercase => [ "Severity" ]
      }
      if [Severity] in [ "INFORMATIONAL", "LOW", "MEDIUM", "HIGH", "CRITICAL", "ERROR" ] {
        mutate {
          replace => {
            "security_result.severity" => "%{Severity}"
          }
          on_error => "severity_not_present"
        }
      }
      else {
        mutate {
          replace => {
            "security_result.severity" => "UNKNOWN_SEVERITY"
          }
        }
      }
    }

    if [security_result][summary] == "" {
      mutate {
        replace => {
          "security_result.summary" => "%{event_name}"
        }
      }
    }

    mutate {
      merge => {
        "security_result.category" => "sr_category"
      }
      on_error => "category_merge_error"
    }

    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
      on_error => "action_merge_error"
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "sc_result_merge_error"
      }
    }

    # Output UDM Event
    mutate {
      merge => {
        "@output" => "event1"
      }
    }
  }
}
