# Product: IBM_ZSECURE_ALERT
# Category: Alert log types
# Supported Format: SYSLOG
# Reference: NA
# Last Updated: 2025-06-19
# Copyright 2025 Google SecOps


filter {
  mutate {
    replace => {
      "hostname" => ""
      "priority" => ""
      "app_name" => ""
      "parameter" => ""
      "class" => ""
      "profile" => ""
      "uacc" => ""
      "parm" => ""
      "action" => ""
      "desc" => ""
      "racfcmd" => ""
      "userid" => ""
      "name" => ""
      "jobname" => ""
      "system" => ""
      "terminal" => ""
      "srcip" => ""
      "svcno" => ""
      "esrno" => ""
      "curr_address" => ""
      "curr_apf" => ""
      "msg" => ""
      "unix_path" => ""
      "racf_user" => ""
      "racf_name" => ""
      "dnsname" => ""
      "volume" => ""
      "poe" => ""
      "mesg" => ""
      "resource" => ""
      "granted" => ""
      "allowed" => ""
      "intent" => ""
      "attempts" => ""
      "wto_msg" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_security_result" => "false"
      "security_result" => ""
      "devTime" => ""
      "usrName" => ""
      "job" => ""
      "intentvalue_label" => ""
      "class_label_value" => ""
      "prof" => ""
      "prof_label" => ""
      "res" => ""
      "res_label" => ""
      "owner" => ""
      "owner_label" => ""
      "appl" => ""
      "descvalue_label" => ""
      "reason" => ""
      "allow" => ""
      "function" => ""
      "function_label" => ""
      "sum" => ""
      "auth" => ""
      "auth_label" => ""
      "oGID" => ""
      "oGID_label" => ""
      "oUID" => ""
      "oUID_label" => ""
      "used" => ""
      "used_label" => ""
      "path" => ""
      "logstr" => ""
      "logstr_label" => ""
      "usrPriv" => ""
      "userpriv_label" => ""
      "product_version" => ""
      "has_target_resource" => ""
      "has_principal_user" => ""
    }
  }
  grok {
    match => {
      "message" => [
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatCLASS=\\\"%{DATA:class}\\\" onWhatPROFILE=\\\"%{DATA:profile}\\\" whatUACC=\\\"UREAD=\\\"%{DATA:uacc}\\\"\\\" whatPARM=\\\"SET_IDSTAR=\\\"%{DATA:parm}\\\"\\\" whatACTION=\\\"%{DATA:action}\\\" whatDESC=\\\"%{DATA:desc}\\\" whatRACFCMD=\\\"%{DATA:racfcmd}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\" fromWhereTERMINAL=\\\"%{DATA:terminal}\\\" fromWhereSRCIP=\\\"%{IP:srcip}\\\"\\]%{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} -- %{WORD:msg} --',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatRACFCMD-USER=\\\"%{DATA:racf_user}\\\" onWhatRACFCMD-NAME=\\\"%{WORD:racf_name}            \\\" whatACTION=\\\"%{DATA:action}\\\" whatDESC=\\\"%{DATA:desc}\\\" whatRACFCMD=\\\"%{DATA:racfcmd}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\] %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatSVCNO=\\\"%{DATA:svcno}\\\" onWhatESRNO=\\\"%{DATA:esrno}\\\" onWhatCURR-ADDRESS=\\\"%{DATA:curr_address}\\\" onWhatCURR-APF=\\\"%{DATA:curr_apf}\\\" whatACTION=\\\"%{DATA:action}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\] %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} %{DATA}whatACTION=\\\\\\"%{DATA:action}\\\\\\" whoUSERID=\\\\\\"%{DATA:userid}\\\\\\" whoNAME=\\\\\\"%{DATA:name}\\\\\\" whatJOBNAME=\\\\\\"%{DATA:jobname}\\\\\\" whereSYSTEM=\\\\\\"%{DATA:system}\\\\\\"%{DATA}\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatUNIX-PATHNAME=\\\\\\"%{DATA:unix_path}\\\\\\"%{DATA} whatACTION=\\\\\\"%{DATA:action}\\\\\\" whoUSERID=\\\\\\"%{WORD:userid}\\\\\\" whatJOBNAME=\\\\\\"%{DATA:jobname}\\\\\\" whereSYSTEM=\\\\\\"%{DATA:system}\\\\\\" fromWhereTERMINAL=\\\\\\"%{DATA:terminal}\\\\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatDSNAME=\\\\\\"%{DATA:dnsname}\\\\\\" onWhatVOLUME=\\\\\\"%{DATA:volume}\\\\\\" whatACTION=\\\\\\"%{DATA:action}\\\\\\" whouserid=\\\\\\"%{DATA:userid}\\\\\\" wherePOE=\\\\\\"%{DATA:poe}\\\\\\" whereSYSTEM=\\\\\\"%{DATA:system}\\\\\\"\\] Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} whatWTO-MESSAGE=\\\\\\"%{DATA:mesg}\\\\\\" whatACTION=\\\\\\"%{DATA:action}\\\\\\" whereSYSTEM=\\\\\\"%{DATA:system}\\\\\\"\\] Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatUNIX-PATHNAME=\\\\\\"%{DATA:unix_path}\\\\\\" whatACTION=\\\\\\"%{DATA:action}\\\\\\" whoUSERID=\\\\\\"%{DATA:userid}\\\\\\" whoNAME=\\\\\\"%{DATA:name}\\\\\\" whatJOBNAME=\\\\\\"%{DATA:jobname}\\\\\\" whereSYSTEM=\\\\\\"%{DATA:system}\\\\\\"%{DATA}\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatCLASS=\\\\\\\"%{DATA:class}\\\\\\\" onWhatRESOURCE=\\\\\\\"%{DATA:resource}\\\\\\\" onWhatGRANTED=\\\\\\"%{DATA:granted}\\\\\\" onWhatALLOWED=\\\\\\"%{DATA:allowed}\\\\\\" onWhatINTENT=\\\\\\"%{DATA:intent}\\\\\\" onWhatPROFILE=\\\\\\"%{DATA:profile}\\\\\\" whoUSERID=\\\\\\"%{DATA:userid}\\\\\\" whoNAME=\\\\\\"%{DATA:name}\\\\\\" whatACTION=\\\\\\"%{DATA:action}\\\\\\" whatJOBNAME=\\\\\\"%{DATA:jobname}\\\\\\" whereSYSTEM=\\\\\\"%{DATA:system}\\\\\\"\\]%{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatDSNAME=\\\"%{DATA:dnsname}\\\" onWhatVOLUME=\\\"%{DATA:volume}\\\" whatACTION=\\\"%{DATA:action}\\\" whouserid=\\\"%{DATA:userid}\\\" wherePOE=\\\"%{DATA:poe}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\] Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatUNIX-PATHNAME=\\\"%{DATA:unix_path}\\\" whatACTION=\\\"%{DATA:action}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatUNIX-PATHNAME=\\\"%{DATA:unix_path}\\\" whatACTION=\\\"%{DATA:action}\\\" whoUSERID=\\\"%{WORD:userid}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} whatACTION=\\\"%{DATA:action}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\" fromWhereTERMINAL=\\\"%{DATA:terminal}\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} whatACTION=\\\"%{DATA:action}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} whatATTEMPTS=\\\"%{INT:attempts}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whatACTION=\\\"%{DATA:action}\\\" whatDESC=\\\"%{DATA:desc}\\\" whereSYSTEM=\\\"%{DATA:system}\\\" fromWhereTERMINAL=\\\"%{DATA:terminal}\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatRACFCMD-USER=\\\"%{DATA:racf_user}\\\" onWhatRACFCMD-NAME=\\\"%{WORD:racf_name}, %{DATA}  \\\" whatACTION=\\\"%{DATA:action}\\\" whatDESC=\\\"%{DATA:desc}\\\" whatRACFCMD=\\\"%{DATA:racfcmd}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\] %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} whoUSERID=\\\"%{DATA:userid}\\\" whatACTION=\\\"%{DATA:action}\\\" whatDESC=\\\"%{DATA:desc}\\\" onWhatRACFCMD-USER=\\\"%{DATA:racf_user}\\\" onWhatRACFCMD-NAME=\\\"%{WORD:racf_name}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\" fromWhereTERMINAL=\\\"%{DATA:terminal}\\\" fromWhereSRCIP=\\\"%{IP:srcip}\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} onWhatCLASS=\\\"%{DATA:class}\\\" onWhatRESOURCE=\\\"%{DATA:resource}\\\" onWhatGRANTED=\\\"%{DATA:granted}\\\" onWhatALLOWED=\\\"%{DATA:allowed}\\\" onWhatINTENT=\\\"%{DATA:intent}\\\" onWhatPROFILE=\\\"%{DATA:profile}\\\" whoUSERID=\\\"%{DATA:userid}\\\" whoNAME=\\\"%{DATA:name}\\\" whatACTION=\\\"%{DATA:action}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\]Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} whatWTO-MESSAGE=\\\"%{DATA:wto_msg}\\\" whatACTION=\\\"%{DATA:action}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\] Alert: %{GREEDYDATA:msg}',
        '<%{INT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:app_name}  \\[%{DATA:parameter} whoUSERID=\\\"%{DATA:userid}\\\" whatACTION=\\\"%{DATA:action}\\\" whatDESC=\\\"%{DATA:desc}\\\" whatJOBNAME=\\\"%{DATA:jobname}\\\" whatJOBID=\\\"%{DATA:jobid}\\\" whereSYSTEM=\\\"%{DATA:system}\\\"\\]Alert: %{GREEDYDATA:msg}'
        ]
    }
    on_error => "no_match"
    overwrite => ["hostname","msg","priority", "app_name", "parameter", "class", "profile", "uacc", "parm", "action", "desc", "racfcmd", "userid", "name", "jobname", "system", "terminal", "srcip", "svcno", "esrno", "curr_address", "curr_apf", "unix_path", "racf_user", "racf_name", "dnsname", "volume", "poe", "mesg", "resource", "granted", "allowed", "intent", "attempts", "desc", "wto_msg"]
  }
  if [message] =~ "LEEF:" {
    grok {
      match => {
        "message" =>[
          "LEEF:%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA:product_version}\\|%{DATA}\\|%{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["kv_data", "product_version"]
      on_error => "no_grok"
    }
    mutate {
      gsub => ["kv_data","(\\\s+)([0-9a-zA-Z_.-]+?)=", "#$2="]
    }
    kv {
      source => "kv_data"
      value_split => "="
      field_split => "#"
      on_error => "invalid_message_kv"
    }
    if [devTime] != "" {
      date {
        match => [
          "devTime", "yyyy-MM-ddTHH:mm:ss.SSSZ" , "ISO8601"
        ]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "invalid_devTime"
      }
    }
    if [usrName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{usrName}"
        }
        on_error => "usrName_empty"
      }
      if ![usrName_empty] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }
    if [name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.user_display_name" => "%{name}"
        }
        on_error => "name_empty"
      }
    }
    if [job] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.command_line" => "%{job}"
        }
        on_error => "job_empty"
      }
    }
    if [intent] != "" {
      mutate {
        replace => {
          "intentvalue_label.key" => "intent_value"
          "intentvalue_label.value" => "%{intent}"
        }
        on_error => "intent_empty"
      }
      if ![intent_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "intentvalue_label"
          }
          on_error => "intent_label_merge_failed"
        }
      }
      if ![intent_label_merge_failed] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
    if [class] != "" {
      mutate {
        replace => {
          "class_label_value.key" => "class_value"
          "class_label_value.value" => "%{class}"
        }
        on_error => "class_empty"
      }
      if ![class_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "class_label_value"
          }
          on_error => "class_label_value_merge_failed"
        }
      }
      if ![class_label_value_merge_failed] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
    if [prof] != "" {
      mutate {
        replace => {
          "prof_label.key" => "prof_value"
          "prof_label.value" => "%{prof}"
        }
        on_error => "prof_empty"
      }
      if ![prof_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "prof_label"
          }
          on_error => "prof_label_merge_failed"
        }
      }
      if ![prof_label_merge_failed] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
    if [res] != "" {
      mutate {
        replace => {
          "res_label.key" => "res_value"
          "res_label.value" => "%{res}"
        }
        on_error => "res_empty"
      }
      if ![res_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "res_label"
          }
          on_error => "res_label_merge_failed"
        }
      }
      if ![res_label_merge_failed] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
    if [owner] != "" {
      mutate {
        replace => {
          "owner_label.key" => "owner_value"
          "owner_label.value" => "%{owner}"
        }
        on_error => "owner_empty"
      }
      if ![owner_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "owner_label"
          }
          on_error => "owner_label_merge_failed"
        }
      }
      if ![owner_label_merge_failed] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
    if [reason] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "reason"
        }
        on_error => "reasonvalue_label_merge_failed"
      }
    }
    if [allow] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{allow}"
        }
        on_error => "allow_empty"
      }
    }
    if [function] != "" {
      mutate {
        replace => {
          "function_label.key" => "function_value"
          "function_label.value" => "%{function}"
        }
        on_error => "function_empty"
      }
      if ![function_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "function_label"
          }
          on_error => "function_label_merge_failed"
        }
      }
      if ![function_label_merge_failed] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
    if [sum] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{sum}"
        }
        on_error => "sum_empty"
      }
    }
    if [auth] != "" {
      mutate {
        replace => {
          "auth_label.key" => "auth_value"
          "auth_label.value" => "%{auth}"
        }
        on_error => "auth_empty"
      }
      if ![auth_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "auth_label"
          }
          on_error => "auth_label_merge_failed"
        }
      }
    }
    if [desc] != "" {
      if [desc] in ["Success", "success", "SUCCESS"] {
        mutate {
          replace => {
            "sec_action" => "ALLOW"
          }
          on_error => "desc_empty"
        }
      }
      else {
        mutate {
          replace => {
            "sec_action" => "BLOCK"
          }
          on_error => "desc_empty"
        }
      }
      if ![desc_empty] {
        mutate {
          merge => {
            "security_result.action" => "sec_action"
          }
          on_error => "sec_action_merge_failed"
        }
      }
    }
    if [used] != "" {
      mutate {
        replace => {
          "used_label.key" => "used_value"
          "used_label.value.string_value" => "%{used}"
        }
        on_error => "used_empty"
      }
      if ![used_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "used_label"
          }
          on_error => "used_label_merge_failed"
        }
      }
    }
    if [oGID] != "" {
      mutate {
        replace => {
          "oGID_label.key" => "oGID_value"
          "oGID_label.value.string_value" => "%{oGID}"
        }
        on_error => "oGID_empty"
      }
      if ![oGID_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "oGID_label"
          }
          on_error => "oGID_label_merge_failed"
        }
      }
    }
    if [oUID] != "" {
      mutate {
        replace => {
          "oUID_label.key" => "oUID_value"
          "oUID_label.value.string_value" => "%{oUID}"
        }
        on_error => "oUID_empty"
      }
      if ![oUID_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "oUID_label"
          }
          on_error => "oUID_label_merge_failed"
        }
      }
    }
    if [path] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{path}"
        }
        on_error => "path_empty"
      }
    }
    if [logstr] != "" {
      mutate {
        replace => {
          "logstr_label.key" => "logstr_value"
          "logstr_label.value" => "%{logstr}"
        }
        on_error => "logstr_empty"
      }
      if ![logstr_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "logstr_label"
          }
          on_error => "logstr_label_merge_failed"
        }
      }
    }
    if [usrPriv] != "" {
      mutate {
        replace => {
          "userpriv_label.key" => "userpriv_value"
          "userpriv_label.value" => "%{usrPriv}"
        }
        on_error => "userpriv_empty"
      }
      if ![userpriv_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.attribute.labels" => "userpriv_label"
          }
          on_error => "userpriv_label_merge_failed"
        }
      }
    }
    if [product_version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_version" => "%{product_version}"
        }
        on_error => "product_version_empty"
      }
    }
  }
  else {
    date {
      match => [
        "timestamp", "MMM dd HH:mm:ss"
      ]
      rebase => true
      on_error => "invalid_timestamp"
    }
    if [priority] != "" {
      mutate {
        replace => {
            "priority_label.key" => "priority"
            "priority_label.value" => "%{priority}"
          }
          on_error => "priority_empty"
        }
      if ![priority_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "priority_label"
          }
          on_error => "priority_label_merge_failed"
        }
      }
    }
    if [hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
          "has_principal" => "true"
        }
        on_error => "hostname_empty"
      }
    }
    if [app_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{app_name}"
          "has_target" => "true"
        }
        on_error => "app_name_empty"
      }
    }
    if [parameter] != "" {
      mutate {
        replace => {
          "parameter_label.key" => "parameter"
          "parameter_label.value" => "%{parameter}"
        }
        on_error => "parameter_empty"
      }
      if not [parameter_empty] {
        mutate {
          merge => {
