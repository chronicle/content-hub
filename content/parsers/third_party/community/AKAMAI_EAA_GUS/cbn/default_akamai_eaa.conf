# Product: AKAMAI_EAA
# Category: Enterprise Application Access
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2025-07-15
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "app" => ""
      "browser" => ""
      "cc" => ""
      "di" => ""
      "os" => ""
      "rscd" => ""
      "state" => ""
      "ts" => ""
      "uid" => ""
      "uip" => ""
      "port" => ""
      "ral" => ""
      "description" => ""
      "event_type" => ""
      "principal_ip_set" => "false"
      "target_set" => ""
      "username" => ""
      "apphost" => ""
      "http_method" => ""
      "url_path" => ""
      "status_code" => ""
      "referer" => ""
      "http_ver" => ""
      "protocol" => ""
      "app_version" => ""
      "clientip" => ""
      "total_resp_time" => ""
      "connector_resp_time" => ""
      "origin_resp_time" => ""
      "origin_host" => ""
      "content_type" => ""
      "user_agent" => ""
      "device_type" => ""
      "session_info" => ""
      "groups" => ""
      "idpinfo" => ""
      "session_id" => ""
      "client_id" => ""
      "deny_reason" => ""
      "bytes_out" => ""
      "bytes_in" => ""
      "con_ip" => ""
      "con_srcport" => ""
      "con_uuid" => ""
      "cloud_zone" => ""
      "error_code" => ""
      "client_process" => ""
      "client_version" => ""
      "geo_city" => ""
      "geo_state" => ""
      "geo_country" => ""
      "security_result" => ""
      "source" => ""
      "intermediary" => ""
      "internal_host" => ""
      "resource_type" => ""
      "resource" => ""
      "event1" => ""
      "datetime" => ""
      "eventId" => ""
      "eventTime" => ""
      "eventType.eventTypeId" => ""
      "eventType.eventTypeName" => ""
      "eventType.eventDefinition.eventDefinitionId" => ""
      "eventType.eventDefinition.eventName" => ""
      "eventType.eventDefinition.eventDescription" => ""
      "impersonator" => ""
      "target_resource" => "false"
      "has_user" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
    }
  }

  mutate {
    gsub => ["message","\\\"event\\\"","\"event1\""]
  }

  mutate {
    gsub => ["message","\\\"event_type\\\"","\"event_type1\""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [eventId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.id" => "%{eventId}"
      }
      on_error => "event_id_missing"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.metadata.id" => "bytes"
      }
      on_error => "event_id_not_string"
    }
  }
  if [eventTime] != "" {
    date {
      match => ["eventTime", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", "UNIX_MS", "ISO8601"]
      on_error => "event_time_not_present"
    }
  }
  for Index,event_data in eventData {
    mutate {
      convert => {
        "Index" => "string"
      }
      on_error => "event_data_not_string"
    }
    mutate {
      replace => {
        "event_data_key" => "%{event_data.key}"
        "event_data_value" => "%{event_data.value}"
      }
    }
    if [event_data_key] == "ACCOUNT_NAME" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.company_name" => "%{event_data_value}"
          "has_principal_user" => "true"
        }
        on_error => "account_name_missing"
      }
    }
    if [event_data_key] == "IS_INTERNAL_USER" {
      mutate {
        convert => {
          "event_data_value" => "string"
        }
        on_error => "event_data_value_not_string"
      }
      mutate {
        replace => {
          "event_data_value_label.value.string_value" => "%{event_data_value}"
        }
        on_error => "is_internal_user_missing"
      }
      if ![is_internal_user_missing] {
        mutate {
          replace => {
            "event_data_value_label.key" => "%{event_data_key}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "event_data_value_label"
          }
          on_error => "is_internal_user_value_label_not_present"
        }
      }
    }
    if [event_data_key] == "APPLICATION" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{event_data_value}"
        }
        on_error => "application_missing"
      }
    }
    if [event_data_key] == "ACCOUNT_STATUS" {
      mutate {
        replace => {
          "account_status_label.value" => "%{event_data_value}"
        }
        on_error => "account_status_missing"
      }
      if ![account_status_missing] {
        mutate {
          replace => {
            "account_status_label.key" => "%{event_data_key}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "account_status_label"
          }
          on_error => "account_status_value_label_not_present"
        }
      }
    }
    if [event_data_key] == "USERNAME" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{event_data_value}"
          "has_user" => "true"
        }
        on_error => "username_missing"
      }
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
    if [event_data_key] == "PROPERTY_VERSION" {
      mutate {
        replace => {
          "property_version_label.value" => "%{event_data_value}"
        }
        on_error => "property_version_missing"
      }
      if ![property_version_missing] {
        mutate {
          replace => {
            "property_version_label.key" => "%{event_data_key}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "property_version_label"
          }
          on_error => "property_version_value_label_not_present"
        }
      }
    }
    if [event_data_key] == "ASSET_ID" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.asset_id" => "Asset ID: %{event_data_value}"
        }
        on_error => "asset_id_missing"
      }
    }
    if [event_data_key] == "PROPERTY_NAME" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{event_data_value}"
          "target_resource" => "true"
        }
        on_error => "property_name_missing"
      }
    }
    if [event_data_key] == "IS_ON_HOME_ACCOUNT" {
      mutate {
        convert => {
          "event_data_value" => "string"
        }
        on_error => "event_data_value_not_string"
      }
      mutate {
        replace => {
          "is_on_home_account_label.value.string_value" => "%{event_data_value}"
        }
        on_error => "is_on_home_account_missing"
      }
      if ![is_on_home_account_missing] {
        mutate {
          replace => {
            "is_on_home_account_label.key" => "%{event_data_key}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "is_on_home_account_label"
          }
          on_error => "is_on_home_account_value_label_not_present"
        }
      }
    }
    if [event_data_key] == "pulsar_host" {
      grok {
        match => {
          "event_data_value" => ["%{IP:event_data_value}"]
        }
        on_error => "event_data_value_missing"
        overwrite => ["event_data_value"]
      }
      if ![event_data_value_missing] {
        mutate {
          merge => {
            "intermediary.ip" => "event_data_value"
          }
          on_error => "target_ip_missing"
        }
      }
      else {
        mutate {
          replace => {
            "intermediary.hostname" => "%{event_data_value}"
          }
          on_error => "pulsar_host_missing"
        }
      }
    }
    if [event_data_key] == "CONTRACT_TYPE_ID" {
      mutate {
        replace => {
          "contract_type_id_label.value.string_value" => "%{event_data_value}"
        }
        on_error => "contract_type_id_missing"
      }
      if ![contract_type_id_missing] {
        mutate {
          replace => {
            "contract_type_id_label.key" => "%{event_data_key}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "contract_type_id_label"
          }
          on_error => "contract_type_id_value_label_not_present"
        }
      }
    }
    if [event_data_key] == "method" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{event_data_value}"
        }
        on_error => "method_missing"
      }
    }
    if [event_data_key] == "authenticationMethod" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.auth_details" => "%{event_data_value}"
        }
        on_error => "authentication_method_missing"
      }
    }
    if [event_data_key] == "requestId" {
      mutate {
        replace => {
          "request_id_label.value.string_value" => "%{event_data_value}"
        }
        on_error => "request_id_missing"
      }
      if ![request_id_missing] {
        mutate {
          replace => {
            "request_id_label.key" => "%{event_data_key}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "request_id_label"
          }
          on_error => "request_id_value_label_not_present"
        }
      }
    }
    if [event_data_key] == "domain" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{event_data_value}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{event_data_value}"
        }
        on_error => "domain_missing"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
    if [event_data_key] == "notOnOrAfter" {
      date {
        match => ["event_data_value", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", "ISO8601", "UNIX_MS"]
        target => "security_result.last_discovered_time"
        on_error => "not_on_or_after_missing"
      }
    }
    if [event_data_key] == "entityId" {
      mutate {
        replace => {
          "entity_id_label.value" => "%{event_data_value}"
        }
        on_error => "entity_id_missing"
      }
      if ![entity_id_missing] {
        mutate {
          replace => {
            "entity_id_label.key" => "%{event_data_key}"
          }
        }
        mutate {
          merge => {
            "security_result.about.labels" => "entity_id_label"
          }
          on_error => "entity_id_value_label_not_present"
        }
      }
    }
    if [event_data_key] == "details" {
      mutate {
        replace => {
          "security_result.description" => "%{event_data_value}"
        }
        on_error => "details_missing"
      }
    }
    if [event_data_key] == "notBefore" {
      date {
        match => ["event_data_value", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", "ISO8601", "UNIX_MS"]
        target => "security_result.first_discovered_time"
        on_error => "not_before_missing"
      }
    }
    if [event_data_key] == "arrivalDate" {
      date {
        match => ["event_data_value", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSS'Z'", "ISO8601", "UNIX_MS"]
        target => "event.idm.read_only_udm.metadata.collected_timestamp"
        on_error => "arrival_date_missing"
      }
    }
  }
  if [eventType][eventTypeId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{eventType.eventTypeId}"
      }
      on_error => "event_type_id_error"
    }
  }
  mutate {
    replace => {
      "event_TypeName" => "%{eventType.eventTypeName}"
    }
    on_error => "event_type_name_error"
  }
  if [event_TypeName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_TypeName}"
      }
      on_error => "event_type_name_missing"
    }
  }
  if [eventType][eventDefinition][eventDefinitionId] != "" {
    mutate {
      convert => {
        "eventType.eventDefinition.eventDefinitionId" => "string"
      }
      on_error => "event_definition_id_not_string"
    }
    mutate {
      replace => {
        "event_Definition_id_label.value.string_value" => "%{eventType.eventDefinition.eventDefinitionId}"
      }
      on_error => "event_definition_id_error"
    }
    if ![event_definition_id_error] {
      mutate {
        replace => {
          "event_Definition_id_label.key" => "Event Definition ID"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_Definition_id_label"
        }
        on_error => "event_definition_id_label_not_present"
      }
    }
  }
  if [eventType][eventDefinition][eventName] != "" {
    mutate {
      replace => {
        "event_name_label.value.string_value" => "%{eventType.eventDefinition.eventName}"
      }
      on_error => "event_name_error"
    }
    if ![event_name_error] {
      mutate {
        replace => {
          "event_name_label.key" => "Event Name"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_name_label"
        }
        on_error => "event_name_label_not_present"
      }
    }
  }
  if [eventType][eventDefinition][eventDescription] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{eventType.eventDefinition.eventDescription}"
      }
      on_error => "event_description_error"
    }
  }
  if [impersonator] != "" {
    mutate {
      convert => {
        "impersonator" => "string"
      }
      on_error => "impersonator_not_string"
    }
    mutate {
      replace => {
        "impersonator_label.value.string_value" => "%{impersonator}"
      }
      on_error => "impersonator_not_present"
    }
    if ![impersonator_not_present] {
      mutate {
        replace => {
          "impersonator_label.key" => "Impersonator"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "impersonator_label"
        }
        on_error => "impersonator_label_not_present"
      }
    }
  }

  if [ts] != "" {
    mutate {
      convert => {
        "ts" => "string"
      }
      on_error => "no_converted"
    }
    date {
      match => ["ts", "UNIX_MS", "UNIX"]
      on_error => "not_unix_format"
    }
  }
  else if [datetime] != "" {
    date {
      match => ["datetime", "RFC3339"]
      rebase => true
      on_error => "mismatch"
    }
  }

  if [username] not in ["", "-"] {
    if [username] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "username"
        }
        on_error => "not_email"
      }
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{username}"
        }
        on_error => "username_missing"
      }
    }
  }

  if [apphost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{apphost}"
        "target_set" => "true"
      }
      on_error => "hostname_not_present"
    }
  }

  if [http_method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{http_method}"
      }
      on_error => "http_method_not_present"
    }
  }

  if [url_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url_path}"
      }
      on_error => "url_not_present"
    }
  }

  if [http_ver] != "" {
    grok {
      match => {
        "http_ver" => ["%{URIPROTO:protocol}/%{NUMBER:app_version}"]
      }
      overwrite => ["protocol", "app_version"]
      on_error => "http_ver_grok_fail"
    }
    if [protocol] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol"  => "%{protocol}"
        }
        on_error => "protocol_missing"
      }
    }
    if [app_version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol_version" => "%{app_version}"
        }
      }
    }
  }

  if [referer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{referer}"
      }
      on_error => "referal_url_not_present"
    }
  }

  if [status_code] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{status_code}"
      }
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "not_integer"
    }
  }

  if [idpinfo] != "" {
    mutate {
      replace => {
        "idp_info_label.key" => "IDP Info"
        "idp_info_label.value.string_value" => "%{idpinfo}"
      }
      on_error => "idpinfo_not_present"
    }
    if ![idpinfo_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "idp_info_label"
        }
      }
    }
  }

  if [clientip] != "" {
    grok {
      match => {
        "clientip" => ["%{IP:source}"]
      }
      on_error => "not_ip"
      overwrite => ["source"]
    }

    if ![not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "source"
        }
      }
      mutate {
        replace => {
          "principal_ip_set" => "true"
        }
      }
    }
  }

  if [total_resp_time] not in ["", "-"] {
    mutate {
      convert => {
        "total_resp_time" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "resp_time_label.key" => "Total response time"
        "resp_time_label.value" => "%{total_resp_time}"
      }
      on_error => "resp_time_not_present"
    }
    if ![resp_time_not_present] {
      mutate {
        merge => {
          "security_result.detection_fields" => "resp_time_label"
        }
      }
    }
  }

  if [connector_resp_time] not in ["", "-"] {
    mutate {
      convert => {
        "connector_resp_time" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "conn_resp_time_label.key" => "Connector response time"
        "conn_resp_time_label.value" => "%{connector_resp_time}"
      }
      on_error => "conn_resp_time_not_present"
    }
    if ![conn_resp_time_not_present] {
      mutate {
        merge => {
          "security_result.detection_fields" => "conn_resp_time_label"
        }
      }
    }
  }

  if [origin_resp_time] not in ["", "-"] {
    mutate {
      convert => {
        "origin_resp_time" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "origin_resp_time_label.key" => "Origin response time"
        "origin_resp_time_label.value" => "%{origin_resp_time}"
      }
      on_error => "origin_resp_time_not_present"
    }
    if ![origin_resp_time_not_present] {
      mutate {
        merge => {
          "security_result.detection_fields" => "origin_resp_time_label"
        }
      }
    }
  }

  if [origin_host] not in ["", "-"] {
    mutate {
      replace => {
        "origin_host_label.key" => "Origin host"
        "origin_host_label.value.string_value" => "%{origin_host}"
      }
      on_error => "origin_host_not_present"
    }
    if ![origin_host_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "origin_host_label"
        }
      }
    }
  }

  if [content_type] != "" {
    mutate {
      replace => {
        "content_type_label.key" => "Content type"
        "content_type_label.value.string_value" => "%{content_type}"
      }
      on_error => "content_type_not_present"
    }
    if ![content_type_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "content_type_label"
        }
      }
    }
  }

  if [user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{user_agent}"
      }
      on_error => "user_agent_not_found"
    }
    mutate {
      convert => {
        "user_agent" => "parseduseragent"
      }
      on_error => "_no_userAgent"
    }
    mutate {
      rename => {
        "user_agent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
      }
      on_error => "_no_userAgent"
    }
  }

  if [device_type] =~ "(?i)windows" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "WINDOWS"
        "event.idm.read_only_udm.principal.platform_version" => "%{device_type}"
      }
    }
  }

  else if [device_type] =~ "(?i)linux" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "LINUX"
        "event.idm.read_only_udm.principal.platform_version" => "%{device_type}"
      }
    }
  }

  else if [device_type] =~ "(?i)mac" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "MAC"
        "event.idm.read_only_udm.principal.platform_version" => "%{device_type}"
      }
    }
  }

  if [internal_host] not in ["", "-"] {
    mutate {
      replace => {
        "internal_host_label.key" => "Internal host"
        "internal_host_label.value.string_value" => "%{internal_host}"
      }
      on_error => "internal_host_not_present"
    }
    if ![internal_host_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "internal_host_label"
        }
      }
    }
  }

  if [session_info] not in ["", "-"] {
    mutate {
      replace => {
        "session_info_label.key" => "Session info"
        "session_info_label.value.string_value" => "%{session_info}"
      }
      on_error => "session_info_not_present"
    }
    if ![session_info_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "session_info_label"
        }
      }
    }
  }

  if [groups] =~ "^(.){1,253}$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.group_identifiers" => "groups"
      }
      on_error => "groups_not_present"
    }
  }

  if [session_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{session_id}"
      }
      on_error => "session_id_missing"
    }
  }

  if [client_id] not in ["", "-"] {
    mutate {
      replace => {
        "client_id_label.key" => "Client Id"
        "client_id_label.value.string_value" => "%{client_id}"
      }
      on_error => "client_id_not_present"
    }
    if ![client_id_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "client_id_label"
        }
      }
    }
  }

  if [deny_reason] not in ["", "-"] {
    mutate {
      replace => {
        "security_result.summary" => "%{deny_reason}"
      }
      on_error => "deny_reason_missing"
    }
  }

  if [bytes_out] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{bytes_out}"
      }
      on_error => "bytes_out_missing"
    }
  }

  if [bytes_in] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.recieved_bytes" => "%{bytes_in}"
      }
      on_error => "bytes_in_missing"
    }
  }

  if [con_ip] != "" {
    grok {
      match => {
        "con_ip" => ["%{IP:int_ip}"]
      }
      on_error => "not_ip"
      overwrite => ["int_ip"]
    }
    if ![not_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "int_ip"
        }
      }
    }
  }

  if [con_srcport] != "" {
    mutate {
      replace => {
        "intermediary.port" => "%{con_srcport}"
      }
      on_error => "int_port_missing"
    }
  }

  if [con_uuid] not in ["", "-"] {
    mutate {
      replace => {
        "intermediary.resource.product_object_id" => "%{con_uuid}"
      }
      on_error => "con_uuid_missing"
    }
  }

  if [cloud_zone] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.cloud.availability_zone" => "%{cloud_zone}"
      }
      on_error => "cloud_zone_missing"
    }
  }

  if [error_code] not in ["", "-"] {
    mutate {
      convert => {
        "error_code" => "string"
      }
      on_error => "error_code_not_present"
    }
    mutate {
      replace => {
        "error_code_label.key" => "Error code"
        "error_code_label.value.string_value" => "%{error_code}"
      }
      on_error => "error_code_not_present"
    }
    if ![error_code_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "error_code_label"
        }
      }
    }
  }

  if [client_process] not in ["", "-"] {
    mutate {
      replace => {
        "client_process_label.key" => "Client Process"
        "client_process_label.value" => "%{client_process}"
      }
      on_error => "no_client_process"
    }
    if ![no_client_process] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "client_process_label"
        }
      }
    }
  }

  if [client_version] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{client_version}"
      }
      on_error => "client_version_missing"
    }
  }

  if [geo_city] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.city" => "%{geo_city}"
      }
      on_error => "city_missing"
    }
  }

  if [geo_state] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.state" => "%{geo_state}"
      }
      on_error => "state_missing"
    }
  }

  if [geo_country] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{geo_country}"
      }
      on_error => "country_missing"
    }
  }

  if [resource_type] not in ["", "-"] {
    mutate {
      replace => {
        "resource_type_label.key" => "Resource Type"
        "resource_type_label.value" => "%{resource_type}"
      }
      on_error => "no_resource_type"
    }
    if ![no_resource_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "resource_type_label"
        }
      }
    }
  }

  if [resource] not in ["", "-"] {
    mutate {
      replace => {
        "resource_label.key" => "Resource"
        "resource_label.value" => "%{resource}"
      }
      on_error => "resource_not_present"
    }
    if ![resource_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "resource_label"
        }
      }
    }
  }

  if [event1] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{event1}"
      }
    }
  }
  if [app] != "" {
    grok {
      match => {
        "app" => "%{DATA:app}:%{INT:port}"
      }
      overwrite => ["app","port"]
      on_error => "match_error"
    }
  }

  if [uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{uid}"
        "event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "field_not_found"
    }
  }

  if [uip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "uip"
      }
      on_error => "field_not_found"
    }
  }

  if [cc] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{cc}"
      }
      on_error => "field_not_found"
    }
  }

  if [state] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.state" => "%{state}"
      }
      on_error => "field_not_found"
    }
  }

  if [os] =~ "(?i)windows" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "WINDOWS"
      }
    }
  }
  else if [os] =~ "(?i)mac" or [os] =~ "(?i)osx" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "MAC"
      }
    }
  }
  else if [os] =~ "(?i)linux" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform" => "LINUX"
      }
    }
  }

  if [app] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{app}"
      }
      on_error => "field_not_found"
    }
  }

  if [port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{port}"
      }
      on_error => "field_not_found"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "convert_failure"
    }
  }

  if [browser] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{browser}"
      }
      on_error => "field_not_found"
    }
  }

  if [di] != "" {
    mutate {
      replace => {
        "di_label.key" => "di"
        "di_label.value" => "%{di}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.metadata.ingestion_labels" => "di_label"
      }
      on_error => "field_not_found"
    }
  }

  if [rscd] != "" {
    mutate {
      replace => {
        "rscd_label.key" => "rscd"
        "rscd_label.value" => "%{rscd}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.metadata.ingestion_labels" => "rscd_label"
      }
      on_error => "field_not_found"
    }
  }

  if [ral] != "" {
    for index, data in ral {
      if [index] == 0 {
        mutate {
          replace => {
            "description" => "%{data}"
          }
          on_error => "field_not_found"
        }
      }
      else {
        mutate {
          replace => {
            "description" => "%{description}, %{data}"
          }
          on_error => "field_not_found"
        }
      }
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "field_not_found"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }
  else if [principal_ip_set] == "true" and [target_set] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [target_resource] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
      }
    }
  }
  else if [event_TypeName] =~ "All Logins" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "SSO"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "AKAMAI_EAA"
      "event.idm.read_only_udm.metadata.product_name" => "AKAMAI_EAA"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
