      mutate {
        replace => {
          "evidencesuser_additionalData" => "%{evidencesuser.additionalData}"
        }
        on_error => "no_evidencesuser_additionalData"
      }
      if [evidencesuser_additionalData] not in ["","null"] {
        mutate {
          replace => {
            "additionalData_label.key" => "additionalData"
            "additionalData_label.value" => "%{evidencesuser_additionalData}"
          }
          on_error => "no_additionalData_label"
        }
        if ![no_additionalData_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "additionalData_label"
            }
            on_error => "merge_additionalData_label_error"
          }
        }
      }
      mutate {
        replace => {
          "evidencesuser_comment" => "%{evidencesuser.comment}"
        }
        on_error => "no_comment"
      }
      if [evidencesuser_comment] not in ["","null"] {
        mutate {
          replace => {
