# Product: CYBERARK EPM
# Category: EPM
# Supported Format: JSON
# Reference: https://docs.cyberark.com/EPM/Latest/en/Content/WebServices/GetDetailedRawEvents.htm
# Last Updated: 2025-09-12
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "operating_system_type" => ""
      "accessAction" => ""
      "accessTargetType" => ""
      "agentEventCount" => ""
      "agentId" => ""
      "company" => ""
      "computerName" => ""
      "eventType" => ""
      "fileDescription" => ""
      "fileName" => ""
      "filePath" => ""
      "fileQualifier" => ""
      "fileSize" => ""
      "fileVersion" => ""
      "hash" => ""
      "justification" => ""
      "operatingSystemType" => ""
      "originalFileName" => ""
      "owner" => ""
      "packageName" => ""
      "productName" => ""
      "productVersion" => ""
      "publisher" => ""
      "setID" => ""
      "sourceName" => ""
      "sourceType" => ""
      "threatProtectionAction" => ""
      "url" => ""
      "userName" => ""
      "software" => ""
      "has_principal" => "false"
      "principal" => ""
      "target" => ""
      "additional" => ""
      "security_result" => ""
      "has_principal_user" => "false"
      "events" => ""
      "modificationTime" => ""
      "arrivalTime" => ""
      "lastEventDate" => ""
      "processCommandLine" => ""
      "sourceProcessCommandLine" => ""
      "sourceProcessHash" => ""
      "policyName" => ""
      "displayName" => ""
      "threatProtectionActionId" => ""
      "skippedCount" => ""
      "eventCount" => ""
      "sourceProcessSigner" => ""
      "sourceProcessUsername" => ""
      "sourceProcessPublisher" => ""
      "deceptionType" => ""
      "winEventType" => ""
      "logonStatusId" => ""
      "logonAttemptTypeId" => ""
      "winEventRecordId" => ""
      "userIsAdmin" => ""
      "workingDirectory" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    mutate {
      replace => {
        "message" => "%{message}}"
      }
      on_error => "not_json_message"
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json_msg"
    }
  }
  if [events] != "" {
    for eachevent in events {
      mutate {
        replace => {
          "event" => ""
          "security_result" => ""
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{eachevent.filePath}"
        }
        on_error => "no_file_name"
      }

      mutate {
        rename => {
          "eachevent.processCommandLine" => "event.idm.read_only_udm.target.process.command_line"
        }
      }

      mutate {
        rename => {
          "eachevent.sourceProcessCommandLine" => "event.idm.read_only_udm.target.process.parent_process.command_line"
        }
      }

      mutate {
        rename => {
          "each_event.sourceProcessHash" => "event.idm.read_only_udm.target.process.parent_process.file.sha1"
        }
      }

      mutate {
        replace => {
          "security_result.rule_name" => "%{eachevent.policyName}"
        }
        on_error => "no_rule_name"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.sha1" => "%{eachevent.hash}"
        }
        on_error => "no_hash"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{eachevent.displayName}"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{eachevent.eventType}"
        }
        on_error => "no_product_event_type"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{eachevent.userName}"
        }
        on_error => "no_user_name"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{eachevent.computerName}"
        }
        on_error => "no_computer_name"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.asset_id" => "agentId:%{eachevent.agentId}"
        }
        on_error => "no_agent_id"
      }

      mutate {
        replace => {
          "publisher_field.key" => "Publisher"
          "publisher_field.value.string_value" => "%{eachevent.publisher}"
        }
        on_error => "no_publisher_field"
      }
      if ![no_publisher_field] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "publisher_field"
          }
        }
      }

      mutate {
        replace => {
          "sourceProcessSigner_field.key" => "sourceProcessSigner"
          "sourceProcessSigner_field.value.string_value" => "%{eachevent.sourceProcessSigner}"
        }
        on_error => "no_sourceProcessSigner_field"
      }
      if ![no_sourceProcessSigner_field] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "sourceProcessSigner_field"
          }
        }
      }


      mutate {
        replace => {
          "operating_system_type" => "%{eachevent.operatingSystemType}"
        }
        on_error => "no_operating_system_type"
      }

      if ![no_operating_system_type] {
        if [operating_system_type] =~ "Windows" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.platform" => "WINDOWS"
            }
          }
        }
      }

      mutate {
        replace => {
          "threat_protection_action" => "%{eachevent.threatProtectionAction}"
        }
        on_error => "no_threat_protection_action"
      }

      if ![no_threat_protection_action] {
        mutate {
          replace => {
            "security_result.action_details" => "%{threat_protection_action}"
          }
        }
      }

      mutate {
        replace => {
          "security_result.alert_state" => "ALERTING"
        }
      }

      for index,exposeduser in eachevent.exposedUsers {
        mutate {
          convert => {
            "index" => "string"
          }
        }
        mutate {
          replace => {
            "exposed_username" => ""
            "exposed_domain" => ""
            "exposed_accountName" => ""
          }
        }
        mutate {
          replace => {
            "exposed_username.key"   => "username_%{index}"
            "exposed_username.value" => "%{exposeduser.username}"
          }
          on_error => "exposed_username_not_present"
        }
        if ![exposed_username_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.user.attribute.labels" => "exposed_username"
            }
          }
        }

        mutate {
          replace => {
            "exposed_domain.key"   => "domain_%{index}"
            "exposed_domain.value" => "%{exposeduser.domain}"
          }
          on_error => "exposed_domain_not_present"
        }
        if ![exposed_domain_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.user.attribute.labels" => "exposed_domain"
            }
          }
        }

        mutate {
          replace => {
            "exposed_accountName.key"   => "accountName_%{index}"
            "exposed_accountName.value" => "%{exposeduser.accountName}"
          }
          on_error => "exposed_accountName_not_present"
        }
        if ![exposed_accountName_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.user.attribute.labels" => "exposed_accountName"
            }
          }
        }
      }

      if [security_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.vendor_name" => "CYBERARK"
          "event.idm.read_only_udm.metadata.product_name" => "EPM"
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
  else {
    if [accessAction] != "" {
      mutate {
        convert => {
          "accessAction" => "string"
        }
        on_error => "no_accessAction"
      }
      mutate {
        replace => {
          "accessaction_label.key" => "accessAction"
          "accessaction_label.value.string_value" => "%{accessAction}"
        }
        on_error => "no_accessAction_label"
      }
      if ![no_accessAction_label] {
        mutate {
          merge => {
            "additional.fields" => "accessaction_label"
          }
          on_error => "merge_accessAction_label_error"
        }
      }
    }
    if [accessTargetType] != "" {
      mutate {
        convert => {
          "accessTargetType" => "string"
        }
        on_error => "no_accessTargetType"
      }
      mutate {
        replace => {
          "accessTargetType_label.key" => "accessTargetType"
          "accessTargetType_label.value.string_value" => "%{accessTargetType}"
        }
        on_error => "no_accessTargetType_label"
      }
      if ![no_accessTargetType_label] {
        mutate {
          merge => {
            "additional.fields" => "accessTargetType_label"
          }
          on_error => "merge_accessTargetType_label_error"
        }
      }
    }
    if [lastEventDate] != "" {
      date {
        match => ["lastEventDate","ISO8601"]
        on_error => "no_lastEventDate"
      }
    }
    if [agentEventCount] != "" {
      mutate {
        convert => {
          "agentEventCount" => "string"
        }
        on_error => "no_agentEventCount"
      }
      mutate {
        replace => {
          "agentEventCount_label.key" => "agentEventCount"
          "agentEventCount_label.value.string_value" => "%{agentEventCount}"
        }
        on_error => "no_agentEventCount_label"
      }
      if ![no_agentEventCount_label] {
        mutate {
          merge => {
            "additional.fields" => "agentEventCount_label"
          }
          on_error => "merge_agentEventCount_label_error"
        }
      }
    }
    if [modificationTime] != "" {
      mutate {
        replace => {
          "modificationTime_label.key" => "modificationTime"
          "modificationTime_label.value.string_value" => "%{modificationTime}"
        }
        on_error => "no_modificationTime_label"
      }
      if ![no_modificationTime_label] {
        mutate {
          merge => {
            "additional.fields" => "modificationTime_label"
          }
          on_error => "merge_modificationTime_label_error"
        }
      }
    }
    if [arrivalTime] != "" {
      mutate {
        replace => {
          "arrivalTime_label.key" => "arrivalTime"
          "arrivalTime_label.value.string_value" => "%{arrivalTime}"
        }
        on_error => "no_arrivalTime_label"
      }
      if ![no_arrivalTime_label] {
        mutate {
          merge => {
            "additional.fields" => "arrivalTime_label"
          }
          on_error => "merge_arrivalTime_label_error"
        }
      }
    }
    for index,exposeduser in exposedUsers {
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "no_index"
      }
      mutate {
        replace => {
          "exposed_username" => ""
          "exposed_domain" => ""
          "exposed_accountName" => ""
          "exposed_source" => ""
          "expose_username" => ""
          "expose_domain" => ""
          "expose_accountName" => ""
          "expose_source" => ""
        }
      }
      mutate {
        replace => {
          "expose_username" => "%{exposeduser.username}"
        }
        on_error => "no_expose_username"
      }
      if [expose_username] != "" {
        mutate {
          replace => {
            "exposed_username.key"   => "username_%{index}"
            "exposed_username.value" => "%{expose_username}"
          }
          on_error => "exposed_username_not_present"
        }
        if ![exposed_username_not_present] {
          mutate {
            merge => {
              "target.user.attribute.labels" => "exposed_username"
            }
            on_error => "merge_exposed_username_error"
          }
        }
      }
      mutate {
        replace => {
          "expose_source" => "%{exposeduser.source}"
        }
        on_error => "no_expose_source"
      }
      if [expose_source] not in ["","null"] {
        mutate {
          replace => {
            "exposed_source.key"   => "source_%{index}"
            "exposed_source.value" => "%{expose_source}"
          }
          on_error => "exposed_source_not_present"
        }
        if ![exposed_source_not_present] {
          mutate {
            merge => {
              "target.user.attribute.labels" => "exposed_source"
            }
            on_error => "merge_exposed_source_error"
          }
        }
      }
      mutate {
        replace => {
          "expose_domain" => "%{exposeduser.domain}"
        }
        on_error => "no_exposed_domain"
      }
      if [expose_domain] != "" {
        mutate {
          replace => {
            "exposed_domain.key"   => "domain_%{index}"
            "exposed_domain.value" => "%{expose_domain}"
          }
          on_error => "exposed_domain_not_present"
        }
        if ![exposed_domain_not_present] {
          mutate {
            merge => {
              "target.user.attribute.labels" => "exposed_domain"
            }
            on_error => "merge_exposed_domain_error"
          }
        }
      }
      mutate {
        replace => {
          "expose_accountName" => "%{exposeduser.accountName}"
        }
        on_error => "no_exposed_accountName"
      }
      if [expose_accountName] != "" {
        mutate {
          replace => {
            "exposed_accountName.key"   => "accountName_%{index}"
            "exposed_accountName.value" => "%{expose_accountName}"
          }
          on_error => "exposed_accountName_not_present"
        }
        if ![exposed_accountName_not_present] {
          mutate {
            merge => {
              "target.user.attribute.labels" => "exposed_accountName"
            }
            on_error => "merge_exposed_accountName_error"
          }
        }
      }
    }
    for index,evidencesuser in evidences {
      mutate {
        replace => {
          "accessedObject_name" => ""
          "accessedProcess_commandline" => ""
          "accessedProcess_hash" => ""
          "accessedProcess_publisher" => ""
          "accessedProcess_username" => ""
          "accessedProcess_hashAlgorithm" => ""
          "accessedProcess_fullImageName" => ""
          "evidencesuser_additionalData" => ""
          "evidencesuser_evidenceCounter" => ""
          "evidencesuser_datetimeUTC" => ""
          "evidencesuser_evidenceAction" => ""
          "evidencesuser_comment" => ""
          "accessedObject_name_label" => ""
          "accessedProcess_commandline_label" => ""
          "accessedProcess_hash_label" => ""
          "accessedProcess_publisher_label" => ""
          "accessedProcess_username_label" => ""
          "accessedProcess_hashAlgorithm_label" => ""
          "accessedProcess_fullImageName_label" => ""
          "evidenceCounter_label" => ""
          "datetimeUTC_label" => ""
          "evidenceAction_label" => ""
          "comment_label" => ""
          "sec_result" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "no_index"
      }
      mutate {
        replace => {
          "accessedObject_name" => "%{evidencesuser.accessedObject.name}"
        }
        on_error => "no_accessedObject_name"
      }
      if [accessedObject_name] != "" {
        mutate {
          replace => {
            "accessedObject_name_label.key" => "accessedObject_name"
            "accessedObject_name_label.value" => "%{accessedObject_name}"
          }
          on_error => "no_accessedObject_name_label"
        }
        if ![no_accessedObject_name_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "accessedObject_name_label"
            }
            on_error => "merge_accessedObject_name_label_error"
          }
        }
      }
      mutate {
        replace => {
          "accessedProcess_commandline" => "%{evidencesuser.accessedProcess.commandLine}"
        }
        on_error => "no_accessedProcess_commandline"
      }
      if [accessedProcess_commandline] not in ["","null"] {
        mutate {
          replace => {
            "accessedProcess_commandline_label.key" => "accessedProcess_commandline"
            "accessedProcess_commandline_label.value" => "%{accessedProcess_commandline}"
          }
          on_error => "no_accessedProcess_commandline_label"
        }
        if ![no_accessedProcess_commandline_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "accessedProcess_command_label"
            }
            on_error => "merge_accessedProcess_commandline_label_error"
          }
        }
      }
      mutate {
        replace => {
          "accessedProcess_hash" => "%{evidencesuser.accessedProcess.hash}"
        }
        on_error => "no_accessedProcess_hash"
      }
      if [accessedProcess_hash] != "" {
        mutate {
          replace => {
            "accessedProcess_hash_label.key" => "accessedProcess_hash"
            "accessedProcess_hash_label.value" => "%{accessedProcess_hash}"
          }
          on_error => "no_accessedProcess_hash_label"
        }
        if ![no_accessedProcess_hash_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "accessedProcess_hash_label"
            }
            on_error => "merge_accessedProcess_hash_label_error"
          }
        }
      }
      mutate {
        replace => {
          "accessedProcess_publisher" => "%{evidencesuser.accessedProcess.publisher}"
        }
        on_error => "no_accessedProcess_publisher"
      }
      if [accessedProcess_publisher] not in ["","null"] {
        mutate {
          replace => {
            "accessedProcess_publisher_label.key" => "accessedProcess_publisher"
            "accessedProcess_publisher_label.value" => "%{accessedProcess_publisher}"
          }
          on_error => "no_accessedProcess_publisher_label"
        }
        if ![no_accessedProcess_publisher_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "accessedProcess_publisher_label"
            }
            on_error => "merge_accessedProcess_publisher_label_error"
          }
        }
      }
      mutate {
        replace => {
          "accessedProcess_username" => "%{evidencesuser.accessedProcess.username}"
        }
        on_error => "no_accessedProcess_username"
      }
      if [accessedProcess_username] not in ["","null"] {
        mutate {
          replace => {
            "accessedProcess_username_label.key" => "accessedProcess_username"
            "accessedProcess_username_label.value" => "%{accessedProcess_username}"
          }
          on_error => "no_accessedProcess_username_label"
        }
        if ![no_accessedProcess_username_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "accessedProcess_username_label"
            }
            on_error => "merge_accessedProcess_username_label_error"
          }
        }
      }
      mutate {
        replace => {
          "accessedProcess_hashAlgorithm" => "%{evidencesuser.accessedProcess.hashAlgorithm}"
        }
        on_error => "no_accessedProcess_hashAlgorithm"
      }
      if [accessedProcess_hashAlgorithm] not in ["","null"] {
        mutate {
          replace => {
            "accessedProcess_hashAlgorithm_label.key" => "accessedProcess_hashAlgorithm"
            "accessedProcess_hashAlgorithm_label.value" => "%{accessedProcess_hashAlgorithm}"
          }
          on_error => "no_accessedProcess_hashAlgorithm_label"
        }
        if ![no_accessedProcess_hashAlgorithm_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "accessedProcess_hashAlgorithm_label"
            }
            on_error => "merge_accessedProcess_hashAlgorithm_label_error"
          }
        }
      }
      mutate {
        replace => {
          "accessedProcess_fullImageName" => "%{evidencesuser.accessedProcess.fullImageName}"
        }
        on_error => "no_accessedProcess_fullImageName"
      }
      if [accessedProcess_fullImageName] != "" {
        mutate {
          replace => {
            "accessedProcess_fullImageName_label.key" => "accessedProcess_fullImageName"
            "accessedProcess_fullImageName_label.value" => "%{accessedProcess_fullImageName}"
          }
          on_error => "no_accessedProcess_fullImageName_label"
        }
        if ![no_accessedProcess_fullImageName_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "accessedProcess_fullImageName_label"
            }
            on_error => "merge_accessedProcess_fullImageName_label_error"
          }
        }
      }
      mutate {
        convert => {
          "evidencesuser.evidenceCounter" => "string"
        }
        on_error => "no_evidencesuser_evidenceCounter_convert"
      }
      mutate {
        replace => {
          "evidencesuser_evidenceCounter" => "%{evidencesuser.evidenceCounter}"
        }
        on_error => "no_evidencesuser_evidenceCounter"
      }
      if [evidencesuser_evidenceCounter] != "" {
        mutate {
          convert => {
            "evidencesuser_evidenceCounter" => "string"
          }
          on_error => "no_evidencesuser_evidenceCounter_convert"
        }
        mutate {
          replace => {
            "evidenceCounter_label.key" => "evidenceCounter"
            "evidenceCounter_label.value" => "%{evidencesuser_evidenceCounter}"
          }
          on_error => "no_evidenceCounter_label"
        }
        if ![no_evidenceCounter_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "evidenceCounter_label"
            }
            on_error => "merge_evidenceCounter_label_error"
          }
        }
      }
      mutate {
        replace => {
          "evidencesuser_datetimeUTC" => "%{evidencesuser.datetimeUTC}"
        }
        on_error => "no_datetimeUTC"
      }
      if [evidencesuser_datetimeUTC] != "" {
        mutate {
          replace => {
            "datetimeUTC_label.key" => "datetimeUTC"
            "datetimeUTC_label.value" => "%{evidencesuser_datetimeUTC}"
          }
          on_error => "no_datetimeUTC_label"
        }
        if ![no_datetimeUTC_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "datetimeUTC_label"
            }
            on_error => "merge_datetimeUTC_label_error"
          }
        }
      }
      mutate {
        replace => {
          "evidencesuser_evidenceAction" => "%{evidencesuser.evidenceAction}"
