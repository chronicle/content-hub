          }
          on_error => "no_evidenceAction_label"
        }
        if ![no_evidenceAction_label] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "evidenceAction_label"
            }
            on_error => "merge_evidenceAction_label_error"
