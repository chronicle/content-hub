# Product: Vercel WAF
# Category: Firewall log
# Supported Format: JSON
# Last Updated: 2024-12-20
# Copyright 2024 Chronicle LLC

filter {
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "log_not_json"
  }
  if [log_not_json] {
    mutate {
      replace => {
        "record_json_message" => "{\"records\":%{message}}"
      }
      on_error => "not_in_json_format"
    }
    json {
      source => "record_json_message"
      array_function => "split_columns"
      on_error => "records_json_failed"
    }
  }

  if [log_not_json] and ![records_json_failed] {
    for record in records {
      mutate {
        replace => {
          "event" => ""
          "principal" => ""
          "metadata" => ""
          "additional" => ""
          "target" => ""
          "security_result" => ""
          "network" => ""
          "has_principal" => "false"
          "has_user" => "false"
          "id" => ""
          "timestamp" => ""
          "requestId" => ""
          "executionRegion" => ""
          "statusCode" => ""
          "level" => ""
          "proxy_timestamp" => ""
          "proxy_region" => ""
          "proxy_errorCode" => ""
          "proxy_clientIp" => ""
          "proxy_vercelCache" => ""
          "proxy_pathType" => ""
          "proxy_cacheId" => ""
          "proxy_referer" => ""
          "proxy_wafAction" => ""
          "proxy_wafRule" => ""
          "proxy_statusCode" => ""
          "proxy_vercelId" => ""
          "proxy_path" => ""
          "proxy_method" => ""
          "proxy_scheme" => ""
          "proxy_userAgent" => ""
          "projectId" => ""
          "projectName" => ""
          "deploymentId" => ""
          "source" => ""
          "host" => ""
          "path" => ""
          "environment" => ""
          "record_json_message" => ""
          "msg" => ""
        }
      }

      mutate {
        replace => {
          "id" => "%{record.id}"
        }
        on_error => "id_not_present"
      }
      if [id] != "" {
        mutate {
          replace => {
            "metadata.product_log_id" => "%{id}"
          }
          on_error => "id_not_present"
        }
      }
      mutate {
        replace => {
          "requestId" => "%{record.requestId}"
        }
        on_error => "requestId_not_present"
      }
      if [requestId] != "" {
        mutate {
          replace => {
            "requestId_label.key" => "requestId"
            "requestId_label.value.string_value" => "%{requestId}"
          }
          on_error => "requestId_not_present"
        }
        if ![requestId_not_present] {
          mutate {
            merge => {
              "additional.fields" => "requestId_label"
            }
            on_error => "requestId_not_present"
          }
        }
      }
      mutate {
        replace => {
          "executionRegion" => "%{record.executionRegion}"
        }
        on_error => "executionRegion_not_present"
      }
      if [executionRegion] != "" {
        mutate {
          replace => {
            "target.location.name" => "%{executionRegion}"
          }
          on_error => "executionRegion_not_present"
        }
      }
      mutate {
        convert => {
          "record.statusCode" => "string"
        }
        on_error => "statusCode_not_present"
      }
      mutate {
        replace => {
          "statusCode" => "%{record.statusCode}"
        }
        on_error => "statusCode_not_present"
      }
      if [statusCode] != "" {
        mutate {
          replace => {
          "network.http.response_code" => "%{statusCode}"
          }
          on_error => "statusCode_not_present"
        }
        mutate {
          convert => {
            "network.http.response_code" => "integer"
          }
          on_error => "statusCode_not_present"
        }
      }
      mutate {
        replace => {
          "level" => "%{record.level}"
        }
        on_error => "level_not_present"
      }
      if [level] != "" {
        mutate {
          uppercase => ["level"]
        }
        if [level] in ["ERROR", "CRITICAL"] {
          mutate {
            replace => {
              "security_result.severity" => "%{level}"
            }
          }
        } else if [level] == "INFO" {
           mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
          }
        } else if [level] == "MINOR" {
           mutate {
            replace => {
              "security_result.severity" => "LOW"
            }
          }
        } else if [level] == "WARNING" {
           mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
          }
        } else if [level] == "MAJOR" {
           mutate {
            replace => {
              "security_result.severity" => "HIGH"
            }
          }
        }
      }

      mutate {
        convert => {
          "record.proxy.timestamp" => "string"
        }
        on_error => "proxy_timestamp_not_present"
      }
      mutate {
        replace => {
          "proxy_timestamp" => "%{record.proxy.timestamp}"
        }
        on_error => "proxy_timestamp_not_present"
      }
      if [proxy_timestamp] != "" {
        mutate {
          replace => {
            "proxy_timestamp_label.key" => "proxy_timestamp"
            "proxy_timestamp_label.value.string_value" => "%{proxy_timestamp}"
          }
          on_error => "proxy_timestamp_label_not_present"
        }
        if ![proxy_timestamp_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_timestamp_label"
            }
            on_error => "proxy_timestamp_not_present"
          }
        }
      }
      mutate {
        replace => {
          "proxy_region" => "%{record.proxy.region}"
        }
        on_error => "proxy_region_not_present"
      }
      if [proxy_region] != "" {
        mutate {
          replace => {
            "proxy_region_label.key" => "proxy_region"
            "proxy_region_label.value.string_value" => "%{proxy_region}"
          }
          on_error => "proxy_region_label_not_present"
        }
        if ![proxy_region_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_region_label"
            }
            on_error => "proxy_region_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "proxy_errorCode" => "%{record.proxy.errorCode}"
        }
        on_error => "proxy_errorCode_not_present"
      }
      if [proxy_errorCode] != "" {
        mutate {
          replace => {
            "proxy_errorCode_label.key" => "proxy_errorCode"
            "proxy_errorCode_label.value.string_value" => "%{proxy_errorCode}"
          }
          on_error => "proxy_errorCode_label_not_present"
        }
        if ![proxy_errorCode_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_errorCode_label"
            }
            on_error => "proxy_errorCode_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "proxy_clientIp" => "%{record.proxy.clientIp}"
        }
        on_error => "proxy_clientIp_not_present"
      }
      if [proxy_clientIp] != "" {
        grok {
          match => {
            "proxy_clientIp" => "%{IP:proxy_clientIp}"
          }
          overwrite => ["proxy_clientIp"]
          on_error => "not_ip"
        }
        if [not_ip] == false {
          mutate {
            merge => {
            "target.ip" => "proxy_clientIp"
            "target.asset.ip" => "proxy_clientIp"
            }
            on_error => "invalid_client_ip"
          }
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
      }
      mutate {
        replace => {
          "proxy_vercelCache" => "%{record.proxy.vercelCache}"
        }
        on_error => "proxy_vercelCache_not_present"
      }
      if [proxy_vercelCache] != "" {
        mutate {
          replace => {
            "proxy_vercelCache_label.key" => "proxy_vercelCache"
            "proxy_vercelCache_label.value.string_value" => "%{proxy_vercelCache}"
          }
          on_error => "proxy_vercelCache_label_not_present"
        }
        if ![proxy_vercelCache_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_vercelCache_label"
            }
            on_error => "proxy_vercelCache_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "proxy_pathType" => "%{record.proxy.pathType}"
        }
        on_error => "proxy_pathType_not_present"
      }
      if [proxy_pathType] != "" {
        mutate {
          replace => {
            "proxy_pathType_label.key" => "proxy_pathType"
            "proxy_pathType_label.value.string_value" => "%{proxy_pathType}"
          }
          on_error => "proxy_pathType_label_not_present"
        }
        if ![proxy_pathType_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_pathType_label"
            }
            on_error => "proxy_pathType_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "proxy_referer" => "%{record.proxy.referer}"
        }
        on_error => "proxy_referer_not_present"
      }
      if [proxy_referer] != "" {
        mutate {
          replace => {
            "proxy_referer_label.key" => "proxy_referer"
            "proxy_referer_label.value.string_value" => "%{proxy_referer}"
          }
          on_error => "proxy_referer_label_not_present"
        }
        if ![proxy_referer_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_referer_label"
            }
            on_error => "proxy_referer_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "proxy_cacheId" => "%{record.proxy.cacheId}"
        }
        on_error => "proxy_cacheId_not_present"
      }
      if [proxy_cacheId] != "" {
        mutate {
          replace => {
            "proxy_cacheId_label.key" => "proxy_cacheId"
            "proxy_cacheId_label.value.string_value" => "%{proxy_cacheId}"
          }
          on_error => "proxy_cacheId_label_not_present"
        }
        if ![proxy_cacheId_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_cacheId_label"
            }
            on_error => "proxy_cacheId_label_not_present"
          }
        }
      }


      mutate {
        replace => {
          "proxy_wafAction" => "%{record.proxy.wafAction}"
        }
        on_error => "proxy_wafAction_not_present"
      }
      if [proxy_wafAction] != "" {
        mutate {
          replace => {
            "proxy_wafAction_label.key" => "proxy_wafAction"
            "proxy_wafAction_label.value.string_value" => "%{proxy_wafAction}"
          }
          on_error => "proxy_wafAction_label_not_present"
        }
        if ![proxy_wafAction_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_wafAction_label"
            }
            on_error => "proxy_wafAction_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "proxy_wafRule" => "%{record.proxy.wafRule}"
        }
        on_error => "proxy_wafRule_not_present"
      }
      if [proxy_wafRule] != "" {
        mutate {
          replace => {
            "security_result.rule_name" => "%{proxy_wafRule}"
            "security_result.threat_name" => "%{proxy_wafRule}"
          }
          on_error => "proxy_wafRule_not_present"
        }
      }
      mutate {
        replace => {
          "proxy_vercelId" => "%{record.proxy.vercelId}"
        }
        on_error => "proxy_vercelId_not_present"
      }
      if [proxy_vercelId] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{proxy_vercelId}"
            "has_user" => "true"
          }
          on_error => "proxy_vercelId_not_present"
        }
      }
      mutate {
        replace => {
          "proxy_path" => "%{record.proxy.path}"
        }
        on_error => "proxy_path_not_present"
      }
      if [proxy_path] != "" {
        mutate {
          replace => {
            "target.file.full_path" => "%{proxy_path}"
          }
          on_error => "proxy_path_not_present"
        }
      }
      mutate {
        replace => {
          "proxy_method" => "%{record.proxy.method}"
        }
        on_error => "proxy_method_not_present"
      }
      if [proxy_method] != "" {
        mutate {
          replace => {
            "network.http.method" => "%{proxy_method}"
          }
          on_error => "proxy_method_not_present"
        }
      }
      mutate {
        replace => {
          "proxy_scheme" => "%{record.proxy.scheme}"
        }
        on_error => "proxy_scheme_not_present"
      }
      if [proxy_scheme] != "" {
        mutate {
          replace => {
            "proxy_scheme_label.key" => "proxy_scheme"
            "proxy_scheme_label.value.string_value" => "%{proxy_scheme}"
          }
          on_error => "proxy_scheme_label_not_present"
        }
        if ![proxy_scheme_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "proxy_scheme_label"
            }
            on_error => "proxy_scheme_label_not_present"
          }
        }
      }
      for agent in record.proxy.userAgent {
        if [agent] != "" {
          mutate {
            replace => {
              "proxy_userAgent" => "%{agent}"
            }
            on_error => "proxy_userAgent_not_present"
          }
        }
        if [proxy_userAgent] != "" {
          mutate {
            replace => {
              "user_agent_label.key" => "user_agent"
              "user_agent_label.value.string_value" => "%{proxy_userAgent}"
            }
            on_error => "proxy_userAgent_value_not_present"
          }
          if ![proxy_userAgent_value_not_present] {
            mutate {
              merge => {
                "additional.fields" => "user_agent_label"
              }
              on_error => "proxy_userAgent_value_not_present"
            }
          }
        }
      }

      mutate {
        replace => {
          "projectId" => "%{record.projectId}"
        }
        on_error => "projectId_not_present"
      }
      if [projectId] != "" {
        mutate {
          replace => {
            "target.cloud.project.id" => "%{projectId}"
          }
          on_error => "projectId_not_present"
        }
      }
      mutate {
        replace => {
          "projectName" => "%{record.projectName}"
        }
        on_error => "projectName_not_present"
      }
      if [projectName] != "" {
        mutate {
          replace => {
            "target.cloud.project.name" => "%{projectName}"
          }
          on_error => "projectName_not_present"
        }
      }
      mutate {
        replace => {
          "deploymentId" => "%{record.deploymentId}"
        }
        on_error => "deploymentId_not_present"
      }
      if [deploymentId] != "" {
        mutate {
          replace => {
            "metadata.product_deployment_id" => "%{deploymentId}"
          }
          on_error => "deploymentId_not_present"
        }
      }
      mutate {
        replace => {
          "source" => "%{record.source}"
        }
        on_error => "source_not_present"
      }
      if [source] != "" {
        mutate {
          replace => {
            "principal.asset.hostname" => "%{source}"
            "has_principal" => "true"
          }
          on_error => "source_not_present"
        }
      }
      mutate {
        replace => {
          "host" => "%{record.host}"
        }
        on_error => "host_not_present"
      }
      if [host] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{host}"
            has_principal => "true"
          }
          on_error => "host_not_present"
        }
      }
      mutate {
        replace => {
          "environment" => "%{record.environment}"
        }
        on_error => "environment_not_present"
      }
      if [environment] != "" {
        mutate {
          replace => {
            "environment_label.key" => "environment"
            "environment_label.value.string_value" => "%{environment}"
          }
          on_error => "environment_not_present"
        }
        if ![environment_not_present] {
          mutate {
            merge => {
              "additional.fields" => "environment_label"
            }
            on_error => "environment_not_present"
          }
        }
      }
      mutate {
        replace => {
          "msg" => "%{record.message}"
        }
        on_error => "msg_not_present"
      }
      if [msg] != "" {
        mutate {
          replace => {
            "security_result.description" => "%{msg}"
          }
          on_error => "msg_not_present"
        }
      }
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
          "metadata.vendor_name" => "VERCEL_WAF"
          "metadata.product_name" => "VERCEL_WAF"
        }
      }

      if [has_user] == "true" {
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
          }
          on_error => "no_user"
        }
      }

      else if [has_principal] == "true" {
        mutate {
          replace => {
            "metadata.event_type" => "STATUS_UPDATE"
          }
          on_error => "no_principal"
        }
      }

      if [metadata] != "" {
        mutate {
          rename => {
            "metadata" => "event.idm.read_only_udm.metadata"
          }
        }
      }

      if [principal] != "" {
        mutate {
          rename => {
            "principal" => "event.idm.read_only_udm.principal"
          }
        }
      }

      if [target] != "" {
        mutate {
          rename => {
            "target" => "event.idm.read_only_udm.target"
          }
        }
      }

      if [additional] != "" {
        mutate {
          rename => {
            "additional" => "event.idm.read_only_udm.additional"
          }
        }
      }
      if [network] != "" {
        mutate {
          rename => {
            "network" => "event.idm.read_only_udm.network"
          }
        }
      }
      if [security_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
          on_error => "no_sec_result"
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
}
