    }
  } else {
    mutate {
      replace => {
        "datetime" => "%{r_datetime}"
      }
    }
  }
  if [datetime] != "" {
    date {
      match => [ "datetime", "RFC3339", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss,SS", "yyyy-MM-dd HH:mm:ss,S"]
      on_error => "format_mismatch"
    }
    if [format_mismatch] {
      date {
        match => [ "datetime", "MMM d HH:mm:ss" "MMM  d HH:mm:ss"]
        rebase => true
      }
    }
  }
