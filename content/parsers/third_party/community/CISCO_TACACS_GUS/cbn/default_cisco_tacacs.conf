    } else {
      if [nas_ip_address] != "" or [has_target_ip] == "true" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      else if [r_ip_or_host] != "" and [has_target_ip] == "false" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "TACACS"
        }
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
          "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
          "security_result.action" => "action"
        }
      }
    }
  }

  # System Statistics (CISE_System_Statistics): Message Code range 70000~70011
  if [r_cat_name] == "CISE_System_Statistics" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
      }
    }
  }
  # TACACS ACCOUNTING (CISE_TACACS_Accounting):
  if [r_cat_name] == "CISE_TACACS_Accounting" {
    if [device_ip_address] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "device_ip_address"
        }
      }
      mutate {
        replace => {
          "has_target_ip" => "true"
        }
      }
    }
    if ![remote_address_is_invalid] {
      mutate {
        # Some adress may have a \000 after the IP number, so we need to remove it.
        gsub => ["remote_address", "\\\000", ""]
        merge => {
          "event.idm.read_only_udm.principal.ip" => "remote_address"
        }
      }
    }

    if [msg_code] in ["3300","3301","3302"] and [device_ip_address] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "TACACS"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  #CISE_Policy_Diagnostics
  # principal -> Device (IP)
  if [r_cat_name] == "CISE_Policy_Diagnostics" {
    if [device_ip_address] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "device_ip_address"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  #CISE_Identity_Stores_Diagnostics
  if [r_cat_name] == "CISE_Identity_Stores_Diagnostics" {
    if [Response] =~ "(?i)Passed" or [Response] =~ "(?i)Success" or [Response] =~ "(?i)PassAdd" {
      mutate {
        replace => {
          "security_action" => "ALLOW"
          "security_result.description" => "%{msg_text}"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "security_action"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        # "should_drop" => "false"
      }
    }
  }
  #CISE_Internal_Operations_Diagnostics
  if [r_cat_name] == "CISE_Internal_Operations_Diagnostics" {
    if [OperationMessageText] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{OperationMessageText}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
  }
  if [r_cat_name] == "CISE_Alarm" {
    if [server_host] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{server_host}"
        }
      }
    } else {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "server_host"
        }
      }
    }
  }
  grok {
    match => {
      "Calling-Station-ID" => "%{MAC:CallingStationID}"
    }
    on_error => "is_calling_not_mac_address"
  }

  if ![is_calling_not_mac_address] {
    mutate {
      gsub => [ "CallingStationID", "[-:.]", "" ]
      lowercase => ["CallingStationID"]
    }
    mutate {
      gsub => [ "CallingStationID", "(\\w{2})(\\w{2})(\\w{2})(\\w{2})(\\w{2})(\\w{2})", "$1:$2:$3:$4:$5:$6" ]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "CallingStationID"
      }
    }
  }
  grok {
    match => {
      "Called-Station-ID" => "%{MAC:CalledStationID}"
    }
    on_error => "is_called_not_mac_address"
  }

  if ![is_called_not_mac_address] {
    mutate {
      gsub => [ "CalledStationID", "[-:.]", "" ]
      lowercase => ["CalledStationID"]
    }
    mutate {
      gsub => [ "CalledStationID", "(\\w{2})(\\w{2})(\\w{2})(\\w{2})(\\w{2})(\\w{2})", "$1:$2:$3:$4:$5:$6" ]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.mac" => "CalledStationID"
      }
    }
  }
  if [r_cat_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{r_cat_name}"
      }
      on_error => "r_cat_name_invalid"
    }
  }

  if [r_msg_id] != "" {
    mutate {
      replace => {
        "session_identifier.key" => "session_identifier"
        "session_identifier.value.string_value" => "%{r_msg_id}"
      }
      on_error => "r_msg_id_invalid"
    }
    if ![r_msg_id_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "session_identifier"
        }
        on_error => "session_identifier_merge_failed"
      }
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  if [cmd] == "logout" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "TACACS"
      }
    }
  }
  else if [cmd] == "login" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "TACACS"
      }
    }
  }
  else if [has_principal_user] == "true" and [has_principal] == "true" or ([cmd] != "" and [has_target_ip] == "true" and [has_target_user] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  if [r_cat_name] == "" and [kv_data] == "" and [description] == "" {
    drop{
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
