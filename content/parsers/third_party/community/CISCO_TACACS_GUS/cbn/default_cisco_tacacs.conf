# Product: Cisco TACACS
# Category: Authentication
# Supported Format: SYSLOG + KV
# Reference: See below
# Last Updated: 2026-06-23
# Copyright 2026 Google SecOps

# Additional references:
#https://www.cisco.com/c/en/us/td/docs/security/ise/syslog/Cisco_ISE_Syslogs/m_SyslogsList.html
#https://www.cisco.com/c/en/us/td/docs/switches/datacenter/aci/apic/sw/kb/b_Cisco_ACI_TACACS_External_Logging.html

filter {
  mutate {
    replace => {
      "IPAddress" => ""
      "redirectPortRewrite" => ""
      "healthThreshold" => ""
      "soPersistenceTimeOut" => ""
      "soPersistence" => ""
      "soMethod" => ""
      "cltTimeout" => ""
      "cacheable" => ""
      "connfailover" => ""
      "trofsPersistence" => ""
      "sessionless" => ""
      "dataOffset" => ""
      "rtspNat" => ""
      "v6persistmasklen" => ""
      "lbMethod" => ""
      "timeout" => ""
      "persistenceType" => ""
      "backupPersistenceTimeout" => ""
      "vserver" => ""
      "TotalAuthenLatency" => ""
      "ClientLatency" => ""
      "AuthenticationStatus" => ""
      "SelectedAuthenticationIdentityStores" => ""
      "IdentitySelectionMatchedRule" => ""
      "StepData14" => ""
      "StepData4" => ""
      "StepData9" => ""
      "StepData8" => ""
      "StepData7" => ""
      "StepData6" => ""
      "StepData15" => ""
      "StepData16" => ""
      "StepData17" => ""
      "StepData18" => ""
      "StepData19" => ""
      "StepData20" => ""
      "StepData21" => ""
      "StepData22" => ""
      "StepData23" => ""
      "StepData24" => ""
      "StepData25" => ""
      "StepData26" => ""
      "StepData27" => ""
      "StepData28" => ""
      "StepData29" => ""
      "StepData30" => ""
      "StepData31" => ""
      "StepData32" => ""
      "CPMSessionID" => ""
      "UserType" => ""
      "AuthorizationPolicyMatchedRule" => ""
      "Device_Type" => ""
      "IPSEC" => ""
      "local_msg" => ""
      "msg_code" => ""
      "msg_text" => ""
      "msg_sev" => ""
      "datetime" => ""
      "priority" => ""
      "r_msg_id" => ""
      "r_total_seg" => "1"
      "r_seg_num" => "0"
      "r_ip_or_host" => ""
      "Remote-Address" => ""
      "Port" => ""
      "Device IP Address" => ""
      "Device Port" => ""
      "DestinationIPAddress" => ""
      "DestinationPort" => ""
      "NAS-IP-Address" => ""
      "NAS-Port" => ""
      "NAS-Port-Id" => ""
      "NAS-Port-Type" => ""
      "NAS-Identifier" => ""
      "Framed-IP-Address" => ""
      "ISELocalAddress" => ""
      "PeerAddress" => ""
      "PeerName" => ""
      "User" => ""
      "UserName" => ""
      "user_name" => ""
      "CmdSet" => ""
      "FailureReason" => ""
      "EndpointUserAgent" => ""
      "EndpointIdentityGroup" => ""
      "EndPointMACAddress" => ""
      "Location" => ""
      "NetworkDeviceName" => ""
      "EndpointIPAddress" => ""
      "Manufacturer" => ""
      "Model" => ""
      "OperatingSystem" => ""
      "IMEI" => ""
      "PhoneNumber" => ""
      "audit-session-id" => ""
      "Acct-Authentic" => ""
      "SelectedAccessService" => ""
      "Calling-Station-ID" => ""
      "calling_station_id" => ""
      "Protocol" => ""
      "NetworkDeviceProfileId" => ""
      "AcsSessionID" => ""
      "AuthenticationIdentityStore" => ""
      "AuthenticationMethod" => ""
      "ConfigVersionId" => ""
      "Network Device Profile" => ""
      "PolicyType" => ""
      "IdentityAccessRestricted" => ""
      "PaloAlto-Admin_Role" => ""
      "OperationMessageText" => ""
      "AcsInstance" => ""
      "Response" => ""
      "r_datetime" => ""
      "r_cat_name" => ""
      "Server" => ""
      "Service-Argument" => ""
      "kv_data" => ""
      "date" => ""
      "time" => ""
      "cmd" => ""
      "rem_addr" => ""
      "session_pid" => ""
      "service" => ""
      "NAS_IP" => ""
      "task_id" => ""
      "Flags" => ""
      "has_target_ip" => "false"
      "description" => ""
      "port" => ""
      "has_principal_user" => "false"
      "has_principal" => "false"
      "msg_attrs" => ""
      "common_username" => ""
      "kv_data_1" => ""
      "common_service" => ""
      "tacacs_remote_address" => ""
      "tacacs_privilege_level" => ""
      "tacacs_auth_source" => ""
      "tacacs_enforcement_profiles" => ""
      "tacacs_authen_method" => ""
      "tacacs_authen_service" => ""
      "tacacs_authen_type" => ""
      "tacacs_acct_flags" => ""
      "tacacs_acct_session_id" => ""
      "tacacs_request_type" => ""
      "tacacs_session_log_timestamp" => ""
      "common_nas_ip_address" => ""
      "common_request_timestamp" => ""
      "tacacs_acct_timestamp" => ""
      "tacacs_authen_action" => ""
      "has_target_user" => "false"
    }
  }

  mutate {
    gsub => ["message", "StepData=([0-9]+)=", "StepData$1="]
  }
  if [message] =~ "CmdArgAV=-" {
    mutate {
      gsub => ["message", " CmdArgAV=vserver CmdArgAV=", ",vserver="]
    }
    mutate {
      gsub => ["message", " CmdArgAV=-", ","]
    }
    mutate {
      gsub => ["message", " CmdArgAV=", "="]
    }
  }

  # Separate remote header from the actual local log message.
  grok {
    match => {
      "message" => [
      "^%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{NOTSPACE:r_cat_name}\\s+%{NUMBER:r_msg_id} %{NUMBER:r_total_seg} %{NUMBER:r_seg_num} %{GREEDYDATA:local_msg}"
      "^%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{NOTSPACE:r_cat_name}\\s+%{GREEDYDATA:local_msg}"
      "^<%{INT:r_priority}>%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{NOTSPACE:r_cat_name} %{NUMBER:r_msg_id} %{NUMBER:r_total_seg} %{NUMBER:r_seg_num} %{GREEDYDATA:local_msg}"
      "^<%{INT:r_priority}>%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{NOTSPACE:r_cat_name} %{NUMBER:r_msg_id} %{GREEDYDATA:local_msg}"
      "^<%{INT:r_priority}>%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{NOTSPACE:r_cat_name} %{GREEDYDATA:local_msg}"
      "^<%{INT:r_priority}>%{TIMESTAMP_ISO8601:r_datetime} %{IPORHOST:r_ip_or_host} %{DATA:r_cat_name} %{NUMBER:r_msg_id} %{NUMBER:r_total_seg} %{NUMBER:r_seg_num} %{GREEDYDATA:kv_data_1}"
      "%{DATE:date} %{TIME:time} %{GREEDYDATA:kv_data}"
      ">%{DATA:description} for %{IP:r_ip_or_host}:%{INT:port}"
       "%{GREEDYDATA:local_msg}"
      ]
    }
    overwrite => ["local_msg", "priority", "r_msg_id", "r_total_seg", "r_seg_num","r_ip_or_host","r_datetime","r_cat_name","kv_data","time","date","description","port","kv_data_1"]
    on_error => "failed_grok"
  }

  mutate {
    gsub => ["kv_data_1", "Common.Username", "common_username"]
  }
  mutate {
    gsub => ["kv_data_1", "Common.Service", "common_service"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Remote-Address", "tacacs_remote_address"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Privilege-Level", "tacacs_privilege_level"]
  }
  mutate {
    gsub => ["kv_data_1", "Common.Request-Timestamp", "common_request_timestamp"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Acct-Flags", "tacacs_acct_flags"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Acct-Session-Id", "tacacs_acct_session_id"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Acct-Timestamp", "tacacs_acct_timestamp"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Auth-Source", "tacacs_auth_source"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Authen-Action", "tacacs_authen_action"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Authen-Method", "tacacs_authen_method"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Authen-Service", "tacacs_authen_service"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Authen-Type", "tacacs_authen_type"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Enforcement-Profiles", "tacacs_enforcement_profiles"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Request-Type", "tacacs_request_type"]
  }
  mutate {
    gsub => ["kv_data_1", "TACACS.Session-Log-Timestamp", "tacacs_session_log_timestamp"]
  }
  mutate {
    gsub => ["kv_data_1", "Common.NAS-IP-Address", "common_nas_ip_address"]
  }
  if [kv_data_1] != "" {
    kv {
      source => "kv_data_1"
      field_split => ","
      value_split => "="
      on_error => "failed_kv_data_1"
    }
  }
  if [common_username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{common_username}"
      }
      on_error => "common_username_invalid"
    }
    if ![common_username_invalid] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }
  if [common_service] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{common_service}"
      }
      on_error => "common_service_invalid"
    }
  }
  if [tacacs_remote_address] != "" {
    grok {
      match => {
        "tacacs_remote_address" => "%{IP:tacacs_remote_address}"
      }
      overwrite => ["tacacs_remote_address"]
      on_error => "tacacs_remote_address_invalid"
    }
    if ![tacacs_remote_address_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "tacacs_remote_address"
          "event.idm.read_only_udm.principal.asset.ip" => "tacacs_remote_address"
        }
        on_error => "tacacs_remote_address_merge_failed"
      }
      if ![tacacs_remote_address_merge_failed] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [tacacs_privilege_level] != "" {
    mutate {
      replace => {
        "tacacs_privilege_level_label.value.string_value" => "%{tacacs_privilege_level}"
      }
      on_error => "tacacs_privilege_level_invalid"
    }
    if ![tacacs_privilege_level_invalid] {
      mutate {
        replace => {
          "tacacs_privilege_level_label.key" => "tacacs_privilege_level"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_privilege_level_label"
        }
        on_error => "tacacs_privilege_level_label_merge_failed"
      }
    }
  }
  if [common_request_timestamp] != "" {
    mutate {
      replace => {
        "common_request_timestamp_label.value.string_value" => "%{common_request_timestamp}"
      }
      on_error => "common_request_timestamp_invalid"
    }
    if ![common_request_timestamp_invalid] {
      mutate {
        replace => {
          "common_request_timestamp_label.key" => "common_request_timestamp"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "common_request_timestamp_label"
        }
        on_error => "common_request_timestamp_label_merge_failed"
      }
    }
  }
  if [tacacs_acct_flags] != "" {
    mutate {
      replace => {
        "tacacs_acct_flags_label.value.string_value" => "%{tacacs_acct_flags}"
      }
      on_error => "tacacs_acct_flags_invalid"
    }
    if ![tacacs_acct_flags_invalid] {
      mutate {
        replace => {
          "tacacs_acct_flags_label.key" => "tacacs_acct_flags"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_acct_flags_label"
        }
        on_error => "tacacs_acct_flags_label_merge_failed"
      }
    }
  }
  if [tacacs_acct_session_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{tacacs_acct_session_id}"
      }
      on_error => "tacacs_acct_session_id_invalid"
    }
  }
  if [tacacs_acct_timestamp] != "" {
    mutate {
      replace => {
        "tacacs_acct_timestamp_label.value.string_value" => "%{tacacs_acct_timestamp}"
      }
      on_error => "tacacs_acct_timestamp_invalid"
    }
    if ![tacacs_acct_timestamp_invalid] {
      mutate {
        replace => {
          "tacacs_acct_timestamp_label.key" => "tacacs_acct_timestamp"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_acct_timestamp_label"
        }
        on_error => "tacacs_acct_timestamp_label_merge_failed"
      }
    }
  }
  if [tacacs_auth_source] != "" {
    mutate {
      replace => {
        "tacacs_auth_source_label.value.string_value" => "%{tacacs_auth_source}"
      }
      on_error => "tacacs_auth_source_invalid"
    }
    if ![tacacs_auth_source_invalid] {
      mutate {
        replace => {
          "tacacs_auth_source_label.key" => "tacacs_auth_source"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_auth_source_label"
        }
        on_error => "tacacs_auth_source_label_merge_failed"
      }
    }
  }
  if [tacacs_authen_action] != "" {
    mutate {
      replace => {
        "tacacs_authen_action_label.value.string_value" => "%{tacacs_authen_action}"
      }
      on_error => "tacacs_authen_action_invalid"
    }
    if ![tacacs_authen_action_invalid] {
      mutate {
        replace => {
          "tacacs_authen_action_label.key" => "tacacs_authen_action"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_authen_action_label"
        }
        on_error => "tacacs_authen_action_label_merge_failed"
      }
    }
  }
  if [tacacs_authen_method] != "" {
    mutate {
      replace => {
        "tacacs_authen_method_label.value.string_value" => "%{tacacs_authen_method}"
      }
      on_error => "tacacs_authen_method_invalid"
    }
    if ![tacacs_authen_method_invalid] {
      mutate {
        replace => {
          "tacacs_authen_method_label.key" => "tacacs_authen_method"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_authen_method_label"
        }
        on_error => "tacacs_authen_method_label_merge_failed"
      }
    }
  }
  if [tacacs_authen_service] != "" {
    mutate {
      replace => {
        "tacacs_authen_service_label.value.string_value" => "%{tacacs_authen_service}"
      }
      on_error => "tacacs_authen_service_invalid"
    }
    if ![tacacs_authen_service_invalid] {
      mutate {
        replace => {
          "tacacs_authen_service_label.key" => "tacacs_authen_service"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_authen_service_label"
        }
        on_error => "tacacs_authen_service_label_merge_failed"
      }
    }
  }
  if [tacacs_authen_type] != "" {
    mutate {
      replace => {
        "tacacs_authen_type_label.value.string_value" => "%{tacacs_authen_type}"
      }
      on_error => "tacacs_authen_type_invalid"
    }
    if ![tacacs_authen_type_invalid] {
      mutate {
        replace => {
          "tacacs_authen_type_label.key" => "tacacs_authen_type"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_authen_type_label"
        }
        on_error => "tacacs_authen_type_label_merge_failed"
      }
    }
  }
  if [tacacs_enforcement_profiles] != "" {
    mutate {
      replace => {
        "tacacs_enforcement_profiles_label.value.string_value" => "%{tacacs_enforcement_profiles}"
      }
      on_error => "tacacs_enforcement_profiles_invalid"
    }
    if ![tacacs_enforcement_profiles_invalid] {
      mutate {
        replace => {
          "tacacs_enforcement_profiles_label.key" => "tacacs_enforcement_profiles"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_enforcement_profiles_label"
        }
        on_error => "tacacs_enforcement_profiles_label_merge_failed"
      }
    }
  }
  if [tacacs_request_type] != "" {
    mutate {
      replace => {
        "tacacs_request_type_label.value.string_value" => "%{tacacs_request_type}"
      }
      on_error => "tacacs_request_type_invalid"
    }
    if ![tacacs_request_type_invalid] {
      mutate {
        replace => {
          "tacacs_request_type_label.key" => "tacacs_request_type"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_request_type_label"
        }
        on_error => "tacacs_request_type_label_merge_failed"
      }
    }
  }
  if [tacacs_session_log_timestamp] != "" {
    mutate {
      replace => {
        "tacacs_session_log_timestamp_label.value.string_value" => "%{tacacs_session_log_timestamp}"
      }
      on_error => "tacacs_session_log_timestamp_invalid"
    }
    if ![tacacs_session_log_timestamp_invalid] {
      mutate {
        replace => {
          "tacacs_session_log_timestamp_label.key" => "tacacs_session_log_timestamp"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tacacs_session_log_timestamp_label"
        }
        on_error => "tacacs_session_log_timestamp_label_merge_failed"
      }
    }
  }
  if [common_nas_ip_address] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.nat_ip" => "common_nas_ip_address"
      }
      on_error => "common_nas_ip_address_invalid"
    }
  }

  mutate {
    gsub => [
      "local_msg", "(cisco-av-pair=mdm-tlv=|cisco-av-pair=)", ""
    ]
  }
  if [message] =~ "CmdArgAV=-" {
    mutate {
      gsub => ["local_msg", " CmdSet=\\[\\s+", ""]
    }
  }
  grok {
    match => {
      "r_ip_or_host" => "%{IP:_principal_ip}"
    }
    on_error => "is_principal_hostname"
  }

  if [r_cat_name] == "" and [kv_data] == "" and [description] == "" {
    drop{
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  if [r_cat_name] != "" {
    # Extract data from local log message.
    grok {
      match => {
        "local_msg" => [
        "%{TIMESTAMP_ISO8601:datetime} %{ISO8601_TIMEZONE:timezone} %{NUMBER:sequence_num} %{NUMBER:msg_code} %{DATA:msg_sev} %{DATA:msg_class}: %{DATA:msg_text}, %{GREEDYDATA:msg_attrs}",
        "%{DATA:msg_sev}: %{DATA:msg_class}: %{DATA:msg_text}.  %{GREEDYDATA:msg_attrs}",
        "%{GREEDYDATA:msg_attrs}"
        ]
      }
      overwrite => ["msg_code", "datetime", "sequence_num", "msg_text","msg_sev","msg_attrs"]
      on_error => "failed_grok_local_msg"
    }
    mutate {
      gsub => ["msg_attrs", "  ", ","]
    }
    mutate {
      gsub => ["msg_attrs", "User-Name", "user_name"]
    }
    kv {
      source => "msg_attrs"
      field_split => ","
      value_split => "="
    }
    if [redirectPortRewrite] != "" {
      mutate {
        replace => {
          "redirectPortRewrite_label.value.string_value" => "%{redirectPortRewrite}"
        }
        on_error => "redirectPortRewrite_invalid"
      }
      if ![redirectPortRewrite_invalid] {
        mutate {
          replace => {
            "redirectPortRewrite_label.key" => "redirectPortRewrite"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "redirectPortRewrite_label"
          }
          on_error => "redirectPortRewrite_label_merge_failed"
        }
      }
    }
    if [healthThreshold] != "" {
      mutate {
        replace => {
          "healthThreshold_label.value.string_value" => "%{healthThreshold}"
        }
        on_error => "healthThreshold_invalid"
      }
      if ![healthThreshold_invalid] {
        mutate {
          replace => {
            "healthThreshold_label.key" => "healthThreshold"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "healthThreshold_label"
          }
          on_error => "healthThreshold_label_merge_failed"
        }
      }
    }
    if [soPersistenceTimeOut] != "" {
      mutate {
        replace => {
          "soPersistenceTimeOut_label.value.string_value" => "%{soPersistenceTimeOut}"
        }
        on_error => "soPersistenceTimeOut_invalid"
      }
      if ![soPersistenceTimeOut_invalid] {
        mutate {
          replace => {
            "soPersistenceTimeOut_label.key" => "soPersistenceTimeOut"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "soPersistenceTimeOut_label"
          }
          on_error => "soPersistenceTimeOut_label_merge_failed"
        }
      }
    }
    if [soPersistence] != "" {
      mutate {
        replace => {
          "soPersistence_label.value.string_value" => "%{soPersistence}"
        }
        on_error => "soPersistence_invalid"
      }
      if ![soPersistence_invalid] {
        mutate {
          replace => {
            "soPersistence_label.key" => "soPersistence"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "soPersistence_label"
