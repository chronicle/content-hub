  # RADIUS Accounting: Message Code range 3000~3010
  # principal    -> Framed (IP) / calling_station_id
  # intermediary -> Device (IP/Port) / CalledStationID
  # target       -> Destination (IP/Port)

  if [r_cat_name] == "CISE_RADIUS_Accounting" {
    if [nas_ip_address] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.nat_ip" => "nas_ip_address"
        }
      }
    }
    if [nas_port] != "" {
      mutate {
        convert => {
         "nas_port" => "integer"
        }
      }
      mutate{
        rename => {
          "nas_port" => "event.idm.read_only_udm.principal.nat_port"
        }
        "on_error" => "not_nasport"
      }
    }
    if [msg_code] == "3002" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_HEARTBEAT"
        }
      }
    } else if [msg_code] == "3000" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_STARTUP"
        }
      }
    } else if [msg_code] == "3001" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_SHUTDOWN"
        }
      }
    }
    if [framed_ip_address] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "framed_ip_address"
        }
      }
    }
    if [DestinationIPAddress] != "" {
      mutate  {
         merge => {
          "event.idm.read_only_udm.target.ip" => "DestinationIPAddress"
        }
      }
    }
    if [authentic_mechanism] != "" and [authentic_mechanism] =~ "(?i)remote" {
      mutate {
        replace => {
          "auth.mechanism" => "REMOTE"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.extensions.auth.mechanism" => "auth.mechanism"
        }
      }
    }
  }

  # Passed Authentications (CISE_Passed_Authentications): Message Code range 5200~5241
  # principal    -> Remote (IP) + Port
  # intermediary -> Device (IP/Port)
  # target       -> Destination (IP/Port) / NAS (IP/Port)
  if [r_cat_name] == "CISE_Passed_Authentications" {
    mutate {
      convert => {
        "Port" => "integer"
      }
      on_error => "port_conversion_failed"
    }

    # There are cases when we have values like "tty1" in the
    # Port field and we can map only integer values to port.
    if ![port_conversion_failed] {
      mutate {
        rename => {
          "Port" => "event.idm.read_only_udm.principal.port"
        }
      }
    }

    if ![remote_address_is_invalid] {
      mutate {
        # Some adress may have a \000 after the IP number, so we need to remove it.
        gsub => ["remote_address", "\\\000", ""]
        merge => {
          "event.idm.read_only_udm.principal.ip" => "remote_address"
        }
      }
    }
    if [device_ip_address] != "" {
      mutate {
        merge => {
          "auth_server.ip" => "device_ip_address"
        }
      }
    }
    if [device_port] != "" {
      mutate {
        convert => {
          "device_port" => "integer"
        }
      }
      mutate {
        rename => {
          "device_port" => "auth_server.port"
        }
      }
    }
    if [DestinationIPAddress] != "" {
      mutate {
        convert => {
          "DestinationPort" => "integer"
        }
      }
      mutate {
        rename => {
          # TACACS+ server port
          "DestinationPort" => "event.idm.read_only_udm.target.port"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "auth_server"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "DestinationIPAddress"
        }
        on_error => "no_target_ip"
      }
      if ![no_target_ip] {
        mutate {
          replace => {
            "has_target_ip" => "true"
          }
        }
      }
    } else if [nas_ip_address] != "" {
      mutate {
        convert => {
          "NAS-Port-Id" => "integer"
        }
      }
      mutate {
        rename => {
          "NAS-Port-Id" => "event.idm.read_only_udm.target.port"
        }
