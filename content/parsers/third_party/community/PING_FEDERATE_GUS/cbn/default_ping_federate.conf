    grok {
      match => {
        "column1" => "%{IP:intermediary_ip_1}"
      }
      overwrite => ["intermediary_ip_1"]
      on_error => "intermediary_ip_1_grok_failure"
    }
    mutate {
      merge => {
        "intermediary.ip" => "intermediary_ip_1"
        "intermediary.asset.ip" => "intermediary_ip_1"
      }
      on_error => "intermediary_ip_1_not_present"
    }
    grok {
      match => {
        "column2" => "%{IP:intermediary_ip_2}"
      }
      overwrite => ["intermediary_ip_2"]
      on_error => "intermediary_ip_2_grok_failure"
    }
    mutate {
      merge => {
        "intermediary.ip" => "intermediary_ip_2"
        "intermediary.asset.ip" => "intermediary_ip_2"
      }
      on_error => "intermediary_ip_2_not_present"
    }
    grok {
      match => {
        "column3" => "%{IP:intermediary_ip_3}"
      }
      overwrite => ["intermediary_ip_3"]
      on_error => "intermediary_ip_3_grok_failure"
    }
    mutate {
      merge => {
        "intermediary.ip" => "intermediary_ip_3"
        "intermediary.asset.ip" => "intermediary_ip_3"
      }
      on_error => "intermediary_ip_3_not_present"
    }
  }
  if [logType] != "" {
    mutate {
      replace => {
        "log_type_label.value.string_value" => "%{logType}"
      }
      on_error => "logType_not_present"
    }
    if ![logType_not_present] {
      mutate {
        replace => {
          "log_type_label.key" => "logType"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "log_type_label"
        }
        on_error => "logType_label_not_present"
      }
    }
  }

  if [target_resource_sudo_value] =~ "sudo" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
      }
    }
    if [column3] =~ "SSO" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    } else if [column3] =~ "OAuth" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_not_present"
    }
  }

  if [event_data] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_data}"
      }
      on_error => "event_data_not_present"
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "PING"
      "event.idm.read_only_udm.metadata.product_name" => "PING_FEDERATE"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
