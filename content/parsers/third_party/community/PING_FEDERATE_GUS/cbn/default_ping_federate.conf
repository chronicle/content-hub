# Product: PING
# Category: Authentication
# Supported Format: CSV
# Reference: NA
# Last Updated: 2026-08-13
# Copyright 2026 Google SecOps

filter {
  mutate {
    gsub => ["message","\\|\\s","|"]
  }

  mutate {
    replace => {
      "column3" => ""
      "column4" => ""
      "column5" => ""
      "column8" => ""
      "column9" => ""
      "column14" => ""
      "security_result" => ""
      "ip" => ""
      "kv_data" => ""
      "pfhost" => ""
      "trackingid" => ""
      "event_data" => ""
      "responsetime" => ""
      "description" => ""
      "inmessagetype" => ""
      "status" => ""
      "adapterid" => ""
      "role" => ""
      "subject" => ""
      "connectionid" => ""
      "protocol" => ""
      "COMP" => ""
      "APP" => ""
      "msg" => ""
      "src" => ""
      "cs1" => ""
      "cs2" => ""
      "cs3" => ""
      "cs4" => ""
      "dvchost" => ""
      "duid" => ""
      "suser" => ""
      "requestClientApplication" => ""
      "has_user" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "event_timestamp" => ""
      "kv_msg" => ""
      "product" => ""
      "instanceName" => ""
      "startupID" => ""
      "threadID" => ""
      "conn" => ""
      "op" => ""
      "msgID" => ""
      "requesterIP" => ""
      "requesterDN" => ""
      "base" => ""
      "scope" => ""
      "filter" => ""
      "sizeLimit" => ""
      "timeLimit" => ""
      "deref" => ""
      "typesOnly" => ""
      "attrs" => ""
      "prin_host" => ""
      "from" => ""
      "fromPort" => ""
      "to" => ""
      "toPort" => ""
      "clientConnectionPolicy" => ""
      "reason" => ""
      "target_resource_sudo_value" => ""
      "sec_result_action" => ""
      "intermediary" => ""
      "app" => ""
      "comp" => ""
      "trackingId" => ""
      "transactionId" => ""
      "connectionId" => ""
      "host" => ""
      "adapterId" => ""
      "responseTimeMs" => ""
      "policyName" => ""
      "json_data" => ""
      "timestamp" => ""
      "logType" => ""
      "xff" => ""
      "AssertionConsumerServiceURL" => ""
      "Destination" => ""
      "ID" => ""
      "IssueInstant" => ""
      "ProtocolBinding" => ""
      "ProviderName" => ""
      "Version" => ""
      "Issuer" => ""
      "AllowCreate" => ""
      "Format" => ""
      "Comparison" => ""
      "AuthnContextClassRef" => ""
      "relay_state" => ""
      "relay_state_field" => ""
      "column6" => ""
      "column11" => ""
      "column7" => ""
      "map_field" => ""
      "map_check" => ""
      "addition" => ""
      "event_type" => ""
      "saml_value" => ""
      "saml_field" => ""
    }
  }

  mutate {
    gsub => ["message", "event", "event_data"]
  }

  mutate {
    gsub => ["message", "\\r\\n", " "]
  }

  grok {
    match => {
      "message" => "<%{INT}>%{GREEDYDATA:json_data}"
    }
    overwrite => ["json_data"]
    on_error => "initial_grok_failure"
  }

  json {
    source => "json_data"
    array_function => "split_columns"
    on_error => "json_failure"
  }
  if [host] != "" {
    mutate {
      replace => {
        "pfhost" => "%{host}"
      }
      on_error => "host_not_present"
    }
  }
  if [trackingId] != "" {
    mutate {
      replace => {
        "trackingid" => "%{trackingId}"
      }
      on_error => "trackingId_not_present"
    }
  }
  if [connectionId] != "" {
    mutate {
      replace => {
        "connectionid" => "%{connectionId}"
      }
      on_error => "connectionId_not_present"
    }
  }
  if [adapterId] != "" {
    mutate {
      replace => {
        "adapterid" => "%{adapterId}"
      }
      on_error => "adapterid_not_present"
    }
  }
  if [app] != "" {
    mutate {
      convert => {
        "app" => "string"
      }
      on_error => "app_already_string"
    }
    mutate {
      replace => {
        "APP" => "%{app}"
      }
      on_error => "app_not_present"
    }
  }
  if [comp] != "" {
    mutate {
      convert => {
        "comp" => "string"
      }
      on_error => "comp_already_string"
    }
    mutate {
      replace => {
        "COMP" => "%{comp}"
      }
      on_error => "comp_not_present"
    }
  }
  if [responseTimeMs] != "" {
    mutate {
      convert => {
        "responseTimeMs" => "string"
      }
      on_error => "responseTimeMs_already_str"
    }
    mutate {
      replace => {
        "responsetime" => "%{responseTimeMs}"
      }
      on_error => "responseTimeMs_not_present"
    }
  }
  if [transactionId] != "" {
    mutate {
      replace => {
        "transactionId_label.key" => "transactionId"
        "transactionId_label.value.string_value" => "%{transactionId}"
      }
      on_error => "transactionId_not_present"
    }
    if ![transactionId_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "transactionId_label"
        }
        on_error => "transactionId_field_not_present"
      }
    }
  }
  if [policyName] != "" {
    mutate {
      replace => {
        "policyName_field.key" => "policyName"
        "policyName_field.value.string_value" => "%{policyName}"
      }
      on_error => "policyName_not_present"
    }
    if ![policyName_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "policyName_field"
        }
        on_error => "policyName_field_not_present"
      }
    }
  }
  if [json_failure] {
    mutate {
      gsub => ["message" , "systemIds\\\\\=\\[\\{" , "systemIds="]
    }

    mutate {
      gsub => ["message", '\\":' , "="]
    }

    if [message] =~ "Envelope" {
      mutate {
        gsub => ["message", '\\"', "'"]
      }
    } else {
      mutate {
        gsub => ["message", '\\"', ""]
      }
    }

    csv {
      source => "message"
      separator => "|"
      on_error => "not_csv"
    }
    grok {
      match => {
        "message" => [
          "<%{INT}>%{DATA} %{TIMESTAMP_ISO8601:time},%{INT} (?P<kv_data>APP=.*)",
          "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:prin_host} %{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["kv_data", "dvchost", "description", "time", "prin_host"]
      on_error => "message_grok_failure"
    }
    if [kv_data] != "" {
      mutate {
        gsub => ["kv_data", '\\"', '']
      }
      mutate {
        gsub => ["kv_data", " ([\\w-]+)=","#$1="]
      }
      kv {
        source => "kv_data"
        field_split => "#"
        value_split => "="
        on_error => "kv_fail"
      }
    }

    if [not_csv] and [message_grok_failure] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
  date {
    match => ["column1","yyyy-MM-dd HH:mm:ss"]
    on_error => "column1_not_date"
  }
  if [product] != "" {
    mutate {
      replace => {
        "product_field.key" => "product"
        "product_field.value.string_value" => "%{product}"
      }
      on_error => "product_not_present"
    }
    if ![product_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "product_field"
        }
        on_error => "product_field_not_present"
      }
    }
  }
  if [instanceName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{instanceName}"
      }
      on_error => "instanceName_not_present"
    }
  }
  if [startupID] != "" {
    mutate {
      replace => {
        "startupID_field.key" => "startupID"
        "startupID_field.value.string_value" => "%{startupID}"
      }
      on_error => "startupID_not_present"
    }
    if ![startupID_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "startupID_field"
        }
        on_error => "startupID_field_not_present"
      }
    }
  }
  if [threadID] != "" {
    mutate {
      convert => {
        "threadID" => "string"
      }
      on_error => "threadID_already_string"
    }
    mutate {
      replace => {
        "threadID_field.key" => "threadID"
        "threadID_field.value.string_value" => "%{threadID}"
      }
      on_error => "threadID_not_present"
    }
    if ![threadID_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "threadID_field"
        }
        on_error => "threadID_field_not_present"
      }
    }
  }
  if [conn] != "" {
    mutate {
      convert => {
        "conn" => "string"
      }
      on_error => "conn_already_string"
    }
    mutate {
      replace => {
        "conn_field.key" => "conn"
        "conn_field.value.string_value" => "%{conn}"
      }
      on_error => "conn_not_present"
    }
    if ![conn_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "conn_field"
        }
        on_error => "conn_field_not_present"
      }
    }
  }
  if [op] != "" {
    mutate {
      convert => {
        "op" => "string"
      }
      on_error => "op_already_string"
    }
    mutate {
      replace => {
        "op_field.key" => "op"
        "op_field.value.string_value" => "%{op}"
      }
      on_error => "op_not_present"
    }
    if ![op_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "op_field"
        }
        on_error => "op_field_not_present"
      }
    }
  }
  if [msgID] != "" {
    mutate {
      convert => {
        "msgID" => "string"
      }
      on_error => "msgID_already_string"
    }
    mutate {
      replace => {
        "msgID_field.key" => "msgID"
        "msgID_field.value.string_value" => "%{msgID}"
      }
      on_error => "msgID_not_present"
    }
    if ![msgID_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "msgID_field"
        }
        on_error => "msgID_field_not_present"
      }
    }
  }
  if [requesterIP] != "" {
    grok {
      match => {
        "requesterIP" => "%{IP:requesterIP}"
      }
      overwrite => ["requesterIP"]
      on_error => "requesterIP_grok_Failure"
    }
    if ![requesterIP_grok_Failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "requesterIP"
          "event.idm.read_only_udm.principal.asset.ip" => "requesterIP"
        }
        on_error => "requesterIP_not_present"
      }
      if ![requesterIP_not_present] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [prin_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{prin_host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{prin_host}"
      }
      on_error => "prin_host_not_present"
    }
    if ![prin_host_not_present] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [requesterDN] != "" {
    mutate {
      replace => {
        "requesterDN_field.key" => "requesterDN"
        "requesterDN_field.value.string_value" => "%{requesterDN}"
      }
      on_error => "requesterDN_empty"
    }
    if ![requesterDN_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "requesterDN_field"
        }
        on_error => "requesterDN_field_not_present"
      }
    }
  }
  if [base] != "" {
    mutate {
      replace => {
        "base_field.key" => "base"
        "base_field.value.string_value" => "%{base}"
      }
      on_error => "base_not_present"
    }
    if ![base_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "base_field"
        }
        on_error => "base_field_not_present"
      }
    }
  }
  if [scope] != "" {
    mutate {
      convert => {
        "scope" => "string"
      }
      on_error => "scope_already_string"
    }
    mutate {
      replace => {
        "scope_field.key" => "scope"
        "scope_field.value.string_value" => "%{scope}"
      }
      on_error => "scope_not_present"
    }
    if ![scope_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "scope_field"
        }
        on_error => "scope_field_not_present"
      }
    }
  }
  if [filter] != "" {
    mutate {
      replace => {
        "filter_field.key" => "filter"
        "filter_field.value.string_value" => "%{filter}"
      }
      on_error => "filter_not_present"
    }
    if ![filter_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "filter_field"
        }
        on_error => "filter_field_not_present"
      }
    }
  }
  if [sizeLimit] != "" {
     mutate {
      convert => {
        "sizeLimit" => "string"
      }
      on_error => "sizeLimit_already_string"
    }
    mutate {
      replace => {
        "sizeLimit_field.key" => "sizeLimit"
        "sizeLimit_field.value.string_value" => "%{sizeLimit}"
      }
      on_error => "sizeLimit_not_present"
    }
    if ![sizeLimit_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "sizeLimit_field"
        }
        on_error => "sizeLimit_field_not_present"
      }
    }
  }
  if [timeLimit] != "" {
    mutate {
      convert => {
        "timeLimit" => "string"
      }
      on_error => "timeLimit_already_string"
    }
    mutate {
      replace => {
        "timeLimit_field.key" => "timeLimit"
        "timeLimit_field.value.string_value" => "%{timeLimit}"
      }
      on_error => "timeLimit_not_present"
    }
    if ![timeLimit_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "timeLimit_field"
        }
        on_error => "timeLimit_field_not_present"
      }
    }
  }
  if [deref] != "" {
    mutate {
      replace => {
        "deref_field.key" => "deref"
        "deref_field.value.string_value" => "%{deref}"
      }
      on_error => "deref_not_present"
    }
    if ![deref_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "deref_field"
        }
        on_error => "deref_field_not_present"
      }
    }
  }
  if [typesOnly] != "" {
    mutate {
      replace => {
        "typesOnly_field.key" => "typesOnly"
        "typesOnly_field.value.string_value" => "%{typesOnly}"
      }
      on_error => "typesOnly_not_present"
    }
    if ![typesOnly_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "typesOnly_field"
        }
        on_error => "typesOnly_field_not_present"
      }
    }
  }
   if [attrs] != "" {
    mutate {
      gsub => ["attrs", ",", "\",\""]
    }
    mutate {
      replace => {
        "attrs" => "{\"attrs\":[\"%{attrs}\"]}"
      }
    }
    json {
      source => "attrs"
      array_function => "split_columns"
      on_error => "mails_json_failure"
    }
    for attr in attrs {
      mutate {
        replace => {
          "value_array" => ""
        }
      }
      mutate {
        replace => {
          "value_array.string_value" => "%{attr}"
        }
        on_error => "additional_attr_empty"
      }
      mutate {
        merge => {
          "additional_attr.value.list_value.values" => "value_array"
        }
        on_error => "additional_attr_not_found"
      }
    }
    if [attrs] != "" {
      mutate {
        replace => {
          "additional_attr.key" => "attr"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_attr"
        }
        on_error => "additional_attr_field_not_found"
      }
    }
  }
  if [from] != "" {
    grok {
      match => {
        "from" => "%{IP:from}"
      }
      overwrite => ["from"]
      on_error => "from_grok_Failure"
    }
    if ![from_grok_Failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "from"
          "event.idm.read_only_udm.principal.asset.ip" => "from"
        }
        on_error => "from_not_present"
      }
    }
    if ![from_not_present] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [fromPort] != "" {
    mutate {
      convert => {
        "fromPort" => "integer"
      }
      on_error => "fromPort_already_integer"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{fromPort}"
      }
      on_error => "fromPort_not_present"
    }
  }
  if [to] != "" {
    grok {
      match => {
        "to" => "%{IP:to}"
      }
      overwrite => ["to"]
      on_error => "to_grok_Failure"
    }
    if ![to_grok_Failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "to"
          "event.idm.read_only_udm.target.asset.ip" => "to"
        }
        on_error => "to_not_present"
      }
    }
    if ![to_not_present] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [toPort] != "" {
    mutate {
      convert => {
        "toPort" => "integer"
      }
      on_error => "toPort_already_integer"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{toPort}"
      }
      on_error => "toPort_not_present"
    }
  }
  if [clientConnectionPolicy] != "" {
    mutate {
      replace => {
        "clientConnectionPolicy_field.key" => "clientConnectionPolicy"
        "clientConnectionPolicy_field.value.string_value" => "%{clientConnectionPolicy}"
      }
      on_error => "clientConnectionPolicy_not_present"
    }
    if ![clientConnectionPolicy_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "clientConnectionPolicy_field"
        }
        on_error => "clientConnectionPolicy_field_not_present"
      }
    }
  }
  if [reason] != "" {
    mutate {
      replace => {
        "reason_field.key" => "reason"
        "reason_field.value.string_value" => "%{reason}"
      }
      on_error => "reason_not_present"
    }
    if ![reason_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "reason_field"
        }
        on_error => "reason_field_not_present"
      }
    }
  }
  if [msg] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{msg}"
      }
      on_error => "msg_not_present"
    }
  }
  if [column1_not_date] {
    grok {
      match => {
        "column1" => "%{TIMESTAMP_ISO8601:event_timestamp}\\,%{INT}\\s*%{GREEDYDATA:kv_msg}"
      }
      overwrite => ["event_timestamp", "kv_msg"]
      on_error => "column1_grok_failure"
    }
    if [kv_msg] != "" {
      mutate {
        gsub => ["kv_msg", '\\"', '']
      }
      mutate {
        gsub => ["kv_msg", " ([\\w-]+)=","#$1="]
      }
      kv {
        source => "kv_msg"
        field_split => "#"
        value_split => "="
        on_error => "kv_msg_failed"
      }
    }
    date {
      match => ["event_timestamp","yyyy-MM-dd HH:mm:ss"]
      on_error => "date_parse_failed"
    }
  }
  if [column14] != "" {
    grok {
      match => {
        "column14" => "client_id=%{GREEDYDATA:client_id}"
      }
      overwrite => ["client_id"]
      on_error => "client_id_grok_failure"
    }
    if ![client_id_grok_failure] {
      mutate {
        replace => {
          "client_id_field.key" => "client_id"
          "client_id_field.value.string_value" => "%{client_id}"
        }
        on_error => "client_id_field_not_present"
      }
      if ![client_id_field_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "client_id_field"
          }
          on_error => "client_id_field_not_present"
        }
      }
    }
  }

  if [ip] != "" {
    grok {
      match => {
        "ip" => "%{IP:ip}"
      }
      overwrite => ["ip"]
      on_error => "ip_grok_Failure"
    }
    if ![ip_grok_Failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ip"
          "event.idm.read_only_udm.principal.asset.ip" => "ip"
        }
        on_error => "ip_not_present"
      }
      if ![ip_not_present] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [pfhost] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{pfhost}"
        "intermediary.asset.hostname" => "%{pfhost}"
      }
      on_error => "pfhost_not_present"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
