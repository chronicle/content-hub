# Product: AWS EC2 VPC
# Category: AWS Specific
# Supported Format: JSON
# Reference: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeVpcs.html
# Last Updated: 2024-01-31
# Copyright 2023 Chronicle LLC

filter {
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }

  if [_not_json] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  mutate {
    rename => {
      "ID" => "VpcID"
      "CIDRBlock" => "CidrBlock"
      "DHCPOptionsID" => "DhcpOptionsID"
      "CIDRBlockAssociation" => "CidrBlockAssociation"
      "IPv6CIDRBlockAssociationSet" => "Ipv6CidrBlockAssociationSet"
    }
  }

  mutate {
    replace => {
      "var_metadata.vendor_name" => "AWS"
    }
  }

  mutate {
    replace => {
      "var_metadata.product_name" => "Amazon VPC"
    }
  }

  mutate {
    replace => {
      "var_metadata.entity_type" => "RESOURCE"
    }
  }

  mutate {
    replace => {
      "temp" => "%{VpcID}"
    }
    on_error => "vpc_id_not"
  }
  if ![vpc_id_not] and [VpcID] != "" {
    mutate {
      replace => {
        "var_metadata.product_entity_id" => "%{VpcID}"
      }
    }

    mutate {
      replace => {
        "var_entity.resource.product_object_id" => "%{VpcID}"
      }
    }
  }

  mutate {
    replace => {
      "oner_id_lab.value" => "%{OwnerID}"
    }
    on_error => "OwnerID_not"
  }
  if ![OwnerID_not] and [OwnerID] != "" {
    mutate {
      replace => {
        "oner_id_lab.key" => "owner_id"
      }
    }
    mutate {
      merge => {
        "var_entity.resource.attribute.labels" => "oner_id_lab"
      }
    }
  }

  mutate {
    replace => {
      "var_entity.resource.resource_type" => "VPC_NETWORK"
    }
  }

  mutate {
    replace => {
      "var_entity.resource.attribute.cloud.environment" =>
      "AMAZON_WEB_SERVICES"
    }
  }

  mutate {
    replace => {
      "state_lab.value" => "%{State}"
    }
    on_error => "State_not"
  }
  if ![State_not] and [state_lab][value] != "" {
    mutate {
      replace => {
        "state_lab.key" => "state"
      }
    }

    mutate {
      merge => {
        "var_entity.resource.attribute.labels" => "state_lab"
      }
    }
  }

  mutate {
    replace => {
      "instance_tenancy_lab.value" => "%{InstanceTenancy}"
    }
    on_error => "InstanceTenancy_not"
  }
  if ![InstanceTenancy_not] and [instance_tenancy_lab][value] != "" {
    mutate {
      replace => {
        "instance_tenancy_lab.key" => "instance_tenancy"
      }
    }

    mutate {
      merge => {
        "var_entity.resource.attribute.labels" => "instance_tenancy_lab"
      }
    }
  }

  mutate {
    replace => {
      "dhcp_options_id_lab.value" => "%{DhcpOptionsID}"
    }
    on_error => "DhcpOptionsID_not"
  }
  if ![DhcpOptionsID_not] and [dhcp_options_id_lab][value] != "" {
    mutate {
      replace => {
        "dhcp_options_id_lab.key" => "dhcp_options_id"
      }
    }

    mutate {
      merge => {
        "var_entity.resource.attribute.labels" => "dhcp_options_id_lab"
      }
    }
  }

  mutate {
    replace => {
      "cidr_block_lab.value" => "%{CidrBlock}"
    }
    on_error => "CidrBlock_not"
  }
  if ![CidrBlock_not] and [cidr_block_lab][value] != "" {
    mutate {
      replace => {
        "cidr_block_lab.key" => "cidr_block"
      }
    }
    mutate {
      replace => {
        "var_entity.network.ip_subnet_range" => "%{CidrBlock}"
      }
    }

    mutate {
      merge => {
        "var_entity.resource.attribute.labels" => "cidr_block_lab"
      }
    }
  }

  for index, cidr_block_association in CidrBlockAssociation {
    mutate {
      rename => {
        "cidr_block_association.ID" => "cidr_block_association.AssociationID"
        "cidr_block_association.CIDRBlockState.State" =>
        "cidr_block_association.CidrBlockState.State"
        "cidr_block_association.CIDRBlockState.Message" =>
        "cidr_block_association.CidrBlockState.StatusMessage"
      }
    }

    mutate {
      replace => {
        "cidr_block_association_association_id_lab" => ""
        "cidr_block_association_cidr_block_state_state_lab" => ""
        "cidr_block_association_cidr_block_state_status_message_lab" => ""
      }
    }
    mutate {
      replace => {
        "cidr_block_association_association_id_lab.value" =>
        "%{cidr_block_association.AssociationID}"
      }
      on_error => "cidr_block_association_AssociationID_not"
    }
    if ![cidr_block_association_AssociationID_not] and
    [cidr_block_association_association_id_lab][value] != "" {
      mutate {
        replace => {
          "cidr_block_association_association_id_lab.key" =>
          "cidr_block_association_association_id"
        }
      }

      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "cidr_block_association_association_id_lab"
        }
      }
    }

    mutate {
      replace => {
        "cidr_block_association_cidr_block_state_state_lab.value" =>
        "%{cidr_block_association.CidrBlockState.State}"
      }
      on_error => "cidr_block_association_CidrBlockState_State_not"
    }
    if ![cidr_block_association_CidrBlockState_State_not] and
    [cidr_block_association_cidr_block_state_state_lab][value] != "" {
      mutate {
        replace => {
          "cidr_block_association_cidr_block_state_state_lab.key" =>
          "cidr_block_association_cidr_block_state_state"
        }
      }

      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "cidr_block_association_cidr_block_state_state_lab"
        }
      }
    }

    mutate {
      replace => {
        "cidr_block_association_cidr_block_state_status_message_lab.value" =>
        "%{cidr_block_association.CidrBlockState.StatusMessage}"
      }
      on_error => "cidr_block_association_CidrBlockState_StatusMessage_not"
    }
    if ![cidr_block_association_CidrBlockState_StatusMessage_not] and
    [cidr_block_association_cidr_block_state_status_message_lab][value] != "" {
      mutate {
        replace => {
          "cidr_block_association_cidr_block_state_status_message_lab.key" =>
          "cidr_block_association_cidr_block_state_status_message"
        }
      }

      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "cidr_block_association_cidr_block_state_status_message_lab"
        }
      }
    }
  }

  for index, ipv6_cidr_block_association_set in Ipv6CidrBlockAssociationSet {
    mutate {
      rename => {
        "ipv6_cidr_block_association_set.ID" =>
        "ipv6_cidr_block_association_set.AssociationID"
        "ipv6_cidr_block_association_set.CIDRBlock" =>
        "ipv6_cidr_block_association_set.Ipv6CidrBlock"
        "ipv6_cidr_block_association_set.Pool" =>
        "ipv6_cidr_block_association_set.Ipv6Pool"
        "ipv6_cidr_block_association_set.CIDRBlockState.State" =>
        "ipv6_cidr_block_association_set.Ipv6CidrBlockState.State"
        "ipv6_cidr_block_association_set.CIDRBlockState.Message" =>
        "ipv6_cidr_block_association_set.Ipv6CidrBlockState.StatusMessage"
      }
    }

    mutate {
      replace => {
        "ipv6_cidr_block_association_set_association_id_lab" => ""
        "ipv6_cidr_block_association_set_ipv6_cidr_block_lab" => ""
        "ipv6_cidr_block_association_set_ipv6_pool_lab" => ""
        "ipv6_cidr_block_association_set_network_border_group_lab" => ""
        "ipv6_cidr_block_association_set_ipv6_cidr_block_state_state_lab" => ""
        "ipv6_cidr_block_association_set_ipv6_cidr_block_state_status_message_lab" => ""
      }
    }
    mutate {
      replace => {
        "ipv6_cidr_block_association_set_association_id_lab.value" =>
        "%{ipv6_cidr_block_association_set.AssociationID}"
      }
      on_error => "ipv6_cidr_block_association_set_AssociationID_not"
    }
    if ![ipv6_cidr_block_association_set_AssociationID_not] and
    [ipv6_cidr_block_association_set_association_id_lab][value] != "" {
      mutate {
        replace => {
          "ipv6_cidr_block_association_set_association_id_lab.key" =>
          "ipv6_cidr_block_association_set_association_id"
        }
      }
      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "ipv6_cidr_block_association_set_association_id_lab"
        }
      }
    }

    mutate {
      replace => {
        "ipv6_cidr_block_association_set_ipv6_cidr_block_lab.value" =>
        "%{ipv6_cidr_block_association_set.Ipv6CidrBlock}"
      }
      on_error => "ipv6_cidr_block_association_set_Ipv6CidrBlock_not"
    }
    if ![ipv6_cidr_block_association_set_Ipv6CidrBlock_not] and
    [ipv6_cidr_block_association_set_ipv6_cidr_block_lab][value] != "" {
      mutate {
        replace => {
          "ipv6_cidr_block_association_set_ipv6_cidr_block_lab.key" =>
          "ipv6_cidr_block_association_set_ipv6_cidr_block"
        }
      }
      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "ipv6_cidr_block_association_set_ipv6_cidr_block_lab"
        }
      }
    }

    mutate {
      replace => {
        "ipv6_cidr_block_association_set_ipv6_pool_lab.value" =>
        "%{ipv6_cidr_block_association_set.Ipv6Pool}"
      }
      on_error => "ipv6_cidr_block_association_set_Ipv6Pool_not"
    }
    if ![ipv6_cidr_block_association_set_Ipv6Pool_not] and
    [ipv6_cidr_block_association_set_ipv6_cidr_block_lab][value] != "" {
      mutate {
        replace => {
          "ipv6_cidr_block_association_set_ipv6_pool_lab.key" =>
          "ipv6_cidr_block_association_set_ipv6_pool"
        }
      }
      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "ipv6_cidr_block_association_set_ipv6_pool_lab"
        }
      }
    }

    mutate {
      replace => {
        "ipv6_cidr_block_association_set_network_border_group_lab.value" =>
        "%{ipv6_cidr_block_association_set.NetworkBorderGroup}"
      }
      on_error => "ipv6_cidr_block_association_set_NetworkBorderGroup_not"
    }
    if ![ipv6_cidr_block_association_set_NetworkBorderGroup_not] and
    [ipv6_cidr_block_association_set_network_border_group_lab][value] != "" {
      mutate {
        replace => {
          "ipv6_cidr_block_association_set_network_border_group_lab.key" =>
          "ipv6_cidr_block_association_set_network_border_group"
        }
      }
      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "ipv6_cidr_block_association_set_network_border_group_lab"
        }
      }
    }

    mutate {
      replace => {
        "ipv6_cidr_block_association_set_ipv6_cidr_block_state_state_lab.value" =>
        "%{ipv6_cidr_block_association_set.Ipv6CidrBlockState.State}"
      }
      on_error => "ipv6_cidr_block_association_set_Ipv6CidrBlockState_State_not"
    }
    if ![ipv6_cidr_block_association_set_Ipv6CidrBlockState_State_not] and
    [ipv6_cidr_block_association_set_ipv6_cidr_block_state_state_lab][value] != "" {
      mutate {
        replace => {
          "ipv6_cidr_block_association_set_ipv6_cidr_block_state_state_lab.key" =>
          "ipv6_cidr_block_association_set_ipv6_cidr_block_state_state"
        }
      }
      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "ipv6_cidr_block_association_set_ipv6_cidr_block_state_state_lab"
        }
      }
    }

    mutate {
      replace => {
        "ipv6_cidr_block_association_set_ipv6_cidr_block_state_status_message_lab.value" =>
        "%{ipv6_cidr_block_association_set.Ipv6CidrBlockState.StatusMessage}"
      }
      on_error => "ipv6_cidr_block_association_set_Ipv6CidrBlockState_StatusMessage_not"
    }
    if ![ipv6_cidr_block_association_set_Ipv6CidrBlockState_StatusMessage_not] and
    [ipv6_cidr_block_association_set_ipv6_cidr_block_state_status_message_lab][value] != "" {
      mutate {
        replace => {
          "ipv6_cidr_block_association_set_ipv6_cidr_block_state_status_message_lab.key" =>
          "ipv6_cidr_block_association_set_ipv6_cidr_block_state_status_message"
        }
      }
      mutate {
        merge => {
          "var_entity.resource.attribute.labels" =>
          "ipv6_cidr_block_association_set_ipv6_cidr_block_state_status_message_lab"
        }
      }
    }
  }


  mutate {
    convert => {
      "IsDefault" => "string"
    }
    on_error => "already_a_string"
  }

  mutate {
    replace => {
      "is_default_lab.value" => "%{IsDefault}"
    }
    on_error => "IsDefault_not"
  }
  if ![IsDefault_not] and [is_default_lab][value] != "" {
    mutate {
      replace => {
        "is_default_lab.key" => "is_default"
      }
    }

    mutate {
      merge => {
        "var_entity.resource.attribute.labels" => "is_default_lab"
      }
    }
  }

  for index, tag in TagSet {
    mutate {
      replace => {
        "var_lab" => ""
      }
    }
    mutate {
      replace => {
        "var_lab.value" => "%{tag.Value}"
      }
      on_error => "tag_value_not"
    }
    if ![tag_value_not] and [var_lab][value] != "" {
      mutate {
        replace => {
          "var_lab.key" => "%{tag.Key}"
        }
      }

      mutate {
        merge => {
          "var_entity.resource.attribute.labels" => "var_lab"
        }
      }
    }
  }

  mutate {
    rename => {
      "var_metadata" => "event.idm.entity.metadata"
      "var_entity" => "event.idm.entity.entity"
    }
  }



  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
