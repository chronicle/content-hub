        "_principal.user.userid" => "%{data.additionalDetails.principalResourceName}"
        "has_user" => "true"
      }
      on_error => "no_principalResourceName"
    }
  }

  mutate {
    replace => {
      "resource_id" => "%{data.additionalDetails.resourceId}"
    }
    on_error => "zerror.json12"
  }

  if ![zerror][json12]{
    mutate {
      replace => {
        "_principal.resource.product_object_id" => "%{resource_id}"
      }
    }
  }

