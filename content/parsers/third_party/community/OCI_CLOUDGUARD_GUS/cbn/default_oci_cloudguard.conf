    }
  }

  if [data][additionalDetails][sightingType] != "" {
    mutate {
      replace => {
        "sightingType_label.value" => "%{data.additionalDetails.sightingType}"
        "sightingType_label.key" => "sightingType"
      }
      on_error => "no_sightingType"
    }
    if ![no_sightingType] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sightingType_label"
        }
        on_error => "no_sightingType_label"
      }
    }
  }

  if [data][additionalDetails][tacticName] != "" {
    mutate {
      replace => {
        "tactic_data.name" => "%{data.additionalDetails.tacticName}"
      }
      on_error => "no_tacticName"
    }
  }
  if [tactic_data] != "" {
    mutate {
      merge => {
        "security_result.attack_details.tactics" => "tactic_data"
      }
      on_error => "no_tactic_data"
    }
  }

  if [data][additionalDetails][techniqueName] != "" {
