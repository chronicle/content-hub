        }
        on_error => "no_security_list_ocids_label"
      }
      if ![no_security_list_ocids_label] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
  }

  if [data][additionalDetails][detectorRuleId] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{data.additionalDetails.detectorRuleId}"
      }
      on_error => "no_detectorRuleId"
    }
  }

  if [data][additionalDetails][detectorRuleType] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{data.additionalDetails.detectorRuleType}"
      }
