      }
      on_error => "no_technique_data"
    }
  }

  if [data][additionalDetails][sightingScore] != "" {
    mutate {
      convert => {
        "data.additionalDetails.sightingScore" => "string"
      }
      on_error => "no_sightingScore"
    }
    mutate {
      replace => {
        "sightingScore_label.value" => "%{data.additionalDetails.sightingScore}"
        "sightingScore_label.key" => "sightingScore"
      }
      on_error => "no_sightingScore"
    }
    if ![no_sightingScore] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sightingScore_label"
        }
        on_error => "no_sightingScore_label"
      }
    }
  }

  if [data][additionalDetails][riskScore] != "" {
    mutate {
      convert => {
        "data.additionalDetails.riskScore" => "string"
      }
      on_error => "no_riskScore"
    }
    mutate {
      replace => {
        "riskScore_label.value" => "%{data.additionalDetails.riskScore}"
        "riskScore_label.key" => "riskScore"
      }
      on_error => "no_riskScore"
    }
    if ![no_riskScore] {
      mutate {
        merge => {
          "security_result.detection_fields" => "riskScore_label"
        }
        on_error => "no_riskScore_label"
      }
    }
  }

  if [data][additionalDetails][confidence] != "" {
    mutate {
      rename => {
        "data.additionalDetails.confidence" => "security_result.confidence_score"
      }
      on_error => "no_confidence"
    }
  }

  if [contentType] != "" {
    mutate {
        replace => {
            "contentType_label.value.string_value" => "%{contentType}"
            "contentType_label.key" => "contentType"
        }
        on_error => "no_contentType"
    }
    if ![no_contentType] {
      mutate {
        merge => {
          "additional.fields" => "contentType_label"
        }
        on_error => "no_contentType_label"
      }
    }
  }

  if [cloudEventsVersion] != "" {
    mutate {
      replace => {
        "cloudEventsVersion_label.value.string_value" => "%{cloudEventsVersion}"
        "cloudEventsVersion_label.key" => "cloudEventsVersion"
      }
      on_error => "no_cloudEventsVersion"
    }
    if ![no_cloudEventsVersion] {
      mutate {
        merge => {
          "additional.fields" => "cloudEventsVersion_label"
        }
        on_error => "no_cloudEventsVersion_label"
      }
    }
  }


  if [data][additionalDetails][problemName] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{data.additionalDetails.problemName}"
      }
      on_error => "no_problemName"
    }
  }

  if [data][additionalDetails][problemDescription] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{data.additionalDetails.problemDescription}"
      }
      on_error => "no_problemDescription"
    }
  }


  mutate {
    replace => {
      "description" => "%{data.additionalDetails.problemDescription}"
    }
    on_error => "zerror.json20"
  }

  if [description] == ""{
    mutate {
      replace => {
      "description" => "%{data.additionalDetails.description}"
      }
      on_error => "zerror.json23"
    }
  }

  mutate {
    replace => {
      "resource_type" => "%{data.additionalDetails.resourceType}"
    }
    on_error => "zerror.json10"
  }
  if ![zerror][json10]{
    mutate {
      replace => {
        "_principal.resource.resource_subtype" => "%{resource_type}"
      }
      on_error => "no_resource_type"
    }
  }

  if [resource_type] == "User" {
    mutate {
      replace => {
        "_principal.user.userid" => "%{data.additionalDetails.resourceName}"
        "has_user" => "true"
      }
      on_error => "zerror.json11"
    }
  }

  mutate {
    replace => {
      "resource_name" => "%{data.additionalDetails.resourceName}"
    }
    on_error => "zerror.json11"
  }

  if ![zerror][json11]{
    mutate {
      replace => {
        "_principal.resource.name" => "%{resource_name}"
      }
      on_error => "no_resource_name"
    }

    if [resource_type] == "User"{
      mutate {
        replace => {
          "_principal.user.userid" => "%{resource_name}"
          "has_user" => "true"
        }
        on_error => "zerror.json11"
      }
    }
  }

  if [data][additionalDetails][principalResourceType] != "" {
