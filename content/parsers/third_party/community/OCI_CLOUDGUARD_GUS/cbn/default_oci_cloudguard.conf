    replace => {
      "action" => ""
      "description" => ""
      "event_type" => "GENERIC_EVENT"
      "json_log" => ""
      "mydate" => ""
      "observer" => ""
      "observer_domain" => ""
      "observer_host" => ""
      "observer_ip" => ""
      "principal" => ""
      "principal_domain" => ""
      "principal_host" => ""
      "principal_port" => ""
      "principal_user" => ""
      "product" => "Oracle Cloud Guard"
      "product_event" => ""
      "severity" => ""
      "security_action" => ""
      "security_result" => ""
      "summary" => ""
      "target" => ""
      "target_domain" => ""
      "target_host" => ""
      "target_port" => ""
      "target_url" => ""
      "target_user" => ""
      "timestamp" => ""
      "timezone" => ""
      "vendor" => "Oracle"
      "version" => ""
      "compartment_id" => ""
      "compartment_name" => ""
      "status" => ""
      "problem_recommendation" => ""
      "eventType" => ""
      "cloudEventsVersion" => ""
      "eventTypeVersion" => ""
      "source" => ""
      "contentType" => ""
      "data.additionalDetails.tenantId" => ""
      "data.additionalDetails.status" => ""
      "data.additionalDetails.reason" => ""
      "data.additionalDetails.problemName" => ""
      "data.additionalDetails.riskLevel" => ""
      "data.additionalDetails.problemType" => ""
      "data.additionalDetails.problemDescription" => ""
      "data.additionalDetails.targetId" => ""
      "data.additionalDetails.labels" => ""
      "data.additionalDetails.impactedResourceName" => ""
      "data.additionalDetails.impactedResourceId" => ""
      "data.additionalDetails.impactedResourceType" => ""
      "data.additionalDetails.problemRecommendation" => ""
      "eventID" => ""
      "has_user" => ""
      "has_target_resource" => ""
      "resource_type" => ""
      "data.additionalDetails.principalResourceType" => ""
      "data.additionalDetails.principalResourceName" => ""
      "data.additionalDetails.principalResourceId" => ""
      "data.additionalDetails.problemAdditionalDetails.public_ips" => ""
      "has_principal" => ""
      "ip" => ""
      "data.additionalDetails.problemAdditionalDetails.vnicDetails" => ""
      "vnicDetails.0.vnicPublicIp" => ""
      "vnicDetails.0.vnicDisplayName" => ""
      "vnicDetails.0.vnicId" => ""
      "vnicDetails.0.vnicAttachmentId" => ""
      "vnicDetails.0.vnicAttachmentDisplayName" => ""
      "data.additionalDetails.region" => ""
      "data.additionalDetails.problemAdditionalDetails.Subnets" => ""
      "data.additionalDetails.problemAdditionalDetails.Instance_OCID" => ""
      "data.additionalDetails.problemAdditionalDetails.Route_Table_OCIDs" => ""
      "data.additionalDetails.problemAdditionalDetails.Security_List_OCIDs" => ""
      "data.additionalDetails.detectorRuleId" => ""
      "data.additionalDetails.detectorRuleType" => ""
      "data.additionalDetails.sightingType" => ""
      "data.additionalDetails.tacticName" => ""
      "data.additionalDetails.techniqueName" => ""
      "data.additionalDetails.sightingScore" => ""
      "data.additionalDetails.riskScore" => ""
      "data.additionalDetails.confidence" => ""
      "tactic_data" => ""
      "technique_data" => ""
    }
  }

  mutate {
    gsub => ["message", "Public IPs", "public_ips"]
  }

  mutate {
    gsub => ["message", "Instance OCID", "Instance_OCID"]
  }

  mutate {
    gsub => ["message", "Route Table OCIDs", "Route_Table_OCIDs"]
  }

  mutate {
    gsub => ["message", "Security List OCIDs", "Security_List_OCIDs"]
  }

  # Handle JSON formatted logs
  # https://www.elastic.co/guide/en/logstash/current/plugins-filters-json.html#plugins-filters-json
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }
  if [json_failed] {
    drop { tag => "TAG_MALFORMED_ENCODING"}
  }

  if [eventType] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventType}"
      }
      on_error => "no_eventType"
    }
  }

  if [eventTypeVersion] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{eventTypeVersion}"
      }
      on_error => "no_eventTypeVersion"
    }
  }

  if [data][additionalDetails][region] != "" {
    mutate {
      replace => {
        "_principal.location.name" => "%{data.additionalDetails.region}"
      }
      on_error => "no_region"
    }
  }


  if [data][additionalDetails][problemAdditionalDetails][public_ips] != "" {
    grok {
      match => {
        "data.additionalDetails.problemAdditionalDetails.public_ips" => "%{IP:ip}"
      }
      overwrite => ["ip"]
      on_error => "no_public_ips"
    }
    if ![no_public_ips] {
      mutate {
        merge => {
          "_principal.ip" => "ip"
          "_principal.asset.ip" => "ip"
        }
        on_error => "invalid_ip"
      }
      if ![invalid_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [data][additionalDetails][problemAdditionalDetails][vnicDetails] != "" {
    mutate {
      replace => {
        "vnicDetails" => "{\"vnicDetails\":%{data.additionalDetails.problemAdditionalDetails.vnicDetails}}"
      }
      on_error => "no_vnicDetails"
    }
    json {
      source => "vnicDetails"
      array_function => "split_columns"
      on_error => "vnic_json_failed"
    }
    mutate {
      replace => {
        "vnicPublicIp" => "%{vnicDetails.0.vnicPublicIp}"
      }
      on_error => "no_vnicPublicIp"
    }
    if ![no_vnicPublicIp] and [vnicDetails][0][vnicPublicIp] != "" {
      mutate {
        merge => {
          "_principal.ip" => "vnicDetails.0.vnicPublicIp"
          "_principal.asset.ip" => "vnicDetails.0.vnicPublicIp"
        }
        on_error => "no_vnicPublicIp"
      }
      if ![no_vnicPublicIp] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [data][additionalDetails][impactedResourceName] != "" {
    mutate {
      replace => {
        "_target.resource.name" => "%{data.additionalDetails.impactedResourceName}"
        "has_target_resource" => "true"
      }
      on_error => "no_impactedResourceName"
    }
  }
  else if [vnicDetails][0][vnicDisplayName] != "" {
    mutate {
      replace => {
        "_target.resource.name" => "%{vnicDetails.0.vnicDisplayName}"
        "has_target_resource" => "true"
      }
      on_error => "no_vnicDisplayName"
    }
  }

  if [data][additionalDetails][impactedResourceId] != "" {
    mutate {
      replace => {
        "_target.resource.product_object_id" => "%{data.additionalDetails.impactedResourceId}"
        "has_target_resource" => "true"
      }
      on_error => "no_impactedResourceId"
    }
  }
  else if [vnicDetails][0][vnicId] != "" {
    mutate {
      replace => {
        "_target.resource.product_object_id" => "%{vnicDetails.0.vnicId}"
        "has_target_resource" => "true"
      }
      on_error => "no_vnicId"
    }
  }

  if [data][additionalDetails][impactedResourceType] != "" {
    mutate {
      replace => {
        "_target.resource.resource_subtype" => "%{data.additionalDetails.impactedResourceType}"
        "has_target_resource" => "true"
      }
      on_error => "no_impactedResourceType"
    }
  }

  if [data][additionalDetails][targetId] != "" {
    mutate {
        replace => {
            "target_id_label.value" => "%{data.additionalDetails.targetId}"
            "target_id_label.key" => "targetId"
        }
        on_error => "no_targetId"
    }
    if ![no_targetId] {
      mutate {
        merge => {
          "_target.resource.attribute.labels" => "target_id_label"
        }
        on_error => "no_targetId_label"
      }
      if ![no_targetId_label] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
  }

  if [data][additionalDetails][labels] != "" {
    mutate {
      replace => {
        "labels_label.value" => "%{data.additionalDetails.labels}"
        "labels_label.key" => "labels"
      }
      on_error => "no_labels"
    }
    if ![no_labels] {
      mutate {
        merge => {
          "_target.resource.attribute.labels" => "labels_label"
        }
        on_error => "no_labels_label"
      }
      if ![no_labels_label] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "vnicAttachmentId_label.value" => "%{vnicDetails.0.vnicAttachmentId}"
      "vnicAttachmentId_label.key" => "vnicAttachmentId"
    }
    on_error => "no_vnicAttachmentId"
  }
  if ![no_vnicAttachmentId] and [vnicDetails][0][vnicAttachmentId] != "" {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "vnicAttachmentId_label"
      }
      on_error => "no_vnicAttachmentId_label"
    }
    if ![no_vnicAttachmentId_label] {
      mutate {
        replace => {
          "has_target_resource" => "true"
        }
      }
    }
  }

  mutate {
    replace => {
      "vnicAttachmentDisplayName_label.value" => "%{vnicDetails.0.vnicAttachmentDisplayName}"
      "vnicAttachmentDisplayName_label.key" => "vnicAttachmentDisplayName"
    }
    on_error => "no_vnicAttachmentDisplayName"
  }
  if ![no_vnicAttachmentDisplayName] and [vnicDetails][0][vnicAttachmentDisplayName] != "" {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "vnicAttachmentDisplayName_label"
      }
      on_error => "no_vnicAttachmentDisplayName_label"
    }
    if ![no_vnicAttachmentDisplayName_label] {
      mutate {
        replace => {
          "has_target_resource" => "true"
        }
      }
    }
  }

  if [data][additionalDetails][problemAdditionalDetails][Subnets] != "" {
    mutate {
      replace => {
        "subnets_label.value" => "%{data.additionalDetails.problemAdditionalDetails.Subnets}"
        "subnets_label.key" => "subnets"
      }
      on_error => "no_subnets"
    }
    if ![no_subnets] {
      mutate {
        merge => {
          "_target.resource.attribute.labels" => "subnets_label"
        }
        on_error => "no_subnets_label"
      }
      if ![no_subnets_label] {
