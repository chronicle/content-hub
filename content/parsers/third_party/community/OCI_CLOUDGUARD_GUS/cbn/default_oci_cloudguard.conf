    }
  }

  if [data][additionalDetails][riskLevel] != "" {
    mutate {
      replace => {
        "severity" => "%{data.additionalDetails.riskLevel}"
      }
      on_error => "no_riskLevel"
    }
  }


  # status Additional Field
  mutate {
    replace => {
      "status" => "%{data.additionalDetails.status}"
    }
    on_error => "zerror.json21"
  }
  if [status] != "" {
    mutate {
      replace => {
        "additional_status.key" => "status"
        "additional_status.value.string_value" => "%{status}"
      }
    }
    mutate {
      merge => {
        "additional.fields" => "additional_status"
      }
    }
  }

  # problem_recommendation Additional Field
  mutate {
    replace => {
      "problem_recommendation" => "%{data.additionalDetails.problemRecommendation}"
    }
    on_error => "zerror.json22"
  }
  if [problem_recommendation] != "" {
    mutate {
      replace => {
        "additional_problem_recommendation.key" => "problem_recommendation"
        "additional_problem_recommendation.value.string_value" => "%{problem_recommendation}"
      }
    }
    mutate {
      merge => {
        "additional.fields" => "additional_problem_recommendation"
      }
    }
  }

  # Replace timestamp
  mutate {
    replace => {
      "timestamp" => "%{eventTime}"
    }
    on_error => "zerror.json01"
  }

  # Set Time
  # https://www.elastic.co/guide/en/logstash/current/plugins-filters-date.html#plugins-filters-date
  if [timestamp] != "" {
    # Convert Time Zone Identity To The Offset Value
    if [timezone] != "" { 
      if [timezone] =~ ".*GMT.*" { mutate { gsub => ["timezone", "GMT", "+0000"] } }  
      else if [timezone] == "Z" { mutate { gsub => ["timezone", "Z", "+0000"] } }  
      else if [timezone] =~ ".*UTC.*" { mutate { gsub => ["timezone", "UTC", "+0000"] } }  
      else if [timezone] == "Europe/Paris" { mutate { gsub => ["timezone", "Europe/Paris", "+0100"] } }  
      else if [timezone] =~ ".*CET.*" { mutate { gsub => ["timezone", "CET", "+0100"] } }  
      else if [timezone] =~ ".*MET.*" { mutate { gsub => ["timezone", "MET", "+0100"] } }  
      else if [timezone] =~ ".*DST.*" { mutate { gsub => ["timezone", "DST", "+0100"] } }  
      else if [timezone] =~ ".*EDT.*" { mutate { gsub => ["timezone", "EDT", "-0400"] } }  
      else if [timezone] =~ ".*EST.*" { mutate { gsub => ["timezone", "EST", "-0500"] } }  
      else if [timezone] =~ ".*CST.*" { mutate { gsub => ["timezone", "CST", "-0600"] } }  
      else if [timezone] =~ ".*CDT.*" { mutate { gsub => ["timezone", "CDT", "-0500"] } }  
      else if [timezone] =~ ".*MST.*" { mutate { gsub => ["timezone", "MST", "-0700"] } }  
      else if [timezone] =~ ".*MDT.*" { mutate { gsub => ["timezone", "MDT", "-0600"] } }  
      else if [timezone] =~ ".*PST.*" { mutate { gsub => ["timezone", "PST", "-0800"] } }  
      else if [timezone] =~ ".*PDT.*" { mutate { gsub => ["timezone", "PDT", "-0700"] } }  
      else if [timezone] =~ ".*HST.*" { mutate { gsub => ["timezone", "HST", "-1000"] } } 
      mutate { 
        replace => { 
          "mydate" => "%{timestamp} %{timezone}" 
        } 
        on_error => "zerror.time00" 
      } 
    }
    else { 
      mutate {
        replace => {
          "mydate" => "%{timestamp}" 
        }
        on_error => "zerror.time00"
      }
    } 
    date {
      match => [ 
        "mydate", 
        "ISO8601",
        "UNIX",
        "UNIX_MS",
        "TAI64N",
        "MMM dd yyyy HH:mm:ss"
        "yyyy-MM-ddTHH:mm:ssZZ"
      ]
      rebase => true
      on_error => "zerror.time01"
    }
  }

  # principal UDM Field
  if [principal] != "" {
    grok {
      match => {
        "principal" => "%{IP:principal_test_ip}"
      }
      overwrite => ["principal_test_ip"]
      on_error => "principal_not_ip"
    }   
    if [principal_not_ip] {
      grok {
        match => {
          "principal" => [
            "%{DATA:principal}[.]%{DATA:principal_domain}\\z"
          ]
        }
        overwrite => ["principal", "principal_domain"]
        on_error => "zerror.principal"
      }
      mutate {
        replace => {
          "_principal.hostname" => "%{principal}"
        }
      }
    }
    else {
      mutate {
         merge => {
          "_principal.ip" => "principal"
        }
      }
    }
  }

  # target UDM Field
  if [target] != "" {
    grok {
      match => {
        "target" => "%{IP:target_test_ip}"
      }
      overwrite => ["target_test_ip"]
      on_error => "target_not_ip"
    }   
    if [target_not_ip] {
      grok {
        match => {
          "target" => [
            "%{DATA:target}[.]%{DATA:target_domain}\\z"
          ]
        }
        overwrite => ["target", "target_domain"]
        on_error => "zerror.target"
      }
      mutate {
        replace => {
          "_target.hostname" => "%{target}"
        }
      }
      if [target_domain] != "" {
        mutate {
          replace => {
            "_target.domain.name" => "%{target_domain}"
          }
        }
      }
    }
    else {
      mutate {
         merge => {
          "_target.ip" => "target"
        }
      }
    }
  }

  # target Host UDM Field
  if [target_host] != [target] and [target_host] != "" {
    grok {
      match => {
        "target_host" => "%{IP:target_host_test_ip}"
      }
      overwrite => ["target_host_test_ip"]
      on_error => "target_host_not_ip"
    }   
    if [target_host_not_ip] {
      # GROK target_host, target_domain
      grok {
        match => {
          "target_host" => [
            "^%{DATA:target_host}[.]%{DATA:target_domain}\\z$"
          ]
        }
        overwrite => ["target_host","target_domain"]
        on_error => "zerror.target_host"
      }
      mutate {
        replace => {
          "_target.hostname" => "%{target_host}"        
        }
      }
    }
    else {
      mutate {
         merge => {
          "_target.ip" => "target_host"
        }
      }
    }
  }

  # principal Host UDM Field
  if [principal_host] != [principal] and [principal_host] != "" {
    grok {
      match => {
        "principal_host" => "%{IP:principal_host_test_ip}"
      }
      overwrite => ["principal_host_test_ip"]
      on_error => "principal_host_not_ip"
    }   
    if [principal_host_not_ip] {
      # GROK principal_host, principal_domain
      grok {
        match => {
          "principal_host" => [
            "^%{DATA:principal_host}[.]%{DATA:principal_domain}\\z$"
          ]
        }
        overwrite => ["principal_host","principal_domain"]
        on_error => "zerror.principal_host"
      }
      mutate {
        replace => {
          "_principal.hostname" => "%{principal_host}"
        }
      }
    }
    else {
      mutate {
         merge => {
          "_principal.ip" => "principal_host"
        }
      }
    }
  }

  # Summary Field
  if [summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{summary}"
      }
    }
  }

  # principal.user UDM Field
  if [principal_user] != "" {
    if [principal_user] =~ "@" {
      # GROK principal_user, principal_domain
      grok {
        match => {
          "principal_user" => [
            "^%{DATA:principal_user}@%{DATA:principal_domain}$"
          ]
        }
        overwrite => ["principal_user", "principal_domain"]
        on_error => "zerror.principal_user"
      }
    }
    mutate {
      replace => {
        "_principal.user.userid" => "%{principal_user}"
      }
    }
  }

  # _target.user UDM Field
  if [target_user] != "" {
    if [target_user] =~ "@" {
      # GROK target_user, target_domain
      grok {
        match => {
          "target_user" => [
            "^%{DATA:target_user}@%{DATA:target_domain}$"
          ]
        }
        overwrite => ["target_user", "target_domain"]
        on_error => "zerror.target_user"
      }
    }
    mutate {
      replace => {
        "_target.user.userid" => "%{target_user}"
      }
    }
  }

  # _target.administrative_domain UDM Field
  if [target_domain] != "" {
    mutate {
      replace => {
        "_target.administrative_domain" => "%{target_domain}"
      }
    }
  }

  # principal.administrative_domain UDM Field
  if [principal_domain] != "" {
    mutate {
      replace => {
        "_principal.administrative_domain" => "%{principal_domain}"
      }
    }
  }

  # _target.url UDM Field
  if [target_url] != "" {
    mutate {
      replace => {
        "_target.url" => "%{target_url}"
      }
    }
  } 

  # Set security_result.action_details UDM Field
  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details"  => "%{action}"
      }
    }
  }

  # Set security_result.severity_details UDM Field
  if [severity] != "" {
    mutate {
      replace => {
        "security_result.severity_details"  => "%{severity}"
      }
    }
  }

  # Set Action
  if [action] != "" {
    if [action] =~ "block|Block|BLOCK" {
      mutate {
        replace => {
          "security_action" => "BLOCK"
        }
      }
    }
    else if [action] =~ "Success|success|SUCCESS" {
      mutate {
        replace => {
          "security_action" => "ALLOW"
        }
      }
    }
    else if [action] =~ "fail|Fail|FAIL" {
      mutate {
        replace => {
          "security_action" => "FAIL"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_action" => "UNKNOWN_ACTION"
        }
      }
    }
    if [security_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_action"
        }
      }
    }
  }

  # Set severity Level
  if [severity] in ["INFO", "Info", "info"] {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [severity] in ["Low", "low", "LOW" ] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] in ["WARN", "Warn" ] {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] in ["High", "high", "HIGH", "hazardous" ] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] in ["Critical", "critical", "CRITICAL" ] {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }

  # Observer Data
  if [observer] != "" {
    grok {
      match => {
        "observer" => "%{IP:test_ip}"
      }
      overwrite => ["test_ip"]
      on_error => "not_ip"
    }
    if [not_ip] {
      grok {
        match => {
          "observer" => [
            "%{DATA:observer}[.]%{DATA:observer_domain}\\z"
          ]
        }
        overwrite => ["observer", "observer_domain"]
        on_error => "zerror.observer"
      }
      mutate {
        replace => {
          "_observer.hostname" => "%{observer}"        
        }
      }
      if [observer_domain] != "" {
        mutate {
          replace => {
            "_observer.domain.name" => "%{observer_domain}"
          }
        }
      }
    }
    else {
      mutate {
         merge => {
          "_observer.ip" => "observer"
        }
      }
    }
  }

  # Set target Port UDM Field
  if [target_port] != "" {
    mutate {
      rename => {
        "target_port" => "_target.port"
      }
    }
    mutate {
      convert => {
        "_target.port" => "integer"
      }
    }
  }

  # Set principal Port UDM Field
  if [principal_port] != "" {
    mutate {
      rename => {
        "principal_port" => "_principal.port"
      }
    }
    mutate {
      convert => {
        "_principal.port" => "integer"
      }
    }
  }

  if [eventID] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{eventID}"
      }
      on_error => "zerror.eventID"
    }
  }

  # Default Event Data
  mutate {
    replace => {
      "metadata.vendor_name"  =>  "%{vendor}"
      "metadata.product_name"  =>  "%{product}"
      "metadata.product_version"  =>  "%{version}"
      "metadata.event_type"  =>  "%{event_type}"
      "metadata.description"  =>  "%{description}"
    }
  }
  if [product_event] != "" {
    mutate {
      replace => {
        "metadata.product_event_type"  =>  "%{product_event}"
      }
      on_error => "zerror.product_event"
    }
  }

  # Merge Security Results
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [has_user] == "true" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [product_event] =~ "(?i)login" {
    mutate {
      replace => {
        "metadata.event_type"  => "USER_LOGIN"
        "_extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type"  => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type"  => "GENERIC_EVENT"
      }
    }
  }


  # Change output to UDM event.
  mutate {
    rename => {
      "_principal" => "event.idm.read_only_udm.principal"
      "_target" => "event.idm.read_only_udm.target"
      "_observer" => "event.idm.read_only_udm.observer"
      "metadata" => "event.idm.read_only_udm.metadata"
      "_extensions" => "event.idm.read_only_udm.extensions"
      "additional" => "event.idm.read_only_udm.additional"
    }
  }

  # Generate Event
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
