# Product: Automation Anywhere
# Category: Automation Tools
# Supported Format: SYSLOG + KV, JSON
# Reference: https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/control-room/audit-log/cloud-audit-log.html
# Last Updated: 2026-01-09
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "has_user" => "false"
      "event_description" => ""
      "event_type" => ""
      "kv" => ""
      "host" => ""
      "datetime" => ""
      "user" => ""
      "filename" => ""
      "resource_name" => ""
      "action" => ""
      "product_event_type" => ""
      "product_object_id" => ""
      "description" => ""
      "not_ip" => ""
      "STATUS" => ""
      "audit_activityType" => ""
      "audit_hostName" => ""
      "audit_userName" => ""
      "audit_status" => ""
      "audit_objectName" => ""
      "audit_requestId" => ""
      "audit_createdOn" => ""
      "audit_detail_Device" => ""
      "audit_detail_Username" => ""
      "has_target" => "false"
      "has_principal" => "false"
      "sec_result" => ""
      "security_action" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  grok {
    match => {
      "message" => "%{INT} <%{INT}>%{INT} %{GREEDYDATA:datetime}Z %{HOSTNAME:host} %{GREEDYDATA} <%{INT}>%{INT} %{GREEDYDATA:datetime}Z %{HOSTNAME:host} %{GREEDYDATA} \\[%{GREEDYDATA:kv}\\[DETAIL=%{GREEDYDATA}\\]"
    }
    overwrite => ["datetime", "host", "kv"]
    on_error => "not_grok"
  }
  if [not_grok] {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
  }
  mutate {
    replace => {
      "event_description" => "%{audit.eventDescription}"
    }
    on_error => "not_replace_audit_eventDescription"
  }

  # Mapping kv
  if [kv] != "" {
    kv {
      source => "kv"
      trim_value => ""
      trim_key => " "
      value_split => "="
      field_split => ","
    }
    mutate {
      replace => {
        "user" => "%{ACTION TAKEN BY}"
        "action" => "%{ACTION TYPE}"
        "datetime" => "%{ACTIVITY AT}"
        "description" => "%{EVENT DESCRIPTION}"
        "filename" => "%{ITEM NAME}"
        "product_event_type" => "%{SOURCE}"
        "product_object_id" => "%{REQUEST ID}"
        "resource_name" => "%{SOURCE DEVICE}"
      }
    }
  }

  # Mapping user
  if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{user}"
      }
      on_error => "not_userid_target"
    }
  }

  # Mapping file
  if [filename] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{filename}"
      }
      on_error => "not_filename"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{host}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{host}"
      }
      on_error => "not_hostname_target"
    }
    if ![not_hostname_target] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  # Mapping of resource, some of elements contains IP address
  if [resource_name] != "" {
    mutate {
      replace => {
        "resource_name_temp" => "%{resource_name}"
      }
      on_error => "not_resource_name_replace"
    }
    grok {
      match => {
        "resource_name_temp" => "%{IP:resource_name}"
      }
      overwrite => ["resource_name"]
      on_error => "not_ip"
    }
    if [not_ip] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{resource_name}"
          "event.idm.read_only_udm.target.resource.resource_type" => "DEVICE"
        }
        on_error => "not_resource_name"
      }
    }
    else {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "resource_name"
          "event.idm.read_only_udm.target.asset.ip" => "resource_name"
        }
        on_error => "not_resource_name_ip"
      }
      if ![not_resource_name_ip] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [product_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "not_product_event_type"
    }
  }
  if [product_object_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.product_object_id" => "%{product_object_id}"
      }
      on_error => "not_product_object_id"
    }
  }
  for key,auditdetail in audit.detail {
    mutate {
      convert => {
        "key" => "string"
      }
      on_error => "not_convert_key"
    }
    mutate {
      replace => {
        "attribute_key" => ""
        "audit_detail_value" => ""
        "audit_detail_label" => ""
        "audit_detail_old_label" => ""
        "audit_detail_oldValue" => ""
      }
    }
    mutate {
      replace => {
        "attribute_key" => "%{auditdetail.attribute}"
      }
      on_error => "not_replace_attribute_key"
    }
    mutate {
      replace => {
        "audit_detail_value" => "%{auditdetail.newValue}"
      }
      on_error => "not_replace_audit_detail_value"
    }
    if [audit_detail_value] != "" {
      mutate {
        replace => {
          "audit_detail_label.key" => "%{attribute_key}"
          "audit_detail_label.value" => "%{audit_detail_value}"
        }
        on_error => "not_replace_audit_detail_label"
      }
      if ![not_replace_audit_detail_label] {
        mutate {
          merge => {
            "sec_result.detection_fields" => "audit_detail_label"
          }
          on_error => "not_merge_audit_detail_label"
        }
      }
    }
    mutate {
      replace => {
        "audit_detail_oldValue" => "%{auditdetail.oldValue}"
      }
      on_error => "not_replace_audit_detail_old_value"
    }
    if [audit_detail_oldValue] != "" {
      mutate {
        replace => {
          "audit_detail_old_label.key" => "auditdetailoldValue"
          "audit_detail_old_label.value" => "%{audit_detail_oldValue}"
        }
        on_error => "not_replace_audit_old_detail_label"
      }
      if ![not_replace_audit_old_detail_label] {
        mutate {
          merge => {
            "sec_result.detection_fields" => "audit_detail_old_label"
          }
          on_error => "not_merge_audit_detail_old_label"
        }
      }
    }
  }
  mutate {
    replace => {
      "audit_hostName" => "%{audit.hostName}"
    }
    on_error => "no_hostName"
  }
  mutate {
    replace => {
      "audit_userName" => "%{audit.userName}"
    }
    on_error => "no_userName"
  }
  mutate {
    replace => {
      "STATUS" => "%{audit.status}"
    }
    on_error => "no_status"
  }
  mutate {
    replace => {
      "audit_objectName" => "%{audit.objectName}"
    }
    on_error => "no_objectName"
  }
  mutate {
    replace => {
      "audit_requestId" => "%{audit.requestId}"
    }
    on_error => "no_requestId"
  }
  mutate {
    replace => {
      "audit_createdOn" => "%{audit.createdOn}"
    }
    on_error => "no_createdOn"
  }
  if [audit_hostName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{audit_hostName}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{audit_hostName}"
      }
      on_error => "hostName_empty"
    }
    if ![hostName_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [audit_userName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{audit_userName}"
      }
      on_error => "userName_empty_audit"
    }
    if ![userName_empty_audit] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }
  if [audit_objectName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{audit_objectName}"
      }
      on_error => "objectName_empty"
    }
  }
  if [audit_requestId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{audit_requestId}"
      }
      on_error => "requestId_empty"
    }
  }
  if [audit_createdOn] != "" {
    date {
      match => ["audit_createdOn", "yyyy-MM-ddTHH:mm:ssZ", "RFC3339", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "date_match_failed"
    }
  }
  mutate {
    replace => {
      "audit_activityType" => "%{audit.activityType}"
    }
    on_error => "not_replace_audit_activityType"
  }
  if [audit_activityType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{audit_activityType}"
      }
      on_error => "not_replace_audit_activityType_sec_result"
    }
  }
  mutate {
    rename => {
      "audit.source" => "addition.audit_source"
      "audit.auditType" => "addition.audit_type"
      "audit.createdBy" => "addition.audit_createdBy"
      "audit.externalSessionId" => "addition.audit_externalSessionId"
      "audit.externalReference.id" => "addition.audit_externalReference_id"
      "audit.externalReference.displayName" => "addition.audit_externalReference_displayName"
      "audit.externalReference.type" => "addition.audit_externalReference_type"
      "audit.id" => "addition.audit_id"
      "audit.eventDescription" => "addition.audit_eventDescription"
      "audit.environmentName" => "addition.audit_environmentName"
      "audit.modelInfo.modelName" => "addition.audit_modelInfo_modelName"
      "audit.modelInfo.version" => "addition.audit_modelInfo_version"
      "audit.modelInfo.revision" => "addition.audit_modelInfo_revision"
      "audit.modelInfo.provider" => "addition.audit_modelInfo_provider"
      "audit.modelInfo.deploymentId" => "addition.audit_modelInfo_deploymentId"
      "audit.modelInfo.region" => "addition.audit_modelInfo_region"
      "audit.modelInfo.displayName" => "addition.audit_modelInfo_displayName"
      "audit.modelInfo.isCustom" => "addition.audit_modelInfo_isCustom"
      "audit.modelInfo.modelType" => "addition.audit_modelInfo_modelType"
      "audit.modelInfo.modelConnectionType" => "addition.audit_modelInfo_modelConnectionType"
      "audit.modelInfo.customModelName" => "addition.audit_modelInfo_customModelName"
      "audit.modelInfo.groundedSourceId" => "addition.audit_modelInfo_groundedSourceId"
      "audit.modelInfo.modelConnectionName" => "addition.audit_modelInfo_modelConnectionName"
      "audit.encryptedPayload.type" => "addition.audit_encryptedPayload_type"
      "audit.encryptedPayload.attributes.promptTokens" => "addition.audit_encryptedPayload_attributes_promptTokens"
      "audit.encryptedPayload.attributes.totalTokens" => "addition.audit_encryptedPayload_attributes_totalTokens"
      "audit.encryptedPayload.attributes.completionTokens" => "addition.audit_encryptedPayload_attributes_completionTokens"
      "audit.encryptedPayload.payload" => "addition.audit_encryptedPayload_payload"
      "audit.encryptedPayload.iv" => "addition.audit_encryptedPayload_iv"
      "audit.executionContext.toolInfo" => "addition.audit_executionContext_toolInfo"
      "audit.executionContext.executionId" => "addition.audit_executionContext_executionId"
      "audit.executionContext.automationName" => "addition.audit_executionContext_automationName"
      "audit.executionContext.deviceId" => "addition.audit_executionContext_deviceId"
      "audit.executionContext.botId" => "addition.audit_executionContext_botId"
      "audit.executionContext.workspaceType" => "addition.audit_executionContext_workspaceType"
      "audit.executionContext.automationType" => "addition.audit_executionContext_automationType"
      "audit.executionContext.folderPath" => "addition.audit_executionContext_folderPath"
      "audit.executionContext.deviceName" => "addition.audit_executionContext_deviceName"
      "audit.executionContext.activityId" => "addition.audit_executionContext_activityId"
      "audit.executionContext.plannerId" => "addition.audit_executionContext_plannerId"
      "audit.executionContext.agentRequestId" => "addition.audit_executionContext_agentRequestId"
      "audit.aiGuardrail.id_" => "addition.audit_aiGuardrail_id_"
      "audit.aiGuardrail.name_" => "addition.audit_aiGuardrail_name_"
      "audit.aiGuardrail.toxicityScore_" => "addition.audit_aiGuardrail_toxicityScore_"
      "audit.aiGuardrail.toxicityLevel_" => "addition.audit_aiGuardrail_toxicityLevel_"
      "audit.aiGuardrail.action_" => "addition.audit_aiGuardrail_action_"
      "audit.aiEvaluation.id_" => "addition.audit_aiEvaluation_id_"
      "audit.aiEvaluation.name_" => "addition.audit_aiEvaluation_name_"
      "audit.aiEvaluation.method_" => "addition.audit_aiEvaluation_method_"
      "audit.aiEvaluation.status_" => "addition.audit_aiEvaluation_status_"
      "audit.aiEvaluation.type_" => "addition.audit_aiEvaluation_type_"
      "audit.aiEvaluation.sourceName_" => "addition.audit_aiEvaluation_sourceName_"
      "audit.aiEvaluation.routeUrl_" => "addition.audit_aiEvaluation_routeUrl_"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "key_replace_error"
      }
      if [value] not in ["UNKNOWN", ""] {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "value_replace_error"
        }
        if ![value_replace_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "_field"
            }
            on_error => "addition_merge_failed"
          }
        }
      }
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_user] == "true" and [event_description] =~ "User log in successfully"  {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_user] == "true" and [event_description] =~ "User log out successfully"  {
    mutate {
      replace => {
        "event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  # Mapping event types based on actions
  if [action] =~ "log in" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
         "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [action] =~ "Create Automation" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [action] =~ /^(Run|Download bot|Upload bot|Checkout|Undo checkout|Edit bot)/ {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [action] =~ "Send Email" {
    mutate {
      replace => {
        "event_type" => "EMAIL_TRANSACTION"
      }
    }
  }
  # end of event types
  # Mapping event type
  if [event_type] != "" {
    mutate {
      rename => {
        "event_type" => "event.idm.read_only_udm.metadata.event_type"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  # End of event type

  # Mapping security elements
  if [STATUS] == "Successful" {
    mutate {
      replace => {
        "security_action" => "ALLOW"
      }
    }
  }
  else if [STATUS] == "Unsuccessful" {
    mutate {
      replace => {
        "security_action" => "BLOCK"
      }
    }
  }
  else if [STATUS] == "Unknown" {
    mutate {
      replace => {
        "security_action" => "UNKNOWN_ACTION"
      }
    }
  }
  if [security_action] != "" {
    mutate {
      merge => {
        "sec_result.action" => "security_action"
      }
      on_error => "security_action_merge_failed"
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{action}"
      }
    }
  }
  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  # End of security

  # Common elements
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "AUTOMATION_ANYWHERE"
      "event.idm.read_only_udm.metadata.vendor_name" => "AUTOMATION_ANYWHERE"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
