        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }

      @include["okta_events.include"]

      if [principal_machine_id_present] == "true" and
      [event1][idm][read_only_udm][metadata][event_type] == "GENERIC_EVENT" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }

      mutate {
        replace => {
          "url_data" => "%{msg.debugContext.debugData.url}"
        }
        on_error => "url_data_not_found"
      }
      if ![url_data_not_found] {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.url" => "%{msg.debugContext.debugData.url}"
          }
          on_error => "url_not_found"
        }
      }
      else {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.url" => "%{msg.debugContext.debugData.requestUri}"
          }
          on_error => "url_not_found"
        }
      }

      mutate {
        replace => {
          "url_test" => "%{event1.idm.read_only_udm.target.url}"
        }
        on_error => "url_not_mapped"
      }

      if [url_not_mapped] {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.url" => "%{debugContext.debugData.requestUri}"
          }
          on_error => "url_not_found"
        }
      }

      mutate {
        replace => {
          "authentication_provider_label.key" => "authenticationProvider"
          "authentication_provider_label.value" => "%{msg.authenticationContext.authenticationProvider}"
        }
        on_error => "authentication_provider_not_found"
      }

      if ![authentication_provider_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "authentication_provider_label"
          }
          on_error => "authentication_provider_not_found"
        }
      }
      mutate {
        replace => {
          "credential_provider_label.key" => "credentialProvider"
          "credential_provider_label.value" => "%{msg.authenticationContext.credentialProvider}"
        }
        on_error => "credential_provider_not_found"
      }

      if ![credential_provider_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "credential_provider_label"
          }
          on_error => "credential_provider_not_found"
        }
      }

      mutate {
        convert => {
          "msg.authenticationContext.authenticationStep" => "string"
        }
        on_error => "aauthenticationStep_convert_failed"
      }

      mutate {
        replace => {
          "authenticationStep_label.key" => "authenticationStep"
          "authenticationStep_label.value" => "%{msg.authenticationContext.authenticationStep}"
        }
        on_error => "authentication_step_not_found"
      }
      if ![authentication_step_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "authenticationStep_label"
          }
          on_error => "authentication_step_not_found"
        }
      }

      mutate {
        replace => {
          "interface_label.key" => "interface"
          "interface_label.value" => "%{msg.authenticationContext.interface}"
        }
        on_error => "interface_not_found"
      }
      if ![interface_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "interface_label"
          }
          on_error => "interface_not_found"
        }
      }

      if [target_user_userid] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.user.userid" => "%{target_user_userid}"
          }
          on_error => "target_user_userid_not_found"
        }
      }

      if [security_result] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.security_result" => "security_result"
          }
          on_error => "security_result_not_found"
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.extensions.auth.type" => "SSO"
          "event1.idm.read_only_udm.metadata.product_name" => "Okta"
          "event1.idm.read_only_udm.metadata.vendor_name" => "Okta"
        }
      }

      mutate {
        merge => {
          "@output" => "event1"
        }
      }
    }
  }
  else {
    drop{
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
}
