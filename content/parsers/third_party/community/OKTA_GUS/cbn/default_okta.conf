# Product: Okta
# Category: Identity and Access Management
# Supported Format: JSON
# Reference: Refer Below
# Last Updated: 2026-07-22
# Copyright 2026 Google SecOps

# https://developer.okta.com/docs/reference/api/system-log/
# https://developer.okta.com/docs/api/openapi/okta-management/management/tag/UserResources/
# https://help.okta.com/wf/en-us/content/topics/workflows/connector-reference/okta/events/userprivilegegranted.htm
# https://developer.okta.com/docs/reference/api/event-types/

filter {
  mutate {
    replace => {
      "json_message" => ""
      "detail_json_message" => ""
      "json_array" => ""
      "json_message_detail" => ""
      "json_parse_failure_detail" => "true"
      "has_ud_device" => ""
    }
  }

  mutate {
    convert => {
      "json_parse_failure_detail" => "boolean"
    }
    on_error => "convert_message_to_string_error"
  }
  grok {
    "match" => {
       "message" => [
         "<%{POSINT}>%{INT}\\s+%{TIMESTAMP_ISO8601:time} %{GREEDYDATA} - - - %{GREEDYDATA:json_message}",
         '(?P<detail_json_message>^\{\\\"data.*)'
         "%{SYSLOGTIMESTAMP:time} %{HOSTNAME:hostname} %{GREEDYDATA:message}"
         'detail\\\":%{GREEDYDATA:json_message_detail}}'
        ]
    }
    on_error => "grok_error"
    overwrite => ["json_message","detail_json_message","message","json_message_detail"]
  }
  
  mutate {
    gsub => ["message","\\\"data\\\"","\"detail\""]
  }

  if [message] =~ "jsonPayload" {
    mutate {
      gsub => ["message",'jsonPayload\\\":','jsonPayload\":[']
    }
    mutate {
      gsub => ["message",',\\\"logName','],\"logName']
    }
    mutate {
      gsub => ["message","jsonPayload","json_array"]
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "json_parse_failure"
    }
  }
  else if [json_message] != "" {
    grok {
      match => {
        "json_message" => 'detail\\\":%{GREEDYDATA:message}}'
      }
      on_error => "grok_error"
      overwrite => ["message"]
    }
  }
  else if [detail_json_message] != "" {
    grok {
      match => {
        "detail_json_message" => 'data\\\":%{GREEDYDATA:message},\\\"device_name'
      }
      on_error => "grok_error"
      overwrite => ["message"]
    }
  }

  if [json_message_detail] != "" {
    json {
      source => "json_message_detail"
      array_function => "split_columns"
      on_error => "json_parse_failure_detail"
    }
  }

  # Pull fields out of raw log.
  mutate {
    gsub => ["message", "^\\[", "#"]
  }

  if [message] =~ "^#" {
    mutate {
      gsub => ["message", "^#", "["]
    }
    mutate {
      replace => {
        "message" => "{\"json_array\":%{message}}"
      }
      on_error => "json_parse_failure"
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "json_parse_failure"
    }
    if [json_parse_failure] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
  }
  else if [message] =~ "^\{" {
    mutate {
      replace => {
        "message" => "{\"json_array\":[%{message}]}"
      }
      on_error => "json_parse_failure"
    }
    if [json_message_detail] != "" and ![json_parse_failure_detail]  {
      mutate {
        replace => {
          "message" => "{\"json_array\":[%{json_message_detail}]}"
        }
        on_error => "json_parse_failure"
      }
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "json_parse_failure"
    }
    if [json_parse_failure] {
      mutate {
          gsub => ["message",'\\"\\[{' , "[{"]
        }
        mutate {
          gsub => ["message",'\\}]\\"' , "}]"]
        }
        mutate {
          gsub => ["message",':\\\"{\\\"' , ':{\"']
        }
        mutate {
          gsub => ["message",'}}\\\"}','}}}']
        }
        mutate {
          gsub => ["message",'}\\\",\\\"client.geographicalContext.country\\\"' , '},\"client.geographicalContext.country\"']
        }
        mutate {
          gsub => ["message",'}\\\",\\\"client.geographicalContext.state\\\"', '},\"client.geographicalContext.state\"']
        }
        mutate {
          gsub => ["message",',\\r\\n', '']
        }
        mutate {
          gsub => ["message",'\\\\p','']
        }
        mutate {
          gsub => ["message",'\\r\\n','']
        }
        json {
          source => "message"
          array_function => "split_columns"
          on_error => "json_parse_failure"
        }
        if [json_parse_failure] {
          drop {
            tag => "TAG_MALFORMED_ENCODING"
          }
        }
    }
  }

  if [json_array] != "" {
    for msg in json_array {
      # common variables
      mutate {
        replace => {
          "security_result" => ""
          "event1" => ""
          "actor.alternateId" => ""
          "actor.id" => ""
          "user_id" => ""
          "user_email" => ""
          "raw_user_agent" => ""
          "ip_client" => ""
          "postal_code_label" => ""
          "browser_label" => ""
          "outcome_result" => ""
          "outcome_result1" => ""
          "published" => ""
          "domain_value" => ""
          "severity" => ""
          "severity1" => ""
          "severity_debug" => ""
          "debugContext.debugData.requestUri" => ""
          "eventType" => ""
          "transaction.type" => ""
          "threatSuspected_value" => ""
          "credentialType" => ""
          "debugContext.debugData.url" => ""
          "isProxy_label" => ""
          "securityContext_isProxy_label" => ""
          "asOrg_label" => ""
          "asNumber_label" => ""
          "isp_label" => ""
          "authentication_provider_label" => ""
          "credential_provider_label" => ""
          "additional_device_label" => ""
          "additional_zone_label" => ""
          "additional_type_label" => ""
          "target_user_userid" => ""
          "target_user_name" => ""
          "username" => ""
          "domain" => ""
          "outcome_reason" => ""
          "dthash_label" => ""
          "push_only_response_type_label" => ""
          "push_with_number_response_type_label" => ""
          "factor_label" => ""
          "factor_intent_label" => ""
          "raw_user_agent_label" => ""
          "tunData" => ""
          "auth_type" => "MECHANISM_UNSPECIFIED"
          "legacyEventType" => ""
          "has_user" => "false"
          "principal_machine_id_present" => "false"
          "target_is_set" => "false"
          "orn_label" => ""
          "label_label" => ""
          "status_label" => ""
          "visibility_autoSubmitToolbar_label" => ""
          "visibility_hide_iOS_label" => ""
          "visibility_hide_web_label" => ""
          "visibility_appLinks_oidc_client_link_label" => ""
          "signOnMode_label" => ""
          "manualProvisioning_label" => ""
          "implicitAssignment_label" => ""
          "kid_label" => ""
          "authenticationStep_label" => ""
          "interface_label" => ""
          "has_ud_device" => ""
        }
      }

      date {
        match => ["msg.lastUpdated","ISO8601","yyyy-MM-ddTHH:mm:ss"]
        target => "event1.idm.read_only_udm.target.resource.attribute.last_update_time"
        on_error => "last_updated_time_not_found"
      }

      date {
        match => ["msg.debugContext.debugData.authenticatorMethodChallengeTime", "yyyy-mm-ddThh:mm:ss.SSSSSSZ", "RFC3339", "ISO8601"]
        target => "event1.idm.read_only_udm.metadata.collected_timestamp"
        on_error => "authenticatorMethodChallengeTime_invalid"
      }

      date {
        match => ["msg.created","ISO8601","yyyy-MM-ddTHH:mm:ss"]
        on_error => "created_time_not_found"
      }

      mutate {
        replace => {
          "actor.id" => "%{msg.actor.id}"
        }
        on_error => "actor_id_not_found"
      }

      if ![actor_id_not_found] {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.product_object_id" => "%{actor.id}"
          }
          on_error => "actor_id_not_found"
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.product_version" => "%{msg.version}"
        }
        on_error => "version_not_set"
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.user.userid" => "%{msg.id}"
        }
        on_error => "id_not_found"
      }

      if ![id_not_found] {
        mutate {
          replace => {
            "has_user" => "true"
          }
          on_error => "id_not_found"
        }
      }

      mutate {
        replace => {
          "roles.name" => "%{msg.actor.type}"
        }
        on_error => "actor_type_not_found"
      }
      if ![actor_type_not_found] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.user.attribute.roles" => "roles"
          }
          on_error => "roles_not_found"
        }
      }

      mutate {
        replace => {
          "actor.alternateId" => "%{msg.actor.alternateId}"
        }
        on_error => "actor_alternateId_not_found"
      }

      grok {
        match => {
          "actor.alternateId" => "%{DATA:username}@%{HOSTNAME:domain}"
        }
        on_error =>  "not_email"
        overwrite => ["username", "domain"]
      }

      if [not_email] {
        mutate {
          replace => {
            "actor_id" => "%{actor.id}"
          }
          on_error => "actor_id_not_found"
        }
        if [actor][alternateId] != "" {
          mutate {
            replace => {
              "user_id" => "%{actor.alternateId}"
            }
            on_error => "actor_alternateId_not_found"
          }
        }
        else if ![actor_id_not_found] and [actor][id] != "" {
          mutate {
            replace => {
              "user_id" => "%{actor.id}"
            }
            on_error => "actor_id_not_found"
          }
        }
      }
      else if [username] != "" or [domain] != "" {
        mutate {
          replace => {
            "user_id" => "%{username}"
            "user_email" => "%{username}@%{domain}"
          }
          on_error => "user_id_not_found"
        }
      }

      if [user_id] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.userid" => "%{user_id}"
            "has_user" => "true"
          }
          on_error => "user_id_not_found"
        }
      }

      if [user_email] =~ "^.+@.+$" {
        mutate {
          replace => {
            "eventType" => "%{msg.eventType}"
          }
          on_error => "eventType_not_found"
        }
        if [eventType] in ["system.email.delivery" , "system.email.account_unlock.sent_message"] {
          mutate {
            replace => {
              "event1.idm.read_only_udm.network.email.from" => "%{user_email}"
            }
            on_error => "user_email_not_found"
          }
        }
        else {
          mutate {
            merge => {
              "event1.idm.read_only_udm.principal.user.email_addresses" => "user_email"
            }
            on_error => "user_email_merge_failed"
          }
          if ![user_email_merge_failed] {
            mutate {
              replace => {
                "has_user" => "true"
              }
            }
          }
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.user.user_display_name" => "%{msg.actor.displayName}"
        }
        on_error => "actor_displayName_not_found"
      }
      mutate {
        replace => {
          "actor_displayName_label.key" => "actor_displayName"
          "actor_displayName_label.value" => "%{msg.actor.displayName}"
        }
        on_error => "actor_displayName_not_found"
      }
      if ![actor_displayName_not_found] {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.user.user_display_name" => "%{msg.actor.displayName}"
          }
          on_error => "actor_displayName_not_found"
        }

        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.resource.attribute.labels" => "actor_displayName_label"
          }
          on_error => "actor_displayName_label_not_found"
        }
      }

      mutate {
        replace => {
          "orn_label.key" => "orn"
          "orn_label.value" => "%{msg.orn}"
        }
        on_error => "orn_not_found"
      }
      if ![orn_not_found] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.resource.attribute.labels" => "orn_label"
          }
          on_error => "orn_label_not_found"
        }
      }

      mutate {
        replace => {
          "label_label.key" => "label"
          "label_label.value" => "%{msg.label}"
        }
        on_error => "label_not_found"
      }
      if ![label_not_found] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.resource.attribute.labels" => "label_label"
          }
          on_error => "label_label_not_found"
        }
      }

      mutate {
        replace => {
          "type_label.key" => "type"
          "type_label.value" => "%{msg.actor.type}"
        }
        on_error => "no_type_label"
      }
      if ![no_type_label] {
        mutate {
          merge => {
            "security_result.detection_fields" => "type_label"
          }
          on_error => "type_label_merge_failed"
        }
      }

      mutate {
        replace => {
          "status_label.key" => "status"
          "status_label.value" => "%{msg.status}"
        }
        on_error => "status_not_found"
      }
      if ![status_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "status_label"
          }
          on_error => "status_label_not_found"
        }
      }

      mutate {
        convert => {
          "msg.visibility.autoSubmitToolbar" => "string"
        }
        on_error => "visibility_autoSubmitToolbar_conversion_error"
      }
      mutate {
        replace => {
          "visibility_autoSubmitToolbar_label.key" => "visibility_autoSubmitToolbar"
          "visibility_autoSubmitToolbar_label.value" => "%{msg.visibility.autoSubmitToolbar}"
        }
        on_error => "visibility_autoSubmitToolbar_not_found"
      }
      if ![visibility_autoSubmitToolbar_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "visibility_autoSubmitToolbar_label"
          }
          on_error => "visibility_autoSubmitToolbar_label_not_found"
        }
      }

      mutate {
        convert => {
          "msg.visibility.hide.iOS" => "string"
        }
        on_error => "visibility_hide_iOS_conversion_error"
      }
      mutate {
        replace => {
          "visibility_hide_iOS_label.key" => "visibility_hide_iOS"
          "visibility_hide_iOS_label.value" => "%{msg.visibility.hide.iOS}"
        }
        on_error => "visibility_hide_iOS_not_found"
      }
      if ![visibility_hide_iOS_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "visibility_hide_iOS_label"
          }
          on_error => "visibility_hide_iOS_label_not_found"
        }
      }

      mutate {
        convert => {
          "msg.visibility.hide.web" => "string"
        }
        on_error => "visibility_hide_web_conversion_error"
      }
      mutate {
        replace => {
          "visibility_hide_web_label.key" => "visibility_hide_web"
          "visibility_hide_web_label.value" => "%{msg.visibility.hide.web}"
        }
        on_error => "visibility_hide_web_not_found"
      }
      if ![visibility_hide_web_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "visibility_hide_web_label"
          }
          on_error => "visibility_hide_web_label_not_found"
        }
      }

      mutate {
        convert => {
          "msg.visibility.appLinks.oidc_client_link" => "string"
        }
        on_error => "visibility_appLinks_oidc_client_link_conversion_error"
      }
      mutate {
        replace => {
          "visibility_appLinks_oidc_client_link_label.key" => "visibility_appLinks_oidc_client_link"
          "visibility_appLinks_oidc_client_link_label.value" => "%{msg.visibility.appLinks.oidc_client_link}"
        }
        on_error => "visibility_appLinks_oidc_client_link_not_found"
      }
      if ![visibility_appLinks_oidc_client_link_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" =>
            "visibility_appLinks_oidc_client_link_label"
          }
          on_error => "visibility_appLinks_oidc_client_link_label_not_found"
        }
      }

      mutate {
        replace => {
          "signOnMode_label.key" => "signOnMode"
          "signOnMode_label.value" => "%{msg.signOnMode}"
        }
        on_error => "signOnMode_not_found"
      }
      if ![signOnMode_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "signOnMode_label"
          }
          on_error => "signOnMode_label_not_found"
        }
      }

      for key, value in msg.settings.notifications.vpn.network map {
        mutate {
          replace => {
            "vpn_network_label" => ""
          }
        }
        mutate {
          convert => {
            "value" => "string"
          }
          on_error => "vpn_network_value_conversion_error"
        }
        mutate {
          replace => {
            "vpn_network_label.key" => "%{key}"
            "vpn_network_label.value" => "%{value}"
          }
          on_error => "vpn_network_not_found"
        }
        if ![vpn_network_not_found] {
          mutate {
            merge => {
              "security_result.detection_fields" => "vpn_network_label"
            }
            on_error => "vpn_network_label_not_found"
          }
        }
      }

      mutate {
        convert => {
          "msg.settings.manualProvisioning" => "string"
        }
        on_error => "manualProvisioning_conversion_error"
      }
      mutate {
        replace => {
          "manualProvisioning_label.key" => "manualProvisioning"
          "manualProvisioning_label.value" =>
          "%{msg.settings.manualProvisioning}"
        }
        on_error => "manualProvisioning_not_found"
      }
      if ![manualProvisioning_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "manualProvisioning_label"
          }
          on_error => "manualProvisioning_label_not_found"
        }
      }

      mutate {
        convert => {
          "msg.settings.implicitAssignment" => "string"
        }
        on_error => "implicitAssignment_conversion_error"
      }
      mutate {
        replace => {
          "implicitAssignment_label.key" => "implicitAssignment"
          "implicitAssignment_label.value" => "%{msg.settings.implicitAssignment}"
        }
        on_error => "implicitAssignment_not_found"
      }
      if ![implicitAssignment_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "implicitAssignment_label"
          }
          on_error => "implicitAssignment_label_not_found"
        }
      }

      # Maps client.userAgent.rawUserAgent if it exists and it is not empty.
      if [message] =~ ".*client.*userAgent.*os" {
        mutate {
          replace => {
            "platform" => ""
          }
        }
        mutate {
          replace => {
            "platform" => "%{msg.client.userAgent.os}"
          }
          on_error => "no_field_found"
        }
        @include["platform.include"]
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.platform" => "%{noun_platform}"
          }
          on_error => "no_platform"
        }
      }

      mutate {
        gsub => ["msg.client.userAgent.rawUserAgent", "^\\'\\\"$", ""]
      }

      mutate {
        replace => {
          "raw_user_agent" => "%{msg.client.userAgent.rawUserAgent}"
        }
        on_error => "null_raw_user_agent"
      }

      if [raw_user_agent] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.network.http.user_agent" => "%{raw_user_agent}"
          }
          on_error => "null_raw_user_agent"
        }

        mutate {
          convert => {
            "raw_user_agent" => "parseduseragent"
          }
          on_error => "null_raw_user_agent"
        }
        mutate {
          rename => {
            "raw_user_agent" => "event1.idm.read_only_udm.network.http.parsed_user_agent"
          }
        }
      }

      mutate {
        replace => {
          "browser_label.value" => "%{msg.client.userAgent.browser}"
        }
        on_error => "null_browser"
      }

      if ![null_browser] {
        mutate {
          replace => {
            "browser_label.key" => "Browser"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.resource.attribute.labels" => "browser_label"
          }
          on_error => "null_browser"
        }
      }

      if [message] =~ ".*client.*device" {
        mutate {
          replace => {
            "asset_type" => ""
          }
        }
        mutate {
          replace => {
            "asset_type" => "%{msg.client.device}"
          }
          on_error => "no_device"
        }
        @include["asset_type.include"]
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.asset.type" => "%{asset.type}"
          }
          on_error => "no_asset_type"
        }
      }

      mutate {
        replace => {
          "ip_client" => "%{msg.client.ipAddress}"
        }
        on_error => "no_client_ipAddress"
      }

      if ![no_client_ipAddress] and [ip_client] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
        mutate {
          merge => {
             "event1.idm.read_only_udm.principal.ip" => "ip_client"
             "event1.idm.read_only_udm.principal.asset.ip" => "ip_client"
          }
          on_error => "ip_client_value_invalid"
        }
        if ![ip_client_value_invalid] {
          mutate {
            replace => {
              "principal_machine_id_present" => "true"
            }
          }
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.location.city" => "%{msg.client.geographicalContext.city}"
        }
        on_error => "geographicalContext_city_not_found"
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.location.state" => "%{msg.client.geographicalContext.state}"
        }
        on_error => "geographicalContext_state_not_found"
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.location.country_or_region" => "%{msg.client.geographicalContext.country}"
        }
        on_error => "geographicalContext_country_not_found"
      }

      mutate {
        rename => {
          "msg.client.geographicalContext.geolocation.lat" => "event1.idm.read_only_udm.principal.location.region_coordinates.latitude"
          "msg.client.geographicalContext.geolocation.lon" => "event1.idm.read_only_udm.principal.location.region_coordinates.longitude"
