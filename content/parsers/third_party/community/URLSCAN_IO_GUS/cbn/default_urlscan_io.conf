# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "_securityresult" => ""
      "_principal" => ""
      "_target" => ""
      "_network" => ""
      "_additional" => ""
      "verdicts" => ""
      "verdicts.score" => ""
      "verdicts.hasVerdicts" => ""
      "task.time" => ""
      "task.uuid" => ""
      "task.url" => ""
      "task.visibility" => ""
      "stats.uniqIPs" => ""
      "stats.uniqCountries" => ""
      "stats.dataLength" => ""
      "stats.encodedDataLength" => ""
      "stats.requests" => ""
      "page.ip" => ""
      "page.status" => ""
      "page.mimeType" => ""
      "page.title" => ""
      "page.url" => ""
      "page.domain" => ""
      "page.asn" => ""
      "page.asnname" => ""
      "page.tlsIssuer" => ""
      "page.redirected" => ""
      "page.tlsValidDays" => ""
      "page.tlsAgeDays" => ""
      "page.tlsValidFrom" => ""
      "page.apexDomain" => ""
      "page.country" => ""
      "page.server" => ""
      "result" => ""
      "screenshot" => ""
      "signature" => ""
      "text.size" => ""
      "text.hash" => ""
      "dom.hash" => ""
      "dom.size" => ""
      "submitter.country" => ""
      "links.length" => ""
      "frames.length" => ""
      "labels" => ""
      "has_principal" => "false"
      "has_target" => "false"
    }
  }

  #Use JSON extraction Filter to parse json logs and drop any log that's not json
  json {
    source => "message"
    on_error => "_not_json"
    array_function => "split_columns"
  }

  if [_not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  #Parse different nested array fields
  #1 page array as its has most of the relevant fields

  if [page][ip] != "" {
      mutate {
        merge => {
          "_target.ip" => "page.ip"
        }
        on_error => "page_ip_not_present"
      }
      if ![page_ip_not_present] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }

  if [page][title] != "" {
    mutate {
      gsub => ["page.title", "##", ""]
    }
    mutate {
      gsub => ["page.title", "\\n", ""]
    }
    mutate {
      gsub => ["page.title", "\\t", ""]
    }
    mutate {
      replace => {
        "_target.url_metadata.title" => "%{page.title}"
      }
      on_error => "_[page][title]_not present"
    }
  }
  if [page][url] != "" {
    mutate {
      replace => {
          "_target.url" => "%{page.url}"
      }
      on_error => "_[page][url]_not present"
    }
  }
  if [page][domain] != "" {
    mutate {
      replace => {
        "_target.hostname" => "%{page.domain}"
        "has_target" => "true"
      }
      on_error => "_[page][domain]_not present"
    }
  }
  if [page][asn] != "" {
    mutate {
      replace => {
        "_network.asn" => "%{page.asn}"
      }
      on_error => "_[page][asn]_not present"
    }
  }
  if [page][tlsIssuer] != "" {
    mutate {
      replace => {
        "_network.tls.server.certificate.issuer" => "%{page.tlsIssuer}"
      }
      on_error => "_[page][tlsIssuer]_not present"
    }
  }
  if [page][tlsValidDays] != "" {
    mutate{
      convert => {
        "page.tlsValidDays" => "string"
      }
      on_error => "_tlsValidDays_already_string"
    }
    mutate {
      replace => {
        "tlsValidDays_label.key" => "tlsValidDays"
        "tlsValidDays_label.value.string_value" => "%{page.tlsValidDays}"
      }
      on_error => "_tlsValidDays_not_found"
    }
    if ![_tlsValidDays_not_found] {
      mutate {
        merge => {
          "_additional.fields" => "tlsValidDays_label"
        }
        on_error => "_tlsValidDays_not_present"
      }
    }
  }
 if [page][tlsAgeDays] != "" {
    mutate {
      convert => {
        "page.tlsAgeDays" => "string"
      }
      on_error => "_tlsAgeDays_already_string"
    }
    mutate {
