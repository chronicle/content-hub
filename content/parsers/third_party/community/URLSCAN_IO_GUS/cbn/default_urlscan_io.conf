  #3 Task array

  if [task][domain] != "" {
    mutate {
      replace => {
        "_principal.hostname" => "%{task.domain}"
        "has_principal" => "true"
      }
      on_error => "_[task][domain]_not_present"
    }
  }
  if [task][url] != "" {
    mutate {
      replace => {
        "_principal.url" => "%{task.url}"
        "_securityresult.about.url" => "%{task.url}"
