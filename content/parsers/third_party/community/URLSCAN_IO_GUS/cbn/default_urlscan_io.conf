  if [labels] != "" {
    for _label in labels {
      mutate {
        convert => {
          "_label" => "string"
        }
        on_error => "_already_string"
      }
      mutate {
        replace => {
          "detection_labels_label.key" => "detection_Labels"
          "detection_labels_label.value" => "%{_label}"
        }
        on_error => "_Labels_not_found"
      }
      if ![_Labels_not_found] {
        mutate {
          merge => {
            "_securityresult.detection_fields" => "detection_labels_label"
          }
          on_error => "_Labels_not_present"
