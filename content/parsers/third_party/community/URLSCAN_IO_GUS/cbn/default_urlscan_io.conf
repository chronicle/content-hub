  }
  if [verdicts][malicious] != "" {
  mutate {
    convert => {
      "verdicts.malicious" => "string"
    }
    on_error => "_[verdicts][malicious]_conversion_failed"
  }
  mutate {
    replace => {
      "_securityresult.verdict.verdict.source_provider" => "URLScanIO"
    }
  }
  if [verdicts][malicious] == "false" {
    mutate {
      replace => {
      "_securityresult.description" => "Not_Malicious"
      "_verdict_info.verdict_response" => "BENIGN"
      }
    }
  }
  if [verdicts][malicious] == "true" {
    mutate {
      replace => {
      "_securityresult.description" => "Malicious"
      "_verdict_info.verdict_response" => "MALICIOUS"
      }
    }
  }

  }

