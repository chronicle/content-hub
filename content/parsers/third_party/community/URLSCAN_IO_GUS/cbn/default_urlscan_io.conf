  mutate {
    merge => {
      "_securityresult.verdict_info" => "_verdict_info"
    }
    on_error => "_no_verdict_info"
  }

  if [_securityresult] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" = "_securityresult"
      }
      on_error => "_no_about"
    }
  }

  if [_target] != "" {
    mutate {
      rename => {
        "_target" => "event.idm.read_only_udm.target"
      }
      on_error => "_no_target"
    }
  }

  if [_principal] != "" {
    mutate {
      rename => {
        "_principal" => "event.idm.read_only_udm.principal"
      }
      on_error => "_no_principal"
    }
  }
  if [_network] != "" {
    mutate {
      rename => {
        "_network" => "event.idm.read_only_udm.network"
      }
      on_error => "_no_network"
    }
  }
  if [_additional] != "" {
    mutate {
      rename => {
        "_additional" => "event.idm.read_only_udm.additional"
      }
      on_error => "_no_additional"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "URLSCAN.IO"
      "event.idm.read_only_udm.metadata.vendor_name" => "URLSCAN.IO"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
      "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
