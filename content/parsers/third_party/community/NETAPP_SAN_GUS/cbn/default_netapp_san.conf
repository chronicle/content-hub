# Product: NETAPP_SAN
# Category: Rest api
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2023-04-25
# Copyright 2023 Chronicle LLC

filter {

  mutate {
    replace => {
      "datetime" => ""
      "ip" => ""
      "port" => ""
      "userid" => ""
      "request" => ""
      "log_level" => ""
      "desc" => ""
      "sr" => ""
    }
  }

  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:datetime} .* %{IP:ip}:%{INT:port} :: %{DATA}:%{WORD:userid} :: %{DATA:request} :: %{WORD:log_level}:%{GREEDYDATA:desc}"
    }
    overwrite => ["datetime", "ip", "port", "userid", "request", "log_level", "desc"]
    on_error => "grok_not_match"
  }

  if [grok_not_match] {
    drop {
      tag => "TAG_NO_SECURITY_VALUE"
    }
  }

  date {
    match => ["datetime", "MMM d HH:mm:ss","MMM  d HH:mm:ss"]
    rebase => true
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Storage Area Network"
      "event.idm.read_only_udm.metadata.vendor_name" => "NetApp"
      "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
    }
  }

  if [desc] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{desc}"
      }
    }
  }

  if [ip] != ""  {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip"
      }
    }
  }

  if [port] != ""  {
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{port}"
      }
    }
  }

  if [userid] != ""  {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{userid}"
      }
    }
  }

  if [request] != "" {
    mutate {
      replace => {
        "sr.summary" => "%{request}"
      }
    }
  }

  if [log_level] == "Error" {
    mutate {
      replace => {
        "sr.severity" => "ERROR"
      }
    }
  }

  if [sr] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}