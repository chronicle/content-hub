# Product: ABNORMAL_SECURITY
# Category: Email Server
# Supported Format: JSON , SYSLOG
# Reference: https://help.logichub.com/docs/abnormal-security
# Last Updated: 2026-03-25
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "priority_code" => ""
      "messages" => ""
      "msg" => ""
      "data" => ""
      "event_data.abx_message_id" => ""
      "event_data.abx_portal_url" => ""
      "event_data.threat_id" => ""
      "event_data.subject" => ""
      "event_data.from_address" => ""
      "event_data.from_name" => ""
      "event_data.to_addresses" => ""
      "event_data.recipient_address" => ""
      "event_data.received_time" => ""
      "event_data.sent_time" => ""
      "event_data.internet_message_id" => ""
      "event_data.auto_remediated" => ""
      "event_data.remediation_status" => ""
      "event_data.attack_type" => ""
      "event_data.attack_strategy" => ""
      "event_data.return_path" => ""
      "event_data.reply_to_emails" => ""
      "event_data.cc_emails" => ""
      "event_data.sender_ip_address" => ""
      "event_data.impersonated_party" => ""
      "event_data.post_remediated" => ""
      "event_data.attack_vector" => ""
      "event_data.attachment_names" => ""
      "event_data.urls" => ""
      "event_data.summary_insights" => ""
      "event_data.remediation_timestamp" => ""
      "event_data.is_read" => ""
      "event_data.attacked_party" => ""
      "event_data.sender_domain" => ""
      "event_data.abx_body.attack_type" => ""
      "event_data_abx_body_sender_auth_results_spf" => ""
      "event_data_abx_body_sender_auth_results_dkim" => ""
      "event_data_abx_body_sender_auth_results_dmarc" => ""
      "event_data.abx_body.abx_message_id" => ""
      "event_data.abx_body.abx_message_id_str" => ""
      "event_data.abx_body.abx_portal_url" => ""
      "event_data.abx_body.threat_id" => ""
      "event_data.abx_body.from_address" => ""
      "event_data.abx_body.from_name" => ""
      "event_data.abx_body.to_addresses" => ""
      "event_data.abx_body.received_time" => ""
      "event_data.abx_body.sent_time" => ""
      "event_data.abx_body.auto_remediated" => ""
      "event_data.abx_body.post_remediated" => ""
      "event_data.abx_body.remediation_status" => ""
      "event_data.abx_body.attack_strategy" => ""
      "event_data.abx_body.return_path" => ""
      "event_data.abx_body.reply_to_emails" => ""
      "event_data.abx_body.cc_emails" => ""
      "event_data.abx_body.sender_ip_address" => ""
      "event_data.abx_body.impersonated_party" => ""
      "event_data.abx_body.attack_vector" => ""
      "event_data.abx_body.attachment_names" => ""
      "event_data.abx_body.urls" => ""
      "event_data.abx_body.summary_insights" => ""
      "event_data.abx_body.remediation_timestamp" => ""
      "event_data.abx_body.is_read" => ""
      "event_data.abx_body.attacked_party" => ""
      "event_data.abx_body.sender_domain" => ""
      "event_data.abx_body.attachment_count" => ""
      "event_data.abx_body.url_count" => ""
      "event_data.abx_body.message_sources" => ""
      "event_data.abx_body.folder_locations" => ""
      "event_data.abx_body.attack_score" => ""
      "event_data.abx_body.sender_auth_results" => ""
      "event_data.abx_body.tenant" => ""
      "event_data.abx_body.source" => ""
      "event_data.abx_body.message_engagement.forwarded_count" => ""
      "event_data_abx_body_message_engagement_forwarded_count" => ""
      "event_data_abx_body_message_engagement_replied_count" => ""
      "event_data.attachment_count" => ""
      "event_data.url_count" => ""
      "event_data.message_sources" => ""
      "event_data.folder_locations" => ""
      "event_data.attack_score" => ""
      "event_data.tenant" => ""
      "event_data.abx_metadata.event_type" => ""
      "event_data.abx_metadata.timestamp" => ""
      "event_data.abx_metadata.trace_id" => ""
      "event_data.abx_body.campaign_id" => ""
      "event_data.abx_body.not_analyzed" => ""
      "event_data.abx_body.abnormal_message_id" => ""
      "event_data.abx_body.subject" => ""
      "event_data.abx_body.reported" => ""
      "event_data.abx_body.message_reported_time" => ""
      "event_data.abx_body.reporter_name" => ""
      "event_data.abx_body.reporter_address" => ""
      "event_data.abx_body.judgement" => ""
      "event_data.abx_body.recipient_name" => ""
      "event_data.abx_body.recipient_address" => ""
      "event_data.abx_body.internet_message_id" => ""
      "event_data.abx_body.email_label_or_location" => ""
      "event_data.abx_body.details.request_url" => ""
      "event_data.abx_body.details.sender" => ""
      "event_data.abx_body.details.recipient" => ""
      "event_data.abx_body.source_ip" => ""
      "event_data.abx_body.status" => ""
      "event_data.abx_body.tenant_name" => ""
      "event_data.abx_body.user.email" => ""
      "event_data.abx_body.category" => ""
      "event_data.abx_body.details.subject" => ""
      "event_data.abx_body.severity" => ""
      "event_data.abx_body.trigger_event" => ""
      "event_data.abx_body.case_id" => ""
      "event_data.abx_body.entity.entity_type" => ""
      "event_data.abx_body.entity.identifier" => ""
      "event_data.abx_body.description" => ""
      "event_data.sender_auth_results.spf" => ""
      "event_data.sender_auth_results.dkim" => ""
      "event_data.sender_auth_results.dmarc" => ""
      "sourcetype" => ""
      "abx_message_id_temp" => ""
      "event_data_abx_body_not_analyzed" => ""
      "event_data_abx_body_email_label_or_location" => ""
    }
  }

  mutate {
    gsub => ['message','\\\"event\\\"','\"event_data\"']
  }


  grok {
    match => {
      message => ["\\\"event_data\\\":(\\s+)?\\{(\\s+)?\\\"abx_message_id\\\":(\\s+)?%{DATA:abx_message_id_temp},"
                  "\\\"event_data\\\":.*\\\"abnormal_message_id\\\":(\\s+)?%{DATA:abx_message_id_temp},"
      ]
    }
    overwrite => ["abx_message_id_temp"]
    on_error => "no_abx_message_id_temp"
  }
  json {
    source => "message"
    on_error => "not_json"
    array_function => "split_columns"
  }

  if [not_json] {
    grok {
      match => {
        "message" => [
          "<%{INT:priority_code}> %{GREEDYDATA:data}\\\x00",
          "<%{INT:priority_code}> %{GREEDYDATA:data}�"
          "<%{INT:priority_code}> %{GREEDYDATA:data}"
        ]
      }
      overwrite => ["data","priority_code"]
      on_error => "no_grok"
    }

    if [no_grok] {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }

    json {
      source => "data"
      on_error => "not_json_grok"
      array_function => "split_columns"
    }

    if [not_json_grok] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  if [messages] != "" {
    for msg in messages {
      mutate {
        replace => {
          "event" => ""
          "principal" => ""
          "metadata" => ""
          "security_result" => ""
          "network" => ""
          "additional" => ""
          "summary" => ""
          "mail_sent_timestamp" => ""
          "mail_recieved_timestamp" => ""
          "mail_remediation_timestamp" => ""
          "detected_urls" => ""
          "urls_data" => ""
          "attachment_data" => ""
          "detected_attachments" => ""
          "attacked_party" => ""
          "impersonated_party" => ""
          "attack_strategy" => ""
          "attachment_count" => ""
          "url_count" => ""
          "attack_vector" => ""
          "autoRemediated" => ""
          "is_read" => ""
          "post_remediated" => ""
          "remediation_status" => ""
          "return_path" => ""
          "internet_message_id" => ""
          "auto_remediated" => ""
          "email" => ""
          "recipient_address_value" => ""
        }
      }

      date {
        match => ["msg.receivedTime","ISO8601","yyyy-MM-ddTHH:mm:ss"]
        target => "metadata.event_timestamp"
        on_error => "no_received_time"
      }

      mutate {
        convert => {
          "msg.abxMessageId" => "string"
        }
        on_error => "no_abxMessageId"
      }

      mutate {
        replace => {
          "metadata.product_log_id" => "%{msg.abxMessageId}"
        }
        on_error => "no_abx_message_id_match"
      }

      mutate {
        replace => {
          "mail_sent_timestamp.key" => "mailSentTime"
          "mail_sent_timestamp.value.string_value" => "%{msg.sentTime}"
        }
        on_error => "no_sent_time"
      }

      mutate {
        replace => {
          "mail_remediation_timestamp.key" => "mailRemediationTimestamp"
          "mail_remediation_timestamp.value.string_value" => "%{msg.remediationTimestamp}"
        }
        on_error => "no_remediation_time"
      }

      mutate {
        replace => {
          "internet_message_id.key" => "internetMessageId"
          "internet_message_id.value.string_value" => "%{msg.internetMessageId}"
        }
        on_error => "no_internet_message_id"
      }

      mutate {
        replace => {
          "security_result.threat_id" => "%{msg.threatId}"
        }
        on_error => "no_threat_id"
      }

      mutate {
        replace => {
          "mail_recieved_timestamp.key" => "mailReceivedTime"
          "mail_recieved_timestamp.value.string_value" => "%{msg.receivedTime}"
        }
        on_error => "no_received_time"
      }

      mutate {
        replace => {
          "principal.administrative_domain" => "%{msg.senderDomain}"
        }
        on_error => "no_sender_domain"
      }

      grok {
        match => {
          "msg.senderIpAddress" => ["%{IP:ip}"]
        }
        on_error => "not_ip"
      }

      if ![not_ip] {
        mutate {
          merge => {
            "principal.ip" => "msg.senderIpAddress"
            "principal.asset.ip" => "msg.senderIpAddress"
          }
          on_error => "no_sender_ip"
        }
      }

      grok{
        match => {
          "msg.fromAddress" => ["%{EMAILADDRESS:email}"]
        }
        on_error => "no_from_address"
        overwrite => ["email"]
      }

      if ![no_from_address] {
        mutate {
          replace => {
            "network.email.from" => "%{email}"
          }
          on_error => "no_from"
        }
      }

      mutate {
        replace => {
          "principal.user.user_display_name" => "%{msg.fromName}"
        }
        on_error => "no_user_name"
      }

      mutate {
        replace => {
          "security_result.threat_name" => "%{msg.attackType}"
        }
        on_error => "no_attack_type"
      }

      for insight in msg.summaryInsights {
        if [summary] == "" {
          mutate {
            replace => {
              "summary" => "%{insight}"
            }
            on_error => "no_insight"
          }
        }
        else {
          mutate {
            replace => {
              "summary" => "%{summary}, %{insight}"
            }
            on_error => "no_insight"
          }
        }
      }

      for url in msg.urls {
        if [urls_data] == "" {
          mutate {
            replace => {
              "urls_data" => "%{url}"
            }
            on_error => "no_url_data"
          }
        }
        else {
          mutate {
            replace => {
              "urls_data" => "%{urls_data} , %{url}"
            }
            on_error => "no_url_data"
          }
        }
      }

      for attachment in msg.attachmentNames {
        if [attachment_data] == "" {
          mutate {
            replace => {
              "attachment_data" => "%{attachment}"
            }
            on_error => "no_attachment_data"
          }
        }
        else {
          mutate {
            replace => {
              "attachment_data" => "%{attachment_data} , %{attachment}"
            }
            on_error => "no_attachment_data"
          }
        }
      }

      if [urls_data] != "" {
        mutate {
          replace => {
            "detected_urls.key" => "detectedUrls"
            "detected_urls.value" => "%{urls_data}"
          }
          on_error => "no_detected_urls"
        }
      }

      if [attachment_data] != "" {
        mutate {
          replace => {
            "detected_attachments.key" => "attachmentNames"
            "detected_attachments.value" => "%{attachment_data}"
          }
          on_error => "no_detected_attachments"
        }
      }

      if [detected_urls] != "" {
        mutate {
          merge => {
            "security_result.detection_fields" => "detected_urls"
          }
          on_error => "no_detected_urls"
        }
      }

      if [detected_attachments] != "" {
        mutate {
          merge => {
            "security_result.detection_fields" => "detected_attachments"
          }
          on_error => "no_detected_attachments"
        }
      }

      mutate {
        replace => {
          "attack_strategy.key" => "attackStrategy"
          "attack_strategy.value" => "%{msg.attackStrategy}"
        }
        on_error => "no_attack_strategy"
      }

      if [attack_strategy] != "" {
        mutate {
          merge => {
            "security_result.detection_fields" => "attack_strategy"
          }
          on_error => "no_attack_strategy"
        }
      }

      mutate {
        replace => {
          "attack_vector.key" => "attackVector"
          "attack_vector.value" => "%{msg.attackVector}"
        }
        on_error => "no_attack_vector"
      }

      if [attack_vector] != "" {
        mutate {
          merge => {
            "security_result.detection_fields" => "attack_vector"
          }
          on_error => "no_attack_vector"
        }
      }

      mutate {
        replace => {
          "attacked_party.key" => "attackedParty"
          "attacked_party.value" => "%{msg.attackedParty}"
        }
        on_error => "no_attacked_party"
      }

      if [attacked_party] != "" {
        mutate {
          merge => {
            "security_result.detection_fields" => "attacked_party"
          }
          on_error => "no_attacked_party"
        }
      }

      mutate {
        replace => {
          "impersonated_party.key" => "impersonatedParty"
          "impersonated_party.value" => "%{msg.impersonatedParty}"
        }
        on_error => "no_impersonated_party"
      }

      if [impersonated_party] != "" {
        mutate {
          merge => {
            "security_result.detection_fields" => "impersonated_party"
          }
          on_error => "no_impersonated_party"
        }
      }

      if [summary] != "" {
        mutate {
          replace => {
            "security_result.summary" => "%{summary}"
          }
          on_error => "no_summary"
        }
      }

      mutate {
        replace => {
          "spam_mail" => "MAIL_SPAM"
        }
        merge => {
          "security_result.category" => "spam_mail"
        }
        on_error => "no_spam_type"
      }

      mutate {
        replace => {
          "phishing_mail" => "MAIL_PHISHING"
        }
        merge => {
          "security_result.category" => "phishing_mail"
        }
        on_error => "no_phising_type"
      }

      for address in msg.toAddresses {
        grok{
          match => {
            "address" => ["%{EMAILADDRESS:email}"]
          }
          on_error => "not_mail"
        }
        if ![not_mail] {
          mutate {
            merge => {
            "network.email.to" => "email"
          }
          on_error => "no_to_address"
          }
        }
      }

      grok {
        match => {
          "msg.recipientAddress" => "%{EMAILADDRESS:recipient_address_value}"
        }
        overwrite => ["recipient_address_value"]
        on_error => "invalid_to_mail"
      }
      if ![invalid_to_mail] {
        mutate {
          merge => {
            "network.email.to" => "recipient_address_value"
          }
          on_error => "no_recipient_address"
        }
      }

      for address in msg.ccEmails{
        grok{
          match => {
            "address" => ["%{EMAILADDRESS:email}"]
          }
          on_error => "not_mail"
        }
        if ![not_mail]
        {
          mutate {
            merge => {
              "network.email.cc" => "email"
            }
            on_error => "no_cc"
          }
        }
      }

      for address in msg.replyToEmails{
        grok{
          match => {
            "address" => ["%{EMAILADDRESS:reply_to_email}"]
          }
          on_error => "invalid_reply_to_mail"
        }
        if ![invalid_reply_to_mail] {
          mutate {
            replace => {
            "network.email.reply_to" => "%{reply_to_email}"
            }
            on_error => "no_cc"
          }
        }
      }

      mutate {
        merge => {
          "network.email.subject" => "msg.subject"
        }
        on_error => "no_subject"
      }

      mutate {
        replace => {
          "network.http.referral_url" => "%{msg.abxPortalUrl}"
        }
        on_error => "no_portal_url"
      }

      mutate {
        replace => {
          "url_count.key" => "urlCount"
        }
        rename => {
          "msg.urlCount" => "url_count.value.number_value"
        }
        on_error => "no_url_count"
      }

      if [url_count] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "url_count"
          }
        }
      }

      mutate {
        replace => {
          "attachment_count.key" => "attachmentCount"
        }
        rename => {
          "msg.attachmentCount" => "attachment_count.value.number_value"
        }
        on_error => "no_attachment_count"
      }

      if [attachment_count] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "attachment_count"
          }
        }
      }

      mutate {
        replace => {
          "is_read.key" => "isRead"
        }
        rename => {
          "msg.isRead" => "is_read.value.bool_value"
        }
        "on_error" => "no_is_read"
      }

      mutate {
        replace => {
          "post_remediated.key" => "postRemediated"
        }
        rename => {
          "msg.postRemediated" => "post_remediated.value.bool_value"
        }
        on_error => "no_post_remediated"
      }

      mutate {
        replace => {
          "return_path.key" => "returnPath"
          "return_path.value.string_value" => "%{msg.returnPath}"
        }
        on_error => "no_return_path"
      }

      mutate {
        replace => {
          "remediation_status.key" => "remediationStatus"
          "remediation_status.value.string_value" => "%{msg.remediationStatus}"
        }
        on_error => "no_remediation_status"
      }

      if [return_path] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "return_path"
          }
        }
      }

      if [remediation_status] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "remediation_status"
          }
        }
      }

      if [internet_message_id] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "internet_message_id"
          }
        }
      }

      if [mail_remediation_timestamp] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "mail_remediation_timestamp"
          }
        }
      }

      if [mail_sent_timestamp] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "mail_sent_timestamp"
          }
        }
      }

      if [mail_recieved_timestamp] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "mail_recieved_timestamp"
          }
        }
      }

      if [is_read] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "is_read"
          }
        }
      }

      if [post_remediated] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "post_remediated"
          }
        }
      }

      mutate {
        replace => {
          "metadata.event_type" => "EMAIL_TRANSACTION"
        }
      }

      mutate {
        replace => {
          "metadata.product_name" => "ABNORMAL_SECURITY"
          "metadata.vendor_name" => "ABNORMAL_SECURITY"
        }
      }

      if [principal] != "" {
        mutate {
          rename => {
            "principal" => "event.idm.read_only_udm.principal"
          }
        }
      }

      if [metadata] != "" {
        mutate {
          rename => {
            "metadata" => "event.idm.read_only_udm.metadata"
          }
        }
      }

      if [network] != "" {
        mutate {
          rename => {
            "network" => "event.idm.read_only_udm.network"
          }
        }
      }

      if [security_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
        }
      }

      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "event" => ""
        "principal" => ""
        "target" => ""
        "metadata" => ""
        "security_result" => ""
        "network" => ""
        "additional" => ""
        "summary" => ""
        "urls_data" => ""
        "attachment_data" => ""
        "has_network_email" => ""
        "has_principal" => ""
        "has_target_user" => ""
      }
    }

    if [event_data][received_time] != "" {
      date {
        match => ["event_data.received_time","ISO8601","yyyy-MM-ddTHH:mm:ss","yyyy-MM-ddTHH:mm:ssZ"]
        target => "metadata.event_timestamp"
        on_error => "no_received_time"
      }
    }
    else if [event_data][abx_metadata][timestamp] != "" {
      date {
        match => ["event_data.abx_metadata.timestamp","ISO8601","yyyy-MM-ddTHH:mm:ss","yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ"]
        target => "metadata.event_timestamp"
        on_error => "no_received_time"
      }
    }

    if [event_data][abx_metadata][event_type] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{event_data.abx_metadata.event_type}"
        }
        on_error => "no_abx_metadata_event_type"
      }
    }

    if [sourcetype] == "case" {
