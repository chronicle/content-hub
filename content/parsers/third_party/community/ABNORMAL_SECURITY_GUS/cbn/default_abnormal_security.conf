      mutate {
        merge => {
          "security_result.category_details" => "event_data.abx_metadata.event_type"
        }
        on_error => "no_event_type"
      }
    }
    else {
      mutate {
        replace => {
          "phishing_mail" => "MAIL_PHISHING"
        }
        merge => {
          "security_result.category" => "phishing_mail"
        }
        on_error => "no_phising_type"
      }
      mutate {
        replace => {
          "spam_mail" => "MAIL_SPAM"
        }
        merge => {
          "security_result.category" => "spam_mail"
        }
        on_error => "no_spam_type"
      }
    }

    for address in event_data.to_addresses {
      grok{
        match => {
          "address" => ["%{EMAILADDRESS:email}"]
        }
        on_error => "not_mail"
      }
      if ![not_mail] {
        mutate {
          merge => {
            "network.email.to" => "email"
          }
          on_error => "no_to_address"
        }
        if ![no_to_address] {
          mutate {
            replace => {
              "has_network_email" => "true"
            }
          }
        }
      }
    }

    if [event_data][recipient_address] != "" {
      grok{
        match => {
          "event_data.recipient_address" => ["%{EMAILADDRESS:to_email}"]
        }
        on_error => "not_to_mail"
      }
      if ![not_to_mail] {
        mutate {
          merge => {
            "network.email.to" => "to_email"
          }
          on_error => "no_recipient_address"
        }
        if ![no_recipient_address] {
          mutate {
            replace => {
              "has_network_email" => "true"
            }
          }
        }
      }
    }

    for address in event_data.cc_emails{
      grok{
        match => {
          "address" => ["%{EMAILADDRESS:email}"]
        }
        on_error => "not_mail"
      }
      if ![not_mail] {
        mutate {
          merge => {
            "network.email.cc" => "email"
          }
          on_error => "no_cc"
        }
        if ![no_cc] {
          mutate {
            replace => {
              "has_network_email" => "true"
            }
          }
        }
      }
    }

    for address in event_data.reply_to_emails{
      grok{
        match => {
          "address" => ["%{EMAILADDRESS:email}"]
        }
        on_error => "not_mail"
      }
      if ![not_mail] {
        mutate {
          replace => {
            "network.email.reply_to" => "%{address}"
          }
          on_error => "no_reply_to"
        }
        if ![no_reply_to] {
          mutate {
            replace => {
              "has_network_email" => "true"
            }
          }
        }
      }
    }

    if [event_data][subject] != "" {
      mutate {
        merge => {
          "network.email.subject" => "event_data.subject"
        }
        on_error => "no_subject"
      }
      if ![no_subject] {
        mutate {
          replace => {
            "has_network_email" => "true"
          }
        }
      }
    }

    if [event_data][abx_portal_url] != "" {
      mutate {
        replace => {
          "network.http.referral_url" => "%{event_data.abx_portal_url}"
        }
        on_error => "no_portal_url"
      }
    }

    if [event_data][url_count] != "" {
      mutate {
        replace => {
          "url_count.key" => "urlCount"
        }
        rename => {
          "event_data.url_count" => "url_count.value.number_value"
        }
        on_error => "no_url_count"
      }
      if ![no_url_count] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "url_count"
          }
          on_error => "no_url_count"
        }
      }
    }

    if [event_data][attachment_count] != "" {
      mutate {
        replace => {
          "attachment_count.key" => "attachmentCount"
        }
        rename => {
          "event_data.attachment_count" => "attachment_count.value.number_value"
        }
        on_error => "no_attachment_count"
      }
      if ![no_attachment_count]{
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "attachment_count"
          }
          on_error => "no_attachment_count_label"
        }
      }
    }

    if [event_data][attack_score] != "" {
      mutate {
        replace => {
          "attack_score.key" => "attackScore"
        }
        rename => {
          "event_data.attack_score" => "attack_score.value.number_value"
        }
        on_error => "no_attack_score"
      }
      if ![no_attack_score] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "attack_score"
          }
          on_error => "no_attack_score_label"
        }
      }
    }

    if [event_data][is_read] != "" {
      mutate {
        replace => {
          "is_read.key" => "isRead"
        }
        rename => {
          "event_data.is_read" => "is_read.value.bool_value"
        }
        "on_error" => "no_is_read"
      }
      if ![no_is_read] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "is_read"
          }
          on_error => "no_is_read_label"
        }
      }
    }

    if [event_data][post_remediated] != "" {
      mutate {
        replace => {
          "post_remediated.key" => "postRemediated"
        }
        rename => {
          "event_data.post_remediated" => "post_remediated.value.bool_value"
        }
        on_error => "no_post_remediated"
      }
      if ![no_post_remediated] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "post_remediated"
          }
          on_error => "no_post_remediated_label"
        }
      }
    }

    if [event_data][return_path] != "" {
      mutate {
        replace => {
          "return_path.key" => "returnPath"
          "return_path.value.string_value" => "%{event_data.return_path}"
        }
        on_error => "no_return_path"
      }
      if ![no_return_path] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "return_path"
          }
          on_error => "no_return_path_label"
        }
      }
    }

    if [event_data][remediation_status] != "" {
      mutate {
        replace => {
          "remediation_status.key" => "remediationStatus"
          "remediation_status.value.string_value" => "%{event_data.remediation_status}"
        }
        on_error => "no_remediation_status"
      }

      if ![no_remediation_status] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "remediation_status"
          }
          on_error => "no_remediation_status_label"
        }
      }
    }

    if [event_data][abx_body][campaign_id] != "" {
      mutate {
        replace => {
          "campaign_id_label.key" => "campaign_id"
          "campaign_id_label.value.string_value" => "%{event_data.abx_body.campaign_id}"
        }
        on_error => "no_campaign_id"
      }
      if ![no_campaign_id] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "campaign_id_label"
          }
          on_error => "no_campaign_id"
        }
      }
    }

    if [event_data][abx_body][judgement] != "" {
      mutate {
        replace => {
          "judgement_label.key" => "judgement"
          "judgement_label.value" => "%{event_data.abx_body.judgement}"
        }
        on_error => "no_judgement"
      }
      if ![no_judgement] {
        mutate {
          merge => {
            "security_result.detection_fields" => "judgement_label"
          }
          on_error => "no_judgement_label"
        }
      }
    }

    if [event_data][abx_metadata][trace_id] != "" {
      mutate {
        replace => {
          "trace_id_label.key" => "trace_id"
          "trace_id_label.value.string_value" => "%{event_data.abx_metadata.trace_id}"
        }
        on_error => "no_trace_id"
      }
      if ![no_trace_id] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "trace_id_label"
          }
          on_error => "no_trace_id_label"
        }
      }
    }

    if [event_data][abx_body][category] == "login" and [has_principal] == "true" and [has_target_user] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [has_network_email] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "EMAIL_TRANSACTION"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else if [event_data][abx_body][entity][identifier] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      replace => {
        "metadata.product_name" => "ABNORMAL_SECURITY"
        "metadata.vendor_name" => "ABNORMAL_SECURITY"
      }
    }

    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }

    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
      }
    }

    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }

    if [network] != "" {
      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
