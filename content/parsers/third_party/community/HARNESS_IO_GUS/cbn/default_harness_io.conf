# Product: Harness_IO
# Category: Automation and DevOps Tools
# Supported Format: JSON
# Reference: NA
# Last Updated: 2025-04-16
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "extensions" => ""
      "network" => ""
      "additional" => ""
      "has_principal" => "false"
      "auditEventId" => ""
      "auditEventAuthor.pr.type" => ""
      "auditEventAuthor.pr.identifier" => ""
      "auditEventAuthor.pr.email" => ""
      "auditModule" => ""
      "auditResource.type" => ""
      "records_auditResource_type" => ""
      "auditAction" => ""
      "auditHttpRequestInfo.requestMethod" => ""
      "auditHttpRequestInfo.clientIP" => ""
      "auditEventTime" => ""
      "auditEventMetadata.batchId" => ""
      "auditResource.identifier" => ""
      "auditResourceScope.accountIdentifier" => ""
      "has_user" => "false"
    }
  }
  mutate {
    gsub => [ "message" , "principal" , "pr" ]
  }
  mutate {
    gsub => ["message", "\\r\\n", ""]
  }
  mutate {
    gsub => ["message", "\\n", ""]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "invalid_json_message"
  }
  if ![invalid_json_message] {
    if [auditEventId] != "" {
      mutate {
        replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{auditEventId}"
        }
          on_error => "auditEventId_error1"
      }
    }
    if [auditEventAuthor][pr][type] != "" {
      mutate {
        replace => {
          "records_auditEventAuthor_principal_type_label.value" => "%{auditEventAuthor.pr.type}"
        }
        on_error => "auditEventAuthor_principal_type_error"
      }
      if ![auditEventAuthor_principal_type_error] {
        mutate {
          replace => {
            "records_auditEventAuthor_principal_type_label.key" => "auditEventAuthor_principal_type"
          }
          on_error => "auditEventAuthor_principal_type_index_error"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "records_auditEventAuthor_principal_type_label"
          }
          on_error => "auditEventAuthor_principal_type_merge_error"
        }
      }
    }
    if [auditEventAuthor][pr][identifier] != "" {
      mutate {
        replace => {
          "records_auditEventAuthor_principal_identifier_label.value" => "%{auditEventAuthor.pr.identifier}"
        }
        on_error => "auditEventAuthor_principal_identifier_error"
      }
      if ![auditEventAuthor_principal_identifier_error] {
        mutate {
          replace => {
            "records_auditEventAuthor_principal_identifier_label.key" => "auditEventAuthor_principal_identifier"
          }
          on_error => "auditEventAuthor_principal_identifier_index_error"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "records_auditEventAuthor_principal_identifier_label"
          }
          on_error => "auditEventAuthor_principal_identifier_merge_error"
        }
      }
    }
    if [auditEventAuthor][pr][email] =~ "^.+@.+$" {
      mutate {
        replace => {
          "record_auditEventAuthor_principal_email" => "%{auditEventAuthor.pr.email}"
        }
        on_error => "record_auditEventAuthor_principal_email_error"
      }
      if [record_auditEventAuthor_principal_email] =~ "^.+@.+$" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.email_addresses" => "record_auditEventAuthor_principal_email"
          }
          on_error => "auditEventAuthor_pr_email_error"
        }
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
    }
    if [auditModule] != "" {
      mutate {
        replace => {
          "records_auditModule_label.value.string_value" => "%{auditModule}"
        }
        on_error => "auditModule_error"
      }
      if ![auditModule_error] {
        mutate {
          replace => {
            "records_auditModule_label.key" => "auditModule"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "records_auditModule_label"
          }
          on_error => "auditModule_merge_error"
        }
      }
    }
    if [auditResource][type] != "" {
      mutate {
        replace => {
          "records_auditResource_type" => "%{auditResource.type}"
        }
        on_error => "auditResource_type_error"
      }
      if ![auditResource_type_error] {
        mutate {
          replace => {
            "records_auditResource_type_label.value.string_value" => "%{records_auditResource_type}"
          }
          on_error => "auditResource_type_error"
        }
        if ![auditResource_type_error] {
          mutate {
            replace => {
              "records_auditResource_type_label.key" => "auditResource_type"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "records_auditResource_type_label"
            }
            on_error => "auditModule_merge_error"
          }
        }
      }
    }
    if [auditResource][identifier] != "" {
      mutate {
        replace => {
          "records_auditResource_identifier" => "%{auditResource.identifier}"
        }
        on_error => "auditResource_identifier_error"
      }
      if ![auditResource_identifier_error] {
        mutate {
          replace => {
            "records_auditResource_identifier_label.value.string_value" => "%{records_auditResource_identifier}"
          }
          on_error => "auditResource_identifier_error"
        }
        if ![auditResource_identifier_error] {
          mutate {
            replace => {
              "records_auditResource_identifier_label.key" => "auditResource_identifier"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "records_auditResource_identifier_label"
            }
            on_error => "auditModule_identifier_merge_error"
          }
        }
      }
    }
    if [auditResourceScope][accountIdentifier] != "" {
      mutate {
        replace => {
          "records_auditResourceScope_accountIdentifier_label.value.string_value" => "%{auditResourceScope.accountIdentifier}"
        }
        on_error => "auditResourceScope_accountIdentifier_error"
      }
      if ![auditResourceScope_accountIdentifier_error] {
        mutate {
          replace => {
            "records_auditResourceScope_accountIdentifier_label.key" => "auditResourceScope_accountIdentifier"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "records_auditResourceScope_accountIdentifier_label"
          }
          on_error => "auditResourceScope_accountIdentifier_merge_error"
        }
      }
    }
    if [auditAction] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{auditAction}"
        }
        on_error => "auditAction_error"
      }
    }
    if [auditHttpRequestInfo][requestMethod] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{auditHttpRequestInfo.requestMethod}"
        }
        on_error => "auditHttpRequestInfo_requestMethod_error"
      }
    }
    if [auditHttpRequestInfo][clientIP] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "auditHttpRequestInfo.clientIP"
          "event.idm.read_only_udm.principal.asset.ip" => "auditHttpRequestInfo.clientIP"
        }
        on_error => "auditHttpRequestInfo_clientIP_error"
      }
      mutate{
        replace => {
          "has_principal" => "true"
        }
      }
    }
    mutate {
      convert => {
        "auditEventTime" => "string"
      }
      on_error => "event_time_convert_error"
    }
    if [auditEventTime] != "" {
      date {
        match => ["auditEventTime", "UNIX", "ISO8601", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "timestamp_error"
      }
    }
    if [auditEventMetadata][batchId] != "" {
      mutate {
        replace => {
          "records_auditEventMetadata_batchId_label.value.string_value" => "%{auditEventMetadata.batchId}"
        }
        on_error => "auditEventMetadata_batchId_error"
      }
      if ![auditEventMetadata_batchId_error] {
        mutate {
          replace => {
            "records_auditEventMetadata_batchId_label.key" => "auditEventMetadata_batchId"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "records_auditEventMetadata_batchId_label"
          }
          on_error => "auditEventMetadata_batchId_merge_error"
        }
      }
    }
    if [has_principal] == "true" && [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "HARNESS_IO"
        "event.idm.read_only_udm.metadata.product_name" => "HARNESS_IO"
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
  else {
    mutate {
      gsub => [ "message" , "principal" , "pr" ]
    }
    mutate {
      gsub => ["message", "\\r\\n", ""]
    }
    mutate {
      gsub => ["message", "\\n", ""]
    }
    mutate {
      replace => {
        "record_json_message" => "{\"records\":%{message}}"
      }
      on_error => "not_in_json_format"
    }
    json {
      source => "record_json_message"
      array_function => "split_columns"
      on_error => "invalid_json"
    }
    if ![invalid_json] {
      for index, record in records {
        mutate {
          replace => {
            "principal" => ""
            "target" => ""
            "metadata" => ""
            "extensions" => ""
            "network" => ""
            "additional" => ""
            "has_principal" => "false"
            "event" => ""
            "has_user" => "false"
            "EventId" => ""
            "auditEventAuthor_pr_type_label" => ""
            "auditEventAuthor_pr_identifier_label" => ""
            "record_auditEventAuthor_pr_email" => ""
            "record_email" => ""
            "auditModule_label" => ""
            "auditResource_identifier" => ""
            "auditResource_identifier_label" => ""
            "clientIP" => ""
            "type_label" => ""
            "auditResourceScope_accountIdentifier_label" => ""
            "auditResourceScope_orgIdentifier" => ""
            "auditResourceScope_projectIdentifier_filed" => ""
            "action" => ""
            "req" => ""
            "auditEventMetadata_batchId_label" =>""
            "time_stamp" => ""
            "event_time_label" => ""
          }
        }
        mutate {
          convert => {
            "index" => "string"
          }
        }
        #metadata fields
        mutate {
          replace => {
            "EventId" => "%{record.auditEventId}"
          }
          on_error => "EventId_error"
        }
        if ![EventId_error] {
          mutate {
            replace => {
              "metadata.product_log_id" => "%{EventId}"
            }
            on_error => "auditEventId_error"
          }
        }
        mutate {
          convert => {
            "record.auditEventTime" => "string"
          }
          on_error => "event_time_convert_error"
        }
        mutate {
          replace => {
            "time_stamp"=> "%{record.auditEventTime}"
          }
          on_error => "event_time_error"
        }
        if [time_stamp] != "" {
          date {
            match => ["time_stamp", "UNIX", "ISO8601", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
            target => "metadata.event_timestamp"
            on_error => "timestamp_error"
          }
        }
        mutate {
          replace => {
            "metadata.product_event_type" => "%{record.auditAction}"
          }
          on_error => "auditAction_error"
        }
        #principal fields
        mutate {
          replace => {
            "auditEventAuthor_pr_type_label.value" => "%{record.auditEventAuthor.pr.type}"
          }
          on_error => "auditEventAuthor_pr_type_error"
        }
        if ![auditEventAuthor_pr_type_error] {
          mutate {
            replace => {
              "auditEventAuthor_pr_type_label.key" => "auditEventAuthor_pr_type_%{index}"
            }
            on_error => "auditEventAuthor_pr_type_index_error"
          }
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "auditEventAuthor_pr_type_label"
            }
            on_error => "auditEventAuthor_pr_type_merge_error"
          }
        }
        mutate {
          replace => {
            "auditEventAuthor_pr_identifier_label.value" => "%{record.auditEventAuthor.pr.identifier}"
          }
          on_error => "auditEventAuthor_pr_identifier_error"
        }
        if ![auditEventAuthor_pr_identifier_error] {
          mutate {
            replace => {
              "auditEventAuthor_pr_identifier_label.key" => "auditEventAuthor_pr_identifier_%{index}"
            }
            on_error => "auditEventAuthor_pr_identifier_index_error"
          }
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "auditEventAuthor_pr_identifier_label"
            }
            on_error => "auditEventAuthor_pr_identifier_merge_error"
          }
        }
        mutate {
          replace => {
            "auditResourceScope_orgIdentifier.value" => "%{record.auditResourceScope.orgIdentifier}"
          }
          on_error => "auditResourceScope_orgIdentifier_error"
        }
        if ![auditResourceScope_orgIdentifier_error] {
          mutate {
            replace => {
              "auditResourceScope_orgIdentifier.key" => "orgIdentifier %{index}"
            }
            on_error => "auditResourceScope_orgIdentifier_index_error"
          }
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "auditResourceScope_orgIdentifier"
            }
            on_error => "auditResourceScope_orgIdentifier_merge_error"
          }
        }
        mutate {
          replace => {
            "auditResourceScope_projectIdentifier_filed.value" => "%{record.auditResourceScope.projectIdentifier}"
          }
          on_error => "auditResourceScope_projectIdentifier_filed_error"
        }
        if ![auditResourceScope_projectIdentifier_filed_error] {
          mutate {
            replace => {
              "auditResourceScope_projectIdentifier_filed.key" => "projectIdentifier %{index}"
            }
            on_error => "auditResourceScope_projectIdentifier_filed_index_error"
          }
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "auditResourceScope_projectIdentifier_filed"
            }
            on_error => "auditResourceScope_projectIdentifier_filed_merge_error"
          }
        }
        mutate {
          replace => {
            "record_email" => "%{record.auditEventAuthor.pr.email}"
          }
          on_error => "record_email_error"
        }
        if [record_email] =~ "^.+@.+$" {
          mutate {
            replace => {
              "record_auditEventAuthor_pr_email" => "%{record_email}"
            }
            on_error => "email_error"
          }
        }
        if [record_auditEventAuthor_pr_email] =~ "^.+@.+$" {
          mutate {
            merge => {
              "principal.user.email_addresses" => "record.auditEventAuthor.pr.email"
            }
            on_error => "auditEventAuthor_pr_email_error"
          }
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
        #additional
        mutate {
          replace => {
            "auditModule_label.value.string_value" => "%{record.auditModule}"
          }
          on_error => "auditModule_error"
        }
        if ![auditModule_error] {
          mutate {
            replace => {
              "auditModule_label.key" => "auditModule %{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "auditModule_label"
            }
            on_error => "auditModule_merge_error"
          }
        }
        mutate {
          replace => {
            "type_label.value.string_value" => "%{record.auditResource.type}"
          }
          on_error => "auditResource_type_error"
        }
        if ![auditResource_type_error] {
          mutate {
            replace => {
              "type_label.key" => "auditResource_type %{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "type_label"
            }
            on_error => "auditResource_type_error"
          }
        }
        mutate {
          replace => {
            "auditResourceScope_accountIdentifier_label.value.string_value" =>"%{record.auditResourceScope.accountIdentifier}"
          }
          on_error => "auditResourceScope_accountIdentifier_error"
        }
        if ![auditResourceScope_accountIdentifier_error] {
          mutate {
            replace => {
              "auditResourceScope_accountIdentifier_label.key" => "auditResourceScope_accountIdentifier %{index}"
            }
          }
        }
        mutate {
          merge => {
            "additional.fields" =>
            "auditResourceScope_accountIdentifier_label"
          }
          on_error => "auditResourceScope_accountIdentifier_merge_error"
        }
        mutate {
          replace =>{
            "auditEventMetadata_batchId_label.key" => "auditEventMetadata_batchId %{index}"
            "auditEventMetadata_batchId_label.value.string_value" =>
            "%{record.auditEventMetadata.batchId}"
          }
          on_error => "auditEventMetadata_batchId_error"
        }
        if ![auditEventMetadata_batchId_error] {
          mutate {
            merge => {
              "additional.fields" => "auditEventMetadata_batchId_label"
            }
          }
        }
        mutate {
          replace => {
            "auditResource_identifier" => "%{record.auditResource.identifier}"
          }
          on_error => "auditAction_error"
        }
        if [auditResource_identifier] =~ "^.+@.+$" {
          mutate {
            merge => {
              "principal.user.email_addresses" => "auditResource_identifier"
            }
            on_error => "auditResource_identifier_empty"
          }
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
        else {
          mutate {
            replace => {
              "auditResource_identifier_label.value.string_value" => "%{record.auditResource.identifier}"
            }
            on_error => "auditResource_identifier_error"
          }
          if ![auditResource_identifier_error] {
            mutate {
              replace => {
                "auditResource_identifier_label.key" => "auditResource_identifier %{index}"
              }
            }
            mutate {
              merge => {
                "additional.fields" => "auditResource_identifier_label"
              }
              on_error => "auditModule_identifier_merge_error"
            }
          }
        }
        grok {
          match => {
            "record.auditHttpRequestInfo.clientIP" => "%{IP:clientIP}"
          }
          overwrite => ["clientIP"]
          on_error => "clientIP_error"
        }
        if [clientIP] != "" {
          mutate{
            merge => {
              "principal.ip"=> "clientIP"
              "principal.asset.ip"=> "clientIP"
            }
            on_error => "auditEventId_error"
          }
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
        #network fields
        mutate {
          replace => {
            "network.http.method" => "%{record.auditHttpRequestInfo.requestMethod}"
          }
          on_error => "auditHttpRequestInfo_requestMethod_error"
        }
        if [principal] != "" {
          mutate {
            rename => {
              "principal" => "event.idm.read_only_udm.principal"
            }
          }
        }
        if [additional] != "" {
          mutate {
            rename => {
              "additional" => "event.idm.read_only_udm.additional"
            }
          }
        }
        if [network] != "" {
          mutate {
            rename => {
              "network" => "event.idm.read_only_udm.network"
            }
          }
        }
        if [metadata] != "" {
          mutate {
            rename => {
              "metadata" => "event.idm.read_only_udm.metadata"
            }
          }
        }
        if [has_principal] == "true" && [has_user] == "true" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
        else if [has_principal] == "true" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
            }
          }
        }
        else {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
            }
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.vendor_name" => "HARNESS_IO"
            "event.idm.read_only_udm.metadata.product_name" => "HARNESS_IO"
          }
        }
        mutate {
          merge => {
            "@output" => "event"
          }
        }
      }
    }
    else {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
}
