# Product: Cloudflare_Gateway_DNS
# Category: Network/DNS
# Supported Format: JSON
# Reference:https://developers.cloudflare.com/logs/reference/log-fields/account/gateway_dns
# Last Updated: 2026-10-26
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "AccountID" => ""
      "ApplicationID" => ""
      "ApplicationName" => ""
      "AuthoritativeNameServerIPs" => ""
      "CNAMECategoryNames" => ""
      "CNAMEs" => ""
      "ColoCode" => ""
      "CustomResolveDurationMs" => ""
      "CustomResolverAddress" => ""
      "CustomResolverResponse" => ""
      "custom_resolver_ip" => ""
      "Datetime" => ""
      "DeviceID" => ""
      "DeviceName" => ""
      "DoHSubdomain" => ""
      "DoTSubdomain" => ""
      "DstIP" => ""
      "DstPort" => ""
      "EDEErrors" => ""
      "Email" => ""
      "InitialCategoryNames" => ""
      "InitialResolvedIPs" => ""
      "InternalDNSDurationMs" => ""
      "InternalDNSFallbackStrategy" => ""
      "InternalDNSRCode" => ""
      "IsResponseCached" => ""
      "Location" => ""
      "MatchedCategoryNames" => ""
      "MatchedIndicatorFeedNames" => ""
      "PolicyName" => ""
      "Protocol" => ""
      "QueryApplicationNames" => ""
      "QueryCategoryNames" => ""
      "QueryIndicatorFeedNames" => ""
      "QueryName" => ""
      "QuerySize" => ""
      "QueryTypeName" => ""
      "RCode" => ""
      "RedirectTargetURI" => ""
      "RegistrationID" => ""
      "RequestContextCategoryNames" => ""
      "ResolvedIPCategoryNames" => ""
      "ResolvedIPCountryCodes" => ""
      "ResolvedIPs" => ""
      "ResolverDecision" => ""
      "ResolverPolicyName" => ""
      "ResourceRecordsJSON" => ""
      "ResponseTimeMs" => ""
      "SrcIP" => ""
      "SrcIPCountryCode" => ""
      "SrcPort" => ""
      "UpstreamRecordTTLs" => ""
      "UserID" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "has_target" => "false"
      "has_dns" => "false"
      "has_resource_records" => "false"
      "has_icat" => "false"
      "has_init_ip" => "false"
      "has_qfeed" => "false"
      "has_up_ttl" => "false"
      "intermediary" => ""
      "question" => ""
      "security_result" => ""
      "threat_feed_name" => ""
      "ede_description" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] == true {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  # 1. Timestamp
  if [Datetime] != "" {
    date {
      match => ["Datetime", "ISO8601", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_datetime"
    }
  }

  # 2. Principal fields (Client Device, User, Network & Location)
  if [SrcIP] != "" {
    grok {
      match => {
        "SrcIP" => "^%{IP:SrcIP}$"
      }
      overwrite => ["SrcIP"]
      on_error => "src_ip_not_ip"
    }
    if ![src_ip_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "SrcIP"
          "event.idm.read_only_udm.principal.asset.ip" => "SrcIP"
        }
        on_error => "no_src_ip"
      }
      if ![no_src_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  mutate {
    convert => {
      "SrcPort" => "string"
    }
    on_error => "src_port_already_string"
  }
  if [SrcPort] != "" and [SrcPort] != "0" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{SrcPort}"
      }
      on_error => "no_src_port"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "src_port_convert_error"
    }
  }

  if [DeviceName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{DeviceName}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{DeviceName}"
      }
      on_error => "no_device_name"
    }
    if ![no_device_name] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [DeviceID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" => "Cloudflare:%{DeviceID}"
        "event.idm.read_only_udm.principal.asset.asset_id" =>
            "Cloudflare:%{DeviceID}"
      }
      on_error => "no_device_id"
    }
  }

  if [Email] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "Email"
      }
      on_error => "no_email"
    }
    if ![no_email] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }

  if [UserID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id" =>
          "%{UserID}"
      }
      on_error => "no_user_id"
    }
    if ![no_user_id] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }

  if [SrcIPCountryCode] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" =>
          "%{SrcIPCountryCode}"
      }
      on_error => "no_src_ip_country_code"
    }
  }

  if [Location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.name" => "%{Location}"
      }
      on_error => "no_location"
    }
  }

  # 3. Target & Intermediary fields
  if [DstIP] != "" {
    grok {
      match => {
        "DstIP" => "^%{IP:DstIP}$"
      }
      overwrite => ["DstIP"]
      on_error => "dst_ip_not_ip"
    }
    if ![dst_ip_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "DstIP"
          "event.idm.read_only_udm.target.asset.ip" => "DstIP"
        }
        on_error => "no_dst_ip"
      }
      if ![no_dst_ip] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  mutate {
    convert => {
      "DstPort" => "string"
    }
    on_error => "dst_port_already_string"
  }
  if [DstPort] != "" and [DstPort] != "0" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{DstPort}"
      }
      on_error => "no_dst_port"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "dst_port_convert_error"
    }
  }

  if [AccountID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" =>
          "%{AccountID}"
      }
      on_error => "no_account_id"
    }
  }

  if [ApplicationName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{ApplicationName}"
      }
      on_error => "no_application_name"
    }
  } else {
    for index, appname in QueryApplicationNames {
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "qapp_index_already_string"
      }
      if [index] == "0" and [appname] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.application" => "%{appname}"
          }
          on_error => "no_qapp_target_app"
        }
      }
    }
  }

  for index, resolvedcc in ResolvedIPCountryCodes {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "rcc_index_already_string"
    }
    if [index] == "0" and [resolvedcc] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.location.country_or_region" =>
            "%{resolvedcc}"
        }
        on_error => "no_target_country"
      }
    }
  }

  if [RedirectTargetURI] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{RedirectTargetURI}"
      }
      on_error => "no_redirect_target_uri"
    }
  }

  if [ColoCode] != "" {
    mutate {
      replace => {
        "intermediary.location.name" => "%{ColoCode}"
      }
      on_error => "no_colo_location"
    }
  }

  if [CustomResolverAddress] != "" {
    grok {
      match => {
        "CustomResolverAddress" => "^%{IP:custom_resolver_ip}$"
      }
      overwrite => ["custom_resolver_ip"]
      on_error => "custom_resolver_not_ip"
    }
    if ![custom_resolver_not_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "custom_resolver_ip"
        }
        on_error => "no_custom_resolver_ip"
      }
    } else {
      mutate {
        replace => {
          "intermediary.hostname" => "%{CustomResolverAddress}"
        }
        on_error => "no_custom_resolver_host"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_error"
    }
  }

  # 4. Network & DNS Protocol fields
  mutate {
    convert => {
      "QuerySize" => "string"
    }
    on_error => "query_size_already_string"
  }
  if [QuerySize] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{QuerySize}"
      }
      on_error => "no_query_size"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "query_size_convert_error"
    }
  }

  if [QueryName] != "" {
    mutate {
      replace => {
        "question.name" => "%{QueryName}"
      }
      on_error => "no_query_name"
    }
    if ![no_query_name] {
      mutate {
        replace => {
          "has_dns" => "true"
        }
      }
    }
  }

  if [QueryTypeName] != "" {
    mutate {
      replace => {
        "record_type" => "%{QueryTypeName}"
      }
      on_error => "no_query_type_name"
    }
    if ![no_query_type_name] {
