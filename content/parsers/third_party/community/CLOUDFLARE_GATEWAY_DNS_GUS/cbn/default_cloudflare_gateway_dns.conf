      on_error => "InternalDNSDurationMs_empty"
    }
    if ![InternalDNSDurationMs_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
            "InternalDNSDurationMs_label"
        }
        on_error => "InternalDNSDurationMs_merge_error"
      }
    }
  }

  if [InternalDNSFallbackStrategy] != "" {
    mutate {
      replace => {
        "InternalDNSFallbackStrategy_label.key" => "InternalDNSFallbackStrategy"
        "InternalDNSFallbackStrategy_label.value.string_value" =>
          "%{InternalDNSFallbackStrategy}"
      }
      on_error => "InternalDNSFallbackStrategy_empty"
    }
    if ![InternalDNSFallbackStrategy_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
            "InternalDNSFallbackStrategy_label"
        }
        on_error => "InternalDNSFallbackStrategy_merge_error"
      }
    }
  }

  mutate {
    convert => {
      "InternalDNSRCode" => "string"
    }
    on_error => "InternalDNSRCode_already_string"
  }
  if [InternalDNSRCode] != "" {
    mutate {
      replace => {
        "InternalDNSRCode_label.key" => "InternalDNSRCode"
        "InternalDNSRCode_label.value.string_value" => "%{InternalDNSRCode}"
      }
      on_error => "InternalDNSRCode_empty"
    }
    if ![InternalDNSRCode_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
            "InternalDNSRCode_label"
        }
        on_error => "InternalDNSRCode_merge_error"
      }
    }
  }

  mutate {
    convert => {
      "IsResponseCached" => "string"
    }
    on_error => "IsResponseCached_already_string"
  }
  if [IsResponseCached] != "" {
    mutate {
      replace => {
        "IsResponseCached_label.key" => "IsResponseCached"
        "IsResponseCached_label.value.string_value" => "%{IsResponseCached}"
      }
      on_error => "IsResponseCached_empty"
    }
    if ![IsResponseCached_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
            "IsResponseCached_label"
        }
        on_error => "IsResponseCached_merge_error"
      }
    }
  }

  for qfeed in QueryIndicatorFeedNames {
    mutate {
      replace => {
        "qfeed_val" => ""
      }
    }
    mutate {
      replace => {
        "qfeed_val.string_value" => "%{qfeed}"
      }
      on_error => "qfeed_val_empty"
    }
    if ![qfeed_val_empty] {
      mutate {
        merge => {
          "qfeed_field.value.list_value.values" => "qfeed_val"
        }
        on_error => "qfeed_merge_error"
      }
      if ![qfeed_merge_error] {
        mutate {
          replace => {
            "has_qfeed" => "true"
          }
        }
      }
    }
  }
  if [has_qfeed] == "true" {
    mutate {
      replace => {
        "qfeed_field.key" => "QueryIndicatorFeedNames"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "qfeed_field"
      }
      on_error => "qfeed_field_merge_error"
    }
  }

  if [RegistrationID] != "" {
    mutate {
      replace => {
        "RegistrationID_label.key" => "RegistrationID"
        "RegistrationID_label.value.string_value" => "%{RegistrationID}"
      }
      on_error => "RegistrationID_empty"
    }
    if ![RegistrationID_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "RegistrationID_label"
        }
        on_error => "RegistrationID_merge_error"
      }
    }
  }

  mutate {
    convert => {
      "ResponseTimeMs" => "string"
    }
    on_error => "ResponseTimeMs_already_string"
  }
  if [ResponseTimeMs] != "" {
    mutate {
      replace => {
        "ResponseTimeMs_label.key" => "ResponseTimeMs"
        "ResponseTimeMs_label.value.string_value" => "%{ResponseTimeMs}"
      }
      on_error => "ResponseTimeMs_empty"
    }
    if ![ResponseTimeMs_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "ResponseTimeMs_label"
        }
        on_error => "ResponseTimeMs_merge_error"
      }
    }
  }

  for upttl in UpstreamRecordTTLs {
    mutate {
      convert => {
        "upttl" => "string"
      }
      on_error => "up_ttl_already_string"
    }
    mutate {
      replace => {
        "up_ttl_val" => ""
      }
    }
    mutate {
      replace => {
        "up_ttl_val.string_value" => "%{upttl}"
      }
      on_error => "up_ttl_val_empty"
    }
    if ![up_ttl_val_empty] {
      mutate {
        merge => {
          "up_ttl_field.value.list_value.values" => "up_ttl_val"
        }
        on_error => "up_ttl_merge_error"
      }
      if ![up_ttl_merge_error] {
        mutate {
          replace => {
            "has_up_ttl" => "true"
          }
        }
      }
    }
  }
  if [has_up_ttl] == "true" {
    mutate {
      replace => {
        "up_ttl_field.key" => "UpstreamRecordTTLs"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "up_ttl_field"
      }
      on_error => "up_ttl_field_merge_error"
    }
  }

  # 7. Event Type & Protocol Finalization
  if [has_dns] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "DNS"
      }
    }
  }

  if [has_dns] == "true" and [has_principal] == "true" and
      [has_target] == "true" and [QueryName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_DNS"
      }
    }
  } else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Cloudflare"
      "event.idm.read_only_udm.metadata.product_name" =>
        "Cloudflare_Gateway_DNS"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}