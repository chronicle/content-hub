# Product: TEAMVIEWER
# Category: Remote Support
# Supported Format: JSON
# Reference: https://webapi.teamviewer.com/api/v1/docs/index
# Last Updated: 2025-12-01
# Copyright 2025 Google SecOps

filter {
  mutate {
      replace => {
        "has_target" => "false"
        "EventName" => ""
        "EventId" => ""
        "auditevent.AffectedItem" => ""
        "Timestamp" => ""
        "Author" => ""
        "AuthorEmail" => ""
        "AffectedItem" => ""
        "EventType" => ""
        "PropertyName" => ""
        "PropertyCategory" => ""
        "src_user_present" => "false"
      }
    }
  if [message] =~ "AuditEvents" {
    mutate {
      gsub => ["message", '﻿', '']
    }

    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    for auditevent in AuditEvents {
      mutate {
        replace => {
          "event" => ""
          "_security_result" => ""
          "src_user" => ""
          "dst_user" => ""
          "userName" => ""
        }
      }

      for details in auditevent.EventDetails {
        mutate {
            replace => {
              "label" => ""
              "auditevent_affected_item" => ""
              "property_name" => ""
            }
          }
        mutate {
          replace => {
            "auditevent_affected_item" => "%{auditevent.AffectedItem}"
          }
          on_error => "no_auditevent_affected_item"
        }
        mutate {
          replace => {
            "property_name" => "%{details.PropertyName}"
          }
          on_error => "no_property_name"
        }

        if [property_name] =~ "Name of participant" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.user_display_name" => "%{details.NewValue}"
            }
            on_error => "no_src_user_display_name"
          }
        }

        else if [property_name] =~ "ID of participant" {
          mutate {
            replace => {
              "src_user" => "%{details.NewValue}"
              "event.idm.read_only_udm.principal.user.userid" => "%{details.NewValue}"
            }
            on_error => "no_src_user"
          }
        }

        else if [property_name] =~ "Name of presenter" {
          grok {
            match => {
            "details.NewValue" => [
            "(?:%{INT}|%{GREEDYDATA:userName})"]
            }
            on_error=> "invalid_value"
            overwrite => ["userName"]
          }

          if [userName] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.user.user_display_name" => "%{userName}"
              }
              on_error => "no_username"
            }
          }
        }

        else if [property_name] =~ "ID of presenter" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.user.userid" => "%{details.NewValue}"
              "dst_user" => "%{details.NewValue}"
            }
            on_error => "no_dst_user"
          }
        }

        else if [property_name] =~ "Source file" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.full_path" => "%{details.NewValue}"
            }
            on_error => "no_source_file"
          }
        }

        else if [property_name] =~ "(client)" {
          mutate {
            replace => {
              "label.key" => "%{details.PropertyName}"
              "label.value" => "%{details.NewValue}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "label"
            }
            on_error => "label_merge_failed"
          }
        }

        else if [property_name] =~ "(server)" {
          mutate {
            replace => {
              "label.key" => "%{property_name}"
              "label.value" => "%{details.NewValue}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "label"
            }
            on_error => "label_merge_failed"
          }
        }

        else {
          mutate {
            replace => {
              "label.key" => "%{property_name}"
              "label.value" => "%{details.NewValue}"
            }
          }
          mutate {
            merge => {
              "_security_result.about.labels" => "label"
            }
            on_error => "label_merge_failed"
          }
        }
        if [src_user] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
        else {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
            }
          }
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "_security_result"
        }
      }

      if [auditevent][Timestamp] != "" {
        date {
          match => ["auditevent.Timestamp","ISO8601" ]
          on_error => "no_timestamp"
        }
      }

      if [auditevent_affected_item] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{auditevent_affected_item}"
          }
          on_error => "no_auditevent_affected_item"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{auditevent.EventName}"
          "event.idm.read_only_udm.metadata.product_name" => "TEAMVIEWER"
          "event.idm.read_only_udm.metadata.vendor_name" => "TEAMVIEWER"
        }
        on_error => "no_event_name"
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
  else if [message] !~ "﻿" {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    if [Timestamp] != "" {
      date {
        match => ["Timestamp","ISO8601"]
        on_error => "no_timestamp"
      }
    }
    if [Author] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{Author}"
          "src_user_present" => "true"

        }
        on_error => "no_author"
      }
    }
    if [AuthorEmail] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "AuthorEmail"
        }
        on_error => "no_author_email"
      }
    }
    if [AffectedItem] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.resource.product_object_id" => "%{AffectedItem}"
        }
        on_error => "no_affected_item"
      }
    }
    if [EventType] != "" {
      mutate {
        replace => {
          "event_type_label.key" => "EventType"
          "event_type_label.value.string_value" => "%{EventType}"
        }
        on_error => "no_event_type"
      }
      if ![no_event_type] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "event_type_label"
          }
          on_error => "event_type_label_merge_failed"
        }
      }
    }
    for details in EventDetails {
      mutate {
        replace => {
          "src_user" => ""
          "dst_user" => ""
          "userName" => ""
          "src_user_display_name" => ""
          "authentication_label" => ""
          "session_type_label" => ""
          "security_result" => ""
          "property_name" => ""
          "property_category" => ""
          "new_value" => ""
          "old_value" => ""
          "catch_all_label" => ""
          "property_name_label" => ""
          "property_category_label" => ""
          "old_value_label" => ""
          "new_value_label" => ""
        }
      }
      mutate {
        replace => {
          "property_name" => "%{details.PropertyName}"
        }
        on_error => "no_property_name"
      }
      mutate {
        replace => {
          "property_category" => "%{details.PropertyCategory}"
        }
        on_error => "no_property_category"
      }
      mutate {
        replace => {
          "new_value" => "%{details.NewValue}"
        }
        on_error => "no_new_value"
      }
      mutate {
        replace => {
          "old_value" => "%{details.OldValue}"
        }
        on_error => "no_old_value"
      }
      if [property_name] == "Name of affected participant"  {
        mutate {
          replace => {
            "src_user_display_name" => "%{details.NewValue}"
            "event.idm.read_only_udm.principal.user.user_display_name" => "%{details.NewValue}"
          }
          on_error => "no_src_user_display_name"
        }
      }
      else if [property_name] == "ID of affected participant" {
        mutate {
          replace => {
            "src_user" => "%{details.NewValue}"
            "event.idm.read_only_udm.principal.user.userid" => "%{details.NewValue}"
          }
          on_error => "no_src_user"
        }
      }
      else if [property_name] == "Name of presenter" {
        grok {
          match => {
          "details.NewValue" => [
          "(?:%{INT}|%{GREEDYDATA:userName})"]
          }
          on_error=> "invalid_value"
          overwrite => ["userName"]
        }
        if [userName] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.user.user_display_name" => "%{userName}"
            }
            on_error => "no_username"
          }
        }
      }
      else if [property_name] == "ID of presenter" {
        mutate {
          replace => {
            "dst_user" => "%{details.NewValue}"
            "event.idm.read_only_udm.target.user.userid" => "%{details.NewValue}"
            "has_target" => "true"
          }
          on_error => "no_dst_user"
        }
      }
      else if [property_name] == "Group name" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.group.group_display_name" => "%{details.NewValue}"
          }
          on_error => "no_group_name"
        }
      }
      else if [property_name] == "Group ID" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.group.product_object_id" => "%{details.NewValue}"
          }
          on_error => "no_group_id"
        }
      }
      else if [property_name] == "Device ID" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.product_object_id" => "%{details.NewValue}"
            "has_target" => "true"
          }
          on_error => "no_device_id"
        }
      }
      else if [property_name] == "Device alias" and [new_value] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.hostname" => "%{details.NewValue}"
            "has_target" => "true"
          }
          on_error => "no_device_alias"
        }
      }
      else if [property_name] == "Used Authentication Method" {
        mutate {
          replace => {
            "authentication_label.key" => "%{details.PropertyName}"
            "authentication_label.value" => "%{details.NewValue}"
          }
          on_error => "no_authentication_label"
        }
        if ![no_authentication_label]  {
          mutate {
            merge => {
              "security_result.detection_fields" => "authentication_label"
            }
            on_error => "authentication_label_merge_failed"
          }
        }
      }
      else if [property_name] =~ "Session type" {
        mutate {
          replace => {
            "session_type_label.key" => "%{details.PropertyName}"
            "session_type_label.value" => "%{details.NewValue}"
          }
          on_error => "no_session_type_label"
        }
        if ![no_session_type_label]  {
          mutate {
            merge => {
              "security_result.detection_fields" => "session_type_label"
            }
            on_error => "session_type_label_merge_failed"
          }
        }
      }
      if [property_name] != "" {
        mutate {
          replace => {
            "property_name_label.key" => "PropertyName"
            "property_name_label.value" => "%{property_name}"
          }
          on_error => "no_property_name"
        }
        if ![no_property_name] {
          mutate {
            merge => {
              "security_result.detection_fields" => "property_name_label"
            }
            on_error => "property_name_label_merge_failed"
          }
        }
      }
      if [property_category] != "" {
        mutate {
          replace => {
            "property_category_label.key" => "PropertyCategory"
            "property_category_label.value" => "%{property_category}"
          }
          on_error => "no_property_category"
        }
        if ![no_property_category] {
          mutate {
            merge => {
              "security_result.detection_fields" => "property_category_label"
            }
            on_error => "property_category_label_merge_failed"
          }
        }
      }
      if [old_value] != "" {
        mutate {
          replace => {
            "old_value_label.key" => "OldValue"
            "old_value_label.value" => "%{old_value}"
          }
          on_error => "no_old_value"
        }
        if ![no_old_value] {
          mutate {
            merge => {
              "security_result.detection_fields" => "old_value_label"
            }
            on_error => "old_value_merge_failed"
          }
        }
      }
      if [new_value] != "" {
        mutate {
          replace => {
            "new_value_label.key" => "NewValue"
            "new_value_label.value" => "%{new_value}"
          }
          on_error => "no_new_value"
        }
        if ![no_new_value] {
          mutate {
            merge => {
              "security_result.detection_fields" => "new_value_label"
            }
            on_error => "new_value_merge_failed"
          }
        }
      }
      if [EventId] != "" {
        mutate {
          convert => {
            "EventId" => "string"
          }
          on_error => "already_string"
        }
        if ![already_string] {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.product_log_id" => "%{EventId}"
            }
            on_error => "no_event_id"
          }
        }
      }
      if [security_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
          on_error => "security_result_merge_failed"
        }
      }
    }
    if [has_target] == "true" or [src_user_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{EventName}"
        "event.idm.read_only_udm.metadata.product_name" => "TEAMVIEWER"
        "event.idm.read_only_udm.metadata.vendor_name" => "TEAMVIEWER"
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
