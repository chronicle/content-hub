# Product: RUBRIK_POLARIS
# Category: Data Security
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-05-27
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "event" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_resource" => "false"
      "has_user" => ""
      "summary" => ""
      "source" => ""
      "severity" => ""
      "timestamp" => ""
      "class" => ""
      "custom_details.seriesId" => ""
      "custom_details.id" => ""
      "custom_details.objectId" => ""
      "custom_details.objectName" => ""
      "custom_details.objectType" => ""
      "custom_details.status" => ""
      "custom_details.clusterId" => ""
      "custom_details.clusterName" => ""
      "custom_details.eventName" => ""
      "custom_details.errorId" => ""
      "custom_details.errorCode" => ""
      "custom_details.errorRemedy" => ""
      "custom_details.errorReason" => ""
      "custom_details.auditUserName" => ""
      "custom_details.auditUserId" => ""
      "custom_details.location" => ""
      "custom_details.url" => ""
      "custom_details.customerID" => ""
      "location" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp","ISO8601","yyyy-MM-ddTHH:mm:ss.SSSZ"]
      on_error => "no_timestamp"
    }
  }

  if [custom_details][id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{custom_details.id}"
      }
      on_error => "no_id"
    }
  }

  if [custom_details][eventName] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{custom_details.eventName}"
      }
      on_error => "no_eventName"
    }
  }

  if [custom_details][objectId] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{custom_details.objectId}"
        "has_resource" => "true"
      }
      on_error => "no_objectId"
    }
  }

  if [custom_details][objectName] != "" {
    mutate {
      replace => {
        "principal.resource.name" => "%{custom_details.objectName}"
        "has_resource" => "true"
      }
      on_error => "no_objectName"
    }
  }

  if [custom_details][objectType] != "" {
    mutate {
      replace => {
        "principal.resource.resource_subtype" => "%{custom_details.objectType}"
        "has_resource" => "true"
      }
      on_error => "no_objectType"
    }
    if [custom_details][objectType] =~ "(Vmware|Vm)"  {
      mutate {
        replace => {
          "principal.resource.resource_type" => "VIRTUAL_MACHINE"
        }
      }
    }
  }

  if [custom_details][clusterId] != "" {
    mutate {
      replace => {
        "clusterid_label.value" => "%{custom_details.clusterId}"
        "clusterid_label.key" => "clusterId"
      }
      on_error => "no_clusterId"
    }
    if ![no_clusterId] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "clusterid_label"
        }
        on_error => "no_clusterid_label"
      }
      if ![no_clusterid_label] {
        mutate {
          replace => {
            "has_resource" => "true"
          }
        }
      }
    }
  }

  if [custom_details][clusterName] != "" {
    mutate {
      replace => {
        "clustername_label.value" => "%{custom_details.clusterName}"
        "clustername_label.key" => "clusterName"
      }
      on_error => "no_clusterName"
    }
    if ![no_clusterName] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "clustername_label"
        }
        on_error => "no_clustername_label"
      }
      if ![no_clustername_label] {
        mutate {
          replace => {
            "has_resource" => "true"
          }
        }
      }
    }
  }

  if [custom_details][location] != "" {
    grok {
      match => {
        "custom_details.location" => "%{IP:location}"
      }
      overwrite => ["location"]
      on_error => "invalid_ip"
    }
    if ![invalid_ip] {
      mutate {
        merge => {
          "principal.ip" => "location"
          "principal.asset.ip" => "location"
        }
        on_error => "no_location"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{summary}"
      }
      on_error => "no_summary"
    }
  }

  if [custom_details][customerID] != "" {
    mutate {
      replace => {
        "customerId_label.key" => "customerID"
        "customerId_label.value" => "%{custom_details.customerID}"
      }
      on_error => "no_customerID"
    }
    if ![no_customerID] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "customerId_label"
        }
        on_error => "no_customerId_label"
      }
      if ![no_customerId_label] {
        mutate {
          replace => {
            "has_resource" => "true"
          }
        }
      }
    }
  }

  if [custom_details][auditUserId] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{custom_details.auditUserId}"
        "has_user" => "true"
      }
      on_error => "no_customerid"
    }
  }

  if [custom_details][auditUserName] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{custom_details.auditUserName}"
        "has_user" => "true"
      }
      on_error => "no_customerid"
    }
  }

  if [class] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "class"
      }
      on_error => "no_class"
    }
  }

  if [custom_details][seriesId] != "" {
    mutate {
      replace => {
        "seriesId_label.key" => "seriesId"
        "seriesId_label.value" => "%{custom_details.seriesId}"
      }
      on_error => "no_seriesId"
    }
    if ![no_seriesId] {
      mutate {
        merge => {
          "security_result.detection_fields" => "seriesId_label"
        }
        on_error => "no_seriesId_label"
      }
    }
  }

  if [custom_details][errorId] != "" {
    mutate {
      replace => {
        "errorId_label.key" => "errorId"
        "errorId_label.value" => "%{custom_details.errorId}"
      }
      on_error => "no_errorId"
    }
    if ![no_errorId] {
      mutate {
        merge => {
          "security_result.detection_fields" => "errorId_label"
        }
        on_error => "no_errorId_label"
      }
    }
  }

  if [custom_details][errorCode] != "" {
    mutate {
      replace => {
        "errorCode_label.key" => "errorCode"
        "errorCode_label.value" => "%{custom_details.errorCode}"
      }
      on_error => "no_errorCode"
    }
    if ![no_errorCode] {
      mutate {
        merge => {
          "security_result.detection_fields" => "errorCode_label"
        }
        on_error => "no_errorCode_label"
      }
    }
  }

  if [custom_details][errorRemedy] != "" {
    mutate {
      replace => {
        "errorRemedy_label.key" => "errorRemedy"
        "errorRemedy_label.value" => "%{custom_details.errorRemedy}"
      }
      on_error => "no_errorRemedy"
    }
    if ![no_errorRemedy] {
      mutate {
        merge => {
          "security_result.detection_fields" => "errorRemedy_label"
        }
        on_error => "no_errorRemedy_label"
      }
    }
  }

  if [custom_details][errorReason] != "" {
    mutate {
      replace => {
        "errorReason_label.key" => "errorReason"
        "errorReason_label.value" => "%{custom_details.errorReason}"
      }
      on_error => "no_errorReason"
    }
    if ![no_errorReason] {
      mutate {
        merge => {
          "security_result.detection_fields" => "errorReason_label"
        }
        on_error => "no_errorReason_label"
      }
    }
  }

  if [severity] != "" {
    mutate {
      uppercase => ["severity"]
    }
    if [severity] in ["HIGH", "MEDIUM", "LOW", "INFORMATIONAL", "CRITICAL"] {
      mutate {
        replace => {
          "security_result.severity" => "%{severity}"
        }
        on_error => "no_severity"
      }
    }
    else if [severity] == "INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [severity] == "WARNING" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
  }

  if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_resource] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "RUBRIK POLARIS"
      "metadata.vendor_name" => "RUBRIK POLARIS"
    }
  }

  if [source] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{source}"
      }
      on_error => "no_source"
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
