# Product: DELL_EMC_NAS
# Category: Storage
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2023-07-21
# Copyright 2023 Chronicle LLC

filter {

  mutate {
    replace => {
      "ts" => ""
      "src_host" => ""
      "application" => ""
      "pid" => ""
      "src_ip" => ""
      "kv_data" => ""
      "COMMAND" => ""
      "PWD" => ""
      "TTY" => ""
      "USER" => ""
      "user" => ""
      "intermediary_ip" => ""
      "file_name" => ""
      "action_done" => ""
      "resource_type" => ""
      "status" => ""
      "method" => ""
      "event_type" => ""
      "sec_result_action" => ""
      "sec_result" => ""
      "description" => ""
      "intermediary" => ""
      "wsid" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:src_ip} %{WORD:application}\\[%{INT:pid}\\]: %{GREEDYDATA:wsid}\\|%{WORD:user}\\|%{INT}\\|%{IP:intermediary_ip}\\|%{WORD}\\|%{WORD:method}\\|%{WORD:status}\\|%{WORD:resource_type}%{GREEDYDATA}\\|%{GREEDYDATA:file_name}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:src_host} %{WORD:application}\\[(%{INT:pid})?(%{GREEDYDATA})?\\]: (%{TIMESTAMP_ISO8601} %{IP:src_ip} )?%{GREEDYDATA:wsid}\\|%{WORD:user}\\|%{INT}\\|%{IP:intermediary_ip}\\|%{WORD}\\|%{WORD:method}\\|%{GREEDYDATA:status}\\|%{INT}\\|%{WORD:resource_type}\\|%{WORD:action_done}\\|(%{INT}\\|)?%{GREEDYDATA:file_name}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:src_host} %{WORD:application}\\[(%{INT:pid})?(%{GREEDYDATA})?\\]: (%{TIMESTAMP_ISO8601})?( %{IP:src_ip} )?%{GREEDYDATA:wsid}\\|%{WORD:user}\\|%{INT}\\|%{IP:intermediary_ip}\\|%{WORD}\\|%{WORD:method}\\|%{WORD:status}\\|(%{INT}\\|)?%{WORD:resource_type}\\|(%{WORD:action_done}\\|)?(%{INT}\\|)?%{GREEDYDATA:file_name}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:src_host} %{WORD:application}\\[(%{INT:pid})?(%{GREEDYDATA})?\\]: %{TIMESTAMP_ISO8601} %{IP:src_ip} eyeglass : (command not allowed ;)?%{GREEDYDATA:kv_data}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:src_host} %{WORD:application}\\[(%{INT:pid})?(%{GREEDYDATA})?\\]: %{TIMESTAMP_ISO8601} %{IP:src_ip} %{GREEDYDATA:description}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:src_host} %{WORD:application}\\[(%{INT:pid})?(%{GREEDYDATA})?\\]: (%{TIMESTAMP_ISO8601} %{IP:src_ip} )?%{GREEDYDATA:wsid}\\|%{WORD:user}\\|%{INT}\\|%{IP:intermediary_ip}\\|%{WORD}\\|%{WORD:method}\\|%{GREEDYDATA:status}\\|%{WORD:resource_type}\\|(%{INT}\\|)?%{GREEDYDATA:file_name}"
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts} %{IPORHOST:src_host}\\(%{DATA}\\) %{DATA:application} %{INT:pid} - - %{GREEDYDATA:description},"
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts} %{IPORHOST:src_host}\\(%{DATA}\\) %{DATA:application} (%{INT:pid}|-) - - %{GREEDYDATA:description}"
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts} %{IPORHOST:src_host} %{DATA:application} (%{INT:pid}|-) - - %{GREEDYDATA:description}"
      ]
    }
    overwrite => ["ts","src_host","application","pid","src_ip","kv_data","description","user","intermediary_ip","method","status","resource_type","action_done","file_name","wsid"]
  }

  if [ts] != "" {
    date {
      match => ["ts", "MMM dd HH:mm:ss","MMM  d HH:mm:ss", "ISO8601"]
      rebase => true
      on_error => "invalid_format"
    }
    if [invalid_format] {
      date {
        match => ["ts", "ISO8601"]
        on_error => "invalid_format"
      }
    }
  }

  if [description] != "" {
    grok {
      match => {
        "description" => "%{IP:src_ip}"
      }
      on_error => "no_ip"
      overwrite => ["src_ip"]
    }
  }

  if [kv_data] != "" {
    kv {
      source => "kv_data"
      value_split => "="
      field_split => ";"
    }
  }

  if [src_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{src_host}"
      }
    }
  }

   if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }
  }

  if [intermediary_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "intermediary_ip"
      }
    }
  }

  if [pid] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{pid}"
      }
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{application}"
      }
    }
  }

  if [USER] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{USER}"
      }
    }
  }
  else if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
      }
    }
  }

  if [COMMAND] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{COMMAND}"
      }
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
    }
  }

  if [wsid] != "" {
    mutate {
      gsub => ["wsid","\\|.*",""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.windows_sid" => "%{wsid}"
      }
    }
  }

  if [resource_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.type" => "%{resource_type}"
      }
    }
  }

  if [file_name] != "" {
    mutate {
      gsub => ["file_name","\\|",""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{file_name}"
      }
    }
  }

  if [status] != "" {
    mutate {
      gsub => ["status","\\|.*",""]
    }
    mutate {
      replace => {
        "sec_result.description" => "%{method}-%{status}"
      }
    }
  }

  if [status] == "SUCCESS" {
    mutate {
      replace => {
        "sec_result_action" => "ALLOW"
      }
    }
  }
  else {
    mutate {
      replace => {
        "sec_result_action" => "BLOCK"
      }
    }
  }

  if [action_done] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{action_done}"
      }
    }
  }

  if [PWD] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{PWD}"
      }
    }
    if [message] =~ "command not allowed" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "command not allowed"
          "event_type" => "PROCESS_UNCATEGORIZED"
          "sec_result_action" => "BLOCK"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "PROCESS_OPEN"
          "sec_result_action" => "ALLOW"
        }
      }
    }
  }

  if [action_done] == "CREATED" {
    mutate {
      replace => {
        "event_type" => "FILE_CREATION"
      }
    }
  }
  else if [method] == "OPEN" {
    mutate {
      replace => {
        "event_type" => "FILE_OPEN"
      }
    }
  }
  else if [method] == "DELETE" {
    mutate {
      replace => {
        "event_type" => "FILE_DELETION"
      }
    }
  }
  else if [method] == "RENAME" {
    mutate {
      replace => {
        "event_type" => "FILE_MODIFICATION"
      }
    }
  }
  else if [method] in ["SET_SECURITY","CLOSE"] {
    mutate {
      replace => {
        "event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }

  if [sec_result_action] != "" {
    mutate {
      merge => {
        "sec_result.action" => "sec_result_action"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_SHUTDOWN"
      }
    }
  }

  mutate{
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "DELL"
      "event.idm.read_only_udm.metadata.product_name" => "DELL_EMC_NAS"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
