        "jsonPayload_format_label.key" => "Format"
        "jsonPayload_format_label.value.string_value" => "%{format}"
      }
      on_error => "format_empty"
    }
    if ![format_empty] {
      mutate {
        merge => {
          "additional.fields" => "jsonPayload_format_label"
        }
        on_error => "format_label_merge_failed"
      }
    }
  }


  if [status] != "" {
