  mutate {
    gsub => ["message","\\r\\n\\t\\t",""]
  }
  mutate {
    gsub => ["message","\\r\\n\\t",""]
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  mutate {
    gsub => ["message","message","msg"]
  }

  mutate {
    convert => {
      "records_json_failure" => "boolean"
    }
    on_error => "records_json_failure_conversion_error"
  }

  if [message] !~ "^{" {
    mutate {
      replace => {
        "records" => "{\"records\":%{message}}"
      }
      on_error => "records_empty"
    }
    json {
      source => "records"
      array_function => "split_columns"
      on_error => "records_json_failure"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "message_json_failure"
  }
  if [jsonPayload][msg] != "" {
    mutate {
      gsub => ['jsonPayload.msg', '\\\\\\"','']
    }
    grok {
      match => {
        "jsonPayload.msg" => [
          "%{DATA:time_stamp} \\[%{DATA:severity_detail}\\] \\[%{DATA}\\] \\[%{DATA}\\] %{GREEDYDATA:json_data}"
        ]
      }
      overwrite => ["time_stamp","severity_detail","json_data"]
      on_error => "grok_error"
    }

    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "msg_not_json"
    }
  }
  if [method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{method}"
      }
      on_error => "no_method"
    }
    if ![no_method] {
      mutate {
        replace => {
          "has_network_http" => "true"
        }
      }
    }
  }
  if [severity_detail] != "" {
    if [severity_detail] =~ "(?i)Info" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [severity_detail] =~ "(?i)Error" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [severity_detail] =~ "(?i)Warning" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
  }
  if [time_stamp] != "" {
    date {
      match => ["time_stamp", "yyyy-MM-dd HH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "date_fail"
    }
  }

  if [path] != "" {
    mutate {
      replace => {
        "target.url" => "%{path}"
      }
      on_error => "no_path"
    }
  }

  if [format] != "" {
    mutate {
