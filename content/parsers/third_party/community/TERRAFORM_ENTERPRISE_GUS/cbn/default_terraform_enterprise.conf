          on_error => "run_events_related_merge_failed"
        }
      }
    }
    if [data][relationships][task-stages][links][related] != "" {
      mutate {
        replace => {
          "task_stages_related_label.key" => "task-stages-links-related"
          "task_stages_related_label.value" => "%{data.relationships.task-stages.links.related}"
        }
        on_error => "task_stages_related_replace_failed"
      }
      if ![task_stages_related_replace_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "task_stages_related_label"
          }
          on_error => "task_stages_related_merge_failed"
        }
      }
    }
    if [data][relationships][policy-checks][links][related] != "" {
      mutate {
        replace => {
          "policy_checks_related_label.key" => "policy-checks-links-related"
          "policy_checks_related_label.value" => "%{data.relationships.policy-checks.links.related}"
        }
        on_error => "policy_checks_related_replace_failed"
      }
      if ![policy_checks_related_replace_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "policy_checks_related_label"
          }
          on_error => "policy_checks_related_merge_failed"
        }
      }
    }
    if [data][relationships][comments][links][related] != "" {
      mutate {
        replace => {
          "comments_related_label.key" => "comments-links-related"
          "comments_related_label.value" => "%{data.relationships.comments.links.related}"
        }
        on_error => "comments_related_replace_failed"
      }
      if ![comments_related_replace_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "comments_related_label"
          }
          on_error => "comments_related_merge_failed"
        }
      }
    }
    if [data][id] != "" and [data][type] != "" {
      mutate {
        replace => {
          "data_id_label.key" => "%{data.type}"
          "data_id_label.value" => "%{data.id}"
        }
        on_error => "data_id_replace_failed"
      }
      if ![data_id_replace_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "data_id_label"
          }
          on_error => "data_id_merge_failed"
        }
      }
    }
    if [data][links][self] != "" {
      mutate {
        replace => {
          "data_links_self_label.key" => "data-links-self"
          "data_links_self_label.value" => "%{data.links.self}"
        }
        on_error => "data_links_self_replace_failed"
      }
      if ![data_links_self_replace_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "data_links_self_label"
          }
          on_error => "data_links_self_merge_failed"
        }
      }
    }

    mutate {
      replace => {
        "metadata.vendor_name" => "TERRAFORM_ENTERPRISE"
        "metadata.product_name" => "TERRAFORM_ENTERPRISE"
      }
    }
    if [has_principal] == "true" and [has_network_http] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "NETWORK_HTTP"
        }
      }
    }
    else if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else if [has_principal_user] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    if [intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
        on_error => "intermediary_empty"
      }
    }

    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }

    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }
    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
      }
    }
    if [src] != "" {
      mutate {
        rename => {
          "src" => "event.idm.read_only_udm.src"
        }
      }
    }
    if [network] != "" {
      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
      }
    }
    if [additional] != "" {
      mutate {
        rename => {
          "additional" => "event.idm.read_only_udm.additional"
        }
      }
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "security_result_invalid"
      }
    }
    mutate {
      merge => {
      "@output" => "event"
      }
    }
  }
  else {
    if [message] != "" {
      grok {
        match => {
          "message" => [
            "%{SYSLOGTIMESTAMP:time}\\s+%{DATA}\\s+%{HOSTNAME:hostname}\\[%{INT:port}\]:\\s+%{TIMESTAMP_ISO8601:time_zone}\\s+\\[%{DATA:severity}\\]\\s+\\[%{DATA}\\]\\s+\\[%{GREEDYDATA:kv_data}\\]\\s+\\[%{DATA}\\]%{GREEDYDATA:json_format}",
            "%{SYSLOGTIMESTAMP:time}\\s+%{DATA}\\s+%{DATA}\\[%{INT}\\]:\\s+%{TIMESTAMP_ISO8601:time_zone}\\s+\\[%{DATA}\\]\\s+\\[%{DATA}\\]\\s+%{GREEDYDATA:json_format}"
          ]
        }
        overwrite => [ "time", "time_zone", "hostname" , "port" , "kv_data" , "severity" , "json_format" ]
        on_error => "grok_failure"
      }
      if [time] != "" {
        date {
          match => ["time" , "MMM dd HH:mm:ss" , "RFC3339" , "ISO8601" ]
          rebase => true
          on_error => "wrong_match_time"
        }
      }
      if [time_zone] != "" {
        date {
          match => ["time_zone" , "yyyy-MM-dd HH:mm:ss" ]
          rebase => true
          on_error => "wrong_match_time_zone"
        }
      }
      if [severity] != "" {
        if [severity] =~ "INFO" {
          mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
          }
        }
        else {
          mutate {
            replace => {
              "security_result.severity" => "%{severity}"
            }
          }
        }
      }
      if [port] != "" {
        mutate {
          rename => {
            "port" => "principal.port"
          }
          convert => {
            "principal.port" => "integer"
          }
          on_error => "port_invalid"
        }
      }
      if [hostname] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{hostname}"
            "principal.asset.hostname" => "%{hostname}"
          }
          on_error => "hostname_invalid"
        }
        mutate {
          replace => {
            "has_principal" = "true"
          }
        }
      }
    }
    kv {
      source => "kv_data"
      field_split => " "
      value_split => "="
      on_error => "not_kv"
    }
    mutate {
      replace => {
        "dd_service" => "%{dd.service}"
      }
      on_error => "dd.service_invalid"
    }
    if [dd_service] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{dd_service}"
          "principal.asset.hostname" => "%{dd_service}"
        }
        on_error => "dd_service_invalid"
      }
      mutate {
        replace => {
          "has_principal" = "true"
        }
      }
    }
    mutate {
      replace => {
        "dd_trace_id" => "%{dd.trace_id}"
      }
      on_error => "dd.trace_id_invalid"
    }
    if [dd_trace_id] != "" {
      mutate {
        replace => {
          "dd_trace_id_label.key" => "dd_trace_id"
          "dd_trace_id_label.value.string_value" => "%{dd_trace_id}"
        }
        on_error => "dd_trace_id_invalid"
      }
      if ![dd_trace_id_invalid] {
        mutate {
          merge => {
            "additional.fields" => "dd_trace_id_label"
          }
          on_error => "dd_trace_id_label_merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "dd_span_id" => "%{dd.span_id}"
      }
      on_error => "dd_span_id_id_invalid"
    }
    if [dd_span_id] != "" {
      mutate {
        replace => {
          "dd_span_id_label.key" => "dd_span_id"
          "dd_span_id_label.value.string_value" => "%{dd_span_id}"
        }
        on_error => "dd_span_id_invalid"
      }
      if ![dd_span_id_invalid] {
        mutate {
          merge => {
            "additional.fields" => "dd_span_id_label"
          }
          on_error => "dd_span_id_label_merge_failed"
        }
      }
    }
    if [json_format] != "" {
      json {
        source => "json_format"
        array_function => "split_columns"
        on_error => "not_json"
      }
      if [not_json] {
        drop {
          tag => "TAG_MALFORMED_ENCODING"
        }
      }
      if ![not_json] {
        if [resource] != "" {
          mutate {
            replace => {
              "resource_label.key" => "resource"
              "resource_label.value.string_value" => "%{resource}"
            }
            on_error => "resource_invalid"
          }
          if ![resource_invalid] {
            mutate {
              merge => {
                "additional.fields" => "resource_label"
              }
              on_error => "resource_label_merge_failed"
            }
          }
        }
        if [action] != "" {
          mutate {
            replace => {
              "action_label.key" => "action"
              "action_label.value.string_value" => "%{action}"
            }
            on_error => "action_invalid"
          }
          if ![action_invalid] {
            mutate {
              merge => {
                "additional.fields" => "action_label"
              }
              on_error => "action_label_merge_failed"
            }
          }
        }
        if [resource_id] != "" {
          mutate {
            replace => {
              "principal.resource.product_object_id" => "%{resource_id}"
            }
            on_error => "resource_id_invalid"
          }
        }
        if [organization] != "" {
          mutate {
            merge => {
              "principal.user.department" => "organization"
            }
            on_error => "organization_invalid"
          }
        }
        if [organization_id] != "" {
          mutate {
            replace => {
              "detection_fields_organization_id.key" =>
                "organization_id"
              "detection_fields_organization_id.value" =>
                "%{organization_id}"
            }
            on_error => "event_data_context_description_empty"
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "detection_fields_organization_id"
            }
            on_error => "detection_fields_organization_id_not_merged"
          }
        }
        if [actor] != "" {
          mutate {
            replace => {
              "principal.user.userid" => "%{actor}"
            }
            on_error => "actor_invalid"
          }
          mutate {
            replace => {
              "has_principal_user" = "true"
            }
          }
        }
        if [timestamp] != "" {
          date {
            match => ["timestamp", "yyyy-MM-dd HH:mm:ss.SSSSSS+Z.Z", "ISO8601", "RFC3339"]
            rebase => true
            on_error => "wrong_match"
          }
        }
        if [sha] != "" {
          mutate {
            replace => {
              "principal.file.sha1" => "%{sha}"
            }
            on_error => "sha_invalid"
          }
        }
        if [actor_ip] not in [ "", "null" ] {
          mutate {
            merge => {
              "principal.ip" => "actor_ip"
              "principal.asset.ip" => "actor_ip"
            }
            on_error => "actor_ip_invalid"
          }
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    mutate {
      replace => {
        "metadata.vendor_name" => "TERRAFORM_ENTERPRISE"
        "metadata.product_name" => "TERRAFORM_ENTERPRISE"
      }
    }
    if [has_principal] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else if [has_principal_user] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    if [event_type] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "%{event_type}"
        }
        on_error => "event_type_invalid"
      }
    }

    if [intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
        on_error => "intermediary_empty"
      }
    }

    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }

    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }
    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
      }
    }
    if [src] != "" {
      mutate {
        rename => {
          "src" => "event.idm.read_only_udm.src"
        }
      }
    }
    if [network] != "" {
      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
      }
    }
    if [additional] != "" {
      mutate {
        rename => {
          "additional" => "event.idm.read_only_udm.additional"
        }
      }
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "security_result_invalid"
      }
    }

    mutate {
      merge => {
      "@output" => "event"
      }
    }
  }
}


