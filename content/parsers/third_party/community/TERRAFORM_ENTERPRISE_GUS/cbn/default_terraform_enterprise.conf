# Google SecOps Default CBN Parser (TERRAFORM_ENTERPRISE)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/TERRAFORM_ENTERPRISE/default/terraform_enterprise.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "TERRAFORM"
      "event.idm.read_only_udm.metadata.product_name" => "TERRAFORM_ENTERPRISE"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
