# Product: CLAROTY_EMC
# Category: Cyber Security
# Supported Format: SYSLOG+KV
# Reference: N/A
# Last Updated: 2026-02-17
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "timestamp" => ""
      "temp" => ""
      "process_id" => ""
      "temp1" => ""
      "cef_version" => ""
      "vendor_name" => ""
      "product_name" => ""
      "product_version" => ""
      "security_result_category" => ""
      "event_type" => ""
      "severity" => ""
      "kv_data" => ""
      "hostname" => ""
      "CtdExternalId" => ""
      "ctdDeviceExternalId" => ""
      "CtdProtocol" => ""
      "CtdInsightsProtocol" => ""
      "CtdSourceZone" => ""
      "CtdDestinationZone" => ""
      "CtdAlertLink" => ""
      "CtdSourceIp" => ""
      "CtdDestinationIp" => ""
      "CtdSourceMac" => ""
      "CtdDestinationMac" => ""
      "CtdSourceHost" => ""
      "CtdDestinationHost" => ""
      "CtdTimeGenerated" => ""
      "CtdCategory" => ""
      "CtdSourceAssetType" => ""
      "CtdDestinationAssetType" => ""
      "CtdAlertScore" => ""
      "CtdAlertTypeId" => ""
      "CtdAlertStatus" => ""
      "CtdAlertId" => ""
      "CtdAssignedTo" => ""
      "CtdStoryId" => ""
      "CtdMitreAttackTechniqueIds" => ""
      "CtdSignatureId" => ""
      "CtdSignatureName" => ""
      "CtdSignatureCriticality" => ""
      "CtdSignatureExternalLinks" => ""
      "CtdSignaturePoweredBy" => ""
      "CtdCvePublishDate" => ""
      "CtdSite" => ""
      "CtdUser" => ""
      "CtdAction" => ""
      "CtdActionStatus" => ""
      "CtdMessage" => ""
      "CtdLogType" => ""
      "CtdEventTypeId" => ""
      "CtdInsightsProtocolVersion" => ""
      "CtdInsightUser" => ""
      "CtdInsightsSeverity" => ""
      "CtdCveId" => ""
      "CtdCveScore" => ""
      "Vulnerability" => ""
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "Security_Result" => ""
      "Network" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "month" => ""
      "date" => ""
      "year" => ""
      "time" => ""
      "event_desc" => ""
      "merged_timestamp" => ""
      "cs1" => ""
      "cs1Label" => ""
      "cs2" => ""
      "cs2Label" => ""
      "cn1Label" => ""
      "cn1" => ""
      "cn3Label" => ""
      "cn3" => ""
      "msg" => ""
      "user_email" => ""
      "user_type" => ""
      "ip_address" => ""
      "server_name" => ""
      "site_id" => ""
      "session_id" => ""
    }
  }

  if [message] != "" {
    mutate {
      gsub => ["message", " ([A-Za-z0-9]+)=", "#$1="]
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "invalid_json"
  }
  if [invalid_json] {
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %{DATA:process_id} %{DATA:temp1} CEF:%{DATA:cef_version}\\|%{DATA:vendor_name}\\|%{DATA:product_name}\\|%{DATA:product_version}\\|%{DATA:security_result_category}\\|%{DATA:event_type}\\|%{DATA:severity}\\|%{GREEDYDATA:kv_data}"
          "<%{INT}>%{MONTH:month} %{MONTHDAY:date} %{YEAR:year} %{TIME:time} %{DATA:hostname} CEF:%{INT:cef_version}\\|%{DATA:vendor_name}\\|%{DATA:product_name}\\|%{DATA:product_version}\\|%{DATA:event_type}\\|%{DATA:event_desc}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["month", "date", "year", "time", "event_desc", "timestamp", "hostname", "process_id", "temp1","cef_version", "vendor_name", "product_name", "product_version", "security_result_category", "event_type", "severity", "kv_data"]
      on_error => "grok_failed"
    }
  }
  if [event_desc] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{event_desc}"
      }
      on_error => "event_desc_replace_failed"
    }
  }
  if [kv_data] != "" {
    kv{
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "invalid_kv_data"
    }
  }
  if [msg] != "" {
    mutate {
      replace => {
        "session_id" => ""
        "target_hostname" => ""
        "target_location_name" => ""
        "site_id" => ""
      }
      on_error => "msg_replace_failed"
    }
    grok {
      match => {
        "msg" => [
          "User '%{DATA:user_email}' opened the session \\(ID: %{INT:session_id}\\) on the server '%{DATA:target_hostname}' in site '%{DATA:target_location_name}' \\(ID: %{INT:site_id}\\)",
          "User '%{EMAILADDRESS:user_email}', type '%{DATA:user_type}' logged into the system on site '%{DATA:target_location_name}' using IP address '\\[\\'%{IP:ip_address}\\'\\]\\'",
          "User '%{EMAILADDRESS:user_email}' logged off from the system on site '%{DATA:target_location_name}'",
          "User '%{EMAILADDRESS:user_email}' disconnected the server '%{NOTSPACE:server_name}' in site '%{DATA:target_location_name}' \\(ID:\\s*%{INT:site_id}\\)\\.\\sSession ID:\\s\\(ID:\\s*%{INT:session_id}\\)",
          "User '%{EMAILADDRESS:user_email}' connected to the server '%{NOTSPACE:server_name}' in site '%{DATA:target_location_name}' \\(ID: %{INT:site_id}\\). Session ID \\(ID: %{INT:session_id}\\) was created"
        ]
      }
      overwrite => ["site_id","session_id", "target_hostname", "target_location_name", "user_email", "user_type", "ip_address","server_name"]
      on_error => "msg_grok_failed"
    }
    if [session_id] != "" {
      mutate {
        replace => {
          "Network.session_id" => "%{session_id}"
        }
        on_error => "session_id_replace_failed"
      }
    }
    if [target_hostname] != "" {
      mutate {
        replace => {
          "target.hostname" => "%{target_hostname}"
          "target.asset.hostname" => "%{target_hostname}"
        }
        on_error => "target_hostname_replace_failed"
      }
      if ![target_hostname_replace_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [target_location_name] != "" {
      mutate {
        replace => {
          "target.location.name" => "%{target_location_name}"
        }
        on_error => "target_location_name_replace_failed"
      }
    }
    mutate {
      replace => {
        "Security_Result.description" => "%{msg}"
      }
      on_error => "msg_replace_failed_2"
    }
    if [site_id] != "" {
      mutate {
        convert => {
          "site_id" => "string"
        }
        on_error => "site_id_convert_failed"
      }
      mutate {
        replace => {
          "site_id_data.value" => "%{site_id}"
        }
        on_error => "site_id_replace_failed"
      }
      if ![site_id_replace_failed] {
        mutate {
          replace => {
            "site_id_data.key" => "site_id"
          }
        }
        mutate {
          merge => {
            "target.resource.attribute.labels" => "site_id_data"
          }
          on_error => "site_id_data_merge_failed"
        }
      }
    }
  }
  if [ip_address] != "" {
    mutate {
      merge => {
        "target.ip" => "ip_address"
        "target.asset.ip" => "ip_address"
      }
      on_error => "ip_address_not_present"
    }
    if ![ip_address_not_present] {
      mutate {
        replace => {
          "has_target" => "true"
        }
        on_error => "has_target_not_present"
      }
    }
  }
  if [user_type] != "" {
    mutate {
      replace => {
        "principal.administrative_domain" => "%{user_type}"
      }
      on_error => "user_type_replace_failed"
    }
  }
  if [user_email] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_email}"
      }
      on_error => "missing_user_email"
    }
  }
  if [server_name] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{server_name}"
        "target.asset.hostname" => "%{server_name}"
      }
      on_error => "server_name_not_found"
    }
    if ![server_name_not_found] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [cs2] != "" and [cs2Label] != "" {
    if [cs2Label] == "user" and [cs2] =~ "^.+@.+$" {
      mutate {
        merge => {
          "principal.user.email_addresses" => "cs2"
        }
        on_error => "cs2_label_data_failed_merge"
      }
    }
    else {
      mutate {
        replace => {
          "cs2_label_data.value.string_value" => "%{cs2}"
          "cs2_label_data.key" => "%{cs2Label}"
        }
        on_error => "cs2_label_data_failed"
      }
      if ![cs2_label_data_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "cs2_label_data"
          }
          on_error => "cs2_label_data_merge_failed"
        }
      }
    }
  }
  if [cs1] != "" and [cs1Label] != "" {
    mutate {
      replace => {
        "cs1_label_data.value.string_value" => "%{cs1}"
        "cs1_label_data.key" => "%{cs1Label}"
      }
      on_error => "cs1_label_data_failed"
    }
    if ![cs1_label_data_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs1_label_data"
        }
        on_error => "cs1_label_data_merge_failed"
      }
    }
  }

  if [cn1Label] != "" and [cn1] != "" {
    if [cn1Label] == "message_id" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{cn1}"
        }
        on_error => "cn1_label_data_failed_replace"
      }
    }
    else {
      mutate {
        replace => {
          "cn1_label_data.value.string_value" => "%{cn1}"
          "cn1_label_data.key" => "%{cn1Label}"
        }
        on_error => "cn1_label_data_failed"
      }
      if ![cn1_label_data_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "cn1_label_data"
          }
          on_error => "cn1_label_data_merge_failed"
        }
      }
    }
  }

  if [cn3] != "" and [cn3Label] != "" {
    if [cn3Label] == "category" {
      mutate {
        merge => {
          "Security_Result.category_details" => "cn3"
        }
        on_error => "cn3_label_data_merge_failed"
      }
    }
    else {
      mutate {
        replace => {
          "cn3_label_data.value.string_value" => "%{cn3}"
          "cn3_label_data.key" => "%{cn3Label}"
        }
        on_error => "cn3_label_data_failed"
      }
      if ![cn3_label_data_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "cn3_label_data"
          }
          on_error => "cn3_label_data_merge_failed"
        }
      }
    }
  }

  mutate {
    replace => {
      "merged_timestamp" => "%{year}-%{month}-%{date} %{time}"
    }
    on_error => "timestamp_replace_failed"
  }
  if [merged_timestamp] != "" {
    date {
      match => ["merged_timestamp", "yyyy-MMM-dd HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "merged_timestamp_error"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601", "LDAP", "UNIX"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "invalid_format"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
        "principal.asset.hostname" => "%{hostname}"
      }
      on_error => "hostname_repalce_failed"
    }
    if ![hostname_repalce_failed] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [process_id] != "" {
    mutate {
      replace => {
        "principal.process.product_specific_process_id" => "ID:%{process_id}"
      }
      on_error => "process_replace_failed"
    }
  }
  if [vendor_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor_name}"
      }
      on_error => "vendor_name_replace_failed"
    }
  }
  if [product_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product_name}"
      }
      on_error => "product_name_repalce_failed"
    }
  }
  if [product_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{product_version}"
      }
      on_error => "product_version_repalce_failed"
    }
  }
  if [security_result_category] != "" {
    mutate {
      merge => {
        "Security_Result.category_details" => "security_result_category"
      }
      on_error => "security_result_merge_failed"
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
      }
      on_error => "event_type_replace_failed"
    }
  }
  if [severity] != "" {
    mutate {
      replace => {
        "Security_Result.severity_details" => "%{severity}"
      }
      on_error => "severity_replace_failed"
    }
  }
  if [CtdSourceIp] != "" {
    mutate {
      merge => {
        "principal.ip" => "CtdSourceIp"
        "principal.asset.ip" => "CtdSourceIp"
      }
      on_error => "src_ip_failed"
    }
    if ![src_ip_failed] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [CtdDestinationIp] != "" {
    mutate {
      merge => {
        "target.ip" => "CtdDestinationIp"
        "target.asset.ip" => "CtdDestinationIp"
      }
      on_error => "dst_ip_failed"
    }
    if ![dst_ip_failed] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [CtdSourceMac] != "" {
    mutate {
      merge => {
        "principal.mac" => "CtdSourceMac"
        "principal.asset.mac" => "CtdSourceMac"
      }
      on_error => "principal_mac_error"
    }
    if ![principal_mac_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [CtdDestinationMac] != "" {
    mutate {
      merge => {
        "target.mac" => "CtdDestinationMac"
        "target.asset.mac" => "CtdDestinationMac"
      }
      on_error => "target_mac_error"
    }
    if ![target_mac_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [CtdSourceHost] != "" {
    mutate {
      replace => {
        "principal.asset.hostname" => "%{CtdSourceHost}"
      }
      on_error => "src_host_error"
    }
    if ![src_host_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [CtdDestinationHost] != "" {
    mutate {
      replace => {
        "target.asset.hostname" => "%{CtdDestinationHost}"
      }
      on_error => "dst_host_error"
    }
    if ![dst_host_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }


  if [CtdTimeGenerated] != "" {
    date {
      match => ["CtdTimeGenerated", "MMM dd yyyy HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_format"
    }
  }
  if [CtdMessage] != "" {
    mutate {
      replace => {
        "Security_Result.description" => "%{CtdMessage}"
      }
      on_error => "ctd_message_replace_failed"
    }
  }
  if [CtdProtocol] != ""  {
    mutate {
      replace => {
        "Network.application_protocol" => "%{CtdProtocol}"
      }
      on_error => "ctd_protocol_replace_failed"
    }
  }
  if [CtdCategory] != "" {
    mutate {
      merge => {
        "Security_Result.category_details" => "CtdCategory"
      }
      on_error => "severity_replace_failed"
    }
  }
  if [CtdSourceZone] != "" {
    mutate {
      replace => {
        "principal.asset.network_domain" => "%{CtdSourceZone}"
      }
      on_error => "no_src_source_zone"
    }
  }
  if [CtdDestinationZone] != "" {
    mutate {
      replace => {
        "target.asset.network_domain" => "%{CtdDestinationZone}"
      }
      on_error => "no_dst_source_zone"
    }
  }
  if [CtdAlertLink] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.url_back_to_product" => "%{CtdAlertLink}"
      }
      on_error => "no_alert_link"
    }
  }
  if [CtdAlertScore] != "" {
    mutate {
      replace => {
          "Security_Result.risk_score" => "%{CtdAlertScore}"
      }
      on_error => "risk_score_empty"
    }
    mutate {
      convert => {
        "Security_Result.risk_score" => "float"
      }
      on_error => "risk_score_conversion_failed"
    }
  }
  if [CtdAlertTypeId] != "" {
    mutate {
      replace => {
        "Security_Result.threat_id" => "%{CtdAlertTypeId}"
      }
      on_error => "alert_type_replace_failed"
    }
  }
  if [CtdAlertStatus] != "" {
    if [CtdAlertStatus] == "Unresolved" {
      mutate {
        replace => {
          "Security_Result.threat_status" => "ACTIVE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "Security_Result.threat_status" => "CLEARED"
        }
      }
    }
  }
  if [CtdAlertId] != "" {
    mutate {
      replace => {
        "Security_Result.threat_id" => "%{CtdAlertId}"
      }
      on_error => "alert_id_replace_failed"
    }
  }
  if [CtdAssignedTo] != "" {
    mutate {
      replace => {
        "Security_Result.rule_author" => "%{CtdAssignedTo}"
      }
      on_error => "assigned_to_replace_failed"
    }
  }
  if [CtdStoryId] != "" {
    mutate {
      replace => {
        "ctd_story_id.key" => "CtdStoryId"
        "ctd_story_id.value" => "%{CtdStoryId}"
      }
      on_error => "storyid_replace_failed"
    }
    mutate {
      merge => {
        "Security_Result.rule_labels" => "ctd_story_id"
      }
    }
  }
  if [CtdCveId] != "" {
    mutate {
      replace => {
        "Vulnerability.cve_id" => "%{CtdCveId}"
      }
      on_error => "cve_id_replace_failed"
    }
  }
  if [CtdSignatureId] != "" {
    mutate {
      replace => {
        "Vulnerability.cve_id" => "%{CtdSignatureId}"
      }
      on_error => "signature_replace_failed"
    }
  }
  if [CtdSignatureName] != "" {
    mutate {
      replace => {
        "Vulnerability.cve_description" => "%{CtdSignatureName}"
      }
    }
  }

  if [CtdSignatureCriticality] != "" {
    mutate {
      replace => {
        "Vulnerability.severity_details" => "%{CtdSignatureCriticality}"
      }
      on_error => "signature_criticality_replace_failed"
    }
  }
  if [CtdSignatureExternalLinks] != "" {
    mutate {
      replace => {
        "Vulnerability.vendor_knowledge_base_article_id" => "%{CtdSignatureExternalLinks}"
      }
      on_error => "signature_external_links_replace_failed"
    }
  }
  if [CtdSignaturePoweredBy] != "" {
    mutate {
      replace => {
        "vulnerability.vendor" => "Vendor"
        "vulnerability.name" => "%{CtdSignaturePoweredBy}"
      }
    }
  }
  if [CtdInsightsSeverity] != "" {
    mutate {
      uppercase => ["CtdInsightsSeverity"]
    }
    mutate {
      replace => {
        "Security_Result.severity" => "%{CtdInsightsSeverity}"
      }
      on_error => "security_result_merge_failed"
    }
  }
  if [CtdInsightUser] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{CtdInsightUser}"
      }
    }
  }
  if [CtdUser] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{CtdUser}"
      }
      on_error => "user_replace_failed"
    }
  }
  if [CtdActionStatus] != "" {
    mutate {
      replace => {
        "Security_Result.action_details" => "%{CtdActionStatus}"
      }
      on_error => "action_status_not_found"
    }
  }
  if [CtdLogType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.log_type" => "%{CtdLogType}"
      }
      on_error => "log_category_not_found"
    }
  }
  if [CtdEventTypeId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{CtdEventTypeId}"
      }
      on_error => "log_category_not_found"
    }
  }
  if [CtdInsightsProtocolVersion] != "" {
    mutate {
      replace => {
        "Network.application_protocol_version" => "%{CtdInsightsProtocolVersion}"
      }
      on_error => "protocol_version_not_found"
    }
  }
  if [CtdCvePublishDate] != "" {
    date {
      match => ["CtdCvePublishDate", "dd MMM yyyy"]
      target => "Vulnerability.first_found"
      on_error => "invalid_format"
    }
  }
  if [Security_Result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "Security_Result"
      }
      on_error => "security_result_merge_failed"
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [Network] != "" {
    mutate {
      rename => {
        "Network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [Vulnerability] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.asset.vulnerabilities" => "Vulnerability"
      }
      on_error => "vulnerability_merge_failed"
    }
  }
  if ([event_desc] == "Login to SRA succeeded" or [msg] =~ "connected to the server" or [msg] =~ "opened the session") and ([has_target] == "true"){
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [msg] =~ "disconnected the server" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
         "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
       }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
         "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
       }
    }
  }
  else if [has_target] == "true" {
    mutate {
      replace => {
         "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
       }
    }
  }
  else{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
