# Google SecOps Default CBN Parser (CLAROTY_EMC)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/CLAROTY_EMC/default/claroty_emc.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "CLAROTY"
      "event.idm.read_only_udm.metadata.product_name" => "CLAROTY_EMC"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
