# Product: TENABLE_AUDIT
# Category: Application server
# Supported Format: JSON
# Reference: https://developer.tenable.com/reference/audit-log-events
# Last Updated: 2024-08-08
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "extensions" => ""
      "id" => ""
      "action" => ""
      "crud" => ""
      "actor.id" => ""
      "actor.name" => ""
      "target1.id" => ""
      "target1.name" => ""
      "target1.type" => ""
      "description" => ""
      "is_anonymous" => ""
      "is_failure" => ""
      "fields" => ""
      "received" => ""
      "additional" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "security_result" => ""
      "extension_value" => ""
    }
  }
  mutate {
    gsub => ["message","target","target1"]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }
  if [id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id}"
      }
      on_error => "id_invalid"
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{action}"
      }
      on_error => "no_product_event_type"
    }
   }
  if [crud] == "c" {
    mutate {
      replace => {
        "crud" => "CREATE"
      }
      on_error => "no_crud_operation"
    }
  }
  if [crud] == "r" {
    mutate {
      replace => {
        "crud" => "READ"
      }
      on_error => "no_crud_operation"
    }
  }
  if [crud] == "u" {
    mutate {
      replace => {
        "crud" => "UPDATE"
      }
      on_error => "no_crud_operation"
    }
  }
  if [crud] == "d" {
    mutate {
      replace => {
        "crud" => "DELETE"
      }
      on_error => "no_crud_operation"
    }
  }
  mutate {
    replace => {
      "crud_label.key" => "crud"
      "crud_label.value.string_value" => "%{crud}"
    }
    on_error => "no_crud_label"
  }
  if ![no_crud_label] {
    mutate {
      merge => {
        "additional.fields" => "crud_label"
      }
      on_error => "additional_fields_merge_failure"
    }
  }
  if [actor][id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{actor.id}"
        "has_user" => "true"
      }
      on_error => "no_actor_id"
    }
  }
  if [actor][name] =~ "^.+@.+$" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "actor.name"
      }
      on_error => "no_actor_name"
    }
    if ![no_actor_name] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }
  if [target1][id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{target1.id}"
        "has_target" => "true"
        "has_target_user" => "true"
      }
      on_error => "no_target_id"
    }
  }
  if [target1][name] =~ "^.+@.+$" {
    mutate {
      merge => {
        "target.user.email_addresses" => "target1.name"
      }
      on_error => "no_target_name"
    }
    if ![no_target_name] {
      mutate {
        replace => {
          "has_target" => "true"
          "has_target_user" => "true"
        }
      }
    }
  }
  if [target1][type] != "" {
    mutate {
      replace => {
        "target.user.role_name" => "%{target1.type}"
        "has_target" => "true"
      }
      on_error => "no_target_type"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }
  if [is_anonymous] != "" {
    mutate {
      convert => {
        "is_anonymous" => "string"
      }
      on_error => "is_anonymous_convert_failed"
    }
    mutate {
      replace => {
        "is_anonymous_label.value" => "%{is_anonymous}"
        "is_anonymous_label.key" => "is_anonymous"
      }
      on_error => "no_is_anonymous"
    }
    if ![no_is_anonymous] {
      mutate {
        merge => {
          "security_result.detection_fields" => "is_anonymous_label"
        }
        on_error => "additional_fields_merge_failure"
      }
    }
  }
  if [is_failure] != "" {
    mutate {
      convert => {
        "is_failure" => "string"
      }
      on_error => "is_failure_convert_failed"
    }
    mutate {
        replace => {
        "is_failure_label.value" => "%{is_failure}"
        "is_failure_label.key" => "is_failure"
      }
        on_error => "no_is_failure"
    }
    if ![no_is_failure] {
      mutate {
        merge => {
          "security_result.detection_fields" => "is_failure_label"
        }
        on_error => "additional_fields_merge_failure"
      }
    }
  }
  if [is_failure] == "true" {
    mutate {
      merge => {
           "security_result.category" => "AUTH_VIOLOATION"
        }
      on_error => "no_security_result_category"
    }
  }
  for field in fields {
    mutate {
      replace => {
        "fields_label" => ""
        "field_name" => ""
        "field_value" => ""
        "mech_label" => "MECHANISM_OTHER"
      }
    }
    mutate {
      replace => {
        "field_value" => "%{field.value}"
      }
    }
    mutate {
      replace => {
        "field_name" => "%{field.key}"
      }
      on_error => "no_field_name"
    }
    if [field_name] == "X-Forwarded-For" {
      mutate {
       gsub => ["field_value",',','\",\"']
      }
    mutate {
      gsub => ["field_value"," ",""]
      }
    mutate {
      replace => {
        "field_value" => "{\"ips\":[\"%{field_value}\"]}"
      }
      on_error => "no_field_value"
    }
    json {
      source => "field_value"
      array_function => "split_columns"
      on_error => "invalid_field_value_json"
    }
    if ![invalid_field_value_json] {
      for ip in ips {
        mutate {
          merge => {
            "principal.ip" => "ip"
            "principal.asset.ip" => "ip"
          }
          on_error => "no_principal_ip"
        }
        if ![no_principal_ip] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
   }
    else if [field_name] == "X-Access-Type" and [field_value] == "apikey" {
      mutate {
        replace => {
          "extension_value" => "MACHINE"
        }
        merge => {
        "event.idm.read_only_udm.extensions.auth.mechanism" => "mech_label"
        }
        on_error => "no_access_type"
      }
    }
    else {
      mutate {
        replace => {
          "fields_label.value.string_value" => "%{field.value}"
          "fields_label.key" => "%{field.key}"
        }
        on_error => "no_fields_label"
      }
      mutate {
        merge => {
          "additional.fields" => "fields_label"
        }
        on_error => "additional_fields_merge_failure"
      }
    }
  }
  if [received] != "" {
    date {
      match => ["received","ISO8601","yyyy-MM-ddTHH:mm:ss.SSZ"]
      target => "metadata.event_timestamp"
      on_error => "no_event_received_time"
    }
  }
  mutate {
    replace => {
      "metadata.product_name" => "TENABLE AUDIT"
      "metadata.vendor_name" => "TENABLE"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and [has_target_user] == "true"  and ([metadata][product_event_type] =~ "user.authenticate") {
     mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [has_target_user] == "true"  and [metadata][product_event_type] =~ "user.create" {
     mutate {
      replace => {
        "metadata.event_type" => "USER_CREATION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [has_target_user] == "true"  and [metadata][product_event_type] =~ "users.delete" {
     mutate {
      replace => {
        "metadata.event_type" => "USER_DELETION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [has_target_user] == "true"  and [metadata][product_event_type] =~ "user.logout" {
     mutate {
      replace => {
        "metadata.event_type" => "USER_LOGOUT"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_user] == "true"  {
     mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [extension_value] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "%{extension_value}"
        on_error => "no_extension_value"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  if [extensions] != "" {
    mutate {
      merge => {
        "extensions" => " event.idm.read_only_udm.extensions"
      }
      on_error => "no_extensions"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

