# Product: ISC DHCP
# Category: DHCP
# Supported Format: JSON + SYSLOG + KV
# Reference: N/A
# Last Updated: 2024-11-26
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "ipaddress" => ""
      "via" => ""
      "device" => ""
      "type" => ""
      "subtype" => ""
      "Acct-Username" => ""
      "action" => ""
      "macaddress" => ""
      "Acct-NAS-IP-Address" => ""
      "Acct-Session-Id" => ""
      "Acct-NAS-Port" => ""
      "Acct-Calling-Station-Id" => ""
      "Acct-NAS-Port-Type" => ""
      "Acct-Session-Time" => ""
      "Acct-Input-Octets" => ""
      "Acct-Output-Octets" => ""
      "not_an_ip" => ""
      "trans_id" => ""
      "last_part" => ""
      "security_result" => ""
      "kv_data" => ""
      "no_match_found" => ""
      "lease_time" => ""
      "sec_desc" => ""
      "fingerprint" => ""
      "uid" => ""
      "ciaddr_present" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "pid" => ""
      "process" => ""
      "host" => ""
      "has_user" => "false"
    }
  }

  json {
    source   => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    grok {
      match => {
        "message" => [
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd.*:\\s%{GREEDYDATA:action}\\son\\s%{IPV4:ipaddress}\\s*to\\s*(%{MAC:macaddress}|)"
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd.*:\\s%{GREEDYDATA:action}\\s(to|from)\\s%{IPV4:ipaddress}\\s*(\\(%{MAC:macaddress}\\)|)\\svia\\s(%{IPV4:via}|.*)"
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd.*:\\s%{GREEDYDATA:action}\\s(for|on|of)\\s*%{IPV4:ipaddress}.*(from|to)\\s%{MAC:macaddress}\\s*(\\(%{GREEDYDATA:device}\\)|)\\s(via\\s.*relay|via)\\s(%{IPV4:via}|.*)\\s*(((:|) %{GREEDYDATA:last_part})|)"
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd.*:\\s%{GREEDYDATA:action}\\sfrom\\s%{MAC:macaddress}\\s*(\\(%{GREEDYDATA:device}\\)|)\\s(via\\s.*relay|via)\\s(%{IPV4:via}|.*)\\s*(((:|) %{GREEDYDATA:last_part})|)"
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd.*:\\s%{GREEDYDATA:action}\\s(on|to)\\s%{IPV4:ipaddress}.*:\\s%{GREEDYDATA:last_part}"
          ".*<.*>%{TIMESTAMP_ISO8601:date}\\s+%{DATA:host}\\s%{GREEDYDATA:kv_data}"
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd.*: received a %{GREEDYDATA:action} DHCP packet from relay-agent\\s(%{IPV4:via}|.*) with a circuit-id of \\\"%{MAC:macaddress}\\\".*for\\s%{IPV4:ipaddress} \\(%{GREEDYDATA:device}\\) "
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd:\\s%{DATA:sec_desc}:\\slease\\sage\\s%{INT:lease_time}%{DATA},\\s%{GREEDYDATA:last_part}\\sfor\\s%{IPV4:via}"
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd:\\s%{DATA:sec_desc}\\s%{IPV4:via}\\/%{INT:port}%{SPACE}%{GREEDYDATA:last_part}"
          ".*<.*>%{SYSLOGTIMESTAMP:date}\\s+%{GREEDYDATA:host}\\sdhcpd.*:\\s%{GREEDYDATA:last_part}"
        ]
      }
      overwrite => ["ipaddress","macaddress","device","via","action","trans_id","last_part","kv_data", "lease_time", "sec_desc","host"]
      on_error => "no_match_found"
    }
    if [no_match_found] {
      drop {
        tag => "TAG_NO_SECURITY_VALUE"
      }
    }
  }

  date {
    match => ["date", "RFC3339","MMM d HH:mm:ss","MMM  d HH:mm:ss","yyyy-MM-dd HH:mm:ss,SSS","yyyy-MM-dd HH:mm:ss,SS","yyyy-MM-dd HH:mm:ss,S"]
    rebase => true
    on_error => "date_match_failed"
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "ISC"
      "event.idm.read_only_udm.metadata.product_name" => "ISC DHCP"
      "event.idm.read_only_udm.network.dhcp.sname" => "%{host}"
      "event.idm.read_only_udm.network.application_protocol" => "DHCP"
    }
    on_error => "source_value_invalid"
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{host}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{host}"
        "has_target" => "true"
      }
      on_error => "host_invalid"
    }
  }

  grok {
    match => {
      "message" => "%{DATA:process}\\[%{INT:pid}\\]"
    }
    overwrite => ["pid","process"]
    on_error => "pid_match_failed"
  }

  if [process] != "" {
    mutate {
      replace => {
        "target.application" => "%{process}"
      }
      on_error => "process_invalid"
    }
  }

  if [pid] != "" {
    mutate {
      convert => {
        "pid" => "uinteger"
      }
      on_error => "pid_already_uinteger"
    }
    mutate {
      replace => {
        "target.process.pid" => "%{pid}"
      }
      on_error => "pid_invalid"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data",",", " "]
    }
    mutate {
      gsub => ["kv_data","RADIUS\.Acct","#Acct"]
    }
    kv {
      source => "kv_data"
      value_split => "="
      field_split => "#"
    }
  }

  if [last_part] != "" {
    grok {
      match => {
        "last_part" => [
          "%{DATA:action} from %{MAC:macaddress} %{GREEDYDATA}",
          "from %{IP:ipaddress}"
        ]
      }
      overwrite => ["action", "macaddress", "ipaddress"]
      on_error => "last_part_match_failed"
    }
    mutate {
      replace => {
        "security_result.summary" => "%{last_part}"
      }
    }
  }

  if [type]!= "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{type} %{subtype}"
      }
    }
  }

  if [message] =~ "lease-duration|lease time is" {
    grok {
      match => {
        "message" => "[\\w\\W]\\s(lease-duration|lease time is)\\s%{INT:lease_time}\\w\\W"
      }
      overwrite => ["lease_time"]
      on_error => "no_lease_time"
    }
  }

  if [lease_time] != "" {
    mutate {
      convert => {
        "lease_time" => "uinteger"
      }
      on_error => "lease_time_already_uinteger"
    }

    mutate {
      rename => {
        "lease_time" => "event.idm.read_only_udm.network.dhcp.lease_time_seconds"
      }
      on_error => "lease_time_rename_failed"
    }
  }

  if [fingerprint] != "" {
    mutate {
      convert => {
        "fingerprint" => "bytes"
      }
      on_error => "fingerprint_already_bytes"
    }

    mutate {
      rename => {
        "fingerprint" => "event.idm.read_only_udm.network.dhcp.client_identifier"
      }
      on_error => "fingerprint_invalid"
    }

  }

  if [not_json] and [message] =~ "uid|remote-id"{
    grok {
      match => {
        "message" => [
          "[\\w\\W]\\suid\\s%{GREEDYDATA:uid}\\n"
          "[\\w\\W]a remote-id of \\\"%{GREEDYDATA:uid}\\\""
        ]
      }
      overwrite => ["uid"]
      on_error => "grok_failed"
    }

    mutate {
      convert => {
        "uid" => "bytes"
      }
      on_error => "uid_alrready_bytes"
    }

    mutate {
      rename => {
        "uid" => "event.idm.read_only_udm.network.dhcp.client_identifier"
      }
      on_error => "uid_value_invalid"
    }

  }

  mutate {
    gsub => ["action","DHCP",""]
  }
  if [action] in ["DISCOVER","REQUEST","OFFER","ACK","RELEASE","DECLINE","INFORM"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.dhcp.type" => "%{action}"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.dhcp.type" => "UNKNOWN_MESSAGE_TYPE"
      }
    }
  }

  if [via] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.dhcp.giaddr" => "%{via}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "via"
        "event.idm.read_only_udm.principal.asset.ip" => "via"
      }
      on_error => "via_invalid"
    }
    if ![via_invalid] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [macaddress] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.dhcp.chaddr" => "%{macaddress}"
      }
      on_error => "macaddress_invalid"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "macaddress"
        "event.idm.read_only_udm.principal.asset.mac" => "macaddress"
      }
      on_error => "macaddress_invalid"
    }
    if ![macaddress_invalid] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [ipaddress] != "" {
    if [action] in ["REQUEST","RELEASE","DECLINE"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.dhcp.ciaddr" => "%{ipaddress}"
          "ciaddr_present" => "true"
        }
        on_error => "ipaddress_not_valid"
      }
      if [action] == "DECLINE" {
        mutate {
        replace => {
            "event.idm.read_only_udm.network.dhcp.requested_address" => "%{ipaddress}"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.dhcp.yiaddr" => "%{ipaddress}"
        }
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ipaddress"
        "event.idm.read_only_udm.principal.asset.ip" => "ipaddress"
      }
      on_error => "ipaddress_invalid"
    }
    if ![ipaddress_invalid] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [device] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.dhcp.client_hostname" => "%{device}"
      }
    }
  }

  if [Acct-Username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{Acct-Username}"
        "has_user" => "true"
      }
    }
  }

  if [Acct-NAS-IP-Address] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "Acct-NAS-IP-Address"
      }
      on_error => "Acct_NAS_IP_Address_Value_Invalid"
    }
    if ![Acct_NAS_IP_Address_Value_Invalid] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [Acct-NAS-Port] != "" {
  mutate {
    convert => {
      "Acct-NAS-Port" => "integer"
    }
  }
    mutate {
      rename => {
        "Acct-NAS-Port" => "event.idm.read_only_udm.target.port"
      }
    }
  }

  if [Acct-Session-Id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{Acct-Session-Id}"
      }
    }
  }

  if [Acct-Calling-Station-Id] != "" {
    mutate {
      replace => {
        "acct_calling_station_id.key" => "Acct-Calling-Station-Id"
        "acct_calling_station_id.value.string_value" => "%{Acct-Calling-Station-Id}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "acct_calling_station_id"
      }
    }
  }

  if [Acct-NAS-Port-Type] != "" {
    mutate {
      replace => {
        "acct_nas_port_type.key" => "Acct-NAS-Port-Type"
        "acct_nas_port_type.value.string_value" => "%{Acct-NAS-Port-Type}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "acct_nas_port_type"
      }
    }
  }

  if [Acct-Session-Time] != "" {
    mutate {
      rename => {
        "Acct-Session-Time" => "event.idm.read_only_udm.network.session_duration.seconds"
      }
      convert => {
        "event.idm.read_only_udm.network.session_duration.seconds" => "integer"
      }
    }
  }

  if [Acct-Input-Octets] != "" {
    mutate {
      replace => {
        "acct_input_octets.key" => "Acct-Input-Octets"
        "acct_input_octets.value.string_value" => "%{Acct-Input-Octets}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "acct_input_octets"
      }
    }
  }

  if [Acct-Output-Octets] != "" {
    mutate {
      replace => {
        "acct_output_octets.key" => "Acct-Output-Octets"
        "acct_output_octets.value.string_value" => "%{Acct-Output-Octets}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "acct_output_octets"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [subtype] == "wireless" and [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_NETWORK"
      }
    }
  }
  else if [action] == "RELEASE" and [ciaddr_present] == "false" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_DHCP"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
