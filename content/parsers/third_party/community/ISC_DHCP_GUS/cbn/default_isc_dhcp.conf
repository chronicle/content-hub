# Google SecOps Default CBN Parser (ISC_DHCP)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/ISC_DHCP/default/isc_dhcp.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "ISC"
      "event.idm.read_only_udm.metadata.product_name" => "ISC_DHCP"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
