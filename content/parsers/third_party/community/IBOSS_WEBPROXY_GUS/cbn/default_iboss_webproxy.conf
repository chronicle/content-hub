# Product: IBOSS Webproxy
# Category: Webproxy
# Supported Format: SYSLOG + JSON
# Reference : N/A
# Last Updated: 2023-08-22
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "sec_res" => ""
      "sec_action" => ""
      "host" => ""
      "intermediary" => ""
      "src_port" => ""
      "mac_address" => ""
      "file_name" => ""
      "targetPort" => ""
      "computer_Mac_Address" => ""
      "filtering_Group_Name" => ""
      "uri_path" => ""
      "down_stream" => ""
      "user_Agent" => ""
      "up_stream" => ""
      "ref_url" => ""
      "response_Code" => ""
      "desc" => ""
      "description" => ""
      "category_Name" => ""
      "url" => ""
      "ts" => ""
    }
  }

  mutate {
    gsub => ["message","message","msg"]
  }
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP} %{HOSTNAME:hostname} %{DATE:date} %{TIME:t} (AM|PM),URL_LOG_ENTRY,%{GREEDYDATA:kv_data}"
    }
    overwrite => ["hostname"]
    on_error => "msg_failure"
  }
  kv {
    source => "kv_data"
    field_split => ","
    value_split => "="
    on_error => "kv_failure"
  }
  if [msg_failure] and [kv_failure] {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_a_json"
    }
    if [not_a_json] {
      mutate {
        replace => {
          "_raw" => "%{message}"
        }
      }
    }

    json {
      source => "_raw"
      on_error => "raw_not_json"
    }
    if [raw_not_json] {
      grok {
        match => {
          "_raw" => "%{SYSLOGTIMESTAMP} %{HOSTNAME:hostname} %{GREEDYDATA:json_data}"
        }
        overwrite => ["hostname"]
        on_error => "raw_failure"
      }
      json {
        source => "json_data"
        on_error => "json_failure"
      }
    }
    if [raw_not_json] and [not_a_json] and [json_failure] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  mutate {
    rename => {
      "S_ACTION" => "action"
      "R_PORT" => "destinationPort"
      "PORT" => "sourcePort"
      "CATEGORIES_NAMES" => "categoryName"
      "COMP_MAC" => "computerMacAddress"
      "COMP_NAME" => "computerName"
      "DOWN_BYTES" => "downstreamByteUsage"
      "FILE_NAME" => "filename"
      "FILTERING_GROUP_NAME" => "filteringGroupName"
      "IBOSS" => "iboss"
      "IPADDR" => "ipAddress"
      "MAC_ADDRESS" => "macAddress"
      "USER" => "username"
      "USER_AGENT" => "userAgent"
      "URL_LOG_ID" => "urlLogId"
      "URL" => "url_data"
      "UP_BYTES" => "upstreamByteUsage"
      "SRC_PUBLIC_IPADDR" => "publicIp"
      "SRC_PRIVATE_IPADDR" => "privateIp"
      "SRC_IPADDR" => "sourceIpAddress"
      "RESPONSE_CODE" => "responseCode"
      "REQUEST_METHOD" => "requestMethod"
      "REFERER" => "referrerUrl"
      "DESCRIPTION" => "descrip"
      "PATH" => "uriPath"
      "DATE" => "logTime"
      "TIME" => "time"
    }
  }

  mutate {
    replace => {
      "ts" => "%{logTime} %{time}"
    }
    on_error => "ts_failure"
  }
  # Metadata
  if [ts] != "" {
    date {
      match => ["ts","yyyy-MM-dd HH:mm:ss"]
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "IBOSS Webproxy"
      "event.idm.read_only_udm.metadata.vendor_name" => "IBOSS"
      "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
    }
  }
  mutate {
    replace => {
      "desc" => "%{descrip}"
    }
    on_error => "descrip_failure"
  }
  mutate {
    replace => {
      "desc" => "%{description}"
    }
    on_error => "description_failure"
  }
  if [desc] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{desc}"
      }
    }
  }

  if [urlLogId]not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{urlLogId}"
      }
    }
  }

  # Principal
  if [sourceIpAddress] not in ["","-"] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "sourceIpAddress"
      }
    }
  }

  mutate {
    replace => {
      "src_port" => "%{sourcePort}"
    }
    on_error => "src_port_failure"
  }

  if [src_port] not in ["","-","0"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
  }

  grok {
    match => {
      "privateIp" => "%{IP:pri_ip}"
    }
    on_error => "no_pri_ip"
  }
  if ![no_pri_ip] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "pri_ip"
      }
    }
  }

  grok {
    match => {
      "publicIp" => "%{IP:pub_ip}"
    }
    on_error => "no_pub_ip"
  }
  if ![no_pub_ip] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "pub_ip"
      }
    }
  }

  mutate {
    replace => {
      "mac_address" => "%{macAddress}"
    }
    on_error => "mac_address_failure"
  }

  if [mac_address] =~ "^(([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2})$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "mac_address"
      }
    }
  }

  # Principal > User
  if [username] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{username}"
      }
    }
  }

  # Principal > Process

  mutate {
    replace => {
      "file_name" => "%{filename}"
    }
    on_error => "file_name_failure"
  }

  if [file_name] not in ["","-"] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.process.file.names" => "file_name"
      }
    }
  }

  # Principal > Asset
  mutate {
    replace => {
      "computer_Mac_Address" => "%{computerMacAddress}"
    }
    on_error => "computer_Mac_Address_failure"
  }
  if [computer_Mac_Address] =~ "^(([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2})$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.asset.mac" => "computer_Mac_Address"
      }
    }
  }

  if [computerName] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.hostname" => "%{computerName}"
        "event.idm.read_only_udm.principal.hostname" => "%{computerName}"
      }
    }
  }

  # Principal > Group
  mutate {
    replace => {
      "filtering_Group_Name" => "%{filteringGroupName}"
    }
    on_error => "filteringGroupName_failure"
  }
  if [filtering_Group_Name] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.group.group_display_name" => "%{filtering_Group_Name}"
      }
    }
  }

  # Target
  if [ipAddress] not in ["","-"] {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "ipAddress"
      }
    }
  }

  if [host] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{host}"
      }
    }
  }

  mutate {
    replace => {
      "targetPort" => "%{destinationPort}"
    }
    on_error => "destinationPort_failure"
  }

  if [targetPort] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{targetPort}"
      }
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
    }
  }

  mutate {
    replace => {
      "url" => "%{url_data}"
    }
    on_error => "url_data_failure"
  }

  if [url] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
    }
  }

  mutate {
    replace => {
      "uri_path" => "%{uriPath}"
    }
    on_error => "uriPath_failure"
  }

  if [uri_path] not in ["","-","/"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{uri_path}"
      }
    }
  }

  # Network
  mutate {
    replace => {
      "up_stream" => "%{upstreamByteUsage}"
    }
    on_error => "upstreamByteUsage_failure"
  }
  if [up_stream] not in ["","0"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{up_stream}"
      }
      convert => {
        "event.idm.read_only_udm.network.received_bytes" => "uinteger"
      }
    }
  }
  mutate {
    replace => {
      "down_stream" => "%{downstreamByteUsage}"
    }
    on_error => "downstreamByteUsage_failure"
  }

  if [down_stream] not in ["","0"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{down_stream}"
      }
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
    }
  }

  mutate {
    replace => {
      "ref_url" => "%{referrerUrl}"
    }
    on_error => "referrerUrl_failure"
  }

  if [ref_url] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{ref_url}"
      }
    }
  }

  if [requestMethod] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{requestMethod}"
      }
    }
  }

  mutate {
    replace => {
      "response_Code" => "%{responseCode}"
    }
    on_error => "responseCode_failure"
  }

  if [response_Code] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{response_Code}"
      }
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
    }
  }

  mutate {
    replace => {
      "user_Agent" => "%{userAgent}"
    }
    on_error => "userAgent_failure"
  }

  if [user_Agent] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{user_Agent}"
      }
    }
  }

  # SecurityResult
  if [action] == "Allowed" {
    mutate {
      replace => {
        "sec_action" => "ALLOW"
      }
    }
  } else if [action] == "Blocked" {
    mutate {
      replace => {
        "sec_action" => "BLOCK"
      }
    }
  }

  mutate {
    replace => {
      "category_Name" => "%{categoryName}"
    }
    on_error => "categoryName_failure"
  }

  if [category_Name] not in ["","-"] {
    mutate {
      merge => {
        "sec_res.category_details" => "category_Name"
      }
    }
  }

  # Intermediary
  if [iboss] not in ["","-"] {
    mutate {
      replace => {
        "intermediary.hostname" => "%{iboss}"
      }
    }
  }


  # Setting UDM Nouns
  if [sec_action] != "" {
    mutate {
      merge => {
        "sec_res.action" => "sec_action"
      }
    }
  }

  if [sec_res] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_res"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [host] in ["","-"] and [ipAddress] in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
