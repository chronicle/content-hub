# Product: SONICWALL_SMA
# Category: Authentication
# Supported Format: SYSLOG + KV, JSON
# Reference: N/A
# Last Updated: 2025-03-27
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "collected_ts" => ""
      "kv_data" => ""
      "intermediary" => ""
      "id" => ""
      "sn" => ""
      "time" => ""
      "vp_time" => ""
      "fw" => ""
      "pri" => ""
      "m" => ""
      "c" => ""
      "src" => ""
      "dst" => ""
      "user" => ""
      "usr" => ""
      "msg" => ""
      "agent" => ""
      "portal" => ""
      "domain" => ""
      "duration" => ""
      "bytesIn" => ""
      "bytesOut" => ""
      "bytesTotal" => ""
      "packetsIn" => ""
      "packetsTotal" => ""
      "maxThroughput" => ""
      "avgThroughput" => ""
      "rule" => ""
      "proto" => ""
      "nxClientIPAddress" => ""
      "nxClientIPv6Address" => ""
      "active" => ""
      "validated_ip" => ""
      "validated_email" => ""
      "event_type" => ""
      "metadata_product_name" => ""
      "target_user_present" => "false"
      "principal_machine_id_present" => "false"
      "target_machine_id_present" => "false"
      "principal_user_present" => "false"
      "auth_type" => ""
      "auth_mechanism" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "timestamp" => ""
      "host" => ""
      "process" => ""
      "pid" => ""
      "connection_status" => ""
      "attributes.net.host.name" => ""
      "attributes.net.host.port" => ""
      "attributes.net.host.ip" => ""
      "attributes.net.peer.name" => ""
      "attributes.net.peer.port" => ""
      "attributes.net.peer.ip" => ""
      "attributes.net.transport" => ""
      "resource_attributes.host.name" => ""
      "resource_attributes.os.type" => ""
      "attributes.chronicle_ingestion_label.Environment" => ""
      "attributes.chronicle_ingestion_label.ingestion_source" => ""
      "chronicle_log_type" => ""
      "attributes.log_type" => ""
      "description" => ""
      "host_name" => ""
      "desc" => ""
      "pam_type" => ""
      "session_type" => ""
      "status" => ""
      "user_id" => ""
      "by_user_id" => ""
      "Command" => ""
      "level" => ""
      "subsystem" => ""
      "fd" => ""
      "server" => ""
      "time_reopen" => ""
      "sec_desc" => ""
      "VirtualHost" => ""
      "StartTime" => ""
      "Src" => ""
      "User" => ""
      "Method" => ""
      "HTTPVersion" => ""
      "Request" => ""
      "Status" => ""
      "Bytes" => ""
      "PlatformPrefix" => ""
      "EquipmentId" => ""
      "ApplicationName" => ""
      "SessionKey" => ""
      "vhost" => ""
      "client_ip" => ""
      "method" => ""
      "validated_port" => ""
      "Dest" => ""
      "SrcBytes" => ""
      "DstBytes" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if ![not_json] {
    grok {
      match => {
        "body" => [
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host_name} %{DATA:process}\\[%{INT:pid}\\]: %{DATA:connection_status};%{GREEDYDATA:desc}"
        ]
      }
      overwrite => ["timestamp", "host_name","process","pid", "connection_status", "desc"]
      on_error => "header_grok_match_failed"
    }
    if [pid] != "" {
      mutate {
        replace => {
          "principal.process.pid" => "%{pid}"
        }
        on_error => "pid_invalid"
      }
    }
    if [connection_status] != "" {
      mutate {
        replace => {
          "connection_status_label.key" => "connection_status"
          "connection_status_label.value" => "%{connection_status}"
        }
        on_error => "connection_status_invalid"
      }
      if ![connection_status_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "connection_status_label"
          }
          on_error => "connection_status_label_merge_failed"
        }
      }
    }
    mutate {
      gsub => ["desc", "'", ""]
    }
    kv {
      source => "desc"
      field_split => ","
      value_split => "="
      on_error => "desc_invalid"
    }
    if ![desc_invalid] {
      if [fd] != "" {
        mutate {
          replace => {
            "fd_label.key" => "fd"
            "fd_label.value" => "%{fd}"
          }
          on_error => "fd_invalid"
        }
        if ![fd_invalid] {
          mutate {
            merge => {
              "security_result.detection_fields" => "fd_label"
            }
            on_error => "fd_label_merge_failed"
          }
        }
      }
      if [server] != "" {
        mutate {
          replace => {
            "server_label.key" => "server"
            "server_label.value" => "%{server}"
          }
          on_error => "server_invalid"
        }
        if ![server_invalid] {
          mutate {
            merge => {
              "security_result.detection_fields" => "server_label"
            }
            on_error => "server_label_merge_failed"
          }
        }
        grok {
          match => {
            "server" => [
              "%{IP:server_ip}:%{IPORHOST:server_port}"
            ]
          }
          overwrite => ["server_ip", "server_port"]
          on_error => "server_grok_failed"
        }
        if ![server_grok_failed] {
          mutate {
            merge => {
              "target.ip" => "server_ip"
              "target.asset.ip" => "server_ip"
            }
            on_error => "server_invalid"
          }
          mutate {
            replace => {
              "target_machine_id_present" => "true"
            }
          }
          mutate {
            replace => {
              "target.port" => "%{server_port}"
            }
            on_error => "peer_port_invalid"
          }
          mutate {
            convert => {
              "target.port" => "integer"
            }
            on_error => "peer_port_conversion_failed"
          }
        }
      }
      if [time_reopen] != "" {
        mutate {
          replace => {
            "time_reopen_label.key" => "time_reopen"
            "time_reopen_label.value" => "%{time_reopen}"
          }
          on_error => "time_reopen_invalid"
        }
        if ![time_reopen_invalid] {
          mutate {
            merge => {
              "security_result.detection_fields" => "time_reopen_label"
            }
            on_error => "time_reopen_label_merge_failed"
          }
        }
      }
    }
    else {
      if [desc] != "" {
        mutate {
          replace => {
            "metadata.description" => "%{desc}"
          }
          on_error => "desc_not_present"
        }
      }
    }

    if [attributes][net][host][name] not in ["","::"] {
      mutate {
        replace => {
          "principal.hostname" => "%{attributes.net.host.name}"
          "principal.asset.hostname" => "%{attributes.net.host.name}"
        }
        on_error => "host_name_invalid"
      }
      if ![host_name_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
          on_error => "host_port_invalid"
        }
      }
    }
    if [attributes][net][host][port] not in ["","::"] {
      mutate {
        replace => {
            "principal.port" => "%{attributes.net.host.port}"
        }
        on_error => "host_port_invalid"
      }
      mutate {
        convert => {
            "principal.port" => "integer"
        }
        on_error => "host_port_conversion_failed"
      }
    }
    if [attributes][net][host][ip] not in ["","::"] {
      mutate {
        replace => {
          "principal.ip" => "%{attributes.net.host.ip}"
          "principal.asset.ip" => "%{attributes.net.host.ip}"
        }
        on_error => "host_ip_invalid"
      }
      if ![host_ip_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
          on_error => "host_ip_invalid"
        }
      }
    }
    if [attributes][net][peer][name] not in ["","::"] {
      mutate {
        replace => {
          "target.hostname" => "%{attributes.net.peer.name}"
          "target.asset.hostname" => "%{attributes.net.peer.name}"
        }
        on_error => "peer_name_invalid"
      }
      if ![peer_name_invalid] {
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
          on_error => "peer_name_invalid"
        }
      }
    }
    if [attributes][net][peer][port] not in ["","::"] {
      mutate {
        replace => {
          "target.port" => "%{attributes.net.peer.port}"
        }
        on_error => "peer_port_invalid"
      }
      mutate {
        convert => {
            "target.port" => "integer"
        }
        on_error => "peer_port_conversion_failed"
      }
    }
    if [attributes][net][peer][ip] not in ["","::"] {
      mutate {
        merge => {
          "target.ip" => "attributes.net.peer.ip"
          "target.asset.ip" => "attributes.net.peer.ip"
        }
        on_error => "peer_ip_invalid"
      }
      if ![peer_ip_invalid] {
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
          on_error => "peer_ip_invalid"
        }
      }
    }
    if [attributes][net][transport] not in ["","::"] {
      mutate {
        replace => {
          "attributes_net_transport_lable.key" => "attributes_net_transport"
          "attributes_net_transport_lable.value" => "%{attributes.net.transport}"
        }
        on_error => "transport_invalid"
      }
      if ![transport_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "attributes_net_transport_lable"
          }
          on_error => "transport_label_merge_failed"
        }
      }
    }
    if [resource_attributes][host][name] not in ["","::"] {
      mutate {
        replace => {
          "intermediary.hostname" => "%{resource_attributes.host.name}"
          "intermediary.asset.hostname" => "%{resource_attributes.host.name}"
        }
        on_error => "intermediary_host_name_invalid"
      }
    }
    if [resource_attributes][os][type] not in ["","::"] {
      mutate {
        replace => {
          "intermediary.platform_version" => "%{resource_attributes.os.type}"
        }
        on_error => "intermediary_os_type_invalid"
      }
    }

    if [attributes][chronicle_ingestion_label][Environment] not in ["","::"] {
      mutate {
        replace => {
            "env_label.key" => "Environment"
            "env_label.value" => "%{attributes.chronicle_ingestion_label.Environment}"
        }
        on_error => "env_label_invalid"
      }
      if ![env_label_invalid] {
        mutate {
          merge => {
              "security_result.detection_fields" => "env_label"
          }
          on_error => "env_label_merge_failed"
        }
      }
    }
    if [attributes][chronicle_ingestion_label][ingestion_source] not in ["","::"] {
      mutate {
        replace => {
            "source_label.key" => "attributes_chronicle_ingestion_label_ingestion_source"
            "source_label.value" => "%{attributes.chronicle_ingestion_label.ingestion_source}"
        }
        on_error => "source_label_invalid"
      }
      if ![source_label_invalid] {
        mutate {
          merge => {
              "security_result.detection_fields" => "source_label"
          }
          on_error => "source_label_merge_failed"
        }
      }
    }
    if [attributes][log_type] not in ["","::"] {
      mutate {
        replace => {
            "log_type_label.key" => "log_type"
            "log_type_label.value" => "%{attributes.log_type}"
        }
        on_error => "log_type_label_invalid"
      }
      if ![log_type_label_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "log_type_label"
          }
          on_error => "log_type_label_merge_failed"
        }
      }
    }
    if [attributes][chronicle_log_type] not in ["","::"] {
      mutate {
        replace => {
          "chronicle_log_type_label.key" => "chronicle_log_type"
          "chronicle_log_type_label.value" => "%{attributes.chronicle_log_type}"
        }
        on_error => "chronicle_log_type_label_invalid"
      }
      if ![chronicle_log_type_label_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "chronicle_log_type_label"
          }
          on_error => "chronicle_log_type_label_merge_failed"
        }
      }
    }
  }
  else {
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:collected_ts},%{GREEDYDATA}SSLVPN: %{GREEDYDATA:kv_data}",
          "<%{INT}>SSLVPN: %{GREEDYDATA:kv_data}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp}\\s+%{HOSTNAME:host}\\s+%{DATA:process}\\[%{INT:pid}\\]:\\s+%{GREEDYDATA:description};%{GREEDYDATA:desc}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp}\\s+%{HOSTNAME:host}\\s+%{DATA}\:\\s+%{TIMESTAMP_ISO8601}\\s+%{DATA}\\s+%{DATA:level}\\s+\\[%{DATA:subsystem}\\]\:\\s+%{GREEDYDATA:desc}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} AMC: %{TIMESTAMP_ISO8601} %{DATA:level}\\s+%{DATA:subsystem} - %{GREEDYDATA:desc}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} %{DATA:process}\\[%{INT:pid}\\]: pam_unix\\(%{DATA:pam_type}:%{DATA:session_type}\\): session %{GREEDYDATA:desc} for user %{USERNAME:user}\\(uid=%{DATA:user_id}\\) by \\(uid=%{DATA:by_user_id}\\)"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} logserver: \\[%{GREEDYDATA}\\] %{HOSTNAME:vhost} %{DATA:client_ip} %{DATA:method} %{DATA:status} %{DATA:level}\\s+Audit\\s+%{GREEDYDATA:desc}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} %{DATA:process}\\[%{INT:pid}\\]:\\s+%{GREEDYDATA:sec_desc}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} %{GREEDYDATA:desc}"
        ]
      }
      overwrite => ["collected_ts", "kv_data", "timestamp", "host", "description", "process", "pid", "vhost", "client_ip", "method", "sec_desc", "desc", "level", "subsystem", "pam_type", "session_type", "status", "user", "user_id", "by_user_id"]
      on_error  => "header_grok_match_failed"
    }
    if [header_grok_match_failed] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
    if [pid] != "" {
      mutate {
        replace => {
          "principal.process.pid" => "%{pid}"
        }
        on_error => "pid_invalid"
      }
    }
    if [connection_status] != "" {
      mutate {
        replace => {
          "connection_status_label.key" => "connection_status"
          "connection_status_label.value" => "%{connection_status}"
        }
        on_error => "connection_status_invalid"
      }
      if ![connection_status_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "connection_status_label"
          }
          on_error => "connection_status_label_merge_failed"
        }
      }
    }
    mutate {
      gsub => ["desc", "'", ""]
    }
    mutate {
      gsub => ["desc", "(\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
    }
    mutate {
      gsub => ["desc", "\\^", ","]
    }
    kv {
      source => "desc"
      field_split => ","
      value_split => "="
      on_error => "desc_invalid"
    }
    if ![desc_invalid] {
      if [fd] != "" {
        mutate {
          replace => {
            "fd_label.key" => "fd"
            "fd_label.value" => "%{fd}"
          }
          on_error => "fd_invalid"
        }
        if ![fd_invalid] {
          mutate {
            merge => {
              "security_result.detection_fields" => "fd_label"
            }
            on_error => "fd_label_merge_failed"
          }
        }
      }
      if [server] != "" {
        mutate {
          replace => {
            "server_label.key" => "server"
            "server_label.value" => "%{server}"
          }
          on_error => "server_invalid"
        }
        if ![server_invalid] {
          mutate {
            merge => {
              "security_result.detection_fields" => "server_label"
            }
            on_error => "server_label_merge_failed"
          }
        }
        grok {
          match => {
            "server" => [
              "%{IP:server_ip}:%{IPORHOST:server_port}"
            ]
          }
          overwrite => ["server_ip", "server_port"]
          on_error => "server_grok_failed"
        }
        if ![server_grok_failed] {
          mutate {
            merge => {
              "target.ip" => "server_ip"
              "target.asset.ip" => "server_ip"
            }
            on_error => "server_invalid"
          }
          mutate {
            replace => {
              "target_machine_id_present" => "true"
            }
            on_error => "server_ip_invalid"
          }
          mutate {
            replace => {
              "target.port" => "%{server_port}"
            }
            on_error => "peer_port_invalid"
          }
          mutate {
            convert => {
              "target.port" => "integer"
            }
            on_error => "peer_port_conversion_failed"
          }
        }
      }
      if [time_reopen] != "" {
        mutate {
          replace => {
            "time_reopen_label.key" => "time_reopen"
            "time_reopen_label.value" => "%{time_reopen}"
          }
          on_error => "time_reopen_invalid"
        }
        if ![time_reopen_invalid] {
          mutate {
            merge => {
              "security_result.detection_fields" => "time_reopen_label"
            }
            on_error => "time_reopen_label_merge_failed"
          }
        }
      }
      if [VirtualHost] not in ["","-"] {
        grok {
          match => {
            "VirtualHost" => "%{IP:validated_ip_adrs}"
          }
          overwrite => ["validated_ip_adrs"]
          on_error => "VirtualHost_not_ip"
        }
        if ![VirtualHost_not_ip] {
          mutate {
            merge => {
              "target.ip" => "validated_ip_adrs"
              "target.asset.ip" => "validated_ip_adrs"
            }
            on_error => "VirtualHost_merge_failed"
          }
        }
        else {
          mutate {
            replace => {
              "target.hostname" => "%{VirtualHost}"
              "target.asset.hostname" => "%{VirtualHost}"
            }
            on_error => "VirtualHost_invalide"
          }
        }
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
        }
      }
      if [Src] != "" {
        grok {
          match => {
            "Src" => ["%{IP:validated_ip_add}:%{IPORHOST:validated_port}","%{IP:validated_ip_add}"]
          }
          overwrite => ["validated_ip_add", "validated_port"]
          on_error => "Src_not_ip"
        }
        if ![Src_not_ip] {
          mutate {
            merge => {
              "principal.ip" => "validated_ip_add"
              "principal.asset.ip" => "validated_ip_add"
            }
            on_error => "Src_merge_failed"
          }
          if ![Src_merge_failed] {
            mutate {
              replace => {
                "principal_machine_id_present" => "true"
              }
            }
          }
          if [validated_port] != "" {
            mutate {
              replace => {
                "principal.port" => "%{validated_port}"
              }
              on_error => "host_port_invalid"
            }
            mutate {
              convert => {
                "principal.port" => "integer"
              }
              on_error => "host_port_conversion_failed"
            }
          }
        }
      }
      if [Method] != "" {
        mutate {
          replace => {
            "network.http.method" => "%{Method}"
          }
          on_error => "method_invalid"
        }
      }
      if [Request] != "" {
        mutate {
          replace => {
            "target.url" => "%{Request}"
          }
          on_error => "request_invalid"
        }
      }
      if [Status] != "" {
        mutate {
          replace => {
            "network.http.response_code" => "%{Status}"
          }
          on_error => "status_invalid"
        }
        mutate {
          convert => {
            "network.http.response_code" => "integer"
          }
          on_error => "response_code_already_string"
        }
      }
      if [Bytes] != "" {
        mutate {
          rename => {
            "Bytes" => "network.received_bytes"
          }
        }
        mutate {
          convert => {
            "network.received_bytes" => "uinteger"
          }
          on_error => "bytes_already_string"
        }
      }
      if [EquipmentId] not in ["","-"] {
        grok {
          match => {
            "EquipmentId" => "%{DATA:EquipmentId}\\."
          }
          overwrite => ["EquipmentId"]
          on_error => "EquipmentId_not_valid"
        }
        mutate {
          replace => {
            "principal.process.pid" => "%{EquipmentId}"
          }
          on_error => "equipment_id_invalid"
        }
      }
      if [ApplicationName] not in ["","-"] {
        mutate {
          replace => {
            "target.application" => "%{ApplicationName}"
          }
          on_error => "application_name_invalid"
        }
      }
      if [SessionKey] not in ["","-"] {
        mutate {
          replace => {
            "network.session_id" => "%{SessionKey}"
          }
          on_error => "session_key_invalid"
        }
      }
    }
    else {
      if [desc] != "" {
        mutate {
          replace => {
            "metadata.description" => "%{desc}"
          }
          on_error => "dsec_invalid"
        }
      }
    }
    if [description] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{description}"
        }
        on_error => "dsec_invalid"
      }
    }
    if [sec_desc] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{sec_desc}"
        }
        on_error => "sec_desc_invalid"
      }
    }
    if [pam_type] != "" {
      mutate {
        replace => {
          "pam_type_label.key" => "pam_type"
          "pam_type_label.value" => "%{pam_type}"
        }
        on_error => "pam_type_invalid"
      }
      if ![pam_type_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "pam_type_label"
          }
          on_error => "pam_type_label_merge_failed"
        }
      }
    }
    if [session_type] != "" {
      mutate {
        replace => {
          "session_type_label.key" => "session_type"
          "session_type_label.value" => "%{session_type}"
        }
        on_error => "session_type_invalid"
      }
      if ![session_type_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "session_type_label"
          }
          on_error => "session_type_label_merge_failed"
        }
      }
    }
    if [status] != "" {
      mutate {
        replace => {
          "status_label.key" => "status"
          "status_label.value" => "%{status}"
        }
        on_error => "status_invalid"
      }
      if ![status_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "status_label"
          }
          on_error => "status_label_merge_failed"
        }
      }
    }
    if [user] != "" {
      mutate {
        replace => {
          "principal.user.user_display_name" => "%{user}"
          "principal_user_present" => "true"
        }
        on_error => "user_invalid"
      }
    }
    if [User] != "" {
      mutate {
        replace => {
          "principal.user.user_display_name" => "%{User}"
          "principal_user_present" => "true"
        }
        on_error => "user_invalid"
      }
    }
    if [user_id] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{user_id}"
          "principal_user_present" => "true"
        }
        on_error => "user_id_invalid"
      }
    }
    if [by_user_id] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{by_user_id}"
          "target_user_present" => "true"
        }
        on_error => "by_user_id_invalid"
      }
    }
    if [Command] != "" {
      grok {
        match => {
          "Command" => "%{DATA}:%{GREEDYDATA:Command}"
        }
        overwrite => ["Command"]
        on_error => "Command_invalid"
      }
      if [Command] in ["TCP","UDP"]{
        mutate {
          replace => {
            "network.ip_protocol" => "%{Command}"
          }
          on_error => "Command_invalid"
        }
      }
    }
    if [level] != "" {
      mutate {
        replace => {
          "level_label.key" => "level"
          "level_label.value" => "%{level}"
        }
        on_error => "level_invalid"
      }
      if ![level_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "level_label"
          }
          on_error => "level_label_merge_failed"
        }
      }
    }
    if [subsystem] != "" {
      mutate {
        replace => {
          "subsystem_label.key" => "subsystem"
          "subsystem_label.value" => "%{subsystem}"
        }
        on_error => "subsystem_invalid"
      }
      if ![subsystem_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "subsystem_label"
          }
          on_error => "subsystem_label_merge_failed"
        }
      }
    }
    if [Dest] != "" {
      grok {
        match => {
          "Dest" => [
            "%{IP:dest_ip}:%{IPORHOST:dest_port}"
          ]
        }
        overwrite => ["dest_ip", "dest_port"]
        on_error => "server_grok_failed"
      }
      if ![server_grok_failed] {
        mutate {
          merge => {
            "target.ip" => "dest_ip"
            "target.asset.ip" => "dest_ip"
          }
          on_error => "server_invalid"
        }
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
          on_error => "dest_ip_invalid"
        }
        mutate {
          replace => {
            "target.port" => "%{dest_port}"
          }
          on_error => "peer_port_invalid"
        }
        mutate {
          convert => {
            "target.port" => "integer"
          }
          on_error => "peer_port_conversion_failed"
        }
      }
    }
    if [collected_ts] != "" {
      date {
        match => ["collected_ts", "ISO8601"]
        target => "metadata.collected_timestamp"
        on_error => "date_match_failed"
      }
    }
    if [kv_data] != "" {
      mutate {
        replace => {
          "kv_data" => "%{kv_data} "
        }
        on_error => "kv_data_not_found"
      }
      mutate {
        gsub => ["kv_data", '\"', ""]
      }
      mutate {
        gsub => ["kv_data", "useMCD=", "useMCD:"]
      }
      mutate {
        gsub => ["kv_data", "=([()\\w_.@\\s;,:-]+) ", "=$1#"]
      }
      kv {
        source => "kv_data"
        field_split => "#"
        value_split => "="
        on_error => "kv_data_invalid"
      }
    }
    if [time] != "" {
      date {
        match => ["time", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
        target => "metadata.event_timestamp"
        on_error => "date_match_failed_2"
      }
    }
    if [sn] != "" {
      mutate {
        replace => {
          "principal.resource.product_object_id" => "%{sn}"
        }
        on_error => "sn_invalid"
      }
    }
    if [src] != "" {
      grok {
        match => {
          "src" => "%{IP:validated_ip}"
        }
        overwrite => ["validated_ip"]
        on_error => "src_not_ip"
      }
      if ![src_not_ip] {
        mutate {
          merge => {
            "principal.ip" => "validated_ip"
            "principal.asset.ip" => "validated_ip"
          }
          on_error => "src_merge_failed"
        }
        if ![src_merge_failed] {
          mutate {
            replace => {
              "principal_machine_id_present" => "true"
            }
          }
        }
      }
    }
    if [nxClientIPAddress] != "" {
      grok {
        match => {
          "nxClientIPAddress" => "%{IP:validated_ip}"
        }
        overwrite => ["validated_ip"]
        on_error => "nxClientIPAddress_not_ip"
      }
      if ![nxClientIPAddress_not_ip] {
        mutate {
          merge => {
            "principal.ip" => "validated_ip"
            "principal.asset.ip" => "validated_ip"
          }
          on_error => "nxClientIPAddress_merge_failed"
        }
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
        }
      }
    }
    if [nxClientIPv6Address] != "" {
      grok {
        match => {
          "nxClientIPv6Address" => "%{IP:validated_ip}"
        }
        overwrite => ["validated_ip"]
        on_error => "nxClientIPv6Address_not_ip"
      }
      if ![nxClientIPv6Address_not_ip] {
        mutate {
          merge => {
            "principal.ip" => "validated_ip"
            "principal.asset.ip" => "validated_ip"
          }
          on_error => "nxClientIPv6Address_merge_failed"
        }
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
        }
      }
    }

    if [dst] != "" {
      grok {
        match => {
          "dst" => "%{IP:validated_ip}"
        }
        overwrite => ["validated_ip"]
        on_error => "dst_not_ip"
      }
      if ![dst_not_ip] {
        mutate {
          merge => {
            "target.ip" => "validated_ip"
            "target.asset.ip" => "validated_ip"
          }
          on_error => "dst_merge_failed"
        }
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
        }
      }
      else {
        mutate {
          replace => {
            "metadata_product_name" => "%{dst}"
          }
          on_error => "dst_invalid"
        }
      }
    }
    if [fw] != "" {
      grok {
        match => {
          "fw" => "%{IP:validated_ip}"
        }
        overwrite => ["validated_ip"]
        on_error => "fw_not_ip"
      }
      if ![fw_not_ip] {
        mutate {
          merge => {
            "target.ip" => "validated_ip"
            "target.asset.ip" => "validated_ip"
          }
          on_error => "fw_merge_failed"
        }
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
        }
      }
    }
    if [user] == "" and [usr] != "" {
      mutate {
        replace => {
          "user" => "%{usr}"
        }
        on_error => "usr_not_found"
      }
    }
    if [user] != ""{
      mutate {
        replace => {
          "target.user.userid" => "%{user}"
          "target_user_present" => "true"
        }
        on_error => "user_invalid"
      }
      grok {
        match => {
          "user" => "%{EMAILADDRESS:validated_email}"
        }
        overwrite => ["validated_email"]
        on_error => "user_not_email"
      }
      if ![user_not_email] {
        mutate {
          merge => {
            "target.user.email_addresses" => "validated_email"
          }
          on_error => "validated_email_merge_failed"
        }
      }
    }
    if [domain] != "" {
      mutate {
        replace => {
          "domain_label.key" => "domain"
          "domain_label.value" => "%{domain}"
        }
        on_error => "domain_invalid"
      }
      if ![domain_invalid] {
        mutate {
          merge => {
            "target.user.attribute.labels" => "domain_label"
          }
          on_error => "domain_label_merge_failed"
        }
      }
    }
    if [portal] != "" {
      mutate {
        replace => {
          "target.application" => "%{portal}"
        }
        on_error => "portal_invalid"
      }
    }
    if [agent] != "" {
      mutate {
        replace => {
          "network.http.user_agent" => "%{agent}"
        }
        on_error => "user_agent_invalid"
      }
      mutate {
        convert => {
          "agent" => "parseduseragent"
        }
        on_error => "user_agent_conversion_failed"
      }
      mutate {
        rename => {
          "agent" => "network.http.parsed_user_agent"
        }
        on_error => "no_parsed_user_agent"
      }
    }
    if [duration] != "" {
      mutate {
        replace => {
          "network.session_duration.seconds" => "%{duration}"
        }
        on_error => "duration_invalid"
      }
      mutate {
        convert => {
          "network.session_duration.seconds" => "integer"
        }
        on_error => "duration_conversion_failed"
      }
    }
    if [bytesIn] != "" {
      mutate {
        replace => {
          "network.received_bytes" => "%{bytesIn}"
        }
        on_error => "bytesIn_invalid"
      }
      mutate {
        convert => {
          "network.received_bytes" => "uinteger"
        }
        on_error => "bytesIn_conversion_failed"
      }
    }
    if [bytesOut] != "" {
      mutate {
        replace => {
          "network.sent_bytes" => "%{bytesOut}"
        }
        on_error => "bytesOut_invalid"
      }
      mutate {
        convert => {
          "network.sent_bytes" => "uinteger"
        }
        on_error => "bytesOut_conversion_failed"
      }
    }
    if [SrcBytes] != "" {
      mutate {
        replace => {
          "network.received_bytes" => "%{SrcBytes}"
        }
        on_error => "SrcBytes_invalid"
      }
      mutate {
        convert => {
          "network.received_bytes" => "uinteger"
        }
        on_error => "SrcBytes_conversion_failed"
      }
    }
    if [DstBytes] != "" {
      mutate {
        replace => {
          "network.sent_bytes" => "%{DstBytes}"
        }
        on_error => "DstBytes_invalid"
      }
      mutate {
        convert => {
          "network.sent_bytes" => "uinteger"
        }
        on_error => "DstBytes_conversion_failed"
      }
    }
    if [id] != "" {
      mutate {
        replace => {
          "id_label.key" => "network app_protocol id"
          "id_label.value.string_value" => "%{id}"
        }
        on_error => "id_invalid"
      }
      if ![id_invalid] {
        mutate {
          merge => {
            "additional.fields" => "id_label"
          }
          on_error => "id_label_merge_failed"
        }
      }
    }
    if [vp_time] != "" {
      mutate {
        replace => {
          "vp_time_label.key" => "vp_time"
          "vp_time_label.value.string_value" => "%{vp_time}"
        }
        on_error => "vp_time_invalid"
      }
      if ![vp_time_invalid] {
        mutate {
          merge => {
            "additional.fields" => "vp_time_label"
          }
          on_error => "vp_time_label_merge_failed"
        }
      }
    }
    if [bytesTotal] != "" {
      mutate {
        replace => {
          "bytesTotal_label.key" => "bytesTotal"
          "bytesTotal_label.value.string_value" => "%{bytesTotal}"
        }
        on_error => "bytesTotal_invalid"
      }
      if ![bytesTotal_invalid] {
        mutate {
          merge => {
            "additional.fields" => "bytesTotal_label"
          }
          on_error => "bytesTotal_label_merge_failed"
        }
      }
    }
    if [packetsIn] != "" {
      mutate {
        replace => {
          "packetsIn_label.key" => "packetsIn"
          "packetsIn_label.value.string_value" => "%{packetsIn}"
        }
        on_error => "packetsIn_invalid"
      }
      if ![packetsIn_invalid] {
        mutate {
          merge => {
            "additional.fields" => "packetsIn_label"
          }
          on_error => "packetsIn_label_merge_failed"
        }
      }
    }
    if [packetsTotal] != "" {
      mutate {
        replace => {
          "packetsTotal_label.key" => "packetsTotal"
          "packetsTotal_label.value.string_value" => "%{packetsTotal}"
        }
        on_error => "packetsTotal_invalid"
      }
      if ![packetsTotal_invalid] {
        mutate {
          merge => {
            "additional.fields" => "packetsTotal_label"
          }
          on_error => "packetsTotal_label_merge_failed"
        }
      }
    }
    if [maxThroughput] != "" {
      mutate {
        replace => {
          "maxThroughput_label.key" => "maxThroughput"
          "maxThroughput_label.value.string_value" => "%{maxThroughput}"
        }
        on_error => "maxThroughput_invalid"
      }
      if ![maxThroughput_invalid] {
        mutate {
          merge => {
            "additional.fields" => "maxThroughput_label"
          }
          on_error => "maxThroughput_label_merge_failed"
        }
      }
    }
    if [avgThroughput] != "" {
      mutate {
        replace => {
          "avgThroughput_label.key" => "avgThroughput"
          "avgThroughput_label.value.string_value" => "%{avgThroughput}"
        }
        on_error => "avgThroughput_invalid"
      }
      if ![avgThroughput_invalid] {
        mutate {
          merge => {
            "additional.fields" => "avgThroughput_label"
          }
          on_error => "avgThroughput_label_merge_failed"
        }
      }
    }
    if [proto] != "" {
      mutate {
        replace => {
          "proto_label.key" => "proto"
          "proto_label.value.string_value" => "%{proto}"
        }
        on_error => "proto_invalid"
      }
      if ![proto_invalid] {
        mutate {
          merge => {
            "additional.fields" => "proto_label"
          }
          on_error => "proto_label_merge_failed"
        }
      }
    }
    if [active] != "" {
      mutate {
        replace => {
          "active_label.key" => "active"
          "active_label.value.string_value" => "%{active}"
        }
        on_error => "active_invalid"
      }
      if ![active_invalid] {
        mutate {
          merge => {
            "additional.fields" => "active_label"
          }
          on_error => "active_label_merge_failed"
        }
      }
    }
    if [pri] in ["0", "1", "2"] {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
      }
    }
    else if [pri] == "3" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [pri] == "4" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    else if [pri] in ["5", "6"] {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [pri] == "7" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
    if [c] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "c"
        }
        on_error => "c_merge_failed"
      }
    }
    if [msg] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "msg"
        }
        on_error => "msg_invalid"
      }
    }
    if [rule] != "" {
      mutate {
        replace => {
          "security_result.rule_name" => "%{rule}"
        }
        on_error => "rule_invalid"
      }
    }
    if [m] != "" {
      mutate {
        replace => {
          "m_label.key" => "m"
          "m_label.value" => "%{m}"
        }
        on_error => "m_invalid"
      }
      if ![m_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "m_label"
          }
          on_error => "m_label_merge_failed"
        }
      }
    }
    if [msg] =~ "(?i)(login|logged out|auto logged out)" {
      mutate {
        replace => {
          "auth_type" => "VPN"
          "auth_mechanism" => "NETWORK"
        }
      }
    }
    if [metadata_product_name] != "" {
      mutate {
        replace => {
          "metadata.product_name" => "%{metadata_product_name}"
        }
        on_error => "metadata_product_name_invalid"
      }
    }
    else {
      mutate {
        replace => {
          "metadata.product_name" => "Sonicwall Secure Mobile Access"
        }
      }
    }
    mutate {
      replace => {
        "metadata.vendor_name" => "SONICWALL_SMA"
      }
    }
    if [msg] =~ "(?i)(login)" {
      if [target_user_present] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
          }
        }
      }
    }
    else if [msg] =~ "(?i)(logged out|auto logged out)" {
      if [target_user_present] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_LOGOUT"
          }
        }
      }
    }
  }
  if [event_type] == "" {
    if [principal_machine_id_present] == "true" and [target_machine_id_present] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if ([target_user_present] == "true" or [principal_user_present] == "true") {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [principal_machine_id_present] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_value_invalid"
    }
  }

  if [auth_type] != "" and [auth_mechanism] != "" {
    mutate {
      rename => {
        "auth_type" => "event.idm.read_only_udm.extensions.auth.type"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.auth.mechanism" => "auth_mechanism"
      }
      on_error => "auth_mechanism_empty"
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
