# Product: EDGIO_WAF
# Category: Web Application Firewall
# Supported Format: JSON
# Reference: https://docs.edg.io/applications/v4/logs
# Last Updated: 2025-02-04
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "security_result" => ""
      "metadata" => ""
      "principal" => ""
      "additional" => ""
      "has_principal" => "false"
      "target" => ""
      "network" => ""
      "rule_message" => ""
      "rule_tags" => ""
      "client_country" => ""
      "client_city" => ""
      "sub_events_count" => ""
      "sub_events" => ""
      "waf_instance_name" => ""
      "waf_profile_name" => ""
      "action_type" => ""
      "waf_profile_type" => ""
      "timestamp" => ""
      "client_ip" => ""
      "server_port" => ""
      "url" => ""
      "host" => ""
      "user_agent" => ""
      "referer" => ""
      "account_number" => ""
      "uuid" => ""
      "client_tls_ja3_md5" => ""
      "_value" => ""
      "_metric" => ""
      "_metric_type" => ""
      "sourcetype" => ""
      "group" => ""
      "source" => ""
      "event_host" => ""
      "event_sourcetype" => ""
      "cribl_wp" => ""
      "env" => ""
      "log_index" => ""
      "event_source" => ""
    }
  }

  mutate {
    gsub => ["message","_time","timestamp"]
  }
  mutate {
    gsub => ["message","index","log_index"]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_error"
  }
  if [_value] != "" {
    mutate {
      convert => {
        "_value" => "string"
      }
      on_error => "value_convert_error"
    }
    mutate {
      replace => {
        "value_label.key" => "value"
        "value_label.value.string_value" => "%{_value}"
      }
      on_error => "value_label_error"
    }
    if ![value_label_error] {
      mutate {
        merge => {
          "additional.fields" => "value_label"
        }
        on_error => "value_label_error"
      }
    }
  }
  if [_metric] != "" {
    mutate {
      replace => {
        "metric_label.key" => "metric"
        "metric_label.value.string_value" => "%{_metric}"
      }
      on_error => "metric_label_error"
    }
    if ![metric_label_error] {
      mutate {
        merge => {
          "additional.fields" => "metric_label"
        }
        on_error => "metric_label_error"
      }
    }
  }
  if [_metric_type] != "" {
    mutate {
      replace => {
        "metric_type_label.key" => "metric_type"
        "metric_type_label.value.string_value" => "%{_metric_type}"
      }
      on_error => "metric_type_label_error"
    }
    if ![metric_type_label_error] {
      mutate {
        merge => {
          "additional.fields" => "metric_type_label"
        }
        on_error => "metric_type_label_error"
      }
    }
  }
  if [sourcetype] != "" {
    mutate {
      replace => {
        "source_type_label.key" => "sourcetype"
        "source_type_label.value" => "%{sourcetype}"
      }
      on_error => "sourcetype_error"
    }
    if ![sourcetype_error] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "source_type_label"
        }
        on_error => "sourcetype_error"
      }
    }
  }
  if [group] != "" {
    mutate {
      replace => {
        "group_label.key" => "group"
        "group_label.value.string_value" => "%{group}"
      }
      on_error => "group_error"
    }
    if ![group_error] {
      mutate {
        merge => {
          "additional.fields" => "group_label"
        }
        on_error => "group_error"
      }
    }
  }
  if [source] != "" {
    mutate {
      replace => {
        "source_label.key" => "source"
        "source_label.value" => "%{source}"
      }
      on_error => "source_error"
    }
    if ![source_error] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "source_label"
        }
        on_error => "source_error"
      }
    }
  }
  if [event_source] != "" {
    mutate {
      replace => {
        "event_source_label.key" => "event_source"
        "event_source_label.value" => "%{event_source}"
      }
      on_error => "event_source_error"
    }
    if ![event_source_error] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "event_source_label"
        }
        on_error => "event_source_error"
      }
    }
  }
  if [event_host] != "" {
    mutate {
      replace => {
        "event_host_label.key" => "Event Host"
        "event_host_label.value" => "%{event_host}"
      }
      on_error => "event_host_error"
    }
    if ![event_host_error] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "event_host_label"
        }
        on_error => "event_host_error"
      }
    }
  }
  if [event_sourcetype] != "" {
    mutate {
      replace => {
        "event_sourcetype_label.key" => "event_sourcetype"
        "event_sourcetype_label.value" => "%{event_sourcetype}"
      }
      on_error => "event_sourcetype_error"
    }
    if ![event_sourcetype_error] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "event_sourcetype_label"
        }
        on_error => "event_sourcetype_error"
      }
    }
  }
  if [cribl_wp] != "" {
    mutate {
      replace => {
        "cribl_wp_label.key" => "cribl_wp"
        "cribl_wp_label.value.string_value" => "%{cribl_wp}"
      }
      on_error => "cribl_wp_error"
    }
    if ![cribl_wp_error] {
      mutate {
        merge => {
          "additional.fields" => "cribl_wp_label"
        }
        on_error => "cribl_wp_error"
      }
    }
  }
  if [env] != "" {
    mutate {
      replace => {
        "env_label.key" => "env"
        "env_label.value.string_value" => "%{env}"
      }
      on_error => "env_error"
    }
    if ![env_error] {
      mutate {
        merge => {
          "additional.fields" => "env_label"
        }
        on_error => "env_error"
      }
    }
  }
  if [log_index] != "" {
    mutate {
      replace => {
        "index_label.key" => "index"
        "index_label.value.string_value" => "%{log_index}"
      }
      on_error => "index_error"
    }
    if ![index_error] {
      mutate {
        merge => {
          "additional.fields" => "index_label"
        }
        on_error => "index_error"
      }
    }
  }
  if [rule_message] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{rule_message}"
      }
      on_error => "sec_result_error"
    }
  }
  for index,rule_tag in rule_tags {
    mutate {
      replace => {
        "value_array" => ""
      }
    }
    mutate {
      replace => {
        "value_array.string_value" => "%{rule_tag}"
      }
      on_error => "additional_supportid_empty"
    }
    mutate {
      merge => {
        "rule_tags_label.value.list_value.values" => "value_array"
      }
      on_error => "additional_supportid_not_found"
    }
  }
  if [client_country] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{client_country}"
      }
      on_error => "metadata_product_log_id_empty"
    }
  }
  if [client_city] != "" {
    mutate {
      replace => {
        "principal.location.city" => "%{client_city}"
      }
      on_error => "metadata_product_log_id_empty"
    }
  }
  if [sub_events_count] != "" {
    mutate {
      convert => {
        "sub_events_count" => "string"
      }
      on_error => "sub_events_count_error"
    }
    mutate {
      replace => {
        "sub_events_count_label.key" => "Sub Events Count"
        "sub_events_count_label.value.string_value" => "%{sub_events_count}"
      }
      on_error => "sub_events_count_error"
    }
    if ![sub_events_count_error] {
      mutate {
        merge => {
          "additional.fields" => "sub_events_count_label"
        }
        on_error => "sub_events_count_error"
      }
    }
  }
  for index,sub_event in sub_events {
    mutate {
      replace => {
        "security_result1" => ""
        "matched_on_label" => ""
        "matched_value_label" => ""
        "total_anomaly_score_label" => ""
      }
    }
    mutate {
      replace => {
        "matched_on_label.key" => "Matched On"
        "matched_on_label.value" => "%{sub_event.matched_on}"
      }
      on_error => "matched_on_label_error"
    }
    if ![matched_on_label_error] and [matched_on_label][value] != "" {
      mutate {
        merge => {
          "security_result1.detection_fields" => "matched_on_label"
        }
        on_error => "matched_on_label_error"
      }
    }
    mutate {
      replace => {
        "matched_value_label.key" => "Matched On"
        "matched_value_label.value" => "%{sub_event.matched_value}"
      }
      on_error => "matched_value_label_error"
    }
    if ![matched_value_label_error] and [matched_value_label][value] != "" {
      mutate {
        merge => {
          "security_result1.detection_fields" => "matched_value_label"
        }
        on_error => "matched_value_label_error"
      }
    }
    mutate {
      convert => {
        "sub_event.rule_id" => "string"
      }
      on_error => "rule_id_error"
    }
    mutate {
      replace => {
        "security_result1.rule_id" => "%{sub_event.rule_id}"
      }
      on_error => "security_result_rule_id_error"
    }
    mutate {
      replace => {
        "security_result1.rule_name" => "%{sub_event.rule_message}"
      }
      on_error => "security_result_rule_name_error"
    }
    mutate {
      convert => {
        "sub_event.total_anomaly_score" => "string"
      }
      on_error => "total_anomaly_score_error"
    }
    mutate {
      replace => {
        "total_anomaly_score_label.key" => "Total Anomaly Score"
        "total_anomaly_score_label.value" => "%{sub_event.total_anomaly_score}"
      }
      on_error => "total_anomaly_score_label_error"
    }
    if ![total_anomaly_score_label_error] and [total_anomaly_score_label][value] != "" {
      mutate {
        merge => {
          "security_result1.detection_fields" => "total_anomaly_score_label"
        }
        on_error => "total_anomaly_score_label_error"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result1"
      }
      on_error => "security_result_error"
    }
  }
  if [waf_instance_name] != "" {
    mutate {
      replace => {
        "waf_instance_name_label.key" => "WAF Instance Name"
        "waf_instance_name_label.value.string_value" => "%{waf_instance_name}"
      }
      on_error => "waf_instance_name_error"
    }
    if ![waf_instance_name_error] {
      mutate {
        merge => {
          "additional.fields" => "waf_instance_name_label"
        }
        on_error => "waf_instance_name_error"
      }
    }
  }
  if [waf_profile_name] != "" {
    mutate {
      replace => {
        "waf_profile_name_label.key" => "WAF Profile Name"
        "waf_profile_name_label.value.string_value" => "%{waf_profile_name}"
      }
      on_error => "waf_profile_name_error"
    }
    if ![waf_profile_name_error] {
      mutate {
        merge => {
          "additional.fields" => "waf_profile_name_label"
        }
        on_error => "waf_profile_name_error"
      }
    }
  }
  if [action_type] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action_type}"
      }
      on_error => "action_type_error"
    }
  }
  if [waf_profile_type] != "" {
    mutate {
      replace => {
        "waf_profile_type_label.key" => "WAF Profile Type"
        "waf_profile_type_label.value.string_value" => "%{waf_profile_type}"
      }
      on_error => "waf_profile_type_error"
    }
    if ![waf_profile_type_error] {
      mutate {
        merge => {
          "additional.fields" => "waf_profile_type_label"
        }
        on_error => "waf_profile_type_error"
      }
    }
  }
  mutate {
    convert => {
      "timestamp" => "string"
    }
    on_error => "timestamp_error"
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp","UNIX","UNI_MS","RFC3399","LDAP"]
      target => "metadata.event_timestamp"
      on_error => "timestamp_error"
    }
  }
  if [client_ip] != "" {
    grok {
      match => {
        "client_ip" => "%{IP:client_ip}"
      }
      overwrite => ["client_ip"]
      on_error => "client_ip_error"
    }
    if ![client_ip_error] {
      mutate {
        merge => {
          "principal.ip" => "client_ip"
          "principal.asset.ip" => "client_ip"
        }
        on_error => "client_ip_merge_error"
      }
      if ![client_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [server_port] != "" {
    mutate {
      convert => {
        "server_port" => "string"
      }
      on_error => "server_port_error"
    }
    mutate {
      replace => {
        "principal.port" => "%{server_port}"
      }
      on_error => "server_port_error"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "server_port_convert_error"
    }
  }
  if [url] != "" {
    mutate {
      replace => {
        "target.url" => "%{url}"
      }
      on_error => "url_error"
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "host_error"
    }
  }
  if [user_agent] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{user_agent}"
      }
      on_error => "user_agent_error"
    }
    mutate {
      replace => {
        "network.http.parsed_user_agent" => "%{user_agent}"
      }
      on_error => "user_agent_error"
    }
    mutate {
      convert => {
        "network.http.parsed_user_agent" => "parseduseragent"
      }
      on_error => "user_agent_convert_error"
    }
  }
  if [referer] != "" {
    mutate {
      replace => {
        "network.http.referral_url" => "%{referer}"
      }
      on_error => "referer_error"
    }
  }
  if [account_number] != "" {
    mutate {
      replace => {
        "account_number_label.key" => "Account Number"
        "account_number_label.value.string_value" => "%{account_number}"
      }
      on_error => "account_number_error"
    }
    if ![account_number_error] {
      mutate {
        merge => {
          "additional.fields" => "account_number_label"
        }
        on_error => "account_number_error"
      }
    }
  }
  if [uuid] != "" {
    mutate {
      replace => {
        "principal.asset.asset_id" => "UUID : %{uuid}"
      }
      on_error => "uuid_error"
    }
  }
  if [client_tls_ja3_md5] =~ "^[a-fA-F0-9]{32}$" {
    mutate {
      replace => {
        "network.tls.server.certificate.md5" => "%{client_tls_ja3_md5}"
      }
      on_error => "client_tls_ja3_md5_error"
    }
  }
  if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
