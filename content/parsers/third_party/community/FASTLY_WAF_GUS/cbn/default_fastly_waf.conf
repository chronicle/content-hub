        on_error => "sec_res_empty"
      }
    }
  }
  if [payload][timestamp] != "" {
    date {
      match => ["payload.timestamp", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "timestamp_not_found"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  if ([client_ip] != "" or [host] != "" or [has_principal] == "true") and ( [fastly][server] != "" or [payload][exampleRequest][serverHostname] != "" ) {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [client_ip] != "" or [host] != "" or [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Fastly WAF"
      "event.idm.read_only_udm.metadata.vendor_name" => "Fastly WAF"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
