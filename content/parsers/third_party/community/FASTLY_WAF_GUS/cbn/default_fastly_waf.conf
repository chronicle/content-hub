    grok {
      match => {
        "message_field" => [
          "^\\(%{DATA:t_user}\\)\\s+CMD\\s+\\(%{GREEDYDATA:msg_cmd}\\)$",
          "^(?P<pam_auth>[^( ]+)\\(%{DATA:p_svc}\\):\\s+%{DATA:pam_body}$",
          "^%{WORD:msg_sev}:\\s+%{GREEDYDATA:err_body}$"
        ]
      }
      overwrite => ["t_user", "msg_cmd", "pam_auth", "p_svc", "pam_body",
        "msg_sev", "err_body"]
      on_error => "message_field_grok_failure"
    }
    if [msg_cmd] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.command_line" => "%{msg_cmd}"
        }
        on_error => "syslog_msg_cmd_failure"
      }
      if ![syslog_msg_cmd_failure] {
        mutate {
          replace => {
            "has_target_process" => "true"
          }
        }
      }
    }
    if [pam_body] != "" {
      if [pam_auth] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.extensions.auth.auth_details" =>
              "%{pam_auth}"
          }
          on_error => "syslog_pam_auth_failure"
        }
      }
      grok {
        match => {
          "pam_body" => [
            "^session %{WORD:pam_op} for user %{GREEDYDATA:pam_usr}$"
          ]
        }
        overwrite => ["pam_op", "pam_usr"]
        on_error => "pam_body_grok_failure"
      }
      if [pam_usr] != "" {
        grok {
          match => {
            "pam_usr" => [
              "^%{WORD:t_user}\\(uid=%{INT:t_uid}\\) by %{GREEDYDATA:pam_by}$",
              "^%{WORD:t_user}(?:\\(uid=%{INT:t_uid}\\))?$"
            ]
          }
          overwrite => ["t_user", "t_uid", "pam_by"]
          on_error => "pam_usr_grok_failure"
        }
        if [pam_by] != "" {
          grok {
            match => {
              "pam_by" => [
                "^%{WORD:p_user}\\(uid=%{INT:p_uid}\\)$",
                "^\\(uid=%{INT:p_uid}\\)$"
              ]
            }
            overwrite => ["p_user", "p_uid"]
            on_error => "pam_by_grok_failure"
          }
        }
      }
    }
    if [t_user] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{t_user}"
        }
        on_error => "syslog_t_user_failure"
      }
      if ![syslog_t_user_failure] {
        mutate {
          replace => {
            "has_target_user" => "true"
          }
        }
      }
    }
    if [t_uid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.product_object_id" => "%{t_uid}"
        }
        on_error => "syslog_t_uid_failure"
      }
      if ![syslog_t_uid_failure] {
        mutate {
          replace => {
            "has_target_user" => "true"
          }
        }
      }
    }
    if [p_user] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{p_user}"
        }
        on_error => "syslog_p_user_failure"
      }
    }
    if [p_uid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.product_object_id" =>
            "%{p_uid}"
        }
        on_error => "syslog_p_uid_failure"
      }
    }
    if [msg_sev] != "" {
      mutate {
        replace => {
          "security_result.severity_details" => "%{msg_sev}"
        }
        on_error => "syslog_msg_sev_details_failure"
      }
      mutate {
        uppercase => ["msg_sev"]
        on_error => "syslog_msg_sev_uppercase_failure"
      }
      if [msg_sev] == "ERROR" {
        mutate {
          replace => {
            "security_result.severity" => "ERROR"
          }
        }
      }
      else if [msg_sev] in ["WARN", "WARNING"] {
        mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      }
      else if [msg_sev] in ["CRIT", "CRITICAL"] {
        mutate {
          replace => {
            "security_result.severity" => "CRITICAL"
          }
        }
      }
      else if [msg_sev] == "INFO" {
        mutate {
          replace => {
            "security_result.severity" => "INFORMATIONAL"
          }
        }
      }
    }
    if [err_body] != "" {
      grok {
        match => {
          "err_body" => [
            "^found error in file (?P<t_file>[^,\\s]+), %{GREEDYDATA}$",
            "^%{NOTSPACE:s_file}:%{INT} duplicate .* for %{NOTSPACE:t_file}$"
          ]
        }
        overwrite => ["s_file", "t_file"]
        on_error => "err_body_grok_failure"
      }
      if [s_file] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.file.full_path" => "%{s_file}"
          }
          on_error => "syslog_s_file_failure"
        }
      }
      if [t_file] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{t_file}"
          }
          on_error => "syslog_t_file_failure"
        }
      }
    }
  }
  mutate {
    rename => {
      "scheme" => "addition.scheme"
      "agentResponseCode" => "addition.agentResponseCode"
      "responseMillis" => "addition.responseMillis"
      "facility" => "addition.facility"
      "priority" => "addition.priority"
      "accept_charset" => "addition.Accept-Charset"
      "Pragma" => "addition.Pragma"
      "Accept" => "addition.Accept"
      "_export_metadata.exported_at" => "addition.exported_at"
      "p_svc" => "addition.pam_service"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "map_field" => ""
        "map_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "map_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [map_check] != "" {
      mutate {
        replace => {
          "map_field.key" => "%{key}"
        }
        on_error => "addition_map_field_key_error"
      }
      if [key] == "serverName" {
        mutate {
          replace => {
            "map_field.value" => "%{map_check}"
          }
          on_error => "target_resource_map_val_error"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" =>
              "map_field"
          }
          on_error => "target_resource_addition_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "map_field.value.string_value" => "%{map_check}"
          }
          on_error => "addition_map_field_replace_error"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "map_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }

  if ([client_ip] != "" or [host] != "" or [has_principal] == "true") and ([fastly][server] != "" or [payload][exampleRequest][serverHostname] != "" or [has_target_hostname] == "true" or [has_target_ip] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target_process] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"
      }
    }
  }
  else if [has_target_user] == "true" and [pam_op] == "opened" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
      }
    }
  }
  else if [has_target_user] == "true" and [pam_op] == "closed" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
      }
    }
  }
  else if [client_ip] != "" or [host] != "" or [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Fastly WAF"
      "event.idm.read_only_udm.metadata.vendor_name" => "Fastly WAF"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
