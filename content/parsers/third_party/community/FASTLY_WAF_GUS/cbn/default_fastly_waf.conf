# Product: Fastly
# Category: WAF
# Supported Format: JSON
# Reference: https://docs.fastly.com/en/guides/fastly-waf-logging
# Last Updated: 2025-05-08
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "client_ip" => ""
      "cache_status" => ""
      "connection.fastly_is_edge" => ""
      "connection.fastly_is_shield" => ""
      "fastly.service_id" => ""
      "fastly.server" => ""
      "host" => ""
      "url" => ""
      "request_id" => ""
      "request_method" => ""
      "connection.request_tls_version" => ""
      "status" => ""
      "geo.city" => ""
      "geo.country" => ""
      "geo.region" => ""
      "geo.location" => ""
      "response_state" => ""
      "response_status" => ""
      "request_headers.referer" => ""
      "request_headers.user_agent" => ""
      "request_headers.accept_language" => ""
      "request_headers.accept_charset" => ""
      "response_headers.cache_control" => ""
      "response_headers.content_type" => ""
      "security_result" => ""
      "security_result_action" => ""
      "timestamp" => ""
      "rule_id" => ""
      "severity" => ""
      "anomaly_score" => ""
      "waf_message" => ""
      "waf.rule_id" => ""
      "waf.severity" => ""
      "waf.message" => ""
      "waf.blocked" => ""
      "waf.executed" => ""
      "waf.failures" => ""
      "waf.logged" => ""
      "waf.score.anomaly" => ""
      "waf.score.http_violation" => ""
      "waf.score.lfi" => ""
      "waf.score.php_injection" => ""
      "waf.score.rce" => ""
      "waf.score.rfi" => ""
      "waf.score.session_fixation" => ""
      "waf.score.sql_injection" => ""
      "waf.score.xss" => ""
      "size_bytes.request_header" => ""
      "size_bytes.response_header" => ""
      "Content_Length" => ""
      "Keep-Alive" => ""
      "Content-Type" => ""
      "Accept_Language" => ""
      "CDN_Loop" => ""
      "Cloud-WAF-Key" => ""
      "Fastly_Client" => ""
      "Fastly_Orig_Accept_Encoding" => ""
      "Fastly_SSL" => ""
      "RL_orig_url" => ""
      "User_Agent" => ""
      "X_Cloud_Trace_Context" => ""
      "X_Forwarded_For" => ""
      "X_Forwarded_Server" => ""
      "X_Timer" => ""
      "X_Varnish" => ""
      "fastly_csi_request_id" => ""
      "x-request-id" => ""
      "x_sigsci_tlscipher" => ""
      "x_sigsci_tlsprotocol" => ""
      "x_sigsci_traceid" => ""
      "link" => ""
      "payload.action" => ""
      "payload.remoteCountryCode" => ""
      "payload.type" => ""
      "payload.timestamp" => ""
      "payload.id" => ""
      "payload.source" => ""
      "headersIn" => ""
      "headersOut" => ""
      "Host" => ""
      "Via" => ""
      "created" => ""
      "has_principal" => "false"
      "payload.exampleRequest.serverHostname" => ""
      "payload.exampleRequest.method" => ""
      "payload.exampleRequest.path" => ""
      "payload.exampleRequest.responseCode" => ""
      "payload.exampleRequest.protocol" => ""
      "payload.exampleRequest.id" => ""
      "proto" => ""
      "proto_version" => ""
      "type" => ""
      "payload.exampleRequest.responseMillis" => ""
      "payload.exampleRequest.responseSize" => ""
      "payload.exampleRequest.tags" => ""
      "payload.exampleRequest.remoteIP" => ""
      "Connection" => ""
    }
  }
  mutate {
    gsub => ["message", "\\r\\n", ""]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_failure"
  }

  if [json_parse_failure] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601"]
    }
  }

  if [client_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "client_ip"
      }
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
      }
    }
  }

  if [geo][country] != "" {
    mutate {
      rename => {
        "geo.country" => "event.idm.read_only_udm.principal.location.country_or_region"
      }
      on_error => "country_not_found"
    }
  }

  if [geo][region] != "" {
    mutate {
      rename => {
        "geo.region" => "event.idm.read_only_udm.principal.location.state"
      }
    }
  }

  if [geo][city] != "" {
    mutate {
      rename => {
        "geo.city" => "event.idm.read_only_udm.principal.location.city"
      }
    }
  }

  if [geo][location] != "" {
    grok {
      match => {
        "geo.location" => "%{NOTSPACE:latitude},\\s+%{NOTSPACE:longitude}"
      }
    }

    mutate {
      rename => {
        "longitude" => "event.idm.read_only_udm.principal.location.region_longitude"
        "latitude" => "event.idm.read_only_udm.principal.location.region_latitude"
      }
    }

    mutate {
      convert => {
        "event.idm.read_only_udm.principal.location.region_longitude" => "float"
        "event.idm.read_only_udm.principal.location.region_latitude" => "float"
      }
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
    }
  }

  if [fastly][server] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{fastly.server}"
      }
    }
  }

  if [cache_status] != "" {
    mutate {
      replace => {
        "cache_status_field.key" => "cache_status"
        "cache_status_field.value.string_value" => "%{cache_status}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "cache_status_field"
      }
    }
  }

  if [response_state] != "" {
    mutate {
      replace => {
        "response_state_field.key" => "response_state"
        "response_state_field.value.string_value" => "%{response_state}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "response_state_field"
      }
    }
  }

  if [request_headers][accept_charset] != "" {
    mutate {
      replace => {
        "accept_charset_field.key" => "accept_charset"
        "accept_charset_field.value.string_value" => "%{request_headers.accept_charset}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "accept_charset_field"
      }
    }
  }

  if [request_headers][accept_language] != "" {
    mutate {
      replace => {
        "accept_language_field.key" => "accept_language"
        "accept_language_field.value.string_value" => "%{request_headers.accept_language}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "accept_language_field"
      }
    }
  }


  if [response_headers][cache_control] != "" {
    mutate {
      replace => {
        "cache_control_field.key" => "cache_control"
        "cache_control_field.value.string_value" => "%{response_headers.cache_control}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "cache_control_field"
      }
    }
  }

  if [response_headers][content_type] != "" {
    mutate {
      replace => {
        "content_type_field.key" => "content_type"
        "content_type_field.value.string_value" => "%{response_headers.content_type}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "content_type_field"
      }
    }
  }

  if [connection][fastly_is_edge] != "" {
    mutate {
      replace => {
        "fastly_is_edge_field.key" => "fastly_is_edge"
      }
    }
    mutate {
      rename => {
        "connection.fastly_is_edge" => "fastly_is_edge_field.value.bool_value"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "fastly_is_edge_field"
      }
    }
  }

  if [connection][fastly_is_shield] != "" {
    mutate {
      replace => {
        "fastly_is_shield_field.key" => "fastly_is_shield"
      }
    }
    mutate {
      rename => {
        "connection.fastly_is_shield" => "fastly_is_shield_field.value.bool_value"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "fastly_is_shield_field"
      }
    }
  }

  if [fastly][service_id] != "" {
    mutate {
      replace => {
        "service_id_field.key" => "service_id"
        "service_id_field.value.string_value" => "%{fastly.service_id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "service_id_field"
      }
    }
  }

  if [request_method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{request_method}"
      }
    }
  }

  if [status] != "" {
    mutate {
      rename => {
        "status" => "event.idm.read_only_udm.network.http.response_code"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
    }
  }
  else if [response_status] != "" {
    mutate {
      rename => {
        "response_status" => "event.idm.read_only_udm.network.http.response_code"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
    }
  }

  if [connection][request_tls_version] != "" {
    mutate {
      rename => {
        "connection.request_tls_version" => "event.idm.read_only_udm.network.tls.version"
      }
    }
  }

  if [request_headers][referer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{request_headers.referer}"
      }
    }
  }

  if [request_headers][user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{request_headers.user_agent}"
      }
    }
  }

  if [size_bytes][request_header] != "" {
    mutate {
      rename => {
        "size_bytes.request_header" =>  "event.idm.read_only_udm.network.sent_bytes"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
    }
  }

  if [size_bytes][response_header] != "" {
    mutate {
      rename => {
        "size_bytes.response_header" =>  "event.idm.read_only_udm.network.received_bytes"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.received_bytes" => "uinteger"
      }
    }
  }

  if [waf][rule_id] != "" {
    mutate {
      convert => {
        "waf.rule_id" => "string"
      }
    }
    mutate {
      replace => {
        "security_result.rule_id" => "%{waf.rule_id}"
      }
    }
  }
  else if [rule_id] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{rule_id}"
      }
    }
  }

  if [severity] != "" {
    mutate {
      replace => {
        "waf.severity" => "%{severity}"
      }
    }

    mutate {
      convert => {
        "waf.severity" => "integer"
      }
    }
  }

  if [waf][severity] != "" {
    if [waf][severity] <= 3 {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    else if [waf][severity] > 3 and [waf][severity] <= 6 {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else if [waf][severity] > 6 and [waf][severity] <= 8 {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }

    mutate {
      convert => {
        "waf.severity" => "string"
      }
    }

    mutate {
      replace => {
        "security_result.severity_details" => "%{waf.severity}"
      }
    }
  }

  if [waf][blocked] == false {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }
  else if [waf][blocked] == true {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
  }

  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
    }
  }

  if [waf][executed] != "" {
    mutate {
      convert => {
        "waf.executed" => "string"
      }
    }

    mutate {
      replace => {
        "executed_label.key" => "executed"
        "executed_label.value" => "%{waf.executed}"
      }
      merge => {
        "security_result.detection_fields" => "executed_label"
      }
    }
  }

  if [waf][score][anomaly] != 0 and [waf][score][anomaly] != "" {
    mutate {
      convert => {
        "waf.score.anomaly" => "string"
      }
    }

    mutate {
      replace => {
        "anomaly_label.key" => "anomaly"
        "anomaly_label.value" => "%{waf.score.anomaly}"
      }
      merge => {
        "security_result.detection_fields" => "anomaly_label"
      }
    }
  }
  else if [anomaly_score] not in [ "", "0" ] {
    mutate {
      replace => {
        "anomaly_label.key" => "anomaly"
        "anomaly_label.value" => "%{anomaly_score}"
      }
      merge => {
        "security_result.detection_fields" => "anomaly_label"
      }
    }
  }

  if [waf][score][http_violation] != 0 and [waf][score][http_violation] != "" {
    mutate {
      convert => {
        "waf.score.http_violation" => "string"
      }
    }

    mutate {
      replace => {
        "http_violation_label.key" => "http_violation"
        "http_violation_label.value" => "%{waf.score.http_violation}"
      }
      merge => {
        "security_result.detection_fields" => "http_violation_label"
      }
    }
  }

  if [waf][score][lfi] != 0 and [waf][score][lfi] != "" {
    mutate {
      convert => {
        "waf.score.lfi" => "string"
      }
    }

    mutate {
      replace => {
        "lfi_label.key" => "lfi"
        "lfi_label.value" => "%{waf.score.lfi}"
      }
      merge => {
        "security_result.detection_fields" => "lfi_label"
      }
    }
  }

  if [waf][score][php_injection] != 0 and [waf][score][php_injection] != "" {
    mutate {
      convert => {
        "waf.score.php_injection" => "string"
      }
    }

    mutate {
      replace => {
        "php_injection_label.key" => "php_injection"
        "php_injection_label.value" => "%{waf.score.php_injection}"
      }
      merge => {
        "security_result.detection_fields" => "php_injection_label"
      }
    }
  }

  if [waf][score][xss] != 0 and [waf][score][xss] != "" {
    mutate {
      convert => {
        "waf.score.xss" => "string"
      }
    }

    mutate {
      replace => {
        "xss_label.key" => "xss"
        "xss_label.value" => "%{waf.score.xss}"
      }
      merge => {
        "security_result.detection_fields" => "xss_label"
      }
    }
  }

  if [waf][score][rce] != 0 and [waf][score][rce] != "" {
    mutate {
      convert => {
        "waf.score.rce" => "string"
      }
    }

    mutate {
      replace => {
        "rce_label.key" => "rce"
        "rce_label.value" => "%{waf.score.rce}"
      }
      merge => {
        "security_result.detection_fields" => "rce_label"
      }
    }
  }

  if [waf][score][rfi] != 0 and [waf][score][rfi] != "" {
    mutate {
      convert => {
        "waf.score.rfi" => "string"
      }
    }

    mutate {
      replace => {
        "rfi_label.key" => "rfi"
        "rfi_label.value" => "%{waf.score.rfi}"
      }
      merge => {
        "security_result.detection_fields" => "rfi_label"
      }
    }
  }

  if [waf][score][session_fixation] != 0 and [waf][score][session_fixation] != "" {
    mutate {
      convert => {
        "waf.score.session_fixation" => "string"
      }
    }

    mutate {
      replace => {
        "session_fixation_label.key" => "session_fixation"
        "session_fixation_label.value" => "%{waf.score.session_fixation}"
      }
      merge => {
        "security_result.detection_fields" => "session_fixation_label"
      }
    }
  }

  if [waf][score][sql_injection] != 0 and [waf][score][sql_injection] != "" {
    mutate {
      convert => {
        "waf.score.sql_injection" => "string"
      }
    }

    mutate {
      replace => {
        "sql_injection_label.key" => "sql_injection"
        "sql_injection_label.value" => "%{waf.score.sql_injection}"
      }
      merge => {
        "security_result.detection_fields" => "sql_injection_label"
      }
    }
  }

  if [waf][failures] != "" {
    mutate {
      convert => {
        "waf.failures" => "string"
      }
    }

    mutate {
      replace => {
        "failures_label.key" => "failures"
        "failures_label.value" => "%{waf.failures}"
      }
      merge => {
        "security_result.detection_fields" => "failures_label"
      }
    }
  }

  if [waf][logged] != "" {
    mutate {
      convert => {
        "waf.logged" => "string"
      }
    }

    mutate {
      replace => {
        "logged_label.key" => "logged"
        "logged_label.value" => "%{waf.logged}"
      }
      merge => {
        "security_result.detection_fields" => "logged_label"
      }
    }
  }


  if [request_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{request_id}"
      }
    }
  }

  if [waf][message] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{waf.message}"
      }
    }
  }
  else if [waf_message] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{waf_message}"
      }
    }
  }

  grok {
    match => {
      "message" => [
        "%{DATA}\\\"headersIn\\\":\\[\\[%{DATA:headersIn}\\]\\]%{DATA}\\\"headersOut\\\":\\[\\[%{DATA:headersOut}\\]\\]%{GREEDYDATA}"
      ]
    }
    overwrite => ["headersIn", "headersOut"]
    on_error => "grok_failure"
  }
  mutate {
    gsub => ["headersIn", "\\],\\[", "#"]
  }
  mutate {
    gsub => ["headersIn", '\\"', ""]
  }
  mutate {
    gsub => ["headersIn","Accept-Language","Accept_Language"]
  }
  mutate {
    gsub => ["headersIn","CDN-Loop", "CDN_Loop"]
  }
  mutate {
    gsub => ["headersIn","Fastly-Client", "Fastly_Client"]
  }
  mutate {
    gsub => ["headersIn","Fastly-Orig-Accept-Encoding" , "Fastly_Orig_Accept_Encoding"]
  }
  mutate {
    gsub => ["headersIn","Fastly-SSL", "Fastly_SSL"]
  }
  mutate {
    gsub => ["headersIn","RL-orig-url", "RL_orig_url"]
  }
  mutate {
    gsub => ["headersIn","User-Agent","User_Agent"]
  }
  mutate {
    gsub => ["headersIn","X-Cloud-Trace-Context", "X_Cloud_Trace_Context"]
  }
  mutate {
    gsub => ["headersIn","X-Forwarded-For", "X_Forwarded_For"]
  }
  mutate {
    gsub => ["headersIn","X-Forwarded-Server", "X_Forwarded_Server"]
  }
  mutate {
    gsub => ["headersIn","X-Timer", "X_Timer"]
  }
  mutate {
    gsub => ["headersIn","X-Varnish", "X_Varnish"]
  }
  mutate {
    gsub => ["headersIn","fastly-csi-request-id", "fastly_csi_request_id"]
  }
  mutate {
    gsub => ["headersIn","x-sigsci-tlscipher", "x_sigsci_tlscipher"]
  }
  mutate {
    gsub => ["headersIn","x-sigsci-tlsprotocol", "x_sigsci_tlsprotocol"]
  }
  mutate {
    gsub => ["headersIn","x-sigsci-traceid", "x_sigsci_traceid"]
  }
  mutate {
    gsub => ["headersOut", "\\],\\[", "#"]
  }
  mutate {
    gsub => ["headersOut", '\\"', ""]
  }
  mutate {
    gsub => ["headersOut","Content-Length" , "Content_Length"]
  }
  kv {
    source => "headersIn"
    field_split => "#"
    value_split => ","
    on_error => "kv_failure"
  }
  kv {
    source => "headersOut"
    field_split => "#"
    value_split => ","
    on_error => "headers_out_kv_failure"
  }
  if [Content_Length] != "" {
    mutate {
      convert => {
        "Content_Length" => "string"
      }
      on_error => "content_length_convert_failure"
    }
    mutate {
      replace => {
        "content_length.key" => "Content-Length"
        "content_length.value.string_value" => "%{Content_Length}"
      }
      on_error => "content_length_failure"
    }
    if ![content_length_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "content_length"
        }
        on_error => "content_length_merge_failed"
      }
    }
  }
  if [Keep-Alive] != "" {
    mutate {
      replace => {
        "keep_alive.key" => "Keep-Alive"
        "keep_alive.value.string_value" => "%{Keep-Alive}"
      }
      on_error => "keep_alive_failure"
    }
