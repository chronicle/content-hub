# Product: FireEye HX Audits
# Category: Audits
# Supported Format: XML
# Reference: NA
# Last Updated: 2023-05-31
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "event" => ""
      "event1" => ""
    }
  }

  for index,_ in xml(message,/itemList/ProcessItem) {
    mutate {
      replace => {
        "event" => ""
        "pids" => ""
        "parent_pids" => ""
        "file_path" => ""
        "file_name" => ""
        "Username" => ""
        "SecurityID" => ""
        "startTime" => ""
        "arguments" => ""
        "userTime" => ""
        "kernelTime" => ""
        "label_kernelTime" => ""
        "label_userTime" => ""
      }
    }
    xml {
      source => "message"
      xpath => {
        "/itemList/ProcessItem[%{index}]/pid" => "pids"
        "/itemList/ProcessItem[%{index}]/parentpid" => "parent_pids"
        "/itemList/ProcessItem[%{index}]/path" => "file_path"
        "/itemList/ProcessItem[%{index}]/name" => "file_name"
        "/itemList/ProcessItem[%{index}]/arguments" => "arguments"
        "/itemList/ProcessItem[%{index}]/Username" => "Username"
        "/itemList/ProcessItem[%{index}]/SecurityID" => "SecurityID"
        "/itemList/ProcessItem[%{index}]/SecurityType" => "SecurityType"
        "/itemList/ProcessItem[%{index}]/startTime" => "startTime"
        "/itemList/ProcessItem[%{index}]/kernelTime" => "kernelTime"
        "/itemList/ProcessItem[%{index}]/userTime" => "userTime"
      }
    }

    for source_index, _ in xml(message, /itemList/ProcessItem[%{index}]/SectionList/MemorySection) {
      mutate {
        replace => {
          "protection" => ""
          "label_protection" => ""
          "region_start" => ""
          "label_region_start" => ""
          "event1" => ""
          "region_size" => ""
          "mapped" => ""
          "raw_flags" => ""
          "name" => ""
          "md5" => ""
          "description" => ""
          "signature_exists" => ""
          "label_signature_exists" => ""
          "signature_verified" => ""
          "label_signature_verified" => ""
          "certificate_subject" => ""
          "label_certificate_subject" => ""
          "certificate_issuer" => ""
          "label_certificate_issuer" => ""
        }
      }
      xml {
        source => "message"
        xpath => {
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/Protection" => "protection"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/RegionStart" => "region_start"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/RegionSize" => "region_size"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/Mapped" => "mapped"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/RawFlags" => "raw_flags"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/Name" => "name"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/Md5sum" => "md5"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/DigitalSignature/Description" => "description"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/DigitalSignature/SignatureExists" => "signature_exists"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/DigitalSignature/SignatureVerified" => "signature_verified"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/DigitalSignature/CertificateSubject" => "certificate_subject"
          "/itemList/ProcessItem[%{index}]/SectionList/MemorySection[%{source_index}]/DigitalSignature/CertificateIssuer" => "certificate_issuer"
        }
      }

      if [name] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.file.full_path" => "%{name}"
          }
        }
      }

      if [md5] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.file.md5" => "%{md5}"
          }
        }
      }

      if [description] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.description" => "%{description}"
          }
        }
      }

      if [protection] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.product_event_type" => "%{protection}"
          }
        }
      }

      if [region_size] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.file.size" => "%{region_size}"
          }
        }
        mutate {
          convert => {
            "event1.idm.read_only_udm.target.file.size" => "uinteger"
          }
        }
      }

      if [region_start] != "" {
        mutate {
          replace => {
            "label_region_start.key" => "RegionStart"
            "label_region_start.value" => "%{region_start}"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.metadata.ingestion_labels" => "label_region_start"
          }
        }
      }

      if [raw_flags] != "" {
        mutate {
          replace => {
            "label_raw_flags.key" => "raw_flags"
            "label_raw_flags.value" => "%{raw_flags}"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.metadata.ingestion_labels" => "label_raw_flags"
          }
        }
      }

      if [mapped] != "" {
        mutate {
          replace => {
            "label_mapped.key" => "Mapped"
            "label_mapped.value" => "%{mapped}"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.metadata.ingestion_labels" => "label_mapped"
          }
        }
      }

      if [signature_exists] != "" {
        mutate {
          replace => {
            "label_signature_exists.key" => "Signature Exists"
            "label_signature_exists.value" => "%{signature_exists}"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.metadata.ingestion_labels" => "label_signature_exists"
          }
        }
      }

      if [signature_verified] != "" {
        mutate{
          replace => {
            "event1.idm.read_only_udm.target.file.pe_file.signature_info.verified"=>"%{signature_verified}"
          }
          convert => {
            "event1.idm.read_only_udm.target.file.pe_file.signature_info.verified"=>"boolean"
          }
        }
        mutate {
          replace => {
            "label_signature_verified.key" => "Signature Verified"
            "label_signature_verified.value" => "%{signature_verified}"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.metadata.ingestion_labels" => "label_signature_verified"
          }
        }
      }

      if [certificate_subject] != "" {
        mutate {
          replace => {
            "label_certificate_subject.key" => "Certificate Subject"
            "label_certificate_subject.value" => "%{certificate_subject}"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.metadata.ingestion_labels" => "label_certificate_subject"
          }
        }
      }

      if [certificate_issuer] != "" {
        mutate {
          replace => {
            "label_certificate_issuer.key" => "Certificate Issuer"
            "label_certificate_issuer.value" => "%{certificate_issuer}"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.metadata.ingestion_labels" => "label_certificate_issuer"
          }
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }

      if [event1] != "" {
        mutate {
          merge => {
            "@output" => "event1"
          }
        }
      }
    }

    if [pids] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{pids}"
        }
      }
    }

    if [parent_pids] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.parent_process.pid" => "%{parent_pids}"
        }
      }
    }

    if [file_path] != "" and [file_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.file.full_path" => "%{file_path}\\%{file_name}"
        }
      }
    }

    if [Username] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{Username}"
        }
      }
    }

    if [SecurityID] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.windows_sid" => "%{SecurityID}"
        }
      }
    }

    if [startTime] != "" {
      date {
        match => ["startTime", "ISO8601"]
      }
    }

    if [arguments] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.command_line"  => "%{arguments}"
        }
      }
    }

    if [userTime] != "" {
      mutate {
        replace => {
          "label_userTime.key" => "userTime"
          "label_userTime.value" => "%{userTime}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.metadata.ingestion_labels" => "label_userTime"
        }
      }
    }

    if [kernelTime] != "" {
      mutate {
        replace => {
          "label_kernelTime.key" => "kernelTime"
          "label_kernelTime.value" => "%{kernelTime}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.metadata.ingestion_labels" => "label_kernelTime"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }

    if [event] != "" {
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
}
