# Product: IBM DB2
# Category: Database
# Supported Format: LEEF,Syslog+KV,JSON
# Reference: https://developer.ibm.com/qradar/wp-content/uploads/sites/89/2017/02/QRadar_LEEF_Format_Guide_V1.0.pdf, https://buganizer.corp.google.com/action/issues/213308270/attachments/35874184?download=false
# Last Updated: 2026-07-29
# Copyright 2026 Google SecOps
filter {
  mutate {
    replace => {
      "_principal" => ""
      "_target" => ""
      "_target_resource_ancestors" => ""
      "_security_result" => ""
      "_action" => ""
      "name" => ""
      "conn_location" => ""
      "conn_location2" => ""
      "conn_location3" => ""
      "intent" => ""
      "msg" => ""
      "file_name" => ""
      "Type" => ""
      "objtyp" => ""
      "obj" => ""
      "conn" => ""
      "AuthenticatedUser" => ""
      "CorrelationUser" => ""
      "SSID" => ""
      "ConnectionType" => ""
      "plan" => ""
      "SQL" => ""
      "SQL_array" => ""
      "date" => ""
      "time" => ""
      "leef_event_attributes" => ""
      "devTime" => ""
      "leef_event_id" => ""
      "sum" => ""
      "usrName" => ""
      "job" => ""
      "column5" => ""
      "column6" => ""
      "resource_name" => ""
      "sourceHostName" => ""
      "System" => ""
      "Subsystem" => ""
      "process" => ""
      "kv_data" => ""
      "timestamp_1" => ""
      "event_correlator" => ""
      "audit_event" => ""
      "principal_hostname" => ""
      "userid" => ""
      "instance_name" => ""
      "application_name" => ""
      "archive_path" => ""
      "timestamp" => ""
      "category" => ""
      "CorrelationNumber" => ""
      "poe" => ""
      "usrPriv" => ""
      "tmp_roles" => ""
      "length" => ""
      "has_principal_user" => "false"
      "has_principal_hostname" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] and [message] =~ "^{" {
    grok {
      match => {
        "message" => "SQL\\\":%{GREEDYDATA:SQL_array}}"
      }
      overwrite => ["SQL_array"]
      on_error => "SQL_array_match_error"
    }
    if [SQL_array] != "" {
      mutate {
        replace => {
          "SQL" => "%{SQL_array}"
        }
      }
    }
    mutate {
      gsub => ["message",",\\s+\\\"SQL.*","}"]
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
  }

  # Extract data based on LEEF V1.0 format.
  if [not_json] {
    mutate {
      gsub => ["message","\\\"",""]
    }
    csv {
      source => "message"
      separator => "|"
    }
    mutate {
      rename => {
        "column1" => "leef_version"
        "column2" => "leef_vendor_name"
        "column3" => "leef_product_name"
        "column4" => "leef_product_version"
      }
    }
    if [column5] != "" {
      mutate {
        replace => {
          "leef_event_id" => "%{column5}"
        }
        on_error => "no_leef_event_id"
      }
    }
    if [column6] != "" {
      mutate {
        replace => {
          "leef_event_attributes" => "%{column6}"
        }
      }
    }

    mutate {
      gsub => [
        "leef_event_attributes","\\t", "^"
      ]
    }

    kv {
      source => "leef_event_attributes"
      field_split => "^"
      value_split => "="
    }


    grok {
      match => {
        "message" => '<%{INT}>%{SYSLOGTIMESTAMP:timestamp_1}\\s+%{HOSTNAME:principal_hostname}\\s+%{DATA:process}:%{GREEDYDATA:kv_data}'
      }
      overwrite => ["process", "kv_data","timestamp_1","principal_hostname"]
      on_error => "messsage_grok_fail"
    }
    if [principal_hostname] != "" {
      mutate {
        replace => {
          "_principal.hostname" => "%{principal_hostname}"
          "_principal.asset.hostname" => "%{principal_hostname}"
          "has_principal_hostname" => "true"
        }
        on_error => "principal_hostname_replace_fail"
      }
    }
    kv {
      source => "kv_data"
      field_split => ";"
      value_split => "="
      on_error => "kv_data_split_fail"
    }
    mutate {
      replace => {
        "audit_event" => "%{audit event}"
      }
      on_error => "audit_event_not_replace"
    }
    if [timestamp] != "" {
      date {
        match => ["timestamp","yyyy-MM-dd-HH.mm.ss"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "timestamp_date_fail"
      }
    }
    if [category] != "" {
      mutate {
        merge => {
          "_security_result.category_details" => "category"
        }
        on_error => "category_merge_fail"
      }
    }
    if [userid] != "" {
      mutate {
        replace => {
          "_principal.user.userid" => "%{userid}"
          "has_principal_user" => "true"
        }
        on_error => "userid_replace_fail"
      }
    }

    # Extract data from conn
    grok {
      match => {
        "conn" => [
        "^%{DATA} location %{DATA:conn_location} %{DATA:conn_location2} %{DATA:conn_location3} connector %{DATA:conn_connector} operator %{DATA:conn_operator} workstation %{DATA:conn_workstation}(| tx %{DATA:conn_tx}) enduser %{DATA:conn_enduser}$"
        "^%{DATA} location %{DATA:conn_location} %{DATA:conn_location2} %{DATA:conn_location3} connector %{DATA:conn_connector} operator %{DATA:conn_operator}(| tx %{DATA:conn_tx})$"
        "^%{DATA} location %{DATA:conn_location3} connector %{DATA:conn_connector} operator %{DATA:conn_operator}$"
        ]
      }
      overwrite => ["conn_location", "conn_location2", "conn_location3"]
      on_error => "conn_grok_fail"
    }

    date {
      match => ["devTime", "ISO8601"]
      on_error => "date_fail"
    }

    # Start to create the event
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "IBM"
        "event.idm.read_only_udm.metadata.product_name" => "DB2"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{leef_event_id}"
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{sum}"
      }
    }

    if [audit_event] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{audit_event}"
        }
        on_error => "audit_event_replace_fail"
      }
    }
    mutate {
      replace => {
        "event_correlator" => "%{event correlator}"
      }
      on_error => "event_correlator_not_replace"
    }
    if [event_correlator] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{event_correlator}"
        }
        on_error => "event_correlator_replace_fail"
      }
    }

    mutate {
      replace => {
        "instance_name" => "%{instance name}"
      }
      on_error => "instance_name_not_replace"
    }
    if [instance_name] != "" {
      mutate {
        replace => {
          "_target.resource.name" => "%{instance_name}"
        }
        on_error => "instance_name_replace_error"
      }
    }
    mutate {
      replace => {
        "application_name" => "%{application name}"
      }
      on_error => "application_name_not_replace"
    }
    if [application_name] != "" {
      mutate {
        replace => {
          "_principal.application" => "%{application_name}"
        }
        on_error => "application_name_replace_error"
      }
    }
    mutate {
      replace => {
        "archive_path" => "%{archive path}"
      }
      on_error => "archive_path_not_replace"
    }
    if [archive_path] != "" {
      mutate {
        replace => {
          "_target.file.full_path" => "%{archive_path}"
        }
        on_error => "archive_path_replace_error"
      }
    }

    # Principal
    if [usrName] != "" {
      mutate {
        replace => {
          "_principal.user.userid" => "%{usrName}"
        }
        on_error => "usrName_replace_error"
      }
    }

    if [name] != "" {
      mutate {
        replace => {
          "_principal.user.user_display_name" => "%{name}"
        }
      }
    }

    if [job] != "" {
      mutate {
        replace => {
          "_principal.application" => "%{job}"
        }
      }
    }

    # Target
    if [conn_location3] != "" {
      mutate {
        replace => {
          "_target.hostname" => "%{conn_location3}"
          "_target.asset.hostname" => "%{conn_location3}"
        }
        on_error => "invalid_hostname"
      }
    }

    if [conn_location] != "" and [conn_location2] != "" {
      mutate {
        replace => {
          "_target.location.name" => "%{conn_location} %{conn_location2}"
        }
      }
    }

    # Event type + security result
    if [leef_event_id] in ["102-87", "102-83"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
      if [poe] != "" {
        mutate {
          replace => {
            "_target.resource.name" => "%{poe}"
          }
          on_error => "poe_replace_error"
        }
      }

      if [usrPriv] != "" {
        mutate {
          replace => {
            "tmp_roles.name" => "%{usrPriv}"
          }
          on_error => "usrPriv_replace_error"
        }
        if ![usrPriv_replace_error] {
          mutate {
            merge => {
              "_principal.user.attribute.roles" => "tmp_roles"
            }
            on_error => "usrPriv_merge_error"
          }
        }
      }

      if [sum] =~ "successful" {
        mutate {
          replace => {
            "_action" => "ALLOW"
          }
        }
      }
      else {
        mutate {
          replace => {
            "_action" => "BLOCK"
          }
        }
      }

      mutate {
        merge => {
          "_security_result.action" => "_action"
        }
      }

      mutate {
        replace => {
          "auth_mechanism" => "USERNAME_PASSWORD"
        }
        merge => {
          "event.idm.read_only_udm.extensions.auth.mechanism" => "auth_mechanism"
        }
      }
    }
    else if [leef_event_id] in ["102-6", "102-7", "102-8", "102-10", "102-24", "102-143"] {
      if [intent] == "UPDATE" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
      if [intent] != "" {
        mutate {
          replace => {
            "additional_intent.key" => "intent"
            "additional_intent.value.string_value" => "%{intent}"
          }
          on_error => "intent_replace_error"
        } if ![intent_replace_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "additional_intent"
            }
            on_error => "intent_merge_error"
          }
        }
      }
      if [objtyp] != "" {
        mutate {
          uppercase => ["objtyp"]
        }
        mutate {
          replace => {
            "_target.resource.resource_subtype" => "%{objtyp}"
          }
        }
      }
      if [obj] != "" {
        mutate {
          replace => {
            "_target.resource.name" => "%{obj}"
          }
        }
      }
    }
    if [leef_event_id] == "102-319" {
      if [conn] != "" {
        grok {
          match => {
            "conn" => "%{IP:principal_ip} product %{WORD:product_id}"
          }
          on_error => "no_principal_ip"
        }
        if ![conn_grok_fail] {
          mutate {
            replace => {
              "_principal.asset_id" => "Product ID: %{product_id}"
            }
            merge => {
              "_principal.ip" => "principal_ip"
              "_principal.asset.ip" => "principal_ip"
            }
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "match_error" => "false"
      }
      convert => {
        "match_error" => "boolean"
      }
    }
    grok {
      match => {
        "msg" => "%{DATA:SSID}\\s+%{DATA:Database_Name}\\s+%{DATA:Table_Name}\\s+%{DATA:Creator}\\s+%{DATA:Object_Class_Code}\\s+%{DATA:Type}\\s+%{DATA:sourceUserName}\\s+%{YEAR}-%{MONTHNUM}-%{MONTHDAY}-%{HOUR}.?%{MINUTE}\\s+%{YEAR}-%{MONTHNUM}-%{MONTHDAY}-%{HOUR}.?%{MINUTE}"
      }
      on_error => "not_this_type"
      overwrite => ["Type","SSID"]
    }

    if [not_this_type] {
      mutate {
        gsub => ["msg"," ",""]
      }
      csv {
        source => "msg"
        separator => "|"

      }

      if [msg] =~ "140"{
        mutate {
          rename => {
            "column1" => "messageid"
            "column2" => "ts"
            "column3" => "Connection_Type"
            "column4" => "Plan"
            "column5" => "DB2_Subsystem"
            "column6" => "Object_Class_Code"
            "column7" => "Priv_Check_Code"
            "column8" => "Database_Name"
            "column9" => "Table_Name"
            "column10" => "sourceUserName"
          }
        }
      }
      else if [msg] =~ "141"{
        mutate {
          rename => {
            "column1" => "messageid"
            "column2" => "ts"
            "column3" => "Connection_Type"
            "column4" => "Plan"
            "column5" => "DB2_Subsystem"
            "column6" => "deviceAction"
            "column7" => "Object_Class_Code"
            "column8" => "sourceUserName"
          }
        }
      }
      else if [msg] =~ "NEW" {
        mutate {
          rename => {
            "column1" => "messageid"
            "column2" => "deviceHostName"
            "column3" => "DB2_Subsystem"
            "column4" => "sourceUserName"
            "column5" => "Table_Name"
            "column6" => "MessageType"
            "column7" => "Check_type"
            "column8" => "deviceAction"
          }
        }
      }
      else if [msg] !~ "," {
        mutate {
          rename => {
            "column1" => "deviceHostName"
            "column2" => "sourceUserName"
            "column3" => "sourceServiceName"
            "column4" => "deviceProcessName"
          }
        }
        if [column5] != "" {
          mutate {
            replace => {
              "sourceHostName" => "%{column5}"
            }
            on_error => "no_sourceHostName"
          }
        }
      }
      else {
        mutate {
          gsub => ["msg",",,+",","]
        }
        mutate {
          gsub => ["msg","!",""]
        }
        grok {
          match => {
            "msg" => "%{GREEDYDATA},%{INT},%{INT},%{WORD},%{WORD},%{WORD},%{WORD:sourceUserName},\*%{GREEDYDATA},%{WORD:Database_Name},%{WORD:Connection_Type},%{WORD:sourceServiceName},%{WORD},%{HOST:sourceHostName}"
          }
          overwrite => ["sourceHostName"]
          on_error => "match_error"
        }
      }
    }

    if ![match_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "IBM"
        "event.idm.read_only_udm.metadata.product_name" => "DB2"
      }
    }

    if [msg] != "" {
      mutate {
        gsub => ["msg" , "(^\\s+)?(\\s+$)?", ""]
      }

      mutate {
        replace => {
          "additional_labelMsg.key" => "msg"
          "additional_labelMsg.value.string_value" => "%{msg}"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_labelMsg"
        }
      }
    }

    if [file_name] != "" {
      mutate {
        replace => {
          "_target.file.full_path" => "%{file_name}"
        }
      }
    }
  }
  if [length] != "" {
    mutate {
      replace => {
        "additional_labelLength.key" => "length"
        "additional_labelLength.value.string_value" => "%{length}"
      }
      on_error => "no_length"
    }
    if ![no_length] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_labelLength"
        }
        on_error => "length_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "_target.resource.id" => "%{messageid}"
    }
    on_error => "no_messageid"
  }

  mutate {
    replace => {
      "_target.resource.name" => "%{Database_Name}"
    }
    on_error => "no_Database_Name"
  }
  mutate {
    replace => {
      "_target_resource_ancestors.name" => "%{Object_Class_Code}"
    }
    on_error => "no_Object_Class_Code"
  }

  if [_target_resource_ancestors] != "" {
    mutate {
      merge => {
        "_target.resource_ancestors" => "_target_resource_ancestors"
      }
      on_error => "target_resource_ancestors_merge_error"
    }
  }

  if [ConnectionType] != "" {
    mutate {
      replace => {
        "Connection_Type" => "%{ConnectionType}"
        "_principal.process.pid" => "%{ConnectionType}"
      }
      on_error => "no_Connection_type"
    }
  }

  mutate {
    replace => {
      "connection_Type.key" => "Connection Type"
      "connection_Type.value" => "%{Connection_Type}"
    }
    on_error => "no_Connection_Type"
  }

  if ![no_Connection_Type] {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "connection_Type"
      }
    }
  }

  if [plan] != "" {
    mutate {
      replace => {
        "Plan" => "%{plan}"
        "_principal.resource.name" => "%{plan}"
      }
      on_error => "no_plan_value"
    }
  }
  mutate {
    replace => {
      "plan.key" => "Plan"
      "plan.value" => "%{Plan}"
    }
    on_error => "no_plan"
  }

  if ![no_plan] {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "plan"
      }
    }
  }

  mutate {
    replace => {
      "DB2_subsystem.key" => "DB2 Subsystem"
      "DB2_subsystem.value" => "%{DB2_Subsystem}"
    }
    on_error => "no_DB2_subsystem"
  }

  if ![no_DB2_subsystem] {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "DB2_subsystem"
      }
    }
  }

  mutate {
    replace => {
      "priv_check_code.key" => "Priv Check Code"
      "priv_check_code.value" => "%{Priv_Check_Code}"
    }
    on_error => "no_priv_check_code"
  }

  if ![no_priv_check_code] {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "priv_check_code"
      }
    }
  }

  mutate {
    replace => {
      "table_name.key" => "Table Name"
      "table_name.value" => "%{Table_Name}"
    }
    on_error => "no_Table_Name"
  }

  if ![no_Table_Name] {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "table_name"
      }
    }
  }

  mutate {
    replace => {
      "Message_Type.key" => "Message Type"
      "Message_Type.value" => "%{MessageType}"
    }
    on_error => "no_Message_Type"
  }

  if ![no_Message_Type] {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "Message_Type"
      }
    }
  }

  mutate {
    replace => {
      "check_type.key" => "Check Type"
      "check_type.value" => "%{Check_type}"
    }
    on_error => "no_check_type"
  }

  if ![no_check_type] {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "check_type"
      }
    }
  }

  mutate {
    replace => {
      "device_Action.key" => "Device Action"
      "device_Action.value" => "%{deviceAction}"
    }
    on_error => "no_device_Action"
  }

  if ![no_device_Action] {
    if [deviceAction] == "G" {
      mutate {
        replace => {
          "device_Action.value" => "GRANT"
        }
      }
    }
    else if [deviceAction] == "R" {
      mutate {
        replace => {
          "device_Action.value" => "REVOKE"
        }
      }
    }
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "device_Action"
      }
    }
  }

  if [Type] == "T" {
      mutate {
        replace => {
          "_target.resource.resource_subtype" => "TABLE"
        }
      }
    }
    else if [Type] == "V" {
      mutate {
        replace => {
          "_target.resource.resource_subtype" => "VIEW"
        }
      }
    }
    else if [Type] == "X" {
      mutate {
        replace => {
          "_target.resource.resource_subtype" => "AUXILARY TABLE"
        }
      }
    }

  mutate {
    replace => {
      "ssid.key" => "SSID"
      "ssid.value" => "%{SSID}"
    }
    on_error => "no_ssid"
  }

  if ![no_ssid] and [ssid][value] != "" {
    mutate {
      merge => {
        "_target.resource.attribute.labels" => "ssid"
      }
    }
  }

  mutate {
    replace => {
      "_target.process.command_line" => "%{deviceProcessName}"
    }
    on_error => "no_deviceProcessName"
  }

  mutate {
    replace => {
      "_target.resource.resource_type" => "DATABASE"
    }
  }

  mutate {
    replace => {
      "_principal.application"  => "%{sourceServiceName}"
    }
    on_error => "no_sourceServiceName"
  }

  mutate {
    replace => {
      "_principal.user.userid" => "%{sourceUserName}"
    }
    on_error => "no_sourceUserName"
  }

   mutate {
    replace => {
      "_principal.user.user_display_name" => "%{Creator}"
    }
    on_error => "no_Creator"
  }
  if [sourceHostName] != "" {
    mutate {
      replace => {
        "_principal.hostname" => "%{sourceHostName}"
        "_principal.asset.hostname" => "%{sourceHostName}"
      }
      on_error => "no_principal_hostname"
    }
  }

  mutate {
    replace => {
      "_target.hostname" => "%{deviceHostName}"
      "_target.asset.hostname" => "%{deviceHostName}"
    }
    on_error => "no_deviceHostName"
  }

  if [AuthenticatedUser] != "" {
    mutate {
      replace => {
        "_principal.user.userid" => "%{AuthenticatedUser}"
      }
      on_error => "no_user_id"
    }
  }

  if [System] != "" {
    mutate {
      replace => {
        "System_label.key" => "System"
        "System_label.value.string_value" => "%{System}"
      }
      on_error => "no_System"
    }
    if ![no_System] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "System_label"
        }
        on_error => "merge_System_failed"
      }
    }
  }

  if [Subsystem] != "" {
    mutate {
      replace => {
        "Subsystem_label.key" => "Subsystem"
        "Subsystem_label.value.string_value" => "%{Subsystem}"
      }
      on_error => "no_Subsystem"
    }
    if ![no_Subsystem] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Subsystem_label"
        }
        on_error => "merge_Subsystem_failed"
      }
    }
  }

  if [SSID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{SSID}"
      }
      on_error => 'No_Im_User'
    }
  }
  if [CorrelationNumber] != "" {
    mutate {
      replace => {
        "additional_correlationNum.key" => "Correlation Number"
        "additional_correlationNum.value.string_value" => "%{CorrelationNumber}"
      }
      on_error => "CorrelationNumber_error"
    }
    if ![CorrelationNumber_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_correlationNum"
        }
        on_error => "no_correlationNum"
      }
    }
  }
  if [CorrelationUser] != "" {
    mutate {
      replace => {
        "intermediary.user.userid" => "%{CorrelationUser}"
      }
      on_error => 'no_CorrelationUser'
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => 'no_intermediary'
    }
  }

  if [SQL] != "" {
    mutate {
      replace => {
        "sql_query.key" => "SQL Query"
        "sql_query.value" => "%{SQL}"
        "_principal.process.command_line" => "%{SQL}"
      }
      on_error => "no_sql_query"
    }

    if ![no_sql_query] {
      mutate {
        merge => {
          "_target.resource.attribute.labels" => "sql_query"
        }
      }
    }
    grok {
      match => {
        "SQL" => [
          "(?i)INSERT\\s+INTO\\s+%{DATA:resource_name}[\\s(]",
        "(?i)UPDATE\\s+%{DATA:resource_name}\\s+SET",
          "FROM %{DATA:resource_name} "
        ]
      }
      overwrite => ["resource_name"]
      on_error => "no_resource_name"
    }
    if ![no_resource_name] and [resource_name] != "" {
      mutate {
        replace => {
          "_target.resource.name" => "%{resource_name}"
        }
      }
    }
  }

  if [date] != "" and [time] != "" {
    mutate {
      replace => {
        "date_time" => "%{date} %{time}"
      }
      on_error => "no_date_time"
    }
    mutate {
      gsub => ["date_time", "\\*", ""]
    }
    if ![no_date_time] {
      date {
        match => ["date_time", "MM/dd/yy HH:mm:ss", "dd/MM/yy HH:mm:ss", "yy/MM/dd HH:mm:ss"," d MMM yyyy HH:mm:ss.SS","dd MMM yyyy HH:mm:ss.SS"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "match_failed"
      }
    }
  }
  mutate {
    rename => {
      "process" => "addition.process"
      "event status" => "addition.event_status"
      "authid" => "addition.authid"
      "application id" => "addition.application_id"
      "access attempted" => "addition.access_attempted"
      "object type" => "addition.object_type"
      "access_approval_reason" => "addition.access_approval_reason"
      "plugin name" => "addition.plugin_name"
      "auth type" => "addition.auth_type"
      "execution id" => "addition.execution_id"
      "timestamp_1" => "addition.timestamp_1"
    }
  }
  for key , value in addition map {
    mutate {
      replace => {
        "check" => ""
        "field1" => ""
      }
    }
    mutate {
      convert => {
          "value" => "string"
        }
      on_error => "value_not_string"
    }
    mutate {
      replace => {
        "check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [check] != "" {
      mutate {
        replace => {
          "field1.key" => "%{key}"
        }
        on_error => "no_value_for_key"
      }
      if [key] in ["application_id","authid","execution_id"] {
        mutate {
          replace => {
            "field1.value" => "%{value}"
          }
          on_error => "no_value_for_principal_resource_attribute_labels"
        }
        mutate {
          merge => {
            "_principal.resource.attribute.labels" => "field1"
          }
          on_error => "no_value_for_prrincipal_resource_attribute_labels_merged"
        }
      }
      else if [key] in ["event_status","access_attempted","access_approval_reason"] {
        mutate {
          replace => {
            "field1.value" => "%{value}"
          }
          on_error => "no_value_for_security_result_detection_fields"
        }
        mutate {
          merge => {
            "_security_result.detection_fields" => "field1"
          }
          on_error => "no_value_for_security_result_detection_fields_merged"
        }
      }
      else {
        mutate {
          replace => {
            "field1.value.string_value" => "%{value}"
          }
          on_error => "no_value_for_additional_fields"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field1"
          }
          on_error => "no_value_for_additional_fields_merged"
        }
      }
    }
  }
  if [has_principal_user] == "true" and [audit_event] == "AUTHENTICATION" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal_hostname] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [_security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "_security_result"
      }
    }
  }

  if [_principal] != "" {
    mutate {
      rename => {
        "_principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [_target] != "" {
    mutate {
      rename => {
        "_target" => "event.idm.read_only_udm.target"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
