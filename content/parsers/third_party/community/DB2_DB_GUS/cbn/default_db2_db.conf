# Google SecOps Default CBN Parser (DB2_DB)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/DB2_DB/default/db2_db.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "DB2"
      "event.idm.read_only_udm.metadata.product_name" => "DB2_DB"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
