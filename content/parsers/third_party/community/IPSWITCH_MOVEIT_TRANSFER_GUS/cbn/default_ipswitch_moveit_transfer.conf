# Product: IPSWITCH MOVEIT TRANSFER
# Category: Switches
# Supported Format: SYSLOG + CSV
# Reference: https://docs.progress.com/bundle/moveit-transfer-web-admin-help-2022/page/Logs.html
# Last Updated: 2025-11-04
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "timestamp"                                           => ""
      "column1"                                             => ""
      "column2"                                             => ""
      "column3"                                             => ""
      "column4"                                             => ""
      "column5"                                             => ""
      "column6"                                             => ""
      "column7"                                             => ""
      "column8"                                             => ""
      "column9"                                             => ""
      "column10"                                            => ""
      "column11"                                            => ""
      "column12"                                            => ""
      "column13"                                            => ""
      "column15"                                            => ""
      "column16"                                            => ""
      "column19"                                            => ""
      "column23"                                            => ""
      "is_tgt_file_present"                                 => "false"
      "not_syslog"                                          => "false"
      "tar_host"                                            => "false"
      "host"                                                => ""
      "source_module_name"                                  => ""
      "source_module_type"                                  => ""
      "event_received_time"                                 => ""
      "log_msg"                                             => ""
      "log_level"                                           => ""
      "log_desc"                                            => ""
      "security_result"                                     => ""
      "port"                                                => ""
      "tgtport"                                             => ""
      "package"                                             => ""
      "srcip"                                               => ""
      "version"                                             => ""
      "username"                                            => ""
      "http_method"                                         => ""
      "action"                                              => ""
      "tgtip"                                               => ""
      "application_proto"                                   => ""
      "url"                                                 => ""
      "summary"                                             => ""
      "description"                                         => ""
      "file_path"                                           => ""
      "file_size"                                           => ""
      "process_id"                                          => ""
      "image_path"                                          => ""
      "task_id"                                             => ""
      "status_code"                                         => ""
      "session_id"                                          => ""
      "kv_data"                                             => ""
      "action_performed"                                    => ""
      "principal_host"                                      => ""
      "XFerSize"                                            => ""
      "IPAddress"                                           => ""
      "ID"                                                  => ""
      "InstID"                                              => ""
      "Username"                                            => ""
      "product_name"                                        => ""
      "product_version"                                     => ""
      "company_name"                                        => ""
      "FileID"                                              => ""
      "FolderID"                                            => ""
      "FolderPath"                                          => ""
      "FileName"                                            => ""
      "AgentBrand"                                          => ""
      "Parm1"                                               => ""
      "Parm2"                                               => ""
      "Error"                                               => ""
      "Message"                                             => ""
      "json_data"                                           => ""
      "SourceModuleName"                                    => ""
      "SourceModuleType"                                    => ""
      "SourceName"                                          => ""
      "Severity"                                            => ""
      "Hostname"                                            => ""
      "Channel"                                             => ""
      "FAILED"                                              => ""
      "AgentVersion"                                        => ""
      "EventReceivedTime"                                   => ""
      "prin_ip"                                             => ""
      "fileName"                                            => ""
      "folderPath"                                          => ""
      "useremail"                                           => ""
      "has_principal"                                       => "false"
      "has_target"                                          => "false"
      "target_application"                                  => ""
      "log_status"                                          => ""
      "AdminTrust"                                          => ""
      "Permission"                                          => ""
      "product_event"                                       => ""
      "dstip"                                               => ""
      "has_target_details"                                 => "false"
      "Node"                                                => ""
      "SourceDuration"                                      => ""
      "DestDuration"                                        => ""
      "ErrCode"                                             => ""
      "SourceNBytes"                                        => ""
      "NBytes"                                              => ""
      "LogStamp"                                            => ""
      "TaskID"                                              => ""
      "SourceStamp"                                         => ""
      "NominalStart"                                        => ""
      "SourceHost"                                          => ""
      "DestHost"                                            => ""
      "SourceFilename"                                      => ""
      "SourceFilenameOnly"                                  => ""
      "DestFilename"                                        => ""
      "DestFilenameOnly"                                    => ""
      "TaskName"                                            => ""
      "Action"                                              => ""
      "LogTime"                                             => ""
    }
  }

  if [message] != "" {
    mutate {
      gsub => ["message","\\t\\t\\t\\t\\t\\t\\t"," , "]
    }
    mutate {
      gsub => ["message","\\t\\t\\t"," , "]
    }
    mutate {
      gsub => ["message","\\t\\t"," , "]
    }
    mutate {
      gsub => ["message","\\t"," , "]
    }
    mutate {
      gsub => ["message","\\\\nHost","Host"]
    }
    grok {
      match => {
        "message" => [
              "%{TIMESTAMP_ISO8601:timesatmp}.* %{INT:pid}: %{DATA:task_id}: Task %{DATA:task} !: OutLine=%{GREEDYDATA} AM , %{INT} , %{INT} , %{GREEDYDATA} AM , %{WORD:action} , %{DATA:principal_host} , \\\\\\\\%{IP:srcip}\\\\%{INT}.*",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA:principal_host} %{DATA:product_name}_%{IP:product_version}: User '%{DATA:company_name}' %{DATA} : %{DATA:action_performed},%{GREEDYDATA:kv_data}",
          "<%{INT}>%{DATA}\\s+%{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host} - - - \\[.*EventReceivedTime=\\\"%{TIMESTAMP_ISO8601:event_received_time}\\\" SourceModuleName=\\\"%{DATA:source_module_name}\\\" SourceModuleType=\\\"%{DATA:source_module_type}\\\"\\] ?(%{TIMESTAMP_ISO8601}|) (%{DATA}:) %{GREEDYDATA:log_msg}",
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{LOGLEVEL:log_level}\\s+%{INT} ---\\s+\\[%{HOSTNAME:host}-%{INT:port}-exec.*?\\]\\s+%{NOTSPACE:package}\\s+:\\s+%{GREEDYDATA:log_msg}",
          "%{TIMESTAMP_ISO8601} %{DATA}: %{DATA:task_id}: (?P<description>%{GREEDYDATA} '%{GREEDYDATA:file_path}'.*on '%{DATA:host}'.*)",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:principal_host} %{DATA:process}\\[%{INT}\\]: %{GREEDYDATA:json_data}"
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:ID}:%{DATA:log_msg}:\\s+action=%{WORD:action}",
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:ID}:%{WORD:target_application} %{DATA:log_msg}:\\s+Host:\\s+%{WORD:principal_host}",
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA} %{DATA} %{DATA}\\(%{INT}\\) %{DATA:product_event}: User '%{WORD:Username}' %{GREEDYDATA:log_msg}",
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:ID}:%{WORD:target_application}:\\s+%{GREEDYDATA:log_msg}",
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA} %{DATA} %{DATA}\\(%{INT}\\) %{DATA:product_event}: %{GREEDYDATA:log_msg}",
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:ID}:%{DATA:product_event}:\\s+%{GREEDYDATA:log_msg}",
          "%{TIMESTAMP_ISO8601:timestamp} %{DATA} \\(%{DATA}\\) %{DATA:product_event} Permission=%{DATA:Permission},\\s+Username=%{WORD:Username},\\s+AdminTrust=%{DATA:AdminTrust}\\s+:%{DATA:log_status}$",
          "%{TIMESTAMP_ISO8601:timestamp}\\s+%{GREEDYDATA:log_msg}",
          "%{TIMESTAMP_ISO8601:timestamp}, %{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["product_event","Username","log_status","AdminTrust","Permission","ID","target_application","json_data","company_name","principal_host","product_name","product_version","kv_data","timestamp", "host", "source_module_name", "action", "event_received_time", "source_module_type", "action_performed", "log_msg", "log_level", "port", "package", "srcip", "description", "file_path","task_id"]
      on_error => "not_syslog_pattern"
    }
    if [not_syslog_pattern] {
      mutate {
        replace => {
          "not_syslog" => "true"
        }
      }
    }
  }

  if [not_syslog] == "true" {
    csv {
      source => "message"
      on_error => "not_csv_pattern"
    }

    if [not_csv_pattern] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }

    if [column1] != "" {
      date {
        match => ["column1", "d/M/yyyy H:mm:ss A", "M/d/yyyy H:mm:ss A", "MM/dd/yyyy HH:mm:ss A"]
        target => "event.idm.read_only_udm.metadata.collected_timestamp"
        on_error => "no_proper_format"
      }
      date {
        match => ["column1", "d/M/yyyy H:mm:ss A", "M/d/yyyy H:mm:ss A", "MM/dd/yyyy HH:mm:ss A"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "invalid_date_format"
      }
    }

    if [column2] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{column2}"
        }
      }
    }

    if [column3] != "" and [column3] !~ " " {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{column3}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{column3}"
          "tar_host" => "true"
        }
      }
    }
    if [column4] != "" {
      grok {
        match => {
          "column4" => "%{IP:srcip}"
        }
        overwrite => ["srcip"]
        on_error => "srcip_failure"
      }
      if ![srcip_failure] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "srcip"
            "event.idm.read_only_udm.principal.asset.ip" => "srcip"
          }
        }
      }
    }

    if [column6] != "" {
      mutate {
        replace => {
          "fileName" => "%{column6}"
        }
      }
    }

    if [column7] != "" {
      if [column2] == "file_sentemail" {
        mutate {
          replace => {
            "useremail" => "%{column7}"
          }
        }
      }
      else {
        mutate {
          replace = {
            "fileName" => "%{column7}"
          }
        }
      }
    }

    if [column10] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{column10}"
        }
      }
    }

    if [column11] != "" and [column11] != "None" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{column11}"
        }
      }
    }

    if [column12] != "" {
      grok {
        match => {
          "column12" => "%{IP:tgtip}"
        }
        overwrite => ["tgtip"]
        on_error => "tgtip_failure"
      }
      if ![tgtip_failure] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "tgtip"
            "event.idm.read_only_udm.target.asset.ip" => "tgtip"
          }
        }
      }
    }

    if [column15] != "" {
      mutate {
        replace => {
          "fileName" => "%{column15}"
        }
      }
    }

    if [column16] != "" {
      mutate {
        replace => {
          "folderPath" => "%{column16}"
        }
      }
    }

    if [column19] != "" {
      if[column2] == "file_sentemail" and [column8] == "sender" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.user_display_name" => "%{column19}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.user_display_name" => "%{column19}"
          }
        }
      }
    }

    if [column23] != "" {
      mutate {
        replace => {
          "folderPath" => "%{column23}"
        }
      }
    }

    if [fileName] != "" and [folderPath] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{folderPath}/%{fileName}"
          "is_tgt_file_present" => "true"
        }
      }
    }
    else if [fileName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{fileName}"
          "is_tgt_file_present" => "true"
        }
      }
    }
    if [column2] == "sec_signon" and ([tgtip] != "" or [tar_host] == "true") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
    }
    else if [column2] == "sec_signoff" and ([tgtip] != "" or [tar_host] == "true") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
    }
    else if [column2] == "folder_add" {
      if [folderPath] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{folderPath}"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
        }
      }
    }
    else if [column2] in ["file_upload","file_download"] and [tgtip] != "" and [is_tgt_file_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_CREATION"
        }
      }
    }
    else if [column2] == "file_delete" and [srcip] != "" and [is_tgt_file_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_DELETION"
        }
      }
    }
    else if [column2] == "file_rename" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
        }
      }
    }
    else if [column2] == "file_dlhashchk" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
        }
      }
    }
    else if [column2] == "file_sentemail" and [useremail] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.email_addresses" => "useremail"
        }
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
        }
      }
    }
    else if [srcip] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
  }
  else {
    if [json_data] != "" {
      json {
        source => "json_data"
        array_function => "split_columns"
        on_error => "json_failure"
      }
    }

    if [log_msg] != "" {
      grok {
        match => {
          "log_msg" => [
            "Path=(?P<file_path>.*\\/%{INT:port})\\s+to\\s+%{INT:tgtport}\\s+%{GREEDYDATA:log_desc}"
            "Path=%{NOTSPACE:file_path}\\s+%{GREEDYDATA:log_desc}"
            "Session\\s+%{INT:session_id}\\s+%{GREEDYDATA}"
            "Path=(?P<file_path>.*txaus%{NOTSPACE})\\s+%{GREEDYDATA:log_desc}"
            "Task\\s+%{DATA:task_id}\\s+%{GREEDYDATA:log_desc}"
            "\\(REST API\\s+%{NOTSPACE:session_id}\\s-\\s%{IP:srcip}\\):\\s+%{GREEDYDATA}"
            ".*\\s+%{IP:version}\\s+%{WORD:http_method}\\s+.*=%{WORD:action}\\s+.*=%{NOTSPACE:srcip}\\s+%{WORD:application_proto}\\s+%{GREEDYDATA}"
            "(?P<http_method>DELETE|POST)\\s+%{URIPATH:url}\\s+~>\\s+(?P<summary>%{INT:status_code}\\s+%{WORD})"
            "%{DATA} %{IP:dstip} %{DATA} hostname '(%{IP:srcip})?(%{GREEDYDATA:host})?'"
            "%{DATA}:%{DATA}%{IP:srcip}:%{INT:port}"
            "(%{DATA})? %{IP:srcip}"
            "%{IP:srcip} NOT allowed"
            "%{DATA} user %{WORD:username}"
            "(?P<log_desc>Disconnect|TableCleanup |EmailNotify|DelayedNotifications|DeleteParmFiles|SysCheck)?(?P<sym>:|.| )%{GREEDYDATA}"
            "(?P<task_id>T\\w+):\\s+%{GREEDYDATA:log_desc}"
            "Session\\s+%{INT:session_id}\\s+%{WORD}\\s+%{IP:srcip}\\s+%{GREEDYDATA}"
            "User\\s+%{WORD:username}\\s+%{GREEDYDATA}"
            "%{DATA}\\s+%{IP:srcip}:%{INT:port}"
            "ex %{INT:process_id} src %{INT:port} pth %{NOTSPACE:file_path} sz %{INT:file_size} %{TIMESTAMP_ISO8601} %{GREEDYDATA}"
            "%{INT}?(:|---|)\\s+%{GREEDYDATA:log_desc}"
            "(?P<log_desc>(Skipping.*|Not.*|FileWithThisStamp.*|Executed.*))"
            "%{DATA}\\s+-\\s%{IP:srcip}\\):\\s+%{GREEDYDATA}"
            "\\(%{DATA}\\s+%{NOTSPACE:session_id}\\s+-\\s%{IP:srcip}\\):\\s+%{GREEDYDATA}"
          ]
        }
        overwrite => [ "host","dstip","port", "srcip", "username", "version", "http_method", "action", "tgtip", "application_proto", "url", "status_code", "summary", "session_id", "file_path", "file_size", "log_desc", "process_id", "tgtport", "image_path", "task_id"]
        on_error => "grok_failed"
      }
    }

    if [EventReceivedTime] != "" {
      mutate {
        replace => {
          "event_received_time" => "%{EventReceivedTime}"
        }
      }
    }
    if [timestamp] != "" {
      date {
        match => ["timestamp", "MMM d HH:mm:ss","MMM dd HH:mm:ss","ISO8601", "yyyy-MM-dd HH:mm:ss","yyyy-MM-dd HH:mm:ss Z", "MM/dd/yyyy HH:mm:ss A","yy-MM-dd HH:mm:ss", "RFC3339", "yyyy-MM-ddTHH:mm:ss"]
        rebase => true
      }
    }
    if [event_received_time] != "" {
      date {
        match => ["event_received_time", "UNIX_MS", "dd/MM/yyyy HH:mm:ss", "yyyy-MM-dd HH:mm:ss", "MM/dd/yyyy HH:mm:ss A", "yyyy/MM/dd HH:mm:ss", "RFC3339","yyyy-MM-ddTHH:mm:ss"]
        target => "event.idm.read_only_udm.metadata.collected_timestamp"
      }
    }

    if [kv_data] != "" {
      mutate {
        gsub => ["kv_data",": ",":"]
      }
      mutate {
        gsub => ["kv_data","=",":"]
      }
      mutate {
        gsub => ["kv_data",", ",","]
      }
      mutate {
        gsub => ["kv_data",'\"',""]
      }
      kv {
        source => "kv_data"
        field_split => ","
        value_split => ":"
        on_error => "kv_data_failure"
      }
    }
    if [LogStamp] != "" {
      date {
        match => ["LogStamp", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601"]
        target => "event.idm.read_only_udm.metadata.collected_timestamp"
        on_error => "logstamp_date_failure"
      }
    }
    if [LogTime] != "" {
      date {
        match => ["LogTime", "yyyy-MM-dd HH:mm:ss.S", "ISO8601"]
        target => "event.idm.read_only_udm.metadata.collected_timestamp"
        on_error => "logtime_date_failure"
      }
    }
    if [TaskID] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{TaskID}"
        }
        on_error => "taskid_failure"
      }
    }
    if [NominalStart] != "" {
      date {
        match => ["NominalStart", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601"]
        target => "security_result.first_discovered_time"
        on_error => "nominalstart_date_failure"
      }
    }
    if [Action] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{Action}"
        }
        on_error => "action_failure"
      }
    }
    if [SourceHost] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{SourceHost}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{SourceHost}"
          "has_principal" => "true"
        }
        on_error => "sourcehost_failure"
      }
    }
    if [SourceFilename] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.file.full_path" => "%{SourceFilename}"
        }
        on_error => "srceFilename_failure"
      }
    }
    if [SourceFilenameOnly] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.file.names" => "SourceFilenameOnly"
        }
        on_error => "srceFilenameOnly_failure"
      }
    }
    if [SourceStamp] != "" {
      date {
        match => ["SourceStamp", "yyyy-MM-ddTHH:mm:ss", "ISO8601"]
        target => "security_result.last_discovered_time"
        on_error => "sourcestamp_date_failure"
      }
    }

    if [DestHost] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{DestHost}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{DestHost}"
          "has_target" => "true"
        }
        on_error => "desthost_failure"
      }
    }
    if [DestFilename] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{DestFilename}"
        }
        on_error => "destFilename_failure"
      }
    }
    if [DestFilenameOnly] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.file.names" => "DestFilenameOnly"
        }
        on_error => "destFilenameOnly_failure"
      }
    }
    if [TaskName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{TaskName}"
        }
        on_error => "taskname_failure"
      }
    }

    if [json_data] != "" {
      mutate {
        gsub => ["Message","\\r\\n"," "]
      }
      if [Message] != "" {
        mutate {
          gsub => ["Message"," ([A-Za-z0-9]+): "," #$1:"]
        }
        kv {
          source => "Message"
          field_split => "#"
          value_split => ":"
        }
      }
    }
    if [SourceModuleName] != "" {
      mutate {
        replace => {
          "source_module_name" => "%{SourceModuleName}"
        }
      }
    }
    if [SourceModuleType] != "" {
      mutate {
        replace => {
          "source_module_type" => "%{SourceModuleType}"
        }
      }
    }
    if [SourceName] != "" and [AgentBrand] == "" {
      mutate {
        replace => {
          "AgentBrand" => "%{SourceName}"
        }
      }
    }
    if [Severity] != "" {
      mutate {
        replace => {
          "log_level" => "%{Severity}"
        }
      }
    }
    if [Hostname] != "" {
      mutate {
        replace => {
          "principal_host" => "%{Hostname}"
        }
      }
    }
    if [Channel] not in ["","-"] {
      mutate {
        replace => {
          "Channel_label.key" => "Channel"
          "Channel_label.value" => "%{Channel}"
        }
      }
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "Channel_label"
        }
      }
    }
    if [AgentVersion] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_version" => "%{AgentVersion}"
        }
      }
    }
    if [IPAddress] != "" {
      grok {
        match => {
          "IPAddress" => "%{IP:prin_ip}"
        }
        overwrite => ["prin_ip"]
        on_error => "prin_ip_failure"
      }
      if [prin_ip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "prin_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "prin_ip"
          }
          on_error => "prin_ip_failure"
        }
        if ![prin_ip_failure] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    if [product_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_name" => "%{product_name}"
        }
      }
    }

    if [product_version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_version" => "%{product_version}"
        }
      }
    }
    if [action_performed] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{action_performed}"
        }
      }
    }
    if [principal_host] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{principal_host}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{principal_host}"
          "has_principal" => "true"
        }
      }
    }
    if [Username] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{Username}"
        }
      }
    }
    if [company_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.company_name" => "%{company_name}"
        }
      }
    }
    if [product_event] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event}"
        }
      }
    }
    if [dstip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dstip"
          "event.idm.read_only_udm.target.asset.ip" => "dstip"
        }
        on_error => "dstip_failure"
      }
      if ![dstip_failure] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [log_status] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{log_status}"
        }
      }
    }
    mutate {
      rename => {
        "Node" => "addition.Node"
        "SourceDuration" => "addition.SourceDuration"
        "DestDuration" => "addition.DestDuration"
        "ErrCode" => "addition.ErrCode"
        "SourceNBytes" => "addition.SourceNBytes"
        "NBytes" => "addition.NBytes"
        "AdminTrust" => "addition.AdminTrust"
        "Permission" => "addition.Permission"
      }
    }
   for key, value in addition map {
      mutate {
        replace => {
          "_field" => ""
          "_check" => ""
        }
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "value_conversion_error"
      }
      mutate {
        replace => {
          "_check" => "%{value}"
        }
        on_error => "no_value"
      }
      if ![no_value] and [_check] != "" {
        mutate {
          replace => {
            "_field.key" => "%{key}"
          }
          on_error => "key_replace_error"
        }
        if [key] in ["SourceDuration", "DestDuration" ] {
          mutate {
            replace => {
              "_field.value" => "%{value}"
            }
            on_error => "value_replace_error"
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "_field"
            }
            on_error => "detection_fields_merge_error"
          }
        }
        else if [key] in ["Node", "SourceNBytes"] {
          mutate {
            replace => {
              "_field.value" => "%{value}"
            }
            on_error => "value_not_found"
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "_field"
            }
            on_error => "principal_resource_merge_error"
          }
        }
        else if [key] == "NBytes" {
          mutate {
            replace => {
              "_field.value" => "%{value}"
            }
            on_error => "value_not_valid"
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "_field"
            }
            on_error => "target_resource_merge_error"
          }
        }
        else {
          mutate {
            replace => {
              "_field.value.string_value" => "%{value}"
            }
            on_error => "no_value_string"
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "_field"
            }
            on_error => "addition_merge_failed"
          }
        }
      }
    }
    if [ID] != ""  {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{ID}"
          "has_target_details" => "true"
        }
        on_error => "id_failure"
      }
    }
    if [InstID] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{InstID}"
        }
      }
    }

    if [FileID] != "" {
      mutate {
        replace => {
          "additional_id_2.key" => "FileID"
          "additional_id_2.value" => "%{FileID}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_id_2"
        }
      }
    }

    if [FolderID] != "" {
      mutate {
        replace => {
          "additional_id_3.key" => "FolderID"
          "additional_id_3.value" => "%{FolderID}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_id_3"
        }
      }
    }

    if [FileName] != "" and [FolderPath] != "" {
      mutate {
        replace => {
          "FolderPath" => "%{FolderPath}/%{FileName}"
        }
      }
    }

    if [FolderPath] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{FolderPath}"
        }
      }
    }

    if [FileName] != "" {
      mutate {
        replace => {
          "filename.key" => "FileName"
          "filename.value" => "%{FileName}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "filename"
        }
      }
    }

    if [host] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{host}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
          "has_principal" => "true"
        }
        on_error => "principal_host_failure"
      }
    }

    if [log_level] in ["INFO", "DEBUG"] {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [log_level] == "ERROR" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }

    mutate {
      replace => {
        "source_module_label.key" => "source_module_name"
        "source_module_label.value" => "%{source_module_name}"
      }
      on_error => "no_source_module_name"
    }

    if ![no_source_module_name] and [source_module_name] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.observer.resource.attribute.labels" => "source_module_label"
        }
      }
    }

    if [source_module_type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.application" => "%{source_module_type}"
        }
      }
    }

    if [log_msg] != "" and [http_method] != "GET" and [file_path] == "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{log_msg}"
        }
      }
    }
    else if [log_desc] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{log_desc}"
        }
      }
    }
    else if [description] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{description}"
        }
      }
    }

    if [port] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{port}"
        }
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
      }
    }

    if [tgtport] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{tgtport}"
        }
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
        on_error => "already_integer"
      }
    }

    if [package] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.command_line" => "%{package}"
        }
      }
    }

    if [srcip] != ""  {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "srcip"
          "event.idm.read_only_udm.principal.asset.ip" => "srcip"
        }
        on_error => "srcip_failure"
      }
      if ![srcip_failure] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [target_application] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{target_application}"
        }
        on_error => "target_application_failure"
      }
      if [target_application] =~ "(?i)SQL" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.resource_type" => "DATABASE"
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
    }

    if [username] != ""{
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{username}"
        }
      }
    }

    if [version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_version" => "%{version}"
        }
      }
    }

    if [http_method] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{http_method}"
        }
      }
    }

    if [action] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action}"
        }
      }
    }

    if [summary] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{summary}"
        }
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }

    if [tgtip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "tgtip"
          "event.idm.read_only_udm.target.asset.ip" => "tgtip"
        }
      }
    }

    if [application_proto] != "" {
      mutate {
        uppercase => ["application_proto"]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "%{application_proto}"
        }
      }
    }

    if [url] != ""{
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{url}"
        }
      }
    }

    if [status_code] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" => "%{status_code}"
        }
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
      }
    }

    if [file_path] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{file_path}"
        }
      }
    }

    if [file_size] != "" and [file_size] != "0" {
      mutate {
        convert => {
          "file_size" => "uinteger"
        }
      }
      mutate {
        rename => {
          "file_size" => "event.idm.read_only_udm.principal.process.file.size"
        }
      }
    }

    if [process_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{process_id}"
        }
      }
    }

    if [session_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.session_id" => "%{session_id}"
        }
      }
    }

    if [task_id] != "" {
      mutate {
        replace => {
          "additional_field.key" => "TASK_ID"
          "additional_field.value.string_value" => "%{task_id}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field"
        }
      }
    }
    if [Message] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{Message}"
        }
      }
    }
    if [AgentBrand] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{AgentBrand}"
        }
      }
    }

    if [Parm1] != "" {
      mutate {
        replace => {
          "additional_field_3.key" => "Parm1"
          "additional_field_3.value.string_value" => "%{Parm1}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_3"
        }
      }
    }
    if [Parm2] != "" {
      mutate {
        replace => {
          "additional_field_4.key" => "Parm2"
          "additional_field_4.value.string_value" => "%{Parm2}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_4"
        }
      }
    }
    if [Error] != "" {
      mutate {
        replace => {
          "additional_field_5.key" => "Error"
          "additional_field_5.value.string_value" => "%{Error}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_5"
        }
      }
    }

    if [XFerSize] != "" {
      mutate {
        replace => {
          "additional_field_1.key" => "XFerSize"
          "additional_field_1.value" => "%{XFerSize}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_field_1"
        }
      }
    }

    if [FolderPath] != "" {
      if [action_performed] =~  "(?i)Delete File" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "FILE_DELETION"
          }
        }
      }
      else if [action_performed] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
          }
        }
      }
    }
    else if [has_principal] == "true" and [has_target] == "true" and [application_proto] == "HTTP" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        }
      }
    }
    else if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_target_details] == "true" and [Action] != "sec_viewlog" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
    }
    else if [Action] == "sec_viewlog" and [has_target_details] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else if [Username] != "" or [username] != ""{
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else if [target_application] =~ "(?i)SQL"{
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "IPS"
      "event.idm.read_only_udm.metadata.product_name" => "IPSWITCH MOVEIT TRANSFER"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
