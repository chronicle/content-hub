# Google SecOps Default CBN Parser (IPSWITCH_MOVEIT_TRANSFER)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/IPSWITCH_MOVEIT_TRANSFER/default/ipswitch_moveit_transfer.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "IPSWITCH"
      "event.idm.read_only_udm.metadata.product_name" => "IPSWITCH_MOVEIT_TRANSFER"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
