# Product: Netwrix
# Category: Web Server
# Supported Format: JSON
# Last Updated: 2024-05-23
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "event_type" => ""
      "about" => ""
      "security_result" => ""
      "date" => ""
      "action" => ""
      "application_name" => ""
      "summary" => ""
      "device_name" => ""
      "service_failed" => ""
      "allow_connection_with_desktop" => ""
      "service_account" => ""
      "file_path" => ""
      "service_type" => ""
      "start_mode" => ""
      "timestamp_ms" => ""
      "timestamp" => ""
      "action_details" => ""
      "message_data" => ""
      "backup_name" => ""
      "session_ID" => ""
      "details_is_kv_data" => ""
      "Hostname" => ""
      "Keywords" => ""
      "SeverityValue" => ""
      "Task"  => ""
      "EventID"   => ""
      "RecordNumber" => ""
      "ProcessID" => ""
      "ThreadID"  => ""
      "Channel" => ""
      "Opcode" => ""
      "EventReceivedTime" => ""
      "SourceModuleName"  => ""
      "SourceModuleType"  => ""
      "EventTime" => ""
      "EventType" => ""
      "DataSource" => ""
      "Action" => ""
      "Message" => ""
      "Where" => ""
      "ObjectType" => ""
      "Who" => ""
      "What" => ""
      "When" => ""
      "Workstation" => ""
      "Details" => ""
      "Notice" => ""
      "Cause" => ""
      "Description" => ""
      "Device name" => ""
      "Size" => ""
      "Type" => ""
      "Triggers" => ""
      "Session ID" => ""
      "Caption" => ""
      "Added" => ""
      "Removed" => ""
      "Name" => ""
      "SourceName" => ""
    }
  }

  mutate {
    gsub => ["message","message","message_data"]
  }
  mutate {
    gsub => ["message","\"Message\"","\"message_data\""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [Hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{Hostname}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{Hostname}"
        "target_machine_id_present" => "true"
      }
      on_error => "hostname_invalid"
    }
  }

  if [Keywords] != "" {
    mutate {
      convert => {
        "Keywords" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "keywords_label.key" => "Keywords"
        "keywords_label.value" => "%{Keywords}"
      }
      on_error => "no_keywords_found"
    }
    if ![no_keywords_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "keywords_label"
        }
        on_error => "Keywords_not_present"
      }
    }
  }

  if [Severity] =~ "(?i)Info" or [SeverityValue] in [ 1, 2, 3 ] {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [Severity] =~ "(?i)Error" or [SeverityValue] == 4 {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }
  else if [Severity] =~ "(?i)Critical" or [SeverityValue] == 5 {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }
  else if [Severity] =~ "(?i)Warning" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else {
    mutate {
      replace => {
        "security_result.severity" => "UNKNOWN_SEVERITY"
      }
    }
  }

  if [EventID] != "" {
    mutate {
      convert => {
        "EventID" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{EventID}"
      }
      on_error => "event_id_not_present"
    }
  }

  if [SourceName] != "" {
    mutate {
      replace => {
        "source_name_label.key" => "Source_Name"
        "source_name_label.value" => "%{SourceName}"
      }
      on_error => "no_source_name_label"
    }
    if ![no_source_name_label] {
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "source_name_label"
        }
        on_error => "source_name_not_present"
      }
    }
  }

  if [Task] != "" {
    mutate {
      convert => {
        "Task" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "task_label.key" => "Task"
        "task_label.value.string_value" => "%{Task}"
      }
      on_error => "no_task_found"
    }
    if ![no_task_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "task_label"
        }
        on_error => "no_task_label"
      }
    }
  }

  if [RecordNumber] != "" {
    mutate {
      convert => {
        "RecordNumber" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "record_number_label.key" => "RecordNumber"
        "record_number_label.value" => "%{RecordNumber}"
      }
      on_error => "invalid_RecordNumber"
    }
    if ![invalid_RecordNumber] {
      mutate {
        merge => {
          "security_result.detection_fields" => "record_number_label"
        }
        on_error => "invalid_record_number_label"
      }
    }
  }

  if [ProcessID] != "" {
    mutate {
      convert => {
        "ProcessID" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{ProcessID}"
      }
      on_error => "no_process_id_present"
    }
  }

  if [EventTime] != "" {
    mutate {
      convert => {
        "EventTime" => "string"
      }
      on_error => "eventTime_already_string"
    }
    mutate {
      replace => {
        "timestamp_ms" => "%{EventTime}"
      }
      on_error => "invalid_event_time"
    }
  }
  if [timestamp_ms] != "" {
    date {
      match => ["timestamp_ms", "UNIX_MS"]
      on_error => "timestamp_ms_failure"
    }
  } else {
      date {
        match => ["ts", "UNIX", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS Z", "yyyy-MM-dd HH:mm:ss Z"]
        on_error => "ts_failure"
      }
  }

  if [ThreadID] != ""{
    mutate {
      convert => {
        "ThreadID" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "ThreadID_label.key" => "ThreadID"
        "ThreadID_label.value" => "%{ThreadID}"
      }
      on_error => "invalid_ThreadID"
    }
    if ![invalid_ThreadID] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ThreadID_label"
        }
        on_error => "invalid_ThreadID_label"
      }
    }
  }

  if [Channel] not in ["", "-"] {
    mutate {
      replace => {
        "channel_label.key" => "Channel"
        "channel_label.value" => "%{Channel}"
      }
      on_error => "no_channel_available"
    }
    if [no_channel_available] != "" {
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "channel_label"
        }
        on_error => "invalid_channel_label"
      }
    }
  }

  if [message_data] != "" {
    mutate {
      gsub => ["message_data", "Message: ", "Message : "]
    }
    mutate {
      gsub => ["message_data","Triggers:\\n- ","Triggers: "]
    }
    mutate {
      gsub => ["message_data","\\n- ","$"]
    }
    mutate {
      gsub => ["message_data", " : ", "="]
    }
    mutate {
      gsub => ["message_data", "\\n", "#"]
    }
    mutate {
        gsub => ["message_data", "([A-Za-z0-9]+)=", "#$1="]
    }
    kv {
      source => "message_data"
      field_split => "#"
      value_split => "="
      on_error => "kv_failed"
    }

    if [DataSource] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_name" => "%{DataSource}"
        }
        on_error => "not_datasource"
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_name" => "Netwrix"
        }
        on_error => "invalid_name"
      }
    }

    if [Message] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{Message}"
        }
        on_error => "no_message"
      }
    }

    if [Where] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{Where}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{Where}"
        }
        on_error => "server_instance_name_not_present"
      }
    }

    if [Who] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.user_display_name" => "%{Who}"
        }
        on_error => "no_user_display_name"
      }
    }

    if [When] != "" {
      mutate {
        replace => {
          timestamp => "%{When}"
        }
        on_error => "timestamp_error"
      }
      if ![timestamp_error] {
        date {
          match => ["timestamp", "RFC3339", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss"]
          on_error => "no_proper_time_format"
        }
        if [no_proper_time_format] {
          mutate {
            replace => {
             "timestamp_failure" => "true"
            }
            on_error => "invalid_timestamp"
          }
        }
      }
    }

    if [What] !="" {
      mutate {
        replace => {
          "database_label.key" => "DATABASE"
          "database_label.value.string_value" => "%{What}"
        }
        on_error => "no_database_label"
      }
      if ![no_database_label] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "database_label"
          }
          on_error => "invalid_database_label"
        }
      }
    }

    if [Workstation] not in ["", "-"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{Workstation}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{Workstation}"
          "has_principal" => "true"
        }
        on_error => "Workstation_empty"
      }
    }

    if [Action] == "Successful Logon" {
      mutate {
        replace => {
          "action" => "ALLOW"
          "security_result.summary" => "%{Action}"
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
        on_error => "invalid_login_action"
      }
    }
    else if [Action] == "Failed Logon" {
      mutate {
        replace => {
          "action" => "BLOCK"
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
      if [summary] != "" {
        mutate {
          replace => {
            "security_result.summary" => "%{summary}"
          }
          on_error => "invalid_summary"
        }
      }
    }
    else if [Action] == "Modified" {
      mutate {
        replace => {
          "action" => "ALLOW_WITH_MODIFICATION"
          "action_details" => "%{Action}"
        }
        on_error => "invalid_modify_action"
      }
    }
    else if [Action] == "Added" {
      mutate {
        replace => {
          "action_details" => "%{Action}"
        }
        on_error => "invalid_add_action"
      }
    }
    else if [Action] == "Removed" {
      mutate {
        replace => {
          "action_details" => "%{Action}"
        }
        on_error => "invalid_remove_action"
      }
    }

    if [action] !="" {
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "invalid_action"
      }
    }

    if [action_details] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action_details}"
        }
        on_error => "invalid_action_details"
      }
    }


    if [ObjectType] != "" {
      mutate {
        replace => {
          "object_type.key" => "ObjectType"
          "object_type.value" => "%{ObjectType}"
        }
        merge => {
          "security_result.about.labels" => "object_type"
        }
        on_error => "no_object_type"
      }
    }
  }

  if [Details] != "" {
      mutate {
        gsub => ["Details", ": ", "="]
      }
      mutate {
       gsub => ["Details", ", ", "#"]
      }
      mutate {
       gsub => ["Details", "Application Name", "application_name"]
      }
      mutate {
       gsub => ["Details", "Backup name", "backup_name"]
      }
      mutate {
       gsub => ["Details", "Device name", "device_name"]
      }
      mutate {
       gsub => ["Details", "Session ID", "session_ID"]
      }
      mutate {
       gsub => ["Details", "Action in case of failed service startup", "service_failed"]
      }
      mutate {
       gsub => ["Details", "Allow service to interact with desktop", "allow_connection_with_desktop"]
      }
      mutate {
        gsub => ["Details","Path to executable","file_path"]
      }
      mutate {
        gsub => ["Details","Service Account","service_account"]
      }
      mutate {
        gsub => ["Details","Service Type","service_type"]
      }
      mutate {
        gsub => ["Details","Start Mode","start_mode"]
      }
      kv {
        source => "Details"
        field_split => "#"
        value_split => "="
        on_error => "not_kv_data"
      }
      if [application_name] != "" {
        mutate {
          replace => {
           "event.idm.read_only_udm.target.application" => "%{application_name}"
           "details_is_kv_data" => "true"
          }
          on_error => "no_application_name"
        }
      }

      if [Notice] != "" {
        mutate {
          replace => {
            "notice_label.key" => "Notice"
            "notice_label.value.string_value" => "%{Notice}"
            "details_is_kv_data" => "true"
          }
          on_error => "no_notice_label"
        }
        if ![no_notice_label] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "notice_label"
            }
            on_error => "invalid_notice_label"
          }
        }
      }

      if [Cause] != "" {
        mutate {
          replace => {
            "summary" => "%{Cause}"
            "details_is_kv_data" => "true"
          }
          on_error => "no_failure"
        }
      }

      if [backup_name] !="" {
        mutate {
          replace => {
            "security_result.description" => "%{backup_name}"
            "details_is_kv_data" => "true"
           }
          on_error => "Backup_empty"
        }
      }

      if [Description] != "" {
        mutate {
          gsub => ["Description",'\\"',""]
        }
        mutate {
          replace => {
            "description_label.key" => "Description"
            "description_label.value.string_value" => "%{Description}"
            "details_is_kv_data" => "true"
          }
          on_error => "no_description_label"
        }
        if ![no_description_label] and [description_label][value][string_value] !=""{
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "description_label"
            }
            on_error => "not_description_label"
          }
        }
      }

      if [device_name] != "" {
        mutate {
          gsub => ["device_name",'\\"',""]
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{device_name}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{device_name}"
            "details_is_kv_data" => "true"
          }
          on_error => "device_name_not_present"
        }
      }

      if [Size] != "" {
        mutate {
          gsub => ["Size",'\\"',""]
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.size" => "%{Size}"
            "details_is_kv_data" => "true"
          }
          on_error => "size_not_present"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.target.file.size" => "uinteger"
          }
          on_error => "already_integer"
        }
      }

      if [Type] != "" {
        mutate {
          gsub => ["Type",'\\"',""]
        }
        mutate {
          replace => {
            "type_label.key" => "Type"
            "type_label.value" => "%{Type}"
            "details_is_kv_data" => "true"
          }
          on_error => "invalid_type"
        }
        if not [invalid_type] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "type_label"
            }
            on_error => "invalid_type_label"
          }
        }
      }

      if[Triggers] != "" {
        kv {
          source => "Triggers"
          field_split => "$"
          value_split => "="
          on_error => "not_kv_data1"
        }
        if [Added] != "" {
          mutate {
            replace => {
              "added_label.key" => "Added"
              "added_label.value.string_value" => "%{Added}"
              "details_is_kv_data" => "true"
            }
            on_error => "no_added_label"
          }
          if ![no_added_label] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "added_label"
              }
              on_error => "invalid_added_label"
            }
          }
        }
        if [Removed] != "" {
          mutate {
            replace => {
              "removed_label.key" => "Removed"
              "removed_label.value.string_value" => "%{Removed}"
              "details_is_kv_data" => "true"
            }
            on_error => "no_removed_label"
          }
          if ![no_removed_label] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "removed_label"
              }
              on_error => "invalid_removed_label"
            }
          }
        }
      }

      if [session_ID] != "" {
        mutate {
          replace => {
            "session_id_label.key" => "Session ID"
            "session_id_label.value" => "%{session_ID}"
            "details_is_kv_data" => "true"
          }
          on_error => "session_id_not_present"
        }
        if ![session_id_not_present] {
          mutate {
            merge => {
              "security_result.detection_fields" => "session_id_label"
            }
            on_error => "no_session_id"
          }
        }
      }

      if [service_failed] != "" {
        mutate {
          replace => {
            "security_result.description" => "%{service_failed}"
            "details_is_kv_data" => "true"
          }
          on_error => "service_not_failed"
        }
      }

      if [allow_connection_with_desktop] != "" {
        mutate {
          replace => {
            "desktop_label.key" => "Allow service to interact with desktop"
            "desktop_label.value" => "%{allow_connection_with_desktop}"
            "details_is_kv_data" => "true"
          }
          on_error => "no_desktop_label"
        }
        if ![no_desktop_label] {
          mutate {
            merge => {
              "security_result.detection_fields" => "desktop_label"
            }
            on_error => "not_desktop_label"
          }
        }
      }

      if [Caption] != "" {
        mutate {
          replace => {
            "caption_label.key" => "Caption"
            "caption_label.value" => "%{Caption}"
            "details_is_kv_data" => "true"
          }
          on_error => "no_caption"
        }
        if ![no_caption] {
          mutate {
            merge => {
              "about.resource.attribute.labels" => "caption_label"
            }
            on_error => "invalid_caption"
          }
        }
      }

      if [Name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.resource.name" => "%{Name}"
            "details_is_kv_data" => "true"
          }
          on_error => "name_error"
        }
      }

      if [file_path] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{file_path}"
            "details_is_kv_data" => "true"
          }
          on_error => "file_path_not_present"
        }
      }

      if [service_account] != "" {
        mutate {
          replace => {
            "service_account_label.key" => "Service Account"
            "service_account_label.value" => "%{service_account}"
            "details_is_kv_data" => "true"
          }
          on_error => "no_service_account"
        }
        if ![no_service_account] {
          mutate {
            merge => {
              "security_result.detection_fields" => "service_account_label"
            }
            on_error => "no_service_label"
          }
        }
      }

      if [service_type] != "" {
        mutate {
          replace => {
            "service_type_label.key" => "Service Type"
            "service_type_label.value.string_value" => "%{service_type}"
            "details_is_kv_data" => "true"
          }
          on_error => "no_service_type"
        }
        if ![no_service_type] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "service_type_label"
            }
            on_error => "not_service_type"
          }
        }
      }

      if [start_mode] !="" {
        mutate {
          replace => {
            "start_mode_label.key" => "Start Mode"
            "start_mode_label.value" => "%{start_mode}"
            "details_is_kv_data" => "true"
          }
          on_error => "start_mode_not_present"
        }
        if ![start_mode_not_present] {
          mutate {
            merge => {
              "about.labels" => "start_mode_label"
            }
            on_error => "not_start_mode"
          }
        }
      }

      if [details_is_kv_data] == "" {
        mutate {
          replace => {
            "details_label.key" => "Details"
            "details_label.value.string_value" => "%{Details}"
          }
          on_error => "no_details_label"
        }
        if ![no_details_label] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "details_label"
            }
            on_error => "not_details_label"
          }
        }
      }
    }


  if [Opcode] != "" {
    mutate {
      replace => {
        "opCode_label.key" => "Opcode"
        "opCode_label.value" => "%{Opcode}"
      }
      on_error => "opCode_label_not_present"
    }
    if ![opCode_label_not_present] {
      mutate {
        merge => {
          "about.labels" => "opCode_label"
        }
        on_error => "invalid_about_labels"
      }
    }
  }


  if [SourceModuleName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{SourceModuleName}"
      }
      on_error => "no_source_module_name"
    }
  }


  if [SourceModuleType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.application" => "%{SourceModuleType}"
      }
      on_error => "not_source_module_type"
    }
  }


  if [EventType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{EventType}"
      }
      on_error => "Event_type_not present"
    }
  }

  if [EventType] == "VERBOSE" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "Configuration"
      }
    }
  }


  if [EventReceivedTime] != "" {
      mutate {
        convert => {
          "EventReceivedTime" => "string"
        }
        on_error => "already_string"
      }
      date {
        match => ["EventReceivedTime","yyyy-MM-dd HH:mm:ss","UNIX_MS"]
        target => "metadata.collected_timestamp"
        on_error => "invalid_collected_timestamp"
      }
  }


  if [event_type] == "" and [event][idm][read_only_udm][target][resource] != ""{
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
      on_error => "invalid_event_type"
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Netwrix"
    }
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_empty"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "invalid_security_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

