# Product: PROOFPOINT_WEB_BROWSER_ISOLATION
# Category: ATTACK PROTECTION ISOLATION
# Supported Format: JSON
# Reference: NA
# Last Updated: 2023-05-25
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "categories" => ""
      "date" => ""
      "disposition" => ""
      "region" => ""
      "url" => ""
      "userId" => ""
      "userName" => ""
      "zone" => ""
      "parentPageURL" => ""
      "security_result" => ""
      "classification" => ""
      "event_type" => ""
      "detection_fields" => ""
      "category_fields" => ""
      "security_result_action" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [date] != "" {
    date {
      match => ["date", "ISO8601"],
      on_error => "no_proper_format"
    }
  }

  if [userId] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{userId}"
      }
    }
  }

  if [userName] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{userName}"
      }
    }
  }

  if [url] != "" {
    mutate{
      replace => {
        "target.url" => "%{url}"
      }
    }
  }

  if [region] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{region}"
      }
    }
  }

  if [zone] != "" {
    mutate {
      replace => {
        "principal.location.name" => "%{zone}"
      }
    }
  }

  if [classification] not in ["","null"] {
    mutate {
      replace => {
        "detection_fields.key" => "Classification"
        "detection_fields.value" => "%{classification}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "detection_fields"
      }
    }
  }

  if [disposition] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{disposition}"
      }
    }
    if [disposition] =~ "ALLOW" {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
      }
    }
    else if [disposition] =~ "BLOCK" {
      mutate {
        replace => {
          "security_result_action" => "BLOCK"
        }
      }
    }
    if [security_result_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
      }
    }
  }

  if [categories] != "" {
    for index,category in categories {
      if [index] == 0 {
        mutate {
          replace => {
            "category_fields" => "%{category}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "category_fields" => "%{category_fields},%{category}"
          }
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type"
        => "%{category_fields}"
      }
    }
  }

  if [parentPageURL] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.url_back_to_product"
        => "%{parentPageURL}"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "PROOFPOINT_WEB_BROWSER_ISOLATION"
      "event.idm.read_only_udm.metadata.vendor_name" => "PROOFPOINT_WEB_BROWSER_ISOLATION"
      "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
