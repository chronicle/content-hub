# Product: ZIMPERIUM
# Category: Mobile Device Management
# Supported Format: SYSLOG + JSON
# Reference: https://www.zimperium.com/mtd/
# Last Updated: 2026-06-18
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "rule_id" => ""
      "event_type" => ""
      "content" => ""
      "passetip" => ""
      "intermediary_host" => ""
      "forensics.sideloaded_app_name" => ""
      "threat.general.sideloaded_app_name" => ""
      "file_hash" => ""
      "hash_file" => ""
      "event.idm.read_only_udm.metadata.vendor_name" => "Zimperium"
      "event.idm.read_only_udm.metadata.product_name" => "MTD (Mobile Threat Defense)"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "additional_public_forensics" => ""
      "device_info_imei" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "risk_posture" => ""
      "threat.general.ip_of_detected_url" => ""
      "threat.general.android_enterprise_management_state" => ""
      "threat.general.android_enterprise_access_network_states" => ""
      "forensics_baseline_traceroute" => ""
      "forensics_mitm_traceroute" => ""
      "threat_general_action_triggered" => ""
      "program" => ""
      "forensics_network_threat_arp_tables_before" => ""
      "device_info_device_id" => ""
      "threat_general_threat_type" => ""
      "threat_general_detected_url" => ""
      "threat_general_network" => ""
      "threat_general_network_bssid" => ""
      "forensics_attack_time_date" => ""
      "device_info_os" => ""
      "email_addresses" => ""
      "device_info_mdm_device_id" => ""
      "threat_general_attacker_ssid" => ""
      "threat_general_attacker_bssid" => ""
      "device_info_tag1" => ""
      "device_info_tag2" => ""
      "threat_general_external_ip" => ""
      "device_mac" => ""
      "device_manufacturer" => ""
      "cn_frequency_value" => ""
      "about" => ""
      "collection_time" => ""
      "threat_general_android_enterprise_management_state" => ""
      "name" => ""
      "val" => ""
      "close_network_BSSID" => ""
      "data1_User" => ""
      "device_info_mdm_alt_ids_id" => ""
      "device_info_mdm_alt_ids_serialnumber" => ""
      "device_info_mdm_alt_ids_uuid" => ""
      "threat_status" => ""
      "threat_mitigation_reason" => ""
      "threat_general_ip_of_detected_url" => ""
      "threat_general_android_enterprise_access_network_states" => ""
      "valid_email" => ""
      "threat_general_time_interval" => ""
      "user_info_user_role" => ""
      "has_target" => "false"
      "device_mac_address" => ""
      "closenetwork_SSID" => ""
      "closenetwork_level" => ""
      "closenetwork_frequency" => ""
      "closenetwork_capabilities" => ""
      "threat_general_network_interface" => ""
      "threat_general_gateway_ip" => ""
      "threat_general_gateway_ip_ip" => ""
      "threat_ip" => ""
      "forensics_network_threat_my_ip" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", ""]
  }
  mutate {
    gsub => [ "message", "\\$date", "date"]
  }

  grok {
    match => {
      "message" => [
        "(?:%{DATA}\\s+)?<%{DATA:rule_id}>%{INT}\\s+%{TIMESTAMP_ISO8601}\\s+%{DATA:intermediary_host}\\s+%{DATA}\\s+-\\s+%{DATA:event_type}\\s+-%{GREEDYDATA:content}"
        "(?:%{DATA}\\s+)?<%{DATA:rule_id}>%{INT}\\s+%{TIMESTAMP_ISO8601}\\s+%{DATA:intermediary_host}\\s+%{DATA}\\s+-\\s+%{DATA:event_type}\\s+-\\s+%{GREEDYDATA:content}"
        "<%{POSINT:rule_id}>%{SYSLOGTIMESTAMP:collection_time}\\s+%{HOST:intermediary_host}\\s+%{WORD:program}\\s+%{GREEDYDATA:content}"
      ]
    }
    overwrite => [ "rule_id", "event_type", "content", "intermediary_host", "program", "collection_time"]
    on_error => "MALFORMED_LOG_LINE"
  }

  if [program] != "" {
    mutate {
      replace => {
        "intermediary.application" => "%{program}"
      }
      on_error => "no_program"
    }
  }
  if [collection_time] != "" {
    date {
      match => [ "collection_time", "MMM  d HH:mm:ss" , "ISO8601"]
      rebase => true
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_collection_time_event_timestamp"
    }
  }
  mutate {
    replace => {
      "sr.rule_id" => "%{rule_id}"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
    }
  }

  if [intermediary_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_host}"
      }
      on_error => "no_host"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "match_error"
    }
  }


  mutate {
    replace => {
      "system_token" => ""
      "severity" => ""
      "event_id" => ""
      "forensics" => ""
      "mitigated" => ""
      "location" => ""
      "eventtimestamp" => ""
      "user_info" => ""
      "device_owner" => ""
      "device_info" => ""
      "d_name" => ""
      "threat" => ""
      "account_id" => ""
      "team_id" => ""
      "team_name" => ""
      "user" => ""
      "action" => ""
      "date" => ""
      "profile_name" => ""
      "profile_external_id" => ""
      "profile_category" => ""
      "profile_description" => ""
      "profile_information" => ""
      "forensics.os" => ""
      "device_info.mdm_device_id" => ""
      "description" => ""
      "userip" => ""
      "device_info.device_group_id" => ""
    }
  }

  mutate {
    replace => {
      "forensics.severity" => ""
      "device_owner.id" => ""
      "device_owner.email" => ""
      "device_owner.firstName" => ""
      "device_owner.middleName" => ""
      "device_owner.lastName" => ""
      "device_owner.first_name" => ""
      "device_owner.middle_name" => ""
      "device_owner.last_name" => ""
      "device_info.jailbroken" => ""
      "user_info.user_id" => ""
      "user_info.user_email" => ""
      "user_info.first_name" => ""
      "user_info.middle_name" => ""
      "user_info.last_name" => ""
      "sideloaded_app_filehash_data" => ""
      "forensics.time_interval" => ""
      "threat.general.time_interval" => ""
      "device_info.os" => ""
      "forensics.os" => ""
      "threat_general_device_time" => ""
      "data_key" => ""
      "data_value" => ""
    }
  }

  json {
    source => "content"
    array_function => "split_columns"
    on_error => "not_json"
  }


  if [risk_posture] != "" {
    mutate {
      convert => {
        "risk_posture" => "string"
      }
      on_error => "risk_posture_is_string"
    }
    mutate {
      replace => {
        "risk_posture_label.key" => "risk_posture"
        "risk_posture_label.value.string_value" => "%{risk_posture}"
      }
      on_error => "no_risk_posture"
    }
    if ![no_risk_posture] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "risk_posture_label"
        }
        on_error => "risk_posture_label_merge_error"
      }
    }
  }

# ------------------------------------------  AUDIT EVENTS  ------------------------------------------ #
  if [event_type] == "AUDIT" {
    mutate {
      replace => {
        "description"      => ""
        "userip"        => ""
        "sample"        => ""
      }
    }
    if [date] != "" {
      mutate {
        gsub => [ "date", " UTC", ""]
      }

      date {
        match => [ "date", "MM dd yyyy HH:mm:ss"]
        target => "@timestamp"
        on_error => "invalid_date_format"
      }
    }

    grok {
      match => {
        "action" => [
          "%{DATA:description}\\s+\\(Sample: %{DATA:sample}\\)$"
          "%{DATA:description}\\s+\\(%{IPV4:userip}(?:,\\s*%{IPV4})?\\)$"
          "%{DATA:description}\\s+\\(%{DATA:sample}\\)$"
          "%{DATA:description}\\s+%{IPV4:userip}$"
        ]
      }
      overwrite => [ "description", "userip", "sample"]
      on_error => "MALFORMED_LOGIN_GROK"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid"  => "%{user}"
        "sr.description"                => "%{description}"
      }
    }
    if [description] in ["UserLogin", "User Login"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type"  => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
          "tip"                      => "%{userip}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip"       => "tip"
          "event.idm.read_only_udm.target.asset.ip" => "tip"
        }
        on_error => "tip_replacement_error"
      }
    }
    else if [description] != "" {
      mutate {
        replace => {
          "sample_label.key"  => "Sample"
          "sample_label.value.string_value" => "%{sample}"
        }
        on_error => "sample_field_not_found"
      }
      if ![sample_field_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "sample_label"
          }
          on_error => "sample_label_merge_error"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about"
        }
        on_error => "about_is_null"
      }
    }
  }
# ------------------------------------------  END OF AUDIT EVENTS  ------------------------------------------ #

# ------------------------------------------  THREAT EVENTS  ------------------------------------------ #
  if [event_type] == "THREAT" or [event_type] == "" {
    grok {
      match => {
        "action" => [
          "%{DATA:description}\\s+\\(%{IPV4:userip}(?:,\\s*%{IPV4})?\\)$"
        ]
      }
      overwrite => [ "description", "userip"]
      on_error => "malformed_threat_grok"
    }
    if [description] in ["UserLogin", "User Login"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type"  => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
      if [userip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "userip"
            "event.idm.read_only_udm.target.asset.ip" => "userip"
          }
          on_error => "userip_is_null"
        }
        if ![userip_is_null] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
    mutate {
      replace => {
        "ar.name" => "%{system_token}"
      }
      on_error => "no_system_token"
    }
    if ![no_system_token] and [system_token] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.group.attribute.roles" => "ar"
        }
        on_error => "field_not_found_1"
      }
    }

    mutate {
      convert => {
        "severity" => "string"
      }
      on_error => "no_severity"
    }
    if ![no_severity] {
      mutate {
        replace => {
          "sr.severity_details" => "%{severity}"
        }
        on_error => "field_not_found_2"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id"  => "%{event_id}"
      }
      on_error => "no_event_id"
    }

      mutate {
        replace => {
          "forensics_baseline_traceroute" => "%{forensics.baseline_traceroute}"
        }
        on_error => "forensics_baseline_traceroute_replace_error"
      }
      if [forensics_baseline_traceroute] != "" {
        mutate {
          replace => {
            "baseline_traceroute_label.key" => "baseline_traceroute"
            "baseline_traceroute_label.value.string_value" => "%{forensics_baseline_traceroute}"
          }
          on_error => "no_baseline_traceroute"
        }
        if ![no_baseline_traceroute] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "baseline_traceroute_label"
            }
            on_error => "baseline_traceroute_label_merge_failure"
          }
        }
      }
      mutate {
        replace => {
          "forensics_mitm_traceroute" => "%{forensics.mitm_traceroute}"
        }
        on_error => "forensics_mitm_traceroute_replace_error"
      }
      if [forensics_mitm_traceroute] != "" {
        mutate {
          replace => {
            "mitm_traceroute_label.key" => "mitm_traceroute"
            "mitm_traceroute_label.value.string_value" => "%{forensics_mitm_traceroute}"
          }
          on_error => "no_mitm_traceroute"
        }
        if ![no_mitm_traceroute] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "mitm_traceroute_label"
            }
            on_error => "mitm_traceroute_label_merge_failure"
          }
        }
      }
      if [forensics][severity] == "IMPORTANT" {
        mutate {
          replace => {
            "sr.severity"  => "HIGH"
          }
        }
      }
      mutate {
        convert => {
          "forensics.severity" => "string"
        }
        on_error => "fsseverity_is_string"
      }
      mutate {
        replace => {
          "forensics_sev_label.key" => "forensics_severity"
          "forensics_sev_label.value.string_value" => "%{forensics.severity}"
        }
        on_error => "no_forensics_sev"
      }
      if ![no_forensics_sev] and [forensics][severity] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "forensics_sev_label"
          }
          on_error => "merge_failure"
        }
      }
      mutate {
        convert => {
          "forensics.os" => "string"
        }
        on_error => "fos_is_string"
      }
      mutate {
        uppercase => ["forensics.os"]
      }
      if [forensics][os] == "IOS" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.platform_software.platform" => "IOS"
          }
          on_error => "no_forensics_os_1_err"
        }
      } else if [forensics][os] == "ANDROID" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.platform_software.platform" => "ANDROID"
          }
          on_error => "no_forensics_os_2_err"
        }
      }
      else if [forensics][os] == "WINDOWS" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.platform_software.platform" => "WINDOWS"
          }
          on_error => "no_forensics_os_3_err"
        }
      }
      else if [forensics][os] == "LINUX" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.platform_software.platform" => "LINUX"
          }
          on_error => "no_forensics_os_4_err"
        }
      }
      else if [forensics][os] == "MAC" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.platform_software.platform" => "MAC"
          }
          on_error => "no_forensics_os_5_err"
        }
      }
      else if [forensics][os] != "" {
        mutate {
          replace => {
            "forensics_os_label.key" => "forensics_os"
            "forensics_os_label.value.string_value" => "%{forensics.os}"
          }
          on_error => "no_forensics_os_3_err"
        }
        if ![no_forensics_os_3_err] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "forensics_os_label"
            }
            on_error => "forensics_os_label_merge_failure"
          }
        }
      }
      if [forensics][time_interval] != "" {
        mutate {
          convert => {
            "forensics.time_interval" => "string"
          }
          on_error => "forensics_time_interval_is_string"
        }
        mutate {
          replace => {
            "forensics_time_interval_label.key" => "forensics_time_interval"
            "forensics_time_interval_label.value.string_value" => "%{forensics.time_interval}"
          }
          on_error => "no_forensics_time_interval"
        }
        if ![no_forensics_time_interval] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "forensics_time_interval_label"
            }
            on_error => "forensics_time_interval_label_merge_failure"
          }
        }
      }
      mutate {
        replace => {
          "threat_general_time_interval" => "%{threat.general.time_interval}"
        }
        on_error => "threat_general_time_interval_replace_error"
      }
      if [threat_general_time_interval] != "" {
        mutate {
          replace => {
            "threat_general_time_interval_label.key" => "threat_general_time_interval"
            "threat_general_time_interval_label.value.string_value" => "%{threat_general_time_interval}"
          }
          on_error => "no_threat_general_time_interval"
        }
        if ![no_threat_general_time_interval] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "threat_general_time_interval_label"
            }
            on_error => "threat_general_time_interval_label_merge_failure"
          }
        }
      }
      mutate {
        convert => {
          "forensics.attack_time.date" => "string"
        }
        on_error => "attack_time_is_string"
      }
      mutate {
        replace => {
          "forensics_attack_time_date" => "%{forensics.attack_time.date}"
        }
        on_error => "forensics_attack_time_date_replace_error"
      }
      if [forensics_attack_time_date] != "" {
        mutate {
          replace => {
            "attack_time_label.key" => "attack_time"
            "attack_time_label.value.string_value" => "%{forensics_attack_time_date}"
          }
          on_error => "no_attack_time"
        }
        if ![no_attack_time] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "attack_time_label"
            }
            on_error => "attack_time_label_merge_failure"
          }
        }
      }
      mutate {
        replace => {
          "threat_general_external_ip" => "%{threat.general.external_ip}"
        }
        on_error => "threat_general_external_ip_replace_error"
      }
      if [threat_general_external_ip] != "" {
        grok {
          match => {
            "threat_general_external_ip" => "%{IP:threat_general_external_ip}"
          }
          overwrite => ["threat_general_external_ip"]
          on_error => "threat_general_external_ip_not_ip"
        }
        if ![threat_general_external_ip_not_ip] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "threat_general_external_ip"
              "event.idm.read_only_udm.principal.asset.ip" => "threat_general_external_ip"
            }
            on_error => "threat_general_external_ip_merge_failure"
          }
          if ![threat_general_external_ip_merge_failure] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
      mutate {
        replace => {
          "profile_name_label.key"    => "Profile Name"
          "profile_name_label.value.string_value"   => "%{forensics.suspicious_profile.profile_name}"
        }
        on_error => "no_profile_name"
      }
      if ![no_profile_name] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "profile_name_label"
          }
          on_error => "profile_name_label_merge_failure"
        }
      }
      mutate {
        replace => {
          "forensics_sideloaded_app_name_label.key"    => "forensics sideloaded_app_name"
          "forensics_sideloaded_app_name_label.value.string_value"   => "%{forensics.sideloaded_app_name}"
        }
        on_error => "no_sideloaded_app_name"
      }
      if ![no_sideloaded_app_name] and [forensics][sideloaded_app_name] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "forensics_sideloaded_app_name_label"
          }
          on_error => "merge_failure"
        }
      }
      mutate {
        replace => {
          "profile_type_label.key"    => "Profile Type"
          "profile_type_label.value.string_value"   => "%{forensics.suspicious_profile.profile_type}"
        }
        on_error => "no_profile_type"
      }
      if ![no_profile_type] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "profile_type_label"
          }
          on_error => "profile_type_label_merge_failure"
        }
      }

      mutate {
        replace => {
          "profile_external_id_label.key"    => "Profile External ID"
          "profile_external_id_label.value.string_value"   => "%{forensics.suspicious_profile.profile_external_id}"
        }
        on_error => "no_profile_external_id"
      }
      if ![no_profile_external_id] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "profile_external_id_label"
          }
          on_error => "profile_external_id_label_merge_failure"
        }
      }

      mutate {
        replace => {
          "profile_category_label.key"    => "Profile Category"
          "profile_category_label.value.string_value"   => "%{forensics.suspicious_profile.profile_category}"
        }
        on_error => "no_profile_category"
      }
      if ![no_profile_category] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "profile_category_label"
          }
          on_error => "profile_category_label_merge_failure"
        }
      }

      mutate {
        replace => {
          "profile_description_label.key"    => "Profile Description"
          "profile_description_label.value.string_value"   => "%{forensics.suspicious_profile.profile_description}"
        }
        on_error => "no_profile_description"
      }
      if ![no_profile_description] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "profile_description_label"
          }
          on_error => "profile_description_label_merge_failure"
        }
      }

      mutate {
        replace => {
          "profile_information_label.key"    => "Profile Information"
          "profile_information_label.value.string_value"   => "%{forensics.suspicious_profile.profile_information}"
        }
        on_error => "no_profile_information"
      }
