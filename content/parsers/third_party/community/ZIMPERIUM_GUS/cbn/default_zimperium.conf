            on_error => "no_forensics_network_threat_my_ip"
          }
        }
      }
      mutate {
        replace => {
          "forensics_network_threat_arp_tables_before" => "%{forensics.network_threat.arp_tables.before}"
        }
        on_error => "forensics_network_threat_arp_tables_before_replace_error"
      }
      if [forensics_network_threat_arp_tables_before] != "" {
        mutate {
          replace => {
            "forensics_network_threat_arp_tables_before_label.key" => "forensics_network_threat_arp_tables_before"
            "forensics_network_threat_arp_tables_before_label.value.string_value" => "%{forensics_network_threat_arp_tables_before}"
          }
          on_error => "no_forensics_network_threat_arp_tables_before"
        }
        if ![no_forensics_network_threat_arp_tables_before] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "forensics_network_threat_arp_tables_before_label"
            }
            on_error => "no_forensics_network_threat_arp_tables_before_label"
          }
        }
      }
      mutate {
        replace => {
          "device_info_device_id" => "%{device_info.device_id}"
        }
        on_error => "device_info_device_id_replace_error"
      }
      if [device_info_device_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.asset_id" => "DEVICE: %{device_info.device_id}"
          }
          on_error => "no_device_info_device_id"
        }
      }
      mutate {
        replace => {
          "threat_general_device_time" => "%{threat.general.device_time}"
        }
        on_error => "threat_general_device_time_replace_error"
      }
      if [threat_general_device_time] != "" {
        mutate {
          gsub => [ "threat_general_device_time", " UTC", ""]
        }
        date {
          match => [ "threat_general_device_time", "MM dd yyyy HH:mm:ss"]
          target => "event.idm.read_only_udm.principal.asset.last_discover_time"
          on_error => "threat_general_device_time_date_error"
        }
      }
      mutate {
        replace => {
          "threat_general_threat_type" => "%{threat.general.threat_type}"
        }
        on_error => "threat_general_threat_type_replace_error"
      }
      if [threat_general_threat_type] != "" {
        mutate {
          replace => {
            "threat_type_label.key" => "threat_type"
            "threat_type_label.value.string_value" => "%{threat_general_threat_type}"
          }
          on_error => "no_threat_general_threat_type"
        }
        if ![no_threat_general_threat_type] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "threat_type_label"
            }
            on_error => "threat_type_label_merge_error"
          }
        }
      }
      mutate {
        replace => {
          "threat_general_detected_url" => "%{threat.general.detected_url}"
        }
        on_error => "threat_general_detected_url_replace_error"
      }
      if [threat_general_detected_url] not in ["" , "null"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.url" => "%{threat_general_detected_url}"
          }
          on_error => "no_threat_general_detected_url"
        }
      }
      for index,threatuuid in threat.child_threat_uuids {
        mutate {
          convert => {
            "index" => "string"
          }
          on_error => "index_convert_error"
        }
        mutate {
          replace => {
            "child_threat_uuid_label" => ""
          }
        }
        mutate {
          replace => {
            "child_threat_uuid_label.key" => "child_threat_uuid_%{index}"
            "child_threat_uuid_label.value.string_value" => "%{threatuuid}"
          }
          on_error => "no_child_threat_uuid"
        }
        if ![no_child_threat_uuid] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "child_threat_uuid_label"
            }
            on_error => "no_child_threat_uuid_label"
          }
        }
      }
      mutate {
        replace => {
          "device_info_mdm_device_id" => "%{device_info.mdm_device_id}"
        }
        on_error => "device_info_mdm_device_id_replace_error"
      }
      if [device_info_mdm_device_id] != "" {
        mutate {
          replace => {
            "mdm_device_id_label.key" => "mdm_device_id"
            "mdm_device_id_label.value.string_value" => "%{device_info.mdm_device_id}"
          }
          on_error => "no_mdm_device_id_label"
        }
        if ![no_mdm_device_id_label] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "mdm_device_id_label"
            }
            on_error => "mdm_device_id_label_merge_error"
          }
        }
      }
      mutate {
        replace => {
          "threat_general_attacker_ssid" => "%{threat.general.attacker_ssid}"
        }
        on_error => "threat_general_attacker_ssid_replace_error"
      }
      if [threat_general_attacker_ssid] != "" {
        mutate {
          replace => {
            "threat_general_attacker_ssid_label.key" => "attacker_ssid"
            "threat_general_attacker_ssid_label.value.string_value" => "%{threat_general_attacker_ssid}"
          }
          on_error => "no_threat_general_attacker_ssid"
        }
        if ![no_threat_general_attacker_ssid] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "threat_general_attacker_ssid_label"
            }
            on_error => "threat_general_attacker_ssid_label_merge_error"
          }
        }
      }
      mutate {
        replace => {
          "threat_general_attacker_bssid" => "%{threat.general.attacker_bssid}"
        }
        on_error => "threat_general_attacker_bssid_replace_error"
      }
      if [threat_general_attacker_bssid] != "" {
        mutate {
          replace => {
            "threat_general_attacker_bssid_label.key" => "attacker_bssid"
            "threat_general_attacker_bssid_label.value.string_value" => "%{threat_general_attacker_bssid}"
          }
          on_error => "no_threat_general_attacker_bssid"
        }
        if ![no_threat_general_attacker_bssid] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "threat_general_attacker_bssid_label"
            }
            on_error => "threat_general_attacker_bssid_label_merge_error"
          }
        }
      }
      mutate {
        replace => {
          "sr.about.application" => "%{threat.general.process}"
        }
        on_error => "no_threat_process"
      }
      mutate {
        replace => {
          "sr.about.url" => "%{threat.general.sideloaded_app_package}"
        }
        on_error => "no_threat_sideloaded_app_package"
      }
      mutate {
        replace => {
          "sideloaded_app_name_label.key" => "sideloaded_app_name"
          "sideloaded_app_name_label.value.string_value" => "%{threat.general.sideloaded_app_name}"
        }
        on_error => "no_sideloaded_app_name_label_1"
      }
      if ![no_sideloaded_app_name_label_1] and [threat][general][sideloaded_app_name] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "sideloaded_app_name_label"
          }
          on_error => "no_sideloaded_app_name_label_2"
        }
      }
      mutate {
        replace => {
          "threat_general_network" => "%{threat.general.network}"
        }
        on_error => "threat_general_network_replace_error"
      }
      if [threat_general_network] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{threat_general_network}"
          }
          on_error => "no_threat_network"
        }
      }
      mutate {
        replace => {
          "threat_general_network_bssid" => "%{threat.general.network_bssid}"
        }
        on_error => "threat_general_network_bssid_replace_error"
      }
      if [threat_general_network_bssid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.parent_session_id" => "%{threat_general_network_bssid}"
          }
          on_error => "no_threat_network_bssid"
        }
      }
      mutate {
        replace => {
          "gbs.key" => "general.base_station"
          "gbs.value" => "%{threat.general.base_station}"
        }
        on_error => "no_general_base_station"
      }
      if ![no_general_base_station] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.labels" => "gbs"
          }
          on_error => "field_not_found_8"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.client.certificate.version" => "%{threat.general.certificate}"
        }
        on_error => "no_threat_certificate"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{threat.general.sideloaded_app_developer}"
        }
        on_error => "no_threat_sideloaded_app_developer"
      }
      mutate {
        replace => {
          "sr.confidence_details" => "%{threat.category}"
        }
        on_error => "no_threat_category"
      }
      mutate {
        replace => {
          "passetip" => "%{threat.general.device_ip}"
        }
        on_error => "no_threat_general_device_ip"
      }
      if [passetip] == "" {
        mutate {
          replace => {
            "passetip" => "0.0.0.0"
          }
        }
      }
      if ![no_threat_general_device_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.ip"  => "passetip"
          }
          on_error => "field_not_found_9"
        }
      }
      mutate {
        replace => {
          "file_hash" => "%{threat.general.file_hash}"
        }
        on_error => "no_threat_general_file_hash"
      }
      if [file_hash] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.file.sha1" => "%{file_hash}"
          }
          on_error => "no_threat_general_sha1"
        }
      }
      mutate {
        replace => {
          "hash_file" => "%{forensics.host_attack.file_hash}"
        }
        on_error => "no_forensics_host_attack_file_hash"
      }
      if [file_hash] == "" and [hash_file] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.file.sha1" => "%{hash_file}"
          }
          on_error => "no_hash_file"
        }
      }

      mutate {
        replace => {
          "sr.threat_id"  => "%{threat.threat_uuid}"
        }
        on_error => "no_threat_threat_uuid"
      }
      mutate {
        replace => {
          "sr.threat_feed_name" => "%{threat.display_name}"
        }
        on_error => "no_threat_display_name"
      }
      for category in threat.mitre_tactics {
        mutate {
          replace => {
            "srcd" => ""
          }
        }
        mutate {
          replace => {
            "srcd" => "%{category}"
          }
          on_error => "no_category"
        }
        mutate {
          merge => {
            "sr.category_details"  => "srcd"
          }
          on_error => "field_not_found_10"
        }
      }
    }
    if [device_mac] not in ["" , "null"] {
      grok {
        match => {
          "device_mac" => "%{MAC:device_mac_address}"
        }
        on_error => "device_mac_grok_err"
        overwrite => ["device_mac_address"]
      }
      if ![device_mac_grok_err] and [device_mac_address] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.mac" => "device_mac_address"
            "event.idm.read_only_udm.principal.asset.mac" => "device_mac_address"
          }
          on_error => "no_device_mac"
        }
      }
    }
    if [device_manufacturer] not in ["" , "null"] {
      mutate {
        replace => {
          "device_manufacturer_label.key" => "manufacturer"
          "device_manufacturer_label.value" => "%{device_manufacturer}"
        }
        on_error => "no_device_manufacturer"
      }
      if ![no_device_manufacturer] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.attribute.labels" => "device_manufacturer_label"
          }
          on_error => "field_not_found_13"
        }
      }
    }
    if [account_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.product_object_id"  => "%{account_id}"
        }
        on_error => "no_account_id"
      }
    }
    if [team_id] != "" {
      mutate {
        replace => {
          "al1"  => ""
        }
      }
      mutate {
        replace => {
          "al1.key"    => "team_id"
          "al1.value.string_value"   => "%{team_id}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "al1"
        }
        on_error => "field_not_found_11"
      }
    }
    if [team_name] != "" {
      mutate {
        replace => {
          "al2"  => ""
        }
      }
      mutate {
        replace => {
          "al2.key"    => "team_name"
          "al2.value.string_value"   => "%{team_name}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "al2"
        }
        on_error => "al2_field_not_found"
      }
    }
    if [about] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about"
        }
      }
    }
  }
# ------------------------------------------  END OF THREAT EVENTS  ------------------------------------------ #


# ------------------------------------------  MITIGATION EVENTS  ------------------------------------------ #

  else if [event_type] == "MITIGATION" {
    if [severity] != "" {
      mutate {
        convert => {
          "severity" => "string"
        }
      }
      mutate {
        replace => {
          "sr.severity_details" => "%{severity}"
        }
      }
    }
    if [event_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id"  => "%{event_id}"
        }
        on_error => "no_event_id"
      }
    }

    if [mitigated] != "" {
      if [mitigated] {
          mutate {
            replace => {
              "sr.action_details" => "Mitigated"
              "sr.threat_status" => "CLEARED"
            }
          }
      }
      else {
        mutate {
          replace => {
            "sr.action_details" => "Not Mitigated"
            "sr.threat_status" => "ACTIVE"
          }
        }
      }
    }

    if [eventtimestamp] != "" && [eventtimestamp] =~ "UTC" {
      mutate {
        gsub => [ "eventtimestamp", " UTC", ""]
      }

      date {
        match => [ "eventtimestamp", "MM dd yyyy HH:mm:ss"]
        target => "@timestamp"
        on_error => "no_event_timestamp"
      }
    }

    if [device_info] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.product_object_id" => "%{device_info.zdid}"
        }
        on_error => "no_device_info_zdid"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.product_object_id" => "%{device_info.zapp_instance_id}"
        }
        on_error => "no_device_info_zapp_instance_id"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.platform_software.platform_version"  => "%{device_info.os}"
        }
        on_error => "no_device_info_os"
      }
      if [device_info][jailbroken] {
        mutate {
          replace => {
            "aal.key"  => "Jailbroken"
            "aal.value" => "True"
          }
          on_error => "no_device_info_jailbroken"
        }
      }
      else {
        mutate {
          replace => {
            "aal.key"  => "Jailbroken"
            "aal.value" => "False"
          }
          on_error => "no_device_info_jailbroken"
        }
      }
      if ![no_device_info_jailbroken] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.labels" => "aal"
          }
          on_error => "field_not_found_12"
        }
      }
    }
    if [threat] != "" {
      mutate {
        replace => {
          "sr.threat_name" => "%{threat.name}"
        }
        on_error => "no_threat_name"
      }
      mutate {
        replace => {
          "sr.threat_id"  => "%{threat.threat_uuid}"
        }
        on_error => "no_threat_threat_uuid"
      }
      mutate {
        replace => {
          "sr.threat_feed_name" => "%{threat.display_name}"
        }
        on_error => "no_threat_display_name"
      }
    }
    if [account_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.product_object_id"  => "%{account_id}"
        }
        on_error => "no_account_id"
      }
    }
  }

# ------------------------------------------  END OF MITIGATION EVENTS  ------------------------------------------ #

  grok {
    match => {
      "action" => [
        "%{GREEDYDATA:action_description}\\s\\(%{GREEDYDATA:action_list}\\).%{WORD:status}"
        "%{GREEDYDATA:action_description}\\s\\(%{GREEDYDATA:action_list}\\)"
        "%{GREEDYDATA:action_description}\\s"
      ]
    }
    on_error => "GROK_aCTION"
  }
  if ![GROK_aCTION]{
    mutate {
      replace => {
        "sr.description" => "%{action_description}"
      }
      on_error => "no_action_description"
    }
    mutate {
      replace => {
        "sr.action_details" => "%{action_list}"
      }
      on_error => "no_action_list"
    }
    mutate {
      replace => {
        "sr.summary" => "%{status}"
      }
      on_error => "no_status"
    }
  }

  if [additional_public_forensics] != "" {
    for data in additional_public_forensics {
      if [data][key] == "Package Name" and [threat][name] == "APK_SUSPECTED" {
        mutate {
          replace => {
            "sr.about.url" => "%{data.value}"
          }
          on_error => "no_data_value"
        }
      }
      else {
        mutate {
          replace => {
            "apf_field" => ""
          }
        }
        mutate {
          replace => {
            "data_key" => "%{data.key}"
          }
          on_error => "no_data_key"
        }
        mutate {
          replace => {
            "data_value" => "%{data.value}"
          }
          on_error => "no_data_value"
        }
        if [data_key] != "" and [data_value] != "" and ![no_data_key] and ![no_data_value] {
          mutate {
            replace => {
              "apf_field.key" => "%{data_key}"
              "apf_field.value.string_value" => "%{data_value}"
            }
            on_error => "no_apf_field"
          }
          if ![no_apf_field] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "apf_field"
              }
              on_error => "no_apf_field_merge"
            }
          }
        }
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.security_result"  => "sr"
    }
  }
  if [event][idm][read_only_udm][metadata][event_type] == "GENERIC_EVENT" {
    if [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
