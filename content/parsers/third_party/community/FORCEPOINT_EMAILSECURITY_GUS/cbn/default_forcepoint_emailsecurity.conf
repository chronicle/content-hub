filter {
  mutate {
    replace => {
      "event" => ""
      "principal" => ""
      "target" => ""
      "security_result" => ""
      "metadata" => ""
      "network" => ""
      "EventReceivedTime" => ""
      "SourceModuleName" => ""
      "SourceModuleType" => ""
      "nxlog_filename" => ""
      "DateTime" => ""
      "EnvelopeSender" => ""
      "RecipientAddress" => ""
      "Subject" => ""
      "Action" => ""
      "SpamScore" => ""
      "MessageSize" => ""
      "AttachmentSize" => ""
      "AttachmentFileType" => ""
      "AttachmentFilename" => ""
      "MessageSandboxing" => ""
      "VirusName" => ""
      "SenderIP" => ""
      "SenderIPCountry" => ""
      "FilteringReason" => ""
      "attachment_size" => ""
      "attachment_filetype" => ""
      "attachment_filename" => ""
      "has_network_email_data" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "is_http" => "false"
      "type" => ""
      "log.file.path" => ""
      "risk_class" => ""
      "Host" => ""
      "file_type" => ""
      "Domain" => ""
      "url" => ""
      "Protocol" => ""
      "file_name" => ""
      "Workstation" => ""
      "Port" => ""
      "User" => ""
      "host_name" => ""
      "category_name" => ""
      "parent_category" => ""
      "request_method" => ""
      "connection_ip" => ""
      "dst_ip" => ""
      "Path" => ""
      "@version" => ""
      "version" => ""
      "dvchost" => ""
      "externalId" => ""
      "messageId" => ""
      "duser" => ""
      "suser" => ""
      "src" => ""
      "dst" => ""
      "encryptedDelivery" => ""
      "deliveryCode" => ""
      "deliveryCodeInfo" => ""
      "message_id" => ""
      "internal_id" => ""
      "hostname" => ""
      "message_size" => ""
      "time_taken" => ""
      "kbps" => ""
      "app" => ""
      "act" => ""
      "from" => ""
      "to" => ""
      "msg" => ""
      "cc" => ""
      "x_mailer" => ""
      "event_n" => ""
      "identHostName" => ""
      "devTime" => ""
      "connectionId" => ""
      "transport" => ""
      "spfResult" => ""
      "intermediary_ip" => ""
      "kv_data" => ""
      "trueSrc" => ""
      "rt" => ""
      "in" => ""
      "dvc" => ""
      "intermediary" => ""
      "timestamp_value" => ""
      "x-mailer" => ""
    }
  }
  grok {
    match => {
      "message" => [
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} vendor=%{WORD:vendor} product=\\\"%{DATA:product}\\\" version=%{DATA:version} event=%{WORD:event} dvc=%{IPORHOST:dvc2} dvchost=%{HOSTNAME:dvchost} rt=%{INT:rt} externalId=%{INT:externalId} messageId=%{INT:messageId} duser=\\\"%{DATA:duser}\\\" src=%{IPORHOST:src} dst=%{IPORHOST:dst} encryptedDelivery=%{DATA:encryptedDelivery} delivery using opportunistic TLS deliveryCode=%{INT:deliveryCode} deliveryCodeInfo=%{DATA:deliveryCodeInfo} <%{DATA:message_id}> \\[InternalId=%{DATA:internal_id}, Hostname=%{DATA:hostname}\\] %{INT:message_size} bytes in %{NUMBER:time_taken}, %{NUMBER:kbps} KB%{DATA}sec Queued mail for delivery app=%{DATA:app} act=%{WORD:act} Delivery',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} vendor=%{WORD:vendor} product=\\\"%{DATA:product}\\\" version=%{DATA:version} event=%{WORD:event} dvc=%{IPORHOST:dvc2} dvchost=%{HOSTNAME:dvchost} rt=%{INT:rt} externalId=%{INT:externalId} messageId=%{INT:messageId} duser=\\\"%{DATA:duser}\\\" src=%{IPORHOST:src} dst=%{IPORHOST:dst} encryptedDelivery=%{DATA:encryptedDelivery} delivery using opportunistic TLS deliveryCode=%{INT:deliveryCode} deliveryCodeInfo=%{DATA:deliveryCodeInfo} %{INT:timestamp} %{DATA:message_id} app=%{DATA:app} act=%{WORD:act} Delivery',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} vendor=%{WORD:vendor} product=\\\"%{DATA:product}\\\" version=%{DATA:version} event=%{WORD:event} dvc=%{IPORHOST:dst} dvchost=%{HOSTNAME:dvchost} rt=%{INT:rt} externalId=%{INT:externalId} messageId=%{INT:messageId} suser=\\\"%{DATA:suser}\\\" duser=\\\"%{DATA:duser}\\\" msg=\\\"%{DATA:msg}\\\" in=%{INT:in} trueSrc=%{IPORHOST:src} from=\\\"%{DATA}<%{DATA:from}>\\\" to=\\\"%{DATA:to}\\\" cc=\\\"%{DATA:cc}\\\" x-mailer=\\\"%{DATA:x_mailer}\\\"',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} vendor=%{WORD:vendor} product=\\\"%{DATA:product}\\\" version=%{DATA:version} event=%{WORD:event} dvc=%{IPORHOST:dst} dvchost=%{HOSTNAME:dvchost} rt=%{INT:rt} externalId=%{INT:externalId} messageId=%{INT:messageId} suser=\\\"%{DATA:suser}\\\" duser=\\\"%{DATA:duser}\\\" msg=\\\"%{DATA:msg}\\\" in=%{INT:in} trueSrc=%{IPORHOST:src} from=\\\"%{DATA:from}\\\" to=\\\"%{DATA:to}\\\" cc=\\\"%{DATA:cc}\\\" x-mailer=\\\"%{DATA:x_mailer}\\\"',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:dvc2}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tconnectionId=%{INT:externalId}\\tsrc=%{IP:src}\\tdst=%{IP:dst}\\ttransport=%{DATA:encryptedDelivery}\\treason=%{DATA:msg}\\tspfResult=%{WORD:spfResult}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:src}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tmessageId=%{DATA:messageId}\\tsender=%{DATA:suser}\\trecipients=%{DATA:duser}\\tfrom=%{DATA}<%{DATA:from}>\\treplyTo=%{DATA:replyTo}<\\\\t>to=%{DATA:to}\\tcc=%{DATA:cc}\\tsrcBytes=%{INT:srcBytes}\\tdeviceDirection=%{INT:deviceDirection}\\tdeviceFacility=%{DATA:deviceFacility}\\tdeviceProcessName=%{DATA:deviceProcessName}\\tact=%{DATA:act}\\turl=%{DATA:url}\\tcat=%{DATA:cat}\\tvirus=%{DATA:virus}\\tfnameAndfileHash=%{DATA:fnameAndfileHash}\\texceptionReason=%{DATA:exceptionReason}\\thybridSpamScore=%{DATA:hybridSpamScore}\\tlocalSpamScore=%{DATA:localSpamScore}<%\\\\t>subject=%{DATA:msg}\\ttrueSrc=%{IP:dst}\\tx-mailer=',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:src}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tconnectionId=%{DATA:externalId}\\tmessageId=%{DATA:messageId}\\tsender=%{DATA:suser}\\trecipients=%{DATA:duser}\\tsubject=%{DATA:msg}\\tsrcBytes=%{INT:srcBytes}\\ttrueSrc=%{IP:dst}\\tfrom=%{DATA:from}\\tto=%{DATA:to}\\tcc=%{DATA:cc}\\tx-mailer=%{DATA:x_mailer}\\t%{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:dvc2}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tconnectionId=%{DATA:externalId}\\tmessageId=%{DATA:messageId}\\trecipient=%{DATA:duser}\\tsrc=%{IP:src}\\tdst=%{IP:dst}\\tencryptedDelivery=%{DATA:transport}\\tdeliveryCode=%{INT:deliveryCode}\\tdeliveryCodeInfo=%{DATA:deliveryCodeInfo}\\ttransport=%{DATA:encryptedDelivery}\\tact=%{DATA:act}\\t%{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:src}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tmessageId=%{DATA:messageId}\\tsender=%{DATA:suser}\\trecipient=%{DATA:duser}\\tfrom=%{DATA:from}\\treplyTo=<\\\\t>to=%{DATA:to}\\tcc=%{DATA:cc}\\tsrcBytes=%{INT:srcBytes}\\tdeviceDirection=%{INT:deviceDirection}\\tdeviceFacility=%{DATA:deviceFacility}\\tdeviceProcessName=%{DATA:deviceProcessName}\\tact=%{DATA:act}\\turl=%{DATA:url}\\tcat=%{DATA:cat}\\tvirus=%{DATA:virus}\\tfnameAndfileHash=%{DATA:fnameAndfileHash}\\texceptionReason=%{DATA:exceptionReason}\\thybridSpamScore=%{DATA:hybridSpamScore}\\tlocalSpamScore=<%\\\\t>subject=%{DATA:msg}\\ttrueSrc=%{IP:dst}\\tx-mailer=%{DATA:x_mailer}\\n%{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:src}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tconnectionId=%{DATA:externalId}\\tmessageId=%{DATA:messageId}\\trecipient=%{DATA:duser}\\tsrc=\\tdst=%{IP:dst}\\tencryptedDelivery=%{DATA:transport}\\tdeliveryCode=%{INT:deliveryCode}\\tdeliveryCodeInfo=%{DATA:deliveryCodeInfo}\\ttransport=%{DATA:encryptedDelivery}\\tact=%{DATA:act}\\t%{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:src}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tmessageId=%{DATA:messageId}\\tsender=%{DATA:sender}\\trecipient=%{DATA:duser}\\tfrom=%{DATA:from}\\treplyTo=%{DATA:replyTo}<\\\\t>to=%{DATA:to}\\tcc=%{DATA:cc}\\tsrcBytes=%{INT:srcBytes}\\tdeviceDirection=%{INT:deviceDirection}\\tdeviceFacility=%{DATA:deviceFacility}\\tdeviceProcessName=%{DATA:deviceProcessName}\\tact=%{DATA:act}\\turl=%{DATA:url}\\tcat=%{DATA:cat}\\tvirus=%{DATA:virus}\\tfnameAndfileHash=%{DATA:fnameAndfileHash}\\texceptionReason=%{DATA:exceptionReason}\\thybridSpamScore=%{DATA:hybridSpamScore}\\tlocalSpamScore=<%\\\\t>subject=%{DATA:msg}\\ttrueSrc=%{IP:dst}\\tx-mailer=%{DATA:x_mailer}\\n%{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:src}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tconnectionId=%{DATA:externalId}\\tmessageId=%{DATA:messageId}\\trecipient=%{DATA:duser}\\tsrc=\\tdst=\\tencryptedDelivery=%{DATA:transport}\\tdeliveryCode=%{INT:deliveryCode}\\tdeliveryCodeInfo=%{DATA:deliveryCodeInfo}\\ttransport=%{DATA:encryptedDelivery}\\tact=%{DATA:act}\\t%{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:dvc2}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tconnectionId=%{DATA:externalId}\\tmessageId=%{DATA:messageId}\\trecipient=%{DATA:duser}\\tsrc=%{IP:src}\\tdst=%{DATA:dst}\\tencryptedDelivery=%{DATA:transport}\\tdeliveryCode=%{INT:deliveryCode}\\tdeliveryCodeInfo=%{DATA:deliveryCodeInfo}\\ttransport=%{DATA:encryptedDelivery}\\tact=%{DATA:act}\\t%{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:dvc} LEEF:%{DATA}\\\|%{WORD:vendor}\\\|%{DATA:product}\\\|%{DATA:version}\\\|%{WORD:event}\\\|%{DATA:event_n}\\tidentSrc=%{IP:src}\\tidentHostName=%{IPORHOST:dvchost}\\tdevTime=%{INT:devTime}\\tmessageId=%{DATA:messageId}\\tsender=%{DATA:sender}\\trecipient=%{DATA:duser}\\tfrom=%{DATA:from}\\treplyTo=%{DATA:replyTo}>to=%{DATA:to}\\tcc=%{DATA:cc}\\tsrcBytes=%{INT:srcBytes}\\tdeviceDirection=%{INT:deviceDirection}\\tdeviceFacility=%{DATA:deviceFacility}\\tdeviceProcessName=%{DATA:deviceProcessName}\\tact=%{DATA:act}\\turl=%{DATA:url}\\tcat=%{DATA:cat}\\tvirus=%{DATA:virus}\\tfnameAndfileHash=%{DATA:fnameAndfileHash}\\texceptionReason=%{DATA:exceptionReason}\\thybridSpamScore=%{DATA:hybridSpamScore}\\tlocalSpamScore=%{DATA:localSpamScore}<%\\\\t>subject=%{DATA:msg}\\ttrueSrc=%{IP:dst}\\tx-mailer=%{DATA:x_mailer}\\n%{GREEDYDATA}'
        "%{SYSLOGTIMESTAMP:timestamp_value} %{IPORHOST:intermediary_ip} %{GREEDYDATA:kv_data}"
      ]
    }
    on_error => "pattern_mismatch"
    overwrite => ["dvc", "vendor", "product", "version", "event", "dvc2", "dvchost", "rt", "externalId", "messageId", "duser", "suser", "src", "dst", "encryptedDelivery", "deliveryCode", "deliveryCodeInfo", "message_id", "internal_id", "hostname", "message_size", "time_taken", "kbps", "app", "act", "from", "to", "msg", "cc", "x_mailer", "event_n", "identHostName", "devTime", "connectionId", "transport", "spfResult", "intermediary_ip", "kv_data", "timestamp_value", "in"]
  }
  mutate {
    gsub => [ "kv_data", " (\\w+=)", "^$1" ]
  }
  mutate {
    gsub => [ "kv_data", '"','' ]
  }
  mutate {
    gsub => [ "kv_data", ' (x-mailer)','^$1' ]
  }
  kv {
    source => "kv_data"
    field_split => "^"
    value_split => "="
    on_error => "error_KV_kv_data"
  }
  if [version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{version}"
      }
      on_error => "no_version"
    }
  }
  if [event] != "" {
    mutate {
      replace => {
        "event_label.key" => "Event"
        "event_label.value" => "%{event}"
      }
      on_error => "no_event"
    }
    if ![no_event] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "event_label"
          }
        on_error => "merge_error"
      }
    }
  }
  if [dvchost] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{dvchost}"
        "principal.asset.hostname" => "%{dvchost}"
        "has_principal" => "true"
      }
      on_error => "no_dvchost"
    }
  }
  if [externalId] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{externalId}"
      }
      on_error => "no_external_id"
    }
  }
  if [messageId] != "" {
    mutate {
      replace => {
        "message_id_label.key" => "MessageId"
        "message_id_label.value" => "%{messageId}"
      }
      on_error => "no_message_id"
    }
    if ![no_message_id] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "message_id_label"
          }
        on_error => "merge_error"
      }
    }
  }
  if [duser] =~ "^.+@.+$" {
    mutate {
      gsub => [ "duser", ",", " " ]
    }
    mutate {
      replace => {
        "duser_list" => ""
      }
    }
    grok {
      match => {
        "duser" => "%{GREEDYDATA:duser_list}"
      }
      overwrite => ["duser_list"]
      on_error => "no_duser_list"
    }
    if ![no_duser_list] {
      mutate {
        gsub => ["duser_list", " ", ","]
      }
      mutate {
        split => {
          source => "duser_list"
          field => "duser_list"
          target => "duser_array"
          separator => ","
        }
      }
      for email in duser_array {
        mutate {
          replace => {
            "temp_email" => "%{email}"
          }
        }
        if [temp_email] != "" {
          mutate {
            merge => {
              "target.user.email_addresses" => "temp_email"
            }
            on_error => "no_target_user_email"
          }
        }
      }
    }
  }

  if [suser] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{suser}"
        "has_user" => "true"
      }
      on_error => "no_suser"
    }
  }
  if [src] != "" {
    mutate {
      merge => {
        "principal.ip" => "src",
        "principal.asset.ip" => "src"
      }
      on_error => "src_ip_error"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [dst] != "" {
    mutate {
      merge => {
        "target.ip" => "dst",
        "target.asset.ip" => "dst"
      }
      on_error => "dst_ip_error"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }
  if [encryptedDelivery] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.cipher" => "%{encryptedDelivery}"
      }
      on_error => "no_encrypted_delivery"
    }
  }
  if [deliveryCode] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{deliveryCode}"
      }
      on_error => "no_delivery_code"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
       on_error => "response_code_already_string"
    }
  }
  if [deliveryCodeInfo] != ""{
    mutate {
      replace => {
        "delivery_code_info_label.key" => "DeliveryCodeInfo"
        "delivery_code_info_label.value.string_value" => "%{deliveryCodeInfo}"
      }
      on_error => "no_delivery_code_info"
    }
    if ![no_delivery_code_info] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "delivery_code_info_label"
        }
        on_error => "delivery_code_info_label_error"
      }
    }
  }
  if [message_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.mail_id" => "%{message_id}"
      }
      on_error => "no_message_id"
    }
  }
  if [internal_id] != "" {
    mutate {
      replace => {
        "internal_id_label.key" => "InternalId"
        "internal_id_label.value" => "%{internal_id}"
      }
      on_error => "no_internal_id"
    }
    if ![no_internal_id] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "internal_id_label"
          }
        on_error => "merge_error"
      }
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{hostname}"
        "target.asset.hostname" => "%{hostname}"
        "has_target" => "true"
      }
      on_error => "no_hostname"
    }
  }
  if [message_size] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{message_size}"
      }
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "no_message_size"
    }
  }
  if [app] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "SMTP"
      }
      on_error => "no_app"
    }
  }
  if [act] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{act}"
      }
      on_error => "no_act"
    }
  }
  if [from] =~ "^.+@.+$" and [from] =~ "^(.){1,253}$" {
    mutate {
      replace => {
        "network.email.from" => "%{from}"
        "has_network_email_data" => "true"
      }
      on_error => "no_from"
    }
  }
  if [to] =~ "^.+@.+$" {
    mutate {
      replace => {
        "to" => '{"to":["%{to}"]}'
      }
      on_error => "zerror.REPLACE.to"
    }
    mutate {
      gsub => [ "to", ',','","' ]
    }
    mutate {
      gsub => ["to", " ", ""]
    }
    json {
      source => "to"
      array_function => "split_columns"
      on_error => "eerror_JSON_to"
    }

    for address in to {
      if [address] =~ "<" {
        grok {
          match => {
            "address" => [ "<%{EMAILADDRESS:address}>" ]
          }
          overwrite => ["address"]
          on_error => "zerror.GROK.address"
        }
      }
      if [address] =~ "^.+@.+$" {
        mutate {
          merge => {
            "network.email.to" => "address"
          }
          on_error => "no_target_to_email_1"
        }
      }
    }
    mutate {
      replace => {
        "has_network_email_data" => "true"
      }
    }
  }
  if [timestamp_value] != "" {
    date {
      match => ["timestamp_value", "MMM  d HH:mm:ss", "MMM d HH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "error_DATE_timestamp"
      rebase => true
    }
  }
  if [in] != "" {
    mutate {
      replace => {
        "network.sent_bytes" => "%{in}"
      }
      on_error => "no_in"
    }
    mutate {
      convert => {
        "network.sent_bytes" => "uinteger"
      }
      on_error => "in_already_string"
    }
  }

  if [dvc] != "" {
    grok {
      match => {
        "dvc" => "%{IP:dvc_ip}"
      }
      overwrite => ["dvc"]
      on_error => "no_dvc"
    }
    mutate {
      merge => {
        "intermediary.ip" => "dvc_ip"
        "intermediary.asset.ip" => "dvc_ip"
      }
      on_error => "no_dvc_ip"
    }
  }
  else if [intermediary_ip] != "" {
    grok {
      match => {
        "intermediary_ip" => "%{IP:intermediary_ip_value}"
      }
      overwrite => ["intermediary_ip_value"]
      on_error => "no_intermediary_ip"
    }
    mutate {
      merge => {
        "intermediary.ip" => "intermediary_ip_value"
        "intermediary.asset.ip" => "intermediary_ip_value"
      }
      on_error => "no_intermediary_ip_value"
    }
  }
  if [rt] != "" {
    mutate {
      replace => {
        "rt_label.key" => "rt"
        "rt_label.value.string_value" => "%{rt}"
      }
      on_error => "no_rt"
    }
    if ![no_rt] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "rt_label"
        }
        on_error => "rt_label_merge_error"
      }
