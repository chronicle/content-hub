# Product: Cofense Triage
# Category: Email Server
# Supported Format: SYSLOG + KV (CEF)
# Reference: N/A
# Last Updated: 2024-06-18
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "log_datetime" => ""
      "ipaddress" => ""
      "cofense_solution" => "" # Type of solution this vendor provides.
      "rule_id" => ""
      "severity" => ""
      "event_data" => ""
      "productlogid" => ""
      "kv_msg" => ""
      "suser" => ""
      "security_action" => "UNKNOWN_ACTION"
      "sec_cat" => ""
      "cs2" => ""
      "cat" => ""
      "cs3" => ""
      "cs1" => ""
      "cs4" => ""
      "msg" => ""
      "deviceCustomDate1" => ""
      "processID" => ""
      "host" => ""
      "descrip" => ""
      "sec_result" => ""
      "start" => ""
      "rt" => ""
      "user_id" => ""
      "url" => ""
      "has_principal" => "false"
    }
  }

  mutate {
    gsub => ["message","\\r",""]
  }

  grok {
    match => {
      "message" => [
        "<%{INT:priority}>%{SYSLOGTIMESTAMP:log_datetime} (%{IP:ipaddress}|%{NOTSPACE:host}) %{GREEDYDATA:cofense_solution}, \\[%{GREEDYDATA:msg1} %{WORD}:0\\|%{WORD}\\|%{WORD:solution}\\|%{NUMBER}\\|%{INT:rule_id}\\|%{GREEDYDATA:event_data}\\|%{INT:severity}\\|%{GREEDYDATA:kv_msg}",
        "<%{INT}>%{SYSLOGTIMESTAMP:log_datetime} %{WORD} \\[%{NOTSPACE:processID}\\] %{NOTSPACE:host} %{GREEDYDATA:descrip}",
        "%{NOTSPACE}: WILDCARD URL %{NOTSPACE:url}"
      ]
    }
    overwrite => ["event_data", "descrip" ,"msg", "url" ,"host" ,"processID","rule_id","log_datetime","cofense_solution","solution","ipaddress","severity","kv_msg"]
    on_error => "grok_failure"
  }

  mutate {
    gsub => ["kv_msg", " ([a-zA-Z0-9]+=)","#$1"]
  }

  if [url] != "" {
    mutate {
      replace => {
        "cs3" => "%{url}"
      }
    }
  }

  kv {
    source => "kv_msg"
    field_split => "#"
    value_split => "="
    on_error => "kv_failure"
  }

  # Parse date for event timestamp
  if [deviceCustomDate1] != "" {
    date {
      match => ["deviceCustomDate1", "MMM d yyyy HH:mm:ss","MMM  d HH:mm:ss"],
      rebase => true
    }
  } else {
    date {
      match => ["log_datetime", "MMM d HH:mm:ss","MMM  d HH:mm:ss"],
      rebase => true
      on_error => "log_datetime_failure"
    }
  }

  if[processID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{processID}"
      }
      on_error => "processID_emppty"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "host_empty"
    }
  }

  mutate {
    replace => {
      "event_type" => "GENERIC_EVENT"
    }
  }

  if [suser] =~ "^.+@.+$" and [duser] =~ "^.+@.+$" {
    mutate {
      replace => {
        "event_type" => "EMAIL_TRANSACTION"
        "event.idm.read_only_udm.network.email.from" => "%{suser}"
      }
      on_error => "suser_empty"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.to" => "duser"
      }
    }
  }

  if [cs4] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.subject" => "cs4"
      }
      on_error => "cs4_empty"
    }
  }
  # Security result mapping based upon threat category
  if [cat] != "" {
    if [cat] in ["health","Processed:Marketing","Processed:Non-Malicious"] {
      mutate {
        replace => {
          "sec_result.severity" => "INFORMATIONAL"
          "security_action" => "ALLOW"
        }
      }
    } else if [cat] == "Processed:Spam" {
      mutate {
        replace => {
          "sec_result.severity" => "HIGH"
          "security_action" => "BLOCK"
          "sec_cat" => "MAIL_SPAM"
        }
        merge => {
          "sec_result.category" => "sec_cat"
        }
      }
    } else if [cat] == "Processed:Threats"{
      mutate {
        replace => {
          "sec_result.severity" => "CRITICAL"
          "security_action" => "BLOCK"
        }
      }
    }
  } else {
    if [cs2] in ["dummy_rule_01","dummy_rule_02","dummy_rule_03"] {
      mutate {
        replace => {
          "sec_cat" => "MAIL_PHISHING"
          "sec_result.severity" => "HIGH"
          "security_action" => "BLOCK"
        }
        merge => {
          "sec_result.category" => "sec_cat"
        }
      }
    }
  }

  if [cs3] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.url_back_to_product" => "%{cs3}"
      }
    }
  }

  if [cs3] != "" {
    grok {
      match => {
        "cs3" => "\/%{INT:productlogid}"
      }
      overwrite => ["productlogid"]
      on_error => "cs3_grok_failure"
    }
    if [productlogid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{productlogid}"
        }
        on_error => "productlogid_empty"
      }
    }
  }

  if [cat] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{cat}"
      }
      on_error => "cat_empty"
    }
  }

  if [msg] != "" {
    mutate {
      replace => {
        "msg_label.value.string_value" => "%{msg}"
      }
      on_error => "msg_empty"
    }
    if ![msg_empty] {
      mutate {
        replace => {
          "msg_label.key" => "msg"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "msg_label"
        }
        on_error => "msg_label_empty"
      }
    }
  }

  if [rule_id] != "" {
    mutate {
      replace => {
        "rule_id_label.value.string_value" => "%{rule_id}"
      }
      on_error => "rule_id_empty"
    }
    if ![rule_id_empty] {
      mutate {
        replace => {
          "rule_id_label.key" => "rule_id"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "rule_id_label"
        }
        on_error => "rule_id_label_empty"
      }
    }
  }

  if [event_data] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{event_data}"
      }
      on_error => "event_data_empty"
    }
  }

  if [descrip] != "" {
    grok {
      match => {
        "descrip" => "User: \\(%{WORD:user_id}\\).*"
      }
      overwrite => ["user_id"]
      on_error => "descrip_grok_failure"
    }

    if [user_id] != "" {
      mutate {
        replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_id}"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{descrip}"
      }
    }
  }

  if [severity] != "" {
    mutate {
      replace => {
        "sec_result.rule_id" => "%{severity}"
      }
      on_error => "severity_empty"
    }
  }

  if [severity] in ["8", "10", "11", "12", "13", "14"] {
     mutate {
        replace => {
          "category" => "MAIL_PHISHING"
          "sec_result.alert_state" => "ALERTING"
        }
     }
     mutate {
       merge => {
        "sec_result.category" => "category"
      }
    }
  }
  else {
    mutate {
      replace => {
        "sec_result.alert_state" => "NOT_ALERTING"
      }
    }
  }

  if [cs2] != "" {
    mutate {
      replace => {
        "sec_result.rule_name" => "%{cs2}"
      }
    }
  }

  if [security_action] != "" {
    mutate {
      merge => {
        "sec_result.action" => "security_action"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  if [ipaddress] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ipaddress"
        "event.idm.read_only_udm.principal.asset.ip" => "ipaddress"
      }
      on_error => "ipaddress_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [start] != "" {
    mutate {
      replace => {
        "start_label.value.string_value" => "%{start}"
      }
      on_error => "start_empty"
    }
    if ![start_empty] {
      mutate {
        replace => {
          "start_label.key" => "start"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "start_label"
        }
        on_error => "start_label_empty"
      }
    }
  }

  if [rt] != "" {
    mutate {
      replace => {
        "rt_label.value.string_value" => "%{rt}"
      }
      on_error => "rt_empty"
    }
    if ![rt_empty] {
      mutate {
        replace => {
          "rt_label.key" => "rt"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "rt_label"
        }
        on_error => "rt_label_empty"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Cofense"
      "event.idm.read_only_udm.metadata.product_name" => "Triage"
    }
  }

  if [has_principal] == "true" and [event_type] == "GENERIC_EVENT" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  mutate {
    rename => {
      "event_type" => "event.idm.read_only_udm.metadata.event_type"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
