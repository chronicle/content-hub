        on_error => "process_artifact_sha256_failed"
      }
    }
    if [processes][artifact][sha256] != "" {
      mutate {
        replace => {
          "principal.process.file.sha256" => "%{processes.artifact.sha256}"
        }
        on_error => "processes_artifact_sha256_failed"
      }
    }
    if [process][artifact][filePath] != "" {
      mutate {
        replace => {
          "principal.process.file.full_path" => "%{process.artifact.filePath}"
        }
        on_error => "process_artifact_filePath_failed"
      }
    }
    if [processes][artifact][filePath] != "" {
      mutate {
        gsub => ["processes.artifact.filePath", '\"', ""]
      }
      mutate {
        replace => {
          "principal.process.file.full_path" => "%{processes.artifact.filePath}"
        }
        on_error => "processes_artifact_filePath_failed"
      }
    }
    if [primaryProcess][artifact][sha256] != "" {
      mutate {
        replace => {
          "principal.process.file.sha256" => "%{primaryProcess.artifact.sha256}"
        }
        on_error => "primaryProcess_artifact_sha256_failed"
      }
      mutate {
        replace => {
          "has_principal_file" => "true"
        }
      }
    }
    if [primaryProcess][artifact][filePath] != "" {
      mutate {
        replace => {
          "principal.process.file.full_path" => "%{primaryProcess.artifact.filePath}"
        }
        on_error => "primaryProcess_artifact_filePath_failed"
      }
      mutate {
        replace => {
          "has_principal_file" => "true"
        }
      }
    }
    if [process][commandLine] != "" {
      mutate {
        replace => {
          "principal.process.command_line" => "%{process.commandLine}"
        }
        on_error => "process_commandLine_failed"
      }
    }
    if [firstOccurredAt] != "" and [dataType] == "Alert" {
      date {
        match => ["firstOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
        target => "principal.process.file.first_seen_time"
        on_error => "firstOccurredAt_date_failed_error"
      }
    }
    else if [firstOccurredAt] != "" {
      date {
        match => ["firstOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
        on_error => "firstOccurredAt_date_failed"
      }
    }
    if [dataType] == "Alert" and [lastOccurredAt] != "" {
      date {
        match => ["lastOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
        target => "metadata.event_timestamp"
        on_error => "lastOccurredAt_date_failed_error"
      }
    }
    else if [lastOccurredAt] != "" {
      date {
        match => ["lastOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
        target => "principal.process.file.last_seen_time"
        on_error => "lastOccurredAt_date_failed"
      }
    }
    if [occurredAt] != "" {
      date {
        match => ["occurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
        on_error => "occurredAt_date_failed"
      }
    }
    if [tenantId] != "" {
      mutate {
        replace => {
          "tenantId_label.value" => "%{tenantId}"
          "tenantId_label.key" => "tenantId"
        }
        on_error => "tenantId_failed"
      }
      if ![tenantId_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "tenantId_label"
          }
          on_error => "tenantId_merge_failed"
        }
      }
    }
    if [kind] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{kind}"
        }
        on_error => "kind_failed"
      }
    }
    if [primaryProcess][artifact][kind] != "" {
      mutate {
        replace => {
          "principal.process.file.mime_type" => "%{primaryProcess.artifact.kind}"
        }
        on_error => "primaryProcess_artifact_kind_failed"
      }
    }
    if [asset][kind] != "" {
      mutate {
        replace => {
          "asset_kind_label.value" => "%{asset.kind}"
          "asset_kind_label.key" => "assetKind"
        }
        on_error => "asset_kind_failed"
      }
      if ![asset_kind_failed] {
        mutate {
          merge => {
            "principal.asset.attribute.labels" => "asset_kind_label"
          }
          on_error => "asset_kind_merge_failed"
        }
      }
    }
    if [summary][artifact][sha256] != "" {
      mutate {
        replace => {
          "target.file.sha256" => "%{summary.artifact.sha256}"
          "has_target_file" => "true"
        }
        on_error => "sha256_failed"
      }
    }
    if [summary][artifact][kind] != "" {
      mutate {
        replace => {
          "target.file.mime_type" => "%{summary.artifact.kind}"
        }
        on_error => "summary_artifact_kind_mime_type_failed"
      }
    }
    if [summary][artifact][filePath] != "" {
      mutate {
        replace => {
          "target.file.full_path" => "%{summary.artifact.filePath}"
          "has_target_file" => "true"
        }
        on_error => "filePath_failed"
      }
    }
    if [primaryProcess][commandLine] != "" {
      mutate {
        gsub => ["primaryProcess.commandLine", '\"', ""]
      }
      mutate {
        replace => {
          "target.process.command_line" => "%{primaryProcess.commandLine}"
        }
        on_error => "commandLine_failed"
      }
    }

    if [primaryProcess][pid] != "" {
      mutate {
        replace => {
          "target.process.pid" => "%{primaryProcess.pid}"
        }
        on_error => "pid_failed"
      }
    }
    if [primaryProcess][kind] != "" {
      mutate {
        replace => {
          "target.process.file.mime_type" => "%{primaryProcess.kind}"
        }
        on_error => "primaryProcess_kind_failed"
      }
    }
    if [primaryProcess][parentPid] != "" {
      mutate {
        replace => {
          "target.process.parent_process.pid" => "%{primaryProcess.parentPid}"
        }
        on_error => "parentPid_failed"
      }
    }

    if [asset][id] != "" {
      mutate {
        replace => {
          "principal.asset.asset_id" => "ASSET:%{asset.id}"
        }
        on_error => "asset_id_failed"
      }
    }
    if [id] != "" {
      mutate {
        replace => {
          "target.asset_id" => "ASSET:%{id}"
        }
        on_error => "id_failed"
      }
    }

    if [asset][name] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{asset.name}"
          "principal.asset.hostname" => "%{asset.name}"
          "has_principal" => "true"
        }
        on_error => "asset_name_failed"
      }
    }

    if [action] in ["Block","Allow"] {
      mutate {
        uppercase => ["action"]
      }
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "action_merge_failed_error"
      }
    }

    if [has_principal] == "true" and [has_target_file] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "FILE_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    if [timeElapsed] != "" {
      mutate {
        convert => {
          "timeElapsed" => "string"
          }
        on_error => "timeElapsed_convert_failed"
      }
      if ![timeElapsed_convert_failed] {
        mutate {
          replace => {
            "timeElapsed_label.key" => "timeElapsed"
            "timeElapsed_label.value.string_value" => "%{timeElapsed}"
          }
          on_error => "timeElapsed_label_replace_failed"
        }
        if ![timeElapsed_label_replace_failed] {
          mutate {
            merge => {
              "additional.fields" => "timeElapsed_label"
            }
            on_error => "timeElapsed_merge_failed"
          }
        }
      }
    }
    if [threshold] != "" {
      mutate {
        convert => {
          "threshold" => "string"
          }
        on_error => "threshold_convert_failed"
      }
      if ![threshold_convert_failed] {
        mutate {
          replace => {
            "threshold_label.key" => "threshold"
            "threshold_label.value.string_value" => "%{threshold}"
          }
          on_error => "threshold_label_replace_failed"
        }
        if ![threshold_label_replace_failed] {
          mutate {
            merge => {
              "additional.fields" => "threshold_label"
            }
            on_error => "threshold_merge_failed"
          }
        }
      }
    }
    mutate {
      convert => {
        "bytes" => "string"
      }
      on_error => "bytes_convert_failed"
    }
    if [bytes] != "" {
      mutate {
        replace => {
          "network.sent_bytes" => "%{bytes}"
        }
        on_error => "sent_b_not_found"
      }
      mutate {
        convert => {
          "network.sent_bytes" => "uinteger"
        }
        on_error => "sent_b_not_integer"
      }
    }
    mutate {
      replace => {
        "metadata.vendor_name" => "Halcyon"
        "metadata.product_name" => "Halcyon Anti Ransomware"
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "security_result_invalid"
      }
    }
    if [additional] != "" {
      mutate {
        rename => {
          "additional" => "event.idm.read_only_udm.additional"
        }
      }
    }
    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }
    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }
    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
      }
    }
    if [network] != "" {
      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
      }
    }
    if [about] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about"
        }
        on_error => "about_empty"
      }
    }
    mutate {
      merge=> {
        "@output" => "event"
      }
    }
  }
}
