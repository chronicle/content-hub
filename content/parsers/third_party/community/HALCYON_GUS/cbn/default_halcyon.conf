# Product: Halcyon Anti Ransomware
# Category: AV and endpoint logs
# Supported Format: JSON
# Reference: NA
# Last Updated: 2026-02-18
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "additional" => ""
      "security_result" => ""
      "dataType" => ""
      "totalOccurrences" => ""
      "process.artifact.kind" => ""
      "primaryProcess.artifact.kind" => ""
      "process.artifact.sha256" => ""
      "processes.artifact.sha256" => ""
      "process.artifact.filePath" => ""
      "processes.artifact.filePath" => ""
      "process.commandLine" => ""
      "processes.commandLine" => ""
      "firstOccurredAt" => ""
      "lastOccurredAt" => ""
      "kind" => ""
      "processes.kind" => ""
      "tenantId" => ""
      "summary.artifact.kind" => ""
      "summary.artifact.sha256" => ""
      "summary.artifact.filePath" => ""
      "occurredAt" => ""
      "guid" => ""
      "id" => ""
      "asset.kind" => ""
      "asset.id" => ""
      "asset.name" => ""
      "action" => ""
      "primaryProcess.commandLine" => ""
      "primaryProcess.pid" => ""
      "primaryProcess.kind" => ""
      "primaryProcess.parentPid" => ""
      "has_principal" => "false"
      "has_target_file" => "false"
      "artifact.kind" => ""
      "count" => ""
      "gupid" => ""
      "policyMode" => ""
      "artifact.sha256" => ""
      "artifact.filePath" => ""
      "monitoringReason" => ""
      "modifiedFilePath" => ""
      "process.pid" => ""
      "process.parentPid" => ""
      "dxpRule" => ""
      "ipArtifact.ipAddress" => ""
      "ipArtifact.version" => ""
      "dxpRuleType" => ""
      "dnsArtifact_uri" => ""
      "occurrences.IncorrectPasswords" => ""
      "occurrences.FailedPassword" => ""
      "occurrences.AuthFailure" => ""
      "summary.applicationName" => ""
      "reason.cause" => ""
      "reason_cause" => ""
      "reason.exitCode" => ""
      "reason_exitCode" => ""
      "filterName" => ""
      "timestamp" => ""
      "phost" => ""
      "sshd" => ""
      "user_displayname" => ""
      "msg" => ""
      "kvData" => ""
      "log" => ""
      "has_target" => "false"
      "has_target_user" => "false"
      "user" => ""
      "tty" => ""
      "euid" => ""
      "uid" => ""
      "record.asset.kind" => ""
      "record.asset.id" => ""
      "record.asset.name" => ""
      "record.action" => ""
      "is_array" => "false"
      "summary.badCommandLine" => ""
      "primaryProcess.artifact.filePath" => ""
      "primaryProcess.artifact.sha256" => ""
      "has_principal_file" => "false"
      "about" => ""
      "timeElapsed" => ""
      "threshold" => ""
      "bytes" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_failed"
  }
  if [json_parse_failed] {
    mutate {
      replace => {
        "record_json_message" => "{\"records\":[%{message}]}"
      }
      on_error => "record_json_message_failed"
    }
    mutate {
      gsub => ["record_json_message", "\\r\\n", ""]
    }
    mutate {
      gsub => ["record_json_message","\\n",""]
    }
    mutate {
      gsub => ["record_json_message","}{","},{"]
    }
    json {
      source => "record_json_message"
      array_function => "split_columns"
      on_error => "records_json_failed"
    }
    if [records_json_failed] {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }
    for record in records {
      mutate {
        replace => {
          "asset_kind_label" => ""
          "asset_id" => ""
          "asset_name" => ""
          "record_action" => ""
          "data_type" => ""
          "policy_mode" => ""
          "tenant_id" => ""
          "count" => ""
          "gupid" => ""
          "kind" => ""
          "id" => ""
          "occurredAt" => ""
          "artifact_kind" => ""
          "artifact_sha256" => ""
          "artifact_filePath" => ""
          "firstOccurredAt" => ""
          "lastOccurredAt" => ""
          "totalOccurrences" => ""
          "summary_artifact_kind" => ""
          "summary_artifact_sha256" => ""
          "summary_artifact_filePath" => ""
          "primaryProcess_commandLine" => ""
          "primaryProcess_pid" => ""
          "primaryProcess_parentPid" => ""
          "primaryProcess_artifact_sha256" => ""
          "primaryProcess_artifact_filePath" => ""
          "primaryProcess_artifact_kind" => ""
          "has_target_file" => "false"
          "has_principal_file" => "false"
          "subevent" => ""
          "event" => ""
          "security_result_action" => ""
          "has_principal" => "false"
          "has_target" => "false"
          "has_principal_user" => "false"
          "has_target_user" => "false"
          "is_array" => "true"
          "security_result" => ""
        }
      }
      mutate {
        replace => {
          "record_action" => "%{record.action}"
        }
        on_error => "record_action_failed"
      }
      if [record_action] != "" {
        if [record_action] =~ "Block|(?i)Report" {
          mutate {
            replace => {
              "security_result_action" => "BLOCK"
            }
            on_error => "security_result_action_failed"
          }
        }
        else if [record_action] =~ "Allow" {
          mutate {
            replace => {
              "security_result_action" => "ALLOW"
            }
            on_error => "action_allow_failed"
          }
        }
        mutate {
          merge => {
            "security_result.action" => "security_result_action"
          }
          on_error => "security_result_action_empty"
        }
      }
      mutate {
        replace => {
          "asset_id" => "%{record.asset.id}"
        }
        on_error => "asset_id_not_found"
      }
      if [asset_id] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.asset.asset_id" => "ASSET:%{asset_id}"
          }
          on_error => "invalid_asset_id_failed"
        }
      }
      mutate {
        replace => {
          "asset_name" => "%{record.asset.name}"
        }
        on_error => "asset_name_not_found"
      }
      if [asset_name] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.hostname" => "%{asset_name}"
            "subevent.idm.read_only_udm.principal.asset.hostname" => "%{asset_name}"
            "has_principal" => "true"
          }
          on_error => "asset_name_empty"
        }
      }
      mutate {
        replace => {
          "asset_kind_label.value" => "%{record.asset.kind}"
        }
        on_error => "asset_kind_not_found"
      }
      if ![asset_kind_not_found] {
        mutate {
          replace => {
            "asset_kind_label.key" => "assetKind"
          }
        }
        mutate {
          merge => {
            "subevent.idm.read_only_udm.principal.asset.attribute.labels" => "asset_kind_label"
          }
          on_error => "asset_kind_label_merge_failed"
        }
      }
      mutate {
        replace => {
          "data_type" => "%{record.dataType}"
        }
        on_error => "data_type_not_found"
      }
      if [data_type] != "" {
        mutate {
          replace => {
            "data_type_label.value.string_value" => "%{data_type}"
          }
          on_error => "data_type_failed"
        }
        if ![data_type_failed] {
          mutate {
            replace => {
              "data_type_label.key" => "dataType"
            }
          }
          mutate {
            merge => {
              "subevent.idm.read_only_udm.additional.fields" => "data_type_label"
            }
            on_error => "data_type_merge_failed"
          }
        }
      }
      mutate {
        replace => {
          "policy_mode" => "%{record.policyMode}"
        }
        on_error => "policy_mode_not_found"
      }
      if [policy_mode] != "" {
        mutate {
          replace => {
            "policy_mode_label.value.string_value" => "%{policy_mode}"
          }
          on_error => "policy_mode_failed"
        }
        if ![policy_mode_failed] {
          mutate {
            replace => {
              "policy_mode_label.key" => "policyMode"
            }
          }
          mutate {
            merge => {
              "subevent.idm.read_only_udm.additional.fields" => "policy_mode_label"
            }
            on_error => "policy_mode_merge_failed"
          }
        }
      }
      mutate {
        replace => {
          "tenant_id" => "%{record.tenantId}"
        }
        on_error => "tenant_id_not_found"
      }
      if [tenant_id] != "" {
        mutate {
          replace => {
            "tenant_id_label.value" => "%{tenant_id}"
          }
          on_error => "tenant_id_failed"
        }
        if ![tenant_id_failed] {
          mutate {
            replace => {
              "tenant_id_label.key" => "tenantId"
            }
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "tenant_id_label"
            }
            on_error => "tenant_id_merge_failed"
          }
        }
      }
      mutate {
        convert => {
          "record.count" => "string"
        }
        on_error => "record_count_empty"
      }
      mutate {
        replace => {
          "count" => "%{record.count}"
        }
        on_error => "record_count_failed"
      }
      if [count] != "" {
        mutate {
          replace => {
            "count_label.value.string_value" => "%{count}"
          }
          on_error => "count_value_failed"
        }
        if ![count_value_failed] {
          mutate {
            replace => {
              "count_label.key" => "count"
            }
          }
          mutate {
            merge => {
              "subevent.idm.read_only_udm.additional.fields" => "count_label"
            }
            on_error => "count_value_merge_failed"
          }
        }
      }
      mutate {
        replace => {
          "gupid" => "%{record.gupid}"
        }
        on_error => "gupid_failed"
      }
      if [gupid] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.metadata.product_log_id" => "%{gupid}"
          }
          on_error => "gupid_empty"
        }
      }
      mutate {
        replace => {
          "kind" => "%{record.kind}"
        }
        on_error => "kind_not_valid"
      }
      if [kind] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.metadata.product_event_type" => "%{kind}"
          }
          on_error => "kind_empty"
        }
      }
      mutate {
        replace => {
          "id" => "%{record.id}"
        }
        on_error => "id_not_valid"
      }
      if [id] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.target.asset_id" => "ASSET:%{id}"
          }
          on_error => "id_error"
        }
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
      mutate {
        replace => {
          "occurredAt" => "%{record.occurredAt}"
        }
        on_error => "occurredAt_not_valid"
      }
      if [occurredAt] != "" {
        date {
          match => ["occurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
          target => "subevent.idm.read_only_udm.metadata.event_timestamp"
          on_error => "occurredAt_error"
        }
      }
      mutate {
        replace => {
          "artifact_kind" => "%{record.artifact.kind}"
        }
        on_error => "artifact_kind_not_valid"
      }
      if [artifact_kind] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.process.file.mime_type" => "%{artifact_kind}"
          }
          on_error => "artifact_kind_empty"
        }
      }
      mutate {
        replace => {
          "artifact_sha256" => "%{record.artifact.sha256}"
        }
        on_error => "artifact_sha256_not_valid"
      }
      if [artifact_sha256] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.process.file.sha256" => "%{artifact_sha256}"
          }
          on_error => "artifact_sha256_empty"
        }
      }
      mutate {
        replace => {
          "artifact_filePath" => "%{record.artifact.filePath}"
        }
        on_error => "artifact_filePath_not_valid"
      }
      if [artifact_filePath] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.process.file.full_path" => "%{artifact_filePath}"
          }
          on_error => "artifact_filePath_empty"
        }
      }
      mutate {
        replace => {
          "firstOccurredAt" => "%{record.firstOccurredAt}"
        }
        on_error => "firstOccurredAt_failed"
      }
      if [firstOccurredAt] != "" and [data_type] == "Alert" {
        date {
          match => ["firstOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
          target => "subevent.idm.read_only_udm.principal.process.file.first_seen_time"
          on_error => "firstOccurredAt_error_alert"
        }
      }
      else if [firstOccurredAt] != "" {
        date {
          match => ["firstOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
          target => "subevent.idm.read_only_udm.metadata.event_timestamp"
          on_error => "firstOccurredAt_error"
        }
      }
      mutate {
        replace => {
          "lastOccurredAt" => "%{record.lastOccurredAt}"
        }
        on_error => "lastOccurredAt_failed"
      }
      if [data_type] == "Alert" and [lastOccurredAt] != "" {
        date {
          match => ["lastOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
          target => "subevent.idm.read_only_udm.metadata.event_timestamp"
          on_error => "lastOccurredAt_error_alert"
        }
      }
      else if [lastOccurredAt] != "" {
        date {
          match => ["lastOccurredAt", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","ISO8601"]
          target => "subevent.idm.read_only_udm.principal.process.file.last_seen_time"
          on_error => "lastOccurredAt_error"
        }
      }
      mutate {
        convert => {
          "record.totalOccurrences" => "string"
        }
        on_error => "totalOccurrences_not_valid"
      }
      mutate {
        replace => {
          "totalOccurrences" => "%{record.totalOccurrences}"
        }
        on_error => "totalOccurrences_failed"
      }
      if [totalOccurrences] != "" {
        mutate {
          replace => {
            "total_occurrences_label.value.string_value" => "%{totalOccurrences}"
          }
          on_error => "total_occurrences_value_failed"
        }
        if ![total_occurrences_value_failed] {
          mutate {
            replace => {
              "total_occurrences_label.key" => "totalOccurrences"
            }
          }
          mutate {
            merge => {
              "subevent.idm.read_only_udm.additional.fields" => "total_occurrences_label"
            }
            on_error => "total_occurrences_value_merge_failed"
          }
        }
      }
      mutate {
        replace => {
          "summary_artifact_kind" => "%{record.summary.artifact.kind}"
        }
        on_error => "summary_artifact_kind_failed"
      }
      if [summary_artifact_kind] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.process.file.mime_type" => "%{summary_artifact_kind}"
          }
          on_error => "summary_artifact_kind_empty"
        }
      }
      mutate {
        replace => {
          "summary_artifact_sha256" => "%{record.summary.artifact.sha256}"
        }
        on_error => "summary_artifact_sha256_failed"
      }
      if [summary_artifact_sha256] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.target.file.sha256" => "%{summary_artifact_sha256}"
            "has_target_file" => "true"
          }
          on_error => "summary_artifact_sha256_empty"
        }
      }
      mutate {
        replace => {
          "summary_artifact_filePath" => "%{record.summary.artifact.filePath}"
        }
        on_error => "summary_artifact_filePath_failed"
      }
      if [summary_artifact_filePath] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.target.file.full_path" => "%{summary_artifact_filePath}"
            "has_target_file" => "true"
          }
          on_error => "summary_artifact_filePath_empty"
        }
      }
      mutate {
        replace => {
          "primaryProcess_commandLine" => "%{record.primaryProcess.commandLine}"
        }
        on_error => "primaryProcess_commandLine_failed"
      }
      if [primaryProcess_commandLine] != "" {
        mutate {
          gsub => ["primaryProcess_commandLine", '\"', ""]
        }
        mutate {
          replace => {
            "subevent.idm.read_only_udm.target.process.command_line" => "%{primaryProcess_commandLine}"
            "has_target_process" => "true"
          }
          on_error => "primaryProcess_commandLine_empty"
        }
      }
      mutate {
        replace => {
          "primaryProcess_pid" => "%{record.primaryProcess.pid}"
        }
        on_error => "primaryProcess_pid_failed"
      }
      if [primaryProcess_pid] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.target.process.pid" => "%{primaryProcess_pid}"
            "has_target_process" => "true"
          }
          on_error => "primaryProcess_pid_empty"
        }
      }
      mutate {
        replace => {
          "primaryProcess_parentPid" => "%{record.primaryProcess.parentPid}"
        }
        on_error => "primaryProcess_parentPid_failed"
      }
      if [primaryProcess_parentPid] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.target.process.parent_process.pid" => "%{primaryProcess_parentPid}"
            "has_target_process" => "true"
          }
          on_error => "primaryProcess_parentPid_empty"
        }
      }
      mutate {
        replace => {
          "primaryProcess_artifact_sha256" => "%{record.primaryProcess.artifact.sha256}"
        }
        on_error => "primaryProcess_artifact_sha256_failed_replace"
      }
      if [primaryProcess_artifact_sha256] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.process.file.sha256" => "%{primaryProcess_artifact_sha256}"
          }
          on_error => "primaryProcess_artifact_sha256_empty"
        }
        mutate {
          replace => {
            "has_principal_file" => "true"
          }
        }
      }
      mutate {
        replace => {
          "primaryProcess_artifact_filePath" => "%{record.primaryProcess.artifact.filePath}"
        }
        on_error => "primaryProcess_artifact_filePath_not_valid"
      }
      if [primaryProcess_artifact_filePath] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.principal.process.file.full_path" => "%{primaryProcess_artifact_filePath}"
          }
          on_error => "primaryProcess_artifact_filePath_empty"
        }
        mutate {
          replace => {
            "has_principal_file" => "true"
          }
        }
      }
      mutate {
        replace => {
          "primaryProcess_artifact_kind" => "%{record.primaryProcess.artifact.kind}"
        }
        on_error => "primaryProcess_artifact_kind_not_valid"
      }
      if [primaryProcess_artifact_kind] != "" {
        mutate {
          replace => {
            "subevent.idm.read_only_udm.target.process.file.mime_type" => "%{primaryProcess_artifact_kind}"
            "has_target_process" => "true"
          }
          on_error => "primaryProcess_artifact_kind_empty"
        }
      }
      for index, process in record.processes {
        mutate {
          convert => {
            "index" => "string"
          }
          on_error => "index_failed"
        }
        mutate {
          replace => {
            "process_artifact_sha256_label" => ""
            "process_artifact_filePath_label" => ""
            "process_artifact_kind_label" => ""
            "process_pid_label" => ""
            "process_commandLine_label" => ""
            "process_parentPid_label" => ""
          }
        }
        mutate {
          replace => {
            "process_artifact_sha256" => "%{process.artifact.sha256}"
            "process_artifact_filePath" => "%{process.artifact.filePath}"
            "process_artifact_kind" => "%{process.artifact.kind}"
            "process_pid" => "%{process.pid}"
            "process_commandLine" => "%{process.commandLine}"
            "process_parentPid" => "%{process.parentPid}"
          }
          on_error => "process_artifact_sha256_not_valid"
        }
        mutate {
          replace => {
            "process_artifact_sha256_label.value.string_value" => "%{process_artifact_sha256}"
          }
          on_error => "process_artifact_sha256_empty"
        }
        if ![process_artifact_sha256_empty] {
          mutate {
            replace => {
              "process_artifact_sha256_label.key" => "process_artifact_sha256: %{index}"
            }
          }
          mutate {
            merge => {
              "subevent.idm.read_only_udm.additional.fields" => "process_artifact_sha256_label"
            }
            on_error => "process_artifact_sha256_merge_failed"
          }
        }
        mutate {
          replace => {
            "process_artifact_filePath_label.value.string_value" => "%{process_artifact_filePath}"
          }
          on_error => "process_artifact_filePath_not_valid"
        }
        if ![process_artifact_filePath_not_valid] {
          mutate {
            replace => {
              "process_artifact_filePath_label.key" => "process_artifact_filePath: %{index}"
            }
          }
          mutate {
            merge => {
              "subevent.idm.read_only_udm.additional.fields" => "process_artifact_filePath_label"
            }
            on_error => "process_artifact_filePath_merge_failed"
          }
        }
        mutate {
          replace => {
            "process_artifact_kind_label.value.string_value" => "%{process_artifact_kind}"
          }
          on_error => "process_artifact_kind_not_valid"
        }
        if ![process_artifact_kind_not_valid] {
          mutate {
            replace => {
              "process_artifact_kind_label.key" => "process_artifact_kind: %{index}"
            }
          }
          mutate {
            merge => {
              "subevent.idm.read_only_udm.additional.fields" => "process_artifact_kind_label"
            }
            on_error => "process_artifact_kind_merge_failed"
          }
        }
        mutate {
          replace => {
            "process_pid_label.value" => "%{process_pid}"
          }
          on_error => "process_pid_failed"
        }
        if ![process_pid_failed] {
          mutate {
            replace => {
              "process_pid_label.key" => "process_pid: %{index}"
            }
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "process_pid_label"
            }
            on_error => "process_pid_merge_failed"
          }
        }
        mutate {
          replace => {
            "process_commandLine_label.value" => "%{process_commandLine}"
          }
          on_error => "process_commandLine_not_valid"
        }
        if ![process_commandLine_not_valid] {
          mutate {
            replace => {
              "process_commandLine_label.key" => "process_commandLine: %{index}"
            }
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "process_commandLine_label"
            }
            on_error => "process_commandLine_merge_failed"
          }
        }
        mutate {
          replace => {
