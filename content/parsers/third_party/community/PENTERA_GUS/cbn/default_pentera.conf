# Product: Pentera
# Category: Breach and Attack Simulation
# Supported Format: SYSLOG + KV
# Reference: https://pentera.io/
# Last Updated: 2026-11-25
# Copyright 2026 Google SecOps

filter {

  # Initialize the raw log fields, intermediate variables and flags that are
  # evaluated in conditional statements.
  mutate {
    replace => {
      "security_result" => ""
      "target_port" => ""
      "target_command_line" => ""
      "application_protocol" => ""
      "param_user_domain" => ""
      "param_user_name" => ""
      "param_users_username" => ""
      "param_users_domain" => ""
      "param_users_password" => ""
      "severity" => ""
      "taskRunId" => ""
      "penteraUser" => ""
      "templateName" => ""
      "logSource" => ""
      "startTime" => ""
      "status" => ""
      "operationType" => ""
      "duration" => ""
      "mitreCategories" => ""
      "mitreTechniques" => ""
      "paramIpv4" => ""
      "paramIPv4" => ""
      "paramIp" => ""
      "paramHost" => ""
      "paramTarget" => ""
      "paramAddress" => ""
      "paramDomainController" => ""
      "paramNameserver" => ""
      "paramEnumerationTarget" => ""
      "paramAliveIps" => ""
      "paramDnsServer" => ""
      "paramWebsite" => ""
      "paramPort" => ""
      "paramRport" => ""
      "paramIpRanges" => ""
      "paramIPRanges" => ""
      "paramHosts" => ""
      "paramUsername" => ""
      "paramUser" => ""
      "paramUsers" => ""
      "paramDomain" => ""
      "paramDomainName" => ""
      "paramDomainFullName" => ""
      "paramDomainOrHostname" => ""
      "paramHostDomain" => ""
      "paramQueriedDomain" => ""
      "paramContext" => ""
      "paramOriginalCommand" => ""
      "paramCommand" => ""
      "paramPath" => ""
      "paramFilename" => ""
      "paramPayload" => ""
      "paramMD5" => ""
      "paramSHA1" => ""
      "paramSHA256" => ""
      "paramProtocol" => ""
      "paramInjectionMethod" => ""
      "paramHashType" => ""
      "paramHash" => ""
      "paramObfuscationMethod" => ""
      "paramObfuscationLevel" => ""
      "paramComObject" => ""
      "paramWmiClass" => ""
      "paramConnectionMethod" => ""
      "paramIpRangeScans" => ""
      "paramRunOutOfIpRangeScan" => ""
      "paramRunHighPortScan" => ""
      "paramRunSmbPortScan" => ""
      "paramRunSshPortScan" => ""
      "paramRunRdpPortScan" => ""
      "paramRunHttpPortScan" => ""
      "paramRunHttpsPortScan" => ""
      "paramRunCustomPortsScan" => ""
      "paramRunPingSweepScan" => ""
      "paramMaxParallelism" => ""
      "paramHighPortScan" => ""
      "paramICMPSweep" => ""
      "paramRDPPortScan" => ""
      "paramSMBPortScan" => ""
      "paramSSHPortScan" => ""
      "paramHTTPPortScan" => ""
      "paramHTTPSPortScan" => ""
      "paramCustomPortsScan" => ""
      "paramExcludeDisabledAccounts" => ""
      "paramGlobalCatalog" => ""
      "paramAttackId" => ""
      "paramCleartextPassword" => ""
      "paramNtlmHash" => ""
      "paramNtlm" => ""
      "paramDomainControllers" => ""
      "syslog_timestamp" => ""
      "has_principal" => "false"
      "has_principal_resource" => "false"
      "has_principal_user" => "false"
      "has_target" => "false"
      "has_target_user" => "false"
      "has_target_domain" => "false"
      "has_ip_subnet_range" => "false"
      "is_network_event" => "false"
    }
  }

  # Extract the syslog header and the key-value payload.
  grok {
    match => {
      "message" => "^%{SYSLOGTIMESTAMP:syslog_timestamp}\\s+%{IPORHOST:syslog_host}\\s+%{GREEDYDATA:kv_message}$"
    }
    overwrite => ["syslog_timestamp", "syslog_host", "kv_message"]
    on_error => "syslog_header_grok_failed"
  }
  if [syslog_header_grok_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  kv {
    source => "kv_message"
    field_split => " "
    value_split => "="
    trim_value => "\""
    on_error => "kv_message_parse_failed"
  }
  if [kv_message_parse_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  # metadata.event_timestamp: startTime (epoch milliseconds), falling back to
  # the syslog header timestamp.
  if [startTime] not in ["", "None"] {
    date {
      match => ["startTime", "UNIX_MS"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "start_time_date_parse_failed"
    }
  } else if [syslog_timestamp] not in ["", "None"] {
    date {
      match => ["syslog_timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
      rebase => true
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "syslog_timestamp_date_parse_failed"
    }
  }

  # Event metadata.
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "PENTERA"
    }
  }
  if [logSource] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{logSource}"
      }
      on_error => "log_source_mapping_failed"
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "PENTERA"
      }
    }
  }
  if [operationType] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{operationType}"
      }
      on_error => "operation_type_mapping_failed"
    }
  }

  # principal: the Pentera platform that runs the attack operation.
  if [syslog_host] != "" {
    grok {
      match => {
        "syslog_host" => "^%{IP:syslog_host_ip}$"
      }
      overwrite => ["syslog_host_ip"]
      on_error => "syslog_host_not_ip"
    }
    if [syslog_host_not_ip] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{syslog_host}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{syslog_host}"
          "has_principal" => "true"
        }
        on_error => "principal_hostname_mapping_failed"
      }
    } else {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "syslog_host_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "syslog_host_ip"
        }
        on_error => "principal_ip_mapping_failed"
      }
      if ![principal_ip_mapping_failed] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [penteraUser] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{penteraUser}"
        "has_principal_user" => "true"
      }
      on_error => "principal_user_mapping_failed"
    }
  }
  if [taskRunId] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.product_object_id" => "%{taskRunId}"
        "has_principal_resource" => "true"
      }
      on_error => "task_run_id_mapping_failed"
    }
  }
  if [templateName] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{templateName}"
        "has_principal_resource" => "true"
      }
      on_error => "template_name_mapping_failed"
    }
  }
  if [has_principal_resource] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.resource_type" => "TASK"
      }
    }
  }

  # target.url: the website the attack operation ran against.
  if [paramWebsite] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{paramWebsite}"
      }
      on_error => "param_website_mapping_failed"
    }
  }

  # target.ip: IP address parameters of the host the attack operation ran
  # against. Each value is validated before it is mapped.
  if [paramIpv4] not in ["", "None"] {
    grok {
      match => {
        "paramIpv4" => "^%{IP:param_ipv4_ip}$"
      }
      overwrite => ["param_ipv4_ip"]
      on_error => "param_ipv4_not_ip"
    }
    if ![param_ipv4_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_ipv4_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_ipv4_ip"
        }
        on_error => "param_ipv4_mapping_failed"
      }
      if ![param_ipv4_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [paramIPv4] not in ["", "None"] {
    grok {
      match => {
        "paramIPv4" => "^%{IP:param_ipv4_variant_ip}$"
      }
      overwrite => ["param_ipv4_variant_ip"]
      on_error => "param_ipv4_variant_not_ip"
    }
    if ![param_ipv4_variant_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_ipv4_variant_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_ipv4_variant_ip"
        }
        on_error => "param_ipv4_variant_mapping_failed"
      }
      if ![param_ipv4_variant_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [paramIp] not in ["", "None"] {
    grok {
      match => {
        "paramIp" => "^%{IP:param_ip_ip}$"
      }
      overwrite => ["param_ip_ip"]
      on_error => "param_ip_not_ip"
    }
    if ![param_ip_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_ip_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_ip_ip"
        }
        on_error => "param_ip_mapping_failed"
      }
      if ![param_ip_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [paramTarget] not in ["", "None"] {
    grok {
      match => {
        "paramTarget" => "^%{IP:param_target_ip}$"
      }
      overwrite => ["param_target_ip"]
      on_error => "param_target_not_ip"
    }
    if ![param_target_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_target_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_target_ip"
        }
        on_error => "param_target_mapping_failed"
      }
      if ![param_target_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [paramAddress] not in ["", "None"] {
    grok {
      match => {
        "paramAddress" => "^%{IP:param_address_ip}$"
      }
      overwrite => ["param_address_ip"]
      on_error => "param_address_not_ip"
    }
    if ![param_address_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_address_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_address_ip"
        }
        on_error => "param_address_mapping_failed"
      }
      if ![param_address_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [paramDomainController] not in ["", "None"] {
    grok {
      match => {
        "paramDomainController" => "^%{IP:param_domain_controller_ip}$"
      }
      overwrite => ["param_domain_controller_ip"]
      on_error => "param_domain_controller_not_ip"
    }
    if ![param_domain_controller_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_domain_controller_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_domain_controller_ip"
        }
        on_error => "param_domain_controller_mapping_failed"
      }
      if ![param_domain_controller_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  # target.ip: the DNS name server when no other target host is known;
  # otherwise the name server is kept as a detection field.
  if [paramNameserver] not in ["", "None"] {
    if [has_target] != "true" {
      grok {
        match => {
          "paramNameserver" => "^%{IP:param_nameserver_ip}$"
        }
        overwrite => ["param_nameserver_ip"]
        on_error => "param_nameserver_not_ip"
      }
      if ![param_nameserver_not_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "param_nameserver_ip"
            "event.idm.read_only_udm.target.asset.ip" => "param_nameserver_ip"
          }
          on_error => "param_nameserver_mapping_failed"
        }
        if ![param_nameserver_mapping_failed] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    } else {
      mutate {
        replace => {
          "param_nameserver_label.key" => "paramNameserver"
          "param_nameserver_label.value" => "%{paramNameserver}"
        }
        on_error => "param_nameserver_label_failed"
      }
      if ![param_nameserver_label_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "param_nameserver_label"
          }
          on_error => "param_nameserver_label_merge_failed"
        }
      }
    }
  }
  if [paramEnumerationTarget] not in ["", "None"] {
    grok {
      match => {
        "paramEnumerationTarget" => "^%{IP:param_enumeration_target_ip}$"
      }
      overwrite => ["param_enumeration_target_ip"]
      on_error => "param_enumeration_target_not_ip"
    }
    if ![param_enumeration_target_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_enumeration_target_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_enumeration_target_ip"
        }
        on_error => "param_enumeration_target_mapping_failed"
      }
      if ![param_enumeration_target_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  # target.ip or target.hostname: paramHost carries an IP address or a host
  # name.
  if [paramHost] not in ["", "None"] {
    grok {
      match => {
        "paramHost" => "^%{IP:param_host_ip}$"
      }
      overwrite => ["param_host_ip"]
      on_error => "param_host_not_ip"
    }
    if [param_host_not_ip] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{paramHost}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{paramHost}"
          "has_target" => "true"
        }
        on_error => "param_host_hostname_mapping_failed"
      }
    } else {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_host_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_host_ip"
        }
        on_error => "param_host_ip_mapping_failed"
      }
      if ![param_host_ip_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  # target.ip: live hosts found by the operation. A value that is not a single
  # IP address is kept in security_result.detection_fields.
  if [paramAliveIps] not in ["", "None"] {
    grok {
      match => {
        "paramAliveIps" => "^%{IP:param_alive_ips_ip}$"
      }
      overwrite => ["param_alive_ips_ip"]
      on_error => "param_alive_ips_not_ip"
    }
    if [param_alive_ips_not_ip] {
      mutate {
        replace => {
          "param_alive_ips_label.key" => "paramAliveIps"
          "param_alive_ips_label.value" => "%{paramAliveIps}"
        }
        on_error => "param_alive_ips_label_failed"
      }
      if ![param_alive_ips_label_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "param_alive_ips_label"
          }
          on_error => "param_alive_ips_label_merge_failed"
        }
      }
    } else {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "param_alive_ips_ip"
          "event.idm.read_only_udm.target.asset.ip" => "param_alive_ips_ip"
        }
        on_error => "param_alive_ips_mapping_failed"
      }
      if ![param_alive_ips_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  # target.ip: the DNS servers queried by the operation, logged as a list such
  # as ['192.0.2.1', '192.0.2.2'].
  if [paramDnsServer] not in ["", "None", "[]"] {
    mutate {
      replace => {
        "dns_server_list" => "%{paramDnsServer}"
      }
      on_error => "param_dns_server_assignment_failed"
    }
    mutate {
      gsub => ["dns_server_list", "[\\[\\]'\\s]", ""]
      on_error => "dns_server_list_gsub_failed"
    }
    mutate {
      split => {
        source => "dns_server_list"
        separator => ","
        target => "dns_server_items"
      }
      on_error => "dns_server_list_split_failed"
    }
    if ![dns_server_list_split_failed] {
      for dns_server_index, dns_server_item in dns_server_items map {
        mutate {
          replace => {
            "dns_server_ip" => ""
          }
        }
        grok {
          match => {
            "dns_server_item" => "^%{IP:dns_server_ip}$"
          }
          overwrite => ["dns_server_ip"]
          on_error => "dns_server_item_not_ip"
        }
        if ![dns_server_item_not_ip] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.ip" => "dns_server_ip"
              "event.idm.read_only_udm.target.asset.ip" => "dns_server_ip"
            }
            on_error => "dns_server_ip_mapping_failed"
          }
          if ![dns_server_ip_mapping_failed] {
            mutate {
              replace => {
                "has_target" => "true"
              }
            }
          }
        }
      }
    }
  }

  # target.port: paramPort, or paramRport when paramPort is not logged.
  if [paramPort] not in ["", "None"] {
    mutate {
      replace => {
        "target_port" => "%{paramPort}"
      }
      on_error => "param_port_assignment_failed"
    }
  }
  if [paramRport] not in ["", "None"] {
    if [target_port] == "" {
      mutate {
        replace => {
          "target_port" => "%{paramRport}"
        }
        on_error => "param_rport_assignment_failed"
      }
    } else {
      mutate {
        replace => {
          "param_rport_label.key" => "paramRport"
          "param_rport_label.value" => "%{paramRport}"
        }
        on_error => "param_rport_label_failed"
      }
      if ![param_rport_label_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "param_rport_label"
          }
          on_error => "param_rport_label_merge_failed"
        }
      }
    }
  }
  if [target_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{target_port}"
      }
      on_error => "target_port_rename_failed"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "has_target_port_assignment_failed"
    }
  }

  # target.user.userid: the account used against the target.
  if [paramUsername] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{paramUsername}"
        "has_target_user" => "true"
      }
      on_error => "param_username_mapping_failed"
    }
  }
  if [paramUser] not in ["", "None"] {
    grok {
      match => {
        "paramUser" => "^(?P<param_user_domain>[^\\\\]+)\\\\+(?P<param_user_name>[^\\\\]+)$"
      }
      overwrite => ["param_user_domain", "param_user_name"]
      on_error => "param_user_not_domain_qualified"
    }
    if [param_user_not_domain_qualified] {
      mutate {
        replace => {
          "param_user_name" => "%{paramUser}"
        }
        on_error => "param_user_name_assignment_failed"
      }
    }
    if [has_target_user] == "false" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{param_user_name}"
          "has_target_user" => "true"
        }
        on_error => "param_user_mapping_failed"
      }
    } else {
      mutate {
        replace => {
          "param_user_label.key" => "paramUser"
          "param_user_label.value" => "%{paramUser}"
        }
        on_error => "param_user_label_failed"
      }
      if ![param_user_label_failed] {
        mutate {
          merge => {
            "security_result.detection_fields" => "param_user_label"
          }
          on_error => "param_user_label_merge_failed"
        }
      }
    }
  }
  if [paramUsers] not in ["", "None", "[]"] {
    grok {
      match => {
        "paramUsers" => "Username\\{EQUAL\\}(?P<param_users_username>[^,}\\]]+)"
      }
      overwrite => ["param_users_username"]
      on_error => "param_users_username_grok_failed"
    }
    grok {
      match => {
        "paramUsers" => "Domain\\{EQUAL\\}(?P<param_users_domain>[^,}\\]]+)"
      }
      overwrite => ["param_users_domain"]
      on_error => "param_users_domain_grok_failed"
    }
    grok {
      match => {
        "paramUsers" => "cleartextPassword\\{EQUAL\\}(?P<param_users_password>[^,}\\]]+)"
      }
      overwrite => ["param_users_password"]
      on_error => "param_users_password_grok_failed"
    }
    if [param_users_username] != "" {
      if [has_target_user] == "false" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{param_users_username}"
            "has_target_user" => "true"
          }
          on_error => "param_users_username_mapping_failed"
        }
      } else {
        mutate {
          replace => {
            "param_users_username_label.key" => "paramUsers.Username"
