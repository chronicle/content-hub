        "duration_label.key" => "duration"
        "duration_label.value.string_value" => "%{duration}"
      }
      on_error => "duration_label_failed"
    }
    if ![duration_label_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "duration_label"
        }
        on_error => "duration_label_merge_failed"
      }
    }
  }

  # metadata.event_type: each log records an attack operation that Pentera
  # performed or attempted, not endpoint telemetry. IP range scans are
  # SCAN_NETWORK, operations against a known target host are
  # NETWORK_CONNECTION, operations with only user details are
  # USER_UNCATEGORIZED, other operations reported by the Pentera host are
  # STATUS_UPDATE, and the rest are GENERIC_EVENT.
  if [operationType] in ["Scanning hosts", "Scanned hosts via the browser", "Discovered live hosts"] and [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_NETWORK"
      }
    }
  } else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        "is_network_event" => "true"
      }
    }
  } else if [has_principal_user] == "true" or [has_target_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  # network.application_protocol: mapped for network connection events,
  # where the protocol describes the connection to the target host.
  if [application_protocol] != "" {
    if [is_network_event] == "true" {
      if [application_protocol] == "SMB" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "SMB"
          }
        }
      } else if [application_protocol] == "FTP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "FTP"
          }
        }
      } else if [application_protocol] == "RDPEXECUTOR" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "RDP"
          }
        }
      } else if [application_protocol] in ["DCOM", "DCOMEXECUTOR", "WMI", "WMIEXECUTOR", "ATSVCEXECUTOR", "MS-SCMR"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "DCERPC"
          }
        }
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
    on_error => "output_merge_failed"
  }
}
