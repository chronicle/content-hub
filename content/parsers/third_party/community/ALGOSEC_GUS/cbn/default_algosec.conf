# Product: AlgoSec Security Management
# Category: Policy Management
# Supported Format: SYSLOG + KV (CEF)
# Reference: See below
# Last Updated: 2025-12-05
# Copyright 2025 Google SecOps

#
# Additional References:
#   - https://www.algosec.com/docs/en/asms/a30.00/asms-help/content/afa-admin/afa-syslog-messages.htm
#   - https://www.algosec.com/docs/en/asms/a30.00/asms-help/content/afa-admin/understanding-login-and-logout.htm

filter {
  mutate {
    replace => {
      "IP" => ""
      "version" => ""
      "product" => ""
      "event_name" => ""
      "algosec_ip" => ""
      "algosec_host" => ""
      "host_type" => ""
      "details" => ""
      "device" => ""
      "metric" => ""
      "event_id" => ""
      "sec_result" => ""
      "sec_result_severity" => ""
      "msg" => ""
      "target_app" => ""
      "src_ip" => ""
      "TemplateName" => ""
      "desc" => ""
      "DeviceIP_is_not_IP" => ""
      "kv_data" => ""
      "report_data_DeviceIP" => ""
      "report_data_json" => ""
      "firewall_device" => ""
      "extension" => ""
      "iporhost" => ""
      "dest_ip" => ""
      "src_port" => ""
      "dest_port" => ""
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "HIPAA_Score" => ""
      "process_name" => ""
      "processnamevalue" => ""
      "process_pid" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  mutate {
    gsub => ["message","\\n",""]
  }

  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:datetime} %{IPORHOST:iporhost}(?:|%{GREEDYDATA:process_name}) CEF:%{INT:cef_version}\\|%{DATA:vendor}\\|%{DATA:product}\\|%{DATA:version}\\|%{DATA:event_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{DATA:domain_id}\\|%{GREEDYDATA:extension}",
        "%{SYSLOGTIMESTAMP:datetime} %{IPORHOST:iporhost}(?:|%{GREEDYDATA:process_name}) CEF:%{INT:cef_version}\\|%{DATA:vendor}\\|%{DATA:product}\\|%{DATA:version}\\|%{DATA:event_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|msg=%{GREEDYDATA:msg}"
      ]
    }
    overwrite => ["version", "product", "event_name", "datetime", "event_id", "msg", "extension", "iporhost", "process_name"]
    on_error => "grok_fail"
  }

  if [grok_fail] and [message] !~ "CEF:" {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:datetime} %{IPORHOST:iporhost} %{WORD:target_app}%{DATA}: %{DATA:desc}: \\[%{IPORHOST:src_ip}\\]:%{INT:src_port}->\\[%{IPORHOST:dest_ip}\\]:%{INT:dest_port}",
          "%{SYSLOGTIMESTAMP:datetime} %{IPORHOST:iporhost} %{DATA:target_app}\\[%{INT}\\]: %{DATA:desc}; %{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["datetime", "target_app", "src_ip", "desc", "iporhost", "dest_ip", "src_port", "dest_port", "kv_data"]
      on_error => "grok_fail_2"
    }
    if [grok_fail_2] {
      grok {
        match => {
          "message" => [
            "%{SYSLOGTIMESTAMP:datetime} %{IPORHOST:iporhost} %{DATA}: %{GREEDYDATA:desc}?\\\n",
            "%{SYSLOGTIMESTAMP:datetime} %{IPORHOST:iporhost} %{DATA}: %{GREEDYDATA:desc}; %{GREEDYDATA:kv_data}"
            "%{SYSLOGTIMESTAMP:datetime} %{IPORHOST:iporhost} %{DATA:process_name}: %{GREEDYDATA:desc}"
          ]
        }
        overwrite => ["datetime", "desc", "iporhost", "kv_data", "process_name"]
        on_error => "malformed_logs"
      }
      if ![malformed_logs] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{iporhost}"
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
        if [desc] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.description" => "%{desc}"
            }
          }
        }
      }
      else {
        drop {
          tag => "TAG_MALFORMED_MESSAGE"
        }
      }
    }
  }

  # Metadata
  date {
    match => ["datetime", "MMM  d HH:mm:ss", "MMM d HH:mm:ss", "MMM dd HH:mm:ss", "MMM  dd HH:mm:ss"]
    rebase => true
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "AlgoSec"
    }
  }

  if [product] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product}"
      }
    }
  }
  if [event_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_name}"
      }
    }
  }
  if [version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      }
    }
  }
  if [process_name] != "" {
    grok {
      match => {
        "process_name" => [
          "%{DATA:processnamevalue}\\[%{GREEDYDATA:process_pid}\\]"
        ]
      }
      overwrite => ["processnamevalue", "process_pid"]
      on_error => "no_process_pid"
    }
    if ![no_process_pid] {
      if [process_pid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.process.pid" => "%{process_pid}"
          }
          on_error => "no_process_principal_pid"
        }
      }
      if [processnamevalue] != "" {
        mutate {
          replace => {
            "processname_label.key" => "processname"
            "processname_label.value.string_value" => "%{processnamevalue}"
          }
          on_error => "no_processname_label"
        }
        if ![no_processname_label] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "processname_label"
            }
            on_error => "no_processname_label_merge"
          }
        }
      }
    }
  }

  # Fix splitters to read as Key-Value
  mutate {
    gsub => ["extension", "(\\\s+)(\\\S+)=", "|$2="]
  }

  kv {
    source => "extension"
    value_split => "="
    field_split => "|"
    on_error => "kv_fail"
  }
  if [kv_data] != "" and [kv_fail] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  # Check if algosec device is an IP or hostname
  if [iporhost] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
    mutate {
      replace => {
        "algosec_ip" => "%{iporhost}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "algosec_host" => "%{iporhost}"
      }
    }
  }

  if [product] == "Suite" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
      }
    }

    # Internal events do not include the IP address, because it will always be the localhost.
    if [IP] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "IP"
        }
      }
    }

    if [algosec_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "algosec_ip"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{algosec_host}"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        "sec_result.summary" => "%{event_name}"
        "sec_result_action" => "ALLOW"
        "sec_result_severity" => "LOW"
      }
    }

    # Fields related to events
    if [event_id] == "Successful login" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "sec_result.description" => "Successful login occurred."
        }
      }
    }
    else if [event_id] == "Internal Connection - Successful login" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "sec_result.description" => "Internal connection event related to a successful login."
        }
      }
    }
    else if [event_id] == "Internal Connection - Session expired logout" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "sec_result.description" => "Internal connection event related to a logout due to a session expiration."
        }
      }
    }
    else if [event_id] == "Internal Connection - Unsuccessful login" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "sec_result.description" => "Internal connection event related to a unsuccessful login."
          "sec_result_action" => "BLOCK"

        }
      }
    }
    else if [event_id] == "Unsuccessful login" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "sec_result.description" => "Unsuccessful login occurred."
          "sec_result_action" => "BLOCK"

        }
      }
    }
    else if [event_id] == "Session expired logout" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "sec_result.description" => "Logout due to a session expiration."
        }
      }
    }
    else if [event_id] == "Internal Connection - Manual logout" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "sec_result.description" => "Internal Connection - Manual logout."
        }
      }
    }
    else if [event_id] == "Manual logout" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "sec_result.description" => "Manual logout."
        }
      }
    }

    mutate {
      merge => {
        "sec_result.action" => "sec_result_action"
      }
    }
  }
  else if [product] == "Firewall Analyzer" and [event_id] == "Admin" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
      }
    }

    if [algosec_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "algosec_ip"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{algosec_host}"
        }
      }
    }

    mutate {
      replace => {
        "sec_result.summary" => "%{msg}"
        "sec_result.description" => "Indicate a situation that requires administrative attention. Msg=%{msg}"
        "sec_result_severity" => "HIGH"
      }
    }
  }
  else if [product] == "Firewall Analyzer" and [event_id] != "Admin" {
    mutate {
      replace => {
        # SCAN_HOST, SCAN_UNCATEGORIZED fails udm2sdmvalidation
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }

    if [algosec_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.observer.ip" => "algosec_ip"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.hostname" => "%{algosec_host}"
        }
      }
    }

    grok {
      match => {
        "firewall" => [
          "^%{NOTSPACE:firewall_device}$"
          "^%{NOTSPACE:firewall_device} %{GREEDYDATA:report_data_json}"
        ]
      }
      overwrite => ["firewall_device", "report_data_json"]
      on_error => "grok_fail_firewall"
    }
    if [firewall_device] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{firewall_device}"
        }
        on_error => "no_host"
      }
    }

    mutate {
      replace => {
        "sec_result_action" => "ALLOW"
        "sec_result_severity" => "LOW"
        "category1" => "POLICY_VIOLATION"
      }
    }
    mutate {
      merge => {
        "sec_result.category" => "category1"
      }
    }
    mutate {
      merge => {
        "sec_result.action" => "sec_result_action"
      }
    }

    # Fields related to events
    if [event_id] == "Start" {
      mutate {
        replace => {
          "sec_result.summary" => "Indicate that an AFA analysis has begun."
          "sec_result.description" => "Report=%{report}"
        }
      }
    }
    else if [event_id] == "End" {
      mutate {
        replace => {
          "sec_result.summary" => "Indicate the completion of an analysis process, regardless of status."
        }
      }
      mutate {
        replace => {
          "sec_result.url_back_to_product" => "%{url}"
        }
        on_error => "no_url"
      }
      mutate {
        replace => {
          "sec_result.description" => "Report=%{report}, Status=%{status}"
        }
        on_error => "value_missing"
      }
      if [value_missing] {
        mutate {
          replace => {
            "sec_result.description" => "Status=%{status}, Msg=%{msg}"
          }
        }
      }
      if [status] == "Failure" {
        mutate {
          replace => {
            "sec_result_severity" => "MEDIUM"
          }
        }
      }
    }
    else if [event_id] == "Info" {
      mutate {
        replace => {
          "sec_result.description" => "Report=%{report}, Msg=%{msg}"
        }
        on_error => "no_values"
     }

     if ![no_values] {
       mutate {
         replace => {
           "sec_result.summary" => "Contain additional details about report findings, such as changes in policies."
         }
       }
     }

     if [no_values] {
       mutate {
         replace => {
           "sec_result.description" => "Msg=%{msg}"
         }
       }
     }
     if [msg] =~ "^Summary: " {
       grok {
         match => {
           "msg" => [
                    "^Summary: %{DATA:risk_level} %{NUMBER:risk_count} %{DATA:risk_code} %{GREEDYDATA:risk_title} %{NUMBER}$"
                    "^Summary: %{DATA:risk_level} %{NUMBER:risk_count} %{DATA:risk_code} %{GREEDYDATA:risk_title}"
            ]
          }
        }
        mutate {
          replace => {
            "sec_result.summary" => "%{risk_title}"
          }
        }
      }

      if [msg] =~ "^Summary: (susp_)?high" {
        mutate {
          replace => {
            "sec_result_severity" => "HIGH"
          }
        }
      }
      else if [msg] =~ "^Summary: medium" {
        mutate {
          replace => {
            "sec_result_severity" => "MEDIUM"
          }
        }
      }
    }
    else if [event_id] == "Findings" {
      mutate {
        replace => {
          "sec_result.summary" => "Summarize the analysis results."
        }
      }
      mutate {
        replace => {
          "sec_result.description" => "Report=%{report}, Status=%{status}, Msg=%{msg}"
        }
        on_error => "missing_value"
      }
      if [msg] =~ "high" {
        mutate {
          replace => {
            "sec_result_severity" => "HIGH"
          }
        }
      }
      else if [msg] =~ "medium" {
        mutate {
          replace => {
            "sec_result_severity" => "MEDIUM"
          }
        }
      }
    }
    else if [event_id] == "ReportData" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
      json {
        source => "report_data_json"
        target => "report_data"
        on_error => "json_fail_report_data"
      }
      mutate {
        rename => {
          "report_data.NIST_800-53 Level" => "addition.nist_800_53_level"
          "report_data.GLBA Level" => "addition.glba_level"
          "report_data.NIST_800-41 Score" => "addition.nist_800_41_score"
          "report_data.DORA Level" => "addition.dora_level"
          "report_data.TRM Level" => "addition.trm_level"
          "report_data.NCA Score" => "addition.nca_score"
          "report_data.LGPD Score" => "addition.lgpd_score"
          "report_data.Number of Duplicate Objects" => "addition.number_of_duplicate_objects"
          "report_data.GLBA Score" => "addition.glba_score"
          "report_data.BASEL Level" => "addition.basel_level"
          "report_data.Report Date" => "addition.report_date"
          "report_data.NIST_800-171 Level" => "addition.nist_800_171_level"
          "report_data.Rule Count" => "addition.rule_count"
          "report_data.BSI Level" => "addition.bsi_level"
          "report_data.NCA Level" => "addition.nca_level"
          "report_data.changes.Total Deleted" => "addition.changes_total_deleted"
          "report_data.changes.Number of Rules Changes" => "addition.changes_number_of_rules_changes"
          "report_data.changes.Total Number of Changes" => "addition.changes_total_number_of_changes"
          "report_data.changes.Number of Topology Changes" => "addition.changes_number_of_topology_changes"
          "report_data.changes.Total Edited" => "addition.changes_total_edited"
          "report_data.changes.Number of Risk Changes" => "addition.changes_number_of_risk_changes"
          "report_data.changes.Total Added" => "addition.changes_total_added"
          "report_data.changes.Total Change Operations" => "addition.changes_total_change_operations"
          "report_data.changes.Number of Network Object Changes" => "addition.changes_number_of_network_object_changes"
          "report_data.changes.Number of Audit Log Changes" => "addition.changes_number_of_audit_log_changes"
          "report_data.changes.Number of Baseline Changes" => "addition.changes_number_of_baseline_changes"
          "report_data.changes.Number of Policy Object Changes" => "addition.changes_number_of_policy_object_changes"
          "report_data.changes.Number of Service Object Changes" => "addition.changes_number_of_service_object_changes"
          "report_data.changes.Other Changes" => "addition.changes_other_changes"
          "report_data.changes.Number of Application Object Changes" => "addition.changes_number_of_application_object_changes"
          "report_data.NIST_800-41 Level" => "addition.nist_800_41_level"
          "report_data.SWIFT Score" => "addition.swift_score"
          "report_data.Number of Disabled Rules" => "addition.number_of_disabled_rules"
          "report_data.BSI Score" => "addition.bsi_score"
          "report_data.Number of Low Risks" => "addition.number_of_low_risks"
          "report_data.PCI Score" => "addition.pci_score"
          "report_data.Number of Low Severity Risky Rules" => "addition.number_of_low_severity_risky_rules"
          "report_data.ISO27001 Score" => "addition.iso27001_score"
          "report_data.SOX Level" => "addition.sox_level"
          "report_data.Number of High Severity Risky Rules" => "addition.number_of_high_severity_risky_rules"
          "report_data.Domain Name" => "addition.domain_name"
          "report_data.PCI Level" => "addition.pci_level"
          "report_data.ASD_ISM Score" => "addition.asd_ism_score"
          "report_data.Number of Unused Rules" => "addition.number_of_unused_rules"
          "report_data.ASD_ISM Level" => "addition.asd_ism_level"
          "report_data.Device Groups" => "addition.device_groups"
          "report_data.HIPAA Level" => "addition.hipaa_level"
          "report_data.GDPR Level" => "addition.gdpr_level"
          "report_data.HKMA Level" => "addition.hkma_level"
          "report_data.Number of Medium Severity Risky Rules" => "addition.number_of_medium_severity_risky_rules"
          "report_data.NIST_800-171 Score" => "addition.nist_800_171_score"
          "report_data.GDPR Score" => "addition.gdpr_score"
          "report_data.Number of Suspected High Risks" => "addition.number_of_suspected_high_risks"
          "report_data.Number of High Risks" => "addition.number_of_high_risks"
          "report_data.PCI4 Score" => "addition.pci4_score"
          "report_data.Change By" => "addition.change_by"
          "report_data.Device Id" => "addition.device_id"
          "report_data.Device Brand" => "addition.device_brand"
          "report_data.NERC Score" => "addition.nerc_score"
          "report_data.ISO27001 Level" => "addition.iso27001_level"
          "report_data.SOX Score" => "addition.sox_score"
          "report_data.NERC Level" => "addition.nerc_level"
          "report_data.BASEL Score" => "addition.basel_score"
          "report_data.PCI4 Level" => "addition.pci4_level"
          "report_data.HIPAA Score" => "addition.hipaa_score"
          "report_data.Number of Special Case Rules" => "addition.number_of_special_case_rules"
          "report_data.Number of Covered Rules" => "addition.number_of_covered_rules"
          "report_data.Number of Suspected High Severity Risky Rules" => "addition.number_of_suspected_high_severity_risky_rules"
          "report_data.Number of Medium Risks" => "addition.number_of_medium_risks"
          "report_data.SWIFT Level" => "addition.swift_level"
          "report_data.TRM Score" => "addition.trm_score"
          "report_data.LGPD Level" => "addition.lgpd_level"
          "report_data.HKMA Score" => "addition.hkma_score"
          "report_data.ECB Score" => "addition.ecb_score"
          "report_data.ECB Level" => "addition.ecb_level"
          "report_data.DORA Score" => "addition.dora_score"
          "report_data.NIST_800-53 Score" => "addition.nist_800_53_score"
        }
      }

      for key, value in addition map {
        mutate {
          replace => {
            "_field" => ""
          }
        }
        mutate {
          convert => {
            "value" => "string"
          }
          on_error => "value_conversion_error"
        }
        mutate {
          replace => {
            "_check" => "%{value}"
          }
          on_error => "no_value"
        }
        if ![no_value] and [value] not in ["not", "none", "not_defined", ""] {
          mutate {
            replace => {
              "_field.key" => "%{key}"
            }
          }
          if [key] in ["bsi_level", "swift_score"] {
            mutate {
              replace => {
                "_field.value.string_value" => "%{value}"
              }
              on_error => "field_value_conversion_error"
            }
            if ![field_value_conversion_error] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "_field"
                }
                on_error => "addition_merge_failed"
              }
            }
          }
          else {
            mutate {
              replace => {
                "_field.value" => "%{value}"
              }
              on_error => "field_value_conversion_error_sec_result"
            }
            if ![field_value_conversion_error_sec_result] {
              mutate {
                merge => {
                  "sec_result.detection_fields" => "_field"
                }
                on_error => "detection_fields_merge_failed"
              }
            }
          }
        }
      }
      mutate {
        replace => {
          "report_data.Highest_Risk_Level" => ""
        }
      }
      mutate {
        convert => {
          "report_data.Security Rating Score" => "string"
        }
        on_error => "already_string"
      }
      mutate {
        replace => {
          "report_data_DeviceIP" => "%{report_data.Device IP}"
        }
        on_error => "no_value_device_ip"
      }
      mutate {
        replace => {
          "report_data.Highest_Risk_Level" => "%{report_data.Highest Risk Level}"
        }
        on_error => "no_value_highest_risk_level"
      }
      mutate {
        replace => {
          "report_data.Security_Rating_Score" => "%{report_data.Security Rating Score}"
        }
        on_error => "no_value_security_rating_score"
      }
      if [report_data_DeviceIP] != "" {
        grok {
          match => {
            "report_data_DeviceIP" => [
              "%{IP:report_data_DeviceIP}"
            ]
          }
          overwrite => ["report_data_DeviceIP"]
          on_error => "no_value_ip"
        }
        if ![no_value_ip] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.ip" => "report_data_DeviceIP"
              "event.idm.read_only_udm.target.asset.ip" => "report_data_DeviceIP"
            }
            on_error => "no_value_ip_target_ip"
          }
        }
      }
      mutate {
        replace => {
          "sec_result.summary" => "Provide details for a specific report."
          "sec_result.description" => "Report=%{report}, Highest Risk Level=%{report_data.Highest_Risk_Level}, Security Rating Score=%{report_data.Security_Rating_Score}"
        }
        on_error => "values_not_present"
      }
      if [report_data][Highest_Risk_Level] =~ "High" {
        mutate {
          replace => {
            "sec_result_severity" => "HIGH"
          }
        }
      }
      else if [report_data][Highest_Risk_Level] =~ "Medium" {
        mutate {
          replace => {
            "sec_result_severitysec_result.severity" => "MEDIUM"
          }
        }
      }
    }
  }

  if [product] == "ms-watchdog" and [event_id] == "ASMS Metrics" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_HOST"
      }
    }
    if [algosec_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "algosec_ip"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{algosec_host}"
        }
      }
    }

    if [status] =~ "PASS" {
      mutate {
        replace => {
          "sec_result_action" => "ALLOW"
        }
      }
      mutate {
        merge => {
          "sec_result.action" => "sec_result_action"
        }
      }
    }
    if [host_type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.category" => "%{host_type}"
        }
      }
    }
    if [device] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.hostname" => "%{device}"
        }
      }
    }
    if [metric] != "" {
      mutate {
        replace => {
          "sec_result.action_details" => "%{metric}"
        }
      }
    }
    if [details] != "" {
      mutate {
        replace => {
          "sec_result.summary" => "%{details}"
        }
      }
    }
  }
  else if [target_app] =~ "snmpd" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
    if [algosec_host] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{algosec_host}"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{target_app}"
        "event.idm.read_only_udm.metadata.description" => "%{desc}"
      }
    }
    if [desc] =~ "UDP" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "UDP"
        }
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dest_ip"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dest_port}"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
    }
  }
  else if [message] =~ "syslog-ng" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        "event.idm.read_only_udm.metadata.description" => "%{desc}"
      }
    }
    mutate {
      replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{algosec_host}"
      }
    }
    grok {
      match => {
        "kv_data" => "stored='dst.udp%{GREEDYDATA},%{IP:dst_ip}:%{INT:dst_port}"
      }
      on_error => "grok_fail_kv_data"
    }
    if ![grok_fail_kv_data] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dst_ip"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{dst_port}"
        }
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
      }
    }
  }
  else {
    if [product] == "FireFlow" {
      if [event_id] == "Log" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
            "event.idm.read_only_udm.principal.hostname" => "%{algosec_host}"
            "sec_result.summary" => "%{msg}"
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.user_display_name" => "%{by_user}"
          }
        }
      }
      else if [event_id] == "ReportData" {
        json {
          source => "extension"
          on_error => "fail"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
            "event.idm.read_only_udm.principal.hostname" => "%{algosec_host}"
          }
        }
        if [Requestor][Email] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.user.email_addresses" => "Requestor.Email"
            }
          }
        }
        if [Requestor][Name] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.user_display_name" => "%{Requestor.Name}"
            }
          }
        }
        if [TemplateName] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.description" => "%{TemplateName}"
            }
          }
        }
        if [RequestType] != "" {
          mutate {
            replace => {
              "request_type.key" => "RequestType"
              "request_type.value" => "%{RequestType}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "request_type"
            }
          }
        }
        if [WorkFlow] != "" {
          mutate {
            replace => {
              "workflow.key" => "WorkFlow"
              "workflow.value" => "%{WorkFlow}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "workflow"
            }
          }
        }

        if [Status] != "" {
          mutate {
            replace => {
              "sec_result.action_details" => "%{Status}"
            }
          }
        }
      }
    }
    if [target_app] == "dbus" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          "event.idm.read_only_udm.principal.hostname" => "%{iporhost}"
          "sec_result.summary" => "%{kv_data}"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{target_app}"
          "event.idm.read_only_udm.metadata.description"  => "%{desc}"
        }
      }
      grok {
        match => {
          "desc" => "pid=%{INT:pid} comm=\\\"%{GREEDYDATA:commnd} \\\""
        }
        on_error => "grok_fail_desc"
      }
      if ![grok_fail_desc] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.pid" => "%{pid}"
            "event.idm.read_only_udm.target.process.command_line" => "%{commnd}"
          }
        }
      }
    }
  }
  if [sec_result_severity] != "" {
    mutate {
      replace => {
        "sec_result.severity" => "%{sec_result_severity}"
      }
    }
  }
  if [sec_result] != "" {
    mutate {
      merge => {
          "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }
  mutate {
    merge => {
        "@output" => "event"
    }
  }
}
