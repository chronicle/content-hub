# Google SecOps Default CBN Parser (PING_ONE)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/PING_ONE/default/ping_one.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "PING"
      "event.idm.read_only_udm.metadata.product_name" => "PING_ONE"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
