      }
    }
    if [msg][_embedded][riskEvaluation][updatedAt] != "" {
      mutate {
        replace => {
          "updatedAt_label.key" => "updatedAt"
          "updatedAt_label.value" => "%{msg._embedded.riskEvaluation.updatedAt}"
