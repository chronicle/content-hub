filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "network" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "actionType" => ""
      "actorId" => ""
      "environmentId" => ""
      "eventType" => ""
      "id" => ""
      "logtype" => ""
      "resourceId" => ""
      "resourceType" => ""
      "result" => ""
      "msg._embedded.riskDetails.UserNameOverrideReason" => ""
      "msg.correlationId" => ""
      "msg.id" => ""
      "msg.recordedAt" => ""
      "msg._embedded.riskEvent.completionStatus" => ""
      "msg._embedded.riskEvent.ip" => ""
      "msg._embedded.riskEvent.sessionId" => ""
      "msg._embedded.riskEvent.targetResourceId" => ""
      "msg._embedded.riskEvent.targetResourceName" => ""
      "msg._embedded.riskEvent.userAgent" => ""
      "msg._embedded.riskEvent.userId" => ""
      "msg._embedded.riskEvent.userType" => ""
      "msg._embedded.riskEvent.username" => ""
      "msg.source.ipAddress" => ""
      "msg.source.userAgent" => ""
      "msg.result.description" => ""
      "msg.result.status" => ""
      "msg.actors.client.href" => ""
      "msg.actors.client.id" => ""
      "msg.actors.client.name" => ""
      "msg.actors.client.type" => ""
      "msg.actors.user.id" => ""
      "msg.actors.user.name" => ""
      "msg.actors.user.type" => ""
      "msg._embedded.riskEvaluation.result.level" => ""
      "msg._embedded.riskEvaluation.result.score" => ""
      "msg._embedded.riskEvaluation.result.source" => ""
      "msg._embedded.riskEvaluation.result.type" => ""
      "msg._embedded.riskEvaluation.riskPolicySet" => ""
      "msg._embedded.riskEvaluation.updatedAt" => ""
      "msg._embedded.riskEvaluation.riskResult.value" => ""
      "msg._embedded.riskEvaluation.event.browser.userAgent" => ""
      "source_ipaddress" => ""
      "sec_action" => ""
      "has_user" => "false"
      "outcomeDescription" => ""
      "outcomeStatusDetail" => ""
      "transactionId_flow" => ""
      "flowName" => ""
      "companyId" => ""
      "eventMessage" => ""
      "flowVersionId" => ""
      "interaction_msg" => ""
      "originalCapabilityName" => ""
      "flow_userAgent" => ""
      "success" => ""
      "identity" => ""
      "outcomeType" => ""
      "outcomeStatus" => ""
      "connectionId" => ""
      "err_code" => ""
      "err_msg" => ""
      "err_httpResponseCode" => ""
      "collectionDate" => ""
      "number_of_selfies_captured" => ""
      "document_submission_complete" => ""
    }
  }
  mutate {
    gsub => ["message","message", "msg"]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }
  if [json_failed] {
    mutate {
      gsub => ["message", "\\r\\n", ""]
    }
    mutate {
      replace => {
        "device_json_message" => "{\"records\":%{message}}"
      }
      on_error => "not_in_json_format"
    }
    json {
      source => "device_json_message"
      array_function => "split_columns"
      on_error => "json_failed_records"
    }
    if [json_failed_records] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }

    for record in records {
      mutate {
        replace => {
          "action_description" => ""
          "action_type" => ""
          "action_type_label" => ""
          "source_ipaddress" => ""
          "source_userAgent" => ""
          "record_id" => ""
          "record_recordedAt" => ""
          "record_correlationId" => ""
          "correlationId_label" => ""
          "internal_correlation_id" => ""
          "record_transactionId" => ""
          "transactionId_label" => ""
          "result_status" => ""
          "result_description" => ""
          "actor_clientId" => ""
          "client_name" => ""
          "environment_id" => ""
          "client_href" => ""
          "actor_userId" => ""
          "actor_username" => ""
          "user_environment_id" => ""
          "population_id_label" => ""
          "population_id" => ""
          "user_href" => ""
          "user_href_label" => ""
          "user_type" => ""
          "has_principal" => "false"
          "has_target" => "false"
          "has_user" => "false"
          "client_type" => ""
          "client_type_label" => ""
          "sec_result" => ""
          "event1" => ""
          "outcomeDescription" => ""
          "outcomeStatusDetail" => ""
          "transactionId_flow" => ""
          "flowName" => ""
          "companyId" => ""
          "eventMessage" => ""
          "eventMessage_label" => ""
          "flowVersionId" => ""
          "connectorId" => ""
          "usageTransactionType" => ""
          "nodeTitle" => ""
          "correlationId_flow" => ""
          "nodeId" => ""
          "flowInteractionEvent_id" => ""
          "interactionId" => ""
          "originalCapabilityName" => ""
          "flow_userAgent" => ""
          "success" => ""
          "success_label" => ""
          "identity" => ""
          "outcomeType" => ""
          "outcomeStatus" => ""
          "connectionId" => ""
          "err_code" => ""
          "err_msg" => ""
          "err_httpResponseCode" => ""
          "collectionDate" => ""
          "number_of_selfies_captured" => ""
          "document_submission_complete" => ""
          "metadata_id" => ""
          "metadata_id_label" => ""
          "metadata_provider" => ""
          "metadata_provider_label" => ""
          "metadata_type" => ""
          "metadata_type_label" => ""
          "metadata_status" => ""
          "overallWeightedScore" => ""
          "overall_weighted_score_label" => ""
          "overallConfidenceScore" => ""
          "overall_confidence_score_label" => ""
          "birth_date_raw_score" => ""
          "birth_date_raw_score_label" => ""
          "birth_date_confidence" => ""
          "birth_date_confidence_label" => ""
          "name_raw_score" => ""
          "name_raw_score_label" => ""
          "name_confidence" => ""
          "name_confidence_label" => ""
          "given_name_raw_score" => ""
          "given_name_raw_score_label" => ""
          "given_name_confidence" => ""
          "given_name_confidence_label" => ""
          "family_name_raw_score" => ""
          "family_name_raw_score_label" => ""
          "family_name_confidence" => ""
          "family_name_confidence_label" => ""
          "veriff_vendor_data" => ""
          "veriff_vendor_data_label" => ""
          "veriff_status" => ""
          "veriff_status_label" => ""
          "veriff_id" => ""
          "veriff_id_label" => ""
          "veriff_code" => ""
          "veriff_code_label" => ""
          "veriff_decision_time" => ""
          "veriff_decision_time_label" => ""
          "veriff_acceptance_time" => ""
          "veriff_acceptance_time_label" => ""
          "header_actor_ip" => ""
        }
      }
      mutate {
        replace => {
          "client_type" => "%{record.actors.client.type}"
        }
        on_error => "client_type_not_present"
      }
      if [client_type] != "" {
        mutate {
          replace => {
            "client_type_label.key" => "clientType"
            "client_type_label.value" => "%{client_type}"
          }
          on_error => "client_type_mapping_failed"
        }
        if ![client_type_mapping_failed] {
          mutate {
            merge => {
              "event1.idm.read_only_udm.principal.resource.attribute.labels" => "client_type_label"
            }
            on_error => "client_type_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "user_type" => "%{record.actors.user.type}"
        }
        on_error => "user_type_not_present"
      }
      if [user_type] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.title" => "%{user_type}"
          }
          on_error => "user_type_mapping_failed"
        }
      }
      mutate {
        replace => {
          "user_href" => "%{record.actors.user.href}"
        }
        on_error => "user_href_not_present"
      }
      if [user_href] != "" {
        mutate {
          replace => {
            "user_href_label.key" => "user_href"
            "user_href_label.value" => "%{user_href}"
          }
          on_error => "user_href_mapping_failed"
        }
        if ![user_href_mapping_failed] {
          mutate {
            merge => {
              "event1.idm.read_only_udm.principal.resource.attribute.labels" => "user_href_label"
            }
            on_error => "user_href_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "population_id" => "%{record.actors.user.population.id}"
        }
        on_error => "population_id_not_present_replace_error"
      }
      if [population_id] != "" {
        mutate {
          replace => {
            "population_id_label.key" => "populationId"
            "population_id_label.value.string_value" => "%{population_id}"
          }
          on_error => "population_id_not_present"
        }
        if ![population_id_not_present] {
          mutate {
            merge => {
              "event1.idm.read_only_udm.additional.fields" => "population_id_label"
            }
            on_error => "population_id_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "user_environment_id" => "%{record.actors.user.environment.id}"
        }
        on_error => "user_environment_id_not_present"
      }
      if [user_environment_id] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.asset_id" => "user_environment_id:%{user_environment_id}"
            "has_principal" => "true"
          }
          on_error => "user_environment_id_mapping_failed"
        }
      }
      mutate {
        replace => {
          "actor_username" => "%{record.actors.user.name}"
        }
        on_error => "actor_username_not_present"
      }
      if [actor_username] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.user_display_name" => "%{actor_username}"
          }
          on_error => "actor_username_mapping_failed"
        }
        if ![actor_username_mapping_failed] {
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
      }
      mutate {
        replace => {
          "actor_userId" => "%{record.actors.user.id}"
        }
        on_error => "actor_userId_not_present"
      }
      if [actor_userId] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.userid" => "%{actor_userId}"
          }
          on_error => "actor_userId_mapping_failed"
        }
        if ![actor_userId_mapping_failed] {
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
      }
      mutate {
        replace => {
          "actor_clientId" => "%{record.actors.client.id}"
        }
        on_error => "actor_clientId_not_present"
      }
      if [actor_clientId] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.cloud.project.id" => "%{actor_clientId}"
          }
          on_error => "actor_clientId_mapping_failed"
        }
      }
      mutate {
        replace => {
          "client_name" => "%{record.actors.client.name}"
        }
        on_error => "client_name_not_present"
      }
      if [client_name] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.cloud.project.name" => "%{client_name}"
          }
          on_error => "client_name_mapping_failed"
        }
      }
      mutate {
        replace => {
          "environment_id" => "%{record.actors.client.environment.id}"
        }
        on_error => "environment_id_not_present"
      }
      if [environment_id] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.cloud.vpc.id" => "%{environment_id}"
          }
          on_error => "environment_id_mapping_failed"
        }
      }
      mutate {
        replace => {
          "client_href" => "%{record.actors.client.href}"
        }
        on_error => "client_href_not_present"
      }
      if [client_href] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.url" => "%{client_href}"
          }
          on_error => "client_href_mapping_failed"
        }
      }
      mutate {
        replace => {
          "result_description" => "%{record.result.description}"
        }
        on_error => "result_description_not_present"
      }
      if [result_description] != "" {
        mutate {
          replace => {
            "sec_result.summary" => "%{result_description}"
          }
          on_error => "result_description_mapping_failed"
        }
      }
      mutate {
        replace => {
          "result_status" => "%{record.result.status}"
        }
        on_error => "result_status_not_present_replace_error"
      }
      if [result_status] =~ "SUCCESS" {
        mutate {
          replace => {
            "sec_action" => "ALLOW"
          }
          on_error => "result_status_not_present_allow"
        }
      }
      else if [result_status] =~ "FAILURE" {
        mutate {
          replace => {
            "sec_action" => "BLOCK"
          }
          on_error => "result_status_not_present_block"
        }
      }
      else if [result_status] != "" {
        mutate {
          replace => {
            "sec_action" => "UNKNOWN_ACTION"
          }
          on_error => "result_status_not_present_unknown"
        }
      }
      if [sec_action] != "" {
        mutate {
          merge => {
            "sec_result.action" => "sec_action"
          }
          on_error => "no_sec_action"
        }
      }
      if [result_status] != "" {
        mutate {
          replace => {
            "sec_result.action_details" => "%{result_status}"
          }
          on_error => "result_status_not_present_sec_result"
        }
      }
      mutate {
        replace => {
          "record_transactionId" => "%{record.internalCorrelation.transactionId}"
        }
        on_error => "record_transactionId_not_present"
      }
      if [record_transactionId] == "" {
        mutate {
          replace => {
            "record_transactionId" => "%{record._embedded.metadata.transaction.id}"
          }
          on_error => "record_metadata_transactionId_not_present"
        }
      }
      if [record_transactionId] != "" {
        mutate {
          replace => {
            "transactionId_label.key" => "transactionId"
            "transactionId_label.value" => "%{record_transactionId}"
          }
          on_error => "transactionId_not_present"
        }
        if ![transactionId_not_present] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "transactionId_label"
            }
            on_error => "transactionId_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "record_correlationId" => "%{record.correlationId}"
        }
        on_error => "record_correlationId_not_present"
      }
      if [record_correlationId] != "" {
        mutate {
          replace => {
            "correlationId_label.key" => "correlationId"
            "correlationId_label.value" => "%{record_correlationId}"
          }
          on_error => "correlationId_not_present"
        }
        if ![correlationId_not_present] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "correlationId_label"
            }
            on_error => "correlationId_label_not_present"
          }
        }
      }
      mutate {
        replace => {
          "record_recordedAt" => "%{record.recordedAt}"
        }
        on_error => "record_recordedAt_not_present"
      }
      if [record_recordedAt] != "" {
        date {
          match => ["record_recordedAt", "ISO8601"]
          target => "event1.idm.read_only_udm.metadata.event_timestamp"
          on_error => "date_conversion_failed"
        }
      }
      mutate {
        replace => {
          "record_id" => "%{record.id}"
        }
        on_error => "record_id_not_present"
      }
      if [record_id] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.product_log_id" => "%{record_id}"
          }
          on_error => "record_id_replace_failed"
        }
      }
      mutate {
        replace => {
          "source_ipaddress" => "%{record.source.ipAddress}"
        }
        on_error => "source_ip_address_not_present"
      }
      if [source_ipaddress] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.ip" => "source_ipaddress"
            "event1.idm.read_only_udm.principal.asset.ip" => "source_ipaddress"
          }
          on_error => "source_ip_address_merge_failed"
        }
        if ![source_ip_address_merge_failed] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      mutate {
        replace => {
          "source_userAgent" => "%{record.source.userAgent}"
        }
        on_error => "source_user_agent_not_present"
      }
      if [source_userAgent] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.network.http.user_agent" => "%{source_userAgent}"
          }
          on_error => "source_user_agent_replace_failure"
        }
        mutate {
          replace => {
            "event1.idm.read_only_udm.network.http.parsed_user_agent" => "%{source_userAgent}"
          }
          on_error => "parsed_user_agent_not_found"
        }
        mutate {
          convert => {
            "event1.idm.read_only_udm.network.http.parsed_user_agent" => "parseduseragent"
          }
          on_error => "parsed_user_agent_convert_error"
        }
      }
      mutate {
        replace => {
           "action_description" => "%{record.action.description}"
        }
        on_error => "record_action_replace_failed"
      }
      if [action_description] != "" {
        mutate {
          replace => {
            "sec_result.description" => "%{action_description}"
          }
          on_error => "action_description_mapping_failed"
        }
      }
      mutate {
        replace => {
          "action_type" => "%{record.action.type}"
        }
        on_error => "record_action_type_mapping_failed"
      }
      if [action_type] != "" {
        mutate {
          replace => {
            "action_type_label.key" => "actionType"
            "action_type_label.value" => "%{action_type}"
          }
          on_error => "action_type_mapping_failed"
        }
        if ![action_type_mapping_failed] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "action_type_label"
            }
            on_error => "action_type_label_mapping_failed"
          }
        }
      }
      for resource in record.resources {
        mutate {
          replace => {
            "resource_type" => ""
            "resource_id" => ""
            "resource_email" => ""
            "resource_env_id" => ""
            "resource_pop_id" => ""
            "resource_url" => ""
            "resource_name" => ""
          }
        }
        mutate {
          replace => {
            "resource_url" => "%{resource.href}"
          }
          on_error => "resource_url_not_present"
        }
        if [resource_url] != "" {
          mutate {
            replace => {
              "event1.idm.read_only_udm.target.url" => "%{resource_url}"
            }
            on_error => "resource_url_mapping_failed"
          }
        }
        mutate {
          replace => {
            "resource_pop_id" => "%{resource.population.id}"
          }
          on_error => "resource_pop_id_not_present"
        }
        if [resource_pop_id] != "" {
          mutate {
            replace => {
              "population_id.key" => "Population Id"
              "population_id.value" => "%{resource_pop_id}"
            }
            on_error => "resource_pop_id_mapping_failed"
          }
          if ![resource_pop_id_mapping_failed] {
            mutate {
              merge => {
                "event1.idm.read_only_udm.target.user.attribute.labels" => "population_id"
              }
              on_error => "resource_pop_id_label_mapping_failed"
            }
          }
        }
        mutate {
          replace => {
            "resource_env_id" => "%{resource.environment.id}"
          }
          on_error => "resource_env_id_not_present"
        }
        if [resource_env_id] != "" {
          mutate {
            replace => {
              "event1.idm.read_only_udm.target.cloud.project.id" => "%{resource_env_id}"
            }
            on_error => "resource_env_id_mapping_failed"
          }
        }
        mutate {
          replace => {
            "resource_email" => "%{resource.name}"
          }
          on_error => "resource_email_not_present"
        }
        if [resource_email] =~ "^.+@.+$" {
          mutate {
            merge => {
              "event1.idm.read_only_udm.target.user.email_addresses" => "resource_email"
            }
            on_error => "resource_email_mapping_failed"
          }
          if ![resource_email_mapping_failed] {
            mutate {
              replace => {
                "has_user" => "true"
              }
            }
          }
        }
        else if [resource_name] != "" {
          mutate {
            replace => {
              "event1.idm.read_only_udm.target.user.user_display_name" => "%{resource.name}"
            }
            on_error => "resource_name_mapping_failed"
          }
          if ![resource_name_mapping_failed] {
            mutate {
              replace => {
                "has_user" => "true"
              }
            }
          }
        }
        mutate {
          replace => {
            "resource_id" => "%{resource.id}"
          }
          on_error => "resource_id_not_present"
        }
        if [resource_id] != "" {
          mutate {
            replace => {
              "event1.idm.read_only_udm.target.resource.id" => "%{resource_id}"
            }
            on_error => "resource_id_mapping_failed"
          }
        }
        mutate{
          replace => {
            "resource_type" => "%{resource.type}"
          }
          on_error => "resource_type_not_present"
        }
        if [resource_type] != "" {
          mutate {
            replace => {
              "event1.idm.read_only_udm.target.resource.resource_subtype" => "%{resource_type}"
            }
            on_error => "resource_type_mapping_failed"
          }
        }
      }
      mutate {
        replace => {
          "outcomeDescription" => "%{record._embedded.flowInteractionEvent.outcomeDescription}"
        }
        on_error => "outcomeDescription_not_present"
      }
      if [outcomeDescription] != "" and ![outcomeDescription_not_present] {
        mutate {
          replace => {
            "outcomeDescription_label.key" => "outcomeDescription"
            "outcomeDescription_label.value" => "%{outcomeDescription}"
          }
          on_error => "outcomeDescription_label_mapping_failed"
        }
        if ![outcomeDescription_label_mapping_failed] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "outcomeDescription_label"
            }
            on_error => "outcomeDescription_label_merge_failed"
          }
        }
      }
      mutate {
        replace => {
          "outcomeStatusDetail" => "%{record._embedded.flowInteractionEvent.outcomeStatusDetail}"
        }
        on_error => "outcomeStatusDetail_not_present"
      }
      if [outcomeStatusDetail] != "" and ![outcomeStatusDetail_not_present] {
        mutate {
          replace => {
            "outcomeStatusDetail_label.key" => "outcomeStatusDetail"
            "outcomeStatusDetail_label.value" => "%{outcomeStatusDetail}"
          }
          on_error => "outcomeStatusDetail_label_mapping_failed"
        }
        if ![outcomeStatusDetail_label_mapping_failed] {
