            "security_result.detection_fields" => "type_label"
          }
          on_error => "no_type_label"
        }
      }
    }
    if [msg][_embedded][riskEvaluation][riskPolicySet] != "" {
      mutate {
        replace => {
          "riskPolicySet_label.key" => "riskPolicySet"
          "riskPolicySet_label.value" => "%{msg._embedded.riskEvaluation.riskPolicySet}"
        }
        on_error => "no_riskPolicySet"
      }
      if ![no_riskPolicySet] {
        mutate {
          merge => {
            "security_result.detection_fields" => "riskPolicySet_label"
          }
          on_error => "no_riskPolicySet_label"
