# Product: Symantec VIP Gateway
# Category: Email Server
# Supported Format: SYSLOG
# Reference: https://help.symantec.com/cs/VIP_EG_INSTALL_CONFIG/VIP/v134651706_v128483142/Legacy-log-format?locale=EN_US
# Last Updated: 2023-03-03
# Copyright 2023 Chronicle LLC


filter {
    mutate {
      replace => {
        "reason" => ""
        "status" => ""
        "event_type" => ""
        "user" => ""
        "request_id" => ""
        "processid" => ""
        "filename" => ""
        "sec_result" => ""
        "security_action" => ""
        "operation" => ""
        "summary" => ""
        "command" => ""
        "hostname" => ""
        "host_name" => ""
        "application" => ""
        "description" => ""
        "credentialType" => ""
        "auth_type" => ""
        "desc" => ""
        "data2" => ""
        "datetime" => ""
        "src_ip" => ""
        "app_name" => ""
        "log_level" => ""
      }
   }

  json {
    source => "message"
    on_error => "not_json"
    array_function => "split_columns"
  }

  if ![not_json] {
    if [msg] != "" {
      grok {
        match => {
          "msg" => [
                     "\\('%{DATA:user}', '%{DATA:hostname}', '%{DATA:application}', '%{DATA:credentialType}', '%{DATA}', datetime.datetime\\(%{GREEDYDATA:time}\\), '%{DATA:summary}', '%{DATA:description}', '%{DATA:desc}'\\)",
                     "\\['%{DATA:user}', '%{DATA:hostname}', '%{DATA:application}', '%{DATA:credentialType}', '%{DATA}', '%{DATA:time}, '%{DATA:summary}', '%{DATA:description}', '%{DATA:desc}'\\]"
          ]
        }
        overwrite => ["user", "hostname", "application", "credentialType", "time", "summary", "description","desc"]
        on_error => "msg_does_not_exist"
      }

      mutate {
        gsub => ["time", "(\\d+), (\\d+), (\\d+), (\\d+), (\\d+), (\\d+), (\\d+)", "$1-$2-$3 $4:$5:$6"]
      }

      date {
        match => ["time", "yyyy-M-d HH:mm:ss", "yyyy-MM-d HH:mm:ss", "ISO8601"]
        on_error => "date_not_parsed"
      }

      if [user] not in ["", "None"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{user}"
          }
        }
      }

      if [hostname] not in ["", "None"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
          }
        }
      }

      if [application] not in ["", "None"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.application" => "%{application}"
          }
        }
      }

      if [credentialType] not in ["", "None"] {
        if [credentialType] in ["SMS_OTP", "STANDARD_OTP"] {
          mutate {
            replace => {
              "auth_type" => "OTP"
            }
          }
        }
        else if [credentialType] =~ "PASSWORD" {
          mutate {
            replace => {
              "auth_type" => "USERNAME_PASSWORD"
            }
          }
        }
        if [auth_type] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.extensions.auth.mechanism" => "auth_type"
            }
          }
        }
      }

      if [description] in ["Success", "Mobile push request sent"] {
        mutate {
          replace => {
            "security_action" => "ALLOW"
          }
        }
      }
      else if [description] =~ ["Invalid input"] {
        mutate {
          replace => {
            "security_action" => "BLOCK"
          }
        }
      }

      if [security_action] != "" {
        mutate {
          merge => {
            "sec_result.action" => "security_action"
          }
        }
      }

      if [summary] not in ["", "None"] {
        mutate {
          replace => {
            "sec_result.summary" => "%{summary}"
          }
        }
      }

      if [description] not in ["", "None"] {
        mutate {
          replace => {
            "sec_result.description" => "%{description}"
          }
        }
      }

      if [desc] not in ["", "None"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{desc}"
          }
        }
      }

      if [sec_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "sec_result"
          }
        }
      }
    }

    if [host_name] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{host_name}"
        }
      }
      if [intermediary] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.intermediary" => "intermediary"
          }
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{log_type}"
        "event.idm.read_only_udm.metadata.product_name" => "%{product}"
        "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor}"
      }
    }
  }

  else {
    grok {
      match => {
        "message" => ["(?:<%{INT}> |)%{GREEDYDATA:log_level} \\\"%{TIMESTAMP_ISO8601:datetime} %{WORD}%{INT:tz}\\\"\\s+%{IP:src_ip} %{WORD:app_name}(?:|:)%{GREEDYDATA} \\\"(?:actor|text)=%{GREEDYDATA:data2}"]
      }
      overwrite => ["data2", "log_level", "datetime", "src_ip", "app_name"]
      on_error => "not_syslog"
    }

    # Mapping of date & time with @timestaamp
    if [datetime] != "" and [tz] != "" {
      mutate {
        replace => {
          datetime => "%{datetime} %{tz}"
        }
      }
      date {
        match => ["datetime", "yyyy-MM-dd HH:mm:ss.SSS Z"]
      }
    }

    # Source IP mapping
    if [src_ip] not in ["", "0.0.0.0"] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
        }
      }
    }

    # Map the application name
    if [app_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{app_name}"
        }
      }
    }

    # convert the audit message to upper
    if [log_level] != "" {
      mutate {
        uppercase => ["log_level"]
      }
    }

    if [log_level] in ["DEBUG", "INFO", "AUDIT"] {
      mutate {
        replace => {
          "sec_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [log_level] == "ERROR" {
      mutate {
        replace => {
          "sec_result.severity" => "ERROR"
        }
      }
    }
    else if [log_level] == "WARNING" {
      mutate {
        replace => {
          "sec_result.severity" => "MEDIUM"
        }
      }
    }

    if [not_syslog] {
      mutate {
        gsub => ["message", '\\\t', ""]
      }

      grok {
        match => {
          "message" => [
            "\\\" %{DATA:processid} %{GREEDYDATA:filename}",
            "at %{GREEDYDATA:command}\\(%{GREEDYDATA:filename}:%{INT}\\)",
            "at %{GREEDYDATA:command}\\\""
          ]
        }
        overwrite => ["command", "processid", "filename"]
        on_error => "no_data"
      }

      if [processid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.pid" => "%{processid}"
          }
        }
      }

      if [command] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.command_line" => "%{command}"
          }
        }
      }

      if [filename] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.full_path" => "%{filename}"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    else if [data2] != "" {
      grok {
        match => {
          "data2" => ["%{GREEDYDATA} %{GREEDYDATA:status} for user \\[%{GREEDYDATA:user}\\](?:.*)%{GREEDYDATA}(?::|;)(\s|) %{GREEDYDATA:reason}\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "%{GREEDYDATA} (?P<status>GRANTED|DENIED|CHALLENGED) %{GREEDYDATA}(?::|;) %{GREEDYDATA:reason}\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "%{GREEDYDATA} (?P<status>GRANTED|DENIED|CHALLENGED)(\s|)%{GREEDYDATA} %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "%{GREEDYDATA} \\[%{GREEDYDATA:request_id}\\] %{GREEDYDATA:reason}\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "\\[.*:%{DATA:user}\\] requestId:%{GREEDYDATA:request_id}\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "%{GREEDYDATA:status} from %{GREEDYDATA}\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "(%{GREEDYDATA}(?: \\'%{GREEDYDATA:user}\\'|::) )?%{GREEDYDATA:reason},op=%{GREEDYDATA:operation}",
                      "%{GREEDYDATA:reason} \\[%{GREEDYDATA:user}\\](?:.|)\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "%{GREEDYDATA:summary} Description: %{GREEDYDATA:reason}\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "%{GREEDYDATA:reason}\\\" %{GREEDYDATA:processid} %{GREEDYDATA:filename}",
                      "(?P<description>%{GREEDYDATA:user} call %{DATA:status} with status %{INT:processid})",
                      "%{DATA:user},text=(%{GREEDYDATA:command}\\(%{GREEDYDATA:filename}:%{INT}\\))?",
                      "%{GREEDYDATA:reason} \\[%{DATA:user}\\]",
                      "%{GREEDYDATA:reason}",
                     ]
        }
        overwrite => [ "user", "status", "reason", "filename", "processid", "request_id", "operation", "summary", "command", "description" ]
      }

      # Mapping Auth extension
      if [reason] =~ "LDAP" {
        mutate {
          replace => {
             "event.idm.read_only_udm.extensions.auth.type" => "SSO"
          }
        }
      }
      else {
        mutate {
          replace => {
             "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      }
      # Map result type
      if [status] in ["Authentication Success", "GRANTED", "Authentication Completed", "After Services Authenticate call", "CHALLENGED"] {
        mutate {
          replace => {
            "security_action" => "ALLOW"
          }
        }
      }
      else if [status] in ["DENIED", "Acces-Reject", "Unknown Error", "Service Unavailable", "FAILED"] {
        mutate {
          replace => {
            "security_action" => "BLOCK"
          }
        }
      }
      else if [status] in ["PUSH request sent for user", "Trying to fetch attribute"] {
        mutate {
          replace => {
            "security_action" => "QUARANTINE"
          }
        }
      }

      if [summary] != "" {
        mutate {
          replace => {
            "sec_result.description" => "%{summary}"
          }
        }
      }

      if [security_action] != "" {
        mutate {
          merge => {
            "sec_result.action" => "security_action"
          }
        }
      }

      if [reason] != "" {
        mutate {
          gsub => ["reason",":",""]
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{reason}"
          }
        }
      }
      else if [description] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{description}"
          }
        }
      }
      else if [status] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{status}"
          }
        }
      }

      if [filename] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{filename}"
          }
        }
      }

      if [command] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.command_line" => "%{command}"
          }
        }
      }

      if [request_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.id" => "%{request_id}"
          }
        }
      }

      if [processid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.pid" => "%{processid}"
          }
        }
      }

      if [user] != "" and [user] != "0" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{user}"
          }
        }
      }

      if [operation] != "" {
        mutate {
          replace => {
            "security_result.summary" => "%{operation}"
          }
        }
      }

      if [user] != "" or [processid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          }
        }
      }
      else if [user] == "" and [src_ip] not in ["","0.0.0.0"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
          }
        }
      }

      if [sec_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "sec_result"
          }
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "SYMANTEC_VIP"
        "event.idm.read_only_udm.metadata.vendor_name" => "SYMANTEC"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
