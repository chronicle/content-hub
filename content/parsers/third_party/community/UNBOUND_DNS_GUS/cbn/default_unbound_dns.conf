# Product: Unbound DNS
# Category: DNS
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2020-06-09
# Copyright 2021 Chronicle LLC


filter {

  # Log messages don't always contain the following
  mutate {
    replace => {
      "queryName" => "",
    }
  }
  grok {
    match => {
      "message" => [
                     "\\[%{NUMBER:ts}\\] \\S+\\[[0-9]+\\:[0-9]\\] \\S+\\: %{GREEDYDATA:msg}",
                     "%{TIMESTAMP_ISO8601:ts} %{GREEDYDATA:msg}"
 ]
    }
  }

  # Check to see if the DNS data even has an IP in it
  grok {
    match => {
      "msg" => [
        "%{IP:IP_found}"
      ]
    }
    on_error => "ip_not_found"
  }
  # If we didn't find an IP, it's a system message and we should drop it
  if [ip_not_found] {
    drop{}
  }

  # If we found an IP, extract the DNS data within msg and continue
  grok {
    match => {
      "msg" => "%{IP:sourceIP} (?P<queryName>.*)\\. %{WORD:queryType} %{WORD:queryClass}"
    }
    overwrite=>["queryName"]
  }

  # If we don't have a query, drop the message
  if ([queryName] == "" or [queryName] == "local") {
    drop {}
  }
   date {
     match => ["ts", "UNIX","yyyy-MM-ddTHH:mm:ss+HH:mm" ]
   }

  # Specify query
  mutate {
    rename => {
      "queryName" => "q.name"
    }
  }

  # Set source IP address
  mutate {
    convert => {
      "sourceIP" => "ipaddress"
    }
  }
  # Merge it
  mutate {
    merge => {
      "event.dns.client.ip_addresses" => "sourceIP"
    }
  }

  # Set the query response code
  if ([queryType] == "A")  {
    mutate {
      replace => { "QTYPE" => "1" }
    }
  } else if ([queryType] == "AAAA") {
    mutate {
      replace => { "QTYPE" => "28" }
    }
  } else if ([queryType] == "MX") {
    mutate {
      replace => { "QTYPE" => "15" }
    }
  } else if ([queryType] == "PTR") {
    mutate {
      replace => { "QTYPE" => "12" }
    }
  } else if ([queryType] == "SOA") {
    mutate {
      replace => { "QTYPE" => "6" }
    }
  }

  # Set the query type
  mutate {
    rename => {
      "QTYPE" => "q.type"
    }
    convert => {
      "q.type" => "uinteger"
    }
  }

  # Set the query class
  if ([queryClass] == "IN")  {
    mutate {
      replace => { "QCLASS" => "1" }
    }
  }
  mutate {
    rename => {
      "QCLASS" => "q.class"
    }
    convert => {
      "q.class" => "uinteger"
    }
  }

  # Set questions
  mutate {
    merge => {
      "event.dns.questions" => "q"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

