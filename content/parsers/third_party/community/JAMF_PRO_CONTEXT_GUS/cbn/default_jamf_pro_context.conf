# Google SecOps Default CBN Parser (JAMF_PRO_CONTEXT)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/JAMF_PRO_CONTEXT/default/jamf_pro_context.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "JAMF"
      "event.idm.read_only_udm.metadata.product_name" => "JAMF_PRO_CONTEXT"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
