# Product: COHESITY
# Category: Backup Software
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2024-09-24
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      # fields
      "ts" => ""
      "host" => ""
      "product_event_type" => ""
      "pid" => ""
      "description" => ""
      "UserID" => ""
      "target_ip" => ""
      "target_port" => ""
      "sha_value" => ""
      "json_data" => ""
      "Timestamp" => ""
      "RecordID" => ""
      "Protocol" => ""
      "ClientIP" => ""
      "UserName" => ""
      "DomainName" => ""
      "UserSID" => ""
      "RequestType" => ""
      "Result" => ""
      "TaskId" => ""
      "EventMessage" => ""
      "EntityPath" => ""
      "EntityId" => ""
      "EntityName" => ""
      "EntityType" => ""
      "BackupJobId" => ""
      "BackupJobName" => ""
      "EnvironmentType" => ""
      "RegisteredSource.EntityName" => ""
      "RegisteredSource.EntityType" => ""
      "RegisteredSource.EntityId" => ""
      "AttributeMap.BridgeConstituent" => ""
      "ReplicationTarget.ClusterName" => ""
      "ReplicationTarget.ClusterId" => ""
      "Description" => ""
      "IP" => ""
      "User" => ""
      "Action" => ""
      "Domain" => ""
      "ServiceContext" => ""
      "AttributeMap.AttemptNum" => ""
      "cluster_id" => ""
      "cluster_name" => ""
      "ClusterInfo.ClusterId" => ""
      "ClusterInfo.ClusterName" => ""
      "prin_ip" => ""
      # event type specific
      "event_type" => ""
      "has_principal" => "false"
      "principal_user_present" => "false"
      "has_target" => "false"
      # udm noun
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", " "]
  }

  # Grok pattern to process syslog message
  grok {
    match => {
       "message" => [
          "<%{INT}>%{TIMESTAMP_ISO8601:ts}\\s+%{HOSTNAME:host}\\s+%{DATA:product_event_type}\\[%{INT:pid}\\]:\\s+%{GREEDYDATA:description}",
          "<%{INT}>%{TIMESTAMP_ISO8601:ts}\\s+%{HOSTNAME:host}\\s+%{DATA:product_event_type}:\\s+%{GREEDYDATA:json_data}"
        ]
    }
    overwrite => ["ts", "host", "product_event_type", "pid", "description", "json_data"]
    on_error  => "header_grok_match_failed"
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{description}"
      }
      on_error => "description_invalid"
    }

    grok {
      match => {
        "description" => [
          "uid=%{DATA:UserID}\\)%{GREEDYDATA}",
          "%{GREEDYDATA}\\s+from\\s+%{IP:target_ip}\\s+port\\s+%{INT:target_port}\\s+%{GREEDYDATA}SHA256:%{GREEDYDATA:sha_value}",
          "%{GREEDYDATA}\\s+from\\s+%{IP:target_ip}\\s+port\\s+%{INT:target_port}"
        ]
      }
      overwrite => ["UserID", "target_ip", "target_port", "sha_value"]
      on_error => "description_grok_match_failed"
    }
  }

  if [json_data] != "" {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "source_not_json"
    }
    if [source_not_json] {
      mutate {
        gsub => ["json_data", ': \\"', ':\"']
      }
      mutate {
        gsub => ["json_data", '\\{ \\"', '{\"']
      }
      mutate {
        gsub => ["json_data", '\\" }', '\"}']
      }
      mutate {
        gsub => ["json_data", '\\, \\"', ',\"']
      }
      mutate {
        gsub => ["json_data", ' \\"', ' ']
      }
      mutate {
        gsub => ["json_data", '\\" ', ' ']
      }
      mutate {
        gsub => ["json_data", '\\".\\",', '\",']
      }
      json {
        source => "json_data"
        array_function => "split_columns"
        on_error => "source_not_json"
      }
    }
  }

  grok {
    match => {
      "ClusterInfo" => "ClusterName: %{GREEDYDATA:cluster_name},\\s+ClusterId: %{GREEDYDATA:cluster_id}"
    }
    overwrite => ["cluster_name", "cluster_id"]
    on_error => "cluster_info_grok_match_failed"
  }
  if [cluster_id] == "" and [ClusterInfo][ClusterId] != "" {
    mutate {
      replace => {
        "cluster_id" => "%{ClusterInfo.ClusterId}"
      }
      on_error => "cluster_id_empty"
    }
  }
  if [cluster_name] == "" and [ClusterInfo][ClusterName] != "" {
    mutate {
      replace => {
        "cluster_name" => "%{ClusterInfo.ClusterName}"
      }
      on_error => "cluster_name_empty"
    }
  }
  if [ts] != "" {
    date {
      match => ["ts", "ISO8601", "RFC3339"]
      on_error => "date_match_failed"
    }
  }

  for index, entity in Entities {
    mutate {
      replace => {
        "entity_EntityType_label" => ""
        "entity_EntityId_label" => ""
        "entity_EntityName_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_already_string"
    }
    mutate {
      replace => {
        "entity_EntityType_label.value.string_value" => "%{entity.EntityType}"
      }
      on_error => "entity_EntityType_empty"
    }
    if ![entity_EntityType_empty] {
      mutate {
        replace => {
          "entity_EntityType_label.key" => "%{index}: Entity EntityType"
        }
        on_error => "entity_EntityType_index_label_key_empty"
      }
      mutate {
        merge => {
          "additional.fields" => "entity_EntityType_label"
        }
        on_error => "entity_EntityType_label_empty"
      }
    }

    mutate {
      replace => {
        "entity_EntityId_label.value.string_value" => "%{entity.EntityId}"
      }
      on_error => "entity_EntityId_empty"
    }
    if ![entity_EntityId_empty] {
      mutate {
        replace => {
          "entity_EntityId_label.key" => "%{index}: Entity EntityId"
        }
        on_error => "entity_EntityId_index_label_key_empty"
      }
      mutate {
        merge => {
          "additional.fields" => "entity_EntityId_label"
        }
        on_error => "entity_EntityId_label_empty"
      }
    }

    mutate {
      replace => {
        "entity_EntityName_label.value.string_value" => "%{entity.EntityName}"
      }
      on_error => "entity_EntityName_empty"
    }
    if ![entity_EntityName_empty] {
      mutate {
        replace => {
          "entity_EntityName_label.key" => "%{index}: Entity EntityName"
        }
        on_error => "entity_EntityName_index_label_key_empty"
      }
      mutate {
        merge => {
          "additional.fields" => "entity_EntityName_label"
        }
        on_error => "entity_EntityName_label_empty"
      }
    }
  }

  if [Description] != "" {
    grok {
      match => {
        "Description" => "%{IP:prin_ip}"
      }
      overwrite => ["prin_ip"]
      on_error => "description_grok_failure"
    }
    mutate {
      replace => {
        "metadata.description" => "%{Description}"
      }
      on_error => "Description_empty"
    }
  }

  if [prin_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "prin_ip"
        "principal.asset.ip" => "prin_ip"
      }
      on_error => "ip_empty"
    }
    if ![ip_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [EventMessage] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{EventMessage}"
      }
      on_error => "EventMessage_empty"
    }
  }

  if [Timestamp] != "" {
    date {
      match => ["ts", "ISO8601", "RFC3339"]
      target => "metadata.collected_timestamp"
      on_error => "date_match_failed_2"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "host_invalid"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_invalid"
    }
  }

  if [pid] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{pid}"
      }
      on_error => "pid_invalid"
    }
  }

  if [UserID] != "" {
    mutate {
      convert => {
        "UserID" => "string"
      }
      on_error => "UserID_already_string"
    }
    mutate {
      replace => {
        "principal.user.userid" => "%{UserID}"
        "principal_user_present" => "true"
      }
      on_error => "uid_invalid"
    }
  }

  if [EntityId] == "" and [RegisteredSource][EntityId] != "" {
    mutate {
      replace => {
        "EntityId" => "%{RegisteredSource.EntityId}"
      }
      on_error => "RegisteredSource_EntityId_empty"
    }
  }

  if [EntityId] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{EntityId}"
        "principal_user_present" => "true"
      }
      on_error => "EntityId_empty"
    }
  }

  if [target_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "target_ip"
        "target.asset.ip" => "target_ip"
      }
      on_error => "ip_invalid"
    }
    if ![ip_invalid] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [target_port] != "" {
    mutate {
      convert => {
        "target_port" => "integer"
      }
      on_error => "port_already_int"
    }
    mutate {
      rename => {
        "target_port" => "target.port"
      }
    }
  }

  if [sha_value] != "" {
    mutate {
      replace => {
        "sha_label.key" => "SHA256"
        "sha_label.value.string_value" => "%{sha_value}"
      }
      on_error => "sha_value_invalid"
    }
    if ![sha_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "sha_label"
        }
        on_error => "sha_label_merge_failed"
      }
    }
  }

  if [RecordID] != "" {
    mutate {
      replace => {
        "record_id_label.key" => "RecordID"
        "record_id_label.value.string_value" => "%{RecordID}"
      }
      on_error => "record_id_invalid"
    }
    if ![record_id_invalid] {
      mutate {
        merge => {
          "additional.fields" => "record_id_label"
        }
        on_error => "record_id_label_merge_failed"
      }
    }
  }

  if [Protocol] != "" {
    mutate {
      uppercase => ["Protocol"]
    }

    mutate {
      replace => {
        "network.application_protocol" => "%{Protocol}"
      }
      on_error => "Protocol_Invalid"
    }
  }

  if [ClientIP] != "" {
    mutate {
      merge => {
        "principal.ip" => "ClientIP"
        "principal.asset.ip" => "ClientIP"
      }
      on_error => "clientip_merge_failed"
    }
    if ![clientip_merge_failed] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [IP] != "" {
    mutate {
      merge => {
        "principal.ip" => "IP"
        "principal.asset.ip" => "IP"
      }
      on_error => "ip_empty"
    }
    if ![ip_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [UserName] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{UserName}"
      }
      on_error => "UserName_Invalid"
    }
  }
  if [User] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{User}"
      }
      on_error => "User_Invalid"
    }
  }

  if [DomainName] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{DomainName}"
        "target.asset.hostname" => "%{DomainName}"
        "has_target" => "true"
      }
      on_error => "DomainName_Invalid"
    }
  }

  if [UserSID] != "" {
    mutate {
      replace => {
        "principal.user.windows_sid" => "%{UserSID}"
      }
      on_error => "UserSID_Invalid"
    }
  }

  if [RequestType] != "" {
    mutate {
      replace => {
        "request_type_label.key" => "RequestType"
        "request_type_label.value" => "%{RequestType}"
      }
      on_error => "RequestType_Invalid"
    }
    if ![RequestType_Invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "request_type_label"
        }
        on_error => "request_type_label_merge_failed"
      }
    }
  }

  if [Result] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{Result}"
      }
      on_error => "Result_Invalid"
    }
  }

  if [EntityPath] != "" {
    mutate {
      replace => {
        "target.url" => "%{EntityPath}"
      }
      on_error => "EntityPath_Invalid"
    }
  }

  if [EntityType] == "" and [RegisteredSource][EntityType] != "" {
    mutate {
      replace => {
        "EntityType" => "%{RegisteredSource.EntityType}"
      }
      on_error => "RegisteredSource_EntityType_empty"
    }
  }

  if [EntityType] != "" {
    mutate {
      replace => {
        "EntityType_label.value.string_value" => "%{EntityType}"
      }
      on_error => "EntityType_empty"
    }
    if ![EntityType_empty] {
      mutate {
        replace => {
          "EntityType_label.key" => "EntityType"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "EntityType_label"
        }
        on_error => "EntityType_label_empty"
      }
    }
  }

  if [EntityName] == "" and [RegisteredSource][EntityName] != "" {
    mutate {
      replace => {
        "EntityName" => "%{RegisteredSource.EntityName}"
      }
      on_error => "RegisteredSource_EntityName_empty"
    }
  }

  if [EntityName] != "" {
    mutate {
      replace => {
        "EntityName_label.value.string_value" => "%{EntityName}"
      }
      on_error => "EntityName_empty"
    }
    if ![EntityName_empty] {
      mutate {
        replace => {
          "EntityName_label.key" => "EntityName"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "EntityName_label"
        }
        on_error => "EntityName_label_empty"
      }
    }
  }

  mutate {
    convert => {
      "ServiceContext" => "string"
    }
    on_error => "ServiceContext_conversion_Failed"
  }
  if [ServiceContext] != "" {
    mutate {
      replace => {
        "ServiceContext_label.value.string_value" => "%{ServiceContext}"
      }
      on_error => "ServiceContext_empty"
    }
    if ![ServiceContext_empty] {
      mutate {
        replace => {
          "ServiceContext_label.key" => "ServiceContext"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "ServiceContext_label"
        }
        on_error => "ServiceContext_label_empty"
      }
    }
  }

  if [Domain] != "" {
    mutate {
      replace => {
        "Domain_label.value.string_value" => "%{Domain}"
      }
      on_error => "Domain_empty"
    }
    if ![Domain_empty] {
      mutate {
        replace => {
          "Domain_label.key" => "Domain"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "Domain_label"
        }
        on_error => "Domain_label_empty"
      }
    }
  }

  if [Action] != "" {
    mutate {
      replace => {
        "Action_label.value.string_value" => "%{Action}"
      }
      on_error => "Action_empty"
    }
    if ![Action_empty] {
      mutate {
        replace => {
          "Action_label.key" => "Action"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "Action_label"
        }
        on_error => "Action_label_empty"
      }
    }
  }

  if [AttributeMap][AttemptNum] != "" {
    mutate {
      replace => {
        "AttemptNum_label.value.string_value" => "%{AttributeMap.AttemptNum}"
      }
      on_error => "AttemptNum_empty"
    }
    if ![AttemptNum_empty] {
      mutate {
        replace => {
          "AttemptNum_label.key" => "AttemptNum"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "AttemptNum_label"
        }
        on_error => "AttemptNum_label_empty"
      }
    }
  }

  if [AttributeMap][BridgeConstituent] != "" {
    mutate {
      replace => {
        "BridgeConstituent_label.value.string_value" => "%{AttributeMap.BridgeConstituent}"
      }
      on_error => "BridgeConstituent_empty"
    }
    if ![BridgeConstituent_empty] {
      mutate {
        replace => {
          "BridgeConstituent_label.key" => "BridgeConstituent"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "BridgeConstituent_label"
        }
        on_error => "BridgeConstituent_label_empty"
      }
    }
  }

  if [BackupJobId] != "" {
    mutate {
      replace => {
        "BackupJobId_label.value.string_value" => "%{BackupJobId}"
      }
      on_error => "BackupJobId_empty"
    }
    if ![BackupJobId_empty] {
      mutate {
        replace => {
          "BackupJobId_label.key" => "BackupJobId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "BackupJobId_label"
        }
        on_error => "BackupJobId_label_empty"
      }
    }
  }

  if [BackupJobName] != "" {
    mutate {
      replace => {
        "BackupJobName_label.value.string_value" => "%{BackupJobName}"
      }
      on_error => "BackupJobName_empty"
    }
    if ![BackupJobName_empty] {
      mutate {
        replace => {
          "BackupJobName_label.key" => "BackupJobName"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "BackupJobName_label"
        }
        on_error => "BackupJobName_label_empty"
      }
    }
  }

  if [EnvironmentType] != "" {
    mutate {
      replace => {
        "EnvironmentType_label.value.string_value" => "%{EnvironmentType}"
      }
      on_error => "EnvironmentType_empty"
    }
    if ![EnvironmentType_empty] {
      mutate {
        replace => {
          "EnvironmentType_label.key" => "EnvironmentType"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "EnvironmentType_label"
        }
        on_error => "EnvironmentType_label_empty"
      }
    }
  }

  if [cluster_name] != "" {
    mutate {
      replace => {
        "cluster_name_label.value.string_value" => "%{cluster_name}"
      }
      on_error => "cluster_name_empty"
    }
    if ![cluster_name_empty] {
      mutate {
        replace => {
          "cluster_name_label.key" => "ClusterInfo cluster_name"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "cluster_name_label"
        }
        on_error => "cluster_name_label_empty"
      }
    }
  }

  if [cluster_id] != "" {
    mutate {
      replace => {
        "cluster_id_label.value.string_value" => "%{cluster_id}"
      }
      on_error => "cluster_id_empty"
    }
    if ![cluster_id_empty] {
      mutate {
        replace => {
          "cluster_id_label.key" => "ClusterInfo cluster_id"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "cluster_id_label"
        }
        on_error => "cluster_id_label_empty"
      }
    }
  }

  if [ReplicationTarget][ClusterName] != "" {
    mutate {
      replace => {
        "ClusterName_label.value.string_value" => "%{ReplicationTarget.ClusterName}"
      }
      on_error => "ClusterName_empty"
    }
    if ![ClusterName_empty] {
      mutate {
        replace => {
          "ClusterName_label.key" => "ReplicationTarget ClusterName"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "ClusterName_label"
        }
        on_error => "ClusterName_label_empty"
      }
    }
  }

  if [ReplicationTarget][ClusterId] != "" {
    mutate {
      replace => {
        "ClusterId_label.value.string_value" => "%{ReplicationTarget.ClusterId}"
      }
      on_error => "ClusterId_empty"
    }
    if ![ClusterId_empty] {
      mutate {
        replace => {
          "ClusterId_label.key" => "ReplicationTarget ClusterId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "ClusterId_label"
        }
        on_error => "ClusterId_label_empty"
      }
    }
  }

  if [TaskId] != "" {
    mutate {
      replace => {
        "TaskId_label.value.string_value" => "%{TaskId}"
      }
      on_error => "TaskId_empty"
    }
    if ![TaskId_empty] {
      mutate {
        replace => {
          "TaskId_label.key" => "TaskId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "TaskId_label"
        }
        on_error => "TaskId_label_empty"
      }
    }
  }

  # metadata info
  mutate {
    replace => {
      "metadata.vendor_name" => "COHESITY"
      "metadata.product_name" => "Cohesity"
    }
  }

  # set metadata.event_type
  if [event_type] == "" {
    if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [principal_user_present] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_value_invalid"
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
