# Product: PHAROS
# Category: NA
# Supported Format: JSON
# REFERENCE: N/A
# Last Updated:2025-02-18
# Copyright 2025 Google SecOps
filter {

  mutate {
    gsub => [
      "message" ,"message" ,"msg"
    ]
  }
  mutate{
    gsub => [
      "message" ,"metadata" ,"mtd"
    ]
  }
  mutate {
    replace => {
      "msg.Application" => ""
      "msg.Building" => ""
      "msg.City" => ""
      "msg.Country" => ""
      "msg.DataSource" => ""
      "msg.DeviceDisplayName" => ""
      "msg.FactSubType" => ""
      "msg.FactType" => ""
      "msg.HostName" => ""
      "msg.IPAddress" => ""
      "msg.JobId" => ""
      "msg.JobName" => ""
      "msg.JobTimeutc" => ""
      "msg.PostalCode" => ""
      "msg.State" => ""
      "msg.TotalPages" => ""
      "msg.UserDisplayName" => ""
      "msg.VpnConnected" => ""
      "mtd.customer" => ""
      "mtd.slt.node" => ""
      "mtd.slt.pipeline" => ""
      "mtd.source.database" => ""
      "mtd.source.host" => ""
      "mtd.source.port" => ""
      "mtd.source.type" => ""
      "mtd.timestamp.producer_process" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "app_protocol" => ""
      "network" => ""
      "proto" => ""
      "principal" => ""
      "src" => ""
      "target" => ""
      "metadata" => ""
      "additional" => ""
      "extensions" => ""
      "security_result" => ""
      "event_type" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "no_json"
  }
  if [no_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [msg][IPAddress]  not in ["", "Unknown"]  {
    mutate {
      merge => {
        "principal.ip" => "msg.IPAddress"
        "principal.asset.ip" => "msg.IPAddress"
      }
      on_error => "no_ipaddress"
    }
    if ![no_ipaddress] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [msg][HostName] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{msg.HostName}"
        "principal.asset.hostname" => "%{msg.HostName}"
        "has_principal" => "true"
      }
      on_error => "no_hostname"
    }
  }
  if [msg][Application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{msg.Application}"
      }
      on_error => "no_target_application"
    }
  }
  if [msg][Building] != "" {
    mutate {
      replace => {
        "Building_label.key" => "Building"
        "Building_label.value.string_value" => "%{msg.Building}"
      }
      on_error => "no_Building"
    }
    if ![no_Building] {
      mutate {
        merge => {
          "additional.fields" => "Building_label"
        }
        on_error => "Building_error"
      }
    }
  }
  if [msg][City]  not in ["", "Unknown"] {
    mutate {
      replace => {
        "principal.location.city" => "%{msg.City}"
      }
      on_error => "no_city"
    }
  }
  if [msg][Country]  not in ["", "Unknown"] {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{msg.Country}"
      }
      on_error => "no_country"
    }
  }
  if [msg][DataSource] != "" {
    mutate {
      replace => {
        "datasource_label.key" => "datasource"
        "datasource_label.value.string_value" => "%{msg.DataSource}"
      }
      on_error => "no_datasource"
    }
    if ![no_datasource] {
      mutate {
        merge => {
          "additional.fields" => "datasource_label"
        }
        on_error => "datasource_error"
      }
    }
  }
  if [msg][FactSubType] != "" {
    mutate {
      replace => {
        "factsubtype_label.key" => "factsubtype"
        "factsubtype_label.value.string_value" => "%{msg.FactSubType}"
      }
      on_error => "no_factsubtype"
    }
    if ![no_factsubtype] {
      mutate {
        merge => {
          "additional.fields" => "factsubtype_label"
        }
        on_error => "factsubtype_error"
      }
    }
  }
  if [msg][FactType] != "" {
    mutate {
      replace => {
        "facttype_label.key" => "facttype"
        "facttype_label.value.string_value" => "%{msg.FactType}"
      }
      on_error => "no_facttype"
    }
    if ![no_facttype] {
      mutate {
        merge => {
          "additional.fields" => "facttype_label"
        }
        on_error => "facttype_error"
      }
    }
  }
  if [msg][JobId] != "" {
    mutate {
      replace => {
        "jobid_label.key" => "jobid"
        "jobid_label.value.string_value" => "%{msg.JobId}"
      }
      on_error => "no_jobid"
    }
    if ![no_jobid] {
      mutate {
        merge => {
          "additional.fields" => "jobid_label"
        }
        on_error => "jobid_error"
      }
    }
  }
  if [msg][JobName] != "" {
    mutate {
      replace => {
        "jobname_label.key" => "jobname"
        "jobname_label.value.string_value" => "%{msg.JobName}"
      }
      on_error => "no_jobname"
    }
    if ![no_jobname] {
      mutate {
        merge => {
          "additional.fields" => "jobname_label"
        }
        on_error => "jobname_error"
      }
    }
  }
  if [msg][JobTimeutc] != "" {
    mutate {
      replace => {
        "jobtimeutc_label.key" => "jobtimeutc"
        "jobtimeutc_label.value.string_value" => "%{msg.JobTimeutc}"
      }
      on_error => "no_jobtimeutc"
    }
    if ![no_jobtimeutc] {
      mutate {
        merge => {
          "additional.fields" => "jobtimeutc_label"
        }
        on_error => "jobtimeutc_error"
      }
    }
  }
  if [msg][PostalCode]  not in ["", "Unknown"] {
    mutate {
      replace => {
        "postalcode_label.key" => "postalcode"
        "postalcode_label.value.string_value" => "%{msg.PostalCode}"
      }
      on_error => "no_postalcode"
    }
    if ![no_postalcode] {
      mutate {
        merge => {
          "additional.fields" => "postalcode_label"
        }
        on_error => "postalcode_error"
      }
    }
  }
  if [msg][State]  not in ["", "Unknown"] {
    mutate {
      replace => {
        "principal.location.state" => "%{msg.State}"
      }
      on_error => "no_state"
    }
  }
  if [msg][TotalPages] != "" {
    mutate {
      replace => {
        "totalpages_label.key" => "totalpages"
        "totalpages_label.value.string_value" => "%{msg.TotalPages}"
      }
      on_error => "no_totalpages"
    }
    if ![no_totalpages] {
      mutate {
        merge => {
          "additional.fields" => "totalpages_label"
        }
        on_error => "totalpages_error"
      }
    }
  }
  if [msg][UserDisplayName] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{msg.UserDisplayName}"
      }
      on_error => "no_userdisplayname"
    }
  }
  if [msg][VpnConnected] != "" {
    mutate {
      replace => {
        "vpnconnected_label.key" => "vpnconnected"
        "vpnconnected_label.value.string_value" => "%{msg.VpnConnected}"
      }
      on_error => "no_vpnconnected"
    }
    if ![no_vpnconnected] {
      mutate {
        merge => {
          "additional.fields" => "vpnconnected_label"
        }
        on_error => "vpnconnected_error"
      }
    }
  }
  if [mtd][customer] != "" {
    mutate {
      replace => {
        "customer_label.key" => "customer"
        "customer_label.value.string_value" => "%{mtd.customer}"
      }
      on_error => "no_customer"
    }
    if ![no_customer] {
      mutate {
        merge => {
          "additional.fields" => "customer_label"
        }
        on_error => "customer_error"
      }
    }
  }
  if [mtd][slt][node] != "" {
    mutate {
      replace => {
        "node_label.key" => "node"
        "node_label.value.string_value" => "%{mtd.slt.node}"
      }
      on_error => "no_node"
    }
    if ![no_node] {
      mutate {
        merge => {
          "additional.fields" => "node_label"
        }
        on_error => "node_error"
      }
    }
  }
  if [mtd][slt][pipeline] != "" {
    mutate {
      replace => {
        "pipeline_label.key" => "pipeline"
        "pipeline_label.value.string_value" => "%{mtd.slt.pipeline}"
      }
      on_error => "no_pipeline"
    }
    if ![no_pipeline] {
      mutate {
        merge => {
          "additional.fields" => "pipeline_label"
        }
        on_error => "pipeline_error"
      }
    }
  }
  if [mtd][source][database] != "" {
    mutate {
      replace => {
        "database_label.key" => "database"
        "database_label.value.string_value" => "%{mtd.source.database}"
      }
      on_error => "no_database"
    }
    if ![no_database] {
      mutate {
        merge => {
          "additional.fields" => "database_label"
        }
        on_error => "database_error"
      }
    }
  }
  if [mtd][source][host] != "" {
    mutate {
      replace => {
        "src.hostname" => "%{mtd.source.host}"
      }
      on_error => "no_src_host"
    }
  }
  if [mtd][source][port] not in ["","n/a"] {
    mutate {
      replace => {
        "src.port" => "%{mtd.source.port}"
      }
      on_error => "no_src_port"
    }
  }
  if [mtd][source][type] != "" {
    mutate {
      replace => {
        "sourcetype_label.key" => "sourcetype"
        "sourcetype_label.value" => "%{mtd.source.type}"
      }
      on_error => "no_sourcetype"
    }
    mutate {
      merge => {
        "src.resource.attribute.labels" => "sourcetype_label"
      }
      on_error => "sourcetype_error"
    }
  }
  if [mtd][timestamp][producer_process] != "" {
    mutate {
      replace => {
        "producer_process_label.key" => "producer_process"
        "producer_process_label.value.string_value" => "%{mtd.timestamp.producer_process}"
      }
      on_error => "no_producer_process"
    }
    if ![no_producer_process] {
      mutate {
        merge => {
          "additional.fields" => "producer_process_label"
        }
        on_error => "producer_process_error"
      }
    }
  }

  if [has_principal] == "true"  {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [src] != "" {
    mutate {
      rename => {
        "src" => "event.idm.read_only_udm.src"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "PHAROS"
      "event.idm.read_only_udm.metadata.vendor_name" => "PHAROS"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

