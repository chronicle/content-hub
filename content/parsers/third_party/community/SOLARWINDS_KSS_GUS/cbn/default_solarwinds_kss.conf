# Product: SolarWinds_KSS
# Category: Security Log
# Supported Format: SYSLOG + KV
# Reference: N/A
# Last Updated: 2024-06-11
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "account_domain" => ""
      "targetSubjectkv"=>""
      "subjectkv"=>""
      "accessreqinfoKV"=>""
      "processdataKV"=>""
      "networkinfoKV"=>""
      "description"=>""
      "process_kv"=>""
      "principal_ip"=>""
      "principal_hostname"=>""
      "product_event_type"=>""
      "severity"=>""
      "status"=>""
      "sec_result"=>""
      "object_server"=>""
      "product_desc"=>""
      "summary"=>""
      "security_id"=>""
      "subject_kv"=>""
      "tar_security_id"=>""
      "target_subject"=>""
      "logon_type"=>""
      "logon_guid"=>""
      "network_info_kv"=>""
      "target_ip"=>""
      "object_kv"=>""
      "processdata_kv"=>""
      "access_info_kv"=>""
      "key_length"=>""
      "ts"=>""
      "ldap_display"=>""
      "oid_syntax"=>""
      "tar_userid"=>""
      "prin_userid"=>""
      "subj_userid"=>""
      "net_hostname"=>""
      "access_hostname"=>""
      "process_name"=>""
      "caller_processname"=>""
      "sub_domain"=>""
      "targ_domain"=>""
      "transacion_id"=>""
      "resource_type"=>""
      "resource_guid"=>""
      "resource_name"=>""
      "process_pid"=>""
      "creator_pid"=>""
      "caller_pid"=>""
      "creator_processname"=>""
      "tar_port"=>""
      "source_address"=>""
      "fail_kvdata"=>""
      "fail_kv_data"=>""
      "plogon_guid"=>""
      "session_id"=>""
      "application" => ""
      "user_id" => ""
      "target_node" => ""
      "target_user" => ""
      "target_group" => ""
    }
  }
  mutate {
    gsub => ["message", "<CR><LF>" ,"#"]
  }
  mutate {
    gsub => ["message", "Source Network Address" ,"Source Address"]
  }
  mutate {
    gsub => ["message", "New Process ID" ,"Process ID"]
  }
  mutate {
    gsub => ["message", "New Process Name" ,"Process Name"]
  }
  grok {
    match => {
      message => [
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##Subject:%{GREEDYDATA:subjectkv}##Service:%{GREEDYDATA:targetSubjectkv}##Process:%{GREEDYDATA:processdataKV}##Service Request Information:%{GREEDYDATA:targetSubjectkv}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##Subject:%{GREEDYDATA:subjectkv}##Impersonation Level:\\t\\t%{DATA:Impersonation}##New Logon:%{GREEDYDATA:targetSubjectkv}##Process Information:%{GREEDYDATA:processdataKV}##Network Information:%{GREEDYDATA:networkinfoKV}##Detailed Authentication Information:%{GREEDYDATA:accessreqinfoKV}Key Length:\\t\\t%{INT:key_length}##%{GREEDYDATA:description}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##Subject:%{GREEDYDATA:subjectkv}##Account For Which Logon Failed:%{GREEDYDATA:targetSubjectkv}##Failure Information:%{GREEDYDATA:fail_kvdata}##Process Information:%{GREEDYDATA:processdataKV}##Network Information:%{GREEDYDATA:networkinfoKV}##Detailed Authentication Information:%{GREEDYDATA:accessreqinfoKV}Key Length:\\t\\t%{INT:key_length}##%{GREEDYDATA:description}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##Subject:%{GREEDYDATA:subjectkv}##Object:%{GREEDYDATA:targetSubjectkv}##Process Information:%{GREEDYDATA:processdataKV}##Access Request Information:%{GREEDYDATA:accessreqinfoKV}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##Creator Subject:%{GREEDYDATA:subjectkv}##Target Subject:%{GREEDYDATA:targetSubjectkv}##Process Information:%{GREEDYDATA:processdataKV}Process Command Line:%{DATA:cmd}\\t##%{GREEDYDATA:description}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.#\\t#Subject:%{GREEDYDATA:subjectkv}##Network Information:%{GREEDYDATA:networkinfoKV}#\\t#Share Information:%{GREEDYDATA:targetSubjectkv}##Access Request Information:%{GREEDYDATA:accessreqinfoKV}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.#\\t#Subject:%{GREEDYDATA:subjectkv}##Directory Service:%{GREEDYDATA:networkinfoKV}#\\t#Object:%{GREEDYDATA:targetSubjectkv}#\\t#Attribute:%{GREEDYDATA:processdataKV}#\\t#Operation:%{GREEDYDATA:targetSubjectkv}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##Subject:%{GREEDYDATA:subjectkv}##Privileges:%{GREEDYDATA:accessreqinfoKV}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##Subject:%{GREEDYDATA:subjectkv}##%{GREEDYDATA:description}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}.##%{GREEDYDATA:accessreqinfoKV}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} %{DATA} %{HOSTNAME:principal_hostname} %{WORD:product_event_type}\\t%{INT:severity}\\t%{DATA:object_server}\\t%{INT}\\t%{DATA} %{DATA} %{DATA}\\t%{INT}\\t%{DATA:product_desc}\\t\\tN/A\\t%{GREEDYDATA:status}\\t%{DATA}\\t%{DATA}\\t%{GREEDYDATA:summary}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{NOTSPACE} %{NOTSPACE} %{NOTSPACE} %{GREEDYDATA:principal_hostname}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IP:principal_ip} %{WORD:application} Original Address=%{IP:ip1} %{DATA} %{DATA} (%{SPACE}?)%{DATA} %{DATA} %{GREEDYDATA:description}"
      "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{IPORHOST:principal_hostname} %{DATA}: %{DATA:product_event_type} %{GREEDYDATA:description}"
     ]
   }
   overwrite => ["ts","principal_ip","application","ip1","principal_hostname","product_event_type","severity","object_server","product_desc","status","product_event_type","principal_host","summary","description","subjectkv","targetSubjectkv","processdataKV","accessreqinfoKV","networkinfoKV","impersonation","key_length","fail_kvdata"]
   on_error => "grok_failure"
  }

  mutate{
    replace=>{
      "targetSubjectkv"=>"%{targetSubjectkv}%{fail_kvdata}"
    }
    on_error => "error_kv"
  }

  if [description] != "" {
    mutate {
      gsub => ["description", "##" ,""]
    }
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "desc_error"
    }
    grok {
      match => {
        "description" => [
          "%{GREEDYDATA}User %{DATA:user_id} %{GREEDYDATA} (node|on) %{HOSTNAME:target_node}\\s+\\(%{IP:target_ip}\\)%{GREEDYDATA}",
          "%{GREEDYDATA}User %{DATA:user_id} %{GREEDYDATA} (node|on) %{HOSTNAME:target_node}\\.%{GREEDYDATA}",
          "%{GREEDYDATA}User %{DATA:user_id} %{GREEDYDATA} (node|on) %{HOSTNAME:target_node}%{GREEDYDATA}",
          "%{GREEDYDATA}User %{DATA:target_user} (logged in|logged out) from %{IP:principal_ip}",
          "%{GREEDYDATA}User %{DATA:user_id} %{DATA}changed account %{DATA:target_user} \\(GroupInfo: %{DATA:target_group}\\)%{GREEDYDATA}",
          "%{GREEDYDATA}User %{DATA:user_id} %{GREEDYDATA} Node %{DATA} - %{HOSTNAME:target_node}\\.|\\s+%{GREEDYDATA}"
          "%{GREEDYDATA}User %{DATA:user_id} %{GREEDYDATA}",
        ]
      }
      on_error => "error_description"
      overwrite => ["user_id","target_node","principal_ip","target_user","target_group","target_ip"]
    }
    if [user_id] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{user_id}"
        }
        on_error => "error_user_id"
      }
    }
    if [target_user] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{target_user}"
        }
        on_error => "error_user_id"
      }
    }
    if [target_ip] != "" {
      mutate {
        merge => {
          "target.ip" => "target_ip"
          "target.asset.ip" => "target_ip"
        }
        on_error => "error_target_ip"
      }
    }
    if [target_node] != "" {
      mutate {
        replace => {
          "target.hostname" => "%{target_node}"
          "target.asset.hostname" => "%{target_node}"
        }
        on_error => "error_target_node"
      }
    }
    if [target_group] != "" {
      mutate {
        merge => {
          "target.user.group_identifiers" => "target_group"
        }
        on_error => "error_target_group"
      }
    }
  }
  if [targetSubjectkv] != "" {
    kv {
      source => "targetSubjectkv"
      field_split => "#"
      value_split => ":"
      target => "target_subject"
      on_error =>"target_subject_error"
    }

    mutate {
      replace => {
        "tar_security_id" => "%{target_subject.Security ID}"
      }
      on_error => "error_creator_secId"
    }

    if [tar_security_id] != ["","-"] and [tar_security_id] =~ "^S-\\\\d-(\\\\d+-){1,14}\\\\d+$" {
      mutate {
        replace => {
          "target.user.windows_sid" => "%{tar_security_id}"
        }
      }
    }

    mutate {
      replace => {
        "session_id" => "%{target_subject.Correlation ID}"
      }
      on_error => "error_correlation"
    }

    if [session_id] not in ["","-"]{
      mutate {
        gsub => ["session_id", "{|}" ,""]
      }

      mutate {
        replace => {
          "network.session_id" => "%{session_id}"
        }
      }
    }

    mutate {
      replace => {
        "net_typefield.key" => "Operation Type"
        "net_typefield.value" => "%{target_subject.Type}"
      }
       on_error => "error_net_Type"
    }

    if ![error_net_Type] {
      mutate {
        merge => {
          "src.labels" => "net_typefield"
        }
      }
    }

    mutate {
      replace => {
        "ser_req_info_field.key" => "Privileges"
        "ser_req_info_field.value" => "%{target_subject.Privileges}"
      }
      on_error => "error_ser_req_info_priv"
    }

    if ![error_ser_req_info_priv] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "ser_req_info_field"
        }
      }
    }

    mutate {
      replace => {
        "resource_type" => "%{target_subject.Object Type}"
      }
      on_error =>"error_resource_type"
    }

    mutate {
      replace => {
        "resource_guid" => "GUID: %{target_subject.GUID}"
      }
      on_error =>"error_resource_guid"
    }

    mutate {
      replace => {
        "resource_name" => "%{target_subject.Share Name}"
      }
      on_error =>"error_resource_name"
    }

    mutate {
      replace => {
        "target.file.full_path" => "%{target_subject.Object Name}"
      }
       on_error => "error_target_fullpath"
    }

    if [resource_type] != "" {
      mutate {
        replace => {
          "target.resource.type" => "%{resource_type}"
        }
      }
    }

    mutate {
      replace => {
        "target.resource.parent" => "%{target_subject.Object Server}"
      }
      on_error => "error_object_Server"
    }

     if [resource_guid] != "" {
      mutate {
        replace => {
          "target.resource.id" => "%{resource_guid}"
        }
      }
    }

    mutate {
      replace => {
        "object_handleid_label.key" => "Handle ID"
        "object_handleid_label.value" => "%{target_subject.Handle ID}"
      }
      on_error => "error_obejct_class"
    }

    if ![error_obejct_class] {
      mutate {
        merge => {
          "target.labels" => "object_handleid_label"
        }
      }
    }

    mutate {
      replace => {
        "object_class_label.key" => "Object Class"
        "object_class_label.value" => "%{target_subject.Class}"
      }
      on_error => "error_obejct_class"
    }

    if ![error_obejct_class] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "object_class_label"
        }
      }
    }

    mutate {
      replace => {
        "object_dn_label.key" => "Object DN"
        "object_dn_label.value" => "%{target_subject.DN}"
      }
      on_error => "error_obejct_dns"
    }

    if ![error_obejct_dns] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "object_dn_label"
        }
      }
    }

    if [resource_name] != "" {
      mutate {
        replace => {
          "target.resource.name" => "%{resource_name}"
        }
      }
    }

    mutate {
      replace => {
        "target.file.full_path" => "%{target_subject.Share Path}"
      }
       on_error => "error_share_tfullpath"
    }

    mutate {
      replace => {
        "network.tls.client.server_name" => "%{target_subject.Server}"
      }
      on_error => "error_server_name"
    }


    mutate {
      replace => {
        "targ_domain" => "%{target_subject.Account Domain}"
      }
      on_error => "error_sub_domain"
    }

    if [targ_domain] not in ["","-"] {
      mutate {
        replace => {
          "target.administrative_domain" => "%{targ_domain}"
        }
      }
    }

    mutate {
      replace => {
        "tar_userid" => "%{target_subject.Account Name}"
      }
      on_error => "errort_tar_userid"
    }

    if [tar_userid] not in ["","-"] {
      mutate {
        replace => {
          "target.user.userid" => "%{tar_userid}"
        }
      }
    }

    mutate {
      replace => {
        "target_logonid.key" => "Logon ID"
        "target_logonid.value" => "%{target_subject.Logon ID}"
      }
       on_error => "error_tar_logonid"
    }

    if ![error_tar_logonid] {
      mutate {
        merge => {
          "target.labels" => "target_logonid"
        }
      }
    }

    mutate {
      replace => {
        "logon_guid" => "%{target_subject.Logon GUID}"
      }
      on_error => "error_creator_secId"
    }

    if [logon_guid] != "" {
      mutate {
        gsub => ["logon_guid", "{|}" ,""]
      }
      mutate {
        replace => {
          "target.asset.asset_id" => "GUID: %{logon_guid}"
        }
      }
    }
    mutate {
      replace => {
        "status_labels.key" => "Failure Status"
        "status_labels.value.string_value" => "%{target_subject.Status}"
      }
      on_error => "status_label_not_found"
    }

    if ![status_label_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "status_labels"
        }
      }
    }

    mutate {
      replace => {
        "failure_reason_labels.key" => "Failure Reason"
        "failure_reason_labels.value.string_value" => "%{target_subject.Failure Reason}"
      }
      on_error => "failure_reason_not_found"
    }

    if ![failure_reason_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "failure_reason_labels"
        }
      }
    }

    mutate {
      replace => {
        "sub_status_label.key" => "Failure Sub Status"
        "sub_status_label.value.string_value" => "%{target_subject.Sub Status}"
      }
      on_error => "sub_status_not_found"
    }

    if ![sub_status_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "sub_status_label"
        }
      }
    }
  }

  if [subjectkv] != "" {
    kv {
      source => "subjectkv"
      field_split => "#"
      value_split => ":"
      target => "subject_kv"
      on_error => "subjectkv_error"
    }

    mutate {
      replace => {
        "security_id" => "%{subject_kv.Security ID}"
      }
      on_error => "error_subj_secId"
    }

    mutate {
      replace => {
        "logon_type" => "%{subject_kv.Logon Type}"
      }
      on_error => "error_creator_secId"
    }


    mutate {
      replace => {
        "sub_domain" => "%{subject_kv.Account Domain}"
      }
      on_error => "error_sub_domain"
    }

    if [sub_domain] not in ["","-"] {
      mutate {
        replace => {
          "target.administrative_domain" => "%{sub_domain}"
        }
      }
    }

    mutate {
      replace => {
        "subj_userid" => "%{subject_kv.Account Name}"
      }
      on_error => "errort_subj_userid"
    }

    if [subj_userid] not in ["-",""] {
      mutate {
        replace => {
          "principal.user.userid" => "%{subj_userid}"
        }
      }
    }

    mutate {
      replace => {
        "sec_result_logonid.key" => "Logon ID"
        "sec_result_logonid.value" => "%{subject_kv.Logon ID}"
      }
       on_error => "error_logonid"
    }

    if ![error_logonid] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "sec_result_logonid"
        }
      }
    }
    mutate {
      replace => {
        "virtual_account_label.key" => "Virtual Account"
        "virtual_account_label.value.string_value" => "%{subject_kv.Virtual Account}"
      }
      on_error => "error_Virtual"
    }

    if ![error_Virtual] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "virtual_account_label"
        }
      }
    }

    if [security_id] != "" and [security_id] =~ "^S-\\\\d-(\\\\d+-){1,14}\\\\d+$" {
      mutate {
        replace => {
          "principal.user.windows_sid" => "%{security_id}"
        }
      }
    }
  }

  if [processdataKV] != "" {
    kv {
      source => "processdataKV"
      field_split => "#"
      value_split => ":"
      target => "processdata_kv"
      on_error => "processdata_kv_error"
    }

    mutate {
      replace => {
        "process_name" => "%{processdata_kv.Process Name}"
      }
      on_error => "error_process_name"
    }

    mutate {
      replace => {
        "process_pid" => "%{processdata_kv.Process ID}"
      }
      on_error => "error_process_pid"
    }

    if [process_name] not in ["","-"] {
      mutate {
        replace => {
          "target.process.file.full_path" => "%{process_name}"
        }
      }
    }

    if [process_pid] not in ["","-"] {
      mutate {
        replace => {
          "target.process.pid" => "%{process_pid}"
        }
      }
    }

    mutate {
      replace => {
        "caller_processname" => "%{processdata_kv.Caller Process Name}"
      }
      on_error => "error_caller_processname"
    }

    if [caller_processname] not in ["","-"] {
      mutate {
        replace => {
          "principal.process.file.full_path" => "%{caller_processname}"
        }
      }
    }

    mutate {
      replace => {
        "creator_processname" => "%{processdata_kv.Creator Process Name}"
      }
      on_error => "error_create_processname"
    }

    if [creator_processname] not in ["","-"] {
      mutate {
        replace => {
          "principal.process.file.full_path" => "%{creator_processname}"
        }
      }
    }

    mutate {
      replace => {
        "caller_pid" => "%{processdata_kv.Caller Process ID}"
      }
      on_error => "error_caller_pid"
    }

    if [caller_pid] not in ["","-"] {
      mutate {
        replace => {
          "principal.process.pid" => "%{caller_pid}"
        }
      }
    }

    mutate {
      replace => {
        "creator_pid" => "%{processdata_kv.Creator Process ID}"
      }
      on_error => "error_creator_pid"
    }

    if [creator_pid] not in ["","-"] {
      mutate {
        replace => {
          "principal.process.pid" => "%{creator_pid}"
        }
      }
    }

    mutate {
      replace => {
        "ldap_display" => "%{processdata_kv.LDAP Display Name}"
        "oid_syntax" => "%{processdata_kv.Syntax (OID)}"
      }
      on_error => "error_process_pid"
    }

    if [ldap_display] !="" {
      mutate {
        merge => {
          "src.user.group_identifiers" => "ldap_display"
        }
      }
    }

    if [oid_syntax] !="" {
      mutate {
        merge => {
          "src.user.group_identifiers" => "oid_syntax"
        }
      }
    }

    mutate {
      replace => {
        "token_elevation_type_label.key" => "Token Elevation Type"
        "token_elevation_type_label.value.string_value" => "%{processdata_kv.Token Elevation Type}"
      }
      on_error => "targ_elevation_type_err"
    }

    if ![targ_elevation_type_err] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "token_elevation_type_label"
        }
      }
    }
  }

  if [accessreqinfoKV] != "" {
    kv {
      source => "accessreqinfoKV"
      field_split => "#"
      value_split => ":"
      target => "access_info_kv"
      on_error => "access_info_kv_error"
    }

    mutate {
      replace => {
        "transaction_id" => "%{access_info_kv.Transaction ID}"
      }
      on_error => "error_access_reason"
    }

    mutate {
      gsub => ["transaction_id", "{|}" ,""]
    }

    mutate {
      replace => {
        "access_mask_labels.key"=> "Access Mask"
        "access_mask_labels.value.string_value" => "%{access_info_kv.Access Mask}"
      }
      on_error => "error_accesses"
    }

    if ![error_accesses] {
      mutate {
        merge => {
         "event.idm.read_only_udm.additional.fields" => "access_mask_labels"
        }
      }
    }

    mutate {
      replace => {
        "accesses_labels.key"=> "Accesses"
        "accesses_labels.value.string_value" => "%{access_info_kv.Accesses}"
      }
      on_error => "error_accesses"
    }

    if ![error_accesses] {
      mutate {
        merge => {
         "event.idm.read_only_udm.additional.fields" => "accesses_labels"
        }
      }
    }

    mutate {
      replace => {
        "labels_read_Attributes.key"   => "ReadAttributes"
        "labels_read_Attributes.value" => "%{access_info_kv.ReadAttributes}"
      }
      on_error => "error_readAttributes"
    }

    if ![error_readAttributes] {
      mutate {
        merge => {
         "target.resource.attribute.labels" => "labels_read_Attributes"
        }
      }
    }

    mutate {
      replace => {
        "labels_write_Attributes.key"   => "WriteAttributes"
        "labels_write_Attributes.value" => "%{access_info_kv.WriteAttributes}"
      }
      on_error => "error_writeAttributes"
    }

    if ![error_writeAttributes] {
      mutate {
        merge => {
         "target.resource.attribute.labels" => "labels_write_Attributes"
        }
      }
    }

    mutate {
      replace => {
        "labels_synchronize.key"   => "SYNCHRONIZE"
        "labels_synchronize.value" => "%{access_info_kv.SYNCHRONIZE}"
      }
      on_error => "error_synchronize"
    }

    if ![error_synchronize] {
      mutate {
        merge => {
         "target.resource.attribute.labels" => "labels_synchronize"
        }
      }
    }

    mutate {
      replace => {
        "labels_readEA.key"   => "ReadEA"
        "labels_readEA.value" => "%{access_info_kv.ReadEA}"
      }
      on_error => "error_readea"
    }

    if ![error_readea] {
      mutate {
        merge => {
         "target.resource.attribute.labels" => "labels_readEA"
        }
      }
    }

    mutate {
      replace => {
        "labels_accessreason.key"   => "Access Reasons"
        "labels_accessreason.value" => "%{access_info_kv.Access Reasons}"
      }
      on_error => "error_access_reason"
    }

    if ![error_access_reason] {
      mutate {
        merge => {
         "target.resource.attribute.labels" => "labels_accessreason"
        }
      }
    }

    mutate {
      replace => {
        "labels_transactionid.key"   => "Transaction ID"
        "labels_transactionid.value" => "%{transaction_id}"
      }
      on_error => "error_access_reason"
    }

    if ![error_access_reason] {
      mutate {
        merge => {
         "target.resource.attribute.labels" => "labels_transactionid"
        }
      }
    }

    mutate {
      replace => {
        "sec_result.about.resource.name" => "%{access_info_kv.Authentication Package}"
      }
      on_error => "error_sec_res"
    }

    mutate {
      replace => {
        "prin_userid" => "%{access_info_kv.Logon Account}"
      }
      on_error => "error_logon_acc"
    }

    if [prin_userid] not in ["","-"] {
      mutate {
        replace => {
          "principal.user.userid" => "%{prin_userid}"
        }
      }
    }

    mutate {
      replace => {
      "access_hostname" => "%{access_info_kv.Source Workstation}"
      }
      on_error => "error_tworkstation"
    }

    if [access_hostname] not in ["","-"] {
      mutate {
        replace => {
          "target.hostname" => "%{access_hostname}"
          "target.asset.hostname" => "%{access_hostname}"
        }
      }
    }
  }

  if [networkinfoKV] != "" {
    kv {
      source => "networkinfoKV"
      field_split => "#"
      value_split => ":"
      target => "network_info_kv"
      on_error => "network_info_kv_error"
    }

    mutate {
      replace => {
        "source_address" => "%{network_info_kv.Source Address}"
      }
      on_error => "error_source_address"
    }

    if [source_address] not in ["","-"] {
      grok {
        match => {
          "source_address" => ["%{IP:source_address}"]
        }
        on_error => "error_source_address"
        overwrite => ["source_address"]
      }
      if ![error_source_address] {
        mutate {
          merge => {
            "target.ip" => "source_address"
            "target.asset.ip" => "source_address"
          }
          on_error => "ip_merge_error"
        }
      }
    }

    mutate {
      replace => {
        "net_hostname" => "%{network_info_kv.Workstation Name}"
      }
      on_error => "error_net_hostname"
    }

    if [net_hostname] not in ["","-"] {
      mutate {
        replace => {
          "target.hostname" => "%{net_hostname}"
          "target.asset.hostname" => "%{net_hostname}"
        }
      }
    }

    mutate {
      replace => {
        "tar_port" => "%{network_info_kv.Source Port}"
      }
      on_error => "error_net_hostname"
    }

    if [tar_port] not in ["","-"] {
      mutate {
        convert => {
          "target.port" => "integer"
        }
        replace => {
          "target.port" => "%{tar_port}"
        }
      }
    }

    mutate {
      replace => {
        "labels_object_type.key"   => "Object Type"
        "labels_object_type.value" => "%{network_info_kv.Object Type}"
      }
       on_error => "error_object_type"
    }

    if ![error_object_type] {
      mutate {
        merge => {
         "about.labels" => "labels_object_type"
        }
      }
    }

    mutate {
      replace => {
        "dir_service_field.key" => "Directory Service Name"
        "dir_service_field.value" => "%{network_info_kv.Name}"
      }
      on_error => "error_dir_service_name"
    }

    if ![error_dir_service_name] {
      mutate {
        merge => {
          "about.labels" => "dir_service_field"
        }
      }
    }

    mutate {
      replace => {
        "dir_service_field_type.key" => "Directory Service Type"
        "dir_service_field_type.value" => "%{network_info_kv.Type}"
      }
      on_error => "error_dir_service_type"
    }

    if ![error_dir_service_type] {
      mutate {
        merge => {
          "about.labels" => "dir_service_field_type"
        }
      }
    }

    mutate {
      replace => {
        "plogon_guid" => "%{network_info_kv.Logon GUID}"
      }
      on_error => "error_plogon_guid"
    }

    if [plogon_guid] not in ["","-"] {
      mutate {
        gsub => ["plogon_guid", "{|}" ,""]
      }

      mutate {
        replace => {
          "principal.asset.asset_id" => "GUID: %{plogon_guid}"
        }
      }
    }
  }

  if [ts] != "" {
    date {
      match => ["ts", "MMM  d HH:mm:ss", "MMM d HH:mm:ss","MMM dd HH:mm:ss"]
      on_error => "date_format_failure"
    }
  }
  grok {
    match => {
      "principal_ip" => ["%{IP:principal_ip}"]
    }
    on_error => "error_principal_ip"
    overwrite => ["principal_ip"]
  }
  if ![error_principal_ip] {
    mutate {
      merge => {
        "principal.ip" => "principal_ip"
        "principal.asset.ip" => "principal_ip"
      }
      on_error => "error_p_ip"
    }
  }
  if [application] != ""{
    mutate {
      replace => {
        "target.application" => "%{application}"
      }
    }
  }

  if [principal_hostname] != "" {
    mutate {
        replace => {
          "principal.hostname" => "%{principal_hostname}"
          "principal.asset.hostname" => "%{principal_hostname}"
      }
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
    }
  }

  if [object_server] != "" {
    mutate {
      replace => {
        "object_server_label.key"   => "Object Server"
        "object_server_label.value.string_value" => "%{object_server}"
      }
    }
    mutate {
      merge => {
      "event.idm.read_only_udm.additional.fields" => "object_server_label"
      }
    }
  }

  if [severity] in [ "1", "2", "3" ] {
    mutate {
      replace => {
        "sec_result.severity" => "LOW"
      }
    }
  }
  else if [severity] in [ "4", "5", "6" ] {
    mutate {
      replace => {
        "sec_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] in [ "7", "8", "9" ] {
    mutate {
      replace => {
        "sec_result.severity" => "HIGH"
      }
    }
  }

  if [severity] != "" {
    mutate {
      replace => {
        "sec_result.severity_details" => "%{severity}"
      }
    }
  }

  if [status] =~ "Success" {
    mutate {
      replace => {
        "action" => "ALLOW"
        "sec_result.action_details" => "%{status}"
      }
       merge => {
        "sec_result.action" => "action"
      }
    }
  }
  else if [status] =~ "Failure" {
    mutate {
      replace => {
        "action" => "BLOCK"
        "sec_result.action_details" => "%{status}"
      }
       merge => {
        "sec_result.action" => "action"
      }
    }
  }

  if [product_desc] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{product_desc}"
      }
    }
  }

  if [key_length] != "" {
    mutate {
      replace => {
        "key_length_label.key" => "Key Length"
        "key_length_label.value.string_value" => "%{key_length}"
      }
    }
     mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "key_length_label"
        }
     }
  }

  if [logon_type] == '3' {
    mutate {
      replace => {
        "mechanism" => "NETWORK"
      }
    }
  }
  else if [logon_type] == '4' {
    mutate {
      replace => {
        "mechanism" => "BATCH"
      }
    }
  }
  else if [logon_type] == '5' {
    mutate {
      replace => {
        "mechanism" => "SERVICE"
      }
    }
  }
  else if [logon_type] == '8' {
    mutate {
      replace => {
        "mechanism" => "NETWORK_CLEAR_TEXT"
      }
    }
  }
  else if [logon_type] == '9' {
    mutate {
      replace => {
        "mechanism" => "NEW_CREDENTIALS"
      }
    }
  }
  else if [logon_type] == '10' {
    mutate {
      replace => {
        "mechanism" => "REMOTE_INTERACTIVE"
      }
    }
  }
  else if [logon_type] == '11' {
    mutate {
      replace => {
        "mechanism" => "CACHED_INTERACTIVE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "mechanism" => "MECHANISM_OTHER"
      }
    }
  }

  if [mechanism] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
      }
    }
  }

  if [summary] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{summary}"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.about" => "about"
    }
    on_error => "error_about_merge_exception"
  }
  if [summary] =~ "logged on | failed to log on" or [description] =~ "logged on | failed to log on | logged in" {
      mutate {
      replace=>{
        "metadata.event_type" =>"USER_LOGIN"
      }
    }
  }
  else if [summary] =~ "logged off" or [description] =~ "logged out | logged off" {
      mutate {
      replace=>{
        "metadata.event_type" =>"USER_LOGOUT"
      }
    }
  }
  else if ([security_id] != "" || [prin_userid] != "" || [prin_userid] != "" or [user_id] != "") && ([resource_type] != "" || [resource_guid] != "" || [resource_name] != "") {
   mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if ([process_pid] != "" || [process_name] != "" || [prin_userid] != "" or [user_id] != "") && ([creator_pid] != "" || [caller_pid] != "") {
    mutate {
      replace => {
        "metadata.event_type" => "PROCESS_LAUNCH"
      }
    }
  }
  else if ([principal_ip] != "" || [principal_hostname] != "") && ([process_pid] != "" || [process_name] != "" ) {
   mutate {
      replace => {
        "metadata.event_type" => "SERVICE_START"
      }
    }
  }
  else if ([principal_ip] != "" || [principal_hostname] != "") && ([targ_domain] == "" || [sub_domain] == "") {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if ([targ_domain] != "" || [sub_domain] != "") && ([prin_userid] != "" || [security_id] != "" || [user_id] != "") {
   mutate {
      replace => {
        "metadata.event_type" => "RESOURCE_CREATION"
      }
    }
  }
  else if [prin_userid] != "" or [user_id] != "" {
   mutate {
      replace=>{
        "metadata.event_type" =>"USER_COMMUNICATION"
      }
    }
  }
  else{
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    rename => {
      "metadata" => "event.idm.read_only_udm.metadata"
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "src"=>"event.idm.read_only_udm.src"
      "network"=>"event.idm.read_only_udm.network"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "SOLARWINDS_KSS"
      "event.idm.read_only_udm.metadata.product_name" => "SOLARWINDS_KSS"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}


