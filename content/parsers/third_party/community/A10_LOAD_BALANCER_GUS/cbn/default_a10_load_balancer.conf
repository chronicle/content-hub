# Product: A10 LOAD BALANCER
# Category: LOAD BALANCER
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2025-12-17
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "time" => ""
      "host_name" => ""
      "gslb" => ""
      "dns" => ""
      "dns_server" => ""
      "prin_ip" => ""
      "prin_port" => ""
      "partition_id" => ""
      "url" => ""
      "proto" => ""
      "tar_ip" => ""
      "prin_mac" => ""
      "tar_mac" => ""
      "user" => ""
      "tar_port" => ""
      "httpmethod" => ""
      "sessionid" => ""
      "status_code" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "prin_host" => ""
      "cef_extension" => ""
      "app" => ""
      "device_vendor" => ""
      "device_product" => ""
      "device_version" => ""
      "device_event_class_id" => ""
      "event_name" => ""
      "severity" => ""
      "src" => ""
      "dst" => ""
      "dpt" => ""
      "msg" => ""
      "suser" => ""
      "request" => ""
      "act" => ""
      "spt" => ""
      "method" => ""
      "tls_version" => ""
      "app_proto" => ""
      "cn2" => ""
      "security_result" => ""
      "cn1" => ""
      "cn1Label" => ""
      "cn2Label" => ""
      "meta.customer" => ""
      "meta.topic_id" => ""
      "abc" => ""
      "cs6" => ""
      "cs6Label" => ""
      "cs7" => ""
      "cs7Label" => ""
      "cs8" => ""
      "cs8Label" => ""
      "xml_data" => ""
      "desc" => ""
      "facility" => ""
      "event_dt" => ""
      "proxy_machine_ip" => ""
      "proxy_machine" => ""
      "vendor_severity" => ""
      "intermediary" => ""
      "target_user" => ""
      "rule_name" => ""
      "has_target_user" => ""
      "log_type" => ""
      "system" => ""
      "attack_status" => ""
      "host" => ""
      "uri" => ""
      "security_result_action" => ""
      "attack_details" => ""
      "virtualserver" => ""
      "timestamp" => ""
      "msg_description" => ""
      "syslog_priority" => ""
      "service_name" => ""
      "has_principal_user" => "false"
      "kv_data" => ""
      "httpversion" => ""
      "bytes_in" => ""
      "bytes_out" => ""
      "pkts_in" => ""
      "pkts_out" => ""
      "bytes_total" => ""
      "pkts_total" => ""
      "sourceip" => ""
      "inter_host" => ""
      "version" => ""
      "group" => ""
      "vlan_id" => ""
      "Script_name" => ""
      "len" => ""
      "inter_port" => ""
      "seq_id" => ""
      "has_http" => ""
      "dhost" => ""
      "jdeLoginCookie" => ""
      "Max-Age" => ""
      "SameSite" => ""
      "cookie_version" => ""
      "cookie_http" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>GSLB)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> GSLB .* - %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) port %{INT:prin_port} changes state from .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>AFLEX)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> %{DATA:dns_server} %{DATA} CLIP %{IP:prin_ip}.* URL %{GREEDYDATA:url}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>AFLEX|ACOS|GSLB)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> .* content=.*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>GSLB)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> GSLB .* - %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) changes state from .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>GSLB)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> GSLB .* - %{GREEDYDATA:dns_server} changes state from .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>GSLB)\\]<%{INT:gslb}> GSLB .* - %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) changes state from .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>GSLB)\\]<%{INT:gslb}> GSLB .* - %{GREEDYDATA:dns_server} changes state from .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (?P<desc>SLB .* %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) ((TCP|UDP) port|port) %{INT:prin_port} (of group %{GREEDYDATA:group} | )?is (up|down) (\\((?P<proto>TCP|HTTP) .*\\)|.*))",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (?P<desc>Service-group %{GREEDYDATA:dns_server} is (down|up).)",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (?P<desc>Service.* %{GREEDYDATA:virtualserver} (port %{INT:inter_port}|)? is (down|up)).",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (?P<desc>SLB .* %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) ?is (up|down) \\((?P<proto>TCP) .*\\))",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> Virtual.* %{GREEDYDATA:dns_server} is (down|up)",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (?P<desc>.*virtual.* %{GREEDYDATA:dns_server} port %{INT:prin_port} is (down|up))",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>AFLEX)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> .* CLIP %{IP:prin_ip} TO .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Pin.*ping: %{IP:prin_ip} seq=%{DATA:seq_id} %{GREEDYDATA}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Pin.*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> SLB .* %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) port %{INT:prin_port} is (up|down)"
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> SLB .* %{GREEDYDATA:dns_server} port %{INT:prin_port} is (up|down)",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (G|)?SLB .* %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) is (up|down) (\\((?P<proto>TCP|HTTP|ICMP) .*\\)|.*)",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (G|)?SLB .* %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) port %{INT:prin_port} is (up|down) (\\((?<proto>TCP|HTTP|ICMP) .*\\)|.*)",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> (G|)?SLB .* %{GREEDYDATA:dns_server} \\(%{IP:prin_ip}\\) is (up|down) (\\((?P<proto>TCP|HTTP|ICMP) .*\\)|.*)",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Partition: .* cli: \\[%{IP:prin_ip}:%{INT:prin_port}\\] .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> .* cli: \\[%{IP:prin_ip}:%{INT:prin_port}\\] .*"
        "<%{INT:syslog_priority}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:host_name} %{DATA:app}: \\[(?P<log_type>SYSTEM)\\]<%{INT:gslb}> %{GREEDYDATA:msg_description}"
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}>\\s+Session.*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> \\[Src IP: %{IP:prin_ip}\\] \\[Src port: %{INT:prin_port}\\] \\[Dst IP: %{IP:tar_ip}\\] \\[Dst port: %{INT:tar_port}\\] .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> (G|)?SLB .* %{GREEDYDATA:dns_server} port %{INT:prin_port} is (up|down)",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> .* authentication successful \\(user: %{DATA:user}\\).",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> .* username: %{DATA:user}, remote host: %{IP:prin_ip}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> .*Port %{INT:prin_port} VLAN %{INT:vlan_id} Src MAC %{DATA:prin_mac} Dst MAC %{MAC:tar_mac}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> A %{DATA:session} session .* %{IP:prin_ip} .* Session ID assigned is %{INT:sessionid}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Partition: .* RESP (?P<proto>HTTP) status %{INT:status_code}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Partition: .* (axapi|web): \\[%{INT}:%{IP:prin_ip}:%{INT:prin_port}\\] (?P<httpmethod>POST|GET|PUT): %{NOTSPACE:url}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Partition: .* axapi: \\[%{NOTSPACE}\\] (?P<httpmethod>POST|GET|PUT): %{NOTSPACE:url}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Control CPU Usage .*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> Local.*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> VRRP-A.*",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> VRRP-A.*"
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:prin_host} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> .* CEF:%{INT:version}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:cef_extension}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> %{GREEDYDATA:msg} and Destination IP:%{IP:tar_ip}%{GREEDYDATA}"
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[%{WORD:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> request blocked by %{DATA:system} for SIP %{IP:src} SPort %{NUMBER:spt} DIP %{IP:dst} DPort %{NUMBER:dpt} Attack %{WORD:attack_status} Hostname %{DATA:host} URI %{NOTSPACE:uri} SessionID %{NOTSPACE:sessionid}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[%{WORD:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> request blocked by %{NOTSPACE:system} for SIP %{IP:src} SPort %{NUMBER:spt} DIP %{IP:dst} DPort %{NUMBER:dpt} Attack %{GREEDYDATA:attack_details},%{DATA:attack_status} Hostname %{NOTSPACE:host} URI %{NOTSPACE:uri} SessionID %{NOTSPACE:sessionid}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:host_name} %{DATA:app}: \\[(?P<log_type>HMON)\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> (?P<desc>SLB server %{DATA:virtualserver} \\(%{HOSTNAME:host}\\) ((?P<proto>TCP|UDP) port|port) %{INT:prin_port} (of group %{GREEDYDATA:group} | )?is (up|down) (\\((%{GREEDYDATA}) .*\\)|.*))",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:inter_host} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> %{DATA:Script_name}:system=%{DATA:host_name} %{GREEDYDATA:kv_data}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:inter_host} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> %{DATA:Script_name}:%{DATA:host_name},%{GREEDYDATA:kv_data}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:inter_host} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> %{DATA:Script_name}:%{DATA:host_name} %{GREEDYDATA:kv_data}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:inter_host} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> %{DATA:desc} \\(%{GREEDYDATA:kv_data}\\)"
        "%{SYSLOGTIMESTAMP:time} %{DATA:prin_host} .* CEF:%{INT:version}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:cef_extension}"
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} a10logd: \\[(?P<log_type>SYSTEM)\\]<%{INT:gslb}>%{GREEDYDATA}"
        "<%{INT}>%{SYSLOGTIMESTAMP} %{DATA:host_name} a10logd: \\[%{DATA:log_type}\\]<%{INT:gslb}>\\s+%{GREEDYDATA:desc}: %{GREEDYDATA:xml_data}"
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:host_name} %{DATA:app}: \\[%{DATA:log_type}\\]<%{INT:gslb}> %{GREEDYDATA:desc}",
        "%{TIMESTAMP_ISO8601:time} %{NOTSPACE:host_name} %{DATA:app}: \\[%{WORD:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> request blocked by %{NOTSPACE:system} for SIP %{IP:src} SPort %{NUMBER:spt} DIP %{IP:dst} DPort %{NUMBER:dpt} Attack %{GREEDYDATA:attack_details},%{DATA:attack_status} Hostname %{NOTSPACE:host} URI %{NOTSPACE:uri} SessionID %{NOTSPACE:sessionid}",
        "%{TIMESTAMP_ISO8601:time} %{DATA:inter_host} %{DATA:app}: \\[%{WORD:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> %{DATA:host_name}:%{GREEDYDATA:kv_data}",
        "%{TIMESTAMP_ISO8601:time} %{NOTSPACE:host_name} %{DATA:app}: \\[%{WORD:log_type}\\]<%{INT:gslb}> partition-id<%{INT:partition_id}> <%{DATA:dns}> SLB server %{DATA:virtualserver} \\(%{HOSTNAME:host}\\) %{GREEDYDATA}",
        "%{TIMESTAMP_ISO8601:time} %{NOTSPACE:host_name} %{DATA:app}: \\[%{WORD:log_type}\\]<%{INT:gslb}> %{DATA:desc} \\(user: %{DATA:user}\\).",
        "%{TIMESTAMP_ISO8601:time} %{NOTSPACE:host_name} %{DATA:app}: \\[%{WORD:log_type}\\]<%{INT:gslb}> %{GREEDYDATA:desc}"
      ]
    }
    overwrite => ["seq_id", "inter_port", "vlan_id","Script_name", "group","syslog_priority","kv_data","inter_host", "msg_description", "log_type", "system", "dst", "dpt", "src", "spt", "attack_status", "host", "uri", "time", "attack_details", "virtualserver", "timestamp", "method", "tls_version", "desc","xml_data", "host_name", "gslb", "tar_ip", "prin_mac", "status_code", "tar_mac", "user", "tar_port", "partition_id", "dns", "dns_server", "prin_ip", "prin_port", "url", "proto", "sessionid", "httpmethod", "prin_host","app", "cef_extension","version", "device_vendor", "device_product", "device_version", "device_event_class_id", "event_name", "severity", "msg", "process_name"]
    on_error => "grok_failure"
  }

  if [grok_failure] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }
  mutate {
    gsub => ["kv_data","(\\\s+)(\\S+)=", ",$2="]
  }
  kv {
    source => "kv_data"
    field_split => ","
    value_split => "="
    on_error => "kv_data_split_failure"
  }
  if [sourceip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "sourceip"
        "event.idm.read_only_udm.principal.asset.ip" => "sourceip"
      }
      on_error => "sourceip_empty"
    }
    if ![sourceip_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  mutate {
    convert => {
      "bytes_in" => "string"
    }
    on_error => "bytesin_convert_failure"
  }
  if [bytes_in] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{bytes_in}"
      }
      on_error => "bytes_in_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.received_bytes" => "uinteger"
      }
      on_error => "bytes_in_convert_failure"
    }
  }
  mutate {
    convert => {
      "bytes_out" => "string"
    }
    on_error => "bytesout_convert_failure"
  }
  if [bytes_out] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{bytes_out}"
      }
      on_error => "bytes_out_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "bytes_out_convert_failure"
    }
  }
  mutate {
    convert => {
      "pkts_in" => "string"
    }
    on_error => "pktsin_convert_failure"
  }
  if [pkts_in] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_packets" => "%{pkts_in}"
      }
      on_error => "pkts_in_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.received_packets" => "integer"
      }
      on_error => "pkts_in_convert_failure"
    }
  }
  mutate {
    convert => {
      "pkts_out" => "string"
    }
    on_error => "pktsout_convert_failure"
  }
  if [pkts_out] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_packets" => "%{pkts_out}"
      }
      on_error => "pkts_out_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_packets" => "integer"
      }
      on_error => "pkts_out_convert_failure"
    }
  }
  if [bytes_total] != "" {
    mutate {
      replace => {
        "bytes_total_label.key" => "total_bytes"
        "bytes_total_label.value.string_value" => "%{bytes_total}"
      }
      on_error => "bytes_total_empty"
    }
    if ![bytes_total_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "bytes_total_label"
        }
        on_error => "bytes_total_field_missing"
      }
    }
  }
  if [pkts_total] != "" {
    mutate {
      replace => {
        "pkts_total_label.key" => "total_packets"
        "pkts_total_label.value.string_value" => "%{pkts_total}"
      }
      on_error => "pkts_total_empty"
    }
    if ![pkts_total_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "pkts_total_label"
        }
        on_error => "pkts_total_field_missing"
      }
    }
  }
  if [version] != "" {
    grok {
      match => {
        "version" => ["%{DATA:app_proto}/%{GREEDYDATA:httpversion}",
        "%{DATA:cookie_version};\\s+%{GREEDYDATA:cookie_http}"]
      }
      overwrite => ["app_proto", "httpversion", "cookie_version", "cookie_http"]
      on_error => "version_grok_failure"
    }
  }
  if [httpversion] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol_version" => "%{httpversion}"
      }
