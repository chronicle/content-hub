  }

  if [httpmethod] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{httpmethod}"
        "has_http" => "true"
      }
      on_error => "httpmethod_empty"
    }
  }
  if [jdeLoginCookie] not in ["", "null", ";"] {
    mutate {
      replace => {
        "jdeLoginCookie_label.key" => "jdeLoginCookie"
        "jdeLoginCookie_label.value.string_value" => "%{jdeLoginCookie}"
      }
      on_error => "jdeLoginCookie_empty"
    }
    if ![jdeLoginCookie_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "jdeLoginCookie_label"
        }
        on_error => "jdeLoginCookie_label_empty"
      }
    }
  }
  if [Max-Age] != "" {
    mutate {
      replace => {
        "Max-Age_label.key" => "Max-Age"
        "Max-Age_label.value.string_value" => "%{Max-Age}"
      }
      on_error => "Max-Age_empty"
    }
    if ![Max-Age_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Max-Age_label"
        }
        on_error => "Max-Age_label_empty"
      }
    }
  }
  if [SameSite] != "" {
    mutate {
      replace => {
        "SameSite_label.key" => "SameSite"
        "SameSite_label.value.string_value" => "%{SameSite}"
      }
      on_error => "SameSite_empty"
    }
    if ![SameSite_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "SameSite_label"
        }
        on_error => "SameSite_label_empty"
      }
    }
  }
  if [cookie_http] != "" {
    mutate {
      replace => {
        "cookie_http_label.key" => "cookie_http"
        "cookie_http_label.value.string_value" => "%{cookie_http}"
      }
      on_error => "cookie_http_empty"
    }
    if ![cookie_http_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cookie_http_label"
        }
        on_error => "cookie_http_label_empty"
      }
    }
  }
  if [cookie_version] != "" {
    mutate {
      replace => {
        "cookie_version_label.key" => "cookie_version"
        "cookie_version_label.value.string_value" => "%{cookie_version}"
      }
      on_error => "cookie_version_empty"
    }
    if ![cookie_version_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cookie_version_label"
        }
        on_error => "cookie_version_label_empty"
      }
    }
  }

  if [sessionid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{sessionid}"
      }
      on_error => "sessionid_invalid"
    }
  }

  if [status_code] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{status_code}"
      }
      on_error => "status_code_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "not_integer"
    }
  }

  if [tar_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "tar_ip"
        "event.idm.read_only_udm.target.asset.ip" => "tar_ip"
      }
      on_error => "tar_ip_empty"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  if [prin_mac] != "" {
    mutate {
      gsub => ["prin_mac",'\\.','']
    }
    mutate {
      gsub => ["prin_mac", "(.{2})(.{2})(.{2})(.{2})(.{2})(.{2})", "$1:$2:$3:$4:$5:$6"]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "prin_mac"
      }
      on_error => "prin_mac_empty"
    }
  }

  if [tar_mac] != "" {
    mutate {
      gsub => ["tar_mac",'\\.','']
    }
    mutate {
      gsub => ["tar_mac", "(.{2})(.{2})(.{2})(.{2})(.{2})(.{2})", "$1:$2:$3:$4:$5:$6"]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.mac" => "tar_mac"
      }
      on_error => "tar_mac_empty"
    }
  }
  mutate {
    uppercase => ["proto"]
  }
  if [proto] in ["TCP", "ICMP"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{proto}"
      }
      on_error => "proto_empty"
    }
  }
  if [message] =~ "UDP" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "UDP"
      }
      on_error => "proto_empty"
    }
  }

  if [proto] == "HTTP" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTP"
      }
      on_error => "application_protocol_error"
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
      on_error => "url_empty"
    }
  }

  if [host_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host_name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host_name}"
        "has_principal" => "true"
      }
      on_error => "host_name_empty"
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        "has_principal_user" => "true"
      }
      on_error => "user_empty"
    }
  }

  if [prin_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "prin_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "prin_ip"
      }
      on_error => "prin_ip_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [prin_port] != "" {
    mutate {
      rename => {
        "prin_port" => "event.idm.read_only_udm.principal.port"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "prin_port_conversion_failure"
    }
  }

  if [tar_port] != "" {
    mutate {
      rename => {
        "tar_port" => "event.idm.read_only_udm.target.port"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "tar_port_conversion_failure"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and ([app_proto] == "HTTP" or [proto] == "HTTP" or [has_http] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_principal_user] == "true" and ([msg_description] =~ "Login" or [msg_description] =~ "denied" or [msg_description] =~ "failed") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target_user] == "true" and [desc] =~ "logout" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_target_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [dns_server] != "" {
    mutate {
      replace => {
        "dns_server_label.value.string_value" => "%{dns_server}"
      }
      on_error => "dns_server_empty"
    }
    if ![dns_server_empty] {
      mutate {
        replace => {
          "dns_server_label.key" => "dns_server"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "dns_server_label"
        }
        on_error => "dns_server_label_empty"
      }
    }
  }

  if [dns] != "" {
    mutate {
      replace => {
        "dns_label.value.string_value" => "%{dns}"
      }
      on_error => "dns_empty"
    }
    if ![dns_empty] {
      mutate {
        replace => {
          "dns_label.key" => "partition_name"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "dns_label"
        }
        on_error => "dns_label_empty"
      }
    }
  }
  if [Script_name] != "" {
    mutate {
      replace => {
        "script_name_label.key" => "script_name"
        "script_name_label.value.string_value" => "%{Script_name}"
      }
      on_error => "script_name_empty"
    }
    if ![script_name_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "script_name_label"
        }
        on_error => "script_name_label_empty"
      }
    }
  }
  if [len] != "" {
    mutate {
      replace => {
        "len_label.key" => "http cookie header length"
        "len_label.value.string_value" => "%{len}"
      }
      on_error => "len_empty"
    }
    if ![len_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "len_label"
        }
        on_error => "len_label_empty"
      }
    }
  }
  if [seq_id] != "" {
    mutate {
      convert => {
        "seq_id" => "string"
      }
      on_error => "seq_id_conversion_failure"
    }
    mutate {
      replace => {
        "seq_id_label.key" => "seq_id"
        "seq_id_label.value.string_value" => "%{seq_id}"
      }
      on_error => "seq_id_empty"
    }
    if ![seq_id_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "seq_id_label"
        }
        on_error => "seq_id_label_empty"
      }
    }
  }


  if [partition_id] != "" {
    mutate {
      replace => {
        "partion_id_label.value.string_value" => "%{partition_id}"
      }
      on_error => "partion_id_empty"
    }
    if ![partion_id_empty] {
      mutate {
        replace => {
          "partion_id_label.key" => "partition_id"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "partion_id_label"
        }
        on_error => "partion_id_label_empty"
      }
    }
  }

  if [gslb] != "" {
    mutate {
      replace => {
        "gslb_label.value.string_value" => "%{gslb}"
      }
      on_error => "gslb_empty"
    }
    if ![gslb_empty] {
      mutate {
        replace => {
          "gslb_label.key" => "gslb"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "gslb_label"
        }
        on_error => "gslb_label_empty"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
