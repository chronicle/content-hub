  }
  if [attackData_ruleSelectors] not in ["",";"] {
    mutate {
      replace => {
        "attackData_ruleSelectors_label.key" => "AttackData_RuleSelectors"
        "attackData_ruleSelectors_label.value.string_value" => "%{attackData_ruleSelectors}"
      }
      on_error => "no_ruleSelectors"
    }
    if ![no_ruleSelectors] {
