      source => "attackData_rules"
      array_function => "split_columns"
      on_error => "rules_json_failed"
    }
    mutate {
      replace => {
        "rules_list.value" => ""
      }
    }

    for ruleValue in rulesList {
      base64 {
        source => "ruleValue"
        target => "ruleValue"
        on_error => "ruleValue_base64_error"
      }
      if [ruleValue] != "" {
        mutate {
          replace => {
            "rules_label" => ""
          }
        }
        mutate {
          replace => {
            "rules_label.string_value" => "%{ruleValue}"
          }
          on_error => "rules_label_empty"
        }
        mutate {
          merge => {
            "rules_list.value.list_value.values" => "rules_label"
          }
          on_error => "rules_list_empty"
        }
      }
    }

    if [rules_list][value] != "" {
      mutate {
        replace => {
          "rules_list.key" => "Rules"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "rules_list"
        }
        on_error => "no_rules_list"
      }
    }
  }
  mutate {
    replace => {
      "attackData_ruleMessages" => "%{attackData.ruleMessages}"
    }
    on_error => "no_attackData_ruleMessages"
  }
  if [attackData_ruleMessages] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{attackData_ruleMessages}"
      }
      on_error => "no_ruleMessages"
    }
    mutate {
      gsub => ['attackData_ruleMessages',';','\",\"']
    }
    mutate {
      replace => {
        "attackData_ruleMessages" => "{\"ruleMessagesList\":[\"%{attackData_ruleMessages}\"]}"
      }
      on_error => "attackData_ruleMessages_empty"
    }
    json {
      source => "attackData_ruleMessages"
      array_function => "split_columns"
      on_error => "ruleMessages_json_failed"
    }
    mutate {
      replace => {
        "ruleMessages_list.value" => ""
      }
    }

    for ruleMessage in ruleMessagesList {
      base64 {
        source => "ruleMessage"
        target => "ruleMessage"
        on_error => "ruleMessage_base64_failure"
      }
      if [ruleMessage] != "" {
        mutate {
          replace => {
            "ruleMessages_label" => ""
          }
        }
        mutate {
          replace => {
            "ruleMessages_label.string_value" => "%{ruleMessage}"
          }
