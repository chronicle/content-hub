  mutate {
    gsub => ["message", "\\x7f", "" ]
  }
  mutate {
    gsub => ["message", "\\r\\n", "" ]
  }
  mutate {
    gsub => ["message","%3b",";"]
  }
  mutate {
    gsub => ["message","%3d","="]
  }
  json {
    source => "message"
    array_function => "split_columns"
