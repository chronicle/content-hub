        merge => {
          "additional.fields" => "offset_label"
        }
        on_error => "offset_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "last_to_ts" => "string"
    }
    on_error => "no_last_to_ts"
  }
  if [last_to_ts] != "" {
    date {
      match => ["last_to_ts", "UNIX", "UNIX_MS"]
      target => "metadata.collected_timestamp"
      on_error => "date_parse_error"
    }
  }
