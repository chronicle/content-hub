          }
          on_error => "no_vary"
        }
        if ![no_vary] {
          mutate {
            merge => {
              "security_result.detection_fields" => "vary_label"
            }
            on_error => "no_vary_label"
          }
        }
      }

      if [Content-Encoding] != "" {
        mutate {
          replace => {
            "content_encoding.value" => "%{Content-Encoding}"
            "content_encoding.key" => "Content-Encoding"
          }
          on_error => "no_contentencoding"
        }
        if ![no_contentencoding] {
          mutate {
            merge => {
              "security_result.about.resource.attribute.labels" => "content_encoding"
            }
            on_error => "no_content_encoding"
          }
        }
      }
    }
  }

  if [httpMessage][query] != "" {
    mutate {
      replace => {
        "httpMessage_query_label.key" => "Query"
        "httpMessage_query_label.value.string_value" => "%{httpMessage.query}"
      }
      on_error => "no_query"
    }
    if ![no_query] {
      mutate {
        merge => {
          "additional.fields" => "httpMessage_query_label"
        }
        on_error => "no_query_label"
      }
    }
    kv {
      source => "httpMessage.query"
      field_split => "&"
      value_split => "="
      on_error => "kv_failed5"
    }

    if [Cmd] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.command_line" => "%{Cmd}"
        }
        on_error => "no_cmd"
      }
    }

    if [User] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{User}"
        }
        on_error => "no_user"
      }
    }

    if [DeviceId] != "" {
      mutate {
        replace => {
          "principal.resource.resource_type" => "DEVICE"
          "principal.resource.product_object_id" => "%{DeviceId}"
        }
        on_error => "no_device_id"
      }
    }

    if [DeviceType] != "" {
      mutate {
        replace => {
          "principal.resource.name" => "%{DeviceType}"
          "principal.resource.resource_type" => "DEVICE"
        }
        on_error => "no_device_type"
      }
    }

  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "invalid_security_result"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "invalid_event_type"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "AKAMAI_SIEM_CONNECTOR"
      "metadata.product_name" => "AKAMAI_SIEM_CONNECTOR"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }


  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

