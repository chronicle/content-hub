          }
          on_error => "no_ruleMessages_list"
        }
    }
  }
  mutate {
    replace => {
      "attackData_ruleActions" => "%{attackData.ruleActions}"
    }
    on_error => "no_attackData_ruleActions"
  }
  if [attackData_ruleActions] != "" {
    if [attackData_ruleActions] in ["YWxlcnQ%3d%3b", "YWxlcnQ=;", "monitor;monitor;", "monitor;"] {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
      }
    }
    else if [attackData_ruleActions] in ["ZGVueV9jdXN0b21fMTQ2NTQw", "ZGVueQ=="] {
      mutate {
        replace => {
          "security_result_action" => "BLOCK"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result_action" => "UNKNOWN_ACTION"
        }
      }
    }
    if [security_result_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
        on_error => "no_security_result_action"
      }
    }
    if [attackData_ruleActions] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{attackData_ruleActions}"
        }
        on_error => "no_ruleActions"
      }
