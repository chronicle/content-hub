        "attackData_label.key" => "AttackData"
        "attackData_label.value" => "%{attackData_rules}"
      }
      on_error => "no_attackData"
    }
    if ![no_attackData] {
      mutate {
        merge => {
          "security_result.detection_fields" => "attackData_label"
        }
        on_error => "no_attackData_label"
      }
