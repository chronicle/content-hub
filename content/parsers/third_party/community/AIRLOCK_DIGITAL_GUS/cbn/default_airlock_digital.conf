# Product: Airlock Digital
# Category: Application Whitelisting
# Supported Format: SYSLOG,JSON
# Reference: N/A
# Last Updated: 2026-07-17
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "metadata_event_type" => "GENERIC_EVENT"
      "ingestion_time" => ""
      "event_timestamp" => ""
      "intermediary_hostname" => ""
      "intermediary" => ""
      "principal_hostname" => ""
      "principal_user_userid" => ""
      "process_file_path" => ""
      "process_file_name" => ""
      "file_sha256" => ""
      "file_md5" => ""
      "file_sha128" => ""
      "asset_category" => ""
      "publisher" => ""
      "source_file" => ""
      "product_event_type" => ""
      "security_result" => ""
      "parent_process_file" => ""
      "metadata_description" => ""
      "event_type" => ""
      "checkpoint" => ""
      "task" => ""
      "user" => ""
      "description" => ""
      "instanceurl" => ""
      "srcip" => ""
      "browser" => ""
      "InstanceURL" => ""
      "username" => ""
      "hostname" => ""
      "netdomain" => ""
      "filename" => ""
      "ppolicy" => ""
      "policyname" => ""
      "policyver" => ""
      "commandline" => ""
      "pprocess" => ""
      "sha256" => ""
      "datetime" => ""
      "md5" => ""
      "sha128" => ""
      "sha384" => ""
      "sha512" => ""
      "type" => ""
      "has_target_file" => "false"
      "has_principal" => "false"
      "auth_type" => ""
      "log_type" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_failure"
  }

  grok {
    match => {
      "message" => [
        "<%{INT}> %{TIMESTAMP_ISO8601:ingestion_time} %{DATA:intermediary_hostname} (?P<source_file>.*?):\\s+%{WORD:event_type}\\|%{TIMESTAMP_ISO8601:event_timestamp}\\|%{DATA:principal_hostname}\\|%{DATA:principal_user_userid}\\|(?P<process_file_path>.*?)\\|%{DATA:process_file_name}\\|%{DATA:file_sha256}\\|%{DATA:file_md5}\\|%{DATA:file_sha128}\\|(?P<publisher>.*?)\\|(?P<Parent_Group>.*?)\\|(?P<asset_category>.*?)\\|(?P<product_event_type>.*?)\\|(?P<parent_process_file>.*?)\\|"
        "<%{INT}> %{TIMESTAMP_ISO8601:ingestion_time} %{DATA:intermediary_hostname} (?P<source_file>.*?):\\s+%{WORD:event_type}\\|%{TIMESTAMP_ISO8601:event_timestamp}\\|(?P<product_event_type>.*?)\\|(?P<principal_user_userid>.*?)\\|(?P<metadata_description>.*)"
        "%{TIMESTAMP_ISO8601:ingestion_time} %{DATA:intermediary_hostname} (?P<source_file>.*?):\\s+%{WORD:event_type}\\|%{TIMESTAMP_ISO8601:event_timestamp}\\|%{DATA:principal_hostname}\\|%{DATA:principal_user_userid}\\|(?P<process_file_path>.*?)\\|%{DATA:process_file_name}\\|%{DATA:file_sha256}\\|%{DATA:file_md5}\\|%{DATA:file_sha128}\\|(?P<publisher>.*?)\\|(?P<Parent_Group>.*?)\\|(?P<asset_category>.*?)\\|(?P<product_event_type>.*?)\\|(?P<parent_process_file>.*?)\\|"
      ]
    }
    overwrite => ["ingestion_time", "intermediary_hostname", "source_file", "event_timestamp", "principal_hostname", "principal_user_userid", "process_file_path", "process_file_name", "file_sha256", "file_sha128", "file_md5", "publisher", "asset_category", "product_event_type", "parent_process_file", "metadata_description", "event_type"]
    on_error => "grok_parse_failure"
  }

  if [grok_parse_failure] and [json_parse_failure] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [ingestion_time] != "" {
    date {
      match => ["ingestion_time","RFC3339"]
      target => "event.idm.read_only_udm.metadata.ingested_timestamp"
    }
  }

  if [datetime] != "" {
    date {
      match => ["datetime", "ISO8601", "RFC3339", "yyyy-MM-ddTHH:mm:ss.SSSSSSZ"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_datetime"
    }
  }
  if [log_type] != "" {
    mutate {
      replace => {
        "log_type_label.key" => "log_type"
        "log_type_label.value.string_value" => "%{log_type}"
      }
      on_error => "invalid_log_type"
    }
    if ![invalid_log_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "log_type_label"
        }
        on_error => "invalid_log_type"
      }
    }
  }
  if [event_timestamp] != "" {
    date {
      match => ["event_timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
    }
  }

  if [principal_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{principal_hostname}"
      }
    }
  }

  if [principal_user_userid] != "" {
    if [event_type] =~ "ServerActivityMessage" and [product_event_type] =~ "(?i)Login" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{principal_user_userid}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{principal_user_userid}"
        }
      }
    }
  }

  if [source_file] != "" {
    grok {
      match => {
        "source_file" => "%{DATA:source_file_name}\\[\\d+\\]"
      }
      on_error => "invalid_soruce_file"
    }
    if ![invalid_soruce_file] {
      mutate {
        replace => {
          "event.idm.read_only_udm.src.file.full_path" => "%{source_file_name}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.src.file.full_path" => "%{source_file}"
        }
      }
    }
  }

  if [process_file_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{process_file_path}"
      }
    }
  }

  if [process_file_name] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.process.file.names" => "process_file_name"
      }
    }
  }

  if [file_sha256] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.sha256" => "%{file_sha256}"
      }
    }
  }

  if [file_md5] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.md5" => "%{file_md5}"
      }
    }
  }

  if [parent_process_file] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.parent_process.file.full_path" => "%{parent_process_file}"
      }
    }
  }

  if [publisher] != "" {
    mutate {
      replace => {
        "software.vendor_name" => "%{publisher}"
      }
      merge => {
        "event.idm.read_only_udm.principal.asset.software" => "software"
      }
    }
  }

  if [asset_category] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.category" => "%{asset_category}"
      }
    }
  }

  if [intermediary_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_hostname}"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [file_sha128] != "" {
    mutate {
      replace => {
        "file_sha128_label.key" => "SHA128"
        "file_sha128_label.value" => "%{file_sha128}"
      }
      merge => {
        "security_result.detection_fields" => "file_sha128_label"
      }
    }
  }

  if [description] != "" {
    grok {
      match => {
        "description" => [
          "%{DATA:auth_type} User: %{DATA:user} logged in %{DATA} from %{IP:srcip} via %{DATA} using %{GREEDYDATA:browser}",
          "from %{IP:srcip} using %{WORD:browser}"
        ]
      }
      overwrite => ["srcip", "browser", "user", "auth_type"]
      on_error => "invalid_description"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "invalid_description"
    }
  }

  if [srcip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "srcip"
        "event.idm.read_only_udm.principal.asset.ip" => "srcip"
      }
      on_error => "invalid_srcip"
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{user}"
      }
      on_error => "invalid_user"
    }
  }

  if [browser] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{browser}"
      }
      on_error => "invalid_browser"
    }
  }

  if [InstanceURL] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{InstanceURL}"
      }
      on_error => "invalid_instanceURL"
    }
  }

  if [event_type] != "" and [product_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_type} - %{product_event_type}"
      }
    }
  }

  if [metadata_description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{metadata_description}"
      }
    }
  }

  if [checkpoint] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{checkpoint}"
      }
      on_error => "invalid_checkpoint"
    }
  }

  if [metadata_description] =~ "logged in success" or [description] =~ "logged in successfully" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
      merge => {
        "security_result.action" => "security_result_action"
      }
    }
  }
  else if [description] =~ "Invalid login attempt" {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
      merge => {
        "security_result.action" => "security_result_action"
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "invalid_hostname"
    }
  }

  if [netdomain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.administrative_domain" => "%{netdomain}"
      }
      on_error => "invalid_netdomain"
    }
  }

  if [pprocess] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{filename}"
      }
      on_error => "invalid_filename"
    }
  }

  if [ppolicy] != "" {
    mutate {
      replace => {
        "ppolicy_label.value" => "%{ppolicy}"
        "ppolicy_label.key" => "ppolicy"
      }
      on_error => "invalid_ppolicy"
    }
    if ![invalid_ppolicy] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ppolicy_label"
        }
        on_error => "invalid_ppolicy"
      }
    }
  }

  if [policyname] != "" {
    mutate {
      replace => {
        "policyname_label.value" => "%{policyname}"
        "policyname_label.key" => "policyname"
      }
      on_error => "invalid_policyname"
    }
    if ![invalid_policyname] {
      mutate {
        merge => {
          "security_result.detection_fields" => "policyname_label"
        }
        on_error => "invalid_policyname"
      }
    }
  }

  if [policyver] != "" {
    mutate {
      replace => {
        "policyver_label.value" => "%{policyver}"
        "policyver_label.key" => "policyver"
      }
      on_error => "invalid_policyver"
    }
    if ![invalid_policyver] {
      mutate {
        merge => {
          "security_result.detection_fields" => "policyver_label"
        }
        on_error => "invalid_policyver"
      }
    }
  }

  if [sha128] != "" {
    mutate {
      replace => {
        "sha128_label.value" => "%{sha128}"
        "sha128_label.key" => "sha128"
      }
      on_error => "invalid_sha128"
    }
    if ![invalid_sha128] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sha128_label"
        }
        on_error => "invalid_sha128"
      }
    }
  }

  if [sha384] != "" {
    mutate {
      replace => {
        "sha384_label.value" => "%{sha384}"
        "sha384_label.key" => "sha384"
      }
      on_error => "invalid_sha384"
    }
    if ![invalid_sha384] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sha384_label"
        }
        on_error => "invalid_sha384"
      }
    }
  }

  if [sha512] != "" {
    mutate {
      replace => {
        "sha512_label.value" => "%{sha512}"
        "sha512_label.key" => "sha512"
      }
      on_error => "invalid_sha512"
    }
    if ![invalid_sha512] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sha512_label"
        }
        on_error => "invalid_sha512"
      }
    }
  }

  if [type] != "" {
    mutate {
      convert => {
        "type" => "string"
      }
      on_error => "invalid_type"
    }
    mutate {
      replace => {
        "type_label.value" => "%{type}"
        "type_label.key" => "type"
      }
      on_error => "invalid_type"
    }
    if ![invalid_type] {
      mutate {
        merge => {
          "security_result.detection_fields" => "type_label"
        }
        on_error => "invalid_type"
      }
    }
  }

  if [commandline] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{commandline}"
      }
      on_error => "invalid_commandline"
    }
  }

  if [filename] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{filename}"
        "has_target_file" => "true"
      }
      on_error => "invalid_filename"
    }
  }

  if [sha256] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{sha256}"
        "has_target_file" => "true"
      }
      on_error => "invalid_sha256"
    }
  }
  if [task] =~ "Login" and [auth_type] == "SSO" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "SSO"
      }
    }
  }
  else if [task] =~ "Login" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
      }
    }
  }
  else if [task] =~ "Logout" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
      }
    }
  }
  else if [has_principal] == "true" and [has_target_file] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }
  else if [event_type] == "FileActivityMessage" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [event_type] == "ServerActivityMessage" {
    if [product_event_type] =~ "(?i)Login" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Airlock Digital"
      "event.idm.read_only_udm.metadata.vendor_name" => "Airlock Digital"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
