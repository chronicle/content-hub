# Product: Google SafeBrowsing
# Category: IOC
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2020-05-06
# Copyright 2021 Chronicle LLC


filter {
  mutate {
    replace => {
      "ip" => "",
      "domain" => "",
      "path" => "",
      "blacklist" => "",
      "start" => "",
      "end" => "",
    }
  }

  grok {
    match => {
      "message" => [
        "\".*?(?:%{IP:ip}|%{HOSTNAME:domain})</>(?P<path>[^\"]*)\",\"(?:%{TIMESTAMP_ISO8601:start}?Z|)\",\"(?:%{TIMESTAMP_ISO8601:end}?Z|)\""
      ],
    }
    overwrite => ["ip", "domain", "path", "start", "end"]
  }

  if [path] != "" {
    drop {} # for now, only include entries that correspond to entire domains/IPs.
  }

  if [domain] != "" {
    mutate {
      rename => {
        "domain" => "event.ioc.domain_and_ports.domain"
      }
    }
  }

  if [ip] != "" {
    mutate {
      convert => {
        "ip" => "ipaddress"
      }
    }
    mutate {
      rename => {
        "ip" => "event.ioc.ip_and_ports.ip_address"
      }
    }
  }

  mutate {
    replace => {
      "blacklist" => "%{@filename}"
    }    
  }

  # Translate internal blacklist names into more meaningful descriptions.

  if [blacklist] == "badurls_malware_landing" || [blacklist] == "badips_mobile_distribution" || [blacklist] == "badips_web_malware_distribution" {
    mutate {
      replace => {
        "categorization" => "MALWARE"
      }
    }
  } else if [blacklist] == "badurls_pup_distribution" || [blacklist] == "badurls_bineval_distribution" || [blacklist] == "badips_binary_distribution_combined" {
    mutate {
      replace => {
        "categorization" => "HARMFUL_DOWNLOADS"
      }
    }
  } else if [blacklist] == "badurls_pup_landing" || [blacklist] == "badurls_bineval_landing" || [blacklist] == "badips_binary_landing_combined" {
    mutate {
      replace => {
        "categorization" => "LINKS_TO_HARMFUL_DOWNLOADS"
      }
    }
  } else if [blacklist] == "badurls_phishing_landing" || [blacklist] == "badurls_mobile_phishing_landing" || [blacklist] == "badurls_social_engineering_landing" || [blacklist] == "badurls_mobile_social_engineering_landing" {
    mutate {
      replace => {
        "categorization" => "DECEPTIVE_CONTENT"
      }
    }
  } else {
    drop {}  # Other blacklists not currently supported.
  }

  # Populate active timerange
  if [start] != "" {
    date {
      match => [ "start", "yyyy-MM-ddTHH:mm:ss"]
      target => "start_ts"
    }
    
    mutate {
      rename => {
        "start_ts" => "event.ioc.active_timerange.start"        
      }
    }
  }

  if [end] != "" {
    date {
      match => [ "end", "yyyy-MM-ddTHH:mm:ss"]
      target => "end_ts"
    }

    mutate {
      rename => {
        "end_ts" => "event.ioc.active_timerange.end"    
      }
    }
  }

  mutate {
    rename => {
      "categorization" => "event.ioc.categorization"
    }
  }

  mutate {
    replace => {
      "event.ioc.feed_name" => "Google SafeBrowsing"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
