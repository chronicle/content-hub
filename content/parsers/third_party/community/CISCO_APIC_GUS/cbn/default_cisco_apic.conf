# Product: CISCO APIC
# Category: Software-defined Networking (SDN)
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2024-11-28
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "ts" => ""
      "host" => ""
      "desc" => ""
      "prin_ip" => ""
      "mac" => ""
      "lifecycle_state" => ""
      "fault_cause" => ""
      "severity_detail" => ""
      "event_type" => ""
      "principal_mid_present" => "false"
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
    }
  }

  grok {
    match => {
       "message" => [
          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA} \\[%{DATA}\\]\\[%{DATA:lifecycle_state}\\]\\[%{DATA:fault_cause}\\]\\[%{DATA:severity_detail}\\]\\[%{DATA}/%{DATA}-%{MAC:mac}/ip-\\[%{IP:prin_ip}\\]/%{DATA}\\] %{GREEDYDATA:desc}"
          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA} \\[%{DATA}\\]\\[%{DATA:lifecycle_state}\\]\\[%{DATA:fault_cause}\\]\\[%{DATA:severity_details}\\]\\[%{DATA}\\] %{GREEDYDATA:desc}"
          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA} \\[%{DATA}\\]\\[%{DATA:lifecycle_state}\\]\\[%{DATA:severity_details}\\]\\[%{DATA}\\]\\]%{GREEDYDATA:desc}"
          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA} \\[%{DATA}\\]\\[%{DATA:lifecycle_state}\\]\\[%{DATA:severity_details}\\]\\[%{DATA}\\]-%{IP:prin_ip}\\] %{GREEDYDATA:desc}"
        ]
    }
    overwrite => ["ts", "host" , "desc" , "prin_ip" , "mac", "lifecycle_state", "fault_cause", "severity_detail"]
    on_error  => "header_grok_match_failed"
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [ts] != "" {
    date {
      match => ["ts", "ISO8601", "MMM dd HH:mm:ss"]
      rebase => true
      on_error => "date_match_failed"
    }
  }
  if [prin_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "prin_ip"
        "principal.asset.ip" => "prin_ip"
      }
      on_error => "prin_ip_value_invalid"
    }
    mutate {
      replace => {
        "principal_mid_present" => "true"
      }
    }
  }
  if [mac] != "" {
    mutate {
      merge => {
        "principal.mac" => "mac"
      }
      on_error => "mac_value_invalid"
    }
    mutate {
      replace => {
        "principal_mid_present" => "true"
      }
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "principal_mid_present" => "true"
      }
      on_error => "host_value_invalid"
    }
  }
  if [desc] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{desc}"
      }
      on_error => "desc_value_invalid"
    }
  }
  if [severity_detail] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{severity_detail}"
      }
      on_error => "severity_detail_value_invalid"
    }
  }
  if [lifecycle_state] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{lifecycle_state}"
      }
      on_error => "lifecycle_state_value_invalid"
    }
  }
  if [fault_cause] != "" {
    mutate {
      replace => {
        "fault_cause_label.key" => "fault_cause"
        "fault_cause_label.value.string_value" => "%{fault_cause}"
      }
      on_error => "fault_cause_value_invalid"
    }
    if ![fault_cause_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "fault_cause_label"
        }
        on_error => "fault_cause_label_value_invalid"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "CISCO"
      "metadata.product_name" => "CISCO APIC"
    }
  }

  if [event_type] == "" {
    if [principal_mid_present] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_value_invalid"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
