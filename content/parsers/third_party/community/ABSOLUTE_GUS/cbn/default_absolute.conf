# Product: Absolute
# Category: Mobile Device Management
# Supported Format: SYSLOG + KV (CEF)
# Reference: N/A
# Last Updated: 2024-12-03
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "intermediary" => ""
      "security_result" => ""
      "about" => ""
      "event_type" => ""
      "actorType" => ""
      "actorName" => ""
      "actorID" => ""
      "objectType" => ""
      "objectName" => ""
      "objectID" => ""
      "cef" => ""
      "kv_pair" => ""
      "dvc_ip" => ""
      "hostname" => ""
      "pid" => ""
      "event_class" => ""
      "type" => ""
      "ts" => ""
      "priority_code" => ""
      "device_vendor" => ""
      "device_product" => ""
      "device_version" => ""
      "eventType" => ""
      "verb" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "(<%{INT:priority_code}>%{SYSLOGTIMESTAMP:ts} %{IP:dvc_ip}  )?\"%{DATA:datetime}\" %{DATA:hostname} AbsoluteSIEMConnector %{DATA:pid} %{DATA:event_class} - CEF: %{INT:version} \"%{DATA:device_vendor}\" %{DATA:device_product} %{DATA:device_version} %{GREEDYDATA:cef}"
        "<%{INT:priority_code}>%{INT:type} %{TIMESTAMP_ISO8601:date} %{HOSTNAME:hostname} %{GREEDYDATA:kv_pair}"
      ]
    }
    overwrite => ["cef","kv_pair", "dvc_ip", "hostname", "pid", "event_class", "type", "ts", "priority_code", "device_vendor", "device_product", "device_version"]
  }

  if [kv_pair] != "" {
    mutate {
      replace => {
         "event_type" => "STATUS_HEARTBEAT"
      }
    }
    date {
      match => [ "Alert Time", "RFC3339"]
      target => "metadata.event_timestamp"
      on_error => "not_valid"
    }
    if [not_valid] {
      date {
        match => [ "date", "RFC3339"]
        target => "metadata.event_timestamp"
        on_error => "not_valid"
      }
    }

    kv {
      source => "kv_pair"
      field_split => ","
      value_split => ":"
      trim_value  => ""
    }

    mutate {
      replace => {
        "security_result.threat_id" => "%{Alert ID}"
      }
      on_error => "no_alert_id"
    }

    mutate {
      replace => {
        "security_result.threat_name" => "%{Alert Name}"
      }
      on_error => "no_alert_name"
    }

    mutate {
      replace => {
        "security_result.description"  => "%{Condition}"
      }
      on_error => "no_condition"
    }

    mutate {
      replace => {
        "principal.hostname" => "%{Computer Name}"
      }
      on_error => "no_computer_name"
    }

    mutate {
      replace => {
        "principal.asset.asset_id" => "serialNumber:%{Serial Number}"
      }
    }

    if [kv_pair] =~ "ESN" {
      grok {
        match => {
          "kv_pair" => "ESN: %{DATA:ESN},%{GREEDYDATA}"
        }
      }
      mutate {
        replace => {
          "esn_label.value" => "%{ESN}"
        }
        on_error => "no_esn"
      }
      if ![no_esn] {
        mutate {
          replace => {
            "esn_label.key" => "ESN"
          }
          merge => {
            "security_result.detection_fields" => "esn_label"
          }
          on_error => "no_esn"
        }
      }
    }
  }

  if [cef] != "" {

    kv {
      source => "cef"
      field_split => " "
      value_split => "="
      trim_value  => '\"'
    }

    date {
      match => ["date","yyyy-MM-dd HH:mm:ss UTC"]
      target => "metadata.event_timestamp"
      on_error => "not_valid"
    }
    if [eventType] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{eventType}"
        }
      }
    }
    else if [event_class] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{event_class}"
        }
      }
    }

    if [objectProperties] != "" {
      kv {
        source => "objectProperties"
        field_split => ";"
        value_split => "="
        trim_value  => '\"'
        target=> "objectPropertieskvdata"
      }
      for key, value in objectPropertieskvdata map {
        mutate {
          replace => {
            "field_" => ""
          }
        }
        mutate {
          replace => {
            "check_" => "%{value}"
          }
          on_error => "value_not_exists"
        }
        if ![value_not_exists] and [value] != "" {
          mutate {
            replace => {
              "field_.value" => "%{value}"
            }
            on_error => "value_not_exists"
          }
          mutate {
            replace => {
              "field_.key" => "%{key}"
            }
            on_error => "key_not_exists"
          }
          mutate {
            merge => {
              "target.resource.attribute.labels" => "field_"
            }
            on_error => "merge_failed"
          }
        }
      }
    }

    if [objectName] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{objectName}"
        }
      }
    }
    if [actorType] == "User" && [actorName] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{actorName}"
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    if [actorID] != "" {
      mutate {
        replace => {
          "principal.user.product_object_id" => "%{actorID}"
        }
      }
    }
    if [actorType] != "" {
      mutate {
        replace => {
          "roles.name" => "%{actorType}"
        }
        merge => {
          "principal.user.attribute.roles" => "roles"
        }
        on_error => "actor_type_not_found"
      }
    }
    if [actorType] == "Device" && [actorName] != "" {
      mutate {
        replace => {
          "event_type" => "STATUS_HEARTBEAT"
          "principal.hostname" => "%{actorName}"
        }
      }
    }
    if [objectType] != "" and [objectType] == "Device" {
      mutate {
        uppercase => ["objectType"]
      }
      mutate {
        replace => {
          "principal.resource.resource_type" => "%{objectType}"
        }
      }
    }
    if [objectID] != "" {
      mutate {
        replace => {
          "principal.resource.product_object_id" => "%{objectID}"
        }
      }
    }
    if [verb] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{verb}"
        }
      }
    }
  }

  # Common data mappings
  mutate {
    replace => {
      "intermediary.hostname" => "%{hostname}"
    }
    on_error => "no_hostname"
  }
  if [dvc_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "dvc_ip"
      }
      on_error => "no_dvc_ip"
    }
  }
  if [device_version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{device_version}"
      }
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "about.process.pid" => "%{pid}"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "ABSOLUTE"
      "metadata.product_name" => "ABSOLUTE_PLATFORM"
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "merge_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
