# Product: Ingrian Networks DataSecure Appliance
# Category: System and Audit Logs
# Supported Format: Syslog
# Last Updated: 2024-10-31
# Copyright 2023 Chronicle LLC

filter {

  mutate {
    replace => {
      "principal_token" => ""
      "network_token" => ""
      "additional_token" => ""
      "target_token" => ""
      "metadata_token" => ""
      "security_result_token" => ""
      "extension_token" => ""
      "collected_timestamp" => ""
      "date" => ""
      "time" => ""
      "hostname" => ""
      "product_event_type" => ""
      "protocol" => ""
      "description" => ""
      "target_ip" => ""
      "log_type" => ""
      "status" => ""
      "seconds" => ""
      "login_description" => ""
      "sync_details" => ""
      "principal_ip" => ""
      "principal_port" => ""
      "username" => ""
      "protocol_details" => ""
      "event_type_details" => ""
      "severity" => ""
      "session_id" => ""
      "action_details" => ""
      "http_method" => ""
      "request_url" => ""
      "dst_ip" => ""
      "user_agent" => ""
      "referrer_url" => ""
      "http_status_code" => ""
      "sc_substatus" => ""
      "sc_win32_status" => ""
      "time_taken" => ""
    }
  }

  mutate {
    replace => {
      "metadata_token.product_name" => "DataSecure Appliance"
      "metadata_token.vendor_name" => "Ingrian Networks"
    }
  }

  grok {
    match => {
      "message" => [
        "<%{DATA:log_priority}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s%{DATA:hostname}\\s%{DATA:product_event_type}:\\s%{DATA:date}\\s%{DATA:time}\\s%{DATA}\\s%{DATA:protocol}:\\s%{DATA:description}:\\s%{DATA:sync_details} using server %{IPV4:target_ip}",
        "<%{DATA:log_priority}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s%{DATA:hostname}\\s%{DATA:product_event_type}:\\s%{DATA:date}\\s%{DATA:time}\\s%{DATA}\\s%{DATA:description}:\\s%{DATA:status} rotated %{GREEDYDATA:log_type}",
        "<%{DATA:log_priority}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s%{DATA:hostname}\\s%{DATA:product_event_type}:\\s%{DATA:date}\\s%{DATA:time}\\s\\[%{DATA:username}\\]\\s\\[%{DATA:event_type_details}\\]\\s\\[%{DATA:protocol}\\]:\\s%{DATA:login_description}\\sfrom\\s%{IPV4:principal_ip}(\\sport\\s%{DATA:principal_port}\\s%{GREEDYDATA:protocol_details})?"
        "%{SYSLOGTIMESTAMP:collected_timestamp}\\s%{DATA:hostname}\\s+%{DATA:product_event_type}:\\s+\\[%{DATA:date}\\s%{DATA:time}\\]\\s+%{DATA:severity}\\s+%{IP:principal_ip}\\s+%{DATA}\\s+%{DATA:username}\\s+%{INT:session_id}\\s+%{DATA:description}-\\s+\\[%{DATA:action_details}\\]%{GREEDYDATA}"
        "%{SYSLOGTIMESTAMP:collected_timestamp}\\s%{DATA:hostname}\\s+%{TIMESTAMP_ISO8601}\\s+%{IP:principal_ip}\\s+%{DATA:http_method}\\s+%{DATA:request_url}\\s+%{IP:dst_ip}\\s+%{DATA:user_agent}\\s+%{DATA:referrer_url}\\s+%{NONNEGINT:http_status_code}\\s+%{NONNEGINT:sc_substatus}\\s+%{NONNEGINT:sc_win32_status}\\s+%{NONNEGINT:time_taken}"
        "%{SYSLOGTIMESTAMP:collected_timestamp}\\s%{DATA:hostname}\\s+%{DATA:product_event_type}:\\s+\\[%{DATA:date}\\s%{DATA:time}\\]\\s+%{DATA:severity}\\s+%{IP:principal_ip}\\s+%{DATA}\\s+%{DATA:username}\\s+%{INT:session_id}\\s+%{DATA:description}\\s+\\[%{DATA:action_details}\\]%{GREEDYDATA}"
        "%{SYSLOGTIMESTAMP:collected_timestamp}\\s%{DATA:hostname}\\s+%{DATA:product_event_type}:\\s+%{DATA:date}\\s%{DATA:time}\\s+%{DATA}:%{GREEDYDATA:description}"
      ]
    }
    overwrite => ["collected_timestamp", "date", "time", "hostname", "product_event_type", "protocol", "description", "target_ip", "event_type_details", "metadata_token", "principal_token", "network_token", "additional_token", "target_token", "log_type", "status", "login_description", "sync_details", "principal_ip", "principal_port", "username", "protocol_details","severity", "session_id", "action_details","http_method", "request_url", "dst_ip", "user_agent", "referrer_url", "http_status_code", "sc_substatus", "sc_win32_status", "time_taken"]
    on_error => "grok_error"
  }

  if ![grok_error] {

    if [collected_timestamp] != "" {
      date {
        match => ["collected_timestamp", "MMM d HH:mm:ss"]
        rebase => true
        target => "metadata_token.collected_timestamp"
        on_error => "collected_timestamp_error"
      }
    }
    if [severity] == "INFO" {
      mutate {
        replace => {
          "security_result_token.severity" => "INFORMATIONAL"
        }
      }
    }
    if [dst_ip] != "" {
      grok {
        match => {
          "dst_ip" => "%{IPV4:dst_ip}"
        }
        on_error => "dst_ip_error"
        overwrite => ["dst_ip"]
      }
      if ![dst_ip_error] {
        mutate {
          merge => {
            "target_token.ip" => "dst_ip"
            "target_token.asset.ip" => "dst_ip"
          }
          on_error => "source_value_invalid"
        }
      }
    }
    if [http_method] != "" {
      mutate {
        replace => {
          "network_token.http.method" => "%{http_method}"
        }
        on_error => "http_method_error"
      }
    }
    if [user_agent] != "" {
      mutate {
        replace => {
          "network_token.http.user_agent" => "%{user_agent}"
        }
        on_error => "user_agent_error"
      }
      mutate {
        replace => {
          "network_token.http.parsed_user_agent" => "%{user_agent}"
        }
        on_error => "parsed_user_agent_error"
      }
      mutate {
        convert => {
          "network_token.http.parsed_user_agent" => "parseduseragent"
        }
        on_error => "parsed_user_agent_convert_error"
      }
      if [referrer_url] != "" {
        mutate {
          replace => {
            "network_token.http.referral_url" => "%{referrer_url}"
          }
          on_error => "referrer_url_error"
        }
      }
      if [http_status_code] != "" {
        mutate {
          replace => {
            "network_token.http.response_code" => "%{http_status_code}"
          }
          convert => {
            "network_token.http.response_code" => "integer"
          }
          on_error => "not_integer"
        }
      }
    }
    if [sc_substatus] != "" {
      mutate {
        replace => {
          "sc_substatus_label.key" => "sc_substatus"
          "sc_substatus_label.value.string_value" => "%{sc_substatus}"
        }
        on_error => "no_sc_substatus"
      }
      if ![no_sc_substatus] != "" {
        mutate {
          merge => {
            "additional_token.fields" => "sc_substatus_label"
          }
          on_error => "no_sc_substatus_not_found"
        }
      }
    }
    if [request_url] != "" {
      mutate {
        replace => {
          "target_token.url" => "%{request_url}"
        }
        on_error => "request_url_error"
      }
    }
    if [session_id] != "" {
      mutate {
        replace => {
          "network_token.session_id" => "%{session_id}"
        }
        on_error => "session_id_error"
      }
    }
    if [action_details] != "" {
      mutate {
        replace => {
          "security_result_token.action_details" => "%{action_details}"
        }
        on_error => "action_details_error"
      }
    }

    if [date] != "" and [time] != "" {
      mutate {
        replace => {
          "date_time" => "%{date} %{time}"
        }
      }

      date {
        match => ["date_time", "yyyy-M-d HH:mm:ss"]
        on_error => "event_timestamp_error"
      }
    }

    if [hostname] != "" {
      mutate {
        replace => {
          "principal_token.hostname" => "%{hostname}"
          "principal_token.asset.hostname" => "%{hostname}"
        }
        on_error => "hostname_error"
      }
    }

    if [product_event_type] != "" {
      mutate {
        replace => {
          "metadata_token.product_event_type" => "%{product_event_type}"
        }
        on_error => "product_event_type_error"
      }
    }

    if [protocol] != "" {
      if [protocol] =~ "SSHD" {
        mutate {
          replace => {
            "network_token.application_protocol" => "SSH"
          }
        }
      } else if[protocol] =~ "NTP" {
        mutate {
          replace => {
            "network_token.application_protocol" => "NTP"
          }
        }
      }
    }

    if [description] != "" {
      mutate {
        replace => {
          "metadata_token.description" => "%{description}"
        }
        on_error => "description_error"
      }
    }

    if [target_ip] != "" {
      grok {
        match => {
          "target_ip" => "%{IP:target_ip}"
        }
        on_error => "target_ip_error"
        overwrite => ["target_ip"]
      }
      if ![target_ip_error] {
        mutate {
          merge => {
            "target_token.ip" => "target_ip"
            "target_token.asset.ip" => "target_ip"
          }
          on_error => "target_ip_error"
        }
      }
    }

    if [status] != "" {
      mutate {
        convert => {
          "status" => "string"
        }
        on_error => "status_conversion_error"
      }

      mutate {
        replace => {
          "status_label.value.string_value" => "%{status}"
        }
        on_error => "status_not_found"
      }

      if ![status_not_found] and [status_label][value] != "" {
        mutate {
          replace => {
            "status_label.key" => "log_rotation_status"
          }
        }
        mutate {
          merge => {
            "additional_token.fields" => "status_label"
          }
        }
      }
    }

    if [log_type] != "" {
      mutate {
        gsub => ["log_type", "\\.", ""]
      }

      mutate {
        convert => {
          "log_type" => "string"
        }
        on_error => "log_type_conversion_error"
      }

      mutate {
        replace => {
          "log_type_label.value.string_value" => "%{log_type}"
        }
        on_error => "log_type_not_found"
      }

      if ![log_type_not_found] and [log_type_label][value] != "" {
        mutate {
          replace => {
            "log_type_label.key" => "log_rotation_type"
          }
        }
        mutate {
          merge => {
            "additional_token.fields" => "log_type_label"
          }
        }
      }
    }

    if [sync_details] != "" {
      grok {
        match => {
          "sync_details" =>
          "%{DATA:status}\\sslewed time by\\s%{GREEDYDATA:seconds}"
        }
        overwrite => ["status", "seconds"]
        on_error => "sync_details_error"
      }

      if ![sync_details_error] {
        mutate {
          convert => {
            "status" => "string"
          }
          on_error => "status_conversion_error"
        }

        mutate {
          replace => {
            "status_label.value.string_value" => "%{status}"
          }
          on_error => "status_not_found"
        }

        if ![status_not_found] and [status_label][value] != "" {
          mutate {
            replace => {
              "status_label.key" => "synchronize_clock_status"
            }
          }
          mutate {
            merge => {
              "additional_token.fields" => "status_label"
            }
          }
        }

        mutate {
          convert => {
            "seconds" => "string"
          }
          on_error => "seconds_conversion_error"
        }

        mutate {
          replace => {
            "seconds_label.value.string_value" => "%{seconds}"
          }
          on_error => "seconds_not_found"
        }

        if ![seconds_not_found] and [seconds_label][value] != "" {
          mutate {
            replace => {
              "seconds_label.key" => "slewed time"
            }
          }
          mutate {
            merge => {
              "additional_token.fields" => "seconds_label"
            }
          }
        }
      } else {
        mutate {
          convert => {
            "sync_details" => "string"
          }
          on_error => "sync_details_conversion_error"
        }

        mutate {
          replace => {
            "sync_details_label.value.string_value" => "%{sync_details}"
          }
          on_error => "sync_details_not_found"
        }

        if ![sync_details_not_found] and [sync_details_label][value] != "" {
          mutate {
            replace => {
              "sync_details_label.key" => "sync_details"
            }
          }
          mutate {
            merge => {
              "additional_token.fields" => "sync_details_label"
            }
          }
        }
      }
    }

    if [principal_ip] != "" {
      grok {
        match => {
          "principal_ip" => "%{IPV4:principal_ip}"
        }
        overwrite => ["principal_ip"]
        on_error => "principal_ip_error"
      }
      if ![principal_ip_error] {
        mutate {
          merge => {
            "principal_token.ip" => "principal_ip"
            "principal_token.asset.ip" => "principal_ip"
          }
          on_error => "principal_ip_error"
        }
      }
    }

    if [principal_port] != "" {
      mutate {
        replace => {
          "principal_token.port" => "%{principal_port}"
        }
        on_error => "principal_port_error"
      }
      mutate {
        convert => {
          "principal_token.port" => "integer"
        }
        on_error => "port_convert_error"
      }
    }

    if [protocol_details] != "" {
      mutate {
        convert => {
          "protocol_details" => "string"
        }
        on_error => "protocol_details_conversion_error"
      }

      mutate {
        replace => {
          "protocol_details_label.value.string_value" => "%{protocol_details}"
        }
        on_error => "protocol_details_not_found"
      }

      if ![protocol_details_not_found] and [protocol_details_label][value] != "" {
        mutate {
          replace => {
            "protocol_details_label.key" => "protocol_details"
          }
        }
        mutate {
          merge => {
            "additional_token.fields" => "protocol_details_label"
          }
        }
      }
    }

    if [username] != "" {
      if [username] =~ "username" {
        grok {
          match => {
            "username" => "%{DATA}=%{GREEDYDATA:username}"
          }
          overwrite => ["username"]
          on_error => "username_grok_error"
        }
      }
      mutate {
        gsub => ["username", "'", ""]
      }
      mutate {
        replace => {
          "target_token.user.userid" => "%{username}"
        }
        on_error => "username_error"
      }
    }

    if [login_description] != "" {
      if [login_description] =~ "Fail|invalid" {
        mutate {
          replace => {
            "action_value" => "FAIL"
          }
        }
        mutate {
          merge => {
            "security_result_token.action" => "action_value"
          }
          on_error => "security_result_action_error"
        }
      }
      mutate {
        replace => {
          "security_result_token.action_details" => "%{login_description}"
        }
        on_error => "security_result_action_details_error"
      }
    }

    if [hostname] != "" {
      mutate {
        replace => {
          "metadata_token.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_token.event_type" => "GENERIC_EVENT"
        }
      }
    }

    if [event_type_details] == "Login" and [username] != "" {
      mutate {
        replace => {
          "extension_token.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
      mutate {
        replace => {
          "metadata_token.event_type" => "USER_LOGIN"
        }
      }
    }
  } else {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
  }

  # Final Block

  if [metadata_token] != "" {
    mutate {
      rename => {
        "metadata_token" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal_token] != "" {
    mutate {
      rename => {
        "principal_token" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [network_token] != "" {
    mutate {
      rename => {
        "network_token" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional_token] != "" {
    mutate {
      rename => {
        "additional_token" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [target_token] != "" {
    mutate {
      rename => {
        "target_token" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [security_result_token] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result_token"
      }
    }
  }

  if [extension_token] != "" {
    mutate {
      rename => {
        "extension_token" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  @include["noun_host_asset_align.include"]

  mutate {
    merge => {
      "@output" => "event"
    }
    on_error => "event_not_found"
  }
}
