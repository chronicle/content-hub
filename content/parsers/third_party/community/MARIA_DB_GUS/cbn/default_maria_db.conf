# Product: MARIA_DB
# Category: Database
# Supported Format: SYSLOG
# Reference: NA
# Last Updated: 2026-03-13
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "security_result" => ""
      "metadata" => ""
      "principal" => ""
      "additional" => ""
      "has_principal" => "false"
      "target" => ""
      "timestamp" => ""
      "product_event_type" => ""
      "event_type" => "GENERIC_EVENT"
      "hostname" => ""
      "user_id" => ""
      "src_ip" => ""
      "query" => ""
      "column1" => ""
      "column2" => ""
      "column3" => ""
      "column4" => ""
      "column5" => ""
      "column6" => ""
      "column7" => ""
      "column8" => ""
      "column9" => ""
      "column10" => ""
      "program" => ""
      "status_message" => ""
      "db_version" => ""
      "db_port" => ""
      "managed_by" => ""
      "action" => ""
      "connection_id" => ""
      "database" => ""
      "resource_name" => ""
      "file_path" => ""
      "server_uid" => ""
      "process_id" => ""
      "time_year" => ""
      "time_val" => ""
      "type_val" => ""
      "name_val" => ""
      "command_val" => ""
      "rule_id" => ""
      "log_level" => ""
      "intermediary" => ""
      "user_auth_status" => ""
    }
  }
  mutate {
    gsub => ["message", '"', "'"]
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{TIMESTAMP_ISO8601:timestamp} %{DATA} %{DATA} %{DATA},%{DATA:hostname},%{DATA:user_id},%{IP:src_ip},%{DATA},%{DATA},%{DATA:product_event_type},%{DATA},%{GREEDYDATA:query},%{GREEDYDATA}",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{NUMBER:rule_id}\\s+\\[%{WORD:log_level}\\]\\s+%{DATA:program}:\\s+%{DATA:status_message}\\.(?:\\\\n|\\\\)Version:\\s+\\'%{DATA:db_version}\\'\\s+socket:\\s+\\'%{DATA:file_path}\\'\\s+port:\\s+%{INT:db_port}\\s+managed by\\s+%{GREEDYDATA:managed_by}",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND}) %{DATA:rule_id} \\[%{LOGLEVEL:log_level}\\] %{DATA:action} %{INT:connection_id} to db: '%{DATA:database}' user: '%{DATA:user_auth_status}' host: '%{DATA:src_ip}' \\(%{GREEDYDATA:status_message}\\)",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{NUMBER:rule_id}\\s+\\[%{WORD:log_level}\\]\\s+%{DATA:status_message} on IP: '%{IP:src_ip}', port: '%{INT:db_port}'\\.",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{NUMBER:rule_id}\\s+\\[%{WORD:log_level}\\]\\s+IP address '%{IP:src_ip}' (?<status_message>could not be resolved: %{GREEDYDATA})",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{NUMBER:rule_id}\\s+\\[%{WORD:log_level}\\]\\s+%{DATA:resource_name}:\\s+File\\s+\\'%{DATA:file_path}\\'\\s+%{GREEDYDATA:status_message}",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{NUMBER:rule_id}\\s+\\[%{WORD:log_level}\\]\\s+Starting MariaDB %{DATA:db_version} source revision\\s+server_uid %{DATA:server_uid} as process %{INT:process_id}",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{NUMBER:rule_id}\\s+\\[%{WORD:log_level}\\]\\s+%{DATA:resource_name}:\\s+%{GREEDYDATA:status_message}",
        "(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{NUMBER:rule_id}\\s+\\[%{WORD:log_level}\\]\\s+%{GREEDYDATA:status_message}",
        "(?<timestamp>%{YEAR}%{MONTHNUM}%{MONTHDAY}\\s+%{HOUR}:%{MINUTE}:%{SECOND})\\s+%{DATA:resource_name}:\\s+%{GREEDYDATA:status_message}",
        "%{INT:time_year}\\s+%{TIME:time_val}\\t\\s+%{INT:rule_id}\\s+%{WORD:product_event_type}\\t(?<query>select \\* from\\s+%{DATA:resource_name}\\s+where\\s+\\(type\\s+<>\\s+'%{DATA:type_val}'\\s+or\\s+name\\s+=\\s+'%{DATA:name_val}'\\)\\s+and\\s+command\\s+<>\\s+'%{DATA:command_val}')\\r\\n",
        "%{INT:time_year}\\s+(?<time_val>%{HOUR}:%{MINUTE}:%{SECOND})[\\t\\s]+%{INT:rule_id}\\s+%{WORD:command_val}[\\t\\s]+%{GREEDYDATA:query}",
        "\\t\\t\\s+(?:[\\s\\t]+)?%{INT:rule_id}[\\s\\t]+%{WORD:command_val}[\\s\\t]+%{GREEDYDATA:query}"
      ]
    }
    overwrite => ["timestamp", "hostname", "src_ip", "query", "product_event_type","user_id", "rule_id", "log_level", "program", "status_message", "db_version", "db_port", "managed_by", "action", "connection_id", "database", "resource_name", "file_path", "server_uid", "process_id", "time_year", "time_val", "type_val", "name_val", "command_val", "user_auth_status"]
    on_error => "grok_error"
  }
  if [time_year] != "" and [time_val] != "" {
    mutate {
      replace => {
        "timestamp" => "20%{time_year} %{time_val}"
      }
      on_error => "id_time_val_error"
    }
  }
  if [rule_id] != "" {
    mutate {
      replace => {
        "security_result.rule_id"   => "%{rule_id}"
      }
      on_error => "ruleId_error"
    }
  }
  if [log_level] =~ "(?i)warning" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  } else if [log_level] =~ "(?i)note" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  if [log_level] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{log_level}"
      }
      on_error => "security_result_error"
    }
  }
  if [type_val] != "" {
    mutate {
      replace => {
        "type_val_label.key" => "type_val"
        "type_val_label.value.string_value" => "%{type_val}"
      }
      on_error => "type_val_label_not_present"
    }
    if ![type_val_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "type_val_label"
        }
        on_error => "type_val_label_not_present_merge"
      }
    }
  }
  if [name_val] != "" {
    mutate {
      replace => {
        "name_val_label.key" => "name_val"
        "name_val_label.value.string_value" => "%{name_val}"
      }
      on_error => "name_val_label_not_present"
    }
    if ![name_val_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "name_val_label"
        }
        on_error => "name_val_label_not_present_merge"
      }
    }
  }
  if [command_val] != "" {
    mutate {
      replace => {
        "command_val_label.key" => "command_val"
        "command_val_label.value.string_value" => "%{command_val}"
      }
      on_error => "command_val_label_not_present"
    }
    if ![command_val_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "command_val_label"
        }
        on_error => "command_val_label_merge_error"
      }
    }
  }
  if [user_auth_status] != "" {
    mutate {
      replace => {
        "user_auth_status_label.key" => "user_auth_status"
        "user_auth_status_label.value" => "%{user_auth_status}"
      }
      on_error => "user_auth_status_label_not_present"
    }
    if ![user_auth_status_label_not_present] {
      mutate {
        merge => {
          "security_result.detection_fields" => "user_auth_status_label"
        }
        on_error => "user_auth_status_label_merge_error"
      }
    }
  }
  if [grok_error] {
    mutate {
      gsub => ["message",", ","#"]
    }
     csv {
      source => "message"
      separator => ","
      on_error => "not_csv"
    }
  }
  if [column1] != "" {
    date {
      match => ["column1","yyyyMMdd HH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "date_error"
    }
  }
  if [column2] != "" {
   mutate {
    replace => {
        "intermediary.hostname" => "%{column2}"
      }
      on_error => "intermediary_hostname_error"
   }
  }
  if [column3] != "" {
   mutate {
    replace => {
        "principal.user.userid" => "%{column3}"
      }
      on_error => "principal_userid_error"
   }
  }
  if [column4] != "" {
    grok {
      match => {
        "column4" => ["^%{IP:src_ip}$"]
      }
      overwrite => ["src_ip"]
      on_error => "grok_ip_error"
    }
  }
  if [src_ip] == "" and [column4] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{column4}"
        "principal.asset.hostname" => "%{column4}"
        "has_principal" => "true"
      }
    }
  }
  if [column5] != "" {
    mutate {
      convert => {
        "column5" => "string"
      }
      on_error => "connection_id_error"
    }
    mutate {
      replace => {
        "connection_id_label.key" => "connection_id"
        "connection_id_label.value.string_value" => "%{column5}"
      }
      on_error => "connection_id_label_error"
    }
    if ![connection_id_label_error] {
      mutate {
        merge => {
          "additional.fields" => "connection_id_label"
        }
        on_error => "connection_id_label_merge_error"
      }
    }
  }
  if [column6] != "" {
    mutate {
      convert => {
        "column6" => "string"
      }
      on_error => "query_label_error"
    }
    mutate {
      replace => {
        "queryid_label.key" => "queryid"
        "queryid_label.value.string_value" => "%{column6}"
      }
      on_error => "query_label_error"
    }
    if ![query_label_error] {
      mutate {
        merge => {
          "additional.fields" => "queryid_label"
        }
        on_error => "query_label_merge_error"
      }
    }
  }
  if [column7] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{column7}"
      }
      on_error => "product_event_type_error"
    }
  }
  if [column8] != "" {
    mutate {
      replace => {
        "database_label.key" => "database"
        "database_label.value.string_value" => "%{column8}"
      }
      on_error => "database_label_error"
    }
    if ![database_label_error] {
      mutate {
        merge => {
          "additional.fields" => "database_label"
        }
        on_error => "database_label_merge_error"
      }
    }
  }
  if [column9] != "" {
    mutate {
      replace => {
        "query" => "%{column9}"
      }
      on_error => "query_error"
    }
    mutate {
      gsub => ["query", "#", ", "]
    }
  }
  if [column10] != "" {
    mutate {
      convert => {
        "column10" => "string"
      }
      on_error => "column10_error"
    }
    mutate {
      replace => {
        "returncode_label.key" => "returncode"
        "returncode_label.value.string_value" => "%{column10}"
      }
      on_error => "returncode_label_error"
    }
    if ![returncode_label_error] {
      mutate {
        merge => {
          "additional.fields" => "returncode_label"
        }
        on_error => "returncode_label_merge_error"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp","ISO8601","RFC3339","UNIX","SYSLOGTIMESTAMP", "yyyy-MM-dd  HH:mm:ss", "yyyyMMdd HH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "date_error"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
        "principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "hostname_error"
    }
  }
  if [program] != "" {
    mutate {
      replace => {
        "principal.process.file.full_path" => "%{program}"
      }
      on_error => "program_error"
    }
  }
  if [status_message] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{status_message}"
      }
      on_error => "status_message_error"
    }
  }
  if [db_version] != "" {
    mutate {
      replace => {
        "version_label.key" => "version"
        "version_label.value" => "%{db_version}"
      }
      on_error => "version_label_error"
    }
    if ![version_label_error] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "version_label"
        }
        on_error => "version_label_merge_error"
      }
    }
  }

  if [file_path] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{file_path}"
      }
      on_error => "target_file_error"
    }
  }
  if [db_port] != "" {
    mutate {
      replace => {
        "target.port" => "%{db_port}"
      }
      on_error => "target_port_error"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "target_port_convert_error"
    }
  }
  if [managed_by] != "" {
    mutate {
      replace => {
        "target.url" => "%{managed_by}"
      }
      on_error => "target_url_error"
    }
  }
  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
      }
      on_error => "principal_error_userid"
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "principal_error"
    }
    if ![principal_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [query] != "" {
    mutate {
      replace => {
        "query_label.key" => "query"
        "query_label.value.string_value" => "%{query}"
      }
      on_error => "query_label_error"
    }
    if ![query_label_error] {
      mutate {
        merge => {
          "additional.fields" => "query_label"
        }
        on_error => "query_label_merge_error"
      }
    }
  }
  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_replace_error"
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "action_error"
    }
  }

  if [database] != "" {
    mutate {
      replace => {
        "database_label.key" => "database"
        "database_label.value.string_value" => "%{database}"
      }
      on_error => "database_label_not_present"
    }
    if ![database_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "database_label"
        }
        on_error => "database_label_not_present_merge"
      }
    }
  }

  if [connection_id] != "" {
    mutate {
      convert => {
        "connection_id" => "string"
      }
      on_error => "connection_id_convert_error"
    }
    mutate {
      replace => {
        "connection_id_label.key" => "connection_id"
        "connection_id_label.value.string_value" => "%{connection_id}"
      }
      on_error => "connection_id_replace_error"
    }
    if ![connection_id_replace_error] {
      mutate {
        merge => {
          "additional.fields" => "connection_id_label"
        }
        on_error => "connection_id_label_error_merge"
      }
    }
  }

  if [resource_name] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{resource_name}"
      }
      on_error => "target_resource_error"
    }
  }

  if [server_uid] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{server_uid}"
      }
      on_error => "server_uid_error"
    }
  }

  if [process_id] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{process_id}"
      }
      on_error => "process_id_error"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "MARIA_DB"
      "metadata.product_name" => "MARIA_DB"
    }
  }

  if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_error"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
