# Product: TANIUM_QUESTION
# Category: TANIUM Logs
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2025-05-21
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "mac_address" => ""
      "comp_name" => ""
      "os" => ""
      "tanium_client_ip" => ""
      "ip_address" => ""
      "user" => ""
      "principal" => ""
      "has_principal" => "false"
      "Ip" => ""
      "target" => ""
      "has_principal_user" => "false"
      "has_target" => "false"
      "json_data" => ""
      "date" => ""
      "src_hostname" => ""
      "InsertTime" => ""
      "DistributeOver" => ""
      "has_target_user" => "false"
      "security_result" => ""
      "kv_data" => ""
      "eventtype" => ""
      "has_user" => "false"
      "src_app" => ""

    }
  }
  mutate {
    gsub => [
      "message", "Computer Name", "comp_name"
    ]
  }
  mutate {
    gsub => [
      "message", "Operating System", "os"
    ]
  }
  mutate {
    gsub => [
      "message", "Tanium Client IP Address", "tanium_client_ip",
    ]
  }
  mutate {
    gsub => [
      "message", "MAC Address", "mac_address",
    ]
  }
  mutate {
    gsub => [
      "message", "IP Address", "ip_address",
    ]
  }
  mutate {
    gsub => [
      "message", "Last Logged In User", "user"
    ]
  }
  mutate {
    gsub => [
      "message" , "\\r\\n" , ""
    ]
  }
  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:date} %{DATA}/%{HOSTNAME:src_hostname} %{DATA}\\|%{DATA}\\|%{DATA:src_app}\\|%{INT}\\|%{DATA:eventtype}\\|%{GREEDYDATA:kv_data}",
        "%{SYSLOGTIMESTAMP:date} %{HOSTNAME:src_hostname}\/%{HOSTNAME} %{GREEDYDATA:json_data}"
      ]
    }
    overwrite => ["date","src_hostname","json_data","kv_data","eventtype","src_app"]
    on_error => "grok_failure"
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failure"
  }
  json {
    source => "json_data"
    array_function => "split_columns"
    on_error => "json_data_failure"
  }
  if [kv_data] != "" {
    mutate {
      gsub =>  [
        "kv_data", '\\t', '#'
      ]
    }
    mutate {
      gsub =>  [
        "kv_data", '\\\"', ''
      ]
    }
  }
  kv {
    source => "kv_data"
    field_split => "#"
    value_split => "="
    on_error => "kv_failure"
  }


  if [json_failure] and [json_data_failure] and [kv_failure] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [comp_name] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{comp_name}"
        "principal.asset.hostname" => "%{comp_name}"
      }
      on_error => "no_computer_name"
    }
    if ![no_computer_name] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [src_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{src_hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{src_hostname}"
      }
      on_error => "no_src_hostname"
    }
    if ![no_src_hostname] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }


  if [date] != "" {
    date {
      match => ["date", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      rebase => true
      on_error => "no_date"
    }
  }
  if [eventtype] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{eventtype}"
      }
      on_error => "no_eventtype"
    }
  }

  if [os] != "" {
    mutate {
      replace => {
        "os_label.key" => "Operating System"
        "os_label.value.string_value" => "%{os}"
      }
      on_error => "no_os_label"
    }
    if ![no_os_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "os_label"
        }
        on_error => "os_label_merge_error"
      }
    }
  }
  if [tanium_client_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "tanium_client_ip"
        "principal.asset.ip" => "tanium_client_ip"
      }
      on_error => "no_tanium_client_ip_address"
    }
    if ![no_tanium_client_ip_address] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [src_app] != "" {
    mutate {
      replace => {
       "event.idm.read_only_udm.principal.application" => "%{src_app}"
      }
      on_error => "no_src_app"
    }
  }
  if [ip_address] != "" {
    mutate {
      replace => {
        "ip_address" => "{\"ip_address\":[\"%{ip_address}\"]}"
      }
    }
    mutate {
      gsub => [
        "ip_address", ",", "\",\""
      ]
    }
    json {
      source => "ip_address"
      array_function => "split_columns"
      on_error => "ip_json_failure"
    }
    for Ip in ip_address {
      grok {
        match => {
          "Ip" => "%{IP:Ip}"
        }
        overwrite => ["Ip"]
        on_error => "Ip_grok_failure"
      }
      if ![Ip_grok_failure] {
        mutate {
          merge => {
            "target.ip" => "Ip"
            "target.asset.ip" => "Ip"
          }
          on_error => "Ip_merge_failed"
        }
        if ![Ip_merge_failed] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
  }
  if [mac_address] != "" {
    mutate {
      gsub => [
        "mac_address", "-", ":"
      ]
    }
    mutate {
      merge => {
        "principal.mac" => "mac_address"
        "principal.asset.mac" => "mac_address"
      }
      on_error => "no_mac_address"
    }
    if ![no_mac_address] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
      }
      on_error => "no_last_logged_in_user"
    }
    if ![no_last_logged_in_user] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  if [has_principal] == "true" and [has_principal_user] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "TANIUM_QUESTION"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
