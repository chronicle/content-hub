filter {

  mutate {
    replace => {
      "sr" => ""
      "accessed_by" => ""
      "action_taken" => ""
      "category" => ""
      "query" => ""
      "action_id" => ""
      "eventId" => ""
      "actionUri" => ""
      "data" => ""
    }
  }

  mutate {
    gsub => ["message", "Accessed By", "accessed_by"]
  }
  mutate {
    gsub => ["message", "Action Taken", "action_taken"]
  }

  json {
    source => "message"
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Saviynt EIP"
      "event.idm.read_only_udm.metadata.vendor_name" => "Saviynt"
      "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{Object Type}"
    }
  }

  date {
    match => ["Event Time", "yyyy-MM-dd HH:mm:ss"]
  }

  if [Message] != "" {
    json {
      source => "Message"
      on_error => "invalid_json"
    }
    if [invalid_json] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{Message}"
        }
      }
    }
    else {
      if [message] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{message}"
          }
        }
      }
      if [data] != "" {
        mutate {
          gsub => ["data", ", (\\w+):", "#$1:"]
        }
        kv {
          source => "data"
          field_split => "#"
          value_split => ":"
        }

        if [category] != "" {
          mutate {
            merge => {
              "sr.category_details" => "category"
            }
          }
        }

        if [actionUri] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.url" => "%{actionUri}"
            }
          }
        }

        if [query] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.process.command_line" => "%{query}"
            }
          }
        }

        if [eventId] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.product_log_id" => "%{eventId}"
            }
          }
        }
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.principal.ip" => "IP Address"
    }
    on_error => "not_present"
  }

  if [accessed_by] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "accessed_by"
      }
    }
  }
  else if [accessed_by] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{accessed_by}"
      }
    }
  }

  if [action_taken] != "" {
    mutate {
      replace => {
        "sr.action_details" => "%{action_taken}"
      }
    }
  }

  if [sr] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}