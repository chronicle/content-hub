# Product: Huawei Versatile Routing Platform
# Category: Switches and Routers
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2026-08-03
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "syslog_pri" => ""
      "syslog_timestamp" => ""
      "hostname" => ""
      "device_ip" => ""
      "huawei_version" => ""
      "module" => ""
      "severity" => ""
      "product_event_type" => ""
      "log_flag" => ""
      "seq" => ""
      "description" => ""
      "description_text" => ""
      "kv_data" => ""
      "SourceIP" => ""
      "SourceIPType" => ""
      "UserIP" => ""
      "source_ip" => ""
      "user_ip" => ""
      "UserName" => ""
      "UserIndex" => ""
      "UserChannel" => ""
      "metadata" => ""
      "extensions" => ""
      "action_val" => ""
      "addition" => ""
      "_field" => ""
      "_check" => ""
      "principal" => ""
      "network" => ""
      "observer" => ""
      "target" => ""
      "security_result" => ""
      "has_user" => "false"
      "has_principal_machine" => "false"
      "has_target_machine" => "false"
    }
  }

  mutate {
    gsub => [ "message", "\\r\\n", " " ]
  }
  mutate {
    gsub => [ "message", "\\n", " " ]
  }
  mutate {
    gsub => [ "message", "^\"", "" ]
  }
  mutate {
    gsub => [ "message", "\"$", "" ]
  }

  grok {
    match => {
      "message" => [
        "(?:<%{INT:syslog_pri}>)?(?P<syslog_timestamp>%{MONTH}\\s+%{MONTHDAY} %{YEAR} [0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.[0-9]+)* %{DATA:hostname} %{IP:device_ip} %%(?P<huawei_version>[0-9]+)(?P<module>[^/]+)/%{INT:severity}/(?P<product_event_type>[^\\(]+)\\((?P<log_flag>[^\\)]+)\\)\\[%{INT:seq}\\]:%{GREEDYDATA:description}",
        "(?:<%{INT:syslog_pri}>)?(?P<syslog_timestamp>%{MONTH}\\s+%{MONTHDAY} %{YEAR} [0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.[0-9]+)* %{DATA:hostname} %{IP:device_ip} %%(?P<huawei_version>[0-9]+)(?P<module>[^/]+)/%{INT:severity}/(?P<product_event_type>[^:]+):%{GREEDYDATA:description}",
        "(?:<%{INT:syslog_pri}>)?(?P<syslog_timestamp>%{MONTH}\\s+%{MONTHDAY} %{YEAR} [0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.[0-9]+)* %{DATA:hostname} %%(?P<huawei_version>[0-9]+)(?P<module>[^/]+)/%{INT:severity}/(?P<product_event_type>[^\\(]+)\\((?P<log_flag>[^\\)]+)\\)\\[%{INT:seq}\\]:%{GREEDYDATA:description}",
        "(?:<%{INT:syslog_pri}>)?(?P<syslog_timestamp>%{MONTH}\\s+%{MONTHDAY} %{YEAR} [0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.[0-9]+)* %{DATA:hostname} %{IP:device_ip} (?P<module>[A-Za-z0-9_-]+)/%{INT:severity}/(?P<product_event_type>[^:]+):%{GREEDYDATA:description}",
        "(?:<%{INT:syslog_pri}>)?(?P<syslog_timestamp>%{MONTH}\\s+%{MONTHDAY} %{YEAR} [0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.[0-9]+)* %{DATA:hostname} %{GREEDYDATA:description}"
      ]
    }
    overwrite => [ "syslog_pri", "syslog_timestamp", "hostname", "device_ip", "huawei_version", "module", "severity", "product_event_type", "log_flag", "seq", "description" ]
    on_error => "grok_failed"
  }

  if [syslog_timestamp] != "" {
    date {
      match => [
        "syslog_timestamp",
        "MMM dd yyyy HH:mm:ss",
        "MMM d yyyy HH:mm:ss",
        "MMM  d yyyy HH:mm:ss"
      ]
      target => "metadata.event_timestamp"
      on_error => "date_parse_error"
    }
  }

  if [description] != "" {
    grok {
      match => {
        "description" => [
          "^(?P<description_text>[^(]+?)\\s*\\((?P<kv_data>[^)]+)\\)",
          "^(?P<description_text>.*)$"
        ]
      }
      overwrite => [ "description_text", "kv_data" ]
      on_error => "desc_grok_failed"
    }

    if [kv_data] != "" {
      kv {
        source => "kv_data"
        value_split => "="
        field_split => ","
        on_error => "kv_failed"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "HUAWEI"
      "metadata.product_name" => "HUAWEI_VRP"
    }
  }

  if [severity] != "" {
    translate {
      source => "severity"
      target => "security_result.severity"
      dictionary => {
        "0" => "CRITICAL"
        "1" => "CRITICAL"
        "2" => "HIGH"
        "3" => "HIGH"
        "4" => "MEDIUM"
        "5" => "LOW"
        "6" => "INFORMATIONAL"
        "7" => "INFORMATIONAL"
      }
      fallback => "UNKNOWN_SEVERITY"
      on_error => "severity_translate_error"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_replace_error"
    }
  }

  if [seq] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{seq}"
      }
      on_error => "product_log_id_replace_error"
    }
  }

  if [description_text] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description_text}"
      }
      on_error => "description_replace_error"
    }
  }

  if [product_event_type] == "SNMP_IP_LOCK" or [product_event_type] =~ "FAIL" {
    mutate {
      replace => {
        "action_val" => "BLOCK"
      }
    }
  } else if [product_event_type] == "SNMP_LOG_IP_UNLOCK" {
    mutate {
      replace => {
        "action_val" => "ALLOW"
      }
    }
  }

  if [action_val] != "" {
    mutate {
      merge => {
        "security_result.action" => "action_val"
      }
      on_error => "action_merge_error"
    }
  }

  if [module] =~ "SNMP" or [product_event_type] =~ "SNMP" {
    mutate {
      replace => {
        "network.application_protocol" => "SNMP"
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "observer.hostname" => "%{hostname}"
        "observer.asset.hostname" => "%{hostname}"
      }
      on_error => "hostname_replace_error"
    }
  }

  if [device_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "device_ip"
        "target.asset.ip" => "device_ip"
      }
      on_error => "device_ip_merge_error"
    }
    if ![device_ip_merge_error] {
      mutate {
        replace => {
          "has_target_machine" => "true"
        }
      }
    }
  }

  if [SourceIP] != "" {
    grok {
      match => {
        "SourceIP" => "%{IP:source_ip}"
      }
      overwrite => [ "source_ip" ]
      on_error => "source_ip_grok_error"
    }
    if ![source_ip_grok_error] and [source_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "source_ip"
          "principal.asset.ip" => "source_ip"
        }
        on_error => "source_ip_merge_error"
      }
      if ![source_ip_merge_error] {
        mutate {
          replace => {
            "has_principal_machine" => "true"
          }
        }
      }
    }
  }

  if [UserIP] != "" {
    grok {
      match => {
        "UserIP" => "%{IP:user_ip}"
      }
      overwrite => [ "user_ip" ]
      on_error => "user_ip_grok_error"
    }
    if ![user_ip_grok_error] and [user_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "user_ip"
          "principal.asset.ip" => "user_ip"
        }
        on_error => "user_ip_merge_error"
      }
      if ![user_ip_merge_error] {
        mutate {
          replace => {
            "has_principal_machine" => "true"
          }
        }
      }
    }
  }

  if [UserName] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{UserName}"
      }
      on_error => "username_replace_error"
    }
    if ![username_replace_error] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }

  if [huawei_version] != "" {
    mutate {
      replace => {
        "observer.platform_version" => "%{huawei_version}"
      }
      on_error => "platform_version_replace_error"
    }
  }

  mutate {
    rename => {
      "module" => "addition.module"
      "UserChannel" => "addition.UserChannel"
      "UserIndex" => "addition.UserIndex"
      "SourceIPType" => "addition.SourceIPType"
      "log_flag" => "addition.log_flag"
    }
  }

  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
    }

    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }

    if ![no_value] and [_check] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
          "_field.value" => "%{value}"
        }
        on_error => "field_replace_error"
      }

      if ![field_replace_error] {
        mutate {
          merge => {
            "security_result.detection_fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }

  if [has_user] == "true" and [product_event_type] == "USERLOGINFAIL" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  } else if [has_principal_machine] == "true" and [has_target_machine] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [observer] != "" {
    mutate {
      rename => {
        "observer" => "event.idm.read_only_udm.observer"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
