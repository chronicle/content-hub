# Product: OneLogin
# Category: SSO
# Supported Format: JSON
# Reference: https://developers.onelogin.com/api-docs/1/events/event-resource
# Last Updated: 2026-01-01
# Copyright 2026 Chronicle LLC

filter {
  mutate {
    replace => {
      "notes" => ""
      "created_date" => ""
      "ValidationStatus" => ""
      "security_result" => ""
      "prin_login_id" => ""
      "prin_user_id" => ""
      "target_hostname" => ""
      "event_type_id" => ""
      "user_attributes.department" => ""
      "user_attributes.title" => ""
      "user_attributes.lastname" => ""
      "user_attributes.firstname" => ""
      "user_attributes.email" => ""
      "user_attributes.username" => ""
      "user_attributes.openid_name" => ""
      "user_attributes.group_id" => ""
      "user_attributes.samaccountname" => ""
      "user_attributes.member_of" => ""
      "adc_name" => ""
      "adc_id" => ""
    }
  }
  if [message] =~ "event.*" {
    mutate {
      gsub => ["message", '\"event\":\\{', '']
    }
    mutate {
      gsub => ["message", '}}', '}']
    }
    mutate {
      gsub => [ "message", "\\\\\\\\\"", "'" ]
    }
  }
  mutate {
    gsub => ["message", "\"\"", "null"]
  }
  mutate {
    gsub => ["message", "\\\\n", ""]
  }
  mutate {
    gsub => ["message", "\\\\", ""]
  }
  mutate {
    gsub => ["message", '\"{', '{']
  }
  mutate {
    gsub => ["message", "}\"", "}"]
  }

  json {
    source => "message"
    on_error => "not_json"
    array_function => "split_columns"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  grok {
    match => {
      "event_timestamp" => [
        "%{DATESTAMP:event_datestamp} "
        "%{DATESTAMP:event_datestamp}"
      ]
    }
    on_error => "date_grok_failed"
  }

  if [date_grok_failed] {
    mutate {
      replace => {
        "event_datestamp" => "%{event_timestamp}"
      }
      on_error => "no_event_timestamp"
    }
  }
  # Example: 2020-07-17 11:02:10 UTC
  # Example: 2020-07-17 11:02:10 , 2023-04-24T15:24:46.499Z
  date {
    match => ["event_datestamp", "yy-MM-dd HH:mm:ss", "yyyy-MM-ddTHH:mm:ss.SSSZ", "ISO8601"]
    on_error => "date_failed"
  }

  mutate {
    replace => {
      "created_date" => "%{created_at}"
    }
    on_error => "no_created_at"
  }


  if [created_date] != "" {
    date {
      match => ["created_date", "yyyy-MM-ddTHH:mm:ss.SSSZ", "ISO8601"]
      on_error => "date_failed"
    }
  }

  mutate {
    convert => {
      "event_type_id" => "string"
    }
    on_error => "event_type_id_conversion_failure"
  }

  mutate {
    convert => {
      "account_id" => "string"
    }
    on_error => "account_id_conversion_failure"
  }

  mutate {
    convert => {
      "actor_user_id" => "string"
    }
    on_error => "actor_user_id_conversion_failure"
  }

  mutate {
    convert => {
      "user_id" => "string"
    }
    on_error => "user_id_conversion_failure"
  }

  mutate {
    convert => {
      "app_id" => "string"
      "directory_id" => "string"
      "privilege_id" => "string"
      "group_id" => "string"
      "policy_id" => "string"
      "risk_score" => "string"
      "authentication_factor_type" => "string"
      "login_id" => "string"
      "role_id" => "string"
      "assuming_acting_user_id" => "string"
      "otp_device_id" => "string"
      "directory_sync_run_id" => "string"
      "resource_type_id" => "string"
    }
  }

  if [user_attributes][lastname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.last_name"  => "%{user_attributes.lastname}"
      }
      on_error => "no_last_name"
    }
  }

  if [user_attributes][firstname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.first_name"  => "%{user_attributes.firstname}"
      }
      on_error => "no_first_name"
    }
  }

  if [user_attributes][department] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.department" => "user_attributes.department"
      }
      on_error => "department_empty"
    }
  }

  if [user_attributes][title] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.title" => "%{user_attributes.title}"
      }
      on_error => "title_not_present"
    }
  }
  mutate {
    replace => {
      user_attribute_email => "%{user_attributes.email}"
    }
    on_error => "email_replace_failed"
  }
  if [user_attribute_email] != "" and [user_attribute_email] =~ "^.+@.+$"{
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "user_attribute_email"
      }
      on_error => "email_not_present"
    }
  }

  if [message] =~ "actor_user_id" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id" => "%{actor_user_id}"
      }
      on_error => "no_actor_user_id"
    }
  }

  if [message] =~ "user_id" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.product_object_id" => "%{user_id}"
      }
      on_error => "no_user_id"
    }
  }

  mutate {
    replace => {
      "target_hostname" => "%{kubernetes_host}"
    }
    on_error => "no_kubernetes_host"
  }

  if [target_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{kubernetes_host}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{kubernetes_host}"
      }
      on_error => "no_kubernetes_host"
    }
  }

  mutate {
    rename => {
      "actor_user_id" => "event.idm.read_only_udm.principal.user.userid"
      "actor_user_name" => "event.idm.read_only_udm.principal.user.user_display_name"
      "user_id" => "event.idm.read_only_udm.target.user.userid"
      "user_name" => "event.idm.read_only_udm.target.user.user_display_name"
      "notes" => "event.idm.read_only_udm.metadata.description"
      "group_id" => "event.idm.read_only_udm.target.group.product_object_id"
      "group_name" => "event.idm.read_only_udm.target.group.group_display_name"
      "policy_type" => "security_result.rule_type"
      "policy_id" => "security_result.rule_id"
      "policy_name" => "security_result.rule_name"
      "risk_reasons" => "security_result.description"
      "risk_score" => "security_result.severity_details"
      "custom_message" => "security_result.summary"
    }
  }

  if [event_type_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_type_id}"
      }
      on_error => "event_type_id_empty"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.network.http.user_agent" => "%{user_agent}"
    }
    on_error => "no_user_agent"
  }
  if ![no_user_agent] {
    mutate {
      convert => {
        "user_agent" => "parseduseragent"
      }
      on_error => "convert_failed"
    }
    if ![convert_failed] {
      mutate {
        rename => {
          "user_agent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
        }
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_log_id" => "%{uuid}"
    }
    on_error => "no_uuid"
  }
  if [no_uuid] {
    mutate {
      convert => {
        "id" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      rename => {
        "id" => "event.idm.read_only_udm.metadata.product_log_id"
      }
    }
  }
  mutate {
    merge => {
      "event.idm.read_only_udm.principal.ip" => "ipaddr"
      "event.idm.read_only_udm.principal.asset.ip" => "ipaddr"
    }
    on_error => "no_ip_addr"
  }

  # Event types documentation: https://developers.onelogin.com/api-docs/1/events/event-resource#eventtypes
  # 5: %user% logged into onelogin
  # 6: %user% failed authentication
  # 8: %user% logged into %app%
  # 1400: User verified otp device
  if [event_type_id] in [ "5", "6", "8", "1400", "130" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "SSO"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "%{authentication_factor_type}"
      }
      on_error => "no_auth_factor"
    }

    if [event_type_id] == "6" {
      mutate {
        replace => {
          "ValidationStatus" => "BLOCK"
          "auth_cat" => "AUTH_VIOLATION"
        }
      }
      mutate {
        merge => {
          "security_result.category" => "auth_cat"
        }
      }
    }

    else if [event_type_id] == "130" {
      mutate {
        replace => {
          "ValidationStatus" => "ALLOW"
        }
      }
    }

    else if [event_type_id] == "1400" {
      mutate {
        replace => {
          "auth_mechanism" => "OTP"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.extensions.auth.mechanism" => "auth_mechanism"
        }
      }
    }

  # 10: %user% requested new password
  # 11: %actor_user% changed password for %user%
  }
  else if [event_type_id] in [ "10", "11" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PASSWORD"
      }
    }
  # 13: %user% was created by %actor_user%
  # 14: %user% updated by %actor_user%
  }
  else if [event_type_id] in [ "13", "14" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  # 19: %user% locked
  # 21: %user% suspended by %actor_user%
  }
  else if [event_type_id] in [ "19", "21" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
      }
    }

    if [event_type_id] == "19" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "user locked"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "user suspended"
        }
      }
    }
  # 49: %user% could not be updated
  }
  else if [event_type_id] == "49" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        "ValidationStatus" => "BLOCK"
        "security_result.summary" => "User could not be updated"
      }
    }
  # 72: %user% granted permission to %privilege_name%
  }
  else if [event_type_id] == "72" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
      }
    }
  # 83: %user% reactivated in %directory%
  # 81: %user% updated by %directory%
  }
  else if [event_type_id] in [ "83", "81" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        "event.idm.read_only_udm.metadata.description" => "User reactivated in directory"
      }
    }
    if [event_type_id] == "81" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "User updated by directory"
        }
      }
    }
  # 118: Saml assertion warning for %actor_user% %note%
  }
  else if [event_type_id] == "118" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        "ValidationStatus" => "BLOCK"
      }
    }
  # 149: %user% automatically added to %role% role
  }
  else if [event_type_id] == "149" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
        "event.idm.read_only_udm.metadata.description" => "user automatically added to role"
      }
    }
  # 541: %user% updated directory %directory%
  # 114: Import from %directory% finished
  }
  else if [event_type_id] in [ "541", "114" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
      }
    }
    if [message] !~ "actor_user_id" {
      if [message] =~ "login_id" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{login_id}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
    }
  # 600: %app% was added by %user%
  # 601: %app% was updated by %user%
  # 334: %user% not updated in %app%
  # 52: %user% updated in %app%
  # 53: %user% suspended in %app%
  # 64: %user% could not be provisioned in %app%
  }
  else if [event_type_id] in [ "600", "601", "334", "52", "53", "64"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
        "event.idm.read_only_udm.metadata.description" => "App was updated by user"
        "event.idm.read_only_udm.target.resource.type" => "APP"
      }
    }

    if [event_type_id] == "600" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
          "event.idm.read_only_udm.metadata.description" => "App was added by user"
        }
      }
    }
    else if [event_type_id] == "334" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "User was not updated in App"
        }
      }
      mutate {
        replace => {
          "prin_user_id" => "%{actor_user_id}"
        }
        on_error => "no_prin_user_id"
      }
      mutate {
        replace => {
          "prin_login_id" => "%{login_id}"
        }
        on_error => "no_prin_user_id"
      }
      if [prin_user_id] == "" and [prin_login_id] == "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
    }
    else if [event_type_id] == "52" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "User updated in app"
        }
      }
    }
    else if [event_type_id] == "53" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "User suspended in app"
        }
      }
    }
    else if [event_type_id] == "64" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "User could not be provisioned in app"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_DELETION"
        }
      }
    }

    if [message] !~ "actor_user_id" {
      if [message] =~ "login_id" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{login_id}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
    }
  # 1001: %user% challenged for otp
  }
  else if [event_type_id] == "1001" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        "event.idm.read_only_udm.metadata.description" => "User challenged for otp"
        "event.idm.read_only_udm.target.resource.type" => "APP"
      }
    }
  # 41: %directory% started
  # 44: Notification from %directory%
  # 47: %directory% caught an exception
  # 254: Reapplied entitlement mappings for %user% in %app% app
  }
  # 3013: Oidc validate token for %app% success
  # 3014: Oidc validate token for %app% failed
  else if [event_type_id] in ["3013", "3014"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        "event.idm.read_only_udm.target.resource.type" => "APP"
      }
    }
    if [event_type_id] == "3013" and "notes" == "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "Oidc validate token for app success."
        }
      }
    }
    else if [event_type_id] == "3014" and "notes" == "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "Oidc validate token for app failed."
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }

  if [ValidationStatus] != "" {
    mutate {
      merge => {
        "security_result.action" => "ValidationStatus"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    replace => {
      "priv_id" => "%{privilege_id}"
    }
    on_error => "no_priv_id"
  }

  mutate {
    replace => {
      "dir_id" => "%{directory_id}"
    }
    on_error => "no_dir_id"
  }

  mutate {
    replace => {
      "app_id1" => "%{app_id}"
    }
    on_error => "no_app_id"
  }

  mutate {
    replace => {
      "role_id1" => "%{role_id}"
    }
    on_error => "no_role_id"
  }

  mutate {
    replace => {
      "priv_name" => "%{privilege_name}"
    }
    on_error => "no_priv_name"
  }

  mutate {
    replace => {
      "dir_name" => "%{directory_name}"
    }
    on_error => "no_dir_name"
  }

  mutate {
    replace => {
      "app_name1" => "%{app_name}"
    }
    on_error => "no_app_name"
  }

  mutate {
    replace => {
      "role_name1" => "%{role_name}"
    }
    on_error => "no_role_name"
  }

  if ![no_priv_id] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{privilege_id}"
      }
    }
  }
  else if ![no_dir_id] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{directory_id}"
      }
    }
  }
  else if ![no_app_id] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{app_id}"
      }
    }
  }
  else if ![no_role_id] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{role_id}"
      }
    }
  }

  if ![no_priv_name] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{privilege_name}"
        "event.idm.read_only_udm.target.resource.type" => "PERMISSION"
      }
    }
  }
  else if ![no_dir_name] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{directory_name}"
        "event.idm.read_only_udm.target.resource.type" => "DIRECTORY"
      }
    }
  }
  else if ![no_role_name] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{role_name}"
        "event.idm.read_only_udm.target.resource.type" => "ROLE"
      }
    }
  }
  else if ![no_app_name] {
    if [event_type_id] in [ "600", "601"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{app_name}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{app_name}"
        }
      }
    }
  }

  if [account_id] != "" {
    mutate {
      replace => {
        "account_id_label.key" => "account_id"
        "account_id_label.value.string_value" => "%{account_id}"
      }
      on_error => "no_account_id"
    }
    if ![no_account_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "account_id_label"
        }
        on_error => "no_account_id_label_merge"
      }
    }
  }
  mutate {
    convert => {
      "adc_id" => "string"
    }
    on_error => "no_adc_id"
  }
  if [adc_id] != "" {
    mutate {
      replace => {
        "adc_id_label.key" => "adc_id"
        "adc_id_label.value.string_value" => "%{adc_id}"
      }
      on_error => "no_adc_id_label"
    }
    if ![no_adc_id_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "adc_id_label"
        }
        on_error => "no_adc_id_label_merge"
      }
    }
  }

  if [adc_name] != "" {
    mutate {
      replace => {
        "adc_name_label.key" => "adc_name"
