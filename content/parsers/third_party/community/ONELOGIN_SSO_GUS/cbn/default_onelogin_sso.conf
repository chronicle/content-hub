# Google SecOps Default CBN Parser (ONELOGIN_SSO)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/ONELOGIN_SSO/default/onelogin_sso.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "ONELOGIN"
      "event.idm.read_only_udm.metadata.product_name" => "ONELOGIN_SSO"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
