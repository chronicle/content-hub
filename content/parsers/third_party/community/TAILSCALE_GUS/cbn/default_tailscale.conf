filter{
  mutate {
    replace => {
      "event_type" => ""
      "metadata" => ""
      "principal" => ""
      "loginName" => ""
      "type" => ""
      "eventGroupID" => ""
      "display_name" => ""
      "_embedded.riskEvent.username" => ""
      "email_addresses" => ""
      "actor.type" => ""
      "actor.displayName" => ""
      "actor.loginName" => ""
      "actor.id" => ""
      "id" => ""
      "additional" => ""
      "security_result" => ""
      "src_ip" => ""
      "dst_port"  => ""
      "action" => ""
      "actionDetails" => ""
      "origin" => ""
      "target.id" => ""
      "target.name" => ""
      "target.type" => ""
      "src_port" => ""
      "nodeId" => ""
      "physicalTraffic" => ""
      "virtualTraffic" => ""
      "exitTraffic" => ""
      "rxBytes" => ""
      "txBytes" => ""
      "empty_check_0" => ""
      "start" => ""
      "end" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_target_user" => "false"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_error"
  }
  mutate {
    rename => {
      "target" => "target1"
    }
  }
  mutate {
    replace => {
      "target" => ""
    }
  }
  date {
    match => ["start", "ISO8601" ]
    on_error => "invalid_start_date"
  }
  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "action_empty"
    }
  }
  if [actionDetails] != "" {
    mutate {
      replace => {
        "action_details_label.key" => "ActionDetails"
        "action_details_label.value" => "%{actionDetails}"
      }
      on_error => "action_details_empty"
    }
    if ![action_details_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "action_details_label"
        }
        on_error => "action_details_label_empty"
      }
    }
  }
  mutate {
    replace => {
      "actor_id" => "%{actor.id}"
    }
    on_error => "actor_id_empty"
  }
  if ![actor_id_empty] and [actor_id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{actor_id}"
        "has_target_user" => "true"
      }
    }
  }
  mutate {
    replace => {
      "actor_display_name" => "%{actor.displayName}"
    }
    on_error => "actor_display_name_empty"
  }
  if ![actor_display_name_empty] and [actor_display_name] != "" {
    mutate {
      replace => {
        "target.user.user_display_name" => "%{actor_display_name}"
        "has_target_user" => "true"
      }
    }
  }
  mutate {
    replace => {
      "actor_loginName" => "%{actor.loginName}"
    }
    on_error => "actor_loginName_empty"
  }

  if ![actor_loginName_empty] and [actor_loginName] =~ "^.+@.+$" and [actor_loginName] != "" {
    mutate {
      merge => {
        "target.user.email_addresses" => "actor_loginName"
      }
    }
    mutate {
      replace => {
        "has_target_user" => "true"
      }
    }
  }
  mutate {
    replace => {
      "actor_type" => "%{actor.type}"
    }
    on_error => "actor_type_empty"
  }
  if [eventGroupID] != "" {
    mutate {
      replace => {
        "eventGroupID_label.key" => "eventGroupID"
        "eventGroupID_label.value" => "%{eventGroupID}"
      }
      on_error => "eventGroupID_empty"
    }
    if ![eventGroupID_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "eventGroupID_label"
        }
      }
    }
  }
  if [origin] != "" {
    mutate {
      replace => {
        "origin_label.key" => "origin"
        "origin_label.value.string_value" => "%{origin}"
      }
      on_error => "origin_not_found"
    }
    if ![origin_not_found] {
      mutate {
        merge => {
          "additional.fields" => "origin_label"
        }
        on_error => "origin_label_empty"
      }
    }
  }
  if [target1][id] != "" {
    mutate {
      replace => {
        "target1_id_label.key" => "target1_id"
