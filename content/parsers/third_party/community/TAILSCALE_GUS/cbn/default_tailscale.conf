      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
      if [src_port] != "" {
        mutate {
          replace => {
            "principal.port" => "%{src_port}"
          }
          on_error => "no_src_port"
        }
        mutate {
          convert => {
            "principal.port" => "integer"
          }
          on_error => "src_port_conversion_error"
        }
      }
      if [index] == "0" {
        mutate {
          convert => {
            "phy_traf.rxBytes" => "string"
          }
          on_error => "rxBytes_conversion"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.network.received_bytes" => "%{phy_traf.rxBytes}"
          }
          on_error => "empty_check_1"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.network.received_bytes" => "uinteger"
          }
          on_error => "phy_traf_rxBytes_conversion"
        }
      }
      else if [index] > "0" {
        mutate {
          replace => {
            "phy_traf_rxBytes_label" => ""
          }
        }
        mutate {
          convert => {
            "phy_traf.rxBytes" => "string"
          }
            on_error => "rxBytes_conversion"
        }
        mutate {
          replace => {
            "phy_traf_rxBytes" => "%{phy_traf.rxBytes}"
          }
          on_error => "phy_traf_rxBytes_empty"
        }
        if ![phy_traf_rxBytes_empty] {
          mutate {
            replace => {
              "phy_traf_rxBytes_label.value.string_value" => "%{phy_traf.rxBytes}"
              "phy_traf_rxBytes_label.key" => "phy_traf_rxBytes_%{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "phy_traf_rxBytes_label"
            }
            on_error => "phy_traf_rxBytes_label_empty"
          }
        }
      }
      if [index] == "0" {
        mutate {
          convert => {
            "phy_traf.txBytes" => "string"
          }
          on_error => "txBytes_conversion"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.network.sent_bytes" => "%{phy_traf.txBytes}"
          }
          on_error => "empty_check_1"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
          }
          on_error => "phy_traf_txBytes_conversion"
        }
      }
      else if [index] > "0" {
        mutate {
          replace => {
            "phy_traf_txBytes_label" => ""
          }
        }
        mutate {
          convert => {
            "phy_traf.txBytes" => "string"
          }
            on_error => "txBytes_conversion"
        }
        mutate {
          replace => {
            "phy_traf_txBytes" => "%{phy_traf.txBytes}"
          }
          on_error => "phy_traf_txBytes_empty"
        }
        if ![phy_traf_txBytes_empty] {
          mutate {
            replace => {
              "phy_traf_txBytes_label.value.string_value" => "%{phy_traf.txBytes}"
              "phy_traf_txBytes_label.key" => "phy_traf_txBytes_%{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "phy_traf_txBytes_label"
            }
            on_error => "phy_traf_txBytes_label_empty"
          }
        }
      }
      if [index] == "0" {
        mutate {
          convert => {
            "phy_traf.rxPkts" => "string"
          }
          on_error => "rxPkts_conversion"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.network.received_bytes" => "%{phy_traf.rxPkts}"
          }
          on_error => "empty_check_1"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.network.received_bytes" => "uinteger"
          }
          on_error => "phy_traf_rxPkts_conversion"
        }
      }
      else if [index] > "0" {
        mutate {
          replace => {
            "phy_traf_rxPkts_label" => ""
          }
        }
        mutate {
          convert => {
            "phy_traf.rxPkts" => "string"
          }
            on_error => "rxPkts_conversion"
        }
        mutate {
          replace => {
            "phy_traf_rxPkts" => "%{phy_traf.rxPkts}"
          }
          on_error => "phy_traf_rxPkts_empty"
        }
        if ![phy_traf_rxPkts_empty] {
          mutate {
            replace => {
              "phy_traf_rxPkts_label.value.string_value" => "%{phy_traf.rxPkts}"
              "phy_traf_rxPkts_label.key" => "phy_traf_rxPkts_%{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "phy_traf_rxPkts_label"
            }
            on_error => "phy_traf_rxPkts_label_empty"
          }
        }
      }
      if [index] == "0" {
        mutate {
          convert => {
            "phy_traf.txPkts" => "string"
          }
          on_error => "txPkts_conversion"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.network.sent_bytes" => "%{phy_traf.txPkts}"
          }
          on_error => "empty_check_1"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
          }
          on_error => "phy_traf_txPkts_conversion"
        }
      }
      else if [index] > "0" {
        mutate {
          replace => {
            "phy_traf_txPkts_label" => ""
          }
        }
        mutate {
          convert => {
            "phy_traf.txPkts" => "string"
          }
            on_error => "txPkts_conversion"
        }
        mutate {
          replace => {
            "phy_traf_txPkts" => "%{phy_traf.txPkts}"
          }
          on_error => "phy_traf_txPkts_empty"
        }
        if ![phy_traf_txPkts_empty] {
          mutate {
            replace => {
              "phy_traf_txPkts_label.value.string_value" => "%{phy_traf.txPkts}"
              "phy_traf_txPkts_label.key" => "phy_traf_txPkts_%{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "phy_traf_txPkts_label"
            }
            on_error => "phy_traf_txPkts_label_empty"
          }
        }
      }
    }
  }
  if [virtualTraffic] != "" {
    for index, vir_traf in virtualTraffic {
      mutate{
        replace => {
          "vir_traf_rxBytes_label" => ""
          "vir_traf_txBytes_label" => ""
          "vir_traf_rxPkts_label" => ""
          "vir_traf_txPkts_label" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "index_conversion_error"
      }
      grok {
        match => {
          "vir_traf.dst" => [
            "%{IP:dst_ip}:%{INT:dst_port}"
          ]
        }
        overwrite => ["dst_ip", "dst_port"]
        on_error => "vir_traf_invalid"
      }
      mutate {
        merge => {
          "target.ip" => "dst_ip"
          "target.asset.ip" => "dst_ip"
        }
        on_error => "no_dst"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
      if [dst_port] != "" {
        mutate {
          replace => {
            "target.port" => "%{dst_port}"
          }
          on_error => "no_dst_port"
        }
        mutate {
          convert => {
            "target.port" => "integer"
          }
          on_error => "dst_port_conversion_error"
        }
      }
      grok {
        match => {
          "vir_traf.src" => [
            "%{IP:src_ip}:%{INT:src_port}"
          ]
        }
        overwrite => ["src_ip", "src_port"]
        on_error => "vir_traf_invalid"
      }
      mutate {
