        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
      if [index] == "0" {
        if [src_port] != "" {
          mutate {
            replace => {
              "principal.port" => "%{src_port}"
            }
            on_error => "no_src_port"
          }
          if ![no_src_port] {
            mutate {
              convert => {
                "principal.port" => "integer"
              }
              on_error => "src_port_conversion_error"
            }
