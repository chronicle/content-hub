      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
      if [src_port] != "" {
        mutate {
          replace => {
            "principal.port" => "%{src_port}"
          }
          on_error => "no_src_port"
        }
        mutate {
          convert => {
            "principal.port" => "integer"
          }
          on_error => "src_port_conversion_error"
        }
      }
      mutate {
        replace => {
          "vir_traf_rxBytes" => "%{vir_traf.rxBytes}"
        }
        on_error => "vir_traf_rxBytes_empty"
      }
      if ![vir_traf_rxBytes_empty] {
        mutate {
          convert => {
            "vir_traf.rxBytes" => "string"
          }
            on_error => "rxBytes_conversion"
        }
        if [vir_traf][rxBytes] != "" {
          mutate {
            replace => {
              "vir_traf_rxBytes_label.value.string_value" => "%{vir_traf.rxBytes}"
            }
            on_error => "vir_traf_rxBytes_empty"
          }
          if ![vir_traf_rxBytes_empty] {
            mutate {
              replace => {
                "vir_traf_rxBytes_label.key" => "vir_traf_rxBytes_%{index}"
              }
            }
            mutate {
              merge => {
                "additional.fields" => "vir_traf_rxBytes_label"
              }
              on_error => "vir_traf_rxBytes_label_empty"
            }
          }
        }
        mutate {
          convert => {
            "vir_traf.txBytes" => "string"
          }
          on_error => "txBytes_conversion"
        }
        if [vir_traf][txBytes] != "" {
          mutate {
            replace => {
              "vir_traf_txBytes_label.value.string_value" => "%{vir_traf.txBytes}"
            }
            on_error => "vir_traf_txBytes_empty"
          }
          if ![vir_traf_txBytes_empty] {
            mutate {
              replace => {
                "vir_traf_txBytes_label.key" => "vir_traf.txBytes_%{index}"
              }
            }
            mutate {
              merge => {
                "additional.fields" => "vir_traf_txBytes_label"
              }
              on_error => "vir_traf_txBytes_label_empty"
            }
          }
        }
      }
      mutate {
        replace => {
          "vir_traf_rxPkts" => "%{vir_traf.rxPkts}"
        }
        on_error => "vir_traf_rxPkts_empty"
      }
      if ![vir_traf_rxPkts_empty] {
          mutate {
            convert => {
              "vir_traf.rxPkts" => "string"
            }
              on_error => "rxPkts_conversion"
          }
          if [vir_traf][rxPkts] != "" {
            mutate {
              replace => {
                "vir_traf_rxPkts_label.value.string_value" => "%{vir_traf.rxPkts}"
              }
              on_error => "vir_traf_rxPkts_empty"
            }
            if ![vir_traf_rxPkts_empty] {
              mutate {
              replace => {
                "vir_traf_rxPkts_label.key" => "vir_traf_rxPkts_%{index}"
              }
            }
            mutate {
