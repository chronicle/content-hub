            "exit_traf_txBytes_label" => ""
          }
        }
        mutate {
          convert => {
            "exit_traf.txBytes" => "string"
          }
            on_error => "txBytes_conversion"
        }
        mutate {
          replace => {
            "exit_traf_txBytes" => "%{exit_traf.txBytes}"
          }
          on_error => "exit_traf_txBytes_empty"
