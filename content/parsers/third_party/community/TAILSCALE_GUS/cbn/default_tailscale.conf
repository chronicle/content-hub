          mutate {
            replace => {
              "exit_traf_txBytes_label.value.string_value" => "%{exit_traf.txBytes}"
              "exit_traf_txBytes_label.key" => "exit_traf_txBytes_%{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "exit_traf_txBytes_label"
            }
            on_error => "exit_traf_txBytes_label_empty"
          }
        }
      }
      if [index] == "0" {
        mutate {
          convert => {
            "exit_traf.txPkts" => "string"
          }
          on_error => "txPkts_conversion"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.network.received_bytes" => "%{exit_traf.txPkts}"
          }
          on_error => "empty_check_1"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.network.received_bytes" => "uinteger"
          }
          on_error => "exit_traf_txPkts_conversion"
        }
      }
      else if [index] > "0" {
        mutate {
          replace => {
            "exit_traf_txPkts_label" => ""
          }
        }
        mutate {
          convert => {
            "exit_traf.txPkts" => "string"
          }
            on_error => "txPkts_conversion"
        }
        mutate {
          replace => {
            "exit_traf_txPkts" => "%{exit_traf.txPkts}"
          }
          on_error => "exit_traf_txPkts_empty"
        }
        if ![exit_traf_txPkts_empty] {
          mutate {
            replace => {
              "exit_traf_txPkts_label.value.string_value" => "%{exit_traf.txPkts}"
              "exit_traf_txPkts_label.key" => "exit_traf_txPkts_%{index}"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "exit_traf_txPkts_label"
            }
            on_error => "exit_traf_txPkts_label_empty"
          }
        }
      }
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [action] == "LOGIN" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_target_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true"  {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}