  if [exitTraffic] != "" {
    for index, exit_traf in exitTraffic {
      mutate {
        convert => {
          index => "string"
        }
        on_error => "index_conversion_error"
      }
      grok {
        match => {
          "exit_traf.src" => [
            "%{IP:src_ip}:%{INT:src_port}",
            "\\[%{IP:src_ip}\\]:%{INT:src_port}"
          ]
        }
        overwrite => ["src_ip", "src_port"]
        on_error => "exit_traf_invalid"
      }
      if [src_ip] != "" {
        mutate {
          merge => {
            "principal.ip" => "src_ip"
            "principal.asset.ip" => "src_ip"
          }
          on_error => "no_src_ip"
