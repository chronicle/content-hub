    }
    if ![target1_id_label_empty] {
      mutate {
        merge => {
          "additional.fields" => "target1_id_label"
        }
        on_error => "target1_id_label_empty"
      }
    }
  }

  if [target1][name] != "" {
    mutate {
      replace => {
        "principal.asset.hostname" => "%{target1.name}"
        "principal.hostname" => "%{target1.name}"
        "has_principal" => "true"
      }
      on_error => "target1_name_empty"
    }
  }
  if [target1][type] != "" {
    mutate {
      replace => {
        "target1_type_label.key" => "target1_type"
        "target1_type_label.value.string_value" => "%{target1.type}"
      }
      on_error => "target1_type_label_empty"
    }
    if ![target1_type_label_empty] {
      mutate {
        merge => {
          "additional.fields" => "target1_type_label"
        }
        on_error => "target1_type_label_empty"
      }
    }
  }

  if [nodeId] != "" {
    mutate {
      replace => {
        "nodeId_label.value.string_value" => "%{nodeId}"
      }
      on_error => "nodeId_empty"
    }
    if ![nodeId_empty] {
      mutate {
        replace => {
          "nodeId_label.key" => "nodeId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "nodeId_label"
        }
        on_error => "nodeId_label_empty"
      }
    }
  }
  if [physicalTraffic] != "" {
    for index, phy_traf in physicalTraffic {
      mutate {
        convert => {
          index => "string"
        }
        on_error => "index_conversion_error"
      }
      grok {
        match => {
          "phy_traf.dst" => [
            "%{IP:dst_ip}:%{INT:dst_port}"
          ]
        }
        overwrite => ["dst_ip", "dst_port"]
        on_error => "phy_traf_invalid"
      }
      mutate {
        merge => {
          "target.ip" => "dst_ip"
          "target.asset.ip" => "dst_ip"
        }
        on_error => "no_dst"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
      if [dst_port] != "" {
        mutate {
          replace => {
            "target.port" => "%{dst_port}"
          }
          on_error => "no_dst_port"
        }
        mutate {
          convert => {
            "target.port" => "integer"
          }
          on_error => "dst_port_conversion_error"
