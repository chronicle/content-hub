# Product: Duo User Context
# Category: Identity and Access Management
# Supported Format: JSON
# Reference: See below
# Last Updated: 2024-05-31
# Copyright 2024 Chronicle LLC

##### Overview
# This parser handles DUO_USER_CONTEXT data.
# The main features are:
# > Implementing user aliasing to map username to email address for users
# > Parsing groups a user belongs to based on DUO(which can be synced with AD)
# > Mapping phone numbers
# > Capturing phone device details and adding them to devices relationship
# > Capturing account status for a user.


##### Ingsetion
# The recommended method for ingestion is using the Chronicle API integration
# This integration uses the /admin/v1/users endpoint for duo

#### Format ######
# The format of the data is described in the following documentation:
# https://duo.com/docs/adminapi#retrieve-users


filter {
    # initialise variables
    mutate {
        replace => {
            # access
            "access_device.browser" => ""
            "access_device.browser_version" => ""
            "surfaced_auth.access_device.browser" => ""
            "surfaced_auth.access_device.browser_version" => ""
            "access_device.ip.address" => ""
            "access_device.location.city" => ""
            "access_device.location.country" => ""
            "access_device.location.state" => ""
            "surfaced_auth.access_device.location.city" => ""
            "surfaced_auth.access_device.location.country" => ""
            "surfaced_auth.access_device.location.state" => ""
            "access_device.os" => ""
            "access_device.os_version" => ""
            "surfaced_auth.access_device.os" => ""
            "surfaced_auth.access_device.os_version" => ""
            "surfaced_auth.user.key" => ""
            "surfaced_auth.user.name" => ""
            # action
            "action" => ""
            "action.name" => ""
            "action.details" => ""
            "activity_id" => ""
            # actor
            "actor.details.created" => ""
            "actor.details.last_login" => ""
            "actor.details.email" => ""
            "actor.details.status" => ""
            "actor.details.groups" => ""
            "actor.key" => ""
            "actor.name" => ""
            "actor.type" => ""
            # target
            "target.details.manufacturer" => ""
            "target.details.number" => ""
            "target.details.extension" => ""
            "target.details.os_version" => ""
            "target.details.biometrics_status" => ""
            "target.details.os" => ""
            "target.details.model" => ""
            "target.details.tampered_status" => ""
            "target.details.passcode_status" => ""
            "target.details.country_code" => ""
            "target.key" => ""
            "target.name" => ""
            "target.type" => ""
            # un-nested fields
            "akey" => ""
            "application" => ""
            "old_target" => ""
            "ts" => ""
            # new
            "explanations" => ""
            "triage_event_uri" => ""
            "from_common_netblock" => ""
            "from_new_user" => ""
            "low_risk_ip" => ""
            "priority_event" => ""
            "sekey" => ""
            "state" => ""
            "triaged_as_interesting" => ""
            "type" => ""
            # repeated udm noun
            "asset_software" => ""
            "asset_hardware" => ""
            # set metadata_entity_type
            "metadata_entity_type" => ""
            "ip_present" => "false"
            "asset_mid_present" => "false"
            "resource_present" => "false"
            "user_present" => "false"
        }
    }
    # metadata
    mutate {
        replace => {
            # "metadata_entity_type" => ""
            "phones.0" => ""
            "entity.metadata.product_name" => "Duo User Context"
            "entity.metadata.vendor_name" => "Duo"
        }
    }

    mutate {
        gsub => ["message", "\\r\\n", " "]
    }

    mutate {
        gsub => ["message", ', \\\\\\"', ', \"']
    }
    mutate {
        gsub => ["message", '\\\\\\":', '\":']
    }
    mutate {
        gsub => ["message", '{\\\\\\"', '{\"']
    }
    mutate {
        gsub => ["message", '\\\\\\"}', '\"}']
    }
    mutate {
        gsub => ["message", '\\\\\\"([\]]+)', '\"]']
    }
    mutate {
        gsub => ["message", '([\[]+)\\\\\\"', '[\"']
    }
    mutate {
        gsub => ["message", ': \\\\\\"', ': \"']
    }
    mutate {
        gsub => ["message", '\\\\\\", ', '\", ']
    }
    mutate {
        gsub => ["message", '\\"{', "{"]
    }
    mutate {
        gsub => ["message", '}\\"', "}"]
    }
    mutate {
        gsub => ["message", '\\\\\\\\"', '\"']
    }

    json {
        source => "message"
        array_function => "split_columns"
        on_error => "message_not_json"
    }

    if [message_not_json] {
        drop {
            tag => "TAG_MALFORMED_MESSAGE"
        }
    }

    if [ts] != "" {
        date {
            match => ["ts", "ISO8601", "RFC3339"]
            on_error => "date_match_failed"
        }
    }

    # has separated mapping of username
    mutate {
        rename => {
            "firstname" => "entity.entity.user.first_name"
            "lastname" => "entity.entity.user.last_name"
            "realname" => "entity.entity.user.user_display_name"
            "user_id" => "entity.metadata.product_entity_id"
        }
    }

    mutate {
        replace => {
            "entity.entity.user.userid" => "%{username}"
        }
        on_error => "username_empty"
    }
    if ![username_empty] {
        mutate {
            replace => {
                "user_present" => "true"
            }
        }
    }
    else if [surfaced_auth][user][key] != "" {
        mutate {
            replace => {
                "entity.entity.user.userid" => "%{surfaced_auth.user.key}"
            }
            on_error => "user_key_empty"
        }
        if ![user_key_empty] {
            mutate {
                replace => {
                    "user_present" => "true"
                }
            }
        }
    }


    mutate {
        replace => {
            "user_status.key" => "status"
            "status_code" => "%{status}"
            "user_status.value" => "%{status}"
        }
        on_error => "source_field_not_set"
    }
    if ![source_field_not_set] {
        mutate {
            merge => {
                "entity.entity.user.attribute.labels" => "user_status"
            }
        }
    }



    mutate { gsub => ["status_code", "active", "ACTIVE"]}
    mutate { gsub => ["status_code", "disabled","SUSPENDED"]}
    mutate { gsub => ["status_code", "bypass","ACTIVE"]}
    mutate { gsub => ["status_code", "locked out","NO_ACTIVE_CREDENTIALS"]}
    mutate { gsub => ["status_code", "pending deletion","SUSPENDED"]}



    mutate {
        rename => {
            "status_code" => "entity.entity.user.user_authentication_status"
        }
    }

    #insert groups



    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.0.name"
        }
        on_error => "_"
    }

        mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.1.name"
        }
        on_error => "_"
    }

    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.2.name"
        }
        on_error => "_"
    }



    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.3.name"
        }
        on_error => "_"
    }

    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.4.name"
        }
        on_error => "_"
    }


    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.5.name"
        }
        on_error => "_"
    }


    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.6.name"
        }
        on_error => "_"
    }


    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.7.name"
        }
        on_error => "_"
    }

    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.8.name"
        }
        on_error => "_"
    }

    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.9.name"
        }
        on_error => "_"
    }

    mutate {
        merge => {
            "entity.entity.user.group_identifiers" => "groups.10.name"
        }
        on_error => "_"
    }

    mutate {
        merge => {
            "entity.entity.user.phone_numbers" => "phones.0.number"
        }
        on_error => "_"
    }





    if [phones][0] != "" {
        mutate {
            replace => {
                "relation_entity.entity_type" => "ASSET"
                "relation_entity.relationship" => "OWNS"
                "relation_entity.entity.asset.type" => "MOBILE"

            }
        }
    }


    mutate {
        rename => {
            "phones.0.phone_id" => "relation_entity.entity.asset.product_object_id"
            "phones.0.model" => "hardware.model"

            "phones.0.platform" => "hardware.manufacturer"


        }
    }

    mutate {
        merge => {
            "relation_entity.entity.asset.hardware" => "hardware"
        }
        on_error => "_"
    }

    mutate {
        merge => {
            "entity.relations" => "relation_entity"
        }
        on_error => "_"
    }




    mutate {
        merge => {
            "entity.entity.user.email_addresses" => "email"
        }
        on_error => "email_invalid"
    }
    if ![email_invalid] {
        mutate {
            replace => {
                "user_present" => "true"
            }
        }
    }

    # new fields Mapping
    if [access_device][browser] != "" {
        mutate {
            replace => {
                "browser_label.key" => "access_device browser"
                "browser_label.value" => "%{access_device.browser}"
            }
            on_error => "browser_invalid"
        }
        if ![browser_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "browser_label"
                }
                on_error => "browser_label_merge_failed"
            }
        }
    }
    else if [surfaced_auth][access_device][browser] != "" {
        mutate {
            replace => {
                "browser_label.key" => "surfaced_auth access_device browser"
                "browser_label.value" => "%{surfaced_auth.access_device.browser}"
            }
            on_error => "browser_invalid_2"
        }
        if ![browser_invalid_2] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "browser_label"
                }
                on_error => "browser_label_merge_failed"
            }
        }
    }

    if [access_device][browser_version] != "" {
        mutate {
            replace => {
                "browser_version_label.key" => "access_device browser_version"
                "browser_version_label.value" => "%{access_device.browser_version}"
            }
            on_error => "browser_version_invalid"
        }
        if ![browser_version_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "browser_version_label"
                }
                on_error => "browser_version_label_merge_failed"
            }
        }
    }
    else if [surfaced_auth][access_device][browser_version] != "" {
        mutate {
            replace => {
                "browser_version_label.key" => "surfaced_auth access_device browser_version"
                "browser_version_label.value" => "%{surfaced_auth.access_device.browser_version}"
            }
            on_error => "browser_version_invalid_2"
        }
        if ![browser_version_invalid_2] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "browser_version_label"
                }
                on_error => "browser_version_label_merge_failed"
            }
        }
    }


    if [access_device][ip][address] != "" {
        mutate {
            merge => {
                "entity.entity.ip" => "access_device.ip.address"
            }
            on_error => "ip_address_merge_failed"
        }
        if ![ip_address_merge_failed] {
            mutate {
                replace => {
                    "ip_present" => "true"
                }
            }
        }
    }
    else {
        mutate {
            merge => {
                "entity.entity.ip" => "surfaced_auth.access_device.ip"
            }
            on_error => "ip_address_merge_failed_2"
        }
        if ![ip_address_merge_failed_2] {
            mutate {
                replace => {
                    "ip_present" => "true"
                }
            }
        }
    }

    if [triage_event_uri] != "" {
        mutate {
            replace => {
                "entity.entity.url" => "%{triage_event_uri}"
            }
            on_error => "triage_event_uri_invalid"
        }
    }

    if [access_device][location][city] != "" {
        mutate {
            replace => {
                "entity.entity.location.city" => "%{access_device.location.city}"
            }
            on_error => "city_invalid"
        }
    }
    else if [surfaced_auth][access_device][location][city] != "" {
        mutate {
            replace => {
                "entity.entity.location.city" => "%{surfaced_auth.access_device.location.city}"
            }
            on_error => "city_invalid_2"
        }
    }

    if [access_device][location][country] != "" {
        mutate {
            replace => {
                "entity.entity.location.country_or_region" => "%{access_device.location.country}"
            }
            on_error => "country_invalid"
        }
    }
    else if [surfaced_auth][access_device][location][country] != "" {
        mutate {
            replace => {
                "entity.entity.location.country_or_region" => "%{surfaced_auth.access_device.location.country}"
            }
            on_error => "country_invalid_2"
        }
    }

    if [access_device][location][state] != "" {
        mutate {
            replace => {
                "entity.entity.location.state" => "%{access_device.location.state}"
            }
            on_error => "state_invalid"
        }
    }
    else if [surfaced_auth][access_device][location][state] != "" {
        mutate {
            replace => {
                "entity.entity.location.state" => "%{surfaced_auth.access_device.location.state}"
            }
            on_error => "state_invalid_2"
        }
    }

    if [access_device][os] =~ "(?i)(ios|mac)" or [surfaced_auth][access_device][os] =~ "(?i)(ios)" {
        mutate {
            replace => {
              "entity.entity.asset.platform_software.platform" => "MAC"
            }
        }
    }
    else if [access_device][os] =~ "(?i)(windows)" or [surfaced_auth][access_device][os] =~ "(?i)(windows)" {
        mutate {
            replace => {
              "entity.entity.asset.platform_software.platform" => "WINDOWS"
            }
        }
    }
    else if [access_device][os] =~ "(?i)(linux)" or [surfaced_auth][access_device][os] =~ "(?i)(linux)" {
        mutate {
            replace => {
              "entity.entity.asset.platform_software.platform" => "LINUX"
            }
        }
    }

    if [access_device][os_version] != "" {
        mutate {
            replace => {
              "entity.entity.asset.platform_software.platform_version" => "%{access_device.os_version}"
            }
            on_error => "os_version_invalid"
        }
    }
    else if [surfaced_auth][access_device][os_version] != "" {
        mutate {
            replace => {
              "entity.entity.asset.platform_software.platform_version" => "%{surfaced_auth.access_device.os_version}"
            }
            on_error => "os_version_invalid_2"
        }
    }

    if [action] != "" {
        mutate {
            replace => {
                "sec_result.action_details" => "%{action}"
            }
            on_error => "action_nested"
        }
        if [action_nested] {
            mutate {
                replace => {
                    "sec_result.action_details" => "%{action.details}"
                }
                on_error => "action_details_invalid"
            }


            mutate {
                replace => {
                    "action_name_label.key" =>   "action_name"
                    "action_name_label.value" => "%{action.name}"
                }
                on_error => "action_name_invalid"
            }
            if ![action_name_invalid] {
                mutate {
                    merge => {
                        "sec_result.detection_fields" => "action_name_label"
                    }
                    on_error => "action_name_merge_failed"
                }
            }
        }
    }

    if [activity_id] not in ["", "null"] {
        mutate {
            replace => {
                "activity_id_label.key" => "activity_id"
                "activity_id_label.value" => "%{activity_id}"
            }
            on_error => "activity_id_invalid"
        }
        if ![activity_id_invalid] {
            mutate {
                merge => {
                    "sec_result.detection_fields" => "activity_id_label"
                }
                on_error => "activity_id_label_merge_failed"
            }
        }
    }

    if [actor][details][created] != "" {
        mutate {
            replace => {
                "created_label.key" => "created"
                "created_label.value" => "%{actor.details.created}"
            }
            on_error => "created_invalid"
        }
        if ![created_invalid] {
            mutate {
                merge => {
                    "entity.entity.user.attribute.labels" => "created_label"
                }
                on_error => "created_label_merge_failed"
            }
        }
    }

    if [actor][details][last_login] != "" {
        mutate {
            replace => {
                "last_login_label.key" => "last_login"
                "last_login_label.value" => "%{actor.details.last_login}"
            }
            on_error => "last_login_invalid"
        }
        if ![last_login_invalid] {
            mutate {
                merge => {
                    "entity.entity.user.attribute.labels" => "last_login_label"
                }
                on_error => "last_login_label_merge_failed"
            }
        }
    }

    if [actor][details][email] != "" {
        mutate {
            merge => {
                "entity.entity.user.email_addresses" => "actor.details.email"
            }
            on_error => "action_details_email_invalid"
        }
        if ![action_details_email_invalid] {
            mutate {
                replace => {
                    "user_present" => "true"
                }
            }
        }
    }

    if [actor][details][status] != "" {
        mutate {
            replace => {
                "status_label.key" => "status"
                "status_label.value" => "%{actor.details.status}"
            }
            on_error => "status_invalid"
        }
        if ![status_invalid] {
            mutate {
                merge => {
                    "entity.entity.user.attribute.labels" => "status_label"
                }
                on_error => "status_label_merge_failed"
            }
        }
    }

    for index, group in actor.details.groups {
        mutate {
            merge => {
                "entity.entity.user.group_identifiers" => "group.name"
            }
            on_error => "source_field_merge_failed"
        }
        mutate {
            merge => {
                "entity.entity.user.group_identifiers" => "group.key"
            }
            on_error => "source_field_merge_failed_2"
        }
    }

    if [actor][key] != "" {
        mutate {
            replace => {
                "entity.entity.resource.product_object_id" => "%{actor.key}"
                "resource_present" => "true"
            }
            on_error => "actor_key_invalid"
        }
    }

    if [actor][name] != "" {
        mutate {
            replace => {
                "entity.entity.user.user_display_name" => "%{actor.name}"
            }
            on_error => "actor_name_invalid"
        }
    }
    else if [surfaced_auth][user][name] != "" {
        mutate {
            replace => {
                "entity.entity.user.user_display_name" => "%{surfaced_auth.user.name}"
            }
            on_error => "user_name_empty"
        }
    }

    if [actor][type] != "" {
        mutate {
            replace => {
                "type_label.key" => "actor type"
                "type_label.value" => "%{actor.type}"
            }
            on_error => "type_invalid"
        }
        if ![type_invalid] {
            mutate {
                merge => {
                    "entity.entity.user.attribute.labels" => "type_label"
                }
                on_error => "type_label_merge_failed"
            }
        }
    }

    if [akey] != "" {
        mutate {
            replace => {
                "entity.metadata.product_entity_id" => "%{akey}"
            }
            on_error => "akey_invalid"
        }
    }
    else if [sekey] != "" {
        mutate {
            replace => {
                "entity.metadata.product_entity_id" => "%{sekey}"
            }
            on_error => "sekey_invalid"
        }
    }

    if [application] != "" {
        mutate {
            replace => {
                "entity.entity.application" => "%{application}"
            }
            on_error => "application_invalid"
        }
    }

    if [target][details][manufacturer] != "" {
        mutate {
            replace => {
                "asset_hardware.manufacturer" => "%{target.details.manufacturer}"
            }
            on_error => "manufacturer_invalid"
        }
    }

    if [target][details][model] != "" {
        mutate {
            replace => {
                "asset_hardware.model" => "%{target.details.model}"
            }
            on_error => "model_invalid"
        }
    }

    if [asset_hardware] != "" {
        mutate {
            merge => {
                "entity.entity.asset.hardware" => "asset_hardware"
            }
            on_error => "asset_hardware_merge_failed"
        }
    }

    if [target][details][os] != "" {
        mutate {
            replace => {
                "asset_software.name" => "%{target.details.os}"
            }
            on_error => "os_invalid"
        }
    }

    if [target][details][os_version] != "" {
        mutate {
            replace => {
                "asset_software.version" => "%{target.details.os_version}"
            }
            on_error => "os_version_invalid"
        }
    }

    if [asset_software] != "" {
        mutate {
            merge => {
                "entity.entity.asset.software" => "asset_software"
            }
            on_error => "asset_software_merge_failed"
        }
    }

    if [target][details][number] != "" {
        mutate {
            merge => {
                "entity.entity.user.phone_numbers" => "target.details.number"
            }
            on_error => "number_invalid"
        }
    }

    if [target][details][extension] != "" {
        mutate {
            replace => {
                "extension_label.key" => "extension"
                "extension_label.value" => "%{target.details.extension}"
            }
            on_error => "os_version_invalid"
        }
        if ![os_version_invalid] {
            mutate {
                merge => {
                    "entity.entity.asset.attribute.labels" => "extension_label"
                }
                on_error => "extension_label_merge_failed"
            }
        }
    }

    if [target][details][biometrics_status] != "" {
        mutate {
            replace => {
                "biometrics_status_label.key" => "biometrics_status"
                "biometrics_status_label.value" => "%{target.details.biometrics_status}"
            }
            on_error => "os_version_invalid"
        }
        if ![os_version_invalid] {
            mutate {
                merge => {
                    "entity.entity.asset.attribute.labels" => "biometrics_status_label"
                }
                on_error => "biometrics_status_label_merge_failed"
            }
        }
    }

    if [target][details][tampered_status] != "" {
        mutate {
            replace => {
                "tampered_status_label.key" => "tampered_status"
                "tampered_status_label.value" => "%{target.details.tampered_status}"
            }
            on_error => "os_version_invalid"
        }
        if ![os_version_invalid] {
            mutate {
                merge => {
                    "entity.entity.asset.attribute.labels" => "tampered_status_label"
                }
                on_error => "tampered_status_label_merge_failed"
            }
        }
    }

    if [target][details][passcode_status] != "" {
        mutate {
            replace => {
                "passcode_status_label.key" => "passcode_status"
                "passcode_status_label.value" => "%{target.details.passcode_status}"
            }
            on_error => "os_version_invalid"
        }
        if ![os_version_invalid] {
            mutate {
                merge => {
                    "entity.entity.asset.attribute.labels" => "passcode_status_label"
                }
                on_error => "passcode_status_label_merge_failed"
            }
        }
    }

    if [target][details][country_code] != "" {
        mutate {
            replace => {
                "country_code_label.key" => "country_code"
                "country_code_label.value" => "%{target.details.country_code}"
            }
            on_error => "os_version_invalid"
        }
        if ![os_version_invalid] {
            mutate {
                merge => {
                    "entity.entity.asset.attribute.labels" => "country_code_label"
                }
                on_error => "country_code_label_merge_failed"
            }
        }
    }

    if [target][key] != "" {
        mutate {
            replace => {
                "entity.entity.asset.asset_id" => "%{target.key}"
                "asset_mid_present" => "true"
            }
            on_error => "key_invalid"
        }
    }

    if [target][name] != "" {
        mutate {
            replace => {
                "name_label.key" => "name"
                "name_label.value" => "%{target.name}"
            }
            on_error => "name_invalid"
        }
        if ![name_invalid] {
            mutate {
                merge => {
                    "entity.entity.asset.attribute.labels" => "name_label"
                }
                on_error => "name_label_merge_failed"
            }
        }
    }

    if [target][type] != "" {
        mutate {
            replace => {
                "type_label.key" => "type"
                "type_label.value" => "%{target.type}"
            }
            on_error => "type_invalid"
        }
        if ![type_invalid] {
            mutate {
                merge => {
                    "entity.entity.asset.attribute.labels" => "type_label"
                }
                on_error => "type_label_merge_failed"
            }
        }
    }

    for explanation in explanations {
        for key, value in explanation map {
            mutate {
                replace => {
                    "explanation_map_label" => ""
                    "explanation_map_label.key" => ""
                    "explanation_map_label.value" => ""
                }
            }

            if [key] != "" {
                mutate {
                    replace => {
                        "explanation_map_label.key" => "explanation %{key}"
                    }
                    on_error => "key_invalid"
                }
                if ![key_invalid] and [value] != "" {
                    mutate {
                        replace => {
                            "explanation_map_label.value" => "%{value}"
                        }
                        on_error => "value_nested"
                    }
                    if ![value_nested] {
                        mutate {
                            merge => {
                                "entity.entity.resource.attribute.labels" => "explanation_map_label"
                            }
                            on_error => "explanation_map_label_merge_failed"
                        }
                    }
                }
            }
        }
    }

    if [from_common_netblock] != "" {
        mutate {
            convert => {
                "from_common_netblock" => "string"
            }
            on_error => "conversion_failed"
        }

        mutate {
            replace => {
                "from_common_netblock_label.key" => "from_common_netblock"
                "from_common_netblock_label.value" => "%{from_common_netblock}"
            }
            on_error => "from_common_netblock_invalid"
        }
        if ![from_common_netblock_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "from_common_netblock_label"
                }
                on_error => "from_common_netblock_label_merge_failed"
            }
        }
    }

    if [from_new_user] != "" {
        mutate {
            convert => {
                "from_new_user" => "string"
            }
            on_error => "conversion_failed"
        }

        mutate {
            replace => {
                "from_new_user_label.key" => "from_new_user"
                "from_new_user_label.value" => "%{from_new_user}"
            }
            on_error => "from_new_user_invalid"
        }
        if ![from_new_user_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "from_new_user_label"
                }
                on_error => "from_new_user_label_merge_failed"
            }
        }
    }

    if [low_risk_ip] != "" {
        mutate {
            convert => {
                "low_risk_ip" => "string"
            }
            on_error => "conversion_failed"
        }

        mutate {
            replace => {
                "low_risk_ip_label.key" => "low_risk_ip"
                "low_risk_ip_label.value" => "%{low_risk_ip}"
            }
            on_error => "low_risk_ip_invalid"
        }
        if ![low_risk_ip_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "low_risk_ip_label"
                }
                on_error => "low_risk_ip_label_merge_failed"
            }
        }
    }

    if [priority_event] != "" {
        mutate {
            convert => {
                "priority_event" => "string"
            }
            on_error => "conversion_failed"
        }

        mutate {
            replace => {
                "priority_event_label.key" => "priority_event"
                "priority_event_label.value" => "%{priority_event}"
            }
            on_error => "priority_event_invalid"
        }
        if ![priority_event_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "priority_event_label"
                }
                on_error => "priority_event_label_merge_failed"
            }
        }
    }

    if [state] != "" {
        mutate {
            convert => {
                "state" => "string"
            }
            on_error => "conversion_failed"
        }

        mutate {
            replace => {
                "state_label.key" => "state"
                "state_label.value" => "%{state}"
            }
            on_error => "state_invalid"
        }
        if ![state_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "state_label"
                }
                on_error => "state_label_merge_failed"
            }
        }
    }

    if [triaged_as_interesting] != "" {
        mutate {
            convert => {
                "triaged_as_interesting" => "string"
            }
            on_error => "conversion_failed"
        }

        mutate {
            replace => {
                "triaged_as_interesting_label.key" => "triaged_as_interesting"
                "triaged_as_interesting_label.value" => "%{triaged_as_interesting}"
            }
            on_error => "triaged_as_interesting_invalid"
        }
        if ![triaged_as_interesting_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "triaged_as_interesting_label"
                }
                on_error => "triaged_as_interesting_label_merge_failed"
            }
        }
    }

    if [type] != "" {
        mutate {
            convert => {
                "type" => "string"
            }
            on_error => "conversion_failed"
        }

        mutate {
            replace => {
                "type_label.key" => "type"
                "type_label.value" => "%{type}"
            }
            on_error => "type_invalid"
        }
        if ![type_invalid] {
            mutate {
                merge => {
                    "entity.entity.resource.attribute.labels" => "type_label"
                }
                on_error => "type_label_merge_failed"
            }
        }
    }

    if [metadata_entity_type] in ["", "UNKNOWN_ENTITYTYPE"] {
        if [user_present] == "true" {
            mutate {
                replace => {
                    "metadata_entity_type" => "USER"
                }
            }
        }
        else if [asset_mid_present] == "true" {
            mutate {
                replace => {
                    "metadata_entity_type" => "ASSET"
                }
            }
        }
        else if [ip_present] == "true" {
            mutate {
                replace => {
                    "metadata_entity_type" => "IP_ADDRESS"
                }
            }
        }
        else if [resource_present] == "true" {
            mutate {
                replace => {
                    "metadata_entity_type" => "RESOURCE"
                }
            }
        }
    }

    if [metadata_entity_type] != "" {
        mutate {
            replace => {
                "entity.metadata.entity_type" => "%{metadata_entity_type}"
            }
            on_error => "metadata_entity_type_empty"
        }
    }
    else {
        mutate {
            replace => {
                "entity.metadata.entity_type" => "UNKNOWN_ENTITYTYPE"
            }
        }
    }

    mutate {
        rename => {
            "entity" => "event.idm.entity"
        }
    }

    mutate {
        merge => {
             "@output" =>"event"
        }
    }
}
