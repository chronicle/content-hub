# Product: PHISHLABS
# Category: Digital Risk Protection
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-03-22
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "created" => ""
      "closed" => ""
      "description" => ""
      "duration" => ""
      "details.classification" => ""
      "details.emailBody" => ""
      "details.emailReportedBy" => ""
      "details.furtherReviewReason" => ""
      "details.messageID" => ""
      "details.offlineUponReview" => ""
      "details.submissionMethod" => ""
      "details.severity" => ""
      "details.sender" => ""
      "headerReplyTo" => ""
      "id" => ""
      "sender_email" => ""
      "service" => ""
      "sender" => ""
      "security_result" => ""
      "status" => ""
      "title" => ""
      "user_name" => ""
      "src_email" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [created] != "" {
    date {
      match => ["created", "ISO8601"]
      on_error => "created_timestamp_failure"
    }
  }

  if [id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id}"
      }
      on_error => "no_id"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  if [details][sender] != "" {
    grok {
      match => {
        "details.sender" => "%{DATA:user_name} <%{DATA:sender_email}>"
      }
      overwrite => ["sender_email", "user_name"]
      on_error => "no_sender_email"
    }
    if ![no_sender_email] and [sender_email] =~ "^.+@.+$" {
      mutate {
        replace => {
          "network.email.from" => "%{sender_email}"
        }
        on_error => "no_from"
      }
      mutate {
        replace => {
          "principal.user.user_display_name" => "%{user_name}"
        }
        on_error => "no_user_name"
      }
    }
  }

  if [details][messageID] != "" and [details][messageID] =~ "^.+@.+$" {
    mutate {
      replace => {
        "network.email.mail_id" => "%{details.messageID}"
      }
      on_error => "no_msgid"
    }
  }

  for detailUrl in details.urls {
    mutate {
      replace => {
        "sec_res" => ""
        "url_label" => ""
        "malicious_label" => ""
        "malicious_domain_label" => ""
      }
    }
    mutate {
      merge => {
        "principal.process.file.embedded_urls" => "detailUrl.url"
      }
      on_error => "no_url"
    }

    mutate {
      replace => {
        "url_label.value" => "%{detailUrl.url}"
        "url_label.key" => "url"
      }
      on_error => "no_url_value"
    }
    if ![no_url_value] {
      mutate {
        merge => {
          "sec_res.detection_fields" => "url_label"
        }
        on_error => "no_url_label"
      }
    }

    mutate {
      convert => {
        "detailUrl.malicious" => "string"
      }
      on_error => "conversion_error"
    }

    mutate {
      replace => {
        "malicious_label.value" => "%{detailUrl.malicious}"
        "malicious_label.key" => "malicious"
      }
      on_error => "no_malicious"
    }
    if ![no_malicious] {
      mutate {
        merge => {
          "sec_res.detection_fields" => "malicious_label"
        }
        on_error => "no_malicious_label"
      }
    }

    mutate {
      convert => {
        "detailUrl.maliciousDomain" => "string"
      }
      on_error => "conversion_error"
    }

    mutate {
      replace => {
        "malicious_domain_label.value" => "%{detailUrl.maliciousDomain}"
        "malicious_domain_label.key" => "maliciousDomain"
      }
      on_error => "no_malicious_domain"
    }
    if ![no_malicious_domain] {
      mutate {
        merge => {
          "sec_res.detection_fields" => "malicious_domain_label"
        }
        on_error => "no_malicious_domain_label"
      }
    }

    if [sec_res] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "sec_res"
        }
        on_error => "no_sec_res"
      }
    }
  }

  for emailData in details.emailAddresses {
    mutate {
      convert => {
        "emailData.headerReplyTo" => "string"
      }
      on_error => "convert_error"
    }
    mutate {
      convert => {
        "emailData.sender" => "string"
      }
      on_error => "convert_error"
    }
    mutate {
      replace => {
        "headerReplyTo" => "%{emailData.headerReplyTo}"
      }
      on_error => "no_data"
    }
    mutate {
      replace => {
        "sender" => "%{emailData.sender}"
      }
      on_error => "no_sender"
    }
    if [headerReplyTo] =~ "(?i)true" and [emailData][address] =~ "^.+@.+$" {
      mutate {
        replace => {
          "network.email.reply_to" => "%{emailData.address}"
        }
        on_error => "no_mail"
      }
    }
    else if [sender] =~ "(?i)false" and [emailData][address] =~ "^.+@.+$" {
      mutate {
        merge => {
          "network.email.to" => "emailData.address"
        }
        on_error => "no_to_mail"
      }
    }
  }

  if [details][classification] != "" {
    mutate {
      replace => {
        "security_result.threat_name" => "%{details.classification}"
      }
      on_error => "no_classification"
    }
  }

  if [details][severity] != "" {
    mutate {
      uppercase => ["details.severity"]
    }
    if [details][severity] in ["LOW", "MEDIUM", "HIGH", "CRITICAL"] {
      mutate {
        replace => {
          "security_result.severity" => "%{details.severity}"
        }
        on_error => "no_severity"
      }
    }
  }

  if [details][furtherReviewReason] != "" {
    mutate {
      replace => {
        "furtherReviewReason_label.key" => "furtherReviewReason"
        "furtherReviewReason_label.value" => "%{details.furtherReviewReason}"
      }
      on_error => "no_furtherReviewReason"
    }
    if ![no_furtherReviewReason] {
      mutate {
        merge => {
          "security_result.detection_fields" => "furtherReviewReason_label"
        }
        on_error => "field_not_found"
      }
    }
  }

  if [details][subClassification] != "" {
    mutate {
      replace => {
        "subClassification_label.key" => "subClassification"
        "subClassification_label.value" => "%{details.subClassification}"
      }
      on_error => "no_subClassification"
    }
    if ![no_subClassification] {
      mutate {
        merge => {
          "security_result.detection_fields" => "subClassification_label"
        }
        on_error => "field_not_found"
      }
    }
  }

  if [details][caseType] != "" {
    mutate {
      replace => {
        "caseType_label.key" => "caseType"
        "caseType_label.value" => "%{details.caseType}"
      }
      on_error => "no_caseType"
    }
    if ![no_caseType] {
      mutate {
        merge => {
          "security_result.detection_fields" => "caseType_label"
        }
        on_error => "field_not_found"
      }
    }
  }

  if [details][emailBody] != "" {
    mutate {
      replace => {
        "emailBody_label.key" => "emailBody"
        "emailBody_label.value" => "%{details.emailBody}"
      }
      on_error => "no_emailBody"
    }
    if ![no_emailBody] {
      mutate {
        merge => {
          "security_result.detection_fields" => "emailBody_label"
        }
        on_error => "field_not_found"
      }
    }
  }

  if [details][submissionMethod] != "" {
    mutate {
      replace => {
        "submissionMethod_label.key" => "submissionMethod"
        "submissionMethod_label.value" => "%{details.submissionMethod}"
      }
      on_error => "no_submissionMethod"
    }
    if ![no_submissionMethod] {
      mutate {
        merge => {
          "security_result.detection_fields" => "submissionMethod_label"
        }
        on_error => "field_not_found"
      }
    }
  }

  if [service] != "" {
    mutate {
      replace => {
        "service_field.key" => "Service"
        "service_field.value.string_value" => "%{service}"
      }
      on_error => "service_error"
    }
    if ![service_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "service_field"
        }
        on_error => "service_merge_error"
      }
    }
  }

  if [closed] != "" {
    mutate {
      replace => {
        "closed_field.key" => "closed"
        "closed_field.value.string_value" => "%{closed}"
      }
      on_error => "closed_error"
    }
    if ![closed_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "closed_field"
        }
        on_error => "closed_merge_error"
      }
    }
  }

  if [status] != "" {
    mutate {
      replace => {
        "status_field.key" => "Status"
        "status_field.value.string_value" => "%{status}"
      }
      on_error => "status_error"
    }
    if ![status_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "status_field"
        }
        on_error => "status_merge_error"
      }
    }
  }

  if [title] != "" {
    mutate {
      merge => {
        "network.email.subject" => "title"
      }
      on_error => "no_title"
    }
  }

  if [duration] != "" {
    mutate {
      convert => {
        "duration" => "string"
      }
      on_error => "conversion_error"
    }
    mutate {
      replace => {
        "network.session_duration.seconds" => "%{duration}"
      }
      convert => {
        "network.session_duration.seconds" => "integer"
      }
      on_error => "no_duration"
    }
  }


  if [details][emailReportedBy] != "" {
    grok {
      match => {
        "details.emailReportedBy" => [
          "<%{EMAILADDRESS:src_email}>"
        ]
      }
      overwrite => ["src_email"]
      on_error => "no_email_reported"
    }
    mutate {
      replace => {
        "emailReportedBy_field.key" => "emailReportedBy"
        "emailReportedBy_field.value.string_value" => "%{details.emailReportedBy}"
      }
      on_error => "emailReportedBy_error"
    }
    if ![emailReportedBy_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "emailReportedBy_field"
        }
        on_error => "emailReportedBy_merge_error"
      }
    }
  }

  if [src_email] != "" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "src_email"
      }
      on_error => "no_src_email"
    }
  }

  if [details][emailReceivedDate] != "" {
    mutate {
      replace => {
        "emailReceivedDate_field.key" => "emailReceivedDate"
        "emailReceivedDate_field.value.string_value" => "%{details.emailReceivedDate}"
      }
      on_error => "emailReceivedDate_error"
    }
    if ![emailReceivedDate_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "emailReceivedDate_field"
        }
        on_error => "emailReceivedDate_merge_error"
      }
    }
  }

  if [details][payloadFamily] != "" {
    mutate {
      replace => {
        "payloadFamily_field.key" => "payloadFamily"
        "payloadFamily_field.value.string_value" => "%{details.payloadFamily}"
      }
      on_error => "payloadFamily_error"
    }
    if ![payloadFamily_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "payloadFamily_field"
        }
        on_error => "payloadFamily_merge_error"
      }
    }
  }

  if [details][offlineUponReview] != "" {
    mutate {
      convert => {
        "details.offlineUponReview" => "string"
      }
      on_error => "conversion_error"
    }
    mutate {
      replace => {
        "offlineUponReview_field.key" => "offlineUponReview"
        "offlineUponReview_field.value.string_value" => "%{details.offlineUponReview}"
      }
      on_error => "offlineUponReview_error"
    }
    if ![offlineUponReview_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "offlineUponReview_field"
        }
        on_error => "offlineUponReview_merge_error"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_resuly"
    }
  }

  mutate {
    replace => {
      "metadata.event_type" => "EMAIL_UNCATEGORIZED"
      "metadata.vendor_name" => "PHISHLABS"
      "metadata.product_name" => "PHISHLABS"
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "network" => "event.idm.read_only_udm.network"
      "metadata" => "event.idm.read_only_udm.metadata"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
