# Product: AppOmni
# Category: SAAS Security Application
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-08-31
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "user_mail" => ""
      "src_user_mail" => ""
      "user_tar_mail" => ""
      "dst_user_mail" => ""
      "user_eft_mail" => ""
      "user_change_mail" => ""
      "user_roles_flag" => ""
      "usr_target_roles" => ""
      "dst_host_type" => ""
      "principal_userid_present" => ""
      "target_userid_present" => ""
      "principal_machineid_present" => ""
      "target_machineid_present" => ""
      "extensions_auth_present" => ""
      "target_resource_present" => ""
      "file_extension" => ""
      "src_host_mac" => ""
      "src_mac" => ""
      "dst_mac" => ""
      "target" => ""
      "sec_res_action" => ""
      "has_normal_state_authentication_raw_method_count" => "false"
      "has_normal_state_authentication_raw_method_results" => "false"
      "has_normal_state_authentication_name_results" => "false"
      "has_normal_state_authentication_name_counts" => "false"
      "has_rare_state_authentication_raw_method_count" => "false"
      "has_rare_state_authentication_raw_method_results" => "false"
      "has_rare_state_authentication_name_results" => "false"
      "has_rare_state_authentication_name_counts" => "false"
      "has_normal_state_domain_results" => "false"
      "has_normal_state_domain_counts" => "false"
      "has_rare_state_domain_results" => "false"
      "has_rare_state_domain_counts" => "false"
      "raw_event_kind" => ""
      "source_host_type" => ""
      "user_agent_os_name" => ""
      "organization_uuid" => ""
      "no_related_ip" => "true"
    }
  }
  mutate {
    rename => {
      "message" => "raw_message"
    }
  }
  json {
    source => "raw_message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
    }
  }

  # Rename event object of raw log
  mutate {
    rename => {
      "event" => "raw_event"
    }
  }

  mutate {
    replace => {
      "token_event_id.value.string_value" => "%{raw_event.id}"
    }
    on_error => "no_event_id"
  }
  if ![no_event_id] and [raw_event][id] != "" {
    mutate {
      replace => {
        "token_event_id.key" => "event_id"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_id"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "token_event_code.value.string_value" => "%{raw_event.code}"
    }
    on_error => "no_event_code"
  }
  if ![no_event_code] and [raw_event][code] != "" {
    mutate {
      replace => {
        "token_event_code.key" => "event_code"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_code"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "token_event_kind.value.string_value" => "%{raw_event.kind}"
    }
    on_error => "no_event_kind"
  }
  if ![no_event_kind] and [raw_event][kind] != "" {
    mutate {
      replace => {
        "token_event_kind.key" => "event_kind"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_kind"
      }
      on_error => "_"
    }
  }

  for index, ev_cat in raw_event.category {
    mutate {
      replace => {
        "token_event_category" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
    }
    mutate {
      replace => {
        "token_event_category.value.string_value" => "%{ev_cat}"
      }
      on_error => "no_event_category"
    }
    if ![no_event_category] and [raw_event][category] != "" {
      mutate {
        replace => {
          "token_event_category.key" => "event_category_%{index}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "token_event_category"
        }
        on_error => "_"
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_event_type" => "%{raw_event.action}"
    }
    on_error => "no_raw_event_action"
  }

  mutate {
    replace => {
      "sec_res.action_details" => "%{raw_event.outcome}"
    }
    on_error => "no_raw_event_outcome"
  }

  if ![no_raw_event_outcome] {
    if [raw_event][outcome] == "success" {
      mutate {
        replace => {
          "sec_res_action" => "ALLOW"
        }
        on_error => "_"
      }
    }
    else if [raw_event][outcome] == "failure" {
      mutate {
        replace => {
          "sec_res_action" => "FAIL"
        }
        on_error => "_"
      }
    }
    if [sec_res_action] != "" {
      mutate {
        merge => {
          "sec_res.action" => "sec_res_action"
        }
        on_error => "_"
      }
    }
  }

  for index, e_type in raw_event.type {
    mutate {
      replace => {
        "token_event_type" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "_"
    }
    mutate {
      replace => {
        "token_event_type.value.string_value" => "%{e_type}"
      }
      on_error => "no_event_type"
    }
    if ![no_event_type] and [raw_event][type] != "" {
      mutate {
        replace => {
          "token_event_type.key" => "event_type_%{index}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "token_event_type"
        }
        on_error => "_"
      }
    }
  }
  mutate {
    replace => {
      "raw_module" => "%{raw_event.module}"
    }
    on_error => "raw_module_error"
  }
  if ![raw_module_error] and [raw_event][module] != "" {
    mutate {
      replace => {
        "principal.application" => "%{raw_event.module}"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "metadata.log_type" => "%{raw_event.dataset}"
    }
    on_error => "no_event_dataset"
  }
  mutate {
    replace => {
      "raw_event_kind" => "%{raw_event.kind}"
    }
    on_error => "no_event_kind"
  }
  if [raw_event_kind] == "alert" {
    mutate {
      replace => {
        "sec_res.alert_state" => "ALERTING"
      }
      on_error => "no_alert_state"
    }
  }
  else if [raw_event_kind] == "event" {
    mutate {
      replace => {
        "sec_res.alert_state" => "NOT_ALERTING"
      }
      on_error => "no_alert_state"
    }
  }
  else {
    mutate {
      replace => {
        "sec_res.alert_state" => "UNSPECIFIED"
      }
      on_error => "no_alert_state"
    }
  }

  mutate {
    replace => {
      "security_result.action_details" => "%{appomni.event.dataset}"
    }
    on_error => "no_raw_event_dataset"
  }
  mutate {
    convert => {
      "raw_event.duration" => "string"
    }
    on_error => "no_raw_event_duration"
  }
  mutate {
    replace => {
      "event_duration.value.string_value" => "%{raw_event.duration}"
    }
    on_error => "no_raw_event_created"
  }
  if ![no_raw_event_created] {
    mutate {
      replace => {
        "event_duration.key" => "event_duration"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "event_duration"
      }
      on_error => "no_raw_event_duration"
    }
  }
  mutate {
    replace => {
      "token_event_provider.value.string_value" => "%{raw_event.provider}"
    }
    on_error => "no_event_provider"
  }
  if ![no_event_provider] and [raw_event][provider] != "" {
    mutate {
      replace => {
        "token_event_provider.key" => "event_provider"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_provider"
      }
      on_error => "_"
    }
  }

  mutate {
    convert => {
      "raw_event.severity" => "string"
    }
    on_error => "_"
  }

  mutate {
    replace => {
      "sec_res.severity_details" => "%{raw_event.severity}"
    }
    on_error => "no_event_severity"
  }

  if ![no_event_severity] {
    if [raw_event][severity] == "0" {
      mutate {
        replace => {
          "sec_res.severity" => "CRITICAL"
        }
        on_error => "_"
      }
    }
    else if [raw_event][severity] == "1" {
      mutate {
        replace => {
          "sec_res.severity" => "HIGH"
        }
        on_error => "_"
      }
    }
    else if [raw_event][severity] == "2" {
      mutate {
        replace => {
          "sec_res.severity" => "MEDIUM"
        }
        on_error => "_"
      }
    }
    else if [raw_event][severity] == "3" {
      mutate {
        replace => {
          "sec_res.severity" => "LOW"
        }
        on_error => "_"
      }
    }
    else if [raw_event][severity] == "4" {
      mutate {
        replace => {
          "sec_res.severity" => "INFORMATIONAL"
        }
        on_error => "_"
      }
    }
  }

  mutate {
    replace => {
      "token_event_original.value.string_value" => "%{raw_event.original}"
    }
    on_error => "no_event_original"
  }
  if ![no_event_original] and [raw_event][original] != "" {
    mutate {
      replace => {
        "token_event_original.key" => "event_original"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_original"
      }
      on_error => "_"
    }
  }

  mutate {
    convert => {
      "raw_event.sequence" => "string"
    }
    on_error => "_"
  }
  mutate {
    replace => {
      "token_event_sequence.value.string_value" => "%{raw_event.sequence}"
    }
    on_error => "no_event_sequence"
  }
  if ![no_event_sequence] and [raw_event][sequence] != "" {
    mutate {
      replace => {
        "token_event_sequence.key" => "event_sequence"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_sequence"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "token_event_created.value.string_value" => "%{raw_event.created}"
    }
    on_error => "no_event_created"
  }
  if ![no_event_created] and [raw_event][created] != "" {
    mutate {
      replace => {
        "token_event_created.key" => "event_created"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_created"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "token_event_start.value.string_value" => "%{raw_event.start}"
    }
    on_error => "no_event_start"
  }
  if ![no_event_start] and [raw_event][start] != "" {
    mutate {
      replace => {
        "token_event_start.key" => "event_start"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_start"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "token_event_end.value.string_value" => "%{raw_event.end}"
    }
    on_error => "no_event_end"
  }
  if ![no_event_end] and [raw_event][end] != "" {
    mutate {
      replace => {
        "token_event_end.key" => "event_end"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_event_end"
      }
      on_error => "_"
    }
  }

  mutate {
    convert => {
      "raw_event.risk_score" => "string"
    }
    on_error => "_"
  }

  mutate {
    replace => {
      "sec_res.risk_score" => "%{raw_event.risk_score}"
    }
    on_error => "_"
  }
  mutate {
    convert => {
      "sec_res.risk_score" => "float"
    }
    on_error => "_"
  }

  mutate {
    convert => {
      "raw_event.risk_score_norm" => "string"
    }
    on_error => "_"
  }
  mutate {
    replace => {
      "token_event_risk_score_norm.value" => "%{raw_event.risk_score_norm}"
    }
    on_error => "no_event_risk_score_norm"
  }
  if ![no_event_risk_score_norm] and [raw_event][risk_score_norm] != "" {
    mutate {
      replace => {
        "token_event_risk_score_norm.key" => "event_risk_score_norm"
      }
    }
    mutate {
      merge => {
        "sec_res.detection_fields" => "token_event_risk_score_norm"
      }
      on_error => "_"
    }
  }

  date {
    match => ["raw_event.ingested", "RFC3339", "UNIX", "ISO8601"]
    target => "metadata.ingested_timestamp"
    on_error => "no_ingested_timestamp"
  }

  mutate {
    replace => {
      "metadata.url_back_to_product" => "%{raw_event.reference}"
    }
    on_error => "_"
  }

  mutate {
    replace => {
      "target.url" => "%{raw_event.url}"
    }
    on_error => "no_event_url"
  }
  mutate {
    replace => {
      "sec_res.description" => "%{raw_event.reason}"
    }
    on_error => "_"
  }

  mutate {
    replace => {
      "token_appomni_alert_channel.value.string_value" => "%{appomni.alert.channel}"
    }
    on_error => "no_appomni_alert_channel"
  }
  if ![no_appomni_alert_channel] and [appomni][alert][channel] != "" {
    mutate {
      replace => {
        "token_appomni_alert_channel.key" => "appomni_alert_channel"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_appomni_alert_channel"
      }
      on_error => "_"
    }
  }

  for index, service_type in appomni.service.type {
    if [index] == 0 {
      mutate {
        replace => {
          "principal.resource.resource_subtype" => "%{service_type}"
        }
        on_error => "_"
      }
    }
    else {
      mutate {
        replace => {
          "token_appomni_service_type" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
      }
      mutate {
        replace => {
          "token_appomni_service_type.value" => "%{appomni.service.type}"
        }
        on_error => "no_appomni_service_type"
      }
      mutate {
        replace => {
          "token_appomni_service_type.key" => "appomni_service_type_%{index}"
        }
        on_error => "no_key"
      }
      if ![no_appomni_service_type] and ![no_key] and
      [appomni][service][type] != "" {
        mutate {
          merge => {
            "principal.labels" => "token_appomni_service_type"
          }
          on_error => "_"
        }
      }
    }
  }

  for index, service_id in appomni.service.id {
    mutate {
      convert => {
        "service_id" => "string"
      }
      on_error => "_"
    }
    if [index] == 0 {
      mutate {
        replace => {
          "principal.resource.product_object_id" => "%{service_id}"
        }
        on_error => "_"
      }
    }
    else {
      mutate {
        replace => {
          "token_service_id" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
      }
      mutate {
        replace => {
          "token_service_id.value" => "%{service_id}"
        }
        on_error => "no_service_id"
      }
      mutate {
        replace => {
          "token_service_id.key" => "appomni_service_id_%{index}"
        }
        on_error => "no_service_id_value"
      }
      if ![no_service_id] and ![no_service_id_value] and [service_id] != "" {
        mutate {
          merge => {
            "principal.labels" => "token_service_id"
          }
          on_error => "_"
        }
      }
    }
  }

  mutate {
    replace => {
      "principal.resource.resource_type" => "BACKEND_SERVICE"
    }
  }

  for index, service_acc in appomni.service.account_id {
    mutate {
      replace => {
        "pri_res_ans" => ""
      }
    }
    mutate {
      replace => {
        "pri_res_ans.product_object_id" => "%{service_acc}"
      }
      on_error => "_"
    }
    if [pri_res_ans] != "" {
      mutate {
        merge => {
          "principal.resource_ancestors" => "pri_res_ans"
        }
        on_error => "_"
      }
    }
  }

  for index, service_name in appomni.service.name {
    if [index] == 0 {
      mutate {
        replace => {
          "principal.resource.name" => "%{service_name}"
        }
        on_error => "_"
      }
    }
    else {
      mutate {
        replace => {
          "token_service_name" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
      }
      mutate {
        replace => {
          "token_service_name.value" => "%{appomni_service_name}"
        }
        on_error => "no_service_name"
      }
      mutate {
        replace => {
          "token_service_name.key" => "service_name_%{index}"
        }
        on_error => "no_service_name_value"
      }
      if ![no_service_name] and ![no_service_name_value] and
      [service_name] != "" {
        mutate {
          merge => {
            "principal.labels" => "token_service_name"
          }
          on_error => "_"
        }
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_log_id" => "%{appomni.event.id}"
    }
    on_error => "_"
  }


  mutate {
    replace => {
      "token_appomni_event_sortable_ingest_id.value.string_value" => "%{appomni.event.sortable_ingest_id}"
    }
    on_error => "no_appomni_event_sortable_ingest_id"
  }
  if ![no_appomni_event_sortable_ingest_id] and [appomni][event][sortable_ingest_id] != "" {
    mutate {
      replace => {
        "token_appomni_event_sortable_ingest_id.key" => "appomni_event_sortable_ingest_id"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_appomni_event_sortable_ingest_id"
      }
      on_error => "token_appomni_event_sortable_ingest_id_empty"
    }
  }

  mutate {
    replace => {
      "token_appomni_event_sortable_event_id.value.string_value" => "%{appomni.event.sortable_event_id}"
    }
    on_error => "no_appomni_event_sortable_event_id"
  }
  if ![no_appomni_event_sortable_event_id] and [appomni][event][sortable_event_id] != "" {
    mutate {
      replace => {
        "token_appomni_event_sortable_event_id.key" => "appomni_event_sortable_event_id"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_appomni_event_sortable_event_id"
      }
      on_error => "token_appomni_event_sortable_event_id_empty"
    }
  }

  mutate {
    replace => {
      "token_appomni_event_parent_id.value.string_value" => "%{appomni.event.parent_id}"
    }
    on_error => "no_appomni_event_parent_id"
  }
  if ![no_appomni_event_parent_id] and [appomni][event][parent_id] != "" {
    mutate {
      replace => {
        "token_appomni_event_parent_id.key" => "appomni_event_parent_id"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_appomni_event_parent_id"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "token_appomni_event_ingestion_time.value.string_value" =>
      "%{appomni.event.ingestion_time}"
    }
    on_error => "no_appomni_event_ingestion_time"
  }
  if ![no_appomni_event_ingestion_time] and
  [appomni][event][ingestion_time] != "" {
    mutate {
      replace => {
        "token_appomni_event_ingestion_time.key" =>
        "appomni_event_ingestion_time"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_appomni_event_ingestion_time"
      }
      on_error => "_"
    }
  }

  date {
    match => ["appomni.event.collected_time", "RFC3339", "UNIX", "ISO8601"]
    target => "metadata.collected_timestamp"
    on_error => "no_timestamp"
  }

  mutate {
    convert => {
      "appomni.organization.id" => "string"
    }
    on_error => "_"
  }
  mutate {
    replace => {
      "token_appomni_organization_id.value.string_value" => "%{appomni.organization.id}"
    }
    on_error => "no_appomni_organization_id"
  }
  if ![no_appomni_organization_id] and [appomni][organization][id] != "" {
    mutate {
      replace => {
        "token_appomni_organization_id.key" => "appomni_organization_id"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "token_appomni_organization_id"
      }
      on_error => "_"
    }
  }

  if ![no_appomni_organization_id] {
    mutate {
      replace => {
        "princ_res_ans.product_object_id" => "%{appomni.organization.id}"
      }
      on_error => "_"
    }
    mutate {
      replace => {
        "princ_res_ans.resource_type" => "CLOUD_ORGANIZATION"
      }
      on_error => "_"
    }

    mutate {
      replace => {
        "princ_res_ans.resource_subtype" => "AppOmni Organization"
      }
