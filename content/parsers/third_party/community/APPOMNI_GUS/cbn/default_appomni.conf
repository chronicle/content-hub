    [principal_machineid_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_CREATION"
        }
      }
    }
  }

  else if [raw_event][action] == "remove_user" {
    if ([target_userid_present] == "true" and
    [principal_userid_present] == "true") and
    [principal_machineid_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_DELETION"
        }
      }
    }
  }

  else if [raw_event][action] in ["login_user", "unlock_user"] {
    if [target] != "" and [extensions_auth_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGIN"
        }
      }
    }
  }

  else if [raw_event][action] in ["end_session", "logout_user", "lock_user"] {
    if [target] != "" and [extensions_auth_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGOUT"
        }
      }
    }
  }

  else if [raw_event][action] in ["add_device", "create_api", "create_share",
  "create_task", "create_webhook"] {
    if [principal_userid_present] == "true" and
    [target_resource_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_RESOURCE_CREATION"
        }
      }
    }
  }

  else if [raw_event][action] in ["update_app", "update_user",
  "update_resource", "add_mfa", "update_key", "remove_mfa", "enable_app",
  "update_permission", "add_app", "add_domain", "add_key", "add_policy",
  "add_resource", "complete_task", "update_api", "update_authentication",
  "update_package", "update_project", "update_project_card",
  "update_project_column", "update_pull_request", "update_task",
  "update_webhook", "upgrade_app"] {
    if [principal_userid_present] == "true" and
    [target_resource_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
        }
      }
    }
  }

  else if [raw_event][action] in ["add_permission", "approve_user",
  "assign_issue", "block_user", "disable_webhook", "enable_api", "enable_mfa",
  "enable_webhook", "query_api", "read_share", "remove_permission",
  "revoke_api", "update_access", "verify_webhook"] {
    if [principal_userid_present] == "true" and
    [target_resource_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
        }
      }
    }
  }

  if [metadata][event_type] == "GENERIC_EVENT" {
    if [principal_machineid_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else if [principal_userid_present] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
  }

  if [raw_event][action] == "notify_workflow" {
    mutate {
      replace => {
        "metadata.event_type" => "EMAIL_UNCATEGORIZED"
      }
    }
  }
  else if [raw_event][action] in ["unknown", "favorite_resource",
  "follow_resource", "revoke_csr", "share_resource", "synchronize_account",
  "synchronize_resource", "unfavorite_resource", "unfollow_resource",
  "unlock_account", "unlock_resource", "unlock_token", "update_review",
  "update_session", "update_share", "update_sponsorship"] {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  else if [raw_event][action] in ["approve_access", "enable_access",
  "authenticate_user", "approve_token", "alert_api", "get_token",
  "start_task", "update_token", "access_webhook", "authenticate_app",
  "deny_access", "deny_invite", "execute_policy", "execute_resource",
  "import_resource", "issue_certificate", "pin_issue", "publish_csr",
  "publish_package", "publish_release", "read_password", "read_task",
  "reject_tos", "remove_license", "request_access", "request_review",
  "request_token", "revoke_access", "revoke_certificate", "transfer_owner",
  "unblock_user", "update_certificate"] {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [raw_event][action] in ["end_task", "delete_webhook", "uninstall_app"] {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_DELETION"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  mutate {
    rename => {
      "about" => "event.idm.read_only_udm.about"
      "security_result" => "event.idm.read_only_udm.security_result"
      "metadata" => "event.idm.read_only_udm.metadata"
      "principal" => "event.idm.read_only_udm.principal"
      "network" => "event.idm.read_only_udm.network"
      "extensions" => "event.idm.read_only_udm.extensions"
      "intermediary" => "event.idm.read_only_udm.intermediary"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
    on_error => "_"
  }
}
