# Product: AWS EKS
# Category: Cloud Provider
# Supported Format: JSON
# Last Updated: 2026-08-10
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "attributes.time" => ""
      "attributes.chronicle_log_type" => ""
      "attributes.log_type" => ""
      "attributes_stream" => ""
      "body" => ""
      "k8s_node_name" => ""
      "k8s_namespace_name" => ""
      "k8s_pod_name" => ""
      "k8s_container_name" => ""
      "http_method" => ""
      "ip" => ""
      "port" => ""
      "region" => ""
      "domain" => ""
      "prin_ip" => ""
      "path" => ""
      "file_name" => ""
      "has_target" => "false"
      "has_principal" => "false"
      "has_http_method" => "false"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }
  if [attributes][chronicle_log_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.log_type" => "%{attributes.chronicle_log_type}"
      }
      on_error => "no_chronicle_log_type"
    }
  }
  if [attributes][log_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{attributes.log_type}"
      }
      on_error => "log_type_not_matched"
    }
  }
  if [body] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{body}"
      }
      on_error => "body_not_matched"
    }
  }
  grok {
    match => {
      "body" => "request: %{WORD:http_method}:%{GREEDYDATA:path}"
    }
    overwrite => ["http_method", "path"]
    on_error => "body_grok_not_matched"
  }
  grok {
    match => {
      "path" => "https://%{IP:ip}:%{INT:port}%{GREEDYDATA}"
    }
    overwrite => ["ip", "port"]
    on_error => "path_grok_not_matched"
  }
  if [http_method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{http_method}"
        "has_http_method" => "true"
      }
      on_error => "http_method_not_matched"
    }
  }
  if [ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "ip"
        "event.idm.read_only_udm.target.asset.ip" => "ip"
      }
      on_error => "ip_merge_error"
    }
    if ![ip_merge_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{port}"
      }
      on_error => "port_not_matched"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "port_conversion_error"
    }
  }
  if [path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{path}"
      }
      on_error => "path_not_matched"
    }
  }
  if [attributes][time] != "" {
    date {
         match => ["attributes.time", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ"]
         target => "event.idm.read_only_udm.metadata.event_timestamp"
         on_error => "date_time_not_matched"
      }
  }
  mutate {
    replace => {
      "k8s_namespace_name" => "%{resource_attributes.k8s.namespace.name}"
    }
    on_error => "k8s_namespace_name_not_found"
  }
  if [k8s_namespace_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.namespace" => "%{k8s_namespace_name}"
      }
      on_error => "k8s_namespace_not_matched"
    }
  }
   mutate {
    replace => {
      "k8s_node_name" => "%{resource_attributes.k8s.node.name}"
    }
    on_error => "k8s_node_name_not_found"
  }
  if [k8s_node_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{k8s_node_name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{k8s_node_name}"
        "has_principal" => "true"
      }
      on_error => "k8s_node_name_not_matched"
    }
  }
  grok {
    match => {
      "k8s_node_name" => "ip-%{DATA:prin_ip}\\.(?P<region>[^\\.]+)\\.(?P<domain>.*)"
    }
    overwrite => ["region", "domain","prin_ip"]
    on_error => "k8s_node_name_grok_error"
  }
  mutate {
    gsub => ["prin_ip", "-", "."]
  }
  if [region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.name" => "%{region}"
      }
      on_error => "region_not_matched"
    }
  }
  if [domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.domain.name" => "%{domain}"
      }
      on_error => "domain_not_matched"
    }
  }
  grok {
    match => {
      "prin_ip" => "%{IP:prin_ip}"
    }
    overwrite => ["prin_ip"]
    on_error => "prin_ip_not_matched"
  }
  if ![prin_ip_not_matched] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "prin_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "prin_ip"
      }
      on_error => "prin_ip_merge_error"
    }
    if ![prin_ip_merge_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  mutate {
    replace => {
      "k8s_pod_name" => "%{resource_attributes.k8s.pod.name}"
    }
    on_error => "k8s_pod_name_not_found"
  }
  if [k8s_pod_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{k8s_pod_name}"
      }
      on_error => "k8s_pod_not_matched"
    }
  }
  mutate {
    replace => {
      "k8s_container_name" => "%{resource_attributes.k8s.container.name}"
    }
    on_error => "k8s_container_name_not_found"
  }
  if [k8s_container_name] != "" {
    mutate {
      replace => {
        "k8s_container_name_label.key" => "k8s_container_name"
        "k8s_container_name_label.value" => "%{k8s_container_name}"
      }
      on_error => "k8s_container_replace_error"
    }
    if ![k8s_container_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "k8s_container_name_label"
        }
        on_error => "k8s_container_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "file_name" => "%{attributes.log.file.name}"
    }
    on_error => "log_file_name_not_matched"
  }
  if [file_name] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.process.file.names" => "file_name"
      }
      on_error => "filename_merge_error"
    }
  }
  mutate {
    replace => {
      "attributes_stream" => "%{attributes.stream}"
    }
    on_error => "attributes_stream_not_matched"
  }
  if [attributes_stream] != "" {
    mutate {
      replace => {
        "attributes_stream_label.key" => "attributes_stream"
        "attributes_stream_label.value.string_value" => "%{attributes_stream}"
      }
      on_error => "attributes_stream_label_replace_error"
    }
    if ![attributes_stream_label_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "attributes_stream_label"
        }
        on_error => "attributes_stream_merge_error"
      }
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and [has_http_method] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
