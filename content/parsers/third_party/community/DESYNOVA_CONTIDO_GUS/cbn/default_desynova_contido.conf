# Product: DESYNOVA CONTIDO
# Category: Switches
# Supported Format: SYSLOG + JSON
# Reference: NA
# Last Updated: 2023-09-19
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "loglevel" => ""
      "timestamp" => ""
      "function" => ""
      "description" => ""
      "security_result" => ""
      "job_status" => ""
      "job_id" => ""
      "job_action" => ""
      "action" => ""
      "data.payload.action" => ""
      "data.payload.commands" => ""
      "data.payload.http_referer" => ""
      "data.payload.content_type" => ""
      "data.payload.location" => ""
      "data.payload.program_type" => ""
      "data.payload.upload_from" => ""
      "data.payload.upload_type" => ""
      "data.payload.source" => ""
      "data.payload.master_file_path" => ""
      "data.transcode_db_id" => ""
      "payload" => ""
      "trans_db_id" => ""
      "target" => ""
      "useremail" => ""
      "desc" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "%{LOGLEVEL:loglevel} %{TIMESTAMP_ISO8601:timestamp},%{INT} %{WORD:function} %{INT} %{INT} %{GREEDYDATA:description}",
        "%{GREEDYDATA:description}"
      ]
    }
    overwrite => ["loglevel","timestamp","function","description"]
    on_error => "invalid_pattern"
  }

  if [description] != "" {
    mutate {
      gsub => ["description","\\'","\""]
    }
    mutate {
      gsub => [
        "description","True","\"True\""
      ]
    }
    mutate {
      gsub => [
        "description","False","\"False\""
      ]
    }
    mutate {
      gsub => [
        "description" ,": None",": \"None\""
      ]
    }

    json {
      source => "description"
      array_function => "split_columns"
      on_error => "not_valid_json"
    }

    if [job_status] != "" {
      mutate {
        convert => {
          "job_status" => "string"
        }
        on_error => "already_string"
      }
      mutate {
        replace => {
          "job_status_field.key" => "job_status"
          "job_status_field.value.string_value" => "%{job_status}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "job_status_field"
        }
        on_error => "invalid_job_status"
      }
    }

    if [job_action] != "" {
      mutate {
        replace => {
          "job_action_field.key" => "job_action"
          "job_action_field.value.string_value" => "%{job_action}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "job_action_field"
        }
        on_error => "invalid_job_action"
      }
    }

    if [job_id] != "" {
      mutate {
        replace => {
          "job_id_label.key" => "job_id"
          "job_id_label.value.string_value" => "%{job_id}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "job_id_label"
        }
        on_error => "invalid_job_id"
      }
    }

    if [not_valid_json] {
      mutate {
        replace => {
          "desc" => "%{description}"
        }
      }
      mutate {
        gsub => ["desc","\\[",""]
      }
      mutate {
        gsub => ["desc","\"",""]
      }
      grok {
        match => {
         "desc" => "sending mail to %{EMAILADDRESS:useremail}"
        }
        overwrite => ["useremail"]
        on_error => "invalid"
      }
      if [useremail] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.email_addresses" => "useremail"
          }
          on_error => "invalid_user_email"
        }
      }

      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
      }
    }

    if [data][payload][action] != "" {
      mutate {
        replace => {
          "action_detection_fields.key" => "payload_action"
          "action_detection_fields.value" => "%{data.payload.action}"
        }
        merge => {
          "security_result.detection_fields" => "action_detection_fields"
        }
      }
    }

    if [data][payload][http_referer] != "" {
      mutate {
        replace => {
          "target.url" => "%{data.payload.http_referer}"
        }
      }
    }

    if [data][payload][content_type] != "" {
      mutate {
        replace => {
          "content_type_label.key" => "content_type"
          "content_type_label.value.string_value" => "%{data.payload.content_type}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "content_type_label"
        }
        on_error => "invalid_content_type"
      }
    }

    if [data][payload][location] != "" {
      mutate {
        replace => {
          "location_label.key" => "location"
          "location_label.value.string_value" => "%{data.payload.location}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "location_label"
        }
        on_error => "invalid_location"
      }
    }

    if [data][payload][program_type] != "" {
      mutate {
        replace => {
          "program_type_label.key" => "program_type"
          "program_type_label.value.string_value" => "%{data.payload.program_type}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "program_type_label"
        }
        on_error => "invalid_program_type"
      }
    }

    if [data][payload][source] != "" {
      mutate {
        replace => {
          "source_type_label.key" => "source"
          "source_type_label.value.string_value" => "%{data.payload.source}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "source_type_label"
        }
        on_error => "invalid_source"
      }
    }

    if [data][payload][upload_from] != "" {
      mutate {
        replace => {
          "upload_from_label.key" => "upload_from"
          "upload_from_label.value.string_value" => "%{data.payload.upload_from}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "upload_from_label"
        }
        on_error => "invalid_upload_from"
      }
    }

    if [data][payload][upload_type] != "" {
      mutate {
        replace => {
          "upload_type_label.key" => "upload_type"
          "upload_type_label.value.string_value" => "%{data.payload.upload_type}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "upload_type_label"
        }
        on_error => "invalid_upload_type"
      }
    }

    if [data][payload][master_file_path] != "" {
      mutate {
        replace => {
          "target.file.full_path" => "%{data.payload.master_file_path}"
        }
      }
    }

    if [payload] != "" {
      for entry in payload {
        mutate {
          replace => {
            "target.file.full_path" => "%{entry.master_file_path}"
          }
          on_error => "invalid_master_file_path"
        }

        mutate {
          replace => {
            "target.url" => "%{entry.http_referer}"
          }
        }

        mutate {
          replace => {
            "content_type_label.key" => "content_type"
            "content_type_label.value.string_value" => "%{entry.content_type}"
          }
          merge => {
            "event.idm.read_only_udm.additional.fields" => "content_type_label"
          }
          on_error => "invalid_content_type"
        }

        mutate {
          replace => {
            "transcode_db_id_label.key" => "transcode_db_id"
            "transcode_db_id_label.value.string_value" => "%{entry.transcode_db_id}"
          }
          merge => {
            "event.idm.read_only_udm.additional.fields" => "transcode_db_id_label"
          }
          on_error => "invalid_transcodedb_id"
        }

        mutate {
          replace => {
            "location_label.key" => "location"
            "location_label.value.string_value" => "%{entry.location}"
          }
          merge => {
            "event.idm.read_only_udm.additional.fields" => "location_label"
          }
          on_error => "invalid_location"
        }

        mutate {
          replace => {
            "program_type_label.key" => "program_type"
            "program_type_label.value.string_value" => "%{entry.program_type}"
          }
          merge => {
            "event.idm.read_only_udm.additional.fields" => "program_type_label"
          }
          on_error => "invalid_program_type"
        }

        mutate {
          replace => {
            "action_detection_fields.key" => "payload_action"
            "action_detection_fields.value" => "%{entry.action}"
          }
          merge => {
            "security_result.detection_fields" => "action_detection_fields"
          }
          on_error => "invalid_action"
        }

        mutate {
          replace => {
            "upload_type_label.key" => "upload_type"
            "upload_type_label.value.string_value" => "%{entry.upload_type}"
          }
          merge => {
            "event.idm.read_only_udm.additional.fields" => "upload_type_label"
          }
          on_error => "invalid_upload_type"
        }

        mutate {
          replace => {
            "source_type_label.key" => "source"
            "source_type_label.value.string_value" => "%{entry.source}"
          }
          merge => {
            "event.idm.read_only_udm.additional.fields" => "source_type_label"
          }
          on_error => "invalid_source"
        }
      }
    }

    if [data][transcode_db_id] != "" {
      mutate {
        replace => {
          "transcode_db_id_label.key" => "transcode_db_id"
          "transcode_db_id_label.value.string_value" => "%{data.transcode_db_id}"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "transcode_db_id_label"
        }
        on_error => "invalid_transcodedb_id"
      }
    }
  }

  if [trans_db_id] != "" {
    mutate {
      replace => {
        "trans_db_id_label.key" => "trans_db_id"
        "trans_db_id_label.value.string_value" => "%{trans_db_id}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "trans_db_id_label"
      }
      on_error => "invalid_trans_db_id"
    }
  }

  if [function] != "" {
    mutate {
      replace => {
        "function_detection_fields.key" => "Function"
        "function_detection_fields.value" => "%{function}"
      }
      merge => {
        "security_result.detection_fields" => "function_detection_fields"
      }
    }
  }

  if [loglevel] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{loglevel}"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => [ "timestamp", "ISO8601","yyyy-MM-dd HH:mm:ss"]
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "invalid_description"
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
      on_error => "invalid_target"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "DESYNOVA_CONTIDO"
      "event.idm.read_only_udm.metadata.vendor_name" => "DESYNOVA_CONTIDO"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  if [useremail] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
