      }
      if [event_data_type] == "" {
        mutate {
          replace => {
            "event_data_type" => "%{Events.eventData.eventType}"
          }
          on_error => "single_event_type_empty"
        }
      }
      if [event_data_type] == "Logout" {
        mutate {
          replace => {
            "event_type" => "USER_LOGOUT"
            "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
          }
        }
      }
      else if [has_principal] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event_type" => "GENERIC_EVENT"
          }
        }
