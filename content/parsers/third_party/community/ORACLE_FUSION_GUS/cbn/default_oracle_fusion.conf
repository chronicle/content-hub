      if [user_display_name] == "" {
        mutate {
          replace => {
            "user_display_name" => "%{data_val.userName}"
          }
          on_error => "user_name_empty"
        }
        if [user_display_name] != "" {
          mutate {
            replace => {
              "principal.user.user_display_name" => "%{user_display_name}"
            }
            on_error => "user_display_name_error"
          }
        }
      }
      if [user_display_name] =~ "^.+@.+$" {
        mutate {
          merge => {
            "principal.user.email_addresses" => "user_display_name"
          }
          on_error => "user_email_merge_error"
        }
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
      else if [user_display_name] != "" {
        mutate {
          replace => {
            "UserDN_label.value" => "%{user_display_name}"
            "UserDN_label.key" => "UserDN"
          }
          on_error => "UserDN_error"
        }
        if ![UserDN_error] {
          mutate {
            merge => {
              "principal.user.attribute.labels" => "UserDN_label"
            }
            on_error => "UserDN_merge_error"
          }
        }
      }
      mutate {
        replace => {
          "desc_val" => "%{data_val.description}"
        }
        on_error => "desc_val_empty"
      }
      if [desc_val] != "" {
        mutate {
          replace => {
            "metadata.description" => "%{desc_val}"
          }
          on_error => "desc_val_error"
        }
      }
      mutate {
        replace => {
          "event_cat" => "%{data_val.eventCategory}"
        }
        on_error => "event_cat_empty"
      }
      if [event_cat] != "" {
        mutate {
          merge => {
            "security_result.category_details" => "event_cat"
          }
          on_error => "category_details_error"
        }
      }
      mutate {
        replace => {
          "status_val" => "%{data_val.status}"
        }
        on_error => "status_val_empty"
      }
      if [status_val] == "success" {
        mutate {
          merge => {
            "security_result.action" => "action_allow"
          }
          on_error => "action_allow_merge_error"
        }
      }
      else {
        mutate {
          merge => {
            "security_result.action" => "action_block"
          }
          on_error => "action_block_merge_error"
        }
      }
      mutate {
        replace => {
          "access_time" => "%{data_val.accessTime}"
        }
        on_error => "access_time_empty"
      }
      if [access_time] != "" {
        mutate {
          gsub => ["access_time", "Z", ""]
        }
        date {
          match => ["access_time", "yyyy-MM-ddTHH:mm:ss.SSS"]
          on_error => "accessTime_error"
        }
      }
      else {
        mutate {
          replace => {
            "access_time" => "%{data_val.date}"
          }
          on_error => "date_empty"
        }
        if [access_time] != "" {
          date {
            match => ["access_time", "yyyy-MM-dd HH:mm:ss"]
            target => "metadata.event_timestamp"
            on_error => "date_error"
          }
        }
      }
      mutate {
