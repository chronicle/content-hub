    if [userInternalName] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{userInternalName}"
          "has_user" => "true"
        }
        on_error => "root_event_principal_userid_err"
      }
    }
    if [userName] != "" {
      mutate {
        replace => {
          "principal.user.user_display_name" => "%{userName}"
        }
        on_error => "root_event_user_display_name_err"
      }
    }
    if [description] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{description}"
        }
        on_error => "root_event_desc_val_err"
      }
    }
    if [eventCategory] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "eventCategory"
        }
        on_error => "root_event_category_details_err"
      }
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "root_event_sec_result_merge_err"
      }
    }
    if [date] != "" {
      date {
        match => ["date", "yyyy-MM-dd HH:mm:ss"]
        target => "metadata.event_timestamp"
        on_error => "root_event_date_parse_err"
      }
    }
    if [attributeDetails] != "" {
      for index, detail in attributeDetails {
        mutate {
          replace => {
            "detail_attr_internal_name" => ""
            "detail_attr" => ""
            "detail_new_value" => ""
            "add_field" => ""
          }
        }
        mutate {
          replace => {
            "detail_attr_internal_name" => "%{detail.attributeInternalName}"
          }
          on_error => "root_event_detail_int_name_empty"
        }
        mutate {
          replace => {
            "detail_attr" => "%{detail.attribute}"
          }
          on_error => "root_event_detail_attr_empty"
        }
        mutate {
          replace => {
            "detail_new_value" => "%{detail.newValue}"
          }
          on_error => "root_event_detail_val_empty"
        }
        if [detail_attr_internal_name] != "" and [detail_new_value] != "" {
          mutate {
            replace => {
              "add_field" => ""
            }
          }
          mutate {
            replace => {
              "add_field.key" => "%{detail_attr_internal_name}"
              "add_field.value.string_value" => "%{detail_new_value}"
            }
            on_error => "root_event_add_field_err"
          }
          if ![root_event_add_field_err] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "add_field"
              }
              on_error => "root_event_add_field_merge_err"
            }
          }
        }
        else if [detail_attr] != "" and [detail_new_value] != "" {
          mutate {
            replace => {
              "add_field" => ""
            }
          }
          mutate {
            replace => {
              "add_field.key" => "%{detail_attr}"
              "add_field.value.string_value" => "%{detail_new_value}"
            }
            on_error => "root_event_add_field_attr_err"
          }
          if ![root_event_add_field_attr_err] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "add_field"
              }
              on_error => "root_event_add_field_attr_merge_err"
            }
          }
        }
      }
    }
    else if [attributeInternalName] != "" and [newValue] != "" {
      mutate {
        replace => {
          "add_field" => ""
        }
      }
      mutate {
        replace => {
          "add_field.key" => "%{attributeInternalName}"
          "add_field.value.string_value" => "%{newValue}"
        }
        on_error => "root_event_add_field_intname_err"
      }
      if ![root_event_add_field_intname_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "add_field"
          }
          on_error => "root_event_add_field_intname_merge_err"
        }
      }
    }
    else if [attribute] != "" and [newValue] != "" {
      mutate {
        replace => {
          "add_field" => ""
        }
      }
      mutate {
        replace => {
          "add_field.key" => "%{attribute}"
          "add_field.value.string_value" => "%{newValue}"
        }
        on_error => "root_event_add_field_raw_attr_err"
      }
      if ![root_event_add_field_raw_attr_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "add_field"
          }
          on_error => "root_event_add_field_raw_attr_merge_err"
        }
      }
    }
    if [event_type] == "GENERIC_EVENT" {
       if [has_user] == "true" {
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      else if [has_principal] == "true" {
        mutate {
          replace => {
            "metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }else {
        mutate {
          replace => {
            "metadata.event_type" => "GENERIC_EVENT"
          }
        }
      }
    }
    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }
    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
