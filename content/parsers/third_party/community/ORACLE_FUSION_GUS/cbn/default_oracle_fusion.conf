      }
      if [attribute_key] == "User-Agent" and [attribute_value] != "" {
        mutate {
          replace => {
            "network.http.user_agent" => "%{attribute_value}"
          }
          on_error => "user_agent_error"
        }
      }
        for index, detail in data_val.attributeDetails {
          mutate {
            replace => {
              "detail_attr_internal_name" => ""
              "detail_attr" => ""
              "detail_new_value" => ""
              "add_field" => ""
            }
          }
          mutate {
            replace => {
              "detail_attr_internal_name" => "%{detail.attributeInternalName}"
            }
            on_error => "detail_int_name_empty"
          }
          mutate {
            replace => {
              "detail_attr" => "%{detail.attribute}"
            }
            on_error => "detail_attr_empty"
          }
          mutate {
            replace => {
              "detail_new_value" => "%{detail.newValue}"
            }
            on_error => "detail_val_empty"
          }
          mutate {
            convert => {
              "index" => "string"
            }
            on_error => "index_empty"
          }
          if [detail_attr_internal_name] != "" and [detail_new_value] != "" {
            mutate {
              replace => {
                "add_field.key" => "%{detail_attr_internal_name}"
              }
              on_error => "add_field_error"
            }
            mutate {
              replace => {
                "add_field.value.string_value" => "%{detail_new_value}"
              }
              on_error => "add_field_error_string_value"
            }
            if ![add_field_error] and ![add_field_error_string_value] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "add_field"
                }
                on_error => "add_field_merge_error"
              }
            }
          }
          else if [detail_attr] != "" and [detail_new_value] != "" {
            mutate {
              replace => {
                "add_field.key" => "%{detail_attr}"
              }
              on_error => "add_field_attr_error"
            }
            mutate {
              replace => {
                "add_field.value.string_value" => "%{detail_new_value}"
              }
              on_error => "add_field_attr_error_string_value"
            }
            if ![add_field_attr_error] and ![add_field_attr_error_string_value] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "add_field"
                }
                on_error => "add_field_merge_fail"
              }
            }
          }
        }
      if[security_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
          on_error => "sec_result_merge_error"
        }
      }
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
          "network" => "event.idm.read_only_udm.network"
          "principal" => "event.idm.read_only_udm.principal"
          "target" => "event.idm.read_only_udm.target"
        }
      }
      if [extensions] != "" {
        mutate {
          rename => {
            "extensions" => "event.idm.read_only_udm.extensions"
          }
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
        on_error => "array_event_output_merge_err"
      }
    }
    if [is_array] == "false" {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
          "target_is_set" => "false"
          "has_principal" => "false"
          "has_user" => "false"
          "extensions" => ""
          "security_result" => ""
          "action_allow" => "ALLOW"
          "action_block" => "BLOCK"
          "user_display_name" => ""
          "target" => ""
          "network" => ""
          "event_id" => ""
          "EVENT_ID" => ""
          "user_login_id" => ""
          "oracle_ecid" => ""
          "ip_address" => ""
          "status_val" => ""
          "access_time" => ""
          "event_data_type" => ""
          "attribute_key" => ""
          "attribute_value" => ""
        }
      }
      mutate{
        replace => {
          "event_id" => "%{Events.eventData.eventID}"
        }
        on_error => "EventID_empty"
      }
      if [event_id] != "" {
        mutate {
          replace => {
            "metadata.product_log_id" => "%{event_id}"
          }
          on_error => "single_event_product_log_id_err"
        }
      }
      mutate {
        replace => {
          "user_login_id" => "%{Events.eventData.userID.loginID}"
        }
        on_error => "single_event_user_login_id_empty"
      }
      if [user_login_id] == "" {
        mutate {
          replace => {
            "user_login_id" => "%{Events.eventData.userInternalName}"
          }
          on_error => "single_event_user_internal_name_empty"
        }
      }
      if [user_login_id] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{user_login_id}"
            "has_user" => "true"
          }
          on_error => "single_event_principal_userid_err"
        }
      }
      mutate {
        replace => {
          "oracle_ecid" => "%{Events.eventData.oracleECID}"
        }
        on_error => "single_event_oracle_ecid_empty"
      }
      if [oracle_ecid] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{oracle_ecid}"
            "target_is_set" => "true"
            "has_user" => "true"
          }
          on_error => "single_event_target_userid_err"
        }
      }
      mutate {
        replace => {
          "ip_address" => "%{Events.eventData.ipAddress}"
        }
        on_error => "single_event_ip_address_empty"
      }
      if [ip_address] != "" {
        grok {
          match => {
            "ip_address" => "%{IP:ip_address}"
          }
          overwrite => ["ip_address"]
          on_error => "single_event_ip_address_grok_err"
        }
        if ![single_event_ip_address_grok_err] {
          mutate {
            merge => {
              "principal.ip" => "ip_address"
              "principal.asset.ip" => "ip_address"
            }
            on_error => "single_event_ip_address_merge_err"
          }
          if ![single_event_ip_address_merge_err] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
      mutate {
        replace => {
          "user_display_name" => "%{Events.eventData.userID.userDN}"
        }
        on_error => "single_event_user_dn_empty"
      }
      if [user_display_name] == "" {
        mutate {
          replace => {
            "user_display_name" => "%{Events.eventData.userName}"
          }
          on_error => "single_event_user_name_empty"
        }
        if [user_display_name] != "" {
          mutate {
            replace => {
              "principal.user.user_display_name" => "%{user_display_name}"
            }
            on_error => "single_event_user_display_name_err"
          }
        }
      }
      if [user_display_name] =~ "^.+@.+$" {
        mutate {
          merge => {
            "principal.user.email_addresses" => "user_display_name"
          }
          on_error => "single_event_user_email_merge_err"
        }
        if ![single_event_user_email_merge_err] {
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
      }
      else if [user_display_name] != "" {
        mutate {
          replace => {
            "UserDN_label.value" => "%{user_display_name}"
            "UserDN_label.key" => "UserDN"
          }
          on_error => "single_event_UserDN_label_err"
        }
        if ![single_event_UserDN_label_err] {
          mutate {
            merge => {
              "principal.user.attribute.labels" => "UserDN_label"
            }
            on_error => "single_event_UserDN_merge_err"
          }
        }
      }
      mutate {
        replace => {
          "desc_val" => "%{Events.eventData.description}"
        }
        on_error => "single_event_desc_val_empty"
      }
      if [desc_val] != "" {
        mutate {
          replace => {
            "metadata.description" => "%{desc_val}"
