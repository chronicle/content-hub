filter{
  mutate {
    replace => {
      "is_array" => "false"
      "Events.eventData" => ""
      "Events.eventData.attributeDetails" => ""
      "attributeDetails" => ""
      "event_id" => ""
      "user_login_id" => ""
      "oracle_ecid" => ""
      "ip_address" => ""
      "user_display_name" => ""
      "status_val" => ""
      "access_time" => ""
      "event_data_type" => ""
      "attribute_key" => ""
      "attribute_value" => ""
      "detail_attr_internal_name" => ""
      "detail_attr" => ""
      "detail_new_value" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "extensions" => ""
      "security_result" => ""
      "eventType" => ""
      "userInternalName" => ""
      "userName" => ""
      "description" => ""
      "eventCategory" => ""
      "date" => ""
      "attributeInternalName" => ""
      "attribute" => ""
      "newValue" => ""
      "add_field" => ""
      "event_type" => "GENERIC_EVENT"
      "has_principal" => "false"
      "has_user" => "false"
      "target_is_set" => "false"
      "desc_val" => ""
      "event_cat" => ""

    }
  }
  mutate {
    gsub => ["message", "\\r\\n", ""]
  }

  mutate {
    gsub => ["message", "\\t", ""]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [eventType] == "" and [Events][eventData] != "" {
    for index,data_val in Events.eventData {
      mutate {
        replace => {
          "is_array" => "true"
          "event" => ""
          "event_type" => "GENERIC_EVENT"
          "target_is_set" => "false"
          "has_principal" => "false"
          "has_user" => "false"
          "extensions" => ""
          "security_result" => ""
          "action_allow" => "ALLOW"
          "action_block" => "BLOCK"
          "user_display_name" => ""
          "userDN" => ""
          "UserDN_label" => ""
          "event_id" => ""
          "user_login_id" => ""
          "oracle_ecid" => ""
          "ip_address" => ""
          "status_val" => ""
          "access_time" => ""
          "event_data_type" => ""
          "attribute_key" => ""
          "attribute_value" => ""
          "detail_attr_internal_name" => ""
          "detail_attr" => ""
          "detail_new_value" => ""
          "add_field" => ""
        }
      }
      mutate {
        replace => {
          "event_id" => "%{data_val.eventID}"
        }
        on_error => "event_id_empty"
      }
      if [event_id] != "" {
        mutate {
          replace => {
            "metadata.product_log_id" => "%{event_id}"
          }
          on_error => "product_log_id_error"
        }
      }
      mutate {
        replace => {
          "user_login_id" => "%{data_val.userID.loginID}"
        }
        on_error => "user_login_id_empty"
      }
      if [user_login_id] == "" {
        mutate {
          replace => {
            "user_login_id" => "%{data_val.userInternalName}"
          }
          on_error => "user_internal_name_empty"
        }
      }
      if [user_login_id] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{user_login_id}"
            "has_user" => "true"
          }
          on_error => "principal_userid_error"
        }
      }
      mutate {
        replace => {
          "oracle_ecid" => "%{data_val.oracleECID}"
        }
        on_error => "oracle_ecid_empty"
      }
      if [oracle_ecid] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{oracle_ecid}"
            "target_is_set" => "true"
            "has_user" => "true"
          }
          on_error => "target_userid_error"
        }
      }
      mutate {
        replace => {
          "ip_address" => "%{data_val.ipAddress}"
        }
        on_error => "ip_address_empty"
      }
      if [ip_address] != "" {
        grok {
          match => { "ip_address" => "%{IP:ip_address}" }
          overwrite => ["ip_address"]
          on_error => "ip_address_grok_error"
        }
        if ![ip_address_grok_error] {
          mutate {
            merge => {
              "principal.ip" => "ip_address"
              "principal.asset.ip" => "ip_address"
            }
            on_error => "ip_address_merge_error"
          }
          if ![ip_address_merge_error] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
      mutate {
        replace => {
          "user_display_name" => "%{data_val.userID.userDN}"
        }
        on_error => "userDN_empty"
