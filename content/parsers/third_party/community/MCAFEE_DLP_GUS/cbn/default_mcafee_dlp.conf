# Product: McAfee Data Loss Prevention
# Category: DLP
# Supported Format: CSV
# Reference: See below
# Last Updated: 2025-12-04
# Copyright 2025 Google SecOps


# Additional references:
# https://www.microsa.es/biblioteca/McAfee/network_DLP_prevent/dlp_920_pg_win_en-us.pdf
# https://docs.mcafee.com/bundle/data-loss-prevention-11.6.x-interface-reference-guide/page/GUID-E082EA0D-8DF7-4D41-837F-71E615C78921.html

filter {
  mutate {
    replace => {
      "has_principal_user" => "false"
      "ip_address" => ""
      "has_principal" => "false"
    }
  }
  mutate {
    gsub => ["message", '\\\",\\\"', '\"^\"']
  }
  mutate {
    gsub => ["message", '\\\"', ""]
  }

  csv {
    source => "message"
    separator => "^"
    on_error => "csv_failure"
  }

  mutate {
    rename => {
      column1 => "inc_id"
      column2 => "inc_type"
      column3 => "local_date"
      column5 => "sev"
      column6 => "status_id"
      column7 => "resolution_id"
      column8 => "agent_ver"
      column9 => "evidence_count"
      column10 => "total_count"
      column11 => "total_size"
      column12 => "class_count"
      column13 => "action"
      column14 => "expected_action"
      column15 => "fail_reason"
      column16 => "dst"
      column17 => "direction"
      column18 => "user"
      column19 => "name"
      column20 => "ip"
      column21 => "dst_app"
      column23 => "device_name"
      column24 => "usb_serial_number"
      column25 => "encrypt"
      column26 => "volume_serial_number"
      column27 => "dst_url"
      column29 => "user_ou"
      column30 => "group"
      column31 => "class_display"
      column32 => "file"
      column33 => "count"
      column34 => "file_size"
      column35 => "rule_set"
      column36 => "rule_name"
      column37 => "process_name"
    }
  }

  date {
    match => ["local_date","yyyy-MM-d HH:mm:ss"]
    on_error => "no_local_date_present"
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Mcafee DLP"
      "event.idm.read_only_udm.metadata.vendor_name" => "Mcafee"
    }
  }
  if [inc_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{inc_type}"
      }
      on_error => "no_inc_type_present"
    }
  }
  if [inc_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{inc_id}"
      }
      on_error => "no_inc_id_present"
    }
  }
  if [agent_ver] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{agent_ver}"
      }
      on_error => "no_agent_ver_present"
    }
  }

  if [status_id] != "" {
    mutate {
      replace => {
        "status_label.key" => "StatusId"
        "status_label.value.string_value" => "%{status_id}"
      }
      on_error => "no_status_id_present"
    }
    if ![no_status_id_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "status_label"
        }
        on_error => "no_status_id_label_merge"
      }
    }

    if [status_id] in ["1","2"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.investigation.status" => "NEW"
        }
      }
    } else if [status_id] in ["3","4"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.investigation.status" => "CLOSED"
        }
      }
    } else if [status_id] in ["5","6"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.investigation.status" => "REVIEWED"
        }
      }
    }
  }

  if [dst] not in ["","None"] {
    if [inc_type] == "10000" {
       mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{dst}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{dst}"
        }
        on_error => "no_dst_present"
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{dst}"
        }
        on_error => "no_dst_user_present"
      }
    }
  }
  if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
      }
      on_error => "no_user_present"
    }
    if ![no_user_present] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }
  if [name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{name}"
      }
      on_error => "no_name_present"
    }
  }

  grok {
    match => {
      "ip" => "%{IP:ip_address}"
    }
    overwrite => ["ip_address"]
    on_error => "not_an_ip"
  }
  if ![not_an_ip] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip_address"
        "event.idm.read_only_udm.principal.asset.ip" => "ip_address"
      }
      on_error => "no_ip_address_present"
    }
    if ![no_ip_address_present] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [dst_app] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{dst_app}"
      }
      on_error => "no_dst_app_present"
    }
  }

  if [device_name] not in ["", "None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{device_name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{device_name}"
      }
      on_error => "no_device_name_present"
    }
    if ![no_device_name_present] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [dst_url] not in ["", "None", "_NOT_AVAILABLE_"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{dst_url}"
      }
      on_error => "no_dst_url_present"
    }
  }
  if [user_ou] =~ "^.{0,255}$" {
    if [user_ou] not in ["","None"] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" => "user_ou"
        }
        on_error => "no_user_ou"
      }
    }
  }
  if [group] != "" {
    mutate {
      replace => {
        "group_label.key" => "group"
        "group_label.value" => "%{group}"
      }
      on_error => "no_group_present"
    }
    if ![no_group_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.labels" => "group_label"
        }
        on_error => "no_group_label_merge"
      }
    }
  }

  if [file] not in ["","None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{file}"
      }
      on_error => "no_file_present"
    }
  }

  if [file_size] not in ["","None"] {
    mutate{
      convert => {
        "file_size" => "uinteger"
      }
      on_error => "no_file_size"
    }
    if ![no_file_size] {
      mutate {
        rename => {
          "file_size" => "event.idm.read_only_udm.target.file.size"
        }
        on_error => "no_file_size_rename"
      }
    }
  }

  if [process_name] not in ["","None"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{process_name}"
      }
      on_error => "no_process_name_present"
    }
  }

  # security_result related mappings
  if [rule_name] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{rule_name}"
      }
      on_error => "no_rule_name_present"
    }
  }
  if [resolution_id] != "" {
    mutate {
      replace => {
        "res_id.key" => "Resolution Id"
        "res_id.value.string_value" => "%{resolution_id}"
      }
      on_error => "no_res_id"
    }
    if ![no_res_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "res_id"
        }
        on_error => "no_res_id_merge"
      }
    }
  }
  if [expected_action] != "" {
    mutate {
      replace => {
        "expected_act.key" => "Expected Action"
        "expected_act.value.string_value" => "%{expected_action}"
      }
      on_error => "no_expected_action"
    }
    if ![no_expected_action] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "expected_act"
        }
        on_error => "no_expected_action_merge"
      }
    }
  }

  if [fail_reason] == "0" {
    mutate {
      replace => {
        "security_result.description" => "No Failure"
      }
    }
  } else {
    mutate {
      replace => {
        "security_result.description" => "Failure Occured"
      }
    }
  }

  if [sev] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{sev}"
      }
      on_error => "no_sev"
    }
    if [sev] == "1" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [sev] == "2" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    } else if [sev] == "3" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    } else if [sev] == "4" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    } else if [sev] == "5" {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
      }
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "no_action"
    }

    if [action] == "1" {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    } else if [action] == "0" {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    } else if [action] == "6" {
      mutate {
        replace => {
          "sec_action" => "UNKNOWN_ACTION"
        }
      }
    }
  }
  if [rule_set] != "" {
    mutate {
      replace => {
        "rule_set_label.key" => "rule_set"
        "rule_set_label.value" => "%{rule_set}"
      }
      on_error => "no_rule_set"
    }
    if ![no_rule_set] {
      mutate {
        merge => {
          "security_result.rule_labels" => "rule_set_label"
        }
        on_error => "no_rule_set_label_merge"
      }
    }
  }

  mutate {
    merge => {
      "security_result.action" => "sec_action"
    }
    on_error => "no_sec_action_merge"
  }

  if [usb_serial_number] not in ["","None"] {
    mutate {
      replace => {
        "usb_label.key" => "USBSerialNumber"
        "usb_label.value" => "%{usb_serial_number}"
      }
      on_error => "no_usb_serial_number"
    }
    if ![no_usb_serial_number] {
      mutate {
        merge => {
          "security_result.detection_fields" => "usb_label"
        }
        on_error => "no_usb_serial_number_merge"
      }
    }
  }

  if [encrypt] not in ["","None"] {
    mutate {
      replace => {
        "encryption_label.key" => "EncryptionProvider"
        "encryption_label.value" => "%{encrypt}"
      }
      on_error => "no_encryption_label"
    }
    if ![no_encryption_label] {
      mutate {
        merge => {
          "security_result.detection_fields" => "encryption_label"
        }
        on_error => "no_encryption_label_merge"
      }
    }
  }

  if [volume_serial_number] not in ["","None"] {
    mutate {
      replace => {
        "volume_label.key" => "VolumeSerialNumber"
        "volume_label.value" => "%{volume_serial_number}"
      }
      on_error => "no_volume_serial_number"
    }
    if ![no_volume_serial_number] {
      mutate {
        merge => {
          "security_result.detection_fields" => "volume_label"
        }
        on_error => "no_volume_serial_number_merge"
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "security_result"
    }
    on_error => "no_security_result_merge"
  }

  # additional
  if [fail_reason] not in ["","None"] {
    mutate {
      replace => {
        "additional_field_0.key" => "FailReason"
        "additional_field_0.value.string_value" => "%{fail_reason}"
      }
      on_error => "no_fail_reason_present"
    }
    if ![no_fail_reason_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_0"
        }
        on_error => "no_fail_reason_merge"
      }
    }
  }

  if [evidence_count] not in ["","None"] {
    mutate {
      replace => {
        "additional_field_1.key" => "EvidenceCount"
        "additional_field_1.value.string_value" => "%{evidence_count}"
      }
      on_error => "no_evidence_count_present"
    }
    if ![no_evidence_count_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_1"
        }
        on_error => "no_evidence_count_merge"
      }
    }
  }

  if [total_count] not in ["","None"] {
    mutate {
      replace => {
        "additional_field_2.key" => "TotalCount"
        "additional_field_2.value.string_value" => "%{total_count}"
      }
      on_error => "no_total_count_present"
    }
    if ![no_total_count_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_2"
        }
        on_error => "no_total_count_merge"
      }
    }
  }

  if [total_size] not in ["","None"] {
    mutate {
      replace => {
        "additional_field_3.key" => "TotalSize"
        "additional_field_3.value.string_value" => "%{total_size}"
      }
      on_error => "no_total_size_present"
    }
    if ![no_total_size_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_3"
        }
        on_error => "no_total_size_merge"
      }
    }
  }

  if [class_count] not in ["","None"] {
    mutate {
      replace => {
        "additional_field_4.key" => "ClassCount"
        "additional_field_4.value.string_value" => "%{class_count}"
      }
      on_error => "no_class_count_present"
    }
    if ![no_class_count_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_4"
        }
        on_error => "no_class_count_merge"
      }
    }
  }

  if [class_display] not in ["","None"] {
    mutate {
      replace => {
        "additional_field_5.key" => "ClassDisplay"
        "additional_field_5.value.string_value" => "%{class_display}"
      }
      on_error => "no_class_display_present"
    }
    if ![no_class_display_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_5"
        }
        on_error => "no_class_display_merge"
      }
    }
  }

  if [count] not in ["","None"] {
    mutate {
      replace => {
        "additional_field_6.key" => "Count"
        "additional_field_6.value.string_value" => "%{count}"
      }
      on_error => "no_count_present"
    }
    if ![no_count_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field_6"
        }
        on_error => "no_count_merge"
      }
    }
  }

  # event_type mappings
  if [inc_type] in ["10000","10001","10002","40101","40400","40500","40700"] and ![not_an_ip] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_NETWORK"
      }
    }
  } else if [inc_type] == "40102" and [file] != "" and [file] != "None" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_FILE"
      }
    }
  } else if [inc_type] in ["40301","40602"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_UNCATEGORIZED"
      }
    }
  } else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
