# Product: AZURE API MANAGEMENT
# Category: Schema
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2025-01-21
# Copyright 2025 Google SecOps


filter {
  mutate {
    replace => {
      "event" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "security_result" => ""
      "additional" => ""
      "time" => ""
      "resourceId" => ""
      "category" => ""
      "operationName" => ""
      "level" => ""
      "location" => ""
      "callerIpAddress" => ""
      "isRequestSuccess" => ""
      "Level" => ""
      "durationMs" => ""
      "Sku" => ""
      "resultType" => ""
      "DeploymentVersion" => ""
      "correlationId" => ""
      "properties.backendMethod" => ""
      "properties.operationId" => ""
      "properties.apimSubscriptionId" => ""
      "properties.productId" => ""
      "properties.apiId" => ""
      "properties.apiRevision" => ""
      "properties.cache" => ""
      "properties.backendResponseCode" => ""
      "properties.backendTime" => ""
      "properties.backendProtocol" => ""
      "properties.clientProtocol" => ""
      "properties.requestSize" => ""
      "properties.backendUrl" => ""
      "properties.responseSize" => ""
      "properties.responseCode" => ""
      "properties.clientTlsCipherSuite" => ""
      "properties.userId" => ""
      "properties.clientTlsVersion" => ""
      "properties.url" => ""
      "properties.method" => ""
      "properties.appName" => ""
      "properties.roleInstance" => ""
      "properties.message" => ""
      "properties.category" => ""
      "properties.hostVersion" => ""
      "properties.functionInvocationId" => ""
      "properties.functionName" => ""
      "properties.hostInstanceId" => ""
      "properties.level" => ""
      "properties.levelId" => ""
      "properties.processId" => ""
      "properties.eventId" => ""
      "properties.eventName" => ""
      "has_principal" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }

  if [time] != "" {
    date {
      match => ["time", "ISO8601","yyyy-MM-ddTHH:mm:ss.SSSSSSSZ"]
      on_error => "date_failed"
    }
  }
  if [callerIpAddress] != "" {
    mutate {
      merge => {
        "principal.ip" => "callerIpAddress"
        "principal.asset.ip" => "callerIpAddress"
      }
      on_error => "no_ip"
    }
    if ![no_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  mutate {
    convert => {
      "isRequestSuccess" => "string"
    }
    on_error => "isRequestSuccess_convert_failed"
  }
  if [isRequestSuccess] != "" {
    mutate {
      replace => {
        "isRequestSuccess_label.value.string_value" => "%{isRequestSuccess}"
      }
      on_error => "isRequestSuccess_empty"
    }
    if ![isRequestSuccess_empty] {
      mutate {
        replace => {
          "isRequestSuccess_label.key" => "isRequestSuccess"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "isRequestSuccess_label"
        }
        on_error => "isRequestSuccess_label_empty"
      }
    }
  }
  if [properties][backendMethod] != "" {
    mutate {
      replace => {
        "backendMethod_label.value.string_value" => "%{properties.backendMethod}"
      }
      on_error => "backendMethod_empty"
    }
    if ![backendMethod_empty] {
      mutate {
        replace => {
          "backendMethod_label.key" => "backendMethod"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "backendMethod_label"
        }
        on_error => "backendMethod_label_empty"
      }
    }
  }
  if [properties][operationId] != "" {
    mutate {
      replace => {
        "operationId_label.value.string_value" => "%{properties.operationId}"
      }
      on_error => "operationId_empty"
    }
    if ![operationId_empty] {
      mutate {
        replace => {
          "operationId_label.key" => "operationId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "operationId_label"
        }
        on_error => "operationId_label_empty"
      }
    }
  }
  if [properties][apimSubscriptionId] != "" {
    mutate {
      replace => {
        "apimSubscriptionId_label.value.string_value" => "%{properties.apimSubscriptionId}"
      }
      on_error => "apimSubscriptionId_empty"
    }
    if ![apimSubscriptionId_empty] {
      mutate {
        replace => {
          "apimSubscriptionId_label.key" => "apimSubscriptionId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "apimSubscriptionId_label"
        }
        on_error => "apimSubscriptionId_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "Level" => "string"
    }
    on_error => "level_convert_failed"
  }
  if [Level] != "" {
    mutate {
      replace => {
        "Level_label.value.string_value" => "%{Level}"
      }
      on_error => "Level_empty"
    }
    if ![Level_empty] {
      mutate {
        replace => {
          "Level_label.key" => "Level"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "Level_label"
        }
        on_error => "Level_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "durationMs" => "string"
    }
    on_error => "durationMs_convert_failed"
  }
  if [durationMs] != "" {
    mutate {
      replace => {
        "durationMs_label.value.string_value" => "%{durationMs}"
      }
      on_error => "durationMs_empty"
    }
    if ![durationMs_empty] {
      mutate {
        replace => {
          "durationMs_label.key" => "durationMs"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "durationMs_label"
        }
        on_error => "durationMs_label_empty"
      }
    }
  }
  if [Sku] != "" {
    mutate {
      replace => {
        "Sku_label.value.string_value" => "%{Sku}"
      }
      on_error => "Sku_empty"
    }
    if ![Sku_empty] {
      mutate {
        replace => {
          "Sku_label.key" => "Sku"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "Sku_label"
        }
        on_error => "Sku_label_empty"
      }
    }
  }
  if [properties][productId] != "" {
    mutate {
      replace => {
        "productId_label.value.string_value" => "%{properties.productId}"
      }
      on_error => "productId_empty"
    }
    if ![productId_empty] {
      mutate {
        replace => {
          "productId_label.key" => "productId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "productId_label"
        }
        on_error => "productId_label_empty"
      }
    }
  }
  if [properties][apiId] != "" {
    mutate {
      replace => {
        "apiId_label.value.string_value" => "%{properties.apiId}"
      }
      on_error => "apiId_empty"
    }
    if ![apiId_empty] {
      mutate {
        replace => {
          "apiId_label.key" => "apiId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "apiId_label"
        }
        on_error => "apiId_label_empty"
      }
    }
  }
  if [properties][apiRevision] != "" {
    mutate {
      replace => {
        "apiRevision_label.value.string_value" => "%{properties.apiRevision}"
      }
      on_error => "apiRevision_empty"
    }
    if ![apiRevision_empty] {
      mutate {
        replace => {
          "apiRevision_label.key" => "apiRevision"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "apiRevision_label"
        }
        on_error => "apiRevision_label_empty"
      }
    }
  }
  if [properties][cache] != "" {
    mutate {
      replace => {
        "cache_label.value.string_value" => "%{properties.cache}"
      }
      on_error => "cache_empty"
    }
    if ![cache_empty] {
      mutate {
        replace => {
          "cache_label.key" => "cache"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "cache_label"
        }
        on_error => "cache_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "properties.backendResponseCode" => "string"
    }
    on_error => "backendResponseCode_convert_failed"
  }
  if [properties][backendResponseCode] != "" {
    mutate {
      replace => {
        "backendResponseCode_label.value.string_value" => "%{properties.backendResponseCode}"
      }
      on_error => "backendResponseCode_empty"
    }
    if ![backendResponseCode_empty] {
      mutate {
        replace => {
          "backendResponseCode_label.key" => "backendResponseCode"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "backendResponseCode_label"
        }
        on_error => "backendResponseCode_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "properties.backendTime" => "string"
    }
    on_error => "backendTime_convert_failed"
  }
  if [properties][backendTime] != "" {
    mutate {
      replace => {
        "backendTime_label.value.string_value" => "%{properties.backendTime}"
      }
      on_error => "backendTime_empty"
    }
    if ![backendTime_empty] {
      mutate {
        replace => {
          "backendTime_label.key" => "backendTime"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "backendTime_label"
        }
        on_error => "backendTime_label_empty"
      }
    }
  }
  if [properties][backendProtocol] != "" {
    mutate {
      replace => {
        "backendProtocol_label.value.string_value" => "%{properties.backendProtocol}"
      }
      on_error => "backendProtocol_empty"
    }
    if ![backendProtocol_empty] {
      mutate {
        replace => {
          "backendProtocol_label.key" => "backendProtocol"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "backendProtocol_label"
        }
        on_error => "backendProtocol_label_empty"
      }
    }
  }
  if [properties][clientProtocol] != "" {
    mutate {
      replace => {
        "clientProtocol_label.value.string_value" => "%{properties.clientProtocol}"
      }
      on_error => "clientProtocol_empty"
    }
    if ![clientProtocol_empty] {
      mutate {
        replace => {
          "clientProtocol_label.key" => "clientProtocol"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "clientProtocol_label"
        }
        on_error => "clientProtocol_label_empty"
      }
    }
  }
  if [properties][clientProtocol] == "HTTP/1.1" {
    mutate {
      replace => {
        "network.tls.version_protocol" => "HTTP"
      }
    }
  }
  mutate {
    convert => {
      "properties.requestSize" => "string"
    }
    on_error => "requestSize_convert_failed"
  }
  if [properties][requestSize] != "" {
    mutate {
      replace => {
        "network.sent_bytes" => "%{properties.requestSize}"
      }
      on_error => "no_http_request_size"
    }
    mutate {
      convert => {
        "network.sent_bytes" => "uinteger"
      }
      on_error => "conversion_error"
    }
  }
  if [properties][backendUrl] != "" {
    mutate {
      replace => {
        "target.url" => "%{properties.backendUrl}"
      }
      on_error => "no_httprequest_url"
    }
  }
  mutate {
    convert => {
      "properties.responseSize" => "string"
    }
    on_error => "responseSize_convert_failed"
  }
  if [properties][responseSize] != "" {
    mutate {
      replace => {
        "network.received_bytes" => "%{properties.responseSize}"
      }
      on_error => "no_http_user_agent"
    }
     mutate {
      convert => {
        "network.received_bytes" => "uinteger"
      }
      on_error => "conversion_error"
    }
  }
  if [properties][responseCode] != "" {
    mutate {
      convert => {
        "properties.responseCode" => "string"
      }
      on_error => "conversion_failed"
    }
    mutate {
      replace => {
        "network.http.response_code" => "%{properties.responseCode}"
      }
      on_error => "response_code_error"
    }
    mutate {
      convert => {
        "network.http.response_code" => "integer"
      }
      on_error => "conversion_failed"
    }
  }
  if [properties][clientTlsCipherSuite] != "" {
    mutate {
      replace => {
        "network.tls.cipher" => "%{properties.clientTlsCipherSuite}"
      }
      on_error => "cipher_suite_not_found"
    }
  }
  if [resultType] == "Succeeded" {
    mutate {
      replace => {
        "action" => "ALLOW"
        "security_result.summary" => "%{resultType}"
      }
      on_error => "result_type_failed"
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }
  if [properties][userId] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{properties.userId}"
      }
      on_error => "user_id_failed"
    }
  }
  if [resourceId] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{resourceId}"
      }
      on_error => "resource_id_failed"
    }
  }

  if [DeploymentVersion] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{DeploymentVersion}"
      }
      on_error => "DeploymentVersion_empty"
    }
  }

  if [category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "category"
      }
      on_error => "category_failed"
    }
  }

  if [operationName] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{operationName}"
      }
      on_error => "operation_name_failed"
    }
  }
  mutate {
    uppercase => ["level"]
  }

  if [level] in ["INFORMATIONAL","LOW","MEDIUM","HIGH","ERROR","CRITICAL"] {
    mutate {
      replace => {
        "security_result.severity" => "%{level}"
      }
      on_error => "level_failed"
    }
  }
  if [correlationId] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{correlationId}"
      }
      on_error => "CorrelationId_empty"
    }
  }
  if [location] != "" {
    mutate {
      replace => {
        "principal.location.name" => "%{location}"
      }
      on_error => "location_failed"
    }
  }
  if [properties][method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{properties.method}"
      }
      on_error => "invalid_method"
    }
  }
  if [properties][url] != "" {
    mutate {
      replace => {
        "principal.url" => "%{properties.url}"
      }
      on_error => "url_empty"
    }
  }
  if [properties][clientTlsVersion] != "" {
    mutate {
      replace => {
        "network.tls.version" => "%{properties.clientTlsVersion}"
      }
      on_error => "clienttlsversion_invalid"
    }
  }
  if [properties][appName] != "" {
    mutate {
      replace => {
        "target.application" => "%{properties.appName}"
      }
      on_error => "app_name_failed"
    }
  }

  if [properties][roleInstance] != "" {
    mutate {
      replace => {
        "roleInstance_label.value" => "%{properties.roleInstance}"
        "roleInstance_label.key" => "RoleInstance"
      }
      on_error => "role_instance_failed"
    }
    if ![role_instance_failed] != "" {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "roleInstance_label"
        }
        on_error => "role_instance_label_failed"
      }
    }
  }

  if [properties][message] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{properties.message}"
      }
      on_error => "message_failed"
    }
  }

  if [properties][category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "properties.category"
      }
      on_error => "category_failed"
    }
  }

  if [properties][hostVersion] != "" {
    mutate {
      replace => {
        "hostVersion_label.value.string_value" => "%{properties.hostVersion}"
        "hostVersion_label.key" => "HostVersion"
      }
      on_error => "host_version_failed"
    }
    if ![host_version_failed] != "" {
      mutate {
        merge => {
          "additional.fields" => "hostVersion_label"
        }
        on_error => "host_version_label_failed"
      }
    }
  }

  if [properties][functionInvocationId] != "" {
    mutate {
      replace => {
        "functionInvocationId_label.value.string_value" => "%{properties.functionInvocationId}"
        "functionInvocationId_label.key" => "FunctionInvocationId"
      }
      on_error => "function_invocation_id_failed"
    }
    if ![function_invocation_id_failed] != "" {
      mutate {
        merge => {
          "additional.fields" => "functionInvocationId_label"
        }
        on_error => "function_invocation_id_label_failed"
      }
    }
  }

  if [properties][functionName] != "" {
    mutate {
      replace => {
        "functionName_label.value.string_value" => "%{properties.functionName}"
        "functionName_label.key" => "FunctionName"
      }
      on_error => "function_name_failed"
    }
    if ![function_name_failed] != "" {
      mutate {
        merge => {
          "additional.fields" => "functionName_label"
        }
        on_error => "function_name_label_failed"
      }
    }
  }

  if [properties][hostInstanceId] != "" {
    mutate {
      replace => {
        "hostInstanceId_label.value.string_value" => "%{properties.hostInstanceId}"
        "hostInstanceId_label.key" => "HostInstanceId"
      }
      on_error => "host_instance_id_failed"
    }
    if ![host_instance_id_failed] != "" {
      mutate {
        merge => {
          "additional.fields" => "hostInstanceId_label"
        }
        on_error => "host_instance_id_label_failed"
      }
    }
  }

  if [properties][processId] != "" {
    mutate {
      convert => {
        "properties.processId" => "string"
      }
      on_error => "process_id_failed"
    }
    mutate {
      replace => {
        "target.process.pid" => "%{properties.processId}"
      }
      on_error => "process_id_failed"
    }
  }

  if [properties][eventId] != "" {
    mutate {
      convert => {
        "properties.eventId" => "string"
      }
      on_error => "event_id_failed"
    }
    mutate {
      replace => {
        "eventid_label.value.string_value" => "%{properties.eventId}"
        "eventid_label.key" => "EventId"
      }
      on_error => "event_id_failed"
    }
    if ![event_id_failed] != "" {
      mutate {
        merge => {
          "additional.fields" => "eventid_label"
        }
        on_error => "event_id_label_failed"
      }
    }
  }

  if [properties][eventName] != "" {
    mutate {
      replace => {
        "eventName_label.value.string_value" => "%{properties.eventName}"
        "eventName_label.key" => "EventName"
      }
      on_error => "event_name_failed"
    }
    if ![event_name_failed] != "" {
      mutate {
        merge => {
          "additional.fields" => "eventName_label"
        }
        on_error => "event_name_label_failed"
      }
    }
  }

  mutate {
    replace => {
      "metadata.event_type" => "GENERIC_EVENT"
      "metadata.vendor_name" => "AZURE_API_MANAGEMENT"
      "metadata.product_name" => "AZURE API MANAGEMENT"
    }
  }

  if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }


  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }


  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_sec_result"
    }
  }

  # Output the mapped fields as an UDM event
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
