# Product: HP_LINUX
# Category: OS
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2025-10-27
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      # fields
      "ts" => ""
      "msg" => ""
      "host" => ""
      "process" => ""
      "p_id" => ""
      "sev" => ""
      "desc" => ""
      "user" => ""
      "src_ip" => ""
      "src_port" => ""
      "proto" => ""
      "kvmsg" => ""
      "arg1" => ""
      "ruleset" => ""
      "auth_failures" => ""
      "to" => ""
      "delay" => ""
      "dsn" => ""
      "mailer" => ""
      "pri" => ""
      "xdelay" => ""
      "stat" => ""
      "ctladdr" => ""
      "syslog_pri" => ""
      "log_level" => ""
      "audit_type" => ""
      "suite" => ""
      "action_type" => ""
      "version" => ""
      "event_code" => ""
      "severity" => ""
      "kv_msg" => ""
      "utc" => ""
      "centrifyEventID" => ""
      "DASessID" => ""
      "server" => ""
      "status" => ""
      "DAInst" => ""
      "ssh_version" => ""
      "security_result_action" => ""
      # event type specific
      "event_type" => ""
      "principal_mid_present" => "false"
      "principal_user_present" => "false"
      "target_mid_present" => "false"
      # udm noun
      "metadata" => ""
      "principal" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "target" => ""
      "target_user_present" => "false"
      "tty" => ""
      "principal_user" => ""
      "target_user" => ""
      "target_hostname" => ""
      "msg_id" => ""
    }
  }
  grok {
    match => {
       "message" => [
          "<%{INT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{WORD:sev}: %{DATA:desc}: %{WORD:process}\\[%{NUMBER:p_id}\\]: %{GREEDYDATA:msg}",
          "<%{INT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA:process}\\[%{NUMBER:p_id}\\]: %{GREEDYDATA:msg}",
          "<%{INT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA:process}: %{GREEDYDATA:msg}",
          "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{DATA:process}\\[%{INT:p_id}\\]: %{WORD:log_level} (?<audit_type>[^|]+)\\|(?<suite>[^|]+)\\|(?<action_type>[^|]+)\\|(?<version>%{NUMBER})\\|(?<event_code>%{POSINT})\\|(?<msg>[^|]+)\\|(?<severity>%{POSINT})\\|%{GREEDYDATA:kv_msg}"
          "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{DATA:process}\\[%{INT:p_id}\\]: Accepted password for %{DATA:user} from %{IP:src_ip} port %{INT:src_port} %{GREEDYDATA:ssh_version}"
          "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{DATA:process}\\[%{INT:p_id}\\]: Disconnected from %{IP:src_ip} port %{INT:src_port}"
          '<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{DATA:process}: %{DATA:msg} \\"%{WORD:user}\\"'
          "<%{INT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{WORD:process}\\[%{NUMBER:p_id}\\]: %{GREEDYDATA:msg}",
          "<%{INT:syslog_pri}>%{SYSLOGTIMESTAMP:ts} %{WORD:process}: %{GREEDYDATA:msg}",
        ]
    }
    overwrite => ["syslog_pri","ts","msg","host","process","p_id","sev","desc","log_level","audit_type","suite","action_type","version","event_code","severity","kv_msg","user","src_ip","src_port","ssh_version"]
    on_error  => "header_grok_match_failed"
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  kv {
    source => "kv_msg"
    field_split => " "
    value_split => "="
    on_error => "kv_fail"
  }

  if [utc] != "" {
    date {
      match => ["utc", "UNIX_MS"]
      target => "metadata.event_timestamp"
      on_error => "date_match_failed"
    }
  }
  if [suite] != "" {
    mutate {
      replace => {
        "suite_label.key" => "suite"
        "suite_label.value.string_value" => "%{suite}"
      }
      on_error => "suite_label_merge_error"
    }
    if ![suite_label_merge_error] {
      mutate {
        merge => {
          "additional.fields" => "suite_label"
        }
        on_error => "suite_label_merge_failed"
      }
    }
  }
  if [version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{version}"
      }
      on_error => "version_value_invalid"
    }
  }
  if [action_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{action_type}"
      }
      on_error => "action_type_value_invalid"
    }
  }
  if [centrifyEventID] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{centrifyEventID}"
      }
      on_error => "centrifyEventID_value_invalid"
    }
  }
  if [DASessID] not in ["","N/A"] {
    mutate {
      replace => {
        "network.session_id" => "%{DASessID}"
      }
      on_error => "DASessID_value_invalid"
    }
  }
  if [server] != "" {
    grok {
      match => { "server" => "%{WORD:t_app}/%{DATA:t_hostname}@%{GREEDYDATA:t_domain}" }
      on_error => "server_grok_fail"
    }
    if ![server_grok_fail] {
      if [t_app] != "" {
          mutate {
            replace => {
              "target.application" => "%{t_app}"
            }
            on_error => "t_app_value_invalid"
          }
      }
      if [t_hostname] != "" {
        mutate {
          replace => {
            "target.hostname" => "%{t_hostname}"
            "target.asset.hostname" => "%{t_hostname}"
            "target_mid_present" => "true"
          }
          on_error => "t_hostname_value_invalid"
        }
      }
      if [t_domain] != "" {
          mutate {
            replace => {
              "target.administrative_domain" => "%{t_domain}"
            }
            on_error => "t_domain_value_invalid"
          }
      }
    }
  }
  if [status] == "GRANTED" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }
  else if [message] =~ "authentication failures" {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
  }
  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
      on_error => "security_result_action_merge_failed"
    }
  }
  if [log_level] == "INFO" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  if [log_level] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{log_level}"
      }
      on_error => "log_level_value_invalid"
    }
  }
  if [event_code] != "" {
    mutate {
      replace => {
        "event_code_label.key" => "event_code"
        "event_code_label.value.string_value" => "%{event_code}"
      }
      on_error => "event_code_value_invalid"
    }
    if ![event_code_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "event_code_label"
        }
        on_error => "event_code_label_merge_error"
      }
    }
  }
  if [DAInst] != "" and [DAInst] != "N/A" {
    mutate {
      replace => {
        "da_instance_label.key" => "da_instance"
        "da_instance_label.value.string_value" => "%{DAInst}"
      }
      on_error => "da_instance_value_invalid"
    }
    if ![da_instance_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "da_instance_label"
        }
        on_error => "da_instance_label_merge_error"
      }
    }
  }
  if [severity] != "" {
    mutate {
      replace => {
        "raw_severity_label.key" => "raw_severity"
        "raw_severity_label.value.string_value" => "%{severity}"
      }
      on_error => "raw_severity_value_invalid"
    }
    if ![raw_severity_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "raw_severity_label"
        }
        on_error => "raw_severity_label_merge_error"
      }
    }
  }
  if [syslog_pri] != "" {
    mutate {
      replace => {
        "syslog_priority_label.key" => "syslog_priority"
        "syslog_priority_label.value.string_value" => "%{syslog_pri}"
      }
      on_error => "syslog_priority_value_invalid"
    }
    if ![syslog_priority_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "syslog_priority_label"
        }
        on_error => "syslog_priority_label_merge_failed"
      }
    }
  }
  if [audit_type] != "" {
    mutate {
      replace => {
        "audit_type_label.key" => "audit_type"
        "audit_type_label.value.string_value" => "%{audit_type}"
      }
      on_error => "audit_type_value_invalid"
    }
    if ![audit_type_value_invalid] {
      mutate {
        merge => {
        "additional.fields" => "audit_type_label"
        }
        on_error => "audit_type_label_merge_failed"
      }
    }
  }
  if [ssh_version] != "" {
    mutate {
      replace => {
        "ssh_version_label.key" => "ssh_version"
        "ssh_version_label.value.string_value" => "%{ssh_version}"
      }
      on_error => "ssh_version_value_invalid"
    }
    if ![ssh_version_value_invalid] {
      mutate {
        merge => {
        "additional.fields" => "ssh_version_label"
        }
        on_error => "ssh_version_label_merge_failed"
      }
    }
  }


  if [ts] != "" {
    date {
      match => ["ts", "MMM  d HH:mm:ss"]
      rebase => true
      on_error => "date_match_failed"
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "principal_mid_present" => "true"
      }
      on_error => "host_value_invalid"
    }
  }
  if [p_id] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{p_id}"
      }
      on_error => "p_id_value_invalid"
    }
  }
  if [process] != "" {
    mutate {
      replace => {
        "principal.application" => "%{process}"
      }
      on_error => "process_value_invalid"
    }
  }
  if [msg] != "" {
    if [process] == "sendmail" {
      grok {
        match => {
          "msg" => [
            "%{DATA:msg_id}: %{GREEDYDATA:kvmsg}"
          ]
        }
        overwrite => ["kvmsg", "msg_id"]
        on_error => "msg_value_invalid"
      }
    }
    else if [process] == "login" {
      grok {
        match => {
          "msg" => [
            "%{NUMBER:auth_failures} authentication failures on account"
          ]
        }
        overwrite => ["user","auth_failures"]
        on_error => "msg_value_invalid"
      }
    }
    else if [process] == "su" {
      grok {
        match => { "msg" => "\\+ %{DATA:tty} %{DATA:principal_user}-%{GREEDYDATA:target_user}" }
        overwrite => ["principal_user", "target_user", "tty"]
        on_error => "su_msg_grok_failed"
      }
      if [principal_user] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{principal_user}"
            "principal_user_present" => "true"
          }
          on_error => "principal_user_value_invalid"
        }
      }
      if [target_user] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{target_user}"
            "target_user_present" => "true"
          }
          on_error => "target_user_value_invalid"
        }
      }
      if [tty] != "" {
        mutate {
          replace => {
            "tty_label.key" => "tty"
            "tty_label.value.string_value" => "%{tty}"
          }
          on_error => "tty_value_invalid"
        }
        if ![tty_value_invalid] {
          mutate {
            merge => {
              "additional.fields" => "tty_label"
            }
            on_error => "tty_label_merge_failed"
          }
        }
      }
    }
    else if [process] == "syslogd" {
      grok {
        match => {
          "msg" => "unknown host %{HOSTNAME:target_hostname}"
        }
        overwrite => ["target_hostname"]
        on_error => "syslogd_msg_grok_failed"
      }
      if [target_hostname] != "" {
        mutate {
          replace => {
            "target.hostname" => "%{target_hostname}"
            "target.asset.hostname" => "%{target_hostname}"
            "target_mid_present" => "true"
          }
          on_error => "target_hostname_value_invalid"
        }
      }
    }
    else {
      grok {
        match => {
          "msg" => [
            "%{WORD} from user %{WORD:user} %{IP:src_ip} port %{NUMBER:src_port}"
            "%{WORD:proto}: %{WORD} from %{WORD} \\(%{IP:src_ip}"
            "%{DATA}: %{GREEDYDATA:kvmsg} %{DATA}\\... %{GREEDYDATA:msg}"
          ]
        }
        overwrite => ["user","src_ip","src_port","proto","kvmsg","msg"]
        on_error => "msg_value_invalid"
      }
    }
    if [process] != "sendmail" {
      mutate {
        replace => {
          "metadata.description" => "%{msg}"
        }
        on_error => "msg_value_invalid"
      }
    }
  }
  if [src_port] != "" {
    mutate {
      replace => {
        "principal.port" => "%{src_port}"
      }
      on_error => "src_port_value_invalid"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "src_port_value_invalid"
    }
  }
  if [sev] =~ "(?i)ERROR" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }
  if [proto] == "tcp" {
    mutate {
      replace => {
        "network.ip_protocol" => "TCP"
      }
    }
  }
  else if [message] =~ "(?i)ssh" {
    mutate {
      replace => {
        "network.application_protocol" => "SSH"
      }
    }
  }
  if [kvmsg] != "" {
    kv {
      source => "kvmsg"
      field_split => ","
      value_split => "="
      on_error => "kv_fail"
    }
  }
  if [ctladdr] != "" {
    mutate {
      replace => {
        "ctladdr_label.key" => "ctladdr"
        "ctladdr_label.value.string_value" => "%{ctladdr}"
      }
      on_error => "ctladdr_value_invalid"
    }
    if ![ctladdr_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "ctladdr_label"
        }
        on_error => "ctladdr_label_merge_error"
      }
    }
  }
  if [to] != "" {
    mutate {
      replace => {
        "to_label.key" => "to"
        "to_label.value.string_value" => "%{to}"
      }
      on_error => "to_value_invalid"
    }
    if ![to_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "to_label"
        }
        on_error => "to_label_merge_failed"
      }
    }
  }
  if [delay] != "" {
    mutate {
      replace => {
        "delay_label.key" => "delay"
        "delay_label.value.string_value" => "%{delay}"
      }
      on_error => "delay_value_invalid"
    }
    if ![delay_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "delay_label"
        }
        on_error => "delay_label_merge_error"
      }
    }
  }
  if [dsn] != "" {
    mutate {
      replace => {
        "dsn_label.key" => "dsn"
        "dsn_label.value.string_value" => "%{dsn}"
      }
      on_error => "dsn_value_invalid"
    }
    if ![dsn_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "dsn_label"
        }
        on_error => "dsn_label_merge_failed"
      }
    }
  }
  if [mailer] != "" {
    mutate {
      replace => {
        "mailer_label.key" => "mailer"
        "mailer_label.value.string_value" => "%{mailer}"
      }
      on_error => "mailer_value_invalid"
    }
    if ![mailer_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "mailer_label"
        }
        on_error => "mailer_label_merge_failed"
      }
    }
  }
  if [pri] != "" {
    mutate {
      replace => {
        "pri_label.key" => "pri"
        "pri_label.value.string_value" => "%{pri}"
      }
      on_error => "pri_value_invalid"
    }
    if ![pri_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "pri_label"
        }
        on_error => "pri_label_merge_failed"
      }
    }
  }
  if [xdelay] != "" {
    mutate {
      replace => {
        "xdelay_label.key" => "xdelay"
        "xdelay_label.value.string_value" => "%{xdelay}"
      }
      on_error => "xdelay_value_invalid"
    }
    if ![xdelay_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "xdelay_label"
        }
        on_error => "xdelay_label_merge_failed"
      }
    }
  }
  if [stat] != "" {
    mutate {
      replace => {
        "stat_label.key" => "stat"
        "stat_label.value.string_value" => "%{stat}"
      }
      on_error => "stat_value_invalid"
    }
    if ![stat_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "stat_label"
        }
        on_error => "stat_label_merge_failed"
      }
    }
  }
  if [auth_failures] != "" {
    mutate {
      replace => {
        "auth_failures_label.key" => "auth_failures"
        "auth_failures_label.value.string_value" => "%{auth_failures}"
      }
      on_error => "auth_failures_value_invalid"
    }
    if ![auth_failures_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "auth_failures_label"
        }
        on_error => "auth_failures_label_merge_failed"
      }
    }
  }
  if [msg_id] != "" {
    mutate {
      replace => {
        "msg_id_label.key" => "msg_id"
        "msg_id_label.value.string_value" => "%{msg_id}"
      }
      on_error => "msg_id_value_invalid"
    }
    if ![msg_id_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "msg_id_label"
        }
        on_error => "msg_id_label_merge_failed"
      }
    }
  }
  if [arg1] != "" {
    grok {
      match => {
        "arg1" => [
          "<%{WORD:user}@\\[%{IP:src_ip}"
        ]
      }
      overwrite => ["user","src_ip"]
      on_error => "arg1_value_invalid"
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "src_ip_value_invalid"
    }
    mutate {
      replace => {
        "principal_mid_present" => "true"
      }
    }
  }
  if [process] in ["sshd", "login"] and [user] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{user}"
        "target_user_present" => "true"
      }
      on_error => "user_value_invalid"
    }
  }
  else if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
        "principal_user_present" => "true"
      }
      on_error => "user_value_invalid"
    }
  }

  if [ruleset] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{ruleset}"
      }
      on_error => "ruleset_invalid"
    }
  }

  # metadata info
  mutate {
    replace => {
      "metadata.vendor_name" => "HP Linux"
      "metadata.product_name" => "HP Linux"
    }
  }

  if [event_type] == "" {
    if [process] in ["sshd", "login"] and [target_user_present] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [principal_mid_present] == "true" and [target_mid_present] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [principal_user_present] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [principal_mid_present] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }


  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_value_invalid"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
