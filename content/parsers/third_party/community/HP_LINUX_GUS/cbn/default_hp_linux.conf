# Google SecOps Default CBN Parser (HP_LINUX)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/HP_LINUX/default/hp_linux.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "HP"
      "event.idm.read_only_udm.metadata.product_name" => "HP_LINUX"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
