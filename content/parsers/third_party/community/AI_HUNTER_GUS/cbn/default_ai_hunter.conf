# Product: Active Countermeasures
# Category: Alert
# Supported Format: SYSLOG, SYSLOG + JSON
# Reference: See below
# Last Updated: 2026-06-25
# Copyright 2026 Google SecOps



# AI hunter log parser

# Log description:

# The most important values are “Score”, “PreviousScore” and IP.
# The higher the score, the more suspicious that IP might be for beacon network traffic.
# Other values are combined to represent the score and give context to why the score is higher or lower.

filter {

  mutate {
    replace => {
      "ts_month" => ""
      "ts_day" => ""
      "ts_time" => ""
      "ts_iso8601" => ""
      "max_beacon" => ""
      "max_duration" => ""
      "blacklist_in" => ""
      "blacklist_out" => ""
      "blacklist_avg_bytes" => ""
      "dns_txt_query" => ""
      "unexpected_proto" => ""
      "invalid_cert" => ""
      "rare_client" => ""
      "source_module" => ""
      "api_msg" => ""
      "domain" => ""
      "src_ip" => ""
      "score" => ""
      "prev_score" => ""
      "database" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "src" => ""
      "dst" => ""
      "sensor" => ""
      "url" => ""
      "threat_level" => ""
      "is_new_threat" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{MONTH:ts_month} %{MONTHDAY:ts_day} %{TIME:ts_time} [a-z0-9]+ AI-Hunter\\[%{INT}\\]: %{GREEDYDATA:inner_message}",
        "<%{INT}>\\s*%{TIMESTAMP_ISO8601:ts_iso8601} %{DATA:source_module} %{DATA:api_msg}\\[%{INT}\\]: %{GREEDYDATA:inner_message}"
      ]
    }
    overwrite => ["ts_month", "ts_day", "ts_time", "ts_iso8601", "inner_message", "source_module", "api_msg"]
    on_error => "grok_error"
  }

  grok {
    match => {
      "inner_message" => [
        "Host: %{IP:src_ip} Score: %{INT:score} PreviousScore: %{INT:prev_score} Database: (?P<database>\\S+) MaxBeaconScore: %{BASE10NUM:max_beacon} MaxDurationScore: %{BASE10NUM:max_duration} BlacklistInScore: %{BASE10NUM:blacklist_in} BlacklistOutScore: %{BASE10NUM:blacklist_out} BlacklistAvgBytesScore: %{BASE10NUM:blacklist_avg_bytes} DNSTxtQueryScore: %{BASE10NUM:dns_txt_query} UnexpectedProtoScore: %{BASE10NUM:unexpected_proto} InvalidCertScore: %{BASE10NUM:invalid_cert} RareClientScore: %{BASE10NUM:rare_client}",
        "Host: %{IP:src_ip} Score: %{INT:score} PreviousScore: %{INT:prev_score} Database: (?P<database>\\S+)",
        "Database: (?P<database>\\S+) Domain: %{HOSTNAME:domain}"
      ]
    }
    overwrite => ["src_ip", "score", "prev_score", "database", "max_beacon", "max_duration", "blacklist_in", "blacklist_out", "blacklist_avg_bytes", "dns_txt_query", "unexpected_proto", "invalid_cert", "rare_client", "domain"]
    on_error => "grok_failure"
  }

  json {
    source => "inner_message"
    array_function => "split_columns"
    on_error => "json_error"
  }

  if [ts_month] != "" {
    mutate {
      replace => {
        "ts_date" => "%{ts_month} %{ts_day} %{ts_time}"
      }
      on_error => "ts_date_error"
    }
  }
  if [api_msg] != "" {
    mutate {
      replace => {
        "api_msg_label.key" => "APIMessage"
        "api_msg_label.value.string_value" => "%{api_msg}"
      }
      on_error => "api_msg_error"
    }
    if ![api_msg_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "api_msg_label"
        }
        on_error => "api_msg_label_merge_error"
      }
    }
  }

  if [source_module] != "" {
    mutate {
      replace => {
        "source_module_label.key" => "SourceModule"
        "source_module_label.value" => "%{source_module}"
      }
      on_error => "source_module_error"
    }
    if ![source_module_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "source_module_label"
        }
        on_error => "source_module_label_merge_error"
      }
    }
  }
  if [domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{domain}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{domain}"

      }
      on_error => "domain_error"
    }
  }

  if [score] != "" {
    mutate {
      replace => {
        "score_label.key" => "Score"
        "score_label.value" => "%{score}"
      }
      on_error => "score_label_error"
    }
    if ![score_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "score_label"
        }
        on_error => "score_label_merge_error"
      }
    }
  }

  if [prev_score] != "" {
    mutate {
      replace => {
        "prev_score_label.key" => "PreviousScore"
        "prev_score_label.value" => "%{prev_score}"
      }
      on_error => "prev_score_label_error"
    }
    if ![prev_score_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "prev_score_label"
        }
        on_error => "prev_score_label_merge_error"
      }
    }
  }

  if [database] != "" {
    mutate {
      replace => {
        "database_label.key" => "Database"
        "database_label.value" => "%{database}"
      }
      on_error => "database_label_error"
    }
    if ![database_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "database_label"
        }
        on_error => "database_label_merge_error"
      }
    }
  }

  if [max_beacon] != "" {
    mutate {
      replace => {
        "max_beacon_label.key" => "MaxBeaconScore"
        "max_beacon_label.value" => "%{max_beacon}"
      }
      on_error => "max_beacon_label_error"
    }
    if ![max_beacon_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "max_beacon_label"
        }
        on_error => "max_beacon_label_merge_error"
      }
    }
  }
  if [max_duration] != "" {
    mutate {
      replace => {
        "max_duration_label.key" => "MaxDurationScore"
        "max_duration_label.value" => "%{max_duration}"
      }
      on_error => "max_duration_label_error"
    }
    if ![max_duration_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "max_duration_label"
        }
        on_error => "max_duration_label_merge_error"
      }
    }
  }
  if [blacklist_in] != "" {
    mutate {
      replace => {
        "blacklist_in_label.key" => "BlacklistInScore"
        "blacklist_in_label.value" => "%{blacklist_in}"
      }
      on_error => "blacklist_in_label_error"
    }
    if ![blacklist_in_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "blacklist_in_label"
        }
        on_error => "blacklist_in_label_merge_error"
      }
    }
  }
  if [blacklist_out] != "" {
    mutate {
      replace => {
        "blacklist_out_label.key" => "BlacklistOutScore"
        "blacklist_out_label.value" => "%{blacklist_out}"
      }
      on_error => "blacklist_out_label_error"
    }
    if ![blacklist_out_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "blacklist_out_label"
        }
        on_error => "blacklist_out_label_merge_error"
      }
    }
  }
  if [blacklist_avg_bytes] != "" {
    mutate {
      replace => {
        "blacklist_avg_bytes_label.key" => "BlacklistAvgBytesScore"
        "blacklist_avg_bytes_label.value" => "%{blacklist_avg_bytes}"
      }
      on_error => "blacklist_avg_bytes_label_error"
    }
    if ![blacklist_avg_bytes_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "blacklist_avg_bytes_label"
        }
        on_error => "blacklist_avg_bytes_label_merge_error"
      }
    }
  }
  if [dns_txt_query] != "" {
    mutate {
      replace => {
        "dns_txt_query_label.key" => "DNSTxtQueryScore"
        "dns_txt_query_label.value" => "%{dns_txt_query}"
      }
      on_error => "dns_txt_query_label_error"
    }
    if ![dns_txt_query_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "dns_txt_query_label"
        }
        on_error => "dns_txt_query_label_merge_error"
      }
    }
  }
  if [unexpected_proto] != "" {
    mutate {
      replace => {
        "unexpected_proto_label.key" => "UnexpectedProtoScore"
        "unexpected_proto_label.value" => "%{unexpected_proto}"
      }
      on_error => "unexpected_proto_label_error"
    }
    if ![unexpected_proto_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "unexpected_proto_label"
        }
        on_error => "unexpected_proto_label_merge_error"
      }
    }
  }
  if [invalid_cert] != "" {
    mutate {
      replace => {
        "invalid_cert_label.key" => "InvalidCertScore"
        "invalid_cert_label.value" => "%{invalid_cert}"
      }
      on_error => "invalid_cert_label_error"
    }
    if ![invalid_cert_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "invalid_cert_label"
        }
        on_error => "invalid_cert_label_merge_error"
      }
    }
  }
  if [rare_client] != "" {
    mutate {
      replace => {
        "rare_client_label.key" => "RareClientScore"
        "rare_client_label.value" => "%{rare_client}"
      }
      on_error => "rare_client_label_error"
    }
    if ![rare_client_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.labels" => "rare_client_label"
        }
        on_error => "rare_client_label_merge_error"
      }
    }
  }

  if [ts_month] != "" {
    date {
      match => ["ts_date", "MMM dd HH:mm:ss"]
      rebase => true
      on_error => "date_error"
    }
  }
  if [ts_iso8601] != "" {
    date {
      match => ["ts_iso8601", "ISO8601"]
      on_error => "date_error_iso8601"
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
      }
      on_error => "src_ip_error"
    }
    if ![src_ip_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
        on_error => "has_principal_error"
      }
    }
  }

  if [src] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src"
        "event.idm.read_only_udm.principal.asset.ip" => "src"
      }
      on_error => "src_error"
    }
    if ![src_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
        on_error => "has_principal_failed"
      }
    }
  }

  if [dst] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dst"
        "event.idm.read_only_udm.target.asset.ip" => "dst"
      }
      on_error => "dst_error"
    }
    if ![dst_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
        on_error => "has_target_error"
      }
    }
  }

  if [sensor] != "" {
    mutate {
      replace => {
        "sensor_label.key" => "sensor"
        "sensor_label.value.string_value" => "%{sensor}"
      }
      on_error => "sensor_label_error"
    }
    if ![sensor_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "sensor_label"
        }
        on_error => "sensor_label_merge_error"
      }
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
      on_error => "url_error"
    }
  }

  if [threat_level] != "" {
    if [threat_level] in ["Low", "LOW"] {
      mutate {
        replace => {
          "sec_result.severity" => "LOW"
        }
      }
    }
    else if [threat_level] in ["Medium", "MEDIUM"] {
      mutate {
        replace => {
          "sec_result.severity" => "MEDIUM"
        }
      }
    }
    else if [threat_level] in ["High", "HIGH"] {
      mutate {
        replace => {
          "sec_result.severity" => "HIGH"
        }
      }
    }
    else if [threat_level] in ["Critical", "CRITICAL"] {
      mutate {
        replace => {
          "sec_result.severity" => "CRITICAL"
        }
      }
    }
    else {
      mutate {
        replace => {
          "sec_result.severity_details" => "%{threat_level}"
        }
        on_error => "threat_level_details_error"
      }
    }
  }

  if [is_new_threat] != "" {
    mutate {
      convert => {
        "is_new_threat" => "string"
      }
      on_error => "is_new_threat_convert_error"
    }
    mutate {
      replace => {
        "is_new_threat_label.key" => "is_new_threat"
        "is_new_threat_label.value" => "%{is_new_threat}"
      }
      on_error => "is_new_threat_label_error"
    }
    if ![is_new_threat_label_error] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "is_new_threat_label"
        }
        on_error => "is_new_threat_label_merge_error"
      }
    }
  }

  if [threat_level] != "" or [is_new_threat] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
      on_error => "sec_result_merge_error"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "AI hunter"
      "event.idm.read_only_udm.metadata.vendor_name" => "Active Countermeasures"
    }
    on_error => "metadata_error"
  }
  if [score] != "" or [prev_score] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "Scores current/previous: %{score}/%{prev_score}"
      }
      on_error => "description_error"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
