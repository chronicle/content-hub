    if ![no_lastActiveDurationInMonths_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "lastActiveDurationInMonths_label"
        }
        on_error => "no_lastActiveDurationInMonths_label"
      }
    }
  }

  if [lastActiveTime] != "" {
    mutate {
      replace => {
        "lastActiveTime_label.key" => "lastActiveTime"
        "lastActiveTime_label.value.string_value" => "%{lastActiveTime}"
      }
      on_error => "no_lastActiveTime_label"
    }
    if ![no_lastActiveTime_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "lastActiveTime_label"
        }
        on_error => "no_lastActiveTime_label"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "ZERO_NETWORKS"
      "event.idm.read_only_udm.metadata.product_name" => "ZERO_NETWORKS"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }

  if [has_target_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
