# Product: SYNOLOGY
# Category: DATA STORAGE
# Supported Format: SYSLOG , JSON
# Reference: N/A
# Last Updated: 2026-09-03
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "intermediary_host" => ""
      "host_and_ip"       => ""
      "intermediary"      => ""
      "event_type"        => ""
      "app"               => ""
      "time"              => ""
      "type"              => ""
      "user"              => ""
      "desc"              => ""
      "host"              => ""
      "ip1"               => ""
      "ip2"               => ""
      "path"              => ""
      "domain"            => ""
      "sec_action"        => ""
      "security_result"   => ""
      "severity"          => ""
      "hostname"          => ""
      "has_principal"     => "false"
      "appname"           => ""
      "priority"          => ""
      "message1"          => ""
      "facility"          => ""
      "has_target_user"   => "false"
      "uploaded_bytes"    => ""
      "downloaded_bytes"  => ""
      "syslog_priority"   => ""
    }
  }

  if [message] == "No raw event available" {
    drop {
      tag => "TAG_NO_SECURITY_VALUE"
    }
  }
  grok {
    match => {
      "message" => [
        "(%{SYSLOGTIMESTAMP:time} %{HOSTNAME:intermediary_host} %{WORD:type}: )?User \\[%{DATA:user}\\] from \\[%{DATA:host_and_ip}\\] %{GREEDYDATA:desc}",
        "%{TIMESTAMP_ISO8601:time}.*\\[%{WORD:severity}\\] %{DATA:app}: %{GREEDYDATA:desc}",
        "%{TIMESTAMP_ISO8601:time} %{HOSTNAME:intermediary_host} %{DATA:app}: %{GREEDYDATA:desc}",
        "^((<%{INT:syslog_priority}>)?%{SYSLOGTIMESTAMP:time} %{DATA:intermediary_host} %{WORD:type}( %{DATA})?:\\s+)?%{WORD:app} client \\[%{DATA:user}\\] from \\[%{DATA:host_and_ip}\\] %{GREEDYDATA:desc}$",
      ]
    }
    overwrite => ["time", "intermediary_host", "type", "user", "host_and_ip", "desc","severity","app", "syslog_priority"]
    on_error => "grok_failure"
  }
  if [grok_failure] {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_in_json"
    }
    if ![not_in_json] {
      mutate {
        replace => {
          "message1" => "%{message}"
        }
        on_error => "no_message1"
      }
    }
    else {
      mutate {
        replace => {
          "desc" => "%{message}"
        }
        on_error => "no_desc"
      }
    }
  }

  if [time] != "" {
    date {
      match => ["time", "MMM d HH:mm:ss", "MMM  d HH:mm:ss" ]
      rebase => true
      on_error => "diff_format"
    }
  }

  if [host_and_ip] != "" {
    grok {
      match => {
        "host_and_ip" => [
          "%{IP:ip1}\\(%{IP:ip2}\\)",
          "%{HOSTNAME:host}\\(%{IP:ip1}\\)",
          "%{IP:ip1}"
        ]
      }
      overwrite => ["ip1", "ip2", "host"]
      on_error => "match_failure"
    }
  }

  if [type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{type}"
      }
      on_error => "type_not_found"
    }
  }

  if [app] != "" {
    mutate {
      replace => {
        "target.application" => "%{app}"
      }
      on_error => "app_not_found"
    }
  }

  if [desc] != "" {
    grok {
      match => {
        "desc" => [
          "accessed shared folder \\[%{DATA:path}\\]",
          "Closed\\)(?P<path>.*JPG)"
        ]
      }
      overwrite => ["path"]
      on_error => "no_path"
    }
    mutate {
      replace => {
        "metadata.description" => "%{desc}"
      }
      on_error => "description_not_found"
    }
  }

  if [intermediary_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_host}"
      }
      on_error => "host_not_found"
    }
  }

  if [user] != "" {
    grok {
      match => {
        "user" => "%{DATA:user}\\\\%{GREEDYDATA:domain}"
      }
      overwrite => ["user","domain"]
      on_error => "no_domain"
    }
    if ![no_domain] {
      mutate {
        replace => {
          "target.administrative_domain" => "%{domain}"
        }
        on_error => "domain_not_found"
      }
    }
    mutate {
      replace => {
        "target.user.userid" => "%{user}"
        "has_target_user" => "true"
      }
      on_error => "user_not_found"
    }
  }

  if [path] != "" {
    mutate {
      merge => {
        "target.file.names" => "path"
      }
      on_error => "no_path"
    }
  }

  if [ip1] != "" {
    mutate {
      merge => {
        "principal.ip" => "ip1"
      }
      on_error => "no_ip"
    }
    if ![no_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [ip2] != "" {
    mutate {
      merge => {
        "principal.ip" => "ip2"
      }
      on_error => "no_ip2"
    }
    if ![no_ip2] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "no_host"
    }
  }

  if [message] =~ "(?i)(signed in|sign in)" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [message] =~ "(?i) accessed shared folder" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }

  if [message] =~ "failed to sign" {
    mutate {
      replace => {
        "sec_action" => "BLOCK"
      }
    }
  }
  else if [message] =~ "success" {
    mutate {
      replace => {
        "sec_action" => "ALLOW"
      }
    }
  }

  if [sec_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sec_action"
      }
      on_error => "merge_failure"
    }
  }

  if [severity] =~ "(?i)INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }

  grok {
    match => {
      "desc" => [
        "%{GREEDYDATA}\\[%{DATA:uploaded_bytes} bytes\\] %{GREEDYDATA}\\[%{DATA:downloaded_bytes} bytes\\]%{GREEDYDATA}",
      ]
    }
    overwrite => ["uploaded_bytes", "downloaded_bytes"]
    on_error => "no_bytes"
  }
  if [uploaded_bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{uploaded_bytes}"
      }
      on_error => "no_uploaded_bytes"
    }
    if ![no_uploaded_bytes] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
        }
        on_error => "sc_bytes_int_error"
      }
    }
  }
  if [downloaded_bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{downloaded_bytes}"
      }
      on_error => "no_downloaded_bytes"
    }
    if ![no_downloaded_bytes] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.received_bytes" => "uinteger"
        }
        on_error => "rc_bytes_int_error"
      }
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
        "principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "no_hostname"
    }
  }
  if [appname] != "" {
    mutate {
      replace => {
        "principal.application" => "%{appname}"
      }
      on_error => "no_appname"
    }
  }
  if [message1] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{message1}"
      }
      on_error => "no_message"
    }
  }
  mutate {
    convert => {
      "priority" => "string"
    }
    on_error => "priority_conversion_error"
  }
  if [priority] != "" {
    mutate {
      replace => {
        "priority_label.key" => "priority"
        "priority_label.value.string_value" => "%{priority}"
      }
      on_error => "no_priority"
    }
    if ![no_priority] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "priority_label"
        }
        on_error => "no_priority_label"
      }
    }
  }
  mutate {
    convert => {
      "facility" => "string"
    }
    on_error => "facility_conversion_error"
  }
  if [facility] != "" {
    mutate {
      replace => {
        "facility_label.key" => "facility"
        "facility_label.value.string_value" => "%{facility}"
      }
      on_error => "no_facility"
    }
    if ![no_facility] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "facility_label"
        }
        on_error => "no_facility_label"
      }
    }
  }
  if [syslog_priority] != "" {
    mutate {
      replace => {
        "syslog_priority_label.key" => "syslog_priority"
        "syslog_priority_label.value.string_value" => "%{syslog_priority}"
      }
      on_error => "no_syslog_priority"
    }
    if ![no_syslog_priority] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "syslog_priority_label"
        }
        on_error => "no_syslog_priority_label"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "no_event_type"
    }
  }
  else if [has_target_user] == "true" and [has_principal] == "true" and [message] =~ "logged out" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_target_user] == "true" and [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => no_intermediary
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "SYNOLOGY"
      "metadata.product_name" => "SYNOLOGY"
    }
  }

  mutate {
    rename => {
      "metadata" => "event.idm.read_only_udm.metadata"
      "target" => "event.idm.read_only_udm.target"
      "principal" => "event.idm.read_only_udm.principal"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
