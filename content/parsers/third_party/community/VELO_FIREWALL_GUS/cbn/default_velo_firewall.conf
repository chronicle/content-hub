# Product:VELO_FIREWALL
# Category: FIREWALL
# Supported Format: SYSLOG + KV, SYSLOG
# Reference: N/A
# Last Updated: 2026-02-12
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "ACTION" => ""
      "APPLICATION" => ""
      "BYTES_RECEIVED" => ""
      "BYTES_SENT" => ""
      "DEST_NAME" => ""
      "DST" => ""
      "DURATION_SECS" => ""
      "FW_POLICY_NAME" => ""
      "IN" => ""
      "SPT" => ""
      "DPT" => ""
      "PROTO" => ""
      "REASON" => ""
      "SEGMENT" => ""
      "SEGMENT_NAME" => ""
      "SID" => ""
      "SRC" => ""
      "NAT_SRC" => ""
      "NAT_SPT" => ""
      "DEST_DOMAIN" => ""
      "timestamp" => ""
      "protocol_number_src" => ""
      "inter_hostname" => ""
      "product_event_type" => ""
      "kv_data" => ""
      "target_present" => "false"
      "principal_present" => "false"
      "target" => ""
      "principal" => ""
      "intermediary" => ""
      "metadata" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "security_result_action" => ""
      "description" => ""
      "cloud_software" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n", ""]
  }
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:timestamp} %{DATA:inter_hostname} %{DATA:product_event_type}: %{GREEDYDATA:kv_data}"
    }
    overwrite => ["timestamp", "inter_hostname", "product_event_type", "kv_data"]
    on_error => "invalid_grok"
  }

  if [message] !~ "=" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:timestamp} %{DATA:inter_hostname} %{DATA:cloud_software}: %{DATA:product_event_type}: %{GREEDYDATA:description}"
      }
      overwrite => ["timestamp", "inter_hostname", "product_event_type", "description", "cloud_software"]
      on_error => "invalid_grok_1"
    }
  }

  if [invalid_grok] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }

  if [kv_data] != "" {
    grok {
      match => {
        "kv_data" => "%{DATA} %{DATA:log_action} %{GREEDYDATA:kv_data1}"
      }
      on_error => "invalid_grok_kv"
    }
    if [log_action] !~ "=" {
      mutate {
        replace => {
          "kv_data" => "%{kv_data1}"
        }
        on_error => "invalid_kv_data1"
      }
      mutate {
        replace => {
          "ACTION" => "%{log_action}"
        }
        on_error => "invalid_action"
      }
    }
    mutate {
      gsub => ["kv_data","([a-zA-Z0-9_]+)=","#$1="]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "not_kv"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "invalid_description"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "invalid_product_event_type"
    }
  }

  if [cloud_software] != "" {
    mutate {
      replace => {
        "cloud_software_label.key" => "CLOUD_SOFTWARE"
        "cloud_software_label.value.string_value" => "%{cloud_software}"
      }
      on_error => "invalid_cloud_software"
    }
    if not [invalid_cloud_software] {
      mutate {
        merge => {
          "additional.fields" => "cloud_software_label"
        }
        on_error => "invalid_cloud_software_label"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp","MMM d HH:mm:ss"]
      rebase => true
      target => "metadata.event_timestamp"
      on_error => "invalid_timestamp"
    }
  }

  if [ACTION] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{ACTION}"
      }
      on_error => "invalid_action"
    }
  }
  if [ACTION] == "Allow" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }
  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
      on_error => "invalid_security_result_action"
    }
  }

  if [APPLICATION] != "" {
    mutate {
      uppercase => ["APPLICATION"]
    }

    mutate {
      replace => {
        "protocol_number_src" => "%{APPLICATION}"
      }
      on_error => "protocol_not_set"
    }
    if ![protocol_not_set] {
      @include ["parse_ip_protocol.include"]
      mutate {
        rename => {
          "ip_protocol_out" => "network.ip_protocol"
        }
      }
    }
  }

  if [BYTES_RECEIVED] != "" {
    mutate {
      replace => {
        "network.received_bytes" => "%{BYTES_RECEIVED}"
      }
      on_error => "invalid_bytes_received"
    }
    mutate {
      convert => {
        "network.received_bytes" => "uinteger"
      }
      on_error => "invalid_bytes_received_conversion"
    }
  }

  if [BYTES_SENT] != "" {
    mutate {
      replace => {
        "network.sent_bytes" => "%{BYTES_SENT}"
      }
      on_error => "invalid_bytes_sent"
    }
    mutate {
      convert => {
        "network.sent_bytes" => "uinteger"
      }
      on_error => "invalid_bytes_sent_conversion"
    }
  }

  if [DEST_NAME] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{DEST_NAME}"
        "target.asset.hostname" => "%{DEST_NAME}"
      }
      on_error => "invalid_dest_name"
    }
    if not [invalid_dest_name] {
      mutate {
        replace => {
          "target_present" => "true"
        }
      }
    }
  }

  if [DST] != "" {
    mutate {
      merge => {
        "target.ip" => "DST"
        "target.asset.ip" => "DST"
      }
      on_error => "invalid_dst"
    }
    if not [invalid_dst] {
      mutate {
        replace => {
          "target_present" => "true"
        }
      }
    }
  }

  if [DPT] != "" {
    mutate {
      replace => {
        "target.port" => "%{DPT}"
      }
      on_error => "invalid_dpt"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "invalid_dpt_conversion"
    }
  }

  if [SPT] != "" {
    mutate {
      replace => {
        "principal.port" => "%{SPT}"
      }
      on_error => "invalid_spt"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "invalid_spt_conversion"
    }
  }

  if [DURATION_SECS] != "" {
    mutate {
      replace => {
        "network.session_duration.seconds" => "%{DURATION_SECS}"
      }
      on_error => "invalid_duration_secs"
    }
    mutate {
      convert => {
        "network.session_duration.seconds" => "integer"
      }
      on_error => "invalid_duration_secs_conversion"
    }
  }

  if [FW_POLICY_NAME] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{FW_POLICY_NAME}"
      }
      on_error => "invalid_fw_policy_name"
    }
  }

  if [SRC] != "" {
    mutate {
      merge => {
        "principal.ip" => "SRC"
        "principal.asset.ip" => "SRC"
      }
      on_error => "invalid_src"
    }
    if not [invalid_src] {
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
    }
  }

  if [NAT_SRC] != "" {
    mutate {
      merge => {
        "principal.nat_ip" => "NAT_SRC"
      }
      on_error => "invalid_nat_src"
    }
  }

  if [NAT_SPT] != "" {
    mutate {
      replace => {
        "principal.nat_port" => "%{NAT_SPT}"
      }
      on_error => "invalid_nat_spt"
    }
    mutate {
      convert => {
        "principal.nat_port" => "integer"
      }
      on_error => "invalid_nat_spt_conversion"
    }
  }

  if [DEST_DOMAIN] != "" {
    mutate {
      replace => {
        "target.administrative_domain" => "%{DEST_DOMAIN}"
      }
      on_error => "invalid_dest_domain"
    }
  }

  if [IN] != "" {
    mutate {
      replace => {
        "in_label.key" => "IN"
        "in_label.value.string_value" => "%{IN}"
      }
      on_error => "invalid_in"
    }
    if not [invalid_in] {
      mutate {
        merge => {
          "additional.fields" => "in_label"
        }
        on_error => "invalid_in_label"
      }
    }
  }

  if [PROTO] != "" {
    mutate {
      replace => {
        "proto_label.key" => "PROTO"
        "proto_label.value.string_value" => "%{PROTO}"
      }
      on_error => "invalid_proto"
    }
    if not [invalid_proto] {
      mutate {
        merge => {
          "additional.fields" => "proto_label"
        }
        on_error => "invalid_proto_label"
      }
    }
  }

  if [REASON] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{REASON}"
      }
      on_error => "invalid_reason"
    }
  }

  if [SEGMENT] != "" {
    mutate {
      replace => {
        "segment_label.key" => "SEGMENT"
        "segment_label.value.string_value" => "%{SEGMENT}"
      }
      on_error => "invalid_segment"
    }
    if not [invalid_segment] {
      mutate {
        merge => {
          "additional.fields" => "segment_label"
        }
        on_error => "invalid_segment_label"
      }
    }
  }

  if [SEGMENT_NAME] != "" {
    mutate {
      replace => {
        "segment_name_label.key" => "SEGMENT_NAME"
        "segment_name_label.value.string_value" => "%{SEGMENT_NAME}"
      }
      on_error => "invalid_segment_name"
    }
    if not [invalid_segment_name] {
      mutate {
        merge => {
          "additional.fields" => "segment_name_label"
        }
        on_error => "invalid_segment_name_label"
      }
    }
  }

  if [inter_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_hostname}"
      }
      on_error => "invalid_inter_hostname"
    }
  }

  mutate {
    replace => {
      "metadata.event_type" => "GENERIC_EVENT"
      "metadata.vendor_name" => "VELO_FIREWALL"
      "metadata.product_name" => "VELO_FIREWALL"
    }
  }

  if [principal_present] == "true" and [target_present] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [principal_present] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "invalid_intermediary"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "invalid_security_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
