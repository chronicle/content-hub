# Product: Barracuda Email
# Category: Email Server
# Supported Format: SYSLOG+JSON, JSON
# Reference: https://campus.barracuda.com/product/emailsecuritygateway/doc/12193950/syslog-and-the-barracuda-email-security-gateway/?sl=AYUPNwlbK1yxI0Uogo0V&so=1
# Last Updated: 2026-02-09
# Copyright 2026 Google SecOps

filter {
  # initalize values
  mutate {
    replace => {
      "reason" => ""
      "action" => ""
      "action_code" => ""
      "size" => ""
      "hdr_from" => ""
      "ts" => ""
      "host" => ""
      "src_ip" => ""
      "msg_id" => ""
      "start_time" => ""
      "hdr_to" => ""
      "end_time" => ""
      "process" => ""
      "json" => ""
      "subject" => ""
      "message_id" => ""
      "sender_email" => ""
      "recipient_email" => ""
      "target_ip" => ""
      "product_log_id" => ""
      "service" => ""
      "queue_id" => ""
      "dst_domain" => ""
      "geoip" => ""
      "attachments" => ""
      "email" => ""
      "time" => ""
      "log_header_end" => ""
      "accountId" => ""
      "accessTokenId" => ""
      "product" => ""
      "payload.sender" => ""
      "payload.recipient" => ""
      "payload.subject" => ""
      "payload.date" => ""
      "payload.category" => ""
      "payload.type" => ""
      "payload.affected_mailboxes" => ""
      "payload.attachment" => ""
      "payload.created_by" => ""
      "payload.incident_id" => ""
      "payload.messages_received" => ""
      "payload.sender_display_name" => ""
      "payload.sender_email" => ""
      "payload.login_country" => ""
      "payload.login_ip" => ""
      "payload.login_user_agent" => ""
      "payload.user_display_name" => ""
      "payload.user_email" => ""
      "payload.body_links" => ""
      "payload.body_text" => ""
      "payload.matched_email_count" => ""
      "payload.sender_name" => ""
      "has_principal_user" => "false"
      "has_target_user" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "ptr_record" => ""
      "account_id" => ""
      "domain_id" => ""
      "tls" => ""
      "attachment_md5" => ""
      "intermediary" => ""
      "about" => ""
      "recipient_count" => ""
      "hdr_auth_results" => ""
      "env_from" => ""
      "auth_serv" => ""
      "spf_result" => ""
      "spf_sender_ip" => ""
      "smtp_mailfrom" => ""
      "dkim_result" => ""
      "dkim_domain" => ""
      "dmarc_result" => ""
      "header_from" => ""
      "gateway" => ""
      "timestamp" => ""
    }
  }

  grok {
    match => {
      "message" => ["\\d+\\s\\<\\d+\\>\\s%{TIMESTAMP_ISO8601:ts}Z\\s%{IPORHOST:gateway}\\s%{WORD:account_id}\\[%{INT}\\]:\\s%{GREEDYDATA:json}",
                    "<%{INT}> %{TIMESTAMP_ISO8601:ts}Z %{IPORHOST:gateway} %{WORD:account_id}\\[%{INT}\\]: %{GREEDYDATA:json}",
                   "<%{INT}>%{DATA}%{SPACE}%{HOSTNAME:host}\\[%{IP:src_ip}\\] %{DATA:message_id} %{INT:start_time} %{INT:end_time} %{WORD:service} %{DATA} %{DATA:sender_email} %{DATA:recipient_email} %{GREEDYDATA} SUBJ:(%{GREEDYDATA:subject})?",
                    "<%{INT}> %{DATA:process}: %{HOSTNAME:host}\\[%{IP:src_ip}\\] %{DATA:message_id} %{INT:start_time} %{INT:end_time} %{WORD:service} - - %{INT:action_code} %{INT} %{DATA}",
                    "<%{INT}> %{DATA:process}: %{IP:src_ip} %{DATA:message_id} %{INT} %{INT} %{WORD:service} %{WORD} %{INT:action_code} %{DATA:product_log_id} %{INT:response_code} %{DATA:version} %{WORD:status}: queued as %{DATA:queue_id} %{GREEDYDATA}\\[%{IP:target_ip}\\]",
                    "<%{INT}> %{SYSLOGTIMESTAMP:time} %{HOSTNAME:host} %{DATA:log_header_end}: %{GREEDYDATA:json}",
                    "<%{INT}> %{SYSLOGTIMESTAMP:time} %{HOSTNAME:host} %{DATA:log_header_end}:%{GREEDYDATA:json}"
                    ]
    }
    overwrite => ["ts", "time", "log_header_end", "gateway", "account_id", "json","process", "host","message_id","start_time","end_time","service","src_ip","sender_email","recipient_email","subject","product_log_id","response_code","version","status","queue_id","target_ip","product_log_id","action_code"]
    on_error => "pattern_not_matched"
  }

  mutate {
    gsub => ["json", "\\\\x", "\\\\\\\\x"]
  }

  # Pull data out of json message body
  json {
    source => "json"
    array_function => "split_columns"
    on_error => "not_json"
  }
  date {
    match => ["ts", "yyyy-MM-ddTHH:mm:ss"]
    on_error => "date_not_present"
  }

  date {
    match => ["time", "MMM dd HH:mm:ss"]
    rebase => true
    on_error => "time_not_present"
  }
  if [log_header_end] != "" {
    mutate {
      replace => {
        "log_header_label.value.string_value" => "%{log_header_end}"
      }
      on_error => "log_header_empty"
    }
    if ![log_header_empty] {
      mutate {
        replace => {
          "log_header_label.key" => "log_header"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "log_header_label"
        }
        on_error => "log_header_merge_empty"
      }
    }
  }
  if [accountId] != "" {
    mutate {
      replace => {
        "accountId_label.value" => "%{accountId}"
      }
      on_error => "accountId_empty"
    }
    if ![accountId_empty] {
      mutate {
        replace => {
          "accountId_label.key" => "accountId"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "accountId_label"
        }
        on_error => "accountId_merge_empty"
      }
    }
  }
  if [accessTokenId] != "" {
    mutate {
      replace => {
        "accessTokenId_label.value" => "%{accessTokenId}"
      }
      on_error => "accessTokenId_empty"
    }
    if ![accessTokenId_empty] {
      mutate {
        replace => {
          "accessTokenId_label.key" => "accessTokenId"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "accessTokenId_label"
        }
        on_error => "accessTokenId_merge_empty"
      }
    }
  }
  if [product] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product}"
      }
      on_error => "product_empty"
    }
  }
  if [payload][sender] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "payload.sender"
      }
      on_error => "sender_email_empty"
    }
    mutate {
      replace => {
        "has_principal_user" => "true"
      }
    }
  }
  if [payload][recipient] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.user.email_addresses" => "payload.recipient"
      }
      on_error => "recipient_email_empty"
    }
    mutate {
      replace => {
        "has_target_user" => "true"
      }
    }
  }
  if [payload][subject] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.subject" => "payload.subject"
      }
      on_error => "subject_empty"
    }
  }
  date {
    match => ["payload.date", "yyyy-MM-dd - HH:mm:ss", "ISO8601"]
    target => "event.idm.read_only_udm.metadata.collected_timestamp"
    on_error => "time_not_present"
  }
  if [payload][category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "payload.category"
      }
      on_error => "category_empty"
    }
  }
  if [payload][type] != "" {
    mutate {
      replace => {
        "payload_type_label.value" => "%{payload.type}"
      }
      on_error => "type_empty"
    }
    if ![type_empty] {
      mutate {
        replace => {
          "payload_type_label.key" => "type"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "payload_type_label"
        }
        on_error => "type_merge_empty"
      }
    }
  }
  mutate {
    convert => {
      "payload.affected_mailboxes" => "string"
    }
    on_error => "affected_mailboxes_convert_empty"
  }
  if [payload][affected_mailboxes] != "" {
    mutate {
      replace => {
        "affected_mailboxes_label.value.string_value" => "%{payload.affected_mailboxes}"
      }
      on_error => "affected_mailboxes_empty"
    }
    if ![affected_mailboxes_empty] {
      mutate {
        replace => {
          "affected_mailboxes_label.key" => "affected_mailboxes"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "affected_mailboxes_label"
        }
        on_error => "affected_mailboxes_merge_empty"
      }
    }
  }
  if [payload][attachment] != "" {
    mutate {
      replace => {
        "attachment_label.value.string_value" => "%{payload.attachment}"
      }
      on_error => "no_attachment_name"
    }
    if ![no_attachment_name] {
      mutate {
        replace => {
          "attachment_label.key" => "attachment"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "attachment_label"
        }
        on_error => "no_attachment_label"
      }
    }
  }
  if [payload][created_by] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "payload.created_by"
      }
      on_error => "created_by_empty"
    }
    mutate {
      replace => {
        "has_principal_user" => "true"
      }
    }
  }
  if [payload][incident_id] != "" {
    mutate {
      replace => {
        "incident_id_label.value" => "%{payload.incident_id}"
      }
      on_error => "incident_id_empty"
    }
    if ![incident_id_empty] {
      mutate {
        replace => {
          "incident_id_label.key" => "incident_id"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "incident_id_label"
        }
        on_error => "incident_id_merge_empty"
      }
    }
  }
  mutate {
    convert => {
      "payload.messages_received" => "string"
    }
    on_error => "messages_received_convert_empty"
  }
  if [payload][messages_received] != "" {
    mutate {
      replace => {
        "messages_received_label.value" => "%{payload.messages_received}"
      }
      on_error => "messages_received_empty"
    }
    if ![messages_received_empty] {
      mutate {
        replace => {
          "messages_received_label.key" => "messages_received"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "messages_received_label"
        }
        on_error => "messages_received_merge_empty"
      }
    }
  }
  if [payload][sender_display_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{payload.sender_display_name}"
      }
      on_error => "sender_display_name_empty"
    }
    mutate {
      replace => {
        "has_principal_user" => "true"
      }
    }
  }
  if [payload][sender_email] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "payload.sender_email"
      }
      on_error => "sender_email_empty"
    }
  }
  if [payload][login_country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{payload.login_country}"
      }
      on_error => "login_country_empty"
    }
  }
  if [payload][login_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "payload.login_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "payload.login_ip"
      }
      on_error => "login_ip_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [payload][login_user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{payload.login_user_agent}"
      }
      on_error => "login_user_agent_empty"
    }
  }
  if [payload][user_display_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{payload.user_display_name}"
      }
      on_error => "user_display_name_empty"
    }
  }
  if [payload][user_email] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "payload.user_email"
      }
      on_error => "user_email_empty"
    }
  }
  if [payload][body_links] != "" {
    mutate {
      replace => {
        "security_result.about.url" => "%{payload.body_links}"
      }
      on_error => "body_links_empty"
    }
  }
  if [payload][body_text] != "" {
    mutate {
      replace => {
        "body_text_label.value.string_value" => "%{payload.body_text}"
      }
      on_error => "body_text_empty"
    }
    if ![body_text_empty] {
      mutate {
        replace => {
          "body_text_label.key" => "body_text"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "body_text_label"
        }
        on_error => "body_text_merge_empty"
      }
    }
  }
  mutate {
    convert => {
      "payload.matched_email_count" => "string"
    }
    on_error => "matched_email_count_empty"
  }
  if [payload][matched_email_count] != "" {
    mutate {
      replace => {
        "matched_email_count_label.value" => "%{payload.matched_email_count}"
      }
      on_error => "matched_email_count_empty"
    }
    if ![matched_email_count_empty] {
      mutate {
        replace => {
          "matched_email_count_label.key" => "matched_email_count"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "matched_email_count_label"
        }
        on_error => "matched_email_count_merge_empty"
      }
    }
  }
  if [payload][sender_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{payload.sender_name}"
      }
      on_error => "sender_name_empty"
    }
  }


  if [dst_domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{dst_domain}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{dst_domain}"
      }
      on_error => "dst_domain_empty"
    }
  }
  if [geoip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{geoip}"
      }
      on_error => "geoip_empty"
    }
  }
  if [account_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{account_id}"
      }
      on_error => "account_id_empty"
    }
  }
  if [domain_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{domain_id}"
      }
      on_error => "domain_id_empty"
    }
  }
  mutate {
    convert => {
      "tls" => "string"
    }
    on_error => "tls_empty"
  }
  if [tls] != "" {
    mutate {
      replace => {
        "tls_label.value.string_value" => "%{tls}"
      }
      on_error => "tls_label_not_present"
    }
    if ![tls_label_not_present] {
      mutate {
        replace => {
          "tls_label.key" => "tls"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tls_label"
        }
        on_error => "tls_label_merge_failed"
      }
    }
  }
  if [ptr_record] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{ptr_record}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{ptr_record}"
      }
      on_error => "ptr_record_empty"
    }
    if ![ptr_record_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  mutate {
    convert => {
      "recipient_count" => "string"
    }
    on_error => "recipient_count_empty"
  }
  if [recipient_count] != "" {
    mutate {
      replace => {
        "recipient_count_label.value.string_value" => "%{recipient_count}"
      }
      on_error => "recipient_count_label_not_present"
    }
    if ![recipient_count_label_not_present] {
      mutate {
        replace => {
          "recipient_count_label.key" => "recipient_count"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "recipient_count_label"
        }
        on_error => "recipient_count_label_merge_failed"
      }
    }
  }
  if [hdr_auth_results] != "" {
    grok {
      match => {
        "hdr_auth_results" => [
          "%{HOSTNAME:auth_serv}; spf=%{DATA:spf_result} \\(sender IP is %{DATA:spf_sender_ip}\\) smtp.mailfrom=%{EMAILADDRESS:smtp_mailfrom}; dkim=%{WORD:dkim_result} header.d=%{HOSTNAME:dkim_domain}; dmarc=%{WORD:dmarc_result} header.from=%{EMAILADDRESS:header_from}"
        ]
      }
      overwrite => ["auth_serv", "spf_result", "spf_sender_ip", "smtp_mailfrom", "dkim_result", "dkim_domain", "dmarc_result", "header_from"]
      on_error => "hdr_auth_results_grok_failed"
    }
    if [auth_serv] != "" {
      mutate {
        replace => {
          "auth_serv_intermediary.hostname" => "%{auth_serv}"
        }
        on_error => "auth_serv_hostname_failed"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "auth_serv_intermediary"
        }
        on_error => "auth_serv_merge_failed"
      }
    }
    if [spf_sender_ip] != "" {
      grok {
        match => {
          "spf_sender_ip" => "^%{IP:valid_spf_ip}$"
        }
        on_error => "spf_sender_ip_invalid"
      }
      if ![spf_sender_ip_invalid] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "valid_spf_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "valid_spf_ip"
          }
          on_error => "spf_sender_ip_merge_failed"
        }
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [dkim_result] != "" {
      mutate {
        replace => {
          "dkim_result_label.key" => "dkim_result"
          "dkim_result_label.value.string_value" => "%{dkim_result}"
        }
        on_error => "dkim_result_label_not_present"
      }
      if ![dkim_result_label_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "dkim_result_label"
          }
          on_error => "dkim_result_label_merge_failed"
        }
      }
    }
    if [dmarc_result] != "" {
      mutate {
        replace => {
          "dmarc_result_label.key" => "dmarc_result"
          "dmarc_result_label.value.string_value" => "%{dmarc_result}"
        }
        on_error => "dmarc_result_label_not_present"
      }
      if ![dmarc_result_label_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "dmarc_result_label"
          }
          on_error => "dmarc_result_label_merge_failed"
        }
      }
    }
    if [dkim_domain] != "" {
      mutate {
        replace => {
          "dkim_domain_label.key" => "dkim_domain"
          "dkim_domain_label.value.string_value" => "%{dkim_domain}"
        }
        on_error => "dkim_domain_label_not_present"
      }
      if ![dkim_domain_label_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "dkim_domain_label"
          }
          on_error => "dkim_domain_label_merge_failed"
        }
      }
    }
    if [header_from] != "" {
      mutate {
        replace => {
          "header_from_label.key" => "header_from"
          "header_from_label.value.string_value" => "%{header_from}"
        }
        on_error => "header_from_label_not_present"
      }
      if ![header_from_label_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "header_from_label"
          }
          on_error => "header_from_label_merge_failed"
        }
      }
    }
    if [spf_result] != "" {
      mutate {
        replace => {
          "spf_result_label.key" => "spf_result"
          "spf_result_label.value.string_value" => "%{spf_result}"
        }
        on_error => "spf_result_label_not_present"
      }
      if ![spf_result_label_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "spf_result_label"
          }
          on_error => "spf_result_label_merge_failed"
        }
      }
    }
    if [smtp_mailfrom] != "" {
      mutate {
        replace => {
          "smtp_mailfrom_label.key" => "smtp_mailfrom"
          "smtp_mailfrom_label.value.string_value" => "%{smtp_mailfrom}"
        }
        on_error => "smtp_mailfrom_label_not_present"
      }
      if ![smtp_mailfrom_label_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "smtp_mailfrom_label"
          }
          on_error => "smtp_mailfrom_label_merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "hdr_auth_results_label.value.string_value" => "%{hdr_auth_results}"
      }
      on_error => "hdr_auth_results_label_not_present"
    }
    if ![hdr_auth_results_label_not_present] {
      mutate {
        replace => {
          "hdr_auth_results_label.key" => "hdr_auth_results"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "hdr_auth_results_label"
        }
        on_error => "hdr_auth_results_label_merge_failed"
      }
    }
  }
  if [env_from] != "" {
    mutate {
      replace => {
        "env_from_label.value.string_value" => "%{env_from}"
      }
      on_error => "env_from_label_not_present"
    }
    if ![env_from_label_not_present] {
      mutate {
        replace => {
          "env_from_label.key" => "env_from"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "env_from_label"
        }
        on_error => "env_from_label_merge_failed"
      }
    }
  }
  if [gateway] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{gateway}"
      }
      on_error => "gateway_empty"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "collected_timestamp_failure"
    }
  }
  # metadata section
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Barracuda"
      "event.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
      }
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [product_log_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{product_log_id}"
      }
    }
  }

  if [process] =~ "smtp" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "SMTP"
      }
    }
  }

  if [sender_email] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.from" => "%{sender_email}"
      }
    }
  }

  if [service] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{service}"
      }
    }
  }

  if [process] =~ "inbound" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "INBOUND"
      }
    }
  } else if [process] =~ "outbound" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "OUTBOUND"
      }
    }
  }

  if [target_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "target_ip"
        "event.idm.read_only_udm.target.asset.ip" => "target_ip"
      }
    }
  }

  # network section

  if [size] != "" {
    mutate {
      convert => {
        "size" => "uinteger"
      }
    }
    mutate {
      rename => {
        "size" => "event.idm.read_only_udm.network.received_bytes"
      }
    }
  }

  mutate {
    gsub => ["hdr_from","â",""]
  }
  mutate {
    gsub => ["hdr_from","\\s+"," "]
  }
  if [hdr_from] =~ "^.+@.+$" {
    mutate {
      rename => {
        "hdr_from" => "event.idm.read_only_udm.network.email.from"
      }
    }
  }

  if [recipient_email] not in ["","-"] {
    mutate {
      merge => {
         "event.idm.read_only_udm.network.email.to" => "recipient_email"
      }
      on_error => "recipient_email_empty"
    }
  }

  if [hdr_to] =~ "," {
    mutate {
      gsub => ['hdr_to',',','\",\"']
    }
    mutate {
      replace => {
        "hdr_to" => "{\"to_emails\":[\"%{hdr_to}\"]}"
      }
      on_error => "hdr_to_empty"
    }
    json {
      source => "hdr_to"
      array_function => "split_columns"
      on_error => "hdr_to_json_failed"
    }
    if ![hdr_to_json_failed] {
      for email in to_emails {
        grok {
          match => {
            "email" => ["%{EMAILADDRESS:email}"]
          }
          overwrite => ["email"]
          on_error => "email_not_present"
        }
        if ![email_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.network.email.to" => "email"
            }
            on_error => "email_merge_failed"
          }
        }
      }
    }
  }
  else if [hdr_to] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.to" => "hdr_to"
      }
      on_error => "hdr_to_empty"
    }
  }
  if [subject] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.subject" => "subject"
      }
      on_error => "subject_empty"
    }
  }

  if [message_id] != "" {
    mutate {
      rename => {
        "message_id" => "event.idm.read_only_udm.network.email.mail_id"
      }
    }
  }

  if [queue_id] != "" {
    mutate {
      replace => {
        "queueId.key" => "QueueID"
        "queueId.value" => "%{queue_id}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "queueId"
      }
    }
  }

  mutate {
    replace => {
      "attachment_list.value" => ""
    }
  }

  for attachment in attachments {
    mutate {
      replace => {
        "attachment_name" => ""
        "attachment_md5" => ""
      }
    }
    mutate {
      replace => {
        "attachment_name" => "%{attachment.name}"
      }
      on_error => "attachment_name_empty"
    }
    mutate {
      replace => {
        "attachment_md5" => "%{attachment.md5}"
      }
      on_error => "attachment_md5_empty"
    }
    if ![attachment_name_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.file.names" => "attachment_name"
        }
        on_error => "no_attachment_list_merge"
      }
    }
    if ![attachment_md5_empty] {
      mutate {
        replace => {
          "file_item" => ""
        }
      }
      mutate {
        replace => {
          "file_item.file.md5" => "%{attachment_md5}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "file_item"
        }
        on_error => "about_merge_failed"
      }
    }
  }

  # principal section
  if [src_ip] not in ["","0.0.0.0"] {
    grok {
      match => {
        "src_ip" => "%{IP:src_ip}"
      }
      overwrite => ["src_ip"]
      on_error => "src_ip_not_present"
    }
    if ![src_ip_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
          "security_result.about.ip" => "src_ip"
        }
      }
    }
  }

  # action
  grok {
    match => {
      "json" => ".*action\\\":\\\"%{WORD:action}\\\""
    }
    overwrite => ["action"]
    on_error => "no_action"
  }

  grok {
    match => {
      "json" => ".*reason\\\":\\\"%{DATA:reason}\\\""
    }
    overwrite => ["reason"]
    on_error => "pass"
  }

  grok {
    match => {
      "json" => ".*delivered\\\":\\\"%{NOTSPACE:delivered}\\\""
    }
    overwrite => ["delivered"]
    on_error => "pattern_not_matched"
  }

  if [action] != "" or [action_code] != "" {
    if [action] == "allowed" or ([action_code] in ["0","7"] and [service] in ["RECV","SCAN"]) {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
    } else if [action] == "quarantined" or ([action_code] == "3" and [service] in ["RECV","SCAN"]){
      mutate {
        replace => {
          "action" => "QUARANTINE"
        }
      }
    } else if [action] == "blocked" or ([action_code] == "2" and [service] in ["RECV","SCAN"]){
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    } else if [action] == "deferred" and [delivered] == "delivered" {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
    } else if [action] == "deferred" and [delivered] == "not_delivered" {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    } else {
      mutate {
        replace => {
          "action" => "UNKNOWN_ACTION"
        }
      }
    }
  } else {
    mutate {
      replace => {
        "action" => "UNKNOWN_ACTION"
      }
    }
  }
  for recp in recipients {
    mutate {
      replace => {
        "recp_delivery_detail" => ""
        "recp_delivered" => ""
        "recp_taxonomy" => ""
        "recp_reason_extra" => ""
        "recp_reason" => ""
        "recipient" => ""
        "act" => ""
      }
    }

    mutate {
      replace => {
        "recipient" => "%{recp.email}"
      }
      on_error => "recipient_not present"
    }

    if [recipient] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.network.email.to" => "recipient"
        }
        on_error => "recipient_empty"
      }
    }

    mutate {
      replace => {
        "act" => "%{recp.action}"
      }
      on_error => "recp_action_empty"
    }

    if [act] == "allowed" {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
    }
    else {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    }

    if [act] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{act}"
        }
        on_error => "act_empty"
      }
    }

    mutate {
      replace => {
        "recp_delivery_detail.value" => "%{recp.delivery_detail}"
      }
      on_error => "recp_delivery_detail_failure"
    }
    if ![recp_delivery_detail_failure] {
      mutate {
        replace => {
          "recp_delivery_detail.key" => "delivery_detail"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "recp_delivery_detail"
        }
        on_error => "recp_delivery_detail_empty"
      }
    }

    mutate {
      replace => {
        "recp_taxonomy.value" => "%{recp.taxonomy}"
      }
      on_error => "recp_taxonomy_failure"
    }
    if ![recp_taxonomy_failure] {
      mutate {
        replace => {
          "recp_taxonomy.key" => "taxonomy"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "recp_taxonomy"
        }
        on_error => "recp_taxonomy_empty"
      }
    }

    mutate {
      replace => {
        "recp_reason.value" => "%{recp.reason}"
      }
      on_error => "recp_reason_failure"
    }
    if ![recp_reason_failure] {
      mutate {
        replace => {
          "recp_reason.key" => "reason"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "recp_reason"
        }
        on_error => "recp_reason_empty"
      }
    }

    mutate {
      replace => {
        "recp_reason_extra.value" => "%{recp.reason_extra}"
      }
      on_error => "recp_reason_extra_failure"
    }
    if ![recp_reason_extra_failure] {
      mutate {
        replace => {
          "recp_reason_extra.key" => "reason_extra"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "recp_reason_extra"
        }
        on_error => "recp_reason_extra_empty"
      }
    }

    mutate {
      replace => {
        "recp_delivered.value" => "%{recp.delivered}"
      }
      on_error => "recp_delivered_failure"
    }
    if ![recp_delivered_failure] {
      mutate {
        replace => {
          "recp_delivered.key" => "delivered"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "recp_delivered"
        }
        on_error => "recp_delivered_empty"
      }
    }
  }
  mutate {
    merge => {
      "security_result.action" => "action"
    }
    on_error => "action_empty"
  }
  # security result
  if [action] == "blocked" or [action] == "BLOCK" and [reason] == "score" or [reason] == "bbl" {
    mutate {
      replace => {
        "category" => "MAIL_SPAM"
      }
    }
  } else if [reason] == "barracuda_email_blacklist" {
    mutate {
      replace => {
        "category" => "MAIL_PHISHING"
      }
    }
  } else if [action] == "blocked" or [action] == "BLOCK" or [action] == "QUARANTINE" and [reason] == "dkim" or [reason] == "spf" {
    mutate {
      replace => {
        "category" => "MAIL_SPOOFING"
      }
    }
  } else if [action] == "blocked" or [action] == "BLOCK" and [reason] == "no_ptr" {
    mutate {
      replace => {
        "category" => "POLICY_VIOLATION"
      }
    }
  } else {
    mutate {
      replace => {
        "category" => "UNKNOWN_CATEGORY"
      }
    }
    mutate {
      replace => {
        "security_result.severity" => "UNKNOWN_SEVERITY"
      }
    }
  }

  mutate {
    merge => {
      "security_result.category" => "category"
    }
    on_error => "category_empty"
  }

  mutate {
    replace => {
      "security_result.confidence" => "UNKNOWN_CONFIDENCE"
      "security_result.priority" => "UNKNOWN_PRIORITY"
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "security_result"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }
  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_empty"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" and [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal_user] == "true" and [has_target_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
