# Product: LastPass Password Management
# Category: Identity and Access Management
# Supported Format: JSON
# Reference: https://support.lastpass.com/s/document-item?language=en_US&bundleId=lastpass&topicId=LastPass/use-provisioning-api.html&_LANG=enus
# Last Updated: 2026-05-11
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event_metadata" => ""
      "event_principal" => ""
      "event_target" => ""
      "event_additional" => ""
      "event_security_result" => ""
      "extensions" => ""
      "event_type" => ""
      "has_principal_machine" => "false"
      "has_target_user" => "false"
      "Time" => ""
      "Username" => ""
      "IP_Address" => ""
      "Action" => ""
      "Data" => ""
      "user_data" => ""
      "description" => ""
      "url" => ""
      "temp_data" => ""
      "sec_action" => ""
      "ActionText" => ""
      "UserId" => ""
      "Ip" => ""
      "EventType" => ""
      "Event" => ""
      "VID" => ""
      "network" => ""
      "Datetime" => ""
      "security_result" => ""
      "target_resource_name" => ""
      "lastpass_raw.Time" => ""
      "additional.fields" => ""
      "principal.user.userid" => ""
      "security_result.description" => ""
      "metadata.product_event_type" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    grok {
      match => {
        "message" => "<%{INT}>%{GREEDYDATA:json_data}"
      }
      overwrite => ["json_data"]
      on_error => "grok_failed"
    }
    if [grok_failed] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "not_json_after_grok"
    }
  }
  if [lastpass_raw][Time] != "" {
    date {
      match => ["lastpass_raw.Time", "yyyy-MM-dd HH:mm:ss", "ISO8601", "yyyy-MM-dd HH:mm:ss Z"]
      target => "event_metadata.event_timestamp"
      on_error => "invalid_lastpass_raw_Time_format"
    }
  }
  if [Time] != "" {
    date {
      match => ["Time", "yyyy-MM-dd HH:mm:ss", "ISO8601", "yyyy-MM-dd HH:mm:ss Z"]
      target => "event_metadata.event_timestamp"
      on_error => "invalid_format"
    }
  }

  if [Datetime] != "" {
    mutate {
     gsub => ["Datetime","(\\d{10})\\d+" ,"$1" ]
    }
    date {
      match => ["Datetime", "UNIX"]
      target => "event_metadata.event_timestamp"
      on_error => "invalid_Date"
    }
  }
  if [Username] == "" {
    mutate {
      replace => {
        "Username" => "%{lastpass_raw.Username}"
      }
      on_error => "no_lastpass_raw_Username"
    }
  }
  if [Username] != "" {
    mutate {
      replace => {
        "event_target.user.userid" => "%{Username}"
        "has_target_user" => "true"
      }
      on_error => "no_Username"
    }
    if [Username] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event_target.user.email_addresses" => "Username"
        }
        on_error => "no_Username2"
      }
    }
  }
  if [principal][user][userid] !~ "^.+@.+$" and [principal][user][userid] != "" {
    mutate {
      replace => {
        "event_principal.user.userid" => "%{principal.user.userid}"
        "has_target_user" => "true"
      }
      on_error => "no_principal_user_userid"
    }
  }

  if [UserId] != "" {
    mutate {
      replace => {
        "event_target.user.userid" => "%{UserId}"
        "has_target_user" => "true"
      }
      on_error => "no_UserId"
    }
    if [UserId] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event_target.user.email_addresses" => "UserId"
        }
        on_error => "no_UserId1"
      }
    }
  }
  if [IP_Address] == "" {
    mutate {
      replace => {
        "IP_Address" => "%{lastpass_raw.IP_Address}"
      }
      on_error => "no_lastpass_raw_IP_Address"
    }
  }
  if [IP_Address] != "" {
    mutate {
      merge => {
        "event_principal.ip" => "IP_Address"
        "event_principal.asset.ip" => "IP_Address"
      }
      on_error => "no_IP_Address"
    }
    mutate {
      replace => {
        "has_principal_machine" => "true"
      }
    }
  }

  if [Ip] != "" {
    mutate {
      merge => {
        "event_principal.ip" => "Ip"
        "event_principal.asset.ip" => "Ip"
      }
      on_error => "no_Ip"
    }
    mutate {
      replace => {
        "has_principal_machine" => "true"
      }
    }
  }

  if [ActionText] != "" {
    mutate {
      replace => {
        "event_metadata.product_event_type" => "%{ActionText}"
      }
      on_error => "no_ActionText"
    }
  }
  if [Action] == "" {
    mutate{
      replace => {
        "Action" => "%{lastpass_raw.Action}"
      }
      on_error => "no_lastpass_raw_Action"
    }
  }
  if [Action] != "" {
    mutate {
      replace => {
        "event_metadata.product_event_type" => "%{Action}"
      }
      on_error => "no_Action"
    }
  }
  if [Data] == "" {
    mutate {
      replace => {
        "Data" => "%{lastpass_raw.Data}"
      }
      on_error => "no_lastpass_raw_Data"
    }
  }
  if [Data] != "" {
    mutate {
      replace => {
        "event_security_result.description" => "%{Data}"
      }
      on_error => "no_Data"
    }
  }

  if [EventType] != "" {
    mutate {
      replace => {
        "EventType_label.key" => "EventType"
        "EventType_label.value.string_value" => "%{EventType}"
      }
    on_error => "EventType_not_present"
    }
    if ![EventType_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "EventType_label"
        }
        on_error => "EventType_merge_error"
      }
    }
  }

  if [Action] != "" {
    if [Action] =~ "Creating user" {
      grok {
        match => {
          "Data" => "%{DATA:user_data} \\(%{GREEDYDATA:description}\\)"
        }
        overwrite => ["user_data", "description"]
        on_error => "grok_failed"
      }
      if [user_data] != "" {
        mutate {
          replace => {
            "event_target.user.userid" => "%{user_data}"
          }
          on_error => "no_user_data"
        }
        if [user_data] =~ "^.+@.+$" {
          mutate {
            merge => {
              "event_target.user.email_addresses" => "user_data"
            }
            on_error => "no_user_data2"
          }
        }
        mutate {
          replace => {
            "event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      if [description] != "" {
        mutate {
          replace => {
            "event_security_result.summary" => "%{description}"
          }
          on_error => "no_description"
        }
      }
    }
    else if [Action] =~ "(Delete|Move to shared folder|Site added|Site changed|Password changed|Require password change)" {
      if [Data] != "" {
        grok {
          match => {
            "Data" => "URL: %{GREEDYDATA:url}, VID%{GREEDYDATA:temp_data}"
          }
          overwrite => ["url", "temp_data"]
          on_error => "grok_failed"
        }
        if [url] != "" {
          mutate {
            replace => {
              "event_target.url" => "%{url}"
            }
            on_error => "no_url"
          }
        }
      }
      if [Action] =~ "Delete" and [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_DELETION"
          }
        }
      }
      else if [Action] =~ "(Password changed|Require password change)" {
        mutate {
          replace => {
            "event_type" => "USER_CHANGE_PASSWORD"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
    }
    else if [Action] =~ "(Failed login|mfa_authentication_request_failed)" {
      if [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      }
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }
    else if [Action] =~ "Get user data" {
      grok {
        match => {
          "Data" => "%{DATA:user_data} \\(%{GREEDYDATA:description}\\)"
        }
        overwrite => ["user_data", "description"]
        on_error => "grok_failed"
      }
      if [user_data] != "" {
        mutate {
          replace => {
            "event_target.user.userid" => "%{user_data}"
          }
          on_error => "no_user_data3"
        }
        if [user_data] =~ "^.+@.+$" {
          mutate {
            merge => {
              "event_target.user.email_addresses" => "user_data"
            }
            on_error => "no_user_data4"
          }
        }
      }
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
      if [description] != "" {
        mutate {
          replace => {
            "event_security_result.summary" => "%{description}"
          }
          on_error => "no_description2"
        }
      }
    }
    else if [Action] =~ "(Log in|Login|mfa_authentication_request_success)" {
      if [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      }
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    }
    else if [Action] =~ "Master password" {
      if [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_CHANGE_PASSWORD"
          }
        }
      }
    }
  }
  if [ActionText] != "" {
    if [ActionText] =~ "Creating user" {
      grok {
        match => {
          "Data" => "%{DATA:user_data} \\(%{GREEDYDATA:description}\\)"
        }
        overwrite => ["user_data", "description"]
        on_error => "grok_failed"
      }
      if [user_data] != "" {
        mutate {
          replace => {
            "event_target.user.userid" => "%{user_data}"
          }
          on_error => "no_user_data5"
        }
        if [user_data] =~ "^.+@.+$" {
          mutate {
            merge => {
              "event_target.user.email_addresses" => "user_data"
            }
            on_error => "no_user_data6"
          }
        }
        mutate {
          replace => {
            "event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      if [description] != "" {
        mutate {
          replace => {
            "event_security_result.summary" => "%{description}"
          }
          on_error => "no_description3"
        }
      }
    }
    else if [ActionText] =~ "(Delete|Move to shared folder|Site added|Site changed|Password changed|Require password change)" {
      if [Data] != "" {
        grok {
          match => {
            "Data" => "URL: %{GREEDYDATA:url}, VID%{GREEDYDATA:temp_data}"
          }
          overwrite => ["url", "temp_data"]
          on_error => "grok_failed"
        }
        if [url] != "" {
          mutate {
            replace => {
              "event_target.url" => "%{url}"
            }
            on_error => "no_url2"
          }
        }
      }
      if [ActionText] =~ "Delete" and [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_DELETION"
          }
        }
      }
      else if [ActionText] =~ "(Password changed|Require password change)" {
        mutate {
          replace => {
            "event_type" => "USER_CHANGE_PASSWORD"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }
    }
    else if [ActionText] =~ "(Failed login|mfa_authentication_request_failed)" {
      if [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      }
      mutate {
        replace => {
          "sec_ActionText" => "BLOCK"
        }
      }
    }
    else if [ActionText] =~ "Get user data" {
      grok {
        match => {
          "Data" => "%{DATA:user_data} \\(%{GREEDYDATA:description}\\)"
        }
        overwrite => ["user_data", "description"]
        on_error => "grok_failed"
      }
      if [user_data] != "" {
        mutate {
          replace => {
            "event_target.user.userid" => "%{user_data}"
          }
          on_error => "no_user_data7"
        }
        if [user_data] =~ "^.+@.+$" {
          mutate {
            merge => {
              "event_target.user.email_addresses" => "user_data"
            }
            on_error => "no_user_data8"
          }
        }
      }
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
      if [description] != "" {
        mutate {
          replace => {
            "event_security_result.summary" => "%{description}"
          }
          on_error => "no_description4"
        }
      }
    }
    else if [ActionText] =~ "(Log in|Login|mfa_authentication_request_success)" {
      if [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      }
      mutate {
        replace => {
          "sec_ActionText" => "ALLOW"
        }
      }
    }
    else if [ActionText] =~ "Master password" {
      if [has_target_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_CHANGE_PASSWORD"
          }
        }
      }
    }
  }

  if [Event] != "" {
    mutate {
      replace => {
        "event_security_result.description" => "%{Event}"
      }
      on_error => "no_Event"
    }
  }

  if [Data] != "" {
    grok {
      match => {
        "Data" => "VID:\\s+%{INT:VID}"
      }
      overwrite => ["VID"]
      on_error => "grok_failed_VID"
    }
  }

  if [VID] != "" {
    mutate {
      convert => {
        "VID" => "string"
      }
      on_error => "VID_not_string"
    }
    mutate {
      replace => {
        "network.session_id" => "%{VID}"
      }
      on_error => "no_VID"
    }
  }

  if [security_result] != "" {
    for index, sec_res in security_result {
      mutate {
        replace => {
          "sec_res_category_label" => ""
          "sec_res_severity_label" => ""
          "sec_res_desc_label" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "index_convert_into_string_failed"
      }
      if [sec_res][category] != "" {
        mutate {
          merge => {
            "event_security_result.category_details" => "sec_res.category"
          }
          on_error => "no_sec_res_category_label"
        }
      }
      if [sec_res][description] != "" {
        mutate {
          replace => {
            "sec_res_desc_label.key" => "Security Result Description %{index}"
            "sec_res_desc_label.value" => "%{sec_res.description}"
          }
          on_error => "no_sec_res_desc_label"
        }
        if ![no_sec_res_desc_label] {
          mutate {
            merge => {
              "event_security_result.detection_fields" => "sec_res_desc_label"
            }
            on_error => "no_sec_res_desc_label_merge_error"
          }
        }
      }
      if [sec_res][severity] != "" {
        mutate {
          convert => {
            "index" => "integer"
          }
          on_error => "index_convert_into_integer_failed"
        }
        if [index] < 1 {
          if [sec_res][severity] =~ "INFO" {
            mutate {
              replace => {
                "event_security_result.severity" => "LOW"
              }
              on_error => "no_sec_res_severity_label"
            }
          }
        }
        else {
          mutate {
            replace => {
              "sec_res_severity_label.key" => "severity_%{index}"
              "sec_res_severity_label.value" => "%{sec_res.severity}"
            }
            on_error => "no_sec_res_severity"
          }
          if ![no_sec_res_severity] {
            mutate {
              merge => {
                "event_security_result.detection_fields" => "sec_res_severity_label"
              }
              on_error => "no_sec_res_severity_label"
            }
          }
        }
      }
    }
  }
  mutate{
    replace => {
      "target_resource_name" => "%{target.resource.name}"
    }
    on_error => "target_resource_name_replace_error"
  }
  if [target_resource_name] != "" {
    mutate {
      replace => {
        "event_target.resource.name" => "%{target_resource_name}"
      }
      on_error => "no_target_resource_name"
    }
  }
  if [additional][fields] != "" {
    for key, value in additional.fields map {
      mutate {
        replace => {
          "additional_fields_label" => ""
        }
      }
      mutate {
        replace => {
          "additional_fields_label.key" => "Additional fields: %{key}"
          "additional_fields_label.value.string_value" => "%{value}"
        }
        on_error => "additional_fields_label_replace_error"
      }
      if ![additional_fields_label_replace_error] {
        mutate {
          merge => {
            "event_additional.fields" => "additional_fields_label"
          }
          on_error => "additional_fields_label_merge_error"
        }
      }
    }
  }
  if [metadata][product_event_type] != "" {
    mutate {
      replace => {
        "metadata_product_event_type_label.key" => "Product Event Type"
        "metadata_product_event_type_label.value.string_value" => "%{metadata.product_event_type}"
      }
      on_error => "metadata_product_event_type_label_replace_error"
    }
    if ![metadata_product_event_type_label_replace_error] {
      mutate {
        merge => {
          "event_additional.fields" => "metadata_product_event_type_label"
        }
        on_error => "metadata_product_event_type_label_merge_error"
      }
    }
  }
  if [sec_action] != "" {
    mutate {
      merge => {
        "event_security_result.action" => "sec_action"
      }
      on_error => "no_sec_action"
    }
  }
  if [event_type] == "" {
    if [has_principal_machine] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event_metadata.event_type" => "%{event_type}"
      }
      on_error => "no_event_type"
    }
  }

  mutate {
    replace => {
      "event_metadata.product_name" => "LASTPASS"
      "event_metadata.vendor_name" => "LASTPASS"
    }
  }

  # merge the data into udm nouns.
  if [event_metadata] != "" {
    mutate {
      rename => {
        "event_metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [event_principal] != "" {
    mutate {
      rename => {
        "event_principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [event_target] != "" {
    mutate {
      rename => {
        "event_target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [event_additional] != "" {
    mutate {
      rename => {
        "event_additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }
  if [event_security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "event_security_result"
      }
      on_error => "no_security_result"
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
      on_error => "no_network"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

