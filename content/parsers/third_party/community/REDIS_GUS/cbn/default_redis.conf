# Product: REDIS
# Category: Storage solutions
# Supported Format: JSON
# References: N/A
# Last Updated: 2026-11-12
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "time" => ""
      "category" => ""
      "metricName" => ""
      "operationName" => ""
      "resourceId" => ""
      "location" => ""
      "Level" => ""
      "timeGrain" => ""
      "count" => ""
      "total" => ""
      "minimum" => ""
      "maximum" => ""
      "average" => ""
      "tenant" => ""
      "role_instance" => ""
      "security_result" => ""
      "role_instance_label" => ""
      "count_field" => ""
      "total_field" => ""
      "minimum_field" => ""
      "maximum_field" => ""
      "average_field" => ""
      "time_grain_field" => ""
      "has_principal" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_error"
  }

  if [json_error] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [time] != "" {
    date {
      match => [
        "time", "RFC3339", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSSSSSZ"
      ]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "time_parse_failed"
    }
  }

  if [category] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{category}"
      }
      on_error => "category_not_found"
    }
  } else if [metricName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{metricName}"
      }
      on_error => "metric_name_not_found"
    }
  }

  if [operationName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{operationName}"
      }
      on_error => "operation_name_not_found"
    }
  }

  if [resourceId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{resourceId}"
      }
      on_error => "resource_id_not_found"
    }
  }

  mutate {
    replace => {
      "tenant" => "%{properties.tenant}"
    }
    on_error => "tenant_not_found"
  }

  if [tenant] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{tenant}"
      }
      on_error => "target_resource_name_replace_failed"
    }
  }

  if [location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{location}"
      }
      on_error => "location_not_found"
    }
  }

  mutate {
    convert => {
      "Level" => "string"
    }
    on_error => "level_convert_failed"
  }

  if [Level] == "4" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }

  mutate {
    replace => {
      "role_instance" => "%{properties.roleInstance}"
    }
    on_error => "role_instance_not_found"
  }

  if [role_instance] != "" {
    mutate {
      replace => {
        "role_instance_label.key" => "roleInstance"
        "role_instance_label.value" => "%{role_instance}"
      }
      on_error => "role_instance_replace_failed"
    }
    if ![role_instance_replace_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "role_instance_label"
        }
        on_error => "role_instance_merge_failed"
      }
    }
  }

  for index, client in properties.connectedClients {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "client_index_convert_failed"
    }
    mutate {
      replace => {
        "client_ip" => ""
        "client_ipv6" => ""
        "client_count" => ""
        "client_count_field" => ""
      }
    }
    mutate {
      replace => {
        "client_ip" => "%{client.ip}"
      }
      on_error => "client_ip_not_found"
    }
    if [client_ip] != "" {
      grok {
        match => {
          "client_ip" => "%{IP:client_ip}"
        }
        overwrite => ["client_ip"]
        on_error => "invalid_client_ip"
      }
      if ![invalid_client_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "client_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "client_ip"
          }
          on_error => "client_ip_merge_failed"
        }
        if ![client_ip_merge_failed] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    mutate {
      replace => {
        "client_ipv6" => "%{client.privateLinkIpv6}"
      }
      on_error => "client_ipv6_not_found"
    }
    if [client_ipv6] != "" {
      grok {
        match => {
          "client_ipv6" => "%{IP:client_ipv6}"
        }
        overwrite => ["client_ipv6"]
        on_error => "invalid_client_ipv6"
      }
      if ![invalid_client_ipv6] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "client_ipv6"
            "event.idm.read_only_udm.principal.asset.ip" => "client_ipv6"
          }
          on_error => "client_ipv6_merge_failed"
        }
        if ![client_ipv6_merge_failed] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    mutate {
      convert => {
        "client.count" => "string"
      }
      on_error => "client_count_convert_failed"
    }
    mutate {
      replace => {
        "client_count" => "%{client.count}"
      }
      on_error => "client_count_not_found"
    }
    if [client_count] != "" {
      mutate {
        replace => {
          "client_count_field.key" => "connectedClients_%{index}_count"
          "client_count_field.value.string_value" => "%{client_count}"
        }
        on_error => "client_count_field_replace_failed"
      }
      if ![client_count_field_replace_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "client_count_field"
          }
          on_error => "client_count_field_merge_failed"
        }
      }
    }
  }

  mutate {
    convert => {
      "count" => "string"
    }
    on_error => "count_convert_failed"
  }

  if [count] != "" {
    mutate {
      replace => {
        "count_field.key" => "count"
        "count_field.value.string_value" => "%{count}"
      }
      on_error => "count_not_found"
    }
    if ![count_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "count_field"
        }
        on_error => "count_merge_failed"
      }
    }
  }

  mutate {
    convert => {
      "total" => "string"
    }
    on_error => "total_convert_failed"
  }

  if [total] != "" {
    mutate {
      replace => {
        "total_field.key" => "total"
        "total_field.value.string_value" => "%{total}"
      }
      on_error => "total_not_found"
    }
    if ![total_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "total_field"
        }
        on_error => "total_merge_failed"
      }
    }
  }

  mutate {
    convert => {
      "minimum" => "string"
    }
    on_error => "minimum_convert_failed"
  }

  if [minimum] != "" {
    mutate {
      replace => {
        "minimum_field.key" => "minimum"
        "minimum_field.value.string_value" => "%{minimum}"
      }
      on_error => "minimum_not_found"
    }
    if ![minimum_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "minimum_field"
        }
        on_error => "minimum_merge_failed"
      }
    }
  }

  mutate {
    convert => {
      "maximum" => "string"
    }
    on_error => "maximum_convert_failed"
  }

  if [maximum] != "" {
    mutate {
      replace => {
        "maximum_field.key" => "maximum"
        "maximum_field.value.string_value" => "%{maximum}"
      }
      on_error => "maximum_not_found"
    }
    if ![maximum_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "maximum_field"
        }
        on_error => "maximum_merge_failed"
      }
    }
  }

  mutate {
    convert => {
      "average" => "string"
    }
    on_error => "average_convert_failed"
  }

  if [average] != "" {
    mutate {
      replace => {
        "average_field.key" => "average"
        "average_field.value.string_value" => "%{average}"
      }
      on_error => "average_not_found"
    }
    if ![average_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "average_field"
        }
        on_error => "average_merge_failed"
      }
    }
  }

  if [timeGrain] != "" {
    mutate {
      replace => {
        "time_grain_field.key" => "timeGrain"
        "time_grain_field.value.string_value" => "%{timeGrain}"
      }
      on_error => "time_grain_not_found"
    }
    if ![time_grain_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "time_grain_field"
        }
        on_error => "time_grain_merge_failed"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "REDIS"
      "event.idm.read_only_udm.metadata.product_name" => "REDIS"
    }
  }

  if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
