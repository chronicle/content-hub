# Product: AliCloud WAF
# Category: N/A
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-10-08
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "Action" => ""
      "BotTag" => ""
      "ClientASN" => ""
      "ClientCountryCode" => ""
      "ClientIP" => ""
      "ClientISP" => ""
      "ClientRegionCode" => ""
      "ClientRequestBytes" => ""
      "ClientRequestHeaderRange" => ""
      "ClientRequestHost" => ""
      "ClientRequestID" => ""
      "ClientRequestMethod" => ""
      "ClientRequestPath" => ""
      "ClientRequestProtocol" => ""
      "ClientRequestQuery" => ""
      "ClientRequestReferer" => ""
      "ClientRequestScheme" => ""
      "ClientRequestURI" => ""
      "ClientRequestUserAgent" => ""
      "ClientSSLCipher" => ""
      "ClientSSLProtocol" => ""
      "ClientSrcPort" => ""
      "ClientXRequestedWith" => ""
      "CustomFields" => ""
      "Datetime" => ""
      "EdgeCacheStatus" => ""
      "EdgeEndTimestamp" => ""
      "EdgeRequestHost" => ""
      "EdgeResponseBodyBytes" => ""
      "EdgeResponseBytes" => ""
      "EdgeResponseCompressionAlgo" => ""
      "EdgeResponseCompressionRatio" => ""
      "EdgeResponseContentType" => ""
      "EdgeResponseStatusCode" => ""
      "EdgeResponseTime" => ""
      "EdgeServerID" => ""
      "EdgeServerIP" => ""
      "EdgeStartTimestamp" => ""
      "EdgeTimeToFirstByteMs" => ""
      "JA3Hash" => ""
      "JA4Hash" => ""
      "OriginDNSResponseTimeMs" => ""
      "OriginIP" => ""
      "origin_ip" => ""
      "origin_port" => ""
      "OriginResponseDurationMs" => ""
      "OriginResponseHTTPExpires" => ""
      "OriginResponseHTTPLastModified" => ""
      "OriginResponseHeaderRange" => ""
      "OriginResponseStatusCode" => ""
      "OriginSSLProtocol" => ""
      "OriginTCPHandshakeDurationMs" => ""
      "OriginTLSHandshakeDurationMs" => ""
      "RuleID" => ""
      "SecAction" => ""
      "SecActions" => ""
      "SecRuleID" => ""
      "SecRuleIDs" => ""
      "SecSource" => ""
      "SecSources" => ""
      "SiteName" => ""
      "SmartRoutingStatus" => ""
      "TlsHash" => ""
      "app_protocol_src" => ""
      "app_protocol_output" => ""
      "Source" => ""
      "RuleType" => ""
      "ManagedRuleType" => ""
      "app_protocol_version" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "is_http" => "false"
      "action" => ""
      "security_result" => ""
      "intermediary" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [EdgeStartTimestamp] not in ["", "-"] {
    date {
      match => ["EdgeStartTimestamp", "RFC3339", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_edge_start_timestamp"
    }
  } else if [EdgeEndTimestamp] not in ["", "-"] {
    date {
      match => ["EdgeEndTimestamp", "RFC3339", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_edge_end_timestamp"
    }
  } else if [Datetime] not in ["", "-"] {
    date {
      match => ["Datetime", "RFC3339", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_datetime"
    }
  }

  if [ClientRequestID] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{ClientRequestID}"
      }
      on_error => "no_client_request_id"
    }
  }

  if [ClientIP] not in ["", "-"] {
    grok {
      match => {
        "ClientIP" => ["%{IP:ClientIP}"]
      }
      overwrite => ["ClientIP"]
      on_error => "client_ip_parse_failed"
    }
    if ![client_ip_parse_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ClientIP"
          "event.idm.read_only_udm.principal.asset.ip" => "ClientIP"
        }
        on_error => "no_client_ip"
      }
      if ![no_client_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [ClientSrcPort] not in ["", "-", "-1"] {
    grok {
      match => {
        "ClientSrcPort" => ["%{INT:ClientSrcPort}"]
      }
      overwrite => ["ClientSrcPort"]
      on_error => "client_src_port_parse_failed"
    }
    if ![client_src_port_parse_failed] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{ClientSrcPort}"
        }
        on_error => "no_client_src_port"
      }
      if ![no_client_src_port] {
        mutate {
          convert => {
            "event.idm.read_only_udm.principal.port" => "integer"
          }
          on_error => "client_src_port_not_integer"
        }
      }
    }
  }

  if [ClientCountryCode] not in ["", "-"] {
    grok {
      match => {
        "ClientCountryCode" => ["%{WORD:ClientCountryCode}"]
      }
      overwrite => ["ClientCountryCode"]
      on_error => "client_country_code_parse_failed"
    }
    if ![client_country_code_parse_failed] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.location.country_or_region" => "%{ClientCountryCode}"
        }
        on_error => "no_client_country_code"
      }
    }
  }

  if [ClientRegionCode] not in ["", "-"] {
    grok {
      match => {
        "ClientRegionCode" => ["%{WORD:ClientRegionCode}"]
      }
      overwrite => ["ClientRegionCode"]
      on_error => "client_region_code_parse_failed"
    }
    if ![client_region_code_parse_failed] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.location.state" => "%{ClientRegionCode}"
        }
        on_error => "no_client_region_code"
      }
    }
  }

  if [ClientRequestHost] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{ClientRequestHost}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{ClientRequestHost}"
        "has_target" => "true"
      }
      on_error => "no_client_request_host"
    }
  }

  if [OriginIP] not in ["", "-"] {
    grok {
      match => {
        "OriginIP" => [
          "%{IP:origin_ip}:%{INT:origin_port}",
          "%{IP:origin_ip}"
        ]
      }
      overwrite => ["origin_ip", "origin_port"]
      on_error => "origin_ip_parse_failed"
    }

    if ![origin_ip_parse_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "origin_ip"
          "event.idm.read_only_udm.target.asset.ip" => "origin_ip"
        }
        on_error => "no_origin_ip"
      }
      if ![no_origin_ip] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
      if [origin_port] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.port" => "%{origin_port}"
          }
          on_error => "no_origin_port"
        }
        if ![no_origin_port] {
          mutate {
            convert => {
              "event.idm.read_only_udm.target.port" => "integer"
            }
            on_error => "origin_port_not_integer"
          }
        }
      }
    }
  }

  if [SiteName] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.administrative_domain" => "%{SiteName}"
      }
      on_error => "no_site_name"
    }
  }

  if [ClientRequestPath] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{ClientRequestPath}"
      }
      on_error => "no_client_request_path"
    }
  }

  if [EdgeResponseContentType] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.mime_type" => "%{EdgeResponseContentType}"
      }
      on_error => "no_edge_response_content_type"
    }
  }

  if [ClientRequestURI] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{ClientRequestURI}"
      }
      on_error => "no_client_request_uri"
    }
  }

  if [EdgeServerIP] not in ["", "-"] {
    mutate {
      merge => {
        "intermediary.ip" => "EdgeServerIP"
        "intermediary.asset.ip" => "EdgeServerIP"
      }
      on_error => "no_edge_server_ip"
    }
  }

  if [EdgeRequestHost] not in ["", "-"] {
    mutate {
      replace => {
        "intermediary.hostname" => "%{EdgeRequestHost}"
        "intermediary.asset.hostname" => "%{EdgeRequestHost}"
      }
      on_error => "no_edge_request_host"
    }
  }

  if [ClientASN] not in ["", "-", "-1"] {
    mutate {
      convert => {
        "ClientASN" => "string"
      }
      on_error => "client_asn_not_string"
    }
    mutate {
      replace => {
        "asn_resource.key" => "ClientASN"
        "asn_resource.value" => "%{ClientASN}"
      }
      on_error => "no_client_asn_resource"
    }
    if ![no_client_asn_resource] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "asn_resource"
        }
        on_error => "merge_client_asn_resource_failed"
      }
    }
  }

  if [ClientISP] not in ["", "-"] {
    mutate {
      replace => {
        "isp_resource.key" => "ClientISP"
        "isp_resource.value" => "%{ClientISP}"
      }
      on_error => "no_client_isp"
    }
    if ![no_client_isp] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "isp_resource"
        }
        on_error => "merge_client_isp_resource_failed"
      }
    }
  }


  if [ClientRequestBytes] not in ["", "-", "-1"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{ClientRequestBytes}"
      }
      on_error => "no_client_request_bytes"
    }
    if ![no_client_request_bytes] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
        }
        on_error => "client_request_bytes_not_uinteger"
      }
    }
  }

  if [EdgeResponseBytes] not in ["", "-", "-1"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{EdgeResponseBytes}"
      }
      on_error => "no_edge_response_bytes"
    }
    if ![no_edge_response_bytes] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.received_bytes" => "uinteger"
        }
        on_error => "edge_response_bytes_not_uinteger"
      }
    }
  }

  if [ClientRequestMethod] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{ClientRequestMethod}"
      }
      on_error => "no_client_request_method"
    }
  }

  if [EdgeResponseStatusCode] not in ["", "-", "-1"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{EdgeResponseStatusCode}"
      }
      on_error => "no_edge_response_status_code_http"
    }
    if ![no_edge_response_status_code_http] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
        on_error => "edge_response_status_code_not_integer"
      }
    }
  }

  if [ClientRequestReferer] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{ClientRequestReferer}"
      }
      on_error => "no_client_request_referer"
    }
  }

  if [ClientRequestUserAgent] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{ClientRequestUserAgent}"
      }
      on_error => "no_user_agent"
    }
    mutate{
      replace => {
        "event.idm.read_only_udm.network.http.parsed_user_agent" => "%{ClientRequestUserAgent}"
      }
      on_error => "no_parsed_user_agent"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.parsed_user_agent" => "parseduseragent"
      }
        on_error => "user_agent_parse_failed"
    }
  }

  if [ClientRequestProtocol] not in ["", "-"] {
    grok {
      match => {
        "ClientRequestProtocol" => ["%{WORD:app_protocol_src}(?:/%{NOTSPACE:app_protocol_version})?"]
      }
      overwrite => ["app_protocol_src", "app_protocol_version"]
      on_error => "app_protocol_grok_failed"
    }
    if ![app_protocol_grok_failed] {
      mutate {
        uppercase => [ "app_protocol_src" ]
      }

      if [app_protocol_src] in [ "22", "SSH", "SSHD" ] {
        mutate {
          replace => {
            "app_protocol_output" => "SSH"
          }
        }
      }
      else if [app_protocol_src] in [ "25", "SMTP" ] {
        mutate {
          replace => {
            "app_protocol_output" => "SMTP"
          }
        }
      }
      else if [app_protocol_src] in [ "53", "DNS" ] {
        mutate {
          replace => {
            "app_protocol_output" => "DNS"
          }
        }
      }
      else if [app_protocol_src] in [ "80", "8080", "HTTP" ] {
        mutate {
          replace => {
            "app_protocol_output" => "HTTP"
          }
        }
      }
      else if [app_protocol_src] in [ "443", "HTTPS", "TLS" ] {
        mutate {
          replace => {
            "app_protocol_output" => "HTTPS"
          }
        }
      }
      else if [app_protocol_src] in [ "7400", "7401", "7402", "DDS" ] {
        mutate {
          replace => {
            "app_protocol_output" => "DDS"
          }
        }
      }
      else if [app_protocol_src] in [ "SMB", "SMBV1" ] {
        mutate {
          replace => {
            "app_protocol_output" => "SMB"
          }
        }
      }
      else if [app_protocol_src] in [
        "UNKNOWN_APPLICATION_PROTOCOL", "AFP", "APPC", "AMQP", "ATOM", "BEEP",
        "BITCOIN", "BIT_TORRENT", "CFDP", "COAP", "DEVICE_NET", "DHCP", "E_DONKEY",
        "ENRP", "FAST_TRACK", "FINGER", "FREENET", "FTAM", "GOPHER", "HL7", "H323",
        "IRCP", "KADEMLIA", "LDAP", "LPD", "MIME", "MODBUS", "MQTT", "NETCONF",
        "NFS", "NIS", "NNTP", "NTCIP", "NTP", "OSCAR", "PNRP", "QUIC", "RDP", "RELP",
        "RIP", "RLOGIN", "RPC", "RTMP", "RTP", "RTPS", "RTSP", "SAP", "SDP", "SIP",
        "SLP", "SNTP", "SSMS", "STYX", "TCAP", "TDS", "TOR", "TSP", "VTP", "WHOIS",
        "WEB_DAV", "X400", "X500", "XMPP", "IEC104", "DCERPC"
      ] {
        mutate {
          replace => {
            "app_protocol_output" => "%{app_protocol_src}"
          }
        }
      } else {
        mutate {
          replace => {
            "app_protocol_output" => ""
          }
        }
      }
      if [app_protocol_output] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "%{app_protocol_output}"
            "is_http" => "true"
          }
          on_error => "no_app_protocol_output"
        }
      }
      if [app_protocol_version] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol_version" => "%{app_protocol_version}"
          }
          on_error => "app_protocol_version_replace_failed"
        }
      }
    }
  }

  if [ClientSSLCipher] not in ["", "-", "none", "NONE"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.cipher" => "%{ClientSSLCipher}"
      }
      on_error => "no_client_ssl_cipher"
    }
  }

  if [ClientSSLProtocol] not in ["", "-", "none", "NONE"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.version" => "%{ClientSSLProtocol}"
      }
      on_error => "no_client_ssl_protocol"
    }
  }

  if [JA3Hash] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.client.ja3" => "%{JA3Hash}"
      }
      on_error => "no_ja3_hash"
    }
  }

  if [JA4Hash] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.client.ja4" => "%{JA4Hash}"
      }
      on_error => "no_ja4_hash"
    }
  }


  if [SecAction] == "" and [Action] != "" {
    mutate {
      replace => {
        "SecAction" => "%{Action}"
      }
      on_error => "no_action"
    }
  }

  if [SecRuleID] == "" and [RuleID] != "" {
    mutate {
      replace => {
        "SecRuleID" => "%{RuleID}"
      }
      on_error => "no_rule_id"
    }
  }

  if [SecSource] == "" and [Source] != "" {
    mutate {
      replace => {
        "SecSource" => "%{Source}"
      }
      on_error => "no_source"
    }
  }

  if [SecAction] == "" or [SecRuleID] == "" {
    mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
  }
  else if [SecAction] =~ "(?i)(deny|block)" {
    mutate {
      replace => {
        "action" => "BLOCK"
      }
    }
  }
  if [action] != "" {
    mutate {
      merge => {
        "security_result.action" => "action"
      }
      on_error => "merge_sec_action_failed"
    }
  }

  if [SecAction] not in ["", "-"] {
    mutate {
      replace => {
        "security_result.action_details" => "%{SecAction}"
      }
      on_error => "no_sec_action_details"
    }
  }

  if [SecRuleID] not in ["", "-"] {
    mutate {
      replace => {
        "security_result.rule_id" => "%{SecRuleID}"
      }
      on_error => "no_sec_rule_id"
    }
  }

  if [SecSource] not in ["", "-"] {
    mutate {
      replace => {
        "security_result.rule_name" => "%{SecSource}"
      }
      on_error => "no_sec_source"
    }
  }

  if [BotTag] not in ["", "-"] {
    mutate {
      replace => {
        "bot_tag_df.key" => "BotTag"
        "bot_tag_df.value" => "%{BotTag}"
      }
      on_error => "no_bot_tag"
    }
    if ![no_bot_tag] {
      mutate {
        merge => {
          "security_result.detection_fields" => "bot_tag_df"
        }
        on_error => "merge_bot_tag_failed"
      }
    }
  }

  if [SecActions] not in ["", "-"] {
    mutate {
      replace => {
        "sec_actions_df.key" => "SecActions"
        "sec_actions_df.value" => "%{SecActions}"
      }
      on_error => "no_sec_actions"
    }
    if ![no_sec_actions] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sec_actions_df"
        }
        on_error => "merge_sec_actions_failed"
      }
    }
  }

  if [SecRuleIDs] not in ["", "-"] {
    mutate {
      replace => {
        "sec_rule_ids_df.key" => "SecRuleIDs"
        "sec_rule_ids_df.value" => "%{SecRuleIDs}"
      }
      on_error => "no_sec_rule_ids"
    }
    if ![no_sec_rule_ids] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sec_rule_ids_df"
        }
        on_error => "merge_sec_rule_ids_failed"
      }
    }
  }

  if [SecSources] not in ["", "-"] {
    mutate {
      replace => {
        "sec_sources_df.key" => "SecSources"
        "sec_sources_df.value" => "%{SecSources}"
      }
      on_error => "no_sec_sources"
    }
    if ![no_sec_sources] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sec_sources_df"
        }
        on_error => "merge_sec_sources_failed"
      }
    }
  }

  if [Source] not in ["", "-"] {
    mutate {
      replace => {
        "source_df.key" => "Source"
        "source_df.value" => "%{Source}"
      }
      on_error => "no_source_field"
    }
    if ![no_source_field] {
      mutate {
        merge => {
          "security_result.detection_fields" => "source_df"
        }
        on_error => "merge_source_failed"
      }
    }
  }

  if [RuleType] not in ["", "-"] {
    mutate {
      replace => {
        "rule_type_df.key" => "RuleType"
        "rule_type_df.value" => "%{RuleType}"
      }
      on_error => "no_rule_type"
    }
    if ![no_rule_type] {
      mutate {
        merge => {
          "security_result.detection_fields" => "rule_type_df"
        }
        on_error => "merge_rule_type_failed"
      }
    }
  }

  if [ManagedRuleType] not in ["", "-"] {
    mutate {
      replace => {
        "managed_rule_type_df.key" => "ManagedRuleType"
        "managed_rule_type_df.value" => "%{ManagedRuleType}"
      }
      on_error => "no_managed_rule_type"
    }
    if ![no_managed_rule_type] {
      mutate {
        merge => {
          "security_result.detection_fields" => "managed_rule_type_df"
        }
        on_error => "merge_managed_rule_type_failed"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "merge_security_result_failed"
    }
  }

  if [ClientRequestHeaderRange] not in ["", "-"] {
    mutate {
      replace => {
        "client_request_header_range_label.key" => "ClientRequestHeaderRange"
        "client_request_header_range_label.value.string_value" => "%{ClientRequestHeaderRange}"
      }
      on_error => "no_client_request_header_range"
    }
    if ![no_client_request_header_range] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "client_request_header_range_label"
        }
        on_error => "merge_client_request_header_range_failed"
      }
    }
  }

  if [ClientRequestQuery] not in ["", "-"] {
    mutate {
