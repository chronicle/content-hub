      "hostname" => ""
      "app_name" => ""
      "process_id" => ""
      "json_payload" => ""
      "intermediary" => ""
    }
  }
  mutate {
    gsub => ["message", "target", "target1"]
  }
  grok {
    match => {
        "message" => [
                     "<%{INT}>%{INT:version} %{TIMESTAMP_ISO8601:time} %{DATA:hostname} %{DATA:app_name} %{INT:process_id} - - %{GREEDYDATA:json_payload}",
                     "<%{POSINT}>%{INT}\\s+%{TIMESTAMP_ISO8601:time} %{GREEDYDATA} - - %{GREEDYDATA:json_payload}"
        ]
    }
    overwrite => ["version", "time", "hostname", "app_name", "process_id", "json_payload"]
    on_error => "grok_parse_failed"
  }
  if [version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{version}"
      }
      on_error => "no_version"
    }
  }
  if [time] != "" {
    date {
      # 2025-06-29T09:07:04.039925+00:00
      match => ["time", "yyyy-MM-ddTHH:mm:ss.SSSSSS+ZZ", "ISO8601", "TIMESTAMP_ISO8601", "RFC3339"]
      target => "metadata.collected_timestamp"
    on_error => "time_parse_failed"
    }
  }
  if [hostname] != "" {
    grok {
      match => {
        "hostname" => "%{IP:device_ip}"
      }
      overwrite => ["device_ip"]
      on_error => "no_device_ip"
    }
    if ![no_device_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "device_ip"
        }
        on_error => "intermediary_ip_merge_failed"
      }
    }
    else {
      mutate {
        replace => {
          "intermediary.hostname" => "%{hostname}"
        }
        on_error => "no_hostname"
      }
    }
  }
  if [app_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{app_name}"
      }
      on_error => "no_app_name"
    }
  }
  if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{process_id}"
      }
      on_error => "no_process_id"
    }
  }

  json {
    source => "json_payload" # Parses the captured JSON
    array_function => "split_columns"
    on_error => "json_parse_failed"
  }
  mutate {
    gsub => ["message",","," "]
  }
  mutate {
    gsub => ["message",";"," "]
  }
  mutate {
    gsub => ["message","([a-zA-Z0-9-_]+)=","&$1="]
  }
  kv {
    source => "message"
    value_split => "="
    field_split => "&"
    on_error => "kv_parse_failed"
  }
  if [ImportCompleted] != "" {
    mutate {
      convert => {
        "ImportCompleted" => "string"
      }
      on_error => "import_completed_not_integer"
    }
    mutate {
      replace => {
        "ImportCompleted_label.key" => "ImportCompleted"
        "ImportCompleted_label.value.string_value" => "%{ImportCompleted}"
      }
      on_error => "no_import_completed"
    }
    if ![no_import_completed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "ImportCompleted_label"
        }
        on_error => "ImportCompleted_merge_failed"
