        replace => {
          "sr.description"    => "%{description}"
        }
        on_error => "no_description"
      }

      mutate {
        replace => {
          "sr.severity_details"   => "%{severity}"
        }
        on_error => "no_severity"
      }

      #USER_LOGIN EVENTS
      if [sag] in [ "AMH-SEC-00130", "AMH-SEC-00470", "AMH-SEC-00050", "AMH-SEC-00240", "AMH-SEC-00055", "AMH-SEC-00250", "AMH-SEC-00200", "AMH-SEC-00450", "AMH-SEC-00460" ] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type"   => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type"  => "MACHINE"
          }
          on_error => "replace_failed"
        }
        if [sag] == "AMH-SEC-00130" or [sag] == "AMH-SEC-00450" {
          grok {
            match => {
              "description" => [
                "user \\'%{DATA:userid}\\'.*client %{DATA:client}: session %{GREEDYDATA:sessionid}\\.$"
              ]
            }
            on_error => "grok_user_login_success"
          }
          if [sag] == "AMH-SEC-00130" {
            mutate {
              replace => {
                "act" => "ALLOW"
                "sr.summary"  => "Login Successful"
              }
              on_error => "replace_failed"
            }
          }
          else {
            mutate {
              replace => {
                "act" => "ALLOW"
                "sr.summary"  => "Successful enrollment"
              }
              on_error => "replace_failed"
            }
          }
        }
        else if [sag] in ["AMH-SEC-00050", "AMH-SEC-00055", "AMH-SEC-00200", "AMH-SEC-00240", "AMH-SEC-00250", "AMH-SEC-00460","AMH-SEC-00470"] {
          grok {
            match => {
              "description" => [
                "(user|User)\\s+'?%{DATA:userid}'?\\s+at client %{IPV4:client}: session %{DATA:session} "
                "(user|User)\\s+'?%{DATA:userid}'?\\s+(at client %{IPV4:client}(\\s+|:)|at client %{IPV4:client}.$)?(due to )?(\\[.*\\])?( )?%{DATA:desc}$"
              ]
            }
            on_error => "grok_user_login_failed"
          }
          if [sag] in [ "AMH-SEC-00050", "AMH-SEC-00055", "AMH-SEC-00200", "AMH-SEC-00240", "AMH-SEC-00250", "AMH-SEC-00470"] {
            mutate {
              replace => {
                "act" => "BLOCK"
                "sr.summary"  => "Login attempt"
              }
              on_error => "replace_failed"
            }
          }
          else {
            mutate {
              replace => {
                "act" => "BLOCK"
                "sr.summary"  => "User failed to successfully enroll"
              }
              on_error => "replace_failed"
            }
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid"  => "%{userid}"
