# Product: SWIFT_AMH
# Category: Finance
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2025-11-26
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "has_user_data" => "false"
      "event_type" => ""
      "level" => ""
      "principal_user_roles" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "thread_info" => ""
      "product_event_id" => ""
      "logger" => ""
    }
  }
  if [message] =~ 'MessageType' {
    mutate {
      replace => {
        "DateDelivered" => ""
        "TransferReference" => ""
        "DateCreated" => ""
        "index" => ""
      }
    }

    mutate {
      gsub => [ "message", '\\\\"', '"']
    }
    mutate {
      gsub => [ "message", '\\\\n', '']
    }
    mutate {
      gsub => [ "message", '  ', '']
    }
    mutate {
      gsub => [ "message", '"\{"', '{"']
    }
    mutate {
      gsub => [ "message", '}}"}', '}}}']
    }

    if [message]  =~ "User" {
      mutate {
        gsub => [ "message", '\\"', '"']
      }
      mutate {
        gsub => [ "message", '\\(reason:.*"(.*?)"\\)', "(reason: '$1')"]
      }
    }
    json {
      source => "message"
      array_function => "split_columns"
      target => "target"
      on_error => "json_parse_failure"
    }

    # Adding kafka.offset to prevent duplicate events
    mutate {
      replace => {
        "ab.resource.product_object_id" => "%{target.kafka_offset}"
      }
      on_error => "kafka_offset_failed"
    }
    if [message] =~ "Amount" {
      mutate {
        replace => {
            "amount.key" => "amount"
            "amount.value" => "%{target.data.message.ExtractedFields.Amount}"
        }
        on_error => "amount_replace_failed"
      }
      if ![amount_replace_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "amount"
          }
          on_error => "merge_failed"
        }
      }
    }
    if [message] =~ "Currency" {
      mutate {
        replace => {
          "currency.key" => "currency"
          "currency.value" => "%{target.data.message.ExtractedFields.Currency}"
        }
        on_error => "replace_failed"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "currency"
        }
        on_error => "merge_failed"
      }
    }

    if [message] =~ "Offset" {
      mutate {
        convert => {
          "target.offset" => 'string'
        }
        on_error => "convert_failed"
      }
      mutate {
        replace => {
          "offset.key" => "offset"
          "offset.value" => "%{target.offset}"
        }
        on_error => "replace_failed"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "offset"
        }
        on_error => "merge_failed"
      }
    }

    if [message] =~ "DateCreated"   {
      mutate {
        gsub => [ "target.data.message.Header.DateCreated", '\\+.*', '']
      }
      date {
        match => ["target.data.message.Header.DateCreated", "yyyy-MM-ddTHH:mm:ss.SSS", "yyyy-MM-ddTHH:mm:ss"]
        timezone => "Europe/Madrid"
        target=> "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "invalid_date"
      }
    }
    if [message] =~ "DateDelivered" {
      mutate {
          gsub => ["target.data.message.Header.DateDelivered", '\\+.*', '']
      }
      date {
          match => ["target.data.message.Header.DateDelivered", "yyyy-MM-ddTHH:mm:ss.SSS", "yyyy-MM-ddTHH:mm:ss"]
          timezone => "Europe/Madrid"
          target=> "event.idm.read_only_udm.principal.asset.last_discover_time"
          on_error => "invalid_date"
        }
      }
    if [message] =~ "TransferReference" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{target.data.message.Header.TransferReference}"
        }
        on_error => "replace_failed"
      }
    }
    mutate {
      gsub => [ "target.data.message.Status.CurrentStatus.StatusDate", '\\+.*', '']
    }
    date {
        match => ["target.data.message.Status.CurrentStatus.StatusDate", "yyyy-MM-ddTHH:mm:ss.SSS", "yyyy-MM-ddTHH:mm:ss"]
        timezone => "Europe/Madrid"
        target=> "event.idm.read_only_udm.principal.asset.system_last_update_time"
        on_error => "invalid_date"
      }
    mutate {
      convert => {
        "target.createdAt" => 'string'
      }
      on_error => "convert_failed"
    }
    mutate {
          gsub => [ "target.createdAt", ".{6}$", ""]
    }
    date {
      match => ["target.createdAt", "UNIX_MS"]
      timezone => "Europe/Madrid"
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "invalid_createdAt_date"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{target.data.message.Header.MessageReference}"
      }
      on_error => "replace_failed"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{target.data.message.Header.MessageType.Code}"
      }
      on_error => "replace_failed"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.parent_pid" => "%{target.data.message.Header.TransactionReference}"
      }
      on_error => "replace_failed"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.parent_pid" => "%{target.data.message.Header.TransactionReference}"
      }
      on_error => "replace_failed"
    }
    mutate {
      replace => {
        "spanId.key" => "parentSpanId"
        "spanId.value.string_value" => "%{target.parentSpanId}"
      }
      on_error => "replace_failed"
    }
    mutate {
      replace => {
        "traceId_label.key" => "traceId"
        "traceId_label.value.string_value" => "%{target.traceId}"
      }
      on_error => "replace_failed"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "traceId_label"
      }
      on_error => "merge_failed"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "spanId"
      }
      on_error => "merge_failed"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_failed"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.vendor_name" => "SWIFT"
        "event.idm.read_only_udm.metadata.product_name" => "AMH"
      }
      on_error => "replace_failed"
    }

    for index, record in target.data.message.Status.StructuredHistory.HistoryLine {
      mutate {
        replace =>{
          "ac" => ""
          "HistoryDate" => ""
          "Phase" => ""
          "Action" => ""
          "Reason" => ""
          "Entity" => ""
          "Description" => ""
          "User" => ""
        }
        on_error => "PASS"
      }
      mutate {
        replace => {
          "HistoryDate.key" => "HistoryDate"
          "HistoryDate.value" => "%{record.HistoryDate}"
          "Phase.key" => "Phase"
          "Phase.value" => "%{record.Phase}"
          "Action.key" => "Action"
          "Action.value" => "%{record.Action}"
          "Reason.key" => "Reason"
          "Reason.value" => "%{record.Reason}"
          "Entity.key" => "Entity"
          "Entity.value" => "%{record.Entity}"
          "Description.key" => "Description"
          "Description.value" => "%{record.Description}"
        }
      on_error => "PASS"
      }
        if [record][Description] =~ "(create|repair|Repair|Create)"{
          mutate {
            gsub => [ "record.Description", ".*User '(.*?)'.*", '$1']
          }
           mutate {
            gsub => [ "record.Description", ".*user '(.*?)'.*", '$1']
          }
          mutate {
            replace => {
              "event.idm.read_only_udm.target.user.userid" => "%{record.Description}"
              "has_user_data" => "true"
            }
            on_error => "replace_failed"
          }
        }

        if [record][Description] =~ "(verify|Verify)"{
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.userid" => "%{record.User}"
              "has_user_data" => "true"
            }
            on_error => "replace_failed"
          }
        }
        if [record][Description] =~ "(authorize|Authorize)"{
          mutate {
            replace => {
              "user_id" => ""
            }
            on_error => "replace_failed"
          }
          grok {
            match => {
              "message" => ["%{GREEDYDATA}(user\\s\\'%{WORD:user_id}\\'\\s+made\\s+decision\\s+\\'authorize\\')"]
              }
            overwrite => ["user_id"]
            on_error => "grok_failed"
          }
          mutate {
            replace => {
              "Intermediary.user.userid" => "%{user_id}"
            }
            on_error => "replace_failed"
          }
        }

        mutate {
          merge => {
            "ac.outcomes" => "HistoryDate"
          }
          on_error => "PASS"
        }

        mutate {
          merge => {
            "ac.outcomes" => "Phase"
          }
          on_error => "PASS"
        }
        mutate {
          merge => {
            "ac.outcomes" => "Action"
          }
          on_error => "PASS"
        }
        mutate {
          merge => {
            "ac.outcomes" => "Reason"
          }
          on_error => "PASS"
        }
        mutate {
          merge => {
            "ac.outcomes" => "Entity"
          }
          on_error => "PASS"
        }
        mutate {
          merge => {
            "ac.outcomes" => "Description"
          }
          on_error => "PASS"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "ac"
          }
          on_error => "PASS"
        }
      }

    if [message] =~ "(authorize|Authorize)"{
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "Intermediary"
        }
        on_error => "merge_failed"
      }
    }
    mutate {
      replace => {
        "bussiness_element.key" => "Status"
        "bussiness_element.value" => "%{target.data.message.Status.CurrentStatus.Status}"
      }
      on_error => "not_bussiness_element"
    }
    if ![not_bussiness_element]{
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "bussiness_element"
        }
        on_error => "merge_failed"
      }
    }
    for element in target.data.message.Data.Storage.StructuredPayload.messageContent.element{
      mutate {
        replace => {
          "bussiness_element" => ""
        }
        on_error => "replace_failed"
      }
      mutate {
        replace => {
          "bussiness_element.key" => "%{element.bussinessName}"
          "bussiness_element.value" => "%{element._content_}"
        }
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "bussiness_element"
        }
        on_error => "merge_failed"
      }
    }
  }

  # Swift AR
  else if [message] =~ "snmp_1_3_6_1_4_1_18494_2_1_1" {
    json {
      source  => "message"
      on_error => "not_json"
      array_function => "split_columns"
    }
    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name"        => "Swift"
        "event.idm.read_only_udm.metadata.product_name"       => "Amh Sag"
        "event.idm.read_only_udm.metadata.product_version"    => "1"
        "event.idm.read_only_udm.metadata.event_type"         => "GENERIC_EVENT"
      }
      on_error => "replace_failed"
    }
    #date parsing
    mutate {
      replace => {
        "timestamp" => "%{snmp_1_3_6_1_4_1_18494_2_1_2} %{snmp_1_3_6_1_4_1_18494_2_1_3}"
      }
      on_error => "invalid_time"
    }
    date {
      match => [ "timestamp", "dd/MM/yyyy HH:mm:ss"]
      target => "@timestamp"
      timezone => "America/Buenos_Aires"
      on_error => "no_ts"
    }

    grok {
      match => {
        "snmp_1_3_6_1_4_1_18494_2_1_9" => [
          "Operator %{DATA:userid}\\s:\\s%{DATA:last_name},\\s%{DATA:first_name},.*'%{IPV4:ip}.*\\nOperator Profiles: %{GREEDYDATA:user_roles}",
          "Operator %{DATA:userid}\\s:\\s%{DATA:last_name},\\s%{DATA:first_name},.*'%{IPV4:ip}",
          "Operator\\s+\\[%{DATA:userid}\\]:",
          "Operator %{DATA:userid}\\s:\\s%{DATA:last_name},\\s%{DATA:first_name},.*\\nOperator Profiles: %{GREEDYDATA:user_roles}",
          "Message UUMID %{DATA:uumid} \\(suffix %{DATA:suffix}\\) with instance No. %{INT:instance_no} was routed from queue %{DATA:from_queue} to queue %{DATA:to_queue}",
          "UUMID\\s+%{DATA:uumid}\\s+",
          "Operator %{DATA:userid}\\s:"
        ]
      }
      on_error => "grok_error"
    }
    mutate {
      replace => {
        "principal_user_roles" => "%{user_roles}"
      }
      on_error => "no_user_roles"
    }
    if [principal_user_roles] != "" {
      mutate {
        replace => {
          "user_role.name" => "%{principal_user_roles}"
        }
        on_error => "user_role_replace_failed"
      }
      if ![user_role_replace_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.attribute.roles" => "user_role"
          }
          on_error => "user_role_merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "suffix_label.key" => "suffix"
        "suffix_label.value" => "%{suffix}"
      }
      on_error => "no_suffix"
    }
    if ![no_suffix] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "suffix_label"
        }
        on_error => "no_suffix_merge"
      }
    }
    mutate {
      replace => {
        "instance_no_label.key" => "instance_no",
        "instance_no_label.value" => "%{instance_no}"
      }
      on_error => "no_instance_no"
    }
    if ![no_instance_no] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "instance_no_label"
        }
        on_error => "no_instance_no_merge"
      }
    }
    #Separate event_types by event number
    if [snmp_1_3_6_1_4_1_18494_2_1_5] == "3000" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type"   => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type"  => "MACHINE"
          "act"                                           => "ALLOW"
          "event.idm.read_only_udm.target.hostname" => "UNKNOWN"
        }
        on_error => "replace_failed"
      }
    }
    else if [snmp_1_3_6_1_4_1_18494_2_1_5] == "3003" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type"   => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type"  => "MACHINE"
          "act"                                           => "BLOCK"
          "event.idm.read_only_udm.target.hostname" => "UNKNOWN"
          "has_target" => "true"
        }
        on_error => "replace_failed"
      }
    }

    #field parsing
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type"         => "%{snmp_1_3_6_1_4_1_18494_2_1_5}"
      }
      on_error => "no_product_event_type"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id"     => "%{snmp_1_3_6_1_4_1_18494_2_1_10}"
      }
      on_error => "no_product_log_id"
    }
    mutate {
      replace => {
        "sr.summary"  => "%{snmp_1_3_6_1_4_1_18494_2_1_8}"
      }
      on_error => "no_summary"
    }
    mutate {
      replace => {
        "sr.description"  => "%{snmp_1_3_6_1_4_1_18494_2_1_9}"
      }
      on_error => "no_description"
    }

    #grok field parsing
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{userid}"
        "has_user_data" => "true"
      }
      on_error => "no_userid"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id"    => "%{uumid}"
        "has_user_data" => "true"
      }
      on_error => "no_uumid"
    }
    if ![no_uumid] {
      grok {
        match => {
          "uumid" => [
            "(?P<bic>.*X{3})(?P<mt_type>.{3}).*$"
          ]
        }
        on_error => "grok_bic"
      }
      mutate {
        replace => {
          "pal.key"  => "BIC"
          "pal.value"  => "%{bic}"
        }
        on_error => "no_bic"
      }
      if ![no_bic] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.attribute.labels"  => "pal"
          }
          on_error => "merge_failed"
        }
      }
      mutate {
        replace => {
          "pl.key"  => "mt_type"
          "pl.value"  => "%{mt_type}"
        }
        on_error => "no_mt_type"
      }
      if ![no_mt_type] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels"  => "pl"
          }
          on_error => "merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name"  => "%{first_name} %{last_name}"
      }
      on_error => "no_names"
    }
    mutate {
      replace => {
        "tip" => "%{ip}"
      }
      on_error => "no_ip"
    }
    if ![no_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "tip"
        }
        on_error => "tip_merge_failed"
      }
      if ![tip_merge_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    # severity mapping
    if [snmp_1_3_6_1_4_1_18494_2_1_6] == "Info" {
      mutate {
        replace => {
          "sr.severity" => "INFORMATIONAL"
          "sr.severity_details" => "%{snmp_1_3_6_1_4_1_18494_2_1_6}"
        }
        on_error => "replace_failed"
      }
    }
    else if [snmp_1_3_6_1_4_1_18494_2_1_6] == "Warning" {
      mutate {
        replace => {
          "sr.severity" => "LOW"
          "sr.severity_details" => "%{snmp_1_3_6_1_4_1_18494_2_1_6}"
        }
        on_error => "replace_failed"
      }
    }
    mutate {
      merge => {
        "sr.action" => "act"
      }
      on_error => "no_act"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr"
      }
      on_error => "no_sr"
    }
  }

  else {
    #temporary fix to discard an error message when deploying
    mutate {
      replace => {
        "status" => ""
      }
      on_error => "replace_failed"
    }

    json {
      source  => "message"
      on_error => "not_json"
      array_function => "split_columns"
    }
    #temporary fix to discard an error message when deploying
    if [status] != "" {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    if [not_json] {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }

  # Adding kafka.offset to prevent duplicate events
    mutate {
      replace => {
        "about.resource.product_object_id" => "%{kafka_offset}"
      }
      on_error => "kafka_offset_failed"
    }

  # Regex to shorten date to first 10 digits
    mutate {
      gsub => [ "data.creationDate", ".{9}$", "" ]
    }

  # Date Parsing
    date {
      match   => [ "data.creationDate", "UNIX" ]
      on_error => "no_creation_date"
    }


  # UDM > Metadata
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "Swift"
        "event.idm.read_only_udm.metadata.product_name" => "Amh Sag"
        "event.idm.read_only_udm.metadata.product_version" => "1"
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
      on_error => "replace_failed"
    }

    # mrId key value mapping
    mutate {
      rename => {
        "data.mrId" => "mr_id"
      }
      on_error => "mr_id_rename_failed"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_deployment_id"  => "%{traceId}"
      }
      on_error => "no_trace_id"
    }

  ## sag-mr
    if [mr_id] == "sag-mr" or [mr_id] == "mex-sag-mr" {
      mutate {
        replace => {
          "timestamp" => ""
          "hostname" => ""
          "sag" => ""
          "event_number" => ""
          "event_severity" => ""
          "event_class" => ""
          "description" => ""
          "ldap_group" => ""
          "user" => ""
          "user_cn" => ""
          "user_HSM1" => ""
          "operator" => ""
          "sessionid" => ""
          "message_partner" => ""
        }
        on_error => "replace_failed"
      }

      grok {
        match => {
          "data.message" => [
            "%{SYSLOGTIMESTAMP:timestamp}\\s+%{HOSTNAME:hostname} .*Component: %{DATA:component}:%{DATA:sag}\\|.*: %{DATA:event_number}\\|.*: %{DATA:event_severity}\\|.*: %{DATA:event_class}\\|\\w+: %{DATA:description}$",
            "%{SYSLOGTIMESTAMP:timestamp}\\s+%{HOSTNAME:hostname} .*Sag:%{DATA:sag}\\|.*: %{DATA:event_number}\\|.*: %{DATA:event_severity}\\|.*: %{DATA:event_class}\\|\\w+: %{DATA:description}$"
          ]
        }
        on_error => "_malformed_sag_mr_grok"
        overwrite => ["hostname", "sag", "event_number", "event_severity", "event_class", "description","timestamp"]
      }
      mutate {
        replace => {
          "component_label.key" => "component"
          "component_label.value.string_value" => "%{component}"
        }
        on_error => "no_component"
      }
      if ![no_component] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "component_label"
          }
          on_error => "component_label_merge_failed"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type"       => "%{event_number}"
          "event.idm.read_only_udm.metadata.event_type"               => "STATUS_UPDATE"
          "sr.rule_name"                                              => "%{event_class}"
          "sr.severity_details"                                       => "%{event_severity}"
          "event.idm.read_only_udm.principal.hostname"                => "%{hostname}"
          "has_principal"                                            => "true"
          "sr.description"                                            => "%{description}"
        }
        on_error => "replace_failed"
      }

      if [event_severity] == "Severe" { mutate { replace => { "sr.severity" => "HIGH" }}}
      else if [event_severity] == "Warning" { mutate { replace => { "sr.severity" => "MEDIUM" }}}
      else if [event_severity] == "Information" { mutate { replace => { "sr.severity" => "INFORMATIONAL" }}}
      else { mutate { replace => { "sr.severity" => "LOW" }}}

      mutate {
        replace => {
          "aal.key"   => "SAG"
          "aal.value.string_value" => "%{sag}"
        }
        on_error => "replace_failed"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "aal"
        }
        on_error => "merge_failed"
      }

      grok {
        match => {
          "description" => [
            "User \\'%{DATA:user}\\': added by operator \\'%{USERNAME:operator}\\'\\. User is mapped to certificate \\'HSM1:%{DATA:user_HSM1}\\'"
            "group \\'%{DATA:ldap_group}\\'"
            "HSM1:%{DATA:user_HSM1}, DN cn=%{DATA:user_cn},"
            "User \\'%{DATA:user}\\'"
            "request sent for \\'{DATA:user}\\'"
            "User : %{DATA:user} Certificate : HSM1:%{DATA:user_HSM1} DN : cn=%{DATA:user_cn},"
            "User : %{DATA:user} Certificate : HSM1:%{DATA:user_HSM1}$"
            "operator \\'%{USERNAME:operator}\\' \\(session ID %{DATA:sessionid}\\). %{DATA:description_}\\).$"
            "Operator \\'%{USERNAME:operator}\\'.*"
            "Operator \\'%{USERNAME:operator}\\'.* \\(session ID %{DATA:sessionid}\\).$"
            "HSM1:%{DATA:user_HSM1}(\\s|$)"
            "cn=%{DATA:user_cn},"
            "user=%{DATA:user}$"
            "operator \\'%{USERNAME:operator}\\'"
            "message partner \\'%{GREEDYDATA:message_partner}\\'"
          ]
        }
        on_error => "_malformed_sag_mr_desc_grok"
        overwrite => ["ldap_group", "user_HSM1", "user_cn", "user", "operator", "sessionid", "message_partner"]
      }
      grok {
        match => {
          "description" => [
            "cn=%{DATA:user_cn},"
          ]
        }
        on_error => "_malformed_user_cn_grok"
        overwrite => [ "user_cn"]
      }
      if [timestamp] != "" and [mr_id] == "sag-mr" {
        date {
          match => ["timestamp", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
          rebase => true
          timezone => "Europe/Madrid"
          target => "event.idm.read_only_udm.metadata.collected_timestamp"
          on_error => "no_ts"
        }
      }
      if [message_partner] != "" {
        mutate {
          replace => {
