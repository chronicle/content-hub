      }
      grok {
        match => {
          "data.message" => [
          "%{TIMESTAMP_ISO8601:send_time}\\s+%{HOSTNAME:hostname}.*=\\s+%{DATA},.*=\\s+%{DATE:event_date},.*=\\s+%{TIME:event_time},.*=\\s+%{DATA},.*=\\s+%{DATA:product_event_type},.*=\\s+%{DATA:severity},.*=\\s+%{DATA},.*=\\s+%{DATA:summary},.*=\\s+Operator\\s+%{DATA:userid}\\s+:\\s+%{DATA:user_display_name},.*'%{IPV4:client}"
          "%{TIMESTAMP_ISO8601:send_time}\\s+%{HOSTNAME:hostname}.*=\\s+%{DATA},.*=\\s+%{DATE:event_date},.*=\\s+%{TIME:event_time},.*=\\s+%{DATA},.*=\\s+%{DATA:product_event_type},.*=\\s+%{DATA:severity},.*=\\s+%{DATA},.*=\\s+%{DATA:summary},.*=\\s+Operator\\s+\\[%{DATA:userid}\\]: %{DATA:metadata_description}.,.*=\\s%{DATA:product_object_id}$"
          "%{TIMESTAMP_ISO8601:send_time}\\s+%{HOSTNAME:hostname}.*=\\s+%{DATA},.*=\\s+%{DATE:event_date},.*=\\s+%{TIME:event_time},.*=\\s+%{DATA},.*=\\s+%{DATA:product_event_type},.*=\\s+%{DATA:severity},.*=\\s+%{DATA},.*=\\s+%{DATA:summary},.*=\\s+.*UUMID\\s+%{DATA:uumid}\\s+\\(.*=\\s+%{DATA:product_log_id}$"
          "%{TIMESTAMP_ISO8601:send_time}\\s+%{HOSTNAME:hostname}.*=\\s+%{DATA},.*=\\s+%{DATE:event_date},.*=\\s+%{TIME:event_time},.*=\\s+%{DATA},.*=\\s+%{DATA:product_event_type},.*=\\s+%{DATA:severity},.*=\\s+%{DATA},.*=\\s+%{DATA:summary},.*=\\s+Operator\\s+%{DATA:userid} %{DATA}.,.*=\\s%{DATA:product_object_id}$"
          ]
        }
        on_error => "malformed_grok_ven"
        overwrite => ["send_time", "hostname", "userid", "client", "event_date","event_time", "severity", "user_display_name", "summary", "product_event_type", "metadata_description", "product_object_id", "uumid" ]
      }
      mutate {
