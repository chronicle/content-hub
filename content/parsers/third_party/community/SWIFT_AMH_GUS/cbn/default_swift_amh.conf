          "createdAt" => 'string'
        }
        on_error => "convert_failed"
      }
      mutate {
        gsub => [ "createdAt", ".{6}$", ""]
      }
      date {
        match  => [ "createdAt", "UNIX_MS", "UNIX" ]
        target => "event.idm.read_only_udm.metadata.collected_timestamp"
        on_error => "no_created_at"
      }
      if [operator] != "" {
        if [operator] =~ "administrator" {
          mutate {
            replace => {
              "event.idm.read_only_udm.src.user.userid" => "ADMIN"
