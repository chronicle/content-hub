          }
          on_error => "replace_failed"
        }
      }
      mutate {
        rename => {
          "sessionid" => "event.idm.read_only_udm.network.session_id"
        }
        on_error => "sessionid_rename_failed"
      }
      if [user_cn] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid"                => "%{user_cn}"
            "event.idm.read_only_udm.target.user.user_display_name"     => "%{user_HSM1}"
            "has_user_data" => "true"
          }
          on_error => "replace_failed"
        }
      }
      else if [user_HSM1] != "" {
