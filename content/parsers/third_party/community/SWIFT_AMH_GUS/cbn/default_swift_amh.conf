          match => {
            "description" => ["An error occurred during execution of rule sequence: %{GREEDYDATA:exception}: The message is not valid: Value '%{DATA:invalid_value}' of type '%{DATA:value_type}' does not match pattern: '%{GREEDYDATA:pattern}'"]
          }
          on_error => "grok_error"
        }
        if ![grok_error] {
          mutate {
            replace => {
