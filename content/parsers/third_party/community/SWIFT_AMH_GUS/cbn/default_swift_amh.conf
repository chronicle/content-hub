          replace => {
            "event.idm.read_only_udm.target.user.userid"    => "%{user_HSM1}"
            "has_user_data" => "true"
          }
          on_error => "user_HSM1_replace_failed"
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid"    => "UNKNOWN"
            "has_user_data" => "true"
          }
          on_error => "replace_failed"
        }
      }
      if [event_number] == "14" {
        mutate {
          replace => {
            "sr.summary"                                          => "Database integrity check"
            "event.idm.read_only_udm.metadata.description"        => "A database integrity check was performed: SAG database integrity verification successful"
