      else if [sag] == "AMH-RUL-00010" {
        grok {
          match => {
            "data.message" => "\\[%{DATA:thread_info}\\]\\s+%{WORD:severity}\\s+%{DATA:logger}\\s+-\\s+%{DATA:product_event_id}-%{DATA}\\s+%{GREEDYDATA:user_display_name}\\s+\\[%{DATA:sag}\\]\\s+%{GREEDYDATA:description}"
