            match => [ "ts", "yyyy-MM-dd HH:mm:ss.SSS"]
            target => "@timestamp"
            on_error => "no_send_time"
          }
        }
        if [hostname] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
              "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
              "has_principal" => "true"
            }
            on_error => "no_hostname"
          }
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
            }
          }
        }
      }
      else {
        drop {
          tag => "TAG_MALFORMED_MESSAGE"
        }
      }
    }


  # ==== DATA ====

    if [mr_id] != "" {
      mutate {
        replace => {
           "mr.key"   => "mrId"
           "mr.value.string_value" => "%{mr_id}"
        }
        on_error => "replace_failed"
      }
    }


  # ==== DATA ====

  #  ==== DATA.PROPERTIES ====

      mutate {
          uppercase => [ "data.properties._os.str" ]
        }

      mutate {
          convert => {
            "data.properties._file_size.number"   => "uinteger"
            "data.properties._file_offset.number" => "string"
        }
      }

      mutate {
        rename => {
              "data.properties._file_path.str"            => "Intermediary.file.full_path"
              "data.properties._file_size.number"         => "Intermediary.file.size"
              "data.properties._file_offset.number"       => "Intermediary.resource.product_object_id"
              "data.properties._os.str"                   => "Intermediary.platform"
              "data.properties.geography.str"             => "Intermediary.location.country_or_region"
              "data.properties._hostname.str"             => "Intermediary.hostname"
        }
        on_error => "rename_failed"
      }

  #  ==== DATA.PROPERTIES ====
      if [data][properties][_file_inode][str] != "" {
        mutate {
          replace => {
            "str_label.value" => "%{data.properties._file_inode.str}"
          }
          on_error => "no_file_inode"
        }
        if ![no_file_inode] {
          mutate {
            replace => {
              "str_label.key" => "_FILE_INODE_STR"
            }
          }
          mutate {
            merge => {
              "Intermediary.resource.attribute.labels" => "str_label"
            }
            on_error => "not_file_inode_merge"
          }
        }
      }
      if [data][properties][_ecs_agent_version][str] != "" {
        mutate {
          replace => {
            "version_str_label.value" => "%{data.properties._ecs_agent_version.str}"
          }
          on_error => "no_ecs_agent_version"
        }
        if ![no_ecs_agent_version] {
          mutate {
            replace => {
              "version_str_label.key" => "ECS_AGENT_VERSION_STR"
            }
          }
          mutate {
            merge => {
              "Intermediary.resource.attribute.labels" => "version_str_label"
            }
            on_error => "not_ecs_agent_version_merge"
          }
        }
      }
      if [parentSpanId] != "" {
        mutate {
          replace => {
            "parentSpanId_label.value" => "%{parentSpanId}"
          }
          on_error => "parentSpanId_label_replace_failed"
        }
        if ![parentSpanId_label_replace_failed] {
          mutate {
            replace => {
              "parentSpanId_label.key" => "parentSpanId"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "parentSpanId_label"
            }
            on_error => "parentSpanId_label_merge_failed"
          }
        }
      }
      mutate {
        convert => {
          "offset" => "string"
        }
        on_error => "offset_convert_failed"
      }
      if [offset] != "" {
        mutate {
          replace => {
            "offset_label.value" => "%{offset}"
          }
          on_error => "offset_label_replace_failed"
        }
        if ![offset_label_replace_failed] {
          mutate {
            replace => {
              "offset_label.key" => "offset"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "offset_label"
            }
            on_error => "offset_label_merge_failed"
          }
        }
      }
      if [data][level] == "INFO" {
        mutate {
          replace => {
            "sr.severity" => "INFORMATIONAL"
          }
        }
      }
      else {
        mutate {
          replace => {
            "sr.severity" => "UNKNOWN_SEVERITY"
          }
        }
      }
      if [_id] != "" {
        mutate {
          replace => {
            "_id_label.value.string_value" => "%{_id}"
          }
          on_error => "_id_label_replace_failed"
        }
        if ![_id_label_replace_failed] {
          mutate {
            replace => {
              "_id_label.key" => "_id"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "_id_label"
            }
            on_error => "_id_label_merge_failed"
          }
        }
      }
      date {
        match  => [ "data.creationDate", "UNIX" ]
        target => "event.idm.read_only_udm.principal.asset.creation_time"
        on_error => "no_data_creation_date"
      }
      if [data][spanId] != "" {
        mutate {
          replace => {
            "spanId_label.value" => "%{data.spanId}"
          }
          on_error => "spanId_label_replace_failed"
        }
        if ![spanId_label_replace_failed] {
          mutate {
            replace => {
              "spanId_label.key" => "spanId"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "spanId_label"
            }
            on_error => "spanId_label_merge_failed"
          }
        }
      }
      if [data][traceId] != "" {
        mutate {
          replace => {
            "traceId_label.value" => "%{data.traceId}"
          }
          on_error => "traceId_label_replace_failed"
        }
        if ![traceId_label_replace_failed] {
          mutate {
            replace => {
              "traceId_label.key" => "traceId"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "traceId_label"
            }
            on_error => "traceId_label_merge_failed"
          }
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "mr"
        }
        on_error => "merge_failed"
      }

      if [sr] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "sr"
          }
          on_error => "merge_failed"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "Intermediary"
        }
        on_error => "merge_failed"
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about"
        }
        on_error => "merge_failed"
      }
      mutate {
        replace => {
          "event_type" => "%{event.idm.read_only_udm.metadata.event_type}"
        }
        on_error => "replace_failed"
      }
    }
    if [event][idm][read_only_udm][metadata][event_type] == "GENERIC_EVENT" {
      if [has_principal] == "true" and [has_target] == "true" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
          }
        }
      }
      else if [has_principal] == "true" and [has_target] == "false" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
}
