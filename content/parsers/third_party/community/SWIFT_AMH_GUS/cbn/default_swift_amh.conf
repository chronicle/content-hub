              "value_type_label.key" => "value_type"
              "value_type_label.value.string_value" => "%{value_type}"
            }
            on_error => "value_type_replace_failed"
          }
          if ![value_type_replace_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "value_type_label"
              }
              on_error => "value_type_merge_failed"
            }
          }
          mutate {
            replace => {
              "pattern_label.key" => "pattern"
              "pattern_label.value.string_value" => "%{pattern}"
            }
            on_error => "pattern_replace_failed"
          }
          if ![pattern_replace_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "pattern_label"
              }
              on_error => "pattern_merge_failed"
            }
          }
        }
        if [thread_info] != "" {
          mutate {
            replace => {
              "thread_info_label.key" => "thread_info"
              "thread_info_label.value.string_value" => "%{thread_info}"
            }
            on_error => "thread_info_replace_failed"
          }
