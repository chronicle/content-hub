          if ![product_event_id_replace_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "product_event_id_label"
              }
              on_error => "product_event_id_merge_failed"
            }
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
