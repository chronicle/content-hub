      }
    }
  ## mex-amh-mr || amh-mr
    if [mr_id] == "mex-amh-mr" or [mr_id] == "amh-mr" {
      mutate {
        replace => {
          "act"   => ""
          "sag"   => ""
        }
        on_error => "replace_failed"
      }
      grok {
        match => {
          "data.message"  => [
            "%{TIMESTAMP_ISO8601:when}\\s+\\[%{DATA}]\\s+%{WORD:severity}\\s+%{DATA}\\s+-\\s+(%{DATA}-(?P<ts>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}T%{TIME})\\s+%{DATA:target_display_name}\\s+)?\\[%{DATA:sag}\\]\\s+%{DATA:description}$"
          ]
        }
        overwrite => [ "sag" ]
        on_error => "grok_error_mex_amh_mr"
      }
      if [mr_id] == "mex-amh-mr" {
        date {
          match => [ "when", "yyyy-MM-dd HH:mm:ss,SSS"]
          target => "@timestamp"
          timezone => "America/Mexico_City"
          on_error => "no_when"
        }
      }
      else {
        date {
          match => [ "when", "yyyy-MM-dd HH:mm:ss,SSS"]
          target => "@timestamp"
          timezone => "Europe/Madrid"
          on_error => "no_when"
        }
      }

      mutate {
        gsub => ["ts", "T", " "]
      }
      if [mr_id] == "mex-amh-mr" {
        date {
          match => [ "ts", "yyyy-MM-dd HH:mm:ss"]
          timezone => "America/Mexico_City"
          target => "event.idm.read_only_udm.metadata.collected_timestamp"
          on_error => "no_ts"
        }
      }
      else {
        date {
          match => [ "ts", "yyyy-MM-dd HH:mm:ss"]
          timezone => "Europe/Madrid"
          target => "event.idm.read_only_udm.metadata.collected_timestamp"
          on_error => "no_ts"
        }
      }

  #   Date Parsing
      date {
        match  => [ "data.creationDate", "UNIX" ]
        target => "event.idm.read_only_udm.principal.asset.creation_time"
        on_error => "no_creationDate"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.user_display_name" => "%{target_display_name}"
        }
        on_error => "no_target_display_name"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id"   => "%{sag}"
        }
        on_error => "no_sag"
      }

