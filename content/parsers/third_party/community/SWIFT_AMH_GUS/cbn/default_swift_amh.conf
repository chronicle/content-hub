            "sr.action" => "act"
          }
          on_error => "replace_failed"
        }
      }
      if [event_number] == "3010" {
        mutate {
          replace => {
            "sr.summary" => "Invalid SWIFTNet User"
            "event.idm.read_only_udm.metadata.description" => "The 'CreateSecurityContext' request failed"
