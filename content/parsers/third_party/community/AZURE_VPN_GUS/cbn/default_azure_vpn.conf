# Product: AZURE_VPN
# Category: VPN
# Supported Format: JSON
# Reference: https://learn.microsoft.com/en-us/azure/vpn-gateway/troubleshoot-vpn-with-azure-diagnostics
# Last Updated: 2024-10-11
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "time" => ""
      "operationName" => ""
      "security_result" => ""
      "category" => ""
      "properties.message" => ""
      "resourceid" => ""
      "remote_ip" => ""
      "remote_port" => ""
      "local_ip" => ""
      "local_port" => ""
      "desc2" => ""
      "kv_data2" => ""
      "IV_VER" => ""
      "IV_PLAT" => ""
      "IV_PROTO" => ""
      "IV_PLAT_VER" => ""
      "ClientOperationId" => ""
      "CorrelationRequestId" => ""
      "GatewayManagerVersion" => ""
      "properties.gatewayTunnelProtocol" => ""
      "properties.instance" => ""
      "properties.isNATed" => ""
      "properties.stateChangeReason" => ""
      "properties.status" => ""
      "properties.tunnelType" => ""
      "properties.remoteIP" => ""
      "properties.ikeSAs.Dhgroup" => ""
      "properties.ikeSAs.IkeEncryption" => ""
      "properties.ikeSAs.IkeIntegrity" => ""
      "properties.ikeSAs.InitiatorCookie" => ""
      "properties.ikeSAs.IsSaInitiator" => ""
      "properties.ikeSAs.LifeTimeSeconds" => ""
      "properties.ikeSAs.LocalEndpoint" => ""
      "properties.ikeSAs.LocalUdpEncapsulationPort" => ""
      "properties.ikeSAs.MigratedSa" => ""
      "properties.ikeSAs.RemoteEndpoint" => ""
      "properties.ikeSAs.RemoteUdpEncapsulationPort" => ""
      "properties.ikeSAs.ResponderCookie" => ""
      "properties.ikeSAs.RoutingDomainName" => ""
      "intermediary" => ""
      "level" => ""
      "properties.ikeSAs.Qms" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [time] != "" {
    date {
      match => ["time", "RFC3339"]
    }
  }

  if [operationName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{operationName}"
      }
    }
  }

  if [category] != "" {
    mutate {
      replace => {
        "sec_result_category_details" => "%{category}"
      }
    }
    mutate {
      merge => {
        "security_result.category_details" => "sec_result_category_details"
      }
    }
  }

  if [properties][message] != "" {
    mutate {
      replace => {
        "kv_data" => ""
      }
    }
    grok {
      match => {
        "properties.message" => [
                                "\\[%{DATA:desc}\\] Remote %{IP:remote_ip}:%{INT:remote_port}: Local %{IP:local_ip}:%{INT:local_port}: %{DATA} : %{DATA} : %{DATA:IKE_version} ; %{GREEDYDATA:kv_data}",
                                "SESSION_ID :\\{%{DATA:session_id}\\} Remote %{IP:remote_ip}:%{INT:remote_port}: Local %{IP:local_ip}:%{INT:local_port}: %{GREEDYDATA:desc}",
                                "\\[PKT] \\[%{DATA:default} \\[%{DATA}\\] %{DATA:desc} %{DATA:desc2} %{GREEDYDATA:kv_data2}",
                                "\\[MSG] \\[%{DATA:default} \\[%{DATA}\\] %{DATA:desc} => %{GREEDYDATA:kv_data2}",
                                "SESSION_ID :\\{%{DATA:session_id}\\} %{GREEDYDATA:desc}"
                                ]
      }
      overwrite => ["desc","IKE_version","kv_data","session_id","remote_ip","remote_port","local_ip","local_port","desc2","kv_data2"]
      on_error => "grok_fail"
    }
    if ![grok_fail] {
      if [kv_data] != "" {
        kv {
          source => "kv_data"
          value_split => ":"
          field_split => ";"
        }
      }

      if [kv_data2] != "" {
        kv {
          source => "kv_data2"
          value_split => "="
          field_split => " "
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{desc}"
        }
      }

      if [desc] != "" and [desc2] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{desc} %{desc2}"
          }
        }
      }

      if [remote_ip] != "" and [local_ip] != "" {
        mutate {
          merge => {
              "principal.ip"=> "remote_ip"
              "target.ip" => "local_ip"
          }
        }
      }

      if [local_port] != "" and [remote_port] != "" {
        mutate {
          replace => {
            "target.port" => "%{local_port}"
            "principal.port" => "%{remote_port}"
          }
          convert => {
            "target.port" => "integer"
            "principal.port" => "integer"
          }
        }
      }
    }
  }

  if [level] == "Informational" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }

  if [IV_VER] != "" {
    mutate {
      replace => {
        "iv_ver.key" => "IV_VER"
        "iv_ver.value" => "%{IV_VER}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "iv_ver"
      }
    }
  }

  if [IV_PLAT] != "" {
    mutate {
      replace => {
        "iv_plat.key" => "IV_PLAT"
        "iv_plat.value" => "%{IV_PLAT}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "iv_plat"
      }
    }
  }

  if [IV_PROTO] != "" {
    mutate {
      replace => {
        "iv_proto.key" => "IV_PROTO"
        "iv_proto.value" => "%{IV_PROTO}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "iv_proto"
      }
    }
  }

  if [IV_PLAT_VER] != "" {
    mutate {
      replace => {
        "iv_plat_ver.key" => "IV_PLAT_VER"
        "iv_plat_ver.value" => "%{IV_PLAT_VER}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "iv_plat_ver"
      }
    }
  }

  if [resourceid] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{resourceid}"
      }
    }
  }

  if [ClientOperationId] != "" {
    mutate {
      replace => {
        "client_operation_id_label.key" => "ClientOperationId"
        "client_operation_id_label.value.string_value" => "%{ClientOperationId}"
      }
      on_error => "client_operation_id_label_fail"
    }
    if ![client_operation_id_label_fail] {
      mutate {
        merge => {
          "additional.fields" => "client_operation_id_label"
        }
        on_error => "client_operation_id_label_merge_fail"
      }
    }
  }

  if [CorrelationRequestId] != "" {
    mutate {
      replace => {
        "correlation_request_id_label.key" => "CorrelationRequestId"
        "correlation_request_id_label.value.string_value" => "%{CorrelationRequestId}"
      }
      on_error => "correlation_request_id_label_fail"
    }
    if ![correlation_request_id_label_fail] {
      mutate {
        merge => {
          "additional.fields" => "correlation_request_id_label"
        }
        on_error => "correlation_request_id_label_merge_fail"
      }
    }
  }

  if [GatewayManagerVersion] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "GatewayManagerVersion"
        "intermediary.asset.ip" => "GatewayManagerVersion"
      }
      on_error => "gateway_manager_version_fail"
    }
  }

  if [properties][gatewayTunnelProtocol] != "" {
    mutate {
      replace => {
        "gateway_tunnel_protocol.key" => "gatewayTunnelProtocol"
        "gateway_tunnel_protocol.value" => "%{properties.gatewayTunnelProtocol}"
      }
      on_error => "gateway_tunnel_protocol_fail"
    }
    if ![gateway_tunnel_protocol_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "gateway_tunnel_protocol"
        }
        on_error => "gateway_tunnel_protocol_merge_fail"
      }
    }
  }

  if [properties][instance] != "" {
    mutate {
      replace => {
        "instance.key" => "instance"
        "instance.value" => "%{properties.instance}"
      }
      on_error => "instance_fail"
    }
    if ![instance_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "instance"
        }
        on_error => "instance_merge_fail"
      }
    }
  }

  if [properties][isNATed] != "" {
    mutate {
      convert => {
        "[properties][isNATed]" => "string"
      }
      on_error => "is_natted_convert_fail"
    }
    mutate {
      replace => {
        "is_natted.key" => "isNATed"
        "is_natted.value" => "%{properties.isNATed}"
      }
      on_error => "is_natted_fail"
    }
    if ![is_natted_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "is_natted"
        }
        on_error => "is_natted_merge_fail"
      }
    }
  }
  if [properties][stateChangeReason] != "" {
    mutate {
      replace => {
        "state_change_reason.key" => "stateChangeReason"
        "state_change_reason.value" => "%{properties.stateChangeReason}"
      }
      on_error => "state_change_reason_fail"
    }
    if ![state_change_reason_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "state_change_reason"
        }
        on_error => "state_change_reason_invalid_fail"
      }
    }
  }
  if [properties][status] != "" {
    mutate {
      replace => {
        "status.key" => "status"
        "status.value" => "%{properties.status}"
      }
      on_error => "status_fail"
    }
    if ![status_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "status"
        }
        on_error => "status_merge_fail"
      }
    }
  }

  if [properties][tunnelType] != "" {
    mutate {
      replace => {
        "tunnel_type.key" => "tunnelType"
        "tunnel_type.value" => "%{properties.tunnelType}"
      }
      on_error => "tunnel_type_fail"
    }
    if ![tunnel_type_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "tunnel_type"
        }
        on_error => "tunnel_type_merge_fail"
      }
    }
  }

  if [properties][remoteIP] != "" {
    mutate {
      merge => {
        "target.ip" => "properties.remoteIP"
        "target.asset.ip" => "properties.remoteIP"
      }
      on_error => "remote_ip_fail"
    }
  }
  else if [properties][ikeSAs][RemoteEndpoint] != "" {
    mutate {
      replace => {
        "target.ip" => "properties.ikeSAs.RemoteEndpoint"
        "target.asset.ip" => "properties.ikeSAs.RemoteEndpoint"
      }
      on_error => "remote_endpoint_fail"
    }
  }

  if [properties][ikeSAs][Dhgroup] != "" {
    mutate {
      replace => {
        "ike_dhgroup.key" => "Dhgroup"
        "ike_dhgroup.value" => "%{properties.ikeSAs.Dhgroup}"
      }
      on_error => "ike_dhgroup_fail"
    }
    if ![ike_dhgroup_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ike_dhgroup"
        }
        on_error => "ike_dhgroup_merge_fail"
      }
    }
  }

  if [properties][ikeSAs][IkeEncryption] != "" and
  [properties][ikeSAs][IkeIntegrity] != "" {
    mutate {
      replace => {
        "network.tls.cipher" => "%{properties.ikeSAs.IkeEncryption}-%{properties.ikeSAs.IkeIntegrity}"
      }
      on_error => "ike_encryption_fail"
    }
  }

  if [properties][ikeSAs][InitiatorCookie] != "" {
    mutate {
      convert => {
        "properties.ikeSAs.InitiatorCookie" => "string"
      }
      on_error => "initiator_cookie_convert_fail"
    }
    mutate {
      replace => {
        "initiator_cookie.key" => "InitiatorCookie"
        "initiator_cookie.value" => "%{properties.ikeSAs.InitiatorCookie}"
      }
      on_error => "initiator_cookie_fail"
    }
    if ![initiator_cookie_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "initiator_cookie"
        }
        on_error => "initiator_cookie_merge_failed"
      }
    }
  }

  if [properties][ikeSAs][IsSaInitiator] != "" {
    mutate {
      convert => {
        "properties.ikeSAs.IsSaInitiator" => "string"
      }
      on_error => "is_sa_initiator_convert_fail"
    }
    mutate {
      replace => {
        "is_sa_initiator.key" => "IsSaInitiator"
        "is_sa_initiator.value.string_value" => "%{properties.ikeSAs.IsSaInitiator}"
      }
      on_error => "is_sa_initiator_fail"
    }
    if ![is_sa_initiator_fail] {
      mutate {
        merge => {
          "additional.fields" => "is_sa_initiator"
        }
        on_error => "is_sa_initiator_merge_failed"
      }
    }
  }

  if [properties][ikeSAs][LifeTimeSeconds] != "" {
    mutate {
      convert => {
        "properties.ikeSAs.LifeTimeSeconds" => "string"
      }
      on_error => "life_time_seconds_convert_fail"
    }
    mutate {
      replace => {
        "life_time_seconds.key" => "LifeTimeSeconds"
        "life_time_seconds.value.string_value" => "%{properties.ikeSAs.LifeTimeSeconds}"
      }
      on_error => "life_time_seconds_fail"
    }
    if ![life_time_seconds_fail] {
      mutate {
        merge => {
          "additional.fields" => "life_time_seconds"
        }
        on_error => "life_time_seconds_merge_failed"
      }
    }
  }

  if [properties][ikeSAs][LocalEndpoint] != "" {
    mutate {
      merge => {
        "principal.asset.ip" => "properties.ikeSAs.LocalEndpoint"
        "principal.ip" => "properties.ikeSAs.LocalEndpoint"
      }
      on_error => "local_endpoint_fail"
    }
  }

  if [properties][ikeSAs][LocalUdpEncapsulationPort] != "" {
    mutate {
      convert => {
        "properties.ikeSAs.LocalUdpEncapsulationPort" => "string"
      }
      on_error => "local_udp_encapsulation_port_convert_fail"
    }
    mutate {
      replace => {
        "local_udp_encapsulation_port.key" => "LocalUdpEncapsulationPort"
        "local_udp_encapsulation_port.value.string_value" => "%{properties.ikeSAs.LocalUdpEncapsulationPort}"
      }
      on_error => "local_udp_encapsulation_port_fail"
    }
    if ![local_udp_encapsulation_port_fail] {
      mutate {
        merge => {
          "additional.fields" => "local_udp_encapsulation_port"
        }
        on_error => "local_udp_encapsulation_port_merge_failed"
      }
    }
  }

  if [properties][ikeSAs][MigratedSa] != "" {
    mutate {
      convert => {
        "properties.ikeSAs.MigratedSa" => "string"
      }
      on_error => "migrated_sa_convert_fail"
    }
    mutate {
      replace => {
        "migrated_sa.key" => "MigratedSa"
        "migrated_sa.value.string_value" => "%{properties.ikeSAs.MigratedSa}"
      }
      on_error => "migrated_sa_fail"
    }
    if ![migrated_sa_fail] {
      mutate {
        merge => {
          "additional.fields" => "migrated_sa"
        }
        on_error => "migrated_sa_merge_failed"
      }
    }
  }
  if [properties][ikeSAs][RemoteUdpEncapsulationPort] != "" {
    mutate {
      convert => {
        "properties.ikeSAs.RemoteUdpEncapsulationPort" => "string"
      }
      on_error => "remote_udp_encapsulation_port_convert_fail"
    }
    mutate {
      replace => {
        "remote_udp_encapsulation_port.key" => "RemoteUdpEncapsulationPort"
        "remote_udp_encapsulation_port.value.string_value" => "%{properties.ikeSAs.RemoteUdpEncapsulationPort}"
      }
      on_error => "remote_udp_encapsulation_port_fail"
    }
    if ![remote_udp_encapsulation_port_fail] {
      mutate {
        merge => {
          "additional.fields" => "remote_udp_encapsulation_port"
        }
        on_error => "remote_udp_encapsulation_port_merge_failed"
      }
    }
  }

  if [properties][ikeSAs][ResponderCookie] != "" {
    mutate {
      convert => {
        "properties.ikeSAs.ResponderCookie" => "string"
      }
      on_error => "responder_cookie_convert_fail"
    }
    mutate {
      replace => {
        "responder_cookie.key" => "ResponderCookie"
        "responder_cookie.value" => "%{properties.ikeSAs.ResponderCookie}"
      }
      on_error => "responder_cookie_fail"
    }
    if ![responder_cookie_fail] {
      mutate {
        merge => {
          "security_result.detection_fields" => "responder_cookie"
        }
        on_error => "responder_cookie_merge_failed"
      }
    }
  }

  if [properties][ikeSAs][RoutingDomainName] != "" {
    mutate {
      replace => {
        "principal.asset.hostname" => "%{properties.ikeSAs.RoutingDomainName}"
        "principal.hostname" => "%{properties.ikeSAs.RoutingDomainName}"
      }
      on_error => "routing_domain_name_fail"
    }
  }

  if [properties][ikeSAs][Qms] != "" {
    mutate {
      replace => {
        "QmsData" => ""
      }
    }
    for QmsData in [properties][ikeSAs][Qms] {
      if [QmsData][CipherAlgorithm] != "" {
        mutate {
          replace => {
            "cipher_algorithm_label.key" => "CipherAlgorithm"
            "cipher_algorithm_label.value" => "%{QmsData.CipherAlgorithm}"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "cipher_algorithm_label"
          }
          on_error => "cipher_algorithm_label_merge_failed"
        }
      }
      if [QmsData][ElapsedTimeInseconds] != "" {
        mutate {
          convert => {
            "QmsData.ElapsedTimeInseconds" => "string"
          }
          on_error => "elapsed_time_in_seconds_convert_fail"
        }
        mutate {
          replace => {
            "elapsed_time_in_seconds.key" => "ElapsedTimeInseconds"
            "elapsed_time_in_seconds.value.string_value" => "%{QmsData.ElapsedTimeInseconds}"
          }
          on_error => "elapsed_time_in_seconds_fail"
        }
        if ![elapsed_time_in_seconds_fail] {
          mutate {
            merge => {
              "additional.fields" => "elapsed_time_in_seconds"
            }
            on_error => "elapsed_time_in_seconds_merge_failed"
          }
        }
      }
      if [QmsData][IdleDurationSeconds] != "" {
        mutate {
          convert => {
            "QmsData.IdleDurationSeconds" => "string"
          }
          on_error => "idle_duration_seconds_convert_fail"
        }
        mutate {
          replace => {
            "idle_duration_seconds.key" => "IdleDurationSeconds"
            "idle_duration_seconds.value.string_value" => "%{QmsData.IdleDurationSeconds}"
          }
          on_error => "idle_duration_seconds_fail"
        }
        if ![idle_duration_seconds_fail] {
          mutate {
            merge => {
              "additional.fields" => "idle_duration_seconds"
            }
            on_error => "idle_duration_seconds_merge_failed"
          }
        }
      }
      if [QmsData][IntegrityAlgorithm] != "" {
        mutate {
          replace => {
            "integrity_algorithm_label.key" => "IntegrityAlgorithm"
            "integrity_algorithm_label.value" => "%{QmsData.IntegrityAlgorithm}"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "integrity_algorithm_label"
          }
          on_error => "integrity_algorithm_label_merge_failed"
        }
      }
      if [QmsData][LifetimeKilobytes] != "" {
        mutate {
          convert => {
            "QmsData.LifetimeKilobytes" => "string"
          }
          on_error => "lifetime_kilobytes_convert_fail"
        }
        mutate {
          replace => {
            "lifetime_kilobytes.key" => "LifetimeKilobytes"
            "lifetime_kilobytes.value.string_value" => "%{QmsData.LifetimeKilobytes}"
          }
          on_error => "lifetime_kilobytes_fail"
        }
        if ![lifetime_kilobytes_fail] {
          mutate {
            merge => {
              "additional.fields" => "lifetime_kilobytes"
            }
            on_error => "lifetime_kilobytes_merge_failed"
          }
        }
      }
      if [QmsData][OutboundSPI] != "" {
        mutate {
          convert => {
            "QmsData.OutboundSPI" => "string"
          }
          on_error => "outbound_spi_convert_fail"
        }
        mutate {
          replace => {
            "outbound_spi.key" => "OutboundSPI"
            "outbound_spi.value.string_value" => "%{QmsData.OutboundSPI}"
          }
          on_error => "outbound_spi_fail"
        }
        if ![outbound_spi_fail] {
          mutate {
            merge => {
              "additional.fields" => "outbound_spi"
            }
            on_error => "outbound_spi_merge_failed"
          }
        }
      }
      if [QmsData][PfsGroupId] != "" {
        mutate {
          replace => {
            "pfs_group_id.key" => "PfsGroupId"
            "pfs_group_id.value.string_value" => "%{QmsData.PfsGroupId}"
          }
          on_error => "pfs_group_id_fail"
        }
        if ![pfs_group_id_fail] {
          mutate {
            merge => {
              "additional.fields" => "pfs_group_id"
            }
            on_error => "pfs_group_id_merge_failed"
          }
        }
      }
      if [QmsData][Tsi] != "" {
        mutate {
          replace => {
            "tsi_list.value" => ""
            "tsiData" => ""
          }
        }
        for tsiData in [QmsData][Tsi] {
          mutate {
            replace => {
              "tsi_label" => ""
            }
          }
          mutate {
            replace => {
              "tsi_label.string_value" => "%{tsiData}"
            }
            on_error => "tsi_label_failed"
          }
          mutate {
            merge => {
              "tsi_list.value.list_value.values" => "tsi_label"
            }
            on_error => "tsi_list_label_merge_failed"
          }
        }
        if [tsi_list][value] != "" {
          mutate {
            replace => {
              "tsi_list.key" => "Qms_Tsi"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "tsi_list"
            }
            on_error => "tsi_list_merge_failed"
          }
        }
      }
      if [QmsData][Tsr] != "" {
        mutate {
          replace => {
            "tsr_list.value" => ""
            "tsrData" => ""
          }
        }
        for tsrData in [QmsData][Tsr] {
          mutate {
            replace => {
              "tsr_label" => ""
            }
          }
          mutate {
            replace => {
              "tsr_label.string_value" => "%{tsrData}"
            }
            on_error => "tsr_label_failed"
          }
          mutate {
            merge => {
              "tsr_list.value.list_value.values" => "tsr_label"
            }
            on_error => "tsr_list_label_merge_failed"
          }
        }
        if [tsr_list][value] != "" {
          mutate {
            replace => {
              "tsr_list.key" => "Qms_Tsr"
            }
          }
          mutate {
            merge => {
              "additional.fields" => "tsr_list"
            }
            on_error => "tsr_list_merge_failed"
          }
        }
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "AZURE"
      "event.idm.read_only_udm.metadata.product_name" => "VPN"
      "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      "event.idm.read_only_udm.extensions.auth.type" => "VPN"
    }
  }

  if [remote_ip] != "" and [local_ip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "network" => "event.idm.read_only_udm.network"
      "additional" => "event.idm.read_only_udm.additional"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
