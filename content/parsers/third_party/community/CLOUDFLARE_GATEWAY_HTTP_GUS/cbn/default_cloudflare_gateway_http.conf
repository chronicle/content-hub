# Product: Cloudflare Gateway HTTP
# Category: SaaS Applications
# Supported Format: JSON
# Last Updated: 2026-10-23
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "AccountID" => ""
      "Action" => ""
      "ApplicationStatuses" => ""
      "BlockedFileHash" => ""
      "BlockedFileName" => ""
      "BlockedFileReason" => ""
      "BlockedFileSize" => ""
      "BlockedFileType" => ""
      "CategoryNames" => ""
      "Datetime" => ""
      "DestinationIP" => ""
      "DestinationIPCountryCode" => ""
      "DestinationPort" => ""
      "DeviceID" => ""
      "DeviceName" => ""
      "DownloadedFileNames" => ""
      "Email" => ""
      "FileInfo.files" => ""
      "ForensicCopyStatus" => ""
      "HTTPHost" => ""
      "HTTPMethod" => ""
      "HTTPStatusCode" => ""
      "HTTPVersion" => ""
      "IsIsolated" => ""
      "Offramp" => ""
      "Onramp" => ""
      "PolicyID" => ""
      "PolicyName" => ""
      "Quarantined" => ""
      "Referer" => ""
      "RegistrationID" => ""
      "RequestID" => ""
      "SessionID" => ""
      "SourceIP" => ""
      "SourceIPCountryCode" => ""
      "SourceInternalIP" => ""
      "SourcePort" => ""
      "URL" => ""
      "UntrustedCertificateAction" => ""
      "UploadedFileNames" => ""
      "UserAgent" => ""
      "UserID" => ""
      "VirtualNetworkName" => ""
      "is_http" => "false"
      "has_principal" => "false"
      "has_principal_user" => "false"
      "has_target" => "false"
      "has_target_file" => "false"
      "has_target_app" => "false"
      "action_enum" => "UNKNOWN_ACTION"
      "security_result" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [Datetime] not in ["", "-"] {
    date {
      match => ["Datetime", "RFC3339", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_datetime"
    }
  }

  if [RequestID] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{RequestID}"
      }
      on_error => "no_request_id"
    }
  }

  mutate {
    rename => {
      "AccountID" => "addition.AccountID"
      "VirtualNetworkName" => "addition.VirtualNetworkName"
      "Onramp" => "addition.Onramp"
      "Offramp" => "addition.Offramp"
      "RegistrationID" => "addition.RegistrationID"
      "ForensicCopyStatus" => "addition.ForensicCopyStatus"
    }
  }

  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [_check] not in ["", "-"] {
      mutate {
        replace => {
          "_field.key" => "%{key}"
          "_field.value.string_value" => "%{value}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "_field"
        }
        on_error => "addition_merge_failed"
      }
    }
  }

  if [SourceIP] not in ["", "-"] {
    grok {
      match => {
        "SourceIP" => "%{IP:SourceIP}"
      }
      overwrite => ["SourceIP"]
      on_error => "invalid_source_ip"
    }
    if ![invalid_source_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "SourceIP"
          "event.idm.read_only_udm.principal.asset.ip" => "SourceIP"
        }
        on_error => "no_source_ip"
      }
      if ![no_source_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [SourceInternalIP] not in ["", "-"] {
    grok {
      match => {
        "SourceInternalIP" => "%{IP:SourceInternalIP}"
      }
      overwrite => ["SourceInternalIP"]
      on_error => "invalid_source_internal_ip"
    }
    if ![invalid_source_internal_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "SourceInternalIP"
          "event.idm.read_only_udm.principal.asset.ip" => "SourceInternalIP"
        }
        on_error => "no_source_internal_ip"
      }
      if ![no_source_internal_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [SourcePort] not in ["", "-"] {
    mutate {
      convert => {
        "SourcePort" => "string"
      }
      on_error => "source_port_already_string"
    }
    if [SourcePort] =~ "^[1-9][0-9]*$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{SourcePort}"
        }
        on_error => "no_source_port"
      }
      if ![no_source_port] {
        mutate {
          convert => {
            "event.idm.read_only_udm.principal.port" => "integer"
          }
          on_error => "source_port_not_integer"
        }
      }
    }
  }

  if [SourceIPCountryCode] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" =>
          "%{SourceIPCountryCode}"
      }
      on_error => "no_source_country"
    }
  }

  if [DeviceID] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.product_object_id" =>
          "%{DeviceID}"
      }
      on_error => "no_device_id"
    }
  }

  if [DeviceName] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{DeviceName}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{DeviceName}"
      }
      on_error => "no_device_name"
    }
    if ![no_device_name] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [Email] not in ["", "-"] {
    grok {
      match => {
        "Email" => "%{EMAILADDRESS:Email}$"
      }
      overwrite => ["Email"]
      on_error => "invalid_email"
    }
    if ![invalid_email] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "Email"
        }
        on_error => "no_email"
      }
      if ![no_email] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }
  }

  if [UserID] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{UserID}"
      }
      on_error => "no_user_id"
    }
    if ![no_user_id] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }

  if [SessionID] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{SessionID}"
      }
      on_error => "no_session_id"
    }
  }

  if [DestinationIP] not in ["", "-"] {
    grok {
      match => {
        "DestinationIP" => "%{IP:DestinationIP}"
      }
      overwrite => ["DestinationIP"]
      on_error => "invalid_dest_ip"
    }
    if ![invalid_dest_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "DestinationIP"
          "event.idm.read_only_udm.target.asset.ip" => "DestinationIP"
        }
        on_error => "no_dest_ip"
      }
      if ![no_dest_ip] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  if [DestinationPort] not in ["", "-"] {
    mutate {
      convert => {
        "DestinationPort" => "string"
      }
      on_error => "dest_port_already_string"
    }
    if [DestinationPort] =~ "^[1-9][0-9]*$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{DestinationPort}"
        }
        on_error => "no_dest_port"
      }
      if ![no_dest_port] {
        mutate {
          convert => {
            "event.idm.read_only_udm.target.port" => "integer"
          }
          on_error => "dest_port_not_integer"
        }
      }
    }
  }

  if [DestinationIPCountryCode] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" =>
          "%{DestinationIPCountryCode}"
      }
      on_error => "no_dest_country"
    }
  }

  if [HTTPHost] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{HTTPHost}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{HTTPHost}"
        "has_target" => "true"
      }
      on_error => "http_host_mapping_failed"
    }
  }

  if [URL] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{URL}"
      }
      on_error => "no_url"
    }
  }

  if [BlockedFileName] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{BlockedFileName}"
      }
      on_error => "no_blocked_file"
    }
    if ![no_blocked_file] {
      mutate {
        replace => {
          "has_target_file" => "true"
        }
      }
    }
  }

  if [BlockedFileHash] not in ["", "-"] {
    mutate {
      lowercase => ["BlockedFileHash"]
      on_error => "blocked_file_hash_not_string"
    }
    if ![blocked_file_hash_not_string] {
      if [BlockedFileHash] =~ "^[a-f0-9]{64}$" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.sha256" =>
              "%{BlockedFileHash}"
          }
          on_error => "no_blocked_file_sha256"
        }
        if ![no_blocked_file_sha256] {
          mutate {
            replace => {
              "has_target_file" => "true"
            }
          }
        }
      }
      if [BlockedFileHash] =~ "^[a-f0-9]{40}$" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.sha1" => "%{BlockedFileHash}"
          }
          on_error => "no_blocked_file_sha1"
        }
        if ![no_blocked_file_sha1] {
          mutate {
            replace => {
              "has_target_file" => "true"
            }
          }
        }
      }
      if [BlockedFileHash] =~ "^[a-f0-9]{32}$" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.md5" => "%{BlockedFileHash}"
          }
          on_error => "no_blocked_file_md5"
        }
        if ![no_blocked_file_md5] {
          mutate {
            replace => {
              "has_target_file" => "true"
            }
          }
        }
      }
    }
  }

  if [BlockedFileSize] not in ["", "-"] {
    mutate {
      convert => {
        "BlockedFileSize" => "string"
      }
      on_error => "blocked_file_size_already_string"
    }
    if [BlockedFileSize] =~ "^[1-9][0-9]*$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.size" => "%{BlockedFileSize}"
        }
        on_error => "no_blocked_file_size"
      }
      if ![no_blocked_file_size] {
        mutate {
          convert => {
            "event.idm.read_only_udm.target.file.size" => "uinteger"
          }
          on_error => "blocked_file_size_not_uint"
        }
        if ![blocked_file_size_not_uint] {
          mutate {
            replace => {
              "has_target_file" => "true"
            }
          }
        }
      }
    }
  }

  if [BlockedFileType] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.mime_type" => "%{BlockedFileType}"
      }
      on_error => "no_blocked_file_type"
    }
    if ![no_blocked_file_type] {
      mutate {
        replace => {
          "has_target_file" => "true"
        }
      }
    }
  }

  if [BlockedFileReason] not in ["", "-", "unknown", "Unknown", "UNKNOWN"] {
    mutate {
      replace => {
        "security_result.summary" => "%{BlockedFileReason}"
      }
      on_error => "no_blocked_file_reason"
    }
  }

  if [FileInfo] not in ["", "-"] and [FileInfo][files] != "" {
    for fileitem in FileInfo.files {
      mutate {
        replace => {
          "file_about" => ""
          "file_info_name" => ""
          "file_info_type" => ""
          "file_info_content_type" => ""
          "file_info_size" => ""
          "file_info_direction" => ""
          "file_info_action" => ""
          "file_direction_label" => ""
          "file_type_label" => ""
          "file_action_label" => ""
          "set_target_from_file_item" => "false"
        }
      }
      mutate {
        replace => {
          "file_info_name" => "%{fileitem.file_name}"
        }
        on_error => "no_file_info_name"
      }
      if [file_info_name] not in ["", "-", "<unknown file name>"] {
        if [has_target_file] == "false" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.full_path" =>
                "%{file_info_name}"
            }
            on_error => "no_target_file_full_path"
          }
          if ![no_target_file_full_path] {
            mutate {
              replace => {
                "has_target_file" => "true"
                "set_target_from_file_item" => "true"
              }
            }
          }
        }
        mutate {
          replace => {
            "file_about.file.full_path" => "%{file_info_name}"
          }
          on_error => "no_about_file_full_path"
        }
      }
      mutate {
        replace => {
          "file_info_content_type" => "%{fileitem.content_type}"
        }
        on_error => "no_file_info_content_type"
      }
      if [file_info_content_type] not in ["", "-"] {
        if [has_target_file] == "false" or
          [set_target_from_file_item] == "true" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.mime_type" =>
                "%{file_info_content_type}"
            }
            on_error => "no_target_file_mime_type"
          }
          if ![no_target_file_mime_type] {
            mutate {
              replace => {
                "has_target_file" => "true"
                "set_target_from_file_item" => "true"
              }
            }
          }
        }
        mutate {
          replace => {
            "file_about.file.mime_type" => "%{file_info_content_type}"
          }
          on_error => "no_about_file_mime_type"
        }
      }
      mutate {
        convert => {
          "fileitem.file_size" => "string"
        }
        on_error => "file_info_size_already_string"
      }
      mutate {
        replace => {
          "file_info_size" => "%{fileitem.file_size}"
        }
        on_error => "no_file_info_size"
      }
      if ![no_file_info_size] {
        if [file_info_size] =~ "^[1-9][0-9]*$" {
          if [has_target_file] == "false" or
            [set_target_from_file_item] == "true" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.file.size" =>
                  "%{file_info_size}"
              }
              on_error => "copy_target_file_size_failed"
            }
            if ![copy_target_file_size_failed] {
              mutate {
                convert => {
                  "event.idm.read_only_udm.target.file.size" => "uinteger"
                }
                on_error => "size_convert_failed"
              }
              if ![size_convert_failed] {
                mutate {
                  replace => {
                    "has_target_file" => "true"
                    "set_target_from_file_item" => "true"
                  }
                }
              }
            }
          }
          mutate {
            replace => {
              "file_about.file.size" => "%{file_info_size}"
            }
            on_error => "no_about_file_size"
          }
          if ![no_about_file_size] {
            mutate {
              convert => {
                "file_about.file.size" => "uinteger"
              }
              on_error => "about_file_size_not_uint"
            }
          }
        }
      }
      mutate {
        replace => {
          "file_info_direction" => "%{fileitem.direction}"
        }
        on_error => "no_file_info_direction"
      }
        if [file_info_direction] not in ["", "-"] {
    mutate {
      replace => {
        "file_direction_label.key" => "direction"
        "file_direction_label.value.string_value" => "%{file_info_direction}"
      }
      on_error => "no_file_direction_label"
    }
    if ![no_file_direction_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "file_direction_label"
        }
        on_error => "merge_file_direction_label_failed"
      }
    }
  }

  mutate {
    replace => {
      "file_info_type" => "%{fileitem.file_type}"
    }
    on_error => "no_file_info_type"
  }
  if [file_info_type] not in ["", "-"] {
    mutate {
      replace => {
        "file_type_label.key" => "file_type"
        "file_type_label.value.string_value" => "%{file_info_type}"
      }
      on_error => "no_file_type_label"
    }
    if ![no_file_type_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "file_type_label"
        }
        on_error => "merge_file_type_label_failed"
      }
    }
  }

  mutate {
    replace => {
      "file_info_action" => "%{fileitem.action}"
    }
    on_error => "no_file_info_action"
  }

  if [file_info_action] not in ["", "-"] {
    mutate {
      replace => {
        "file_action_label.key" => "file_action"
        "file_action_label.value.string_value" => "%{file_info_action}"
      }
      on_error => "no_file_action_label"
    }
    if ![no_file_action_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "file_action_label"
        }
        on_error => "merge_file_action_label_failed"
      }
    }
  }
    }
  }

  if [DownloadedFileNames] != "" {
    for dlfile in DownloadedFileNames {
      mutate {
        replace => {
          "downloaded_file_label" => ""
        }
      }
      if [dlfile] not in ["", "-", "<unknown file name>"] {
        if [has_target_file] == "false" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.full_path" => "%{dlfile}"
            }
            on_error => "no_downloaded_file"
          }
          if ![no_downloaded_file] {
            mutate {
              replace => {
                "has_target_file" => "true"
              }
            }
          }
        }
        mutate {
          replace => {
            "downloaded_file_label.key" => "DownloadedFileNames"
            "downloaded_file_label.value" => "%{dlfile}"
          }
          on_error => "no_downloaded_file_label"
        }
        if ![no_downloaded_file_label] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" =>
                "downloaded_file_label"
            }
            on_error => "merge_downloaded_file_label_failed"
          }
        }
      }
    }
  }

  if [UploadedFileNames] != "" {
    for ulfile in UploadedFileNames {
      mutate {
        replace => {
          "uploaded_file_label" => ""
        }
      }
      if [ulfile] not in ["", "-", "<unknown file name>"] {
        if [has_target_file] == "false" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.full_path" => "%{ulfile}"
            }
            on_error => "no_uploaded_file"
          }
          if ![no_uploaded_file] {
            mutate {
              replace => {
                "has_target_file" => "true"
              }
            }
          }
        }
        mutate {
          replace => {
            "uploaded_file_label.key" => "UploadedFileNames"
            "uploaded_file_label.value" => "%{ulfile}"
          }
          on_error => "no_uploaded_file_label"
        }
        if ![no_uploaded_file_label] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" =>
                "uploaded_file_label"
            }
            on_error => "merge_uploaded_file_label_failed"
          }
        }
      }
    }
  }

  if [HTTPMethod] not in ["", "-", "UNKNOWN"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{HTTPMethod}"
      }
      on_error => "no_http_method"
    }
    if ![no_http_method] {
      mutate {
        replace => {
          "is_http" => "true"
        }
      }
    }
  }

  if [HTTPStatusCode] not in ["", "-"] {
    mutate {
      convert => {
        "HTTPStatusCode" => "string"
      }
      on_error => "http_status_already_string"
    }
    if [HTTPStatusCode] =~ "^[1-9][0-9]*$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" =>
            "%{HTTPStatusCode}"
        }
        on_error => "http_status_replace_failed"
      }
      if ![http_status_replace_failed] {
        mutate {
          convert => {
            "event.idm.read_only_udm.network.http.response_code" => "integer"
          }
          on_error => "http_status_not_integer"
        }
        if ![http_status_not_integer] {
          mutate {
            replace => {
              "is_http" => "true"
            }
          }
        }
      }
    }
  }

  if [HTTPVersion] not in ["", "-", "UNK"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol_version" =>
          "%{HTTPVersion}"
      }
      on_error => "no_http_version"
    }
    if ![no_http_version] {
      mutate {
        replace => {
          "is_http" => "true"
        }
      }
    }
  }

  if [UserAgent] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{UserAgent}"
      }
      on_error => "no_user_agent"
    }
    if ![no_user_agent] {
      mutate {
        replace => {
          "is_http" => "true"
        }
      }
      mutate {
        convert => {
          "UserAgent" => "parseduseragent"
        }
        on_error => "parsed_user_agent_conversion_error"
      }
      if ![parsed_user_agent_conversion_error] {
        mutate {
          rename => {
            "UserAgent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
          }
          on_error => "no_parsed_user_agent"
        }
      }
    }
  }

  if [Referer] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{Referer}"
      }
      on_error => "no_referer"
    }
    if ![no_referer] {
      mutate {
        replace => {
          "is_http" => "true"
        }
      }
    }
  }

  if [Action] not in ["", "-"] {
    mutate {
      uppercase => ["Action"]
      on_error => "action_not_string"
    }
    if ![action_not_string] {
      if [Action] in [
        "BYPASS", "ALLOW", "PERMIT", "ALLOWEDBYRULE", "AUTHENTICATE"
      ] {
        mutate {
          replace => {
            "action_enum" => "ALLOW"
          }
        }
      } else if [Action] in ["BLOCK", "DENY", "DROP"] {
        mutate {
          replace => {
            "action_enum" => "BLOCK"
          }
        }
      }
      mutate {
        merge => {
          "security_result.action" => "action_enum"
        }
        on_error => "merge_action_failed"
      }
    }
  }

  if [PolicyID] not in ["", "-"] {
    mutate {
      replace => {
        "security_result.rule_id" => "%{PolicyID}"
      }
      on_error => "no_policy_id"
    }
  }

  if [PolicyName] not in ["", "-"] {
    mutate {
      replace => {
        "security_result.rule_name" => "%{PolicyName}"
      }
      on_error => "no_policy_name"
    }
  }

  if [CategoryNames] != "" {
    for cat in CategoryNames {
      if [cat] not in ["", "-"] {
        mutate {
          merge => {
            "security_result.category_details" => "cat"
          }
          on_error => "merge_category_details_failed"
        }
      }
    }
  }

  for app in ApplicationNames {
    mutate {
      replace => {
        "app_label" => ""
      }
    }
    if [app] not in ["", "-"] {
      if [has_target_app] == "false" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.application" => "%{app}"
          }
          on_error => "no_target_application"
        }
        if ![no_target_application] {
          mutate {
            replace => {
              "has_target_app" => "true"
            }
          }
        }
      }
      mutate {
        replace => {
          "app_label.key" => "ApplicationNames"
          "app_label.value" => "%{app}"
        }
        on_error => "no_app_label"
      }
      if ![no_app_label] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" =>
              "app_label"
          }
          on_error => "merge_app_label_failed"
        }
      }
    }
  }

  if [ApplicationStatuses] != "" {
    for appstatus in ApplicationStatuses {
      mutate {
        replace => {
          "app_status_label" => ""
        }
      }
      if [appstatus] not in ["", "-"] {
        mutate {
          replace => {
            "app_status_label.key" => "ApplicationStatuses"
            "app_status_label.value" => "%{appstatus}"
          }
          on_error => "no_app_status_label"
        }
        if ![no_app_status_label] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" =>
                "app_status_label"
            }
            on_error => "merge_app_status_label_failed"
          }
        }
      }
    }
  }

  if [IsIsolated] not in ["", "-"] {
    mutate {
      convert => {
        "IsIsolated" => "string"
      }
      on_error => "is_isolated_already_string"
    }
    mutate {
      replace => {
        "is_isolated_label.key" => "IsIsolated"
        "is_isolated_label.value" => "%{IsIsolated}"
      }
      on_error => "no_is_isolated"
    }
    if ![no_is_isolated] {
      mutate {
        merge => {
          "security_result.detection_fields" => "is_isolated_label"
        }
        on_error => "merge_is_isolated_failed"
      }
    }
  }

  if [Quarantined] not in ["", "-"] {
    mutate {
      convert => {
        "Quarantined" => "string"
      }
      on_error => "quarantined_already_string"
    }
    mutate {
      replace => {
        "quarantined_label.key" => "Quarantined"
        "quarantined_label.value" => "%{Quarantined}"
      }
      on_error => "no_quarantined"
    }
    if ![no_quarantined] {
      mutate {
        merge => {
          "security_result.detection_fields" => "quarantined_label"
        }
        on_error => "merge_quarantined_failed"
      }
    }
  }

  if [UntrustedCertificateAction] not in ["", "-"] {
    mutate {
      replace => {
        "untrusted_cert_action_label.key" => "UntrustedCertificateAction"
        "untrusted_cert_action_label.value" => "%{UntrustedCertificateAction}"
      }
      on_error => "no_untrusted_cert_action"
    }
    if ![no_untrusted_cert_action] {
      mutate {
        merge => {
          "security_result.detection_fields" => "untrusted_cert_action_label"
        }
        on_error => "merge_untrusted_cert_action_failed"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "merge_security_result_failed"
    }
  }

  if [is_http] == "true" and
    [has_principal] == "true" and
    [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  } else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [has_principal] == "true" and [has_target_file] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  } else if [has_principal_user] == "true" and [has_target_app] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Cloudflare"
      "event.idm.read_only_udm.metadata.product_name" =>
        "Cloudflare Gateway HTTP"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}