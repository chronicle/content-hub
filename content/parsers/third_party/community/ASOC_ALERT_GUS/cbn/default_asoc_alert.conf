# Product: ASOC Alert
# Category: Alert
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2021-06-21
# Copyright 2021 Chronicle LLC


filter {

  json {
    source => "message"
    array_function => "split_columns"
  }

  # - Drop stats infos
  if [type] in ("stats_queries", "stats_endpoints") {
    drop {
      tag => "TAG_NO_SECURITY_VALUE"
    }
  }

  # -observer
  mutate {
    replace => {
      "_observer.application" => "%{app}"
    }
  }

  # - principal
  mutate {
    replace => {
      "_principal.hostname" => "%{src_host}"
      "_principal.administrative_domain" => "%{wisdom.domain}"
    }
  }

  mutate {
    merge => {
      "_principal.ip" => "src_ip"
    }
  }

  # - target
  mutate {
    replace => {
      "_target.hostname" => "%{dest_host}"
    }
  }

  # - metadata
  date {
    match => ["ts", "dd-MMM-yyyy HH:mm:ssZ"]
  }

  mutate {
    replace => {
      "_meta.event_type" => "NETWORK_CONNECTION"
      "_meta.product_name" => "Asoc Alert"
      "_meta.vendor_name" => "Sumo Logic"
    }
  }

  if [subject] != "" {
    mutate {
      replace => {
        "_meta.product_event_type" => "%{type}"
      }
    }
  }

  # - security_results
  for threat in threats {
    if [severity] in ("medium", "high", "low") {
      mutate {
        uppercase => ["severity"]
      }
      mutate {
        replace => {
          "_security_result.severity" => "%{severity}"
        }
      }
    }

    mutate {
      replace => {
        "_security_result.description" => "%{subject}"
      }
    }

    mutate {
      replace => {
        "_security_result.threat_name" => "%{threat}"
      }
    }

    if [threat] == "remote_access_software" {
      mutate {
        replace => {
          "_security_category" => "SOFTWARE_SUSPICIOUS"
        }
      }
    } else if [threat] == "unwanted_program" {
      mutate {
        replace => {
          "_security_category" => "SOFTWARE_PUA"
        }
      }
    } else if [threat] in ("encrypted_dns",
                           "suspicious_domain_beacon",
                           "suspicious_hosting_provider",
                           "suspicious_domain") {
      mutate {
        replace => {
          "_security_category" => "NETWORK_SUSPICIOUS"
        }
      }
    } else if [threat] == "likely_malicious_domain" {
      mutate {
        replace => {
          "_security_category" => "NETWORK_MALICIOUS"
        }
      }
    }

    for flag in wisdom.flags {
      mutate {
        replace => {
          "_category_details" => "%{flag}"
        }
      }
      mutate {
        merge => {
          "_security_result.category_details" => "_category_details"
        }
      }
    } # - End of flags loop

    # - Verify if labels does exist in wisdom array
    mutate {
      replace => {
        "_labels" => "wisdom.labels"
      }
      on_error => "labels_not_exist"
    }

    if ![labels_not_exist] {
      for label in wisdom.labels {
        mutate {
          replace => {
            "_category_details" => "%{label}"
          }
        }
        if ["_category_details"] != "" {
          mutate {
            merge => {
              "_security_result.category_details" => "_category_details"
            }
          }
        }
      }
    }

    mutate {
      merge => {
        "_security_result.category" => "_security_category"
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "_security_result"
      }
    }

    mutate {
      replace => {
        "_security_result" => ""
      }
    }
  } # - End of threats loop

  # - udm fields
  mutate {
    rename => {
      "_meta" => "event.idm.read_only_udm.metadata"
      "_observer" => "event.idm.read_only_udm.observer"
      "_principal" => "event.idm.read_only_udm.principal"
      "_target" => "event.idm.read_only_udm.target"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
