# Product: SNYK SDLC
# Category: Vulnerability Scanners
# Supported Format: JSON
# Reference : NA
# Last Updated: 2026-03-13
# Copyright 2026 Google SecOps
filter {
  mutate {
    replace => {
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "groupId" => ""
      "orgId" => ""
      "event" => ""
      "content.url" => ""
      "created" => ""
      "userId" => ""
      "network" => ""
      "additional" => ""
      "content.snyk_request_id" => ""
      "content.http_method" => ""
      "http_method_details" => ""
      "has_user" => ""
      "data" => ""
      "content.origin" => ""
      "group_id" => ""
      "org_id" => ""
      "user_id" => ""
      "project_id" => ""
    }
  }

  # Applying json filter
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] == true {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [data] != "" {
    for item in data.items {
      mutate {
        replace => {
          "metadata" => ""
          "principal" => ""
          "additional" => ""
          "has_user" => ""
          "group_id" => ""
          "org_id" => ""
          "event" => ""
          "content" => ""
          "created" => ""
          "user_id" => ""
          "field_check" => ""
          "file" => ""
          "file_label" => ""
          "orgId_label" => ""
          "origin_label" => ""
          "requestId_label" => ""
          "requestId" => ""
          "hostname" => ""
          "projectName" => ""
          "target" => ""
          "target_remote_url" => ""
          "type" => ""
          "type_label" => ""
          "targetFile" => ""
          "jsonapi_version" => ""
          "data_type" => ""
          "data_type_label" => ""
          "project_id" => ""
          "Project_ID_label" => ""

        }
      }
      mutate {
        replace => {
          "group_id" => "%{item.group_id}"
        }
        on_error => "group_id_not_present"
      }
      if [group_id] != "" {
        mutate {
          merge => {
            "principal.user.group_identifiers" => "group_id"
          }
          on_error => "group_id_merge_error"
        }
      }
      mutate {
        replace => {
          "org_id" => "%{item.org_id}"
        }
        on_error => "org_id_not_present"
      }
      if [org_id] != "" {
        mutate {
          replace => {
            "orgId_label.key" => "org_id"
            "orgId_label.value" => "%{org_id}"
          }
          merge => {
            "principal.user.attribute.labels" => "orgId_label"
          }
          on_error => "org_id_merge_error"
        }
      }
      mutate {
        replace => {
          "user_id" => "%{item.user_id}"
        }
        on_error => "user_id_not_present"
      }
      if [user_id] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{user_id}"
          }
          on_error => "user_id_missing"
        }
        if ![user_id_missing] {
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
      }
      mutate {
        replace => {
          "project_id" => "%{item.project_id}"
        }
        on_error => "project_id_not_present"
      }
      if [project_id] != "" {
        mutate {
          replace => {
            "Project_ID_label.key" => "Project_ID"
            "Project_ID_label.value" => "%{project_id}"
          }
          merge => {
            "target.user.attribute.labels" => "Project_ID_label"
          }
          on_error => "Project_ID_merge_error"
        }
      }
      mutate {
        replace => {
          "event" => "%{item.event}"
        }
        on_error => "event_not_present"
      }
      if [event] != "" {
        mutate {
          replace => {
            "metadata.product_event_type" => "%{event}"
          }
          on_error => "event_merge_error"
        }
      }
      mutate {
        replace => {
          "jsonapi_version" => "%{jsonapi.version}"
        }
        on_error => "jsonapi_version_not_present"
      }
      if [jsonapi_version] != "" {
        mutate {
          replace => {
            "metadata.product_version" => "%{jsonapi_version}"
          }
          on_error => "jsonapi_version_merge_error"
        }
      }
      mutate {
        replace => {
          "data_type" => "%{data.type}"
        }
        on_error => "data_type_not_present"
      }
      if [data_type] != "" {
        mutate {
          replace => {
            "data_type_label.key" => "data_type"
            "data_type_label.value.string_value" => "%{data_type}"
          }
          merge => {
            "additional.fields" => "data_type_label"
          }
          on_error => "data_type_merge_error"
        }
      }
      mutate {
        replace => {
          "field_check" => "%{item.content.origin}"
        }
        on_error => "origin_not_present"
      }
      if [field_check] != "" {
        mutate {
          replace => {
            "origin_label.key" => "origin"
            "origin_label.value" => "%{field_check}"
          }
          merge => {
            "principal.resource.attribute.labels" => "origin_label"
          }
          on_error => "origin_merge_error"
        }
      }
      mutate {
        convert => {
          "item.content.files" => "string"
        }
        on_error => "files_convert_error"
      }
      mutate {
        replace => {
          "file" => "%{item.content.files}"
        }
        on_error => "files_not_present"
      }
      if [file] != "" {
        mutate {
          replace => {
            "file_label.key" => "file"
            "file_label.value.string_value" => "%{file}"
          }
          merge => {
            "additional.fields" => "file_label"
          }
          on_error => "files_merge_error"
        }
      }
      mutate {
        replace => {
          "requestId" => "%{item.content.requestId}"
        }
        on_error => "requestId_not_present"
      }
      if [requestId] != "" {
        mutate {
          replace => {
            "requestId_label.key" => "requestId"
            "requestId_label.value.string_value" => "%{requestId}"
          }
          merge => {
            "additional.fields" => "requestId_label"
          }
          on_error => "requestId_merge_error"
        }
      }
      mutate {
        replace => {
          "hostname" => "%{item.content.hostname}"
        }
        on_error => "hostname_not_present"
      }
      if [hostname] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{hostname}"
          }
          on_error => "hostname_merge_error"
        }
      }
      mutate {
        replace => {
          "projectName" => "%{item.content.projectName}"
        }
        on_error => "projectName_not_present"
      }
      if [projectName] != "" {
        mutate {
          replace => {
            "principal.resource.name" => "%{projectName}"
          }
          on_error => "projectName_merge_error"
        }
      }
      mutate {
        replace => {
          "target_remote_url" => "%{item.content.target.remoteUrl}"
        }
        on_error => "target_remote_url_not_present"
      }
      if [target_remote_url] != "" {
        mutate {
          replace => {
            "target.url" => "%{target_remote_url}"
          }
          on_error => "target_remote_url_merge_error"
        }
      }
      mutate {
        replace => {
          "targetFile" => "%{item.content.targetFile}"
        }
        on_error => "targetFile_not_present"
      }
      if [targetFile] != "" {
        mutate {
          replace => {
            "target.file.full_path" => "%{targetFile}"
          }
          on_error => "targetFile_merge_error"
        }
      }
      mutate {
        replace => {
          "type" => "%{item.content.type}"
        }
        on_error => "type_not_present"
      }
      if [type] != "" {
        mutate {
          replace => {
            "type_label.key" => "type"
            "type_label.value.string_value" => "%{type}"
          }
          merge => {
            "additional.fields" => "type_label"
          }
          on_error => "type_merge_error"
        }
      }
      mutate {
        replace => {
          "created" => "%{item.created}"
        }
        on_error => "created_not_present"
      }
      if [created] != "" {
        date {
          match => ["created", "ISO8601"]
          target => "metadata.event_timestamp"
          on_error => "created_merge_error"
        }
      }
      mutate {
        replace => {
          "metadata.product_name" => "SNYK SDLC"
          "metadata.vendor_name" => "SNYK_SDLC"
        }
      }
      if [has_user] != "" {
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      else {
        mutate {
          replace => {
            "metadata.event_type" => "GENERIC_EVENT"
          }
        }
      }
      # merge the data into udm nouns.
      if [metadata] != "" {
        mutate {
          rename => {
            "metadata" => "event.idm.read_only_udm.metadata"
          }
        }
      }
      if [principal] != "" {
        mutate {
          rename => {
            "principal" => "event.idm.read_only_udm.principal"
          }
        }
      }
      if [target] != "" {
        mutate {
          rename => {
            "target" => "event.idm.read_only_udm.target"
          }
        }
      }
      if [additional] != "" {
        mutate {
          rename => {
            "additional" => "event.idm.read_only_udm.additional"
          }
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
  else {
    if [groupId] != "" {
      mutate {
        merge => {
          "principal.user.group_identifiers" => "groupId"
        }
        on_error => "groupId_merge_error"
      }
    }
    else if [group_id] != "" {
      mutate {
        merge => {
          "principal.user.group_identifiers" => "group_id"
        }
        on_error => "group_id_merge_error"
      }
    }
    if [userId] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{userId}"
        }
        on_error => "userid_missing"
      }
      if ![userid_missing] {
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
    }
    else if [user_id] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{user_id}"
        }
        on_error => "user_id_missing"
      }
      if ![user_id_missing] {
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
    }
    if [project_id] != "" {
      mutate {
        replace => {
          "project_id_label.key" => "project_id"
          "project_id_label.value" => "%{project_id}"
        }
        merge => {
          "target.user.attribute.labels" => "project_id_label"
        }
        on_error => "project_id_merge_error"
      }
    }
    mutate {
      convert => {
        "content.snyk_request_id" => "string"
      }
      on_error => "snyk_request_id_convert_error"
    }
    if [content][snyk_request_id] != "" {
      mutate {
        replace => {
          "content_snyk_request_id_label.key" => "snyk_request_id"
          "content_snyk_request_id_label.value.string_value" => "%{content.snyk_request_id}"
        }
        on_error => "snyk_request_id_missing"
      }
      if ![snyk_request_id_missing] {
        mutate {
          merge => {
            "additional.fields" => "content_snyk_request_id_label"
          }
          on_error => "snyk_request_id_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "http_method_details" => "%{content.http_method}"
      }
      on_error => "http_method_replace_error"
    }
    mutate {
      uppercase => ["http_method_details"]
    }
    if [http_method_details] in ["GET", "HEAD", "POST", "PUT", "DELETE", "CONNECT", "PATCH", "OPTIONS", "TRACE"] {
      mutate {
        replace => {
          "network.http.method" => "%{http_method_details}"
        }
        on_error => "http_method_missing"
      }
    }
    if [event] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{event}"
        }
        on_error => "event_error"
      }
    }
    if [content][url] != "" {
      mutate {
        replace => {
          "principal.url" => "%{content.url}"
        }
        on_error => "url_missing"
      }
    }
    if [content][origin] != "" {
      mutate {
        replace => {
          "origin_label.key" => "content_origin"
          "origin_label.value" => "%{content.origin}"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "origin_label"
        }
        on_error => "content_origin_merge_error"
      }
    }
    if [created] != "" {
      date {
        match => ["created", "ISO8601"]
        target => "metadata.event_timestamp"
        on_error => "created_error"
      }
    }
    if [orgId] != "" {
      mutate {
        replace => {
          "orgId_label.key" => "orgId"
          "orgId_label.value" => "%{orgId}"
        }
        merge => {
          "principal.user.attribute.labels" => "orgId_label"
        }
        on_error => "orgId_merge_error"
      }
    }
    else if [org_id] != "" {
      mutate {
        replace => {
          "orgId_label.key" => "org_id"
          "orgId_label.value" => "%{org_id}"
        }
        merge => {
          "principal.user.attribute.labels" => "orgId_label"
        }
        on_error => "org_id_merge_error"
      }
    }
    mutate {
      replace => {
        "metadata.product_name" => "SNYK SDLC"
        "metadata.vendor_name" => "SNYK_SDLC"
      }
    }
    if [has_user] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    # merge the data into udm nouns.
    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }
    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }
    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
      }
    }
    if [network] != "" {
      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
      }
    }
    if [additional] != "" {
      mutate {
        rename => {
          "additional" => "event.idm.read_only_udm.additional"
        }
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}

