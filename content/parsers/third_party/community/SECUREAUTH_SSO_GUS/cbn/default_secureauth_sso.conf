# Product: SECUREAUTH
# Category: SSO
# Supported Format: SYSLOG, XML, JSON+KV
# Reference: "https://www.secureauth.com/identity-access-management/single-sign-on/"
# Last Updated: 2026-04-20
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "not_email"                          => "true"
      "SecureAuthIdPAuthGuiMode"           => ""
      "message_detail"                     => ""
      "suser"                              => ""
      "src"                                => ""
      "dst"                                => ""
      "dvc"                                => ""
      "intermediary"                       => ""
      "security_result"                    => ""
      "event_id"                           => ""
      "prio"                               => ""
      "event_name"                         => ""
      "category"                           => ""
      "cat"                                => ""
      "nat_ip"                             => ""
      "session"                            => ""
      "realm"                              => ""
      "domain"                             => ""
      "company"                            => ""
      "version"                            => ""
      "ip"                                 => ""
      "event_time1"                        => ""
      "event_time"                         => ""
      "xml_data"                           => ""
      "product_type"                       => ""
      "cn1Label"                           => ""
      "cs1Label"                           => ""
      "cs3Label"                           => ""
      "action_msg"                         => ""
      "sec_msg"                            => ""
      "spid"                               => ""
      "SecureAuthIdPAppliance"             => ""
      "SecureAuthIdPApplianceMachineName"  => ""
      "SecureAuthIdPDestinationSiteUrl"    => ""
      "SecureAuthIdPProductType"           => ""
      "source_ip"                          => ""
      "Priority"                           => ""
      "Appliance"                          => ""
      "UserID"                             => ""
      "HostName"                           => ""
      "SAMLConsumerURL"                    => ""
      "UserAgent"                          => ""
      "kv_data"                            => ""
      "UserHostAddress"                    => ""
      "Company"                            => ""
      "Message"                            => ""
      "Timestamp"                          => ""
      "CompanyID"                          => ""
      "PEN"                                => ""
      "ApplianceID"                        => ""
      "Realm"                              => ""
      "ApplianceMachineName"               => ""
      "RequestID"                          => ""
      "UseJava"                            => ""
      "LogChannel"                         => ""
      "log_source_address"                 => ""
      "parsed_LogChannel"                  => ""
      "parsed_Message"                     => ""
      "host_name"                          => ""
      "parsed_RequestID"                   => ""
      "parsed_cloud_machine_type"          => ""
      "meta_cloud_availability_zone"       => ""
      "meta_cloud_region"                  => ""
      "ApplianceType"                      => ""
      "host_id"                            => ""
      "parsed_Version"                     => ""
      "host_architecture"                  => ""
      "host_os_platform"                   => ""
      "host_os_version"                    => ""
      "host_os_build"                      => ""
      "host_os_family"                     => ""
      "host_os_name"                       => ""
      "meta_cloud_provider"                => ""
      "meta_cloud_instance_id"             => ""
      "derived_LogChannelIndex"            => ""
      "document_id"                        => ""
      "parsed_UserAgent"                   => ""
      "beat_version"                       => ""
      "fields_company_id"                  => ""
      "fields_appliance_id"                => ""
      "_timestamp"                         => ""
      "derived_company_index"              => ""
      "_version"                           => ""
      "derived_event_type"                 => ""
      "prospector_type"                    => ""
      "input_type"                         => ""
      "parsed_FormatVersion"               => ""
      "parsed_EventID"                     => ""
      "parsed_CompanyID"                   => ""
      "parsed_Realm"                       => ""
      "parsed_UserHostAddress"             => ""
      "LogstashPod"                        => ""
      "FormatVersion"                      => ""
      "tags"                               => ""
      "has_principal"                      => "false"
      "beat_name"                          => ""
      "beat_hostname"                      => ""
      "EventID"                            => ""
      "Version"                            => ""
      "parsed_ApplianceID"                 => ""
      "RequestDuration"                    => ""
    }
  }
  mutate {
    gsub => ["message", "\\r", ""]
  }

  grok {
    match => {
      "message" => [
        "<%{NUMBER:priority}>%{SYSLOGTIMESTAMP:event_time} (%{IP:source_ip}\|-) %{WORD:log_format}:%{WORD:log_format_version}\\|%{WORD:vendor_name}\\|%{WORD:product_name}\\|%{DATA:version}\\|%{NUMBER:event_id}\\|%{DATA:event_name}\\|%{NUMBER:severity}\\|%{GREEDYDATA:message_detail}"
        "<%{NUMBER:priority}>%{SYSLOGTIMESTAMP:event_time} (%{IP:source_ip}\|-) %{WORD:log_format}:%{WORD:log_format_version}\\|%{WORD:vendor_name}\\|%{WORD:product_name}\\|%{DATA:version}\\|%{NUMBER:event_id}\\|%{DATA:event_name} %{GREEDYDATA:message_detail}"
        "<%{INT:priority}>%{SYSLOGTIMESTAMP:event_time}\s+(?P<xml_data>\<Root\>.*\<\/Root\>)",
        "%{SYSLOGTIMESTAMP}\\s+%{DATA}(?P<xml_data>\<Root\>.*\<\/Root\>)",
        "%{TIMESTAMP_ISO8601:event_time} %{IP} %{NOTSPACE} %{INT} %{NOTSPACE:id} \\[%{GREEDYDATA:kv_data}\\] %{GREEDYDATA:sec_msg}"
      ]
    }
    overwrite => ["source_ip", "priority", "event_time", "source_ip", "log_format", "log_format_version", "vendor_name", "product_name", "version", "event_id", "event_name", "severity", "message_detail", "xml_data", "kv_data", "sec_msg"]
    on_error => "no_match"
  }
  if [message] =~ "Error[|]Error[|]Error" {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [message] =~ "LogChannel" {
    grok {
      match => {
        "message" => "%{GREEDYDATA:kv_data}"
      }
      overwrite => ["kv_data"]
    }
  }
  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "\\\"", ""]
    }
    mutate {
      gsub => ["kv_data", "([0-9a-zA-Z_.-\s]+?)=", "#$1="]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "not_kv"
    }
    if ![not_kv] {
      mutate {
        replace => {
          "category" => "%{Category}"
        }
        on_error => "no_category"
      }
      mutate {
        replace => {
          "event_id" => "%{EventID}"
        }
        on_error => "no_event_id"
      }
      mutate {
        replace => {
          "version" => "%{Version}"
        }
        on_error => "no_version"
      }
    }
  }
  kv {
    source => "message_detail"
    field_split_pattern => "(?<=\s|\A)([^\s=]+)=(.*?)(?=(?:\s[^\s=]+=|$))"
    value_split => "="
  }

  json {
    source => "message"
    on_error => "json_parse_failure"
    array_function => "split_columns"
  }

  kv {
    source => "message"
    field_split => " "
    value_split => "="
    trim_value => '\"'
    on_error => "not_kv_message"
  }

  if [xml_data] != "" {
    xml {
      source => "xml_data"
      xpath => {
        "//EventID" => "event_id"
        "//Priority" => "prio"
        "//Message" => "event_name"
        "//Category" => "category"
        "//UserHostAddress" => "nat_ip"
        "//BrowserSession" => "session"
        "//Realm" => "realm"
        "//Appliance" => "domain"
        "//Company" => "product_type"
        "//Version" => "version"
        "//HostName" => "ip"
      }
    }
  }
  mutate {
    convert => {
      "not_email" => "boolean"
    }
  }
  grok {
    match => {
      "message_detail" => ".*?msg=(?P<sec_msg>.*)\\srequestClientApplication"
    }
    on_error => "err"
  }

  grok{
    match => {
      "message_detail" => ".*?deviceCustomDate1=(?P<event_time1>[^ ]+)"
    }
    on_error => "err"
  }

  if [event_time1] != "" {
    date{
      match => [ "event_time1", "UNIX_MS" ]
    }
  }
  else if [event_time] != "" {
    date {
      match => [ "event_time", "MMM d HH:mm:ss", "MMM  d HH:mm:ss","MMM  dd HH:mm:ss","MMM dd HH:mm:ss", "ISO8601" ]
      rebase => true
    }
  }
  if [Timestamp] != "" {
    date {
      match => ["Timestamp", "ISO8601"]
    }
  }
  if [_timestamp] != "" {
    date {
      match => ["_timestamp", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "no_timestamp"
    }
  }
  if [event_id] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{event_id}"
      }
    }
  }
  if [event_name] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{event_name}"
      }
    }
  }
  if [category] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{category}"
      }
    }
  }
  if [version] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      }
    }
  }
  if [session] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{session}"
      }
    }
  }
  if [cat] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{cat}"
      }
    }
  }

  if [HostName] != "" {
    grok {
      match => {
        "HostName" => "%{IP:HostName}"
      }
      on_error => "not_ip"
    }
    if ![not_ip] {
      mutate{
        merge => {
          "event.idm.read_only_udm.principal.ip" => "HostName"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{HostName}"
        }
      }
    }
  }

  grok {
    match => {
      "Message" => "RequestDuration=%{GREEDYDATA:parsed_Message}"
    }
    overwrite => ["parsed_Message"]
    on_error => "no_parsed_message_grok_error"
  }

  mutate {
    rename => {
      "LogChannel" => "addition.LogChannel"
      "FormatVersion" => "addition.FormatVersion"
      "EventID" => "addition.EventID"
      "Version" => "addition.Version"
      "parsed.UserAgent" => "addition.UserAgent"
      "parsed.ApplianceID" => "addition.ParsedApplianceID"
      "beat.name" => "addition.BeatName"
      "beat.hostname" => "addition.BeatHostname"
      "beat.version" => "addition.BeatVersion"
      "fields.CompanyID" => "addition.FieldsCompanyID"
      "derived.CompanyIndex" => "addition.DerivedCompanyIndex"
      "_version" => "addition._Version"
      "derived.EventType" => "addition.DerivedEventType"
      "prospector.type" => "addition.ProspectorType"
      "input.type" => "addition.InputType"
      "parsed_Message" => "addition.ParsedMessage"
      "meta.cloud.machine_type" => "addition.MetaCloudMachineType"
      "ApplianceType" => "addition.ApplianceType"
      "parsed.Version" => "addition.ParsedVersion"
      "host.architecture" => "addition.HostArchitecture"
      "host.os.platform" => "addition.HostOsPlatform"
      "host.os.version" => "addition.HostOsVersion"
      "host.os.build" => "addition.HostOsBuild"
      "host.os.family" => "addition.HostOsFamily"
      "host.os.name" => "addition.HostOsName"
      "meta.cloud.provider" => "addition.MetaCloudProvider"
      "derived.LogChannelIndex" => "addition.DerivedLogChannelIndex"
      "document_id" => "addition.DocumentID"
      "meta.cloud.instance_id" => "addition.MetaCloudInstanceID"
    }
  }

  for key1,value1 in addition map {
    mutate {
      replace => {
        "field1" => ""
        "check" => ""
      }
    }
    mutate {
      convert => {
        "value1" => "string"
      }
      on_error => "value1_string"
    }
    mutate {
      replace => {
        "check" => "%{value1}"
      }
      on_error => "check_empty"
    }
    if ![check_empty] && [check] != "" {
      mutate {
        replace => {
          "field1.key" => "%{key1}"
        }
        on_error => "key1_empty"
      }
      if [key1] in ["MetaCloudMachineType", "ApplianceType", "ParsedVersion", "HostArchitecture", "HostOsPlatform", "HostOsVersion", "HostOsBuild", "HostOsFamily", "HostOsName", "MetaCloudProvider", "DerivedLogChannelIndex", "DocumentID", "MetaCloudInstanceID"] {
        mutate {
          replace => {
            "field1.value" => "%{value1}"
          }
          on_error => "value_not_found_principal"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "field1"
          }
          on_error => "principal_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "field1.value.string_value" => "%{value1}"
          }
          on_error => "value_not_found_additional"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field1"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }

  mutate {
    replace => {
      "log_source_address" => "%{log.source.address}"
    }
    on_error => "no_log_source_address"
  }
  if ![no_log_source_address] {
    grok {
      match => {
        "log_source_address" => "%{IP:i_ip}:%{INT:i_port}"
      }
      on_error => "grok_fail"
    }
    if ![grok_fail] {
      mutate {
        merge => {
          "intermediary.ip" => "i_ip"
        }
        on_error => "no_intermediary_ip"
      }
      mutate {
        convert => {
          "i_port" => "integer"
        }
        on_error => "conversion_failed"
      }
      if ![conversion_failed] {
        mutate {
          rename => {
            "i_port" => "intermediary.port"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "parsed_LogChannel" => "%{parsed.LogChannel}"
    }
    on_error => "no_parsed_LogChannel"
  }
  if [parsed_LogChannel] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{parsed_LogChannel}"
      }
      on_error => "no_parsed_LogChannel_label"
    }
  }

  mutate {
    replace => {
      "parsed_FormatVersion" => "%{parsed.FormatVersion}"
    }
    on_error => "no_parsed_format_version"
  }
  if [parsed_FormatVersion] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{parsed_FormatVersion}"
      }
      on_error => "no_parsed_format_version_label"
    }
  }

  mutate {
    replace => {
      "parsed_EventID" => "%{parsed.EventID}"
    }
    on_error => "no_parsed_event_id"
  }
  if [parsed_EventID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{parsed_EventID}"
      }
      on_error => "no_parsed_event_id_label"
    }
  }

  mutate {
    replace => {
      "parsed_CompanyID" => "%{parsed.CompanyID}"
    }
    on_error => "no_parsed_company_id"
  }
  if [parsed_CompanyID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.product_object_id" => "%{parsed_CompanyID}"
      }
      on_error => "no_parsed_company_id_label"
    }
  }

  mutate {
    replace => {
      "parsed_Realm" => "%{parsed.Realm}"
    }
    on_error => "no_parsed_realm_label"
  }
  if [parsed_Realm] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{parsed_Realm}"
      }
      on_error => "no_parsed_realm_label_replace_error"
    }
  }

  mutate {
    replace => {
      "parsed_UserHostAddress" => "%{parsed.UserHostAddress}"
    }
    on_error => "no_parsed_user_host_address"
  }
  if [parsed_UserHostAddress] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "parsed_UserHostAddress"
        "event.idm.read_only_udm.principal.asset.ip" => "parsed_UserHostAddress"
      }
      on_error => "no_parsed_user_host_address_merge_error"
    }
    if ![no_parsed_user_host_address] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  mutate {
    replace => {
      "host_name" => "%{host.name}"
    }
    on_error => "no_host_name"
  }
  if [host_name] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host_name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host_name}"
      }
      on_error => "no_host_name_present"
    }
    if ![no_host_name_present] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  mutate {
    replace => {
      "parsed_RequestID" => "%{parsed.RequestID}"
    }
    on_error => "no_parsed_request_id"
  }

  if [parsed_RequestID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.id" => "%{parsed_RequestID}"
      }
      on_error => "no_parsed_request_id_label"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.metadata.id" => "bytes"
      }
    }
  }

  mutate {
    replace => {
      "meta_cloud_availability_zone" => "%{meta.cloud.availability_zone}"
    }
    on_error => "no_meta_cloud_availability_zone"
  }
  if [meta_cloud_availability_zone] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.name" => "%{meta_cloud_availability_zone}"
      }
      on_error => "no_meta_cloud_availability_zone_replace_error"
    }
  }

  mutate {
    replace => {
      "meta_cloud_region" => "%{meta.cloud.region}"
    }
    on_error => "no_meta_cloud_region_replace"
  }
  if [meta_cloud_region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{meta_cloud_region}"
      }
      on_error => "no_meta_cloud_region_replace_label"
    }
  }

  mutate {
    replace => {
      "host_id" => "%{host.id}"
    }
    on_error => "no_host_id"
  }
  if [host_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.id" => "%{host_id}"
      }
      on_error => "no_host_id_present"
    }
  }

  if [LogstashPod] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{LogstashPod}"
      }
      on_error => "no_logstash_pod"
    }
  }

  for index, value in tags {
    mutate {
      replace => {
        "tags_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "no_index_convert"
    }
    if [value] != "" {
      mutate {
        replace => {
          "tags_label.key" => "tag_%{index}"
          "tags_label.value" => "%{value}"
        }
        on_error => "no_tags_label"
      }
      if ![no_tags_label] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "tags_label"
          }
          on_error => "no_tags_label_merge"
        }
      }
    }
  }

  mutate {
    replace => {
      "fields_appliance_id" => "%{fields.ApplianceID}"
    }
    on_error => "no_fields_appliance_id"
  }
  if [fields_appliance_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.asset_id" => "%{fields_appliance_id}"
      }
      on_error => "no_fields_appliance_id_replace"
    }
  }

  if [nat_ip] != "" {
    mutate{
      merge => {
        "event.idm.read_only_udm.principal.nat_ip" => "nat_ip"
      }
    }
  }
  if [ip] != "" {
    mutate{
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip"
      }
    }
  }
  if [domain] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.principal.domain.name" => "%{domain}"
      }
    }
  }
  if [Realm] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{Realm}"
      }
      on_error => "no_realm"
    }
  }
  if [suser] != "" {
    grok {
      match => {
        "suser" => "(?P<user_email>[a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\\.[a-zA-Z]+)"
      }
      on_error => "not_email"
      overwrite => ["user_email"]
    }
  }
  if [src] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src"
      }
      on_error => "invalid_ip"
    }
  }
  if [cn1Label] == "Priority" {
    if [cn1] == "1" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    if [cn1] == "2" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    if [cn1] in ["3", "4"] {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
  }
  if [cs1Label] == "BrowserSession" {
    if [cs1] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.session_id" => "%{cs1}"
        }
      }
    }
  }
  if [cs3Label] == "CompanyName" {
    if [cs3] != "" {
      mutate {
        replace => {
          "company_label.key" => "CompanyName"
          "company_label.value.string_value" => "%{cs3}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "company_label"
        }
      }
    }
  }
  if [Company] != "" {
    mutate {
      replace => {
        "company_label1.key" => "Company"
        "company_label1.value.string_value" => "%{Company}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "company_label1"
      }
    }
  }
  if [CompanyID] != "" {
    mutate {
      replace => {
        "company_id_label.key" => "CompanyID"
        "company_id_label.value.string_value" => "%{CompanyID}"
      }
      on_error => "no_company_id"
    }
    if ![no_company_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "company_id_label"
        }
        on_error => "no_company_id_label"
      }
    }
  }
  if [PEN] != "" {
    mutate {
      replace => {
        "pen_label.key" => "PEN"
        "pen_label.value.string_value" => "%{PEN}"
      }
      on_error => "no_pen"
    }
    if ![no_pen] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "pen_label"
        }
        on_error => "no_pen_label"
      }
    }
  }
  if [ApplianceID] != "" {
    mutate {
      replace => {
        "appliance_id_label.key" => "ApplianceID"
        "appliance_id_label.value.string_value" => "%{ApplianceID}"
      }
      on_error => "no_appliance_id"
    }
    if ![no_appliance_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "appliance_id_label"
        }
        on_error => "no_appliance_id_label"
      }
    }
  }
  if [ApplianceMachineName] != "" {
    mutate {
      replace => {
        "appliance_machine_name_label.key" => "ApplianceMachineName"
        "appliance_machine_name_label.value.string_value" => "%{ApplianceMachineName}"
      }
      on_error => "no_appliance_machine_name"
    }
    if ![no_appliance_machine_name] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "appliance_machine_name_label"
        }
        on_error => "no_appliance_machine_name_label"
      }
    }
  }
  if [RequestID] != "" {
    mutate {
      replace => {
        "request_id_label.key" => "RequestID"
        "request_id_label.value.string_value" => "%{RequestID}"
      }
      on_error => "no_request_id"
    }
    if ![no_request_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "request_id_label"
        }
        on_error => "no_request_id_label"
      }
    }
  }
  if [UseJava] != "" {
    mutate {
      replace => {
        "use_java_label.key" => "UseJava"
        "use_java_label.value.string_value" => "%{UseJava}"
      }
      on_error => "no_use_java"
    }
    if ![no_use_java] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "use_java_label"
        }
        on_error => "no_use_java_label"
      }
    }
  }
  if [SecureAuthIdPProductType] != "" {
    mutate {
      replace => {
        "productType_label.key" => "SecureAuthIdPProductType"
        "productType_label.value.string_value" => "%{SecureAuthIdPProductType}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "productType_label"
      }
    }
  }

  if [SecureAuthIdPAppliance] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.administrative_domain" => "%{SecureAuthIdPAppliance}"
      }
    }
  }
  if [SecureAuthIdPApplianceMachineName] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{SecureAuthIdPApplianceMachineName}"
      }
    }
  }
  if [SecureAuthIdPDestinationSiteUrl] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.url" => "%{SecureAuthIdPDestinationSiteUrl}"
      }
    }
  } else if [SAMLConsumerURL] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.url" => "%{SAMLConsumerURL}"
      }
    }
  }
  if [action_msg] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{action_msg}"
      }
    }
  }
  if [spid] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{spid}"
      }
    }
  }
  if [sec_msg] != "" {
    mutate{
      replace => {
        "security_result.description" => "%{sec_msg}"
      }
    }
  }else if [Message] != "" {
    grok {
      match => {
        "Message" => "RequestDuration=%{GREEDYDATA:Message}"
      }
      overwrite => ["Message"]
      on_error => "no_message"
    }
    mutate{
      replace => {
        "security_result.description" => "%{Message}"
      }
    }
  }

  if [dst] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dst"
      }
    }
  }
  if [dvc] != "" {
    mutate{
      merge => {
        "intermediary.ip" => "dvc"
      }
    }
  }
  if [UserID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{UserID}"
      }
    }
  }
  if [Priority] != "" {
    if [Priority] == "1" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    if [Priority] == "2" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    if [Priority] in ["3", "4"] {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
  }
  if [UserAgent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{UserAgent}"
      }
    }
  }
  if [Appliance] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.domain.name" => "%{Appliance}"
      }
    }
  }
  if [UserHostAddress] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "UserHostAddress"
      }
    }
  }
  if [SecureAuthIdPAuthGuiMode] == "0" {
    grok {
      match => {
        "message" => ".*SecureAuthIdPTrxResult\\=%{DATA:auth_result}\\s?SecureAuth.*"
      }
    }
    if [auth_result] == "Success" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
    }
    else if [auth_result] =="WS-Trust success."{
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
        }
      }
    }
    else if [auth_result] == "Session Aborted" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    if [suser] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{suser}"
        }
      }
    }
    if [not_email] == false and [user_email] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.email_addresses" => "user_email"
        }
      }
    }
  }
  else if [UserHostAddress] != "" and [HostName] != "" or ([host_name] != "" and [UserHostAddress] != "") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [ip] != "" or [HostName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [UserHostAddress] != "" and [HostName] == "" and [UserID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [intermediary] != "" {
    mutate{
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.extensions.auth.type" => "SSO"
      "event.idm.read_only_udm.metadata.vendor_name" => "SECUREAUTH_SSO"
      "event.idm.read_only_udm.metadata.product_name" => "SECUREAUTH_SSO"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
