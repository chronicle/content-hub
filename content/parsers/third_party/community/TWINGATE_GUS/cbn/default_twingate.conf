# Product: TWINGATE
# Category: VPN
# Supported Format: JSON
# Reference: NA
# Last Updated: 2024-12-11
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "event_type" => ""
      "event_data" => ""
      "version" => ""
      "time" => ""
      "domain" => ""
      "root" => ""
      "status" => ""
      "device_name" => ""
      "event_data.connection" => ""
      "connection_client_ip" => ""
      "connection_protocol" => ""
      "connection_bytes_received" => ""
      "connection_bytes_transferred" => ""
      "event_data.connector" => ""
      "connector_id" => ""
      "connector_name" => ""
      "event_data.remote_network" => ""
      "remote_network_id" => ""
      "remote_network_name" => ""
      "event_data.resource" => ""
      "resource_address" => ""
      "resource_id" => ""
      "resource_ip" => ""
      "resource_port" => ""
      "event_data.relays" => ""
      "relays.0.ip" => ""
      "relays.0.name" => ""
      "relays.0.port" => ""
      "device_id" => ""
      "event_data.user" => ""
      "user_id" => ""
      "user_email" => ""
      "metadata_event_type" => ""
      "principal_mid_present" => ""
      "principal_user_present" => ""
      "event_data_type" => ""
      "connection_protocol_label" => ""
      # udm noun
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "src" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "intermediary" => ""
      "actor_id" => ""
      "actor_email" => ""
      "event1_act" => ""
      "event_data.version" => ""
      "actor_type" => ""
      "roles.name" => ""
      "event_data.targets.name" => ""
      "targets.id" => ""
      "event_data.targets.id" => ""
      "targets.name" => ""
      "targetlist.id" => ""
      "targets.type" => ""
      "targets.version" => ""
      "targetlist.address.value" => ""
      "event_data.actor.info.email" => ""
      "has_target" => "false"
    }
  }
  mutate{
     gsub => ["message", "event", "event_data"]
  }
  mutate {
    gsub => ["message", "\\r\\n", " "]
  }
  json {
   source => "message"
   array_function => "split_columns"
   on_error => "not_json"
  }

  if [event_data_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{event_data_type}"
      }
      on_error =>  "event_data_type_invalid"
    }
  }
  mutate {
    convert => {
      "event_data.version" => "string"
    }
    on_error => "event_data_version_already_string"
  }
  mutate {
    replace => {
      "version" => "%{event_data.version}"
    }
    on_error => "version_not_found"
  }
  if [version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{version}"
      }
      on_error =>  "version_invalid"
    }
  }
  mutate {
    replace => {
      "time" => "%{event_data.time}"
    }
    on_error => "time_not_found"
  }
  if [time] != "" {
    date {
      match => ["time", "yyyy-MM-dd HH:mm:ss.SSSSSS+Z.Z", "ISO8601", "RFC3339"]
      on_error => "wrong_match"
    }
  }
  mutate {
    replace => {
      "domain" => "%{event_data.domain}"
    }
    on_error => "domain_not_found"
  }
  if [domain] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{domain}"
        "principal.asset.hostname" => "%{domain}"
      }
      on_error =>  "domain_invalid"
    }
  }
  mutate {
    replace => {
      "root" => "%{event_data.root}"
    }
    on_error => "root_not_found"
  }
  if [root] != "" {
    mutate {
      replace => {
        "src.hostname" => "%{root}"
      }
      on_error =>  "root_invalid"
    }
  }
  mutate {
    replace => {
      "status" => "%{event_data.status}"
    }
    on_error => "status_not_found"
  }
  if [status] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{status}"
      }
      on_error => "status_unavailable"
    }
   }

  mutate {
    replace => {
      "connection_client_ip" => "%{event_data.connection.client_ip}"
    }
    on_error => "connection_client_ip_not_found"
  }
  if [connection_client_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "connection_client_ip"
        "principal.asset.ip" => "connection_client_ip"
      }
      on_error => "client_ip_not_found"
    }
    if ![client_ip_not_found] {
      mutate {
        replace => {
          "principal_mid_present" => "true"
        }
      }
    }
   }

  mutate {
    replace => {
      "connection_protocol" => "%{event_data.connection.protocol}"
    }
    on_error => "connection_protocol_not_found"
  }
  mutate {
    uppercase => [ "connection_protocol" ]
  }
  if [connection_protocol] in ["EIGRP", "ESP", "ETHERIP", "GRE", "ICMP", "IGMP", "IP6IN4", "PIMTCP", "TCP", "UDP", "VRRP"] {
    mutate {
      replace => {
        "network.ip_protocol" => "%{connection_protocol}"
      }
      on_error => "connection_protocol_invalid"
    }
  }
  else if [connection_protocol] != "" {
    mutate {
      replace => {
        "connection_protocol_label.key" => "connection_protocol"
        "connection_protocol_label.value" => "%{connection_protocol}"
      }
      on_error => "connection_protocol_error"
    }
    if ![connection_protocol_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "connection_protocol_label"
        }
        on_error => "no_detection_fields_connection_protocol"
      }
    }
  }
  mutate {
    convert => {
      "event_data.connection.bytes_received" => "string"
    }
    on_error => "connection_bytes_received_is_already_string"
   }
  mutate {
    replace => {
      "connection_bytes_received" => "%{event_data.connection.bytes_received}"
    }
    on_error => "bytes_not_received"
  }
  if [connection_bytes_received] != "" {
    mutate {
      convert => {
        "connection_bytes_received" => "uinteger"
      }
      on_error => "bytes_received_conversion_failed"
    }
    mutate {
      rename => {
        "connection_bytes_received" => "network.received_bytes"
      }
      on_error => "bytes_transferred_not_present"
    }
  }
  mutate {
    convert => {
      "event_data.connection.bytes_transferred" => "string"
    }
    on_error => "connection_bytes_transferred_is_already_string"
  }
  mutate {
    replace => {
      "connection_bytes_transferred" => "%{event_data.connection.bytes_transferred}"
    }
    on_error => "bytes_not_transferred"
  }

  if [connection_bytes_transferred] != "" {
    mutate {
      convert => {
        "connection_bytes_transferred" => "uinteger"
      }
      on_error => "conversion_failed_bytes_transferred"
    }
    mutate {
      rename => {
        "connection_bytes_transferred" => "network.sent_bytes"
      }
      on_error => "bytes_transferred_not_present"
    }

  }
  mutate {
    replace => {
      "connector_id" => "%{event_data.connector.id}"
    }
    on_error =>  "connector_id_invalid_not_present"
  }
  if [connector_id] != "" {
    mutate {
      replace => {
        "connector_id_label.key" => "connector_id"
        "connector_id_label.value.string_value" => "%{connector_id}"
      }
      on_error => "connector_id_invalid"
    }
    if ![connector_id_invalid] {
      mutate {
        merge => {
          "additional.fields" => "connector_id_label"
        }
        on_error => "connector_id_label_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "connector_name" => "%{event_data.connector.name}"
    }
    on_error =>  "connector_name_invalid_not_present"
  }
  if [connector_name] != "" {
    mutate {
      replace => {
        "connector_name_label.key" => "connector_name"
        "connector_name_label.value.string_value" => "%{connector_name}"
      }
      on_error => "connector_name_invalid"
    }
    if ![connector_name_invalid] {
      mutate {
        merge => {
          "additional.fields" => "connector_name_label"
        }
        on_error => "connector_name_label_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "remote_network_id" => "%{event_data.remote_network.id}"
    }
    on_error =>  "remote_network_id_not_present"
  }
  if [remote_network_id] != ""{
     mutate {
      replace => {
        "network.session_id" => "%{remote_network_id}"
      }
      on_error =>  "remote_network_id_not_found"
    }
  }
  mutate {
    replace => {
      "remote_network_name" => "%{event_data.remote_network.name}"
    }
    on_error =>  "remote_network_name_not_present"
  }
  if [remote_network_name] != "" {
    mutate {
      replace => {
          "network.dhcp.sname" => "%{remote_network_name}"
      }
      on_error =>  "remote_network_name_not_found"
    }
  }
  mutate {
    replace => {
      "resource_id" => "%{event_data.resource.id}"
    }
    on_error =>  "resource_id_not_present"
  }
  if [resource_id] != "" {
    mutate {
      replace => {
      "resource.product_object_id" => "%{resource_id}"
      }
      on_error => "resource_id_not_found"
    }
  }

  if [resource_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "resource_ip"
        "principal.asset.ip" => "resource_ip"
      }
      on_error => "resource_ip_not_found"
    }
    if ![resource_ip_not_found] {
      mutate {
        replace => {
          "principal_mid_present" => "true"
        }
      }
    }
  }
  mutate {
    convert => {
      "event_data.resource.port" => "string"
    }
    on_error => "resourse_port_is_already_string"
  }
  mutate {
    replace => {
      "resource_port" => "%{event_data.resource.port}"
    }
    on_error => "resource_port_not_found"
  }
  if [resource_port] != "" {
    mutate {
      convert => {
        "resource_port" => "integer"
      }
      on_error => "not_valid_port"
    }
    mutate {
      rename => {
        "resource_port" => "principal.port"
      }
      on_error => "resource_port_not_present"
    }
  }
  mutate {
    replace => {
      "resource_address" => "%{event_data.resource.address}"
    }
    on_error => "resource_address_not_found"
  }
  if [resource_address] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{resource_address}"
        "principal.asset.hostname" => "%{resource_address}"
        "principal_mid_present" => "true"
      }
      on_error => "resource_address_not present"
    }
  }

  mutate {
    replace => {
      "user_id" => "%{event_data.user.id}"
    }
    on_error => "user_id_not_found"
  }
  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
        "principal_user_present" => "true"
      }
      on_error => "event_data_user_id_not_present"
    }
  }
  mutate {
    replace => {
      "user_email" => "%{event_data.user.email}"
    }
    on_error => "user_email_not_found"
  }
  if [user_email] != "" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "user_email"
      }
      on_error => "user_email_not_present"
    }
    if ![user_email_not_present] {
      mutate {
        replace => {
          "principal_user_present" => "true"
        }
      }
    }
  }

  mutate {
    replace => {
      "device_id" => "%{event_data.device.id}"
    }
    on_error => "device_id_not_converted"
  }

  if [device_id] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{device_id}"
      }
      on_error => "device_id_not_present"
    }
    if ![device_id_not_present] {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{device_id}"
        }
        on_error => "device_log_id_not_present"
      }
    }
  }
  mutate {
    replace => {
      "device_name" => "%{event_data.device.name}"
    }
    on_error => "device_name_not_converted"
  }
  if [device_name] != "" {
    mutate {
      replace => {
        "attribute_label.key" => "device.name"
        "attribute_label.value" => "%{device_name}"
      }
      on_error => "device_name_not_present"
    }
    if ![device_name_not_present] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "attribute_label"
        }
      }
    }
  }

  for reasonIndex, reason in event_data.reasons {
    mutate {
      convert =>  {
        "reasonIndex" => "string"
      }
      on_error => "reason_index_is_already_string"
    }
    mutate {
      replace => {
        "reason_id_label" => ""
        "reason_name_label" => ""
      }
    }

    if [reason][id] != "" {
      mutate {
        replace => {
          "reason_id_label.key" => "reason_id_%{reasonIndex}"
          "reason_id_label.value" => "%{reason.id}"
        }
        on_error => "reason_id_label_not_found"
      }
      if ![reason_id_label_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "reason_id_label"
          }
          on_error => "reason_id_label_merge_failed"
        }
      }
    }
    if [reason][name] != "" {
      mutate {
        replace => {
          "reason_name_label.key" => "reason_name_%{reasonIndex}"
          "reason_name_label.value" => "%{reason.name}"
        }
        on_error => "reason_name_label_not_found"
      }
      if ![reason_name_label_not_found] {
        mutate {
          merge => {
            "security_result.detection_fields" => "reason_name_label"
          }
          on_error => "reason_name_label_merge_failed"
        }
      }
    }
  }
  for index, relay in event_data.relays {
    mutate {
      replace => {
        "intermediary" => ""
        "relay_port" => ""
      }
    }
    mutate {
      merge => {
        "intermediary.ip" => "relay.ip"
      }
      on_error => "relay_ip_not_found"
    }

    mutate {
      replace => {
        "intermediary.hostname" => "%{relay.name}"
      }
      on_error => "relay_name_invalid"
    }

    mutate {
      convert => {
        "relay.port" => "string"
      }
      on_error => "relay_port_already_string"
    }
    mutate {
      replace => {
        "relay_port" => "%{relay.port}"
      }
      on_error => "relay_port_not_found"
    }
    if [relay_port] != "" {
      mutate {
        replace => {
          "intermediary.port" => "%{relay_port}"
        }
        on_error => "relay_port_invalid"
      }
      mutate {
        convert => {
          "intermediary.port" => "integer"
        }
        on_error => "relay_port_is_interger"
      }
    }
  }
  mutate {
    replace => {
      "roles.name" => "%{event_data.actor.type}"
    }
    on_error => "no_actor_type"
  }
  if ![no_actor_type] {
    mutate {
      merge => {
        "principal.user.attribute.roles" => "roles"
      }
      on_error => "actor_type_merge_failed"
    }
  }
  mutate {
    replace => {
      "actor_id" => "%{event_data.actor.id}"
    }
    on_error => "no_actor_type"
  }
  if [actor_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{event_data.actor.id}"
        "principal_user_present" => "true"
      }
      on_error => "actor_id_not_found"
    }
  }
  mutate {
    replace => {
      "actor_email" => "%{event_data.actor.info.email}"
    }
    on_error => "no_actor_email"
  }
  if [actor_email] != "" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "actor_email"
      }
      on_error => "actor_email_not_found"
    }
  }
  mutate {
    replace => {
      "event1_act" => "%{event_data.action}"
    }
    on_error => "action_not_found"
  }
  if [event1_act] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{event_data.action}"
      }
      on_error => "action_value_invalid"
    }
  }
  if [event_data][version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{event_data.version}"
      }
      on_error => "version_invalid"
    }
  }
  for targetlist in event_data.targets {
    mutate {
      replace => {
        "targetlist_label" => ""
        "targetlist1_label" => ""
        "targetlist2_label" => ""
        "targetlist3_label" => ""
        "targetlist4_label" => ""
        "targetlist5_label" => ""
        "temail" => ""
        "role1" => ""
        "targets_value1" => ""
      }
    }
    if [targetlist][id] != "" {
      mutate {
        replace => {
          "targetlist_label.key" => "id"
          "targetlist_label.value" => "%{targetlist.id}"
        }
        on_error => "targetlistid_label_empty"
      }
    }
    if ![targetlistid_label_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "targetlist_label"
        }
        on_error => "no_targetlist_label"
      }
    }
    if [targetlist][name] != ""{
      mutate {
        replace => {
          "targetlist1_label.key" => "name"
          "targetlist1_label.value" => "%{targetlist.name}"
        }
        on_error => "targetlistname_label_empty"
      }
    }
    if ![targetlistname_label_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "targetlist1_label"
        }
        on_error => "no_targetlist_name_label"
      }
    }
    if [targetlist][type] != ""{
      mutate {
        replace => {
          "targetlist2_label.key" => "type"
          "targetlist2_label.value" => "%{targetlist.type}"
        }
        on_error => "targetlisttype_label_empty"
      }
    }
    if ![targetlisttype_label_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "targetlist2_label"
        }
        on_error => "no_targetlist_type_label"
      }
    }
    if [targetlist][version] != ""{
      mutate {
        replace => {
          "targetlist3_label.key" => "version"
          "targetlist3_label.value" => "%{targetlist.version}"
        }
        on_error => "targetlistversion_label_empty"
      }
    }
    if ![targetlistversion_label_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "targetlist3_label"
        }
        on_error => "no_targetlist_version_label"
      }
    }
    mutate {
      replace => {
        "temail" => "%{targetlist.email}"
      }
      on_error => "email_label_empty"
    }
    if [temail] != "" {
      mutate {
        replace => {
          "targetlist4_label.key" => "email"
          "targetlist4_label.value" => "%{temail}"
        }
        on_error => "targetlistemail_label_empty"
      }
      if ![targetlistemail_label_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "targetlist4_label"
          }
          on_error => "no_targetlist_email_label"
        }
      }
    }
    mutate {
      replace => {
        "role1" => "%{targetlist.role}"
      }
      on_error => "role_label_empty"
    }
    if [role1] != "" {
      mutate {
        replace => {
          "targetlist5_label.key" => "role"
          "targetlist5_label.value" => "%{role1}"
        }
        on_error => "targetlistrole_label_empty"
      }
      if ![targetlistrole_label_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "targetlist5_label"
          }
          on_error => "no_targetlist_role_label"
        }
      }
    }
    mutate {
      replace => {
        "targets_value1" => "%{targetlist.address.value}"
      }
      on_error => "no_actor_email"
    }
    if [targets_value1] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "targets_value1"
          "event.idm.read_only_udm.target.asset.ip" => "targets_value1"
        }
        on_error => "no_target_ip"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  # metadata info
  mutate {
    replace => {
      "metadata.vendor_name" => "TWINGATE"
      "metadata.product_name" => "Twingate"
    }
  }
   # set metadata.event_type
  if [metadata_event_type] == "" {
    if [principal_user_present] == "true" or ([principal_user_present] == "true" and [has_target] == "true") {
      mutate {
        replace => {
          "metadata_event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [principal_mid_present] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  if [metadata_event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{metadata_event_type}"
      }
      on_error => "metadata_event_type_invalid"
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [src] != "" {
    mutate {
      rename => {
        "src" => "event.idm.read_only_udm.src"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }


  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_invalid"
    }
  }

  mutate {
    merge => {
     "@output" => "event"
    }
  }
}
