# Product: SecureLink
# Category: Remote Access Tools
# Supported Format: SYSLOG
# Reference: https://www.securelink.com/
# Last Updated: 2026-09-03
# Copyright 2026 Google SecOps

filter {

  mutate {
    replace => {
      "url" => ""
      "application" => ""
      "service" => ""
      "desc" => ""
      "mechanism" => ""
      "category" => ""
      "target_host" => ""
      "principal_host" => ""
      "intermediary_host" => ""
      "target_port" => ""
      "principal_port" => ""
      "auth_type" => ""
      "security_action" => ""
      "name" => ""
      "text" => ""
      "reason" => ""
      "type" => ""
      "key" => ""
      "_target" => ""
      "_principal" => ""
      "_metadata" => ""
      "_extensions" => ""
      "_network" => ""
      "_security_result" => ""
      "event_id" => ""
      "resource_name" => ""
      "method" => ""
      "description" => ""
      "inner_message" => ""
      "product_event_type" => ""
      "sessionId" => ""
      "src_ip" => ""
      "ip_list" => ""
      "login_status" => ""
      "process_id" => ""
      "user_id" => ""
      "dst_ip" => ""
      "command" => ""
      "pwd" => ""
      "event_time" => ""
      "username" => ""
      "action" => ""
      "principal_uri" => ""
      "file_path" => ""
      "login_ip" => ""
      "priority" => ""
      "classification" => ""
      "msg" => ""
      "port_type" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "_metadata.event_type" => ""
      "port" => ""
      "host" => ""
      "target_port_value" => ""
      "localPort" => ""
      "portType" => ""
      "requireLocalPort" => ""
      "launchHostType" => ""
      "auditDisabled" => ""
      "required_local_port" => ""
      "date_parse_error" => ""
    }
  }

  ## Parsing Headers:
  grok {
    match => {
      "message" => [
      "<%{NONNEGINT:syslog_pri}>SecureLink:  %{WORD:event_id}:  %{GREEDYDATA:log_message}"
      "<%{NONNEGINT:syslog_pri}>%{INT}%{SPACE}%{TIMESTAMP_ISO8601:event_time}%{SPACE}%{INT}%{SPACE}SecureLink:%{SPACE}%{WORD:event_id}:%{SPACE}%{GREEDYDATA:log_message}"
      "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:principal_host} %{DATA:product_event_type}(\\[%{DATA}\\])?:\\s+%{GREEDYDATA:inner_message}"
      "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:principal_host} (?P<inner_message>.*run-parts.*)"
      "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:principal_host} (?P<inner_message>%{DATA:principal_uri} File %{DATA:file_path} %{GREEDYDATA})"
      "<%{INT}>%{SYSLOGTIMESTAMP:event_time} %{DATA:principal_host} (?P<inner_message>%{GREEDYDATA})"
      "%{TIMESTAMP_ISO8601:event_time} %{HOST:principal_host} %{DATA:application} - - - %{WORD:event_id} %{GREEDYDATA:log_message}"
      ]
    }
    overwrite => [ "event_id", "log_message", "principal_host", "principal_uri", "file_path", "inner_message", "product_event_type", "process_id", "event_time", "application" ]
    on_error => "header_grok_failed"
  }
  if [principal_uri] != "" {
    mutate {
      replace => {
        "_principal.url" => "%{principal_uri}"
      }
    }
  }

  if [event_time] != "" {
    date {
      match => ["event_time", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
      rebase => true
      on_error => "date_parse_error"
    }
    if [date_parse_error] {
      date {
        match => ["event_time", "yyyy-MM-ddTHH:mm:ss.SSSZ", "yyyy-MM-ddTHH:mm:ss.SSS", "ISO8601"]
        target => "_metadata.event_timestamp"
        on_error => "event_timestamp_parse_error"
      }
    }
  }
  ## Starting as GENERIC_EVENT
  mutate {
    replace => {
      "_metadata.vendor_name" => "SecureLink"
      "_metadata.product_name" => "SecureLink"
      "_metadata.event_type" => "GENERIC_EVENT"
    }
  }

  if [event_id] == "AUDIT" {
    ## Log Event AUDIT

    grok {
      match => {
        "log_message" => [
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action}: %{DATA:service}, Application: %{DATA:application}, port %{INT:target_port}@%{DATA:target_host}\\), duration: %{DATA:duration}\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action}: %{DATA:service}, Application: %{DATA:application}, port %{INT:target_port}\\), duration: %{DATA:duration}\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} Application %{DATA:application} \\(%{DATA:reason}\\), duration %{DATA:duration}\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} Application %{DATA:application}\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} Application %{DATA:applicatin} - %{DATA:hostname} \\(%{NONNEGINT:num}\\) \\(%{DATA:reason}\\), duration %{DATA:duration}\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} Application %{DATA:application} - %{DATA:hostname} \\(%{NONNEGINT:num}\\)\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} Application %{DATA:client}-Client - %{DATA:application} \\(%{DATA:reason}\\), duration %{DATA:duration}\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} Application %{DATA:application} \\(%{NONNEGINT:num}\\) \\(%{DATA:reason}\\), duration %{DATA:duration}\\.",
        "Vendor Rep %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} Application %{DATA:application} \\(%{NONNEGINT:num}\\)\\.",
        "User %{DATA:name} \\(%{DATA:username}\\) %{DATA:action}: %{DATA:service} \\(%{DATA:application} on port %{INT:target_port}@%{IPORHOST:target_host}\\), duration: %{DATA:duration}\\.",
        "User %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} %{DATA:client}-Client - %{DATA:application} - %{DATA:host}\\.",
        "User %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} %{DATA:client}-Client - %{DATA:application} - %{DATA:host} \\(%{DATA:reason}\\), duration %{DATA:duration}\\.",
        "User %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} to %{DATA:application}\\.",
        "User %{DATA:name} \\(%{DATA:username}\\) %{DATA:action} from %{DATA:application} \\(%{DATA:reason}\\), duration %{DATA:duration}\\."
        ]
      }
      overwrite => ["name", "username", "action", "service", "application", "client", "target_port", "target_host", "reason", "duration", "host"]
      on_error => "audit_grok_failure"
    }

    if [username] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_target.user.email_addresses" => "username"
        }
      }
    }
    if [username] != "" {
      mutate {
        replace => {
          "_target.user.userid" = "%{username}"
        }
        on_error => "username_empty"
      }
    }

    mutate {
      replace => {
        "_target.user.user_display_name" = "%{name}"
        "desc" = "%{username} %{action} %{service} %{application} "
      }
    }

    if [application] != "" {
      mutate {
        replace => {
          "_target.application" = "%{application}"
        }
      }
    }

    if [action] in ["connected", "connected to", "accessed service", "disconnected", "disconnected from"] {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_UNCATEGORIZED"
        }
      }
    }

    if [reason] != "" {
      mutate {
        replace => {
          "_security_result.summary" => "%{reason}"
        }
      }
    }

  } else if [event_id] == "ADMIN" {
    ## Log Event ADMIN
    grok {
      match => {
        "log_message" => [
        "User: %{DATA:username}, Method: %{WORD:method}, Type: %{DATA:type}, Key: %{DATA:key}, Text: %{GREEDYDATA:text}",
        "User: %{DATA:username}, Method: %{WORD:method}, Type: %{DATA:type}, Key: .*?, Text: %{GREEDYDATA:text}",
        "User: %{DATA:username}, Method: %{WORD:method}, Type: %{DATA:type}, Key: %{DATA:key} Text: %{GREEDYDATA:text}",
        "User: %{DATA:username}, Method: %{WORD:method}, Type: %{DATA:type}, Key: %{DATA:key}, Text:"
        "User: %{DATA:username}, Method: %{DATA:method}, Type: %{DATA:type}"
        ]
      }
      overwrite => ["method", "type", "key", "text", "username"]
      on_error => "admin_grok_failure"
    }

    if [username] != "" {
      mutate {
        replace => {
          "_metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }

    mutate {
      replace => {
        "desc" = "%{username} %{type} %{text}"
      }
    }

    grok {
      match => {
        "text" => [
          "%{IPV4:login_ip}] Logged in"
        ]
      }
      overwrite => ["login_ip"]
      on_error => "not_an_ip"
    }

    if ![not_an_ip] {
      mutate {
        merge => {
          "_principal.ip" => "login_ip"
        }
        on_error => "login_ip_not_an_ip"
      }
      if ![login_ip_not_an_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }

    if [username] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_principal.user.email_addresses" => "username"
        }
      }
    }
    if [username] != "" {
      mutate {
        replace =>{
          "_principal.user.userid" = "%{username}"
        }
      }
    }
  } else if [inner_message] != "" {
    if [product_event_type] == "systemd" {
      grok {
        match => {
          "inner_message" => [
            "(?P<action>(Created|Removed) slice) (?P<description>User Slice of %{NOTSPACE:username}.)"
            "(?P<action>(Starting|Started) Session) %{GREEDYDATA:sessionId} of user %{WORD:username}"
            "(?P<action>(Starting|Started|Stopping|Stopped)) %{GREEDYDATA:description}"
            "%{GREEDYDATA:description}"
          ]
        }
        overwrite => ["action", "description", "username", "sessionId"]
      }

      if [action] in ["Starting Session","Started Session"] {
        if [username] != "" {
          mutate {
            replace => {
              "_principal.user.userid" => "%{username}"
            }
          }
        }
        mutate {
          replace => {
            "_metadata.event_type" => "USER_UNCATEGORIZED"
            "_network.session_id" => "%{sessionId}"
            "_security_result.description" => "%{action}"
          }
        }
      } else if [action] in [ "Created slice", "Removed slice" ] {
        mutate {
          replace => {
            "_principal.user.userid" => "%{username}"
          }
        }
        mutate {
          replace => {
            "_metadata.event_type" => "USER_UNCATEGORIZED"
            "_security_result.description" => "%{action} %{description}"
          }
        }
      } else if [action] in [ "Starting", "Started", "Stopping", "Stopped" ] {
        mutate {
          replace => {
            "_metadata.event_type" => "STATUS_UPDATE"
            "_security_result.description" => "%{action} %{description}"
          }
        }
      }
    } else if [product_event_type] == "journal" {
      grok {
        match => {
          "inner_message" => [
            "%{DATA}:\\s+%{NOTSPACE:method}\\s+(\\[.*?\\]\\s+)?(?P<description>(Ban|Unban|Found) %{IP:src_ip})"
            "%{DATA}:\\s+%{NOTSPACE:method}\\s+(?P<description>Processing line .*? ip:%{IP:src_ip})"
            "%{DATA}:\\s+%{NOTSPACE:method}\\s+(?P<description>Total # of detected failures:.*\\(IP:count\\): %{GREEDYDATA:ip_list})"
            "%{DATA}:\\s+%{NOTSPACE:method}\\s+(?P<description>.*)"
            "(?P<description>Suppressed %{INT} messages from %{DATA})"
            "%{GREEDYDATA:msg}"
          ]
        }
        overwrite => ["src_ip", "description", "method", "ip_list", "msg"]
        on_error => "journal_failure"
      }
      mutate {
        replace => {
          "_metadata.description" => "%{msg}"
        }
        on_error => "msg_empty"
      }
      if [src_ip] != "" {
        mutate {
          merge => {
            "_principal.ip" => "src_ip"
          }
          on_error => "src_ip_not_valid"
        }
        if ![src_ip_not_valid] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }

      if [ip_list] != "" {
        mutate {
          gsub => ["ip_list", ", ", "\",\""]
        }

        mutate {
          replace => {
            "ip_list" => "{\"ip_list\":[\"%{ip_list}\"]}"
          }
        }

        json {
          source => "ip_list"
          array_function => "split_columns"
          on_error => "not_in_json"
        }

        for index, ips in ip_list {
          mutate {
            replace => {
              "inner_intermediary" => ""
            }
          }
          grok {
            match => {
              "ips" => [
                "%{IP:inner_ip}:%{INT}"
                "%{IP:inner_ip}"
              ]
            }
            overwrite => ["inner_ip"]
          }

          mutate {
            merge => {
              "_principal.ip" => "inner_ip"
            }
            on_error => "inner_ip_empty"
          }
          if ![inner_ip_empty] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
      mutate {
        replace => {
          "_metadata.event_type" => "STATUS_UPDATE"
          "_security_result.description" => "%{description}"
        }
      }
    } else if [product_event_type] =~ "sshd" {
      mutate {
        replace => {
          "_target.application" => "%{product_event_type}"
          "_principal.process.pid" => "%{process_id}"
        }
      }

      grok {
        match => {
          "inner_message" => [
            "Connection (?P<login_status>closed) by ((invalid|authenticating) user %{NOTSPACE:user_id} )?%{IP:dst_ip} port %{POSINT:target_port}"
            "(?P<login_status>(Failed password for invalid user|Invalid user)) %{NOTSPACE:user_id} from %{IP:dst_ip} port %{POSINT:target_port}"
            "(?P<login_status>Disconnecting) invalid user (%{NOTSPACE:user_id} )?%{IP:dst_ip} port %{POSINT:target_port}:\\s+%{GREEDYDATA:desc}"
            "(?P<login_status>Disconnected) from (invalid )?user (%{NOTSPACE:user_id} )?%{IP:dst_ip} port %{POSINT:target_port}"
            "Received (?P<login_status>disconnect) from %{IP:dst_ip} port %{INT:target_port}"
            "%{GREEDYDATA:desc}"
          ]
        }
        overwrite => ["user_id", "dst_ip", "target_port", "login_status", "desc"]
      }

      if [dst_ip] != "" {
        mutate {
          merge => {
            "_target.ip" => "dst_ip"
          }
          on_error => "dst_ip_not_valid"
        }
        if ![dst_ip_not_valid] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
      if [user_id] != "" {
        mutate {
          replace => {
            "_target.user.userid" => "%{user_id}"
          }
        }
      }
      if [login_status] != "" and ([user_id] != "" or [dst_ip] != "") {
        mutate {
          replace => {
            "_metadata.event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }

        if [login_status] == "Accepted" or [login_status] == "success" {
          mutate {
            replace => {
              "security_action" => "ALLOW"
            }
          }
        }
        else {
          mutate {
            replace => {
              "security_action" => "BLOCK"
            }
          }

          if [login_status] =~ "(?i)(Disconnected|closed|disconnecting|disconnect)" {
            mutate {
              replace => {
                "_metadata.event_type" => "USER_LOGOUT"
              }
            }
          }
        }

        if [security_action] != "" {
          mutate {
            merge => {
              "_security_result.action" => "security_action"
            }
          }
        }
      } else {
        mutate {
          replace => {
            "_metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
    } else if [product_event_type] =~ "sudo" or [product_event_type] == "su" {
      grok {
        match => {
          "inner_message" => [
            "(?P<description>authentication (?P<login_status>success|failure)); logname=(?P<logname>.*?)\\s+uid=(?P<uid>.*?)\\s+euid=(?P<euid>.*?)\\s+tty=(?P<tty>.*?)\\s+ruser=(?P<ruser>.*?)\\s+rhost=(?P<rhost>.*?)\\s+user=(?P<user_id>.*)"
            "(?P<description>.*?session (closed|opened) for user %{NOTSPACE:user_id})",
            "TTY=%{GREEDYDATA} ; PWD=%{GREEDYDATA:pwd} ; USER=%{WORD:user_id} ; COMMAND=(?P<command>.*)"
            "(?P<description>(FAILED)?.*?\\(to %{DATA:user_id}\\).*)"
            "pam_succeed_if.*(?P<description>requirement.*?user \"%{DATA:user_id}\")"
            "(?P<description>auth could not identify password for \\[%{DATA:user_id}\\])"
            "(?P<description>conversation failed)"
          ]
        }
        overwrite => ["user_id", "description", "pwd", "command", "login_status"]
      }

      if [user_id] != "" {
        mutate {
          replace => {
            "_target.user.userid" => "%{user_id}"
            "_metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }

      if [command] != "" {
        mutate {
          replace => {
            "_target.process.command_line" => "%{command}"
          }
        }
      }

      if [pwd] != "" {
        mutate {
          replace => {
            "_target.file.full_path"  => "%{pwd}"
          }
        }
      }

      if [description] =~ "session closed" {
        mutate {
          replace => {
            "_metadata.event_type" => "USER_LOGOUT"
            "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      } else if [description] =~ "session opened" {
        mutate {
          replace => {
            "_metadata.event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      } else if [user_id] != "" {
        mutate {
          replace => {
            "_metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }

      if [login_status] != "" and ([user_id] != "") {
        mutate {
          replace => {
            "_metadata.event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }

        if [login_status] == "Accepted" or [login_status] == "success" {
          mutate {
            replace => {
              "security_action" => "ALLOW"
            }
          }
        }
        else {
          mutate {
            replace => {
              "security_action" => "BLOCK"
            }
          }
        }

        if [security_action] != "" {
          mutate {
            merge => {
              "_security_result.action" => "security_action"
            }
          }
        }
      }

      if [description] != "" {
        mutate {
          replace => {
            "_metadata.description" => "%{description}"
          }
        }
      }
    } else if [product_event_type] =~ "(?i)CROND" {
      grok {
        match => {
          "inner_message" => [
            "\\(%{DATA:user_id}\\)\\s+CMD\\s+\\(%{DATA:command}\\)",
            "\\(%{DATA:user_id}\\)\\s+(MAIL|INFO)\\s+\\(%{DATA:desc}\\)",
            "\\(%{DATA:user_id}\\)\\s+.*\\s+\\(%{DATA:url}\\)",
            "(?P<desc>sendmail: %{NOTSPACE:method}:.*?%{IP:target_host})"
          ]
        }
        overwrite => ["command", "user_id", "desc", "method", "target_host","url"]
      }
      if [user_id] != "" {
        mutate {
          replace => {
            "_target.user.userid" => "%{user_id}"
            "_metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      if [url] != "" {
        mutate {
          replace => {
            "_target.url" => "%{url}"
          }
          on_error => "url_is_empty"
        }
      }
      if [command] != "" {
        mutate {
          replace => {
            "_target.process.command_line" => "%{command}"
          }
        }
      }
      if [has_principal] == "true" and [has_target] == "true" {
        mutate {
          replace => {
            "_metadata.event_type" => "NETWORK_CONNECTION"
          }
        }
      }
    } else if [product_event_type] == "suricata" {
      grok {
        match => {
          "inner_message" => [
            "\\[%{GREEDYDATA}\\] %{GREEDYDATA:msg} \\[Classification: %{GREEDYDATA:classification}\\] \\[Priority: %{INT:priority}\\] \\{%{WORD:proto}\\} %{IP:src_ip}:%{INT:principal_port} -> %{IP:dst_ip}:%{INT:target_port}",
            "<%{DATA:method}>\\s+(?P<desc>.*?\"%{DATA:pwd}\".*)",
            "<%{DATA:method}>\\s+(?P<desc>.*)",
          ]
        }
        overwrite => ["method", "desc", "pwd", "src_ip","dst_ip", "target_port", "principal_port", "priority", "classification", "msg"]
        on_error => "suricata_inner_msg_failure"
      }
      mutate {
        replace => {
          "_metadata.description" => "%{msg}"
        }
        on_error => "msg_empty"
      }
      if [src_ip] != "" {
        mutate {
          merge => {
            "_principal.ip" => "src_ip"
          }
          on_error => "src_ip_empty"
        }
        if ![src_ip_empty] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }

      if [dst_ip] != "" {
        mutate {
          merge => {
            "_target.ip" => "dst_ip"
          }
          on_error => "dst_ip_empty"
        }
        if ![dst_ip_empty] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
      if [proto] == "TCP" and ([src_ip] != "" or [principal_host] != "") and [dst_ip] != "" {
        mutate {
          replace => {
            "_metadata.event_type" = "NETWORK_CONNECTION"
            "_network.ip_protocol" = "TCP"
          }
          on_error => "proto_empty"
        }
      }
      else {
        mutate {
          replace => {
            "_metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
      if [priority] != "" {
        mutate {
          replace => {
            "_security_result.severity_details" => "%{priority}"
          }
          on_error => "priority_empty"
        }
        if [priority] == "1" {
          mutate {
            replace => {
              "_security_result.priority" => "HIGH_PRIORITY"
            }
          }
        }
        else if [priority] == "2" {
          mutate {
            replace => {
              "_security_result.priority" => "MEDIUM_PRIORITY"
            }
          }
        }
        else if [priority] == "3" {
          mutate {
            replace => {
              "_security_result.priority" => "LOW_PRIORITY"
            }
          }
        }
        else {
          mutate {
            replace => {
              "_security_result.priority" => "UNKNOWN_PRIORITY"
            }
          }
        }
      }
      if [classification] != "" {
        mutate {
          replace => {
            "additional_classification.key" => "classification"
            "additional_classification.value.string_value" => "%{classification}"
          }
          on_error => "classification_empty"
        }
        if ![classification_empty] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "additional_classification"
            }
          }
        }
      }
      if [pwd] != "" {
        mutate {
          replace => {
            "_target.file.full_path"  => "%{pwd}"
          }
        }
      }
    } else if [product_event_type] =~ "(?i)(ntpd|kernel|suricata-config|stunnel)" or [inner_message] =~ "run-parts" {
      mutate {
        replace => {
          "_metadata.description" => "%{inner_message}"
          "_metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  } else {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  if [type] in ["Login", "Credential"] {
    ## Event Type USER_LOGIN/USER_LOGOUT
    grok {
      match => {
        "text" => [
          "%{DATA:action} %{IPORHOST:target_host}:%{INT:target_port} %{GREEDYDATA:text}",
          "%{DATA:application} %{DATA:action} for Vendor: %{GREEDYDATA:vendor}",
          "\\[%{IPORHOST:target_host}\\] Login info: %{GREEDYDATA:action}\\.",
          "\\[%{IPORHOST:target_host}\\] Login failed: %{GREEDYDATA:action}\\.",
          "\\[%{IPORHOST:target_host}\\] %{GREEDYDATA:action}: %{GREEDYDATA:code}",
          "\\[%{IPORHOST:target_host}\\] %{DATA:action}: %{GREEDYDATA:text}",
          "\\[%{IPORHOST:target_host}\\] %{GREEDYDATA:action}\\.",
          "%{GREEDYDATA:action}\\.",
          "%{GREEDYDATA:action}"
        ]
      }
      overwrite => ["application", "target_host", "target_port", "action", "text"]
    }

    ## Login/Logout events:
    if [action] in ["Login", "Logged in", "Accessed"] {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_LOGIN"
          "mechanism" = "REMOTE"
        }
        rename => {
          "_principal.user" => "_target.user"
        }
      }
      if [key] =~ "(^.*@.*$)" {
        mutate {
          merge => {
            "_target.user.email_addresses" = "key"
          }
        }
      }
      mutate {
        merge => {
          "_extensions.auth.mechanism" => "mechanism"
        }
      }
    } else if [action] in ["Logout", "Logged Out"] {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_LOGOUT"
          "_target.user.userid" = "%{key}"
        }
      }
      if [key] =~ "(^.*@.*$)" {
        mutate {
          merge => {
            "_target.user.email_addresses" = "key"
          }
        }
      }
    } else if [action] in ["Login authorization code sent", "email authorization code accepted"] {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_LOGIN"
          "mechanism" = "OTP"
        }
        merge => {
          "_extensions.auth.mechanism" => "mechanism"
        }
      }
    } else if [action] =~ "Password reset: Invalid email address specified" {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_LOGIN"
        }
      }
    } else if [action] in ["Incorrect Password", "Invalid email authorization code"] {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_LOGIN"
          "_security_result.summary" => "%{action}"
          "category" => "AUTH_VIOLATION"
          "security_action" => "BLOCK"
          "mechanism" => "USERNAME_PASSWORD"
        }
        merge => {
          "_security_result.category" => "category"
          "_security_result.action" => "security_action"
          "_extensions.auth.mechanism" => "mechanism"
        }
      }

    } else if [action] =~ "Password reset" {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_CHANGE_PASSWORD"
          "mechanism" = "USERNAME_PASSWORD"
        }
        merge => {
          "_extensions.auth.mechanism" => "mechanism"
        }
      }
    } else if [action] =~ "Password reset: Invalid email address specified" {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_CHANGE_PASSWORD"
          "_security_result.summary" => "%{action}"
          "category" => "AUTH_VIOLATION"
          "security_action" => "BLOCK"
          "mechanism" = "USERNAME_PASSWORD"
        }
        merge => {
          "_security_result.category" => "category"
          "_security_result.action" => "security_action"
          "_extensions.auth.mechanism" => "mechanism"
        }
      }
    }

    if [key] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_principal.user.email_addresses" = "key"
        }
      }
    }
    if [key] != "" {
      mutate {
        replace => {
          "_principal.user.userid" = "%{key}"
        }
      }
    }

    mutate {
      replace => {
        "desc" = "%{key} %{text}"
      }
    }

    if [mechanism] == "" {
      mutate {
        replace => {
          "mechanism" = "MECHANISM_UNSPECIFIED"
        }
        merge => {
          "_extensions.auth.mechanism" => "mechanism"
        }
      }
    }

    if [auth_type] == "" {
      mutate {
        replace => {
          "_extensions.auth.type" = "AUTHTYPE_UNSPECIFIED"
        }
      }
    }

  } else if [type] =~ "Port" {
    grok {
      match => {
        "text" => [
        "%{DATA:reason}\. Name: '%{DATA:resource_name}', host: '%{IPORHOST:target_host}', port: '%{INT:target_port}', local port: '%{INT:principal_port}', port type: '%{DATA:port_type}', description: '%{DATA:description}', credential: '%{DATA:credential}, path: '%{DATA:path}, app name: '%{DATA:application}",
        "Name: '%{DATA:resource_name}', host: '%{IPORHOST:target_host}', port: '%{INT:target_port}', local port: '%{INT:principal_port}', port type: '%{DATA:port_type}', description: '%{DATA:description}', credential: '%{DATA:credential}, path: '%{DATA:path}, app name: '%{DATA:application}",
        "Name: '%{DATA:resource_name}', host: '%{IPORHOST:target_host}', port: '%{INT:target_port}', local port: '%{INT:principal_port}', port type: '%{DATA:port_type}', description: '%{DATA:description}, launch host type: '%{DATA:launch_host_type}', credentials: %{DATA:credential}, path: '%{DATA:path}', app name: '%{DATA:app_name}, required local port: %{WORD:required_local_port}'",
        "%{GREEDYDATA:description}"
        ]
      }
      overwrite => ["description", "target_host", "target_port", "principal_port", "reason", "name", "resource_name", "port_type", "required_local_port"]
      on_error => "type_grok_not_match"
    }
    if [text] != "" {
      mutate {
        gsub => ["text", "\\[", ""]
      }
      mutate {
        gsub => ["text", "\\]", ""]
      }
      mutate {
        gsub => ["text", ", ", "#"]
      }
      kv {
        source => "text"
        field_split => "#"
        value_split => "="
        on_error => "kv_data_fail"
      }
    }
    if [host] != "" {
      grok {
        match => {
          "host" => "%{IP:target_host}"
        }
        overwrite => ["target_host"]
        on_error => "text_host_empty"
      }
      if ![text_host_empty] {
        mutate {
          merge => {
            "_target.ip" => "target_host"
            "_target.asset.ip" => "target_host"
          }
          on_error => "text_target_ip_empty"
        }
        if ![text_target_ip_empty] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
    if [port] != "" {
      grok {
        match => {
          "port" => "%{INT:target_port_value}"
        }
        overwrite => ["target_port_value"]
        on_error => "text_port_empty"
      }
      if ![text_port_empty] {
        mutate {
          convert => {
            "target_port_value" => "string"
          }
          on_error => "target_port_value_not_string"
        }
        mutate {
          replace => {
            "_target.port" => "%{target_port_value}"
          }
          on_error => "target_port_empty"
        }
        mutate {
          convert => {
            "_target.port" => "integer"
          }
          on_error => "target_port_not_integer"
        }
      }
    }
    if [localPort] != "" {
      grok {
        match => {
          "localPort" => "%{INT:principal_port_value}"
        }
        overwrite => ["principal_port_value"]
        on_error => "principal_port_empty"
      }
      if ![principal_port_empty] {
        mutate {
          convert => {
            "principal_port_value" => "string"
          }
          on_error => "principal_port_value_not_string"
        }
        mutate {
          replace => {
            "_principal.port" => "%{principal_port_value}"
          }
          on_error => "principal_port_replace_error"
        }
        mutate {
          convert => {
            "_principal.port" => "integer"
          }
          on_error => "principal_port_not_integer"
        }
      }
    }
    if [portType] != "" {
      mutate {
        replace => {
          "port_type_label.key" => "portType"
          "port_type_label.value" => "%{portType}"
        }
        on_error => "port_type_empty"
      }
      if ![port_type_empty] {
        mutate {
          merge => {
            "_target.resource.attribute.labels" => "port_type_label"
          }
          on_error => "port_type_label_empty"
        }
      }
    }
    if [requireLocalPort] != "" {
      mutate {
        replace => {
          "requirelocalport_label.key" => "requireLocalPort"
          "requirelocalport_label.value" => "%{requireLocalPort}"
        }
        on_error => "requirelocalport_label_empty"
      }
      if ![requirelocalport_label_empty] {
        mutate {
          merge => {
            "_target.resource.attribute.labels" => "requirelocalport_label"
          }
          on_error => "merge_requirelocalport_label_error"
        }
      }
    }
    if [launchHostType] != "" {
      mutate {
        replace => {
          "launch_host_type_label.key" => "launchHostType"
          "launch_host_type_label.value" => "%{launchHostType}"
        }
        on_error => "launch_host_type_label_empty"
      }
      if ![launch_host_type_label_empty] {
        mutate {
          merge => {
            "_target.resource.attribute.labels" => "launch_host_type_label"
          }
          on_error => "merge_launch_host_type_label_error"
        }
      }
    }
    if [auditDisabled] != "" {
      mutate {
        replace => {
          "audit_disabled_label.key" => "auditDisabled"
          "audit_disabled_label.value" => "%{auditDisabled}"
        }
        on_error => "audit_disabled_label_empty"
      }
      if ![audit_disabled_label_empty] {
        mutate {
          merge => {
            "_target.resource.attribute.labels" => "audit_disabled_label"
          }
          on_error => "merge_audit_disabled_label_error"
        }
      }
    }

    mutate {
        replace => {
          "_network.ip_protocol" = "TCP"
          "_application_protocol" = "UNKNOWN_APPLICATION_PROTOCOL"
        }
    }

    mutate {
        replace => {
          "_network.application_protocol" = "%{_application_protocol}"
        }
    }
    if [description] not in ["", "null"] {
      mutate {
        replace => {
          "_security_result.description" => "%{description}"
        }
      }
    }

    if [resource_name] not in [ "", "null", "TCP", "Telnet", "Horizon"] {
      mutate {
        replace => {
          "_network.application_protocol" => "%{resource_name}"
        }
        on_error => "resource_name_empty"
      }
    }

    if [method] == "UPDATE" {
      mutate {
        replace => {
          "principal_host" = "%{target_host}"
          "desc" = "%{resource_name} Port %{key} (%{port_type}) was updated."
        }
      }
      if [reason] == "Disabled" {
        mutate {
          replace => {
            "desc" = "Port %{key} was disabled."
          }
        }
      }
    }

    if [method] == "CREATE" {
      mutate {
        replace => {
          "principal_host" = "%{target_host}"
          "desc" = "%{resource_name} Port %{key} (%{port_type}) was created."
        }
      }
    }

    if [method] == "DELETE" {
      mutate {
        replace => {
          "_metadata.event_type" = "SETTING_DELETION"
          "_target.resource.type" = "SETTING"
          "desc" = "Port %{key} deleted."
        }
      }
      mutate {
        replace => {
          "principal_host" = "%{target_host}"
        }
        on_error => "type_principal_host_empty"
      }
    }
  } else if [type] =~ "User" {
    if [key] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_target.user.email_addresses" => "key"
        }
      }
    }
    if [key] != "" {
      mutate {
        replace => {
          "_target.user.userid" => "%{key}"
        }
      }
    }
    mutate {
      replace => {
        "_metadata.event_type" = "USER_STATS"
      }
    }

    if [type] =~ "UserApprovalQueue" {
      grok {
        match => {
          "type" => "%{IP:principal_host}"
        }
        overwrite => ["principal_host"]
        on_error => "ip_not_found"
      }
    }
  } else if [type] =~ "EULA" {
    if [key] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_target.user.email_addresses" => "key"
        }
      }
    }
    if [key] != "" {
      mutate {
        replace => {
          "_target.user.userid" => "%{key}"
        }
      }
    }
    mutate {
      replace => {
        "_metadata.event_type" = "USER_UNCATEGORIZED"
      }
    }

  } else if [type] =~ "VendorRep" {
    if [text] =~ "Password Reset Complete" {
      if [username] =~ "(^.*@.*$)" {
        mutate {
          merge => {
            "_target.user.email_addresses" => "username"
          }
        }
      }
      if [username] != "" {
        mutate {
          replace => {
            "_target.user.userid" => "%{username}"
          }
          on_error => "username_not_found"
        }
        if ![username_not_found] {
          mutate {
            replace => {
              "_metadata.event_type" = "USER_CHANGE_PASSWORD"
            }
          }
        }
      }
      if [username] == "" {
        if [key] != "" and [key] =~ "(^.*@.*$)" {
          mutate {
            merge => {
              "_target.user.email_addresses" => "key"
            }
            on_error => "key_not_found"
          }
        }
        else if [key] != "" {
          mutate {
            replace => {
              "_target.user.userid" => "%{key}"
            }
            on_error => "key_userid_not_found"
          }
          if ![key_userid_not_found] {
            mutate {
              replace => {
                "_metadata.event_type" = "USER_CHANGE_PASSWORD"
              }
              on_error => "key_event_type_not_found"
            }
          }
        }
      }
    }
  } else if [type] =~ "HostedCustomerAccessApproval" {
    if [username] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_target.user.email_addresses" => "username"
        }
      }
    }
    if [username] != "" {
      mutate {
        replace => {
          "_target.user.userid" => "%{username}"
        }
      }
    }
    mutate {
      replace => {
        "_metadata.event_type" = "USER_CHANGE_PERMISSIONS"
      }
    }

  } else if [type] =~ "Host Description" {
    grok {
      match => {
        "text" => [
          "Host: '%{IPORHOST:principal_host}' , Alias: '%{IPORHOST:target_host} \\(was '%{IPORHOST:intermediary_host}'\\), Description: '%{GREEDYDATA:description}'"
          "Host: '%{IPORHOST:principal_host}' , Alias: '.*? \\(was '%{IPORHOST:intermediary_host}'\\), Description: '%{GREEDYDATA:description}'"
          "Host: '%{IPORHOST:principal_host}' , Alias: '%{IPORHOST:intermediary_host} \\(was '.*?'\\), Description: '%{GREEDYDATA:description}'"
          "Host: '%{DATA:principal_host}'  \\(now '%{DATA:target_host}'\\), Alias: .*?'.*?, Description: '%{GREEDYDATA:description}'"
          "Host: '%{IPORHOST:principal_host}'\\s+, Alias:\\s+'%{IPORHOST:target_host}(,|.*?,)\\s+Description: '%{GREEDYDATA:description}'"
        ]
      }
      overwrite => ["principal_host", "target_host", "intermediary_host", "description"]
    }
    if [username] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_target.user.email_addresses" => "username"
        }
      }
    }
    if [username] != "" {
      mutate {
        replace => {
          "_target.user.userid" => "%{username}"
        }
      }
    }
    mutate {
      replace => {
        "_metadata.event_type" = "SETTING_MODIFICATION"
        "_target.resource.type" = "SETTING"
        "desc" = "Host information updated for %{target_host}."
      }
    }

  } else if [type] =~ "Registration" {
    if [key] =~ "(^.*@.*$)" {
      mutate {
        merge => {
          "_target.user.email_addresses" => "key"
        }
      }
    }
    if [key] != "" {
      mutate {
        replace => {
          "_target.user.userid" => "%{key}"
        }
      }
    }
    if [target_host] != "" {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_CREATION"
        }
      }
    } else {
      mutate {
        replace => {
          "_metadata.event_type" = "USER_UNCATEGORIZED"
        }
      }
    }
  } else if [type] =~ "GlobalCredential" {
    grok {
      match => {
        "text" => [
          "Accessed %{HOST:target_host}:%{INT:target_port}"
          "%{GREEDYDATA:desc}"
        ]
      }
      overwrite => ["target_port", "target_host", "desc"]
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "_target.application" = "%{application}"
      }
    }
  }

  if [desc] != "" {
    mutate {
      replace => {
        "_metadata.description" = "%{desc}"
      }
    }
  }

  if [target_host] != "" {
    grok {
      match => {
        "target_host" => "%{IP:target_ip}"
      }
      on_error => "not_an_ip_target_host"
    }

    if ![not_an_ip_target_host] {
      mutate {
        merge => {
          "_target.ip" => "target_ip"
        }
        on_error => "target_ip_empty"
      }
      if ![target_ip_empty] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "_target.hostname" => "%{target_host}"
        }
        on_error => "target_host_empty"
      }
      if ![target_host_empty] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  if [principal_host] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
    mutate {
      merge => {
        "_principal.ip" => "principal_host"
      }
      on_error => "not_an_ip_principal_host"
    }
    if ![not_an_ip_principal_host] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  else if [principal_host] != "" {
    mutate {
      replace => {
        "_principal.hostname" => "%{principal_host}"
      }
      on_error => "principal_host_empty"
    }
    if ![principal_host_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [principal_port] != "" {
    mutate {
      replace => {
        "_principal.port" = "%{principal_port}"
      }
      convert => {
        "_principal.port" => "integer"
      }
    }
  }

  if [target_port] != "" {
    mutate {
      replace => {
        "_target.port" = "%{target_port}"
      }
      convert => {
        "_target.port" => "integer"
      }
    }
  }

  mutate {
    uppercase => ["method"]
  }

  if [method] in ["CREATE", "UPDATE", "DELETE"] {
    mutate {
      replace => {
        "_network.http.method" => "%{method}"
      }
    }
  } else if [method] =~ "(?i)(ERROR|FATAL)" {
    mutate {
      replace => {
        "_security_result.severity" => "ERROR"
      }
    }
  } else if [method] =~ "(?i)CRITICAL" {
    mutate {
      replace => {
        "_security_result.severity" => "CRITICAL"
      }
    }
  } else if [method] =~ "(?i)INFO" {
     mutate {
      replace => {
        "_security_result.severity" => "INFORMATIONAL"
      }
    }
  } else if [method] =~ "(?i)(DEBUG|NOTICE)" {
     mutate {
      replace => {
        "_security_result.severity" => "LOW"
      }
    }
  } else if [method] =~ "(?i)WARNING" {
     mutate {
      replace => {
        "_security_result.severity" => "MEDIUM"
      }
    }
  } else if [method] =~ "(?i)MAJOR" {
     mutate {
      replace => {
        "_security_result.severity" => "HIGH"
      }
    }
  }
  if [_metadata][event_type] not in ["USER_CHANGE_PASSWORD", "USER_CREATION", "USER_LOGIN", "USER_LOGOUT", "SETTING_MODIFICATION"] {
    if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "_metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [_metadata][event_type] =~ "GENERIC_" and [principal_host] != "" {
      mutate {
        replace => {
          "_metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }

  if [_metadata] != "" {
    mutate {
      rename => {
        "_metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [_extensions] != "" {
    mutate {
      rename => {
        "_extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [_principal] != "" {
    mutate {
      rename => {
        "_principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [_target] != "" {
    mutate {
      rename => {
        "_target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [_network] != "" {
    mutate {
      rename => {
        "_network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [_security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "_security_result"
      }
    }
  }

  # Setting proto common fields
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
