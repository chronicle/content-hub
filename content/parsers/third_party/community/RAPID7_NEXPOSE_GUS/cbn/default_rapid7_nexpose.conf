# Product: Rapid7 Nexpose
# Category: Vulnerability Scanner
# Supported Format: JSON
# Reference: NA
# Last Updated: 2024-05-14
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "host_name" => ""
      "ip_address" => ""
      "title" => ""
      "desc" => ""
      "cve_id" => ""
      "asset_id" => ""
      "time_zone" => ""
      "vulnerability_description" => ""
      "target_ip" => ""
      "timestamp" => ""
      "vulnerability_data" => ""
      "description.text" => ""
      "description" => ""
      "categories" => ""
      "pci.adjustedCVSSScore" => ""
      "pci.adjustedSeverityScore" => ""
      "pci.fail" => ""
      "pci.status" => ""
      "cvss.v2.accessComplexity" => ""
      "cvss.v2.accessVector" => ""
      "cvss.v2.authentication" => ""
      "cvss.v2.availabilityImpact" => ""
      "cvss.v2.confidentialityImpact" => ""
      "cvss.v2.integrityImpact" => ""
      "cvss.v2.vector" => ""
      "cvss.v3.attackComplexity" => ""
      "cvss.v3.attackVector" => ""
      "cvss.v3.availabilityImpact" => ""
      "cvss.v3.confidentialityImpact" => ""
      "cvss.v3.privilegeRequired" => ""
      "cvss.v3.integrityImpact" => ""
      "cvss.v3.scope" => ""
      "cvss.v3.userInteraction" => ""
      "cvss.v3.vector" => ""
      "sec_result" => ""
      "event_type" => "GENERIC_EVENT"
      "has_target" => "false"
      "has_principal" => "false"
    }
  }

  mutate {
    gsub => ["message", '\"{', '{']
  }
  mutate {
    gsub => ["message", '}\"', '}']
  }
  mutate {
    gsub => ["message", "\\\\n\\s+", ""]
  }
  mutate {
    gsub => ["message", "\\\\", ""]
  }
# Pull fields out of raw log.
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    grok {
      match => {
        "message" => [
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{IP:ip_address} %{DATA}:\\s+%{IP:target_ip} VULNERABILITY:\\s+%{GREEDYDATA:vulnerability_description}"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{IP:ip_address} %{DATA}:\\s+%{GREEDYDATA:description}"
        ]
      }
      overwrite => ["ip_address", "vulnerability_description", "target_ip", "timestamp", "description"]
      on_error => "grok_failure"
    }
  }
  mutate {
     convert => {
       "asset_id" => "string"
     }
     on_error => "asset_string_failure"
  }

  if [ip_address] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip_address"
        "event.idm.read_only_udm.principal.asset.ip" => "ip_address"
      }
      on_error => "ip_address_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [host_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host_name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host_name}"
        "has_principal" => "true"
      }
      on_error => "host_name_empty"
    }
  }

  if [asset_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" => "assetID: %{asset_id}"
      }
      on_error => "asset_id_empty"
    }
  }

  if [target_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "target_ip"
        "event.idm.read_only_udm.target.asset.ip" => "target_ip"
      }
      on_error => "target_ip_empty"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  mutate {
     convert => {
       "last_assessed_for_vulnerabilities" => "string"
     }
     on_error => "last_assessed_string_failure"
  }
  if [last_assessed_string_failure] {
    grok {
      match => {
        "last_assessed_for_vulnerabilities" => [
          "(?P<date_time>.*?) %{TZ:time_zone}",
          "(?P<date_time>.*)"
        ]
      }
      overwrite => ["time_zone"]
    }

    if [time_zone] == "UTC" {
      mutate {
        replace => {
          "date_time" = "%{date_time} +0000"
        }
      }
    }
    date {
      match => ["date_time", "yyyy-MM-dd HH:mm:ss Z", "RFC3339", "ISO8601"]
    }

  } else if [timestamp] != "" {
    date {
      match => ["timestamp", "MMM dd HH:mm:ss", "MMM d HH:mm:ss", "MMM  d HH:mm:ss"]
      rebase => true
    }
  } else {
  #Check to see if the date is in microseconds and capture upto milliseconds - logstash supports milliseconds only
    grok {
      match => {
        "last_assessed_for_vulnerabilities" => [
        "(?P<last_assessed_ms>.{13})"
       ]
      }
      on_error => "grok_last_fail"
    }
    if [grok_last_fail] {
      date {
        match => ["last_assessed_for_vulnerabilities", "UNIX", "RFC3339", "ISO8601"]
        on_error => "last_assessed_date_failure"
      }
    } else {
      date {
        match => ["last_assessed_ms", "UNIX_MS", "RFC3339", "ISO8601"]
        on_error => "last_assessed_ms_failure"
      }
    }
  }

  for vulnerability in vulnerability_data {
    mutate {
      replace => {
        "each_vuln" => ""
      }
    }
#    if [last_assessed_for_vulnerabilities] != "" {
#      date {
#        match => ["last_assessed_for_vulnerabilities","yyyy-MM-dd HH:mm:ss UTC"]
#        target => "each_vuln.last_found"
#      }
#    }
    if [vulnerability][vulnerability_id] != "" {
       mutate {
        convert => {
          "vulnerability.vulnerability_id" => "string"
        }
        on_error => "vulnerability_id_string_failure"
       }
       mutate {
        replace => {
          "each_vuln.vendor_vulnerability_id" => "%{vulnerability.vulnerability_id}"
        }
      }
    }

    if [vulnerability][Vulnerability_Severity] == "Severe" {
      mutate {
        replace => {
          "each_vuln.severity" => "HIGH"
        }
      }
    }
    if [vulnerability][Vulnerability_Severity] == "Critical" {
      mutate {
        replace => {
          "each_vuln.severity" => "CRITICAL"
        }
      }
    }
    if [vulnerability][Vulnerability_Severity] == "Moderate" {
      mutate {
        replace => {
          "each_vuln.severity" => "MEDIUM"
        }
      }
    }

    if [vulnerability][Vulnerability_Title] != "" {
      mutate {
        replace => {
          "title" => "%{vulnerability.Vulnerability_Title}"
        }
      }

      grok {
        match => {
          "title" => [
            "%{GREEDYDATA:name} CVE-%{INT:cve_year}-%{INT:cve_id}: %{GREEDYDATA:desc}"
            "%{GREEDYDATA:name}: CVE-%{INT:cve_year}-%{INT:cve_id} : %{GREEDYDATA:desc}"
            "%{GREEDYDATA:name}: CVE-%{INT:cve_year}-%{INT:cve_id}: %{GREEDYDATA:desc}"
            "%{GREEDYDATA:name}: CVE-%{INT:cve_year}-%{INT:cve_id} %{GREEDYDATA:desc}"
            "%{GREEDYDATA:name} \\(CVE-%{INT:cve_year}-%{INT:cve_id}\\): %{GREEDYDATA:desc}"
            "%{GREEDYDATA:name} \\(CVE-%{INT:cve_year}-%{INT:cve_id}\\)"
            "%{GREEDYDATA:name}: CVE-%{INT:cve_year}-%{INT:cve_id}"
            "%{GREEDYDATA:desc}"
          ]
        }
        overwrite => ["desc","cve_id","name","cve_year"]
      }
      if [cve_id] != "" && [cve_year] != "" {
        mutate {
          replace => {
            "each_vuln.cve_id" => "%{cve_year}-%{cve_id}"
          }
        }
      }
      if [desc] != "" {
        mutate {
          replace => {
            "each_vuln.description" => "%{desc}"
          }
        }
      }
    }
    mutate {
      replace => {
        "each_vuln.description" => "%{vulnerability.Vulnerability_Title}"
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.vulns.vulnerabilities" => "each_vuln"
      }
    }
  }

  if [vulnerability_description] != "" {
    mutate {
      replace => {
        "vulnerability.description" => "%{vulnerability_description}"
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.vulns.vulnerabilities" => "vulnerability"
      }
    }
  }

  if [vulnerability_description] != "" or [vulnerability_data] != "" {
    mutate {
      replace => {
        "event_type" => "SCAN_VULN_HOST"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "SCAN_HOST"
      }
    }
  }

  for category in categories {
    mutate {
      replace => {
        "value_array" => ""
      }
    }
    mutate {
      replace => {
        "value_array.string_value" => "%{category}"
      }
      on_error => "additional_category_empty"
    }
    mutate {
      merge => {
        "additional_category.value.list_value.values" => "value_array"
      }
      on_error => "additional_category_not_found"
    }
  }
  if [categories] != "" {
    mutate {
      replace => {
        "additional_category.key" => "App Stack"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_category"
      }
      on_error => "additional_category_field_not_found"
    }
  }

  if [pci][adjustedCVSSScore] != "" {
    mutate {
      convert => {
        "pci.adjustedCVSSScore" => "string"
      }
      on_error => "already_a_string"
    }
    mutate {
      replace => {
        "adjustedCVSSScore_label.value.string_value" => "%{pci.adjustedCVSSScore}"
      }
      on_error => "adjustedCVSSScore_empty"
    }
    if ![adjustedCVSSScore_empty] {
      mutate {
        replace => {
          "adjustedCVSSScore_label.key" => "adjustedCVSSScore"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "adjustedCVSSScore_label"
        }
        on_error => "adjustedCVSSScore_label_empty"
      }
    }
  }

  if [pci][adjustedSeverityScore] != "" {
    mutate {
      convert => {
        "pci.adjustedSeverityScore" => "string"
      }
      on_error => "already_a_string"
    }
    mutate {
      replace => {
        "adjustedSeverityScore_label.value.string_value" => "%{pci.adjustedSeverityScore}"
      }
      on_error => "adjustedSeverityScore_empty"
    }
    if ![adjustedSeverityScore_empty] {
      mutate {
        replace => {
          "adjustedSeverityScore_label.key" => "adjustedSeverityScore"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "adjustedSeverityScore_label"
        }
        on_error => "adjustedSeverityScore_label_empty"
      }
    }
  }

  if [pci][fail] != "" {
    mutate {
      convert => {
        "pci.fail" => "string"
      }
      on_error => "already_a_string"
    }
    mutate {
      replace => {
        "fail_label.value.string_value" => "%{pci.fail}"
      }
      on_error => "fail_empty"
    }
    if ![fail_empty] {
      mutate {
        replace => {
          "fail_label.key" => "fail"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "fail_label"
        }
        on_error => "fail_label_empty"
      }
    }
  }

  if [pci][status] != "" {
    mutate {
      replace => {
        "status_label.value.string_value" => "%{pci.status}"
      }
      on_error => "status_empty"
    }
    if ![status_empty] {
      mutate {
        replace => {
          "status_label.key" => "status"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "status_label"
        }
        on_error => "status_label_empty"
      }
    }
  }

  if [description] == "" {
    mutate {
      replace => {
        "description" => "%{description.text}"
      }
      on_error => "text_empty"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "description_empty"
    }
  }

  for link in links {
    mutate {
      replace => {
        "add_label" => ""
      }
    }
    mutate {
      replace => {
        "key" => "%{link.rel}"
      }
      on_error => "no_key"
    }
    mutate {
      replace => {
        "value" => "%{link.href}"
      }
      on_error => "no_value"
    }
    if ![no_key] and ![no_value] {
      mutate {
        replace => {
          "add_label.value" => "%{value}"
          "add_label.key" => "%{key}"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "add_label"
        }
        on_error => "merge_error"
      }
    }
  }

  for link in cvss.links {
    mutate {
      replace => {
        "add_label" => ""
      }
    }
    mutate {
      replace => {
        "key" => "%{link.rel}"
      }
      on_error => "no_key"
    }
    mutate {
      replace => {
        "value" => "%{link.href}"
      }
      on_error => "no_value"
    }
    if ![no_key] and ![no_value] {
      mutate {
        replace => {
          "add_label.value" => "%{value}"
          "add_label.key" => "%{key}"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "add_label"
        }
        on_error => "merge_error"
      }
    }
  }

  if [cvss][v2][accessComplexity] != "" {
    mutate {
      replace => {
        "detection_accessComplexity.value" => "%{cvss.v2.accessComplexity}"
      }
      on_error => "accessComplexity_empty"
    }
    if ![accessComplexity_empty] {
      mutate {
        replace => {
          "detection_accessComplexity.key" => "v2 accessComplexity"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_accessComplexity"
        }
        on_error => "detection_accessComplexity_empty"
      }
    }
  }

  if [cvss][v2][accessVector] != "" {
    mutate {
      replace => {
        "detection_accessVector.value" => "%{cvss.v2.accessVector}"
      }
      on_error => "accessVector_empty"
    }
    if ![accessVector_empty] {
      mutate {
        replace => {
          "detection_accessVector.key" => "v2 accessVector"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_accessVector"
        }
        on_error => "detection_accessVector_empty"
      }
    }
  }

  if [cvss][v2][authentication] != "" {
    mutate {
      replace => {
        "detection_authentication.value" => "%{cvss.v2.authentication}"
      }
      on_error => "authentication_empty"
    }
    if ![authentication_empty] {
      mutate {
        replace => {
          "detection_authentication.key" => "v2 authentication"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_authentication"
        }
        on_error => "detection_authentication_empty"
      }
    }
  }

  if [cvss][v2][availabilityImpact] != "" {
    mutate {
      replace => {
        "detection_availabilityImpact.value" => "%{cvss.v2.availabilityImpact}"
      }
      on_error => "availabilityImpact_empty"
    }
    if ![availabilityImpact_empty] {
      mutate {
        replace => {
          "detection_availabilityImpact.key" => "v2 availabilityImpact"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_availabilityImpact"
        }
        on_error => "detection_availabilityImpact_empty"
      }
    }
  }

  if [cvss][v2][confidentialityImpact] != "" {
    mutate {
      replace => {
        "detection_confidentialityImpact.value" => "%{cvss.v2.confidentialityImpact}"
      }
      on_error => "confidentialityImpact_empty"
    }
    if ![confidentialityImpact_empty] {
      mutate {
        replace => {
          "detection_confidentialityImpact.key" => "v2 confidentialityImpact"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_confidentialityImpact"
        }
        on_error => "detection_confidentialityImpact_empty"
      }
    }
  }

  if [cvss][v2][integrityImpact] != "" {
    mutate {
      replace => {
        "detection_integrityImpact.value" => "%{cvss.v2.integrityImpact}"
      }
      on_error => "integrityImpact_empty"
    }
    if ![integrityImpact_empty] {
      mutate {
        replace => {
          "detection_integrityImpact.key" => "v2 integrityImpact"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_integrityImpact"
        }
        on_error => "detection_integrityImpact_empty"
      }
    }
  }

  if [cvss][v2][vector] != "" {
    mutate {
      replace => {
        "detection_vector.value" => "%{cvss.v2.vector}"
      }
      on_error => "vector_empty"
    }
    if ![vector_empty] {
      mutate {
        replace => {
          "detection_vector.key" => "v2 vector"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_vector"
        }
        on_error => "detection_vector_empty"
      }
    }
  }

  if [cvss][v3][attackComplexity] != "" {
    mutate {
      replace => {
        "detection_v3_attackComplexity.value" => "%{cvss.v3.attackComplexity}"
      }
      on_error => "attackComplexity_empty"
    }
    if ![accessComplexity_empty] {
      mutate {
        replace => {
          "detection_v3_attackComplexity.key" => "v3 attackComplexity"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_v3_attackComplexity"
        }
        on_error => "detection_v3_attackComplexity_empty"
      }
    }
  }

  if [cvss][v3][attackVector] != "" {
    mutate {
      replace => {
        "detection_v3_attackVector.value" => "%{cvss.v3.attackVector}"
      }
      on_error => "attackVector_empty"
    }
    if ![accessVector_empty] {
      mutate {
        replace => {
          "detection_v3_attackVector.key" => "v3 attackVector"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_v3_attackVector"
        }
        on_error => "detection_v3_attackVector_empty"
      }
    }
  }

  if [cvss][v3][availabilityImpact] != "" {
    mutate {
      replace => {
        "detection_v3_availabilityImpact.value" => "%{cvss.v3.availabilityImpact}"
      }
      on_error => "availabilityImpact_empty"
    }
    if ![availabilityImpact_empty] {
      mutate {
        replace => {
          "detection_v3_availabilityImpact.key" => "v3 availabilityImpact"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_v3_availabilityImpact"
        }
        on_error => "detection_v3_availabilityImpact_empty"
      }
    }
  }

  if [cvss][v3][confidentialityImpact] != "" {
    mutate {
      replace => {
        "detection_v3_confidentialityImpact.value" => "%{cvss.v3.confidentialityImpact}"
      }
      on_error => "confidentialityImpact_empty"
    }
    if ![confidentialityImpact_empty] {
      mutate {
        replace => {
          "detection_v3_confidentialityImpact.key" => "v3 confidentialityImpact"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_v3_confidentialityImpact"
        }
        on_error => "detection_v3_confidentialityImpact_empty"
      }
    }
  }

  if [cvss][v3][integrityImpact] != "" {
    mutate {
      replace => {
        "detection_v3_integrityImpact.value" => "%{cvss.v3.integrityImpact}"
      }
      on_error => "integrityImpact_empty"
    }
    if ![integrityImpact_empty] {
      mutate {
        replace => {
          "detection_v3_integrityImpact.key" => "v3 integrityImpact"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_v3_integrityImpact"
        }
        on_error => "detection_v3_integrityImpact_empty"
      }
    }
  }

  if [cvss][v3][vector] != "" {
    mutate {
      replace => {
        "detection_v3_vector.value" => "%{cvss.v3.vector}"
      }
      on_error => "vector_empty"
    }
    if ![vector_empty] {
      mutate {
        replace => {
          "detection_v3_vector.key" => "v3 vector"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "detection_v3_vector"
        }
        on_error => "detection_v3_vector_empty"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
      on_error => "no_security_result"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Rapid7"
      "event.idm.read_only_udm.metadata.product_name" => "Nexpose"
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_empty"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
