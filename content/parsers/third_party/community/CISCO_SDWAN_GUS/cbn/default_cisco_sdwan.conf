# Product: Cisco SDWAN
# Category: Switches and Routers
# Supported Format: JSON, SYSLOG
# Reference: NA
# Last Updated: 2026-06-16
# Copyright 2026 Google SecOps

filter{
  mutate {
    replace => {
      "principal_ip" => ""
      "target_ip" => ""
      "principal_port" => ""
      "target_port" => ""
      "system_ip" => ""
      "instance_id" => ""
      "message_value" => ""
      "network_protocol" => ""
      "hostname" => ""
      "classification" => ""
      "priority" => ""
      "policy" => ""
      "filename" => ""
      "filetype" => ""
      "Malware" => ""
      "metadata" => ""
      "timestamp" => ""
      "event_type" => ""
      "meta.source.type" => ""
      "meta.msg" => ""
      "meta.proxy_host" => ""
      "meta.port" => ""
      "proxy_host" => ""
      "proxy_port" => ""
      "tags" => ""
      "type" => ""
      "msg" => ""
      "msg1" => ""
      "port" => ""
      "host" => ""
      "user" => ""
      "ip" => ""
      "date_time" => ""
      "principal" => ""
      "additional" => ""
      "target" => ""
      "network" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "has_target" => "false"
      "tag_present" => "false"
      "meta.timestamp.producer_process" => ""
      "meta.src.type" => ""
      "prod_type" => ""
      "msgs" => ""
      "ipaddress" => ""
      "ports" => ""
      "username" => ""
      "ipadres" => ""
      "prts" => ""
      "packet" => ""
      "target_username" => ""
      "process" => ""
      "pid" => ""
      "meta_sequenceId" => ""
      "peer_ip" => ""
      "description_1" => ""
      "principal_ip1" => ""
      "target_ip1" => ""
      "target_port1" => ""
      "host_name" => ""
      "intermediary" => ""
      "user1" => ""
      "has_principal_user" => "false"
      "session_id" => ""
      "principal_port1" => ""
      "json_data" => ""
      "logid" => ""
      "logmodule" => ""
      "logfeature" => ""
      "loguser" => ""
      "logusersrcip" => ""
      "logmsg" => ""
      "logdeviceid" => ""
      "type1" => ""
      "target_name" => ""
      "parent_identifier" => ""
      "specific_identifier" => ""
      "initiator_ip" => ""
      "initiator_port" => ""
      "responder_ip" => ""
      "responder_port" => ""
      "vlan_id" => ""
      "src_vrf" => ""
      "dst_vrf" => ""
      "qfp" => ""
      "thread" => ""
      "sent_bytes_1" => ""
      "sent_bytes_2" => ""
      "Tunnel_id" => ""
      "log_prefix" => ""
      "vpn_id" => ""
      "src_ip" => ""
      "src_port" => ""
      "dst_ip" => ""
      "dst_port" => ""
      "protocol" => ""
      "tos" => ""
      "log_reason" => ""
      "count" => ""
      "bytes" => ""
      "ingress_interface" => ""
      "egress_interface" => ""
      "tenant_vpn_id" => ""
      "direction" => ""
      "sequence" => ""
      "result" => ""
      "unknown_tenant" => ""
      "udp_packets" => ""
      "tty" => ""
      "user_id" => ""
      "network_host" => ""
      "application_protocol" => ""
      "inter_host" => ""
      "time_t" => ""
      "parent_pid" => ""
      "log_id" => ""
      "process_name" => ""
      "process_path" => ""
      "sha_details" => ""
      "rsa_type" => ""
      "sha_256" => ""
    }
  }
  mutate {
    gsub => ["message", "metadata", "meta"]
  }
  mutate {
    gsub => ["message", "source", "src"]
  }
  mutate {
    gsub => ["message", "message", "msg"]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_error"
  }
  mutate{
    gsub => ["message", "\\r\\n", ""]
  }

  if [json_error] {
    grok {
      match => {
        "message" => [
          "<%{INT}>%{DATA:timestamp} UTC \\[\\*\\*\\] \\[Hostname: %{DATA:hostname}\\] \\[\\*\\*\\]\\[System_IP: %{IP:system_ip}\\] \\[\\*\\*\\] \\[Instance_ID: %{DATA:instance_id}\\] \\[\\*\\*\\] Drop \\[\\*\\*\\] \\[%{DATA}\\]%{DATA:message_value} \\[\\*\\*\\]\\[Classification: %{DATA:classification}\\] \\[Priority: %{DATA:priority}\\]\\[POLICY: %{DATA:policy}\\] \\{%{DATA:network_protocol}\\} %{IP:principal_ip}:%{INT:principal_port} ->%{IP:target_ip}:%{INT:target_port}",
          "<%{INT}>%{DATA:timestamp} UTC \\[\\*\\*\\] \\[Hostname: %{DATA:hostname}\\] \\[\\*\\*\\]\\s+\\[System_IP: %{IP:system_ip}\\] \\[\\*\\*\\] \\[Instance_ID: %{DATA:instance_id}\\] \\[\\*\\*\\] Drop \\[\\*\\*\\] \\[%{DATA}\\]\\s+%{DATA:message_value} \\[\\*\\*\\]\\s+\\[Classification: %{DATA:classification}\\] \\[Priority: %{DATA:priority}\\]\\s+\\[POLICY: %{DATA:policy}\\] \\{%{DATA:network_protocol}\\} %{IP:principal_ip}:%{INT:principal_port} ->\\s+%{IP:target_ip}:%{INT:target_port}",
          "<%{INT}>%{DATA:timestamp} IST \\[\\*\\*\\] \\[Hostname: %{DATA:hostname}\\] \\[\\*\\*\\]\\s+\\[System_IP: %{IP:system_ip}\\] \\[\\*\\*\\] \\[Instance_ID: %{DATA:instance_id}\\] \\[\\*\\*\\] Drop \\[\\*\\*\\] \\[%{DATA}\\]\\s+%{DATA:message_value} \\[\\*\\*\\]\\s+\\[Classification: %{DATA:classification}\\] \\[Priority: %{DATA:priority}\\]\\s+\\[POLICY: %{DATA:policy}\\] \\{%{DATA:network_protocol}\\} %{IP:principal_ip}:%{INT:principal_port} ->\\s+%{IP:target_ip}:%{INT:target_port}",
          "<%{INT}>%{DATA:timestamp} BRT \\[\\*\\*\\] \\[Hostname: %{DATA:hostname}\\] \\[\\*\\*\\]\\s+\\[System_IP: %{IP:system_ip}\\] \\[\\*\\*\\] \\[Instance_ID: %{DATA:instance_id}\\] \\[\\*\\*\\] Drop \\[\\*\\*\\] \\[%{DATA}\\]\\s+%{DATA:message_value} \\[\\*\\*\\]\\s+\\[Classification: %{DATA:classification}\\] \\[Priority: %{DATA:priority}\\]\\s+\\[POLICY: %{DATA:policy}\\] \\{%{DATA:network_protocol}\\} %{IP:principal_ip}:%{INT:principal_port} ->\\s+%{IP:target_ip}:%{INT:target_port}",
          "<%{INT}>%{DATA:timestamp} UTC \\[\\*\\*\\] \\[Hostname: %{DATA:hostname}\\] \\[\\*\\*\\]\\s+\\[System_IP: %{IP:system_ip}\\] \\[\\*\\*\\] \\[Instance_ID: %{DATA:instance_id}\\] \\[\\*\\*\\] Drop \\[\\*\\*\\] %{DATA} \\[\\*\\*\\] SHA: %{DATA:message_value} Malware: %{DATA:Malware}\\s+Filename: %{DATA:filename} Filetype: %{DATA:filetype} \\[POLICY: %{DATA:policy} \\{%{DATA:network_protocol}\\} %{IP:principal_ip}:%{INT:principal_port} ->\\s+%{IP:target_ip}:%{INT:target_port}%{GREEDYDATA}",
          "<%{INT}>%{INT}: %{SYSLOGTIMESTAMP:date_time}: %{DATA:prod_type}: %{GREEDYDATA:msgs}",
          "<%{INT}>%{INT:log_id}: %{HOSTNAME:inter_host}: %{SYSLOGTIMESTAMP:date_time}: %%{DATA:prod_type}: %{GREEDYDATA:msgs}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp}\\s+%{IP:principal_ip1}\\s+%{DATA:prod_type}:\\s+%{GREEDYDATA:msgs}",
          "<%{INT}>%{SYSLOGTIMESTAMP:time_t} %{DATA:host_name} %{DATA:prod_type}\\[%{INT:pid}\\] %{DATA:process}\\[%{INT:parent_pid}\\]: %{GREEDYDATA:description_1}",
          "<%{INT}>%{SYSLOGTIMESTAMP:time_t} %{DATA:host_name} %{DATA:prod_type}\\[%{INT:pid}\\] %{GREEDYDATA:description_1}",
          "<%{INT}>(%{INT}:)?(%{SYSLOGTIMESTAMP:time_t} %{HOSTNAME:inter_host} -)? %{DATA:prod_type}: %{GREEDYDATA:msgs}",
          '<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host_name} %{DATA:prod_type} %{INT:pid}\\s+-\\s+\\[meta sequenceId="%{DATA:meta_sequenceId}"\\] %{DATA:process}\\[%{INT:parent_pid}\\]: Peer: %{IP:peer_ip} %{GREEDYDATA:description_1}',
          '<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host_name} %{DATA:prod_type} %{INT:pid}\\s+-\\s+\\[meta sequenceId="%{DATA:meta_sequenceId}"\\] %{DATA:process}\\[%{INT:parent_pid}\\]: %{GREEDYDATA:description_1}',
          '<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host_name} %{DATA:prod_type} %{INT:pid}\\s+-\\s+\\[meta sequenceId="%{DATA:meta_sequenceId}"\\] %{GREEDYDATA:description_1}',
          '<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host_name} %{DATA:prod_type} - - \\[meta sequenceId="%{DATA:meta_sequenceId}"\\] user: %{GREEDYDATA:json_data}',
          '<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host_name} %{DATA:prod_type} - - \\[meta sequenceId="%{DATA:meta_sequenceId}"\\] %{GREEDYDATA:description_1}'
        ]
      }
      overwrite => ["parent_pid","log_id","time_t","inter_host","date_time","principal_ip1", "prod_type", "msgs", "hostname", "network_protocol", "system_ip", "instance_id", "message_value", "classification", "priority", "policy", "principal_ip", "target_ip", "principal_port", "target_port", "timestamp", "Malware", "filename", "filetype","process","pid","meta_sequenceId","peer_ip","description_1","host_name", "json_data"]
      on_error => "json_grok_error"
    }
  }
  json {
    source => "json_data"
    array_function => "split_columns"
    on_error => "json_data_error"
  }
  if ![json_data_error] {
    if [logid] != "" {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{logid}"
        }
        on_error => "logid_not_found"
      }
    }
    if [logmodule] != "" {
      mutate {
        replace => {
          "logmodule_label.value.string_value" => "%{logmodule}"
        }
        on_error => "logmodule_not_found"
      }
      if ![logmodule_not_found] {
        mutate {
          replace => {
            "logmodule_label.key" => "logmodule"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "logmodule_label"
          }
          on_error => "logmodule_label_merge_failed"
        }
      }
    }
    if [logfeature] != "" {
      mutate {
        replace => {
          "logfeature_label.value.string_value" => "%{logfeature}"
        }
        on_error => "logfeature_not_found"
      }
      if ![logfeature_not_found] {
        mutate {
          replace => {
            "logfeature_label.key" => "logfeature"
          }
        }
        mutate {
          merge => {
            "additional.fields" => "logfeature_label"
          }
          on_error => "logfeature_label_merge_failed"
        }
      }
    }
    if [loguser] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{loguser}"
        }
        on_error => "loguser_not_found"
      }
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
    if [logusersrcip] != "" {
      mutate {
        merge => {
          "principal.ip" => "logusersrcip"
          "principal.asset.ip" => "logusersrcip"
        }
        on_error => "logusersrcip_not_found"
      }
      if ![logusersrcip_not_found] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [logmsg] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{logmsg}"
        }
        on_error => "logmessage_not_found"
      }
    }
    if [logdeviceid] != "" {
      mutate {
        merge => {
          "target.ip" => "logdeviceid"
          "target.asset.ip" => "logdeviceid"
        }
        on_error => "logdeviceid_not_found"
      }
      if ![logdeviceid_not_found] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [host_name] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{host_name}"
        "intermediary.asset.hostname" => "%{host_name}"
      }
      on_error => "intermediary_hostname_not_found"
    }
  }
  if [process] != "" {
    mutate {
      replace => {
        "process_label.value"  => "%{process}"
      }
      on_error => "process_not_found"
    }
    if ![process_not_found] {
      mutate {
        replace => {
          "process_label.key" => "process"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "process_label"
        }
        on_error => "process_label_merge_failed"
      }
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "principal.process.pid"  => "%{pid}"
      }
      on_error => "pid_not_found"
    }
  }
  if [meta_sequenceId] != "" {
    mutate {
      replace => {
        "meta_sequenceId_label.value.string_value" => "%{meta_sequenceId}"
      }
      on_error => "meta_sequenceId_not_found"
    }
    if ![meta_sequenceId_not_found] {
      mutate {
        replace => {
          "meta_sequenceId_label.key" => "meta_sequenceId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "meta_sequenceId_label"
        }
        on_error => "meta_sequenceId_label_merge_failed"
      }
    }
  }
  if [peer_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "peer_ip"
        "principal.asset.ip" => "peer_ip"
      }
      on_error => "peer_ip_not_found"
    }
    if ![peer_ip_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  grok {
    match => {
      "description_1" => [
        '%{DATA} _v_%{IP:principal_ip1}%{DATA} %{IP:target_ip1} %{DATA} %{INT:target_port1}%{GREEDYDATA}',
        '%{DATA}\\(%{DATA}\\): session opened for user %{DATA:user1}\\(%{GREEDYDATA}\\)'
        '%{DATA}:%{GREEDYDATA} for %{DATA:user1} %{DATA} %{IP:principal_ip1}',
        '%{DATA}=%{DATA:session_id} %{GREEDYDATA} "%{DATA:user1}" %{DATA} %{IP:principal_ip1}',
        '%{DATA}=%{DATA:session_id} %{GREEDYDATA}',
        '%{DATA}: %{DATA:user1}/%{DATA:session_id} %{GREEDYDATA} from %{IP:principal_ip1}:%{DATA:principal_port1} %{GREEDYDATA}',
        'audit user: %{DATA:user1}/%{DATA:session_id} %{GREEDYDATA}'
        '%{GREEDYDATA} for %{DATA:user1} %{DATA} %{IP:principal_ip1} %{DATA} %{INT:principal_port1}%{GREEDYDATA:sha_details}',
        '%{DATA:type1} %{DATA} %{DATA} %{DATA} %{IP:target_ip1} %{DATA} %{INT:target_port1} %{GREEDYDATA:sha_details}'
        'session closed for user %{GREEDYDATA:user1}'
        'resolved to %{IP:principal_ip1}'
        '%{DATA} refreshing %{DATA:process_path},%{GREEDYDATA}'
      ]
    }
    overwrite => ["process_path","principal_ip1", "target_ip1", "target_port1", "prod_type","user1", "session_id","principal_port1", "type1", "sha_details"]
    on_error => "grok_not_matched"
  }
  if [sha_details] != "" {
    grok {
      match => {
        "sha_details" => [
          "\\s+ssh2:\\s+RSA\\s+%{DATA:rsa_type}\\:%{GREEDYDATA:sha_256}"
        ]
      }
      overwrite => ["rsa_type", "sha_256"]
      on_error => "sha_details_not_matched"
    }
    if [rsa_type] != "" {
      mutate {
        replace => {
          "rsa_type_label.key" => "rsa_type"
          "rsa_type_label.value.string_value" => "%{rsa_type}"
        }
        on_error => "rsa_type_not_found"
      }
      if ![rsa_type_not_found] {
        mutate {
          merge => {
            "additional.fields" => "rsa_type_label"
          }
          on_error => "rsa_type_label_merge_failed"
        }
      }
    }
    if [sha_256] != "" {
      mutate {
        replace => {
          "rsa_sha256_label.key" => "sha256"
          "rsa_sha256_label.value.string_value" => "%{sha_256}"
        }
        on_error => "sha_256_not_found"
      }
      if ![sha_256_not_found] {
        mutate {
          merge => {
            "additional.fields" => "rsa_sha256_label"
          }
          on_error => "rsa_sha256_label_merge_failed"
        }
      }
    }
  }
  if [type1] == "DHCPDISCOVER" {
    mutate {
      replace => {
        "network.dhcp.type" => "DISCOVER"
      }
      on_error => "type_not_found"
    }
  }
  if [session_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{session_id}"
      }
      on_error => "session_id_not_found"
    }
  }
  if [user1] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user1}"
      }
      on_error => "user_not_found"
    }
    mutate {
      replace => {
        "has_principal_user" => "true"
      }
    }
  }
  if [principal_ip1] != "" {
    mutate {
      merge => {
        "principal.ip" => "principal_ip1"
        "principal.asset.ip" => "principal_ip1"
      }
      on_error => "principal_ip_not_found"
    }
    if ![principal_ip_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [principal_port1] != "" {
    mutate {
      replace => {
        "principal.port" => "%{principal_port1}"
      }
      on_error => "principal_port_not_found"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "principal_port_not_integer"
    }
  }
  if [target_ip1] != "" {
    mutate {
      merge => {
        "target.ip" => "target_ip1"
        "target.asset.ip" => "target_ip1"
      }
      on_error => "target_ip_not_found"
    }
    if ![target_ip_not_found] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [target_port1] != "" {
    mutate {
      replace => {
        "target.port" => "%{target_port1}"
      }
      on_error => "target_port_not_found"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "target_port_not_integer"
    }
  }
  if [description_1] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{description_1}"
      }
      on_error => "description_not_found"
    }
  }


  if [filename] != "" {
    mutate {
      merge => {
        "target.file.names" => "filename"
      }
      on_error => "filename_not_found"
    }
  }
  if [filetype] != "" {
    mutate {
      replace => {
        "target.process.file.mime_type" => "%{filetype}"
      }
      on_error => "filetype_not_found"
    }
  }
  if [Malware] != "" {
    mutate {
      replace => {
        "Malware_label.key" => "Malware"
        "Malware_label.value" => "%{Malware}"
      }
      on_error => "Malware_not_found"
    }
    if ![Malware_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "Malware_label"
        }
        on_error => "Malware_label_merge_failed"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601", "yyyy/MM/dd-HH:mm:ss","yyyy-MM-ddTHH:mm:ss+SS:SS"]
      target => "metadata.event_timestamp"
      on_error => "invalid_format"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
        "principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "hostname_not_found"
    }
  }
  if [network_protocol] != "" {
    mutate {
      replace => {
        "network.ip_protocol" => "%{network_protocol}"
      }
      on_error => "network_protocol_not_found"
    }
  }
  if [message] =~ "(?i)SSH" {
    mutate {
      replace => {
        "network.application_protocol" => "SSH"
      }
    }
  }
  else if [message] =~ "(?i)netconf" {
    mutate {
      replace => {
        "network.application_protocol" => "NETCONF"
      }
      on_error => "netconf_not_found"
    }
  }
  else if [message] =~ "(?i)tcp" {
    mutate {
      replace => {
        "network.ip_protocol" => "TCP"
      }
      on_error => "tcp_not_found"
    }
  }
  else if [message] =~ "(?i)dhcp" {
    mutate {
      replace => {
        "network.application_protocol" => "DHCP"
      }
      on_error => "dhcp_not_found"
    }
    if ![dhcp_not_found] {
      mutate {
        replace => {
          "has_network_dhcp" => "true"
        }
      }
    }
  }
  if [principal_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "principal_ip"
        "principal.asset.ip" => "principal_ip"
      }
      on_error => "principal_ip_not_found"
    }
    if ![principal_ip_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [target_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "target_ip"
        "target.asset.ip" => "target_ip"
      }
      on_error => "target_ip_not_found"
    }
    if ![target_ip_not_found] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [principal_port] != "" {
    mutate {
      replace => {
        "principal.port" => "%{principal_port}"
      }
      on_error => "principal_port_not_found"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "principal_port_not_integer"
    }
  }
  if [target_port] != "" {
    mutate {
      replace => {
        "target.port" => "%{target_port}"
      }
      on_error => "target_port_not_found"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "target_port_not_integer"
    }
  }
  if [system_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "system_ip"
        "principal.asset.ip" => "system_ip"
      }
      on_error => "system_ip_not_found"
    }
    if ![system_ip_not_found] {
