# Product: CyberArk Certificate Manager SaaS
# Category: Privileged Account Activity
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-09-03
# Copyright 2026 Google SecOps

filter {
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  for index, evt in events {
    mutate {
      replace => {
        "event" => ""
        "service_account" => ""
        "scopes" => ""
        "client_ip" => ""
        "fingerprint" => ""
        "target_hostname" => ""
        "target_port" => ""
        "validation_status" => ""
        "security_result" => ""
        "sec_action" => ""
        "scopes_field" => ""
        "fingerprint_field" => ""
        "event_type_field" => ""
        "has_principal" => "false"
        "has_target" => "false"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "CYBERARK"
        "event.idm.read_only_udm.metadata.product_name" => "CYBERARK_CERTIFICATE_MANAGER_SAAS"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{evt.eventName}"
        "event.idm.read_only_udm.metadata.description" => "%{evt.message}"
        "event.idm.read_only_udm.metadata.event_type" => ""
      }
      on_error => "no_metadata"
    }

    if [evt][createdAt] != "" {
      mutate {
        convert => {
          "evt.createdAt" => "string"
        }
        on_error => "createdAt_convert_failed"
      }
      date {
        match => ["evt.createdAt", "ISO8601", "RFC3339", "UNIX_MS"]
        on_error => "createdAt_date_conversion_failed"
      }
    }

    if [evt][criticality] != "" {
      mutate {
        convert => {
          "evt.criticality" => "string"
        }
        on_error => "criticality_convert_failed"
      }
      mutate {
        replace => {
          "security_result.severity_details" => "%{evt.criticality}"
        }
        on_error => "no_criticality"
      }
      if [evt][criticality] == "0" {
        mutate {
          replace => {
            "security_result.severity" => "INFORMATIONAL"
          }
        }
      } else if [evt][criticality] == "1" {
        mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      } else if [evt][criticality] == "2" {
        mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      } else if [evt][criticality] == "3" {
        mutate {
          replace => {
            "security_result.severity" => "HIGH"
          }
        }
      } else if [evt][criticality] == "4" {
        mutate {
          replace => {
            "security_result.severity" => "CRITICAL"
          }
        }
      } else {
        mutate {
          replace => {
            "security_result.severity" => "UNKNOWN_SEVERITY"
          }
        }
      }
    }

    if [evt][eventType] != "" {
      mutate {
        replace => {
          "event_type_field.key" => "eventType"
          "event_type_field.value.string_value" => "%{evt.eventType}"
        }
        on_error => "no_event_type_field"
      }
      if ![no_event_type_field] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "event_type_field"
          }
          on_error => "no_event_type_merge"
        }
      }
    }

    if [evt][eventType] == "Authentication" {
      if [evt][eventName] =~ "Granted" {
        mutate {
          replace => {
            "sec_action" => "ALLOW"
          }
        }
      }
      else if [evt][eventName] =~ "Denied" or [evt][eventName] =~ "Failed" {
        mutate {
          replace => {
            "sec_action" => "BLOCK"
          }
        }
      }

      if [sec_action] != "" {
        mutate {
          merge => {
            "security_result.action" => "sec_action"
          }
          on_error => "no_sec_action"
        }
      }

      grok {
        match => {
          "evt.message" => "^%{DATA:service_account}, access token granted with scopes: \\[%{DATA:scopes}\\] from client IP %{IPORHOST:client_ip}$"
        }
        overwrite => ["service_account", "scopes", "client_ip"]
        on_error => "grok_auth_message_failed"
      }

      if [service_account] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{service_account}"
            "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
          }
          on_error => "no_service_account"
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
          }
        }
      }

      if [client_ip] != "" {
        grok {
          match => {
            "client_ip" => "%{IP:client_ip}"
          }
          overwrite => ["client_ip"]
          on_error => "client_ip_not_ip"
        }
        if ![client_ip_not_ip] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "client_ip"
              "event.idm.read_only_udm.principal.asset.ip" => "client_ip"
            }
            on_error => "no_client_ip"
          }
          if ![no_client_ip] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }

      if [scopes] != "" {
        mutate {
          replace => {
            "scopes_field.key" => "scopes"
            "scopes_field.value.string_value" => "%{scopes}"
          }
          on_error => "no_scopes"
        }
        if ![no_scopes] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "scopes_field"
            }
            on_error => "no_scopes_merge"
          }
        }
      }
    } else if [evt][eventType] == "Certificates" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }

      grok {
        match => {
          "evt.message" => "^Validation finished for certificate with fingerprint %{DATA:fingerprint} - hostname is %{DATA:target_hostname} and port is %{POSINT:target_port}[.] Validation Status %{GREEDYDATA:validation_status}$"
        }
        overwrite => ["fingerprint", "target_hostname", "target_port", "validation_status"]
        on_error => "grok_cert_message_failed"
      }

      if [target_port] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.port" => "%{target_port}"
          }
          on_error => "no_target_port"
        }
        if ![no_target_port] {
          mutate {
            convert => {
              "event.idm.read_only_udm.target.port" => "integer"
            }
            on_error => "no_target_port_integer"
          }
        }
      }

      if [target_hostname] not in ["", "unknown"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
            "event.idm.read_only_udm.target.asset.hostname" => "%{target_hostname}"
          }
          on_error => "no_target_hostname"
        }
        if ![no_target_hostname] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }

      if [fingerprint] not in ["", "null"] {
        mutate {
          replace => {
            "fingerprint_field.key" => "certificate_fingerprint"
            "fingerprint_field.value.string_value" => "%{fingerprint}"
          }
          on_error => "no_fingerprint"
        }
        if ![no_fingerprint] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "fingerprint_field"
            }
            on_error => "no_fingerprint_merge"
          }
        }
      }

      if [validation_status] != "" {
        mutate {
          merge => {
            "security_result.category_details" => "validation_status"
          }
          on_error => "no_validation_status"
        }
      }
    }

    if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [event][idm][read_only_udm][metadata][event_type] == "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "no_security_result"
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
