# Product: HPE Nimble Storage
# Category: OS
# Supported Format: SYSLOG
# Reference: https://infosight.hpe.com/InfoSight/media/cms/active/public/pubs_NimbleOS%20Release%20Notes_5.2.1.0.pdf
# Last Updated: 2025-08-20
# Copyright 2025 Google SecOps


# Additional notes:
# 1. Log types: https://infosight.hpe.com/InfoSight/media/cms/active/public/pubs_GUI_Administration_Guide_NOS_50x.whz/jay1501525202073.html
# 2. Log format: https://infosight.hpe.com/InfoSight/media/cms/active/public/pubs_GUI_Administration_Guide_NOS_50x.whz/gzt1501525196667.html

filter {
  mutate {
    replace => {
      "_principal" => ""
      "_target" => ""
      "_event_type" => ""
      "_action" => ""
      "_extensions" => ""
      "_mechanism" => ""
      "_alert" => ""
      "array" => ""
      "group" => ""
      "type" => ""
      "time" => ""
      "object" => ""
      "object_id" => ""
      "client_ip" => ""
      "status" => ""
      "target" => ""
      "error" => ""
      "client" => ""
      "_summary" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "\<%{NONNEGINT:facility}\>%{SYSLOGBASE} (Group:%{NOTSPACE:group} )?(Array:%{NOTSPACE:array} )?Type:%{NUMBER:type} Time:(?P<time>.{24})#%{NUMBER} Id:%{NUMBER:id} (Object Id:(?P<object_id>[0-9a-f]*|\-) )?(Object:(%{NOTSPACE:object})? )?(Access Type:(%{WORD:access_type})? )?(Client IP:(%{IP:client_ip}|%{WORD:client})? )?(Status:(%{WORD:status})? )?(Target:%{NOTSPACE:target} )?(Error:(?P<error>.*)? )?Version:(?P<version>[0-9.a-z\-]+) Message:%{GREEDYDATA:data_message}"
      ]
    }
    overwrite => [
      "array", "group", "type", "time", "object", "object_id", "client_ip", "status", "target", "error", "client"
    ]
    on_error => "_not_found"
  }

  if [_not_found] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  date {
    match => ["time", "E MMM dd HH:mm:ss yyyy", "E MMM  d HH:mm:ss yyyy"]
  }

  # Event type matching and type specific setting of fields---------------------

  # Uncategorized file events (file creation events) for snapshots
  if [type] in [
    "10322", "10323", "10367"] {
    mutate {
      replace => {
        "_event_type" => "FILE_UNCATEGORIZED"
        "_target.resource.resource_type" => "STORAGE_OBJECT"
        "_target.resource.resource_subtype" => "volume_collection"
        "filename" => ""
      }
    }
    grok {
      match => {
        "data_message" => [
          "Scheduled snapshot succeeded"
          "Failed to synchronize with VMware vCenter",
          ".*volume collection %{NOTSPACE:filename} .*",
        ]
      }
      on_error => "_not_found"
      overwrite => ["filename"]
    }
    if [_not_found] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
    if [filename] == "" {
      mutate {
        replace => {
          "_target.file.full_path" => "%{target}"
        }
      }
      if [target] == "" {
        drop {
          tag => "TAG_NO_SECURITY_VALUE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "_target.file.full_path" => "%{filename}"
        }
      }
    }
    if [type] == "10367" {
      mutate {
        replace => {
          "_alert" => "true"
          "_summary" => "Failed to synchronize with VMware vCenter"
          "status" => "Failed"
        }
      }
    }
    else {
      mutate {
        replace => {
          "status" => "Succeeded"
        }
      }
    }
  }
  # File events other than creation for snapshots
  else if [type] in ["8019", "8020"] {
    if [type] == "8019" {
      mutate {
        replace => {
          "_event_type" => "FILE_MODIFICATION"
        }
      }
    }
    else {
      mutate {
        replace => {
          "_event_type" => "FILE_DELETION"
        }
      }
    }
    mutate {
      replace => {
        "_target.resource.resource_type" => "STORAGE_OBJECT"
        "_target.resource.resource_subtype" => "volume"
      }
    }
    grok {
      match => {
        "data_message" => [
          "Update snapshot %{NOTSPACE:filename} of volume %{NOTSPACE:volname}",
          "Delete snapshot %{NOTSPACE:filename} of volume %{NOTSPACE:volname}"
        ]
      }
      on_error => "_not_found"
    }
    if [_not_found] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
    mutate {
      replace => {
        "_target.file.full_path" => "%{filename}"
        "_target.resource.name" => "%{volname}"
      }
    }
  }
  # File syncing events (replication)
  else if [type] in ["11000", "11003"] {
    mutate {
      replace => {
        "_event_type" => "FILE_SYNC"
        "_target.resource.resource_type" => "DEVICE"
        "_target.resource.resource_subtype" => "replication_partner"
        "filename" => ""
        "partner" => ""
      }
    }
    grok {
      match => {
        "data_message" => [
          "Replication succeeded",
          "Successfully replicated snapshot collection %{DATA:filename} to partner %{NOTSPACE:partner}",
          "Partner synchronization failed",
          "Failed to synchronize replication configuration to partner %{NOTSPACE:partner}.* volume %{DATA:filename}, .*"
        ]
      }
      on_error => "_not_found"
      overwrite => ["filename", "partner"]
    }
    if [_not_found] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
    mutate {
      replace => {
        "_target.file.full_path" => "%{filename}"
        "_target.resource.name" => "%{partner}"
      }
    }
    if [type] == "11003" {
      mutate {
        replace => {
          "_alert" => "true"
          "_summary" => "Partner synchronization failed"
          "status" => "Failed"
        }
      }
    }
    else {
      mutate {
        replace => {
          "status" => "Succeeded"
        }
      }
    }
  }
  # File events for volumes/volume collections
  else if [type] in [
    "2002", "8002"]{
    mutate {
      replace => {
        "_event_type" => "FILE_MODIFICATION"
      }
    }
    if [type] == "8002" {
      mutate {
        replace => {
          "_target.resource.resource_type" => "STORAGE_OBJECT"
          "_target.resource.resource_subtype" => "volume_collection"
        }
      }
    }
    else {
      mutate {
        replace => {
          "_target.resource.resource_type" => "STORAGE_OBJECT"
          "_target.resource.resource_subtype" => "volume"
        }
      }
    }
    grok {
      match => {
        "data_message" => [
          ".*volume collection %{NOTSPACE:filename}",
          ".*volume %{NOTSPACE:filename}"
        ]
      }
      on_error => "_not_found"
    }
    if [_not_found] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
    mutate {
      replace => {
        "_target.file.full_path" => "%{filename}"
      }
    }
  }
  # User logout events
  else if [type] in [
    "1008", "1010"]{
    mutate {
      replace => {
        "_event_type" => "USER_LOGOUT"
        "_extensions.auth.type" => "MACHINE"
        "_mechanism" => "USERNAME_PASSWORD"
        "_target.resource.resource_type" => "UNSPECIFIED"
        "_target.resource.resource_subtype" => "user"
      }
      merge => {
        "_extensions.auth.mechanism" => "_mechanism"
      }
    }
    if [type] == "1010" {
      grok {
        match => {
          "data_message" => [
            "User %{NOTSPACE:username} session .*"
          ]
        }
        on_error => "_not_found"
      }
      if [_not_found] {
        drop {
          tag => "TAG_MALFORMED_ENCODING"
        }
      }
    }
    else{
      grok {
        match => {
          "data_message" => [
            "Logout user %{NOTSPACE:username}"
          ]
        }
        on_error => "_not_found"
      }
      if [_not_found] {
        drop {
          tag => "TAG_MALFORMED_ENCODING"
        }
      }
    }
    mutate {
      replace => {
        "_target.user.userid" => "%{username}"
      }
    }
  }
  # User login events
  else if [type] in ["1001", "14806"] {
    mutate {
      replace => {
        "_event_type" => "USER_LOGIN"
        "_extensions.auth.type" => "MACHINE"
        "_mechanism" => "USERNAME_PASSWORD"
        "_target.resource.resource_type" => "UNSPECIFIED"
      }
      merge => {
        "_extensions.auth.mechanism" => "_mechanism"
      }
    }
    if [type] == "1001" {
      mutate {
        replace => {
          "_target.resource.resource_subtype" => "user"
        }
      }
    }
    else {
      grok {
        match => {
          "data_message" => [
            "Root login succeeded."
            ".* controller .* from %{IP:client_ip} .*"
          ]
        }
        overwrite => ["client_ip"]
        on_error => "_not_found"
      }
      if [_not_found] {
        drop {
          tag => "TAG_MALFORMED_ENCODING"
        }
      }
      mutate {
        replace => {
          "_target.resource.resource_subtype" => "controller"
          "_target.user.user_display_name" => "Root"
          "status" => "Succeeded"
        }
      }
    }
  }
  # Uncategorized status events
  else if [type] in [
    "10417", "11002"]{
    mutate {
      replace => {
        "_event_type" => "STATUS_UNCATEGORIZED"
      }
    }
    if [type] == "10417" {
      mutate {
        replace => {
          "_target.resource.resource_type" => "UNSPECIFIED"
          "_target.resource.resource_subtype" => "default"
        }
      }
    }
    else{
      mutate {
        replace => {
          "filename" => ""
        }
      }
      grok {
        match => {
          "data_message" => [
            "Excessive replication delay"
            ".*volume collection %{NOTSPACE:filename} .*",
          ]
        }
        overwrite => ["filename"]
        on_error => "_not_found"
      }
      if [_not_found] {
        drop {
          tag => "TAG_MALFORMED_ENCODING"
        }
      }
      if [filename] != "" {
        mutate {
          replace => {
            "_target.file.full_path" => "%{filename}"
          }
        }
      }
      mutate {
        replace => {
          "_target.resource.resource_type" => "DEVICE"
          "_target.resource.resource_subtype" => "replication_partner"
          "_alert" => "true"
          "_summary" => "Excessive replication delay"
        }
      }
    }
  }
  # Audit log wipe (Generic because no user id given)
  else if [type] in ["14706", "1016", "1021"] {
    mutate {
      replace => {
        "_event_type" => "STATUS_UPDATE"
      }
    }

    grok {
      match => {
        "data_message" => [
          ".*Domain %{GREEDYDATA:domain}"
        ]
      }
      on_error => "domain_not_found"
    }

    if ![domain_not_found] {
      mutate {
        replace => {
          "_principal.administrative_domain" => "%{domain}"
        }
      }
    }
  }
  # Validation of network configuration
  else if [type] == "16004" {
    mutate {
      replace => {
        "_event_type" => "SETTING_UNCATEGORIZED"
        "_target.resource.resource_type" => "TASK"
        "_target.resource.type" => "SETTING"
        "_summary" => "Network configuration validation failed"
        # "_target.resource.resource_subtype" => "network_configuration"
      }
    }
  }
  # Protection schedule modification
  else if [type] == "8006" {
    mutate {
      replace => {
        "_event_type" => "SETTING_MODIFICATION"
        "_target.resource.type" => "SETTING"
        "_target.resource.resource_type" => "STORAGE_OBJECT"
        "_target.resource.resource_subtype" => "volume_collection"
      }
    }
    grok {
      match => {
        "data_message" => [
          ".*volume collection %{NOTSPACE:filename}",
        ]
      }
      on_error => "_not_found"
    }
    if [_not_found] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
    mutate {
      replace => {
        "_target.resource.name" => "%{filename}"
      }
    }
  }
  # Generic events
  else {
    mutate {
      replace => {
        "_event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }

  # Common fields---------------------------------------------------------------
  if [array] != "" {
    mutate {
      replace => {
        "_principal.resource.resource_type" => "DEVICE"
        "_principal.resource.resource_subtype" => "array"
        "_principal.resource.name" => "%{array}"
      }
    }
  }
  if [group] != "" {
    mutate {
      replace => {
        "_principal.group.group_display_name" => "%{group}"
      }
    }
  }

  if ([object_id] != "" && [object_id] != "-") {
    mutate {
      replace => {
        "_target.resource.id" => "%{object_id}"
      }
    }
  }

  if ([object] != "") {
    mutate {
      replace => {
        "_target.resource.name" => "%{object}"
      }
    }
  }

  if [client_ip] != "" {
    mutate {
      merge => {
        "_principal.ip" => "client_ip"
      }
    }
  }

  if [status] != "" {
    if [status] == "Succeeded" {
      mutate {
        replace => {
          "_action" => "ALLOW"
        }
      }
    }
    else if [status] == "Failed" {
      mutate {
        replace => {
          "_action" => "BLOCK"
          "_alert" => "true"
        }
      }
      if [error] != "" {
        mutate {
          replace => {
            "_security_result.description" => "%{error}"
          }
        }
      }
      if [_summary] == "" {
        mutate {
          replace => {
            "_summary" => "%{data_message}"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "_action" => "UNKNOWN_ACTION"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "_action" => "UNKNOWN_ACTION"
      }
    }
  }

  mutate {
    merge => {
      "_security_result.action" => "_action"
    }
  }

  if [target] != "" {
    mutate {
      replace => {
        "_target.resource.name" => "%{target}"
      }
    }
  }

  mutate {
    replace => {
      "_principal.hostname" => "%{logsource}"
    }
  }

  # Setting UDM fields----------------------------------------------------------
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      "event.idm.read_only_udm.metadata.description" => "%{data_message}"
      "event.idm.read_only_udm.metadata.event_type" => "%{_event_type}"
      "event.idm.read_only_udm.metadata.product_name" => "Nimble OS"
      "event.idm.read_only_udm.metadata.vendor_name" => "Nimble"
      "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
    }
    rename => {
      "_principal" => "event.idm.read_only_udm.principal"
    }
  }

  if [_target] != "" {
    mutate {
      rename => {
        "_target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [_alert] == "true" {
    mutate {
      replace => {
        "_security_result.summary" => "%{_summary}"
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "_security_result"
    }
  }

  if [_extensions] != "" {
    mutate {
      rename => {
        "_extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  # Setting data output---------------------------------------------------------
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
