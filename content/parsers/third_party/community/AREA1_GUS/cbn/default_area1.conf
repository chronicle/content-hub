# Product: AREA1
# Category: Email server
# Supported Format: JSON
# Reference: NA
# Last Updated: 2024-09-23
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "event.alert_id" => ""
      "security_result" => ""
      "event.from" => ""
      "event.replyto" => ""
      "event.subject" => ""
      "event.smtp_helo_server_ip" => ""
      "host" => ""
      "event.final_disposition" => ""
      "event.smtp_helo_server_name" => ""
      "smtp_helo_server_ip_as_name" => ""
      "event.smtp_helo_server_ip_as_number" => ""
      "has_principal" => "true"
      "has_email_info" => "false"
      "event.links" => ""
      "event.smtp_helo_server_ip_as_name" => ""
      "from" => ""
      "replyto" => ""
      "subject" => ""
      "smtp_helo_server_ip" => ""
      "final_disposition" => ""
      "smtp_helo_server_name" => ""
      "smtp_helo_server_ip_as_number" => ""
      "alert_id" => ""
      "links" => ""
      "envelope_to.0" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_a_json"
  }
  if ![not_a_json] {
    if [from] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.network.email.from" => "%{from}"
          "has_email_info" => "true"
        }
        on_error => "no_from"
      }
    }
    if [envelope_to][0] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.network.email.to" => "envelope_to.0"
        }
        on_error => "no_replyto"
      }
      mutate {
        replace => {
          "has_email_info" => "true"
        }
      }
    }
    if [subject] != "" {
      mutate {
        gsub => ["subject", "\\r\\n", ""]
      }
      mutate {
        merge => {
          "event2.idm.read_only_udm.network.email.subject" => "subject"
        }
        on_error => "no_subject"
      }
      mutate {
        replace => {
          "has_email_info" => "true"
        }
      }
    }
    if [final_disposition] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "final_disposition"
        }
        on_error => "no_final_disposition"
      }
    }
    if [smtp_helo_server_name] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.administrative_domain" => "%{smtp_helo_server_name}"
        }
        on_error => "no_smtp_helo_server_name"
      }
    }
    if [smtp_helo_server_ip_as_name] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.location.name" => "%{smtp_helo_server_ip_as_name}"
        }
        on_error => "no_smtp_helo_server_ip_as_name"
      }
    }
    if [smtp_helo_server_ip_as_number] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.asset_id" => "asset_id:%{smtp_helo_server_ip_as_number}"
        }
        on_error => "no_smtp_helo_server_ip_as_number"
      }
    }
    if [smtp_helo_server_ip] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.principal.ip" => "smtp_helo_server_ip"
          "event2.idm.read_only_udm.principal.asset.ip" => "smtp_helo_server_ip"
        }
        on_error => "no_smtp_helo_server_ip"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    if [alert_id] != "" {
      mutate {
        replace => {
          "security_result.rule_id" => "%{alert_id}"
        }
        on_error => "no_alert_id"
      }
    }
    if [links] != "" {
      mutate {
        replace => {
          "link_list.value" => ""
        }
      }
      for link in links {
        mutate {
          replace => {
            "link_label" => ""
          }
        }
        mutate {
          replace => {
            "link_label.string_value" => "%{link}"
          }
          on_error => "no_link"
        }
        mutate {
          merge => {
            "link_list.value.list_value.values" => "link_label"
          }
          on_error => "no_list"
        }
      }
      if ![no_list] {
        mutate {
          replace => {
            "link_list.key" => "links"
          }
        }
        mutate {
          merge => {
            "event2.idm.read_only_udm.additional.fields" => "link_list"
          }
          on_error => "no_link_list"
        }
      }
    }
    date {
      match => ["ts", "yyyy-MM-ddTHH:mm:ss"]
      on_error => "wrong_format"
    }
    if [event][from] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.network.email.from" => "%{event.from}"
          "has_email_info" => "true"
        }
        on_error => "no_from"
      }
    }
    if [host] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.hostname" => "%{host}"
          "event2.idm.read_only_udm.principal.asset.hostname" => "%{host}"
          "has_principal" => "true"
        }
        on_error => "no_host"
      }
    }
    if [event][replyto] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.network.email.to" => "event.replyto"
        }
        on_error => "no_replyto"
      }
      mutate {
        replace => {
          "has_email_info" => "true"
        }
      }
    }
    if [event][subject] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.network.email.subject" => "event.subject"
        }
        on_error => "no_subject"
      }
      mutate {
        replace => {
          "has_email_info" => "true"
        }
      }
    }
    if [event][final_disposition] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "event.final_disposition"
        }
        on_error => "no_final_disposition"
      }
    }
    if [event][smtp_helo_server_name] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.administrative_domain" => "%{event.smtp_helo_server_name}"
        }
        on_error => "no_smtp_helo_server_name"
      }
    }
    if [event][smtp_helo_server_ip_as_name] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.location.name" => "%{event.smtp_helo_server_ip_as_name}"
        }
        on_error => "no_smtp_helo_server_ip_as_name"
      }
    }
    if [event][smtp_helo_server_ip_as_number] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.asset_id" => "asset_id:%{event.smtp_helo_server_ip_as_number}"
        }
        on_error => "no_smtp_helo_server_ip_as_number"
      }
    }
    if [event][smtp_helo_server_ip] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.principal.ip" => "event.smtp_helo_server_ip"
          "event2.idm.read_only_udm.principal.asset.ip" => "event.smtp_helo_server_ip"
        }
        on_error => "no_smtp_helo_server_ip"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    if [event][alert_id] != "" {
      mutate {
        replace => {
          "security_result.rule_id" => "%{event.alert_id}"
        }
        on_error => "no_alert_id"
      }
    }
    if [event][links] != "" {
      mutate {
        replace => {
          "link_list.value" => ""
        }
      }
      for link in event.links {
        mutate {
          replace => {
            "link_label" => ""
          }
        }
        mutate {
          replace => {
            "link_label.string_value" => "%{link}"
          }
          on_error => "no_link"
        }
        mutate {
          merge => {
            "link_list.value.list_value.values" => "link_label"
          }
          on_error => "no_list"
        }
      }
      if ![no_list] {
        mutate {
          replace => {
            "link_list.key" => "links"
          }
        }
        mutate {
          merge => {
            "event2.idm.read_only_udm.additional.fields" => "link_list"
          }
          on_error => "no_link_list"
        }
      }
    }
    date {
      match => ["event.ts", "yyyy-MM-ddTHH:mm:ss"]
      on_error => "wrong_format"
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "no_security_result"
      }
    }
    if [has_principal] == "true" and [has_email_info] == "true" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
        }
      }
    } else {
      mutate {
        replace => {
          "event2.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    mutate {
      merge => {
        "@output" => "event2"
      }
    }
  }
  else {
    mutate {
      replace => {
        "message" => "{\"json_array\":%{message}}"
      }
    }

    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }

    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
    for data in json_array {
      mutate {
        replace => {
          "metadata" => ""
          "principal" => ""
          "network" => ""
          "security_result" => ""
          "target" => ""
          "country" => ""
          "state" => ""
          "city" => ""
          "event1" => ""
          "bounce_address" => ""
          "email" => ""
          "subject" => ""
        }
      }
      if [data][time] != "" {
        mutate {
          convert => {
            "data.time" => "string"
          }
          on_error => "convert_failed"
        }
        date {
          match => ["data.time", "UNIX_MS"]
          target => "metadata.event_timestamp"
          on_error => "wrong_format"
        }
      }

      mutate {
        replace => {
          "category" => "SOFTWARE_MALICIOUS"
        }
        merge => {
          "security_result.category_details" => "data.event.final_disposition"
          "security_result.category" => "category"
        }
        on_error => "no_final_disposition"
      }

      for attach in data.event.attachments {
        mutate {
          replace => {
            "sec_res" => ""
          }
        }
        mutate {
          replace => {
            "sec_res.about.file.sha1" => "%{attach.sha1}"
          }
          on_error => "no_sha1"
        }
        mutate {
          replace => {
            "sec_res.about.file.md5" => "%{attach.md5}"
          }
          on_error => "no_md5"
        }
        mutate {
          replace => {
            "sec_res.about.file.sha256" => "%{attach.sha256}"
          }
          on_error => "no_sha256"
        }
        mutate {
          replace => {
            "sec_res.about.file.full_path" => "%{attach.name}"
          }
          on_error => "no_name"
        }
        mutate {
          replace => {
            "sec_res.about.file.mime_type" => "%{attach.extension}"
          }
          on_error => "no_extension"
        }
        mutate {
          replace => {
            "sec_res.about.file.ssdeep" => "%{attach.ssdeep}"
          }
          on_error => "no_ssdeep"
        }
        mutate {
          convert => {
            "attach.att_size" => "string"
          }
          on_error => "convert_failed"
        }
        mutate {
          replace => {
            "sec_res.about.file.size" => "%{attach.att_size}"
          }
          convert => {
            "sec_res.about.file.size" => "uinteger"
          }
          on_error => "no_att_size"
        }
        mutate {
          replace => {
            "disposition_label.key" => "disposition"
            "disposition_label.value" => "%{attach.disposition}"
          }
          merge => {
            "sec_res.about.user.attribute.labels" => "disposition_label"
          }
          on_error => "no_disposition"
        }
        if [sec_res] != "" {
          mutate {
            merge => {
              "event1.idm.read_only_udm.security_result" => "sec_res"
            }
            on_error => "no_sec_res"
          }
        }
      }

      mutate {
        replace => {
          "principal.administrative_domain" => "%{data.event.smtp_helo_server_name}"
        }
        on_error => "no_smtp_helo_server_name"
      }

      mutate {
        merge => {
          "principal.ip" => "data.event.smtp_helo_server_ip"
        }
        on_error => "no_smtp_helo_server_ip"
      }

      grok {
        match => {
          "data.event.smtp_helo_server_ip_geo" => "%{WORD:country}\\/%{DATA:state}\\/%{GREEDYDATA:city}"
        }
        overwrite => ["country", "state", "city"]
        on_error => "geo_failed"
      }
      mutate {
        replace => {
          "principal.location.country_or_region" => "%{country}"
        }
        on_error => "no_country"
      }
      if [city] not in ["","-"] {
        mutate {
          replace => {
            "principal.location.city" => "%{city}"
          }
          on_error => "no_city"
        }
      }
      if [state] not in ["","-"] {
        mutate {
          replace => {
            "principal.location.state" => "%{state}"
          }
          on_error => "no_state"
        }
      }

      mutate {
        replace => {
          "principal.location.name" => "%{data.event.smtp_helo_server_ip_as_name}"
        }
        on_error => "no_smtp_helo_server_ip_as_name"
      }

      mutate {
        replace => {
          "principal.asset_id" => "asset_id:%{data.event.smtp_helo_server_ip_as_number}"
        }
        on_error => "smtp_helo_server_ip_as_number"
      }

      for recipient in data.event.envelope_to {
        if [recipient] =~ "^.+@.+$" {
          mutate {
            merge => {
              "network.email.to" => "recipient"
              "target.user.email_addresses" => "recipient"
            }
            on_error => "no_recipient"
          }
        }
      }

      mutate {
        replace => {
          "subject" => "%{data.event.subject}"
        }
        on_error => "no_subject"
      }
      if ![no_subject] and [subject] != "" {
        mutate {
          merge => {
            "network.email.subject" => "subject"
          }
          on_error => "no_subject"
        }
      }

      mutate {
        gsub => ["data.event.message_id", "<", ""]
      }
      mutate {
        gsub => ["data.event.message_id", ">", ""]
      }
      mutate {
        replace => {
          "metadata.product_log_id" => "%{data.event.message_id}"
        }
        on_error => "no_message_id"
      }
      mutate {
        replace => {
          "email" => "%{data.event.envelope_from}"
        }
        on_error => "no_envelope_from"
      }
      if ![no_envelope_from] {
        if [email] =~ "^.+@.+$" {
          mutate {
            replace => {
              "network.email.from" => "%{data.event.envelope_from}"
            }
            merge => {
              "principal.user.email_addresses" => "data.event.envelope_from"
            }
            on_error => "no_envelope_from"
          }
        }
      }

      mutate {
        replace => {
          "security_result.rule_id" => "%{data.event.alert_id}"
        }
        on_error => "no_alert_id"
      }

      mutate {
        replace => {
          "bounce_address" => "%{data.event.replyto}"
        }
        on_error => "no_replyto"
      }
      if ![no_replyto] {
        if [bounce_address] =~ "^.+@.+$" {
          mutate {
            replace => {
              "network.email.bounce_address" => "%{data.event.replyto}"
            }
            on_error => "no_replyto"
          }
        }
      }

      for index,reason in data.event.alert_reasons {
        mutate {
          replace => {
            "sec_res" => ""
          }
        }
        mutate {
          replace => {
            "sec_res.description" => "%{reason}"
          }
          on_error => "no_reason"
        }
        if [sec_res] != "" {
          mutate {
            merge => {
              "event1.idm.read_only_udm.security_result" => "sec_res"
            }
          }
        }
      }

      mutate {
        replace => {
          "delivery_label.key" => "delivery_mode"
          "delivery_label.value" => "%{data.event.delivery_mode}"
        }
        on_error => "no_delivery_mode"
      }
      if ![no_delivery_mode] {
        mutate {
          merge => {
            "security_result.detection_fields" => "delivery_label"
          }
        }
      }
      if [data][source] != "" {
        mutate {
          replace => {
            "metadata.vendor_name" => "%{data.source}"
          }
          on_error => "no_source"
        }
      }
      else {
        mutate {
          replace => {
            "metadata.vendor_name" => "area1security"
          }
        }
      }
      mutate {
        replace => {
          "metadata.product_name" => "AREA1"
          "metadata.event_type" => "EMAIL_TRANSACTION"
        }
      }

      # merge the data into udm nouns.
      if [metadata] != "" {
        mutate {
          rename => {
            "metadata" => "event1.idm.read_only_udm.metadata"
          }
        }
      }
      if [principal] != "" {
        mutate {
          rename => {
            "principal" => "event1.idm.read_only_udm.principal"
          }
        }
      }
      if [network] != "" {
        mutate {
          rename => {
            "network" => "event1.idm.read_only_udm.network"
          }
        }
      }
      if [target] != "" {
        mutate {
          rename => {
            "target" => "event1.idm.read_only_udm.target"
          }
        }
      }
      if [security_result] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.security_result" => "security_result"
          }
          on_error => "no_security_result"
        }
      }

      mutate {
        merge => {
          "@output" => "event1"
        }
      }
    }
  }
}

