        "has_file" => "true"
      }
      on_error => "md5_error"
    }
  }
  if [sha1] != "" {
    mutate {
      replace => {
        "event.idm.entity.entity.file.sha1" => "%{sha1}"
        "has_file" => "true"
      }
      on_error => "sha1_error"
    }
  }
  if [sha256] != "" {
    mutate {
      replace => {
        "event.idm.entity.entity.file.sha256" => "%{sha256}"
        "has_file" => "true"
      }
      on_error => "sha256_error"
    }
  }
  if [has_file] == "true" and [type] =~ "(?i)file" {
    mutate {
      replace => {
        "event.idm.entity.metadata.entity_type" => "FILE"
      }
    }
  }
  else if [has_host] == "true" {
    mutate {
      replace => {
        "event.idm.entity.metadata.entity_type" => "DOMAIN_NAME"
      }
    }
  }
  else if [has_ip] == "true" {
    mutate {
      replace => {
        "event.idm.entity.metadata.entity_type" => "IP_ADDRESS"
      }
    }
  }
  else if [has_url] == "true" {
    mutate {
      replace => {
        "event.idm.entity.metadata.entity_type" => "URL"
      }
    }
  }
  mutate {
    merge => {
      "event.idm.entity.metadata.threat" => "threat_detection"
    }
  }
  mutate {
    rename => {
      "relations" => "event.idm.entity.relations"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.entity.entity.security_result" => "security_result"
      }
      on_error => "security_result_error"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
