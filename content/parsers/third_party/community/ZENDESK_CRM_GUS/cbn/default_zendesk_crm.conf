# Product: ZENDESK_CRM
# Category: Ticketing Applications
# Reference: N/A
# Supported Format: JSON
# Last Updated: 2025-09-02
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "metadata" => ""
      "additional" => ""
      "target" => ""
      "security_result" => ""
      "network" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "url" => ""
      "id" => ""
      "action_label" => ""
      "actor_id" => ""
      "source_id" => ""
      "source_type" => ""
      "source_label" => ""
      "action" => ""
      "change_description" => ""
      "ip_address" => ""
      "created_at" => ""
      "actor_name" => ""
      "user_id" => ""
      "method" => ""
      "status" => ""
      "client" => ""
      "origin_service" => ""
      "authorization_type" => ""
      "has_network_http" => "false"
      "event_data_available" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }
  if [origin_service] != "" {
    mutate {
      replace => {
        "target.application" => "%{origin_service}"
      }
      on_error => "origin_service_not_present"
    }
  }
  if [method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{method}"
        "has_network_http" => "true"
      }
      on_error => "no_networkmethod"
    }
  }
  if [user_id] != "" {
    mutate {
      convert => {
        "user_id" => "string"
      }
      on_error => "user_id_already_string"
    }
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
        "has_user" => "true"
      }
      on_error => "user_id_not_present"
    }
  }
  if [status] != "" {
    mutate {
      rename => {
        "status" => "network.http.response_code"
      }
    }
    mutate {
      convert => {
        "network.http.response_code" => "integer"
      }
      on_error => "response_code_error"
    }
    mutate {
      replace => {
        "has_network_http" => "true"
      }
    }
  }
  if [client] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{client}"
        "has_network_http" => "true"
      }
      on_error => "no_client_user_agent"
    }
    mutate {
      replace => {
        "network.http.parsed_user_agent" => "%{client}"
      }
      on_error => "replace_client_parseduser_agent_error"
    }
    mutate {
      convert => {
        "network.http.parsed_user_agent" => "parseduseragent"
      }
      on_error => "convert_user_agent_error"
    }
  }
  if [url] != "" {
    mutate {
      replace => {
        "target.url" => "%{url}"
        "has_target" => "true"
      }
      on_error => "no_url"
    }
  }

  if [id] != "" {
    mutate {
      convert => {
        "id" => "string"
      }
      on_error => "id_not_present"
    }
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id}"
      }
      on_error => "id_not_present"
    }
  }
  mutate {
    rename => {
      "action_label" => "addition.action_label"
      "source_type" => "addition.source_type"
      "source_label" => "addition.source_label"
      "action" => "addition.action"
      "authorization_type" => "addition.authorization_type"
      "graphql.operation_name" => "addition.graphql_operation_name"
      "graphql.operation_type" => "addition.operation_type"
      "graphql.query" => "addition.query"
      "graphql.variables.hasMssAttachments" => "addition.hasMssAttachments"
      "graphql.variables.includeMaskedFields" => "addition.includeMaskedFields"
      "graphql.variables.ticketId" => "addition.ticketId"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "map_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "check_field" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [value] != "" {
      mutate {
        replace => {
          "map_field.key" => "%{key}"
        }
        on_error => "key_not_present"
      }
      if [key] == "authorization_type" {
        mutate {
          replace => {
            "map_field.value" => "%{value}"
          }
          on_error => "security_result_value_not_present"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "map_field"
          }
          on_error => "security_result_addition_merge_failed"
        }
      }
      else if [key] in ["graphql_operation_name", "operation_type", "query","ticketId"] {
        mutate {
          replace => {
            "map_field.value" => "%{value}"
          }
          on_error => "target_resource_attribute_labels_map_field_value_replace_error"
        }
        mutate {
          merge => {
            "target.resource.attribute.labels" => "map_field"
          }
          on_error => "target_resource_attribute_labels_addition_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "map_field.value.string_value" => "%{value}"
          }
          on_error => "addition_field_value_not_present"
        }
        mutate {
          merge => {
            "additional.fields" => "map_field"
          }
          on_error => "additional_fields_addition_merge_failed"
        }
      }
    }
  }
  for data in graphql.variables.messages {
    mutate {
      replace => {
        "value_array" => ""
      }
    }
    mutate {
      replace => {
        "value_array.string_value" => "%{data}"
      }
      on_error => "additional_data_empty"
    }
    mutate {
      merge => {
        "additional_data.value.list_value.values" => "value_array"
      }
      on_error => "additional_data_not_found"
    }
    if [value_array] != "" {
      mutate {
        replace => {
          "event_data_available" => "true"
        }
      }
    }
  }
  if [event_data_available] == "true" {
    mutate {
      replace => {
        "additional_data.key" => "Messages"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_data"
      }
      on_error => "additional_data_field_not_found"
    }
  }
  if [actor_id] != "" {
    mutate {
      convert => {
        "actor_id" => "string"
      }
      on_error => "no_actor_id"
    }
    mutate {
      replace => {
        "target.user.userid" => "%{actor_id}"
        "has_user" => "true"
      }
      on_error => "no_actor_id"
    }
  }

  if [source_id] != "" {
    mutate {
      convert => {
        "source_id" => "string"
      }
      on_error => "no_source_id"
    }
    mutate {
      replace => {
        "principal.user.userid" => "%{source_id}"
        "has_user" => "true"
      }
      on_error => "no_source_id"
    }
  }
  date {
    match => ["timestamp","ISO8601"]
    target => "metadata.event_timestamp"
    on_error => "timestamp_error"
  }

  if [change_description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{change_description}"
      }
      on_error => "change_description_not_present"
    }
  }

  if [ip_address] not in["", "null"] {
    mutate {
      merge => {
        "principal.ip" => "ip_address"
        "principal.asset.ip" => "ip_address"
      }
      on_error => "ip_address_invalid"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
      on_error => "no_actor_id"
    }
  }

  if [actor_name] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{actor_name}"
      }
      on_error => "actor_name_not_present"
    }
  }

  if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
      on_error => "no_principal"
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "no_user"
    }
  }

  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
      on_error => "no_principal"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "ZENDESK_CRM"
      "metadata.product_name" => "ZENDESK_CRM"
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_sec_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
