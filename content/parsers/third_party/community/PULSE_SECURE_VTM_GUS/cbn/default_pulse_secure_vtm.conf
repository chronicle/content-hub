# Product: PULSE_SECURE_VTM
# Category: Traffic Shapers
# Supported Format: SYSLOG
# Reference: See below
# Last Updated: 2023-11-03
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "AUTH" => ""
      "GROUP" => ""
      "USER" => ""
      "IP" => ""
      "OBJ" => ""
      "TEXT" => ""
      "FILE" => ""
      "TIMEOUT" => ""
      "LOGINTYPE" => ""
      "OPERATION" => ""
      "Path" => ""
      "rule" => ""
      "desc" => ""
      "timestamp" => ""
      "principal" => ""
      "event_type" => "GENERIC_EVENT"
      "principal_ip" => ""
      "hostname" => ""
      "principal_present" => "false"
      "old_browser_detected" => ""
      "product_event_type" => ""
      "target_process" => ""
      "network" => ""
      "target" => ""
      "extensions" => ""
      "security_result" => ""
      "intermediary_ip" => ""
      "intermediary" => ""
      "metadata" => ""
      "severity" => ""
      "action" => ""
      "kv_data1" => ""
      "kv_data2" => ""
      "description" => ""
    }
  }

  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601} %{IP:intermediary_ip} %{HOSTNAME:host} %{INT} - - (?P<severity>(DOS|INFO|WARN|SERIOUS))%{GREEDYDATA:description}"
    }
    overwrite => ["intermediary_ip","severity","description"]
    on_error => "grok_pattern_not_matched"
  }

  if [grok_pattern_not_matched] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }

  mutate {
    gsub => ["description","Old browser detected","old_browser_detected"]
  }

  grok {
    match => {
      "description" => [
        ".(?P<action>audit).%{GREEDYDATA:kv_data1}",
        "(?P<rule>rules/01-http-https-redirect)\\t%{GREEDYDATA:product_event_type}\\t%{GREEDYDATA:hostname}\\t%{GREEDYDATA:kv_data2}"
        ".%{GREEDYDATA:rule}\\t%{GREEDYDATA:product_event_type}\\t%{GREEDYDATA:hostname}\\t%{IP:principal_ip} Requesting %{GREEDYDATA:target_process}",
        ".%{GREEDYDATA:rule}\\t%{GREEDYDATA:product_event_type}\\t%{GREEDYDATA}from %{IP:principal_ip},%{GREEDYDATA}",
        ".%{GREEDYDATA:rule}\\t%{GREEDYDATA:product_event_type}\\t(%{INT}\\t)?%{GREEDYDATA:desc}",
        ".%{GREEDYDATA:product_event_type}\\t%{GREEDYDATA:desc}"
      ]
    }
    overwrite => ["kv_data1","action","rule","target_process","hostname","principal_ip","product_event_type","desc","kv_data2"]
  }

  if [kv_data1] != "" {
    mutate {
      gsub => ["kv_data1","([a-zA-Z0-9]+)=","#$1="]
    }
    kv {
      source => "kv_data1"
      field_split => "#"
      value_split => "="
      on_error => "not_kv"
    }
  }

  if [kv_data2] != "" {
    mutate {
      gsub => ["kv_data2","([a-zA-Z0-9_]+):","#$1:"]
    }
    kv {
      source => "kv_data2"
      field_split => "#"
      value_split => ":"
      on_error => "not_kv"
    }
  }

  if [severity] != "" {
    if [severity] == "INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [severity] == "WARN" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    } else if [severity] == "SERIOUS" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.severity_details" => "%{severity}"
        }
      }
    }
  }

  if [USER] != "" {
    mutate {
      replace => {
        "target.user.user_display_name" => "%{USER}"
      }
      on_error => "invalid_user"
    }
  }

  if [hostname] != "" {
    grok {
      match => {
        "hostname" => "%{GREEDYDATA}/%{HOSTNAME:hostname}"
      }
      on_error => "pattern_not_matched"
    }
    if ![pattern_not_matched] {
      mutate {
        replace => {
          "principal.hostname" => "%{hostname}"
        }
        on_error => "invalid_hostname"
      }
      if not [invalid_hostname] {
        mutate {
          replace => {
            "principal_present" => "true"
            "event_type" => "STATUS_UPDATE"
          }
        }
      }
    }
  }

  if [IP] != "" {
    grok {
      match => {
        "IP" => "%{IP:src_ip}"
      }
      overwrite => ["src_ip"]
      on_error => "not_ip"
    }
    if not [not_ip] {
      mutate {
        merge => {
          "principal.ip" => "src_ip"
        }
        on_error => "invalid_src_ip"
      }
      if not [invalid_src_ip] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
    }
  }

  if [AUTH] not in ["","!!ABSENT!!"] {
    if [AUTH] in ["local","LOCAL"] {
      mutate {
        replace => {
          "auth_type" => "LOCAL"
        }
      }
      mutate {
        merge => {
          "extensions.auth.mechanism" => "auth_type"
        }
        on_error => "invalid_auth_type"
      }
    } else {
      mutate {
        replace => {
          "auth_label.key" => "AUTH"
          "auth_label.value" => "%{AUTH}"
        }
        on_error => "invalid_auth"
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "auth_label"
        }
        on_error => "invalid_auth_label"
      }
    }
  }

  if [FILE] != "" {
    mutate {
      replace => {
        "principal.file.full_path" => "%{FILE}"
      }
      on_error => "invalid_file"
    }
  }

  if [GROUP] not in ["","!!ABSENT!!"] {
    mutate {
      replace => {
        "principal.group.group_display_name" => "%{GROUP}"
      }
      on_error => "invalid_group"
    }
  }

  if [LOGINTYPE] != "" {
    mutate {
      replace => {
        "logintype_label.key" => "LOGINTYPE"
        "logintype_label.value" => "%{LOGINTYPE}"
      }
      on_error => "invalid_login_type"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "logintype_label"
      }
      on_error => "invalid_login_type_label"
    }
  }

  if [OBJ] != "" {
    mutate {
      replace => {
        "obj_label.key" => "OBJ"
        "obj_label.value" => "%{OBJ}"
      }
      on_error => "invalid_obj"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "obj_label"
      }
      on_error => "invalid_obj_label"
    }
  }

  if [TEXT] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{TEXT}"
      }
      on_error => "invalid_text"
    }
  }

  if [TIMEOUT] != "" {
    mutate {
      replace => {
        "timeout_label.key" => "TIMEOUT"
        "timeout_label.value" => "%{TIMEOUT}"
      }
      on_error => "invalid_timeout"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "timeout_label"
      }
      on_error => "invalid_timeout_label"
    }
  }

  if [OPERATION] != "" {
    mutate {
      replace => {
        "operation_label.key" => "OPERATION"
        "operation_label.value" => "%{OPERATION}"
      }
      on_error => "invalid_operation"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "operation_label"
      }
      on_error => "invalid_operation_label"
    }
    if [OPERATION] =~ "login" and [USER] != "" {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "extensions.auth.type" => "MACHINE"
        }
      }
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "invalid_product_event_type"
    }
  }

  if [old_browser_detected] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{old_browser_detected}"
      }
      on_error => "invalid_old_browser_detected"
    }
  }

  if [Path] not in ["","/"] {
    mutate {
      replace => {
        "target.process.file.full_path" => "%{Path}"
      }
      on_error => "invalid_path"
    }
  }

  if [rule] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{rule}"
      }
      on_error => "invalid_rule"
    }
  }

  if [principal_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "principal_ip"
      }
      on_error => "invalid_principal_ip"
    }
    if not [invalid_principal_ip] {
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
    }
  }

  if [target_process] != "" {
    mutate {
      replace => {
        "target.process.file.full_path" => "%{target_process}"
      }
      on_error => "invalid_target_process"
    }
  }

  if [desc] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{desc}"
      }
      on_error => "invalid_desc"
    }
  } else if [description] != "" and [kv_data1] == "" and [kv_data2] == "" {
    grok {
      match => {
        "description" => "%{GREEDYDATA}\\t%{GREEDYDATA:description}"
      }
      overwrite => ["description"]
      on_error => "pattern_not_matched"
    }
    if not [pattern_not_matched] {
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
      }
    }
  }

  if [host] != "" and [principal_present] == "false" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
      }
      on_error => "invalid_host"
    }
    if not [invalid_host] {
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
    }
  } else if [host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{host}"
      }
      on_error => "invalid_host"
    }
  }

  if [intermediary_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "intermediary_ip"
      }
      on_error => "invalid_intermediary_ip"
    }
  }

  if [event_type] == "GENERIC_EVENT" and [principal_present] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "PULSE_SECURE_VTM"
      "metadata.vendor_name" => "PULSE_SECURE_VTM"
      "metadata.event_type" => "%{event_type}"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
