# Product: AWS Control Tower
# Category: Identity and Access Management
# Supported Format: JSON
# Reference: NA
# Last Updated: 2026-07-24
# Copyright 2024 Chronicle LLC

filter {
  # define all the variables used
  mutate {
    replace => {
      "action_allow" => "ALLOW"
      "action_block" => "BLOCK"
    }
  }
  # Normalize to Records array to support multi events
  if [message] =~ "Records.{1,2}\\\\s*?:\\\\s*?\\\\["
    and [message] !~ "resourceRecords"{
    mutate {
      replace => {
        "jsonstring" => "%{message}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "jsonstring" => "{  \"Records\": [ %{message} ]}"
      }
    }
  }
  json {
    source => "jsonstring"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  if ![not_json] and [Records] != "" {
    for req in Records {
      mutate {
        replace => {
          "principal" => ""
          "target" => ""
          "network" => ""
          "metadata" => ""
          "src" => ""
          "additional" => ""
          "extensions" => ""
          "security_result" => ""
          "security_action" => ""
          "event" => ""
          "event_time" => ""
          "prin_ip" => ""
          "principal_ip" => ""
          "principal_port" => ""
          "digestStartTime" => ""
          "att_mfa" => ""
          "att_label" => ""
          "request_error" => ""
          "req_params" => ""
          "res_params" => ""
          "about_req" => ""
          "about_res" => ""
          "labels_1" => ""
          "labels_2" => ""
          "labels_3" => ""
          "labels_4" => ""
          "additional_fields" => ""
          "additional_field" => ""
          "req_event_type" => ""
          "req_eventName" => ""
          "req_eventID" => ""
          "req_sharedEventID" => ""
          "req_eventVersion" => ""
          "req_bytes_in" => ""
          "req_bytes_out" => ""
          "auth_mechanism" => "REMOTE"
          "eventCategory" => ""
          "about_labels" => ""
          "sec_action" => ""
          "digest_sign_label" => ""
          "digest_public_key" => ""
          "about_resource" => ""
          "req_userIdentity_sessionContext_sessionIssuer_arn" => ""
          "session_issuer_att" => ""
          "req_host_param" => ""
          "sec_label_read_only" => ""
          "sec_label_management_event" => ""
          "temp_invokedBy" => ""
          "invoked_by_label" => ""
          "client_provided_host_header" => ""
          "req_sharedEventID_label" => ""
          "res_account_id" => ""
          "res_type" => ""
          "res_arn" => ""
          "has_principal" => "false"
          "has_principal_user_id" => "false"
          "has_principal_user" => "false"
          "req_userIdentity_arn" => ""
          "req_userIdentity_userName" => ""
          "has_target_user_id" => "false"
          "req_userIdentity_sessionContext_sessionIssuer_userName" => ""
          "req_digestS3Object" => ""
          "req_previousDigestHashValue" => ""
          "att_mfa_label" => ""
          "req_userIdentity_accountId" => ""
          "userIdentity_arn" => ""
          "principal_id" => ""
          "userIdentity_arn_label" => ""
          "has_target" => "false"
          "req_readOnly" => ""
          "req_managementEvent" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "index_convert_error"
      }
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
          "metadata.product_name" => "AWS Control Tower"
          "metadata.vendor_name" => "AWS"
          "principal.asset.attribute.cloud.environment" => "AMAZON_WEB_SERVICES"
        }
      }
      mutate {
        replace => {
          "metadata.product_event_type" => "%{req.eventName}"
        }
        on_error => "no_eventName"
      }
      mutate {
        replace => {
          "metadata.product_log_id" => "%{req.eventID}"
        }
        on_error => "no_event_id"
      }
      mutate {
        replace => {
          "req_sharedEventID" => "%{req.sharedEventID}"
        }
        on_error => "no_shared_event_id"
      }
      if [req_sharedEventID] != "" {
        mutate {
          replace => {
            "req_sharedEventID_label.key" => "req_sharedEventID"
            "req_sharedEventID_label.value.string_value" => "%{req_sharedEventID}"
          }
          on_error => "no_shared_event_id_label"
        }
        if ![no_shared_event_id_label] {
          mutate {
            merge => {
              "additional.fields" => "req_sharedEventID_label"
            }
            on_error => "no_shared_event_id_label"
          }
        }
      }
      mutate {
        replace => {
          "req_eventVersion" => "%{req.eventVersion}"
        }
        on_error => "no_eventVersion"
      }
      if [req_eventVersion] != "" {
        mutate {
          replace => {
            "metadata.product_version" => "%{req_eventVersion}"
          }
          on_error => "no_product_version"
        }
      }
      if [event_time] == "" {
        mutate {
          replace => {
            "event_time" => "%{req.eventTime}"
          }
          on_error => "event_time_not_found"
        }
        if [event_time_not_found] {
          mutate {
            replace => {
              "event_time" => "%{req.digestStartTime}"
            }
            on_error => "event_time_not_found"
          }
        }
      }
      date {
        match => ["event_time", "ISO8601"]
        target => "metadata.event_timestamp"
        on_error => "eventtime_does_not_exist"
      }

      mutate {
        replace => {
          "additional_field.key" => "eventType"
          "additional_field.value.string_value" => "%{req.eventType}"
        }
        on_error => "no_event_type"
      }
      if ![no_event_type] {
        mutate {
          merge => {
            "additional.fields" => "additional_field"
          }
        }
      }
      # PRINCIPAL
      mutate {
        replace => {
          "principal.resource.type" => "%{req.userIdentity.type}"
        }
        on_error => "no_identity_type"
      }
      mutate {
        replace => {
         "additional_fields" => ""
        }
      }
      mutate {
        replace => {
          "additional_fields.key" => "accessKeyId"
          "additional_fields.value.string_value" => "%{req.userIdentity.accessKeyId}"
        }
        merge => {
          "additional.fields" => "additional_fields"
        }
        on_error => "_additional_field_not_set"
      }
      # TARGET
      mutate {
        replace => {
          "req_userIdentity_userName" => "%{req.userIdentity.userName}"
        }
        on_error => "req_userIdentity_userName_not_found"
      }
      mutate {
        replace => {
         "req_userIdentity_arn" => "%{req.userIdentity.arn}"
        }
        on_error => "req_userIdentity_arn_replace_error"
      }
      if [req_userIdentity_userName] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{req.userIdentity.userName}"
            "has_target_user_id" => "true"
          }
          on_error => "userIdentity_username_empty"
        }
      }
      else if [req_userIdentity_arn] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{req_userIdentity_arn}"
            "has_target_user_id" => "true"
          }
          on_error => "userIdentity_arn_empty"
        }
      }
      mutate {
        replace => {
          "req_userIdentity_sessionContext_sessionIssuer_userName" => "%{req.userIdentity.sessionContext.sessionIssuer.userName}"
        }
        on_error => "req_userIdentity_sessionContext_sessionIssuer_userName_not_found"
      }
      if [req_userIdentity_sessionContext_sessionIssuer_userName] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{req.userIdentity.sessionContext.sessionIssuer.userName}"
            "has_principal_user_id" => "true"
          }
          on_error => "not_found_principal_user_userid"
        }
      }
      mutate {
        replace => {
          "req_userIdentity_sessionContext_sessionIssuer_arn" => "%{req.userIdentity.sessionContext.sessionIssuer.arn}"
        }
        on_error => "req_userIdentity_sessionContext_sessionIssuer_arn_not_found"
      }
      if [req_userIdentity_sessionContext_sessionIssuer_arn] != "" {
        mutate {
          replace => {
            "session_issuer_att.value" => "%{req_userIdentity_sessionContext_sessionIssuer_arn}"
            "session_issuer_att.key" => "sessionIssuerArn"
          }
          on_error => "no_session_issuer_arn"
        }
        if ![no_session_issuer_arn] {
          mutate {
            merge => {
              "principal.user.attribute.labels" => "session_issuer_att"
            }
            on_error => "session_issuer_att_error"
          }
        }
      }
      mutate {
        replace => {
          "temp_invokedBy" => "%{req.userIdentity.invokedBy}"
        }
        on_error => "no_invokedBy"
      }
      if [temp_invokedBy] != "" {
        mutate {
          replace => {
            "invoked_by_label.key" => "invoked_by"
            "invoked_by_label.value" => "%{temp_invokedBy}"
          }
          on_error => "no_invoked_by_label"
        }
        if ![no_invoked_by_label] {
          mutate {
            merge => {
              "principal.user.attribute.labels" => "invoked_by_label"
            }
            on_error => "invoked_by_label_error"
          }
        }
      }
      mutate {
        convert => {
          "req.userIdentity.arn" => "string"
        }
        on_error => "userIdentity_arn_convert_error"
      }
      mutate {
        replace => {
          "userIdentity_arn" => "%{req.userIdentity.arn}"
        }
        on_error => "no_userIdentity_arn"
      }
      if [userIdentity_arn] != "" {
        mutate {
          replace => {
            "userIdentity_arn_label.key" => "ARN"
            "userIdentity_arn_label.value" => "%{userIdentity_arn}"
          }
          on_error => "userIdentity_arn_label_error"
        }
        if ![userIdentity_arn_label_error] {
          mutate {
            merge => {
              "principal.user.attribute.labels" => "userIdentity_arn_label"
            }
            on_error => "userIdentity_arn_label_merge_error"
          }
        }
      }
      mutate {
        convert => {
          "att_mreq.userIdentity.sessionContext.attributes.mfaAuthenticatedfa" => "string"
        }
        on_error => "att_mfa_convert_error"
      }
      mutate {
        replace => {
          "att_mfa" => "%{req.userIdentity.sessionContext.attributes.mfaAuthenticated}"
        }
        on_error => "_no_value_mfa"
      }
      if [att_mfa] != "" {
        mutate {
          replace => {
            "att_mfa_label.key" => "mfaAuthenticated"
            "att_mfa_label.value" => "%{att_mfa}"

          }
          on_error => "no_value_mfa_label"
        }
        if ![no_value_mfa_label] {
          mutate {
            merge => {
              "principal.user.attribute.labels" => "att_mfa_label"
            }
            on_error => "att_mfa_merge_error"
          }
        }
      }
      mutate {
        replace => {
          "req_userIdentity_accountId" => "%{req.userIdentity.accountId}"
        }
        on_error => "no_accountId"
      }
      if [req_userIdentity_accountId] != "" {
        mutate {
          merge => {
            "principal.user.group_identifiers" => "req.userIdentity.accountId"
          }
          on_error => "not_found_principal_user_group_identifiers"
        }
      }
      mutate {
        replace => {
          "req_event_type" => "%{req.eventType}"
        }
        on_error => "eventType_not_exist"
      }
      if ![eventType_not_exist] and [req_event_type] != "" {
        mutate {
          replace => {
            "prin_ip" => "%{req.sourceIPAddress}"
          }
        }
        if [prin_ip] != "" {
          grok {
            match => {
              "prin_ip" => [ "%{IP:principal_ip}(?::%{POSINT:principal_port})?" ]
            }
            overwrite => ["principal_ip", "principal_port"]
            on_error => "not_valid_ip"
          }
          if ![not_valid_ip] {
            mutate {
              merge => {
                "principal.ip" => "principal_ip"
              }
              on_error => "principal_ip_error"
            }
            if ![principal_ip_error] {
              mutate {
                replace => {
                  "has_principal" => "true"
                }
              }
            }
            if [principal_port] != "" {
              mutate {
                convert => {
                  "principal_port" => "integer"
                }
              }
              mutate {
                rename => {
                  "principal_port" => "principal.port"
                }
              }
            }
          }
          else {
            mutate {
              replace => {
                "principal.hostname" => "%{prin_ip}"
                "has_principal" => "true"
              }
            }
          }
        }
      }
      mutate {
        replace => {
          "network.http.user_agent" => "%{req.userAgent}"
        }
        on_error => "no_userAgent"
      }
      mutate {
        convert => {
          "req.additionalEventData.bytesTransferredIn" => "string"
        }
        on_error => "bytesTransferredIn_not_converted"
      }
      mutate {
        replace => {
          "req_bytes_in" => "%{req.additionalEventData.bytesTransferredIn}"
        }
        on_error => "no_bytesTransferredIn"
      }
      if [req_bytes_in] != "" {
        mutate {
          replace => {
            "network.received_bytes" => "%{req_bytes_in}"
          }
          on_error => "no_received_bytes"
        }
        mutate {
          convert => {
            "network.received_bytes" => "uinteger"
          }
          on_error => "received_bytes_not_converted"
        }
      }
      mutate {
        convert => {
          "req.additionalEventData.bytesTransferredOut" => "string"
        }
        on_error => "bytesTransferredOut_not_converted"
      }
      mutate {
        replace => {
          "req_bytes_out" => "%{req.additionalEventData.bytesTransferredOut}"
        }
        on_error => "no_bytesTransferredOut"
      }
      if [req_bytes_out] != "" {
        mutate {
          replace => {
            "network.sent_bytes" => "%{req_bytes_out}"
          }
          on_error => "no_sent_bytes"
        }
        mutate {
          convert => {
            "network.sent_bytes" => "uinteger"
          }
          on_error => "sent_bytes_not_converted"
        }
      }
      mutate {
        replace => {
          "req_host_param" => "%{req.requestParameters.Host}"
        }
        on_error => "no_req_param_Host"
      }
      if [req_host_param] != "" {
        mutate {
          replace => {
            "target.hostname" => "%{req_host_param}"
            "target.asset.hostname" => "%{req_host_param}"
            "has_target" => "true"
          }
          on_error => "no_target_hostname"
        }
      }
      mutate {
        replace => {
          "client_provided_host_header" => "%{req.tlsDetails.clientProvidedHostHeader}"
        }
        on_error => "no_clientProvidedHostHeader"
      }
      if [client_provided_host_header] != "" {
        mutate {
          replace => {
            "network.http.referral_url" => "%{client_provided_host_header}"
          }
          on_error => "no_referral_url"
        }
      }
      mutate {
        replace => {
          "src.user.userid" => "%{req.requestParameters.userName}"
          "src.user.user_display_name" => "%{req.requestParameters.userName}"
        }
        on_error => "no_userName"
      }
      mutate {
        replace => {
          "target.group.group_display_name" => "%{req.requestParameters.groupName}"
        }
        on_error => "no_groupName"
      }
      mutate {
        replace => {
          "request_error" => "%{req.errorCode}"
        }
        on_error => "no_request_error"
      }

      if ![no_request_error] {
        mutate {
          replace => {
            "security_result.rule_id" => "%{request_error}"
          }
        }
      }
      mutate {
        replace => {
          "req_errorMessage" => "Reason: %{req.errorMessage}"
        }
        on_error => "no_error_message"
      }
      if ![no_error_message] {
        mutate {
          replace => {
            "security_result.description" => "%{req_errorMessage}"
          }
        }
      }
      mutate {
        convert => {
          "req.readOnly" => "string"
        }
        on_error => "readOnly_not_converted"
      }
      mutate {
        replace => {
          "req_readOnly" => "%{req.readOnly}"
        }
        on_error => "readOnly_replace_error"
      }
      if [req_readOnly] != "" {
        mutate {
          replace => {
            "sec_label_read_only.key" => "readOnly"
            "sec_label_read_only.value" => "%{req.readOnly}"
          }
          on_error => "sec_label_read_only_replace_error"
        }
        if ![sec_label_read_only_replace_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "sec_label_read_only"
            }
            on_error => "sec_label_read_only_merge_error"
          }
        }
      }
      mutate {
        convert => {
          "req.managementEvent" => "string"
        }
        on_error => "managementEvent_not_converted"
      }
      mutate {
        replace => {
          "req_managementEvent" => "%{req.managementEvent}"
        }
        on_error => "managementEvent_replace_error"
      }
      if [req_managementEvent] != "" {
        mutate {
          replace => {
            "sec_label_management_event.key" => "managementEvent"
            "sec_label_management_event.value" => "%{req.managementEvent}"
          }
          on_error => "sec_label_management_event_replace_error"
        }
        if ![sec_label_management_event_replace_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "sec_label_management_event"
            }
            on_error => "sec_label_management_event_merge_error"
          }
        }
      }
      mutate {
        replace => {
          "principal.location.name" => "%{req.awsRegion}"
        }
        on_error => "no_location_name"
      }
      mutate {
        replace => {
          "principal_id" => "%{req.userIdentity.principalId}"
        }
        on_error => "no_principal_id"
      }
      if [principal_id] != "" {
        mutate {
          replace => {
            "principal.user.product_object_id" => "%{principal_id}"
            "has_principal_user" => "true"
          }
          on_error => "no_object_id"
        }
      }
      mutate {
        replace => {
          "target.application" => "%{req.eventSource}"
        }
        on_error => "no_event_source"
      }
      if ![no_request_error] or [request_error] in
        ['AccessDenied', 'ThrottlingException','Client.RequestLimitExceeded'] {
        mutate {
          replace => {
            "security_action" => "%{action_block}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "security_action" => "%{action_allow}"
          }
        }
      }
      mutate {
        replace => {
          "auth_mechanism" => "REMOTE"
        }
      }
      mutate {
        merge => {
          "extensions.auth.mechanism" => "auth_mechanism"
        }
      }
      for res in req.resources {
        mutate {
          replace => {
            "res_arn" => ""
            "res_type" => ""
            "res_account_id" => ""
          }
        }
        mutate {
          replace => {
            "res_arn" => "%{res.ARN}"
          }
          on_error => "res_arn_replace_failed"
        }
        if [res_arn] != "" {
          mutate {
            replace => {
              "target.resource.name" => "%{res_arn}"
            }
            on_error => "no_res_arn"
          }
        }
        mutate {
          replace => {
            "res_type" => "%{res.type}"
          }
          on_error => "no_res_type"
        }
        if [res_type] != "" {
          mutate {
            replace => {
              "target.resource.resource_subtype" => "%{res_type}"
            }
            on_error => "no_res_subtype"
          }
        }
        mutate {
          replace => {
            "res_account_id" => "%{res.accountId}"
          }
          on_error => "res_account_id_replace_failed"
        }
        if [res_account_id] != "" {
          mutate {
            replace => {
              "target.resource.product_object_id" => "%{res_account_id}"
            }
            on_error => "no_res_account_id_replace"
          }
        }
      }
      mutate {
        replace => {
          "labels_1.key" => "Request ID"
          "labels_1.value" => "%{req.requestID}"
        }
        on_error => "no_label_1"
      }
      if ![no_label_1] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "labels_1"
          }
        }
      }
      mutate {
        replace => {
          "labels_2.key" => "Recipient Account Id"
          "labels_2.value" => "%{req.recipientAccountId}"
        }
        on_error => "no_label_2"
      }
      if ![no_label_2] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "labels_2"
          }
        }
      }
      mutate {
        replace => {
          "eventCategory" => "%{req.eventCategory}"
        }
        on_error => "no_event_category"
      }
      if ![no_event_category] {
        mutate {
          merge => {
            "security_result.category_details" => "eventCategory"
          }
        }
      }
      if ![eventType_not_exist] and [req_event_type] != "" {
        mutate {
          replace => {
            "metadata.product_event_type" => "%{req.eventName}"
            "security_result.severity" => "INFORMATIONAL"
          }
        }
        if [no_request_error] {
          mutate {
            replace => {
              "security_result.summary" => "%{req.eventName} Success."
            }
          }
          mutate {
            replace => {
              "network.tls.cipher" => "%{req.tlsDetails.cipherSuite}"
            }
            on_error => "no_cipher"
          }
          mutate {
            replace => {
              "network.tls.version" => "%{req.tlsDetails.tlsVersion}"
            }
            on_error => "no_version"
          }
        }
        else {
          mutate {
            replace => {
              "security_result.summary" => "%{req.eventName} Fail."
            }
          }
        }
        if [has_principal] == "true" and [has_principal_user_id] == "true" {
          mutate {
            replace => {
              "metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
        else if [has_principal] == "true" and [has_target] == "true" {
          mutate {
            replace => {
              "metadata.event_type" => "NETWORK_CONNECTION"
            }
          }
        }
        else if [has_principal] == "true"  {
          mutate {
            replace => {
              "metadata.event_type" => "STATUS_UPDATE"
            }
          }
        }
        else {
          mutate {
            replace => {
              "metadata.event_type" => "GENERIC_EVENT"
            }
          }
        }
        if [req][eventName] =~ '(DescribeInstances|DescribeInstanceStatus)' {
          if [has_principal_user_id] == "true" or [has_principal_user] == "true" or [has_target_user_id] == "true" {
            mutate {
              replace => {
                "metadata.event_type" => "USER_RESOURCE_ACCESS"
              }
            }
          }
          else {
            mutate {
              replace => {
                "metadata.event_type" => "GENERIC_EVENT"
              }
            }
          }
          if ![no_request_error] {
            mutate {
              replace => {
                "security_result.summary" => "User not authorized"
              }
            }
          }
        }
        else if [req][eventName] =~ '(DescribeRouteTables|ListDomainNames)' {
          if [has_principal_user_id] == "true" or [has_principal_user] == "true" or [has_target_user_id] == "true" {
            mutate {
              replace => {
                "metadata.event_type" => "USER_RESOURCE_ACCESS"
                "security_result.severity" => "INFORMATIONAL"
                "about_labels" => ""
              }
            }
            mutate {
              replace => {
                "metadata.product_event_type" => "%{req.eventName}"
              }
              on_error => "req_event_name_error"
            }
          }
          else {
            mutate {
              replace => {
                "metadata.event_type" => "GENERIC_EVENT"
              }
            }
          }
          grok {
            match => {
              "message" =>
                [ 'requestParameters\\":(\\s)?(?P<req_params>.*?)\\"responseElements\\":(\\s)?(?P<res_params>.*?)\\"requestID' ]
            }
            overwrite => ["req_params","res_params"]
          }
          mutate {
            replace => {
              "about_req.key" => "requestParameters"
              "about_res.key" => "responseParameters"
            }
          }
          mutate {
            gsub => ["req_params", "(\\s*\"|\"\\s*)", ""]
          }
          mutate {
            gsub => ["req_params", "(\{|\\s*\})|(\,\\s+)", ""]
          }
          if [res_params] != "" {
            mutate {
              replace => {
                "about_res.value" => "%{res_params}"
              }
            }
          }
          if [req_params] != "" {
            mutate {
              replace => {
                "about_req.value" => "%{req_params}"
              }
            }
          }

          mutate {
            merge => {
              "about_labels.labels" => "about_req"
            }
          }
          mutate {
            merge => {
              "about_labels.labels" => "about_res"
            }
          }

          if [about_labels] != "" {
            mutate {
              merge => {
                "event.idm.read_only_udm.about" => "about_labels"
              }
            }
          }
        }
        else if [req][eventName] =~ "(DescribeLogGroups)" {
          if ![no_request_error] {
            mutate {
              replace => {
                "security_result.summary" => "Not authorized to perform task"
              }
            }
          }
        }
        else if [req][eventName] =~ "(ConsoleLogin)" {
          mutate {
            replace => {
              "metadata.event_type" => "USER_LOGIN"
              "security_result.severity" => "INFORMATIONAL"
              "sec_action" => "%{req.responseElements.ConsoleLogin}"
            }
            on_error => "no_sec_action"
          }
          if ![no_sec_action] {
            if [sec_action] == "Success" {
              mutate {
                replace => {
                  "security_action" => "%{action_allow}"
                  "security_result.summary" => "Login to AWS Console succeeded."
                }
              }
            }
            else {
              mutate {
                replace => {
                  "security_action" => "%{action_block}"
                  "security_result.summary" => "Login to AWS Console failed."
                }
              }
            }
          }
        }
      }
      else {
        if [has_principal_user_id] == "true" or [has_principal_user] == "true" or [has_target_user_id] == "true" {
          mutate {
            replace => {
              "metadata.event_type" => "USER_RESOURCE_ACCESS"
            }
          }
        }
        else {
          mutate {
            replace => {
              "metadata.event_type" => "GENERIC_EVENT"
            }
          }
        }
        mutate {
          merge => {
            "target.user.group_identifiers" => "req.awsAccountId"
          }
          on_error => "not_found.user.group_identifiers"
        }
        mutate {
          replace => {
            "target.resource.name" => "%{req.digestS3Bucket}"
          }
          on_error => "digests3_bucket_not_found"
        }
        mutate {
          replace => {
            "target.file.full_path" => "%{req.digestS3Object}"
          }
          on_error => "digests3_Object_not_found"
        }
        mutate {
          replace => {
            "target.file.sha256" => "%{req.previousDigestHashValue}"
          }
          on_error => "hash_value_not_found"
        }
        mutate {
          replace => {
            "digest_sign_label.key" => "digestSignatureAlgorithm"
            "digest_sign_label.value" => "%{req.digestSignatureAlgorithm}"
            "network.tls.cipher" => "%{req.digestSignatureAlgorithm}"
          }
          on_error => "digest_sign_not_found"
        }
        if ![digest_sign_not_found] {
          mutate {
            merge => {
              "target.resource.attribute.labels" => "digest_sign_label"
            }
          }
        }
        mutate {
          replace => {
            "digest_public_key.key" => "digestPublicKeyFingerprint"
            "digest_public_key.value" => "%{req.digestPublicKeyFingerprint}"
            "target.file.sha1" => "%{req.digestPublicKeyFingerprint}"
          }
          on_error => "digest_key_fingerprint_not_found"
        }
        if ![digest_key_fingerprint_not_found] {
          mutate {
            merge => {
              "target.resource.attribute.labels" => "digest_public_key"
            }
          }
        }
        for resources in req.logFiles {
          mutate {
            replace => {
              "about_resource" => ""
            }
          }
          mutate {
            replace => {
              "about_resource.resource.name" => "%{resources.s3Bucket}"
            }
            on_error => "s3_bucket_not_found"
          }
          mutate {
            replace => {
              "about_resource.file.full_path" => "%{resources.s3Object}"
            }
            on_error => "s3Object_not_found"
          }
          mutate {
            replace => {
               "about_resource.file.sha256" => "%{resources.hashValue}"
            }
            on_error => "hashValue_not_found"
          }
          if [about_resource] != "" {
            mutate {
              merge => {
                "event.idm.read_only_udm.about" => "about_resource"
              }
            }
          }
        }
      }
      # merge the data into udm nouns.
      if [metadata] != "" {
        mutate {
          rename => {
            "metadata" => "event.idm.read_only_udm.metadata"
          }
        }
      }
      if [principal] != "" {
        mutate {
          rename => {
            "principal" => "event.idm.read_only_udm.principal"
          }
        }
      }
      if [target] != "" {
        mutate {
          rename => {
            "target" => "event.idm.read_only_udm.target"
          }
        }
      }
      if [network] != "" {
        mutate {
          rename => {
            "network" => "event.idm.read_only_udm.network"
          }
        }
      }
      if [src] != "" {
        mutate {
          rename => {
            "src" => "event.idm.read_only_udm.src"
          }
        }
      }
      if [extensions] != "" {
        mutate {
          rename => {
            "extensions" => "event.idm.read_only_udm.extensions"
          }
        }
      }
      if [additional] != "" {
        mutate {
          rename => {
            "additional" => "event.idm.read_only_udm.additional"
          }
        }
      }
      if [security_action] != "" {
        mutate {
          merge => {
            "security_result.action" => "security_action"
          }
        }
      }
      if [security_result] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
}
