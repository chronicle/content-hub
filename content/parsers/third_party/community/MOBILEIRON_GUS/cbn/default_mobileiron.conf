filter {
  mutate {
    replace => {
      "id" => ""
      "platformType" => ""
      "platformVersion" => ""
      "displayName" => ""
      "firstName" => ""
      "lastName" => ""
      "emailAddress" => ""
      "policyViolatedAt" => ""
      "policyViolatedID" => ""
      "prettyModel" => ""
      "complianceViolationTypeToReason.PC" => ""
      "complianceViolationTypeToReason.BLACKLIST_APPS" => ""
      "complianceViolationTypeToReason.SA" => ""
      "hardware" => ""
      "security_result" => ""
      "host" => ""
      "kv_msg" => ""
      "product" => ""
      "desc" => ""
      "SystemType" => ""
      "principal_mid_present" => "false"
      "action" => ""
      "sessionId" => ""
      "username" => ""
      "USER" => ""
      "PID" => ""
      "has_principal_user" => "false"
      "src_ip" => ""
      "tls_version" => ""
      "cipher" => ""
      "method" => ""
      "url" => ""
      "protocol" => ""
      "protocol_version" => ""
      "ts" => ""
      "r" => ""
      "b" => ""
      "swpd" => ""
      "free" => ""
      "buff" => ""
      "cache" => ""
      "si" => ""
      "so" => ""
      "bi" => ""
      "bo" => ""
      "in" => ""
      "cs" => ""
      "us" => ""
      "sy" => ""
      "wa" => ""
      "st" => ""
      "PR" => ""
      "NI" => ""
      "VIRT" => ""
      "RES" => ""
      "SHR" => ""
      "S" => ""
      "pctCPU" => ""
      "pctMEM" => ""
      "cpuTIME" => ""
      "COMMAND" => ""
      "app_name" => ""
      "procid" => ""
      "msgid" => ""
      "token_id" => ""
      "tag" => ""
      "msg" => ""
      "error_code" => ""
      "summary" => ""
      "target_ip" => ""
      "date_time" => ""
      "log_year" => ""
      "module" => ""
      "loglevel" => ""
      "pid" => ""
      "client_ip" => ""
      "client_port" => ""
      "action_description" => ""
      "ip_1" => ""
      "ip_in_bracket" => ""
      "target_port" => ""
      "apache_error_code" => ""
      "intermediary" => ""
      "referrer" => ""
      "user_agent" => ""
      "http_status" => ""
      "http_request" => ""
      "http_method" => ""
      "duration_ms" => ""
      "response_size" => ""
      "type" => ""
      "time" => ""
      "time_1" => ""
      "safepoint_type" => ""
      "safepoint_ns_1" => ""
      "safepoint_ns_2" => ""
      "ns_1" => ""
      "systemd_user" => ""
      "target_host" => ""
      "kv_data" => ""
      "url_1" => ""
      "attempts" => ""
      "user" => ""
      "nice" => ""
      "system" => ""
      "steal" => ""
      "idle" => ""
      "iowait" => ""
      "timestamp" => ""
      "version" => ""
      "run_user" => ""
      "description" => ""
      "session_user" => ""
      "cpu_percent" => ""
      "t1" => ""
      "mem_percent" => ""
      "vsz" => ""
      "rss" => ""
      "stat" => ""
      "start" => ""
      "program_name" => ""
      "has_target_user" => "false"
      "target_mid_present" => "false"
      "sr_action" => ""
      "has_resource" => ""
      "command" => ""
      "log_source" => ""
      "actorId" => ""
      "actorName" => ""
      "actorUid" => ""
      "resultStatus" => ""
      "actionType" => ""
      "entityName" => ""
      "has_target_resource" => "false"
      "entityId" => ""
      "entityType" => ""
      "entityGroup" => ""
      "createdAt" => ""
      "sec_res_action" => ""
      "pipe_kv_data" => ""
      "common_client_id" => ""
      "common_client_name" => ""
      "common_client_version" => ""
      "software" => ""
      "common_ip_address" => ""
      "common_creation_date" => ""
      "common_id" => ""
      "common_manufacturer" => ""
      "_hardware" => ""
      "common_SerialNumber" => ""
      "common_model" => ""
      "common_os_version" => ""
      "common_owner" => ""
      "common_platform_name" => ""
      "common_uuid" => ""
      "common_wifi_mac_address" => ""
      "ios_ip_address" => ""
      "ios_vpn_ip_address" => ""
      "ios_BuildVersion" => ""
      "ios_iPhoneUDID" => ""
      "user_display_name" => ""
      "user_email_address" => ""
      "user_first_name" => ""
      "user_last_name" => ""
      "user_last_admin_portal_login_time" => ""
      "user_user_id" => ""
      "user_uuid" => ""
      "user_ldap_user_object_sid" => ""
      "user_ldap_user_attributes_mail" => ""
      "user_ldap_user_attributes_memberOf" => ""
      "ios_BluetoothMAC" => ""
      "user_ldap_groups" => ""

    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_error"
  }
  if [json_error] {
    grok {
      match => {
        "message" = [
          "%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA}:%{DATA}=%{DATA:product} %{DATA}=%{DATA:SystemType},<%{INT}>%{INT} %{TIMESTAMP_ISO8601} %{DATA} %{DATA} %{DATA} %{DATA} %{DATA}\\s+%{GREEDYDATA:desc}"
          "%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA}=%{DATA:product} %{DATA}=%{DATA:SystemType},%{DATA} %{IP:src_ip} %{DATA:tls_version} %{DATA:cipher} \\\"\\\"%{DATA:method} %{DATA:url} %{DATA:protocol}/%{NUMBER:protocol_version}"
          "%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA:app_name}: %{DATA}=%{DATA:product},%{DATA:date_time} %{IP:src_ip} %{DATA:tls_version} %{DATA:cipher} \\\"%{WORD:http_method} %{DATA:http_request} %{DATA:protocol}/%{NUMBER:protocol_version}\\\" %{NUMBER:response_size} \\\"%{DATA:referrer}\\\" \\\"%{DATA:user_agent}\\\""
          '%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA:app_name}:\\s+PRODUCT=%{DATA:product},(\\s+)?time=\\"%{TIMESTAMP_ISO8601}\\"\\s+%{GREEDYDATA:pipe_kv_data}'
          "%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA:log_source}: PRODUCT=%{DATA:product}(,?)(\\s+SystemType=%{DATA:SystemType},)?\\s+time=%{DATA:time}, %{GREEDYDATA:kv_msg}"
          "%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA}=%{DATA:product} %{DATA}=%{DATA:SystemType}, %{GREEDYDATA:kv_msg}"
          "%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{DATA}( |:)%{DATA}=%{DATA:product} %{GREEDYDATA:kv_data}"
          '<%{INT}>%{INT:version} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host} %{DATA:app_name} %{DATA:procid} %{DATA:msgid} \\[TOKEN@%{INT:token_id} tag=\\"%{DATA:tag}\\"\\] %{GREEDYDATA:msg}'
          '<%{INT}> %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host} %{DATA:app_name} %{DATA:procid} %{DATA:msgid} \\[TOKEN@%{INT:token_id} tag=\\"%{DATA:tag}\\"\\] %{GREEDYDATA:msg}'
          '&lt;%{INT}&gt;%{INT:version} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host} %{DATA:app_name} %{DATA:procid} %{DATA:msgid} \\[TOKEN@%{INT:token_id} tag=\\"%{DATA:tag}\\"\\] %{GREEDYDATA:msg}'
          '&lt;%{INT}&gt; %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:host} %{DATA:app_name} %{DATA:procid} %{DATA:msgid} \\[TOKEN@%{INT:token_id} tag=\\"%{DATA:tag}\\"\\] %{GREEDYDATA:msg}'
        ]
      }
      overwrite => ["log_source","time","ts","host", "product", "kv_msg", "desc", "SystemType", "src_ip", "tls_version", "cipher", "method", "url", "protocol", "version", "timestamp", "app_name", "procid", "msgid", "token_id", "tag", "msg", "protocol_version","response_size", "referrer", "user_agent","http_request","http_method","date_time","kv_data","pipe_kv_data"]
      on_error => "grok_error"
    }
    if [pipe_kv_data] != "" {
      mutate {
        gsub => ["pipe_kv_data", '\"', '']
      }
      mutate {
        gsub => ["pipe_kv_data","\\s+([a-zA-Z0-9_]+)=","^$1="]
      }
      kv {
        source => "pipe_kv_data"
        field_split => "^"
        value_split => "="
        on_error => "pipe_kv_data_fail"
      }
    }
    if [log_source] != "" {
      mutate {
        replace => {
          "log_source_label.value.string_value" => "%{log_source}"
          "log_source_label.key" => "log_source"
        }
        on_error => "log_source_error"
      }
      if ![log_source_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "log_source_label"
          }
          on_error => "log_source_label_merge_error"
        }
      }
    }
    if [timestamp] != "" {
      date {
        match => ["timestamp", "yyyy-MM-ddTHH:mm:ss.SSSSSS+00:00", "RFC3339", "ISO8601"]
        on_error => "timestamp_date_error"
      }
    }
    if [version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_version" => "%{version}"
        }
        on_error => "version_not_present"
      }
    }
    if [app_name] not in ["-", ""] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{app_name}"
        }
        on_error => "app_name_error"
      }
    }
    if [procid] not in ["-", ""] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{procid}"
        }
        on_error => "procid_error"
      }
    }
    if [msgid] not in ["-", ""] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{msgid}"
        }
        on_error => "msgid_error"
      }
    }
    if [token_id] not in ["-", ""] {
      mutate {
        replace => {
          "token_id_label.key" => "token_id"
          "token_id_label.value.string_value" => "%{token_id}"
        }
        on_error => "token_id_error"
      }
      if ![token_id_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "token_id_label"
          }
          on_error => "token_id_label_merge_error"
        }
      }
    }
    if [tag] not in ["-", ""] {
      mutate {
        replace => {
          "tag_label.value.string_value" => "%{tag}"
        }
        on_error => "tag_error"
      }
      if ![tag_error] {
        mutate {
          replace => {
            "tag_label.key" => "tag"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "tag_label"
          }
          on_error => "tag_label_merge_error"
        }
      }
    }
    if [msg] != "" {
      grok {
        match => {
          "msg" = [
            "PRODUCT=%{DATA:product},\\[%{DATA} %{DATA:date_time} %{YEAR:log_year}\\] \\[%{NOTSPACE:module}:%{LOGLEVEL:loglevel}\\] \\[pid %{NONNEGINT:pid}\\] \\[client %{IP:client_ip}:%{POSINT:client_port}\\] %{GREEDYDATA:action_description}",
            "PRODUCT=%{DATA:product},\\[%{DATA} %{DATA:date_time} %{YEAR:log_year}\\] \\[%{DATA:module}:%{LOGLEVEL:loglevel}\\] \\[pid %{INT:pid}\\] \\(%{INT:apache_error_code}\\)%{DATA}: %{GREEDYDATA:action_description}",
            'PRODUCT=%{DATA:product},%{DATA:time} %{IP:client_ip} %{DATA:tls_version} %{DATA:cipher} \\"%{WORD:http_method} %{DATA:http_request} %{DATA:protocol}\\/%{DATA:protocol_version}\\" %{NUMBER:http_status} \\"%{DATA:referrer}\\" \\"%{DATA:user_agent}\\"',
            'PRODUCT=%{DATA:product},%{IP:client_ip}:%{INT:client_port} %{DATA:tls_version} %{DATA:cipher} %{DATA:date_time} \\"%{WORD:http_method} %{DATA:http_request} %{DATA:protocol}\\/%{DATA:protocol_version}\\" %{INT:http_status} %{INT:response_size} \\"%{DATA:referrer}\\" \\"%{DATA:user_agent}\\" %{INT:duration_ms}',
            'PRODUCT=%{DATA:product},\\[%{DATA:time}\\]\\[%{INT:pid}\\]\\[%{DATA:type}\\] Safepoint \\"%{DATA:safepoint_type}\\", Time since last: %{DATA:time_1} ns, Reaching safepoint: %{INT:safepoint_ns_1} ns, At safepoint: %{INT:safepoint_ns_2} ns, Total: %{INT:ns_1} ns',
            "PRODUCT=%{DATA:product}, pam_unix%{GREEDYDATA:description}",
            "PRODUCT=%{DATA:product},%{DATA:loglevel} - %{DATA:time} INFO - Attempt %{INT:attempts} - %{DATA:summary} %{DATA:url_1} via %{DATA:protocol} to %{IP:ip_1} %{GREEDYDATA:action}.",
            "PRODUCT=%{DATA:product},%{DATA:loglevel} - %{DATA:time} INFO - %{GREEDYDATA:summary}",
            "PRODUCT=%{DATA:product}, %{NUMBER:user}\\s+%{NUMBER:nice}\\s+%{NUMBER:system}\\s+%{NUMBER:iowait}\\s+%{NUMBER:steal}\\s+%{NUMBER:idle}",
            "PRODUCT=%{DATA:product}, %{DATA:loglevel} - %{GREEDYDATA:summary}"
            "PRODUCT=%{DATA:product},time=%{DATA:time}, %{GREEDYDATA:kv_data}"
            "PRODUCT=%{DATA:product}, %{GREEDYDATA:kv_data}"
          ]
        }
        overwrite => ["product", "date_time", "log_year", "module", "loglevel", "pid", "client_ip", "client_port", "action_description", "apache_error_code", "tls_version", "cipher", "http_method", "http_request", "protocol", "http_status", "referrer", "user_agent", "protocol_version", "response_size", "duration_ms", "safepoint_type", "time_1", "safepoint_ns_1", "safepoint_ns_2", "ns_1", "time", "type", "kv_data", "summary", "attempts", "url_1", "ip_1", "action", "user", "nice", "system", "steal", "idle", "iowait", "description"]
        on_error => "msg_grok_error"
      }

      if [msg_grok_error] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{msg}"
          }
          on_error => "msg_not_present"
        }
      }
    }
    mutate {
      gsub => [
        "kv_data", "\\.\\.\\.\\.$", ""
      ]
    }
    kv {
      source => "kv_data"
      field_split => ", "
      value_split => "="
      on_error => "kv_data_fail"
    }
    if [kv_data] != "" {
      grok {
        match => {
          "kv_data" = [
            "%{DATA:user}\\s+%{INT:pid}\\s+%{INT}\\s+%{NUMBER:cpu_percent}\\s+%{DATA:t1}\\s+%{NUMBER:mem_percent}\\s+%{INT:vsz}\\s+%{INT:rss}\\s+%{DATA}\\s+%{WORD:stat}\\s+%{DATA:start}\\s+%{DATA:program_name}\\s+%{GREEDYDATA:command}"
            "(?P<desc>(?P<action>(Starting|Started) Session) %{GREEDYDATA:sessionId} of (user|User) %{WORD:username}.*)"
            "%{GREEDYDATA:desc}"
          ]
        }
        overwrite => ["desc", "user", "pid", "cpu_percent", "t1", "mem_percent", "vsz", "rss", "stat", "start", "program_name","action", "sessionId", "username", "command"]
        on_error => "kv_data_grok_error"
      }
    }
    if [command] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.command_line" => "%{command}"
        }
        on_error => "command_error"
      }
    }
    if [cpu_percent] != "" {
      mutate {
        replace => {
          "cpu_percent_label.value.string_value" => "%{cpu_percent}"
        }
        on_error => "cpu_percent_replace_error"
      }
      if ![cpu_percent_replace_error] {
        mutate {
          replace => {
            "cpu_percent_label.key" => "cpu_percent"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "cpu_percent_label"
          }
          on_error => "cpu_percent_label_merge_error"
        }
      }
    }
    if [t1] != "" {
      mutate {
        replace => {
          "t1_label.value.string_value" => "%{t1}"
        }
        on_error => "t1_replace_error"
      }
      if ![t1_replace_error] {
        mutate {
          replace => {
            "t1_label.key" => "t1"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "t1_label"
          }
          on_error => "t1_label_merge_error"
        }
      }
    }
    if [mem_percent] != "" {
      mutate {
        replace => {
          "mem_percent_label.value.string_value" => "%{mem_percent}"
        }
        on_error => "mem_percent_replace_error"
      }
      if ![mem_percent_replace_error] {
        mutate {
          replace => {
            "mem_percent_label.key" => "mem_percent"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "mem_percent_label"
          }
          on_error => "mem_percent_label_merge_error"
        }
      }
    }
    if [vsz] != "" {
      mutate {
        replace => {
          "vsz_label.value.string_value" => "%{vsz}"
        }
        on_error => "vsz_replace_error"
      }
      if ![vsz_replace_error] {
        mutate {
          replace => {
            "vsz_label.key" => "vsz"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "vsz_label"
          }
          on_error => "vsz_label_merge_error"
        }
      }
    }
    if [rss] != "" {
      mutate {
        replace => {
          "rss_label.value.string_value" => "%{rss}"
        }
        on_error => "rss_replace_error"
      }
      if ![rss_replace_error] {
        mutate {
          replace => {
            "rss_label.key" => "rss"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "rss_label"
          }
          on_error => "rss_label_merge_error"
        }
      }
    }
    if [stat] != "" {
      mutate {
        replace => {
          "stat_label.value.string_value" => "%{stat}"
        }
        on_error => "stat_replace_error"
      }
      if ![stat_replace_error] {
        mutate {
          replace => {
            "stat_label.key" => "stat"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "stat_label"
          }
          on_error => "stat_label_merge_error"
        }
      }
    }
    if [start] != "" {
      mutate {
        replace => {
          "start_label.value.string_value" => "%{start}"
        }
        on_error => "start_replace_error"
      }
      if ![start_replace_error] {
        mutate {
          replace => {
            "start_label.key" => "start"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "start_label"
          }
          on_error => "start_label_merge_error"
        }
      }
    }
    if [program_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{program_name}"
          "has_resource" => "true"
        }
        on_error => "program_name_replace_error"
      }
    }
    if [description] != "" {
      grok {
        match => {
          "description" = [
            "\\(systemd-user:%{DATA:systemd_user}\\): session closed for user %{GREEDYDATA:session_user}",
            "\\(runuser:%{DATA:run_user}\\): session closed for user %{GREEDYDATA:session_user}"
          ]
        }
        overwrite => ["systemd_user", "run_user", "session_user"]
        on_error => "description_grok_error"
      }
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
        on_error => "description_not_present"
      }
    }

    if [time_1] != "" {
      date {
        match => ["time_1", "UNIX"]
        target => "security_result.last_discovered_time"
        on_error => "time_1_error"
      }
    }
    if [time] != "" {
      mutate {
        gsub => ["time", "--", " "]
      }
      mutate {
        gsub => ["time", "-", ":"]
      }
      date {
        match => ["time", "yyyy-MM-ddTHH:mm:ss.SSS+0000", "yyyy-MM-dd HH:mm:ss", "yyyy:MM:dd HH:mm:ss", "ISO8601", "RFC3339"]
        target => "security_result.first_discovered_time"
        on_error => "time_not_found"
      }
    }
    if [target_host] not in ["-", ""] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{target_host}"
          "target_mid_present" => "true"
        }
        on_error => "target_host_error"
      }
    }
    if [url_1] not in ["-", ""] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.url" => "%{url_1}"
        }
        on_error => "url_1_error"
      }
    }
    if [systemd_user] != "" {
      mutate {
        replace => {
          "systemd_user_label.value" => "%{systemd_user}"
        }
        on_error => "systemd_user_error"
      }
      if ![systemd_user_error] {
        mutate {
          replace => {
            "systemd_user_label.key" => "systemd_user"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "systemd_user_label"
          }
          on_error => "systemd_user_label_merge_error"
        }
      }
    }
    if [run_user] != "" {
      mutate {
        replace => {
          "run_user_label.value" => "%{run_user}"
        }
        on_error => "run_user_error"
      }
      if ![run_user_error] {
        mutate {
          replace => {
            "run_user_label.key" => "run_user"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "run_user_label"
          }
          on_error => "run_user_label_merge_error"
        }
      }
    }
    if [attempts] != "" {
      mutate {
        replace => {
          "attempts_label.value.string_value" => "%{attempts}"
        }
        on_error => "attempts_error"
      }
      if ![attempts_error] {
        mutate {
          replace => {
            "attempts_label.key" => "attempts"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "attempts_label"
          }
          on_error => "attempts_label_merge_error"
        }
      }
    }
    if [safepoint_ns_1] != "" {
      mutate {
        replace => {
          "safepoint_ns_1_label.value.string_value" => "%{safepoint_ns_1}"
        }
