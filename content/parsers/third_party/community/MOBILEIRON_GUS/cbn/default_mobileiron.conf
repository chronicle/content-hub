          on_error => "key1_empty"
        }
        if [key1] in ["entity_audit_id","details"] {
          mutate {
            replace => {
              "field1.value" => "%{value1}"
            }
            on_error => "value1_empty"
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "field1"
            }
            on_error => "detection_fields_merge_failed"
          }
        }
        else {
          mutate {
            replace => {
              "field1.value.string_value" => "%{value1}"
            }
            on_error => "value_not_found_additional"
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "field1"
            }
            on_error => "addition_merge_failed"
          }
        }
      }
    }


    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
    if [principal_mid_present] == "true" and [target_mid_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_principal_user] == "true" && [has_target_resource] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else if [has_principal_user] == "true" or [has_target_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [principal_mid_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.type" => "MOBILE"
        "event.idm.read_only_udm.metadata.vendor_name" => "Ivanti"
        "event.idm.read_only_udm.metadata.product_name" => "Endpoint Manager Mobile"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
