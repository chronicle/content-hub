# Product: ARUBA CENTRAL
# Category: Data Security
# Supported Format: SYSLOG , JSON
# Last Updated: 2025-03-24
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "additional" => ""
      "desc" => ""
      "app" => ""
      "pid" => ""
      "datetime" => ""
      "host" => ""
      "userid" => ""
      "severity" => ""
      "amm" => ""
      "msg" => ""
      "has_user" => "false"
      "has_target" => "false"
      "has_principal" => "false"
      "event_data" => ""
      "target" => ""
      "security_result" => ""
      "principal" => ""
      "metadata" => ""
      "event_type" => "GENERIC_EVENT"
      "has_target_user" => "false"
      "target_userid" => ""
      "target_mac" => ""
      "princ_mac" => ""
      "netwrok_ssid" => ""
      "details.group_name" => ""
      "details.config_change" => ""
      "details.dev_type" => ""
      "details.user" => ""
      "details.__base_url" => ""
      "details.group" => ""
      "details.labels" => ""
      "webhook" => ""
      "cluster_hostname" => ""
      "state" => ""
      "operation" => ""
      "timestamp" => ""
      "id" => ""
      "cid" => ""
      "nid" => ""
      "alert_type" => ""
      "setting_id" => ""
      "device_id" => ""
      "description" => ""
    }
  }
  grok {
    match => {
      "message" => "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:datetime} %{HOSTNAME:host} %{DATA:app} %{INT:pid} - - %{GREEDYDATA:desc}"
    }
    overwrite => ["desc", "app", "pid", "host", "datetime"]
    on_error => "invalid_grok"
  }

  if [invalid_grok] {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "invalid_json"
    }

    if [invalid_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  if ![invalid_grok] {
    if [datetime] not in ["" , " " , "N/A", "null" , "n/a"] {
      date {
        match => ["datetime", "RFC3339"]
        on_error => "invalid_timestamp"
      }
    }
    if [host] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.hostname" => "%{host}"
          "principal.asset.hostname" => "%{host}"
          "has_principal" => "true"
        }
        on_error => "host_invalid"
      }
    }
    if [app] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.application" => "%{app}"
        }
        on_error => "invalid_app"
      }
    }
    if [pid] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        convert => {
          "pid" => "string"
        }
        on_error => "pid_already_string"
      }
      mutate {
        replace => {
          "principal.process.pid" => "%{pid}"
        }
        on_error => "pid_invalid"
      }
    }
    if [desc] not in ["" , " " , "N/A", "null" , "n/a"] {
      grok {
        match => {
          "desc" => "%{DATA:event_data}\\|%{INT:userid}\\|%{DATA:severity}\\|%{DATA:amm}\\|%{DATA}\\|%{GREEDYDATA:msg}"
        }
        overwrite => ["event_data", "userid", "severity", "amm", "msg"]
        on_error => "invalid_desc"
      }
    }
    if [userid] not in ["" , " " , "N/A", "null" , "n/a"] and [has_user] != "true" {
      mutate {
        replace => {
          "target.user.userid" => "%{userid}"
          "has_user" => "true"
          "has_target" => "true"
        }
        on_error => "user_invalid"
      }
    }
    if [amm] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "additional_amm.key" => "amm"
          "additional_amm.value.string_value" => "%{amm}"
        }
        on_error => "amm_invalid"
      }
      if ![amm_invalid] {
        mutate {
          merge => {
            "additional.fields" => "additional_amm"
          }
          on_error => "amm_merge_failed"
        }
      }
    }
    if [severity] in ["LOG_INFO", "LOG_DEBUG"] {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
        on_error => "severity_invalid"
      }
    } else if [severity] == "LOG_WARN" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
        on_error => "severity_invalid"
      }
    } else if [severity] == "LOG_ERR" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
        on_error => "severity_invalid"
      }
    } else if [severity] == "LOG_CRIT" {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
        on_error => "severity_invalid"
      }
    }
    # metadata info
    if [event_data] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{event_data}"
        }
        on_error => "invalid_event_data"
      }
    }

    if [has_target] == "true" and [has_principal] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  else if ![invalid_json] {
    if [id] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{id}"
        }
        on_error => "id_invalid"
      }
    }
    if [cid] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.user.product_object_id" => "%{cid}"
        }
        on_error => "cid_invalid"
      }
    }

    if [nid] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        convert => {
          "nid" => "string"
        }
        on_error => "nid_already_string"
      }
      mutate {
        replace => {
          "additional_nid.key" => "nid"
          "additional_nid.value.string_value" => "%{nid}"
        }
        on_error => "nid_invalid"
      }
      if ![nid_invalid] {
        mutate {
          merge => {
            "additional.fields" => "additional_nid"
          }
          on_error => "nid_merge_failed"
        }
      }
    }
    if [alert_type] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{alert_type}"
        }
        on_error => "alert_type_invalid"
      }
    }
    if [setting_id] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "additional_setting_id.key" => "setting_id"
          "additional_setting_id.value.string_value" => "%{setting_id}"
        }
        on_error => "setting_id_invalid"
      }
      if ![setting_id_invalid] {
        mutate {
          merge => {
            "additional.fields" => "additional_setting_id"
          }
          on_error => "setting_id_merge_failed"
        }
      }
    }
    if [device_id] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.user.userid" => "%{device_id}"
          "has_user" => "true"
        }
        on_error => "device_id_invalid"
      }
    }
    else if [details][user] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.user.userid" => "%{details.user}"
          "has_user" => "true"
        }
        on_error => "user_invalid"
      }
    }
    if [details][group_name] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.group.group_display_name" => "%{details.group_name}"
        }
        on_error => "group_name_invalid"
      }
    }
    if [details][dev_type] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "dev_type_label.key" => "dev_type"
          "dev_type_label.value.string_value" => "%{details.dev_type}"
        }
        on_error => "dev_type_invalid"
      }
      if ![dev_type_invalid] {
        mutate {
          merge => {
            "additional.fields" => "dev_type_label"
          }
          on_error => "dev_type_merge_failed"
        }
      }
    }
    if [details][config_change] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "security_result.summary" => "%{details.config_change}"
        }
        on_error => "config_change_invalid"
      }
    }
    if [description] not in ["" , " " , "N/A", "null" , "n/a"] {
      grok {
        match => {
          "description" => [
            ".*\\(%{DATA} %{DATA:target_userid} %{DATA} %{DATA} %{MAC:target_mac}.*\\).*%{MAC:princ_mac}.*\\(%{DATA} %{MAC:netwrok_ssid}.*"
          ]
        }
        overwrite => ["target_userid", "target_mac", "princ_mac", "netwrok_ssid"]
        on_error => "invalid_description"
      }

      if [target_userid] not in ["" , " " , "N/A", "null" , "n/a"] {
        mutate {
          replace => {
            "target.user.userid" => "%{target_userid}"
            "has_target_user" => "true"
          }
          on_error => "target_hostname_invalid"
        }
      }
      if [target_mac] not in ["" , " " , "N/A", "null" , "n/a"] {
        mutate {
          merge => {
            "target.mac" => "target_mac"
            "target.asset.mac" => "target_mac"
          }
          on_error => "target_mac_invalid"
        }
      }
      if [princ_mac] not in ["" , " " , "N/A", "null" , "n/a"] {
        mutate {
          merge => {
            "principal.mac" => "princ_mac"
            "principal.asset.mac" => "princ_mac"
          }
          on_error => "princ_mac_invalid"
        }
      }
      if [netwrok_ssid] not in ["" , " " , "N/A", "null" , "n/a"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{netwrok_ssid}"
          }
          on_error => "netwrok_ssid_invalid"
        }
      }
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
        on_error => "description_invalid"
      }
    }
    if [state] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "state_label.key" => "state"
          "state_label.value" => "%{state}"
        }
        on_error => "state_invalid"
      }
      if ![state_invalid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "state_label"
          }
          on_error => "state_merge_failed"
        }
      }
    }
    mutate {
      uppercase => ["severity"]
      on_error => "severity_invalid"
    }
    if [severity] in ["CRITICAL" , "MAJOR" ] {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
        on_error => "severity_invalid"
      }
    }
    if [operation] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "operation_label.key" => "operation"
          "operation_label.value.string_value" => "%{operation}"
        }
        on_error => "operation_invalid"
      }
      if ![operation_invalid] {
        mutate {
          merge => {
            "additional.fields" => "operation_label"
          }
          on_error => "operation_merge_failed"
        }
      }
    }
    if [timestamp] not in ["" , " " , "N/A", "null" , "n/a"] {
      date {
        match => ["timestamp", "RFC3339", "yyyy-MM-dd HH:mm:ss"]
        target => "metadata.event_timestamp"
        on_error => "invalid_timestamp"
      }
    }
    if [details][__base_url] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "metadata.url_back_to_product" => "%{details.__base_url}"
        }
        on_error => "base_url_invalid"
      }
    }

    if [details][group] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.group.product_object_id" => "%{details.group}"
        }
        on_error => "group_invalid"
      }
    }
    if [details][labels] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "labels.key" => "labels"
          "labels.value" => "%{details.labels}"
        }
        on_error => "labels_invalid"
      }
      if ![labels_invalid] {
        mutate {
          merge => {
            "security_result.about.labels" => "labels"
          }
          on_error => "labels_merge_failed"
        }
      }
    }
    if [webhook] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "additional_webhook.key" => "webhook"
          "additional_webhook.value.string_value" => "%{webhook}"
        }
        on_error => "webhook_invalid"
      }
      if ![webhook_invalid] {
        mutate {
          merge => {
            "additional.fields" => "additional_webhook"
          }
          on_error => "webhook_merge_failed"
        }
      }
    }
    if [cluster_hostname] not in ["" , " " , "N/A", "null" , "n/a"] {
      mutate {
        replace => {
          "principal.hostname" => "%{cluster_hostname}"
          "principal.asset.hostname" => "%{cluster_hostname}"
          "has_principal" => "true"
        }
        on_error => "cluster_hostname_invalid"
      }
    }

    if [alert_type] == "DEVICE_CONFIG_CHANGE_DETECTED" {
      mutate {
        replace => {
          "target.resource.type" => "DEVICE"
        }
        on_error => "resource_type_invalid"
      }
      if [has_user] == "true" {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_UPDATE_CONTENT"
          }
        }
      }
    }
    else if [has_principal] == "true" and [has_target_user] == "true" and [has_user] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_user] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "ARUBA CENTRAL"
      "metadata.product_name" => "ARUBA_CENTRAL"
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_invalid"
    }
  }
  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

