# Product: IMPERVA_ATTACK_ANALYTICS
# Category: WAF
# Supported Format: KV
# Reference: https://docs.imperva.com/bundle/Attack-Analytics/page/Content/attack_analytics/attack_analytics.htm
# Last Updated: 2024-11-07
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "product_event" => ""
      "desc" => ""
      "kv_data" => ""
      "msg" => ""
      "src" => ""
      "dhost" => ""
      "request" => ""
      "requestClientApplication" => ""
      "cs1Label" => ""
      "cs2Label" => ""
      "cs3Label" => ""
      "cs4Label" => ""
      "cs5Label" => ""
      "cs6Label" => ""
      "cs7Label" => ""
      "cs8Label" => ""
      "cs9Label" => ""
      "cs1" => ""
      "cs2" => ""
      "cs3" => ""
      "cs4" => ""
      "cs5" => ""
      "cs6" => ""
      "cs7" => ""
      "cs8" => ""
      "cs9" => ""
      "vendor" => ""
      "product" => ""
      "end" => ""
      "ImpervaAACountry" => ""
      "start" => ""
      "security_result" => ""
      "metadata" => ""
      "target" => ""
      "principal" => ""
      "network" => ""
      "intermediary" => ""
      "has_principal" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "CEF:%{INT}\\|%{DATA:vendor}\\|%{DATA:product}\\|%{INT}\\|%{INT}\\|%{DATA:desc}\\|%{DATA}\\|%{GREEDYDATA:kv_data}"
      ]
    }
    overwrite => ["product", "desc", "kv_data", "vendor"]
    on_error => "no_grok"
  }
  if [no_grok] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  if [desc] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{desc}"
      }
      on_error => "no_desc"
    }
  }
  mutate {
    gsub => ["kv_data", '\\\\"', '\"']
  }
  mutate {
    gsub => ["kv_data","(\\\s+)(\\S+)=", "#$2="]
  }
  kv {
    source => "kv_data"
    field_split => "#"
    value_split => "="
    on_error => "no_kv"
  }
  if [msg] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{msg}"
      }
      on_error => "no_msg"
    }
  }
  if [src] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
    mutate {
      merge => {
        "principal.ip" => "src"
        "principal.asset.ip" => "src"
      }
      on_error => "no_src"
    }
    if ![no_src] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [start] != "" {
    date {
      match => ["start", "UNIX"]
      rebase => true
      on_error => "no_start"
    }
  }
  if [ImpervaAACountry] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{ImpervaAACountry}"
      }
      on_error => "no_ImpervaAACountry"
    }
  }
  if [dhost] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{dhost}"
        "principal.asset.hostname" => "%{dhost}"
      }
      on_error => "no_dhost"
    }
    if ![no_dhost] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [request] != "" {
    mutate {
      replace => {
        "target.url" => "%{request}"
      }
      on_error => "no_request"
    }
  }
  if [requestClientApplication] != "" {
    mutate {
      replace => {
        "target.application" => "%{requestClientApplication}"
      }
      on_error => "no_requestClientApplication"
    }
  }
  if [cs1] != "" {
    mutate {
      replace => {
        "cs1_label.key" => "%{cs1Label}"
        "cs1_label.value.string_value" => "%{cs1}"
      }
      on_error => "no_cs1"
    }
    if ![no_cs1] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs1_label"
        }
        on_error => "cs1_merge_error"
      }
    }
  }
  if [cs2] != "" {
    mutate {
      replace => {
        "cs2_label.key" => "%{cs2Label}"
        "cs2_label.value.string_value" => "%{cs2}"
      }
      on_error => "no_cs2"
    }
    if ![no_cs2] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs2_label"
        }
        on_error => "cs2_merge_error"
      }
    }
  }
  if [cs3] != "" {
    mutate {
      replace => {
        "cs3_label.key" => "%{cs3Label}"
        "cs3_label.value.string_value" => "%{cs3}"
      }
      on_error => "no_cs3"
    }
    if ![no_cs3] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs3_label"
        }
        on_error => "cs3_merge_error"
      }
    }
  }
  if [cs4] != "" {
    mutate {
      replace => {
        "cs4_label.key" => "%{cs4Label}"
        "cs4_label.value.string_value" => "%{cs4}"
      }
      on_error => "no_cs4"
    }
    if ![no_cs4] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs4_label"
        }
        on_error => "cs4_merge_error"
      }
    }
  }
  if [cs5] != "" {
    mutate {
      replace => {
        "cs5_label.key" => "%{cs5Label}"
        "cs5_label.value.string_value" => "%{cs5}"
      }
      on_error => "no_cs5"
    }
    if ![no_cs5] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs5_label"
        }
        on_error => "cs5_merge_error"
      }
    }
  }
  if [cs6] != "" {
    mutate {
      replace => {
        "cs6_label.key" => "%{cs6Label}"
        "cs6_label.value.string_value" => "%{cs6}"
      }
      on_error => "no_cs6"
    }
    if ![no_cs6] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs6_label"
        }
        on_error => "cs6_merge_error"
      }
    }
  }
  if [cs7] != "" {
    mutate {
      replace => {
        "cs7_label.key" => "%{cs7Label}"
        "cs7_label.value.string_value" => "%{cs7}"
      }
      on_error => "no_cs7"
    }
    if ![no_cs7] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs7_label"
        }
        on_error => "cs7_merge_error"
      }
    }
  }
  if [cs8] != "" {
    mutate {
      replace => {
        "cs8_label.key" => "%{cs8Label}"
        "cs8_label.value.string_value" => "%{cs8}"
      }
      on_error => "no_cs8"
    }
    if ![no_cs8] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs8_label"
        }
        on_error => "cs8_merge_error"
      }
    }
  }
  if [cs9] != "" {
    mutate {
      replace => {
        "cs9_label.key" => "%{cs9Label}"
        "cs9_label.value.string_value" => "%{cs9}"
      }
      on_error => "no_cs9"
    }
    if ![no_cs9] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cs9_label"
        }
        on_error => "cs9_merge_error"
      }
    }
  }
  if [end] != "" {
    mutate {
      replace => {
        "end_label.key" => "end"
        "end_label.value.string_value" => "%{end}"
      }
      on_error => "no_end"
    }
    if ![no_end] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "end_label"
        }
        on_error => "end_merge_error"
      }
    }
  }
  if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "%{vendor}"
      "metadata.product_name" => "%{product}"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "merge_failed"
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
