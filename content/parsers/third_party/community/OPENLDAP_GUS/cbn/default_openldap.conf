# Product: OPENLDAP
# Category: LDAP
# Supported Format: SYSLOG
# Reference: https://ldapwiki.com/wiki/Access%20Log
# Last Updated: 2025-11-12
# Copyright 2025 Google SecOps


filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "event.idm.read_only_udm.metadata.vendor_name" => "OpenLDAP"
      "event.idm.read_only_udm.metadata.product_name" => "OpenLDAP"
      "client_ip" => ""
      "resource" => ""
      "caller_ip" => ""
      "login_status" => ""
      "proxy1_ip" => ""
      "proxy2_ip" => ""
      "x_forwarded_missing" => "True"
      "security_result" => ""
      "timestamp" => ""
      "inner_ts" => ""
      "immutable_user_id" => ""
      "syslog_timestamp" => ""
      "syslog_message" => ""
      "syslog_process" => ""
      "syslog_pid" => ""
      "ldap_action" => ""
      "ldap_conn" => ""
      "ldap_op" => ""
      "r_ip_or_host" => ""
      "port" => ""
      "msg1" => ""
      "principal_ip" => ""
      "fd" => ""
      "op" => ""
      "prin_ip" => ""
      "prin_port" => ""
      "ts" => ""
      "user" => ""
      "tuser" => ""
      "action" => ""
      "method" => ""
      "ou" => ""
      "ou_1" => ""
      "ou_2" => ""
      "cn" => ""
      "dc" => ""
      "dc1" => ""
      "ip1" => ""
      "filter" => ""
      "dc_1" => ""
      "eventType" => ""
      "sequenceId" => ""
      "dc_2" => ""
      "dc_3" => ""
      "path" => ""
    }
  }

  mutate {
    convert => {
      "x_forwarded_missing" => "boolean"
    }
  }


  xml {
    source => "message"
    xpath => {
      "//L_MSG" => "inner_message"
      "//@DT" => "timestamp"
      "//L_MSG/Event/Login/Session/UTCTimestamp" => "inner_ts"
    }
    on_error => "xml_parsing_failed"
  }
  if ![xml_parsing_failed] {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:ts} ip-%{DATA:principal_ip} %{DATA:syslog_process}\\[%{DATA:syslog_pid}\\]: conn=%{DATA:ldap_conn} fd=%{DATA:fd} %{GREEDYDATA:msg1}"
          "%{SYSLOGTIMESTAMP:ts} ip-%{DATA:principal_ip} %{DATA:syslog_process}\\[%{DATA:syslog_pid}\\]: conn=%{DATA:ldap_conn} op=%{DATA:op} %{GREEDYDATA:msg1}"
        ]
      }
      overwrite => ["ts","principal_ip", "syslog_process", "syslog_pid", "ldap_conn", "msg1", "fd", "op"]
      on_error => "no_message"
    }
    if [ts] != "" {
      date {
        match => ["ts", "MMM dd HH:mm:ss"]
        rebase => true
        on_error => "timestamp_parsing_failed"
      }
    }
    if [principal_ip] != "" {
      mutate {
        gsub => [
          "principal_ip", "-", "."
        ]
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "principal_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "principal_ip"
        }
        on_error => "principal_ip_failed"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    if [syslog_process] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{syslog_process}"
        }
        on_error => "syslog_process_failed"
      }
    }

    if [syslog_pid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{syslog_pid}"
        }
        on_error => "syslog_pid_failed"
      }
    }
    if [ldap_conn] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{ldap_conn}"
        }
        on_error => "ldap_conn_failed"
      }
    }
    if [op] != "" {
      mutate {
        replace => {
          "op_label.key" => "OP"
          "op_label.value.string_value" => "%{op}"
        }
        on_error => "op_label_failed"
      }
      if ![op_label_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "op_label"
          }
          on_error => "op_label_failed"
        }
      }
    }
    if [fd] != "" {
      mutate {
        replace => {
          "fd_label.key" => "FD"
          "fd_label.value.string_value" => "%{fd}"
        }
        on_error => "fd_label_failed"
      }
      if ![fd_label_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "fd_label"
          }
          on_error => "fd_label_failed"
        }
      }
    }
    if [msg1] != "" {
      grok {
        match => {
          "msg1" => [
            "%{DATA:ldap_action} %{DATA}=%{IP:prin_ip}:%{NUMBER:prin_port}",
            "%{DATA:ldap_action} %{DATA}cn=%{WORD:user}",
            '%{DATA:ldap_action} dn=\\\"uid=%{WORD:user},ou=%{DATA:ou},%{GREEDYDATA}',
            '%{DATA:ldap_action} dn=\\\"uid=%{WORD:user}',
            '%{DATA:ldap_action} id=\\\"uid=%{WORD:tuser},ou=%{DATA:ou},%{GREEDYDATA}',
            '%{DATA:ldap_action} id=\\\"uid=%{WORD:tuser}'
          ]
        }
        overwrite => ["ldap_action", "prin_ip", "ou", "prin_port", "user", "tuser"]
        on_error => "msg1_failed"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{msg1}"
        }
        on_error => "msg1_failed"
      }
    }
    if [ou] != "" {
      mutate {
        replace => {
          "ou_label.key" => "ou"
          "ou_label.value.string_value" => "%{ou}"
        }
        on_error => "ou_label_fail"
      }
      if ![ou_label_fail] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou_label"
          }
          on_error => "ou_label_failed"
        }
      }
    }
    if [ldap_action] != "" {
      mutate {
        lowercase => ["ldap_action"]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{ldap_action}"
        }
        on_error => "ldap_action_failed"
      }
    }
    if [msg1] =~ "err=0" {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
    }
    else if [msg1] =~ "err=50" {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    }
    else if [msg1] =~ "err=2" {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    }
    if [action] != "" {
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "action_failed"
      }
    }
    if [prin_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "prin_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "prin_ip"
        }
        on_error => "prin_ip_failed"
      }
    }
    if [prin_port] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{prin_port}"
        }
        on_error => "prin_port_failed"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
        on_error => "conversion_error"
      }
    }
    if [user] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        }
        on_error => "user_failed"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    if [tuser] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{tuser}"
        }
        on_error => "tuser_failed"
      }
    }
  }

  # There are several records that contain '<' symbols that cause
  # xml parser to fail. All known cases are error messages about
  # failed xml parsing in some class. These messages doesn't contain
  # useful fields inside.


  if [xml_parsing_failed] {
    mutate {
      gsub => ["message" , "\\r\\n" , " "]
    }
    grok {
      match => {
        "message" => [
          "^\\d+\\s(?P<_syslog_priority>[^\\s]+)\\s(?P<syslog_timestamp>[^\\s]+)\\s(?P<r_ip_or_host>[^\\s]+)\\s(?P<syslog_process>[^\\s]+)\\s(?P<syslog_pid>[^\\s]+)\\s(?P<_syslog_unknown_field_1>[^\\s]+)\\s\\[(?P<_meta_sequence_id>.*?)\\]\\s(?P<ldap_conn>[^\\s]+)\\s(?P<ldap_op>[^\\s]+)\\s(?P<ldap_action>[^\\s]+)(\\s(?P<syslog_message>.*))?"
          "<%{INT:syslog_priority}>%{INT:syslog_version}\\s+%{TIMESTAMP_ISO8601:syslog_timestamp}\\s+%{IPORHOST:r_ip_or_host}\\s+%{PROG:syslog_process}\\s+%{POSINT:syslog_pid}\\s+-\\s+\\[meta sequenceId=\"%{INT:sequenceId}\"\\]\\s+conn=%{POSINT:ldap_conn}\\s+op=%{INT:ldap_op}\\s+%{WORD:ldap_action}\\s+%{GREEDYDATA:syslog_message}"
          "<%{INT:syslog_priority}>%{INT:syslog_version}\\s+%{TIMESTAMP_ISO8601:syslog_timestamp}\\s+%{IPORHOST:r_ip_or_host}\\s+%{PROG:syslog_process}\\s+%{POSINT:syslog_pid}\\s+-\\s+\\[meta sequenceId=\"%{INT:sequenceId}\"\\]\\s+conn=%{POSINT:ldap_conn}\\s+%{GREEDYDATA:syslog_message}"
          "<%{INT:r_priority}>%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{DATA:syslog_process}\\[%{DATA:syslog_pid}\\]: conn=%{INT:ldap_conn} %{GREEDYDATA:syslog_message}"
          "<%{INT:r_priority}>%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{DATA:syslog_process}\\[%{DATA:syslog_pid}\\]: %{DATA}: conn %{INT:ldap_conn} %{GREEDYDATA:syslog_message}"
          "<%{INT:syslog_priority}>%{SYSLOGTIMESTAMP:syslog_timestamp}\\s+%{IPORHOST:r_ip_or_host}\\s+%{PROG:syslog_process}\\[%{POSINT:syslog_pid}\\]:\\s+conn=%{POSINT:ldap_conn}\\s+op=%{INT:ldap_op}\\s+%{GREEDYDATA:syslog_message}"
          "<%{INT:r_priority}>%{SYSLOGTIMESTAMP:r_datetime} %{IPORHOST:r_ip_or_host} %{DATA:syslog_process}\\[%{DATA:syslog_pid}\\]: %{GREEDYDATA:syslog_message}"
          "%{SYSLOGTIMESTAMP:r_datetime} ip-%{IPORHOST:principal_ip} %{DATA:syslog_process}\\[%{DATA:syslog_pid}\\]: conn=%{INT:ldap_conn} op=%{DATA:op} %{DATA}memberUid=%{WORD:user}"
          "<%{INT}>%{DATA} %{DATA} %{DATA} %{DATA:r_ip_or_host} %{DATA:syslog_process}\\[%{DATA:syslog_pid}\\]: conn=%{INT:ldap_conn} %{GREEDYDATA:syslog_message}"
          "<%{INT:syslog_priority}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:syslog_timestamp} %{DATA:r_ip_or_host} %{DATA:syslog_process} %{POSINT:syslog_pid} - \\[meta sequenceId=\"%{INT:sequenceId}\"\\] conn=%{INT:ldap_conn} op=%{INT:op} %{DATA:eventType} %{GREEDYDATA:syslog_message}"
          "<%{INT:syslog_priority}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:syslog_timestamp} %{DATA:r_ip_or_host} %{NOTSPACE:syslog_process} %{NOTSPACE:syslog_pid} - \\[meta sequenceId=\"%{INT:sequenceId}\"\\] (<= %{DATA:eventType}:\\s+)?%{GREEDYDATA:syslog_message}"
          ]
        }
      on_error => "grok_format_failed"
      overwrite => ["sequenceId","eventType","syslog_message","r_ip_or_host","syslog_process", "syslog_pid","ldap_conn", "syslog_timestamp", "ldap_action","ldap_op","user","op","ts","principal_ip"]
    }
    if [eventType] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{eventType}"
        }
        on_error => "event_type_failed"
      }
    }
    mutate {
      convert => {
        "sequenceId" => "string"
      }
      on_error => "sequence_id_convert_failed"
    }
    if [sequenceId] != "" {
      mutate {
        replace => {
          "sequence_id_label.key" => "sequenceId"
          "sequence_id_label.value.string_value" => "%{sequenceId}"
        }
        on_error => "sequence_id_replace_failed"
      }
      if ![sequence_id_replace_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "sequence_id_label"
          }
          on_error => "sequence_id_merge_failed"
        }
      }
    }
    if [principal_ip] != "" {
      mutate {
        gsub => [
          "principal_ip", "-", "."
        ]
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "principal_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "principal_ip"
        }
        on_error => "principal_ip_failed"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    if [user] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        }
        on_error => "user_failed"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    grok {
      match => {
        "r_ip_or_host" => "%{IP:_principal_ip}"
      }
      on_error => "is_principal_hostname"
    }

    if [is_principal_hostname] {
      if[r_ip_or_host] =~ "ip" {
        mutate {
          gsub => [
            "r_ip_or_host", "ip-", ""
          ]
        }
        mutate {
          gsub => [
            "r_ip_or_host", "-", "."
          ]
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "r_ip_or_host"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{r_ip_or_host}"
          }
        }
      }
    } else {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "r_ip_or_host"
        }
      }
    }
    if [r_ip_or_host] != ""  {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    if [syslog_timestamp] != "" {
      date {
        match => ["syslog_timestamp","yyyy-MM-ddTHH:mm:ss.SSSZZ"]
        on_error => "syslog_timestamp_failed"
      }
    }

    if [ldap_action] != "" {
      mutate {
        lowercase => [ "ldap_action" ]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{ldap_action}"
        }
      }
    }

    if [message] =~ "op=" {
      grok {
        match => {
          "message" => "op=%{INT:op_val}"
        }
        on_error => "op_grok_fail"
      }
      if ![op_grok_fail] {
        mutate {
          convert => {
            "op_val" => "string"
          }
          on_error => "already_string"
        }
        mutate {
          replace => {
            "label_op.key" => "op"
          }
          rename => {
            "op_val" => "label_op.value.string_value"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "label_op"
          }
        }
      }
    }

    # UDM > Principal
    if [syslog_process] != "" and [syslog_process] not in [ "#", "-"]{
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{syslog_process}"
        }
        on_error => "syslog_process_failed"
      }
    }

    if [syslog_pid] != "" and [syslog_pid] not in ["#", "-"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{syslog_pid}"
        }
        on_error => "syslog_pid_failed"
      }
    }
    # UDM > About
    if [syslog_message] != "" {
      mutate {
        replace => {
          "tag_data" => ""
          "attrData" => ""
          "baseData" => ""
          "scope_data" => ""
          "err" => ""
          "valueData" => ""
        }
      }
      grok {
        match => {
          "syslog_message" => [
            "op=%{INT} %{DATA:valueData} tag=%{DATA:tag_data} %{GREEDYDATA:kv}"
            "op=%{INT} %{DATA:valueData} attr=%{GREEDYDATA:attrData}"
            "op=%{INT} %{DATA:valueData} base=%{GREEDYDATA:baseData} scope=%{DATA:scope_data} %{GREEDYDATA:kv}"
            'op=%{INT} %{DATA:valueData} dn=\\\"cn=%{DATA:cn},ou=%{DATA:ou_2},dc=%{DATA:dc},dc=%{DATA:dc1}\\\" method=%{GREEDYDATA:method}'
            "op=%{INT} %{DATA:valueData} dn=\\\"cn=%{DATA:cn},dc=%{DATA:dc},dc=%{DATA:dc1}\\\" method=%{GREEDYDATA:method}"
          ]
        }
        overwrite => ["valueData", "tag_data", "kv", "attrData", "ou", "ou_2", "baseData", "scope_data", "method", "cn", "dc", "dc1"]
        on_error => "syslog_message_parsing_failed"
      }
      if ![syslog_message_parsing_failed] {
        kv {
          source => "kv"
          field_split => " "
          value_split => "="
          on_error => "syslog_message_parsing_failed"
        }
        mutate {
          gsub => ["filter", '\"' , ""]
        }
        if [cn] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.userid" => "%{cn}"
            }
            on_error => "cn_failed"
          }
        }
        if [filter] != "" {
          mutate {
            replace => {
              "filter_label.key" => "filter"
              "filter_label.value.string_value" => "%{filter}"
            }
            on_error => "filter_label_failed"
          }
          if ![filter_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "filter_label"
              }
              on_error => "filter_label_failed"
            }
          }
        }
        if [tag_data] != "" {
          mutate {
            replace => {
              "tag_label.key" => "tag"
              "tag_label.value.string_value" => "%{tag_data}"
            }
            on_error => "tag_label_failed"
          }
          if ![tag_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "tag_label"
              }
              on_error => "tag_label_failed"
            }
          }
        }

        if [err] != "" {
          mutate {
            replace => {
              "err_label.key" => "error"
              "err_label.value.string_value" => "%{err}"
            }
            on_error => "err_label_failed"
          }
          if ![err_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "err_label"
              }
              on_error => "err_label_failed"
            }
          }
        }

        if [attrData] != "" {
          mutate {
            replace => {
              "attr_label.key" => "attr"
              "attr_label.value.string_value" => "%{attrData}"
            }
            on_error => "attr_label_failed"
          }
          if ![attr_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "attr_label"
              }
              on_error => "attr_label_failed"
            }
          }
        }
        if [method] != "" {
          mutate {
            replace => {
              "method_label.key" => "method"
              "method_label.value.string_value" => "%{method}"
            }
            on_error => "method_label_failed"
          }
          if ![method_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "method_label"
              }
              on_error => "method_label_failed"
            }
          }
        }

        if [cn] != "" {
          mutate {
            replace => {
              "cn_label.key" => "cn"
              "cn_label.value.string_value" => "%{cn}"
            }
            on_error => "cn_label_failed"
          }
          if ![cn_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "cn_label"
              }
              on_error => "cn_label_failed"
            }
          }
        }
        if [ou_2] != "" {
          mutate {
            replace => {
              "ou_2_label.key" => "ou_2"
              "ou_2_label.value.string_value" => "%{ou_2}"
            }
            on_error => "ou_2_label_failed"
          }
          if ![ou_2_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "ou_2_label"
              }
              on_error => "ou_2_label_failed"
            }
          }
        }
        if [dc] != "" {
          mutate {
            replace => {
              "dc_label.key" => "dc"
              "dc_label.value.string_value" => "%{dc}"
            }
            on_error => "dc_label_failed"
          }
          if ![dc_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "dc_label"
              }
              on_error => "dc_label_failed"
            }
          }
        }
        if [dc1] != "" {
          mutate {
            replace => {
              "dc1_label.key" => "dc1"
              "dc1_label.value.string_value" => "%{dc1}"
            }
            on_error => "dc1_label_failed"
          }
          if ![dc1_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "dc1_label"
              }
              on_error => "dc1_label_failed"
            }
          }
        }

        if [baseData] != "" {
          mutate {
            replace => {
              "base1" => ""
              "base2" => ""
              "base3" => ""
            }
          }
          grok {
            match => {
              "baseData" => [
                'ou=%{DATA:base1},dc=%{DATA:base2},dc=%{DATA:base3}\\"'
                'dc=%{DATA:base1},dc=%{DATA:base2}\\"'
                '%{DATA}=%{DATA:base1}\\"'
              ]
            }
            overwrite => ["base1", "base2" , "base3"]
            on_error => "base_data_parsing_failed"
          }

          if [base1] != "" {
            mutate {
              replace => {
                "base1_label.key" => "base_dc"
                "base1_label.value.string_value" => "%{base1}"
              }
              on_error => "base1_label_failed"
            }
            if ![base1_label_failed] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "base1_label"
                }
                on_error => "base1_label_failed"
              }
            }
          }

          if [base2] != "" {
            mutate {
              replace => {
                "base2_label.key" => "base_dc_value"
                "base2_label.value.string_value" => "%{base2}"
              }
              on_error => "base2_label_failed"
            }
            if ![base2_label_failed] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "base2_label"
                }
                on_error => "base2_label_failed"
              }
            }
          }

          if [base3] != "" {
            mutate {
              replace => {
                "base3_label.key" => "base_dc_value_1"
                "base3_label.value.string_value" => "%{base3}"
              }
              on_error => "base3_label_failed"
            }
            if ![base3_label_failed] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "base3_label"
                }
                on_error => "base3_label_failed"
              }
            }
          }
        }

        if [scope_data] != "" {
          mutate {
            replace => {
              "scope_label.key" => "scope"
              "scope_label.value.string_value" => "%{scope_data}"
            }
            on_error => "scope_label_failed"
          }
          if ![scope_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "scope_label"
              }
              on_error => "scope_label_failed"
            }
          }
        }

        if [valueData] != "" {
          mutate {
            replace => {
              "value_label.key" => "Request and Response"
              "value_label.value.string_value" => "%{valueData}"
            }
            on_error => "value_label_failed"
          }
          if ![value_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "value_label"
              }
            }
          }
        }
      }
      else {
        grok {
          match => {
            "syslog_message" => [
              'dn=\\"uid=%{DATA:uid},ou=%{DATA:ou},ou=%{DATA:ou_1},dc=%{DATA:dc},dc=%{DATA:dc_1}\\" %{GREEDYDATA}',
              'id=\\\"uid=%{DATA:user},ou=%{DATA:ou},ou=%{DATA:ou_1},dc=%{DATA:dc},dc=%{DATA:dc_1}\\\" %{GREEDYDATA}'
              'dc=%{DATA:dc},dc=%{DATA:dc_1} cn=%{DATA:cn},dc=%{DATA:dc_2},dc=%{DATA:dc_3} PATH=%{DATA:path} conn=%{NOTSPACE:ldap_conn}'
            ]
          }
          overwrite => ["user","uid", "ou", "ou_1", "dc", "dc_1", "cn", "dc_2", "dc_3", "path","ldap_conn"]
          on_error => "syslog_message_parsing_failed"
        }
        if [user] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.userid" => "%{user}"
            }
            on_error => "user_failed"
          }
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
        if [cn] != "" {
          mutate {
            replace => {
              "cn_label.key" => "cn"
              "cn_label.value.string_value" => "%{cn}"
            }
            on_error => "cn_label_replace_failed"
          }
          if ![cn_label_replace_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "cn_label"
              }
              on_error => "cn_label_merge_failed"
            }
          }
        }
        if [dc_2] != "" {
          mutate {
            replace => {
              "dc_2_label.key" => "dc_2"
              "dc_2_label.value.string_value" => "%{dc_2}"
            }
            on_error => "dc_2_label_replace_failed"
          }
          if ![dc_2_label_replace_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "dc_2_label"
              }
              on_error => "dc_2_label_merge_failed"
            }
          }
        }
        if [dc_3] != "" {
          mutate {
            replace => {
              "dc_3_label.key" => "dc_3"
              "dc_3_label.value.string_value" => "%{dc_3}"
            }
            on_error => "dc_3_label_replace_failed"
          }
          if ![dc_3_label_replace_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "dc_3_label"
              }
              on_error => "dc_3_label_merge_failed"
            }
          }
        }
        if [path] != "" and [syslog_process] in ["-","#"] {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.process.file.full_path" => "%{path}"
            }
            on_error => "path_failed"
          }
        }
        else if [path] != "" {
          mutate {
            replace => {
              "path_label.key" => "path"
              "path_label.value.string_value" => "%{path}"
            }
            on_error => "path_label_value_failed"
          }
          if ![path_label_value_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "path_label"
              }
              on_error => "path_label_merge_failed"
            }
          }
        }
        if [dc] != "" {
          mutate {
            replace => {
              "dc_label.key" => "dc"
              "dc_label.value.string_value" => "%{dc}"
            }
            on_error => "dc_label_replace_failed"
          }
          if ![dc_label_replace_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "dc_label"
              }
              on_error => "dc_label_merge_failed"
            }
          }
        }
        if [dc_1] != "" {
          mutate {
            replace => {
              "dc_1_label.key" => "dc_1"
              "dc_1_label.value.string_value" => "%{dc_1}"
            }
            on_error => "dc_1_label_replacefailed"
          }
          if ![dc_1_label_replacefailed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "dc_1_label"
              }
              on_error => "dc_1_label_merge_failed"
            }
          }
        }
        if [ou] != "" {
          mutate {
            replace => {
              "ou_label.key" => "ou"
              "ou_label.value.string_value" => "%{ou}"
            }
            on_error => "ou_label_failed"
          }
          if ![ou_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "ou_label"
              }
              on_error => "ou_label_failed"
            }
          }
        }
        if [ou_1] != "" {
          mutate {
            replace => {
              "ou_1_label.key" => "ou_1"
              "ou_1_label.value.string_value" => "%{ou_1}"
            }
            on_error => "ou_1_label_failed"
          }
          if ![ou_1_label_failed] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "ou_1_label"
              }
              on_error => "ou_1_label_failed"
            }
          }
        }
        mutate {
          replace => {
            "role_label.key" => "_raw"
            "role_label.value.string_value" => "%{syslog_message}"
          }
          on_error => "syslog_message_parsing_failed"
        }
        if ![syslog_message_parsing_failed] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "role_label"
            }
            on_error => "syslog_message_parsing_failed"
          }
        }
      }

      if [syslog_message] =~ "from IP" {
        grok {
          match => {
            "syslog_message" => [
              "fd=%{DATA} %{DATA:valueData} from IP=%{IP:caller_ip}:%{INT:port} \\(IP=%{IP:ip1}:%{INT:por1}\\)",
              "%{DATA} IP=%{IP:caller_ip}:%{INT:port} %{GREEDYDATA}"
            ]
          }
          overwrite => ["caller_ip", "port", "ip1", "port1", "valueData"]
          on_error => "_is_principal_ip"
        }
        if ![_is_principal_ip] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "caller_ip"
            }
          }
          if [ip1] != "" {
            mutate {
              merge => {
                "event.idm.read_only_udm.target.ip" => "ip1"
              }
            }
          }
          if [valueData] != "" {
            mutate {
              replace => {
                "value_label.key" => "Request and Response"
                "value_label.value.string_value" => "%{valueData}"
              }
              on_error => "value_label_failed"
            }
            if ![value_label_failed] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "value_label"
                }
              }
            }
          }
        }
        if [port] != "" {
           mutate {
            replace => {
              "event.idm.read_only_udm.principal.port" => "%{port}"
            }
          }
          mutate {
            convert => {
              "event.idm.read_only_udm.principal.port" => "integer"
            }
          }
        }
      }
    }
  }
  if [ldap_conn] != "" {
      mutate {
        gsub => [
          "ldap_conn", "conn=", ""
        ]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{ldap_conn}"
         }
      }
    }
  if [timestamp] != "" && [inner_ts] == "" {
    # For some reason, date processor can't parse timestamp in
    # yyyy/MM/dd HH:mm:ss:SSS format, but format
    # yyyy/MM/dd HH:mm:ss.SSS works fine.
    # Here I convert timestamp format from the former to the latter.
    mutate {
      gsub => ["timestamp", "([0-9]{2}):([0-9]{3})", "$1.$2"]
    }

    date {
      match => ["timestamp", "yyyy/MM/dd HH:mm:ss.SSS"]
      on_error => "timestamp_parsing_failed"
    }

    grok {
      match => {
        "inner_message" => [
          "LOGIN %{WORD:login_status}: orgName=%{WORD:org_name},userName=%{USERNAME:username},resource=%{DATA:resource},clientIP=%{IP:client_ip},callerIP=%{IP:caller_ip}"
          "USER LOGIN %{WORD:login_status} :: %{NOTSPACE:username} :: %{NOTSPACE:immutable_user_id}"
          "AUTHN_FAIL :: (?P<inner_descrption>Authentication %{WORD:login_status}) for user (?P<username>[^<]+)"
          "(?P<login_status>Authenticated). Get %{WORD} :: %{NOTSPACE:username}"
          "User Authn from %{WORD} API. Token obtained %{NOTSPACE:username}"
          "Calling %{WORD} Service to authn user :: +%{NOTSPACE:username}"
        ]
      }
      on_error => "inner_message_parsing_failed"
      overwrite => ["client_ip", "resource", "caller_ip", "login_status", "immutable_user_id"]
    }
    if ![inner_message_parsing_failed] {
      grok {
        match => {
          "message" => [
            "User-Agent: (?P<user_agent>.*)"
          ]
        }
        on_error => "no_user_agent"
      }

      grok {
        match => {
          "message" => [
            "Country: (?P<country>.*)"
          ]
        }
        on_error => "no_country"
      }

      if ![no_user_agent] {
        mutate {
          gsub => ["user_agent", "\\r", ""]
        }
      }

      if ![no_country] {
        mutate {
          gsub => ["country", "\\r", ""]
        }
      }

      mutate {
        rename => {
          "username" => "event.idm.read_only_udm.target.user.userid"
          "org_name" => "event.idm.read_only_udm.target.user.company_name"
          "user_agent" => "event.idm.read_only_udm.network.http.user_agent"
          "country" => "event.idm.read_only_udm.principal.location.country_or_region"
          "inner_descrption" => "security_result.description"
        }
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
      if [client_ip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "client_ip"
          }
        }
      }

      if [caller_ip] != "" {
        mutate {
          merge => {
            "intermediary.ip" => "caller_ip"
          }
        }

        mutate {
          merge => {
            "event.idm.read_only_udm.intermediary" => "intermediary"
          }
        }
      }

      if [resource] != "" {
        mutate {
          replace => {
            "resource_label.key" => "resource"
            "resource_label.value" => "resource:%{resource}"
          }
        }

        mutate {
          merge => {
            "security_result.detection_fields" => "resource_label"
          }
        }
      }

      # The message contans \r and \n escape sequences, which
      # interfere with security_description parsing. Removing
      # them to make parsing work.
      mutate {
        gsub => ["message", "\\n", ""]
      }
      mutate {
        gsub => ["message", "\\r", ""]
      }

      grok {
        match => {
          "message" => "FORENSIC:+%{GREEDYDATA:security_description}</L_MSG>"
        }
        on_error => "no_security_description"
      }

      if ![no_security_description] {
        grok {
          match => {
            "security_description" => "Host: +%{NOTSPACE:src_host}:%{INT:src_port}"
          }
          on_error => "host_parsing_failed"
        }

        if ![host_parsing_failed] {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.hostname" => "%{src_host}"
              "event.idm.read_only_udm.principal.port" => "%{src_port}"
            }
          }

          mutate {
            convert => {
              "event.idm.read_only_udm.principal.port" => "integer"
            }
          }
        }

        mutate {
          rename => {
            "security_description" => "security_result.description"
          }
        }
      }


      grok {
        match => {
          "message" => [
            "X-Forwarded-For: %{IP:proxy_client_ip}, %{IP:proxy1_ip}, %{IP:proxy2_ip}"
            "X-Forwarded-For: %{IP:proxy_client_ip}, %{IP:proxy1_ip}"
            "X-Forwarded-For: %{IP:proxy_client_ip}"
          ]
        }
        on_error => "x_forwarded_missing"
        overwrite => ["proxy1_ip", "proxy2_ip"]
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{inner_message}"
        }
      }
    }
  } else if [inner_ts] != "" {
    mutate {
      replace => {
        "http_forwarded_for" => ""
      }
    }

    xml {
      source => "message"
      xpath => {
        "/L_MSG/Event/Login/Session/IPAddress" => "src_ip"
        "/L_MSG/Event/Login/Session/ImmutableUserID" => "immutable_user_id"
        "/L_MSG/Event/Login/Session/SignOnID" => "userid"
        "/L_MSG/Event/Login/Session/UserAgentString" => "user_agent"
        "/L_MSG/Event/Login/Session/SessionID" => "session_id"
        "/L_MSG/Event/Login/Session/BrowserHeader/HTTPXForwardedFor" => "http_forwarded_for"
        "/L_MSG/Event/Login/LoginStatus" => "login_status"
      }
    }

    date {
      match => ["inner_ts", "UNIX_MS", "RFC3339", "yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ"]
      on_error => "timestamp_parsing_failed"
    }

    if [timestamp_parsing_failed] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    mutate {
      rename => {
        "userid" => "event.idm.read_only_udm.target.user.userid"
        "user_agent" => "event.idm.read_only_udm.network.http.user_agent"
        "session_id" => "event.idm.read_only_udm.network.session_id"
      }
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }

    grok {
      match => {
        "http_forwarded_for" => [
          "X-Forwarded-For: %{IP:proxy_client_ip}, %{IP:proxy1_ip}, %{IP:proxy2_ip}"
          "X-Forwarded-For: %{IP:proxy_client_ip}, %{IP:proxy1_ip}"
          "X-Forwarded-For: %{IP:proxy_client_ip}"
        ]
      }
      on_error => "x_forwarded_missing"
      overwrite => ["proxy1_ip", "proxy2_ip"]
    }
  }

  # Common fields mapping
  if [login_status] != "" {
    if [login_status] in ["SUCCESS", "Successful", "Authenticated"] {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    } else {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }

    mutate {
      merge => {
        "security_result.action" => "sec_action"
      }
    }
  }

  if [immutable_user_id] != "" {
    mutate {
      replace => {
        "immutable_user_id_label.key" => "immutable_user_id"
        "immutable_user_id_label.value" => "immutable_user_id:%{immutable_user_id}"
      }
    }

    mutate {
      merge => {
        "security_result.detection_fields" => "immutable_user_id_label"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if ![x_forwarded_missing] {
    # Normally we will have proxy_client_ip the same as client_ip.
    # Adding this just in case.
    if [proxy_client_ip] != [client_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "proxy_client_ip"
        }
      }
    }

    if [proxy1_ip] != "" {
      mutate {
        merge => {
          "proxy_1.ip" => "proxy1_ip"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "proxy_1"
        }
      }
    }

    if [proxy2_ip] != "" {
      mutate {
        merge => {
          "proxy_2.ip" => "proxy2_ip"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "proxy_2"
        }
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
