# Product: APEREO_CAS
# Category: SSO
# Supported Format: SYSLOG + CSV
# Reference: N/A
# Last Updated: 2023-10-04
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "time_stamp" => ""
      "program" => ""
      "syslog_server" => ""
      "csv_message" => ""
      "description" => ""
      "principal_ip" => ""
      "user_id" => ""
      "uri" => ""
      "server_name" => ""
      "column4" => ""
      "column5" => ""
      "event_type" => ""
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "intermediary" => ""
      "has_principal_ip" => ""
    }

  }

  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:time_stamp} %{DATA:syslog_server} %{DATA:program}: %{GREEDYDATA:csv_message}"
        ]
    }
    overwrite => ["time_stamp","program", "syslog_server","csv_message"]
    on_error => "match_error"
  }

  mutate {
    gsub => ["csv_message", '\"', ""]
  }

  if [match_error] || [csv_message] == "" {
    drop{
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  csv {
    source => "csv_message"
    on_error => "csv_fail"
  }

  mutate {
    replace => {
      "description" => "%{column1}"
    }
    on_error => "column1_not_present"
  }

  mutate {
    replace => {
      "client_ip" => "%{column2}"
    }
    on_error => "column2_not_present"
  }

  mutate {
    replace => {
      "user_id" => "%{column3}"
    }
    on_error => "column3_not_present"
  }

  mutate {
    replace => {
      "uri" => "%{column4}"
    }
    on_error => "column4_not_present"
  }

  mutate {
    replace => {
      "server_name" => "%{column5}"
    }
    on_error => "column5_not_present"
  }

  if [time_stamp] != "" {
    date {
      match => ["time_stamp", "MMM dd HH:mm:ss"]
      rebase => true
      on_error => "date_type_mismatch"
    }
  }
  if [program] != "" {
    mutate {
      replace => {
        "principal.application" => "%{program}"
      }
      on_error => "application_name_not_present"
    }
  }

  if [client_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "client_ip"
      }
      on_error => "client_ip_not_present"
    }
    mutate {
      replace => {
        "has_principal_ip" => "true"
      }
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
      }
      on_error => "user_id_not_present"
    }
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  if [uri] != "" {
    mutate {
      replace => {
        "principal.url" => "%{uri}"
      }
      on_error => "uri_not_present"
    }
  }

  if [server_name] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{server_name}"
      }
      on_error => "host_name_not_present"
    }
  }

  if [syslog_server] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{syslog_server}"
      }
      on_error => "inter_hostname_not_present"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{description}"
      }
      on_error => "event_description_not_present"
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_not_set"
    }
  }

  else if [has_principal_ip] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "APEREO_CAS"
      "metadata.vendor_name" => "Apereo CAS"
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
