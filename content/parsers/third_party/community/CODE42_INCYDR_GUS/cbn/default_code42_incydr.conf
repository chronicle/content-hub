# Product: CODE42_INCYDR
# Category: Data loss prevention (DLP)
# Supported Format: JSON
# Reference: See below
# Last Updated: 2026-03-13
# Copyright 2026 Google SecOps
# Additional references:
# https://developer.code42.com/api/#tag/Audit-Log
# https://developer.code42.com/api/#tag/File-Events/operation/searchEvents

filter {
  mutate {
    gsub => ["message","'",'"']
  }
  mutate {
    gsub => ["message",'\"24',"'24"]
  }
  mutate {
    gsub => ["message", ": '", ': "']
  }
  mutate {
    gsub => ["message", "@timestamp", "timestamp"]
  }
  mutate {
    replace => {
      "event_type" => ""
      "ts" => ""
      "security_result_1" => ""
      "fileOwner" => ""
      "computerGuidOwningFile" => ""
      "filePath" => ""
      "fileMd5" => ""
      "fileSha256" => ""
      "fileSize" => ""
      "securityEventId" => ""
      "fileSizeFromEvent" => ""
      "userFromEvent" => ""
      "pathFromEvent" => ""
      "timeFromBrowser" => ""
      "fileName" => ""
      "success" => ""
      "type" => ""
      "requestJson" => ""
      "groups" => ""
      "term" => ""
      "evnt" => ""
      "usr" => ""
      "file" => ""
      "report" => ""
      "source" => ""
      "removableMedia" => ""
      "destination" => ""
      "destination_operatingSystem" => ""
      "destination_email_recipients" => ""
      "process" => ""
      "risk" => ""
      "git" => ""
      "file_content" => ""
      "responseControls" => ""
      "timestamp" => ""
      "e_type" => ""
      "audit_log" => ""
      "user_deviceUid" => ""
      "event_vector" => ""
      "watchlists" => ""
      "has_action" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "has_target_file" => "false"
      "has_src_file" => "false"
      "risk_activityTier" => ""
      "paste_visibleContentSize" => ""
      "origin" => ""
      "paste_mimeTypes_label" => ""
      "event_inserted" => ""
      "idme_evnt_id" => ""
      "has_principal_machine" => "false"
      "parsed_actorName" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  mutate {
    gsub => ["message","\\n",""]
  }
  mutate {
    gsub => ["message", 'it\\"s',"its"]
  }
  mutate{
    gsub => ["message", ': "{', ':{']
  }
  mutate{
    gsub => ["message", '}",', '},']
  }
  mutate{
    gsub => ["message",": True,", ': "True",']
  }
  mutate{
    gsub => ["message",": true,", ': "True",']
  }
  mutate{
    gsub => ["message",": None,", ': "None",']
  }
  mutate{
    gsub => ["message",": None}", ': "None"}']
  }
  mutate {
    gsub => ["message", "event", "evnt"]
  }
  mutate{
    gsub => ["message",'user','usr']
  }
  mutate {
    gsub => ["message", "timestamp", "ts"]
  }
  mutate {
    gsub => ["message", "False", '"False"']
  }
  mutate {
    gsub => ["message", "false", '"False"']
  }
  mutate {
    gsub => ["message", "\\\\", '']
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    mutate {
      gsub => ["message", '""', '"']
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
  }
  if [idme_evnt_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.id" => "%{idme_evnt_id}"
      }
      on_error => "idme_evnt_id_not_found"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.metadata.id" => "bytes"
      }
      on_error => "idme_evnt_id_conversion_error"
    }
  }
  mutate {
    replace => {
      "e_type" => "%{type$}"
    }
    on_error => "type$_not_found"
  }
  if ["e_type"] != "" {
    grok {
      match => {
        "e_type" => [
          'audit_log::%{GREEDYDATA:audit_log}/%{INT}'
        ]
      }
      on_error => "audit_log_not_found"
      overwrite => ["audit_log"]
    }
    if ![audit_log_not_found] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{audit_log}"
        }
        on_error => "audit_log_not_mapped"
      }
    }
  }
  if [e_type] == "ALERT_SUMMARY"{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "ALERT_SUMMARY"
      }
      on_error => "audit_log_not_mapped"
    }
    if [tenantId] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_deployment_id" => "%{tenantId}"
        }
        on_error => "tenantId_not_found"
      }
    }
    if [type] != "" {
      mutate {
        replace => {
          "type_label.key" => "type"
          "type_label.value.string_value" => "%{type}"
        }
        on_error => "type_label_not_found"
      }
      if ![type_label_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "type_label"
          }
          on_error => "type_label_merge_failed"
        }
      }
    }
    if [name] != "" {
      mutate {
        replace => {
          "security_result_1.summary" => "%{name}"
        }
        on_error => "name_not_found"
      }
    }
    if [description] != "" {
      mutate {
        replace => {
          "security_result_1.description" => "%{description}"
        }
        on_error => "description_not_found"
      }
    }
    if [actor] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{actor}"
        }
        on_error => "actor_not_found"
      }
    }
    if [actorId] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.product_object_id" => "%{actorId}"
        }
        on_error => "actorId_not_found"
      }
    }
    if [target] != "N/A" {
      mutate {
        replace => {
          "has_target" => "false"
        }
        on_error => "target_not_found"
      }
    }
    if [severity] != "" {
      mutate {
        replace => {
          "severity_label.key" => "severity"
          "severity_label.value.string_value" => "%{severity}"
        }
        on_error => "severity_not_found"
      }
      if ![severity_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "severity_label"
          }
          on_error => "severity_label_merge_failed"
        }
      }
    }
    if [riskSeverity] != "" && [riskSeverity] != "MODERATE" {
      mutate {
        replace => {
          "security_result_1.severity" => "%{riskSeverity}"
        }
        on_error => "riskSeverity_not_found"
      }
    }
    if [riskSeverity] == "MODERATE" {
      mutate {
        replace => {
          "security_result_1.severity" => "MEDIUM"
        }
        on_error => "riskSeverity_not_found"
      }
    }
    if [ruleId] != "" {
      mutate {
        replace => {
          "security_result_1.rule_id" => "%{ruleId}"
        }
        on_error => "ruleId_not_found"
      }
    }
    if [watchlists] != "" {
      for index, watchlist in watchlists {
        mutate {
          replace => {
            "watchlist_type$" => "%{watchlist.type$}"
          }
          on_error => "watchlist_type1_not_found"
        }
        if ![watchlist_type1_not_found] {
          mutate {
            replace => {
              "watchlist_type$_label.key" => "watchlist_type$"
              "watchlist_type$_label.value" => "%{watchlist_type$}"
            }
            on_error => "watchlist_type1_label_not_found"
          }
          if ![watchlist_type1_label_not_found] {
            mutate {
              merge => {
                "security_result_1.detection_fields" => "watchlist_type$_label"
              }
              on_error => "watchlist_type1_label_merge_failed"
            }
          }
        }
        if [watchlist][id] != "" {
          mutate {
            replace => {
              "watchlist_id_label.key" => "watchlist_id"
              "watchlist_id_label.value" => "%{watchlist.id}"
            }
            on_error => "watchlist_id_label_not_found"
          }
          if ![watchlist_id_label_not_found] {
            mutate {
              merge => {
                "security_result_1.detection_fields" => "watchlist_id_label"
              }
              on_error => "watchlist_id_label_merge_failed"
            }
          }
        }
        if [watchlist][type] != "" {
          mutate {
            replace => {
              "watchlist_type_label.key" => "watchlist_type"
              "watchlist_type_label.value" => "%{watchlist.type}"
            }
            on_error => "watchlist_type_label_not_found"
          }
          if ![watchlist_type_label_not_found] {
            mutate {
              merge => {
                "security_result_1.detection_fields" => "watchlist_type_label"
              }
              on_error => "watchlist_type_label_merge_failed"
            }
          }
        }
        if [watchlist][isSignificant] != "" {
          mutate {
            replace => {
              "watchlist_isSignificant_label.key" => "watchlist_isSignificant"
              "watchlist_isSignificant_label.value.string_value" => "%{watchlist.isSignificant$}"
            }
            on_error => "watchlist_isSignificant_label_not_found"
          }
          if ![watchlist_isSignificant_label_not_found] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "watchlist_isSignificant_label"
              }
              on_error => "watchlist_isSignificant_label_merge_failed"
            }
          }
        }
      }
    }
    if [id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
        }
        on_error => "id_not_found"
      }
    }
    if [createdAt] != "" {
      date {
        match => ["createdAt", "yyyy-MM-ddTHH:mm:ss.SSSSSSSZ", "ISO8601"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "createdAt_not_mapped"
      }
    }
  }
  if [audit_log] == "file_download" {
    if [actorName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{actorName}"
        }
        on_error => "actor_name_not_found"
      }
      if ![actor_name_not_found] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [actorId] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.product_object_id" => "%{actorId}"
        }
        on_error => "actor_id_not_found"
      }
    }
    if [actorAgent] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.parsed_user_agent" => "%{actorAgent}"
        }
        convert => {
          "event.idm.read_only_udm.network.http.parsed_user_agent" =>
          "parseduseragent"
        }
        on_error => "actor_agent_not_found"
      }
    }
    if [actorIpAddress] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "actorIpAddress"
          "event.idm.read_only_udm.principal.asset.ip" => "actorIpAddress"
        }
        on_error => "actor_ip_address_not_found"
      }
      if ![actor_ip_address_not_found] && [audit_log] == "search_issued" {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [timestamp] != "" {
      date {
        match => ["timestamp", "yyyy-MM-ddTHH:mm:ss.SSSZ", "ISO8601"]
        on_error => "timestamp_not_found"
      }
    }
    if [actorType] != "" {
      mutate {
        replace => {
          "roles.name" => "%{actorType}"
        }
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.roles" => "roles"
        }
        on_error => "actor_type_not_found"
      }
    }
    if [fileOwner] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.user_display_name" => "%{fileOwner}"
        }
        on_error => "file_owner_not_found"
      }
      if ![file_owner_not_found] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [computerGuidOwningFile] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.product_object_id" => "%{computerGuidOwningFile}"
        }
        on_error => "computer_guid_owning_file_not_found"
      }
    }
    if [filePath] not in ["None", ""]{
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.file.full_path" => "%{filePath}"
        }
        on_error => "file_path_not_found"
      }
    }
    if [fileMd5] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.md5" => "%{fileMd5}"
        }
        on_error => "file_md5_not_found"
      }
    }
    if [fileSha256] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.sha256" => "%{fileSha256}"
        }
        on_error => "file_sha256_not_found"
      }
    }
    if [fileSize] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.file.size" => "%{fileSize}"
        }
        on_error => "file_size_not_found"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.file.size" => "uinteger"
        }
        on_error => "file_size_convert_failed"
      }
    }
    if [securityEventId]!= "" {
      mutate {
        replace => {
          "security_detection.key" => "securityEventId"
          "security_detection.value" => "%{securityEventId}"
        }
        on_error => "securityEventId_not_mapped"
      }
      if ![securityEventId_not_mapped] {
        mutate {
          merge => {
            "security_result_1.detection_fields" => "security_detection"
          }
          on_error => "securityEventId_merge_failed"
        }
      }
    }
    if [fileSizeFromEvent] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.size" => "%{fileSizeFromEvent}"
        }
        on_error => "fileSizeFromEvent_not_found"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.file.size" => "uinteger"
        }
        on_error => "fileSizeFromEvent_convert_failed"
      }
    }
    if [usrFromEvent] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{usrFromEvent}"
        }
        on_error => "usrFromEvent_not_found"
      }
      if ![usrFromEvent_not_found] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [trigger] != "" {
      mutate {
        replace => {
          "trigger_detection.key" => "trigger"
          "trigger_detection.value" => "%{trigger}"
        }
        on_error => "trigger_not_mapped"
      }
      if ![trigger_not_mapped] {
        mutate {
          merge => {
            "security_result_1.detection_fields" => "trigger_detection"
          }
          on_error => "trigger_merge_failed"
        }
      }
    }
    if [pathFromEvent] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{pathFromEvent}"
        }
        on_error => "pathFromEvent_not_found"
      }
      if ![pathFromEvent_not_found] {
        mutate {
          replace => {
            "has_target_file" => "true"
          }
        }
      }
    }
    if [timeFromBrowser] != "" {
      mutate {
        gsub => [ "timeFromBrowser", "(\\d\\d):(\\d\\d)$", "$1$2" ]
      }
      date {
        match => ["timeFromBrowser", "yyyy-MM-ddTHH:mm:ss.SSSZ", "ISO8601"]
        on_error => "timeFromBrowser_not_found"
      }
    }
    if [fileName] != "" {
      mutate {
        replace => {
          "fileName_label.key" => "fileName"
          "fileName.value" => "%{fileName}"
        }
        on_error => "no_fileName"
      }
      if ![no_fileName] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.labels" => "about_for_fileName"
          }
          on_error => "no_filename_merge"
        }
      }
    }
  }
  if [audit_log] == "search_issued" {
    if [actorId] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.product_object_id" => "%{actorId}"
        }
        on_error => "actor_id_not_found"
      }
      if ![actor_id_not_found] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [actorName] != "" {
      grok {
        match => {
          "actorName" => [
            'API Client \\| %{GREEDYDATA:parsed_actorName}'
          ]
        }
        overwrite => ["parsed_actorName"]
        on_error => "actor_grok_name_not_found"
      }

      if ![actor_grok_name_not_found] and [parsed_actorName] != "" and [parsed_actorName] != [actorId] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{parsed_actorName}"
            "has_principal" => "true"
          }
          on_error => "parsed_actor_name_replace_failed"
        }
      }
      else if [parsed_actorName] != [actorId] {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.userid" => "%{actorName}"
              "has_principal" => "true"
            }
            on_error => "actor_name_replace_failed"
          }
        }
      }
    if [actorAgent] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{actorAgent}"
        }
        on_error => "actor_agent_not_found"
      }
    }
    if [actorIpAddress] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "actorIpAddress"
          "event.idm.read_only_udm.principal.asset.ip" => "actorIpAddress"
        }
        on_error => "actor_ip_address_not_found"
      }
      if ![actor_ip_address_not_found]{
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [timestamp] != "" {
      date {
        match => ["timestamp", "yyyy-MM-ddTHH:mm:ss.SSSZ", "ISO8601"]
        on_error => "timestamp_not_found"
      }
    }
    if [actorType] != "" {
      mutate {
        replace => {
          "roles.name" => "%{actorType}"
        }
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.roles" => "roles"
        }
        on_error => "actor_type_not_found"
      }
    }
    if [success] != "" {
      mutate {
        replace => {
          "action1" => ""
        }
      }
      if [success] =~ "(?i)true" {
        mutate {
          replace => {
            "action1" => "ALLOW"
          }
        }
      }
      else if [success] =~ "(?i)false" {
        mutate {
          replace => {
            "action1" => "BLOCK"
          }
        }
      }
      if [action1] != "" {
        mutate {
          merge => {
            "security_result_1.action" => "action1"
          }
          on_error => "action_merge_failed"
        }
      }
    }
    if [type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
        }
        on_error => "no_type"
      }
    }
    if [audit_log] != "" {
      mutate {
        replace => {
          "type_label.key" => "type"
          "type_label.value.string_value" => "%{audit_log}"
        }
        on_error => "no_audit_log_type_replace"
      }
      if ![no_audit_log_type_replace] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "type_label"
          }
          on_error => "no_audit_log_type_label_merge"
        }
      }
    }
    for i,group in requestJson.groups {
        mutate {
          convert => {
            "i" => "string"
          }
          on_error => "i_convert_failed"
        }
        for j, filter in group.filters {
          mutate {
            convert => {
                "j" => "string"
            }
            on_error => "j_convert_failed"
          }
          mutate {
            replace => {
              "filter_term_field_label" => ""
              "filter_op_field_label" => ""
              "filter_disp_field_label" => ""
              "filter_term" => ""
              "filter_operator" => ""
              "filter_value" => ""
              "filter_display_value" => ""
              "time_filter_value_label" => ""
            }
          }
          mutate {
            replace => {
              "filter_term" => "%{filter.term}"
            }
            on_error => "filter_term_value_not_found"
          }
          if [filter_term] != "" {
            mutate {
              replace => {
                "filter_term_field_label.key" => "group_filter_term_%{i}_%{j}"
                "filter_term_field_label.value" => "%{filter_term}"
              }
              on_error => "term_not_mapped"
            }
            if ![term_not_mapped] {
              mutate {
                merge => {
                  "security_result_1.detection_fields" => "filter_term_field_label"
                }
                on_error => "term_merge_failed"
              }
            }
          }
          mutate {
            replace => {
              "filter_operator" => "%{filter.operator}"
            }
            on_error => "filter_operator_value_not_found"
          }
          if [filter_operator] != "" {
            mutate {
              replace => {
                "filter_op_field_label.key" => "group_filter_operator_%{i}_%{j}"
                "filter_op_field_label.value" => "%{filter_operator}"
              }
              on_error => "group_filter_operator_not_mapped"
            }
            if ![group_filter_operator_not_mapped] {
              mutate {
                merge => {
                  "security_result_1.detection_fields" => "filter_op_field_label"
                }
