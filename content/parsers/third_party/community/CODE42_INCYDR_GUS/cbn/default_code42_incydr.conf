          "event_type" => "FILE_DELETION"
        }
      }
    }
    else {
      if [has_target_file] == "true" and [has_principal] == "true" and [has_target] == "true" {
        mutate {
          replace => {
            "event_type" => "FILE_UNCATEGORIZED"
          }
        }
      }
      else {
        if [has_principal] == "true" {
          mutate {
            replace => {
              "event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
      }
    }
  }
  if [event_type] == "" {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "CODE42_INCYDR"
      "event.idm.read_only_udm.metadata.vendor_name" => "CODE42_INCYDR"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
