# Product: WORDPRESS_CMS
# Category: Configuration Management
# Supported Format: JSON
# Reference: NA
# Last Updated: 2024-05-07
# Copyright 2024 Chronicle LLC

filter {
  mutate{
    replace => {
      "insertId" => ""
      "resource.labels.cluster_name" => ""
      "resource.labels.container_name" => ""
      "resource.labels.location" => ""
      "resource.labels.namespace_name" => ""
      "resource.labels.pod_name" => ""
      "resource.labels.project_id" => ""
      "resource.type" => ""
      "severity" => ""
      "http_method" => ""
      "statuscode" => ""
      "url" => ""
      "protocol" => ""
      "srcip" => ""
      "file_path" => ""
      "description" => ""
      "security_result" => ""
      "bytes" => ""
      "textPayload" => ""
      "ClientIP" => ""
      "SessionID" => ""
      "TargetUsername" => ""
      "EditUserLink" => ""
      "Roles" => ""
      "Code" => ""
      "sev" => ""
      "CurrentUserID" => ""
      "FirstName" => ""
      "LastName" => ""
      "UserAgent" => ""
      "EventType" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    grok{
      match => {
        "message" => "\\[%{TIMESTAMP_ISO8601:ts}\\] %{WORD}.%{WORD:sev}: %{GREEDYDATA:description}. \\{%{GREEDYDATA:json_data} \\["
      }
      overwrite => ["description","sev"]
      on_error => "match_error"
    }
    mutate {
      replace => {
        "json_data" => "{%{json_data}"
      }
      on_error => "no_json_data"
    }
    json {
     source => "json_data"
     array_function => "split_columns"
     on_error => "not_json"
    }
    if [not_json] {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }
  }
  if [sev] == "INFO" or [sev] == "NOTICE" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [sev] =~ "(?i)WARN" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [sev] =~ "(?i)ERR" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }
  if [ClientIP] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ClientIP"
      }
    }
  }
  if [SessionID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{SessionID}"
      }
    }
  }
  if [UserAgent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{UserAgent}"
      }
    }
  }
  if [TargetUsername] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.user_display_name" => "%{TargetUsername}"
      }
    }
  }
  if [CurrentUserID] != "" {
    mutate {
      convert => {
        "CurrentUserID" => "string"
      }
      on_error => "already_an_integer"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{CurrentUserID}"
      }
    }
  }
  if [EditUserLink] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{EditUserLink}"
      }
    }
  }
  if [FirstName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.first_name" => "%{FirstName}"
      }
    }
  }
  if [LastName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.last_name" => "%{LastName}"
      }
    }
  }
  if [Roles] != ""{
    mutate{
      uppercase => [Roles]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.user_role" => "%{Roles}"
      }
    }
  }
  if [Code] != "" {
    mutate {
      convert => {
        "Code" => "string"
      }
      on_error => "already_a_string"
    }
    mutate {
      replace => {
        "code.key" => "Code"
        "code.value" => "%{Code}"
      }
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "code"
      }
    }
  }
  if [EventType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{EventType}"
      }
    }
  }
  date {
    match => ["receiveTimestamp","ISO8601"]
    on_error => "date_not_in_above_format"
  }
  if [insertId] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{insertId}"
      }
    }
  }
  mutate {
    replace => {
      "log_name.key" => "Log Name"
      "log_name.value" => "%{logName}"
    }
    on_error => "logName_not_present"
  }
  if ![logName_not_present] {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "log_name"
      }
    }
  }
  if [message] =~ "compute.googleapis.com/resource_name" {
    mutate {
      replace => {
        "additional_resource_name.key" => "Resource Name"
        "additional_resource_name.value.string_value" => "%{labels.compute.googleapis.com/resource_name}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_resource_name"
      }
    }
  }
  if [message] =~ "k8s-pod/controller-revision-hash" {
    mutate {
      replace => {
        "controller_revision.key" => "Controller Revision Hash"
        "controller_revision.value" => "%{labels.k8s-pod/controller-revision-hash}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "controller_revision"
      }
    }
  }
  if [message] =~ "k8s-pod/k8s-app" {
    mutate {
      replace => {
        "app.key" => "Application"
        "app.value" => "%{labels.k8s-pod/k8s-app}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "app"
      }
    }
  }
  if [message] =~ "k8s-pod/pod-template-generation" {
    mutate {
      replace => {
        "template_generation.key" => "Pod Template Generation"
        "template_generation.value" => "%{labels.k8s-pod/pod-template-generation}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "template_generation"
      }
    }
  }
  if [message] =~ "k8s-pod/pod-template-hash" {
    mutate {
      replace => {
        "template_hash.key" => "Pod Template Hash"
        "template_hash.value" => "%{labels.k8s-pod/pod-template-hash}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "template_hash"
      }
    }
  }
  if [message] =~ "k8s-pod/app_kubernetes_io/instance" {
    mutate {
      replace => {
        "app_instance.key" => "Kubernetes IO Instance"
        "app_instance.value" => "%{labels.k8s-pod/app_kubernetes_io/instance}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "app_instance"
      }
    }
  }
  if [message] =~ "k8s-pod/app_kubernetes_io/managed-by" {
    mutate {
      replace => {
        "app_instance_manager.key" => "Kubernetes IO Instance Manager"
        "app_instance_manager.value" => "%{labels.k8s-pod/app_kubernetes_io/managed-by}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "app_instance_manager"
      }
    }
  }
  if [message] =~ "k8s-pod/app_kubernetes_io/name" {
    mutate {
      replace => {
        "app_instance_name.key" => "Kubernetes IO Instance Name"
        "app_instance_name.value" => "%{labels.k8s-pod/app_kubernetes_io/name}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "app_instance_name"
      }
    }
  }
  if [message] =~ "k8s-pod/helm_sh/chart" {
    mutate {
      replace => {
        "app_instance_manager_sh.key" => "Kubernetes IO Instance Manager SH"
        "app_instance_manager_sh.value" => "%{labels.k8s-pod/helm_sh/chart}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "app_instance_manager_sh"
      }
    }
  }
  if [resource][labels][container_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{[resource][labels][container_name]}"
      }
      on_error => "container_name_error"
    }
  }
  if [resource][labels][cluster_name] != "" {
    mutate {
      replace => {
        "additional_cluster.key" => "Cluster Name"
        "additional_cluster.value.string_value" => "%{resource.labels.cluster_name}"
        "event.idm.read_only_udm.target.resource.resource_type" => "CLUSTER"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_cluster"
      }
    }
  }
  if [resource][labels][location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{resource.labels.location}"
      }
    }
  }
  if [resource][labels][namespace_name] != "" {
    mutate {
      replace => {
        "additional_namespace.key" => "Namespace Name"
        "additional_namespace.value.string_value" => "%{resource.labels.namespace_name}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_namespace"
      }
    }
  }
  if [resource][labels][pod_name] != "" {
    mutate {
      replace => {
        "additional_action.key" => "Pod Name"
        "additional_action.value.string_value" => "%{resource.labels.pod_name}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_action"
      }
    }
  }
  if [resource][labels][project_id] != "" {
    mutate {
      replace => {
        "additional_project_id.key" => "Project Id"
        "additional_project_id.value.string_value" => "%{resource.labels.project_id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_project_id"
      }
    }
  }
  if [resource][labels][container_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{resource.labels.container_name}"
      }
    }
  }
  if [resource][type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{resource.type}"
      }
    }
    if [resource][type] == "k8s_container" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{resource.labels.container_name} - %{resource.labels.namespace_name}"
        }
        on_error => "field_not_present"
      }
    } else if [resource][type] == "k8s_node" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{resource.labels.node_name}"
        }
        on_error => "field_not_present"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{textPayload}"
        }
        on_error => "textpayload_not_present"
      }
    }
  }
  if [textPayload] != "" {
    mutate {
      gsub => ["textPayload",'\\\"'," "]
    }
    grok {
      match => {
        "textPayload" => [ "%{IP:srcip} - - \\[%{MONTHDAY:day}/%{MONTH:month}/%{YEAR:year}:%{TIME:time} +%{ISO8601_TIMEZONE:timezone}\\]  %{WORD:http_method} /%{DATA:url} %{URIPROTO:protocol}/%{BASE10NUM:version}\  %{NUMBER:statuscode} (%{NUMBER:bytes}|-)",
                           "%{TIMESTAMP_ISO8601:time} \\[%{LOGLEVEL:loglevel}\\]\\[%{INT}\\] %{DATA:file_path} %{INT}: %{GREEDYDATA:description}"
        ]
      }
      on_error => "match_error"
      overwrite => ["http_method","url","protocol","statuscode", "srcip", "file_path", "description","bytes"]
    }
  }
  if [http_method] != ""{
    mutate{
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{http_method}"
      }
    }
  }
  if [statuscode] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{statuscode}"
      }
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "not_integer"
    }
  }
  if [url] != ""{
    mutate{
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{url}"
      }
    }
  }
  if [protocol] != ""{
    mutate{
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "%{protocol}"
      }
    }
  }
  if [srcip] != ""{
    mutate{
      merge => {
        "event.idm.read_only_udm.principal.ip" => "srcip"
      }
    }
  }
  if [file_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{file_path}"
      }
    }
  }
  if [bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{bytes}"
      }
      convert => {
        "event.idm.read_only_udm.network.received_bytes" => "uinteger"
      }
    }
  }
  if [severity] == "INFO" or [severity] == "Informational" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{description}"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  mutate{
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
