# Product: COMMVAULT
# Category: Alert System
# Supported Format: KV , SYSLOG
# Reference: https://documentation.commvault.com/commvault/index.html
# Last Updated: 2024-01-24
# Copyright 2024 Chronicle LLC

filter{
  mutate {
    replace => {
      "security_result" => ""
      "principal" => ""
      "metadata" => ""
      "observer" => ""
      "event" => ""
      "Backup" => ""
      "Alertid" => ""
      "Alerttime" => ""
      "Alertseverity" => ""
      "Alertname" => ""
      "data" => ""
      "Alertdescription" => ""
      "duration" => ""
      "Alert" => ""
      "Type" => ""
      "DetectedCriteria" => ""
      "DetectedTime" => ""
      "CommCell" => ""
      "User" => ""
      "JobID" => ""
      "Client" => ""
      "AgentType" => ""
      "BackupSet" => ""
      "Severity" => ""
      "EventDate" => ""
      "Program" => ""
      "Description" => ""
      "Eventid" => ""
      "Jobid" => ""
      "Occurencetime" => ""
      "Eventseverity" => ""
      "Computer" => ""
      "event_log" => ""
      "alert_log" => ""
      "anomaly_type" => ""
      "url" => ""
      "detected_status" => ""
      "alert_id" => ""
      "file_name" => ""
      "event_description" => ""
      "media_agent" => ""
      "error" => ""
      "Opid" => ""
      "Audittime" => ""
      "Severitylevel" => ""
      "Username" => ""
      "Operation" => ""
      "Details" => ""
      "audit_log" => ""
      "no_of_files_created" => ""
      "no_of_files_deleted" => ""
      "no_of_files_modified" => ""
      "no_of_files_renamed" => ""
    }
  }

  mutate {
    gsub => ["message","\\s*}\\s*","$"]
  }

  mutate {
    gsub => ["message","\\s*{\\s*",""]
  }

  grok{
    match => {
      "message" => [
        "Alerts: %{GREEDYDATA:alert_log}",
        "Events: %{GREEDYDATA:event_log}",
        "AuditTrail: %{GREEDYDATA:audit_log}"
      ]
    }
    on_error => "grok_failure"
    overwrite => ["event_log","alert_log","audit_log"]
  }

  if [grok_failure] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [alert_log] != "" {
    kv {
      source => "alert_log"
      field_split => "$"
      value_split => "="
      on_error => "kv_fail"
    }

    if [Alerttime] != "" {
      date {
        match => ["Alerttime", "d MMM yyyy hh:mm:ss", "dd MMM yyyy hh:mm:ss"]
        target => "metadata.event_timestamp"
        on_error => "no_alert_time"
      }
    }

    if [Alertdescription] != "" {
      mutate {
        gsub => ["Alertdescription"," Type:","@ Type:"]
      }

      mutate {
        gsub => ["Alertdescription","Detected Criteria","DetectedCriteria"]
      }

      mutate {
        gsub => ["Alertdescription","Detected Time","DetectedTime"]
      }

      mutate {
        gsub => ["Alertdescription","Job ID","Jobid:"]
      }

      mutate {
        gsub => ["Alertdescription","\\t","@"]
      }

      mutate {
        gsub => ["Alertdescription","\\s*@\\s*","@"]
      }

      kv {
        source => "Alertdescription"
        field_split => "@"
        value_split => ": "
        on_error => "no_alert_description_kv"
      }
    }

    if [Alertseverity] != "" {
      mutate {
        replace => {
          "Severity" => "%{Alertseverity}"
        }
        on_error => "no_alert_severity"
      }
    }

    if [Alertdescription] != "" {
      grok {
        match => {
          "Alertdescription" => [
            "A suspicious file \\[%{GREEDYDATA:file_name}\\] is detected on the machine \\[%{WORD:machine}\\]",
            ".*<html>%{GREEDYDATA:event_description} of type \\[%{GREEDYDATA:anomaly_type}\\ ] in last 5 minutes. Number of files Modified \\[%{INT:no_of_files_modified}\\] Deleted \\[%{INT:no_of_files_deleted}\\] Renamed \\[%{INT:no_of_files_renamed}\\] and Created \\[%{INT:no_of_files_created}\\]. Please click\\s+<a href=\\\"%{GREEDYDATA:url}\\\"> here</a> for more details.</html>",
            "A time-out has occurred while initializing data transfer with MediaAgent \\[%{HOSTNAME:media_agent}\\].  Please check the following  If this is a LAN Data Transfer, check network connectivity between the Client and MediaAgent.  For Network Free Data Transfer verify that there are no issues with the secondary storage device on the MediaAgent."
          ]
        }
        on_error => "alert_description_empty"
        overwrite => ["file_name","media_agent","no_of_files_created","no_of_files_deleted","no_of_files_modified","no_of_files_renamed","url","anomaly_type","event_description"]
      }

      if [event_description] != "" {
        mutate {
          replace => {
            "Description" => "%{event_description}"
          }
          on_error => "no_description"
        }
      }
      else if [Description] =~ "A suspicious file" {
        mutate {
          replace => {
            "Description" => "A suspicious file is Detected"
          }
          on_error => "no_description"
        }
      }
    }

    if [file_name] != "" {
      mutate {
        replace => {
          "detection_file_name.value" => "%{file_name}"
        }
        on_error => "file_name_empty"
      }
      if ![file_name_empty] {
        mutate {
          replace => {
            "detection_file_name.key" => "SuspiciousFileName"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "detection_file_name"
          }
          on_error => "detection_file_name_empty"
        }
      }
    }

    if [media_agent] != "" {
      mutate {
        replace => {
          "detection_media_agent.value" => "%{media_agent}"
        }
        on_error => "media_agent_empty"
      }
      if ![media_agent_empty] {
        mutate {
          replace => {
            "detection_media_agent.key" => "MediaAgent"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "detection_media_agent"
          }
          on_error => "detection_media_agent_empty"
        }
      }
    }
  }

  if [event_log] != "" {
    kv {
      source => "event_log"
      field_split => "$"
      value_split => "="
      on_error => "kv_fail"
    }

    if [Occurrencetime] != "" {
      date {
        match => ["Occurrencetime","d MMM yyyy hh:mm:ss", "dd MMM yyyy hh:mm:ss"]
        target => "metadata.event_timestamp"
        on_error => "no_occurence_time"
      }
    }

    if [Description] != "" {
      grok {
        match => {
          "Description" => [
            "Restore job \\[%{INT:Jobid}\\] completed. Client \\[%{WORD:Client}\\], Agent Type \\[%{GREEDYDATA:AgentType}\\], Duration \\[%{TIME:duration}\\].",
            ".*Client \\[%{DATA:Client}\\]"
          ]
        }
        on_error => "no_event_description_grok"
        overwrite => ["Client","Jobid","duration","AgentType"]
      }
    }

    if [Eventseverity] != "" {
      mutate {
        replace => {
          "Severity" => "%{Eventseverity}"
        }
        on_error => "no_event_severity"
      }
    }
  }

  if [audit_log] != "" {
    kv {
      source => "audit_log"
      field_split => "$"
      value_split => "="
      on_error => "kv_fail"
    }

    if [Details] != "" {
      grok {
        match => {
          "Details" => "Client : \\[%{DATA:Client}\\]"
        }
        overwrite => ["Client"]
        on_error => "details_failure"
      }
    }

    if [Audittime] != "" {
      date {
        match => ["Audittime", "d MMM yyyy hh:mm:ss", "dd MMM yyyy hh:mm:ss"]
        target => "metadata.event_timestamp"
        on_error => "no_alert_time"
      }
    }

    if [Severitylevel] != "" {
      mutate {
        replace => {
          "Severity" => "%{Severitylevel}"
        }
        on_error => "no_severity_level"
      }
    }

    if [Username] != "" {
      mutate {
        replace => {
          "User" => "%{Username}"
        }
        on_error => "no_username"
      }
    }
  }

  if [User] != "" {
    if [User] == "Administrator" {
      mutate {
        replace => {
          "principal.user.user_role" => "ADMINISTRATOR"
        }
        on_error => "no_user_role"
      }
    }
    else {
      mutate {
        replace => {
          "principal.user.userid" => "%{User}"
        }
        on_error => "no_user_role"
      }
    }
  }

  if [DetectedCriteria] != "" {
    mutate {
      replace => {
        "detection_DetectedCriteria.value" => "%{DetectedCriteria}"
      }
      on_error => "DetectedCriteria_empty"
    }
    if ![DetectedCriteria_empty] {
      mutate {
        replace => {
          "detection_DetectedCriteria.key" => "DetectedCriteria"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_DetectedCriteria"
        }
        on_error => "detection_DetectedCriteria_empty"
      }
    }
  }

  if [anomaly_type] != "" {
    mutate {
      replace => {
        "detection_anomaly_type.value" => "%{anomaly_type}"
      }
      on_error => "anomaly_type_empty"
    }
    if ![anomaly_type_empty] {
      mutate {
        replace => {
          "detection_anomaly_type.key" => "anomaly_type"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_anomaly_type"
        }
        on_error => "detection_anomaly_type_empty"
      }
    }
  }

  if [no_of_files_deleted] != "" {
    mutate {
      replace => {
        "detection_no_of_files_deleted.value" => "%{no_of_files_deleted}"
      }
      on_error => "no_of_files_deleted_empty"
    }
    if ![no_of_files_deleted_empty] {
      mutate {
        replace => {
          "detection_no_of_files_deleted.key" => "no_of_files_deleted"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_no_of_files_deleted"
        }
        on_error => "detection_no_of_files_deleted_empty"
      }
    }
  }

  if [no_of_files_renamed] != "" {
    mutate {
      replace => {
        "detection_no_of_files_renamed.value" => "%{no_of_files_renamed}"
      }
      on_error => "no_of_files_renamed_empty"
    }
    if ![no_of_files_renamed_empty] {
      mutate {
        replace => {
          "detection_no_of_files_renamed.key" => "no_of_files_renamed"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_no_of_files_renamed"
        }
        on_error => "detection_no_of_files_renamed_empty"
      }
    }
  }

  if [no_of_files_created] != "" {
    mutate {
      replace => {
        "detection_no_of_files_created.value" => "%{no_of_files_created}"
      }
      on_error => "no_of_files_created_empty"
    }
    if ![no_of_files_created_empty] {
      mutate {
        replace => {
          "detection_no_of_files_created.key" => "no_of_files_created"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_no_of_files_created"
        }
        on_error => "detection_no_of_files_created_empty"
      }
    }
  }

  if [no_of_files_modified] != "" {
    mutate {
      replace => {
        "detection_no_of_files_modified.value" => "%{no_of_files_modified}"
      }
      on_error => "no_of_files_modified_empty"
    }
    if ![no_of_files_modified_empty] {
      mutate {
        replace => {
          "detection_no_of_files_modified.key" => "no_of_files_modified"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_no_of_files_modified"
        }
        on_error => "detection_no_of_files_modified_empty"
      }
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "network.http.referral_url" => "%{url}"
      }
      on_error => "no_url"
    }
  }

  if [Alertid] != "" {
    mutate {
      replace => {
        "detection_Alertid.value" => "%{Alertid}"
      }
      on_error => "Alertid_empty"
    }
    if ![Alertid_empty] {
      mutate {
        replace => {
          "detection_Alertid.key" => "Alertid"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_Alertid"
        }
        on_error => "detection_Alertid_empty"
      }
    }
  }

  if [Alertname] != "" {
    mutate {
      replace => {
        "detection_Alertname.value" => "%{Alertname}"
      }
      on_error => "Alertname_empty"
    }
    if ![Alertname_empty] {
      mutate {
        replace => {
          "detection_Alertname.key" => "Alertname"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_Alertname"
        }
        on_error => "detection_Alertname_empty"
      }
    }
  }

  if [Opid] != "" {
    mutate {
      replace => {
        "detection_Opid.value" => "%{Opid}"
      }
      on_error => "Opid_empty"
    }
    if ![Opid_empty] {
      mutate {
        replace => {
          "detection_Opid.key" => "Opid"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_Opid"
        }
        on_error => "detection_Opid_empty"
      }
    }
  }

  if [Operation] != "" {
    mutate {
      replace => {
        "detection_Operation.value" => "%{Operation}"
      }
      on_error => "Operation_empty"
    }
    if ![Operation_empty] {
      mutate {
        replace => {
          "detection_Operation.key" => "Operation"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_Operation"
        }
        on_error => "detection_Operation_empty"
      }
    }
  }

  if [Type] != "" {
    mutate {
      replace => {
        "detection_Type.value" => "%{Type}"
      }
      on_error => "Type_empty"
    }
    if ![Type_empty] {
      mutate {
        replace => {
          "detection_Type.key" => "Type"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_Type"
        }
        on_error => "detection_Type_empty"
      }
    }
  }

  if [Alert] != "" {
    mutate {
      replace => {
        "Alert_field.value" => "%{Alert}"
      }
      on_error => "Alert_empty"
    }
    if ![Alert_empty] {
      mutate {
        replace => {
          "Alert_field.key" => "Alert"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "Alert_field"
        }
        on_error => "Alert_field_empty"
      }
    }
  }

  if [Client] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{Client}"
        "principal.asset.hostname" => "%{Client}"
      }
      on_error => "no_client"
    }
  }

  if [AgentType] != "" {
    mutate {
      replace => {
        "observer.application" => "%{AgentType}"
      }
      on_error => "AgentType_empty"
    }
  }

  if [Description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{Description}"
      }
      on_error => "no_description"
    }
  }
  else if [Backup] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{Backup}"
      }
      on_error => "Backup_empty"
    }
  }

  if [Jobid] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{Jobid}"
      }
      on_error => "no_jobid"
    }
  }

  if [Eventid] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{Eventid}"
      }
      on_error => "no_event_id"
    }
  }

  if [Program] != "" {
    mutate {
      replace => {
        "principal.application" => "%{Program}"
      }
      on_error => "no_program"
    }
  }

  if [duration] != "" {
    mutate {
      replace => {
        "duration_field.value.string_value" => "%{duration}"
      }
      on_error => "duration_empty"
    }
    if ![duration_empty] {
      mutate {
        replace => {
          "duration_field.key" => "duration"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "duration_field"
        }
        on_error => "duration_field_empty"
      }
    }
  }

  if [CommCell] != "" {
    mutate {
      replace => {
        "CommCell_field.value.string_value" => "%{CommCell}"
      }
      on_error => "CommCell_empty"
    }
    if ![CommCell_empty] {
      mutate {
        replace => {
          "CommCell_field.key" => "CommCell"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "CommCell_field"
        }
        on_error => "CommCell_field_empty"
      }
    }
  }

  if [Computer] != "" {
    mutate {
      replace => {
        "computer_field.value.string_value" => "%{Computer}"
      }
      on_error => "computer_empty"
    }
    if ![computer_empty] {
      mutate {
        replace => {
          "computer_field.key" => "Computer"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "computer_field"
        }
        on_error => "computer_field_empty"
      }
    }
  }

  if [Severity] == "Information" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [Severity] == "Major" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [Severity] == "Minor" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [Severity] in ["Critical","High","Low","Medium"] {
    mutate{
      uppercase => ["Severity"]
    }
    mutate {
      replace => {
        "security_result.severity" => "%{Severity}"
      }
      on_error => "no_severity_level"
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "COMMVAULT_COMMCELL"
      "metadata.vendor_name" => "COMMVAULT"
    }
  }

  if [Client] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [observer] != "" {
    mutate {
      rename => {
        "observer" => "event.idm.read_only_udm.observer"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}