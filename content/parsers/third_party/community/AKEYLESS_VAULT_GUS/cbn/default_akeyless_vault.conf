# Product: AKEYLESS_VAULT
# Category: Akeyless Vault Platform
# Supported Format: KV + JSON, Syslog + JSON
# Reference: NA
# Last Updated: 2026-04-20
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "product_event_type" => ""
      "remote_addr" => ""
      "duration" => ""
      "security_result" => ""
      "action" => ""
      "account_id" => ""
      "access_id" => ""
      "component" => ""
      "ip_present" => "false"
      "principal_ip_set" => "false"
      "intermediary_ip_set" => "false"
      "time" => ""
      "severity" => ""
      "device_vendor" => ""
      "device_product" => ""
      "device_version" => ""
      "device_event_class_id" => ""
      "json_data" => ""
      "request_parameters.access_type" => ""
      "request_parameters.product" => ""
      "request_parameters.transaction_type" => ""
      "request_parameters.unique_id" => ""
      "request_parameters.user_agent" => ""
      "request_parameters.comment" => ""
      "request_parameters.token_id" => ""
      "request_parameters.operation" => ""
      "request_parameters.session_id" => ""
      "request_parameters.source" => ""
      "request_parameters.item_accessibility" => ""
      "request_parameters.universal_identity_rotate_type" => ""
      "host" => ""
      "status" => ""
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "vendor_name" => "Tanium Integrity Monitor"
      "product_name" => "Tanium Integrity Monitor"
      "syslog_hostname" => ""
      "process_name" => ""
      "pid" => ""
      "app_timestamp" => ""
      "event_level" => ""
      "item_type" => ""
      "duration_in_ms" => ""
      "action_value" => ""
      "request_parameters_access_type" => ""
      "request_parameters_resolved_item_name" => ""
      "has_target_user" => "false"
      "has_principal" => "false"
      "has_principal_user" => "false"
      "ip" => ""
      "has_target_resource" => "false"
    }
  }

  mutate {
    gsub => ["message", "\\n", ""]
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{TIMESTAMP_ISO8601:time}\\s+%{DATA}\\s+(?P<product_event_type>[\\w-]+)\\[%{INT}\\]:\\s+(?P<time2>\\d{1,2}-%{MONTH}-\\d{1,4}\\s+\\d{1,2}:\\d{1,2}:\\d{1,2}.\\d+)\\s+%{WORD}\\s+%{WORD:severity}\\s+CEF:0\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\s+%{WORD}\\[%{INT}\\]:\\s+%{GREEDYDATA:kv_data}"
        "<%{INT}>%{TIMESTAMP_ISO8601:time}\\s+%{DATA}\\s+(?P<product_event_type>[\\w-]+)\\[%{INT}\\]:\\s+(?P<time2>\\d{1,2}-%{MONTH}-\\d{1,4}\\s+\\d{1,2}:\\d{1,2}:\\d{1,2})\\s+%{WORD}\\s+%{WORD:severity}\\s+CEF:0\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\s+%{WORD}\\[%{INT}\\]:\\s+%{GREEDYDATA:kv_data}"
        "\\[%{DATA:severity}\\] %{DATA:host} %{DATA}\\[%{INT:audit_no}\\]: %{GREEDYDATA:kv_data}"
        '<%{INT}> %{TIMESTAMP_ISO8601:time} %{HOSTNAME:syslog_hostname} %{DATA:process_name}\\[%{INT:pid}\\]: (?<app_timestamp>%{MONTHDAY}-%{MONTH}-%{YEAR} %{TIME}) %{HOSTNAME:syslog_hostname} %{LOGLEVEL:severity} time=\"%{TIMESTAMP_ISO8601:event_time}\" level=%{WORD:event_level} msg=%{GREEDYDATA:json_data}'
        "\\[%{DATA:severity}\\] %{GREEDYDATA:json_data}"
        "%{GREEDYDATA:json_data}"
      ]
    }
    overwrite => ["host", "product_event_type", "time", "severity", "device_vendor", "device_product", "device_version", "device_event_class_id", "json_data", "event_time", "event_level", "audit_no", "syslog_hostname", "process_name", "pid", "container_id", "app_timestamp"]
    on_error => "grok_fail"
  }
  if ![grok_fail] {
    date {
      match => ["time", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "time_not_matched"
    }
    if [syslog_hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.hostname" => "%{syslog_hostname}"
        }
        on_error => "syslog_hostname_not_matched"
      }
    }
    if [process_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.application" => "%{process_name}"
        }
        on_error => "process_name_not_matched"
      }
    }
    if [pid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.process.pid" => "%{pid}"
        }
        on_error => "pid_not_matched"
      }
    }
  }

  if [grok_fail]{
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  mutate {
    gsub => ["kv_data", ",(\\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
  }

  mutate {
    gsub => ["kv_data", " , ", " "]
  }

  mutate  {
    gsub => ["kv_data", ",remote", "^remote"]
  }

  kv {
    source => "kv_data"
    field_split => "^"
    value_split => "="
    on_error => "not_kv"
  }


  if [json_data] != "" {
    mutate {
      gsub => ["json_data", "\\\\n", ""]
    }
    mutate {
      gsub => ["json_data", "^\"\\{", "{"]
    }
    mutate {
      gsub => ["json_data", "\\}\"$", "}"]
    }
    mutate {
      gsub => ["json_data", "item_type\": , ", "item_type\": null, "]
    }
    mutate {
      gsub => ["json_data", ' \\\\\\"', '\"']
    }
    mutate {
      gsub => ["json_data", '\\\\\\"', '\"']
    }
  }

  json {
    source => "json_data"
    array_function => "split_columns"
    on_error => "invalid_json_data"
  }

  #principal
  if [json_data] != "" and [remote_addr] != "" {
    grok {
      match => {
        "remote_addr" => "^%{IP:ip}$"
      }
      overwrite => ["ip"]
      on_error => "remote_addr_not_matched"
    }
    if ![remote_addr_not_matched] {
      mutate {
        replace => {
          "ip_present" => "true"
        }
      }
      if [principal_ip_set] == "false" {
        mutate {
          merge => {
            "principal.ip" => "ip"
            "principal.asset.ip" => "ip"
          }
          on_error => "single_principal_ip_merge_failed"
        }
        mutate {
          replace => {
            "principal_ip_set" => "true"
            "has_principal" => "true"
          }
        }
      }
    }
    else {
      for ip in remote_addr {
        mutate {
          replace => {
            "ip_present" => "true"
          }
        }
        if [principal_ip_set] == "false" {
          grok {
            match => {
              "ip" => [
                "%{IP:ip}"
              ]
            }
            overwrite => ["ip"]
            on_error => "ip_not_matched"
          }
          if ![ip_not_matched] {
            mutate {
              merge => {
                "principal.ip" => "ip"
                "principal.asset.ip" => "ip"
              }
              on_error => "principal_ip_merge_failed"
            }
            if ![principal_ip_merge_failed] {
              mutate {
                replace => {
                  "principal_ip_set" => "true"
                  "has_principal" => "true"
                }
              }
            }
          }
        } else if [intermediary_ip_set] == "false" {
          mutate {
            merge => {
              "intermediary.ip" => "ip"
            }
            on_error => "intermediary_ip_merge_failed"
          }
          if ![intermediary_ip_merge_failed] {
            mutate {
              replace => {
                "intermediary_ip_set" => "true"
              }
            }
          }
        } else {
          mutate {
            merge => {
              "principal.ip" => "ip"
              "principal.asset.ip" => "ip"
            }
            on_error => "principal_ip_merge_failed_else"
          }
          if ![principal_ip_merge_failed_else] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
    }
  }
  else if [remote_addr] != "" {
    mutate {
      replace => {
        "remote_addr" => "{\"remote_addr\":[\"%{remote_addr}\"]}"
      }
    }

    mutate {
      gsub => ["remote_addr", ", ", "\", \""]
    }

    json {
      source => "remote_addr"
      array_function => "split_columns"
      on_error => "remote_addr_not_in_json"
    }

    for ip in remote_addr {
      mutate {
        gsub => ["ip", ",", ""]
      }
      mutate {
        replace => {
          "ip_present" => "true"
        }
      }
      if [principal_ip_set] == "false" {
        mutate {
          merge => {
            "principal.ip" => "ip"
            "principal.asset.ip" => "ip"
          }
          on_error => "principal_ip_merge_failed_for_loop"
        }
        mutate {
          replace => {
            "principal_ip_set" => "true"
            "has_principal" => "true"
          }
        }
      } else if [intermediary_ip_set] == "false" {
        mutate {
          merge => {
            "intermediary.ip" => "ip"
          }
          on_error => "intermediary_ip_merge_failed_for_loop"
        }
        mutate {
          replace => {
            "intermediary_ip_set" => "true"
          }
        }
      } else {
        mutate {
          merge => {
            "principal.ip" => "ip"
            "principal.asset.ip" => "ip"
          }
          on_error => "principal_ip_merge_failed_else_for_loop"
        }
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  #target

  if [message] =~ "(?i)namespace" {
    grok {
      match => {
        "message" => [
          "namespace:\\s+(?P<namespace>[\\S]+)"
        ]
      }
      on_error => "namespace_not_matched"
    }
    if ![namespace_not_matched] {
      mutate {
        replace => {
          "target.namespace" => "%{namespace}"
        }
      }
    }
  }

  if [account_id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{account_id}"
        "has_target_user" => "true"
      }
      on_error => "account_id_not_matched"
    }
  }

  if [component] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{component}"
      }
    }
  }

  if [json_data] != "" and [request_parameters][transaction_type] != "" {
    mutate {
      convert => {
        "request_parameters.transaction_type" => "string"
      }
      on_error => "request_parameters.transaction_type_already_string"
    }
    mutate {
      replace => {
        "transaction_type_label.key" => "transaction_type"
        "transaction_type_label.value" => "%{request_parameters.transaction_type}"
      }
      on_error => "invalid_trabsaction_type"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "transaction_type_label"
      }
      on_error => "transaction_type_label_merge_failed"
    }
  }
  if [message] =~ "(?i)transaction_type" {
    grok {
      match => {
        "message" => [
          "transaction_type:\\s+(?P<transactiontype>[\\S]+)"
        ]
      }
      on_error => "transaction_type_not_matched"
    }
    if ![transaction_type_not_matched] {
      mutate {
        replace => {
          "transaction_type_label.key" => "transaction_type"
          "transaction_type_label.value" => "%{transactiontype}"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "transaction_type_label"
        }
      }
    }
  }
  mutate {
    replace => {
      "request_parameters_access_type" => "%{request_parameters.access_type}"
    }
    on_error => "access_type_empty"
  }

  if [message] =~ "(?i)access_type" and [json_data] == "" {
    grok {
      match => {
        "message" => [
          "access_type:\\s+(?P<accesstype>[\\S]+)"
        ]
      }
      on_error => "access_type_not_matched"
    }
    if ![access_type_not_matched] {
      mutate {
        replace => {
          "access_type_label.key" => "access_type"
          "access_type_label.value" => "%{accesstype}"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "access_type_label"
        }
      }
    }
  } else if [request_parameters_access_type] != "" {
    mutate {
      replace => {
        "access_type_label.key" => "access_type"
        "access_type_label.value" => "%{request_parameters_access_type}"
      }
      on_error => "invalid_access_type"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "access_type_label"
      }
      on_error => "access_type_merge_failed"
    }
  }
  mutate {
    replace => {
      "request_parameters_resolved_item_name" => "%{request_parameters.resolved_item_name}"
    }
    on_error => "resolved_item_name_not_matched"
  }
  if [request_parameters_resolved_item_name] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{request_parameters_resolved_item_name}"
        "has_target_resource" => "true"
      }
      on_error => "invalid_resolved_item_name"
    }
  }

  if [message] =~ "(?i)pod_name" {
    grok {
      match => {
        "message" => [
          "pod_name:\\s+(?P<podname>[\\S]+)"
        ]
      }
      on_error => "pod_name_not_matched"
    }
    if ![pod_name_not_matched] {
      mutate {
        replace => {
          "pod_name_label.key" => "pod_name"
          "pod_name_label.value" => "%{podname}"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "pod_name_label"
        }
      }
    }
  }

  if [json_data] != "" and [request_parameters][product] != "" {
    mutate {
      replace => {
        "product_label.key" => "product"
        "product_label.value" => "%{request_parameters.product}"
      }
      on_error => "invalid_product_label"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "product_label"
      }
      on_error => "product_label_merge_failed"
    }
  }
  else if [message] =~ "(?i)product" {
    grok {
      match => {
        "message" => [
          "product:\\s+(?P<product>[\\w\\s]+)"
        ]
      }
      on_error => "product_not_matched"
    }
    if ![product_not_matched] {
      mutate {
        replace => {
          "product_label.key" => "product"
          "product_label.value" => "%{product}"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "product_label"
        }
      }
    }
  }

  if [json_data] != "" and [request_parameters][unique_id] =~ "^.+@.+$" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "request_parameters.unique_id"
      }
      on_error => "unique_id_merge_failed_else"
    }
    mutate {
      replace => {
        "has_principal_user" => "true"
      }
    }
  }
  else if [json_data] != "" and [request_parameters][unique_id] !="" {
    mutate {
      replace => {
        "unique_id_label.key" => "unique_id"
        "unique_id_label.value" => "%{request_parameters.unique_id}"
      }
      on_error => "invalid_unique_id_label"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "unique_id_label"
      }
      on_error => "unique_id_label_merge_failed"
    }
  }
  else if [message] =~ "(?i)unique_id" {
    grok {
      match => {
        "message" => [
          "unique_id:\\s+(?P<uniqueid>[\\w-]+)"
        ]
      }
      on_error => "unique_id_not_matched"
    }
    if ![unique_id_not_matched] {
      mutate {
        replace => {
          "unique_id_label.key" => "unique_id"
          "unique_id_label.value" => "%{uniqueid}"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "unique_id_label"
        }
      }
    }
  }

  if [json_data] != "" and [request_parameters][user_agent] != "" {
    mutate {
      replace => {
        "user_agent_label.key" => "user_agent"
        "user_agent_label.value" => "%{request_parameters.user_agent}"
      }
      on_error => "invalod_user_agent_label"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "user_agent_label"
      }
      on_error => "user_agent_label_merge_failed"
    }
  }

  if [json_data] != "" and [item_type] != "" {
    mutate {
      replace => {
        "target.resource.resource_subtype" => "%{item_type}"
      }
      on_error => "invalid_item_type"
    }
  }

  if [json_data] != "" and [duration_in_ms] != "" {
    mutate {
      convert => {
        "duration_in_ms" => "string"
      }
      on_error => "duration_in_ms_already_string"
    }
    mutate {
      replace => {
        "duration_in_ms_label.key" => "duration_in_ms"
        "duration_in_ms_label.value" => "%{duration_in_ms}"
      }
      on_error => "invalid_duration_in_ms_label"
    }
    if ![invalid_duration_in_ms_label] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "duration_in_ms_label"
        }
        on_error => "duration_in_ms_label_merge_failed"
      }
    }
  }

  if [json_data] != "" and [request_parameters][comment] != "" {
    mutate {
      replace => {
        "comment_label.key" => "comment"
        "comment_label.value" => "%{request_parameters.comment}"
      }
      on_error => "invalid_comment_label"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "comment_label"
      }
      on_error => "comment_label_merge_failed"
    }
  }

  if [json_data] != "" and [request_parameters][session_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{request_parameters.session_id}"
      }
      on_error => "invalid_session_id"
    }
  }

  if [json_data] != "" and [request_parameters][operation] != "" {
    mutate {
      replace => {
        "operation_label.key" => "operation"
        "operation_label.value" => "%{request_parameters.operation}"
      }
      on_error => "invalid_operation_label"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "operation_label"
      }
      on_error => "operation_label_merge_failed"
    }
  }

  if [json_data] != "" and [request_parameters][source] != "" {
    mutate {
      replace => {
        "source_label.key" => "source"
        "source_label.value" => "%{request_parameters.source}"
      }
      on_error => "invalid_source_label"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "source_label"
      }
      on_error => "source_label_merge_failed"
    }
  }

  if [json_data] != "" and [request_parameters][item_accessibility] != "" {
    mutate {
      convert => {
        "request_parameters.item_accessibility" => "string"
      }
      on_error => "request_parameters.item_accessibility_already_string"
    }
    mutate {
      replace => {
        "item_accessibility_label.key" => "item_accessibility"
        "item_accessibility_label.value" => "%{request_parameters.item_accessibility}"
      }
      on_error => "invalid_item_accessibility_label"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "item_accessibility_label"
      }
      on_error => "item_accessibility_label_merge_failed"
    }
  }

  if [json_data] != "" and [request_parameters][token_id] != "" {
    mutate {
      replace => {
        "token_label.key" => "token_id"
        "token_label.value" => "%{request_parameters.token_id}"
      }
      on_error => "invalid_token_id"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "token_label"
      }
      on_error => "token_label_merge_failed"
    }
  }

  if [json_data] != "" and [request_parameters][universal_identity_rotate_type] != "" {
    mutate {
      replace => {
        "universal_identity_rotate_type_label.key" => "universal_identity_rotate_type"
        "universal_identity_rotate_type_label.value" => "%{request_parameters.universal_identity_rotate_type}"
      }
      on_error => "invalid_universal_identity_rotate_type"
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "universal_identity_rotate_type_label"
      }
      on_error => "universal_identity_rotate_type_label_merge_failed"
    }
  }


  #network

  if [duration] not in [ "", "0" ] {
    mutate {
      replace => {
        "network.session_duration.seconds" => "%{duration}"
      }
      convert => {
        "network.session_duration.seconds" => "integer"
      }
      on_error => "duration_not_integer"
    }
  }

  if [status] != "" {
    mutate {
      convert => {
        "status" => "string"
      }
      on_error => "status_already_string"
    }
    mutate {
      replace => {
        "network.http.response_code" => "%{status}"
      }
    }
    mutate {
      convert => {
        "network.http.response_code" => "integer"
      }
      on_error => "status_not_integer"
    }
  }
  if [status] != "" {
    mutate {
      convert => {
       "status" => "string"
      }
      on_error => "_status_convert_failed"
    }
    mutate {
      replace => {
       "security_result.description" => "HTTP %{status}"
      }
      on_error => "_status_description_failed"
    }
    if [status] =~ "^2" {
      mutate {
        replace => {
          "action_value" => "ALLOW"
        }
      }
    }
    else if [status] =~ "^[45]" {
      mutate {
        replace => {
         "action_value" => "BLOCK"
        }
      }
    }
    if [action_value] != "" {
      mutate {
        merge => {
         "security_result.action" => "action_value"
        }
        on_error => "_action_value_merge_failed"
      }
    }
  }

  #security
  if [severity] != "" {
    if [severity] =~ "(?i)Info" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [severity] =~ "(?i)Error" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [severity] =~ "(?i)Warning" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }
  }

  if [action] not in ["", "none"] {
    if [action] =~ "(?i)get" {
      mutate {
        replace => {
          "network.http.method" => "GET"
        }
      }
    }
    else if [action] in ["put", "Authentication"] {
      mutate {
        replace => {
          "network.http.method" => "PUT"
        }
      }
    }
    else if [action] =~ "(?i)post" {
      mutate {
        replace => {
          "network.http.method" => "POST"
        }
      }
    }
    else if [action] =~ "(?i)delete" {
      mutate {
        replace => {
          "network.http.method" => "DELETE"
        }
      }
    }

    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
    }
  }

  #common fields
  if [product_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
      }
    }
  }
  else if [action] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{action}"
      }
      on_error => "_product_event_type_failed"
    }
  }

  if [access_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{access_id}"
      }
    }
  } else if [message] =~ "(?i)access_id" {
    grok {
      match => {
        "message" => [
          "access_id:\\s+(?P<accessid>[\\w-]+)"
        ]
      }
      on_error => "access_id_not_matched"
    }
    if ![access_id_not_matched] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{accessid}"
        }
      }
    }
  }

  if [device_product] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{device_product}"
      }
    }
  }

  if [device_vendor] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{device_vendor}"
      }
    }
  }

  if [device_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{device_version}"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [intermediary_ip_set] == "true" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "network" => "event.idm.read_only_udm.network"
    }
  }

  if ([action] =~ "validate_token" or [action] =~ "auth" or [action] =~ "login") and ([has_principal] == "true" or [has_principal_user] == "true" or [has_target_user] == "true") {
    mutate {
      replace => {
       "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
      }
    }
    mutate {
      replace => {
       "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
       "mechanism_value" => "USERNAME_PASSWORD"
      }
    }
    mutate {
      merge => {
       "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism_value"
      }
      on_error => "_auth_mechanism_merge_failed"
    }
  }
  else if ([action] =~ "get" or [action] =~ "list" or ([action] =~ "Authentication" and [request_parameters_access_type] =~ "api_key")) and ([has_principal] == "true" or [has_principal_user] == "true" or [has_target_user] == "true" ){
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [action] =~ "describe_permissions" and [has_principal_user] == "true" {
    mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_READ"
    }
    }
  }
  else if ([action] =~ "create" or [action] =~ "update" or [action] =~ "set" or [action] =~ "issue_gateway_jwt") and [has_principal_user] == "true" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
      }
    }
  }
  else if [action] =~ "share_item" and [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_PERMISSIONS_CHANGE"
      }
    }
  }
  else if [action] =~ "delete" and ([has_principal] == "true" or [has_principal_user] == "true" or [has_target_user] == "true" ) {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_DELETION"
      }
    }
  }
  else if [ip_present] == "true" or [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

