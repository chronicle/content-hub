    mutate {
      gsub => ["operation_detail", "\\s+\\-\\s+", "#"]
    }

    if [action] in ["Add", "SCIM API - Create"] {
      if [action] == "SCIM API - Create" {
        mutate {
          gsub => ["operation_detail", "\\s+set to\\s+", ""]
        }
      }
      grok {
        match => {
          "operation_detail" => [
            "Add (SSO )?User(s)? %{DATA:email}#%{GREEDYDATA:kv_data}"
            "%{NOTSPACE:email}#.*?(?P<json_data>\\[.*\\])"
            "%{DATA:zoom_action}#%{GREEDYDATA:kv_data}"
          ]
        }
        overwrite => ["email", "kv_data", "json_data", "zoom_action"]
        on_error => "add_grok_failure"
      }
      if [json_data]!= "" {
        mutate {
          replace => {
            "inner_json" => "{\"AddUser\": %{json_data}}"
          }
          on_error => "json_data_not_found"
        }
        json {
          source => "inner_json"
          array_function => "split_columns"
          on_error => "json_data_not_found"
        }
        for index,add in AddUser {
          mutate {
            replace => {
              "assistant_label" => ""
              "options_label" => ""
              "add_about" => ""
            }
          }
          mutate {
            replace => {
              "assistant_label.value" => "%{add.assistant}"
            }
            on_error => "assistant_not_found"
          }
          mutate {
            convert => {
              "add.options" => "string"
            }
            on_error => "already_string"
          }
          mutate {
            replace => {
              "options_label.value" => "%{add.options}"
            }
            on_error => "options_not_found"
          }
          if [index]==0 {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.user.userid" => "%{add.userId}"
              }
              on_error => "user_id_not_found"
            }
            if [assistant_label] != "" {
              mutate {
                replace => {
                  "assistant_label.key" => "Assistant"
                }
                merge => {
                  "event.idm.read_only_udm.target.user.attribute.labels" => "assistant_label"
                }
              }
            }
            if [options_label] != "" {
              mutate {
                replace => {
                  "options_label.key" => "Options"
                }
                merge => {
                  "event.idm.read_only_udm.target.user.attribute.labels" => "options_label"
                }
              }
            }
          }
          else {
            mutate {
              replace => {
                "add_about.user.userid" => "%{add.userId}"
              }
              on_error => "user_id_not_found"
            }
            if [assistant_label] != "" {
              mutate {
                replace => {
                  "assistant_label.key" => "Assistant"
                }
                merge => {
                  "add_about.user.attribute.labels" => "assistant_label"
                }
              }
            }
            if [options_label] != "" {
              mutate {
                replace => {
                  "options_label.key" => "Options"
                }
                merge => {
                  "add_about.user.attribute.labels" => "options_label"
                }
              }
            }
            if [add_about] != "" {
              mutate {
                merge => {
                  "event.idm.read_only_udm.about" => "add_about"
                }
              }
            }
          }
        }
      }
    }
    else if [action] == "Delete" {
      grok {
        match => {
          "operation_detail" => [
            "Delete User %{DATA:email}#.*?#Transfer-to Email: %{GREEDYDATA:email2}"
            "Delete User %{DATA:email} "
          ]
        }
        overwrite => ["email","email2"]
        on_error => "delete_grok_failure"
      }
    }
    else if [action] == "SCIM API - Update" {
      mutate {
        gsub => ["operation_detail", ":\\s+from.*?to\\s", ":"]
      }
      grok {
        match => {
          "operation_detail" => [
            "Edit User %{DATA:email}#%{GREEDYDATA:kv_data}"
            "Update SSO User %{DATA:email}#%{GREEDYDATA:kv_data}"
          ]
        }
        overwrite => ["email","kv_data"]
      }
    }
    else if [action] == "Update" {
      mutate {
        gsub => ["operation_detail", ":\\s+from.*?to", ":"]
      }
      mutate {
        gsub => ["operation_detail", "\\s+set to\\s+", ""]
      }
      grok {
        match => {
          "operation_detail" => [
            "Update User %{DATA:email}#%{GREEDYDATA:kv_data}"
            "Change Phone Number#%{DATA:email}:.*"
            "Deactivate User %{DATA:email} "
          ]
        }
        overwrite => ["email","kv_data"]
        on_error => "update_grok_failure"
      }
    }
    else if [action] == "SCIM API - Deactivate" {
      grok {
        match => {
          "operation_detail" => [
            "Deactivate User %{DATA:email} "
          ]
        }
        overwrite => ["email"]
      }
    }
    else if [action] == "Batch Update" {
      grok {
        match => {
          "operation_detail" => [
            "Change Role#%{DATA:email}: from %{WORD} to %{GREEDYDATA:role}"
            "Change Role  : %{DATA:role}#%{DATA:email}:.*(#%{DATA:email2}:.*)?"
          ]
        }
        overwrite => ["email","role","email2"]
        on_error => "batch_update_grok_failure"
      }
    }
    else if [action] == "Resend" {
      grok {
        match => {
          "operation_detail" => [
            "Invite User#%{GREEDYDATA:email}"
          ]
        }
        overwrite => ["email"]
      }
    }

    if [kv_data] != "" {
      kv {
        source => "kv_data"
        value_split => ":"
        field_split => "#"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.first_name" => "%{First Name}"
      }
      on_error => "user_first_name_not_found"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.last_name" => "%{Last Name}"
      }
      on_error => "user_last_name_not_found"
    }

    if [Department] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.department" => "Department"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.title" => "%{Job Title}"
      }
      on_error => "user_title_not_found"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.user_display_name" => "%{Display Name}"
      }
      on_error => "user_name_not_found"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.role_description" => "%{Description}"
      }
      on_error => "description_not_found"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.user.email_addresses" => "Email Address"
      }
      on_error => "mail_address_not_found"
    }

    mutate {
      replace => {
        "user_role.name" => "%{User Role}"
      }
      on_error => "role_not_found"
    }

    if [role_not_found] {
      mutate {
        replace => {
          "user_role.name" => "%{Role Name}"
        }
        on_error => "role_name_not_found"
      }
    }

    if [role] != "" {
      mutate {
        replace => {
          "user_role.name" => "%{role}"
        }
      }
    }

    if [user_role] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.attribute.roles" => "user_role"
        }
      }
    }

    if [Location] != "" {
      mutate {
        rename => {
          "Location" => "event.idm.read_only_udm.target.location.name"
        }
      }
    }

    mutate {
      replace => {
        "manager.user_display_name" => "%{Manager}"
      }
      on_error => "manager_not_found"
    }

    if ![manager_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.managers" => "manager"
        }
      }
    }

    mutate {
      replace => {
        "user_type_label.value" => "%{User Type}"
      }
      on_error => "user_type_not_found"
    }

    if ![user_type_not_found] {
      mutate {
        replace => {
          "user_type_label.key" => "User Type"
        }
        merge => {
          "event.idm.read_only_udm.target.user.attribute.labels" => "user_type_label"
        }
      }
    }

    mutate {
      replace => {
        "type_label.value" => "%{Type}"
      }
      on_error => "type_not_found"
    }

    if ![type_not_found] {
      mutate {
        replace => {
          "type_label.key" => "Type"
        }
        merge => {
          "event.idm.read_only_udm.target.user.attribute.labels" => "type_label"
        }
      }
    }

    mutate {
      replace => {
        "room_name_label.value" => "%{Room Name}"
      }
      on_error => "room_name_not_found"
    }

    if ![room_name_not_found] {
      mutate {
        replace => {
          "room_name_label.key" => "Room Name"
        }
        merge => {
          "event.idm.read_only_udm.target.user.attribute.labels" => "room_name_label"
        }
      }
    }

    if [email] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.email_addresses" => "email"
        }
      }
    }

    if [email2] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.email_addresses" => "email2"
        }
      }
    }
    mutate{
      replace => {
        "device_name" => "%{device.name}"
      }
      on_error => "device_name_error"
    }
    if [device_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{device_name}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{device_name}"
          "has_principal" => "true"
        }
        on_error => "device_name_not_found"
      }
    }
    mutate{
      replace => {
        "device_id" => "%{device.id}"
      }
      on_error => "device_id_error"
    }
    if [device_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.asset_id" => "asset_id:%{device_id}"
           "event.idm.read_only_udm.principal.asset_id" => "asset_id:%{device_id}"
        }
        on_error => "device_id_not_found"
      }
    }
    mutate{
      replace => {
        "device_platform" => "%{device.platform}"
      }
      on_error => "device_platform_error"
    }
    if [device_platform] != "" {
      mutate{
        uppercase => ["device_platform"]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "%{device_platform}"
        }
        on_error => "device_platform_not_found"
      }
    }
    mutate{
      replace => {
        "device_serial_number" => "%{device.serial_number}"
      }
      on_error => "device_serial_number_error"
    }
     mutate {
      rename => {
        "device_serial_number" => "addition.device_serial_number"
        "zoom_action" => "addition.zoom_action"
        "old_company_id" => "addition.old_company_id"
        "old_company_name" => "addition.old_company_name"
        "new_company_name" => "addition.new_company_name"
        "new_company_id" => "addition.new_company_id"
      }
    }
    for key1,value1 in addition map {
      mutate {
        replace => {
          "field1_label" => ""
          "check" => ""
        }
      }
      mutate {
        convert => {
          "value1" => "string"
        }
        on_error => "value1_string"
      }
      mutate {
        replace => {
          "check" => "%{value1}"
        }
        on_error => "check_empty"
      }
      if ![check_empty] && [check] != "" {
        mutate {
          replace => {
            "field1_label.key" => "%{key1}"
          }
          on_error => "key1_empty"
        }
        if [key1] in ["zoom_action", "device_serial_number", "old_company_id", "old_company_name", "new_company_name", "new_company_id"] {
          mutate {
            replace => {
              "field1_label.value.string_value" => "%{value1}"
            }
            on_error => "field1_error"
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "field1_label"
            }
            on_error => "field1_merge_error"
          }
        }
      }
    }
    mutate{
      replace => {
        "action_result" => "%{action.result}"
      }
      on_error => "action_result_not_found"
    }
    if [action_result] == "success" or [action_result] == "SUCCESS" {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
      }
    }
    else if [action_result] == "failure" or [action_result] == "FAILURE" {
      mutate {
        replace => {
          "security_result_action" => "BLOCK"
        }
      }
    }
    if [security_result_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
        on_error => "security_result_action_empty"
      }
    }
    if [action_result] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action_result}"
        }
        on_error => "action_result_empty"
      }
    }
    mutate{
      replace => {
        "action_status" => "%{action.status}"
      }
      on_error => "action_status_error"
    }
    if [action_status] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{action_status}"
        }
        on_error => "action_status_not_found"
      }
    }
    if [operation_detail] =~ "Update SSO User" and [security_result_action] == "" {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
        on_error => "action_result_error"
      }
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
        on_error => "security_result_action_not_found"
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "ZOOM_OPERATION_LOGS"
        "event.idm.read_only_udm.metadata.vendor_name" => "ZOOM"
      }
    }

    if [event_type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
        }
      }
    }
    else if ([has_target_user] == "true" or [has_principal_user] == "true") and [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [type] == "Sign out" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [operator] != "" or [email] != "" or [email2] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    if [has_target_user] == "true" and [has_principal_user] == "true" {
      if [event_user] == "user.created" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_CREATION"
          }
        }
      }else if [event_user] == "user.deleted" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_DELETION"
          }
        }
      }
    }
    else if [has_target_user] == "true" and [event_user] == "user.signed_in" and [payload_object_login_type] == "100"{
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    }
    else if [has_target_user] == "true" and [event_user] == "user.signed_in" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"

        }
      }
    }
    else if [has_principal] == "true" and [action] == "Add" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_HEARTBEAT"
        }
      }
    }
    else if [has_principal_user] == "true" or [has_target_user] == "true"{
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
