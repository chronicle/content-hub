# Product:Zoom Operation Logs
# Category:Operation-Specific
# Supported Format:SYSLOG, JSON+SYSLOG
# Reference:N/A
# Last Updated:2026-09-21
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace=>{
      "action" => ""
      "category_type" => ""
      "operator" => ""
      "security_result" => ""
      "operation_detail" => ""
      "email" => ""
      "email2" => ""
      "event_type" => ""
      "kv_data" => ""
      "Department" => ""
      "role" => ""
      "Location" => ""
      "user_role" => ""
      "json_data" => ""
      "records" => ""
      "ip_address" => ""
      "client_type" => ""
      "type" => ""
      "version" => ""
      "creation_type_label" => ""
      "object_type_label" => ""
      "domain" => ""
      "payload_account_id" => ""
      "payload_operator" => ""
      "payload_operator_id" => ""
      "payload_creation_type" => ""
      "payload_object_id" => ""
      "payload_object_first_name" => ""
      "payload_object_last_name" => ""
      "payload_object_display_name" => ""
      "payload_object_email" => ""
      "payload_object_type" => ""
      "has_principal_user" => ""
      "has_target_user" => ""
       "payload_assigned_user_id" => ""
       "payload_object_user_id" => ""
       "payload_object_user_email" => ""
      "payload_object_date_time" => ""
      "payload_object_date_time_ms" => ""
      "payload_object_role_id" => ""
      "payload_object_role_name" => ""
      "payload_object_status_id" => ""
      "payload_object_status_name" => ""
      "payload_object_country_iso_code" => ""
      "payload_object_user_access" => ""
      "channel_settings_enable" => ""
      "channel_settings_max_agent_load" => ""
      "channel_settings_concurrent_message_capacity" => ""
      "payload_object_client_type" => ""
      "payload_object_login_type" => ""
      "setting_path_label" => ""
      "new_value_label" => ""
      "old_value_label" => ""
      "payload_object_settings_chat_allow_users_to_chat_with_others_enable" => ""
      "payload_old_object_settings_chat_allow_users_to_chat_with_others_enable" => ""
      "event_user" => ""
      "payload_timestamp" => ""
      "event_user_ts" => ""
      "account_id" => ""
      "zoom_action" => ""
      "device_name" => ""
      "device_id" => ""
      "device_platform" => ""
      "device_serial_number" => ""
      "action_result" => ""
      "action_status" => ""
      "old_company_id" => ""
      "old_company_name" => ""
      "new_company_name" => ""
      "has_principal" => "false"
      "security_result_action" => ""
      "new_company_id" => ""
      "payload_object_topic" => ""
      "payload_object_host_id" => ""
      "payload_object_start_time" => ""
      "payload_object_duration" => ""
      "payload_object_timezone" => ""
      "payload_object_uuid" => ""
      "payload_object_participant_user_id" => ""
      "payload_object_participant_user_name" => ""
      "payload_object_participant_public_ip" => ""
      "payload_object_participant_join_time" => ""
      "payload_object_participant_participant_uuid" => ""
      "payload_object_participant_email" => ""
      "payload_object_participant_participant_user_id" => ""
      "payload_object_participant_id" => ""
    }
  }
  mutate {
    gsub => ["message", "event", "event_user"]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_in_json"
  }

  if [ip_address] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip_address"
        "event.idm.read_only_udm.principal.asset.ip" => "ip_address"
      }
      on_error => "ip_address_not_found"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [client_type] != "" {
    mutate {
      replace => {
        "client_type_label.key" => "client_type"
        "client_type_label.value.string_value" => "%{client_type}"
      }
      on_error => "client_type_not_found"
    }
    if ![client_type_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "client_type_label"
        }
        on_error => "client_type_label_not_found"
      }
    }
  }
  if [type] != "" {
    mutate {
      replace => {
        "type_label.key" => "type"
        "type_label.value.string_value" => "%{type}"
      }
      on_error => "type_not_found"
    }
    if ![type_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type_label"
        }
        on_error => "type_label_not_found"
      }
    }
  }
  if [version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      }
      on_error => "version_not_found"
    }
  }

  if [not_in_json] {
    mutate {
      replace => {
        "message" => "{\"records\":%{message}}"
      }
      on_error => "not_in_json"
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_in_json"
    }

    if [not_in_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  if [records] != "" {
    for rec in records {
      mutate {
        replace => {
          "event1" => ""
          "category_label" => ""
          "operator_data" => ""
          "action_data" => ""
          "email" => ""
          "email2" => ""
          "target_user" => ""
          "group_name" => ""
          "role_name" => ""
        }
      }

      date {
        match => ["rec.time", "ISO8601"]
        target => "event1.idm.read_only_udm.metadata.event_timestamp"
        on_error => "time_not_found"
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.product_event_type" =>
          "%{rec.action}"
          "action_data" => "%{rec.action}"
        }
        on_error => "action_not_found"
      }
      mutate {
        replace => {
          "category_label.value.string_value" => "%{rec.category_type}"
          "category_label.key" => "category_type"
        }
        on_error => "category_type_not_found"
      }
      if ![category_type_not_found] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "category_label"
          }
          on_error => "category_label_not_found"
        }
      }

      mutate {
        replace => {
          "operator_data" => "%{rec.operator}"
        }
        on_error => "operator_not_found"
      }

      if [operator_data] =~ "(^.+@.+$)"{
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.user.email_addresses" =>
            "operator_data"
          }
          on_error => "operator_data_not_found"
        }
      }
      else if [operator_data] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.user.userid" =>
            "%{operator_data}"
          }
          on_error => "operator_data_not_found"
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.description" =>
          "%{rec.operation_detail}"
        }
        on_error => "operation_detail_not_found"
      }

      if [action_data] == "Delete" or [action_data] == "delete" {
        grok {
          match => {
            "rec.operation_detail" => [
              "(Delete User|delete user) %{DATA:email}#.*?#Transfer-to Email: %{GREEDYDATA:email2}"
              "(Delete User|delete user)( )?-( )?%{DATA:email}$"
              "(Delete User|delete user) %{DATA:email} "
              "delete group - %{DATA:group_name}$"
            ]
          }
          overwrite => ["email", "email2", "group_name"]
          on_error => "delete_grok_failure"
        }
      }
      else if [action_data] == "create" {
        grok {
          match => {
            "rec.operation_detail" => [
              "create user - %{EMAILADDRESS:email}"
              "create user - %{DATA:target_user}$"
              "create role - %{DATA:role_name}$"
            ]
          }
          overwrite => ["email", "target_user", "role_name"]
          on_error => "create_grok_failure"
        }
      }
      else if [action_data] == "update" {
        grok {
          match => {
            "rec.operation_detail" => [
              "updated permissions for user - %{EMAILADDRESS:email}"
            ]
          }
          overwrite => ["email"]
          on_error => "update_grok_failure"
        }
      }

      if [email] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.user.email_addresses" => "email"
          }
          on_error => "email_not_found"
        }
      }

      if [email2] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.user.email_addresses" => "email2"
          }
          on_error => "email2_not_found"
        }
      }

      if [target_user] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.user.userid" => "%{target_user}"
          }
          on_error => "target_user_not_found"
        }
      }

      if [group_name] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.group.group_display_name" =>
            "%{group_name}"
          }
          on_error => "no_group_name"
        }
      }

      if [role_name] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.user.role_name" => "%{role_name}"
          }
          on_error => "no_role_name"
        }
      }

      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.product_name" =>
          "ZOOM_OPERATION_LOGS"
          "event1.idm.read_only_udm.metadata.vendor_name" => "ZOOM"
        }
      }

      if [operator_data] != "" or [email] != "" or [email2] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.event_type" =>
            "USER_UNCATEGORIZED"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event1.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
          }
        }
      }

      mutate {
        merge => {
          "@output" => "event1"
        }
      }
    }
  }
  else {
    if [action] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{action}"
        }
        on_error => "action_not_found"
      }
    }
    if [event_user] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{event_user}"
        }
        on_error => "event_not_found"
      }
    }
    if [event_user] == "account.settings_updated" {
      mutate {
        convert => {
          "payload.object.settings.chat.allow_users_to_chat_with_others.enable" => "string"
        }
        on_error => "new_value_is_string"
      }
      mutate {
        replace => {
          "payload_object_settings_chat_allow_users_to_chat_with_others_enable" => "%{payload.object.settings.chat.allow_users_to_chat_with_others.enable}"
        }
        on_error => "new_value_not_found"
      }
      mutate {
        convert => {
          "payload.old_object.settings.chat.allow_users_to_chat_with_others.enable" => "string"
        }
        on_error => "old_value_is_string"
      }
      mutate {
        replace => {
          "payload_old_object_settings_chat_allow_users_to_chat_with_others_enable" => "%{payload.old_object.settings.chat.allow_users_to_chat_with_others.enable}"
        }
        on_error => "old_value_not_found"
      }
      if ![new_value_not_found] and ![old_value_not_found] {
        mutate {
          replace => {
            "setting_path_label.key" => "setting_path"
            "setting_path_label.value" => "chat.allow_users_to_chat_with_others.enable"
          }
          on_error => "setting_path_label_error"
        }
        if ![setting_path_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "setting_path_label"
            }
            on_error => "setting_path_label_merge_error"
          }
        }
        if [payload_object_settings_chat_allow_users_to_chat_with_others_enable] != "" {
          mutate {
            replace => {
              "new_value_label.key" => "new_value"
              "new_value_label.value" => "%{payload_object_settings_chat_allow_users_to_chat_with_others_enable}"
            }
            on_error => "new_value_label_error"
          }
        }
        if ![new_value_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "new_value_label"
            }
            on_error => "new_value_label_merge_error"
          }
        }
        if [payload_old_object_settings_chat_allow_users_to_chat_with_others_enable] != "" {
          mutate {
            replace => {
              "old_value_label.key" => "old_value"
              "old_value_label.value" => "%{payload_old_object_settings_chat_allow_users_to_chat_with_others_enable}"
            }
            on_error => "old_value_label_error"
          }
        }
        if ![old_value_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "old_value_label"
            }
            on_error => "old_value_label_merge_error"
          }
        }
      }
    }
    mutate {
      replace => {
        "payload_account_id" => "%{payload.account_id}"
      }
      on_error => "account_id_not_found"
    }
    if [payload_account_id] != "" and [event_user] == "user.signed_in" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.group.product_object_id" => "%{payload_account_id}"
        }
        on_error => "payload_account_id_not_found"
      }
    }
    else if [payload_account_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.product_object_id" => "%{payload_account_id}"
        }
        on_error => "payload_account_id_not_found_2"
      }
    }
    mutate {
      replace => {
        "payload_operator" => "%{payload.operator}"
      }
      on_error => "payload_operator_not_found"
    }
    if [payload_operator] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{payload_operator}"
          "has_principal_user" => "true"
        }
        on_error => "payload_operator_not_found_2"
      }
    }
    mutate {
      replace => {
        "payload_assigned_user_id" => "%{payload.object.assigned_user_id}"
      }
      on_error => "payload_assigned_user_id_not_found"
    }
    if [payload_assigned_user_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{payload_assigned_user_id}"
        }
        on_error => "payload_assigned_user_id_not_found_2"
      }
      if ![payload_assigned_user_id_not_found_2] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }
    mutate {
      convert => {
        "payload.time_stamp" => "string"
      }
      on_error => "payload_timestamp_not_string"
    }
    mutate {
      replace => {
        "payload_timestamp" => "%{payload.time_stamp}"
      }
      on_error => "payload_timestamp_not_found"
    }
    if [payload_timestamp] != "" {
      mutate {
        replace => {
          "payload_timestamp_label.key" => "payload_timestamp"
          "payload_timestamp_label.value.string_value" => "%{payload_timestamp}"
        }
        on_error => "payload_timestamp_label_error"
      }
      if ![payload_timestamp_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "payload_timestamp_label"
          }
          on_error => "payload_timestamp_label_merge_error"
        }
      }
    }
    if [payload_account_id] != "" {
      mutate {
        replace => {
          "account_id_label.key" => "account_id"
          "account_id_label.value.string_value" => "%{payload_account_id}"
        }
        on_error => "account_id_label_error"
      }
      if ![account_id_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "account_id_label"
          }
          on_error => "account_id_label_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "payload_object_user_id" => "%{payload.object.user_id}"
      }
      on_error => "payload_user_id_not_found"
    }
    if [payload_object_user_id] != "" and [payload_operator] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{payload_object_user_id}"
        }
        on_error => "payload_object_user_id_not_found"
      }
      if ![payload_object_user_id_not_found] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }else if [payload_object_user_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{payload_object_user_id}"
        }
        on_error => "payload_object_user_id_not_found_2"
      }
      if ![payload_object_user_id_not_found_2] {
        mutate {
          replace => {
            "has_target_user" => "true"
          }
        }
      }
    }
    if [payload_operator] =~ "(^.+@.+$)"{
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "payload.operator"
        }
        on_error => "principal_operator_not_found_3"
      }
      if ![principal_operator_not_found_3] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }
    mutate {
      replace => {
        "payload_operator_id" => "%{payload.operator_id}"
      }
      on_error => "payload_operator_id_not_found"
    }
    if [payload_operator_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.product_object_id" => "%{payload_operator_id}"
        }
        on_error => "payload_operator_id_not_found_2"
      }
    }
    mutate {
      replace => {
        "payload_creation_type" => "%{payload.creation_type}"
      }
      on_error => "payload_creation_type_not_found"
    }
    if [payload_creation_type] != "" {
      mutate {
        replace => {
          "creation_type_label.key" => "creation_type"
          "creation_type_label.value.string_value" => "%{payload_creation_type}"
        }
        on_error => "creation_type_not_found"
      }
      if ![creation_type_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "creation_type_label"
          }
          on_error => "creation_type_label_not_found"
        }
      }
    }
    mutate {
      replace => {
        "payload_object_id" => "%{payload.object.id}"
      }
      on_error => "payload_object_not_found"
    }
    if [payload_object_id] != "" and [event_user] == "user.signed_in" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.product_object_id" => "%{payload_object_id}"
        }
        on_error => "payload_object_id_not_found"
      }
    }else if [payload_object_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.product_object_id" => "%{payload_object_id}"
        }
        on_error => "payload_object_id_not_found_2"
      }
    }
    mutate {
      replace => {
        "payload_object_first_name" => "%{payload.object.first_name}"
      }
      on_error => "payload_object_first_name_not_found"
    }
    if [payload_object_first_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.first_name" => "%{payload_object_first_name}"
        }
        on_error => "payload_object_first_name_not_found_2"
      }
    }
    mutate {
      replace => {
        "payload_object_last_name" => "%{payload.object.last_name}"
      }
      on_error => "payload_object_last_name_not_found"
    }
    if [payload_object_last_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.last_name" => "%{payload_object_last_name}"
        }
        on_error => "payload_object_last_name_not_found_3"
      }
    }
    mutate {
      replace => {
        "payload_object_display_name" => "%{payload.object.display_name}"
      }
      on_error => "payload_object_display_name_not_found"
    }
    if [payload_object_display_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.user_display_name" => "%{payload_object_display_name}"
        }
        on_error => "payload_object_display_name_not_found_2"
      }
    }
    mutate {
      replace => {
        "payload_object_email" => "%{payload.object.email}"
      }
      on_error => "payload_object_email_not_found"
    }
    mutate {
      convert => {
        "event_user_ts" => "string"
      }
      on_error => "event_ts_not_found_2"
    }
    date {
      match => ["event_user_ts", "UNIX_MS"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "event_ts_not_found_1"
    }

    mutate {
      replace => {
        "payload_object_client_type" => "%{payload.object.client_type}"
      }
      on_error => "payload_object_client_type_not_found"
    }
    if [payload_object_client_type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{payload_object_client_type}"
        }
        on_error => "principal_app_not_found"
      }
    }
    mutate {
      convert => {
        "payload.object.login_type" => "string"
      }
      on_error => "login_type_already_string"
    }
    mutate {
      replace => {
        "payload_object_login_type" => "%{payload.object.login_type}"
      }
      on_error => "payload_object_login_type_not_found"
    }
    if [payload_object_login_type] != "" {
      mutate {
        replace => {
          "login_type_label.key" => "login_type"
          "login_type_label.value.string_value" => "%{payload_object_login_type}"
        }
        on_error => "login_type_not_found"
