# Product: AWAKE NDR
# Category: NDR
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-01-11
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "srcIp" => ""
      "query" => ""
      "customer" => ""
      "deviceId" => ""
      "riskLevel" => ""
      "deviceName" => ""
      "devicePath" => ""
      "sensor.id" => ""
      "responseId" => ""
      "sensor.name" => ""
      "endTimeUnix" => ""
      "nActivities" => ""
      "deviceType" => ""
      "startTimeUnix" => ""
      "endTimeISO8601" => ""
      "operatingSystem" => ""
      "lastSeenTimeUnix" => ""
      "startTimeISO8601" => ""
      "lastSeenTimeISO8601" => ""
      "lastMatchedTimeUnix" => ""
      "adversarialModelPath" => ""
      "adversarialModelName" => ""
      "lastMatchedTimeISO8601" => ""
      "adversarialModelRiskScore" => ""
      "activityThreatBehaviorGuid" => ""
      "matchedDestination.ip" => ""
      "target" => ""
      "principal" => ""
      "metadata" => ""
      "security_result" => ""
      "has_principal" => ""
      "has_target" => ""
      "target_domain_not_set" => "true"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json_log"
  }

  if [not_json_log] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }

  if [activityThreatBehaviorGuid] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{activityThreatBehaviorGuid}"
      }
      on_error => "invalid_activityThreatBehaviorGuid"
    }
  }

  if [adversarialModelName] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{adversarialModelName}"
      }
      on_error => "invalid_adversarialModelName"
    }
  }

  if [deviceId] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{deviceId}"
      }
      on_error => "invalid_deviceid"
    }
  }

  if [deviceName] != "" {
    mutate {
      replace => {
        "principal.asset.hostname" => "%{deviceName}"
      }
      on_error => "invalid_devicename"
    }

    mutate {
      replace => {
        "principal.hostname" => "%{deviceName}"
      }
      on_error => "invalid_devicename"
    }

    if not [invalid_devicename] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [devicePath] != "" {
    mutate {
      replace => {
        "devicepath_label.key" => "DevicePath"
        "devicepath_label.value" => "%{devicePath}"
      }
      on_error => "invalid_devicepath"
    }
    if not [invalid_devicepath] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "devicepath_label"
        }
        on_error => "invalid_devicepath_label"
      }
    }
  }

  if [deviceRiskScore] != "" {
    mutate {
      convert => {
        "deviceRiskScore" => "string"
      }
      on_error => "already_string"
    }

    mutate {
      replace => {
        "device_risk_score.key" => "DeviceRiskScore"
        "device_risk_score.value" => "%{deviceRiskScore}"
      }
      on_error => "invalid_deviceriskscore"
    }
    if not [invalid_deviceriskscore] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "device_risk_score"
        }
        on_error => "invalid_deviceriskscore_label"
      }
    }
  }

  if [deviceType] != "" {
    mutate {
      replace => {
        "device_type.key" => "DeviceType"
        "device_type.value" => "%{deviceType}"
      }
      on_error => "invalid_deviceType"
    }
    if not [invalid_deviceType] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "device_type"
        }
        on_error => "invalid_deviceType_label"
      }
    }
  }

  if [srcIp] != "" {
    grok {
      match => {
        "srcIp" => "%{IP:srcIp}"
      }
      overwrite => ["srcIp"]
      on_error => "not_ip"
    }
    if not [not_ip] {
      mutate {
        merge => {
          "principal.ip" => "srcIp"
        }
        on_error => "invalid_srcip"
      }
      if not [invalid_srcip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [operatingSystem] != "" {
    if [operatingSystem] =~ "Win" {
      mutate {
        replace => {
          "principal.platform" => "WINDOWS"
        }
      }
    }
    else if [operatingSystem] =~ "Mac" {
      mutate {
        replace => {
          "principal.platform" => "MAC"
        }
      }
    }
    else if [operatingSystem] =~ "Lin" {
      mutate {
        replace => {
          "principal.platform" => "LINUX"
        }
      }
    }

    mutate {
      replace => {
        "principal.platform_version" => "%{operatingSystem}"
      }
      on_error => "invalid_operating_system"
    }
  }

  for sensor in sensors {
    mutate {
      replace => {
        "sensorid_label" => ""
        "sensorname_label" => ""
      }
    }
    if [sensor][id] not in ["","null"] {
      mutate {
        convert => {
          "sensor.id" => "string"
        }
        on_error => "conversion_failure"
      }
      mutate {
        replace => {
          "sensorid_label.key" => "Sensor Id"
          "sensorid_label.value" => "%{sensor.id}"
        }
        on_error => "invalid_sensorid"
      }
      if not [invalid_sensorid] {
        mutate {
          merge => {
            "principal.resource.attribute.labels" => "sensorid_label"
          }
          on_error => "invalid_sensorid_label"
        }
      }
    }

    if [sensor][name] not in ["","null"] {
      mutate {
        replace => {
          "sensorname_label.key" => "Sensor Name"
          "sensorname_label.value" => "%{sensor.name}"
        }
        on_error => "invalid_sensorname"
      }
      if not [invalid_sensorname] {
        mutate {
          merge => {
            "principal.resource.attribute.labels" => "sensorname_label"
          }
          on_error => "invalid_sensorname_label"
        }
      }
    }
  }


  for matchedDestination in matchedDestinations {
    mutate {
      replace => {
        "target_ip" => ""
        "dest_domain" => ""
        "dest_domain_label" => ""
      }
    }
    if [matchedDestination][ip] != "" {
      mutate {
        replace => {
          "target_ip" => "%{matchedDestination.ip}"
        }
        on_error => "invalid_ip"
      }
      grok {
        match => {
          "target_ip" => "%{IP:target_ip}"
        }
        overwrite => ["target_ip"]
        on_error => "not_ip"
      }
      if not [not_ip] {
        mutate {
          merge => {
            "target.ip" => "matchedDestination.ip"
          }
          on_error => "invalid_dstip"
        }
        if not [invalid_dstip] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }

    mutate {
      replace => {
        "dest_domain" => "%{matchedDestination.domain}"
      }
      on_error => "invalid_domain"
    }

    if not [invalid_domain] {
      if [target_domain_not_set] == "true" {
        mutate {
          replace => {
            "target.administrative_domain" => "%{matchedDestination.domain}"
          }
          on_error => "invalid_dest_domain"
        }
      } else if [target_domain_not_set] == "false" and [target][administrative_domain] != [dest_domain] {
        mutate {
          replace => {
            "dest_domain_label.key" => "MatchedDestination Domain"
            "dest_domain_label.value" => "%{dest_domain}"
          }
          on_error => "invalid_matched_dest_domain"
        }
        if not [invalid_matched_dest_domain] {
          mutate {
            merge => {
              "target.resource.attribute.labels" => "dest_domain_label"
            }
            on_error => "invalid_dest_domain_label"
          }
        }
      }
    }
  }

  if [adversarialModelRiskScore] != "" {
    mutate {
      convert => {
        "adversarialModelRiskScore" => "string"
      }
      on_error => "conversion_failure"
    }
    mutate {
      replace => {
        "adversarialModelRiskScore_label.key" => "adversarialModelRiskScore"
        "adversarialModelRiskScore_label.value" => "%{adversarialModelRiskScore}"
      }
      on_error => "invalid_adversarialModelRiskScore"
    }
    if not [invalid_adversarialModelRiskScore] {
      mutate {
        merge => {
          "security_result.detection_fields" => "adversarialModelRiskScore_label"
        }
        on_error => "invalid_adversarialModelRiskScore_label"
      }
    }
  }

  if [adversarialModelPath] != "" {
    mutate {
      replace => {
        "adversarialModelPath_label.key" => "adversarialModelPath"
        "adversarialModelPath_label.value" => "%{adversarialModelPath}"
      }
      on_error => "invalid_adversarialModelPath"
    }
    if not [invalid_adversarialModelPath] {
      mutate {
        merge => {
          "security_result.detection_fields" => "adversarialModelPath_label"
        }
        on_error => "invalid_adversarialModelPath_label"
      }
    }
  }

  if [nActivities] != "" {
    mutate {
      convert => {
        "nActivities" => "string"
      }
      on_error => "conversion_failure"
    }
    mutate {
      replace => {
        "nActivities_label.key" => "nActivities"
        "nActivities_label.value" => "%{nActivities}"
      }
      on_error => "invalid_nActivities"
    }
    if not [invalid_nActivities] {
      mutate {
        merge => {
          "security_result.detection_fields" => "nActivities_label"
        }
        on_error => "invalid_nActivities_label"
      }
    }
  }

  if [query] != "" {
    mutate {
      replace => {
        "query_label.key" => "query"
        "query_label.value" => "%{query}"
      }
      on_error => "invalid_query"
    }
    if not [invalid_query] {
      mutate {
        merge => {
          "security_result.detection_fields" => "query_label"
        }
        on_error => "invalid_query_label"
      }
    }
  }

  if [responseId] != "" {
    mutate {
      replace => {
        "responseId_label.key" => "responseId"
        "responseId_label.value" => "%{responseId}"
      }
      on_error => "invalid_responseId"
    }
    if not [invalid_responseId] {
      mutate {
        merge => {
          "security_result.detection_fields" => "responseId_label"
        }
        on_error => "invalid_responseId_label"
      }
    }
  }

  if [riskLevel] != "" {
    mutate {
      replace => {
        "riskLevel_label.key" => "riskLevel"
        "riskLevel_label.value" => "%{riskLevel}"
      }
      on_error => "invalid_riskLevel"
    }
    if not [invalid_riskLevel] {
      mutate {
        merge => {
          "security_result.detection_fields" => "riskLevel_label"
        }
        on_error => "invalid_riskLevel_label"
      }
    }
  }

  if [customer] != "" {
    mutate {
      replace => {
        "customer_label.key" => "customer"
        "customer_label.value" => "%{customer}"
      }
      on_error => "invalid_customer"
    }
    if not [invalid_customer] {
      mutate {
        merge => {
          "security_result.detection_fields" => "customer_label"
        }
        on_error => "invalid_customer_label"
      }
    }
  }

  if [endTimeUnix] != "" {
    mutate {
      convert => {
        "endTimeUnix" => "string"
      }
      on_error => "conversion_failure"
    }
    mutate {
      replace => {
        "endTimeUnix_label.key" => "endTimeUnix"
        "endTimeUnix_label.value" => "%{endTimeUnix}"
      }
      on_error => "invalid_endTimeUnix"
    }
    if not [invalid_endTimeUnix] {
      mutate {
        merge => {
          "security_result.detection_fields" => "endTimeUnix_label"
        }
        on_error => "invalid_endTimeUnix_label"
      }
    }
  }

  if [startTimeUnix] != "" {
    mutate {
      convert => {
        "startTimeUnix" => "string"
      }
      on_error => "conversion_failure"
    }
    mutate {
      replace => {
        "startTimeUnix_label.key" => "startTimeUnix"
        "startTimeUnix_label.value" => "%{startTimeUnix}"
      }
      on_error => "invalid_startTimeUnix"
    }
    if not [invalid_startTimeUnix] {
      mutate {
        merge => {
          "security_result.detection_fields" => "startTimeUnix_label"
        }
        on_error => "invalid_startTimeUnix_label"
      }
    }
  }

  if [endTimeISO8601] != "" {
    mutate {
      replace => {
        "endTimeISO8601_label.key" => "endTimeISO8601"
        "endTimeISO8601_label.value" => "%{endTimeISO8601}"
      }
      on_error => "invalid_endTimeISO8601"
    }
    if not [invalid_endTimeISO8601] {
      mutate {
        merge => {
          "security_result.detection_fields" => "endTimeISO8601_label"
        }
        on_error => "invalid_endTimeISO8601_label"
      }
    }
  }

  if [startTimeISO8601] != "" {
    mutate {
      replace => {
        "startTimeISO8601_label.key" => "startTimeISO8601"
        "startTimeISO8601_label.value" => "%{startTimeISO8601}"
      }
      on_error => "invalid_startTimeISO8601"
    }
    if not [invalid_startTimeISO8601] {
      mutate {
        merge => {
          "security_result.detection_fields" => "startTimeISO8601_label"
        }
        on_error => "invalid_startTimeISO8601_label"
      }
    }
  }

  if [lastSeenTimeUnix] != "" {
    mutate {
      convert => {
        "lastSeenTimeUnix" => "string"
      }
      on_error => "conversion_failure"
    }
    mutate {
      replace => {
        "lastSeenTimeUnix_label.key" => "lastSeenTimeUnix"
        "lastSeenTimeUnix_label.value" => "%{lastSeenTimeUnix}"
      }
      on_error => "invalid_lastSeenTimeUnix"
    }
    if not [invalid_lastSeenTimeUnix] {
      mutate {
        merge => {
          "security_result.detection_fields" => "lastSeenTimeUnix_label"
        }
        on_error => "invalid_lastSeenTimeUnix_label"
      }
    }
  }

  if [lastSeenTimeISO8601] != "" {
    mutate {
      replace => {
        "lastSeenTimeISO8601_label.key" => "lastSeenTimeISO8601"
        "lastSeenTimeISO8601_label.value" => "%{lastSeenTimeISO8601}"
      }
      on_error => "invalid_lastSeenTimeISO8601"
    }
    if not [invalid_lastSeenTimeISO8601] {
      mutate {
        merge => {
          "security_result.detection_fields" => "lastSeenTimeISO8601_label"
        }
        on_error => "invalid_lastSeenTimeISO8601_label"
      }
    }
  }

  if [lastMatchedTimeUnix] != "" {
    mutate {
      convert => {
        "lastMatchedTimeUnix" => "string"
      }
      on_error => "conversion_failure"
    }
    mutate {
      replace => {
        "lastMatchedTimeUnix_label.key" => "lastMatchedTimeUnix"
        "lastMatchedTimeUnix_label.value" => "%{lastMatchedTimeUnix}"
      }
      on_error => "invalid_lastMatchedTimeUnix"
    }
    if not [invalid_lastMatchedTimeUnix] {
      mutate {
        merge => {
          "security_result.detection_fields" => "lastMatchedTimeUnix_label"
        }
        on_error => "invalid_lastMatchedTimeUnix_label"
      }
    }
  }

  if [lastMatchedTimeISO8601] != "" {
    mutate {
      replace => {
        "lastMatchedTimeISO8601_label.key" => "lastMatchedTimeISO8601"
        "lastMatchedTimeISO8601_label.value" => "%{lastMatchedTimeISO8601}"
      }
      on_error => "invalid_lastMatchedTimeISO8601"
    }
    if not [invalid_lastMatchedTimeISO8601] {
      mutate {
        merge => {
          "security_result.detection_fields" => "lastMatchedTimeISO8601_label"
        }
        on_error => "invalid_lastMatchedTimeISO8601_label"
      }
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
