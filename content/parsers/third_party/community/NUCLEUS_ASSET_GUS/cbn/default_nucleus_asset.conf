# Product: Nucleus Asset
# Category: Nucleus Specific
# Supported Format: JSON
# Reference: https://support.nucleussec.com/hc/en-us/articles/360018053452-Creating-Custom-Scan-Files
# Last Updated: 2021-08-05
# Copyright 2021 Chronicle LLC


filter {
  mutate {
    replace => {
      "asset_tags" => ""
      "url_path" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
  }

  if [asset_id] != "" {
    mutate {
      replace => {
        "_asset_entity.asset.product_object_id" => "%{asset_id}"
      }
    }
  }

  if [asset_name] != "" {
    if [asset_name] =~ "http" {
      grok {
        match => {
          "asset_name" => "%{URIPROTO}?(://)?%{IPORHOST:asset_name}%{GREEDYDATA:url_path}"
        } overwrite => ["asset_name","url_path"]
      }
      if [url_path] != "" {
        mutate {
          replace => {
            "_asset_entity.url" => "%{url_path}"
          }
        }
      }
    }
    mutate {
      replace => {
        "_asset_entity.asset.hostname" => "%{asset_name}"
      }
    }
  }

  if [ip_address] != "" {
    mutate {
      merge => {
        "_asset_entity.asset.ip" => "ip_address"
      }
    }
  }

  if [host_score_total] != "" {
    mutate {
      replace => {
        "host_score_label.key" => "Host Score Total"
        "host_score_label.value" => "%{host_score_total}"
      }
    }
    mutate {
      merge => {
        "_asset_entity.asset.attribute.labels" => "host_score_label"
      }
    }
  }

  if [host_complianced_score] != "" {
    mutate {
      replace => {
        "host_complianced_score_label.key" => "Host Complianced Score"
        "host_complianced_score_label.value" => "%{host_complianced_score}"
      }
    }
    mutate {
      merge => {
        "_asset_entity.asset.attribute.labels" => "host_complianced_score_label"
      }
    }
  }

  if [host_data_sensitivity_score] != "" {
    mutate {
      replace => {
        "host_sensitivity_score_label.key" => "Host Data Sensitivity Score"
        "host_sensitivity_score_label.value" => "%{host_data_sensitivity_score}"
      }
    }
    mutate {
      merge => {
        "_asset_entity.asset.attribute.labels" => "host_sensitivity_score_label"
      }
    }
  }

  if [host_public] != "" {
    mutate {
      replace => {
        "host_public_label.key" => "Host Public"
        "host_public_label.value" => "%{host_public}"
      }
    }
    mutate {
      merge => {
        "_asset_entity.asset.attribute.labels" => "host_public_label"
      }
    }
  }

  if [asset_tags] != "" {
    # Converting string value to json array.
    mutate {
      replace => {
        "asset_tags" => "{\"asset_tags\":[\"%{asset_tags}\"]}"
      }
      gsub => ["asset_tags", ",", "\",\""]
    }
    json {
      source => "asset_tags"
      array_function => "split_columns"
    }
    for asset in asset_tags {
      mutate {
        replace => {
          "asset_key" => ""
          "asset_value" => ""
        }
      }
      grok {
        match => {
          "asset" => ["~~%{GREEDYDATA:asset_key}~~%{GREEDYDATA:asset_value}"
                      "~~%{GREEDYDATA:asset_key}"]
        }
        overwrite => ["asset_key","asset_value"]
      }
      mutate {
        replace => {
          "asset_tag_label" => ""
        }
      }
      mutate {
        replace => {
          "asset_tag_label.key" => "%{asset_key}"
          "asset_tag_label.value" => "%{asset_value}"
        }
      }
      mutate {
        merge => {
          "_asset_entity.asset.attribute.labels" => "asset_tag_label"
        }
      }
    }
  }

  mutate {
    replace => {
      "event.idm.entity.metadata.entity_type" => "ASSET"
      "event.idm.entity.metadata.product_name" => "Nucleus Unified Vulnerability Management"
      "event.idm.entity.metadata.vendor_name" => "NUCLEUS"
    }
  }

  if [_asset_entity] != "" {
    mutate {
      rename => {
        "_asset_entity" => "event.idm.entity.entity"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
