# Product: Cloudflare Gateway Network
# Category: Web Proxy
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-10-16
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "AccountID" => ""
      "Action" => ""
      "Datetime" => ""
      "DestinationIP" => ""
      "DestinationIPContinentCode" => ""
      "DestinationIPCountryCode" => ""
      "DestinationPort" => ""
      "DeviceID" => ""
      "DeviceName" => ""
      "Email" => ""
      "OverridePort" => ""
      "SessionID" => ""
      "SourceIP" => ""
      "SourceIPContinentCode" => ""
      "SourceIPCountryCode" => ""
      "SourcePort" => ""
      "Transport" => ""
      "TransportProtocol" => ""
      "UserID" => ""
      "VirtualNetworkID" => ""
      "VirtualNetworkName" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "intermediary" => ""
      "network" => ""
      "security_result" => ""
      "action" => ""
      "event_type" => ""
      "protocol_number_src" => ""
      "ip_protocol_out" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [Datetime] != "" {
    date {
      match => ["Datetime", "ISO8601", "RFC3339"]
      target => "metadata.event_timestamp"
      on_error => "invalid_datetime"
    }
  }

  if [AccountID] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{AccountID}"
      }
      on_error => "no_account_id"
    }
  }

  if [Action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{Action}"
      }
      on_error => "action_replace_error"
    }

    if [Action] in ["pass", "allow", "allowedOnNoRuleMatch", "allowedByRule"] {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
    } else if [Action] == "alert" {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
    } else if [Action] in ["drop", "block", "deny", "reject", "blockByRule"] {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    }

    if [action] != "" {
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "security_result_action_merge_error"
      }
    }
  }

  if [DestinationIP] != "" {
    grok {
      match => {
        "DestinationIP" => "%{IP:destination_ip}"
      }
      overwrite => ["destination_ip"]
      on_error => "destination_ip_grok_failure"
    }
    if ![destination_ip_grok_failure] {
      mutate {
        merge => {
          "target.ip" => "destination_ip"
          "target.asset.ip" => "destination_ip"
        }
        on_error => "no_destination_ip"
      }
      if ![no_destination_ip] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  if [DestinationIPContinentCode] not in ["", "NA"] {
    mutate {
      replace => {
        "dest_continent_label.key" => "DestinationIPContinentCode"
        "dest_continent_label.value" => "%{DestinationIPContinentCode}"
      }
      on_error => "dest_continent_replace_error"
    }
    if ![dest_continent_replace_error] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "dest_continent_label"
        }
        on_error => "dest_continent_merge_error"
      }
    }
  }

  if [DestinationIPCountryCode] != "" {
    mutate {
      replace => {
        "target.location.country_or_region" => "%{DestinationIPCountryCode}"
      }
      on_error => "no_destination_ip_country_code"
    }
  }

  mutate {
    convert => {
      "DestinationPort" => "string"
    }
    on_error => "destination_port_already_string"
  }
  if [DestinationPort] not in ["", "0"] {
    mutate {
      replace => {
        "target.port" => "%{DestinationPort}"
      }
      on_error => "no_destination_port"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "target_port_conversion_failure"
    }
  }

  if [DeviceID] not in ["", "N/A"] {
    mutate {
      replace => {
        "principal.asset_id" => "Device ID:%{DeviceID}"
        "principal.asset.asset_id" => "Device ID:%{DeviceID}"
      }
      on_error => "no_device_id"
    }
  }

  if [DeviceName] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{DeviceName}"
        "principal.asset.hostname" => "%{DeviceName}"
        "has_principal" => "true"
      }
      on_error => "invalid_devicename"
    }
  }

  if [Email] =~ "^.+@.+$" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "Email"
      }
      on_error => "no_email_address"
    }
    if ![no_email_address] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }

  mutate {
    convert => {
      "OverridePort" => "string"
    }
    on_error => "override_port_already_string"
  }
  if [OverridePort] not in ["", "0"] {
    mutate {
      replace => {
        "intermediary.port" => "%{OverridePort}"
      }
      on_error => "no_override_port"
    }
    mutate {
      convert => {
        "intermediary.port" => "integer"
      }
      on_error => "override_port_conversion_failure"
    }
  }

  if [SessionID] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{SessionID}"
      }
      on_error => "no_session_id"
    }
  }

  if [SourceIP] != "" {
    grok {
      match => {
        "SourceIP" => "%{IP:source_ip}"
      }
      overwrite => ["source_ip"]
      on_error => "source_ip_grok_failure"
    }
    if ![source_ip_grok_failure] {
      mutate {
        merge => {
          "principal.ip" => "source_ip"
          "principal.asset.ip" => "source_ip"
        }
        on_error => "no_source_ip"
      }
      if ![no_source_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [SourceIPContinentCode] not in ["", "NA"] {
    mutate {
      replace => {
        "src_continent_label.key" => "SourceIPContinentCode"
        "src_continent_label.value" => "%{SourceIPContinentCode}"
      }
      on_error => "src_continent_replace_error"
    }
    if ![src_continent_replace_error] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "src_continent_label"
        }
        on_error => "src_continent_merge_error"
      }
    }
  }

  if [SourceIPCountryCode] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{SourceIPCountryCode}"
      }
      on_error => "no_source_ip_country_code"
    }
  }

  mutate {
    convert => {
      "SourcePort" => "string"
    }
    on_error => "source_port_already_string"
  }
  if [SourcePort] not in ["", "0"] {
    mutate {
      replace => {
        "principal.port" => "%{SourcePort}"
      }
      on_error => "no_source_port"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "principal_port_conversion_failure"
    }
  }

  if [Transport] != "" {
    mutate {
      replace => {
        "protocol_number_src" => "%{Transport}"
      }
      on_error => "no_ip_protocol_name"
    }
  } else if [TransportProtocol] != "" {
    mutate {
      replace => {
        "protocol_number_src" => "%{TransportProtocol}"
      }
      on_error => "no_transport_protocol"
    }
  }
  if [protocol_number_src] != "" {
    mutate {
      uppercase => ["protocol_number_src"]
    }
    # This file contains the ip protocol convertor
# Document:
#   - https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml

# Interface:
# protocol_number_src (required): number with the value which represents the protocol
# ip_protocol_out: string that is either empty or contains ip protocol
#                  compatible to IpProtocol enum in udm.proto

mutate {
  replace => {
    "ip_protocol_out" => "UNKNOWN_IP_PROTOCOL"
  }
}


if [protocol_number_src] in [ 1, "ICMP", "ICMPV6", 58 ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ICMP"
    }
  }
} else if [protocol_number_src] in [ 2, "IGMP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "IGMP"
    }
  }
} else if [protocol_number_src] in [ 6, "TCP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "TCP"
    }
  }
} else if [protocol_number_src] in [ 17, "UDP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "UDP"
    }
  }
} else if [protocol_number_src] in [ 41, "IP6IN4" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "IP6IN4"
    }
  }
} else if [protocol_number_src] in [ 47, "GRE" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "GRE"
    }
  }
} else if [protocol_number_src] in [ 50, "ESP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ESP"
    }
  }
} else if [protocol_number_src] in [ 88, "EIGRP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "EIGRP"
    }
  }
}  else if [protocol_number_src] in [ 97, "ETHERIP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ETHERIP"
    }
  }
} else if [protocol_number_src] in [ 103, "PIM" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "PIM"
    }
  }
} else if [protocol_number_src] in [ 112, "VRRP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "VRRP"
    }
  }
}

    if [ip_protocol_out] != "" {
      mutate {
        replace => {
          "network.ip_protocol" => "%{ip_protocol_out}"
        }
        on_error => "no_ip_protocol"
      }
    }
  }

  if [UserID] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{UserID}"
        "has_principal_user" => "true"
      }
      on_error => "no_user_id"
    }
  }

  if [VirtualNetworkID] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{VirtualNetworkID}"
      }
      on_error => "no_virtual_network_id"
    }
  }

  if [VirtualNetworkName] != "" {
    mutate {
      replace => {
        "principal.resource.name" => "%{VirtualNetworkName}"
      }
      on_error => "no_virtual_network_name"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "no_event_type"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "Cloudflare"
      "metadata.product_name" => "Cloudflare Gateway Network"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
