    if ![no_resource_registry_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "resource_registry_label"
        }
        on_error => "resource_registry_label_merge_failed"
      }
    }
    mutate {
      replace => {
        "resource_repository_name_label.key" => "resource_repository_name_%{index}"
        "resource_repository_name_label.value" => "%{resource.details.awsEcrContainerImage.repositoryName}"
      }
      on_error => "no_resource_repository_name_label"
    }
    if ![no_resource_repository_name_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "resource_repository_name_label"
        }
        on_error => "resource_repository_name_label_merge_failed"
      }
    }
    mutate {
      convert => {
        "resource.details.awsEcrContainerImage.inUseCount" => "string"
      }
      on_error => "resource_in_use_count_conversion_failed"
    }
    mutate {
      replace => {
        "resource_in_use_count_label.key" => "resource_in_use_count_%{index}"
        "resource_in_use_count_label.value" => "%{resource.details.awsEcrContainerImage.inUseCount}"
      }
      on_error => "no_resource_in_use_count_label"
    }
    if ![no_resource_in_use_count_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "resource_in_use_count_label"
        }
        on_error => "resource_in_use_count_label_merge_failed"
      }
    }
    mutate {
      replace => {
        "resource_last_in_use_at_label.key" => "resource_last_in_use_at_%{index}"
        "resource_last_in_use_at_label.value" => "%{resource.details.awsEcrContainerImage.lastInUseAt}"
      }
      on_error => "no_resource_last_in_use_at_label"
    }
    if ![no_resource_last_in_use_at_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "resource_last_in_use_at_label"
        }
        on_error => "resource_last_in_use_at_label_merge_failed"
      }
    }
    mutate {
      replace => {
        "resource_pushed_at_label.key" => "resource_pushed_at_%{index}"
        "resource_pushed_at_label.value" => "%{resource.details.awsEcrContainerImage.pushedAt}"
      }
      on_error => "no_resource_pushed_at_label"
    }
    if ![no_resource_pushed_at_label] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "resource_pushed_at_label"
        }
        on_error => "resource_pushed_at_label_merge_failed"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result_merge"
    }
  }
  date {
    match => ["timestamp","ISO8601"]
    on_error => "no_timestamp"
  }
  date {
    match => ["msg.time","ISO8601"]
    on_error => "no_msg_timestamp"
  }
  if [xray_trace_id] != "" {
    mutate {
      replace => {
        "xray_trace_id_label.key" => "Xray Trace ID"
        "xray_trace_id_label.value.string_value" => "%{xray_trace_id}"
      }
      on_error => "no_xray_trace_id"
    }
    if ![no_xray_trace_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "xray_trace_id_label"
        }
        on_error => "no_xray_trace_id_merge"
      }
    }
  }
  mutate {
    replace => {
      "msg_xray_trace_id" => "%{msg.xray_trace_id}"
    }
    on_error => "no_msg_xray_trace_id"
  }
  if [msg_xray_trace_id] != "" {
    mutate {
      replace => {
        "msg_xray_trace_id_label.key" => "Xray Trace ID"
        "msg_xray_trace_id_label.value.string_value" => "%{msg_xray_trace_id}"
      }
      on_error => "no_msg_xray_trace_id"
    }
    if ![no_msg_xray_trace_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "msg_xray_trace_id_label"
        }
        on_error => "no_msg_xray_trace_id_merge"
      }
    }
  }
  if [requestId] != "" {
    mutate {
      replace => {
        "requestId_labels.key" => "requestId"
        "requestId_labels.value" => "%{requestId}"
      }
      on_error => "no_request_id"
    }
    if ![no_request_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "requestId_labels"
        }
        on_error => "no_request_id_merge"
      }
    }
  }
  if [logger] != "" {
    mutate {
      replace => {
        "logger_field.key" => "logger"
        "logger_field.value.string_value" => "%{logger}"
      }
      on_error => "logger_empty"
    }
    if ![logger_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "logger_field"
        }
        on_error => "logger_field_empty"
      }
    }
  }
  if [dst_url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{dst_url}"
      }
      on_error => "no_dst_url"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }
  if [resource_ancestors] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource_ancestors" => "resource_ancestors"
      }
      on_error => "resource_ancestors_merge_failed"
    }
  }
  if [vulnerabilities] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.vulns.vulnerabilities" => "vulnerabilities"
      }
      on_error => "vulnerabilities_empty"
    }
  }
  if [has_user] == "true" && [has_network] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_COMMUNICATION"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_host] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "AWS Inspector"
      "event.idm.read_only_udm.metadata.vendor_name" => "AWS Inspector"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
