# Product: Tenable ADS
# Category: Tenable Active Directory Security
# Supported Format: SYSLOG + KV
# Reference: https://docs.tenable.com/identity-exposure/Content/Admin/11a-Alerts/AlertDetails.htm
# Last Updated: 2026-03-19
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "hostname" => ""
      "alertid" => ""
      "domainname" => ""
      "msg_1" => ""
      "productname" => ""
      "adObject" => ""
      "eventId" => ""
      "ip" => ""
      "ts" => ""
      "messagetype" => ""
      "tenable_codename" => ""
      "AD_Reason_Codename" => ""
      "security_result" => ""
      "principal" => ""
      "target" => ""
      "intermediary" => ""
      "metadata" => ""
      "adObject_1" => ""
      "adObject_2" => ""
      "msg2" => ""
      "operating_system" => ""
      "operating_system_version" => ""
      "expiry_date" => ""
      "last_login_time" => ""
      "usnchanged" => ""
      "meta_description" => ""
      "PID" => ""
      "has_principal" => "false"
      "Cn" => ""
      "BadPwdCountThreshold" => ""
      "alert_name" => ""
      "severity" => ""
      "source_hostname" => ""
      "source_ip" => ""
      "dc_ip" => ""
      "dc_name" => ""
      "badpasswordtime" => ""
      "badpwdcount" => ""
      "ts_str" => ""
      "dn.CN" => ""
      "dn.OU" => ""
      "auth" => ""
      "has_principal_user" => "false"
      "has_target_user" => "false"
      "domain" => ""
      "TenableReasonId" => ""
      "method_data" => ""
      "about" => ""
      "whenchanged" => ""
      "user" => ""
      "username" => ""
      "process_image_name" => ""
      "process_name" => ""
      "shadow_copy_path" => ""
      "IOA_url" => ""
      "dc_ips" => ""
      "target_ip1" => ""
      "target_ip2" => ""
      "honey_account" => ""
      "tool" => ""
      "ntds_destination_path" => ""
      "impacted_users" => ""
      "PwdSprayingAccountNumberThreshold" => ""
      "TimeIntervalInMins" => ""
      "GuidAttack" => ""
    }
  }
  mutate {
    gsub => ["message","❌️" , ""]
  }
  mutate {
    gsub => ["message", "\\r\\n", " "]
  }

  grok {
    match => {
      "message" => [
        '(?<ts_str>%{MONTH}\\s+%{MONTHDAY}\\s+%{YEAR}\\s+%{TIME})\\s+%{DATA:hostname} %{DATA:productname}\\[%{INT:PID}\\]:\\s+\\\"%{INT:messagetype}\\\" \\\"%{INT:alertid}\\\" \\\"[^\\\"]*\\\" \\\"%{DATA:domainname}\\\" %{GREEDYDATA:msg_1}',
        '(?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{DATA:hostname} %{DATA:productname}\\[%{INT:PID}\\]:\\s+\\\"%{INT:messagetype}\\\" \\\"%{INT:alertid}\\\" \\\"%{DATA:domain} Forest\\\" \\\"%{DATA:domainname} Domain\\\" %{GREEDYDATA:msg_1}',
        '(?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{DATA:hostname} %{DATA} (?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{DATA} %{DATA:productname}\\[%{INT:PID}\\]: \\"%{INT:messagetype}\\" \\"%{INT:alertid}\\" \\"%{DATA:domain}\\" \\"%{DATA:domainname}\\" %{GREEDYDATA:msg_1}',
        '(?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{DATA:hostname} %{DATA:productname}\\[%{INT:PID}\\](:|)\\s+\\"%{INT:messagetype}\\" \\"%{INT:alertid}\\" \\"%{DATA:domain}\\" \\"%{DATA:domainname}\\" %{GREEDYDATA:msg_1}',
        '(?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{DATA:hostname} %{DATA:productname}\\[%{INT:PID}\\]:\\s+\\[%{GREEDYDATA:msg_1}\\] %{GREEDYDATA}',
        '(?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{DATA:hostname} %{DATA:productname}\\[%{INT:PID}\\]:\\s+\\"%{INT:messagetype}\\" \\"%{INT:alertid}\\" %{GREEDYDATA:msg_1}',
        '(?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{DATA:hostname} %{DATA:productname}\\[%{INT:PID}\\]:%{GREEDYDATA:msg_1}',
        "(?<ts_str>%{MONTH}\\s+%{MONTHDAY}(\\s+%{YEAR}|)\\s+%{TIME})\\s+%{NOTSPACE:hostname}"
      ]
    }
    overwrite => ["ts","ts_str","productname","PID","messagetype","alertid","hostname","domain","domainname","msg_1"]
    on_error => "grok_pattern_not_matched"
  }
  if [msg_1] != "" {
    grok {
      match => {
        "msg_1" => [
          '\\"%{DATA:alert_name}\\" \\"%{DATA:severity}\\" \\"%{DATA:hostname1}\\" \\"(%{IP:src_ip}|Unknown|Data not available|localhost)\\" \\"%{DATA:target_hostname}\\" \\"(%{IP:target_ip1}, %{IP:target_ip2}|%{IP:target_ip}|Unknown|Data not available|localhost)\\" %{GREEDYDATA:kv_msg}',
          '\\"%{DATA:alert_name}\\" \\"%{DATA:severity}\\" \\"%{DATA}\\" \\"%{DATA}\\" \\"%{IP:src_ip}\\" %{GREEDYDATA:kv_msg}'
        ]
      }
      overwrite => ["alert_name","severity","hostname1","src_ip","target_hostname","target_ip","kv_msg", "target_ip1", "target_ip2"]
      on_error => "msg_1_grok_not_matched_main"
    }
  }
  mutate {
    gsub => ["kv_msg", '\\"', ""]
  }
  mutate {
    gsub => ["kv_msg","([a-zA-Z0-9_]+)=","#$1="]
  }
  kv {
    source => "kv_msg"
    field_split => "#"
    value_split => "="
    on_error => "kv_msg_split_failed"
  }
  if [domain] != "" {
    mutate {
      replace => {
        "domain_label.key" => "domain"
        "domain_label.value.string_value" => "%{domain}"
      }
      on_error => "domain_not_present"
    }
    if ![domain_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "domain_label"
        }
        on_error => "domain_merge_failed"
      }
    }
  }
  if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
        "has_principal_user" => "true"
      }
      on_error => "user_not_present"
    }
  }
  if [username] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{username}"
        "has_principal_user" => "true"
      }
      on_error => "username_not_present"
    }
  }
  if [process_image_name] != "" {
    mutate {
      replace => {
        "principal.process.file.full_path" => "%{process_image_name}"
      }
      on_error => "process_image_name_not_present"
    }
  }
  if [process_name] != "" {
    mutate {
      replace => {
        "target.process.file.full_path" => "%{process_name}"
      }
      on_error => "process_name_not_present"
    }
  }
  if [shadow_copy_path] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{shadow_copy_path}"
      }
      on_error => "shadow_copy_path_not_present"
    }
  }
  if [IOA_url] != "" {
    mutate {
      replace => {
        "metadata.url_back_to_product" => "%{IOA_url}"
      }
      on_error => "IOA_url_merge_failed"
    }
  }
  if [Cn] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{Cn}"
        "has_target_user" => "true"
      }
      on_error => "cn_not_present"
    }
  }
  if [BadPwdCountThreshold] != "" {
    mutate {
      replace => {
        "BadPwdCountThreshold_label.key" => "BadPwdCountThreshold"
        "BadPwdCountThreshold_label.value" => "%{BadPwdCountThreshold}"
      }
      on_error => "BadPwdCountThreshold_not_present"
    }
    if ![BadPwdCountThreshold_not_present] {
      mutate {
        merge => {
          "security_result.detection_fields" => "BadPwdCountThreshold_label"
        }
        on_error => "BadPwdCountThreshold_merge_failed"
      }
    }
  }
  if [alert_name] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{alert_name}"
      }
      on_error => "alert_name_not_present"
    }
  }
  if [source_ip] not in ["", "-", "Unknown", "Data not available", "localhost"] {
    mutate {
      merge => {
        "principal.ip" => "source_ip"
        "principal.asset.ip" => "source_ip"
      }
      on_error => "source_ip_not_present"
    }
    if ![source_ip_not_present] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [dc_ip] != "" {
    mutate {
      split => {
        source => "dc_ip"
        separator => ","
        target => "dc_ips"
        on_error => "dc_ip_split_failed"
      }
    }
    for dcip_val in dc_ips {
      mutate {
        replace => {
          "temp_dcip" => "%{dcip_val}"
        }
        on_error => "temp_dcip_empty"
      }
      grok {
        match => {
          "temp_dcip" => "%{IP:temp_dcip}"
        }
        overwrite => ["temp_dcip"]
        on_error => "dcip_grok_not_matched"
      }
      if ![dcip_grok_not_matched] {
        mutate {
          merge => {
            "target.ip" => "temp_dcip"
            "target.asset.ip" => "temp_dcip"
          }
          on_error => "dc_ip_not_present"
        }
      }
    }
  }
  if [honey_account] != "" and [honey_account] =~ "^S-\\\\d-(\\\\d+-){1,14}\\\\d+$" {
    mutate {
      replace => {
        "target.user.windows_sid" => "%{honey_account}"
        "has_target_user" => "true"
      }
      on_error => "honey_account_not_present"
    }
  }
  if [tool] != "" {
    mutate {
      replace => {
        "tool_label.key" => "tool"
        "tool_label.value.string_value" => "%{tool}"
      }
      on_error => "tool_not_present"
    }
    if ![tool_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tool_label"
        }
        on_error => "tool_merge_failed"
      }
    }
  }
  if [ntds_destination_path] != "" {
    mutate {
      replace => {
        "ntds_destination_path_label.key" => "ntds_destination_path"
        "ntds_destination_path_label.value.string_value" => "%{ntds_destination_path}"
      }
      on_error => "ntds_destination_path_not_present"
    }
    if ![ntds_destination_path_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "ntds_destination_path_label"
        }
        on_error => "ntds_destination_path_merge_failed"
      }
    }
  }
  if [dc_name] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{dc_name}"
        "target.asset.hostname" => "%{dc_name}"
      }
      on_error => "dc_name_not_present"
    }
  }
  if [grok_pattern_not_matched] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [ts_str] != "" {
    date {
      match => ["ts_str", "MMM dd yyyy HH:mm:ss"]
      on_error => "ts_str_date_failed"
    }
    if [ts_str_date_failed] {
      date {
        match => ["ts_str", "MMM d HH:mm:ss"]
        rebase => true
        on_error => "ts_str_date_failed"
      }
    }
  } else if [ts] != "" {
    date {
      match => ["ts", "MMM d HH:mm:ss"]
      rebase => true
      on_error => "diff_format"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{hostname}"
        "intermediary.asset.hostname" => "%{hostname}"
      }
      on_error => "hostname_not_present"
    }
  }
  if [source_hostname] not in ["", "-", "Unknown"] {
    mutate {
      replace => {
        "principal.hostname" => "%{source_hostname}"
        "principal.asset.hostname" => "%{source_hostname}"
        "has_principal" => "true"
      }
      on_error => "source_hostname_not_present"
    }
  }
  if [PID] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{PID}"
      }
      on_error => "PID_not_present"
    }
  }
  if [domainname] != "" {
    mutate {
      replace => {
        "principal.administrative_domain" => "%{domainname}"
      }
      on_error => "domain_not_present"
    }
  }
  if [msg_1] != "" {
     mutate{
      gsub => ["msg_1", '\\"', ""]
    }
    grok {
      match => {
        "msg_1" => [
          "^(?P<adObject>.*) (?P<eventId>\\d+) (?P<meta_description>Account locked) whenchanged=%{GREEDYDATA:whenchanged}",
          "%{DATA:adObject} %{INT:eventId} %{DATA:meta_description} badpasswordtime=\\\\%{DATA:badpasswordtime}\\\\",
          "%{DATA:adObject} %{INT:eventId} %{DATA:meta_description} badpwdcount=%{INT:badpwdcount}",
          "%{DATA:adObject} %{INT:eventId} %{DATA:meta_description} dnsrecord=\\[{RecordType:%{INT},Data:%{IP:ip}}]",
          "%{DATA:tenable_codename} %{DATA:severity} %{DATA:adObject} %{INT:eventId} %{INT} %{DATA:AD_Reason_Codename} %{INT:TenableReasonId} %{GREEDYDATA:msg2}",
          "%{DATA:adObject} %{INT:eventId} %{DATA:meta_description} usnchanged=%{INT:usnchanged}",
          "%{DATA:adObject} %{INT:eventId} %{DATA:meta_description} member=\\[%{GREEDYDATA:method_data}\\]",
          "%{DATA:adObject} %{INT:eventId}",
          "(?P<adObject>^CN.*)",
          "(?P<adObject>^DC.*)"
        ]
      }
      overwrite => ["adObject","eventId", "meta_description", "usnchanged", "ip", "tenable_codename","AD_Reason_Codename", "msg2", "badpasswordtime", "badpwdcount", "method_data", "severity", "TenableReasonId", "whenchanged"]
      on_error => "msg_1_grok_not_matched"
    }
    if [method_data] != "" {
      mutate {
        replace => {
          "cn_data" => ""
        }
      }
      kv {
        source => "method_data"
        field_split => ","
        value_split => "="
        on_error => "method_data_split_failed"
      }
      mutate {
        replace => {
          "cn_data" => "%{CN}"
        }
        on_error => "cn_data_not_present"
      }
      if [cn_data] != "" {
        mutate {
          gsub => ["cn_data", "\\\\\\\\#", ""]
        }
        mutate {
          replace => {
            "about.user.userid" => "%{cn_data}"
          }
          on_error => "cn_data_is_empty"
        }
      }
    }
    if [adObject] != "" {
      mutate {
        gsub => ["adObject", "\\\\\\\\", ""]
      }
      mutate {
        merge => {
          "target.user.group_identifiers" => "adObject"
        }
        on_error => "dc_merge_failed"
      }
      kv {
        source => "adObject"
        field_split => ","
        value_split => "="
        target => "dn"
        on_error => "adObject_split_failed"
      }
      if ![adObject_split_failed] {
        if [dn][CN] != "" {
          mutate {
            gsub => ["dn.CN", "\\\\#", ""]
          }
          mutate {
            replace => {
              "principal.user.userid" => "%{dn.CN}"
              "has_principal_user" => "true"
            }
            on_error => "adObject_cn_not_present"
          }
        }
        if [dn][OU] != "" {
          mutate {
            merge => {
              "target.user.department" => "dn.OU"
            }
            on_error => "ou_merge_failed"
          }
        }
      }
    }
    if [badpasswordtime] != "" {
      mutate {
        replace => {
          "additional_badpasswordtime.key" => "badpasswordtime"
          "additional_badpasswordtime.value.string_value" => "%{badpasswordtime}"
        }
        on_error => "additional_badpasswordtime_failed"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_badpasswordtime"
        }
        on_error => "merge_additional_badpasswordtime_failed"
      }
    }
    if [badpwdcount] != "" {
      mutate {
        replace => {
          "additional_badpwdcount.key" => "badpwdcount"
          "additional_badpwdcount.value.string_value" => "%{badpwdcount}"
        }
        on_error => "additional_badpwdcount_failed"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_badpwdcount"
        }
        on_error => "merge_additional_badpwdcount_failed"
      }
    }
    if [whenchanged] != "" {
      date {
        match => ["whenchanged", "yyyy-MM-ddTHH:mm:ss.SSSSSSSZ", "ISO8601"]
        target => "security_result.last_updated_time"
        on_error => "whenchanged_date_parse_failed"
      }
    }
  }

  if [msg2] != "" {
    grok {
      match => {
        "msg2" => [
          "AccountCn=%{DATA:AccountCn} GroupCn=%{DATA:GroupCn} LimitMemberCount=%{INT:LimitMemberCount} PrivilegesPath=%{DATA:PrivilegesPath} ParentContainer=%{NOTSPACE:ParentContainer}",
          "GroupCn=%{DATA:GroupCn} GroupMemberCount=%{INT:GroupMemberCount} LimitMemberCount=%{INT:LimitMemberCount}",
          "%{DATA:adObject_1} -> %{GREEDYDATA:adObject_2}",
          "%{DATA:adObject_1} %{DATA}=\\[%{GREEDYDATA}\\] %{GREEDYDATA:adObject_2}",
          "ComputerCn=%{DATA:ComputerCn} OperatingSystem=%{DATA:operating_system} OperatingSystemVersion=%{DATA:operating_system_version} ExpiryDate=%{DATA:expiry_date} LastLogonTimestamp=%{TIMESTAMP_ISO8601:last_login_time}%{GREEDYDATA}",
          "OperatingSystem=%{DATA:operating_system} OperatingSystemVersion=%{DATA:operating_system_version} ",
          "AccountList=%{DATA:AccountList} AccountSidList=%{DATA:AccountSidList} PasswordHashPrefix=%{NOTSPACE:PasswordHashPrefix}"
        ]
      }
      overwrite => ["adObject_1", "ComputerCn", "adObject_2", "operating_system", "operating_system_version", "expiry_date", "last_login_time", "AccountCn", "GroupCn", "LimitMemberCount", "PrivilegesPath", "ParentContainer", "GroupMemberCount", "AccountList", "AccountSidList", "PasswordHashPrefix"]
      on_error => "msg2_grok_not_matched"
    }
  }
  if [adObject_1] != "" && [adObject_1] =~ "^(.){1,255}$" {
    mutate {
      merge => {
        "principal.user.group_identifiers" => "adObject_1"
      }
      on_error => "adObject_1_not_present"
    }
  }
  if [adObject_2] != "" && [adObject_2] =~ "^(.){1,255}$" {
    mutate {
      merge => {
        "principal.user.group_identifiers" => "adObject_2"
      }
      on_error => "adObject_2_not_present"
    }
  }
  if [adObject] != "" && [adObject] =~ "^(.){1,255}$" {
    if [badpwdcount] == "" and [badpasswordtime] == "" {
      mutate {
        merge => {
          "principal.user.group_identifiers" => "adObject"
        }
        on_error => "adObject_not_present"
      }
    }
  }
  if [eventId] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{eventId}"
      }
      on_error => "eventId_not_present"
    }
  }
  if [meta_description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{meta_description}"
      }
      on_error => "meta_description_empty"
    }
  }
  if [operating_system] != "" {
    if [operating_system] =~ "Windows" {
      mutate {
        replace => {
          "principal.asset.platform_software.platform" => "WINDOWS"
        }
      }
    }
    if [operating_system] =~ "Linux" {
      mutate {
        replace => {
          "principal.asset.platform_software.platform" => "LINUX"
        }
      }
    }
    if [operating_system] =~ "Mac" {
      mutate {
        replace => {
          "principal.asset.platform_software.platform" => "MAC"
        }
      }
    }
  }
  if [operating_system_version] != "" {
    mutate {
      replace => {
        "principal.asset.platform_software.platform_version" => "%{operating_system_version}"
      }
      on_error => "operating_system_version_not_present"
    }
  }
  if [last_login_time] != "" {
    date {
      match => ["last_login_time", "yyyy-MM-ddTHH:mm:ss.SSSSSSSZ","ISO8601"]
      target => "principal.user.last_login_time"
      on_error => "invalid_last_login_time"
    }
  }
  if [ip] != "" {
    grok {
      match => {
        "ip" => ["%{IP:ip_val}"]
      }
      on_error => "not_a_ip"
    }
    if ![not_a_ip] {
      mutate {
        merge => {
          "principal.ip" => "ip"
          "principal.asset.ip" => "ip"
        }
        on_error => "ip_not_present"
      }
      if ![ip_not_present] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  mutate {
    rename => {
      "messagetype" => "addition.messagetype"
      "alertid" => "addition.alertid"
      "tenable_codename" => "addition.tenable_codename"
      "AD_Reason_Codename" => "addition.AD_Reason_Codename"
      "expiry_date" => "addition.expiry_date"
      "usnchanged" => "addition.usnchanged"
      "AccountCn" => "addition.AccountCn"
      "GroupCn" => "addition.GroupCn"
      "LimitMemberCount" => "addition.LimitMemberCount"
      "PrivilegesPath" => "addition.PrivilegesPath"
      "ParentContainer" => "addition.ParentContainer"
      "GroupMemberCount" => "addition.GroupMemberCount"
      "ComputerCn" => "addition.ComputerCn"
      "AccountList" => "addition.AccountList"
      "AccountSidList" => "addition.AccountSidList"
      "PasswordHashPrefix" => "addition.PasswordHashPrefix"
      "TenableReasonId" => "addition.TenableReasonId"
      "PwdSprayingAccountNumberThreshold" => "addition.PwdSprayingAccountNumberThreshold"
      "TimeIntervalInMins" => "addition.TimeIntervalInMins"
      "GuidAttack" => "addition.GuidAttack"
    }
  }
  if [impacted_users] != "" {
    mutate {
      gsub => ["impacted_users", ",\\s+", ","]
    }
    mutate {
      gsub => ["impacted_users", ',', '\",\"']
    }
    mutate {
      replace => {
        "impacted_users" => "{\"impacted_users_list\":[\"%{impacted_users}\"]}"
      }
      on_error => "no_message_impacted_users"
    }
    json {
      source => "impacted_users"
      array_function => "split_columns"
      on_error => "no_message_impacted_users"
    }
    if ![no_message_impacted_users] {
      for impuser in impacted_users_list {
        mutate {
          replace => {
            "imp_user_field" => ""
          }
        }
        mutate {
          replace => {
            "imp_user_field.key" => "impacted_users"
            "imp_user_field.value" => "%{impuser}"
          }
          on_error => "imp_user_field_failed"
        }
        if ![imp_user_field_failed] {
          mutate {
            merge => {
              "security_result.detection_fields" => "imp_user_field"
            }
            on_error => "imp_user_field_merge_failed"
          }
        }
      }
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
      }
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [value] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
      }
      if [key] in ["tenable_codename", "AD_Reason_Codename", "expiry_date" ] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }
  if [meta_description] != "" {
    if [meta_description] in ["Failed authentication","Failed auth reset"] {
      mutate {
        replace => {
          "sec_action" => "FAIL"
        }
      }
    }
    else if [meta_description] == "Account locked"  {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }
    mutate {
      merge => {
        "security_result.action" => "sec_action"
      }
      on_error => "merge_action_failed"
    }
  }
  if [has_principal] == "true" and ([has_principal_user] == "true" or [has_target_user] == "true") {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal_user] == "true" or [has_target_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "Tenable"
      "metadata.product_name" => "%{productname}"
    }
    on_error => "product_name_missing"
  }
  if [severity] != "" {
    mutate {
      uppercase => ["severity"]
    }
    mutate {
      replace => {
        "security_result.severity" => "%{severity}"
      }
      on_error => "severity_not_present"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [auth] != "" {
    mutate {
      rename => {
        "auth" => "event.idm.read_only_udm.extensions.auth"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_not_found"
    }
  }
  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_not_found"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
