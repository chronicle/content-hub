# Google SecOps Default CBN Parser (CLAM_AV)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/CLAM_AV/default/clam_av.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "CLAM"
      "event.idm.read_only_udm.metadata.product_name" => "CLAM_AV"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
