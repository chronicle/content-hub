# Product: ClamAV
# Category: AV / Endpoint
# Supported Format: JSON
# Reference: See below
# Last Updated: 2022-02-07
# Copyright 2022 Chronicle LLC


# Additional references:
# - https://docs.pivotal.io/addon-antivirus/1-4/monitoring-logs.html#format
# - https://www.clamav.net/documents/clam-antivirus-user-manual

filter {
  mutate {
    replace => {
      "threat" => ""
      "file" => ""
      "total_files" => ""
      "category" => ""
      "action" => ""
      "_security_result" => ""
      "_target" => ""
      "_principal" => ""
      "_observer" => ""
      "_metadata" => ""
      "severity" => ""
    }
  }

  json {
    source => "message"
    target => "parsed_msg"
    array_function => "split_columns"
  }

  date { match => ["parsed_msg.timestamp","RFC3339", "ISO8601"] }

  mutate {
    replace => {
      "_metadata.vendor_name" => "Cisco Systems"
      "_metadata.product_name" => "CLAMAV"
      "_metadata.product_log_id" => "%{parsed_msg.insertId}"
      "_metadata.description" => "%{parsed_msg.logName}"
    }
  }

  mutate {
    replace => {
      "_observer.resource.name" => "%{parsed_msg.labels.compute.googleapis.com/resource_name}"
      "_observer.resource.id" => "%{parsed_msg.resource.labels.instance_id}"
      "_observer.resource.type" => "%{parsed_msg.resource.type}/%{parsed_msg.labels.container.googleapis.com/stream}"
    }
    on_error => "no_resource"
  }

  mutate {
    replace => {
      "_observer.hostname" => "%{parsed_msg.resource.labels.project_id}/%{parsed_msg.resource.labels.cluster_name}/%{parsed_msg.resource.labels.container_name}"

      # Required by udm2sdm validation - bug suggested to SCAN_FILE
      "_principal.hostname" => "%{parsed_msg.resource.labels.project_id}/%{parsed_msg.resource.labels.cluster_name}/%{parsed_msg.resource.labels.container_name}"
    }
    on_error => "no_hostname"
  }

  mutate {
    replace => {
      "_observer.application" => "%{parsed_msg.resource.labels.container_name}"
    }
    on_error => "no_application"
  }

  mutate {
    replace => {
      "_observer.namespace" => "%{parsed_msg.labels.container.googleapis.com/namespace_name}"
    }
    on_error => "no_namespace"
  }

  mutate {
    replace => {
      "_observer.location.country_or_region" => "%{parsed_msg.resource.labels.zone}"
    }
    on_error => "no_available_zone"
  }

  mutate {
    replace => {
      "pod_id" => "%{parsed_msg.resource.labels.pod_id}"
    }
    on_error => "no_pod_id"
  }
  if ![no_pod_id] {
    mutate {
      replace => {
        "pod_id_label.key" => "pod_id"
        "pod_id_label.value" => "%{parsed_msg.resource.labels.pod_id}"
      }
    }
    mutate {
      merge => {
        "_observer.labels" => "pod_id_label"
      }
    }
  }

  grok {
    match => {
      "parsed_msg.textPayload" => [
        "%{DATA:file}: %{DATA:threat} FOUND"
      ]
    }
    overwrite => ["file", "threat"]
    on_error => "no_parsing_found_virus"
  }

  if ![no_parsing_found_virus] {
    mutate {
      replace => {
        "_metadata.event_type" => "SCAN_FILE"
        "_target.file.full_path" => "%{file}"
        "_security_result.threat_name" => "%{threat}"
      }
    }
  }

  grok {
      match => {
        "parsed_msg.textPayload" => [
          "Infected files: %{GREEDYDATA:num_files}"
        ]
      }
      on_error => "no_infected_result_found"
  }

  if ![no_infected_result_found] {
    mutate {
      replace => {
        "_metadata.event_type" => "STATUS_UPDATE"
        "total_files" => "%{num_files}"
      }
    }
    mutate {
      convert => {
        "num_files" => "integer"
      }
    }
  }

  mutate {
    replace => {
      "_security_result.summary" => "%{total_files} infected files found."
    }
  }

  if [no_infected_result_found] and [no_parsing_found_virus] {
    grok {
      match => {
        "parsed_msg.textPayload" => "(?P<_file_path>/\\S+):\\s(?P<_outcome>.*?)\\n$"
      }
      on_error => "_no_file_path"
    }

    if [_no_file_path] {
      drop{}
    }

    mutate {
      replace => {
        "_metadata.event_type" => "SCAN_FILE"
        "_target.file.full_path" => "%{_file_path}"
        "_security_result.summary" => "File scanned. (%{_outcome})"
        "action" => "ALLOW"
      }
    }
    mutate {
      merge => {
            "_security_result.action" => "action"
        }
    }
  }

  if [threat] != "" {
    mutate {
        replace => {
          "category" => "SOFTWARE_MALICIOUS"
          "action" => "BLOCK"
        }
      }
    mutate {
      merge => {
            "_security_result.category" => "category"
            "_security_result.action" => "action"
        }
    }
    mutate {
        replace => {
          "_security_result.summary" => "Threat %{threat} signature found."
        }
    }
  }

  if [_metadata] != "" {
    mutate {
      rename => {
        "_metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [_target] != "" {
    mutate {
      rename => {
        "_target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [_principal] != "" {
    mutate {
      rename => {
        "_principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [_observer] != "" {
    mutate {
      rename => {
        "_observer" => "event.idm.read_only_udm.observer"
      }
    }
  }

  if [_security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "_security_result"
      }
    }
  }

  mutate {
      merge => {
          "@output" => "event"
      }
  }
}
