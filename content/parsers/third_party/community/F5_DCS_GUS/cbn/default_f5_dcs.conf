# Google SecOps Default CBN Parser (F5_DCS)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/F5_DCS/default/f5_dcs.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "F5"
      "event.idm.read_only_udm.metadata.product_name" => "F5_DCS"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
