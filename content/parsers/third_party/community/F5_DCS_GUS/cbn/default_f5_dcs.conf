# Category: SaaS Applications
# Supported Format: JSON
# Reference: NA
# Last Updated: 2026-04-01
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "timestamp" => ""
      "_id" => ""
      "_visitor_id" => ""
      "security_result" => ""
      "action" => ""
      "api_endpoint" => ""
      "app" => ""
      "app_firewall_name" => ""
      "app_type" => ""
      "as_number" => ""
      "authority" => ""
      "x_forwarded_for" => ""
      "vhost_id" => ""
      "vh_name" => ""
      "tls_fingerprint" => ""
      "time" => ""
      "src_ip" => ""
      "host" => ""
      "hostname" => ""
      "src_port" => ""
      "src_site" => ""
      "site" => ""
      "sample_rate" => ""
      "sni" => ""
      "stream" => ""
      "src_instance" => ""
      "user" => ""
      "req_headers" => ""
      "req_size" => ""
      "rsp_code" => ""
      "rsp_code_class" => ""
      "rsp_code_details" => ""
      "rsp_size" => ""
      "rtt_downstream_seconds" => ""
      "rtt_upstream_seconds" => ""
      "original_path" => ""
      "req_headers_size" => ""
      "recommended_action" => ""
      "enforcement_mode" => ""
      "cloned_id" => ""
      "connected_time" => ""
      "country" => ""
      "dst" => ""
      "dst_ip" => ""
      "dst_port" => ""
      "bot_info" => ""
      "cluster_name" => ""
      "domain" => ""
      "dst_site" => ""
      "duration_with_no_data_tx_delay" => ""
      "method" => ""
      "namespace" => ""
      "node_id" => ""
      "original_authority" => ""
      "city" => ""
      "sec_event_name" => ""
      "sec_event_type" => ""
      "req_params" => ""
      "Cookie" => ""
      "X-F5-Request-Id" => ""
      "X-Request-Id" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_network" => "false"
      "bot_info.classification" => ""
      "visitor_id" => ""
      "http_version" => ""
      "as_org" => ""
      "asn" => ""
      "kubernetes.pod_id" => ""
      "kubernetes.pod_name" => ""
      "latitude" => ""
      "longitude" => ""
      "messageid" => ""
      "violation_rating" => ""
      "region" => ""
      "tag" => ""
      "req_path" => ""
      "terminated_time" => ""
      "time_to_first_downstream_tx_byte" => ""
      "time_to_first_upstream_rx_byte" => ""
      "time_to_first_upstream_tx_byte" => ""
      "time_to_last_downstream_tx_byte" => ""
      "time_to_last_rx_byte" => ""
      "time_to_last_upstream_rx_byte" => ""
      "time_to_last_upstream_tx_byte" => ""
      "timeseries_enabled" => ""
      "network" => ""
      "kubernetes.namespace_name" => ""
      "user_id" => ""
      "user_ip" => ""
      "policy_hit.malicious_user_mitigate_action" => ""
      "policy_hit.policy" => ""
      "policy_hit.policy_namespace" => ""
      "policy_hit.policy_rule" => ""
      "policy_hit.policy_rule_description" => ""
      "policy_hit.policy_set" => ""
      "policy_hit.result" => ""
      "sec_result_action" => ""
      "severity" => ""
      "Authorization" => ""
      "intermediary" => ""
      "kubernetes_container_name" => ""
      "kubernetes_host" => ""
      "kubernetes_labels_app" => ""
      "bot_info_type" => ""
      "bot_info_name" => ""
      "waf_mode" => ""
      "tenant" => ""
      "bot_info_classification" => ""
      "src" => ""
      "logtype" => ""
      "ip" => ""
      "jsonData" => ""
      "request_headers" => ""
      "accept" => ""
      "browser_type" => ""
      "connection_state" => ""
      "device_type" => ""
      "dst_instance" => ""
      "content-type" => ""
      "duration_with_data_tx_delay" => ""
      "ja4_tls_fingerprint" => ""
      "lb_port" => ""
      "mtls" => ""
      "policy_hits_ip_risk" => ""
      "policy_hits_ip_trustscore" => ""
      "policy_hits_ip_trustworthiness" => ""
      "protocol" => ""
      "proxy_type" => ""
      "referer" => ""
      "response_flags" => ""
      "rsp_headers" => ""
      "scheme" => ""
      "tls_cipher_suite" => ""
      "tls_version" => ""
      "user_agent" => ""
      "vh_type" => ""
      "waf_action" => ""
      "req_id" => ""
      "xff_ip" => ""
      "xff_ip2" => ""
      "client_ip" => ""
      "x_forwarded_for_ip" => ""
      "has_sec_event" => ""
    }
  }
  mutate {
    gsub => ["message", "@timestamp","timestamp"]
  }
  mutate {
    gsub => ["message", "_visitor_id","visitor_id"]
  }
  mutate {
    gsub => ["message", "_cloned_id","cloned_id"]
  }
  mutate {
    gsub => ["message", "\\r", ""]
  }
  mutate {
    gsub => ["message", "\\n", ""]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "invalid_json"
  }
  if [invalid_json] {
    grok {
      match => {
        "message" => [
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp}\\s+%{HOSTNAME:logtype}\\s+%{DATA:user}\\s+%{TIMESTAMP_ISO8601:time}\\s+%{IP:ip}%{GREEDYDATA:jsonData}"        ]
      }
      overwrite => ["timestamp", "logtype", "user", "time", "ip", "jsonData"]
      on_error => "grok_json_error"
    }
    if ![grok_json_error] {
      mutate {
        gsub => [jsonData, '\\\\\\"', '"']
      }
      mutate {
        gsub => [jsonData, '\\"', '"']
      }
      mutate {
        gsub => [jsonData, '"{"', '{"']
      }
      mutate {
        gsub => [jsonData, '"}"', '"}']
      }
      mutate {
        gsub =>  [jsonData, "req_headers", "request_headers"]
      }
    }
    json {
      source => "jsonData"
      array_function => "split_columns"
      on_error => "jsonData_failed"
    }
    if [jsonData_failed] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  if [waf_mode] != "" {
    mutate {
      replace => {
        "waf_mode_label.key" => "waf_mode"
        "waf_mode_label.value" => "%{waf_mode}"
      }
      on_error => "waf_mode_mapping_error"
    }
    if ![waf_mode_mapping_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "waf_mode_label"
        }
        on_error => "waf_mode_merging_error"
      }
    }
  }
  if [tenant] != "" {
    mutate {
      replace => {
        "tenant_label.key" => "tenant"
        "tenant_label.value" => "%{tenant}"
      }
      on_error => "tenant_mapping_error"
    }
    if ![tenant_mapping_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "tenant_label"
        }
        on_error => "tenant_merging_error"
      }
    }
  }
  if [src] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.namespace" => "%{src}"
      }
      on_error => "src_mapping_error"
    }
  }
  mutate {
    replace => {
      "kubernetes_labels_app" => "%{kubernetes.labels.app}"
    }
    on_error => "kubernetes_labels_app_not_mapped"
  }

  if [kubernetes_labels_app] != "" {
    mutate {
      replace => {
      "app_label.key" => "app"
      "app_label.value" => "%{kubernetes_labels_app}"
      }
      on_error => "app_not_mapped"
    }
    if ![app_not_mapped] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "app_label"
        }
        on_error => "app_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "kubernetes_host" => "%{kubernetes.host}"
    }
    on_error => "kubernetes_host_not_mapped"
  }
  if [kubernetes_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{kubernetes_host}"
      }
      on_error => "target_hostname_host_not_mapped"
    }
    if ![target_hostname_host_not_mapped] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [app] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{app}"
      }
      on_error => "app_target_app_not_mapped"
    }
  }
  mutate {
    replace => {
      "kubernetes_container_name" => "%{kubernetes.container_name}"
    }
    on_error => "kubernetes_container_name_not_mapped"
  }
  if [kubernetes_container_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{kubernetes_container_name}"
      }
      on_error => "container_name_not_mapped"
    }
  }
  mutate {
    replace => {
      "bot_info_classification" => "%{bot_info.classification}"
    }
    on_error => "bot_info_classification_not_mapped_replace"
  }

  if [bot_info_classification] != "" {
    mutate {
      replace => {
        "bot_info_classification_label.key" => "bot_info_classification"
        "bot_info_classification_label.value" => "%{bot_info_classification}"
      }
      on_error => "bot_info_classification_not_mapped"
    }
    if ![bot_info_classification_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "bot_info_classification_label"
        }
        on_error => "bot_info_classification_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "bot_info_name" => "%{bot_info.name}"
    }
    on_error => "bot_info_name_not_mapped_replace_error"
  }
  if [bot_info_name] != "" {
    mutate {
      replace => {
        "bot_info_name_label.key" => "bot_info_name"
        "bot_info_name_label.value" => "%{bot_info_name}"
      }
      on_error => "bot_info_name_not_mapped"
    }
    if ![bot_info_name_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "bot_info_name_label"
        }
        on_error => "bot_info_name_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "bot_info_type" => "%{bot_info.type}"
    }
    on_error => "bot_info_type_not_mapped_replace_error"
  }
  if [bot_info_type] != "" {
    mutate {
      replace => {
        "bot_info_type_label.key" => "bot_info_type"
        "bot_info_type_label.value" => "%{bot_info_type}"
      }
      on_error => "bot_info_type_not_mapped"
    }
    if ![bot_info_type_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "bot_info_type_label"
        }
        on_error => "bot_info_type_merge_error"
      }
    }
  }
  date {
    match => ["timestamp","RFC3339", "UNIX", "ISO8601"]
    on_error => "timestamp_error"
  }
  if [_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{_id}"
      }
      on_error => "product_log_id_error"
    }
  }
 if [visitor_id] != "" {
    mutate {
      replace => {
        "visitor_id_label.value" => "%{visitor_id}"
        "visitor_id_label.key" => "visitor_id"
      }
      on_error => "visitor_id_not_mapped"
    }
    if ![visitor_id_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "visitor_id_label"
        }
        on_error => "visitor_id_merge_error"
      }
    }
  }
  if [tag] != "" {
    mutate {
      replace => {
        "tag_label.value" => "%{tag}"
        "tag_label.key" => "tag"
      }
      on_error => "tag_not_mapped"
    }
    if ![tag_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "tag_label"
        }
        on_error => "tag_merge_error"
      }
    }
  }
  if [waf_action] != "" {
    if [action] == "" {
      mutate {
        replace => {
          "action" => "%{waf_action}"
        }
        on_error => "waf_action_not_mapped"
      }
    }
    else {
      mutate {
        replace => {
          "waf_action_label.key" => "waf_action"
          "waf_action_label.value" => "%{waf_action}"
        }
        on_error => "waf_action_label_error"
      }
      if ![waf_action_label_error] {
        mutate {
          merge => {
            "security_result.detection_fields" => "waf_action_label"
          }
          on_error => "waf_action_merge_error"
        }
      }
    }
  }
  if [action] =~ "allow"{
    mutate {
      replace => {
        "sec_result_action" => "ALLOW"
      }
    }
  }
  else if [action] =~ "deny"{
    mutate {
      replace => {
        "sec_result_action" => "BLOCK"
      }
    }
  }
  if [sec_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sec_result_action"
      }
      on_error => "sec_result_action_not_mapped"
    }
  }
  if [severity] in [ "error", "warning" ] {
    mutate {
      replace => { "security_result.severity" => "HIGH" }
    }
  }
  else if [severity] == "critical" {
    mutate {
      replace => { "security_result.severity" => "CRITICAL" }
    }
  }
  else if [severity] == "notice" {
    mutate {
      replace => { "security_result.severity" => "MEDIUM" }
    }
  }
  else if [severity] in [ "information", "info" ] {
    mutate {
      replace => { "security_result.severity" => "LOW" }
    }
  }
  mutate {
    replace => { "security_result.severity_details" => "%{severity}" }
  }
  if [api_endpoint] != "" {
    mutate {
      replace => {
        "api_endpoint_label.key" => "api_endpoint"
        "api_endpoint_label.value" => "%{api_endpoint}"
      }
      on_error => "no_endpoint"
    }
    if ![no_endpoint] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.labels" => "api_endpoint_label"
        }
        on_error => "no_endpoint_merge_error"
      }
    }
  }
  if [app_firewall_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.command_line" => "%{app_firewall_name}"
      }
      on_error => "no_app_firewall_name"
    }
  }
  if [app_type] != "" {
    mutate {
      replace => {
        "about_app_type.key" => "app_type"
        "about_app_type.value" => "%{app_type}"
      }
      on_error => "app_type_not_mapped"
    }

    if ![app_type_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "about_app_type"
        }
        on_error => "app_type_merge_error"
      }
    }
  }
  if [as_org] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.organization_name" => "%{as_org}"
      }
      on_error => "as_org_not_mapped"
    }
  }
  if [asn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.asn" => "%{asn}"
      }
      on_error => "asn_not_mapped"
    }
  }
  if [kubernetes][pod_id] != "" {
    mutate {
      replace => {
        "about_pod_id.key" => "pod_id"
        "about_pod_id.value" => "%{kubernetes.pod_id}"
      }
      on_error => "pod_id_not_mapped"
    }
    if ![pod_id_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "about_pod_id"
        }
        on_error => "pod_id_merge_error"
      }
    }
  }
  if [kubernetes][pod_name] != "" {
    mutate {
      replace => {
        "about_pod_name.key" => "pod_name"
        "about_pod_name.value" => "%{kubernetes.pod_name}"
      }
      on_error => "pod_name_not_mapped"
    }
    if ![pod_name_not_mapped] {
      mutate {
        merge => {
          "security_result.detection_fields" => "about_pod_name"
        }
        on_error => "pod_name_merge_error"
      }
    }
  }
  if [latitude] != "" or [latitude] =~ "^[+-]?([1-9][0-9]?|[1-9][0-9][0-9]?)\.([0-9]+)$" {
    mutate {
      convert => {
        "latitude" => "float"
      }
      on_error => "latitude_convert_error"
    }
    if ![latitude_convert_error] {
      mutate {
        rename => {
          "latitude" => "event.idm.read_only_udm.principal.location.region_latitude"
        }
        on_error => "latitude_rename_error"
      }
    }
  }
  if [longitude] =~ "^[+-]?([1-9][0-9]?|[1-9][0-9][0-9]?)\.([0-9]+)$" {
    mutate {
      convert => {
        "longitude" => "float"
      }
      on_error => "longitude_convert_error"
    }
    if ![longitude_convert_error] {
      mutate {
        rename => {
          "longitude" => "event.idm.read_only_udm.principal.location.region_longitude"
        }
        on_error => "longitude_rename_error"
      }
    }
  }
  if [req_params] != "" {
    mutate {
      replace => {
        "about_req_params.key" => "req_params"
        "about_req_params.value.string_value" => "%{req_params}"
      }
      on_error => "req_params_not_mapped"
    }
    if ![req_params_not_mapped] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "about_req_params"
        }
        on_error => "req_params_merge_error"
      }
    }
  }
  if [as_number] != "" {
    mutate {
      convert => {
        "as_number" => "string"
      }
      on_error => "as_number_convert_error"
    }
    mutate {
      replace => {
        "about_as_number.key" => "as_number"
        "about_as_number.value.string_value" => "%{as_number}"
      }
      on_error => "as_number_not_mapped"
    }

    if ![as_number_not_mapped] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "about_as_number"
        }
        on_error => "as_number_merge_error"
      }
    }
  }
  if [has_sec_event] != "" {
    mutate {
      convert => {
        "has_sec_event" => "string"
      }
      on_error => "has_sec_event_convert_error"
    }
    mutate {
      replace => {
        "has_sec_event_label.key" => "has_sec_event"
        "has_sec_event_label.value.string_value" => "%{has_sec_event}"
      }
      on_error => "has_sec_event_not_mapped"
    }
    if ![has_sec_event_not_mapped] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "has_sec_event_label"
        }
        on_error => "has_sec_event_merge_error"
      }
    }
  }
  if [x_forwarded_for] != "" {
    grok {
      match => {
        "x_forwarded_for" => [
          "%{IP:client_ip},(\\s+)?%{IP:xff_ip},(\\s+)?%{IP:xff_ip2}"
          "%{IP:x_forwarded_for_ip}"
        ]
      }
      overwrite => ["x_forwarded_for_ip", "xff_ip", "client_ip", "xff_ip2"]
      on_error => "not_ip_4"
    }
    if ![not_ip_4] {
      if [x_forwarded_for_ip] != "" and [x_forwarded_for] != [src_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "x_forwarded_for_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "x_forwarded_for_ip"
          }
          on_error => "ip_merge_failed_xff"
        }
        if ![ip_merge_failed_xff] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      if [xff_ip] != "" {
        mutate {
          merge => {
            "intermediary.ip" => "xff_ip"
          }
          on_error => "ip_merge_failed_2"
        }
      }
      if [xff_ip2] != "" {
        mutate {
          merge => {
            "intermediary.ip" => "xff_ip2"
          }
          on_error => "ip_merge_failed"
        }
      }
      if [client_ip] != "" {
        if [client_ip] != [src_ip] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "client_ip"
              "event.idm.read_only_udm.principal.asset.ip" => "client_ip"
            }
            on_error => "ip_merge_failed_3"
          }
        }
        if ![ip_merge_failed_3] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "x_forwarded_for_label.value" => "%{x_forwarded_for}"
        }
        on_error => "x_forwarded_for_label_error"
      }
      if ![x_forwarded_for_label_error] {
        mutate {
          replace => {
            "x_forwarded_for_label.key" => "x_forwarded_for"
          }
        }
        mutate {
          merge => {
            "security_result.about.resource.attribute.labels" => "x_forwarded_for_label"
          }
          on_error => "x_forwarded_for_label_merge_error"
        }
      }
    }
  }
  for index, policy_hit in policy_hits.policy_hits {
    mutate {
      convert => {
        index => "string"
      }
      on_error => "index_convert_error"
    }
    mutate {
      replace => {
        "malicious_user_label" => ""
        "policy_label" => ""
        "policy_namespace_label" => ""
        "policy_rule" => ""
        "policy_rule_description" => ""
        "policy_set" => ""
        "result_label" => ""
      }
    }
    mutate {
      replace => {
        "malicious_user_label.key" => "malicious_user"
