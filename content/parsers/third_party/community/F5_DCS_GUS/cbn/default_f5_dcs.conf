      "event.idm.read_only_udm.metadata.product_name" => "F5 DCS"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
