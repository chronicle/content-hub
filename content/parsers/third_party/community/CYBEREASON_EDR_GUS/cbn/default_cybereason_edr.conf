# Product: Cybereason
# Category: EDR
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-02-24
# Copyright 2026 Google SecOps

# A Chronicle CBN (Configuration Based Normalization) only requires a Filter section from a LogStash configuration perspective, the input and output are handle by Chronicle
# Formatting guidlines, 2 space indents - no tabs

filter {

  # ------------ Sentinel fields ------------
  # - initialize empty variables for values that may or may not be present in a log message
  mutate {
    replace => {
      "field" => ""
      "event_type" => ""
      "malop_url" => ""
      "malop_status" => ""
      "malop_process.guidString" => ""
      "description" => ""
      "decision_feature" => ""
      "is_alert" => ""
      "type" => ""
      "guid" => ""
      "machineName" => ""
      "malwareDataModel.filePath" => ""
      "name" => ""
      "elementType" => ""
      "score" => ""
      "status" => ""
      "detectionValue" => ""
      "detectionValueType" => ""
      "detectionEngine" => ""
      "malop_data.simpleValues.elementDisplayName.values.0" => ""
      "malop_data.simpleValues.detectionType.values.0" => ""
      "malop_process.elementValues.ownerMachine.elementValues.0.name" => ""
      "malop_process.elementValues.ownerMachine.elementValues.0.guid" => ""
      "malop_process.simpleValues.imageFile.md5String.values.0" => ""
      "malop_process.simpleValues.imageFile.sha1String.values.0" => ""
      "malop_process.simpleValues.commandLine.values.0" => ""
      "malop_process.elementValues.self.elementValues.0.guid" => ""
      "malop_process.elementValues.parentProcess.elementValues.0.guid" => ""
      "malop_process.simpleValues.calculatedName.values.0" => ""
      "malop_process.elementValues.calculatedUser.elementValues.0.name" => ""
      "malop_process.elementValues.calculatedUser.elementValues.0.guid" => ""
      "malop_data.elementValues.affectedUsers.elementValues.0.guid" => ""
      "malop_data.elementValues.affectedUsers.elementValues.0.name" => ""
      "malop_data.elementValues.affectedMachines.elementValues.0.guid" => ""
      "malop_data.elementValues.affectedMachines.elementValues.0.name" => ""
      "malop_data.simpleValues.malopActivityTypes.values.0" => ""
      "malop_data.isMalicious" => ""
      "malop_user.simpleValues.privileges.values.0" => ""
      "malop_user.simpleValues.passwordAgeDays.values.0" => ""
      "malop_connection.guidString" => ""
      "malop_connection.elementValues.ownerMachine.elementValues.0.name" => ""
      "malop_connection.elementValues.ownerMachine.elementValues.0.guid" => ""
      "malop_connection.elementValues.ownerProcess.elementValues.0.guid" => ""
      "malop_connection.elementValues.ownerProcess.elementValues.0.name" => ""
      "malop_connection.elementValues.ownerProcess.user.elementValues.0.name" => ""
      "malop_connection.elementValues.ownerProcess.user.elementValues.0.guid" => ""
      "malop_connection.simpleValues.remoteAddressCountryName.values.0" => ""
      "malop_connection.elementValues.domainName.elementValues.0.name" => ""
      # Defining Nouns with some dummy values so as to pass the regex test during submission.
      "malop_connection.elementValues.remoteAddress.elementValues.0.name" => "1.1.1.1"
      "malop_connection.simpleValues.transportProtocol.values.0" => "TCP"
      "malop_severity" => "MEDIUM"
      "direction" => "OUTBOUND"
      "malop_data.malopPriority" => "MEDIUM_PRIORITY"
      "local_ip" => "1.1.1.1"
      "companyName" => ""
      "displayName" => ""
      "creationTime" => ""
      "lastUpdateTime" => ""
      "detectionEngines" => ""
      "detectionTypes" => ""
      "detectionType" => ""
      "investigationStatus" => ""
      "closerName" => ""
      "priority" => ""
      "escalated" => ""
      "isEdr" => ""
      "rootCauseElementType" => ""
      "machines" => ""
      "users" => ""
      "LogType" => ""
      "Sensor.sensorId" => ""
      "Sensor.pylumId" => ""
      "Sensor.internalIpAddress" => ""
      "Sensor.externalIpAddress" => ""
      "Sensor.ransomwareStatus" => ""
      "Sensor.preventionStatus" => ""
      "Sensor.fqdn" => ""
      "Sensor.serverName" => ""
      "Sensor.serverId" => ""
      "Sensor.serverIp" => ""
      "Sensor.osType" => ""
      "Sensor.osVersionType" => ""
      "Sensor.version" => ""
      "Sensor.powerShellStatus" => ""
      "Sensor.remoteShellStatus" => ""
      "Sensor.serialNumber" => ""
      "Sensor.deviceModel" => ""
      "Sensor.organizationalUnit" => ""
      "Sensor.organization" => ""
      "Sensor.policyId" => ""
      "detectionName" => ""
      "has_principal" => ""
      "has_target" => ""
      "iconBase64" => ""
      "security_result" => ""
      "severity" => ""
      "security_severity" => ""
      "needsAttention" => ""
      "referenceGuid" => ""
      "referenceElementType" => ""
      "schedulerScan" => ""
      "malwareDataModel" => ""
      "id_malwareType" => ""
      "malwareDataModel_filePath" => ""
      "Sensor_documentProtectionMode" => ""
      "Sensor_documentProtectionStatus" => ""
      "Sensor_guid" => ""
      "Sensor_serviceStatus" => ""
      "Sensor_avDbVersion" => ""
      "Sensor_antiMalwareStatus" => ""
      "Sensor_amStatus" => ""
      "Sensor_outdated" => ""
      "Sensor.collectionStatus" => ""
      "Sensor.collectiveUuid" => ""
      "Sensor.privateServerIp" => ""
      "Sensor.status" => ""
      "Sensor.siteId" => ""
      "Sensor.isolated" => ""
      "Sensor.exitReason" => ""
      "Sensor.lastUpgradeResult" => ""
      "Sensor.quickScanStatus" => ""
      "Sensor.policyName" => ""
      "Sensor.groupId" => ""
      "Sensor.groupName" => ""
      "Sensor.groupStickinessLabel" => ""
      "Sensor.fullScanStatus" => ""
      "Sensor.siteName" => ""
      "Sensor.usbStatus" => ""
      "Sensor.fwStatus" => ""
      "Sensor.antiExploitStatus" => ""
      "hardware" => ""
      "has_user" => "false"
      "decisionStatuses" => ""
      "mitreSubTechniques" => ""
      "iocs" => ""
      "labels" => ""
      "groups" => ""
      "rootCauseElementHashes" => ""
      "malopDetectionType" => ""
      "malopType" => ""
      "class_val" => ""
      "primaryRootCauseName" => ""
      "rootCauseElementNamesCount" => ""
      "malopCloseTime" => ""
      "edr" => ""
      "malopStatus" => ""
      "closed" => ""
      "empty" => ""
    }
  }

  mutate {
    gsub => ["message", "\"@class\"", "\"class_val\""]
    on_error => "gsub_error"
  }
  # ------------ Input Configuration  --------------
  # - extract fields from the log message
  # - add an on_error handler in case of unexpected input
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [status]  != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{status}"
      }
      on_error => "status_not_present"
    }
  }
  if [LogType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{LogType}"
      }
      on_error => "log_type_not_present"
    }
  }
  # if the log failed a JSON check, drop the log message
  if [not_json] {
    if [message] =~ "CEF:" {
      mutate {
        replace => {
          "username" => ""
          #"security_result" => ""
          "machineIP" => ""
          "date" => ""
          "host" => ""
          "log_description" => ""
          "prod_event" => ""
          "prod_event2" => ""
          "security_severity" => ""
          "kv_data" => ""
        }
      }
      grok {
        match => {
          "message" => "%{SYSLOGTIMESTAMP:date} %{HOSTNAME:host} %{DATA:log_description} CEF:%{INT}%{GREEDYDATA}\\|%{DATA:prod_event}\\|%{DATA:prod_event2}\\|%{INT:security_severity}\\|%{GREEDYDATA:kv_data}"
        }
        overwrite => ["security_severity", "date", "host", "log_description", "prod_event", "prod_event2", "kv_data"]
        on_error => "grok_fail"
      }

      if [grok_fail] {
        drop {
          tag => "TAG_MALFORMED_ENCODING"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.vendor_name" => "Cybereason"
          "event.idm.read_only_udm.metadata.product_name" => "Cybereason"
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }

      date {
        match => ["date","MMM  d HH:mm:ss","MMM d HH:mm:ss"]
        rebase => true
        on_error => "date_match_fail"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{host}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
        }
        on_error => "host_not_present"
      }
      if [host_not_present] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{log_description}"
        }
        on_error => "description_not_present"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{prod_event} - %{prod_event2}"
        }
        on_error => "product_event_not_present"
      }

      mutate {
        convert => {
          "security_severity" => "integer"
        }
        on_error => "already_integer"
      }

      if [security_severity] > 1 and [security_severity] < 5 {
        mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      } else if [security_severity] > 4 and [security_severity] < 7 {
        mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      } else if [security_severity] > 6 and [security_severity] < 9 {
        mutate {
          replace => {
            "security_result.severity" => "HIGH"
          }
        }
      } else if [security_severity] > 8 and [security_severity] < 11 {
        mutate {
          replace => {
            "security_result.severity" => "CRITICAL"
          }
        }
      }

      mutate {
        gsub => ["kv_data", "#", "hash_test"]
      }

      mutate {
        gsub => ["kv_data", " (\\w+)=", " #$1="]
      }

      mutate {
        gsub => ["kv_data", "cs\\d+Label=([^#]+) #cs(\\d+)=([^#]+)", "$1=$3"]
      }

      mutate {
        gsub => ["kv_data", "cn\\d+Label=([^#]+) #cn(\\d+)=([^#]+)", "$1=$3"]
      }

      kv {
        source => "kv_data"
        field_split => "#"
        value_split => "="
      }

      if [username] != "" {
        if [username] =~ "^.+@.+$" {
          mutate {
            gsub => ["username","^/",""]
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.user.email_addresses" => "username"
            }
          }
        }
        else {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.user.userid" => "%{username}"
            }
          }
        }
      }

      if [machineIP] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "machineIP"
            "event.idm.read_only_udm.target.asset.ip" => "machineIP"
          }
        }
      }

      mutate {
        replace => {
          "action_success_label.key" => "Action Success"
          "action_success_label.value" => "%{actionSuccess}"
        }
        on_error => "action_not_present"
      }
      if ![action_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.attribute.labels" => "action_success_label"
          }
        }
      }

      mutate {
        replace => {
          "login_method_label.value" => "%{loginMethod}"
        }
        on_error => "login_method_not_present"
      }
      if ![login_method_not_present] {
        if [loginMethod] == "CERTIFICATE" {
          mutate {
            replace => {
              "event.idm.read_only_udm.extensions.auth.type" => "SSO"
            }
          }
        } else {
          mutate {
            replace => {
              "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
            }
          }
        }
        mutate {
          replace => {
            "login_method_label.key" => "Login Method"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.attribute.labels" => "login_method_label"
          }
        }
      }

      mutate {
        replace => {
          "user_role.name" => "%{userRole}"
        }
        on_error => "user_role_not_present"
      }
      if ![user_role_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.attribute.roles" => "user_role"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{affectedMachine}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{affectedMachine}"
        }
        on_error => "affected_machine_not_present"
      }
      if [affected_machine_not_present] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{dvchost}"
            "event.idm.read_only_udm.target.asset.hostname" => "%{dvchost}"
          }
          on_error => "dvchost_not_present"
        }
      }

      mutate {
        replace => {
          "query_details.value" => "%{QueryDetails}"
        }
        on_error => "query_details_not_present"
      }
      if ![query_details_not_present] {
        mutate {
          replace => {
            "query_details.key" => "QueryDetails"
          }
          merge => {
            "security_result.detection_fields" => "query_details"
          }
        }
      }

      mutate {
        replace => {
          "query_parameters.value" => "%{QueryParameters}"
        }
        on_error => "query_parameters_not_present"
      }
      if ![query_parameters_not_present] {
        mutate {
          replace => {
            "query_parameters.key" => "QueryParameters"
          }
          merge => {
            "security_result.detection_fields" => "query_parameters"
          }
        }
      }

      mutate {
        replace => {
          "security_result.threat_id" => "%{malopId}"
        }
        on_error => "malop_id_not_present"
      }

      mutate {
        replace => {
          "affected_machine_count.value" => "%{affectedMachinesCount}"
        }
        on_error => "affected_machine_count_not_present"
      }
      if ![affected_machine_count_not_present] {
        mutate {
          replace => {
            "affected_machine_count.key" => "affectedMachinesCount"
          }
          merge => {
            "security_result.detection_fields" => "affected_machine_count"
          }
        }
      }

      mutate {
        gsub => ["linkToMalop","hash_test","#"]
      }

      mutate {
        replace => {
          "link_to_malop.value" => "%{linkToMalop}"
        }
        on_error => "link_to_malop_not_present"
      }
      if ![link_to_malop_not_present] {
        mutate {
          replace => {
            "link_to_malop.key" => "linkToMalop"
          }
          merge => {
            "security_result.detection_fields" => "link_to_malop"
          }
        }
      }

      mutate {
        replace => {
          "context_label.value" => "%{context}"
        }
        on_error => "context_label_not_present"
      }
      if ![context_label_not_present] {
        mutate {
          replace => {
            "context_label.key" => "linkToMalop"
          }
          merge => {
            "security_result.detection_fields" => "context_label"
          }
        }
      }

      mutate {
        replace => {
          "security_result.threat_name" => "%{virusName}"
        }
        on_error => "virus_name_not_present"
      }

      mutate {
        replace => {
          "security_result.action_details" => "%{act}"
        }
        on_error => "act_not_present"
      }

      mutate {
        replace => {
          "old_state_label.value" => "%{oldState}"
        }
        on_error => "old_state_label_not_present"
      }
      if ![old_state_label_not_present] {
        mutate {
          replace => {
            "old_state_label.key" => "linkToMalop"
          }
          merge => {
            "security_result.detection_fields" => "old_state_label"
          }
        }
      }

      mutate {
        replace => {
          "new_state_label.value" => "%{newState}"
        }
        on_error => "newstate_label_not_present"
      }
      if ![newstate_label_not_present] {
        mutate {
          replace => {
            "new_state_label.key" => "linkToMalop"
          }
          merge => {
            "security_result.detection_fields" => "new_state_label"
          }
        }
      }

      mutate {
        replace => {
          "investigation_label.value" => "%{investigation}"
        }
        on_error => "investigation_label_not_present"
      }
      if ![investigation_label_not_present] {
        mutate {
          replace => {
            "investigation_label.key" => "linkToMalop"
          }
          merge => {
            "security_result.detection_fields" => "investigation_label"
          }
        }
      }

      mutate {
        replace => {
          "event_id_label.value" => "%{eventId}"
        }
        on_error => "event_id_label_not_present"
      }
      if ![event_id_label_not_present] {
        mutate {
          replace => {
            "event_id_label.key" => "linkToMalop"
          }
          merge => {
            "security_result.detection_fields" => "event_id_label"
          }
        }
      }

      mutate {
        replace => {
          "malop_activity_type_label.value" => "%{malopActivityType}"
        }
        on_error => "malop_activity_type_label_not_present"
      }
      if ![malop_activity_type_label_not_present] {
        mutate {
          replace => {
            "malop_activity_type_label.key" => "malopActivityType"
          }
          merge => {
            "security_result.detection_fields" => "malop_activity_type_label"
          }
          on_error => "merge_error"
        }
      }

      mutate {
        replace => {
          "malop_suspect_label.value" => "%{malopSuspect}"
        }
        on_error => "malop_suspect_label_not_present"
      }
      if ![malop_suspect_label_not_present] {
        mutate {
          replace => {
            "malop_suspect_label.key" => "malopSuspect"
          }
          merge => {
            "security_result.detection_fields" => "malop_suspect_label"
          }
          on_error => "merge_error"
        }
      }

      mutate {
        replace => {
          "malop_key_suspicion_label.value" => "%{malopKeySuspicion}"
        }
        on_error => "malop_key_suspicion_label_not_present"
      }
      if ![malop_key_suspicion_label_not_present] {
        mutate {
          replace => {
            "malop_key_suspicion_label.key" => "malopKeySuspicion"
          }
          merge => {
            "security_result.detection_fields" => "malop_key_suspicion_label"
          }
          on_error => "merge_error"
        }
      }

      mutate {
        replace => {
          "device_custom_date_label.value" => "%{deviceCustomDate1}"
        }
        on_error => "device_custom_date_label_not_present"
      }
      if ![device_custom_date_label_not_present] {
        mutate {
          replace => {
            "device_custom_date_label.key" => "%{deviceCustomDate1Label}"
          }
          merge => {
            "security_result.detection_fields" => "device_custom_date_label"
          }
          on_error => "merge_error"
        }
      }

      mutate {
        replace => {
          "device_custom_date2_label.value" => "%{deviceCustomDate2}"
        }
        on_error => "device_custom_date2_label_not_present"
      }
      if ![device_custom_date2_label_not_present] {
        mutate {
          replace => {
            "device_custom_date2_label.key" => "%{deviceCustomDate2Label}"
          }
          merge => {
            "security_result.detection_fields" => "device_custom_date2_label"
          }
          on_error => "merge_error"
        }
      }

      mutate {
        replace => {
          "device_custom_date3_label.value" => "%{deviceCustomDate3}"
        }
        on_error => "device_custom_date3_label_not_present"
      }
      if ![device_custom_date3_label_not_present] {
        mutate {
          replace => {
            "device_custom_date3_label.key" => "%{deviceCustomDate3Label}"
          }
          merge => {
            "security_result.detection_fields" => "device_custom_date3_label"
          }
          on_error => "merge_error"
        }
      }

      if [message] =~ "((?i)Malop|Malware)" {
        mutate {
          replace => {
            "security_result_category" => "SOFTWARE_MALICIOUS"
          }
        }
        mutate {
          merge => {
            "security_result.category" => "security_result_category"
          }
        }
      }

      if [prod_event2] == "Investigation/Query" or [prod_event2] =~ "((?i)Malop|Malware)" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "SCAN_UNCATEGORIZED"
          }
        }
      } else if [prod_event2] == "General/Login" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          }
        }
      }

    }
    else {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
  }
  else {
  # ------------ Date Extract  --------------
  # - extract the log time from the log message
    grok {
      match => {
        timestamp => [ "^(?P<ts1>..........)T(?P<ts2>............).*" ]
      }
      on_error => "timestamp_error"
    }

    mutate {
      replace => {
        "ts3" => "%{ts1} %{ts2}"
      }
      on_error => "timestamp_ts3_error"
    }

    date {
      match => ["ts3", "yyyy-MM-dd HH:mm:ss"]
      on_error => "date_error"
    }


    # ------------ Field Assignment  --------------

    # UDM > Metadata
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name"                                    => "Cybereason"
        "event.idm.read_only_udm.metadata.product_name"                                   => "Cybereason"
        "event.idm.read_only_udm.metadata.product_version"                                => "2.0"
        "event.idm.read_only_udm.metadata.event_type"                                     => "GENERIC_EVENT"
      }
    }

    if [event_type] == "PROCESS_OPEN" {

    # ------------------->>>  PROCESS_OPEN EVENT  <<<-------------------

      # UDM > Metadata
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type"                                     => "PROCESS_OPEN"
          "event.idm.read_only_udm.metadata.product_event_type"                             => "%{malop_data.simpleValues.elementDisplayName.values.0}"
          "event.idm.read_only_udm.metadata.url_back_to_product"                            => "%{malop_url}"
          "event.idm.read_only_udm.metadata.product_log_id"                                 => "%{malop_process.guidString}"
        }
      }
      # UDM > Principal
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname"                                      => "%{malop_process.elementValues.ownerMachine.elementValues.0.name}"
          "event.idm.read_only_udm.principal.asset.hostname"                                => "%{malop_process.elementValues.ownerMachine.elementValues.0.name}"
          #"event.idm.read_only_udm.principal.asset_id"                                      => "Cybereason: %{malop_process.elementValues.ownerMachine.elementValues.0.guid}"
          "event.idm.read_only_udm.principal.process.command_line"                          => "%{malop_process.simpleValues.commandLine.values.0}"
          "event.idm.read_only_udm.principal.process.product_specific_process_id"           => "Cybereason: %{malop_process.elementValues.self.elementValues.0.guid}"
          "event.idm.read_only_udm.principal.process.parent_process.product_specific_process_id"    => "Cybereason: %{malop_process.elementValues.parentProcess.elementValues.0.guid}"
          "event.idm.read_only_udm.principal.process.file.full_path"                        => "%{malop_process.simpleValues.calculatedName.values.0}"
          "event.idm.read_only_udm.principal.user.user_display_name"                        => "%{malop_process.elementValues.calculatedUser.elementValues.0.name}"
          "event.idm.read_only_udm.principal.user.userid"                                   => "%{malop_process.elementValues.calculatedUser.elementValues.0.guid}"
        }
      }

      if [malop_data][elementValues][affectedUsers][elementValues][0][name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.user_display_name" => "%{malop_data.elementValues.affectedUsers.elementValues.0.name}"
          }
        }
      }

      if [malop_data][elementValues][affectedUsers][elementValues][0][guid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{malop_data.elementValues.affectedUsers.elementValues.0.guid}"
          }
        }
      }

      if [malop_data][elementValues][affectedMachines][elementValues][0][name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{malop_data.elementValues.affectedMachines.elementValues.0.name}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{malop_data.elementValues.affectedMachines.elementValues.0.name}"
          }
          on_error => "hostname_not_present"
        }
        if ![hostname_not_present] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }

      if [malop_data][elementValues][affectedMachines][elementValues][0][guid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.asset_id" => "Cybereason: %{malop_data.elementValues.affectedMachines.elementValues.0.guid}"
          }
        }
      }

      if [malop_data][isMalicious] != "" {
        mutate {
          convert => {
            "malop_data.isMalicious" => "string"
          }
        }
        mutate {
          replace => {
            "additional_isMalicious.key" => "isMalicious"
            "additional_isMalicious.value" => "%{malop_data.isMalicious}"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "additional_isMalicious"
          }
        }
      }

      if [malop_data][simpleValues][malopActivityTypes][values][0] != "" {
        mutate {
          replace => {
            "additional_malopActivityTypes.key" => "malop Activity Types"
            "additional_malopActivityTypes.value" => "%{malop_data.simpleValues.malopActivityTypes.values.0}"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "additional_malopActivityTypes"
          }
        }
      }

      # UDM > Target
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.md5"                                         => "%{malop_process.simpleValues.imageFile.md5String.values.0}"
          "event.idm.read_only_udm.target.file.sha1"                                        => "%{malop_process.simpleValues.imageFile.sha1String.values.0}"
          "event.idm.read_only_udm.target.file.full_path"                                   => "%{malop_process.simpleValues.calculatedName.values.0}"
          "event.idm.read_only_udm.target.process.pid"                                      => "%{malop_process.elementValues.self.elementValues.0.guid}"
          "event.idm.read_only_udm.target.process.file.full_path"                           => "%{malop_process.simpleValues.calculatedName.values.0}"
        }
      }

      # UDM > Security Result
      mutate {
        replace => {
          "security_result.summary"                                                         => "%{description}"
          "security_result.description"                                                     => "Malop Threat type : %{decision_feature}, Malop Status : %{malop_status}, User Privileges : %{malop_user.simpleValues.privileges.values.0},  Password Age : %{malop_user.simpleValues.passwordAgeDays.values.0}"
          "security_result.priority"                                                        => "%{malop_data.malopPriority}"
          "security_result.severity"                                                        => "%{malop_severity}"
          "security_result.url_back_to_product"                                             => "%{malop_url}"
          "security_result.threat_name"                                                     => "%{malop_data.simpleValues.detectionType.values.0}"
          "sr_category"                                                                     =>  "SOFTWARE_MALICIOUS"
        }
      }

      mutate {
        merge => { "security_result.category" => "sr_category" }
        on_error => "_merge_error"
      }


      # UDM > Alert
      if [is_alert] == "True" {
        mutate {
          replace => {
            "security_result.alert_state" => "ALERTING"
          }
        }
      }
    } else if [event_type] == "NETWORK_CONNECTION" {

    # ------------------->>>  NETWORK_CONNECTION EVENT  <<<-------------------

      # UDM > Metadata
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type"                                     => "NETWORK_CONNECTION"
          "event.idm.read_only_udm.metadata.product_event_type"                             => "%{malop_data.simpleValues.elementDisplayName.values.0}"
          "event.idm.read_only_udm.metadata.url_back_to_product"                            => "%{malop_url}"
          "event.idm.read_only_udm.metadata.product_log_id"                                 => "%{malop_connection.guidString}"
        }
      }

      # UDM > Principal
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname"                                      => "%{malop_connection.elementValues.ownerMachine.elementValues.0.name}"
          "event.idm.read_only_udm.principal.asset.hostname"                                      => "%{malop_connection.elementValues.ownerMachine.elementValues.0.name}"
          #"event.idm.read_only_udm.principal.asset_id"                                      => "Cybereason: %{malop_connection.elementValues.ownerMachine.elementValues.0.guid}"
          "event.idm.read_only_udm.principal.process.product_specific_process_id"           => "Cybereason: %{malop_connection.elementValues.ownerProcess.elementValues.0.guid}"
          "event.idm.read_only_udm.principal.user.user_display_name"                        => "%{malop_connection.elementValues.ownerProcess.user.elementValues.0.name}"
          "event.idm.read_only_udm.principal.user.userid"                                   => "%{malop_connection.elementValues.ownerProcess.user.elementValues.0.guid}"
        }
      }

      # UDM > Target
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path"                                   => "%{malop_connection.elementValues.ownerProcess.elementValues.0.name}"
          "event.idm.read_only_udm.target.url"                                              => "%{malop_url}"
          "event.idm.read_only_udm.target.location.country_or_region"                       => "%{malop_connection.simpleValues.remoteAddressCountryName.values.0}"
        }
      }

      mutate {
        convert => {
          "malop_connection.simpleValues.localPort.values.0"                                => "integer"
          "malop_connection.simpleValues.remotePort.values.0"                               => "integer"
          "malop_connection.simpleValues.receivedBytesCount.values.0"                       => "uinteger"
          "malop_connection.simpleValues.transmittedBytesCount.values.0"                    => "uinteger"
        }
        uppercase                                                                           => ["malop_connection.direction", "malop_connection.simpleValues.transportProtocol.values.0"]
      }

      # NETWORK_CONNECTION event type appear consistent with direction, so trusting log source values
      mutate {
        rename => {
          "malop_connection.simpleValues.localPort.values.0"                                => "event.idm.read_only_udm.principal.port"
          "malop_connection.simpleValues.remotePort.values.0"                               => "event.idm.read_only_udm.target.port"
          "malop_connection.simpleValues.receivedBytesCount.values.0"                       => "event.idm.read_only_udm.network.received_bytes"
          "malop_connection.simpleValues.transmittedBytesCount.values.0"                    => "event.idm.read_only_udm.network.sent_bytes"
        }
      }

      mutate {
        replace => {
          "client.ip"                                                                       => "%{local_ip}"
          "server.ip"                                                                       => "%{malop_connection.elementValues.remoteAddress.elementValues.0.name}"
        }
        merge => {
          "event.idm.read_only_udm.principal.ip"                                            => "client.ip"
          "event.idm.read_only_udm.principal.asset.ip"                                      => "client.ip"
          "event.idm.read_only_udm.target.ip"                                               => "server.ip"
          "event.idm.read_only_udm.target.asset.ip"                                         => "server.ip"
        }
      }

      # UDM > Network
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol"                                     => "%{malop_connection.simpleValues.transportProtocol.values.0}"
          "event.idm.read_only_udm.network.direction"                                       => "%{direction}"
        }
      }

      # UDM > Security Result
      mutate {
        replace => {
          "security_result.summary"                                                         => "%{description}"
          "security_result.description"                                                     => "Malop Threat type : %{decision_feature}, Malop Status : %{malop_status}, User Privileges : %{malop_user.simpleValues.privileges.values.0},  Password Age : %{malop_user.simpleValues.passwordAgeDays.values.0}"
          "security_result.priority"                                                        => "%{malop_data.malopPriority}"
          "security_result.severity"                                                        => "%{malop_severity}"
          "security_result.url_back_to_product"                                             => "%{malop_url}"
          "security_result.threat_name"                                                     => "%{malop_data.simpleValues.detectionType.values.0}"
          "sr_category"                                                                     =>  "SOFTWARE_MALICIOUS"
        }
      }

      mutate {
        merge => { "security_result.category" => "sr_category" }
        on_error => "_merge_error"
      }


      # UDM > IOC
      if [is_alert] == "True" {
        mutate {
          replace => {
            "_ioc"       => "%{malop_connection.elementValues.domainName.elementValues.0.name}"
            "_ioc_found" => "false"
          }
        }

        # Regex Domain
        grok {
          match => {
            "_ioc" => [
              "(?P<_ioc>(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9][a-z0-9-]{0,61}[a-z0-9])"
            ]
          }
          on_error => "_no_domain_found"
          overwrite => [ "_ioc" ]
        }



        if ![_no_domain_found] {
          mutate {
            replace => {
              "event1.ioc.domain_and_ports.domain" => "%{_ioc}"
              "event1.ioc.categorization"   => "Domain IOC"
            }
          }
          mutate {
            replace => {
              "_ioc_found" => "true"
            }
          }
        }

        if [_ioc_found] != "false" {
          mutate {
            replace => {
              "event1.ioc.raw_severity"     => "%{malop_severity}"
              "event1.ioc.feed_name"        => "%{malop_connection.elementValues.ownerMachine.elementValues.0.name}"
              "event1.ioc.description"      => "%{description}"
            }
          }

          mutate {
            merge => {
              "@output" => "event1"
            }
          }

        } else {
          drop {
            tag => "TAG_MALFORMED_ENCODING"
          }
        }
      }
    } else if [event_type] == "MALWARE" {

    # ------------------->>>  MALWARE EVENT  <<<-------------------

      # UDM > Metadata
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type"                                     => "SCAN_HOST"
          "event.idm.read_only_udm.metadata.product_event_type"                             => "%{type}"
          "event.idm.read_only_udm.metadata.product_log_id"                                 => "%{guid}"
          "event.idm.read_only_udm.metadata.description"                                    => "%{description}"
        }
      }

      # UDM > Principal
      if [machineName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname"                                         => "%{machineName}"
            "event.idm.read_only_udm.principal.asset.hostname"                                   => "%{machineName}"
            "has_principal" => "true"
          }
          on_error => "machine_name_not_present"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.command_line"                          => "%{malwareDataModel.filePath}"
          "event.idm.read_only_udm.principal.process.file.full_path"                        => "%{name}"
        }
      }

      # UDM > Target
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname"                                         => "%{machineName}"
          "event.idm.read_only_udm.target.asset.hostname"                                   => "%{machineName}"
          "event.idm.read_only_udm.target.file.full_path"                                   => "%{name}"
        }
      }

      # Score conversion from integer to string
      mutate {
        convert                                                                             => { "score" => "string" }
        on_error                                                                            => "_convert_error"
      }

      # UDM > Security Result
      mutate {
        replace => {
          "security_result.summary"                                                         => "%{description}"
          "security_result.description"                                                     => "Element Type : %{elementType}, Status : %{status}, Score : %{score}, MD5 String : %{detectionValue},  Detection Value Type : %{detectionValueType},  Detection Engine : %{detectionEngine}"
          "sr_category"                                                                     => "SOFTWARE_MALICIOUS"
        }
      }

      mutate {
        merge => { "security_result.category" => "sr_category" }
        on_error => "_merge_error"
      }
    }
  }
  if [LogType] == "Malware" {
    mutate {
      replace => {
        "malwareDataModel_filePath" => ""
        "has_principal" => "false"
      }
    }
    if [companyName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.company_name" => "%{companyName}"
        }
        on_error => "company_name_not_present"
      }
    }
    if [type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
          "security_result.summary" => "%{type}"
        }
        on_error => "type_not_present"
      }
    }
    if [guid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{guid}"
        }
        on_error => "guid_not_present"
      }
    }
    if [machineName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{machineName}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{machineName}"
        }
        on_error => "machine_name_not_present"
      }
      if ![machine_name_not_present] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
          on_error => "machine_name_merge_error"
        }
      }
    }
    if [name] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.file.names" => "name"
        }
        on_error => "name_not_present"
      }
    }
    mutate {
      replace => {
        "malwareDataModel_filePath" => "%{malwareDataModel.filePath}"
      }
      on_error => "malware_data_model_file_path_not_present"
    }
    if [malwareDataModel_filePath] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{malwareDataModel_filePath}"
        }
        on_error => "file_path_not_present"
      }
    }
    if [status] != "" {
      mutate {
        uppercase => ["status"]
      }
      if [status] =~ "ALLOW" {
        mutate {
          replace => {
            "security_result_action" => "ALLOW"
          }
        }
      }
      else if [status] =~ "BLOCK" {
        mutate {
          replace => {
            "security_result_action" => "BLOCK"
          }
        }
      }
      else if [status] =~ "QUARANTINE" {
        mutate {
          replace => {
            "security_result_action" => "QUARANTINE"
          }
        }
      }
      else {
        mutate {
          replace => {
            "security_result_action" => "UNKNOWN_ACTION"
          }
        }
      }
    }
    if [security_result_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
      }
    }
    mutate {
      convert => {
        "score" => "string"
      }
      on_error => "score_convert_error"
    }
    mutate {
      replace => {
        "security_result.description" => "Element Type : %{elementType}, Status : %{status}, Score : %{score}, MD5 String : %{detectionValue},  Detection Value Type : %{detectionValueType},  Detection Engine : %{detectionEngine}"
      }
    }
    if [type] == "KnownMalware" and [elementType] == "File"  {
      mutate {
        replace => {
          "sr_category" => "SOFTWARE_MALICIOUS"
        }
      }
    }
    else if [type] == "KnownMalware" {
      mutate {
        replace => {
          "sr_category" => "NETWORK_MALICIOUS"
        }
      }
    }

    mutate {
      merge => {
        "security_result.category" => "sr_category"
      }
      on_error => "_merge_error"
    }
    if [detectionName] != "" {
      mutate {
        replace => {
          "detectionName_label.key" => "Detection Name"
          "detectionName_label.value.string_value" => "%{detectionName}"
        }
        on_error => "detection_name_not_present"
      }
      if ![detection_name_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "detectionName_label"
          }
          on_error => "detection_name_merge_error"
        }
      }
    }
    if [Sensor][sensorId] != "" {
      mutate {
        replace => {
          "sensorId_label.key" => "Sensor ID"
          "sensorId_label.value.string_value" => "%{Sensor.sensorId}"
        }
        on_error => "sensor_id_not_present"
      }
      if ![sensor_id_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "sensorId_label"
          }
          on_error => "sensor_id_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "Sensor_guid" => "%{Sensor.guid}"
      }
      on_error => "sensor_guid_not_present"
    }
    if [Sensor_guid] != "" {
      mutate {
        convert => {
          "Sensor_guid" => "string"
        }
        on_error => "sensor_guid_convert_error"
      }
      mutate {
        replace => {
          "guid_label.key" => " Sensor Guid"
          "guid_label.value.string_value" => "%{Sensor_guid}"
        }
        on_error => "sensor_guid_not_present"
      }
      if ![guid_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "guid_label"
          }
          on_error => "sensor_guid_merge_error"
        }
      }
    }
    if [Sensor][fqdn] != "" {
      mutate {
        convert => {
          "Sensor.fqdn" => "string"
        }
        on_error => "sensor_fqdn_convert_error"
      }
      mutate {
        replace => {
          "fqdn_label.key" => "Sensor FQDN"
          "fqdn_label.value.string_value" => "%{Sensor.fqdn}"
        }
        on_error => "sensor_fqdn_not_present"
      }
      if ![sensor_fqdn_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "fqdn_label"
          }
          on_error => "sensor_add_error"
        }
      }
    }
    mutate {
      replace => {
        "Sensor_serviceStatus" => "%{Sensor.serviceStatus}"
      }
      on_error => "sensor_service_status_not_present"
    }
    if [Sensor_serviceStatus] != "" {
      mutate {
        replace => {
          "serviceStatus_label.key" => "Sensor Service Status"
          "serviceStatus_label.value.string_value" => "%{Sensor_serviceStatus}"
        }
        on_error => "sensor_service_status_not_present"
      }
      if ![sensor_service_status_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "serviceStatus_label"
          }
          on_error => "sensor_service_status_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "Sensor_avDbVersion" => "%{Sensor.avDbVersion}"
      }
      on_error => "sensor_av_db_version_not_present"
    }
    if [Sensor_avDbVersion] != "" {
      mutate {
        replace => {
          "avDbVersion_label.key" => "AV DB Version"
          "avDbVersion_label.value.string_value" => "%{Sensor_avDbVersion}"
        }
        on_error => "av_db_version_not_present"
      }
      if ![av_db_version_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "avDbVersion_label"
          }
          on_error => "av_db_version_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "Sensor_documentProtectionMode" => "%{Sensor.documentProtectionMode}"
      }
      on_error => "sensor_document_protection_mode_not_present"
    }
    if [Sensor_documentProtectionMode] != "" {
      mutate {
        replace => {
          "documentProtectionMode_label.key" => "Document Protection Mode"
          "documentProtectionMode_label.value.string_value" => "%{Sensor_documentProtectionMode}"
        }
        on_error => "document_protection_mode_not_present"
      }
      if ![document_protection_mode_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "documentProtectionMode_label"
          }
          on_error => "document_protection_mode_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "Sensor_antiMalwareStatus" => "%{Sensor.antiMalwareStatus}"
      }
      on_error => "sensor_anti_malware_status_not_present"
    }
    if [Sensor_antiMalwareStatus] != "" {
      mutate {
        replace => {
          "antiMalwareStatus_label.key" => "Anti-Malware Status"
          "antiMalwareStatus_label.value.string_value" => "%{Sensor_antiMalwareStatus}"
        }
        on_error => "anti_malware_status_not_present"
      }
      if ![anti_malware_status_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "antiMalwareStatus_label"
          }
          on_error => "anti_malware_status_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "Sensor_documentProtectionStatus" => "%{Sensor.documentProtectionStatus}"
      }
      on_error => "sensor_document_protection_status_not_present"
    }
    if [Sensor_documentProtectionStatus] != "" {
      mutate {
        replace => {
          "documentProtectionStatus_label.key" => "Document Protection Status"
          "documentProtectionStatus_label.value.string_value" => "%{Sensor_documentProtectionStatus}"
        }
        on_error => "document_protection_status_not_present"
      }
      if ![document_protection_status_not_present] {
