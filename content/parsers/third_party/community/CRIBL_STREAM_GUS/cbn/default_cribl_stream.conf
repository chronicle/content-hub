    }
  }

  if [count] != "" {
    mutate {
      convert => {
        "count" => "string"
      }
      on_error => "count_conversion_failed"
    }
    mutate {
      replace => {
        "count_label.key" => "count"
        "count_label.value.string_value" => "%{count}"
      }
      on_error => "count_invalid"
    }
    if ![count_invalid] {
      mutate {
        merge => {
          "additional.fields" => "count_label"
        }
        on_error => "count_label_merge_failed"
      }
    }
  }

  if [total] != "" {
    mutate {
      convert => {
        "total" => "string"
      }
      on_error => "total_conversion_failed"
    }
    mutate {
      replace => {
        "total_label.key" => "total"
        "total_label.value.string_value" => "%{total}"
      }
      on_error => "total_invalid"
    }
    if ![total_invalid] {
      mutate {
        merge => {
          "additional.fields" => "total_label"
        }
        on_error => "total_label_merge_failed"
      }
    }
  }

  if [failed] != "" {
    mutate {
      convert => {
        "failed" => "string"
      }
      on_error => "failed_conversion_failed"
    }
    mutate {
      replace => {
        "failed_label.key" => "failed"
        "failed_label.value.string_value" => "%{failed}"
      }
      on_error => "failed_invalid"
    }
    if ![failed_invalid] {
      mutate {
        merge => {
          "additional.fields" => "failed_label"
        }
        on_error => "failed_label_merge_failed"
      }
    }
  }

  if [dropped] != "" {
    mutate {
      convert => {
        "dropped" => "string"
      }
      on_error => "dropped_conversion_dropped"
    }
    mutate {
      replace => {
        "dropped_label.key" => "dropped"
        "dropped_label.value.string_value" => "%{dropped}"
      }
      on_error => "dropped_invalid"
    }
    if ![dropped_invalid] {
      mutate {
        merge => {
          "additional.fields" => "dropped_label"
        }
        on_error => "dropped_label_merge_dropped"
      }
    }
  }

  if [numMetrics] != "" {
    mutate {
      convert => {
        "numMetrics" => "string"
      }
      on_error => "numMetrics_conversion_failed"
    }
    mutate {
      replace => {
        "numMetrics_label.key" => "numMetrics"
        "numMetrics_label.value.string_value" => "%{numMetrics}"
      }
      on_error => "numMetrics_invalid"
    }
    if ![numMetrics_invalid] {
      mutate {
        merge => {
          "additional.fields" => "numMetrics_label"
        }
        on_error => "numMetrics_label_merge_failed"
      }
    }
  }

  if [inEvents] != "" {
    mutate {
      convert => {
        "inEvents" => "string"
      }
      on_error => "inEvents_conversion_failed"
    }
    mutate {
      replace => {
        "inEvents_label.key" => "inEvents"
        "inEvents_label.value.string_value" => "%{inEvents}"
      }
      on_error => "inEvents_invalid"
    }
    if ![inEvents_invalid] {
      mutate {
        merge => {
          "additional.fields" => "inEvents_label"
        }
        on_error => "inEvents_label_merge_failed"
      }
    }
  }

  if [outEvents] != "" {
    mutate {
      convert => {
        "outEvents" => "string"
      }
      on_error => "outEvents_conversion_failed"
    }
    mutate {
      replace => {
        "outEvents_label.key" => "outEvents"
        "outEvents_label.value.string_value" => "%{outEvents}"
      }
      on_error => "outEvents_invalid"
    }
    if ![outEvents_invalid] {
      mutate {
        merge => {
          "additional.fields" => "outEvents_label"
        }
        on_error => "outEvents_label_merge_failed"
      }
    }
  }

  if [starttime] != "" {
    mutate {
      convert => {
        "starttime" => "string"
      }
      on_error => "starttime_conversion_failed"
    }
    mutate {
      replace => {
        "starttime_label.key" => "starttime"
        "starttime_label.value.string_value" => "%{starttime}"
      }
      on_error => "starttime_invalid"
    }
    if ![starttime_invalid] {
      mutate {
        merge => {
          "additional.fields" => "starttime_label"
        }
        on_error => "starttime_label_merge_failed"
      }
    }
  }

  if [endtime] != "" {
    mutate {
      convert => {
        "endtime" => "string"
      }
      on_error => "endtime_conversion_failed"
    }
    mutate {
      replace => {
        "endtime_label.key" => "endtime"
        "endtime_label.value.string_value" => "%{endtime}"
      }
      on_error => "endtime_invalid"
    }
    if ![endtime_invalid] {
      mutate {
        merge => {
          "additional.fields" => "endtime_label"
        }
        on_error => "endtime_label_merge_failed"
      }
    }
  }

  # metadata
  if [__criblEventType] != "" and [__inputId] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{__criblEventType} %{__inputId}"
      }
      on_error => "criblEventType_invalid"
    }
  }
  else if [__criblEventType] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{__criblEventType}"
      }
      on_error => "criblEventType_invalid"
    }
  }

  if [msg_data] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{msg_data}"
      }
      on_error => "msg_data_invalid"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "CRIBL STREAM"
      "metadata.product_name" => "Cribl Stream"
    }
  }

  if [metadata_event_type] == "" {
    if [principal_mid_present] == "true" and [target_mid_present] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [principal_mid_present] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  if [metadata_event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{metadata_event_type}"
      }
      on_error => "metadata_event_type_value_invalid"
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
