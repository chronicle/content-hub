  if [mem][buffers] != "" {
    mutate {
      convert => {
        "mem.buffers" => "string"
      }
      on_error => "buffers_conversion_failed"
    }
    mutate {
      replace => {
        "buffers_label.key" => "memory buffers"
        "buffers_label.value" => "%{mem.buffers}"
      }
      on_error => "buffers_invalid"
    }
    if ![buffers_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "buffers_label"
        }
        on_error => "buffers_label_merge_failed"
      }
    }
  }

  # additional labels
  if [_time] != "" {
    mutate {
      convert => {
        "_time" => "string"
      }
      on_error => "conversion_failed"
    }
    mutate {
      replace => {
        "time_label.key" => "time"
        "time_label.value.string_value" => "%{_time}"
      }
      on_error => "time_invalid"
    }
    if ![time_invalid] {
      mutate {
        merge => {
          "additional.fields" => "time_label"
        }
        on_error => "time_label_merge_failed"
      }
    }
  }

  if [__final] != "" {
    mutate {
      convert => {
        "__final" => "string"
      }
      on_error => "final_conversion_failed"
    }
    mutate {
      replace => {
        "final_label.key" => "final"
        "final_label.value.string_value" => "%{__final}"
      }
      on_error => "final_invalid"
    }
    if ![final_invalid] {
      mutate {
        merge => {
          "additional.fields" => "final_label"
        }
        on_error => "final_label_merge_failed"
      }
