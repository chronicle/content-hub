# Product: CRIBL_STREAM
# Category: Log Aggregation and SIEM Systems
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-06-05
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      # fields
      "_time" => ""
      "__criblEventType" => ""
      "__final" => ""
      "__cloneCount" => ""
      "__inputId" => ""
      "time" => ""
      "cid" => ""
      "channel" => ""
      "level" => ""
      "msg_data" => ""
      "context" => ""
      "count" => ""
      "source" => ""
      "host" => ""
      "cribl_route" => ""
      # uncommon fields
      "solution" => ""
      "total" => ""
      "failed" => ""
      "dropped" => ""
      "file" => ""
      "numMetrics" => ""
      "inEvents" => ""
      "outEvents" => ""
      "inBytes" => ""
      "outBytes" => ""
      "starttime" => ""
      "endtime" => ""
      "activeCxn" => ""
      "openCxn" => ""
      "closeCxn" => ""
      "rejectCxn" => ""
      "abortCxn" => ""
      "droppedEvents" => ""
      "tasksStarted" => ""
      "tasksCompleted" => ""
      "pqTotalBytes" => ""
      "pqBufferedEvents" => ""
      "activeEP" => ""
      "blockedEP" => ""
      "cpuPerc" => ""
      "eluPerc" => ""
      "mem.heap" => ""
      "mem.heapTotal" => ""
      "mem.ext" => ""
      "mem.rss" => ""
      "mem.buffers" => ""
      "Received_status_code" => ""
      "method" => ""
      "url" => ""
      "key" => ""
      "target_ip" => ""
      "target_host" => ""
      # event type specific
      "metadata_event_type" => ""
      "principal_mid_present" => "false"
      "target_mid_present" => "false"
      # udm noun
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
    }
  }

  mutate {
    gsub => ["message", '\"event\"(\\s*:)', '\"event_value\"$1']
  }
  mutate {
    gsub => ["message", '\"message\"(\\s*:)', '\"msg_data\"$1']
  }
  mutate {
    gsub => ["message", '\\\\\\"', '\"']
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "source_not_json"
  }

  if [source_not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  mutate {
    gsub => ["msg_data", "Received status code", "Received_status_code"]
  }
  mutate {
    gsub => ["msg_data", "=([\\w-]+),\\s+", "=$1#"]
  }
  kv {
    source => "msg_data"
    field_split => "#"
    value_split => "="
    on_error => "msg_data_not_kv"
  }

  if [time] != "" {
    date {
      match => ["time", "ISO8601", "RFC3339"]
      on_error => "date_match_failed"
    }
  }

  # principal
  if [source] != "" {
    mutate {
      replace => {
        "principal.application" => "%{source}"
      }
      on_error => "source_invalid"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "principal_mid_present" => "true"
      }
      on_error => "source_invalid"
    }
  }

  if [cid] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{cid}"
      }
      on_error => "source_invalid"
    }
  }

  # principal resource labels
  if [channel] != "" {
    mutate {
      convert => {
        "channel" => "string"
      }
      on_error => "channel_conversion_failed"
    }
    mutate {
      replace => {
        "channel_label.key" => "channel"
        "channel_label.value" => "%{channel}"
      }
      on_error => "channel_invalid"
    }
    if ![channel_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "channel_label"
        }
        on_error => "channel_label_merge_failed"
      }
    }
  }

  if [cribl_route] != "" {
    mutate {
      convert => {
        "cribl_route" => "string"
      }
      on_error => "cribl_route_conversion_failed"
    }
    mutate {
      replace => {
        "cribl_route_label.key" => "cribl_route"
        "cribl_route_label.value" => "%{cribl_route}"
      }
      on_error => "cribl_route_invalid"
    }
    if ![cribl_route_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "cribl_route_label"
        }
        on_error => "cribl_route_label_merge_failed"
      }
    }
  }

  # target
  if [file] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{file}"
      }
      on_error => "file_invalid"
    }
  }

  if [key] != "" {
    mutate {
      replace => {
        "target.url" => "%{key}"
      }
      on_error => "source_invalid"
    }
  }

  # endpoints : array of endpoint
  for index, endpoint in endpoints {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_conversion_failed"
    }
    for key, value in endpoint map {
      mutate {
        replace => {
          "validated_ip" => ""
        }
      }
      if [key] =~ "(?i)(resolvedHost)" {
        if [value] != "" {
          grok {
            match => {
              "value" => "%{IP:validated_ip}"
            }
            overwrite => ["validated_ip"]
            on_error => "value_not_ip"
          }

          if ![value_not_ip] {
            mutate {
              merge => {
                "target.ip" => "validated_ip"
                "target.asset.ip" => "validated_ip"
              }
              on_error => "validated_ip_merge_failed"
            }
            if ![validated_ip_merge_failed] {
              mutate {
                replace => {
                  "target_mid_present" => "true"
                }
              }
            }
          }
        }
      }
      else if [key] == "stats" {
        for stat_key, stat_value in value map {
          mutate {
            replace => {
              "stat_map_label" => ""
            }
          }
          if [stat_key] != "" {
            mutate {
              replace => {
                "stat_map_label.key" => "endpoint_%{index} %{key} %{stat_key}"
              }
              on_error => "stat_key_invalid"
            }
            if ![stat_key_invalid] and [stat_value] != "" {
              mutate {
                convert => {
                  "stat_value" => "string"
                }
                on_error => "stat_value_conversion_failed"
              }
              mutate {
                replace => {
                  "stat_map_label.value" => "%{stat_value}"
                }
                on_error => "stat_value_invalid"
              }
              if ![stat_value_invalid] {
                mutate {
                  merge => {
                    "target.resource.attribute.labels" => "stat_map_label"
                  }
                  on_error => "stat_map_label_merge_failed"
                }
              }
            }
          }
        }
      }
      else if [key] not in ["host", ""] {
        mutate {
          replace => {
            "endpoint_map_label" => ""
          }
        }
        mutate {
          replace => {
            "endpoint_map_label.key" => "endpoint_%{index} %{key}"
          }
          on_error => "key_invalid"
        }
        if ![key_invalid] and [value] != "" {
          mutate {
            convert => {
              "value" => "string"
            }
            on_error => "value_conversion_failed"
          }
          mutate {
            replace => {
              "endpoint_map_label.value" => "%{value}"
            }
            on_error => "value_nested"
          }
          if ![value_nested] {
            mutate {
              merge => {
                "target.resource.attribute.labels" => "endpoint_map_label"
              }
              on_error => "endpoint_map_label_merge_failed"
            }
          }
        }
      }
    }
  }

  # network
  if [inBytes] != "" {
    mutate {
      convert => {
        "inBytes" => "uinteger"
      }
      on_error => "conversion_failed"
    }

    mutate {
      rename => {
        "inBytes" => "network.received_bytes"
      }
    }
  }

  if [outBytes] != "" {
    mutate {
      convert => {
        "outBytes" => "uinteger"
      }
      on_error => "conversion_failed"
    }

    mutate {
      rename => {
        "outBytes" => "network.sent_bytes"
      }
    }
  }

  if [Received_status_code] != "" {
    mutate {
      replace => {
        "network.http.response_code" => "%{Received_status_code}"
      }
      on_error => "source_invalid"
    }
    mutate {
      convert => {
        "network.http.response_code" => "integer"
      }
      on_error => "conversion_failed"
    }
  }

  if [method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{method}"
      }
      on_error => "source_invalid"
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "network.http.referral_url" => "%{url}"
      }
      on_error => "source_invalid"
    }
  }

  # security_result
  if [level] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{level}"
      }
      on_error => "level_invalid"
    }
  }
  if [level] =~ "(?i)(info)" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [level] =~ "(?i)(warn)" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [level] =~ "(?i)(error)" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }

  if [context] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "context"
      }
      on_error => "context_merge_failed"
    }
  }

  if [solution] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{solution}"
      }
      on_error => "solution_invalid"
    }
  }

  # detection_fields
  if [activeCxn] != "" {
    mutate {
      convert => {
        "activeCxn" => "string"
      }
      on_error => "activeCxn_conversion_failed"
    }
    mutate {
      replace => {
        "activeCxn_label.key" => "activeCxn"
        "activeCxn_label.value" => "%{activeCxn}"
      }
      on_error => "activeCxn_invalid"
    }
    if ![activeCxn_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "activeCxn_label"
        }
        on_error => "activeCxn_label_merge_failed"
      }
    }
  }

  if [openCxn] != "" {
    mutate {
      convert => {
        "openCxn" => "string"
      }
      on_error => "openCxn_conversion_failed"
    }
    mutate {
      replace => {
        "openCxn_label.key" => "openCxn"
        "openCxn_label.value" => "%{openCxn}"
      }
      on_error => "openCxn_invalid"
    }
    if ![openCxn_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "openCxn_label"
        }
        on_error => "openCxn_label_merge_failed"
      }
    }
  }

  if [closeCxn] != "" {
    mutate {
      convert => {
        "closeCxn" => "string"
      }
      on_error => "closeCxn_conversion_failed"
    }
    mutate {
      replace => {
        "closeCxn_label.key" => "closeCxn"
        "closeCxn_label.value" => "%{closeCxn}"
      }
      on_error => "closeCxn_invalid"
    }
    if ![closeCxn_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "closeCxn_label"
        }
        on_error => "closeCxn_label_merge_failed"
      }
    }
  }

  if [rejectCxn] != "" {
    mutate {
      convert => {
        "rejectCxn" => "string"
      }
      on_error => "rejectCxn_conversion_failed"
    }
    mutate {
      replace => {
        "rejectCxn_label.key" => "rejectCxn"
        "rejectCxn_label.value" => "%{rejectCxn}"
      }
      on_error => "rejectCxn_invalid"
    }
    if ![rejectCxn_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "rejectCxn_label"
        }
        on_error => "rejectCxn_label_merge_failed"
      }
    }
  }

  if [abortCxn] != "" {
    mutate {
      convert => {
        "abortCxn" => "string"
      }
      on_error => "abortCxn_conversion_failed"
    }
    mutate {
      replace => {
        "abortCxn_label.key" => "abortCxn"
        "abortCxn_label.value" => "%{abortCxn}"
      }
      on_error => "abortCxn_invalid"
    }
    if ![abortCxn_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "abortCxn_label"
        }
        on_error => "abortCxn_label_merge_failed"
      }
    }
  }

  if [droppedEvents] != "" {
    mutate {
      convert => {
        "droppedEvents" => "string"
      }
      on_error => "droppedEvents_conversion_failed"
    }
    mutate {
      replace => {
        "droppedEvents_label.key" => "droppedEvents"
        "droppedEvents_label.value" => "%{droppedEvents}"
      }
      on_error => "droppedEvents_invalid"
    }
    if ![droppedEvents_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "droppedEvents_label"
        }
        on_error => "droppedEvents_label_merge_failed"
      }
    }
  }

  if [tasksStarted] != "" {
    mutate {
      convert => {
        "tasksStarted" => "string"
      }
      on_error => "tasksStarted_conversion_failed"
    }
    mutate {
      replace => {
        "tasksStarted_label.key" => "tasksStarted"
        "tasksStarted_label.value" => "%{tasksStarted}"
      }
      on_error => "tasksStarted_invalid"
    }
    if ![tasksStarted_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "tasksStarted_label"
        }
        on_error => "tasksStarted_label_merge_failed"
      }
    }
  }

  if [tasksCompleted] != "" {
    mutate {
      convert => {
        "tasksCompleted" => "string"
      }
      on_error => "tasksCompleted_conversion_failed"
    }
    mutate {
      replace => {
        "tasksCompleted_label.key" => "tasksCompleted"
        "tasksCompleted_label.value" => "%{tasksCompleted}"
      }
      on_error => "tasksCompleted_invalid"
    }
    if ![tasksCompleted_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "tasksCompleted_label"
        }
        on_error => "tasksCompleted_label_merge_failed"
      }
    }
  }

  if [pqTotalBytes] != "" {
    mutate {
      convert => {
        "pqTotalBytes" => "string"
      }
      on_error => "pqTotalBytes_conversion_failed"
    }
    mutate {
      replace => {
        "pqTotalBytes_label.key" => "pqTotalBytes"
        "pqTotalBytes_label.value" => "%{pqTotalBytes}"
      }
      on_error => "pqTotalBytes_invalid"
    }
    if ![pqTotalBytes_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "pqTotalBytes_label"
        }
        on_error => "pqTotalBytes_label_merge_failed"
      }
    }
  }

  if [pqBufferedEvents] != "" {
    mutate {
      convert => {
        "pqBufferedEvents" => "string"
      }
      on_error => "pqBufferedEvents_conversion_failed"
    }
    mutate {
      replace => {
        "pqBufferedEvents_label.key" => "pqBufferedEvents"
        "pqBufferedEvents_label.value" => "%{pqBufferedEvents}"
      }
      on_error => "pqBufferedEvents_invalid"
    }
    if ![pqBufferedEvents_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "pqBufferedEvents_label"
        }
        on_error => "pqBufferedEvents_label_merge_failed"
      }
    }
  }

  if [activeEP] != "" {
    mutate {
      convert => {
        "activeEP" => "string"
      }
      on_error => "activeEP_conversion_failed"
    }
    mutate {
      replace => {
        "activeEP_label.key" => "activeEP"
        "activeEP_label.value" => "%{activeEP}"
      }
      on_error => "activeEP_invalid"
    }
    if ![activeEP_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "activeEP_label"
        }
        on_error => "activeEP_label_merge_failed"
      }
    }
  }

  if [blockedEP] != "" {
    mutate {
      convert => {
        "blockedEP" => "string"
      }
      on_error => "blockedEP_conversion_failed"
    }
    mutate {
      replace => {
        "blockedEP_label.key" => "blockedEP"
        "blockedEP_label.value" => "%{blockedEP}"
      }
      on_error => "blockedEP_invalid"
    }
    if ![blockedEP_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "blockedEP_label"
        }
        on_error => "blockedEP_label_merge_failed"
      }
    }
  }

  if [cpuPerc] != "" {
    mutate {
      convert => {
        "cpuPerc" => "string"
      }
      on_error => "cpuPerc_conversion_failed"
    }
    mutate {
      replace => {
        "cpuPerc_label.key" => "cpuPerc"
        "cpuPerc_label.value" => "%{cpuPerc}"
      }
      on_error => "cpuPerc_invalid"
    }
    if ![cpuPerc_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "cpuPerc_label"
        }
        on_error => "cpuPerc_label_merge_failed"
      }
    }
  }

  if [eluPerc] != "" {
    mutate {
      convert => {
        "eluPerc" => "string"
      }
      on_error => "eluPerc_conversion_failed"
    }
    mutate {
      replace => {
        "eluPerc_label.key" => "eluPerc"
        "eluPerc_label.value" => "%{eluPerc}"
      }
      on_error => "eluPerc_invalid"
    }
    if ![eluPerc_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "eluPerc_label"
        }
        on_error => "eluPerc_label_merge_failed"
      }
    }
  }

  if [mem][heap] != "" {
    mutate {
      convert => {
        "mem.heap" => "string"
      }
      on_error => "heap_conversion_failed"
    }
    mutate {
      replace => {
        "heap_label.key" => "memory heap"
        "heap_label.value" => "%{mem.heap}"
      }
      on_error => "heap_invalid"
    }
    if ![heap_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "heap_label"
        }
        on_error => "heap_label_merge_failed"
      }
    }
  }

  if [mem][heapTotal] != "" {
    mutate {
      convert => {
        "mem.heapTotal" => "string"
      }
      on_error => "heapTotal_conversion_failed"
    }
    mutate {
      replace => {
        "heapTotal_label.key" => "memory heapTotal"
        "heapTotal_label.value" => "%{mem.heapTotal}"
      }
      on_error => "heapTotal_invalid"
    }
    if ![heapTotal_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "heapTotal_label"
        }
        on_error => "heapTotal_label_merge_failed"
      }
    }
  }

  if [mem][ext] != "" {
    mutate {
      convert => {
        "mem.ext" => "string"
      }
      on_error => "ext_conversion_failed"
    }
    mutate {
      replace => {
        "ext_label.key" => "memory ext"
        "ext_label.value" => "%{mem.ext}"
      }
      on_error => "ext_invalid"
    }
    if ![ext_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ext_label"
        }
        on_error => "ext_label_merge_failed"
      }
    }
  }

  if [mem][rss] != "" {
    mutate {
      convert => {
        "mem.rss" => "string"
      }
      on_error => "rss_conversion_failed"
    }
    mutate {
      replace => {
        "rss_label.key" => "memory rss"
        "rss_label.value" => "%{mem.rss}"
      }
      on_error => "rss_invalid"
    }
    if ![rss_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "rss_label"
        }
        on_error => "rss_label_merge_failed"
      }
    }
