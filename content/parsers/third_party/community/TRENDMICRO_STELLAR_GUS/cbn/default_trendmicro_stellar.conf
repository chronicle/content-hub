        "violatedPolicy" => "%{DATA:policy_rule_name}:%{GREEDYDATA:rule_desc}"
      }
      overwrite => ["policy_rule_name", "rule_desc"]
      on_error => "grok_violatedPolicy_error"
    }
    if ![grok_violatedPolicy_error] {
      mutate {
        replace => {
          "security_result.rule_name" => "%{policy_rule_name}"
        }
        on_error => "no_violatedPolicy"
      }
      mutate {
        replace => {
          "security_result.description" => "%{rule_desc}"
        }
        on_error => "no_violatedPolicy_desc"
      }
    }
  }

  if [reason] != "" {
    mutate {
      replace => {
        "reason_label.key" => "reason"
        "reason_label.value.string_value" => "%{reason}"
      }
      on_error => "no_reason"
    }
    if ![no_reason] {
      mutate {
        merge => {
          "additional.fields" => "reason_label"
        }
        on_error => "no_reason_label"
      }
    }
  }

  if [msg] =~ "login" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "metadata_event_type" => "USER_LOGIN"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata_event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata_event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_userid] == "true" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  if [event_id] == "5888" {
    mutate {
      replace => {
        "metadata_event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }
  else if [event_id] == "4609" {
    mutate {
      replace => {
        "metadata_event_type" => "SCAN_FILE"
      }
    }
  }
  else if [event_id] == "523" {
    mutate {
      replace => {
        "metadata_event_type" => "FILE_DELETION"
      }
    }
  }
  else if [event_id] in ["8197", "8214"] {
    mutate {
      replace => {
        "metadata_event_type" => "USER_CHANGE_PASSWORD"
      }
    }
  }
  else if [event_id] == "8209" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_CREATION"
      }
    }
  }
  else if [event_id] == "8211" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_DELETION"
      }
    }
  }

  if [metadata_event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{metadata_event_type}"
      }
      on_error => "metadata_event_type_empty"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
