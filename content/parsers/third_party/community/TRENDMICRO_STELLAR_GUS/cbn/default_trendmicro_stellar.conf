# Product: TRENDMICRO STELLAR
# Category: AV and Endpoint logs
# Supported Format: SYSLOG , JSON, SYSLOG+KV
# Reference: https://docs.trendmicro.com/en-us/documentation/article/txone-stellarone-30-online-help-aboutlogs
# Last Updated: 2026-03-02
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event" => ""
      "principal" => ""
      "target" => ""
      "security_result" => ""
      "network" => ""
      "additional" => ""
      "metadata" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "vendor" => ""
      "product" => ""
      "version" => ""
      "kv_data" => ""
      "msg" => ""
      "start" => ""
      "cat" => ""
      "dvchost" => ""
      "deviceExternalId" => ""
      "eventId" => ""
      "serverIP" => ""
      "agentEndpoint" => ""
      "agentIp" => ""
      "agentLocation" => ""
      "agentVendor" => ""
      "agentModel" => ""
      "agentOS" => ""
      "desc" => ""
      "accessImagePath" => ""
      "accessUser" => ""
      "mode" => ""
      "list" => ""
      "fileHashAllowed" => ""
      "pid" => ""
      "sn" => ""
      "ActiveUser" => ""
      "vid" => ""
      "userName" => ""
      "userRole" => ""
      "clientIp" => ""
      "suser" => ""
      "cs1Label" => ""
      "cs1" => ""
      "policyVersion" => ""
      "filePath" => ""
      "fileHash" => ""
      "threatType" => ""
      "threatName" => ""
      "actionResult" => ""
      "quarantinePath" => ""
      "processId" => ""
      "monitoredProcess_Script" => ""
      "parentProcess1" => ""
      "parentProcess2" => ""
      "targetArguments" => ""
      "OriginalVersion" => ""
      "UpdateVersion" => ""
      "UpdateSource" => ""
      "interip" => ""
      "LogTimestamp" => ""
      "Customer" => ""
      "SessionID" => ""
      "ConnectionID" => ""
      "InternalReason" => ""
      "ConnectionStatus" => ""
      "IPProtocol" => ""
      "DoubleEncryption" => ""
      "Username" => ""
      "ServicePort" => ""
      "ClientPublicIP" => ""
      "ClientPrivateIP" => ""
      "ClientLatitude" => ""
      "ClientLongitude" => ""
      "ClientCountryCode" => ""
      "ClientZEN" => ""
      "Policy" => ""
      "Connector" => ""
      "ConnectorZEN" => ""
      "ConnectorIP" => ""
      "ConnectorPort" => ""
      "Host" => ""
      "Application" => ""
      "AppGroup" => ""
      "Server" => ""
      "ServerIP" => ""
      "ServerPort" => ""
      "PolicyProcessingTime" => ""
      "ServerSetupTime" => ""
      "TimestampConnectionStart" => ""
      "TimestampConnectionEnd" => ""
      "TimestampCATx" => ""
      "TimestampCARx" => ""
      "TimestampAppLearnStart" => ""
      "TimestampZENFirstRxClient" => ""
      "TimestampZENFirstTxClient" => ""
      "TimestampZENLastRxClient" => ""
      "TimestampZENLastTxClient" => ""
      "TimestampConnectorZENSetupComplete" => ""
      "TimestampZENFirstRxConnector" => ""
      "TimestampZENFirstTxConnector" => ""
      "TimestampZENLastRxConnector" => ""
      "TimestampZENLastTxConnector" => ""
      "ZENTotalBytesRxClient" => ""
      "ZENBytesRxClient" => ""
      "ZENTotalBytesTxClient" => ""
      "ZENBytesTxClient" => ""
      "ZENTotalBytesRxConnector" => ""
      "ZENBytesRxConnector" => ""
      "ZENTotalBytesTxConnector" => ""
      "ZENBytesTxConnector" => ""
      "Idp" => ""
      "ClientToClient" => ""
      "ClientCity" => ""
      "MicroTenantID" => ""
      "AppMicroTenantID" => ""
      "programPath" => ""
      "programSize"  => ""
      "certificate" => ""
      "category" => ""
      "programHash" => ""
      "domain" => ""
      "account" => ""
      "loginType" => ""
      "sourceIP" => ""
      "event_id" => ""
      "eventTime" => ""
      "event_name" => ""
      "severity" => ""
      "intermediary" => ""
      "ts" => ""
      "has_userid" => "false"
      "src" => ""
      "dvc" => ""
      "dst" => ""
      "threatAttackID" => ""
      "frameworkName" => ""
      "file_product" => ""
      "file_vendor" => ""
      "fileSize" => ""
      "fileVersion" => ""
      "fileModificationTime" => ""
      "fileCreateTime" => ""
      "lastModifierPath" => ""
      "agentGrpPath" => ""
      "agentGrpName" => ""
      "agentGrpGuid" => ""
      "agentRt" => ""
      "alLastUpdateAt" => ""
      "legacyAgentSeverity" => ""
      "rebootRequired" => ""
      "size" => ""
      "fileName" => ""
      "metadata_event_type" => ""
      "policy_rule_name" => ""
      "rule_desc" => ""
      "violatedPolicy" => ""
      "reason" => ""
      "time" => ""
      "tz" => ""
    }
  }
  mutate {
    gsub => ["message", "\\r\\n", " "]
  }
  mutate {
    gsub => ["message", "monitoredProcess/Script", "monitoredProcess_Script"]
  }

  if [message] =~ "CEF" {
    grok {
      match => {
        "message" => [
          "(?ms)<%{INT}>%{SYSLOGTIMESTAMP} %{DATA} CEF:%{INT}\\|%{DATA:vendor}\\|%{DATA:product}\\|%{DATA:version}\\|%{DATA:event_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}",
          "(?ms)<%{INT}> %{TIMESTAMP_ISO8601} %{DATA}  \\[%{INT}\\]: CEF:%{INT}\\|%{DATA:vendor}\\|%{DATA:product}\\|%{DATA:version}\\|%{DATA:event_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}",
          "(?ms)<%{INT}>%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA}\\s+CEF\\:%{INT}\\|%{DATA:vendor}\\|%{DATA:product}\\|%{DATA:version}\\|%{DATA:event_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}",
          "(?ms)<%{INT}>%{TIMESTAMP_ISO8601} %{DATA} \\[%{INT}\\]: CEF:0\\|%{DATA:vendor}\\|%{DATA:product}\\|%{DATA:version}\\|%{INT:event_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["kv_data","vendor","product","version","event_id","event_name","severity", "timestamp"]
      on_error => "cef_grok_failed"
    }

    if [kv_data] != "" {
      mutate {
        gsub => ["kv_data", "(\\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
      }
      mutate {
        gsub => ["kv_data", "product=", "file_product="]
      }
      mutate {
        gsub => ["kv_data", "vendor=", "file_vendor="]
      }
      kv {
        source => "kv_data"
        field_split => "^"
        value_split => "="
        whitespace => "strict"
        on_error => "no_cef_extension"
      }
      grok {
        match => {
          "start" => ["%{GREEDYDATA:ts} %{GREEDYDATA}"]
        }
        overwrite => ["ts"]
        on_error => "no_start"
      }
      grok {
        match => {
          "eventTime" => ["%{GREEDYDATA:time} %{DATA}%{ISO8601_TIMEZONE:tz}"]
        }
        overwrite => ["time", "tz"]
        on_error => "no_eventTime_grok_failed"
      }
      if ![no_eventTime_grok_failed] {
        if [tz] != "" and [time] != "" {
          mutate {
            replace => {
              "ts" => "%{time} %{tz}"
            }
            on_error => "no_eventTime_ts_replace"
          }
        }
      }
      if [eventTime] != "" {
        date {
          match => ["ts", "MMM dd yyyy HH:mm:ss", "MMM dd yyyy HH:mm:ss ZZ", "ISO8601", "RFC3339"]
          target => "metadata.event_timestamp"
          on_error => "no_eventTime"
        }
      }
      if [start] != "" {
        date {
          match => ["ts", "MMM dd yyyy HH:mm:ss","ISO8601","RFC3339"]
          target => "metadata.event_timestamp"
          on_error => "no_start"
        }
      }
      if [file_product] != "" {
        mutate {
          replace => {
            "file_product_label.key" => "file_product"
            "file_product_label.value.string_value" => "%{file_product}"
          }
          on_error => "no_file_product"
        }
        if ![no_file_product] {
          mutate {
            merge => {
              "additional.fields" => "file_product_label"
            }
            on_error => "no_file_product_merge"
          }
        }
      }
      if [file_vendor] != "" {
        mutate {
          replace => {
            "file_vendor_label.key" => "file_vendor"
            "file_vendor_label.value.string_value" => "%{file_vendor}"
          }
          on_error => "no_file_vendor"
        }
        if ![no_file_vendor] {
          mutate {
            merge => {
              "additional.fields" => "file_vendor_label"
            }
            on_error => "no_file_vendor_merge"
          }
        }
      }
      if [product] == "StellarProtect" {
        if [severity] == "2" {
          mutate {
            replace => {
              "security_result.severity" => "CRITICAL"
            }
            on_error => "no_security_result_severity"
          }
        }
        else if [severity] == "4" {
          mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
            on_error => "no_security_result_severity"
          }
        }
        else if [severity] == "6" {
          mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
            on_error => "no_security_result_severity"
          }
        }
      }
      if [product] == "StellarOne" {
        if [severity] == "2" {
          mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
            on_error => "no_security_result_severity_merge"
          }
        }
        else if [severity] == "4" {
          mutate {
            replace => {
              "security_result.severity" => "LOW"
            }
            on_error => "no_security_result_severity_merge"
          }
        }
        else if [severity] == "6" {
          mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
            on_error => "no_security_result_severity_merge"
          }
        }
        else if [severity] == "7" {
          mutate {
            replace => {
              "security_result.severity" => "ERROR"
            }
            on_error => "no_security_result_severity_merge"
          }
        }
      }
      if [event_id] == "0" and [eventId] != "" {
        mutate{
          replace => {
            "event_id" => "%{eventId}"
          }
          on_error => "no_eventId"
        }
        mutate {
          replace => {
            "metadata.product_log_id" => "%{event_id}"
          }
          on_error => "no_eventId"
        }
      }
      if [event_id] in ["5888", "8193"] {
        mutate {
          replace => {
            "security_result_action" => "ALLOW"
          }
          on_error => "no_security_result_action"
        }
        mutate {
          merge => {
            "security_result.action" => "security_result_action"
          }
          on_error => "no_security_result_action_merge"
        }
      }
      else if [event_id] == "5377" {
        mutate {
          replace => {
            "security_result_action" => "BLOCK"
          }
          on_error => "no_security_result_action"
        }
        mutate {
          merge => {
            "security_result.action" => "security_result_action"
          }
          on_error => "no_security_result_action_merge"
        }
      }
      else if [event_id] == "8194" {
        mutate {
          replace => {
            "security_result_action" => "FAIL"
          }
          on_error => "no_security_result_action"
        }
        mutate {
          merge => {
            "security_result.action" => "security_result_action"
          }
          on_error => "no_security_result_action_merge"
        }
      }
      if [event_name] != "" {
        mutate {
          replace => {
            "metadata.product_event_type" => "%{event_name}"
          }
          on_error => "no_event_name"
        }
      }
      if [event_id] != ""{
        mutate {
          replace => {
            "metadata.product_log_id" => "%{event_id}"
          }
          on_error => "no_event_id_"
        }
      }

      if [msg] != "" {
        mutate {
          replace => {
            "metadata.description" => "%{msg}"
          }
          on_error => "no_msg"
        }
      }
      if [vendor] != "" {
        mutate {
          replace => {
            "metadata.vendor_name" => "%{vendor}"
          }
          on_error => "no_vendor"
        }
      }
      if [product] != "" {
        mutate {
          replace => {
            "metadata.product_name" => "%{product}"
          }
          on_error => "no_product"
        }
      }
      if [version] != "" {
        mutate {
          replace => {
            "metadata.product_version" => "%{version}"
          }
          on_error => "no_version"
        }
      }
      if [dvchost] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{dvchost}"
            "principal.asset.hostname" => "%{dvchost}"
            "has_principal" => "true"
          }
          on_error => "no_dvchost"
        }
      }
      if [deviceExternalId] != "" {
        mutate {
          replace => {
            "principal.asset.asset_id" => "DEVICE:%{deviceExternalId}"
          }
          on_error => "no_deviceExternalId"
        }
      }
      if [serverIP] != "" {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
        grok {
          match => {
            "serverIP" => "%{IP:serverIP}"
          }
          on_error => "invalid_ip"
          overwrite => ["serverIP"]
        }
        if ![invalid_ip] {
          mutate {
            merge => {
              "target.ip" => "serverIP"
              "target.asset.ip" => "serverIP"
            }
            on_error => "no_serverIP"
          }
        }
        else {
          mutate {
            gsub => ["serverIP", " ", ""]
          }
          mutate {
            replace => {
              "target.hostname" => "%{serverIP}"
              "target.asset.hostname" => "%{serverIP}"
              "intermediary.hostname" => "%{serverIP}"
            }
            on_error => "no_serverIP"
          }
        }
      }
      if [dst] != "" {
        grok {
          match => {
            "dst" => "%{IP:dst}"
          }
          on_error => "invalid_ip"
          overwrite => ["dst"]
        }
        if ![invalid_ip] {
          mutate {
            merge => {
              "target.ip" => "dst"
              "target.asset.ip" => "dst"
            }
            on_error => "no_dst"
          }
        }
        if ![no_dst] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
      if [src] != "" {
        grok {
          match => {
            "src" => "%{IP:src}"
          }
          on_error => "invalid_ip"
          overwrite => ["src"]
        }
        if ![invalid_ip] {
          mutate {
            merge => {
              "principal.ip" => "src"
              "principal.asset.ip" => "src"
            }
            on_error => "no_src"
          }
        }
        if ![no_src] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      if [dvc] != "" {
        grok {
          match => {
            "dvc" => "%{IP:dvc}"
          }
          on_error => "invalid_ip"
          overwrite => ["dvc"]
        }
        if ![invalid_ip] {
          mutate {
            merge => {
              "principal.ip" => "dvc"
              "principal.asset.ip" => "dvc"
            }
            on_error => "no_dvc"
          }
        }
        if ![no_dvc] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      if [agentEndpoint] != "" {
        mutate {
          gsub => ["agentEndpoint", " ", ""]
        }
        mutate {
          replace => {
            "principal.hostname" => "%{agentEndpoint}"
            "principal.asset.hostname" => "%{agentEndpoint}"
            "has_principal" => "true"
          }
          on_error => "no_agentEndpoint"
        }
      }
      if [agentIp] != "" {
        mutate {
          merge => {
            "principal.asset.ip" => "%{agentIp}"
            "principal.ip" => "%{agentIp}"
          }
          on_error => "no_agentIp"
        }
        if ![no_agentIp] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      if [agentLocation] != "" {
        mutate {
          replace => {
            "principal.location.name" => "%{agentLocation}"
          }
          on_error => "no_agentLocation"
        }
      }
      if [agentModel] != "" {
        mutate {
          replace => {
            "agentmodel_label.value" => "%{agentModel}"
            "agentmodel_label.key" => "model"
          }
          on_error => "no_agentModel"
        }
        if ![no_agentModel] {
          mutate {
            merge => {
              "principal.asset.attribute.labels" => "agentmodel_label"
            }
            on_error => "no_agentModel"
          }
        }
      }
      if [agentVendor] != "" {
        mutate {
          replace => {
            "agentvendor_label.value" => "%{agentVendor}"
            "agentvendor_label.key" => "vendor"
          }
          on_error => "no_agentVendor"
        }
        if ![no_agentVendor] {
          mutate {
            merge => {
              "principal.asset.attribute.labels" => "agentvendor_label"
            }
            on_error => "no_agentVendor"
          }
        }
      }
      if [agentOS] != "" {
        mutate {
          replace => {
            "principal.platform_version" => "%{agentOS}"
          }
          on_error => "no_agentOS"
        }
      }
      if [accessImagePath] != "" {
        mutate {
          replace => {
            "target.file.full_path" => "%{accessImagePath}"
          }
          on_error => "no_accessImagePath"
        }
      }
      if [accessUser] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{accessUser}"
          }
          on_error => "no_accessUser"
        }
        if ![no_accessUser] {
          mutate {
            replace => {
              "has_user" => "true"
            }
          }
        }
      }
      if [mode] != "" {
        mutate {
          replace => {
            "mode_label.value" => "%{mode}"
            "mode_label.key" => "mode"
          }
          on_error => "no_mode"
        }
        if ![no_mode] {
          mutate {
            merge => {
              "security_result.detection_fields" => "mode_label"
            }
            on_error => "no_mode"
          }
        }
      }
      if [list] != "" {
        mutate {
          replace => {
            "list_label.value" => "%{list}"
            "list_label.key" => "list"
          }
          on_error => "no_list"
        }
        if ![no_list] {
          mutate {
            merge => {
              "security_result.detection_fields" => "list_label"
            }
            on_error => "no_list"
          }
        }
      }
      if [fileHashAllowed] != "" {
        mutate {
          replace => {
            "target.file.sha256" => "%{fileHashAllowed}"
          }
          on_error => "no_fileHashAllowed"
        }
      }
      if [pid] != "" {
        mutate {
          replace => {
            "target.process.pid" => "%{pid}"
          }
          on_error => "no_pid"
        }
      }
      else if [processId] != "" {
        mutate {
          replace => {
            "target.process.pid" => "%{processId}"
          }
          on_error => "no_processId"
        }
      }
      if [vid] != "" {
        mutate {
          replace => {
            "vid_label.value" => "%{vid}"
            "vid_label.key" => "vid"
          }
          on_error => "no_vid"
        }
        if ![no_vid] {
          mutate {
            merge => {
              "security_result.detection_fields" => "vid_label"
            }
            on_error => "no_vid"
          }
        }
      }
      if [sn] != "" {
        mutate {
          replace => {
            "sn_label.value" => "%{sn}"
            "sn_label.key" => "sn"
          }
          on_error => "no_sn"
        }
        if ![no_sn] {
          mutate {
            merge => {
              "security_result.detection_fields" => "sn_label"
            }
            on_error => "no_sn"
          }
        }
      }
      if [ActiveUser] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{ActiveUser}"
          }
          on_error => "no_ActiveUser"
        }
        if ![no_ActiveUser] {
          mutate {
            replace => {
              "has_userid" => "true"
            }
          }
        }
      }
      else if [userName] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{userName}"
          }
          on_error => "no_userName"
        }
        if ![no_userName] {
          mutate {
            replace => {
              "has_userid" => "true"
            }
          }
        }
      }
      else if [suser] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{suser}"
          }
          on_error => "no_suser"
        }
        if ![no_suser] {
          mutate {
            replace => {
              "has_userid" => "true"
            }
          }
        }
      }
      if [userRole] != "" {
        mutate {
          replace => {
            "role.name" => "%{userRole}"
          }
          on_error => "no_userRole"
        }
        if ![no_userRole] {
          mutate {
            merge => {
              "principal.user.attribute.roles" => "role"
            }
            on_error => "no_userRole"
          }
        }
      }
      if [cs1Label] == "clientIpAddress" {
        mutate {
          replace => {
            "clientIp" => "%{cs1}"
          }
          on_error => "no_clientIp"
        }
      }
      if [clientIp] != "" {
        mutate {
          merge => {
            "principal.asset.ip" => "clientIp"
            "principal.ip" => "clientIp"
          }
          on_error => "no_clientIp"
        }
        if ![no_clientIp] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      if [policyVersion] != "" {
        mutate {
          replace => {
            "policyVersion_label.value" => "%{policyVersion}"
            "policyVersion_label.key" => "policyVersion"
          }
          on_error => "no_policyVersion"
        }
        if ![no_policyVersion] {
          mutate {
            merge => {
              "security_result.detection_fields" => "policyVersion_label"
            }
            on_error => "no_policyVersion"
          }
        }
      }
      if [filePath] != "" {
        mutate {
          replace => {
            "target.file.full_path" => "%{filePath}"
          }
          on_error => "no_filePath"
        }
      }
      if [fileHash] != "" {
        mutate {
          replace => {
            "target.file.sha256" => "%{fileHash}"
          }
          on_error => "no_fileHash"
        }
      }
      if [threatType] != "" {
        mutate {
