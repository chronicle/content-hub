# Product: ESET
# Category: EDR
# Supported Format: SYSLOG + JSON
# Reference: N/A
# Last Updated: 2025-08-19
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "jsondata" => ""
      "kv_msg" => ""
      "user_id" => ""
      "desc" => ""
      "process_id" => ""
      "host_name" => ""
      "security_res" => ""
      "threatName" => ""
      "severity" => ""
      "threatType" => ""
      "actionTaken" => ""
      "result" => ""
      "src" => ""
      "dstPort" => ""
      "dst" => ""
      "circumstances" => ""
      "objectUri" => ""
      "proto" => ""
      "processName" => ""
      "srcPort" => ""
      "accountName" => ""
      "date_time" => ""
      "action" => ""
      "hostname" => ""
      "event_type" => ""
      "type" => ""
      "inbound" => ""
      "source_address_type" => ""
      # new fields
      "app" => ""
      "kv_data" => ""
      "Detectiontype" => ""
      "Detection_name" => ""
      "Computer_name" => ""
      "Logged_user" => ""
      "Scanner" => ""
      "Action_performed" => ""
      "Time_of_occurrence" => ""
      "product_event_type" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n" , ""]
  }

  mutate {
    gsub => ["message", "﻿", ""]
  }

  grok {
    match => {
     "message" => [
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:date_time} %{HOSTNAME:host_name} %{GREEDYDATA:user_id} %{INT:process_id} - - %{GREEDYDATA}\\|%{GREEDYDATA:desc}\\|cat=%{GREEDYDATA:type} Event%{GREEDYDATA:kv_msg}",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601} %{HOSTNAME} %{PROG} %{INT} - -.*(?P<jsondata>{.*)",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:date_time} %{DATA:app} %{DATA} %{DATA:process_id} - - %{GREEDYDATA:kv_data}",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts} %{DATA:app} %{DATA} %{DATA:pid} - %{GREEDYDATA:Scanner}"
      ]
    }
    overwrite => ["jsondata","kv_msg", "user_id", "desc", "process_id", "host_name", "threatName", "threatType", "actionTaken", "src", "date_time", "type", "product_event_type", "kv_data", "Scanner", "app"]
    on_error => "header_grok_match_failed"
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [kv_msg] != "" {
    mutate {
      gsub => ["kv_msg", '\\\"', ""]
    }
    mutate {
      gsub => ["kv_msg", "(\\w+)=", "#$1="]
    }

    kv {
      source => "kv_msg"
      field_split => "#"
      value_split => "="
      on_error => "kv_msg_invalid"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "Detection type", "Detectiontype"]
    }
    mutate {
      gsub => ["kv_data", "Detection name", "Detection_name"]
    }
    mutate {
      gsub => ["kv_data", "Computer name", "Computer_name"]
    }
    mutate {
      gsub => ["kv_data", "Time of occurrence", "Time_of_occurrence"]
    }
    mutate {
      gsub => ["kv_data", "Action performed", "Action_performed"]
    }
    mutate {
      gsub => ["kv_data", "Logged user", "Logged_user"]
    }

    mutate {
      gsub => ["kv_data", "([A-Za-z_]+):", "#$1="]
    }
    mutate {
      gsub => ["kv_data", "([0-9A-Za-z_]+)=", "$1="]
    }
    mutate {
      gsub => ["kv_data", " #", "#"]
    }
    mutate {
      gsub => ["kv_data", "= ", "="]
    }

    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "kv_data_invalid"
    }
  }

  if [jsondata] != "" {
    json {
      source => "jsondata"
      array_function => "split_columns"
      on_error => "jsondata_invalid"
    }
    if [event_type] == "Audit_Event" {
      drop {
        tag => "TAG_NO_SECURITY_VALUE"
      }
    }
    date {
        match => ["occured", "dd-MMM-yyyy HH:mm:ss" ]
    }
    if [event_type] == "FirewallAggregated_Event" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.product_name" => "ESET"
           "event1.idm.read_only_udm.metadata.description" => "%{event}"
           "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
           "event1.idm.read_only_udm.network.ip_protocol" => "%{protocol}"
           "event1.idm.read_only_udm.target.hostname" => "%{hostname}"
           "event1.idm.read_only_udm.target.asset.hostname" => "%{hostname}"
           "event1.idm.read_only_udm.principal.process.file.full_path" => "%{process_name}"
           "event1.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
         }
         on_error => "source_data_invalid"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip" => "target_address"
          "event1.idm.read_only_udm.target.asset.ip" => "target_address"
          "event1.idm.read_only_udm.principal.ip" => "source_address"
          "event1.idm.read_only_udm.principal.asset.ip" => "source_address"
        }
        on_error => "ip_merge_failed"
      }
      mutate {
        convert => {
          "target_port" => "integer"
          "source_port" => "integer"
        }
      }
      mutate {
        rename => {
          "target_port" => "event1.idm.read_only_udm.target.port"
          "source_port" => "event1.idm.read_only_udm.principal.port"
        }
      }

      if [severity] in ["INFO","Informational","DEBUG","info"] {
        mutate {
          replace => {
            "security_res.severity" => "INFORMATIONAL"
          }
        }
      } else if [severity] in ["ERROR","error"] {
        mutate {
          replace => {
            "security_res.severity" => "ERROR"
          }
        }
      } else if [severity] in ["WARNING","Warning"] {
        mutate {
          replace => {
            "security_res.severity" => "LOW"
          }
        }
      }
      if [action] =~ "Blocked" {
        mutate {
          replace => {
            "sec_action" => "BLOCK"
          }
          merge => {
           "security_res.action" => "sec_action"
         }
       }
     }
     if [security_res] != "" {
       mutate {
         merge => {
           "event1.idm.read_only_udm.security_result" => "security_res"
         }
       }
     }

     mutate {
       merge => {
         "@output" => "event1"
        }
      }
    }
    else if  [event_type] == "Threat_Event" {
      mutate {
        lowercase => ["hash"]
      }
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
          "event1.idm.read_only_udm.metadata.description" => "%{circumstances}"
          "event1.idm.read_only_udm.metadata.product_log_id" => "%{source_uuid}"
          "evemt1.idm.read_only_udm.metadata.product_name" => "ESET"
          "event1.idm.read_only_udm.metadata.product_version" => "%{engine_version}"
          "event1.idm.read_only_udm.principal.process.file.full_path" => "%{processname}"
          "event1.idm.read_only_udm.target.file.full_path" => "%{object_uri}"
          "event1.idm.read_only_udm.target.file.sha1" => "%{hash}"
          "udm_ip" => "%{ipv4}"
        }
        on_error => "source_field_empty"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "udm_ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "udm_ip"
        }
        on_error => "udm_ip_merge_failed"
      }
      mutate {
        merge => {
          "@output" => "event1"
        }
      }
    }
    mutate {
      replace => {
        "hostdevice.hostname" => "%{hostname}"
      }
    }
    mutate {
      rename => {
        "threat_name" => "event.alert.alert_short_name"
      }
    }
    mutate {
      convert => {
        "ipv4" => "ipaddress"
      }
    }
    mutate {
      merge => {
        "hostdevice.ip_addresses" => "ipv4"
      }
    }

    mutate {
      merge => {
        "event.alert.devices" => "hostdevice"
        "@output" => "event"
      }
    }
  }
  if [kv_msg] != "" {
    if [user_id] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.user.userid" => "%{user_id}"
        }
      }
    }
    if [desc] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.metadata.description" => "%{desc}"
        }
      }
    }
    if [process_id] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.target.process.pid" => "%{process_id}"
        }
      }
    }
    if [host_name] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.principal.hostname" => "%{host_name}"
          "event2.idm.read_only_udm.principal.asset.hostname" => "%{host_name}"
        }
        on_error => "host_name_invalid"
      }
    }
    if [src] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.principal.ip" => "src"
          "event2.idm.read_only_udm.principal.asset.ip" => "src"
        }
        on_error => "src_merge_failed"
      }
    }
    if [dst] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.target.ip" => "dst"
          "event2.idm.read_only_udm.target.asset.ip" => "dst"
        }
        on_error => "dst_ip_merge_failed"
      }
    }
    if [dstPort] != "" {
      mutate {
        convert => {
          "dstPort" => "integer"
        }
      }
      mutate {
        rename => {
          "dstPort" => "event2.idm.read_only_udm.target.port"
        }
      }
    }

    if [srcPort] != "" {
      mutate {
        convert => {
          "srcPort" => "integer"
        }
      }
      mutate {
        rename => {
          "srcPort" => "event2.idm.read_only_udm.principal.port"
        }
      }
    }

    if [circumstances] != "" {
      mutate {
        replace => {
          "additional_circumstances.key" => "circumstances"
          "additional_circumstances.value.string_value" => "%{circumstances}"
         }
       }
       mutate {
         merge => {
          "event2.idm.read_only_udm.additional.fields" => "additional_circumstances"
        }
      }
    }

    if [accountName] != "" {
     mutate {
       replace => {
         "additional_accountName.key" => "accountName"
         "additional_accountName.value.string_value" => "%{accountName}"
       }
     }
     mutate {
       merge => {
         "event2.idm.read_only_udm.additional.fields" => "additional_accountName"
       }
     }
    }

    if [processName] != "" {
      mutate {
        replace => {
           "event2.idm.read_only_udm.target.process.file.full_path" => "%{processName}"
        }
      }
    }

    if [objectUri] != "" {
      mutate {
        replace => {
           "event2.idm.read_only_udm.target.file.full_path" => "%{objectUri}"
        }
      }
    }

    if [proto] != "" {
      mutate {
        replace => {
            "event2.idm.read_only_udm.network.ip_protocol" => "%{proto}"
        }
      }
    }

    if [threatName] != "" {
      mutate {
        replace => {
          "security_res.threat_name" => "%{threatName}"
        }
      }
    }

    if [result] =~ "Success" {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
        merge => {
          "security_res.action" => "sec_action"
        }
      }
    }
    if [action] =~ "Blocked" {
      mutate {
        replace => {
          "sec_action" => "BLOCKED"
        }
        merge => {
          "security_res.action" => "sec_action"
        }
      }
    }
    if [actionTaken] != "" {
      mutate {
        replace => {
          "security_res.action_details" => "%{actionTaken}"
        }
      }
    }
    if [type] != "" {
      mutate {
        replace => {
          "category_details" => "%{type}"
        }
      }
      mutate {
        merge => {
          "security_res.category_details" => "category_details"
        }
      }
    }
    if [security_res] != "" {
      mutate {
        merge => {
          "event2.idm.read_only_udm.security_result" => "security_res"
        }
      }
    }

    if [date_time] != "" {
      date {
        match => ["date_time", "RFC3339", "TIMESTAMP_ISO8601"]
      }
    }

    if [actionTaken] == "Cleaned by deleting" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.metadata.event_type" => "SCAN_PROCESS"
        }
      }
    } else if [host_name] != "" {
      mutate {
        replace => {
          "event2.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else {
      mutate {
        replace => {
          "event2.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      replace => {
        "event2.idm.read_only_udm.metadata.vendor_name" => "ESET"
        "event2.idm.read_only_udm.metadata.product_name" => "EDR"
      }
    }
    mutate {
      merge => {
        "@output" => "event2"
      }
    }
  }

  if [kv_data] != "" or [Scanner] != "" {
    mutate {
      replace => {
        "principal_machine_id_present" => "false"
        "principal_user_present" => "false"
        "security_res" => ""
        "metadata_event_type" => ""
      }
    }

    if [date_time] != "" {
      date {
        match => ["date_time", "RFC3339", "ISO8601"]
        on_error => "date_match_failed"
      }
    }

    if [Detectiontype] != "" {
      mutate {
        merge => {
          "security_res.category_details" => "Detectiontype"
        }
        on_error => "Detectiontype_invalid"
      }
    }

    if [Time_of_occurrence] != "" {
      mutate {
        replace => {
          "occurrence_time_label.key" => "Time_of_occurrence"
          "occurrence_time_label.value.string_value" => "%{Time_of_occurrence}"
        }
        on_error => "Time_of_occurrence_invalid"
      }
      if ![Time_of_occurrence_invalid] {
        mutate {
          merge => {
            "event3.idm.read_only_udm.additional.fields" => "occurrence_time_label"
          }
          on_error => "occurrence_time_label_merge_failed"
        }
      }
    }

    if [Detection_name] != "" {
      mutate {
        replace => {
          "security_res.threat_name" => "%{Detection_name}"
        }
        on_error => "Detection_name_invalid"
      }
    }

    if [Computer_name] != "" {
      mutate {
        replace => {
          "event3.idm.read_only_udm.principal.hostname" => "%{Computer_name}"
          "event3.idm.read_only_udm.principal.asset.hostname" => "%{Computer_name}"
          "principal_machine_id_present" => "true"
        }
        on_error => "Computer_name_invalid"
      }
    }

    if [Logged_user] != "" {
      mutate {
        replace => {
          "event3.idm.read_only_udm.principal.user.userid" => "%{Logged_user}"
          "principal_user_present" => "true"
        }
        on_error => "Logged_user_invalid"
      }
    }

    if [Scanner] != "" {
      mutate {
        replace => {
          "security_res.description" => "%{Scanner}"
        }
        on_error => "Scanner_invalid"
      }
    }
    else {
      mutate {
        replace => {
          "security_res.description" => "%{kv_data}"
        }
        on_error => "kv_data_invalid_2"
      }
    }

    if [Action_performed] != "" {
      mutate {
        replace => {
          "security_res.action_details" => "%{Action_performed}"
        }
        on_error => "Action_performed_invalid"
      }
    }

    if [app] != "" {
      mutate {
        replace => {
          "event3.idm.read_only_udm.principal.application" => "%{app}"
        }
        on_error => "app_invalid"
      }
    }

    if [process_id] != "" {
      mutate {
        replace => {
          "event3.idm.read_only_udm.principal.process.pid" => "%{process_id}"
        }
        on_error => "process_id_invalid"
      }
    }

    if [security_res] != "" {
      mutate {
        merge => {
          "event3.idm.read_only_udm.security_result" => "security_res"
        }
        on_error => "security_res_merge_failed"
      }
    }

    if [principal_user_present] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [principal_machine_id_present] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_event_type" => "GENERIC_EVENT"
        }
      }
    }

    if [metadata_event_type] != "" {
      mutate {
        replace => {
          "event3.idm.read_only_udm.metadata.event_type" => "%{metadata_event_type}"
        }
        on_error => "metadata_event_type_invalid"
      }
    }

    mutate {
      replace => {
        "event3.idm.read_only_udm.metadata.vendor_name" => "ESET"
        "event3.idm.read_only_udm.metadata.product_name" => "EDR"
      }
    }

    mutate {
      merge => {
        "@output" => "event3"
      }
    }
  }
}
