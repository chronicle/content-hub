# Product: SYMANTEC_MAIL
# Category: Email server log types.
# Supported Format:JSON
# Reference: N/A
# Last Updated: 2025-12-22
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "priority" => ""
      "metadata" => ""
      "additional" => ""
      "target" => ""
      "security_result" => ""
      "network" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "emailInfo.xMsgRef" => ""
      "emailInfo.longMsgRef" => ""
      "emailInfo.messageId" => ""
      "emailInfo.isOutbound" => ""
      "emailInfo.messageSize" => ""
      "emailInfo.mailProcessingStartTime" => ""
      "emailInfo.subject" => ""
      "emailInfo.envFrom" => ""
      "emailInfo.headerFrom" => ""
      "emailInfo.envTo" => ""
      "emailInfo.headerTo" => ""
      "emailInfo.HELOString" => ""
      "emailInfo.authResults.raw_header" => ""
      "emailInfo.authResults.dkim" => ""
      "emailInfo.authResults.dkim_signing_domain" => ""
      "emailInfo.authResults.spf" => ""
      "emailInfo.authResults.dmarc" => ""
      "emailInfo.authResults.dmarc_policy" => ""
      "emailInfo.authResults.dmarc_override_action" => ""
      "emailInfo.filesAndLinks" => ""
      "emailInfo.tlsInfo.tlsAdvertised" => ""
      "emailInfo.tlsInfo.tlsUsed" => ""
      "emailInfo.tlsInfo.tlsPolicy" => ""
      "emailInfo.tlsInfo.tlsProtocol" => ""
      "emailInfo.tlsInfo.tlsCipher" => ""
      "emailInfo.tlsInfo.tlsKeyLength" => ""
      "emailInfo.tlsInfo.tlsFallbackReason" => ""
      "emailInfo.tlsInfo.tlsForwardSecrecy" => ""
      "emailInfo.tlsInfo.tlsNegotiationFailed" => ""
      "emailInfo.avQuarantinePenId" => ""
      "emailInfo.rawHeaderFrom" => ""
      "emailInfo.headerReplyTo" => ""
      "emailInfo.senderIp" => ""
      "emailInfo.senderMailserver" => ""
      "emailInfo.country" => ""
      "emailInfo.newDomainAge" => ""
      "emailInfo.timeInCynicSandboxMs" => ""
      "incidents" => ""
      "email_from_present" => "false"
      "email_to_present" => "false"
      "hostname" => ""
      "process" => ""
      "pid" => ""
      "tag" => ""
      "loglevel" => ""
      "log_id" => ""
      "internal_id" => ""
      "ruleset" => ""
      "ttl" => ""
      "source" => ""
      "url" => ""
      "allow_redirect" => ""
      "status" => ""
      "timestamp" => ""
      "msg_timestamp" => ""
      "transaction_id" => ""
      "description" => ""
      "component" => ""
      "msg_code" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    grok {
      match => {
        "message" => [
          "<%{POSINT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{WORD:process}\\[%{POSINT:pid}\\]: \\[%{WORD:tag}\\] \\(%{LOGLEVEL:loglevel}:%{DATA:log_id}\\): \\[%{POSINT:internal_id}\\] Using TTL: %{GREEDYDATA:message}",
          "<%{POSINT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{WORD:process}\\[%{POSINT:pid}\\]: \\[%{WORD:tag}\\] \\(%{LOGLEVEL:loglevel}:%{DATA:log_id}\\): \\[%{POSINT:internal_id}\\] Completed request: ruleset=%{WORD:ruleset} url=%{URI:url} timestamp=%{POSINT:msg_timestamp} allow_redirect=%{WORD:allow_redirect} status=%{POSINT:status}",
          "<%{POSINT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{WORD:process}\\[%{POSINT:pid}\\]: \\[%{WORD:tag}\\] \\(%{WORD:loglevel}:%{DATA:log_id}\\): \\[%{POSINT:internal_id}\\] \\[%{DATA:transaction_id}\\] (?<component>.*?): %{GREEDYDATA:description}",
          "<%{POSINT:priority}>%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{WORD:process}\\[%{POSINT:pid}\\]: %{DATA:msg_code} %{GREEDYDATA:description}"
        ]
      }
      overwrite => ["priority", "timestamp", "hostname", "process", "pid", "tag", "loglevel", "log_id", "internal_id", "message", "ruleset", "url", "allow_redirect", "status", "syslog_priority", "component", "transaction_id", "description", "msg_code", "msg_timestamp"]
      on_error => "not_syslog"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "host_not_found"
    }
  }
  if [priority] != "" {
    mutate {
      replace => {
        "priority_label.value" => "%{priority}"
        "priority_label.key" => "priority"
      }
      on_error => "no_priority"
    }
    if ![no_priority] {
      mutate {
        merge => {
          "metadata.ingestion_labels" => "priority_label"
        }
        on_error => "priority_label_not_found"
      }
    }
  }
  if [process] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.process.file.names" => "process"
      }
      on_error => "no_process"
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
      on_error => "pid_empty"
    }
  }
  if [tag] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{tag}"
      }
      on_error => "no_tag"
    }
  }
  if [loglevel] != "" {
    if [loglevel] == "INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
        on_error => "info_not_mapped"
      }
    } else if [loglevel] == "WARN" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
        on_error => "warn_not_mapped"
      }
    } else if [loglevel] == "ERROR" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
        on_error => "error_not_mapped"
      }
    } else {
      mutate {
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
        on_error => "loglevel_not_mapped"
      }
    }
  }
  if [log_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{log_id}"
      }
      on_error => "no_log_id"
    }
  }
  if [internal_id] != "" {
    mutate {
      replace => {
        "internal_id_label.value.string_value" => "%{internal_id}"
      }
      on_error => "internal_id_label_not_present"
    }
    if ![internal_id_label_not_present] {
      mutate {
        replace => {
          "internal_id_label.key" => "internal_id"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "internal_id_label"
        }
        on_error => "internal_id_label_not_found"
      }
    }
  }

  kv {
    source => "message"
    field_split => " "
    value_split => "="
    include_keys => ["ruleset", "ttl", "source"]
    trim_key => " "
  }
  if [ruleset] != "" {
    mutate {
      replace => {
        "ruleset_label.key" => "ruleset"
        "ruleset_label.value.string_value" => "%{ruleset}"
      }
      on_error => "no_ruleset"
    }
    if ![no_ruleset] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "ruleset_label"
        }
        on_error => "no_additional_ruleset"
      }
    }
  }
  if [ttl] != "" {
    mutate {
      replace => {
        "ttl_label.key" => "ttl"
        "ttl_label.value.string_value" => "%{ttl}"
      }
      on_error => "no_ttl"
    }
    if ![no_ttl] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "ttl_label"
        }
        on_error => "no_additional_ttl"
      }
    }
  }
  if [source] != "" {
    mutate {
      replace => {
        "source_label.key" => "source"
        "source_label.value.string_value" => "%{source}"
      }
      on_error => "no_source"
    }
    if ![no_source] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "source_label"
        }
        on_error => "no_additional_source"
      }
    }
  }
  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
      on_error => "url_empty"
    }
  }
  if [allow_redirect] != "" {
    mutate {
      replace => {
        "allow_redirect_label.value.string_value" => "%{allow_redirect}"
      }
      on_error => "allow_redirect_label_not_present"
    }
    if ![allow_redirect_label_not_present] {
      mutate {
        replace => {
          "allow_redirect_label.key" => "allow_redirect"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "allow_redirect_label"
        }
        on_error => "allow_redirect_label_not_found"
      }
    }
  }
  if [status] != "" {
    mutate {
      convert => {
        "status" => "string"
      }
      on_error => "status_not_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{status}"
      }
      on_error => "status_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "status_not_integer"
    }
  }
  if [transaction_id] != "" {
    mutate {
      replace => {
        "transaction_id_label.value.string_value" => "%{transaction_id}"
      }
      on_error => "transaction_id_label_not_present"
    }
    if ![transaction_id_label_not_present] {
      mutate {
        replace => {
          "transaction_id_label.key" => "transaction_id"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "transaction_id_label"
        }
        on_error => "transaction_id_label_not_found"
      }
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }
  if [component] != "" {
    mutate {
      replace => {
        "component_label.value.string_value" => "%{component}"
      }
      on_error => "component_label_not_present"
    }
    if ![component_label_not_present] {
      mutate {
        replace => {
          "component_label.key" => "component"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "component_label"
        }
        on_error => "component_label_not_found"
      }
    }
  }
  if [msg_code] != "" {
    mutate {
      replace => {
        "msg_code_label.value.string_value" => "%{msg_code}"
      }
      on_error => "msg_code_label_not_present"
    }
    if ![msg_code_label_not_present] {
      mutate {
        replace => {
          "msg_code_label.key" => "msg_code"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "msg_code_label"
        }
        on_error => "msg_code_label_not_found"
      }
    }
  }
  if [emailInfo][xMsgRef] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{emailInfo.xMsgRef}"
      }
      on_error => "no_xMsgRef"
    }
  }
  if [emailInfo][longMsgRef] != "" {
    mutate {
      replace => {
        "emailInfo_longMsgRef_label.key" => "emailInfo_longMsgRef"
        "emailInfo_longMsgRef_label.value.string_value" => "%{emailInfo.longMsgRef}"
      }
      on_error => "no_longMsgRef"
    }
    if ![no_longMsgRef] {
      mutate {
        merge => {
          "additional.fields" => "emailInfo_longMsgRef_label"
        }
        on_error => "no_additional_longMsgRef"
      }
    }
  }
  if [emailInfo][messageId] != "" {
    mutate {
      replace => {
        "emailInfo_messageId_label.key" => "emailInfo_messageId"
        "emailInfo_messageId_label.value.string_value" => "%{emailInfo.messageId}"
      }
      on_error => "no_messageId"
    }
    if ![no_messageId] {
      mutate {
        merge => {
          "additional.fields" => "emailInfo_messageId_label"
        }
        on_error => "no_additional_messageId"
      }
    }
  }
  if [emailInfo][isOutbound] != "" {
    mutate {
      convert => {
        "emailInfo.isOutbound" => "string"
      }
      on_error => "no_isOutbound"
    }
    mutate {
      replace => {
        "emailInfo_isOutbound_label.key" => "emailInfo_isOutbound"
        "emailInfo_isOutbound_label.value.string_value" => "%{emailInfo.isOutbound}"
      }
      on_error => "no_isOutbound"
    }
    if ![no_isOutbound] {
      mutate {
        merge => {
          "additional.fields" => "emailInfo_isOutbound_label"
        }
        on_error => "no_additional_isOutbound"
      }
    }
  }
  if [emailInfo][mailProcessingStartTime] != "" {
    mutate {
      convert => {
        "emailInfo.mailProcessingStartTime" => "string"
      }
      on_error => "already_string"
    }
    date {
      match => ["emailInfo.mailProcessingStartTime", "UNIX"]
      target => "metadata.event_timestamp"
      on_error => "no_mailProcessingStartTime"
    }
  }
  else if [timestamp] != "" {
    mutate {
      strip => ["timestamp"]
    }
    date {
      match => ["timestamp", "MMM dd HH:mm:ss", "ISO8601"]
      target => "metadata.event_timestamp"
      rebase => true
      on_error => "grok_ts_failed"
    }
    if [grok_ts_failed] {
      date {
        match => ["@timestamp", "ISO8601"]
        target => "metadata.event_timestamp"
        on_error => "no_timestamp"
      }
    }
  }
  else {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "no_timestamp"
    }
  }
  if [emailInfo][subject] != "" {
    mutate {
      merge => {
        "network.email.subject" => "emailInfo.subject"
      }
      on_error => "no_subject"
    }
  }
  if [emailInfo][envFrom] != "" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "emailInfo.envFrom"
      }
      on_error => "no_envFrom"
    }
  }
  if [emailInfo][headerFrom] != "" and [emailInfo][headerFrom] =~ "^.+@.+$" {
    mutate {
      replace => {
        "network.email.from" => "%{emailInfo.headerFrom}"
      }
      on_error => "no_headerFrom"
    }
    if ![no_headerFrom] {
      mutate {
        replace => {
          "email_from_present" => "true"
        }
        on_error => "no_headerFrom"
      }
    }
  }
  if [emailInfo][envTo] != "" {
    for to in emailInfo.envTo {
      if [to] =~ "^.+@.+$" {
        mutate {
          replace => {
            "target_email" => "%{to}"
          }
          on_error => "no_To"
        }
         mutate {
          merge => {
            "network.email.to" => "target_email"
          }
          on_error => "no_envTo"
        }
      }
    }
  }
  if [emailInfo][headerTo] != "" {
    for to in emailInfo.headerTo {
      if [to] =~ "^.+@.+$" {
        mutate {
          replace => {
           "target_email_header" => "%{to}"
          }
          on_error => "no_header_To"
        }
        mutate {
          merge => {
            "network.email.to" => "target_email_header"
          }
          on_error => "no_headerTo"
        }
        if ![no_headerTo] {
          mutate {
            replace => {
              "email_to_present" => "true"
            }
            on_error => "no_target"
          }
        }
      }
    }
  }

  if [emailInfo][senderMailserver] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{emailInfo.senderMailserver}"
      }
      on_error => "no_senderMailserver"
    }
    if ![no_senderMailserver] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
        on_error => "no_principal"
      }
    }
  }
  if [emailInfo][HELOString] != "" {
    mutate {
      replace => {
        "emailInfo_HELOString_label.key" => "emailInfo_HELOString"
        "emailInfo_HELOString_label.value.string_value" => "%{emailInfo.HELOString}"
      }
      on_error => "no_HELOString"
    }
    if ![no_HELOString] {
      mutate {
        merge => {
          "additional.fields" => "emailInfo_HELOString_label"
        }
        on_error => "no_additional_HELOString"
      }
    }
  }
  if [emailInfo][authResults][raw_header] != "" {
    mutate {
      replace => {
        "auth_results_raw_header_label.key" => "Authentication_Results_raw_header"
        "auth_results_raw_header_label.value.string_value" => "%{emailInfo.authResults.raw_header}"
      }
      on_error => "no_authResults_raw_header"
    }
    if ![no_authResults_raw_header] {
      mutate {
        merge => {
          "additional.fields" => "auth_results_raw_header_label"
        }
        on_error => "no_additional_authResults_raw_header"
      }
    }
  }
  if [emailInfo][authResults][dkim] != "" {
    mutate {
      replace => {
        "auth_dkim_label.key" => "emailInfo_authResults_dkim"
        "auth_dkim_label.value.string_value" => "%{emailInfo.authResults.dkim}"
      }
      on_error => "no_authResults_dkim"
    }
    if ![no_authResults_dkim] {
      mutate {
        merge => {
          "additional.fields" => "auth_dkim_label"
        }
        on_error => "no_additional_authResults_dkim"
      }
    }
  }

  if [emailInfo][authResults][dkim_signing_domain] != "" {
    mutate {
      replace => {
        "auth_dkim_domain_label.key" => "dkim_signing_domain"
        "auth_dkim_domain_label.value.string_value" => "%{emailInfo.authResults.dkim_signing_domain}"
      }
      on_error => "no_authResults_dkim_signing_domain"
    }
    if ![no_authResults_dkim_signing_domain] {
      mutate {
        merge => {
          "additional.fields" => "auth_dkim_domain_label"
        }
        on_error => "no_additional_authResults_dkim_signing_domain"
      }
    }
  }
  if [emailInfo][authResults][spf] != "" {
    mutate {
      replace => {
        "auth_spf_label.key" => "emailInfo_authResults_spf"
        "auth_spf_label.value.string_value" => "%{emailInfo.authResults.spf}"
      }
      on_error => "no_authResults_spf"
    }
    if ![no_authResults_spf] {
      mutate {
        merge => {
          "additional.fields" => "auth_spf_label"
        }
        on_error => "no_additional_authResults_spf"
      }
    }
  }
  if [emailInfo][authResults][dmarc] != "" {
    mutate {
      replace => {
        "auth_dmarc_label.key" => "emailInfo_authResults_dmarc"
        "auth_dmarc_label.value.string_value" => "%{emailInfo.authResults.dmarc}"
      }
      on_error => "no_authResults_dmarc"
    }
    if ![no_authResults_dmarc] {
      mutate {
        merge => {
          "additional.fields" => "auth_dmarc_label"
        }
        on_error => "no_additional_authResults_dmarc"
      }
    }
  }
  if [emailInfo][authResults][dmarc_policy] != "" {
    mutate {
      replace => {
        "auth_dmarc_policy_label.key" => "auth_dmarc_policy"
        "auth_dmarc_policy_label.value.string_value" => "%{emailInfo.authResults.dmarc_policy}"
      }
      on_error => "no_authResults_dmarc_policy"
    }
    if ![no_authResults_dmarc_policy] {
      mutate {
        merge => {
          "additional.fields" => "auth_dmarc_policy_label"
        }
        on_error => "no_additional_authResults_dmarc_policy"
      }
    }
  }

  if [emailInfo][authResults][dmarc_override_action] != "" {
    mutate {
      replace => {
        "auth_dmarc_override_action.key" => "dmarc_override_action"
        "auth_dmarc_override_action.value.string_value" => "%{emailInfo.authResults.dmarc_override_action}"
      }
      on_error => "no_authResults_dmarc_override_action"
    }
    if ![no_authResults_dmarc_override_action] {
      mutate {
        merge => {
          "additional.fields" => "auth_dmarc_override_action"
        }
        on_error => "no_additional_authResults_dmarc_override_action"
      }
    }
  }
  for file in emailInfo.filesAndLinks {
    mutate {
      replace => {
        "file.urlCategories" => ""
        "file.urlRiskScore" => ""
      }
    }
    if [file][nodeType] == "FILE_INCLUDED" {
      mutate {
        replace => {
          "about" => ""
        }
      }
      if [file][fileNameOrURL] != "" {
        mutate {
          replace => {
            "about.file.full_path" => "%{file.fileNameOrURL}"
          }
          on_error => "no_fileNameOrURL"
        }
      }
      if [file][fileSize] != "" {
        mutate {
          convert => {
            "file.fileSize" => "string"
          }
          on_error => "no_fileSize"
        }
        mutate {
          replace => {
            "about.file.size" => "%{file.fileSize}"
          }
          on_error => "no_fileSize"
        }
         mutate {
          convert => {
            "about.file.size" => "uinteger"
          }
          on_error => "file_size_conversion_error"
        }
      }
      if [file][fileType] != "" {
        mutate {
          replace => {
            "about.file.mime_type" => "%{file.fileType}"
          }
          on_error => "no_fileType"
        }
      }
      if [file][md5] != "" {
        mutate {
          replace => {
            "about.file.md5" => "%{file.md5}"
          }
          on_error => "no_md5"
        }
      }
      if [file][sha256] != "" {
        mutate {
          replace => {
            "about.file.sha256" => "%{file.sha256}"
          }
          on_error => "no_sha256"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about"
        }
        on_error => "no_about"
      }
    }
    else if [file][nodeType] == "LINK_INCLUDED" {
       mutate {
        replace => {
          "about" => ""
        }
      }
      if [file][fileNameOrURL] != "" {
        mutate {
          replace => {
            "about.url" => "%{file.fileNameOrURL}"
          }
          on_error => "no_fileNameOrURL"
        }
      }
      for index,category in file.urlCategories {
        mutate {
          convert => {
            "index" => "string"
          }
          on_error => "index_conversion_error"
        }
        mutate {
          replace => {
            "url_category_labels" => ""
          }
        }
        if [category] not in ["", "null"] {
          mutate {
            replace => {
              "url_category_labels.key" => "url_category_%{index}"
              "url_category_labels.value" => "%{category}"
            }
            on_error => "no_url_category"
          }
          mutate {
            merge => {
             "about.labels" => "url_category_labels"
            }
          }
        }
      }
      if [file][urlRiskScore] not in ["", "null"] {
         mutate {
          convert => {
            "file.urlRiskScore" => "string"
           }
        }
        mutate {
          replace => {
            "url_riskScore_label" => ""
          }
        }
        mutate {
          replace => {
            "url_riskScore_label.key" => "url_riskScore_%{index}"
            "url_riskScore_label.value" => "%{file.urlRiskScore}"
          }
          on_error => "no_url_riskScore"
        }
        if ![no_url_riskScore] {
          mutate {
            merge => {
             "about.labels" => "url_riskScore_label"
            }
            on_error => "no_url_riskScore"
          }
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about"
        }
        on_error => "no_about"
      }
    }
