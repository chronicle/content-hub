    }
  }
  if [attachments] != "" {
    mutate {
      replace => {
        "additional_attmnt.key" => "attachments"
        "additional_attmnt.value.string_value" => "%{attachments}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_attmnt"
      }
    }
  }
  if [cipher] not in ["","NONE"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.cipher" => "%{cipher}"
      }
    }
  }
  if [tls_version] != "" or [version] != "" {
    if [tls_version] not in ["","NONE"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.version" => "%{tls_version}"
        }
      }
    }
    else if [version] =~ "TLS" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.version" => "%{version}"
        }
      }
    }
  }
  if [hops] != "" {
    mutate {
      replace => {
        "additional_hops.key" => "hops"
        "additional_hops.value.string_value" => "%{hops}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_hops"
      }
    }
  }
  if [routes] != "" {
    mutate {
      replace => {
        "additional_routs.key" => "routes"
        "additional_routs.value.string_value" => "%{routes}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_routs"
      }
    }
  }
  if [notroutes] != "" {
    mutate {
      replace => {
        "additional_nrouts.key" => "notroutes"
        "additional_nrouts.value.string_value" => "%{notroutes}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_nrouts"
      }
    }
  }
  if [eid] != "" {
    mutate {
      replace => {
        "additional_eid.key" => "eid"
        "additional_eid.value.string_value" => "%{eid}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_eid"
      }
    }
  }
  if [querydepth] != "" {
    mutate {
      replace => {
        "additional_qdep.key" => "querydepth"
        "additional_qdep.value.string_value" => "%{querydepth}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_qdep"
      }
    }
  }
  if [selector] != "" {
    mutate {
      replace => {
        "additional_slct.key" => "selector"
        "additional_slct.value.string_value" => "%{selector}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_slct"
      }
    }
  }
  if [spamscore] != "" {
    mutate {
      replace => {
        "additional_spsc.key" => "spamscore"
        "additional_spsc.value.string_value" => "%{spamscore}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_spsc"
      }
    }
  }
  if [phishscore] != "" {
    mutate {
      replace => {
        "additional_pssc.key" => "phishscore"
        "additional_pssc.value.string_value" => "%{phishscore}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_pssc"
      }
    }
  }
  if [mod] != "" {
    mutate {
      replace => {
        "additional_mod.key" => "module"
        "additional_mod.value.string_value" => "%{mod}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_mod"
      }
    }
  }
  if [status] != "" {
    mutate {
      replace => {
        "additional_sts.key" => "status"
        "additional_sts.value.string_value" => "%{status}"
      }
      on_error => "status_not_present"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_sts"
      }
    }
  }
  if [rule] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{rule}"
      }
    }
  }
  if [folder] != "" {
    mutate {
      replace => {
        "additional_folder.key" => "folder"
        "additional_folder.value.string_value" => "%{folder}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_folder"
      }
    }
  }

  if [size] != "" {
    mutate {
      convert => {
        "size" => "uinteger"
      }
    }
    mutate {
      rename => {
        "size" => "event.idm.read_only_udm.principal.process.file.size"
      }
    }
  }
  if [file] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{file}"
      }
    }
  }
  if [name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{name}"
      }
    }
  }
  if [s] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{s}"
      }
    }
  }
  if [proto] != "" {
    if [proto] == "ESMTP" {
      mutate {
        replace => {
          "proto" => "SMTP"
        }
      }
    }
    if [proto] not in ["DSN","RELAY","LOCAL","FILE","*FILE*"] {
      if [proto] !~ "ESMTP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "%{proto}"
          }
          on_error => "proto_not_present"
        }
      }
    }
  }
  if [guid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" => "GUID: %{guid}"
      }
    }
  }
  if [mime] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.mime_type" => "%{mime}"
      }
    }
  }
  if [cmd] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.command_line" => "%{cmd}"
      }
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
    }
  }
  else if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{process_id}"
      }
    }
  }
  if [country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{country}"
      }
    }
  }
  if [host] =~ "^(.){1,255}$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
      }
      on_error => "host_empty"
    }
  }
  if [domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
      }
    }
  }
  if [engine] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{engine}"
      }
    }
  }
  if [m] != "" and [relay] !~ "(^m.)" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.mail_id" => "%{m}"
      }
    }
  }
  if [hfrom] != "" {
    if [hfrom] =~ "<|>" {
      mutate {
        gsub => ["hfrom", "<|>", ""]
      }
    }
    if [hfrom] =~ "^.+@.+$"{
      mutate {
        replace => {
          "event.idm.read_only_udm.network.email.from" => "%{hfrom}"
        }
        on_error => "hfrom_empty"
      }
    }
  }
  if [from] != "" {
    if [from] =~ "<|>" {
      mutate {
        gsub => ["from", "<|>", ""]
      }
    }
    if [from] =~ "^.+@.+$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.email.from" => "%{from}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "additional_from.key" => "From"
          "additional_from.value.string_value" => "%{from}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_from"
        }
      }
    }
  }
  if [to] != "" {
    mutate {
      gsub => ["to", "<|>", ""]
    }
    mutate {
      replace => {
        "to" =>
        "{\"to\":[\"%{to}\"]}"
      }
      gsub => ["to", ",", "\",\""]
    }
    mutate {
      gsub => ["to","#",""]
    }

    mutate {
      gsub => ["to", "\"\"", "\""]
    }
    mutate {
      gsub => ["to", "\"@", "@"]
    }

    json {
      source => "to"
      array_function => "split_columns"
      on_error => "to_empty"
    }
    for indx in to {
      mutate {
        gsub => ["indx","\\[|\\]", ""]
      }

      grok {
        match => {
          "indx" =>
          ["(?P<email_details>[\\w.+=:-]+@[0-9A-Za-z][0-9A-Za-z-]{0,62}(?:[.](?:[0-9A-Za-z][0-9A-Za-z‌-]{0,62}))*)"]
        }
        overwrite => ["email_details"]
        on_error => "email_parsing_error"

      }
      if [indx] != "" and ![email_parsing_error] {
        mutate {
          gsub => ["indx", ";", ""]
        }
        if [indx] =~ "^.+@.+$" {
          mutate {
            merge => {
              "event.idm.read_only_udm.network.email.to" => "indx"
            }
            on_error => "to_empty"
          }
        }
      }
    }
  }

  if [rcpt] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.to" => "rcpt"
      }
    }
  }
  if [subject] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.subject" => "subject"
      }
    }
  }
  if [ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip"
        "event.idm.read_only_udm.principal.asset.ip" => "ip"
      }
      on_error => "ip_empty"
    }
  }
  if [action] != "" {
    if [action] in ["add-header", "get_dns_answer", "sign"] {
      mutate {
        replace => {
          "act" => "ALLOW_WITH_MODIFICATION"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "act"
        }
      }
    }
    else if [action] in ["continue", "execute"] {
      mutate {
        replace => {
          "act" => "ALLOW"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "act"
        }
      }
    }
    else if [action] in ["discard", "incomplete", "set-spam-classifier"] {
      mutate {
        replace => {
          "act" => "BLOCK"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "act"
        }
      }
    }
    else if [action] == "quarantine" {
      mutate {
        replace => {
          "act" => "QUARANTINE"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "act"
        }
      }
    }
    else {
      mutate {
        replace => {
          "act" => "UNKNOWN_ACTION"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "act"
        }
      }
    }
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
    }
  }
  if [classifier] != "" {
    if [classifier] == "malware" {
      mutate {
        replace => {
          "category" => "SOFTWARE_MALICIOUS"
        }
      }
      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }
    }
    else if [classifier] == "phish" {
      mutate {
        replace => {
          "category" => "MAIL_PHISHING"
        }
      }
      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }
    }
    else if [classifier] == "spam" {
      mutate {
        replace => {
          "category" => "MAIL_SPAM"
        }
      }
      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }
    }
    else if [classifier] == "parse_limit" or [classifier] == "scan_limit" {
      mutate {
        replace => {
          "category" => "EXPLOIT"
        }
      }
      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }
    }
    else {
      mutate {
        replace => {
          "category" => "UNKNOWN_CATEGORY"
        }
      }
      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }
    }
  }
  if [hops-ip] != "" or lip != "" {
    if [hops-ip] != "" {
      mutate {
        merge => {
          "intermediary.ip" => "hops-ip"
        }
      }
    }
    if [lip] != "" {
      mutate {
        merge => {
          "intermediary.ip" => "lip"
        }
      }
    }
  }

  if [class] != "" {
    mutate {
      replace => {
        "class_label.key" => "Class"
        "class_label.value" => "%{class}"
      }
      merge => {
        "security_result.detection_fields" => "class_label"
      }
    }
  }
  if [msgid] != "" {
    mutate {
      gsub => ["msgid", "<|>", ""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.mail_id" => "%{msgid}"
      }
      on_error => "msgid_empty"
    }
  }
  if [auth] not in ["","NONE"] {
    mutate {
      replace => {
           "event.idm.read_only_udm.extensions.auth.type" => "%{auth}"
      }
    }
  }
 grok {
    match => {
      "relay" => "(?P<domain>.*)\\s+\\[%{IP:interm_ip}\\]"
    }
    overwrite => ["domain","interm_ip"]
    on_error => "_is_principal_domain"
  }
  if [domain] != "" and [interm_ip] != "" {
    mutate {
      gsub => ["domain", "\\[|\\]", ""]
    }
    if [domain] == [interm_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "interm_ip"
        }
      }
    }
    else {
      mutate {
        replace => {
          "intermediary.administrative_domain" => "%{domain}"
        }
      }
      mutate {
        merge => {
          "intermediary.ip" => "interm_ip"
        }
      }
    }
  }
  else if [interm_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "interm_ip"
      }
    }
  }
  else if [message] != "" {
    grok {
      match => {
        "message" => ["\\[%{IP:srcip}\\]"]
      }
      overwrite => ["srcip"]
      on_error => "ip_not_parsing"
    }
    if [srcip] != "" and ![ip_not_parsing] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "srcip"
          "event.idm.read_only_udm.principal.asset.ip" => "srcip"
        }
        on_error => "srcip_empty"
      }
    }
  }
  if [delay] != "" {
    mutate {
      replace => {
        "about_delay.key" => "delay"
        "about_delay.value" => "%{delay}"
      }
      on_error => "delay_not_mapped"
    }

    if ![delay_not_mapped] {
      mutate {
        merge => {
          "about.resource.attribute.labels" => "about_delay"
        }
      }
    }
  }
  if [verify] != "" or [tls_verify] != "outbound" {
    if [verify] != "" {
      mutate {
        replace => {
          "tls_verify" => "%{verify}"
        }
      }
    }
    if [tls_verify] == "FAIL" {
      mutate {
        replace => {
          "security_action" => "BLOCK"
        }
      }
    }
    else if [tls_verify] == "OK" {
      mutate {
        replace => {
          "security_action" => "ALLOW"
        }
      }
    }
  }
  if [security_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_action"
      }
    }
  }
  if [mailer] != "" {
    mutate   {
      uppercase => ["mailer"]
    }
    if [mailer] == "ESMTP" {
      mutate {
        replace => {
          "mailer" => "SMTP"
        }
      }
    }
    if [mailer] not in ["DSN","RELAY","LOCAL","FILE","*FILE*"] {
      if [mailer] !~ "ESMTP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "%{mailer}"
          }
          on_error => "mailer_empty"
        }
      }
    }
  }

  if [stat] != "" {
    grok {
      match => {
        "message" => "stat=%{GREEDYDATA:security_desc}"
      }
      overwrite=> ["security_desc"]
      on_error => "stat_grok_failure"
    }
    mutate {
      replace => {
        "security_result.summary" => "%{security_desc}"
      }
    }
  }

  if [security_desc] != "" {
    grok {
      match => {
        "security_desc" => ".*<%{DATA:net_mail_id}>.*"
      }
      overwrite => ["net_mail_id"]
      on_error => "security_desc_grok_failure"
    }
  }
  if [net_mail_id] != "" and [net_mail_id] =~ "^.+@.+$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.mail_id" => "%{net_mail_id}"
      }
      on_error => "net_mail_id_empty"
    }
  }
  if [hdr_mid] != "" and [hdr_mid] =~ "^.+@.+$" {
    mutate {
      gsub => ["hdr_mid", "<|>", ""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.mail_id" => "%{hdr_mid}"
      }
      on_error => "hdr_mid_empty"
    }
  }

  if [message] != "" {
    grok {
      match => {
        "kv_data1" => "\\(%{GREEDYDATA:description}\\)"
      }
      overwrite => ["description"]
      on_error => "descrption_nor_parsed"
    }
  }

  if [description] != "" {
    grok {
      match => {
        "description" => "(?P<temp>.*%{WORD:received_byte} bytes .*)"
      }
      overwrite => ["received_byte"]
      on_error => "byte_parsing_error"
    }
    mutate {
      convert => {
        "received_byte" => "uinteger"
      }
    }
    mutate {
      rename => {
        "received_byte" => "event.idm.read_only_udm.network.received_bytes"
      }
    }
    if [description] =~ "InternalId" {
      grok {
        match => {
          "description" => ".*InternalId=%{WORD:internalId}.*"
        }
        overwrite => ["internalId"]
        on_error => "InternalId_empty"
      }

      if [internalId] != "" {
        mutate {
          replace => {
            "InternalId_label.key" => "InternalId"
            "InternalId_label.value" => "%{internalId}"
          }
          merge => {
            "security_result.detection_fields" => "InternalId_label"
          }
        }
      }
    }
    if [Hostname] != ""  {
      grok {
        match => {
          "Hostname" => "(%{GREEDYDATA:hostname}\\])"
        }
        overwrite => ["hostname"]
        on_error => "no_hostname"
      }
      if [hostname] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{hostname}"
            "event.idm.read_only_udm.target.asset.hostname" => "%{hostname}"
          }
          on_error => "hostname_empty"
        }
      }
    }
    if [H] != "" {
      grok {
        match => {
          "Hostname" => "(%{GREEDYDATA:hostname}\\])"
        }
        overwrite => ["hostname"]
        on_error => "no_hostname"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{hostname}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{hostname}"
        }
        on_error => "hostname_empty"
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.about" => "about"
    }
    on_error => "_catch_about_merge_exception"
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  mutate {
    merge => {
     "@output" => "event"
    }
  }
}
