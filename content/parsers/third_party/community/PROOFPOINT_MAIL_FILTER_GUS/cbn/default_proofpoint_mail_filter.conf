      "WebId" => ""
      "HighPriorityMediaProcessing" => ""
      "ListBaseType" => ""
      "ListServerTemplate" => ""
      "SourceRelativeUrl" => ""
      "AppAccessContext.ClientAppName" => ""
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "PROOFPOINT"
      "event.idm.read_only_udm.metadata.vendor_name" => "PROOFPOINT_MAIL_FILTER"
      "event.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
    }
  }
  mutate {
    gsub => ["message", "event=", "prod_event_type="]
  }
  if [message] != "" {
    grok {
      match => {
        "message" => [
          "<%{INT:prio}>%{TIMESTAMP_ISO8601:datetime} %{DATA:device} %{DATA:prod_event_type}: %{WORD:type} %{GREEDYDATA:kv_data}",
          "<%{INT:prio}>%{MONTH:month}\\s+%{MONTHDAY:date}\\s+%{TIME:time}\\s+%{DATA:device} %{DATA:proc} %{DATA:type} %{GREEDYDATA:kv_data}",
          "<%{INT:prio}>%{TIMESTAMP_ISO8601:datetime} %{DATA:device} %{DATA:prod_event_type} %{DATA:type}: %{GREEDYDATA:kv_data1}",
          "<%{INT:prio}>%{TIMESTAMP_ISO8601:datetime} %{DATA:device} %{DATA:prod_event_type}: %{GREEDYDATA:kv_data1}",
          "<%{INT:prio}> %{DATA:device} %{GREEDYDATA:json_data}"]
      }
      overwrite => ["month","date", "datetime", "time","device","proc","type","kv_data","kv_data1","prod_event_type","json_data"]
      on_error => "main_grok_failure"
    }
    if [month] != "" and [time] != "" and [date] != "" {
      mutate {
        replace => {
          "datetime" => "%{month} %{date} %{time}"
        }
      }
    }
    if [datetime] != "" {
      date {
        match => [ "datetime", "MMM dd HH:mm:ss", "MMM d HH:mm:ss", "RFC3339"]
        rebase => true
        on_error => "datetime_empty"
      }
    }
    if [json_data] != "" {
      json {
        source => "json_data"
        array_function => "split_columns"
        on_error => "json_data_empty"
      }
      if [json_data_empty] {
        mutate {
          replace => {
            "json_data" => '%{json_data}\"}'
          }
          on_error => "json_data_empty"
        }
        json {
          source => "json_data"
          array_function => "split_columns"
          on_error => "not_json"
        }
      }
    }
    if [kv_data] != "" {
      if [kv_data] =~ ", " {
        kv {
          source => "kv_data"
          field_split => ","
          value_split => "="
          on_error => "kv_failure"
        }
      }
      else {
        mutate {
          gsub => ["kv_data", " ([A-Za-z0-9_-]+)=", "#$1="]
        }
        kv {
          source => "kv_data"
          field_split => "#"
          value_split => "="
          on_error => "kv_failure"
        }
      }
    }
    else if [kv_data1] != "" {
      if [kv_data1] =~ "Hostname..." {
        mutate {
          gsub => ["kv_data1", "Hostname...", "Hostname="]
        }
        mutate {
          gsub => ["kv_data1", "H...", "H="]
        }
      }
      mutate {
        gsub => ["kv_data1", ", ([a-zA-Z0-9_]*?=)", "&$1"]
      }
      kv {
        source => "kv_data1"
        field_split => "&"
        value_split => "="
        on_error => "kv_data1_failure"
      }
    }
  }

  mutate {
