      "attachments"     => ""
      "cipher"          => ""
      "eid"             => ""
      "folder"          => ""
      "spamscore"       => ""
      "selector"        => ""
      "querydepth"      => ""
      "rule"            => ""
      "phishscore"      => ""
      "hops"            => ""
      "notroutes"       => ""
      "routes"          => ""
      "status"          => ""
      "tls_version"     => ""
      "internalId"      => ""
      "kv_data1"        => ""
      "json_data"       => ""
      "AppAccessContext.AADSessionId"    => ""
      "AppAccessContext.CorrelationId" => ""
      "ClientAppName"   => ""
      "AppAccessContext.UniqueTokenId" => ""
      "AppAccessContext.UserObjectId"       => ""
      "CreationTime" => ""
      "Id" => ""
      "Operation" => ""
      "OrganizationId" => ""
      "RecordType" => ""
      "UserKey" => ""
      "UserType" => ""
      "Version" => ""
