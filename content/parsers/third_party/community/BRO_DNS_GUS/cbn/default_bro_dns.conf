# Product: BRO
# Category: DNS
# Supported Format: CSV
# Reference: NA
# Last Updated: 2022-01-10
# Copyright 2022 Chronicle LLC


filter {
  mutate {
    replace => {
      "dns_question" => ""
    }
  }
  mutate {
    gsub => ["message", "\\\t", " "]
  }

  csv {
    source => "message"
    separator => " "
  }

  mutate {
    rename => {
      "column1" => "broColTS",
      "column2" => "broColID"
      "column3" => "broColSrcIP",
      "column4" => "broColSrcPort"
      "column5" => "broColDstIP"
      "column6" => "broColDstPort"
      "column7" => "broColProto"
      "column8" => "broColXID"
      "column9" => "broColQuery"
      "column10" => "broColQClass"
      "column11" => "broColQClass_Name"
      "column12" => "broColQType"
      "column13" => "broColQType_Name"
      "column14" => "broColRCode"
      "column15" => "broColRCode_Name"
      "column16" => "broColAA"
      "column17" => "broColTC"
      "column18" => "broColRD"
      "column19" => "broColRA"
      "column21" => "broColAnswers"
      "column22" => "broColTTL"
    }
  }

  date {
    match => ["broColTS","UNIX"]
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.principal.ip" => "broColSrcIP"
      "event.idm.read_only_udm.target.ip" => "broColDstIP"
    }
  }

  mutate {
    convert => {
      "broColXID" => "uinteger"
      "broColDstPort" => "integer"
      "broColSrcPort" => "integer"
    }
  }
  mutate {
    rename => {
      "broColXID" => "event.idm.read_only_udm.network.dns.id"
      "broColDstPort" => "event.idm.read_only_udm.target.port"
      "broColSrcPort" => "event.idm.read_only_udm.principal.port"
    }
  }

  if [broColQuery] not in ["", "-"] {
    mutate {
      replace => {
        "dns_question.name" => "%{broColQuery}"
      }
    }
  }

  if [broColQClass] not in ["", "-"] {
    mutate {
      rename => {
        "broColQClass" => "dns_question.class"
      }
    }
    mutate {
      convert => {
        "dns_question.class" => "uinteger"
      }
    }
  }

  if [broColQType] not in ["", "-"] {
    mutate {
      rename => {
        "broColQType" => "dns_question.type"
      }
    }
    mutate {
      convert => {
        "dns_question.type" => "uinteger"
      }
    }
  }

  if [broColRCode] not in ["", "-", "0"] {
    mutate {
      rename => {
        "broColRCode" => "event.idm.read_only_udm.network.http.response_code"
      }
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
    }
  }

  if [broColAnswers] not in ["", "-"] {
    mutate {
      gsub => ["broColAnswers", ",", "\",\""]
    }
    mutate {
      replace => {
        "broColAnswers" => "{\"broColAnswers\":[\"%{broColAnswers}\"]}"
      }
    }
    json {
      source => "broColAnswers"
      array_function => "split_columns"
    }

    mutate {
      gsub => ["broColTTL", ",", "\",\""]
    }
    mutate {
      replace => {
        "broColTTL" => "{\"broColTTL\":[\"%{broColTTL}\"]}"
      }
    }
    json {
      source => "broColTTL"
      array_function => "split_columns"
    }

    for broColindex, data in broColAnswers {
      for ttlindex, ttl in broColTTL {
        mutate {
          replace => {
            "dns_answer" => ""
            "ipv4" => ""
            "ipv6" => ""
          }
        }
        if [broColindex] == [ttlindex] {
          if [broColQuery] not in ["", "-"] {
            mutate {
              replace => {
                "dns_answer.name" => "%{broColQuery}"
              }
            }
          }
          grok {
            match => {
              "ttl" => "%{INT:TTL}"
            }
            on_error => "not_integer"
          }
          mutate {
            rename => {
              "TTL" => "dns_answer.ttl"
            }
          }
          mutate {
            convert => {
              "dns_answer.ttl" => "uinteger"
            }
          }
          mutate {
            replace => {
              "dns_answer.data" => "%{data}"
            }
            on_error => "data_is_null"
          }

          if ![data_is_null] {
            if [data] not in ["", "-"] {
              grok {
                match => {
                  "data" => ["%{IPV4:ipv4}",
                             "%{IPV6:ipv6}" ]
                }
                overwrite => ["ipv4", "ipv6"]
                on_error => "not_an_ip"
              }
              if [ipv4] != "" {
                mutate {
                  replace => {
                    "dns_answer.type" => "1"
                  }
                }
              }
              else if [ipv6] != "" {
                mutate {
                  replace => {
                    "dns_answer.type" => "28"
                  }
                }
              }
            }
          }
          mutate {
            convert => {
              "dns_answer.type" => "uinteger"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.network.dns.answers" => "dns_answer"
            }
          }
        }
      }
    }
  }

  if [broColAA] == "T"  {
    mutate {
      replace  => {
        "authoritative" => "true"
      }
      convert => {
        "authoritative" => "boolean"
      }
    }
    mutate {
      rename => {
        "authoritative" => "event.idm.read_only_udm.network.dns.authoritative"
      }
    }
  }

  if [broColTC] == "T"  {
    mutate {
      replace  => {
        "truncated" => "true"
      }
      convert => {
        "truncated" => "boolean"
      }
    }
    mutate {
      rename => {
        "truncated" => "event.idm.read_only_udm.network.dns.truncated"
      }
    }
  }

  if [broColRD] == "T"  {
    mutate {
      replace  => {
        "recursion_desired" => "true"
      }
      convert => {
        "recursion_desired" => "boolean"
      }
    }
    mutate {
      rename => {
        "recursion_desired" => "event.idm.read_only_udm.network.dns.recursion_desired"
      }
    }
  }

  if [broColRA] == "T"  {
    mutate {
      replace  => {
        "recursion_available" => "true"
      }
      convert => {
        "recursion_available" => "boolean"
      }
    }
    mutate {
      rename => {
        "recursion_available" => "event.idm.read_only_udm.network.dns.recursion_available"
      }
    }
  }

  if [broColQClass_Name] not in ["", "-"] {
    mutate {
      convert => {
        "broColQClass_Name" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
      "additional_fields" => ""
      }
    }
    mutate {
      replace => {
        "additional_fields.key" => "QClass_Name"
        "additional_fields.value.string_value" => "%{broColQClass_Name}"
      }
      merge => {
        "additional.fields" => "additional_fields"
      }
      on_error => "_additional_field_not_set"
    }
  }

  if [broColQType_Name] not in ["", "-"] {
    mutate {
      convert => {
        "broColQType_Name" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "additional_fields" => ""
      }
    }
    mutate {
      replace => {
        "additional_fields.key" => "QType_Name"
        "additional_fields.value.string_value" => "%{broColQType_Name}"
      }
      merge => {
        "additional.fields" => "additional_fields"
      }
      on_error => "_additional_field_not_set"
    }
  }

  if [broColRCode_Name] not in ["", "-"] {
    mutate {
      convert => {
        "broColRCode_Name" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "additional_fields" => ""
      }
    }
    mutate {
      replace => {
        "additional_fields.key" => "RCode_Name"
        "additional_fields.value.string_value" => "%{broColRCode_Name}"
      }
      merge => {
        "additional.fields" => "additional_fields"
      }
      on_error => "_additional_field_not_set"
    }
  }

  mutate {
    rename => {
      "additional" => "event.idm.read_only_udm.additional"
    }
  }

  mutate {
    uppercase => [ "broColProto" ]
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.network.ip_protocol" => "%{broColProto}"
      "event.idm.read_only_udm.metadata.product_log_id" => "%{broColID}"
    }
  }

  if [dns_question] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.dns.questions" => "dns_question"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_DNS"
        "event.idm.read_only_udm.network.application_protocol" => "DNS"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
