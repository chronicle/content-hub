# Product: DELL_OPENMANAGE
# Category: Systems Management Application
# Supported Format: SYSLOG + KV
# Reference: https://www.dell.com/support/manuals/en-in/dell-openmanage-enterprise/ome-3.4_ug/manage-audit-logs?guid=guid-914f353f-e728-4e55-b98d-eab3f6a796dd&lang=en-us
# Last Updated: 2025-05-14
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "msg" => ""
      "host_name" => ""
      "kv_msg" => ""
      "HostName" => ""
      "Severity" => ""
      "Message" => ""
      "IP" => ""
      "security_res" => ""
      "Recommended_Action" => ""
      "desc" => ""
      "user" => ""
      "ip" => ""
      "description" => ""
      "MessageID" => ""
      "provider" => ""
      "date_time" => ""
      "intermediary" => ""
     }
   }

  grok {
    match => {
      "message" => ["<%{INT}>%{GREEDYDATA:msg}"]
    }
    on_error => "unsupported_log"
    overwrite => ["msg"]
  }

  if [unsupported_log] {
    if [message] =~ ": " {
      mutate {
        replace => {
          "desc" => "%{message}"
        }
      }
    }
    else {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }
  }

  if [msg] != "" {
    grok {
      match => {
        "msg" => [
          "%{GREEDYDATA:date_time} %{HOSTNAME:host_name} %{GREEDYDATA:provider} Audit event from device with%{GREEDYDATA:kv_msg}"
          "%{GREEDYDATA:date_time} %{HOSTNAME:host_name} %{GREEDYDATA:provider} Device Compliance event from device with%{GREEDYDATA:kv_msg}"
          "%{GREEDYDATA:date_time} %{HOSTNAME:host_name} %{GREEDYDATA:provider} Configuration event from device with%{GREEDYDATA:kv_msg}"
        ]
      }
      overwrite => ["msg","date_time", "host_name","kv_msg","provider"]
    }
  }

  if [kv_msg] != "" {
    mutate {
      gsub => [ "kv_msg", " { ", "#" ]
    }
    mutate {
      gsub => [ "kv_msg", " } ", "=" ]
    }
    kv {
      source => "kv_msg"
      field_split => "\#"
      value_split => "="
    }
    mutate {
      gsub => [ "Recommended Action", " ", "_" ]
    }
  }

  if [host_name] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{host_name}"
        "event.idm.read_only_udm.principal.hostname" => "%{host_name}"
      }
      on_error => "no_host_name"
    }
  }

  if [Message] != "" {
    grok {
      match => {
        "Message" => ["%{GREEDYDATA:desc} User Name:%{GREEDYDATA:user} %{DATA} %{DATA} address:%{IP:ip}",
                      "%{GREEDYDATA:desc}. User Name:%{WORD:user} Received from address:%{HOSTNAME:HostName}"
                      "%{GREEDYDATA:desc}"]
      }
      overwrite => ["desc", "user", "ip","HostName"]
    }
  }

  if [provider] == "EEMI" {
    if [HostName] != "null" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{HostName}"
        }
      }
    }

    if [user] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{user}"
        }
      }
    }

    if [IP] not in ["null",""] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "IP"
        }
      }
    }
    else if [ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "ip"
        }
      }
    }
    if [Severity] in ["INFO","Informational","DEBUG"] {
      mutate {
        replace => {
          "security_res.severity" => "INFORMATIONAL"
        }
      }
    } else if [Severity] == "ERROR" {
      mutate {
        replace => {
          "security_res.severity" => "ERROR"
        }
      }
    } else if [Severity] == "Warning" {
      mutate {
        replace => {
          "security_res.severity" => "LOW"
        }
      }
    }
    if [security_res] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_res"
         }
       }
     }
    if [msg] =~ "Recommended Action" {
     mutate {
       replace => {
         "additional_action.key" => "Recommended_Action"
         "additional_action.value.string_value" => "%{Recommended Action}"
       }
     }
     mutate {
       merge => {
         "event.idm.read_only_udm.additional.fields" => "additional_action"
        }
      }
    }
    if [msg] =~ "MessageID" {
     mutate {
       replace => {
         "additional_messageid.key" => "MessageID"
         "additional_messageid.value.string_value" => "%{MessageID}"
       }
     }
     mutate {
       merge => {
         "event.idm.read_only_udm.additional.fields" => "additional_messageid"
        }
      }
    }
  }

  if [desc] =~ "credentials are invalid" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  } else if [desc] =~ "running compliance task" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [host_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "DELL_OPENMANAGE"
      "event.idm.read_only_udm.metadata.vendor_name" => "DELL"
      "event.idm.read_only_udm.metadata.description" => "%{desc}"
    }
  }

  if [date_time] != "" {
    date {
      match => ["date_time", "RFC3339", "ISO8601"]
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
