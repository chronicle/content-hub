# Product: SONRAI
# Category: Cloud Security Solution
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-06-13
# Copyright 2024 Chronicle LLC


filter {
  # initialize fields we need to act on later that may not exist
  mutate {
    replace => {
      "sourceIp" => ""
      "actionType" => ""
      "event_type" => "GENERIC_EVENT"
      "eventName" => ""
      "type" => ""
      "resourceSrn" => ""
      "actorSrn" => ""
      "actor" => ""
      "profile"=> ""
      "srn" => ""
      "hasAcceptedLegal" => ""
      "hasDefaultLongView" => ""
      "variables" => ""
      "gql" => ""
      "security_result" => ""
      "actor_profile_srn" => ""
      "user_id" => ""
      "user_product_id" => ""
      "metadata" => ""
      "createdDate" => ""
      "principal" => ""
      "target" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", ""]
  }

  mutate {
    gsub => ["message", "\\n", ""]
  }

  mutate {
    gsub => ["message", "\\'", '\"']
  }

  mutate {
    gsub => ["message", "None", '\"None\"']
  }

  mutate {
    gsub => ["message", "False", '\"false\"']
  }

  mutate {
    gsub => ["message", "True", '\"true\"']
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_invalid"
  }
  if [json_invalid]{
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }


  if [eventName] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventName}"
      }
      on_error => "eventName_invalid"
    }
  }

  if [actionType] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{actionType}"
      }
      on_error => "actionType_invalid"
    }
  }

  if [actorSrn] != "" {
    mutate {
      replace => {
        "actor_label.key" => "actorSrn"
        "actor_label.value.string_value" => "%{actorSrn}"
      }
      on_error => "actorSrn_invalid"
    }
    if ![actorSrn_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "actor_label"
        }
        on_error => "actorSrn_invalid"
      }
    }
  }

  if [resourceSrn] not in ["", "None"] {
    mutate {
      replace => {
        "principal.resource.name" => "%{resourceSrn}"
      }
      on_error => "resourceSrn_invalid"
    }
  }

  if [message] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{message}"
      }
      on_error => "message_invalid"
    }
  }

  if [variables] not in ["", "None"] {
    mutate {
      replace => {
        "variables_label.key" => "variables"
        "variables_label.value.string_value" => "%{variables}"
      }
      on_error => "variables_invalid"
    }
    if ![variables_invalid] {
      mutate {
        merge=> {
          "event.idm.read_only_udm.additional.fields" => "variables_label"
        }
        on_error => "variables_invalid"
      }
    }
  }

  if [gql] not in ["", "None"] {
    mutate {
      replace => {
        "gql_label.key" => "gql"
        "gql_label.value.string_value" => "%{gql}"
      }
      on_error => "gql_invalid"
    }
    if ![gql_invalid] {
      mutate{
        merge=> {
          "event.idm.read_only_udm.additional.fields" => "gql_label"
        }
        on_error => "gql_invalid"
      }
    }
  }

  if [sourceIp] != "" {
    mutate {
      merge => {
        "principal.ip" => "sourceIp"
        "principal.asset.ip" => "sourceIp"
      }
      on_error => "sourceIp_invalid"
    }
  }
  if [type] != "" {
    mutate {
      replace => {
        "typelabel.key" => "type"
        "typelabel.value.string_value" => "%{type}"
      }
      on_error => "type_invalid"
    }
    if ![type_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "typelabel"
        }
        on_error => "type_invalid"
      }
    }
  }

  for key, value in actor.profile map {
    mutate {
      replace => {
        "actor_profile_map_label" => ""
      }
    }
    if [key] not in ["", "srn" , "lastSeenNotification"] {
      mutate {
        replace => {
          "actor_profile_map_label.key" => "actor_profile %{key}"
        }
        on_error => "key_invalid"
      }
      if ![key_invalid] and [value] != "" {
        mutate {
          replace => {
            "actor_profile_map_label.value" => "%{value}"
          }
          on_error => "value_not_found"
        }
        if ![value_not_found] {
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "actor_profile_map_label"
            }
            on_error => "actor_profile_map_label_merge_error"
          }
        }
      }
    }
  }

  if [actor][profile][srn] != "" {
    grok {
      match => {
        "actor.profile.srn" => [
          "%{DATA}:%{DATA:user_id}::%{DATA}_%{GREEDYDATA:user_product_id}"
        ]
      }
      overwrite => ["user_id", "user_product_id"]
      on_error => "actor_profile_srn_invalid"
    }
    mutate {
      replace=> {
        "target.user.userid" => "%{user_id}"
      }
      on_error => "userid_merge_error"
    }
    mutate {
      replace=> {
        "target.user.product_object_id" =>
        "%{user_product_id}"
      }
      on_error => "user_product_id_merge_error"
    }
  }

  if [createdDate] != "" {
     date {
      match => ["createdDate", "ISO8601"]
      on_error => "timestamp_failure"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "SONRAI"
      "metadata.product_name" => "SONRAI"
    }
  }
  if [eventName] =~ "Login" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_invalid"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
     }
     on_error => "security_result_invalid"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

# output the built event
  mutate {
    merge=> {
      "@output" => "event"
    }
  }
}
