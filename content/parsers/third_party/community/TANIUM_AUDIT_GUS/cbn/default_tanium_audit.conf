# Product: TANIUM AUDIT
# Category: SCAN NETWORK
# Supported Format: JSON
# Reference: https://help.tanium.com/bundle/ug_connect_cloud/page/connect/audit_reference.html
# Last Updated: 2025-11-13
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "input.type" => ""
      "logstash.process.timestamp" => ""
      "logstash.collect.timestamp" => ""
      "logstash.ingest.timestamp" => ""
      "logstash.process.host" => ""
      "logstash.collect.host" => ""
      "host.os.version"    => ""
      "host.os.kernel"     => ""
      "host.os.family"     => ""
      "host.architecture"  => ""
      "host.name"          => ""
      "host.id" => ""
      "host.ip" => ""
      "host.mac" => ""
      "host.hostname" => ""
      "host.containerized" => ""
      "logstash.irm_site" => ""
      "logstash.irm_region" => ""
      "logstash.irm_environment" => ""
      "agent.type" => ""
      "agent.id" => ""
      "agent.version" => ""
      "agent.name" => ""
      "agent.ephemeral_id" => ""
      "agent.hostname" => ""
      "ActionId" => ""
      "Approver" => ""
      "Command" => ""
      "log.source.address" => ""
      "SourceId" => ""
      "tanium_audit_type" => ""
      "Status" => ""
      "syslog_severity" => ""
      "Comment" => ""
      "event_type" => ""
      "json_data" => ""
      "timestamp" => ""
      "Issuer" => ""
      "DistributeOver" => ""
      "PackageName" => ""
      "ActionName" => ""
      "src_ip" => ""
      "StartTime" => ""
      "Expiration" => ""
      "InsertTime" => ""
      "has_target" => "false"
      "src_port" => ""
      "host.os.name" => ""
      "@version" => ""
      "intermediary_1" => ""
      "has_user" => "false"
      "dvc_ip" => ""
      "security_result" => ""
      "object_id" => ""
      "audit_name" => ""
      "creation_time" => ""
      "modification_time" => ""
      "last_modified_by" => ""
      "modifier_user_id" => ""
      "details" => ""
      "User" => ""
      "session_id" => ""
      "authentication_type" => ""
      "ip_address" => ""
      "audit_row_id" => ""
      "type" => ""
      "type_name" => ""
      "object_name" => ""
      "object_type_name" => ""
      "audit_type" => ""
      "id" => ""
      "state.type" => ""
      "state.message" => ""
      "state.legacyType" => ""
      "userId" => ""
      "action" => ""
      "createdAt" => ""
    }
  }

  mutate{
    gsub => ["message" , "@timestamp" , "timestamp" ]
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{IP:dvc_ip} %{GREEDYDATA:json_data}"
      ]
    }
    on_error => "grok_failed"
    overwrite => ["timestamp", "dvc_ip", "json_data"]
  }
  if [grok_failed] {
    mutate {
      replace => {
        "json_data" => "%{message}"
      }
    }
  }
  json {
    source => "json_data"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601", "MMM dd HH:mm:ss"]
      rebase => true
      on_error => "invalid_format"
    }
  }
  if [object_id] != "" {
    mutate {
      convert => {
        "object_id" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{object_id}"
      }
      on_error => "id_error"
    }
  }
  if [object_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{object_name}"
      }
      on_error => "no_object_name"
    }
  }
  if [audit_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{audit_name}"
      }
      on_error => "no_audit_name"
    }
  }
  if [creation_time] != "" {
    date {
      match => ["creation_time", "ISO8601","yyyy-MM-ddTHH:mm:ss" ]
      target => "event.idm.read_only_udm.target.resource.attribute.creation_time"
      on_error => "no_end_time"
    }
  }
  if [modification_time] != "" {
    date {
      match => ["modification_time", "ISO8601","yyyy-MM-ddTHH:mm:ss" ]
      target=>"event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_end_time"
    }
  }
  if [id] != "" {
    mutate {
      convert => {
        "id" => "string"
      }
      on_error => "id_already_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
      }
      on_error => "id_not_present"
    }
  }
  if [state][type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{state.type}"
      }
      on_error => "state_type_not_present"
    }
  }
  if [state][message] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{state.message}"
      }
      on_error => "state_message_not_present"
    }
  }
  if [state][legacyType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{state.legacyType}"
      }
      on_error => "state_legacy_type_not_present"
    }
  }
  if [userId] != "" {
    mutate {
      convert => {
        "userId" => "string"
      }
      on_error => "userId_already_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{userId}"
        "has_user" => "true"
      }
      on_error => "user_id_not_present"
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "action_not_present"
    }
  }
  if [modification_time] == "" and [createdAt] != "" {
    date {
      match => ["createdAt", "ISO8601","yyyy-MM-ddTHH:mm:ss" ]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "createdAt_not_present"
    }
  }
  else if [createdAt] != ""{
    mutate {
      replace => {
      "createdAt_label.key" => "created_at"
      "createdAt_label.value.string_value" => "%{createdAt}"
      }
      on_error => "createdAt_label_not_present"
    }
    if ![createdAt_label_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "createdAt_label"
        }
        on_error => "created_at_label_merge_failed"
      }
    }
  }
  mutate {
    rename => {
      "table" => "addition.table"
      "rowId" => "addition.rowId"
      "revision" => "addition.revision"
      "state.count" => "addition.state_count"
      "updatedAt" => "addition.updatedAt"
      "personaId" => "addition.personaId"
      "username" => "addition.username"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "map_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "map_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [value] != "" {
      mutate {
        replace => {
          "map_field.key" => "%{key}"
        }
        on_error => "key_replace_error"
      }
      if [key] in ["table", "username"] {
        mutate {
          replace => {
            "map_field.value" => "%{value}"
          }
          on_error => "principal_resource_attribute_labels_map_field_value_replace_error"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "map_field"
          }
          on_error => "principal_resource_attribute_labels_addition_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "map_field.value.string_value" => "%{value}"
          }
          on_error => "additional_fields_map_field_value_replace_error"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "map_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }
  if [last_modified_by] != "" {
    mutate {
      replace => {
        "last_modified_by_label.key" => "last_modified_by"
        "last_modified_by_label.value" => "%{last_modified_by}"
      }
      on_error => "no_last_modified_by"
    }
    if ![no_last_modified_by] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "last_modified_by_label"
        }
        on_error => "no_last_modified_by_label"
      }
    }
  }
  if [modifier_user_id] != "" {
    mutate {
      convert => {
        "modifier_user_id" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "modifier_user_id_label.key" => "modifier_user_id"
        "modifier_user_id_label.value" => "%{modifier_user_id}"
      }
      on_error => "no_modifier_user_id"
    }
    if ![no_modifier_user_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "modifier_user_id_label"
        }
        on_error => "no_modifier_user_id_label"
      }
    }
  }
  if [details] != "" {
    mutate {
      gsub => ["details","Session ID","session_id"]
    }
    mutate {
      gsub => ["details","Authentication Type","authentication_type"]
    }
    mutate {
      gsub => ["details","IP Address","ip_address"]
    }
    kv {
      source => "details"
      value_split => ":"
      field_split => ";"
      on_error => "invalid_kv"
    }
  }
  if [User] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{User}"
        "has_user" => "true"
      }
      on_error => "no_user"
    }
  }
  if [session_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{session_id}"
      }
      on_error => "no_session_id"
    }
  }
  if [authentication_type] != "" {
    mutate {
      replace => {
        "authentication_type_label.key" => "authentication_type"
        "authentication_type_label.value" => "%{authentication_type}"
      }
      on_error => "no_authentication_type"
    }
    if ![no_authentication_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.labels" => "authentication_type_label"
        }
        on_error => "no_authentication_type_label"
      }
    }
  }
  if [ip_address] != "" {
    grok {
      match => {
        "ip_address" => ["%{IP:ip_address}"]
      }
      overwrite => ["ip_address"]
      on_error => "invalid_ip"
    }
    if ![invalid_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ip_address"
          "event.idm.read_only_udm.principal.asset.ip" => "ip_address"
        }
        on_error => "no_ip_address"
      }
    }
  }
  if [audit_row_id] != "" {
    mutate {
      convert => {
        "audit_row_id" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "audit_row_id_label.key" => "audit_row_id"
        "audit_row_id_label.value.string_value" => "%{audit_row_id}"
      }
      on_error => "no_audit_row_id"
    }
    if ![no_audit_row_id] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "audit_row_id_label"
        }
        on_error => "no_audit_row_id_label"
      }
    }
  }
  if [type] != "" {
    mutate {
      convert => {
        "type" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "type_label.key" => "type"
        "type_label.value.string_value" => "%{type}"
      }
      on_error => "no_type"
    }
    if ![no_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type_label"
        }
        on_error => "no_type_label"
      }
    }
  }
  if [type_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{type_name}"
      }
      on_error => "no_type_name"
    }
  }
  if [object_type_name] != "" {
    mutate {
      replace => {
        "object_type_name_label.key" => "object_type_name"
        "object_type_name_label.value" => "%{object_type_name}"
      }
      on_error => "no_object_type_name"
    }
    if ![no_object_type_name] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "object_type_name_label"
        }
        on_error => "no_object_type_name_label"
      }
    }
  }
  if [audit_type] != "" {
    mutate {
      replace => {
        "audit_type_label.key" => "audit_type"
        "audit_type_label.value.string_value" => "%{audit_type}"
      }
      on_error => "no_audit_type"
    }
    if ![no_audit_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "audit_type_label"
        }
        on_error => "no_audit_type_label"
      }
    }
  }
  if [logstash][process][timestamp] != "" {
    date {
      match => ["logstash.process.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
      on_error => "invalid_format"
    }
  }

  if [logstash][collect][timestamp] != "" {
    date {
      match => ["logstash.collect.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "invalid_format"
    }
  }

  if [logstash][ingest][timestamp] != "" {
    date {
      match => ["logstash.ingest.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
      target => "event.idm.read_only_udm.metadata.ingested_timestamp"
      on_error => "invalid_format"
    }
  }

  if [ActionId] != "" {
    mutate {
      convert => {
        "ActionId" => "string"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{ActionId}"
      }
    }
  }

  if [log][source][address] != "" {
    grok {
      match => {
        "log.source.address" => [
          "%{IP:src_ip}:%{POSINT:src_port}",
          "%{IP:src_ip}"
        ]
      }
      overwrite => ["src_ip","src_port"]
    }
  }

  if [dvc_ip] != "" {
    mutate {
      replace => {
        "src_ip" => "%{dvc_ip}"
      }
    }
  }
  if [src_ip] != "" {
    mutate {
      replace => {
        "src_ip_temp" => "%{src_ip}"
      }
      convert => {
        "src_ip_temp" => "ipaddress"
      }
      on_error => "not_src_ip"
    }
    if ![not_src_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
        }
      }
    }
  }

  if [src_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
  }

  if [host][hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{host.hostname}"
        "has_target" => "true"
      }
    }
  }
  else if [host][name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{host.name}"
          "has_target" => "true"
      }
    }
  }

  if [host][os][name] =~ "(?i)linux" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform" => "LINUX"
      }
    }
  }
  else if [host][os][name] =~ "(?i)win" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform" => "WINDOWS"
      }
    }
  }
  else if [host][os][name] =~ "(?i)mac" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform" => "MAC"
      }
    }
  }

  if [host][os][version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform_version" => "%{host.os.version}"
      }
    }
  }

  if [host][os][kernel] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform_patch_level" => "%{host.os.kernel}"
      }
    }
  }

  if [host][architecture] != "" {
    mutate {
      replace => {
        "hardware.cpu_platform" => "%{host.architecture}"
      }
      on_error => "not_architecture"
    }
    if ![not_architecture] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.hardware" => "hardware"
        }
      }
    }
  }

  if [host][mac] != "" {
    for mac in host.mac {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.mac" => "mac"
        }
      }
    }
  }

  if [host][ip] != "" {
    for ip in host.ip {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "ip"
        }
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [host][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.asset_id" => "Host ID:%{host.id}"
      }
    }
  }

 if [host][os][name] != "" {
    mutate {
      replace => {
        "os_name_label.key" => "os_name"
        "os_name_label.value.string_value" => "%{host.os.name}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "os_name_label"
      }
    }
  }

  if [Approver] != "" {
    mutate {
      replace => {
        "approver.key" => "Approver"
        "approver.value.string_value" => "%{Approver}"
      }
      on_error => "no_approver"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "approver"
      }
      on_error => "no_approver"
    }
  }

  if [DistributeOver] != "" {
    mutate {
      replace => {
        "distributeOver_label.key" => "DistributeOver"
        "distributeOver_label.value.string_value" => "%{DistributeOver}"
      }
      on_error => "no_distributeOver"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "distributeOver_label"
      }
      on_error => "no_distributeOver"
    }
  }

  if [Issuer] != "" {
    mutate {
      replace => {
        "issuer_label.key" => "Issuer"
        "issuer_label.value.string_value" => "%{Issuer}"
      }
      on_error => "no_issuer"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "issuer_label"
      }
      on_error => "no_issuer"
    }
  }

  if [logstash][irm_site] != "" {
    mutate {
      replace => {
        "irmsite.key" => "irm_site"
        "irmsite.value.string_value" => "%{logstash.irm_site}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "irmsite"
      }
    }
  }

  if [logstash][irm_region] != "" {
    mutate {
      replace => {
        "irmregion.key" => "irm_region"
        "irmregion.value.string_value" => "%{logstash.irm_region}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "irmregion"
      }
    }
  }

  if [logstash][irm_environment] != "" {
    mutate {
      replace => {
        "irmenvironment.key" => "irm_environment"
        "irmenvironment.value.string_value" => "%{logstash.irm_environment}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "irmenvironment"
      }
    }
  }

  if [logstash][collect][host] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.observer.ip" => "logstash.collect.host"
      }
      on_error => "is_not_ip"
    }
    mutate {
      rename => {
        "logstash.process.host" => "intermediary_1.hostname"
      }
    }
  }
  else if [dvc_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.observer.ip" => "dvc_ip"
      }
      on_error => "is_not_ip"
    }
    mutate {
      rename => {
        "dvc_ip" => "intermediary_1.hostname"
      }
    }
  }

  if [intermediary_1] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary_1"
      }
      on_error => "empty_value_1"
    }
  }

  if [input][type] in ["tcp","TCP"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "TCP"
      }
    }
  }

  if [agent][type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.application" => "%{agent.type}"
      }
    }
  }



  if [agent][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.asset_id" => "%{agent.type}:%{agent.id}"
      }
    }
  }

  if [agent][version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.platform_version" => "%{agent.version}"
      }
    }
  }

  if [agent][ephemeral_id] != "" {
    mutate {
      replace => {
        "additional_ephemeral_id.key" => "ephemeral_id"
        "additional_ephemeral_id.value.string_value" => "%{agent.ephemeral_id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_ephemeral_id"
      }
    }
  }

  if [@version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{@version}"
      }
    }
  }

  if [syslog_severity] != "" {
    if [syslog_severity] =~ "(?i)(error|warning)" {
      mutate {
        replace => { "security_result.severity" => "HIGH" }
      }
    }
    else if [syslog_severity] =~ "(?i)notice" {
      mutate {
        replace => { "security_result.severity" => "MEDIUM" }
      }
    }
    else if [syslog_severity] =~ "(?i)(information|info)" {
      mutate {
        replace => { "security_result.severity" => "LOW" }
      }
    }
    mutate {
      replace => { "security_result.severity_details" => "%{syslog_severity}" }
    }
  }

  if [Status] == "Closed" {
    mutate {
      replace => {
        "action" => "BLOCK"
        "security_result.summary" => "%{Status}"
      }
      on_error => "no_status"
    }
    mutate {
        merge => {
          "security_result.action" => "action"
        }
      }
  }
  else if [Status] == "Open" {
    mutate {
      replace => {
        "action" => "ALLOW"
        "security_result.summary" => "%{Status}"
      }
      on_error => "no_status"
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }

  if [Comment] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{Comment}"
      }
    }
  }

  if [Issuer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{Issuer}"
        "has_user" => "true"
      }
      on_error => "no_issuer"
    }
  }
  else if [Approver] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{Approver}"
        "has_user" => "true"
      }
      on_error => "no_approver"
    }
  }

  if [ActionName] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{ActionName}"
      }
      on_error => "no_action_name"
    }
  }

  if [PackageName] != "" {
    mutate {
      replace => {
        "package_name_label.key" => "PackageName"
        "package_name_label.value.string_value" => "%{PackageName}"
      }
      on_error => "no_packageName"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "package_name_label"
      }
      on_error => "no_packageName"
    }
  }

  if [SourceId] != "" {
    mutate {
      convert => {
        "SourceId" => "string"
      }
    }
    mutate {
      replace => {
        "additional_source_Id.key" => "SourceId"
        "additional_source_Id.value.string_value" => "%{SourceId}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_source_Id"
      }
    }
  }

  if [StartTime] != "" {
    mutate {
      replace => {
        "starttime_label.key" => "StartTime"
        "starttime_label.value.string_value" => "%{StartTime}"
      }
      on_error => "no_starttime"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "starttime_label"
      }
      on_error => "no_starttime"
    }
  }

  if [Expiration] != "" {
    mutate {
      replace => {
        "expiration_label.key" => "Expiration"
        "expiration_label.value.string_value" => "%{Expiration}"
      }
      on_error => "no_expiration"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "expiration_label"
      }
      on_error => "no_expiration"
    }
  }

  if [InsertTime] != "" {
    mutate {
      replace => {
        "insertTime_label.key" => "InsertTime"
        "insertTime_label.value.string_value" => "%{InsertTime}"
      }
      on_error => "no_insertTime"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "insertTime_label"
      }
      on_error => "no_insertTime"
    }
  }

  if [tanium_audit_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{tanium_audit_type}"
      }
    }
  }

  mutate {
    gsub => ["Command" , "%20" , " " ]
  }

  mutate {
    gsub => ["Command" , "%2d" , "-" ]
  }

  mutate {
    gsub => ["Command" , "%5f" , "_" ]
  }

  if [Command] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.command_line" => "%{Command}"
      }
    }
  }

  if [src_ip] != "" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [src_ip] != "" or [ip_address] != ""{
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
      on_error => "no_event_type"
    }
  }


  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "TANIUM_AUDIT"
      "event.idm.read_only_udm.metadata.product_name" => "cybersecurity"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

