# Product: WINDOWS HYPERV
# Category: Virtualization Software
# Supported Format: JSON
# Reference: NA
# Last Updated: 2025-06-17
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "EventTime" => ""
      "EventReceivedTime" => ""
      "Hostname" => ""
      "Keywords" => ""
      "Severity" => ""
      "SeverityValue" => ""
      "EventID" => ""
      "Version" => ""
      "ProviderGuid" => ""
      "EventType" => ""
      "OpcodeValue" => ""
      "RecordNumber" => ""
      "ProcessID" => ""
      "ThreadID" => ""
      "Channel" => ""
      "AccountName" => ""
      "UserID" => ""
      "SourceName" => ""
      "SourceModuleName" => ""
      "SourceModuleType" => ""
      "AccountType" => ""
      "Opcode" => ""
      "principal" => ""
      "network" => ""
      "target" => ""
      "security_result" => ""
      "additional" => ""
      "event_type" => ""
      "metadata" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_target_process" => "false"
      "Message" => ""
      "Domain" => ""
      "ActivityId" => ""
      "channel" => ""
      "computer" => ""
      "event_data.name" => ""
      "event_id.id" => ""
      "event_id.qualifiers" => ""
      "execution.process_id" => ""
      "execution.thread_id" => ""
      "level" => ""
      "opcode" => ""
      "provider.event_source" => ""
      "provider.guid" => ""
      "provider.name" => ""
      "record_id" => ""
      "security.user_id" => ""
      "system_time" => ""
      "task" => ""
      "ioctl_Code" => ""
      "n_delta" => ""
      "nt_status" => ""
      "NT" => ""
      "item_ioctl_Code" => ""
      "item_delta" => ""
      "item_ntStatus" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [channel] != "" {
    mutate {
      replace => {
        "channel_label.value.string_value" => "%{channel}"
      }
      on_error => "channel_error"
    }
    if ![channel_error] {
      mutate {
        replace => {
          "channel_label.key" => "Channel"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "channel_label"
        }
        on_error => "channel_merge_error"
      }
    }
  }

  if [computer] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{computer}"
        "principal.asset.hostname" => "%{computer}"
        "has_principal" => "true"
      }
       on_error => "computer_error"
    }
  }

  for Index, data_item in [event_data][data] {
    mutate {
      convert => {
        "Index" => "string"
      }
      on_error => "index_conversion_error"
    }
    mutate {
      replace => {
        "item_ioctl_Code" => "%{data_item.ioctlCode}"
      }
      on_error => "data_item_ioctlCode_error"
    }
    mutate {
      replace => {
        "item_delta" => "%{[data_item][delta (100 ns)]}"
      }
      on_error => "data_item_delta_error"
    }
    mutate {
      replace => {
        "item_ntStatus" => "%{data_item.ntStatus}"
      }
      on_error => "data_item_ntStatus_error"
    }
  }
  if [item_ioctl_Code] != "" {
    mutate {
      replace => {
        "code_label.value.string_value" => "%{item_ioctl_Code}"
      }
      on_error => "code_label_error"
    }
    if ![code_label_error] {
      mutate {
        replace => {
          "code_label.key" => "IoctlCode"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "code_label"
        }
        on_error => "code_label_merge_error"
      }
    }
  }
  if [item_delta] != "" {
    mutate {
      replace => {
        "item_delta_label.value.string_value" => "%{item_delta}"
      }
      on_error => "item_delta_label_error"
    }
    if ![item_delta_label_error] {
      mutate {
        replace => {
          "item_delta_label.key" => "Delta"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "item_delta_label"
        }
        on_error => "item_delta_label_merge_error"
      }
    }
  }
  if [item_ntStatus] != "" {
    mutate {
      replace => {
        "item_ntStatus_label.value.string_value" => "%{item_ntStatus}"
      }
      on_error => "item_ntStatus_label_error"
    }
    if ![item_ntStatus_label_error] {
      mutate {
        replace => {
          "item_ntStatus_label.key" => "NtStatus"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "item_ntStatus_label"
        }
        on_error => "item_ntStatus_label_merge_error"
      }
    }
  }

  if [event_data][name] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{event_data.name}"
      }
      on_error => "event_data_name_error"
    }
  }

  if [event_id][id] != "" {
    mutate {
      convert => {
        "event_id.id" => "string"
      }
      on_error => "event_id_conversion_error"
    }
    mutate {
      replace => {
        "additional_event_id.value.string_value" => "%{event_id.id}"
      }
      on_error => "event_id_error"
    }
    if ![event_id_error] {
      mutate {
        replace => {
          "additional_event_id.key" => "EventID"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "additional_event_id"
        }
        on_error => "event_id_merge_error"
      }
    }
  }
  if [event_id][qualifiers] != "" {
    mutate {
      convert => {
        "event_id.qualifiers" => "string"
      }
      on_error => "event_qualifiers_conversion_error"
    }
    mutate {
      replace => {
        "additional_event_qualifiers.value.string_value" => "%{event_id.qualifiers}"
      }
      on_error => "event_qualifiers_error"
    }
    if ![event_qualifiers_error] {
      mutate {
        replace => {
          "additional_event_qualifiers.key" => "EventQualifiers"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "additional_event_qualifiers"
        }
        on_error => "merge_event_qualifiers_error"
      }
    }
  }

  if [execution][process_id] != "" {
    mutate {
      convert => {
        "execution.process_id" => "string"
      }
      on_error => "pid_conversion_error"
    }
    if ![pid_conversion_error] {
      mutate {
        replace => {
          "target.process.pid" => "%{execution.process_id}"
          "has_target_process" => "true"
          "has_target" => "true"
        }
        on_error => "pid_not_found"
      }
    }
  }
  if [execution][thread_id] != "" {
    mutate {
      convert => {
        "execution.thread_id" => "string"
      }
      on_error => "tid_conversion_error"
    }
    if ![tid_conversion_error] {
      mutate {
        replace => {
          "target.process.product_specific_process_id" => "ThreadID: %{execution.thread_id}"
          "has_target_process" => "true"
          "has_target" => "true"
        }
        on_error => "tid_not_found"
      }
    }
  }

  for index_1,keyword in keywords {
    mutate {
      convert => {
        "index_1" => "string"
      }
      on_error => "index_1_conversion_error"
    }
    mutate {
      replace => {
        "keyword_label" => ""
      }
      on_error => "keyword_label_error"
    }
    mutate {
      replace => {
        "keyword_label.value.string_value" => "%{keyword}"
      }
      on_error => "keyword_label_error"
    }
    if ![keyword_label_error] {
      mutate {
        replace => {
          "keyword_label.key" => "keywords: %{index_1}"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "keyword_label"
        }
        on_error => "keyword_label_merge_error"
      }
    }
  }

  if [level] != "" {
    if [level] in ["1", "2", "3"] {
      mutate{
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [level] == "4" {
      mutate{
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [level] == "5" {
      mutate{
        replace => {
          "security_result.severity" => "CRITICAL"
        }
      }
    }
    else {
      mutate{
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }
  }

  if [message] != "" {
    grok {
      match => {
        "message" => [
          "Ioctl End\\n\\nioctlCode: %{DATA:ioctl_Code},\\ndelta \\(100 ns\\): %{INT:n_delta},\\nntStatus: %{DATA:nt_status}\\(NT=%{DATA:NT}\\)"
        ]
      }
      overwrite => ["ioctl_Code", "n_delta", "nt_status", "NT"]
      on_error => "grok_error"
    }
  }
  if [ioctl_Code] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{ioctl_Code}"
      }
      on_error => "ioctlCode_error"
    }
  }
  if [n_delta] != "" {
    mutate {
      replace => {
        "network.session_duration.nanos" => "%{n_delta}"
      }
      on_error => "ndelta_error"
    }
    mutate {
      convert => {
        "network.session_duration.nanos" => "integer"
      }
      on_error => "ndelta_conversion_error"
    }
  }
  if [nt_status] != "" {
    mutate {
      convert => {
        "nt_status" => "string"
      }
      on_error => "nt_status_conversion_error"
    }
    mutate {
      replace => {
        "nt_status_label.value" => "%{nt_status}"
      }
      on_error => "nt_status_error"
    }
    if ![nt_status_error] {
      mutate {
        replace => {
          "nt_status_label.key" => "nt_status"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "nt_status_label"
        }
        on_error => "ntStatus_merge_error"
      }
    }
  }

  if [NT] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{NT}"
      }
      on_error => "NT_error"
    }
  }

  if [opcode] != "" {
    mutate {
      replace => {
        "opcode_label.value.string_value" => "%{opcode}"
      }
      on_error => "opcode_error"
    }
    if ![opcode_error] {
      mutate {
        replace => {
          "opcode_label.key" => "Opcode"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "opcode_label"
        }
        on_error => "opcode_merge_error"
      }
    }
  }


  if [provider][event_source] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{provider.event_source}"
      }
      on_error => "provider_event_source_error"
    }
  }

  if [provider][guid] != "" {
    mutate {
      gsub => ["provider.guid" , "{|}", ""]
    }
    mutate {
      replace => {
        "target.resource.id" => "%{provider.guid}"
        "target.resource.type" => "Hyper-V VmSwitch"
        "has_target" => "true"
      }
      on_error => "provider_guid_error"
    }
  }

  if [provider][name] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{provider.name}"
      }
      on_error => "provider_name_error"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.product_name" => "Microsoft-Windows-Hyper-V"
      }
      on_error => "product_name_error"
    }
  }

  if [record_id] != "" {
    mutate {
      convert => {
        "record_id" => "string"
      }
      on_error => "record_id_conversion_error"
    }
    mutate {
      replace => {
        "metadata.product_log_id" => "%{record_id}"
      }
      on_error => "record_id_error"
    }
  }

  if [security][user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{security.user_id}"
        "has_principal" => "true"
      }
      on_error => "user_id_error"
    }
  }

  if [system_time] != "" {
    date {
      match => ["system_time","yyyy-mm-ddThh:mm:ss.SSSSSSSZ", "RFC3339", "ISO8601"]
      target => "metadata.collected_timestamp"
      on_error => "system_time_error"
    }
  }

  if [task] != "" {
    mutate {
      replace => {
        "task_label.value.string_value" => "%{task}"
      }
      on_error => "task_error"
    }
    if ![task_error] {
      mutate {
        replace => {
          "task_label.key" => "Task"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "task_label"
        }
        on_error => "task_merge_error"
      }
    }
  }

  if [Hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{Hostname}"
        "has_principal" => "true"
      }
      on_error => "hostname_not_found"
    }
  }

  if [EventTime] != "" {
    mutate {
      convert => {
        "EventTime" => "string"
      }
    }
    date {
      match => ["EventTime","UNIX","UNIX_MS"]
      rebase => true
      on_error => "not_unix_format"
      target => "metadata.event_timestamp"
    }
  }

  if [EventReceivedTime] != "" {
    date {
      match => ["EventReceivedTime", "UNIX","UNIX_MS"]
      rebase => true
      on_error => "no_format_match"
      target => "metadata.collected_timestamp"
    }
  }

  if [Message] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{Message}"
      }
      on_error => "message_error"
    }
  }

  if [Domain] != "" {
    mutate {
      replace => {
        "principal.administrative_domain" => "%{Domain}"
      }
      on_error => "domain_error"
    }
  }

  if [Keywords] != "" {
    mutate {
      convert => {
        "Keywords" => "string"
      }
      on_error => "keywords_conversion_error"
    }
    if ![keywords_conversion_error] {
      mutate {
        replace => {
          "keywords_label.key" => "keywords"
          "keywords_label.value.string_value" => "%{Keywords}"
        }
        on_error => "keywords_label_error"
      }
      mutate {
        merge => {
          "additional.fields" => "keywords_label"
        }
        on_error => "keywords_label_merge_error"
      }
    }
  }

  if [Severity] != "" {
    if [Severity] =~ "(?i)INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
        on_error => "severity_error"
      }
    }
    else if [Severity] =~ "WARN" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
        on_error => "severity_error"
      }
    }
    else if [Severity] =~ "ERROR" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
        on_error => "severity_error"
      }
    }
  }

  if [EventType] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{EventType}"
      }
      on_error => "severity_details_not_found"
    }
  }

  if [SeverityValue] != "" {
    mutate {
      convert => {
        "SeverityValue" => "string"
      }
      on_error => "severity_value_conversion_error"
    }
    mutate {
      replace => {
        "severityValue_label.key" => "SEVERITY_VALUE"
        "severityValue_label.value.string_value" => "%{SeverityValue}"
      }
      on_error => "severity_value_error"
    }
    mutate {
      merge => {
        "additional.fields" => "severityValue_label"
      }
      on_error => "severity_value_merge_error"
    }
  }

  if [SourceName] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{SourceName}"
      }
      on_error => "source_name_not_found"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.product_name" => "Microsoft-Windows-Hyper-V"
      }
      on_error => "product_name_error"
    }
  }

  if [EventID] != "" {
    mutate {
      convert => {
        "EventID" => "string"
      }
      on_error => "event_id_conversion_error"
    }
    mutate {
      replace => {
        "additional_event_id.key" => "EventID"
        "additional_event_id.value.string_value" => "%{EventID}"
      }
      merge => {
        "additional.fields" => "additional_event_id"
      }
      on_error => "event_id_error"
    }
  }

  if [ProviderGuid] != "" {
    mutate {
      gsub => ["ProviderGuid" , "{|}", ""]
    }
    mutate {
      replace => {
        "target.resource.id" => "%{ProviderGuid}"
        "has_target" => "true"
      }
      on_error => "provider_guid_error"
    }
  }

  if [ActivityId] != "" {
    mutate {
      gsub => ["ActivityID", "[{}]", ""]
    }
    mutate {
      replace => {
        "detection_fields.key" => "Activity ID"
        "detection_fields.value" => "%{ActivityID}"
      }
      on_error => "no_ActivityID"
    }
    if ![no_ActivityID] {
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_fields"
        }
      }
    }
  }

  if [Version] != "" {
    mutate {
      convert => {
        "Version" => "string"
      }
      on_error => "version_error"
    }
    if ![version_error] {
      mutate {
        replace => {
          "metadata.product_version" => "%{Version}"
        }
        on_error => "version_not_found"
      }
    }
  }

  if [OpcodeValue] != "" {
    mutate {
      convert => {
        "OpcodeValue" => "string"
      }
      on_error => "opcode_value_conversion_error"
    }
    if ![opcode_value_conversion_error] {
      mutate {
        replace => {
          "additional_opcode_value.key" => "OpcodeValue"
          "additional_opcode_value.value.string_value" => "%{OpcodeValue}"
        }
        merge => {
          "additional.fields" => "additional_opcode_value"
        }
        on_error => "opcodevalue_error"
      }
    }
  }


  if [RecordNumber] != "" {
    mutate {
      convert => {
        "RecordNumber" => "string"
      }
      on_error => "record_number_conversion_error"
    }
    if ![record_number_conversion_error] {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{RecordNumber}"
        }
        on_error => "record_number_error"
      }
    }
  }
  if [ProcessID] != "" {
    mutate {
      convert => {
        "ProcessID" => "string"
      }
      on_error => "pid_conversion_error"
    }
    if ![pid_conversion_error] {
      mutate {
        replace => {
          "target.process.pid" => "%{ProcessID}"
          "has_target_process" => "true"
          "has_target" => "true"
        }
        on_error => "pid_not_found"
      }
    }
  }
  if [ThreadID] != "" {
    mutate {
      convert => {
        "ThreadID" => "string"
      }
      on_error => "tid_conversion_error"
    }
    if ![tid_conversion_error] {
      mutate {
        replace => {
          "target.process.product_specific_process_id" => "ThreadID: %{ThreadID}"
          "has_target_process" => "true"
          "has_target" => "true"
        }
        on_error => "tid_not_found"
      }
    }
  }

  if [Channel] != "" {
    mutate {
      replace => {
        "channel_label.key" => "Channel"
        "channel_label.value.string_value" => "%{Channel}"
      }
      on_error => "channel_error"
    }
    mutate {
      merge => {
        "additional.fields" => "channel_label"
      }
      on_error => "channel_merge_error"
    }
  }

  if [AccountName] != "" {
    mutate {
      replace => {
        "principal.user.role_description" => "%{AccountName}"
      }
      on_error => "principal_account_name_error"
    }
  }

  if [UserID] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{UserID}"
        "has_principal" => "true"
      }
      on_error => "userid_not_found"
    }
  }

  if [AccountType] != "" {
    mutate {
      replace => {
        "principal.user.role_name" => "%{AccountType}"
      }
      on_error => "accountType_not_found"
    }
  }

  if [Opcode] != "" {
    mutate {
      replace => {
        "additional_opcode.key" => "Opcode"
        "additional_opcode.value.string_value" => "%{Opcode}"
      }
      merge => {
        "additional.fields" => "additional_opcode"
      }
      on_error => "opcode_error"
    }
  }

  if [SourceModuleName] != "" {
    mutate {
      replace => {
        "additional_source_module_name.key" => "SourceModuleName"
        "additional_source_module_name.value.string_value" => "%{SourceModuleName}"
      }
      merge => {
        "additional.fields" => "additional_source_module_name"
      }
      on_error => "soure_module_error"
    }
  }

  if [SourceModuleType] != "" {
    mutate {
      replace => {
        "additional_source_module_type.key" => "SourceModuleType"
        "additional_source_module_type.value.string_value" => "%{SourceModuleType}"
      }
      merge => {
        "additional.fields" => "additional_source_module_type"
      }
      on_error => "source_module_type_error"
    }
  }

  if [has_principal] == "true" and [has_target_process] == "true" {
    mutate {
      replace => {
        "event_type" => "PROCESS_LAUNCH"
      }
    }
  }

  else if [has_principal] == "true" and [has_target_process] == "false" {
    mutate {
      replace => {
        "event_type" => "PROCESS_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [has_target_process] == "false" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  else if [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
