# Product: Cisco Wips
# Category: Cisco Wips
# Supported Format: SYSLOG + KV
# Reference: https://www.cisco.com/c/en/us/products/collateral/wireless/adaptive-wireless-ips-software/data_sheet_c78-501388.html
# Last Updated: 2023-11-17
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "kv_data" => ""
      "reportingEntityAddress" => ""
      "detectingIPString" => ""
      "UTCreportingEntityAddress" => ""
      "rogueApMacAddr" => ""
      "lradName" => ""
      "srcObjectId" => ""
      "srcObjectClassId" => ""
      "numOfDetectingAps" => ""
      "detectingAPRadioType" => ""
      "lradMacAddr" => ""
      "security_result" => ""
      "eventType" => ""
      "description" => ""
      "authEntityId" => ""
      "category" => ""
      "severity" => ""
      "host" => ""
      "source" => ""
      "instanceId" => ""
      "instanceVersion" => ""
      "instanceUuid" => ""
      "applicationCategoryData" => ""
      "sigAlertDescription" => ""
      "subclassName" => ""
      "detectingApCount" => ""
      "previousSeverity" => ""
      "applicationSpecificAlarmID" => ""
      "attackerMacAddr" => ""
      "macInfo" => ""
      "notificationDeliveryMechanism" => ""
      "displayName" => ""
      "user_id" => ""
      "signatureName" => ""
      "security_result_action" => ""
      "extensions_auth_type" => ""
      "is_target_present" => "false"
      "is_principal_present" => "false"
      "event_type" => "GENERIC_EVENT"
      "vendor_name" => "Cisco"
      "product_name" => "Wireless Intrusion Prevention System (WIPS)"
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP}\\s+%{DATA:hostname}\\s+%{DATA}:%{GREEDYDATA:kv_data}"
        "<%{INT}>%{SYSLOGTIMESTAMP}\\s+%{DATA;hostname}\\s+%{DATA}:\\s+%{DATA:desc}.,%{GREEDYDATA:kv_data}"
      ]
    }
    overwrite => ["kv_data"]
    on_error => "grok_fail"
  }

  mutate {
    gsub => [
      "kv_data", ", ", ","
    ]
  }

  if [kv_data] != "" {
    kv {
      source => "kv_data"
      field_split => ","
      value_split => "="
      on_error => "not_kv"
    }
  }

  if [grok_fail] or [not_kv] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  #principal
  if [reportingEntityAddress] != "" {
    grok {
      match => {
        "reportingEntityAddress" => [
          "%{IP}"
        ]
      }
      on_error => "not_ip"
    }
    if ![not_ip] {
      mutate {
        merge => {
          "principal.ip" => "reportingEntityAddress"
        }
      }
      mutate {
        replace => {
          "is_principal_present" => "true"
        }
      }
    }
    else {
      mutate {
        replace => {
          "principal.hostname" => "%{reportingEntityAddress}"
        }
      }
      mutate {
        replace => {
          "is_principal_present" => "true"
        }
      }
    }
  }

  if [source] != "" {
    grok {
      match => {
        "source" => [
          "%{MAC:mac}"
          "(?P<host>[\\w\\-\\.]+)"
        ]
      }
      overwrite => ["mac","host"]
      on_error => "grok_fail"
    }
    if ![grok_fail] {
      mutate {
        merge => {
          "principal.mac" => "mac"
        }
        on_error => "mac_not_set"
      }
      mutate {
        replace => {
          "is_principal_present" => "true"
        }
      }
    }
    if [host] != "" {
      grok {
        match => {
          "host" => [
            "%{IP}"
          ]
        }
        on_error => "not_ip2"
      }
      if ![not_ip2] {
        mutate {
          merge => {
            "principal.ip" => "host"
          }
        }
        mutate {
          replace => {
            "is_principal_present" => "true"
          }
        }
      }
      else {
        mutate {
          replace => {
            "principal.hostname" => "%{host}"
            "is_principal_present" => "true"
          }
        }
      }
    }
  }

  if [displayName] != "" {
    grok {
      match => {
        "displayName" => [
          "host/(?P<user_id>[\\w-]+)"
        ]
      }
      on_error => "pattern_not_matched"
      overwrite => ["user_id"]
    }
    if ![pattern_not_matched] {
      mutate {
        replace => {
           "principal.user.userid" => "%{user_id}"
        }
      }
    }
  }

  if [srcObjectId] != "" {
    mutate {
      replace => {
        "srcObjectId_label.key" => "srcObjectId"
        "srcObjectId_label.value" => "%{srcObjectId}"
      }
    }
    mutate {
      merge => {
        "principal.resource.attribute.labels" => "srcObjectId_label"
      }
    }
  }

  if [srcObjectClassId] != "" {
    mutate {
      replace => {
        "srcObjectClassId_label.key" => "srcObjectClassId"
        "srcObjectClassId_label.value" => "%{srcObjectClassId}"
      }
    }
    mutate {
      merge => {
        "principal.resource.attribute.labels" => "srcObjectClassId_label"
      }
    }
  }

  if [instanceId] != "" {
    mutate {
      replace => {
        "instanceId_label.key" => "instanceId"
        "instanceId_label.value" => "%{instanceId}"
      }
    }
    mutate {
      merge => {
        "principal.resource.attribute.labels" => "instanceId_label"
      }
    }
  }

  if [authEntityId] != "" {
    mutate {
      replace => {
        "authEntityId_label.key" => "authEntityId"
        "authEntityId_label.value" => "%{authEntityId}"
      }
    }
    mutate {
      merge => {
        "principal.resource.attribute.labels" => "authEntityId_label"
      }
    }
  }

  if [instanceVersion] != "" {
    mutate {
      replace => {
        "instanceVersion_label.key" => "instanceVersion"
        "instanceVersion_label.value" => "%{instanceVersion}"
      }
    }
    mutate {
      merge => {
        "principal.resource.attribute.labels" => "instanceVersion_label"
      }
    }
  }

  #target
  if [detectingIPString] != "" {
    grok {
      match => {
        "detectingIPString" => [
          "%{IP}"
        ]
      }
      on_error => "not_ip1"
    }
    if ![not_ip1] {
      mutate {
        merge => {
          "target.ip" => "detectingIPString"
        }
      }
      mutate {
        replace => {
          "is_target_present" => "true"
        }
      }
    }
    else {
      mutate {
        replace => {
          "target.hostname" => "%{detectingIPString}"
          "is_target_present" => "true"
        }
      }
    }
  }

  if [lradName] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{lradName}"
      }
    }
  }

  if [lradMacAddr] != "" {
    mutate {
      merge => {
        "target.mac" => "lradMacAddr"
      }
      on_error => "lrad_not_mac"
    }
    mutate {
      replace => {
        "is_target_present" => "true"
      }
    }
  }

  if [attackerMacAddr] != "" {
    mutate {
      merge => {
        "target.mac" => "attackerMacAddr"
      }
      on_error => "attackerMacAddr_not_mac"
    }
    mutate {
      replace => {
        "is_target_present" => "true"
      }
    }
  }


  if [numOfDetectingAps] != "" {
    mutate {
      replace => {
        "numOfDetectingAps_label.key" => "numOfDetectingAps"
        "numOfDetectingAps_label.value" => "%{numOfDetectingAps}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "numOfDetectingAps_label"
      }
    }
  }

  if [macInfo] != "" {
    mutate {
      replace => {
        "macInfo_label.key" => "macInfo"
        "macInfo_label.value" => "%{macInfo}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "macInfo_label"
      }
    }
  }

  if [notificationDeliveryMechanism] != "" {
    mutate {
      replace => {
        "notificationDeliveryMechanism_label.key" => "notificationDeliveryMechanism"
        "notificationDeliveryMechanism_label.value" => "%{notificationDeliveryMechanism}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "notificationDeliveryMechanism_label"
      }
    }
  }

  if [signatureName] != "" {
    mutate {
      replace => {
        "signatureName_label.key" => "signatureName"
        "signatureName_label.value" => "%{signatureName}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "signatureName_label"
      }
    }
  }

  if [detectingAPRadioType] != "" {
    mutate {
      replace => {
        "detectingAPRadioType_label.key" => "detectingAPRadioType"
        "detectingAPRadioType_label.value" => "%{detectingAPRadioType}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "detectingAPRadioType_label"
      }
    }
  }

  if [detectingApCount] != "" {
    mutate {
      replace => {
        "detectingApCount_label.key" => "detectingApCount"
        "detectingApCount_label.value" => "%{detectingApCount}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "detectingApCount_label"
      }
    }
  }

  if [previousSeverity] != "" {
    mutate {
      replace => {
        "previousSeverity_label.key" => "previousSeverity"
        "previousSeverity_label.value" => "%{previousSeverity}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "previousSeverity_label"
      }
    }
  }

  if [applicationSpecificAlarmID] != "" {
    mutate {
      replace => {
        "applicationSpecificAlarmID_label.key" => "applicationSpecificAlarmID"
        "applicationSpecificAlarmID_label.value" => "%{applicationSpecificAlarmID}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "applicationSpecificAlarmID_label"
      }
    }
  }
  if [eventType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{eventType}"
      }
    }
  }
  mutate {
    uppercase => ["eventType"]
  }

  #security
  if [eventType] == "MALICIOUS_ROGUE_AP_DETECTED" {
    mutate {
      replace => {
        "security_result_category" => "NETWORK_MALICIOUS"
      }
    }
  }
  else if [eventType] == "SIGNATURE_ATTACK" {
    mutate {
      replace => {
         "security_result_category" => "NETWORK_SUSPICIOUS"
      }
    }
  }
  else if [eventType] == "USER_AUTHENTICATION_FAILURE" {
    mutate {
      replace => {
         "security_result_category" => "AUTH_VIOLATION"
      }
    }
  }
  mutate {
    merge => {
      "security_result.category" => "security_result_category"
    }
    on_error => "category_not_set"
  }

  if [severity] != "" {
    mutate {
      uppercase => ["severity"]
    }

    if [severity] in ["0", "1","CRITICAL","VERY-HIGH"] {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
      }
    }
    else if [severity] in ["2","3","4","HIGH"] {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    else if [severity] in ["5", "MEDIUM"] {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else if [severity] in ["6", "7", "LOW"] {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
  }

  if [applicationSpecificAlarmID] =~ "(?i)BlackList" or [eventType] in ["SIGNATURE_ATTACK","MALICIOUS_ROGUE_AP_DETECTED","SIGNATURE_ATTACK","USER_AUTHENTICATION_FAILURE"] {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
  }

  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
    }
  }

  if [applicationCategoryData] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{applicationCategoryData}"
      }
    }
  }

  if [sigAlertDescription] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{sigAlertDescription}"
      }
    }
  }

  if [category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "category"
      }
    }
  }

  if [subclassName] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{subclassName}"
      }
    }
  }

  #network

  if [notificationDeliveryMechanism] =~ "(?i)snmp" {
    mutate {
      replace => {
        "network.ip_protocol" => "UDP"
      }
    }
  }

  #common fields
  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
    }
  }

  if [instanceUuid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{instanceUuid}"
      }
    }
  }

  if [vendor_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor_name}"
      }
    }
  }

  if [product_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product_name}"
      }
    }
  }

  if [eventType] == "USER_AUTHENTICATION_FAILURE" and [user_id] != "" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "extensions_auth_type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [is_target_present] == "true" and [is_principal_present] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [is_principal_present] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [user_id] != "" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  if [extensions_auth_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "%{extensions_auth_type}"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "network" => "event.idm.read_only_udm.network"
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

