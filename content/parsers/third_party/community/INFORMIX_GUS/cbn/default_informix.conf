# Product: INFORMIX
# Category: DATABASE
# Supported Format: JSON + SYSLOG, SYSLOG + CSV
# Reference: "https://www.ibm.com/products/informix"
# Last Updated: 2026-07-28
# Copyright 2026 Google SecOps


filter {
  mutate {
    replace => {
      "file_name" => ""
      "msg" => ""
      "instanceCode" => ""
      "timestamp" => ""
      "hostName" => ""
      "processId" => ""
      "serverName" => ""
      "userName" => ""
      "data" => ""
      "errorCode" => ""
      "eventName" => ""
      "dbName" => ""
      "eventOutput" => ""
      "length" => ""
      "kv_data" => ""
      "kv_data_1" => ""
      "type" => ""
      "blob_name" => ""
      "description" => ""
      "security_result" => ""
      "syslog_timestamp" => ""
      "syslog_hostname" => ""
      "syslog_process" => ""
      "status_flag" => ""
      "event_timestamp" => ""
      "remote_hostname" => ""
      "remote_port" => ""
      "service_name" => ""
      "database_name" => ""
      "session_status" => ""
      "csv_data" => ""
      "has_principal_user" => "false"
      "has_target" => "false"
      "has_principal" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_valid"
  }

  mutate {
    gsub => [ "msg", "\\\n", "#" ]
  }

  if [not_valid] {
    grok {
      match => {
        "message" => ["%{SYSLOGTIMESTAMP:syslog_timestamp} %{IPORHOST:syslog_hostname} %{DATA:syslog_process}: %{GREEDYDATA:csv_data}"]
      }
      overwrite => ["syslog_timestamp", "syslog_hostname", "syslog_process", "csv_data"]
      on_error => "not_valid_grok"
    }
  }
  if [csv_data] != "" {
    mutate {
      gsub => ["csv_data", "\\|", "#"]
    }
    csv {
      source => "csv_data"
      separator => "#"
      on_error => "log_not_found"
    }
  }
  mutate {
    replace => {
      "status_flag" => "%{column1}"
    }
    on_error => "no_status_flag"
  }
  mutate {
    replace => {
      "event_timestamp" => "%{column2}"
    }
    on_error => "no_event_timestamp"
  }
  mutate {
    replace => {
      "remote_hostname" => "%{column3}"
    }
    on_error => "no_remote_hostname"
  }
  mutate {
    replace => {
      "remote_port" => "%{column4}"
    }
    on_error => "no_remote_port"
  }
  mutate {
    replace => {
      "service_name" => "%{column5}"
    }
    on_error => "no_service_name"
  }
  mutate {
    replace => {
      "database_name" => "%{column6}"
    }
    on_error => "no_database_name"
  }
  mutate {
    replace => {
      "session_status" => "%{column7}"
    }
    on_error => "no_session_status"
  }
  if [msg] != "" {
    grok {
      match => {
        "msg" => ["(?P<instanceCode>([^|])*)\\|(?P<timestamp>([^|])*)\\|(?P<hostName>([^|])*)\\|(?P<processId>([^|])*)\\|(?P<serverName>([^|])*)\\|(?P<userName>([^|])*)\\|%{GREEDYDATA:data}",
                  "%{GREEDYDATA:description}: <%{GREEDYDATA:kv_data}>. %{GREEDYDATA:kv_data_1}"]
      }
      overwrite => ["instanceCode", "timestamp", "hostName", "processId", "serverName", "userName", "data", "description", "kv_data", "kv_data_1"]
      on_error => "no_msg_grok"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{description}"
      }
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => [ "kv_data", "( [a-zA-Z0-9]+)", "|$1" ]
    }
    kv {
      source => "kv_data"
      field_split => "|"
      value_split => "="
    }
    mutate {
      replace => {
        "id_label.key" => "Message Id"
        "id_label.value" => "%{id}"
        "dequeue_count_label.key" => "Dequeue Count"
        "dequeue_count_label.value" => "%{dequeue_count}"
      }
    }
    mutate {
      merge => {
        "about.labels" => "id_label"
      }
    }
    mutate {
      merge => {
        "about.labels" => "dequeue_count_label"
      }
    }
  }

  if [kv_data_1] != ""{
    kv {
      source => "kv_data_1"
      field_split => "#"
      value_split => ":"
    }
    mutate {
      replace => {
        "security_result.description" => "%{Exception}"
      }
    }
    mutate {
      replace => {
        "security_result.rule_name" => "%{ErrorCode}"
      }
      on_error => "no_error_code"
    }

    mutate {
      replace => {
        "request_id_label.key" => "Request Id"
        "request_id_label.value" => "%{RequestId}"
      }
      on_error => "no_request_id"
    }
    if ![no_request_id] {
      mutate {
        merge => {
          "about.labels" => "request_id_label"
        }
      }
    }
  }

  if [data] != "" {
    grok {
      match => {
        "data" => ["(?P<errorCode>([^:])*)\:(?P<eventName>([^:])*)\:(?P<dbName>([^:])*)\:%{GREEDYDATA:eventOutput}#"]
      }
      overwrite => ["errorCode", "eventName", "dbName", "eventOutput"]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{dbName}"
        "event.idm.read_only_udm.principal.resource.type" => "DATABASE"
        "eventOutput_label.key" => "Event Output"
        "eventOutput_label.value" => "%{eventOutput}"
        "eventName_label.key" => "Event Name"
        "eventName_label.value" => "%{eventName}"
      }
    }
    if [errorCode] == "0" {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result_action" => "BLOCK"
        }
      }
    }

    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "eventOutput_label"
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "eventName_label"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "INFORMIX"
      "event.idm.read_only_udm.metadata.product_name" => "IBM"
    }
  }

  if [type] == "ERROR" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.target.file.full_path" => "%{blob_name}"
        "security_result_action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
    }
  }
  else {
    if [userName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{userName}"
        }
        on_error => "no_principal_user"
      }
      if ![no_principal_user] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }
    if [hostName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{hostName}"
        }
        on_error => "no_host_name"
      }
    }
    if [processId] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{processId}"
        }
        on_error => "no_process_id"
      }
    }
    if [file_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{file_name}"
        }
        on_error => "no_file_name"
      }
    }
    if [serverName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.asset_id" => "PRODUCT_SPECIFIC_ID: %{serverName}"
        }
        on_error => "no_server_name"
      }
    }
  }
  if [syslog_timestamp] != "" {
    date {
      match => [ "syslog_timestamp", "MMM dd HH:mm:ss" ]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      rebase => true
      on_error => "date_parse_error"
    }
  }
  if [event_timestamp] != "" {
    date {
      match => [ "event_timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601" ]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "event_timestamp_error"
    }
  }
  if [syslog_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{syslog_hostname}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{syslog_hostname}"
      }
      on_error => "no_syslog_hostname"
    }
    if ![no_syslog_hostname] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [syslog_process] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{syslog_process}"
      }
      on_error => "no_syslog_process"
    }
  }
  if [status_flag] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{status_flag}"
      }
      on_error => "status_flag_error"
    }
  }
  if [remote_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{remote_hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{remote_hostname}"
      }
      on_error => "remote_hostname_error"
    }
    if ![remote_hostname_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [remote_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{remote_port}"
      }
      on_error => "remote_port_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "remote_port_not_set"
    }
  }
  if [service_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{service_name}"
      }
      on_error => "service_name_error"
    }
  }
  if [database_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{database_name}"
        "event.idm.read_only_udm.target.resource.resource_type" => "DATABASE"
      }
      on_error => "database_name_error"
    }
  }
  if [session_status] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{session_status}"
      }
      on_error => "session_status_error"
    }
  }
  if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SYSTEM_AUDIT_LOG_UNCATEGORIZED"
      }
    }
  }
  else if [has_target] == "true" and [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [kv_data] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
