# Product: TrendMicro Web Proxy
# Category: Web Proxy
# Supported Format: SYSLOG + KV
# Reference: https://support.quest.com/technical-documents/intrust/11.4.1/preparing-for-auditing-trend-micro-interscan-web-security/2#TOPIC-1188124
# Last Updated: 2024-03-26
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "tk_category" => ""
      "tk_client_ip" => ""
      "tk_description" => ""
      "tk_mime_content" => ""
      "tk_operation" => ""
      "tk_protocol" => ""
      "tk_rule_name" => ""
      "tk_username" => ""
      "tk_user" => ""
      "tk_url" => ""
      "tk_scan_type" => ""
      "tk_server" => ""
      "tk_server_ip" => ""
      "tk_size" => ""
      "tk_source" => ""
      "inner_message" => ""
      "timezone" => ""
      "tk_date_field" => ""
      "log_header" => ""
      "eventtype" => ""
      "log_severity" => ""
      "security_result" => ""
      "intermediary.hostname" => ""
      "hostname" => ""
      "cef_data" => ""
      "src_host" => ""
      "adDomain" => ""
      "act" => ""
      "logType" => ""
      "appName" => ""
      "event_id" => ""
      "has_target" => "false"
      "has_principal" => "false"
      "has_protocol" => "false"
      "dst" => ""
      "domainName" => ""
      "src" => ""
      "category" => ""
      "companyID" => ""
      "gatewayName" => ""
      "userName" => ""
      "src_1" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "<%{POSINT}>%{HOSTNAME:hostname}: <%{DAY}, %{MONTHDAY:day} %{MONTH:month} %{YEAR:year} %{TIME:time},%{WORD:timezone}> \\[%{DATA:eventtype}\\|%{DATA:log_severity}\\] (?P<log_header>[a-zA-Z\\s]*) %{GREEDYDATA:inner_message}",
        "<%{POSINT}\>%{INT} %{NOTSPACE:event_time} %{HOSTNAME:host} %{NOTSPACE} - %{HOSTNAME} \\[%{GREEDYDATA:kv_data1}\\] source: %{HOSTNAME:src_host}\\s+\\|\\s+message:%{GREEDYDATA:cef_data} { level: %{GREEDYDATA:cef_data2}",
        "<%{INT}>CEF:%{INT}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data} msg=%{GREEDYDATA:cef_data}"
      ]
    }
    overwrite => ["inner_message", "timezone","log_header", "eventtype", "log_severity","hostname","cef_data", "src_host"]
    on_error => "grok_fail"
  }
  if [grok_fail] and [message] =~ "^<.*" and [message] =~ "CEF:" {
    mutate {
      replace => {
        "cef_data" => "%{message}"
      }
    }
  }
  if [inner_message] != "" {
    mutate {
      gsub => ["inner_message", ';tk', ',tk']
    }

    kv {
      source => "inner_message"
      field_split => ","
      value_split => "="
    }

  # timestamp
    if [tk_date_field] != "" {
      date {
        match => ["tk_date_field", "yyyy-MM-dd HH:mm:ssZ"]
        on_error => "parsing_date_error"
      }

      if [parsing_date_error] {
        if [timezone] == "ICT" { # Indochina Time
          mutate {
            replace => {
              "tk_date_field" => "%{year}-%{month}-%{day} %{time}+0700"
            }
          }
          date {
            match => ["tk_date_field", "yyyy-MMM-dd HH:mm:ssZ"]
            on_error => "parsing_date_error_ict"
          }
          if [parsing_date_error_ict] {
            drop {
              tag => "TAG_UNSUPPORTED"
            }
          }
        }
      }
    }

    # hostname: principal or intermediary

    if [tk_server] != "" {
      mutate {
        replace => {
          "hostname" => "%{tk_server}"
        }
      }
    }

    if [eventtype] in ["EVT_AUDITING", "EVT_PERFORMANCE", "EVT_SYSEVENT_AU_SUCC", "EVT_SYSEVENT_AU_FAIL"] {
      mutate {
        replace => {
          "principal.hostname" => "%{hostname}"
          "intermediary.hostname" => ""
        }
      }
    }
    else {
      mutate {
        replace => {
          "intermediary.hostname" => "%{hostname}"
        }
      }
    }

    # principal
    if [tk_source] != "" {
      mutate {
        replace => {
          "principal.application" => "%{tk_source}"
        }
      }
    }

    if [tk_user] != "" {
      # sysadmin user
      mutate {
        replace => {
          "principal.user.userid" => "%{tk_user}"
        }
      }
    }
    else if [tk_username] != "" {
      # if it is not IP, extract first and last name
      if [tk_username] =~ /[a-zA-Z]+/ {
        grok {
          match => {
            "tk_username" => ["%{WORD:first_name} %{WORD:lastname}"]
          }
          on_error => "has_no_lastname"
        }

        if [has_no_lastname] {
          mutate {
            replace => {
              "principal.user.first_name" => "%{tk_username}"
              "principal.user.user_display_name" => "%{tk_username}"
            }
          }
        }
        else {
          mutate {
            rename => {
              "first_name" => "principal.user.first_name"
              "lastname" => "principal.user.last_name"
            }
          }
        }
      }

      mutate {
        replace => {
          "principal.user.userid" => "%{tk_username}"
        }
      }
    }

    if [tk_client_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "tk_client_ip"
        }
        on_error => "merge_failed"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
        on_error => "replace_failed"
      }
    }

    # target

    if [tk_server_ip] != "" {
      mutate {
        merge => {
          "target.ip" => "tk_server_ip"
        }
        on_error => "merge_failed"
      }
      mutate {
        replace =>{
          "has_target" => "true"
        }
        on_error => "replace_failed"
      }
    }

    if [tk_url] != "" {
      # the url may contain the port, ex: https://www.example.com (443)
      grok {
        match => { "tk_url" => "\\W+(\\(%{POSINT:port}\\))" }
        overwrite => ["port"]
        on_error => "missing_url_port"
      }

      if ![missing_url_port] {
        mutate {
          rename => {
            "port" => "target.port"
          }
          gsub => [
            "tk_url", "\\s\(.*\)", "" # remove the port from url
          ]
          convert => {
            "target.port" => "integer"
          }
        }
      }

      # get the domain from the url (tk_domain is not always filled)
      grok {
        match => { "tk_url" => "\\w+://%{HOSTNAME:domain}" }
        overwrite => ["domain"]
      }

      mutate {
        rename => {
          "domain" => "target.hostname"
        }
        replace => {
          "target.url" => "%{tk_url}"
        }
      }

      # get the path from the url (tk_path is not always filled)
      grok {
        match => { "tk_url" => "\\w+://%{HOSTNAME}%{GREEDYDATA:path}" }
        on_error => "missing_url_path"
      }

      if [missing_url_path] {
        # set the root path
        mutate {
          replace => {
            "target.file.full_path" => "/"
          }
        }
      }
      else {
        mutate {
          replace => {
            "target.file.full_path" => "%{path}"
          }
        }
      }

      if [tk_mime_content] != "" {
        mutate {
          rename => {
            "tk_mime_content" => "target.file.mime_type"
          }
        }
      }

      if [tk_size] != "" {
        mutate {
          replace => {
            "target.file.size" => "%{tk_size}"
          }
          convert => {
            "target.file.size" => "uinteger"
          }
        }
      }
    }

    # tk_protocol may contain the protocols or application name
    if [tk_protocol] not in ["", "http", "https"] {
      mutate {
        replace => {
          "target.application" => "%{tk_protocol}"
        }
      }
    }

    # network

    if [tk_size] != "" {
      mutate {
        replace => {
          "network.received_bytes" => "%{tk_size}"
        }
      }
      mutate {
        convert => {
          "network.received_bytes" => "uinteger"
        }
      }
    }

    # get only if tk_protocol contains the protocols
    if [tk_protocol] in ["http", "https"] {
      mutate {
        replace => {
          "network.application_protocol" => "%{tk_protocol}"
          "network.ip_protocol" => "TCP"
        }
        uppercase => [
          "network.application_protocol"
        ]
      }
      mutate {
        replace => {
          "has_protocol" => "true"
        }
        on_error => "replace_failed"
      }
    }

    if [tk_operation] != "" {
      mutate {
        rename => {
          "tk_operation" => "network.http.method"
        }
      }
    }

    # security_result

    if [log_header] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{log_header}"
        }
      }
    }

    if [tk_description] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{tk_description}"
        }
      }
    }

    if [tk_scan_type] != "" {
      mutate {
        replace => {
          "security_result.description" => "blocked by %{tk_blocked_by} (%{tk_scan_type})"
        }
      }
    }

    if [tk_rule_name] != "" {
      mutate {
        rename => {
          "tk_rule_name" => "security_result.rule_name"
        }
      }
    }

    if [eventtype] in ["EVT_APP_CONTROL_BLOCK", "EVT_URL_BLOCKING"] {
      mutate {
        replace => {
          "security_result_action" => "BLOCK"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
      }
    }

    if [tk_category] != "" and [eventtype] in ["EVT_APP_CONTROL_BLOCK", "EVT_URL_BLOCKING"] {
      mutate {
        merge => {
          "security_result.category_details" => "tk_category"
        }
      }
    }

    if [log_severity] == "LOG_CRIT" {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
      }
    }
    else if [log_severity] == "LOG_WARNING" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else if [log_severity] == "LOG_INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [log_severity] == "LOG_NOTICE" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }

    # about
    if [eventtype] == "EVT_PERFORMANCE" {
      mutate {
        rename => {
          "tk_metric_id" => "labels.key"
          "tk_metric_value" => "labels.value"
        }
      }
      mutate {
        merge => {
          "about.labels" => "labels"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about"
        }
      }
    }
  }

  if [eventtype] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventtype}"
      }
    }
  }

  if [log_header] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{log_header}"
      }
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "TRENDMICRO"
      "metadata.product_name" => "WEBPROXY"
    }
  }

  if [cef_data] != "" and [cef_data] =~ "CEF:" {
    mutate {
      replace => {
        "device_product" => ""
        "device_version" => ""
        "device_vendor" => ""
        "device_event_class_id" => ""
        "event_name" => ""
        "kv_data" => ""
        "kv_data_1" => ""
        "httpTrans" => ""
        "src" => ""
        "dst" => ""
        "companyID" => ""
        "policyName" => ""
        "gatewayName" => ""
      }
    }
    mutate {
      gsub => ["cef_data","src\\\\", "src_1\\"]
    }

    grok {
      match => {
        "cef_data" => [
          "<%{INT}>%{DATA:temp_data}CEF:%{INT}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}fname=activity(i)?;src%{GREEDYDATA:kv_data_1}"
          "<%{INT}>%{DATA:temp_data}CEF:%{INT}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data};r\\\\=%{GREEDYDATA:kv_data_1}act=%{DATA:act} rt%{GREEDYDATA:rt}"
          "<%{INT}>%{DATA:temp_data}CEF:%{INT}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data} act=%{DATA:act} %{GREEDYDATA:kv_data_1}"
          "<%{INT}>%{DATA:temp_data}CEF:%{INT}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}"
          "CEF:%{INT}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}"
        ]
      }
      on_error => "cef_failed"
      overwrite => ["device_product", "device_version", "device_event_class_id", "device_vendor", "event_name", "severity", "kv_data", "kv_data_1", "act"]
    }
    if [device_product] != "" {
      mutate {
        replace => {
          "metadata.product_name" => "%{device_product}"
        }
      }
    }

    if [device_version] != "" {
      mutate {
        replace => {
          "metadata.product_version" => "%{device_version}"
        }
      }
    }

    if [device_vendor] != "" {
      mutate {
        replace => {
          "metadata.vendor_name" => "%{device_vendor}"
        }
      }
    }

    if [kv_data] != "" {
      mutate {
        gsub => ["kv_data", "\\\\", ""]
      }
      mutate {
        gsub => ["kv_data", "([\\w]+)=","#$1="]
      }
      kv {
        source => "kv_data"
        value_split => "="
        field_split => "#"
      }
      if [act] != "" {
        mutate {
          replace => {
            "security_result.action_details" => "%{act}"
          }
          on_error => "action_merge_failed"
        }
      }
      if [src_1] != "" {
        grok {
          match => {
            "src_1" => ["%{IP:ip_src}"]
          }
          on_error => "ip_grok_fail"
        }
        if ![ip_grok_fail] {
          mutate {
            merge => {
              "principal.ip" => "src_1"
            }
            on_error => "merge_failed"
          }
          mutate {
            replace => {
              "has_principal" => "true"
            }
            on_error => "replace_failed"
          }
        }
      }
      if [src] != "" {
        mutate {
          merge => {
            "principal.ip" => "src"
          }
          on_error => "merge_failed"
        }
        mutate {
          replace => {
            "has_principal" => "true"
          }
          on_error => "replace_failed"
        }
      }

      if [dst] != "" {
        mutate {
          merge => {
            "target.ip" => "dst"
          }
          on_error => "merge_failed"
        }
        mutate {
          replace =>{
            "has_target" => "true"
          }
          on_error => "replace_failed"
        }
      }

      if [event_name] != "" and [device_event_class_id] != "" {
        mutate {
          replace => {
            "metadata.product_event_type" => "[%{device_event_class_id}] - %{event_name}"
          }
        }
      }

      if [src_host] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{src_host}"
          }
        }
      }

      if [policyName] != "" {
        mutate {
          replace => {
            "security_result.rule_name" => "%{policyName}"
          }
        }
      }

      if [httpTrans] != "" {
        json {
          source => "httpTrans"
          array_function => "split_columns"
          on_error => "not_json"
        }
        mutate {
          rename => {
            "http_response.status_code" => "network.http.response_code"
          }
          convert => {
            "network.http.response_code" => "integer"
          }
          on_error => "no_status_code"
        }
        mutate {
          replace => {
            "network.http.method" => "%{http_req.method}"
          }
          on_error => "no_http_method"
        }
        mutate {
          replace => {
            "network.application_protocol" => "HTTPS"
          }
        }
        mutate {
          replace => {
            "has_protocol" => "true"
          }
        }
        mutate {
          replace => {
            "network.application_protocol_version" => "%{http_req.version}"
          }
          on_error => "version_not_found"
        }
        if [domainName] != "" {
          mutate {
            replace => {
              "target.hostname" => "%{domainName}"
            }
            on_error => "domain_name_repalce_failed"
          }
        }
        grok {
          match => {
            "http_req.headers.host" => "%{HOSTNAME:tar_host}:%{INT:tar_port}"
          }
          on_error => "grok_fail_header"
        }
        if ![grok_fail_header] {
          mutate {
            replace => {
              "target.hostname" => "%{tar_host}"
            }
            on_error => "no_host_present"
          }
          mutate {
            replace => {
              "target.port" => "%{tar_port}"
            }
            convert => {
              "target.port" => "integer"
            }
          }
        }
        mutate {
          replace => {
            "metadata.event_type" => "NETWORK_HTTP"
          }
        }
      }
      mutate {
        merge => {
          "security_result.category_details" => "cat"
        }
        on_error => "field_not_present"
      }
      if [companyID] != "" {
        mutate {
          replace => {
            "companyId_label.key" => "companyID"
            "companyId_label.value.string_value" => "%{companyID}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "companyId_label"
          }
        }
      }
      if [gatewayName] != "" {
        mutate {
          replace => {
            "gatewayName_label.key" => "gatewayName"
            "gatewayName_label.value.string_value" => "%{gatewayName}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "gatewayName_label"
          }
        }
      }
      if[adDomain] != "" {
        mutate {
          replace => {
            "principal.administrative_domain" => "%{adDomain}"
          }
          on_error => "replace_failed"
        }
      }
      if [logType] != "" {
        mutate {
          replace =>{
            "logtype_additional.key" => "logType"
            "logtype_additional.value.string_value" => "%{logType}"
          }
          on_error => "logtype_replace_failed"
        }
        if ![logtype_replace_failed] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "logtype_additional"
            }
            on_error => "logtype_merge_failed"
          }
        }
      }
      if [userName] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{userName}"
          }
          on_error => "user_name_not_present"
        }
        mutate {
          replace => {
            "has_principal" => "true"
          }
          on_error => "replace_failed"
        }
      }
    }
  }
  #metadata

  if [eventtype] == "EVT_URL_BLOCKING" {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  else if [eventtype] == "EVT_URL_ACCESS_TRACKING" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [eventtype] == "EVT_APP_CONTROL_BLOCK" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [eventtype] == "EVT_PERFORMANCE" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UNCATEGORIZED"
      }
    }
  }
  else if [eventtype] in ["EVT_SYSEVENT_AU_SUCC", "EVT_SYSEVENT_AU_FAIL"] {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [eventtype] == "EVT_AUDITING" {
    mutate {
      replace => {
        "metadata.event_type" => "SYSTEM_AUDIT_LOG_UNCATEGORIZED"
      }
    }
  }
  else if [has_protocol] == "true" {
    mutate {
      replace => {
         "metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true"{
    mutate {
      replace => {
         "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
         "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  # UDM fields

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "network" => "event.idm.read_only_udm.network"
      "metadata" => "event.idm.read_only_udm.metadata"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [intermediary][hostname] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  # output

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
