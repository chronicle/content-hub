# Product: MANAGE_ENGINE_ENDPT_CNTRL
# Category: Application server logs
# Supported Format: SYSLOG + JSON
# Reference: N/A
# Last Updated: 2026-08-05
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "hostName" => ""
      "eventId" => ""
      "module" => ""
      "userName" => ""
      "type" => ""
      "priority" => ""
      "timeDuration" => ""
      "eventTimeISO" => ""
      "application" => ""
      "computerName" => ""
      "domainName" => ""
      "viewerIP" => ""
      "eventTime" => ""
      "userIP" => ""
      "startTime" => ""
      "endTIme" => ""
      "eventLogId" => ""
      "startTimeISO" => ""
      "remarks" => ""
      "endTImeISO" => ""
      "custom_event_description" => ""
      "start_time_parsed" => ""
      "end_time_parsed" => ""
      "config_group" => ""
      "config_type" => ""
      "config_description" => ""
      "patch_summary_action" => ""
      "patch_summary_status" => ""
      "patch_summary_type" => ""
      "patch_summary_description" => ""
      "setting_script_name" => ""
      "setting_template_source" => ""
      "setting_action" => ""
      "setting_status" => ""
      "setting_description" => ""
      "config_modification_type" => ""
      "config_modification_name" => ""
      "config_modification_action" => ""
      "config_modification_status" => ""
      "config_modification_description" => ""
      "som_config_type" => ""
      "som_config_name" => ""
      "som_config_action" => ""
      "som_config_status" => ""
      "som_config_description" => ""
      "pii_export_type" => ""
      "pii_export_data" => ""
      "pii_export_action" => ""
      "pii_export_status" => ""
      "pii_export_description" => ""
      "remote_control_action" => ""
      "remote_control_target" => ""
      "remote_control_user" => ""
      "remote_control_status" => ""
      "remote_control_description" => ""
      "event_id_label" => ""
      "malware_protection_action" => ""
      "malware_protection_scope" => ""
      "malware_protection_status" => ""
      "malware_protection_description" => ""
      "software_package_name" => ""
      "software_package_action" => ""
      "software_package_type" => ""
      "software_package_status" => ""
      "software_package_description" => ""
      "user_management_action" => ""
      "user_management_target" => ""
      "user_management_status" => ""
      "user_management_type" => ""
      "user_management_old_group" => ""
      "user_management_new_group" => ""
      "user_management_target_user" => ""
      "user_management_target_group" => ""
      "user_management_target_email" => ""
      "user_management_description" => ""
      "login_host_ip" => ""
      "login_user_name" => ""
      "login_role" => ""
      "login_status" => ""
      "login_description" => ""
      "security_result" => ""
      "computer_Name" => ""
      "ip_address" => ""
      "config_name" => ""
      "deployment_status" => ""
      "timestamp" => ""
      "json_data" => ""
      "description" => ""
      "has_principal_user" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "has_target_user" => "false"
      "has_target_mail" => "false"
    }
  }
  mutate {
    gsub => ["message", '\"\"', '\"']
  }
  grok {
    match => {
      "message" => [
        '%{DATA:timestamp},\\"%{GREEDYDATA:json_data}\\"'
      ]
    }
    overwrite => ["timestamp", "json_data"]
    on_error => "grok_parse_failed"
  }
  if ![grok_parse_failed] {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "json_parser_error"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "yyyy-MM-ddTHH:mm:ss.SSSSSSZ", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "invalid_collected_timestamp_format"
    }
  }

  if ![json_parser_error] and [eventId] != "" {
    if [eventTime] != "" {
      date {
        match => ["eventTime", "UNIX_MS"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "invalid_event_timestamp_format"
      }
    }
    if [application] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{application}"
        }
        on_error => "invalid_application"
      }
    }
    if [module] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{module}"
        }
        on_error => "invalid_product_event_type"
      }
    }
    if [eventLogId] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{eventLogId}"
        }
        on_error => "invalid_product_log_id"
      }
    }
    if [remarks] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{remarks}"
        }
        on_error => "invalid_description"
      }
    }

    if [priority] =~ "(?i)info" {
      mutate {
        replace => {
          "security_result.priority" => "LOW_PRIORITY"
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [priority] =~ "(?i)warning" {
      mutate {
        replace => {
          "security_result.priority" => "MEDIUM_PRIORITY"
          "security_result.severity" => "LOW"
        }
      }
    }
    else if [priority] =~ "(?i)error" {
      mutate {
        replace => {
          "security_result.priority" => "HIGH_PRIORITY"
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [priority] =~ "(?i)critical" {
      mutate {
        replace => {
          "security_result.priority" => "HIGH_PRIORITY"
          "security_result.severity" => "CRITICAL"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.priority" => "UNKNOWN_PRIORITY"
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }
    if [priority] != "" {
      mutate {
        replace => {
          "security_result.severity_details" => "%{priority}"
        }
        on_error => "invalid_priority"
      }
    }
    if [type] not in ["", "--"] {
      mutate {
        replace => {
          "custom_type.key" => "type"
          "custom_type.value.string_value" => "%{type}"
        }
        on_error => "invalid_type"
      }
      if ![invalid_type] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "custom_type"
          }
          on_error => "type_merge_error"
        }
      }
    }
    if [eventTimeISO] not in ["", "--"] {
      mutate {
        replace => {
          "custom_event_time_iso.key" => "event_time_iso"
          "custom_event_time_iso.value.string_value" => "%{eventTimeISO}"
        }
        on_error => "invalid_event_time_iso"
      }
      if ![invalid_event_time_iso] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "custom_event_time_iso"
          }
          on_error => "event_time_iso_merge_error"
        }
      }
    }

    if [startTimeISO] not in ["", "--"] {
      mutate {
        replace => {
          "custom_start_time_iso.key" => "start_time_iso"
          "custom_start_time_iso.value.string_value" => "%{startTimeISO}"
        }
        on_error => "invalid_start_time_iso"
      }
      if ![invalid_start_time_iso] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "custom_start_time_iso"
          }
          on_error => "start_time_iso_merge_error"
        }
      }
    }

    if [endTImeISO] not in ["", "--"] {
      mutate {
        replace => {
          "custom_end_time_iso.key" => "end_time_iso"
          "custom_end_time_iso.value.string_value" => "%{endTImeISO}"
        }
        on_error => "invalid_end_time_iso"
      }
      if ![invalid_end_time_iso] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "custom_end_time_iso"
          }
          on_error => "end_time_iso_merge_error"
        }
      }
    }


    if [eventId] != "" {
      mutate {
        replace => {
          "event_id_label.key" => "event_id"
          "event_id_label.value.string_value" => "%{eventId}"
        }
        on_error => "invalid_event_id"
      }
      if ![invalid_event_id] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "event_id_label"
          }
          on_error => "event_id_merge_error"
        }
      }
    }

    if [startTime] not in ["", "--"] {
      mutate {
        replace => {
          "custom_start_time.key" => "start_time"
          "custom_start_time.value.string_value" => "%{startTime}"
        }
        on_error => "invalid_start_time"
      }
      if ![invalid_start_time] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "custom_start_time"
          }
          on_error => "start_time_merge_error"
        }
      }
    }
    if [endTIme] not in ["", "--"] {
      mutate {
        replace => {
          "custom_end_time.key" => "end_time"
          "custom_end_time.value.string_value" => "%{endTIme}"
        }
        on_error => "invalid_end_time"
      }
      if ![invalid_end_time] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "custom_end_time"
          }
          on_error => "end_time_merge_error"
        }
      }
    }

    # map time duration
    if [timeDuration] not in ["", "--"] {
      mutate {
        replace => {
          "custom_time_duration.key" => "time_duration"
          "custom_time_duration.value.string_value" => "%{timeDuration}"
        }
        on_error => "invalid_time_duration"
      }
      if ![invalid_time_duration] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "custom_time_duration"
          }
          on_error => "time_duration_merge_error"
        }
      }
    }
    if [userName] not in ["", "--"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{userName}"
          "has_principal_user" => "true"
        }
        on_error => "invalid_user_name"
      }
    }
    if [userIP] not in ["", "--"] {
      grok {
        match => {
          "userIP" => [
            "%{IP:user_ip}"
          ]
        }
        overwrite => ["user_ip"]
        on_error => "user_ip_not_found"
      }
      if ![user_ip_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "userIP"
            "event.idm.read_only_udm.principal.asset.ip" => "userIP"
          }
          on_error => "invalid_user_ip"
        }
        if ![invalid_user_ip] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    if [computerName] not in ["", "--"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{computerName}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{computerName}"
          "has_target" => "true"
        }
        on_error => "invalid_computer_name"
      }
    }
    else if [hostName] not in ["", "--"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.hostname" => "%{hostName}"
          "event.idm.read_only_udm.target.hostname" => "%{hostName}"
          "has_target" => "true"
        }
        on_error => "invalid_host_name"
      }
    }
    if [domainName] not in ["", "--"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.domain.name" => "%{domainName}"
        }
        on_error => "invalid_domain_name"
      }
    }
    if [viewerIP] not in ["", "--"] {
      mutate {
        replace => {
          "viewer_ip_label.key" => "viewer_ip"
          "viewer_ip_label.value.string_value" => "%{viewerIP}"
        }
        on_error => "invalid_viewer_ip"
      }
      if ![invalid_viewer_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "viewer_ip_label"
          }
          on_error => "viewer_ip_merge_error"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "ManageEngine"
        "event.idm.read_only_udm.metadata.product_name" => "ManageEngine Endpoint Central"
      }
    }
    if [eventId] == "101" {
      # Parse configuration details from remarks using grok
      if [remarks] != "" {
        grok {
          match => {
            "remarks" => [
              "%{DATA:config_type} - \"%{DATA:config_name}\" is deployed %{WORD:deployment_status}",
              "%{DATA:config_type} - \"%{DATA:config_name}\" deployment %{WORD:deployment_status}",
              "%{DATA:config_type} - \"%{DATA:config_name}\" %{WORD:deployment_status}",
              "%{DATA:config_type} \"%{DATA:config_name}\" is deployed %{WORD:deployment_status}",
              "%{DATA:config_type} \"%{DATA:config_name}\" deployment %{WORD:deployment_status}",
              "%{DATA:config_type} \"%{DATA:config_name}\" %{WORD:deployment_status}"
            ]
          }
          overwrite => ["config_type", "config_name", "deployment_status"]
          on_error => "event_101_remarks_grok_error"
        }
      }
      # Map configuration type to additional fields
      if [config_type] != "" {
        mutate {
          replace => {
            "custom_config_type.key" => "configuration_type"
            "custom_config_type.value.string_value" => "%{config_type}"
          }
          on_error => "invalid_config_type"
        }
        if ![invalid_config_type] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_config_type"
            }
            on_error => "config_type_merge_error"
          }
        }
      }

      # Map configuration name to additional fields
      if [config_name] != "" {
        mutate {
          replace => {
            "custom_config_name.key" => "configuration_name"
            "custom_config_name.value.string_value" => "%{config_name}"
          }
          on_error => "invalid_config_name"
        }
        if ![invalid_config_name] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_config_name"
            }
            on_error => "config_name_merge_error"
          }
        }
      }

      # Map deployment status to additional fields
      if [deployment_status] != "" {
        mutate {
          replace => {
            "custom_deployment_status.key" => "deployment_status"
            "custom_deployment_status.value.string_value" => "%{deployment_status}"
          }
          on_error => "invalid_deployment_status"
        }
        if ![invalid_deployment_status] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_deployment_status"
            }
            on_error => "deployment_status_merge_error"
          }
        }
      }
    }
    else if [eventId] == "123" {
      # Parse patch summary details from remarks using grok
      if [remarks] != "" {
        grok {
          match => {
            "remarks" => [
              "%{DATA:patch_summary_type} %{DATA:patch_summary_action} is %{GREEDYDATA:patch_summary_status}",
              "%{DATA:patch_summary_type} %{DATA:patch_summary_action} %{GREEDYDATA:patch_summary_status}",
              "%{DATA:patch_summary_action} %{GREEDYDATA:patch_summary_status}",
              "%{GREEDYDATA:patch_summary_description}"
            ]
          }
          overwrite => ["patch_summary_action", "patch_summary_status", "patch_summary_type", "patch_summary_description"]
          on_error => "event_123_remarks_grok_error"
        }
      }

      # Map patch summary type to additional fields
      if [patch_summary_type] != "" {
        mutate {
          replace => {
            "custom_patch_summary_type.key" => "patch_summary_type"
            "custom_patch_summary_type.value.string_value" => "%{patch_summary_type}"
          }
          on_error => "invalid_patch_summary_type"
        }
        if ![invalid_patch_summary_type] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_patch_summary_type"
            }
            on_error => "patch_summary_type_merge_error"
          }
        }
      }

      # Map patch summary action to additional fields
      if [patch_summary_action] != "" {
        mutate {
          replace => {
            "custom_patch_summary_action.key" => "patch_summary_action"
            "custom_patch_summary_action.value.string_value" => "%{patch_summary_action}"
          }
          on_error => "invalid_patch_summary_action"
        }
        if ![invalid_patch_summary_action] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_patch_summary_action"
            }
            on_error => "patch_summary_action_merge_error"
          }
        }
      }

      # Map patch summary status to additional fields
      if [patch_summary_status] != "" {
        mutate {
          replace => {
            "custom_patch_summary_status.key" => "patch_summary_status"
            "custom_patch_summary_status.value.string_value" => "%{patch_summary_status}"
          }
          on_error => "invalid_patch_summary_status"
        }
        if ![invalid_patch_summary_status] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_patch_summary_status"
            }
            on_error => "patch_summary_status_merge_error"
          }
        }
      }

      # Map patch summary description to additional fields
      if [patch_summary_description] != "" {
        mutate {
          replace => {
            "custom_patch_summary_description.key" => "patch_summary_description"
            "custom_patch_summary_description.value.string_value" => "%{patch_summary_description}"
          }
          on_error => "invalid_patch_summary_description"
        }
        if ![invalid_patch_summary_description] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_patch_summary_description"
            }
            on_error => "patch_summary_description_merge_error"
          }
        }
      }
    }
    else if [eventId] == "134" {
      # Parse setting creation details from remarks using grok
      if [remarks] != "" {
        grok {
          match => {
            "remarks" => [
              "%{DATA:setting_script_name} from %{DATA:setting_template_source} has been %{DATA:setting_action} to %{DATA:setting_status}",
              "%{DATA:setting_script_name} from %{DATA:setting_template_source} %{DATA:setting_action} %{DATA:setting_status}",
              '\\"%{DATA:setting_script_name}\\" %{GREEDYDATA:setting_description}',
              "%{DATA:setting_script_name} %{DATA:setting_action} %{DATA:setting_status}",
              "%{GREEDYDATA:setting_description}"
            ]
          }
          overwrite => ["setting_script_name", "setting_template_source", "setting_action", "setting_status", "setting_description"]
          on_error => "event_134_remarks_grok_error"
        }
      }
      # Map setting script name to additional fields
      if [setting_script_name] != "" {
        mutate {
          replace => {
            "custom_setting_script_name.key" => "setting_script_name"
            "custom_setting_script_name.value.string_value" => "%{setting_script_name}"
          }
          on_error => "invalid_setting_script_name"
        }
        if ![invalid_setting_script_name] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_setting_script_name"
            }
            on_error => "setting_script_name_merge_error"
          }
        }
      }

      # Map setting template source to additional fields
      if [setting_template_source] != "" {
        mutate {
          replace => {
            "custom_setting_template_source.key" => "setting_template_source"
            "custom_setting_template_source.value.string_value" => "%{setting_template_source}"
          }
          on_error => "invalid_setting_template_source"
        }
        if ![invalid_setting_template_source] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_setting_template_source"
            }
            on_error => "setting_template_source_merge_error"
          }
        }
      }

      # Map setting action to additional fields
      if [setting_action] != "" {
        mutate {
          replace => {
            "custom_setting_action.key" => "setting_action"
            "custom_setting_action.value.string_value" => "%{setting_action}"
          }
          on_error => "invalid_setting_action"
        }
        if ![invalid_setting_action] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_setting_action"
            }
            on_error => "setting_action_merge_error"
          }
        }
      }

      # Map setting status to additional fields
      if [setting_status] != "" {
        mutate {
          replace => {
            "custom_setting_status.key" => "setting_status"
            "custom_setting_status.value.string_value" => "%{setting_status}"
          }
          on_error => "invalid_setting_status"
        }
        if ![invalid_setting_status] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_setting_status"
            }
            on_error => "setting_status_merge_error"
          }
        }
      }

      # Map setting description to additional fields
      if [setting_description] != "" {
        mutate {
          replace => {
            "custom_setting_description.key" => "setting_description"
            "custom_setting_description.value.string_value" => "%{setting_description}"
          }
          on_error => "invalid_setting_description"
        }
        if ![invalid_setting_description] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "custom_setting_description"
            }
            on_error => "setting_description_merge_error"
          }
        }
      }
    }
    else if [eventId] == "145" {
      # Parse configuration modification details from remarks using grok
      if [remarks] != "" {
        grok {
          match => {
            "remarks" => [
              "%{DATA:config_modification_type} - %{DATA:config_modification_name} %{DATA:config_modification_action} has been %{GREEDYDATA:config_modification_status}",
              "%{DATA:config_modification_type} - %{DATA:config_modification_name} %{DATA:config_modification_action} %{GREEDYDATA:config_modification_status}",
              "%{DATA:config_modification_name} %{DATA:config_modification_action} has been %{GREEDYDATA:config_modification_status}",
              "%{GREEDYDATA:config_modification_description}"
            ]
          }
          overwrite => ["config_modification_type", "config_modification_name", "config_modification_action", "config_modification_status", "config_modification_description"]
          on_error => "event_145_remarks_grok_error"
        }
      }

      # Map configuration modification type to additional fields
      if [config_modification_type] != "" {
        mutate {
          replace => {
            "custom_config_modification_type.key" => "configuration_modification_type"
            "custom_config_modification_type.value.string_value" => "%{config_modification_type}"
          }
          on_error => "invalid_config_modification_type"
        }
        if ![invalid_config_modification_type] {
