        on_error => "alert_remarks_error"
      }
      if ![alert_remarks_error] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{alertRemarks}"
          }
          on_error => "alert_remarks_description_error"
        }
      }
    }
    if [ip_address] != "" {
      grok {
        match => {
          "ip_address" => [
            "%{IP:ip_address}"
          ]
        }
        overwrite => ["ip_address"]
        on_error => "ip_address_error"
      }
      if ![ip_address_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "ip_address"
            "event.idm.read_only_udm.target.asset.ip" => "ip_address"
          }
          on_error => "target_ip_error"
        }
        if ![target_ip_error] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
    if [alertLevel] != "" {
      mutate {
        replace => {
          "security_result.severity_details" => "%{alertLevel}"
        }
        on_error => "severity_details_error"
      }
    }

    if [computerName] not in ["--", ""] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{computerName}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{computerName}"
          "has_target" => "true"
        }
        on_error => "computer_name_error"
      }
    }
    else if [computer_Name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{computer_Name}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{computer_Name}"
          "has_target" => "true"
        }
        on_error => "not_found_computer_name"
      }
    }

    if [operatingSystem] not in ["--", ""] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.platform_software.platform_version" => "%{operatingSystem}"
        }
      }

      if [operatingSystem] =~ "(?i)windows" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.platform_software.platform" => "WINDOWS"
          }
        }
      }
      else if [operatingSystem] =~ "(?i)(linux|ubuntu|centos|rhel|red\\s*hat|debian|fedora|suse|opensuse|amazon\\s*linux|oracle\\s*linux)" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.platform_software.platform" => "LINUX"
          }
        }
      }
      else if [operatingSystem] =~ "(?i)mac" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.platform_software.platform" => "MAC"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.platform_software.platform" => "UNKNOWN_PLATFORM"
          }
        }
      }
    }

    if [domainName] != "--" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.network_domain" => "%{domainName}"
        }
        on_error => "domain_name_error"
      }
    }
    mutate {
      gsub => [ "alertTimestamp", ",", "" ]
    }
    date {
      match => [ "alertTimestamp", "MMM d yyyy hh:mm A", "MMM dd yyyy hh:mm A" ]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      timezone => "Asia/Kolkata"
      on_error => "parsing_timestamp_failure"
    }
    if [module] != "" {
      mutate {
        replace => {
          "module_label.key" => "module"
          "module_label.value.string_value" => "%{module}"
        }
        on_error => "module_label_error"
      }
      if ![module_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "module_label"
          }
          on_error => "module_label_merge_error"
        }
      }
    }
    if [application] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{application}"
        }
        on_error => "application_error"
      }
    }

    if [alertLevel] =~ "(?i)INFORMATION"  {
      mutate {
        replace => {
          "security_result.priority" => "LOW_PRIORITY"
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [alertLevel] =~ "(?i)WARNING" {
      mutate {
        replace => {
          "security_result.priority" => "MEDIUM_PRIORITY"
          "security_result.severity" => "LOW"
        }
      }
    }
    else if [alertLevel] =~ "(?i)CRITICAL" {
      mutate {
        replace => {
          "security_result.priority" => "HIGH_PRIORITY"
          "security_result.severity" => "CRITICAL"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.priority" => "UNKNOWN_PRIORITY"
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "ManageEngine Endpoint Central - Alerts"
        "event.idm.read_only_udm.metadata.vendor_name" => "ManageEngine"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [eventId] == "134" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SETTING_CREATION"
        "event.idm.read_only_udm.target.resource.resource_type" => "SETTING"
      }
    }
  }
  else if [eventId] == "145" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SETTING_MODIFICATION"
        "event.idm.read_only_udm.target.resource.resource_type" => "SETTING"
      }
    }
  }
  else if [eventId] == "701" and [has_principal] == "true" and ([has_target] == "true" or [has_target_mail] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CREATION"
      }
    }
  }
  else if [eventId] == "701" and [remarks] =~ "accepted the invite" and [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [eventId] == "718" and [has_principal] == "true"  and [has_target_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  # Merge event into @output
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}