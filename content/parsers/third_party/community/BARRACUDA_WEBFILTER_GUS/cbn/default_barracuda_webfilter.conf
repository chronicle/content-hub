# Product: Barracuda Webfilter
# Category: Webfilter
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2024-11-14
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "src_ip" => ""
      "dst_ip" => ""
      "inter_ip" => ""
      "date_time" => ""
      "status" => ""
      "action" => ""
      "process_id" => ""
      "app" => ""
      "url" => ""
      "intermediary" => ""
      "sess_id" => ""
      "security_result" => ""
      "mime" => ""
      "action_normalized" => ""
      "has_principal" => "false"
      "has_target" => "false"
    }
  }
  grok {
    match => {
      "message" => [
         "<%{INT}>%{SYSLOGTIMESTAMP:date_time} %{IP:inter_ip} %{DATA:app}\\[%{INT:process_id}\\]: %{INT:sess_id} %{INT:severity} %{IP:src_ip} %{IP:dst_ip} %{DATA:mime} %{IP} %{DATA:url} %{INT} %{WORD} %{WORD:action} %{WORD:status} %{GREEDYDATA:msg}",
         "(?P<app>http_scan): %{INT:sess_id} %{INT:severity} %{IP:src_ip} %{IP:dst_ip} %{DATA:mime} %{IP} %{DATA:url} %{INT} %{WORD} %{WORD:action} %{WORD:status} %{GREEDYDATA:msg}",
         "<%{INT}>(%{SYSLOGTIMESTAMP:date_time}|%{TIMESTAMP_ISO8601:date_time}) %{INT} %{IP:inter_ip} %{DATA:app}\\[%{INT:process_id}\\]: %{INT:sess_id} %{INT:severity} %{IP:src_ip} %{IP:dst_ip} %{DATA:mime} %{IP} %{DATA:url} %{INT} %{WORD} %{WORD:action} %{WORD:status} %{GREEDYDATA:msg}"
         "<%{INT}>%{SYSLOGTIMESTAMP:date_time} %{IP:inter_ip} %{DATA:app}\\[%{INT:process_id}\\]: \\[%{IP}\\] %{GREEDYDATA:msg}"
      ]
    }
    overwrite => ["date_time", "inter_ip", "mime", "src_ip", "dst_ip", "status", "process_id", "action", "app", "sess_id", "url"]
    on_error => "message_grok_failure"
  }
  if [date_time] != "" {
    date {
      match => ["date_time", "yyyy-MM-dd HH:mm:ss", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
      rebase => true
      on_error => "date_time_failure"
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
      }
      on_error => "src_ip_failure"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [mime] not in ["","-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.mime_type" => "%{mime}"
      }
      on_error => "mime_failure"
    }
  }
  if [dst_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dst_ip"
        "event.idm.read_only_udm.target.asset.ip" => "dst_ip"
      }
      on_error => "dst_ip_failure"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }
  if [inter_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "inter_ip"
      }
      on_error => "inter_ip_failure"
    }
  }
  if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{process_id}"
      }
      on_error => "process_id_failure"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_failure"
    }
  }
  if [app] =~ "http" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTP"
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [sess_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{sess_id}"
      }
      on_error => "sess_id_failure"
    }
  }
  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.url" => "%{url}"
      }
      on_error => "url_failure"
    }
  }
  if [action] =~ "(?i)Allowed" or [action] =~ "(?i)Continue" {
    mutate {
      replace => {
        "action_normalized" => "ALLOW"
      }
    }
  } else if [action] =~ "(?i)Blocked" {
    mutate {
      replace => {
        "action_normalized" => "BLOCK"
      }
    }
  }
  if [status] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{status}"
      }
      on_error => "status_failure"
    }
  }
  if [action_normalized] != "" {
    mutate {
      merge => {
        "security_result.action" => "action_normalized"
      }
      on_error => "action_normalized_failure"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_failure"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
