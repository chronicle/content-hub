          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} \\[%{DATA:event_type_id}\\]\\[%{DATA:prod_event_type}\\]\\[%{WORD:severity}\\] %{GREEDYDATA}\\(%{DATA:target_application}\\): trans\\(%{INT:trans_id}\\)\\[%{DATA:trans_type}\\]\\[%{IP:target_Ip}\\] gtid\\(%{GREEDYDATA:gtid}\\): (?P<json_message>\\{.*\\})",
