      mutate {
        replace => {
          "map_field.value.string_value" => "%{value}"
        }
        on_error => "value_replace_error"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "map_field"
        }
        on_error => "addition_merge_failed"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [target_Ip] != "" and [principal_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        "event.idm.read_only_udm.network.direction" => "INBOUND"
        "event.idm.read_only_udm.network.application_protocol" => "HTTP"
      }
    }
  }
  else if [summary] =~ "(?i)logged out" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [summary] =~ "(?i)logged in" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "security_res_action" => "ALLOW"
      }
    }
  }
  else if [summary] =~ "(?i)failed to log in" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "security_res_action" => "BLOCK"
      }
    }
  }
  else if [has_target] == "true" and [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [prod_event_type] =~ "(?i)(cli)" and ([target_host] != "" or [target_Ip] != "") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [target_host] != "" or [target_Ip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [security_res_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_res_action"
      }
      on_error => "sec_action_action_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
