          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} \\[%{DATA}\\]\\[%{DATA}\\]\\[%{DATA:severity}\\] user\\(%{DATA:user_name}\\): \\[%{DATA:src_ip}\\]:%{GREEDYDATA:summary}",
