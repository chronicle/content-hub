# Product: EXTREME_SWITCH
# Category:Security
# Supported Format: SYSLOG
# Reference:https://documentation.extremenetworks.com/exos_31.3/GUID-5BD3EAB5-7D64-4615-B197-CE45947C13F1.shtml
# Last Updated:2025-09-01
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "network" => ""
      "security_result" => ""
      "extensions" => ""
      "timestamp" => ""
      "interface" => ""
      "resource" => ""
      "username" => ""
      "application" => ""
      "ip" => ""
      "has_network_dhcp" => "false"
      "has_principal" =>"false"
      "eventtype" => ""
      "has_target" => "false"
      "log_data" => ""
      "user_login" => "false"
      "description" => ""
      "account_type" => ""
      "user_logout" => "false"
      "sec_description" => ""
      "log_type" => ""
      "tz" => ""
      "msgid" => ""
      "severity" => ""
      "class" => ""
      "swname" => ""
      "arg0_desc" => ""
      "arg0_value" => ""
      "arg1_desc" => ""
      "arg1_value" => ""
      "kv_log_data" => ""
      "BOMEvent" => ""
      "Status" => ""
      "Info" => ""
      "attr" => ""
      "seqnum" => ""
      "protocol" => ""
      "kv_data" => ""
      "ver" => ""
      "rcPortVLacpAdminEnable" => ""
      "rcSyslogHostMapFatalSeverity" => ""
      "rcSyslogHostRowStatus" => ""
      "rcSyslogHostMapInfoSeverity" => ""
      "rcSyslogHostUdpPort" => ""
      "port" => ""
      "rcSyslogHostSeverity" => ""
      "rcSyslogHostAddress" => ""
      "rcSyslogHostEnable" => ""
      "rcSyslogHostMapErrorSeverity" => ""
      "rcSyslogHostAddressType" => ""
      "rcSyslogHostMapWarningSeverity" => ""
      "rcSyslogHostFacility" => ""
      "session_id" => ""
      "intermediary_ip" => ""
      "intermediary" => ""
      "VrId" => ""
      "Type" => ""
      "Cause" => ""
      "SlppSrcMacAddress" => ""
      "SlppRxVlan" => ""
      "SlppIncomingVlanId" => ""
      "host" => ""
      "vlan_name" => ""
      "Port" => ""
      "bytes_received" => ""
      "src_ip" => ""
      "client_mac" => ""
      "dst_ip" => ""
      "slot" => ""
      "packet_type" => ""
      "gateway_ip" => ""
      "observer" => ""
      "summary" => ""
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "EXTREME_SWITCH"
      "metadata.vendor_name" => "EXTREME_SWITCH"
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}> %{MONTH}\\s+%{MONTHDAY} %{TIME} %{DATA:resource}: %{GREEDYDATA:log_data}\\\n",
        "<%{INT}>%{MONTH}\\s+%{MONTHDAY} %{TIME} %{DATA:resource} %{DATA}: %{GREEDYDATA:log_data}\\\n",
        "<%{INT}>%{DATA}\\s+\\[%{DATA:timestamp}]\\s+%{DATA}\\s+%{DATA}\\s+%{DATA:application}\\s+%{DATA:protocol}\\s+%{DATA:severity}\\s+%{GREEDYDATA:description}",
        "<%{INT}>%{MONTH}\\s+%{MONTHDAY} %{TIME} %{DATA:host} %{DATA:application}: %{GREEDYDATA:log_data}",
      ]
    }
    overwrite => ["host","log_data","resource","timestamp","application","severity","protocol","description"]
    on_error => "pattern_not_matched"
  }
  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "host_not_found"
    }
  }
  if [protocol] != "" {
    mutate {
      replace => {
        "protocol_label.key" => "Protocol"
        "protocol_label.value.string_value" => "%{protocol}"
      }
      on_error => "protocol_label_error"
    }
    if ![protocol_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "protocol_label"
        }
        on_error => "protocol_label_merge_error"
      }
    }
  }
  if [description] != "" {
    grok {
      match => {
        "description" => ["%{DATA} %{IP:ip},\\s+session_id\\s+=\\s+%{INT:session_id}%{GREEDYDATA}",
                        "%{DATA} %{IP:ip}%{GREEDYDATA}",
                        "%{INT} %{GREEDYDATA:kv_data}",
                        "%{DATA}\\(%{GREEDYDATA:kv_data}\\)%{GREEDYDATA}"
        ]
      }
      overwrite => ["ip","kv_data","session_id"]
      on_error => "no_match"
    }
  }
  if [session_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{session_id}"
      }
      on_error => "session_id_not_found"
    }
  }
  if [kv_data] != "" {
    mutate {
      gsub => [
        "kv_data", "\\s*=\\s*", "=",
        "kv_data", "VrIpAddr", "intermediary_ip",
        "kv_data", "IP=", "ip=",
        "kv_data", "Addr=", "ip=",
        "kv_data", "SlppRxPort = ", "port=",
        "kv_data", "rcPortVLacpAdminEnable.193", "rcPortVLacpAdminEnable",
        "kv_data", "rcSyslogHostMapFatalSeverity.2", "rcSyslogHostMapFatalSeverity",
        "kv_data", "rcSyslogHostRowStatus.2", "rcSyslogHostRowStatus",
        "kv_data", "rcSyslogHostMapInfoSeverity.2", "rcSyslogHostMapInfoSeverity",
        "kv_data", "rcSyslogHostUdpPort.2", "port",
        "kv_data", "rcSyslogHostSeverity.2", "rcSyslogHostSeverity",
        "kv_data", "rcSyslogHostAddress.2", "rcSyslogHostAddress",
        "kv_data", "rcSyslogHostEnable.2", "rcSyslogHostEnable",
        "kv_data", "rcSyslogHostMapErrorSeverity.2", "rcSyslogHostMapErrorSeverity",
        "kv_data", "rcSyslogHostAddressType.2", "rcSyslogHostAddressType",
        "kv_data", "rcSyslogHostMapWarningSeverity.2", "rcSyslogHostMapWarningSeverity",
        "kv_data", "rcSyslogHostFacility.2", "rcSyslogHostFacility",
        "kv_data", "Port/Vlan=", "port=",
        "kv_data", ",\\s*", "#",
        "kv_data", "\\s+", "#"
      ]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "not_kv"
    }
  }

  if [log_data] != "" {
    grok {
      match => {
        "log_data" => [
          "Login passed for user %{GREEDYDATA:username} through %{GREEDYDATA:application} \\(%{IP:ip}\\)",
          "Login failed through %{GREEDYDATA:application} - %{GREEDYDATA:sec_description} \\(%{IP:ip}\\)",
          "Msg from Master : %{GREEDYDATA:Info} for user %{GREEDYDATA:username} \\(%{IP:ip}\\)",
          "%{GREEDYDATA:account_type} account \\(%{GREEDYDATA:username}\\) %{GREEDYDATA:eventtype} from %{GREEDYDATA:application} \\(%{IP:ip}\\)",
          "\\[log@%{INT} value=\\\"%{GREEDYDATA:log_type}\\\"\\]\\[timestamp@%{INT} value=\\\"%{GREEDYDATA:timestamp}\\\"\\]\\[msgid@%{INT} value=\\\"%{GREEDYDATA:msgid}\\\"\\]\\[seqnum@%{INT} value=\\\"%{GREEDYDATA:seqnum}\\\"\\]\\[attr@%{INT} value=\\\"%{GREEDYDATA:attr}\\\"\\]\\[severity@%{INT} value=\\\"%{GREEDYDATA:severity}\\\"\\]\\[swname@%{INT} value=\\\"%{GREEDYDATA:swname}\\\"\\]\\[arg0@%{INT} value=\\\"%{GREEDYDATA}\\\"\\] BOMLogin information: %{GREEDYDATA:Info}. IP Addr: %{IP:ip}",
          "\\[log@%{INT} value=\\\"%{GREEDYDATA:log_type}\\\"\\]\\[timestamp@%{INT} value=\\\"%{GREEDYDATA:timestamp}\\\"\\]\\[msgid@%{INT} value=\\\"%{GREEDYDATA:msgid}\\\"\\]\\[seqnum@%{INT} value=\\\"%{GREEDYDATA:seqnum}\\\"\\]\\[attr@%{INT} value=\\\"%{GREEDYDATA:attr}\\\"\\]\\[severity@%{INT} value=\\\"%{GREEDYDATA:severity}\\\"\\]\\[swname@%{INT} value=\\\"%{GREEDYDATA:swname}\\\"\\]\\[arg0@%{INT} value=\\\"%{GREEDYDATA}\\\"\\] BOMSecurity violation: %{GREEDYDATA:Info}. IP Addr: %{IP:ip}",
          "\\[log@%{INT} value=\\\"%{GREEDYDATA:log_type}\\\"\\]\\[timestamp@%{INT} value=\\\"%{GREEDYDATA:timestamp}\\\"\\]\\[tz@%{INT} value=\\\"%{GREEDYDATA:tz}\\\"\\]\\[msgid@%{INT} value=\\\"%{GREEDYDATA:msgid}\\\"\\]\\[severity@%{INT} value=\\\"%{GREEDYDATA:severity}\\\"\\]\\[class@%{INT} value=\\\"%{GREEDYDATA:class}\\\"\\]\\[user@%{INT} value=\\\"%{GREEDYDATA:username}\\\"\\]\\[role@%{INT} value=\\\"%{GREEDYDATA:account_type}\\\"\\]\\[ip@%{INT} value=\\\"%{GREEDYDATA:ip}\\\"\\]\\[interface@%{INT} value=\\\"%{GREEDYDATA:interface}\\\"\\]\\[application@%{INT} value=\\\"%{GREEDYDATA:application}\\\"\\]\\[swname@%{INT} value=\\\"%{GREEDYDATA:swname}\\\"\\]\\[arg0@%{INT} value=\\\"%{GREEDYDATA:arg0_value}\\\" desc=\\\"%{GREEDYDATA:arg0_desc}\\\"\\]\\[arg1@%{INT} value=\\\"%{GREEDYDATA:arg1_value}\\\" desc=\\\"%{GREEDYDATA:arg1_desc}\\\"\\] %{GREEDYDATA:kv_log_data}.",
          "\\[log@%{INT} value=\\\"%{GREEDYDATA:log_type}\\\"\\]\\[timestamp@%{INT} value=\\\"%{GREEDYDATA:timestamp}\\\"\\]\\[msgid@%{INT} value=\\\"%{GREEDYDATA:msgid}\\\"\\]\\[seqnum@%{INT} value=\\\"%{GREEDYDATA:seqnum}\\\"\\]\\[attr@%{INT} value=\\\"%{GREEDYDATA:attr}\\\"\\]\\[severity@%{INT} value=\\\"%{GREEDYDATA:severity}\\\"\\]\\[swname@%{INT} value=\\\"%{GREEDYDATA:swname}\\\"\\]\\[arg0@%{INT} value=\\\"%{GREEDYDATA}\\\"\\] %{GREEDYDATA:description}",
          "^(?P<description>Slot-%{INT:slot}: Received %{INT:bytes_received} bytes %{NOTSPACE:packet_type} packet on VLAN %{WORD:vlan_name}, port %{NOTSPACE:Port}, from %{IP:src_ip} sent to %{IP:dst_ip} for client with MAC address %{MAC:client_mac}\.)$",
          "^(?P<description>Slot-%{INT:slot}: Cannot forward BOOTP/DHCP packet received on VLAN %{WORD:vlan_name} as %{GREEDYDATA:summary}\.)$",
          "^(?P<description>Slot-%{INT:slot}: BOOTP/DHCP request received on VLAN %{WORD:vlan_name} from Client with MAC %{MAC:client_mac} will be forwarded to Server %{IP:dst_ip} with %{IP:gateway_ip} as the gateway address\.)$",
          "\\[log@%{INT} value=\\\"%{GREEDYDATA:log_type}\\\"\\]\\[timestamp@%{INT} value=\\\"%{GREEDYDATA:timestamp}\\\"\\]\\[msgid@%{INT} value=\\\"%{GREEDYDATA:msgid}\\\"\\]\\[seqnum@%{INT} value=\\\"%{GREEDYDATA:seqnum}\\\"\\]\\[attr@%{INT} value=\\\"%{GREEDYDATA:attr}\\\"\\]\\[severity@%{INT} value=\\\"%{GREEDYDATA:severity}\\\"\\]\\[swname@%{INT} value=\\\"%{GREEDYDATA:swname}\\\"\\] %{GREEDYDATA:description}.",
          "%{GREEDYDATA:description}"
        ]
      }
      overwrite => ["Port","application","username","ip","description","eventtype","account_type","sec_description","log_type","timestamp","tz","msgid","severity","class","interface","swname","arg0_desc","arg0_value","arg1_desc","arg1_value","kv_log_data","attr","Info","seqnum", "slot", "vlan_name","client_mac","dst_ip","packet_type", "bytes_received","src_ip", "gateway_ip", "summary"]
      on_error => "log_data_pattern_not_matched"
    }
  }
  if [summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{summary}"
      }
      on_error => "summary_not_found"
    }
  }
  if [gateway_ip] != "" {
    mutate {
      replace => {
        "network.dhcp.giaddr" => "%{gateway_ip}"
        "has_network_dhcp" => "true"
      }
      on_error => "gateway_ip_not_found"
    }
  }

  if [vlan_name] != "" {
    mutate {
      replace => {
        "vlan_name_label.key" => "vlan_name"
        "vlan_name_label.value.string_value" => "%{vlan_name}"
      }
      on_error => "vlan_name_label_error"
    }
    if ![vlan_name_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vlan_name_label"
        }
        on_error => "vlan_name_label_merge_error"
      }
    }
  }

  if [Port] != "" {
    mutate {
      replace => {
        "port_label.key" => "Port"
        "port_label.value.string_value" => "%{Port}"
      }
      on_error => "port_label_error"
    }
    if ![port_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "port_label"
        }
        on_error => "port_label_merge_error"
      }
    }

  }

  if [bytes_received] != "" {
    mutate {
      rename => {
        "bytes_received" => "network.received_bytes"
      }
    }
    mutate {
      convert => {
        "network.received_bytes" => "uinteger"
      }
      on_error => "bytes_conversion_error"
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "principal_ip_merge_error"
    }
    if ![principal_ip_merge_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [client_mac] != "" {
    mutate {
      merge => {
        "principal.mac" => "client_mac"
        "principal.asset.mac" => "client_mac"
      }
      on_error => "principal_mac_merge_error"
    }
    if ![principal_mac_merge_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    mutate {
      replace => {
        "network.dhcp.chaddr" => "%{client_mac}"
        "has_network_dhcp" => "true"
      }
      on_error => "network_dhcp_chaddr_replace_error"
    }
  }

  if [dst_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "dst_ip"
        "target.asset.ip" => "dst_ip"
      }
      on_error => "target_ip_merge_error"
    }
    if ![target_ip_merge_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [slot] != "" {
    mutate {
      replace => {
        "observer_slot.key" => "observer_slot"
        "observer_slot.value.string_value" => "%{slot}"
      }
      on_error => "no_slot"
    }
    if ![no_slot] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "observer_slot"
        }
        on_error => "no_slot_label"
      }
    }
  }

  if [packet_type] != "" {
    mutate {
      replace => {
        "packet_type_detail.key" => "packet_type_detail"
        "packet_type_detail.value.string_value" => "%{packet_type}"
      }
      on_error => "no_packet_type"
    }
    if ![no_packet_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "packet_type_detail"
        }
        on_error => "no_packet_type_label"
      }
    }
  }

  if [kv_log_data] != "" {
    mutate {
      gsub => ["kv_log_data","IP Addr:","ip:"]
    }
    kv {
      source => "kv_log_data"
      field_split => ","
      value_split => ":"
      on_error => "no_kv_log_data"
    }
  }

  if [SlppSrcMacAddress] != "" {
    grok {
      match => {
        "SlppSrcMacAddress" => "%{MAC:SlppSrcMacAddress}"
      }
      overwrite => ["SlppSrcMacAddress"]
      on_error => "invalid_mac"
    }
    if ![invalid_mac] {
      mutate {
        merge => {
          "principal.mac" => "SlppSrcMacAddress"
        }
        replace => {
          "has_principal" => "true"
        }
        on_error => "no_mac_found"
      }
    }
  }

  if [VrId] != "" {
    mutate {
      replace => {
        "vrid.key" => "VrId"
        "vrid.value.string_value" => "%{VrId}"
      }
      on_error => "no_vrid"
    }
    if ![no_vrid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vrid"
        }
        on_error => "invalid_vrid"
      }
    }
  }
  if [SlppRxVlan] != "" {
    mutate {
      replace => {
        "vlan.key" => "SlppRxVlan"
        "vlan.value.string_value" => "%{SlppRxVlan}"
      }
      on_error => "no_vlan"
    }
    if ![no_vlan] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vlan"
        }
        on_error => "invalid_vlan"
      }
    }
  }
  if [SlppIncomingVlanId] != "" {
    mutate {
      replace => {
        "vlanId.key" => "SlppIncomingVlanId"
        "vlanId.value.string_value" => "%{SlppIncomingVlanId}"
      }
      on_error => "no_vlanId"
    }
    if ![no_vlanId] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vlanId"
        }
        on_error => "invalid_vlanId"
      }
    }
  }
  if [Type] != "" {
    mutate {
      replace => {
        "type.key" => "Type"
        "type.value.string_value" => "%{Type}"
      }
      on_error => "no_type"
    }
    if ![no_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type"
        }
        on_error => "invalid_type"
      }
    }
  }
  if [Cause] != "" {
    mutate {
      replace => {
        "cause.key" => "Cause"
        "cause.value.string_value" => "%{Cause}"
      }
      on_error => "no_cause"
    }
    if ![no_cause] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cause"
        }
        on_error => "invalid_cause"
      }
    }
  }

  if [intermediary_ip] != "" {
    grok {
      match => {
        "intermediary_ip" => "%{IP:intermediary_ip}"
      }
      overwrite => ["intermediary_ip"]
      on_error => "invalid_ip"
    }
    if ![invalid_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "intermediary_ip"
        }
        on_error => "intermediary_ip_not_found"
      }
    }
  }

  if [ver] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{ver}"
      }
      on_error => "version_not_found"
    }
  }
  if [rcPortVLacpAdminEnable] != "" {
    mutate {
      replace => {
        "admin_enable.key" => "rcPortVLacpAdminEnable"
        "admin_enable.value" => "%{rcPortVLacpAdminEnable}"
      }
      on_error => "admin_enable_label_error"
    }
    if ![admin_enable_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "admin_enable"
        }
        on_error => "admin_enable_label_merge_error"
      }
    }
  }
  if [rcSyslogHostMapFatalSeverity] != "" {
    mutate {
      replace => {
        "severity_label.key" => "rcSyslogHostMapFatalSeverity"
        "severity_label.value" => "%{rcSyslogHostMapFatalSeverity}"
      }
      on_error => "severity_label_error"
    }
    if ![severity_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "severity_label"
        }
        on_error => "severity_label_merge_error"
      }
    }
  }
  if [rcSyslogHostMapWarningSeverity] != "" {
    mutate {
      replace => {
        "warning_severity.key" => "rcSyslogHostMapWarningSeverity"
        "warning_severity.value" => "%{rcSyslogHostMapWarningSeverity}"
      }
      on_error => "warning_severity_error"
    }
    if ![warning_severity_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "warning_severity"
        }
        on_error => "warning_severity_merge_error"
      }
    }
  }
  if [rcSyslogHostRowStatus] != "" {
    mutate {
      replace => {
        "row_status_label.key" => "rcSyslogHostRowStatus"
        "row_status_label.value" => "%{rcSyslogHostRowStatus}"
      }
      on_error => "row_status_label_error"
    }
    if ![row_status_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "row_status_label"
        }
        on_error => "row_status_label_merge_error"
      }
    }
  }
  if [rcSyslogHostFacility] != "" {
    mutate {
      replace => {
        "host_facility.key" => "rcSyslogHostFacility"
        "host_facility.value" => "%{rcSyslogHostFacility}"
      }
      on_error => "host_facility_error"
    }
    if ![host_facility_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "host_facility"
        }
        on_error => "host_facility_merge_error"
      }
    }
  }
  if [rcSyslogHostAddressType] != "" {
    mutate {
      replace => {
        "address_type.key" => "rcSyslogHostAddressType"
        "address_type.value" => "%{rcSyslogHostAddressType}"
      }
      on_error => "address_type_error"
    }
    if ![address_type_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "address_type"
        }
        on_error => "address_type_merge_error"
      }
    }
  }
  if [rcSyslogHostMapErrorSeverity] != "" {
    mutate {
      replace => {
        "map_severity.key" => "rcSyslogHostMapErrorSeverity"
        "map_severity.value" => "%{rcSyslogHostMapErrorSeverity}"
      }
      on_error => "map_severity_error"
    }
    if ![map_severity_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "map_severity"
        }
        on_error => "map_severity_merge_error"
      }
    }
  }
  if [rcSyslogHostMapInfoSeverity] != "" {
    mutate {
      replace => {
        "info_severity.key" => "rcSyslogHostMapInfoSeverity"
        "info_severity.value" => "%{rcSyslogHostMapInfoSeverity}"
      }
      on_error => "info_severity_error"
    }
    if ![info_severity_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "info_severity"
        }
        on_error => "info_severity_merge_error"
      }
    }
  }
  if [rcSyslogHostSeverity] != "" {
    mutate {
      replace => {
        "host_severity.key" => "rcSyslogHostSeverity"
        "host_severity.value" => "%{rcSyslogHostSeverity}"
      }
      on_error => "host_severity_error"
    }
    if ![host_severity_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "host_severity"
        }
        on_error => "host_severity_merge_error"
      }
    }
  }
  if [rcSyslogHostEnable] != "" {
    mutate {
      replace => {
        "host_enable.key" => "rcSyslogHostEnable"
        "host_enable.value" => "%{rcSyslogHostEnable}"
      }
      on_error => "host_enable_error"
    }
    if ![host_enable_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "host_enable"
        }
        on_error => "host_enable_merge_error"
      }
    }
  }
  if [port] != "" {
    mutate {
      replace => {
        "principal.port" => "%{port}"
      }
      on_error => "port_not_found"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "conversion_error"
    }
  }
  if [rcSyslogHostAddress] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{rcSyslogHostAddress}"
        "has_principal" => "true"
      }
      on_error => "hostname_not_found"
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "yyyy-mm-ddTHH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "invalid_timestamp"
    }
  }

  if [log_data] =~ "Login passed" {
    mutate {
      replace => {
       "security_result.summary" => "Login passed"
       "user_login" => "true"
      }
      on_error => "no_summary"
    }
  }
  else if [log_data] =~ "Login failed" {
    mutate {
      replace => {
        "security_result.summary" => "Login failed"
        "user_login" => "true"
      }
      on_error => "no_summary"
    }
  }
  else if [log_data] =~ "Msg from Master" {
    mutate {
      replace => {
        "metadata.description" => "Msg from Master"
        "user_login" => "true"
      }
      on_error => "no_description"
    }
  }

  if [Info] == "Did password authentication" {
    mutate {
      replace => {
        "user_login" => "true"
        "mechanism" => "USERNAME_PASSWORD"
      }
      merge => {
        "extensions.auth.mechanism" => "mechanism"
      }
      on_error => "no_description"
    }
  }

  else if [Info] =~ "Login failure attempt" or [Info] =~ "Login successful" {
    grok {
      match => {
        "Info" => [
          "Login failure attempt via %{GREEDYDATA:application}",
          "Login successful via %{GREEDYDATA:application}"
        ]
      }
      on_error => "invalid_info"
      overwrite => ["application"]
    }
    if ![invalid_info] {
      mutate {
        replace => {
          "user_login" => "true"
        }
      }
    }
  }
  else if [Info] =~ "database commit transaction" {
    mutate {
      replace => {
        "user_login" => "true"
      }
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  if [BOMEvent] != "" {
    mutate {
      replace => {
        "eventtype" => "%{BOMEvent}"
      }
      on_error => "no_bom_event"
    }
  }

  if [Info] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{Info}"
      }
      on_error => "no_info"
    }
  }

  if [sec_description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{sec_description}"
      }
      on_error => "no_description"
    }
  }

  if [eventtype] == "logout" {
    mutate {
      replace => {
        "user_logout" => "true"
      }
    }
  }
  else if [eventtype] == "login" {
    mutate {
      replace => {
        "user_login" => "true"
      }
    }
  }

  if [msgid] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{msgid}"
      }
      on_error => "no_msgid"
    }
  }

  if [severity] != "" {
    mutate {
      uppercase => ["severity"]
    }
  }

  if [severity] in ["CRITICAL","ERROR","HIGH","INFORMATIONAL","LOW","MEDIUM"] {
    mutate {
      replace => {
        "security_result.severity" => "%{severity}"
      }
      on_error => "invalid_severity"
    }
  }

  else if [severity] == "INFO" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }

  else if [severity] == "WARNING" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }

  if [attr] != "" {
    grok {
      match => {
        "attr" => "WWN %{GREEDYDATA:wwn}"
      }
      on_error => "no_attr"
      overwrite => ["wwn"]
    }

    if [wwn] != "" {
      mutate {
        replace => {
          "wwn_label.key" => "wwn"
          "wwn_label.value.string_value" => "%{wwn}"
        }
        on_error => "no_wwn"
      }
      if ![no_wwn] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "wwn_label"
          }
          on_error => "no_wwn_label"
        }
      }
    }
  }

  if [tz] != "" {
    mutate {
      replace => {
        "tz_label.key" => "tz"
        "tz_label.value.string_value" => "%{tz}"
      }
      on_error => "no_tz"
    }
    if ![no_tz] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tz_label"
        }
        on_error => "no_tz_label"
      }
    }
  }

  if [swname] != "" {
    mutate {
      replace => {
        "swname_label.key" => "swname"
        "swname_label.value.string_value" => "%{swname}"
      }
      on_error => "no_swname"
    }
    if ![no_swname] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "swname_label"
        }
        on_error => "no_swname_label"
      }
    }
  }

  if [interface] != "" {
    mutate {
      replace => {
        "interface_label.key" => "interface"
        "interface_label.value.string_value" => "%{interface}"
      }
      on_error => "no_interface"
    }
    if ![no_interface] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "interface_label"
        }
        on_error => "no_interface_label"
      }
    }
  }

  if [log_type] != "" {
    mutate {
      replace => {
        "log_label.key" => "log"
        "log_label.value.string_value" => "%{log_type}"
      }
      on_error => "no_log_type"
    }
    if ![no_log_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "log_label"
        }
        on_error => "no_log_label"
      }
    }
  }

  if [Status] != "" {
    mutate {
      replace => {
        "status_label.key" => "Status"
        "status_label.value.string_value" => "%{Status}"
      }
      on_error => "no_status"
    }
    if ![no_status] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "status_label"
        }
        on_error => "no_status_label"
      }
    }
  }

  if [class] != "" {
    mutate {
      replace => {
        "class_label.key" => "class"
        "class_label.value.string_value" => "%{class}"
      }
      on_error => "no_class"
    }
    if ![no_class] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "class_label"
        }
        on_error => "no_class_label"
      }
    }
  }

  if [seqnum] != "" {
    mutate {
      replace => {
        "seqnum_label.key" => "seqnum"
        "seqnum_label.value.string_value" => "%{seqnum}"
      }
      on_error => "no_seqnum"
    }
    if ![no_seqnum] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "seqnum_label"
        }
        on_error => "no_seqnum_label"
      }
    }
  }

  if [username] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{username}"
        "has_target" => "true"
      }
      on_error => "no_username"
    }
  }
  if [account_type] not in ["","NONE"]
  {
    if [account_type] in ["Administrative","admin"] {
      mutate {
        replace => {
          "target.user.user_role" => "ADMINISTRATOR"
        }
        on_error => "no_account_type"
      }
    }
    else {
      mutate {
        replace => {
          "roles.name" => "%{account_type}"
        }
        on_error => "invalid_role"
      }
      if [roles]!= "" {
        mutate {
          merge => {
            "target.user.attribute.roles" => "roles"
          }
          on_error => "invalid_attribute"
        }
      }
    }
  }

  if [ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "ip"
      }
      on_error => "no_ip"
    }
    if ![no_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [resource] != "" {
    mutate {
      replace => {
        "principal.resource.name" => "%{resource}"
      }
      on_error => "no_resource"
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "target.application" => "%{application}"
        "has_target" => "true"
      }
      on_error => "invalid_application"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" and [user_login] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [user_logout] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGOUT"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [has_network_dhcp] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_DHCP"
        "network.application_protocol" => "DHCP"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [observer] != "" {
    mutate {
      rename => {
        "observer" => "event.idm.read_only_udm.observer"
      }
    }
  }

  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
