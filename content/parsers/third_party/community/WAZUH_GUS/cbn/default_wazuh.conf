  else if [rule_id] in ["18107", "18260"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" =>  "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "PASSWORD"
        "event.idm.read_only_udm.target.user.windows_sid" => "%{data.security_id}"
        "event.idm.read_only_udm.target.user.user_display_name" => "%{data.account_name}"
        "event.idm.read_only_udm.target.administrative_domain" => "%{data.account_domain}"
        "event.idm.read_only_udm.target.resource.name" => "%{data.system_name}"
        "decoder_parent" => "%{decoder.parent}"
        "securityResult_action" => "ALLOW"
        "_mechanism" => "REMOTE"
      }
    }

    mutate {
      merge => {
        "security_result.action" => "securityResult_action"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
      }
    }
    if [command] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{command}"
          "location" => ""
          "has_file_data" => "true"
        }
      }
    }
  }
  else if [rule_id] in ["204", "18154", "18180"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.target.application" => "%{decoder.name}"
        "source_ip_address" => ""
        "srcip" => ""
      }
    }
  }
  else if [rule_id] == "31151" {
    if [agent_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "agent_ip"
          "event.idm.read_only_udm.target.asset.ip" => "agent_ip"
        }
        on_error => "no_agent_ip3"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    mutate {
      replace => {
        "url" => "%{data.url}"
        "event.idm.read_only_udm.target.application" => "%{decoder.name}"
        "event.idm.read_only_udm.principal.hostname" => "%{manager.name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{manager.name}"
        "agent_ip" => ""
        "manager_name" => ""
        "source_ip_address" => ""
        "srcip" => ""
        "has_principal_machine" => "true"
      }
    }
    mutate {
      rename => {
        "url" => "about.url"
      }
    }
  }
  else if [rule_id] in ["1002", "80730", "80705","63110"] {
    if [agent_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "agent_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "agent_ip"
        }
        on_error => "no_agent_ip4"
      }
      if ![no_agent_ip4] {
        mutate {
          replace => {
            "has_principal_machine" => "true"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }
  # End event type

  # Principal
  if [source_ip_address] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "source_ip_address"
        "event.idm.read_only_udm.principal.asset.ip" => "source_ip_address"
      }
      on_error => "no_source_ip_address"
    }
    if ![no_source_ip_address] {
      mutate {
        replace => {
          "has_principal_machine" => "true"
        }
      }
    }
  }
  else if [srcip] not in ["", "-"] {
    grok {
      match => {
        "srcip" => "%{IP:srcip}"
      }
      overwrite => ["srcip"]
      on_error => "no_srcip"
    }
    if ![no_srcip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "srcip"
          "event.idm.read_only_udm.principal.asset.ip" => "srcip"
        }
        on_error => "no_srcip2"
      }
      if ![no_srcip2] {
        mutate {
          replace => {
            "has_principal_machine" => "true"
          }
        }
      }
    }
  }

  # Check srcuser and dstuser fields
  if ["data.srcuser"] != "" {
    mutate {
      replace => {
        "source_user" => "%{data.srcuser}"
      }
    }
  }

  if ["data.dstuser"] != "" {
    mutate {
      replace => {
        "destination_user" => "%{data.dstuser}"
      }
    }
  }

  if [source_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{source_user}"
        "has_user" => "true"
      }
    }
  }

  if [destination_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{destination_user}"
        "has_user" => "true"
      }
    }
  }
  if [location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{location}"
        "has_file_data" => "true"
      }
    }
  }
  if [command] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{command}"
      }
      on_error => "no_command"
    }
  }
  if [manager_name] != "" {
    mutate {
      rename => {
        "manager_name" => "about.user.userid"
      }
    }
  }
  if [decoder_name] != "" {
    mutate {
      rename => {
        "decoder_name" => "about.resource.name"
      }
    }
  }
  if [rule_id] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{rule_id}"
      }
