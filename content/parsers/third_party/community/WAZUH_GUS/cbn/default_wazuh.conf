  if [r_cat_name] != "" {
    # Extract data from local log message.
    grok {
      match => {
        "local_msg" => [
          "%{TIMESTAMP_ISO8601:datetime} %{ISO8601_TIMEZONE:timezone} %{NUMBER:sequence_num} %{NUMBER:msg_code} %{DATA:msg_sev} %{DATA:msg_class}: %{DATA:msg_text}, %{GREEDYDATA:msg_attrs}",
        ]
      }
      overwrite => ["msg_code", "datetime", "sequence_num", "msg_text","msg_sev","msg_class", "msg_attrs"]
      on_error => "invalid_local_msg"
    }

    mutate {
      gsub => ["msg_attrs", "((cisco-av-pair=(cdp|lldp)-tlv=)|(AVPair=))", ""]
    }

    mutate {
      gsub => [
        "msg_attrs", "cisco-av-pair=", ""
      ]
