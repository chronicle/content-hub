  if [data][win][system][computer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{data.win.system.computer}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{data.win.system.computer}"
        "has_principal_machine" => "true"
      }
      on_error => "no_computer"
    }
  }
  if [data][win][system][level] == "0" or [data][win][system][level] == "4" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [data][win][system][level] == "2" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }
  else if [data][win][system][level] == "3" or [data][win][system][level] == "1" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
# Metadata
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name"       =>  "Wazuh"
      "event.idm.read_only_udm.metadata.product_log_id"     =>  "%{rule.id}"
    }
  }
# End of metadata
  mutate {
    replace => {
      "event_type" => "%{rule.description}"
      "command" => "%{data.command}"
      "srcip" => "%{data.srcip}"
      "agent_ip" => "%{agent.ip}"
      "agent_id" => "%{agent.id}"
      "manager_name" => "%{manager.name}"
      "rule_id" => "%{rule.id}"
    }
  }

  mutate {
    replace => {
      "decoder_name" => "%{decoder.name}"
    }
    on_error => "no_result"
  }
# Determine event type
  if ([event_type] in ["sshd: authentication success.","Successful sudo to ROOT executed.","PAM: Login session opened.","Successful sudo executed.", "Windows logon success.","Windows DC logon failure."]) {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" =>  "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "PASSWORD"
        "decoder_parent" => "%{decoder.parent}"
        "securityResult_action" => "ALLOW"
        "_mechanism" => "REMOTE"
      }
    }

    mutate {
      merge => {
        "security_result.action" => "securityResult_action"
      }
    }

    if [full_log] != "" {
      grok {
        match => {
          "full_log" => ".*port\\s+%{INT:port_number}"
        }
        on_error => "noportnumber"
      }

      mutate {
        convert => {
          "port_number" => "integer"
        }
      }

      mutate {
        rename => {
          "port_number" => "event.idm.read_only_udm.principal.port"
        }
      }
    }

    # UDM Auth
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
      }
    }
    # set command if there is one
    if [command] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{command}"
          "location" => ""
          "has_file_data" => "true"
        }
      }
    }
  }
  # set command if there is one
  else if [event_type] in ["PAM: Login session closed.", "Windows User Logoff."] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" =>  "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "PASSWORD"
        "decoder_parent" => "%{decoder.parent}"
        "securityResult_action" => "ALLOW"
        "_mechanism" => "REMOTE"
      }
    }

    mutate {
      merge => {
        "security_result.action" => "securityResult_action"
      }
    }

    if [full_log] != "" {
      grok {
        match => {
          "full_log" => ".*port\\s+%{INT:port_number}"
        }
        on_error => "noportnumber"
      }

      mutate {
        convert => {
          "port_number" => "integer"
        }
      }

      mutate {
        rename => {
          "port_number" => "event.idm.read_only_udm.principal.port"
        }
      }
    }

    # UDM Auth
   mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
      }
    }

  # set command if there is one
    if [command] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{command}"
          "location" => ""
          "has_file_data" => "true"
        }
      }
    }
  }
  else if [event_type] == "Host-based anomaly detection event (rootcheck)." {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
        "event.idm.read_only_udm.principal.user.userid" => "root"
        "event.idm.read_only_udm.target.resource.name" => "%{data.title}"
      }
    }

    if ["data.file"] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{data.file}"
          "location" => ""
          "has_file_data" => "true"
        }
      }
    }
  }
  else if [event_type] =~ "DeleteObjects" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_DELETION"
      }
    }

    mutate {
      replace => {
        "source_ip_address" => "%{data.aws.source_ip_address}"
      }
    }
  }
  else if ([event_type] in ["First time (su) is executed by user.","User successfully changed UID to root.","First time user executed sudo."]) {
    if [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
  }
  else if [event_type] == "New group added to the system."{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GROUP_CREATION"
      }
    }

    if [full_log] != "" {
      grok {
        match => {
          "full_log" => ".*?name=%{WORD:group_name},\\s+GID=%{INT:group_id}"
        }
        on_error => "no_group_name"
      }
    }
    mutate {
      rename => {
        "group_id" => "event.idm.read_only_udm.target.user.groupid"
        "group_name" => "event.idm.read_only_udm.target.group.group_display_name"
        "manager.name" => "event.idm.read_only_udm.principal.user.userid"
      }
      on_error => "no_gro_"
    }
  }
  else if [event_type] in ["New dpkg (Debian Package) installed.","Dpkg (Debian Package) half configured."] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "package_name" => "%{data.package}"
        "version" => "%{data.version}"
      }
    }
    mutate {
      rename => {
        "package_name" => "_software.name"
        "version" => "_software.version"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.asset.software" => "_software"
      }
    }
  }
  else if [event_type] == "Integrity checksum changed." {
    mutate {
      convert => {
        "syscheck.inode_after" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "intermediary.file.full_path" => "%{location}"
        "security_result.rule_name" => "%{rule.description}"
      }
    }
    if [syscheck][sha1_before] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.src.process.file.sha1" => "%{syscheck.sha1_before}"
        }
        on_error => "no_syscheck_sha1_before"
      }
    }
    if [syscheck][md5_before] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.src.process.file.md5" => "%{syscheck.md5_before}"
        }
        on_error => "no_syscheck_md5_before"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.sha256" => "%{syscheck.sha256_after}"
        "event.idm.read_only_udm.target.process.file.sha1" => "%{syscheck.sha1_after}"
        "event.idm.read_only_udm.target.process.file.md5" => "%{syscheck.md5_after}"
        "event.idm.read_only_udm.target.file.full_path" => "%{syscheck.path}"
        "event.idm.read_only_udm.target.process.file.size" => "%{syscheck.size_after}"
        "event.idm.read_only_udm.src.process.file.sha256" => "%{syscheck.sha256_before}"
        "event_type" => ""
        "location" => ""
        "has_file_data" => "true"
      }
      convert => {
        "event.idm.read_only_udm.target.process.file.size" => "uinteger"
      }
      on_error => "no_syscheck_size_after"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.src.process.file.size" => "%{syscheck.size_before}"
      }
      on_error => "no_syscheck_size_before"
    }
    if ![no_syscheck_size_before] {
      mutate {
        convert => {
          "event.idm.read_only_udm.src.process.file.size" => "uinteger"
        }
        on_error => "no_syscheck_size_before"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{syscheck.inode_after}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{syscheck.inode_after}"
        "has_principal_machine" => "true"
      }
      on_error => "no_syscheck_inode_after"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{syscheck.uname_after}"
        "has_user" => "true"
      }
      on_error => "no_syscheck_uname_after"
    }

    if ![no_syscheck_inode_after] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
        }
      }
    }

  }
  else if [event_type] in ["Systemd: Service has entered a failed state, and likely has not started.","Systemd: Service exited due to a failure."] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SERVICE_STOP"
        "event.idm.read_only_udm.target.application" => "%{decoder.name}"

      }
    }
    if [agent_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "agent_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "agent_ip"
        }
        on_error => "no_agent_ip1"
      }
      if ![no_agent_ip1] {
        mutate {
          replace => {
            "has_principal_machine" => "true"
          }
        }
      }
    }
    if [predecoder][hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{predecoder.hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{predecoder.hostname}"
          "has_principal_machine" => "true"
        }
      }
    }
  }
  else if [event_type] == "Listened ports status (netstat) changed (new port opened or closed)." {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  else if [event_type] == "rsyslog may be dropping messages due to rate-limiting." {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.target.application" => "%{predecoder.program_name}"
        "event.idm.read_only_udm.target.url" => "%{rule.info}"
      }
    }
    if [full_log] != "" {
      grok {
        match => {
          "full_log" => ["%{GREEDYDATA:info}: %{GREEDYDATA:description}"]
        }
        overwrite => ["data1", "description"]
      }
    }
    if [description] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
      }
    }
  }
  else if [event_type] == "System Audit event." {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SYSTEM_AUDIT_LOG_UNCATEGORIZED"
        "event.idm.read_only_udm.target.file.full_path" => "%{data.file}"
        "event.idm.read_only_udm.principal.hostname" => "%{manager.name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{manager.name}"
        "event.idm.read_only_udm.principal.user.userid" => "%{decoder.name}"
        "manager_name" => ""
        "location" => ""
        "has_file_data" => "true"
        "has_principal_machine" => "true"
      }
    }
  }
  else if [event_type] in ["Log file rotated.","Interface entered in promiscuous(sniffing) mode."] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.target.application" => "%{decoder.name}"
      }
    }
  }
  else if [event_type] == "Group (or user) deleted from the system." {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{data.srcuser}"
        "has_user" => "true"
      }
    }

    if [data][srcuser] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GROUP_DELETION"
          "event.idm.read_only_udm.target.application" => "%{decoder.name}"
          "data.srcuser" => ""
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    if [predecoder][hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{predecoder.hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{predecoder.hostname}"
          "has_principal_machine" => "true"
        }
        on_error => "no_predecoder_hostname"
      }
    }
  }
  else if [event_type] in ["Docker: Error message","Docker: Error - unauthorized action"] {
    if [agent_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "agent_ip"
          "event.idm.read_only_udm.target.asset.ip" => "agent_ip"
        }
        on_error => "no_agent_ip2"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
          "event.idm.read_only_udm.target.application" => "%{decoder.name}"
          "security_result.description" => "%{data.docker.message}"
          "security_result.severity" => "ERROR"
          "agent_ip" => ""
        }
      }
    }
    if [predecoder][hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{predecoder.hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{predecoder.hostname}"
          "has_principal_machine" => "true"
        }
