    }
    else if [log_description] =~ "added" {
      mutate {
        replace => {
          "action_data" => "added"
        }
      }
    }
    else if [log_description] =~ "deleted" {
      mutate {
        replace => {
          "action_data" => "deleted"
        }
      }
    }

    if [action_data] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action_data}"
        }
        on_error => "no_action_data"
      }
    }

    if [Location] != "" {
      grok {
        match => {
          "Location" => "\\(%{HOSTNAME:src_host}\\)%{GREEDYDATA}"
        }
        on_error => "no_location"
        overwrite => ["src_host"]
      }
    }

    if [src_host] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{src_host}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{src_host}"
          "has_principal_machine" => "true"
        }
        on_error => "no_src_host"
      }
    }

    if [AlertLevel] != "" {
      mutate {
        replace => {
          "security_result.severity_details" => "%{AlertLevel}"
        }
        on_error => "no_alert_level"
      }
    }

    if [Rule] != "" {
      grok {
        match => {
          "Rule" => "%{INT:rule_value}\\s+-\\s+%{GREEDYDATA:rule_summary}"
        }
        on_error => "no_rule"
      }
      if ![no_rule] {
        mutate {
          replace => {
            "security_result.rule_id" => "%{rule_value}"
          }
          on_error => "no_rule_id"
        }
        mutate {
          replace => {
            "security_result.summary" => "%{rule_summary}"
          }
          on_error => "no_rule_id"
        }
      }
    }

    if [classification] != "" {
      mutate {
        gsub => ['classification',',','\",\"']
      }
      mutate {
        replace => {
          "classification" => "{\"classification\":[\"%{classification}\"]}"
        }
        on_error => "no_classification"
      }
      json {
        source => "classification"
        array_function => "split_columns"
        on_error => "invalid_classification_json"
      }

      if ![invalid_classification_json] {
        mutate {
          replace => {
            "classification_label.key" => "classification"
          }
        }
        for cs in classification {
          mutate {
            replace => {
              "value_array" => ""
            }
          }
          if [cs] != "" {
            mutate {
              replace => {
                "value_array.string_value" => "%{cs}"
              }
              on_error => "no_classification_value"
            }
            mutate {
              merge => {
                "classification_label.value.list_value.values" => "value_array"
              }
              on_error => "no_classification_list"
            }
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "classification_label"
          }
          on_error => "no_classification"
        }
      }
    }

    if [has_principal_machine] == "true" and [has_file_data] == "true" {
      if [action_data] == "added" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "FILE_CREATION"
          }
        }
      }
      else if [action_data] == "modified" or [action_data] == "written" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
          }
        }
      }
      else if [action_data] == "deleted" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "FILE_DELETION"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
          }
        }
      }
    }
    else if [has_principal_machine] == "true"  and [has_registry_data] == "true" {
      if [action_data] == "added" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_CREATION"
