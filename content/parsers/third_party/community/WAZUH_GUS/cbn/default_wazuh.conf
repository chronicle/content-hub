        "event.idm.read_only_udm.principal.hostname" => "%{data.Profile}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{data.Profile}"
        "event.idm.read_only_udm.principal.location.name" => "%{data.Region}"
        "security_result.action_details" => "%{data.Control}"
        "security_result.description" => "%{data.Message}"
        "status_val" => "%{data.Status}"
        "has_principal_machine" => "true"
      }
    }
  }
  else if [rule_id] in ["80203", "80202", "80261"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.url_back_to_product" => "%{data.aws.eventSource}"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{data.aws.eventType}"
        "event.idm.read_only_udm.metadata.description" => "%{data.aws.eventName}"
        "event.idm.read_only_udm.principal.user.userid" => "%{data.aws.userIdentity.principalId}"
        "event.idm.read_only_udm.principal.location.name" => "%{data.aws.awsRegion}"
        "event.idm.read_only_udm.principal.hostname" => "%{data.aws.sourceIPAddress}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{data.aws.sourceIPAddress}"
        "event.idm.read_only_udm.principal.user.product_object_id" => "%{data.aws.userIdentity.accountId}"
        "event.idm.read_only_udm.target.application" => "%{decoder.name}"
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{data.aws.userIdentity.sessionContext.sessionIssuer.userName}"
        "label1.key" => "ARN"
        "label1.value" => "%{data.aws.userIdentity.sessionContext.sessionIssuer.arn}"
        "label2.key" => "Request ID"
        "label2.value" => "%{data.aws.requestID}"
        "label3.key" => "Event ID"
        "label3.value" => "%{data.aws.eventID}"
        "label4.key" => "LoadBalancer Name"
        "label4.value" => "%{data.aws.requestParameters.loadBalancerName}"
        "source_ip_address" => ""
        "has_principal_machine" => "true"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "label1"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "label2"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "label3"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "label4"
      }
    }
