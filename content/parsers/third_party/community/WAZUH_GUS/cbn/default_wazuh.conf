      }
      on_error => "no_target_domain"
    }
  }
  if [data][win][eventdata][targetUserName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{data.win.eventdata.targetUserName}"
        "has_user" => "true"
      }
      on_error => "no_target_user"
    }
  }
  if [data][win][eventdata][targetUserSid] != "" {
    mutate {
