  grok {
    match => {
      "message" => [
                    "<%{INT}>%{MONTH}\\s+%{MONTHDAY}\\s+%{TIME}\\s+(?P<product>SVROSSEC)\\s+%{DATA:application}: %{GREEDYDATA:kv_log_data}; %{GREEDYDATA:log_message}"
                    "%{MONTHNUM:ts_month}/%{MONTHDAY:ts_day}/%{YEAR:ts_year}:%{TIME:ts_time}%{SPACE}%{HOSTNAME:hostname}?[\\s]+[a-zA-Z0-9_-]+%{SPACE}:%{SPACE}default %{WORD:feature} %{WORD:message_type} %{NUMBER} %{NUMBER}%{SPACE}:%{SPACE}%{GREEDYDATA:message_data}"
                    "%{SYSLOGTIMESTAMP:datetime}%{SPACE}%{HOSTNAME:hostname}%{SPACE}%{DATA:application}:%{SPACE}(?P<time>%{YEAR}%{SPACE}%{SYSLOGTIMESTAMP:date})%{SPACE}\\(%{DATA:UserName}\\)%{SPACE}%{IP:src_ip}->(?:(%{DATA:cmd}\\s+%{TIMESTAMP_ISO8601}\\s+%{IP}\\s+%{WORD:method}\\s+%{DATA:target_url}\\s+-\\s+%{DATA}\\s+-\\s+%{INT:response_code}%{SPACE}%{INT}%{SPACE}%{INT}%{SPACE}%{INT})|(%{DATA:csv_data}:  %{GREEDYDATA:kv_data}))"
                    # "%{SYSLOGTIMESTAMP:datetime}%{SPACE}%{HOSTNAME:hostname}%{SPACE}%{DATA:application}:%{SPACE}(?P<time>%{YEAR}%{SPACE}%{SYSLOGTIMESTAMP:date})%{SPACE}\\(%{DATA:UserName}\\)%{SPACE}%{IP:src_ip}->(?:%{GREEDYDATA:cmd}%{SPACE}(?P<time>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{HOUR}:%{MINUTE}:%{SECOND})%{SPACE}%{IP}%{SPACE}%{WORD:method}%{SPACE}%{DATA:file_fullpath}%{SPACE}-%{SPACE}%{GREEDYDATA}%{SPACE}-%{SPACE}%{INT:response_code}%{SPACE}%{INT}%{SPACE}%{INT}%{SPACE}%{INT}|%{DATA:csv_data}:  %{GREEDYDATA:kv_data})"
                    "^<%{INT:r_priority}>%{SYSLOGTIMESTAMP:r_datetime} %{HOSTNAME:hostname} %{NOTSPACE:r_cat_name} %{NUMBER:r_msg_id} %{GREEDYDATA:local_msg}",
                    "<%{INT}>%{SYSLOGTIMESTAMP:datetime}%{SPACE}%{DATA} %{INT} %{TIMESTAMP_ISO8601} %{DATA} %{DATA:application} %{INT} - -\\s+Event \\[%{DATA:event_id}\\] \\[%{DATA}\\] \\[%{TIMESTAMP_ISO8601}\\] \\[%{DATA:product_event_type}\\] \\[%{LOGLEVEL:level}\\] \\[%{DATA:user_id}\\] \\[%{DATA}\\] \\[%{DATA}\\] \\[User %{DATA}@%{IP:src_ip} (?P<sr_description>.+ user agent:\\s+%{DATA:user_agent}\\))\\]"
                    "<%{INT}>%{MONTH}\\s+%{MONTHDAY}\\s+%{TIME}\\s+%{HOSTNAME}\\s+%{PROG}:?(?P<jsondata>.*)"
                    "(<%{INT}>%{MONTH}\\s+%{MONTHDAY}\\s+%{TIME}\\s+%{HOSTNAME}\\s+%{PROG}: )?(?P<jsondata>.*)"
                    ]
    }
    overwrite => ["hostname", "jsondata", "feature", "r_cat_name", "r_msg_id", "local_msg", "message_data","message_type", "response_code", "src_ip", "time", "UserName", "cmd", "method", "target_url", "datetime", "kv_data", "csv_data", "event_id", "product_event_type","user_id", "sr_description", "user_agent", "severity","kv_log_data","log_message","product"]
    on_error => "grok_failed"
  }

  mutate {
    gsub => ["jsondata","\\\\r",""]
  }
   mutate {
    gsub => ["jsondata","\\n"," "]
  }
  mutate {
    gsub => ["jsondata",'\\"event\\"','\"log_event_type\"']
  }
  json {
    source => "jsondata"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [data][vulnerability][type] != "" {
    mutate {
      replace => {
        "type_label.key" => "data.vulnerability.type"
        "type_label.value.string_value" => "%{data.vulnerability.type}"
      }
      on_error => "no_type"
    }
    if ![no_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type_label"
        }
        on_error => "no_type_label"
      }
    }
  }
  if [data][vulnerability][title] != "" {
    mutate {
      replace => {
        "title_label.key" => "data.vulnerability.title"
        "title_label.value.string_value" => "%{data.vulnerability.title}"
