      value_split => " "
      on_error => "not_kv"
    }

    if [not_kv] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    if [feature] == "TCP" {
      grok {
        match => {
          "Source" => [
            "%{IP:principal_ip}:%{INT:principal_port}"
          ]
        }
        overwrite => ["principal_ip"]
      }

      grok {
        match => {
          "Destination" => [
            "%{IP:target_ip}:%{INT:target_port}"
          ]
        }
        overwrite => ["target_ip"]
      }

      mutate {
        convert => {
          "principal_port" => "integer"
          "target_port" => "integer"
          "Total_bytes_send" => "uinteger"
          "Total_bytes_recv" => "uinteger"
        }
      }
      if [principal_ip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "principal_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "principal_ip"
          }
