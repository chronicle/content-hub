    if [msg_sev] in ["EMERGENCY","ALERT","CRITICAL"] {
      mutate {
        replace => {
           "security_result.severity" => "CRITICAL"
        }
      }
    }
    else if [msg_sev] == "ERROR"  {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [msg_sev] == "WARN" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    else if [msg_sev] == "NOTICE" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else if [msg_sev] == "INFO" {
      mutate {
        replace => {
