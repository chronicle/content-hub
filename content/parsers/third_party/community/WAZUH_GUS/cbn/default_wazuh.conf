        }
        if ![principal_ip_not_set] {
          mutate {
            replace => {
              "has_principal_machine" => "true"
            }
          }
        }
      }
      if [target_ip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "target_ip"
            "event.idm.read_only_udm.target.asset.ip" => "target_ip"
          }
          on_error => "target_ip_not_set"
        }
      }

      mutate {
        rename => {
          "principal_port" => "event.idm.read_only_udm.principal.port"
          "target_port" => "event.idm.read_only_udm.target.port"
          "Total_bytes_send" => "event.idm.read_only_udm.network.sent_bytes"
          "Total_bytes_recv" => "event.idm.read_only_udm.network.received_bytes"
        }
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "TCP"
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [feature] == "SSLLOG" {
      if [message_type] == "SSL_HANDSHAKE_SUCCESS" {
        mutate {
          convert => {
            "ClientPort" => "integer"
            "ServerPort" => "integer"
          }
        }

        mutate {
          rename => {
            "ClientPort" => "event.idm.read_only_udm.principal.port"
            "ServerPort" => "event.idm.read_only_udm.target.port"
          }
        }

        # Some messages does not have ClientIP
        if [ClientIP] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "ClientIP"
              "event.idm.read_only_udm.principal.asset.ip" => "ClientIP"
            }
            on_error => "client_ip_not_set"
          }
          if ![client_ip_not_set] {
            mutate {
              replace => {
                "has_principal_machine" => "true"
              }
            }
          }
        }

        # Some messages does not have ServerIP
        if [ServerIP] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.ip" => "ServerIP"
              "event.idm.read_only_udm.target.asset.ip" => "ServerIP"
            }
            on_error => "server_ip_not_set"
          }
        }

        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "SSL Handshake Success"
          }
        }
      } else if [message_type] == "SSL_HANDSHAKE_FAILURE" {
        mutate {
          convert => {
            "ClientPort" => "integer"
            "VserverServicePort" => "integer"
          }
        }

        mutate {
          rename => {
            "ClientPort" => "event.idm.read_only_udm.principal.port"
            "VserverServicePort" => "event.idm.read_only_udm.target.port"
            "Reason" => "event.idm.read_only_udm.metadata.description"
          }
        }
        if [ClientIP] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "ClientIP"
              "event.idm.read_only_udm.principal.asset.ip" => "ClientIP"
            }
            on_error => "client_ip_not_set1"
          }
          if ![client_ip_not_set1] {
            mutate {
              replace => {
                "has_principal_machine" => "true"
              }
            }
          }
        }
        if [VserverServiceIP] != "" {
