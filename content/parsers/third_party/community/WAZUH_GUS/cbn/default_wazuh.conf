      else if [action_data] == "modified" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_MODIFICATION"
          }
        }
      }
      else if [action_data] == "deleted" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_DELETION"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_UNCATEGORIZED"
          }
        }
      }
    }
    else if [has_principal_machine] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
