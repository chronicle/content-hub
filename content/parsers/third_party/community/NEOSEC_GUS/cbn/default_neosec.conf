# Product: NEOSEC
# Category: Security
# Supported Format: JSON
# Last Updated: 2023-07-31
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "meth" => ""
      "url" => ""
      "severity" => ""
      "status" => ""
      "timestamp" => ""
      "author" => ""
      "detection_model_id" => ""
      "alert_type" => ""
      "endpoint" => ""
      "alert_info" => ""
      "description" => ""
      "security_result" => ""
      "recommendations" => ""
      "name" => ""
      "is_prinicpal" => "false"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_NO_SECURITY_VALUE"
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601"]
      on_error => "date_failure"
    }
  }

  if [detection_model_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{detection_model_id}"
      }
    }
  }
  if [alert_type] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "alert_type"
      }
    }
  }

  if [severity] =~ "(?i)Low" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  } else if [severity] =~ "(?i)Informational" or [severity] =~ "(?i)Info" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  } else if [severity] =~ "(?i)Medium" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  } else if [severity] =~ "(?i)Critical" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  } else if [severity] =~ "(?i)High" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  } else if [severity] =~ "(?i)ERROR" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }
  else {
    mutate {
      replace => {
        "security_result.severity" => "UNKNOWN_SEVERITY"
      }
    }
  }
  for idx,entity in entities {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "entity.value"
      }
      on_error => "entity_value_empty"
    }
    mutate {
      replace => {
        "is_prinicpal" => "true"
      }
    }
  }
  for idx,labeldata in labels {
    mutate {
      replace => {
        "label" => ""
      }
    }
    mutate {
      convert => {
        "idx" => "string"
      }
    }
    mutate {
      replace => {
        "label.key" => "%{idx}: label"
        "label.value" => "%{labeldata}"
      }
    }
    mutate {
      merge => {
        "security_result.rule_labels" => "label"
      }
    }
  }
  if [status] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{status}"
      }
    }
  }
  for endpointdata in endpoints {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.product_specific_process_id"  => "id:%{endpointdata.id}"
      }
      on_error => "id_empty"
    }
    mutate {
      replace => {
       "event.idm.read_only_udm.principal.application" => "%{endpointdata.service_name}"
      }
      on_error => "endpointdata_servicename_empty"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.url" => "%{endpointdata.endpointdata_path}"
      }
      on_error => "endpointdata_path_empty"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{endpointdata.method}"
      }
      on_error => "method_empty"
    }
  }
  if [alert_info] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{alert_info}"
      }
    }
  }
  if [author] != "" {
    mutate{
      replace=>{
        "author_label.key"=>"author"
        "author_label.value"=>"%{author}"
      }
    }
    mutate{
      merge=>{
        "event.idm.read_only_udm.principal.resource.attribute.labels"=>"author_label"
      }
    }
  }
  if [endpoint] != "" {
    mutate {
      replace => {
        "additional_endpoint.key" => "endpoint"
        "additional_endpoint.value.string_value" => "%{endpoint}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_endpoint"
      }
    }
  }
  if [name] != "" {
    mutate {
      replace => {
        "additional_name.key" => "name"
        "additional_name.value.string_value" => "%{name}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_name"
      }
    }
  }
  if [recommendations] != "" {
    mutate {
      replace => {
        "additional_recommendations.key" => "recommendations"
        "additional_recommendations.value.string_value" => "%{recommendations}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_recommendations"
      }
    }
  }
  if [author] != "" {
    mutate {
      replace => {
        "additional_author.key" => "author"
        "additional_author.value.string_value" => "%{author}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_author"
      }
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [is_prinicpal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "NEOSEC"
      "event.idm.read_only_udm.metadata.vendor_name" => "Crowdstrike"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
