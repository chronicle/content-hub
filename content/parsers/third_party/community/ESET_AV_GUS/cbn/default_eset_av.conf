# Product: ESET_AV
# Category: ESET_AV
# Supported Format: SYSLOG + JSON
# Reference: N/A
# Last Updated: 2026-08-11
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "ipv4" => ""
      "user" => ""
      "detail" => ""
      "domain" => ""
      "source_uuid" => ""
      "admin_domain" => ""
      "user_id" => ""
      "account" => ""
      "severity" => ""
      "hostname" => ""
      "threat_name" => ""
      "inbound" => ""
      "security_result" => ""
      "action" => ""
      "protocol" => ""
      "target_port" => ""
      "target_address" => ""
      "source_port" => ""
      "source_address" => ""
      "host" => ""
      "process_name" => ""
      "result" => ""
      "group_name" => ""
      "username" => ""
      "rulename" => ""
      "hash" => ""
      "computer_severity_score" => ""
      "severity_score" => ""
      "os_name" => ""
      "processname" => ""
      "eialarmid" => ""
      "eiconsolelink" => ""
      "action_taken" => ""
      "threat_type"=>""
      "scan_id"=>""
      "scanner_id"=>""
      "threat_handled" =>""
      "need_restart"=>""
      # new fields
      "threat_flags" => ""
      "engine_version" => ""
      "object_uri" => ""
      "object_type" => ""
      "circumstances" => ""
      "category" => ""
      "event_type" => ""
      "security_result_action" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "time" => ""
      "threatHandled" => ""
      "actionTaken" => ""
      "needRestart" => ""
      "threatType" => ""
      "threatName" => ""
      "action_" => ""
      "occured" => ""
      "event_id" => ""
      "process_pid" => ""
      "timestamp" => ""
      "desc" => ""
      "json_data" => ""
      "intermediary_host" => ""
      "intermediary_app" => ""
      "intermediary" => ""
      "aggregate_count" => ""
      "sourceAddressType" => ""
      "targetAddressType" => ""
      "srcPort" => ""
      "deviceOSName" => ""
      "eventDesc" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", ""]
  }

  mutate {
    gsub => ["message", "□", ""]
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:time}\\s+%{DATA:intermediary_host}\\s+%{DATA:intermediary_app}\\s+%{DATA}\\s+-\\s+-%{GREEDYDATA:json_data}",
        "<%{INT}>%{DATA}=%{IPV4:source_address}\\s+%{DATA}\\s+%{TIMESTAMP_ISO8601:time}\\s+%{DATA:intermediary_host}\\s+%{DATA:intermediary_app}\\s+%{DATA}\\s+%{DATA}\\s+%{DATA}\\s+%{GREEDYDATA:json_data}",
        "<%{INT}>%{DATA}=%{IPV4:source_address}\\s+%{DATA:intermediary_host}\\s+%{DATA}\\s+%{DATA}\\s+%{DATA}\\s+%{GREEDYDATA:json_data}",
        "^%{TIMESTAMP_ISO8601:timestamp}\\s+-\\s+%{DATA:process_name}\\[%{INT:process_pid}\\]\\s+%{GREEDYDATA:desc}",
        "^%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:event_id}\\s+%{DATA:process_name}\\[%{INT:process_pid}\\]\\s+%{GREEDYDATA:json_data}"
      ]
    }
    on_error => "grok_fail"
    overwrite => ["intermediary_host", "intermediary_app", "source_address", "json_data", "time", "event_id", "process_name", "process_pid", "timestamp", "desc"]
  }

  mutate {
    gsub => ["json_data", "﻿", ""]
  }
  mutate {
    gsub => ["json_data", "∩╗┐", ""]
  }

  json {
    source => "json_data"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    if [json_data] != "" {
      grok {
        match => {
          "json_data" => [
            "%{GREEDYDATA}Category:\\s+%{DATA:category}\\s+Computer\\s+name:\\s+%{DATA:hostname}\\s+%{DATA}:\\s+%{GREEDYDATA:group_name}"
          ]
        }
        overwrite => ["category", "hostname", "group_name"]
        on_error => "json_data_grok_fail"
      }
      if [json_data_grok_fail] {
        drop {
          tag => "TAG_MALFORMED_MESSAGE"
        }
      }
    }
  }

  mutate {
    rename => {
      "event" => "event_desc"
      "target" => "target1"
    }
  }
  if [occured] != "" {
    date {
      match => ["occured" , "dd-MMM-yyyy HH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "occured_invalid"
    }
  }
  else if [time] != "" {
    date {
      match => ["time", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "time_invalid"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "metadata.collected_timestamp"
      on_error => "timestamp_invalid"
    }
  }
  mutate {
    replace => {
      "target1_label.key" => "target"
      "target1_label.value" => "%{target1}"
    }
    on_error => "target1_invalid"
  }
  if ![target1_invalid] and [target1] != "" {
    mutate {
      merge => {
        "target.resource.attribute.labels" => "target1_label"
      }
      on_error => "target1_label_merge_failed"
    }
  }

  # principal
  if [source_address] != "" {
    mutate {
      merge => {
        "principal.ip" => "source_address"
        "principal.asset.ip" => "source_address"
      }
      on_error => "source_address_merge_failed"
    }
    if ![source_address_merge_failed] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [event_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{event_id}"
      }
      on_error => "event_id_invalid"
    }
  }

  if [process_pid] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{process_pid}"
      }
      on_error => "process_pid_empty"
    }
  }

  if [desc] not in ["", "-"] {
    mutate {
      gsub => ["desc", "﻿", ""]
    }
    mutate {
      replace => {
        "desc_label.key" => "desc"
        "desc_label.value.string_value" => "%{desc}"
      }
      on_error => "desc_label_error"
    }
    if ![desc_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "desc_label"
        }
        on_error => "desc_label_merge_error"
      }
    }
  }
  if [srcPort] != "" and [source_port] == "" {
    mutate {
      replace => {
        "source_port" => "%{srcPort}"
      }
      on_error => "srcPort_invalid"
    }
  }
  if [source_port] != "" {
    mutate {
      convert => {
        "source_port" => "string"
      }
      on_error => "source_port_already_string"
    }
    mutate {
      replace => {
        "principal.port" => "%{source_port}"
      }
      on_error => "source_port_invalid"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
        "principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "hostname_invalid"
    }
  }

  if [domain] != "" {
    mutate {
      replace => {
        "principal.domain.name" => "%{domain}"
      }
    }
  }

  if [account] != "" {
    grok  {
      match => {
        "account" => [
          "%{DATA:admin_domain}\\\\%{WORD:user_id}"
        ]
      }
      on_error => "account_error"
      overwrite => ["admin_domain","user_id"]
    }
  }

  if [admin_domain] != "" {
    mutate {
      replace => {
        "principal.administrative_domain" => "%{admin_domain}"
      }
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
        "has_user" => "true"
      }
      on_error => "user_id_invalid"
    }
  }
  else if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
        "has_user" => "true"
      }
      on_error => "user_invalid"
    }
  }
  else if [username] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{username}"
        "has_user" => "true"
      }
      on_error => "username_invalid"
    }
  }

  # new mapping
  if [group_name] != "" {
    mutate {
      replace => {
        "principal.group.group_display_name" => "%{group_name}"
      }
      on_error => "group_display_name_invalid"
    }
  }

  if [hash] != "" {
    mutate {
      replace => {
        "hash_label.key" => "hash"
        "hash_label.value" => "%{hash}"
      }
      on_error => "hash_invalid"
    }
    if ![hash_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "hash_label"
        }
        on_error => "hash_label_merge_failed"
      }
    }

    mutate {
      lowercase => ["hash"]
    }
    if [hash] =~ "^[a-fA-F0-9]{40}$" {
      mutate {
        replace => {
          "principal.file.sha1" => "%{hash}"
        }
        on_error => "hash_invalid"
      }
    }
  }

  if [eiconsolelink] != "" {
    mutate {
      replace => {
        "principal.url" => "%{eiconsolelink}"
      }
      on_error => "eiconsolelink_invalid"
    }
  }

  if [os_name] != "" {
    mutate {
      replace => {
        "principal.platform_version" => "%{os_name}"
      }
      on_error => "os_name_invalid"
    }
  }

  if [os_name] =~ "(?i)(window)" || [deviceOSName] =~ "(?i)(window)" {
    mutate {
      replace => {
        "principal.platform" => "WINDOWS"
      }
    }
  }
  else if [os_name] =~ "(?i)(linux)" || [deviceOSName] =~ "(?i)(linux)" {
    mutate {
      replace => {
        "principal.platform" => "LINUX"
      }
    }
  }
  else if [os_name] =~ "(?i)(mac)" || [deviceOSName] =~ "(?i)(mac)" {
    mutate {
      replace => {
        "principal.platform" => "MAC"
      }
    }
  }
  if [deviceOSName] != "" {
    mutate {
      replace => {
        "principal.asset.platform_software.platform_version" => "%{deviceOSName}"
      }
      on_error => "device_os_name_invalid"
    }
  }
  if [eventDesc] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{eventDesc}"
      }
      on_error => "event_desc_invalid"
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "host_invalid"
    }
  }

  # intermediary
  if [intermediary_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_host}"
      }
      on_error => "intermediary_host_invalid"
    }
  }
  if [intermediary_app] != "" {
    mutate {
      replace => {
        "intermediary.application" => "%{intermediary_app}"
      }
      on_error => "intermediary_app_invalid"
    }
  }

  # target
  if [target_address] != "" {
    mutate {
      merge => {
        "target.ip" => "target_address"
        "target.asset.ip" => "target_address"
      }
      on_error => "target_address_merge_failed"
    }
  }
  else if [ipv4] != "" {
    mutate {
      merge => {
        "target.ip" => "ipv4"
        "target.asset.ip" => "ipv4"
      }
      on_error => "ipv4_merge_failed"
    }
  }

  if [target_port] != "" {
    mutate {
      convert => {
        "target_port" => "string"
      }
      on_error => "target_port_already_string"
    }
    mutate {
      replace => {
        "target.port" => "%{target_port}"
      }
      on_error => "target_port_invalid"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "target_port_already_integer"
    }
  }

  #network
  if [protocol] =~ "(?i)(TCP|UDP|ICMP|VRRP|EIGRP|ESP|ETHERIP|GRE|IP6IN4|PIM)" {
    mutate {
      uppercase => ["protocol"]
    }
    mutate {
      replace => {
        "network.ip_protocol" => "%{protocol}"
      }
      on_error => "protocol_invalid"
    }
  }

  if [inbound] == true {
    mutate {
      replace => {
        "network.direction" => "INBOUND"
      }
    }
  }
  else if [inbound] == false {
    mutate {
      replace => {
        "network.direction" => "OUTBOUND"
      }
    }
  }

  # process
  if [process_name] == "" and [processname] != "" {
    mutate {
      replace => {
        "process_name" => "%{processname}"
      }
      on_error => "processname_not_found"
    }
  }
  if [process_name] != "" {
    mutate {
      replace => {
        "principal.process.file.full_path" => "%{process_name}"
      }
      on_error => "process_name_invalid"
    }
  }

  # security_result
  if [action] =~ "(?i)(Block)" {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
  }
  else if [action] =~ "(?i)(Start|Allow|Login attempt)" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }
  else if [action_taken] =~ "(?i)(Block)" {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
  }
  else if [action_taken] =~ "(?i)(Start|Allow)" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }
  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
      on_error => "security_result_action_merge_failed"
    }
  }
  if [action_taken] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action_taken}"
      }
      on_error => "action_taken_invalid"
    }
  }
  if [threat_type] != "" {
    mutate{
      replace => {
        "security_result.threat_id" => "%{threat_type}"
      }
      on_error => "threat_type_invalid"
    }
  }
  if [threat_name] != "" {
    mutate {
      replace => {
        "security_result.threat_name" => "%{threat_name}"
      }
      on_error => "threat_name_invalid"
    }
  }
  if [scan_id] != "" {
    mutate {
      replace => {
        "scan_id_label.value" => "%{scan_id}"
        "scan_id_label.key" => "scan_id"
      }
      on_error => "scan_id_invalid"
    }
    if ![scan_id_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "scan_id_label"
        }
        on_error => "scan_id_merge_failed"
      }
    }
  }
  if [scanner_id] != "" {
    mutate {
      replace => {
        "scanner_id_token.value" => "%{scanner_id}"
        "scanner_id_token.key" => "scanner_id"
      }
      on_error => "scanner_id_invalid"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "scanner_id_token"
      }
      on_error => "scanner_id_merge_failed"
    }
  }
  if [threat_handled] != "" {
    mutate{
      convert =>{
        "threat_handled" => "string"
      }
      on_error => "threat_handled_convert_failed"
    }
    mutate {
      replace => {
        "threat_handled_label.value" => "%{threat_handled}"
        "threat_handled_label.key" => "threat_handled"
      }
      on_error => "threat_handled_invalid"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "threat_handled_label"
      }
      on_error => "threat_handled_merge_failed"
    }
  }
  if [need_restart] != "" {
    mutate{
      convert =>{
        "need_restart" => "string"
      }
      on_error => "need_restart_convert_failed"
    }
    mutate {
      replace => {
        "need_restart_label.value.string_value" => "%{need_restart}"
        "need_restart_label.key" => "need_restart"
      }
      on_error => "need_restart_invalid"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "need_restart_label"
      }
      on_error => "need_restart_invalid"
    }
  }
  if [severity] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{severity}"
      }
      on_error => "severity_invalid"
    }
  }
  if [severity] =~ "(?i)(Warn|warn)" or [severity] in ["7" , "8"] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] == "5" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] =~ "(?i)(Info|info)" or [severity] in ["3", "1"] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] == "10" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }

  if [detail] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{detail}"
      }
      on_error => "detail_invalid"
    }
  }
  else if [circumstances] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{circumstances}"
      }
      on_error => "circumstances_invalid"
    }
  }

  if [rulename] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{rulename}"
      }
      on_error => "rulename_invalid"
    }
  }

  if [computer_severity_score] != "" {
    mutate {
      replace => {
        "computer_severity_score_label.key" => "computer_severity_score"
        "computer_severity_score_label.value" => "%{computer_severity_score}"
      }
      on_error => "computer_severity_score_invalid"
    }
    if ![computer_severity_score_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "computer_severity_score_label"
        }
        on_error => "computer_severity_score_label_merge_failed"
      }
    }
  }

  if [severity_score] != "" {
    mutate {
      replace => {
        "severity_score_label.key" => "severity_score"
        "severity_score_label.value" => "%{severity_score}"
      }
      on_error => "severity_score_invalid"
    }
    if ![severity_score_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "severity_score_label"
        }
        on_error => "severity_score_label_merge_failed"
      }
    }
  }

  if [eialarmid] != "" {
    mutate {
      replace => {
        "eialarmid_label.key" => "eialarmid"
        "eialarmid_label.value" => "%{eialarmid}"
      }
      on_error => "eialarmid_invalid"
    }
    if ![eialarmid_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "eialarmid_label"
        }
        on_error => "eialarmid_label_merge_failed"
      }
    }
  }

  if [result] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{result}"
      }
      on_error => "result_invalid"
    }
  }

  # new fields
  if [object_uri] != "" {
    mutate {
      replace => {
        "target.url" => "%{object_uri}"
      }
      on_error => "object_uri_invalid"
    }
  }

  if [threat_flags] != "" {
    mutate {
      replace => {
        "threat_flags_label.key" => "threat_flags"
        "threat_flags_label.value" => "%{threat_flags}"
      }
      on_error => "threat_flags_invalid"
    }
    if ![threat_flags_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "threat_flags_label"
        }
        on_error => "threat_flags_label_merge_failed"
      }
    }
  }

  if [engine_version] != "" {
    mutate {
      replace => {
        "engine_version_label.key" => "engine_version"
        "engine_version_label.value" => "%{engine_version}"
      }
      on_error => "engine_version_invalid"
    }
    if ![engine_version_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "engine_version_label"
        }
        on_error => "engine_version_label_merge_failed"
      }
    }
  }

  if [object_type] != "" {
    mutate {
      replace => {
        "object_type_label.key" => "object_type"
        "object_type_label.value" => "%{object_type}"
      }
      on_error => "object_type_invalid"
    }
    if ![object_type_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "object_type_label"
        }
        on_error => "object_type_label_merge_failed"
      }
    }
  }

  if [category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "category"
      }
      on_error => "category_invalid"
    }
  }

  if [threatHandled] != "" {
    mutate {
      replace => {
        "threatHandled_label.key" => "threatHandled"
        "threatHandled_label.value" => "%{threatHandled}"
      }
      on_error => "threatHandled_invalid"
    }
    if ![threatHandled_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "threatHandled_label"
        }
        on_error => "threatHandled_label_merge_failed"
      }
    }
  }

  if [threatHandled] == "1" {
    mutate {
      replace => {
        "action_" => "BLOCK"
      }
    }
  }
  else if [threatHandled] == "0" {
    mutate {
      replace => {
        "action_" => "ALLOW"
      }
    }
  }

  if [action_] != "" {
    mutate {
      merge => {
        "security_result.action" => "action_"
      }
      on_error => "action_merge_failed"
    }
  }

  if [actionTaken] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{actionTaken}"
      }
      on_error => "actionTaken_invalid"
    }
  }

  if [needRestart] != "" {
    mutate {
      replace => {
        "needRestart_label.key" => "needRestart"
        "needRestart_label.value" => "%{needRestart}"
      }
      on_error => "needRestart_invalid"
    }
    if ![needRestart_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "needRestart_label"
        }
        on_error => "needRestart_label_merge_failed"
      }
    }
  }

  if [threatName] != "" {
    mutate {
      replace => {
        "security_result.threat_name" => "%{threatName}"
      }
      on_error => "threatName_invalid"
    }
  }

  if [threatType] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{threatType}"
      }
      on_error => "threatType_invalid"
    }
  }
  if [sourceAddressType] != "" {
    mutate {
      replace => {
        "source_address_type_label.key" => "sourceAddressType"
        "source_address_type_label.value" => "%{sourceAddressType}"
      }
      on_error => "source_address_type_invalid"
    }
    if ![source_address_type_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "source_address_type_label"
        }
        on_error => "source_address_type_label_merge_failed"
      }
    }
  }
  if [targetAddressType] != "" {
    mutate {
      replace => {
        "target_address_type_label.key" => "targetAddressType"
        "target_address_type_label.value" => "%{targetAddressType}"
      }
      on_error => "target_address_type_invalid"
    }
    if ![target_address_type_invalid] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "target_address_type_label"
        }
        on_error => "target_address_type_label_merge_failed"
      }
    }
  }
  if [aggregate_count] != "" {
    mutate {
      replace => {
        "aggregate_count_label.key" => "aggregate_count"
        "aggregate_count_label.value.string_value" => "%{aggregate_count}"
      }
      on_error => "aggregate_count_invalid"
    }
    if ![aggregate_count_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "aggregate_count_label"
        }
        on_error => "aggregate_count_label_merge_failed"
      }
    }
  }

  # metadata
  mutate {
    replace => {
      "metadata.vendor_name"  => "ESET_AV"
      "metadata.product_name" => "ESET_AV"
    }
  }

  mutate {
    replace => {
      "metadata.description" => "%{event_desc}"
    }
    on_error => "description_not_found"
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{event_type}"
      }
      on_error => "event_type_invalid"
    }
  }

  if [source_uuid] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{source_uuid}"
      }
      on_error => "source_uuid_invalid"
    }
  }

  # set metadata.event_type
  if [source_address] != "" and [target_address] != "" {
    mutate {
      replace => {
        "eventtype" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "eventtype" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "eventtype" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "eventtype" => "GENERIC_EVENT"
      }
    }
  }

  if [eventtype] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{eventtype}"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }

  # udm noun
  mutate {
    rename => {
      "metadata" => "event.idm.read_only_udm.metadata"
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "network" => "event.idm.read_only_udm.network"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
