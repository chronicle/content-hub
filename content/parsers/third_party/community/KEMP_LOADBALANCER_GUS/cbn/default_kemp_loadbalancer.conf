# Product: Kemp Load Balancer
# Category: Load Balancer, Traffic Shaper, ADC
# Supported Format: SYSLOG + KV, SYSLOG
# Reference: https://support.kemptechnologies.com/hc/en-us/articles/14337601552909
# Last Updated: 2026-05-21
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "audit_msg" => ""
      "log_number" => ""
      "event_type" => ""
      "src_ip" => ""
      "srcip" => ""
      "dest_ip" => ""
      "dstip" => ""
      "src_port" => ""
      "srcport" => ""
      "dest_port" => ""
      "dstport" => ""
      "http_response_code" => ""
      "http_method" => ""
      "description" => ""
      "user" => ""
      "security_action" => ""
      "login_status" => ""
      "file_size" => ""
      "log_event" => ""
      "resource" => ""
      "vs" => ""
      "vs_port" => ""
      "summary" => ""
      "sec_result" => ""
      "log_time" => ""
      "inter_hostname" => ""
      "sshd" => ""
      "pid" => ""
      "meta_sequenceId" => ""
      "process_name" => ""
      "http_path" => ""
      "sequenceId" => ""
      "log_level" => ""
      "http_version" => ""
      "hlen" => ""
      "nhdrs" => ""
      "service_info" => ""
      "inter_ip" => ""
      "timestamp" => ""
      "version1" => ""
      "intermediary" => ""
      "placeholder" => ""
      "event_timestamp_data" => ""
      "group" => ""
      "process_id" => ""
      "syslog_ver" => ""
      "sid" => ""
      "rev" => ""
      "url_path" => ""
      "log_message" => ""
      "file_path" => ""
      "Total" => ""
      "Up" => ""
      "Down" => ""
      "Disabled" => ""
      "tool_name" => ""
      "vs1" => ""
      "has_target_user" => "false"
      "has_principal_ip" => "false"
      "has_target_ip" => "false"
    }
  }
  mutate {
    gsub => ["message",'\\r\\n',' ']
  }
  grok {
    match => {
      "message" => ["<%{INT:log_number}>%{GREEDYDATA:msg}"]
    }
    overwrite => ["log_number", "msg"]
  }
  # Log Number
  # 4 Ratelimit
  # 6 HTTP bad request
  # 10 service stop/start request
  # 11 HTTP connection request/response
  # 14 SMTP alerts
  # 27 FTP events, back up related actions
  # 35 HTTP AUTH related request
  # 84, 85 USER Authentication request / response
  if[log_number] == "4" {
    grok {
      match => {
        "msg" => ["kernel: %{GREEDYDATA}: %{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{DATA} net_ratelimit: %{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{DATA} %{DATA}:%{DATA}\\[%{IPV4:src_ip}:%{INT:src_port}%{GREEDYDATA}%{IPV4:dest_ip}:%{INT:dest_port}\\] %{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{DATA} %{DATA}: %{GREEDYDATA}\\[\\[%{IP:src_ip}\\]:%{DATA:src_port}%{GREEDYDATA}\\[%{IP:dest_ip}\\]:%{DATA:dest_port}\\]%{GREEDYDATA:description}"
        ]
      }
      overwrite => ["description", "src_ip", "inter_hostname", "application", "src_port", "dest_ip", "dest_port"]
      on_error => "log_number_4_grok_fail"
    }
  }
  else if[log_number] == "6" {
    grok {
      match => {
        "msg" => [
                "%{INT} %{TIMESTAMP_ISO8601:log_time} %{HOSTNAME:inter_hostname} %{WORD:application} %{DATA}: %{DATA:description} \\(%{IP:src_ip}:%{INT:src_port}->%{IP:dest_ip}:%{INT:dest_port}%{DATA} \\(%{DATA:summary}\\)",
                 "%{INT} %{TIMESTAMP_ISO8601:log_time} %{HOSTNAME:inter_hostname} %{WORD:application} %{DATA}: (?P<description>badrequest-select_conn) \\[%{IPV4:src_ip}:%{INT:src_port}%{GREEDYDATA}%{IPV4:dest_ip}:%{INT:dest_port}\\] \\(-%{INT:http_response_code}\\): %{WORD:http_method}",
                  "kernel: %{GREEDYDATA:layer}: (?P<description>badrequest-select_conn) \\[%{IPV4:src_ip}:%{INT:src_port}%{GREEDYDATA}%{IPV4:dest_ip}:%{INT:dest_port}\\] \\(-%{INT:http_response_code}\\): %{WORD:http_method}",
                  "%{SYSLOGTIMESTAMP} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{DATA}: %{DATA:description} \\[%{IPV4:src_ip}:%{INT:src_port}%{GREEDYDATA}%{IPV4:dest_ip}:%{INT:dest_port}\\] \\(-%{INT:http_response_code}\\): %{WORD:http_method}",
                  "%{SYSLOGTIMESTAMP} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{DATA} %{DATA}:%{DATA}\\[%{IPV4:src_ip}:%{INT:src_port}%{GREEDYDATA}%{IPV4:dest_ip}:%{INT:dest_port}\\] %{GREEDYDATA:description}",
                  "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{GREEDYDATA}: %{DATA:description} \\[\\[%{IP:src_ip}\\]:%{INT:src_port}%{GREEDYDATA}\\[%{IP:dest_ip}\\]:%{INT:dest_port}\\] \\(-%{INT:http_response_code}\\): %{WORD:http_method}",
                  "%{SYSLOGTIMESTAMP} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{DATA} %{DATA}: %{GREEDYDATA}\\[\\[%{IP:src_ip}\\]:%{DATA:src_port}%{GREEDYDATA}\\[%{IP:dest_ip}\\]:%{DATA:dest_port}\\]%{GREEDYDATA:description}",
                  "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{GREEDYDATA}: %{DATA} %{IP:src_ip}:%{INT:src_port}%{GREEDYDATA:description} %{IP:dest_ip}:%{INT:dest_port}",
                  "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{GREEDYDATA}: %{GREEDYDATA:description}",
                  "--%{GREEDYDATA:description}--",
                  "%{INT} %{TIMESTAMP_ISO8601:log_time} %{HOSTNAME:inter_hostname} %{WORD:process_name} - - \\[meta sequenceId=\\\"%{INT:sequenceId}\\\"\\] %{DATA:log_level}: %{DATA:description} \\[%{IP:src_ip}:%{INT:src_port}->%{IP:dest_ip}:%{INT:dest_port}\\] \\(%{NUMBER:http_response_code}\\): %{WORD:http_method} %{DATA:http_path}, %{INT:http_version} \\[hlen %{INT:hlen}, nhdrs %{INT:nhdrs}\\]",
                  "%{INT:syslog_ver} %{TIMESTAMP_ISO8601:log_time} %{WORD:inter_hostname} %{WORD:process_name} - - \\[meta sequenceId=%{DATA:sequenceId}\\] %{WORD:log_level}: %{DATA:description} \\[%{IP:src_ip}:%{INT:src_port}->%{IP:dest_ip}:%{INT:dest_port}\\] \\(-%{INT:http_response_code}\\):%{DATA:tool_name} ? , %{INT} \\[hlen %{INT:hlen}, nhdrs %{INT:nhdrs}\\]%{GREEDYDATA:additional}",
                  "%{INT:syslog_ver} %{TIMESTAMP_ISO8601:timestamp} %{WORD:inter_hostname} %{WORD:process_name} - - \\[meta sequenceId=%{DATA:sequenceId}\\] Detect: %{GREEDYDATA:http_path} \\[%{IP:src_ip}:%{NUMBER:src_port}->%{IP:dest_ip}:%{INT:dest_port}\\] %{GREEDYDATA:file_path} - %{GREEDYDATA:description} \\(sid:%{INT:sid} rev:%{INT:rev}\\) "
                 ]
      }
      overwrite => ["src_ip", "dest_ip", "src_port", "dest_port", "http_response_code", "http_method", "description","summary","log_time","inter_hostname", "process_name", "http_path", "sequenceId", "log_level", "http_version", "hlen", "nhdrs", "sid", "rev", "file_path", "timestamp","syslog_ver","tool_name"]
      on_error => "log_number_6_grok_fail"
    }
  }
  else if[log_number] == "10" {
    grok {
      match => {
        "msg" => ["%{GREEDYDATA}: %{GREEDYDATA} %{IPV4:dest_ip}:%{INT:dest_port}\\(%{GREEDYDATA}\\) %{GREEDYDATA:description}",
        "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{GREEDYDATA} %{IP:src_ip}:%{INT:src_port}%{GREEDYDATA:description}",
        "%{INT:syslog_ver} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} %{DATA:process_name} - - \\[meta sequenceId=\\\"%{INT:sequenceId}\\\"\\] VS %{IP:src_ip}:%{INT:src_port}\\(%{GREEDYDATA:service_info}\\) %{GREEDYDATA:description}"
        ]
      }
      overwrite => ["dest_ip", "dest_port", "description", "inter_hostname", "src_ip", "src_port", "application", "syslog_ver", "timestamp", "sequenceId", "service_info", "process_name"]
      on_error => "log_number_10_grok_fail"
    }
  }
  else if [log_number] == "11" {
    grok {
      match => {
        "msg" => ["%{INT} %{TIMESTAMP_ISO8601:log_time} %{HOSTNAME:inter_hostname} %{WORD:application} %{DATA} RS %{IPV4:src_ip}:%{INT:src_port} %{GREEDYDATA}%{IPV4:dest_ip}:%{INT:dest_port}%{GREEDYDATA:description}",
                  "%{GREEDYDATA}: %{GREEDYDATA} RS %{IPV4:src_ip}:%{INT:src_port} %{GREEDYDATA}%{IPV4:dest_ip}:%{INT:dest_port}%{GREEDYDATA:description}",
                  "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - \\[%{DATA}\\] %{GREEDYDATA:description}"
                  ]
      }
      overwrite => ["src_ip", "dest_ip", "src_port", "dest_port", "description","log_time","inter_hostname","sequenceId"]
      on_error => "log_number_11_grok_fail"
    }
  }
  else if [log_number] == "14" {
    grok {
      match => {
        "msg" => [
                  "%{GREEDYDATA:vsslproxy}: Client (<|)%{IPV4:dest_ip} %{GREEDYDATA:login_status} %{GREEDYDATA}SSL negotiation: %{GREEDYDATA:audit_msg}:%{WORD}:SSL routines:%{GREEDYDATA:description}",
                  "%{SYSLOGTIMESTAMP} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - %{DATA} Client %{IP:dest_ip} %{WORD:login_status} SSL negotiation %{DATA}:%{GREEDYDATA:audit_msg}:%{DATA}:SSL routines:%{GREEDYDATA:description}",
                  "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:src_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:application} - - \\[%{DATA}\\] %{GREEDYDATA:description}",
                  "%{INT:syslog_ver} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} %{WORD:application} - - \\[meta sequenceId=%{DATA:sequenceId}\\] RSstatus:%{GREEDYDATA:description}",
                  "[stats|mailer]: %{GREEDYDATA:description}"
                 ]
      }
      overwrite => ["audit_msg", "dest_ip", "login_status", "description", "log_time", "inter_hostname", "src_ip","syslog_ver","sequenceId","application","timestamp"]
      on_error => "log_number_14_grok_fail"
    }
    if [dest_ip] != "" {
      mutate {
        replace => {
           "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  else if [log_number] == "27" {
    grok {
      match => {
        "msg" => ["%{GREEDYDATA:audit_msg}: Automated Backup to %{GREEDYDATA} \\(%{GREEDYDATA:ftpmethod}\\) returned 2 \\\"--%{TIME}-- %{GREEDYDATA:filename} => %{GREEDYDATA:url} Connecting to %{IPV4:dest_ip}:%{INT:dest_port}%{GREEDYDATA} Logging in as %{WORD:user} %{GREEDYDATA:description} Transfered %{GREEDYDATA:file_size} bytes",
        "%{SYSLOGTIMESTAMP:timestamp} %{IP:inter_ip} %{INT:version1} %{TIMESTAMP_ISO8601:event_timestamp_data} %{WORD:inter_hostname} %{WORD:process_name} (-|%{DATA:user}) (-|%{DATA:group}) \\[meta sequenceId=%{DATA:sequenceId}\\]%{GREEDYDATA:description}"
        ]
      }
      overwrite => ["dest_ip", "dest_port", "description", "file_size", "user", "ftpmethod", "filename", "audit_msg","syslog_ver","sequenceId","event_timestamp_data","inter_hostname","process_name","src_ip","version1","timestamp","group"]
      on_error => "log_number_27_grok_fail"
    }
    if [user] != "" {
      mutate {
        gsub => [ "file_size", ",", "" ]
      }
    }
  }
  else if [log_number] in ["35", "84", "85"] {
    grok {
      match => {
         "msg" => [
                   "%{GREEDYDATA:sshd}\\[%{INT:pid}\\]: %{WORD:audit_msg}: %{WORD}: Authentication (?P<login_status>success|failure) for (?:%{WORD:user}|(%{GREEDYDATA})) from %{IPV4:dest_ip}",
                  "%{GREEDYDATA:sshd}\\[%{INT:pid}\\]: %{WORD:audit_msg}: Received disconnect from %{IPV4:dest_ip} port %{INT:dest_port}",
                  "%{GREEDYDATA:sshd}\\[%{INT:pid}\\]: pam_unix\\(sshd:auth\\): check pass; user (?P<user>[^\\s]+)",
                  "%{GREEDYDATA:sshd}\\[%{INT:pid}\\]: pam_unix\\(sshd:auth\\): authentication (?P<login_status>success|failure); logname=(?P<logname>[^\\s]*) uid=(?P<uid>[^\\s]*) euid=(?P<euid>[^\\s]*) tty=(?P<tty>[^\\s]*) ruser=(?P<ruser>[^\\s]*) rhost=(?P<dest_ip>[^\\s]*) %{GREEDYDATA:user}",
                  "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:dest_ip} %{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{WORD:sshd} %{DATA:pid} - \\[%{DATA}\\] %{GREEDYDATA:description}",
                  "%{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{DATA:sshd} %{INT:pid} - \\[meta sequenceId=\\\"%{INT:meta_sequenceId}\\\"\\] error: Bind to port %{INT:dest_port} on %{IP:dest_ip} %{GREEDYDATA:description}",
                  "%{INT} %{TIMESTAMP_ISO8601} %{DATA:inter_hostname} %{DATA:sshd} %{INT:pid} - \\[meta sequenceId=\\\"%{INT:meta_sequenceId}\\\"\\] %{GREEDYDATA:description}",
                  "%{SYSLOGTIMESTAMP:timestamp} %{IP:inter_ip} %{INT:version1} %{TIMESTAMP_ISO8601:event_timestamp_data} %{DATA:inter_hostname} %{WORD:sshd} %{INT:process_id} (-|%{NOTSPACE:placeholder}) \\[meta sequenceId=%{DATA:sequenceId}\\]"
                 ]
      }
      overwrite => ["dest_ip", "sshd", "dest_port", "pid", "audit_msg", "user", "login_status","inter_hostname","description","src_ip","application","meta_sequenceId","sequenceId","placeholder","version1","event_timestamp_data","process_id","timestamp","inter_ip"]
      on_error => "log_number_14_grok_fail"
    }
    if [meta_sequenceId] != "" {
      mutate {
        convert => {
          "meta_sequenceId" => "string"
        }
        on_error => "meta_sequenceId_conversion_failed"
      }
      mutate {
        replace => {
          "meta_sequenceId_label.key" => "meta_sequenceId"
          "meta_sequenceId_label.value.string_value" => "%{meta_sequenceId}"
        }
        on_error => "meta_sequenceId_replace_failed"
      }
      if ![meta_sequenceId_replace_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "meta_sequenceId_label"
          }
          on_error => "meta_sequenceId_merge_failed"
        }
      }
    }
    kv {
      source => "user"
      value_split => "="
      field_split => ","
      trim_key => " "
    }
    if [user] != "" {
      mutate {
        replace => {
           "event_type" => "USER_LOGIN"
           "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else {
      mutate {
        replace => {
           "event_type" => "GENERIC_EVENT"
        }
      }
    }
    if [sshd] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{sshd}"
        }
        on_error => "sshd_not_set"
      }
    }
    if [pid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{pid}"
        }
        on_error => "pid_not_set"
      }
    }
  }
  else if [log_number] in ["140","150"] {
    mutate {
      gsub => ["msg","msg","log_message"]
    }
    mutate {
      gsub => ["msg","event","log_event"]
    }
    grok {
      match => {
        "msg" => [ "%{INT} %{TIMESTAMP_ISO8601:log_time} %{HOSTNAME:hostname} %{DATA} CEF:%{INT:version}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:kv_data}"]
      }
      overwrite => ["log_time","inter_hostname"]
      on_error => "grok_fail"
    }
    if ![grok_fail] {
      mutate {
        gsub => ["kv_data","([a-zA-Z0-9_]+)=","#$1="]
      }
      kv {
        source => "kv_data"
        field_split => "#"
        value_split => "="
        on_error => "not_kv"
      }
    }
  }
  # Start of mapping common fields
  if [log_time] != "" {
    grok {
      match => {
        "log_time" => "(?P<log_date>%{YEAR:year}\\-%{MONTHNUM:month}\\-%{MONTHDAY:day}T%{HOUR:hour}:%{MINUTE:min}:%{SECOND:sec})%{GREEDYDATA:time_zone}"
      }
    }
    mutate {
      gsub => ["time_zone",":",""]
    }
    mutate {
      replace => {
        "log_time" => "%{log_date} %{time_zone}"
      }
    }
    date {
      match => ["log_time" ,"yyyy-MM-ddTHH:mm:ss Z"]
      on_error => "date_not_matched"
    }
  }
  if [inter_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_hostname}"
      }
    }
  }
  if [process_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{process_name}"
      }
      on_error => "process_name_not_set"
    }
  }
  if [sequenceId] != "" {
    mutate {
      gsub => ["sequenceId",'\\\\\\"',""]
    }
    mutate {
      gsub => ["sequenceId",'\\"',""]
    }
    mutate {
      gsub => ["sequenceId",'\\\\',""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{sequenceId}"
      }
      on_error => "sequenceId_not_set"
    }
  }
  if [http_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{http_path}"
      }
      on_error => "http_path_not_set"
    }
  }
  if [hlen] != "" {
    mutate {
      replace => {
        "hlen_label.value.string_value" => "%{hlen}"
      }
      on_error => "hlen_not_set"
    }
    if ![hlen_not_set] {
      mutate {
        replace => {
          "hlen_label.key" => "hlen"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "hlen_label"
        }
        on_error => "hlen_merge_failed"
      }
    }
  }
  if [nhdrs] != "" {
    mutate {
      replace => {
        "nhdrs_label.value.string_value" => "%{nhdrs}"
      }
      on_error => "nhdrs_not_set"
    }
    if ![nhdrs_not_set] {
      mutate {
        replace => {
          "nhdrs_label.key" => "nhdrs"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "nhdrs_label"
        }
        on_error => "nhdrs_merge_failed"
      }
    }
  }
  if [log_level] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{log_level}"
      }
      on_error => "log_level_not_set"
    }
  }
  if [http_version] != "" {
    mutate {
      replace => {
        "http_version_label.value" => "%{http_version}"
      }
      on_error => "http_version_not_set"
    }
    if ![http_version_not_set] {
      mutate {
        replace => {
          "http_version_label.key" => "HTTP VERSION"
        }
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "http_version_label"
        }
        on_error => "http_version_merge_failed"
      }
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
      on_error => "src_ip_merge_failed"
    }
    if ![src_ip_merge_failed] {
      mutate {
        replace => {
          "has_principal_ip" => "true"
        }
      }
    }
  } else if [srcip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "srcip"
      }
      on_error => "srcip_merge_failed"
    }
    if ![srcip_merge_failed] {
      mutate {
        replace => {
          "has_principal_ip" => "true"
        }
      }
    }
  }
  if [dest_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dest_ip"
      }
      on_error => "dest_ip_merge_failed"
    }
    if ![dest_ip_merge_failed] {
      mutate {
        replace => {
          "has_target_ip" => "true"
        }
      }
    }
  } else if [dstip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dstip"
      }
      on_error => "dstip_merge_failed"
    }
    if ![dstip_merge_failed] {
      mutate {
        replace => {
          "has_target_ip" => "true"
        }
      }
    }
  }
  if [vs] != "" {
    grok {
      match => {
        "vs" => "%{IP:vs1}:%{INT:vs_port}"
      }
      overwrite => ["vs1","vs_port"]
      on_error => "vs_grok_fail"
    }
    if [vs1] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "vs1"
        }
        on_error => "vs1_merge_failed"
      }
      if ![vs1_merge_failed] {
        mutate {
          replace => {
            "has_target_ip" => "true"
          }
        }
      }
    }
    if [dstport] == "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{vs_port}"
        }
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
      }
    }
  }
  if [src_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
  } else if [srcport] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{srcport}"
      }
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
  }
  if [dest_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dest_port}"
      }
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
    }
  } else if [dstport] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dstport}"
      }
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
    }
  }
  if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{user}"
        "has_target_user" => "true"
      }
      on_error => "user_not_set"
    }
  }
   if [inter_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "inter_ip"
      }
      on_error => "ip_merge_failed"
    }
  }
  if [event_timestamp_data] != "" {
    date {
      match => ["event_timestamp_data", "yyyy-MM-ddTHH:mm:ssZZ", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "date_parse_error"
    }
  }
  if [version1] != "" {
    mutate {
      replace => {
        "version_label.key" => "version1"
        "version_label.value.string_value" => "%{version1}"
      }
      on_error => "version1_not_set"
    }
    if ![version1_not_set] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "version_label"
        }
        on_error => "version_merge_failed"
      }
    }
  }
  if [syslog_ver] != "" {
    mutate {
      replace => {
        "syslog_ver_label.key" => "syslog_ver"
        "syslog_ver_label.value.string_value" => "%{syslog_ver}"
      }
      on_error => "syslog_ver_not_set"
    }
    if ![syslog_ver_not_set] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "syslog_ver_label"
        }
        on_error => "syslog_ver_merge_failed"
      }
    }
  }
  if [sid] != "" {
    mutate {
      replace => {
        "sid_label.key" => "sid"
        "sid_label.value.string_value" => "%{sid}"
      }
      on_error => "sid_not_set"
    }
    if ![sid_not_set] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "sid_label"
        }
        on_error => "sid_merge_failed"
      }
    }
  }
  if [rev] != "" {
    mutate {
      replace => {
        "rev_label.key" => "rev"
        "rev_label.value.string_value" => "%{rev}"
      }
      on_error => "rev_not_set"
    }
    if ![rev_not_set] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "rev_label"
        }
        on_error => "rev_merge_failed"
      }
    }
  }
  if [file_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{file_path}"
      }
      on_error => "file_path_not_set"
    }
  }
  if [process_id] != ""{
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{process_id}"
      }
      on_error => "pid_not_set"
    }
  }
 if [tool_name] != "" {
    mutate {
      replace => {
        "tool_name_label.value" => "%{tool_name}"
      }
      on_error => "tool_name_label_not_present"
    }
    if ![tool_name_label_not_present] {
      mutate {
        replace => {
          "tool_name_label.key" => "source"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "tool_name_label"
        }
        on_error => "merge_tool_name_label"
      }
    }
  }
  if [timestamp] != "" {
      date {
        match => ["timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss", "MMM d HH:mm:ss" ]
        rebase => true
        on_error => "diff_format"
        target => "event.idm.read_only_udm.metadata.event_timestamp"
      }
    }
  # Set application protocol based upon port (80/443/21)
  if [dest_port] == "80" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTP"
        "event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [dest_port] == "443" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTPS"
        "event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [dest_port] == "21" {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
    mutate {
      convert => {
        "file_size" => "uinteger"
      }
      on_error => "conversion_failed"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{filename}"
      }
      on_error => "filename_not_set"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ftp.command" => "%{ftpmethod}"
      }
      on_error => "ftpmethod_not_set"
    }
  }

  # HTTP status codes
  if [http_response_code] != ""  {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{http_response_code}"
      }
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
    }
  }
  # HTTP METHODS
  if [http_method] != ""  {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{http_method}"
      }
    }
  }

  if [resource] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{resource}"
      }
    }
  }

  if [log_event] != "" {
    if [log_event] =~ "Connected" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [log_event] =~ "Blocked access to host" {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{log_event}"
      }
    }
  }
  # End of common mapping fields

  # Map result type
  if[login_status] == "Success" {
    mutate {
      replace => {
        "security_action" => "ALLOW"
      }
    }
  }
  else if [login_status] == "Failure" or [login_status] =~ "fail" or [description] =~ "Bad"{
    mutate {
      replace => {
        "security_action" => "BLOCK"
      }
    }
  }

  if [audit_msg] =~ "error" or [audit_msg] =~ "Error"{
    mutate {
      replace => {
        "sec_result.severity" => "ERROR"
      }
    }
  }

  if [login_status] != "" and [audit_msg] != "" {
    mutate {
      merge => {
        "sec_result.action" => "security_action"
      }
    }
  }

  if [description] != "" {
    mutate {
      gsub => ["description", '\\\\n\\"', '']
    }
    mutate {
      gsub => ["description", '\\\\', '']
    }
    grok {
      match => {
        "description" => "%{INT:Total} Total, %{INT:Up} Up %{INT:Down} Down %{INT:Disabled} Disabled"
      }
      overwrite => ["Total", "Up", "Down", "Disabled"]
      on_error => "description_not_set"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "description_not_found"
    }
    if [Total] != "" {
      mutate {
        replace => {
          "Total_label.key" => "Total"
          "Total_label.value.string_value" => "%{Total}"
        }
        on_error => "Total_not_set"
      }
      if ![Total_not_set] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "Total_label"
          }
          on_error => "Total_merge_failed"
        }
      }
    }
    if [Up] != "" {
      mutate {
        replace => {
          "Up_label.key" => "Up"
          "Up_label.value.string_value" => "%{Up}"
        }
        on_error => "Up_not_set"
      }
      if ![Up_not_set] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "Up_label"
          }
          on_error => "Up_merge_failed"
        }
      }
    }
    if [Down] != "" {
      mutate {
        replace => {
          "Down_label.key" => "Down"
          "Down_label.value.string_value" => "%{Down}"
        }
        on_error => "Down_not_set"
      }
      if ![Down_not_set] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "Down_label"
          }
          on_error => "Down_merge_failed"
        }
      }
    }
    if [Disabled] != "" {
      mutate {
        replace => {
          "Disabled_label.key" => "Disabled"
          "Disabled_label.value.string_value" => "%{Disabled}"
        }
        on_error => "Disabled_not_set"
      }
      if ![Disabled_not_set] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "Disabled_label"
          }
          on_error => "Disabled_merge_failed"
        }
      }
    }
  }

  if [summary] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{summary}"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_not_set"
    }
  }
  if [service_info] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{service_info}"
      }
      on_error => "service_info_not_set"
    }
  }
  if [has_target_ip] == "true" and [has_principal_ip] == "true" and [event_type] != "NETWORK_HTTP"{
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  if [event_type] == "GENERIC_EVENT" and ([dest_ip] != "" or [dstip] != "") and ([src_ip] != "" or [srcip] != "") {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  if [event_type] == "GENERIC_EVENT" and [has_target_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if ([event_type] in ["GENERIC_EVENT" , ""]) and ([src_ip] != "" or [srcip] != "") {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  # Rename the event type
  if [event_type] != "" {
    mutate {
      rename => {
        "event_type" => "event.idm.read_only_udm.metadata.event_type"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [file_size] != "" and [file_size] != "0" {
    mutate {
      rename => {
        "file_size" => "event.idm.read_only_udm.target.file.size"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "KEMP_LOADBALANCER"
      "event.idm.read_only_udm.metadata.vendor_name" => "KEMP"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
