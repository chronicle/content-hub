# Product: Steelhead
# Category: Network Management and Optimization
# Supported Format: JSON , SYSLOG
# Reference: N/A
# Last Updated: 2025-06-16
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "source.port" => ""
      "source.ip" => ""
      "destination.port" => ""
      "destination.ip" => ""
      "network.transport" => ""
      "agent.ephemeral_id" => ""
      "network.direction" => ""
      "agent.type" => ""
      "agent.version" => ""
      "agent.id" => ""
      "tags" => ""
      "agent.name" => ""
      "network.community_id" => ""
      "host.id" => ""
      "host.architecture" => ""
      "host.mac" => ""
      "host.ip" => ""
      "host.hostname" => ""
      "host.os.kernel" => ""
      "host.os.platform" => ""
      "host.os.version" => ""
      "syslog_severity" => ""
      "security_result" => ""
      "observer.port" => ""
      "observer.ip" => ""
      "event.category" => ""
      "logstash.irm_region" => ""
      "logstash.irm_site" => ""
      "logstash.irm_environment" => ""
      "logstash_process_host" => ""
      "logstash.process.host" => ""
      "logstash.ingest.timestamp" => ""
      "logstash.collect.host" => ""
      "log.source.address" => ""
      "log_timestamp" => ""
      "inter_hostname" => ""
      "sport" => ""
      "event_data" => ""
      "log_id" => ""
      "src_ip" => ""
      "src_port" => ""
      "target_ip" => ""
      "target_port" => ""
      "log_data" => ""
      "request_consumer_chain" => ""
      "response_consumer_chain" => ""
      "src_mac" => ""
      "target_mac" => ""
      "description" => ""
      "cfe_ip" => ""
      "cmd_line" => ""
      "cfe_port" => ""
      "sfe_ip" => ""
      "sfe_port" => ""
      "protocol" => ""
      "lport" => ""
      "rport" => ""
      "outer_lport" => ""
      "configuration_parameters" => ""
      "client_connected" => ""
      "kv_data" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "userid" => ""
      "response_code" => ""
      "user_name" => ""
      "local_ip" => ""
      "sportid" => ""
      "storeid" => ""
      "hostname" => ""
      "sec_description" => ""
      "wan_tos" => ""
      "lan_tos" => ""
      "lan_classid" => ""
      "lan_classid_ingress" => ""
      "wan_classid" => ""
      "wan_classid_ingress" => ""
      "sock" => ""
      "id" => ""
      "remote_inner_port" => ""
      "event_id" => ""
      "port" => ""
      "descript" => ""
      "uri" => ""
      "transport" => ""
      "prod_event" => ""
      "desc" => ""
      "target_user" => ""
      "principal_user" => ""
      "method" => ""
      "ts" => ""
      "has_target_user" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    grok {
      match => {
        "message" => [
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} sport %{INT:sport} - - \\[%{DATA:event_data}\\.%{DATA:syslog_severity}\\] (?P<log_id_data>%{INT:log_id}|-) \\{(?<ip_data>%{IP:src_ip}:%{INT:src_port}|-) (?<ip_data1>%{IP:target_ip}:%{INT:target_port}|-)\\} %{GREEDYDATA:log_data}",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} (rscored|mgmtd|mdreq|lumberjack_rbt|%{DATA}) %{INT:event_id} - - \\[%{DATA:event_data}\\.%{DATA:syslog_severity}\\](:|) %{GREEDYDATA:description}",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} kernel - - - \\[%{DATA:event_data}\\.%{DATA:syslog_severity}\\] %{DATA:description} %{IP:target_ip} -> from: %{MAC:src_mac} to: %{MAC:target_mac}",
          "\\[%{DATA:event_data}\\.%{DATA:syslog_severity}\\] (?P<log_id_data>%{INT:log_id}|-) \\{(?<ip_data>%{IP:src_ip}:%{INT:src_port}|-) (?<ip_data1>%{IP:target_ip}:%{INT:target_port}|-)\\} %{GREEDYDATA:log_data}",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} postgres %{INT:postgres} - - \\[%{DATA}\\] %{TIMESTAMP_ISO8601} (CET|CEST|%{WORD}) LOG:  (?P<descript>.*\"%{DATA:uri}\".*)",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} sport %{INT:sport} - - (?P<descript>.*)",
          "\\[%{DATA:event_data}\\.%{DATA:syslog_severity}\\] .* %{IP:src_ip} -> from: %{MAC:src_mac} to: %{MAC:target_mac}",
          "\\[%{DATA:event_data}\.%{DATA:syslog_severity}\\] .* %{IP:src_ip}:%{INT:src_port} -> %{IP:target_ip}:%{INT:target_port} ==> .*",
          ".* src %{IP:src_ip}:%{INT:src_port}, dst %{IP:target_ip}:%{INT:target_port}.*",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} kernel - - - (?P<descript>.*)",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} %{DATA:cmd_line} %{INT:pid} %{DATA} %{DATA} (?P<description>\\(%{DATA:userid}\\).*)",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:inter_hostname} (rscored|mgmtd|mdreq|lumberjack_rbt|%{DATA}) (%{INT:event_id}|%{DATA}) - - %{GREEDYDATA:description}"
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601} - - - - - %{SYSLOGTIMESTAMP:ts} %{DATA} %{DATA:inter_hostname} %{GREEDYDATA} %%{DATA:prod_event}: %{GREEDYDATA:desc}"
        ]
      }
      on_error => "grok_fail"
      overwrite => ["ts", "prod_event", "desc", "timestamp", "cmd_line", "userid", "inter_hostname", "sport", "event_data", "syslog_severity", "log_id", "src_ip", "event_id", "src_port", "target_ip", "target_port", "log_data", "src_mac", "target_mac", "description", "descript", "uri"]
    }
  }

  if [cmd_line] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.process.command_line" => "%{cmd_line}"
      }
      on_error => "cmd_line_empty"
    }
  }

  if [userid] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.user.userid" => "%{userid}"
        "has_principal_user" => "true"
      }
      on_error => "userid_empty"
    }
  }

  if [not_json] and [grok_fail] {
    drop{
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  if [descript] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.description" => "%{descript}"
      }
      on_error => "descript_empty"
    }
  }

  if [ts] != "" {
    date {
      match => ["ts","MMM dd HH:mm:ss.SSS"]
      target => "event1.idm.read_only_udm.metadata.event_timestamp"
      rebase => true
      on_error => "invalid_timestamp"
    }
  }
  if [desc] != "" {
    mutate {
      gsub => ["desc",'\"','']
    }
    grok {
      match => {
        "desc" => [
          "%{DATA} user %{DATA:target_user} \\(%{DATA}%{IP:principal_user}, method %{DATA:method}\\)",
          "%{DATA} \\(%{IP:principal_user}\\) %{DATA} method %{DATA:method} user %{GREEDYDATA:target_user}"
          "%{DATA} \\( %{IP:principal_user} \\) for user %{GREEDYDATA:target_user}",
          "%{DATA} for user %{DATA:target_user} %{DATA} \\( %{IP:principal_user} \\)",
          "%{DATA} by %{IP:principal_user}"
        ]
      }
      on_error => "desc_grok_fail"
      overwrite => ["target_user", "principal_user", "method"]
    }
  }
  if [desc] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.description" => "%{desc}"
      }
      on_error => "desc_empty"
    }
  }
  if [target_user] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.user.userid" => "%{target_user}"
      }
      on_error => "target_user_empty"
    }
    if ![target_user_empty] {
      mutate {
        replace => {
          "has_target_user" => "true"
        }
      }
    }
  }
  if [principal_user] != "" {
    mutate {
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "principal_user"
        "event1.idm.read_only_udm.principal.asset.ip" => "principal_user"
      }
      on_error => "principal_user_empty"
    }
    if ![principal_user_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [uri] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.url" => "%{uri}"
      }
      on_error => "uri_empty"
    }
  }

  if [log_data] != "" {
    grok {
      match => {
        "log_data" => [
          "Request consumer chain is as follows: %{GREEDYDATA:request_consumer_chain}"
          "Response consumer chain is as follows: %{GREEDYDATA:response_consumer_chain}"
          "sock %{INT:sock} id %{INT:id} client %{IP:src_ip}:%{INT:src_port} server %{IP:target_ip}:%{INT:target_port} remote inner port %{INT:remote_inner_port} %{GREEDYDATA}"
          "(?P<description>QoS %{DATA}): src %{IP:src_ip}:%{INT:src_port}, dst %{IP:target_ip}:%{INT:target_port}, %{GREEDYDATA:kv_data}"
          "(?P<description>QoS %{DATA}): %{GREEDYDATA:kv_data}, (?<sec_description>more data%{GREEDYDATA})"
          "\\(clnt: %{IP}:%{INT} serv: %{IP}:%{INT} cfe: %{IP:cfe_ip}:%{INT:cfe_port} sfe: %{IP:sfe_ip}:%{INT:sfe_port}\\) %{GREEDYDATA:description}"
          "\\(locl: %{IP:local_ip}:%{INT:local_port} clnt: %{IP:src_ip}:%{INT:src_port} serv: %{IP:target_ip}:%{INT:target_port}\\) %{GREEDYDATA:description}"
          "%{DATA:description} client %{IP}:%{INT} server %{IP}:%{INT} cfe %{IP:cfe_ip}:%{INT:cfe_port} sfe %{IP:sfe_ip}:%{INT:sfe_port} app %{WORD:protocol}"
          "%{DATA:description} for %{IP:src_ip}:%{INT:src_port} -> %{IP:target_ip}:%{INT:target_port}"
          "%{DATA:description}, lport %{INT:lport}, rport %{INT:rport}, outer lport %{INT:outer_lport}, %{GREEDYDATA:configuration_parameters}"
          "%{DATA:description} %{IP:src_ip}:%{INT:src_port} -> %{IP:target_ip}:%{INT:target_port}"
          "%{DATA:description} client %{IP}:%{INT} server %{IP}:%{INT} cfe %{IP:cfe_ip}:%{INT:cfe_port} sfe %{IP:sfe_ip}:%{INT:sfe_port} inner_listen %{IP}:%{INT} inner_endpt %{IP}:%{INT} client connected: %{WORD:client_connected} %{GREEDYDATA}"
          "%{DATA:description} cfe %{IP:cfe_ip}:%{INT:cfe_port} sfe %{IP:sfe_ip}:%{INT:sfe_port}"
          "%{DATA:description} for peer %{IP}:%{INT} %{GREEDYDATA:kv_data}"
          "%{DATA:description} port: %{INT:port} transport = %{GREEDYDATA:transport}"
          "(?P<description>Received uncommon response) code: %{INT:response_code}"
          "(?P<description>Connection user identity detected) : %{DATA:user_name}"
          "%{GREEDYDATA:description}"
        ]
      }
      on_error => "log_data_grok_fail"
      overwrite => ["request_consumer_chain","response_consumer_chain","cfe_ip","cfe_port","sfe_port","sfe_ip","protocol","description","src_ip","target_ip","src_port","target_port","lport","rport","outer_lport","configuration_parameters","client_connected","kv_data","response_code","user_name","local_ip","sec_description","remote_inner_port","sock","id","transport","port"]
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data","wan classid ingress","wan_classid_ingress="]
    }
    mutate {
      gsub => ["kv_data","lan classid ingress","lan_classid_ingress="]
    }
    mutate {
      gsub => ["kv_data","wan classid","wan_classid="]
    }
    mutate {
      gsub => ["kv_data","lan classid","lan_classid="]
    }
    mutate {
      gsub => ["kv_data","wan tos","wan_tos="]
    }
    mutate {
      gsub => ["kv_data","lan tos","lan_tos="]
    }
    mutate {
      gsub => ["kv_data"," tos", " tos="]
    }
    mutate {
      gsub => ["kv_data","vlan", "vlan="]
    }
    mutate {
      gsub => ["kv_data","storeid",",storeid"]
    }
    mutate {
      gsub => ["kv_data","hostname",",hostname"]
    }
    kv {
      source => "kv_data"
      field_split => ","
      value_split => "="
      on_error => "kv_fail"
    }
  }

  if [log_timestamp] != "" {
    date {
      match => ["log_timestamp","TIMESTAMP_ISO8601"]
      target => "event1.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_timestamp"
    }
  }

  if [log_id] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_log_id" => "%{log_id}"
      }
      on_error => "no_log_id"
    }
  }

  if [event_data] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_event_type" => "%{event_data}"
      }
      on_error => "no_event_data"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  if [user_name] != "" {
    grok {
      match => {
        "user_name" => "%{EMAILADDRESS:user_name}"
      }
      on_error => "invalid_email"
      overwrite => ["user_name"]
    }
    if ![invalid_email] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.user.email_addresses" => "user_name"
        }
        on_error => "no_user_email"
      }
    }
    else {
      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.user.user_display_name" => "%{user_name}"
        }
        on_error => "no_user_name"
      }
    }
  }

  if [source][port] != "" {
    mutate {
      convert => {
        "source.port" => "integer"
      }
    }
    mutate {
      rename => {
        "source.port" => "event1.idm.read_only_udm.principal.port"
      }
    }
  }

  if [source][ip] != "" {
    mutate{
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "source.ip"
        "event1.idm.read_only_udm.principal.asset.ip" => "source.ip"
      }
      on_error => "source_ip_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  else if [log][source][address] != "" {
    mutate {
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "log.source.address"
        "event1.idm.read_only_udm.principal.asset.ip" => "log.source.address"
      }
      on_error => "source_address_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [destination][port] != "" {
    mutate {
      convert => {
        "destination.port" => "integer"
      }
    }

    mutate {
      rename => {
        "destination.port" => "event1.idm.read_only_udm.target.port"
      }
    }
  }

  if [destination][ip] != "" {
    mutate{
      merge => {
        "event1.idm.read_only_udm.target.ip" => "destination.ip"
        "event1.idm.read_only_udm.target.asset.ip" => "destination.ip"
      }
      on_error => "description_ip_empty"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  if [src_port] != "" {
    mutate {
      convert => {
        "src_port" => "integer"
      }
      on_error => "invalid_conversion"
    }
    mutate {
      rename => {
        "src_port" => "event1.idm.read_only_udm.principal.port"
      }
      on_error => "invalid_port"
    }
  }

  if [src_ip] != "" {
    mutate{
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "src_ip"
        "event1.idm.read_only_udm.principal.asset.ip" => "src_ip"
      }
      on_error => "invalid_ip"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [cfe_ip] != "" {
    mutate{
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "cfe_ip"
        "event1.idm.read_only_udm.principal.asset.ip" => "cfe_ip"
      }
      on_error => "invalid_ip"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [src_mac] != "" {
    mutate{
      merge => {
        "event1.idm.read_only_udm.principal.mac" => "src_mac"
      }
      on_error => "invalid_mac"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [target_port] != "" {
    mutate {
      convert => {
        "target_port" => "integer"
      }
      on_error => "invalid_conversion"
    }
    mutate {
      rename => {
        "target_port" => "event1.idm.read_only_udm.target.port"
      }
      on_error => "invalid_port"
    }
  }

  if [target_ip] != "" {
    mutate{
      merge => {
        "event1.idm.read_only_udm.target.ip" => "target_ip"
        "event1.idm.read_only_udm.target.asset.ip" => "target_ip"
      }
      on_error => "invalid_target_ip"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  if [sfe_ip] != "" {
    mutate{
      merge => {
        "event1.idm.read_only_udm.target.ip" => "sfe_ip"
        "event1.idm.read_only_udm.target.asset.ip" => "sfe_ip"
      }
      on_error => "invalid_target_ip"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  if [target_mac] != "" {
    mutate {
      merge => {
        "event1.idm.read_only_udm.target.mac" => "target_mac"
      }
      on_error => "invalid_target_mac"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.hostname" => "%{hostname}"
        "event1.idm.read_only_udm.target.asset.hostname" => "%{hostname}"
        "has_target" => "true"
      }
      on_error => "invalid_hostname"
    }
  }

  if [response_code] != "" {
    mutate {
      convert => {
        "response_code" => "integer"
      }
      on_error => "conversion_error"
    }
    mutate {
      rename => {
        "response_code" => "event1.idm.read_only_udm.network.http.response_code"
      }
      on_error => "no_response_code"
    }
  }

  for macs in host.mac {
    mutate {
      merge => {
        "event1.idm.read_only_udm.target.mac" => "macs"
      }
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  for ips in host.ip {
    mutate {
      merge => {
        "event1.idm.read_only_udm.target.ip" => "ips"
        "event1.idm.read_only_udm.target.asset.ip" => "ips"
      }
      on_error => "ips_empty"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }

  if [host][id] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.asset_id" => "Host Id: %{host.id}"
      }
    }
  }

  if [host][hostname] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.hostname" => "%{host.hostname}"
        "event1.idm.read_only_udm.target.asset.hostname" => "%{host.hostname}"
        "has_target" => "true"
      }
    }
  }

  if [host][architecture] != "" {
    mutate {
      replace => {
        "hardware.cpu_platform" => "%{host.architecture}"
      }
      merge => {
        "event1.idm.read_only_udm.target.asset.hardware" => "hardware"
      }
    }
  }

  if [host][os][platform] =~ "(?i)centos" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.platform" => "LINUX"
      }
    }
  }
  else if [host][os][platform] != "" {
    mutate {
      uppercase => ["host.os.platform"]
    }
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.platform" => "%{host.os.platform}"
      }
    }
  }

  if [host][os][version] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.platform_version" => "%{host.os.version}"
      }
    }
  }

  if [host][os][kernel] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.platform_patch_level" => "%{host.os.kernel}"
      }
    }
  }

  if [agent][id] != "" and [agent][type] != "" {
    mutate {
      replace => {
        "intermediary.application" => "%{agent.type} %{agent.version}"
      }
    }
  }

  if [agent][name] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{agent.name}"
      }
    }
  }

  if [inter_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_hostname}"
      }
      on_error => "invalid_hostname"
    }
  }

  if [agent][id] != "" and [agent][type] != "" {
    mutate {
      replace => {
        "intermediary.asset_id" => "%{agent.type}: %{agent.id}"
