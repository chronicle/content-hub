# Product: Semperis Directory Services Protector (DSP)
# Category: LDAP
# Supported Format: SYSLOG
# Reference: https://www.semperis.com/ds-protector/
# Last Updated: 2026-11-05
# Copyright 2026 Google SecOps

filter {

  mutate {
    replace => {
      "AttributeName" => ""
      "ClassName" => ""
      "DistinguishedName" => ""
      "event_type" => ""
      "ForestId" => ""
      "host" => ""
      "ip" => ""
      "IPv4" => ""
      "NameNode" => ""
      "ObjectModificationType" => ""
      "OperationSource" => ""
      "OperationType" => ""
      "OperationTarget" => ""
      "OperationResult" => ""
      "OperationTime" => ""
      "OriginatingTime" => ""
      "OriginatingServer" => ""
      "OriginatingUsers" => ""
      "StringValueFrom" => ""
      "TrusteeName" => ""
      "Type" => ""
      "principal_present" => "false"
      "principal_user_present" => "false"
      "target_present" => "false"
      "network_dns_present" => "false"
      "ACCESS_MASK" => ""
      "CLIENT_HOST" => ""
      "CLIENT_IP" => ""
      "COMPLETION_TIME" => ""
      "CREATION_TIME" => ""
      "FILETYPE_EXTENSION" => ""
      "FILE_ATTRIBUTES" => ""
      "FILE_SIZE" => ""
      "IMAGE_FILE_NAME" => ""
      "IS_DIRECTORY" => ""
      "IS_SUCCESS_EVENT" => ""
      "IS_TRANSACTION" => ""
      "IS_USB_EVENT" => ""
      "operation" => ""
      "ChangeId" => ""
      "PartitionNamingContext" => ""
      "AttributeModificationType" => ""
      "linkedValueDN" => ""
      "ValidUntil" => ""
      "OriginatingUserWorkstations" => ""
      "LAST_ACCESS_TIME" => ""
      "LAST_WRITE_TIME" => ""
      "LOCATION" => ""
      "MESSAGE" => ""
      "NEW_FILE_NAME" => ""
      "NEW_SHARE_PATH" => ""
      "OLD_SHARE_PATH" => ""
      "SERVERNAME" => ""
      "StringValueTo" => ""
      "kv_data" => ""
      "Ttl" => ""
      "TIME_GENERATED" => ""
      "USERNAME" => ""
      "USER_SID" => ""
      "app" => ""
      "sec_result" => ""
      "security_action" => ""
      "cli_ip" => ""
      "cli_port" => ""
      "json_data" => ""
      "ResultId" => ""
      "generation_time" => ""
      "sec_ind_name" => ""
      "sec_ind_desc" => ""
      "Result" => ""
      "result_message" => ""
      "Severity" => ""
      "target_app" => ""
      "Domains" => ""
      "dsp_link" => ""
      "sec_ind_found" => ""
      "Score" => ""
      "Weight" => ""
      "num_results" => ""
      "Remediation" => ""
      "likelihood" => ""
      "framework_tags" => ""
      "forest_name" => ""
      "Schedule" => ""
      "syslog_length" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "%{INT:syslog_length} %{TIMESTAMP_ISO8601} %{HOSTNAME:host} %{DATA:app} - - -\\s+\\[%{GREEDYDATA:operation}\\]"
        "%{INT:syslog_length} <%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:host} %{GREEDYDATA:operation}",
        "<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:host} %{GREEDYDATA:operation}",
        "%{INT:syslog_length} %{TIMESTAMP_ISO8601} %{HOSTNAME:host} %{GREEDYDATA:operation}"
      ]
    }
    overwrite => ["host", "operation", "app", "syslog_length"]
    on_error => "pattern_not_matched"
  }

  if [operation] != "" {
    if [operation] =~ "- Semperis.DSP.AdChanges" or [operation] =~ "- Semperis.DSP.OperationLog" {
      grok {
        match => {
          "operation" => "\\[%{GREEDYDATA:kv_data}\\]"
        }
        overwrite => ["kv_data"]
        on_error => "invalid_kv_data"
      }
      if [kv_data] != "" {
        mutate {
          gsub => ["kv_data", "^AdChanges@\\d+ ", ""]
        }
        mutate {
          gsub => ["kv_data", "^OperationLog@\\d+ ", ""]
        }
        kv {
          source => "kv_data"
          trim_value => '\"'
          on_error => "kv_failed"
        }
      }
    }
    else if [app] == "DSP" {
      mutate {
        gsub => ["operation", "\\]\\s+\\[", "^"]
      }
      kv {
        source => "operation"
        field_split => "^"
        value_split => "="
        on_error => "kv_failed_2"
      }
      if [TIME_GENERATED] != "" {
        date {
          match => ["TIME_GENERATED", "UNIX"]
          target => "event.idm.read_only_udm.metadata.event_timestamp"
          on_error => "invalid_time_generated"
        }
      }

      if [MESSAGE] == "Overwrite" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_WRITTEN"
            "event.idm.read_only_udm.metadata.description" => "Overwrite"
          }
        }
      }


      if [CLIENT_IP] not in ["", "-"] {
        grok {
          match => {
            "CLIENT_IP" => [
              "%{IP:cli_ip}\\%%{INT:cli_port}",
              "%{IP:cli_ip}"
            ]
          }
          overwrite => ["cli_ip", "cli_port"]
          on_error => "invalid_client_ip"
        }
        if ![invalid_client_ip] and [cli_ip] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "cli_ip"
              "event.idm.read_only_udm.principal.asset.ip" => "cli_ip"
            }
            on_error => "invalid_client_ip"
          }
          if not [invalid_client_ip] {
            mutate {
              replace => {
                "principal_present" => "true"
              }
            }
          }
        }
        if [cli_port] != "" {
          mutate {
            convert => {
              "cli_port" => "integer"
            }
            on_error => "invalid_cli_port_conversion"
          }
          mutate {
            rename => {
              "cli_port" => "event.idm.read_only_udm.principal.port"
            }
          }
        }
      }
      if [CLIENT_HOST] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{CLIENT_HOST}"
            "principal_present" => "true"
          }
          on_error => "invalid_client_host"
        }
      }
      if [USERNAME] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{USERNAME}"
            "principal_user_present" => "true"
          }
          on_error => "invalid_username"
        }
      }
      if [USER_SID] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.windows_sid" => "%{USER_SID}"
            "principal_user_present" => "true"
          }
          on_error => "invalid_user_sid"
        }
      }

      if [SERVERNAME] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{SERVERNAME}"
            "event.idm.read_only_udm.target.asset.hostname" => "%{SERVERNAME}"
            "target_present" => "true"
          }
          on_error => "invalid_servername"
        }
      }
      if [NEW_FILE_NAME] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{NEW_FILE_NAME}"
          }
          on_error => "invalid_new_file_name"
        }
      }
      if [OLD_SHARE_PATH] != "" {
        mutate {
          replace => {
            "old_share_path_label.key" => "OLD_SHARE_PATH"
            "old_share_path_label.value.string_value" => "%{OLD_SHARE_PATH}"
          }
          on_error => "invalid_old_share_path"
        }
        if ![invalid_old_share_path] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "old_share_path_label"
            }
            on_error => "invalid_old_share_path_merge"
          }
        }
      }
      if [NEW_SHARE_PATH] != "" {
        mutate {
          replace => {
            "new_share_path.key" => "NEW_SHARE_PATH"
            "new_share_path.value.string_value" => "%{NEW_SHARE_PATH}"
          }
          on_error => "invalid_new_share_path"
        }
        if ![invalid_new_share_path] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "new_share_path"
            }
            on_error => "invalid_new_share_path_merge"
          }
        }
      }
      if [LOCATION] != "" {
        mutate {
          replace => {
            "location.key" => "LOCATION"
            "location.value.string_value" => "%{LOCATION}"
          }
          on_error => "invalid_location"
        }
        if ![invalid_location] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "location"
            }
            on_error => "invalid_location_merge"
          }
        }
      }
      if [FILE_SIZE] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.size" => "%{FILE_SIZE}"
          }
          on_error => "invalid_file_size"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.target.file.size" => "uinteger"
          }
          on_error => "invalid_file_size_conversion"
        }
      }
      if [FILE_ATTRIBUTES] != "" {
        mutate {
          replace => {
            "file_attributes.key" => "FILE_ATTRIBUTES"
            "file_attributes.value.string_value" => "%{FILE_ATTRIBUTES}"
          }
          on_error => "invalid_file_attributes"
        }
        if ![invalid_file_attributes] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "file_attributes"
            }
            on_error => "invalid_file_attributes_merge"
          }
        }
      }
      if [IS_TRANSACTION] != "" {
        mutate {
          replace => {
            "is_transaction.key" => "IS_TRANSACTION"
            "is_transaction.value.string_value" => "%{IS_TRANSACTION}"
          }
          on_error => "invalid_is_transaction"
        }
        if ![invalid_is_transaction] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "is_transaction"
            }
            on_error => "invalid_is_transaction_merge"
          }
        }
      }
      if [IS_USB_EVENT] != "" {
        mutate {
          replace => {
            "is_usb_event.key" => "IS_USB_EVENT"
            "is_usb_event.value.string_value" => "%{IS_USB_EVENT}"
          }
          on_error => "invalid_is_usb_event"
        }
        if ![invalid_is_usb_event] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "is_usb_event"
            }
            on_error => "invalid_is_usb_event_merge"
          }
        }
      }
      if [FILETYPE_EXTENSION] != "" {
        mutate {
          replace => {
            "file_type_extension.key" => "FILETYPE_EXTENSION"
            "file_type_extension.value.string_value" => "%{FILETYPE_EXTENSION}"
          }
          on_error => "invalid_file_type_extension"
        }
        if ![invalid_file_type_extension] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "file_type_extension"
            }
            on_error => "invalid_file_type_extension_merge"
          }
        }
      }
      if [CREATION_TIME] != "" {
        mutate {
          replace => {
            "creation_time.key" => "CREATION_TIME"
            "creation_time.value.string_value" => "%{CREATION_TIME}"
          }
          on_error => "invalid_creation_time"
        }
        if ![invalid_creation_time] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "creation_time"
            }
            on_error => "invalid_creation_time_merge"
          }
        }
      }
      if [LAST_WRITE_TIME] != "" {
        mutate {
          replace => {
            "last_write_time.key" => "LAST_WRITE_TIME"
            "last_write_time.value.string_value" => "%{LAST_WRITE_TIME}"
          }
          on_error => "invalid_last_write_time"
        }
        if ![invalid_last_write_time] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "last_write_time"
            }
            on_error => "invalid_last_write_time_merge"
          }
        }
      }
      if [LAST_ACCESS_TIME] != "" {
        mutate {
          replace => {
            "last_access_time.key" => "LAST_ACCESS_TIME"
            "last_access_time.value.string_value" => "%{LAST_ACCESS_TIME}"
          }
          on_error => "invalid_last_access_time"
        }
        if ![invalid_last_access_time] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "last_access_time"
            }
            on_error => "invalid_last_access_time_merge"
          }
        }
      }
      if [COMPLETION_TIME] != "" {
        mutate {
          replace => {
            "completion_time.key" => "COMPLETION_TIME"
            "completion_time.value.string_value" => "%{COMPLETION_TIME}"
          }
          on_error => "invalid_completion_time"
        }
        if ![invalid_completion_time] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "completion_time"
            }
            on_error => "invalid_completion_time_merge"
          }
        }
      }
      if [ACCESS_MASK] != "" {
        mutate {
          replace => {
            "access_mask.key" => "ACCESS_MASK"
            "access_mask.value.string_value" => "%{ACCESS_MASK}"
          }
          on_error => "invalid_access_mask"
        }
        if ![invalid_access_mask] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "access_mask"
            }
            on_error => "invalid_access_mask_merge"
          }
        }
      }
      if [IMAGE_FILE_NAME] not in ["", "-"] {
        mutate {
          replace => {
            "image_file_name.key" => "IMAGE_FILE_NAME"
            "image_file_name.value.string_value" => "%{IMAGE_FILE_NAME}"
          }
          on_error => "invalid_image_file_name"
        }
        if ![invalid_image_file_name] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "image_file_name"
            }
            on_error => "invalid_image_file_name_merge"
          }
        }
      }
      if [IS_SUCCESS_EVENT] == "true" {
        mutate {
          replace => {
            "security_action" => "ALLOW"
          }
        }
      }
    }
    else {
      grok {
        match => {
          "operation" => "^Semperis\\.DSP\\s+(?P<json_data>\\{.*\\})$"
        }
        overwrite => ["json_data"]
        on_error => "invalid_json_data"
      }
      if [json_data] != "" {
        mutate {
          gsub => ["json_data", "href=\"", "href=\\\""]
        }
        json {
          source => "json_data"
          array_function => "split_columns"
          on_error => "json_failed"
        }
      }
      mutate {
        gsub => ["operation", " \\[", "#",]
      }
      mutate {
        gsub => ["operation", "\\]", "",]
      }
      kv {
        source => "operation"
        value_split => " "
        field_split => "#"
      }
    }
  }

  # Mapping intermediary, prinicipal host
  if [host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{host}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [OriginatingServer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{OriginatingServer}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{OriginatingServer}"
        "principal_present" => "true"
      }
      on_error => "invalid_originating_server"
    }
  }
  # end of Host mapping

  # Mapping of product object id
  if [ForestId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id" => "%{ForestId}"
        "principal_user_present" => "true"
      }
      on_error => "invalid_forestid"
    }
  }

  # Mapping resource name, resource sub type
  if [OperationTarget] != "" {
    mutate {
      replace => {
        ClassName => "%{OperationTarget}"
      }
    }
  }

  if [ClassName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{ClassName}"
      }
    }
  }
  if [AttributeName] != "" and [AttributeName] != "isDeleted" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{AttributeName}"
      }
    }
  }
  # End of resource mappings

  # Mapping user related elements in Group Identifies
  if [DistinguishedName] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.group_identifiers" => "DistinguishedName"
      }
    }
  }

  # Value contains IP address, and some other details
  if [StringValueFrom] != "" {
    kv {
      source => "StringValueFrom"
      value_split => "="
      field_split => ";"
    }
  }

  # Extracting IP and mapping of IP
  if [IPv4] != "" {
    mutate {
      replace => {
        ip => "%{IPv4}"
      }
    }
  }

  if [OperationSource] != "" {
    grok {
      match => {
        "OperationSource" => "%{IP:ip}"
      }
      overwrite => ["ip"]
      on_error => "not_an_ip"
    }
  }

  if [ip] != "" {
    mutate {
      gsub => ["ip", "\\\\", "",]
    }
    mutate {
      gsub => ["ip",",",""]
    }
    grok {
      match => {
        "ip" => "%{IP:ip}"
      }
      overwrite => ["ip"]
      on_error => "not_an_ip"
    }
    if not [not_an_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ip"
          "event.idm.read_only_udm.principal.asset.ip" => "ip"
        }
        on_error => "invalid_ip"
      }
      if not [invalid_ip] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
    }
  }
  # End of IP mapping

  # Mapping username
  if [TrusteeName] != "" {
    mutate {
      replace => {
        OriginatingUsers => "%{TrusteeName}"
      }
    }
  }
  if [OriginatingUsers] != "" {
    grok {
      match => {
        "OriginatingUsers" => "%{GREEDYDATA}\\\\%{GREEDYDATA:OriginatingUsers}"
      }
      overwrite => ["OriginatingUsers"]
      on_error => "invalid_originating_users"
    }
    mutate {
      gsub => ["OriginatingUsers", ";" ""]
    }

    # for user login user id should be mapped to target elements
    if [OperationType] == "LoginADSM" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{OriginatingUsers}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{OriginatingUsers}"
        }
      }
    }
  }
  # End of user name mapping

  # Mapping of description and evebt type based on action performed
  if [OperationType] != "" {
    mutate {
      replace => {
        ObjectModificationType => "%{OperationType}"
      }
    }
  }

  if [ObjectModificationType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{ObjectModificationType}"
      }
    }
    if [ObjectModificationType] == "CreateObject" and [OriginatingUsers] != "" {
      mutate {
        replace => {
          event_type => "RESOURCE_CREATION"
        }
      }
    }
    else if [ObjectModificationType] == "ModifyObject" and [OriginatingUsers] != "" {
      if [AttributeName] != "" and [AttributeName] =~ "Password" {
        mutate {
          replace => {
            event_type => "USER_CHANGE_PASSWORD"
          }
        }
      }
      else {
        mutate {
          replace => {
            event_type => "RESOURCE_WRITTEN"
          }
        }
      }
    }
    else if [ObjectModificationType] == "DeleteObject" and [OriginatingUsers] != "" {
      mutate {
        replace => {
          event_type => "RESOURCE_DELETION"
        }
      }
    }
    else if [ObjectModificationType] == "LoginADSM" and [OriginatingUsers] != "" {
      mutate {
        replace => {
          event_type => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    }
    else if [ObjectModificationType] == "OperationRequest" and [OriginatingUsers] != "" {
      mutate {
        replace => {
          event_type => "RESOURCE_WRITTEN"
        }
      }
    }
  }
  # End of description, event mapping

  # Mapping sec result mapping
  if [OperationResult] != "" {
    if [OperationResult] =~ "Granted" {
      mutate {
        replace => {
          "sec_result.summary" => "%{RequestedAction}"
          "security_action" => "ALLOW"
        }
      }
    }
    else if [OperationResult] =~ "Denied" {
      mutate {
        replace => {
          "sec_result.summary" => "%{RequestedAction}"
          "security_action" => "BLOCK"
        }
      }
    }
  }
  if [AttributeModificationType] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{AttributeModificationType}"
      }
      on_error => "invalid_attribute_modification_type"
    }
  }
  if [json_data] != "" {
    if ![json_failed] {
      mutate {
        convert => {
          "ResultId" => "string"
        }
        on_error => "result_id_convert_failed"
      }
      mutate {
        convert => {
          "Score" => "string"
        }
        on_error => "Score_convert_failed"
      }
      mutate {
        convert => {
          "Weight" => "string"
        }
        on_error => "Weight_convert_failed"
      }
      mutate {
        convert => {
          "Number of results" => "string"
        }
        on_error => "num_results_convert_failed"
      }
      mutate {
        replace => {
          "generation_time" => "%{Generation time}"
        }
        on_error => "no_generation_time"
      }
      mutate {
        replace => {
          "sec_ind_name" => "%{Security indicator name}"
        }
        on_error => "no_sec_ind_name"
      }
      mutate {
        replace => {
          "sec_ind_desc" => "%{Security indicator description}"
        }
        on_error => "no_sec_ind_desc"
      }
      mutate {
        replace => {
          "result_message" => "%{Result Message}"
        }
        on_error => "no_result_message"
      }
      mutate {
        replace => {
          "target_app" => "%{Target}"
        }
        on_error => "no_target_app"
      }
      mutate {
        replace => {
          "dsp_link" => "%{DSPLink}"
        }
        on_error => "no_dsp_link"
      }
      mutate {
        replace => {
          "sec_ind_found" => "%{Security indicator found}"
        }
        on_error => "no_sec_ind_found"
      }
      mutate {
        replace => {
          "num_results" => "%{Number of results}"
        }
        on_error => "no_num_results"
      }
      mutate {
        replace => {
          "likelihood" => "%{Likelihood of compromise}"
        }
        on_error => "no_likelihood"
      }
      mutate {
        replace => {
          "framework_tags" => "%{Security framework tags}"
        }
        on_error => "no_framework_tags"
      }
      mutate {
        replace => {
          "forest_name" => "%{Forest name}"
        }
        on_error => "no_forest_name"
      }
      if [generation_time] != "" {
        date {
          match => ["generation_time", "ISO8601", "RFC3339"]
          target => "event.idm.read_only_udm.metadata.event_timestamp"
          on_error => "invalid_generation_time"
        }
      }
      if [ResultId] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{ResultId}"
          }
          on_error => "invalid_result_id"
        }
      }
      if [sec_ind_name] != "" {
        mutate {
          replace => {
            "sec_result.rule_name" => "%{sec_ind_name}"
          }
          on_error => "invalid_sec_indicator_name"
        }
      }
      if [sec_ind_desc] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{sec_ind_desc}"
          }
          on_error => "invalid_sec_indicator_desc"
        }
      }
      if [Result] != "" {
        mutate {
          replace => {
            "sec_result.action_details" => "%{Result}"
          }
          on_error => "invalid_result"
        }
        if [Result] =~ "^(?i)pass$" {
          mutate {
            replace => {
              "security_action" => "ALLOW"
            }
          }
        } else if [Result] =~ "^(?i)fail$" {
          mutate {
            replace => {
              "security_action" => "BLOCK"
            }
          }
        }
      }
      if [result_message] != "" {
        mutate {
          replace => {
            "sec_result.summary" => "%{result_message}"
          }
          on_error => "invalid_result_message"
        }
      }
      if [Severity] != "" {
        mutate {
          replace => {
            "sec_result.severity_details" => "%{Severity}"
          }
          on_error => "invalid_Severity_details"
        }
        if [Severity] =~ "^(?i)critical$" {
          mutate {
            replace => {
              "sec_result.severity" => "CRITICAL"
            }
          }
        } else if [Severity] =~ "^(?i)high$" {
          mutate {
            replace => {
              "sec_result.severity" => "HIGH"
            }
          }
        } else if [Severity] =~ "^(?i)medium$" {
          mutate {
            replace => {
              "sec_result.severity" => "MEDIUM"
            }
          }
        } else if [Severity] =~ "^(?i)low$" {
          mutate {
            replace => {
              "sec_result.severity" => "LOW"
            }
          }
        } else if [Severity] =~ "^(?i)informational$" {
          mutate {
            replace => {
              "sec_result.severity" => "INFORMATIONAL"
            }
          }
        }
      }
      if [target_app] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.application" => "%{target_app}"
          }
          on_error => "invalid_target_app"
        }
      }
      if [Domains] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.administrative_domain" =>
              "%{Domains}"
          }
          on_error => "invalid_Domains"
        }
      }
      if [dsp_link] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.url_back_to_product" =>
              "%{dsp_link}"
          }
          on_error => "invalid_dsp_link"
        }
      }
      if [sec_ind_found] != "" {
        mutate {
          replace => {
            "sec_ind_found_df.key" => "Security indicator found"
            "sec_ind_found_df.value" => "%{sec_ind_found}"
          }
          on_error => "invalid_sec_ind_found"
        }
        if ![invalid_sec_ind_found] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "sec_ind_found_df"
            }
            on_error => "invalid_sec_ind_found_df"
          }
        }
      }
      if [Score] != "" {
        mutate {
          replace => {
            "Score_df.key" => "Score"
            "Score_df.value" => "%{Score}"
          }
          on_error => "invalid_Score"
        }
        if ![invalid_Score] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "Score_df"
            }
            on_error => "invalid_Score_df"
          }
        }
      }
      if [Weight] != "" {
        mutate {
          replace => {
            "Weight_df.key" => "Weight"
            "Weight_df.value" => "%{Weight}"
          }
          on_error => "invalid_Weight"
        }
        if ![invalid_Weight] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "Weight_df"
            }
            on_error => "invalid_Weight_df"
          }
        }
      }
      if [num_results] != "" {
        mutate {
          replace => {
            "num_results_df.key" => "Number of results"
            "num_results_df.value" => "%{num_results}"
          }
          on_error => "invalid_num_results"
        }
        if ![invalid_num_results] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "num_results_df"
            }
            on_error => "invalid_num_results_df"
          }
        }
      }
      if [Remediation] != "" {
        mutate {
          replace => {
            "Remediation_df.key" => "Remediation"
            "Remediation_df.value" => "%{Remediation}"
          }
          on_error => "invalid_Remediation"
        }
        if ![invalid_Remediation] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "Remediation_df"
            }
            on_error => "invalid_Remediation_df"
          }
        }
      }
      if [likelihood] != "" {
        mutate {
          replace => {
            "likelihood_df.key" => "Likelihood of compromise"
            "likelihood_df.value" => "%{likelihood}"
          }
          on_error => "invalid_likelihood"
        }
        if ![invalid_likelihood] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "likelihood_df"
            }
            on_error => "invalid_likelihood_df"
          }
        }
      }
      if [framework_tags] != "" {
        mutate {
          replace => {
            "framework_tags_df.key" => "Security framework tags"
            "framework_tags_df.value" => "%{framework_tags}"
          }
          on_error => "invalid_framework_tags"
        }
        if ![invalid_framework_tags] {
          mutate {
            merge => {
              "sec_result.detection_fields" => "framework_tags_df"
            }
            on_error => "invalid_framework_tags_df"
          }
        }
      }
      if [forest_name] != "" {
        mutate {
          replace => {
            "forest_name_label.key" => "Forest name"
            "forest_name_label.value.string_value" => "%{forest_name}"
          }
          on_error => "invalid_forest_name"
        }
        if ![invalid_forest_name] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "forest_name_label"
            }
            on_error => "invalid_forest_name_label"
          }
        }
      }
      if [Schedule] != "" {
        mutate {
          replace => {
            "Schedule_label.key" => "Schedule"
            "Schedule_label.value.string_value" => "%{Schedule}"
          }
          on_error => "invalid_Schedule"
        }
        if ![invalid_Schedule] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "Schedule_label"
            }
            on_error => "invalid_Schedule_label"
          }
        }
      }
    }
  }
  if [syslog_length] != "" {
    mutate {
      replace => {
        "syslog_length_df.key" => "Syslog length"
        "syslog_length_df.value" => "%{syslog_length}"
      }
      on_error => "invalid_syslog_length"
    }
    if ![invalid_syslog_length] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "syslog_length_df"
        }
        on_error => "invalid_syslog_length_df"
      }
    }
  }

  if [security_action] != "" {
    mutate {
      merge => {
        "sec_result.action" => "security_action"
      }
      on_error => "sec_result_action_merge_failed"
    }
  }
  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
      on_error => "sec_result_merge_failed"
    }
  }
  # end of sec result mapping

  # End of Description and Event type
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }
  else if [principal_present] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else if [principal_user_present] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  # Mapping timestamp
  if [OperationTime] != "" {
    mutate {
      replace => {
        OriginatingTime => "%{OperationTime}"
      }
    }
  }

  if [OriginatingTime] != "" {
    mutate {
      gsub => ["OriginatingTime", "[.].*", ""]
    }

    date {
      match => ["OriginatingTime","yyyyMMddHHmmss","yyyy-MM-ddTHH:mm:ss", "yyyy-MM-ddTHH:mm:ss.SSSZ"]
      on_error => "invalid_timestamp"
    }
  }
  # end of timestamp mapping

  # Mapping of DNS elements
  if [Type] != "" {
    if [NameNode] != "" {
      mutate {
        replace => {
          "answers.name" => "%{NameNode}"
        }
      }
    }
    if [Ttl] != "" {
      mutate {
        replace => {
          "answers.ttl" =>  "%{Ttl}"
        }
      }
    }
    if [Type] =~ "DNS_TYPE_A"{
      mutate {
        replace => {
          "answers.type" => "1"
        }
      }
    }
    else if [Type] =~ "DNS_TYPE_PTR"{
      mutate {
        replace => {
          "answers.type" => "12"
        }
      }
    }
    # to replace \\
    mutate {
      gsub => ["StringValueFrom", "\\\\", "",]
    }
    # to replace [ brackets
    mutate {
      gsub => ["StringValueFrom", "\\[", "",]
    }
    mutate {
      replace => {
        "answers.data" => "%{StringValueFrom}"
      }
      merge => {
        "event.idm.read_only_udm.network.dns.answers" => "answers"
      }
      convert => {
        "answers.type" => "uinteger"
        "answers.ttl" => "uinteger"
      }
    }
  }
  # End of DNS
  if [ChangeId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{ChangeId}"
      }
      on_error => "invalid_change_id"
    }
  }
  if [PartitionNamingContext] != "" {
    mutate {
      replace => {
        "partition_naming_context_label.key" => "PartitionNamingContext"
        "partition_naming_context_label.value" => "%{PartitionNamingContext}"
      }
      on_error => "invalid_partition_naming_context"
    }
    if ![invalid_partition_naming_context] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "partition_naming_context_label"
        }
        on_error => "invalid_partition_naming_context_label"
      }
    }
  }
  if [linkedValueDN] != "" {
    mutate {
      replace => {
        "linked_value_dn_label.key" => "linkedValueDN"
        "linked_value_dn_label.value.string_value" => "%{linkedValueDN}"
      }
      on_error => "invalid_linked_value_dn"
    }
    if ![invalid_linked_value_dn] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "linked_value_dn_label"
        }
        on_error => "invalid_linked_value_dn_label"
      }
    }
  }
  if [ValidUntil] != "" {
    mutate {
      replace => {
        "valid_until_label.key" => "ValidUntil"
        "valid_until_label.value.string_value" => "%{ValidUntil}"
      }
      on_error => "invalid_valid_until"
    }
    if ![invalid_valid_until] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "valid_until_label"
        }
        on_error => "invalid_valid_until_label"
      }
    }
  }
  if [OriginatingUserWorkstations] != "" {
    mutate {
      replace => {
        "originating_user_workstations_label.key" => "OriginatingUserWorkstations"
        "originating_user_workstations_label.value.string_value" => "%{OriginatingUserWorkstations}"
      }
      on_error => "invalid_originating_user_workstations"
    }
    if ![invalid_originating_user_workstations] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "originating_user_workstations_label"
        }
        on_error => "invalid_originating_user_workstations_label"
      }
    }
  }
  if [StringValueFrom] != "" {
    mutate {
      replace => {
        "string_value_from_label.key" => "StringValueFrom"
        "string_value_from_label.value.string_value" => "%{StringValueFrom}"
      }
      on_error => "invalid_string_value_from"
    }
    if ![invalid_string_value_from] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "string_value_from_label"
        }
        on_error => "invalid_string_value_from_label"
      }
    }
  }
  if [StringValueTo] != "" {
    mutate {
      replace => {
        "string_value_to_label.key" => "StringValueTo"
        "string_value_to_label.value.string_value" => "%{StringValueTo}"
      }
      on_error => "invalid_string_value_to"
    }
    if ![invalid_string_value_to] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "string_value_to_label"
        }
        on_error => "invalid_string_value_to_label"
      }
    }
  }

  # Common elements
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "SEMPERIS_DSP"
      "event.idm.read_only_udm.metadata.vendor_name" => "SEMPERIS"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
