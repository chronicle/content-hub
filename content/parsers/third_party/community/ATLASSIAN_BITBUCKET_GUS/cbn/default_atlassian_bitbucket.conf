        mutate {
          replace => {
            "security_result.confidence" => "MEDIUM_CONFIDENCE"
          }
        }
      }
    }

    if [threatInfo][classification] != "" {
      mutate {
        replace => {
          "classification" => "%{threatInfo.classification}"
          "sec_result_category_details" => "%{threatInfo.classification}"
        }
      }
    }


    if [classification] in ["Malware","Ransomware","Linux.Malware","OSX.Malware","Manual"] {
      mutate {
        replace => {
          "security_result_category" => "SOFTWARE_MALICIOUS"
        }
      }
    }
    else if [classification] in ["Trojan","miner","Virus","Malicious PDF","Worm","Rootkit","Infostealer","Lateral Movement","Generic.Heuristic",
      "Downloader","Backdoor","Hacktool","Browser","Dialer","Installer","Packed","Network","Spyware","Interactive shell","Remote shell"] {
      mutate {
        replace => {
          "security_result_category" => "SOFTWARE_SUSPICIOUS"
        }
      }
    }
    else if [classification] in ["Lateral Movement","Remote shell"] {
      mutate {
        replace => {
          "security_result_category" => "NETWORK_SUSPICIOUS"
        }
      }
    }
    else if [classification] == "Exploit" {
      mutate {
        replace => {
          "security_result_category" => "EXPLOIT"
        }
      }
    }
    else if [classification] == "Application Control" {
      mutate {
        replace => {
          "security_result_category" => "UNKNOWN_CATEGORY"
        }
      }
    }

    if [sec_result_category_details] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "sec_result_category_details"
        }
      }
    }

    if [security_result_category] != "" {
      mutate {
        merge => {
          "security_result.category" => "security_result_category"
        }
      }
    }

    if [indicators][0][description] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{indicators.0.description}"
        }
      }
    }

    mutate {
      replace => {
        "security_summary" => "%{classification} %{analystVerdictDescription} %{threatName} %{maliciousProcessArguments} %{originatorProcess}"
      }
      on_error => "security_summary_not_set"
    }
    if [security_summary] not in ["","    "] {
      mutate {
        replace => {
          "security_result.summary" => "%{security_summary}"
        }
        on_error => "summary_not_set"
      }
    }

    if [summary] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{summary}"
        }
      }
    }

  }
  else {
    grok {
      match => {
        "message" => [
          "^%{DATA:raw_client_ips} \\| %{DATA:access_protocol} \\| %{DATA:access_request_id} \\| %{DATA:access_user} \\| %{DATA:access_time} \\| %{DATA:access_request} \\| %{DATA:access_headers} \\| %{DATA:access_status} \\| %{DATA:access_bytes_in} \\| %{DATA:access_bytes_out} \\| %{DATA:access_auth} \\| %{DATA:access_duration} \\| %{DATA:access_session_id} \\|$"
          '^%{DATA:access_time} %{WORD:app_log_level}%{SPACE}\\[%{DATA:app_thread}\\] %{DATA:access_user} %{DATA:app_request_id} %{WORD:access_session_id} %{DATA:raw_client_ips} \\"%{WORD:http_method} %{DATA:app_http_url} %{DATA:http_version}\\" %{DATA:app_logger} %{GREEDYDATA:app_message}$',
          '^%{DATA:access_time} %{WORD:app_log_level}%{SPACE}\\[%{DATA:app_thread}\\] %{DATA:access_user} %{DATA:app_request_id} %{DATA:raw_client_ips} \\"%{WORD:http_method} %{DATA:app_http_url} %{DATA:http_version}\\" %{DATA:app_logger} %{GREEDYDATA:app_message}$',
          '^%{DATA:access_time} %{WORD:app_log_level}%{SPACE}\\[%{DATA:app_thread}\\] %{GREEDYDATA:app_message}$'
        ]
      }
      overwrite => [ "http_method", "http_version", "raw_client_ips", "access_protocol", "access_request_id", "access_user", "access_time", "access_request", "access_headers", "access_status", "access_bytes_in", "access_bytes_out", "access_auth", "access_duration", "access_session_id", "app_log_level", "app_thread", "app_request_id", "app_http_url", "app_logger", "app_message"]
      on_error => "message_grok_failure"
    }
    if ![message_grok_failure] {
      if [access_time] != "" {
        date {
          match => ["access_time", "yyyy-MM-dd HH:mm:ss,SSS"]
          target => "event.idm.read_only_udm.metadata.event_timestamp"
          on_error => "access_timestamp_parse_error"
        }
      }

      if [raw_client_ips] not in ["-", ""] {
        mutate {
          split => {
            source => "raw_client_ips"
            separator => ","
            target => "ip_list"
          }
          on_error => "access_raw_ips_split_error"
        }
        for index, ip_item in ip_list {
          grok {
            match => {
              "ip_item" => [
                "%{IP:ip_item}"
              ]
            }
            overwrite => ["ip_item"]
            on_error => "access_ip_item_grok_failed"
          }
          if ![access_ip_item_grok_failed] {
            mutate {
              merge => {
                "principal.ip" => "ip_item"
                "principal.asset.ip" => "ip_item"
              }
              on_error => "access_principal_asset_ip_merge_error"
            }
            if ![access_principal_asset_ip_merge_error] {
              mutate {
                replace => {
                  "has_principal_ip_host" => "true"
                }
                on_error => "access_has_principal_ip_replace_error"
              }
            }
          }
        }
      }

      if [access_user] not in ["-", ""] {
        mutate {
          replace => {
            "principal.user.userid" => "%{access_user}"
            "has_principal_user" => "true"
          }
          on_error => "access_user_replace_error"
        }
        if [access_user] =~ "^.+@.+$" {
          mutate {
            merge => {
              "principal.user.email_addresses" => "access_user"
            }
            on_error => "access_user_email_merge_error"
          }
        }
      }

      if [access_request_id] not in ["-", ""] {
        mutate {
          replace => {
            "request_id_label.key" => "request_id"
            "request_id_label.value.string_value" => "%{access_request_id}"
          }
          on_error => "access_request_id_label_error"
        }
        if ![access_request_id_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "request_id_label"
            }
            on_error => "access_request_id_merge_error"
          }
        }
      }

      if [access_session_id] not in ["-", ""] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{access_session_id}"
          }
          on_error => "access_session_id_replace_error"
        }
      }

      if [access_auth] not in ["-", ""] {
        mutate {
          replace => {
            "auth_context_label.key" => "auth_context"
            "auth_context_label.value.string_value" => "%{access_auth}"
          }
          on_error => "access_auth_context_label_error"
        }
        if ![access_auth_context_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "auth_context_label"
            }
            on_error => "access_auth_context_merge_error"
          }
        }
      }

      if [access_duration] not in ["-", ""] {
        mutate {
          replace => {
            "duration_label.key" => "duration_ms"
            "duration_label.value.string_value" => "%{access_duration}"
          }
          on_error => "access_duration_label_error"
        }
        if ![access_duration_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "duration_label"
            }
            on_error => "access_duration_merge_error"
          }
        }
      }

      if [access_bytes_in] not in ["-", ""] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.received_bytes" => "%{access_bytes_in}"
          }
          on_error => "access_bytes_in_replace_error"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.network.received_bytes" => "uinteger"
          }
          on_error => "access_bytes_in_convert_error"
        }
      }

      if [access_bytes_out] not in ["-", ""] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.sent_bytes" => "%{access_bytes_out}"
          }
          on_error => "access_bytes_out_replace_error"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
          }
          on_error => "access_bytes_out_convert_error"
        }
      }

      if [access_protocol] =~ "(?i)http" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.ip_protocol" => "TCP"
          }
        }
        if [access_protocol] =~ "(?i)https" {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.application_protocol" => "HTTPS"
            }
          }
        }
        else {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.application_protocol" => "HTTP"
            }
          }
        }

        grok {
          match => {
            "access_request" => [
              '^\\"%{WORD:http_method} %{DATA:http_url} %{DATA:http_version}\\"$',
              '^\\"%{WORD:http_method} %{DATA:http_url}\\"$'
            ]
          }
          overwrite => ["http_method", "http_url", "http_version"]
          on_error => "access_http_request_grok_failed"
        }
        grok {
          match => {
            "access_headers" => '^\\"%{DATA:http_referer}\\" \\"%{DATA:http_user_agent}\\"$'
          }
          overwrite => ["http_referer", "http_user_agent"]
          on_error => "access_http_headers_grok_failed"
        }
        if ![access_http_headers_grok_failed] {
          if [http_referer] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.network.http.referral_url" => "%{http_referer}"
              }
              on_error => "access_http_referer_error"
            }
          }
          if [http_user_agent] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.network.http.user_agent" => "%{http_user_agent}"
              }
              on_error => "access_http_user_agent_error"
            }
          }
        }

        if [access_status] not in ["-", ""] {
          mutate {
            convert => {
              "access_status" => "string"
            }
            on_error => "access_http_status_string_convert_error"
          }
          mutate {
            replace => {
              "event.idm.read_only_udm.network.http.response_code" => "%{access_status}"
            }
            on_error => "access_http_status_rename_error"
          }
          mutate {
            convert => {
              "event.idm.read_only_udm.network.http.response_code" => "integer"
            }
            on_error => "access_http_status_convert_error"
          }
        }
      }
      else if [access_protocol] =~ "(?i)ssh" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.ip_protocol" => "TCP"
            "event.idm.read_only_udm.network.application_protocol" => "SSH"
          }
        }

        grok {
          match => {
            "access_request" => [
              "^SSH - %{DATA:ssh_command} '%{DATA:repo_path}'$",
              "^SSH - %{GREEDYDATA:ssh_command}$"
            ]
          }
          overwrite => ["ssh_command", "repo_path"]
          on_error => "access_ssh_request_grok_failed"
        }
        if ![access_ssh_request_grok_failed] {
          if [access_request] != "" {
            mutate {
              replace => {
                "principal.process.command_line" => "%{access_request}"
              }
              on_error => "access_ssh_command_line_error"
            }
          }
          if [ssh_command] != "" {
            mutate {
              replace => {
                "principal.process.file.full_path" => "%{ssh_command}"
              }
              on_error => "access_ssh_command_error"
            }
          }
          if [repo_path] != "" {
            mutate {
              replace => {
                "target.resource.name" => "%{repo_path}"
                "target.resource.resource_type" => "REPOSITORY"
                "has_target_resource" => "true"
              }
              on_error => "access_ssh_repo_path_error"
            }
          }
        }
        grok {
          match => {
            "access_headers" => '^\\"%{DATA:ssh_client_version}\\"$'
          }
          overwrite => ["ssh_client_version"]
          on_error => "access_ssh_headers_grok_failed"
        }
        if ![access_ssh_headers_grok_failed] {
          mutate {
            replace => {
              "ssh_client_label.key" => "ssh_client_version"
              "ssh_client_label.value.string_value" => "%{ssh_client_version}"
            }
            on_error => "access_ssh_client_label_error"
          }
          if ![access_ssh_client_label_error] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "ssh_client_label"
              }
              on_error => "access_ssh_client_merge_error"
            }
          }
        }

        if [access_status] not in ["-", ""] {
          mutate {
            replace => {
              "ssh_status_label.key" => "status_code"
              "ssh_status_label.value.string_value" => "%{access_status}"
            }
            on_error => "access_ssh_status_label_error"
          }
          if ![access_ssh_status_label_error] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "ssh_status_label"
              }
              on_error => "access_ssh_status_merge_error"
            }
          }
        }
      }
      if [http_method] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.http.method" => "%{http_method}"
          }
          on_error => "access_http_method_error"
        }
      }
      if [http_url] != "" {
        mutate {
          replace => {
            "target.url" => "%{http_url}"
          }
          on_error => "access_http_url_error"
        }
      }
      if [http_version] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol_version" => "%{http_version}"
          }
          on_error => "access_http_version_error"
        }
        if [http_version] =~ "(?i)HTTPS" {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.application_protocol" => "HTTPS"
            }
          }
        }
        else if [http_version] =~ "(?i)HTTP" {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.application_protocol" => "HTTP"
            }
          }
        }
      }
      if [app_log_level] != "" {
        mutate {
          replace => {
            "security_result.severity_details" => "%{app_log_level}"
          }
          on_error => "app_severity_details_error"
        }
        if [app_log_level] in ["WARN", "WARNING"] {
          mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
          }
        }
        else if [app_log_level] in ["ERROR", "ERR", "FATAL", "CRITICAL"] {
          mutate {
            replace => {
              "security_result.severity" => "ERROR"
            }
          }
        }
        else if [app_log_level] in ["INFO", "INFORMATIONAL"] {
          mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
          }
        }
        else if [app_log_level] in ["DEBUG", "TRACE"] {
          mutate {
            replace => {
              "security_result.severity" => "LOW"
            }
          }
        }
      }

      if [app_thread] != "" {
        mutate {
          replace => {
            "thread_name_label.key" => "thread_name"
            "thread_name_label.value.string_value" => "%{app_thread}"
          }
          on_error => "app_thread_label_error"
        }
        if ![app_thread_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "thread_name_label"
            }
            on_error => "app_thread_merge_error"
          }
        }
      }


      if [app_request_id] not in ["-", ""] {
        mutate {
          replace => {
            "request_id_label.key" => "app_request_id"
            "request_id_label.value.string_value" => "%{app_request_id}"
          }
          on_error => "app_request_id_label_error"
        }
        if ![app_request_id_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "request_id_label"
            }
            on_error => "app_request_id_merge_error"
          }
        }
      }

      if [app_http_url] != "" {
        mutate {
          replace => {
            "target.url" => "%{app_http_url}"
            "has_target_resource" => "true"
          }
          on_error => "app_http_url_error"
        }
      }

      if [app_logger] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_event_type" => "%{app_logger}"
          }
          on_error => "app_logger_error"
        }
      }

      if [app_message] != "" {
        mutate {
          replace => {
            "security_result.summary" => "%{app_message}"
          }
          on_error => "app_message_error"
        }
      }
    }
    else {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "app_security_result_merge_error"
    }
  }
  if [has_principal_ip_host] == "true" and [has_target_ip_host] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_UNCATEGORIZED"
      }
    }
  }
  else if [has_target_resource] == "true" and ([has_user] == "true" or [has_principal_ip_host] == "true") {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_principal_ip_host] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_error"
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
