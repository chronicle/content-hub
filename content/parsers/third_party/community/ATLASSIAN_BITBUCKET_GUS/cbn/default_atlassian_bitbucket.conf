        if ![level_label_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "level_label"
            }
            on_error => "level_merge_error"
          }
        }
      }
    }

    if [affectedObjects] != "" {
      mutate {
        replace => {
          "has_target_resource" => "true"
        }
      }
      for index, value in affectedObjects {
        mutate {
          replace => {
            "id_label" => ""
            "name_label" => ""
            "type_label" => ""
          }
        }
        mutate {
          convert => {
            "index" => "string"
          }
          on_error => "index_error_affectedObjects"
        }

        mutate {
          replace => {
            "id_label.value" => "%{value.id}"
          }
          on_error => "empty_id"
        }
        if ![empty_id] {
          mutate {
            replace => {
              "id_label.key" => "ID_%{index}"
            }
            on_error => "id_key_error"
          }
          mutate {
            merge => {
              "target.resource.attribute.labels" => "id_label"
            }
            on_error => "id_label_merge_error"
          }
        }

        mutate {
          replace => {
            "name_label.value" => "%{value.name}"
          }
          on_error => "empty_name"
        }
        if ![empty_name] {
          mutate {
            replace => {
              "name_label.key" => "Name_%{index}"
            }
            on_error => "name_key_error"
          }
          mutate {
            merge => {
              "target.resource.attribute.labels" => "name_label"
            }
            on_error => "name_label_merge_error"
          }
        }

        mutate {
          replace => {
            "type_label.value" => "%{value.type}"
          }
          on_error => "empty_type_label_error"
        }
        if ![empty_type_label_error] {
          mutate {
            replace => {
              "type_label.key" => "Type_%{index}"
            }
            on_error => "type_key_error"
          }
          mutate {
            merge => {
              "target.resource.attribute.labels" => "type_label"
            }
            on_error => "type_merge_error"
          }
        }
      }
