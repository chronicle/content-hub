            merge => {
              "principal.resource.attribute.labels" => "nameI18nKey_label"
            }
            on_error => "nameI18nKey_label_merge_error_extraAttributes"
          }
        }
      }
    }
    if [method] != "" {
      mutate {
        replace => {
          "method_label.key" => "method"
          "method_label.value.string_value" => "%{method}"
        }
        on_error => "method_label_error"
