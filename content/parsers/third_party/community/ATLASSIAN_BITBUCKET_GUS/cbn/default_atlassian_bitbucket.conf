  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if ![not_json] {
    if [timestamp][epochSecond] != "" {
      mutate {
        convert => {
          "timestamp.epochSecond" => "string"
        }
        on_error => "epoch_second_string_error"
      }
      mutate {
        replace => {
          "epoch_second" => "%{timestamp.epochSecond}"
        }
        on_error => "no_epoch_second"
      }
      if ![no_epoch_second] and [epoch_second] != "" {
        date {
          match => ["epoch_second", "UNIX"]
          target => "event.idm.read_only_udm.metadata.event_timestamp"
          on_error => "no_event_timestamp"
        }
      }
    }
    if [timestamp][nano] != "" {
      mutate {
        convert => {
          "timestamp.nano" => "string"
        }
        on_error => "nano_string_error"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_timestamp.nanos" => "%{timestamp.nano}"
        }
        on_error => "nano_replace_error"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.metadata.event_timestamp.nanos" => "integer"
        }
        on_error => "nano_convert_error"
      }
    }

    if [author][id] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{author.id}"
          "has_principal_user" => "true"
          "has_user" => "true"
        }
        on_error => "author_id_missing"
      }
    }

    if [author][name] != "" {
      mutate {
        replace => {
          "principal.user.user_display_name" => "%{author.name}"
          "has_principal_user" => "true"
          "has_user" => "true"
        }
        on_error => "author_name_missing"
      }
      if [author][name] =~ "^.+@.+$" {
        mutate {
          merge => {
            "principal.user.email_addresses" => "author.name"
          }
          on_error => "author_email_missing"
        }
        if ![author_email_missing] {
          mutate {
            replace => {
              "has_principal_user" => "true"
              "has_user" => "true"
            }
          }
        }
      }
    }

    if [author][type] != "" {
      mutate {
        replace => {
          "authortype_label.key" => "Author Type"
          "authortype_label.value" => "%{author.type}"
        }
        on_error => "author_type_label_error"
      }
      if ![author_type_label_error] {
        mutate {
          merge => {
            "principal.resource.attribute.labels" => "authortype_label"
          }
          on_error => "author_type_missing"
        }
      }
    }

    if [source] != "" {
      grok {
        match => {
          "source" => "%{IP:src}"
        }
        overwrite => ["src"]
        on_error => "no_source_ip"
      }
      if ![no_source_ip] {
        mutate {
          merge => {
            "principal.ip" => "src"
            "principal.asset.ip" => "src"
          }
          on_error => "principal_ip_merge_error"
        }
        mutate {
          replace => {
            "has_principal_ip_host" => "true"
          }
        }
      }
    }
    if [auditType] != "" {
      if [auditType][area] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_event_type" => "%{auditType.area}"
          }
          on_error => "product_event_type_missing"
        }
      }
      if [auditType][category] != "" {
        mutate {
          merge => {
            "security_result.category_details" => "auditType.category"
          }
          on_error => "auditType_category_merge_error"
        }
      }
      if [auditType][categoryI18nKey] != "" {
        mutate {
          merge => {
            "security_result.category_details" => "auditType.categoryI18nKey"
          }
          on_error => "auditType_categoryI18nKey_merge_error"
        }
      }
      if [auditType][action] != "" {
        mutate {
          replace => {
            "security_result.action_details" => "%{auditType.action}"
          }
          on_error => "auditType_action_missing"
        }
      }
      if [auditType][actionI18nKey] != "" {
        mutate {
          replace => {
            "actionI18nKey_label.key" => "actionI18nKey"
            "actionI18nKey_label.value.string_value" => "%{auditType.actionI18nKey}"
          }
          on_error => "actionI18nKey_label_error"
        }
