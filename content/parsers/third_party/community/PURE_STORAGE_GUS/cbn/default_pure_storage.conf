# Product: PURE_STORAGE
# Category: Data Storage
# Supported Format: SYSLOG + KV
# Reference: NA
# Last Updated: 2024-10-01
# Copyright 2024 Chronicle LLC

filter {
    mutate {
    replace => {
      "security_result" => ""
      "event_type" => ""
      "metadata" => ""
      "principal" => ""
      "additional" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "target" => ""
      "network" => ""
      "timestamp" => ""
      "host_name" => ""
      "message_id" => ""
      "kv_data" => ""
      "array_name" => ""
      "Controller" => ""
      "Interface" => ""
      "Module" => ""
      "Session" => ""
      "User" => ""
      "Location" => ""
      "Sublocation" => ""
      "Action" => ""
      "Method" => ""
      "Result" => ""
      "Description" => ""
      "json_data" => ""
      "payload.effective_used" => ""
      "payload.total_extents" => ""
      "payload.legacy_effective_used" => ""
      "payload.legacy_total_extents" => ""
      "payload.data_reduction" => ""
      "payload.array_id" => ""
      "signature" => ""
      "payload.version" => ""
      "payload.product" => ""
    }
  }

  grok {
    match => {
      "message" => ["%{SYSLOGTIMESTAMP:timestamp} %{DATA:host_name} %{DATA}\\[%{DATA}\\]: \\(%{DATA}: %{DATA:message_id}\\) %{GREEDYDATA:kv_data}",
                   "%{SYSLOGTIMESTAMP:timestamp} %{DATA:host_name} %{DATA}\\[%{DATA}\\]: %{GREEDYDATA:json_data}"
                  ]
    }
    on_error => "grok_error"
    overwrite => ["timestamp","host_name","message_id","kv_data","json_data"]
  }

  if [host_name] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host_name}"
        "principal.asset.hostname" => "%{host_name}"
        "has_principal" => "true"
      }
      on_error => "host_name_error"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "MMM  d HH:mm:ss"]
      target => "metadata.event_timestamp"
      rebase => true
      on_error => "timestamp_error"
    }
  }
  if [message_id] != "" {
    mutate {
      convert => {
        "message_id" => "string"
      }
      on_error => "message_id_error"
    }
    mutate {
      replace => {
        "message_id_label.key" => "message_id"
        "message_id_label.value.string_value" => "%{message_id}"
      }
      on_error => "message_id_error"
    }
    if ![message_id_error] {
      mutate {
        merge => {
          "additional.fields" => "message_id_label"
        }
        on_error => "message_id_merge_error"
      }
    }
  }
  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data","Array name","array_name"]
    }
    mutate {
      gsub => ["kv_data","UTC Time","utc_time"]
    }
     mutate {
      gsub => ["kv_data"," ([a-zA-Z_]+): ","#$1: "]
    }
    mutate {
      gsub => ["kv_data","\'",""]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => ": "
      on_error => "kv_data_error"
    }
  }
  if [json_data] != "" {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "invalid_json"
    }
  }
  if [payload][effective_used] != "" {
    mutate {
      convert => {
        "payload.effective_used" => "string"
      }
      on_error => "effective_used_error"
    }
    mutate {
      replace => {
        "effective_used_label.key" => "effective_used"
        "effective_used_label.value.string_value" => "%{payload.effective_used}"
      }
      on_error => "effective_used_error"
    }
    if ![effective_used_error] {
      mutate {
        merge => {
          "additional.fields" => "effective_used_label"
        }
        on_error => "effective_used_merge_error"
      }
    }
  }
  if [payload][total_extents] != "" {
    mutate {
      convert => {
        "payload.total_extents" => "string"
      }
      on_error => "total_extents_error"
    }
    mutate {
      replace => {
        "total_extents_label.key" => "total_extents"
        "total_extents_label.value.string_value" => "%{payload.total_extents}"
      }
      on_error => "total_extents_error"
    }
    if ![total_extents_error] {
      mutate {
        merge => {
          "additional.fields" => "total_extents_label"
        }
        on_error => "total_extents_merge_error"
      }
    }
  }
  if [payload][legacy_effective_used] != "" {
    mutate {
      convert => {
        "payload.legacy_effective_used" => "string"
      }
      on_error => "legacy_effective_used_error"
    }
    mutate {
      replace => {
        "legacy_effective_used_label.key" => "legacy_effective_used"
        "legacy_effective_used_label.value.string_value" => "%{payload.legacy_effective_used}"
      }
      on_error => "legacy_effective_used_error"
    }
    if ![legacy_effective_used_error] {
      mutate {
        merge => {
          "additional.fields" => "legacy_effective_used_label"
        }
        on_error => "legacy_effective_used_merge_error"
      }
    }
  }
  if [payload][legacy_total_extents] != "" {
    mutate {
      convert => {
        "payload.legacy_total_extents" => "string"
      }
      on_error => "legacy_total_extents_error"
    }
    mutate {
      replace => {
        "legacy_total_extents_label.key" => "legacy_total_extents"
        "legacy_total_extents_label.value.string_value" => "%{payload.legacy_total_extents}"
      }
      on_error => "legacy_total_extents_error"
    }
    if ![legacy_total_extents_error] {
      mutate {
        merge => {
          "additional.fields" => "legacy_total_extents_label"
        }
        on_error => "legacy_total_extents_merge_error"
      }
    }
  }
  if [payload][data_reduction] != "" {
    mutate {
      convert => {
        "payload.data_reduction" => "string"
      }
      on_error => "data_reduction_error"
    }
    mutate {
      replace => {
        "data_reduction_label.key" => "data_reduction"
        "data_reduction_label.value.string_value" => "%{payload.data_reduction}"
      }
      on_error => "data_reduction_error"
    }
    if ![data_reduction_error] {
      mutate {
        merge => {
          "additional.fields" => "data_reduction_label"
        }
        on_error => "data_reduction_merge_error"
      }
    }
  }
  if [payload][version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{payload.version}"
      }
      on_error => "version_error"
    }
  }
  if [payload][product] != "" {
    mutate {
      replace => {
        "product_label.key" => "product"
        "product_label.value.string_value" => "%{payload.product}"
      }
      on_error => "product_error"
    }
    if ![product_error] {
      mutate {
        merge => {
          "additional.fields" => "product_label"
        }
        on_error => "product_merge_error"
      }
    }
  }
  if [payload][array_id] != "" {
    mutate {
      convert => {
        "payload.array_id" => "string"
      }
      on_error => "array_id_error"
    }
    mutate {
      replace => {
        "array_id_label.key" => "array_id"
        "array_id_label.value.string_value" => "%{payload.array_id}"
      }
      on_error => "array_id_error"
    }
    if ![array_id_error] {
      mutate {
        merge => {
          "additional.fields" => "array_id_label"
        }
        on_error => "array_id_merge_error"
      }
    }
  }
  if [signature] != "" {
    mutate {
      replace => {
        "signature_label.key" => "signature"
        "signature_label.value.string_value" => "%{signature}"
      }
      on_error => "signature_error"
    }
    if ![signature_error] {
      mutate {
        merge => {
          "additional.fields" => "signature_label"
        }
        on_error => "signature_merge_error"
      }
    }
  }
  if [Session] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{Session}"
      }
      on_error => "session_id_error"
    }
  }
  if [User] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{User}"
      }
      on_error => "user_id_error"
    }
  }
  if [Location] != "" {
    grok {
      match => {
        "Location" => ["%{IP:Location}"]
      }
      on_error => "location_error"
      overwrite => ["Location"]
    }
    if ![location_error] {
      mutate {
        merge => {
          "principal.ip" => "Location"
          "principal.asset.ip" => "Location"
        }
        on_error => "location_merge_error"
      }
      if ![location_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [Sublocation] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{Sublocation}"
      }
      on_error => "sublocation_error"
    }
    mutate {
      replace => {
        "network.http.parsed_user_agent" => "%{Sublocation}"
      }
      on_error => "sublocation_error"
    }
    mutate {
      convert => {
        "network.http.parsed_user_agent" => "parseduseragent"
      }
      on_error => "sublocation_error"
    }
  }
  if [Action] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{Action}"
      }
      on_error => "action_error"
    }
  }
  if [Method] != "" {
    mutate {
      replace => {
        "method_label.key" => "Method"
        "method_label.value.string_value" => "%{Method}"
      }
      on_error => "method_error"
    }
    if ![method_error] {
      mutate {
        merge => {
          "additional.fields" => "method_label"
        }
        on_error => "method_merge_error"
      }
    }
  }
  if [Result] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{Result}"
      }
      on_error => "result_error"
    }
  }
  if [Description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{Description}"
      }
      on_error => "description_error"
    }
  }
  if [array_name] != "" {
    mutate {
      replace => {
        "array_name_label.key" => "array_name"
        "array_name_label.value.string_value" => "%{array_name}"
      }
      on_error => "array_name_error"
    }
    if ![array_name_error] {
      mutate {
        merge => {
          "additional.fields" => "array_name_label"
        }
        on_error => "array_name_merge_error"
      }
    }
  }
  if [Controller] != "" {
    mutate {
      replace => {
        "controller_label.key" => "Controller"
        "controller_label.value.string_value" => "%{Controller}"
      }
      on_error => "controller_error"
    }
    if ![controller_error] {
      mutate {
        merge => {
          "additional.fields" => "controller_label"
        }
        on_error => "controller_merge_error"
      }
    }
  }
  if [Interface] != "" {
    mutate {
      replace => {
        "interface_label.key" => "Interface"
        "interface_label.value.string_value" => "%{Interface}"
      }
      on_error => "interface_error"
    }
    if ![interface_error] {
      mutate {
        merge => {
          "additional.fields" => "interface_label"
        }
        on_error => "interface_merge_error"
      }
    }
  }
  if [Module] != "" {
    mutate {
      replace => {
        "module_label.key" => "Module"
        "module_label.value.string_value" => "%{Module}"
      }
      on_error => "module_error"
    }
    if ![module_error] {
      mutate {
        merge => {
          "additional.fields" => "module_label"
        }
        on_error => "module_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "metadata.product_name" => "Pure Storage"
      "metadata.vendor_name" => "Pure Storage"
    }
  }
  if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
