      "dmarc_from_domain_val" => ""
      "spf_verdict_val" => ""
      "spf_designator_val" => ""
      "spf_received_hop_val" => ""
      "message_source_id_label" => ""
      "start_label" => ""
      "end_label" => ""
      "key_label" => ""
      "action_name" => ""
      "action_status" => ""
      "action_type" => ""
      "link_visible_val" => ""
      "headers_from_email_domain_val" => ""
      "headers_from_email_root_domain_val" => ""
      "headers_from_email_sld_val" => ""
      "headers_from_email_subdomain_val" => ""
      "headers_from_email_tld_val" => ""
      "headers_from_email_valid_val" => ""
      "has_email" => ""
      "has_principal" => ""
      "data_message_id" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "invalid_json"
  }
  if [events] != "" {
    for eventdata in events {
      mutate {
        replace => {
          "event" => ""
          "security_result" => ""
          "canonical_id" => ""
          "external_id" => ""
          "message_id" => ""
          "mailbox_external_id" => ""
          "mailbox_id" => ""
          "message_source_id" => ""
          "external_id_label" => ""
          "mailbox_external_id_label" => ""
          "mailbox_id_label" => ""
          "canonical_id_label" => ""
        }
      }
      if [eventdata][created_at] != "" {
        date {
          match => ["eventdata.created_at","ISO8601"]
          target => "event.idm.read_only_udm.metadata.event_timestamp"
          on_error => "no_timestamp"
        }
      }
      for flagged in eventdata.data.flagged_rules {
        mutate {
          replace => {
            "security_result1" => ""
            "flagged_id" => ""
            "flagged_name" => ""
            "flagged_severity" => ""
          }
        }
        mutate {
          replace => {
            "flagged_id" => "%{flagged.id}"
          }
          on_error => "no_flagged_id"
        }
        if [flagged_id] != "" {
          mutate {
            replace => {
              "security_result1.rule_id" => "%{flagged_id}"
            }
            on_error => "no_rule_id"
          }
        }
        mutate {
          replace => {
            "flagged_name" => "%{flagged.name}"
          }
          on_error => "no_rule_name"
        }
        if [flagged_name] != "" {
          mutate {
            replace => {
              "security_result1.rule_name" => "%{flagged_name}"
            }
            on_error => "no_rule_name"
          }
        }
        mutate {
          replace => {
            "flagged_severity" => "%{flagged.severity}"
          }
          on_error => "no_severity"
        }
        if [flagged_severity] not in ["null",""] {
          mutate {
            uppercase => ["flagged_severity"]
          }
          if [flagged_severity] in ["CRITICAL","HIGH","LOW","INFORMATIONAL"] {
            mutate {
              replace => {
                "security_result1.severity" => "%{flagged_severity}"
              }
              on_error => "no_severity"
            }
          }
        }
        mutate {
          replace => {
            "tags_label.value" => ""
          }
        }
        for index,tag in flagged.tags {
          mutate {
            convert => {
              "index" => "string"
            }
          }
          mutate {
            replace => {
              "tag_label" => ""
            }
          }
          if [tag] != "" {
            mutate {
              replace => {
                "tag_label.key" => "tag_%{index}"
                "tag_label.value" => "%{tag}"
              }
              on_error => "no_tag_label"
            }
            if ![no_tag_label] {
              mutate {
                merge => {
                  "security_result1.detection_fields" => "tag_label"
                }
                on_error => "no_tag_label"
              }
            }
          }
        }
        if [security_result1] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.security_result" => "security_result1"
            }
            on_error => "sec_res_empty"
          }
        }
      }
      mutate {
        replace => {
          "canonical_id" => "%{eventdata.data.message.canonical_id}"
        }
        on_error => "no_canonical_id"
      }
      if [canonical_id] != "" {
        mutate {
          replace => {
            "canonical_id_label.key" => "canonical_id"
            "canonical_id_label.value.string_value" => "%{canonical_id}"
          }
          on_error => "no_canonical_id_label"
        }
        if [canonical_id_label] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "canonical_id_label"
            }
            on_error => "no_canonical_id_label"
          }
        }
      }
      mutate {
        replace => {
          "external_id" => "%{eventdata.data.message.external_id}"
        }
        on_error => "no_external_id"
      }
      if [external_id] != "" {
        mutate {
          replace => {
            "external_id_label.key" => "external_id"
            "external_id_label.value.string_value" => "%{external_id}"
          }
          on_error => "no_external_id_label"
        }
        if [external_id_label] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "external_id_label"
            }
            on_error => "no_external_id_label"
          }
        }
      }
      mutate {
        replace => {
          "message_id" => "%{eventdata.data.message.id}"
        }
        on_error => "no_message_id"
      }
      if [message_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{message_id}"
          }
          on_error => "no_message_id_label"
        }
      }
      mutate {
        replace => {
          "mailbox_external_id" => "%{eventdata.data.message.mailbox.external_id}"
        }
        on_error => "no_mailbox_external_id"
      }
      if [mailbox_external_id] != "" {
        mutate {
          replace => {
            "mailbox_external_id_label.key" => "mailbox_external_id"
            "mailbox_external_id_label.value.string_value" => "%{mailbox_external_id}"
          }
          on_error => "no_mailbox_external_id_label"
        }
        if [external_id_label] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "mailbox_external_id_label"
            }
            on_error => "no_mailbox_external_id_label"
          }
        }
      }
      mutate {
        replace => {
          "mailbox_id" => "%{eventdata.data.message.mailbox.id}"
        }
        on_error => "no_mailbox_id"
      }
      if [mailbox_id] != "" {
        mutate {
          replace => {
            "mailbox_id_label.key" => "mailbox_id"
            "mailbox_id_label.value.string_value" => "%{mailbox_id}"
          }
          on_error => "no_mailbox_id_label"
        }
        if [mailbox_id_label] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "mailbox_id_label"
            }
            on_error => "no_mailbox_id_label"
          }
        }
      }
      mutate {
        replace => {
          "message_source_id" => "%{eventdata.data.message.message_source_id}"
        }
        on_error => "no_message_source_id"
      }
      if [message_source_id] != "" {
        mutate {
          replace => {
            "message_source_id_label.key" => "message_source_id"
            "message_source_id_label.value.string_value" => "%{message_source_id}"
          }
          on_error => "no_message_source_id_label"
        }
        if [message_source_id_label] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "message_source_id_label"
            }
            on_error => "no_message_source_id_label"
          }
        }
      }
      if [eventdata][type] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_event_type" => "%{eventdata.type}"
          }
          on_error => "no_event_type"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.vendor_name" => "Sublime"
          "event.idm.read_only_udm.metadata.product_name" => "Security"
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
  else if [headers] != "" and [body] != "" {
    mutate {
      replace => {
        "headers_date" => "%{headers.date}"
      }
      on_error => "no_headers_date"
    }
    if [headers_date] != "" {
      date {
        match => ["headers_date", "EEE, dd MMM yyyy HH:mm:ss Z", "yyyy-MM-ddTHH:mm:ss"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error=>"date_match_failed"
      }
    }
    mutate {
      replace => {
        "headers_from_email" => "%{headers.from.email.email}"
      }
      on_error => "no_headers_from_email"
    }
    if [headers_from_email] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.email.from" => "%{headers_from_email}"
        }
        on_error => "headers_from_email_empty"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "headers_from_email"
        }
        on_error => "headers_from_email_merge_failed"
      }
    }

    for toemail in recipients.to {
      mutate {
        replace => {
          "toemail_email" => "%{toemail.email.email}"
        }
        on_error => "no_toemail_email"
      }
      if [toemail_email] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.network.email.to" => "toemail_email"
          }
          on_error => "toemail_merge_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.email_addresses" => "toemail_email"
          }
          on_error => "target_email_merge_failed"
        }
      }
    }

    for ccemail in recipients.cc {
      mutate {
        replace => {
          "ccemail_email" => "%{ccemail.email.email}"
        }
        on_error => "no_ccemail_email"
      }
      if [ccemail_email] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.email_addresses" => "ccemail_email"
          }
          on_error => "ccemail_merge_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.network.email.cc" => "ccemail_email"
          }
          on_error => "target_ccemail_merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "subject_email" => "%{subject.subject}"
      }
      on_error => "no_subject_email"
    }
    if [subject_email] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.network.email.subject" => "subject_email"
        }
        on_error => "no_subject"
      }
    }
    mutate {
      replace => {
        "message_id_email" => "%{headers.message_id}"
      }
      on_error => "no_message_id_email"
    }
    if [message_id_email] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.email.mail_id" => "%{message_id_email}"
        }
        on_error => "no_message_id"
      }
    }
    mutate {
      replace => {
        "return_path_email" => "%{headers.return_path.email}"
      }
      on_error => "no_return_path_email"
    }
    if [return_path_email] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.email.reply_to" => "%{return_path_email}"
        }
        on_error => "no_return_path"
      }
    }
    mutate {
      replace => {
        "spf_ip" => "%{headers.auth_summary.spf.details.client_ip.ip}"
      }
      on_error => "no_spf_ip"
    }
    if [spf_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "spf_ip"
        }
        on_error => "no_spf_ip_merge_failed"
      }
    }

    mutate {
      replace => {
        "dmarc_policy" => "%{headers.auth_summary.dmarc.details.policy}"
      }
      on_error => "no_dmarc_policy"
    }
    if [dmarc_policy] != "" {
      mutate {
        replace => {
          "dmarc_policy_label.key" => "dmarc_published_policy"
          "dmarc_policy_label.value" => "%{dmarc_policy}"
        }
        on_error => "dmarc_policy_label_empty"
      }
      if ![dmarc_policy_label_empty] {
        mutate {
          merge => {
            "security_result2.detection_fields" => "dmarc_policy_label"
          }
          on_error => "dmarc_policy_label_merge_failed"
        }
      }
    }

    for hop in headers.hops {
      mutate {
        replace => {
          "host" => ""
          "ip" => ""
        }
      }
      mutate {
        replace => {
          "hop_source" => "%{hop.received.source.raw}"
        }
        on_error => "no_hop_source"
      }
      if [hop_source] != "" {
        grok {
          match => {
            "hop_source" => [
              "%{HOSTNAME:host} \\(%{HOSTNAME}[^ ]* \\[%{IP:ip}\\]\\)"
            ]
          }
          overwrite => ["host", "ip"]
          on_error => "grok_failed_source"
        }
        mutate {
          replace => {
            "intermediary_source" => ""
          }
        }
        if ![grok_failed_source] {
          mutate {
            replace => {
              "intermediary_source.hostname" => "%{host}"
            }
            on_error => "no_host"
          }
          mutate {
            merge => {
              "intermediary_source.ip" => "ip"
            }
            on_error => "no_ip"
          }
        } else {
          mutate {
            replace => {
              "intermediary_source.hostname" => "%{hop_source}"
            }
            on_error => "no_source_raw"
          }
        }
        if [intermediary_source] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.intermediary" => "intermediary_source"
            }
            on_error => "merge_intermediary_source_failed"
          }
        }
      }
      mutate {
        replace => {
          "hop_server" => "%{hop.received.server.raw}"
        }
        on_error => "no_hop_server"
      }
      if [hop_server] != "" {
        mutate {
          replace => {
            "intermediary_server" => ""
          }
        }
        mutate {
          replace => {
            "intermediary_server.hostname" => "%{hop_server}"
          }
          on_error => "no_server_raw"
        }
        if [intermediary_server] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.intermediary" => "intermediary_server"
            }
            on_error => "merge_intermediary_server_failed"
          }
        }
      }
    }
    for link in body.links {
      mutate {
        replace => {
          "link_url" => "%{link.href_url.url}"
        }
        on_error => "no_link_url"
      }
      if [link_url] != "" {
        mutate {
          replace => {
            "about.url" => "%{link_url}"
          }
          on_error => "link_url_merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "meta_id" => "%{_meta.id}"
      }
      on_error => "meta_id_empty"
    }
    if [meta_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{meta_id}"
        }
        on_error => "meta_id_error"
      }
    }
    mutate {
      replace => {
