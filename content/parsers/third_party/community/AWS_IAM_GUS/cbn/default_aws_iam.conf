# Product: Identity and Access Management (IAM)
# Category: AWS Specific
# Supported Format: JSON
# Reference: https://docs.aws.amazon.com/IAM/latest/APIReference
# Last Updated: 2023-12-14
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    gsub => ["message", "[\\r\\n\\t]*", ""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  mutate {
    replace => {
      "token_metadata.product_name" => "AWS IAM"
      "token_metadata.vendor_name" => "AWS"
      "token_entity.resource.attribute.cloud.environment" =>
      "AMAZON_WEB_SERVICES"
    }
  }

  mutate {
    replace => {
      "token_entity.user.product_object_id" => "%{UserID}"
    }
    on_error => "no_userid"
  }

  mutate {
    replace => {
      "token_entity.user.userid" => "%{UserName}"
    }
    on_error => "no_user_name"
  }

  mutate {
    replace => {
      "token_entity.resource.name" => "%{Arn}"
    }
    on_error => "no_arn"
  }

  date {
    match => ["PasswordLastUsed", "ISO8601"]
    target => "token_entity.user.last_login_time"
    on_error => "format_not_match"
  }

  mutate {
    replace => {
      "role.name" => "%{RoleName}"
    }
    on_error => "no_role_name"
  }

  mutate {
    replace => {
      "role.description" => "%{Description}"
    }
    on_error => "no_role_description"
  }

  if ![no_role_name] or ![no_role_description] {
    mutate {
      merge => {
        "token_entity.resource.attribute.roles" => "role"
      }
      on_error => "_"
    }
  }

  mutate {
    replace => {
      "token_entity.resource.product_object_id" => "%{RoleID}"
    }
    on_error => "no_role_id"
  }

  mutate {
    replace => {
      "token_entity.location.name" => "%{RoleLastUsed.Region}"
    }
    on_error => "_"
  }

  mutate {
    replace => {
      "permission.name" => "%{AssumeRolePolicyDocument}"
    }
    on_error => "no_assume_role_policy"
  }

  if ![no_assume_role_policy] and [AssumeRolePolicyDocument] != "" {
    mutate {
      merge => {
        "token_entity.resource.attribute.permissions" => "permission"
      }
    }
  }

  mutate {
    convert => {
      "MaxSessionDuration" => "string"
    }
    on_error => "_"
  }

  mutate {
    replace => {
      "max_session_duration_label.value" => "%{MaxSessionDuration}"
    }
    on_error => "no_data"
  }

  if ![no_data] and [MaxSessionDuration] != "" {
    mutate {
      replace => {
        "max_session_duration_label.key" => "max_session_duration"
      }
    }

    mutate {
      merge => {
        "token_entity.resource.attribute.labels" => "max_session_duration_label"
      }
    }
  }

  mutate {
    replace => {
      "last_used_date_label.value" => "%{RoleLastUsed.LastUsedDate}"
    }
    on_error => "no_data"
  }

  if ![no_data] and [RoleLastUsed][LastUsedDate] != "" {
    mutate {
      replace => {
        "last_used_date_label.key" => "role_last_used_date"
      }
    }

    mutate {
      merge => {
        "token_entity.resource.attribute.labels" => "last_used_date_label"
      }
    }
  }

  mutate {
    replace => {
      "permissions_boundary_arn_label.value" =>
      "%{PermissionsBoundary.PermissionsBoundaryArn}"
    }
    on_error => "no_data"
  }

  if ![no_data] and [PermissionsBoundary][PermissionsBoundaryArn] != "" {
    mutate {
      replace => {
        "permissions_boundary_arn_label.key" => "permissions_boundary_arn"
      }
    }

    mutate {
      merge => {
        "token_entity.resource.attribute.labels" =>
        "permissions_boundary_arn_label"
      }
    }
  }

  mutate {
    replace => {
      "permissions_boundary_type_label.value" =>
      "%{PermissionsBoundary.PermissionsBoundaryType}"
    }
    on_error => "no_data"
  }

  if ![no_data] and [PermissionsBoundary][PermissionsBoundaryType] != "" {
    mutate {
      replace => {
        "permissions_boundary_type_label.key" => "permissions_boundary_type"
      }
    }

    mutate {
      merge => {
        "token_entity.resource.attribute.labels" =>
        "permissions_boundary_type_label"
      }
    }
  }

  mutate {
    convert => {
      "IsTruncated" => "string"
    }
    on_error => "_"
  }

  mutate {
    replace => {
      "is_truncated_label.value" => "%{IsTruncated}"
    }
    on_error => "no_data"
  }

  if ![no_data] and [is_truncated_label][value] != "" {
    mutate {
      replace => {
        "is_truncated_label.key" => "is_truncated"
      }
    }

    mutate {
      merge => {
        "token_entity.group.attribute.labels" => "is_truncated_label"
      }
    }
  }

  mutate {
    replace => {
      "marker_label.value" => "%{Marker}"
    }
    on_error => "no_data"
  }

  if ![no_data] and [marker_label][value] != "" {
    mutate {
      replace => {
        "marker_label.key" => "marker"
      }
    }

    mutate {
      merge => {
        "token_entity.group.attribute.labels" => "marker_label"
      }
    }
  }

  for tag in Tags {
    mutate {
      replace => {
        "tag_label.value" => "%{tag.Value}"
      }
      on_error => "no_data"
    }

    if ![no_data] and [tag_label][value] != "" {
      mutate {
        replace => {
          "tag_label.key" => "%{tag.Key}"
        }
        on_error => "_"
      }

      mutate {
        merge => {
          "token_entity.user.attribute.labels" => "tag_label"
        }
        remove_field => ["tag_label"]
      }
    }
  }

  mutate {
    replace => {
      "token_entity.group.group_display_name" => "%{Group.GroupName}"
    }
    on_error => "no_grp_name"
  }

  date {
    match => ["Group.CreateDate", "ISO8601"]
    target => "token_entity.group.attribute.creation_time"
    on_error => "format_not_match"
  }

  mutate {
    replace => {
      "token_entity.group.product_object_id" => "%{Group.GroupID}"
    }
    on_error => "_"
  }

  if ![no_userid] {
    mutate {
      replace => {
        "token_metadata.entity_type" => "USER"
        "token_entity.resource.resource_subtype" => "User"
      }
    }

    date {
      match => ["CreateDate", "ISO8601"]
      target => "token_entity.user.attribute.creation_time"
      on_error => "format_not_match"
    }

    mutate {
      replace => {
        "user_path_label.value" => "%{Path}"
      }
      on_error => "no_data"
    }

    if ![no_data] and [Path] != "" {
      mutate {
        replace => {
          "user_path_label.key" => "path"
        }
      }

      mutate {
        merge => {
          "token_entity.user.attribute.labels" => "user_path_label"
        }
      }
    }
  }
  else if ![no_role_name] {
    mutate {
      replace => {
        "token_metadata.entity_type" => "RESOURCE"
        "token_entity.resource.resource_type" => "ACCESS_POLICY"
      }
    }

    date {
      match => ["CreateDate", "ISO8601"]
      target => "token_entity.resource.attribute.creation_time"
      on_error => "format_not_match"
    }

    mutate {
      replace => {
        "role_path_label.value" => "%{Path}"
      }
      on_error => "no_data"
    }

    if ![no_data] and [Path] != "" {
      mutate {
        replace => {
          "role_path_label.key" => "path"
        }
      }

      mutate {
        merge => {
          "token_entity.resource.attribute.labels" => "role_path_label"
        }
      }
    }
  }
  else if ![no_grp_name] {
    mutate {
      replace => {
        "token_metadata.entity_type" => "GROUP"
        "token_entity.resource.resource_subtype" => "Group"
      }
    }

    mutate {
      replace => {
        "token_entity.resource.name" => "%{Group.Arn}"
      }
      on_error => "_"
    }

    mutate {
      merge => {
        "token_entity.group.email_addresses" => "Group.GroupName"
      }
      on_error => "_"
    }

    mutate {
      replace => {
        "grp_path_label.value" => "%{Group.Path}"
      }
      on_error => "no_data"
    }

    if ![no_data] and [Group][Path] != "" {
      mutate {
        replace => {
          "grp_path_label.key" => "path"
        }
      }

      mutate {
        merge => {
          "token_entity.group.attribute.labels" => "grp_path_label"
        }
      }
    }

    for user in Users {
      mutate {
        replace => {
          "user_relation.direction" => "UNIDIRECTIONAL"
          "user_relation.entity_type" => "USER"
          "user_relation.relationship" => "MEMBER"
        }
      }

      mutate {
        replace => {
          "user_relation.entity.user.product_object_id" => "%{user.UserID}"
        }
        on_error => "no_userid"
      }

      mutate {
        replace => {
          "user_relation.entity.user.userid" => "%{user.UserName}"
        }
        on_error => "no_user_name"
      }

      mutate {
        replace => {
          "user_path_label.value" => "%{user.Path}"
        }
        on_error => "no_data"
      }

      if ![no_data] and [user][Path] != "" {
        mutate {
          replace => {
            "user_path_label.key" => "path"
          }
        }

        mutate {
          merge => {
            "user_relation.entity.user.attribute.labels" => "user_path_label"
          }
          remove_field => ["user_path_label"]
        }
      }

      mutate {
        replace => {
          "user_relation.entity.resource.name" => "%{user.Arn}"
        }
        on_error => "no_arn"
      }

      date {
        match => ["user.PasswordLastUsed", "ISO8601"]
        target => "user_relation.entity.user.last_login_time"
        on_error => "format_not_match"
      }

      date {
        match => ["user.CreateDate", "ISO8601"]
        target => "user_relation.entity.user.attribute.creation_time"
        on_error => "format_not_match"
      }

      mutate {
        replace => {
          "permissions_boundary_arn_label.value" =>
          "%{user.PermissionsBoundary.PermissionsBoundaryArn}"
        }
        on_error => "no_data"
      }

      if ![no_data] and [permissions_boundary_arn_label][value] != "" {
        mutate {
          replace => {
            "permissions_boundary_arn_label.key" => "permissions_boundary_arn"
          }
        }

        mutate {
          merge => {
            "user_relation.entity.resource.attribute.labels" =>
            "permissions_boundary_arn_label"
          }
          remove_field => ["permissions_boundary_arn_label"]
        }
      }

      mutate {
        replace => {
          "permissions_boundary_type_label.value" =>
          "%{user.PermissionsBoundary.PermissionsBoundaryType}"
        }
        on_error => "no_data"
      }

      if ![no_data] and [permissions_boundary_type_label][value] != "" {
        mutate {
          replace => {
            "permissions_boundary_type_label.key" => "permissions_boundary_type"
          }
        }

        mutate {
          merge => {
            "user_relation.entity.resource.attribute.labels" =>
            "permissions_boundary_type_label"
          }
          remove_field => ["permissions_boundary_type_label"]
        }
      }

      for tag in Tags {
        mutate {
          replace => {
            "tag_label.value" => "%{tag.Value}"
          }
          on_error => "no_data"
        }

        if ![no_data] and [tag_label][value] != "" {
          mutate {
            replace => {
              "tag_label.key" => "%{tag.Key}"
            }
            on_error => "_"
          }

          mutate {
            merge => {
              "user_relation.entity.user.attribute.labels" => "tag_label"
            }
            remove_field => ["tag_label"]
          }
        }
      }

      mutate {
        replace => {
          "user_relation.entity.resource.resource_subtype" => "User"
        }
      }

      mutate {
        merge => {
          "event.idm.entity.relations" => "user_relation"
        }
        on_error => "_"
        remove_field => ["user_relation"]
      }
    }
  }

   mutate {
    rename => {
      "token_metadata" => "event.idm.entity.metadata"
      "token_entity" => "event.idm.entity.entity"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
