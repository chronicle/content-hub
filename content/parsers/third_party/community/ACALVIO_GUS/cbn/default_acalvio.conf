# Product: Acalvio
# Category: Deception Software
# Supported Format: SYSLOG + KV
# Reference: NA
# Last Updated: 2026-02-27
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "incidentSubCategory" => ""
      "adc_email" => ""
      "dstIp" => ""
      "dstPort" => ""
      "dstMAC" => ""
      "dstHostName" => ""
      "userIdsUsed" => ""
      "Intrusion_method_used" => ""
      "severity" => ""
      "sr_category" => ""
      "sr_severity" => ""
      "srcIp" => ""
      "deviceVendor" => ""
      "deviceProduct" => ""
      "deviceVersion" => ""
      "incidentid" => ""
      "startTime" => ""
      "cat" => ""
      "customer_id" => ""
      "job_id" => ""
      "investigation_id" => ""
      "app" => ""
      "kvdata" => ""
      "json_data" => ""
      "vulnerabilities" => ""
      "msg1" => ""
      "eventtype" => ""
      "vulnerability.severity" => ""
      "vulnerability.first_time_seen" => ""
      "vulnerability.last_time_seen" => ""
      "vulnerability.id" => ""
      "vulnerability.title" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "inter_host" => ""
      "incidentID" => ""
      "src" => ""
      "dst" => ""
      "dst_ips" => ""
      "target_ip" => ""
      "dstEndpointName" => ""
      "sev" => ""
      "techniqueID" => ""
      "callbackURL" => ""
      "incidentStatus" => ""
      "scanType" => ""
      "endTime" => ""
      "responseStatus" => ""
      "srcSiteType" => ""
      "srcSubnet" => ""
      "dstOSFamily" => ""
      "dstEntityType" => ""
      "playbookPurpose" => ""
      "credentialAnalytics" => ""
      "tenantName" => ""
      "has_user" => "false"
      "MITREVersion" => ""
      "MITREMatrixType" => ""
      "MITREFrameworkType" => ""
      "srcSubnetCat" => ""
      "observationCount" => ""
      "dstSubnet" => ""
      "dstSubnetCat" => ""
      "tenantID" => ""
      "messageVersion" => ""
      "notificationSource" => ""
      "cs15Label" => ""
      "cs15" => ""
      "audit_id" => ""
      "user_id" => ""
      "user_name" => ""
      "session_id" => ""
      "operation" => ""
      "sec_result" => ""
      "inter_ip" => ""
      "intermediary" => ""
    }
  }

  mutate {
    gsub => ["message", '\"message\"', '\"msg1\"']
  }
  mutate { 
    gsub => ["message", 'event_type', 'eventtype']
  }
  if [message] =~ "CEF:" {
    mutate {
      gsub => ["message", '\"', '']
    }
    @include["cef_extraction.include"]
    @include["cef_udm_mapping.include"]
    if [suid] == "" and [cs2Label] == "user_id" and [cs2] != "" {
      mutate {
        replace => {
          "userIdsUsed" => "%{cs2}"
        }
        on_error => "cs2_empty"
      }
    }
    if [suser] == "" and [cs3Label] == "user_name" and [cs3] != "" {
      mutate {
        replace => {
          "user_name" => "%{cs3}"
        }
        on_error => "cs3_empty"
      }
    }
    if [cs4Label] == "session_id" and [cs4] != "" {
      mutate {
        replace => {
          "session_id" => "%{cs4}"
        }
        on_error => "cs4_empty"
      }
    }
    if [cs15Label] == "srcIP" and [cs15] != "" {
      mutate {
        replace => {
          "srcIp" => "%{cs15}"
        }
        on_error => "cs15_empty"
      }
    }
  }
  if [message] !~ "^{" and [message] !~ "CEF:" {
    grok {
      match => {
        "message" => [
          "<%{INT}>(%{SYSLOGTIMESTAMP}|%{TIMESTAMP_ISO8601}) %{IPORHOST:inter_host}.*(?P<kvdata>deviceVendor.*)",
        ]
      }
      overwrite => ["kvdata", "inter_host"]
      on_error => "match_fail"
    }
    if [match_fail] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  if [kvdata] != "" {
    mutate {
      gsub => ["kvdata", '\"', '']
    }
    mutate {
      gsub => ["kvdata", '', '']
    }
    mutate {
      gsub => ["kvdata"," ([a-zA-Z_]+)="," #$1="]
    }
    kv {
      source => "kvdata"
      field_split => "#"
      value_split => "="
      on_error => "kv_fail"
    }
  }
  if [message] =~ "^" {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
  }
  if [eventtype] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{eventtype}"
      }
      on_error => "eventtype_empty"
    }
  }
  if [vulnerability][severity] in ["CRITICAL", "HIGH", "MEDIUM", "LOW"] {
    mutate {
      replace => {
        "vulnerabilities.severity" => "%{vulnerability.severity}"
      }
      on_error => "severity_not_match"
    }
  }
  if [vulnerability][first_time_seen] not in ["", "null"] {
    date {
      match => ["vulnerability.first_time_seen", "MMM dd yyyy HH:mm:ss +0000", "RFC3339", "ISO8601", "UNIX"]
      target => "vulnerabilities.first_found"
      on_error => "format_not_match"
    }
  }
  if [vulnerability][last_time_seen] not in ["", "null"] {
    date {
      match => ["vulnerability.last_time_seen", "MMM dd yyyy HH:mm:ss +0000", "RFC3339", "ISO8601", "UNIX"]
      target => "vulnerabilities.last_found"
      on_error => "format_not_match"
    }
  }

  if [inter_host] != "" {
    grok {
      match => {
        "inter_host" => "%{IP:inter_ip}"
      }
      overwrite => ["inter_ip"]
      on_error => "inter_ip_not_match"
    }
    if ![inter_ip_not_match] and [inter_ip] != "" {
      mutate {
        merge => {
          "intermediary.ip" => "inter_ip"
        }
        on_error => "intermediary_ip_empty"
      }
    }
    else {
      mutate {
        replace => {
          "intermediary.hostname" => "%{inter_host}"
        }
        on_error => "intermediary_hostname_empty"
      }
    }
  }

  if [startTime] == "" {
    grok {
      match => {
        "message" => [
          "<%{INT}>(%{SYSLOGTIMESTAMP:startTime}|%{TIMESTAMP_ISO8601:startTime}) %{IPORHOST}.*",
        ]
      }
      overwrite => ["startTime"]
      on_error => "startTime_not_match"
    }
  }
  if [startTime] != "" {
    date {
      match => ["startTime", "RFC3339", "ISO8601", "MMM dd yyyy HH:mm:ss.SSS"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "format_not_match"
    }
    if [format_not_match] {
      date {
        match => ["startTime", "MMM dd HH:mm:ss"]
        rebase => true
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "format_not_match_2"
      }
    }
  }
  if [endTime] != "" {
    mutate {
      replace => {
        "end_time_label.key" => "endTime"
        "end_time_label.value.string_value" => "%{endTime}"
      }
      on_error => "endTime_empty"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "end_time_label"
      }
      on_error => "end_time_label_empty"
    }
  }
  if [vulnerability][id] not in ["", "null"] {
    mutate {
      replace => {
        "vulnerabilities.vendor_vulnerability_id" => "%{vulnerability.id}"
      }
      on_error => "Vulnerability_id_empty"
    }
  }
  if [vulnerability][title] not in ["", "null"] {
    mutate {
      replace => {
        "vulnerabilities.description" => "%{vulnerability.title}"
      }
      on_error => "Vulnerability_title_empty"
    }
  }
  for key, value in vulnerability map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if [key] not in ["first_time_seen", "last_time_seen", "id", "title", "severity"] {
      if ![value_not_exists] and [value] not in ["null", ""] {
        mutate {
          replace => {
            "field_.value" => "%{value}"
          }
          on_error => "value_not_exists"
        }
        mutate {
          replace => {
            "field_.key" => "vulnerability %{key}"
          }
          on_error => "key_not_exists"
        }
        mutate {
          merge => {
            "sec_result.detection_fields" => "field_"
          }
          on_error => "detection_fields_empty"
        }
      }
    }
  }
  for key, value in application map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if [key] == "id" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{value}"
        }
        on_error => "product_log_id_empty"
      }
    }
    else if ![value_not_exists] and [value] != "-" {
      mutate {
        replace => {
          "field_.value" => "%{value}"
        }
        on_error => "value_not_exists"
      }
      mutate {
        replace => {
          "field_.key" => "application %{key}"
        }
        on_error => "key_not_exists"
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "field_"
        }
        on_error => "detection_fields_empty"
      }
    }
  }
  for key, value in server map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [value] != "-" {
      mutate {
        replace => {
          "field_.value" => "%{value}"
        }
        on_error => "value_not_exists"
      }
      mutate {
        replace => {
          "field_.key" => "server %{key}"
        }
        on_error => "key_not_exists"
      }
      mutate {
        merge => {
          "sec_result.detection_fields" => "field_"
        }
        on_error => "detection_fields_empty"
      }
    }
  }
  if [deviceVendor] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{deviceVendor}"
      }
      on_error => "deviceVendor_empty"
    }
  }
  if [deviceProduct] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{deviceProduct}"
      }
      on_error => "deviceProduct_empty"
    }
  }
  if [deviceVersion] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{deviceVersion}"
      }
      on_error => "deviceVersion_empty"
    }
  }
  if [customer_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "CustomerId: %{customer_id}, JobId: %{job_id}, InvestigationId: %{investigation_id}"
      }
      on_error => "customer_id_empty"
    }
  }
  if [msg1] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{msg1}"
      }
      on_error => "msg_empty"
    }
  }
  if [incidentSubCategory] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{incidentSubCategory}"
      }
      on_error => "incidentSubCategory_empty"
    }
  }
  if [incidentid] == "" and [incidentID] != "" {
    mutate {
      replace => {
        "incidentid" => "%{incidentID}"
      }
      on_error => "incidentID_empty"
    }
  }
  if [incidentid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{incidentid}"
      }
      on_error => "incidentid_empty"
    }
  }
  if [app] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{app}"
      }
      on_error => "app_empty"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.principal.resource.type" => "scan_type"
    }
  }
  if [incidentSubCategory] == "Breadcrumb Accessed" {
    mutate {
      replace => {
        "sr_category" => "ACL_VIOLATION"
      }
    }
  }

  if [srcIp] == "" and [src] != "" {
    mutate {
      replace => {
        "srcIp" => "%{src}"
      }
      on_error => "src_empty"
    }
  }
  if [srcIp] != "Unknown" and [srcIp] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "srcIp"
        "event.idm.read_only_udm.principal.asset.ip" => "srcIp"
      }
      on_error => "srcIp_empty"
    }
    if ![srcIp_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [userIdsUsed] == "" and [user_id] != "" {
    mutate {
      replace => {
        "userIdsUsed" => "%{user_id}"
      }
      on_error => "user_id_empty"
    }
  }
  if [userIdsUsed] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{userIdsUsed}"
        "has_user" => "true"
      }
      on_error => "userIdsUsed_empty"
    }
  }

  if [user_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_name}"
      }
      on_error => "user_display_name_empty"
    }
  }

  if [operation] != "" {
    mutate {
      replace => {
        "operation_label.key" => "operation"
        "operation_label.value" => "%{operation}"
      }
      on_error => "operation_empty"
    }
    if ![operation_empty] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "operation_label"
        }
        on_error => "operation_label_empty"
      }
    }
  }
  if [dst] != "" {
    mutate {
      split => {
        source => "dst"
        separator => ","
        target => "dst_ips"
      }
    }
    for index, dst_ip in dst_ips {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dst_ip"
          "event.idm.read_only_udm.target.asset.ip" => "dst_ip"
        }
        on_error => "dst_ip_empty"
      }
      if ![dst_ip_empty] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  if [dstIp] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dstIp"
        "event.idm.read_only_udm.target.asset.ip" => "dstIp"
      }
      on_error => "dstIp_empty"
    }
    if ![dstIp_empty] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [dstHostName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{dstHostName}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{dstHostName}"
      }
      on_error => "dstHostName_empty"
    }
    if ![dstHostName_empty] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [dstPort] != "" {
    mutate {
      convert => {
        "dstPort" => "integer"
      }
      on_error => "dstPort_already_integer"
    }

    mutate {
      rename => {
        "dstPort" => "event.idm.read_only_udm.target.port"
      }
    }
  }

  if [dstMAC] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.mac" => "dstMAC"
        "event.idm.read_only_udm.target.asset.mac" => "dstMAC"
      }
      on_error => "dstMAC_empty"
    }
  }

  if [dstEndpointName] != "" {
    mutate {
      split => {
        source => "dstEndpointName"
        separator => ","
        target => "dstEndpointNames"
      }
    }
    for index, dstendpointname in dstEndpointNames {
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "index_not_string"
      }
      mutate {
        replace => {
          "dstEndpointName_label" => ""
        }
      }
      mutate {
        replace => {
          "dstEndpointName_label.key" => "dstEndpointName %{index}"
          "dstEndpointName_label.value" => "%{dstendpointname}"
        }
        on_error => "dstEndpointName_empty"
      }
      if ![dstEndpointName_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "dstEndpointName_label"
          }
          on_error => "dstEndpointName_label_empty"
        }
      }
    }
  }

  if [adc_email] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.user.email_addresses" => "adc_email"
      }
      on_error => "adc_email_empty"
    }
  }

  if [cat] != ""  and [message] !~ "CEF:" {
    mutate {
      replace => {
        "sec_result.summary" => "%{cat}"
      }
      on_error => "cat_empty"
    }
  }
  if [incidentSubCategory] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{incidentSubCategory}"
      }
      on_error => "incidentSubCategory_empty"
    }
  }

  if [severity] == "" and [sev] != "" {
    mutate {
      replace => {
        "severity" => "%{sev}"
      }
      on_error => "sev_empty"
    }
  }
  if [severity] != "" and [message] !~ "CEF:" {
    mutate {
      convert => {
        "severity" => "uinteger"
      }
      on_error => "severity_already_integer"
    }

    if [severity] > 7 {
      mutate {
        replace => {
          "sr_severity" => "HIGH"
        }
      }
    } else if [severity] > 3 {
      mutate {
        replace => {
          "sr_severity" => "MEDIUM"
        }
      }
    } else {
      mutate {
        replace => {
          "sr_severity" => "LOW"
        }
      }
    }
  }

  if [techniqueID] != "" {
    mutate {
      split => {
        source => "techniqueID"
        separator => ","
        target => "techniqueIDs"
        on_error => "techniqueIDs_empty"
      }
    }
    for index, subtechnique_id in techniqueIDs {
      mutate {
        replace => {
          "technique_id" => ""
          "tactics_data" => ""
          "technique_data" => ""
          "technique_name" => ""
          "tactic_id" => ""
          "tactic_name" => ""
        }
      }
      @include ["mitre_techniques_and_tactics_mapping.include"]
      if [technique_data] != "" {
        mutate {
          merge => {
            "sec_result.attack_details.techniques" => "technique_data"
          }
          on_error => "technique_data_not_merged"
        }
      }
      if [tactics_data] != "" {
        mutate {
          merge => {
            "sec_result.attack_details.tactics" => "tactics_data"
          }
          on_error => "tactics_data_not_merged"
        }
      }
    }
  }

  if [incidentStatus] != "" {
    mutate {
      replace => {
        "incident_status_label.key" => "incidentStatus"
        "incident_status_label.value" => "%{incidentStatus}"
      }
      on_error => "incidentStatus_empty"
    }
    if ![incidentStatus_empty] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "incident_status_label"
        }
        on_error => "incident_status_label_empty"
      }
    }
  }

  if [scanType] != "" {
    mutate {
      replace => {
        "scan_type_label.key" => "scanType"
        "scan_type_label.value" => "%{scanType}"
      }
      on_error => "scanType_empty"
    }
    if ![scanType_empty] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "scan_type_label"
        }
        on_error => "scan_type_label_empty"
      }
    }
  }

  if [callbackURL] != "" {
    mutate {
      replace => {
        "sec_result.url_back_to_product" => "%{callbackURL}"
      }
      on_error => "callbackURL_empty"
    }
  }

  if [responseStatus] != "" {
    mutate {
      replace => {
        "response_status_label.key" => "responseStatus"
        "response_status_label.value" => "%{responseStatus}"
      }
      on_error => "responseStatus_empty"
    }
    if ![responseStatus_empty] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "response_status_label"
        }
        on_error => "response_status_label_empty"
      }
    }
  }

  if [srcSiteType] != "" {
    mutate {
      replace => {
        "src_site_type_label.key" => "srcSiteType"
        "src_site_type_label.value" => "%{srcSiteType}"
      }
      on_error => "srcSiteType_empty"
    }
    if ![srcSiteType_empty] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "src_site_type_label"
        }
        on_error => "src_site_type_label_empty"
      }
    }
  }

  if [srcSubnet] != "" {
    mutate {
      replace => {
        "src_subnet_label.key" => "srcSubnet"
        "src_subnet_label.value" => "%{srcSubnet}"
      }
      on_error => "srcSubnet_empty"
    }
    if ![srcSubnet_empty] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "src_subnet_label"
        }
        on_error => "src_subnet_label_empty"
      }
    }
  }

  if [dstOSFamily] != "" {
    mutate {
      replace => {
        "dst_os_family_label.key" => "dstOSFamily"
        "dst_os_family_label.value" => "%{dstOSFamily}"
      }
      on_error => "dstOSFamily_empty"
    }
    if ![dstOSFamily_empty] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "dst_os_family_label"
        }
        on_error => "dst_os_family_label_empty"
      }
    }
  }

