# Product: ELASTIC_SEARCH
# Category: Log Aggregator
# Supported Format: JSON
# Reference: https://docs.google.com/document/d/1XhgwJ5FONtZnXrKe-pLKa2FEhCphXTfQax2mUWJFofo/edit#
# Last Updated: 2023-11-02
# Copyright 2023 Chronicle LLC

# Additional Reference: https://www.elastic.co/guide/en/elasticsearch/reference/7.6/audit-event-types.html

filter {
  mutate {
    replace => {
      "about" => ""
      "sr" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
    }
  }
  mutate {
    gsub => ["message", "@timestamp", "timestamp"]
  }
  mutate {
    gsub => ["message", "message", "msg_data"]
  }
  # Reading JSON
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_JSON"
  }
  json {
    source => "msg_data"
    array_function => "split_columns"
    on_error => "not_JSON"
  }
  if [not_JSON] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  # Metadata description
  mutate {
    replace => {
      "metadata.vendor_name"  => "ELASTIC"
      "metadata.product_name" => "ELASTICSEARCH"
      "metadata.event_type"   => "USER_RESOURCE_ACCESS"
    }
  }

  # Fields outside the Message
  mutate {
    replace => {
      "sr.severity_details" => "%{Level}"
    }
    on_error => "error_level"
  }
  if ![error_level] {
    if [Level] in ["INFO", "ALL", "OFF", "TRACE", "DEBUG"]  {
      mutate {
        replace => {
          "sr.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [Level] == "WARN"  {
      mutate {
        replace => {
          "sr.severity" => "LOW"
        }
      }
    }
    else if [Level] == "ERROR" {
      mutate {
        replace => {
          "sr.severity" => "ERROR"
        }
      }
    }
    else if [Level] == "FATAL" {
      mutate {
        replace => {
          "sr.severity" => "CRITICAL"
        }
      }
    }
  }

  # We are going to follow the Logtype specified above
  mutate {
    gsub => ["timestamp", ",", "."]
  }
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSS"]
    #on_error => "error_timestamp_parse"
  }

  # node.name
  mutate {
    replace => {
      "target.asset.hostname" => "%{node.name}"
    }
    on_error => "error_node_name"
  }
  # node.ip
  mutate {
    merge => {
      "principal.asset.ip" => "node.ip"
    }
    on_error => "error_node_ip"
  }
  # node.id
  mutate {
    replace => {
      "principal.asset.product_object_id" => "%{node.id}"
    }
    on_error => "error_node_id"
  }
  # host.ip
  mutate {
    replace => {
      "port" => "%{host.ip}"
    }
    on_error => "error_ip"
  }
  mutate {
    gsub => ["port", ".*:([0-9]+)", "$1"]
  }
  mutate {
    gsub => ["host.ip", "(.*):[0-9]+", "$1"]
  }
  mutate {
    merge => {
        "target.ip" => "host.ip"
    }
    on_error => "error_host_ip"
  }
  # host.name
  mutate {
    replace => {
        "target.hostname" => "%{host.name}"
    }
    on_error => "error_hostname"
  }
  # origin.address

  mutate {
    replace => {
      "address_port" => "%{origin.address}"
    }
    on_error => "error_ip"
  }
  mutate {
    gsub => ["origin.address", "(.*):[0-9]+", "$1"]
  }
  mutate {
    merge => {
      "principal.ip" => "origin.address"
    }
    on_error => "error_origin_address"
  }
  grok {
    match => {
      "address_port" => [
        ".*\:%{INT:port:int}"
      ]
    }
    on_error => "grok_failed"
  }
  mutate{
    convert => {
      "port" => "integer"
    }
    on_error => "conversion_failed"
  }
  mutate {
    replace => {
      "principal.port" => "%{port}"
    }
    on_error => "error_port"
  }

  # host_group
  mutate {
    replace => {
      "principal.hostname" => "%{properties.host_group}"
    }
    on_error => "no_host_group"
  }

  # origin.type
  mutate {
    replace => {
      "principal.resource.resource_subtype" => "%{origin.type}"
    }
    on_error => "error_origin_type"
  }
  #event

  mutate {
    replace => {
      "event_action" => "%{event.action}"
    }
    on_error => "error_event_action"
  }
  mutate {
    rename => {
      "event.action" => "delete_nested_conflict_action"
    }
  }
  mutate {
    rename => {
      "event.type" => "delete_nested_conflict_type"
    }
  }
  mutate {
    replace => {
      "type" => "%{event.type}"
    }
    on_error => "error_event_type"
  }
  # event.type
  mutate {
    replace => {
      "metadata.product_event_type" => "%{delete_nested_conflict_type}"
    }
    on_error => "error_event_type"
  }

  # event.action
  mutate {
    replace => {
      "sr.summary" => "%{event_action}"
    }
    on_error => "error_event_action"
  }
  # user.realm
  mutate {
    replace => {
      "pm.name" => "%{user.realm}"
    }
    on_error => "error_user_realm"
  }
  for role in user.roles {
    mutate {
      replace => {
        "roles"  => ""
      }
    }
    mutate {
      replace => {
        "roles.name"  => "%{role}"
      }
      on_error => "no_role"
    }
    mutate {
      merge => {
        "about.user.attribute.roles"   => "roles"
      }
      on_error => "no_roles"
    }
  }
  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about"   => "about"
      }
      on_error => "_"
    }
  }

  mutate {
    merge => {
      "principal.user.attribute.permissions" => "pm"
    }
    on_error => "error_user_realm"
  }
  # user.name
  mutate {
    replace => {
      "principal.user.userid" => "%{user.name}"
    }
    on_error => "error_user_name"
  }
  #port
  mutate {
    rename => {
      "port" => "principal.port"
    }
  }
  grok {
    match => {
      "user.roles" => "%{GREEDYDATA:USER}"
    }
    on_error => "error_USERR"
  }
  #mrID
  mutate {
    replace => {
      "target.hostname" => "%{mrId}"
    }
    on_error => "error_no_mrId"
  }
  # url.path
  mutate {
    replace => {
      "principal.url" => "%{url.path}"
    }
    on_error => "error_url_path"
  }
  #host_group
  mutate {
    replace => {
      "target.group.group_display_name" => "%{properties.host_group}"
    }
    on_error => "error_no_host_group"
  }
  # action
  mutate {
    replace => {
      "sr.action_details" => "%{action}"
    }
    on_error => "error_event_action"
  }
  # request.id
  mutate {
    replace => {
      "target.resource.product_object_id" => "%{request.id}"
    }
    on_error => "error_request_id"
  }
  # request.name
  mutate {
    replace => {
      "target.resource.name" => "%{request.name}"
    }
    on_error => "error_request_name"
  }
  #indices
  for indice in indices{
    mutate {
      replace => {
        "target_labels_in" => ""
      }
    }
    mutate {
      replace => {
        "target_labels_in.key" => "Indice"
        "target_labels_in.value" => "%{indice}"
      }
      on_error => "no_indice"
    }
    if ![no_indice] {
      mutate {
        merge => {
          "target.labels" => "target_labels_in"
        }
        on_error => "no_indice"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  # Merge Security_Result
  if [sr] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr"
      }
      on_error => "error_sr_merge_failed"
    }
  }
  # END of Parser
  mutate {
    merge => {
    "@output" => "event"
    }
  }
}

