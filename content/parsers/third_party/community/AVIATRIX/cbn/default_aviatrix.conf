# Product: Aviatrix Cloud Network Platform
# Category: Network infrastructure
# Supported Format: SYSLOG + KV
# Reference: N/A
# Last Updated: 2026-10-09
# Copyright 2026 Google SecOps


filter {
  mutate {
    replace => {
      "body" => ""
      "pri" => ""
      "sts" => ""
      "shost" => ""
      "proc_path" => ""
      "app_name" => ""
      "pid" => ""
      "syslog_msg" => ""
      "log_time" => ""
      "product_event_type" => ""
      "kv_data" => ""
      "timestamp" => ""
      "name" => ""
      "alias" => ""
      "public_ip" => ""
      "dst_public_ip" => ""
      "private_ip" => ""
      "interface" => ""
      "cpu_idle" => ""
      "memory_free" => ""
      "memory_available" => ""
      "memory_total" => ""
      "disk_total" => ""
      "disk_free" => ""
      "cpu_cores" => ""
      "total_rx_rate" => ""
      "total_tx_rate" => ""
      "total_rx_tx_rate" => ""
      "total_rx_cum" => ""
      "total_tx_cum" => ""
      "total_rx_tx_cum" => ""
      "conntrack_limit_exceeded" => ""
      "bw_in_limit_exceeded" => ""
      "bw_out_limit_exceeded" => ""
      "pps_limit_exceeded" => ""
      "linklocal_limit_exceeded" => ""
      "conntrack_count" => ""
      "conntrack_allowance_available" => ""
      "conntrack_usage_rate" => ""
      "src_ip" => ""
      "dst_ip" => ""
      "dst_host" => ""
      "src_port" => ""
      "dst_port" => ""
      "protocol_number_src" => ""
      "protocol_str" => ""
      "session_id" => ""
      "IN" => ""
      "OUT" => ""
      "LEN" => ""
      "TOS" => ""
      "PREC" => ""
      "TTL" => ""
      "WINDOW" => ""
      "RES" => ""
      "URGP" => ""
      "flag_df" => ""
      "flag_syn" => ""
      "kernel_uptime" => ""
      "uptime_label" => ""
      "msg_body" => ""
      "pg_line" => ""
      "pg_ts" => ""
      "pg_sev" => ""
      "db_name" => ""
      "res_name" => ""
      "ike_thread" => ""
      "ike_subsys" => ""
      "ike_conn" => ""
      "ike_spi" => ""
      "htp_ts" => ""
      "htp_rtt" => ""
      "htp_offset" => ""
      "src_file" => ""
      "sec_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "event" => ""
      "ID" => ""
    }
  }

  mutate {
    replace => {
      "body" => "%{message}"
    }
    on_error => "message_missing"
  }

  grok {
    match => {
      "message" => [
        "^<%{INT:pri}>%{SYSLOGTIMESTAMP:sts} +(?P<shost>\\S+) +(?P<body>.*)$"
      ]
    }
    overwrite => ["pri", "sts", "shost", "body"]
    on_error => "no_syslog_header"
  }

  grok {
    match => {
      "body" => [
        "^(?P<proc_path>/\\S+) +(?P<log_time>\\S+ %{TIME}) +(?P<msg_body>.*)$",
        "^(?P<log_time>\\d{4}/\\d{2}/\\d{2} %{TIME})\\s+(?P<msg_body>.*)$",
        "^(?:kernel:\\s*)?\\[%{NUMBER:kernel_uptime}\\]\\s+(?P<msg_body>.*)$",
        "^(?P<app_name>[^ :\\[]+)(?:\\[%{INT:pid}\\])?: *(?P<syslog_msg>.*)$"
      ]
    }
    overwrite => [
      "proc_path", "log_time", "kernel_uptime", "msg_body",
      "app_name", "pid", "syslog_msg"
    ]
    on_error => "grok_body_failure"
  }

  if [grok_body_failure] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }

  if [msg_body] != "" {
    grok {
      match => {
        "msg_body" => "^%{WORD:product_event_type}:\\s*%{GREEDYDATA:kv_data}$"
      }
      overwrite => ["product_event_type", "kv_data"]
      on_error => "grok_msg_body_failure"
    }
    if [grok_msg_body_failure] {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }
  }

  if [kv_data] != "" {
    if [kv_data] =~ "cpu_cores=" {
      grok {
        match => {
          "kv_data" => "cpu_cores=\\[(?P<cpu_cores>[^\\]]+)\\]"
        }
        overwrite => ["cpu_cores"]
        on_error => "no_cpu_cores"
      }
      mutate {
        gsub => [
          "kv_data", "cpu_cores=\\[[^\\]]+\\]", ""
        ]
      }
    }
    kv {
      source => "kv_data"
      field_split => " "
      value_split => "="
      on_error => "kv_failure"
    }
  }

  if [app_name] == "postgres" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" =>
        "^\\[(?P<pg_line>\\S+)\\] (?P<pg_ts>[^\\[]+) \\[\\d+\\] %{WORD:pg_sev}: *(?P<syslog_msg>(?:.*?(?:database \"|ALTER DATABASE )(?P<db_name>[^\"\\s]+))?.*)$"
      }
      overwrite => ["pg_line", "pg_ts", "pg_sev", "syslog_msg", "db_name"]
      on_error => "pg_grok_error"
    }
  }
  else if [app_name] == "charon" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" => [
          "^%{INT:ike_thread}\\[%{WORD:ike_subsys}\\] +(?:<(?:(?P<ike_conn>[^|>]+)\\|)?%{INT:session_id}> +)?(?P<syslog_msg>.*between %{IP:src_ip}\\[%{IP:public_ip}\\]\\.\\.\\.%{IP:dst_ip}(?:\\[%{IP:dst_public_ip}\\])?.*)$",
          "^%{INT:ike_thread}\\[%{WORD:ike_subsys}\\] +(?:<(?:(?P<ike_conn>[^|>]+)\\|)?%{INT:session_id}> +)?(?P<syslog_msg>.*initiating IKE_SA \\S+ to %{IP:dst_ip}.*)$",
          "^%{INT:ike_thread}\\[%{WORD:ike_subsys}\\] +(?:<(?:(?P<ike_conn>[^|>]+)\\|)?%{INT:session_id}> +)?(?P<syslog_msg>.*%{IP:src_ip} is initiating an IKE_SA.*)$",
          "^%{INT:ike_thread}\\[%{WORD:ike_subsys}\\] +(?:<(?:(?P<ike_conn>[^|>]+)\\|)?%{INT:session_id}> +)?(?P<syslog_msg>.*with id '(?P<res_name>[^']+)'(?: for: '%{IP:src_ip}', '%{IP:dst_ip}')?.*)$",
          "^%{INT:ike_thread}\\[%{WORD:ike_subsys}\\] +(?:<(?:(?P<ike_conn>[^|>]+)\\|)?%{INT:session_id}> +)?(?P<syslog_msg>.*CHILD_SA (?P<protocol_str>[^/]+)/(?P<ike_spi>[^/]+)/%{IP:dst_ip}.*)$",
          "^%{INT:ike_thread}\\[%{WORD:ike_subsys}\\] +(?:<(?:(?P<ike_conn>[^|>]+)\\|)?%{INT:session_id}> +)?(?P<syslog_msg>.*)$"
        ]
      }
      overwrite => [
        "ike_thread", "ike_subsys", "ike_conn", "session_id", "syslog_msg",
        "src_ip", "public_ip", "dst_ip", "dst_public_ip", "res_name", "ike_spi", "protocol_str"
      ]
      on_error => "charon_grok_error"
    }
  }
  else if [app_name] == "htpdate" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" =>
        "^(?P<dst_host>\\S+) %{INT:dst_port}, (?P<htp_ts>\\d+ .* \\w+) \\((?P<htp_rtt>[^)]+)\\) => (?P<htp_offset>\\S+)$"
      }
      overwrite => ["dst_host", "dst_port", "htp_ts", "htp_rtt", "htp_offset"]
      on_error => "htpdate_grok_error"
    }
  }
  else if [app_name] == "sslh" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" =>
        "^matching \\[(?P<dst_host>\\S+)\\] with \\[(?P<res_name>\\S+)\\]"
      }
      overwrite => ["dst_host", "res_name"]
      on_error => "sslh_grok_error"
    }
  }
  else if [app_name] == "systemd-networkd" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" => "^(?P<interface>[^:]+): +(?P<syslog_msg>.*)$"
      }
      overwrite => ["interface", "syslog_msg"]
      on_error => "networkd_grok_error"
    }
  }
  else if [app_name] == "avx-gw-state-sync" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" =>
        "^(?P<pg_sev>\\w+)\\t(?P<src_file>\\S+)\\t(?P<syslog_msg>.*)$"
      }
      overwrite => ["pg_sev", "src_file", "syslog_msg"]
      on_error => "avx_sync_grok_error"
    }
  }
  else if [app_name] == "rsyslogd" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" =>
        "^rsyslogd\\[(?P<res_name>[^\\]]+)\\]: +(?P<syslog_msg>.*)$"
      }
      overwrite => ["res_name", "syslog_msg"]
      on_error => "rsyslogd_grok_error"
    }
  }
  else if [app_name] == "systemd" and [syslog_msg] != "" {
    grok {
      match => {
        "syslog_msg" => [
          "^Started (?P<res_name>[^.]+\\.service)\\.",
          "^(?P<res_name>[^:]+\\.service): +(?P<syslog_msg>.*)$"
        ]
      }
      overwrite => ["res_name", "syslog_msg"]
      on_error => "systemd_grok_error"
    }
  }

  if [timestamp] != "" {
    date {
      match => [
        "timestamp", "ISO8601",
        "yyyy-MM-ddTHH:mm:ss"
      ]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "timestamp_parse_error"
    }
  }
  else if [pg_ts] != "" {
    date {
      match => ["pg_ts", "yyyy-MM-dd HH:mm:ss.SSS ZZZ"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "pg_ts_parse_error"
    }
  }
  else if [htp_ts] != "" {
    date {
      match => [
        "htp_ts", "dd MMM yyyy HH:mm:ss ZZZ", "d MMM yyyy HH:mm:ss ZZZ"
      ]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "htp_ts_parse_error"
    }
  }
  else if [log_time] != "" {
    date {
      match => ["log_time", "yyyy/MM/dd HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "log_time_parse_error"
    }
  }
  else if [sts] != "" {
    date {
      match => ["sts", "MMM  d HH:mm:ss", "MMM d HH:mm:ss"]
      rebase => true
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "sts_parse_error"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" =>
        "%{product_event_type}"
      }
      on_error => "product_event_type_error"
    }
  }
  if [app_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{app_name}"
      }
      on_error => "app_name_error"
    }
  }

  if [proc_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" =>
        "%{proc_path}"
      }
      on_error => "proc_path_error"
    }
  }

  if [pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
      on_error => "pid_error"
    }
  }

  if [syslog_msg] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{syslog_msg}"
      }
      on_error => "syslog_msg_error"
    }
  }

  if [db_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{db_name}"
        "event.idm.read_only_udm.target.resource.resource_type" => "DATABASE"
      }
      on_error => "db_name_error"
    }
  }
  else if [res_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{res_name}"
      }
      on_error => "res_name_error"
    }
  }

  if [name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{name}"
        "has_principal" => "true"
      }
      on_error => "name_replace_error"
    }
  }
  else if [shost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{shost}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{shost}"
        "has_principal" => "true"
      }
      on_error => "shost_replace_error"
    }
  }
  if [shost] != "" and [name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{shost}"
        "event.idm.read_only_udm.observer.asset.hostname" => "%{shost}"
      }
      on_error => "observer_host_error"
    }
  }

  if [public_ip] != "" {
    grok {
      match => {
        "public_ip" => "%{IP:public_ip}"
      }
      overwrite => ["public_ip"]
      on_error => "invalid_public_ip"
    }
    if ![invalid_public_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "public_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "public_ip"
        }
        on_error => "public_ip_merge_error"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [private_ip] != "" {
    grok {
      match => {
        "private_ip" => "%{IP:private_ip}"
      }
      overwrite => ["private_ip"]
      on_error => "invalid_private_ip"
    }
    if ![invalid_private_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "private_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "private_ip"
        }
        on_error => "private_ip_merge_error"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [src_ip] == "" {
    mutate {
      replace => {
        "src_ip" => "%{SRC}"
      }
      on_error => "no_src_ip"
    }
  }
  if [src_ip] != "" {
    grok {
      match => {
        "src_ip" => "%{IP:src_ip}"
      }
      overwrite => ["src_ip"]
      on_error => "invalid_src_ip"
    }
    if ![invalid_src_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
        }
        on_error => "src_ip_merge_error"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [src_port] == "" {
    mutate {
      replace => {
        "src_port" => "%{SPT}"
      }
      on_error => "no_src_port"
    }
  }
  if [src_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
      on_error => "src_port_replace_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "src_port_convert_error"
    }
  }

  if [dst_ip] == "" {
    mutate {
      replace => {
        "dst_ip" => "%{DST}"
      }
      on_error => "no_dst_ip"
    }
  }
  if [dst_ip] != "" {
    grok {
      match => {
        "dst_ip" => "%{IP:dst_ip}"
      }
      overwrite => ["dst_ip"]
      on_error => "invalid_dst_ip"
    }
    if ![invalid_dst_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dst_ip"
          "event.idm.read_only_udm.target.asset.ip" => "dst_ip"
        }
        on_error => "dst_ip_merge_error_found"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [dst_public_ip] != "" {
    grok {
      match => {
        "dst_public_ip" => "%{IP:dst_public_ip}"
      }
      overwrite => ["dst_public_ip"]
      on_error => "invalid_dst_public_ip"
    }
    if ![invalid_dst_public_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dst_public_ip"
          "event.idm.read_only_udm.target.asset.ip" => "dst_public_ip"
        }
        on_error => "dst_ip_merge_error"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [dst_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{dst_host}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{dst_host}"
        "has_target" => "true"
      }
      on_error => "dst_host_replace_error"
    }
  }

  if [dst_port] == "" {
    mutate {
      replace => {
        "dst_port" => "%{DPT}"
      }
      on_error => "no_dst_port"
    }
  }
  if [dst_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dst_port}"
      }
      on_error => "dst_port_replace_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "dst_port_convert_error"
    }
  }

  if [session_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{session_id}"
      }
      on_error => "session_id_replace_error"
    }
  }

  mutate {
    replace => {
      "protocol_number_src" => "%{PROTO}"
    }
    on_error => "no_ip_proto"
  }
  if [protocol_number_src] == "" and [protocol_str] != "" {
    mutate {
      replace => {
        "protocol_number_src" => "%{protocol_str}"
      }
      on_error => "no_protocol_str"
    }
  }
  if [protocol_number_src] != "" {
    mutate {
      uppercase => ["protocol_number_src"]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" =>
        "%{protocol_number_src}"
      }
      on_error => "ip_protocol_replace_error"
    }
  }

  if [pg_sev] != "" {
    mutate {
      replace => {
        "sec_result.severity_details" => "%{pg_sev}"
      }
      on_error => "sec_result_error"
    }
    if ![sec_result_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "sec_result"
        }
        on_error => "sec_result_merge_error"
      }
    }
  }

  if [kernel_uptime] != "" {
    mutate {
      replace => {
        "uptime_label.key" => "kernel_uptime"
        "uptime_label.value.string_value" => "%{kernel_uptime}"
      }
      on_error => "uptime_label_error"
    }
    if ![uptime_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "uptime_label"
        }
        on_error => "uptime_merge_error"
      }
    }
  }

  if [kv_data] =~ "(^| )DF( |$)" {
    mutate {
      replace => {
        "flag_df" => "true"
      }
    }
  }
  if [kv_data] =~ "(^| )SYN( |$)" {
    mutate {
      replace => {
        "flag_syn" => "true"
      }
    }
  }

  mutate {
    rename => {
      "pri" => "addition.syslog_priority"
      "alias" => "addition.alias"
      "interface" => "addition.interface"
      "cpu_idle" => "addition.cpu_idle"
      "memory_free" => "addition.memory_free"
      "memory_available" => "addition.memory_available"
      "memory_total" => "addition.memory_total"
      "disk_total" => "addition.disk_total"
      "disk_free" => "addition.disk_free"
      "cpu_cores" => "addition.cpu_cores"
      "total_rx_rate" => "addition.total_rx_rate"
      "total_tx_rate" => "addition.total_tx_rate"
      "total_rx_tx_rate" => "addition.total_rx_tx_rate"
      "total_rx_cum" => "addition.total_rx_cum"
      "total_tx_cum" => "addition.total_tx_cum"
      "total_rx_tx_cum" => "addition.total_rx_tx_cum"
      "conntrack_limit_exceeded" => "addition.conntrack_limit_exceeded"
      "bw_in_limit_exceeded" => "addition.bw_in_limit_exceeded"
      "bw_out_limit_exceeded" => "addition.bw_out_limit_exceeded"
      "pps_limit_exceeded" => "addition.pps_limit_exceeded"
      "linklocal_limit_exceeded" => "addition.linklocal_limit_exceeded"
      "conntrack_count" => "addition.conntrack_count"
      "conntrack_allowance_available" =>
      "addition.conntrack_allowance_available"
      "conntrack_usage_rate" => "addition.conntrack_usage_rate"
      "pg_line" => "addition.pg_session_line"
      "ike_thread" => "addition.thread_id"
      "ike_subsys" => "addition.ike_subsystem"
      "ike_conn" => "addition.ike_connection"
      "ike_spi" => "addition.spi"
      "htp_rtt" => "addition.round_trip_time"
      "htp_offset" => "addition.time_offset"
      "src_file" => "addition.source_file"
      "IN" => "addition.in"
      "OUT" => "addition.out"
      "LEN" => "addition.len"
      "TOS" => "addition.tos"
      "PREC" => "addition.prec"
      "TTL" => "addition.ttl"
      "WINDOW" => "addition.window"
      "RES" => "addition.res"
      "URGP" => "addition.urgp"
      "flag_df" => "addition.df"
      "flag_syn" => "addition.syn"
      "ID" => "addition.packet_id"
    }
  }

  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [_check] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "key_error"
      }
      if [product_event_type] == "AviatrixUser" {
        mutate {
          uppercase => ["_field.key"]
        }
      }
      mutate {
        replace => {
          "_field.value.string_value" => "%{value}"
        }
        on_error => "string_value_error"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "_field"
        }
        on_error => "addition_merge_failed"
      }
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Aviatrix"
      "event.idm.read_only_udm.metadata.product_name" =>
      "Aviatrix Cloud Network Platform"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
