# Product: Proofpoint Mail
# Category: Email Server
# Supported Format: SYSLOG+KV, JSON, SYSLOG+JSON
# Reference: NA
# Last Updated: 2026-04-09
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "messagesBlocked" => ""
      "messagesDelivered" => ""
      "clicksPermitted" => ""
      "clicksBlocked" => ""
      "message_type" => ""
      "proofpointClick" => ""
      "clicks" => ""
      "msg" => ""
      "message_type_clicks" => ""
      "queryEndTime" => ""
      "queryEndTime_value" => ""
      "eventType" => ""
      "record" => ""
      "message_field" => ""
      "record_msg" => ""
      "clickTime" => ""
      "clickIP" => ""
    }
  }
  mutate {
    gsub => ["message", '\\"\\"\\s+\\"', '"']
  }
  mutate {
    gsub => ["message", "\\\\r\\\\n", ""]
  }
  mutate {
    gsub => ["message","\\r\\n\\s+",""]
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  mutate {
    gsub => ["message", '"\"\"', '"']
  }
  mutate {
    gsub => ["message", ',,\"', ',\"']
  }
  mutate {
    gsub => ["message", "\\t", " "]
  }
  grok {
    match => {
      "message" => [
        "<%{INT}> %{GREEDYDATA:message_field}",
        "<%{INT}>%{INT} %{GREEDYDATA:message_field}"
      ]
    }
    overwrite => ["message_field"]
    on_error => "message_grok_failed"
  }
  if [message_field] != ""  {
    json {
      source => "message_field"
      array_function => "split_columns"
      on_error => "message_field_not_json"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [eventType] != "" {
    if [message_field] == "" {
      mutate {
        replace => {
          "message_field" => "%{message}"
        }
        on_error => "message_field_not_found"
      }
    }
    if [eventType] =~ "messagesBlocked" {
      mutate {
        replace => {
          "message" => "{\"messagesBlocked\":[%{message_field}]}"
        }
        on_error => "messagesBlocked_message_not_found"
      }
    }
    if [eventType] =~ "messagesDelivered" {
      mutate {
        replace => {
          "message" => "{\"messagesDelivered\":[%{message_field}]}"
        }
        on_error => "messagesDelivered_message_not_found"
      }
    }
    if [eventType] =~ "clicksPermitted" {
      mutate {
        replace => {
          "message" => "{\"clicksPermitted\":[%{message_field}]}"
        }
        on_error => "clicksPermitted_message_not_found"
      }
    }
    if [eventType] =~ "clicksBlocked" {
      mutate {
        replace => {
          "message" => "{\"clicksBlocked\":[%{message_field}]}"
        }
        on_error => "clicksBlocked_message_not_found"
      }
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
  }
  if ![not_json] {
    if [messagesBlocked] != "" {
      mutate {
        replace => {
          "message_type" => "messagesBlocked"
          "event_type" => "EMAIL_TRANSACTION"
        }
      }
      for msg in messagesBlocked {
        if [msg] != "" {
  mutate {
    replace => {
      "event1" => ""
      "phishScore_label" => ""
      "spamScore_label" => ""
      "quarantineFolder_label" => ""
      "additional_headerFrom" => ""
      "headerReplyTo_label" => ""
      "about" => ""
      "security_result" => ""
      "head" => ""
      "tail" => ""
      "subj" => ""
      "additional_messageSize" => ""
      "impostor_score_label" => ""
      "malware_score_label" => ""
      "msg_id_label" => ""
      "messageTime_label" => ""
      "QID_label" => ""
      "cluster_label" => ""
      "xmailer_label" => ""
      "intermediary" => ""
      "security_result_rule_name" => ""
      "identity_label" => ""
      "trafficType" => ""
      "maliciousMessages_label" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "context_data_available" => ""
      "observation_data_available" => ""
      "highRisk_label" => ""
      "security_action" => ""
      "trafficType_label" => ""
      "accountType_label" => ""
      "deliveredMessages_label" => ""
      "PolicyRoutes_event_data_available" => "false"
      "msg_sender" => ""
      "has_email" => "false"
      "security_action_details" => ""
      "msg_quarantineRule" => ""
      "msg_eventTime" => ""
      "msg_messageTime" => ""
      "msg_suborgs_sender" => ""
      "msg_suborgs_sender_label" => ""
      "msg_completelyRewritten_var" => ""
      "completelyRewritten_detection_fields" => ""
    }
  }
  mutate {
    replace => {
      "event1.idm.read_only_udm.metadata.product_log_id" => "%{msg.GUID}"
    }
    on_error => "guid_is_not_present"
  }
  if [guid_is_not_present] {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_log_id" => "%{msg.guid}"
      }
      on_error => "guid_is_not_present"
    }
  }

  mutate {
    replace => {
      "policy_router_label" => ""
    }
    on_error => "policy_router_label_not_present"
  }
  for idx,policy in msg.policyRoutes {
    mutate {
      replace => {
        "value_array" => ""
      }
      on_error => "policy_is_not_present"
    }
    mutate {
      replace => {
        "value_array.string_value" => "%{policy}"
      }
      on_error => "policy_router_label_empty"
    }
    mutate {
      merge => {
        "policy_router_label.value.list_value.values" => "value_array"
      }
      on_error => "policy_router_label_not_found"
    }
    if [value_array] != "" {
      mutate {
        replace => {
          "PolicyRoutes_event_data_available" => "true"
        }
      }
    }
  }
  if [PolicyRoutes_event_data_available] == "true" {
    mutate {
      replace => {
        "policy_router_label.key" => "PolicyRoutes"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "policy_router_label"
      }
      on_error => "policy_router_label_field_not_found"
    }
  }
  mutate {
    replace => {
      "event1.idm.read_only_udm.network.email.from" => "%{msg.sender}"
    }
    on_error => "sender_is_not_present"
  }
  if ![sender_is_not_present] {
    mutate {
      replace => {
        "has_email" => "true"
      }
    }
  }
  for from in msg.fromAddress {
    grok {
      match => {
        "from" => ["%{DATA}@%{GREEDYDATA:sender_domain}"]
      }
      on_error => "invalid_from_email"
      overwrite => ["sender_domain"]
    }
    if ![invalid_from_email] {
     mutate {
        replace => {
          "event1.idm.read_only_udm.principal.domain.name" => "%{sender_domain}"
        }
        on_error => "invalid_domain"
      }
    }

    if [from] =~ "^(.){1,253}$" and [from] =~ "(^.+@.+$)" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.user.email_addresses" => "from"
        }
        on_error => "invalid_from_email"
      }
      if ![invalid_from_email] {
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
      if ![sender_is_not_present] && [msg][sender] == "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.network.email.from" => "%{from}"
          }
          on_error => "from_email_is_not_present"
        }
        if ![from_email_is_not_present] {
          mutate {
            replace => {
              "has_email" => "true"
            }
          }
        }
      }
    }
  }
  for to in msg.toAddresses {
    if [to] != "" and [to] =~ "@" and [to] =~ "^(.){1,253}$" and [to] =~ "(^.+@.+$)" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.user.email_addresses" => "to"
        }
        on_error => "invalid_to_email"
      }
      if ![invalid_to_email] {
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
    }
  }
  for cc in msg.ccAddresses {
    if [cc] != "" and [cc] =~ "@" and [cc] =~ "^(.){1,253}$" {
      mutate {
        merge => {
          "intermediary.user.email_addresses" => "cc"
        }
        on_error => "invalid_ccAddress"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event1.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  mutate {
    gsub => ["msg.messageID","<|>",""]
  }
  mutate {
    replace => {
      "event1.idm.read_only_udm.network.email.mail_id" => "%{msg.messageID}"
    }
    on_error => "messageid_is_not_present"
  }
  if ![messageid_is_not_present] {
    mutate {
      replace => {
        "has_email" => "true"
      }
    }
  }
  for index,msgPart in msg.messageParts {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_is_not_present"
    }
    mutate {
      replace => {
        "about" => ""
        "disposition_label" => ""
        "sandboxStatus_label" => ""
        "contentType_label" => ""
        "oContentType_label" => ""
      }
    }
    mutate {
      replace => {
        "about.file.full_path" => "%{msgPart.filename}"
      }
      on_error => "filename_not_present"
    }
    mutate {
      replace => {
        "about.file.mime_type" => "%{msgPart.contentType}"
      }
      on_error => "no_content_type"
    }
    mutate {
      replace => {
        "about.file.sha256" => "%{msgPart.sha256}"
      }
      on_error => "sha256_not_present"
    }
    mutate {
      replace => {
        "about.file.md5" => "%{msgPart.md5}"
      }
      on_error => "md5_not_present"
    }
    mutate {
      replace => {
        "disposition_label.value.string_value" => "%{msgPart.disposition}"
      }
      on_error => "disposition_value_not_present"
    }
    if ![disposition_value_not_present] and [disposition_label][value][string_value] != "" {
      mutate {
        replace => {
          "disposition_label.key" => "disposition %{index}"
        }
        on_error => "disposition_key_not_present"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "disposition_label"
        }
        on_error => "disposition_label_not_present"
      }
    }
    mutate {
      replace => {
        "sandboxStatus_label.value.string_value" => "%{msgPart.sandboxStatus}"
      }
      on_error => "sandboxStatus_value_not_present"
    }
    if ![sandboxStatus_value_not_present] and [sandboxStatus_label][value][string_value] != "" {
      mutate {
        replace => {
          "sandboxStatus_label.key" => "sandboxStatus %{index}"
        }
        on_error => "sandboxStatus_key_not_present"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "sandboxStatus_label"
        }
        on_error => "sandboxStatus_label_not_present"
      }
    }
    mutate {
      replace => {
        "oContentType_label.value.string_value" => "%{msgPart.oContentType}"
      }
      on_error => "oContentType_value_not_present"
    }
    if ![oContentType_value_not_present] and [oContentType_label][value][string_value] != "" {
      mutate {
        replace => {
          "oContentType_label.key" => "oContentType %{index}"
        }
        on_error => "oContentType_key_not_present"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "oContentType_label"
        }
        on_error => "oContentType_label_not_present"
      }
    }
    if [about] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.about" => "about"
        }
        on_error => "about_not_present"
      }
    }
  }

  mutate {
      gsub => ["msg.headerFrom", "<|>", " "]
  }
  mutate {
    replace =>  {
      "header_from" => ""
      "head" => ""
      "tail" => ""
    }
  }
  mutate {
    replace => {
      "header_from" => "%{msg.headerFrom}"
    }
    on_error => "no_header"
  }
  grok {
    match => {
      "header_from" => [
        "%{GREEDYDATA}\\?%{DATA:head}\\?=%{DATA}%{EMAILADDRESS:tail}",
        "%{GREEDYDATA:head} \\s*%{EMAILADDRESS:tail}%{GREEDYDATA}",
        "%{GREEDYDATA:head}"
      ]
    }
    overwrite => [ "head", "tail"]
    on_error => "grokparsefailed"
  }
  mutate {
    replace => {
      "header_from" => "%{head} %{tail}"
    }
    on_error => "no_headerfrom"
  }
  if ![no_headerfrom] and [header_from] != " " {
    mutate {
      replace => {
        "additional_headerFrom.value.string_value" => "%{header_from}"
        "additional_headerFrom.key" => "headerFrom"
      }
      on_error => "headerFrom_not_present"
    }
    if ![headerFrom_not_present] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "additional_headerFrom"
        }
        on_error => "headerFrom_merge_error"
      }
    }
  }
  mutate {
    gsub => ["msg.headerReplyTo","<|>",""]
  }
  mutate {
    replace => {
      "headerReplyTo" => ""
      "head" => ""
      "tail" => ""
    }
  }
  mutate {
    replace => {
      "headerReplyTo" => "%{msg.headerReplyTo}"
    }
    on_error => "no_headerReplyTo"
  }
  grok {
    match => {
      "headerReplyTo" => [
        "%{GREEDYDATA}\\?%{DATA:head}\\?=%{DATA}%{EMAILADDRESS:tail}",
        "%{GREEDYDATA:head} \\s*%{EMAILADDRESS:tail}%{GREEDYDATA}",
        "%{GREEDYDATA:head}"
      ]
    }
    overwrite => [ "head", "tail"]
    on_error => "grokparsefailed"
  }
  mutate {
    replace => {
      "headerReplyTo" => "%{head} %{tail}"
    }
    on_error => "no_headerReplyTo"
  }
  if ![no_headerReplyTo] and [headerReplyTo] != " " {
    mutate {
      replace => {
        "headerReplyTo_label.value.string_value" => "%{headerReplyTo}"
      }
      on_error => "headerReplyTo_is_not_present"
    }
    if ![headerReplyTo_is_not_present] and [headerReplyTo_label][value][string_value] != " " {
      mutate {
        replace => {
          "headerReplyTo_label.key" => "headerReplyTo"
        }
        on_error => "headerReplyTo_key_not_present"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "headerReplyTo_label"
        }
        on_error => "headerReplyTo_merge_error"
      }
    }
  }
  mutate {
    convert => {
      "msg.id" => "string"
    }
    on_error => "no_msg_id"
  }
  mutate {
    replace => {
      "msg_id_label.value.string_value" => "%{msg.id}"
    }
    on_error => "no_msg_id"
  }
  if ![no_msg_id] and [msg_id_label][value][string_value] != "" {
    mutate {
      replace => {
        "msg_id_label.key" => "id"
      }
      on_error => "no_msg_id_key"
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "msg_id_label"
      }
      on_error => "no_msg_id_merge"
    }
  }
  for index,module in msg.modulesRun {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_is_not_present"
    }
    mutate {
      replace => {
        "module_label" => ""
      }
      on_error => "module_label_is_not_present"
    }
    mutate {
      replace => {
        "module_label.value.string_value" => "%{module}"
      }
      on_error => "no_module_label"
    }
    if ![no_module_label] {
      mutate {
        replace => {
          "module_label.key" => "[modulesRun][%{index}]"
        }
        on_error => "no_module_label_key"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "module_label"
        }
        on_error => "module_merge_error"
      }
    }
  }

  mutate {
    convert => {
      "msg.messageSize" => "string"
    }
    on_error => "messageSize_is_not_present"
  }
  mutate {
    replace => {
      "additional_messageSize.value.number_value" => "%{msg.messageSize}"
    }
    on_error => "messageSize_is_not_present"
  }
  mutate {
    convert => {
      "additional_messageSize.value.number_value" => "float"
    }
    on_error => "messageSize_convert_error"
  }
  if ![messageSize_is_not_present] {
    mutate {
      replace => {
        "additional_messageSize.key" => "messageSize"
      }
      on_error => "messageSize_key_error"
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_messageSize"
      }
      on_error => "messageSize_merge_error"
    }
  }
  for msgrecipient in msg.recipient {
    if [msgrecipient] =~ "(^.+@.+$)" and [msgrecipient] =~ "^(.){1,253}$" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.network.email.to" => "msgrecipient"
        }
        on_error => "msgrecipient_is_not_present"
      }
      if ![msgrecipient_is_not_present] {
        mutate {
          replace => {
            "has_email" => "true"
          }
        }
      }
    }
  }

  for msgreplyto in msg.replyToAddress {
    mutate {
      replace => {
        "additional_replyto" => ""
      }
      on_error => "msgreplyto_replace_present"
    }
    if [msgreplyto] =~ "^[^@]{1,60}@.+$" and [msgreplyto] !~ "," {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.email.reply_to" => "%{msgreplyto}"
        }
        on_error => "msgreplyto_is_not_present"
      }
      if ![msgreplyto_is_not_present] {
        mutate {
          replace => {
            "has_email" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "additional_replyto.value.string_value" => "%{msgreplyto}"
        }
        on_error => "msgreplyto_field_not_present"
      }
      if ![msgreplyto_field_not_present] and [additional_replyto][value][string_value] != "" {
        mutate {
          replace => {
            "additional_replyto.key" => "replyTo"
          }
          on_error => "msgreplyto_key_not_present"
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "additional_replyto"
          }
          on_error => "msgreplyto_merge_error"
        }
      }
    }
  }

  mutate {
    replace => {
      "sender_ip" => "%{msg.senderIP}"
    }
    on_error => "sender_ip_is_not_present"
  }
  if ![sender_ip_is_not_present] {
    mutate {
      gsub => ["sender_ip",'\"',""]
    }
    if [sender_ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "sender_ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "sender_ip"
        }
        on_error => "sender_ip_is_not_present"
      }
    }
  }
  mutate {
    replace => {
      "subj" => "%{msg.subject}"
    }
    on_error => "no_subject"
  }
  if [subj] != "" {
    grok {
      match => {
        "subj" => [
          "^=\\?UTF-%{INT}\\?%{WORD}\\?%{GREEDYDATA:subj}\\?=$",
          "%{GREEDYDATA:subj}"
        ]
      }
      overwrite => [ "subj"]
      on_error => "subj_no_grok"
    }
    mutate {
      gsub => ["subj", "=\\?utf-8\\?B\\?", ""]
    }
    mutate {
      gsub => ["subj", "=\\?UTF-8\\?Q\\?", ""]
    }
    mutate {
      gsub => ["subj", "(?i)=\\?UTF-8\\?[QB]\\?", ""]
    }
    mutate {
      gsub => ["subj", "\\?=", ""]
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.network.email.subject" => "subj"
      }
      on_error => "subject_is_not_present"
    }
  }

  for threats in msg.threatsInfoMap {
    mutate {
      replace => {
        "security_result_category" => ""
        "security_result_status" => ""
        "security_result" => ""
        "detectionType_label" => ""
        "threatTime_label" => ""
        "threats_classification" => ""
        "threats_threatStatus" => ""
        "threats_threatType" => ""
        "threats_threat" => ""
        "threats_threatID" => ""
        "threats_threatUrl" => ""
        "threats_campaignID" => ""
      }
    }
    mutate {
      replace => {
        "threats_classification" => "%{threats.classification}"
      }
      on_error => "threats_classification_replace_failed"
    }
    mutate {
      lowercase => [ "threats_classification"]
    }
    for actor in threats.actors {
      mutate {
        replace => {
          "actor_id_label" => ""
          "actor_name_label" => ""
          "actor_type_label" => ""
        }
      }
      mutate {
        replace => {
          "actor_id_label.value" => "%{actor.id}"
        }
        on_error => "actor_id_failed"
      }
      if ![actor_id_failed] and [actor_id_label][value] != "" {
        mutate {
          replace => {
            "actor_id_label.key" => "actor_id"
          }
          on_error => "actor_id_key_failed"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "actor_id_label"
          }
          on_error => "actor_id_merge_failed"
        }
      }
      mutate {
        replace => {
          "actor_name_label.value" => "%{actor.name}"
        }
        on_error => "actor_name_failed"
      }
      if ![actor_name_failed] and [actor_name_label][value] != "" {
        mutate {
          replace => {
            "actor_name_label.key" => "actor_name"
          }
          on_error => "actor_name_key_failed"
        }
        if ![actor_name_key_failed] {
          mutate {
            merge => {
