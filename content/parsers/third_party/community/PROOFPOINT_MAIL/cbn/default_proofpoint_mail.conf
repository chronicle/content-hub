        }
      }
      else if [classifier] == "parse_limit" or [classifier] == "scan_limit" {
        mutate {
          replace => {
            "category" => "EXPLOIT"
          }
        }
        mutate {
          merge => {
            "security_result.category" => "category"
          }
        }
      }
      else {
        mutate {
          replace => {
            "category" => "UNKNOWN_CATEGORY"
          }
        }
        mutate {
          merge => {
            "security_result.category" => "category"
          }
        }
      }
    }
    if [hops-ip] != "" or [lip] != "" {
      if [hops-ip] != "" {
        mutate {
          merge => {
            "intermediary.ip" => "hops-ip"
          }
          on_error => "hops-ip_not_found"
        }
      }
      if [lip] != "" {
        mutate {
          merge => {
            "intermediary.ip" => "lip"
          }
          on_error => "lip_not_found"
        }
        mutate {
          merge => {
            "intermediary.asset.ip" => "lip"
          }
          on_error => "lip_intermediary_asset_ip_not_found"
        }
      }
    }
    if [relay] != "" {
      grok {
        match => {
          "relay" => [ "%{DATA:intermediary_hostname} \\[%{IP:intermediary_ip}\\]"
                       "%{GREEDYDATA:intermediary_hostname}"
                     ]
        }
        overwrite => ["intermediary_hostname","intermediary_ip"]
      }
      if [intermediary_ip] != "" {
        mutate {
          merge => {
            "intermediary_relay.ip" => "intermediary_ip"
          }
          on_error => "intermediary_ip_not_found"
        }
        mutate {
          merge => {
            "intermediary_relay.asset.ip" => "intermediary_ip"
          }
          on_error => "intermediary_ip_not_found"
        }
      }
      if [intermediary_hostname] != "" {
        mutate {
          replace => {
            "intermediary_relay.hostname" => "%{intermediary_hostname}"
          }
          on_error => "intermediary_hostname_not_found"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.intermediary" => "intermediary_relay"
        }
      }
    }
    if [policy] == "inbound" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.direction" => "INBOUND"
        }
      }
    }
    else if [policy] == "outbound" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.direction" => "OUTBOUND"
        }
      }
    }
    if [verify] != "" or [tls_verify] != "outbound" {
      if [verify] != "" {
        mutate {
          replace => {
            "tls_verify" => "%{verify}"
          }
        }
      }
      if [tls_verify] == "FAIL" {
        mutate {
          replace => {
            "security_action_details" => "BLOCK"
          }
        }
      }
      else if [tls_verify] == "OK" {
        mutate {
          replace => {
            "security_action_details" => "ALLOW"
          }
        }
      }
    }
    if [msg] != "" {
      mutate {
        gsub => ["msg",'\"',""]
      }
      mutate {
        replace => {
          "security_result.description" => "%{msg}"
        }
      }
    }
    else if [err] != "" {
      mutate {
        gsub => ["err",'\"',""]
      }
      mutate {
        replace => {
          "security_result.description" => "%{err}"
        }
      }
    }
    else if [result_detail] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{result_detail}"
        }
      }
    }
    else if [tls-alert] != "" {
      mutate {
        gsub => ["tls-alert",'\"',""]
      }
      mutate {
        replace => {
          "security_result.description" => "%{tls-alert}"
        }
      }
    }
    if [result] == "pass" {
      mutate {
        replace => {
          "security_action_details" => "ALLOW"
        }
      }
    }
    else if [result] == "fail" or [result] == "failure" {
      mutate {
        replace => {
          "security_action_details" => "BLOCK"
        }
      }
    }
    if [virusthreatid] not in ["","unknown"] {
      mutate {
        gsub => ["virusthreatid",'\"',""]
      }
      mutate {
        replace => {
          "security_result.threat_id" => "%{virusthreatid}"
        }
        on_error => "virusthreatid_not_found"
      }
    }
    if [virusthreat] not in ["","unknown"] {
      mutate {
        replace => {
          "security_result.threat_name" => "%{virusthreat}"
        }
        on_error => "virusthreat_not_found"
      }
    }
    if [dnsid] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dns.id" => "%{dnsid}"
        }
        on_error => "dnsid_not_found"
      }
      mutate {
        convert => {
          "event1.idm.read_only_udm.network.dns.id" => "uinteger"
        }
        on_error => "dnsid_not_found"
      }
    }
    if [dict] != "" {
      mutate {
        replace => {
          "category_details" => "%{dict}"
        }
        merge => {
          "security_result.category_details" => "category_details"
        }
      }
    }
    if [log_level] in [ "err", "warn" ] {
      mutate {
        replace => { "security_result.severity" => "HIGH" }
      }
    }
    else if [log_level] == "note" {
      mutate {
        replace => { "security_result.severity" => "MEDIUM" }
      }
    }
    else if [log_level] in [ "rprt", "info" ] {
      mutate {
        replace => { "security_result.severity" => "LOW" }
      }
    }
    if [log_level] != "" {
      mutate {
        replace => { "security_result.severity_details" => "%{log_level}" }
      }
    }
    if [mod] != "" {
      if [mod] =~ "smtpsrv" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.network.application_protocol" => "SMTP"
          }
          on_error => "smtp_not_found"
        }
        mutate {
          replace => {
            "has_SMTP_protocol" => "true"
          }
        }
      }
      mutate {
        replace => {
          "additional_mod.key" => "module"
          "additional_mod.value.string_value" => "%{mod}"
        }
        on_error => "mod_not_found"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "additional_mod"
        }
        on_error => "mod_label_not_found"
      }
    }
    if [status] != "" {
      mutate {
        gsub => ["status",'\\"',""]
      }
      mutate {
        replace => {
          "additional_sts.key" => "status"
          "additional_sts.value.string_value" => "%{status}"
        }
        on_error => "status_not_found"
      }
      if ![status_not_found] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "additional_sts"
          }
          on_error => "status_label_not_found"
        }
      }
    }
    else if [stat] != "" {
      mutate {
        replace => {
          "additional_stat.key" => "status"
          "additional_stat.value.string_value" => "%{stat}"
        }
        on_error => "stat_not_found"
      }
      if ![stat_not_found] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "additional_stat"
          }
        }
      }
    }
    mutate {
      gsub => ["msghold_response", '\\"', ""]
    }
    mutate {
      gsub => ["token", '\\"', ""]
    }
    mutate {
      gsub => ["definitions", '\\"', ""]
    }
    mutate {
      gsub => ["X-Proofpoint-Spam-Details",'\\"',""]
    }
        if [quarantineFolder] != "" {
      if [quarantineFolder] == "Low Priority" {
         mutate {
          replace => {
            "security_result.priority" => "LOW_PRIORITY"
          }
          on_error => "invalid_quarantine_folder"
        }
      }
      else if [quarantineFolder] == "High Priority" {
        mutate {
          replace => {
            "security_result.priority" => "HIGH_PRIORITY"
          }
          on_error => "invalid_quarantine_folder"
        }
      }
      else {
        mutate {
          rename => {
            "quarantineFolder" => "addition.quarantineFolder"
          }
        }
      }
    }
    mutate {
      rename => {
        "modulesRun" => "addition.modulesRun"
        "msghold_response" => "addition.msghold_response"
        "len" => "addition.len"
        "daemon" => "addition.daemon"
        "STARTTLS" => "addition.STARTTLS"
        "bits" => "addition.bits"
        "clickTime" => "addition.clickTime"
        "scope" => "addition.scope"
        "pss" => "addition.pss"
        "rss" => "addition.rss"
        "cipher_bits" => "addition.cipher_bits"
        "expires" => "addition.expires"
        "sys" => "addition.sys"
        "token" => "addition.token"
        "elapsed" => "addition.elapsed"
        "nrcpts" => "addition.nrcpts"
        "X-Proofpoint-Spam-Details" => "addition.X-Proofpoint-Spam-Details"
        "default" => "addition.default"
        "mlxscore" => "addition.mlxscore"
        "bulkscore" => "addition.bulkscore"
        "reason" => "addition.reason"
        "scancount" => "addition.scancount"
        "adjust" => "addition.adjust"
        "priorityscore" => "addition.priorityscore"
        "lowpriorityscore" => "addition.lowpriorityscore"
        "clxscore" => "addition.clxscore"
        "suspectscore" => "addition.suspectscore"
        "tests" => "addition.tests"
        "restquery_stage" => "addition.restquery_stage"
        "definitions" => "addition.definitions"
        "vendor" => "addition.vendor"
        "x" => "addition.x"
        "a" => "addition.a"
        "corrupted" => "addition.corrupted"
        "type" => "addition.type"
        "url_count" => "addition.url_count"
        "duration" => "addition.duration"
        "protected" => "addition.protected"
        "virtual" => "addition.virtual"
        "id" => "addition.id"
        "delay" => "addition.delay"
        "xdelay" => "addition.xdelay"
        "pri" => "addition.pri"
        "dsn" => "addition.dsn"
        "reply" => "addition.reply"
        "messageTime" => "addition.messageTime"
        "messageSize" => "addition.messageSize"
        "cluster" => "addition.cluster"
        "adultscore" => "addition.adultscore"
        "attachments" => "addition.attachments"
        "routes" => "addition.routes"
        "notroutes" => "addition.notroutes"
        "eid" => "addition.eid"
        "qid" => "addition.qid"
        "cid" => "addition.cid"
        "querydepth" => "addition.querydepth"
        "selector" => "addition.selector"
        "profile" => "addition.profile"
        "folder" => "addition.folder"
        "result" => "addition.result"
        "policyRoutes" => "addition.policyRoutes"
        "malwareScore" => "addition.malwareScore"
        "impostorScore" => "addition.impostorScore"
        "spamscore" => "addition.spamscore"
        "phishscore" => "addition.phishscore"
        "xmailer" => "addition.xmailer"
        "threatTime" => "addition.threatTime"
        "module" => "addition.modules"
        "msgs" => "addition.msgs"
        "resolve" => "addition.resolve"
        "reverse" => "addition.reverse"
        "clx_result_group" => "addition.clx_result_group"
        "clx_score" => "addition.clx_score"
        "clx_shade" => "addition.clx_shade"
        "priority_score" => "addition.priority_score"
        "impostor_score" => "addition.impostor_score"
        "score" => "addition.score"
        "threshold" => "addition.threshold"
        "lint" => "addition.lint"
        "warn" => "addition.warn"
        "reject" => "addition.reject"
        "helo" => "addition.helo"
        "sendmail_queue_id" => "addition.sendmail_queue_id"
        "envid" => "addition.envid"
        "query" => "addition.query"
        "rcode" => "addition.rcode"
      }
    }
    for key, value in addition map {
      mutate {
        replace => {
          "map_field" => ""
        }
        on_error => "map_field_empty"
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "value_conversion_error"
      }
      mutate {
        replace => {
          "map_check" => "%{value}"
        }
        on_error => "no_value"
      }
      if ![no_value] and [value] != "" {
        mutate {
          replace => {
            "map_field.key" => "%{key}"
          }
          on_error => "key_not_found"
        }
        if [key] in ["impostor_score","priority_score","helo","lint","malwareScore", "impostorScore", "quarantineFolder","spamscore", "phishscore", "xmailer","threatTime"] {
          mutate {
            replace => {
              "map_field.value" => "%{value}"
            }
            on_error => "map_value_security_result_not_found"
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "map_field"
            }
            on_error => "addition_security_result_merge_failed"
          }
        }
        else {
          mutate {
            replace => {
              "map_field.value.string_value" => "%{value}"
            }
            on_error => "map_value_additional_fields_not_found"
          }
          mutate {
            merge => {
              "event1.idm.read_only_udm.additional.fields" => "map_field"
            }
            on_error => "addition_additional_fields_merge_failed"
          }
        }
      }
    }
    if [security_action_details] != "" {
        mutate {
          merge => {
            "security_result.action" => "security_action_details"
          }
        }
      }
    if [security_result] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
    if [intermediary] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.intermediary" => "intermediary"
        }
      }
    }
    if [has_email_details] == "true" or [has_SMTP_protocol] == "true"{
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
        }
      }
    }
    else if [has_email_id] == "true" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "EMAIL_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else  {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
    if [message_grok_fail] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_name" => "TAP"
        "event1.idm.read_only_udm.metadata.vendor_name" => "PROOFPOINT"
      }
    }
    mutate {
      merge => {
        "@output" => "event1"
      }
    }
  }
}
