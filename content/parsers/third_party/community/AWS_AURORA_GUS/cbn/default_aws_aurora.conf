    replace => {
      "message_type" => "%{target.messageType}"
    }
    on_error => "target_messageType_replace_failed"
  }
  if [message_type] != "" {
    mutate {
      replace => {
        "messageType_label.key" => "message_type"
        "messageType_label.value" => "%{message_type}"
      }
      on_error => "messageType_replace_failed"
    }
    if ![messageType_replace_failed] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "messageType_label"
        }
        on_error => "messageType_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "version" => "%{target.@version}"
    }
    on_error => "target_version_replace_failed"
  }
  if [version] != "" {
    mutate {
      replace => {
        "version_label.key" => "version"
        "version_label.value.string_value" => "%{version}"
      }
      on_error => "version_replace_failed"
    }
    if ![version_replace_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "version_label"
        }
        on_error => "version_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "additional_messageType.value" => "%{target.logEvents.messageType}"
    }
    on_error => "messageType_empty"
  }
  if ![messageType_empty] {
    mutate {
      replace => {
        "additional_messageType.key" => "messageType"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_messageType"
      }
      on_error => "additional_messageType_empty"
    }
  }

  mutate{
    replace => {
      "owner" => "%{target.owner}"
     }
     on_error => "target_owner_replace_failed"
  }
  if [owner] != "" {
    mutate {
      replace => {
        "owner_label.key" => "owner"
        "owner_label.value" => "%{owner}"
      }
      on_error => "owner_replace_failed"
    }
    if ![owner_replace_failed] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "owner_label"
        }
        on_error => "owner_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "additional_owner.value" => "%{target.logEvents.owner}"
    }
    on_error => "owner_empty"
  }
  if ![owner_empty] {
    mutate {
      replace => {
        "additional_owner.key" => "owner"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "additional_owner"
      }
      on_error => "additional_owner_empty"
    }
  }

  for logevent in target.logEvents.logEvents {
    mutate {
      replace => {
        "src_ip" => ""
        "src_data" => ""
        "logevent_message" => ""
        "logevent_id" => ""
        "logevent_timestamp" => ""
      }
    }
    mutate {
      replace => {
        "logevent_message.value" => "%{logevent.message}"
      }
      on_error => "message_empty"
    }
    if ![message_empty] {
      mutate {
        replace => {
          "logevent_message.key" => "message"
        }
      }
      mutate {
        merge => {
          "sr.detection_fields" => "logevent_message"
        }
        on_error => "logevent_message_empty"
      }
    }

    mutate {
      convert => {
        "logevent.timestamp" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "logevent_timestamp.value" => "%{logevent.timestamp}"
      }
      on_error => "timestamp_empty"
    }
    if ![timestamp_empty] {
      mutate {
        replace => {
          "logevent_timestamp.key" => "timestamp"
        }
      }
      mutate {
        merge => {
          "sr.detection_fields" => "logevent_timestamp"
        }
        on_error => "logevent_timestamp_empty"
      }
    }

    mutate {
      replace => {
        "logevent_id.value" => "%{logevent.id}"
      }
      on_error => "id_empty"
    }
    if ![id_empty] {
      mutate {
        replace => {
          "logevent_id.key" => "id"
        }
      }
      mutate {
        merge => {
          "sr.detection_fields" => "logevent_id"
        }
        on_error => "logevent_id_empty"
      }
    }

    grok {
      match => {
        "logevent.message" => "%{DATA:time_unix},%{DATA},%{DATA:user},%{IPORHOST:src_data},%{INT},%{INT},%{DATA:operation},%{DATA},%{DATA},"
      }
      overwrite => ["time_unix", "src_data", "operation", "user"]
      on_error => "grok_fail"
    }

    if [src_data] != "" {
      grok {
        match => {
          "src_data" => "%{IP:src_ip}"
        }
        overwrite => ["src_ip"]
        on_error => "src_data_failure"
      }
      if ![src_data_failure] {
        mutate {
          merge => {
            "principal.ip" => "src_ip"
          }
          on_error => "src_ip_empty"
        }
        mutate {
          replace => {
            "metadata_event_type" => "STATUS_UPDATE"
          }
        }
      }
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
        "has_principal_user" => "true"
      }
      on_error => "userid_empty"
    }
  }
  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
        "has_principal_user" => "true"
      }
      on_error => "userid_replace_failed"
    }
  }

  mutate {
    replace => {
      "temp_data" => "%{database}"
    }
    on_error => "no_database"
  }
  if ![no_database] and [temp_data] != "" {
    mutate {
      replace => {
        "target_data.resource.name" => "%{database}"
      }
      on_error => "PASS"
    }
  }
  mutate {
    gsub => [ "command_line", '/', ',']
  }
  mutate {
    replace => {
      "principal.resource.name" => "%{hostname}"
    }
    on_error => "no_hostname_1"
  }
  mutate {
    replace => {
      "temp_data" => "%{userid}"
    }
    on_error => "no_userid"
  }
  if ![no_userid] and [temp_data] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{userid}"
        "has_principal_user" => "true"
      }
      on_error => "no_userid"
    }
  }
  mutate {
    replace => {
      "connection_id_val" => "%{connection_id}"
    }
    on_error => "no_connection_id"
  }
  if[connection_id_val] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{connection_id}"
      }
      on_error => "no_connection_id_1"
    }
  }
  mutate {
    replace => {
      "operation_val" => "%{operation}"
    }
    on_error => "no_operation"
  }
  if [operation_val] != "" {
    mutate {
      replace => {
        "sr.summary" => "%{operation}"
      }
      on_error => "operation_not_found"
    }
  }
  if [network_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{network_id}"
      }
      on_error => "no_network_id"
    }
  }
  if [response] != "" {
    mutate {
      replace => {
        "label.key" => "response"
        "label.value" => "%{response}"
      }
      on_error => "response_not_found"
    }
    if ![response_not_found] {
      mutate {
        merge => {
          "sr.outcomes" => "label"
        }
        on_error => "PASS"
      }
    }
  }
  mutate {
    replace => {
      "principal.process.pid" => "%{query_id}"
    }
    on_error => "pid_not_found_2"
  }
  date {
    match => ["timestamp_epoch",  "UNIX_MS"]
    timezone => "GMT"
    target => "metadata.event_timestamp"
    on_error => "invalid_date_format_1"
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "AMAZON"
      "metadata.product_name" => "AURORA"
    }
  }
  mutate {
    replace => {
      "op" => "%{operation}"
    }
    on_error => "operation_empty"
  }
  if [op] =~ "CREATE" {
    mutate {
      replace => {
        "metadata_event_type" => "RESOURCE_CREATION"
      }
    }
  }
  else if [op] =~ "(DROP|TRUNCATE)" {
    mutate {
      replace => {
        "metadata_event_type" => "RESOURCE_DELETION"
      }
    }
  }
  else if [op] =~ "(SELECT|READ|QUERY)" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "metadata_event_type" => "RESOURCE_READ"
      }
    }
  }
  else if [op] =~ "(INSERT|ALTER|RENAME|WRITE)" {
    if [has_principal_user] == "true" or [has_principal_machine] == "true" or [has_principal] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "RESOURCE_WRITTEN"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata_event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "cmd" => "%{command_line}"
    }
    on_error => "no_cmd"
  }
  if [cmd] =~ "(INSERT|UPDATE|ALTER|REPLACE|alter|insert|update|replace)" {
    mutate {
      replace => {
        "metadata_event_type" => "RESOURCE_WRITTEN"
      }
    }
  }
  else if [cmd] =~ "(SELECT|select)" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "metadata_event_type" => "RESOURCE_READ"
      }
    }
  }
  else if [cmd] =~ "(DELETE|delete)" {
    mutate {
      replace => {
        "metadata_event_type" => "RESOURCE_DELETION"
      }
    }
  }
  if [metadata_event_type] == "GENERIC_EVENT" {
    if [has_principal_user] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else if [has_principal_machine] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  if [metadata_event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{metadata_event_type}"
      }
      on_error => "no_event_type_5"
    }
  }
  mutate {
    replace => {
      "principal.group.product_object_id" => "%{target.account}"
    }
    on_error => "no_account"
  }
  mutate {
    replace => {
      "principal.application" => "%{target.service}"
    }
    on_error => "no_service"
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target_data] != "" {
    mutate {
      rename => {
        "target_data" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }
  if [sr] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr"
      }
      on_error => "PASS"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

