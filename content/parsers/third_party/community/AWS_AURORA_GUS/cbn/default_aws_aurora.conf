# Product: AWS_AURORA
# Category: AWS
# Supported Format: JSON, SYSLOG
# Reference: NA
# Last Updated: 2026-04-17
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "metadata" => ""
      "principal" => ""
      "target_data" => ""
      "network" => ""
      "intermediary" => ""
      "sr" => ""
      "op" => ""
      "column6" => ""
      "column8" => ""
      "column10" => ""
      "has_principal_machine" => "false"
      "has_principal_user" => "false"
      "has_target_user" => "false"
      "metadata_event_type" => ""
      "cmd" => ""
      "response" => ""
      "event_type" => ""
      "ip" => ""
      "object_type" => ""
      "table_name" => ""
      "ip_address_2" => ""
      "temp_data" => ""
      "target_account" => ""
      "has_target_resource" => "false"
      "prin_ip" => ""
      "user" => ""
      "princ_userid" => ""
      "principal_ip" => ""
      "commandline" => ""
      "summary_1" => ""
      "princ_port" => ""
      "princ_resource_name" => ""
      "network_id" => ""
      "target_id" => ""
      "ts" => ""
      "has_principal" => "false"
      "subtype" => ""
      "process_id" => ""
      "result_key" => ""
      "desc" => ""
      "file_path" => ""
      "invalid_param" => ""
      "ts_year" => ""
      "ts_month" => ""
      "ts_day" => ""
      "ts_time" => ""
      "timezone" => ""
      "application" => ""
      "product_version" => ""
      "platform_details" => ""
      "compiler" => ""
      "architecture_bits" => ""
      "unix_socket_path" => ""
      "p_host" => ""
      "host_var" => ""
      "auth_user" => ""
      "auth_method" => ""
      "pid" => ""
      "t_userid" => ""
      "t_dbname" => ""
      "pr_port" => ""
      "connection_id_val" => ""
      "operation_val" => ""
      "application_name" => ""
      "tls_version" => ""
      "tls_cipher" => ""
      "bits" => ""
      "sec_desc" => ""
      "line" => ""
      "csv_timestamp_epoch" => ""
      "csv_hostname" => ""
      "csv_userid" => ""
      "csv_host" => ""
      "csv_connection_id" => ""
      "csv_query_id" => ""
      "csv_operation" => ""
      "csv_database" => ""
      "csv_object" => ""
      "csv_retcode" => ""
      "ms_timestamp" => ""
      "thread_id" => ""
      "log_level" => ""
      "error_code" => ""
      "component" => ""
      "ip_check" => ""
      "log_group" => ""
      "log_stream" => ""
      "owner" => ""
      "message_type" => ""
      "collected_timestamp_value" => ""
      "timestamp_value" => ""
      "user_id" => ""
      "version" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    target => "target"
    on_error => "not_json"
  }
  if [not_json] {
    grok {
      match => { "message" => [
        "^(?P<msg_prefix>.*),\"select (?P<query>.*)\",(?P<msg_suffix>.*)$"
      ]
      }
      overwrite => ["msg_prefix", "query", "msg_suffix"]
      on_error => "grok_query_extract_failed"
    }
    if ![grok_query_extract_failed] {
      if [msg_prefix] =~ "AUDIT" {
        mutate { gsub => ["query", ",", "COMMASPLIT"] }
        mutate { replace => {"message" => '%{msg_prefix},select %{query},%{msg_suffix}'} }
      } else {
        mutate { gsub => ["query", ", ", " "] }
        mutate { gsub => ["query", ",", " "] }
        mutate { replace => {"message" => '%{msg_prefix},select %{query},%{msg_suffix}'} }
      }
    } else {
      mutate {
        gsub => [ "message", ',"select ([^,]+?), (.+?)",', ',select $1 $2,' ]
      }
    }
    mutate {
      gsub => [ "message", ',"', ",/"]
    }
    mutate {
      gsub => [ "message", ';",', ","]
    }
    mutate {
      gsub => [ "message", '",([0-z]+)', "',($1)"]
    }
    mutate {
      gsub => [ "message", '\\)\\)"', ")),'"]
    }
    mutate {
      gsub => [ "message", ',"', "'"]
    }
    json {
      source => "message"
      array_function => "split_columns"
      target => "target"
      on_error => "Trouble"
    }
  }

  mutate {
    gsub => [ "target.message", '([0-9]+)\\(', "$1,"]
  }
  mutate {
    gsub => [ "target.message", '\\):', ","]
  }
  mutate {
    gsub => [ "target.message", 'UTC:', 'UTC,']
  }
  mutate {
    gsub => [ "target.message", ':\\[(.*?)\\]:', ',$1,']
  }
  mutate {
    gsub => [ "target.message", '/CREATE(.*?),', 'CREATE$1/']
  }
  mutate {
    gsub => [ "target.message", ':\\s+', ' ']
  }
  mutate {
    gsub => [ "target.message", ', ', '; ']
  }
  mutate {
    gsub => [ "target.message", ',\\\\', ';']
  }
  mutate {
    gsub => [ "target.message", '"', "'"]
  }
  mutate {
    gsub => [ "target.message", '@', ","]
  }

  csv {
    source => "target.message"
    separator => ","
    on_error => "_malformed_csv"
  }

  if [_malformed_csv] {
      grok {
        match => {
          "message" => ["^%{INT:csv_timestamp_epoch},%{DATA:csv_hostname},%{DATA:csv_userid},%{DATA:csv_host},%{INT:csv_connection_id},%{INT:csv_query_id},%{WORD:csv_operation},%{DATA:csv_database},'(?P<csv_object>.*)',%{INT:csv_retcode}"]
        }
        overwrite => ["csv_timestamp_epoch", "csv_hostname", "csv_userid", "csv_host", "csv_connection_id", "csv_query_id", "csv_operation", "csv_database", "csv_object", "csv_retcode"]
        on_error => "csv_grok_failed"
      }
      if ![csv_grok_failed] {
        grok {
          match => {
            "csv_timestamp_epoch" => "^(?<ms_timestamp>\\d{13})"
          }
          overwrite => ["ms_timestamp"]
          on_error => "grok_ts_failed"
        }
        date {
          match => ["ms_timestamp", "UNIX_MS"]
          target => "metadata.event_timestamp"
          on_error => "invalid_date_format_ms_timestamp"
        }
        if [csv_hostname] != "" {
          mutate {
            replace => {
              "intermediary.hostname" => "%{csv_hostname}"
            }
            on_error => "no_csv_hostname"
          }
        }
        if [csv_userid] != "" {
          mutate {
            replace => {
              "principal.user.userid" => "%{csv_userid}"
              "has_principal_user" => "true"
            }
            on_error => "no_csv_userid"
          }
        }
        if [csv_host] != "" {
          grok {
            match => {
              "csv_host" => "%{IP:ip_check}"
            }
            overwrite => ["ip_check"]
            on_error => "not_an_ip"
          }
          if ![not_an_ip] {
            mutate {
              merge => {
                "principal.ip" => "csv_host"
                "principal.asset.ip" => "csv_host"
              }
              on_error => "ip_merge_failed"
            }
            if ![ip_merge_failed] {
              mutate {
                replace => {
                  "has_principal" => "true"
                }
              }
            }
          } else {
            mutate {
              replace => {
                "principal.hostname" => "%{csv_host}"
                "has_principal" => "true"
              }
              on_error => "no_csv_host"
            }
          }
        }
        if [csv_connection_id] != "" {
          mutate {
            replace => {
              "network.session_id" => "%{csv_connection_id}"
            }
            on_error => "no_csv_connection_id"
          }
        }
        if [csv_query_id] != "" {
          mutate {
            replace => {
              "principal.process.pid" => "%{csv_query_id}"
            }
            on_error => "no_csv_query_id"
          }
        }
        if [csv_operation] != "" {
          mutate {
            replace => {
              "metadata.product_event_type" => "%{csv_operation}"
            }
            on_error => "no_csv_operation"
          }
        }
        if [csv_object] != "" {
          mutate {
            replace => {
              "principal.process.command_line" => "%{csv_object}"
            }
            on_error => "no_csv_object"
          }
        }
        if [csv_retcode] != "" {
          mutate {
            replace => {
              "csv_retcode_label.key" => "csv_retcode"
              "csv_retcode_label.value" => "%{csv_retcode}"
            }
            on_error => "no_csv_retcode"
          }
          if ![no_csv_retcode] {
            mutate {
              merge => {
                "sr.detection_fields" => "csv_retcode_label"
              }
              on_error => "csv_retcode_label_merge_failed"
            }
          }
        }
      } else {
      grok {
        match => {
          "message" => [
            "(?P<ts>%{TIMESTAMP_ISO8601}) %{INT:thread_id} \\[%{WORD:log_level}\\] \\[%{DATA:error_code}\\] \\[%{WORD:component}\\] %{GREEDYDATA:desc}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:%{IP:principal_ip}\\(%{POSINT:princ_port}\\):%{USER:princ_userid}@%{DATA:princ_resource_name}:\\[%{POSINT:network_id}\\]:%{WORD:type_1}:\\s+%{WORD:type_2}: %{WORD:type_3},%{GREEDYDATA:csvData}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:%{IP:principal_ip}\\(%{POSINT:princ_port}\\):%{USER:princ_userid}@%{DATA:princ_resource_name}:\\[%{POSINT:network_id}\\]:%{WORD:type_1}:\\s+%{WORD:type_2}: session time: %{DATA:session_time} (?P<kv_data>user=.*)",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:%{IP:principal_ip}\\(%{POSINT:princ_port}\\):%{USER:t_userid}@%{DATA:t_dbname}:\\[%{INT:network_id}\\]:LOG:\\s+connection authenticated: identity=\\\"%{USER:auth_user}\\\" method=%{WORD:auth_method}%{GREEDYDATA:response}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:%{IP:principal_ip}\\(%{POSINT:princ_port}\\):%{USER:princ_userid}@%{DATA:princ_resource_name}:\\[%{POSINT:network_id}\\]:%{WORD:event_type}:\\s+%{GREEDYDATA:response}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:%{IP:principal_ip}\\(%{POSINT:princ_port}\\):%{USER:princ_userid}@%{DATA:princ_resource_name}:\\[%{INT:network_id}\\]:%{DATA:product_event_type} (?<kv_data>(\\w+)=.*)",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}::@:\\[%{POSINT:network_id}\\]:%{WORD:type_1}:\\s+%{WORD:type_2}: %{WORD:type_3},%{GREEDYDATA:csvData}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:%{USER:princ_userid}@%{DATA:database}:\\[%{INT:network_id}\\]:%{WORD:event_type}:\\s+%{GREEDYDATA:desc}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:\\[%{WORD:p_host}\\]:%{USER:princ_userid}@%{DATA:database}:\\[%{INT:network_id}\\]:%{WORD:event_type}:\\s+%{GREEDYDATA:desc}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}::@:\\[%{INT:network_id}\\]:%{WORD:event_type}:\\s+%{GREEDYDATA:desc}",
            "(?<ts>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME}) %{WORD:timezone} \\[%{INT:network_id}\\] %{WORD:event_type}:\\s+%{GREEDYDATA:desc}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:\\[%{DATA:p_host}\\]:\\[%{DATA:princ_userid}\\]@\\[%{DATA:database}\\]:\\[%{INT:network_id}\\]:%{WORD:event_type}:\\s+%{GREEDYDATA:desc}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:\\[%{DATA:network_id}\\]:\\[%{DATA:princ_userid}\\]@\\[%{DATA:database}\\]:\\[%{INT:network_id}\\]:%{WORD:event_type}:\\s+%{GREEDYDATA:desc}",
            "%{TIMESTAMP_ISO8601:ts} %{TZ:timezone}:%{IP:principal_ip}\\(%{POSINT:princ_port}\\):\\[%{DATA:princ_userid}\\]@\\[%{DATA:princ_resource_name}\\]:\\[%{INT:network_id}\\]:%{WORD:event_type}:\\s+%{GREEDYDATA:desc}"
          ]
        }
        overwrite => ["ts", "timezone", "principal_ip", "princ_port", "princ_userid", "princ_resource_name", "network_id", "type_1", "type_2", "type_3", "csvData", "session_time", "event_type", "response","desc", "ts_year", "ts_month", "ts_day", "ts_time", "database", "p_host", "t_userid", "t_dbname", "auth_user", "auth_method", "thread_id", "log_level", "error_code", "component"]
        on_error => "grok_failed"
      }
    kv {
      source => "kv_data"
      field_split => " "
      value_split => "="
      on_error => "kv_data_fail"
    }
    if ![grok_failed] {
      if [response] =~ "statement: " {
        grok {
          match => {
            "response" => "statement: %{GREEDYDATA:commandline}"
          }
          overwrite => ["commandline"]
          on_error => "grok_statement_failed"
        }
      }
      if [auth_method] != "" {
        mutate {
          replace => {
            "auth_method_label.key" => "method"
            "auth_method_label.value.string_value" => "%{auth_method}"
          }
          on_error => "auth_method_empty"
        }
        if ![auth_method_empty] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "auth_method_label"
            }
            on_error => "auth_method_merge_failed"
          }
        }
      }
      if [ts] != "" {
        date {
          match => ["ts","yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-dd HH:mm:ss","ISO8601"]
          target => "metadata.event_timestamp"
          on_error => "invalid_date_format_ts"
        }
      }
      if [response] =~ "connection authorized" and [response] =~ "SSL enabled" {
        grok {
          match => {
            "response" => "%{DATA:sec_desc}: .*application_name=%{WORD:application} SSL enabled \\(protocol=%{DATA:tls_version}, cipher=%{DATA:tls_cipher}, bits=%{INT:bits}"
          }
          overwrite => ["sec_desc","application","tls_version","tls_cipher","bits"]
          on_error => "grok_sec_desc_failed"
        }
        mutate {
          replace => {
            "response" => ""
          }
          on_error => "response_clear_failed"
        }
      }
      if [response] =~ "^ \\\\(" {
        grok {
          match => {
            "response" => "^ \\((?P<file_path>.*):(?P<line>\\d+)\\)"
          }
          overwrite => ["file_path", "line"]
          on_error => "no_file_path_in_response"
        }
        if ![no_file_path_in_response] {
          mutate {
            replace => {
              "target_data.file.full_path" => "%{file_path}"
            }
            on_error => "file_path_empty"
          }
          mutate {
            replace => {
              "line_label.key" => "auth_config_line"
              "line_label.value.string_value" => "%{line}"
            }
            on_error => "line_label_empty"
          }
          if ![line_label_empty] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "line_label"
              }
              on_error => "line_label_merge_failed"
            }
          }
        }
      }
      csv {
        source => "csvData"
        separator => ","
        on_error => "csv_failed"
      }
      mutate {
        replace => {
          "metadata.product_event_type" => "%{type_1} %{type_2} %{type_3}"
        }
        on_error => "product_event_type_build_failed"
      }
      if [event_type] != "" {
        mutate {
          replace => {
            "metadata.product_event_type" => "%{event_type}"
          }
        }
      }
      if [thread_id] != "" {
        mutate {
          replace => {
            "principal.process.pid" => "%{thread_id}"
          }
          on_error => "thread_id_empty"
        }
      }
      if [log_level] != "" {
        mutate {
          replace => {
            "sr.severity_details" => "%{log_level}"
          }
          on_error => "log_level_empty"
        }
      }
      if [error_code] != "" {
        mutate {
          replace => {
            "metadata.product_log_id" => "%{error_code}"
          }
          on_error => "error_code_empty"
        }
      }
      if [component] != "" {
        mutate {
          replace => {
            "target_data.application" => "%{component}"
          }
          on_error => "component_empty"
        }
      }
    }
  }
  if [t_userid] != "" {
    mutate {
      replace => {
        "target_data.user.userid" => "%{t_userid}"
        "has_target_user" => "true"
      }
      on_error => "t_userid_empty"
    }
  }
  if [t_dbname] != "" {
    mutate {
      replace => {
        "target_data.resource.name" => "%{t_dbname}"
        "has_target_resource" => "true"
      }
      on_error => "t_dbname_empty"
    }
  }
  if [auth_user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{auth_user}"
        "has_principal_user" => "true"
      }
      on_error => "auth_user_empty"
    }
  }
  if [p_host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{p_host}"
        "principal.asset.hostname" => "%{p_host}"
        "has_principal" => "true"
      }
      on_error => "p_host_not_found"
    }
  }
  if [application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{application}"
      }
      on_error => "application_empty"
    }
  }
  if [tls_version] != "" {
    mutate {
      replace => {
        "network.tls.version" => "%{tls_version}"
      }
      on_error => "tls_version_empty"
    }
  }
  if [tls_cipher] != "" {
    mutate {
      replace => {
        "network.tls.cipher" => "%{tls_cipher}"
      }
      on_error => "tls_cipher_empty"
    }
  }
  if [bits] != "" {
    mutate {
      replace => {
        "bits_label.key" => "bits"
        "bits_label.value.string_value" => "%{bits}"
      }
      on_error => "bits_empty"
    }
    if ![bits_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "bits_label"
        }
        on_error => "bits_merge_failed"
      }
    }
  }
  if [sec_desc] != "" {
    mutate {
      replace => {
        "sr.description" => "%{sec_desc}"
      }
      on_error => "sec_desc_empty"
    }
  }
  if [princ_userid] != "" and [auth_user] == "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{princ_userid}"
        "has_principal_user" => "true"
      }
      on_error => "princ_userid_empty"
    }
  }
  if [desc] != "" {
    grok {
      match => {
        "desc" => [
          "connection authenticated: identity=\\\"%{USER:auth_user}\\\" method=%{WORD:auth_method}",
          "skipping missing configuration file \\\"(?<file_path>[^\\\"]*)\\\"",
          "invalid configuration parameter name \\\"(?<invalid_param>[^\\\"]*)\\\", removing it",
          "parameter \\\"(?<invalid_param>[^\\\"]*)\\\" removed from configuration file, reset to default",
          "listening on IPv4 address \\\"%{IP:ip}\\\", port %{INT:pr_port}",
          "listening on IPv6 address \\\"%{IP:ip}\\\", port %{INT:pr_port}",
          "listening on Unix socket \\\"(?<unix_socket_path>[^\\\"]*)\\\"",
          "configuration file \\\"(?<file_path>[^\\\"]*)\\\" contains errors;",
          "Future log output will appear in directory \\\"(?<file_path>[^\\\"]*)\\\"",
          "connection received: host=%{IP:ip} port=%{INT:pr_port}"
        ]
      }
      overwrite => ["file_path", "invalid_param", "ip", "pr_port", "unix_socket_path", "auth_user", "auth_method"]
      on_error => "grok_desc_failed"
    }
    mutate {
      replace => {
        "metadata.description" => "%{desc}"
      }
      on_error => "desc_empty"
    }
    if [auth_user] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{auth_user}"
          "has_principal_user" => "true"
        }
        on_error => "auth_user_empty_1"
      }
    }
    if [auth_method] != "" {
      mutate {
        replace => {
          "auth_method_label.key" => "method"
          "auth_method_label.value.string_value" => "%{auth_method}"
        }
        on_error => "auth_method_empty"
      }
      if ![auth_method_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "auth_method_label"
          }
          on_error => "auth_method_merge_failed"
        }
      }
    }
    if [ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "ip"
          "principal.asset.ip" => "ip"
        }
        on_error => "ip_empty"
      }
      if ![ip_empty] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
          on_error => "has_principal_machine_failed"
        }
      }
    }
    if [pr_port] != "" {
      mutate {
        replace => {
          "principal.port" => "%{pr_port}"
        }
        on_error => "port_empty"
      }
      mutate {
        convert => {
          "principal.port" => "integer"
        }
        on_error => "port_conversion_failed"
      }
    }
    if [unix_socket_path] != "" {
      mutate {
        replace => {
          "principal.file.full_path" => "%{unix_socket_path}"
        }
        on_error => "unix_socket_path_empty"
      }
    }
    if [desc] =~ "starting PostgreSQL" {
      grok {
        match => {
          "desc" => [
            "^\\s*starting %{WORD:application} %{NUMBER:product_version} on (?<platform_details>[^,]+), compiled by (?<compiler>[^,]+), %{INT:architecture_bits}-bit"
          ]
        }
        overwrite => ["application", "product_version", "platform_details", "compiler", "architecture_bits"]
        on_error => "grok_starting_postgres_failed"
      }
      if ![grok_starting_postgres_failed] {
        if [product_version] != "" {
          mutate {
            replace => {
              "metadata.product_version" => "%{product_version}"
            }
            on_error => "postgres_version_app_failed"
          }
        }
        if [application] != "" {
          mutate {
            replace => {
              "principal.application" => "%{application}"
            }
            on_error => "postgres_version_app_failed_1"
          }
        }
        if [platform_details] =~ "linux" {
          mutate {
            replace => {"principal.platform" => "LINUX"}
            on_error => "platform_failed"
          }
        }
        mutate {
          replace => {
            "platform_details_label.key" => "platform_details"
            "platform_details_label.value" => "%{platform_details}"
          }
          on_error => "platform_details_label_failed"
