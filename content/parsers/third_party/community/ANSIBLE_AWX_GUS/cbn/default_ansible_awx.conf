# Product: Ansible AWX
# Category: Automation and DevOps Tools
# Supported Format: JSON
# Reference: https://github.com/ansible/awx/blob/devel/docs/logging_integration.md
# Last Updated: 2024-06-25
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "timestamp" => ""
      "event1_data.host" => ""
      "host_name" => ""
      "host" => ""
      "event1_data.uuid" => ""
      "event1_data.remote_addr" => ""
      "event1_data.task_path" => ""
      "logger_name" => ""
      "event1" => ""
      "level" => ""
      "stream" => ""
      "host.fqdn" => ""
      "host.hostname" => ""
      "host.id" => ""
      "host.architecture" => ""
      "host.os.platform" => ""
      "host.os.version" => ""
      "host.os.kernel" => ""
      "host.os.codename" => ""
      "host.os.name" => ""
      "principal_hostname" => ""
      "cloud.availability_zone" => ""
      "cloud.instance.name" => ""
      "cloud.instance.id" => ""
      "cloud.machine.type" => ""
      "cloud.provider" => ""
      "input.type" => ""
      "log.source.address" => ""
      "agent.hostname" => ""
      "agent.type" => ""
      "agent.name" => ""
      "agent.id" => ""
      "agent.version" => ""
      "agent.ephemeral_id" => ""
      "parent_uuid" => ""
      "user_name" => ""
      "MessageTemplate" => ""
      "RenderedMessage" => ""
      "event1_data.task" => ""
      "kubernetes.host" => ""
      "kubernetes.pod_id" => ""
      "Properties.UserName" => ""
      "kubernetes.docker_id" => ""
      "Properties.ca_id" => ""
      "Properties.wf_id" => ""
      "Properties.wf_env" => ""
      "Properties.ThreadId" => ""
      "Properties.RequestId" => ""
      "Properties.ClientIP" => ""
      "Properties.Host" => ""
      "Properties.Method" => ""
      "Properties.RequestPath" => ""
      "Properties.cf_component" => ""
      "Properties.serviceNowId" => ""
      "Properties.ConnectionId" => ""
      "Properties.EndpointName" => ""
      "Properties.SourceContext" => ""
      "Properties.applicationName" => ""
      "Properties.MachineName" => ""
      "kubernetes.namespace_name" => ""
      "kubernetes.container_image" => ""
      "kubernetes.container_hash" => ""
      "kubernetes.container_name" => ""
      "event1_data.task_uuid" => ""
      "event1_display" => ""
      "intermediary" => ""
      "process_pid" => ""
      "principal_device" => ""
      "target_device" => ""
      "security_result" => ""
      "inter_hostname" => ""
      "cluster_name" => ""
      "description" => ""
      "not_json" => ""
      "json_data" => ""
      "user_present" => "false"
      "target_present" => "false"
      "principal_present" => "false"
    }
  }

  mutate {
    gsub => ["message","@timestamp","timestamp"]
  }

  mutate {
    gsub => ["message", "event", "event1"]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json_data"
  }

  if [message] =~ "ansible_devices" {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [not_json_data] {
    grok {
      match => {
        "message" => [
          "(.*Message=\\\"%{GREEDYDATA:json_data}\\\")",
          "(.*?),%{INT} %{LOGLEVEL:level} %{DATA:inter_hostname} (?P<description>Connection from %{DATA:principal_device} to %{DATA:target_device} .*)",
          "(.*?),%{INT} %{LOGLEVEL:level} (%{DATA}\\]|\\s+) %{DATA:principal_device} (?P<description>User %{DATA:user_name} .*)",
          "(.*?),%{INT} %{LOGLEVEL:level} (%{DATA}\\]|\\s+)(%{DATA:principal_device}| %{DATA:principal_device}) (PID:.* )?(?P<description>worker.* pid:%{GREEDYDATA:process_pid})",
          "(.*?),%{INT} %{LOGLEVEL:level} (%{DATA}\\]|\\s+) %{DATA:principal_device} (?P<description>.*)",
          "%{GREEDYDATA:json_data}"
        ]
      }
      overwrite => ["inter_hostname","description","principal_device","target_device","json_data","level","principal_device","user_name","process_pid"]
      on_error => "message_pattern_not_matched"
    }

    mutate {
      gsub => ["json_data", "event", "event1"]
    }
    mutate {
      gsub => ["json_data", "@timestamp", "timestamp"]
    }

    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "not_json"
    }

    if [message_pattern_not_matched] and ([not_json] or [json_data] =~ "ansible_devices") {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  if [timestamp] != "" {
    mutate {
      gsub => ["timestamp","\\,.*",""]
    }
    date {
      match => ["timestamp", "yyyy-MM-ddTHH:mm:ss.SSSZ", "RFC3339","yyyy-MM-dd HH:mm:ss","UNIX_MS"]
      on_error => "invalid_date"
    }
  }

  if [event1_data][uuid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{event1_data.uuid}"
      }
      on_error => "uuid_not_found"
    }
  }

  if [event1_data][remote_addr] != "" {
    grok {
      match => {
        "event1_data.remote_addr" => "%{IP:ip_address}"
      }
      on_error => "not_an_ip"
    }
    if ![not_an_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ip_address"
          "event.idm.read_only_udm.principal.asset.ip" => "ip_address"
        }
        on_error => "ip_address_not_found"
      }
      if not [ip_address_not_found] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{event1_data.remote_addr}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{event1_data.remote_addr}"
          "principal_present" => "true"
        }
      }
    }
  }

  if [event1_data][task_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{event1_data.task_path}"
      }
    }
  }

  if [user_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
        "user_present" => "true"
      }
      on_error => "user_name_not_found"
    }
  } else if [Properties][UserName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{Properties.UserName}"
        "user_present" => "true"
      }
      on_error => "invalid_user_name"
    }
  }

  if [process_pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{process_pid}"
      }
      on_error => "process_pid_not_found"
    }
  }

  if [logger_name] != "" {
    mutate {
      replace => {
        "intermediary.application" => "%{logger_name}"
      }
    }
    if [intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
      }
    }
  }

  if [cluster_name] != ""  {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{cluster_name}"
      }
      on_error => "cluster_name_not_found"
    }
  }

  if [kubernetes][host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{kubernetes.host}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{kubernetes.host}"
        "target_present" => "true"
      }
      on_error => "kubernetes_host_not_found"
    }
  }

  if [Properties][Host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{Properties.Host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{Properties.Host}"
        "principal_present" => "true"
      }
      on_error => "properties_host_not_found"
    }
  }

  if [event1_data][host] != "" {
    mutate {
      replace => {
        "principal_hostname" => "%{event1_data.host}"
      }
    }
  }
  else if [json_data] =~ "host.*os.*platform" {
    if [host][fqdn] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.administrative_domain" => "%{host.fqdn}"
        }
        on_error => "host_fqdn_not_found"
      }
    }

    if [host][hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{host.hostname}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{host.hostname}"
          "target_present" => "true"
        }
      }
    }

    for macs in host.mac {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.mac" => "macs"
        }
      }
    }

    for ips in host.ip {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.ip" => "ips"
        }
      }
    }

    if [host][id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.asset_id" => "Host Id: %{host.id}"
        }
        on_error => "host_id_not_found"
      }
    }


    if [host][architecture] != "" {
      mutate {
        replace => {
          "hardware.cpu_platform" => "%{host.architecture}"
        }
        merge => {
          "event.idm.read_only_udm.target.asset.hardware" => "hardware"
        }
      }
    }


    if [host][os][platform] == "debian" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.platform" => "LINUX"
        }
      }
    }

    if [host][os][version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.platform_version" => "%{host.os.version}"
        }
      }
    }

    if [host][os][kernel] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.platform_patch_level" => "%{host.os.kernel}"
        }
      }
    }

    if [host][os][codename] != "" {
      mutate {
        replace => {
          "codename_label.key" => "codename"
          "codename_label.value" => "%{host.os.codename}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "codename_label"
        }
      }
    }

    if [host][os][name] != "" {
      mutate {
        replace => {
          "os_name_label.key" => "os_name"
          "os_name_label.value" => "%{host.os.name}"
        }
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "os_name_label"
        }
      }
    }
  }
  else if [host_name] != "" {
    mutate {
      replace => {
        "principal_hostname" => "%{host_name}"
      }
    }
  }
  else if [host] != "" {
    mutate {
      replace => {
        "principal_hostname" => "%{host}"
      }
      on_error => "wrong_format"
    }
  }

  if [principal_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{principal_hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{principal_hostname}"
        "principal_present" => "true"
      }
    }
  }

  if [cloud][instance][name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{cloud.instance.name}"
        "event.idm.read_only_udm.principal.resource.resource_type" => "VIRTUAL_MACHINE"
      }
    }
  }

  if [cloud][instance][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.product_object_id" => "%{cloud.instance.id}"
      }
    }
  }

  if [cloud][machine][type] != "" {
    mutate {
      replace => {
        "machine_type.key" => "machine_type"
        "machine_type.value" => "%{cloud.machine.type}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "machine_type"
      }
    }
  }

  if [cloud][provider] != "" {
    mutate {
      replace => {
        "provider.key" => "provider"
        "provider.value" => "%{cloud.provider}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "provider"
      }
    }
  }

  if [cloud][availability_zone] != "" {
    mutate {
      replace => {
        "availability_zone.key" => "availability_zone"
        "availability_zone.value" => "%{cloud.availability_zone}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "availability_zone"
      }
    }
  }

  if [input][type] == "tcp" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "TCP"
      }
    }
  }

  mutate {
    replace => {
      "log_address" => "%{log.source.address}"
    }
    on_error => "log_address_not_found"
  }

  if [log_address_not_found] == false {
    if [log][source][address] != "" {
      grok {
        match => {
          "log.source.address" => [
            "%{IP:src_ip}:%{INT:src_port}"
            "%{IP:src_ip}"
          ]
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
        }
        on_error => "src_ip_not_found"
      }
      if not [src_ip_not_found] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{src_port}"
        }
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
      }
    }
  }

  if [Properties][ClientIP] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "Properties.ClientIP"
        "event.idm.read_only_udm.principal.asset.ip" => "Properties.ClientIP"
      }
      on_error => "invalid_clientip"
    }
    if ![invalid_clientip] {
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
    }
  }

  if [Properties][ConnectionId] != "" {
    mutate {
      replace => {
        "connectionid_label.key" => "ConnectionId"
        "connectionid_label.value" => "%{Properties.ConnectionId}"
      }
      on_error => "invalid_ConnectionId"
    }
    if not [invalid_ConnectionId] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "connectionid_label"
        }
        on_error => "invalid_ConnectionId_label"
      }
    }
  }

  if [Properties][EndpointName] != "" {
    mutate {
      replace => {
        "endpointname_label.key" => "EndpointName"
        "endpointname_label.value" => "%{Properties.EndpointName}"
      }
      on_error => "invalid_EndpointName"
    }
    if not [invalid_EndpointName] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "endpointname_label"
        }
        on_error => "invalid_EndpointName_label"
      }
    }
  }

  if [Properties][MachineName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.asset_id" => "asset id: %{Properties.MachineName}"
      }
      on_error => "invalid_MachineName"
    }
  }

  if [Properties][ca_id] != "" {
    mutate {
      replace => {
        "ca_id_label.key" => "ca_id"
        "ca_id_label.value" => "%{Properties.ca_id}"
      }
      on_error => "invalid_ca_id"
    }
    if not [invalid_ca_id] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ca_id_label"
        }
        on_error => "invalid_ca_id_label"
      }
    }
  }

  if [Properties][wf_id] != "" {
    mutate {
      replace => {
        "wf_id_label.key" => "wf_id"
        "wf_id_label.value" => "%{Properties.wf_id}"
      }
      on_error => "invalid_wf_id"
    }
    if not [invalid_wf_id] {
      mutate {
        merge => {
          "security_result.detection_fields" => "wf_id_label"
        }
        on_error => "invalid_wf_id_label"
      }
    }
  }

  if [Properties][wf_env] != "" {
    mutate {
      replace => {
        "wf_env_label.key" => "wf_env"
        "wf_env_label.value" => "%{Properties.wf_env}"
      }
      on_error => "invalid_wf_env"
    }
    if not [invalid_wf_env] {
      mutate {
        merge => {
          "security_result.detection_fields" => "wf_env_label"
        }
        on_error => "invalid_wf_env_label"
      }
    }
  }

  if [Properties][serviceNowId] != "" {
    mutate {
      replace => {
        "serviceNowId_label.key" => "serviceNowId"
        "serviceNowId_label.value" => "%{Properties.serviceNowId}"
      }
      on_error => "invalid_serviceNowId"
    }
    if not [invalid_serviceNowId] {
      mutate {
        merge => {
          "security_result.detection_fields" => "serviceNowId_label"
        }
        on_error => "invalid_serviceNowId_label"
      }
    }
  }

  if [Properties][cf_component] != "" {
    mutate {
      replace => {
        "cf_component_label.key" => "cf_component"
        "cf_component_label.value" => "%{Properties.cf_component}"
      }
      on_error => "invalid_cf_component"
    }
    if not [invalid_cf_component] {
      mutate {
        merge => {
          "security_result.detection_fields" => "cf_component_label"
        }
        on_error => "invalid_cf_component_label"
      }
    }
  }

  if [Properties][applicationName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{Properties.applicationName}"
      }
      on_error => "invalid_applicationName"
    }
  }

  if [Properties][ThreadId] != "" {
    mutate {
      replace => {
        "threadid_label.key" => "ThreadId"
        "threadid_label.value" => "%{Properties.ThreadId}"
      }
      on_error => "invalid_threadid"
    }
    if not [invalid_threadid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "threadid_label"
        }
        on_error => "invalid_threadid_label"
      }
    }
  }

  if [Properties][SourceContext] != "" {
    mutate {
      replace => {
        "sourcecontext_label.key" => "SourceContext"
        "sourcecontext_label.value" => "%{Properties.SourceContext}"
      }
      on_error => "invalid_sourcecontext"
    }
    if not [invalid_sourcecontext] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sourcecontext_label"
        }
        on_error => "invalid_sourcecontext_label"
      }
    }
  }

  if [Properties][RequestPath] != "" {
    mutate {
      replace => {
        "requestpath_label.key" => "RequestPath"
        "requestpath_label.value" => "%{Properties.RequestPath}"
      }
      on_error => "invalid_requestpath"
    }
    if not [invalid_requestpath] {
      mutate {
        merge => {
          "security_result.detection_fields" => "requestpath_label"
        }
        on_error => "invalid_requestpath_label"
      }
    }
  }

  if [Properties][RequestId] != "" {
    mutate {
      replace => {
        "requestid_label.key" => "RequestId"
        "requestid_label.value" => "%{Properties.RequestId}"
      }
      on_error => "invalid_requestid"
    }
    if not [invalid_requestid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "requestid_label"
        }
        on_error => "invalid_requestid_label"
      }
    }
  }

  if [MessageTemplate] != "" {
    mutate {
      replace => {
        "messagetemplate_label.key" => "MessageTemplate"
        "messagetemplate_label.value" => "%{MessageTemplate}"
      }
      on_error => "invalid_messagetemplate"
    }
    if not [invalid_messagetemplate] {
      mutate {
        merge => {
          "security_result.detection_fields" => "messagetemplate_label"
        }
        on_error => "invalid_messagetemplate_label"
      }
    }
  }

  if [Properties][Method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{Properties.Method}"
      }
      on_error => "invalid_method"
    }
  }

  if [agent][hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{agent.hostname}"
      }
    }
  }

  if [agent][type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.application" => "%{agent.type}"
      }
    }
  }

  if [agent][name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.user.userid" => "%{agent.name}"
      }
    }
  }

  if [agent][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.asset_id" => "%{agent.type}:%{agent.id}"
      }
    }
  }

  if [agent][version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.platform_version" => "%{agent.version}"
      }
    }
  }

  if [agent][ephemeral_id] != "" {
    mutate {
      replace => {
        "ephemeral_id_label.key" => "ephemeral_id"
        "ephemeral_id_label.value" => "%{agent.ephemeral_id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.observer.labels" => "ephemeral_id_label"
      }
    }
  }

  if [level] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{level}"
      }
    }
    mutate {
      uppercase => ["level"]
    }

    if [level] in ["DEBUG", "INFO", "AUDIT"] {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [level] == "ERROR" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [level] == "WARNING" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
  }

  if [event1_display] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{event1_display}"
      }
    }
  }

  if [parent_uuid] != "" {
    mutate {
      replace => {
        "parent_uuid_label.key" => "parent_uuid"
        "parent_uuid_label.value" => "%{parent_uuid}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "parent_uuid_label"
      }
    }
  }

  if [stream] != "" {
    mutate {
      replace => {
        "stream_label.key" => "stream"
        "stream_label.value" => "%{stream}"
      }
      on_error => "stream_not_found"
    }
    if not [stream_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "stream_label"
        }
        on_error => "stream_label_not_found"
      }
    }
  }

  if [kubernetes][namespace_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.namespace" => "%{kubernetes.namespace_name}"
      }
      on_error => "namespace_name_not_found"
    }
  }

  if [kubernetes][pod_id] != "" {
    mutate {
      replace => {
        "pod_id_label.key" => "pod_id"
        "pod_id_label.value" => "%{kubernetes.pod_id}"
      }
      on_error => "pod_id_not_found"
    }
    if not [pod_id_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "pod_id_label"
        }
        on_error => "pod_id_label_not_found"
      }
    }
  }

  if [kubernetes][container_hash] != "" {
    mutate {
      replace => {
        "container_hash_label.key" => "container_hash"
        "container_hash_label.value" => "%{kubernetes.container_hash}"
      }
      on_error => "container_hash_not_found"
    }
    if not [container_hash_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "container_hash_label"
        }
        on_error => "container_hash_label_not_found"
      }
    }
  }

  mutate {
    replace => {
      "io_name_label.value" => "%{kubernetes.labels.app.kubernetes.io/name}"
    }
    on_error => "io_name_not_found"
  }
  if not [io_name_not_found] {
    mutate {
      replace => {
        "io_name_label.key" => "kubernetes_io_name"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "io_name_label"
      }
      on_error => "io_name_label_not_found"
    }
  }

  mutate {
    replace => {
      "io_instance.value" => "%{kubernetes.labels.app.kubernetes.io/instance}"
    }
    on_error => "io_instance_not_found"
  }
  if not [io_instance_not_found] {
    mutate {
      replace => {
        "io_instance_label.key" => "kubernetes_io_instance"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "io_instance_label"
      }
      on_error => "io_instance_label_not_found"
    }
  }

  mutate {
    replace => {
      "pod_template_hash_label.value" => "%{kubernetes.labels.pod-template-hash}"
    }
    on_error => "pod_template_hash_not_found"
  }
  if not [pod_template_hash_not_found] {
    mutate {
      replace => {
        "pod_template_hash_label.key" => "pod_template_hash"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "pod_template_hash_label"
      }
      on_error => "pod_template_hash_label_not_found"
    }
  }

  if [kubernetes][container_image] != "" {
    mutate {
      replace => {
        "container_image_label.key" => "container_image"
        "container_image_label.value" => "%{kubernetes.container_image}"
      }
      on_error => "container_image_not_found"
    }
    if not [container_image_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "container_image_label"
        }
        on_error => "container_image_label_not_found"
      }
    }
  }

  if [kubernetes][container_name] != "" {
    mutate {
      replace => {
        "container_name_label.key" => "container_name"
        "container_name_label.value" => "%{kubernetes.container_name}"
      }
      on_error => "container_name_not_found"
    }
    if not [container_name_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "container_name_label"
        }
        on_error => "container_name_label_not_found"
      }
    }
  }

  if [kubernetes][docker_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset_id" => "asset id: %{kubernetes.docker_id}"
      }
      on_error => "docker_id_not_found"
    }
  }

  if [principal_device] != "" {
    grok {
      match => {
        "principal_device" => "%{IP:principal_ip}"
      }
      overwrite => ["principal_ip"]
      on_error => "principal_device_not_ip"
    }
    if [principal_device_not_ip] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{principal_device}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{principal_device}"
          "principal_present" => "true"
        }
        on_error => "principal_device_not_hostname"
      }
    } else {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "principal_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "principal_ip"
        }
        on_error => "principal_ip_not_found"
      }
      if not [principal_ip_not_found] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
    }
  }

  if [target_device] != "" {
    grok {
      match => {
        "target_device" => "%{IP:target_ip}"
      }
      overwrite => ["target_ip"]
      on_error => "target_device_not_ip"
    }
    if [target_device_not_ip] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{target_device}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{target_device}"
        }
        on_error => "target_device_not_hostname"
      }
    } else {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "target_ip"
          "event.idm.read_only_udm.target.asset.ip" => "target_ip"
        }
        on_error => "target_ip_not_found"
      }
      if not [target_ip_not_found] {
        mutate {
          replace => {
            "target_present" => "true"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "security_result.summary" => "%{log}"
    }
    on_error => "log_not_found"
  }

  if [event1_data][task] != "" {
    mutate {
      replace => {
        "task_label.key" => "task"
        "task_label.value" => "%{event1_data.task}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "task_label"
      }
    }
  }

  if [event1_data][task_uuid] != "" {
    mutate {
      replace => {
        "task_uuid_label.key" => "task_uuid"
        "task_uuid_label.value" => "%{event1_data.task_uuid}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "task_uuid_label"
      }
    }
  }

  if [event1] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{event1}"
      }
      on_error => "event1_not_found"
    }
  }
  else if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "description_not_found"
    }
  }
  else if [RenderedMessage] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{RenderedMessage}"
      }
      on_error => "rendered_message_not_found"
    }
  }
  else {
    json {
      source => "message"
      on_error => "not_json"
    }
    if [not_json] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{message}"
        }
        on_error => "message_not_found"
      }
    }
  }

  if ![log_address_not_found] and [log][source][address] != "" and [json_data] =~ "host.*ip" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [principal_hostname] != "" or [event1_data][remote_addr] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [target_present] == "true" and [principal_present] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [principal_present] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [cluster_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [user_present] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "ANSIBLE_AWX"
      "event.idm.read_only_udm.metadata.vendor_name" => "ANSIBLE_AWX"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
