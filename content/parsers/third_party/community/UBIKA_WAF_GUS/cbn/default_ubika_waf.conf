      on_error => "indexPR_conversion_error"
    }
    for keyPR,valuePR in pull map {
      mutate {
        replace => {
          "field_" => ""
        }
      }
      mutate {
        convert => {
          "valuePR" => "string"
        }
        on_error => "convert_value_to_string_valuePR"
      }
      mutate {
        replace => {
          "check_" => "%{valuePR}"
        }
        on_error => "valuePR_not_exists"
      }
      if ![valuePR_not_exists] and [valuePR] != "" {
        mutate {
          replace => {
            "field_.value.string_value" => "%{valuePR}"
          }
          on_error => "valuePR_not_exists_in_field_value"
        }
        mutate {
          replace => {
            "field_.key" => "matchingParts__%{keyPR}[%{indexPR}]"
          }
          on_error => "keyPR_not_exists"
        }
        mutate {
          merge => {
            "additional.fields" => "field_"
          }
          on_error => "fieldPR_merge_error_reason"
        }
      }
    }
  }
  mutate {
    rename => {
      "unique_id1" => "addition.unique_id1"
      "message_component" => "addition.message_component"
      "thread_id" => "addition.thread_id"
      "tokens.icxPolicyName" => "addition.tokens_icxPolicyName"
      "tokens.icxPolicyUid" => "addition.tokens_icxPolicyUid"
      "tokens.icxRuleName" => "addition.tokens_icxRuleName"
      "tokens.icxRuleUid" => "addition.tokens_icxRuleUid"
      "tokens.securityExceptionConfigurationUid" => "addition.tokens_securityExceptionConfigurationUid"
      "internal_timestamp" => "addition.internal_timestamp"
      "tokens.ipReputationScore" => "addition.tokens_ipReputationScore"
      "tokens.ipReputationThreats" => "addition.tokens_ipReputationThreats"
      "tokens.eaTotalScore" => "addition.tokens_eaTotalScore"
      "tokens.eaPolicyUid" => "addition.tokens_eaPolicyUid"
      "tokens.eaPolicyName" => "addition.tokens_eaPolicyName"
      "tokens.eaStaticPolicyUid" => "addition.tokens_eaStaticPolicyUid"
      "tokens.eaRuleId" => "addition.tokens_eaRuleId"
      "tokens.eaNewRulesWarningMode" => "addition.tokens_eaNewRulesWarningMode"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [value] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "no_key_found"
      }
      if [key] in ["tokens_icxPolicyName", "tokens_icxPolicyUid","tokens_icxRuleName","tokens_icxRuleUid","tokens_ipReputationThreats"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "no_value_found_for_key"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "_field"
          }
          on_error => "security_result_merge_failed"
        }
      }
      else if [key] == "message_component" {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "noval_for_target"
        }
        mutate {
          merge => {
            "target.resource.attribute.labels" => "_field"
          }
          on_error => "target_merge_failed"
        }
        if ![target_merge_failed] {
          mutate {
            replace => {
              "has_target_resource" => "true"
            }
          }
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "no_value_found_for_key_in_string_value"
        }
        mutate {
          merge => {
            "additional.fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and [has_network] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_principal_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_COMMUNICATION"
      }
    }
  }
  else if [has_target_resource] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "invalid_event_type"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "UBIKA_WAF"
      "metadata.product_name" => "UBIKA_WAF"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
      on_error => "invalid_metadata"
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
      on_error => "invalid_principal"
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
      on_error => "invalid_target"
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
      on_error => "invalid_network"
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
      on_error => "invalid_additional"
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "invalid_security_result"
    }
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_empty"
    }
  }

  if [src] != "" {
    mutate {
      rename => {
        "src" => "event.idm.read_only_udm.src"
      }
      on_error => "source_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

