# Product: UBIKA_WAF
# Category: WAF
# Supported Format: JSON + SYSLOG, SYSLOG
# Reference: NA
# Last Updated: 2026-03-09
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event_type" => ""
      "logFormatVersion" => ""
      "data" => ""
      "tempData" => ""
      "eventt" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_network" => "false"
      "tempData.logAlertUid" => ""
      "tempData.timestamp" => ""
      "tempData.timestampImport" => ""
      "tempData.uid" => ""
      "tempData.request.hostname" => ""
      "tempData.request.ipDst" => ""
      "tempData.request.ipSrc" => ""
      "tempData.request.method" => ""
      "tempData.request.path" => ""
      "tempData.request.portDst" => ""
      "tempData.request.protocol" => ""
      "httpProtocol" => ""
      "tempData.request.requestUid" => ""
      "tempData.request.query" => ""
      "p" => ""
      "tempData.request.body" => ""
      "grant_type" => ""
      "username" => ""
      "password" => ""
      "tempData.request.cookies" => ""
      "tempData.request.headers" => ""
      "tempData.context.applianceName" => ""
      "tempData.context.applianceUid" => ""
      "tempData.context.backendHost" => ""
      "tempData.context.backendPort" => ""
      "tempData.context.geoipCode" => ""
      "tempData.context.geoipName" => ""
      "tempData.context.reverseProxyName" => ""
      "tempData.context.reverseProxyUid" => ""
      "tempData.context.tags" => ""
      "tempData.context.tunnelName" => ""
      "tempData.context.tunnelUid" => ""
      "tempData.context.workflowName" => ""
      "tempData.context.workflowUid" => ""
      "tempData.events" => ""
      "eventt.eventUid" => ""
      "eventt.tokens" => ""
      "eventt.tokens.cwe" => ""
      "eventt.tokens.attackFamily" => ""
      "eventt.tokens.date" => ""
      "eventt.tokens.engineName" => ""
      "eventt.tokens.engineUid" => ""
      "eventt.tokens.eventType" => ""
      "eventt.tokens.matchingParts" => ""
      "eventt.tokens.part" => ""
      "eventt.tokens.reason" => ""
      "eventt.tokens.resolveType" => ""
      "eventt.tokens.riskLevel" => ""
      "eventt.tokens.riskLevelOWASP" => ""
      "eventt.tokens.severity" => ""
      "eventt.tokens.icxPolicyName" => ""
      "eventt.tokens.icxPolicyUid" => ""
      "eventt.tokens.icxRuleName" => ""
      "eventt.tokens.securityExceptionConfigurationUids" => ""
      "eventt.tokens.securityExceptionMatchedRuleUids" => ""
      "security_result" => ""
      "about" => ""
      "network" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "cookie" => ""
      "tempData.websocket" => ""
      "intermediary" => ""
      "additional" => ""
      "src" => ""
      "has_principal_user" => "false"
      "has_target_resource" => "false"
      "target_path" => ""
      "user_agent" => ""
      "src_host" => ""
      "inter_host" => ""
      "src_app" => ""
      "tar_ip" => ""
      "eventData.tokens.matchingParts" => ""
      "target_ip" => ""
      "datetime" => ""
      "request_query" => ""
      "header_value" => ""
      "tokens_icxPolicyName" => ""
      "tokens_icxPolicyUid" => ""
      "tokens_icxRuleName" => ""
      "tokens_icxRuleUid" => ""
      "unique_id1" => ""
      "internal_timestamp" => ""
      "message_component" => ""
      "inter_pid" => ""
      "thread_id" => ""
      "status_description" => ""
      "response_code" => ""
      "tar_hostname" => ""
      "location" => ""
      "prin_ip" => ""
      "tokens_ipReputationIp" => ""
      "req_body" => ""
      "request_ipDst" => ""
      "request_ipSrc" => ""
      "failed_json_found" => "true"
      "xf_proto" => ""
      "inter_ip" => ""
      "httpVersion" => ""
      "context.tags" => ""
      "context.geoipCode" => ""
      "context.geoipName" => ""
    }
  }

  if [message] != "" {
    mutate {
      gsub => ["message", "\\r\\n", ""]
    }
  }
  mutate {
    convert => {
      "failed_json_found" => "boolean"
    }
    on_error => "failed_json_found_conversion_error"
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "invalid_json"
  }

  if [invalid_json] {
    mutate {
      replace => {
        "ts" => ""
        "json_data" => ""
        "src_ip" => ""
        "uri_method" => ""
        "uri_path" => ""
        "uri_protocol" => ""
        "uri_res_code" => ""
        "vlan" => ""
        "tokens.date" => ""
        "tokens.eventType" => ""
        "tokens.attackFamily" => ""
        "tokens.engineUid" => ""
        "tokens.engineName" => ""
        "tokens.riskLevel" => ""
        "tokens.riskLevelOWASP" => ""
        "tokens.cwe" => ""
        "tokens.severity" => ""
        "tokens.resolveType" => ""
        "tokens.part" => ""
        "tokens.reason" => ""
        "json_data2" => ""
        "logAlertUid" => ""
        "timestamp" => ""
        "_type_" => ""
        "request.headers" => ""
        "request.cookies" => ""
        "request.ipDst" => ""
        "request.ipSrc" => ""
        "request.method" => ""
        "request.path" => ""
        "request.portDst" => ""
        "request.protocol" => ""
        "request.requestUid" => ""
        "request.hostname" => ""
        "httpProtocol" => ""
        "source_ip" => ""
        "context.applianceName" => ""
        "context.applianceUid" => ""
        "context.backendHost" => ""
        "context.backendPort" => ""
        "context.reverseProxyName" => ""
        "context.reverseProxyUid" => ""
        "context.tunnelName" => ""
        "context.tunnelUid" => ""
        "context.workflowName" => ""
        "context.workflowUid" => ""
        "severity_level" => ""
        "target_port" => ""
        "target_hostname" => ""
        "src_port" => ""
        "product_id" => ""
        "desc" => ""
        "http_host_header" => ""
      }
    }
    grok {
      match => {
        "message" => [
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+ActiveNode\\s+%{DATA}\\s+-\\s+-\\s+-\\s+%{IP:src_ip}\\s+-\\s+-\\s+\\[%{DATA}\\]\\s+\\"%{URIHOST:uri_method}\\s+%{DATA:uri_path}\\s+%{URIPROTO:uri_protocol}\\/%{DATA}\\s+%{INT:uri_res_code}\\s+%{INT:vlan}',
          "<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+ActiveNode\\s+%{DATA}\\s+-\\s+-\\s+-\\s+\\[%{DATA}]\\s+Custom raised event:\\s+%{GREEDYDATA:json_data}",
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+ActiveNode\\s+%{GREEDYDATA}\\s+-\\s+-\\s+-\\s+\\[%{DATA}\\]\\s+Custom raised event:\\s+%{GREEDYDATA:json_data}',
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+ActiveNode\\s+%{GREEDYDATA}\\s+-\\s+-\\s+-\\s+%{IP:src_ip}\\s+-\\s+-\\s+\\[%{DATA}\\]\\s+\\"%{URIHOST:uri_method}\\s+%{DATA:uri_path}\\s+%{URIPROTO:uri_protocol}\\/%{DATA}\\"\\s+%{INT:uri_res_code}\\s+-\\s+\\"%{URI:target_path}\\"%{GREEDYDATA:user_agent}',
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+ActiveNode\\s+%{GREEDYDATA}\\s+-\\s+-\\s+-\\s+\\[%{DATA}\\]\\s+\\[client\\s+%{IP:src_ip}:%{INT:src_port}\\]\\s+%{DATA:product_id}:%{GREEDYDATA:desc}\\(server\\s+%{GREEDYDATA:target_hostname}:%{INT:target_port}\\)'
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+%{DATA}\\s+%{DATA}\\s+-\\s+-\\s+-\\s+%{IP:src_ip}\\s+-\\s+-\\s+\\[%{DATA}\\]\\s+\\"%{URIHOST:uri_method}\\s+%{DATA:uri_path}\\s+%{URIPROTO:uri_protocol}\\/%{DATA}\\"\\s+%{INT:uri_res_code}\\s+%{INT:vlan}\\s+\\"%{URI:target_path}\\"%{GREEDYDATA:user_agent}'
          "<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+ActiveNode\\s+-\\s+-\\s+-\\s+%{GREEDYDATA:json_data2}"
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+%{DATA}\\s+%{DATA}\\s+-\\s+-\\s+-\\s+%{IP:src_ip}\\s+-\\s+-\\s+\\[%{DATA}\]\\s+\\"%{URIHOST:uri_method}\\s+%{DATA:uri_path}\\s+%{URIPROTO:uri_protocol}\\/%{DATA}\\"\\s+%{INT:res_code} - \\"%{URI:target_path}\\"%{GREEDYDATA:user_agent}'
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+%{DATA}\\s+%{DATA}\\s+-\\s+-\\s+-\\s+%{IP:src_ip}\\s+-\\s+-\\s+\\[%{DATA}\\]\\s+\\"%{URIHOST:uri_method}\\s+%{DATA:uri_path}\\s+%{URIPROTO:uri_protocol}\\/%{DATA}\\"\\s+%{INT:uri_res_code}'
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:ts}\\s+%{DATA}\\s+%{DATA}\\s+-\\s+-\\s+-\\s+\\[%{DATA}\\]\\s+Custom raised event:\\s+%{GREEDYDATA:json_data}'
          '<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:datetime}\\s+%{DATA:inter_host} - - - - %{GREEDYDATA:json_data2}',
          '<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:inter_host} %{INT} %{TIMESTAMP_ISO8601:datetime}\\s+%{HOSTNAME:src_host} %{DATA:src_app}: - - - \\[%{DATA}\\]%{DATA}:\\s+%{GREEDYDATA:json_data}'
          '<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:inter_host} %{INT} %{TIMESTAMP_ISO8601:datetime}\\s+%{HOSTNAME:src_host} %{DATA}: - - - %{IP:src_ip} %{IP} - \\[%{DATA}\\] "%{DATA:uri_method} %{DATA:target_path} %{WORD:uri_protocol}\/%{DATA}" %{INT:uri_res_code} %{INT} "%{DATA:uri_path}" "%{DATA:user_agent}" %{IP:tar_ip} %{GREEDYDATA:target_hostname}',
          '<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:inter_host} %{INT} %{TIMESTAMP_ISO8601:datetime}\\s+%{HOSTNAME:src_host} %{DATA}: - - - %{IP:src_ip} %{IP} - \\[%{DATA}\\] %{DATA}"%{DATA:uri_method} %{DATA:target_path} %{WORD:uri_protocol}\/%{DATA}" %{INT:uri_res_code} %{DATA} %{DATA}"%{DATA:uri_path}" %{DATA}"%{DATA:user_agent}" %{IP:tar_ip} %{GREEDYDATA:target_hostname}',
          '<%{INT}>%{MONTH} %{INT} %{DATA} %{DATA:http_host_header} %{INT} %{TIMESTAMP_ISO8601:datetime}\\s+%{HOSTNAME:inter_host} - - - - %{GREEDYDATA:json_data2}',
          "<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601:datetime}\\s+%{DATA:inter_host}\\s+%{DATA:unique_id1}:\\s+(%{DATA}|-)\\s+(%{DATA}|-)\\s+(%{DATA}|-)\\s+(\\[(?P<internal_timestamp>%{DAY}\\s+%{MONTH}\\s+%{MONTHDAY}\\s+%{TIME}\\s+%{YEAR})\\]\\s+)?(\\[%{DATA:message_component}\\]\\s+)?(\\[%{INT:inter_pid}:%{INT:thread_id}\\]\\s+)?%{DATA:status_description}:\\s+%{GREEDYDATA:json_data}"
        ]
      }
      overwrite => ["json_data","ts","src_ip","uri_method","uri_path","uri_protocol","uri_res_code","vlan","json_data2","target_path","user_agent","src_port","target_hostname","target_port","product_id","desc","inter_host","src_host","src_app","tar_ip","datetime","http_host_header","unique_id1","internal_timestamp","message_component","inter_pid","thread_id","status_description"]
      on_error => "invalid_syslog"
    }
    if [inter_pid] != "" {
      mutate {
        replace => {
          "intermediary.process.pid" => "%{inter_pid}"
        }
        on_error => "no_inter_pid"
      }
    }
    if [status_description] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{status_description}"
        }
        on_error => "no_status_description"
      }
    }
    if [inter_host] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{inter_host}"
        }
        on_error => "no_inter_host"
      }
    }
    if [http_host_header] != "" {
      mutate {
        replace => {
          "http_host_header_label.key" => "http_host_header"
          "http_host_header_label.value.string_value" => "%{http_host_header}"
        }
        on_error => "no_http_host_header"
      }
      if ![no_http_host_header] {
        mutate {
          merge => {
            "additional.fields" => "http_host_header_label"
          }
          on_error => "no_http_host_header_label"
        }
      }
    }
    if [src_host] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{src_host}"
        }
        on_error => "no_src_host"
      }
      if ![no_src_host] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [src_app] != "" {
      mutate {
        replace => {
          "principal.application" => "%{src_app}"
        }
        on_error => "no_src_app"
      }
    }
    if [tar_ip] != "" {
      grok {
        match => {
          "tar_ip" => "%{IP:tar_ip}"
        }
        overwrite => ["tar_ip"]
        on_error => "no_tar_ip"
      }
      if ![no_tar_ip] {
        mutate {
          merge => {
            "target.ip" => "tar_ip"
            "target.asset.ip" => "tar_ip"
          }
          on_error => "no_tar_ip_merge"
        }
        if ![no_tar_ip_merge] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }

    if ![invalid_syslog] {
      if [src_ip] != "" {
        grok {
          match => {
            "src_ip" => "%{IP:src_ip}"
          }
          overwrite => ["src_ip"]
          on_error => "no_src_ip"
        }
        if ![no_src_ip] {
          mutate {
            merge => {
              "principal.ip" => "src_ip"
              "principal.asset.ip" => "src_ip"
            }
            on_error => "no_src_ip_merge"
          }
          if ![no_src_ip_merge] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
      if [uri_method] != "" {
        mutate {
          replace => {
            "network.http.method" => "%{uri_method}"
          }
          on_error => "no_uri_method"
        }
      }
      if [uri_path] != "" {
        mutate {
          replace => {
            "network.http.referral_url" => "%{uri_path}"
          }
          on_error => "no_uri_path"
        }
      }
      if [uri_protocol] == "HTTP" {
        mutate {
          replace => {
            "network.application_protocol" => "%{uri_protocol}"
            "has_network" => "true"
          }
          on_error => "no_uri_protocol"
        }
      }
      if [uri_res_code] != "" {
        mutate {
          replace => {
            "network.http.response_code" => "%{uri_res_code}"
          }
          on_error => "no_uri_res_code"
        }
        mutate {
          convert => {
            "network.http.response_code" => "integer"
          }
          on_error => "http_response_code_conversion_failure"
        }
      }
      if [vlan] != "" {
        mutate {
          replace => {
            "vlan_label.key" => "vlan"
            "vlan_label.value" => "%{vlan}"
          }
          on_error => "no_vlan"
        }
        if ![no_vlan] {
          mutate {
            merge => {
              "security_result.detection_fields" => "vlan_label"
            }
            on_error => "no_vlan_label"
          }
        }
      }
      if [user_agent] != "" {
        mutate {
          replace => {
            "network.http.user_agent" => "%{user_agent}"
          }
          on_error => "no_user_agent"
        }
      }
      if [src_port] != "" {
        mutate {
          replace => {
            "principal.port" => "%{src_port}"
          }
          on_error => "no_src_port"
        }
        mutate {
          convert => {
            "principal.port" => "integer"
          }
          on_error => "src_port_conversion_failure"
        }
      }
      if [target_hostname] != "" {
        mutate {
          replace => {
            "target.hostname" => "%{target_hostname}"
            "target.asset.hostname" => "%{target_hostname}"
            "has_target" => "true"
          }
          on_error => "no_target_hostname"
        }
      }
      if [target_port] != "" {
        mutate {
          replace => {
            "target.port" => "%{target_port}"
          }
          on_error => "no_target_port"
        }
        mutate {
          convert => {
            "target.port" => "integer"
          }
          on_error => "target_port_conversion_failure"
        }
      }
      if [product_id] != "" {
        mutate {
          replace => {
            "metadata.product_log_id" => "%{product_id}"
          }
          on_error => "no_product_id"
        }
      }
      if [desc] != "" {
        mutate {
          replace => {
            "security_result.description" => "%{desc}"
          }
          on_error => "no_desc"
        }
      }

      if [json_data] != "" {
        mutate {
          gsub => ["json_data", "\\n", ""]
        }
        json {
          source => "json_data"
          array_function => "split_columns"
          on_error => "failed_json"
        }
        if [failed_json] {
          mutate {
            gsub => ["json_data", '\\\\\"', '\"']
          }
          json {
            source => "json_data"
            array_function => "split_columns"
            on_error => "failed_json_found"
          }
        }
        if ![failed_json] or ![failed_json_found] {
          mutate {
            replace  => {
              "tokens_ipReputationIp" => "%{tokens.ipReputationIp}"
            }
            on_error => "no_ipReputationIp_token"
          }
          if ![no_ipReputationIp_token] && [tokens_ipReputationIp] != "" {
            grok {
              match => {
                "tokens_ipReputationIp" => "%{IP:tokens_ipReputationIp}"
              }
              overwrite => ["tokens_ipReputationIp"]
              on_error => "grok_failed_ipReputationIp"
            }
            if ![grok_failed_ipReputationIp] {
              mutate {
                merge => {
                  "principal.ip" => "tokens_ipReputationIp"
                  "principal.asset.ip" => "tokens_ipReputationIp"
                }
                on_error => "no_ipReputationIp"
              }
              if ![no_ipReputationIp] {
                mutate {
                  replace => {
                    "has_principal" => "true"
                  }
                }
              }
            }
          }

          mutate  {
            replace => {
              "metadata.product_log_id" => "%{eventUid}"
            }
            on_error => "no_eventUid"
          }
          if [tokens][date] != "" {
            mutate {
              convert => {
                "tokens.date" => "string"
              }
              on_error => "already_a_string"
            }
            date {
              match => ["tokens.date", "UNIX_MS"]
              on_error => "date_parsing_failed"
            }
            mutate {
              replace => {
                "tokens_date_label.key" => "tokens_date"
                "tokens_date_label.value.string_value" => "%{tokens.date}"
              }
              on_error => "no_tokens_date_label"
            }
            if ![no_tokens_date_label] {
              mutate {
                merge => {
                  "additional.fields" => "tokens_date_label"
                }
                on_error => "no_tokens_date_label_merge"
              }
            }
          }
          if [tokens][eventType] != "" {
            mutate {
              replace => {
                "metadata.product_event_type" => "%{tokens.eventType}"
              }
              on_error => "no_eventType"
            }
          }
          if [tokens][attackFamily] != "" {
            mutate {
              replace => {
                "security_result.threat_name" => "%{tokens.attackFamily}"
              }
              on_error => "no_attackFamily"
            }
          }
          if [tokens][engineUid] != "" {
            mutate {
              replace => {
                "engineUid_label" => ""
              }
            }
            mutate {
              replace => {
                "engineUid_label.key" => "EngineUid"
                "engineUid_label.value" => "%{tokens.engineUid}"
              }
              on_error => "no_engineUid"
            }
            if ![no_engineUid] {
              mutate {
                merge => {
                  "target.resource.attribute.labels" => "engineUid_label"
                }
                on_error => "no_engineUid_label"
              }
              mutate {
                replace => {
                  "has_target_resource" => "true"
                }
              }
            }
          }
          if [tokens][engineName] != "" {
            mutate {
              replace => {
                "engine_name_label" => ""
              }
            }
            mutate {
              replace => {
                "engine_name_label.key" => "EngineName"
                "engine_name_label.value" => "%{tokens.engineName}"
              }
              on_error => "no_engineName"
            }
            if ![no_engineName] {
              mutate {
                merge => {
                  "target.resource.attribute.labels" => "engine_name_label"
                }
                on_error => "no_engine_name_label"
              }
              mutate {
                replace => {
                  "has_target_resource" => "true"
                }
              }
            }
          }
          if [tokens][riskLevel] != "" {
            mutate {
              convert => {
                "tokens.riskLevel" => "string"
              }
              on_error => "already_a_string_riskLevel"
            }
            mutate {
              replace => {
                "riskLevel_label" => ""
              }
            }
            mutate {
              replace => {
                "riskLevel_label.key" => "RiskLevel"
                "riskLevel_label.value" => "%{tokens.riskLevel}"
              }
              on_error => "no_riskLevel"
            }
            if ![no_riskLevel] {
              mutate {
                merge => {
                  "security_result.detection_fields" => "riskLevel_label"
                }
                on_error => "no_riskLevel_label"
              }
            }
          }
          if [tokens][riskLevelOWASP] != "" {
            mutate {
              convert => {
                "tokens.riskLevelOWASP" => "string"
              }
              on_error => "already_a_string_riskLevelOWASP_token"
            }
            mutate {
              replace => {
                "riskLevelOWASP_label" => ""
              }
            }
            mutate {
              replace => {
                "riskLevelOWASP_label.key" => "RiskLevelOWASP"
                "riskLevelOWASP_label.value" => "%{tokens.riskLevelOWASP}"
              }
              on_error => "no_riskLevelOWASP"
            }
            if ![no_riskLevelOWASP] {
              mutate {
                merge => {
                  "security_result.detection_fields" => "riskLevelOWASP_label"
                }
                on_error => "no_riskLevelOWASP_label"
              }
            }
          }
          if [tokens][cwe] not in ["","-"] {
            mutate {
              replace => {
                "cwe_label" => ""
              }
            }
            mutate {
              replace => {
                "cwe_label.key" => "CWE"
