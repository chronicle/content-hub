        "check_i" => ""
      }
    }
    mutate {
      convert => {
        "value_i" => "string"
      }
      on_error => "value_i_conversion_failed"
    }
    mutate {
      replace => {
        "check_i" => "%{value_i}"
      }
      on_error => "value_i_not_available_for_identity_metadata"
    }
    if ![value_i_not_available_for_identity_metadata] and [check_i] != "" {
      mutate {
        replace => {
          "field_i.value.string_value" => "%{value_i}"
        }
        on_error => "value_i_not_exists_for_identity_metadata"
      }
      mutate {
        replace => {
          "field_i.key" => "identity_metadata_%{key_i}"
        }
        on_error => "key_not_exists_for_identity_metadata"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "field_i"
        }
        on_error => "field_merge_error_for_identity_metadata"
      }
    }
  }
  for key_r, value_r in resource.labels map {
    mutate {
      replace => {
        "field_r" => ""
        "check_r" => ""
      }
    }
    mutate {
      convert => {
        "value_r" => "string"
      }
      on_error => "value_r_conversion_failed"
    }
    mutate {
      replace => {
        "check_r" => "%{value_r}"
      }
      on_error => "value_r_not_available_for_resource_labels"
    }
    if ![value_r_not_available_for_resource_labels] && [check_r] != "" && [key_r] not in ["function_name","region"] {
      mutate {
        replace => {
          "field_r.value" => "%{value_r}"
        }
        on_error => "value_r_not_exists_for_resource_labels"
      }
      mutate {
        replace => {
          "field_r.key" => "resource_labels_%{key_r}"
        }
        on_error => "key_r_empty"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "field_r"
        }
        on_error => "field_merge_error_for_resource_labels"
      }
      if ![field_merge_error_for_resource_labels] {
        mutate {
          replace => {
            "has_target_resource" => "true"
          }
        }
      }
    }
  }
  mutate {
    rename => {
      "account_id" => "addition.account_id"
      "workspace_id" => "addition.workspace_id"
      "event_date" => "addition.event_date"
      "user_identity.subject_name" => "addition.user_identity_subject_name"
      "request_id" => "addition.request_id"
      "response.result" => "addition.response_result"
      "audit_level" => "addition.audit_level"
      "operationName" => "addition.operationName"
      "identity.subjectName" => "addition.identity_subjectName"
      "category" => "addition.category"
      "p_response.result" => "addition.properties_response_result"
      "properties.requestId" => "addition.properties_requestId"
      "workspaceId" => "addition.workspaceId"
      "requestId" => "addition.requestId"
      "accountId" => "addition.accountId"
      "auditLevel" => "addition.auditLevel"
      "request_params.authenticationMethod" => "addition.request_params_authenticationMethod"
      "jsonPayload.accountId" => "addition.jsonPayload_accountId"
      "jsonPayload.auditLevel" => "addition.jsonPayload_auditLevel"
      "jsonPayload.logName" => "addition.jsonPayload_logName"
      "jsonPayload.requestId" => "addition.jsonPayload_requestId"
      "jsonPayload.request_params.authenticationMethod" => "addition.jsonPayload_request_params_authenticationMethod"
      "jsonPayload.timestamp" => "addition.jsonPayload_timestamp"
      "jsonPayload.workspaceId" => "addition.jsonPayload_workspaceId"
      "logName" => "addition.logName"
      "catalog_name" => "addition.catalog_name"
      "schema_name" => "addition.schema_name"

    }
  }
  for key1,value1 in addition map {
    mutate {
      replace => {
        "field1" => ""
        "check" => ""
      }
    }
    mutate {
      convert => {
        "value1" => "string"
      }
      on_error => "value1_string"
    }
    mutate {
      replace => {
        "check" => "%{value1}"
      }
      on_error => "check_empty"
    }
    if ![check_empty] && [check] not in ["","{}"] {
      mutate {
        replace => {
          "field1.key" => "%{key1}"
        }
        on_error => "key1_empty"
      }
      if [key1] in ["account_id", "workspace_id","category","workspaceId","accountId","jsonPayload_accountId","jsonPayload_workspaceId","catalog_name","schema_name"] {
        mutate {
          replace => {
            "field1.value" => "%{value1}"
          }
          on_error => "value_not_found_target"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "field1"
          }
          on_error => "target_merge_failed"
        }
        if ![target_merge_failed] {
          mutate {
            replace => {
              "has_target_resource" => "true"
            }
          }
        }
      }
      else if [key1] in ["response_result","audit_level","auditLevel","request_params_authenticationMethod","jsonPayload_auditLevel","jsonPayload_request_params_authenticationMethod"] {
        mutate {
          replace => {
            "field1.value" => "%{value1}"
          }
          on_error => "value_not_found_security_result"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "field1"
          }
          on_error => "security_result_merge_error"
        }
      }
      else if [key1] in ["user_identity_subject_name","identity_subjectName"] {
        mutate {
          replace => {
            "field1.value" => "%{value1}"
          }
          on_error => "value_not_found_principal"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.attribute.labels" => "field1"
          }
          on_error => "principal_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "field1.value.string_value" => "%{value1}"
          }
          on_error => "value_not_found_additional"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field1"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "DATABRICKS"
      "event.idm.read_only_udm.metadata.product_name" => "DATABRICKS"
    }
  }
  if [has_target_resource] == "true" {
    if [has_principal_user] == "true" && [action_name] =~ "updateAutoMaintenancePermissions" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
        }
      }
    }
    else if [has_principal_user] == "true" && ([privilege_type] =~ "CREATE_TABLE" or [privilege_type] =~ "CREATE_MODEL" or [privilege_type] =~ "CREATE_FUNCTION") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
        }
      }
    }
    else if [has_principal] == "true" && [has_target_file] == "true" && [action_name] =~ "modifyNotebook" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
        }
      }
    }
    else if [has_principal] == "true" && [has_target_file] == "true" && [action_name] =~ "Read" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_READ"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
