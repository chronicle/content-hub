# Product: MANAGAE_ENGINE_LOG360
# Category: Alert Log
# Supported Format: SYSLOG+KV
# Reference: N/A
# Last Updated: 2024-10-28
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "intermediary" => ""
      "network" => ""
      "security_result" => ""
      "metadata" => ""
      "principal_domain" => ""
      "principal_account_name" => ""
      "Logon_ID" => ""
      "Logon_type" => ""
      "mechanism" => ""
      "msg" => ""
      "user" => ""
      "event" => ""
      "summary" => ""
      "channel" => ""
      "principal_kvdata" => ""
      "principal_security_id" => ""
      "principal_logon_id" => ""
      "logon_information_kvdata" => ""
      "target_kvdata" => ""
      "process_kvdata" => ""
      "network_information" => ""
      "auth_kvdata" => ""
      "impersonation_level" => ""
      "restricted_admin_mode" => ""
      "virtual_account" => ""
      "elevated_token" => ""
      "event_in_sequence" => ""
      "target_security_id" => ""
      "target_account_name" => ""
      "target_domain" => ""
      "target_logon_id" => ""
      "creator_process_name" => ""
      "process_id" => ""
      "source_ip" => ""
      "source_port" => ""
      "logon_process" => ""
      "authentication_package" => ""
      "transited_services" => ""
      "package_name" => ""
      "key_length" => ""
      "logon_guid" => ""
      "target_present" => ""
      "principal_present" => ""
      "user_present" => ""
      "msgs" => ""
      "eventid" => ""
    }
  }
  mutate {
    gsub => ["message","□"," "]
  }


  grok {
    match => {
      "message" => [
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts}  %{DATA:user} %{DATA}%{INT}(\\t)%{DATA:channel}(\\t)-(\\t)%{GREEDYDATA}(\\t)%{INT:eventid}(\\t)%{DATA:event}(\\t)%{GREEDYDATA}(\\t)-(\\t)%{DATA:summary}  %{GREEDYDATA:msgs}",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts}  %{DATA:user} %{DATA}%{INT}(\\t)%{DATA:channel}(\\t)-(\\t)%{GREEDYDATA}(\\t)%{INT:eventid}(\\t)%{DATA:event}(\\t)%{GREEDYDATA}(\\t)-(\\t)%{GREEDYDATA:summary}%{GREEDYDATA:msgs}"
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts}  %{DATA:user} %{DATA}%{INT} %{DATA:channel} - %{GREEDYDATA} %{INT:eventid} %{DATA:event} %{GREEDYDATA} - %{DATA:summary}  %{GREEDYDATA:msgs}",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts}  %{DATA:user} %{DATA}%{INT} %{DATA:channel} - %{GREEDYDATA} %{INT:eventid} %{DATA:event} %{GREEDYDATA} - %{GREEDYDATA:summary}%{GREEDYDATA:msgs}"
        ]
    }
    overwrite => ["ts","user","msgs","summary","channel","event","eventid"]
    on_error => "grok_failed"
  }
  if [grok_failed] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }
  if [user] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{user}"
      }
      on_error => "invalid_user"
    }
  }
  if [ts] != "" {
    date {
      match => ["ts","RFC3339"]
      on_error => "ts_invalid"
    }
  }
  if [event] != "" {
    mutate {
      replace => {
        "software.vendor_name" => "%{event}"
      }
      on_error => "invalid_event"
    }
  }
  if [software] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.src.asset.software" => "software"
      }
      on_error => "invalid_software"
    }
  }


  if [eventid] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventid}"
      }
      on_error => "invalid_eventid"
    }
  }
  if [channel] != "" {
    mutate {
      replace => {
        "channel_label.key" => "channel"
        "channel_label.value" => "%{channel}"
      }
      on_error => "invalid_channel"
    }
    if not [invalid_channel] {
      mutate {
        merge => {
          "security_result.detection_fields" => "channel_label"
        }
        on_error => "invalid_channel_label"
      }
    }
  }
  if [summary] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{summary}"
      }
      on_error => "invalid_summary"
    }
  }
  if [msgs] != "" {
    mutate {
      gsub => ["msgs","\\t",""]
    }
    mutate {
      gsub => ["msgs","\\r",""]
    }
    mutate {
      gsub => ["msgs","Network Account Name","network_account_name"]
    }
    mutate {
      gsub => ["msgs","Network Account Domain","network_account_domain"]
    }
    mutate {
      gsub => ["msgs","Logon GUID","logon_guid"]
    }
    mutate {
      gsub => ["msgs","Logon Type","Logon_type"]
    }
    grok {
      match => {
        "msgs" => [
              "Subject: %{GREEDYDATA:principal_kvdata} Logon Information: %{GREEDYDATA:logon_information_kvdata}New Logon: %{GREEDYDATA:target_kvdata}Process Information: %{GREEDYDATA:process_kvdata}Network Information: %{GREEDYDATA:network_information}Detailed Authentication Information: %{GREEDYDATA:auth_kvdata}:%{INT:key_length}  %{GREEDYDATA:msg}",
              "Subject: %{GREEDYDATA:principal_kvdata}  %{GREEDYDATA:msg}",
              "Account Information: %{GREEDYDATA:principal_kvdata} Service Information: %{GREEDYDATA:logon_information_kvdata}Network Information: %{GREEDYDATA:network_information} Additional Information:%{GREEDYDATA}"
        ]
      }
      overwrite => ["principal_kvdata","logon_information_kvdata","target_kvdata","process_kvdata","network_information","auth_kvdata","msg","key_length"]
      on_error => "msgs_grok_failed"
    }
    if [auth_kvdata] != "" {
      mutate {
        gsub => ["auth_kvdata","Logon Process","logon_process"]
      }
      mutate {
        gsub => ["auth_kvdata","Authentication Package","authentication_package"]
      }
      mutate {
        gsub => ["auth_kvdata","Transited Services","transited_services"]
      }
      mutate {
        gsub => ["auth_kvdata","Package Name \\(NTLM only\\)","package_name"]
      }
      mutate {
        gsub => ["auth_kvdata","Key Length","key_length"]
      }
      mutate {
        gsub => ["auth_kvdata", "(\\s+)(\\S+):", "#$2:"]
      }
      kv {
        source => "auth_kvdata"
        field_split => "#"
        value_split => ":"
        on_error => "kv_fail"
      }
    }
    if [network_information] != "" {
      mutate {
        gsub => ["network_information","Source Network Address","source_ip"]
      }
      mutate {
        gsub => ["network_information","Source Port","source_port"]
      }
      mutate {
        gsub => ["network_information","Workstation Name",""]
      }
      mutate {
        gsub => [
          "network_information", "(\\s+)(\\S+):", "#$2:"
        ]
      }
      kv {
        source => "network_information"
        field_split => "#"
        value_split => ":"
        on_error => "kv_fail"
      }
    }
    if [principal_kvdata] != "" {
      mutate {
        gsub => ["principal_kvdata","Security ID","principal_security_id"]
      }
      mutate {
        gsub => ["principal_kvdata","Account Name","principal_account_name"]
      }
      mutate {
        gsub => ["principal_kvdata","Account Domain","principal_domain"]
      }
      mutate {
        gsub => ["principal_kvdata","Logon ID","principal_logon_id"]
      }
      mutate {
        gsub => ["principal_kvdata", "(\\s+)(\\S+):", "#$2:"]
      }
      kv {
        source => "principal_kvdata"
        field_split => "#"
        value_split => ":"
        on_error => "sec_kv_data_failed"
      }
    }
    if [target_kvdata] != "" {
      mutate {
        gsub => ["target_kvdata","Event in sequence","event_in_sequence"]
      }
      mutate {
        gsub => ["target_kvdata","Security ID","target_security_id"]
      }
      mutate {
        gsub => ["target_kvdata","Account Name","target_account_name"]
      }
      mutate {
        gsub => ["target_kvdata","Account Domain","target_domain"]
      }
      mutate {
        gsub => ["target_kvdata","Logon ID","target_logon_id"]
      }
      mutate {
        gsub => ["target_kvdata", "(\\s+)(\\S+):", "#$2:"]
      }
      kv {
        source => "target_kvdata"
        field_split => "#"
        value_split => ":"
        on_error => "kv_fail"
      }
    }
    if [logon_information_kvdata] != "" {
      mutate {
        gsub => ["logon_information_kvdata","Impersonation Level","impersonation_level"]
      }
      mutate {
        gsub => ["logon_information_kvdata","Restricted Admin Mode","restricted_admin_mode"]
      }
      mutate {
        gsub => ["logon_information_kvdata","Virtual Account","virtual_account"]
      }
      mutate {
        gsub => ["logon_information_kvdata","Elevated Token","elevated_token"]
      }
      mutate {
        gsub => ["logon_information_kvdata", "(\\s+)(\\S+):", "#$2:"]
      }
      kv {
        source => "logon_information_kvdata"
        field_split => "#"
        value_split => ":"
        on_error => "kv_fail"
      }
    }
    if [process_kvdata] != "" {
      mutate {
        gsub => ["process_kvdata","Process Name","creator_process_name"]
      }
      mutate {
        gsub => ["process_kvdata","Process ID","process_id"]
      }
      mutate {
        gsub => [ "process_kvdata","(\\s+)(\\S+):", "#$2:"]
      }
      kv {
        source => "process_kvdata"
        field_split => "#"
        value_split => ":"
        on_error => "kv_fail"
      }
    }
  }
  if [principal_security_id] =~ "^S-\\\\d-(\\\\d+-){1,14}\\\\d+$" {
      mutate {
        replace => {
          "principal.user.windows_sid" => "%{principal_security_id}"
        }
        on_error => "invalid_Security_ID"
      }
      if ![invalid_Security_ID] {
        mutate {
          replace => {
            "user_present" => "true"
          }
        }
      }
    }
  if [principal_domain] != "" {
    mutate {
      replace => {
        "principal.administrative_domain" => "%{principal_domain}"
      }
      on_error => "invalid_account_domain"
    }
  }
  if [principal_account_name] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{principal_account_name}"
      }
      on_error => "invalid_Account_Name"
    }
    if not [invalid_Account_Name] {
      mutate {
        replace => {
          "user_present" => "true"
        }
      }
    }
  }
  if [principal_logon_id] != "" {
    mutate {
      replace => {
        "principal_logon_label.key" => "Principal Logon ID"
        "principal_logon_label.value" => "%{principal_logon_id}"
      }
      on_error => "invalid_logon_ID"
    }
    if not [invalid_logon_ID] {
      mutate {
        merge => {
          "security_result.detection_fields" => "principal_logon_label"
        }
        on_error => "invalid_logon_ID_label"
      }
    }
  }
  if [target_logon_id] != "" {
    mutate {
      replace => {
        "target_logon_label.key" => "Target Logon ID"
        "target_logon_label.value" => "%{target_logon_id}"
      }
      on_error => "invalid_logon_ID"
    }
    if not [invalid_logon_ID] {
      mutate {
        merge => {
          "security_result.detection_fields" => "target_logon_label"
        }
        on_error => "invalid_logon_ID_label"
      }
    }
  }
  if [Logon_type] == '3' {
    mutate {
      replace => {
        "mechanism" => "NETWORK"
      }
    }
  } else if [Logon_type] == '4' {
    mutate {
      replace => {
        "mechanism" => "BATCH"
      }
    }
  } else if [Logon_type] == '5' {
    mutate {
      replace => {
        "mechanism" => "SERVICE"
      }
    }
  } else if [Logon_type] == '8' {
    mutate {
      replace => {
        "mechanism" => "NETWORK_CLEAR_TEXT"
      }
    }
  } else if [Logon_type] == '9' {
    mutate {
      replace => {
        "mechanism" => "NEW_CREDENTIALS"
      }
    }
  } else if [Logon_type] == '10' {
    mutate {
      replace => {
        "mechanism" => "REMOTE_INTERACTIVE"
      }
    }
  } else if [Logon_type] == '11' {
    mutate {
      replace => {
        "mechanism" => "CACHED_INTERACTIVE"
      }
    }
  } else if [Logon_type] != "" {
    mutate {
      replace => {
        "mechanism" => "MECHANISM_OTHER"
      }
    }
  }
  if [mechanism] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
      }
      on_error => "invalid_mechanism"
    }
  }
  if [msg] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{msg}"
      }
      on_error => "invalid_msg"
    }
  }
  if [impersonation_level] != "" {
    mutate {
      replace => {
        "impersonation_level_label.key" => "Impersonation Level"
        "impersonation_level_label.value" => "%{impersonation_level}"
      }
      on_error => "invalid_impersonation_level"
    }
    if not [invalid_impersonation_level] {
      mutate {
        merge => {
          "security_result.detection_fields" => "impersonation_level_label"
        }
        on_error => "invalid_impersonation_level_label"
      }
    }
  }
  if [restricted_admin_mode] not in ["","-"] {
    mutate {
      replace => {
        "restrictedAdminMode.key" => "Restricted Admin Mode"
        "restrictedAdminMode.value" => "%{restricted_admin_mode}"
      }
      on_error => "invalid_restricted_admin_mode"
    }
    if not [invalid_restricted_admin_mode] {
      mutate {
        merge => {
          "security_result.detection_fields" => "restrictedAdminMode"
        }
        on_error => "invalid_restricted_admin_mode_label"
      }
    }
  }
  if [virtual_account] != "" {
    mutate {
      replace => {
        "virtual_account_label.key" => "Virtual Account"
        "virtual_account_label.value" => "%{virtual_account}"
      }
      on_error => "invalid_virtual_account"
    }
    if not [invalid_virtual_account] {
      mutate {
        merge => {
          "security_result.detection_fields" => "virtual_account_label"
        }
        on_error => "invalid_virtual_account_label"
      }
    }
  }
  if [elevated_token] != "" {
    mutate {
      replace => {
        "elevated_token_label.key" => "Elevated Token"
        "elevated_token_label.value" => "%{elevated_token}"
      }
      on_error => "invalid_elevated_token"
    }
    if not [invalid_elevated_token] {
      mutate {
        merge => {
          "security_result.detection_fields" => "elevated_token_label"
        }
        on_error => "invalid_elevated_token_label"
      }
    }
  }
  if [event_in_sequence] not in ["","-"] {
    mutate {
      replace => {
        "event_in_sequence_label.key" => "EventInSequence"
        "event_in_sequence_label.value" => "%{event_in_sequence}"
      }
      on_error => "invalid_event_in_sequence"
    }
    if not [invalid_event_in_sequence] {
      mutate {
        merge => {
          "security_result.detection_fields" => "event_in_sequence_label"
        }
        on_error => "invalid_event_in_sequence_label"
      }
    }
  }
  if [target_security_id] =~ "^S-\\\\d-(\\\\d+-){1,14}\\\\d+$" {
    mutate {
      replace => {
        "target.user.windows_sid" => "%{target_security_id}"
      }
      on_error => "invalid_target_security_id"
    }
    if not [invalid_target_security_id] {
      mutate {
        replace => {
          "user_present" => "true"
        }
      }
    }
  }
  if [target_account_name] not in ["","-"] {
    mutate {
      replace => {
        "target.user.userid" => "%{target_account_name}"
      }
      on_error => "invalid_target_account_name"
    }
    if not [invalid_target_account_name] {
      mutate {
        replace => {
          "user_present" => "true"
        }
      }
    }
  }
  if [target_domain] not in ["","-"] {
    mutate {
      replace => {
        "target.administrative_domain" => "%{target_domain}"
      }
      on_error => "invalid_target_domain"
    }
  }
  if [creator_process_name] != "" {
    mutate {
      replace => {
        "principal.process.file.full_path" => "%{creator_process_name}"
      }
      on_error => "invalid_process_name"
    }
  }
  if [process_id] not in ["","-"] {
    mutate {
      replace => {
        "principal.process.pid" => "%{process_id}"
      }
      on_error => "invalid_process_id"
    }
  }
  if [source_ip] != "" {
    grok {
      match => {
        "source_ip" => "%{IP:source_ip}"
      }
      overwrite => ["source_ip"]
      on_error => "not_ip"
    }
    if not [not_ip] {
      mutate {
        merge => {
          "principal.ip" => "source_ip"
          "principal.asset.ip" => "source_ip"
        }
        on_error => "invalid_source_ip"
      }
      if not [invalid_source_ip] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
    }
  }
  if [source_port] not in ["","-"] {
    mutate {
      replace => {
        "principal.port" => "%{source_port}"
      }
      on_error => "invalid_source_port"
    }
    if not [invalid_source_port] {
      mutate {
        convert => {
          "principal.port" => "integer"
        }
        on_error => "conversion_failure"
      }
    }
  }
  if [logon_process] != "" {
    mutate {
      replace => {
        "logon_process_label.key" => "Logon Process"
        "logon_process_label.value" => "%{logon_process}"
      }
      on_error => "invalid_logon_process"
    }
    if not [invalid_logon_process] {
      mutate {
        merge => {
          "security_result.detection_fields" => "logon_process_label"
        }
        on_error => "invalid_logon_process_label"
      }
    }
  }
  if [authentication_package] not in ["","-"] {
    mutate {
      replace => {
        "authentication_package_label.key" => "Authentication Package"
        "authentication_package_label.value.string_value" => "%{authentication_package}"
      }
      on_error => "invalid_authentication_package"
    }
    if not [invalid_authentication_package] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "authentication_package_label"
        }
        on_error => "invalid_authentication_package_label"
      }
    }
  }
  if [transited_services] not in ["","-"] {
    mutate {
      replace => {
        "transited_services_label.key" => "Transited Services"
        "transited_services_label.value" => "%{transited_services}"
      }
      on_error => "invalid_transited_services"
    }
    if not [invalid_transited_services] {
      mutate {
        merge => {
          "security_result.detection_fields" => "transited_services_label"
        }
        on_error => "invalid_transited_services_label"
      }
    }
  }
  if [key_length] != "" {
    mutate {
      replace => {
        "key_length_label.key" => "Key Length"
        "key_length_label.value" => "%{key_length}"
      }
      on_error => "invalid_key_length"
    }
    if not [invalid_key_length] {
      mutate {
        merge => {
          "security_result.detection_fields" => "key_length_label"
        }
        on_error => "invalid_key_length_label"
      }
    }
  }
  if [logon_guid] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{logon_guid}"
      }
      on_error => "invalid_logon_guid"
    }
  }
  if [user_present] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  } else if [principal_present] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
