# Product: CloudGenix SD-WAN
# Category: Switches, Routers
# Supported Format: SYSLOG + KV
# Reference: See below
# Last Updated: 2022-09-08
# Copyright 2021 Chronicle LLC


# Additional references:
# https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cloudgenix/configuration-guides/CloudGenix-Configuring-Syslog-Server-Support.pdf
# https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/cloudgenix/troubleshooting-guides/CloudGenix-Alerts-Alarms-Guide.pdf

filter {
  mutate {
    replace => {
      "syslog" => ""
      "flowlog" => ""
      "src_ip" => ""
      "dest_ip" => ""
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Palo Alto Networks"
      "event.idm.read_only_udm.metadata.product_name" => "CloudGenix SD-WAN"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }

  grok {
    match => {
      "message" => [
      "%{TIMESTAMP_ISO8601:ts} (%{IP:src_ip}|%{DATA}) %{WORD:log_type} - - - %{GREEDYDATA:syslog}"
      "\<%{NONNEGINT}\>%{SYSLOGTIMESTAMP:ts} %{WORD:log_type}:\\s+%{GREEDYDATA:syslog}"
      "\<%{NONNEGINT}\>%{NUMBER} %{TIMESTAMP_ISO8601} %{SYSLOGHOST:device_name} %{DATA:log_type} %{NUMBER:pid} - - %{GREEDYDATA:flowlog}"
      ]
    }
    overwrite => ["syslog", "flowlog","src_ip"]
    on_error => "grok_failure"
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }
  }

  if [syslog] != "" {
    mutate {
      replace => {
        "AL_ID" => ""
        "CIRCUIT_LABELS" => ""
        "CLOUDGENIX_HOST" => ""
        "ION_HOST" => ""
        "CODE" => ""
        "DEVICE_TIME" => ""
        "ELEMENT_ID" => ""
        "EXTENDED_STATE" => ""
        "FACILITY" => ""
        "IDENTIFIER" => ""
        "MSG" => ""
        "NAME" => ""
        "PARENT_INTERFACE" => ""
        "PROCESS_NAME" => ""
        "REASON" => ""
        "REMOTE_HOSTNAME" => ""
        "REMOTE_IP" => ""
        "SEVERITY" => ""
        "STATUS" => ""
        "VPN_LINK_ID" => ""
      }
    }

    kv {
      source => "syslog"
      field_split => " "
      value_split => "="
      trim_value => "\""
      on_error => "not_kv"
    }

    date {
      match => ["DEVICE_TIME", "ISO8601"]
      on_error => "date_format_failure"
    }

    if [not_kv] {
     mutate {
       gsub => ["syslog","\\\"",""]
     }
     grok {
       match => {
         "syslog" => "ION_HOST=%{DATA:ION_HOST} DEVICE_TIME=%{DATA:DEVICE_TIME} MSG=%{GREEDYDATA:MSG} SEVERITY=%{DATA:SEVERITY} PROCESS_NAME=%{DATA:PROCESS_NAME} FACILITY=%{DATA:FACILITY} ELEMENT_ID=%{DATA:ELEMENT_ID} "
       }
       overwrite => ["ION_HOST","DEVICE_TIME","MSG","SEVERITY","PROCESS_NAME","FACILITY","ELEMENT_ID"]
       on_error => "grok_failure"
     }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{CODE}%{FACILITY}"
      }
    }

    if [CLOUDGENIX_HOST] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{CLOUDGENIX_HOST}"
        }
      }
    }
    else if [ION_HOST] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{ION_HOST}"
        }
      }
    }
    if [NAME] != "" {
      mutate {
        replace => {
          "_intermediary.hostname" => "%{CLOUDGENIX_HOST}"
          "event.idm.read_only_udm.principal.hostname" => "%{NAME}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "_intermediary"
        }
      }
    }
    if [PROCESS_NAME] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{PROCESS_NAME}"
        }
      }
    }

    if [REMOTE_IP] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "REMOTE_IP"
        }
      }
    }
    if [REMOTE_HOSTNAME] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{REMOTE_HOSTNAME}"
        }
      }
    }
    if [VPN_LINK_ID] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.id" => "%{VPN_LINK_ID}"
        }
      }
    }

    if [CODE] =~ "_DOWN" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_SHUTDOWN"
        }
      }
    }
    else if [CODE] =~ "_RESTART" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
        }
      }
    }

    if [IDENTIFIER] != "" {
      mutate {
        replace => {
          "_label1.key" => "IDENTIFIER"
          "_label1.value" => "%{IDENTIFIER}"
        }
      }
      mutate {
        merge => {
          "_about.labels" => "_label1"
        }
      }
    }
    if [ELEMENT_ID] != "" {
      mutate {
        replace => {
          "_label2.key" => "ELEMENT_ID"
          "_label2.value" => "%{ELEMENT_ID}"
        }
      }
      mutate {
        merge => {
          "_about.labels" => "_label2"
        }
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "_about"
      }
    }

    if [MSG] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{MSG}"
        }
      }
    }

    if [MSG] != "" {
      grok  {
        match => {
          "MSG" => [
             ".* to %{IP:dest_ip}",
             ".*rhost=%{IP:dest_ip}"
             ".* (from|with) %{IP:dest_ip}.*"
          ]
        }
        overwrite => ["dest_ip"]
        on_error => "msg_failure"
      }
      if [dest_ip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "dest_ip"
          }
        }
      }
    }

    mutate {
      replace => {
        "sec_result.summary" => "%{CODE}"
        "sec_result_action" => "UNKNOWN_ACTION"
        "sec_result.severity" => "UNKNOWN_SEVERITY"
        "sec_result.severity_details" => "%{SEVERITY}"
      }
    }
    if [SEVERITY] == "minor" {
      mutate {
        replace => {
          "sec_result.severity" => "LOW"
        }
      }
    }
    else if [SEVERITY] == "major" {
      mutate {
        replace => {
          "sec_result.severity" => "MEDIUM"
        }
      }
    }
    else if [SEVERITY] == "critical" {
      mutate {
        replace => {
          "sec_result.severity" => "HIGH"
        }
      }
    }
    mutate {
      merge => {
        "sec_result.action" => "sec_result_action"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }

    if [MSG] =~ (".*closing|.*closed|.*authentication failure|.*fail|.*Invalid user|.*Failed|.*Disconnect.*|.*denied|.*timeout") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_SHUTDOWN"
        }
      }
    }
    else if [src_ip] != "" and [dest_ip] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_FLOW"
        }
      }
    }
    else if [MSG] =~ (".*initiating|.*established|.*establishing|.*check pass") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_STARTUP"
        }
      }
    }
    else if [MSG] =~ (".*no such user|.*deleting|.*deleted") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
        }
      }
    }
    else if [src_ip] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }
  else if [flowlog] != "" {
    mutate {
      replace => {
        "EVENT_TIME" => ""
        "SRC_IP" => ""
        "SRC_PORT" => ""
        "DST_IP" => ""
        "DST_PORT" => ""
        "PROTOCOL_NAME" => ""
        "PKTS_SENT" => ""
        "PKTS_RECVD" => ""
        "BYTES_SENT" => ""
        "BYTES_RECVD" => ""
        "SRC_INTERFACE" => ""
        "DST_INTERFACE" => ""
        "PATH_ID" => ""
        "APP_NAME" => ""
        "FLOW_EVENT" => ""
        "ZBFW_CLASSIFICATION_RULES" => ""
        "RULE_NAME" => ""
        "SOURCE_ZONE_NAME" => ""
        "DESTINATION_ZONE_NAME" => ""
        "ACTION" => ""
        "ACTION_CODE" => ""
      }
    }

    grok {
      match => {
        "flowlog" => [
        "%{DATA:EVENT_TIME},%{DATA:SRC_IP},%{DATA:SRC_PORT},%{DATA:DST_IP},%{DATA:DST_PORT},%{DATA:PROTOCOL_NAME},%{DATA},%{DATA},%{DATA:PKTS_SENT},%{DATA:PKTS_RECVD},%{DATA:BYTES_SENT},%{DATA:BYTES_RECVD},%{DATA:SRC_INTERFACE},%{DATA:DST_INTERFACE},%{DATA:PATH_ID},%{DATA:APP_NAME},%{DATA:FLOW_EVENT},%{GREEDYDATA:ZBFW_CLASSIFICATION_RULES}"
        ]
      }
      overwrite => ["EVENT_TIME", "SRC_IP", "SRC_PORT", "DST_IP", "DST_PORT", "PROTOCOL_NAME", "PKTS_SENT", "PKTS_RECVD", "BYTES_SENT", "BYTES_RECVD", "SRC_INTERFACE", "DST_INTERFACE", "PATH_ID", "APP_NAME", "FLOW_EVENT", "ZBFW_CLASSIFICATION_RULES"]
    }

    if [ZBFW_CLASSIFICATION_RULES] != "" {
      grok {
        match => {
          "ZBFW_CLASSIFICATION_RULES" => [
          "%{DATA:RULE_NAME}:%{DATA:SOURCE_ZONE_NAME}:%{DATA:DESTINATION_ZONE_NAME}:%{DATA:ACTION}:%{GREEDYDATA:ACTION_CODE}"
          ]
        }
        overwrite => ["RULE_NAME", "SOURCE_ZONE_NAME", "DESTINATION_ZONE_NAME", "ACTION", "ACTION_CODE"]
      }
      mutate {
        replace => {
          "_label1.key" => "SOURCE_ZONE_NAME"
          "_label1.value" => "%{SOURCE_ZONE_NAME}"
        }
      }
      mutate {
        merge => {
          "_about.labels" => "_label1"
        }
      }
      mutate {
        replace => {
          "_label2.key" => "DESTINATION_ZONE_NAME"
          "_label2.value" => "%{DESTINATION_ZONE_NAME}"
        }
      }
      mutate {
        merge => {
          "_about.labels" => "_label2"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "_about"
        }
      }
    }

    date {
      match => ["EVENT_TIME", "yyyy-MM-ddTHH:mm:ss"]
    }

    mutate {
      uppercase => ["PROTOCOL_NAME"]
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_FLOW"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{log_type}"
      }
    }

    # network
    if [PROTOCOL_NAME] in ["EIGRP","ESP","ETHERIP","GRE","ICMP","IGMP","IP6IN4","PIM","TCP","UDP","VRRP"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "%{PROTOCOL_NAME}"
        }
      }
    }
    if [BYTES_SENT] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.sent_bytes" => "%{BYTES_SENT}"
        }
        convert => {
          "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
        }
      }
    }
    if [BYTES_RECVD] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.received_bytes" => "%{BYTES_RECVD}"
        }
        convert => {
          "event.idm.read_only_udm.network.received_bytes" => "uinteger"
        }
      }
    }
    if [APP_NAME] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{APP_NAME}"
        }
      }
    }

    # principal
    if [SRC_INTERFACE] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{SRC_INTERFACE}"
        }
      }
    }
    if [SRC_IP] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "SRC_IP"
        }
      }
    }
    if [SRC_PORT] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{SRC_PORT}"
        }
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
    }

    # target
    if [DST_INTERFACE] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{DST_INTERFACE}"
        }
      }
    }
    if [DST_IP] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "DST_IP"
        }
      }
    }
    if [DST_PORT] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{DST_PORT}"
        }
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
      }
    }

    # intermediary
    mutate {
      replace => {
        "_intermediary.hostname" => "%{device_name}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "_intermediary"
      }
    }

    # sec_result
    mutate {
      replace => {
        "sec_result.summary" => "%{FLOW_EVENT} - from %{SRC_IP} to %{DST_IP}"
        "sec_result_action" => "UNKNOWN_ACTION"
        "sec_result.severity" => "INFORMATIONAL"
      }
    }
    if [ACTION_CODE] == "1" {
      mutate {
        replace => {
          "sec_result_action" => "ALLOW"
        }
      }
    }
    else if [ACTION_CODE] != "" {
      mutate {
        replace => {
          "sec_result_action" => "BLOCK"
        }
      }
    }
    if [RULE_NAME] != "" {
      mutate {
        replace => {
          "sec_result.rule_name" => "%{RULE_NAME}"
        }
      }
    }
    mutate {
      merge => {
        "sec_result.action" => "sec_result_action"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" = "event"
    }
  }
}
