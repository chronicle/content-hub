# Google SecOps Default CBN Parser (CLOUDGENIX_SDWAN)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/CLOUDGENIX_SDWAN/default/cloudgenix_sdwan.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "CLOUDGENIX"
      "event.idm.read_only_udm.metadata.product_name" => "CLOUDGENIX_SDWAN"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
