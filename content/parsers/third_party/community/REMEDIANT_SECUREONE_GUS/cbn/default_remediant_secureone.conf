# Product: Remediant SecureONE
# Category: Privileged Account Activity
# Supported Format: SYSLOG + JSON
# Reference: N/A
# Last Updated: 2025-07-09
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "client.requestIP" => ""
      "client_ip" => ""
      "req_id" => ""
      "name" => ""
      "msg" => ""
      "json_message" => ""
      "req.url" => ""
      "res.statusCode" => ""
      "time" => ""
      "ldapName" => ""
      "asctime" => ""
      "server" => ""
      "access.user.sAMAccountName" => ""
      "authData.access.role" => ""
      "targetSystem.cn" => ""
      "targetSystem.domain_netbios" => ""
      "hostname" => ""
      "script_cmd" => ""
      "pid" => ""
      "level" => ""
      "res.header" => ""
      "system" => ""
      "createdBy" => ""
      "user" => ""
      "user_cn" => ""
      "user_description" => ""
      "user_domain_fqdn" => ""
      "client" => ""
      "client_ua_browser" => ""
      "client_ua_os" => ""
      "client_ua_platform" => ""
      "client_ua_version" => ""
      "req.method" => ""
      "req.remoteAddress" => ""
      "remote_address" => ""
      "req.remotePort" => ""
      "req.headers" => ""
      "req_header_user_agent" => ""
      "req_headers_host" => ""
      "duration" => ""
      "principal_machine_id_present" => "false"
      "target_machine_id_present" => "false"
      "principal_user_present" => "false"
      "target_user_present" => "false"
      "minimal_required_mapping_present" => "false"
      "timestamp" => ""
      "source_application" => ""
      "json_body" => ""
      "event_type" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "security_result" => ""
      "network" => ""
      "additional" => ""
      "src" => ""
      "details.failover_dc" => ""
      "details.initial_dc" => ""
      "sync_end_ts" => ""
      "sync_start_ts" => ""
      "details.sync_end_ts" => ""
      "details.sync_start_ts" => ""
      "targetSystem.policy.strict_secure" => ""
      "targetSystem.policy.secure" => ""
      "disabled_label" => ""
      "policy.secure" => ""
      "policy.strict_secure" => ""
      "secure" => ""
      "strict_secure" => ""
      "targetSystem.policy.scan" => ""
      "policy.scan" => ""
      "scan" => ""
      "disabled_label1" => ""
      "persistent" => ""
      "user_domain" => ""
      "user_sid" => ""
      "user_user" => ""
      "access.type" => ""
      "access.tokenId" => ""
      "access.tokenType" => ""
      "access.user.domain_netbios" => ""
      "access.user.objectSid" => ""
      "targetSystem.distinguishedName" => ""
      "targetSystem.policy.manage_local_sids" => ""
      "intermediary" => ""
      "has_target" => "false"
      "req.query.page" => ""
      "req_query_page" => ""
      "req.query.limit" => ""
      "req_query_limit" => ""
      "req.params.computerId" => ""
      "req_params_computerId" => ""
      "req.id" => ""
      "req_id_key" => ""
      "targetSystem._id" => ""
      "targetSystem_id" => ""
      "user.domain_netbios" => ""
      "user_domain_netbios" => ""
      "user.objectSid" => ""
      "user_objectSid" => ""
      "user.id" => ""
      "user_id" => ""
      "targetSystem.operatingSystem" => ""
      "targetSystem_operatingSystem" => ""
      "user.distinguishedName"=> ""
      "user_distinguishedName" => ""
    }
  }

  mutate {
    gsub => [
      "message", "\"message\":", "\"json_message\":"
    ]
  }
  mutate {
    gsub => [
      "message", "\\\r\\\n", ""
    ]
  }

  # extract JSON from syslog message
  grok {
    match => {
       "message" => [
          "<%{INT:pri}>%{SYSLOGTIMESTAMP:timestamp} %{DATA:source_application}:%{SPACE}\\$ %{GREEDYDATA:script_cmd}",
          "<%{INT:pri}>%{SYSLOGTIMESTAMP:timestamp} %{DATA:source_application}: %{GREEDYDATA:json_body}"
        ]
    }
    overwrite => ["timestamp", "source_application", "script_cmd", "json_body"]
    on_error  => "header_grok_match_failed"
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json_message"
  }
  json {
    source => "json_message"
    array_function => "split_columns"
    on_error => "not_json_message_grok"
  }

  if [header_grok_match_failed] and [not_json_message] {
    drop { tag => "TAG_UNSUPPORTED" }
  }

  # extract fields from JSON
  if [json_body] != "" {
    json {
      source         => "json_body"
      array_function => "split_columns"
      on_error       => "not_json"
    }

    if [not_json] {
      drop { tag => "TAG_MALFORMED_ENCODING" }
    }
  }

  if [time] != "" {
    date {
      match => ["time", "ISO8601"]
      on_error => "time_match_failed"
    }
  }

  if [msg] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{msg}"
      }
      on_error => "msg_invalid"
    }
  }

  if [json_message] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{json_message}"
      }
      on_error => "json_message_invalid"
    }
  }

  mutate {
    replace => {
      "client_request_ip" => "%{client.requestIP}"
    }
    on_error => "client_request_ip_not_found"
  }
  if ![client_request_ip_not_found] and [client][requestIP] != "" {
    grok {
      match => {
        "client.requestIP" => ["::ffff:%{GREEDYDATA:client_ip}"]
      }
      overwrite => ["client_ip"]
      on_error => "client_ip_not_found"
    }
    if [client_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "client_ip"
        }
        on_error => "client_ip_invalid"
      }
      if ![client_ip_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
            "minimal_required_mapping_present" => "true"
          }
        }
      }
    }
  }

  if [targetSystem][cn] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{targetSystem.cn}"
      }
      on_error => "target_system_cn_invalid"
    }
    if ![target_system_cn_invalid] {
      mutate {
        replace => {
          "principal_machine_id_present" => "true"
          "minimal_required_mapping_present" => "true"
        }
      }
    }
  }

  if [access][user][sAMAccountName] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{access.user.sAMAccountName}"
      }
      on_error => "sAMAccountName_invalid"
    }
    if ![sAMAccountName_invalid] {
      mutate {
        replace => {
          "principal_user_present" => "true"
          "minimal_required_mapping_present" => "true"
        }
      }
    }
  }

  if [authData][access][role] != "" {
    mutate {
      replace => {
        "principal.user.role_name" => "%{authData.access.role}"
      }
      on_error => "authData_access_role_invalid"
    }
    if ![authData_access_role_invalid] {
      mutate {
        replace => {
          "principal_user_present" => "true"
          "minimal_required_mapping_present" => "true"
        }
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "src.hostname" => "%{hostname}"
      }
      on_error => "hostname_invalid"
    }
  }

  if [server] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{server}"
      }
      on_error => "server_invalid"
    }
    if ![server_invalid] {
      mutate {
        replace => {
          "target_machine_id_present" => "true"
          "minimal_required_mapping_present" => "true"
        }
      }
    }
  }
  mutate {
    replace => {
      "targetsystem" => "%{targetSystem.cn}"
    }
    on_error => "targetsystem_invalid"
  }
  if ![targetsystem_invalid] and [targetsystem] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{targetsystem}"
        "target.asset.hostname" => "%{targetsystem}"
      }
      on_error => "target_system_cn_invalid_target"
    }
    if ![target_system_cn_invalid_target] {
      mutate {
        replace => {
          "has_target" => "true"
          "minimal_required_mapping_present" => "true"
        }
      }
    }
  }

  if [req_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{req_id}"
      }
      on_error => "req_id_invalid"
    }
  }

  if [req][url] != "" {
    mutate {
      replace => {
        "target.url" => "%{req.url}"
      }
      on_error => "req_url_invalid"
    }
  }

  if [res][statusCode] != "" {
    mutate {
      convert => {
        "res.statusCode" => "integer"
      }
      on_error => "status_code_already_integer"
    }
    mutate {
      rename => {
        "res.statusCode" => "network.http.response_code"
      }
      on_error => "status_code_invalid"
    }
  }

  if [req][headers] != "" {
    mutate {
      replace => {
        "req_header_user_agent" => "%{req.headers.user-agent}"
      }
      on_error => "user_agent_value_invalid"
    }
    if ![user_agent_value_invalid] and [req_header_user_agent] != "" {
      mutate {
        replace => {
          "network.http.user_agent" => "%{req_header_user_agent}"
        }
        on_error => "user_agent_value_invalid"
      }
    }

    mutate {
      replace => {
        "req_headers_host" => "%{req.headers.host}"
      }
      on_error => "req_headers_host_not_found"
    }
    if ![req_headers_host_not_found] and [req_headers_host] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{req_headers_host}"
        }
        on_error => "req_headers_host_invalid"
      }
      if ![req_headers_host_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
            "minimal_required_mapping_present" => "true"
          }
        }
      }
    }
    if [req_headers_host] != "" and ![req_headers_host_not_found]{
      mutate {
        replace => {
          "intermediary.hostname" => "%{req_headers_host}"
          "intermediary.asset.hostname" => "%{req_headers_host}"
        }
        on_error => "req_headers_host_invalid"
      }
    }

    for key, value in req.headers map {
      mutate {
        replace => {
          "req_header_map_label" => ""
        }
      }
      if [key] not in ["", "user-agent", "host"] {
        mutate {
          replace => {
            "req_header_map_label.key" => "req header %{key}"
          }
          on_error => "req_header_key_invalid"
        }
        if ![req_header_key_invalid] and [value] != "" {
          mutate {
            replace => {
              "req_header_map_label.value" => "%{value}"
            }
            on_error => "req_value_nested"
          }
          if ![req_header_key_invalid] and ![req_value_nested] {
            mutate {
              merge => {
                "principal.resource.attribute.labels" => "req_header_map_label"
              }
              on_error => "req_header_map_label_merge_failed"
            }
          }
        }
      }
    }
  }

  if [req][method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{req.method}"
      }
      on_error => "req_method_invalid"
    }
  }
  if [req][remoteAddress] != "" {
    grok {
      match => {
        "req.remoteAddress" => ["::ffff:%{GREEDYDATA:remote_address}"]
      }
      overwrite => ["remote_address"]
      on_error => "remote_address_not_ip"
    }
    if ![remote_address_not_ip] and [remote_address] != "" and [remote_address] != [client_ip]{
      mutate {
        merge => {
          "principal.ip" => "remote_address"
        }
        on_error => "remote_address_ip_merge_failed"
      }
      if ![remote_address_ip_merge_failed] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
            "minimal_required_mapping_present" => "true"
          }
        }
      }
    }
  }

  if [req][remotePort] != "" {
    mutate {
      convert => {
        "req.remotePort" => "integer"
      }
      on_error => "remotePort_already_integer"
    }
    mutate {
      rename => {
        "req.remotePort" => "principal.port"
      }
      on_error => "remote_port_invalid"
    }
  }

  if [ldapName] != "" {
    mutate {
      replace => {
        "target.administrative_domain" => "%{ldapName}"
      }
      on_error => "ldapname_invalid"
    }
  }

  if [targetSystem][domain_netbios] != "" {
    mutate {
      replace => {
        "principal.administrative_domain" => "%{targetSystem.domain_netbios}"
      }
      on_error => "domain_netbios_invalid"
    }
  }

  # my mappings
  if [source_application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{source_application}"
      }
      on_error => "source_application_invalid"
    }
  }
  if [script_cmd] != "" {
    mutate {
      replace => {
        "principal.process.command_line" => "%{script_cmd}"
      }
      on_error => "script_cmd_invalid"
    }
  }

  if [pid] != "" {
    mutate {
      convert => {
        "pid" => "string"
      }
      on_error => "pid_already_string"
    }
    mutate {
      replace => {
        "principal.process.pid" => "%{pid}"
      }
      on_error => "pid_invalid"
    }
  }

  if [level] != "" {
    mutate {
      convert => {
        "level" => "string"
      }
      on_error => "level_already_string"
    }
    mutate {
      replace => {
        "level_label.key" => "level"
        "level_label.value" => "%{level}"
       }
       on_error => "level_invalid"
    }
    if ![level_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "level_label"
        }
        on_error => "level_label_merge_failed"
      }
    }
  }

  if [res][header] != "" {
    for key, value in res.header map{
      mutate {
        replace => {
          "header_map_label" => ""
        }
      }
      if [key] != "" {
        mutate {
          replace => {
            "header_map_label.key" => "res header %{key}"
          }
          on_error => "header_key_invalid"
        }
        if ![header_key_invalid] and [value] != "" {
          mutate {
            replace => {
              "header_map_label.value" => "%{value}"
            }
            on_error => "header_value_invalid"
          }
          if ![header_value_invalid] {
            mutate {
              merge => {
                "target.resource.attribute.labels" => "header_map_label"
              }
              on_error => "header_map_label_merge_failed"
            }
          }
        }
      }
    }
  }

  if [system] !=  "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{system}"
      }
      on_error => "system_value_invalid"
    }
  }

  if [createdBy] != "" {
    mutate {
      replace => {
        "createdBy_label.key" => "createdBy"
        "createdBy_label.value.string_value" => "%{createdBy}"
       }
       on_error => "createdBy_invalid"
    }
    if ![createdBy_invalid] {
      mutate {
        merge => {
          "additional.fields" => "createdBy_label"
        }
        on_error => "createdBy_label_merge_failed"
      }
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "user_cn" => "%{user.cn}"
      }
      on_error => "user_cn_not_found"
    }
    if ![user_cn_not_found] {
      mutate {
        replace => {
          "principal.user.userid" => "%{user_cn}"
        }
        on_error => "user_cn_invalid"
      }
      if ![user_cn_invalid] and [user_cn] != "" {
        mutate {
          replace => {
            "principal_user_present" => "true"
            "minimal_required_mapping_present" => "true"
          }
        }
      }
    }

    mutate {
      replace => {
        "user_domain_fqdn" => "%{user.domain_fqdn}"
      }
      on_error => "user_domain_fqdn_not_found"
    }
    if ![user_domain_fqdn_not_found] and [user_domain_fqdn] != "" {
      mutate {
        replace => {
          "principal.administrative_domain" => "%{user_domain_fqdn}"
        }
        on_error => "user_domain_fqdn_invalid"
      }
    }
  }

  if [client] != "" {
    mutate {
      replace => {
        "client_ua_browser" => "%{client.userAgent.browser}"
      }
      on_error => "client_ua_browser_empty"
    }
    if [client_ua_browser] != "" {
      mutate {
        replace => {
          "browser_label.key" => "browser"
          "browser_label.value" => "%{client_ua_browser}"
        }
        on_error => "browser_value_invalid"
      }
      if ![browser_value_invalid] {
        mutate {
          merge => {
            "principal.resource.attribute.labels" => "browser_label"
          }
          on_error => "browser_label_merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "client_ua_os" => "%{client.userAgent.os}"
      }
      on_error => "client_ua_os_empty"
    }
    if [client_ua_os] =~  "(?i)windows" {
      mutate {
        replace => {
          "principal.platform" => "WINDOWS"
        }
        on_error => "client_ua_os_invalid"
      }
    }
    else if [client_ua_os] =~  "(?i)linux" {
      mutate {
        replace => {
          "principal.platform" => "LINUX"
        }
        on_error => "client_ua_os_invalid"
      }
    }
    else if [client_ua_os] =~  "(?i)mac" {
      mutate {
        replace => {
          "principal.platform" => "MAC"
        }
        on_error => "client_ua_os_invalid"
      }
    }
    mutate {
      replace => {
        "client_ua_platform" => "%{client.userAgent.platform}"
      }
      on_error => "client_ua_platform_empty"
    }
    mutate {
      replace => {
        "client_ua_version" => "%{client.userAgent.version}"
      }
      on_error => "client_ua_version_empty"
    }
    if [client_ua_platform] not in ["", "unknown"]  {
      if [client_ua_version] not in ["", "unknown"] {
        mutate {
          replace => {
            "principal.platform_version" => "%{client_ua_platform} %{client_ua_version}"
          }
          on_error => "platform_invalid"
        }
      }
      else {
        mutate {
          replace => {
            "principal.platform_version" => "%{client_ua_platform}"
          }
          on_error => "platform_invalid"
        }
      }
    }
  }

  if [duration] != "" {
    mutate {
      convert => {
        "duration" => "string"
      }
      on_error => "duration_already_string"
    }
    mutate {
      replace => {
        "duration_label.key" => "session_duration"
        "duration_label.value.string_value" => "%{duration}"
      }
      on_error => "duration_invalid"
    }
    if ![duration_invalid] {
      mutate {
        merge => {
          "additional.fields" => "duration_label"
        }
        on_error => "duration_label_merge_failed"
      }
    }
  }

  if [persistent] != "" {
    mutate {
      convert => {
        "persistent" => "string"
      }
      on_error => "persistent_already_string"
    }
    mutate {
      replace => {
        "persistent_label.key" => "persistent"
        "persistent_label.value.string_value" => "%{persistent}"
      }
      on_error => "persistent_invalid"
    }
    if ![persistent_invalid] {
      mutate {
        merge => {
          "additional.fields" => "persistent_label"
        }
        on_error => "persistent_label_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "user_user" => "%{user.user}"
    }
    on_error => "user_user_not_found"
  }
  if [user_user] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{user_user}"
      }
      on_error => "user_user_invalid"
    }
  }
  if [user_user] != "" and ![user_user_invalid] {
    mutate {
      replace => {
        "target.user.userid" => "%{user_user}"
      }
      on_error => "user_user_invalid_target"
    }
    if ![user_user_invalid_target] {
      mutate {
        replace => {
          "target_user_present" => "true"
          "minimal_required_mapping_present" => "true"
        }
      }
    }
  }
  mutate {
    replace => {
      "user_domain" => "%{user.domain}"
    }
    on_error => "user_domain_not_found"
  }
  if [user_domain] != "" {
    mutate {
      replace => {
        "user_domain_label.key" => "user domain"
        "user_domain_label.value" => "%{user_domain}"
      }
      on_error => "user_domain_invalid"
    }
    if ![user_domain_invalid] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "user_domain_label"
        }
        on_error => "user_domain_label_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "user_sid" => "%{user.sid}"
    }
    on_error => "user_sid_not_found"
  }
  if [user_sid] != "" {
    mutate {
      replace => {
        "principal.user.windows_sid" => "%{user_sid}"
      }
      on_error => "user_sid_invalid"
    }
  }
  if [access][type] != "" {
    mutate {
      replace => {
        "access_type_label.key" => "access type"
        "access_type_label.value.string_value" => "%{access.type}"
      }
      on_error => "access_type_invalid"
    }
    if ![access_type_invalid] {
      mutate {
        merge => {
          "additional.fields" => "access_type_label"
        }
        on_error => "access_type_label_merge_failed"
      }
    }
  }
  if [access][tokenId] != "" {
    mutate {
      replace => {
        "access_tokenId_label.key" => "access tokenId"
        "access_tokenId_label.value.string_value" => "%{access.tokenId}"
      }
      on_error => "access_tokenId_invalid"
    }
    if ![access_tokenId_invalid] {
      mutate {
        merge => {
          "additional.fields" => "access_tokenId_label"
        }
        on_error => "access_tokenId_label_merge_failed"
      }
    }
  }
  if [access][tokenType] != "" {
    mutate {
      replace => {
        "access_tokenType_label.key" => "access tokenType"
        "access_tokenType_label.value.string_value" => "%{access.tokenType}"
      }
      on_error => "access_tokenType_invalid"
    }
    if ![access_tokenType_invalid] {
      mutate {
        merge => {
