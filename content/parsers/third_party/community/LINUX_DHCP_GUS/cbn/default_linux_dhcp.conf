# Product: Linux DHCP
# Category: DHCP
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2024-09-05
# Copyright 2023 Chronicle LLC

filter {
    mutate {
        replace => {
            "data" => ""
            "event_time" => ""
            "inter_ip" => ""
            "inter_host" => ""
            "application" => ""
            "pid" => ""
            "type" => ""
            "src_port" => ""
            "additional" => ""
            "t_host" => ""
            "ciaddr" => ""
            "chaddr" => ""
            "giaddr" => ""
            "lease_time" => ""
            "desc" => ""
            "action" => ""
            "opcode" => ""
            "src_host" => ""
            "principal" => ""
            "mac" => ""
            "intermediary" => ""
            "src_ip" => ""
            "network" => ""
            "security_result" => ""
            "event_type" => "GENERIC_EVENT"
            "event.idm.read_only_udm.metadata.vendor_name" => "Linux"
            "event.idm.read_only_udm.metadata.product_name" => "Linux DHCP"
            "sc_summary" => ""
            "chaddr1" => ""
            "dhcp_request" => ""
            "no_mac" => ""
            "logstash.process.host" => ""
            "logstash.collect.host" => ""
            "logstash.ingest.host" => ""
            "host.hostname" => ""
            "host.os.platform" => ""
            "host.os.version" => ""
            "host.os.family" => ""
            "host.os.name" => ""
            "host.os.kernel" => ""
            "host.id" => ""
            "host.ip" => ""
            "host.mac" => ""
            "host.architecture" => ""
            "agent.type" => ""
            "agent.id" => ""
            "agent.version" => ""
            "agent.hostname" => ""
            "agent.name" => ""
            "msg" => ""
            "logstash.process.timestamp" => ""
            "logstash.collect.timestamp" => ""
            "logstash.ingest.timestamp" => ""
            "logstash.irm_site" => ""
            "logstash.irm_region" => ""
            "logstash.irm_environment" => ""
            "ecs.version" =>""
            "log.source.address" => ""
            "syslog_severity" => ""
        }
    }

    json {
      source => "message"
      on_error => "not_json"
    }

    # Extracting syslog message from the json entry (for Inflobox logs)
    if [message] =~ "^{.*}$" {
        grok {
            match => {
                "message" => [
                    ".*?\"message\":\"(?P<message>.*?)\",\""
                ]
            }
            overwrite => ["message"]
            on_error => "match_fail"
        }
    }

    # Extracting header data from sylog messages (like syslogtimestamp application process_id)
    grok {
        match => {
            "message" => [
                "%{SYSLOGTIMESTAMP:event_time}\\s+%{IPORHOST:inter_ip}\\s+%{DATA:application}\\[%{INT:pid}\\]:\\s+%{GREEDYDATA:data}"
                "%{TIMESTAMP_ISO8601:event_time} (?P<data>dunkirk) (?P<application>dhcpd): %{GREEDYDATA:msg}",
                "<%{INT}>%{SYSLOGTIMESTAMP:event_time}\\s+%{IPORHOST:inter_ip}\\s+%{WORD:application}\\[(?P<pid>([\\d]+|))\\]:\\s+%{GREEDYDATA:data}"
                "<%{INT}>\\s+(?P<event_time>[\\d-]+\\s[\\d:\\.]+)\\s+[\\w\\.]+\\s+(?P<inter_ip>[\\w\\.]+)\\s+%{WORD:application}\\[(?P<pid>([\\d]+|))\\]:\\s+%{GREEDYDATA:data}"
                "(<%{INT}>)?(?P<event_time>%{MONTH}\\s+%{MONTHDAY} %{TIME}|%{GREEDYDATA}) (?P<inter_ip>[\\w\\.]+)\\s+%{WORD:application}:\\s+%{GREEDYDATA:data}"
                "%{TIMESTAMP_ISO8601:event_time}\\s+%{IPORHOST:inter_ip}\\s+%{WORD:application}\\[%{INT:pid}\\]:\\s+%{GREEDYDATA:data}"
                "<%{INT}>%{SYSLOGTIMESTAMP:event_time}\\s+%{IPORHOST:inter_ip}\\s+%{WORD:application}:\\s+%{GREEDYDATA:data}"
            ]
        }
        overwrite => [
            "data", "event_time", "inter_ip", "application", "pid", "msg"
        ]
        on_error => "head_match_fail"
    }

    if [msg] != "" {
      grok {
        match => {
            "msg" => "%{IP:src_ip}"
        }
        overwrite => [src_ip]
        on_error => "msg_failure"
      }
    }

    if ![not_json] {
      mutate {
        replace => {
          "host.os.platform" => ""
          "host.os.version" => ""
          "host.os.family" => ""
          "host.os.name" => ""
          "host.os.kernel" => ""
          "host.id" => ""
          "host.ip" => ""
          "host.mac" => ""
          "host.architecture" => ""
        }
      }
      if [agent][hostname] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.hostname" => "%{agent.hostname}"
          }
        }
      }

      if [agent][type] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.application" => "%{agent.type}"
          }
        }
      }

      if [agent][id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.asset_id" => "%{agent.type}: %{agent.id}"
          }
        }
      }

      if [agent][version] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.platform_version" => "%{agent.version}"
          }
        }
      }

      if [host][id] != "" {
        mutate {
          replace => {
            "principal.asset.asset_id" => "Host Id: %{host.id}"
          }
          on_error => "host_id_not_present"
        }
      }

      if [host][ip] != "" {
        for ip in host.ip {
          mutate {
            merge => {
              "principal.ip" => "ip"
            }
          }
        }
      }
      if [log][source][address] != "" {
        grok {
          match => {
            "log.source.address" => [
            "%{IP:src_ip}:%{POSINT:src_port}",
            "%{IP:src_ip}"
            ]
          }
          overwrite => ["src_ip","src_port"]
          on_error => "log_source_address_failure"
        }
        if [src_port] != "" {
          mutate {
            replace => {
              "principal.port" => "%{src_port}"
            }
          }
          mutate {
            convert => {
              "principal.port" => "integer"
            }
          }
        }
      }

      if [syslog_severity] != "" {
        if [syslog_severity] =~ "(?i)(error|warning)" {
          mutate {
            replace => {
              "security_result.severity" => "HIGH"
            }
          }
        }
        else if [syslog_severity] =~ "(?i)notice" {
          mutate {
            replace => {
              "security_result.severity" => "MEDIUM"
            }
          }
        }
        else if [syslog_severity] =~ "(?i)(informational|information|info)" {
          mutate {
            replace => {
              "security_result.severity" => "LOW"
            }
          }
        }
        mutate {
          replace => {
            "security_result.severity_details" => "%{syslog_severity}"
          }
        }
      }

      if [host][architecture] != "" {
        mutate {
          replace => {
            "hardware.cpu_platform" => "%{host.architecture}"
          }
          on_error => "architecture_not_present"
        }
        if ![architecture_not_present] {
          mutate {
            merge => {
              "principal.asset.hardware" => "hardware"
            }
          }
        }
      }

      mutate {
        replace => {
          "host_os_platform" => "%{host.os.platform}"
        }
        on_error => "host_platform_not_found"
      }
      if ![host_platform_not_found] {
        if [host_os_platform] == "centos" {
          mutate {
            replace => {
              "principal.platform" => "LINUX"
            }
          }
        }
        else if [host][os][platform] != "" {
          mutate {
            uppercase => ["host.os.platform"]
          }
          mutate {
            replace => {
              "principal.platform" => "%{host.os.platform}"
            }
          }
        }
      }

      if [host][os][version] != "" {
        mutate {
          replace => {
            "principal.platform_version" => "%{host.os.version}"
          }
        }
      }

      if [host][os][kernel] != "" {
        mutate {
          replace => {
            "principal.platform_patch_level" => "%{host.os.kernel}"
          }
        }
      }

      if [host][os][family] != "" {
        mutate {
          replace => {
            "os_family.key" => "os_family"
            "os_family.value" => "os_family:%{host.os.family}"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "os_family"
          }
        }
      }

      if [logstash][process][timestamp] != "" {
        date {
          match => ["logstash.process.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
        }
      }

      if [logstash][collect][timestamp] != "" {
        date {
          match => ["logstash.collect.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
          target => "event.idm.read_only_udm.metadata.collected_timestamp"
        }
      }

      if [logstash][ingest][timestamp] != "" {
        date {
          match => ["logstash.ingest.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
          target => "event.idm.read_only_udm.metadata.ingested_timestamp"
        }
      }

      if [logstash][irm_site] != "" {
        mutate {
          replace => {
            "irmsite.key" => "irm_site"
            "irmsite.value" => "%{logstash.irm_site}"
          }
        }
        mutate {
          merge => {
            "principal.labels" => "irmsite"
          }
        }
      }

      if [logstash][irm_region] != "" {
        mutate {
          replace => {
            "irmregion.key" => "irm_region"
            "irmregion.value" => "%{logstash.irm_region}"
          }
        }
        mutate {
          merge => {
            "principal.labels" => "irmregion"
          }
        }
      }

      if [logstash][irm_environment] != "" {
        mutate {
          replace => {
            "irmenvironment.key" => "irm_environment"
            "irmenvironment.value" => "%{logstash.irm_environment}"
          }
        }
        mutate {
          merge => {
            "principal.labels" => "irmenvironment"
          }
        }
      }

      if [ecs][version] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_version" => "%{ecs.version}"
          }
        }
      }

      if [host][mac] != "" {
        for mac in host.mac {
          mutate {
            merge => {
              "principal.mac" => "mac"
            }
          }
        }
      }

    }

    if [dhcp_request] == "" {
       grok {
         match => {
           "message" => [
             "r-l-e:%{IP:ip},%{WORD:action},%{USERNAME:clientHostname}?,%{MAC:mac},(?P<submsg>.*)",
             "(?P<dhcp_request>BOOTREQUEST) from %{MAC:mac} via %{IP:ip}(?P<submsg>.*)"
           ]
         }
         overwrite => ["ip","clientHostname","mac","dhcp_request","action"]
         on_error => "no_dhcp_system"
       }
    }
    else {
      grok {
        match => { "dhcp_message" => "(on|for|from) %{IP:ip}" }
        on_error => "no_ip"
      }

      grok {
        match => {
          "dhcp_message" => [
             "(to|from) %{COMMONMAC:mac}",
             "to %{IP:ip} \\(%{MAC:mac}\\)"
          ]
        }
        on_error => "no_mac"
        overwrite => ["mac"]
      }

      grok {
        match => {
          "dhcp_message" => "%{COMMONMAC} \\((?P<hostname>[^)]*)\\) via "
        }
        on_error => "no_via"
      }

      grok {
        match => {
        "dhcp_message" => "via ([^ ]+) relay %{IP:intermediary_ip}"
        }
        on_error => "no_via_etx"
      }

      grok {
        match => {
          "dhcp_message" => "via %{IP:intermediary_ip}"
        }
        on_error => "no_intermediary_ip"
      }

      grok {
          match => {
            "dhcp_message" => "lease-duration %{NONNEGINT:lease_duration}"
          }
          on_error => "no_lease_duration"
      }
    }

    if [no_mac] == false or [mac] != "" {
      mutate {
        merge => {
          "principal.mac" => "mac"
        }
      }
    }

    if [dhcp_request] == "DHCPDISCOVER" {
      mutate {
        replace => {
         "network.direction" => "BROADCAST"
         "network.dhcp.type" => "DISCOVER"
        }
        rename => {
         "ip" => "network.dhcp.ciaddr"
        }
      }
    }
    else if [dhcp_request] == "DHCPACK" || [action] == "Renewed" || [action] == "Fixed" || action == "Issued" {
      mutate {
        replace => {
          "network.direction" => "OUTBOUND"
          "network.dhcp.type" => "ACK"
          "network.dhcp.chaddr" => "%{mac}"
        }
        rename => {
          "ip" => "network.dhcp.yiaddr"
          "clientHostname" => "principal.hostname"
        }
      }
    }
    else if [dhcp_request] == "DHCPREQUEST" {
      mutate {
        replace => {
          "network.direction" => "INBOUND"
          "network.dhcp.type" => "REQUEST"
        }
     }
      mutate {
        rename => {
          "ip" => "network.dhcp.ciaddr"
        }
      }
    }
    else if [dhcp_request] == "DHCPRELEASE" || [dhcp_request] == "DHCPEXPIRE" || [action] == "Freed" {
      mutate {
        replace => {
          "network.dhcp.type" => "RELEASE"
        }
        rename => {
          "ip" => "network.dhcp.ciaddr"
        }
      }
    }
    else if [dhcp_request] == "DHCPINFORM" {
      mutate {
        merge => {
          "event.idm.read_only_udm.observer.ip" => "ip"
        }
      }
      mutate {
        replace => {
          "network.direction" => "INBOUND"
          "network.dhcp.type" => "INFORM"
        }
        rename => {
          "ip" => "network.dhcp.ciaddr"
        }
      }
    }
    else if [dhcp_request] == "BOOTREQUEST" {
      mutate {
        replace => {
          "network.dhcp.opcode" => "BOOTREQUEST"
          "network.dhcp.chaddr" => "%{mac}"
        }
        rename => {
          "ip" => "network.dhcp.ciaddr"
        }
      }
    }

    # Assumes that RELEASE refers to DHCPRELEASE.
    if [data] =~ "^RELEASE .*" {
      mutate {
        replace => {
          "data" => "DHCP%{data}"
        }
      }
    }

    # Extracting dhcp.type from messages of the format:
    # DHCP<type> <rest of the message>
    # This also sets dhcp_match_fail variable if message is not of
    # above mentioned format
    grok {
        match => {
            "data" => [
                "DHCP(?P<type>[a-zA-Z]+)\\s+%{GREEDYDATA:additional}"
            ]
        }
        overwrite => [
            "type", "additional"
        ]
        on_error => "dhcp_match_fail"
    }

    # If the DHCP<type> match failed, messages are matched for the following formats:
    # 1. r-l-e:<details>
    # 2. BOOTREQUEST <details>
    # If the match fails, no_dhcp_event is set.
    # All messages that matches upto this filter is considered as NETWORK_DHCP event.
    if [dhcp_match_fail] {
        grok {
            match => {
                "data" => [
                    "r-l-e:%{IPV4:ciaddr},%{WORD:action},%{HOSTNAME:t_host},%{COMMONMAC:chaddr}"
                    "(?P<opcode>BOOTREQUEST)\\s+from\\s+%{COMMONMAC:chaddr}\\s+via\\s+%{IPV4:ciaddr}"
                ]
            }
            overwrite => [
                "ciaddr", "action", "t_host", "chaddr", "opcode"
            ]
            on_error => "no_dhcp_event"
        }

        # If the previous matching filters are failed, one more set of filter is
        # used to extract all messages that falls into NETWORK_UNCATEGORIZED category.
        # All those messages not matched are dropped.
        if [no_dhcp_event] {
            grok {
                match => {
                    "data" => [
                        "%{GREEDYDATA:desc} %{IPV4:ciaddr}.*\\\"%{COMMONMAC:chaddr}.*%{COMMONMAC:chaddr1}\\) %{GREEDYDATA:sc_summary}"
                        "Removed [\\w]+ map [\\w]+ %{HOSTNAME:t_host} [\\w]+ %{IPV4:ciaddr}"
                        "Removed [\\w]+ map [\\w]+ %{HOSTNAME:t_host}"
                        "(?P<action>Unable) to add [\\w]+ map [\\w]+ %{HOSTNAME:t_host} [\\w]+ %{IPV4:ciaddr}: %{GREEDYDATA:desc}"
                        "Added (new |)[\\w]+ map [\\w]+ %{HOSTNAME:t_host} [\\w]+ %{IPV4:ciaddr}"
                        "Added (new |)[\\w]+ map [\\w]+ %{HOSTNAME:src_host} [\\w]+ %{HOSTNAME:t_host}"
                        "Addition [\\w]+ [\\w]+ map [\\w]+ %{IPV4:ciaddr} (?P<action>deferred)"
                        "[\\w]+ map update [\\w]+ %{IPV4:ciaddr} (?P<action>abandoned).*?: %{GREEDYDATA:desc}"
                        "bind update [\\w]+ %{IPV4:ciaddr}.*?(?P<action>rejected): %{GREEDYDATA:desc}"
                        "uid lease %{IPV4:ciaddr} [\\w]+ client %{COMMONMAC:chaddr}"
                        "(reuse_lease:\\s+)?%{GREEDYDATA:desc}\\s+%{IP:src_ip}"
                        "%{GREEDYDATA:desc}"
                    ]
                }
                overwrite => [
                    "t_host", "ciaddr", "action", "desc", "src_host", "chaddr", "src_ip" , "chaddr1" , "sc_summary"
                ]
                on_error => "no_network_event"
            }

            # Dropping messages that are not matched yet.
            if [no_network_event] {
                drop{}
            }

            if [ciaddr] != "" {
              mutate {
                replace => {
                  "network.dhcp.ciaddr" => "%{ciaddr}"
                }
              }
            }

            if [chaddr] != "" {
              mutate {
                replace => {
                  "network.dhcp.chaddr" => "%{chaddr}"
                }
              }
            }

            if [ciaddr] != "" or [chaddr] != "" or [t_host] != "" {
              mutate {
                replace => {
                  "event_type" => "NETWORK_DHCP"
                }
              }
            }

            if [src_ip] != "" {
              mutate {
                merge => {
                  "principal.ip" => "src_ip"
                }
              }
            }

            # Setting target hostname / ip field because target Noun cannot be left empty
            if [t_host] != "" {
                mutate {
                    replace => {
                        "event.idm.read_only_udm.target.hostname" => "%{t_host}"
                    }
                }
            } else if [ciaddr] != ""  {
                mutate {
                    merge => {
                        "event.idm.read_only_udm.target.ip" => "ciaddr"
                    }
                }
            }

            if [action] =~ "(Unable|deferred|abandoned|rejected)" {
                mutate {
                    replace => {
                        "security_result_action" => "BLOCK"
                    }
                }
                mutate {
                    merge => {
                        "security_result.action" => "security_result_action"
                    }
                }
            }

            # A unique case encountered - message was about a mapping created between two hosts.
            # Hence setting the first host to src.hostname
            if [src_host] != "" {
                mutate {
                    replace => {
                        "event.idm.read_only_udm.src.hostname" => "%{src_host}"
                    }
                }
            }

        # Processing for 'no_dhcp_event == false' case
        } else {
            mutate {
                replace => {
                    "event_type" => "NETWORK_DHCP"
                    "network.dhcp.chaddr" => "%{chaddr}"
                }
            }

            # Check if the message is BOOTREQUEST and setting the fields appropriately.
            if [opcode] == "" {
                mutate {
                    replace => {
                        "desc" => "%{action}"
                        "network.dhcp.type" => "ACK"
                        "network.direction" => "OUTBOUND"
                        "network.dhcp.yiaddr" => "%{ciaddr}"
                    }
                }
            } else {
                mutate {
                    replace => {
                        "network.dhcp.ciaddr" => "%{ciaddr}"
                        "network.dhcp.opcode" => "%{opcode}"
                    }
                }
            }
        }

    # Processing for 'dhcp_match_fail == false' case
    } else {

        if [type] == "EXPIRE" {
            mutate {
                replace => {
                    "type" => "WIN_EXPIRED"
                }
            }
        }
        # remove block ends

        # Extracting first part of the DHCP<type> messages
        # DHCP<type> (on|of|for) <data> <rest of message>
        grok {
            match => {
                "additional" => [
                    "on\\s+%{IPV4:ciaddr}\\s+\\(.*?\\)\\s+%{GREEDYDATA:additional}"
                    "on\\s+%{IPV4:ciaddr}\\s+%{GREEDYDATA:additional}"
                    "for\\s+%{IPV4:ciaddr}\\s+\\(.*?\\)\\s+%{GREEDYDATA:additional}"
                    "for\\s+%{IPV4:ciaddr}\\s+%{GREEDYDATA:additional}"
                    "of\\s+%{IPV4:ciaddr}\\s+\\(.*?\\)\\s+%{GREEDYDATA:additional}"
                    "of\\s+%{IPV4:ciaddr}\\s+%{GREEDYDATA:additional}"
                ]
            }
            overwrite => [
                "ciaddr", "additional"
            ]
            on_error => "on_for_of_fail"
        }

        # Extracting second part of the DHCP<type> messages
        # DHCP<type> (on|of|for) <data1> (from|to) <data2> <rest of message>
        grok {
            match => {
                "additional" => [
                    "from\\s+%{IPV4:ciaddr}\\s+\\(%{COMMONMAC:chaddr}\\)\\s+%{GREEDYDATA:additional}"
                    "from\\s+%{COMMONMAC:chaddr}\\s+\\(%{HOSTNAME:t_host}\\)\\s+%{GREEDYDATA:additional}"
                    "from\\s+%{IPV4:ciaddr}\\s+%{GREEDYDATA:additional}"
                    "from\\s+%{COMMONMAC:chaddr}\\s+%{GREEDYDATA:additional}"
                    "from\\s+%{IPV4:ciaddr}"
                    "from\\s+%{COMMONMAC:chaddr}"
                    "to\\s+%{IPV4:ciaddr}\\s+\\(%{COMMONMAC:chaddr}\\)\\s+%{GREEDYDATA:additional}"
                    "to\\s+%{COMMONMAC:chaddr}\\s+\\(%{HOSTNAME:t_host}\\)\\s+%{GREEDYDATA:additional}"
                    "to\\s+%{IPV4:ciaddr}\\s+%{GREEDYDATA:additional}"
                    "to\\s+%{COMMONMAC:chaddr}\\s+%{GREEDYDATA:additional}"
                    "to\\s+%{IPV4:ciaddr}"
                    "to\\s+%{COMMONMAC:chaddr}"
                ]
            }
            overwrite => [
                "ciaddr", "t_host", "chaddr", "additional"
            ]
            on_error => "to_from_fail"
        }

        # Extracting relevant data from the third part of DHCP<type> messages
        # DHCP<type> (on|of|for) <data1> (from|to) <data2> (via|via X relay) <data3> <rest of message>
        grok {
            match => {
                "additional" => [
                    "via\\s+[\\w]+\\s+relay\\s+%{IPV4:giaddr}"
                    "via\\s+%{IPV4:giaddr}"
                ]
            }
            overwrite => [
                "giaddr"
            ]
            on_error => "no_giaddr"
        }

        # Extracting relevant data from the third part of DHCP<type> messages
        # DHCP<type> (on|of|for) <data1> (from|to) <data2> (lease_time) <data3> <rest of message>
        grok {
            match => {
                "additional" => [
                    ".*?lease-duration\\s+(?P<lease_time>[\\d]+)"
                ]
            }
            overwrite => [
                "lease_time"
            ]
            on_error => "no_lease_time"
        }

        # Extracting relevant data from the third part of DHCP<type> messages
        # DHCP<type> (on|of|for) <data1> (from|to) <data2>: <data3>
        grok {
            match => {
                "additional" => [
                    ".*?:\\s+%{GREEDYDATA:desc}"
                ]
            }
            overwrite => [
                "desc"
            ]
            on_error => "no_desc"
        }

        if [no_lease_time] == false {
            mutate {
                convert => {
                    "lease_time" => "uinteger"
                }
            }
            mutate {
                rename => {
                    "lease_time" => "network.dhcp.lease_time_seconds"
                }
            }
        }

        mutate {
            replace => {
                "network.dhcp.giaddr" => "%{giaddr}"
                "network.dhcp.chaddr" => "%{chaddr}"
                "network.direction" => "OUTBOUND"
            }
        }

        if [type] in ["NAK", "ACK","DECLINE", "DISCOVER", "INFORM", "OFFER", "RELEASE", "REQUEST", "WIN_DELETED", "WIN_EXPIRED"] {
          mutate {
            replace => {
              "network.dhcp.type" => "%{type}"
            }
          }
        }

        if [type] =~ "RELEASE|DECLINE" and [ciaddr] == "" {
          mutate {
            replace => {
              "event_type" => "STATUS_UPDATE"
            }
          }
        }
        else {
          mutate {
            replace => {
              "event_type" => "NETWORK_DHCP"
            }
          }
        }

        if [type] =~ "(ACK|EXPIRE)" {
            mutate {
                replace => {
                    "network.dhcp.yiaddr" => "%{ciaddr}"
                }
            }
        } else if [type] =~ "DECLINE" {
            mutate {
                replace => {
                    "network.dhcp.requested_address" => "%{ciaddr}"
                }
            }
        } else {
            mutate {
                replace => {
                    "network.dhcp.ciaddr" => "%{ciaddr}"
                }
            }
        }

        if [type] =~ "(INFORM|REQUEST|DISCOVER)" {
            mutate {
                replace => {
                    "network.direction" => "INBOUND"
                }
            }
        }
    }

    if [t_host] != "" {
      mutate {
        replace => {
          "network.dhcp.client_hostname" => "%{t_host}"
          "principal.hostname" => "%{t_host}"
        }
      }
    }
    else if [ciaddr] != "" {
      mutate {
        merge => {
          "principal.ip" => "ciaddr"
        }
      }
    }
    else if [chaddr] != "" {
      mutate {
        merge => {
          "principal.mac" => "chaddr"
        }
      }
    }

    if [desc] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{desc}"
        }
      }
    }

    if [sc_summary] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{sc_summary}"
        }
      }
    }

    if [chaddr1] != "" {
      mutate {
        merge => {
          "principal.mac" => "chaddr1"
        }
      }
    }

    if [pid] != "" {
      mutate {
        replace => {
          "principal.process.pid" => "%{pid}"
        }
      }
    }

    mutate {
      replace => {
        "principal.application" => "%{application}"
        "inter_host" => "%{inter_ip}"
        "network.application_protocol" => "DHCP"
        "network.ip_protocol" => "UDP"
      }
      convert => {
        "inter_ip" => "ipaddress"
      }
      on_error => "not_inter_ip"
    }

    # Setting the syslog server hostname / ip to principal noun.
    # because NETWORK_DHCP event requires principal device to be set.
    if [not_inter_ip] {
      mutate {
        replace => {
          "intermediary.hostname" => "%{inter_host}"
        }
      }
    }
    else {
      mutate {
        merge => {
          "intermediary.ip" => "inter_host"
        }
      }
    }

    # Formatting date of the format yyyy-MM-dd HH:mm:ss.S
    date {
      match => ["event_time", "yyyy-MM-dd HH:mm:ss.S", "RFC3339"]
      on_error => "date_parse_fail"
    }
    # If the previous date filter fails, parsing again using different format
    # This is separated because we need to rebase the result.
    if [date_parse_fail] {
      date {
        match => [
          "event_time", "MMM dd HH:mm:ss ", "MMM  d HH:mm:ss", "RFC3339" , "UNIX", "ISO8601", "UNIX_MS"
        ]
        rebase => true
        on_error => "date_failure"
      }
    }

    if [event_type] == "GENERIC_EVENT" && [src_ip] != "" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else if [event_type] == "GENERIC_EVENT" && [src_ip] != "" && ([t_host] != "" || [ciaddr] != "") {
      mutate {
        replace => {
          "event_type" => "NETWORK_DHCP"
        }
      }
    }

    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
        "network" => "event.idm.read_only_udm.network"
        "event_type" => "event.idm.read_only_udm.metadata.event_type"
        "action" => "event.idm.read_only_udm.metadata.description"
      }
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
}
