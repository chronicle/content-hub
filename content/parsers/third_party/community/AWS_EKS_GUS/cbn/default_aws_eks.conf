# Product: AWS Elastic Kubernetes Service
# Category: Application server
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-11-02
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event_type" => "GENERIC_EVENT"
      "has_user" => "false"
      "has_principal" => "false"
      "has_resource" => "false"
      "security_result" => ""
      "sr_action" => ""
      "Time_dt" => ""
      "Time" => ""
      "Start_time_dt" => ""
      "Message" => ""
      "Accountid" => ""
      "Region" => ""
      "Asl_version" => ""
      "Severity_id" => ""
      "Severity" => ""
      "Class_name" => ""
      "Class_uid" => ""
      "Category_name" => ""
      "Category_uid" => ""
      "Activity_name" => ""
      "Activity_id" => ""
      "Type_name" => ""
      "Type_uid" => ""
      "vendor_name" => ""
      "product_name" => ""
      "product_version" => ""
      "api_request_uid" => ""
      "api_operation" => ""
      "api_response_code" => ""
      "api_response_message" => ""
      "api_response_message_label" => ""
      "api_response_error" => ""
      "http_url_path" => ""
      "http_user_agent" => ""
      "actor_user_name" => ""
      "actor_user_uid" => ""
      "session_issuer" => ""
      "cloud_provider" => ""
      "src_ip" => ""
      "src_ip_valid" => ""
      "auth_decision" => ""
      "auth_reason" => ""
      "eks_cluster_name" => ""
      "unmapped_source_ips" => ""
      "unmapped_src_ip_valid" => ""
      "impersonated_user" => ""
      "node_name" => ""
      "profiles_label" => ""
      "principal_anc" => ""
      "principal_role" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", ""]
  }
  mutate {
    gsub => ["message", "\\n", ""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.log_type" => "AWS_EKS"
      "event.idm.read_only_udm.metadata.vendor_name" => "AWS"
      "event.idm.read_only_udm.metadata.product_name" => "Amazon EKS"
    }
  }

  mutate {
    convert => {
      "Time_dt" => "string"
    }
    on_error => "time_dt_convert_err"
  }
  mutate {
    convert => {
      "Time" => "string"
    }
    on_error => "time_convert_err"
  }
  mutate {
    convert => {
      "Start_time_dt" => "string"
    }
    on_error => "start_time_dt_convert_err"
  }
  mutate {
    convert => {
      "Api.Response.Code" => "string"
    }
    on_error => "api_response_code_convert_err"
  }
  mutate {
    convert => {
      "Actor.User.Type_id" => "string"
    }
    on_error => "actor_user_type_id_convert_err"
  }
  mutate {
    convert => {
      "Class_uid" => "string"
    }
    on_error => "class_uid_convert_err"
  }
  mutate {
    convert => {
      "Category_uid" => "string"
    }
    on_error => "category_uid_convert_err"
  }
  mutate {
    convert => {
      "Activity_id" => "string"
    }
    on_error => "activity_id_convert_err"
  }
  mutate {
    convert => {
      "Type_uid" => "string"
    }
    on_error => "type_uid_convert_err"
  }
  mutate {
    convert => {
      "Severity_id" => "string"
    }
    on_error => "severity_id_convert_err"
  }

  if [Time_dt] != "" {
    date {
      match => ["Time_dt", "UNIX_MS", "ISO8601", "UNIX"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_time_dt"
    }
  } else if [Time] != "" {
    date {
      match => ["Time", "UNIX_MS", "ISO8601", "UNIX"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_event_time"
    }
  }

  mutate {
    replace => {
      "vendor_name" => "%{Metadata.Product.Vendor_name}"
    }
    on_error => "no_vendor_name"
  }
  if [vendor_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor_name}"
      }
      on_error => "vendor_name_err"
    }
  }

  mutate {
    replace => {
      "product_name" => "%{Metadata.Product.Name}"
    }
    on_error => "no_product_name"
  }
  if [product_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product_name}"
      }
      on_error => "product_name_err"
    }
  }

  mutate {
    replace => {
      "product_version" => "%{Metadata.Product.Version}"
    }
    on_error => "no_product_version"
  }
  if [product_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" =>
          "%{product_version}"
      }
      on_error => "product_version_err"
    }
  }

  for prof in Metadata.Profiles.Array {
    mutate {
      replace => {
        "prof_val" => ""
        "prof_item" => ""
      }
    }
    mutate {
      replace => {
        "prof_val" => "%{prof}"
      }
      on_error => "no_prof_val"
    }
    if [prof_val] != "" {
      mutate {
        replace => {
          "prof_item.string_value" => "%{prof_val}"
        }
        on_error => "prof_string_value_err"
      }
      if ![prof_string_value_err] {
        mutate {
          merge => {
            "profiles_label.value.list_value.values" => "prof_item"
          }
          on_error => "profiles_list_merge_error"
        }
      }
    }
  }
  if [profiles_label] != "" {
    mutate {
      replace => {
        "profiles_label.key" => "metadata_profiles"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "profiles_label"
      }
      on_error => "profiles_label_merge_error"
    }
  }

  mutate {
    replace => {
      "api_request_uid" => "%{Api.Request.Uid}"
    }
    on_error => "no_api_request_uid"
  }
  if [api_request_uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" =>
          "%{api_request_uid}"
      }
      on_error => "product_log_id_err"
    }
  }

  mutate {
    replace => {
      "api_operation" => "%{Api.Operation}"
    }
    on_error => "no_api_operation"
  }
  if [api_operation] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" =>
          "%{api_operation}"
      }
      on_error => "product_event_type_err"
    }
  }

  if [Message] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{Message}"
      }
      on_error => "metadata_description_err"
    }
  }

  mutate {
    replace => {
      "api_response_code" => "%{Api.Response.Code}"
    }
    on_error => "no_api_response_code"
  }
  if [api_response_code] not in ["", "-"] {
    mutate {
      convert => {
        "api_response_code" => "integer"
      }
      on_error => "api_response_code_not_int"
    }
    if ![api_response_code_not_int] {
      mutate {
        rename => {
          "api_response_code" =>
            "event.idm.read_only_udm.network.http.response_code"
        }
        on_error => "api_response_code_err"
      }
    }
  }

  for index, cont in Api.Response.Containers.Array {
    mutate {
      replace => {
        "cont_name" => ""
        "cont_img_name" => ""
        "cont_img_path" => ""
        "cont_img_uid" => ""
        "cont_idx" => ""
        "cont_name_label" => ""
        "cont_img_name_label" => ""
        "cont_img_path_label" => ""
        "cont_img_uid_label" => ""
      }
    }
    mutate {
      copy => {
        "cont_idx" => "index"
      }
      on_error => "no_cont_idx"
    }
    mutate {
      convert => {
        "cont_idx" => "string"
      }
      on_error => "cont_idx_not_converted"
    }
    mutate {
      replace => {
        "cont_name" => "%{cont.Name}"
      }
      on_error => "no_cont_name"
    }
    if [cont_name] != "" {
      mutate {
        replace => {
          "cont_name_label.key" => "api_response_containers_%{cont_idx}_name"
          "cont_name_label.value.string_value" => "%{cont_name}"
        }
        on_error => "cont_name_label_set_err"
      }
      if ![cont_name_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "cont_name_label"
          }
          on_error => "cont_name_label_merge_err"
        }
      }
    }
    mutate {
      replace => {
        "cont_img_name" => "%{cont.Image.Name}"
      }
      on_error => "no_cont_img_name"
    }
    if [cont_img_name] != "" {
      mutate {
        replace => {
          "cont_img_name_label.key" =>
            "api_response_containers_%{cont_idx}_image_name"
          "cont_img_name_label.value.string_value" => "%{cont_img_name}"
        }
        on_error => "cont_img_name_label_set_err"
      }
      if ![cont_img_name_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" =>
              "cont_img_name_label"
          }
          on_error => "cont_img_name_label_merge_err"
        }
      }
    }
    mutate {
      replace => {
        "cont_img_path" => "%{cont.Image.Path}"
      }
      on_error => "no_cont_img_path"
    }
    if [cont_img_path] != "" {
      mutate {
        replace => {
          "cont_img_path_label.key" =>
            "api_response_containers_%{cont_idx}_image_path"
          "cont_img_path_label.value.string_value" => "%{cont_img_path}"
        }
        on_error => "cont_img_path_label_set_err"
      }
      if ![cont_img_path_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" =>
              "cont_img_path_label"
          }
          on_error => "cont_img_path_label_merge_err"
        }
      }
    }
    mutate {
      replace => {
        "cont_img_uid" => "%{cont.Image.Uid}"
      }
      on_error => "no_cont_img_uid"
    }
    if [cont_img_uid] != "" {
      mutate {
        replace => {
          "cont_img_uid_label.key" =>
            "api_response_containers_%{cont_idx}_image_uid"
          "cont_img_uid_label.value.string_value" => "%{cont_img_uid}"
        }
        on_error => "cont_img_uid_label_set_err"
      }
      if ![cont_img_uid_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" =>
              "cont_img_uid_label"
          }
          on_error => "cont_img_uid_label_merge_err"
        }
      }
    }
  }

  mutate {
    replace => {
      "http_url_path" => "%{Http_request.Url.Path}"
    }
    on_error => "no_http_url_path"
  }
  if [http_url_path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{http_url_path}"
      }
      on_error => "url_err"
    }
  }

  mutate {
    replace => {
      "http_user_agent" => "%{Http_request.User_agent}"
    }
    on_error => "no_http_user_agent"
  }
  if [http_user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" =>
          "%{http_user_agent}"
      }
      on_error => "user_agent_err"
    }
  }

  mutate {
    replace => {
      "actor_user_name" => "%{Actor.User.Name}"
    }
    on_error => "no_actor_user_name"
  }
  if [actor_user_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{actor_user_name}"
        "has_user" => "true"
      }
      on_error => "actor_userid_err"
    }
  }

  mutate {
    replace => {
      "actor_user_uid" => "%{Actor.User.Uid}"
    }
    on_error => "no_actor_user_uid"
  }
  if [actor_user_uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id" =>
          "%{actor_user_uid}"
        "has_user" => "true"
      }
      on_error => "actor_product_object_id_err"
    }
  }

  for grp in Actor.User.Groups.Array {
    mutate {
      replace => {
        "grp_name" => ""
      }
    }
    mutate {
      replace => {
        "grp_name" => "%{grp.Name}"
      }
      on_error => "no_grp_name"
    }
    if [grp_name] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" =>
            "grp_name"
        }
        on_error => "grp_name_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "session_issuer" => "%{Actor.Session.Issuer}"
    }
    on_error => "no_session_issuer"
  }
  if [session_issuer] != "" {
    mutate {
      replace => {
        "principal_role.name" => "%{session_issuer}"
      }
      on_error => "principal_role_error"
    }
    if ![principal_role_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.attribute.roles" =>
            "principal_role"
        }
        on_error => "principal_role_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "cloud_provider" => "%{Cloud.Provider}"
    }
    on_error => "no_cloud_provider"
  }
  if [cloud_provider] == "AWS" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.attribute.cloud.environment" =>
          "AMAZON_WEB_SERVICES"
      }
    }
  }

  if [Accountid] not in ["", "null"] {
    mutate {
      replace => {
        "principal_anc.name" => "%{Accountid}"
        "principal_anc.resource_type" => "CLOUD_PROJECT"
      }
      on_error => "principal_anc_set_err"
    }
    if ![principal_anc_set_err] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource_ancestors" =>
            "principal_anc"
        }
        on_error => "principal_anc_merge_err"
      }
    }
  }

  if [Region] not in ["", "null"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.name" => "%{Region}"
      }
      on_error => "principal_location_name_err"
    }
  }

  mutate {
    replace => {
      "src_ip" => "%{Src_endpoint.Ip}"
    }
    on_error => "no_src_ip"
  }
  if [src_ip] != "" {
    grok {
      match => {
        "src_ip" => ["^%{IP:src_ip_valid}$"]
      }
      overwrite => ["src_ip_valid"]
      on_error => "invalid_src_ip"
    }
    if ![invalid_src_ip] and [src_ip_valid] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip_valid"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip_valid"
        }
        on_error => "src_ip_merge_error"
      }
      if ![src_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  for index, res in Resources.Array {
    mutate {
      replace => {
        "res_name" => ""
        "res_type" => ""
        "res_uid" => ""
        "res_ns" => ""
        "res_ver" => ""
        "res_idx" => ""
        "res_ver_label" => ""
        "res_ns_label" => ""
        "res_anc" => ""
      }
    }
    mutate {
      copy => {
        "res_idx" => "index"
      }
      on_error => "no_res_idx"
    }
    mutate {
      convert => {
        "res_idx" => "string"
      }
      on_error => "res_idx_not_converted"
    }
    mutate {
      replace => {
        "res_name" => "%{res.Name}"
      }
      on_error => "no_res_name"
    }
    mutate {
      replace => {
        "res_type" => "%{res.Type}"
      }
      on_error => "no_res_type"
    }
    mutate {
      replace => {
        "res_uid" => "%{res.Uid}"
      }
      on_error => "no_res_uid"
    }
    mutate {
      replace => {
        "res_ns" => "%{res.Namespace}"
      }
      on_error => "no_res_ns"
    }
    mutate {
      replace => {
        "res_ver" => "%{res.Version}"
      }
      on_error => "no_res_ver"
    }

    if [res_idx] == "0" {
      if [res_name] not in ["", "null"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.name" => "%{res_name}"
            "has_resource" => "true"
          }
          on_error => "target_res_name_err"
        }
      }
      if [res_type] not in ["", "null"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.resource_subtype" =>
              "%{res_type}"
            "has_resource" => "true"
          }
          on_error => "target_res_subtype_err"
        }
      }
      if [res_uid] not in ["", "null"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.product_object_id" =>
              "%{res_uid}"
            "has_resource" => "true"
          }
          on_error => "target_res_product_object_id_err"
        }
      }
      if [res_ns] not in ["", "null"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.namespace" => "%{res_ns}"
          }
          on_error => "target_res_namespace_err"
        }
      }
    } else {
      if [res_name] not in ["", "null"] {
        mutate {
          replace => {
            "res_anc.name" => "%{res_name}"
          }
          on_error => "res_anc_name_err"
        }
      }
      if [res_type] not in ["", "null"] {
        mutate {
          replace => {
            "res_anc.resource_subtype" => "%{res_type}"
          }
          on_error => "res_anc_subtype_err"
        }
      }
      if [res_uid] not in ["", "null"] {
        mutate {
          replace => {
            "res_anc.product_object_id" => "%{res_uid}"
          }
          on_error => "res_anc_uid_err"
        }
      }
      if [res_anc] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource_ancestors" => "res_anc"
          }
          on_error => "res_anc_merge_err"
        }
      }
      if [res_ns] not in ["", "null"] {
        mutate {
          replace => {
            "res_ns_label.key" => "resources_%{res_idx}_namespace"
            "res_ns_label.value.string_value" => "%{res_ns}"
          }
          on_error => "res_ns_label_set_err"
        }
        if ![res_ns_label_set_err] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "res_ns_label"
            }
            on_error => "res_ns_label_merge_err"
          }
        }
      }
    }

    if [res_ver] not in ["", "null"] {
      mutate {
        replace => {
          "res_ver_label.key" => "resources_%{res_idx}_version"
          "res_ver_label.value.string_value" => "%{res_ver}"
        }
        on_error => "res_ver_label_set_err"
      }
      if ![res_ver_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "res_ver_label"
          }
          on_error => "res_ver_label_merge_err"
        }
      }
    }
  }

  mutate {
    replace => {
      "auth_decision" =>
        "%{Unmapped.annotations.authorization.k8s.io/decision}"
    }
    on_error => "no_auth_decision"
  }

  mutate {
    replace => {
      "auth_reason" => "%{Unmapped.annotations.authorization.k8s.io/reason}"
    }
    on_error => "no_auth_reason"
  }

  mutate {
    replace => {
      "eks_cluster_name" => "%{Unmapped.eks_cluster_name}"
    }
    on_error => "no_eks_cluster_name"
  }
  if [eks_cluster_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_deployment_id" =>
          "%{eks_cluster_name}"
      }
      on_error => "product_deployment_id_err"
    }
  }

  mutate {
    replace => {
      "unmapped_source_ips" => "%{Unmapped.sourceIPs[]}"
    }
    on_error => "no_unmapped_source_ips"
  }
  if [unmapped_source_ips] != "" {
    grok {
      match => {
        "unmapped_source_ips" => ["^%{IP:unmapped_src_ip_valid}$"]
      }
      overwrite => ["unmapped_src_ip_valid"]
      on_error => "invalid_unmapped_src_ip"
    }
    if ![invalid_unmapped_src_ip] and [unmapped_src_ip_valid] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "unmapped_src_ip_valid"
          "event.idm.read_only_udm.principal.asset.ip" =>
            "unmapped_src_ip_valid"
        }
        on_error => "unmapped_src_ip_merge_error"
      }
      if ![unmapped_src_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "impersonated_user" => "%{Unmapped.impersonatedUser.username}"
    }
    on_error => "no_impersonated_user"
  }
  if [impersonated_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{impersonated_user}"
        "has_user" => "true"
      }
      on_error => "target_userid_err"
    }
  }

  mutate {
    replace => {
      "node_name" =>
        "%{Unmapped.user.extra.authentication.kubernetes.io/node-name[]}"
    }
    on_error => "no_node_name"
  }
  if [node_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{node_name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{node_name}"
        "has_principal" => "true"
      }
      on_error => "principal_hostname_err"
    }
  }

  for index, obs in Observables.Array {
    mutate {
      replace => {
        "obs_name" => ""
        "obs_value" => ""
        "obs_type" => ""
        "obs_type_id" => ""
        "obs_idx" => ""
        "obs_name_label" => ""
        "obs_type_label" => ""
      }
    }
    mutate {
      copy => {
        "obs_idx" => "index"
      }
      on_error => "no_obs_idx"
    }
    mutate {
      convert => {
        "obs_idx" => "string"
      }
      on_error => "obs_idx_not_converted"
    }
    mutate {
      convert => {
        "obs.Type_id" => "string"
      }
      on_error => "obs_type_id_not_converted"
    }
    mutate {
      replace => {
        "obs_name" => "%{obs.Name}"
      }
      on_error => "no_obs_name"
    }
    mutate {
      gsub => ["obs_name", "[./\\[\\] ]+", "_"]
    }
    mutate {
      gsub => ["obs_name", "_+$", ""]
    }
    mutate {
      replace => {
        "obs_value" => "%{obs.Value}"
      }
      on_error => "no_obs_value"
    }
    if [obs_name] != "" and [obs_value] != "" {
      mutate {
        replace => {
          "obs_name_label.key" => "%{obs_name}_%{obs_idx}"
          "obs_name_label.value.string_value" => "%{obs_value}"
        }
        on_error => "obs_name_label_set_err"
      }
      if ![obs_name_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "obs_name_label"
          }
          on_error => "obs_name_label_merge_err"
        }
      }
    }
    mutate {
      replace => {
        "obs_type" => "%{obs.Type}"
      }
      on_error => "no_obs_type"
    }
    mutate {
      gsub => ["obs_type", "[./\\[\\] ]+", "_"]
    }
    mutate {
      gsub => ["obs_type", "_+$", ""]
    }
    mutate {
      replace => {
        "obs_type_id" => "%{obs.Type_id}"
      }
      on_error => "no_obs_type_id"
    }
    if [obs_type] != "" and [obs_type_id] != "" {
      mutate {
        replace => {
          "obs_type_label.key" => "%{obs_type}_%{obs_idx}"
          "obs_type_label.value.string_value" => "%{obs_type_id}"
        }
        on_error => "obs_type_label_set_err"
      }
      if ![obs_type_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "obs_type_label"
          }
          on_error => "obs_type_label_merge_err"
        }
      }
    }
  }

  if [Severity_id] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{Severity_id}"
      }
      on_error => "severity_details_err"
    }
  }

  if [Severity] == "Informational" or [Severity_id] == "1" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  } else if [Severity] == "Low" or [Severity_id] == "2" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  } else if [Severity] == "Medium" or [Severity_id] == "3" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  } else if [Severity] == "High" or [Severity_id] == "4" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  } else if [Severity] in ["Critical", "Fatal"] or [Severity_id] == "5" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }

  if [auth_decision] == "allow" {
    mutate {
      replace => {
        "sr_action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
      on_error => "allow_action_merge_err"
    }
  } else if [auth_decision] == "forbid" {
    mutate {
      replace => {
        "sr_action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
      on_error => "block_action_merge_err"
    }
  }

  mutate {
    replace => {
      "api_response_message" => "%{Api.Response.Message}"
    }
    on_error => "no_api_response_message"
  }
  if [auth_reason] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{auth_reason}"
      }
      on_error => "auth_reason_description_err"
    }
    if [api_response_message] not in ["", "null"] {
      mutate {
        replace => {
          "api_response_message_label.key" => "api_response_message"
          "api_response_message_label.value.string_value" =>
            "%{api_response_message}"
        }
        on_error => "api_response_message_label_set_err"
      }
      if ![api_response_message_label_set_err] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" =>
              "api_response_message_label"
          }
          on_error => "api_response_message_label_merge_err"
        }
      }
    }
  } else if [api_response_message] not in ["", "null"] {
    mutate {
      replace => {
        "security_result.description" => "%{api_response_message}"
      }
      on_error => "api_response_description_err"
    }
  }

  mutate {
    replace => {
      "api_response_error" => "%{Api.Response.Error}"
    }
    on_error => "no_api_response_error"
  }
  if [api_response_error] not in ["", "null"] {
    mutate {
      replace => {
        "security_result.summary" => "%{api_response_error}"
      }
      on_error => "security_summary_err"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_error"
    }
  }

  if [has_user] == "true" and [has_resource] == "true" {
    if [Activity_id] == "1" {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_CREATION"
        }
      }
    } else if [Activity_id] == "2" {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    } else if [Activity_id] == "3" {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_UPDATE_CONTENT"
        }
      }
    } else if [Activity_id] == "4" or [api_operation] == "deletecollection" {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_DELETION"
        }
      }
    } else {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
  } else if [has_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  mutate {
    rename => {
      "Start_time_dt" => "addition.start_time_dt"
      "Metadata.Product.Feature.Name" =>
        "addition.metadata_product_feature_name"
      "Metadata.Log_level" => "addition.metadata_log_level"
      "Metadata.Version" => "addition.metadata_version"
      "Api.Version" => "addition.api_version"
      "Api.Group.Name" => "addition.api_group"
      "Api.Response.Error_message" => "addition.api_response_error_message"
      "Actor.User.Type_id" => "addition.actor_user_type_id"
      "Actor.Session.Credential_uid" => "addition.credential_uid"
      "Actor.Session.Uid" => "addition.session_uid"
      "Cloud.Account.Uid" => "addition.cloud_account_uid"
      "Asl_version" => "addition.asl_version"
      "Class_uid" => "addition.class_uid"
      "Class_name" => "addition.class_name"
      "Category_uid" => "addition.category_uid"
      "Category_name" => "addition.category_name"
      "Activity_id" => "addition.activity_id"
      "Activity_name" => "addition.activity_name"
      "Type_uid" => "addition.type_uid"
      "Type_name" => "addition.type_name"
      "Unmapped.kind" => "addition.kind"
      "Unmapped.requestObject.status.conditions[].lastHeartbeatTime" =>
        "addition.request_object_status_conditions_last_heartbeat_time"
      "Unmapped.requestObject.status.conditions[].lastTransitionTime" =>
        "addition.request_object_status_conditions_last_transition_time"
      "Unmapped.requestObject.status.conditions[].message" =>
        "addition.request_object_status_conditions_message"
      "Unmapped.requestObject.status.conditions[].reason" =>
        "addition.request_object_status_conditions_reason"
      "Unmapped.requestObject.status.conditions[].status" =>
        "addition.request_object_status_conditions_status"
      "Unmapped.requestObject.status.conditions[].type" =>
        "addition.request_object_status_conditions_type"
      "Unmapped.requestObject.status.conditions[].observedGeneration" =>
        "addition.request_object_status_conditions_observed_generation"
      "Unmapped.user.extra.principalId[]" => "addition.user_extra_principal_id"
      "Unmapped.user.extra.sigs.k8s.io/aws-iam-authenticator/principalId[]" =>
        "addition.user_extra_aws_iam_authenticator_principal_id"
      "Unmapped.user.extra.authentication.kubernetes.io/node-uid[]" =>
        "addition.node_uid"
      "Unmapped.user.extra.authentication.kubernetes.io/pod-name[]" =>
        "addition.pod_name"
      "Unmapped.user.extra.authentication.kubernetes.io/pod-uid[]" =>
        "addition.pod_uid"
      "Unmapped.user.extra.authentication.kubernetes.io/credential-id[]" =>
        "addition.k8s_credential_id"
      "Unmapped.requestObject.apiVersion" =>
        "addition.request_object_api_version"
      "Unmapped.requestObject.kind" => "addition.request_object_kind"
      "Unmapped.requestObject.count" => "addition.request_object_count"
      "Unmapped.requestObject.lastTimestamp" =>
        "addition.request_object_last_timestamp"
      "Unmapped.requestObject.message" => "addition.request_object_message"
      "Unmapped.requestObject.metadata.name" =>
        "addition.request_object_metadata_name"
      "Unmapped.requestObject.metadata.namespace" =>
        "addition.request_object_metadata_namespace"
      "Unmapped.requestObject.metadata.creationTimestamp" =>
        "addition.request_object_metadata_creation_timestamp"
      "Unmapped.requestObject.metadata.resourceVersion" =>
        "addition.request_object_metadata_resource_version"
      "Unmapped.requestObject.metadata.uid" =>
        "addition.request_object_metadata_uid"
      "Unmapped.requestObject.spec.maxReplicas" =>
        "addition.request_object_spec_max_replicas"
      "Unmapped.requestObject.spec.minReplicas" =>
        "addition.request_object_spec_min_replicas"
      "Unmapped.requestObject.spec.scaleTargetRef.apiVersion" =>
        "addition.request_object_spec_scale_target_ref_api_version"
      "Unmapped.requestObject.spec.scaleTargetRef.kind" =>
        "addition.request_object_spec_scale_target_ref_kind"
      "Unmapped.requestObject.spec.scaleTargetRef.name" =>
        "addition.request_object_spec_scale_target_ref_name"
      "Unmapped.requestObject.status.currentReplicas" =>
        "addition.request_object_status_current_replicas"
      "Unmapped.requestObject.status.desiredReplicas" =>
        "addition.request_object_status_desired_replicas"
      "Unmapped.requestObject.target.kind" =>
        "addition.request_object_target_kind"
      "Unmapped.requestObject.target.name" =>
        "addition.request_object_target_name"
      "Unmapped.responseObject.apiVersion" =>
        "addition.response_object_api_version"
      "Unmapped.responseObject.kind" => "addition.response_object_kind"
      "Unmapped.responseObject.code" => "addition.response_object_code"
      "Unmapped.responseObject.status" => "addition.response_object_status"
      "Unmapped.responseObject.count" => "addition.response_object_count"
      "Unmapped.responseObject.firstTimestamp" =>
        "addition.response_object_first_timestamp"
      "Unmapped.responseObject.lastTimestamp" =>
        "addition.response_object_last_timestamp"
      "Unmapped.responseObject.message" => "addition.response_object_message"
      "Unmapped.responseObject.reason" => "addition.response_object_reason"
      "Unmapped.responseObject.type" => "addition.response_object_type"
      "Unmapped.responseObject.reportingComponent" =>
        "addition.response_object_reporting_component"
      "Unmapped.responseObject.reportingInstance" =>
        "addition.response_object_reporting_instance"
      "Unmapped.responseObject.source.component" =>
        "addition.response_object_source_component"
      "Unmapped.responseObject.source.host" =>
        "addition.response_object_source_host"
      "Unmapped.responseObject.involvedObject.apiVersion" =>
        "addition.response_object_involved_object_api_version"
      "Unmapped.responseObject.involvedObject.fieldPath" =>
        "addition.response_object_involved_object_field_path"
      "Unmapped.responseObject.involvedObject.kind" =>
        "addition.response_object_involved_object_kind"
      "Unmapped.responseObject.involvedObject.name" =>
        "addition.response_object_involved_object_name"
      "Unmapped.responseObject.involvedObject.namespace" =>
        "addition.response_object_involved_object_namespace"
      "Unmapped.responseObject.involvedObject.resourceVersion" =>
        "addition.response_object_involved_object_resource_version"
      "Unmapped.responseObject.involvedObject.uid" =>
        "addition.response_object_involved_object_uid"
      "Unmapped.responseObject.metadata.name" =>
        "addition.response_object_metadata_name"
      "Unmapped.responseObject.metadata.namespace" =>
        "addition.response_object_metadata_namespace"
      "Unmapped.responseObject.metadata.creationTimestamp" =>
        "addition.response_object_metadata_creation_timestamp"
      "Unmapped.responseObject.metadata.resourceVersion" =>
        "addition.response_object_metadata_resource_version"
      "Unmapped.responseObject.metadata.uid" =>
        "addition.response_object_metadata_uid"
      "Unmapped.responseObject.spec.nodeName" =>
        "addition.response_object_spec_node_name"
      "Unmapped.responseObject.spec.serviceAccountName" =>
        "addition.response_object_spec_service_account_name"
    }
    on_error => "addition_rename_err"
  }

  for key1, value1 in addition map {
    mutate {
      replace => {
        "addition_field" => ""
        "addition_check" => ""
      }
    }
    mutate {
      convert => {
        "value1" => "string"
      }
      on_error => "addition_value1_string_err"
    }
    mutate {
      replace => {
        "addition_check" => "%{value1}"
      }
      on_error => "addition_check_empty_err"
    }
    if ![addition_check_empty_err] and [addition_check] != "" {
      if [addition_check] not in ["null", "<nil>"] {
        mutate {
          replace => {
            "addition_field.key" => "%{key1}"
            "addition_field.value.string_value" => "%{value1}"
          }
          on_error => "addition_field_set_err"
        }
        if ![addition_field_set_err] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "addition_field"
            }
            on_error => "addition_field_merge_err"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
    }
    on_error => "event_type_err"
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
