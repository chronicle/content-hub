# Product: Twilio Audit
# Category: Telephone software
# Supported Format: JSON
# Reference: https://www.twilio.com/docs/usage/monitor-events
# Last Updated: 2026-10-05
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "sid" => ""
      "event_date" => ""
      "event_type" => ""
      "account_sid" => ""
      "actor_sid" => ""
      "actor_type" => ""
      "description" => ""
      "resource_sid" => ""
      "resource_type" => ""
      "source" => ""
      "source_ip_address" => ""
      "url" => ""
      "security_result" => ""
      "links.actor" => ""
      "links.resource" => ""
      "event_data" => ""
      "has_principal" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }
  if [sid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{sid}"
      }
      on_error => "sid_failed"
    }
  }
  if [event_date] != "" {
    date {
      match => ["event_date", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "event_date_failed"
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
      }
      on_error => "event_type_failed"
    }
  }
  if [actor_sid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{actor_sid}"
      }
      on_error => "actor_sid_failed"
    }
  }
  if [resource_sid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" =>
          "%{resource_sid}"
      }
      on_error => "resource_sid_failed"
    }
  }
  if [resource_type] != "" {
    mutate {
      uppercase => ["resource_type"]
    }
    if [resource_type] in [
      "MUTEX", "TASK", "PIPE", "DEVICE", "FIREWALL_RULE",
      "MAILBOX_FOLDER", "VPC_NETWORK", "VIRTUAL_MACHINE",
      "STORAGE_BUCKET", "STORAGE_OBJECT", "DATABASE", "TABLE",
      "CLOUD_PROJECT", "CLOUD_ORGANIZATION", "SERVICE_ACCOUNT",
      "ACCESS_POLICY", "CLUSTER", "SETTING", "DATASET"
    ] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.resource_type" =>
            "%{resource_type}"
        }
        on_error => "resource_type_udm_failed"
      }
    }
    else {
      mutate {
        replace => {
          "resource_type_label.key" => "resource_type"
          "resource_type_label.value" => "%{resource_type}"
        }
        on_error => "resource_type_label_failed"
      }
      if ![resource_type_label_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" =>
              "resource_type_label"
          }
          on_error => "resource_type_merge_failed"
        }
      }
    }
  }
  grok {
    match => {
      "source_ip_address" => "%{IP:source_ip_address}"
    }
    overwrite => ["source_ip_address"]
    on_error => "source_ip_address_grok_failed"
  }
  if ![source_ip_address_grok_failed] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "source_ip_address"
        "event.idm.read_only_udm.principal.asset.ip" => "source_ip_address"
      }
      on_error => "source_ip_address_merge_failed"
    }
    if ![source_ip_address_merge_failed] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      on_error => "has_principal_failed"
      }
    }
  }
  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.url_back_to_product" => "%{url}"
      }
      on_error => "url_failed"
    }
  }
  mutate {
    replace => {
      "links_actor" => "%{links.actor}"
    }
    on_error => "links_actor_failed"
  }
  if [links_actor] not in ["", "null"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.url" => "%{links_actor}"
      }
      on_error => "principal_url_failed"
    }
  }
  mutate {
    replace => {
      "links_resource" => "%{links.resource}"
    }
    on_error => "links_resource_failed"
  }
  if [links_resource] not in ["", "null"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{links_resource}"
      }
      on_error => "target_url_failed"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{description}"
      }
      on_error => "description_failed"
    }
  }
  mutate {
    rename => {
      "account_sid" => "addition.account_sid"
      "actor_type" => "addition.actor_type"
      "source" => "addition.source"
      "event_data.resource_properties.roles.updated" => "addition.roles_updated"
      "event_data.resource_properties.roles.previous" => "addition.roles_previous"
      "event_data.resource_properties.permissions.updated" => "addition.permissions_updated"
      "event_data.resource_properties.permissions.previous" => "addition.permissions_previous"
      "event_data.resource_properties.fraud_guard_mode.updated" => "addition.fraud_guard_mode_updated"
      "event_data.resource_properties.fraud_guard_mode.previous" => "addition.fraud_guard_mode_previous"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
      on_error => "field_failed"
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [_check] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "key_failed"
      }
      if [key] in [ "roles_updated", "fraud_guard_mode_previous", "fraud_guard_mode_updated", "permissions_previous", "permissions_updated", "roles_previous"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "security_result_value_failed"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "_field"
          }
          on_error => "detection_fields_merge_failed"
        }
      } else if [key] == "source" {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "source_value_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "_field"
          }
          on_error => "principal_application_merge_failed"
        }
      } else if [key] == "actor_type" {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "actor_type_value_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.attribute.labels" => "_field"
          }
          on_error => "principal_labels_merge_failed"
        }
      } else if [key] == "account_sid" {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "account_sid_value_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "_field"
          }
          on_error => "target_labels_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "additional_value_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "additional_fields_merge_failed"
        }
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }
  if [actor_sid] != "" and [resource_sid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  } else if [actor_sid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Twilio"
      "event.idm.read_only_udm.metadata.product_name" => "Twilio Audit"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
