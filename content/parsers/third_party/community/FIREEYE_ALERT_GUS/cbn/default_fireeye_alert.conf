# Product: FireEye Alerts
# Category: Alerts
# Supported Format: SYSLOG + JSON, JSON, KV, SYSLOG
# Reference: N/A
# Last Updated: 2025-08-12
# Copyright 2025 Google SecOps
filter {
  #CONSTANT ASSIGNMENTS - BEGIN
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "FIREEYE_ALERT"
      "event.idm.read_only_udm.metadata.product_name" => "FIREEYE_ALERT"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "datetime" => ""
      "syslog_header" => ""
      "host_name" => ""
      "host_ip" => ""
      "principal_host" => ""
      "process" => ""
      "description" => ""
      "process_id" => ""
      "type" => ""
      "cmd" => ""
      "category_details" => ""
      "severity" => ""
      "alert.src.ip" => ""
      "alert.src.mac" => ""
      "alert.src.vlan" => ""
      "alert.src.port" => ""
      "alert.src.host" => ""
      "alert.src.domain" => ""
      "alert.dst.ip" => ""
      "alert.dst.mac" => ""
      "alert.dst.port" => ""
      "alert.dst.host" => ""
      "alert.src.smtp-mail-from" => ""
      "alert.src.url" => ""
      "alert.dst.smtp-to" => ""
      "alert.smtp-message.id" => ""
      "alert.smtp-message.last-malware" => ""
      "alert.smtp-message.queue-id" => ""
      "alert.smtp-message.smtp-header" => ""
      "alert.smtp-message.subject" => ""
      "product" => ""
      "version" => ""
      "alert.name" => ""
      "alert.id" => ""
      "alert.alert-url" => ""
      "alert.severity" => ""
      "alert.ati-data" => ""
      "alert.uuid" => ""
      "alert.version" => ""
      "alert.explanation.os-changes.os.name" => ""
      "alert.explanation.os-changes.os.build" => ""
      "alert.explanation.os-changes.file.processinfo.tid" => ""
      "alert.explanation.os-changes.file.processinfo.pid" => ""
      "alert.explanation.os-changes.file.processinfo.ppid" => ""
      "alert.explanation.os-changes.file.processinfo.imagepath" => ""
      "alert.explanation.os-changes.file.processinfo.md5sum" => ""
      "alert.explanation.os-changes.file.processinfo.sha1sum" => ""
      "alert.explanation.os-changes.osinfo" => ""
      "alert.explanation.cnc-services.cnc-service.port" => ""
      "alert.explanation.cnc-services.cnc-service.protocol" => ""
      "alert.explanation.cnc-services.cnc-service.type" => ""
      "alert.explanation.cnc-services.cnc-service.sid" => ""
      "alert.explanation.cnc-services.cnc-service.sname" => ""
      "alert.explanation.cnc-services.cnc-service.address" => ""
      "alert.explanation.cnc-services.cnc-service.channel" => ""
      "alert.explanation.cnc-services.cnc-service.location" => ""
      "alert.explanation.cnc-services.cnc-service.url" => ""
      "alert.explanation.cnc-services.cnc-service.host" => ""
      "threat_attribution" => ""
      "threat_name" => ""
      "risk_summary" => ""
      "alert.explanation.protocol" => ""
      "alert.explanation.analysis" => ""
      "alert.sc-version" => ""
      "alert.retroactive" => ""
      "alert.ack" => ""
      "alert.occurred" => ""
      "alert.action" => ""
      "appliance" => ""
      "appliance-id" => ""
      "country" => ""
      "appliance._id" => ""
      "event_type" => ""
      "url" => ""
      "resolution" => ""
      "agent_info.hostname" => ""
      "agent_info.md5values" => ""
      "agent_info.primary_mac" => ""
      "agent_info.primary_ip_address" => ""
      "event_values.fileWriteEvent/md5" => ""
      "event_values.fileWriteEvent/fullPath" => ""
      "event_values.fileWriteEvent/size" => ""
      "event_values.fileWriteEvent/parentProcessPath" => ""
      "event_values.fileWriteEvent/parentPid" => ""
      "event_values.fileWriteEvent/pid" => ""
      "event_values.fileWriteEvent/processPath" => ""
      "indicator.name" => ""
      "indicator.category" => ""
      "agent_info.os.kernel_version" => ""
      "agent_info.os.product_name" => ""
      "agent_info.os.platform" => ""
      "event_values.scanned-object.scanned-object-type" => ""
      "event_values.scanned-object.registry.value" => ""
      "event_values.scanned-object.registry.key" => ""
      "event_values.detections.detection.infected-object.file-object.file-path" => ""
      "event_values.detections.detection.infected-object.file-object.sha256sum" => ""
      "event_values.detections.detection.infected-object.file-object.sha1sum" => ""
      "event_values.detections.detection.infected-object.file-object.md5sum" => ""
      "event_values.detections.detection.infection.confidence-level" => ""
      "event_values.detections.detection.infection.infection-type" => ""
      "event_values.detections.detection.infection.infection-name" => ""
      "event_values.processEvent/parentProcessPath" => ""
      "event_values.processEvent/processCmdLine" => ""
      "event_values.processEvent/pid" => ""
      "event_values.processEvent/processPath" => ""
      "event_values.processEvent/parentPid" => ""
      "event_values.processEvent/username" => ""
      "source" => ""
      "event_values.urlMonitorEvent/username" => ""
      "event_values.urlMonitorEvent/hostname" => ""
      "event_values.urlMonitorEvent/remoteIpAddress" => ""
      "event_values.urlMonitorEvent/remotePort" => ""
      "event_values.urlMonitorEvent/processPath" => ""
      "event_values.urlMonitorEvent/urlMethod" => ""
      "event_values.urlMonitorEvent/httpHeader" => ""
      "event_values.urlMonitorEvent/pid" => ""
      "event_values.urlMonitorEvent/userAgent" => ""
      "event_values.urlMonitorEvent/requestUrl" => ""
      "event_values.description" => ""
      "event_values.object_status" => ""
      "event_values.action_nature" => ""
      "event_values.name" => ""
      "event_values.attributes.source_path" => ""
      "event_values.attributes.anomaly_type" => ""
      "event_values.scanned-object.file-event.actor-process.pid" => ""
      "event_values.scanned-object.file-event.actor-process.path" => ""
      "event_values.scanned-object.file-event.actor-process.user.username" => ""
      "event_values.scanned-object.file-event.actor-process.user.domain" => ""
      "event_values.scanned-object.file-event.sub-type" => ""
      "event_values.scanned-object.file-event.file-path" => ""
      "event_values.scan-type" => ""
      "alert.explanation.ips-detected.match-count" => ""
      "alert.explanation.malware-detected.malware" => ""
      "User-Agent" => ""
      "Host" => ""
      "Referer" => ""
      "httpmethod" => ""
      "principal_hostname" => ""
      "target_hostname" => ""
      "tar_ip" => ""
      "ver_proto" => ""
      "method" => ""
      "tempdata" => ""
      "temp_url" => ""
      "http_user_agent" => ""
      "src_data" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "sec_result" => ""
      "tests_not_array" => "false"
      "has_email_info" => "false"
      "msg" => ""
      "tar_email" => ""
      "dst_ip" => ""
      "dst_port" => ""
      "kvdata" => ""
      "qid" => ""
      "sub_id" => ""
      "job_id" => ""
      "bytes_available" => ""
      "written_size" => ""
      "tid" => ""
      "dst_hostname" => ""
      "command_path" => ""
      "filepath" => ""
      "json_msg" => ""
      "path" => ""
      "begin" => ""
      "end" => ""
      "success" => ""
      "cost" => ""
      "filesize" => ""
      "desc" => ""
      "src_port" => ""
    }
  }
  #CONSTANT ASSIGNMENTS - END
  if [message] =~ "CEF:" {
    mutate {
      gsub => ["message", 'event', 'event1']
    }
  }
  #Strip syslog header
  if message != "" {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json_data"
    }
  }
  if [not_json_data] or [message] =~ "CEF:" {
    mutate {
      gsub => ["message", "\\r\\n", ""]
    }
    grok {
      match => {
        "message" => [
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}\\[%{INT:process_id}\\]: tid %{INT:tid}:( \\[%{DATA}\\])? \\[%{DATA}.%{WORD:severity}\\]: (%{DATA})?\\\[%{DATA:kvdata}\\]: %{GREEDYDATA:description}",
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}\\[%{INT:process_id}\\]: tid %{INT:tid}:( \\[%{DATA}\\])? \\[%{DATA}.%{WORD:severity}\\]: %{GREEDYDATA:description}"
            "'Message':'%{TIMESTAMP_ISO8601:datetime} %{HOSTNAME:host_name} --  MARK --','tagCountry':'%{WORD:country}'"
            "'Message':'%{TIMESTAMP_ISO8601:datetime} %{HOSTNAME:host_ip}\\s+%{INT}\\s+<%{INT}>%{INT}\\s+%{TIMESTAMP_ISO8601}\\s+%{HOSTNAME:host_name}\\s+%{GREEDYDATA} -- MARK --','tagCountry':'%{WORD:country}'"
            "(?P<syslog_header>.*?) (?P<msg1>{.*}) ','tagCountry':'%{WORD:country}'"
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}(?:\\s|)\\[%{INT:process_id}\\]:(?:\\s)\\[.*?(.)?%{WORD:severity}\\](:)?(?:\\s)%{GREEDYDATA:description}",
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}\\[%{INT:process_id}\\]: %{GREEDYDATA:description} cmd: %{GREEDYDATA:command_path} %{DATA}:%{GREEDYDATA:filepath} Context: %{GREEDYDATA:json_msg}"
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}\\[%{INT:process_id}\\]: \\[%{DATA}.%{DATA:severity}\\]-%{DATA}:%{DATA}\{%{DATA}:%{DATA:path}, %{DATA}:%{DATA:begin}, %{DATA}:%{DATA:end}, %{DATA}:%{DATA:success}, %{DATA}:%{DATA:cost}, (?P<desc>.*File size:      %{INT:filesize}.*)",
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}\\[%{INT:process_id}\\]: %{GREEDYDATA:description}",
            "(?P<syslog_header>.*?)(?P<msg1>{.*})"
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}: (?P<desc>.*parse_host_port_sockaddr%{GREEDYDATA}.%{POSINT:src_port}.*)",
            "%{SYSLOGTIMESTAMP:datetime} %{HOSTNAME:principal_host} %{DATA:process}:(?P<desc>.*dipcConnect: dipcConnect\\(\\) Logging enabled.*)"
        ]
      }
      overwrite => ["syslog_header","country","datetime","host_name","country","msg1","principal_host","process","process_id","severity","description","kvdata","tid", "command_path", "filepath", "json_msg", "path", "begin", "end", "success", "cost", "filesize", "desc", "src_port"]
      on_error => "pattern_not_matched"
    }

    #Extract JSON message
    json {
      source => "msg1"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] and [pattern_not_matched] {
      mutate {
        replace => {
          "src" => ""
          "spt" => ""
          "smac" => ""
          "dst" => ""
          "dpt" => ""
          "dmac" => ""
          "dvchost" => ""
          "dvc" => ""
          "cn1Label" => ""
          "cn1" => ""
          "cs1Label" => ""
          "cs1" => ""
          "cs4Label" => ""
          "cs4" => ""
          "rt" => ""
          "fileHash" => ""
          "suser" => ""
          "duser" => ""
          "msg" => ""
          "externalId" => ""
          "act" => ""
          "devicePayloadId" => ""
          "fileType" => ""
          "fsize" => ""
          "fname" => ""
          "flexString1Label" => ""
          "flexString1" => ""
          "flexString2Label" => ""
          "flexString2" => ""
          "start" => ""
          "sourceDnsDomain" => ""
          "dvcmac" => ""
          "action" => ""
          "end" => ""
          "request" => ""
          "cs3Label" => ""
          "cs3" => ""
          "applicationProtocol" => ""
          "has_principal" => "false"
          "has_target" => "false"
          "has_target_file" => "false"
          "event_type1" => ""
          "has_principal_ip" => "false"
        }
      }
      mutate {
        gsub => ["message", "([A-Za-z0-9]+)=", "#$1="]
      }
      kv {
        source => "message"
        field_split => "#"
        value_split => "="
        on_error => "not_kv"
      }
      if [not_kv] {
        drop {
          tag => "TAG_UNSUPPORTED"
        }
      }
      if [src] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.asset.ip" => "src"
            "event.idm.read_only_udm.principal.ip" => "src"
          }
          on_error => "invalid_src_ip"
        }
        mutate {
          replace => {
            "has_principal_ip" => "true"
          }
        }
      }
      if [spt] != "" {
        mutate {
          convert => {
            "spt" => "string"
          }
          on_error => "spt_already_in_string"
        }
        mutate {
          replace => {
            "spt_label.key" => "spt"
            "spt_label.value" => "%{spt}"
          }
          on_error => "spt_not_present"
        }
        if ![spt_not_present] {
          mutate {
            merge => {
              "security_result.detection_fields" => "spt_label"
            }
            on_error => "spt_label_not_present"
          }
        }
      }
      if [smac] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.mac" => "smac"
          }
          on_error => "invalid_smac"
        }
      }
      if [dst] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.asset.ip" => "dst"
            "event.idm.read_only_udm.target.ip" => "dst"
          }
          on_error => "invalid_dst_ip"
        }
        if ![invalid_dst_ip] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
      if [dpt] != "" {
        mutate {
          convert => {
            "dpt" => "string"
          }
          on_error => "dpt_already_in_string"
        }
        mutate {
          replace => {
            "dpt_label.key" => "dpt"
            "dpt_label.value" => "%{dpt}"
          }
          on_error => "dpt_not_present"
        }
        if ![dpt_not_present] {
          mutate {
            merge => {
              "security_result.detection_fields" => "dpt_label"
            }
            on_error => "dpt_label_not_present"
          }
        }
      }
      if [dmac] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.mac" => "dmac"
          }
          on_error => "invalid_dmac"
        }
      }
      if [dvchost] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.hostname" => "%{dvchost}"
            "event.idm.read_only_udm.target.hostname" => "%{dvchost}"
            "has_target" => "true"
          }
          on_error => "invalid_dvchost"
        }
      }
      if [dvc] != "" {
        grok {
          match => {
            "dvc" => ["%{IP:dvc_ip}"]
          }
          on_error => "invalid_dvc_ip"
        }
        if ![invalid_dvc_ip] {
          mutate {
            merge => {
              "intermediary.asset.ip" => "dvc"
              "intermediary.ip" => "dvc"
            }
            on_error => "invalid_dvc"
          }
        }
        else {
          mutate {
            replace => {
              "intermediary.hostname" => "%{dvc}"
              "intermediary.asset.hostname" => "%{dvc}"
            }
            on_error => "invalid_dvc"
          }
        }
      }
      if [cn1Label] != "" and [cn1] != "" {
        mutate {
          convert => {
            "cn1" => "string"
          }
          on_error => "cn1_already_in_string"
        }
        mutate {
          replace => {
            "cn1_label.key" => "%{cn1Label}"
            "cn1_label.value" => "%{cn1}"
          }
          on_error => "cn1_not_present"
        }
        if ![cn1_not_present] {
          mutate {
            merge => {
              "security_result.detection_fields" => "cn1_label"
            }
            on_error => "cn1_label_not_present"
          }
        }
      }
      if [cs1Label] != "" and [cs1] != "" {
        mutate {
          convert => {
            "cs1" => "string"
          }
          on_error => "cs1_already_in_string"
        }
        mutate {
          replace => {
            "cs1_label.key" => "%{cs1Label}"
            "cs1_label.value" => "%{cs1}"
          }
          on_error => "cs1_not_present"
        }
        if ![cs1_not_present] {
          mutate {
            merge => {
              "security_result.detection_fields" => "cs1_label"
            }
            on_error => "cs1_label_not_present"
          }
        }
      }
      if [cs4Label] != "" and [cs4] != "" {
        mutate {
          replace => {
            "cs4_label.key" => "%{cs4Label}"
            "cs4_label.value" => "%{cs4}"
          }
          on_error => "cs4_not_present"
        }
        if ![cs4_not_present] {
          mutate {
            merge => {
              "security_result.detection_fields" => "cs4_label"
            }
            on_error => "cs4_label_not_present"
          }
        }
      }
      if [rt] != "" {
        date {
          match => ["rt", "MMM dd yyyy HH:mm:ss ZZZ"]
          on_error => "rt_not_present"
        }
      }
      if [dvcmac] != "" {
        mutate {
          merge => {
            "intermediary.mac" => "dvcmac"
          }
          on_error => "dvcmac_not_present"
        }
      }
      if [sourceDnsDomain] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.asset.hostname" =>
            "%{sourceDnsDomain}"
            "event.idm.read_only_udm.principal.hostname" =>
            "%{sourceDnsDomain}"
            "has_principal" => "true"
          }
          on_error => "sourceDnsDomain_not_present"
        }
      }
      if [start] != "" {
        date {
          match => ["start", "MMM dd yyyy HH:mm:ss ZZZ"]
          target => "event.idm.read_only_udm.metadata.event_timestamp"
          on_error => "start_not_present"
        }
      }
      if [end] != "" {
        date {
          match => ["end", "MMM dd yyyy HH:mm:ss ZZZ"]
          target => "event.idm.read_only_udm.metadata.ingested_timestamp"
          on_error => "end_not_present"
        }
      }
      if [fileHash] =~ "^[0-9a-f]+$" {
        mutate {
          convert => {
            "fileHash" => "string"
          }
          on_error => "fileHash_already_in_string"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.sha256" => "%{fileHash}"
            "has_target_file" => "true"
          }
          on_error => "fileHash_not_present"
        }
      }
      if [suser] != "" {
        mutate {
          gsub => ['suser',',','\",\"']
        }
        mutate {
          replace => {
            "suser" => "{\"suserList\":[\"%{suser}\"]}"
          }
          on_error => "suser_failed"
        }
        json {
          source => "suser"
          array_function => "split_columns"
          on_error => "suser_json_failed"
        }
        for email in suserList {
          if [email] =~ "^.+@.+$" {
            mutate {
              merge => {
                "event.idm.read_only_udm.principal.user.email_addresses" =>
                "email"
              }
              on_error => "suser_not_present"
            }
          }
        }
      }
      if [duser] != "" {
        mutate {
          gsub => ['duser',',','\",\"']
        }
        mutate {
          replace => {
            "duser" => "{\"duserList\":[\"%{duser}\"]}"
          }
          on_error => "duser_failed"
        }
        json {
          source => "duser"
          array_function => "split_columns"
          on_error => "duser_json_failed"
        }
        for email in duserList {
          if [email] =~ "^.+@.+$" {
            mutate {
              merge => {
                "event.idm.read_only_udm.target.user.email_addresses" =>
                "email"
              }
              on_error => "duserList_not_present"
            }
          }
        }
      }
      if [msg] != "" and [msg] =~ "^.+@.+$" {
        mutate {
          replace => {
            "intermediary.email" => "%{msg}"
          }
          on_error => "msg_not_present"
        }
      }
      if [externalId] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{externalId}"
          }
          on_error => "externalId_not_present"
        }
      }
      if [act] != "" {
        mutate {
          lowercase => ["act"]
        }
        if [act] == "allowed" {
          mutate {
            replace => {
              "action" => "ALLOW"
            }
            on_error => "action_not_present"
          }
        }
        else if [act] == "blocked" {
          mutate {
            replace => {
              "action" => "BLOCK"
            }
            on_error => "action_not_present"
          }
        }
        else {
          mutate {
            replace => {
              "security_result.description" => "%{act}"
            }
            on_error => "action_not_present"
          }
        }

        if [action] != "" {
          mutate {
            merge =>{
              "security_result.action" => "action"
            }
            on_error => "action_failed"
          }
        }
      }
      if [devicePayloadId] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.application" =>
            "%{devicePayloadId}"
          }
          on_error => "devicePayloadId_not_present"
        }
      }
      if [fileType] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.mime_type" => "%{fileType}"
            "has_target_file" => "true"
          }
          on_error => "fileType_not_present"
        }
      }
      if [fsize] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.size" => "%{fsize}"
          }
          on_error => "fsize_not_present"
        }
        mutate {
          convert => {
            "event.idm.read_only_udm.target.file.size" => "uinteger"
          }
          on_error => "fsize_already_in_string"
        }
      }
      if [fname] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{fname}"
            "has_target_file" => "true"
          }
          on_error => "fname_not_present"
        }
      }
      if [flexString1] != "" {
        mutate {
          replace => {
            "flex_string1_label.key" => "flexString1"
            "flex_string1_label.value" => "%{flexString1}"
          }
