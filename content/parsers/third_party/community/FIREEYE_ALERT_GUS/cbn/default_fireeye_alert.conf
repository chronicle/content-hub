          replace => {
            "tests_executed_at_field.key" => "executed-at"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_executed_at_field"
          }
          on_error => "tests_executed_at_field_fail"
        }
      }

      mutate {
        replace => {
          "tests_submitted_at_field.value" => "%{malname.submitted-at}"
        }
        on_error => "tests_submitted_at_field_empty"
      }
      if ![tests_submitted_at_field_empty] {
        mutate {
          replace => {
            "tests_submitted_at_field.key" => "submitted-at"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_submitted_at_field"
          }
          on_error => "tests_submitted_at_field_fail"
        }
      }

      mutate {
        replace => {
          "tests_sha512_field.value" => "%{malname.sha512}"
        }
        on_error => "tests_sha512_field_empty"
      }
      if ![tests_sha512_field_empty] {
        mutate {
          replace => {
            "tests_sha512_field.key" => "malware sha512"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_sha512_field"
          }
          on_error => "tests_sha512_field_fail"
        }
      }

      mutate {
        replace => {
          "tests_type_field.value" => "%{malname.type}"
        }
        on_error => "tests_type_field_empty"
      }
      if ![tests_type_field_empty] {
        mutate {
          replace => {
            "tests_type_field.key" => "type"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_type_field"
          }
          on_error => "tests_type_field_fail"
        }
      }

      mutate {
        replace => {
          "http_header_data" => "%{malname.http-header}"
        }
        on_error => "http_header_data_empty"
      }
      if [http_header_data] != "" {
        grok {
          match => {
            "http_header_data" => "%{WORD:httpmethod} %{GREEDYDATA:temp_url} (?P<ver_proto>HTTP/%{DATA:tempdata})\\r\\nHost: .*"
          }
          overwrite => ["httpmethod", "ver_proto", "temp_url", "tempdata"]
          on_error => "grok_failure"
        }
        mutate {
          gsub => ["http_header_data", "\\r\\n\\r\\n", "#"]
        }
        mutate {
          gsub => ["http_header_data", "\\r\\n", "#"]
        }
        kv {
          source => "http_header_data"
          field_split => "#"
          value_split => ":"
          on_error => "kv_fail"
        }
      }

      mutate {
        replace => {
          "tests_original_field.value" => "%{malname.original}"
        }
        on_error => "tests_original_field_empty"
      }
      if ![tests_original_field_empty] {
        mutate {
          replace => {
            "tests_original_field.key" => "malware original"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_original_field"
          }
          on_error => "tests_original_field_fail"
        }
      }

      mutate {
        replace => {
          "tests_stype_field.value" => "%{malname.stype}"
        }
        on_error => "tests_stype_field_empty"
      }
      if ![tests_stype_field_empty] {
        mutate {
          replace => {
            "tests_stype_field.key" => "malware stype"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_stype_field"
          }
          on_error => "tests_stype_field_fail"
        }
      }

      mutate {
        replace => {
          "tests_name_field.value" => "%{malname.name}"
        }
        on_error => "tests_name_field_empty"
      }
      if ![tests_name_field_empty] {
        mutate {
          replace => {
            "tests_name_field.key" => "malware name"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_name_field"
          }
          on_error => "tests_name_field_fail"
        }
      }

      mutate {
        replace => {
          "sec_result" => ""
        }
      }
      for key, value in malname map {
        if [key] == "name" {
          mutate {
            replace => {
              "category" => "NETWORK_SUSPICIOUS"
            }
          }
          mutate {
            merge => {
              "sec_result.category" => "category"
            }
          }
          mutate {
            replace => {
              "category_details" => "%{value}"
            }
            on_error => "malname_not_set"
          }
          if ![malname_not_set] and [category_details] != "" {
            mutate {
              merge => {
                "sec_result.category_details" => "category_details"
              }
            }
          }
        }
        else if [key] == "objurl" {
          mutate {
            replace => {
              "tmep_data" => "%{value}"
            }
            on_error => "nested_object"
          }
          if ![nested_object] and [value] != "" {
            mutate {
              replace => {
                "sec_result.about.url" => "%{value}"
              }
              on_error => "objurl_not_set"
            }
          }
        }
        else if [key] == "http-header" {
          mutate {
            replace => {
              "temp_data" => "%{value}"
              "header" => ""
            }
            on_error => "no_value"
          }
          mutate {
            replace => {
              "header.key" => "http-header"
              "header.value" => "%{value}"
            }
            on_error => "no_header"
          }
          if ![no_header] {
            mutate {
              merge => {
                "sec_result.detection_fields" => "header"
              }
              on_error => "no_header"
            }
          }
          grok {
            match => {
              "temp_data" => [
                "%{WORD:http_method} %{URIPATH:uri} %{WORD:proto}/%{GREEDYDATA}",
                "%{WORD:http_method} %{URIPATH}\\?.* %{WORD:proto}/%{GREEDYDATA}"
              ]
            }
            on_error => "grok_failed"
          }
          if ![grok_failed] {
            mutate {
              replace => {
                "temp" => "%{http_method}"
              }
              on_error => "no_http"
            }
            if ![no_http] and [temp] != "" {
              mutate {
                replace => {
                  "sec_result.about.network.http.method" => "%{http_method}"
                }
                on_error => "no_http"
              }
            }
            mutate {
              replace => {
                "temp" => "%{proto}"
              }
              on_error => "no_proto"
            }
            if ![no_proto] and [temp] != "" {
              mutate {
                replace => {
                  "sec_result.about.network.application_protocol" => "%{proto}"
                }
                on_error => "no_proto"
              }
            }
          }
        }
        else if [key] == "url" {
          mutate {
            replace => {
              "url_data" => ""
            }
          }
          mutate {
            replace => {
              "url_data.key" => "url"
              "url_data.value" => "%{value}"
            }
            on_error => "no_url"
          }
          if ![no_url] {
            mutate {
              merge => {
                "sec_result.detection_fields" => "url_data"
              }
              on_error => "no_url"
            }
          }
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "sec_result"
        }
        on_error => "sec_result_empty"
      }
    }
  }

  if [User-Agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{User-Agent}"
      }
      on_error => "agent_not_found"
    }
    mutate {
      convert => {
        "User-Agent" => "parseduseragent"
      }
      on_error => "user_agent_convert_failed"
    }
    if ![user_agent_convert_failed] {
      mutate {
        rename => {
          "User-Agent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
        }
      }
    }
  }
  if [Referer] not in [ "", "-" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{Referer}"
      }
      on_error => "Referer_empty"
    }
  }

  if [httpmethod] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{httpmethod}"
      }
      on_error => "http_method_missing"
    }
  }

  if [Host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{Host}"
      }
      on_error => "Host_empty"
    }
  }

  if [ver_proto] == "HTTP/1.1" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTP"
      }
      on_error => "ver_proto_not_present"
    }
  }

  if [ver_proto] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.version_protocol" => "%{ver_proto}"
      }
      on_error => "ver_proto_empty"
    }
  }

  #Handle network
  mutate {
    uppercase => ["alert.explanation.protocol"]
  }
  if [alert][explanation][protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{alert.explanation.protocol}"
      }
    }
  }
  if [appliance-id] != "" and [agent_info][primary_mac] == "" and [alert][src][mac] == "" and [appliance-id] =="^([0-9a-f]{2}:){5}[0-9a-f]{2}$"  {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "appliance-id"
      }
    }
  }
  else if [appliance-id] != "" {
    mutate {
      replace => {
        "appliance_id_label.key" => "appliance-id"
        "appliance_id_label.value.string_value" => "%{appliance-id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "appliance_id_label"
      }
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "security_result.url_back_to_product" => "%{url}"
      }
    }
  }

  if [agent_info][hostname] != "" {
    mutate {
      replace => {
        "principal_hostname" => "%{agent_info.hostname}"
      }
    }
  }
  if [agent_info][md5values] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.md5" => "%{agent_info.md5values}"
      }
    }
  }
  if [agent_info][primary_mac] != "" {
    mutate {
      gsub => ["agent_info.primary_mac","-",":" ]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "agent_info.primary_mac"
      }
    }
  }
  if [agent_info][primary_ip_address] != "" {
    mutate {
      merge => {
          "event.idm.read_only_udm.principal.ip" => "agent_info.primary_ip_address"
          "event.idm.read_only_udm.principal.asset.ip" => "agent_info.primary_ip_address"
        }
        on_error => "invalid_ip"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    if [file_md5] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.md5" => "%{file_md5}"
        }
      }
    }
    if [file_fullpath] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{file_fullpath}"
        }
      }
    }
    if [file_size] != "" {
      mutate {
        convert => {
          "file_size" => "string"
        }
        on_error => "file_size_already_in_string"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.size" => "%{file_size}"
        }
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.file.size" => "uinteger"
        }
      }
    }
    if [parent_process_path] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.parent_process.file.full_path" => "%{parent_process_path}"
        }
      }
    }
    if [parent_process_pid] != "" {
      mutate {
        convert => {
          "parent_process_pid" => "string"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.parent_process.pid" => "%{parent_process_pid}"
        }
      }
    }
    if [process_pid] != "" {
      mutate {
        convert => {
          "process_pid" => "string"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{process_pid}"
        }
      }
    }
    if [process_path] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.file.full_path" => "%{process_path}"
        }
      }
    }
    if [indicator][name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.security_result.description" => "%{indicator.name}"
        }
      }
    }
    if [indicator][category] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result.category_details" => "indicator.category"
        }
      }
    }
    if [os_kernel_version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform_patch_level" => "%{os_kernel_version}"
        }
      }
    }
    mutate {
        lowercase => ["os_platform"]
    }
    if [os_platform] in ["linux","LINUX","lin"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "LINUX"
        }
      }
    }
    else if [os_platform] in ["windows","WINDOWS","win"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "WINDOWS"
        }
      }
    }
    else if [os_platform] in ["mac","MAC","macos"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "MAC"
        }
      }
    }
    else if [os_platform] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "UNKNOWN_PLATFORM"
        }
      }
    }
    if [event_values][detections][detection] != "" {
      mutate {
        rename => {
          "event_values.detections.detection" => "roles"
        }
      }

      for ele in roles  {
        if [ele][action][actioned-object][file-object][md5sum] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.md5" => "%{ele.action.actioned-object.file-object.md5sum}"
            }
          }
        }
        if [ele][action][actioned-object][file-object][sha1sum] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.sha1" => "%{ele.action.actioned-object.file-object.sha1sum}"
            }
          }
        }
        if [ele][action][actioned-object][file-object][sha256sum] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.file.sha256" => "%{ele.action.actioned-object.file-object.sha256sum}"
            }
          }
        }
        if [ele][action][actioned-object][file-object][sha256sum] != "" or
           [ele][action][actioned-object][file-object][sha1sum] != "" or
           [ele][action][actioned-object][file-object][md5sum] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "SCAN_FILE"
            }
          }
        }
        if [ele][action][actioned-object][file-object][file-path] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.process.file.full_path" => "%{ele.action.actioned-object.file-object.file-path}"
            }
          }
        }
        mutate {
          uppercase => ["ele.infection.confidence-level"]
        }
        if [ele][infection][confidence-level] == "HIGH" {
          mutate {
            replace => {
              "event.idm.read_only_udm.security_result.confidence" => "HIGH_CONFIDENCE"
            }
          }
        }
        else if [ele][infection][confidence-level]  == "LOW" {
          mutate {
            replace => {
              "event.idm.read_only_udm.security_result.confidence" => "LOW_CONFIDENCE"
            }
          }
        }
        else if [ele][infection][confidence-level] == "MEDIUM" {
          mutate {
            replace => {
              "event.idm.read_only_udm.security_result.confidence" => "MEDIUM_CONFIDENCE"
            }
          }
        }
        else {
          mutate {
            replace => {
              "event.idm.read_only_udm.security_result.confidence" => "UNKNOWN_CONFIDENCE"
            }
          }
        }
        if [ele][infection][infection-name] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.security_result.threat_name" => "%{ele.infection.infection-name}"
            }
          }
        }
        if [ele][infection][infection-name] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.security_result.threat_name" => "%{ele.infection.infection-name}"
            }
          }
        }
        if [ele][infection][infection-type] != "" {
