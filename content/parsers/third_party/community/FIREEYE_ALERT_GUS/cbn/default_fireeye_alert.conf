            "security_result.category_details" => "category_details"
          }
          on_error => "invalid_category_details"
        }
      }
    }

    mutate {
      replace => {
        "tests_sid_field.value" => "%{tests.sid}"
      }
      on_error => "tests_sid_field_empty"
    }
    if ![tests_sid_field_empty] {
      mutate {
        replace => {
          "tests_sid_field.key" => "malware sid"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "tests_sid_field"
        }
        on_error => "tests_sid_field_fail"
      }
    }

    mutate {
      replace => {
        "tests_stype_field.value" => "%{tests.stype}"
      }
      on_error => "tests_stype_field_empty"
    }
    if ![tests_stype_field_empty] {
      mutate {
        replace => {
          "tests_stype_field.key" => "malware stype"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "tests_stype_field"
        }
        on_error => "tests_stype_field_fail"
      }
    }
    mutate {
      replace => {
        "temp_url" => "%{tests.objurl}"
      }
      on_error => "tests_objurl_fail"
    }
    if not [tests_objurl_fail] {
      mutate {
        replace => {
          "security_result.about.url" => "%{temp_url}"
        }
        on_error => "objurl_not_set"
      }
    }
    mutate {
      replace => {
        "temp_data" => "%{tests.http-header}"
      }
      on_error => "tests_http_header_fail"
    }
    if not [tests_http_header_fail] {
      mutate {
        replace => {
          "header.key" => "http-header"
          "header.value" => "%{tests.http-header}"
        }
        on_error => "no_header"
      }
      if ![no_header] {
        mutate {
          merge => {
            "security_result.detection_fields" => "header"
          }
          on_error => "no_header"
        }
      }
      grok {
        match => {
          "temp_data" => [
            "%{WORD:http_method} %{URIPATH:uri} %{WORD:proto}/%{GREEDYDATA}",
            "%{WORD:http_method} %{URIPATH}\\?.* %{WORD:proto}/%{GREEDYDATA}"
          ]
        }
        on_error => "grok_failed"
      }
      if ![grok_failed] {
        mutate {
          replace => {
            "temp" => "%{http_method}"
          }
          on_error => "no_http"
        }
        if ![no_http] and [temp] != "" {
          mutate {
            replace => {
              "security_result.about.network.http.method" => "%{http_method}"
            }
            on_error => "no_http"
          }
        }
        mutate {
          replace => {
            "temp" => "%{proto}"
          }
          on_error => "no_proto"
        }
        if ![no_proto] and [temp] != "" {
          mutate {
            replace => {
              "security_result.about.network.application_protocol" => "%{proto}"
            }
            on_error => "no_proto"
          }
        }
      }
    }
    for malname in tests {
      mutate {
        replace => {
          "tests_stype_field" => ""
          "tests_name_field" => ""
          "tests_sha512_field" => ""
          "tests_type_field" => ""
          "tests_downloaded_at_field" => ""
          "tests_executed_at_field" => ""
          "tests_submitted_at_field" => ""
          "http_header_data" => ""
          "sha256_data" => ""
          "sha1_data" => ""
          "md5sum_data" => ""
        }
      }

      mutate {
        replace => {
          "sha256_data" => "%{malname.sha256}"
        }
        on_error => "sha256_empty"
      }

      if [sha256_data] != "" and ![sha256_empty] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.sha256" => "%{sha256_data}"
          }
          on_error => "sha256_data_empty"
        }
      }

      mutate {
        replace => {
          "sha1_data" => "%{malname.sha1}"
        }
        on_error => "sha1_empty"
      }

      if [sha1_data] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.sha1" => "%{sha1_data}"
          }
          on_error => "sha1_data_empty"
        }
      }

      mutate {
        replace => {
          "md5sum_data" => "%{malname.md5sum}"
        }
        on_error => "md5sum_empty"
      }

      if [md5sum_data] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.md5" => "%{md5sum_data}"
          }
          on_error => "md5sum_data_empty"
        }
      }

      mutate {
        replace => {
          "tests_downloaded_at_field.value" => "%{malname.downloaded-at}"
        }
        on_error => "tests_downloaded_at_field_empty"
      }
      if ![tests_downloaded_at_field_empty] {
        mutate {
          replace => {
            "tests_downloaded_at_field.key" => "downloaded-at"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "tests_downloaded_at_field"
          }
          on_error => "tests_downloaded_at_field_fail"
        }
      }

      mutate {
        replace => {
          "tests_executed_at_field.value" => "%{malname.executed-at}"
        }
