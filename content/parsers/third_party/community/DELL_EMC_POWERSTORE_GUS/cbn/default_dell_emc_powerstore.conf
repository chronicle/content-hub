# Product: DELL_EMC_POWERSTORE
# Category: DATA STORAGE
# Supported Format: SYSLOG + KV
# Reference: N/A
# Last Updated: 2024-11-05
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "ts" => ""
      "intermediary_host" => ""
      "product_event_type" => ""
      "kv_data" => ""
      "description" => ""
      "cmd" => ""
      "app" => ""
      "file_path" => ""
      "request_id" => ""
      "src" => ""
      "appliance" => ""
      "id" => ""
      "client_ip" => ""
      "user" => ""
      "resource_type" => ""
      "action" => ""
      "status" => ""
      "intermediary" => ""
      "target" => ""
      "principal" => ""
      "metadata.event_type" => "GENERIC_EVENT"
    }
  }
  mutate {
    gsub => ["message",'\\\"\\\"','\"']
  }

  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:ts} %{DATA} %{HOSTNAME:src} %{DATA}\\[PowerStore_audit_event@%{INT:product_event_type} %{DATA:kv_data}\\] %{GREEDYDATA:description}"
      ]
    }
    overwrite => ["ts", "src", "product_event_type", "kv_data", "description"]
    on_error => "grok_failure"
  }

  if [description] != "" {
    grok {
      match => {
        "description" => [
          "command \\[%{DATA:cmd}\\]%{DATA} via %{DATA:app}\\."
          "file: %{DATA:file_path} %{DATA} via %{WORD:app} with request ID: %{DATA:request_id}\\."
        ]
      }
      overwrite => ["cmd", "app", "file_path", "request_id", "host"]
      on_error => "grok_failure"
    }
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "description_not_found"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", '\\\" (\\S+)=\\\"', "^$1="]
    }
    mutate {
      gsub => ["kv_data",'\\\"',""]
    }

    kv {
      source => "kv_data"
      field_split => "^"
      value_split => "="
      on_error => "kv_data_failure"
    }
  }

  if [ts] != "" {
    date {
      match => ["ts","yyyy-MM-ddTHH:mm:ss"]
      on_error => "ts_mismatch"
    }
  }

  if [src] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{src}"
      }
      on_error => "src_not_found"
    }
  }

  if [client_ip] != "" {
    grok {
      match => {
        "client_ip" => [
          "%{IP:client_ip}"
        ]
      }
      overwrite => ["client_ip"]
      on_error => "client_ip_not_found"
    }
    if ![client_ip_not_found] {
      mutate {
        merge => {
          "principal.ip" => "client_ip"
          "principal.asset.ip" => "client_ip"
        }
        on_error => "client_ip_not_found"
      }
    }
  }

  if [app] != "" {
    mutate {
      replace => {
        "target.application" => "%{app}"
      }
      on_error => "app_not_found"
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
      }
      on_error => "user_not_found"
    }
  }

  if [resource_type] not in ["", "None", "not applicable"] {
    mutate {
      replace => {
        "target.resource.resource_subtype" => "%{resource_type}"
      }
      on_error => "resource_type_not_found"
    }
  }

  if [request_id] != "" {
    mutate {
      replace => {
        "request_id_label.key" => "request_id"
        "request_id_label.value" => "%{request_id}"
      }
      on_error => "request_id_not_found"
    }
    if ![request_id_not_found] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "request_id_label"
        }
        on_error => "request_id_not_found"
      }
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "action_label.key" => "action"
        "action_label.value" => "%{action}"
      }
      on_error => "action_not_found"
    }
    if ![action_not_found] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "action_label"
        }
        on_error => "action_not_found"
      }
    }
  }

  if [action] == "create" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_CREATION"
      }
    }
  }
  else if [action] == "delete" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_DELETION"
      }
    }
  }
  else if [action] in ["update", "modify"] {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
      }
    }
  }

  if [cmd] != "" {
    mutate {
      replace => {
        "target.process.command_line" => "%{cmd}"
        "metadata.event_type" => "PROCESS_UNCATEGORIZED"
      }
      on_error => "cmd_not_found"
    }
  }

  if [file_path] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{file_path}"
        "metadata.event_type" => "FILE_UNCATEGORIZED"
      }
      on_error => "file_path_not_found"
    }
    if [description] =~ "Successfully deleted file" {
      mutate {
        replace => {
          "metadata.event_type" => "FILE_DELETION"
        }
      }
    }
  }

  if [appliance] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{appliance}"
      }
      on_error => "appliance_not_found"
    }
  }

  if [id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id}"
      }
      on_error => "id_not_found"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_not_found"
    }
  }

  if [status] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{status}"
      }
      on_error => "status_not_found"
    }
    if [status] == "success" {
      mutate {
        replace => {
          "security_result.action" => "ALLOW"
        }
        on_error => "status_not_found"
      }
    }
    else if [status] == "failed" {
      mutate {
        replace => {
          "security_result.action" => "BLOCK"
        }
        on_error => "status_not_found"
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "DELL_EMC_POWERSTORE"
      "metadata.vendor_name" => "DELL_EMC_POWERSTORE"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" =>"event.idm.read_only_udm.metadata"
      }
      on_error => "metadata_failure"
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
      on_error => "principal_failure"
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
      on_error => "target_failure"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
