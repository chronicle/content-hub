# Product: Huawei Switch
# Category: Switches and Routers
# Supported Format: JSON+SYSLOG, JSON+KV, SYSLOG+KV, SYSLOG
# Reference: N/A
# Last Updated: 2026-08-31
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "metadata" => ""
      "additional" => ""
      "target" => ""
      "security_result" => ""
      "network" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "has_target" => "false"
      "timestamp" => ""
      "month" => ""
      "day" => ""
      "year" => ""
      "time" => ""
      "desc" => ""
      "kv_data" => ""
      "state" => ""
      "mac_address" => ""
      "cid" => ""
      "VlanId" => ""
      "Original-Port" => ""
      "MacAddress" => ""
      "VLANID" => ""
      "Task" => ""
      "VpnName" => ""
      "User" => ""
      "AuthenticationMethod" => ""
      "Command" => ""
      "LocalIp" => ""
      "Destination" => ""
      "Interface" => ""
      "ProcessId" => ""
      "InfoID" => ""
      "Ip" => ""
      "host" => ""
      "hostname" => ""
      "DeviceType" => ""
      "devid" => ""
      "severityName" => ""
      "severity" => ""
      "facility" => ""
      "facilityName" => ""
      "_time" => ""
      "intermediary" => ""
      "syslog_timestamp" => ""
      "event_identifier" => ""
      "temp_cid" => ""
      "alarmID" => ""
      "clearType" => ""
      "temp_desc" => ""
      "temp_description" => ""
      "details_kv" => ""
      "has_user_logout" => "false"
      "extensions" => ""
      "tty_type" => ""
      "_raw" => ""
      "no_raw_grok_failure" => ""
      "temp_service" => ""
      "service_description" => ""
      "logfile_description" => ""
      "temp_security" => ""
      "service_vlan_id" => ""
      "service_original_port" => ""
      "service_flapping_port1" => ""
      "service_flapping_port2" => ""
      "service_mac_description" => ""
      "temp_oid" => ""
      "UserType" => ""
      "UserName" => ""
      "RemoteIp" => ""
      "Reason" => ""
      "SessionId" => ""
      "Method" => ""
      "Accept" => ""
      "ContentType" => ""
      "Url" => ""
      "FragIndex" => ""
      "Body" => ""
      "AssistantName" => ""
      "SourceAddress" => ""
      "DestAddress" => ""
      "cmd" => ""
      "ServiceType" => ""
      "InterfaceName" => ""
      "BandWidthUsage" => ""
      "TrapThreshold" => ""
      "ip_address" => ""
      "IPADDRESS" => ""
      "event_type" => ""
      "event_hostname" => ""
      "desc_input" => ""
      "event_type_value" => ""
      "event_identifier_value" => ""
      "UserAddress" => ""
      "LocalAddress" => ""
      "FailedReason" => ""
      "VPNInstanceName" => ""
      "Result" => ""
      "source_ip" => ""
      "source_host" => ""
      "timezone" => ""
      "log_type" => ""
      "USER" => ""
      "MAC" => ""
      "ACNAME" => ""
      "ACMAC" => ""
      "result_description" => ""
      "AUTHID" => ""
      "RADIOID" => ""
      "cib_id" => ""
      "SSID" => ""
      "ERRCODE" => ""
      "interface_details" => ""
      "DAYLIGHT" => ""
      "TIME" => ""
      "ZONE" => ""
      "APMAC" => ""
      "RESULT" => ""
      "INTERFACE" => ""
    }
  }

  mutate {
    gsub => ["message","\\r\\n"," "]
  }
  mutate {
    gsub => ["message","\\n"," "]
  }

  json{
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{MONTH:month} %{MONTHDAY:day} %{YEAR:year} %{TIME:time} %{DATA:desc}, %{DATA:kv_data}\\\.%{GREEDYDATA:state} MAC address : %{DATA:mac_address}\\\.",
        "<%{INT}>%{MONTH:month} %{MONTHDAY:day} %{YEAR:year} %{TIME:time} %{HOSTNAME:hostname} (?P<temp_desc>%.*\\.)\\s+\\(%{GREEDYDATA:kv_data}\\)",
        "%{INT}>%{MONTH:month} %{MONTHDAY:day} %{YEAR:year} %{TIME:time} %{DATA:desc}\\\. \\\(%{GREEDYDATA:kv_data}\\\)",
        "<%{INT}>%{MONTH:month} %{MONTHDAY:day} %{YEAR:year} %{TIME:time} %{GREEDYDATA:desc}, InfoID=%{DATA:InfoID}\\\.",
        "<%{INT}>%{MONTH:month} %{MONTHDAY:day} %{YEAR:year} %{TIME:time} %{DATA:desc}, %{DATA:kv_data}\\\.%{GREEDYDATA:state}",
        "(?P<syslog_timestamp>%{MONTH:month}\\s+%{MONTHDAY:day} %{YEAR:year} %{TIME:time}) %{DATA:hostname} %{GREEDYDATA:temp_desc}",
        "<%{INT}> %{SYSLOGTIMESTAMP:syslog_timestamp} %{ISO8601_TIMEZONE:timezone} %{IP:source_ip} %{DATA:source_host} %{GREEDYDATA:temp_desc}"
        "%{GREEDYDATA:temp_desc}"
      ]
    }
    overwrite => ["month", "day", "year", "time", "desc", "kv_data", "state", "mac_address", "syslog_timestamp", "hostname", "facility", "event_type_raw", "cid", "description_text", "temp_desc", "source_ip", "source_host", "timezone", "InfoID"]
    on_error => "no_grok"
  }
  if ![no_grok] {
    kv {
      source => "kv_data"
      value_split => "="
      field_split => ","
      on_error => "kv_json_failure"
    }
    if [kv_data] =~ ":.*;.*:" {
      kv {
        source => "kv_data"
        value_split => ":"
        field_split => ";"
        on_error => "kv_failed"
      }
    }
    if [IPADDRESS] != "" {
      grok {
        match => {
          "IPADDRESS" => "%{IP:ip_address}"
        }
        overwrite => ["ip_address"]
        on_error => "no_ip_address"
      }
      if ![no_ip_address] and [ip_address] != "" {
        mutate {
          merge => {
            "principal.ip" => "ip_address"
            "principal.asset.ip" => "ip_address"
          }
          on_error => "no_ip_address_merge_ip"
        }
        if ![no_ip_address_merge_ip] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    if [source_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "source_ip"
          "principal.asset.ip" => "source_ip"
        }
        on_error => "no_ip_address_merge_source_ip"
      }
      if ![no_ip_address_merge_source_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [source_host] != "" {
      mutate {
        gsub => [ "source_host", "\]:", "" ]
      }
      mutate {
        replace => {
          "principal.hostname" => "%{source_host}"
          "principal.asset.hostname" => "%{source_host}"
        }
        on_error => "source_host_hostname_not_found"
      }
      if ![source_host_hostname_not_found] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [syslog_timestamp] != "" {
      date {
        match => [ "syslog_timestamp", "MMM dd yyyy HH:mm:ss.SSS" ]
        target => "metadata.event_timestamp"
        on_error => "date_parse_error_syslog"
      }
      if [date_parse_error_syslog] {
        mutate {
          replace => {
            "syslog_timestamp" => "%{syslog_timestamp} %{timezone}"
          }
          on_error => "no_syslog_timestamp"
        }
        date {
          match => [ "syslog_timestamp", "MMM d HH:mm:ss ZZ", "MMM dd HH:mm:ss ZZ" ]
          target => "metadata.event_timestamp"
          rebase => true
          on_error => "date_parse_error_1"
        }
      }
    }
    if [hostname] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{hostname}"
        }
        on_error => "no_hostname"
      }
    }
    if [temp_desc] != "" {
      grok {
        match => {
          "temp_desc" => [
            "%{GREEDYDATA:event_identifier}:CID=%{DATA:temp_cid}-alarmID=%{DATA:alarmID}-clearType=%{DATA:clearType};%{GREEDYDATA:temp_description}"
            "%{DATA:event_identifier}:CID=%{DATA:temp_cid}-OID=%{DATA:temp_oid};%{GREEDYDATA:logfile_description}\.\s*\\(LogFileType=%{WORD:temp_security}\\)"
            "%{GREEDYDATA:event_identifier}:Service=%{DATA:temp_service}-OID=%{DATA:temp_oid};%{GREEDYDATA:service_description}"
            "%{GREEDYDATA:event_identifier}\\[%{DATA:temp_cid}\\]:\\s*\\[%{DATA:log_type}\\]%{GREEDYDATA:kv_data}"
            "%{GREEDYDATA:event_identifier}:CID=%{DATA:temp_cid};%{GREEDYDATA:temp_description}\.\s*\\((?<details_kv>.*)\\)$"
            "%{GREEDYDATA:event_identifier}\\[%{DATA:temp_cid}\\]: %{GREEDYDATA:temp_description}\\.\\s*\\((?<details_kv>.*)\\)$"
            "%{GREEDYDATA:event_identifier}:CID=%{DATA:temp_cid}(-alarmID=%{DATA:alarmID})?;%{GREEDYDATA:temp_description}"
            "%{GREEDYDATA:event_identifier}\\[%{DATA:temp_cid}\\]:\\s*%{GREEDYDATA:temp_description}"
            "%{GREEDYDATA:temp_description}\\.\\s*\\((?<details_kv>.*)\\)$"
          ]
        }
        overwrite => ["event_identifier", "temp_cid", "alarmID", "clearType", "temp_description", "details_kv", "temp_oid", "temp_security", "temp_service", "service_description", "logfile_description", "log_type", "kv_data"]
        on_error => "no_desc_grok"
      }
      if ![no_desc_grok] {
        if [log_type] != "" {
          mutate {
            replace => {
              "metadata.description" => "%{log_type}"
            }
            on_error => "no_log_type"
          }
        }
        mutate {
          gsub => [ "kv_data", "AUTHID=", "AUTHID:" ]
        }
        if [kv_data] != "" {
          kv {
            source => "kv_data"
            field_split => ";"
            value_split => ":"
            on_error => "kv_data_colon_failed"
          }
        }
        if [USER] != "" {
          mutate {
            replace => {
              "principal.user.userid" => "%{USER}"
              "has_user" => "true"
            }
            on_error => "no_user_replace"
          }
        }
        if [MAC] != "" {
          mutate {
            gsub => ["MAC", "-", ":"]
          }
          if [MAC] =~ "^(([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2})$" {
            mutate {
              merge => {
                "principal.mac" => "MAC"
                "principal.asset.mac" => "MAC"
              }
              on_error => "invalid_mac"
            }
          }
        }
        if [APMAC] != "" {
          mutate {
            gsub => ["APMAC", "-", ":"]
          }
          if [APMAC] =~ "^(([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2})$" {
            mutate {
              merge => {
                "event.idm.read_only_udm.observer.mac" => "APMAC"
              }
              on_error => "invalid_APMAC_merge_error"
            }
          }
        }
        if [ACNAME] != "" {
          mutate {
            replace => {
              "target.hostname" => "%{ACNAME}"
              "target.asset.hostname" => "%{ACNAME}"
            }
            on_error => "no_ACNAME"
          }
          if ![no_ACNAME] {
            mutate {
              replace => {
                "has_target" => "true"
              }
              on_error => "no_ACNAME_has_target"
            }
          }
        }
        if [ACMAC] != "" {
          mutate {
            gsub => ["ACMAC", "-", ":"]
          }
          if [ACMAC] =~ "^(([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2})$" {
            mutate {
              merge => {
                "target.mac" => "ACMAC"
                "target.asset.mac" => "ACMAC"
              }
              on_error => "invalid_ACMAC"
            }
          }
        }
        if [RESULT] != "" {
          mutate {
            replace => {
              "security_result.summary" => "%{RESULT}"
            }
            on_error => "no_result_description"
          }
        }
        if [SSID] != "" {
          mutate {
            replace => {
              "ssid_label.key" => "SSID"
              "ssid_label.value" => "%{SSID}"
            }
            on_error => "no_SSID"
          }
          if ![no_SSID] {
            mutate {
              merge => {
                "target.resource.attribute.labels" => "ssid_label"
              }
              on_error => "no_SSID_merge"
            }
          }
        }
        if [AUTHID] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.session_id" => "%{AUTHID}"
            }
            on_error => "no_AUTHID"
          }
        }
        if [RADIOID] != "" {
          mutate {
            replace => {
              "radio_id_label.key" => "radio_id"
              "radio_id_label.value.string_value" => "%{RADIOID}"
            }
            on_error => "no_radio_id"
          }
          if ![no_radio_id] {
            mutate {
              merge => {
                "additional.fields" => "radio_id_label"
              }
              on_error => "no_radio_id_merge"
            }
          }
        }
        if [ERRCODE] != "" {
          mutate {
            replace => {
              "errcode_label.key" => "errcode"
              "errcode_label.value.string_value" => "%{ERRCODE}"
            }
            on_error => "no_errcode"
          }
          if ![no_errcode] {
            mutate {
              merge => {
                "additional.fields" => "errcode_label"
              }
              on_error => "no_errcode_merge"
            }
          }
        }
        if [DAYLIGHT] != "" {
          mutate {
            replace => {
              "daylight_label.key" => "daylight"
              "daylight_label.value.string_value" => "%{DAYLIGHT}"
            }
            on_error => "no_daylight"
          }
          if ![no_daylight] {
            mutate {
              merge => {
                "additional.fields" => "daylight_label"
              }
              on_error => "no_daylight_merge"
            }
          }
        }
        if [ZONE] != "" {
          mutate {
            replace => {
              "zone_label.key" => "zone"
              "zone_label.value.string_value" => "%{ZONE}"
            }
            on_error => "no_zone"
          }
          if ![no_zone] {
            mutate {
              merge => {
                "additional.fields" => "zone_label"
              }
              on_error => "no_zone_merge"
            }
          }
        }
        if [INTERFACE] != "" {
          mutate {
            replace => {
              "interface_details_label.key" => "interface"
              "interface_details_label.value.string_value" => "%{INTERFACE}"
            }
            on_error => "no_interface_details"
          }
          if ![no_interface_details] {
            mutate {
              merge => {
                "additional.fields" => "interface_details_label"
              }
              on_error => "no_interface_details_merge"
            }
          }
        }
        mutate {
          replace => {
            "cib_id" => "%{CIB ID}"
          }
          on_error => "no_cib_id"
        }
        if [cib_id] != "" {
          mutate {
            replace => {
              "cib_id_label.key" => "cib_id"
              "cib_id_label.value.string_value" => "%{cib_id}"
            }
            on_error => "no_cib_id_label"
          }
          if ![no_cib_id_label] {
            mutate {
              merge => {
                "additional.fields" => "cib_id_label"
              }
              on_error => "no_cib_id_merge"
            }
          }
        }
        if [TIME] != "" {
          date {
            match => ["TIME", "UNIX"]
            target => "metadata.collected_timestamp"
            on_error => "_time_error"
          }
        }
        if [event_identifier] != "" {
          grok {
            match => {
              "event_identifier" => ["%{DATA}/%{INT}/%{DATA:event_identifier_value}\\(%{GREEDYDATA}"]
            }
            overwrite => ["event_identifier_value"]
            on_error => "no_event_identifier_grok"
          }
          if [event_identifier_value] != "" {
            mutate {
              replace => {
                "metadata.product_event_type" => "%{event_identifier_value}"
              }
              on_error => "no_event_identifier_value"
            }
          }
          mutate {
            replace => {
              "event_identifier_label.key" => "event_identifier"
              "event_identifier_label.value.string_value" => "%{event_identifier}"
            }
            on_error => "no_event_identifier"
          }
          if ![no_event_identifier] {
            mutate {
              merge => {
                "additional.fields" => "event_identifier_label"
              }
              on_error => "no_event_identifier_merge"
            }
          }
        }
        if [temp_description] != "" {
          grok {
            match => {
              "temp_description" => ["The user succeeded in logging out of (?<tty_type>VTY0)"]
            }
            overwrite => ["tty_type"]
            on_error => "no_tty_type"
          }
          if ![no_tty_type] {
            if [tty_type] != "" {
              mutate {
                replace => {
                  "target.resource.name" => "%{tty_type}"
                  "has_user_logout" => "true"
                }
                on_error => "no_tty_type_target"
              }
            }
          }
          mutate {
            replace => {
              "metadata.description" => "%{temp_description}"
            }
            on_error => "no_USER_LOGOUT"
          }
        }
        if [logfile_description] != "" {
          mutate {
            replace => {
              "metadata.description" => "%{logfile_description}"
            }
            on_error => "no_logfile_description"
          }
        }
        if [service_description] != "" {
          grok {
            match => {
              "service_description" => ["MAC flapping detected, VlanId = %{NUMBER:service_vlan_id}, Original-Port = %{NOTSPACE:service_original_port}, Flapping port 1 = %{NOTSPACE:service_flapping_port1}, port 2 = %{NOTSPACE:service_flapping_port2}. %{GREEDYDATA:service_mac_description}: %{HOSTNAME:mac_address}."]
            }
            overwrite => ["service_vlan_id", "service_original_port", "service_flapping_port1", "service_flapping_port2", "service_mac_description", "mac_address"]
            on_error => "no_service_description"
          }
          if ![no_service_description] {
            if [service_vlan_id] != "" {
              mutate {
                replace => {
                  "vlan_id_label.key" => "service_vlan_id"
                  "vlan_id_label.value.string_value" => "%{service_vlan_id}"
                }
                on_error => "no_service_vlan_id"
              }
              if ![no_service_vlan_id] {
                mutate {
                  merge => {
                    "additional.fields" => "vlan_id_label"
                  }
                  on_error => "no_service_vlan_id_merge"
                }
              }
            }
            if [service_original_port] != "" {
              mutate {
                replace => {
                  "service_original_port_label.key" => "service_original_port"
                  "service_original_port_label.value.string_value" => "%{service_original_port}"
                }
                on_error => "no_service_original_port"
              }
              if ![no_service_original_port] {
                mutate {
                  merge => {
                    "additional.fields" => "service_original_port_label"
                  }
                  on_error => "no_service_original_port_merge"
                }
              }
            }
            if [service_flapping_port1] != "" {
              mutate {
                replace => {
                  "service_flapping_port1_label.key" => "service_flapping_port1"
                  "service_flapping_port1_label.value.string_value" => "%{service_flapping_port1}"
                }
                on_error => "no_service_flapping_port1"
              }
              if ![no_service_flapping_port1] {
                mutate {
                  merge => {
                    "additional.fields" => "service_flapping_port1_label"
                  }
                  on_error => "no_service_flapping_port1_merge"
                }
              }
            }
            if [service_flapping_port2] != "" {
              mutate {
                replace => {
                  "service_flapping_port2_label.key" => "service_flapping_port2"
                  "service_flapping_port2_label.value.string_value" => "%{service_flapping_port2}"
                }
                on_error => "no_service_flapping_port2"
              }
              if ![no_service_flapping_port2] {
                mutate {
                  merge => {
                    "additional.fields" => "service_flapping_port2_label"
                  }
                  on_error => "no_service_flapping_port2_merge"
                }
              }
            }
            if [service_mac_description] != "" {
              mutate {
                replace => {
                  "metadata.description" => "%{service_mac_description}"
                }
                on_error => "no_service_mac_description"
              }
            }
            if [mac_address] != "" {
              mutate {
                gsub => ["mac_address", "[.:-]", ""]
                lowercase => ["mac_address"]
              }
              mutate {
                gsub => [ "mac_address", "([a-f0-9]{2})([a-f0-9]{2})([a-f0-9]{2})([a-f0-9]{2})([a-f0-9]{2})([a-f0-9]{2})", "\${1}:\${2}:\${3}:\${4}:\${5}:\${6}" ]
                on_error => "no_mac_address_format"
              }
              mutate {
                merge => {
                  "principal.mac" => "mac_address"
                }
                on_error => "no_mac_address_merge"
              }
              if ![no_mac_address_merge] {
                mutate {
                  replace => {
                    "has_principal" => "true"
                  }
                  on_error => "no_mac_address_has_principal"
                }
              }
            }
          }
        }
        if [temp_cid] != "" {
          mutate {
            replace => {
              "metadata.product_log_id" => "%{temp_cid}"
            }
            on_error => "no_temp_cid"
          }
        }
        if [temp_service] != "" {
          mutate {
            replace => {
              "metadata.product_log_id" => "%{temp_service}"
            }
            on_error => "no_temp_service"
          }
        }
        if [alarmID] != "" {
          mutate {
            replace => {
              "alarmID_label.key" => "alarmID"
              "alarmID_label.value.string_value" => "%{alarmID}"
            }
            on_error => "no_alarmID"
          }
          if ![no_alarmID] {
            mutate {
              merge => {
                "additional.fields" => "alarmID_label"
              }
              on_error => "no_alarmID_merge"
            }
          }
        }
        if [clearType] != "" {
          mutate {
            replace => {
              "clearType_label.key" => "clearType"
              "clearType_label.value.string_value" => "%{clearType}"
            }
            on_error => "no_clearType"
          }
          if ![no_clearType] {
            mutate {
              merge => {
                "additional.fields" => "clearType_label"
              }
              on_error => "no_clearType_merge"
            }
          }
        }
        if [temp_oid] != "" {
          mutate {
            replace => {
              "principal.resource.product_object_id" => "%{temp_oid}"
            }
            on_error => "no_temp_oid"
          }
        }
        if [temp_security] != "" {
          mutate {
            replace => {
              "target.resource.name" => "%{temp_security}"
            }
            on_error => "no_temp_security"
          }
        }
        if [details_kv] != "" {
          kv {
            source => "details_kv"
            field_split => ","
            value_split => "="
