    mutate {
      replace => {
        "TrapThreshold_label.key" => "TrapThreshold"
        "TrapThreshold_label.value.string_value" => "%{TrapThreshold}"
      }
      on_error => "no_TrapThreshold"
    }
    if ![no_TrapThreshold] {
      mutate {
        merge => {
          "additional.fields" => "TrapThreshold_label"
        }
        on_error => "no_TrapThreshold_merge_failed"
      }
    }
  }

  if [BandWidthUsage] != "" {
    mutate {
      replace => {
        "BandWidthUsage_label.key" => "BandWidthUsage"
        "BandWidthUsage_label.value.string_value" => "%{BandWidthUsage}"
      }
      on_error => "no_BandWidthUsage"
    }
    if ![no_BandWidthUsage] {
      mutate {
        merge => {
          "additional.fields" => "BandWidthUsage_label"
        }
        on_error => "no_BandWidthUsage_merge_failed"
      }
    }
  }

  if [ProcessId] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{ProcessId}"
      }
      on_error => "no_ProcessId"
    }
  }

  if [InfoID] != "" {
    mutate {
      replace => {
        "InfoID_label.key" => "InfoID"
        "InfoID_label.value.string_value" => "%{InfoID}"
      }
      on_error => "no_InfoID"
    }
    if ![no_InfoID] {
      mutate {
        merge => {
          "additional.fields" => "InfoID_label"
        }
        on_error => "InfoID_merge_failed"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "HUAWEI"
      "metadata.product_name" => "HUAWEI_ROUTER"
    }
  }

  if [has_user] == "true" and [event_type] =~ "LOGIN" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
      on_error => "no_user_login_event"
    }
  }
  else if [has_principal] == "true" and [has_user] == "true" and [has_target] == "true" and [has_user_logout] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGOUT"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
      on_error => "no_user_logout_event"
    }
  }
  else if [has_principal] == "true" and [has_user] == "true" and [has_target] == "true" and [has_user_logout] == "false" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
      on_error => "no_network_connection_event"
    }
  }
  else if ([has_principal] == "true" or [has_target] == "true" ) and [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "no_user_uncategorized_event"
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
      on_error => "no_principal"
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_sec_result"
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
