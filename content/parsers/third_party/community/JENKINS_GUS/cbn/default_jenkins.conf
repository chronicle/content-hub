# Product: JENKINS
# Category: Automation and DevOps
# Supported Format: JSON, SYSLOG
# Reference: NA
# Last Updated: 2026-10-07
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "descript" => ""
      "uri" => ""
      "security_result" => ""
      "msg1" => ""
      "msg2" => ""
      "data" => ""
      "month" => ""
      "day" => ""
      "year" => ""
      "time" => ""
      "ampm" => ""
      "user" => ""
      "src_ip" => ""
      "act" => ""
      "object" => ""
      "object_id" => ""
      "parent" => ""
      "desc" => ""
      "userid" => ""
      "ip" => ""
      "action" => ""
      "has_principal" => "false"
      "receiveTimestamp" => ""
      "timestamp" => ""
      "insertId" => ""
      "severity" => ""
      "resource_labels_location" => ""
      "jobname" => ""
      "credential_type" => ""
      "job_class" => ""
      "credential_name" => ""
      "logName" => ""
      "resource_type" => ""
      "textPayload" => ""
      "resource_labels_project_id" => ""
      "resource_labels_namespace_name" => ""
      "resource_labels_container_name" => ""
      "thread_id" => ""
      "loglevel" => ""
      "logger" => ""
      "connection_protocol" => ""
      "connection_id" => ""
      "client_ip" => ""
      "client_port" => ""
      "has_principal_ip" => "false"
      "audit_type" => ""
      "build_number" => ""
      "trigger" => ""
      "params_short" => ""
      "recipients" => ""
      "time_stamp" => ""
    }
  }

  mutate {
    gsub => ["message" , "\\r\\n" , " "]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "error_json"
  }
  # The event has a general format {Timestamp - Action/Object - by User - from IP}
  grok {
    match => {
      "message" => [
        # Example: Oct 18, 2022 1:16:01,007 PM/scriptText by dummy_user_01 from 1.1.1.1
        "%{MONTH:month}\\s+%{MONTHDAY:day},\\s+%{YEAR:year}\\s+%{TIME:time}\\s+(?P<ampm>AM|PM)/%{DATA:msg1}\\s+by\\s+%{DATA:user}\\s+from\\s+%{IPV4:src_ip}",
        "%{MONTH:month}\\s+%{MONTHDAY:day},\\s+%{YEAR:year}\\s+%{TIME:time}\\s+(?P<ampm>AM|PM)/%{DATA:msg1}\\s+by user\\s+%{DATA:user}\\s+from\\s+%{IPV4:src_ip}",
      ]
    }
    overwrite => ["month", "day", "year", "time", "ampm", "msg1", "user", "src_ip"]
    on_error => "error_grok_general"
  }

  # But there are some specific events that does not have "by User" or "from IP"
  if [error_grok_general] {
    grok {
      match => {
        "message" => [
          # Example log: Oct 19, 2022 3:13:01,117 AM/scriptText by user usljnk01, Parameters:[]
          # Example log: Oct 19, 2022 3:13:01,117 AM/scriptText by user usljnk01, Parameters:[] on node #unknown# started at 2022-10-18T10:10:00Z completed in 1120ms completed: SUCCESS
          "%{MONTH:month}\\s+%{MONTHDAY:day},\\s+%{YEAR:year}\\s+%{TIME:time}\\s+(?P<ampm>AM|PM)%{DATA:msg1}\\s+by user\\s+%{USER:user},\\s+%{GREEDYDATA:msg2}",
          # Example log: Oct 19, 2022 3:13:01,117 AM/scriptText by data , Parameters:[]
          # Example log: Oct 19, 2022 3:13:01,117 AM/scriptText by data, Parameters:[] on node #unknown# started at 2022-10-18T10:10:00Z completed in 1120ms completed: SUCCESS
          "%{MONTH:month}\\s+%{MONTHDAY:day},\\s+%{YEAR:year}\\s+%{TIME:time}\\s+(?P<ampm>AM|PM)%{DATA:msg1}\\s+by user\\s+%{USER:user},\\s+%{GREEDYDATA:msg2}",
          "%{MONTH:month} %{MONTHDAY:day}, %{YEAR:year} %{TIME:time} (?P<ampm>(PM|AM))(?P<descript>%{DATA:uri} by %{DATA} from )",
          # Example log: Oct 19, 2022 3:13:01,117 AM/scriptText by usljnk01
          "%{MONTH:month}\\s+%{MONTHDAY:day},\\s+%{YEAR:year}\\s+%{TIME:time}\\s+(?P<ampm>AM|PM)/(%{DATA:msg1}\\s+by\\s+%{GREEDYDATA:data}|%{GREEDYDATA:msg2})",
          # Example log: Oct 19, 2022 3:13:01,117 AM/scriptText from 1.1.1.2
          "%{MONTH:month}\\s+%{MONTHDAY:day},\\s+%{YEAR:year}\\s+%{TIME:time}\\s+(?P<ampm>AM|PM)/%{DATA:msg1}\\s+from\\s+%{GREEDYDATA:data}",
          # Example log: Oct 18, 2022 10:10:02,003 AM001_INTERNAL_DEVOPS Â» Monitoring #25554 Started by timer, Parameters:[] on node #unknown# started at 2022-10-18T10:10:00Z completed in 1120ms completed: SUCCESS
          "%{MONTH:month}\\s+%{MONTHDAY:day},\\s+%{YEAR:year}\\s+(%{TIME:time}|%{DATA:time})\\s+(?P<ampm>AM|PM)%{GREEDYDATA:msg2}"
        ]
      }
      overwrite => ["month", "day", "year", "time", "ampm", "msg1", "data", "msg2", "user","descript", "uri"]
      on_error => "error_grok_specific"
    }
    if [error_grok_specific] and [error_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }

    if [uri] != "" {
      mutate {
        replace => {
          "principal.url" => "%{uri}"
        }
        on_error => "error_uri"
      }
    }

    if [descript] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{descript}"
        }
        on_error => "description_replace_failed"
      }
    }

    # Checks if the IP matches with IPV4 format
    if [data] =~ "^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$" {
      mutate {
        rename => {
          "data" => "principal_ip"
        }
      }
      mutate {
        merge => {
          "principal.ip" => "principal_ip"
          "principal.asset.ip" => "principal_ip"
        }
        on_error => "error_principal_ip"
      }
    }
    else if [data] =~ "[a-zA-Z0-9. _-]+" {
      mutate {
        rename => {
          "data" => "userid"
        }
      }
      mutate {
        replace => {
          "principal.user.userid" => "%{userid}"
        }
        on_error => "user_replace_failed"
      }
    }
  }

  # Field 'TIMESTAMP'-> Created by mergeing "year-month-day"
  if [time] != "" {
    mutate { gsub => ['time', ',', '.'] }
    mutate {
      gsub => ["time", "\\s+", ""]
    }
    mutate {
      replace => {
        "timestamp" => "%{year}-%{month}-%{day} %{time} %{ampm}"
      }
      on_error => "error_yearMonthDay"
    }
    date {
      match => [ "timestamp", "yyyy-MMM-dd HH:mm:ss.SSS A", "yyyy-MMM-d HH:mm:ss.SSS A" ]
      target => "metadata.event_timestamp"
      on_error => "error_timestamp"
    }
  }

  # Field 'MSG1' extract 'object' and 'action'
  if [msg1] =~ "/" {
    grok {
      match => {
        "msg1" => [
          '%{DATA:act}/$'
          '\\\"\'\>%{DATA:act}$'
          '%{GREEDYDATA:object}/\\\"%{DATA:act}$'
          '%{GREEDYDATA:object}/%{DATA:act}$'
        ]
      }
      overwrite => ["act", "object"]
      on_error => "grok_object_slash_failed"
    }
  }
  else if [msg1] =~ "»" {
    grok {
      match => {
        "msg1" => "%{GREEDYDATA:object}\\s+#%{DATA:act}$"
      }
      overwrite => ["act", "object"]
      on_error => "grok_object_arrow_failed"
    }
    if ![grok_object_arrow_failed] {
      mutate {
        replace => {
          "act" => "#%{act}"
        }
      }
    }
  }
  else {
    grok {
      match => {
        "msg1" => [
          "%{DATA:act}\\s+%{GREEDYDATA:object}$"
          "%{DATA:act}$"
        ]
      }
      overwrite => ["act", "object"]
      on_error => "error_grok_action"
    }
  }
  grok {
    match => {
      "object" => [
        "(?P<parent>.*)/%{GREEDYDATA:object_id}"
      ]
    }
    overwrite => ["object_id", "parent"]
    on_error => "error_grok_action2"
  }
  ## 'OBJECT'
  if [object] != "" {
    mutate {
      replace => {
        "target.asset.product_object_id" => "%{object}"
      }
      on_error => "product_object_id_replace_failed"
    }
  }
  # Field 'USER'
  if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
      }
      on_error => "principal_user_replace_failed"
    }
  }

  # Field 'IP'
  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "error_src_ip"
    }
  }

  # Temporal solution for the outliers that did not come in the document
  if [msg2] != "" {
    mutate {
      gsub => ["msg2" , "\\*" , ""]
    }
    grok {
      match => {
        "msg2" => [
          "completed:\\s+%{WORD:act}$",
          ".*\\/%{DATA}\\/%{DATA:plugin}\\/( %{DATA:desc}|%{DATA:desc})\\/%{DATA:action} %{DATA} %{DATA:userid} %{DATA} %{IP:ip}",
          "%{DATA}\\/%{DATA:plugin}\\/( %{DATA:desc}|%{DATA:desc})\\/%{DATA:action} %{DATA} %{DATA:userid} %{DATA} %{IP:ip}",
          "%{GREEDYDATA:desc}"
        ]
      }
      overwrite => ["act" , "desc", "userid", "ip" , "action" , "plugin"]
      on_error => "grok_msg2_failed"
    }

    if [userid] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{userid}"
          "has_principal" => "true"
        }
        on_error => "error_userid"
      }
    }

    if [ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "ip"
          "principal.asset.ip" => "ip"
        }
        on_error => "error_ip"
      }
    }

    if [action] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action}"
        }
        on_error => "action_details_replace_failed"
      }
    }

    if [action] in ["doUninstall", "uninstall"] {
      mutate {
        replace => {
          "object_id_label.value" => "%{plugin}"
          "object_id_label.key" => "Plugin Name"
        }
        on_error => "object_id_label_replace_failed"
      }
      if not [object_id_label_replace_failed] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "object_id_label"
          }
          on_error => "object_id_label_merge_failed"
        }
      }
    }

    if [desc] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{desc}"
        }
        on_error => "description_desc_replace_failed"
      }
    }
    else {
      mutate {
        replace => {
          "metadata.description" => "%{msg2}"
        }
        on_error => "description_msg2_replace_failed"
      }
    }
  }

  ## 'ACTION'
  mutate {
    replace => {
      "action" => "%{act}"
    }
    on_error => "error_action_create"
  }
  if ![error_action_create] and [action] != "" {
    grok {
      match => {
        "action" => "\\s%{GREEDYDATA:action}"
      }
      overwrite => ["action"]
      on_error => "action_grok_failed"
    }
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "action_details_grok_replace_failed"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ"]
      target => "metadata.event_timestamp"
      on_error => "invalid_format_of_timestamp"
    }
  }
  if [receiveTimestamp] != "" {
    date {
      match => ["receiveTimestamp", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ"]
      target => "metadata.collected_timestamp"
      on_error => "invalid_format_of_receiveTimestamp"
    }
  }
  if [insertId] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{insertId}"
      }
      on_error => "error_insertId"
    }
  }
  if [severity] =~ "(?i)Low" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  } else if [severity] =~ "(?i)Info" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  } else if [severity] =~ "(?i)Medium" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  } else if [severity] =~ "(?i)Critical" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  } else if [severity] =~ "(?i)High" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  } else if [severity] =~ "(?i)ERROR" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }
  if [logName] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{logName}"
      }
      on_error => "error_logName"
    }
  }
  mutate {
    replace => {
      "resource_labels_location" => "%{resource.labels.location}"
    }
    on_error => "error_resource_labels_location"
  }
  if [resource_labels_location] != "" {
    mutate {
      replace => {
        "target.location.name" => "%{resource_labels_location}"
      }
      on_error => "error_location"
    }
  }
  grok {
    match => {
      "textPayload" => [
        "%{TIMESTAMP_ISO8601} - %{WORD} - '%{DATA:jobname}' \\(class %{DATA:job_class}\\) used credentials '%{DATA:credential_name}' \\(class %{DATA:credential_type}\\)\\.",
        "%{TIMESTAMP_ISO8601:time_stamp}\\s+\\[id=%{INT:thread_id}\\]\\t+%{DATA:loglevel}\\t%{DATA:logger}:\\s+Accepted\\s+%{NOTSPACE:connection_protocol}\\s+connection\\s+#%{INT:connection_id}\\s+from\\s+/%{IP:client_ip}:%{INT:client_port}",
        "%{TIMESTAMP_ISO8601:time_stamp} - %{WORD:audit_type} - %{DATA:jobname} #%{INT:build_number}\\s+%{DATA:trigger} with parameters: %{DATA:params_short}, Parameters:\\[recipients: \\{%{DATA:recipients}\\}, %{WORD}: \\{%{DATA}\\}\\]"
      ]
    }
    overwrite => ["jobname", "job_class", "credential_name", "credential_type", "thread_id", "loglevel", "logger", "connection_protocol", "connection_id", "client_ip", "client_port", "time_stamp", "audit_type", "build_number", "trigger", "params_short", "recipients"]
    on_error => "error_grok_textPayload"
  }
  if [timestamp] == "" and [time_stamp] != "" {
    date {
      match => ["time_stamp", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ", "yyyy-MM-dd HH:mm:ss.SSSZ", "yyyy-MM-dd HH:mm:ss:SSS"]
      target => "metadata.event_timestamp"
      on_error => "invalid_format_of_time_stamp"
    }
  }
  if [audit_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{audit_type}"
      }
      on_error => "error_audit_type"
    }
  }
  if [recipients] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{recipients}"
      }
      on_error => "error_recipients"
    }
  }
  if [client_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "client_ip"
        "principal.asset.ip" => "client_ip"
      }
      on_error => "error_client_ip"
    }
    if ![error_client_ip] {
      mutate {
        replace => {
          "has_principal_ip" => "true"
        }
        on_error => "error_has_principal"
      }
    }
  }
  if [client_port] != "" {
    mutate {
      convert => {
        "client_port" => "string"
      }
      on_error => "client_port_conversion_error"
    }
    mutate {
      replace => {
        "principal.port" => "%{client_port}"
      }
      on_error => "client_port_replace_failed"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "client_port_integer_conversion_error"
    }
  }
  if [connection_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{connection_id}"
      }
      on_error => "connection_id_replace_failed"
    }
  }
  if [logger] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{logger}"
      }
      on_error => "logger_replace_failed"
    }
  }
  if [jobname] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{jobname}"
      }
      on_error => "error_jobname"
    }
  }
  if [credential_name] != "" {
    mutate {
      replace  => {
        "credential_name_label.value" => "%{credential_name}"
        "credential_name_label.key" => "git_credentials"
      }
      on_error => "error_credential_name_label"
    }
    if ![error_credential_name_label] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "credential_name_label"
        }
        on_error => "error_credential_name_merge"
      }
    }
  }
  mutate {
    replace => {
      "resource_labels_project_id" => "%{resource.labels.project_id}"
    }
    on_error => "error_project_id_replace"
  }
  if [resource_labels_project_id] != "" {
    mutate {
      replace => {
        "resource_ancestors_temp.name" => "%{resource_labels_project_id}"
      }
      on_error => "error_project_id_temp"
    }
    if ![error_project_id_temp] {
      mutate {
        merge => {
          "target.resource_ancestors" => "resource_ancestors_temp"
        }
        on_error => "error_resource_ancestors"
      }
    }
  }
  mutate {
    replace => {
      "resource_labels_namespace_name" => "%{resource.labels.namespace_name}"
    }
    on_error => "error_namespace_name_replace"
  }
  if [resource_labels_namespace_name] != "" {
    mutate {
      replace => {
        "target.namespace" => "%{resource_labels_namespace_name}"
      }
      on_error => "error_namespace_target"
    }
  }
  mutate {
    replace => {
      "resource_labels_container_name" => "%{resource.labels.container_name}"
    }
    on_error => "error_container_name_replace"
  }
  if [resource_labels_container_name] != "" {
    mutate {
      replace => {
        "target.application" => "%{resource_labels_container_name}"
      }
      on_error => "error_container_target"
    }
  }
  mutate {
    rename => {
      "credential_type" => "addition.credential_type"
      "job_class" => "addition.job_class"
      "resource.labels.cluster_name" => "addition.cluster_name"
      "resource.labels.pod_name" => "addition.pod_name"
      "labels.compute.googleapis.com/resource_name" => "addition.compute_googleapis_com_resource_name"
      "resource.type" => "addition.resource_type"
      "textPayload" => "addition.textPayload"
      "labels.k8s-pod/app" => "addition.k8s-pod/app"
      "labels.k8s-pod/jenkins-cr" => "addition.k8s-pod/jenkins-cr"
      "thread_id" => "addition.thread_id"
      "loglevel" => "addition.loglevel"
      "connection_protocol" => "addition.connection_protocol"
      "labels.k8s-pod/topology_kubernetes_io/region" => "addition.k8s-pod/topology_kubernetes_io/region"
      "labels.k8s-pod/topology_kubernetes_io/zone" => "addition.k8s-pod/topology_kubernetes_io/zone"
      "build_number" => "addition.build_number"
      "trigger" => "addition.trigger"
      "time_stamp" => "addition.time_stamp"
      "params_short" => "addition.params_short"
    }
  }

  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "value_expansion_failed"
    }
    if ![value_expansion_failed] and [_check] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
      }
      if [key] == "textPayload" {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "detection_fields_replace_failed"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "_field"
          }
          on_error => "detection_fields_merge_failed"
        }
      }
      else if [key] in ["credential_type", "job_class", "cluster_name","k8s-pod/topology_kubernetes_io/region","k8s-pod/topology_kubernetes_io/zone","build_number"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "target_resource_attribute_value_replace_failed"
        }
        mutate {
          merge => {
            "target.resource.attribute.labels" => "_field"
          }
          on_error => "labels_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "addition_value_replace_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "additional_fields_merge_failed"
        }
      }
    }
  }
  if [user] != "" or [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type"   => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [src_ip] != "" {
    mutate {
      replace => {
        "metadata.event_type"   => "STATUS_UNCATEGORIZED"
      }
    }
  } else if [has_principal_ip] == "true" {
    mutate {
      replace => {
        "metadata.event_type"   => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type"   => "GENERIC_EVENT"
      }
    }
  }
  # General Metadata descripion
  mutate {
    replace => {
      "metadata.vendor_name"  => "Jenkins"
      "metadata.product_name" => "Jenkins"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  # OUTPUT
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
