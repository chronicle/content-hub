# Product: AZION
# Category: Firewall
# Supported Format: JSON
# Reference: https://www.azion.com/en/documentation/products/edge-firewall/web-application-firewall/
# Last Updated: 2023-09-30
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "intermediary" => ""
      "event_type" => ""
      "sec_action" => ""
      "has_principal_machine" => "false"
      "has_target_machine" => "false"
      "dvc_ip" => ""
      "dvc_port" => ""
      "time" => ""
      "host" => ""
      "request_method" => ""
      "status" => ""
      "request_uri" => ""
      "upstream_status" => ""
      "upstream_addr" => ""
      "http_user_agent" => ""
      "http_referer" => ""
      "server_port" => ""
      "server_addr" => ""
      "remote_addr" => ""
      "remote_port" => ""
      "waf_attack_family" => ""
      "waf_attack_action" => ""
      "waf_learning" => ""
      "waf_block" => ""
      "waf_total_processed" => ""
      "waf_total_blocked" => ""
      "waf_score" => ""
      "waf_match" => ""
      "waf_headers" => ""
      "country" => ""
      "state" => ""
      "asn" => ""
      "ssl_protocol" => ""
      "ssl_cipher" => ""
      "ssl_server_name" => ""
      "requestPath" => ""
      "waf_server" => ""
      "waf_uri" => ""
      "blocked" => ""
      "waf_args" => ""
      "request_time" => ""
      "bytes_sent" => ""
    }
  }

  json {
    source     => "message"
    array_function => "split_columns"
    on_error     => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [time] != "" {
    date {
      match => ["time", "yyyy-MM-ddTHH:mm:ssZZ", "ISO8601"]
      on_error => "invalid_date_format"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "has_principal_machine" => "true"
      }
      on_error => "no_host"
    }
  }

  if [request_method] != "" {
    mutate {
      uppercase => ["request_method"]
    }
    mutate {
      replace => {
        "network.http.method" => "%{request_method}"
      }
      on_error => "no_request_method"
    }
  }

  if [status] != "" {
    mutate {
      convert => {
        "status" => "integer"
      }
      on_error => "convert_failed"
    }
    mutate {
      rename => {
        "status" => "network.http.response_code"
      }
    }
  }

  if [request_uri] != "" {
    mutate {
      replace => {
        "target.url" => "%{request_uri}"
      }
      on_error => "no_request_uri"
    }
  }
  else if [requestPath] != "" {
    mutate {
      replace => {
        "target.url" => "%{requestPath}"
      }
      on_error => "no_requestPath"
    }
  }

  if [upstream_addr] not in ["", "-"] {
    grok {
      match => {
        "upstream_addr" => "%{IP:dvc_ip}:%{INT:dvc_port}"
      }
      on_error => "grok_failed"
      overwrite => ["dvc_ip", "dvc_port"]
    }
    if [dvc_ip] != "" {
      mutate {
        merge => {
          "intermediary.ip" => "dvc_ip"
        }
        on_error => "no_ip"
      }
    }
    if [dvc_port] != "" {
      mutate {
        convert => {
          "dvc_port" => "integer"
        }
        on_error => "convert_failed"
      }
      mutate {
        rename => {
          "dvc_port" => "intermediary.port"
        }
      }
    }
  }

  if [upstream_status] not in ["", "-"] {
    mutate {
      replace => {
        "upstream_status_label.key" => "upstream_status"
        "upstream_status_label.value.string_value" => "%{upstream_status}"
      }
    }
    mutate {
      merge => {
        "additional.fields" => "upstream_status_label"
      }
      on_error => "no_upstream_status"
    }
  }

  if [http_user_agent] not in ["", "-"] {
    mutate {
      replace => {
        "network.http.user_agent" => "%{http_user_agent}"
      }
      on_error => "no_http_user_agent"
    }
    mutate {
      convert => {
        "http_user_agent" => "parseduseragent"
      }
      on_error => "convert_failed"
    }
    mutate {
      rename => {
        "http_user_agent" => "network.http.parsed_user_agent"
      }
    }
  }

  if [http_referer] not in ["", "-"] {
    mutate {
      replace => {
        "network.http.referral_url" => "%{http_referer}"
      }
      on_error => "no_http_referer"
    }
  }

  if [server_addr] != "" {
    mutate {
      merge => {
        "target.ip" => "server_addr"
      }
      replace => {
        "has_target_machine" => "true"
      }
      on_error => "no_server_addr"
    }
  }

  if [server_port] != "" {
    mutate {
      convert => {
        "server_port" => "integer"
      }
      on_error => "convert_failed"
    }
    mutate {
      rename => {
        "server_port" => "target.port"
      }
    }
  }

  if [remote_addr] != "" {
    mutate {
      merge => {
        "principal.ip" => "remote_addr"
      }
      replace => {
        "has_principal_machine" => "true"
      }
      on_error => "no_remote_addr"
    }
  }

  if [remote_port] != "" {
    mutate {
      convert => {
        "remote_port" => "integer"
      }
      on_error => "convert_failed"
    }
    mutate {
      rename => {
        "remote_port" => "principal.port"
      }
    }
  }

  if [country] not in ["", "-"] {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{country}"
      }
      on_error => "no_country"
    }
  }

  if [state] not in ["", "-"] {
    mutate {
      replace => {
        "principal.location.state" => "%{state}"
      }
      on_error => "no_state"
    }
  }

  if [asn] not in ["", "-"] {
    mutate {
      replace => {
        "network.asn" => "%{asn}"
      }
      on_error => "no_asn"
    }
  }

  if [ssl_cipher] not in ["", "-"] {
    mutate {
      replace => {
        "network.tls.cipher" => "%{ssl_cipher}"
      }
      on_error => "no_ssl_cipher"
    }
  }

  if [ssl_protocol] not in ["", "-"] {
    mutate {
      replace => {
        "network.tls.version_protocol" => "%{ssl_protocol}"
      }
      on_error => "no_ssl_protocol"
    }
  }

  if [ssl_server_name] not in ["", "-"] {
    mutate {
      replace => {
        "network.tls.client.server_name" => "%{ssl_server_name}"
      }
      on_error => "no_ssl_server_name"
    }
  }

  if [bytes_sent] != "" and [bytes_sent] > 0 {
    mutate {
      convert => {
        "bytes_sent" => "uinteger"
      }
      on_error => "convert_failed"
    }
    mutate {
      rename => {
        "bytes_sent" => "network.sent_bytes"
      }
    }
  }

  if [request_time] not in ["", "-"] {
    mutate {
      replace => {
        "request_time_label.key" => "request_time"
        "request_time_label.value.string_value" => "%{request_time}"
      }
    }
    mutate {
      merge => {
        "additional.fields" => "request_time_label"
      }
      on_error => "no_request_time"
    }
  }

  if [waf_attack_family] not in ["", "-"] {
    mutate {
      replace => {
        "waf_attack_family_label.key" => "waf_attack_family"
        "waf_attack_family_label.value" => "%{waf_attack_family}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_attack_family_label"
      }
      on_error => "no_waf_attack_family"
    }
  }

  if [waf_attack_action] not in ["", "-"] {
    mutate {
      replace => {
        "waf_attack_action_label.key" => "waf_attack_action"
        "waf_attack_action_label.value" => "%{waf_attack_action}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_attack_action_label"
      }
      on_error => "no_waf_attack_action"
    }
  }

  if [waf_learning] not in ["", "-"] {
    mutate {
      replace => {
        "waf_learning_label.key" => "waf_learning"
        "waf_learning_label.value" => "%{waf_learning}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_learning_label"
      }
      on_error => "no_waf_learning"
    }
  }

  if [waf_total_processed] not in ["", "-"] {
    mutate {
      replace => {
        "waf_total_processed_label.key" => "waf_total_processed"
        "waf_total_processed_label.value" => "%{waf_total_processed}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_total_processed_label"
      }
      on_error => "no_waf_total_processed"
    }
  }

  if [waf_total_blocked] not in ["", "-"] {
    mutate {
      replace => {
        "waf_total_blocked_label.key" => "waf_total_blocked"
        "waf_total_blocked_label.value" => "%{waf_total_blocked}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_total_blocked_label"
      }
      on_error => "no_waf_total_blocked"
    }
  }

  if [waf_score] not in ["", "-"] {
    mutate {
      replace => {
        "waf_score_label.key" => "waf_score"
        "waf_score_label.value" => "%{waf_score}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_score_label"
      }
      on_error => "no_waf_score"
    }
  }

  if [waf_match] not in ["", "-"] {
    mutate {
      replace => {
        "waf_match_label.key" => "waf_match"
        "waf_match_label.value" => "%{waf_match}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_match_label"
      }
      on_error => "no_waf_match"
    }
  }

  if [waf_headers] not in ["", "-"] {
    mutate {
      replace => {
        "waf_headers_label.key" => "waf_headers"
        "waf_headers_label.value" => "%{waf_headers}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_headers_label"
      }
      on_error => "no_waf_headers"
    }
  }

  if [waf_server] not in ["", "-"] {
    mutate {
      replace => {
        "waf_server_label.key" => "waf_server"
        "waf_server_label.value" => "%{waf_server}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_server_label"
      }
      on_error => "no_waf_server"
    }
  }

  if [waf_uri] not in ["", "-"] {
    mutate {
      replace => {
        "waf_uri_label.key" => "waf_uri"
        "waf_uri_label.value" => "%{waf_uri}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_uri_label"
      }
      on_error => "no_waf_uri"
    }
  }

  if [waf_args] not in ["", "-"] {
    mutate {
      replace => {
        "waf_args_label.key" => "waf_args"
        "waf_args_label.value" => "%{waf_args}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "waf_args_label"
      }
      on_error => "no_waf_args"
    }
  }

  if [waf_block] != "" {
    if [waf_block] == "1" {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }
    else {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    }
  }
  else if [blocked] != "" {
    if [blocked] == "1" {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }
    else {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    }
  }

  if [sec_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sec_action"
      }
      on_error => "no_sec_action"
    }
  }

  if [has_principal_machine] == "true" and [has_target_machine] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal_machine] == "true" {
    mutate {
      replace => {
        "event_type" => "SCAN_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "no_event_type"
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "AZION"
      "metadata.vendor_name" => "AZION"
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

