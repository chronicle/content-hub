        if ![u_non_standard_encryption_empty] {
          mutate {
            replace => {
              "u_non_standard_encryption_label.key" => "u_non_standard_encryption"
            }
            on_error => "u_non_standard_encryption_key_empty"
          }
          mutate {
            merge => {
              "event.idm.entity.entity.labels" => "u_non_standard_encryption_label"
            }
            on_error => "u_non_standard_encryption_label_empty"
          }
        }
      }

      if [category] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.category" => "%{category}"
          }
          on_error => "category_not_set"
        }
      }
      mutate {
        replace => {
          "event.idm.entity.metadata.product_entity_id" => "%{sys_id}"
        }
        on_error => "sys_id_not_set"
      }
      mutate {
        replace => {
          "event.idm.entity.entity.asset.product_object_id" => "%{sys_id}"
        }
        on_error => "product_id_not_set"
      }
      if [category] =~ "(End User Asset|Hardware|Physical Server|Printer|Workstation|Storage)" {
        mutate {
          replace => {
            "_relation.entity_type" => "USER"
          }
          on_error => "relation_entity_type_not_set"
        }
      }
      else {
        mutate {
          replace => {
            "_relation.entity_type" => "UNKNOWN_ENTITYTYPE"
          }
          on_error => "relation_entity_type_not_set"
        }
      }
      if [IP_Address] != "" {
        mutate {
          replace => {
            "ip_address" => "%{IP_Address}"
          }
          on_error => "ip_address_not_set"
        }
      }
      mutate {
        replace => {
          "_ip" => "%{ip_address}"
        }
        on_error => "ip_address_not_set"
      }
      grok {
        match => {
          "ip_address" => ["%{IP:_u_cylance_agent_version}"]
        }
        overwrite => ["_u_cylance_agent_version", "_u_sccm_agent_version", "_lan1", "_lan2"]
        on_error => "no_data_ip_addr"
      }
      mutate {
        merge => {
          "event.idm.entity.entity.asset.ip" => "_ip"
        }
        on_error => "no_ip"
      }
      if [MAC_Addresses] != "" {
        mutate {
          replace => {
            "mac_address" => "%{MAC_Addresses}"
          }
          on_error => "mac_address_not_set"
        }
      }
      if [mac_address] != "" {
        mutate {
          lowercase => ["mac_address"]
        }
        # Fix non valid MAC Addresses
        mutate {
          gsub => ["mac_address", "-", ":"]
        }
        mutate {
          gsub => ["mac_address", "\\.", ":"]
        }
        mutate {
          replace => {
            "_mac" => "%{mac_address}"
          }
          on_error => "mac_address_not_set"
        }
        mutate {
          merge => {
            "event.idm.entity.entity.asset.mac" => "_mac"
          }
          on_error => "no_mac"
        }
      }
      if [u_cylance_mac] != "" {
        mutate {
          merge => {
            "event.idm.entity.entity.asset.mac" => "u_cylance_mac"
          }
          on_error => "no_cylance_mac"
        }
      }
      if [sys_created_by] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.network_domain" => "%{sys_created_by}"
          }
          on_error => "no_sys_created_by"
        }
      }
      if [manufacturer] != "" {
        mutate {
          replace => {
            "_hardware.manufacturer" => "%{manufacturer.value}"
          }
          on_error => "value_not_set"
        }
      }
      mutate {
        gsub => ["ram", ',', '']
      }
      if [ram] != "" {
       mutate {
          convert => {
            "ram" => "string"
          }
          on_error => "ram_is_not_string"
        }
        mutate {
          replace => {
            "_hardware.ram" => "%{ram}"
          }
          on_error => "ram_not_set"
        }
        mutate {
          convert => {
            "_hardware.ram" => "uinteger"
          }
          on_error => "ram_is_not_integer"
        }
      }
      mutate {
        gsub => ["cpu_speed", ',', '']
      }
      if [cpu_speed] != "" {
        mutate {
          replace => {
            "_hardware.cpu_clock_speed" => "%{cpu_speed}"
          }
          on_error => "cpu_speed_not_set"
        }
        mutate {
          convert => {
            "_hardware.cpu_clock_speed" => "uinteger"
          }
          on_error => "cpu_speed_is_not_integer"
        }
      }
      mutate {
        gsub => ["cpu_core_count", ',', '']
      }
      if [cpu_core_count] != "" {
        mutate {
          replace => {
            "_hardware.cpu_number_cores" => "%{cpu_core_count}"
          }
          on_error => "cpu_core_count_not_set"
        }
        mutate {
          convert => {
            "_hardware.cpu_number_cores" => "uinteger"
          }
          on_error => "cpu_number_cores_is_not_integer"
        }
      }
      mutate {
        replace => {
          "_hardware.serial_number" => "%{serial_number}"
        }
        on_error => "serial_number_not_set"
      }
      mutate {
        replace => {
          "_hardware.cpu_platform" => "%{cpu_type}"
        }
        on_error => "cpu_type_not_set"
      }
      mutate {
        replace => {
          "_hardware.cpu_model" => "%{cpu_name}"
        }
        on_error => "cpu_name_not_set"
      }
      mutate {
        merge => {
          "event.idm.entity.entity.asset.hardware" => "_hardware"
        }
        on_error => "hardware_details_not_present"
      }

      # ASSET OPERATIONAL SYSTEM HANDLING
      if [os_version] != "" and [os_version] != "-" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.platform_software.platform_patch_level" => "%{os_version}"
          }
          on_error => "no_os_version"
        }
      }
      if [os_service_pack] != "" and [os_service_pack] !~ "No .*? found" and [os_version] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.platform_software.platform_patch_level" => "%{os_service_pack} (%{event.idm.entity.entity.asset.platform_software.platform_patch_level})"
          }
          on_error => "no_software_platform_patch_level"
        }
      }
      if [u_cylance_os] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.platform_software.platform_version" => "%{u_cylance_os}"
          }
          on_error => "no_cylance_os"
        }
      }

      if [asset_tag] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.asset_id" => "%{asset_tag}"
          }
          on_error => "no_asset_tag"
        }
      }
      if [u_display_value] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.asset_id" => "%{u_display_value}"
          }
          on_error => "no_asset_id"
        }
      }
      if [u_area] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.asset.location.name" => "%{u_area}"
          }
          on_error => "no_area"
        }
      }

      if [discovery_source] != "" {
        mutate {
          replace => {
            "_asset_software.name" => "%{discovery_source}"
          }
          on_error => "no_discovery_source"
        }
        mutate {
          merge => {
            "event.idm.entity.entity.asset.software" => "_asset_software"
          }
          on_error => "no_asset_software"
        }
      }
      if [name] != "" {
        mutate {
          replace => {
            "software.name" => "%{name}"
          }
          on_error => "no_software_name"
        }
        mutate {
          merge => {
            "event.idm.entity.entity.asset.software" => "software"
          }
          on_error => "no_software"
        }
      }
      if [cpu_manufacturer] != "" {
        mutate {
          replace => {
            "hardware.manufacturer" => "%{cpu_manufacturer}"
          }
          on_error => "no_cpu_manufacturer"
        }
      }
      mutate {
        merge => {
          "event.idm.entity.entity.asset.hardware" => "hardware"
        }
        on_error => "hardware_is_empty"
      }
      grok {
        match => {
          "u_ci_owner1" => [
          "(?P<userid>.*?),.+"
          "(?P<userid>.*)"
          ]
        }
        overwrite => ["userid"]
        on_error => "no_userid"
      }
      if [no_userid] and [sys_updated_by] != "" {
        mutate {
          replace => {
            "userid" => "%{sys_updated_by}"
          }
          on_error => "no_userid"
        }
      } else if [no_userid] and [sys_created_by] != "" {
        mutate {
          replace => {
            "userid" => "%{sys_created_by}"
          }
          on_error => "no_userid"
        }
      }
      if [userid] =~ ".*?@.+" {
        mutate {
          merge => {
            "_relation.entity.user.email_addresses" => "userid"
          }
          on_error => "no_userid"
        }
      }
      if [userid] != "" {
        mutate {
          replace => {
            "_relation.entity.user.userid" => "%{userid}"
            "event.idm.entity.metadata.entity_type" => "ASSET"
            "_relation.entity_type" => "USER"
            "entity_set" => "true"
          }
          on_error => "no_userid"
        }
      }
      if [client_name] == "" and [host_name] == "" and [mac_address] == "" and [name] == "" {
        if [userid] =~ ".*?@.+" {
          mutate {
            merge => {
              "event.idm.entity.entity.user.email_addresses" => "userid"
            }
            on_error => "no_userid"
          }
        }
        if [userid] != "" {
          mutate {
            replace => {
              "event.idm.entity.entity.user.userid" => "%{userid}"
              "event.idm.entity.metadata.entity_type" => "USER"
              "_relation.entity_type" => "ASSET"
              "entity_set" => "true"
            }
            on_error => "no_userid"
          }
        }
      }
      if [sys_id] != "" {
        mutate {
          replace => {
            "_relation.entity.user.product_object_id" => "%{sys_id}"
            "entity_set" => "true"
          }
          on_error => "no_sys_id"
        }
      }
      if [location] != "" {
        mutate {
          replace => {
            "event.idm.entity.entity.location.name" => "%{location}"
          }
          on_error => "location_name_error"
        }
      }

      if [_relation] != "" {
        mutate {
          replace => {
            "_relation.relationship" => "OWNS"
          }
          on_error => "relation_relationship_error"
        }
        mutate {
          merge => {
            "event.idm.entity.relations" => "_relation"
          }
          on_error => "relation_error"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_name" => "Configuration Management Database (CMDB)"
          "event.idm.read_only_udm.metadata.vendor_name" => "ServiceNow"
        }
        on_error => "product_name_error"
      }
    }
  }

  if [entity_set] == "true" and [sys_id] == ""  {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
