# Product: AWS_VPN
# Category: VPN
# Supported Format: JSON
# Reference: NA
# Last Updated: 2024-07-19
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "connection-log-type" => ""
      "connection-attempt-status" => ""
      "connection-attempt-failure-reason" => ""
      "connection-id" => ""
      "client-vpn-endpoint-id" => ""
      "transport-protocol" => ""
      "connection-start-time" => ""
      "connection-last-update-time" => ""
      "client-ip" => ""
      "username" => ""
      "device-type" => ""
      "device-ip" => ""
      "port" => ""
      "ingress-bytes" => ""
      "egress-bytes" => ""
      "ingress-packets" => ""
      "egress-packets" => ""
      "connection-end-time" => ""
      "connection-reset-status" => ""
      "connection-duration-seconds" => ""
      "has_principal" => ""
      "has_target" => ""
      "has_user" => ""
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "network" => ""
      "security_result" => ""
      "security_result_action" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }
  if [json_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [connection-log-type] not in ["NA",""] {
    mutate {
      replace => {
        "connection-log-type_label.key" => "connection-log-type"
        "connection-log-type_label.value.string_value" => "%{connection-log-type}"
      }
      on_error => "no_connection_log_type"
    }
    if ![no_connection_log_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection-log-type_label"
        }
        on_error => "connection_log_type_label_merge_failed"
      }
    }
  }
  if [connection-attempt-status] not in ["NA",""] {
    if [connection-attempt-status] =~ "(?i)successful" {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
      }
    }
    else if [connection-attempt-status] =~ "(?i)failed" {
      mutate {
        replace => {
          "security_result_action" => "BLOCK"
        }
      }
    }
    else if [connection-attempt-status] =~ "(?i)waiting-for-assertion" {
      mutate {
        replace => {
          "security_result_action" => "QUARANTINE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.action_details" => "%{connection-attempt-status}"
        }
        on_error => "no_connection_attempt_status"
      }
    }
  }
  if [security_result_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
      }
    }
  if [connection-attempt-failure-reason] not in ["NA",""] {
    mutate {
      replace => {
        "connection-attempt-failure_label.key" => "connection-attempt-failure-reason"
        "connection-attempt-failure_label.value.string_value" => "%{connection-attempt-failure-reason}"
      }
      on_error => "no_connection_attempt_failure"
    }
    if ![no_connection_attempt_failure] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection-attempt-failure_label"
        }
        on_error => "connection_attempt_failure_label_merge_failed"
      }
    }
  }
  if [connection-reset-status] not in ["NA",""] {
    mutate {
      replace => {
        "connection-reset_label.key" => "connection-reset-status"
        "connection-reset_label.value.string_value" => "%{connection-reset-status}"
      }
      on_error => "no_connection_reset_status"
    }
    if ![no_connection_reset_status] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection-reset_label"
        }
        on_error => "connection_reset_label_merge_failed"
      }
    }
  }
  if [connection-id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{connection-id}"
      }
      on_error => "no_connection_id"
    }
  }
  if [client-vpn-endpoint-id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{client-vpn-endpoint-id}"
      }
      on_error => "no_client_vpn_endpoint_id"
    }
    if ![no_client_vpn_endpoint_id] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }
  if [transport-protocol] != "" {
    mutate {
      uppercase => ["transport-protocol"]
    }
    mutate {
      replace => {
        "network.ip_protocol" => "%{transport-protocol}"
      }
      on_error => "no_transport_protocol"
    }
  }
  if [client-ip] not in ["NA",""] {
    mutate {
      merge => {
        "target.ip" => "client-ip"
        "target.asset.ip" => "client-ip"
      }
      on_error => "no_client_ip"
    }
    if ![no_client_ip] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [device-ip] not in ["NA",""] {
    mutate {
      merge => {
        "principal.ip" => "device-ip"
        "principal.asset.ip" => "device-ip"
      }
      on_error => "no_device_ip"
    }
    if ![no_device_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [device-type] != "" {
    mutate {
      replace => {
        "device_type_label.key" => "device-type"
        "device_type_label.value" => "%{device-type}"
      }
      on_error => "no_device_type"
    }
    if ![no_device_type] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "device_type_label"
        }
        on_error => "device_type_label_merge_failed"
      }
    }
  }
  if [port] != "" {
    mutate {
      convert => {
        "port" => "integer"
      }
      on_error => "port_conversion_failed"
    }
    mutate {
      rename => {
        "port" => "principal.port"
      }
      on_error => "no_port"
    }
  }
  if [ingress-bytes] not in ["0",""] {
    mutate {
      convert => {
        "ingress-bytes" => "uinteger"
      }
      on_error => "ingress_bytes_conversion_failed"
    }
    mutate {
      rename => {
        "ingress-bytes" => "network.received_bytes"
      }
      on_error => "no_received_bytes"
    }
  }
  if [egress-bytes] not in ["0",""] {
    mutate {
      convert => {
        "egress-bytes" => "uinteger"
      }
      on_error => "egress_bytes_conversion_failed"
    }
    mutate {
      rename => {
        "egress-bytes" => "network.sent_bytes"
      }
      on_error => "no_sent_bytes"
    }
  }
  if [ingress-packets] not in ["0",""] {
    mutate {
      convert => {
        "ingress-packets" => "integer"
      }
      on_error => "ingress_packets_conversion_failed"
    }
    mutate {
      rename => {
        "ingress-packets" => "network.received_packets"
      }
      on_error => "no_received_packets"
    }
  }
  if [egress-packets] not in ["0",""] {
    mutate {
      convert => {
        "egress-packets" => "integer"
      }
      on_error => "egress_packets_conversion_failed"
    }
    mutate {
      rename => {
        "egress-packets" => "network.sent_packets"
      }
      on_error => "no_sent_packets"
    }
  }
  if [username] not in ["N/A",""] {
    mutate {
      replace => {
        "target.user.user_display_name" => "%{username}"
      }
      on_error => "no_username"
    }
  }
  if [connection-duration-seconds] not in ["0","","NA"] {
    mutate {
      convert => {
        "connection-duration-seconds" => "integer"
      }
      on_error => "connection_duration_seconds_conversion_failed"
    }
    mutate {
      rename => {
        "connection-duration-seconds" => "network.session_duration.seconds"
      }
      on_error => "no_session_duration"
    }
  }
  if [connection-start-time] != "" {
    mutate {
      replace => {
        "connection-start-time_label.key" => "connection-start-time"
        "connection-start-time_label.value.string_value" => "%{connection-start-time}"
      }
      on_error => "no_connection_start_time"
    }
    if ![no_connection_start_time] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection-start-time_label"
        }
        on_error => "connection_start_time_label_merge_failed"
      }
    }
  }
  if [connection-last-update-time] != "" {
    mutate {
      replace => {
        "connection-last-update-time_label.key" => "connection-last-update-time"
        "connection-last-update-time_label.value.string_value" => "%{connection-last-update-time}"
      }
      on_error => "no_connection_last_update_time"
    }
    if ![no_connection_last_update_time] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection-last-update-time_label"
        }
        on_error => "connection_last_update_time_label_merge_failed"
      }
    }
  }
  if [connection-end-time] != "" {
    mutate {
      replace => {
        "connection-end-time_label.key" => "connection-end-time"
        "connection-end-time_label.value.string_value" => "%{connection-end-time}"
      }
      on_error => "no_connection_end_time"
    }
    if ![no_connection_end_time] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection-end-time_label"
        }
        on_error => "connection_end_time_label_merge_failed"
      }
    }
  }
  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
