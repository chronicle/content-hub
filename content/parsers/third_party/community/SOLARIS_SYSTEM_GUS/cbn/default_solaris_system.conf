# Product: Unix System
# Category: OS
# Supported Format: SYSLOG
# Reference: https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/6/html/security_guide/sec-audit_record_types
# Last Updated: 2025-12-10
# Copyright 2025 Google SecOps

# Additional notes:
# https://tools.ietf.org/html/rfc5424

filter {

  mutate {
    replace => {
      "timestamp"    => ""
      "timestamp_tz" => ""
      "dvc"           => ""
      "process"       => ""
      "pid"           => ""
      "prin_ip"       => ""
      "processId"     => ""
      "eventType"     => ""
      "srcPort"       => ""
      "srcIp"         => ""
      "dstPort"       => ""
      "dstIp"         => ""
      "command"       => ""
      "srcHostname"   => ""
      "outcome"       => ""
      "collected_ts"  => ""
      "level"         => ""
      "username"      => ""
      "targetIp"      => ""
      "targetPort"    => ""
      "uid"           => ""
      "session_id"    => ""
      "grp"           => ""
      "unit"          => ""
      "targetEmail"   => ""
      "relayHostname" => ""
      "targetHostname"=> ""
      "status"        => ""
      "proto"         => ""
      "protocol"      => ""
      "pwd"           => ""
      "cwd"           => ""
      "name"          => ""
      "home"          => ""
      "shell"         => ""
      "gid"           => ""
      "desc"          => ""
      "summary"       => ""
      "reason"        => ""
      "relayIp"       => ""
      "cipher"        => ""
      "pfs"           => ""
      "terminal"      => ""
      "srcUser"       => ""
      "action"        => ""
      "principal_ip"  => ""
      "principal_port"=> ""
      "url"           => ""
      "subProcess"    => ""
      "msg2"          => ""
      "targetEmailfrom"=> ""
      "method"        => ""
      "mechanism"     => ""
      "hostAdded"     => ""
      "targetUser"    => ""
      "header"        => ""
      "targetDisplayName" => ""
      "user" => ""
      "src_host" => ""
      "security_result_description" => ""
      "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      "msg1"  => ""
      "ts"  => ""
      "msg3" => ""
      "target_url" => ""
      "type" => ""
      "auid" => ""
      "op" => ""
      "algo" => ""
      "key_size" => ""
      "fp" => ""
      "acct_username" => ""
      "id" => ""
      "kv_data" => ""
      "class" => ""
      "nrcpts" => ""
      "msgid" => ""
      "daemon" => ""
      "from" => ""
      "msg5" => ""
      "msg6" => ""
      "msg7" => ""
      "queue_id" => ""
      "sev_det" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  # Disassemble in header and msg1
  grok {
    match => {
      "message" => [
        '(?P<header>.*(\\]|\\)|[a-zA-Z]| ): )%{GREEDYDATA:msg1}',
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} - %{DATA:desc},HOST=/%{IP:prin_ip}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{GREEDYDATA},HOST=/%{IP:prin_ip}",
        '<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA:msg3},HOST=/%{IP:prin_ip}',
        '%{DATA:msg3},HOST=/%{IP:prin_ip}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:relayHostname} %{DATA}: %{GREEDYDATA:desc}'
      ]
    }
    overwrite => ["header","msg1", "prin_ip","desc","ts", "msg3", "timestamp","relayHostname"]
    on_error => "principal_grok_error"
  }
  grok {
    match => {
      "message" => [
        '<%{INT}>%{SYSLOGTIMESTAMP} %{NOTSPACE} %{DATA:process}:\\s+\\[ID %{INT} %{DATA:sev_det}\\]'
      ]
    }
    overwrite => ["process", "sev_det"]
    on_error => "process_grok_error"
  }
  if [sev_det] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{sev_det}"
      }
      on_error => "sev_det_error"
    }
  }
  grok {
    match => {
      "message" => [
        'Destination \\(%{IP:dstIp}\\)'
      ]
    }
    overwrite => ["dstIp"]
    on_error => "dstIp_grok_error"
  }
  grok {
    match => {
      "message" => [
        'service port %{INT:dstPort}'
      ]
    }
    overwrite => ["dstPort"]
    on_error => "dstPort_grok_error"
  }
  if [ts] != "" {
    date {
      match => ["ts","MMM dd HH:mm:ss","MMM d HH:mm:ss"]
      rebase => true
      on_error => "ts_error"
    }
  }

  # header
  grok {
    match => {
      "header" => '<%{INT}>%{SYSLOGTIMESTAMP} %{NOTSPACE} %{DATA}\\[%{INT}\\]:\\s+%{DATA:msg5}: %{DATA:msg6}: %{DATA:msg7}:'
    }
    overwrite => ["msg5", "msg6", "msg7"]
    on_error => "header_msg_error"
  }
  if [msg5] != "" and ([msg6] != "" and [msg7] != "") and [msg1] =~ "Operation" {
    mutate {
      replace => {
        "msg1" => "%{msg5}: %{msg6}: %{msg7}: %{msg1}"
      }
      on_error => "msg5_msg6_msg7_error"
    }
  }
  grok {
    match => {
      "header" => ['%{SYSLOGTIMESTAMP:timestamp}']
    }
    overwrite => ["timestamp"]
    on_error => "timestamp_error"
  }
  grok { match => { "header" => ['%{TIMESTAMP_ISO8601:timestamp_tz}'] } overwrite => ["timestamp_tz"] on_error => "timestamp_tz_error" }
  grok { match => { "header" => ['.* (?P<process>[a-zA-Z-]+): '] } overwrite => ["process"] on_error => "process_error" }
  grok { match => { "header" => ['%{NOTSPACE:process}(\\[)'] } overwrite => ["process"] on_error => "process_error" }
  grok { match => { "header" => ['.*?\\[%{NUMBER:pid}\\]'] } overwrite => ["pid"] on_error => "pid_error" }
  grok { match => { "header" => ['.*?\\(%{INT:processId}\\)'] } overwrite => ["processId"] on_error => "processId_error" }
  grok { match => { "header" => ['auth.%{WORD:level}'] } overwrite => ["level"] on_error => "level_error" }
  grok { match => { "header" => ['%{HOSTNAME:dvc} : '] } overwrite => ["dvc"] on_error => "dvc_error" }
  grok { match => { "header" => ['%{SYSLOGTIMESTAMP:_} %{HOSTNAME:dvc} %{NOTSPACE}:'] } overwrite => ["dvc"] on_error => "dvc_error" }
  grok { match => { "header" => ['%{TIMESTAMP_ISO8601:_} %{HOSTNAME:dvc} %{NOTSPACE}:'] } overwrite => ["dvc"] on_error => "dvc_error" }
  grok {
    match => {
      "header" => "type=%{NOTSPACE:eventType}"
    }
    overwrite => ["eventType"]
    on_error => "no_type_in_header"
  }

  # msg1
  grok { match => { "msg1" => ['type=%{NOTSPACE:eventType}'] } overwrite => ["eventType"] on_error => "eventType_error" }
  grok { match => { "msg1" => ['auid=%{INT:auid}'] } overwrite => ["auid"] on_error => "auid_error" }
  grok { match => { "msg1" => ["'op=%{WORD:op}"] } overwrite => ["op"] on_error => "op_error" }
  grok { match => { "msg1" => ['algo=%{NOTSPACE:algo}'] } overwrite => ["algo"] on_error => "algo_error" }
  grok { match => { "msg1" => ['size=%{INT:key_size}'] } overwrite => ["key_size"] on_error => "size_error" }
  grok { match => { "msg1" => ['fp=%{NOTSPACE:fp}'] } overwrite => ["fp"] on_error => "fp_error" }
  grok { match => { "msg1" => ['auth.%{WORD:level}'] } overwrite => ["level"] on_error => "level_error" }
  grok { match => { "msg1" => ['rport=%{INT:targetPort}'] } overwrite => ["targetPort"] on_error => "targetPort_error" }
  grok { match => { "msg1" => ['laddr=%{IP:srcIp}'] } overwrite => ["srcIp"] on_error => "srcIp_error" }
  grok { match => { "msg1" => ['\\baddr\\b=%{IP:targetIp}'] } overwrite => ["targetIp"] on_error => "targetIp_error" }
  grok { match => { "msg1" => ['lport=%{INT:srcPort}'] } overwrite => ["srcPort"] on_error => "srcPort_error" }
  grok { match => { "msg1" => ['exe="%{DATA:command}"'] } overwrite => ["command"] on_error => "command_error" }
  grok { match => { "msg1" => ['COMMAND=%{NOTSPACE:command}'] } overwrite => ["command"] on_error => "COMMAND_error" }
  grok { match => { "msg1" => ['hostname=%{NOTSPACE:srcHostname}'] } overwrite => ["srcHostname"] on_error => "srcHostname_error" }
  grok { match => { "msg1" => ['res=%{WORD:outcome}'] } overwrite => ["outcome"] on_error => "outcome_error" }
  grok { match => { "msg1" => ['time="%{TIMESTAMP_ISO8601:collected_ts}"'] } overwrite => ["collected_ts"] on_error => "collected_ts_error" }
  grok { match => { "msg1" => ['level=%{WORD:level}'] } overwrite => ["level"] on_error => "level_error" }
  grok { match => { "msg1" => ['USER=%{WORD:username}'] } overwrite => ["username"] on_error => "USER_error" }
  grok { match => { "msg1" => ['user=%{WORD:username}'] } overwrite => ["username"] on_error => "user_error" }
  grok { match => { "msg1" => ['pid=%{INT:processId}'] } overwrite => ["processId"] on_error => "processId_error" }
  grok { match => { "msg1" => ['uid=%{INT:uid}'] } overwrite => ["uid"] on_error => "uid_error" }
  grok { match => { "msg1" => ['UID=%{NOTSPACE:uid}'] } overwrite => ["uid"] on_error => "UID_error" }
  grok { match => { "msg1" => ['ses=%{INT:session_id}'] } overwrite => ["session_id"] on_error => "ses_error" }
  grok { match => { "msg1" => ['acct=\\"%{DATA:acct_username}\\"'] } overwrite => ["acct_username"] on_error => "acct_username_error" }
  grok { match => { "msg1" => ['acct="%{DATA:username}"'] } overwrite => ["username"] on_error => "acct_error" }
  grok { match => { "msg1" => ['grp="%{DATA:grp}"'] } overwrite => ["grp"] on_error => "grp_error" }
  grok { match => { "msg1" => ['unit="%{DATA:unit}"'] } overwrite => ["unit"] on_error => "unit_error" }
  grok { match => { "msg1" => ['to=\\<%{DATA:targetEmail}\\>'] } overwrite => ["targetEmail"] on_error => "targetEmail_error" }
  grok { match => { "msg1" => ['relay=%{NOTSPACE:relayHostname}'] } overwrite => ["relayHostname"] on_error => "relayHostname_error" }
  grok { match => { "msg1" => ['Hostname=%{HOSTNAME:targetHostname}'] } overwrite => ["targetHostname"] on_error => "targetHostname_error" }
  grok { match => { "msg1" => ['status=%{WORD:status}'] } overwrite => ["status"] on_error => "status_error" }
  grok { match => { "msg1" => ['stat=%{WORD:status}'] } overwrite => ["status"] on_error => "stat_error" }
  grok { match => { "msg1" => ['tty=%{NOTSPACE:proto}'] } overwrite => ["proto"] on_error => "tty_error" }
  grok { match => { "msg1" => ['TTY=%{NOTSPACE:proto}'] } overwrite => ["proto"] on_error => "tty_error" }
  grok { match => { "msg1" => ['rhost=%{IP:srcIp}'] } overwrite => ["srcIp"] on_error => "rhost_error" }
  grok { match => { "msg1" => ['PWD=%{NOTSPACE:pwd}'] } overwrite => ["pwd"] on_error => "pwd_error" }
  grok { match => { "msg1" => ['cwd=%{NOTSPACE:cwd}'] } overwrite => ["cdw"] on_error => "pwd_error" }
  grok { match => { "msg1" => ['\\bname\\b=%{NOTSPACE:name}'] } overwrite => ["name"] on_error => "user_name_error" }
  grok { match => { "msg1" => ['home=%{NOTSPACE:home}'] } overwrite => ["home"] on_error => "home_error" }
  grok { match => { "msg1" => ['shell=%{NOTSPACE:shell}'] } overwrite => ["shell"] on_error => "shell_error" }
  grok { match => { "msg1" => ['GID=%{NOTSPACE:gid}'] } overwrite => ["gid"] on_error => "GID_error" }
  grok { match => { "msg1" => ['msg=%{NOTSPACE:desc}'] } overwrite => ["desc"] on_error => "msg_error" }
  grok { match => { "msg1" => ['cipher=%{NOTSPACE:cipher}'] } overwrite => ["cipher"] on_error => "cipher_error" }
  grok { match => { "msg1" => ['pfs=%{NOTSPACE:pfs}'] } overwrite => ["pfs"] on_error => "pfs_error" }
  grok { match => { "msg1" => ['terminal=%{NOTSPACE:terminal}'] } overwrite => ["terminal"] on_error => "terminal_error" }
  grok { match => { "msg1" => ['for %{DATA:username} (from|on)'] } overwrite => ["username"] on_error => "username_error" }
  grok { match => { "msg1" => ['from %{IP:srcIp}'] } overwrite => ["srcIp"] on_error => "srcIp_error" }
  grok { match => { "msg1" => ['port %{INT:srcPort}'] } overwrite => ["srcPort"] on_error => "port_error" }
  grok { match => { "msg1" => ['HOST=".*?%{IP:hostAdded}', 'HOST=/%{IP:hostAdded}'] } overwrite => ["hostAdded"] on_error => "hostAdded_error" }
  grok {
    match => {
      "msg1" => [
        '\\[%{DATA}\\] %{DATA} %{IP:dstIp},%{DATA},HOST=/%{IP:prin_ip}'
      ]
    }
    overwrite => ["prin_ip", "dstIp"]
    on_error => "msg1_error"
  }
  grok {
    match => {
      "msg1" => ":%{GREEDYDATA:kv_data}"
    }
    overwrite => ["kv_data"]
    on_error => "kv_data_error"
  }
  if [kv_data] != "" {
    kv {
      source => "kv_data"
      field_split => ","
      value_split => "="
      on_error => "kv_data_not_in_kv_format"
    }
    if ![kv_data_not_in_kv_format] {
      if [class] != "" {
        mutate {
          convert => {
            "class" => "string"
          }
          on_error => "class_already_string"
        }
        mutate {
          replace => {
            "class_label.key" => "class"
            "class_label.value.string_value" => "%{class}"
          }
          on_error => "class_not_mapped"
        }
        if ![class_not_mapped] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "class_label"
            }
            on_error => "class_label_merge_error"
          }
        }
      }
      if [nrcpts] not in [ "0", ""] {
        mutate {
          convert => {
            "nrcpts" => "string"
          }
          on_error => "nrcpts_already_string"
        }
        mutate {
          replace => {
            "nrcpts_label.key" => "nrcpts"
            "nrcpts_label.value.string_value" => "%{nrcpts}"
          }
          on_error => "nrcpts_not_mapped"
        }
        if ![nrcpts_not_mapped] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "nrcpts_label"
            }
            on_error => "nrcpts_label_merge_error"
          }
        }
      }
      if [msgid] not in [ "0", ""] {
        mutate {
          convert => {
            "msgid" => "string"
          }
          on_error => "msgid_already_string"
        }
        mutate {
          replace => {
            "msgid_label.key" => "msgid"
            "msgid_label.value.string_value" => "%{msgid}"
          }
          on_error => "msgid_not_mapped"
        }
        if ![msgid_not_mapped] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "msgid_label"
            }
            on_error => "msgid_label_merge_error"
          }
        }
      }
      if [proto] == "ESMTP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "SMTP"
          }
        }
      }
      if [daemon] != "" {
        mutate {
          replace => {
            "intermediary.application" => "%{daemon}"
          }
          on_error => "daemon_not_mapped"
        }
      }
    }
  }
  grok {
    match => {
      "msg3" => [
        '%{DATA} %{URI:target_url} %{DATA}'
        '\\[%{DATA}\\] %{DATA} %{IP:dstIp},%{DATA}'
      ]
    }
    overwrite => ["target_url", "dstIp"]
    on_error => "msg3_error"
  }
  if [target_url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{target_url}"
      }
      on_error => "referral_url_error"
    }
  }
  if [dstIp] != "" and [prin_ip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  grok {
    match => {
      "header" => '<%{INT}>%{SYSLOGTIMESTAMP} %{IP:prin_ip} <%{INT}>%{SYSLOGTIMESTAMP} %{DATA}\\[%{INT:pid}\\]'
      }
    overwrite => ["prin_ip", "pid"]
    on_error => "prin_ip_error"
  }

  if [prin_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "prin_ip"
      }
      on_error => "prin_ip_error"
    }
  }

  if [principal_grok_error] { drop { tag => "TAG_MALFORMED_MESSAGE" } }

  grok {
    match => {
      "message" => "\\[ID %{INT:id} \\w+\\.\\w+\\]"
    }
    overwrite => ["id"]
    on_error => "id_grok_fail"
  }

  if ![id_grok_fail] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
      }
      on_error => "id_map_fail"
    }
  }

  grok {
    match => {
      "msg1" => [
        "\\[ID %{INT:id} .*\\] %{DATA:app} %{WORD:status} session %{INT:session_id} by %{DATA:user_name} as %{DATA:user_id} from %{IP:src_ip} text %{GREEDYDATA:command}",
        "\\[ID %{INT:id} .*\\] %{DATA:app} %{WORD:status} session %{INT:session_id} by %{DATA:user_name} as %{DATA:user_id} from %{HOSTNAME:src_host} text %{GREEDYDATA:command}",
        "session %{INT:session_id} by %{DATA:user_name} as %{DATA:user_id} from %{IP:src_ip}",
        "session %{INT:session_id} by %{DATA:user_name} as %{DATA:user_id} from %{HOSTNAME:src_host}"
        "\\[ID %{INT:id} .*\\] %{NOTSPACE:queue_id}:"
      ]
    }
    overwrite => ["id","app","status","session_id","user_name","user_id","src_ip","command", "src_host", "queue_id"]
    on_error => "grock_failure"
  }

  if ![grock_failure] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
      }
      on_error => "product_log_id_error"
    }
    if [queue_id] != "" {
      mutate {
        replace => {
          "queue_id_label.value.string_value" => "%{queue_id}"
          "queue_id_label.key" => "queue_id"
        }
        on_error => "queue_id_error"
      }
      if ![queue_id_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "queue_id_label"
          }
          on_error => "queue_id_label_error"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{src_host}"
      }
      on_error => "principal_hostname_error"
    }
    if [status] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{status}"
        }
        on_error => "action_details_error"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_name}"
      }
      on_error => "event_type_error"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_id}"
      }
      on_error => "event_type_error"
    }

    mutate {
      replace => {
        "app_label.key" => "application"
        "app_label.value" => "%{app}"
      }
      on_error => "app_label_error"
    }

    if ![app_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "app_label"
        }
        on_error => "merge_error"
      }
    }
  }

  # CRYPTO_SESSION
  if [eventType] in ["CRYPTO_SESSION","CRYPTO_KEY_USER"] {
    mutate { replace => {"event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"}}
    mutate { replace => {"event.idm.read_only_udm.network.ip_protocol" => "TCP"}}
  }

  # ANOM_ABEND, LOGIN
  if [eventType] in ["ANOM_ABEND","LOGIN"] {
    if [eventType] == "LOGIN" {
      if [username] != "" or [name] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" }} }
      mutate { replace => { "event.idm.read_only_udm.extensions.auth.type" => "MACHINE" } }
    }
    else {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "PROCESS_TERMINATION" } }
    }
  }

  # SERVICE_START,SERVICE_STOP,USER_ACCT,USER_AUTH,USER_LOGIN, USER_END,USER_MGMT,USER_LOGOUT
  if [eventType] in ["SERVICE_START","SERVICE_STOP","USER_ACCT","USER_AUTH","USER_LOGIN","USER_END","USER_MGMT","USER_LOGOUT","CRED_REFR", "CRED_DISP", "USER_START", "USER_CHAUTHTOK"] {
    if [eventType] in  ["SERVICE_START","SERVICE_STOP"] {
      if [eventType] == "SERVICE_START" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_CREATION"
          }
        }
      }
      else if [eventType] == "SERVICE_STOP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_DELETION"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "PROCESS_UNCATEGORIZED"
          }
        }
      }
      json {
        source => "message"
        target => "json_data"
        on_error => "not_json"
      }
      if ![not_json] {
        if [json_data][resource][type] == "gce_instance" {
          mutate {
            rename => {
              "json_data.labels.compute.googleapis.com/resource_name" => "event.idm.read_only_udm.target.resource.name"
              "json_data.resource.labels.instance_id" => "event.idm.read_only_udm.target.resource.id"
              "json_data.resource.labels.project_id" => "event.idm.read_only_udm.target.asset.attribute.cloud.project.id"
              "json_data.resource.labels.zone" => "event.idm.read_only_udm.target.asset.attribute.cloud.availability_zone"
            }
          }
          mutate {
            replace => {
              "event.idm.read_only_udm.target.resource.resource_type" => "VIRTUAL_MACHINE"
              "event.idm.read_only_udm.target.asset.attribute.cloud.environment" => "GOOGLE_CLOUD_PLATFORM"
            }
          }
        }
      }
      if [eventType] in ["SERVICE_START", "SERVICE_STOP" ] and [not_json] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "%{eventType}"
          }
        }
      }
    }

    else if [eventType] == "USER_ACCT" {
      if [username] == "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" }} }
      else { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED" }} }
    }
    else if [eventType] in ["USER_AUTH", "USER_LOGIN", "USER_MGMT", "CRED_REFR", "CRED_ACQ", "USER_START"] {
        mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" } }
        mutate { replace => { "event.idm.read_only_udm.extensions.auth.type" => "MACHINE" } }
      }
    else if [eventType] in ["USER_LOGOUT", "USER_END", "CRED_DISP"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT" } }
      mutate { replace => { "event.idm.read_only_udm.extensions.auth.type" => "MACHINE" } }
    }
  }

  # systemd
  else if [eventType] == "systemd" or [process] == "systemd" {
    grok {
      match => {
        "msg1" => [
          "(?P<action>Created slice) %{GREEDYDATA:desc}"
          "(?P<action>Starting User Manager) for UID %{WORD:username}"
          "(?P<action>(Starting|Started) Session) %{GREEDYDATA:sessionId} of user %{WORD:username}"
          "(?P<action>(Starting|Stopping)) %{GREEDYDATA:desc}"
          "pam_unix(systemd.*?:session): session %{WORD:} for user (?P<username>\\S+)"
        ]
      }
      overwrite => ["action","desc","username"]
      on_error => "grok_fail"
    }
    if ![grok_fail] {
      if[action] == "Created slice" {
        mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } }
        mutate { replace => { "security_result.description" => "%{action} %{desc}" } }
      }
      else if [action] == "Starting User Manager" {
        mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED" } }
        mutate { replace => { "security_result.description" => "%{action}" } }
      }
      else if [action] in ["Starting Session","Started Session"] {
        mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED" } }
        mutate { replace => { "security_result.description" => "%{action}" } }
      }
      else if [action] in ["Starting","Stopping"] {
        if [action] == "Starting" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "SERVICE_START"}} }
        else { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "SERVICE_STOP" }} }
        mutate { replace => { "security_result.description" => "%{action} %{desc}" } }
      }
    }
    else {
      grok { match => { "msg1" => "%{GREEDYDATA} \\/%{DATA:command} %{GREEDYDATA}" } overwrite => ["command"] on_error => "command_not_found" }
      mutate { replace => { "security_result.description" => "%{msg1}" }} 
    }
  }

  #su
  else if [eventType] == "su" or [eventType] == "sudo" or [process] == "su" or [process] == "sudo" {
    grok {
      match => {
        "msg1" => [
          "(?P<action>session (opened|closed)) for user (?P<username>.*?) by.*",
          "to %{DATA:username}\\) %{WORD:srcUser}",
          "opened for user %{WORD:username} by",
          "closed for user %{WORD:username}",
          "%{DATA:srcUser} :.*?USER=%{WORD:username}.*?COMMAND=(?P<command>.*)",
          "su %{USERNAME:targetUser}"
        ]
      }
      overwrite => ["command","targetUser","srcUser","action"]
      on_error => "sudo_grok_fail"
    }

    if [username] != "" { mutate { replace => { "event.idm.read_only_udm.target.user.userid" => "%{username}" } } }
    if [msg1] =~ "closed" {mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT" }} }
    else if [msg1] =~ "opened" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" }} }

    mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
  }

  # armor
  else if [eventType] == "armor" {
    grok {
      match => {
        "msg1" => 'time="%{TIMESTAMP_ISO8601:collected_ts}" level=%{WORD:level} msg="%{GREEDYDATA:desc}"'
      }
      overwrite => ["collected_ts", "level", "desc"]
    }
  }

  # ec2net
  else if [eventType] == "ec2net" {

    grok {
      match => {
        "msg1" =>  [
          "%{GREEDYDATA:desc} for %{GREEDYDATA:command}"
          "%{GREEDYDATA} %{URI:url}"
        ]
      }
      overwrite => ["url","desc","command"]
      on_error => "grok_fail"
    }

    if ![grok_fail] {

      if [command] != "" { grok { match => { "command" => ".*?%{MAC:target_mac}.*?" } on_error => "mac_not_present" }}
      if [url] != "" { grok { match => { "url" => "%{IP:targetIP}.*?%{MAC:target_mac}.*?" } on_error => "mac_not_present" }}

    }
    else {
      mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }
  }

  # ADD_GROUP, DEL_GROUP
  else if [eventType] in ["ADD_GROUP" , "DEL_GROUP"] {
      if [eventType] == "ADD_GROUP" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GROUP_CREATION"}} }
      else { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GROUP_DELETION"}} }
      mutate { replace => { "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"}}
  }

  # vmkernel
  else if [eventType] == "vmkernel" {
    if ![dvc_not_ip] { mutate { replace => { "target_ip" => "%{dvc}" } } }
    mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" } }
  }

  # SYSCALL
  else if [eventType] == "SYSCALL" {
    mutate { replace => { "event.idm.read_only_udm.target.process.file.full_path" => "%{command}"} on_error => "comand_failed"}
  }

  # CWD
  #else if [eventType] == "CWD" {}

  # PATH
  else if [eventType] == "PATH" {
    mutate { replace => { "event.idm.read_only_udm.target.process.file.full_path" => "%{name}" } on_error => "name_failed"}
  }

  # systemd - logind
  if [process] == "systemd-logind" {
    grok {
      match => {
        "msg1" => [
          "(?P<action>New session) %{GREEDYDATA:sessionId} of user %{GREEDYDATA:username}"
          "Session %{GREEDYDATA:sessionId} (?P<action>logged out). %{GREEDYDATA:desc}"
          "(?P<action>Removed session) %{GREEDYDATA:sessionId}"
        ]
      }
      on_error => "systemd_logind_grok_fail"
      overwrite => ["action","desc","username"]
    }

    if [systemd_logind_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }

    if [username] != "" or [uid] != "" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED" } on_error => "field_not_set" }
    }
    mutate { replace => { "event.idm.read_only_udm.target.application" => "systemd" } on_error => "field_not_set" }

    if [desc] != "" and [action] != "" {
      mutate { replace => { "security_result.summary" => "%{desc}" }}
      mutate { replace => { "security_result.description" => "%{action}" }}
    }
  }

  # postfix
  else if [process] =~ "postfix" {
    grok {
      match => { "process" => "%{WORD}/%{WORD:subProcess}" }
      overwrite => ["subProcess"]
      on_error => "postfix_grok_fail"
    }

    mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}}

    if [subProcess] == "smtpd" {
      grok {
        match => {
          "msg1" => [
            "(connect|disconnect|SSL_accept error) from %{HOSTNAME:srcHostname}\\[%{IP:srcIp}\\]",
            "lost connection .* from %{HOSTNAME:srcHostname}\\[%{IP:srcIp}\\]",
            "%{WORD:severity}: (?P<desc>hostname %{HOSTNAME:srcHostname} .* %{IP:srcIp}.*)",
            "(?P<desc>\\[%{IP:srcIp}\\].*cipher %{GREEDYDATA:tls_cipher} \\(.*)"
          ]
        }
        overwrite => ["srcHostname","srcIp","desc"]
        on_error => "smptd_grok_fail"
      }
      if [smptd_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" }} }
      mutate { replace => { "event.idm.read_only_udm.network.tls.cipher" => "%{tls_cipher}" } on_error => "tls_cipher_not_present" }

      if [srcIp] != "" {
        mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION" } }
        mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP" } }
      }

    }
    else if [subProcess] == "smtp" or [subProcess] == "local" {
      grok {
        match => {
          "msg1" => [
            "to=\\<%{DATA:targetEmail}\\>.*?relay=%{NOTSPACE:relayHostname}\\[%{IP:relayIp}\\]:%{INT:targetPort}.*?Hostname=%{HOSTNAME:targetHostname}\\]%{GREEDYDATA:msg2}",
            "to=\\<%{DATA:targetEmail}\\>.*status=%{WORD:status} .*host %{HOSTNAME:relayHostname}\\[%{IP:relayIp}\\] %{GREEDYDATA:desc} %{GREEDYDATA:url}",
            "to=\\<%{DATA:targetEmail}\\>.*?relay=%{NOTSPACE:relayHostname}%{GREEDYDATA:msg2}"
          ]
        }
        overwrite => ["targetHostname","relayHostname","relayIp","targetEmail","msg2","desc","url","status", "targetPort"]
        on_error => "match_error"
      }

      if [desc] != "" { mutate { replace => { "security_result.summary" => "%{desc}" } } }
      if [srcHostname] != "" || [srcIp] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_SMTP" } } }
      mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP" } }

    }
    else { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }
  }

  # sftp-server
  else if [process] == "sftp-server" {
    grok {
      match => {
        "msg1" => [
          'sftp-server\\[\\d+\\]:\\s*(?P<action>session (opened|closed)) for local user (?P<username>.*?) from \\[%{IP:srcIp}\\]'
          'sftp-server\\[\\d+\\]:\\s*%{WORD:action} %{GREEDYDATA:msg2}'
          '%{WORD:command} "%{GREEDYDATA:filepath}"'
        ]
      }
      overwrite => ["username","srcIp","action","msg2"]
      on_error => "sftp_server_grok_fail"
    }

    if [sftp_server_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" } } }
    mutate { replace => { "event.idm.read_only_udm.principal.process.file.full_path" => "%{filepath}" } on_error => "field_not_set" }

    if [action] == "session opened" or [action] == "session closed" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION" } }
      mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP" } }
    }
  }

  # unix
  else if [process] == "unix" {
    grok {
      match => { "msg1" => [ "(?P<action>The privilege command) %{GREEDYDATA:command}, is %{GREEDYDATA:desc} with id %{INT:userId}" ] }
      overwrite => ["action","desc","command","userId"]
      on_error => "unix_grok_fail"
    }

    if [unix_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" }} }
    mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } }

  }

  # snmpd
  else if [process] == "snmpd" {

    grok {
      match => {
        "msg1" => [
          "(?P<action>Authentication failed) for %{GREEDYDATA:username}",
          "(?P<action>Connection) from %{DATA:protocol}: \\[%{IP:srcIp}\\]:%{NUMBER:srcPort}\\-\\>\\[%{IP:dstIp}\\]:%{NUMBER:dstPort}",
          "(?P<action>Connection) from %{DATA:protocol}:\\s*\\[%{IP:srcIp}\\]:(?P<srcPort>\\d+).*?\\[%{IP:dstIp}\\]",
          "%{GREEDYDATA:msg2}"
        ]
      }
      overwrite => ["action","srcIp","username", "protocol","dstPort","dstIp","srcPort","msg2"]
      on_error => "snmpd_grok_fail"
    }

    if [snmpd_grok_fail] {
      mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" }}
    }

    if [action] == "Authentication failed" {
        mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" } }
        mutate { replace => { "event.idm.read_only_udm.extensions.auth.type" => "MACHINE" } }
    }
    else if [action] == "Connection"{
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_UNCATEGORIZED" } }
    }

  }

  # sshd or vshelld
  else if [process] == "sshd" or [process] == "vshelld"  {
    grok {
      match => {
        "msg1" => [
          "(?P<action>session (opened|closed)) for user (?P<username>.*?) by.*"
          "(?P<action>session (opened|closed)) for user (?P<username>.*)"
          "(?P<action>Connection closed by invalid user) %{DATA:username} %{IP:srcIp} port %{INT:srcPort} \\[%{DATA:auth}\\]"
          "(?P<action>Connection closed) by %{IP:srcIp} port %{INT:srcPort} \\[%{DATA:username}\\]"
          "(?P<action>Connection closed) by %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>Connection closed) by %{IP:srcIp}"
          "(?P<action>Connection) from %{IP:srcIp} port %{INT:srcPort} on %{IP:dstIp} port %{INT:dstPort}"
          "(?P<action>Connection) from %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>Starting session): %{GREEDYDATA:reason} for %{DATA:username} from %{IP:srcIp} port %{INT:srcPort} id %{INT:id}"
          ".*?:\\s+ (?P<action>Closing connection) to %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>Closing connection) to %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>Close session): user (?P<username>.*?) from %{IP:srcIp} port %{INT:srcPort} id %{INT:id}"
          "(?P<action>Accepted (publickey|password|keyboard-interactive)) for %{DATA:username} from %{IP:srcIp} port %{INT:srcPort} %{DATA:proto}: %{GREEDYDATA:hashing_algo}:%{GREEDYDATA:certificate}"
          "(?P<action>Accepted (publickey|password|keyboard-interactive)) for %{DATA:username} from %{IP:srcIp} port %{INT:srcPort} %{WORD:proto}"
          "(?P<action>Authentication) \\<(?P<outcome>.*?)\\>.*? user: \\<(?P<username>.*?)\\>"
          "User '%{DATA:username}' (?P<action>running command) '(?P<command>.*)'"
          "%{GREEDYDATA:desc}: (?P<action>expired password) for user (?P<username>.*?) \\((?P<reason>.*)\\)"
          "(?P<action>expired password) for user (?P<username>.*?) \\((?P<reason>.*)\\)"
          "(?P<action>Received disconnect) from %{IP:srcIp}: %{INT:srcPort}: (?P<reason>.*?)"
          "(?P<action>Disconnected) from user (?P<username>.*?) %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>Disconnected) from %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>Unable to negotiate) with %{IP:srcIp} port %{INT:srcPort}: (?P<reason>.*?)\\."
          "(?P<action>Transferred): sent %{NUMBER:sent_bytes}, received %{NUMBER:received_bytes} bytes"
          "(?P<action>Bind to port)"
          "(?P<action>Cannot bind)"
          "(?P<action>Could not load host key)"
          "(?P<action>Did not receive identification string) from %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>PAM adding faulty module).*"
          "(?P<action>PAM unable to dlopen).*"
          "(?P<action>pam_radius_auth): (?P<severity>\\w+).*"
          "(?P<action>Postponed publickey)"
          "(?P<action>(rexec|reprocess)) .*? Deprecated"
          "(?P<action>Set)"
          "(?P<action>subsystem request) for %{GREEDYDATA:proto}"
          "(?P<action>Transferred)"
          "(?P<action>User child is on pid) %{NUMBER:processId}"
          "(?P<action>Failed password) for invalid user (?P<username>.*?) from %{IP:srcIp} port %{INT:srcPort} %{WORD:proto}"
          "(?P<action>Failed (password|keyboard-interactive|none)) for (?P<username>.*?) from %{IP:srcIp} port %{INT:srcPort} %{WORD:proto}"
          "(?P<action>Failed keyboard-interactive/pam) for invalid user (?P<username>.*?) from %{IP:srcIp} port %{INT:srcPort} %{WORD:proto}"
          "%{WORD:log_level}: %{GREEDYDATA:desc} (?P<action>authentication module) for illegal user %{WORD:username} from %{IP:srcIp}"
          "pam_unix\\(sshd:auth\\): (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{IP:srcIp} user=%{WORD:username}"
          "pam_unix\\(sshd:auth\\): (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{IP:srcIp}"
          "pam_unix\\(sshd:auth\\): (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{DATA:source} user=%{WORD:username}"
          "pam_unix\\(sshd:auth\\): (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{DATA:source}"
          "pam_unix\\(sshd:auth\\): %{GREEDYDATA:summary}"
          "pam_sss\\(sshd:auth\\): (?P<action>authentication success).*?tty=%{WORD:proto}.*?rhost=%{GREEDYDATA:source}.*user=%{WORD:username}"
          "PAM %{INT} more (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{IP:srcIp}.*?user=%{WORD:username}"
          "PAM %{INT} more (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{DATA:source}\\s+user=%{WORD:username}"
          "PAM %{INT} more (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{IP:srcIp}"
          "PAM %{INT} more (?P<action>authentication failure).*?tty=%{WORD:proto}.*?rhost=%{GREEDYDATA:source}"
          "(?P<action>Invalid user) %{DATA:username} from %{IP:srcIp} port %{INT:srcPort}"
          "(?P<action>Invalid user) %{DATA:username} from %{IP:srcIp}"
          "%{GREEDYDATA}: (?P<action>invalid user) %{WORD:username}"
          "pam_succeed_if\\(sshd:auth\\): (?P<action>error retrieving information) about user %{WORD:username}"
          "%{GREEDYDATA:log_level}: %{GREEDYDATA:prd_evt_typ}: (?P<action>Connection closed) by %{GREEDYDATA}"
          "%{GREEDYDATA:desc}: received for user %{GREEDYDATA:username}: %{INT} \\(%{GREEDYDATA:action}\\)"
          "%{GREEDYDATA:desc}: (?P<action>authentication (failure|success)); %{GREEDYDATA:kv_data}"
          "%{GREEDYDATA:desc}: (?P<action>getting password) \\(%{GREEDYDATA}\\)"
          "%{GREEDYDATA:desc}: (?P<action>pam_get_item) %{GREEDYDATA}"
          "%{GREEDYDATA:desc}: user \\'%{GREEDYDATA:username}\\' (?P<action>granted access)"
          "(?P<action>Received disconnect) from %{IP:srcIp} %{GREEDYDATA} %{INT:srcPort}:%{INT}: %{GREEDYDATA:reason}"
          "refused connect from %{IP:srcIp}"
          "pam_unix(sshd:session): session %{WORD} for user (?P<username>\\S+)"
          "(pam_unix|pam_systemd)\\(sshd:session\\): %{WORD:res} to %{GREEDYDATA}: %{GREEDYDATA:desc}"
          "pam_listfile\\(sshd:(account|service|auth)\\): (?P<action>Refused) user %{USERNAME:username} for service"
          "(pam_tty_audit|pam_lastlog)\\(sshd:session\\): %{GREEDYDATA:action}"
          "(pam_faillock)\\(sshd:auth\\): %{GREEDYDATA:action}"
          "%{INT} %{DATA}, %{GREEDYDATA:kv_msg}"
          "fatal: %{GREEDYDATA:action} Connection reset by peer"
          "%{GREEDYDATA:reason} %{IP:srcIp} port %{INT:srcPort}"
          "User %{GREEDYDATA:username} not allowed because shell %{GREEDYDATA:reason}"
          "(pam_tally2)\\(sshd:account\\): %{GREEDYDATA:reason}"
          "Disconnecting: %{GREEDYDATA:reason} %{GREEDYDATA:target_hostname} [preauth]"
          "Authorized to %{GREEDYDATA:username} principal %{GREEDYDATA:username} \\(%{GREEDYDATA}\\)"
          "Protocol %{GREEDYDATA:reason} for %{IP:srcIp}"
          "%{GREEDYDATA:reason}"
        ]
      }
      overwrite => ["action","summary","command","srcIp","srcPort","log_level","username","reason","desc","proto","dstIp","dstPort","processId", "kv_data", "source","prd_evt_typ","certificate","target_hostname"]
      on_error => "shhd_grok_fail"
    }

    if [shhd_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }

    if [action] in ["session opened","Starting session"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" }}
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
    }
    else if [action] in ["Failed password","Failed none", "Failed keyboard-interactive/"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" }}
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" }}
      mutate { replace => { "security_result.summary" => "Login failure" }}
      mutate { replace => { "security_action" => "BLOCK" }}
    }
    else if [action] in ["authentication failure","authentication module","Failed keyboard-interactive/pam", "Authentication failure"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" }}
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" }}
      mutate { replace => { "security_result.summary" => "Login failure" }}
      mutate { replace => { "security_action" => "BLOCK" }}
    }
    else if [action] == "Authentication" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" } }
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
    }
    else if [action] == "session closed" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT" } }
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
    }
    else if [action] in ["Connection closed","Close session","Connection closed by invalid user","Connection"] {

      if [username] != "" {
        mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT" } }
        mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
      }
      else {
        if [srcIp] != "" {
          mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION" } }
          mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP" } }
        }
      }
    }
    else if [action] in ["Received disconnect","Closing connection"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION" } }
      mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP" } }
    }
    else if [action] in ["Disconnected","Did not receive identification string"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION" } }
      mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP" } }
    }
    else if [action] == "Unable to negotiate" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION" } }
      mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP" } }
      mutate { replace => { "security_result.summary" => "Network connection failure" } }
      mutate { replace => { "security_action" => "BLOCK" } }
    }
    else if [action] == "Transferred" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } }
    }
    else if [action] == "Accepted publickey" {
      if [username] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"}} }
    }
    else if [action] in ["Accepted password","Accepted keyboard-interactive"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" }}
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
    }
    else if [action] == "running command" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH" }}
    }
    else if [action] == "subsystem request" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } }
    }
    else if [action] == "expired password" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" } }
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
      mutate { replace => { "security_result.summary" => "Login failure" } }
      mutate { replace => { "security_action" => "BLOCK" } }
    }
    else if [action] in ["Invalid user","invalid user","error retrieving information"] {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" } }
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
      mutate { replace => { "security_action" => "BLOCK" } }
    }
    else if [action] == "authentication success" {
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" } }
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" } }
    }
    if [proto] == "ssh" or [proto] == "ssh2" {
        mutate { replace => { "event.idm.read_only_udm.network.application_protocol" => "SSH" } }
        mutate {
          replace => {
            "protocol_details_label.key" => "protocol_details"
            "protocol_details_label.value" => "%{proto}"
          }
          on_error => "protocol_details_label_error"
        }
        if ![protocol_details_label_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "protocol_details_label"
            }
            on_error => "protocol_details_merge_error"
          }
        }
    }
  }

  # sudo
  else if [process] == "sudo" {
    grok {
      match => {
        "msg1" => [
          "%{GREEDYDATA:desc}: (?P<action>Cannot create session): %{GREEDYDATA:reason} or user %{WORD:username}"
          "%{GREEDYDATA:desc}: (?P<action>session opened) for user %{WORD:username} by (?:|%{WORD:srcUser}.*?)"
          "%{GREEDYDATA:desc}: (?P<action>session closed) for user %{WORD:username}"
          "%{WORD:srcUser} : TTY=%{GREEDYDATA} ; PWD=%{GREEDYDATA:pwd} ; USER=%{WORD:username} ; COMMAND=(?P<command>.*)"
          "%{GREEDYDATA:desc}: (?P<action>authentication (failure|success)); %{GREEDYDATA:kv_data}"
          "%{GREEDYDATA:desc}: received for user %{GREEDYDATA:username}: %{INT} \\(%{GREEDYDATA:action}\\)"
          "%{GREEDYDATA:desc}: (?P<action>conversation failed)"
          "%{GREEDYDATA:desc}: %{GREEDYDATA:action} password for \\[%{GREEDYDATA:username}\\]"
          "(?P<action>expired password) for user (?P<username>.*?) \\((?P<reason>.*)\\)"
          "user: \\<%{GREEDYDATA:username}\\> account"
          "TTY=%{GREEDYDATA} ; PWD=%{GREEDYDATA:pwd} ; USER=%{WORD:username} ;(?: COMMAND=(?P<command>.*)|)"
          "(?P<desc>PAM unable to dlopen\\(.*\\)):%{SPACE}%{DATA:filepath}: %{GREEDYDATA:summary}"
          "(pam_unix|pam_systemd)\\(sudo:session\\): (?P<desc>%{WORD:res} to %{GREEDYDATA}): %{GREEDYDATA:summary}"
        ]
      }
      overwrite => ["action","srcUser", "username", "command","pwd","desc","reason","summary"]
      on_error => "sudo_grok_fail"
    }

    if [sudo_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }

    if [action] in [ "Cannot create session", "auth could not", "expired password" ] {
      mutate { replace => { "security_result.description" => "%{desc}: %{action}"}}
    }
    else if [action] in [ "session opened", "session closed", "authentication failure", "authentication success", "Authentication failure" ] {
      mutate { replace => { "security_result.description" => "%{desc}: %{action}" }}
      mutate { replace => { "mechanism" => "USERNAME_PASSWORD" }}

      if [action] =~ "failure" { mutate { replace => { "security_action" => "BLOCK" }} }
      else if [action] =~ "success" { mutate { replace => { "security_action" => "ALLOW" }} }

      if [action] == "session closed" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT" }} }
      else { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN" }} }
    }
    else if [command] =~ "useradd" {
      grok {
        match => {
          "command" => [
            '.* %{USERNAME:targetDisplayName}","HOST.*'
            '.* %{USERNAME:targetDisplayName},HOST.*'
          ]
        }
        overwrite => ["targetDisplayName"]
        on_error => "targetUserDisplayName_error"
      }

      if [targetDisplayName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_CREATION"
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.user_display_name" => "%{targetDisplayName}"
          }
          on_error => "no_target_display_name"
        }
      }
    }
    else if [command] =~ "groupadd" {
      grok {
        match => {
          "command" => [
            '.* %{USERNAME:targetDisplayName}","HOST.*'
            '.* %{USERNAME:targetDisplayName},HOST.*'
          ]
        }
        overwrite => ["targetDisplayName"]
        on_error => "targetUserDisplayName_error"
      }

      if [targetDisplayName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GROUP_CREATION"
          }
          on_error => "no_target_display_name"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.group.group_display_name" => "%{targetDisplayName}"
          }
          on_error => "no_target_display_name"
        }
      }
    }
    else if [command] =~ "userdel" {
      grok {
        match => {
          "command" => [
            '.* %{USERNAME:targetDisplayName}","HOST.*'
            '.* %{USERNAME:targetDisplayName},HOST.*'
          ]
        }
        overwrite => ["targetDisplayName"]
        on_error => "targetUserDisplayName_error"
      }

      if [targetDisplayName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_DELETION"
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.user_display_name" => "%{targetDisplayName}"
          }
          on_error => "no_target_display_name"
        }
      }
    }
    else if [command] =~ "/usr/bin/passwd" {
      grok {
        match => {
          "command" => [
            '.* %{USERNAME:targetDisplayName}","HOST.*'
            '.* %{USERNAME:targetDisplayName},HOST.*'
          ]
        }
        overwrite => ["targetDisplayName"]
        on_error => "targetUserDisplayName_error"
      }

      if [targetDisplayName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PASSWORD"
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.user_display_name" => "%{targetDisplayName}"
          }
          on_error => "no_target_display_name"
        }
      }
    }
    if [dvc] != "" {
      grok {
        match => {
          "dvc" => ['%{USERNAME:user}']
        }
        overwrite => ["user"]
        on_error => "not_user"
      }
      if not [not_user] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.user_display_name" => "%{user}"
          }
          on_error => "no_dvc_user"
        }
      }
    }
  }

  # useradd
  else if [process] == "useradd" or message =~ "useradd" {
    grok {
      match => {
        "msg1" => [
          "%{GREEDYDATA:desc}: name=%{GREEDYDATA:name}, UID=%{DATA:uid}, GID=%{DATA:gid}, home=%{GREEDYDATA:home}, shell=%{GREEDYDATA:shell}"
          "%{GREEDYDATA:desc}: name=%{GREEDYDATA:name}, GID=%{DATA:gid}"
          "%{GREEDYDATA:desc} \\'%{GREEDYDATA:name}\\'"
          '%{GREEDYDATA}HOST":"/%{IP:hostAdded}'
        ]
      }
      overwrite => ["desc","name","uid","gid","home","shell","hostAdded"]
      on_error => "useradd_grok_fail"
    }

    if [useradd_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }

    mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } }
    mutate { replace => { "eventType" => "Account Creation" } }

  }

  # userdel
  else if [process] == "userdel" {
    grok {
      match => {
        "msg1" => [
          "%{GREEDYDATA:desc} \\'%{GREEDYDATA:name}\\' from group \\'%{GREEDYDATA:grp}\\'"
          "%{DATA:desc} \\'%{DATA:name}\\'"
        ]
      }
      overwrite => ["desc","grp","name"]
      on_error => "userdel_grok_fail"
    }

    if [userdel_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }

    mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } }
    mutate { replace => { "eventType" => "Account Deletion" } }
  }

  # sendmail
  else if [process] == "sendmail" {
    grok {
      match => {
        "msg1" => [
          "to=\\<%{DATA:targetEmail}\\>.*?relay=%{NOTSPACE:relayHostname}.%{SPACE}\\[%{IP:relayIp}\\].*?stat=%{WORD:status}%{SPACE}.*?Hostname=%{HOSTNAME:targetHostname}\\]%{SPACE}%{GREEDYDATA:msg2}"
          "to=\\<%{DATA:targetEmail}\\>.*?relay=%{NOTSPACE:relayHostname}.%{SPACE}\\[%{IP:relayIp}\\].*?stat=%{WORD:status}:%{SPACE}%{GREEDYDATA:msg2}"
          "to=\\<%{DATA:targetEmail}\\>.*?relay=%{NOTSPACE:relayHostname}.*?stat=%{WORD:status}:%{SPACE}%{GREEDYDATA:msg2}"
          "\\[%{IP:targetIp}\\] %{GREEDYDATA:msg2}"
          "from=\\<%{DATA:targetEmailfrom}\\>, size=%{INT}.*relay=%{NOTSPACE:relayHostname} \\[%{IP:relayIp}\\]"
        ]
      }
      overwrite => ["targetHostname","relayHostname","relayIp","targetEmail","targetIp","status","targetEmailfrom","msg2"]
      on_error => "sendmail_grok_fail"
    }

    if [sendmail_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }

    mutate { gsub => ["relayHostname","[.]$",""] }

    if [targetEmail] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "EMAIL_UNCATEGORIZED" }} }
    if [from] != "" and [targetEmailfrom] == "" {
      grok {
        match => {
          "from" => [
            "%{EMAILADDRESS:targetEmailfrom}"
          ]
        }
        overwrite => ["targetEmailfrom"]
        on_error => "no_targetEmailfrom"
      }
    }
    if [targetEmailfrom] != "" and [targetEmailfrom] =~ "^.+@.+$" { 
      mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "EMAIL_UNCATEGORIZED" }} 
    }

    if [msg2] != "" {
      grok {
        match => { "msg2" => [ "%{INT:sent_bytes}( bytes)?" ] }
        on_error => "bytes_not_found"
      }
      if [bytes_not_found] { mutate { replace => { "security_result.summary" => "%{msg2}" }} }
    }
  }

  #pganalyze-collector, dhclient
  else if [process] in ["pganalyze-collector","dhclient"] {
    grok {
      match => {
        "msg1" => [
          "%{GREEDYDATA:desc} to %{IP:srcIP}",
          "%{GREEDYDATA:desc} from %{IP:srcIP}"
        ]
      }
      overwrite => ["desc","targetIP","srcIP"]
      on_error => "dhclient_grok_fail"
    }

    mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } }
    mutate { replace => { "event.idm.read_only_udm.network.application_protocol" => "DHCP" } }
    mutate { replace => { "event.idm.read_only_udm.metadata.product_event_type" => "DHCP Event" } }
    mutate { replace => { "product_event_type" => "DHCP Event" } }
    mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" }}

    if ![dhclient_grok_fail] {
      if [desc] =~ "DHCPACK" {
        mutate { replace => { "event.idm.read_only_udm.network.dhcp.type" => "ACK" } }
        mutate { replace => { "event.idm.read_only_udm.network.dhcp.opcode" => "BOOTREPLY" } }
      }
      if [desc] =~ "DHCPREQUEST" {
        mutate { replace => { "event.idm.read_only_udm.network.dhcp.type" => "REQUEST" } }
        mutate { replace => { "event.idm.read_only_udm.network.dhcp.opcode" => "BOOTREQUEST" } }
      }
    }
  }

  # elastic-agent, metricbeat
  else if [process] in ["elastic-agent","metricbeat"] {
    grok {
      match => {
        "msg1" => [
          '%{TIMESTAMP_ISO8601:collected_ts}#%{DATA}#%{INT}%{GREEDYDATA:command_line}:%{INT}#%{INT}%{GREEDYDATA:descript}: %{WORD:method} "%{GREEDYDATA:url}": %{WORD} %{WORD:proto} %{IP:principal_ip}:%{INT:principal_port}: %{GREEDYDATA:summary}'
          '%{TIMESTAMP_ISO8601:collected_ts}#%{DATA}#%{INT}%{GREEDYDATA:command_line}:%{INT}#%{INT}%{GREEDYDATA:descript}'
        ]
      }
      overwrite => ["method","url","proto","principal_ip","principal_port","summary"]
      on_error => "metricbeat_grok_fail"
    }

    if ![metricbeat_grok_fail] {
      if [process] == "metricbeat" and [principal_ip] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP" }} }
    }
    else {
      if [msg1] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{msg1}"
          }
          on_error => "metricbeat_description_replace_error"
        }
      }
    }
  }

  # auditbeat
  else if [process] == "auditbeat" {
    grok {
      match => {
        "msg1" => ["%{TIMESTAMP_ISO8601:collected_ts}#%{GREEDYDATA}#%{INT}%{GREEDYDATA:command_line}:%{INT}#%{INT}%{GREEDYDATA:descript}(#)?"]
      }
      on_error => "auditbeat_grok_failed"
    }

    if [sendmail_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}"}} }

  }

  # xntpd
  else if [process] == "xntpd" {
    mutate {
      replace => {
        "protocol_field.key" => "protocol"
        "protocol_field.value" => "xntpd"
      }
    }
    mutate { merge => { "security_result.detection_fields" => "protocol_field" } }
  }

  # crond
  else if [process] in ["crond","CROND", "CRON"]  {
    grok {
      match => {
        "msg1" => [
          "\\(%{DATA:targetHostname}\\) CMD \\(%{GREEDYDATA:desc};(?P<command>[^\\)]+)\\)"
          "%{DATA:desc}: %{DATA:command}: %{GREEDYDATA:summary}"
          "\\(%{DATA:targetHostname}\\) CMD \\(%{GREEDYDATA:command}\\)"
          "%{DATA:desc}: \\/%{GREEDYDATA:command}"
          "\\(%{USERNAME:src_user}\\) CMD \\(command %{GREEDYDATA:cmd} %{DATA} %{DATA}\\)"
          "pam_unix\\((cron|sshd):session\\): session %{DATA:res} for user (?P<src_user>\\S+)"
          "\\(%{NOTSPACE}\\) CMD \\(.*?\\) %{DATA:targetEmail} .*?\\)"
        ]
      }
      overwrite => ["desc","command","summary","targetHostname","targetEmail"]
      on_error => "crond_grok_fail"
    }

    if ![crond_grok_fail] { mutate { replace => {"event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"}} }
  }

  # named
  else if [process] == "named" {
    grok {
      match => {
        "msg1" => [
           "%{GREEDYDATA} (.*?)%{IP:principal_ip}#%{INT:srcPort} \\(%{DATA:targetHostname}\\): (?P<eventType>query failed) %{DATA} for %{DATA:dnsDomain}/%{WORD:dnsClass}/%{WORD:queryType} at %{GREEDYDATA}"
           "%{GREEDYDATA} %{IP:principal_ip}#%{INT:srcPort} \\(%{DATA:targetHostname}\\): %{GREEDYDATA} (?P<action>(denied|ended|started))"
           "%{GREEDYDATA} %{IP:principal_ip}#%{INT:srcPort}: %{GREEDYDATA} \\'%{DATA:targetHostname}/%{GREEDYDATA} (?P<action>(denied|ended|started))"
           "%{GREEDYDATA} %{IP:principal_ip}#%{INT:srcPort} \\(%{HOSTNAME:targetHostname}\\): %{GREEDYDATA:data}"
           "%{GREEDYDATA} %{IP:principal_ip}#%{INT:srcPort}: (?P<eventType>update failed): %{GREEDYDATA:data}"
           "%{GREEDYDATA} '%{HOSTNAME:targetHostname}/A/IN': (.*?)%{IP:principal_ip}#%{INT:srcPort}"
           "(?P<eventType>SERVFAIL|network|REFUSED|connection refused|FORMERR|NOTIMP|host unreachable) %{GREEDYDATA} \\'%{DATA:targetHostname}/%{GREEDYDATA}/%{GREEDYDATA}: %{IP:ip}#%{INT:srcPort}"
           "(?P<eventType>trust-anchor-telemetry) \\'%{DATA:targetHostname}/%{GREEDYDATA}%{GREEDYDATA} %{IP:principal_ip}"
           "zone %{HOSTNAME:targetHostname}/%{GREEDYDATA} %{IP:principal_ip}#%{INT:srcPort} "
           "zone %{HOSTNAME:targetHostname}/%{GREEDYDATA}: %{GREEDYDATA} %{IP:principal_ip}#%{INT:srcPort} %{GREEDYDATA}"
           "zone %{HOSTNAME:targetHostname}/%{GREEDYDATA}/%{GREEDYDATA}: %{GREEDYDATA}"
           "zone %{HOSTNAME:targetHostname}/%{GREEDYDATA}"
          "(?P<eventType>missing) %{GREEDYDATA} %{IP:principal_ip}#%{INT:srcPort}"
          "%{GREEDYDATA:desc}"
        ]
      }
      overwrite => ["action","targetHostname", "eventType" ,"principal_ip","srcPort" ,"desc"]
      on_error => "named_grok_fail"
    }

    if [named_grok_fail] { mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" } } }

    if [action] in ["denied","ended"] or [eventType] in ["query failed", "REFUSED", "SERVFAIL", "network", "connection refused", "host unreachable", "update failed"] {
      mutate { replace => { "security_action" => "BLOCK" } }
    }
    else if [action] == "started" {
      mutate { replace => { "security_action" => "ALLOW" } }
    }
    else {
      mutate { replace => { "security_action" => "UNKNOWN_ACTION" } }
    }

    if [targetHostname] != "" and [principal_ip] == ""{ mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } } }
    if [principal_ip] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE" } } }
    else { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } } }
  }

  # unbound
  else if [process] == "unbound" {
    grok {
      match => { "msg1" => [ "%{IP:principal_ip} %{DATA:targetHostname} %{GREEDYDATA}" ] }
      overwrite => ["targetHostname", "principal_ip"]
    }

    if [principal_ip] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE" } } }
    else { mutate { replace => { "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT" } } }
  }

  if [message] =~ "sshd" and [message] =~ "auth.info" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "security_result.severity" => "LOW"
      }
    }
  }

# === UDM > DATA ===

  # timestamp, timestamp_tz
  if [timestamp] != "" {
    date {
      match => ["timestamp", "MMM d HH:mm:ss", "MMM d HH:mm:ss "]
      rebase => true
      target => "@timestamp"
    }
  } else if [timestamp_tz] != "" {
    date {
      match => ["timestamp_tz", "RFC3339"]
    }
  }

  # dvc
  if [message] =~ "Accepted password for" {
    grok {
      match => {
        "dvc" => ['%{IP:ip_dvc}']
      }
      on_error => "dvc_not_ip_grok1"
    }
    if [dvc_not_ip_grok1] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{dvc}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{dvc}"
        }
        on_error => "dvc_hostname_replace_error"
      }
    }
    else {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dvc"
          "event.idm.read_only_udm.target.asset.ip" => "dvc"
        }
        on_error => "dvc_ip_merge1_error"
      }
    }
  }
  else if [dvc] != "" {
    grok { match => { "dvc" => ['%{IP:ip_dvc}'] } on_error => "dvc_not_ip_grok2" }
    if [dvc_not_ip_grok2] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{dvc}"
        }
        on_error => "dvc_hostname_replace_error2"
      }
    }
    else {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "dvc"
        }
        on_error => "dvc_ip_merge2_error"
      }
    }
  }

  # process
  if [process] != "" { mutate { replace => { "event.idm.read_only_udm.target.application" => "%{process}"}} }

  # pid
  if [pid] != "" { mutate { replace => { "event.idm.read_only_udm.target.process.pid" => "%{pid}"}} }

  # processId
  if [processId] != "" { mutate { replace => {"event.idm.read_only_udm.principal.process.pid"  => "%{processId}"}} }

  # srcPort
  if [srcPort] != "" {
    mutate {
      replace => {"event.idm.read_only_udm.principal.port" => "%{srcPort}"}
      on_error => "srcPort_empty"
    }
    mutate {
      convert => {"event.idm.read_only_udm.principal.port" => "integer"}
      on_error => "srcPort_not_integer"
    }
  }

  # srcIp
  if [srcIp] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "srcIp"
        "event.idm.read_only_udm.principal.asset.ip" => "srcIp"
      }
      on_error => "srcIp_empty"
    }
  }

  # dstPort
  if [dstPort] != "" {
    mutate { replace => {"event.idm.read_only_udm.target.port" => "%{dstPort}"}}
    mutate { convert => {"event.idm.read_only_udm.target.port" => "integer"} }
  }

  # dstIp
  if [dstIp] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dstIp"
      }
      on_error => "dstIp_empty"
    }
  }

  # command
  if [command] != "" {
    if [process] not in ["sshd", "guard_tap"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.command_line" => "%{command}"
        }
        on_error => "command_empty"
      }
    }
  }

  # srcHostname
  if [srcHostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{srcHostname}"
      }
      on_error => "srcHostname_empty"
    }
  }

  # outcome
  if [msg1] =~ "success|succeeded|Succeeded|Sent|Accepted" {
    mutate { replace => { "security_result.summary" => "Authentication success" } }
    mutate { replace => { "security_action" => "ALLOW" } }
  }
  else if [msg1] =~ "fail|Failed|Deferred" {
    mutate { replace => { "security_result.summary" => "Authentication failed" } }
    mutate { replace => { "security_action" => "BLOCK" } }
  }

  # collected_ts
  if [collected_ts] != "" {
    date {
      match => ["collected_ts", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.collectedtimestamp"
    }
  }

  # level
  if [level] != ""  {
      if [level] == "debug" { mutate { replace => {"security_result.severity" => "LOW"}} }
      if [level] == "info" { mutate { replace => {"security_result.severity" => "LOW"}} }
      if [level] == "notice" { mutate { replace => {"security_result.severity" => "LOW"}} }
      if [level] == "warning" { mutate { replace => {"security_result.severity" => "MEDIUM"}} }
      if [level] == "err" { mutate { replace => {"security_result.severity" => "ERROR"}} }
      if [level] == "crit" { mutate { replace => {"security_result.severity" => "CRITICAL"}} }
      if [level] == "alert" { mutate { replace => {"security_result.severity" => "HIGH"}} }
      if [level] == "emerg" { mutate { replace => {"security_result.severity" => "CRITICAL"}} }
  }

  # username
  if [username] != "" { mutate { replace => { "event.idm.read_only_udm.principal.user.userid" => "%{username}"}} }

  if [acct_username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{acct_username}"
      }
      on_error => "acct_username_mapping_error"
    }
  }

  # targetIp
  if [targetIp] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "targetIp"
      }
      on_error => "targetIp_empty"
    }
  }

  # targetPort
  if [targetPort] != "" {
    mutate { replace => {"event.idm.read_only_udm.target.port" => "%{targetPort}"}}
    mutate { convert => {"event.idm.read_only_udm.target.port" => "integer"} }
  }

  # hostAdded
  if [targetIp] == "" and [dstIp] == "" and [hostAdded] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "hostAdded"
      }
      on_error => "hostAdded_empty"
    }
  }

  # uid
  if [uid] != "" {
    if [uid] == "0" { mutate { replace => { "event.idm.read_only_udm.principal.user.userid" => "root"}} }
    else { mutate { replace => { "event.idm.read_only_udm.principal.user.userid" => "%{uid}"}} }
  }

  # session_id
  if [session_id] != "" { mutate { replace => { "event.idm.read_only_udm.network.session_id" => "%{session_id}"}} }

  # grp
  if [grp] != "" { mutate { replace => { "event.idm.read_only_udm.target.group.group_display_name" => "%{grp}"}} }

  # unit
  if [unit] != "" { mutate { replace => { "event.idm.read_only_udm.target.application" => "%{unit}" } } }

  # targetEmail
  if [targetEmail] != "" { mutate { merge => { "event.idm.read_only_udm.network.email.to" => "targetEmail" } } }

  # relayHostname
  if [relayHostname] == "local" { mutate { replace => { "targetHostname" => "%{dvc}"}} }
  else if [relayHostname] != "" { mutate { replace => { "intermediary.hostname" => "%{relayHostname}"}} }

  # targetHostname
  if [targetHostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{targetHostname}"
      }
      on_error => "targetHostname_empty"
    }
  }

  if [auid] != "" {
    mutate {
      replace => {
        "auid_label.key" => "auid"
        "auid_label.value" => "%{auid}"
      }
      on_error => "auid_label_error"
    }
    if ![auid_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "auid_label"
        }
        on_error => "auid_merge_error"
      }
    }
  }
  if [op] != "" {
    mutate {
      replace => {
        "op_label.key" => "op"
        "op_label.value" => "%{op}"
      }
      on_error => "op_label_error"
    }
    if ![op_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "op_label"
        }
        on_error => "op_merge_error"
      }
    }
  }
  if [algo] != "" {
    mutate {
      replace => {
        "algo_label.key" => "algo"
        "algo_label.value" => "%{algo}"
      }
      on_error => "algo_label_error"
    }
    if ![algo_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "algo_label"
        }
        on_error => "algo_merge_error"
      }
    }
  }
  if [key_size] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.file.size" => "%{key_size}"
      }
      on_error => "key_size_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.file.size" => "uinteger"
      }
      on_error => "key_size_not_integer"
    }
  }
  if [fp] != "" {
    mutate {
      replace => {
        "fp_label.key" => "fp"
        "fp_label.value" => "%{fp}"
      }
      on_error => "fp_label_error"
    }
    if ![fp_label_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "fp_label"
        }
        on_error => "fp_merge_error"
      }
    }
  }
  # protocol
  if [protocol] =~ "EIGRP|eigrp" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "EIGRP"}} }
  if [protocol] =~ "ESP|esp" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "ESP"}} }
  if [protocol] =~ "ETHERIP|etherip" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "ETHERIP"}} }
  if [protocol] =~ "GRE|gre" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "GRE"}} }
  if [protocol] =~ "ICMP|icmp" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "ICMP"}} }
  if [protocol] =~ "IGMP|igmp" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "IGMP"}} }
  if [protocol] =~ "IP6IN4|ip6in4" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "IP6IN4"}} }
  if [protocol] =~ "PIM|pim" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "PIM"}} }
  if [protocol] =~ "TCP|tpc" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "TCP"}} }
  if [protocol] =~ "UDP|udp" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "UDP"}} }
  if [protocol] =~ "VRRP|vrrp" { mutate { replace => { "event.idm.read_only_udm.network.ip_protocol" => "VRRP"}} }

  # pwd
  if [pwd] != "" { mutate { replace => {"event.idm.read_only_udm.target.file.full_path"  => "%{pwd}"}} }

  # cwd
  if [cwd] != "" { mutate { replace => { "event.idm.read_only_udm.target.process.file.full_path" => "%{cwd}"}} }

  # name
  if [name] != "" { mutate { replace => { "event.idm.read_only_udm.target.user.user_display_name" => "%{name}"}} }

  # home
  if [home] != "" { mutate { replace => {"event.idm.read_only_udm.target.file.full_path"  => "%{home}"}} }

  # shell
  if [shell] != "" { mutate { replace => { "event.idm.read_only_udm.target.process.command_line" => "%{shell}"}} }

  # gid
  if [gid] != "" { mutate { merge => { "event.idm.read_only_udm.target.user.group_identifiers" => "gid"}} }

  # desc
  mutate {
    replace => {
      "security_result_description" => "%{security_result.description}"
    }
    on_error => "security_result_description_empty"
  }
  if [desc] != "" and [security_result_description] == "" { mutate { replace => { "security_result.description" => "%{desc}"}} }

  # summary
  if [summary] != ""  { mutate { replace => { "security_result.summary" => "%{summary}"}} }

  # reason
  if [reason] != ""  { mutate { replace => { "security_result.summary" => "%{reason}"}} }

  # relayIp
  if [relayIp] != "" { mutate { merge => { "intermediary.ip" => "relayIp"}} }

  # cipher
  if [cipher] != "" { mutate { replace => { "event.idm.read_only_udm.network.tls.cipher" => "%{cipher}" }} }

  # pfs
  if [pfs] != "" { mutate { replace => { "event.idm.read_only_udm.network.tls.curve" => "%{pfs}" }} }

  # terminal
  if [terminal] != "" {
    mutate { replace => {
            "data_terminal.key" => "terminal"
            "data_terminal.value" => "%{terminal}"
        } on_error => "terminal_failed"}

    if ![terminal_failed] {
      if [data_terminal][value] != "" {
          mutate { merge => {"about.resource.attribute.labels" => "data_terminal"} on_error => "data_terminal_failed"}
      }
    }
  }

  # srcUser
  if [srcUser] != "" { mutate { replace => { "event.idm.read_only_udm.src.user.userid" => "%{srcUser}"}} }

  # targetUser
  if [targetUser] != "" { mutate { replace => { "event.idm.read_only_udm.target.user.userid" => "%{targetUser}"}} }

  # principal_ip
  if [principal_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "principal_ip"
      }
      on_error => "principal_ip_empty"
    }
  }

  # principal_port
  if [principal_port] != "" {
    mutate { replace => {"event.idm.read_only_udm.target.port" => "%{principal_port}"}}
    mutate { convert => {"event.idm.read_only_udm.target.port" => "integer"} }
  }

  # url
  if [url] != "" { mutate { replace => { "event.idm.read_only_udm.target.url" => "%{url}" } } }

  # msg2
  if [msg2] != "" { mutate { replace => { "security_result.summary" => "%{msg2}"}} }

  # targetEmailfrom
  if [targetEmailfrom] != "" { mutate { replace => { "event.idm.read_only_udm.network.email.from" => "%{targetEmailfrom}"}} }

  # method
  if [method] != "" {
    mutate { uppercase => [ "method" ] }
    mutate { replace => { "event.idm.read_only_udm.network.http.method" => "%{method}" } }
  }

  # mechanism
  if [mechanism] != "" { mutate { merge => { "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism" }} }

  # machine id for STATUS_UPDATE if missing
  if [srcHostname] == "" and [dvc] == "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "UNKNOWN HOSTNAME"
      }
      on_error => "hostname_failed"
    }
  }

  mutate { merge => { "security_result.action" => "security_action"} on_error => "security_action_failed"}
  mutate { merge => { "event.idm.read_only_udm.security_result" => "security_result"} on_error => "security_result_failed"}
  mutate { merge => { "event.idm.read_only_udm.intermediary" => "intermediary"} on_error => "intermediary_failed"}
  mutate { merge => { "event.idm.read_only_udm.about" => "about"} on_error => "about_failed"}


# === UDM > METADATA ===

  # General Metadata for all events
  mutate { replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Linux"
      "event.idm.read_only_udm.metadata.product_name" => "Solaris System"
  }   }

  # evenType
  if [eventType] != "" { mutate { replace => { "event.idm.read_only_udm.metadata.product_event_type" => "%{eventType}"}} }

  # msg1
  mutate { replace => { "event.idm.read_only_udm.metadata.description" => "%{msg1}" } on_error => "msg1_not_found"}
  if [msg3] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{msg3}"
      }
      on_error => "msg3_not_found"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }

}

