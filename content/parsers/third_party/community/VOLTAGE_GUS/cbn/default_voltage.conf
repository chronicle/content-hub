# Product: VOLTAGE
# Category: Email Server
# Supported Format: SYSLOG
# Last Updated: 2025-06-11
# Reference: N/A
# Copyright 2025 Google SecOps


filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "security_result" => ""
      "intermediary" => ""
      "additional" => ""
      "event" => ""
      "timestamp" => ""
      "inter_hostname" => ""
      "prod_event_type" => ""
      "pid" => ""
      "message_data" => ""
      "user" => ""
      "sessionid" => ""
      "description" => ""
      "has_user" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "cmd_line" => ""
      "src_ip" => ""
      "src_hostname" => ""
      "dst_ip" => ""
      "tar_user" => ""
      "log_msg_id" => ""
      "kv_data" => ""
      "ServerNode" => ""
      "Created" => ""
      "Summary" => ""
      "EventLevel" => ""
      "SessionID" => ""
      "RequestID" => ""
      "src_port" => ""
      "SourceName" => ""
      "EventName" => ""
      "Service" => ""
      "ClusterName" => ""
      "ClusterUID" => ""
      "IPAddress" => ""
      "TenantUID" => ""
      "UserAgentType" => ""
      "FreeMemory" => ""
      "UsedMemory" => ""
      "TotalMemory" => ""
      "version" => ""
      "event_id" => ""
      "severity" => ""
      "cef_extension" => ""
      "district" => ""
      "src" => ""
      "rollover" => ""
      "cvProduct" => ""
      "cvapi" => ""
      "cvframework" => ""
      "cvos" => ""
      "identity" => ""
      "fullIdentity" => ""
      "algorithm" => ""
      "username" => ""
      "returnEncryptedKeyOption" => ""
      "authMethodName" => ""
      "authType" => ""
      "authTimeMillis" => ""
      "shost" => ""
      "requestClientApplication" => ""
      "format" => ""
      "returnFullIdentity" => ""
      "acceptBadData" => ""
      "length" => ""
      "AuthenticationMethod" => ""
      "mechanism" => ""
      "CachedAuthentication" => ""
      "requestTimeMillis" => ""
      "proxyConnectionIp" => ""
      "cvdevice" => ""
      "hsmEnabled" => ""
      "wrappedMode" => ""
      "timeMillis" => ""
      "cached" => ""
      "request" => ""
      "path" => ""
      "merchantId" => ""
      "keyId" => ""
      "phaseBit" => ""
      "leadingDigits" => ""
      "trailingDigits" => ""
      "elapsedTimeMillis" => ""
      "authTokens" => ""
      "isUserPassSet" => ""
      "proxyType" => ""
      "attemptedAuthMethods" => ""
      "msg" => ""
      "cef_product" => ""
      "out" => ""
      "masked" => ""
      "sec_action" => ""
      "extensions" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:timestamp} %{DATA:inter_hostname} %{DATA:prod_event_name}(\\[%{INT:pid}\\])?: %{GREEDYDATA:message_data}",
        "<%{INT}>CEF:%{INT}\\|%{DATA}\\|%{DATA:cef_product}\\|%{DATA:version}\\|%{DATA:event_id}\\|%{DATA:prod_event_name}\\|%{INT:severity}\\|%{GREEDYDATA:cef_extension}"
      ]
    }
    overwrite => ["timestamp","inter_hostname","prod_event_name","pid","message_data", "version", "event_id", "severity", "cef_extension", "cef_product"]
    on_error => "grok_failed"
  }

  if [grok_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [cef_extension] != "" {
    mutate {
      gsub => ["cef_extension", " ([a-zA-Z0-9_]+)=","`$1="]
    }
    kv {
      source => "cef_extension"
      field_split => "`"
      value_split => "="
      on_error => "kv_failed"
    }
  }

  if [version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{version}"
      }
      on_error => "no_version"
    }
  }

  if [event_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{event_id}"
      }
      on_error => "no_event_id"
    }
  }

  if [severity] != "" {
    if [severity] in ["0", "1", "2"] {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [severity] in ["3", "4"] {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    } else if [severity] in ["5", "6"] {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
    else if [severity] in ["7", "8"] {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    mutate {
      replace => {
        "security_result.severity_details" => "%{severity}"
      }
      on_error => "no_severity_details"
    }
  }

  if [district] != "" {
    mutate {
      replace => {
        "target.administrative_domain" => "%{district}"
      }
      on_error => "no_district"
    }
  }

  if [rollover] != "" {
    mutate {
      replace => {
        "rollover_label.key" => "rollover"
        "rollover_label.value.string_value" => "%{rollover}"
      }
      on_error => "no_rollover"
    }
    if ![no_rollover] {
      mutate {
        merge => {
          "additional.fields" => "rollover_label"
        }
        on_error => "no_rollover_label"
      }
    }
  }
  if [src] != "" {
    mutate {
      split => {
        source => "src"
        separator => ","
        target => "src"
      }
      on_error => "no_src"
    }
    for ip in src {
      if [ip] != "" {
        grok {
          match => {
            "ip" => [
              "%{IP:ip}"
            ]
          }
          overwrite => ["ip"]
          on_error => "no_src_ip"
        }
        if ![no_src_ip] {
          mutate {
            merge => {
              "principal.ip" => "ip"
              "principal.asset.ip" => "ip"
            }
            on_error => "no_src_ip_principal"
          }
          if ![no_src_ip_principal] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
    }
  }

  if [cvProduct] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.application" => "%{cvProduct}"
      }
      on_error => "no_cvProduct"
    }
  }

  if [cvapi] != "" {
    mutate {
      replace => {
        "cvapi_label.key" => "cvapi"
        "cvapi_label.value" => "%{cvapi}"
      }
      on_error => "no_cvapi"
    }
    if ![no_cvapi] {
      mutate {
        merge => {
          "event.idm.read_only_udm.observer.labels" => "cvapi_label"
        }
        on_error => "no_cvapi_label"
      }
    }
  }

  if [cvframework] != "" {
    mutate {
      replace => {
        "cvframework_label.key" => "cvframework"
        "cvframework_label.value" => "%{cvframework}"
      }
      on_error => "no_cvframework"
    }
    if ![no_cvframework] {
      mutate {
        merge => {
          "event.idm.read_only_udm.observer.labels" => "cvframework_label"
        }
        on_error => "no_cvframework_label"
      }
    }
  }

  if [cvos] != "" {
    mutate {
      gsub => ["cvos", "(.+)\/(.+)(.*)", "$1"]
    }
    if [cvos] =~ "Li" {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.platform" => "LINUX"
        }
      }
    }
    else if [cvos] =~ "Win" {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.platform" => "WINDOWS"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.platform" => "MAC"
        }
      }
    }
  }

  if [identity] != "" {
    if [identity] =~ "(.*)@(.*)" {
      mutate {
        merge => {
          "principal.user.email_addresses" => "identity"
        }
        on_error => "no_identity"
      }
    }
  }

  if [fullIdentity] != "" {
    mutate {
      replace => {
        "fullIdentity_label.key" => "fullIdentity"
        "fullIdentity_label.value" => "%{fullIdentity}"
      }
      on_error => "no_fullIdentity"
    }
    if ![no_fullIdentity] {
      mutate {
        merge => {
          "security_result.detection_fields" => "fullIdentity_label"
        }
        on_error => "no_fullIdentity_label"
      }
    }
  }

  if [algorithm] != "" {
    mutate {
      replace => {
        "algorithm_label.key" => "algorithm"
        "algorithm_label.value" => "%{algorithm}"
      }
      on_error => "no_algorithm"
    }
    if ![no_algorithm] {
      mutate {
        merge => {
          "security_result.detection_fields" => "algorithm_label"
        }
        on_error => "no_algorithm_label"
      }
    }
  }

  if [returnEncryptedKeyOption] != "" {
    mutate {
      replace => {
        "returnEncryptedKeyOption_label.key" => "returnEncryptedKeyOption"
        "returnEncryptedKeyOption_label.value" => "%{returnEncryptedKeyOption}"
      }
      on_error => "no_returnEncryptedKeyOption"
    }
    if ![no_returnEncryptedKeyOption] {
      mutate {
        merge => {
          "security_result.detection_fields" => "returnEncryptedKeyOption_label"
        }
        on_error => "no_returnEncryptedKeyOption_label"
      }
    }
  }

  if [username] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{username}"
      }
      on_error => "no_username"
    }
  }

  if [authMethodName] != "" {
    mutate {
      replace => {
        "authMethodName_label.key" => "authMethodName"
        "authMethodName_label.value" => "%{authMethodName}"
      }
      on_error => "no_authMethodName"
    }
    if ![no_authMethodName] {
      mutate {
        merge => {
          "security_result.detection_fields" => "authMethodName_label"
        }
        on_error => "no_authMethodName_label"
      }
    }
  }

  if [authType] != "" {
    mutate {
      replace => {
        "authType_label.key" => "authType"
        "authType_label.value" => "%{authType}"
      }
      on_error => "no_authType"
    }
    if ![no_authType] {
      mutate {
        merge => {
          "security_result.detection_fields" => "authType_label"
        }
        on_error => "no_authType_label"
      }
    }
  }

  if [authTimeMillis] != "" {
    mutate {
      replace => {
        "authTimeMillis_label.key" => "authTimeMillis"
        "authTimeMillis_label.value" => "%{authTimeMillis}"
      }
      on_error => "no_authTimeMillis"
    }
    if ![no_authTimeMillis] {
      mutate {
        merge => {
          "security_result.detection_fields" => "authTimeMillis_label"
        }
        on_error => "no_authTimeMillis_label"
      }
    }
  }

  if [shost] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{shost}"
        "target.asset.hostname" => "%{shost}"
        "has_target" => "true"
      }
      on_error => "no_shost"
    }
  }

  if [requestClientApplication] != "" {
    mutate {
      replace => {
        "principal.application" => "%{requestClientApplication}"
      }
      on_error => "no_requestClientApplication"
    }
  }

  if [format] != "" {
    mutate {
      replace => {
        "format_label.key" => "format"
        "format_label.value" => "%{format}"
      }
      on_error => "no_format"
    }
    if ![no_format] {
      mutate {
        merge => {
          "security_result.detection_fields" => "format_label"
        }
        on_error => "no_format_label"
      }
    }
  }

  if [returnFullIdentity] != "" {
    mutate {
      replace => {
        "returnFullIdentity_label.key" => "returnFullIdentity"
        "returnFullIdentity_label.value" => "%{returnFullIdentity}"
      }
      on_error => "no_returnFullIdentity"
    }
    if ![no_returnFullIdentity] {
      mutate {
        merge => {
          "security_result.detection_fields" => "returnFullIdentity_label"
        }
        on_error => "no_returnFullIdentity_label"
      }
    }
  }

  if [acceptBadData] != "" {
    mutate {
      replace => {
        "acceptBadData_label.key" => "acceptBadData"
        "acceptBadData_label.value" => "%{acceptBadData}"
      }
      on_error => "no_acceptBadData"
    }
    if ![no_acceptBadData] {
      mutate {
        merge => {
          "security_result.detection_fields" => "acceptBadData_label"
        }
        on_error => "no_acceptBadData_label"
      }
    }
  }

  if [length] != "" {
    mutate {
      replace => {
        "network.received_bytes" => "%{length}"
      }
      on_error => "no_length"
    }
    if ![no_length] {
      mutate {
        convert => {
          "network.received_bytes" => "uinteger"
        }
        on_error => "no_length_convert"
      }
    }
  }

  if [AuthenticationMethod] == "USER_PASSWORD" {
    mutate {
      replace => {
        "mechanism" => "USERNAME_PASSWORD"
      }
      on_error => "no_AuthenticationMethod"
    }
    if ![no_AuthenticationMethod] {
      mutate {
        merge => {
          "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
        }
        on_error => "no_AuthenticationMethod_merge"
      }
    }
  }

  if [cached] != "" and [CachedAuthentication] == "" {
    mutate {
      replace => {
        "CachedAuthentication" => "%{cached}"
      }
      on_error => "no_cached"
    }
  }

  if [CachedAuthentication] != "" {
    mutate {
      replace => {
        "CachedAuthentication_label.key" => "CachedAuthentication"
        "CachedAuthentication_label.value" => "%{CachedAuthentication}"
      }
      on_error => "no_CachedAuthentication"
    }
    if ![no_CachedAuthentication] {
      mutate {
        merge => {
          "security_result.detection_fields" => "CachedAuthentication_label"
        }
        on_error => "no_CachedAuthentication_label"
      }
    }
  }

  if [requestTimeMillis] not in ["","0"] {
    mutate {
      replace => {
        "network.session_duration.nanos" => "%{requestTimeMillis}"
      }
      on_error => "no_requestTimeMillis"
    }
    mutate {
      convert => {
        "network.session_duration.nanos" => "integer"
      }
      on_error => "no_requestTimeMillis_convert"
    }
  }

  if [proxyConnectionIp] != "" {
    grok {
      match => {
        "proxyConnectionIp" => [
          "%{IP:proxyConnectionIp}"
        ]
      }
      overwrite => ["proxyConnectionIp"]
      on_error => "no_proxyConnectionIp"
    }
    if ![no_proxyConnectionIp] {
      mutate {
        merge => {
          "intermediary.ip" => "proxyConnectionIp"
          "intermediary.asset.ip" => "proxyConnectionIp"
        }
        on_error => "no_proxyConnectionIp_merge"
      }
    }
  }

  if [cvdevice] != "" {
    mutate {
      replace => {
        "cvdevice_label.key" => "cvdevice"
        "cvdevice_label.value" => "%{cvdevice}"
      }
      on_error => "no_cvdevice"
    }
    if ![no_cvdevice] {
      mutate {
        merge => {
          "event.idm.read_only_udm.observer.labels" => "cvdevice_label"
        }
        on_error => "no_cvdevice_label"
      }
    }
  }

  if [hsmEnabled] != "" {
    mutate {
      replace => {
        "hsmEnabled_label.key" => "hsmEnabled"
        "hsmEnabled_label.value" => "%{hsmEnabled}"
      }
      on_error => "no_hsmEnabled"
    }
    if ![no_hsmEnabled] {
      mutate {
        merge => {
          "security_result.detection_fields" => "hsmEnabled_label"
        }
        on_error => "no_hsmEnabled_label"
      }
    }
  }

  if [wrappedMode] != "" {
    mutate {
      replace => {
        "wrappedMode_label.key" => "wrappedMode"
        "wrappedMode_label.value" => "%{wrappedMode}"
      }
      on_error => "no_wrappedMode"
    }
    if ![no_wrappedMode] {
      mutate {
        merge => {
          "security_result.detection_fields" => "wrappedMode_label"
        }
        on_error => "no_wrappedMode_label"
      }
    }
  }

  if [timeMillis] not in ["","0"] {
    mutate {
      replace => {
        "network.session_duration.seconds" => "%{timeMillis}"
      }
      on_error => "no_timeMillis"
    }
    mutate {
      convert => {
        "network.session_duration.seconds" => "integer"
      }
      on_error => "no_timeMillis_convert"
    }
  }

  if [request] != "" {
    mutate {
      replace => {
        "network.http.referral_url" => "%{request}"
      }
      on_error => "no_request"
    }
  }
  if [path] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{path}"
      }
      on_error => "no_path"
    }
  }

  if [merchantId] != "" {
    mutate {
      replace => {
        "merchantId_label.key" => "merchantId"
        "merchantId_label.value.string_value" => "%{merchantId}"
      }
      on_error => "no_merchantId"
    }
    if ![no_merchantId] {
      mutate {
        merge => {
          "additional.fields" => "merchantId_label"
        }
        on_error => "no_merchantId_label"
      }
    }
  }

  if [keyId] != "" {
    mutate {
      replace => {
        "keyId_label.key" => "keyId"
        "keyId_label.value.string_value" => "%{keyId}"
      }
      on_error => "no_keyId"
    }
    if ![no_keyId] {
      mutate {
        merge => {
          "additional.fields" => "keyId_label"
        }
        on_error => "no_keyId_label"
      }
    }
  }

  if [phaseBit] != "" {
    mutate {
      replace => {
        "phaseBit_label.key" => "phaseBit"
        "phaseBit_label.value.string_value" => "%{phaseBit}"
      }
      on_error => "no_phaseBit"
    }
    if ![no_phaseBit] {
      mutate {
        merge => {
          "additional.fields" => "phaseBit_label"
        }
        on_error => "no_phaseBit_label"
      }
    }
  }

  if [leadingDigits] != "" {
    mutate {
      replace => {
        "leadingDigits_label.key" => "leadingDigits"
        "leadingDigits_label.value.string_value" => "%{leadingDigits}"
      }
      on_error => "no_leadingDigits"
    }
    if ![no_leadingDigits] {
      mutate {
        merge => {
          "additional.fields" => "leadingDigits_label"
        }
        on_error => "no_leadingDigits_label"
      }
    }
  }

  if [trailingDigits] != "" {
    mutate {
      replace => {
        "trailingDigits_label.key" => "trailingDigits"
        "trailingDigits_label.value.string_value" => "%{trailingDigits}"
      }
      on_error => "no_trailingDigits"
    }
    if ![no_trailingDigits] {
      mutate {
        merge => {
          "additional.fields" => "trailingDigits_label"
        }
        on_error => "no_trailingDigits_label"
      }
    }
  }

  if [elapsedTimeMillis] != "" {
    mutate {
      replace => {
        "elapsedTimeMillis_label.key" => "elapsedTimeMillis"
        "elapsedTimeMillis_label.value.string_value" => "%{elapsedTimeMillis}"
      }
      on_error => "no_elapsedTimeMillis"
    }
    if ![no_elapsedTimeMillis] {
      mutate {
        merge => {
          "additional.fields" => "elapsedTimeMillis_label"
        }
        on_error => "no_elapsedTimeMillis_label"
      }
    }
  }

   if [authTokens] != "" {
    mutate {
      replace => {
        "authTokens_label.key" => "authTokens"
        "authTokens_label.value.string_value" => "%{authTokens}"
      }
      on_error => "no_authTokens"
    }
    if ![no_authTokens] {
      mutate {
        merge => {
          "additional.fields" => "authTokens_label"
        }
        on_error => "no_authTokens_label"
      }
    }
  }

  if [isUserPassSet] != "" {
    mutate {
      replace => {
        "isUserPassSet_label.key" => "isUserPassSet"
        "isUserPassSet_label.value.string_value" => "%{isUserPassSet}"
      }
      on_error => "no_isUserPassSet"
    }
    if ![no_isUserPassSet] {
      mutate {
        merge => {
          "additional.fields" => "isUserPassSet_label"
        }
        on_error => "no_isUserPassSet_label"
      }
    }
  }

  if [proxyType] != "" {
    mutate {
      replace => {
        "proxyType_label.key" => "proxyType"
        "proxyType_label.value.string_value" => "%{proxyType}"
      }
      on_error => "no_proxyType"
    }
    if ![no_proxyType] {
      mutate {
        merge => {
          "additional.fields" => "proxyType_label"
        }
        on_error => "no_proxyType_label"
      }
    }
  }

  if [attemptedAuthMethods] != "" {
    mutate {
      replace => {
        "attemptedAuthMethods_label.key" => "attemptedAuthMethods"
        "attemptedAuthMethods_label.value.string_value" => "%{attemptedAuthMethods}"
      }
      on_error => "no_attemptedAuthMethods"
    }
    if ![no_attemptedAuthMethods] {
      mutate {
        merge => {
          "additional.fields" => "attemptedAuthMethods_label"
        }
        on_error => "no_attemptedAuthMethods_label"
      }
    }
  }

  if [msg] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{msg}"
      }
      on_error => "no_msg"
    }
  }

  if [out] != "" {
    mutate {
      replace => {
        "out_label.key" => "out"
        "out_label.value.string_value" => "%{out}"
      }
      on_error => "no_out"
    }
    if ![no_out] {
      mutate {
        merge => {
          "additional.fields" => "out_label"
        }
        on_error => "no_out_label"
      }
    }
  }

  if [masked] != "" {
    mutate {
      replace => {
        "masked_label.key" => "masked"
        "masked_label.value.string_value" => "%{masked}"
      }
      on_error => "no_masked"
    }
    if ![no_masked] {
      mutate {
        merge => {
          "additional.fields" => "masked_label"
        }
        on_error => "no_masked_label"
      }
    }
  }

  if [message_data] != "" {
    grok {
      match => {
        "message_data" => [
          "(?P<description>Started Session %{INT:sessionid} of user %{DATA:user}\\.)"
          "\\(%{DATA:user}\\) CMD \\(%{DATA:cmd_line}\\)"
          "(?P<description>Connection from %{IP:src_ip} closed)"
          "(?P<description>Connection from %{HOSTNAME:src_hostname} \\[%{IP:src_ip}\\] \\(on %{IP:dst_ip}\\) opened)"
          "(?P<description>Source %{IP:src_ip} replaced with %{IP:dst_ip})"
          "(?P<description>Connection closed by %{IP:src_ip} port %{INT:src_port} %{GREEDYDATA})"
          "(?P<description>Created slice User %{DATA:tar_user} of %{DATA:user}\\.)"
          "(?P<description>Removed slice User %{DATA:tar_user} of %{DATA:user}\\.)"
          "%{DATA}: (?P<description>%{HOSTNAME:src_hostname} \\[%{IP:src_ip}\\] %{GREEDYDATA})"
          "LogMsgID=%{DATA:log_msg_id}, %{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["description","user","sessionid","cmd_line","src_hostname","src_ip","dst_ip","src_port","tar_user","log_msg_id","kv_data"]
      on_error => "message_data_grok_failed"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user}"
        "has_user" => "true"
      }
      on_error => "no_user"
    }
  }

  if [tar_user] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{tar_user}"
      }
      on_error => "no_tar_user"
    }
  }

  if [sessionid] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{sessionid}"
      }
      on_error => "no_sessionid"
    }
  }

  if [src_hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{src_hostname}"
        "principal.asset.hostname" => "%{src_hostname}"
        "has_principal" => "true"
      }
      on_error => "no_src_hostname"
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "no_src_ip"
    }
    if ![no_src_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [dst_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "dst_ip"
        "target.asset.ip" => "dst_ip"
      }
      on_error => "no_dst_ip"
    }
    if ![no_dst_ip] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [src_port] != "" {
    mutate {
      convert => {
        "src_port" => "integer"
      }
      on_error => "no_src_port"
    }
    mutate {
      rename => {
        "src_port" => "principal.port"
      }
    }
  }


  if [inter_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_hostname}"
      }
      on_error => "no_inter_hostname"
    }
  }

  if [prod_event_name] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{prod_event_name}"
      }
      on_error => "no_prod_event_name"
    }
  }

  if [pid] != "" {
    mutate {
      replace => {
        "target.process.pid" => "%{pid}"
      }
      on_error => "no_pid"
    }
  }

  if [cmd_line] != "" {
    mutate {
      replace => {
        "target.process.command_line" => "%{cmd_line}"
      }
      on_error => "no_cmd_line"
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "VOLTAGE"
      "metadata.vendor_name" => "VOLTAGE"
    }
  }
  if [cef_product] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{cef_product}"
      }
      on_error => "no_cef_product"
    }
  }

  if [has_principal] == "true" and ([has_target] == "true" or [has_user] == "true")and [prod_event_name] =="authenticated user" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "sec_action" => "ALLOW"
      }
    }
  }
  else if [has_principal] == "true" and ([has_target] == "true" or [has_user] == "true") and [prod_event_name] =="failed to authenticate user" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "sec_action" => "BLOCK"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [sec_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sec_action"
      }
      on_error => "no_sec_action"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }

  if [extensions] != "" {
      mutate {
        rename => {
          "extensions" => "event.idm.read_only_udm.extensions"
        }
      }
    }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
