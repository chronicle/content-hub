# Product: AIX_SYSTEM
# Category: OS
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2026-09-02
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "ts" => ""
      "sys_log_host" => ""
      "severity" => ""
      "intermediary" => ""
      "security_result" => ""
      "application" => ""
      "src_ip" => ""
      "src_port" => ""
      "description" => ""
      "kv_data" => ""
      "cmddata"=> ""
      "folder"=> ""
      "reason" => ""
      "module"=> ""
      "pid"=> ""
      "status"=> ""
      "user"=> ""
      "sc_summary" => ""
      "intermediary_hostip" => ""
      "intermediary_hostname" => ""
      "syslog_priority" => ""
      "hostname" => ""
      "command_line" => ""
      "temp2" => ""
      "action" => ""
      "prod_type" => ""
      "dis_name" => ""
      "time" => ""
      "year" => ""
      "nanos" => ""
      "tim" => ""
      "ts_iso" => ""
      "process_type" => ""
      "proto" => ""
      "mechanism" => ""
      "username" => ""
      "certificate" => ""
      "dvc" => ""
      "process" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "srcip" => ""
      "dstip" => ""
      "srcport" => ""
      "dstport" => ""
      "srcname" => ""
      "unauthuser" => ""
      "srcmac" => ""
      "mastersrcmac" => ""
      "dstmac" => ""
      "masterdstmac" => ""
      "srcintf" => ""
      "srcintfrole" => ""
      "dstintf" => ""
      "dstintfrole" => ""
      "srccountry" => ""
      "dstcountry" => ""
      "sessionid" => ""
      "policyid" => ""
      "policytype" => ""
      "poluid" => ""
      "service" => ""
      "policyname" => ""
      "duration" => ""
      "sentbyte" => ""
      "rcvdbyte" => ""
      "sentpkt" => ""
      "rcvdpkt" => ""
      "subtype" => ""
      "poluuid" => ""
      "appcat" => ""
      "osname" => ""
      "dstosname" => ""
      "srcswversion" => ""
      "logid" => ""
      "date" => ""
      "devname" => ""
      "devid" => ""
      "_hardware" => ""
      "type" => ""
      "level" => ""
      "vd" => ""
      "trandisp" => ""
      "vpntype" => ""
      "sentdelta" => ""
      "rcvddelta" => ""
      "dstswversion" => ""
      "unauthusersource" => ""
      "srcserver" => ""
      "dstserver" => ""
      "sec_action" => ""
      "dsthwvendor" => ""
      "dstdevtype" => ""
      "dstfamily" => ""
      "dsthwversion" => ""
      "eventtime" => ""
      "tz" => ""
      "remip" => ""
      "msg" => ""
      "logdesc" => ""
      "remport" => ""
      "locip" => ""
      "locport" => ""
      "dst_host" => ""
      "user_id" => ""
      "path" => ""
      "sendmail_queue_id" => ""
      "Error_Type" => ""
      "target_hostname" => ""
      "ini_parameter" => ""
      "ini_section" => ""
      "backup_ini_file" => ""
      "return_code" => ""
      "instance_name" => ""
      "node_number" => ""
      "process_name" => ""
      "edu_id" => ""
      "edu_name_base" => ""
      "edu_db" => ""
      "edu_num" => ""
      "thread_id" => ""
      "db_name" => ""
      "probe_number" => ""
      "product_name" => ""
      "component_name" => ""
      "function_name" => ""
      "called_product" => ""
      "called_component" => ""
      "called_function" => ""
      "has_target_user" => "false"
      "sec_result_description" => ""
      "user_agent" => ""
      "error_code1" => ""
      "error_code2" => ""
      "library_path" => ""
      "ffdc_info" => ""
      "template_id" => ""
      "location" => ""
      "event_type_details" => ""
      "security_resource_name" => ""
      "timestamp"  => ""
      "security_action_details" => ""
      "security_result_description" => ""
      "root_data" => ""
      "internal_timestamp" => ""
      "roles" => ""
      "mode" => ""
      "has_target_file" => "false"
      "day" => ""
      "month" => ""
      "internal_timestamp_data" => ""
      "command" => ""
      "tar_dis_name" => ""
      "has_target_group" => "false"
      "tar_identifier" => ""
      "admin" => ""
      "command_option" => ""
      "internal_timestamp1" => ""
      "file_name" => ""
      "process_pid" => ""
      "linkname" => ""
      "filename" => ""
      "frompath" => ""
      "topath" => ""
      "additional_description" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", " "]
  }
  mutate {
    gsub => ["message", "\\n", ""]
  }
  grok {
    match => {
      "message" => [
        "(%{SYSLOGTIMESTAMP:ts}|<%{INT}>%{SYSLOGTIMESTAMP:ts}) %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? (?P<action>Accepted (publickey|password)) for %{DATA:username} from %{IP:src_ip} port %{INT:src_port} %{DATA:proto}: %{GREEDYDATA}:%{GREEDYDATA:certificate}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? (?P<action>Disconnected) from user (?P<username>.*?) %{IP:src_ip} port %{INT:src_port}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? (?P<action>Disconnected) from %{IP:src_ip} port %{INT:src_port}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? (?P<action>Received disconnect) from %{IP:src_ip} %{GREEDYDATA} %{INT:src_port}:%{INT}: %{GREEDYDATA:reason}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? (?P<action>Received disconnect) from %{IP:src_ip}: %{INT:src_port}: (?P<reason>.*?)"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? (?P<action>Connection closed by authenticating user) %{DATA:username} %{IP:src_ip} port %{INT:src_port} \\[%{DATA:auth}\\]"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? (?P<action>Connection closed by) %{IP:src_ip} port %{INT:src_port} \\[%{DATA:auth}\\]"
        "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:sys_log_host} %{WORD:severity} %{WORD:application}.* %{IP:src_ip} - %{WORD:user}.*\"%{GREEDYDATA:folder}\"",
        "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:sys_log_host} %{WORD:severity} %{WORD:application}.* %{IP:src_ip} .* \"%{GREEDYDATA:folder}\"",
        "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:sys_log_host} %{WORD:severity} %{WORD:application}.*: SSL Error: %{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:sys_log_host} %{WORD:severity} %{WORD:application}.* AUDIT - %{GREEDYDATA:kv_data}",
        "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:sys_log_host} %{WORD:severity} %{WORD:application}\\[%{INT}\\]:.* CMD \\(%{GREEDYDATA:cmddata}\\)",
        "%{IPV4:intermediary_hostip} %{HOSTNAME:sys_log_host}%{DATA:temp} \\<%{INT:syslog_priority}\\>%{SYSLOGTIMESTAMP:ts} %{DATA:temp1} %{HOSTNAME:hostname}:%{DATA:temp2}: %{GREEDYDATA:description}"
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts} %{DATA:sec_result_description} - - -\\s+ from %{DATA:hostname}: %{DATA:service}: %{WORD:severity} %{DATA:folder}\\[%{DATA:username},%{DATA:poluuid},%{DATA:pid}\\]: %{GREEDYDATA:description}"
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts} %{DATA:sec_result_description} - - -\\s+ from %{DATA:hostname}: %{DATA:service}: %{WORD:severity} %{DATA:folder}\\[%{DATA:username},%{DATA:pid}\\]: %{GREEDYDATA:description}"
        "%{TIMESTAMP_ISO8601:ts_iso} %{DATA} %{HOSTNAME:hostname}:%{DATA:temp2}:\\s+%{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}: (?P<description>from %{DATA:username} .*)",
        "%{SYSLOGTIMESTAMP:ts} Message forwarded from %{HOSTNAME:dst_host}: (?P<application>sshd.*)\\[%{INT:pid}\\]: %{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP:ts} Message forwarded from %{HOSTNAME:hostname}: %{GREEDYDATA:description}",
        "<%{INT}>(?P<reason>Error logging to file),N Message forwarded from %{HOSTNAME:hostname}: %{GREEDYDATA:description}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\]: %{GREEDYDATA:description}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA}: %{GREEDYDATA:description}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc} %{DATA:process}\\[%{INT:pid}\\](:)? "
        "%{SYSLOGTIMESTAMP:ts} %{GREEDYDATA:description}"
        "<%{INT}>%{GREEDYDATA:kv_data}"
      ]
    }
    on_error => "message_grok_failure"
    overwrite => ["ts", "action", "pid", "reason", "dvc", "proto", "process", "username", "certificate", "ts_iso", "time", "sys_log_host", "severity", "application","src_ip","folder","user","description","kv_data","cmddata", "src_port", "intermediary_hostip", "syslog_priority", "hostname", "temp2", "sec_result_description","poluuid","service", "dst_host"]
  }

  if [message_grok_failure] {
    drop {
      tag => "TAG_NO_SECURITY_VALUE"
    }
  }
  if [reason] not in ["", "?"] {
    mutate {
      replace => {
        "security_result.summary" => "%{reason}"
      }
      on_error => "reason_not_found"
    }
  }
  if [dvc] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{dvc}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{dvc}"
        "has_principal" => "true"
      }
      on_error => "dvc_replace_failed"
    }
  }
  if [process] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{process}"
      }
      on_error => "process_replace_failed"
    }
  }
  if [process] =~ "ssh" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "SSH"
      }
    }
  }
  if [ts_iso] != "" {
    date {
      match => ["ts_iso","ISO8601", "RFC3339"]
      on_error => "no_timezone"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data","_",""]
    }
    mutate {
      gsub => ["kv_data",'\\"','']
    }
    mutate {
      gsub => ["kv_data","([A-Za-z]+=)","#$1"]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "kv_data_failed"
    }
  }
  mutate {
    gsub => ["description", "\\t", ""]
  }
  if [description] != "" {
    if [description] =~ "(?i)FS_Mkdir" or [description] =~ "(?i)FS_Chdir" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "%{DATA:prod_type} %{WORD:command} %{WORD:username} %{WORD:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles} mode: %{INT:mode} dir: %{DATA:path}$",
            "(?:%{DATA}:\\s+|)%{WORD:prod_type} %{WORD:command} %{WORD:username} %{WORD:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles} change current directory to:\\s+%{DATA:path}$",
            "%{DATA:prod_type} %{WORD:username} %{WORD:dis_name} %{WORD:action} %{DAY}\\s+(?P<internal_timestamp1>%{MONTH} %{MONTHDAY} %{TIME} %{YEAR})\\s+%{WORD:file_name}\\s+%{INT:process_pid} %{INT:thread_id} change current directory to:\\s+%{NOTSPACE:path}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles","mode","path","internal_timestamp1","file_name","process_pid","thread_id"]
        on_error => "description_grok_failure_FS_Mkdir"
      }
    }
    else if [description] =~ "(?i)GROUP_Remove" or [description] =~ "(?i)GROUP_Change" or [description] =~ "(?i)GROUP_Create" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "%{DATA:prod_type} %{WORD:command} %{WORD:username} %{WORD:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles}\\s+%{WORD:tar_dis_name}\\s+admin=%{WORD:admin}",
            "%{DATA:prod_type} %{WORD:command} %{WORD:username} %{WORD:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles}\\s+%{WORD:tar_dis_name}(\\s+%{GREEDYDATA:command_option}\\s+)?"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "tar_dis_name","admin","command_option"]
        on_error => "description_grok_failure_GROUP_Remove"
      }
    }
    else if [description] =~ "(?i)USER_Change" or [description] =~ "(?i)USER_Remove" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "%{DATA:prod_type} %{WORD:command} %{WORD:username} %{WORD:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles}\\s+%{WORD:user_id}\\s+pgrp=%{WORD:tar_identifier}",
            "%{DATA:prod_type} %{WORD:command} %{WORD:username} %{WORD:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles}\\s+%{WORD:user_id}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "user_id", "tar_identifier"]
        on_error => "description_grok_failure_USER_Change"
      }
    }
    else if [description] =~ "(?i)FILE_Link" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} FILE_Link)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles}\\s+linkname\\s+%{DATA:linkname}\\s+filename\\s+%{GREEDYDATA:filename}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "linkname", "filename"]
        on_error => "description_grok_failure_FILE_Link"
      }
    }
    else if [description] =~ "(?i)FILE_Unlink" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} FILE_Unlink)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles}\\s+filename\\s+%{GREEDYDATA:filename}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "filename"]
        on_error => "description_grok_failure_FILE_Unlink"
      }
    }
    else if [description] =~ "(?i)FILE_Rename" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} FILE_Rename)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?P<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+%{GREEDYDATA:roles}\\s+frompath:\\s+%{DATA:frompath}\\s+topath:\\s+%{GREEDYDATA:topath}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "frompath", "topath"]
        on_error => "description_grok_failure_FILE_Rename"
      }
    }
    else if [description] =~ "(?i)S_PASSWD_READ" or [description] =~ "(?i)S_PASSWD_WRITE" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} S_PASSWD_READ)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+(?<roles>No associated roles|%{DATA:roles})\\s+%{DATA:additional_description}\\s+%{PATH:path}",
            "%{DATA:prod_type}\\s+%{DATA:dis_name}\\s+%{DATA:user} %{DATA:action} %{DATA} %{SYSLOGTIMESTAMP:time} %{YEAR:year} %{GREEDYDATA}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "additional_description", "path", "time", "year", "user"]
        on_error => "description_grok_failure_S_PASSWD_READ"
      }
    }
    else if [description] =~ "(?i)FS_Rmdir" or [description] =~ "(?i)FS_Chroot" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} FS_Rmdir)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+(?<roles>No associated roles|%{DATA:roles})\\s+%{DATA:additional_description}(:)?\\s+%{PATH:path}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "path", "additional_description"]
        on_error => "description_grok_failure_FS_Rmdir"
      }
    }
    else if [description] =~ "(?i)USER_Login" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} USER_Login)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+(?<roles>No associated roles|%{DATA:roles})\\s+user:\\s+%{DATA:user_id}\\s+tty:\\s+%{GREEDYDATA:tty}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "user_id", "tty"]
        on_error => "description_grok_failure_USER_Login"
      }
    }
    else if [description] =~ "(?i)USER_SU" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} USER_SU)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+(?<roles>No associated roles|%{DATA:roles})\\s+%{USERNAME:user_id}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "user_id"]
        on_error => "description_grok_failure_USER_SU"
      }
    }
    else if [description] =~ "(?i)PASSWORD_Change" {
      mutate {
        gsub => ["description", "\\s+", " "]
      }
      grok {
        match => {
          "description" => [
            "((?P<prod_type>%{DATA} PASSWORD_Change)|%{DATA:prod_type}) (%{WORD:command}|(?P<command>%{WORD}-%{WORD})|%{DATA:command}) %{USERNAME:username} %{USERNAME:dis_name} %{WORD:action} (?<internal_timestamp>%{MONTHDAY} %{MONTH} %{YEAR} %{TIME})\\s+(?<roles>No associated roles|%{DATA:roles})\\s+%{USERNAME:user_id}"
          ]
        }
        overwrite => ["prod_type","command","username","dis_name","action","internal_timestamp","roles", "user_id"]
        on_error => "description_grok_failure_PASSWORD_Change"
      }
    }
    else {
      grok {
        match => {
          "description" => [
            "\\s+\\(Recorded using %{DATA:ffdc_info}\\):::Error ID:\\s+:::Reference ID:\\s+:::Template ID:\\s+%{DATA:template_id}:::Details File:\\s+:::Location:\\s+%{DATA:location}\\s+:::%{GREEDYDATA:description}"
            "\\s+%{DATA:prod_type}:\\s+dlopen\\(%{DATA:path}\\) %{DATA:action}:\\s+%{NOTSPACE:error_code1} Cannot load module %{DATA:library_path}.\\s+%{NOTSPACE:error_code2}\\s+%{GREEDYDATA:description}",
            "(?P<process_type>sudo): %{DATA:username} : %{DATA:prod_type} ; TTY=%{DATA:tty} ; PWD=%{GREEDYDATA:path} ; USER=%{GREEDYDATA:user_id} ; COMMAND=%{GREEDYDATA:command_line} "
            "(%{GREEDYDATA:description}: )?(?P<action>Accepted.*) for %{WORD:user} from %{IP:src_ip} port %{INT:src_port}(\\s+%{DATA:proto}$)?"
            "%{GREEDYDATA:description}: error: %{GREEDYDATA:sc_summary}",
            "process ID %{DATA:pid}, command '%{DATA:command_line}',\\s+by user ID %{GREEDYDATA:user_id}"
            "command (?P<command_line>/.*), %{DATA} id %{GREEDYDATA:user}"
            "user %{WORD:user}"
            ":%{IP:src_ip}:%{INT:src_port}"
            "%{DATA:prod_type}\\s+%{DATA:dis_name}\\s+%{DATA:user} %{DATA:action} %{DATA} %{SYSLOGTIMESTAMP:time} %{YEAR:year} %{GREEDYDATA}"
            "\\s+%{DATA:sendmail_queue_id}: %{DATA:Error_Type}\\(%{DATA:username}\\): %{GREEDYDATA}"
            "User: %{DATA:username} Service: %{DATA:service} Port: %{DATA:src_port}\\s+Client connection ID %{DATA:sessionid} Agent: %{DATA:user_agent} %{GREEDYDATA:description}"
            "%{NOTSPACE:prod_type}: Cant read inifile %{PATH:path}: Cannot resolve hostname %{HOSTNAME:target_hostname} for the IP address parameter %{WORD:ini_parameter} in section %{WORD:ini_section}: Hostname and service name not provided or found. Reverting to %{PATH:backup_ini_file}"
            "%{NOTSPACE:prod_type}: Cant read inifile %{PATH:path}: Cannot resolve hostname %{HOSTNAME:target_hostname} for the IP address parameter %{WORD:ini_parameter} in section %{WORD:ini_section}: %{GREEDYDATA:description}"
