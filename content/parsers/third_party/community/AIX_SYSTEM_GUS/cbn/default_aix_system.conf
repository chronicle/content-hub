  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "AIX_SYSTEM"
      "event.idm.read_only_udm.metadata.vendor_name" => "AIX_SYSTEM"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
