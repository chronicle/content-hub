        "event.idm.read_only_udm.target.resource.product_object_id" => "%{field1}"
        "event.idm.read_only_udm.target.user.userid"                => "%{field0}"
      }
    }
    if [field2] != "NA" {
      mutate {
        replace => {
          "label_access.key"  => "Access Mode"
          "label_access.value"=> "%{field2}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.labels" => "label_access"
        }
      }
    }
  }

  # mapped principal.user.attribute.permission : field2|field3
  if [field2] == "R" or [field2] == "W" {
    mutate {
      replace => {
        "perms.description" => "%{field2}"
      }
      on_error => "field_2_invalid"
    }

    if [field2] == "R" {
      mutate {
        replace => {
          "perms.type" => "DATA_READ"
        }
      }
    }
    else {
      mutate {
        replace => {
          "perms.type" => "DATA_WRITE"
        }
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.attribute.permissions" => "perms"
      }
      on_error => "perms_merge_failed"
    }
  }
  else if [field3] == "R" or [field3] == "W" {
    mutate {
      replace => {
        "perms.description" => "%{field3}"
      }
      on_error => "field_3_invalid"
    }

    if [field3] == "R" {
      mutate {
        replace => {
          "perms.type" => "DATA_READ"
        }
      }
    }
    else {
      mutate {
        replace => {
          "perms.type" => "DATA_WRITE"
        }
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.attribute.permissions" => "perms"
      }
      on_error => "perms_merge_failed_2"
    }
  }

  if [uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.product_object_id" => "%{uid}"
      }
    }
  }

  if [agent_hostname] != "" or [atm_hostname] != ""{
    if [agent_hostname] != "" {
       mutate {
         replace => {
           "event.idm.read_only_udm.principal.hostname" => "%{agent_hostname}"
           "event.idm.read_only_udm.principal.asset.hostname" => "%{agent_hostname}"
           "principal_mid_present" => "true"
         }
         on_error => "agent_hostname_invalid"
       }
    }
    else {
       mutate {
         replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{atm_hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{atm_hostname}"
          "principal_mid_present" => "true"
         }
         on_error => "atm_hostname_invalid"
       }
    }

  }

  # User
  if [user_disp_name] != "" and [user_disp_name] != " " {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_disp_name}"
      }
      on_error => "user_disp_name_invalid"
    }
  }

  if [user_role] != "" and [user_role] != " " {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.role_name" => "%{user_role}"
      }
      on_error => "user_role_invalid"
    }
  }

   if [atm_hostname] != "" and [agent_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{atm_hostname}"
      }
      on_error => "atm_hostname_invalid"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }

  # set metadata.event_type
  if [metadata_event_type] == "NETWORK_CONNECTION" and [target_mid_present] == "false" {
    if [principal_mid_present] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  if [metadata_event_type] == "" or [metadata_event_type] == "GENERIC_EVENT" {
    if [principal_mid_present] == "true" {
      mutate {
        replace => {
          "metadata_event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata_event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  if [type] =~ "USER_LOGIN" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [type] =~ "USER_LOGOUT" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [type] =~ "USER_AUTH" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_UNCATEGORIZED"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }

  if [metadata_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{metadata_event_type}"
      }
      on_error => "metadata_event_type_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
