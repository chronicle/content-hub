# Product: GMV CHECKER
# Category: ATM Audit
# Supported Format: SYSLOG, SYSLOG + KV
# Reference: https://www.gmv.com/
# Last Updated: 2025-11-07
# Copyright 2025 Google SecOps
filter {
  mutate {
    replace => {
      "agent_ip" => ""
      "uid"      => ""
      "agent_hostname" => ""
      "time" => ""
      "event_code" => ""
      "severity" => ""
      "event_code_description" => ""
      "csv_data" => ""
      "src_ip" => ""
      "description" => ""
      "desc" => ""
      "field2" => ""
      "_security_result" => ""
      "atm_hostname" => ""
      "type" => ""
      "SecReason" => ""
      "product_event_type" => ""
      "action" => ""
      "collected_timestamp" => ""
      "_asset" => ""
      "field4" => ""
      "field3" => ""
      "user_disp_name" => ""
      "user_role" => ""
      "principal_mid_present" => "false"
      "target_mid_present" => "false"
      "metadata_event_type" => ""
      "kv_data" => ""
      "addr" => ""
      "hostname" => ""
      "UID" => ""
      "exe" => ""
      "pid" => ""
      "terminal" => ""
      "res" => ""
      "ses" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:ts}\\s+%{IPV4:agent_ip}.+?:\\s+\\[%{DATA:atm_hostname}\\]\\[%{INT:event_code}\\]\\[%{DATA:severity}\\]\\[%{DATA:field0}\\|%{DATA:field1}\\|%{DATA:field2}\\|%{DATA:field3}\\|%{DATA:field4}\\|%{DATA:field5}\\]"
        "%{TIMESTAMP_ISO8601:ts}\\s+%{DATA:agent_hostname}\\s.+?\\s+\\[%{DATA:atm_hostname}\\]\\[%{DATA:uid}\\]\\[%{INT:event_code}\\]\\[%{DATA:severity}\\]\\[%{DATA:field0}\\|%{DATA:field1}\\|%{DATA:field2}\\|%{DATA:field3}\\|%{DATA:field4}\\|%{DATA:field5}\\]"
        "%{TIMESTAMP_ISO8601:ts}\\s+.+?:\\s+\\[%{DATA:atm_hostname}\\]\\[%{DATA:uid}\\]\\[%{INT:event_code}\\]\\[%{DATA:severity}\\]\\[%{DATA:field0}\\|%{DATA:field1}\\|%{DATA:field2}\\|%{DATA:field3}\\|%{DATA:field4}\\|%{DATA:field5}\\]"
        "%{TIMESTAMP_ISO8601:ts}\\s+.+?:\\s+\\[%{DATA:atm_hostname}\\]\\[%{INT:event_code}\\]\\[%{DATA:severity}\\]\\[%{DATA:field0}\\|%{DATA:field1}\\|%{DATA:field2}\\|%{DATA:field3}\\|%{DATA:field4}\\|%{DATA:field5}\\]"
        "<%{INT}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s+%{DATA:atm_hostname}\\s+%{DATA:product_event_type}\\s+%{TIMESTAMP_ISO8601:ts}\\|\\[%{DATA:type}\\]\\|%{IP:agent_ip}\\|%{DATA:userid}\\|%{DATA:SecReason}\\;\\s+%{DATA:uid}:\\s+%{DATA};\\s+VPN status:\\s+%{DATA:action};%{GREEDYDATA}\|"
        "<%{INT}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s+%{DATA:atm_hostname}\\s+%{DATA:product_event_type}\\s+%{TIMESTAMP_ISO8601:ts}\\|\\[%{DATA:type}\\]\\|%{IP:agent_ip}\\|%{DATA:userid}\\|%{DATA:SecReason}\\.\\s+%{DATA};name=%{DATA:name};%{GREEDYDATA}\\|",
        "<%{INT}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s+%{DATA:atm_hostname}\\s+%{DATA:product_event_type}\\s+%{TIMESTAMP_ISO8601:ts}\\s+%{LOGLEVEL:severity}\\s+\\[%{DATA:type}:%{INT}\\]\\s+-\\s+%{IP:agent_ip}\\|%{DATA:userid}\\|%{GREEDYDATA:SecReason}\\|",
        "<%{INT}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s+%{DATA:atm_hostname}\\s+%{DATA:product_event_type}\\s+%{TIMESTAMP_ISO8601:ts}\\s+%{LOGLEVEL:severity}\\s+\\[%{DATA:type}:%{INT}\\]\\s+-\\s+%{GREEDYDATA:description}",
        "<%{INT}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s+%{DATA:atm_hostname}\\s+%{DATA:product_event_type}\\s+%{TIMESTAMP_ISO8601:ts}\\|\\[%{DATA:type}\\]\\|%{IP:agent_ip}\\|%{DATA:userid}\\|%{GREEDYDATA:SecReason}\\|"
        "<%{INT}>%{SYSLOGTIMESTAMP:collected_timestamp}\\s+%{DATA:atm_hostname}\\s+%{DATA:product_event_type}\\s+%{TIMESTAMP_ISO8601:ts}\\|\\[%{DATA:type}\\]\\|%{DATA}\\|%{DATA:userid}\\|%{GREEDYDATA:SecReason}\\|"
        "\"%{TIMESTAMP_ISO8601:ts}\",\"%{DATA:atm_hostname}\",\"%{DATA:user_disp_name}\",%{DATA},%{DATA},\"%{DATA:status}\",%{DATA},%{DATA},%{DATA},\"%{DATA:event_code}\",\"%{DATA:user_role}\""
        "%{SYSLOGTIMESTAMP:collected_timestamp}\\s+%{DATA:agent_hostname} %{DATA}: %{GREEDYDATA:kv_data}"
      ]
    }
    overwrite => ["agent_ip", "uid", "agent_hostname", "ts", "event_code", "severity", "field2", "field4", "type", "SecReason", "product_event_type", "atm_hostname", "action", "collected_timestamp", "field3", "user_disp_name", "user_role", "kv_data", "description"]
    on_error => "header_grok_match_failed"
  }

  mutate {
    gsub => ["atm_hostname", " ", ""]
  }
  mutate {
    gsub => ["event_code", " ", ""]
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  if [description] != "" {
    grok {
      match => {
        "description" => [
          "%{GREEDYDATA} IP \\[%{IP:src_ip}\\]"
        ]
      }
      overwrite => ["src_ip"]
      on_error => "description_ip_grok_failed"
    }
    if ![description_ip_grok_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
        }
        on_error => "src_ip_merge_failed"
      }
      if ![src_ip_merge_failed] {
        mutate {
          replace => {
            "principal_mid_present" => "true"
          }
        }
      }
    }
    mutate {
      replace => {
        "event_code_description" => "%{description}"
      }
      on_error => "description_not_found_2"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "\\\"", ""]
    }
    mutate {
      gsub => ["kv_data", "msg=", ""]
    }
    mutate {
      gsub => ["kv_data", "'", ""]
    }
    mutate {
      gsub => ["kv_data", "(\\S+=)", "#$1"]
    }

    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "kv_fail"
    }

    if [addr] not in ["", "?"] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "addr"
        }
        on_error => "no_addr"
      }
    }

    if [hostname] != "" {
      mutate {
        replace => {
          "agent_hostname" => "%{hostname}"
        }
        on_error => "no_hostname"
      }
    }

    if [UID] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{UID}"
        }
        on_error => "no_userid"
      }
    }

    if [exe] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.file.full_path" => "%{exe}"
        }
        on_error => "no_exe"
      }
    }

    if [pid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{pid}"
        }
        on_error => "no_pid"
      }
    }

    if [ses] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.session_id" => "%{ses}"
        }
        on_error => "no_ses"
      }
    }

    if [terminal] =~ "ssh" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "SSH"
        }
      }
    }

    if [res] != "" {
      mutate {
        replace => {
          "_security_result.summary" => "%{res}"
        }
        on_error => "no_res"
      }
    }
  }
  date {
    match => [ "ts", "ISO8601","yyyy-MM-dd HH:mm:ss"]
    on_error => "date_match_failed"
  }
  if [date_match_failed] {
    date {
      match => [ "ts", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
      rebase => true
      on_error => "date_match_failed_2"
    }
  }


  # UDM > Metadata
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name"        => "GMV"
      "event.idm.read_only_udm.metadata.product_name"       => "Checker"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{event_code}"
      "metadata_event_type"                                 => "GENERIC_EVENT"
    }
    on_error => "event_code_invalid"
  }
  if [product_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_invalid"
    }
  }

  if [collected_timestamp] != "" {
    date {
      match => ["collected_timestamp","MMM dd yyyy HH:mm:ss", "MMM d HH:mm:ss", "MMM dd HH:mm:ss"]
      rebase => true
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "date_match_failed_2"
    }
  }

  if [type] != "" and [type] == "USER_AUDIT" {
    mutate {
      replace => {
        "metadata_event_type"         => "USER_UNCATEGORIZED"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
        "event.idm.read_only_udm.principal.user.userid" => "%{userid}"
      }
    }
    if [SecReason] != "" {
      mutate {
        replace => {
          "_security_result.description" => "%{SecReason}"
        }
      }
    }
    if [action] != "" {
      mutate {
        replace => {
          "_security_result.action_details" => "%{action}"
        }
      }
    }
  }

  if [event_code] == "100"   { mutate { replace => { "event_code_description" => "Checker Agent is ready" }}}
  else if [event_code] == "200"   { mutate { replace => { "event_code_description" => "Checker Agent in execution" }}}
  else if [event_code] == "311"   { mutate { replace => { "event_code_description" => "Next ACL hash signature is not valid" }}}
  else if [event_code] == "315"   { mutate { replace => { "event_code_description" => "Error while opening local ACL file" }}}
  else if [event_code] == "1000"  { mutate { replace => { "event_code_description" => "A system process hash signature is not valid" }}}
  else if [event_code] == "1001"  { mutate { replace => { "event_code_description" => "A system process hash signature is not valid" }}}
  else if [event_code] == "1010"  { mutate { replace => { "event_code_description" => "User process not allowed. Execution denied" }}}
  else if [event_code] == "1011"  { mutate { replace => { "event_code_description" => "User process not allowed. Execution denied" }}}
  else if [event_code] == "1020"  { mutate { replace => { "event_code_description" => "User process signature not valid. Execution denied" }}}
  else if [event_code] == "1021"  { mutate { replace => { "event_code_description" => "User process signature not valid. Execution denied" }}}
  else if [event_code] == "1030"  { mutate { replace => { "event_code_description" => "User process signature not valid. Execution allowed" }}}
  else if [event_code] == "1031"  { mutate { replace => { "event_code_description" => "User process signature not valid. Execution allowed" }}}
  else if [event_code] == "1040"  { mutate { replace => { "event_code_description" => "The user is not allowed to execute the process" }}}
  else if [event_code] == "1041"  { mutate { replace => { "event_code_description" => "The user is not allowed to execute the process" }}}
  else if [event_code] == "1050"  { mutate { replace => { "event_code_description" => "User process not allowed. Execution denied. Null process path!" }}}
  else if [event_code] == "1060"  { mutate { replace => { "event_code_description" => "User process not allowed. Execution denied. Null image path!" }}}
  else if [event_code] == "2000"  { mutate { replace => { "event_code_description" => "DLL usage not allowed. DLL Access denied to process" }}}
  else if [event_code] == "2001"  { mutate { replace => { "event_code_description" => "DLL usage not allowed. DLL Access denied to process" }}}
  else if [event_code] == "2010"  { mutate { replace => { "event_code_description" => "DLL signature not valid. DLL usage denied" }}}
  else if [event_code] == "2011"  { mutate { replace => { "event_code_description" => "DLL signature not valid. DLL usage denied" }}}
  else if [event_code] == "2020"  { mutate { replace => { "event_code_description" => "DLL signature not valid. DLL usage allowed" }}}
  else if [event_code] == "2021"  { mutate { replace => { "event_code_description" => "DLL signature not valid. DLL usage allowed" }}}
  else if [event_code] == "3000"  { mutate { replace => { "event_code_description" => "Java resource not allowed. Access denied" }}}
  else if [event_code] == "3001"  { mutate { replace => { "event_code_description" => "Java resource not allowed. Access denied" }}}
  else if [event_code] == "3010"  { mutate { replace => { "event_code_description" => "Java resource signature not valid. Access denied" }}}
  else if [event_code] == "3011"  { mutate { replace => { "event_code_description" => "Java resource signature not valid. Access denied" }}}
  else if [event_code] == "3020"  { mutate { replace => { "event_code_description" => "Java resource signature not valid. Access allowed" }}}
  else if [event_code] == "3021"  { mutate { replace => { "event_code_description" => "Java resource signature not valid. Access allowed" }}}
  else if [event_code] == "4000"  { mutate { replace => { "event_code_description" => "Read access not allowed. File or directory read access denied" }}}
  else if [event_code] == "4001"  { mutate { replace => { "event_code_description" => "Read access not allowed. File or directory read access denied" }}}
  else if [event_code] == "4010"  { mutate { replace => { "event_code_description" => "Write access not allowed. File or directory write access denied" }}}
  else if [event_code] == "4011"  { mutate { replace => { "event_code_description" => "Write access not allowed. File or directory write access denied" }}}
  else if [event_code] == "4020"  { mutate { replace => { "event_code_description" => "File signature not valid. Access allowed" }}}
  else if [event_code] == "4021"  { mutate { replace => { "event_code_description" => "File signature not valid. Access allowed" }}}
  else if [event_code] == "4030"  { mutate { replace => { "event_code_description" => "File signature not valid. Access denied" }}}
  else if [event_code] == "4031"  { mutate { replace => { "event_code_description" => "File signature not valid. Access denied" }}}
  else if [event_code] == "4040"  { mutate { replace => { "event_code_description" => "Interpreter process has tried to write a non-existent resource. Access denied" }}}
  else if [event_code] == "4041"  { mutate { replace => { "event_code_description" => "Interpreter process has tried to write a non-existent resource. Access denied" }}}
  else if [event_code] == "4050"  { mutate { replace => { "event_code_description" => "Track 2 writing detected in file" }}}
  else if [event_code] == "4051"  { mutate { replace => { "event_code_description" => "Track 2 writing detected in file" }}}
  else if [event_code] == "4060"  { mutate { replace => { "event_code_description" => "Read access not allowed. Random path resource read access denied." }}}
  else if [event_code] == "4061"  { mutate { replace => { "event_code_description" => "Read access not allowed. Random path resource read access denied." }}}
  else if [event_code] == "4070"  { mutate { replace => { "event_code_description" => "Write access not allowed. Random path file write access denied." }}}
  else if [event_code] == "4071"  { mutate { replace => { "event_code_description" => "Write access not allowed for a random path resource. The defined rule about the resource will be obsolete." }}}
  else if [event_code] == "4100"  { mutate { replace => { "event_code_description" => "Read access not allowed. Registry read access denied" }}}
  else if [event_code] == "4101"  { mutate { replace => { "event_code_description" => "Read access not allowed. Registry read access denied" }}}
  else if [event_code] == "4110"  { mutate { replace => { "event_code_description" => "Write access not allowed. Registry write access denied" }}}
  else if [event_code] == "4111"  { mutate { replace => { "event_code_description" => "Write access not allowed. Registry write access denied" }}}
  else if [event_code] == "5000"  { mutate { replace => { "event_code_description" => "Listen port not allowed. Port open for incoming?| connectionsdenied" }}}
  else if [event_code] == "5001"  { mutate { replace => { "event_code_description" => "Listen port not allowed. Port open for incoming connections denied." }}}
  else if [event_code] == "5010"  { mutate { replace => { "event_code_description" => "Proccess is not allowed to open port for incoming connections. Port open denied" }}}
  else if [event_code] == "5011"  { mutate { replace => { "event_code_description" => "Proccess is not allowed to open port for incoming connections. Port open denied" }}}
  else if [event_code] == "6000"  { mutate { replace => { "event_code_description" => "Incoming connection notallowed. Connection denied" }}}
  else if [event_code] == "6001"  { mutate { replace => { "event_code_description" => "Incoming connection not allowed. Connection denied" }}}
  else if [event_code] == "6010"  { mutate { replace => { "event_code_description" => "Outgoing connection not allowed. Connection denied" }}}
  else if [event_code] == "6011"  { mutate { replace => { "event_code_description" => "Outgoing connection not allowed. Connection denied" }}}
  else if [event_code] == "6020"  { mutate { replace => { "event_code_description" => "Incoming packet not allowed. The packet is filtered" }}}
  else if [event_code] == "6021"  { mutate { replace => { "event_code_description" => "Incoming packet not allowed. The packet is filtered" }}}
  else if [event_code] == "6030"  { mutate { replace => { "event_code_description" => "Outoging packet not allowed. The packet is filtered" }}}
  else if [event_code] == "6031"  { mutate { replace => { "event_code_description" => "Outoging packet not allowed. The packet is filtered." }}}
  else if [event_code] == "6040"  { mutate { replace => { "event_code_description" => "Incoming packet received from a remote system not allowed. The packet is filtered" }}}
  else if [event_code] == "6041"  { mutate { replace => { "event_code_description" => "Incoming packet received from a remote system not allowed. The packet is filtered" }}}
  else if [event_code] == "6070"  { mutate { replace => { "event_code_description" => "IP packet not allowed" }}}
  else if [event_code] == "6071"  { mutate { replace => { "event_code_description" => "IP packet not allowed " }}}
  else if [event_code] == "7000"  { mutate { replace => { "event_code_description" => "Execution of untrusted process" }}}
  else if [event_code] == "7010"  { mutate { replace => { "event_code_description" => "Port open denied for untrusted process" }}}
  else if [event_code] == "7020"  { mutate { replace => { "event_code_description" => "Port open allowed for untrusted process" }}}
  else if [event_code] == "7030"  { mutate { replace => { "event_code_description" => "Access to restricted resource allowed for untrusted process" }}}
  else if [event_code] == "7040"  { mutate { replace => { "event_code_description" => "Access to non restricted resource allowed for untrusted process" }}}
  else if [event_code] == "7050"  { mutate { replace => { "event_code_description" => "Process or resource signature not valid. Allowed" }}}
  else if [event_code] == "7060"  { mutate { replace => { "event_code_description" => "Access to restricted resource allowed for trusted process without permission" }}}
  else if [event_code] == "7070"  { mutate { replace => { "event_code_description" => "Access to undefined Java resource allowed" }}}
  else if [event_code] == "7080"  { mutate { replace => { "event_code_description" => "IP packet allowed though the protocol is not allowed" }}}
  else if [event_code] == "7100"  { mutate { replace => { "event_code_description" => "Incoming TCP connection allowed for untrusted process" }}}
  else if [event_code] == "7110"  { mutate { replace => { "event_code_description" => "Incoming TCP connection denied process" }}}
  else if [event_code] == "7120"  { mutate { replace => { "event_code_description" => "Outgoing TCP connection allowed for untrusted process" }}}
  else if [event_code] == "7130"  { mutate { replace => { "event_code_description" => "Outgoing TCP connection denied for untrusted process" }}}
  else if [event_code] == "7140"  { mutate { replace => { "event_code_description" => "Incoming UDP datagram allowed for untrusted process" }}}
  else if [event_code] == "7150"  { mutate { replace => { "event_code_description" => "Incoming UDP datagram denied for untrusted process" }}}
  else if [event_code] == "7160"  { mutate { replace => { "event_code_description" => "Outgoing UDP datagram allowed for untrusted process" }}}
  else if [event_code] == "7170"  { mutate { replace => { "event_code_description" => "Outgoing UDP datagram denied for untrusted process " }}}
  else if [event_code] == "7180"  { mutate { replace => { "event_code_description" => "Execution of a Java process not defined as interpreter accessing a resource is allowed under operator mode" }}}
  else if [event_code] == "7190"  { mutate { replace => { "event_code_description" => "Execution of a Java process not defined as interpreter accessing a resource is allowed under operator mode" }}}
  else if [event_code] == "7200"  { mutate { replace => { "event_code_description" => "Access to restricted random resource allowed for untrusted process" }}}
  else if [event_code] == "7210"  { mutate { replace => { "event_code_description" => "Access to restricted random resource allowed for trusted process without permission" }}}
  else if [event_code] == "7777"  { mutate { replace => { "event_code_description" => "Maximum operator time finished" }}}
  else if [event_code] == "8000"  { mutate { replace => { "event_code_description" => "New Checker Agent detected. Agent is auto provisioned" }}}
  else if [event_code] == "8010"  { mutate { replace => { "event_code_description" => "Checker Agent delete detected. Agent is reasigned." }}}
  else if [event_code] == "8020"  { mutate { replace => { "event_code_description" => "Checker Agent connection establishment detected" }}}
  else if [event_code] == "8030"  { mutate { replace => { "event_code_description" => "Checker Agent disconnect detected" }}}
  else if [event_code] == "8040"  { mutate { replace => { "event_code_description" => "A Checker Agent has changed its IP Address" }}}
  else if [event_code] == "8050"  { mutate { replace => { "event_code_description" => "Checker Agent inactive. Stated set to off-line" }}}
  else if [event_code] == "8060"  { mutate { replace => { "event_code_description" => "Checker Agent reactive the connection again" }}}
  else if [event_code] == "8080"  { mutate { replace => { "event_code_description" => "The device has reported an agent change" }}}
  else if [event_code] == "8085"  { mutate { replace => { "event_code_description" => "The device has reported an illegal agent change" }}}
  else if [event_code] == "8100"  { mutate { replace => { "event_code_description" => "Your system has mrun out of free licenses. The new ATM is not signed up" }}}
  else if [event_code] == "9000"  { mutate { replace => { "event_code_description" => "Checker Agent is in CRITICAL mode" }}}
  else if [event_code] == "9003"  { mutate { replace => { "event_code_description" => "Incorrect ACL" }}}
  else if [event_code] == "9004"  { mutate { replace => { "event_code_description" => "ACL loaded correctly" }}}
  else if [event_code] == "9005"  { mutate { replace => { "event_code_description" => "Update ACL process started" }}}
  else if [event_code] == "9009"  { mutate { replace => { "event_code_description" => "Checker Agent is in ACTIVE mode" }}}
