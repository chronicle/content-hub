# Product: Proofpoint_CASB
# Category: CASB
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-01-16
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "id" => ""
      "tenant_id" => ""
      "severity" => ""
      "title" =>  ""
      "description" => ""
      "type" => ""
      "sub_type" => ""
      "event1.agent.kind" => ""
      "event1.agent.version" => ""
      "event1.agent.id" => ""
      "event1.endpoint.hostname" => ""
      "event1.endpoint.fqdn" => ""
      "event1.endpoint.os.kind" => ""
      "event1.endpoint.os.version" => ""
      "event1.endpoint.location.ip" => ""
      "geo_latitude" => ""
      "geo_longitude" => ""
      "event1.endpoint.id" => ""
      "event1.esUrl" => ""
      "event1.process.executable.path" => ""
      "event1.process.pid" => ""
      "event1.process.ppid" => ""
      "event1.endpoint.location.geo.address.country.code" => ""
      "event1.feed.region" => ""
      "event1.feed.connection.source.ip" => ""
      "event1.feed.id" => ""
      "event1.feed.instance" => ""
      "event1.session.id" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "additional" => ""
      "file_set" => "false"
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "event1.occurredAt" => ""
      "event1.observedAt" => ""
      "event1.createdAt" => ""
      "event1.updatedAt" => ""
      "event1.inspectedAt" => ""
      "event1.ingestedAt" => ""
      "event1.expiresAt" => ""
      "event1.time.local.date" => ""
      "event1.sver" => ""
      "event1.iver" => ""
      "event1.id" => ""
      "activity.primaryCategory" => ""
      "user.id" => ""
      "user.name" => ""
      "user.firstName" => ""
      "user.lastName" => ""
      "user.displayName" => ""
      "user.email" => ""
      "site.url" => ""
      "site.name" => ""
      "site.contentType" => ""
      "remote.protocol" => ""
      "remote.client.agent.name" => ""
      "remote.client.agent.description" => ""
      "remote.client.device.os.name" => ""
      "remote.host.ip.address" => ""
      "remote.geo.coordinates.lat" => ""
      "remote.geo.coordinates.lon" => ""
      "remote.geo.address.country.name" => ""
      "remote.geo.address.area1.name" => ""
      "remote.geo.address.area2.name" => ""
      "resource_name" => ""
      "resource_extension" => ""
      "resource_url" => ""
      "resource_contentType" => ""
      "entity.suite" => ""
      "entity.name" => ""
      "organization.customer.name" => ""
      "organization.customer.alias" => ""
      "remote.host.ip.isp.name" => ""
      "remote.host.ip.domain" => ""
      "activity.trigger" => ""
      "action_kind" => ""
      "object_kind" => ""
      "object_ref_index" => ""
      "action_status" => ""
      "signal_kind" => ""
      "group_name" => ""
      "user.directory.department.name" => ""
      "user.directory.office.name" => ""
      "user.directory.country.code" => ""
      "user.directory.city.name" => ""
      "resource_id" => ""
      "resource_kind" => ""
      "resource_size" => ""
      "resource_url_from_list" => ""
      "resource_location_name" => ""
      "resource_created_at" => ""
      "resource_modified_at" => ""
      "resource_owner_name" => ""
      "resource_tracking_source_id" => ""
      "resource_tracking_genesis_resource_id" => ""
      "resource_system_origin_id" => ""
      "resource_host" => ""
      "resource_path" => ""
      "resource_container_name" => ""
      "resource__derivatives_direction_target_path" => ""
      "resource__derivatives_direction_target_name" => ""
      "resource_labels" => ""
      "resource_classification" => ""
      "has_user" => "false"
      "has_target_resource" => "false"
      "feed.region" => ""
      "has_target_file" => ""
      "organization.customer.id" => ""
      "geoloc" => ""
      "geo_location_0" => ""
      "geo_location_1" => ""
      "metadata_extracted_fields" => ""
      "intermediary" => ""
      "event1.user.directory.department" => ""
      "event1_user_directory_department_name" => ""
      "event1_user_directory_company_name" => ""
      "event1_agent_pid" => ""
      "event1_activity_primaryCategory" => ""
      "event1_feed_vendor" => ""
      "event1_feed_product" => ""
      "event1_user_email" => ""
      "event1_user_user_display_name" => ""
      "event1_user_directory_title" => ""
      "event1_process_application_name" => ""
      "event1_user_directory_manager_email" => ""
      "event1_site_url" => ""
    }
  }

  mutate {
    gsub => ["message", "event", "event1"]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [event1][feed][region] != "" {
    mutate {
      replace => {
        "principal.asset.location.country_or_region" => "%{event1.feed.region}"
      }
      on_error => "feed_region_empty"
    }
  }
  if [event1][feed][connection][source][ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "event1.feed.connection.source.ip"
        "principal.asset.ip" => "event1.feed.connection.source.ip"
      }
      on_error => "feed_connection_source_ip_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [event1][feed][id] != "" {
    mutate {
      replace => {
        "principal.asset.asset_id" => "ID: %{event1.feed.id}"
      }
      on_error => "feed_id_empty"
    }
  }
  if [event1][feed][instance] != "" {
    mutate {
      replace => {
        "principal.asset.product_object_id" => "%{event1.feed.instance}"
      }
      on_error => "feed_instance_empty"
    }
  }
  if [event1][agent][id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{event1.agent.id}"
      }
      on_error => "agent_id_empty"
    }
  }
  if [event1][endpoint][os][kind] =~ "(?i)(mac|MacOS)" {
    mutate {
      replace => {
        "target.platform" => "MAC"
      }
    }
  }
  else if [event1][endpoint][os][kind] =~ "(?i)(win|windows)" {
    mutate {
      replace => {
        "target.platform" => "WINDOWS"
      }
    }
  }
  else if [event1][endpoint][os][kind] =~ "(?i)(lin|linux)" {
    mutate {
      replace => {
        "target.platform" => "LINUX"
      }
    }
  }
  if [event1][endpoint][os][version] != "" {
    mutate {
      replace => {
        "target.platform_version" => "%{event1.endpoint.os.version}"
      }
      on_error => "endpoint_os_version_not_found"
    }
  }
  for interface in event1.endpoint.net.interfaces {
    mutate {
      merge => {
        "target.ip" => "interface.ip"
        "target.asset.ip" => "interface.ip"
      }
      on_error => "interface_ip_not_found"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }
  if [event1][endpoint][location][ip] != "" {
    mutate {
      merge => {
        "target.nat_ip" => "event1.endpoint.location.ip"
      }
      on_error => "endpoint_location_ip_not_found"
    }
  }
  if [event1][agent][kind] != "" {
    mutate {
      replace => {
        "additional_kind.value.string_value" => "%{event1.agent.kind}"
      }
      on_error => "agent_kind_empty"
    }
    if ![agent_kind_empty] {
      mutate {
        replace => {
          "additional_kind.key" => "agent kind"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "additional_kind"
        }
        on_error => "additional_kind_empty"
      }
    }
  }
  if [event1][agent][version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{event1.agent.version}"
      }
      on_error => "agent_version_empty"
    }
  }
  else if [event1][sver] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{event1.sver}"
      }
      on_error => "no_sver"
    }
  }


  if [event1][endpoint][hostname] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{event1.endpoint.hostname}"
        "target.asset.hostname" => "%{event1.endpoint.hostname}"
        "has_target" => "true"
      }
      on_error => "endpoint_hostname_empty"
    }
  }

  if [event1][endpoint][fqdn] != "" {
    mutate {
      replace => {
        "target.administrative_domain" => "%{event1.endpoint.fqdn}"
      }
      on_error => "endpoint_fqdn_empty"
    }
  }

  if  [event1][endpoint][id] != "" {
    mutate {
      replace => {
        "target.process.product_specific_process_id"  => "id:%{event1.endpoint.id}"
      }
      on_error => "endpoint_id_empty"
    }
  }

  if [event1][endpoint][location][geo][address][country][code] != "" {
    mutate {
      replace => {
        "target.location.country_or_region" => "%{event1.endpoint.location.geo.address.country.code}"
      }
      on_error => "country_code_empty"
    }
  }

  mutate {
    convert => {
      "event1.endpoint.location.geo.coordinates.lat" => "string"
    }
    on_error => "geo_latitude_int_already_string"
  }

  mutate {
    gsub => ["message",'\\}\\\"\\}','}}']
  }
  mutate {
    gsub => ["message",'\\\"body\\\": \\\"\\{','\"body\": {']
  }

  mutate {
    replace => {
      "geo_latitude" => "%{event1.endpoint.location.geo.coordinates.lat}"
    }
    on_error => "geo_latitude_empty"
  }

  if [geo_latitude] != "" {
    mutate {
      rename => {
        "geo_latitude" => "target.location.region_latitude"
      }
    }
  }
  mutate {
    convert => {
      "target.location.region_latitude" => "float"
    }
    on_error => "geo_latitude_already_float"
  }

  mutate {
    convert => {
      "event1.endpoint.location.geo.coordinates.lon" => "string"
    }
    on_error => "geo_longitude_int_already_string"
  }

  mutate {
    replace => {
      "geo_longitude" => "%{event1.endpoint.location.geo.coordinates.lon}"
    }
    on_error => "geo_longitude_empty"
  }

  if [geo_longitude] != "" {
    mutate {
      rename => {
        "geo_longitude" => "target.location.region_longitude"
      }
    }
  }
  mutate {
    convert => {
      "target.location.region_longitude" => "float"
    }
    on_error => "geo_longitude_already_float"
  }

  if [event1][process][pid] != "" {
    mutate {
      convert => {
        "event1.process.pid" => "string"
      }
      on_error => "process_pid_already_string"
    }
    mutate {
      replace => {
        "target.process.pid" => "%{event1.process.pid}"
      }
      on_error => "process_pid_empty"
    }
  }
  if [event1][process][ppid] != "" {
    mutate {
      convert => {
        "event1.process.ppid" => "string"
      }
      on_error => "process_ppid_already_string"
    }
    mutate {
      replace => {
        "target.process.parent_process.pid" => "%{event1.process.ppid}"
      }
      on_error => "process_ppid_empty"
    }
  }

  if [event1][process][executable][path] != "" {
    mutate {
      gsub => ["event1.process.executable.path","\\\\",'\\']
    }
    mutate {
      replace => {
        "target.process.file.full_path" => "%{event1.process.executable.path}"
      }
      on_error => "process_executable_path_empty"
    }
  }

  if [event1][esUrl] != "" {
    mutate {
      replace => {
        "metadata.url_back_to_product" => "%{event1.esUrl}"
      }
      on_error => "esUrl_empty"
    }
  }

  for resource in event1.resources {
    mutate {
      replace => {
        "path" => ""
        "name" => ""
        "extension" => ""
        "file_size" => ""
      }
    }
    mutate {
      replace => {
        "kind_type" => "%{resource.kind}"
      }
      on_error => "no_kind"
    }
    if ![no_kind] and [kind_type] == "file" and [file_set] == "false" {
      mutate {
        replace => {
          "path" => "%{resource.path}"
        }
        on_error => "no_path"
      }
      mutate {
        replace => {
          "name" => "%{resource.name}"
        }
        on_error => "no_name"
      }
      mutate {
        gsub => ["path","\\\\",'\\']
      }
      if ![no_path] and ![no_name] {
        mutate {
          replace => {
            "principal.process.file.full_path" => "%{path}\\%{name}"
            "file_set" => "true"
          }
          on_error => "no_file_path"
        }
      }
      mutate {
        replace => {
          "extension" => "%{resource.extension}"
        }
        on_error => "no_extension"
      }
      if ![no_extension] {
        mutate {
          replace => {
            "principal.process.file.mime_type" => "%{extension}"
            "file_set" => "true"
          }
        }
      }
      mutate {
        convert => {
          "resource.size" => "string"
        }
        on_error => "already_string"
      }
      mutate {
        replace => {
          "file_size" => "%{resource.size}"
        }
        on_error => "file_size_empty"
      }
      if [file_size] != "" {
        mutate {
          convert => {
            "file_size" => "uinteger"
          }
          on_error => "conversion_failure"
        }
        mutate {
          rename => {
            "file_size" => "principal.process.file.size"
          }
          replace => {
            "file_set" => "true"
          }
        }
      }
    }
  }

  for indicator in event1.indicators {
    mutate {
      replace => {
        "sec_res" => ""
        "indicator.description" => ""
      }
    }
    mutate {
      convert => {
        "indicator.iver" => "string"
      }
      on_error => "iver_already_string"
    }
    mutate {
      replace => {
        "sec_res.rule_name" => "%{indicator.kind}"
      }
      on_error => "indicator_kind_empty"
    }
    mutate {
      replace => {
        "sec_res.rule_id" => "%{indicator.id}"
      }
      on_error => "indicator_id_empty"
    }
    mutate {
      replace => {
        "sec_res.summary" => "%{indicator.name}"
      }
      on_error => "indicator_name_empty"
    }

    if [indicator][description] != "" {
      mutate {
        replace => {
          "sec_res.description" => "%{indicator.description}"
        }
        on_error => "indicator_description_empty"
      }
    }
    if [sec_res] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "sec_res"
        }
        on_error => "sec_res_empty"
      }
    }
  }

  for action in event1.processing.actions {
    if [action] != "" {
      for action_key, action_value in action map {
        mutate {
          replace => {
            "action_map_label" => ""
          }
        }
        if [action_key] != "" {
          mutate {
            replace => {
              "action_map_label.key" => "processing_action %{action_key}"
            }
            on_error => "invalid_action_key"
          }
        }
        if [action_value] != "" {
          mutate {
            replace => {
              "action_map_label.value" => "%{action_value}"
            }
            on_error => "nested_action_value"
          }
          if ![nested_action_value] {
            mutate {
              merge => {
                "security_result.detection_fields" => "action_map_label"
              }
              on_error => "action_map_label_merge_failed"
            }
          }
        }
      }
    }
  }

  for instance in event1.organization.instances  {
    for key, value in instance map {
      mutate {
        replace => {
          "instances_map_label" => ""
        }
      }
    }
    if [key] != "" {
      mutate {
        replace => {
          "instances_map_label.key" => "Instance %{key}"
        }
        on_error => "invalid_key"
      }
    }
    if [value] != "" {
      mutate {
        replace => {
          "instances_map_label.value" => "%{value}"
        }
        on_error => "nested_object"
      }
      if ![nested_object] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "instances_map_label"
          }
          on_error => "instances_map_label_merge_failed"
        }
      }
    }
  }

  if [event1][session][id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{event1.session.id}"
      }
      on_error => "session_id_empty"
    }
  }
  if [event1][process][executable][path] != "" {
    mutate {
      gsub => ["event1.process.executable.path","\\\\",'\\']
    }
    mutate {
      replace => {
        "target.file.full_path" => "%{event1.process.executable.path}"
        "has_target_file" => "true"
      }
      on_error => "process_executable_path_empty"
    }
  }
  if [event1][occurredAt] != "" {
    date {
      match => ["event1.occurredAt", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "no_occurredAt"
    }
  } else if [event1][time][local][date] != "" {
    date {
      match => ["event1time.local.date", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "no_time_local_date"
    }
  }

  if [event1][observedAt] != "" {
    date {
       match => ["event1.observedAt", "ISO8601"]
       target => "metadata.collected_timestamp"
       on_error => "no_observedAt"
    }
  }
  # Metadata
  if [event1][id] != "" {
    mutate {
      replace => {
         "metadata.product_log_id" => "%{event.id}"
      }
       on_error => "no_event_id"
    }
  }
  if [organization][customer][name] != "" {
     mutate {
       replace => {
        "network.organization_name" => "%{organization.customer.name}"
       }
      on_error => "no_customer_name"
    }
  }
  if [organization][customer][id] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{organization.customer.id}"
      }
      on_error => "no_customer_id"
    }
  }
   if [activity][primaryCategory] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{activity.primaryCategory}"
      }
       on_error => "no_primaryCategory"
    }
  }

   # Principal User
  if [user][id] != "" {
    mutate {
       replace => {
        "principal.user.userid" => "%{user.id}"
        "has_user" => "true"
       }
       on_error => "no_user_id"
    }
  }

  if [user][name] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{user.name}"
      }
       on_error => "no_user_name"
    }
  }
  if [user][email] =~ "^.+@.+$" {
    mutate {
       merge => {
        "principal.user.email_addresses" => "user.email"
      }
      on_error => "no_user_email"
    }
    if ![no_user_email] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }

  if [user][firstName] != "" {
    mutate {
      replace => {
        "principal.user.first_name" => "%{user.firstName}"
      }
      on_error => "no_first_name"
    }
  }

  if [user][lastName] != "" {
    mutate {
      replace => {
        "principal.user.last_name" => "%{user.lastName}"
      }
      on_error => "no_last_name"
    }
  }

  if [user][displayName] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{user.displayName}"
      }
      on_error => "no_display_name"
    }
  }

  # Principal Location
  if [remote][geo][address][area2][name] != "" {
    mutate {
      replace => {
        "principal.location.city" => "%{remote.geo.address.area2.name}"
      }
      on_error => "no_geo_area2"
    }
  }

  if [remote][geo][address][country][name] != "" {
    mutate {
      replace => {
         "principal.location.country_or_region" => "%{remote.geo.address.country.name}"
      }
      on_error => "no_geo_country"
    }
  }

  if [remote][geo][coordinates][lat] != "" {
    mutate {
      replace => {
        "principal.location.region_latitude" => "%{remote.geo.coordinates.lat}"
      }
      on_error => "no_geo_lat"
    }
    mutate {
      convert => {
        "principal.location.region_latitude" => "float"
      }
      on_error => "already_float"
    }
  }

  if [remote][geo][coordinates][lon] != "" {
    mutate {
       replace => {
        "principal.location.region_longitude" => "%{remote.geo.coordinates.lon}"
      }
      on_error => "no_geo_lon"
    }
    mutate {
      convert => {
         "principal.location.region_longitude" => "float"
      }
      on_error => "already_float"
    }
  }

   # Principal IP
  if [remote][host][ip][address] != "" {
     mutate {
      merge => {
        "principal.ip" => "remote.host.ip.address"
        "principal.asset.ip" => "remote.host.ip.address"
      }
      on_error => "no_ip_address"
    }
    if ![no_ip_address] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  # Target
  if [site][url] != "" {
    mutate {
      replace => {
        "target.url" => "%{site.url}"
      }
      on_error => "no_site_url"
    }
  }
  if [site][name] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{site.name}"
        "has_target_file" => "true"
      }
      on_error => "no_site_name"
    }
  }

  if [site][contentType] != "" {
    mutate {
      replace => {
        "target.file.mime_type" => "%{site.contentType}"
        "has_target_file" => "true"
      }
      on_error => "no_site_content_type"
    }
  }

  if [entity][name] != "" {
    mutate {
      replace => {
        "target.application" => "%{entity.name}"
      }
      on_error => "no_entity_name"
    }
  }

  if [feed][region] != "" {
    mutate {
      replace => {
        "target.location.name" => "%{feed.region}"
      }
