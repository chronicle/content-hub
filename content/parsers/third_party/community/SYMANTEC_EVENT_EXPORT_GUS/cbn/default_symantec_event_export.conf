    mutate {
      convert => {
        "_principal.process.file.size" => "uinteger"
      }
      on_error => "convert_failure"
    }
  }

  # Connection Mappings
  if [connection][direction_id] == 1 and [connection][dst_ip] != "" {
    mutate {
      replace => {
