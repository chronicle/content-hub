  } else if [severity_id] == 2 {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  } else if [severity_id] == 3 {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  } else if [severity_id] == 4 {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  } else if [severity_id] == 5 {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }
  else if [severity_id] == 6 {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
