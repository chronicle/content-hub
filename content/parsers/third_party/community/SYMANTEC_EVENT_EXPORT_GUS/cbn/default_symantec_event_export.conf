      replace => {
        "has_target" => "true"
      }
    }
  }

  if [connection][src_ip] != "" {
    mutate {
      merge => {
        "_principal.ip" => "connection.src_ip"
      }
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [device_public_ip] != "" {
    mutate {
