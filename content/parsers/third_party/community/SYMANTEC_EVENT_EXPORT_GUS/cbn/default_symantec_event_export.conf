      }
    }
  }
  else if [file][sha2] != "" {
    mutate {
      lowercase => ["file.sha2"]
    }
    mutate {
      replace => {
         "_principal.process.file.sha256" => "%{file.sha2}"
      }
    }
  }

  if [actor][file][sha1] != "" {
    mutate {
      lowercase => ["actor.file.sha1"]
    }
    mutate {
      replace => {
