      mutate {
        rename => {
          "connection.src_port" => "_principal.port"
        }
        on_error => "no_port"
      }
    }
    else {
      for index, port in connection.src_port {
        if [index] == 0 {
          mutate {
            convert => {
              "port" => "integer"
            }
            on_error => "convert_failure"
          }
          mutate {
            rename => {
              "port" => "_principal.port"
            }
          }
        }
      }
    }
  }

  if [connection][dst_port] != 0 {
    mutate {
      convert => {
        "connection.dst_port" => "string"
      }
      on_error => "convert_dst_port_failure"
    }
    mutate {
      replace => {
        "localPort" => "%{connection.dst_port}"
      }
      on_error => "no_dst_port"
    }
    if [localPort] != "" {
      mutate {
        convert => {
          "localPort" => "integer"
        }
        on_error => "convert_failure"
      }
      mutate {
        rename => {
          "localPort" => "_target.port"
        }
      }
    }
