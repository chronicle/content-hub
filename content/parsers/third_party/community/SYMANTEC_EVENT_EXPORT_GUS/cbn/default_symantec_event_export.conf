      lowercase => ["actor.file.md5"]
    }
    mutate {
      replace => {
        "_principal.process.file.md5" => "%{actor.file.md5}"
      }
    }
  }

  if [actor][file][size] != "" {
    mutate {
      convert => {
        "actor.file.size" => "string"
      }
      on_error => "convert_failure"
    }
    mutate {
      replace => {
        "_principal.process.file.size" => "%{actor.file.size}"
      }
      on_error => "size_not_found"
