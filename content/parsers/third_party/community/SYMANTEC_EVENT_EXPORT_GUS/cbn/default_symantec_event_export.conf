  else if [parent][file][path] != "" {
    mutate {
      replace => {
        "_principal.process.parent_process.file.full_path" => "%{parent.file.path}"
      }
      on_error => "path_empty"
    }
  }

  if [parent][file][company_name] != "" {
    mutate {
      replace => {
        "_principal.user.company_name" => "%{parent.file.company_name}"
      }
      on_error => "company_name_empty"
    }
  }

  if [parent][file][product_name] != "" {
    mutate {
      convert => {
        "parent.file.product_name" => "string"
      }
      on_error => "convert_productname_failure"
