        on_error => "domain_name_not_found"
      }
    }
  }

  if [connection][url][text] != "" {
    mutate {
      replace => {
        "_target.url" => "%{connection.url.text}"
      }
      on_error => "url_not_found"
    }
  }

  if [connection][src_name] != "" {
    mutate {
      replace => {
        "_target.application" => "%{connection.src_name}"
      }
      on_error => "src_name_not_found"
    }
  }

  if [parent][file][md5] != "" {
    mutate {
      lowercase => ["parent.file.md5"]
    }
    mutate {
      replace => {
        "_principal.process.parent_process.file.md5" => "%{parent.file.md5}"
      }
      on_error => "parent_md5_not_found"
    }
  }
  if [parent][file][sha1] != "" {
