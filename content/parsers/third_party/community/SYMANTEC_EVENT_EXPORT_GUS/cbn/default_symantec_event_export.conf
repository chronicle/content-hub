# Product: Symantec Event Export
# Category: SEP
# Supported Format: JSON, SYSLOG
# Reference: N/A
# Last Updated: 2026-09-28
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
     "assignee" => ""
     "has_user" => ""
     "product_name" => ""
     "actor.cmd_line" => ""
     "actor.file.path" => ""
     "actor.file.sha2" => ""
     "actor.file.md5" => ""
     "actor.file.size" => ""
     "actor.pid" => ""
     "actor.user.domain" => ""
     "actor.user.sid" => ""
     "actor.user.name" => ""
     "connection.src_port" => ""
     "connection.dst_port" => ""
     "connection.dst_ip" => ""
     "connection.src_ip" => ""
     "connection.direction_id" => ""
     "security_result" => ""
     "parent.cmd_line" => ""
     "parent.pid" => ""
     "policy.name" => ""
     "policy.rule_name" => ""
     "policy.rule_uid" => ""
     "feature_name" => ""
     "device_uid" => ""
     "file.path" => ""
     "file.sha2" => ""
     "threat.name" => ""
     "threat.id" => ""
     "policy.uid" => ""
     "device_ip" => ""
     "actor.file.sha1" => ""
     "type_id" => ""
     "device_name" => ""
     "device_domain" => ""
     "device_os_name" => ""
     "device_group" => ""
     "device_public_ip" => ""
     "message_data" => ""
     "details.ipv4" => ""
     "user_name" => ""
     "severity_id" => ""
     "uuid" => ""
     "description" => ""
     "has_principal" => ""
     "has_target" => ""
     "user_email" => ""
     "_metadata.event_type" => "GENERIC_EVENT"
     "parent.file.folder" => ""
     "parent.file.name" => ""
     "parent.file.path" => ""
     "parent.file.md5" => ""
     "parent.file.sha1" => ""
     "parent.file.sha2" => ""
     "parent.file.company_name" => ""
     "parent.file.product_name" => ""
     "parent.file.created" => ""
     "parent.file.normalized_path" => ""
     "connection.url.port" => ""
     "connection.url.host" => ""
     "connection.url.domain_name" => ""
     "connection.url.text" => ""
     "connection.src_name" => ""
     "parent.file.signature_company_name" => ""
     "parent.file.signature_value" => ""
     "parent.file.xattributes.portal" => ""
     "parent.file.signature_value_ids" => ""
     "parent.file.version" => ""
     "parent.file.signature_issuer" => ""
     "localPort" => ""
     "blk" => ""
     "all" => ""
     "all_mf" => ""
     "quar" => ""
     "device_os_type_id" => ""
     "id" => ""
     "ip_set" => "false"
     "process_pid" => ""
     "process.uid" => ""
     "actor.uid" => ""
     "process.file.sha2" => ""
     "process.file.path" => ""
     "process.file.size" => ""
     "actor.user.uid" => ""
     "process.user.uid" => ""
     "device_os_ver" => ""
     "policy.version" => ""
     "actor_session_is_admin" => ""
     "timezone" => ""
     "platform_data.sep_hw_uid" => ""
     "actor_file_xattributes_sip" => ""
     "actor_file_xattributes_quarantine" => ""
     "process_file_xattributes_quarantine" => ""
     "process_file_xattributes_sip" => ""
     "process_is_admin" => ""
     "seq_num" => ""
     "customer_uid" => ""
     "actor_start_time" => ""
     "process_start_time" => ""
     "process_file_modified" => ""
     "process_file_created" => ""
     "actor_file_modified" => ""
     "actor_file_created" => ""
     "actor_file_signature_level_id" => ""
     "process_file_signature_level_id" => ""
     "device_group_name" => ""
     "org_unit_uid" => ""
    }
  }
  mutate {
    gsub => ["message","message","message_data"]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failure"
  }

  if [json_failure] {
    grok {
      match => {
        "message" => "<%{INT}>%{SYSLOGTIMESTAMP:log_time} %{HOSTNAME:device_name} %{GREEDYDATA:description}"
      }
      overwrite => ["device_name","log_time", "description"]
      on_error => "grok_failure"
    }
  }

  date {
    match => ["log_time","ISO8601","MMM d HH:mm:ss", "MMM dd HH:mm:ss", "MMM dd HH:mm:ss ", "MMM d HH:mm:ss ", "MMM  d HH:mm:ss", "MMM  dd HH:mm:ss"]
    on_error => "invalid_date_format"
  }


  if [description] != "" {
    mutate {
      replace => {
        "_metadata.description" => "%{description}"
      }
      on_error => "description_not_found"
    }
  }

  if [actor][cmd_line] != "" {
    mutate {
      replace => {
        "_principal.process.command_line" => "%{actor.cmd_line}"
      }
      on_error => "cmd_line_not_found"
    }
  }

  if [device_name] != "" {
    mutate {
      replace => {
        "_principal.hostname" => "%{device_name}"
      }
      on_error => "device_name_not_found"
    }
    if ![device_name_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
        on_error => "has_principal_not_found"
      }
    }
  }

  if [actor][pid] != "" {
    mutate {
      convert => {
        "actor.pid" => "string"
      }
      on_error => "convert_failure"
    }
    mutate {
      replace => {
        "_principal.process.pid" => "%{actor.pid}"
      }
      on_error => "pid_not_found"
    }
  }

  mutate {
    replace => {
      "_target.file.full_path" => "%{cybox.path}"
    }
    on_error => "cybox_path_not_found"
  }

  mutate {
    convert => {
      "cybox.size" => "string"
    }
    on_error => "convert_failure"
  }
  mutate {
    replace => {
      "_target.file.size" => "%{cybox.size}"
    }
    on_error => "cybox_size_not_found"
  }
  mutate {
    convert => {
      "_target.file.size" => "uinteger"
    }
    on_error => "convert_failure"
  }

  mutate {
    convert => {
      "id" => "string"
    }
    on_error => "convert_failure"
  }

    if ([type_id] == 8001 or [type_id] == 8078 or [type_id] == 8000 or [type_id] == 8002 or [type_id] == 8003 or [type_id] == 8004 or [type_id] == 8005 or [type_id] == 8006 or [type_id] == 8007 or [type_id] == 8009 or [type_id] == 8016 or [type_id] == 8071) and [id] == "1" {
    mutate {
      replace => {
        "all" => "ALLOW"
      }
      on_error => "convert_failure"
    }
    mutate {
      merge => {
        "security_result.action" => "all"
      }
      on_error => "action_not_found"
    }
  }
  else if ([type_id] == 8001 or [type_id] == 8078 or [type_id] == 8000 or [type_id] == 8002 or [type_id] == 8003 or [type_id] == 8004 or [type_id] == 8005 or [type_id] == 8006 or [type_id] == 8007 or [type_id] == 8009 or [type_id] == 8016 or [type_id] == 8071) and [id] == "2" {
    mutate {
      replace => {
        "blk" => "BLOCK"
      }
      on_error => "convert_failure"
    }
    mutate {
      merge => {
        "security_result.action" => "blk"
      }
      on_error => "action_not_found"
    }
  }
  else if ([type_id] == 8031 or [type_id] == 8040 or [type_id] == 8025 or [type_id] == 8027 or [type_id] == 8032 or [type_id] == 8033 or [type_id] == 8038) and [id] in ["1", "11"] {
    mutate {
      replace => {
        "blk" => "BLOCK"
      }
      on_error => "convert_failure"
    }
    mutate {
      merge => {
        "security_result.action" => "blk"
      }
      on_error => "action_not_found"
    }
  }
  else if [id] in ["2","3","4","8","13","14","16"] {
    mutate {
      replace => {
        "all" => "ALLOW"
      }
      on_error => "convert_failure"
    }
    mutate {
      merge => {
        "security_result.action" => "all"
      }
      on_error => "action_not_found"
    }
  }
  else if [id] in ["5","6","7","15"] {
    mutate {
      replace => {
        "all_mf" => "ALLOW_WITH_MODIFICATION"
      }
      on_error => "convert_failure"
    }
    mutate {
      merge => {
        "security_result.action" => "all_mf"
      }
      on_error => "action_not_found"
    }
  }
  else if [id] == "12" {
    mutate {
      replace => {
        "quar" => "QUARANTINE"
      }
      on_error => "convert_failure"
    }
    mutate {
      merge => {
        "security_result.action" => "quar"
      }
      on_error => "action_not_found"
    }
  }
  else if [id] == "0" {
    mutate {
      replace => {
        "quar" => "UNKNOWN_ACTION"
      }
      on_error => "convert_failure"
    }
    mutate {
      merge => {
        "security_result.action" => "quar"
      }
      on_error => "action_not_found"
    }
  }

  mutate {
    convert => {
      "audit" => "string"
    }
    on_error => "convert_failure"
  }
  mutate {
    replace => {
      "audit_label.key" => "audit"
      "audit_label.value.string_value" => "%{audit}"
    }
    on_error => "no_audit"
  }
  if ![no_audit] {
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "audit_label"
      }
      on_error => "no_audit_label"
    }
  }

  if [policy][rule_name] =~ "File and Folder Access Attempts" {
    mutate {
      merge => {
        "_principal.file.names" => "file.name"
      }
      on_error => "file_path_not_found"
    }
  }

  mutate {
    convert => {
      "device_os_type_id" => "string"
    }
    on_error => "device_os_type_id_convert_fail"
  }
  if ![device_os_type_id_convert_fail] and [device_os_type_id] != "" {
    if [device_os_type_id] == "100" {
      mutate {
        replace => {
          "_principal.platform" => "WINDOWS"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "200" {
      mutate {
        replace => {
          "_principal.platform" => "LINUX"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "300" {
      mutate {
        replace => {
          "platform_label.key" => "device_os_type"
          "platform_label.value.string_value" => "SOLARIS"
        }
        on_error => "device_os_type_id_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "platform_label"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "301" {
      mutate {
        replace => {
          "platform_label1.key" => "device_os_type"
          "platform_label1.value.string_value" => "AIX"
        }
        on_error => "device_os_type_id_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "platform_label1"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "302" {
      mutate {
        replace => {
          "platform_label2.key" => "device_os_type"
          "platform_label2.value.string_value" => "HP-UX"
        }
        on_error => "device_os_type_id_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "platform_label2"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "400" {
      mutate {
        replace => {
          "platform_label3.key" => "device_os_type"
          "platform_label3.value.string_value" => "MACINTOSH"
        }
        on_error => "device_os_type_id_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "platform_label3"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "500" {
      mutate {
        replace => {
          "_principal.platform" => "IOS"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "501" {
      mutate {
        replace => {
          "_principal.platform" => "ANDROID"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "502" {
      mutate {
        replace => {
          "platform_label4.key" => "device_os_type"
          "platform_label4.value.string_value" => "WINDOWS MOBILE"
        }
        on_error => "device_os_type_id_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "platform_label4"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "503" {
      mutate {
        replace => {
          "platform_label5.key" => "device_os_type"
          "platform_label5.value.string_value" => "IPADOS"
        }
        on_error => "device_os_type_id_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "platform_label5"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "1001" {
      mutate {
        replace => {
          "platform_label6.key" => "device_os_type"
          "platform_label6.value.string_value" => "OTHER"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
    else if [device_os_type_id] == "0" {
      mutate {
        replace => {
          "_principal.platform" => "UNKNOWN_PLATFORM"
        }
        on_error => "device_os_type_id_not_found"
      }
    }
  }

  if [process][uid] != "" {
    mutate {
      replace => {
        "_target.process.product_specific_process_id" => "%{process.uid}"
      }
      on_error => "process_uid_invalid"
    }
  }

  if [actor][uid] != "" {
    mutate {
      replace => {
        "_principal.process.product_specific_process_id" => "%{actor.uid}"
      }
      on_error => "actor_uid_invalid"
    }
  }

  if [process][file][path] != "" {
    mutate {
      replace => {
        "_target.process.file.full_path" => "%{process.file.path}"
      }
      on_error => "process_file_error"
    }
  }

  mutate {
    convert => {
      "process.file.size" => "string"
    }
    on_error => "process_file_size_convert_fail"
  }

  if [process][file][size] != "" {
    mutate {
      replace => {
        "_target.process.file.size" => "%{process.file.size}"
      }
      on_error => "process_file_size_not_found"
    }
    if ![process_file_size_not_found] {
      mutate {
        convert => {
          "_target.process.file.size" => "uinteger"
        }
        on_error => "process_file_size_convert_fail"
      }
    }
  }

  if [actor][user][uid] != "" {
    mutate {
      replace => {
        "_principal.user.userid" => "%{actor.user.uid}"
        "has_user" => "true"
      }
      on_error => "user_id_not_found"
    }
  }

  if [process][user][uid] != "" {
    mutate {
      replace => {
        "_target.user.userid" => "%{process.user.uid}"
      }
      on_error => "userid_not_found"
    }
  }

  if [device_os_ver] != "" {
    mutate {
      replace => {
        "_target.platform_version" => "%{device_os_ver}"
      }
      on_error => "device_os_version_not_found"
    }
  }

  mutate {
    convert => {
      "timezone" => "string"
    }
    on_error => "timezone_convert_fail"
  }

  if [platform_data][sep_hw_uid] != "" {
    mutate {
      replace => {
        "sep_hw_uid_label.value" => "%{platform_data.sep_hw_uid}"
        "sep_hw_uid_label.key" => "platform_data_sep_hw_uid"
      }
      on_error => "invalid_sep_hw_uid"
    }
    if ![invalid_sep_hw_uid] {
      mutate {
        merge => {
          "_principal.asset.attribute.labels" => "sep_hw_uid_label"
        }
        on_error => "invalid_sep_hw_uid_label_merge"
      }
    }
  }

  mutate {
    convert => {
      "process.pid" => "string"
    }
    on_error => "process_pid_convert_fail"
  }
  mutate {
    replace => {
      "process_pid" => "%{process.pid}"
    }
    on_error => "process_pid_not_found"
  }

  mutate {
    convert => {
      "actor.file.xattributes.sip" => "string"
    }
    on_error => "actor_file_xattributes_sip_convert_fail"
  }
  mutate {
    replace => {
      "actor_file_xattributes_sip" => "%{actor.file.xattributes.sip}"
    }
    on_error => "actor_file_xattributes_sip_not_found"
  }

  mutate {
    convert => {
      "process.file.xattributes.sip" => "string"
    }
    on_error => "process_file_xattributes_sip_convert_fail"
  }
  mutate {
    replace => {
      "process_file_xattributes_sip" => "%{process.file.xattributes.sip}"
    }
    on_error => "process_file_xattributes_sip_not_found"
  }

  mutate {
    convert => {
      "actor.file.xattributes.quarantine" => "string"
    }
    on_error => "actor_file_xattributes_quarantine_convert_fail"
  }
  mutate {
    replace => {
      "actor_file_xattributes_quarantine" => "%{actor.file.xattributes.quarantine}"
    }
    on_error => "actor_file_xattributes_quarantine_not_found"
  }

  mutate {
    convert => {
      "process.file.xattributes.quarantine" => "string"
    }
    on_error => "process_file_xattributes_quarantine_convert_fail"
  }
  mutate {
    replace => {
      "process_file_xattributes_quarantine" => "%{process.file.xattributes.quarantine}"
    }
    on_error => "process_file_xattributes_quarantine_not_found"
  }

  mutate {
    convert => {
      "seq_num" => "string"
    }
    on_error => "seq_num_convert_fail"
  }

  mutate {
    convert => {
      "actor.start_time" => "string"
    }
    on_error => "actor_start_time_convert_fail"
  }
  mutate {
    replace => {
      "actor_start_time" => "%{actor.start_time}"
    }
    on_error => "actor_start_time_not_found"
  }

  mutate {
    convert => {
      "process.start_time" => "string"
    }
    on_error => "process_start_time_convert_fail"
  }
  mutate {
    replace => {
      "process_start_time" => "%{process.start_time}"
    }
    on_error => "process_start_time_not_found"
  }

  if [process][file][sha2] != "" {
    mutate {
      lowercase => ["process.file.sha2"]
    }
    if [process][file][sha2] =~ "^[0-9a-f]{64}$" {
      mutate {
        replace => {
          "_target.process.file.sha256"  => "%{process.file.sha2}"
        }
        on_error => "process_sha_not_found"
      }
    }
  }

  if [policy][version] != "" {
    mutate {
      replace => {
        "security_result.rule_version" => "%{policy.version}"
      }
      on_error => "rule_version_empty"
    }
  }

  mutate {
    convert => {
      "actor.session.is_admin" => "string"
    }
    on_error => "is_admin_convert_fail"
  }
  mutate {
    replace => {
      "actor_session_is_admin" => "%{actor.session.is_admin}"
    }
    on_error => "is_admin_not_found"
  }

  mutate {
    convert => {
      "process.session.is_admin" => "string"
    }
    on_error => "process_is_admin_convert_fail"
  }
  mutate {
    replace => {
      "process_is_admin" => "%{process.session.is_admin}"
    }
    on_error => "process_is_admin_not_found"
  }

  for index, edr_data in edr_enriched_data {
    mutate {
      replace => {
        "edr_category_name" => ""
        "edr_rule_name" => ""
        "edr_rule_id" => ""
        "rule_name_label" => ""
        "rule_id_label" => ""
        "edr_category_name_label" => ""
        "edr_category_id" => ""
        "category_id_label" => ""
      }
    }
    mutate {
      replace => {
        "edr_category_id" => "%{edr_data.category_id}"
      }
      on_error => "category_id_not_found"
    }
    if [edr_category_id] != "" {
      mutate {
        replace => {
          "category_id_label.key" => "category_id"
          "category_id_label.value" => "%{edr_category_id}"
        }
        on_error => "category_id_label_empty"
      }
      if ![category_id_label_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "category_id_label"
          }
          on_error => "category_id_merge_fail"
        }
      }
    }
    mutate {
      replace => {
        "edr_category_name" => "%{edr_data.category_name}"
      }
      on_error => "category_name_not_found"
    }
    if [edr_category_name] != "" {
      mutate {
        replace => {
          "edr_category_name_label.key" => "edr_category_name"
          "edr_category_name_label.value" => "%{edr_category_name}"
        }
        on_error => "edr_category_name_label_empty"
      }
      if ![edr_category_name_label_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "edr_category_name_label"
          }
          on_error => "edr_category_name_merge_fail"
        }
      }
    }
    mutate {
      replace => {
        "edr_rule_name" => "%{edr_data.rule_name}"
      }
      on_error => "rule_name_not_found"
    }
    if [edr_rule_name] != "" {
      mutate {
        replace => {
          "rule_name_label.key" => "rule_name"
          "rule_name_label.value" => "%{edr_rule_name}"
        }
        on_error => "rule_name_label_empty"
      }
      if ![rule_name_label_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "rule_name_label"
          }
          on_error => "rule_name_merge_fail"
        }
      }
    }
    mutate {
      replace => {
        "edr_rule_id" => "%{edr_data.rule_id}"
      }
      on_error => "rule_id_not_found"
    }
    if [edr_rule_id] != "" {
      mutate {
        replace => {
          "rule_id_label.key" => "rule_id"
          "rule_id_label.value" => "%{edr_rule_id}"
        }
        on_error => "rule_id_label_empty"
      }
      if ![rule_id_label_empty] {
        mutate {
          merge => {
            "security_result.detection_fields" => "rule_id_label"
          }
          on_error => "rule_id_merge_fail"
        }
      }
    }
  }
  if [customer_uid] != "" {
    mutate {
      replace => {
        "_metadata.product_deployment_id" => "%{customer_uid}"
      }
      on_error => "customer_uid_empty_or_not_present"
    }
  }

  if [parent][pid] != "" {
    mutate {
      convert => {
        "parent.pid" => "string"
      }
      on_error => "convert_failure"
    }
    mutate {
      replace => {
        "_principal.process.parent_process.pid" => "%{parent.pid}"
