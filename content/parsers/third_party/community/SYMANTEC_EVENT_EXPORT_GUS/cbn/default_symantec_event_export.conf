          "has_principal" => "true"
          "_principal.resource.resource_type" => "DEVICE"
        }
      }
    }
    if [device_os_name] != "" {
      mutate {
        replace => {
          "_principal.platform_version" => "%{device_os_name}"
        }
      }
    }
    if [device_group] != "" {
