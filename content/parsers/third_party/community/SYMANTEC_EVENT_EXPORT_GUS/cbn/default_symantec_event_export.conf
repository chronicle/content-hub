        }
      }
    }
    if [device_uid] != "" {
      mutate {
        replace => {
          "_principal.resource.id" => "%{device_uid}"
        }
      }
    }
  }
  else if [connection][direction_id] == 1 {
    mutate {
      replace => {
        "_target.resource.resource_type" => "DEVICE"
      }
    }
    if [device_name] != "" {
      mutate {
        replace => {
          "_target.hostname" => "%{device_name}"
          "has_target" => "true"
        }
      }
    }
    if [device_os_name] != "" {
      mutate {
        replace => {
          "_target.platform_version" => "%{device_os_name}"
        }
      }
    }
    if [device_group] != "" {
      mutate {
        replace => {
          "_target.group.group_display_name" => "%{device_group}"
        }
      }
    }
    if [device_domain] != "" {
      mutate {
        replace => {
          "_target.administrative_domain" => "%{device_domain}"
        }
      }
    }
    if [device_uid] != "" {
      mutate {
        replace => {
          "_target.resource.id" => "%{device_uid}"
        }
