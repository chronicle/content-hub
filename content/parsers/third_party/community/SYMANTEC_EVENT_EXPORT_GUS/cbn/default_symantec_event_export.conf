  if [parent][file][signature_value] != "" {
    mutate {
      convert => {
        "parent.file.signature_value" => "string"
      }
      on_error => "convert_signature_value_failure"
    }
    mutate {
      replace => {
        "signature_value_label.key" => "signature_value"
        "signature_value_label.value" => "%{parent.file.signature_value}"
      }
      on_error => "signature_value_empty"
    }
    if ![signature_value_empty] {
      mutate {
        merge => {
          "_principal.resource.attribute.labels" => "signature_value_label"
        }
        on_error => "signature_value_label_empty"
      }
    }
  }

  if [parent][file][xattributes][portal] != "" {
    mutate {
      convert => {
        "parent.file.xattributes.portal" => "string"
      }
      on_error => "convert_portal_failure"
    }
    mutate {
      replace => {
        "portal_label.key" => "portal"
        "portal_label.value" => "%{parent.file.xattributes.portal}"
      }
      on_error => "portal_empty"
    }
    if ![portal_empty] {
      mutate {
        merge => {
          "_principal.resource.attribute.labels" => "portal_label"
        }
        on_error => "portal_label_empty"
      }
    }
  }

  mutate {
    replace => {
      "sign_id_list.value" => ""
    }
  }
  for signid in parent.file.signature_value_ids {
    mutate {
      replace => {
        "sign_id_label" => ""
      }
    }
    mutate {
      replace => {
        "sign_id_label.string_value" => "%{signid}"
      }
      on_error => "sign_id_empty"
    }
    if ![sign_id_empty] {
      mutate {
        merge => {
          "sign_id_list.value.list_value.values" => "sign_id_label"
        }
        on_error => "sign_id_label_empty"
      }
    }
  }
  if [sign_id_list][value] != "" {
    mutate {
      replace => {
        "sign_id_list.key" => "signature_value_ids"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "sign_id_list"
      }
      on_error => "sign_id_list_empty"
    }
  }

  if [assignee] != "" {
    mutate {
      replace => {
        "_principal.user.userid" => "%{assignee}"
      }
      on_error => "assignee_empty"
    }
    if ![assignee_empty] {
      mutate {
        replace => {
          "has_user" => "true"
        }
        on_error => "assignee_empty1"
      }
    }
  }

  for index, details in device_networks {
    mutate {
      replace => {
        "_intermediary" => ""
        "details_ipv6" => ""
        "details_ipv4" => ""
        "details_mac" => ""
      }
    }

    for key, value in details map {
      mutate {
        replace => {
          "ipval" => ""
        }
      }
      mutate {
        replace => {
          "ipval" => "%{value}"
        }
        on_error => "ip_set_not_found"
      }
      if [ip_set] == "false" {
        if [key] in ["ipv4", "ipv6"] and [ipval] != "" {
          mutate {
            merge => {
              "_intermediary.ip" => "ipval"
            }
            on_error => "intermediary_ip_not_found"
          }
          if ![intermediary_ip_not_found] {
            mutate {
              replace => {
                "ip_set" => "true"
              }
              on_error => "ip_set_not_found"
            }
          }
        }
      }
      else {
        if [key] in ["ipv4", "ipv6"] and [ipval] != "" {
          mutate {
            merge => {
              "_principal.asset.ip" => "ipval"
            }
            on_error => "no_ip"
          }
          if ![no_ip] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
              on_error => "no_principal"
            }
          }
        }
      }
    }
    mutate {
      replace => {
        "details_mac" => "%{details.mac}"
      }
      on_error => "no_mac"
    }

    if [details_mac] != "" {
      mutate {
        lowercase => ["details_mac"]
      }
      mutate {
        gsub => ["details_mac","-",":"]
      }
      if [details_mac] !~ ":" {
        mutate {
         gsub => [ "details_mac", "([0-9a-f]{2})", "$1:" ]
        }
        mutate {
          gsub => [ "details_mac", "(:$)", "" ]
        }
      }
      mutate {
        merge => {
          "_intermediary.mac" =>  "details_mac"
        }
      }
    }
    if [_intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "_intermediary"
        }
      }
    }
  }

  # Mapping event_types
  if [type_id] in [ 8040 , 3 ] {
    mutate {
      replace => {
        "_metadata.event_type" => "NETWORK_CONNECTION"
        "_metadata.product_event_type" => "NETWORK_DETECTION"
      }
    }
  }
  else if [type_id] == 2 {
    if [message] =~ "started" {
      mutate {
        replace => {
          "_metadata.event_type" => "PROCESS_LAUNCH"
          "_metadata.product_event_type" => "APPLICATION_LIFECYCLE"
        }
      }
    }
    else if [has_target] == "true" or [has_principal] == "true" {
      mutate {
        replace => {
          "_metadata.event_type" => "PROCESS_TERMINATION"
          "_metadata.product_event_type" => "APPLICATION_LIFECYCLE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "_metadata.event_type" => "GENERIC_EVENT"
          "_metadata.product_event_type" => "APPLICATION_LIFECYCLE"
        }
      }
    }
  }
  else if [type_id] == 8020 {
    mutate {
      replace => {
        "_metadata.event_type" => "SCAN_NETWORK"
        "_metadata.product_event_type" => "SCAN"
      }
    }
  }
  else if [type_id] == 8031 {
    mutate {
      replace => {
        "_metadata.event_type" => "SCAN_HOST"
        "_metadata.product_event_type" => "HOST_FILE_DETECTION"
      }
    }
  }
  else if[type_id] == 21 {
    if [has_principal] == "true" {
      mutate {
        replace => {
          "_metadata.event_type" => "STATUS_UPDATE"
          "_metadata.product_event_type" => "STATUS"
        }
      }
    }
    else {
      mutate {
        replace => {
          "_metadata.event_type" => "GENERIC_EVENT"
          "_metadata.product_event_type" => "STATUS"
        }
      }
    }
  }
  else if [has_user] == "true" {
      mutate {
        replace => {
          "_metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "_metadata.event_type" => "STATUS_UPDATE"
        "_metadata.product_event_type" => "STATUS"
      }
    }
  }
  else {
    mutate {
      replace => {
        "_metadata.event_type" => "GENERIC_EVENT"
        "_metadata.product_event_type" => "STATUS"
      }
    }
  }


  mutate {
    rename => {
      "product_name" => "_metadata.product_name"
      "product_ver" => "_metadata.product_version"
      "product_uid" => "_target.process.pid"
    }
  }
  mutate {
    replace => {
      "_metadata.vendor_name" => "SYMANTEC"
    }
  }

  mutate {
    rename => {
      "_metadata" => "event.idm.read_only_udm.metadata"
      "_principal" => "event.idm.read_only_udm.principal"
      "_target" => "event.idm.read_only_udm.target"
      "_network" => "event.idm.read_only_udm.network"
      "_src" => "event.idm.read_only_udm.src"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
