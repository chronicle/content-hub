        "parent.file.created" => "string"
      }
      on_error => "convert_created_failure"
    }
    mutate {
      replace => {
        "create_label.key" => "file_created"
        "create_label.value" => "%{parent.file.created}"
      }
      on_error => "created_empty"
    }
    if ![created_empty] {
      mutate {
        merge => {
          "_principal.resource.attribute.labels" => "create_label"
        }
        on_error => "create_label_empty"
      }
    }
  }

  if [parent][file][normalized_path] != "" {
