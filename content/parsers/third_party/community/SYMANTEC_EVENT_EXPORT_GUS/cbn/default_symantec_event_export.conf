      on_error => "parent_pid_not_found"
    }
  }
  mutate {
    convert => {
      "actor.file.created" => "string"
    }
    on_error => "actor_file_created_convert_fail"
  }
  mutate {
    replace => {
      "actor_file_created" => "%{actor.file.created}"
    }
    on_error => "actor_file_created_not_found"
  }
  mutate {
    convert => {
      "actor.file.modified" => "string"
    }
    on_error => "actor_file_modified_convert_fail"
  }
  mutate {
    replace => {
      "actor_file_modified" => "%{actor.file.modified}"
    }
    on_error => "actor_file_modified_not_found"
  }
  mutate {
    convert => {
      "process.file.created" => "string"
    }
    on_error => "process_file_created_convert_fail"
  }
  mutate {
    replace => {
      "process_file_created" => "%{process.file.created}"
    }
    on_error => "process_file_created_not_found"
  }
  mutate {
    convert => {
      "process.file.modified" => "string"
    }
    on_error => "process_file_modified_convert_fail"
  }
  mutate {
    replace => {
      "process_file_modified" => "%{process.file.modified}"
    }
    on_error => "process_file_modified_not_found"
  }
  mutate {
    convert => {
      "actor.file.signature_level_id" => "string"
    }
    on_error => "actor_file_signature_level_id_convert_fail"
  }
  mutate {
    replace => {
      "actor_file_signature_level_id" => "%{actor.file.signature_level_id}"
    }
    on_error => "actor_file_signature_level_id_not_found"
  }
  mutate {
    convert => {
      "process.file.signature_level_id" => "string"
    }
    on_error => "process_file_signature_level_id_convert_fail"
  }
  mutate {
    replace => {
      "process_file_signature_level_id" => "%{process.file.signature_level_id}"
    }
    on_error => "process_file_signature_level_id_not_found"
