  mutate {
    convert => {
      "trans_event_raw_length" => "string"
    }
    on_error => "trans_event_raw_length_convert_fail"
  }
  mutate {
    convert => {
      "actor.file.uid" => "string"
    }
    on_error => "actor_file_uid_convert_fail"
  }
  mutate {
    replace => {
      "actor_file_uid" => "%{actor.file.uid}"
    }
    on_error => "actor_uid_not_found"
  }
  mutate {
    rename => {
      "timezone" => "addition.timezone"
      "process_pid" => "addition.process_pid"
      "actor_file_xattributes_sip" => "addition.actor_file_xattributes_sip"
      "process_file_xattributes_sip" => "addition.process_file_xattributes_sip"
      "actor_file_xattributes_quarantine" => "addition.actor_file_xattributes_quarantine"
      "process_file_xattributes_quarantine" => "addition.process_file_xattributes_quarantine"
      "seq_num" => "addition.seq_num"
      "actor_start_time" => "addition.actor_start_time"
      "process_start_time" => "addition.process_start_time"
      "actor_session_is_admin" => "addition.actor_session_is_admin"
      "process_is_admin" => "addition.process_is_admin"
      "actor_file_created" => "addition.actor_file_created"
      "actor_file_modified" => "addition.actor_file_modified"
      "process_file_created" => "addition.process_file_created"
      "process_file_modified" => "addition.process_file_modified"
      "actor_file_signature_level_id" => "addition.actor_file_signature_level_id"
      "process_file_signature_level_id" => "addition.process_file_signature_level_id"
      "actor_file_uid" => "addition.actor_file_uid"
      "trans_event_raw_length" => "addition.trans_event_raw_length"
      "org_unit_uid" => "addition.org_unit_uid"
      "device_group_name" => "addition.device_group_name"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [_check] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "key_not_found"
      }
      if [key] in ["actor_session_is_admin", "process_is_admin" ] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "value_not_found"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "_field"
          }
          on_error => "security_result_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "string_value_not_found"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }

  if [parent][cmd_line] != "" {
