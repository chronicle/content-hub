# Product: VERITAS NETBACKUP
# Category: Backup software
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2026-02-06
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      # fields
      "ts" => ""
      "host" => ""
      "date_value" => ""
      "time" => ""
      "date_time" => ""
      "product_event_type" => ""
      "desc" => ""
      "kv_data" => ""
      "SqlState" => ""
      "NativeError" => ""
      "ErrorMsg" => ""
      "summary" => ""
      "json_data" => ""
      "thread" => ""
      "sev" => ""
      "m" => ""
      "fn" => ""
      "pem_file_path" => ""
      "mode" => ""
      "security_result_action" => ""
      "intermediary_hostname" => ""
      "app_user" => ""
      "product" => ""
      "process_name" => ""
      "p_hostname" => ""
      "p_uuid" => ""
      "p_ip" => ""
      "p_port" => ""
      "d_ip" => ""
      "d_port" => ""
      "operation" => ""
      "policy_name" => ""
      "schedule" => ""
      "response_time_ms" => ""
      "exit_code" => ""
      "event_ts" => ""
      "event_datetime" => ""
      "user_id" => ""
      "event_category" => ""
      "event_action" => ""
      "reason" => ""
      "details" => ""
      "target_user" => ""
      "accessed_from" => ""
      "origin_ip" => ""
      "login_host" => ""
      "host_type" => ""
      "auth_status" => ""
      "originator_host" => ""
      "event_type" => ""
      "principal_machine_id_present" => "false"
      # udm noun
      "target" => ""
      "observer" => ""
      "metadata" => ""
      "principal" => ""
      "security_result" => ""
      "product_id" => ""
      "intermediary" => ""
    }
  }

  # Grok pattern to process syslog message
  grok {
    match => {
       "message" => [
          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} \\[%{DATE_US:date_value} %{TIME:time}\\]:\\[%{INT}:%{INT}\\]:\\[%{INT}\\]  \\[%{DATA}::%{DATA:product_event_type}\\]  ### %{DATA:desc} ###  %{GREEDYDATA:kv_data}",
          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:host} \\[%{DATE_US:date_value} %{TIME:time}\\]:\\[%{INT}:%{INT}\\]:\\[%{INT}\\]  \\[%{DATA}::%{DATA:product_event_type}\\]  %{GREEDYDATA:summary}",
          "(%{SYSLOGTIMESTAMP:ts}|%{TIMESTAMP_ISO8601:ts}) %{HOSTNAME:intermediary_hostname} %{DATA:app_user}(:application| )%{DATA:product}\\s+(.*?)?DESCRIPTION: \\[%{WORD:process_name}\\],\\[%{DATA:product_id}\\],\\[Peer:%{HOSTNAME:p_hostname}, %{UUID:p_uuid}, %{IP:p_ip}:%{POSINT:p_port}\\],\\[Destination: %{IP:d_ip}:%{POSINT:d_port}\\],\\[Operation:%{DATA:operation}, Policy Name:%{DATA:policy_name},(\\s+Schedule:%{DATA:schedule},)? Response time \\(ms\\):%{INT:response_time_ms}, Exit code:%{INT:exit_code}\\].*?\\| TIMESTAMP: %{NUMBER:event_ts} \\| DATETIME: %{TIMESTAMP_ISO8601:event_datetime} \\| USER: %{DATA:user_id} \\| CATEGORY: %{WORD:event_category} \\| ACTION: %{WORD:event_action} \\| REASON: %{DATA:reason} \\| DETAILS: %{GREEDYDATA:details}",
          "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:intermediary_hostname} %{DATA:app_user}:application\\[%{DATA:product}\\]: DESCRIPTION: %{DATA:summary} \\| TIMESTAMP: %{NUMBER:event_ts} \\| DATETIME: %{TIMESTAMP_ISO8601:event_datetime} \\| USER: %{DATA:target_user} \\| CATEGORY: %{WORD:event_category} \\| ACTION: %{WORD:event_action} \\| REASON: %{DATA:reason} \\| DETAILS: %{GREEDYDATA:details}",
          "(<%{INT}>)?%{SYSLOGTIMESTAMP:ts} %{DATA:host} %{GREEDYDATA:json_data}"
        ]
    }
    overwrite => ["product_id","ts", "host", "date_value", "time", "product_event_type", "desc", "kv_data", "summary", "json_data", "intermediary_hostname", "app_user", "product", "process_name", "p_hostname", "p_uuid", "p_ip", "p_port", "d_ip", "d_port", "operation", "policy_name", "schedule", "response_time_ms", "exit_code", "event_ts", "event_datetime", "user_id", "event_category", "event_action", "reason", "details", "target_user"]
    on_error  => "header_grok_match_failed"
  }
  grok {
    match => {
      "details" => [
        ".*?ATTR_1: Originator Host ID OLDV: NEWV: %{GREEDYDATA:originator_host}"
        ".*?ATTR_1: Accessed From OLDV: NEWV: %{DATA:accessed_from} ATTR_2: Origin Host OLDV: NEWV: %{IP:p_ip}.*?ATTR_3: Logged in to Host OLDV: NEWV: %{HOSTNAME:login_host}.*?ATTR_4: Host Type OLDV: NEWV: %{DATA:host_type} ATTR_5: Status OLDV: NEWV: %{WORD:auth_status}"
      ]
    }
    overwrite => ["accessed_from", "p_ip", "login_host", "host_type", "auth_status", "originator_host"]
    on_error  => "details_grok_match_failed"
  }
  grok {
    match => {
      "summary" => [
        "User '%{USER:user_id}' authenticated successfully"
      ]
    }
    overwrite => ["user_id"]
    on_error  => "summary_grok_match_failed"
  }
  if [originator_host] != "" {
    mutate {
      replace => {
        "originator_host_label.key" => "originator_host"
        "originator_host_label.value.string_value" => "%{originator_host}"
      }
      on_error => "originator_host_value_invalid"
    }
    if ![originator_host_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "originator_host_label"
        }
        on_error => "originator_host_label_merge_failed"
      }
    }
  }
  if [login_host] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{login_host}"
        "target.asset.hostname" => "%{login_host}"
      }
      on_error => "login_host_value_invalid"
    }
  }
  if [accessed_from] != "" {
    mutate {
      replace => {
        "principal.application" => "%{accessed_from}"
      }
      on_error => "accessed_from_value_invalid"
    }
  }
  if [host_type] != "" {
    mutate {
      replace => {
        "host_type_label.key" => "host_type"
        "host_type_label.value.string_value" => "%{host_type}"
      }
      on_error => "host_type_value_invalid"
    }
    if ![host_type_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "host_type_label"
        }
        on_error => "host_type_label_merge_failed"
      }
    }
  }
  if [auth_status] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{auth_status}"
      }
      on_error => "auth_status_value_invalid"
    }
  }

  if [intermediary_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_hostname}"
      }
      on_error => "intermediary_hostname_value_invalid"
    }
  }
  if [app_user] != "" {
    mutate {
      replace => {
        "intermediary.user.userid" => "%{app_user}"
      }
      on_error => "app_user_value_invalid"
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
      }
      on_error => "user_id_value_invalid"
    }
  }
  if [product] != "" {
    grok {
      match => {
        "product" => [
          "\\[%{DATA:product}\\]:"
        ]
      }
      overwrite => ["product"]
      on_error => "product_grok_match_failed"
    }
    mutate {
      gsub => ["product", "\\[|\\]", ""]
    }
    mutate {
      replace => {
        "product_label.key" => "product"
        "product_label.value.string_value" => "%{product}"
      }
      on_error => "product_value_invalid"
    }
    if ![product_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "product_label"
        }
        on_error => "product_label_merge_failed"
      }
    }
  }

  if [process_name] != "" {
    mutate {
      merge => {
        "principal.process.file.names" => "process_name"
      }
      on_error => "process_name_value_invalid"
    }
  }

  if [p_hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{p_hostname}"
        "principal.asset.hostname" => "%{p_hostname}"
        "principal_machine_id_present" => "true"
      }
      on_error => "p_hostname_value_invalid"
    }
  }

  if [p_uuid] != "" {
    mutate {
      replace => {
        "p_uuid_label.key" => "peer_uuid"
        "p_uuid_label.value.string_value" => "%{p_uuid}"
      }
      on_error => "p_uuid_label_invalid"
    }
    if ![p_uuid_label_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "p_uuid_label"
        }
        on_error => "p_uuid_label_merge_failed"
      }
    }
  }

  if [p_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "p_ip"
        "principal.asset.ip" => "p_ip"
      }
      on_error => "p_ip_value_invalid"
    }
    if ![p_ip_value_invalid] {
      mutate {
        replace => {
          "principal_machine_id_present" => "true"
        }
      }
    }
  }

  if [p_port] != "" {
    mutate {
      replace => {
        "principal.port" => "%{p_port}"
      }
      on_error => "p_port_value_invalid"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "p_port_value_already_integer"
    }
  }

  if [d_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "d_ip"
        "target.asset.ip" => "d_ip"
      }
      on_error => "d_ip_value_invalid"
    }
  }
  if [target_user] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{target_user}"
      }
      on_error => "target_user_value_invalid"
    }
  }

  if [d_port] != "" {
    mutate {
      replace => {
        "target.port" => "%{d_port}"
      }
      on_error => "d_port_value_invalid"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "target_port_value_already_integer"
    }
  }

  if [operation] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{operation}"
      }
      on_error => "operation_value_invalid"
    }
  }

  if [policy_name] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{policy_name}"
      }
      on_error => "policy_name_value_invalid"
    }
  }

  if [schedule] != "" {
    mutate {
      replace => {
        "schedule_label.key" => "schedule"
        "schedule_label.value.string_value" => "%{schedule}"
      }
      on_error => "schedule_label_invalid"
    }
    if ![schedule_label_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "schedule_label"
        }
        on_error => "schedule_label_merge_failed"
      }
    }
  }

  if [response_time_ms] != "" {
    mutate {
      replace => {
        "response_time_ms_label.key" => "response_time_ms"
        "response_time_ms_label.value.string_value" => "%{response_time_ms}"
      }
      on_error => "response_time_ms_label_invalid"
    }
    if ![response_time_ms_label_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "response_time_ms_label"
        }
        on_error => "response_time_ms_label_merge_failed"
      }
    }
  }

  if [exit_code] == "0" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }
  else if [exit_code] != "" {
    mutate {
      replace => {
        "security_result_action" => "UNKNOWN_ACTION"
      }
    }
  }
  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
      on_error => "security_result_action_merge_failed"
    }
  }

  if [event_category] != "" {
    mutate {
      replace => {
        "product_event_type" => "%{event_category}"
      }
      on_error => "event_category_value_invalid"
    }
  }

  if [reason] != "" {
    mutate {
      replace => {
        "reason_label.key" => "reason"
        "reason_label.value.string_value" => "%{reason}"
      }
      on_error => "reason_label_invalid"
    }
    if ![reason_label_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "reason_label"
        }
        on_error => "reason_label_merge_failed"
      }
    }
  }

  if [details] != "" {
    mutate {
      replace => {
        "desc" => "%{details}"
      }
      on_error => "details_value_invalid"
    }
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [product_id] != "" and [product_id] != "-" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{product_id}"
      }
      on_error => "product_id_value_not_present"
    }
  }
  if [event_datetime] != "" {
    grok {
      match => {
        "event_datetime" => [
          "%{YEAR:year}-%{MONTHNUM:month}-%{MONTHDAY:monthday}T%{HOUR:hour}:%{MINUTE:min}:%{SECOND:seconds}%{GREEDYDATA:timezone_value}"
        ]
      }
      overwrite => ["year", "month", "monthday", "hour", "min", "seconds","timezone_value"]
      on_error => "event_datetime_grok_match_failed"
    }
    if ![event_datetime_grok_match_failed] {
      mutate {
        gsub => ["timezone_value", ":", ""]
      }
      mutate {
        replace => {
          "event_datetime" => "%{year}-%{month}-%{monthday}T%{hour}:%{min}:%{seconds}%{timezone_value}"
        }
      on_error => "event_datetime_replace_failed"
      }
    }
    date {
      match => ["event_datetime","TIMESTAMP_ISO8601","yyyy-MM-ddTHH:mm:ss.SSSZ"]
      on_error => "event_datetime_match_failed"
    }
  }
  else if [ts] != "" and [event_datetime] == "" {
    date {
      match => ["ts", "RFC5424","ISO8601", "MMM  d HH:mm:ss"]
      rebase => true
      on_error => "date_match_failed"
    }
  }
  if [event_ts] != "" {
    mutate {
      replace => {
        "event_ts_label.key" => "event_timestamp"
        "event_ts_label.value.string_value" => "%{event_ts}"
      }
      on_error => "event_ts_value_invalid"
    }
    if ![event_ts_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_ts_label"
        }
        on_error => "event_ts_label_merge_failed"
      }
    }
  }
  if [event_action] != "" {
    mutate {
      replace => {
        "event_action_label.key" => "event_action"
        "event_action_label.value.string_value" => "%{event_action}"
      }
      on_error => "event_action_value_invalid"
    }
    if ![event_action_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_action_label"
        }
        on_error => "event_action_label_merge_failed"
      }
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "principal_machine_id_present" => "true"
      }
      on_error => "host_value_invalid"
    }
  }

  if [date_value] != "" and [time] != "" {
    mutate {
      replace => {
        "date_time" => "%{date_value} %{time}"
      }
      on_error => "date_time_source_value_invalid"
    }
  }

  if [date_time] != "" {
    mutate {
      replace => {
        "date_time_label.key" => "date_time"
        "date_time_label.value.string_value" => "%{date_time}"
      }
      on_error => "date_time_value_invalid"
    }
    if ![date_time_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "date_time_label"
        }
        on_error => "date_time_label_merge_failed"
      }
    }
  }


  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "=([\\w-]+)  ", "=$1#"]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "kv_data_invalid"
    }
  }

  if [json_data] != "" {
    mutate {
      gsub => ["json_data", "\\\\", "/"]
    }
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "source_not_json"
    }
    if [source_not_json] {
      mutate {
        replace => {
          "desc" => "%{json_data}"
        }
        on_error => "json_data_replace_failed"
      }
    }
  }

  if [SqlState] != "" {
    mutate {
      replace => {
        "SqlState_label.key" => "SqlState"
        "SqlState_label.value" => "%{SqlState}"
      }
      on_error => "SqlState_value_invalid"
    }
    if ![SqlState_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "SqlState_label"
        }
        on_error => "SqlState_label_merge_failed"
      }
    }
  }

  if [NativeError] != "" {
    mutate {
      replace => {
        "NativeError_label.key" => "NativeError"
        "NativeError_label.value" => "%{NativeError}"
      }
      on_error => "NativeError_value_invalid"
    }
    if ![NativeError_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "NativeError_label"
        }
        on_error => "NativeError_label_merge_failed"
      }
    }
  }

  if [ErrorMsg] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{ErrorMsg}"
      }
      on_error => "ErrorMsg_value_invalid"
    }
  }
  else if [summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{summary}"
      }
      on_error => "summary_value_invalid"
    }
  }

  if [thread] != "" {
    mutate {
      replace => {
        "thread_label.key" => "thread"
        "thread_label.value.string_value" => "%{thread}"
      }
      on_error => "thread_value_invalid"
    }
    if ![thread_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "thread_label"
        }
        on_error => "thread_label_merge_failed"
      }
    }
  }

  if [m] != "" {
    mutate {
      replace => {
        "m_label.key" => "m"
        "m_label.value.string_value" => "%{m}"
      }
      on_error => "m_value_invalid"
    }
    if ![m_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "m_label"
        }
        on_error => "m_label_merge_failed"
      }
    }
  }

  if [fn] != "" {
    mutate {
      replace => {
        "fn_label.key" => "fn"
        "fn_label.value.string_value" => "%{fn}"
      }
      on_error => "fn_value_invalid"
    }
    if ![fn_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "fn_label"
        }
        on_error => "fn_label_merge_failed"
      }
    }
  }

  if [pem_file_path] != "" {
    mutate {
      replace => {
        "principal.file.full_path" => "%{pem_file_path}"
      }
      on_error => "pem_file_path_value_invalid"
    }
  }

  if [sev] != "" {
    mutate {
      replace => {
        "sev_label.key" => "sev"
        "sev_label.value" => "%{sev}"
      }
      on_error => "sev_value_invalid"
    }
    if ![sev_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sev_label"
        }
        on_error => "sev_label_merge_failed"
      }
    }
  }

  if [sev] =~ "normal" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
      on_error => "sev_value_not_valid"
    }
  }

  if [mode] != "" {
    mutate {
      convert => {
        "mode" => "string"
      }
      on_error => "mode_value_already_string"
    }
    mutate {
      replace => {
        "mode_label.key" => "mode"
        "mode_label.value" => "%{mode}"
      }
      on_error => "mode_value_invalid"
    }
    if ![mode_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "mode_label"
        }
        on_error => "mode_label_merge_failed"
      }
    }
  }

  # metadata info
  mutate {
    replace => {
      "metadata.vendor_name" => "VERITAS NETBACKUP"
      "metadata.product_name" => "Veritas Netbackup"
    }
  }
  mutate {
    replace => {
      "metadata.description" => "%{desc}"
      "metadata.product_event_type" => "%{product_event_type}"
    }
    on_error => "metadata_src_value_invalid"
  }

  if [event_type] == "" {
    if [event_category] =~ "LOGIN" and [target_user] != "" {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [event_action] == "ACCESS" {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else if [principal_machine_id_present] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_value_invalid"
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [observer] != "" {
    mutate {
      rename => {
        "observer" => "event.idm.read_only_udm.observer"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }


  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
