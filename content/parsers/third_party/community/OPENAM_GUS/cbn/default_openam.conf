# Product: ForgeRock OpenAM
# Category: Identity and Access Management
# Supported Format: CSV, SYSLOG + KV
# Reference: https://backstage.forgerock.com/docs/openam/13.5/reference/#chap-audit-log-messages
# Last Updated: 2024-11-28
# Copyright 2024 Chronicle LLC

filter {

  mutate {
    replace => {
      "_is_csv_format" => "false"
      "am_group" => ""
      "am_user" => ""
      "loginID.0" => ""
      "_target_email" => ""
      "info.nodeId" => ""
      "info.treeName" => ""
      "info.nodeOutcome" => ""
      "info.nodeType" => ""
      "info.displayName" => ""
      "info.authLevel" => ""
      "info.ipAddress" => ""
      "target" => ""
      "hostip" => ""
      "action1" => ""
      "security_result" => ""
      "desc" => ""
      "result" => ""
      "host.0" => ""
      "userId" => ""
      "syslog_timestamp" => ""
      "src_ip" => ""
      "eventName" => ""
      "security_result_action" => ""
      "payload" => ""
      "jsonPayload" => ""
      "ip_mapped" => "false"
      "principal_present" => "false"
      "_id_data" => ""
      "realm_data" => ""
      "component_data" => ""
      "entryData.info.nodeType" => ""
      "entryData.info.displayName" => ""
      "entryData.info.authLevel" => ""
      "entryData.info.nodeId" => ""
      "entryData.info.treeName" => ""
      "entryData.info.nodeOutcome" => ""
      "entryData.info.additionalRequestData" => ""
      "has_json_data" => "false"
    }
  }

  if [message] =~ "^DEBUG: Access allowed for class " {
    drop {
      tag => "TAG_NO_SECURITY_VALUE"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    grok {
      match => {
        "message" => [
            '%{DATA}-%{WORD}-%{WORD}",%{GREEDYDATA:json_data}'
        ]
      }
      overwrite => ["json_data"]
      on_error => "not_json_format"
    }

    if ![not_json_format] {
      mutate {
        gsub => ["json_data", '\\"timestamp\\"', '{\"timestamp\"' ]
      }

      json {
        source => "json_data"
        array_function => "split_columns"
        on_error => "not_json_data"
      }

      if ![not_json_data] {
        mutate {
          replace => {
            "has_json_data" => "true"
          }
        }
      }
    }
  }

  if ![not_json] or [has_json_data] == "true" {
    date {
      match => ["timestamp", "ISO8601" , "yyyy-MM-ddTHH:mm:ss.SSSZ"]
      rebase => true
      on_error => "date_error"
    }
    mutate {
      replace => {
        "component_data" => "%{component}"
      }
      on_error => "no_component"
    }
    if [component_data] != "" {
      mutate {
        replace => {
          "component_label.key" => "Component"
          "component_label.value" => "%{component_data}"
        }
        on_error => "no_component"
      }
      if ![no_component] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "component_label"
          }
          on_error => "no_component_label"
        }
      }
    }

    mutate {
      replace => {
        "_id_data" => "%{_id}"
      }
      on_error => "no_id"
    }
    if [_id_data] != "" {
      mutate {
        replace => {
          "_id_label.key" => "ID"
          "_id_label.value" => "%{_id_data}"
        }
        on_error => "no_id"
      }
      if ![no_id] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "_id_label"
          }
          on_error => "no_id_label"
        }
      }
    }

    mutate {
      replace => {
        "realm_data" => "%{realm}"
      }
      on_error => "no_realm"
    }
    if [realm_data] != "" {
      mutate {
        replace => {
          "realm_label.key" => "Realm"
          "realm_label.value" => "%{realm_data}"
        }
        on_error => "no_realm"
      }
      if ![no_realm] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "realm_label"
          }
          on_error => "no_realm_label"
        }
      }
    }

    for index, entryData in entries {
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "no_index"
      }
      mutate {
        replace => {
          "nodeOutcomedata" => ""
          "treeName" => ""
          "nodeType" => ""
          "displayName" => ""
          "authLevel" => ""
          "nodeId" => ""
        }
      }
      mutate {
        replace => {
          "nodeOutcomedata" => "%{entryData.info.nodeOutcome}"
        }
        on_error => "no_nodeOutcomedata"
      }
      if [nodeOutcomedata] != "" {
        mutate {
          replace => {
            "nodeOutcome_label.key" => "Node Outcome"
            "nodeOutcome_label.value" => "%{nodeOutcomedata}"
          }
          on_error => "no_nodeOutcome"
        }
        if ![no_nodeOutcome] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => 
              "nodeOutcome_label"
            }
            on_error => "no_nodeOutcome_label"
          }
        }
      }
      mutate {
        replace => {
          "treeName" => "%{entryData.info.treeName}"
        }
        on_error => "no_treeName"
      }
      if [treeName] != "" {
        mutate {
          replace => {
            "treeName_label.key" => "Tree Name"
            "treeName_label.value" => "%{treeName}"
          }
          on_error => "no_treeName"
        }
        if ![no_treeName] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "treeName_label"
            }
            on_error => "no_treeName_label"
          }
        }
      }
      mutate {
        replace => {
          "nodeType" => "%{entryData.info.nodeType}"
        }
        on_error => "no_nodeType"
      }
      if [nodeType] != "" {
        mutate {
          replace => {
            "nodeType_label.key" => "Node Type"
            "nodeType_label.value" => "%{nodeType}"
          }
          on_error => "no_nodeType"
        }
        if ![no_nodeType] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "nodeType_label"
            }
            on_error => "no_nodeType_label"
          }
        }
      }
      mutate {
        replace => {
          "displayName" => "%{entryData.info.displayName}"
        }
        on_error => "no_displayName"
      }
      if [displayName] != "" {
        mutate {
          replace => {
            "displayName_label.key" => "Display Name"
            "displayName_label.value" => "%{displayName}"
          }
          on_error => "no_displayName"
        }
        if ![no_displayName] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "displayName_label"
            }
            on_error => "no_displayName_label"
          }
        }
      }
      mutate {
        replace => {
          "authLevel" => "%{entryData.info.authLevel}"
        }
        on_error => "no_authLevel"
      }
      if [authLevel] != "" {
        mutate {
          convert => {
            "authLevel" => "string"
          }
          on_error => "no_authLevel"
        }
        mutate {
          replace => {
            "authLevel_label.key" => "Auth Level"
            "authLevel_label.value" => "%{authLevel}"
          }
          on_error => "no_authLevel"
        }
        if ![no_authLevel] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "authLevel_label"
            }
            on_error => "no_authLevel_label"
          }
        }
      }
      mutate {
        replace => {
          "nodeId" => "%{entryData.info.nodeId}"
        }
        on_error => "no_nodeId"
      }
      if [nodeId] != "" {
        mutate {
          replace => {
            "nodeId_label.key" => "Node ID"
            "nodeId_label.value" => "%{nodeId}"
          }
          on_error => "no_nodeId"
        }
        if ![no_nodeId] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "nodeId_label"
            }
            on_error => "no_nodeId_label"
          }
        }
      }
      mutate {
        replace => {
          "client_list.value" => ""
        }
      }
      for clientdata in entryData.info.nodeExtraLogging.CimAzClient {
        mutate {
          replace => {
            "cimclient_label" => ""
          }
        }
        mutate {
          replace => {
            "cimclient_label.string_value" => "%{clientdata}"
          }
          on_error => "no_cimclient_label"
        }
        if ![no_cimclient_label] {
          mutate {
            merge => {
              "client_list.value.list_value.values" => "cimclient_label"
            }
            on_error => "no_cimclient_label"
          }
        }
      }
      if [client_list][value] != "" {
        mutate {
          replace => {
            "client_list.key" => "%{index}:Client List"
          }
          on_error => "no_client_list_key"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "client_list"
          }
          on_error => "no_client_list"
        }
      }
      mutate {
        replace => {
          "reqData.clientId" => ""
          "reqData.clientName" => ""
          "reqData.parentApplicationName" => ""
          "uid" => ""
          "ruser" => ""
          "reqData.callerIps" => ""
        }
      }
      for reqData in entryData.info.additionalRequestData {
        if [reqData][clientId] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.asset.asset_id" => "Id:%{reqData.clientId}"
            }
            on_error => "no_clientId"
          }
        }
        if [reqData][clientName] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.hostname" => "%{reqData.clientName}"
              "event.idm.read_only_udm.principal.asset.hostname" => "%{reqData.clientName}"
              "principal_present" => "true"
            }
            on_error => "no_clientName"
          }
        }
        if [reqData][parentApplicationName] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.application" => "%{reqData.parentApplicationName}"
            }
            on_error => "no_parentApplicationName"
          }
        }
        mutate {
          replace => {
            "uid" => "%{reqData.uid}"
          }
          on_error => "no_uid"
        }
        if [uid] != "" and [uid] != "null" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.userid" => "%{uid}"
            }
            on_error => "no_uid"
          }
        }
        mutate {
          replace => {
            "ruser" => "%{reqData.user}"
          }
          on_error => "no_ruser"
        }
        if [ruser] != "" and [ruser] != "null" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.user_display_name" => "%{ruser}"
            }
            on_error => "no_ruser"
          }
        }
        if [reqData][callerIps] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "reqData.callerIps"
              "event.idm.read_only_udm.principal.asset.ip" => "reqData.callerIps"
            }
            on_error => "no_callerIps"
          }
          mutate {
            replace => {
              "principal_present" => "true"
            }
          }
        }
        if [reqData][userAgent] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.http.user_agent" => "%{reqData.userAgent}"
            }
            on_error => "no_userAgent"
          }
          mutate {
            convert => {
              "reqData.userAgent" => "parseduseragent"
            }
            on_error => "conversion_useragent_failed"
          }
          mutate {
            rename => {
              "reqData.userAgent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
            }
            on_error => "rename_failure_useragent"
          }
        }
      }
    }

    mutate {
      replace => {
        "tracking_list.value" => ""
      }
    }
    for ind,trackingId in trackingIds {
      mutate {
        convert => {
          "ind" => "string"
        }
        on_error => "no_ind"
      }
      mutate {
        replace => {
          "track_label" => ""
        }
      }
      mutate {
        replace => {
          "track_label.string_value" => "%{trackingId}"
        }
        on_error => "no_trackingId"
      }
      if ![no_trackingId] {
        mutate {
          merge => {
            "tracking_list.value.list_value.values" => "track_label"
          }
          on_error => "no_tracking_list"
        }
      }
    }
    if [tracking_list][value] != "" {
      mutate {
        replace => {
          "tracking_list.key" => "%{ind}:Tracking ID"
        }
        on_error => "no_tracking_list_key"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tracking_list"
        }
        on_error => "no_tracking_list"
      }
    }

    if [payload] != "" {
      grok {
        match => {
          "message" => [
            ".*payload\":(?P<jsonPayload>.*}),",
          ]
        }
        overwrite => ["jsonPayload"]
        on_error => "pattern_not_matched"
      }
      if [jsonPayload] != "" and ![pattern_not_matched]{
        json {
          source => "jsonPayload"
          array_function => "split_columns"
          on_error => "invalid_json"
        }
        if not [invalid_json] {
          for entry in principal {
            grok {
              match => {
                "entry" => [
                  "id=%{DATA:am_user},%{GREEDYDATA:am_group}"
                  "%{GREEDYDATA:am_user}"
                ]
              }
              overwrite => ["am_user", "am_group"]
              on_error => "no_principal_username"
            }
          }
        }
      } else if [pattern_not_matched] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{payload}"
          }
          on_error => "invalid_description"
        }
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
      rebase => true
      on_error => "date_error"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{eventName}"
      }
      on_error => "no_eventName"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{trackingIds.0}"
      }
      on_error => "no_trackingIds"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_deployment_id" => "%{transactionId}"
      }
      on_error => "no_transactionId"
    }

    mutate {
      rename => {
        "http.request.path" => "event.idm.read_only_udm.target.url"
        "http.request.method" => "event.idm.read_only_udm.network.http.method"
      }
    }

    if [userId] != "" {
      grok {
        match => {
          "userId" => "id=%{DATA:am_user},%{GREEDYDATA:am_group}"
        }
        overwrite => ["am_user","am_group"]
        on_error => "no_user_group_identifiers"
      }
    }

    for index,entry in entries {
      if [index] == 0 {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.resource.name" => "treeName:%{entry.info.treeName}"
          }
          on_error => "no_treeName"
        }

        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "entry.info.ipAddress"
            "event.idm.read_only_udm.principal.asset.ip" => "entry.info.ipAddress"
          }
          on_error => "no_ipAddress"
        }

        if not [no_ipAddress] {
          mutate {
            replace => {
              "principal_present" => "true"
            }
          }
        }

        mutate {
          replace => {
            "event.idm.read_only_udm.principal.resource.resource_subtype" => "authLevel:%{entry.info.authLevel}"
          }
          on_error => "no_authLevel"
        }
      }
    }

    if [result] == "FAILED" {
      mutate {
        replace => {
          "action1" => "BLOCK"
        }
      }
    }
    else if [result] == "SUCCESSFUL" {
      mutate {
          replace => {
            "action1" => "ALLOW"
          }
      }
    }
    if [action1] != "" {
      mutate {
        merge => {
          "security_result.action" => "action1"
        }
      }
    }
    if [result] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{result}"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }

    if [eventName] in ["AM-TREE-LOGIN-COMPLETED","AM-SESSION-CREATED","AM-NODE-LOGIN-COMPLETED"] and [userId]!= "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    }
    else if [eventName] in ["AM-SESSION-LOGGED_OUT", "AM-SESSION-DESTROYE", "AM-SESSION-IDLE_TIMED_OUT"] and [userId]!= "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    }
    else if [eventName] == "AM-ACCESS-OUTCOME" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{http.request.headers.host.0}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{http.request.headers.host.0}"
        }
        on_error => "field_not_set"
      }
      if not [field_not_set] {
        mutate {
          replace => {
            "target" => "%{http.request.headers.host.0}"
          }
          on_error => "invalid"
        }
      }
      mutate {
        rename => {
          "http.request.headers.user-agent.0" => "event.idm.read_only_udm.network.http.user_agent"
        }
      }

      mutate {
        rename => {
          "http.request.path" => "event.idm.read_only_udm.target.url"
          "http.request.method" => "event.idm.read_only_udm.network.http.method"
        }
      }
      if [http][request][secure] == true {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "HTTPS"
          }
          on_error => "invalid_proto"
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "HTTP"
          }
          on_error => "invalid_proto"
        }
      }

      mutate {
        replace => {
          "security_result.summary" => "%{response.detail.reason}"
        }
        on_error => "reason_field_not_set"
      }
    }
  }
  else {

    # Discard csv headers and apmd logs.
    grok {
      match => {
        "message" => [
          "^%{SYSLOGTIMESTAMP} %{IPORHOST:hostip} apmd\\[%{NUMBER}]%{GREEDYDATA:apmd_message}"
          "^\"_id\",\"timestamp\",\"eventName\",%{GREEDYDATA:csv_header}"
        ]
      }
      overwrite => ["hostip"]
      on_error => "expected_log_format"
    }
    if ![expected_log_format] {
      drop {
        tag => "TAG_UNSPECIFIED"
      }
    }

    # Try syslog + kv log format
    grok {
      match => {
        "message" => [
          "^%{SYSLOGTIMESTAMP} %{IPORHOST:hostip} %{TIMESTAMP_ISO8601:timestamp} %{DATA} %{NUMBER} %{DATA:eventName} \\[%{NOTSPACE:log_type}%{GREEDYDATA:kv_data}]",
          "%{TIMESTAMP_ISO8601:timestamp} %{IPORHOST:hostip} OpenAM (?:%{POSINT} |)%{DATA:eventName} \\[%{NOTSPACE:log_type}%{GREEDYDATA:kv_data}]",
          "<%{INT}>%{SYSLOGTIMESTAMP:syslog} %{GREEDYDATA:desc}"
          "%{SYSLOGTIMESTAMP:syslog_timestamp} %{IP:src_ip} %{GREEDYDATA:desc}"
          ": TransactionId%{GREEDYDATA:trackingIds}"
        ]
      }
      overwrite => ["hostip","desc", "syslog_timestamp", "src_ip","eventName"]
      on_error => "not_syslog_kv_log_format"
    }

    if [syslog_timestamp] != "" {
      date {
        match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM d HH:mm:ss"]
        rebase => true
        on_error => "date_error"
      }
    }

    if [desc] == "" {
      if [not_syslog_kv_log_format] {
        # Try CSV format
        csv {
          source => "message"
          separator => ","
          skip_empty_columns => "true"
          on_error => "not_csv_log_format"
        }
        if [not_csv_log_format] {
          # Unknown format, discard it.
          grok {
            match => {
              "message" => [
                "%{GREEDYDATA:desc}"
              ]
            }
            overwrite => ["desc"]
            on_error => "not_log_format"
          }
        }
        else {
          # It is CSV format. Flag it to normalize the fields later.
          mutate {
            replace => {
              "_is_csv_format" => "true"
            }
          }
        }
      }
      else {
        # Work with syslog + kv format
        kv {
          source => "kv_data"
          field_split => " "
          value_split => "="
          trim_value => "\""
          on_error => "is_error_in_ist_kv"
        }
        if [is_error_in_ist_kv] {
          mutate {
            replace => {
              "response.status" => ""
            }
          }
          grok {
            match => {
              "message" => [
                "%{TIMESTAMP_ISO8601} %{IPORHOST} OpenAM (?:%{POSINT} |)%{DATA} \\[%{NOTSPACE}%{GREEDYDATA:kv_data_2nd}"
              ]
            }
            on_error => "match_error"
          }
          mutate {
            gsub => [ "kv_data_2nd", "( [a-zA-Z0-9]+(.[a-zA-Z0-9]+.[a-zA-Z0-9]+)?=)", "|$1" ]
          }
          mutate {
            gsub => [ "kv_data_2nd", "\"", "" ]
          }
          kv {
            source => "kv_data_2nd"
            field_split => "|"
            value_split => "="
            on_error => "is_error_in_2nd_kv"
          }
        }
      }
      mutate {
        convert => {
          "_is_csv_format" => "boolean"
        }
      }

      # Normalize CSV fields, renaming then to match KV field names (names from documentation).
      if [_is_csv_format] {
        # First columns match across all log types
        mutate {
          rename => {
            "column1" => "_id"
            "column2" => "timestamp"
            "column4" => "transactionId"
            "column6" => "trackingIds"
          }
        }
        mutate {
          replace => {
            "eventName" => "%{column3}"
          }
          on_error => "column3_field_not_found"
        }
        mutate {
          replace => {
            "userId" => "%{column5}"
          }
          on_error => "column5_field_not_found"
        }
        if [eventName] =~ "AM-LOG" {
          mutate {
            rename => {
              "column8" => "principal"
              "column9" => "context"
              "column10" => "entries"
              "column11" => "component"
              "column12" => "realm"
            }
          }
          if [column7] != "" {
            mutate {
              replace => {
                "result" => "%{column7}"
              }
            }
          }
        }
        else if [eventName] =~ "AM-SESSION-" {
          mutate {
            rename => {
              "column7" => "runAs"
              "column8" => "objectId"
              "column9" => "operation"
              # Columns 10 to 13 are not used (blank values).
              "column14" => "component"
              "column15" => "realm"
            }
          }
        }
        else if [eventName] =~ "AM-ACCESS-" {
          mutate {
            rename => {
              "column7" => "server.ip"
              "column8" => "server.port"
              "column9" => "client.ip"
              "column10" => "client.port"
              "column11" => "request.protocol"
              "column12" => "request.operation"
              "column13" => "request.detail"
              "column14" => "http.request.secure"
              "column15" => "http.request.method"
              "column16" => "http.request.path"
              "column17" => "http.request.queryParameters"
              "column18" => "http.request.headers"
              "column19" => "http.request.cookies"
              "column20" => "http.response.headers"
              "column21" => "response.status"
              "column22" => "response.statusCode"
              "column23" => "response.detail"
              "column24" => "response.elapsedTime"
              "column25" => "response.elapsedTimeUnits"
              "column26" => "component"
              "column27" => "realm"
            }
          }
        }
      }

      # Adjust escaped quotes in KV format to match CSV format so we can process them the same way: \\\" to \"
      mutate {
        gsub => ["entries", "\\\\" , ""]
      }
      mutate {
        gsub => ["principal", "\\\\" , ""]
      }
      mutate {
        gsub => ["trackingIds", "\\\\" , ""]
      }

      date {
        match => ["timestamp", "RFC3339", "UNIX", "ISO8601"]
        on_error => "timestamp_not_found"
      }

      # Clean up Transaction ID, varies depending on log type
      mutate {
        gsub => ["trackingIds", "\\[",""]
      }
      mutate {
        gsub => ["trackingIds", "\\]", ""]
      }
      mutate {
        gsub => ["trackingIds", "\"",""]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_name" => "OpenAM"
          "event.idm.read_only_udm.metadata.vendor_name" => "ForgeRock"
          "event.idm.read_only_udm.metadata.product_event_type" => "%{eventName}"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{trackingIds}"
        }
        on_error => "no_trackingIds"
      }

      # Build the event description.
      grok {
        match => {
          "eventName" => "AM-(?P<event_description_first_char>.)%{GREEDYDATA:event_description_remaining_chars}"
        }
        on_error => "no_eventName_error"
      }
      mutate {
        gsub => ["event_description_remaining_chars", "-"," "]
      }
      mutate {
        gsub => ["event_description_remaining_chars", "_"," "]
      }
      mutate {
        lowercase => [ "event_description_remaining_chars" ]
      }
      if ![no_eventName_error] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{event_description_first_char}%{event_description_remaining_chars}"
          }
        }
      }

      # Grok for the User and Group ID
      grok {
        match => {
          "userId" => [
            "id=%{DATA:am_user},%{GREEDYDATA:am_group}"
            "CN=%{DATA:am_user},%{GREEDYDATA:am_group}"
          ]
        }
        overwrite => ["am_user", "am_group"]
        on_error => "no_username"
      }

      # prioritize userId, then principal, then runAs
      if [no_username] {
        mutate {
          gsub => ["principal", "\\[",""]
        }
        mutate {
          gsub => ["principal", "\\]", ""]
        }
        mutate {
          gsub => ["principal", "\"",""]
        }

        grok {
          match => {
            "principal" => [
              "id=%{DATA:am_user},%{GREEDYDATA:am_group}"
              "%{GREEDYDATA:am_user}"
            ]
          }
          overwrite => ["am_user", "am_group"]
          on_error => "no_principal_username"
        }

        if [no_principal_username] {
          grok {
            match => {
              "runAs" => "id=%{DATA:am_user},%{GREEDYDATA:am_group}"
            }
            overwrite => ["am_user", "am_group"]
            on_error => "no_runas_username"
          }
        }
      }

      if [eventName] =~ "AM-LOG" {
        if [result] == "FAILED" {
          mutate {
            replace => {
              "action1" => "BLOCK"
            }
          }
        }
        else if [result] == "SUCCESSFUL" {
          mutate {
            replace => {
              "action1" => "ALLOW"
            }
          }
        }
        if [action1] != "" {
          mutate {
            merge => {
              "security_result.action" => "action1"
            }
          }
        }
        if [result] != "" {
          mutate {
            replace => {
              "security_result.action_details" => "%{result}"
            }
          }
        }
      }
      else if [eventName] == "AM-ACCESS-OUTCOME" {
        mutate {
          replace => {
            "x-forgerock-transactionid.0" => ""
          }
        }
        json {
          source => "http.request.headers"
          array_function => "split_columns"
          on_error => "no_request_headers_data"
        }
        mutate {
          gsub => ["host.0", ":.*",""]
        }
        if [host][0] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.hostname" => "%{host.0}"
              "event.idm.read_only_udm.target.asset.hostname" => "%{host.0}"
            }
          }
        }
        mutate {
          rename => {
            "user-agent.0" => "event.idm.read_only_udm.network.http.user_agent"
            "x-forgerock-transactionid.0" => "_forgerock_transactionid"
          }
        }
        if [_forgerock_transactionid] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.product_log_id" => "%{_forgerock_transactionid}"
            }
          }
        }
        json {
          source => "http.request.queryParameters"
          array_function => "split_columns"
          on_error => "no_request_data"
        }

        mutate {
          replace => {
            "_target_email" => "%{loginID.0}"
          }
        }

        if [_target_email] != "" and [_target_email] =~ "^.+@.+$" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.user.userid" => "%{_target_email}"
              "target" => "%{_target_email}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.user.email_addresses" => "_target_email"
            }
          }
        }

        mutate {
          rename => {
            "http.request.path" => "event.idm.read_only_udm.target.url"
            "http.request.method" => "event.idm.read_only_udm.network.http.method"
          }
        }
        if [message] =~ ".*http.request.secure" || [http][request][secure] == "true" {
          if [http][request][secure] == "true" {
            mutate {
              replace => {
                "event.idm.read_only_udm.network.application_protocol" => "HTTPS"
              }
            }
          }
          else {
            mutate {
              replace => {
                "event.idm.read_only_udm.network.application_protocol" => "HTTP"
              }
            }
          }
        }

        json {
          source => "response.detail"
          on_error => "no_outcome_json"
        }

        mutate {
          replace => {
            "security_result.summary" => "%{reason}"
          }
          on_error => "reason_field_not_set"
        }
      }
      else if [eventName] =~ "AM-TREE" {
        if [result] =~ "(?i)successful" {
          mutate {
            replace => {
              "action1" => "ALLOW"
            }
          }
        } else if [result] =~ "(?i)failed" {
          mutate {
            replace => {
              "action1" => "BLOCK"
            }
          }
        }

        if [action1] != "" {
          mutate {
            merge => {
              "security_result.action" => "action1"
            }
          }
        }

        if [result] != "" {
          mutate {
            gsub => ["result", "\"", ""]
          }
          mutate {
            replace => {
              "security_result.action_details" => "%{result}"
            }
          }
        }
      } else if [eventName] =~ "AM-NODE" {
        if [am_user] != "" {
          mutate {
            gsub => ["am_user", "\\s+", ""]
          }
        }
      }

      mutate {
        replace => {
          "temp_entries" => "%{entries}"
        }
        on_error => "entries_not_found"
      }
      if ![entries_not_found] {
        mutate {
          gsub => ["entries" , "\\]",""]
        }
        mutate {
          gsub => ["entries" , "\\[",""]
        }
        mutate {
          gsub => ["entries" , '^\\"|\\"$',""]
        }
        json {
          source => "entries"
          array_function => "split_columns"
          on_error => "json_entries_error1"
        }
        if [info][nodeId] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.resource.id" => "nodeId:%{info.nodeId}"
            }
          }
        }

        if [info][treeName] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.resource.name" => "treeName:%{info.treeName}"
            }
          }
        }

        if [info][nodeOutcome] != "" {
          mutate {
            replace => {
              "nodeOutcome.key" => "Node Outcome"
              "nodeOutcome.value" => "%{info.nodeOutcome}"
            }
          }

          mutate {
            merge => {
              "event.idm.read_only_udm.principal.resource.attribute.labels" => "nodeOutcome"
            }
          }
        }

        if [info][authLevel] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.resource.resource_subtype" => "authLevel:%{info.authLevel}"
            }
          }
        }

        if [info][nodeType] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.resource.type" => "nodeType:%{info.nodeType}"
            }
          }
        }

        if [info][displayName] != "" {
          mutate {
            replace => {
              "security_result.description" => "%{info.displayName}"
            }
          }
        }

        if [info][ipAddress] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "info.ipAddress"
              "event.idm.read_only_udm.principal.asset.ip" => "info.ipAddress"
            }
          }
          mutate {
            replace => {
              "principal_present" => "true"
            }
          }
        }
        mutate {
          rename => {
            "info.failureReason" => "security_result.summary"
          }
        }
      }

      if [hostip] != "" {
        grok {
          match => {
            "hostip" => "%{IP:ip1}"
          }
          on_error => "notIp"
        }
        if [notIp] {
          mutate {
            replace => {
              "intermediary.hostname" => "%{hostip}"
            }
          }
        }
        else {
          mutate {
            merge => {
              "intermediary.ip" => "hostip"
            }
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.intermediary" => "intermediary"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
          "event.idm.read_only_udm.metadata.description" => "%{desc}"
        }
      }

      if [src_ip] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
          merge => {
            "event.idm.read_only_udm.principal.ip" => "src_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
          }
        }
      }
    }
  }

  if [eventName] == "AM-ACCESS-OUTCOME" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }

    if [am_user] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "am_user"
        }
      }
    }
    if [am_user] != "" {
      mutate {
        rename => {
          "am_user" => "event.idm.read_only_udm.principal.user.userid"
        }
      }
    }
    if [am_group] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" => "am_group"
        }
      }
    }

    mutate {
      replace => {
        "temp_ip" => "%{client.ip}"
      }
      on_error => "no_client_ip"
    }
    mutate {
      convert => {
        "temp_ip" => "ipaddress"
      }
      on_error => "not_an_ip"
    }
    if ![not_an_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "client.ip"
          "event.idm.read_only_udm.principal.asset.ip" => "client.ip"
        }
        on_error => "not_ip"
      }
      if not [not_ip] {
        mutate {
          replace => {
            "ip_mapped" => "true"
            "principal_present" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      convert => {
        "client.port" => "integer"
      }
      on_error => "port_not_found"
    }
    if ![port_not_found] {
      mutate {
        rename => {
          "client.port" => "event.idm.read_only_udm.principal.port"
        }
      }
    }

    # Target
    mutate {
      replace => {
        "server_ip" => "%{server.ip}"
      }
      on_error => "no_server_ip"
    }
    mutate {
      convert => {
        "server_ip" => "ipaddress"
      }
      on_error => "server_not_an_ip"
    }
    if ![server_not_an_ip] and ![no_server_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "server.ip"
          "event.idm.read_only_udm.target.asset.ip" => "server.ip"
        }
        replace => {
          target => "%{server.ip}"
        }
      }
    }

    mutate {
      convert => {
        "server.port" => "integer"
      }
      on_error => "server_port_not_found"
    }
    if ![server_port_not_found] {
      mutate {
        rename => {
          "server.port" => "event.idm.read_only_udm.target.port"
        }
      }
    }

    if ([not_an_ip] or [target] == "") and [event][idm][read_only_udm][metadata][event_type] =~ "NETWORK_" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    mutate {
      replace => {
        "security_result.action_details" => "%{response.status}"
      }
      on_error => "no_response_status"
    }

    if ![no_response_status] {
      if [response][status] in ["SUCCESSFUL","ALLOWED"] {
        mutate {
          replace => {
            "security_result_action" => "ALLOW"
          }
        }
      }
      else if [response][status] == "FAILED" {
        mutate {
          replace => {
            "security_result_action" => "BLOCK"
          }
        }
      }
      if [security_result_action] != "" {
        mutate {
          merge => {
            "security_result.action" => "security_result_action"
          }
          on_error => "no_action"
        }
      }
    }
  }
  else {
    if [am_user] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.email_addresses" => "am_user"
        }
        replace => {
          "target" => "%{am_user}"
        }
      }
    }
    if [am_user] != "" {
      mutate {
        replace => {
          "target" => "%{am_user}"
          "event.idm.read_only_udm.target.user.userid" => "%{am_user}"
        }
      }
    }
    if [am_group] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.group_identifiers" => "am_group"
        }
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [eventName] in ["AM-SESSION-LOGGED_OUT","AM-SESSION-DESTROYED","AM-SESSION-IDLE_TIMED_OUT","AM-SESSION-MAX_TIMED_OUT"] or [eventName] =~ "AM-LOGOUT" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "SSO"
      }
    }
  }
  else if [eventName] =~ "AM-LOGIN" or [eventName] in ["AM-SESSION-CREATED", "AM-TREE-LOGIN-COMPLETED","AM-NODE-LOGIN-COMPLETED"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "SSO"
      }
    }
  }

  if [target] == "" and [userId] == "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [ip_mapped] == "false" {
    mutate {
      replace => {
        "temp_ip" => "%{client.ip}"
      }
      on_error => "no_client_ip"
    }
    if not [no_client_ip] {
      grok {
        match => {
          "temp_ip" => "%{IP:temp_ip}"
        }
        overwrite => ["temp_ip"]
        on_error => "not_ip"
      }
      if not [not_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "temp_ip"
            "event.idm.read_only_udm.principal.asset.ip" => "temp_ip"
          }
          on_error => "no_ip"
        }
        if not [no_ip] {
          mutate {
            replace => {
              "principal_present" => "true"
            }
          }
        }
      }
    }
  }

  if ([src_ip] != "" or [principal_present] == "true") and [event][idm][read_only_udm][metadata][event_type] == "GENERIC_EVENT" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "OpenAM"
      "event.idm.read_only_udm.metadata.vendor_name" => "ForgeRock"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
