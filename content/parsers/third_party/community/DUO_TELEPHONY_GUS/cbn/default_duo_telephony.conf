# Product: DUO_TELEPHONY
# Category: Identity and Access Management
# Supported Format: JSON
# Reference: See below
# Last Updated: 2023-08-24
# Copyright 2023 Chronicle LLC

# Additional references:
# https://duo.com/docs/adminapi#telephony-logs-(legacy-v1)
# https://duo.com/docs/adminapi#telephony-logs
# https://help.duo.com/s/article/4179?language=en_US


filter {
  mutate {
    replace => {
      "metadata"          => ""
      "principal"         => ""
      "target"            => ""
      "security_result"   => ""
      "extensions"        => ""
      "event_type"        => ""
      "context"           => ""
      "credits"           => ""
      "phone"             => ""
      "timestamp"         => ""
      "type"              => ""
      "eventtype"         => ""
      "host"              => ""
      "action"            => ""
      "txid"              => ""
      "telephony_id"      => ""
      "ts"                => ""
    }
  }

  # parse log as json
  json {
    source         => "message"
    array_function => "split_columns"
    on_error       => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [timestamp] != "" {
    # by default timestamp is parsed as float64 but we need it as a string
    mutate {
      convert => {
        "timestamp" => "string"
      }
      on_error => "timestamp_convert_failed"
    }
    if [timestamp_convert_failed] == false {
      date {
        match => ["timestamp", "UNIX" ]
        on_error => "invalid_time_format"
        target => "metadata.event_timestamp"
      }
    }
  }

  if [ts] != "" {
    date {
      match => ["timestamp", "ISO8601" , "yyyy-MM-ddTHH:mm:ss.SSSSSSZ" ]
      on_error => "invalid_time_format"
      target => "metadata.event_timestamp"
    }
  }

  if [context] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{context}"
      }
      on_error => "no_context"
    }
  }

  # setting phone in both user.phone_numbers and user.userid to set event_type
  if [phone] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{phone}"
      }
      merge => {
        "principal.user.phone_numbers" => "phone"
      }
      on_error => "no_phone"
    }
  }

  if [type] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{type}"
      }
      on_error => "no_type"
    }
  }

  if [credits] != "" {
    mutate {
      replace => {
        "credits_label.key" => "credits"
        "credits_label.value" => "%{credits}"
      }
      merge => {
        "security_result.detection_fields" => "credits_label"
      }
      on_error => "no_credits"
    }
  }

  if [eventtype] != "" {
    mutate {
      replace => {
        "eventtype_label.key" => "eventtype"
        "eventtype_label.value" => "%{eventtype}"
      }
      merge => {
        "security_result.detection_fields" => "eventtype_label"
      }
      on_error => "no_eventtype"
    }
  }

  if [host] != "" {
    grok {
      match => {
        "host" => "%{IP:host}"
      }
      on_error => "not_ip"
      overwrite => ["host"]
    }

    if [not_ip] {
      mutate {
        replace => {
          "principal.hostname" => "%{host}"
        }
        on_error => "no_host"
      }
    }
    else {
      mutate {
        merge => {
          "principal.ip" => "host"
        }
        on_error => "no_host"
      }
    }
  }

  if [txid] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{txid}"
      }
      on_error => "no_txid"
    }
  }

  if [telephony_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{telephony_id}"
      }
      on_error => "no_telephony_id"
    }
  }

  # set static and default values
  mutate {
    replace => {
      "action"                    => "ALLOW"
      "security_result.severity"  => "INFORMATIONAL"
      "target.application"        => "Duo Telephony"
    }
  }

  mutate {
    replace => {
      "auth_mechanism"            => "MECHANISM_UNSPECIFIED"
    }
    merge => {
      "extensions.auth.mechanism" => "auth_mechanism"
    }
  }

  if [context] != "" and [host] != "" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [host] != "" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "Telephony"
      "metadata.vendor_name" => "Duo"
      "metadata.event_type" => "%{event_type}"
    }
    on_error => "no_event_type"
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }
  if [action] != "" {
    mutate {
      merge => {
        "security_result.action" => "action"
      }
      on_error => "no_action"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

