# Product: ONAPSIS
# Category:SAP
# Supported Format: JSON , SYSLOG , KV
# Reference:https://exchange.xforce.ibmcloud.com/api/hub/extensionsNew/cb73c102ddfe178e7e79e5ed9e99d4f9/Onapsis_Security_Platform_QRadar_Integration_Guide.pdf
# Last Updated:2026-07-07
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "security_result" => ""
      "incident_type" => ""
      "alarm_profile_matches" => ""
      "anamoly_score" => ""
      "asset_name" => ""
      "client" => ""
      "confidence" => ""
      "created_at" => ""
      "destination_port" => ""
      "detected_compilance" => ""
      "dst" => ""
      "erp_event_source" => ""
      "erp_host" => ""
      "erp_time" => ""
      "event_id" => ""
      "event_type" => ""
      "events" => ""
      "incident_detail" => ""
      "incident_name" => ""
      "logline" => ""
      "matching_rule" => ""
      "modified" => ""
      "module_description" => ""
      "module_category" => ""
      "module_name" => ""
      "protocol" => ""
      "patch_applied" => ""
      "policy" => ""
      "reason" => ""
      "result" => ""
      "sap_sec_notes" => ""
      "severity" => ""
      "sid" => ""
      "source_port" => ""
      "src" => ""
      "success" => ""
      "system_type" => ""
      "terminal_source" => ""
      "username" => ""
      "user_type" => ""
      "vulnerability_cvss" => ""
      "program_name" => ""
      "downloaded_table" => ""
      "column_bname" => ""
      "column_profile" => ""
      "job_type" => ""
      "job_name" => ""
      "job_id" => ""
      "fqdn" => ""
      "osp_link" => ""
      "task_id" => ""
      "modules" => ""
      "module" => ""
      "host" => ""
      "application" => ""
      "log_data" => ""
      "severityName" => ""
      "facility" => ""
      "facilityName" => ""
      "source_version" => ""
      "log_message" => ""
      "description" => ""
      "_time" => ""
      "file_name" => ""
      "bucket" => ""
      "sub_path" => ""
      "http_method" => ""
      "url" => ""
      "response_code" => ""
      "response" => ""
      "json_data" => ""
      "task" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "task_sent" => ""
      "user_id" => ""
      "user_name" => ""
      "request_id" => ""
      "db_table" => ""
      "db_table_pk" => ""
      "action" => ""
      "change._exclusions_snapshot.old" => ""
      "change._exclusions_snapshot.new" => ""
      "kv_data" => ""
      "vulnerabilities" => ""
      "id" => ""
      "payload" => ""
      "has_network" => "false"
      "log_line" => ""
      "policy_id" => ""
      "name" => ""
      "authentication_method" => ""
      "task_type" => ""
      "new_state" => ""
      "data" => ""
      "settings" => ""
      "alarm_name" => ""
      "kv_log_data" => ""
      "inter_ip" => ""
      "terminal_source_ip" => ""
      "host_ip" => ""
      "intermediary" => ""
      "msgid" => ""
      "leef_version" => ""
      "product_version" => ""
      "event_name" => ""
      "appliancesStates" => ""
      "devTime" => ""
      "enabled" => ""
      "data_name" => ""
      "data_cadence" => ""
      "metadata_data.name" => ""
      "metadata_data.severity" => ""
      "metadata_data.description" => ""
      "metadata_data.type" => ""
      "related_to.tag.operator" => ""
      "cond_id_attr" => ""
      "matching_operation" => ""
      "time" => ""
      "month" => ""
      "monthday" => ""
      "metadata_data.capacity" => ""
      "anomaly_score" => ""
    }
  }

  mutate {
    gsub => ["message","\"message\"","\"log_message\""]
  }

  mutate {
    gsub => ["message","\\\r\\\n",""]
  }

  mutate {
    gsub => ["message","\\n",""]
  }

  mutate {
    gsub => ["message","\\\n",""]
  }

  mutate {
    gsub => ["message", "\'metadata\'", "\'metadata_data\'"]
  }
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP} %{IP:inter_ip}\\s+%{GREEDYDATA:message}"
    }
    overwrite => ["message", "inter_ip"]
    on_error => "not_matched"
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] and [message] =~ "msgid" {
    grok {
      match => {
        "message" => [
          "msgid=%{GREEDYDATA:msgid}LEEF:%{GREEDYDATA}assetName=%{WORD:asset_name}\\\t%{GREEDYDATA:kv_log_data}",
          "msgid=%{GREEDYDATA:msgid}LEEF:%{DATA:leef_version}\\|%{DATA}\\|%{DATA}\\|%{DATA:product_version}\\|%{DATA:event_name}\\|%{GREEDYDATA:kv_log_data}"
        ]
      }
      overwrite => ["msgid","asset_name","kv_log_data","leef_version","product_version","event_name"]
      on_error => "not_matched"
    }
  }
  else if [not_json] {
    grok {
      match => {
        "message" => [
          "<%{INT}>%{MONTH:month}\\s+%{MONTHDAY:monthday} %{TIME:time} %{WORD:host} %{GREEDYDATA:application}: \\[%{DATA:task}\\] %{GREEDYDATA:log_data}",
          "<%{INT}>%{MONTH}\\s+%{MONTHDAY} %{TIME} %{WORD:host} %{GREEDYDATA:application}\\[%{INT}\\]: %{GREEDYDATA},%{INT}: %{WORD:severityName} \\[%{GREEDYDATA}\\] \\[%{GREEDYDATA}\\] %{GREEDYDATA:log_data}",
        ]
      }
      overwrite => ["host","log_data","application","severityName","task","time","month","monthday"]
      on_error => "pattern_not_matched"
    }
  }

  if [log_message]!= "" {
    grok {
      match => {
        "log_message" => [
          "%{GREEDYDATA:application}\\[%{INT}\\]: \\[%{GREEDYDATA}\\] %{GREEDYDATA}: \\[%{GREEDYDATA}\\] %{GREEDYDATA:description} source_version=%{GREEDYDATA:source_version}",
          "%{GREEDYDATA:application}: \\[%{GREEDYDATA}\\] %{GREEDYDATA:description} source_version=%{GREEDYDATA:source_version}",
        ]
      }
      overwrite => ["description","application","source_version"]
      on_error => "log_message_pattern_not_matched"
    }
  }

  if [log_data] != "" {
    grok {
      match => {
        "log_data" => [
          "Uploading %{GREEDYDATA:file_name} to bucket: %{GREEDYDATA:bucket} sub_path: %{GREEDYDATA:sub_path} source_version=%{GREEDYDATA:source_version}",
          "Request: %{WORD:http_method} %{GREEDYDATA:url} Response: %{INT:response_code} %{GREEDYDATA:reponse} Message: %{GREEDYDATA:description} source_version=%{GREEDYDATA:source_version}",
          "Connecting to: %{GREEDYDATA:url} source_version=%{GREEDYDATA:source_version}",
          "Celery task sent: %{GREEDYDATA:task_sent} source_version=%{GREEDYDATA:source_version}",
          "User \\\"%{GREEDYDATA:username}\\\" executed \\\"%{GREEDYDATA:task_type}\\\" with arguments \\\"%{GREEDYDATA:json_data}\\\" source_version=%{GREEDYDATA:source_version}",
          "Calling ModuleApi.put, with args %{GREEDYDATA:json_data} source_version=%{GREEDYDATA:source_version}",
          "(?P<kv_data>[^=]*=.*) source_version=%{GREEDYDATA:source_version}",
          "%{GREEDYDATA:description} source_version=%{GREEDYDATA:source_version}",
          "%{GREEDYDATA:kv_data} source_version=%{GREEDYDATA:source_version}"
        ]
      }
      overwrite => ["description","application","source_version","file_name","bucket","sub_path","http_method","url","response_code","response","description","username","json_data","task_sent","task_type","kv_data"]
      on_error => "data_pattern_not_matched"
    }
  }

  if [json_data] != "" {
    mutate {
      gsub => ["json_data","'",'\"']
    }
    mutate {
      gsub => ["json_data","None","null"]
    }
    mutate {
      gsub => ["json_data","False",'\"False\"']
    }
    mutate {
      gsub => ["json_data","True",'\"True\"']
    }
    mutate {
      gsub => ["json_data","target","target_data"]
    }
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "invalid_json_data"
    }
  }

  if [kv_data] != "" {
    kv {
      source => "kv_data"
      field_split => ","
      value_split => "="
      on_error => "invalid_kv_data"
    }
  }

  if [kv_log_data] != "" {
    mutate {
      gsub => ["kv_log_data","\\t"," # "]
    }
    mutate {
      gsub => ["kv_log_data","detectedCompilance","detected_compilance"]
    }
    mutate {
      gsub => ["kv_log_data","jobName","job_name"]
    }
    mutate {
      gsub => ["kv_log_data","moduleName","module_name"]
    }
    mutate {
      gsub => ["kv_log_data","moduleDescription","module_description"]
    }
    mutate {
      gsub => ["kv_log_data","moduleCategory","module_category"]
    }
    mutate {
      gsub => ["kv_log_data","vulnerabilityCvss","vulnerability_cvss"]
    }
    mutate {
      gsub => ["kv_log_data","destinationPort","destination_port"]
    }
    mutate {
      gsub => ["kv_log_data","erpEventSource","erp_event_source"]
    }
    mutate {
      gsub => ["kv_log_data","erpHost","erp_host"]
    }
    mutate {
      gsub => ["kv_log_data","erpTime","erp_time"]
    }
    mutate {
      gsub => ["kv_log_data","eventType","event_type"]
    }
    mutate {
      gsub => ["kv_log_data","incidentDetail","incident_detail"]
    }
    mutate {
      gsub => ["kv_log_data","incidentName","incident_name"]
    }
    mutate {
      gsub => ["kv_log_data","logline","log_line"]
    }
    mutate {
      gsub => ["kv_log_data","matchingRule","matching_rule"]
    }
    mutate {
      gsub => ["kv_log_data","patchApplied","patch_applied"]
    }
    mutate {
      gsub => ["kv_log_data","reason","reason"]
    }
    mutate {
      gsub => ["kv_log_data","sapSecNotes","sap_sec_notes"]
    }
    mutate {
      gsub => ["kv_log_data","sourcePort","source_port"]
    }
    mutate {
      gsub => ["kv_log_data","systemType","system_type"]
    }
    mutate {
      gsub => ["kv_log_data","terminalSource","terminal_source"]
    }
    mutate {
      gsub => ["kv_log_data","usrname","user_name"]
    }
    mutate {
      gsub => ["kv_log_data","userType","user_type"]
    }
    mutate {
      gsub => ["kv_log_data","alarmProfileMatches","alarm_profile_matches"]
    }
    mutate {
      gsub => ["kv_log_data","eventId","event_id"]
    }
    kv {
      source => "kv_log_data"
      field_split => "#"
      value_split => "="
      on_error =>  "invalid_kv"
    }
  }

  if [time] != "" {
    mutate {
      replace => {
        "time" => "%{month} %{monthday} %{time}"
      }
      on_error => "no_time_replace"
    }
    date {
      match => ["time", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "metadata.event_timestamp"
      rebase => true
      on_error => "no_time"
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
      }
      on_error => "no_user"
    }
  }

  if [user_name] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{user_name}"
      }
      on_error => "no_user_name"
    }
  }

  if [file_name] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{file_name}"
      }
      on_error => "no_file_name"
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "network.http.referral_url" => "%{url}"
      }
      on_error => "no_url"
    }
  }

  if [http_method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{http_method}"
        "has_network" => "true"
      }
      on_error => "no_http_method"
    }
  }

  if [response_code] != "" {
    mutate {
      replace => {
        "network.http.response_code" => "%{response_code}"
        "has_network" => "true"
      }
      convert => {
        "network.http.response_code" => "integer"
      }
      on_error => "no_response_code"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  if [log_data] =~ "Uploading" {
    mutate {
      replace => {
        "metadata.description" => "Uploading"
      }
    }
  }

  else if [log_data] =~ "Celery task sent" {
    mutate {
      replace => {
        "metadata.description" => "Celery task sent"
      }
    }
  }

  else if [log_data] =~ "Calling ModuleApi.put" {
    mutate {
      replace => {
        "metadata.description" => "Calling ModuleApi.put"
      }
    }
  }

  if [severityName] in ["INFO", "info"] {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{application}"
      }
      on_error => "no_application"
    }
  }

  if [host] != "" {
    grok {
      match => {
        "host" => "%{IP:host_ip}"
      }
      overwrite => ["host_ip"]
      on_error => "invalid_host_ip"
    }
    if ![invalid_host_ip] and [host_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "host_ip"
          "principal.asset.ip" => "host_ip"
        }
        on_error => "no_host_ip"
      }
      if ![no_host_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "principal.hostname" => "%{host}"
          "principal.asset.hostname" => "%{host}"
          "has_principal" => "true"
        }
        on_error => "no_host"
      }
    }
  }

  if [src] != "" {
    grok {
      match => {
        "src" => "%{IP:src_ip}"
      }
      overwrite => ["src_ip"]
      on_error => "invalid_src_ip"
    }
    if ![invalid_src_ip] and [src_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "src_ip"
          "principal.asset.ip" => "src_ip"
        }
        on_error => "no_src_ip"
      }
      if ![no_src_ip] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "principal.hostname" => "%{src}"
          "principal.asset.hostname" => "%{src}"
          "has_principal" => "true"
        }
        on_error => "no_src"
      }
    }
  }

  if [dst] not in ["", "__EMPTY__"] {
    mutate {
      replace => {
        "target.hostname" => "%{dst}"
        "has_target" => "true"
      }
      on_error => "no_dst"
    }
  }

  if [bucket] != "" {
    mutate {
      replace => {
        "bucket_label.value.string_value" => "%{bucket}"
      }
      on_error => "no_bucket"
    }
    if ![no_bucket] {
      mutate {
        replace => {
          "bucket_label.key" => "bucket"
        }
        merge => {
          "event.idm.read_only_udm.additional.fields" => "bucket_label"
        }
        on_error => "no_bucket_label"
      }
    }
  }
  if [metadata_data][type] != "" {
    mutate {
      replace => {
        "type_label.key" => "type"
        "type_label.value" => "%{metadata_data.type}"
      }
      on_error => "no_type_label"
    }
    if ![no_type_label] {
      mutate {
        merge => {
          "security_result.detection_fields" => "type_label"
        }
        on_error => "type_label_merge_failed"
      }
    }
  }
  mutate {
    convert => {
      "metadata_data.capacity" => "string"
    }
    on_error => "metadata_data_capacity_convert_error"
  }
  if [metadata_data][capacity] != "" {
    mutate {
      replace => {
        "metadata_data_capacity_label.key" => "metadata_data_capacity"
        "metadata_data_capacity_label.value.string_value" => "%{metadata_data.capacity}"
      }
      on_error => "no_metadata_data_capacity_replace"
    }
    if ![no_metadata_data_capacity_replace] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "metadata_data_capacity_label"
        }
        on_error => "no_metadata_data_capacity_label_merge_error"
      }
    }
  }
  if [metadata_data][description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{metadata_data.description}"
      }
      on_error => "metadata_data_description_not_found"
    }
  }
  if [metadata_data][name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{metadata_data.name}"
      }
      on_error => "metadata_data_name_not_valid"
    }
  }
  if [logline] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{logline}"
      }
      on_error => "logline_not_found"
    }
  }
  if [reason] not in ["", "None"] {
    mutate {
      replace => {
        "security_result.description" => "%{reason}"
      }
      on_error => "reason_not_found"
    }
  }
  if [anomaly_score] != "" {
    mutate {
      convert => {
        "anomaly_score" => "string"
      }
      on_error => "_anomaly_score_convert_error"
    }
    mutate {
      replace => {
        "security_result.risk_score" => "%{anomaly_score}"
      }
      on_error => "_anomaly_score_not_set"
    }
    if ![_anomaly_score_not_set] {
      mutate {
        convert => {
          "security_result.risk_score" => "float"
        }
        on_error => "_anomaly_score_convert_failed"
      }
    }
  }
  mutate {
    replace => {
      "data_name" => "%{data.name}"
    }
    on_error => "no_name"
  }
  if [data_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{data_name}"
      }
      on_error => "data_name_not_valid"
    }
  }
  if [id] != "" {
    mutate {
      convert => {
        "id" => "string"
      }
      on_error => "no_id_convert_error"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{id}"
      }
      on_error => "no_id"
    }
  }
  if [devTime] != "" {
    date {
      match => ["devTime", "ISO8601", "yyyy-MM-ddTHH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "no_devTime"
    }
  }
  if [event_name] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{event_name}"
      }
      on_error => "event_name_not_found"
    }
  }
  if [product_version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{product_version}"
      }
      on_error => "product_version_missing"
    }
  }
  if [leef_version] != "" {
    mutate {
      replace => {
        "leef_version_label.key" => "leef_version"
        "leef_version_label.value" => "%{leef_version}"
      }
      on_error => "leef_version_label_empty_mapping"
    }
    if ![leef_version_label_empty_mapping] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "leef_version_label"
        }
        on_error => "leef_version_label_merge_error"
      }
    }
  }
  for data_vendors_key, data_vendors_value in data.vendors {
    mutate {
      convert => {
        "data_vendors_key" => "string"
      }
      on_error => "invalid_conversion_data_vendors_key"
    }
    mutate {
      replace => {
        "data_vendors_label" => ""
      }
    }
    mutate {
      replace => {
        "data_vendors_label.value" => "%{data_vendors_value}"
      }
      on_error => "no_data_vendors_label"
    }
    if ![no_data_vendors_label] {
      mutate {
        replace => {
          "data_vendors_label.key" => "Vendor_%{data_vendors_key}"
        }
        on_error => "no_data_vendors_label_key"
      }
      if ![no_data_vendors_label_key] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "data_vendors_label"
          }
          on_error => "no_data_vendors_label_merge_error"
        }
      }
    }
  }
  for data_fields_key, data_fields_value in data.fields_to_keep {
    mutate {
      convert => {
        "data_fields_key" => "string"
      }
      on_error => "invalid_conversion_data_fields_key"
    }
    mutate {
      replace => {
        "data_fields_label" => ""
      }
    }
    mutate {
      replace => {
        "data_fields_label.value" => "%{data_fields_value}"
      }
      on_error => "no_data_fields_label"
    }
    if ![no_data_fields_label] {
      mutate {
        replace => {
          "data_fields_label.key" => "Field_%{data_fields_key}"
        }
        on_error => "no_data_fields_label_key"
      }
      if ![no_data_fields_label_key] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "data_fields_label"
          }
          on_error => "no_data_fields_label_merge_error"
        }
      }
    }
  }
  for data_filters_key, data_filters_value in data.filters.names_regex {
    mutate {
      convert => {
        "data_filters_key" => "string"
      }
      on_error => "invalid_conversion_data_filters_key"
    }
    mutate {
      replace => {
        "data_filters_label" => ""
      }
    }
    mutate {
      replace => {
        "data_filters_label.value" => "%{data_filters_value}"
      }
      on_error => "no_data_filters_label"
    }
    if ![no_data_filters_label] {
      mutate {
        replace => {
          "data_filters_label.key" => "Filter_%{data_filters_key}"
