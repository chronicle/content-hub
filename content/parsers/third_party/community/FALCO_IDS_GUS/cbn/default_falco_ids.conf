# Product: FALCO_IDS
# Category: IDS/IPS
# Supported Format: JSON
# Reference: https://sysdig.com/blog/kubernetes-audit-log-falco/
# Last Updated: 2024-03-06
# Copyright 2024 Chronicle LLC

filter {

  mutate {
    replace => {
      "event_type" => ""
      "kind" => ""
      "time" => ""
      "rule" => ""
      "output" => ""
      "apiVersion" => ""
      "auditID" => ""
      "stage" =>""
      "requestURI" => ""
      "verb" => ""
      "user.username" => ""
      "user.uid" => ""
      "user.groups" => ""
      "sourceIPs" => ""
      "userAgent" => ""
      "priority" => ""
      "sec_result" => ""
      "responseStatus.code" => ""
      "requestReceivedTimestamp" => ""
      "stageTimestamp" => ""
      "objectRef.resource" => ""
      "objectRef.name" => ""
      "objectRef.subresource" => ""
      "objectRef.uid" => ""
      "requestObject.metadata.uid" => ""
      "requestObject.status.containerStatuses" => ""
      "requestObject.status.podIPs" => ""
      "requestObject.status.podIP" => ""
      "requestObject.status.hostIP" => ""
      "containerStatuse.containerID" => ""
      "responseObject.metadata.uid" => ""
      "resource_name" => ""
      "resource_id" => ""
      "resource_type" => ""
      "target_resource_subtype" => ""
      "responseObject.spec.uid" => ""
      "responseObject.spec.user" => ""
      "responseObject.spec.group" => ""
      "responseObject.spec.containers" => ""
      "file.full_path" => ""
      "targetnamespace" => ""
      "uid" => ""
      "product_version" => ""
      "description" => ""
      "output_fields.bl-ssr" => ""
      "output_fields.cloud-project-id" => ""
      "output_fields.cloud-provider" => ""
      "output_fields.container.id" => ""
      "output_fields.container.image.repository" => ""
      "output_fields.email" => ""
      "output_fields.evt.arg.fd" => ""
      "output_fields.evt.arg.filename" => ""
      "output_fields.evt.arg.mode" => ""
      "output_fields.fd.name" => ""
      "output_fields.host-ip" => ""
      "output_fields.host-name" => ""
      "output_fields.k8s.ns.name" => ""
      "output_fields.k8s.pod.name" => ""
      "output_fields.ol-env" => ""
      "output_fields.pod-ip" => ""
      "output_fields.pod-name" => ""
      "output_fields.proc.cmdline" => ""
      "output_fields.tags" => ""
      "output_fields.user.loginuid" => ""
      "output_fields.user.name" => ""
      "output_fields.ebpf_enabled" => ""
      "output_fields.falco.contact" => ""
      "output_fields.falco.host.ip" => ""
      "output_fields.falco.host.name" => ""
      "output_fields.falco.pod.ip" => ""
      "output_fields.falco.pod.name" => ""
      "output_fields.falco.ssrid" => ""
      "has_principal" => "false"
      "has_userid" => "false"
    }
  }

  json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
  }


  if [not_json] {
    grok {
      match => {
          "message" => '%{GREEDYDATA:ASDF}] %{WORD:kind}%{GREEDYDATA}, Namespace:%{GREEDYDATA:targetnamespace},%{GREEDYDATA}, UID:%{GREEDYDATA:uid}, %{GREEDYDATA}, ResourceVersion:%{GREEDYDATA:product_version},%{GREEDYDATA} reason: %{GREEDYDATA:description}'
        }
      overwrite => [kind,targetnamespace,uid,product_version,description]
      on_error => "Not_a_valid_log"
    }

    if [Not_a_valid_log] {
      drop{
        tag => "TAG_UNSPECIFIED"
      }
    }
  }

  if [targetnamespace] != "" {
    mutate {
      gsub => ["targetnamespace",'\"',""]
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.target.namespace" => "%{targetnamespace}"
      }
      on_error => "namespace_error"
    }
  }

  if [kind] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{kind}"
      }
    }
  }

  if [apiVersion] != "" {
    mutate {
      replace =>{
        "event.idm.read_only_udm.metadata.product_version" => "%{apiVersion}"
      }
    }
  }
  else if [product_version] != "" {
    mutate {
      gsub => ["product_version" , '\"',""]
    }
    mutate {
      replace =>{
        "event.idm.read_only_udm.metadata.product_version" => "%{product_version}"
      }
    }
  }

  if [auditID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{auditID}"
      }
    }
  }

  if [stage] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{stage}"
      }
    }
  }
  else if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
    }
  } else if [output] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{output}"
      }
    }
  }

  if [requestURI] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{requestURI}"
      }
      on_error => "url_error"
    }
  }

  if [verb] != "" {
    mutate {
      uppercase => [verb]
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{verb}"
      }
    }
  }

  if [user][username] != ""{
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{user.username}"
      }
    }
  } else if [output_fields][user][name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{output_fields.user.name}"
      }
    }
  }

  if [user][uid] != ""{
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user.uid}"
        "has_userid" => "true"
      }
    }
  }
  else if [uid] != "" {
    mutate {
      gsub => ["uid",'\"',""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{uid}"
        "has_userid" => "true"
      }
    }
  }

  if [user][groups] != "" {
    for grpname in user.groups {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" => "grpname"
        }
      }
    }
  }

  if [sourceIPs] != "" {
    for ip in sourceIPs {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ip"
          "event.idm.read_only_udm.principal.asset.ip" => "ip"
        }
        on_error => "ip_merge_error"
      }
    }
  }
  else if [output_fields][falco][host][ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "output_fields.falco.host.ip"
        "event.idm.read_only_udm.principal.asset.ip" => "output_fields.falco.host.ip"
      }
      on_error => "ip_merge_error"
    }
  }

  if [userAgent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{userAgent}"
      }
    }
  }

  if [responseStatus][code] != "" {
    mutate {
      convert => {
        "responseStatus.code" => "integer"
      }
    }

    mutate {
      rename => {
        "responseStatus.code" => "event.idm.read_only_udm.network.http.response_code"
      }
    }
  }

  if [message] =~ "responseObject.*subsets.*addresses.*targetRef"{
    for subset in responseObject.subsets{
      for address in subset.addresses{
        if [address][ip] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.ip" => "address.ip"
              "event.idm.read_only_udm.target.asset.ip" => "address.ip"
            }
            on_error => "ip_error"
          }
        }

        if [message] =~ "responseObject.*subsets.*addresses.*nodeName"{
          if [address][nodeName] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.hostname" => "%{address.nodeName}"
                "event.idm.read_only_udm.target.asset.hostname" => "%{address.nodeName}"
              }
              on_error => "hostname_error"
            }
          }
        }

        if [address][targetRef][name] != "" and [resource_name] == "" {
          mutate {
            replace => {
              "resorce_name" => "%{address.targetRef.name}"
              "event.idm.read_only_udm.target.resource.name" => "%{address.targetRef.name}"
            }
            on_error => "resource_error"
          }
        }

        if [address][targetRef][uid] != "" and [resource_id] == "" {
          mutate {
            replace => {
              "resorce_id" => "%{address.targetRef.uid}"
              "event.idm.read_only_udm.target.resource.id" => "%{address.targetRef.uid}"
            }
            on_error => "id_error"
          }
        }

        if [address][targetRef][kind] != "" and [target_resource_subtype] == "" {
          mutate {
            replace => {
              "target_resource_subtype" => "%{address.targetRef.kind}"
              "event.idm.read_only_udm.target.resource.resource_subtype" => "%{address.targetRef.kind}"
            }
            on_error => "subtype_error"
          }
        }
      }

      for index,portdetails in subset.ports{
        if [portdetails][protocol] != ""  {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.ip_protocol" => "%{portdetails.protocol}"
            }
          }
        }

        if [portdetails][port] != "" and index == 0 {
          mutate {
            convert => {
              "portdetails.port" => "integer"
            }
          }

          mutate {
            rename => {
              "portdetails.port" => "event.idm.read_only_udm.target.port"
            }
            on_error => "port_error"
          }
        }

        if [portdetails][name] != "" {
          mutate {
            uppercase => [ "portdetails.name" ]
          }

          # Applicable application_protocol in logs are http, https and dns
          if [portdetails][name] in ["HTTP","HTTPS","DNS"] {
            mutate {
              replace => {
                "event.idm.read_only_udm.network.application_protocol" => "%{portdetails.name}"
              }
            }
          }
          else {
            mutate {
              replace => {
                "event.idm.read_only_udm.network.application_protocol" => "UNKNOWN_APPLICATION_PROTOCOL"
              }
            }
          }
        }
      }
    }
  }
  else if [objectRef][name] != "" and [resource_name] == ""{
    mutate{
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{objectRef.name}"
      }
      on_error => "resource_name_error"
    }
  }
  else if [objectRef][resource] != "" and [target_resource_subtype] == "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{objectRef.resource}"
        "target_resource_subtype" => "%{objectRef.resource}"
      }
      on_error => "subtype_error"
    }
  }

  if [objectRef][resource] != "" and [target_resource_subtype] == "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{objectRef.resource}"
      }
      on_error => "subtype_error"
    }
  }

  if [responseObject][metadata][uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{responseObject.metadata.uid}"
        "has_userid" => "true"
      }
      on_error => "id_error"
    }
  }
  else if [responseObject][spec][uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{responseObject.spec.uid}"
        "has_userid" => "true"
      }
      on_error => "id_error"
    }
  }
  else if [objectRef][uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{objectRef.uid}"
        "has_userid" => "true"
      }
      on_error => "id_error"
    }
  }
  else if [requestObject][metadata][uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{requestObject.metadata.uid}"
        "has_userid" => "true"
      }
      on_error => "id_error"
    }
  }
  else if [output_fields][user][loginuid] != "" {
    mutate {
      convert => {
        "output_fields.user.loginuid" => "string"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{output_fields.user.loginuid}"
        "has_userid" => "true"
      }
      on_error => "id_error"
    }
  }

  if [responseObject][spec][user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.user_display_name" => "%{responseObject.spec.user}"
      }
      on_error => "id_error"
    }
  }

  if [requestObject][status][podIPs] != "" {
    for podip in requestObject.status.podIPs {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "podip.ip"
          "event.idm.read_only_udm.target.asset.ip" => "podip.ip"
        }
        on_error => "ip_merge_error"
      }
    }
  }
  else if [requestObject][status][podIP] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "requestObject.status.podIP"
        "event.idm.read_only_udm.target.asset.ip" => "requestObject.status.podIP"
      }
      on_error => "ip_merge_error"
    }
  }
  else if [requestObject][status][hostIP] != ""{
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "requestObject.status.hostIP"
        "event.idm.read_only_udm.target.asset.ip" => "requestObject.status.hostIP"
      }
      on_error => "ip_merge_error"
    }
  }

  if [requestObject][status][containerStatuses] != ""{
    for containerStatuse in requestObject.status.containerStatuses {
      if [containerStatuse][imageID] != "" and [file][full_path] == "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{containerStatuse.imageID}"
            "file.full_path" => "%{containerStatuse.imageID}"
          }
          on_error => "file_error"
        }
      }
      else if [containerStatuse][image] != "" and [file][full_path] == ""  {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{containerStatuse.image}"
            "file.full_path" => "%{containerStatuse.image}"
          }
          on_error => "file_error"
        }
      }
    }
  }

  if [message] =~ "requestObject.*status.*containerStatuses.*containerID" {
    for containerid in  requestObject.status.containerStatuses{
      if [containerid][containerID] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset.asset_id" => "%{containerid.containerID}"
          }
          on_error => "asset_id_error"
        }
      }
    }
  }

  if [message] =~ "requestObject.*status.*containerStatuses.*state" {
    if [message] =~ "requestObject.*status.*containerStatuses.*state.*running" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.deployment_status" => "ACTIVE"
        }
        on_error => "deployment_id_error"
      }
    }
    else if [message] =~ "requestObject.*status.*containerStatuses.*state.*waiting" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.deployment_status" => "ACTIVE"
        }
        on_error => "deployment_id_error"
      }

      if [requestObject][status][containerStatuses] != ""{
        for index,containerstatus in requestObject.status.containerStatuses{
          mutate {
            replace => {
              "request_constraint_label" => ""
            }
          }
          if [containerstatus][state][waiting][reason] != "" and [index] == 0 {
            mutate{
              replace => {
                "request_constraint_label.key" => "State Waiting Reason"
                "request_constraint_label.value" => "%{requestObject.status.containerStatuses.0.state.waiting.reason}"
              }
              on_error => "waiting_reason_error"
            }

            mutate {
              merge => {
                "event.idm.read_only_udm.target.resource.attribute.labels" => "request_constraint_label"
              }
              on_error => "waiting_reason_merge_error"
            }
          }
        }
      }
    }
    else if [message] =~ "requestObject.*status.*containerStatuses.*state.*terminated" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.deployment_status" => "DECOMISSIONED"
        }
        on_error => "deployment_status_error"
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.deployment_status" => "DEPLOYMENT_STATUS_UNSPECIFIED"
        }
        on_error => "deployment_status_error"
      }
    }
  }

  if [responseObject][spec][group] != "" {
    for grpname in responseObject.spec.group {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.group_identifiers" => "grpname"
        }
        on_error => "user_error"
      }
    }
  }

  if [requestReceivedTimestamp] != "" {
    date {
      match => ["requestReceivedTimestamp" , "ISO8601"],
      rebase => true
      on_error => "date_mismatch"
    }
  }
  else if [time] != "" {
    date {
      match => ["time" , "ISO8601"],
      rebase => true
      on_error => "time_error"
    }
  }

  if [stageTimestamp] != "" {
    date {
      match => ["stageTimestamp" , "ISO8601"],
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      rebase => true
      on_error => "invalid_time"
    }
  }

  if [output_fields][bl-ssr] != "" and [resource_name] == "" {
    mutate {
      replace => {
         "event.idm.read_only_udm.target.resource.name" => "%{output_fields.bl-ssr}"
      }
      on_error => "resorce_name_error"
    }
  }

  if [output_fields][cloud-project-id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.cloud.project.id"   => "%{output_fields.cloud-project-id}"
      }
      on_error => "project_id_error"
    }
  }

  if [output_fields][cloud-provider] == "GCP" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.attribute.cloud.environment" => "GOOGLE_CLOUD_PLATFORM"
      }
      on_error => "cloud_error"
    }
  }
  else if [output_fields][cloud-provider] == "Azure" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.attribute.cloud.environment" => "MICROSOFT_AZURE"
      }
      on_error => "cloud_error"
    }
  }

  if [output_fields][container][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.asset_id" => "container_id:%{output_fields.container.id}"
      }
      on_error => "asset_id_errror"
    }
  }

  if [output_fields][container][image][repository] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{output_fields.container.image.repository}"
        "file.full_path" => "%{output_fields.container.image.repository}"
      }
      on_error => "file_error"
    }
  }

  if [output_fields][email] != "" and  [output_fields][email] =~ "^.+@.+$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.email" => "%{output_fields.email}"
      }
      on_error => "email_error"
    }
  }

  if [priority] != "" {
    mutate {
      replace => {
        "sec_result.severity_details" => "%{priority}"
      }
      on_error => "severity_details_error"
    }
  }

  if [output_fields][evt][arg][fd] != "" {
    mutate{
      replace => {
        "fd.key" => "evt_arg_fd"
        "fd.value" => "%{output_fields.evt.arg.fd}"
      }
      on_error => "fd_error"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "fd"
      }
      on_error => "fd_merge_error"
    }
  }

  if [output_fields][evt][arg][filename] != ""{
    mutate{
      replace => {
        "filename.key" => "evt_arg_filename"
        "filename.value" => "%{output_fields.evt.arg.filename}"
      }
      on_error => "filename_error"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "filename"
      }
      on_error => "filename_merge_error"
    }
  }

  if [output_fields][evt][arg][mode] != ""{
    mutate{
      replace => {
        "mode.key" => "evt_arg_mode"
        "mode.value" => "%{output_fields.evt.arg.mode}"
      }
      on_error => "mode_error"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "mode"
      }
      on_error => "mode_merge_error"
    }
  }

  if [output_fields][fd][name] != ""{
    mutate{
      replace => {
        "name.key" => "fd_name"
        "name.value" => "%{output_fields.fd.name}"
      }
      on_error => "name_error"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "name"
      }
      on_error => "name_merge_error"
    }
  }

  if [output_fields][host-ip] != ""{
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "output_fields.host-ip"
        "event.idm.read_only_udm.target.asset.ip" => "output_fields.host-ip"
      }
      on_error => "target_ip_error"
    }
  }

  if [output_fields][host-name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{output_fields.host-name}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{output_fields.host-name}"
      }
      on_error => "target_hostname_error"
    }
  }

  if [output_fields][k8s][ns][name] != "" {
    mutate {
      replace => {
        "k8_ns_name.key" => "k8s_ns_name"
        "k8_ns_name.value.string_value" => "%{output_fields.k8s.ns.name}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "k8_ns_name"
      }
      on_error => "k8_error"
    }
  }

  if [output_fields][k8s][pod][name] != "" {
    mutate {
      replace => {
        "k8s_pod_name.key" => "k8s_pod_name"
        "k8s_pod_name.value.string_value" => "%{output_fields.k8s.pod.name}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "k8s_pod_name"
      }
      on_error => "k8s_pod_name_error"
    }
  }

  if [output_fields][ol-env] != "" {
    mutate {
      replace => {
        "labels0.key" => "ol-env"
        "labels0.value" => "%{output_fields.ol-env}"
      }
      on_error => "labels0_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "labels0"
      }
      on_error => "labels0_merge_error"
    }
  }

  if [output_fields][tags] != "" {
    mutate {
      replace => {
        "tags_label.key" => "tags"
        "tags_label.value" => "%{output_fields.tags}"
      }
      on_error => "tags_error"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "tags_label"
      }
      on_error => "tags_merge_error"
    }
  }

  if [output_fields][proc][cmdline] != ""{
    mutate{
      replace => {
        "proc_cmdline.key" => "proc_cmdline"
        "proc_cmdline.value" => "%{output_fields.proc.cmdline}"
      }
      on_error => "proc_error"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "proc_cmdline"
      }
      on_error => "proc_merge_error"
    }
  }

  if [output_fields][ebpf_enabled] != ""{
    mutate{
      replace => {
        "ebpf_enabled.key" => "ebpf_enabled"
        "ebpf_enabled.value" => "%{output_fields.ebpf_enabled}"
      }
      on_error => "ebpf_enabled_error"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "ebpf_enabled"
      }
      on_error => "ebpf_enabled_merge_error"
    }
  }

  if [output_fields][pod-ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.observer.ip" => "output_fields.pod-ip"
      }
      on_error => "observer_ip_error"
    }
  }

  if [output_fields][pod-name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{output_fields.pod-name}"
      }
      on_error  => "pod_name_error"
    }
  }

  if [output_fields][falco][pod][ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.observer.ip" => "output_fields.falco.pod.ip"
      }
      on_error => "merge_error"
    }
  }

  if [output_fields][falco][pod][name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{output_fields.falco.pod.name}"
      }
      on_error => "observer_hostname_error"
    }
  }

  if [output_fields][falco][contact] != ""{
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "output_fields.falco.contact"
      }
      on_error => "email_error"
    }
  }

  if [output_fields][falco][host][name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{output_fields.falco.host.name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{output_fields.falco.host.name}"
      }
      on_error => "hostname_error"
    }
  }

  if [output_fields][falco][ssrid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{output_fields.falco.ssrid}"
      }
      on_error => "resource_error"
    }
  }

  if [message] =~ "annotations.*authorization.*k8s" {
    mutate {
      replace => {
        "security_action" => "%{annotations.authorization.k8s.io/decision}"
       }
       on_error => "action_error"
     }
    # Only ALLOW action is in present in logs
    if [security_action] == "allow"{
      mutate{
        replace =>{
          "security_action" => "ALLOW"
        }
      }

      mutate {
        merge => {
          "sec_result.action" => "security_action"
        }
      }
    }

    mutate {
      replace => {
        "sec_result.description" => "%{annotations.authorization.k8s.io/reason}"
      }
    }

    mutate {
      gsub => [ "sec_result.description", '\\"', "" ]
    }
  }

  if [rule] != "" {
    mutate {
      replace => {
        "sec_result.rule_name" => "%{rule}"
      }
    }
  }
  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  if [resource_type] == "" {
    mutate {
      replace => {
        "resource_type" => "CLUSTER"
      }
    }
  }

  if [resource_type] != "" {
    mutate {
      rename =>{
        "resource_type" => "event.idm.read_only_udm.target.resource.resource_type"
      }
    }
  }
# List of verbs present in the logs are: get, patch, list, update, watch, create, delete
  if [verb] in ["GET","LIST","WATCH"] {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
        }
    }
  }
  else if [verb] == "CREATE" and ([user][uid] != "" or [uid] != "") {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_CREATION"
      }
    }
  }
  else if [verb] == "PATCH" or [verb] == "UPDATE" and [user][uid] != "" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_UPDATE_CONTENT"
      }
    }
  }
  else if [verb] == "DELETE" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_DELETION"
      }
    }
  }

  if [output] != "" {
    grok {
      match => {
        "output" => "%{GREEDYDATA} host-name=%{HOSTNAME:tar_host} host-IP=%{IP:tar_ip}"
      }
      on_error => "grok_fail"
    }
    if ![grok_fail] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "tar_ip"
          "event.idm.read_only_udm.target.asset.ip" => "tar_ip"
        }
        on_error => "ip_merge_error"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{tar_host}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{tar_host}"
        }
        on_error => "hostname_error"
      }
    }

    if [output] =~ "Error" {
      mutate {
        replace => {
          "event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      rename => {
        event_type => "event.idm.read_only_udm.metadata.event_type"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "FALCO_IDS"
      "event.idm.read_only_udm.metadata.product_name" => "FALCO_IDS"
    }
  }


  mutate {
     merge => { "@output" => "event" }
  }
}
