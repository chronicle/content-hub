# Product: APPIAN_CLOUD
# Category: Collaboration log types
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2026-05-28
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event_type" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "security_result" => ""
      "about" => ""
      "src_host" => ""
      "device" => ""
      "time" => ""
      "id" => ""
      "user_id" => ""
      "desc" => ""
      "product_type" => ""
      "category" => ""
      "tar_host" => ""
      "domain" => ""
      "severity" => ""
      "summary" => ""
      "url" => ""
      "uuid" => ""
      "process_id" => ""
      "modelid" => ""
      "src_port" => ""
      "type" => ""
      "companyname" => ""
      "act" => ""
      "src_ip" => ""
      "useragent" => ""
      "has_principal_user" => "false"
      "src_ip1" => ""
      "session_id" => ""
      "server_host" => ""
      "host" => ""
      "connectionid" => ""
      "queryid" => ""
      "database" => ""
      "retcode" => ""
      "object" => ""
      "thread" => ""
      "data_store" => ""
      "entity" => ""
      "operation_type" => ""
      "operation_name" => ""
      "operation_detail" => ""
      "prepare_time" => ""
      "execute_time" => ""
      "transform_time" => ""
      "user" => ""
      "action" => ""
      "record_type_name" => ""
      "record_type_url_stub" => ""
      "record_identifier" => ""
      "view" => ""
      "filters" => ""
      "environment" => ""
      "site_url_stub" => ""
      "page_group_involved" => ""
      "page_involved" => ""
      "site_involved" => ""
      "total_thread_count" => ""
      "daemon_thread_count" => ""
      "used_heap_space" => ""
      "available_heap_space" => ""
      "tenured_generation_usage_after_collection" => ""
      "tenured_generation_used" => ""
      "tenured_generation_available" => ""
      "permanent_generation_used" => ""
      "permanent_generation_available" => ""
      "young_collection_count" => ""
      "young_collection_time" => ""
      "tenured_collection_count" => ""
      "tenured_collection_time" => ""
      "disk_partition_used" => ""
      "disk_partition_available" => ""
      "load_average" => ""
      "cpu_core_count" => ""
      "total_system_memory" => ""
      "used_system_memory" => ""
      "total_swap_space" => ""
      "used_swap_space" => ""
      "session_count" => ""
      "action1" => ""
      "user_uuid" => ""
      "username1" => ""
      "original_value" => ""
      "new_value" => ""
      "modified_by_uuid" => ""
      "modified_by_username" => ""
      "execution_count" => ""
      "status_code_1xx_count" => ""
      "status_code_2xx_count" => ""
      "status_code_3xx_count" => ""
      "status_code_4xx_count" => ""
      "status_code_5xx_count" => ""
      "maximum_execution_time" => ""
      "maximum_response_time" => ""
      "mean_execution_time" => ""
      "mean_response_size" => ""
      "minimum_response_size" => ""
      "maximum_response_size" => ""
      "http_method" => ""
      "minimum_execution_time" => ""
      "setting_old_value" => ""
      "setting_new_value" => ""
      "username2" => ""
      "property" => ""
      "reason" => ""
      "details" => ""
      "document_name" => ""
      "hash" => ""
      "msg" => ""
      "hostname" => ""
      "oid" => ""
      "detail" => ""
      "name" => ""
      "sqlcmd" => ""
      "intermediary" => ""
      "sec_result_category" => ""
      "endpoint" => ""
      "security_result_action" => ""
      "csvData" => ""
      "syslog_severity" => ""
      "devicetimestamp" => ""
      "email" => ""
      "commandline" => ""
      "resourcename" => ""
      "userRoles" => ""
      "rolesAllow" => ""
      "status" => ""
      "unknownfield" => ""
      "userRole" => ""
      "userId"  => ""
      "IpAddress" => ""
      "application" => ""
      "versionDetails" => ""
      "transactionId" => ""
      "sessionID"   => ""
      "column1" => ""
      "column2" => ""
      "column3" => ""
      "column4" => ""
      "column5" => ""
      "column6" => ""
      "column7" => ""
      "column8" => ""
    }
  }
  if [message] =~ "Timestamp,Username,Status,IP,Source,User Agent" {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }
  grok {
    match => {
      "message" => [
        '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA}\\[%{DATA}\\] %{DATA:detail}  %{DATA:hostname} - %{GREEDYDATA}: id=%{DATA:oid}; types=%{DATA:type}; names=\\[%{DATA:name}\\]; %{GREEDYDATA} user=\\[%{DATA:username2}\\]'
        '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{GREEDYDATA:desc}\\(UUID:%{DATA:uuid}\\) %{GREEDYDATA} URL \\(%{DATA:url}\\)\\.%{GREEDYDATA:msg}'
        '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:user_id},%{WORD:act},%{IP:src_ip1},%{DATA},"%{DATA:useragent}",%{DATA:id},%{GREEDYDATA:session_id}',
      ]
    }
    overwrite => ["src_host","device","act","time","id","user_id","desc","product_type","category","tar_host","domain", "severity", "summary", "url","uuid", "process_id", "modelid","src_port","type","companyname","src_ip","useragent","src_ip1", "session_id","server_host","host","connectionid","queryid","database","retcode","object","thread", "data_store", "entity", "operation_type", "operation_name", "operation_detail", "prepare_time", "execute_time", "transform_time","user","action", "record_type_name", "record_type_url_stub", "record_identifier", "view", "filters", "environment", "site_url_stub", "page_group_involved", "page_involved","site_involved","total_thread_count", "daemon_thread_count", "used_heap_space", "available_heap_space", "tenured_generation_usage_after_collection", "tenured_generation_used", "tenured_generation_available", "permanent_generation_used", "permanent_generation_available", "young_collection_count", "young_collection_time", "tenured_collection_count", "tenured_collection_time", "disk_partition_used", "disk_partition_available", "load_average", "cpu_core_count", "total_system_memory", "used_system_memory", "total_swap_space", "used_swap_space", "session_count", "disk_partition_used", "disk_partition_available", "load_average", "cpu_core_count", "total_system_memory", "used_system_memory", "total_swap_space", "used_swap_space", "session_count","action1", "user_uuid", "username1", "original_value", "new_value", "modified_by_uuid", "modified_by_username","execution_count", "status_code_1xx_count", "status_code_2xx_count", "status_code_3xx_count", "status_code_4xx_count", "status_code_5xx_count", "maximum_execution_time", "maximum_response_time", "mean_execution_time", "mean_response_size", "minimum_response_size", "maximum_response_size","http_method","minimum_execution_time","username2","property","setting_old_value", "setting_new_value","document_name", "reason", "details","hash","msg","hostname","oid","detail","name"]
    on_error => "invalid_syslog"
  }

  if [message] =~ "blocked-files" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:username2},%{DATA:document_name},%{DATA:reason},%{GREEDYDATA:details},%{NOTSPACE:hash}'
        ]
      }
      overwrite => ["src_host","device","time","username2","document_name","reason","details","hash"]
      on_error => "invalid_syslog1"
    }
  }
  else if [message] =~ "admin-console-audit" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:username2},%{DATA:property},%{DATA:setting_old_value},%{GREEDYDATA:setting_new_value}'
        ]
      }
      overwrite => ["src_host","device","act","time","username2","property","setting_old_value","setting_new_value"]
      on_error => "invalid_syslog"
    }
  }
  else if [message] =~ "system-metrics" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{INT:total_thread_count},%{INT:daemon_thread_count},%{INT:used_heap_space},%{INT:available_heap_space},%{INT:tenured_generation_usage_after_collection},%{INT:tenured_generation_used},%{INT:tenured_generation_available},%{INT:permanent_generation_used},%{INT:permanent_generation_available},%{INT:young_collection_count},%{INT:young_collection_time},%{INT:tenured_collection_count},%{INT:tenured_collection_time},(%{INT:disk_partition_used}|),(%{INT:disk_partition_available}|),%{DATA:load_average},%{INT:cpu_core_count},%{INT:total_system_memory},%{INT:used_system_memory},%{INT:total_swap_space},%{INT:used_swap_space},%{INT:session_count}'
        ]
      }
      overwrite => ["src_host","device","time","total_thread_count", "daemon_thread_count", "used_heap_space", "available_heap_space", "tenured_generation_usage_after_collection", "tenured_generation_used", "tenured_generation_available", "permanent_generation_used", "permanent_generation_available", "young_collection_count", "young_collection_time", "tenured_collection_count", "tenured_collection_time", "disk_partition_used", "disk_partition_available", "load_average", "cpu_core_count", "total_system_memory", "used_system_memory", "total_swap_space", "used_swap_space", "session_count"]
      on_error => "invalid_syslog1"
    }
  }
  else if [message] =~ "records-usage" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:user},%{DATA:action},%{DATA:record_type_name},%{DATA:record_type_url_stub},%{INT:record_identifier},%{DATA:view},%{DATA:filters},%{DATA:environment},%{NOTSPACE:site_url_stub}'
        ]
      }
      overwrite => ["src_host","device","time","user","action","record_type_name","record_type_url_stub","record_identifier","view","filters","environment","site_url_stub"]
      on_error => "invalid_syslog1"
    }
  }
  else if [message] =~ "perf-monitor-rdbms" or [message] =~ "perf-monitor-rdbms-details" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{INT:thread},%{DATA:data_store},%{DATA:entity},%{DATA:operation_type},%{DATA:operation_name},%{GREEDYDATA:operation_detail},%{INT:prepare_time},%{INT:execute_time},%{INT:transform_time},%{NOTSPACE:user_id}'
        ]
      }
      overwrite => ["src_host","device","time","thread", "data_store", "entity", "operation_type", "operation_name", "operation_detail", "prepare_time", "execute_time", "transform_time", "user_id"]
      on_error => "invalid_syslog1"
    }
  }
  else if [message] =~ "web-api-summary" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{INT:execution_count},%{INT:status_code_1xx_count},%{DATA:status_code_2xx_count},%{DATA:status_code_3xx_count},%{DATA:status_code_4xx_count},%{DATA:status_code_5xx_count},%{DATA:mean_execution_time},%{DATA:minimum_execution_time},%{DATA:maximum_execution_time},%{DATA:mean_response_size},%{DATA:minimum_response_size},%{NOTSPACE:maximum_response_size}'
        ]
      }
      overwrite => ["src_host","device","time","execution_count","status_code","status_code_1xx_count","status_code_2xx_count","status_code_3xx_count","status_code_4xx_count","status_code_5xx_count","mean_execution_time","minimum_execution_time","maximum_execution_time","mean_response_size","minimum_response_size","maximum_response_size"]
      on_error => "invalid_syslog1"
    }
  }
  else if [message] =~ "web-api-details" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:http_method},%{DATA:endpoint},%{DATA:uuid},%{DATA:execution_count},%{DATA:status_code_1xx_count},%{DATA:status_code_2xx_count},%{DATA:status_code_3xx_count},%{DATA:status_code_4xx_count},%{DATA:status_code_5xx_count},%{DATA:mean_execution_time},%{DATA:minimum_execution_time},%{DATA:maximum_execution_time},%{DATA:mean_response_size},%{DATA:minimum_response_size},%{DATA:maximum_response_size},%{GREEDYDATA}'
        ]
      }
      overwrite => ["src_host","device","time","http_method","endpoint","uuid","execution_count","status_code_1xx_count","status_code_2xx_count","status_code_3xx_count","status_code_4xx_count","status_code_5xx_count","mean_execution_time","minimum_execution_time","maximum_execution_time","mean_response_size","minimum_response_size","maximum_response_size"]
      on_error => "invalid_syslog1"
    }
  }
  else if [message] =~ "unscanned-files" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:username2},%{DATA:document_name},%{DATA:reason},%{NOTSPACE:hash}'
        ]
      }
      overwrite => ["src_host","device","time","username2","document_name","reason","hash"]
      on_error => "invalid_syslog1"
    }

  }
  else if [message] =~ "sites-usage" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}  %{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:user},%{DATA:action},%{DATA:site_involved},%{DATA:page_involved},(%{NOTSPACE:page_group_invoved}|)'
        ]
      }
      overwrite => ["src_host","device","time","id","site_involved","page_involved","page_group_invoved","action","user","desc", "category"]
      on_error => "invalid_syslog2"
    }
  }
  else if [message] =~ "user-management" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:action1},(%{DATA:user_uuid}|),(%{DATA:username1}|),(%{DATA:original_value}|),(%{DATA:new_value}|),%{DATA:modified_by_uuid},(%{NOTSPACE:modified_by_username}|)'
        ]
      }
      overwrite => ["src_host","device","time","id","session_id","user_id","act","src_ip1","action1", "user_uuid", "username1", "original_value", "new_value", "modified_by_uuid", "modified_by_username"]
      on_error => "invalid_syslog3"
    }
  }
  else if [message] =~ "rdbms-audit" {
    grok {
      match => {
        "message" => [
          '<%{INT}>%{MONTH}\\s+%{INT} %{TIME} %{HOSTNAME:src_host} %{DATA:device}: %{DATA:time},%{DATA:server_host},%{DATA:host},%{INT:connectionid},%{INT:queryid},%{DATA:operation},%{DATA:database},((?P<object>.*username`=%{NOTSPACE:user_id}.*)|%{GREEDYDATA:object}),%{NOTSPACE:retcode}'
        ]
      }
      overwrite => ["src_host","device","act","time","server_host", "host", "connectionid", "queryid", "operation", "database", "object", "retcode","user_id"]
      on_error => "invalid_syslog"
    }
    grok {
      match => {
        "message" => "(?P<sqlcmd>SET|UPDATE|CREATE|INSERT)"
      }
      overwrite => ["sqlcmd"]
      on_error => "invalid_sqlcmd"
    }
  }
  else {
    grok {
      match => {
        "message" => [ "<%{INT:syslog_severity}\\>%{SYSLOGTIMESTAMP:time}\\s+%{DATA:hostname}\\s+%{DATA:device}\\:\\s+%{GREEDYDATA:csvData}"]
      }
      overwrite => ["csvData", "syslog_severity" , "time", "hostname", "device"]
      on_error => "grok_failed"
    }
  }
  if [csvData] != "" {
    csv {
      source => "csvData"
      separator => ","
      on_error => "no_csvData"
    }
  }

  if [csvData] != "" {
    if [device]  =~ "authz-audit" {
      mutate {
        replace => {
          "devicetimestamp" => "%{column1}"
          "email" => "%{column2}"
          "commandline" => "%{column3}"
          "resourcename" => "%{column4}"
          "status" => "%{column5}"
          "unknownfield" => "%{column6}"
          "userRoles" => "%{column7}"
        }
        on_error => "no_csvData"
      }
    }
    else if [device] =~ "login-audit" {
      mutate {
        replace => {
          "devicetimestamp" => "%{column1}"
          "userId" => "%{column2}"
          "status" => "%{column3}"
          "IpAddress" => "%{column4}"
          "application" => "%{column5}"
          "versionDetails" => "%{column6}"
          "sessionID" => "%{column7}"
          "transactionId" => "%{column8}"
        }
        on_error => "csv_replace_failed"
      }
    }
  }
  if [sessionID] != "" and [application] =~ ["Web API"] {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{sessionID}"
      }
      on_error => "invalid_sessionID_error"
    }
  }
  else if [sessionID] != ""  {
    mutate {
      replace => {
        "network.session_id" => "%{sessionID}"
      }
      on_error => "invalid_sessionID_error"
    }
  }
  if [transactionId] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{transactionId}"
      }
      on_error => "invalid_transactionId"
    }
  }
  if [versionDetails] != "" {
    mutate {
      replace => {
        "security_result.about.platform_version" => "%{versionDetails}"
      }
      on_error => "invalid_versionDetails"
    }
  }
  if [application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{application}"
      }
      on_error => "no_application"
    }
  }
  if [IpAddress] != "" {
    mutate {
      merge => {
        "principal.ip" => "IpAddress"
        "principal.asset.ip" => "IpAddress"
      }
      on_error => "no_IpAddress"
    }
    if ![no_IpAddress] {
      mutate {
        merge => {
          "has_principal" => "true"
        }
        on_error => "invalid_IpAddress"
      }
    }
  }
  if [userId] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{userId}"
      }
      on_error => "no_userId"
    }
    if ![no_userId] {
      mutate {
        merge => {
          "has_principal_user" => "true"
        }
        on_error => "invalid_userId"
      }
    }
  }

  if [userRoles] != "" {
    grok {
      match => {
        "userRoles" => [
          'userRoles\\=\\[%{DATA:userRole}\\]\\;\\s+rolesAllowingAction\\=\\[%{GREEDYDATA:rolesAllow}\\]'
        ]
      }
      overwrite => ["userRole" , "rolesAllow"]
      on_error => "invalid_userRoles"
    }
  }
  if [rolesAllow] != "" {
    mutate {
      replace => {
        "rolesAllow_label.key" => "rolesAllow"
        "rolesAllow_label.value" => "%{rolesAllow}"
      }
      on_error => "no_rolesAllow"
    }
    if ![no_rolesAllow] {
      mutate {
        merge => {
          "security_result.detection_fields" => "rolesAllow_label"
        }
        on_error => "invalid_rolesAllow"
      }
    }
  }
  if [userRole] != "" {
    mutate  {
      replace => {
        "roles.name" => "%{userRole}"
      }
      on_error => "no_roles"
    }
    mutate {
      merge => {
        "principal.user.attribute.roles" => "roles"
      }
      on_error => "no_userRoles"
    }
  }
  if [status] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{status}"
      }
      on_error => "no_action"
    }
  }

  if [resourcename] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{resourcename}"
      }
      on_error => "no_resourcename"
    }
  }
  if [commandline] != "" {
    mutate {
      replace => {
        "target.process.command_line" => "%{commandline}"
      }
      on_error => "no_commandline"
    }
  }
  if [devicetimestamp] != "" {
    mutate {
      replace => {
        "devicetimestamp_label.key" => "devicetimestamp"
        "devicetimestamp_label.value.string_value" => "%{devicetimestamp}"
      }
      on_error => "no_devicetimestamp"
    }
    if ![no_devicetimestamp] {
      mutate {
        merge => {
          "additional.fields" => "devicetimestamp_label"
        }
        on_error => "invalid_devicetimestamp"
      }
    }
  }
  mutate {
    convert => {
      "syslog_severity" => "string"
    }
    on_error => "invalid_syslog_severity_conversion"
  }
  if [syslog_severity] != "" {
    mutate {
      replace => {
        "syslog_severity_label.key" => "syslog_severity"
        "syslog_severity_label.value.string_value" => "%{syslog_severity}"
      }
      on_error => "no_syslog_severity"
    }
    if ![no_syslog_severity] {
      mutate {
        merge => {
          "additional.fields" => "syslog_severity_label"
        }
        on_error => "invalid_syslog_severity"
      }
    }
  }
  if [email] != "" {
    if [email] =~ "^.+@.+$" {
      mutate {
        merge => {
          "principal.user.email_addresses" => "email"
        }
        on_error => "no_email"
      }
      if ![no_email] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "principal.user.userid" => "%{email}"
          "has_principal_user" => "true"
        }
        on_error => "no_principal_user"
      }
    }
  }
  if [sqlcmd] != "" {
    mutate {
      replace => {
        "sqlcmd_label.key" => "sqlcmd"
        "sqlcmd_label.value" => "%{sqlcmd}"
      }
      on_error => "no_sqlcmd"
    }
    if ![no_sqlcmd] {
      mutate {
        merge => {
          "security_result.detection_fields" => "sqlcmd_label"
        }
        on_error => "invalid_sqlcmd"
      }
    }
  }

    if [src_host] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{src_host}"
        }
        on_error => "invalid_src_host"
      }
    }
    if [src_ip1] != "" {
      mutate {
        merge => {
          "target.ip" => "src_ip1"
          "target.asset.ip" => "src_ip1"
        }
