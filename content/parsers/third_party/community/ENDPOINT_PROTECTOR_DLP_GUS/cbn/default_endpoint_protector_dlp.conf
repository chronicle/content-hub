# Product: ENDPOINT_PROTECTOR_DLP
# Category: Endpoint Detection
# Supported Format: SYSLOG + KV
# Reference: https://www.endpointprotector.com/
# Last Updated: 2025-09-26
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "intermediary_host" => ""
      "kv_data" => ""
      "OS" => ""
      "device_serial_label.value" => ""
      "epp_ip" => ""
      "epp_host" => ""
      "description" => ""
      "security_result" => ""
      "intermediary" => ""
      "intermediary_ip" => ""
      "server_date" => ""
      "client_date" => ""
      "serial_number" => ""
      "pid" => ""
      "server_date_utc" => ""
      "client_date_utc" => ""
      "has_principal" => ""
      "ts" => ""
      "Date_time_utc" => ""
      "Matched_Item" => ""
      "Destination" => ""
      "Server_Time" => ""
      "Date/Time(Server)" => ""
      "Date/Time(Client)" => ""
      "Date/Time(Server UTC)" => ""
      "Date/Time(Client UTC)" => ""
      "Server" => ""
      "Client" => ""
      "Server_UTC" => ""
      "Client_UTC" => ""
      "epp_port" => ""
      "hostname" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "message_not_json"
  }


  mutate {
    gsub => ["message", "\\\\u003c", "<"]
  }
  mutate {
    gsub => ["message", "\\\\u003e", ">"]
  }
  mutate {
    gsub => ["message", "@timestamp", "timestamp"]
  }
  mutate {
    gsub => ["message", "@version", "version"]
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:intermediary_host} EPP.*-%{IP:epp_ip}: EPP IP - %{HOSTNAME:epp_host} - %{GREEDYDATA:description}: %{GREEDYDATA:kv_data}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:intermediary_host} EPP.*-%{IP:epp_ip}: EPP IP -  -%{GREEDYDATA:description}: %{GREEDYDATA:kv_data}"
        "<%{INT}> %{IP:intermediary_ip} %{SYSLOGTIMESTAMP} %{IP} %{INT} %{TIMESTAMP_ISO8601:ts} %{DATA:intermediary_host} EPP-%{IP:epp_ip} %{INT:pid} - - EPP IP - %{IP:intermediary_ip} - %{GREEDYDATA:description}: %{GREEDYDATA:kv_data}"
        "<%{INT}> %{IP:intermediary_ip} %{SYSLOGTIMESTAMP} %{IP} %{INT} %{TIMESTAMP_ISO8601:ts} %{DATA:intermediary_host} EPP-%{IP:epp_ip} %{INT:pid} - - EPP IP -\\s+- %{GREEDYDATA:description}: %{GREEDYDATA:kv_data}",
        "<%{INT}>1 %{TIMESTAMP_ISO8601:ts} %{HOSTNAME:hostname} EPP-%{IP:epp_ip} %{NUMBER:epp_port} - - EPP IP - %{HOSTNAME:intermediary_host} - %{DATA:description} - %{DATA:product_event_type}: %{GREEDYDATA:kv_data}",
        "%{TIMESTAMP_ISO8601:ts} %{HOSTNAME:hostname} EPP-%{IP:epp_ip} %{NUMBER:epp_port} - - EPP IP - %{HOSTNAME:intermediary_host} - %{DATA:description} - %{DATA:product_event_type}: %{GREEDYDATA:kv_data}"
      ]
    }
    overwrite => ["ts", "intermediary_host", "kv_data", "epp_ip", "epp_host", "description", "intermediary_ip", "pid","epp_port","hostname"]
    on_error => "message_not_matched"
  }
  grok {
    match => {
      "body" => [
        "<%{INT}>1 %{TIMESTAMP_ISO8601:ts} %{HOSTNAME:hostname} EPP-%{IP:epp_ip} %{NUMBER:epp_port} - - EPP IP - %{HOSTNAME:intermediary_host} - %{DATA:description} - %{DATA:product_event_type}: %{GREEDYDATA:kv_data}"
        ]
    }
    overwrite => ["ts", "hostname", "epp_ip", "epp_port", "intermediary_host", "description", "product_event_type", "kv_data"]
    on_error => "body_not_grok"
  }
  if [message_not_matched] {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "no_json"
    }
    if [no_json] {
      drop {
        tag => "TAG_UNSUPPORTED"
      }
    }
  }

  if [ts] != "" {
    date {
      match => ["ts", "MMM d HH:mm:ss", "MMM dd HH:mm:ss", "MMM dd HH:mm:ss ", "MMM d HH:mm:ss ", "MMM  d HH:mm:ss", "MMM  dd HH:mm:ss"]
      rebase => true
      on_error => "ts_not_matched"
    }
    if [ts_not_matched] {
      date {
        match => ["ts","RFC3339"]
        on_error => "timestamp_not_matched"
      }
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data","\\[",""]
    }
    mutate {
      gsub => ["kv_data","\\] ",":"]
    }
    mutate {
      gsub => ["kv_data", "Date/Time\\(Client\\)","client_date"]
    }
    mutate {
      gsub => ["kv_data", "Date/Time\\(Server\\)","server_date"]
    }
    mutate {
      gsub => ["kv_data", "Date/Time\\(Server UTC\\)","server_date_utc"]
    }
    mutate {
      gsub => ["kv_data", "Date/Time\\(Client UTC\\)","client_date_utc"]
    }
    mutate {
      gsub => ["kv_data", "Serial Number","serial_number"]
    }
    mutate {
      gsub => ["kv_data","Date/Time\\(UTC\\)","Date_time_utc"]
    }
    kv {
      source => "kv_data"
      field_split => "|"
      value_split => ":"
      on_error => "kv_data_not_matched"
    }
  }
  if [intermediary_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "intermediary_ip"
      }
      on_error => "intermediary_ip_field_not_found"
    }
  }
  if [server_date] != "" {
    mutate {
      replace => {
        "server_date_label.key" => "Date/Time(Server)"
        "server_date_label.value.string_value" => "%{server_date}"
      }
      on_error => "server_date_field_not_found"
    }
    if ![server_date_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "server_date_label"
        }
        on_error => "server_date_field_merge_failed"
      }
    }
  }
  if [client_date] != "" {
    mutate {
      replace => {
        "client_date_label.key" => "Date/Time(Client)"
        "client_date_label.value.string_value" => "%{client_date}"
      }
      on_error => "client_date_field_not_found"
    }
    if ![client_date_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "client_date_label"
        }
        on_error => "client_date_field_merge_failed"
      }
    }
  }
  if [Date_time_utc] != "" {
    mutate {
      replace => {
        "Date_time_utc_label.key" => "Date/Time(UTC)"
        "Date_time_utc_label.value.string_value" => "%{Date_time_utc}"
      }
      on_error => "date_field_not_found"
    }
    if ![date_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Date_time_utc_label"
        }
        on_error => "date_field_merge_failed"
      }
    }
  }
  mutate {
    convert => {
      "pid" => "string"
    }
    on_error => "pid_field_convert_error"
  }
  if [pid] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{pid}"
      }
      on_error => "pid_field_not_found"
    }
  }
  if [server_date_utc] != "" {
    mutate {
      replace => {
        "server_date_utc_label.key" => "Date/Time(Server UTC)"
        "server_date_utc_label.value.string_value" => "%{server_date_utc}"
      }
      on_error => "server_date_utc_field_not_found"
    }
    if ![server_date_utc_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "server_date_utc_label"
        }
        on_error => "server_date_utc_field_merge_failed"
      }
    }
  }
  if [client_date_utc] != "" {
    mutate {
      replace => {
        "client_date_utc_label.key" => "Date/Time(Client UTC)"
        "client_date_utc_label.value.string_value" => "%{client_date_utc}"
      }
      on_error => "client_date_utc_field_not_found"
    }
    if ![client_date_utc_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "client_date_utc_label"
        }
        on_error => "client_date_utc_field_merge_failed"
      }
    }
  }
  if [epp_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "epp_ip"
      }
      on_error => "epp_ip_field_not_found"
    }
    if ![epp_ip_field_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [epp_host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{epp_host}"
        "has_principal" => "true"
      }
      on_error => "epp_host_field_not_found"
    }
  }

  mutate {
    merge => {
      "principal.ip" => "IP Address"
    }
    on_error => "ip_address_field_not_found"
  }
  if ![ip_address_field_not_found] {
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  mutate {
    gsub => ["MAC Address","-",":"]
  }

  mutate {
    merge => {
      "principal.mac" => "MAC Address"
    }
    on_error => "mac_address_field_not_found"
  }

  mutate {
    replace => {
      "principal.asset.asset_id" => "Client Computer: %{Client Computer}"
    }
    on_error => "client_computer_field_not_found"
  }

  if [serial_number] != "" {
    mutate {
      replace => {
        "hardware.serial_number" => "%{serial_number}"
      }
      on_error => "serial_number_field_not_found"
    }
    if ![serial_number_field_not_found] {
      mutate {
        merge => {
          "principal.asset.hardware" => "hardware"
        }
        on_error => "hardware_field_not_found"
      }
    }
  }

  mutate {
    replace => {
      "principal.user.userid" => "%{Client User}"
    }
    on_error => "client_user_field_not_found"
  }

  mutate {
    replace => {
      "security_result.rule_name" => "%{Content Policy}"
    }
    on_error => "content_policy_field_not_found"
  }

  mutate {
    replace => {
      "security_result.rule_id" => "%{Content Policy Type}"
    }
    on_error => "content_policy_type_field_not_found"
  }

  mutate {
    replace => {
      "target.file.full_path" => "%{File Name}"
    }
    on_error => "file_name_field_not_found"
  }

  mutate {
    replace => {
      "file_size" => "%{File Size}"
    }
    on_error => "file_size_field_not_found"
  }

  if ![file_size_field_not_found] {
    if [file_size] != "" {
      mutate {
        replace => {
          "target.file.size" => "%{File Size}"
        }
      }
      mutate {
        convert => {
          "target.file.size" => "uinteger"
        }
        on_error => "already_string"
      }
    }
  }

  if [OS] =~ "(?i)Windows" {
    mutate {
      replace => {
        "principal.platform" => "WINDOWS"
      }
    }
  }
  else if [OS] =~ "(?i)Mac" {
    mutate {
      replace => {
        "principal.platform" => "MAC"
      }
    }
  }
  else if [OS] =~ "(?i)Lin" {
    mutate {
      replace => {
        "principal.platform" => "LINUX"
      }
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{hostname}"
      }
      on_error => "hostname_field_not_found"
    }
  }
  if [epp_port] != "" {
    mutate {
      convert => {
        "epp_port" => "integer"
      }
      on_error => "epp_port_not_integer"
    }
    mutate {
      rename => {
        "epp_port" => "principal.port"
      }
    }
  }
  mutate {
    replace => {
      "Server" => "%{Date/Time(Server)}"
    }
  }
  mutate {
    replace => {
      "Client" => "%{Date/Time(Client)}"
    }
    on_error => "client_field_not_found"
  }
  mutate {
    replace => {
      "Server_UTC" => "%{Date/Time(Server UTC)}"
    }
    on_error => "server_utc_field_not_found"
  }
  mutate {
    replace => {
      "Client_UTC" => "%{Date/Time(Client UTC)}"
    }
    on_error => "client_utc_field_not_found"
  }

  if [Server] != "" {
    mutate {
      replace => {
        "datetime_server_label.key" => "Date/Time(Server)"
        "datetime_server_label.value.string_value" => "%{Server}"
      }
      on_error => "datetime_server_field_not_found"
    }
    if ![datetime_server_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "datetime_server_label"
        }
        on_error => "datetime_server_label_not_found"
      }
    }
  }

  if [Client] != "" {
    mutate {
      replace => {
        "datetime_client_label.key" => "Date/Time(Client)"
        "datetime_client_label.value.string_value" => "%{Client}"
      }
      on_error => "datetime_client_field_not_found"
    }
    if ![datetime_client_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "datetime_client_label"
        }
        on_error => "datetime_client_label_not_found"
      }
    }
  }

  if [Server_UTC] != "" {
    mutate {
      replace => {
        "datetime_server_utc_label.key" => "Date/Time(Server UTC)"
        "datetime_server_utc_label.value.string_value" => "%{Server_UTC}"
      }
      on_error => "datetime_server_utc_field_not_found"
    }
    if ![datetime_server_utc_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "datetime_server_utc_label"
        }
        on_error => "datetime_server_utc_label_not_found"
      }
    }
  }

  if [Client_UTC] != "" {
    mutate {
      replace => {
        "datetime_client_utc_label.key" => "Date/Time(Client UTC)"
        "datetime_client_utc_label.value.string_value" => "%{Client_UTC}"
      }
      on_error => "datetime_client_utc_field_not_found"
    }
    if ![datetime_client_utc_field_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "datetime_client_utc_label"
        }
        on_error => "datetime_client_utc_label_not_found"
      }
    }
  }
  if [OS] != "" {
    mutate {
      replace => {
        "principal.platform_version" => "%{OS}"
      }
      on_error => "os_field_not_found"
    }
  }

  mutate {
    replace => {
      "metadata.product_log_id" => "%{Log ID}"
    }
    on_error => "log_id_field_not_found"
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
    }
  }

  if [intermediary_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_host}"
      }
    }
  }
  if [Destination] != "" {
    mutate {
      replace => {
        "target.application" => "%{Destination}"
      }
      on_error => "destination_field_not_found"
    }
  }

  mutate {
    replace => {
      "destination_type_label.key" => "Destination Type"
      "destination_type_label.value" => "%{Destination Type}"
    }
    on_error => "destination_type_field_not_found"
  }

  if ![destination_type_field_not_found] {
    mutate {
      merge => {
        "metadata.ingestion_labels" => "destination_type_label"
      }
    }
  }

  mutate {
    replace => {
      "device_pid_label.key" => "Device PID"
      "device_pid_label.value" => "%{Device PID}"
    }
    on_error => "device_pid_field_not_found"
  }

  if ![device_pid_field_not_found] {
    mutate {
      merge => {
        "metadata.ingestion_labels" => "device_pid_label"
      }
    }
  }

  mutate {
    replace => {
      "device_vid_label.key" => "Device VID"
      "device_vid_label.value" => "%{Device VID}"
    }
    on_error => "device_vid_field_not_found"
  }

  if ![device_vid_field_not_found] {
    mutate {
      merge => {
        "metadata.ingestion_labels" => "device_vid_label"
      }
    }
  }

  mutate {
    replace => {
      "device_serial_label.key" => "Device Serial"
      "device_serial_label.value" => "%{Device Serial}"
    }
    on_error => "device_serial_field_not_found"
  }

  if ![device_serial_field_not_found] and [device_serial_label][value] != "" {
    mutate {
      merge => {
        "metadata.ingestion_labels" => "device_serial_label"
      }
    }
  }

  mutate {
    replace => {
      "item_details_label.key" => "Item Details"
      "item_details_label.value" => "%{Item Details}"
    }
    on_error => "item_details_field_not_found"
  }

  if ![item_details_field_not_found] {
    mutate {
      merge => {
        "metadata.ingestion_labels" => "item_details_label"
      }
      on_error => "item_details_label_merge_failed"
    }
  }
  mutate {
    replace => {
      "Matched_Item" => "%{Matched Item}"
    }
    on_error => "matcheditem_field_not_found"
  }
  if [Matched_Item] != "" {
    mutate {
      replace => {
        "target.file.mime_type" => "%{Matched_Item}"
      }
      on_error => "matched_item_field_not_found"
    }
  }

  mutate {
    replace => {
      "security_result.summary" => "%{Message}"
    }
    on_error => "field_not_found"
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "ENDPOINT_PROTECTOR_DLP"
      "metadata.product_name" => "ENDPOINT_PROTECTOR_DLP"
    }
  }
  if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "SCAN_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    rename => {
      "metadata" => "event.idm.read_only_udm.metadata"
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "network" => "event.idm.read_only_udm.network"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
