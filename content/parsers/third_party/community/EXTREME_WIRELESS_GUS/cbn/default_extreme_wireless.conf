# Product: EXTREME_WIRELESS
# Category: Network Management and Optimization software
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2025-11-20
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      # grok fields
      "prod_event_type" => ""
      "action" => ""
      "description" => ""
      "session_id" => ""
      "sec_summary" => ""
      "lifetime" => ""
      "target_ip" => ""
      "target_port" => ""
      "target_host" => ""
      "target_user" => ""
      "IP" => ""
      "ip" => ""
      "port" => ""
      "hostname" => ""
      "username" => ""
      "medium" => ""
      "MAC" => ""
      "event_id" => ""
      "length" => ""
      "filename" => ""
      "target_url" => ""
      "ip_protocol" => ""
      "station" => ""
      "problem_id" => ""
      "timestamp" => ""
      "count" => ""
      "instance_id" => ""
      "problem_timestamp" => ""
      "BSSID" => ""
      "first" => ""
      "SSID" => ""
      "problem_summary" => ""
      "user-profile" => ""
      "kv_data" => ""
      # event type specific
      "event_type" => ""
      "principal_machine_id_present" => "false"
      "principal_userid_present" => "false"
      "target_machine_id_present" => "false"
      "target_userid_present" => "false"
      # udm noun
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "client_mac" => ""
      "kvdata" => ""
      "wlanvalue" => ""
      "ssidvalue" => ""
      "radioID" => ""
      "uname" => ""
      "mu_mac" => ""
      "role" => ""
      "wlname" => ""
      "devt" => ""
      "bssid" => ""
      "os" => ""
      "conn_cap" => ""
      "client_contd" => ""
      "ap" => ""
      "ip4" => ""
      "hname" => ""
    }
  }

  mutate {
    gsub => ["message", "□", ""]
  }
  mutate {
    gsub => ["message", "\\\\n", ""]
  }
  mutate {
    gsub => ["message", "N/A", ""]
  }

  # Grok pattern to process syslog message
  grok {
    match => {
       "message" => [
          "<%{INT}>(?P<prod_event_type>capwap): %{DATA}: %{GREEDYDATA:description}",
          "<%{INT}>%{DATA:prod_event_type}: %{DATA}: %{DATA}: %{DATA:action}: %{GREEDYDATA:description}",
          "<%{INT}>%{DATA:prod_event_type}: %{DATA}: %{DATA:action}: %{GREEDYDATA:description}",
          "<%{INT}>%{DATA:prod_event_type}: %{DATA:action} : %{GREEDYDATA:description}",
          "<%{INT}>\\[fe\\]: %{IP:IP}\/%{INT:port} -> %{IP:target_ip}\/%{INT:target_port}, %{DATA:action}, user-name %{DATA:username}, hostname %{DATA:hostname} -> user-name %{DATA:target_user}, hostname %{GREEDYDATA:target_host}",
          "<%{INT}>%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:hostname}\\s+%{DATA:prod_event_type}\\s+%{DATA}'%{MAC:client_mac}'\\s+%{DATA}wlan\\s+'%{DATA:wlanvalue}'\\s+radio%{GREEDYDATA:radioID}"
          "<%{INT}>%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:hostname}\\s+%{DATA:prod_event_type}\\s+%{DATA}'%{MAC:client_mac}'\\s+%{DATA}wlan\\s+'%{DATA:wlanvalue}'\\s+ssid\\s+'%{DATA:ssidvalue}'\\s+%{DATA}radio\\s+%{GREEDYDATA:radioID}",
          "<%{INT}>%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:hostname}\\s+%{DATA:prod_event_type}\\s+%{GREEDYDATA:kvdata}"
          "<%{INT}>%{DATA:prod_event_type}: %{DATA}: %{GREEDYDATA:description}",
        ]
    }
    overwrite => ["prod_event_type", "action", "description", "IP", "port", "target_ip", "target_port", "username", "hostname", "target_user", "target_host", "product_event_code", "timestamp", "client_mac", "auth_protocol", "ssidvalue", "radioID","kvdata","wlanvalue"]
    on_error  => "header_grok_match_failed"
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{description}"
      }
      on_error => "description_value_invalid"
    }
  }

  if [action] =~ "problem timestamp" {
    grok {
      match => {
        "action" => [
          "%{GREEDYDATA:action_kv_data}"
        ]
      }
      overwrite => ["action_kv_data"]
      on_error => "action_grok_failed"
    }
    if [action_kv_data] != "" {
      mutate {
        gsub => ["action_kv_data", ", ", "#"]
      }
      mutate {
        gsub => ["action_kv_data", "problem ", "problem_"]
      }
      mutate {
        gsub => ["action_kv_data", "N/A", ""]
      }
      kv {
        source => "action_kv_data"
        field_split => "#"
        value_split=> ":"
        on_error => "action_kv_failed"
      }
    }
  }

  if [prod_event_type] =~ "kernel" {
    grok {
      match => {
        "description" => [
          "%{DATA} \\(id %{DATA:session_id}\\) %{IP:IP}\/%{INT:port} -> %{IP:target_ip}\/%{INT:target_port}, %{DATA:action}, %{DATA:sec_summary}, %{DATA:lifetime}, user-name %{DATA:username}, hostname %{DATA:hostname} -> user-name %{DATA:target_user}, hostname %{GREEDYDATA:target_host}"
        ]
      }
      overwrite => ["session_id", "IP", "port", "target_ip", "target_port", "action", "sec_summary", "lifetime", "username", "hostname", "target_user", "target_host"]
      on_error => "kernel_desc_grok_failed"
    }
  }
  else if [prod_event_type] =~ "ah_auth" {
    grok {
      match => {
        "description" => [
          "server %{IP:target_ip} %{DATA} ipv4 %{DATA} %{IP:IP}",
          "server %{IP:target_ip}:%{INT:target_port}",
          "server %{IP:target_ip}",
          "ipv4 %{IP:IP}",
          "\\(%{IP:target_ip}\\)",
          "%{GREEDYDATA:kv_data} on %{GREEDYDATA:medium}"
        ]
      }
      overwrite => ["target_ip", "target_port", "IP", "kv_data", "medium"]
      on_error => "ah_auth_desc_grok_failed"
    }
  }
  else if [prod_event_type] =~ "(?i)capwap" {
    grok {
      match => {
        "description" => [
          "%{GREEDYDATA}eventid = %{DATA:event_id}: length = %{GREEDYDATA:length}",
          "%{GREEDYDATA}length:%{GREEDYDATA:length}",
          '%{GREEDYDATA}filename=%{DATA:filename}\\\\\\\" %{GREEDYDATA} -u %{DATA:username}:%{DATA}\\\\\\\"%{DATA:target_url}\\\\\\\"%{GREEDYDATA}',
          "%{GREEDYDATA}\\((?P<ip_protocol>TCP)\\), %{GREEDYDATA:kv_data}",
          "%{GREEDYDATA}HM\\(%{GREEDYDATA:kv_data}\\)"
        ]
      }
      overwrite => ["event_id", "length", "filename", "username", "target_url", "ip_protocol", "kv_data"]
      on_error => "capwap_desc_grok_failed"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "problem id", "problem_id"]
    }
    mutate {
      gsub => ["kv_data", "session id", "session_id"]
    }
    mutate {
      gsub => ["kv_data", "instance id", "instance_id"]
    }
    kv {
      source => "kv_data"
      field_split => ", "
      value_split => "="
      on_error => "kv_data_invalid"
    }
  }
  mutate {
    gsub => ["kvdata", "('[a-zA-Z0-9-_.]+')", "=$1"]
  }
  mutate {
    gsub => ["kvdata", "'", ""]
  }
  if [kvdata] != "" {
    kv {
      source => "kvdata"
      field_split => ","
      value_split => "="
      on_error => "kvdata_invalid"
    }
  }
  if [client_mac] != "" {
    mutate {
      gsub => ["client_mac", "-", ":"]
    }
    grok {
      match => {
        "client_mac" => ["%{MAC:client_mac}"]
      }
      overwrite => ["client_mac"]
      on_error => "client_mac_grok_failed"
    }
    if [client_mac] != "" {
      mutate {
        merge => {
          "target.mac" => "client_mac"
          "target.asset.mac" => "client_mac"
        }
        on_error => "client_mac_invalid"
      }
      if ![client_mac_invalid] {
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
        }
      }
    }
  }
  if [wlanvalue] != "" {
    mutate {
      replace => {
        "wlan_label.key" => "wlan"
        "wlan_label.value.string_value" => "%{wlanvalue}"
      }
      on_error => "wlan_value_invalid"
    }
    if ![wlan_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "wlan_label"
        }
        on_error => "wlan_label_merge_failed"
      }
    }
  }
  if [ssidvalue] != "" {
    mutate {
      replace => {
        "ssidvalue_label.key" => "SSIDvalue"
        "ssidvalue_label.value.string_value" => "%{ssidvalue}"
      }
      on_error => "ssidvalue_value_invalid"
    }
    if ![ssidvalue_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "ssidvalue_label"
        }
        on_error => "ssidvalue_label_merge_failed"
      }
    }
  }
  if [radioID] != "" {
    mutate {
      gsub => ["radioID", "'", ""]
    }
    mutate {
      replace => {
        "radioID_label.key" => "RadioID"
        "radioID_label.value.string_value" => "%{radioID}"
      }
      on_error => "radioID_value_invalid"
    }
    if ![radioID_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "radioID_label"
        }
        on_error => "radioID_label_merge_failed"
      }
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "yyyy-MM-ddTHH:mm:ss.SSSSSSZZ", "ISO8601","RFC3339"]
      target => "metadata.event_timestamp"
      on_error => "timestamp_invalid"
    }
  }
  if [uname] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "uname_label.key" => "uname"
        "uname_label.value" => "%{uname}"
      }
      on_error => "uname_value_invalid"
    }
    if ![uname_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "uname_label"
        }
        on_error => "uname_label_merge_failed"
      }
    }
  }
  if [mu_mac] != "" {
    mutate {
      gsub => ["mu_mac", "-", ":"]
    }
    grok {
      match => {
        "mu_mac" => ["%{MAC:mu_mac}"]
      }
      overwrite => ["mu_mac"]
      on_error => "mu_mac_grok_failed"
    }
    if ![mu_mac_grok_failed] {
      mutate {
        merge => {
          "principal.mac" => "mu_mac"
          "principal.asset.mac" => "mu_mac"
        }
        on_error => "mu_mac_invalid"
      }
      if ![mu_mac_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
        }
      }
    }
  }
  if [role] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "role_label.key" => "role"
        "role_label.value.string_value" => "%{role}"
      }
      on_error => "role_value_invalid"
    }
    if ![role_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "role_label"
        }
        on_error => "role_label_merge_failed"
      }
    }
  }
  if [wlname] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "wlname_label.key" => "wlname"
        "wlname_label.value" => "%{wlname}"
      }
      on_error => "wlname_value_invalid"
    }
    if ![wlname_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "wlname_label"
        }
        on_error => "wlname_label_merge_failed"
      }
    }
  }
  if [devt] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "devt_label.key" => "devt"
        "devt_label.value" => "%{devt}"
      }
      on_error => "devt_value_invalid"
    }
    if ![devt_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "devt_label"
        }
        on_error => "devt_label_merge_failed"
      }
    }
  }
  if [os] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "os_label.key" => "os"
        "os_label.value" => "%{os}"
      }
      on_error => "os_value_invalid"
    }
    if ![os_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "os_label"
        }
        on_error => "os_label_merge_failed"
      }
    }
  }
  if [bssid] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "bssid_label.key" => "bssid"
        "bssid_label.value" => "%{bssid}"
      }
      on_error => "bssid_value_invalid"
    }
    if ![bssid_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "bssid_label"
        }
        on_error => "bssid_label_merge_failed"
      }
    }
  }
  if [conn_cap] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "conn_cap_label.key" => "conn_cap"
        "conn_cap_label.value" => "%{conn_cap}"
      }
      on_error => "conn_cap_value_invalid"
    }
    if ![conn_cap_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "conn_cap_label"
        }
        on_error => "conn_cap_label_merge_failed"
      }
    }
  }
  if [client_contd] not in ["", "null", "Unknown"] {
    mutate {
      replace => {
        "client_contd_label.key" => "client_contd"
        "client_contd_label.value" => "%{client_contd}"
      }
      on_error => "client_contd_value_invalid"
    }
    if ![client_contd_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "client_contd_label"
        }
        on_error => "client_contd_label_merge_failed"
      }
    }
  }
  if [ap] not in ["", "null", "Unknown"] {
    mutate {
      gsub => ["ap", "-", ":"]
    }
    grok {
      match => {
        "ap" => ["%{MAC:ap}"]
      }
      overwrite => ["ap"]
      on_error => "ap_grok_failed"
    }
    if ![ap_grok_failed] {
      mutate {
        merge => {
          "target.mac" => "ap"
          "target.asset.mac" => "ap"
        }
        on_error => "ap_invalid"
      }
      if ![ap_invalid] {
        mutate {
          replace => {
            "target_machine_id_present" => "true"
          }
        }
      }
    }
  }
  if [ip4] not in ["", "null", "Unknown"] {
    grok {
      match => {
        "ip4" => ["%{IP:ip4}"]
      }
      overwrite => ["ip4"]
      on_error => "ip4_grok_failed"
    }
    if ![ip4_grok_failed] {
      mutate {
        merge => {
          "principal.ip" => "ip4"
          "principal.asset.ip" => "ip4"
        }
        on_error => "ip4_invalid"
      }
      if ![ip4_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
        }
      }
    }
  }
  if [hname] not in ["", "null", "Unknown"] {
    mutate {
      gsub => ["hname", "-", ":"]
    }
    grok {
      match => {
        "hname" => ["%{MAC:hname}"]
      }
      overwrite => ["hname"]
      on_error => "hname_grok_failed"
    }
    if ![hname_grok_failed] {
      mutate {
        merge => {
          "principal.mac" => "hname"
          "principal.asset.mac" => "hname"
        }
        on_error => "hname_invalid"
      }
      if ![hname_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
        }
      }
    }
  }

  if [MAC] != "" {
    mutate {
      replace => {
        "mac_label.key" => "MAC"
        "mac_label.value" => "%{MAC}"
      }
      on_error => "MAC_Value_Invalid"
    }
    if ![MAC_Value_Invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "mac_label"
        }
        on_error => "mac_label_merge_failed"
      }
    }
  }

  if [medium] != "" {
    mutate {
      replace => {
        "medium_label.key" => "medium"
        "medium_label.value" => "%{medium}"
      }
      on_error => "medium_invalid"
    }
    if ![medium_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "medium_label"
        }
        on_error => "medium_label_merge_failed"
      }
    }
  }

  if [target_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "target_ip"
        "target.asset.ip" => "target_ip"
      }
      on_error => "target_ip_invalid"
    }
    if ![target_ip_invalid] {
      mutate {
        replace => {
          "target_machine_id_present" => "true"
        }
      }
    }
  }
  if [target_host] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{target_host}"
        "target.asset.hostname" => "%{target_host}"
        "target_machine_id_present" => "true"
      }
      on_error => "target_host_invalid"
    }
  }
  if [target_port] != "" {
    mutate {
      convert => {
        "target_port" => "integer"
      }
      on_error => "target_port_already_integer"
    }
    mutate {
      rename => {
        "target_port" => "target.port"
      }
      on_error => "target_port_invalid"
    }
  }
  if [target_user] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{target_user}"
        "target_userid_present" => "true"
      }
      on_error => "target_user_invalid"
    }
  }

  if [IP] == "" and [ip] != "" {
    mutate {
      replace => {
        "IP" => "%{ip}"
      }
      on_error => "ip_not_found"
    }
  }
  if [IP] != "" {
    mutate {
      merge => {
        "principal.ip" => "IP"
        "principal.asset.ip" => "IP"
      }
      on_error => "principal_ip_invalid"
    }
    if ![principal_ip_invalid] {
      mutate {
        replace => {
          "principal_machine_id_present" => "true"
        }
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
        "principal.asset.hostname" => "%{hostname}"
        "principal_machine_id_present" => "true"
      }
      on_error => "principal_host_invalid"
    }
  }
  else if [station] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{station}"
        "principal.asset.hostname" => "%{station}"
        "principal_machine_id_present" => "true"
      }
      on_error => "station_invalid"
    }
  }

  if [port] != "" {
    mutate {
      convert => {
        "port" => "integer"
      }
      on_error => "port_already_integer"
    }
    mutate {
      rename => {
        "port" => "principal.port"
      }
      on_error => "port_invalid"
    }
  }

  if [username] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{username}"
        "principal_userid_present" => "true"
      }
      on_error => "principal_user_invalid"
    }
  }

  if [session_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{session_id}"
      }
      on_error => "session_id_invalid"
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "action_label.key" => "action"
        "action_label.value" => "%{action}"
      }
      on_error => "action_value_invalid"
    }
    if ![action_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "action_label"
        }
        on_error => "action_label_merge_failed"
      }
    }
  }

  if [sec_summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{sec_summary}"
      }
      on_error => "sec_summary_invalid"
    }
    if [sec_summary] =~ "(?i)TCP|tcp" {
      mutate {
        replace => {
          "ip_protocol" => "TCP"
        }
      }
    }
  }
  if [problem_summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{problem_summary}"
      }
      on_error => "sec_summary_invalid"
    }
  }

  if [ip_protocol] =~ "(?i)TCP" {
    mutate {
      replace => {
        "network.ip_protocol" => "TCP"
      }
    }
  }

  if [lifetime] != "" {
    mutate {
      replace => {
        "lifetime_label.key" => "lifetime"
        "lifetime_label.value" => "%{lifetime}"
      }
      on_error => "lifetime_value_invalid"
    }
    if ![lifetime_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "lifetime_label"
        }
        on_error => "lifetime_label_merge_failed"
      }
    }
  }

  if [event_id] != "" {
    mutate {
      replace => {
        "eventId_label.key" => "event_id"
        "eventId_label.value.string_value" => "%{event_id}"
      }
      on_error => "eventId_value_invalid"
    }
    if ![eventId_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "eventId_label"
        }
        on_error => "eventId_label_merge_failed"
      }
    }
  }

  if [length] != "" {
    mutate {
      replace => {
        "length_label.key" => "length"
        "length_label.value.string_value" => "%{length}"
      }
      on_error => "length_value_invalid"
    }
    if ![length_value_invalid] {
      mutate {
        merge => {
          "additional.fields" => "length_label"
        }
        on_error => "length_label_merge_failed"
      }
    }
  }

  if [filename] != "" {
    mutate {
      replace => {
        "principal.file.full_path" => "%{filename}"
      }
      on_error => "file_name_invalid"
    }
  }

  if [target_url] != "" {
    mutate {
      replace => {
        "target.url" => "%{target_url}"
      }
      on_error => "target_url_invalid"
    }
  }

  if [problem_id] != "" {
    mutate {
      replace => {
        "problem_id_label.key" => "problem_id"
        "problem_id_label.value" => "%{problem_id}"
      }
      on_error => "problem_id_value_invalid"
    }
    if ![problem_id_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "problem_id_label"
        }
        on_error => "problem_id_label_merge_failed"
      }
    }
  }

  if [count] != "" {
    mutate {
      replace => {
        "count_label.key" => "count"
        "count_label.value" => "%{count}"
      }
      on_error => "count_value_invalid"
    }
    if ![count_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "count_label"
        }
        on_error => "count_label_merge_failed"
      }
    }
  }

  if [instance_id] != "" {
    mutate {
      replace => {
        "instance_id_label.key" => "instance_id"
        "instance_id_label.value" => "%{instance_id}"
      }
      on_error => "instance_id_value_invalid"
    }
    if ![instance_id_value_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "instance_id_label"
        }
        on_error => "instance_id_label_merge_failed"
      }
    }
  }

  if [BSSID] != "" {
    mutate {
      replace => {
        "bssid_label.key" => "BSSID"
        "bssid_label.value" => "%{BSSID}"
      }
      on_error => "BSSID_value_invalid"
    }
    if ![BSSID_value_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "bssid_label"
        }
        on_error => "BSSID_label_merge_failed"
      }
    }
  }

  if [first] != "" {
    mutate {
      replace => {
        "first_label.key" => "first"
        "first_label.value" => "%{first}"
      }
      on_error => "first_value_invalid"
    }
    if ![first_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "first_label"
        }
        on_error => "first_label_merge_failed"
      }
    }
  }

  if [user-profile] != "" {
    mutate {
      replace => {
        "user_profile_label.key" => "user profile"
        "user_profile_label.value" => "%{user-profile}"
      }
      on_error => "user_profile_value_invalid"
    }
    if ![user_profile_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "user_profile_label"
        }
        on_error => "user_profile_label_merge_failed"
      }
    }
  }

  if [SSID] != "" {
    mutate {
      replace => {
        "ssid_label.key" => "SSID"
        "ssid_label.value" => "%{SSID}"
      }
      on_error => "SSID_value_invalid"
    }
    if ![SSID_value_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "ssid_label"
        }
        on_error => "SSID_label_merge_failed"
      }
    }
  }

  # metadata info
  if [prod_event_type] != "" {
    mutate {
      gsub => ["prod_event_type", ":", ""]
    }
    mutate {
      gsub => ["prod_event_type", "%", ""]
    }
    mutate {
      replace => {
        "metadata.product_event_type" => "%{prod_event_type}"
      }
      on_error => "prod_event_type_invalid"
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "EXTREME_WIRELESS"
      "metadata.product_name" => "EXTREME WIRELESS"
    }
  }

  # set metadata.event_type
  if [event_type] == "" {
    if [principal_machine_id_present] == "true" and [target_machine_id_present] == "true" {
      mutate {
        replace => {
          "event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [principal_userid_present] == "true" or [target_userid_present] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [principal_machine_id_present] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }


  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_value_invalid"
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
