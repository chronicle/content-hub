# Product: Cisco DHCP
# Category: DHCP
# Supported Format: SYSLOG + CSV
# Last Updated: 2022-02-07
# Copyright 2022 Chronicle LLC

filter {
  mutate {
    replace => {
      "severity" => ""
      "description" => ""
      "mnemonic" => ""
      "facility" => ""
      "host_name" => ""
      "csv_data" => ""
      "security_result" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "^<%{INT}>(%{INT}(: %{HOSTNAME:host_name}: )?%{GREEDYDATA})?(%{SPACE})?%%{WORD:facility}-%{INT:severity}-%{WORD:mnemonic}: %{GREEDYDATA:description}",
        "(%{GREEDYDATA}\\[-\\]: )?%{GREEDYDATA:csv_data}"
      ]
    }
    overwrite => ["description", "facility", "severity", "host_name", "mnemonic", "csv_data"]
    on_error => "syslog_failed"
  }

  if [csv_data] != "" {
    csv {
      source => "csv_data"
      separator => ","
      target => "csv_dhcp"
      on_error => "not_in_csv_format"
    }

    if ![not_in_csv_format] {
      mutate {
        rename => {
          "csv_dhcp.column1" => "ciscoColTs",
          "csv_dhcp.column2" => "ciscoColServer"
          "csv_dhcp.column3" => "ciscoColClientMAC",
          "csv_dhcp.column4" => "ciscoColClientIP"
          "csv_dhcp.column5" => "ciscoColLeaseExp"
        }
      }

      date {
        match => ["ciscoColTs", "yyyy-MM-ddTHH:mm:ss.SSSZ", "RFC3339"]
        on_error => "date_parse_fail"
      }

      if [ciscoColServer] != "" {
        mutate {
          gsub => ["ciscoColServer", " router:", ""]
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{ciscoColServer}"
          }
        }
      }

      if [ciscoColClientMAC] != "" {
        mutate {
          gsub => ["ciscoColClientMAC", " mac_address:", ""]
        }

        mutate {
          replace => {
            "event.idm.read_only_udm.network.dhcp.client_identifier" => "%{ciscoColClientMAC}"
          }
          convert => {
            "event.idm.read_only_udm.network.dhcp.client_identifier" => "bytes"
          }
        }

        mutate {
          gsub => ["ciscoColClientMAC", "\\.", ""]
        }
        grok {
          match => {
            "ciscoColClientMAC" => [
              "(?P<macAddr1>\\S{2})(?P<macAddr2>\\S{2})(?P<macAddr3>\\S{2})(?P<macAddr4>\\S{2})(?P<macAddr5>\\S{2})(?P<macAddr6>\\S{2})"
            ]
          }
          on_error => "syslog_not_matched"
          overwrite => ["macAddr1","macAddr2","macAddr3","macAddr4", "macAddr5", "macAddr6"]
        }

        mutate {
          replace => {
            "macAddr" => "%{macAddr1}:%{macAddr2}:%{macAddr3}:%{macAddr4}:%{macAddr5}:%{macAddr6}"
          }
        }
        mutate {
          lowercase => ["macAddr"]
        }

        mutate {
          merge => {
            "event.idm.read_only_udm.principal.mac" => "macAddr"
          }
          replace => {
            "event.idm.read_only_udm.network.dhcp.chaddr" => "%{macAddr}"
          }
        }
      }

      if [ciscoColClientIP] != "" {
        grok {
          match => {
            "ciscoColClientIP" => "%{IP:ciscoColClientIP}"
          }
          overwrite => ["ciscoColClientIP"]
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "ciscoColClientIP"
          }
        }
      }

      if [ciscoColClientMAC] != "" and [ciscoColClientIP] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.dhcp.type" => "ACK"
            "event.idm.read_only_udm.network.dhcp.opcode" => "BOOTREPLY"
            "event.idm.read_only_udm.network.dhcp.yiaddr" => "%{ciscoColClientIP}"
          }
        }
      }

      if [ciscoColLeaseExp] != "" {
        grok {
          match => {
            "ciscoColLeaseExp" => "lease_exp:(?P<timestamp>%{MONTH} %{MONTHDAY} %{YEAR} %{HOUR}:%{MINUTE}( PM| AM| pm| am))"
          }
        }
        date {
          match => ["timestamp", "MMM d yyyy HH:mm", "MMM d yyyy HH:mm ", "MMM d yyyy HH:mm A", "MMM d yyyy HH:mm a", "RFC3339", "UNIX", "ISO8601"]
          target => "lease_timestamp"
        }

        mutate {
          convert => {
            "lease_timestamp.seconds" => "string"
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.network.dhcp.lease_time_seconds" => "%{lease_timestamp.seconds}"
          }
          convert => {
            "event.idm.read_only_udm.network.dhcp.lease_time_seconds" => "uinteger"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "DHCP"
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_DHCP"
        }
      }
    }
  }

  else {
    if [severity] != "" {
      if [severity] in ["0", "1", "2", "3", "LOW"] {
        mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      }
      else if [severity] in ["4", "5", "6", "MEDIUM"] {
        mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      }
      else if [severity] in ["7", "8", "HIGH"] {
        mutate {
          replace => {
            "security_result.severity" => "HIGH"
          }
        }
      }
      else if [severity] in ["9", "10", "VERY-HIGH"] {
        mutate {
          replace => {
            "security_result.severity" => "CRITICAL"
          }
        }
      }
      else {
        mutate {
          replace => {
            "security_result.severity" => "UNKNOWN_SEVERITY"
          }
        }
      }
    }

    if [description] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
      }
      mutate {
        replace => {
          "src_ip" => ""
          "src_port" => ""
          "dest_ip" => ""
          "dest_port" => ""
        }
      }
      grok {
        match => {
          "description" => [
            ".*?%{IP:src_ip} port %{POSINT:src_port}",
            ".*:%{IP:dest_ip}/%{POSINT:dest_port}"
          ]
        }
        overwrite => ["src_ip", "src_port", "dest_ip", "dest_port"]
        on_error => "no_ip_port_present"
      }

      if ![no_ip_port_present] {
        if [src_ip] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "src_ip"
            }
          }
        }
        if [dest_ip] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.ip" => "dest_ip"
            }
          }
        }
        if [src_port] != "" {
          mutate {
            convert => {
              "src_port" => "integer"
            }
          }
          mutate {
            rename => {
              "src_port" => "event.idm.read_only_udm.principal.port"
            }
          }
        }

        if [dest_port] != "" {
          mutate {
            convert => {
              "dest_port" => "integer"
            }
          }
          mutate {
            rename => {
              "dest_port" => "event.idm.read_only_udm.target.port"
            }
          }
        }
      }

      if [description] =~ "TCP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.ip_protocol" = "TCP"
          }
        }
      }
    }

    if [mnemonic] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{mnemonic}"
        }
      }
    }

    if [facility] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.resource.type" => "%{facility}"
        }
      }
    }

    if [host_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{host_name}"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "security_result.summary" => "%{facility}-%{severity}-%{mnemonic}"
        "security_result_action" => "UNKNOWN_ACTION"
      }
      merge => {
        "security_result.action" => "security_result_action"
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "CISCO"
      "event.idm.read_only_udm.metadata.product_name" => "CISCO DHCP"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
