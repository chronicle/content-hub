# Product: JBoss Web
# Category: Web Server
# Supported Format: KV
# Reference: N/A
# Last Updated: 2026-07-27
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "has_user" => "false"
      "has_principal" => "false"
      "has_target" => "false"
      "has_http" => "false"
      "intermediary" => ""
      "log_timestamp" => ""
      "remote_ip" => ""
      "remote_host" => ""
      "x_forwarded_for" => ""
      "server" => ""
      "server_port" => ""
      "user" => ""
      "http_method" => ""
      "url" => ""
      "status" => ""
      "bytes_sent" => ""
      "http_user_agent" => ""
      "http_referrer" => ""
      "response_time" => ""
      "http_content_type" => ""
      "uri_path" => ""
      "uri_query" => ""
      "xff_ips" => ""
      "kv_data" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "\\\[%{HTTPDATE:log_timestamp}\\\], %{GREEDYDATA:kv_data}"
      ]
    }
    overwrite => ["log_timestamp", "kv_data"]
    on_error => "grok_error"
  }
  mutate {
    gsub => ["kv_data", ", ?([A-Za-z0-9_\\s-]+)=", "#$1="]
  }
  kv {
    source => "kv_data"
    field_split => "#"
    value_split => "="
    trim_value => '\"'
  }
  if [log_timestamp] != "" {
    date {
      match => ["log_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "date_error"
    }
  }
  if [remote_ip] not in ["", "-"] {
    grok {
      match => {
        "remote_ip" => "%{IP:remote_ip}"
      }
      overwrite => ["remote_ip"]
      on_error => "remote_ip_error"
    }
    if ![remote_ip_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "remote_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "remote_ip"
        }
        on_error => "principal_ip_error"
      }
      if ![principal_ip_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [remote_host] not in ["", "-"] && [remote_host] != [remote_ip] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{remote_host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{remote_host}"
        "has_principal" => "true"
      }
      on_error => "principal_hostname_error"
    }
  }
  if [x_forwarded_for] not in ["", "-"] {
    mutate {
      gsub => ["x_forwarded_for", " ", ""]
    }
    mutate {
      split => {
        source => "x_forwarded_for"
        separator => ","
        target => "xff_ips"
        on_error => "xff_ips_split_error"
      }
    }
    for index, xffIp in xff_ips {
      mutate {
        merge => {
          "intermediary.ip" => "xffIp"
        }
        on_error => "intermediary_ip_merge_err"
      }
    }
  }
  if [server] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{server}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{server}"
        "has_target" => "true"
      }
      on_error => "target_hostname_error"
    }
  }
  if [server_port] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{server_port}"
      }
      on_error => "target_port_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "target_port_convert_error"
    }
  }
  if [user] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        "has_user" => "true"
      }
      on_error => "principal_user_error"
    }
  }
  if [http_method] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{http_method}"
        "has_http" => "true"
      }
      on_error => "http_method_error"
    }
  }
  if [url] not in ["", "-/"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
      on_error => "target_url_error"
    }
  }
  if [status] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{status}"
        "has_http" => "true"
      }
      on_error => "http_status_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "http_status_convert_error"
    }
  }
  if [bytes_sent] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{bytes_sent}"
      }
      on_error => "sent_bytes_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "sent_bytes_convert_error"
    }
  }
  if [http_user_agent] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{http_user_agent}"
        "has_http" => "true"
      }
      on_error => "user_agent_error"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.parsed_user_agent" => "%{http_user_agent}"
      }
      on_error => "user_agent_invalid"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.parsed_user_agent" => "parseduseragent"
      }
      on_error => "user_agent_convert_error"
    }
  }
  if [http_referrer] not in ["", "-"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{http_referrer}"
        "has_http" => "true"
      }
      on_error => "referral_url_error"
    }
  }
  if [response_time] not in ["", "-"] {
    mutate {
      replace => {
        "response_time_field.key" => "response_time"
        "response_time_field.value.string_value" => "%{response_time}"
      }
      on_error => "response_time_error"
    }
    if ![response_time_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "response_time_field"
        }
        on_error => "response_time_merge_error"
      }
    }
  }
  if [http_content_type] not in ["", "-"] {
    mutate {
      replace => {
        "content_type_field.key" => "http_content_type"
        "content_type_field.value.string_value" => "%{http_content_type}"
      }
      on_error => "content_type_field_error"
    }
    if ![content_type_field_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "content_type_field"
        }
        on_error => "content_type_field_merge_error"
      }
    }
  }
  if [uri_path] not in ["", "-", "/"] {
    mutate {
      replace => {
        "uri_path_field.key" => "uri_path"
        "uri_path_field.value.string_value" => "%{uri_path}"
      }
      on_error => "uri_path_field_error"
    }
    if ![uri_path_field_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "uri_path_field"
        }
        on_error => "uri_path_field_merge_error"
      }
    }
  }
  if [uri_query] not in ["", "-"] {
    mutate {
      replace => {
        "uri_query_field.key" => "uri_query"
        "uri_query_field.value.string_value" => "%{uri_query}"
      }
      on_error => "uri_query_field_error"
    }
    if ![uri_query_field_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "uri_query_field"
        }
        on_error => "uri_query_field_merge_error"
      }
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and [has_http] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "JBOSS WEB"
      "event.idm.read_only_udm.metadata.vendor_name" => "JBOSS WEB"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
