# Product: H3C Switch
# Category: Switches, Routers
# Supported Format: SYSLOG
# Reference: NA
# Last Updated: 2026-01-23
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "ts" => ""
      "year" => ""
      "hostname" => ""
      "desc" => ""
      "event_type" => ""
      "has_principal" => ""
      "principal" => ""
      "metadata" => ""
      "inter_ip" => ""
      "intermediary" => ""
      "prin_ip" => ""
      "prin_port" => ""
      "tar_ip" => ""
      "tar_port" => ""
      "user" => ""
      "tar_user" => ""
      "has_principal_user" => ""
      "has_target_user" => ""
      "has_target" => ""
      "target" => ""
      "User" => ""
      "OperateType" => ""
      "OperateTime" => ""
      "OperateState" => ""
      "OperateEndTime" => ""
      "Line" => ""
      "IPAddr" => ""
      "kv_data" => ""
      "additional" => ""
      "EventIndex" => ""
      "CommandSource" => ""
      "ConfigSource" => ""
      "ConfigDestination" => ""
      "tar_host" => ""
      "timestamp" => "",
      "src_ip" => "",
      "dest_ip" => "",
      "ld_rd" => "",
      "status" => "",
      "diag" => "",
      "interface" => "",
      "sess_type" => "",
      "link_type" => ""
      "product_event_type" => ""
      "device_type" => ""
      "duplicate_ip" => ""
      "severityName" => ""
      "security_result" => ""
      "severity" => ""
      "facilityName" => ""
      "facility" => ""
      "id" => ""
      "dev_ip" => ""
      "program" => ""
      "host" => ""
      "device" => ""
      "observer_asset_id" => ""
      "observer_hostname" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  grok {
    match => {
      "message" => [
        "%{NOTSPACE:hostname} %{NOTSPACE:event_code}: -DevIP=%{IP:dev_ip}-Slot=%{INT}; Duplicate address %{IP:duplicate_ip} on interface %{NOTSPACE:interface}, sourced from %{DATA:id}(?:\\\\\u0000)?\\\",\\\"severity\\\":%{NUMBER:severity:int},\\\"facility\\\":%{NUMBER:facility:int},\\\"host\\\":\\\"%{DATA:host}\\\",\\\"severityName\\\":\\\"%{WORD:severityName}\\\",\\\"facilityName\\\":\\\"%{WORD:facilityName}\\\",\\\"_time\\\":%{NUMBER:timestamp:int},\\\"_raw\\\":\\\"<%{NUMBER:priority}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{DATA:device} %{NOTSPACE:program}: -DevIP=%{IP:dev_ip}-Slot=%{INT}; Duplicate address %{IP:duplicate_ip} on interface %{NOTSPACE:interface}, sourced from %{NOTSPACE:id}(?:\\\\\u0000)?\\\",\\\"DeviceType\\\":\\\"%{WORD:device_type}\\\"}"
        "%{NOTSPACE:hostname} %{NOTSPACE:event_code}: -DevIP=%{IP:dev_ip}; Duplicate address %{IP:duplicate_ip} on interface %{NOTSPACE:interface}, sourced from %{DATA:id}(?:\\\\\u0000)?\\\",\\\"severity\\\":%{NUMBER:severity:int},\\\"facility\\\":%{NUMBER:facility:int},\\\"host\\\":\\\"%{DATA:host}\\\",\\\"severityName\\\":\\\"%{WORD:severityName}\\\",\\\"facilityName\\\":\\\"%{WORD:facilityName}\\\",\\\"_time\\\":%{NUMBER:timestamp:int},\\\"_raw\\\":\\\"<%{NUMBER:priority}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{DATA:device} %{NOTSPACE:program}: -DevIP=%{IP:dev_ip}; Duplicate address %{IP:duplicate_ip} on interface %{NOTSPACE:interface}, sourced from %{NOTSPACE:id}(?:\\\\\u0000)?\\\",\\\"DeviceType\\\":\\\"%{WORD:device_type}\\\"}"
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{YEAR:year} %{DATA:hostname} %{GREEDYDATA:desc}",
        "<%{INT}>%{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %{DATA}/%{INT}/%{DATA:event_type}: -DevIP=%{IP:inter_ip}; -%{GREEDYDATA:kv_data}; %{GREEDYDATA:desc}",
        "<%{INT}>%{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %{DATA}/%{INT}/%{DATA:event_type}: -DevIP=%{IP:inter_ip}; %{GREEDYDATA:desc}",
        "<%{INT}>%{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %{DATA}/%{INT}/%{DATA:event_type}: -DevIP=%{IP:inter_ip}-%{DATA}; %{GREEDYDATA:desc}",
        "^(?:%{INT:pri}>)?%{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %%{DATA}/%{INT}/%{DATA:product_event_type}: %{GREEDYDATA:desc}",
        "^(?:<%{INT:pri}>)?%{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %%{DATA}/%{INT}/%{DATA:product_event_type}: %{GREEDYDATA:desc}"
      ]
    }
    overwrite => ["ts", "year", "hostname", "desc", "inter_ip", "timestamp", "event_type","kv_data", "product_event_type", "pri", "severity", "facility", "host", "severityName", "facilityName", "device", "program", "dev_ip", "duplicate_ip", "interface", "id", "device_type", "syslog_timestamp"]
    on_error => "grok_error"
  }
  if [device] != "" {
    grok {
      match => {
        "device" => "%{INT:observer_asset_id} %{GREEDYDATA:observer_hostname}"
      }
      overwrite => ["observer_asset_id", "observer_hostname"]
      on_error => "device_grok_error"
    }
    if ![device_grok_error] {
      if [observer_asset_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.asset_id" => "H3C:%{observer_asset_id}"
          }
          on_error => "observer_asset_id_error"
        }
      }
      if [observer_hostname] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.hostname" => "%{observer_hostname}"
            "event.idm.read_only_udm.observer.asset.hostname" => "%{observer_hostname}"
          }
          on_error => "observer_hostname_error"
        }
      }
    }
  }
  if [severity] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{severity}"
      }
      on_error => "severity_details_error"
    }
  }
  if [severityName] == "info" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
      on_error => "severity_error"
    }
  }
  if [duplicate_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "duplicate_ip",
        "event.idm.read_only_udm.principal.asset.ip" => "duplicate_ip"
      }
      on_error => "duplicate_ip_empty"
    }
    if ![duplicate_ip_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [facility] != "" {
    mutate {
      replace => {
        "facility_label.value.string_value" => "%{facility}"
      }
      on_error => "facility_label_error"
    }
    if ![facility_label_error] {
      mutate {
        replace => {
          "facility_label.key" => "facility"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "facility_label"
        }
        on_error => "facility_not_found"
      }
    }
  }
  if [facilityName] != "" {
    mutate {
      replace => {
        "facilityName_label.value.string_value" => "%{facilityName}"
      }
      on_error => "facilityName_label_error"
    }
    if ![facilityName_label_error] {
      mutate {
        replace => {
          "facilityName_label.key" => "facilityName"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "facilityName_label"
        }
        on_error => "facilityName_not_found"
      }
    }
  }
  if [id] != "" {
    mutate {
      replace => {
        "id_label.value.string_value" => "%{id}"
      }
      on_error => "id_label_error"
    }
    if ![id_label_error] {
      mutate {
        replace => {
          "id_label.key" => "id"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "id_label"
        }
        on_error => "id_not_found"
      }
    }
  }
  if [dev_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dev_ip",
        "event.idm.read_only_udm.target.asset.ip" => "dev_ip"
      }
      on_error => "dev_ip_empty"
    }
    if ![dev_ip_empty] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [interface] != "" {
    mutate {
      replace => {
        "interface_label.value.string_value" => "%{interface}"
      }
      on_error => "interface_label_error"
    }
    if ![interface_label_error] {
      mutate {
        replace => {
          "interface_label.key" => "interface"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "interface_label"
        }
        on_error => "interface_not_found"
      }
    }
  }
  if [program] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{program}"
      }
      on_error => "program_empty"
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "host_label.value.string_value" => "%{host}"
      }
      on_error => "host_label_error"
    }
    if ![host_label_error] {
      mutate {
        replace => {
          "host_label.key" => "host"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "host_label"
        }
        on_error => "host_not_found"
      }
    }
  }
  if [device_type] != "" {
    mutate {
      replace => {
        "device_type_label.value.string_value" => "%{device_type}"
      }
      on_error => "device_type_label_error"
    }
    if ![device_type_label_error] {
      mutate {
        replace => {
          "device_type_label.key" => "device_type"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "device_type_label"
        }
        on_error => "device_type_not_found"
      }
    }
  }
  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_error"
    }
  }
  mutate {
    replace => {
      "time" => "%{ts} %{year}"
    }
    on_error => "time_error"
  }
  if [time] != "" {
    date {
      match => ["time", "MMM dd HH:mm:ss yyyy"]
      on_error => "date_error"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "yyyy-MM-ddTHH:mm:ss"]
      target => "metadata.event_timestamp"
      on_error => "timestamp_error"
    }
  }
  if [hostname] != "" {
    mutate {
      gsub => ["hostname", "^\\{\\\"message\\\":\\\"", ""]
    }
    mutate {
      replace => {
        "intermediary.hostname" => "%{hostname}"
        "intermediary.asset.hostname" => "%{hostname}"
      }
      on_error => "hostname_error"
    }
  }
  if [inter_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "inter_ip"
        "intermediary.asset.ip" => "inter_ip"
      }
      on_error => "inter_ip_error"
    }
  }
  if [kv_data] != "" {
    kv {
      source => "kv_data"
      value_split => "="
      field_split => "-"
      on_error => "kv_data_error"
    }
  }
  if [Line] != "" {
    mutate {
      replace => {
        "line_label.key" => "Line"
        "line_label.value.string_value" => "%{Line}"
      }
      on_error => "line_error"
    }
    if ![line_error] {
      mutate {
        merge => {
          "additional.fields" => "line_label"
        }
        on_error => "line_merge_error"
      }
    }
  }
  if [IPAddr] != "" {
    mutate {
      merge => {
        "principal.ip" => "IPAddr"
        "principal.asset.ip" => "IPAddr"
      }
      on_error => "ipaddr_error"
    }
    if ![ipaddr_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [User] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{User}"
      }
      on_error => "user_error"
    }
    mutate {
      replace => {
        "has_principal_user" => "true"
      }
    }
  }
  if [OperateType] != "" {
    mutate {
      replace => {
        "operatetype_label.key" => "OperateType"
        "operatetype_label.value.string_value" => "%{OperateType}"
      }
      on_error => "operatetype_error"
    }
    if ![operatetype_error] {
      mutate {
        merge => {
          "additional.fields" => "operatetype_label"
        }
        on_error => "operatetype_merge_error"
      }
    }
  }
  if [OperateTime] != "" {
    mutate {
      replace => {
        "operatetime_label.key" => "OperateTime"
        "operatetime_label.value.string_value" => "%{OperateTime}"
      }
      on_error => "operatetime_error"
    }
    if ![operatetime_error] {
      mutate {
        merge => {
          "additional.fields" => "operatetime_label"
        }
        on_error => "operatetime_merge_error"
      }
    }
  }
  if [OperateState] != "" {
    mutate {
      replace => {
        "operatestate_label.key" => "OperateState"
        "operatestate_label.value.string_value" => "%{OperateState}"
      }
      on_error => "operatestate_error"
    }
    if ![operatestate_error] {
      mutate {
        merge => {
          "additional.fields" => "operatestate_label"
        }
        on_error => "operatestate_merge_error"
      }
    }
  }
  if [OperateEndTime] != "" {
    mutate {
      replace => {
        "operateendtime_label.key" => "OperateEndTime"
        "operateendtime_label.value.string_value" => "%{OperateEndTime}"
      }
      on_error => "operateendtime_error"
    }
    if ![operateendtime_error] {
      mutate {
        merge => {
          "additional.fields" => "operateendtime_label"
        }
        on_error => "operateendtime_merge_error"
      }
    }
  }
  if [EventIndex] != "" {
    mutate {
      convert => {
        "EventIndex" => "string"
      }
      on_error => "eventindex_convert_error"
    }
    mutate {
      replace => {
        "eventindex_label.key" => "EventIndex"
        "eventindex_label.value.string_value" => "%{EventIndex}"
      }
      on_error => "eventindex_error"
    }
    if ![eventindex_error] {
      mutate {
        merge => {
          "additional.fields" => "eventindex_label"
        }
        on_error => "eventindex_merge_error"
      }
    }
  }
  if [CommandSource] != "" {
    mutate {
      replace => {
        "commandsource_label.key" => "CommandSource"
        "commandsource_label.value.string_value" => "%{CommandSource}"
      }
      on_error => "commandsource_error"
    }
    if ![commandsource_error] {
      mutate {
        merge => {
          "additional.fields" => "commandsource_label"
        }
        on_error => "commandsource_merge_error"
      }
    }
  }
  if [ConfigSource] != "" {
    mutate {
      replace => {
        "configsource_label.key" => "ConfigSource"
        "configsource_label.value.string_value" => "%{ConfigSource}"
      }
      on_error => "configsource_error"
    }
    if ![configsource_error] {
      mutate {
        merge => {
          "additional.fields" => "configsource_label"
        }
        on_error => "configsource_merge_error"
      }
    }
  }
  if [ConfigDestination] != "" {
    mutate {
      replace => {
        "configdestination_label.key" => "ConfigDestination"
        "configdestination_label.value.string_value" => "%{ConfigDestination}"
      }
      on_error => "configdestination_error"
    }
    if ![configdestination_error] {
      mutate {
        merge => {
          "additional.fields" => "configdestination_label"
        }
        on_error => "configdestination_merge_error"
      }
    }
  }
  if [desc] != "" {
    grok {
      match => {
        "desc" => [
          "Sess\\[%{IP:src_ip}/%{IP:dest_ip}, LD/RD:%{DATA:ld_rd}, Interface:%{DATA:interface}, SessType:%{DATA:sess_type}, LinkType:%{DATA:link_type}\\], Sta: %{DATA:status}, Diag: %{GREEDYDATA:diag}",
          "%{DATA}/%{INT}/%{DATA:event_type}:%{GREEDYDATA}"
          "%{DATA} timed out for %{IP:prin_ip}"
          "SSH user %{DATA:tar_user} \\(IP: %{IP:prin_ip}\\) %{GREEDYDATA}"
          "SSH client %{IP:prin_ip} %{GREEDYDATA}"
          "Ping %{DATA} %{IP:prin_ip}(:|) %{GREEDYDATA}"
          "%{DATA} server host name %{DATA:tar_host} %{GREEDYDATA}"
          "User %{DATA:tar_user} logged out from %{IP:prin_ip} port %{INT:prin_port}"
          "%{DATA:tar_user} logged (in|out) from %{IP:prin_ip}"
          "%{DATA} ssh %{IP:prin_ip} %{GREEDYDATA}"
          "%{DATA} user %{DATA:tar_user} from %{IP:prin_ip} port %{INT:prin_port} %{GREEDYDATA}"
          "%{DATA} failed %{DATA} SSH server %{IP:tar_ip} port %{INT:tar_port}"
          "%{DATA} changed from %{IP:prin_ip} to %{IP:tar_ip}"
          "SSH %{DATA} %{IP:prin_ip} %{GREEDYDATA}"
        ]
      }
      overwrite => ["event_type", "prin_ip", "tar_ip", "prin_port", "tar_port", "user", "tar_user", "tar_host", "src_ip", "dest_ip", "ld_rd", "interface", "sess_type", "link_type", "status", "diag"]
      on_error => "desc_grok_error"
    }
    if [src_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "src_ip"
          "principal.asset.ip" => "src_ip"
        }
        on_error => "src_ip_error"
      }
      if ![src_ip_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [dest_ip] != "" {
      mutate {
        merge => {
          "target.ip" => "dest_ip"
          "target.asset.ip" => "dest_ip"
        }
        on_error => "dest_ip_error"
      }
      if ![dest_ip_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [interface] != "" {
      mutate {
        replace => {
          "interface_label.key" => "Interface"
          "interface_label.value.string_value" => "%{interface}"
        }
        on_error => "interface_error"
      }
      if ![interface_error] {
        mutate {
          merge => {
            "additional.fields" => "interface_label"
          }
          on_error => "interface_merge_error"
        }
      }
    }
    if [ld_rd] != "" {
      mutate {
        replace => {
          "ld_rd_label.key" => "LD/RD"
          "ld_rd_label.value.string_value" => "%{ld_rd}"
        }
        on_error => "ld_rd_error"
      }
      if ![ld_rd_error] {
        mutate {
          merge => {
            "additional.fields" => "ld_rd_label"
          }
          on_error => "ld_rd_merge_error"
        }
      }
    }
    if [status] != "" {
      mutate {
        replace => {
          "status_label.key" => "Status"
          "status_label.value.string_value" => "%{status}"
        }
        on_error => "status_error"
      }
      if ![status_error] {
        mutate {
          merge => {
            "additional.fields" => "status_label"
          }
          on_error => "status_merge_error"
        }
      }
    }
    if [diag] != "" {
      mutate {
        replace => {
          "diag_label.key" => "Diag"
          "diag_label.value.string_value" => "%{diag}"
        }
        on_error => "diag_error"
      }
      if ![diag_error] {
        mutate {
          merge => {
            "additional.fields" => "diag_label"
          }
          on_error => "diag_merge_error"
        }
      }
    }
    if [sess_type] != "" {
      mutate {
        replace => {
          "sess_type_label.key" => "SessType"
          "sess_type_label.value.string_value" => "%{sess_type}"
        }
        on_error => "sess_type_error"
      }
      if ![sess_type_error] {
        mutate {
          merge => {
            "additional.fields" => "sess_type_label"
          }
          on_error => "sess_type_merge_error"
        }
      }
    }
    if [link_type] != "" {
      mutate {
        replace => {
          "link_type_label.key" => "LinkType"
          "link_type_label.value.string_value" => "%{link_type}"
        }
        on_error => "link_type_error"
      }
      if ![link_type_error] {
        mutate {
          merge => {
            "additional.fields" => "link_type_label"
          }
          on_error => "link_type_merge_error"
        }
      }
    }
    if [prin_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "prin_ip"
          "principal.asset.ip" => "prin_ip"
        }
        on_error => "prin_ip_error"
      }
      if ![prin_ip_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [prin_port] != "" {
      mutate {
        replace => {
          "principal.port" => "%{prin_port}"
        }
        on_error => "prin_port_error"
      }
      mutate {
        convert => {
          "principal.port" => "integer"
        }
        on_error => "prin_port_convert_error"
      }
    }
    if [tar_ip] != "" {
      mutate {
        merge => {
          "target.ip" => "tar_ip"
          "target.asset.ip" => "tar_ip"
        }
        on_error => "tar_ip_error"
      }
      if ![tar_ip_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [tar_host] != "" {
      mutate {
        replace => {
          "target.hostname" => "%{tar_host}"
          "target.asset.hostname" => "%{tar_host}"
        }
        on_error => "tar_host_error"
      }
      if ![tar_host_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [tar_port] != "" {
      mutate {
        replace => {
          "target.port" => "%{tar_port}"
        }
        on_error => "tar_port_error"
      }
      mutate {
        convert => {
          "target.port" => "integer"
        }
        on_error => "tar_port_convert_error"
      }
    }
    if [user] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{user}"
        }
        on_error => "user_error"
      }
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
    if [tar_user] != "" and [tar_user] =~ "^.{0,256}$" {
      mutate {
        replace => {
          "target.user.userid" => "%{tar_user}"
        }
        on_error => "tar_user_error"
      }
      if ![tar_user_error] {
        mutate {
          replace => {
            "has_target_user" => "true"
          }
        }
      }
    }
    if [event_type] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{event_type}"
        }
        on_error => "desc_error"
      }
    }
    mutate {
      replace => {
        "metadata.description" => "%{desc}"
      }
      on_error => "desc_error"
    }
  }
  if [desc] =~ "logged in" and [has_target_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [desc] =~ "logged out" or [desc] =~ "failed" {
    if [has_target_user] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGOUT"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal_user] == "true" or [has_target_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "metadata.product_name" => "Switch"
      "metadata.vendor_name" => "HPE"
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
      on_error => "additional_merge_failed"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "merge_security_result_error"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
