# Product: CrushFTP
# Category: Application server
# Supported Format: SYSLOG+KV
# Reference: N/A
# Last Updated: 2025-01-23
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace =>{
      "event" => ""
      "principal" => ""
      "target" => ""
      "intermediary" => ""
      "network" => ""
      "security_result" => ""
      "additional" => ""
      "metadata" => ""
      "has_principal" => "false"
      "has_target_file" => "false"
      "has_target" => "false"
      "src_host" => ""
      "timestamp" => ""
      "prod_event_type" => ""
      "msg" => ""
      "kv_data" => ""
      "type" => ""
      "protocol" => ""
      "permissions" => ""
      "group" => ""
      "owner" => ""
      "root_dir" => ""
      "url" => ""
      "size" => ""
      "name" => ""
      "privs" => ""
      "sessionid" => ""
      "src_ip" => ""
      "src_port" => ""
      "target_ip" => ""
      "target_port" => ""
      "application" => ""
      "http_method" => ""
      "target_url" => ""
      "http_version" => ""
      "modified" => ""
      "domainname" => ""
      "port" => ""
      "event1" => ""
      "email" => ""
      "Description" => ""
      "exists" => ""
      "Response_code" => ""
      "no_exists" => ""
    }
  }
  mutate {
    gusb => ["msg" , "\\r\\n" , ""]
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:src_host} %{DATA:prod_event_type}\\|%{DATA:timestamp}\\|\\{%{GREEDYDATA:kv_data}\\}",
        "<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:src_host} %{DATA:prod_event_type}\\|%{DATA:timestamp}\\|((\\[%{WORD}:%{DATA}:%{IP:src_ip}:%{INT:src_port}\\]) |(\\[%{WORD}:%{DATA}:%{DATA:application}:%{IP:src_ip}\\] ))?%{GREEDYDATA:msg}",
        "<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:src_host} %{DATA:prod_event_type}\\|%{GREEDYDATA:msg}"
        "<%{INT}>%{SYSLOGTIMESTAMP} %{HOSTNAME:src_host} %{GREEDYDATA:msg}"
      ]
    }
    overwrite => ["src_host","timestamp","prod_event_type","msg","kv_data","src_ip","src_port","application"]
    on_error => "invalid_message"
  }

  if [invalid_message] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [kv_data] != "" {
    kv {
      source => "message"
      field_split => ","
      value_split => "="
      on_error => "invalid_kv"
    }
  }

  if [msg] != "" {
    grok {
      match => {
        "msg" => [
          "Checking session:%{DATA:sessionid} %{GREEDYDATA}"
          "READ: \\*%{DATA:http_method} %{DATA:target_url} %{DATA:http_version}\\*"
          "Accepting connection from: %{IP:target_ip}:%{INT:target_port}"
          "Connection closed from \\/%{IP:target_ip}:%{INT:target_port}"
          "\\^%{DATA:filepath}\\?domain=%{HOSTNAME:domainname}:%{INT:target_port}%{DATA}=%{INT:event},%{DATA:email}:%{DATA}-%{IP:target_ip} %{GREEDYDATA}"
          "%{DATA:url}\\?domain=%{HOSTNAME:domainname}:%{INT:target_port}%{DATA}%{INT:event},%{DATA:email}/%{DATA:Description}\\. %{DATA}=%{WORD:exists}%{DATA}=%{INT:size}"
          "<string>(?<target_url>%{DATA}:%{INT:target_port}%{DATA})</string>"
          "WROTE:\\s+\\*%{INT:Response_code}\\s+%{GREEDYDATA:Description}\\*"
        ]
      }
      overwrite => ["sessionid","target_port","http_method","target_url","http_version","domainname","event","email","Description","exists","size","target_ip","url","Response_code"]
      on_error => "msg_grok_failed"
    }
  }
  if [domainname] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{domainname}"
        "has_target" => "true"
        "target.asset.hostname" => "%{domainname}"
      }
      on_error => "no_domainname"
    }
  }

  if [Description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{Description}"
      }
      on_error => "no_description"
    }
  }

  if [exists] != "" {
    mutate {
      replace => {
        "exists_label.key" => "exists"
        "exists_label.value.string_value" => "%{exists}"
      }
      on_error => "no_exists"
    }
    if ![no_exists] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "exists_label"
        }
        on_error => "no_security_result_detection_fields"
      }
    }
  }

  if [email] =~ "^.+@.+$" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "email"
      }
      on_error => "no_email"
    }
  }

  if [Response_code] != "" {
    mutate {
      convert => {
        "Response_code" => "integer"
      }
      on_error => "no_Response_code"
    }
    mutate {
      rename => {
        "Response_code" => "network.http.response_code"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp","MM/dd/yyyy HH:mm:ss.SSS"]
      on_error => "invalid_timestamp"
    }
  }

  if [src_host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{src_host}"
        "has_principal" => "true"
      }
      on_error => "no_src_host"
    }
  }
  if [prod_event_type] != "" {
    grok {
      match => {
        "prod_event_type" => [
          "%{DATA}\\.log:%{WORD:http_method}"
        ]
      }
      overwrite => ["http_method"]
      on_error => "no_grok_prod_event_type"
    }
    mutate {
      replace => {
        "metadata.product_event_type" => "%{prod_event_type}"
      }
      on_error => "no_prod_event_type"
    }
  }

  if [http_method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{http_method}"
      }
      on_error => "no_http_method"
    }
  }

  if [target_url] != "" {
    mutate {
      replace => {
        "target.url" => "%{target_url}"
      }
      on_error => "no_target_url"
    }
  }

  if [http_version] != "" {
    mutate {
      replace => {
        "http_version_label.value" => "%{http_version}"
        "http_version_label.key" => "http_version"
      }
      on_error => "no_http_version"
    }
    if ![no_http_version] {
      mutate {
        merge => {
          "security_result.detection_fields" => "http_version_label"
        }
        on_error => "no_target_resource_attribute_labels"
      }
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "no_src_ip"
    }
  }

  if [src_port] != "" {
    mutate {
      convert => {
        "src_port" => "integer"
      }
      on_error => "no_src_port"
    }
    mutate {
      rename => {
        "src_port" => "principal.port"
      }
    }
  }

  if [target_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "target_ip"
        "target.asset.ip" => "target_ip"
      }
      on_error => "no_target_ip"
    }
    if ![no_target_ip] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [target_port] != "" {
    mutate {
      convert => {
        "target_port" => "integer"
      }
      on_error => "no_target_port"
    }
    mutate {
      rename => {
        "target_port" => "target.port"
      }
    }
  }



  if [msg] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{msg}"
      }
      on_error => "no_msg"
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{url}"
        "has_target_file" => "true"
      }
      on_error => "no_url"
    }
  }

  if [name] != "" {
    mutate {
      merge => {
        "target.file.names" => "name"
      }
      on_error => "no_name"
    }
  }

  if [size] != "" {
    mutate {
      convert => {
        "size" => "uinteger"
      }
      on_error => "no_size"
    }
    mutate {
      rename => {
        "size" => "target.file.size"
      }
    }
  }

  if [owner] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{owner}"
      }
      on_error => "no_owner"
    }
  }

  if [group] != "" {
    mutate {
      replace => {
        "principal.group.group_display_name" => "%{group}"
      }
      on_error => "no_group"
    }
  }

  if [modified] != "" {
    mutate {
      replace => {
        "modified_label.value" => "%{modified}"
        "modified_label.key" => "modified"
      }
      on_error => "no_modified"
    }
    if ![no_modified] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "modified_label"
        }
        on_error => "no_target_file_metadata_creation_timestamp"
      }
    }
  }

  if [permissions] != "" {
    mutate {
      replace => {
        "permissions_label.value" => "%{permissions}"
        "permissions_label.key" => "permissions"
      }
      on_error => "no_permissions"
    }
    if ![no_permissions] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "permissions_label"
        }
        on_error => "no_target_resource_attribute_labels"
      }
    }
  }

  if [privs] != "" {
    mutate {
      replace => {
        "privs_label.value" => "%{privs}"
        "privs_label.key" => "privs"
      }
      on_error => "no_privs"
    }
    if ![no_privs] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "privs_label"
        }
        on_error => "no_target_resource_attribute_labels"
      }
    }
  }

  if [sessionid] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{sessionid}"
      }
      on_error => "no_sessionid"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "CrushFTP"
      "metadata.product_name" => "CrushFTP"
      "metadata.event_type" => "GENERIC_EVENT"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target_file] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
