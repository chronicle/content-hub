      "subject_src_type" => ""
      "subject.srcEvent.eventName" => ""
      "event_name" => ""
      "DERIVED_FIELDS.CATEGORY" => ""
      "derived_category" => ""
      "DERIVED_FIELDS.SUBCATEGORY" => ""
      "derived_subcategory" => ""
      "subject.srcEvent.event.userIdentity.sessionContext.attributes.creationDate" => ""
      "creation_date" => ""
      "has_user" => "false"
      "subject.dstEvent.gbm_version" => ""
      "dst_gbm_version" => ""
      "subject.dstEvent.is_visible" => ""
      "subject_is_visible" => ""
      "subject.srcEvent.severity" => ""
      "src_event_severity" => ""
      "subject.dstEvent.recipientAccountAlias" => ""
      "dst_recipient_account_alias" => ""
      "subject.srcEvent.api" => ""
      "src_api" => ""
      "subject.srcEvent.calltype" => ""
      "src_calltype" => ""
      "subject.srcEvent.gbm_version" => ""
      "src_gbm_version" => ""
      "subject.srcEvent.is_visible" => ""
      "src_is_visible" => ""
      "subject.dstEvent.severity" => ""
      "dst_event_severity" => ""
      "subject.srcEvent.source" => ""
      "src_source" => ""
      "subject.srcEvent.accountcaller" => ""
      "src_account_caller" => ""
      "subject.dstEvent.region" => ""
      "dst_region" => ""
      "subject.dstEvent.accountcaller" => ""
      "dst_account_caller" => ""
      "subject.dstType" => ""
      "dst_type" => ""
      "subject.dstEvent.service" => ""
      "dst_service" => ""
      "subject.dstEvent.username" => ""
      "dst_username" => ""
      "has_target_user" => "false"
      "event_title" => ""
      "event_description" => ""
      "event_type" => ""
      "event_severity" => ""
      "lacework_account" => ""
      "event_link" => ""
      "rec_id" => ""
      "rec_id_label" => ""
      "event_timestamp" => ""
      "summary_details" => ""
      "target_user_id" => ""
      "resource_product_id" => ""
      "has_principal_user" => "false"
      "has_target_resource" => "false"
      "start_time_label" => ""
      "starttimevalue" => ""
      "intgGuid" => ""
      "endtimevalue" => ""
      "end_time_label" => ""
      "intg_guid_label" => ""
      "user_role" => ""
      "account_name" => ""
      "application" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n\\s+", ""]
  }

  if [message] =~ "MACHINE_TAGS" {
    mutate {
      gsub => ["message", "MACHINE_TAGS", "PROPS_MACHINE.tags"]
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_filter_failed"
  }

  if [json_filter_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [event_title] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{event_title}"
      }
      on_error => "event_title_empty"
    }
  }
  if [event_description] != "" {
    grok {
      match => {
        "event_description" => [
          "%{DATA}account:\\s+%{DATA:resource_product_id}\\s+:%{DATA} user\\s+%{DATA:target_user_id}:%{DATA}\\nSummary:%{GREEDYDATA:summary_details}",
          "%{DATA}account:\\s+%{DATA:resource_product_id}\\s+\\(%{DATA:account_name}\\)\\s+: User\\s+%{DATA:user_role}\\s+%{DATA}service\\s+%{DATA:application}\\s+%{GREEDYDATA}"
        ]
      }
      overwrite => ["summary_details", "target_user_id", "resource_product_id", "account_name", "user_role", "application"]
      on_error => "grok_failed_event_description"
    }
    mutate {
      replace => {
        "security_result.description" => "%{event_description}"
      }
      on_error => "event_description_empty"
    }
  }
  if [summary_details] != "" {
    mutate {
      replace => {
        "security_result.confidence_details" => "%{summary_details}"
      }
      on_error => "summary_details_empty"
    }
  }
  if [target_user_id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{target_user_id}"
      }
      on_error => "target_user_id_empty"
    }
  }
  if [resource_product_id] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{resource_product_id}"
        "has_target_resource" => "true"
      }
      on_error => "resource_product_id_empty"
    }
  }
  if [user_role] != "" {
    mutate {
      replace => {
        "target.user.role_name" => "%{user_role}"
      }
      on_error => "user_role_empty"
    }
  }
  if [account_name] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{account_name}"
        "has_target_resource" => "true"
      }
      on_error => "account_name_empty"
    }
  }
  if [application] != "" {
    mutate {
      replace => {
        "target.application" => "%{application}"
        "has_target_resource" => "true"
      }
      on_error => "application_empty"
    }
  }
  if [event_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{event_id}"
      }
      on_error => "event_id_product_empty"
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{event_type}"
      }
      on_error => "event_type_product_empty"
    }
  }
  if [event_severity] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{event_severity}"
      }
      on_error => "event_severity_empty"
    }
  }
  if [lacework_account] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{lacework_account}"
        "has_principal_user" => "true"
      }
      on_error => "lacework_account_empty"
    }
  }
  if [event_link] != "" {
    grok {
      match => {
        "event_link" =>[
          "%{DATA}startTime=%{DATA:starttimevalue}&endTime=%{DATA:endtimevalue}&intgGuid=%{GREEDYDATA:intgGuid}"
        ]
      }
      overwrite => ["intgGuid", "starttimevalue", "endtimevalue"]
      on_error => "grok_failed_event_link"
    }
    mutate {
      replace => {
        "metadata.url_back_to_product" => "%{event_link}"
      }
      on_error => "event_link_empty"
    }
  }
  if [starttimevalue] != "" {
    mutate {
      replace => {
        "start_time_label.key" => "start_time_value"
        "start_time_label.value.string_value" => "%{starttimevalue}"
      }
      on_error => "starttimevalue_empty"
    }
    if ![starttimevalue_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "start_time_label"
        }
        on_error => "start_time_label_merge_failed"
      }
    }
  }
  if [endtimevalue] != "" {
    mutate {
      replace => {
        "end_time_label.key" => "end_time_value"
        "end_time_label.value.string_value" => "%{endtimevalue}"
      }
      on_error => "endtimevalue_empty"
    }
    if ![endtimevalue_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "end_time_label"
        }
        on_error => "end_time_label_merge_failed"
      }
    }
  }
  if [intgGuid] != "" {
    mutate {
      replace => {
        "intg_guid_label.key" => "intg_guid_value"
        "intg_guid_label.value" => "%{intgGuid}"
      }
      on_error => "intgGuid_empty"
    }
    if ![intgGuid_empty] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "intg_guid_label"
        }
        on_error => "intg_guid_label_merge_failed"
      }
    }
    if ![intg_guid_label_merge_failed] {
      mutate {
        replace => {
          "has_target_resource" => "true"
        }
        on_error => "has_target_resource_guid_failed"
      }
    }
  }
  if [event_source] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{event_source}"
      }
      on_error => "event_source_empty"
    }
  }
  if [rec_id] != "" {
    mutate {
      replace => {
        "rec_id_label.key" => "rec_id_value"
        "rec_id_label.value" => "%{rec_id}"
      }
      on_error => "rec_id_empty"
    }
    if ![rec_id_empty] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "rec_id_label"
        }
        on_error => "rec_id_label_merge_failed"
      }
    }
    if ![rec_id_label_merge_failed] {
      mutate {
        replace => {
          "has_target_resource" => "true"
        }
        on_error => "has_target_resource_rec_id_failed"
      }
    }
  }
  if [event_timestamp] != "" {
    date {
      match => ["event_timestamp", "dd MMM yyyy HH:mm ZZZ"]
      target => "metadata.event_timestamp"
      on_error => "date_failure"
    }
  }
  if [CREATED_TIME] != "" {
    date {
      match => ["CREATED_TIME", "ISO8601"],
      target => "metadata.event_timestamp"
      on_error => "date_failure"
    }
  }

  for factor in IMAGE_RISK_INFO.factors {
    mutate {
      replace => {
        "value_array" => ""
      }
    }
    mutate {
      replace => {
        "value_array.string_value" => "%{factor}"
      }
      on_error => "additional_factor_empty"
    }
    mutate {
      merge => {
        "additional_factor.value.list_value.values" => "value_array"
      }
      on_error => "additional_factor_not_found"
    }
    if ![additional_factor_not_found] {
      mutate {
        replace => {
          "factor_present" => "true"
        }
        on_error => "additional_factor_value_not_found"
      }
    }
  }
  if [factor_present] == "true" {
    mutate {
      replace => {
        "additional_factor.key" => "IMAGE_RISK_INFO factors"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_factor"
      }
      on_error => "additional_factor_field_not_found"
    }
  }


  if [TAGS][Account] != "" {
    mutate {
      replace => {
        "metadata.product_deployment_id" => "%{TAGS.Account}"
      }
      on_error => "TAGS_account_empty"
    }
  }
  if [CVE_PROPS][description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{CVE_PROPS.description}"
      }
      on_error => "description_empty"
    }
  }

  mutate {
    convert => {
      "RISK_SCORE" => "string"
    }
    on_error => "risk_score_conversion_failed"
  }
  if [RISK_SCORE] != "" {
    mutate {
      replace => {
        "security_result.risk_score" => "%{RISK_SCORE}"
      }
      on_error => "risk_score_empty"
    }
    mutate {
      convert => {
        "security_result.risk_score" => "float"
      }
      on_error => "risk_score_conversion_failed"
    }
  }

  mutate {
    uppercase => ["SEVERITY"]
    on_error => "severity_uppercase_failed"
  }
  if [SEVERITY] in ["0", "1", "2", "3", "LOW"] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [SEVERITY] in ["4", "5", "6", "MEDIUM", "SUBSTANTIAL", "INFO"] {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [SEVERITY] in ["7", "8", "HIGH", "SEVERE"] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [SEVERITY] in ["9", "10", "VERY-HIGH", "CRITICAL"] {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }

  if [PROPS_MACHINE][tags][Account] != "" {
    mutate {
      replace => {
        "metadata.product_deployment_id" => "%{PROPS_MACHINE.tags.Account}"
      }
      on_error => "account_empty"
    }
  }
  if [PROPS_MACHINE][Hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{PROPS_MACHINE.Hostname}"
        "principal.asset.hostname" => "%{PROPS_MACHINE.Hostname}"
        "has_principal" => "true"
      }
      on_error => "principal_hostname_empty"
    }
  }
  if [EVAL_CTX][hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{EVAL_CTX.hostname}"
        "principal.asset.hostname" => "%{EVAL_CTX.hostname}"
        "has_principal" => "true"
      }
      on_error => "EVAL_CTX_hostname_empty"
    }
  }
  if [IP_ADDR] not in ["", "NOT_AVAILABLE"] {
    mutate {
      merge => {
        "principal.ip" => "IP_ADDR"
      }
      on_error => "ip_add_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [HOST_IP_ADDR] not in ["", "NOT_AVAILABLE"] {
    mutate {
      merge => {
        "principal.ip" => "HOST_IP_ADDR"
        "principal.asset.ip" => "HOST_IP_ADDR"
      }
      on_error => "HOST_IP_ADDR_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [SRC_ENTITY_ID][ip_addr] not in ["", "NOT_AVAILABLE"] {
    mutate {
      merge => {
        "principal.ip" => "SRC_ENTITY_ID.ip_addr"
        "principal.asset.ip" => "SRC_ENTITY_ID.ip_addr"
      }
      on_error => "HOST_IP_ADDR_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [DNS_SERVER_IP] not in ["", "NOT_AVAILABLE"] {
    mutate {
      merge => {
        "target.ip" => "DNS_SERVER_IP"
        "target.asset.ip" => "DNS_SERVER_IP"
      }
      on_error => "DNS_SERVER_IP_empty"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }
  for endpoint in ENDPOINT_DETAILS {
    mutate {
      merge => {
        "target.ip" => "endpoint.dst_ip_addr"
        "target.asset.ip" => "endpoint.dst_ip_addr"
      }
      on_error => "endpoint_dst_ip_addr_empty"
    }
    if ![endpoint_dst_ip_addr_empty] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
    mutate {
      merge => {
        "principal.ip" => "endpoint.src_ip_addr"
        "principal.asset.ip" => "endpoint.src_ip_addr"
      }
      on_error => "endpoint_src_ip_addr_empty"
    }
    if ![endpoint_src_ip_addr_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
