# Product: Azure Bastion
# Category: Remote Access Tool
# Supported Format: JSON
# Reference: NA
# Last Updated: 2026-11-26
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event" => ""
      "log_time" => ""
      "op_name" => ""
      "op_name_lower" => ""
      "log_category" => ""
      "log_level" => ""
      "log_level_lower" => ""
      "log_location" => ""
      "log_region" => ""
      "cust_sub_id" => ""
      "bastion_res_id" => ""
      "bastion_sub_id" => ""
      "bastion_rg" => ""
      "bastion_name" => ""
      "client_ip" => ""
      "valid_client_ip" => ""
      "client_port" => ""
      "user_email" => ""
      "user_name" => ""
      "target_vm_ip" => ""
      "valid_target_ip" => ""
      "target_res_id" => ""
      "target_sub_id" => ""
      "target_sub_prop" => ""
      "target_rg" => ""
      "target_vmss" => ""
      "target_vm_name" => ""
      "target_res_type" => ""
      "target_res_type_upper" => ""
      "proto_raw" => ""
      "proto_lower" => ""
      "app_protocol_src" => ""
      "app_protocol_output" => ""
      "protocol_number_src" => ""
      "ip_protocol_out" => ""
      "tunnel_id" => ""
      "user_agent" => ""
      "prop_message" => ""
      "prop_message_lower" => ""
      "duration_str" => ""
      "dur_sec" => ""
      "dur_ms" => ""
      "session_start" => ""
      "session_end" => ""
      "intermediary_noun" => ""
      "sec_result" => ""
      "sec_action" => ""
      "sec_category" => ""
      "has_principal" => "false"
      "has_principal_user" => "false"
      "has_target" => "false"
      "has_target_user" => "false"
      "has_intermediary" => "false"
      "has_security_result" => "false"
    }
  }

  json {
    source => "message"
    target => "raw_json"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  # Static metadata
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Microsoft"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Azure Bastion"
    }
  }

  # Timestamp
  mutate {
    replace => {
      "log_time" => "%{raw_json.time}"
    }
    on_error => "log_time_not_found"
  }
  if ![log_time_not_found] and [log_time] != "" {
    date {
      match => ["log_time", "ISO8601", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "log_time_parse_error"
    }
  }

  # Operation name
  mutate {
    replace => {
      "op_name" => "%{raw_json.operationName}"
    }
    on_error => "op_name_not_found"
  }
  if ![op_name_not_found] and [op_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{op_name}"
      }
      on_error => "op_name_replace_error"
    }
    mutate {
      replace => {
        "op_name_lower" => "%{op_name}"
      }
      on_error => "op_name_copy_error"
    }
    if ![op_name_copy_error] {
      mutate {
        lowercase => ["op_name_lower"]
      }
    }
  }

  # Category
  mutate {
    replace => {
      "log_category" => "%{raw_json.category}"
    }
    on_error => "log_category_not_found"
  }
  if ![log_category_not_found] and [log_category] != "" {
    mutate {
      merge => {
        "sec_result.category_details" => "log_category"
      }
      on_error => "category_details_merge_error"
    }
    if ![category_details_merge_error] {
      mutate {
        replace => {
          "has_security_result" => "true"
        }
      }
    }
  }

  # Severity level
  mutate {
    replace => {
      "log_level" => "%{raw_json.level}"
    }
    on_error => "log_level_not_found"
  }
  if ![log_level_not_found] and [log_level] != "" {
    mutate {
      replace => {
        "sec_result.severity_details" => "%{log_level}"
      }
      on_error => "log_level_replace_error"
    }
    if ![log_level_replace_error] {
      mutate {
        replace => {
          "has_security_result" => "true"
        }
      }
    }
    mutate {
      replace => {
        "log_level_lower" => "%{log_level}"
      }
      on_error => "log_level_copy_error"
    }
    if ![log_level_copy_error] {
      mutate {
        lowercase => ["log_level_lower"]
      }
    }
    if [log_level_lower] == "informational" {
      mutate {
        replace => {
          "sec_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [log_level_lower] == "verbose" {
      mutate {
        replace => {
          "sec_result.severity" => "LOW"
        }
      }
    } else if [log_level_lower] == "warning" {
      mutate {
        replace => {
          "sec_result.severity" => "MEDIUM"
        }
      }
    } else if [log_level_lower] == "error" {
      mutate {
        replace => {
          "sec_result.severity" => "ERROR"
        }
      }
    } else if [log_level_lower] == "critical" {
      mutate {
        replace => {
          "sec_result.severity" => "CRITICAL"
        }
      }
    }
  }

  # Bastion host (intermediary) location, region, subscription, and resource ID
  mutate {
    replace => {
      "log_location" => "%{raw_json.location}"
    }
    on_error => "log_location_not_found"
  }
  mutate {
    replace => {
      "log_region" => "%{raw_json.Region}"
    }
    on_error => "log_region_not_found"
  }
  if ![log_location_not_found] and [log_location] != "" {
    mutate {
      replace => {
        "intermediary_noun.location.name" => "%{log_location}"
      }
      on_error => "intermediary_location_replace_error"
    }
    if ![intermediary_location_replace_error] {
      mutate {
        replace => {
          "has_intermediary" => "true"
        }
      }
    }
    if ![log_region_not_found] and [log_region] != "" and [log_region] != [log_location] {
      mutate {
        replace => {
          "region_kv.key" => "region"
          "region_kv.value.string_value" => "%{log_region}"
        }
        on_error => "region_kv_replace_error"
      }
      if ![region_kv_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "region_kv"
          }
          on_error => "region_kv_merge_error"
        }
      }
    }
  } else if ![log_region_not_found] and [log_region] != "" {
    mutate {
      replace => {
        "intermediary_noun.location.name" => "%{log_region}"
      }
      on_error => "intermediary_region_loc_replace_error"
    }
    if ![intermediary_region_loc_replace_error] {
      mutate {
        replace => {
          "has_intermediary" => "true"
        }
      }
    }
  }

  mutate {
    replace => {
      "cust_sub_id" => "%{raw_json.CustomerSubscriptionId}"
    }
    on_error => "cust_sub_id_not_found"
  }
  mutate {
    replace => {
      "bastion_res_id" => "%{raw_json.resourceId}"
    }
    on_error => "bastion_res_id_not_found"
  }
  if ![bastion_res_id_not_found] and [bastion_res_id] != "" {
    mutate {
      replace => {
        "intermediary_noun.resource.product_object_id" => "%{bastion_res_id}"
      }
      on_error => "bastion_res_id_replace_error"
    }
    if ![bastion_res_id_replace_error] {
      mutate {
        replace => {
          "has_intermediary" => "true"
        }
      }
    }
    grok {
      match => {
        "bastion_res_id" => ["(?i)/subscriptions/(?P<bastion_sub_id>[^/]+)"]
      }
      overwrite => ["bastion_sub_id"]
      on_error => "bastion_sub_id_grok_error"
    }
    grok {
      match => {
        "bastion_res_id" => ["(?i)/resourcegroups/(?P<bastion_rg>[^/]+)"]
      }
      overwrite => ["bastion_rg"]
      on_error => "bastion_rg_grok_error"
    }
    grok {
      match => {
        "bastion_res_id" => ["(?i)/bastionhosts/(?P<bastion_name>[^/]+)$"]
      }
      overwrite => ["bastion_name"]
      on_error => "bastion_name_grok_error"
    }
    if [bastion_name] != "" {
      mutate {
        replace => {
          "intermediary_noun.hostname" => "%{bastion_name}"
        }
        on_error => "bastion_name_replace_error"
      }
    }
    if [bastion_rg] != "" {
      mutate {
        replace => {
          "bastion_rg_anc.name" => "%{bastion_rg}"
        }
        on_error => "bastion_rg_anc_replace_error"
      }
      if ![bastion_rg_anc_replace_error] {
        mutate {
          merge => {
            "intermediary_noun.resource_ancestors" => "bastion_rg_anc"
          }
          on_error => "bastion_rg_anc_merge_error"
        }
      }
    }
  }

  if ![cust_sub_id_not_found] and [cust_sub_id] != "" {
    mutate {
      replace => {
        "bastion_sub_anc.product_object_id" => "%{cust_sub_id}"
      }
      on_error => "cust_sub_anc_replace_error"
    }
    if ![cust_sub_anc_replace_error] {
      mutate {
        merge => {
          "intermediary_noun.resource_ancestors" => "bastion_sub_anc"
        }
        on_error => "cust_sub_anc_merge_error"
      }
      if ![cust_sub_anc_merge_error] {
        mutate {
          replace => {
            "has_intermediary" => "true"
          }
        }
      }
    }
  } else if [bastion_sub_id] != "" {
    mutate {
      replace => {
        "bastion_sub_anc.product_object_id" => "%{bastion_sub_id}"
      }
      on_error => "bastion_sub_anc_replace_error"
    }
    if ![bastion_sub_anc_replace_error] {
      mutate {
        merge => {
          "intermediary_noun.resource_ancestors" => "bastion_sub_anc"
        }
        on_error => "bastion_sub_anc_merge_error"
      }
    }
  }

  if [has_intermediary] == "true" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary_noun"
      }
      on_error => "intermediary_merge_error"
    }
  }

  # Principal client IP and port
  mutate {
    replace => {
      "client_ip" => "%{raw_json.properties.clientIpAddress}"
    }
    on_error => "client_ip_not_found"
  }
  if ![client_ip_not_found] and [client_ip] != "" {
    grok {
      match => {
        "client_ip" => ["^(?P<valid_client_ip>%{IP})$"]
      }
      overwrite => ["valid_client_ip"]
      on_error => "client_ip_grok_error"
    }
    if ![client_ip_grok_error] and [valid_client_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "valid_client_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "valid_client_ip"
        }
        on_error => "principal_ip_merge_error"
      }
      if ![principal_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [has_principal] == "true" {
    mutate {
      convert => {
        "raw_json.properties.clientPort" => "string"
      }
      on_error => "client_port_to_string_error"
    }
    if ![client_port_to_string_error] {
      mutate {
        replace => {
          "client_port" => "%{raw_json.properties.clientPort}"
        }
        on_error => "client_port_not_found"
      }
      if ![client_port_not_found] and [client_port] =~ "^[1-9][0-9]*$" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.port" => "%{client_port}"
          }
          on_error => "principal_port_replace_error"
        }
        if ![principal_port_replace_error] {
          mutate {
            convert => {
              "event.idm.read_only_udm.principal.port" => "integer"
            }
            on_error => "principal_port_to_int_error"
          }
        }
      }
    }
  }

  # Principal user (Azure AD operator email)
  mutate {
    replace => {
      "user_email" => "%{raw_json.properties.userEmail}"
    }
    on_error => "user_email_not_found"
  }
  if ![user_email_not_found] and [user_email] != "" {
    if [user_email] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "user_email"
        }
        on_error => "principal_email_merge_error"
      }
      if ![principal_email_merge_error] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{user_email}"
        }
        on_error => "principal_userid_replace_error"
      }
      if ![principal_userid_replace_error] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }
  }

  # Target user (VM login username)
  mutate {
    replace => {
      "user_name" => "%{raw_json.properties.userName}"
    }
    on_error => "user_name_not_found"
  }
  if ![user_name_not_found] and [user_name] != "" {
    if [user_name] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.email_addresses" => "user_name"
        }
        on_error => "target_email_merge_error"
      }
      if ![target_email_merge_error] {
        mutate {
          replace => {
            "has_target_user" => "true"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{user_name}"
        }
        on_error => "target_userid_replace_error"
      }
      if ![target_userid_replace_error] {
        mutate {
          replace => {
            "has_target_user" => "true"
          }
        }
      }
    }
  }

  # Target VM IP
  mutate {
    replace => {
      "target_vm_ip" => "%{raw_json.properties.targetVMIPAddress}"
    }
    on_error => "target_vm_ip_not_found"
  }
  if ![target_vm_ip_not_found] and [target_vm_ip] != "" {
    grok {
      match => {
        "target_vm_ip" => ["^(?P<valid_target_ip>%{IP})$"]
      }
      overwrite => ["valid_target_ip"]
      on_error => "target_ip_grok_error"
    }
    if ![target_ip_grok_error] and [valid_target_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "valid_target_ip"
          "event.idm.read_only_udm.target.asset.ip" => "valid_target_ip"
        }
        on_error => "target_ip_merge_error"
      }
      if ![target_ip_merge_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  # Target resource ID, type, VMSS/VM name, resource group, and subscription
  mutate {
    replace => {
      "target_res_type" => "%{raw_json.properties.resourceType}"
    }
    on_error => "target_res_type_not_found"
  }
  if ![target_res_type_not_found] and [target_res_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{target_res_type}"
      }
      on_error => "target_res_subtype_replace_error"
    }
    mutate {
      replace => {
        "target_res_type_upper" => "%{target_res_type}"
      }
      on_error => "target_res_type_copy_error"
    }
    if ![target_res_type_copy_error] {
      mutate {
        uppercase => ["target_res_type_upper"]
      }
    }
    if [target_res_type_upper] in ["VM", "VMSS", "BSL"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.resource_type" => "VIRTUAL_MACHINE"
        }
      }
    }
  }

  mutate {
    replace => {
      "target_sub_prop" => "%{raw_json.properties.subscriptionId}"
    }
    on_error => "target_sub_prop_not_found"
  }
  mutate {
    replace => {
      "target_res_id" => "%{raw_json.properties.targetResourceId}"
    }
    on_error => "target_res_id_not_found"
  }
  if ![target_res_id_not_found] and [target_res_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{target_res_id}"
      }
      on_error => "target_res_id_replace_error"
    }
    grok {
      match => {
        "target_res_id" => ["(?i)/subscriptions/(?P<target_sub_id>[^/]+)"]
      }
      overwrite => ["target_sub_id"]
      on_error => "target_sub_id_grok_error"
    }
    grok {
      match => {
        "target_res_id" => ["(?i)/resourcegroups/(?P<target_rg>[^/]+)"]
      }
      overwrite => ["target_rg"]
      on_error => "target_rg_grok_error"
    }
    if [target_res_id] =~ "(?i)/virtualmachinescalesets/" {
      grok {
        match => {
          "target_res_id" => ["(?i)/virtualmachinescalesets/(?P<target_vmss>[^/]+)"]
        }
        overwrite => ["target_vmss"]
        on_error => "target_vmss_grok_error"
      }
    }
    grok {
      match => {
        "target_res_id" => ["(?i)/virtualmachines/(?P<target_vm_name>[^/]+)$"]
      }
      overwrite => ["target_vm_name"]
      on_error => "target_vm_name_grok_error"
    }
    if [target_vmss] != "" {
      if [target_vm_name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.name" => "%{target_vmss}/%{target_vm_name}"
          }
          on_error => "target_vmss_inst_replace_error"
        }
        mutate {
          replace => {
            "vmss_inst_label.key" => "vmss_instance_id"
            "vmss_inst_label.value" => "%{target_vm_name}"
          }
          on_error => "vmss_inst_label_replace_error"
        }
        if ![vmss_inst_label_replace_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "vmss_inst_label"
            }
            on_error => "vmss_inst_label_merge_error"
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.name" => "%{target_vmss}"
          }
          on_error => "target_vmss_name_replace_error"
        }
      }
      mutate {
        replace => {
          "vmss_anc.name" => "%{target_vmss}"
        }
        on_error => "target_vmss_anc_replace_error"
      }
      if ![target_vmss_anc_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource_ancestors" => "vmss_anc"
          }
          on_error => "vmss_anc_merge_error"
        }
      }
    } else if [target_vm_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{target_vm_name}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{target_vm_name}"
        }
        on_error => "target_vm_hostname_replace_error"
      }
      if ![target_vm_hostname_replace_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [target_rg] != "" {
      mutate {
        replace => {
          "target_rg_anc.name" => "%{target_rg}"
        }
        on_error => "target_rg_anc_replace_error"
      }
      if ![target_rg_anc_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource_ancestors" => "target_rg_anc"
          }
          on_error => "target_rg_anc_merge_error"
        }
      }
    }
  }

  if ![target_sub_prop_not_found] and [target_sub_prop] != "" {
    mutate {
      replace => {
        "target_sub_anc.product_object_id" => "%{target_sub_prop}"
      }
      on_error => "target_sub_prop_anc_replace_error"
    }
    if ![target_sub_prop_anc_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource_ancestors" => "target_sub_anc"
        }
        on_error => "target_sub_prop_anc_merge_error"
      }
    }
  } else if [target_sub_id] != "" {
    mutate {
      replace => {
        "target_sub_anc.product_object_id" => "%{target_sub_id}"
      }
      on_error => "target_sub_id_anc_replace_error"
    }
    if ![target_sub_id_anc_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource_ancestors" => "target_sub_anc"
        }
        on_error => "target_sub_id_anc_merge_error"
      }
    }
  }

  # Protocol and tunnel/session ID
  mutate {
    replace => {
      "proto_raw" => "%{raw_json.properties.protocol}"
    }
    on_error => "proto_not_found"
  }
  if ![proto_not_found] and [proto_raw] != "" {
    mutate {
      replace => {
        "proto_lower" => "%{proto_raw}"
      }
      on_error => "proto_copy_error"
    }
    if ![proto_copy_error] {
      mutate {
        lowercase => ["proto_lower"]
      }
    }
    if [proto_lower] == "nativerdp" {
      mutate {
        replace => {
          "app_protocol_src" => "RDP"
        }
      }
    } else {
      mutate {
        replace => {
          "app_protocol_src" => "%{proto_raw}"
        }
        on_error => "app_protocol_src_replace_error"
      }
    }
    if [app_protocol_src] != "" {
      # This file contains application protocol parsing logic

      # Interface:
      # app_protocol_src (required): string that contains application protocol or a
      #                              port number
      # app_protocol_output: string that is either empty or contains application
      #                      protocol compatible to ApplicationProtocol enum in
      #                      udm.proto

      mutate {
        uppercase => [ "app_protocol_src" ]
      }

      if [app_protocol_src] in [ "22", "SSH", "SSHD" ] {
        mutate {
          replace => {
            "app_protocol_output" => "SSH"
          }
        }
      }
      else if [app_protocol_src] in [ "25", "SMTP" ] {
        mutate {
          replace => {
            "app_protocol_output" => "SMTP"
          }
        }
      }
      else if [app_protocol_src] in [ "53", "DNS" ] {
        mutate {
          replace => {
            "app_protocol_output" => "DNS"
          }
        }
      }
      else if [app_protocol_src] in [ "80", "8080", "HTTP" ] {
        mutate {
          replace => {
            "app_protocol_output" => "HTTP"
          }
        }
      }
      else if [app_protocol_src] in [ "443", "HTTPS", "TLS" ] {
        mutate {
          replace => {
            "app_protocol_output" => "HTTPS"
          }
        }
      }
      else if [app_protocol_src] in [ "7400", "7401", "7402", "DDS" ] {
        mutate {
          replace => {
            "app_protocol_output" => "DDS"
          }
        }
      }
      else if [app_protocol_src] in [ "SMB", "SMBV1" ] {
        mutate {
          replace => {
            "app_protocol_output" => "SMB"
          }
        }
      }
      else if [app_protocol_src] in [
        "UNKNOWN_APPLICATION_PROTOCOL", "AFP", "APPC", "AMQP", "ATOM", "BEEP",
        "BITCOIN", "BIT_TORRENT", "CFDP", "COAP", "DEVICE_NET", "DHCP", "E_DONKEY",
        "ENRP", "FAST_TRACK", "FINGER", "FREENET", "FTAM", "GOPHER", "HL7", "H323",
        "IRCP", "KADEMLIA", "LDAP", "LPD", "MIME", "MODBUS", "MQTT", "NETCONF",
        "NFS", "NIS", "NNTP", "NTCIP", "NTP", "OSCAR", "PNRP", "QUIC", "RDP", "RELP",
        "RIP", "RLOGIN", "RPC", "RTMP", "RTP", "RTPS", "RTSP", "SAP", "SDP", "SIP",
        "SLP", "SNTP", "SSMS", "STYX", "TCAP", "TDS", "TOR", "TSP", "VTP", "WHOIS",
        "WEB_DAV", "X400", "X500", "XMPP", "IEC104", "DCERPC"
      ] {
        mutate {
          replace => {
            "app_protocol_output" => "%{app_protocol_src}"
          }
          on_error => "app_protocol_output_replace_error"
        }
      } else {
        mutate {
          replace => {
            "app_protocol_output" => ""
          }
        }
      }
    }
    if [app_protocol_output] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "%{app_protocol_output}"
        }
        on_error => "app_protocol_replace_error"
      }
    } else {
      mutate {
        replace => {
          "protocol_number_src" => "%{proto_raw}"
        }
        on_error => "ip_protocol_src_replace_error"
      }
      if ![ip_protocol_src_replace_error] and [protocol_number_src] != "" {
        mutate {
          uppercase => ["protocol_number_src"]
        }
        # This file contains the ip protocol convertor
        # Document:
        #   - https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml

        # Interface:
        # protocol_number_src (required): number with the value which represents the protocol
        # ip_protocol_out: string that is either empty or contains ip protocol
        #                  compatible to IpProtocol enum in udm.proto

        mutate {
          replace => {
            "ip_protocol_out" => "UNKNOWN_IP_PROTOCOL"
          }
        }

        if [protocol_number_src] in [ 1, "ICMP", "ICMPV6", 58 ] {
          mutate {
            replace => {
              "ip_protocol_out" => "ICMP"
            }
          }
        } else if [protocol_number_src] in [ 2, "IGMP" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "IGMP"
            }
          }
        } else if [protocol_number_src] in [ 6, "TCP" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "TCP"
            }
          }
        } else if [protocol_number_src] in [ 17, "UDP" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "UDP"
            }
          }
        } else if [protocol_number_src] in [ 41, "IP6IN4" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "IP6IN4"
            }
          }
        } else if [protocol_number_src] in [ 47, "GRE" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "GRE"
            }
          }
        } else if [protocol_number_src] in [ 50, "ESP" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "ESP"
            }
          }
        } else if [protocol_number_src] in [ 88, "EIGRP" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "EIGRP"
            }
          }
        } else if [protocol_number_src] in [ 97, "ETHERIP" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "ETHERIP"
            }
          }
        } else if [protocol_number_src] in [ 103, "PIM" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "PIM"
            }
          }
        } else if [protocol_number_src] in [ 112, "VRRP" ] {
          mutate {
            replace => {
              "ip_protocol_out" => "VRRP"
            }
          }
        }
      }
      if [ip_protocol_out] != "" and [ip_protocol_out] != "UNKNOWN_IP_PROTOCOL" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.ip_protocol" => "%{ip_protocol_out}"
          }
          on_error => "ip_protocol_replace_error"
        }
      } else {
        mutate {
          replace => {
            "proto_kv.key" => "protocol"
            "proto_kv.value.string_value" => "%{proto_raw}"
          }
          on_error => "proto_kv_replace_error"
        }
        if ![proto_kv_replace_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "proto_kv"
            }
            on_error => "proto_kv_merge_error"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "tunnel_id" => "%{raw_json.properties.tunnelId}"
    }
    on_error => "tunnel_id_not_found"
  }
  if ![tunnel_id_not_found] and [tunnel_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{tunnel_id}"
      }
      on_error => "tunnel_id_replace_error"
    }
  }

  # User agent
  mutate {
    replace => {
      "user_agent" => "%{raw_json.properties.userAgent}"
    }
    on_error => "user_agent_not_found"
  }
  if ![user_agent_not_found] and [user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{user_agent}"
      }
      on_error => "user_agent_replace_error"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.parsed_user_agent" => "%{user_agent}"
      }
      on_error => "parsed_ua_replace_error"
    }
    if ![parsed_ua_replace_error] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.http.parsed_user_agent" => "parseduseragent"
        }
        on_error => "parsed_ua_convert_error"
      }
    }
  }

  # Session duration (milliseconds -> seconds + nanos)
  mutate {
    convert => {
      "raw_json.properties.duration" => "string"
    }
    on_error => "duration_to_string_error"
  }
  if ![duration_to_string_error] {
    mutate {
      replace => {
        "duration_str" => "%{raw_json.properties.duration}"
      }
      on_error => "duration_not_found"
    }
    if ![duration_not_found] and [duration_str] =~ "^[0-9]+$" {
      if [duration_str] != "0" {
        if [duration_str] =~ "^[0-9][0-9][0-9][0-9]+$" {
          grok {
            match => {
              "duration_str" => ["^(?P<dur_sec>[0-9]+)(?P<dur_ms>[0-9]{3})$"]
            }
            overwrite => ["dur_sec", "dur_ms"]
            on_error => "duration_grok_error"
          }
          if ![duration_grok_error] {
            mutate {
              replace => {
                "event.idm.read_only_udm.network.session_duration.seconds" => "%{dur_sec}"
              }
              on_error => "dur_sec_replace_error"
            }
            if ![dur_sec_replace_error] {
              mutate {
                convert => {
                  "event.idm.read_only_udm.network.session_duration.seconds" => "integer"
                }
                on_error => "dur_sec_int_error"
              }
            }
            if [dur_ms] != "000" {
              mutate {
                convert => {
                  "dur_ms" => "millitonanos"
                }
                on_error => "dur_ms_nano_error"
              }
              if ![dur_ms_nano_error] {
                mutate {
                  convert => {
                    "dur_ms" => "string"
                  }
                  on_error => "dur_ms_to_string_error"
                }
                if ![dur_ms_to_string_error] {
                  mutate {
                    replace => {
                      "event.idm.read_only_udm.network.session_duration.nanos" => "%{dur_ms}"
                    }
                    on_error => "dur_ms_replace_error"
                  }
                  if ![dur_ms_replace_error] {
                    mutate {
                      convert => {
                        "event.idm.read_only_udm.network.session_duration.nanos" => "integer"
                      }
                      on_error => "dur_ms_int_error"
                    }
                  }
                }
              }
            }
          }
        } else {
          mutate {
            convert => {
              "duration_str" => "millitonanos"
            }
            on_error => "dur_subsec_nano_error"
          }
          if ![dur_subsec_nano_error] {
            mutate {
              convert => {
                "duration_str" => "string"
              }
              on_error => "dur_subsec_to_string_error"
            }
            if ![dur_subsec_to_string_error] {
              mutate {
                replace => {
                  "event.idm.read_only_udm.network.session_duration.nanos" => "%{duration_str}"
                }
                on_error => "dur_subsec_replace_error"
              }
              if ![dur_subsec_replace_error] {
                mutate {
                  convert => {
                    "event.idm.read_only_udm.network.session_duration.nanos" => "integer"
                  }
                  on_error => "dur_subsec_int_error"
                }
              }
            }
          }
        }
      }
    }
  }

  # Session start and end timestamps
  mutate {
    replace => {
      "session_start" => "%{raw_json.properties.sessionStartTime}"
    }
    on_error => "session_start_not_found"
  }
  if ![session_start_not_found] and [session_start] != "" {
    mutate {
      replace => {
        "session_start_kv.key" => "session_start_time"
        "session_start_kv.value.string_value" => "%{session_start}"
      }
      on_error => "session_start_kv_replace_error"
    }
    if ![session_start_kv_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "session_start_kv"
        }
        on_error => "session_start_kv_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "session_end" => "%{raw_json.properties.sessionEndTime}"
    }
    on_error => "session_end_not_found"
  }
  if ![session_end_not_found] and [session_end] != "" {
    mutate {
      replace => {
        "session_end_kv.key" => "session_end_time"
        "session_end_kv.value.string_value" => "%{session_end}"
      }
      on_error => "session_end_kv_replace_error"
    }
    if ![session_end_kv_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "session_end_kv"
        }
        on_error => "session_end_kv_merge_error"
      }
    }
  }

  # Message, security action/category, auth outcome, and UDM event_type
  mutate {
    replace => {
      "prop_message" => "%{raw_json.properties.message}"
    }
    on_error => "prop_message_not_found"
  }
  if ![prop_message_not_found] and [prop_message] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{prop_message}"
      }
      on_error => "prop_message_replace_error"
    }
    mutate {
      replace => {
        "prop_message_lower" => "%{prop_message}"
      }
      on_error => "prop_message_copy_error"
    }
    if ![prop_message_copy_error] {
      mutate {
        lowercase => ["prop_message_lower"]
      }
    }
  }

  if [prop_message_lower] =~ "login failed" {
    mutate {
      replace => {
        "sec_action" => "BLOCK"
      }
    }
    mutate {
      replace => {
        "sec_category" => "AUTH_VIOLATION"
      }
    }
    mutate {
      replace => {
        "has_security_result" => "true"
      }
    }
    if [has_target] == "true" and ([has_principal] == "true" or [has_principal_user] == "true" or [has_target_user] == "true") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.outcome" => "FAILURE"
        }
      }
    } else if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  } else if [prop_message_lower] =~ "connection failed" {
    mutate {
      replace => {
        "sec_action" => "FAIL"
      }
    }
    mutate {
      replace => {
        "has_security_result" => "true"
      }
    }
    if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [has_target] == "true" and ([has_principal_user] == "true" or [has_target_user] == "true") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.outcome" => "FAILURE"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  } else if [op_name_lower] =~ "/connect$" {
    if [prop_message_lower] =~ "success" {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
      mutate {
        replace => {
          "has_security_result" => "true"
        }
      }
    }
    if [proto_lower] == "tcptunnel" and [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [has_target] == "true" and ([has_principal] == "true" or [has_principal_user] == "true" or [has_target_user] == "true") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
      if [prop_message_lower] =~ "success" {
        mutate {
          replace => {
            "event.idm.read_only_udm.extensions.auth.outcome" => "SUCCESS"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  } else if [op_name_lower] =~ "/disconnect$" {
    if [prop_message_lower] =~ "success" {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
      mutate {
        replace => {
          "has_security_result" => "true"
        }
      }
    }
    if [proto_lower] == "tcptunnel" and [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [has_target] == "true" and ([has_principal] == "true" or [has_principal_user] == "true" or [has_target_user] == "true") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
      if [prop_message_lower] =~ "success" {
        mutate {
          replace => {
            "event.idm.read_only_udm.extensions.auth.outcome" => "SUCCESS"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  } else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [sec_action] != "" {
    mutate {
      merge => {
        "sec_result.action" => "sec_action"
      }
      on_error => "sec_action_merge_error"
    }
  }

  if [sec_category] != "" {
    mutate {
      merge => {
        "sec_result.category" => "sec_category"
      }
      on_error => "sec_category_merge_error"
    }
  }

  if [has_security_result] == "true" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
      on_error => "security_result_merge_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
    on_error => "output_merge_error"
  }
}
