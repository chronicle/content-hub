# Product: AliCloud Firewall
# Category: Firewall
# Supported Format: JSON, SYSLOG + KV
# Reference: N/A
# Last Updated: 2026-09-21
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "facility" => ""
      "priority" => ""
      "hostname" => ""
      "syslog_priority" => ""
      "syslog_version" => ""
      "syslog_timestamp" => ""
      "intermediary_host" => ""
      "kv_data" => ""
      "__topic__" => ""
      "__source__" => ""
      "log_type" => ""
      "src_ip" => ""
      "dst_ip" => ""
      "src_port" => ""
      "dst_port" => ""
      "ip_protocol" => ""
      "new_conn" => ""
      "direction" => ""
      "domain" => ""
      "acl_rule_id" => ""
      "rule_result" => ""
      "rule_source" => ""
      "in_packet_bytes" => ""
      "in_packet_count" => ""
      "out_packet_bytes" => ""
      "out_packet_count" => ""
      "total_packet_bytes" => ""
      "total_packet_count" => ""
      "start_time" => ""
      "end_time" => ""
      "aliuid" => ""
      "region_id" => ""
      "tcp_seq" => ""
      "start_time_min" => ""
      "url" => ""
      "app_name" => ""
      "app_dpi_state" => ""
      "loose_allow_acl_id" => ""
      "ips_rule_id" => ""
      "vul_level" => ""
      "total_pps" => ""
      "total_bps" => ""
      "in_pps" => ""
      "in_bps" => ""
      "out_pps" => ""
      "out_bps" => ""
      "city_id" => ""
      "country_id" => ""
      "member_uid" => ""
      "l4_protocol" => ""
      "l7_protocol" => ""
      "net_connect_dir" => ""
      "traffic_type" => ""
      "protocol_number_src" => ""
      "ip_protocol_out" => ""
      "app_protocol_src" => ""
      "app_protocol_output" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "intermediary" => ""
      "security_result" => ""
      "security_result_action" => ""
      "action" => ""
      "has_user" => "false"
      "ip_protocol_mapped" => "false"
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", ""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_error"
  }

  grok {
    match => {
      "message" => [
        "^<%{INT:syslog_priority}>%{INT:syslog_version}\\s+%{TIMESTAMP_ISO8601:syslog_timestamp}\\s+%{HOSTNAME:intermediary_host}\\s+-\\s+-\\s+-\\s+%{GREEDYDATA:kv_data}$"
      ]
    }
    overwrite => ["syslog_priority", "syslog_version", "syslog_timestamp", "intermediary_host", "kv_data"]
    on_error => "syslog_grok_failure"
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "\\|\\|", "#"]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "kv_data_extract_error"
    }
  }

  if [syslog_timestamp] != "" {
    date {
      match => ["syslog_timestamp", "yyyy-MM-ddTHH:mm:ss", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "syslog_timestamp_date_error"
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{hostname}"
        "event.idm.read_only_udm.observer.asset.hostname" => "%{hostname}"
      }
      on_error => "observer_hostname_replace_error"
    }
  }

  if [intermediary_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_host}"
        "intermediary.asset.hostname" => "%{intermediary_host}"
      }
      on_error => "intermediary_host_replace_error"
    }
    if ![intermediary_host_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
        on_error => "intermediary_host_merge_error"
      }
    }
  }

  if [src_ip] != "" {
    grok {
      match => {
        "src_ip" => ["%{IP:src_ip}"]
      }
      overwrite => ["src_ip"]
      on_error => "src_ip_grok_error"
    }
    if ![src_ip_grok_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
        }
        on_error => "principal_ip_merge_error"
      }
      if ![principal_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [src_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
      on_error => "src_port_replace_error"
    }
    if ![src_port_replace_error] {
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
        on_error => "src_port_convert_error"
      }
    }
  }

  if [aliuid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{aliuid}"
        "has_user" => "true"
      }
      on_error => "aliuid_replace_error"
    }
  }

  if [region_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.name" => "%{region_id}"
      }
      on_error => "region_id_replace_error"
    }
  }

  if [country_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{country_id}"
      }
      on_error => "country_id_replace_error"
    }
  }

  if [city_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.city" => "%{city_id}"
      }
      on_error => "city_id_replace_error"
    }
  }

  if [dst_ip] != "" {
    grok {
      match => {
        "dst_ip" => ["%{IP:dst_ip}"]
      }
      overwrite => ["dst_ip"]
      on_error => "dst_ip_grok_error"
    }
    if ![dst_ip_grok_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dst_ip"
          "event.idm.read_only_udm.target.asset.ip" => "dst_ip"
        }
        on_error => "target_ip_merge_error"
      }
      if ![target_ip_merge_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  if [dst_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dst_port}"
      }
      on_error => "dst_port_replace_error"
    }
    if ![dst_port_replace_error] {
      mutate {
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
        on_error => "dst_port_convert_error"
      }
    }
  }

  if [domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{domain}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{domain}"
        "has_target" => "true"
      }
      on_error => "domain_replace_error"
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
      on_error => "url_replace_error"
    }
  }

  if [app_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{app_name}"
      }
      on_error => "app_name_replace_error"
    }
  }

  if [ip_protocol] != "" {
    mutate {
      replace => {
        "protocol_number_src" => "%{ip_protocol}"
        "ip_protocol_out" => ""
      }
      on_error => "ip_protocol_src_replace_error"
    }
    mutate {
      uppercase => ["protocol_number_src"]
      on_error => "ip_protocol_uppercase_error"
    }
    if ![ip_protocol_src_replace_error] {
      # This file contains the ip protocol convertor
# Document:
#   - https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml

# Interface:
# protocol_number_src (required): number with the value which represents the protocol
# ip_protocol_out: string that is either empty or contains ip protocol
#                  compatible to IpProtocol enum in udm.proto

mutate {
  replace => {
    "ip_protocol_out" => "UNKNOWN_IP_PROTOCOL"
  }
}


if [protocol_number_src] in [ 1, "ICMP", "ICMPV6", 58 ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ICMP"
    }
  }
} else if [protocol_number_src] in [ 2, "IGMP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "IGMP"
    }
  }
} else if [protocol_number_src] in [ 6, "TCP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "TCP"
    }
  }
} else if [protocol_number_src] in [ 17, "UDP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "UDP"
    }
  }
} else if [protocol_number_src] in [ 41, "IP6IN4" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "IP6IN4"
    }
  }
} else if [protocol_number_src] in [ 47, "GRE" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "GRE"
    }
  }
} else if [protocol_number_src] in [ 50, "ESP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ESP"
    }
  }
} else if [protocol_number_src] in [ 88, "EIGRP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "EIGRP"
    }
  }
}  else if [protocol_number_src] in [ 97, "ETHERIP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ETHERIP"
    }
  }
} else if [protocol_number_src] in [ 103, "PIM" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "PIM"
    }
  }
} else if [protocol_number_src] in [ 112, "VRRP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "VRRP"
    }
  }
}

      if [ip_protocol_out] not in ["", "UNKNOWN_IP_PROTOCOL"] {
        mutate {
          rename => {
            "ip_protocol_out" => "event.idm.read_only_udm.network.ip_protocol"
          }
          on_error => "ip_protocol_out_rename_error"
        }
      } else {
        mutate {
          rename => {
            "ip_protocol" => "addition.ip_protocol"
          }
          on_error => "ip_protocol_addition_rename_error"
        }
      }
    }
  } else if [l4_protocol] != "" {
    mutate {
      replace => {
        "protocol_number_src" => "%{l4_protocol}"
        "ip_protocol_out" => ""
      }
      on_error => "l4_protocol_src_replace_error"
    }
    mutate {
      uppercase => ["protocol_number_src"]
      on_error => "l4_protocol_uppercase_error"
    }
    if ![l4_protocol_src_replace_error] {
      # This file contains the ip protocol convertor
# Document:
#   - https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml

# Interface:
# protocol_number_src (required): number with the value which represents the protocol
# ip_protocol_out: string that is either empty or contains ip protocol
#                  compatible to IpProtocol enum in udm.proto

mutate {
  replace => {
    "ip_protocol_out" => "UNKNOWN_IP_PROTOCOL"
  }
}


if [protocol_number_src] in [ 1, "ICMP", "ICMPV6", 58 ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ICMP"
    }
  }
} else if [protocol_number_src] in [ 2, "IGMP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "IGMP"
    }
  }
} else if [protocol_number_src] in [ 6, "TCP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "TCP"
    }
  }
} else if [protocol_number_src] in [ 17, "UDP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "UDP"
    }
  }
} else if [protocol_number_src] in [ 41, "IP6IN4" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "IP6IN4"
    }
  }
} else if [protocol_number_src] in [ 47, "GRE" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "GRE"
    }
  }
} else if [protocol_number_src] in [ 50, "ESP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ESP"
    }
  }
} else if [protocol_number_src] in [ 88, "EIGRP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "EIGRP"
    }
  }
}  else if [protocol_number_src] in [ 97, "ETHERIP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "ETHERIP"
    }
  }
} else if [protocol_number_src] in [ 103, "PIM" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "PIM"
    }
  }
} else if [protocol_number_src] in [ 112, "VRRP" ] {
  mutate {
    replace => {
      "ip_protocol_out" => "VRRP"
    }
  }
}

      if [ip_protocol_out] not in ["", "UNKNOWN_IP_PROTOCOL"] {
        mutate {
          rename => {
            "ip_protocol_out" => "event.idm.read_only_udm.network.ip_protocol"
          }
          on_error => "l4_protocol_out_rename_error"
        }
        mutate {
          replace => {
            "ip_protocol_mapped" => "true"
          }
        }
      }
    }
  }
  if [ip_protocol_mapped] == "false" and [l4_protocol] != "" {
    mutate {
      rename => {
        "l4_protocol" => "addition.l4_protocol"
      }
    }
  }

  if [l7_protocol] != "" {
    mutate {
      replace => {
        "app_protocol_src" => "%{l7_protocol}"
      }
      on_error => "l7_protocol_src_replace_error"
    }
    if ![l7_protocol_src_replace_error] {
      # This file contains application protocol parsing logic

# Interface:
# app_protocol_src (required): string that contains application protocol or a
#                              port number
# app_protocol_output: string that is either empty or contains application
#                      protocol compatible to ApplicationProtocol enum in
#                      udm.proto

mutate {
  uppercase => [ "app_protocol_src" ]
}

if [app_protocol_src] in [ "22", "SSH", "SSHD" ] {
  mutate {
    replace => {
      "app_protocol_output" => "SSH"
    }
  }
}
else if [app_protocol_src] in [ "25", "SMTP" ] {
  mutate {
    replace => {
      "app_protocol_output" => "SMTP"
    }
  }
}
else if [app_protocol_src] in [ "53", "DNS" ] {
  mutate {
    replace => {
      "app_protocol_output" => "DNS"
    }
  }
}
else if [app_protocol_src] in [ "80", "8080", "HTTP" ] {
  mutate {
    replace => {
      "app_protocol_output" => "HTTP"
    }
  }
}
else if [app_protocol_src] in [ "443", "HTTPS", "TLS" ] {
  mutate {
    replace => {
      "app_protocol_output" => "HTTPS"
    }
  }
}
else if [app_protocol_src] in [ "7400", "7401", "7402", "DDS" ] {
  mutate {
    replace => {
      "app_protocol_output" => "DDS"
    }
  }
}
else if [app_protocol_src] in [ "SMB", "SMBV1" ] {
  mutate {
    replace => {
      "app_protocol_output" => "SMB"
    }
  }
}
else if [app_protocol_src] in [
  "UNKNOWN_APPLICATION_PROTOCOL", "AFP", "APPC", "AMQP", "ATOM", "BEEP",
  "BITCOIN", "BIT_TORRENT", "CFDP", "COAP", "DEVICE_NET", "DHCP", "E_DONKEY",
  "ENRP", "FAST_TRACK", "FINGER", "FREENET", "FTAM", "GOPHER", "HL7", "H323",
  "IRCP", "KADEMLIA", "LDAP", "LPD", "MIME", "MODBUS", "MQTT", "NETCONF",
  "NFS", "NIS", "NNTP", "NTCIP", "NTP", "OSCAR", "PNRP", "QUIC", "RDP", "RELP",
  "RIP", "RLOGIN", "RPC", "RTMP", "RTP", "RTPS", "RTSP", "SAP", "SDP", "SIP",
  "SLP", "SNTP", "SSMS", "STYX", "TCAP", "TDS", "TOR", "TSP", "VTP", "WHOIS",
  "WEB_DAV", "X400", "X500", "XMPP", "IEC104", "DCERPC"
] {
  mutate {
    replace => {
      "app_protocol_output" => "%{app_protocol_src}"
    }
  }

} else {
  mutate {
    replace => {
      "app_protocol_output" => ""
    }
  }
}

      if [app_protocol_output] != "" {
        mutate {
          rename => {
            "app_protocol_output" => "event.idm.read_only_udm.network.application_protocol"
          }
          on_error => "app_protocol_output_rename_error"
        }
      } else {
        mutate {
          rename => {
            "l7_protocol" => "addition.l7_protocol"
          }
          on_error => "l7_protocol_addition_rename_error"
        }
      }
    }
  }

  if [direction] != "" {
    if [direction] in ["in", "IN", "inbound", "INBOUND"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.direction" => "INBOUND"
        }
      }
    } else if [direction] in ["out", "OUT", "outbound", "OUTBOUND"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.direction" => "OUTBOUND"
        }
      }
    }
  }

  if [in_packet_bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{in_packet_bytes}"
      }
      on_error => "in_packet_bytes_replace_error"
    }
    if ![in_packet_bytes_replace_error] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.received_bytes" => "uinteger"
        }
        on_error => "in_packet_bytes_convert_error"
      }
    }
  }

  if [in_packet_count] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_packets" => "%{in_packet_count}"
      }
      on_error => "in_packet_count_replace_error"
    }
    if ![in_packet_count_replace_error] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.received_packets" => "integer"
        }
        on_error => "in_packet_count_convert_error"
      }
    }
  }

  if [out_packet_bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{out_packet_bytes}"
      }
      on_error => "out_packet_bytes_replace_error"
    }
    if ![out_packet_bytes_replace_error] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
        }
        on_error => "out_packet_bytes_convert_error"
      }
    }
  }

  if [out_packet_count] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_packets" => "%{out_packet_count}"
      }
      on_error => "out_packet_count_replace_error"
    }
    if ![out_packet_count_replace_error] {
      mutate {
        convert => {
          "event.idm.read_only_udm.network.sent_packets" => "integer"
        }
        on_error => "out_packet_count_convert_error"
      }
    }
  }

  if [acl_rule_id] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{acl_rule_id}"
      }
      on_error => "acl_rule_id_replace_error"
    }
  }

  if [rule_source] != "" {
    mutate {
      replace => {
        "security_result.rule_type" => "%{rule_source}"
      }
      on_error => "rule_source_replace_error"
    }
  }

  if [rule_result] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{rule_result}"
      }
      lowercase => ["rule_result"]
      on_error => "rule_result_replace_error"
    }

    if [rule_result] in ["pass", "allow"] {
      mutate {
        replace => {
          "action" => "ALLOW"
          "security_result.alert_state" => "NOT_ALERTING"
        }
      }
    } else if [rule_result] == "alert" {
      mutate {
        replace => {
          "action" => "ALLOW"
          "security_result.alert_state" => "ALERTING"
        }
      }
    } else if [rule_result] in ["drop", "block", "deny", "reject"] {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    }

    if [action] != "" {
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "security_result_action_merge_error"
      }
    }
  }

  if [vul_level] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{vul_level}"
      }
      on_error => "vul_level_replace_error"
    }
    if [vul_level] == "0" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [vul_level] == "1" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    } else if [vul_level] == "2" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    } else if [vul_level] == "3" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    } else if [vul_level] == "4" {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
      }
    }
  }

  if [app_dpi_state] != "" {
    mutate {
      replace => {
        "app_dpi_state_df.key" => "app_dpi_state"
        "app_dpi_state_df.value" => "%{app_dpi_state}"
      }
      on_error => "app_dpi_state_df_replace_error"
    }
    if ![app_dpi_state_df_replace_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "app_dpi_state_df"
        }
        on_error => "app_dpi_state_df_merge_error"
      }
    }
  }

  if [loose_allow_acl_id] != "" {
    mutate {
      replace => {
        "loose_allow_acl_id_df.key" => "loose_allow_acl_id"
        "loose_allow_acl_id_df.value" => "%{loose_allow_acl_id}"
      }
      on_error => "loose_allow_acl_id_df_replace_error"
    }
    if ![loose_allow_acl_id_df_replace_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "loose_allow_acl_id_df"
        }
        on_error => "loose_allow_acl_id_df_merge_error"
      }
    }
  }

  if [ips_rule_id] != "" {
    mutate {
      replace => {
        "ips_rule_id_df.key" => "ips_rule_id"
        "ips_rule_id_df.value" => "%{ips_rule_id}"
      }
      on_error => "ips_rule_id_df_replace_error"
    }
    if ![ips_rule_id_df_replace_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ips_rule_id_df"
        }
        on_error => "ips_rule_id_df_merge_error"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_error"
    }
  }

  mutate {
    rename => {
      "facility" => "addition.facility"
      "priority" => "addition.priority"
      "syslog_priority" => "addition.syslog_priority"
      "syslog_version" => "addition.syslog_version"
      "__source__" => "addition.__source__"
      "new_conn" => "addition.new_conn"
      "total_packet_bytes" => "addition.total_packet_bytes"
      "total_packet_count" => "addition.total_packet_count"
      "start_time" => "addition.start_time"
      "end_time" => "addition.end_time"
      "start_time_min" => "addition.start_time_min"
      "tcp_seq" => "addition.tcp_seq"
      "total_pps" => "addition.total_pps"
      "total_bps" => "addition.total_bps"
      "in_pps" => "addition.in_pps"
      "in_bps" => "addition.in_bps"
      "out_pps" => "addition.out_pps"
      "out_bps" => "addition.out_bps"
      "member_uid" => "addition.member_uid"
      "net_connect_dir" => "addition.net_connect_dir"
      "traffic_type" => "addition.traffic_type"
    }
    on_error => "addition_rename_error"
  }

  for key, value in addition map {
    mutate {
      replace => {
        "additional_label" => ""
        "label_value_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "additional_value_convert_error"
    }
    mutate {
      replace => {
        "label_value_check" => "%{value}"
      }
      on_error => "additional_value_check_error"
    }
    if ![additional_value_check_error] and [label_value_check] != "" {
      mutate {
        replace => {
          "additional_label.key" => "%{key}"
          "additional_label.value.string_value" => "%{value}"
        }
        on_error => "additional_label_replace_error"
      }
      if ![additional_label_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "additional_label"
          }
          on_error => "additional_label_merge_error"
        }
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Alibaba Cloud"
      "event.idm.read_only_udm.metadata.product_name" => "AliCloud Firewall"
      "event.idm.read_only_udm.metadata.log_type" => "ALICLOUD_FIREWALL"
    }
  }

  if [__topic__] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{__topic__}"
      }
      on_error => "metadata_product_event_type_replace_error"
    }
  }

  if [log_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{log_type}"
      }
      on_error => "metadata_description_replace_error"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
