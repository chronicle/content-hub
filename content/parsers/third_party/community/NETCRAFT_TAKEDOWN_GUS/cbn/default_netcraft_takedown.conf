      }
      on_error => "threat_id_replace_failed"
    }
  }

  mutate {
    convert => {
      "managed" => "string"
    }
    on_error => "managed_convert_failed"
  }

  if [managed] != "" {
    if [managed] == "true" {
      mutate {
        replace => {
          "managed_label.key" => "managed_takedown"
          "managed_label.value" => "%{managed}"
        }
        on_error => "managed_label_prep_failed"
      }
      if ![managed_label_prep_failed] {
        mutate {
          merge => {
            "sec_result.detection_fields" => "managed_label"
          }
          on_error => "managed_label_merge_failed"
        }
      }
      if [site_risk_rating] == "" {
        mutate {
          replace => {
            "sec_result.severity" => "HIGH"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "sec_result.alert_state" => "NOT_ALERTING"
        }
      }
      if [site_risk_rating] == "" {
        mutate {
          replace => {
            "sec_result.severity" => "LOW"
          }
        }
      }
    }
  }

  mutate {
    convert => {
      "group_id" => "string"
    }
    on_error => "group_id_cast_failed"
  }

  if [group_id] != "" {
    mutate {
