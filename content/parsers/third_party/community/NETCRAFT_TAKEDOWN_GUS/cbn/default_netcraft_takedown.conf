# Product: NETCRAFT TAKEDOWN
# Category: Security
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-10-22
# Copyright 2026 Google SecOps


filter {
  mutate {
    replace => {
      "event_id" => ""
      "change_type" => ""
      "id" => ""
      "group_id" => ""
      "attack_url" => ""
      "ip" => ""
      "country_code" => ""
      "date_submitted" => ""
      "date" => ""
      "region" => ""
      "target_brand" => ""
      "authgiven" => ""
      "host" => ""
      "registrar" => ""
      "customer_label" => ""
      "date_authed" => ""
      "date_first_actioned" => ""
      "domain" => ""
      "language" => ""
      "attack_type" => ""
      "status" => ""
      "hostname" => ""
      "reporter" => ""
      "report_source" => ""
      "fwd_owner" => ""
      "rev_owner" => ""
      "reverse_dns" => ""
      "whois_server" => ""
      "first_resolved" => ""
      "final_resolved" => ""
      "first_outage" => ""
      "final_outage" => ""
      "status_change_uptime" => ""
      "targeted_url" => ""
      "managed" => ""
      "date_escalated" => ""
      "change" => ""
      "tags" => ""
      "service_type" => ""
      "domain_attack" => ""
      "hostname_attack" => ""
      "site_risk_rating" => ""
      "domain_risk_rating" => ""
      "deceptive_domain_score" => ""
      "sub_first_outage_ts" => ""
      "sub_first_outage_secs" => ""
      "sub_final_outage_ts" => ""
      "sub_final_outage_secs" => ""
      "sub_availability_secs" => ""
      "auth_first_outage_ts" => ""
      "auth_first_outage_secs" => ""
      "auth_final_outage_ts" => ""
      "auth_final_outage_secs" => ""
      "auth_availability_secs" => ""
      "esc_first_outage_ts" => ""
      "esc_first_outage_secs" => ""
      "esc_final_outage_ts" => ""
      "esc_final_outage_secs" => ""
      "esc_availability_secs" => ""
      "has_target" => "false"
      "has_principal" => "false"
      "has_about" => "false"
      "valid_ip" => ""
      "has_target_user" => "false"
      "sec_result" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parsing_failed"
  }

  if [json_parsing_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [date] != "" {
    date {
      match => ["date", "RFC3339", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "date_parsing_failed"
    }
  }

  mutate {
    convert => {
      "event_id" => "string"
    }
    on_error => "convert_event_id_failed"
  }

  if [event_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{event_id}"
      }
      on_error => "event_id_mapping_failed"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "NETCRAFT"
      "event.idm.read_only_udm.metadata.product_name" => "NETCRAFT TAKEDOWN"
    }
  }

  if [reporter] != "" {
    mutate {
      replace => {
        "reporter_label.key" => "reporter"
        "reporter_label.value" => "%{reporter}"
      }
      on_error => "reporter_prep_failed"
    }

    if ![reporter_prep_failed] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "reporter_label"
        }
        on_error => "reporter_merge_failed"
      }
    }
  }

  if [report_source] != "" {
    mutate {
      replace => {
        "sec_result.threat_feed_name" => "%{report_source}"
      }
      on_error => "report_source_prep_failed"
    }
  }

  if [attack_type] != "" {
    mutate {
     replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{attack_type}"
     }
     on_error => "attack_type_mapping_failed"
    }
  }

  if [attack_url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{attack_url}"
      }
      on_error => "attack_url_mapping_failed"
    }
  }
  if [ip] != "" {
    grok {
      match => {
        "ip" => "%{IP:valid_ip}"
      }
      overwrite => ["valid_ip"]
      on_error => "ip_invalid"
    }

    if ![ip_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "valid_ip"
          "event.idm.read_only_udm.target.asset.ip" => "valid_ip"
        }
        on_error => "ip_mapping_failed"
      }
      if ![ip_mapping_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
          on_error => "has_target_mapping_failed"
        }
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{hostname}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{hostname}"
        "has_target" => "true"

      }
      on_error => "hostname_mapping_failed"
    }
  }

  if [domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.domain.name" => "%{domain}"
        }
        on_error => "domain_mapping_failed"
    }
  }

  if [registrar] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.domain.registrar" => "%{registrar}"
      }
      on_error => "registrar_mapping_failed"
    }
  }

  if [whois_server] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.domain.whois_server" => "%{whois_server}"
      }
      on_error => "whois_server_mapping_failed"
    }
  }

  if [country_code] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{country_code}"
      }
      on_error => "country_code_mapping_failed"
    }
  }

  if [reverse_dns] != "" {
    mutate {
      replace => {
        "dns_answer.data" => "%{reverse_dns}"
      }
      on_error => "reverse_dns_prep_failed"
    }
    if ![reverse_dns_prep_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.network.dns.answers" => "dns_answer"
        }
        on_error => "reverse_dns_merge_failed"
      }
    }
  }

  if [status] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{status}"
      }
      on_error => "status_mapping_failed"
    }
    if [status] in ["Verified", "Unverified", "Contacted Hosting"] {
      mutate {
        replace => {
          "sec_result.threat_status" => "ACTIVE"
        }
      }
    } else if [status] in ["Resolved", "Resolved (Monitoring)", "Inactive (Monitoring)", "Stale"] {
      mutate {
        replace => {
          "sec_result.threat_status" => "CLEARED"
        }
      }
    } else if [status] == "Invalid" {
      mutate {
        replace => {
          "sec_result.threat_status" => "FALSE_POSITIVE"
        }
      }
    }
  }

  if [change] != "" {
    mutate {
      replace => {
        "change_label.key" => "change"
        "change_label.value" => "%{change}"
      }
      on_error => "change_prep_failed"
    }

    if ![change_prep_failed] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "change_label"
        }
        on_error => "change_merge_failed"
      }
    }
  }

  if [attack_type] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{attack_type}"
      }
      on_error => "attack_summary_mapping_failed"
    }
    if [attack_type] == "phishing_url" {
      mutate {
        replace => {
          "sec_category" => "PHISHING"
        }
      }
    }
    else if [attack_type] == "malware_c2" {
      mutate {
        replace => {
          "sec_category" => "NETWORK_COMMAND_AND_CONTROL"
        }
      }
    } else {
      mutate {
        replace => {
          "sec_category" => "SOCIAL_ENGINEERING"
        }
      }
    }

    if [sec_category] != "" {
      mutate {
        merge => {
          "sec_result.category" => "sec_category"
        }
        on_error => "sec_category_merge_failed"
      }
    }
  }

  if [target_brand] != "" {
    mutate {
      replace => {
        "about_noun.resource.name" => "%{target_brand}"
        "has_about" => "true"
      }
      on_error => "target_brand_prep_failed"
    }
  }

  mutate {
    replace => {
      "sub_first_outage_ts" => "%{timings.since_submission.first_outage.timestamp}"
