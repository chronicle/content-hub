  mutate {
    convert => {
      "site_risk_rating" => "string"
    }
    on_error => "site_risk_rating_cast_failed"
  }

  if [site_risk_rating] != "" {
    mutate {
      replace => {
        "sec_result.risk_score" => "%{site_risk_rating}"
      }
      on_error => "site_risk_prep_failed"
    }
    mutate {
      convert => {
        "sec_result.risk_score" => "float"
      }
      on_error => "site_risk_float_failed"
    }
    if [site_risk_rating] == "0" {
      mutate {
        replace => {
          "sec_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [site_risk_rating] in ["1", "2", "3"] {
      mutate {
        replace => {
          "sec_result.severity" => "LOW"
        }
      }
    } else if [site_risk_rating] in ["4", "5", "6"] {
      mutate {
        replace => {
          "sec_result.severity" => "MEDIUM"
        }
      }
    } else if [site_risk_rating] in ["7", "8"] {
      mutate {
        replace => {
          "sec_result.severity" => "HIGH"
        }
      }
    } else if [site_risk_rating] in ["9", "10"] {
      mutate {
        replace => {
          "sec_result.severity" => "CRITICAL"
        }
      }
    } else {
      mutate {
        replace => {
          "sec_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }
  }

  mutate {
    convert => {
      "domain_risk_rating" => "string"
    }
    on_error => "domain_risk_rating_cast_failed"
  }

  if [domain_risk_rating] != "" {
    mutate {
      replace => {
        "domain_risk_label.key" => "domain_risk_rating"
        "domain_risk_label.value" => "%{domain_risk_rating}"
      }
      on_error => "domain_risk_prep_failed"
    }

    if ![domain_risk_prep_failed] {
      mutate {
        merge => {
          "sec_result.detection_fields" => "domain_risk_label"
        }
        on_error => "domain_risk_merge_failed"
      }
    }
  }

  mutate {
    convert => {
      "deceptive_domain_score" => "string"
    }
    on_error => "deceptive_domain_score_cast_failed"
  }

  if [deceptive_domain_score] != "" {
    mutate {
      replace => {
        "sec_result.confidence_score" => "%{deceptive_domain_score}"
      }
      on_error => "deceptive_score_prep_failed"
    }

    if ![deceptive_score_prep_failed] {
      mutate {
        convert => {
          "sec_result.confidence_score" => "float"
        }
        on_error => "deceptive_score_float_failed"
      }
      if [deceptive_score_float_failed] {
        mutate {
          remove_field => ["sec_result.confidence_score"]
        }
      }
    }
  }

  if [fwd_owner] != "" {
