      replace => {
        "about_noun.url" => "%{targeted_url}"
        "has_about" => "true"
      }
      on_error => "targeted_url_prep_failed"
    }
  }

  if [has_about] == "true" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about_noun"
      }
      on_error => "about_noun_merge_failed"
    }
