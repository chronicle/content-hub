        "language_label.key" => "site_language"
        "language_label.value" => "%{language}"
      }
      on_error => "language_prep_failed"
    }
    if ![language_prep_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.attribute.labels" => "language_label"
        }
        on_error => "language_merge_failed"
      }
    }
  }

  if [region] != "" {
