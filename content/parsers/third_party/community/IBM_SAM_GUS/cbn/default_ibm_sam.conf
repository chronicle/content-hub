# Product: IBM_SAM
# Category: WAF
# Supported Format: SYSLOG
# Reference : https://www.ibm.com/docs/en/sva/9.0.2?topic=diagnostics-viewing-application-log-files, https://www.ibm.com/docs/en/sva/10.0.7?topic=logging-customizing-http-request-log
# Last Updated: 2026-07-22
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "intermediary" => ""
      "timestamp" => ""
      "dvc_ip" => ""
      "dvc_host" => ""
      "pid" => ""
      "dst_ip" => ""
      "sent_bytes" => ""
      "url" => ""
      "response_code" => ""
      "ts" => ""
      "proto" => ""
      "src_ip" => ""
      "rcv_bytes" => ""
      "method" => ""
      "request_id" => ""
      "version" => ""
      "url1" => ""
      "ip_address" => ""
      "src_host" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "src_application" => ""
      "severity" => ""
      "product_event_type" => ""
      "connection_type" => ""
      "file_name" => ""
      "src_resource" => ""
      "description" => ""
      "has_http" => "false"
      "security_result" => ""
      "user_name" => ""
      "src_port" => ""
      "target_hostname" => ""
      "ts2" => ""
      "method_value" => ""
      "sha256_value" => ""
      "ip_protocol_value" => ""
      "time_stamp" => ""
      "rev" => ""
      "blade" => ""
      "instance" => ""
      "component" => ""
      "principal_user" => ""
      "event_id" => ""
      "domain" => ""
      "resource" => ""
      "desc" => ""
      "clean_url" => ""
      "json_data" => ""
      "GS_CREATE_HOLD_ZPLANT" => ""
      "session_id" => ""
      "user_location" => ""
      "location" => ""
      "auth" => ""
      "name_in_rgy" => ""
      "authntype" => ""
      "action" => ""
      "status" => ""
      "outcome" => ""
      "component_rev" => ""
      "user_location_type" => ""
      "syslog_version" => ""
    }
  }

  grok {
    match => {
      "message" => "(?s)(?P<json_data>{.*})"
    }
    overwrite => ["json_data"]
    on_error => "no_raw_json"
  }
  if [json_data] != "" {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "not_valid_json"
    }
    if ![not_valid_json] {
      if [GS_CREATE_HOLD] != "" {
        if [GS_CREATE_HOLD][ZPLANT] != "" {
          mutate {
            replace => {
              "GS_CREATE_HOLD_ZPLANT" => "%{GS_CREATE_HOLD.ZPLANT}"
            }
            on_error => "no_GS_CREATE_HOLD_ZPLANT_replace"
          }
        }
      }
    }
  }
  mutate {
    gsub => ["message" , "\\r\\n" , ""]
  }
  mutate {
    gsub => ["message" , "\\n" , ""]
  }
  mutate {
    gsub => ["message" , "\\t" , ""]
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_host} %{DATA:src_host}(\\[%{INT:pid}\\])? - %{GREEDYDATA:ip_address} - - %{DATA:sent_bytes} %{DATA:rcv_bytes} %{DATA:src_ip} %{DATA:proto}\\/%{DATA:version} - %{HTTPDATE:timestamp} %{DATA:request_id} %{DATA:response_code} %{DATA:method} %{GREEDYDATA:url} HTTP\\/%{DATA:version}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_host} %{DATA:src_host}(\\[%{INT:pid}\\])? - %{GREEDYDATA:ip_address} %{IP:dst_ip} (-)?(\\s)?%{DATA:sent_bytes} %{DATA:rcv_bytes} %{DATA:src_ip} %{DATA:proto}\\/%{DATA:version} - %{HTTPDATE:timestamp} %{DATA:request_id} %{DATA:response_code} %{DATA:method} %{GREEDYDATA:url} %{GREEDYDATA:url1} HTTP\\/%{DATA:version}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_host} %{DATA:src_host}(\\[%{INT:pid}\\])? - %{GREEDYDATA:ip_address} %{IP:dst_ip} (-)?(\\s)?%{DATA:sent_bytes} %{DATA:rcv_bytes} %{DATA:src_ip} %{DATA:proto}\\/%{DATA:version} - %{HTTPDATE:timestamp} %{DATA:request_id} %{DATA:response_code} %{DATA:method} %{GREEDYDATA:url} (HTTP\\/%{DATA:version})?",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA:dvc_host}(\\[%{INT:pid}\\])? - %{GREEDYDATA:ip_address} - - %{DATA:sent_bytes} %{DATA:rcv_bytes} %{DATA:src_ip} %{DATA:proto}\\/%{DATA:version} - %{HTTPDATE:timestamp} %{DATA:request_id} %{DATA:response_code} %{DATA:method} %{GREEDYDATA:url} HTTP\\/%{DATA:version}",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA:dvc_host}(\\[%{INT:pid}\\])? - %{GREEDYDATA:ip_address} %{IP:dst_ip} (-)?(\\s)?%{DATA:sent_bytes} %{DATA:rcv_bytes} %{DATA:src_ip} %{DATA:proto}\\/%{DATA:version} - %{HTTPDATE:timestamp} %{DATA:request_id} %{DATA:response_code} %{DATA:method} %{GREEDYDATA:url} %{GREEDYDATA:url1} HTTP\\/%{DATA:version}",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA:dvc_host}(\\[%{INT:pid}\\])? - %{GREEDYDATA:ip_address} %{IP:dst_ip} (-)?(\\s)?%{DATA:sent_bytes} %{DATA:rcv_bytes} %{DATA:src_ip} %{DATA:proto}\\/%{DATA:version} - %{HTTPDATE:timestamp} %{DATA:request_id} %{DATA:response_code} %{DATA:method} %{GREEDYDATA:url} HTTP\\/%{DATA:version}",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA:dvc_host}(\\[%{INT:pid}\\])? - %{GREEDYDATA:ip_address} %{IP:dst_ip} (-)?(\\s)?%{DATA:sent_bytes} %{DATA:rcv_bytes} %{DATA:src_ip} %{DATA:proto}\\/%{DATA:version} - %{HTTPDATE:timestamp} %{DATA:request_id} %{DATA:response_code} %{DATA:method} %{GREEDYDATA:url}",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts2} %{DATA:dvc_host} %{DATA:src_host} (%{INT:src_port})? - - %{IP:src_ip} - %{DATA:user_name} %{HTTPDATE:timestamp}\\\"%{DATA:method} %{URI:url} (?P<proto>HTTP)\\/%{DATA:version}\\\" (%{INT:response_code}|-) (%{INT:sent_bytes}|-) (%{INT:rcv_bytes}|-)",
        "<%{INT}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:ts2} %{DATA:dvc_host} %{DATA:src_host} (%{INT:src_port})? - - %{IP:src_ip} - %{DATA:user_name} %{HTTPDATE:timestamp}(\\s)?\\\"%{DATA:method} (?P<url>[\\s\\S]+?) (?P<proto>HTTP)\\/%{DATA:version}\\\" (%{INT:response_code}|-) (%{INT:sent_bytes}|-) (%{INT:rcv_bytes}|-)",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts2} %{DATA:dvc_host} %{DATA:src_host} (%{INT:src_port})? - - %{DATA:timestamp}----- %{DATA} (?P<product_event_type>webseald) %{WORD:severity} %{DATA:src_application} %{DATA:connection_type} %{DATA:file_name} %{INT:pid} %{DATA} -- %{DATA:src_resource}(\\s+)%{GREEDYDATA:description}",
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts2} %{DATA:dvc_host} %{DATA:src_host} (%{INT:src_port})? %{DATA} %{DATA} %{IP:src_ip} %{DATA} %{DATA:user_name} %{HTTPDATE:timestamp} \\\"%{DATA:method} %{URI:url} (?P<proto>HTTP)\\/%{DATA:version}\\\" (%{INT:response_code}|-) (%{INT:sent_bytes}|-) (%{INT:rcv_bytes}|-)",
        '%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} %{TIMESTAMP_ISO8601} %{DATA:src_host} %{DATA:product_event_type} - - - %{IP:src_ip} (%{GREEDYDATA:ip_address}, %{DATA:dst_ip}|%{DATA:dst_ip}) - %{DATA:user_name} %{DATA} (\\"%{DATA:method}|"%{DATA:method}) %{DATA:url} (HTTP|HTTPS)\\/(%{DATA:version}\\"|%{DATA:version}") %{DATA:response_code} %{DATA:rcv_bytes} %{DATA:sent_bytes} %{DATA} (\\/%{GREEDYDATA:machine}|%{GREEDYDATA})',
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} %{TIMESTAMP_ISO8601} %{DATA:src_host} %{DATA:product_event_type} - - - %{DATA}----- %{DATA:pid} %{DATA} %{DATA:severity} %{DATA} %{DATA:proto} %{DATA:src_application} %{DATA:sent_bytes} %{DATA} -- %{DATA:src_resource}\\s+%{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} %{TIMESTAMP_ISO8601} %{DATA:src_host} %{DATA:product_event_type} - - - %{DATA} %{DATA}\\[%{DATA:pid}\\]:.* %{IP:src_ip} %{DATA} %{DATA:src_port} %{DATA}: %{DATA} %{DATA}:%{GREEDYDATA:sha256_value}",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} %{TIMESTAMP_ISO8601} %{DATA:src_host} %{DATA:product_event_type} - - - %{DATA} %{DATA}\\[%{DATA:pid}\\]: %{GREEDYDATA:description}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} %{SYSLOGTIMESTAMP} %{DATA}\\[%{DATA:pid}\\]:.* %{IP:src_ip} %{DATA} %{DATA:src_port} %{DATA}: %{DATA} %{DATA}:%{GREEDYDATA:sha256_value}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} %{SYSLOGTIMESTAMP} %{DATA}\\[%{DATA:pid}\\]: %{GREEDYDATA:description}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} %{DATA}----- %{DATA:pid} %{DATA} %{DATA:severity} %{DATA} %{DATA} %{DATA:src_application} %{DATA:sent_bytes} %{DATA} -- %{DATA:src_resource}\\s+%{GREEDYDATA:description}",
        '%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} %{TIMESTAMP_ISO8601} %{DATA:src_host} %{DATA:product_event_type} - - - %{DATA:src_ip} (%{GREEDYDATA:ip_address}, %{DATA:dst_ip}|%{DATA:dst_ip}) - %{DATA:user_name} %{DATA} (\\"%{DATA:method}|"%{DATA:method}) %{DATA:url} (HTTP|HTTPS)\\/(%{DATA:version}\\"|%{DATA:version}") %{DATA:response_code} %{DATA:rcv_bytes} %{GREEDYDATA:sent_bytes}',
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA:dvc_host}\\[%{DATA}\\]: %{DATA:description}: <%{DATA}>%{SYSLOGTIMESTAMP} %{DATA:src_host} %{DATA:product_event_type} %{SYSLOGTIMESTAMP} %{DATA}\\[%{DATA:pid}\\]:.* %{IP:src_ip} %{DATA} %{DATA:src_port} %{DATA}: %{DATA}:%{GREEDYDATA:sha256_value}",
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} <%{DATA}>%{SYSLOGTIMESTAMP} %{DATA:src_host} %{DATA:product_event_type} %{SYSLOGTIMESTAMP} %{DATA}\\[%{DATA:pid}\\]: %{GREEDYDATA:description}",
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} %{DATA:src_ip} %{GREEDYDATA:ip_address} %{DATA:dst_ip} - %{DATA:user_name} %{DATA} \\"%{DATA:method} %{GREEDYDATA:url}',
        '%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} %{TIMESTAMP_ISO8601} %{DATA:src_host} %{DATA:product_event_type} - - - %{IP:src_ip} %{GREEDYDATA:ip_address} %{DATA:dst_ip} - %{DATA:user_name} .*\\"%{DATA:method} %{GREEDYDATA:url}',
        '%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA} %{TIMESTAMP_ISO8601} %{DATA:src_host} %{DATA:product_event_type} - - - (%{GREEDYDATA} (HTTP|HTTPS)\\/%{DATA:version}\\" %{DATA:response_codes} %{DATA:rcv_bytes} (%{DATA:sent_bytes} %{GREEDYDATA:message}|%{GREEDYDATA:sent_bytes})|%{GREEDYDATA:description})',
        "%{SYSLOGTIMESTAMP:ts} %{DATA:dvc_ip} %{DATA:dvc_host}\\[%{DATA:pid}\\]: %{DATA:description}: <%{DATA}>%{SYSLOGTIMESTAMP} %{DATA:src_host} %{DATA:product_event_type} %{SYSLOGTIMESTAMP} %{DATA:user_name}: %{GREEDYDATA:message}",
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} %{IP:src_ip} %{IP:dst_ip} - %{DATA:user_name} %{DATA} \\"%{DATA:method} %{DATA:url} (HTTP|HTTPS)\\/%{DATA:version} %{DATA:response_code} %{DATA:rcv_bytes} %{GREEDYDATA:sent_bytes}',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} %{IP:src_ip} - - %{DATA:user_name} %{DATA} \\"%{DATA:method} %{DATA:url} (HTTP|HTTPS)\\/%{DATA:version} %{DATA:response_code} %{DATA:rcv_bytes} %{GREEDYDATA:sent_bytes}',
        "<%{INT}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:ts2} %{NOTSPACE:dvc_host} %{NOTSPACE:src_host} (%{INT:pid}) - - (?P<desc>[\\s\\S]+)",
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} (%{GREEDYDATA:description} (HTTP|HTTPS))\\/%{DATA:version}\\" %{DATA:response_codes} %{DATA:rcv_bytes} %{GREEDYDATA:sent_bytes}|%{GREEDYDATA:description})',
        '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_event_type} (%{IP:src_ip} %{GREEDYDATA:ip_address}, %{IP:dst_ip}|%{DATA:src_ip} %{DATA:dst_ip}) - %{DATA:user_name} %{DATA} \\"%{DATA:method} (\\/ (HTTP|HTTPS)|\\/%{DATA:url} (HTTP|HTTPS)))\\/%{DATA:version}\\" %{DATA:response_code} %{DATA:rcv_bytes} %{GREEDYDATA:sent_bytes}'
      ]
    }
    overwrite => ["timestamp", "ts", "dvc_ip", "dvc_host", "pid", "src_ip", "dst_ip", "sent_bytes", "rcv_bytes", "proto", "request_id", "response_code", "url", "version", "method", "url1", "ip_address","src_host","src_application","severity","product_event_type","connection_type","file_name","src_resource","description","user_name","src_port","ts2", "sha256_value" , "message", "desc","syslog_version"]
    on_error => "grok_pattern_failed"
  }

  if [grok_pattern_failed] {
    mutate {
      gsub => ["message" , "&" , "_"]
    }
    grok {
      match => {
        "message" => [
          '<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:src_host} %{DATA:product_evgent_type} (%{GREEDYDATA:description} (HTTP|HTTPS)\\/%{DATA:version}\\" %{DATA:response_code} %{DATA:rcv_bytes} %{GREEDYDATA:sent_bytes}|%{GREEDYDATA:description})'
        ]
      }
      overwrite => ["ts" , "product_event_type" , "description" , "response_code" , "rcv_bytes" , "sent_bytes" , "version" , "src_host"]
      on_error => "grok_pattern_failed_"
    }
    if [grok_pattern_failed_] {
      drop {
        tag => "TAG_UNSPECIFIED"
      }
    }
  }

  if [desc] =~ "event" {
    xml {
      source => "desc"
      xpath => {
        "/event/@rev" => "rev"
        "/event/target/@resource" => "resource"
        "/event/date" => "time_stamp"
        "/event/accessor/principal" => "principal_user"
        "/event/accessor/session_id" => "session_id"
        "/event/accessor/user_location" => "user_location"
        "/event/target/url" => "url"
        "/event/originator/@blade" => "blade"
        "/event/originator/@instance" => "instance"
        "/event/originator/component" => "component"
        "/event/originator/component/@rev" => "component_rev"
        "/event/originator/event_id" => "event_id"
        "/event/accessor/principal/@domain" => "domain"
        "/event/accessor/principal/@auth" => "auth"
        "/event/accessor/name_in_rgy" => "name_in_rgy"
        "/event/accessor/user_location_type" => "user_location_type"
        "/event/authntype" => "authntype"
        "/event/originator/action" => "action"
        "/event/originator/location" => "location"
        "/event/outcome/@status" => "status"
        "/event/outcome" => "outcome"
      }
      on_error => "xml_error"
    }
  }

  if [time_stamp] != "" {
    mutate {
      gsub => ["time_stamp", "I-*", ""]
    }
    date {
      match => ["time_stamp", "yyyy-MM-dd-HH:mm:ss.SSSZZ"]
      target => "metadata.event_timestamp"
      on_error => "no_time_stamp"
    }
  }
  if [rev] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{rev}"
      }
      on_error => "no_rev"
    }
  }

  if [blade] != "" {
    mutate {
      replace => {
        "target.application" => "%{blade}"
      }
      on_error => "no_blade"
    }
  }
  if [instance] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{instance}"
      }
      on_error => "instance_empty"
    }
  }
  if [component] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{component}"
      }
      on_error => "component_error"
    }
  }
  if [event_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{event_id}"
      }
      on_error => "event_id_not_found"
    }
  }
  if [domain] != "" {
    mutate {
      replace => {
        "target.administrative_domain" => "%{domain}"
      }
      on_error => "domain_error"
    }
  }
  if [location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{location}"
      }
      on_error => "location_error"
    }
  }
  if [component_rev] != "" {
    mutate {
      replace => {
        "component_rev_labels_name.key" => "component_rev"
        "component_rev_labels_name.value" => "%{component_rev}"
      }
      on_error => "no_component_rev_labels_name_for_key"
    }
    if ![no_component_rev_labels_name_for_key] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "component_rev_labels_name"
        }
        on_error => "no_component_rev_labels_name_for_merge"
      }
    }
  }
  if [resource] != "" {
    mutate {
      replace => {
        "resource_labels_name.key" => "resource"
        "resource_labels_name.value" => "%{resource}"
      }
      on_error => "no_resource_labels_name_for_key"
    }
    if ![no_resource_labels_name_for_key] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "resource_labels_name"
        }
        on_error => "no_resource_labels_name_for_merge"
      }
    }
  }
  if [principal_user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{principal_user}"
      }
      on_error => "no_principal_user"
    }
  }
  if [session_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{session_id}"
      }
      on_error => "no_session_id"
    }
  }
  if [user_location] != "" {
    grok {
      match => {
        "user_location" => "%{IP:user_location}"
      }
      on_error => "no_user_location"
      overwrite => ["user_location"]
    }
    if ![no_user_location] {
      mutate {
        merge => {
          "principal.ip" => "user_location"
          "principal.asset.ip" => "user_location"
        }
        on_error => "no_user_location_merge"
      }
    }
    if ![no_user_location_merge] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [auth] != "" {
    mutate {
      replace => {
        "auth_label.key" => "auth"
        "auth_label.value" => "%{auth}"
      }
      on_error => "auth_error"
    }
    if ![auth_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "auth_label"
        }
        on_error => "auth_merge_error"
      }
    }
  }
  if [user_location_type] != "" {
    mutate {
      replace => {
        "user_location_type_label.key" => "user_location_type"
        "user_location_type_label.value" => "%{user_location_type}"
      }
      on_error => "user_location_type_error"
    }
    if ![user_location_type_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "user_location_type_label"
        }
        on_error => "user_location_type_merge_error"
      }
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "action_label.key" => "action"
        "action_label.value" => "%{action}"
      }
      on_error => "action_error"
    }
    if ![action_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "action_label"
        }
        on_error => "action_merge_error"
      }
    }
  }
  if [outcome] != "" {
    mutate {
      replace => {
        "outcome_label.key" => "outcome"
        "outcome_label.value" => "%{outcome}"
      }
      on_error => "outcome_error"
    }
    if ![outcome_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "outcome_label"
        }
        on_error => "outcome_merge_error"
      }
    }
  }
  if [status] != "" {
    mutate {
      replace => {
        "status_label.key" => "status"
        "status_label.value" => "%{status}"
      }
      on_error => "status_error"
    }
    if ![status_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "status_label"
        }
        on_error => "status_merge_error"
      }
    }
  }
  if [name_in_rgy] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{name_in_rgy}"
      }
      on_error => "name_in_rgy_error"
    }
  }
  if [authntype] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "%{authntype}"
      }
      on_error => "authntype_error"
    }
  }
  if [syslog_version] != "" {
    mutate {
      replace => {
        "syslog_version_label.key" => "syslog_version"
        "syslog_version_label.value.string_value" => "%{syslog_version}"
      }
      on_error => "no_syslog_version_value"
    }
    if ![no_syslog_version_value] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "syslog_version_label"
        }
        on_error => "no_syslog_version_label"
      }
    }
  }
  # converting ip address to json array and mapped to intermediary.ip
  mutate {
    replace => {
      "ip_address" => "{\"ip_address\":[\"%{ip_address}\"]}"
    }
  }
  mutate {
    gsub => ["ip_address", ",", ""]
  }
  mutate {
    gsub => ["ip_address", " ", ","]
  }
  mutate {
    gsub => ["ip_address", ",,", ","]
  }
  mutate {
    gsub => ["ip_address", ",", "\",\""]
  }
  json {
    source => "ip_address"
    array_function => "split_columns"
  }

  if [description] != "" {
    grok {
      match => {
        "description" => [
          "WebSEAL could not establish a secure connection to the server, %{DATA:target_hostname}, %{GREEDYDATA}",
          "The %{DATA:ip_protocol_value}/IP host information could not be determined from the server hostname: %{DATA:target_hostname}. %{GREEDYDATA}"
          "Disconnected from .* %{IP:src_ip} %{DATA} (%{DATA:src_port} \\[%{GREEDYDATA}\\]|%{GREEDYDATA:src_port})"
          "The %{DATA:method_value} %{GREEDYDATA}"
          ".* disconnect from %{IP:src_ip} %{DATA} %{DATA:src_port}:%{GREEDYDATA}"
        ]
      }
      on_error => "invalid_description_grok"
      overwrite => ["target_hostname" , "method_value" , "src_ip", "src_port" , "ip_protocol_value"]
    }
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "no_description"
    }
  }

  date {
    match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z", "yyyy-MM-dd-HH:mm:ss.SSSZZI"]
    target => "metadata.event_timestamp"
    on_error => "no_timestamp"
  }

  if [ts] != "" {
    date {
      match => ["ts", "ISO8601", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
      target => "metadata.collected_timestamp"
      rebase => true
      on_error => "no_ts"
    }
  }

  if [ts2] != "" {
    date {
      match => ["ts2","yyyy-MM-ddTHH:mm:ss","yyyy-MM-ddTHH:mm:ssZZ"]
      target => "metadata.collected_timestamp"
      on_error => "no_ts2"
    }
  }

  if [dvc_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{dvc_host}"
      }
    }
  }

  if [dvc_ip] != "" {
    grok {
      match => {
        "dvc_ip" => "%{IP:dvc_ip}"
      }
      on_error => "not_ip"
      overwrite => ["dvc_ip"]
    }
    if ![not_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "dvc_ip"
        }
      }
    }
    else {
      mutate {
        replace => {
          "intermediary.hostname" => "%{dvc_ip}"
        }
      }
    }
  }

  for ip in ip_address {
    grok {
      match => {
        "ip" => ["%{IP:ip}"]
      }
      on_error => "not_ip"
      overwrite => ["ip"]
    }
    if ![not_ip] and ([src_ip] != [ip]) and ([ip] != [dst_ip]) and [ip] != "" and [ip] != "-" {
      mutate {
        merge => {
          "intermediary.ip" => "ip"
        }
        on_error => "no_ip"
      }
    }
  }

  if [src_ip] not in ["" , " " , "null" , " N/A" , "-"] {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [src_host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{src_host}"
        "principal.asset.hostname" => "%{src_host}"
        "has_principal" => "true"
      }
      on_error => "no_src_host"
    }
  }

  if [src_port] != "" {
    mutate {
      convert => {
        "src_port" => "integer"
      }
      on_error => "conversion_error"
    }
    mutate {
      rename => {
        "src_port" => "principal.port"
      }
      on_error => "no_port"
    }
  }

  if [sha256_value] != "" {
    mutate {
      replace => {
        "sha256_label.key" => "sha256_value"
        "sha256_label.value.string_value" => "%{sha256_value}"
      }
      on_error => "no_sha256_value"
    }
    if ![no_sha256_value] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "sha256_label"
        }
        on_error => "no_sha256_label"
      }
    }
  }

  if [dst_ip] not in ["" , " " , "null" , " N/A" , "-"] {
    mutate {
      merge => {
        "target.ip" => "dst_ip"
        "target.asset.ip" => "dst_ip"
      }
      on_error => "no_dst_ip"
    }
    if ![no_dst_ip] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [url] != "" {
    grok {
      match => {
        "url" => [
          "(?P<clean_url>[^{]+?){.*}",
          "%{GREEDYDATA:clean_url}"
        ]
      }
      on_error => "no_clean_url"
      overwrite => ["clean_url"]
    }
    if ![no_clean_url]  and [clean_url] != "" {
      mutate {
        replace => {
          "url" => "%{clean_url}"
        }
        on_error => "no_url"
      }
    }
    mutate {
      replace => {
        "target.url" => "%{url}%{url1}"
      }
    }
  }

  if [user_name] not in ["unauthenticated",""] {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_name}"
      }
      on_error => "no_user_name"
    }
  }
  else if [user_name] == "unauthenticated" {
    mutate {
      replace => {
        "security_result.summary" => "unauthenticated"
      }
    }
  }

  if [sent_bytes] != "" {
    mutate {
      convert => {
        "sent_bytes" => "uinteger"
      }
    }
    mutate {
      rename => {
        "sent_bytes" => "network.sent_bytes"
      }
    }
  }

  if [rcv_bytes] not in ["" , " " , "null" , " N/A" , "-"] {
    mutate {
      convert => {
        "rcv_bytes" => "uinteger"
      }
    }
    mutate {
      rename => {
        "rcv_bytes" => "network.received_bytes"
      }
    }
  }

  if [request_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{request_id}"
      }
    }
  }

  if [method] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{method}"
        "has_http" => "true"
      }
    }
  }

  if [response_code] != "" {
    mutate {
      convert => {
        "response_code" => "integer"
      }
    }
    mutate {
      rename => {
        "response_code" => "network.http.response_code"
      }
    }
    mutate {
      replace => {
        "has_http" => "true"
      }
    }
  }

  if [src_application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{src_application}"
      }
      on_error => "no_src_application"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "no_product_event_type"
    }
  }

  if [method_value] != "" {
    mutate {
      replace => {
        "network.http.method" => "%{method_value}"
      }
      on_error => "no_method_value"
    }
  }

  if [target_hostname] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{target_hostname}"
        "target.asset.hostname" => "%{target_hostname}"
        "has_target" => "true"
      }
      on_error => "no_target_host"
    }
  }

  if [src_resource] != "" {
    mutate {
      replace => {
        "principal.resource.name" => "%{src_resource}"
      }
      on_error => "no_src_resource"
    }
  }

  if [severity] in ["ERROR","HIGH","INFORMATIONAL","LOW","MEDIUM"] {
    mutate {
      replace => {
        "security_result.severity" => "%{severity}"
      }
      on_error => "no_severity"
    }
  }
  else if [severity] == "WARNING" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }

  if [pid] != "" {
    mutate {
      rename => {
        "pid" => "principal.process.pid"
      }
    }
  }

  if [file_name] != "" {
    mutate {
      replace => {
        "principal.file.full_path" => "%{file_name}"
      }
      on_error => "no_file_name"
    }
  }

  if [connection_type] != "" {
    mutate {
      replace => {
        "connection_type_label.key" => "connection_type"
        "connection_type_label.value.string_value" => "%{connection_type}"
      }
      on_error => "no_connection_type"
    }
    if ![no_connection_type] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "connection_type_label"
        }
        on_error => "no_connection_type_label"
      }
    }
  }

  if [GS_CREATE_HOLD_ZPLANT] != "" {
    mutate {
      replace => {
        "gs_create_hold_zplant_label.key" => "GS_CREATE_HOLD_ZPLANT"
        "gs_create_hold_zplant_label.value.string_value" => "%{GS_CREATE_HOLD_ZPLANT}"
      }
      on_error => "no_gs_create_hold_zplant"
    }
    if ![no_gs_create_hold_zplant] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "gs_create_hold_zplant_label"
        }
        on_error => "no_gs_create_hold_zplant_label"
      }
    }
  }

  if [description] =~ "could not establish a secure connection to the server" or [description] =~ "could not be determined from the server hostname" or [description] =~ "have expired" {
    mutate {
      replace => {
        "action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
      on_error => "no_action"
    }
  }

  if [proto] in ["HTTP", "HTTPS"] {
    mutate {
      replace => {
        "network.application_protocol" => "%{proto}"
      }
    }
  }

  if [version] != "" {
    mutate {
      replace => {
        "network.application_protocol_version" => "%{version}"
      }
    }
  }

  if [ip_protocol_value] in ["TCP" , "UDP" , "ICMP"] {
    mutate {
      replace => {
        "network.ip_protocol" => "%{ip_protocol_value}"
      }
      on_error => "no_ip_protocol_value"
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "IBM_SAM"
      "metadata.vendor_name" => "IBM"
      "metadata.event_type" => "NETWORK_HTTP"
    }
  }

  if [has_principal] == "true" and [has_http] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

