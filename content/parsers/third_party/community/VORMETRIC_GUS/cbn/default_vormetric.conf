# Product: Vormetric
# Category: Encryption
# Supported Format: SYSLOG, SYSLOG+JSON
# Reference: N/A
# Last Updated: 2026-07-31
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "spid" => ""
      "start" => ""
      "dvchost" => ""
      "suser" => ""
      "source" => ""
      "ip" => ""
      "description" => ""
      "shost" => ""
      "product_log_id" => ""
      "host" => ""
      "desc" => ""
      "user_name" => ""
      "port" => ""
      "proto" => ""
      "json_data" => ""
      "id" => ""
      "client_ip" => ""
      "details_client_name" => ""
      "severity" => ""
      "success" => ""
      "action_val" => ""
      "account" => ""
      "username_val" => ""
      "requestId" => ""
      "principal_iss" => ""
      "details_grant_type" => ""
      "domain_id" => ""
      "security_result" => ""
      "ts" => ""
      "details_connection" => ""
      "json_parse_error" => ""
      "event_message" => ""
      "principal_acc" => ""
      "details_client_id" => ""
      "event_date" => ""
      "event_time" => ""
      "timestamp" => ""
      "kv_data" => ""
      "parsed_ts" => ""
      "intermediary" => ""
      "has_principal" => "false"
      "has_principal_user" => "false"
      "has_target" => "false"
      "has_target_user" => "false"
      "event_type" => "GENERIC_EVENT"
      "product_name" => ""
      "vendor_name" => ""
      "service" => ""
      "product_version" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:ts}\\.[0-9]+Z %{HOSTNAME:intermediary_host} [a-zA-Z0-9._@-]+ %{INT} %{HOSTNAME} \\[[a-zA-Z0-9._@-]+ sev=\\\"(?P<severity>[A-Z]+)\\\" msg=\\\"(?P<event_message>[^\"]+)\\\" %{GREEDYDATA:message_details}",
        "<%{INT}>(%{SYSLOGTIMESTAMP:time}| %{TIMESTAMP_ISO8601:time}) %{HOSTNAME:hostname} CEF:%{DATA}\\|%{DATA:vendor_name}\\|%{WORD:product_name}\\|%{DATA:product_version}\\|%{DATA:product_log_id}\\|%{DATA:desc}(?:\\|\\||\\|)%{INT:severity}\\|%{GREEDYDATA:kv_data}",
        "<%{INT}>(%{SYSLOGTIMESTAMP:timestamp}|%{TIMESTAMP_ISO8601:time}) %{HOSTNAME:hostname} (?P<json_data>\\{.*\\})",
        "(<%{INT}>%{SYSLOGTIMESTAMP:time} %{HOST:host} (?P<data>%{GREEDYDATA}\\]):%{DATA:product_log_id}:(%{DATA:product_log}: )?)?%{GREEDYDATA:desc}"
      ]
    }
    overwrite => ["product_log_id", "host", "desc", "json_data", "severity", "ts", "time", "event_message", "vendor_name", "product_name", "product_version", "kv_data", "timestamp", "hostname"]
    on_error => "grok_fail"
  }
  if [json_data] != "" {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "json_parse_error"
    }

    if ![json_parse_error] {
      if [timestamp] != "" {
        date {
          match => ["timestamp", "MMM dd HH:mm:ss", "MMM d HH:mm:ss", "MMM  dd HH:mm:ss", "MMM  d HH:mm:ss"]
          rebase => true
          target => "event.idm.read_only_udm.metadata.event_timestamp"
          on_error => "timestamp_error"
        }
      }

      if [message] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_event_type" => "%{message}"
          }
          on_error => "message_replace_error"
        }
      }

      if [id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
          }
          on_error => "log_id_replace_error"
        }
      }

      if [client_ip] != "" {
        grok {
          match => {
            "client_ip" => [
              "%{IP:client_ip}"
            ]
          }
          overwrite => ["client_ip"]
          on_error => "client_ip_grok_error"
        }
        if ![client_ip_grok_error] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "client_ip"
              "event.idm.read_only_udm.principal.asset.ip" => "client_ip"
            }
            on_error => "client_ip_merge_error"
          }
          if ![client_ip_merge_error] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }

      if [source] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{source}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{source}"
            "has_principal" => "true"
          }
          on_error => "source_replace_error"
        }
      }

      mutate {
        replace => {
          "details_client_name" => "%{details.client_name}"
        }
        on_error => "details_client_name_replace_error"
      }
      if [details_client_name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{details_client_name}"
            "has_target_user" => "true"
          }
          on_error => "details_client_name_error"
        }
      }

      if [severity] =~ "(?i)INFO" {
        mutate {
          replace => {
            "security_result.severity" => "INFORMATIONAL"
          }
        }
      } else if [severity] =~ "(?i)ERROR" or [severity] == "(?i)FATAL" {
        mutate {
          replace => {
            "security_result.severity" => "ERROR"
          }
        }
      }
      mutate {
        convert => {
          "success" => "string"
        }
        on_error => "success_convert_error"
      }
      if [success] != "" {
        if [success] == "true" {
          mutate {
            replace => {
              "action_val" => "ALLOW"
            }
          }
        } else if [success] == "false" {
          mutate {
            replace => {
              "action_val" => "BLOCK"
            }
          }
        }
      }
      if [action_val] != "" {
        mutate {
          merge => {
            "security_result.action" => "action_val"
          }
          on_error => "action_val_merge_error"
        }
      }

      if [account] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.administrative_domain" => "%{account}"
          }
          on_error => "principal_admin_domain_replace_error"
        }
      }
      mutate {
        replace => {
          "username_val" => "%{username}"
        }
        on_error => "username_val_replace_error"
      }
      if [username_val] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.user_display_name" => "%{username_val}"
            "has_principal_user" => "true"
          }
          on_error => "principal_user_replace_error"
        }
      }
      if [service] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.application" => "%{service}"
          }
          on_error => "principal_application_replace_error"
        }
      }

      if [requestId] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{requestId}"
          }
          on_error => "session_id_replace_error"
        }
      }

      mutate {
        replace => {
          "principal_iss" => "%{principal.iss}"
        }
        on_error => "principal_iss_replace_error"
      }
      if [principal_iss] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.extensions.auth.auth_details" => "%{principal_iss}"
          }
          on_error => "auth_details_replace_error"
        }
      }

      mutate {
        replace => {
          "details_grant_type" => "%{details.grant_type}"
        }
        on_error => "details_grant_type_replace_error"
      }
      if [details_grant_type] != "" {
        mutate {
          replace => {
            "grant_type_label.key" => "details_grant_type"
            "grant_type_label.value" => "%{details_grant_type}"
          }
          on_error => "details_grant_type_label_replace_error"
        }
        if ![details_grant_type_label_replace_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "grant_type_label"
            }
            on_error => "grant_type_label_merge_error"
          }
        }
      }

      if [domain_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.administrative_domain" => "%{domain_id}"
          }
          on_error => "target_admin_domain_replace_error"
        }
      }

      mutate {
        replace => {
          "principal_acc" => "%{principal.acc}"
        }
        on_error => "principal_acc_empty"
      }
      if [principal_acc] != "" {
        mutate {
          replace => {
            "acc_label.key" => "principal_acc"
            "acc_label.value" => "%{principal_acc}"
          }
          on_error => "principal_acc_replace_error"
        }
        if ![principal_acc_replace_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "acc_label"
            }
            on_error => "acc_label_merge_error"
          }
        }
      }

      mutate {
        replace => {
          "details_connection" => "%{details.connection}"
        }
        on_error => "details_connection_empty"
      }
      if [details_connection] != "" {
        mutate {
          replace => {
            "conn_label.key" => "details_connection"
            "conn_label.value" => "%{details_connection}"
          }
          on_error => "details_connection_replace_error"
        }
        if ![details_connection_replace_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "conn_label"
            }
            on_error => "details_connection_merge_error"
          }
        }
      }

      mutate {
        replace => {
          "details_client_id" => "%{details.client_id}"
        }
        on_error => "client_id_replace_error"
      }
      if [details_client_id] != "" {
        mutate {
          replace => {
            "cid_label.key" => "details_client_id"
            "cid_label.value" => "%{details_client_id}"
          }
          on_error => "details_client_id_replace_error"
        }
        if ![details_client_id_replace_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "cid_label"
            }
            on_error => "details_client_id_merge_error"
          }
        }
      }
    }
  }

  else if [message] =~ "sev" {
    # Date parsing
    if [ts] != "" {
      grok {
        match => {
          "ts" => [
            "(?P<event_date>[^T]+)T%{TIME:event_time}"
          ]
        }
        overwrite => ["event_date", "event_time"]
        on_error => "ts_grok_failure"
      }
    }
    if [event_date] != "" and [event_time] != "" {
      mutate {
        replace => {
          "parsed_ts" => "%{event_date} %{event_time}"
        }
        on_error => "parsed_ts_err"
      }
    }

    if [parsed_ts] != "" {
      date {
        match => ["parsed_ts", "yyyy-MM-dd HH:mm:ss" ]
        on_error => "parsed_ts_date_failure"
      }
    }

    # End date parsing

    mutate {
      rename => {
        "intermediary_host" => "intermediary.hostname"
      }
    }

    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.description" => "%{event_message}"
        "event_severity" => "INFO"
      }
    }

    if [intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
        on_error => "intermediary_merge_error"
      }
    }
    if [event_message] == "Raise drop space level" {
      grok {
        match => {
          "message_details" => [
            "reason=\\\"%{DATA:reason}\\\""
          ]
        }
      }

      mutate {
        rename => {
          "reason" => "security_result.description"
        }
      }
    } else if [event_message] in ["Audit access", "Audit node"] {
      mutate {
        gsub => [
          "message_details", "\\\\", ""
        ]
      }

      grok {
        match => {
          "message_details" => [
            "cat=\\\"\\[%{DATA:category}\\]\\\" pol=\\\"%{DATA:policy}\\\" uinfo=\\\"%{DATA:user_info}\\\" sproc=\\\"%{DATA:application}\\\" act=\\\"%{DATA:command}\\\" gp=\\\"%{DATA}\\\" filePath=\\\"%{DATA:file_path}\\\" denyStr=\\\"%{DATA:event_subtype}\\\" "
          ]
        }
      }

      grok {
        match => {
          "user_info" => [
            "%{USERNAME:username},uid=%{POSINT:userid}"
          ]
        }
      }

      mutate {
        rename => {
          "application" => "event.idm.read_only_udm.principal.application"
          "userid" => "event.idm.read_only_udm.principal.user.userid"
          "username" => "event.idm.read_only_udm.principal.user.user_display_name"
          "file_path" => "event.idm.read_only_udm.target.file.full_path"
          "command" => "event.idm.read_only_udm.metadata.product_event_type"
        }
      }

      if [event_message] == "Audit access" {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_ACCESS"
            "event.idm.read_only_udm.target.resource.resource_subtype" => "DIRECTORY"
          }
        }
      } else if [event_message] == "Audit node" {
        mutate {
          replace => {
            "event_type" => "USER_RESOURCE_CREATION"
            "event.idm.read_only_udm.target.resource.resource_subtype" => "FILE"
          }
        }
      }

    } else if [event_message] == "Log space low" {
      grok {
        match => {
          "message_details" => "filePath=\\\"%{DATA:file_path}\\\""
        }
      }

      mutate {
        rename => {
          "file_path" => "event.idm.read_only_udm.target.file.full_path"
        }
      }
    } else if [event_message] == "SOAP client error" {
      grok {
        match => {
          "message_details" => [
            "url=\\\"%{DATA:target_url}\\\" version=\\\"%{DATA}\\\" verno=\\\"%{DATA}\\\" context=\\\"%{DATA}\\\" subcode=\\\"%{DATA}\\\" reason=\\\"%{DATA:reason}\\\" detail=\\\"%{DATA:event_details}\\\""
          ]
        }
      }

      mutate {
        rename => {
          "target_url" => "event.idm.read_only_udm.target.url"
          "reason" => "security_result.summary"
          "event_details" => "security_result.description"
        }
      }
    } else if [event_message] in ["Agent init fail", "Cannot contact server"] {
      # These events do not contain any details
    } else if [event_message] in ["denied req from unauthorized host", "failed to contact host"] {
      grok {
        match => {
          "message_details" => [
            "shost=\\\"(?P<target_host>[^\\]]*)\\\"\\s+"
            "shost=\\\"(?P<target_host>[^\\]]*)\\\""
            ]
        }
      }
      mutate {
        rename => {
          "target_host" => "event.idm.read_only_udm.target.hostname"
        }
      }
    }
      # UNKNOWN_SEVERITY = 0;
      # // Info severity.
      # INFORMATIONAL = 100;
      # // An error.
      # ERROR = 150;

      # // Low-severity malicious result.
      # LOW = 200;
      # // Medium-severity malicious result.
      # MEDIUM = 300;
      # // High-severity malicious result.
      # HIGH = 400;
      # // Critical-severity malicious result.
      # CRITICAL = 500;

    if [severity] == "INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [severity] in ["WARN","FATAL","ERROR"] {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
  }
  else if [message] =~ "CEF" {
    if [product_version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_version" => "%{product_version}"
        }
        on_error => "product_version_replace_failure"
      }
    }
    if [product_log_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{product_log_id}"
        }
        on_error => "product_log_id_replace_failure"
      }
    }
    mutate {
      replace => {
       "event_type" => "NETWORK_CONNECTION"
      }
    }

    date {
      match => ["time", "ISO8601"]
      on_error => "no_date"
    }
    if [desc] != "" {
      grok {
        match => {
          "desc" => ["%{IPV4:target_ip}"]
        }
        on_error => "no_target_ip"
      }
      if ![no_target_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "target_ip"
            "event.idm.read_only_udm.target.asset.ip" => "target_ip"
          }
          on_error => "target_ip_merge_error"
        }
        if ![target_ip_merge_error] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
      if [desc] =~ "LDAP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" = "LDAP"
          }
        }
      }
      if [desc] =~ '(user|admin|login)' {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
          }
        }
      }
      mutate {
        replace => {
          "security_result.description" => "%{desc}"
        }
      }
    }
    if [severity] != "" {
      mutate {
        convert => {
          "severity" => "uinteger"
        }
      }
      if [severity] < 3 {
        mutate {
          replace => {
              "security_result.severity" => "LOW"
          }
        }
      }
      else if [severity] > 2 && [severity] < 6 {
        mutate {
          replace => {
              "security_result.severity" => "MEDIUM"
          }
        }
      }
      else if [severity] > 5 {
        mutate {
          replace => {
              "security_result.severity" => "HIGH"
          }
        }
      }
    }
    if [kv_data] != "" {
      mutate {
        gsub => ["kv_data", "(\\w+)=", "#$1="]
      }
    # Swapping the values of csLabels
      mutate {
        gsub => ["kv_data", "#cs\\d+Label=([^#]+) #cs(\\d+)=([^#]+)", "#$1=$3"]
      }

      kv {
        source => "kv_data"
        field_split => "#"
        value_split => "="
      }
      if [start] != "" {
        date {
          match => ["start", "yyyy-MM-dd HH:mm:ss.SSS"]
          target => "event.idm.read_only_udm.metadata.collected_timestamp"
        }
      }
      mutate {
        replace => {
          "additional_fields.key" => "logger"
          "additional_fields.value.string_value" => "%{logger}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_fields"
        }
      }
    }
    if [spid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{spid}"
        }
      }
    }
    if [suser] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.user_display_name" => "%{suser}"
        }
      }
    }
    if [source] != "" {
      grok {
        match => {
          "source" => [
            "%{IP:source}"
          ]
        }
        overwrite => ["source"]
        on_error => "source_grok_error"
      }
      if ![source_grok_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "source"
            "event.idm.read_only_udm.principal.asset.ip" => "source"
          }
          on_error => "source_merge_error"
        }
        if ![source_merge_error] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    else if [ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ip"
          "event.idm.read_only_udm.principal.asset.ip" => "ip"
        }
        on_error => "ip_merge_error"
      }
      if ![ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [dvchost] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{dvchost}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{dvchost}"
          "has_target" => "true"
        }
        on_error => "dvchost_replace_error"
      }
    }
    if [shost] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{shost}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{shost}"
          "has_principal" => "true"
        }
        on_error => "shost_replace_error"
      }
    }
    mutate {
      rename => {
        "reason" => "security_result.summary"
      }
    }
  }

  else {
    date {
      match => ["time", "MMM dd HH:mm:ss","MMM d HH:mm:ss", "MMM  dd HH:mm:ss","MMM  d HH:mm:ss"]
      on_error => "no_date"
    }
    mutate {
      replace => {
        "vendor_name" => "Vormetric, Inc."
        "event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.product_log_id" => "%{product_log_id}"
      }
    }
    if [host] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{host}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
          "has_principal" => "true"
        }
        on_error => "host_replace_error"
      }
    }
    if [desc] != "" {
      grok {
        match => {
          "desc" => ["%{GREEDYDATA:description} %{WORD:user_name} from %{IPV4:ip} port %{INT:port} %{WORD:proto}"]
        }
        overwrite => ["ip","port","user_name","proto", "description"]
        on_error => "grok_fail"
      }
      if ![grok_fail] {
        if [user_name] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.user.userid" => "%{user_name}"
            }
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.port" => "%{port}"
          }
          convert => {
            "event.idm.read_only_udm.target.port" => "integer"
          }
        }
        if [ip] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.target.ip" => "ip"
              "event.idm.read_only_udm.target.asset.ip" => "ip"
            }
            on_error => "target_ip_merge_failure"
          }
          if ![target_ip_merge_failure] {
            mutate {
              replace => {
                "has_target" => "true"
              }
            }
          }
        }
        if [proto] =~ "ssh" {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.application_protocol" => "SSH"
            }
          }
        }
        if [description] =~ "invalid user" {
          mutate {
            replace => {
              "auth_mechanism" => "USERNAME_PASSWORD"
              "event_type" => "USER_LOGIN"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.extensions.auth.mechanism"   => "auth_mechanism"
            }
          }
        }
        mutate {
          replace => {
            "security_result.description" => "%{description}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "security_result.description" => "%{desc}"
          }
        }
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_error"
    }
  }

  if [event_type] == "GENERIC_EVENT" and [has_principal] == "true" and ([has_principal_user] == "true" or [has_target_user] == "true") and [details_grant_type] == "client_credential" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  if [product_name] == "" and [vendor_name] == "" {
    mutate {
      replace => {
        "vendor_name" => "Vormetric, Inc."
        "product_name" => "Vormetric"
      }
    }
  }
  if [product_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product_name}"
      }
      on_error => "product_name_replace_error"
    }
  }
  if [vendor_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor_name}"
      }
      on_error => "vendor_name_replace_error"
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_replace_error"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
