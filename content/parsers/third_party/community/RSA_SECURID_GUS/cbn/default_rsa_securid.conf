        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:hostname} (?P<application>rsyslogd): %{GREEDYDATA:description}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:hostname}  \\s+at .*",
        "(<%{INT}>|)%{SYSLOGTIMESTAMP:time} %{IPORHOST:hostname} %{TIMESTAMP_ISO8601:timestamp},%{INT},%{GREEDYDATA}(?P<audit_section>(audit.admin.com.rsa.authmgr.internal.admin.tokenmgt.impl.TokenAdministrationImpl|audit.admin.com.rsa.authmgr.internal.admin.attributemgt.impl.AttributeDefinitionAdministrationImpl|audit.runtime.com.rsa.ims.authn.impl.AuthenticationBrokerImpl)), %{GREEDYDATA:csv_data}",
