            "column9" => "%{IP:tar_ip}"
          }
          overwrite => ["tar_ip"]
          on_error => "column9_ip_grok_failure"
        }
        if ![column9_ip_grok_failure] {
          mutate {
            merge => {
              "target.ip" => "tar_ip"
              "target.asset.ip" => "tar_ip"
            }
            on_error => "tar_ip_empty"
          }
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }

      if [column15] != "" {
        mutate {
          replace => {
            "target.resource.product_object_id" => "%{column15}"
          }
          on_error => "column15_empty"
        }
      }

      if [column12] == "SUCCESS" {
        mutate {
          replace => {
            "auth_action" => "ALLOW"
          }
        }
      }
      else if [column12] != "" {
        mutate {
          replace => {
            "auth_action" => "BLOCK"
          }
        }
      }

      if [auth_action] != "" {
        mutate {
          merge => {
            "security_result.action" => "auth_action"
          }
          on_error => "auth_action_empty"
        }
      }
      if [column12] != "" {
        mutate {
          merge => {
            "security_result.category_details" => "column12"
          }
          on_error => "column12_empty"
        }
      }

      mutate {
        gsub => ["column5", " ", ""]
      }
      if [column5] in [ "error", "warning", "ERROR"] {
        mutate {
          replace => {
            "security_result.severity" => "HIGH"
          }
        }
      }
      else if [column5] == "critical" {
        mutate {
          replace => {
            "security_result.severity" => "CRITICAL"
          }
        }
      }
      else if [column5] == "notice" {
        mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      }
      else if [column5] in [ "information", "info", "INFO"] {
        mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      }
      if [column5] != "" {
        mutate {
          replace => {
            "security_result.severity_details" => "%{column5}"
          }
          on_error => "column5_empty"
        }
      }

      if [column6] != "" {
        mutate {
          gsub => ["column6", " ", ""]
        }
        mutate {
          replace => {
            "metadata.product_log_id" => "%{column6}"
          }
          on_error => "column6_empty"
        }
      }

      if [column10] != "" {
        mutate {
          replace => {
            "security_result.rule_name" => "%{column10}"
            "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
          }
          on_error => "column10_empty"
        }
      }

      if [column13] != "" {
        mutate {
          replace => {
            "security_result.summary" => "%{column13}"
          }
          on_error => "column13_empty"
        }
      }

      if [column15] != "" {
        mutate {
          replace => {
            "column15_label.value" => "%{column15}"
          }
          on_error => "column15_empty"
        }
        if ![column15_empty] {
          mutate {
            replace => {
              "column15_label.key" => "User Id"
            }
          }
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "column15_label"
            }
            on_error => "column15_label_empty"
          }
        }
      }

      if [column16] != "" {
        mutate {
          replace => {
            "column16_label.value" => "%{column16}"
          }
          on_error => "column16_empty"
        }
        if ![column16_empty] {
          mutate {
            replace => {
              "column16_label.key" => "user identity source id"
            }
          }
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "column16_label"
            }
            on_error => "column16_label_empty"
          }
        }
      }

      if [column17] != "" {
        mutate {
          replace => {
            "column17_label.value" => "%{column17}"
          }
          on_error => "column17_empty"
        }
        if ![column17_empty] {
          mutate {
            replace => {
              "column17_label.key" => "user security source id"
            }
          }
          mutate {
            merge => {
              "principal.resource.attribute.labels" => "column17_label"
            }
            on_error => "column17_label_empty"
          }
        }
      }

      if [column26] != "" {
        mutate {
          replace => {
            "column26_field.value.string_value" => "%{column26}"
          }
          on_error => "column26_empty"
        }
        if ![column26_empty] {
          mutate {
            replace => {
              "column26_field.key" => "policy method id"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "column26_field"
            }
            on_error => "column26_field_empty"
          }
        }
      }

      if [column27] != "" {
        mutate {
          replace => {
            "column27_field.value.string_value" => "%{column27}"
          }
          on_error => "column27_empty"
        }
        if ![column27_empty] {
          mutate {
            replace => {
              "column27_field.key" => "policy method name"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "column27_field"
            }
            on_error => "column27_field_empty"
          }
        }
      }

      if [column28] != "" {
        mutate {
          replace => {
            "column28_field.value.string_value" => "%{column28}"
          }
          on_error => "column28_empty"
        }
        if ![column28_empty] {
          mutate {
            replace => {
              "column28_field.key" => "token identifier"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "column28_field"
            }
            on_error => "column28_field_empty"
          }
        }
      }

      if [column18] != "" {
        mutate {
          gsub => ["column18", " ", ""]
        }
        mutate {
          gsub => ["column18", "\\.", ""]
        }
        mutate {
          replace => {
            "principal.user.userid" => "%{column18}"
            "has_user" => "true"
          }
          on_error => "column18_empty"
        }
      }

      if [column19] != "" {
        mutate {
          replace => {
            "principal.user.first_name" => "%{column19}"
          }
          on_error => "column19_empty"
        }
      }

      if [column20] != "" {
        mutate {
          replace => {
            "principal.user.last_name"   => "%{column20}"
          }
          on_error => "column20_empty"
        }
      }

      if [column20] != "" and [column21] != "" {
        mutate {
          replace => {
            "user_name" => "%{column19} %{column20}"
          }
          on_error => "user_name_empty"
        }
      }

      if [user_name] != "" {
        mutate {
          replace => {
            "principal.user.user_display_name" => "%{user_name}"
          }
          on_error => "user_name_empty"
        }
      }

      if [hostname] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{hostname}"
            "principal.asset.hostname" => "%{hostname}"
            "has_principal" => "true"
          }
          on_error => "Hostname_empty"
        }
      }
    }
  }
  else {
    if [application] == "rsyslogd" {
      grok {
        match => {
          "description" => "\\[%{DATA:version} try (?P<url>https.*) \\]"
        }
        overwrite => ["version", "url"]
        on_error => "description_grok_failure"
      }
      if [version] != "" {
        mutate {
          replace => {
            "metadata.product_version" => "%{version}"
          }
          on_error => "version_empty"
        }
      }
      if [url] != "" {
        mutate {
          replace => {
            "target.url" => "%{url}"
          }
          on_error => "url_empty"
        }
      }
    }
    if [timestamp] != "" {
      date {
        match => ["timestamp", "yyyy-MM-dd HH:mm:ss","MMM dd HH:mm:ss", "MMM d HH:mm:ss", "ISO8601"]
        on_error => "time_failure"
      }
    }
    else if [time] != "" {
      date {
        match => ["time", "MMM dd HH:mm:ss", "MMM  dd HH:mm:ss","MMM d HH:mm:ss"]
        rebase => true
        on_error => "time_failure"
      }
    }


    if [process_id] != "" {
      mutate {
        replace => {
          "principal.process.pid" => "%{process_id}"
        }
        on_error => "process_id_empty"
      }
    }
    if [description] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{description}"
        }
        on_error => "description_empty"
      }
    }
    if [application] in ["systemd", "cron", "CRON"] {
      grok {
        match => {
          "description" => [
            "(?P<action>session (opened|closed)) for user %{WORD:username} ?(by.*|)"
            "(?P<action>(Created|Removed) slice) .* of %{WORD:username}"
            "(?P<action>(Starting|Stopping|Started|Stopped) User (Slice|Manager)) (of|for UID) %{WORD:username}"
            "(?P<action>(Starting|Started) Session) %{GREEDYDATA:sessionId} of user %{WORD:username}"
            "(?P<action>.* PID %{NUMBER:pid})"
            "%{GREEDYDATA:action}"
          ]
        }
        overwrite => ["action","username","sessionId", "pid"]
        on_error => "grok_fail_systemd"
      }

      if [sessionId] != "" {
        mutate {
          replace => {
            "network.session_id" => "%{sessionId}"
          }
          on_error => "session_id_empty"
        }
      }

      if ![grok_fail_systemd] {
        if [action] != "" {
          mutate {
            replace => {
              "security_result.description" => "%{action}"
            }
            on_error => "action_empty"
          }
        }

        if [username] != "" {
          mutate {
            replace => {
              "target.user.userid" => "%{username}"
            }
            on_error => "username_empty"
          }
        }

        if [action] == "session closed" {
          mutate {
            replace => {
              "metadata.event_type" => "USER_LOGOUT"
              "mechanism" => "USERNAME_PASSWORD"
            }
          }
        }
        if [action] == "session opened" {
          mutate {
            replace => {
              "metadata.event_type" => "USER_LOGIN"
              "mechanism" => "USERNAME_PASSWORD"
            }
          }
        }

        mutate {
          merge => {
            "extensions.auth.mechanism" => "mechanism"
          }
          on_error => "mechanism_empty"
        }

        if [application] != "" {
          mutate {
            replace => {
              "target.application" => "%{application}"
            }
            on_error => "application_empty"
          }
        }

        if [action] in ["Created slice","Removed slice", "Starting Session","Started Session"] {
          mutate {
            replace => {
              "metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
        else if [action] in ["Starting User Manager","Started User Manager","Stopped User Manager","Stopping User Manager"] {
          mutate {
            replace => {
              "metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
          if [username] in ["0","root"] {
            mutate {
              replace => {
                "principal.user.userid" => "root"
              }
            }
          }
          else if [username] != "" {
            mutate {
              replace => {
                "principal.user.userid" => "%{username}"
              }
              on_error => "username_empty"
            }
          }
        }
        else if [action] in ["Starting","Stopping"] or [description] =~ "(Starting|Stopping)" {
          mutate {
            replace => {
              "mechanism" => "SERVICE"
            }
          }
          mutate {
            merge => {
              "extensions.auth.mechanism" => "mechanism"
            }
          }
          if [action] == "Starting" {
            mutate {
              replace => {
                "metadata.event_type" => "SERVICE_START"
              }
            }
          }
          else {
            mutate {
              replace => {
                "metadata.event_type" => "SERVICE_STOP"
              }
            }
          }
        }
        else if [action] =~ "Received .*from" {
          if [pid] != "" {
            mutate {
              replace => {
                "target.process.pid" => "%{pid}"
                "metadata.event_type" => "PROCESS_TERMINATION"
                "extensions.auth.type" => "MACHINE"
              }
              on_error => "pid_empty"
            }
          }
        }
      }
    }
    else if [application] in ["sudo", "su"] {
      grok {
        match => {
          "description" => [
            "%{DATA:srcUser} :.*?TTY=%{WORD:TTY}.*?PWD=(?P<PWD>.*);.*?USER=%{WORD:username1}.*?COMMAND=(?P<command>.*) %{IP:ip}"
            "%{DATA:srcUser} :.*?TTY=%{WORD:TTY}.*?PWD=(?P<PWD>.*);.*?USER=%{WORD:username1}.*?COMMAND=(?P<command>.*)\\s+#"
            "(?P<action>session (opened|closed)) for user %{WORD:username1} ?(by.*|)"
            "(?P<action>expired password) for user (?P<username1>.*?) \\((?P<reason>.*)\\)"
          ]
        }
        overwrite => ["command","username1","srcUser","action","TTY","PWD","reason", "ip"]
        on_error => "sudo_grok_fail"
      }

      mutate {
        replace => {
          "metadata.description" => "%{description}"
        }
        on_error => "description_empty"
      }
      if [ip] != "" {
        grok {
          match => {
            "ip" => "%{IP:ip}"
          }
          overwrite => ["ip"]
          on_error => "ip_grok_failure"
        }
        if ![ip_grok_failure] {
          mutate {
            merge => {
              "principal.ip" => "ip"
              "principal.asset.ip" => "ip"
            }
            on_error => "ip_empty"
          }
        }
      }
      if [TTY] not in ["","unknown"] {
        mutate {
          replace => {
            "tty_label.value" => "%{TTY}"
          }
          on_error => "tty_label_empty"
        }
        if ![tty_label_empty] {
          mutate {
            replace => {
              "tty_label.key" => "tty"
            }
          }
          mutate {
            merge => {
              "security_result.about.labels" => "tty_label"
            }
            on_error => "tty_label_not_available"
          }
        }
      }
      if [command] != "" {
        mutate {
          replace => {
            "target.process.command_line" => "%{command}"
          }
          on_error => "command_empty"
        }
      }

      if [PWD] not in ["","/ "] {
        mutate {
          replace => {
            "target.process.file.full_path" => "%{PWD}"
          }
          on_error => "PWD_empty"
        }
      }
      if [srcUser] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{srcUser}"
            "metadata.event_type" => "USER_UNCATEGORIZED"
          }
          on_error => "srcUser_empty"
        }
      }
      if [username1] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{username1}"
          }
          on_error => "username1_empty"
        }
      }
      if [action] =~ "closed" {
        mutate {
          replace => {
            "metadata.event_type" => "USER_LOGOUT"
            "_action" => "BLOCK"
          }
        }
      }
      else if [action] =~ "opened"{
        mutate {
          replace => {
            "metadata.event_type" => "USER_LOGIN"
            "security_action" => "ALLOW"
          }
        }
      }
      else if [action] == "expired password" {
        mutate {
          replace => {
            "metadata.event_type" => "USER_LOGIN"
            "security_result.summary" => "%{reason}"
            "security_action" => "BLOCK"
          }
        }
      }

      mutate {
        replace => {
          "mechanism" => "USERNAME_PASSWORD"
        }
      }
      if [security_action] != "" {
        mutate {
          merge => {
            "security_result.action" => "security_action"
          }
          on_error => "security_action_empty"
        }
      }
      mutate {
        merge => {
          "extensions.auth.mechanism" => "mechanism"
        }
        on_error => "mechanism_empty"
      }
      mutate {
        replace => {
          "principal.platform" => "LINUX"
        }
      }
    }
    if [hostname] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{hostname}"
          "principal.asset.hostname" => "%{hostname}"
          "has_principal" => "true"
        }
        on_error => "Hostname_empty"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp","yyyy-MM-dd HH:mm:ss", "MMM dd HH:mm:ss", "MMM  dd HH:mm:ss","MMM d HH:mm:ss","ISO8601"]
      on_error => "time_failure"
    }
  }
  else if [time] != "" {
    date {
      match => ["time", "MMM dd HH:mm:ss", "MMM  dd HH:mm:ss","MMM d HH:mm:ss"]
      rebase => true
      on_error => "time_failure"
    }
  }


  if [column1] != "" {
    date {
      match => ["column1","yyyy-MM-dd HH:mm:ss"]
      on_error => "time_failure1"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" and [has_user] == "true" and ([metadata][event_type] == "GENERIC_EVENT" or [metadata][event_type] == "") {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
      }
    }
  } else if [has_principal] == "true" and [has_target] == "true" and ([metadata][event_type] == "GENERIC_EVENT" or [metadata][event_type] == "") {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if [has_principal] == "true" and [has_target] == "false" and ([metadata][event_type] == "GENERIC_EVENT" or [metadata][event_type] == "") {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{application}"
      }
      on_error => "application_empty"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "RSA"
      "metadata.product_name" => "RSA SECURID"
    }
  }

  mutate {
    rename => {
      "extensions" => "event.idm.read_only_udm.extensions"
      "target" => "event.idm.read_only_udm.target"
      "metadata" => "event.idm.read_only_udm.metadata"
      "network" => "event.idm.read_only_udm.network"
      "principal" => "event.idm.read_only_udm.principal"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
