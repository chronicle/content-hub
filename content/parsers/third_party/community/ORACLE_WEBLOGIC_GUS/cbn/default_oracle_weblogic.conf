# Product: ORACLE_WEBLOGIC
# Category: Web server logs
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2025-01-20
# Copyright 2025 Chronicle LLC

filter {
  mutate {
    replace => {
      "event_type" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_network" => "false"
      "has_network_http" => "false"
      "has_prin_user" => "false"
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "princ_ip" => ""
      "date_time" => ""
      "uri_method" => ""
      "path" => ""
      "protocol" => ""
      "res_code" => ""
      "vlan" => ""
      "log_level" => ""
      "kernel" => ""
      "log_id" => ""
      "severity_value" => ""
      "desc" => ""
      "tar_host" => ""
      "partid" => ""
      "domain" => ""
      "src_host" => ""
      "user_id" => ""
    }
  }

  mutate {
    gsub => ["message",'\"','']
  }
  mutate {
    gsub => ["message",'\\t', ' ']
  }
  grok {
    match => {
      "message" => [
        '%{IP:princ_ip} - - \\[%{DATA:date_time}\\]\\s+%{DATA:uri_method}\\s+%{DATA:path}\\s+%{URIPROTO:protocol}/%{DATA}\\s+%{INT:res_code}\\s+%{INT:vlan}',
        '<%{INT}>%{TIMESTAMP_ISO8601:date_time} %{HOSTNAME:src_host} %{WORD:domain} ####<%{DATA}> <%{LOGLEVEL:log_level}> <%{DATA}> <<%{DATA:kernel}>> <> <%{DATA:log_id}> <%{INT}> <\\[severity-value: %{INT:severity_value}\\] %{GREEDYDATA} \\[partition-id: %{INT:partid}] \\[partition-name: %{HOSTNAME:tar_host}] >%{GREEDYDATA:desc}',
        '<%{INT}>%{MONTH} %{INT} %{TIME} %{HOSTNAME:src_host} %{WORD:domain}: \\[ID %{INT:user_id} %{DATA}] %{DATA:date_time} %{IP:princ_ip}  - %{DATA:uri_method}\\s+%{DATA:path}\\s+%{INT:res_code}',
        '<%{INT}>%{MONTH} %{INT} %{TIME} %{HOSTNAME:src_host} %{WORD:domain}: \\[ID %{INT:user_id} %{DATA}] %{IP:princ_ip} - - \\[%{DATA:date_time}]%{DATA:uri_method} / %{INT:res_code} %{INT:vlan}',
        "<%{INT}>%{MONTH} %{INT} %{TIME} %{HOSTNAME:src_host} %{WORD:domain}: \\[ID %{INT:user_id} %{DATA}\\] %{TIMESTAMP_ISO8601:date_time} %{IP:princ_ip} - %{DATA:uri_method} %{DATA:path} %{INT:res_code}"
      ]
    }
    overwrite => ["princ_ip","date_time","uri_method", "path", "protocol", "res_code", "vlan", "src_host", "domain", "log_level", "kernel", "log_id", "severity_value", "desc", "tar_host", "partid", "user_id"]
    on_error => "invalid_syslog"
  }
  if ![invalid_syslog] {
    if [princ_ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "princ_ip"
          "principal.asset.ip" => "princ_ip"
        }
        on_error => "invalid_principal_ip"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    if [date_time] != "" {
      mutate {
        gsub => ["date_time", "\\t", " "]
      }
      date {
        match => ["date_time", "dd/MMM/yyyy:HH:mm:ss Z", "dd/MMM/yyyy:HH:mm:ss","yyyy-MM-ddTHH:mm:ssZZ", "yyyy-MM-dd HH:mm:ss"]
        on_error => "date_not_matched"
      }
    }
    if [uri_method] != "" {
      mutate {
        replace => {
          "network.http.method" => "%{uri_method}"
          "has_network" => "true"
        }
        on_error => "no_uri_method"
      }
    }
    if [path] != "" {
      mutate {
        replace => {
          "network.http.referral_url" => "%{path}"
          "has_network" => "true"
        }
        on_error => "no_uri_path"
      }
    }
    if [protocol] == "HTTP" {
      mutate {
        replace => {
          "network.application_protocol" => "%{protocol}"
          "has_network_http" => "true"
        }
        on_error => "no_uri_protocol"
      }
    }
    if [res_code] != "" {
      mutate {
        replace => {
          "network.http.response_code" => "%{res_code}"
          "has_network" => "true"
        }
        on_error => "no_uri_res_code"
      }
      mutate {
        convert => {
          "network.http.response_code" => "integer"
        }
        on_error => "http_response_code_conversion_failure"
      }
    }
    if [vlan] != "" {
      mutate {
        replace => {
          "vlan_label.key" => "vlan"
          "vlan_label.value" => "%{vlan}"
        }
        on_error => "no_vlan"
      }
      if ![no_vlan] {
        mutate {
          merge => {
            "security_result.detection_fields" => "vlan_label"
          }
          on_error => "no_vlan_label"
        }
      }
    }
    if [src_host] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{src_host}"
          "principal.asset.hostname" => "%{src_host}"
          "has_principal" => "true"
        }
        on_error => "no_src_host"
      }
    }
    if [domain] != "" {
      mutate {
        replace => {
          "principal.administrative_domain" => "%{domain}"
        }
        on_error => "no_domain"
      }
    }
    if [log_level] != "" {
      mutate {
        uppercase => ["log_level"]
      }
      if [log_level] in ["DEBUG", "INFO", "AUDIT"] {
        mutate {
          replace => {
            "security_result.severity" => "INFORMATIONAL"
          }
        }
      }
      else if [log_level] == "ERROR" {
        mutate {
          replace => {
            "security_result.severity" => "ERROR"
          }
        }
      }
      else if [log_level] == "WARNING" {
        mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      }
      mutate {
        replace => {
          "security_result.severity_details" => "%{log_level}"
        }
        on_error => "no_log_level"
      }
    }
    if [kernel] != "" {
      mutate {
        replace => {
          "kernel_label.key" => "kernel"
          "kernel_label.value" => "%{kernel}"
        }
        on_error => "no_kernel"
      }
      if ![no_kernel] {
        mutate {
          merge => {
            "security_result.detection_fields" => "kernel_label"
          }
          on_error => "no_kernel_label"
        }
      }
    }
    if [log_id] != "" {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{log_id}"
        }
        on_error => "no_log_id"
      }
    }
    if [severity_value] != "" {
      if [severity_value] in ["1", "2"] {
        mutate {
          replace => {
            "security_result_token.severity" => "HIGH"
          }
        }
      }
      else if [severity_value] in ["3", "4"] {
        mutate {
          replace => {
            "security_result_token.severity" => "MEDIUM"
          }
        }
      }
      else if [severity_value] in ["5", "6", "7"] {
        mutate {
          replace => {
            "security_result_token.severity" => "LOW"
          }
        }
      }
      else {
        mutate {
          replace => {
            "sev_label.key" => "Severity"
            "sev_label.value" => "%{severity_value}"
          }
          on_error => "no_severity"
        }
        if ![no_severity] {
          mutate {
            merge => {
              "security_result.detection_fields" => "sev_label"
            }
            on_error => "no_severity_label"
          }
        }
      }
    }
    if [partid] not in ["0",""] {
      mutate {
        convert => {
          "partid" => "string"
        }
        on_error => "partid_conversion_failure"
      }
      mutate {
        replace => {
          "partid_label.key" => "partition-id"
          "partid_label.value" => "%{partid}"
        }
        on_error => "no_partid"
      }
      if ![no_partid] {
        mutate {
          merge => {
            "security_result.detection_fields" => "partid_label"
          }
          on_error => "no_partid_label"
        }
      }
    }
    if [tar_host] != "" {
      mutate {
        replace => {
          "target.hostname" => "%{tar_host}"
          "target.asset.hostname" => "%{tar_host}"
          "has_target" => "true"
        }
      }
    }
    if [desc] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{desc}"
        }
        on_error => "no_desc"
      }
    }
    if [user_id] != "" {
      mutate {
        convert => {
          "user_id" => "string"
        }
        on_error => "user_id_conversion_failure"
      }
      mutate {
        replace => {
          "principal.user.userid" => "%{user_id}"
          "has_prin_user" => "true"
        }
        on_error => "no_user_id"
      }
    }
  }

  if [has_principal] == "true" and [has_target] == "true" and
  [has_network_http] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_prin_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "invalid_event_type"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "ORACLE_WEBLOGIC"
      "metadata.product_name" => "ORACLE_WEBLOGIC"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "invalid_security_result"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
