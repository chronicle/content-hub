# Product: TrendMicro Apex Central
# Category: Endpoint
# Supported Format: CEF
# Reference: https://docs.trendmicro.com/en-us/documentation/article/trend-vision-one-cef-intrusion-preven
# https://docs.trendmicro.com/en-us/documentation/article/trend-micro-apex-central-patch-6-cef-behavior-monitor
# https://docs.trendmicro.com/en-us/documentation/article/trend-micro-apex-central-patch-6-cef-web-security-log
# Last Updated: 2026-09-02
# Copyright 2026 Google SecOps


filter {
  mutate{
    replace => {
      "event_attributes" => ""
      "cef_event_attributes" => ""
      "header_version" =>""
      "product_name" => ""
      "product_version" => ""
      "event_id" => ""
      "deviceExternalId" => ""
      "event_name" => ""
      "severity" => ""
      "rt" => ""
      "cs3" => ""
      "smac" => ""
      "cn1" => ""
      "spt" => ""
      "app" => ""
      "dmac" => ""
      "cs3Label" => ""
      "princ_ip" => ""
      "dpt"=> ""
      "duser" => ""
      "suser" => ""
      "act" => ""
      "deviceDirection" => ""
      "cn4" => ""
      "proto" => ""
      "cs1" => ""
      "cs2" => ""
      "security_result" => ""
      "c6a2" => ""
      "c6a3" => ""
      "TMCMLogDetectedIP" => ""
      "sproc" => ""
      "src" => ""
      "version" => ""
      "shost" => ""
      "vendor" => ""
      "dvchost" => ""
      "platform" => ""
      "fileHash" => ""
      "fname" => ""
      "patch_level" => ""
      "dntdom" => ""
      "year" => ""
      "month" => ""
      "date" => ""
      "hour" => ""
      "minutes" => ""
      "seconds" => ""
      "dhost" => ""
      "request" => ""
      "cs6Label" => ""
      "filePath" => ""
      "product_versionLabel" => ""
      "msg" => ""
      "cat" => ""
      "cnt" => ""
      "cs4" => ""
      "cn1Label" => ""
      "domain" => ""
      "cn2Label" => ""
      "cn2" => ""
      "cs1Label" => ""
      "cs4Label" => ""
      "cn3Label" => ""
      "cn3" => ""
      "c6a3Label" => ""
      "devicePayloadId" => ""
      "TMCMdevicePlatform" => ""
      "has_target_process" => "false"
      "deviceNtDomain" => ""
    }
  }
  grok {
    match => {
      "message" => ["CEF:(?<header_version>[^\\|]+)\\|(?<vendor>[^\\|]+)\\|(?<product_name>[^\\|]+)\\|(?<product_version>[^\\|]+)\\|(?<event_id>[^\\|]+)\\|(?<event_name>[^\\|]+)\\|(?<severity>[^\\|]+)\\|%{GREEDYDATA:cef_event_attributes}", "(?<header_version>[^\\|]+)\\|(?<vendor>[^\\|]+)\\|(?<product_name>[^\\|]+)\\|(?<product_version>[^\\|]+)\\|(?<event_id>[^\\|]+)\\|(?<event_name>[^\\|]+)\\|(?<severity>[^\\|]+)\\|%{GREEDYDATA:event_attributes}"]
    }
    overwrite => ["header_version", "vendor", "product_name", "product_version", "event_id", "event_name","severity", "event_attributes", "cef_event_attributes", "devicepayloadId"]
    on_error => "invalid_grok"
  }

  mutate {
    gsub => ["event_attributes", "(\\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
  }
  kv {
    source => "event_attributes"
    field_split => "^"
    value_split => "="
    whitespace => "strict"
    on_error => "invalid_kv_values"
  }

  if [invalid_grok] or [invalid_kv_values] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [cef_event_attributes] != "" {
    mutate {
      gsub => ["cef_event_attributes","(\\\s+)([0-9a-zA-Z_.-]+?)=","^$2="]
    }
    kv {
      source => "cef_event_attributes"
      field_split => "^"
      value_split => "="
      on_error => "invalid_kv1"
    }
  }

  mutate {
    replace => {
      "var_eventFormatVersion.value.string_value" => "%{header_version}"
    }
    on_error => "no_eventFormatVersion"
  }
  if ![no_eventFormatVersion] and
  [var_eventFormatVersion][value][string_value] != "" {
    mutate {
      replace => {
        "var_eventFormatVersion.key" =>
        "eventFormatVersion"
      }
      on_error => "no_eventFormatVersion"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" =>
        "var_eventFormatVersion"
      }
    }
  }

  if [vendor] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor}"
      }
      on_error => "vendor_error"
    }
  }

  if [product_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product_name}"
      }
      on_error => "product_name_error"
    }
  }

  mutate {
    replace => {
      "var_severity.value.string_value" => "%{severity}"
    }
    on_error => "no_severity"
  }
  if ![no_severity] and
  [var_severity][value][string_value] != "" {
    mutate {
      replace => {
        "var_severity.key" =>
        "severity"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" =>
        "var_severity"
      }
    }
  }

  if [rt] != "" {
    grok {
      match => {
        "rt" => ["(?<month>[^ ]+) (?<date>[^ ]+) (?<year>[^ ]+) (?<hour>[^:]+):(?<minutes>[^:]+):(?<seconds>[^ ]+)"]
      }
      overwrite => ["month", "date", "year", "hour", "minutes", "seconds",
      "zone"]
      on_error => "invalid_grok_time"
    }
    if [year] != "" and [month] != "" and [date] != ""
    and [hour] != "" and [minutes] != "" and [seconds] != ""{
      mutate {
        replace => {
          "rt" =>
          "%{year}-%{month}-%{date} %{hour}:%{minutes}:%{seconds}"
        }
      }
    }
    date {
        match => ["rt", "yyyy-MMM-dd HH:mm:ss","MMM dd yyyy HH:mm:ss","yyyy-MM-dd HH:mm:ss"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "no_timestamp"
    }
  }

  if [dvchost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{dvchost}"
      }
      on_error => "hostname_error"
    }
  }

  if [devicePayloadId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{devicePayloadId}"
      }
      on_error => "devicePayloadId_error"
    }
  }

  mutate {
    replace => {
      "var_deviceFacility.value.string_value" => "%{deviceFacility}"
    }
    on_error => "no_deviceFacility"
  }
  if ![no_deviceFacility] and
  [var_deviceFacility][value][string_value] != "" {
    mutate {
      replace => {
        "var_deviceFacility.key" =>
        "ProductName"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" =>
        "var_deviceFacility"
      }
    }
  }

  mutate {
    replace => {
      "var_TMCMLogDetectedHost.value.string_value" => "%{TMCMLogDetectedHost}"
    }
    on_error => "no_TMCMLogDetectedHost"
  }
  if ![no_TMCMLogDetectedHost] and
  [var_TMCMLogDetectedHost][value][string_value] != "" {
    mutate {
      replace => {
        "var_TMCMLogDetectedHost.key" =>
        "TMCMLogDetectedHost"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" =>
        "var_TMCMLogDetectedHost"
      }
    }
  }

  mutate {
    replace => {
      "var_apexCentralHost.value.string_value" => "%{ApexCentralHost}"
    }
    on_error => "no_apexCentralHost"
  }
  if ![no_apexCentralHost] and
  [var_apexCentralHost][value][string_value] != "" {
    mutate {
      replace => {
        "var_apexCentralHost.key" =>
        "ApexCentralHostName"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" =>
        "var_apexCentralHost"
      }
    }
  }

  grok {
    match => {
      "TMCMdevicePlatform" => ["(?<platform>[^ ]+) (?<version>[^(]+) \\((?<patch_level>[^)]+)"]
    }
    overwrite => ["platform", "version", "patch_level"]
    on_error => "invalid_grok_platform"
  }

  if [platform] != "" {
    if [platform] == "Windows" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.platform_software.platform"
          => "WINDOWS"
        }
        on_error => "platform_error"
      }
    }
  }

  mutate{
    replace => {
      "version" => "%{platform} %{version}"
    }
    on_error => "no_version"
  }
  if [version] not in [""," "] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.platform_software.platform_version"
        => "%{version}"
      }
      on_error => "version_error"
    }
  }

  if [patch_level] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.platform_software.platform_patch_level"
        => "%{patch_level}"
      }
      on_error => "patch_level_error"
    }
  }

  if [deviceNtDomain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.administrative_domain" => "%{deviceNtDomain}"
      }
      on_error => "deviceNtDomain_error"
    }
  }

  if [dhost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{dhost}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{dhost}"
      }
      on_error => "hostname_error"
    }
  }
  if [dntdom] != "" {
    mutate {
      replace => {
        "dntdom_label.value.string_value" => "%{dntdom}"
        "dntdom_label.key" => "ApexOneDomainHierarchy"
      }
      on_error => "administrative_domain_error"
    }
    if ![administrative_domain_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "dntdom_label"
        }
        on_error => "administrative_domain_error"
      }
    }
  }

  if [event_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_id}"
      }
      on_error => "event_id_error"
    }
  }
  if [event_name] != "" {
    mutate {
      replace => {
        "security_result.threat_name" => "%{event_name}"
      }
      on_error => "event_name_error"
    }
  }
  if [filePath] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{filePath}"
      }
      on_error => "file_path_error"
    }
  }
  if [cs3] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{cs3}"
      }
      on_error => "cs3_error"
    }
  }
  if [cs6Label] != "" and [cs6] != "" {
    mutate {
      replace => {
        "additional_cs6.key" => "%{cs6Label}"
        "additional_cs6.value.string_value" => "%{cs6}"
      }
      on_error => "cs6_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_cs6"
      }
      on_error => "cs6_error"
    }
  }
  if [product_version] != "" {
    mutate {
      replace => {
        "additional_product_version.key" => "Applicance version"
        "additional_product_version.value.string_value" => "%{product_version}"
      }
      on_error => "product_version_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_product_version"
      }
      on_error => "product_version_error"
    }
  }
  if [cat] != "" {
    mutate {
      replace => {
        "additional_cat.key" => "logtype"
        "additional_cat.value.string_value" => "%{cat}"
      }
      on_error => "cat_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_cat"
      }
      on_error => "cat_merged_error"
    }
  }
  if [msg] != "" {
    mutate {
      replace => {
        "additional_msg.key" => "Message"
        "additional_msg.value.string_value" => "%{msg}"
      }
      on_error => "msg_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_msg"
      }
      on_error => "msg_merged_error"
    }
  }
  if [dvchost] != "" {
    mutate {
      replace => {
        "additional_dvchost.key" => "Product server name"
        "additional_dvchost.value.string_value" => "%{dvchost}"
      }
      on_error => "dvchost_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_dvchost"
      }
      on_error => "dvchost_merged_error"
    }
  }
  mutate {
    replace => {
      "malicious_file_ct.malicious_count" => "%{cnt}"
    }
    on_error => "no_malicious_file_ct"
  }
  if ![no_malicious_file_ct] and [cnt] != "" {
    mutate {
      convert => {
        "malicious_file_ct.malicious_count" => "integer"
      }
      on_error => "malicious_file_ct_conversion_error"
    }
    if ![malicious_file_ct_conversion_error] {
      mutate {
        merge => {
          "security_result.verdict_info" => "malicious_file_ct"
        }
      }
    }
  }
  if [cs4] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "cs4"
      }
      on_error => "cs4_error"
    }
  }

  if [shost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.src.hostname" => "%{shost}"
      }
      on_error => "shost_error"
    }
  }
  if [duser] != "" {
    grok {
      match => {
        "duser" => [
          "%{DATA:domain}\\\\\\\\%{GREEDYDATA:duser}"
        ]
      }
      overwrite => ["duser","domain"]
      on_error => "duser_grok_error"
    }
  }

  if [duser] != "" {
    mutate {
      replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{duser}"
      }
      on_error => "duser_error"
    }
  }
  if [domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
      }
      on_error => "administrative_domain_error"
    }
  }
  if [duser] != "" {
    mutate {
      replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{duser}"
      }
      on_error => "duser_error_target"
    }
  }

  if [suser] != "" {
    mutate {
      replace => {
          "event.idm.read_only_udm.src.user.userid" => "%{suser}"
      }
      on_error => "suser_error"
    }
  }

  if [cs1Label] == "VLF_FunctionCode" and [cs1] != "" {
    mutate {
      replace => {
        "var_cs1_label.value.string_value" => "%{cs1}"
        "var_cs1_label.key" => "ScanType"
      }
      on_error => "no_cs1"
    }
    if ![no_cs1] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "var_cs1_label"
        }
        on_error => "no_cs1_label"
      }
    }
  }
  else if [cs1]!= ""{
    if[cs1Label] == "Reason/Rule"{
      mutate {
        replace => {
          "security_result.rule_name" => "%{cs1}"
        }
        on_error => "rule_name_error"
      }
    }
    else {
      mutate {
      replace => {
        "var_cs1.value.string_value" => "%{cs1}"
      }
      on_error => "no_cs1"
    }
    if ![no_cs1] and
    [var_cs1][value][string_value] != "" {
      mutate {
        replace => {
          "var_cs1.key" =>
          "%{cs1Label}"
        }
        on_error => "no_cs1Label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
          "var_cs1"
        }
      }
    }
    }
  }

  if [TMCMLogDetectedIP] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "TMCMLogDetectedIP"
        "event.idm.read_only_udm.principal.asset.ip" => "TMCMLogDetectedIP"
      }
      on_error => "TMCMLogDetectedIP_error"
    }
  }

  if [cs1] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{cs1}"
      }
      on_error => "cs1_error"
    }
  }

  if [cs2] != "" {
    grok {
        match => {
        "cs2" => ["%{IPV4:princ_ip}"]
      }
      overwrite => ["princ_ip"]
      on_error => "invalid_cs2_ip"
    }
    if ![invalid_cs2_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "princ_ip"
        }
      }
    }
    else{
      mutate {
        replace => {
          "var_cs2.value.string_value" => "%{cs2}"
        }
      on_error => "no_cs2"
      }
      if ![no_cs2] and
      [var_cs2][value][string_value] != "" and [cs2Label] != "" {
        mutate {
          replace => {
            "var_cs2.key" =>
            "%{cs2Label}"
          }
          on_error => "no_cs2Label"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" =>
            "var_cs2"
          }
        }
      }
    }
  }

    if [cs3Label]=="Command" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.full_path" => "%{cs3}"
            "has_target_process" => "true"
          }
          on_error => "cs3_error"
        }
    }
    if [sproc] != "" {
      if [cs3]=="Process" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.full_path" => "%{sproc}"
            "has_target_process" => "true"
          }
          on_error => "sproc_error"
        }
      }
      else if [cs3]=="File system" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.file.full_path" => "%{sproc}"
          }
          on_error => "sproc_error"
        }
      }
    }

    mutate {
      replace => {
        "var_cs5.value.string_value" => "%{cs5}"
      }
      on_error => "no_cs5"
    }
    if ![no_cs5] and
    [var_cs5][value][string_value] != "" and [cs5Label] != "" {
      mutate {
        replace => {
          "var_cs5.key" =>
          "%{cs5Label}"
        }
        on_error => "no_cs5Label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
          "var_cs5"
        }
      }
    }

    if [act] != "" {
      if [act] in ["2", "Assessment (Block)", "Block"] {
          mutate {
            replace => {
              "action" => "BLOCK"
            }
          }
      } else {
        mutate {
            replace => {
            "security_result.action_details" => "%{act}"
          }
          on_error => "act_details_error"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "act_error"
      }
    }
  mutate {
    lowercase => ["fileHash"]
  }
  if [event_id] =~ "(?i)spyware" {
    mutate {
      replace => {
        "security_result.action_details" => "%{cs5}"
      }
      on_error => "cs5_details_error"
    }
  }
  if [fileHash]!= "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.file.sha1" => "%{fileHash}"
      }
      on_error => "fileHash_error"
    }
  }
  if [fname]!= "" {
    mutate{
      merge => {
        "event.idm.read_only_udm.target.file.names" => "fname"
      }
      on_error => "fname_error"
    }
  }

  if [deviceExternalId] != "" {
    mutate {
      replace => {
        "var_deviceExternalId.value.string_value" => "%{deviceExternalId}"
      }
      on_error => "no_deviceExternalId"
    }
    if ![no_deviceExternalId] and
    [var_deviceExternalId][value][string_value] != "" {
      mutate {
        replace => {
          "var_deviceExternalId.key" =>
          "deviceExternalId"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
          "var_deviceExternalId"
        }
      }
    }
  }

  if [c6a3] != ""{
    mutate {
      replace => {
        "var_c6a3.value.string_value" => "%{c6a3}"
      }
      on_error => "no_c6a3"
    }
    if ![no_c6a3] and
    [var_c6a3][value][string_value] != "" and [c6a3Label] != "" {
      mutate {
        replace => {
          "var_c6a3.key" =>
          "%{c6a3Label}"
        }
        on_error => "no_c6a3Label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
          "var_c6a3"
        }
      }
    }
  }

  if [c6a3Label] == "SLF_DestinationIPv6" and [c6a3] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "c6a3"
        "event.idm.read_only_udm.target.asset.ip" => "c6a3"
      }
      on_error => "c6a3_error"
    }
  }

  if [cn1Label] == "Pattern" and [cn1] != "" {
    mutate {
      replace => {
        "var_cn1_label.value.string_value" => "%{cn1}"
        "var_cn1_label.key" => "PatternNumber"
      }
      on_error => "no_cn1"
    }
    if ![no_cn1] {
      mutate {
