      on_error => "no_cs3"
    }
    if ![no_cs3] and
    [var_cs3][value][string_value] != "" and [cs3Label] != "" {
      mutate {
        replace => {
          "var_cs3.key" =>
          "%{cs3Label}"
        }
        on_error => "no_cs3Label"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" =>
          "var_cs3"
        }
      }
    }
  }

  if [product_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{product_version}"
      }
      on_error => "product_version_error"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

