# Product: Broadcom SSL VA
# Category: SSL Visibility
# Supported Format: SYSLOG
# Reference: https://techdocs.broadcom.com/content/dam/broadcom/techdocs/symantec-security-software/web-and-network-security/ssl-visibility/4-4/generated-pdfs/SSLV_Admin_44x.pdf
# Last Updated: 2024-06-25
# Copyright 2022 Chronicle LLC

filter {
  mutate {
    replace => {
      "timestamp" => ""
      "hostname" => ""
      "event_type" => ""
      "pid" => ""
      "segment_id" => ""
      "prodlogid" => ""
      "srcip" => ""
      "srcPort" => ""
      "destip" => ""
      "destport" => ""
      "tlsversion" => ""
      "ciphersuite" => ""
      "action" => ""
      "rule" => ""
      "status" => ""
      "flag_list" => ""
      "metadata.event_type" => "GENERIC_EVENT"
      "smb_host" => ""
      "smb_uid" => ""
    }
  }

  grok {
    match => {
      "message" => ["%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlogid} %{IP:srcip}:%{DATA:srcPort} -> %{IP:destip}:%{DATA:destport} %{DATA:tlsversion} %{NOTSPACE:ciphersuite} %{DATA} --- %{DATA}: %{NOTSPACE} %{NOTSPACE:rule} %{NOTSPACE:action} %{WORD:status} %{GREEDYDATA:flag_list}",
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlog} %{IP:srcip}:%{DATA:srcport} -> %{IP:destip}:%{DATA:destport} %{DATA:tlsversion} %{NOTSPACE:ciphersuite} %{DATA} --- %{DATA}:\\s+%{NOTSPACE}\\s+%{NOTSPACE:rule}\\s+%{NOTSPACE:action} (?P<temp>(%{DATA}|)):%{WORD:tlssession}:%{WORD}:%{DATA:status} (?P<flag_list>\\(.*)",
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlog} %{IP:srcip}:%{DATA:srcport} -> %{IP:destip}:%{DATA:destport} %{DATA:tlsversion} %{NOTSPACE:ciphersuite} %{DATA} --- %{DATA}:\\s+%{NOTSPACE:rule} %{NOTSPACE:action} (?P<temp>(%{DATA}|)):%{WORD:tlssession}:%{WORD}:%{DATA:status} (?P<flag_list>\\(.*)"
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlog} %{IP:srcip}:%{DATA:srcport} -> %{IP:destip}:%{DATA:destport} %{DATA:tlsversion} %{NOTSPACE:ciphersuite} %{DATA} --- %{DATA}: %{NOTSPACE} %{NOTSPACE:rule} %{WORD:action}:%{DATA:status} (?P<flag_list>\\(.*)",
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlog} %{IP:srcip}:%{DATA:srcport} -> %{IP:destip}:%{DATA:destport} %{DATA:tlsversion} %{NOTSPACE:ciphersuite} ?(%{DATA}|) ?(---|) --- %{DATA}:\\s+%{NOTSPACE:rule} %{WORD:action}:%{DATA:status} (?P<flag_list>\\(.*)",
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlog} %{IP:srcip}:%{DATA:srcport} -> %{IP:destip}:%{DATA:destport} --- --- --- --- %{DATA}:\\s+%{NOTSPACE:rule} %{NOTSPACE:action} (?P<temp>(%{DATA}|)):%{WORD:tlssession}:%{WORD}:%{DATA:status} (?P<flag_list>\\(.*)",
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\]?(|\\*) %{DATA:prodlog} %{IP:srcip}:%{NUMBER:srcport} -> %{IP:destip}:%{NUMBER:destport} ?(|n/a n/a) --- --- %{DATA}:\\s+%{NOTSPACE:rule} %{NOTSPACE:action} (?P<temp>(%{DATA}|)):%{WORD:tlssession}:%{WORD}:%{DATA:status} (?P<flag_list>\\(.*)",
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlog} %{IP:srcip}:%{NUMBER:srcport} -> %{IP:destip}:%{NUMBER:destport} %{DATA:tlsversion} %{NOTSPACE:ciphersuite} %{DATA} %{DATA}:\\s+%{NOTSPACE} %{NOTSPACE:rule} %{NOTSPACE:action} (?P<temp>(%{DATA}|)):%{WORD:tlssession}:%{WORD}:%{DATA:status} (?P<flag_list>\\(.*)"
      "%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:event_type}\\[%{DATA:pid}\\]: \\[%{WORD:segment_id}:%{DATA}\\] %{DATA:prodlog} %{IP:srcip}:%{DATA:srcport} -> %{IP:destip}:%{DATA:destport} %{DATA:tlsversion} %{NOTSPACE:ciphersuite} %{DATA} --- %{DATA}:\\s+%{NOTSPACE:rule} %{WORD:action} %{WORD:status} (?P<flag_list>\\(.*)"]
    }
    overwrite => ["timestamp","hostname", "event_type", "pid", "segment_id", "prodlogid", "srcip", "srcPort", "destip", "destport", "tlsversion", "ciphersuite", "status", "action", "flag_list", "rule"]
    on_error => "grok_failure"
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "MMM dd HH:mm:ss", "MMM d HH:mm:ss", "ISO8601"]
      rebase => true
    }
  }
  mutate {
    replace => {
      "metadata.product_name" => "SSL Visibility"
      "metadata.vendor_name" => "Broadcom"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "target.application" => "%{event_type}"
      }
    }
  }

  if [pid] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{pid}"
      }
    }
  }

  if [segment_id] != "" {
    mutate {
      replace => {
        "about_segment_id.key" => "segment_id"
        "about_segment_id.value" => "%{segment_id}"
      }
      on_error => "segment_id_not_mapped"
    }

    if ![segment_id_not_mapped] {
      mutate {
        merge => {
          "about.labels" => "about_segment_id"
        }
      }
    }
  }

  if [prodlogid] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{prodlogid}"
      }
    }
  }

  if [srcip] != "" {
    mutate {
      merge => {
        "principal.ip" => "srcip"
      }
    }
  }
  if [srcPort] != "" {
    mutate {
      convert => {
        "srcPort" => "integer"
      }
    }
    mutate {
      rename => {
        "srcPort" => "principal.port"
      }
    }
  }

  if [destip] != "" {
    mutate {
      merge => {
        "target.ip" => "destip"
      }
    }
  }
  if [destport] != "" {
    mutate {
      convert => {
        "destport" => "integer"
      }
    }
    mutate {
      rename => {
        "destport" => "target.port"
      }
    }
  }
  if [tlsversion] not in ["","---"] {
    mutate {
      replace => {
        "network.tls.version" => "%{tlsversion}"
      }
    }
  }
  if [ciphersuite] not in ["","---"] {
    mutate {
      replace => {
        "network.tls.cipher" => "%{ciphersuite}"
      }
    }
  }
  if [status] =~ "(?)Success" {
    mutate {
      replace => {
        "sec_action" => "ALLOW"
      }
      merge => {
        "security_result.action" => "sec_action"
      }
    }
  }
  else if [status] != "" {
    mutate {
      replace => {
        "sec_action" => "BLOCK"
      }
      merge => {
        "security_result.action" => "sec_action"
      }
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
        "category" => "SOFTWARE_MALICIOUS"
      }
    }
  }
  mutate {
    merge => {
      "security_result.category" => "category"
    }
    on_error => "category_not_mapped"
  }

  if [rule] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{rule}"
      }
    }
  }
  if [flag_list] != "" {
    mutate {
      replace => {
        "about_flag_list.key" => "Flag list"
        "about_flag_list.value" => "%{flag_list}"
      }
      on_error => "flag_list_not_mapped"
    }

    if ![segment_id_not_mapped] {
      mutate {
        merge => {
          "about.resource.attribute.labels" => "about_flag_list"
        }
      }
    }
  }
  mutate {
    gsub => ["flag_list", "\\s(\\w+)=", "#$1="]
  }
  kv {
    source => "flag_list"
    field_split => "#"
    value_split => "="
  }

  if [smb_host] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{smb_host}"
      }
    }
  }
  if [smb_uid] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{smb_uid}"
      }
    }
  }
  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "security_result"
    }
    on_error => "security_result_merge_error"
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.about" => "about"
    }
    on_error => "_catch_about_merge_exception"
  }

  if [srcip] != "" and [destip] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  mutate {
    rename => {
     "metadata" => "event.idm.read_only_udm.metadata"
     "principal" => "event.idm.read_only_udm.principal"
     "target" => "event.idm.read_only_udm.target"
     "network" => "event.idm.read_only_udm.network"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

