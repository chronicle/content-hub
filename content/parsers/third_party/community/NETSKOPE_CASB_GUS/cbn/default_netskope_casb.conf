  mutate {
    convert => {
      "__buf_len" => "string"
    }
    on_error => "__buf_len_convert_failed"
  }
  if [__buf_len] != "" {
    mutate {
      replace => {
        "__buf_len_label.value.string_value" => "%{__buf_len}"
      }
      on_error => "__buf_len_failed"
    }
    mutate {
      replace => {
        "__buf_len_label.key" => "__buf_len"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "__buf_len_label"
      }
      on_error => "__buf_len_label_failed"
    }
  }
  mutate {
    replace => {
      "intermediary.location.name" => "%{netskope_pop}"
    }
    on_error => "intermediary_location_name_failed"
  }
  if [page_site] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{page_site}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{page_site}"
        "has_target" => "true"
      }
      on_error => "target_hostname_failed"
    }
  }
  if [original_destip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "_original_destip"
        "event.idm.read_only_udm.target.asset.ip" => "_original_destip"
      }
      on_error => "target_ip_failed"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.target.domain.name" => "%{domain}"
    }
    on_error => "target_domain_name_failed"
  }
  if [city] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.city" => "%{city}"
      }
      on_error => "city_failed"
    }
  }
  if [region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.state" => "%{region}"
      }
      on_error => "region_failed"
    }
  }
  if [country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{country}"
      }
      on_error => "country_failed"
    }
  }
  mutate {
    convert => {
      "latitude" => "string"
    }
    on_error => "latitude_string_convert_failed"
  }
  if [latitude] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.region_coordinates.latitude" => "%{latitude}"
      }
      on_error => "latitude_failed"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.location.region_coordinates.latitude" => "float"
      }
      on_error => "latitude_float_convert_failed"
    }
  }
  mutate {
    convert => {
      "longitude" => "string"
    }
    on_error => "longitude_string_convert_failed"
  }
  if [longitude] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.region_coordinates.longitude" => "%{longitude}"
      }
      on_error => "longitude_failed"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.location.region_coordinates.longitude" => "float"
      }
      on_error => "longitude_float_convert_failed"
    }
  }
  mutate {
    convert => {
      "asn" => "string"
    }
    on_error => "asn_convert_failed"
  }
  if [asn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.asn" => "%{asn}"
      }
      on_error => "asn_failed"
    }
  }
  if [isp] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.carrier_name" => "%{isp}"
      }
      on_error => "isp_failed"
    }
  }
  if [organization] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.organization_name" => "%{organization}"
      }
      on_error => "organization_failed"
    }
  }
  if [client_version] != "" {
    mutate {
      replace => {
        "software.version" => "%{client_version}"
      }
      on_error => "client_version_failed"
    }
  }
  else if [host_info][client_version] != "" {
    mutate {
      replace => {
        "software.version" => "%{host_info.client_version}"
      }
      on_error => "host_info_client_version_failed"
    }
  }
  if [software] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.asset.software" => "software"
      }
      on_error => "software_merge_failed"
    }
  }
  if [device_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.product_object_id" => "%{device_id}"
      }
      on_error => "device_id_failed"
    }
  }
  if [last_connected_from_private_ip] != "" {
    grok {
      match => {
        "last_connected_from_private_ip" => "%{IP:last_connected_from_private_ip}"
      }
      overwrite => ["last_connected_from_private_ip"]
      on_error => "last_connected_from_private_ip_grok_failed"
    }
    if ![last_connected_from_private_ip_grok_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "last_connected_from_private_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "last_connected_from_private_ip"
        }
        on_error => "last_connected_from_private_ip_failed"
      }
      if ![last_connected_from_private_ip_failed] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [last_connected_from_public_ip] != "" {
    grok {
      match => {
        "last_connected_from_public_ip" => "%{IP:last_connected_from_public_ip}"
      }
      overwrite => ["last_connected_from_public_ip"]
      on_error => "last_connected_from_public_ip_grok_failed"
    }
    if ![last_connected_from_public_ip_grok_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "last_connected_from_public_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "last_connected_from_public_ip"
        }
        on_error => "last_connected_from_public_ip_failed"
      }
      if ![last_connected_from_public_ip_failed] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [host_info][hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host_info.hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host_info.hostname}"
        "has_principal" => "true"
      }
      on_error => "host_info_hostname_failed"
    }
  }
  if [host_info][device_make] != "" {
    mutate {
      replace => {
        "hardware.manufacturer" => "%{host_info.device_make}"
      }
      on_error => "device_make_failed"
    }
  }
  if [host_info][device_model] != "" {
    mutate {
      replace => {
        "hardware.model" => "%{host_info.device_model}"
      }
      on_error => "device_model_failed"
    }
  }
  if [host_info][serial_number] != "" {
    mutate {
      replace => {
        "hardware.serial_number" => "%{host_info.serial_number}"
      }
      on_error => "serial_number_failed"
    }
  }
  if [hardware] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.asset.hardware" => "hardware"
      }
      on_error => "hardware_merge_failed"
    }
  }
  if [host_info][mac_addresses] != "" {
    mutate {
      lowercase => ["host_info.mac_addresses"]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "host_info.mac_addresses"
        "event.idm.read_only_udm.principal.asset.mac" => "host_info.mac_addresses"
      }
      on_error => "host_info_mac_failed"
    }
  }
  if [host_info][os_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.platform_software.platform_version" => "%{host_info.os_version}"
      }
      on_error => "host_info_os_version_failed"
    }
  }
  if [host_info][last_update_timestamp] != "" {
    mutate {
      convert => {
        "host_info.last_update_timestamp" => "string"
      }
      on_error => "host_info_last_update_convert_failed"
    }
    if ![host_info_last_update_convert_failed] {
      date {
        match => ["host_info.last_update_timestamp", "UNIX"]
        target => "event.idm.read_only_udm.principal.asset.system_last_update_time"
        on_error => "host_info_last_update_date_failed"
      }
    }
  }
  for index, value in host_info.steering_config {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "steering_config_index_convert_failed"
    }
    mutate {
      replace => {
        "steering_config_field" => ""
      }
    }
    if [value] != "" {
      mutate {
        replace => {
          "steering_config_field.key" => "steering_config_%{index}"
          "steering_config_field.value.string_value" => "%{value}"
        }
        on_error => "steering_config_failed"
      }
      if ![steering_config_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "steering_config_field"
          }
          on_error => "steering_config_merge_failed"
        }
      }
    }
  }
  if [user_info][userkey] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_info.userkey}"
        "has_user" => "true"
      }
      on_error => "user_info_userkey_failed"
    }
  }
  if [user_info][username] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "user_info.username"
      }
      on_error => "user_info_username_failed"
    }
    if ![user_info_username_failed] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }
  if [last_seen_device_event][service_name] != "" {
    mutate {
      replace => {
        "sr.summary" => "%{last_seen_device_event.service_name}"
      }
      on_error => "last_seen_service_name_failed"
    }
  }
  mutate {
    rename => {
      "_appsession_start" => "addition._appsession_start"
      "_content_version" => "addition._content_version"
      "_creation_timestamp" => "addition._creation_timestamp"
      "_ef_received_at" => "addition._ef_received_at"
      "_enriched_all" => "addition._enriched_all"
      "_event_id" => "addition._event_id"
      "_instance_name" => "addition._instance_name"
      "_service_identifier" => "addition._service_identifier"
      "_session_begin" => "addition._session_begin"
      "_skip_geoip_lookup" => "addition._skip_geoip_lookup"
      "_src_gmt_offset" => "addition._src_gmt_offset"
      "acked" => "addition.acked"
      "connection_id" => "addition.connection_id"
      "organization_unit" => "addition.organization_unit"
      "os_family" => "addition.os_family"
      "sanctioned_instance" => "addition.sanctioned_instance"
      "src_time" => "addition.src_time"
      "telemetry_app" => "addition.telemetry_app"
      "_original_destport" => "addition._original_destport"
      "_raw_event_inserted_at" => "addition._raw_event_inserted_at"
      "site" => "addition.site"
      "_partial_file" => "addition._partial_file"
      "from_user" => "addition.from_user"
      "device_classification" => "addition.device_classification"
      "nsdeviceuid" => "addition.nsdeviceuid"
      "process_name" => "addition.process_name"
      "app_activity" => "addition.app_activity"
      "file_category" => "addition.file_category"
      "file_lang" => "addition.file_lang"
      "true_filetype" => "addition.true_filetype"
      "true_obj_category" => "addition.true_obj_category"
      "true_obj_type" => "addition.true_obj_type"
      "dlp_incident_id" => "addition.dlp_incident_id"
      "dlp_profile" => "addition.dlp_profile"
      "dlp_parent_id" => "addition.dlp_parent_id"
      "dlp_is_unique_count" => "addition.dlp_is_unique_count"
      "dlp_rule_count" => "addition.dlp_rule_count"
      "_true_obj_type" => "addition._true_obj_type"
      "_true_obj_cat" => "addition._true_obj_cat"
      "_subfile" => "addition._subfile"
      "_doc_type" => "addition._doc_type"
      "outer_doc_type" => "addition.outer_doc_type"
      "true_type_id" => "addition.true_type_id"
      "_ns_protection_type" => "addition._ns_protection_type"
      "protection_string" => "addition.protection_string"
      "_nsp_dur_back" => "addition._nsp_dur_back"
      "_nsp_retrans_front" => "addition._nsp_retrans_front"
      "_nsp_rtt_back" => "addition._nsp_rtt_back"
      "_nsp_rtt_front" => "addition._nsp_rtt_front"
      "_dst_service" => "addition._dst_service"
      "_src_service" => "addition._src_service"
      "managed_app" => "addition.managed_app"
      "object" => "addition.object"
      "_src_epoch_now" => "addition._src_epoch_now"
      "_true_obj_id" => "addition._true_obj_id"
      "page_site" => "addition.page_site"
      "_legacy_access_method" => "addition._legacy_access_method"
      "appcategory" => "addition.appcategory"
      "_obj_name" => "addition._obj_name"
      "alert" => "addition.alert"
      "ccl" => "addition.ccl"
      "userkey" => "addition.userkey"
      "_category_name" => "addition._category_name"
      "_full_url" => "addition._full_url"
      "_category_id" => "addition._category_id"
      "as" => "addition.as"
      "client_install_time" => "addition.client_install_time"
      "continent" => "addition.continent"
      "device_hash" => "addition.device_hash"
      "enriched" => "addition.enriched"
      "guid" => "addition.guid"
      "heart_beat" => "addition.heart_beat"
      "last_event_timestamp" => "addition.last_event_timestamp"
      "postal_code" => "addition.postal_code"
      "pop_pinned" => "addition.pop_pinned"
      "zipcode" => "addition.zipcode"
      "record_type" => "addition.record_type"
      "last_seen_device_event.timestamp" => "addition.last_seen_timestamp"
      "last_seen_device_event.status_v2" => "addition.last_seen_status_v2"
      "last_seen_device_event.status" => "addition.last_seen_status"
      "last_seen_device_event.npa_status" => "addition.last_seen_npa_status"
      "last_seen_device_event.event" => "addition.last_seen_event"
      "last_seen_device_event.actor" => "addition.last_seen_actor"
      "user_info.orgkey" => "addition.orgkey"
      "user_info.device_classification_status" => "addition.device_classification_status"
      "host_info.managementID" => "addition.managementID"
      "host_info.nsdeviceuid" => "addition.nsdeviceuid"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [value] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
      }
      if [key] in ["_instance_name", "_service_identifier", "os_family", "file_category", "file_lang", "true_filetype", "true_obj_category", "true_obj_type", "_true_obj_type", "_true_obj_cat", "_subfile", "managed_app", "object"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "_field"
          }
          on_error => "target_merge_failed"
        }
      }
      else if [key] in ["_event_id", "organization_unit", "from_user", "device_classification", "managementID", "orgkey", "device_classification_status"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "_field"
          }
          on_error => "principal_merge_failed"
        }
      }
      else if [key] in ["dlp_incident_id", "dlp_profile", "dlp_parent_id", "dlp_is_unique_count", "dlp_rule_count", "_ns_protection_type", "protection_string", "_category_id"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "sr.detection_fields" => "_field"
          }
          on_error => "sr_detection_fields_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }

  # Merge sr, about and intermediary
  if [sr] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr"
      }
      on_error => "sr_merge_failed"
    }
  }

  if [sr2] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr2"
      }
      on_error => "sr2_merge_failed"
    }
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_merge_failed"
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }

  # === UDM > METADATA ===

  # General Metadata for all events
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name"  => "Netskope"
      "event.idm.read_only_udm.metadata.product_name" => "Netskope CASB"
    }
  }

  # type

  if [type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
      }
      on_error => "type_failed"
    }
  }
  else if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
      }
      on_error => "event_type_failed"
    }
  }

  # _id
  if [_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{_id}"
      }
      on_error => "_id_failed"
    }
  }
  else if [_event_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{_event_id}"
      }
      on_error => "_event_id_failed"
    }
  }
  # _event_id

  # ur_normalized

  if [type] == "admin_audit_logs" and [ur_normalized] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.user.email_addresses" => "ur_normalized"
      }
      on_error => "ur_normalized_failed"
    }
  }
  else if [type] == "admin_audit_logs" and [ur_normalized] != "^.+@.+$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{ur_normalized}"
      }
      on_error => "ur_normalized_not_valid"
    }
  }
  else if [ur_normalized] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "ur_normalized"
      }
      on_error => "principal_ur_normalized_failed"
    }
  }
  else if [ur_normalized] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{ur_normalized}"
        "has_user" => "true"
      }
      on_error => "principal_ur_normalized_userid_failed"
    }
  }

  if [type] == "admin_audit_logs" {
    if [audit_log_event] =~ "Login" and ([has_principal] == "true" or [has_target] == "true") {
        mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
    }
    else if [audit_log_event] =~ "Logout" and ([has_principal] == "true" or [has_target] == "true") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        }
      }
    }
    else if [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  else {
    if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  # === OUTPUT ===
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
