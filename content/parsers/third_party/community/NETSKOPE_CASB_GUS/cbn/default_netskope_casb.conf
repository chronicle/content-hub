# Product: NETSKOPE CASB
# Category: CASB
# Supported Format: JSON, SYSLOG+JSON
# Reference: N/A
# Last Updated: 2026-10-08
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "has_extensions" => "false"
      "audit_log_event" => ""
      "access_method" => ""
      "user" => ""
      "srcip" => ""
      "dstip" => ""
      "type" => ""
      "event" => ""
      "__cookie_uid" => ""
      "_correlation_id" => ""
      "_nshostname" => ""
      "_id" => ""
      "_event_id" => ""
      "userkey" => ""
      "organization_unit" => ""
      "is_netskope_personnel" => ""
      "useragent" => ""
      "protocol" => ""
      "_gef_src_dp" => ""
      "alert_id" => ""
      "dst_country" => ""
      "dst_location" => ""
      "dstport" => ""
      "dst_region" => ""
      "src_country" => ""
      "src_location" => ""
      "src_region" => ""
      "alert" => ""
      "_forwarded_by" => ""
      "timestamp" => ""
      "severity_level" => ""
      "ccl" => ""
      "_src_epoch_now" => ""
      "_resource_name" => ""
      "_category_id" => ""
      "_category_name" => ""
      "action" => ""
      "activity" => ""
      "alert_name" => ""
      "alert_type" => ""
      "app" => ""
      "appcategory" => ""
      "app_session_id" => ""
      "appsuite" => ""
      "cci" => ""
      "instance_id" => ""
      "managed_app" => ""
      "notify_template" => ""
      "about" => ""
      "object_id" => ""
      "object_type" => ""
      "page" => ""
      "policy" => ""
      "policy_id" => ""
      "severity" => ""
      "telemetry_app" => ""
      "traffic_type" => ""
      "url" => ""
      "act" => ""
      "act2" => ""
      "dst_ip" => ""
      "sr" => ""
      "sr2" => ""
      "intermediary" => ""
      "count" => ""
      "device" => ""
      "os" => ""
      "os_name" => ""
      "os_version" => ""
      "ja3" => ""
      "ja3s" => ""
      "referer" => ""
      "src_latitude" => ""
      "src_longitude" => ""
      "dst_latitude" => ""
      "dst_longitude" => ""
      "src_zipcode" => ""
      "dst_zipcode" => ""
      "tunnel_id" => ""
      "browser_session_id" => ""
      "incident_id" => ""
      "request_id" => ""
      "transaction_id" => ""
      "userip" => ""
      "src_timezone" => ""
      "dst_timezone" => ""
      "__buf_len" => ""
      "original_destip" => ""
      "dlp_file" => ""
      "dlp_incident_id" => ""
      "dlp_is_unique_count" => ""
      "dlp_parent_id" => ""
      "dlp_profile" => ""
      "dlp_rule" => ""
      "dlp_rule_count" => ""
      "dlp_rule_severity" => ""
      "file_category" => ""
      "file_lang" => ""
      "file_size" => ""
      "file_type" => ""
      "md5" => ""
      "object" => ""
      "sha256" => ""
      "true_filetype" => ""
      "true_obj_category" => ""
      "true_obj_type" => ""
      "_true_obj_type" => ""
      "_true_obj_cat" => ""
      "_subfile" => ""
      "_doc_type" => ""
      "outer_doc_type" => ""
      "true_type_id" => ""
      "_ns_protection_type" => ""
      "protection_string" => ""
      "_nsp_dur_back" => ""
      "_nsp_retrans_front" => ""
      "_nsp_rtt_back" => ""
      "_nsp_rtt_front" => ""
      "_dst_service" => ""
      "_src_service" => ""
      "_true_obj_id" => ""
      "_legacy_access_method" => ""
      "_obj_name" => ""
      "_full_url" => ""
      "_client_file_type" => ""
      "local_sha256" => ""
      "hostname" => ""
      "page_site" => ""
      "ur_normalized" => ""
      "parent_process_name" => ""
      "src_port" => ""
      "asn" => ""
      "city" => ""
      "client_version" => ""
      "country" => ""
      "device_id" => ""
      "isp" => ""
      "last_connected_from_private_ip" => ""
      "last_connected_from_public_ip" => ""
      "latitude" => ""
      "longitude" => ""
      "organization" => ""
      "region" => ""
      "event_type" => ""
      "hardware" => ""
      "software" => ""
      "host_info.client_version" => ""
      "host_info.device_make" => ""
      "host_info.device_model" => ""
      "host_info.hostname" => ""
      "host_info.last_update_timestamp" => ""
      "host_info.mac_addresses" => ""
      "host_info.os" => ""
      "host_info.os_version" => ""
      "host_info.serial_number" => ""
      "host_info.steering_config" => ""
      "user_info.userkey" => ""
      "user_info.username" => ""
      "last_seen_device_event.service_name" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "^<%{INT}>%{SYSLOGTIMESTAMP} %{DATA} (?P<message>\\{%{GREEDYDATA}\\})"
      ]
    }
    overwrite => ["message"]
    on_error => "not_syslog"
  }
  if [message] =~ "Removed predefined apps" {
    mutate {
      gsub => ['message','Removed predefined apps \\[\\\"','Removed predefined apps [']
    }
    mutate {
      gsub => ['message','\\\"\\] from steering','] from steering']
    }
    mutate {
      gsub => ['message','\\\",\\\"',',']
    }
  }
  mutate {
    gsub => [
      "message", "\"(incident_id|request_id|transaction_id|dlp_incident_id|dlp_parent_id|app_session_id|browser_session_id|connection_id)\":\\s*(\\d+)", "\"$1\":\"$2\""
    ]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_direct_json"
  }

  if [not_direct_json] {
    mutate {
      gsub => ["message","'access'","access"]
    }
    mutate {
      gsub => ["message",": None",": null"]
    }
    mutate {
      gsub => ["message","'\\[","["]
    }
    mutate {
      gsub => ["message","\\]'","]"]
    }
    mutate {
      gsub => [ "message", "'", '"']
    }
    mutate {
      gsub => [ "message", "True", 'true']
    }
    mutate {
      gsub => [ "message", "False", 'false']
    }
    mutate {
      gsub => [ "message", '([a-zA-Z0-9_])"([a-zA-Z0-9_])', "$1'$2"]
    }
    mutate {
      gsub => [
        "message", "\"(incident_id|request_id|transaction_id|dlp_incident_id|dlp_parent_id|app_session_id|browser_session_id|connection_id)\":\\s*(\\d+)", "\"$1\":\"$2\""
      ]
    }

    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }

    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }

  # timestamp
  if [timestamp] != "" {
    mutate {
      convert => {
        "timestamp" => "string"
      }
    }
    date {
      match => [ "timestamp", "UNIX"]
      target => "@timestamp"
      on_error => "timestamp_failed"
    }
  }

  # severity_level
  if [severity_level] != "" {
    mutate {
      convert => {
        "severity_level" => "string"
      }
      on_error => "severity_level_conversion_failed"
    }
    mutate {
      replace => {
        "sr.severity_details" => "%{severity_level}"
      }
      on_error => "severity_level_failed"
    }
  }

  # audit_log_event
  if [audit_log_event] != "" {
    mutate {
      replace => {
        "sr.summary" => "%{audit_log_event}"
      }
      on_error => "audit_log_event_failed"
    }
  }

  if [_nshostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{_nshostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{_nshostname}"
        "has_principal" => "true"
      }
      on_error => "no_nshostname"
    }
  }
  else if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "no_hostname"
    }
  }

  if [parent_process_name] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.process.parent_process.file.names" => "parent_process_name"
      }
      on_error => "no_parent_process_name"
    }
  }

  if [dstport] != "" {
    mutate {
      convert => {
        "dstport" => "integer"
      }
      on_error => "dstport_conversion_failed"
    }
    mutate {
      rename => {
        "dstport" => "event.idm.read_only_udm.target.port"
      }
      on_error => "no_port"
    }
  }

  if [dst_country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{dst_country}"
      }
      on_error => "no_dst_country"
    }
  }

  if [dst_region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.state" => "%{dst_region}"
      }
      on_error => "no_state"
    }
  }

  if [dst_location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.name" => "%{dst_location}"
      }
      on_error => "no_dst_location"
    }
  }

  if [src_country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" => "%{src_country}"
      }
      on_error => "no_src_country"
    }
  }

  if [src_region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.state" => "%{src_region}"
      }
      on_error => "no_src_region"
    }
  }

  if [src_location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.name" => "%{src_location}"
      }
      on_error => "no_location"
    }
  }

  # supporting_data.data_type
  mutate {
    replace => {
      "_sd_selector" => "%{supporting_data.data_type}"
    }
    on_error => "sd_data_type_failed"
  }

  if not [sd_data_type_failed] {
    if [supporting_data][data_type] == "reason" {
      mutate {
        replace => {
          "sr.description" => "%{supporting_data.data_values.0}"
        }
        on_error => "supporting_data_data_type_failed"
      }
    }
    if [supporting_data][data_type] == "user" {
      grok {
        match => {
          "supporting_data.data_values.0" => ["%{IP:_ip}"]
        }
        on_error => "grok_data_type_failed"
      }
      if not [grok_data_type_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "supporting_data.data_values.0"
            "event.idm.read_only_udm.target.asset.ip" => "supporting_data.data_values.0"
          }
          on_error => "supporting_data_data_type_merge_failed"
        }
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  # organization_unit
  if [organization_unit] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.namespace" => "%{organization_unit}"
      }
      on_error => "organization_unit_failed"
    }
  }

  # ccl
  if [ccl] != "" {
    mutate {
      replace => {
        "sr.confidence_details" => "%{ccl}"
      }
      on_error => "ccl_failed"
    }

    if not [ccl_failed] {
      if [ccl] in ["excellent","high"] {
        mutate {
          replace => {
            "sr.confidence" => "HIGH_CONFIDENCE"
          }
        }
      }
      else if [ccl] == "medium" {
        mutate {
          replace => {
            "sr.confidence" => "MEDIUM_CONFIDENCE"
          }
        }
      }
      else if [ccl] in ["low","poor"] {
        mutate {
          replace => {
            "sr.confidence" => "LOW_CONFIDENCE"
          }
        }
      }
      else if [ccl] in ["unknown","not_defined"] {
        mutate {
          replace => {
            "sr.confidence" => "UNKNOWN_CONFIDENCE"
          }
        }
      }
    }
  }

  # count
  if [count] != "" {
    mutate {
      convert => {
        "count" => "string"
      }
      on_error => "invalid_conversion"
    }
    mutate {
      replace => {
        "count_label.key" => "count"
        "count_label.value" => "%{count}"
      }
      on_error => "count_failed"
    }
    if not [count_failed] {
      mutate {
        merge => {
          "about.resource.attribute.labels" => "count_label"
        }
        on_error => "no_count_label"
      }
    }
  }

  # _insertion_epoch_timestamp
  mutate {
    convert => {
      "_insertion_epoch_timestamp" => "string"
    }
    on_error => "_insertion_epoch_timestamp_conversion_failed"
  }

  date {
    match => [ "_insertion_epoch_timestamp", "UNIX"]
    target => "event.idm.read_only_udm.metadata.collected_timestamp"
    on_error => "_insertion_epoch_timestamp_failed"
  }

  # auth_details
  mutate {
    replace => {
      "event.idm.read_only_udm.extensions.auth.auth_details" => "ACTIVE"
    }
  }

  # _forwarded_by
  if [_forwarded_by] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{_forwarded_by}"
        "intermediary.asset.hostname" => "%{_forwarded_by}"
      }
      on_error => "_forwarded_by_failed"
    }
  }

  # _resource_name
  if [_resource_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{_resource_name}"
      }
      on_error => "_resource_name_failed"
    }
  }

  # _src_epoch_now
  if [_src_epoch_now] != "" {
    mutate {
      convert => {
        "_src_epoch_now" => "string"
      }
    }
    date {
      match => ["_src_epoch_now", "UNIX"]
      target => "event.idm.read_only_udm.target.resource.attribute.last_update_time"
      on_error => "_src_epoch_now_failed"
    }
  }

  # access_method
  if [access_method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "%{access_method}"
        "has_extensions" => "true"
      }
      on_error => "access_method_failed"
    }
  }

  # action
  if [action] != "" {
    mutate {
      replace => {
        "sr.action_details" => "%{action}"
      }
      on_error => "no_action"
    }

    if [action] in ["useralert", "Detection", "bypass", "allow"] {
      mutate {
        replace => {
          "act" => "ALLOW"
        }
        on_error => "act_replace_failed"
      }
    }
    else if [action] in ["block","restrictAccess","delete"] {
      mutate {
        replace => {
          "act" => "BLOCK"
        }
      }
    }
    else if [action] in ["alert","quarantine","legalHold"] {
      mutate {
        replace => {
          "act" => "QUARANTINE"
        }
      }
    }
    else if [action] in ["restrictToView","disableDownload"] {
      mutate {
        replace => {
          "act" => "ALLOW_WITH_MODIFICATION"
        }
      }
    }
    else if [action] == "expireLink" {
      mutate {
        replace => {
          "act" => "FAIL"
        }
      }
    }
    if [act] != "" {
      mutate {
        merge => {
          "sr.action" => "act"
        }
        on_error => "act_merge_failed"
      }
    }
  }

  # activity
  if [activity] != "" {
    mutate {
      replace => {
        "sr.summary" => "%{activity}"
      }
      on_error => "activity_failed"
    }
  }


  # alert
  if [alert] != "" {
    mutate {
      replace => {
        "_alert_selector" => "%{alert}"
      }
      on_error => "_alert_failed"
    }

    if not [_alert_failed] {
      if [alert] == "yes" {
        mutate {
          replace => {
            "sr.alert_state" => "ALERTING"
          }
        }
      }
      else if [alert] == "no" {
        mutate {
          replace => {
            "sr.alert_state" => "NOT_ALERTING"
          }
        }
      }
    }
  }

  #alert_id
  if [alert_id] != "" {
    mutate {
      replace => {
        "sr.rule_id" => "%{alert_id}"
      }
      on_error => "no_rule_id"
    }
  }

  if [dlp_rule] != "" {
    mutate {
      replace => {
        "sr.rule_name" => "%{dlp_rule}"
      }
      on_error => "dlp_rule_failed"
    }
  }
  else if [alert_name] != "" {
    mutate {
      replace => {
        "sr.rule_name" => "%{alert_name}"
      }
      on_error => "alert_name_failed"
    }
  }

  # alert_type
  if [alert_type] != "" {
    mutate {
      replace => {
        "sr.rule_type" => "%{alert_type}"
      }
      on_error => "alert_type_failed"
    }
  }

  # app
  if [app] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{app}"
      }
      on_error => "app_failed"
    }
  }

  # app_session_id
  if [app_session_id] != "" {
    mutate {
      convert => {
        "app_session_id" => "string"
      }
      on_error => "app_session_id_conversion_error"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{app_session_id}"
      }
      on_error => "app_session_id_failed"
    }
  }

  # appcategory
  if [appcategory] != "" {
    mutate {
      merge => {
        "sr.category_details" => "appcategory"
      }
      on_error => "appcategory_failed"
    }
  }

  # appsuite
  if [appsuite] != "" {
    mutate {
      replace => {
        "resource_ancestors.name" => "%{appsuite}"
      }
      on_error => "appsuite_failed"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource_ancestors" => "resource_ancestors"
      }
      on_error => "appsuite_merge_failed"
    }
  }

  # cci
  if [cci] != "" {
    mutate {
      convert => {
        "cci" => "string"
      }
      on_error => "cci_conversion_error"
    }
    mutate {
      replace => {
        "sr.confidence_details" => "%{cci}"
      }
      on_error => "cci_failed"
    }
  }

  if [useragent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{useragent}"
      }
      on_error => "no_user_agent"
    }
    mutate {
      convert => {
        "useragent" => "parseduseragent"
      }
      on_error => "parsed_user_agent_conversion_error"
    }
    mutate {
      rename => {
        "useragent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
      }
      on_error => "no_parsed_user_agent"
    }
  }

  if [protocol] =~ "HTTPS" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTPS"
      }
    }
  }

  # dstip

  if [dstip] != "" {
    grok {
      match => {
        "dstip" => "%{IP:dst_ip}"
      }
      overwrite => ["dst_ip"]
      on_error => "invalid_ip"
    }
    if ![invalid_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dstip"
          "event.idm.read_only_udm.about.ip" => "dstip"
          "event.idm.read_only_udm.target.asset.ip" => "dstip"
          "event.idm.read_only_udm.about.asset.ip" => "dstip"
        }
        on_error => "dstip_failed"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  # instance_id
  if [instance_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.domain.name" => "%{instance_id}"
      }
      on_error => "instance_id_failed"
    }
  }

  # managed_app
  if [managed_app] == "yes" {
    mutate {
      replace => {
        "act2" => "ALLOW"
        "sr2.action_details" => "App managed"
      }
      on_error => "no_act_details"
    }
  }
  else if [managed_app] == "no" {
    mutate {
      replace => {
        "act2" => "FAIL"
        "sr2.action_details" => "App not managed"
      }
      on_error => "no_managed_app"
    }
  }

  if [act2] != "" {
    mutate {
      merge => {
        "sr2.action" => "act2"
      }
      on_error => "no_act2"
    }
  }

  # notify_template
  if [notify_template] != "" {
    mutate {
      replace => {
        "about.resource.name" => "%{notify_template}"
      }
      on_error => "notify_template_failed"
    }
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "%{about}"
      }
      on_error => "notify_template_merge_failed"
    }
  }

  # object_id
  if [object_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{object_id}"
      }
      on_error => "object_id_failed"
    }
  }

  # object_type
  if [object_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{object_type}"
      }
      on_error => "object_type_failed"
    }
  }

  # other_categories
  for index,othCat in other_categories {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "othcat_index_conversion_error"
    }
    mutate {
      replace => {
        "othcat_label" => ""
      }
    }
