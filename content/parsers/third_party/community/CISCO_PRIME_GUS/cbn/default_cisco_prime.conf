# Product: Cisco Prime
# Category: Network Management and Optimization
# Supported Format: SYSLOG
# Reference: https://www.cisco.com/c/en/us/td/docs/net_mgmt/prime/infrastructure/3-2/admin/guide/bk_CiscoPrimeInfastructure_3_2_AdminGuide/bk_CiscoPrimeInfastructure_3_2_AdminGuide_chapter_01000.html
# Last Updated: 2025-04-30
# Copyright 2025 Google SecOps

filter{

  # Initialized the fields to extract their value from the raw logs.
  mutate {
    replace => {
      "application_name" => "",
      "thread_pool" => "",
      "log_level" => "",
      "date" => "",
      "information" => "",
      "process_name" => "",
      "job_id" => "",
      "session_id" => "",
      "device_id" => "",
      "ip_address" => "",
      "email" => "",
      "mac_address" => "",
      "severity" => "",
      "source_mac" => "",
      "dest_mac" => "",
      "file_path" => "",
      "oid" => "",
      "class_name" => "",
      "desc" => "",
      "desc1" => "",
      "summary" => "",
      "target_field" => "",
      "target_ip" => "",
      "id" => ""
      "Type" => ""
      "dst_user" => ""
      "hostname" => ""
      "timestamp" => ""
      "kv_data" => ""
      "description" => ""
      "user_name" => ""
      "device_ip" => ""
      "event_type" => ""
      "device_type" => ""
      "devices_data" => ""
      "message_data" => ""
      "principal_ip" => ""
      "security_result" => ""
      "sec_description" => ""
      "client_ip_address" => ""
      "principal_port" => ""
      "event_type_set" => "false"
      "principal_present" => "false"
      "user_present" => "false"
      "target_present" => "false"
      "target_resource_present" => "false"
      "Date" => ""
      "time" => ""
      "ts" => ""
      "principal_hostname" => ""
      "target_port" => ""
      "target_hostname" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "\\<%{INT:code}\\>%{DATESTAMP:date} %{DATA:log_level} \\[%{WORD:application_name}\\] %{GREEDYDATA:information}",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+%{DATA:kv_data},Change Audit Details:%{DATA:description}\\\\n%{GREEDYDATA:message_data}",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp}, Device Ip:\\[%{DATA:device_ip}\\], %{DATA:kv_data},Change Audit Details:%{DATA:description} :%{GREEDYDATA:devices_data}",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp}, Device Ip:\\[%{DATA:device_ip}\\], %{DATA:kv_data},Change Audit Details:%{GREEDYDATA:description}"
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp}, Device Ip:%{IP:device_ip}, %{DATA:kv_data},Change Audit Details:%{DATA:description} :%{GREEDYDATA:devices_data}",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp},\\s+Device Ip:%{IP:device_ip}, %{GREEDYDATA:kv_data},Change Audit Details:%{GREEDYDATA:description}",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp},\\s+Device Ip:(%{IP:device_ip}|NA), %{GREEDYDATA:kv_data},Change Audit Details:(?P<description>(Login|Logout) successful for user %{DATA:dst_user} from %{IP:source_ip})",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp},\\s+Device Ip:(%{IP:device_ip}|NA), %{GREEDYDATA:kv_data},Change Audit Details:(?P<description>Authentication Failed.*user %{DATA:dst_user} .*)",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME} %{DATA}: Change Audit Details:(?P<description>Failed password for invalid user %{DATA:dst_user} from %{IP:source_ip} port %{INT:principal_port})%{GREEDYDATA}",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp},\\s+Device Ip:(%{IP:device_ip}|NA), %{GREEDYDATA:kv_data},Change Audit Details:(?P<description>Authentication Failed.*)",
        "%{SYSLOGTIMESTAMP} %{HOSTNAME} %{DATA}: Change Audit Details:(?P<description>Accepted password for %{DATA:dst_user} from %{IP:source_ip} port %{INT:principal_port})%{GREEDYDATA}"
        "%{SYSLOGTIMESTAMP} %{HOSTNAME}\\s+Time:%{DATA:timestamp},\\s+Device Ip:(NA|%{IP:device_ip}), %{DATA:kv_data},Change Audit Details:(?<description>.*)"
        "%{SYSLOGTIMESTAMP} %{HOSTNAME} %{DATA}: Change Audit Details:(?P<description>Failed.*for %{DATA:dst_user} from %{IP:principal_ip} port %{INT:principal_port}.*)"
        "%{SYSLOGTIMESTAMP} %{HOSTNAME} %{DATA}: Change Audit Details:%{GREEDYDATA:description}",
        "%{DATA}: %{DATA:Date} %{TIME:time} %{DATA} %{IP:principal_ip}#%{INT:principal_port}(?P<desc>%{GREEDYDATA}: %{DATA:target_hostname} %{GREEDYDATA} \\(%{IP:target_ip}\\))",
        "%{DATA}: %{DATA:Date} %{TIME:time} (?P<desc>%{DATA} '%{DATA:target_hostname}': %{IP:target_ip}#%{INT:target_port})",
        "\\<%{INT:code}\\>\\s*%{GREEDYDATA:desc}"
      ]
    }
    overwrite => ["target_hostname","target_ip","target_port","principal_hostname","Date","time","desc","information","application_name","log_level","date","kv_data","message_data","timestamp","description","device_ip","devices_data","dst_user","principal_port","principal_ip"]
    on_error => "pattern_not_matched"
  }
  if [pattern_not_matched] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }

  # Some logs could be mapped to event_type 'SCHEDULED_TASK_UNCATEGORIZED' but they dont have value for userid.
  # Some of them could either be mapped to 'NETWORK_CONNECTION' or 'PROCESS_OPEN' but they too dont have values for target field.
  # So considering them under generic event only.
  if [information] != "" {
    grok {
      match => {
        "information" => ["\\[%{DATA:thread_pool}\\] INFO: \\[%{GREEDYDATA:desc}:::%{GREEDYDATA}###%{GREEDYDATA:process_name}\\].",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} with sysoid\\[%{GREEDYDATA:oid}\\]",
                          "\\[%{DATA:thread_pool}\\] INFO: \\[%{GREEDYDATA:desc}\\[%{GREEDYDATA},%{GREEDYDATA:process_name}\\] %{GREEDYDATA:desc1}.\\].",
                          "\\[%{DATA:thread_pool}\\] INFO: \\[%{GREEDYDATA:desc}:%{GREEDYDATA:process_name}\\].",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} for MAC Address :%{MAC:mac_address},OwningEntityId : %{NUMBER:id}_%{IP:ip_address}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} reportingAddress=%{IP:ip_address} severity=%{WORD:severity} previousSeverity=%{WORD} summary=%{GREEDYDATA:summary}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} : %{NUMBER:id} %{GREEDYDATA:desc1}!",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc}::%{MAC:mac_address}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} summary=%{GREEDYDATA:summary} \\'%{IP:ip_address}\\'",
                          "\\[%{DATA:thread_pool}\\] Device id %{NUMBER:device_id} %{GREEDYDATA:desc}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} device id: %{NUMBER:device_id} %{GREEDYDATA:summary}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} deviceId %{NUMBER:device_id}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc}::%{IP:ip_address}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} %{IP:target_ip}_2_%{MAC:dest_mac} %{GREEDYDATA}%{MAC:source_mac}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc}==================== UnifiedAp!%{MAC:mac_address}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc}for emailRecipientName %{GREEDYDATA:email}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} is: %{GREEDYDATA:session_id} ",
                          "\\[%{DATA:thread_pool}\\] %{NUMBER:device_id}:%{GREEDYDATA:desc}",
                          "\\[%{DATA:thread_pool}\\] AesLogImpl.error:%{IP:ip_address}%{GREEDYDATA:desc}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} info Device Id: %{NUMBER:device_id} %{GREEDYDATA:summary}",
                          "\\[%{DATA:thread_pool}\\] IFM-SAM-ERROR: '%{GREEDYDATA:file_path}' %{GREEDYDATA:desc}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} license file \\[%{GREEDYDATA:file_path}\\]",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} license file %{GREEDYDATA:file_path}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} OID: %{GREEDYDATA:id}_%{IP:ip_address}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc} on %{GREEDYDATA:id}_%{IP:ip_address} %{GREEDYDATA:data}",
                          "\\[%{DATA:thread_pool}\\] %{GREEDYDATA:desc}"]
      }
      overwrite => ["thread_pool","id","desc","desc1","target_ip","summary","ip_address","session_id","file_path","target_field","process_name","oid","severity","device_id","email","mac_address","source_mac","dest_mac"]
    }
  }

  # Converting MAC address to lower_case.
  mutate {
    lowercase => [ "mac_address" , "source_mac" ,"dest_mac" ]
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "event.idm.read_only_udm.metadata.vendor_name" => "CISCO"
      "event.idm.read_only_udm.metadata.product_name" => "CISCO_PRIME"
    }
  }
  if [Date] != "" and [time] != "" {
    mutate {
      replace => {
        "ts" => "%{Date} %{time}"
      }
      on_error => "invalid_timestamp"
    }
  }
  if [ts] != "" {
    date {
      match => ["ts", "dd-MMM-yyyy HH:mm:ss.SSS"]
      on_error => "invalid_timestamp"
    }
  }
  if [principal_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{principal_hostname}"
      }
      on_error => "invalid_hostname"
    }
    if ![invalid_hostname] {
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
    }
  }
  if [target_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{target_port}"
      }
      on_error => "invalid_target_port"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "invalid_target_port"
    }
  }
  if [target_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
      }
      on_error => "invalid_hostname"
    }
    if ![invalid_hostname] {
      mutate {
        replace => {
          "target_present" => "true"
        }
      }
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data","Device Ip","device_ip"]
    }
    mutate {
      gsub => ["kv_data","User Name","user_name"]
    }
    mutate {
      gsub => ["kv_data","Client IP Address","client_ip_address"]
    }
    grok {
      match => {
        "kv_data" => "Time:%{DATA:timestamp},"
      }
      on_error => "pattern_not_matched"
      overwrite => ["timestamp"]
    }
    mutate {
      gsub => ["kv_data","Time:(.*?),",""]
    }
    mutate {
      gsub => ["kv_data","([a-zA-Z0-9_]*):","#$1="]
    }
    mutate {
      gsub => ["kv_data","= ","="]
    }
    mutate {
      gsub => ["kv_data",", #","#"]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => "="
      on_error => "kv_data_fail"
    }

    if [device_ip] != "" {
        mutate {
          gsub => ["device_ip",",","\",\""]
        }
        mutate {
          gsub => ["device_ip","\\[",""]
        }
        mutate {
          gsub => ["device_ip","\\]",""]
        }
        mutate {
          replace => {
            "device_ip" => "{\"device_ip\":[\"%{device_ip}\"]}"
          }
          on_error => "invalid_device_ip"
        }
        json {
          source => "device_ip"
          array_function => "split_columns"
          on_error => "invalid_json"
        }
        for sourceaddress in device_ip {
          grok {
            match => {
              "sourceaddress" => "%{IP:sourceaddress}"
            }
            overwrite => ["sourceaddress"]
            on_error => "not_valid_sourceaddress"
          }
          if not [not_valid_sourceaddress] {
            mutate {
              merge => {
                "event.idm.read_only_udm.principal.ip" => "sourceaddress"
                "event.idm.read_only_udm.principal.asset.ip" => "sourceaddress"
              }
              on_error => "invalid_ip"
            }
            if not [invalid_ip] {
              mutate {
                replace => {
                  "principal_present" => "true"
                }
              }
            }
          }
        }
    }

    if [client_ip_address] != "" {
      grok {
        match => {
          "client_ip_address" => "%{IP:client_ip_address}"
        }
        overwrite => ["client_ip_address"]
        on_error => "not_ip"
      }
      if not [not_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "client_ip_address"
            "event.idm.read_only_udm.principal.asset.ip" => "client_ip_address"
          }
          on_error => "invalid_ip"
        }
        if not [invalid_ip] {
          mutate {
            replace => {
              "principal_present" => "true"
            }
          }
        }
      }
    }
  }

  if [message_data] != "" {
    grok {
      match => {
        "message_data" => [
          "Syslog Message:<%{INT}>%{INT}: %{SYSLOGTIMESTAMP:timestamp} %{DATA}: %SYS-5-CONFIG_I: (?P<sec_description>Configured from %{DATA} by %{DATA:user_name} on vty0 \\(%{IP:principal_ip}\\))",
          "Syslog Message:<%{INT}>%{INT}: %{SYSLOGTIMESTAMP:timestamp}: %SYS-5-CONFIG_I: (?P<sec_description>Configured from %{DATA} by %{DATA:user_name} on vty0 \\(%{IP:principal_ip}\\))"
        ]
      }
      on_error => "pattern_not_matched"
      overwrite => ["timestamp","principal_ip","user_name","sec_description"]
    }
  }

  if [sec_description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{sec_description}"
      }
      on_error => "invalid_description"
    }
  }

  if [description] != "" {
    grok {
      match => {
        "description" => [
          "User '%{DATA:user_name}'",
          "Attempt made to connect from  Client \\\"%{IP:principal_ip}\\\".*"
          ".*:%{IP:principal_ip}:.*"
          "(?P<description>.*rhost)=%{IP:principal_ip}\\s+user=%{DATA:user_name}:.*",
          "(?P<description>.* rhost)=%{IP:principal_ip}.*"
        ]
      }
      overwrite => ["user_name","principal_ip","description","user_name"]
      on_error => "pattern_not_matched"
    }
    mutate {
      replace => {
        "security_result.description" => "%{description}"
      }
      on_error => "invalid_description"
    }
    if [description] =~ "(?i)fail" {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "invalid_action"
      }
    }
  }

  if [principal_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "principal_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "principal_ip"
      }
      on_error => "invalid_ip"
    }
    if not [invalid_ip] {
      mutate {
        replace => {
          "principal_present" => "true"
        }
      }
    }
  }

  if [Type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{Type}"
      }
      on_error => "invalid_type"
    }
  }

  if [devices_data] != "" {
    mutate {
      gsub => ["devices_data",",","\",\""]
    }
    mutate {
      replace => {
        "devices_data" => "{\"devices_data\":[\"%{devices_data}\"]}"
      }
      on_error => "invalid_device_data"
    }
    json {
      source => "devices_data"
      array_function => "split_columns"
      on_error => "invalid_json"
    }
    for device in devices_data {
      mutate {
        replace => {
          "hostname" => ""
          "device_type" => ""
          "device_type_label" => ""
          "device_hostname" => ""
        }
      }
      grok {
        match => {
          "device" => "\\s?%{GREEDYDATA:hostname}-%{IP:sourceaddress}-%{GREEDYDATA:device_type}"
        }
        overwrite => ["hostname","sourceaddress","device_type"]
        on_error => "not_valid_sourceaddress"
      }
      if not [not_valid_sourceaddress] {
        mutate {
          replace => {
            "device_type_label.value" => "%{device_type}"
          }
          on_error => "invalid_device_type"
        }
        if not [invalid_device_type] {
          mutate {
            replace => {
              "device_type_label.key" => "Device Type"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "device_type_label"
            }
            on_error => "invalid_device_type_label"
          }
          if not [invalid_device_type_label] {
            mutate {
              replace => {
                "target_resource_present" => "true"
              }
            }
          }
        }
        mutate {
          replace => {
            "device_hostname.value" => "%{hostname}"
          }
          on_error => "invalid_hostname"
        }
        if not [invalid_hostname] {
          mutate {
            replace => {
              "device_hostname.key" => "Device Hostname"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.target.resource.attribute.labels" => "device_hostname"
            }
            on_error => "invalid_device_hostname"
          }
          if not [invalid_device_hostname] {
            mutate {
              replace => {
                "target_resource_present" => "true"
              }
            }
          }
        }
      }
    }
  }

  if [dst_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{dst_user}"
      }
      on_error =>"invalid_dst_user"
    }
    if not [invalid_dst_user] {
      if [description] =~ "(?i)logout" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          }
        }
      }
      mutate {
        replace => {
          "event_type_set" => "true"
          "extensions.auth.type" => "MACHINE"
        }
      }
      mutate {
        rename => {
          "extensions" => "event.idm.read_only_udm.extensions"
        }
      }

      if [description] =~ "(?i)password" {
        mutate {
          replace => {
            "mechanism" => "USERNAME_PASSWORD"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
          }
          on_error => "invalid_mechanisms"
        }
      }
    }
  }

  if [user_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
      }
      on_error => "invalid_user_name"
    }
    if not [invalid_user_name] {
      mutate {
        replace => {
          "user_present" => "true"
        }
      }
    }
  }

  if [principal_port] != "" {
    mutate {
      convert => {
        "principal_port" => "integer"
      }
      on_error => "conversion_failure"
    }
    mutate {
      rename => {
        "principal_port" => "event.idm.read_only_udm.principal.port"
      }
    }
  }

  if [principal_present] == "false" and [description] != "" {
    grok {
      match => {
        "description" => ".* from %{IP:principal_ip}.*"
      }
      overwrite => ["principal_ip"]
      on_error => "pattern_not_matched"
    }
    if not [pattern_not_matched] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "principal_ip"
        }
        on_error => "invalid_ip"
      }
      if not [invalid_ip] {
        mutate {
          replace => {
            "principal_present" => "true"
          }
        }
      }
    }
  }

  if [thread_pool] == 'EmailAlertHelper' {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
      }
    }
  }
  else if [application_name] == "aesSystem" and [desc] =~ "HealthMonitorHelper" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_HEARTBEAT"
      }
    }
  }

  if [application_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{application_name}"
      }
    }
  }

  if [thread_pool] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{thread_pool}"
      }
    }
  }

  if [id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" => "Entity ID:%{id}"
      }
    }
  }

  # Appending desc1 to desc itself, if present.
  if [desc1] != "" {
    mutate {
      replace => {
        desc => "%{desc} %{desc1}"
      }
    }
  }

  if [desc] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{desc}"
      }
    }
  }

  if [summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{summary}"
      }
    }
  }

  if [process_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{process_name}"
      }
    }
  }

  if [device_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" => "Device ID:%{device_id}"
      }
    }
  }

  if [ip_address] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip_address"
        "event.idm.read_only_udm.principal.asset.ip" => "ip_address"
      }
      on_error => "invalid_ip_address"
    }
  }

  if [target_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "target_ip"
        "event.idm.read_only_udm.target.asset.ip" => "target_ip"
      }
      on_error => "invalid_ip"
    }
    if not [invalid_ip] {
      mutate {
        replace => {
          "target_present" => "true"
        }
      }
    }
  }

  if [dest_mac] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.mac" => "dest_mac"
      }
      on_error => "invalid_ip"
    }
    if not [invalid_ip] {
      mutate {
        replace => {
          "target_present" => "true"
        }
      }
    }
  }

  # Assigning the value of mac_address to source_mac(if null) so as to avoid duplication of mapping.
  if [source_mac] == "" and [mac_address] != "" {
    mutate {
      replace => {
        source_mac => "%{mac_address}"
      }
    }
  }

  if [source_mac] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "source_mac"
      }
    }
  }

  if [session_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{session_id}"
      }
    }
  }

  if [email] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.src.hostname" => "%{email}"
      }
    }
  }

  # If severity is present in description then considering that otherwise using log_level to map it.
  if [severity] == "MAJOR" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  if [severity] == "" {
    if [log_level] == "INFO "{
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [log_level] == "WARN "{
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
    else if [log_level] == "ERROR"{
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
  }

  if [security_result] != "" {
    mutate{
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "invalid_security_result"
    }
  }

  if [file_path] != "" {
    mutate {
      rename => {
        "file_path" => "event.idm.read_only_udm.principal.process.file.full_path"
      }
    }
  }

  if [oid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.product_object_id" => "%{oid}"
      }
    }
  }

  if [date] != "" {
    date {
      match => ["date", "MM/dd/yy HH:mm:ss.SSS"]
    }
  }

  if [event_type_set] == "false" {
    if [user_present] == "true" and [target_resource_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    } else if [user_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [principal_present] == "true" and [target_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    } else if [principal_present] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
