        "event.idm.read_only_udm.src.user.user_display_name" => "%{secondaryName}"
      }
      on_error => "secondary_name_field_not_found"
    }
  }

  # Merge security_result, about
  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "security_result"
    }
    on_error => "sr_failed"
  }
  mutate {
    merge => {
      "event.idm.read_only_udm.about" => "about_3" #Change - The "about_2" has been used previously, so it generates duplicate fields
    }
    on_error => "about_failed"
  }

  # General Metadata for all events
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Workday"
      "event.idm.read_only_udm.metadata.product_name" => "Enterprise Interface Builder"
    }
  }
  if [status_code] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{status_code}"
      }
      on_error => "status_code_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "not_integer"
    }
  }
  # SignOffTime, AuthFailMessage
  if [type] == "INT0385" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{AuthFailMessage}"
      }
    }
    mutate {
      replace => {
        "additional4.key" => "Enterprise Interface Builder"
        "additional4.value.string_value" => "%{AuthFailMessage}"
      }
      on_error => "auth_message_not_found"
    }
    if ![auth_message_not_found] and [AuthFailMessage] != "" {
      mutate {
        merge => {
          "additional.fields" => "additional4"
        }
      }
    }

    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }

    if [SignOffTime] == "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        }
      }
    }
  }
  # ActivityCategory
  else if [type] == "INT0386" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{ActivityCategory}"
      }
      on_error => "ActivityCategory_failed"
    }
    if ![ActivityCategory_failed] {
      if [ActivityCategory] == "READ" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_READ"
          }
        }
      }
      else if [ActivityCategory] == "WRITE" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_WRITTEN"
          }
        }
      }
    }
  }
  # RequestName
  else if [type] == "INT0382" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{RequestName}"
      }
      on_error => "request_field_not_found"
    }

    mutate {
      replace => {
        "account" => "%{Account}"
      }
      on_error => "account_field_not_found"
    }

    if [account] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
        }
      }
    }
  }
  # ChangedRelationship, SecureTaskExecuted
  else if [type] == "INT0381_384" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{ChangedRelationship}"
      }
      on_error => "desc_field_not_found"
    }

    if [SecureTaskExecuted] =~ "Create" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
        }
      }
    }
  }
  # ChangedRelationship, Product
  else if [type] == "INT0383" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
        "event.idm.read_only_udm.metadata.description" => "%{ChangedRelationship}"
      }
    }
  }
  # RequestName
  else if [type] == "INT0380" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{RequestName}"
      }
      on_error => "request_field_not_found"
    }
    if [Person] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
        }
      }
    }
  }
  # Status
  else if [type] == "INT0438" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_WRITTEN"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{Status}"
      }
      on_error => "status_field_not_found"
    }
  }
  else if [type] == "INT0454" and ([has_principal_user] == "true" and [has_target_user] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
      }
    }
  }

  if [message] != ""{
    mutate {
      replace => {
        "user_email" => ""
        "user_Target" => ""
      }
    }
    grok {
      match => {
        "message" => [
          "%{EMAILADDRESS:user_email}\\son\\sbehalf\\sof\\s%{GREEDYDATA:destino}:\\s"
          "%{DATA:user_target}\\s/%{GREEDYDATA:rest}\\son\\sbehalf\\sof\\s%{USERNAME:destino}"
        ]
      }
      on_error => "no_behalf"
    }

    if ![no_behalf] {
      if [user_email] != ""{
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.email_addresses" => "user_email"
          }
        }
        if [event.idm.read_only_udm.principal.user.userid] != [destino]{
          mutate {
            replace => {
              "event.idm.read_only_udm.target.user.userid" => "%{destino}"
              "has_target_user" => "true"
            }
            on_error => "destino_field_not_found"
          }
        }
      } else {
        if [event.idm.read_only_udm.principal.user.userid] == [user_target] {
          mutate {
            replace => {
              "event.idm.read_only_udm.src.user.userid" => ""
              "event.idm.read_only_udm.src.user.user_display_name" => ""
            }
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{secondaryId}"
            "event.idm.read_only_udm.target.user.user_display_name" => "%{secondaryName}"
            "has_target_user" => "true"
          }
        }
      }
    }
  }
  mutate {
    rename => {
      "context" => "additiondata.context"
      "devicetype" => "additiondata.devicetype"
      "browser" => "additiondata.browser"
      "authmethod" => "additiondata.authmethod"
    }
  }
  for key, value in  additiondata map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [value] not in ["-", "", "Unknown","N/A"] {
      mutate {
        replace => {
          "field_.key" => "%{key}"
        }
        on_error => "key_not_exists"
      }
      if [key] in ["context", "devicetype", "browser", "authmethod"] {
        mutate {
          replace => {
            "field_.value.string_value" => "%{value}"
          }
          on_error => "value_not_exists"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "additiondata_field_merge_error"
        }
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
