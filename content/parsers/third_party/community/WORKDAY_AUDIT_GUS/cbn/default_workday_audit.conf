# Product: WORKDAY_AUDIT
# Category: Audit And Compliance
# Supported Format: CSV
# Reference: N/A
# Last Updated: 2026-02-02
# Copyright 2026 Google SecOps

filter {

  mutate {
    replace => {
      "type" => "UNDEFINED"
      "AuthenticationChannel" => ""
      "column2" => ""
      "column3" => ""
      "column7" => ""
      "primaryId" => ""
      "primaryName" => ""
      "secondaryId" => ""
      "secondaryName" => ""
      "account" => ""
      "principal_email" => ""
      "target_user_id" => ""
      "SignOffTime" => ""
      "date" => ""
      "sessionid" => ""
      "status_code" => ""
      "useragent" => ""
      "tenantname" => ""
      "browser" => ""
      "devicetype" => ""
      "authmethod" => ""
      "context" => ""
      "src_ip" => ""
      "target_name" => ""
      "princ_user_id" => ""
      "princ_user_name" => ""
      "target_user_name" => ""
      "security_result_action" => ""
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "event.idm.read_only_udm.principal.user.userid" => ""
      "has_user" => "false"
      "has_principal_user" => "false"
      "has_target_user" => "false"
    }
  }

  mutate {
    gsub => ["message","^\\s+|\\s+$",""]
  }

  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:date},%{DATA:sessionid},%{INT:status_code},%{DATA:primaryName},%{NOTSPACE:principal_email} / %{DATA:useragent},%{DATA:tenantname},%{DATA:browser},%{DATA:devicetype},%{DATA:authmethod},%{DATA:context},%{IP:src_ip}",
        "%{TIMESTAMP_ISO8601:date},%{DATA:sessionid},%{INT:status_code},%{DATA:primaryName},%{DATA:principal_email},%{DATA:tenantname},%{DATA:browser},%{DATA:devicetype},%{DATA:authmethod},%{DATA:context},%{IP:src_ip}"
      ]
    }
    overwrite => ["date", "sessionid", "status_code", "primaryName", "principal_email", "useragent", "tenantname", "browser", "devicetype", "authmethod", "context", "src_ip"]
    on_error => "grok_failure"
  }
  if [date] != "" {
    mutate {
      gsub => ["date",":([^:]*)$","$1"]
    }
    date {
      match => ["date", "ISO8601"]
      on_error => "timestamp_error"
    }
  }
  csv {
    source => "message"
    separator => ','
    charset =>  "UTF-8"
    on_error => "csv_fail"
  }
  if [csv_fail] and [grok_failure] {
    drop{
      tag => "TAG_UNSPECIFIED"
    }
  }
  # === DIFFERENENT EVENT TYPES ===
  # Type INT0385
  if [type] == "UNDEFINED" {
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){17})']
      }
      on_error => "no_type_INT0385"
    }
    if ![no_type_INT0385] {
      mutate {
        replace => {
          "type" => "INT0385"
        }
      }
    }
  }

  # Type INT0382
  if [type] == "UNDEFINED" and [column2] =~ "[0-9-]+T[0-9:\.-]+" {
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){12})']
      }
      on_error => "no_type_INT0382"
    }
    if ![no_type_INT0382] {
      mutate {
        replace => {
          "type" => "INT0382"
        }
      }
    }
  }

  # Type INT0380
  if [type] == "UNDEFINED" and [column2] !~ "[0-9-]+T[0-9:\.-]+" {
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){12})']
      }
      on_error => "no_type_INT0380"
    }
    if ![no_type_INT0380] {
      mutate {
        replace => {
          "type" => "INT0380"
        }
      }
    }
  }

  # Type INT0438
  if [type] == "UNDEFINED" and [column3] =~ "^[a-zA-Z_-]$"{
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){11})']
      }
      on_error => "no_type_INT0438"
    }
    if ![no_type_INT0438] {
      mutate {
        replace => {
          "type" => "INT0438"
        }
      }
    }
  }

  # Type INT0383
  if [type] == "UNDEFINED" {
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){11})']
      }
      on_error => "no_type_INT0383"
    }
    if ![no_type_INT0383] {
      mutate {
        replace => {
          "type" => "INT0383"
        }
      }
    }
  }

  # Type INT0381/INT0384
  if [type] == "UNDEFINED" {
    grok {
      match => {
        "column2" => ['%{DATE:_}']
      }
      on_error => "no_type_INT0381_384"
    }
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){10})']
      }
      on_error => "no_type_INT0381_384"
    }
    if ![no_type_INT0381_384] {
      mutate {
        replace => {
          "type" => "INT0381_384"
        }
      }
    }
  }

  # Type INT0454
  if [type] == "UNDEFINED" and ([column7] == "Yes" or [column7] == "No" ){
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){8})']
      }
      on_error => "no_type_INT0454"
    }
    if ![no_type_INT0454] {
      mutate {
        replace => {
          "type" => "INT0454"
        }
      }
    }
  }

  # Type INT0386
  if [type] == "UNDEFINED" {
    grok {
      match => {
        "message" => ['(?P<match>((.+?)(?:",|$)){8})']
      }
      on_error => "no_type_INT0386"
    }
    if ![no_type_INT0386] {
      mutate {
        replace => {
          "type" => "INT0386"
        }
      }
    }
  }
  # === SCHEMA ===
  if [type] == "INT0385" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "WorkdayAccountSignOn"
        "column3"  => "IsDeviceManaged"
        "column4"  => "SignOnTime"
        "column5"  => "SystemAccount"
        "column6"  => "Worker"
        "column7"  => "WorkerRole"
        "column9"  => "DeviceType"
        "column10" => "FailedSignOn"
        "column11" => "InvalidCredentials"
        "column12" => "AccountLocked"
        "column13" => "AuthFailMessage"
        "column14" => "AuthType"
        "column15" => "SessionId"
        "column16" => "SignOnIp"
        "column17" => "TlsVersion"
      }
    }

    mutate {
      replace => {
        "SignOffTime" => "%{column8}"
      }
      on_error => "not_column8_found"
    }

    mutate {
      replace => {
        "AuthenticationChannel" => "%{column18}"
      }
      on_error => "not_column18_found"
    }
  }
  else if [type] == "INT0386" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "RequestTime"
        "column3"  => "SystemAccount"
        "column4"  => "IP"
        "column5"  => "UserAgent"
        "column6"  => "Task"
        "column7"  => "Target"
        "column8"  => "ActivityCategory"
      }
    }
  }
  else if [type] == "INT0454" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "Transaction"
        "column3"  => "EffectiveDate"
        "column4"  => "TransactionType"
        "column5"  => "WorkdayAccount"
        "column6"  => "AffectedGroups"
        "column7"  => "RevokedSecurity"
        "column8"  => "CreatedBy"
      }
    }
  }
  else if [type] == "INT0382" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "SentTime"
        "column3"  => "Person"
        "column4"  => "Account"
        "column5"  => "RequestName"
        "column6"  => "EventType"
        "column7"  => "IntegrationSystem"
        "column8"  => "IntegrationEvent"
        "column9"  => "OutputFiles"
        "column10" => "Trigger"
        "column11" => "IntegrationStatus"
        "column12" => "ResponseMessage"
      }
    }
  }
  else if [type] == "INT0381_384" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "ProcessedTransaction"
        "column3"  => "SystemAccount"
        "column4"  => "SecureTaskExecuted"
        "column5"  => "EntryMoment"
        "column6"  => "ChangedRelationship"
        "column7"  => "WorkdayAccount"
        "column8"  => "CFIPdeConexion"
        "column9"  => "InstancesAdded"
        "column10" => "InstancesRemoved"
      }
    }
  }
  else if [type] == "INT0383" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "Domain"
        "column3"  => "SecuredTaskExecuted"
        "column4"  => "ProcessedTransaction"
        "column5"  => "SystemAccount"
        "column6"  => "EntryMoment"
        "column7"  => "Area"
        "column8"  => "ChangedRelationship"
        "column9" => "InstancesAdded"
        "column10" => "InstancesRemoved"
        "column11" => "SecurityGroupModified"
      }
    }
  }
  else if [type] == "INT0380" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "Template"
        "column3"  => "SentTime"
        "column4"  => "Person"
        "column5"  => "RequestName"
        "column6"  => "EventType"
        "column7"  => "IntegrationSystem"
        "column8"  => "IntegrationEvent"
        "column9"  => "OutputFiles"
        "column10" => "Trigger"
        "column11" => "IntegrationStatus"
        "column12" => "ResponseMessage"
      }
    }
  }
  else if [type] == "INT0438" {
    mutate {
      rename => {
        "column1"  => "Tenant"
        "column2"  => "Form"
        "column3"  => "TypeForm"
        "column4"  => "ScheduledProcess"
        "column5"  => "RunFrequency"
        "column6"  => "ProgramBy"
        "column7"  => "RestrictedToEnvironment"
        "column8"  => "RecurrenceStartDate"
        "column9"  => "RecurrenceEndDate"
        "column10" => "Status"
        "column11" => "ShareBy"
      }
    }
  }

  grok {
    match => {
      "SystemAccount" => [
        "^%{EMAILADDRESS:principal_email} on behalf of %{DATA:target_user_id}$"
        "^%{DATA:primaryId} / %{DATA:primaryName} on behalf of %{DATA:secondaryId} / %{DATA:secondaryName}$"
        "^%{DATA:primaryId} / %{DATA:primaryName}$"
        "^%{DATA:primaryId}_%{USERNAME:primaryName}"
        "%{DATA:primaryId} \\(%{DATA:primaryName}\\)"
        "%{DATA:primaryId}$"
        ]
    }
    overwrite => ["primaryId", "primaryName", "secondaryId", "secondaryName", "principal_email", "target_user_id"]
    on_error => "grok_failed"
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.target.asset.hostname" => "%{Tenant}"
    }
    on_error => "tenant_field_not_found"
  }
  if [sessionid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{sessionid}"
      }
      on_error => "session_id_field_not_found"
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
      }
      on_error => "src_ip_field_not_found"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  # === DATA ===
  if [type] == "INT0385" {
    mutate {
      gsub => ["SignOnTime",":([^:]*)$","$1"]
    }
    date {
      match => ["SignOnTime", "ISO8601"]
      target => "@timestamp"
      on_error => "timestamp_error"
    }

    if [WorkerRole] != "" {
      mutate {
        replace => {
          "_user.group_identifiers" => "%{WorkerRole}"
        }
        on_error => "worker_role_field_not_found"
      }
      if [secondaryName] == "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.group_identifiers" => "_user.group_identifiers"
          }
          on_error => "group_field_not_found"
        }
      }
      else {
        mutate {
          merge => {
            "event.idm.read_only_udm.src.user.group_identifiers" => "_user.group_identifiers"
          }
          on_error => "group_field_not_found"
        }
      }
    }

    if [SignOffTime] != ""{
      mutate {
        gsub => ["SignOffTime",":([^:]*)$","$1"]
      }
      date {
        match => ["SignOffTime", "ISO8601"]
        target => "event.idm.read_only_udm.principal.user.attribute.last_update_time"
        on_error => "timestamp_error"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.category" => "%{DeviceType}"
      }
      on_error => "device_type_field_not_found"
    }

    if [FailedSignOn] != "" {
      mutate {
        replace => {
          "security_result1.action_details" => "FailedSignOn"
          "additional1.key" => "FailedSignOn"
        }
      }
      if [FailedSignOn] == "N" {
        mutate {
          replace => {
            "act" => "ALLOW"
            "security_result1.summary" => "Successfull"
            "additional1.value.string_value" => "Successfull"
          }
        }
      }
      else {
        mutate {
          replace => {
            "act" => "FAIL"
            "security_result1.summary" => "Failed login occurred"
            "additional1.value.string_value" => "Failed login occurred"
          }
        }
      }
      mutate {
        merge => {
          "additional.fields" => "additional1"
        }
      }
      mutate {
        merge => {
          "security_result1.action" => "act"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result1"
        }
        on_error => "merge_error"
      }
    }
    if [Worker] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{Worker}"
        }
        on_error => "worker_field_not_found"
      }
    }
    if [WorkdayAccountSignOn] != "" {
      grok {
        match => {
          "WorkdayAccountSignOn" => "%{DATA:target_user_id} \/ %{DATA:target_name}: %{GREEDYDATA}"
        }
        overwrite => ["target_user_id", "target_name"]
        on_error => "workday_account_failed"
      }
    }
    if [target_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.user_display_name" => "%{target_name}"
        }
        on_error => "workday_account_not_found"
      }
    }

    if [IsDeviceManaged] != "" {
      mutate {
        replace => {
          "security_result2.action_details" => "%{IsDeviceManaged}"
        }
      }
      if [IsDeviceManaged] == "N" {
        mutate {
          replace => {
            "act" => "ALLOW"
            "security_result2.summary" => "Successfull"
          }
        }
      }
      else {
        mutate {
          replace => {
            "act" => "FAIL"
            "security_result2.summary" => "Not device managed"
          }
        }
      }
      mutate {
        merge => {
          "security_result2.action" => "act"
        }
        on_error => "action_field_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result2"
        }
        on_error => "security_result2_merge_error"
      }
    }

    if [InvalidCredentials] != "" {
      mutate {
        replace => {
          "security_result3.action_details" => "InvalidCredentials"
          "additional2.key" => "InvalidCredentials"
        }
      }
      if [InvalidCredentials] == "N" {
        mutate {
          replace => {
            "act" => "ALLOW"
            "security_result3.summary" => "Successfull"
            "additional2.value.string_value" => "Successfull"
          }
        }
      }
      else {
        mutate {
          replace => {
            "act" => "FAIL"
            "security_result3.summary" => "Invalid Credentials"
            "additional2.value.string_value" => "Invalid Credentials"
          }
        }
      }
      mutate {
        merge => {
          "additional.fields" => "additional2"
        }
        on_error => "additional_field_not_found"
      }
      mutate {
        merge => {
          "security_result3.action" => "act"
        }
        on_error => "action_field_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result3"
        }
        on_error => "security_result3_merge_error"
      }
    }

    if [AccountLocked] != "" {
      mutate {
        replace => {
          "security_result4.action_details" => "AccountLocked"
        }
      }
      mutate {
        replace => {
          "additional3.key" => "AccountLocked"
        }
      }
      if [AccountLocked] == "N" {
        mutate {
          replace => {
            "act" => "ALLOW"
            "security_result4.summary" => "Successfull"
            "additional2.value.string_value" => "Successfull"
          }
        }
      }
      else {
        mutate {
          replace => {
            "act" => "FAIL"
            "security_result4.summary" => "Account Locked"
            "additional3.value.string_value" => "Account Locked"
          }
        }
      }
      mutate {
        merge => {
          "additional.fields" => "additional3"
        }
        on_error => "add3_field_not_found"
      }
      mutate {
        merge => {
          "security_result4.action" => "act"
        }
        on_error => "action_field_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result4"
        }
        on_error => "merge_error"
      }
    }

    if [AuthenticationChannel] != "" {
      mutate {
        replace => {
          "utub.key" => "AuthenticationChannel"
          "utub.value.string_value" => "%{AuthenticationChannel}"
        }
        on_error => "auth_field_not_found"
      }
      if ![auth_field_not_found] {
        mutate {
          merge => {
            "additional.fields" => "utub"
          }
        }
      }
    }

    # AuthType
    if [AuthType] =~ "Biometric" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "PHYSICAL"
        }
      }
    }
    if [AuthType] =~ "(Delegated Authentication|DID Authentication|ID Token|OAuth|X509|WebAuthn (FIDO2)|Session ID|SAML|OAuth 2.0|OpenID Connect)" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    }
    if [AuthType] =~ "(Delegated Authentication+ Challenge Questions|Delegated Authentication+ One Time Passcode|DelegationEnded|DelegationStarted|User Name Password+ One Time Passcode|User Name Password+ Challenge Questions|Step Up Authentication-SAML|User Name Password|None|Trusted)" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    if [AuthType] =~ "(InterOms|Mobile PIN)" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        }
      }
    }
    if [AuthType] =~ "(Proxy|Proxy Ended|Proxy Started)" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "VPN"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "%{AuthType}"
      }
      on_error => "auth_type_field_not_found"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{SessionId}"
      }
      on_error => "session_id_field_not_found"
    }

    if [SignOnIp] != "" {
      grok {
        match => {
          "SignOnIp" => ["%{IP:src_ip}"]
        }
        overwrite => ["src_ip"]
        on_error => "SignOnIp_failed"
      }

      if [SignOnIp_failed] {
        mutate {
          replace => {
            "event.idm.read_only_udm.src.domain.name" => "%{SignOnIp}"
          }
          on_error => "SignOnIp_not_found"
        }
      }
      else {
        mutate {
          merge => {
            "event.idm.read_only_udm.src.ip" => "src_ip"
          }
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.version" => "%{TlsVersion}"
      }
      on_error => "tls_version_field_not_found"
    }
  }
  else if [type] == "INT0386" {
    if [RequestTime] != ""{
      mutate {
        gsub => ["RequestTime",":([^:]*)$","$1"]
      }
      date {
        match => ["RequestTime", "ISO8601"]
        target => "@timestamp"
        on_error => "timestamp_error"
      }
    }

    if [IP] != "" {
      grok {
        match => {
          "IP" => ["%{IP:src_ip}"]
        }
        overwrite => ["src_ip"]
        on_error => "IP_failed"
      }
      if [IP_failed] {
        mutate {
          replace => {
            "event.idm.read_only_udm.src.domain.name" => "%{IP}"
          }
          on_error => "ip_not_found"
        }
      }
      else {
        mutate {
          merge => {
            "event.idm.read_only_udm.src.ip" => "src_ip"
          }
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{UserAgent}"
      }
      on_error => "user_agent_field_not_found"
    }

    mutate {
      convert => {
        "UserAgent" => "parseduseragent"
      }
      on_error => "user_agent_convert_failed"
    }
    if ![user_agent_convert_failed] {
      mutate {
        rename => {
          "UserAgent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
        }
      }
    }

    mutate {
      replace => {
        "intermediary.resource.name"  => "%{Task}"
      }
      on_error => "task_field_not_found"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "merge_failure"
    }

    mutate {
      replace => {
