# Product: VANDYKE_SFTP
# Category: Data Transfer
# Supported Format: JSON, SYSLOG
# Reference : https://www.vandyke.com/support/index.html
# Last Updated: 2025-05-15
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "port" => ""
      "hostname" => ""
      "syslog_severity" => ""
      "log.file.path" => ""
      "has_hostname" => "false"
      "security_result" => ""
      "logstash.process.timestamp" => ""
      "logstash.collect.timestamp" => ""
      "logstash.ingest.timestamp" => ""
      "logstash.process.host" => ""
      "logstash.collect.host" => ""
      "logstash.ingest.host" => ""
      "host.hostname" => ""
      "host.os.platform" => ""
      "host.os.version" => ""
      "host.os.family" => ""
      "host.os.name" => ""
      "host.os.kernel" => ""
      "host.id" => ""
      "host.ip" => ""
      "host.mac" => ""
      "host.architecture" => ""
      "agent.type" => ""
      "agent.id" => ""
      "agent.version" => ""
      "logstash.irm_site" => ""
      "logstash.irm_region" => ""
      "logstash.irm_environment" => ""
      "ecs.version" => ""
      "product_event_type" => ""
      "src_ip" => ""
      "dst_ip" => ""
      "pid" => ""
      "method" => ""
      "description" => ""
      "referral_url" => ""
      "response_code" => ""
      "src_port" => ""
      "dst_port" => ""
      "id" => ""
      "username" => ""
      "reason" => ""
      "error_message" => ""
      "srcip" => ""
      "path" => ""
      "bytes" => ""
      "has_target_file" => ""
    }
  }
  mutate {
    gsub => ["message", "\\r\\n", "  "]
  }
  mutate {
    gsub => ["message","\\n",""]
  }
  grok {
    match => {
      "message" => [
        "<%{INT}>%{MONTH}\\s+%{MONTHDAY} %{TIME} %{DATA:hostname} VShell: %{INT:id}: %{GREEDYDATA:description}",
        "<%{INT}>%{MONTH}\\s+%{MONTHDAY} %{TIME} %{DATA:hostname} VShell: %{GREEDYDATA:description}"
      ]
    }
    overwrite => ["hostname", "description", "id"]
    on_error => "grok_syslog_error"
  }
  date {
    match => ["time", "HH:mm:ss"]
    on_error => "time_not_present"
  }

  if [id] != "" {
    mutate {
      replace => {
        "id_label.key" => "id"
        "id_label.value.string_value" => "%{id}"
      }
      on_error => "id_not_present"
    }
    if ![id_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "id_label"
        }
        on_error => "id_not_present"
      }
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
      }
      on_error => "hostname_not_present"
    }
    if ![hostname_not_present] {
      mutate {
        replace => {
          "has_hostname" => "true"
        }
      }
    }
  }
  if [description] != "" {
    grok {
      match => {
        "description" => [
          "Starting port forward to %{IP:srcip}:%{NUMBER:port}"
          "Username lookup failed for user %{USERNAME:username}: %{GREEDYDATA:reason}"
          "none for user %{USERNAME:username} rejected because it is unavailable"
          "password for user %{DATA:username} (rejected|accepted)"
          "Maximum authentication retries for user %{USERNAME:username} exceeded."
          "Client specified user name %{USERNAME:username}, resolved as %{GREEDYDATA}"
          "%{USERNAME:username} has accessed '%{GREEDYDATA:path}': %{INT:bytes} %{GREEDYDATA}"
          "Connection accepted from %{IP:srcip}:%{NUMBER:port}",
          "password for user %{USERNAME:username} rejected",
          "Authentication for %{USERNAME:username} failed: %{GREEDYDATA:reason}"
          "%{GREEDYDATA} port %{INT:port} %{GREEDYDATA}",
          "%{GREEDYDATA:description}"
        ]
      }
      overwrite => ["port", "username", "reason", "srcip", "description", "path", "bytes"]
      on_error => "description_not_present"
    }
    if [path] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{path}"
          "has_target_file" => "true"
        }
        on_error => "path_not_present"
      }
    }
    if [bytes] != "" {
      mutate {
        convert => {
          "bytes" => "uinteger"
        }
        on_error => "bytes_not_present"
      }
      mutate {
        rename => {
          "bytes" => "event.idm.read_only_udm.target.file.size"
        }
      }
    }
    if [port] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{port}"
        }
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
      }
    }
    if [srcip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "srcip"
          "event.idm.read_only_udm.principal.asset.ip" => "srcip"
        }
        on_error => "srcip_not_present"
      }
    }
    if [username] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{username}"
          "event.idm.read_only_udm.target.user.user_display_name" => "%{username}"
        }
        on_error => "username_not_present"
      }
    }
    if [reason] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{reason}"
        }
        on_error => "reason_not_present"
      }
    }
    if [description] != "" and [reason] == "" and [src_ip] == "" and [username] == "" {
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
        on_error => "description_not_present"
      }
    }
  }
  else {
    mutate {
      replace => {
        "security_result.description" => "%{description}"
      }
    }
  }


 # If the message is a json, it needs to substitute some fields to avoid conflict.
  mutate {
    gsub => ["message", "@timestamp", "json_timestamp"]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] && [grok_syslog_error] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "VANDYKE_SFTP"
      "event.idm.read_only_udm.metadata.vendor_name" => "VANDYKE SOFTWARE"
      "event.idm.read_only_udm.metadata.event_type" => "NETWORK_FTP"
    }
  }
  if [has_hostname] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }


  if [ecs][version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{ecs.version}"
      }
    }
  }

  if [host][hostname] != "" and [host][hostname] != "Null" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{host.hostname}"
      }
    }
  }
  if[host][os][platform] != "" {
    if [host][os][platform] in ["centos","linux","LINUX"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.platform" => "LINUX"
        }
      }
    }
    else if [host][os][platform] in ["windows","WINDOWS"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.platform" => "WINDOWS"
        }
      }
    }
    else if [host][os][platform] in ["mac","MAC"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.platform" => "MAC"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.platform" => "UNKNOWN_PLATFORM"
        }
      }
    }
  }

  if [host][os][version] != "" and [host][os][version] != "Null" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform_version" => "%{host.os.version}"
      }
    }
  }

  if [host][os][kernel] != "" and [host][os][kernel] != "Null" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.platform_patch_level" => "%{host.os.kernel}"
      }
    }
  }

  if [host][architecture] != "" and [host][architecture] != "Null" {
    mutate {
      replace => {
        "hardware.cpu_platform" => "%{host.architecture}"
      }
      on_error => "not_architecture"
    }
    if ![not_architecture] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.asset.hardware" => "hardware"
       }
     }
   }
 }

  if [host][mac] != "" and [host][mac] != "Null" {
    for mac in host.mac {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.mac" => "mac"
        }
      }
    }
  }

  if [host][ip] != "" and [host][ip] != "Null" {
    for ip in host.ip {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "ip"
        }
      }
    }
  }

  if [host][id] != "" and [host][id] != "Null" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" => "VANDYKE_SFTP:%{host.id}"
      }
    }
  }
  if [agent][type] != "" and [agent][type] != "Null" and [agent][version] != "" and [agent][version] != "Null" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.application" => "%{agent.type}"
        "event.idm.read_only_udm.observer.platform_version" => "%{agent.version}"
      }
    }
  }
  if [logstash][process][host] != "" and [logstash][process][host] != "Null" {
    mutate {
      rename => {
        "logstash.process.host" => "event.idm.read_only_udm.observer.hostname"
      }
    }
  }

  if [agent][id] != "" and [agent][id] != "Null" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.asset_id" => "%{agent.type}:%{agent.id}"
      }
    }
  }

  if [syslog_severity] != "" {
    if [syslog_severity] =~ "(?i)(error|warning)" {
      mutate {
        replace => { "security_result.severity" => "HIGH" }
      }
    }
    else if [syslog_severity] =~ "(?i)notice" {
      mutate {
        replace => { "security_result.severity" => "MEDIUM" }
      }
    }
    else if [syslog_severity] =~ "(?i)(information|info)" {
      mutate {
        replace => { "security_result.severity" => "LOW" }
      }
    }
    mutate {
      replace => { "security_result.severity_details" => "%{syslog_severity}" }
    }
  }

  if [log][file][path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{log.file.path}"
      }
    }
  }

  if [logstash][process][timestamp] != "" {
    date {
      match => ["logstash.process.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
    }
  }

  if [logstash][collect][timestamp] != "" {
    date {
      match => ["logstash.collect.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
    }
  }

  if [logstash][ingest][timestamp] != "" {
    date {
      match => ["logstash.ingest.timestamp", "yyyy-MM-dd HH:mm:ss.SSS","yyyy-MM-ddTHH:mm:ssZ","ISO8601"]
      target => "event.idm.read_only_udm.metadata.ingested_timestamp"
    }
  }

  if [logstash][irm_site] != "" {
    mutate {
      replace => {
        "irmsite.key" => "irm_site"
        "irmsite.value.string_value" => "%{logstash.irm_site}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "irmsite"
      }
    }
  }

  if [logstash][irm_region] != "" {
    mutate {
      replace => {
        "irmregion.key" => "irm_region"
        "irmregion.value.string_value" => "%{logstash.irm_region}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "irmregion"
      }
    }
  }
  if [logstash][irm_environment] != "" {
    mutate {
      replace => {
        "irmenvironment.key" => "irm_environment"
        "irmenvironment.value.string_value" => "%{logstash.irm_environment}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "irmenvironment"
      }
    }
  }

  if [message] != "" {
    mutate {
      gsub => ["message","\\\\",""]
    }
    grok {
      match => {
        "message" => ["%{TIMESTAMP_ISO8601:time} %{GREEDYDATA} %{IP:src_ip} %{NUMBER:src_port}%{GREEDYDATA} %{IP:dst_ip} %{NUMBER:dst_port} \\\"%{DATA}: %{GREEDYDATA:description}\\\"",
                      "%{TIMESTAMP_ISO8601:time} %{IP:src_ip} - (?:%{DATA}|-) \\[%{NUMBER:pid}\\]%{WORD:method} (?:%{DATA:referral_url}|-) - %{INT:response_code}%{DATA}",
                      "%{TIMESTAMP_ISO8601:time} %{GREEDYDATA}\\\"%{DATA}(:)?(?:\\s+\\[%{DATA:product_event_type}\\]\\s+|\\s+)%{DATA:description}\\\""
                      ]
      }
      overwrite => ["product_event_type", "src_ip", "description", "dst_ip", "time", "pid", "referral_url", "response_code", "method", "time", "src_port", "dst_port"]
      on_error => "pattern_not_matched"
    }

    date {
      match => ["time", "yyyy-MM-dd HH:mm:ss"]
      on_error => "time_not_present"
    }

    if [pid] != "" and [pid] != "Null" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.pid" => "%{pid}"
        }
      }
    }

    if [src_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
        }
      }
    }

    if [dst_ip] != "" and [dst_ip] != "Null" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dst_ip"
        }
      }
    }

    if [src_port] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{src_port}"
        }
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
      }
    }

    if [dst_port] != "" and [dst_port] != "Null" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{dst_port}"
        }
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
      }
    }

    if [product_event_type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
        }
      }
    }

    if [method] =~ "GET|PUT|POST|PATCH|DELETE|HEAD|CONNECT|OPTIONS|TRACE" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{method}"
          "event.idm.read_only_udm.network.application_protocol" => "HTTP"
        }
      }
    }

    if [response_code] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" => "%{response_code}"
        }
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
      }
    }

    if [referral_url] != "" && [referral_url] != "-" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{referral_url}"
        }
      }
    }

    if [description] =~ "TCP" {
      mutate {
        replace => {
         "event.idm.read_only_udm.network.ip_protocol" => "TCP"
        }
      }
    } else if [description] =~ "(i?)SSH2|(i?)SSH" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "SSH"
          }
        }
      }

    if [description] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{description}"
        }
      }
    }
  }

  if [has_hostname] == "true" and [description] =~ "(Authentication for root failed|password for user root rejected|Username lookup failed|failed|rejected|aborted)" and [username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
    }
  }
  else if [has_hostname] == "true" and [description] =~ "(accepted|Connection accepted)" and [username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
    }
  }
  else if [has_hostname] == "true" and [description] =~ "(Connection closed)" and [username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }

  if [has_hostname] == "true" and [has_target_file] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
