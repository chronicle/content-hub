# Product: ONEIDENTITY TPAM
# Category: Privileged Account Activity
# Supported Format: KV ,CEF
# Reference: NA
# Last Updated:2025-12-23
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "metadata" => ""
      "network" => ""
      "security_result" => ""
      "additional" => ""
      "capturedNumber" => ""
      "hostname" => ""
      "groupName" => ""
      "capturedvalue" => ""
      "dummyValue" => ""
      "dummyValue2" => ""
      "CEFValue" => ""
      "logtype" => ""
      "logmessage" => ""
      "version" => ""
      "logmsg" => ""
      "unknownValue" => ""
      "kvData" => ""
      "timestamp" => ""
      "duid" => ""
      "duser" => ""
      "destinationDnsDomain" => ""
      "requestUrl" => ""
      "cn1" => ""
      "cn1Label" => ""
      "cs1" => ""
      "cs1Label" => ""
      "cn2" => ""
      "cn2Label" => ""
      "cs2" => ""
      "cs2Label" => ""
      "cn3" => ""
      "cn3Label" => ""
      "cs3" => ""
      "cs3Label" => ""
      "cn4" => ""
      "cn4Label" => ""
      "cs4" => ""
      "cs4Label" => ""
      "cn5" => ""
      "cn5Label" => ""
      "cs5" => ""
      "cs5Label" => ""
      "deviceCustomDate1" => ""
      "deviceCustomDate1Label" => ""
      "reason" => ""
      "cs6" => ""
      "cs6Label" => ""
      "msg" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "roles" => ""
      "eventid" => ""
      "intermediary_data" => ""
      "intermediary" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "%{INT}\\s+\\<%{DATA:capturedNumber}\\>%{INT}\\s+%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:hostname}\\s+%{DATA:groupName}\\s+%{DATA:capturedvalue}\\s+%{DATA:dummyValue}\\s+%{DATA:dummyValue2}\\s+CEF\\:%{DATA:CEFValue}\\|%{DATA:logtype}\\|%{DATA:logmessage}\\|%{DATA:version}\\|%{DATA:eventid}\\|%{DATA:logmsg}\\|%{DATA:unknownValue}\\|%{GREEDYDATA:kvData}"
        "%{SYSLOGTIMESTAMP} %{DATA:intermediary_data} %{INT}\\s+%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:hostname}\\s+%{DATA:groupName}\\s+%{DATA:capturedvalue}\\s+%{DATA:dummyValue}\\s+%{DATA:dummyValue2}\\s+CEF\\:%{DATA:CEFValue}\\|%{DATA:logtype}\\|%{DATA:logmessage}\\|%{DATA:version}\\|%{DATA:eventid}\\|%{DATA:logmsg}\\|%{DATA:unknownValue}\\|%{GREEDYDATA:kvData}"
      ]
    }
    overwrite => ["intermediary_data", "timestamp", "capturedNumber", "hostname", "groupName", "capturedvalue", "dummyValue", "dummyValue2", "CEFValue", "logtype", "logmessage", "version","eventid", "logmsg", "unknownValue", "kvData" ]
    on_error => "grok_fail"
  }
  if [kvData] != "" {
    mutate {
      gsub => ["kvData","(\\\s+)(\\S+)=", "#$2="]
    }
  }
  kv {
    source => "kvData"
    field_split => "#"
    value_split => "="
    on_error => "kv_fail"
  }
  ##UDM fields mapping
  if [timestamp] != "" {
    date {
      match => ["timestamp","ISO8601","RFC3339"]
      target => "metadata.event_timestamp"
      on_error => "ts_error"
    }
  }
  if [logtype] != "" {
    mutate {
      replace => {
        "metadata.vendor_name" => "%{logtype}"
      }
      on_error => "vendorname_error"
    }
  }
  if [logmessage] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{logmessage}"
      }
      on_error => "logmessage_error"
    }
  }
  if [version] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{version}"
      }
      on_error => "version_error"
    }
  }
  if [logmsg] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventid}-%{logmsg}"
      }
      on_error => "logmsg_error"
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
        "principal.asset.hostname" => "%{hostname}"
      }
      on_error => "hostname_error"
    }
    if ![hostname_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [groupName] != "" {
    mutate {
      replace => {
        "principal.group.group_display_name" => "%{groupName}"
      }
      on_error => "groupname_error"
    }
  }
  if [duid] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{duid}"
      }
      on_error => "duid_error"
    }
    if ![duid_error] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }
  if [duser] != "" {
    mutate {
      replace => {
        "target.user.user_display_name" => "%{duser}"
      }
      on_error => "duser_error"
    }
  }
  if [msg] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{msg}"
      }
      on_error => "msg_error"
    }
  }
  if [destinationDnsDomain] != "" {
    mutate {
      replace => {
        "target.domain.name" => "%{destinationDnsDomain}"
      }
      on_error => "destinationDnsDomain_error"
    }
  }
  if [requestUrl] != "" {
    mutate {
      replace => {
        "target.url" => "%{requestUrl}"
      }
      on_error => "requestUrl_error"
    }
  }
  if [reason] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{reason}"
      }
      on_error => "reason_error"
    }
  }
  if [cn1Label] == "AccountId" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{cn1}"
      }
      on_error => "cn1_error"
    }
  }
  else if [cn1] != ""  and [cn1Label] != "" {
    mutate {
      replace => {
        "cn1_labels.key" => "%{cn1Label}"
        "cn1_labels.value.string_value" => "%{cn1}"
      }
      on_error => "invalid_cn1"
    }
    if ![invalid_cn1] {
      mutate {
        merge => {
          "additional.fields" =>"cn1_labels"
        }
        on_error => "invalid_cn1"
      }
    }
  }
  if [cs1Label] == "AccountName"  {
    mutate {
      replace => {
        "roles.name" => "%{cs1}"
      }
      on_error => "invalid_accountname"
    }
  }
  else if [cs1] != ""  and [cs1Label] != "" {
    mutate {
      replace => {
        "cs1_labels.key" => "%{cs1Label}"
        "cs1_labels.value.string_value" => "%{cs1}"
      }
      on_error => "invalid_cs1"
    }
    if ![invalid_cs1] {
      mutate {
        merge => {
          "additional.fields" =>"cs1_labels"
        }
        on_error => "invalid_cs1"
      }
    }
  }
  if [cs2] != ""  and [cs2Label] != "" {
    mutate {
      replace => {
        "cs2_labels.key" => "%{cs2Label}"
        "cs2_labels.value.string_value" => "%{cs2}"
      }
      on_error => "invalid_cs2"
    }
    if ![invalid_cs2] {
      mutate {
        merge => {
          "additional.fields" =>"cs2_labels"
        }
        on_error => "invalid_cs2"
      }
    }
  }
  if [cs3] != ""  and [cs3Label] != "" {
    mutate {
      replace => {
        "cs3_labels.key" => "%{cs3Label}"
        "cs3_labels.value.string_value" => "%{cs3}"
      }
      on_error => "invalid_cs3"
    }
    if ![invalid_cs3] {
      mutate {
        merge => {
          "additional.fields" =>"cs3_labels"
        }
        on_error => "invalid_cs3"
      }
    }
  }
  if [cs4] != ""  and [cs4Label] != "" {
    mutate {
      replace => {
        "cs4_labels.key" => "%{cs4Label}"
        "cs4_labels.value.string_value" => "%{cs4}"
      }
      on_error => "invalid_cs4"
    }
    if ![invalid_cs4] {
      mutate {
        merge => {
          "additional.fields" =>"cs4_labels"
        }
        on_error => "invalid_cs4"
      }
    }
  }
  if [cs5] != ""  and [cs5Label] != "" {
    mutate {
      replace => {
        "cs5_labels.key" => "%{cs5Label}"
        "cs5_labels.value.string_value" => "%{cs5}"
        }
      on_error => "invalid_cs5"
    }
    if ![invalid_cs5] {
      mutate {
        merge => {
          "additional.fields" =>"cs5_labels"
        }
        on_error => "invalid_cs5"
      }
    }
  }
  if [cs6] != ""  and [cs6Label] != "" {
    mutate {
      replace => {
        "cs6_labels.key" => "%{cs6Label}"
        "cs6_labels.value.string_value" => "%{cs6}"
      }
      on_error => "invalid_cs6"
    }
    if ![invalid_cs6] {
      mutate {
        merge => {
          "additional.fields" =>"cs6_labels"
        }
        on_error => "invalid_cs6"
      }
    }
  }
  if [deviceCustomDate1] != ""  and [deviceCustomDate1Label] != "" {
    mutate {
      replace => {
        "deviceCustomDate1_labels.key" => "%{deviceCustomDate1Label}"
        "deviceCustomDate1_labels.value" => "%{deviceCustomDate1}"
      }
      on_error => "deviceCustomDate1_not_found"
    }
    if ![deviceCustomDate1_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "deviceCustomDate1_label"
        }
        on_error => "deviceCustomDate1_merge_failed"
      }
    }
  }
  if [cn2] != "" and [cn2Label] != "" {
    mutate {
      convert => {
        "cn2" => "string"
      }
      on_error => "cn2_not_converted"
    }
    mutate {
      replace => {
        "cn2_labels.key" => "%{cn2Label}"
        "cn2_labels.value.string_value" => "%{cn2}"
      }
      on_error => "invalid_cn2"
    }
    if ![invalid_cn2] {
      mutate {
        merge => {
          "additional.fields" =>"cn2_labels"
        }
        on_error => "cn2_labels_merge_failed"
      }
    }
  }
  if [cn3] != "" and [cn3Label] != "" {
    mutate {
      convert => {
        "cn3" => "string"
      }
      on_error => "cn3_not_converted"
    }
    mutate {
      replace => {
        "cn3_labels.key" => "%{cn3Label}"
        "cn3_labels.value.string_value" => "%{cn3}"
      }
      on_error => "invalid_cn3"
    }
    if ![invalid_cn3] {
      mutate {
        merge => {
          "additional.fields" =>"cn3_labels"
        }
        on_error => "cn3_labels_merge_failed"
      }
    }
  }
  if [intermediary_data] != "" {
    if [intermediary_data] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
      mutate {
        merge => {
          "intermediary.ip" => "intermediary_data"
        }
        on_error => "intermediary_ip_data_error"
      }
    }
    else {
      mutate {
        replace => {
          "intermediary.hostname" => "%{intermediary_data}"
          "intermediary.asset.hostname" => "%{intermediary_data}"
        }
        on_error => "intermediary_hostname_data_error"
      }
    }
  }
#Setting the event type

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [roles] != "" {
    mutate {
      merge => {
        "principal.user.attribute.roles" => "roles"
      }
      on_error => "no_roles"
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
      on_error => "no_additional"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
