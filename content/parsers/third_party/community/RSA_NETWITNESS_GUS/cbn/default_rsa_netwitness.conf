# Google SecOps Default CBN Parser (RSA_NETWITNESS)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/RSA_NETWITNESS/default/rsa_netwitness.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "RSA"
      "event.idm.read_only_udm.metadata.product_name" => "RSA_NETWITNESS"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
