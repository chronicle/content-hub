# Product: RSA NETWITNESS
# Category: PLATFORM CONFIGURATION
# Supported Format: SYSLOG, CEF, JSON
# Reference: https://community.rsa.com/yfcdo34327/attachments/yfcdo34327/netwitness-online-documentation/8726/2/rsa_nw_11.6_log_collection_guide.pdf
# Last Updated: 2026-09-25
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "metadata.event_type" => "GENERIC_EVENT"
      "command" => ""
      "username1" => ""
      "srcUser" => ""
      "TTY" => ""
      "PWD" => ""
      "ip" => ""
      "reason" => ""
      "security_action" => ""
      "time" => ""
      "action" => ""
      "hostname" => ""
      "application" => ""
      "process_id" => ""
      "description" => ""
      "security_result" => ""
      "intermediary" => ""
      "cef_version" => ""
      "device_vendor" => ""
      "device_product" => ""
      "device_version" => ""
      "device_event_class_id" => ""
      "event_name" => ""
      "severity" => ""
      "cef_extension" => ""
      "_raw" => ""
      "_time" => ""
      "host" => ""
      "_dataId" => ""
      "cribl_pipe" => ""
      "cribl_host_ip" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "addition" => ""
    }
  }

  if [message] =~ "^\\s*\\{" {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if ![not_json] {
      if [_time] != "" {
        mutate {
          convert => {
            "_time" => "string"
          }
          on_error => "time_convert_err"
        }
        date {
          match => ["_time", "UNIX", "ISO8601"]
          on_error => "cribl_date_err"
        }
      }
      if [cribl_pipe] != "" {
        mutate {
          replace => {
            "target.application" => "%{cribl_pipe}"
          }
          on_error => "cribl_pipe_app_err"
        }
      }
      if [_raw] != "" {
        mutate {
          replace => {
            "message" => "%{_raw}"
          }
          on_error => "raw_replace_err"
        }
      } else {
        if [host] != "" {
          grok {
            match => {
              "host" => ["^%{IP:cribl_host_ip}$"]
            }
            overwrite => ["cribl_host_ip"]
            on_error => "host_not_ip"
          }
          if ![host_not_ip] {
            mutate {
              merge => {
                "principal.ip" => "cribl_host_ip"
                "principal.asset.ip" => "cribl_host_ip"
              }
              on_error => "cribl_host_ip_err"
            }
            if ![cribl_host_ip_err] {
              mutate {
                replace => {
                  "has_principal" => "true"
                }
              }
            }
          } else {
            mutate {
              replace => {
                "principal.hostname" => "%{host}"
                "principal.asset.hostname" => "%{host}"
                "has_principal" => "true"
              }
              on_error => "cribl_host_name_err"
            }
          }
        }
        if [has_principal] == "true" {
          mutate {
            replace => {
              "metadata.event_type" => "STATUS_UPDATE"
            }
          }
        }
      }
    }
  }

  grok {
    match => {
      "message" => [
        "(?:<%{INT}>)?(?P<time>%{MONTH}\\s+%{MONTHDAY}(?:\\s+%{YEAR})?\\s+%{TIME}|%{TIMESTAMP_ISO8601})\\s+%{NOTSPACE:hostname}\\s+CEF:%{INT:cef_version}\\|(?P<device_vendor>[^|]*)\\|(?P<device_product>[^|]*)\\|(?P<device_version>[^|]*)\\|(?P<device_event_class_id>[^|]*)\\|(?P<event_name>[^|]*)\\|(?P<severity>[^|]*)\\|(?P<cef_extension>%{GREEDYDATA})",
        "<%{INT}>%{SYSLOGTIMESTAMP:time}\\s+%{HOST:hostname} (?P<application>(systemd|sudo))?((\\[%{NUMBER:process_id}\\])|):\\s+(?P<description>%{GREEDYDATA})"
      ]
    }
    overwrite => ["time", "hostname", "cef_version", "device_vendor", "device_product", "device_version", "device_event_class_id", "event_name", "severity", "cef_extension", "application", "process_id", "description"]
    on_error => "grok_failure"
  }

  if [cef_version] != "" {
    mutate {
      replace => {
        "rt" => ""
        "src" => ""
        "spt" => ""
        "dst" => ""
        "dpt" => ""
        "dvcpid" => ""
        "sessionId" => ""
        "suser" => ""
        "duser" => ""
        "sourceServiceName" => ""
        "deviceExternalId" => ""
        "deviceProcessName" => ""
        "deviceFacility" => ""
        "outcome" => ""
        "msg" => ""
        "params" => ""
        "userGroup" => ""
        "userRole" => ""
        "scope" => ""
        "file" => ""
        "arguments" => ""
        "http_referrer" => ""
        "http_method" => ""
        "http_user_agent" => ""
        "http_query" => ""
        "http_uri" => ""
        "remote_ip" => ""
        "xff_ip" => ""
        "remoteAddress" => ""
        "referrerURL" => ""
        "uri" => ""
        "userAgent" => ""
        "key" => ""
        "value" => ""
        "value_ips" => ""
        "suser_name" => ""
        "suser_id" => ""
        "param_id1" => ""
        "param_id2" => ""
        "param_size" => ""
        "param_flags" => ""
        "param_threshold" => ""
        "param_fieldName" => ""
        "param_where" => ""
        "param_queryPriority" => ""
        "param_deviceId" => ""
        "param_predicateIds" => ""
        "param_dc" => ""
        "has_user" => "false"
      }
    }

    if [cef_extension] != "" {
      mutate {
        gsub => [
          "cef_extension", "\\s+([a-zA-Z0-9_]+)=", " ^$1="
        ]
      }
      kv {
        source => "cef_extension"
        field_split => "^"
        value_split => "="
        on_error => "cef_kv_err"
      }
    }

    if [rt] != "" {
      date {
        match => ["rt", "MMM dd yyyy HH:mm:ss", "MMM  d yyyy HH:mm:ss", "ISO8601", "UNIX", "UNIX_MS"]
        on_error => "rt_date_err"
      }
      if [rt_date_err] {
        date {
          match => ["rt", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
          rebase => true
          on_error => "rt_rebase_err"
        }
      }
    } else if [time] != "" {
      date {
        match => ["time", "MMM dd yyyy HH:mm:ss", "MMM  d yyyy HH:mm:ss", "ISO8601"]
        on_error => "cef_time_err"
      }
      if [cef_time_err] {
        date {
          match => ["time", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
          rebase => true
          on_error => "cef_time_rebase_err"
        }
      }
    }

    if [params] not in ["", "[]", "{}"] {
      mutate {
        gsub => [
          "params", "\\\\=", "="
        ]
      }
      grok {
        match => {
          "params" => [
            "referrer=(?P<http_referrer>.*?)(?:,\\s+method=(?P<http_method>[A-Z]+))?(?:,\\s+X-Forwarded-For=(?P<xff_ip>%{IP}))?(?:,\\s+userAgent=(?P<http_user_agent>.*?))?(?:,\\s+queryString=(?P<http_query>(?:_dc=(?P<param_dc>[^&,\\}]+)&?)?(?:deviceId=(?P<param_deviceId>[^&,\\}]+)&?)?(?:collectionName=[^&,\\}]*&?)?(?:predicateIds=(?P<param_predicateIds>[^&,\\}]+))?[^,\\}]*))?(?:,\\s+uri=(?P<http_uri>[^,}\\s]+))?(?:,\\s+remoteAddress=(?P<remote_ip>%{IP}))?\\}$",
            "(?:queryPriority=(?P<param_queryPriority>[^\\s,]+)\\s+)?\\bid1=(?P<param_id1>[^\\s,]+)(?:\\s+id2=(?P<param_id2>[^\\s,]+))?(?:\\s+size=(?P<param_size>[^\\s,]+))?(?:\\s+flags=(?P<param_flags>[^\\s]+))?(?:\\s+threshold=(?P<param_threshold>[^\\s,]+))?(?:\\s+fieldName=(?P<param_fieldName>[^\\s,]+))?(?:\\s+where=\"(?P<param_where>[^\"]+)\")?(?:\\s+flags=(?P<param_flags>[^\\s]+))?(?:\\s+threshold=(?P<param_threshold>[^\\s,]+))?(?:\\s+queryPriority=(?P<param_queryPriority>[^\\s,]+))?",
            "\\bdeviceId=(?P<param_deviceId>[^&,\\}]+)(?:.*,\\s+size=(?P<param_size>[^\\s,]+),\\s+flags=(?P<param_flags>[^\\s]+))?",
            "\\bflags=(?P<param_flags>[^\\s]+)"
          ]
        }
        overwrite => ["http_referrer", "http_method", "http_user_agent", "http_query", "http_uri", "remote_ip", "xff_ip", "param_id1", "param_id2", "param_size", "param_flags", "param_threshold", "param_fieldName", "param_where", "param_queryPriority", "param_deviceId", "param_predicateIds", "param_dc"]
        on_error => "params_grok_err"
      }

      if [http_referrer] != "" {
        mutate {
          replace => {
            "network.http.referral_url" => "%{http_referrer}"
          }
          on_error => "http_ref_err"
        }
      }
      if [http_method] != "" {
        mutate {
          replace => {
            "network.http.method" => "%{http_method}"
          }
          on_error => "http_method_err"
        }
      }
      if [event_name] == "HttpRequest" or [http_method] in ["GET", "POST", "PUT", "DELETE"] {
        mutate {
          replace => {
            "network.application_protocol" => "HTTP"
          }
        }
      }
      if [http_user_agent] != "" {
        mutate {
          replace => {
            "network.http.user_agent" => "%{http_user_agent}"
          }
          on_error => "http_ua_err"
        }
      }
      if [http_uri] != "" and [http_query] != "" {
        mutate {
          replace => {
            "target.url" => "%{http_uri}?%{http_query}"
          }
          on_error => "http_url_query_err"
        }
      } else if [http_uri] != "" {
        mutate {
          replace => {
            "target.url" => "%{http_uri}"
          }
          on_error => "http_url_err"
        }
      }
      if [xff_ip] != "" {
        mutate {
          merge => {
            "intermediary.ip" => "xff_ip"
          }
          on_error => "xff_ip_merge_err"
        }
      }
      if [src] == "" and [remote_ip] != "" {
        mutate {
          replace => {
            "src" => "%{remote_ip}"
          }
          on_error => "remote_ip_src_err"
        }
      }
    }

    if [src] == "" and [remoteAddress] != "" {
      mutate {
        replace => {
          "src" => "%{remoteAddress}"
        }
        on_error => "remoteAddress_src_err"
      }
    }
    if [http_referrer] == "" and [referrerURL] != "" {
      mutate {
        replace => {
          "network.http.referral_url" => "%{referrerURL}"
        }
        on_error => "referrerURL_err"
      }
    }
    if [http_uri] == "" and [uri] != "" {
      mutate {
        replace => {
          "target.url" => "%{uri}"
        }
        on_error => "uri_err"
      }
    }
    if [http_user_agent] == "" and [userAgent] != "" {
      mutate {
        replace => {
          "network.http.user_agent" => "%{userAgent}"
        }
        on_error => "userAgent_err"
      }
    }
    if [key] != "" {
      mutate {
        replace => {
          "target.resource.name" => "%{key}"
        }
        on_error => "key_err"
      }
    }
    if [value] != "" {
      grok {
        match => {
          "value" => "%{IP:value_ips}"
        }
        match_all => true
        overwrite => ["value_ips"]
        on_error => "value_ip_grok_err"
      }
      if ![value_ip_grok_err] {
        for idx, ip_val in value_ips map {
          mutate {
            merge => {
              "target.ip" => "ip_val"
              "target.asset.ip" => "ip_val"
            }
            on_error => "value_ip_merge_err"
          }
        }
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    if [device_version] != "" {
      mutate {
        replace => {
          "metadata.product_version" => "%{device_version}"
        }
        on_error => "device_version_err"
      }
    }
    if [event_name] != "" and [device_event_class_id] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{device_event_class_id} - %{event_name}"
        }
        on_error => "prod_event_type_err"
      }
    } else if [event_name] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{event_name}"
        }
        on_error => "prod_event_type_fallback_err"
      }
    }
    if [msg] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{msg}"
        }
        on_error => "msg_desc_err"
      }
    }

    if [src] != "" {
      grok {
        match => {
          "src" => [
            "%{IP:src}"
          ]
        }
        overwrite => ["src"]
        on_error => "src_not_ip"
      }
      if ![src_not_ip] {
        mutate {
          merge => {
            "principal.ip" => "src"
            "principal.asset.ip" => "src"
          }
          on_error => "src_ip_err"
        }
        if ![src_ip_err] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    if [spt] != "" {
      mutate {
        convert => {
          "spt" => "integer"
        }
        on_error => "spt_int_err"
      }
      if ![spt_int_err] {
        mutate {
          rename => {
            "spt" => "principal.port"
          }
          on_error => "spt_rename_err"
        }
      }
    }
    if [suser] != "" {
      grok {
        match => {
          "suser" => [
            "^(?P<suser_name>[^\\(]+)\\((?P<suser_id>[^\\)]+)\\)$"
          ]
        }
        overwrite => ["suser_name", "suser_id"]
        on_error => "suser_no_parens"
      }
      if ![suser_no_parens] {
        mutate {
          replace => {
            "principal.user.user_display_name" => "%{suser_name}"
          }
          on_error => "suser_name_err"
        }
        mutate {
          replace => {
            "principal.user.userid" => "%{suser_id}"
            "has_user" => "true"
          }
          on_error => "suser_id_err"
        }
      } else {
        mutate {
          replace => {
            "principal.user.userid" => "%{suser}"
            "has_user" => "true"
          }
          on_error => "suser_userid_err"
        }
      }
    }
    if [userGroup] not in ["", "[]", "{}"] {
      mutate {
        gsub => [
          "userGroup", ";", ","
        ]
      }
      mutate {
        split => {
          source => "userGroup"
          separator => ","
          target => "userGroup_list"
        }
        on_error => "userGroup_split_err"
      }
      for group_idx, group_item in userGroup_list {
        if [group_item] != "" {
          mutate {
            merge => {
              "principal.user.group_identifiers" => "group_item"
            }
            on_error => "userGroup_merge_err"
          }
        }
      }
    }
    if [userRole] not in ["", "[]", "{}"] {
      mutate {
        gsub => [
          "userRole", ";", ","
        ]
      }
      mutate {
        split => {
          source => "userRole"
          separator => ","
          target => "userRole_list"
        }
        on_error => "userRole_split_err"
      }
      for role_idx, role_item in userRole_list {
        if [role_item] != "" {
          mutate {
            replace => {
              "role_obj" => ""
            }
          }
          mutate {
            replace => {
              "role_obj.name" => "%{role_item}"
            }
            on_error => "role_obj_err"
          }
          if ![role_obj_err] {
            mutate {
              merge => {
                "principal.user.attribute.roles" => "role_obj"
              }
              on_error => "role_obj_merge_err"
            }
          }
        }
      }
    }

    if [hostname] != "" {
      mutate {
        replace => {
          "target.hostname" => "%{hostname}"
          "target.asset.hostname" => "%{hostname}"
          "has_target" => "true"
        }
        on_error => "hostname_err"
      }
    }
    if [dst] != "" {
      grok {
        match => {
          "dst" => [
            "%{IP:dst}"
          ]
        }
        overwrite => ["dst"]
        on_error => "dst_not_ip"
      }
      if ![dst_not_ip] {
        mutate {
          merge => {
            "target.ip" => "dst"
            "target.asset.ip" => "dst"
          }
          on_error => "dst_ip_err"
        }
        if ![dst_ip_err] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
    if [dpt] != "" {
      mutate {
        convert => {
          "dpt" => "integer"
        }
        on_error => "dpt_int_err"
      }
      if ![dpt_int_err] {
        mutate {
          rename => {
            "dpt" => "target.port"
          }
          on_error => "dpt_rename_err"
        }
      }
    }
    if [duser] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{duser}"
          "has_user" => "true"
        }
        on_error => "duser_err"
      }
    }
    if [sourceServiceName] != "" {
      mutate {
        replace => {
          "target.application" => "%{sourceServiceName}"
        }
        on_error => "source_service_err"
      }
    }
    if [deviceExternalId] != "" {
      mutate {
        replace => {
          "target.asset.product_object_id" => "%{deviceExternalId}"
        }
        on_error => "dev_ext_id_err"
      }
    }
    if [dvcpid] != "" {
      mutate {
        replace => {
          "target.process.pid" => "%{dvcpid}"
        }
        on_error => "dvcpid_err"
      }
    }
    if [deviceProcessName] != "" {
      mutate {
        replace => {
          "target.process.command_line" => "%{deviceProcessName}"
        }
        on_error => "dev_proc_name_err"
      }
    }
    if [file] != "" {
      mutate {
        replace => {
          "target.file.full_path" => "%{file}"
        }
        on_error => "file_path_err"
      }
    }
    if [sessionId] != "" {
      mutate {
        replace => {
          "network.session_id" => "%{sessionId}"
        }
        on_error => "session_id_err"
      }
    }

    if [severity] != "" {
      mutate {
        replace => {
          "security_result.severity_details" => "%{severity}"
        }
        on_error => "sev_details_err"
      }

      if [severity] in ["0", "1", "2", "3"] {
        mutate {
          replace => {
            "security_result.severity" => "LOW"
          }
        }
      } else if [severity] in ["4", "5", "6"] {
        mutate {
          replace => {
            "security_result.severity" => "MEDIUM"
          }
        }
      } else if [severity] in ["7", "8"] {
        mutate {
          replace => {
            "security_result.severity" => "HIGH"
          }
        }
      } else if [severity] in ["9", "10"] {
        mutate {
          replace => {
            "security_result.severity" => "CRITICAL"
          }
        }
      }
    }
    if [outcome] != "" {
      if [outcome] =~ "(?i)^success" {
        mutate {
          replace => {
            "cef_sec_action" => "ALLOW"
          }
        }
        mutate {
          merge => {
            "security_result.action" => "cef_sec_action"
          }
          on_error => "outcome_allow_merge_err"
        }
      }
      else if [outcome] =~ "(?i)^(fail|deny|block|reject|error)" {
        mutate {
          replace => {
            "cef_sec_action" => "BLOCK"
          }
        }
        mutate {
          merge => {
            "security_result.action" => "cef_sec_action"
          }
          on_error => "outcome_block_merge_err"
        }
      }
      else {
        mutate {
          replace => {
            "outcome_label.key" => "outcome"
            "outcome_label.value" => "%{outcome}"
          }
          on_error => "outcome_label_err"
        }
        if ![outcome_label_err] {
          mutate {
            merge => {
              "security_result.detection_fields" => "outcome_label"
            }
            on_error => "outcome_label_merge_err"
          }
        }
      }
    }
    if [action] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action}"
        }
        on_error => "action_details_err"
      }
    }

    # Event Type Categorization
    if [device_event_class_id] == "AUTHENTICATION" and [event_name] =~ "(?i)login" and ([has_user] == "true" or [has_principal] == "true") and [has_target] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGIN"
          "cef_auth_mechanism" => "USERNAME_PASSWORD"
          "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
      mutate {
        merge => {
          "extensions.auth.mechanism" => "cef_auth_mechanism"
        }
        on_error => "evt_login_mech_err"
      }
    }
    else if [device_event_class_id] == "AUTHENTICATION" and [event_name] =~ "(?i)(logout|logoff)" and ([has_user] == "true" or [has_principal] == "true") and [has_target] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGOUT"
          "cef_auth_mechanism" => "USERNAME_PASSWORD"
          "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
      mutate {
        merge => {
          "extensions.auth.mechanism" => "cef_auth_mechanism"
        }
        on_error => "evt_logout_mech_err"
      }
    } else if ([event_name] == "HttpRequest" or [http_method] != "") and [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "NETWORK_HTTP"
        }
      }
    } else if [has_user] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    } else if [has_principal] == "true" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
    } else {
      if [time] != "" {
      date {
        match => ["time", "MMM dd HH:mm:ss", "MMM d HH:mm:ss", "ISO8601"]
        rebase => true
        on_error => "legacy_time_err"
      }
    }

  if [hostname] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{hostname}"
      }
      on_error => "legacy_hostname_err"
    }
  }
  if [process_id] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{process_id}"
      }
      on_error => "legacy_pid_err"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "legacy_desc_err"
    }
  }
  if [application] == "systemd" {
    grok {
      match => {
        "description" => [
          "(?P<action>session (opened|closed)) for user %{WORD:username} ?(by.*|)"
          "(?P<action>(Created|Removed) slice) .* of %{WORD:username}"
          "(?P<action>(Starting|Stopping|Started|Stopped) User (Slice|Manager)) (of|for UID) %{WORD:username}"
          "(?P<action>(Starting|Started) Session) %{GREEDYDATA:sessionId} of user %{WORD:username}"
          "(?P<action>.* PID %{NUMBER:pid})"
          "%{GREEDYDATA:action}"
        ]
      }
      overwrite => ["action","username","sessionId", "pid"]
      on_error => "grok_fail_systemd"
    }

    if ![grok_fail_systemd] {
      if [action] != "" {
        mutate {
          replace => {
            "security_result.description" => "%{action}"
          }
          on_error => "systemd_action_desc_err"
        }
      }
      if [action] == "session closed" {
        if [username] != "" {
          mutate {
            replace => {
              "target.user.userid" => "%{username}"
            }
            on_error => "systemd_close_user_err"
          }
        }
        mutate {
          replace => {
            "metadata.event_type" => "USER_LOGOUT"
            "mechanism" => "USERNAME_PASSWORD"
          }
        }
        mutate {
          merge => {
            "extensions.auth.mechanism" => "mechanism"
          }
          on_error => "systemd_close_mech_err"
        }
      }
      if [action] == "session opened" {
        if [username] != "" {
          mutate {
            replace => {
              "target.user.userid" => "%{username}"
            }
            on_error => "systemd_open_user_err"
          }
        }
        mutate {
          replace => {
            "metadata.event_type" => "USER_LOGIN"
            "mechanism" => "USERNAME_PASSWORD"
          }
        }
        mutate {
          merge => {
            "extensions.auth.mechanism" => "mechanism"
          }
          on_error => "systemd_open_mech_err"
        }
      }

      if [action] in ["Created slice","Removed slice"] {
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
            "security_result.description" => "%{action}"
          }
          on_error => "systemd_slice_evt_err"
        }
        if [username] != "" {
          mutate {
            replace => {
              "target.user.userid" => "%{username}"
            }
            on_error => "systemd_slice_user_err"
          }
        }
      }
      else if [action] in ["Starting User Manager","Started User Manager","Stopped User Manager","Stopping User Manager"] {
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
            "security_result.description" => "%{action}"
          }
          on_error => "systemd_mgr_evt_err"
        }
        if [username] in ["0","root"] {
          mutate {
            replace => {
              "principal.user.userid" => "root"
            }
          }
        }
        else if [username] != "" {
          mutate {
            replace => {
              "principal.user.userid" => "%{username}"
            }
            on_error => "systemd_mgr_user_err"
          }
        }
      }
      else if [action] in ["Starting Session","Started Session"] {
        if [username] != "" {
          mutate {
            replace => {
              "target.user.userid" => "%{username}"
            }
            on_error => "systemd_sess_user_err"
          }
        }
        if [sessionId] != "" {
          mutate {
            replace => {
              "network.session_id" => "%{sessionId}"
            }
            on_error => "systemd_sess_id_err"
          }
        }
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
            "security_result.description" => "%{action}"
          }
          on_error => "systemd_sess_evt_err"
        }
      }
      else if [action] in ["Starting","Stopping"] or [description] =~ "(Starting|Stopping)" {
        mutate {
          replace => {
            "mechanism" => "SERVICE"
          }
        }
        mutate {
          merge => {
            "extensions.auth.mechanism" => "mechanism"
          }
          on_error => "systemd_svc_mech_merge_err"
        }
        if [action] == "Starting" {
          mutate {
            replace => {
              "metadata.event_type" => "SERVICE_START"
            }
          }
        }
        else {
          mutate {
            replace => {
              "metadata.event_type" => "SERVICE_STOP"
            }
          }
        }
        mutate {
          replace => {
            "target.application" => "%{application}"
            "security_result.description" => "%{action}"
          }
          on_error => "systemd_svc_app_err"
        }
        mutate {
          replace => {
            "application" => ""
          }
        }
      }
      else if [action] =~ "Received .*from" {
        if [pid] != "" {
          mutate {
            replace => {
              "target.process.pid" => "%{pid}"
              "target.application" => "%{application}"
              "metadata.event_type" => "PROCESS_TERMINATION"
              "extensions.auth.type" => "MACHINE"
            }
            on_error => "systemd_proc_term_err"
          }
        }
      }
    }
  }

  else if [application] == "sudo" {
    grok {
      match => {
        "description" => [
          "%{DATA:srcUser} :.*?TTY=%{WORD:TTY}.*?PWD=(?P<PWD>.*);.*?USER=%{WORD:username1}.*?COMMAND=(?P<command>.*) %{IP:ip}"
          "%{DATA:srcUser} :.*?TTY=%{WORD:TTY}.*?PWD=(?P<PWD>.*);.*?USER=%{WORD:username1}.*?COMMAND=(?P<command>.*)\\s+#"
          "(?P<action>session (opened|closed)) for user %{WORD:username1} ?(by.*|)"
          "(?P<action>expired password) for user (?P<username1>.*?) \\((?P<reason>.*)\\)"
        ]
      }
      overwrite => ["command","username1","srcUser","action","TTY","PWD","reason", "ip"]
      on_error => "sudo_grok_fail"
    }

    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "sudo_desc_err"
    }
    if [ip] != "" {
      mutate {
        merge => {
          "principal.ip" => "ip"
        }
        on_error => "sudo_ip_err"
      }
    }
    if [TTY] not in ["","unknown"] {
      mutate {
        replace => {
          "tty_label.key" => "tty"
          "tty_label.value" => "%{TTY}"
        }
        on_error => "sudo_tty_label_err"
      }
      mutate {
        merge => {
          "security_result.about.labels" => "tty_label"
        }
        on_error => "sudo_tty_label_merge_err"
      }
    }
    if [command] != "" {
      mutate {
        replace => {
          "target.process.command_line" => "%{command}"
        }
        on_error => "sudo_cmd_err"
      }
    }

    if [PWD] not in ["","/ "] {
      mutate {
        replace => {
          "target.process.file.full_path" => "%{PWD}"
        }
        on_error => "sudo_pwd_err"
      }
    }
    if [srcUser] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{srcUser}"
          "metadata.event_type" => "USER_UNCATEGORIZED"

        }
        on_error => "sudo_srcuser_err"
      }
    }
    if [username1] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{username1}"
        }
        on_error => "sudo_user1_err"
      }
    }
    if [action] =~ "closed" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGOUT"
          "_action" => "BLOCK"
        }
      }
    }
    else if [action] =~ "opened"{
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGIN"
          "security_action" => "ALLOW"
        }
      }
    }
    else if [action] == "expired password" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGIN"
          "security_result.summary" => "%{reason}"
          "security_action" => "BLOCK"
        }
        on_error => "sudo_expired_err"
      }
    }

    mutate {
      replace => {
          "mechanism" => "USERNAME_PASSWORD"
      }
    }
    if [security_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_action"
        }
        on_error => "sudo_sec_action_err"
      }
    }
    mutate {
      merge => {
        "extensions.auth.mechanism" => "mechanism"
      }
      on_error => "sudo_mech_merge_err"
    }
    mutate {
      replace => {
        "principal.platform" => "LINUX"
      }
    }
    }
    if [metadata][event_type] == "GENERIC_EVENT" and [hostname] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }

  mutate {
    rename => {
      "_dataId" => "addition._dataId"
      "param_id1" => "addition.id1"
      "param_id2" => "addition.id2"
      "param_size" => "addition.size"
      "param_flags" => "addition.flags"
      "param_threshold" => "addition.threshold"
      "param_fieldName" => "addition.fieldName"
      "param_where" => "addition.where"
      "param_queryPriority" => "addition.queryPriority"
      "param_deviceId" => "addition.deviceId"
      "param_predicateIds" => "addition.predicateIds"
      "param_dc" => "addition._dc"
      "cef_version" => "addition.cef_version"
      "device_product" => "addition.device_product"
      "scope" => "addition.scope"
      "deviceFacility" => "addition.deviceFacility"
      "arguments" => "addition.arguments"
    }
  }

  for key, value in addition map {
    mutate {
      replace => {
        "map_field" => ""
        "map_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "map_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [map_check] not in ["", "[]", "{}"] {
      mutate {
        replace => {
          "map_field.key" => "%{key}"
          "map_field.value.string_value" => "%{value}"
        }
        on_error => "map_str_val_err"
      }
      if ![map_str_val_err] {
        mutate {
          merge => {
            "additional.fields" => "map_field"
          }
          on_error => "map_str_merge_err"
        }
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "final_sec_res_err"
    }
  }
  if [application] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{application}"
        }
        on_error => "legacy_app_prod_evt_err"
      }
    }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "final_intermediary_err"
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "RSA"
      "metadata.product_name" => "RSA NETWITNESS"
    }
  }

  mutate {
    rename => {
      "additional" => "event.idm.read_only_udm.additional"
      "extensions" => "event.idm.read_only_udm.extensions"
      "target" => "event.idm.read_only_udm.target"
      "metadata" => "event.idm.read_only_udm.metadata"
      "network" => "event.idm.read_only_udm.network"
      "principal" => "event.idm.read_only_udm.principal"
    }
  }
  mutate {
    merge => {
        "@output" => "event"
    }
  }
}
