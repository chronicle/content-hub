# Product: Cisco UCM
# Category: Communication Manager
# Supported Format:  SYSLOG + KV
# Reference:
# -> https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/cucm/docguide/11_5_1/cucm_b_documentation-guide-cucm-imp-1151.html#reference_F649712BCAEE6553A97724A90D936526
# -> https://doc.opensuse.org/documentation/leap/archive/42.1/security/html/book.security/cha.audit.comp.html
# -> https://linux.die.net/man/8/ausearch, https://floatingoctothorpe.uk/2017/getting-started-with-auditd.html
# -> https://www.sudo.ws/docs/man/1.8.16/sudoers.man/#LOG_FORMAT
# -> https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/cucm/managed_services/11_5_1/cucm_b_cucm-imp-managed-services-1151/cucm_b_cucm-imp-managed-services-1151_chapter_0101.html
# Last Updated: 2026-07-15
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "metadata.event_type" => "GENERIC_EVENT"
      "security_result" => ""
      "additional" => ""
      "type" => ""
      "msg" => ""
      "about" => ""
      "username" => ""
      "host" => ""
      "domain" => ""
      "TTY" => ""
      "COMMAND" => ""
      "PWD" => ""
      "description" => ""
      "time" => ""
      "log_id" => ""
      "node" => ""
      "DeviceName" => ""
      "AppID" => ""
      "AlertName" => ""
      "AlertDetail" => ""
      "appname" => ""
      "syslog_severity_code" => ""
      "msgname" => ""
      "tags" => ""
      "to" => ""
      "from" => ""
      "size" => ""
      "status" => ""
      "application" => ""
      "command" => ""
      "sudo_desc" => ""
      "srcUser" => ""
      "username1" => ""
      "auth_mechanism" => ""
      "username2" => ""
      "intermediary" => ""
      "kv_data" => ""
      "inter_ip" => ""
      "UserID" => ""
      "ClientAddress" => ""
      "EventType" => ""
      "ResourceAccessed" => ""
      "EventStatus" => ""
      "AuditDetails" => ""
      "ComponentID" => ""
      "NodeID" => ""
      "Severity" => ""
      "CompulsoryEvent" => ""
      "AuditCategory" => ""
      "CorrelationID" => ""
      "ClusterID" => ""
      "metadata.product_event_type" => ""
      "pid" => ""
      "has_principal" => "false"
      "AgreementId" => ""
      "LDAPHost" => ""
      "ldap_host_protocol" => ""
      "ldap_host_ip" => ""
      "ldap_host_port" => ""
      "trailing_msg" => ""
      "timezone" => ""
      "syslog_pri" => ""
      "syslog_seq" => ""
      "xml_version" => ""
      "xml_encoding" => ""
      "soap_ns" => ""
      "method" => ""
      "url" => ""
      "axl_api_version" => ""
      "userid" => ""
      "password" => ""
      "message_type" => ""
      "uniqueidentifier" => ""
      "firstname" => ""
      "lastname" => ""
      "mailid" => ""
      "displayname" => ""
      "title" => ""
      "agreement_value" => ""
      "client_address_ip" => ""
      "severity" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", " "]
  }
  mutate {
    gsub => ["message", "\\n", ""]
  }
  mutate {
    gsub => ["message" , "\\*" , ""]
  }

  if [message] != "" {
    grok {
      match => {
        "message" => [
          "^%{INT}: %{GREEDYDATA:time} :\\s+%%{DATA:appname}-%{INT:syslog_severity_code}-%{DATA:msgname}:\\s+\\%%{GREEDYDATA:tags}:\\s+%{GREEDYDATA:description}",
          "<%{INT}>%{NUMBER}: : ?(%{WORD}|):\\s+%{NUMBER}:\\s+%{HOST:host}:\\s+%{GREEDYDATA:time}\\s+:\\s+\\%%{DATA:appname}-%{INT:syslog_severity_code}-%{DATA:msgname}:\\s+\\%%{GREEDYDATA:tags}:\\s+%{GREEDYDATA:description}",
          "<%{INT}>%{NUMBER}: : %{WORD:application}:node=(?P<host>\\w+).(?P<domain>\\w+)\\s+%{GREEDYDATA}",
          "<%{INT}>%{NUMBER}: :\\s+%{WORD:application}:\\s+\\(%{WORD:username}\\)\\s+CMD\\s+\\(%{GREEDYDATA:COMMAND}\\)",
          "<%{INT}>%{NUMBER}: : (?P<application>sudo):\\s+%{GREEDYDATA:sudo_desc}",
          "<%{INT}>%{NUMBER}: : ?(?P<application>(systemd|bash|run-parts|sshd|logrotate|scsi-watchdog|clm)):(?P<description>%{GREEDYDATA})",
          "<%{INT}>%{SYSLOGTIMESTAMP} (%{DATA:inter_ip} : : %{DATA:pid}: %{DATA} %{DATA:time} :%{DATA}:|%{DATA:inter_ip} %{DATA:time} :%{DATA}:) \\%%{GREEDYDATA:kv_data}: %{GREEDYDATA:description}"
          "^%{SYSLOGTIMESTAMP} %{IP:inter_ip} %{INT:pid}: %{GREEDYDATA:time} :\\s+%%{DATA:appname}-%{INT:syslog_severity_code}-%{DATA:msgname}:\\s+\\%%{GREEDYDATA:tags}:\\s+%{GREEDYDATA:description}\\s+",
          "^<(?<syslog_pri>[0-9]+)>(?<syslog_seq>[0-9]+): +%{DATA:time} +%{WORD:timezone} +: +%%{DATA:message_type}: +%%{GREEDYDATA:kv_data1}(?::(?<trailing_msg>.*))?$"
        ]
      }
      overwrite => ["host", "domain","username","description","COMMAND","time","appname","syslog_severity_code","msgname","tags","application","sudo_desc", "kv_data", "inter_ip", "pid","event_name", "trailing_msg","timezone", "month", "day", "year", "syslog_pri", "syslog_seq","message_type"]
      on_error => "grok_first_failure"
    }

    if ![grok_first_failure] and [host] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{host}"
          "has_principal" => "true"
        }
      }
    }
    if ![grok_first_failure] and [domain] != "" {
      mutate {
        replace => {
          "principal.administrative_domain" => "%{domain}"
        }
      }
    }
  }
  mutate {
    gsub => ["kv_data1", "]", "#"]
  }
  mutate {
    gsub => ["kv_data1", "\\[", ""]
  }
  kv {
    source => "kv_data1"
    value_split => "="
    field_split => "#"
    on_error => "not_kv_new_data"
  }
  if [time] != "" {
    date {
      match => ["time", "MMM dd yyyy HH:mm:ss.SSS", "MMM dd yyyy HH:mm:ss.SSS ZZZ", "ISO8601"]
      on_error => "date_parse_error"
    }
  }
  if [appname] != "" {
    mutate {
      replace => {
        "principal.application" => "%{appname}"
      }
    }
  }
  if [Severity] != "" and [syslog_severity_code] == "" {
    mutate {
      replace => {
        "syslog_severity_code" => "%{Severity}"
      }
      on_error => "Severity_not_found"
    }
  }
  mutate {
    convert => {
      "syslog_severity_code" => "string"
    }
    on_error => "already_in_string"
  }
  if [syslog_severity_code] in ["5","6","7"] {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [syslog_severity_code] in ["3","4"] {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [syslog_severity_code] in ["0","1", "2"] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
   if [msgname] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{msgname}"
      }
    }
  }
  if [tags] != "" or ![not_kv_new_data] {
    mutate {
      gsub => ["tags", "\\]\\[", "#"]
    }
    mutate {
      gsub => ["tags", "\\]|\\[",""]
    }
    mutate {
      gsub => ["tags", "App ID", "AppID"]
    }
    mutate {
      gsub => ["tags", "Node ID", "NodeID"]
    }
    mutate {
      gsub => ["tags", "Cluster ID", "ClusterID"]
    }
    kv {
     source => "tags"
     value_split => "="
     field_split => "#"
     overwrite => ["UserID", "ClientAddress", "Severity", "EventType", "ResourceAccessed", "EventStatus", "CompulsoryEvent", "AuditCategory", "ComponentID", "CorrelationID", "AuditDetails", "AppID", "ClusterID", "NodeID", "DeviceName", "AlertName", "AlertDetail", "AgreementID", "LDAPHost"]
     on_error => "not_kv_tags"
    }

    if [DeviceName] != "" {
      mutate {
        replace => {
          "target.resource.name" => "%{DeviceName}"
        }
      }
    }
    if [AgreementId] != "" {
      mutate {
        convert => {
          "AgreementId" => "string"
        }
        on_error => "AgreementId_already_in_string"
      }
      mutate {
        replace => {
          "additional_agreementId.key" => "AgreementId"
          "additional_agreementId.value" => "%{AgreementId}"
        }
        on_error => "AgreementId_not_found"
      }
      if ![AgreementId_not_found] {
        mutate {
          merge => {
            "principal.resource.attribute.labels" => "additional_agreementId"
          }
          on_error => "AgreementId_merge_error_not_found"
        }
      }
    }
    if [LDAPHost] != "" {
      mutate {
        replace => {
          "target.url" => "%{LDAPHost}"
        }
        on_error => "LDAPHost_not_found"
      }
      if ![LDAPHost_not_found] {
        grok {
          match => {
            "LDAPHost" => "%{WORD:ldap_host_protocol}://%{IP:ldap_host_ip}:%{NUMBER:ldap_host_port}"
          }
          overwrite => ["ldap_host_protocol", "ldap_host_ip", "ldap_host_port"]
          on_error => "grok_ldaphost_url_failed"
        }
        if ![grok_ldaphost_url_failed] {
          if [ldap_host_protocol] != "" {
            mutate {
              replace => {
                "additional_ldap_host_protocol.key" => "LDAPHostProtocol"
                "additional_ldap_host_protocol.value.string_value" => "%{ldap_host_protocol}"
              }
            on_error => "ldap_host_protocol_not_found"
            }
            if ![ldap_host_protocol_not_found] {
              mutate {
                merge => {
                  "event.idm.read_only_udm.additional.fields" => "additional_ldap_host_protocol"
                }
                on_error => "ldap_host_protocol_merge_error_not_found"
              }
            }
          }
          if [ldap_host_ip] != "" {
            mutate {
              merge => {
                "target.ip" => "ldap_host_ip"
              }
              on_error => "merge_target_ip_failed"
            }
          }
          if [ldap_host_port] != "" {
            mutate {
              replace => {
                "target.port" => "%{ldap_host_port}"
              }
              on_error => "replace_target_port_failed"
            }
            mutate {
              convert => {
                "target.port" => "integer"
              }
              on_error => "convert_target_port_failed"
            }
          }
        }
      }
    }
    if [ClusterID] != "" {
      mutate {
        replace => {
          "additional_clusterId.key" => "ClusterID"
          "additional_clusterId.value" => "%{ClusterID}"
        }
      }
      mutate {
        merge => {
          "target.resource.attribute.labels" => "additional_clusterId"
        }
      }
    }
    if [AlertName] != "" {
      mutate {
        replace => {
          "detection_type.key" => "AlertName"
          "detection_type.value" => "%{AlertName}"
        }
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_type"
        }
      }
    }
    if [AlertDetail] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{AlertDetail}"
        }
      }
    }

    if [UserID] != "" {
      mutate {
        replace => {
          "principal.user.userid" => "%{UserID}"
        }
        on_error => "UserID_not_found"
      }
    }
    if [ClientAddress] != "" {
      grok {
        match => {
          "ClientAddress" => "%{IP:client_address_ip}"
        }
        overwrite => ["client_address_ip"]
        on_error => "clientaddress_not_ip"
      }
      if ![clientaddress_not_ip] {
        mutate {
          merge => {
            "principal.ip" => "client_address_ip"
            "principal.asset.ip" => "client_address_ip"
          }
          on_error => "ClientAddress_not_found"
        }
        if ![ClientAddress_not_found] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    if [EventType] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{EventType}"
        }
        on_error => "EventType_not_found"
      }
      if [EventType] == "UserLogging" {
         mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
          }
          on_error => "metadata_event_type_not_set_user_logging"
        }
      }
      if [EventType] == "UserAccess" {
         mutate {
          replace => {
            "metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
          on_error => "metadata_event_type_not_set_user_access"
        }
      }
      if [EventType] in ["UserRoleMembershipUpdate","GeneralConfigurationUpdate"] {
        mutate {
          replace => {
            "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
          }
        }
      }
    }
    if [ResourceAccessed] != "" {
      mutate {
        replace => {
          "target.resource.name" => "%{ResourceAccessed}"
        }
        on_error => "ResourceAccessed_not_found"
      }
    }
    if [EventStatus] == "Success" {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "action_not_found"
      }
    } else if [EventStatus] != "" and [EventStatus] != "Success" {
      mutate {
        replace => {
          "action" => "FAIL"
        }
      }
      mutate {
        merge => {
          "security_result.action" => "action"
        }
        on_error => "action_found"
      }
    }
    if [syslog_seq] != "" {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{syslog_seq}"
        }
        on_error => "syslog_seq_not_found"
      }
    }
    if [message_type] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{message_type}"
        }
        on_error => "message_type_not_found"
      }
    }
    grok {
      match => {
        "AuditDetails" => [
          "AXL REQUEST :  \\<\\?xml version='%{DATA:xml_version}' encoding='%{DATA:xml_encoding}'?>.*?<soapenv:Envelope xmlns:soapenv=\"%{DATA:soap_ns}\">.*?<ns:%{WORD:method} xmlns:ns=\"%{GREEDYDATA:url}\\/%{NUMBER:axl_api_version}\"><userid>%{USERNAME:userid}</userid><password>(?P<password>[^<]*)</password>.*",
         "Added\\s+enduser\\.\\s+Sync\\s+agreement=%{DATA:agreement_value}\\.\\s+displayname=%{DATA:displayname}\\s*,\\s*lastname=%{DATA:lastname}\\s*,\\s*firstname=%{DATA:firstname}\\s*,\\s*mailid=%{DATA:mailid}\\s*,\\s*userid=%{DATA:userid}\\s*,\\s*title=%{DATA:title}\\s*,\\s*uniqueidentifier=%{GREEDYDATA:uniqueidentifier}"
        ]
      }
      overwrite => ["xml_version", "xml_encoding", "soap_ns", "method", "url", "axl_api_version", "userid", "password","mailid", "displayname", "lastname", "firstname", "title", "uniqueidentifier", "agreement_value"]
      on_error => "AuditDetails_grok_failure"
    }
    if [userid] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{userid}"
        }
        on_error => "userid_not_found"
      }
    }
    if [uniqueidentifier] != "" {
      mutate {
        replace => {
          "target.user.product_object_id" => "%{uniqueidentifier}"
        }
        on_error => "uniqueidentifier_not_found"
      }
    }
    if [firstname] != "" {
      mutate {
        replace => {
          "target.user.first_name" => "%{firstname}"
        }
        on_error => "firstname_not_found"
      }
    }
    if [lastname] != "" {
      mutate {
        replace => {
          "target.user.last_name" => "%{lastname}"
        }
        on_error => "lastname_not_found"
      }
    }
    if [mailid] =~ "^.+@.+$" {
      mutate {
        merge => {
          "target.user.email_addresses" => "mailid"
        }
        on_error => "mailid_not_found"
      }
    }
    if [displayname] != "" {
      mutate {
        replace => {
          "target.user.user_display_name" => "%{displayname}"
        }
        on_error => "displayname_not_found"
      }
    }
    if [title] != "" {
      mutate {
        replace => {
          "target.user.title" => "%{title}"
        }
        on_error => "title_not_found"
      }
    }
    if [AuditDetails] != "" and [AuditDetails_grok_failure] {
      mutate {
        replace => {
          "security_result.description" => "%{AuditDetails}"
        }
        on_error => "AuditDetails_not_found"
      }
    }
    if [ComponentID] != "" {
       mutate {
        replace => {
          "observer.application" => "%{ComponentID}"
        }
        on_error => "ComponentID_not_found"
      }
    }
    if [CorrelationID] != "" {
      mutate {
        replace => {
          "correlationID_label.value.string_value" => "%{CorrelationID}"
        }
        on_error => "correlationID_label_not_present"
      }
      if ![correlationID_label_not_present] {
        mutate {
          replace => {
            "correlationID_label.key" => "CorrelationID"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "correlationID_label"
          }
          on_error => "correlationID_label_not_found"
        }
      }
    }
    if [ClusterID] != "" {
      mutate {
        replace => {
          "ClusterID_label.value.string_value" => "%{ClusterID}"
        }
        on_error => "ClusterID_label_not_present"
      }
      if ![ClusterID_label_not_present] {
        mutate {
          replace => {
            "ClusterID_label.key" => "ClusterID"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ClusterID_label"
          }
          on_error => "ClusterID_label_not_found"
        }
      }
    }
    if [CompulsoryEvent] != "" {
      mutate {
        replace => {
          "CompulsoryEvent_label.value.string_value" => "%{CompulsoryEvent}"
        }
        on_error => "CompulsoryEvent_label_not_present"
      }
      if ![CompulsoryEvent_label_not_present] {
        mutate {
          replace => {
            "CompulsoryEvent_label.key" => "CompulsoryEvent"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "CompulsoryEvent_label"
          }
          on_error => "CompulsoryEvent_label_not_found"
        }
      }
    }
    if [AppID] != "" {
      mutate {
        replace => {
          "target.application" => "%{AppID}"
        }
        on_error => "AppID_not_found"
      }
    }
    if [AuditCategory] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "AuditCategory"
        }
        on_error => "AuditCategory_not_found"
      }
    }
    if [NodeID] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{NodeID}"
          "principal.asset.hostname" => "%{NodeID}"
          "has_principal" => "true"
        }
        on_error => "NodeID_hostname_not_found"
      }
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
    }
  }
  mutate {
    gsub => ["message"," ([A-Za-z0-9_]+=)","#$1"]
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "\\]\\[", ","]
    }

    mutate {
      gsub => ["kv_data", "\\]|\\[",""]
    }

    mutate {
      gsub => ["kv_data", "Node ID", "NodeID"]
    }

    mutate {
      gsub => ["kv_data", "Cluster ID", "ClusterID"]
    }

    kv {
      source => "kv_data"
      value_split => "="
      field_split => ","
      on_error => "not_kv_kv_data"
    }

    if [NodeID] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{NodeID}"
        }
        on_error => "NodeID_not_found"
      }
    }
    if [ClusterID] != "" {
      mutate {
        replace => {
          "additional_clusterId.key" => "ClusterID"
          "additional_clusterId.value" => "%{ClusterID}"
        }
        on_error => "ClusterID_not_found"
      }
      if ![ClusterID_not_found] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "additional_clusterId"
          }
          on_error => "ClusterID_merge_failure"
        }
      }
    }
  }


  kv {
     source => "message"
     value_split => "="
     field_split => ",#"
     on_error => "not_kv"
  }

  if [message] =~ " run-parts" {
    mutate {
      replace => {
        "application" => "run-parts"
      }
    }
  }
  else if [message] =~ "audispd" {
    mutate {
      replace => {
        "application" => "audispd"
      }
    }
  }
  else if [message] =~ "postfix" {
    mutate {
      replace => {
        "application" => "postfix"
      }
    }
  }

  if [application] =~ "logrotate" {
    mutate {
      replace => {
        "application" => "logrotate"
      }
    }
  }
  else if [application] == "sshd" {
    grok {
      match => {
        "description" => ["(?P<action>session (opened|closed)) for user %{WORD:username2}"
                          "(?P<action>session (opened|closed)) for user %{WORD:username2} by.*"
                          "%{GREEDYDATA:sshd_desc}"]
      }
      overwrite => ["action","username2","sshd_desc"]
      on_error => "sshd_grok_failure"
    }

    if ![sshd_grok_failure] {
      if [username2] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{username2}"
          }
        }
      }
      if [username2] != "" and [action] =~ "session opened" {
        mutate {
          replace => {
            "network.application_protocol" => "SSH"
          }
        }
        mutate {
          gsub => ["auth_mechanism","","USERNAME_PASSWORD"]
        }
        if [auth_mechanism] != "" {
          mutate {
            merge => {
              "extensions.auth.mechanism" => "auth_mechanism"
            }
            on_error => "auth_mechanism_user_login_failure"
          }
        }
        mutate {
          replace => {
            "metadata.event_type" => "USER_LOGIN"
          }
        }
      }
      else if [username2] != "" and [action] =~ "session closed" {
        mutate {
          replace => {
            "network.application_protocol" => "SSH"
          }
        }
        mutate {
          gsub => ["auth_mechanism","","USERNAME_PASSWORD"]
        }
        if [auth_mechanism] != "" {
          mutate {
            merge => {
              "extensions.auth.mechanism" => "auth_mechanism"
            }
            on_error => "auth_mechanism_map_failure"
          }
        }
        mutate {
          replace => {
            "metadata.event_type" => "USER_LOGOUT"
          }
        }
      }
      else if [sshd_desc] != "" {
        mutate {
          replace => {
            "metadata.event_type" => "GENERIC_EVENT"
            "metadata.description" => "%{sshd_desc}"
          }
        }
      }
    }
  }

  else if [application] == "systemd" {
    grok {
      match => {
        "message" => [
          "(?P<action>((Created|Removed) slice)|(Starting|Stopping)) %{GREEDYDATA:desc}"
          "(?P<action>Starting User (Slice|Manager)) (of|for UID) %{WORD:username}"
          "(?P<action>(Starting|Started) Session) %{GREEDYDATA:sessionId} of user %{WORD:username}"
        ]
      }
      overwrite => ["action","desc","username","service_name"]
      on_error => "grok_fail_systemd"
    }
    if ![grok_fail_systemd] {
      if [action] in ["Created slice","Removed slice"] {
        mutate {
          replace => {
            "metadata.event_type" => "GENERIC_EVENT"
            "security_result.description" => "%{action} %{desc}"
          }
        }
      }
      else if [action] == "Starting User Manager" {
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
            "security_result.description" => "%{action}"
          }
        }
        if [username] == '0' {
          mutate {
            replace => {
              "principal.user.userid" => "root"
            }
          }
        }
        else if [username] != "" {
          mutate {
            replace => {
              "principal.user.userid" => "%{username}"
            }
          }
        }
      }
      else if [action] in ["Starting Session","Started Session"] {
        if [username] != "" {
          mutate {
            replace => {
              "target.user.userid" => "%{username}"
            }
          }
        }
        mutate {
          replace => {
            "metadata.event_type" => "USER_UNCATEGORIZED"
            "network.session_id" => "%{sessionId}"
            "security_result.description" => "%{action}"
          }
        }
      }
      else if [action] in ["Starting","Stopping"] {
        mutate {
          gsub => ["auth_mechanism","", "SERVICE"]
        }
        if [auth_mechanism] != "" {
          mutate {
            merge => {
              "extensions.auth.mechanism" => "auth_mechanism"
            }
            on_error => "auth_mechanism_service_failure"
          }
        }
        if [action] == "Starting" {
          mutate {
            replace => {
              "metadata.event_type" => "GENERIC_EVENT"
            }
          }
        }
        mutate {
          replace => {
            "security_result.description" => "%{action} %{desc}"
          }
        }
      }
    }
  }
  else if [application] == "sudo" {
    grok {
      match => {
        "sudo_desc" => [
          "%{DATA:srcUser} :.*?TTY=%{WORD:TTY}.*?PWD=(?P<PWD>.*);.*?USER=%{WORD:username1}.*?COMMAND=(?P<command>.*)"
          "(?P<action>session (opened|closed)) for user %{WORD:username1} .*"
          "to %{DATA:username1}\\) %{WORD:srcUser}",
          "(opened|closed) for user %{WORD:username1}.*",
        ]
      }
      overwrite => ["command","username1","srcUser","action","TTY","PWD"]
      on_error => "sudo_grok_fail"
    }

      mutate {
        replace => {
          "metadata.description" => "%{sudo_desc}"
        }
      }
    if [command] != "" {
      mutate {
        replace => {
          "target.process.command_line" => "%{command}"
        }
      }
    }

    if [PWD] not in ["","/ "] {
      mutate {
        replace => {
          "target.process.file.full_path" => "%{PWD}"
        }
      }
    }
    if [sudo_desc] =~ "closed" {
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGOUT"
        }
      }
      if [username1] != "" {
        mutate {
          replace => {
            "target.user.userid" => "%{username1}"
          }
        }
      }
    }
    else {
      if [srcUser] != "" {
        mutate {
          replace => {
            "principal.user.userid" => "%{srcUser}"
          }
        }
      }
      mutate {
        replace => {
          "metadata.event_type" => "USER_LOGIN"
          "target.user.userid" => "%{username1}"
        }
      }
    }

    mutate {
      replace => {
          "mechanism" => "USERNAME_PASSWORD"
      }
    }
    mutate {
      merge => {
        "extensions.auth.mechanism" => "mechanism"
      }
    }
  }
  else if [application] == "postfix" {
    mutate {
      replace => {
        "metadata.event_type" => "EMAIL_UNCATEGORIZED"
      }
    }

    if [status] == "sent (delivered to mailbox)" {
      mutate {
        replace => {
          "metadata.event_type" => "EMAIL_TRANSACTION"
        }
      }
    }

    if[status] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{status}"
        }
      }
    }

    if [from] != "" and [from] =~ "@" {
      mutate {
        gsub => ["from", "<|>",""]
      }
      mutate {
        replace => {
          "network.email.from" => "%{from}"
        }
      }
    }

    if [to] != "" and [to] =~ "@" {
      mutate {
        gsub => ["to", "<|>",""]
      }
      mutate {
        merge => {
          "network.email.to" => "to"
        }
      }
    }
    if [size] != "" {
      mutate {
        replace => {
          "network.received_bytes" => "%{size}"
        }
      }
      mutate {
        convert => {
          "network.received_bytes" => "uinteger"
        }
      }
    }
  }

  if [msg] != "" {
    grok {
      match => {
        "msg" => ["audit\\(%{DATA:time}:%{NOTSPACE:log_id}\\)\\:"]
      }
      overwrite => ["log_id","time"]
      on_error => "grok_failure"
    }

    if ![grok_failure] and [time] != "" {
      date {
        match => ["time", "UNIX", "UNIX_MS"]
        rebase => true
      }
    }
    if ![grok_failure] and [log_id] != "" {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{log_id}"
        }
      }
    }
  }
  if [type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{type}"
      }
    }
  }
  else {
    if [application] != "" and [metadata][product_event_type] == "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{application}"
        }
      }
    }
  }
  if [description] =~ "starting" or [application] == "CROND"   {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }

  if [type] == "SYSCALL" {
    if [key] not in ["","(null)"] {
      mutate {
        gsub => ["key", "\\(|\\)", ""]
      }
      mutate {
        replace => {
          "security_result.about.registry.registry_key" => "%{key}"
          "security_result.about.registry.registry_value_data"  => "%{log_id}"
        }
      }
    }

    if [arch] != "" {
      mutate {
        replace => {
          "security_result.about.platform_version" => "%{arch}"
        }
      }
    }
    if [syscall] != "" {
      mutate {
        replace => {
          "syscall_label.key" => "Syscall"
          "syscall_label.value" => "%{syscall}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "syscall_label"
        }
      }
    }
    if [success] == "yes" {
      mutate {
        replace => {
          "security_result.summary" => "%{success}, The System call succeeded"
        }
      }
    }
    else if [success] == "no" {
      mutate {
        replace => {
          "security_result.summary" => "%{success}, The System call could not succeed"
        }
      }
    }
    if [exit] != "" {
      mutate {
        replace => {
          "exit_label.key" => "Exit Code"
          "exit_label.value" => "%{exit}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "exit_label"
        }
      }
    }

    if [a0] != "" {
      mutate {
        replace => {
          "a0_label.key" => "a0"
          "a0_label.value" => "%{a0}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "a0_label"
        }
      }
    }

    if [a1] != "" {
      mutate {
        replace => {
          "a1_label.key" => "a1"
          "a1_label.value" => "%{a1}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "a1_label"
        }
      }
    }

    if [a2] != "" {
      mutate {
        replace => {
          "a2_label.key" => "a2"
          "a2_label.value" => "%{a2}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "a2_label"
        }
      }
    }

    if [a3] != "" {
      mutate {
        replace => {
          "a3_label.key" => "a3"
          "a3_label.value" => "%{a3}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "a3_label"
        }
      }
    }

    if [ppid] != "" {
      mutate {
        replace => {
          "principal.process.parent_process.pid" => "%{ppid}"
        }
      }
    }
    if [auid] != "" {
      mutate {
        replace => {
          "about.user.userid" => "%{auid}"
        }
      }
    }

    if [uid] != "" {
      if uid == "0" {
        mutate {
          replace => {
            "principal.user.userid" => "root"
          }
        }
      }
      else {
        mutate {
          replace => {
            "principal.user.userid" => "%{uid}"
          }
        }
      }
    }

    if [gid] != "" {
      mutate {
        merge => {
          "principal.user.group_identifiers" => "gid"
        }
      }
    }
    if [tty] not in ["","(none)"] {
      mutate {
        replace => {
          "tty_label.key" => "tty"
          "tty_label.value" => "%{tty}"
        }
      }
      mutate {
        merge => {
          "security_result.about.labels" => "tty_label"
        }
      }
    }

    if [ses] != "" {
      mutate {
        replace => {
          "network.session_id" => "%{ses}"
        }
      }
    }
    if [comm] != "" {
      mutate {
        gsub => ["comm", "\\\"", ""]
      }
      mutate {
        replace => {
          "principal.process.command_line" => "%{comm}"
        }
      }
    }
    if [exe] != "" {
      mutate {
        gsub => ["exe","\\\"",""]
      }
      mutate {
        replace => {
          "target.process.file.full_path" => "%{exe}"
        }
      }
    }

    mutate {
      replace => {
        "metadata.event_type" => "PROCESS_LAUNCH"
      }
    }
  }
  else if [type] == "CWD" {
    mutate {
      gsub => ["cwd","\\\"",""]
    }
    if [cwd] not in ["", "/"] {
      mutate {
        replace => {
          "principal.process.file.full_path" => "%{cwd}"
        }
      }
    }
    mutate {
      replace =>{
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [type] == "PATH" {

    if [name] != "" {
      mutate {
        gsub => ["name","\\\"",""]
      }
      mutate {
        replace => {
          "target.file.full_path" => "%{name}"
          "metadata.event_type" => "FILE_SYNC"

        }
      }
    }

    if [objtype] != "" {
      mutate {
        replace => {
          "additional_field.key" => "ObjType"
          "additional_field.value.string_value" => "%{objtype}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_field"
        }
      }
    }
  }
  else if [type] == "PROCTITLE" {
    if [proctitle] != "" {
      mutate {
        replace => {
          "target.process.file.full_path" => "%{proctitle}"
        }
      }
    }
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [username] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{username}"
      }
    }
  }
  if [TTY] not in ["","unknown"] {
    mutate {
      gsub => ["TTY", " ;", ""]
    }
    mutate {
      replace => {
        "tty_label.key" => "tty"
        "tty_label.value" => "%{TTY}"
      }
    }
    mutate {
      merge => {
        "security_result.about.labels" => "tty_label"
      }
    }
   }


  if [COMMAND] != "" {
    mutate {
      replace => {
        "target.process.command_line" => "%{COMMAND}"
      }
    }
  }
  if [PWD] not in ["","/ ;", "/ "] {
    mutate {
      replace => {
        "target.process.file.full_path" => "%{PWD}"
      }
    }
  }

  mutate {
    replace => {
      "principal.platform" => "LINUX"
    }
  }
  if [description] =~ "authentication failure" or [description] =~ "check pass; user unknown" or [description] =~ "Invalid user" or [description] =~ "invalid user" {
    mutate {
      gsub => ["auth_mechanism","","USERNAME_PASSWORD"]
    }

    if [auth_mechanism] != "" {
      mutate {
        merge => {
          "extensions.auth.mechanism" => "auth_mechanism"
        }
        on_error => "auth_mechanism_sshd_opened_failure"
      }
    }
    mutate {
      replace => {
        "action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }
  else if [EventStatus] == "" {
     mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{pid}"
      }
      on_error => "pid_replace_not_found"
    }
  }
  if [inter_ip] != "" {
    grok {
      match => {
        "inter_ip" => "%{IP:inter_ip}"
      }
      overwrite => ["inter_ip"]
      on_error => "inter_ip_not_ip"
    }
    if ![inter_ip_not_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "inter_ip"
        }
        on_error => "inter_ip_not_found"
      }
    }
  }
  mutate {
    rename => {
      "axl_api_version" => "addition.axl_api_version"
      "url" => "addition.URL"
      "soap_ns" => "addition.SOAPNameSpace"
      "xml_encoding" => "addition.XMLEncoding"
      "xml_version" => "addition.XMLVersion"
      "agreement_value" => "addition.AgreementValue"
      "AppID" => "addition.AppID"
      "syslog_pri" => "addition.syslog_priority"
      "method" => "addition.method"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [_check] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "key_replace_not_found"
      }
      if [key] in ["axl_api_version","AppID"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
          on_error => "target_resource_attribute_replace_failed"
        }
        mutate {
          merge => {
            "target.resource.attribute.labels" => "_field"
          }
          on_error => "target_resource_attribute_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }
  if [has_principal] == "true" and [metadata][event_type] == "GENERIC_EVENT"{
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  mutate {
    rename => {
      "metadata" => "event.idm.read_only_udm.metadata"
      "network" => "event.idm.read_only_udm.network"
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "extensions" => "event.idm.read_only_udm.extensions"
      "observer" => "event.idm.read_only_udm.observer"
    }
  }
  if [not_kv] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
