# Product: AWS Macie
# Category: AWS-specific logs
# Supported Format: JSON
# Reference: https://docs.aws.amazon.com/macie/latest/APIReference/findings-describe.html
# Last Updated: 2025-05-15
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "schemaVersion" => ""
      "id" => ""
      "accountId" => ""
      "region" => ""
      "type" => ""
      "title" => ""
      "description" => ""
      "category" => ""
      "resourcesAffected.s3Bucket.arn" => ""
      "resourcesAffected.s3Bucket.createdAt" => ""
      "resourcesAffected.s3Bucket.owner.displayName" => ""
      "resourcesAffected.s3Bucket.owner.id" => ""
      "resourcesAffected.s3Bucket.name" => ""
      "resourcesAffected.s3Bucket.tags" => ""
      "resourcesAffected.s3Object.path" => ""
      "resourcesAffected.s3Object.key" => ""
      "resourcesAffected.s3Object.lastModified" => ""
      "resourcesAffected.s3Object.eTag" => ""
      "resourcesAffected.s3Object.storageClass" => ""
      "classificationDetails.result.mimeType" => ""
      "classificationDetails.jobArn" => ""
      "classificationDetails.jobId" => ""
      "classificationDetails.originType" => ""
      "severity.description" => ""
      "sr" => ""
      "has_target_file" => "false"
      "has_principal" => "false"
      "account" => ""
      "detail.description" => ""
      "detail.category" => ""
      "detail.policyDetails.action.actionType" => ""
      "detail.policyDetails.action.apiCallDetails.apiServiceName" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipAddressV4" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.accessKeyId" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.arn" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.principalId" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.sessionContext.sessionIssuer.userName" => ""
      "detail.createdAt" => ""
      "detail.resourcesAffected.s3Bucket.name" => ""
      "detail.resourcesAffected.s3Bucket.owner.displayName" => ""
      "detail.resourcesAffected.s3Bucket.owner.id" => ""
      "detail.title" => ""
      "detail.severity.description" => ""
      "detail.severity.score" => ""
      "version" => ""
      "detail-type" => ""
      "time" => ""
      "detail.schemaVersion" => ""
      "detail.id" => ""
      "detail.accountId" => ""
      "detail.partition" => ""
      "detail.region" => ""
      "detail.type" => ""
      "detail.updatedAt" => ""
      "detail.count" => ""
      "detail.resourcesAffected.s3Bucket.arn" => ""
      "detail.resourcesAffected.s3Bucket.createdAt" => ""
      "detail.resourcesAffected.s3Bucket.tags.key" => ""
      "detail.resourcesAffected.s3Bucket.tags.value" => ""
      "detail.resourcesAffected.s3Bucket.defaultServerSideEncryption.encryptionType" => ""
      "detail.resourcesAffected.s3Bucket.defaultServerSideEncryption.kmsMasterKeyId" => ""
      "detail.resourcesAffected.s3Bucket.publicAccess.effectivePermission" => ""
      "detail.resourcesAffected.s3Bucket.publicAccess.permissionConfiguration.accountLevelPermissions.blockPublicAccess.blockPublicAcls" => ""
      "detail.resourcesAffected.s3Bucket.publicAccess.permissionConfiguration.accountLevelPermissions.blockPublicAccess.blockPublicPolicy" => ""
      "detail.resourcesAffected.s3Bucket.publicAccess.permissionConfiguration.accountLevelPermissions.blockPublicAccess.ignorePublicAcls" => ""
      "detail.resourcesAffected.s3Bucket.publicAccess.permissionConfiguration.accountLevelPermissions.blockPublicAccess.restrictPublicBuckets" => ""
      "detail.policyDetails.action.apiCallDetails.api" => ""
      "detail.policyDetails.action.apiCallDetails.firstSeen" => ""
      "detail.policyDetails.action.apiCallDetails.lastSeen" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.accountId" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.sessionContext.sessionIssuer.accountId" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.sessionContext.attributes.mfaAuthenticated" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.sessionContext.sessionIssuer.arn" => ""
      "detail.policyDetails.actor.userIdentity.assumedRole.sessionContext.sessionIssuer.principalId" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipOwner.asn" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipCountry.code" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipOwner.asnOrg" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipOwner.isp" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipOwner.org" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipCity.name" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipCountry.name" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipGeoLocation.lat" => ""
      "detail.policyDetails.actor.ipAddressDetails.ipGeoLocation.lon" => ""
      "detail.sample" => ""
      "detail.archived" => ""
    }
  }

  json {
    source => "message"
    on_error => "not_json"
    array_function => "split_columns"
  }

  if [not_json] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }

  # Extract the date
  date {
    match => ["createdAt", "UNIX", "ISO8601"]
    on_error => "no_timestamp"
  }
  # End of date mapping

  # Metadata
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "AWS Macie"
      "event.idm.read_only_udm.metadata.vendor_name" => "AMAZON"
      "event.idm.read_only_udm.target.asset.attribute.cloud.environment" => "AMAZON_WEB_SERVICES"
    }
  }

  # schemaVersion
  if [schemaVersion] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{schemaVersion}"
      }
    }
  }

  # id
  if [id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
      }
    }
  }

  # accountId
  if [accountId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.group.product_object_id" => "%{accountId}"
      }
    }
  }

  # region
  if [region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.name" => "%{region}"
      }
    }
  }

  # type
  if [type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
      }
    }
  }

  # resourcesAffected.s3Bucket
  if [resourcesAffected][s3Bucket][arn] != "" {
    mutate {
      replace => {
        "resource_ancestors.resource_type" => "STORAGE_BUCKET"
        "resource_ancestors.name" => "%{resourcesAffected.s3Bucket.name}"
        "resource_ancestors.product_object_id" => "%{resourcesAffected.s3Bucket.arn}"
      }
    }
  }

  if [resourcesAffected][s3Bucket][createdAt] != "" {
    date {
      match => ["resourcesAffected.s3Bucket.createdAt","UNIX","ISO8601"]
      target => "resource_ancestors.attribute.creation_time"
      on_error => "no_timestamp"
    }
  }

  if [resourcesAffected][s3Bucket][owner][displayName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.user_display_name" => "%{resourcesAffected.s3Bucket.owner.displayName}"
      }
    }
  }

  if [resourcesAffected][s3Bucket][owner][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{resourcesAffected.s3Bucket.owner.id}"
      }
    }
  }

  if [resourcesAffected][s3Bucket][name] != "" and [region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{resourcesAffected.s3Bucket.name}.s3.%{region}.amazonaws.com"
      }
      on_error => "no_principal_hostname"
    }
    if ![no_principal_hostname] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "UNKNOWN"
      }
    }
  }

  for tag in resourcesAffected.s3Bucket.tags {
    if [tag][value] not in [ "", "NA", "n/a" ] {
      mutate {
        replace =>{
          "tag_label" => ""
        }
      }
      mutate {
        replace => {
          "tag_label.key" => "%{tag.key}"
          "tag_label.value" => "%{tag.value}"
        }
      }
      mutate {
        merge => {
          "resource_ancestors.attribute.labels" => "tag_label"
        }
      }
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.target.resource_ancestors" => "resource_ancestors"
    }
    on_error => "no_resource_ancestors_to_merge"
  }

  # resourcesAffected.s3Object
  for tag in resourcesAffected.s3Object.tags {
    if [tag][value] not in [ "", "NA", "n/a" ] {
      mutate {
        replace =>{
          "tag_label" => ""
        }
      }
      mutate {
        replace => {
          "tag_label.key" => "%{tag.key}"
          "tag_label.value" => "%{tag.value}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "tag_label"
        }
      }
    }
  }

  if [resourcesAffected][s3Object][path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_type" => "STORAGE_OBJECT"
        "event.idm.read_only_udm.target.resource.name" => "%{resourcesAffected.s3Object.key}"
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{resourcesAffected.s3Object.path}"
        "event.idm.read_only_udm.target.file.full_path" => "s3://%{resourcesAffected.s3Object.path}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.file.names" => "resourcesAffected.s3Object.key"
      }
      on_error => "no_resource_ancestors_to_merge"
    }
    if ![no_resource_ancestors_to_merge] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [resourcesAffected][s3Object][lastModified] != "" {
    date {
      match => ["resourcesAffected.s3Object.lastModified","UNIX","ISO8601"]
      target => "event.idm.read_only_udm.target.resource.attribute.last_update_time"
      on_error => "no_timestamp"
    }
  }

  if [resourcesAffected][s3Object][eTag] != "" and [resourcesAffected][s3Object][eTag] =~ "^[a-fA-F0-9]{32}$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.md5" => "%{resourcesAffected.s3Object.eTag}"
      }
      on_error => "no_md5"
    }
    if ![no_md5] {
      mutate {
        replace => {
          "has_target_file" => "true"
        }
      }
    }
  }

  # Object Size
  mutate {
    convert => {
      "resourcesAffected.s3Object.size" => "uinteger"
    }
    on_error => "not_integer"
  }
  mutate {
    rename => {
      "resourcesAffected.s3Object.size" => "event.idm.read_only_udm.target.file.size"
    }
  }

  if [resourcesAffected][s3Object][storageClass] != "" {
    mutate {
      replace => {
        "storage_Class_label.key" => "storageClass"
        "storage_Class_label.value" => "%{resourcesAffected.s3Object.storageClass}"
      }
    }
    mutate {
      merge => {
       "event.idm.read_only_udm.target.resource.attribute.labels" => "storage_Class_label"
      }
    }
  }

  # classificationDetails.result.mimeType
  if [classificationDetails][result][mimeType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.mime_type" => "%{classificationDetails.result.mimeType}"
      }
      on_error => "no_mime_type"
    }
    if ![no_mime_type] {
      mutate {
        replace => {
          "has_target_file" => "true"
        }
      }
    }
  }

  ## Security Results Starts
  # title
  if [title] != "" {
    mutate {
      replace => {
        "sr.summary" => "%{title}"
      }
    }
  }

  # description
  if [description] != "" {
    mutate {
      replace => {
        "sr.description" => "%{description}"
      }
    }
  }

  # category
  if [category] != "" {
    mutate {
      merge => {
        "sr.category_details" => "category"
      }
    }
    mutate {
      replace => {
        "sr_cat" => "DATA_AT_REST"
      }
    }
    mutate {
      merge => {
        "sr.category" => "sr_cat"
      }
    }
  }

  # severity.description
  if [severity][description] == "Low" {
    mutate {
      replace => {
        "sr.severity" => "LOW"
      }
    }
  }
  else if [severity][description] == "Medium" {
    mutate {
      replace => {
        "sr.severity" => "MEDIUM"
      }
    }
  }
  else if [severity][description] == "High" {
    mutate {
      replace => {
        "sr.severity" => "HIGH"
      }
    }
  }

  # classificationDetails.jobArn
  if [classificationDetails][jobArn] != "" {
    mutate {
      replace => {
        "sr.rule_name" => "%{classificationDetails.jobArn}"
      }
    }
  }

  # classificationDetails.jobId
  if [classificationDetails][jobId] != "" {
    mutate {
      replace => {
        "sr.rule_id" => "%{classificationDetails.jobId}"
      }
    }
  }

  # classificationDetails.originType
  if [classificationDetails][originType] != "" {
    mutate {
      replace => {
        "sr.rule_type" => "%{classificationDetails.originType}"
      }
    }
  }

  # classificationDetails.result.sensitiveData.category
  # classificationDetails.result.sensitiveData.totalCount
  for _sensitiveData in classificationDetails.result.sensitiveData {
    mutate {
      replace => {
        "label_cat" => ""
        "label_total_count" => ""
      }
    }
    mutate {
      replace => {
        "label_cat.key" => "category"
        "label_cat.value" => "%{_sensitiveData.category}"
        "label_total_count.key" => "totalCount"
        "label_total_count.value" => "%{_sensitiveData.totalCount}"
      }
    }
    mutate {
      merge => {
        "sr.detection_fields" => "label_cat"
      }
    }
    mutate {
      merge => {
        "sr.detection_fields" => "label_total_count"
      }
    }
  }
  if [account] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{account}"
      }
      on_error => "no_principal_userid"
    }
  }
  if [detail][description] != "" {
    mutate {
      replace => {
        "sr.description" => "%{detail.description}"
      }
      on_error => "no_description"
    }
  }
  mutate {
    replace => {
      "detail_category" => "%{detail.category}"
    }
    on_error => "no_category"
  }
  if [detail][category] != "" {
    mutate {
      merge => {
        "sr.category_details" => "detail_category"
      }
      on_error => "no_category"
    }
  }
  if [detail][policyDetails][action][actionType] != "" {
    mutate {
      replace => {
        "sr.action_details" => "%{detail.policyDetails.action.actionType}"
      }
      on_error => "no_action_type"
    }
  }
  if [detail][policyDetails][action][apiCallDetails][apiServiceName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{detail.policyDetails.action.apiCallDetails.apiServiceName}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{detail.policyDetails.action.apiCallDetails.apiServiceName}"
      }
      on_error => "no_api_service_name"
    }
    if ![no_api_service_name] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [detail][policyDetails][actor][ipAddressDetails][ipAddressV4] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "detail.policyDetails.actor.ipAddressDetails.ipAddressV4"
        "event.idm.read_only_udm.principal.asset.ip" => "detail.policyDetails.actor.ipAddressDetails.ipAddressV4"
      }
      on_error => "no_ip_address"
    }
    if ![no_ip_address] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [detail][policyDetails][actor][userIdentity][assumedRole][accessKeyId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{detail.policyDetails.actor.userIdentity.assumedRole.accessKeyId}"
      }
      on_error => "no_access_key_id"
    }
  }
  if [detail][policyDetails][actor][userIdentity][assumedRole][arn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.id" => "%{detail.policyDetails.actor.userIdentity.assumedRole.arn}"
      }
      on_error => "no_arn"
    }
  }
  if [detail][policyDetails][actor][userIdentity][assumedRole][principalId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id" => "%{detail.policyDetails.actor.userIdentity.assumedRole.principalId}"
      }
      on_error => "no_principal_id"
    }
  }
  if [detail][policyDetails][actor][userIdentity][assumedRole][sessionContext][sessionIssuer][userName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.user_display_name" => "%{detail.policyDetails.actor.userIdentity.assumedRole.sessionContext.sessionIssuer.userName}"
      }
      on_error => "no_user_name"
    }
  }
  if [detail][createdAt] != "" {
    date {
      match => ["detail.createdAt","yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","UNIX","ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "no_timestamp"
    }
  }
  if [detail][resourcesAffected][s3Bucket][name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{detail.resourcesAffected.s3Bucket.name}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{detail.resourcesAffected.s3Bucket.name}"
      }
      on_error => "no_principal_hostname"
    }
    if ![no_principal_hostname] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [detail][resourcesAffected][s3Bucket][owner][displayName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{detail.resourcesAffected.s3Bucket.owner.displayName}"
      }
      on_error => "no_user_display_name"
    }
  }
  if [detail][resourcesAffected][s3Bucket][owner][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{detail.resourcesAffected.s3Bucket.owner.id}"
      }
      on_error => "no_user_id"
    }
  }
  if [detail][title] != "" {
    mutate {
      replace => {
        "sr.summary" => "%{detail.title}"
      }
      on_error => "no_title"
    }
  }
  if [detail][severity][score] != "" {
    mutate {
      convert => {
        "detail.severity.score" => "string"
      }
      on_error => "no_severity_score"
    }
    mutate {
      replace => {
        "sr.severity_details" => "%{detail.severity.score}"
      }
      on_error => "no_severity_score"
    }
  }
  if [detail][severity][description] == "Low" {
    mutate {
      replace => {
        "sr.severity" => "LOW"
      }
    }
  }
  else if [detail][severity][description] == "Medium" {
    mutate {
      replace => {
        "sr.severity" => "MEDIUM"
      }
    }
  }
  else if [detail][severity][description] == "High" {
    mutate {
      replace => {
        "sr.severity" => "HIGH"
      }
    }
  }
  if [version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      }
      on_error => "no_version"
    }
  }
  if [detail-type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{detail-type}"
      }
      on_error => "no_detail_type"
    }
  }
  if [time] != "" {
    date {
      match => ["time","yyyy-MM-dd'T'HH:mm:ss.SS'Z'","UNIX","ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "no_timestamp"
    }
  }
  if [detail][schemaVersion] != "" {
    mutate {
      replace => {
        "version_label.key" => "schemaVersion"
        "version_label.value.string_value" => "%{detail.schemaVersion}"
      }
      on_error => "no_schema_version"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "version_label"
      }
    }
  }
  if [detail][id] != "" {
    mutate {
      replace => {
        "id_label.key" => "id"
        "id_label.value.string_value" => "%{detail.id}"
      }
      on_error => "no_id"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "id_label"
      }
    }
  }
  if [detail][accountId] != "" {
    mutate {
      replace => {
        "account_id_label.key" => "accountId"
        "account_id_label.value.string_value" => "%{detail.accountId}"
      }
      on_error => "no_account_id"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "account_id_label"
      }
    }
  }
  if [detail][partition] != "" {
    mutate {
      replace => {
        "partition_label.key" => "partition"
        "partition_label.value.string_value" => "%{detail.partition}"
      }
      on_error => "no_partition"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "partition_label"
      }
    }
  }
  if [detail][region] != "" {
    mutate {
      replace => {
        "region_label.key" => "region"
        "region_label.value.string_value" => "%{detail.region}"
      }
      on_error => "no_region"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "region_label"
      }
    }
  }
  if [detail][type] != "" {
    mutate {
      replace => {
        "sr.rule_name" => "%{detail.type}"
      }
      on_error => "no_type"
    }
  }
  if [detail][updatedAt] != "" {
    date {
      match => ["detail.updatedAt","yyyy-MM-dd'T'HH:mm:ss.SSS'Z'","UNIX","ISO8601"]
      target => "sr.last_discovered_time"
      on_error => "no_timestamp"
    }
  }
  if [detail][count] != "" {
    mutate {
      convert => {
        "detail.count" => "string"
      }
      on_error => "no_count"
    }
