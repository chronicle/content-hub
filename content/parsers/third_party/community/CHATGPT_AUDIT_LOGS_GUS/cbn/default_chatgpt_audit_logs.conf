# Product: CHATGPT_AUDIT_LOGS
# Category: Audit
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-10-27
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event" => ""
      "event_id" => ""
      "timestamp" => ""
      "type" => ""
      "action" => ""
      "action_result" => ""
      "action_privilege" => ""
      "sec_action" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "security_result" => ""
      "has_principal_ip" => "false"
      "has_principal_user" => "false"
      "has_target" => "false"
      "has_target_resource" => "false"
      "workspace_principal.id" => ""
      "workspace_principal.type" => ""
      "actor.user_id" => ""
      "actor.user_email" => ""
      "actor.id" => ""
      "actor.type" => ""
      "actor.tracking_id" => ""
      "actor.redacted_id" => ""
      "action_data.log_file_id" => ""
      "action_data.event_type" => ""
      "request_metadata.client_ip" => ""
      "request_metadata.client_ip_details.country" => ""
      "request_metadata.client_ip_details.city" => ""
      "request_metadata.client_ip_details.region" => ""
      "request_metadata.client_ip_details.region_code" => ""
      "request_metadata.client_ip_details.asn" => ""
      "request_metadata.client_ip_details.latitude" => ""
      "request_metadata.client_ip_details.longitude" => ""
      "request_metadata.client_user_agent" => ""
      "request_metadata.client_ja3" => ""
      "request_metadata.client_ja4" => ""
      "request_metadata.destination_hostname" => ""
      "actor.agent_runtime.delegator.user_id" => ""
      "actor.agent_runtime.delegator.user_email" => ""
      "actor.agent_runtime.delegator.type" => ""
      "actor.name" => ""
      "actor.product_id" => ""
      "event_type" => ""
      "event_details.detail_type" => ""
      "event_details.agent_id" => ""
      "client_id" => ""
      "actor.product_type" => ""
      "event_details.run_id" => ""
      "event_details.version_id" => ""
      "app_id" => ""
      "app_name" => ""
      "app_type" => ""
      "conversation_id" => ""
      "log_type" => ""
      "input.time_min" => ""
      "input.time_max" => ""
      "input.timezone_str" => ""
      "input.max_results" => ""
      "delegator_user_email" => ""
      "delegator_user_id" => ""
      "delegator_type" => ""
      "country" => ""
      "city" => ""
      "region" => ""
      "region_code" => ""
      "client_asn" => ""
      "client_latitude" => ""
      "client_longitude" => ""
    }
  }

  mutate {
    gsub => ["message", '\\"principal\\":', '\"workspace_principal\":']
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failed"
  }
  if [json_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "timestamp_parse_failed"
    }
  }
  if [event_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{event_id}"
      }
      on_error => "event_id_not_found"
    }
  }

  if [type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{type}"
      }
      on_error => "type_not_found"
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{action}"
      }
      on_error => "action_not_found"
    }
  }
  else if [event_type] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{event_type}"
      }
      on_error => "event_type_not_found"
    }
  }
  else if [app_name] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{app_name}"
      }
      on_error => "app_name_not_found"
    }
  }

  if [action_result] != "" {
    if [action_result] == "SUCCESS" {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    }
    else if [action_result] in ["FAILURE", "FAILED", "DENIED"] {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }
    else {
      mutate {
        replace => {
          "sec_action" => "UNKNOWN_ACTION"
        }
      }
    }
    if [sec_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "sec_action"
        }
        on_error => "sec_action_not_found"
      }
    }
  }

  mutate {
    replace => {
      "delegator_user_email" => "%{actor.agent_runtime.delegator.user_email}"
    }
    on_error => "actor_agent_runtime_delegator_user_email_error"
  }

  if [actor][user_email] =~ "^.+@.+$" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "actor.user_email"
      }
      on_error => "actor_user_email_not_found"
    }
    if ![actor_user_email_not_found] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }
  else if [delegator_user_email] =~ "^.+@.+$" {
    mutate {
      merge => {
        "principal.user.email_addresses" => "delegator_user_email"
      }
      on_error => "actor_agent_runtime_delegator_user_email_err"
    }
    if ![actor_agent_runtime_delegator_user_email_err] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
      }
    }
  }

  mutate {
    replace => {
      "delegator_user_id" => "%{actor.agent_runtime.delegator.user_id}"
    }
    on_error => "actor_agent_runtime_delegator_user_id_not_found"
  }

  if [actor][user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{actor.user_id}"
        "has_principal_user" => "true"
      }
      on_error => "actor_user_id_not_found"
    }
  }
  else if [delegator_user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{delegator_user_id}"
        "has_principal_user" => "true"
      }
      on_error => "actor_agent_runtime_delegator_user_error"
    }
  }

  if [actor][type] != "" {
    mutate {
      replace => {
        "label_actor_type.key" => "actor_type"
        "label_actor_type.value" => "%{actor.type}"
      }
      on_error => "actor_type_not_found"
    }
    if ![actor_type_not_found] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "label_actor_type"
        }
        on_error => "actor_type_merge_failed"
      }
    }
  }

  if [action_privilege] != "" {
    mutate {
      replace => {
        "label_action_privilege.key" => "action_privilege"
        "label_action_privilege.value" => "%{action_privilege}"
      }
      on_error => "action_privilege_not_found"
    }
    if ![action_privilege_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "label_action_privilege"
        }
        on_error => "action_privilege_merge_failed"
      }
    }
  }

  if [actor][tracking_id] != "" {
    mutate {
      replace => {
        "label_tracking_id.key" => "api_key_tracking_id"
        "label_tracking_id.value" => "%{actor.tracking_id}"
      }
      on_error => "tracking_id_not_found"
    }
    if ![tracking_id_not_found] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "label_tracking_id"
        }
        on_error => "tracking_id_merge_failed"
      }
    }
  }

  if [actor][redacted_id] != "" {
    mutate {
      replace => {
        "label_actor_redacted_id.key" => "actor_redacted_id"
        "label_actor_redacted_id.value.string_value" => "%{actor.redacted_id}"
      }
      on_error => "actor_redacted_id_not_found"
    }
    if ![actor_redacted_id_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_actor_redacted_id"
        }
        on_error => "actor_redacted_id_merge_failed"
      }
    }
  }

  mutate {
    replace => {
      "delegator_type" => "%{actor.agent_runtime.delegator.type}"
    }
    on_error => "delegator_type_not_error"
  }

  if [delegator_type] != "" {
    mutate {
      replace => {
        "label_delegator_type.key" => "delegator_type"
        "label_delegator_type.value" => "%{delegator_type}"
      }
      on_error => "delegator_type_not_found"
    }
    if ![delegator_type_not_found] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "label_delegator_type"
        }
        on_error => "delegator_type_merge_failed"
      }
    }
  }

  if [actor][id] != "" {
    mutate {
      replace => {
        "label_actor_id.key" => "actor_id"
        "label_actor_id.value.string_value" => "%{actor.id}"
      }
      on_error => "actor_id_not_found"
    }
    if ![actor_id_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_actor_id"
        }
        on_error => "actor_id_merge_failed"
      }
    }
  }

  if [actor][name] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{actor.name}"
        "has_target_resource" => "true"
      }
      on_error => "actor_name_not_found"
    }
  }

  if [actor][product_type] != "" {
    mutate {
      replace => {
        "target.resource.resource_subtype" => "%{actor.product_type}"
        "has_target_resource" => "true"
      }
      on_error => "actor_product_type_not_found"
    }
  }

  if [actor][product_id] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{actor.product_id}"
        "has_target_resource" => "true"
      }
      on_error => "actor_product_id_not_found"
    }
  }
  else if [event_details][agent_id] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{event_details.agent_id}"
        "has_target_resource" => "true"
      }
      on_error => "event_details_agent_id_not_found"
    }
  }
  if [client_id] != "" {
    mutate {
      replace => {
        "label_client_id.key" => "client_id"
        "label_client_id.value.string_value" => "%{client_id}"
      }
      on_error => "client_id_not_found"
    }
    if ![client_id_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_client_id"
        }
        on_error => "client_id_merge_failed"
      }
    }
  }

  if [event_details][run_id] != "" {
    mutate {
      replace => {
        "label_run_id.key" => "run_id"
        "label_run_id.value.string_value" => "%{event_details.run_id}"
      }
      on_error => "run_id_not_found"
    }
    if ![run_id_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_run_id"
        }
        on_error => "run_id_merge_failed"
      }
    }
  }

  if [event_details][version_id] != "" {
    mutate {
      replace => {
        "label_version_id.key" => "agent_version_id"
        "label_version_id.value.string_value" => "%{event_details.version_id}"
      }
      on_error => "version_id_not_found"
    }
    if ![version_id_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_version_id"
        }
        on_error => "version_id_merge_failed"
      }
    }
  }

  if [event_details][detail_type] != "" {
    mutate {
      replace => {
        "label_detail_type.key" => "detail_type"
        "label_detail_type.value.string_value" => "%{event_details.detail_type}"
      }
      on_error => "detail_type_not_found"
    }
    if ![detail_type_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_detail_type"
        }
        on_error => "detail_type_merge_failed"
      }
    }
  }

  if [app_name] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{app_name}"
        "has_target_resource" => "true"
      }
      on_error => "app_name_error"
    }
  }

  if [app_id] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{app_id}"
        "has_target_resource" => "true"
      }
      on_error => "app_id_not_found"
    }
  }

  if [app_type] != "" {
    mutate {
      replace => {
        "target.resource.resource_subtype" => "%{app_type}"
        "has_target_resource" => "true"
      }
      on_error => "app_type_not_found"
    }
  }

  if [conversation_id] != "" {
    mutate {
      replace => {
        "label_conversation_id.key" => "conversation_id"
        "label_conversation_id.value.string_value" => "%{conversation_id}"
      }
      on_error => "conversation_id_not_found"
    }
    if ![conversation_id_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_conversation_id"
        }
        on_error => "conversation_id_merge_failed"
      }
    }
  }

  if [log_type] != "" {
    mutate {
      replace => {
        "label_log_type.key" => "log_type"
        "label_log_type.value.string_value" => "%{log_type}"
      }
      on_error => "log_type_not_found"
    }
    if ![log_type_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_log_type"
        }
        on_error => "log_type_merge_failed"
      }
    }
  }

  if [input][time_min] != "" {
    mutate {
      replace => {
        "label_time_min.key" => "input_time_min"
        "label_time_min.value.string_value" => "%{input.time_min}"
      }
      on_error => "input_time_min_not_found"
    }
    if ![input_time_min_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_time_min"
        }
        on_error => "input_time_min_merge_failed"
      }
    }
  }

  if [input][time_max] != "" {
    mutate {
      replace => {
        "label_time_max.key" => "input_time_max"
        "label_time_max.value.string_value" => "%{input.time_max}"
      }
      on_error => "input_time_max_not_found"
    }
    if ![input_time_max_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_time_max"
        }
        on_error => "input_time_max_merge_failed"
      }
    }
  }

  if [input][timezone_str] != "" {
    mutate {
      replace => {
        "label_timezone_str.key" => "input_timezone"
        "label_timezone_str.value.string_value" => "%{input.timezone_str}"
      }
      on_error => "input_timezone_str_not_found"
    }
    if ![input_timezone_str_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_timezone_str"
        }
        on_error => "input_timezone_str_merge_failed"
      }
    }
  }

  mutate {
    convert => {
      "input.max_results" => "string"
    }
    on_error => "input_max_results_convert_failed"
  }

  if [input][max_results] != "" {
    mutate {
      replace => {
        "label_max_results.key" => "input_max_results"
        "label_max_results.value.string_value" => "%{input.max_results}"
      }
      on_error => "input_max_results_not_found"
    }
    if ![input_max_results_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_max_results"
        }
        on_error => "input_max_results_merge_failed"
      }
    }
  }
  if [request_metadata][client_ip] != "" {
    grok {
      match => {
        "request_metadata.client_ip" => "%{IP:request_metadata_client_ip}"
      }
      overwrite => ["request_metadata_client_ip"]
      on_error => "client_ip_not_found"
    }
    if ![client_ip_not_found] {
      mutate {
        merge => {
          "principal.ip" => "request_metadata_client_ip"
          "principal.asset.ip" => "request_metadata_client_ip"
        }
        on_error => "client_ip_merge_failed"
      }
      if ![client_ip_merge_failed] {
        mutate {
          replace => {
            "has_principal_ip" => "true"
          }
        }
      }
    }
  }

  mutate {
    replace => {
      "country" => "%{request_metadata.client_ip_details.country}"
    }
    on_error => "country_replace_failed"
  }

  if [country] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{country}"
      }
      on_error => "country_not_found"
    }
  }

  mutate {
    replace => {
      "city" => "%{request_metadata.client_ip_details.city}"
    }
    on_error => "city_replace_failed"
  }

  if [city] != "" {
    mutate {
      replace => {
        "principal.location.city" => "%{city}"
      }
      on_error => "city_not_found"
    }
  }

  mutate {
    replace => {
      "region" => "%{request_metadata.client_ip_details.region}"
    }
    on_error => "region_replace_failed"
  }

  if [region] != "" {
    mutate {
      replace => {
        "principal.location.state" => "%{region}"
      }
      on_error => "region_not_found"
    }
  }

  mutate {
    replace => {
      "region_code" => "%{request_metadata.client_ip_details.region_code}"
    }
    on_error => "region_code_replace_failed"
  }

  if [region_code] != "" {
    mutate {
      replace => {
        "label_region_code.key" => "region_code"
        "label_region_code.value.string_value" => "%{region_code}"
      }
      on_error => "region_code_not_found"
    }
    if ![region_code_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_region_code"
        }
        on_error => "region_code_merge_failed"
      }
    }
  }
  mutate {
    replace => {
      "client_asn" => "%{request_metadata.client_ip_details.asn}"
    }
    on_error => "client_asn_replace_failed"
  }

  if [client_asn] != "" {
    mutate {
      convert => {
        "request_metadata.client_ip_details.asn" => "string"
      }
      on_error => "asn_convert_failed"
    }
    mutate {
      replace => {
        "label_asn.key" => "asn"
        "label_asn.value.string_value" => "%{client_asn}"
      }
      on_error => "asn_not_found"
    }
    if ![asn_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "label_asn"
        }
        on_error => "asn_merge_failed"
      }
    }
  }

  mutate {
    replace => {
      "client_latitude" => "%{request_metadata.client_ip_details.latitude}"
    }
    on_error => "client_latitude_replace_failed"
  }

  if [client_latitude] != "" {
    mutate {
      replace => {
        "principal.location.region_coordinates.latitude" => "%{client_latitude}"
      }
      on_error => "latitude_replace_failed"
    }
    if ![latitude_replace_failed] {
      mutate {
        convert => {
          "principal.location.region_coordinates.latitude" => "float"
        }
        on_error => "latitude_conv_failed"
      }
    }
  }

  mutate {
    replace => {
      "client_longitude" => "%{request_metadata.client_ip_details.longitude}"
    }
    on_error => "client_longitude_replace_failed"
  }

  if [client_longitude] != "" {
    mutate {
      replace => {
        "principal.location.region_coordinates.longitude" => "%{client_longitude}"
      }
      on_error => "longitude_replace_failed"
    }
    if ![longitude_replace_failed] {
      mutate {
        convert => {
          "principal.location.region_coordinates.longitude" => "float"
        }
        on_error => "longitude_conv_failed"
      }
    }
  }

  if [request_metadata][client_user_agent] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{request_metadata.client_user_agent}"
      }
      on_error => "user_agent_failed"
    }
  }

  if [request_metadata][client_ja3] != "" {
    mutate {
      replace => {
        "network.tls.client.ja3" => "%{request_metadata.client_ja3}"
      }
      on_error => "client_ja3_not_found"
    }
  }

  if [request_metadata][client_ja4] != "" {
    mutate {
      replace => {
        "network.tls.client.ja4" => "%{request_metadata.client_ja4}"
      }
      on_error => "client_ja4_not_found"
    }
  }

  if [request_metadata][destination_hostname] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{request_metadata.destination_hostname}"
        "target.asset.hostname" => "%{request_metadata.destination_hostname}"
        "has_target" => "true"
      }
      on_error => "destination_hostname_not_found"
    }
  }

  if [workspace_principal][id] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{workspace_principal.id}"
      }
      on_error => "workspace_principal_id_not_found"
    }
  }
  if [workspace_principal][type] != "" {
    mutate {
      replace => {
        "principal.resource.resource_subtype" => "%{workspace_principal.type}"
      }
      on_error => "workspace_principal_type_not_found"
    }
  }

  if [action_data][log_file_id] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{action_data.log_file_id}"
        "has_target" => "true"
      }
      on_error => "log_file_id_not_found"
    }
  }

  if [action_data][event_type] != "" {
    mutate {
      replace => {
        "label_action_event_type.key" => "event_type"
        "label_action_event_type.value" => "%{action_data.event_type}"
      }
      on_error => "action_event_type_not_found"
    }
    if ![action_event_type_not_found] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "label_action_event_type"
        }
        on_error => "action_event_type_merge_failed"
      }
    }
  }

  if ([has_principal_user] == "true" or [has_principal_ip] == "true") and ([has_target] == "true" or [has_target_resource] == "true") {
    mutate {
      replace => {
        "metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if ([has_principal_user] == "true" or [has_principal_ip] == "true") and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal_user] == "true" or [has_principal_ip] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "OpenAI"
      "metadata.product_name" => "ChatGPT Audit Logs"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_merge_failed"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

