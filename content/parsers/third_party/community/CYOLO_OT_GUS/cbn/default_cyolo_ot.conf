# Product: CYOLO_OT
# Category: Remote Access Tools
# Supported Format: SYSLOG + KV , SYSLOG + KV + JSON
# Reference: N/A
# Last Updated: 2025-12-22
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "event_type" => "GENERIC_EVENT"
      "principal" => ""
      "security_result" => ""
      "target" => ""
      "metadata" => ""
      "additional" => ""
      "intermediary" => ""
      "observer" => ""
      "network" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
      "action" => ""
      "has_login" => "false"
      "product_version" => ""
      "msg" => ""
      "id" => ""
      "subject_name" => ""
      "subject_id" => ""
      "remote_address" => ""
      "country_code" => ""
      "destination_host" => ""
      "destination_port" => ""
      "object_name" => ""
      "object_id" => ""
      "session_id" => ""
      "client" => ""
      "authority_id" => ""
      "authority_name" => ""
      "severity" => ""
      "hostname" => ""
      "node_id" => ""
      "site_id" => ""
      "site_name" => ""
      "transaction_id" => ""
      "event_id" => ""
      "kind" => ""
      "timestamp" => ""
      "syslog_timestamp" => ""
      "object_kind" => ""
      "subject_kind" => ""
      "authority_kind" => ""
      "container_id" => ""
      "log_source" => ""
      "log_level" => ""
      "asset_id" => ""
      "asset_name" => ""
      "credentials_id" => ""
      "credentials_origin" => ""
      "credentials_name" => ""
      "result" => ""
      "duration_str" => ""
      "cef_version" => ""
      "Signature_id" => ""
      "cef_severity" => ""
      "time" => ""
      "syslog_subject_kind" => ""
      "syslog_subject_id" => ""
      "syslog_authority_id" => ""
      "syslog_session_id" => ""
      "syslog_event_id" => ""
      "syslog_subject_name" => ""
      "syslog_authority_kind" => ""
      "syslog_object_name" => ""
      "syslog_authority_name" => ""
      "syslog_result" => ""
      "syslog_message" => ""
      "syslog_site_id" => ""
      "syslog_site_name" => ""
      "syslog_hostname" => ""
      "syslog_id" => ""
      "syslog_kind" => ""
      "syslog_object_kind" => ""
      "syslog_node_id" => ""
      "syslog_transaction_id" => ""
      "syslog_country_code" => ""
      "syslog_object_id" => ""
      "syslog_client" => ""
      "syslog_remote_address" => ""
      "syslog_severity" => ""
      "cyolodstid" => ""
      "cyolosubjectname" => ""
      "cyolosubjectid" => ""
      "cyolocountrycode" => ""
      "dst" => ""
      "cyoloobjname" => ""
      "cyoloobjid" => ""
      "cyolosessionid" => ""
      "cyolouagent" => ""
      "cyoloauthid" => ""
      "cyoloauthname" => ""
      "cyolosubjectkind" => ""
      "cyoloobjkind" => ""
      "inter_host" => ""
      "prod_type" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{TIMESTAMP_ISO8601:time} %{DATA:container_id} \\[%{DATA:log_source}\\]\\[%{DATA:log_level}\\]:\\s+CEF:%{DATA:cef_version}\\|%{DATA}\\|%{DATA}\\|%{DATA:product_version}\\|%{DATA:Signature_id}\\|%{DATA}\\|%{DATA:cef_severity}\\|%{GREEDYDATA:kv_data} msg=%{GREEDYDATA:msg} cyolodstid=%{DATA:cyolodstid} %{GREEDYDATA:kv_data1}"
        "^<(?<syslog_pri>[0-9]+)>(?<syslog_timestamp>%{TIMESTAMP_ISO8601}) (?<container_id>[a-f0-9]+) \\[%{WORD:log_source}\\]\\[%{INT:log_level}\\]: (?<json_payload>.*)$"
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{DATA:inter_host} %{DATA:prod_type}(\\[%{INT}\\])?:\\s+%{GREEDYDATA:msg}"
      ]
    }
    overwrite => [ "product_version" , "kv_data" , "msg" , "kv_data1", "log_source" , "log_level" , "json_payload", "syslog_timestamp", "container_id", "cef_version", "Signature_id", "cef_severity","time","cyolodstid","inter_host", "prod_type"]
    on_error => "grok_error"
  }
  mutate {
    gsub => ["kv_data1","([a-zA-Z0-9]+)=","#$1="]
  }
  kv {
    source => "kv_data1"
    value_split => "="
    field_split => "#"
    on_error => "kv_failure1"
  }
  mutate {
    gsub => ["kv_data","([a-zA-Z0-9]+)=","#$1="]
  }
  kv {
    source => "kv_data"
    value_split => "="
    field_split => "#"
    on_error => "kv_failure2"
  }
  if [time] != "" {
    grok {
      match => {
        "time" => "%{TIMESTAMP_ISO8601:time}-%{GREEDYDATA}"
      }
      overwrite => ["time"]
      on_error => "time_data_error"
    }
    if ![time_data_error] {
      date {
        match => ["time", "ISO8601","yyyy-MM-ddTHH:mm:ss"]
        on_error => "time_error"
      }
    }
    else {
      date {
        match => ["time", "MMM  d HH:mm:ss"]
        rebase => true
        on_error => "time_failed"
      }
    }
  }
  if [inter_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_host}"
        "intermediary.asset.hostname" => "%{inter_host}"
      }
      on_error => "inter_host_error"
    }
  }
  if [cyolosubjectname] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{cyolosubjectname}"
      }
      on_error => "cyolosubjectname_error"
    }
    if ![cyolosubjectname_error] {
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
  }
  if [cyolosubjectid] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{cyolosubjectid}"
      }
      on_error => "cyolosubjectid_error"
    }
  }
  if [cyolocountrycode] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{cyolocountrycode}"
      }
      on_error => "cyolocountrycode_error"
    }
  }
  if [dst] != "" {
    grok {
      match => {
        "dst" => "%{IP:dst}"
      }
      overwrite => ["dst"]
      on_error => "dst_error"
    }
    if ![dst_error] {
      mutate {
        merge => {
          "target.ip" => "dst"
          "target.asset.ip" => "dst"
        }
        on_error => "target_ip_error"
      }
      if ![target_ip_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [cyoloobjname] != "" {
    mutate {
      replace => {
        "target.application" => "%{cyoloobjname}"
      }
      on_error => "cyoloobjname_error"
    }
  }
  if [cyoloobjid] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{cyoloobjid}"
      }
      on_error => "cyoloobjid_error"
    }
  }
  if [cyolosessionid] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{cyolosessionid}"
      }
      on_error => "cyolosessionid_error"
    }
  }
  if [cyolouagent] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{cyolouagent}"
      }
      on_error => "cyolouagent_not_found"
    }
    mutate {
      replace => {
        "network.http.parsed_user_agent" => "%{cyolouagent}"
      }
      on_error => "parsed_user_agent_not_found"
    }
    mutate {
      convert => {
        "network.http.parsed_user_agent" => "parseduseragent"
      }
      on_error => "parsed_user_agent_conversion_failed"
    }
  }
  if [cyoloauthid] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{cyoloauthid}"
      }
      on_error => "cyoloauthid_not_found"
    }
  }
  if [cyoloauthname] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{cyoloauthname}"
      }
      on_error => "cyoloauthname_not_found"
    }
  }
  if [cyolosubjectkind] != "" {
    mutate {
      replace => {
        "principal.resource.resource_subtype" => "%{cyolosubjectkind}"
      }
      on_error => "cyolosubjectkind_error"
    }
  }
  if [cyoloobjkind] != "" {
    mutate {
      replace => {
        "target.resource.resource_subtype" => "%{cyoloobjkind}"
      }
      on_error => "cyoloobjkind_error"
    }
  }
  if [syslog_timestamp] != "" {
    date {
      match => ["syslog_timestamp", "ISO8601"]
      target => "metadata.collected_timestamp"
      on_error => "date_error"
    }
  }
  json {
    source => "json_payload"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [result] == "failure" {
    mutate {
      replace => {
        "security_result.outcome" => "FAIL"
        "sr_action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
      on_error => "merge_action_fail"
    }
  } else if [result] == "success" {
    mutate {
      replace => {
        "security_result.outcome" => "PASS"
        "sr_action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
      on_error => "merge_action_allow"
    }
  }

  for key, value in data {
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_to_string_error"
    }
    mutate {
      replace => {
        "data_field" => ""
      }
    }
    mutate {
      replace => {
        "data_field.key" => "data_%{key}"
        "data_field.value.string_value" => "%{value}"
      }
      on_error => "kv_error_data"
    }
    if ![kv_error_data] {
      mutate {
        merge => {
          "additional.fields" => "data_field"
        }
        on_error => "data_merge_error"
      }
    }
  }

  if [credentials_origin] != "" {
    mutate {
      replace => {
        "credentials_origin_label.key" => "credentials_origin"
        "credentials_origin_label.value" => "%{credentials_origin}"
      }
      on_error => "cred_org_err"
    }
    if ![cred_org_err] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "credentials_origin_label"
        }
        on_error => "cred_org_merge_err"
      }
    }
  }

  if [credentials_id] != "" {
    mutate {
      replace => {
        "credentials_id_label.key" => "credentials_id"
        "credentials_id_label.value" => "%{credentials_id}"
      }
      on_error => "cred_id_err"
    }
    if ![cred_id_err] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "credentials_id_label"
        }
        on_error => "cred_id_merge_err"
      }
    }
  }

  if [credentials_name] != "" {
    mutate {
      replace => {
        "credentials_name_label.key" => "credentials_name"
        "credentials_name_label.value" => "%{credentials_name}"
      }
      on_error => "cred_name_err"
    }
    if ![cred_name_err] {
      mutate {
        merge => {
          "principal.user.attribute.labels" => "credentials_name_label"
        }
        on_error => "cred_name_merge_err"
      }
    }
  }

  if [asset_id] != "" {
    mutate {
      replace => {
        "target.asset.asset_id" => "%{asset_id}"
      }
      on_error => "asset_id_err"
    }
  }

  if [asset_name] != "" {
    mutate {
      replace => {
        "target.asset.product_object_id" => "%{asset_name}"
      }
      on_error => "asset_name_err"
    }
  }
  if [grok_error] {
    drop {
      tag => "TAG_UNSPECIFIED"
    }
  }
  if [id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id}"
      }
      on_error => "id_invalid"
    }
  }
  if [remote_address] != "" {
    mutate {
      merge => {
        "principal.ip" => "remote_address"
        "principal.asset.ip" => "remote_address"
      }
      on_error => "remote_address_invalid"
    }
  }
  if [country_code] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{country_code}"
      }
      on_error => "country_code_invalid"
    }
  }
  if [destination_host] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{destination_host}"
        "target.asset.hostname" => "%{destination_host}"
        "has_target" => "true"
      }
      on_error => "destination_host_invalid"
    }
  }
  if [destination_port] != "" {
    mutate {
      replace => {
        "target.port" => "%{destination_port}"
      }
      on_error => "destination_port_invalid"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "DestPort_not_present"
    }
  }
  if [message] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{message}"
      }
      on_error => "message_invalid"
    }
  }
  if [subject_name] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{subject_name}"
        "has_user" => "true"
      }
      on_error => "subject_name_invalid"
    }
  }
  if [subject_id] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{subject_id}"
      }
      on_error => "subject_id_invalid"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "timestamp_error"
    }
  }
  if [object_name] != "" {
    mutate {
      replace => {
        "target.application" => "%{object_name}"
      }
      on_error => "object_name_empty"
    }
  }
  if [object_id] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{object_id}"
      }
      on_error => "object_id_empty"
    }
  }
  if [message] =~ "rdp" {
    mutate {
      replace => {
        "network.application_protocol" => "RDP"
      }
    }
  }
  if [session_id] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{session_id}"
      }
      on_error => "session_id_empty"
    }
  }
  if [message] !~ "CEF" {
    grok {
      match => {
        "message" => "duration: %{GREEDYDATA:duration_str}"
      }
      on_error => "no_duration_str"
      overwrite => ["duration_str"]
    }
    if ![no_duration_str] {
      mutate {
        replace => {
          "duration_label.key" => "duration"
          "duration_label.value.string_value" => "%{duration_str}"
        }
        on_error => "duration_label_error"
      }
      if ![duration_label_error] {
        mutate {
          merge => {
            "additional.fields" => "duration_label"
          }
          on_error => "duration_merge_error"
        }
      }
    }
  }
  if [subject_kind] != "" {
    mutate {
      replace => {
        "subject_kind_label.key" => "subject_kind"
        "subject_kind_label.value.string_value" => "%{subject_kind}"
      }
      on_error => "subject_kind_label_error"
    }
    if ![subject_kind_label_error] {
      mutate {
        merge => {
          "additional.fields" => "subject_kind_label"
        }
        on_error => "subject_kind_label_merge_error"
      }
    }
  }
  if [authority_kind] != "" {
    mutate {
      replace => {
        "authority_kind_label.key" => "authority_kind"
        "authority_kind_label.value.string_value" => "%{authority_kind}"
      }
      on_error => "authority_kind_label_error"
    }
    if ![authority_kind_label_error] {
      mutate {
        merge => {
          "additional.fields" => "authority_kind_label"
        }
        on_error => "authority_kind_label_merge_error"
      }
    }
  }
  if [log_level] != "" {
    mutate {
      replace => {
        "log_level_label.key" => "log_level"
        "log_level_label.value.string_value" => "%{log_level}"
      }
      on_error => "log_level_label_error"
    }
    if ![log_level_label_error] {
      mutate {
        merge => {
          "additional.fields" => "log_level_label"
        }
        on_error => "log_level_label_merge_error"
      }
    }
  }
  if [object_kind] != "" {
    mutate {
      replace => {
        "object_kind_label.key" => "object_kind"
        "object_kind_label.value.string_value" => "%{object_kind}"
      }
      on_error => "object_kind_label_error"
    }
    if ![object_kind_label_error] {
      mutate {
        merge => {
          "additional.fields" => "object_kind_label"
        }
        on_error => "object_kind_label_merge_error"
      }
    }
  }
  if [client] != "" {
    mutate {
      replace => {
        "network.http.user_agent" => "%{client}"
      }
      on_error => "client_empty"
    }
    mutate {
      replace => {
        "network.http.parsed_user_agent" => "%{client}"
      }
      on_error => "replace_user_agent_error"
    }
    mutate {
      convert => {
        "network.http.parsed_user_agent" => "parseduseragent"
      }
      on_error => "convert_user_agent_error"
    }
  }
  if [authority_id] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{authority_id}"
      }
      on_error => "authority_id_empty"
    }
  }
  if [authority_name] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{authority_name}"
      }
      on_error => "authority_name_empty"
    }
  }
  if [severity] == "1" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] != "" {
    mutate {
      replace => {
        "security_result.severity" => "UNKNOWN_SEVERITY"
      }
    }
  }
  for index, rule in rules {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_conversion_error"
    }
    for key, value in rule map {
      mutate {
        replace => {
          "field" => ""
        }
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "value_conversion_error"
      }
      mutate {
        replace => {
          "check" => "%{value}"
        }
        on_error => "value_not_exists"
      }
      if ![value_not_exists] and [value] != "" {
        mutate {
          replace => {
            "field.value" => "%{value}"
          }
          on_error => "value_not_exists"
        }
        mutate {
          replace => {
            "field.key" => "%{key}_%{index}"
          }
          on_error => "key_not_exists"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "field"
          }
          on_error => "field_merge_error"
        }
      }
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "observer.hostname" => "%{hostname}"
      }
      on_error => "hostname_empty"
    }
  }
  if [node_id] != "" {
    mutate {
      replace => {
        "observer.resource.product_object_id" => "%{node_id}"
      }
      on_error => "node_id_empty"
    }
  }
  if [site_id] != "" {
    mutate {
      replace => {
        "site_id_label.key" => "site_id"
        "site_id_label.value" => "%{site_id}"
      }
      on_error => "site_id_empty"
    }
    if ![site_id_empty] {
      mutate {
        merge => {
          "observer.resource.attribute.labels" => "site_id_label"
        }
        on_error => "site_id_label_merge_error"
      }
    }
  }
  if [log_source] != "" {
    mutate {
      replace => {
        "log_source_label.key" => "log_source"
        "log_source_label.value" => "%{log_source}"
      }
      on_error => "log_source_empty"
    }
    if ![log_source_empty] {
      mutate {
        merge => {
          "observer.resource.attribute.labels" => "log_source_label"
        }
        on_error => "log_source_label_merge_error"
      }
    }
  }
  if [site_name] != "" {
    mutate {
      replace => {
        "site_name_label.key" => "site_name"
        "site_name_label.value" => "%{site_name}"
      }
      on_error => "site_name_empty"
    }
    if ![site_name_empty] {
      mutate {
        merge => {
          "observer.resource.attribute.labels" => "site_name_label"
        }
        on_error => "site_name_label_merge_error"
      }
    }
  }
  if [container_id] != "" {
    mutate {
      replace => {
        "container_id_label.key" => "container_id"
        "container_id_label.value" => "%{container_id}"
      }
      on_error => "container_id_empty"
    }
    if ![container_id_empty] {
      mutate {
        merge => {
          "observer.resource.attribute.labels" => "container_id_label"
        }
        on_error => "container_id_label_merge_error"
      }
    }
  }
  if [transaction_id] != "" {
    mutate {
      replace => {
        "transaction_id_label.key" => "transaction_id"
        "transaction_id_label.value" => "%{transaction_id}"
      }
      on_error => "transaction_id_empty"
    }
    if ![transaction_id_empty] {
      mutate {
        merge => {
          "observer.resource.attribute.labels" => "transaction_id_label"
        }
        on_error => "transaction_id_label_merge_error"
      }
    }
  }
  if [event_id] != "" {
    mutate {
      replace => {
        "internal_event_id_label.key" => "internal_event_id"
        "internal_event_id_label.value" => "%{event_id}"
      }
      on_error => "event_id_empty"
    }
    if ![event_id_empty] {
      mutate {
        merge => {
          "observer.resource.attribute.labels" => "internal_event_id_label"
        }
        on_error => "internal_event_id_label_merge_error"
