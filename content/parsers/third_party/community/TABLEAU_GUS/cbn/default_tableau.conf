# Product: TABLEAU
# Category: Web server
# Supported Format: JSON, KV, SYSLOG
# Reference: NA
# Last Updated: 2026-08-25
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "id" => ""
      "Content" => ""
      "RawData" => ""
      "ElapsedTime" => ""
      "ID" => ""
      "LastStatus" => ""
      "Port" => ""
      "RemoteHost" => ""
      "RemoteUser" => ""
      "SizeBytes" => ""
      "Timestamp" => ""
      "Timeszone" => ""
      "Workername" => ""
      "XForwardedForIP" => ""
      "network_received_bytes" => ""
      "http_content_type" => ""
      "http_response_code" => ""
      "ip_address" => ""
      "xip" => ""
      "method" => ""
      "path" => ""
      "version_protocol" => ""
      "http_protocol" => ""
      "event_type" => ""
      "protocol" => ""
      "number" => ""
      "key_value" => ""
      "kv2" => ""
      "forwarded_ip" => ""
      "principal_mid_present" => ""
      "session_id" => ""
      "dataserver_permissions" => ""
      "dbname" => ""
      "dp" => ""
      "local_dataserver" => ""
      "saved_credentials_viewerid" => ""
      "vid" => ""
      ":id" =>""
      "ld" => ""
      "id1" => ""
      "locale" => ""
      "lo" => ""
      "server_oauth" => ""
      "so" => ""
      "server_viewerid" => ""
      "viewerid" => ""
      "dataserver_version" => ""
      "dsv" => ""
      "tablename" => ""
      "logging_ctx" => ""
      "log" => ""
      "tn" => ""
      "not_json" => ""
      "id_1" => ""
      "thread_label" => ""
      "metadata" => ""
      "target" => ""
      "principal" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "intermediary" => ""
      "http_version" => ""
      "appname" => ""
      "id2" => ""
      "id3" => ""
      "thread" => ""
      "pid" => ""
      "timestamp" => ""
      "user" => ""
      "logger" => ""
      "loglevel" => ""
      "script_type" => ""
      "function_name" => ""
      "user_id" => ""
      "site_id" => ""
      "result_status" => ""
      "has_user" => "false"
      "Computer" => ""
      "TimeGenerated" => ""
      "_ResourceId" => ""
      "_SubscriptionId" => ""
      "FilePath" => ""
      "_TimeReceived" => ""
      "_IsBillable" => ""
      "_BilledSize" => ""
      "_Internal_WorkspaceResourceId" => ""
      "Type" => ""
      "TenantId" => ""
      "_ItemId" => ""
      "temp_application" => ""
      "temp_data1" => ""
      "temp_data2" => ""
      "temp_message" => ""
      "rawdata_grok_failure" => "false"
      "temp_logger_name" => ""
      "temp_pid" => ""
      "temp_thread_id" => ""
      "temp_severity" => ""
      "temp_username" => ""
      "temp_ip_address" => ""
      "temp_mac_address" => ""
      "temp_hostname" => ""
      "temp_url" => ""
      "temp_http_method" => ""
      "temp_http_status_code" => ""
      "temp_event_type" => ""
      "temp_thread_name" => ""
      "temp_log_level" => ""
      "temp_http_status" => ""
      "temp_user" => ""
      "temp_domain" => ""
      "temp_site_id" => ""
      "temp_role" => ""
      "temp_http_uri" => ""
      "temp_api_call" => ""
      "java_class" => ""
      "java_method" => ""
      "source_info" => ""
      "user_name" => ""
      "user_application" => ""
      "eventId" => ""
      "siteLuid" => ""
      "eventType" => ""
      "eventVersion" => ""
      "eventCategory" => ""
      "eventTime" => ""
      "eventProcessedTime" => ""
      "sheetType" => ""
      "siteName" => ""
      "caption" => ""
      "description" => ""
      "title" => ""
      "initiatingUserLuid" => ""
      "actorUserId" => ""
      "ownerName" => ""
      "actorUserLuid" => ""
      "workbookName" => ""
      "index" => ""
      "viewLuid" => ""
      "repositoryUrl" => ""
      "revision" => ""
      "siteRoleId" => ""
      "systemAdminLevel" => ""
      "licensingRoleName" => ""
      "name" => ""
      "sheetId" => ""
      "workbookLuid" => ""
      "firstPublishedAt" => ""
      "fields" => ""
      "ownerLuid" => ""
      "initiatingUserId" => ""
      "has_network" => "false"
      "has_target" => "false"
      "temp_time" => ""
      "processed_temp_time" => ""
      "check" => ""
    }
  }

  mutate {
    convert => {
      "rawdata_grok_failure" => "boolean"
    }
  }
  mutate{
     gsub => ["message", "-", "_"]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    mutate {
      gsub => ["message", '\"\"', '\"']
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
  }
  if [not_json] {
    grok {
      match => {
        "message" => [
          "%{DATA:timestamp}\\s+%{INT:pid}\\s+\\(%{WORD:script_type},%{USERNAME:user},%{DATA:id1},%{DATA:id2},%{DATA:id3}\\)\\s+%{DATA:thread}\\s+%{WORD:appname}:\\s+%{DATA:loglevel}\\s+%{DATA:logger}\\s+%{DATA}\\s+%{GREEDYDATA:message}",
          "%{DATA:timestamp}\\s+%{INT:pid}\\s+\\(%{WORD:script_type},%{USERNAME:user},%{DATA:id1},%{DATA:id2},%{DATA:id3}\\)\\s+%{DATA:thread}\\s+%{WORD:appname}:\\s+%{DATA:loglevel} %{DATA:logger}\\s+%{DATA} %{WORD:function_name}\\s+\\(user:\\s+%{DATA:user_id},\\s+site:\\s+%{DATA:site_id}\\):\\s+%{WORD:result}"
        ]
      }
      overwrite => ["timestamp","pid","script_type","user","id1","id2","id3","thread","appname","loglevel","logger","message","function_name","user_id","site_id","result"]
      on_error => "not_syslog"
    }
  }
  if [eventId] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{eventId}"
      }
      on_error => "eventId_not_mapped"
    }
    mutate {
      gsub => ["metadata.product_log_id", "_", "-"]
    }
  }
  if [eventTime] != "" {
    mutate {
      replace => {
        "temp_time" => "%{eventTime}"
      }
      on_error => "eventTime_replace_failed"
    }
    mutate {
      gsub => ["temp_time", "_", "-"]
    }
    date {
      match => ["temp_time", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "invalid_event_time_format"
    }
  }
  if [eventProcessedTime] != "" {
    mutate {
      replace => {
        "processed_temp_time" => "%{eventProcessedTime}"
      }
      on_error => "eventProcessedTime_replace_failed"
    }
    mutate {
      gsub => ["processed_temp_time", "_", "-"]
    }
    date {
      match => ["processed_temp_time", "ISO8601"]
      target => "metadata.collected_timestamp"
      on_error => "invalid_event_processed_time_format"
    }
  }
  if [eventType] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{eventType}"
      }
      on_error => "eventType_not_mapped"
    }
  }
  if [eventVersion] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{eventVersion}"
      }
      on_error => "eventVersion_not_mapped"
    }
  }
  if [eventCategory] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "eventCategory"
      }
      on_error => "eventCategory_not_mapped"
    }
  }
  if [actorUserId] != "" {
    mutate {
      convert => {
        "actorUserId" => "string"
      }
      on_error => "actorUserId_not_mapped"
    }
    if ![actorUserId_not_mapped] {
      mutate {
        replace => {
          "principal.user.userid" => "%{actorUserId}"
          "has_user" => "true"
        }
        on_error => "actorUserId_not_mapped_error"
      }
    }
  }
  if [licensingRoleName] != "" {
    mutate {
      replace => {
        "principal.user.role_name" => "%{licensingRoleName}"
      }
      on_error => "licensingRoleName_not_mapped"
    }
  }
  if [name] != "" {
    mutate {
      replace => {
        "target.resource.name" => "%{name}"
      }
      on_error => "name_not_mapped"
    }
  }
  if [viewLuid] != "" {
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{viewLuid}"
      }
      on_error => "viewLuid_not_mapped"
    }
  }
  if [repositoryUrl] != "" {
    mutate {
      replace => {
        "target.url" => "%{repositoryUrl}"
      }
      on_error => "repositoryUrl_not_mapped"
    }
  }
  if [ownerName] =~ "^.+@.+$" {
    mutate {
      merge => {
        "target.user.email_addresses" => "ownerName"
      }
      on_error => "email_id_not_found"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "description_not_mapped"
    }
  }
  mutate {
    rename => {
      "index" => "addition.index"
      "firstPublishedAt" => "addition.firstPublishedAt"
      "fields" => "addition.fields"
      "revision" => "addition.revision"
      "sheetId" => "addition.sheetId"
      "caption" => "addition.caption"
      "siteName" => "addition.siteName"
      "siteLuid" => "addition.siteLuid"
      "workbookLuid" => "addition.workbookLuid"
      "workbookName" => "addition.workbookName"
      "ownerLuid" => "addition.ownerLuid"
      "systemAdminLevel" => "addition.systemAdminLevel"
      "siteRoleId" => "addition.siteRoleId"
      "initiatingUserLuid" => "addition.initiatingUserLuid"
      "initiatingUserId" => "addition.initiatingUserId"
      "actorUserLuid" => "addition.actorUserLuid"
      "title" => "addition.title"
      "sheetType" => "addition.sheetType"
    }
  }
  for key1,value1 in addition map {
    mutate {
      replace => {
        "field1" => ""
        "check" => ""
      }
    }
    mutate {
      convert => {
        "value1" => "string"
      }
      on_error => "value1_string"
    }
    mutate {
      replace => {
        "check" => "%{value1}"
      }
      on_error => "check_empty"
    }
    if ![check_empty] && [check] != "" {
      mutate {
        replace => {
          "field1.key" => "%{key1}"
        }
        on_error => "key1_empty"
      }
      mutate {
        replace => {
          "field1.value" => "%{value1}"
        }
        on_error => "value_not_found_principal"
      }
      if [key1] in ["systemAdminLevel", "siteRoleId", "initiatingUserLuid", "initiatingUserId", "actorUserLuid"] {
        mutate {
          merge => {
            "principal.user.attribute.labels" => "field1"
          }
          on_error => "principal_merge_failed"
        }
      }
      else {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "field1"
          }
          on_error => "target_merge_failed"
        }
      }
    }
  }
  if [appname] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{appname}"
      }
      on_error => "appname_not_mapped"
    }
  }
  if [id2] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id2}"
      }
      on_error => "id2_not_mapped"
    }
    mutate {
      gsub => ["metadata.product_log_id", "_", "-"]
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.process.pid" => "%{pid}"
      }
      on_error => "pid_empty"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ", "yyyy_MM_dd HH:mm:ss.SSS"]
      target => "metadata.event_timestamp"
      on_error => "invalid_format"
    }
  }
  if [user] !="" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        "has_user" => "true"
      }
      on_error => "user_empty"
    }
  }
  if [id1] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{id1}"
      }
      on_error => "id1_empty"
    }
  }
  if [logger] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.process.command_line" => "%{logger}"
      }
      on_error => "logger_not_mapped"
    }
  }
  if [loglevel] != "" {
    if [loglevel] == "INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
        on_error => "info_not_mapped"
      }
    } else if [loglevel] == "WARN" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
        on_error => "warn_not_mapped"
      }
    } else if [loglevel] == "ERROR" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
        on_error => "error_not_mapped"
      }
    } else {
      mutate {
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
        on_error => "loglevel_not_mapped"
      }
    }
  }

  if [not_json] and [message] != "" {
    mutate {
      gsub => ["message", "\\r", ""]
    }
    grok {
      match => {
        "message" => "%{DATA:function_name}\\s+\\(user:\\s+%{DATA:user_id},\\s+site:\\s+%{DATA:site_id}\\):\\s+%{DATA:result_status}"
      }
      overwrite => ["function_name","user_id","site_id","result_status"]
      on_error => "message_parsing_failed"
    }
    if [user_id] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{user_id}"
        }
        on_error => "target_user_id_failed"
      }
    }
    if [site_id] != "" {
      mutate {
        replace => {
          "target.resource.id" => "%{site_id}"
        }
        on_error => "target_resource_id_failed"
      }
    }
    if [function_name] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{function_name}"
        }
        on_error => "function_name_empty"
      }
    }
    if [result_status] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{result_status}"
        }
        on_error => "result_status_empty"
      }
    }
      mutate {
        replace => {
          "metadata.description" => "%{message}"
        }
        on_error => "message_not_mapped"
      }
  }
  if [script_type] not in ["", "_"] {
    mutate {
      replace => {
        "target.resource.name" => "%{script_type}"
      }
      on_error => "script_type_not_mapped"
    }
  }
  if [id3] != "" {
    mutate {
      replace => {
        "id3_label.value.string_value" => "%{id3}"
      }
      on_error => "id3_label_not_present"
    }
    if ![id3_label_not_present] {
      mutate {
        replace => {
          "id3_label.key" => "id3"
        }
        on_error => "id3_key_not_added"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "id3_label"
        }
        on_error => "id3_label_not_found"
      }
    }
  }
  if [thread] != "" {
    mutate {
      replace => {
        "thread_label.key" => "thread"
        "thread_label.value.string_value" => "%{thread}"
      }
      on_error => "thread_error"
    }
    if ![thread_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "thread_label"
        }
        on_error => "thread_merge_error"
      }
    }
  }

# Content
  if [Content] != "" {
    grok {
      match => {
        "Content" => [
         '\\"%{DATA:method} %{URIPATH:path}\\?%{DATA:kv2} %{DATA:protocol}\\/%{NUMBER:http_version}\\"'
         "%{DATA:method} %{URIPATH:path} %{DATA:protocol}\\/%{NUMBER:http_version}"

        ]
      }
      overwrite => ["method","number", "path", "protocol", "http_version", "kv2"]
      on_error => "grok_failure"
    }

    kv {
    source => "kv2"
    field_split => "&"
    value_split => "="
    on_error => "not_kv"
    }
    if [Content] != "" {
      mutate {
        gsub => ["Content", '\"_\"', ""]
      }
      mutate {
        replace => {
          "metadata.description" => "%{Content}"
        }
        on_error => "content_not_mapped"
      }
    }
    if [http_version] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol_version" => "%{http_version}"
        }
        on_error => "http_version_failed"
      }
    }

  # session_id
    if [session_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.session_id" => "%{session_id}"
        }
        on_error => "session_id_invalid"
      }
    }
    # dataserver_permissions
    if [dataserver_permissions] != "" {
      mutate {
        replace => {
          "dp.key" => "dataserver_permissions"
          "dp.value.string_value" => "%{dataserver_permissions}"
        }
          on_error => "dataserver_permissions_not_mapped"
      }
      if ![dataserver_permissions_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "dp"
          }
          on_error => "dataserver_permissions_not_merged"
        }
      }
    }
    # dbname
    if [dbname] not in ["", "_"] {
      mutate {
        replace => {
          "target.resource.name" => "%{dbname}"
        }
        on_error => "dbname_invalid"
      }
    }
    # local_dataserver
    if [local_dataserver] != "" {
      mutate {
        replace => {
          "ld.key" => "local_dataserver"
          "ld.value.string_value" => "%{local_dataserver}"
        }
          on_error => "local_dataserver_not_mapped"
      }
      if ![local_dataserver_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "ld"
          }
          on_error => "local_dataserver_not_merged"
        }
      }
    }
    # saved_credentials_viewerid
    if [saved_credentials_viewerid] != "" {
      mutate {
        replace => {
          "vid.key" => "saved_credentials_viewerid"
          "vid.value.string_value" => "%{saved_credentials_viewerid}"
        }
          on_error => "saved_credentials_viewerid_not_mapped"
      }
      if ![saved_credentials_viewerid_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "vid"
          }
          on_error => "saved_credentials_viewerid_not_merged"
        }
      }
    }
    # locale
    if [locale] != "" {
      mutate {
        replace => {
          "lo.key" => "locale"
          "lo.value.string_value" => "%{locale}"
        }
          on_error => "locale_not_mapped"
      }
      if ![locale_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "lo"
          }
          on_error => "locale_not_merged"
        }
      }
    }
    # server_oauth
    if [server_oauth] != "" {
      mutate {
        replace => {
          "so.key" => "server_oauth"
          "so.value.string_value" => "%{server_oauth}"
        }
          on_error => "server_oauth_not_mapped"
      }
      if ![server_oauth_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "so"
          }
          on_error => "server_oauth_not_merged"
        }
      }
    }
    # :id
    mutate {
      replace => {
        "id_1" => "%{:id}"
      }
        on_error => "id_not_mapped"
    }
    if [id_1] != "" {
      mutate {
        replace => {
          "id1.key" => ":id"
          "id1.value.string_value" => "%{id_1}"
        }
          on_error => "id_not_mapped"
      }
      if ![id_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "id1"
          }
          on_error => "id_not_got_merged"
        }
      }
    }
    #server_viewerid
    if [server_viewerid] != "" {
      mutate {
        replace => {
          "viewerid.key" => "server_viewerid"
          "viewerid.value.string_value" => "%{server_viewerid}"
        }
          on_error => "server_viewerid_not_mapped"
      }
      if ![server_viewerid_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "viewerid"
          }
          on_error => "server_viewerid_not_merged"
        }
      }
    }
    #dataserver_version
    mutate {
      convert => {
          "dataserver_version" => "string"
      }
      on_error => "dsv_is_already_string"
    }
    if [dataserver_version] != "" {
      mutate {
        replace => {
          "dsv.key" => "dataserver_version"
          "dsv.value.string_value" => "%{dataserver_version}"
        }
          on_error => "dataserver_version_not_mapped"
      }
      if ![dataserver_version_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "dsv"
          }
          on_error => "dataserver_version_not_merged"
        }
      }
    }
    #tablename
    if [tablename] != "" {
      mutate {
        replace => {
          "tn.key" => "tablename"
          "tn.value.string_value" => "%{tablename}"
        }
          on_error => "tablename_not_mapped"
      }
      if ![tablename_not_mapped] != "" {
        mutate {
          merge => {
            "additional.fields" => "tn"
          }
          on_error => "tablename_not_merged"
        }
      }
    }
    # logging_ctx
    if [logging_ctx] != "" {
      mutate {
        replace => {
          "logging_ctx_label.value" => "%{logging_ctx}"
        }
        on_error => "logging_ctx_error"
      }
      if ![logging_ctx_error] {
        mutate {
          replace => {
            "logging_ctx_label.key" => "logging_ctx"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "logging_ctx_label"
          }
          on_error => "logging_ctx_merge_error"
        }
      }
    }
    # path
    if [path] != "" {
      mutate {
        replace => {
          "target.file.full_path" => "%{path}"
        }
        on_error => "wrong_path_failed"
      }
    }

    if [protocol] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "%{protocol}"
        }
        on_error => "protocol_failed"
      }
    }
    mutate {
      gsub => ["method", '\"', ""]
    }

    if [method] in ["GET", "HEAD", "POST", "PUT", "DELETE",
                    "CONNECT", "OPTIONS", "TRACE", "PATCH",
                    "CCM_POST", "CERTVERIFY"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{method}"
        }
        on_error => "methods_failed_of_second_grok"
      }
    }
  }
  #  "\"_\""
# ElapsedTime
  mutate {
    gsub => ["ElapsedTime", '\"_\"', ""]
  }
  mutate {
    gsub => ["ElapsedTime", '\"', ""]
  }
  if [ElapsedTime] != "" {
    mutate {
      replace => {
        "elapsedtime.key" => "ElapsedTime"
        "elapsedtime.value.string_value" => "%{ElapsedTime}"
      }
      on_error => "ElapsedTime_not_mapped"
    }
    if ![ElapsedTime_not_mapped] != "" {
      mutate {
        merge => {
          "additional.fields" => "elapsedtime"
        }
        on_error => "ElapsedTime_not_merged"
      }
    }
  }
# ID
  if [ID] !~ /(_|\|)/ {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{ID}"
      }
      on_error => "ID_not_present"
    }
  }
# LastStatus
  mutate {
    gsub => ["LastStatus", '\"', ""]
  }
  if [LastStatus] != "" {
    mutate {
      replace => {
        "laststatus.key" => "LastStatus"
        "laststatus.value.string_value" => "%{LastStatus}"
      }
      on_error => "LastStatus_not_mapped"
    }
    if ![LastStatus_not_mapped] != "" {
      mutate {
        merge => {
          "additional.fields" => "laststatus"
        }
        on_error => "LastStatus_not_merged"
      }
    }
  }
# Port
  if [Port] != "" {
    mutate {
      convert => {
        "Port" => "integer"
      }
      on_error => "not_valid_port"
    }
    mutate {
      rename => {
        "Port" => "principal.nat_port"
      }
      on_error => "Port_not_present"
    }
  }
# RemoteHost
  if [RemoteHost] != "" {
    mutate {
      merge => {
        "principal.ip" => "RemoteHost"
        "principal.asset.ip" => "RemoteHost"
      }
      on_error => "RemoteHost_not_found"
    }
    if ![RemoteHost_not_found] {
      mutate {
        replace => {
          "principal_mid_present" => "true"
        }
      }
    }
  }
# RemoteUser
  if [RemoteUser] not in ["", "_", "-"] {
    mutate {
      replace => {
        "principal.user.userid" => "%{RemoteUser}"
      }
      on_error => "RemoteUser_empty"
    }
  }
# SizeBytes
  if [SizeBytes] != "" {
    mutate {
      replace => {
        "network_received_bytes" => "%{SizeBytes}"
      }
      on_error => "SizeBytes_empty"
    }
  }
# Workername
  if [Workername] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{Workername}"
        "principal.asset.hostname" => "%{Workername}"
      }
      on_error => "Workername_empty"
    }
  }

  if [Timestamp] != "" {
    mutate {
      gsub => ["Timestamp", "_", "-"]
    }
    mutate {
      gsub => ["Timestamp", "T", " "]
    }
    date {
      match => ["Timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
      on_error => "wrong_match"
    }
  }
# Timeszone
  mutate {
      gsub => ["Timeszone", '\"', ""]
  }
  mutate {
    gsub => ["Timeszone", "_", ""]
  }
  if [Timeszone] != "" {
    mutate {
      replace => {
        "timeszone.key" => "Timeszone"
        "timeszone.value.string_value" => "%{Timeszone}"
      }
        on_error => "Timeszone_not_mapped"
    }
    if ![Timeszone_not_mapped] != "" {
      mutate {
        merge => {
          "additional.fields" => "timeszone"
        }
        on_error => "Timeszone_not_merged"
      }
    }
  }

  if [XForwardedForIP] != "" {
    mutate {
      gsub => ["XForwardedForIP", '\\"', ""]
    }
    mutate {
      gsub => ["XForwardedForIP", ",", "\",\""]
    }
    mutate {
      replace => {
        "XForwardedForIP" => "{\"XForwardedForIP\":[\"%{XForwardedForIP}\"]}"
      }
    }
    json {
      source => "XForwardedForIP"
      array_function => "split_columns"
      on_error => "XForwardedForIP_not_json"
    }
    for xip in XForwardedForIP {
      if [xip] != "" {
        grok {
          match => {
            "xip" => [
              "%{IP:validated_ip}"
            ]
          }
          overwrite => ["validated_ip"]
          on_error => "xip_ip_not_ip"
        }
      }
    }
  }

  if [RawData] != "" {
    mutate {
      gsub => ["RawData", "_", "-"]
    }
    grok {
      match => {
        "RawData" => ["%{TIMESTAMP_ISO8601:temp_timestamp} %{DATA:timezone} %{NUMBER:temp_pid} \\(%{DATA:csv_data}\\) %{NOTSPACE:temp_thread_name} : %{DATA:temp_log_level} \\s+%{DATA:temp_logger_name} - %{GREEDYDATA:temp_message}",
                     "%{TIMESTAMP_ISO8601:temp_timestamp} %{DATA:timezone} %{NUMBER:temp_pid} \\(%{DATA:user_application},%{DATA:user_name},%{DATA},%{DATA:temp_data1},%{DATA:temp_data2}\\) %{NOTSPACE:temp_thread_name} %{DATA:temp_application}: %{DATA:temp_log_level}\\s+%{DATA:temp_logger_name} - %{GREEDYDATA:temp_message}",
                     "\\tat %{GREEDYDATA:java_class}\\.%{GREEDYDATA:java_method}\\(%{DATA:source_info}\\)\\s+%{GREEDYDATA}"
        ]
      }
      overwrite => ["temp_timestamp", "temp_pid","timezone", "temp_data1", "temp_data2", "temp_application", "csv_data", "temp_thread_name", "temp_log_level", "temp_logger_name", "temp_message", "java_class", "java_method" , "source_info", "user_application", "user_name"]
      on_error => "rawdata_grok_failure"
    }
    if ![rawdata_grok_failure] {
      if [temp_message] != "" {
        grok {
          match => {
            "temp_message" => [
              "Request received: %{WORD:temp_http_method} for %{URIPATH:temp_http_uri}",
              "Request completed: %{URIPATH:temp_http_uri} with status %{INT:temp_http_status}",
              "user \\{(?P<temp_user>[^@]+)@(?P<temp_domain>[^}]+)\\} was logged on to %{DATA:temp_site_id} as %{GREEDYDATA:temp_role}\.",
              "WebClient API: Calling %{WORD:temp_api_call}"
              ]
          }
          overwrite => ["temp_http_method", "temp_http_uri", "temp_http_status", "temp_user", "temp_domain", "temp_site_id", "temp_role", "temp_api_call"]
          on_error => "temp_message_grok_failure"
          }
          if ![temp_message_grok_failure] {
            if [temp_http_method] != "" {
              mutate {
                replace => {
                  "network.http.method" => "%{temp_http_method}"
                  "has_network" => "true"
                }
                on_error => "temp_http_method_not_mapped"
              }
            }
            if [temp_http_uri] != "" {
              mutate {
                replace => {
                  "target.url" => "%{temp_http_uri}"
                }
                on_error => "temp_http_uri_not_mapped"
              }
            }
            if [temp_http_status] != "" {
              mutate {
                convert => {
                  "temp_http_status" => "integer"
                }
                on_error => "temp_http_status_not_integer"
              }
              if ![temp_http_status_not_integer] {
                mutate {
                  rename => {
                    "temp_http_status" => "network.http.response_code"
                  }
                  on_error => "temp_http_status_not_mapped"
                }
              }
            }
            if [temp_domain] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.principal.administrative_domain" => "%{temp_domain}"
                }
                on_error => "temp_domain_not_mapped"
              }
            }
            if [temp_site_id] != "" {
              mutate {
                replace => {
                  "target.resource.name" => "%{temp_site_id}"
                  "has_user" => "true"
                }
                on_error => "temp_site_id_not_mapped"
              }
            }
            if [temp_role] != "" {
              mutate {
                replace => {
                  "roles.name" => "%{temp_role}"
                  "roles.type" => "ADMINISTRATOR"
                }
                on_error => "temp_role_not_mapped"
              }
              if ![temp_role_not_mapped] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.principal.user.attribute.roles" => "roles"
                  }
                  on_error => "temp_role_merge_failed"
                }
              }
            }
            if [temp_message] != "" {
              mutate {
                replace => {
                  "metadata.description" => "%{temp_message}"
                }
                on_error => "temp_message_not_mapped"
              }
            }
            if [temp_api_call] != "" {
              mutate {
                replace => {
                  "target.url" => "%{temp_api_call}"
                }
                on_error => "temp_api_call_not_mapped"
              }
            }
          }
          else {
            if [temp_message] != "" {
              mutate {
                replace => {
                  "metadata.description" => "%{temp_message}"
                }
                on_error => "temp_message_not_mapped"
              }
            }
          }
        }
      } else {
          mutate {
            replace => {
              "metadata.description" => "%{RawData}"
            }
            on_error => "rawdata_not_mapped"
          }
        }
      }
      if [java_class] != "" {
        mutate {
          replace => {
            "target.resource.type" => "%{java_class}"
          }
          on_error => "java_class_not_mapped"
        }
      }
      if [java_method] != "" {
        mutate {
          replace => {
            "target.resource.name" => "%{java_method}"
          }
          on_error => "java_method_not_mapped"
        }
      }
      if [source_info] != "" {
        mutate {
          replace => {
            "source_info_label.key" => "source_info"
            "source_info_label.value.string_value" => "%{source_info}"
          }
          on_error => "source_info_label_not_mapped"
        }
        if ![source_info_label_not_mapped] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "source_info_label"
            }
            on_error => "source_info_label_merge_error"
          }
        }
      }
      if [user_name] not in ["", "-"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
          }
          on_error => "user_name_not_mapped"
        }
      } else if [temp_user] not in ["", "-"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{temp_user}"
          }
          on_error => "temp_user_not_mapped"
        }
      }
      if [user_application] not in ["", "-"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.application" => "%{user_application}"
          }
          on_error => "user_application_not_mapped"
        }
      } else if [temp_logger_name] not in ["", "-"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.application" => "%{temp_logger_name}"
          }
          on_error => "temp_logger_name_not_mapped"
        }
      }
      if [temp_pid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.process.pid" => "%{temp_pid}"
          }
          on_error => "temp_pid_not_mapped"
        }
      }
      if [temp_thread_name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.process.file.full_path" => "%{temp_thread_name}"
          }
          on_error => "temp_thread_name_not_mapped"
        }
      }
      if [temp_log_level] != "" {
        if [temp_log_level] == "INFO" {
          mutate {
            replace => {
              "security_result.severity" => "INFORMATIONAL"
            }
            on_error => "info_not_mapped"
          }
        } else if [temp_log_level] == "WARN" {
          mutate {
            replace => {
              "security_result.severity" => "LOW"
            }
            on_error => "warn_not_mapped"
          }
        } else if [temp_log_level] == "ERROR" {
          mutate {
            replace => {
              "security_result.severity" => "HIGH"
            }
            on_error => "error_not_mapped"
          }
        } else {
          mutate {
            replace => {
              "security_result.severity" => "UNKNOWN_SEVERITY"
            }
            on_error => "loglevel_not_found"
          }
        }
      }
  if [Computer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{Computer}"
        "principal_mid_present" => "true"
      }
    }
  }
  if [TimeGenerated] != "" {
    mutate {
      gsub => ["TimeGenerated", "_", "-"]
    }
    date {
      match => ["TimeGenerated", "yyyy-MM-ddTHH:mm:ss.SSSSSSSZ", "ISO8601", "RFC3399","RFC3339"]
      target => "security_result.first_discovered_time"
      on_error => "TimeGenerated_not_set"
    }
  }

  if [_TimeReceived] != "" {
    mutate {
      gsub => ["_TimeReceived", "_", "-"]
    }
    date {
      match => ["_TimeReceived", "yyyy-MM-ddTHH:mm:ss.SSSSSSSZ", "ISO8601","RFC3399","RFC3339"]
      target => "security_result.last_discovered_time"
      on_error => "_TimeReceived_not_set"
    }
  }

  if [_IsBillable] != "" {
    mutate {
      convert => {
        "_IsBillable" => "string"
      }
      on_error => "_IsBillable_not_a_string"
    }
    mutate {
      replace => {
        "is_billable_label.key" => "_IsBillable"
        "is_billable_label.value.string_value" => "%{_IsBillable}"
      }
      on_error => "_IsBillable_not_found"
    }
    if ![_IsBillable_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "is_billable_label"
        }
        on_error => "_IsBillable_merge_error"
      }
    }
  }

  if [_BilledSize] != "" {
    mutate {
      convert => {
        "_BilledSize" => "string"
      }
      on_error => "_BilledSize_not_a_string"
    }
    mutate {
      replace => {
        "billed_size_label.key" => "_BilledSize"
        "billed_size_label.value.string_value" => "%{_BilledSize}"
      }
      on_error => "_BilledSize_not_found"
    }
    if ![_BilledSize_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "billed_size_label"
        }
        on_error => "_BilledSize_merge_error"
      }
    }
  }

  if [_Internal_WorkspaceResourceId] != "" {
    mutate {
      replace => {
        "internal_workspace_resource_id_label.key" => "_Internal_WorkspaceResourceId"
        "internal_workspace_resource_id_label.value.string_value" => "%{_Internal_WorkspaceResourceId}"
      }
      on_error => "_Internal_WorkspaceResourceId_not_found"
    }
    if ![_Internal_WorkspaceResourceId_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "internal_workspace_resource_id_label"
        }
        on_error => "_Internal_WorkspaceResourceId_merge_error"
      }
    }
  }
  if [_ItemId] != "" {
    mutate {
      replace => {
        "item_id_label.key" => "_ItemId"
        "item_id_label.value.string_value" => "%{_ItemId}"
      }
      on_error => "item_id_not_set"
    }
    if ![item_id_not_set] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "item_id_label"
        }
        on_error => "item_id_label_merge_error"
      }
    }
  }
   if [TenantId] != "" {
    mutate {
      replace => {
        "tenant_id_label.key" => "TenantId"
        "tenant_id_label.value.string_value" => "%{TenantId}"
      }
      on_error => "tenant_id_label_empty"
    }
    if ![tenant_id_label_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tenant_id_label"
        }
        on_error => "tenant_id_label_merge_failed"
      }
    }
  }
  if [_SubscriptionId] != "" {
    mutate {
      replace => {
        "_SubscriptionId_label.key" => "_SubscriptionId"
        "_SubscriptionId_label.value.string_value" => "%{_SubscriptionId}"
      }
      on_error => "no_subscription_id_mapped"
    }
    if ![no_subscription_id_mapped] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "_SubscriptionId_label"
        }
        on_error => "no_subscription_id_merged"
      }
    }
  }
  if [_ResourceId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.id" => "%{_ResourceId}"
      }
      on_error => "resource_id_not_set"
    }
  }

  if [FilePath] != "" {
    mutate {
      replace => {
        "file_path_label.key" => "FilePath"
        "file_path_label.value.string_value" => "%{FilePath}"
      }
      on_error => "file_path_not_set"
    }
    if ![file_path_not_set] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "file_path_label"
        }
        on_error => "file_path_label_merge_error"
      }
    }
  }

  if [Type] != "" {
    mutate {
      replace => {
        "type_label.key" => "Type"
        "type_label.value.string_value" => "%{Type}"
      }
      on_error => "type_not_set"
    }
    if ![type_not_set] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type_label"
        }
        on_error => "type_label_merge_error"
      }
    }
  }

# metadata info
  mutate {
    replace => {
      "metadata.vendor_name" => "TABLEAU"
      "metadata.product_name" => "Tableau"
    }
  }

  if [ID] !~ /(_|\|)/ {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_user] == "true" and [has_network] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [principal_mid_present] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  } else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [network_received_bytes] != "" {
    mutate {
      replace => {
        "network.received_bytes" => "%{network_received_bytes}"
      }
      on_error => "network_received_bytes_empty"
    }
    mutate {
      convert => {
        "network.received_bytes" => "uinteger"
      }
      on_error => "network_received_bytes_conversion_failure"
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_invalid"
    }
  }
  mutate {
    merge => {
     "@output" => "event"
    }
  }
}

