# Product: SAP_SM20
# Category: Security Audit Log
# Supported Format: JSON
# Reference: https://help.sap.com/doc/saphelp_nw73ehp1/7.31.19/en-US/4d/41bcc4aa601c86e10000000a42189b/frameset.htm
# https://blogs.sap.com/2014/12/11/analysis-and-recommended-settings-of-the-security-audit-log-sm19-sm20/
# https://help.powerconnect.io/powerconnectdocumentation/sm20
# Last Updated: 2025-07-07
# Copyright 2025 Chronicle LLC

filter {
  mutate {
    replace => {
      "security_result" => ""
      "event_type" => ""
      "metadata" => ""
      "principal" => ""
      "target" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "extensions" => ""
      "additional" => ""
      "log_event.host" => ""
      "log_event.log_event.ALGTEXT" => ""
      "log_event.log_event.IPADDRESS" => ""
      "log_event.log_event.ALGLTERM" => ""
      "log_event.log_event.ALGUSER" => ""
      "log_event.fields.EVENT_TYPE" => ""
      "log_event.fields.EVENT_SUBTYPE" => ""
      "log_event.log_event.TXSEVERITY" => ""
      "log_event.log_event.ALGAREA" => ""
      "log_event.log_event.ALGCLIENT" => ""
      "log_event.log_event.ALGFILENO" => ""
      "log_event.log_event.ALGFILEPOS" => ""
      "log_event.log_event.ALGINST" => ""
      "log_event.log_event.ALGREPNA" => ""
      "log_event.log_event.ALGSYSTEM" => ""
      "log_event.log_event.ALGSUBID" => ""
      "log_event.log_event.ALGTASKNO" => ""
      "log_event.log_event.ALGTASKTYPE" => ""
      "log_event.log_event.ALGTCODE" => ""
      "log_event.log_event.TXSUBCLSID" => ""
      "log_event.log_event.UTCDIFF" => ""
      "log_event.log_event.UTCSIGN" => ""
      "log_event.source" => ""
      "log_event.sourcetype" => ""
      "log_event.log_event.INSTANCE_NAME" => ""
      "log_event.log_event.WP_PID" => ""
      "has_target_process" => "false"
      "log_event.log_event.WP_SERVER" => ""
      "intermediary" => ""
      "log_event.log_event.WP_STATUS" => ""
      "log_event.log_event.WP_TYP" => ""
      "ALGSYSTEM" => ""
      "ALGAREA" => ""
      "ALGCLIENT" => ""
      "ALGFILENO" => ""
      "ALGFILEPOS" => ""
      "ALGINST" => ""
      "ALGREPNA" => ""
      "UTCDIFF" => ""
      "ALGSUBID" => ""
      "TXSEVERITY" => ""
      "TXSUBCLSID" => ""
      "ALGUSER" => ""
      "ALGTEXT" => ""
      "ALGTASKNO" => ""
      "ALGTASKTYPE" => ""
      "ALGTCODE" => ""
      "ALGLTERM" => ""
      "WP_TYP" => ""
      "WP_PID" => ""
      "WP_SERVER" => ""
      "WP_STATUS" => ""
      "INSTANCE_NAME" => ""
    }
  }

  mutate {
    gsub => ["message",'\"event\"','\"log_event\"']
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] and [message] !~ "0035" {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [not_json] and [message] =~ "0035" {
    grok {
      match => {
        "message" => [
          "0035%{GREEDYDATA:message}"
        ]
      }
      overwrite => ["message"]
      on_error => "grok_error"
    }
    mutate {
      gsub => ['message','0035','\",\"']
    }
    mutate {
      replace => {
        "message" => "{\"records\":[\"%{message}\"]}"
      }
      on_error => "replace_error"
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json2"
    }
    for record in records {
      mutate {
        replace => {
          "event" => ""
          "date" => ""
          "sequence" => ""
          "product_log_id" => ""
          "application" => ""
          "resource_id" => ""
          "hostname" => ""
          "ip" => ""
          "session_id" => ""
          "principal" => ""
          "target" => ""
          "has_principal" => "false"
          "network" => ""
          "security_result" => ""
        }
      }
      grok {
        match => {
          "record" => [
            "(?P<date>\\d{14})(?P<sequence>\\d{8})%{DATA:product_log_id}0001%{DATA}0011%{DATA:application}%{INT}%{DATA:resource_id}0020%{DATA:hostname}0013%{IP:ip}%{DATA}\\&%{GREEDYDATA:session_id}"
          ]
        }
        overwrite => ["date","sequence","product_log_id","application","resource_id","hostname","ip","session_id"]
        on_error => "grok_error"
      }
      if [date] != "" {
        date {
          match => ["date","yyyymmddhhmmss"]
          on_error => "date_error"
        }
      }
      if [hostname] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{hostname}"
            "principal.asset.hostname" => "%{hostname}"
            "has_principal" => "true"
          }
          on_error => "hostname_error"
        }
      }
      if [ip] != "" {
        mutate {
          merge => {
            "principal.ip" => "ip"
            "principal.asset.ip" => "ip"
          }
          on_error => "ip_error"
        }
        if ![ip_error] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
            on_error => "has_principal_error"
          }
        }
      }
      if [application] != "" {
        mutate {
          replace => {
            "target.application" => "%{application}"
          }
          on_error => "application_error"
        }
      }
      if [resource_id] != "" {
        mutate {
          replace => {
            "target.resource.product_object_id" => "%{resource_id}"
          }
          on_error => "resource_id_error"
        }
      }
      if [session_id] != "" {
        mutate {
          replace => {
            "network.session_id" => "%{session_id}"
          }
          on_error => "session_id_error"
        }
      }
      if [has_principal] == "true" {
        mutate {
          replace => {
            "metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
      else {
        mutate {
          replace => {
            "metadata.event_type" => "GENERIC_EVENT"
          }
        }
      }
      if [principal] != "" {
        mutate {
          rename => {
            "principal" => "event.idm.read_only_udm.principal"
          }
        }
      }
      if [target] != "" {
        mutate {
          rename => {
            "target" => "event.idm.read_only_udm.target"
          }
        }
      }
      if [metadata] != "" {
        mutate {
          rename => {
            "metadata" => "event.idm.read_only_udm.metadata"
          }
        }
      }
      if [network] != "" {
        mutate {
          rename => {
            "network" => "event.idm.read_only_udm.network"
          }
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
  else {
    if [WP_TYP] != "" {
      mutate {
        replace => {
          "wp_type1.key" => "WP_TYP"
          "wp_type1.value.string_value" => "%{WP_TYP}"
        }
        on_error => "wp_type_error"
      }
      if ![wp_type_error] {
        mutate {
          merge => {
            "additional.fields" => "wp_type1"
          }
          on_error => "wp_type_merge_error"
        }
      }
    }
    if [WP_PID] != "" {
      mutate {
        replace => {
          "target.process.pid" => "%{WP_PID}"
          "has_target_process" => "true"
        }
        on_error => "pid_not_found"
      }
    }
    if [WP_SERVER] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{WP_SERVER}"
        }
        on_error => "server_not_found"
      }
    }
    if [WP_STATUS] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{WP_STATUS}"
        }
        on_error => "status_not_found"
      }
    }
    if [INSTANCE_NAME] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{INSTANCE_NAME}"
          "principal.asset.hostname" => "%{INSTANCE_NAME}"
          "has_principal" => "true"
        }
        on_error => "instance_error"
      }
    }

    if [ALGREPNA] != "" {
      mutate {
        replace => {
          "alg_repna1.key" => "ALGREPNA"
          "alg_repna1.value.string_value" => "%{ALGREPNA}"
        }
        on_error => "alg_repna_error"
      }
      if ![alg_repna_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_repna1"
          }
          on_error => "alg_repna_merge_error"
        }
      }
    }
    if [TXSEVERITY] =~ "(?i)Severe|critical" {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
        on_error => "severity_error"
      }
    }
    if [TXSUBCLSID] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{TXSUBCLSID}"
        }
        on_error => "sr_description_error"
      }
    }
    if [ALGSYSTEM] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{ALGSYSTEM}"
          "principal.asset.hostname" => "%{ALGSYSTEM}"
          "has_principal" => "true"
        }
        on_error => "alg_system_error"
      }
    }
    if [ALGLTERM] != "" {
      grok {
        match => {
          "ALGLTERM" => ["%{IP:ip}"]
        }
        overwrite => ["ip"]
        on_error => "not_ip"
      }
      if ![not_ip] {
        mutate {
          merge => {
            "target.ip" => "ip"
            "target.asset.ip" => "ip"
          }
          replace => {
            "has_target" => "true"
          }
          on_error => "no_ip_found"
        }
      }
      else {
        mutate {
          replace => {
            "target.hostname" => "%{ALGLTERM}"
            "target.asset.hostname" => "%{ALGLTERM}"
            "has_target" => "true"
          }
          on_error => "target_host_not_found"
        }
      }
    }
    if [ALGAREA] != "" {
      mutate {
        replace => {
          "alg_area1.key" => "ALGAREA"
          "alg_area1.value.string_value" => "%{ALGAREA}"
        }
        on_error => "alg_area_error"
      }
      if ![alg_area_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_area1"
          }
          on_error => "alg_area_merge_error"
        }
      }
    }
    if [ALGCLIENT] != "" {
      mutate {
        replace => {
          "alg_client1.key" => "ALGCLIENT"
          "alg_client1.value" => "%{ALGCLIENT}"
        }
        on_error => "alg_client_error"
      }
      if ![alg_client_error] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "alg_client1"
          }
          on_error => "alg_client_merge_error"
        }
      }
    }
    if [ALGFILENO] != "" {
      mutate {
        replace => {
          "alg_fileno1.key" => "ALGFILENO"
          "alg_fileno1.value.string_value" => "%{ALGFILENO}"
        }
        on_error => "alg_fileno_error"
      }
      if ![alg_fileno_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_fileno1"
          }
          on_error => "alg_fileno_merge_error"
        }
      }
    }

    if [ALGFILEPOS] != "" {
      mutate {
        replace => {
          "alg_filepos1.key" => "ALGFILEPOS"
          "alg_filepos1.value.string_value" => "%{ALGFILEPOS}"
        }
        on_error => "alg_filepos_error"
      }
      if ![alg_filepos_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_filepos1"
          }
          on_error => "alg_filepos_merge_error"
        }
      }
    }
    if [ALGINST] != "" {
      mutate {
        replace => {
          "alg_inst1.key" => "ALGINST"
          "alg_inst1.value" => "%{ALGINST}"
        }
        on_error => "alg_inst_error"
      }
      if ![alg_inst_error] {
        mutate {
          merge => {
            "target.resource.attribute.labels" => "alg_inst1"
          }
          on_error => "alg_inst_merge_error"
        }
      }
    }
    if [ALGSUBID] != "" {
      mutate {
        replace => {
          "alg_subid1.key" => "ALGSUBID"
          "alg_subid1.value.string_value" => "%{ALGSUBID}"
        }
        on_error => "alg_subid_error"
      }
      if ![alg_subid_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_subid1"
          }
          on_error => "alg_subid_merge_error"
        }
      }
    }
    if [UTCDIFF] != "" {
      mutate {
        replace => {
          "utc_diff1.key" => "UTCDIFF"
          "utc_diff1.value.string_value" => "%{UTCDIFF}"
        }
        on_error => "utc_diff_error"
      }
      if ![utc_diff_error] {
        mutate {
          merge => {
            "additional.fields" => "utc_diff1"
          }
          on_error => "utc_diff_merge_error"
        }
      }
    }
    if [ALGUSER] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{ALGUSER}"
          "has_target" => "true"
        }
        on_error => "userid_error"
      }
    }
    if [ALGTEXT] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{ALGTEXT}"
        }
        on_error => "description_error"
      }
    }
    if [ALGTASKNO] != "" {
      mutate {
        replace => {
          "alg_taskno1.key" => "ALGTASKNO"
          "alg_taskno1.value.string_value" => "%{ALGTASKNO}"
        }
        on_error => "alg_taskno_error"
      }
      if ![alg_taskno_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_taskno1"
          }
          on_error => "alg_taskno_merge_error"
        }
      }
    }

    if [ALGTASKTYPE] != "" {
      mutate {
        replace => {
          "alg_tasktype1.key" => "ALGTASKTYPE"
          "alg_tasktype1.value.string_value" => "%{ALGTASKTYPE}"
        }
        on_error => "alg_tasktype_error"
      }
      if ![alg_tasktype_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_tasktype1"
          }
          on_error => "alg_tasktype_merge_error"
        }
      }
    }
    if [ALGTCODE] != "" {
      mutate {
        replace => {
          "alg_tcode1.key" => "ALGTCODE"
          "alg_tcode1.value.string_value" => "%{ALGTCODE}"
        }
        on_error => "alg_tcode_error"
      }
      if ![alg_tcode_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_tcode1"
          }
          on_error => "alg_tcode_merge_error"
        }
      }
    }

    if [log_event][host] != "" {
      mutate {
        replace => {
          "principal.hostname" => "%{log_event.host}"
          "principal.asset.hostname" => "%{log_event.host}"
          "has_principal" => "true"
        }
        on_error => "hostname_error"
      }
    }

    if [log_event][log_event][ALGTEXT] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{log_event.log_event.ALGTEXT}"
        }
        on_error => "description_error"
      }
    }

    if [log_event][fields][EVENT_TYPE] != "" {
      mutate {
        replace => {
          "metadata.product_event_type" => "%{log_event.fields.EVENT_TYPE}"
        }
        on_error => "event_type_error"
      }
    }

    if [log_event][fields][EVENT_SUBTYPE] != "" {
      mutate {
        replace => {
          "event_subtype.key" => "EVENT_SUBTYPE"
          "event_subtype.value.string_value" => "%{log_event.fields.EVENT_SUBTYPE}"
        }
        on_error => "event_subtype_error"
      }
      if ![event_subtype_error] {
        mutate {
          merge => {
            "additional.fields" => "event_subtype"
          }
          on_error => "event_subtype_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGAREA] != "" {
      mutate {
        replace => {
          "alg_area.key" => "ALGAREA"
          "alg_area.value.string_value" => "%{log_event.log_event.ALGAREA}"
        }
        on_error => "alg_area_error"
      }
      if ![alg_area_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_area"
          }
          on_error => "alg_area_merge_error"
        }
      }
    }

    if [log_event][source] != "" {
      mutate {
        replace => {
          "source.key" => "Source"
          "source.value" => "%{log_event.source}"
        }
        on_error => "source_error"
      }
      if ![source_error] {
        mutate {
          merge => {
            "principal.labels" => "source"
          }
          on_error => "source_merge_error"
        }
      }
    }

    if [log_event][sourcetype] != "" {
      mutate {
        replace => {
          "source_type.key" => "Source Type"
          "source_type.value" => "%{log_event.sourcetype}"
        }
        on_error => "sourcetype_error"
      }
      if ![sourcetype_error] {
        mutate {
          merge => {
            "principal.labels" => "source_type"
          }
          on_error => "sourcetype_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGCLIENT] != "" {
      mutate {
        replace => {
          "alg_client.key" => "ALGCLIENT"
          "alg_client.value" => "%{log_event.log_event.ALGCLIENT}"
        }
        on_error => "alg_client_error"
      }
      if ![alg_client_error] {
        mutate {
          merge => {
            "target.labels" => "alg_client"
          }
          on_error => "alg_client_merge_error"
        }
      }
    }

    if [log_event][log_event][INSTANCE_NAME] != "" {
      mutate {
        replace => {
          "target.hostname" => "%{log_event.log_event.INSTANCE_NAME}"
          "target.asset.hostname" => "%{log_event.log_event.INSTANCE_NAME}"
          "has_target" => "true"
        }
        on_error => "instance_error"
      }
    }

    if [log_event][log_event][WP_PID] != "" {
      mutate {
        replace => {
          "target.process.pid" => "%{log_event.log_event.WP_PID}"
          "has_target_process" => "true"
        }
        on_error => "pid_not_found"
      }
    }
    if [log_event][log_event][WP_SERVER] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{log_event.log_event.WP_SERVER}"
        }
        on_error => "server_not_found"
      }
    }
    if [log_event][log_event][WP_STATUS] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{log_event.log_event.WP_STATUS}"
        }
        on_error => "status_not_found"
      }
    }

    if [log_event][log_event][ALGINST] != "" {
      mutate {
        replace => {
          "alg_inst.key" => "ALGINST"
          "alg_inst.value" => "%{log_event.log_event.ALGINST}"
        }
        on_error => "alg_inst_error"
      }
      if ![alg_inst_error] {
        mutate {
          merge => {
            "target.labels" => "alg_inst"
          }
          on_error => "alg_inst_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGFILENO] != "" {
      mutate {
        replace => {
          "alg_fileno.key" => "ALGFILENO"
          "alg_fileno.value.string_value" => "%{log_event.log_event.ALGFILENO}"
        }
        on_error => "alg_fileno_error"
      }
      if ![alg_fileno_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_fileno"
          }
          on_error => "alg_fileno_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGFILEPOS] != "" {
      mutate {
        replace => {
          "alg_filepos.key" => "ALGFILEPOS"
          "alg_filepos.value.string_value" => "%{log_event.log_event.ALGFILEPOS}"
        }
        on_error => "alg_filepos_error"
      }
      if ![alg_filepos_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_filepos"
          }
          on_error => "alg_filepos_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGREPNA] != "" {
      mutate {
        replace => {
          "alg_repna.key" => "ALGREPNA"
          "alg_repna.value.string_value" => "%{log_event.log_event.ALGREPNA}"
        }
        on_error => "alg_repna_error"
      }
      if ![alg_repna_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_repna"
          }
          on_error => "alg_repna_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGSUBID] != "" {
      mutate {
        replace => {
          "alg_subid.key" => "ALGSUBID"
          "alg_subid.value.string_value" => "%{log_event.log_event.ALGSUBID}"
        }
        on_error => "alg_subid_error"
      }
      if ![alg_subid_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_subid"
          }
          on_error => "alg_subid_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGSYSTEM] != "" {
      mutate {
        replace => {
          "alg_system.key" => "ALGSYSTEM"
          "alg_system.value.string_value" => "%{log_event.log_event.ALGSYSTEM}"
        }
        on_error => "alg_system_error"
      }
      if ![alg_system_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_system"
          }
          on_error => "alg_system_merge_error"
        }
      }
    }

    if [log_event][log_event][UTCDIFF] != "" {
      mutate {
        replace => {
          "utc_diff.key" => "UTCDIFF"
          "utc_diff.value.string_value" => "%{log_event.log_event.UTCDIFF}"
        }
        on_error => "utc_diff_error"
      }
      if ![utc_diff_error] {
        mutate {
          merge => {
            "additional.fields" => "utc_diff"
          }
          on_error => "utc_diff_merge_error"
        }
      }
    }

    if [log_event][log_event][UTCSIGN] not in ["","-"] {
      mutate {
        replace => {
          "utc_sign.key" => "UTCSIGN"
          "utc_sign.value.string_value" => "%{log_event.log_event.UTCSIGN}"
        }
        on_error => "utc_sign_error"
      }
      if ![utc_sign_error] {
        mutate {
          merge => {
            "additional.fields" => "utc_sign"
          }
          on_error => "utc_sign_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGTASKNO] != "" {
      mutate {
        replace => {
          "alg_taskno.key" => "ALGTASKNO"
          "alg_taskno.value.string_value" => "%{log_event.log_event.ALGTASKNO}"
        }
        on_error => "alg_taskno_error"
      }
      if ![alg_taskno_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_taskno"
          }
          on_error => "alg_taskno_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGTASKTYPE] != "" {
      mutate {
        replace => {
          "alg_tasktype.key" => "ALGTASKTYPE"
          "alg_tasktype.value.string_value" => "%{log_event.log_event.ALGTASKTYPE}"
        }
        on_error => "alg_tasktype_error"
      }
      if ![alg_tasktype_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_tasktype"
          }
          on_error => "alg_tasktype_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGTCODE] != "" {
      mutate {
        replace => {
          "alg_tcode.key" => "ALGTCODE"
          "alg_tcode.value.string_value" => "%{log_event.log_event.ALGTCODE}"
        }
        on_error => "alg_tcode_error"
      }
      if ![alg_tcode_error] {
        mutate {
          merge => {
            "additional.fields" => "alg_tcode"
          }
          on_error => "alg_tcode_merge_error"
        }
      }
    }
    if [log_event][log_event][WP_TYP] != "" {
      mutate {
        replace => {
          "wp_type.key" => "WP_TYP"
          "wp_type.value.string_value" => "%{log_event.log_event.WP_TYP}"
        }
        on_error => "wp_type_error"
      }
      if ![wp_type_error] {
        mutate {
          merge => {
            "additional.fields" => "wp_type"
          }
          on_error => "wp_type_merge_error"
        }
      }
    }

    if [log_event][log_event][ALGUSER] != "" {
      mutate {
        replace => {
          "target.user.userid" => "%{log_event.log_event.ALGUSER}"
          "has_target" => "true"
        }
        on_error => "userid_error"
      }
    }

    if [log_event][log_event][TXSEVERITY] =~ "(?i)Severe|critical" {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
        on_error => "severity_error"
      }
    }

    if [log_event][log_event][TXSUBCLSID] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{log_event.log_event.TXSUBCLSID}"
        }
        on_error => "sr_description_error"
      }
    }

    if [log_event][log_event][IPADDRESS] != "" {
      grok {
        match => {
          "log_event.log_event.IPADDRESS" => ["%{IP:ip}"]
        }
        overwrite => ["ip"]
        on_error => "not_an_ip"
      }
      if ![not_an_ip] {
        mutate {
          merge => {
            "target.ip" => "ip"
            "target.asset.ip" => "ip"
          }
          replace => {
            "has_target" => "true"
          }
          on_error => "no_ip_found"
        }
      }
    }
    if [log_event][log_event][ALGLTERM] != "" {
      grok {
        match => {
          "log_event.log_event.ALGLTERM" => ["%{IP:ip}"]
        }
        overwrite => ["ip"]
        on_error => "not_ip"
      }
      if ![not_ip] {
        mutate {
          merge => {
            "target.ip" => "ip"
            "target.asset.ip" => "ip"
          }
          replace => {
            "has_target" => "true"
          }
          on_error => "no_ip_found"
        }
      }
      else {
        mutate {
          replace => {
            "target.hostname" => "%{log_event.log_event.ALGLTERM}"
            "target.asset.hostname" => "%{log_event.log_event.ALGLTERM}"
            "has_target" => "true"
          }
          on_error => "target_host_not_found"
        }
      }
    }

    mutate {
      replace => {
        "metadata.product_name" => "SAP_SM20"
        "metadata.vendor_name" => "SAP_SM20"
      }
    }

    if [log_event][log_event][ALGTEXT] =~ "(?i)logon successful" or [ALGTEXT] =~ "(?i)logon successful" and [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_LOGIN"
          "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
    else if [has_principal] == "true" and [has_target_process] == "true" {
      mutate {
        replace => {
          "event_type" => "PROCESS_LAUNCH"
        }
      }
    }
    else if [has_principal] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }

    if [event_type] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "%{event_type}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "GENERIC_EVENT"
        }
      }
    }

    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }

    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
      }
    }

    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }

    if [extensions] != "" {
      mutate {
        rename => {
          "extensions" => "event.idm.read_only_udm.extensions"
        }
      }
    }
    if [intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
        on_error => "intermediary_merge_error"
      }
    }

    if [additional] != "" {
      mutate {
        rename => {
          "additional" => "event.idm.read_only_udm.additional"
        }
      }
    }

    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "sec_result_error"
      }
    }

    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
