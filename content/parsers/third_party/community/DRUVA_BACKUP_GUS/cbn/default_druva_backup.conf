# Product: Druva_backup
# Category: Security
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-12-05
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "clientVersion" => ""
      "clientOS" => ""
      "eventID" => ""
      "profileName" => ""
      "profileID" => ""
      "initiator" => ""
      "eventState" => ""
      "inSyncUserEmail" => ""
      "inSyncUserName" => ""
      "inSyncUserID" => ""
      "inSyncDataSourceName" => ""
      "FilesBackedup" => ""
      "FilesMissed" => ""
      "TotalBackupSize" => ""
      "TotalBytesTransferred" => ""
      "facility" => ""
      "inSyncDataSourceID" => ""
      "event_type" => ""
      "eventDetails" => ""
      "ip" => ""
      "eventsGroupId" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "additional" => ""
      "security_result" => ""
      "has_target_user" => "false"
      "has_principal" => "false"
      "has_target" => "false"
    }
  }

  mutate {
    gsub => ["message", "\\r\\n\\s+", ""]
  }
  mutate {
    gsub => ["message", "\\r\\n", ""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [eventDetails] != "" {
    mutate {
      gsub => ["eventDetails", ", ", ","]
    }
    mutate {
      gsub => ["eventDetails", ",([a-zA-Z_]+):",",$1:"]
    }
    mutate {
      gsub => ["eventDetails", "([a-zA-Z_]+) ([a-zA-Z_]+) ([a-zA-Z_]+):","$1$2$3:"]
    }
    mutate {
      gsub => ["eventDetails", "([a-zA-Z_]+) ([a-zA-Z_]+):","$1$2:"]
    }
    kv {
      source => "eventDetails"
      field_split => ","
      value_split => ": "
      on_error => "eventDetails_failure"
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "DRUVA_BACKUP"
      "metadata.product_name" => "DRUVA_BACKUP"
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "yyyy-MM-ddTHH:mm:ssZ", "ISO8601"]
      on_error => "invalid_format"
    }
  }

  if [ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "ip"
        "principal.asset.ip" => "ip"
      }
      on_error => "ip_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }

  if [inSyncDataSourceName] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{inSyncDataSourceName}"
        "principal.asset.hostname" => "%{inSyncDataSourceName}"
        "has_principal" => "true"
      }
      on_error => "inSyncDataSourceName_empty"
    }
  }

  if [eventID] != "" {
    mutate {
      convert => {
        "eventID" => "string"
      }
      on_error => "already_string"
    }
    mutate {
      replace => {
        "metadata.product_log_id" => "%{eventID}"
      }
      on_error => "eventID_empty"
    }
  }

  if [clientVersion] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{clientVersion}"
      }
      on_error => "clientVersion_empty"
    }
  }

  if [clientOS] =~ "(?i)Linux" {
    mutate {
      replace => {
        "principal.platform" => "LINUX"
      }
    }
  }
  else if [clientOS] =~ "(?i)windows" {
    mutate {
      replace => {
        "principal.platform" => "WINDOWS"
      }
    }
  }
  else if [clientOS] =~ "(?i)mac|ios" {
    mutate {
      replace => {
        "principal.platform" => "MAC"
      }
    }
  }
  if [inSyncUserName] != "" {
    mutate {
      convert => {
        "inSyncUserName" => "string"
      }
      on_error => "inSyncUserName_already_string"
    }
    mutate {
      replace => {
        "target.user.userid" => "%{inSyncUserName}"
      }
      on_error => "inSyncUserName_empty"
    }
  }
  mutate {
    convert => {
      "inSyncUserID" => "string"
    }
    on_error => "inSyncUserID_already_string"
  }
  if [inSyncUserID] != "" {
    mutate {
      replace => {
        "inSyncUserID_label.value.string_value" => "%{inSyncUserID}"
      }
      on_error => "inSyncUserID_empty"
    }
    if ![inSyncUserID_empty] {
      mutate {
        replace => {
          "inSyncUserID_label.key" => "inSyncUserID"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "inSyncUserID_label"
        }
        on_error => "inSyncUserID_label_empty"
      }
    }
  }
  if [inSyncUserEmail] != "" {
    mutate {
      merge => {
        "target.user.email_addresses" => "inSyncUserEmail"
      }
      on_error => "inSyncUserEmail_empty"
    }
  }

  if [profileName] != "" {
    mutate {
      replace => {
        "principal.resource.name" => "%{profileName}"
      }
      on_error => "profileName_empty"
    }
  }

  if [profileID] != "" {
    mutate {
      convert => {
        "profileID" => "string"
      }
      on_error => "profileID_already_string"
    }
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{profileID}"
      }
      on_error => "profileID_invalid"
    }
  }

  mutate {
    convert => {
      "severity" => "string"
    }
    on_error => "severity_already_string"
  }

  if [severity] in ["0", "1", "2", "3", "LOW"] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] in ["4", "5", "6", "MEDIUM", "SUBSTANTIAL", "INFO"] {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] in ["7", "8", "HIGH", "SEVERE"] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] in ["9", "10", "VERY-HIGH", "CRITICAL"] {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }

  if [eventState] != "" {
    if [eventState] =~ "(?i)Success" {
      mutate {
        replace => {
          "security_result_action" => "ALLOW"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result_action" => "BLOCK"
        }
      }
    }

    mutate {
      replace => {
        "security_result.action_details" => "%{eventState}"
      }
      on_error => "eventState_empty"
    }

    if [security_result_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_result_action"
        }
        on_error => "security_result_action_empty"
      }
    }
  }

  if [eventsGroupId] != "" {
    mutate {
      replace => {
        "eventsGroupId_label.value.string_value" => "%{eventsGroupId}"
      }
      on_error => "eventsGroupId_empty"
    }
    if ![eventsGroupId_empty] {
      mutate {
        replace => {
          "eventsGroupId_label.key" => "eventsGroupId"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "eventsGroupId_label"
        }
        on_error => "eventsGroupId_label_empty"
      }
    }
  }

  if [FilesMissed] != "" {
    mutate {
      replace => {
        "FilesMissed_label.value.string_value" => "%{FilesMissed}"
      }
      on_error => "FilesMissed_empty"
    }
    if ![FilesMissed_empty] {
      mutate {
        replace => {
          "FilesMissed_label.key" => "FilesMissed"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "FilesMissed_label"
        }
        on_error => "FilesMissed_label_empty"
      }
    }
  }

  if [FilesBackedup] != "" {
    mutate {
      replace => {
        "FilesBackedup_label.value.string_value" => "%{FilesBackedup}"
      }
      on_error => "FilesBackedup_empty"
    }
    if ![FilesBackedup_empty] {
      mutate {
        replace => {
          "FilesBackedup_label.key" => "FilesBackedup"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "FilesBackedup_label"
        }
        on_error => "FilesBackedup_label_empty"
      }
    }
  }

  if [TotalBackupSize] != "" {
    mutate {
      replace => {
        "TotalBackupSize_label.value.string_value" => "%{TotalBackupSize}"
      }
      on_error => "TotalBackupSize_empty"
    }
    if ![TotalBackupSize_empty] {
      mutate {
        replace => {
          "TotalBackupSize_label.key" => "TotalBackupSize"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "TotalBackupSize_label"
        }
        on_error => "TotalBackupSize_label_empty"
      }
    }
  }

  if [TotalBytesTransferred] != "" {
    mutate {
      replace => {
        "TotalBytesTransferred_label.value.string_value" => "%{TotalBytesTransferred}"
      }
      on_error => "TotalBytesTransferred_empty"
    }
    if ![TotalBytesTransferred_empty] {
      mutate {
        replace => {
          "TotalBytesTransferred_label.key" => "TotalBytesTransferred"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "TotalBytesTransferred_label"
        }
        on_error => "TotalBytesTransferred_label_empty"
      }
    }
  }

  mutate {
    convert => {
      "facility" => "string"
    }
    on_error => "facility_already_string"
  }
  if [facility] != "" {
    mutate {
      replace => {
        "facility_label.value.string_value" => "%{facility}"
      }
      on_error => "facility_empty"
    }
    if ![facility_empty] {
      mutate {
        replace => {
          "facility_label.key" => "facility"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "facility_label"
        }
        on_error => "facility_label_empty"
      }
    }
  }

  mutate {
    convert => {
      "inSyncDataSourceID" => "string"
    }
    on_error => "inSyncDataSourceID_already_string"
  }

  if [inSyncDataSourceID] != "" {
    mutate {
      replace => {
        "inSyncDataSourceID_label.value.string_value" => "%{inSyncDataSourceID}"
      }
      on_error => "inSyncDataSourceID_empty"
    }
    if ![inSyncDataSourceID_empty] {
      mutate {
        replace => {
          "inSyncDataSourceID_label.key" => "inSyncDataSourceID"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "inSyncDataSourceID_label"
        }
        on_error => "inSyncDataSourceID_label_empty"
      }
    }
  }

  if [initiator] != "" {
    mutate {
      replace => {
        "initiator_label.value.string_value" => "%{initiator}"
      }
      on_error => "initiator_empty"
    }
    if ![initiator_empty] {
      mutate {
        replace => {
          "initiator_label.key" => "initiator"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "initiator_label"
        }
        on_error => "initiator_label_empty"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event_type_label.value.string_value" => "%{event_type}"
      }
      on_error => "event_type_empty"
    }
    if ![event_type_empty] {
      mutate {
        replace => {
          "event_type_label.key" => "event_type"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "event_type_label"
        }
        on_error => "event_type_label_empty"
      }
    }
  }

  if [initiator] != "" && [initiator] =~ "^.+@.+$" {
    mutate {
      merge => {
        "target.user.email_addresses" => "initiator"
      }
      on_error => "src_email_invalid"
    }
    mutate {
      replace => {
        "has_target_user" => "true"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }

  if [has_target_user] == "true" and [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  # Generate output
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
