filter {
    # initalize values
  mutate {
    replace => {
      "user_email" => ""
      "fromEmail" => ""
      "Subject" => ""
      "InternetMessageId" => ""
      "sender_ip" => "0.0.0.0"
      "is_quarantined" => ""
      "in_s3_quarantine" => ""
      "is_restored_from_quarantine" => ""
      "is_in_inbox" => ""
      "is_inline_released" => ""
      "got_phishing_response" => ""
      "security_events" => ""
      "incoming" => ""
      "outgoing" => ""
      "user_id" => ""
      "Size" => ""
      "Body_ContentType" => ""
      "aggregation_id" => ""
      "entity_source" => ""
      "av_mail_hash" => ""
      "recipients_hash" => ""
      "From" => ""
      "Sender" => ""
      "entity_type" => ""
      "InternetMessageIdHash" => ""
      "description" => ""
      "severity" => ""
      "entity_link" => ""
      "sec_event_id" => ""
      "matched_security_tool" => ""
      "current_state" => ""
      "policy_rule_id" => ""
      "recipient_emails" => ""
      "recipients" => ""
      "customer_domain" => ""
      "transaction_id" => ""
      "av_file_hash_sha256" => ""
      "av_file_hash_md5" => ""
      "av_file_hash_sha1" => ""
      "av_file_mime" => ""
      "id" => ""
      "Category_1" => ""
      "Action_1" => ""
      "vendor_name" => ""
      "sec_res_action" => ""
      "network_email_reply_to" => ""
      "target_user_email_addresses" => ""
      "network_email_from" => ""
      "sec_res_rule_id" => ""
    }
  }

  # Pull data out of json message body
  mutate {
    gsub => ["message" , "\\r\\n" , ""]
  }
  mutate {
    gsub => ["message" , "\\n" , ""]
  }
  mutate {
    gsub => ["message" , '\"entity\"' , '\"entityValue\"']
  }
  mutate {
    gsub => ["message", '\"event\"' , '\"event_Value\"']
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_failure"
  }
  mutate {
    overwrite => ["user_email","fromEmail","Subject","InternetMessageId","sender_ip","is_quarantined","in_s3_quarantine","is_restored_from_quarantine","is_in_inbox","is_inline_released","got_phishing_response","security_events","incoming","outgoing"]
  }

  for index,eventValue in events {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_conversion_error"
    }
    date {
      match => ["eventValue.metadata.event_timestamp", "yyyy-MM-ddTHH:mm:ss.SSSSSS+00:00", "RFC3339", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "format_not_match"
    }
    mutate {
      replace => {
        "event_type_label.value.string_value" => "%{eventValue.metadata.event_type}"
      }
      on_error => "event_type_label_error"
    }
    if ![event_type_label_error] {
      mutate {
        replace => {
          "event_type_label.key" => "event_type"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_type_label"
        }
        on_error => "event_type_label_merge_error"
      }
    }
    mutate {
      replace => {
        "metadata_product_name" => "%{eventValue.metadata.product_name}"
      }
      on_error => "product_name_error"
    }
    if ![product_name_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_name" => "%{metadata_product_name}"
        }
        on_error => "product_name_not_valid"
      }
    }
    mutate {
      replace => {
        "vendor_name" => "%{eventValue.metadata.vendor_name}"
      }
      on_error => "vendor_name_not_exists"
    }
    if ![vendor_name_not_exists] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor_name}"
        }
        on_error => "vendor_name_not_valid"
      }
    }
    mutate {
      replace => {
        "user_product_log_id" => "%{eventValue.principal.user.product_object_id}"
      }
      on_error => "user_product_log_id_error"
    }
    if ![user_product_log_id_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.product_object_id" => "%{user_product_log_id}"
        }
        on_error => "product_log_id_error"
      }
    }
    mutate {
      replace => {
        "user_user_display_name" => "%{eventValue.principal.user.user_display_name}"
      }
      on_error => "user_display_name_not_valid"
    }
    if ![user_display_name_not_valid] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_user_display_name}"
        }
        on_error => "user_display_name_not_exists"
      }
    }
    mutate {
      replace => {
        "user_userid" => "%{eventValue.principal.user.userid}"
      }
      on_error => "user_userid_error"
    }
    if ![user_userid_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{user_userid}"
        }
        on_error => "user_userid_not_exists"
      }
    }
    mutate {
      replace => {
        "user_title" => "%{eventValue.principal.user.title}"
      }
      on_error => "user_title_error"
    }
    if ![user_title_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.title" => "%{user_title}"
        }
        on_error => "user_title_not_valid"
      }
    }
    mutate {
      replace => {
        "principal_user_department" => "%{eventValue.principal.user.department}"
      }
      on_error => "principal_department_error"
    }
    if ![principal_department_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.department" => "principal_user_department"
        }
        on_error => "principal_department_merge_error"
      }
    }
    mutate {
      replace => {
        "target_application" => "%{eventValue.target.application}"
      }
      on_error => "target_application_error"
    }
    if ![target_application_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{target_application}"
        }
        on_error => "target_application_not_valid"
      }
    }
    mutate {
      replace => {
        "target_user_product_object_id" => "%{eventValue.target.user.product_object_id}"
      }
      on_error => "target_not_valid"
    }
    if ![target_not_valid] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.product_object_id" => "%{target_user_product_object_id}"
        }
        on_error => "target_user_product_object_id_error"
      }
    }
    mutate {
      replace => {
        "target_user_user_display_name" => "%{eventValue.target.user.user_display_name}"
      }
      on_error => "target_user_display_name_error"
    }
    if ![target_user_display_name_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.user_display_name" => "%{target_user_user_display_name}"
        }
        on_error => "user_display_name_not_found"
      }
    }
    mutate {
      replace => {
        "target_user_userid" => "%{eventValue.target.user.userid}"
      }
      on_error => "target_user_userid_error"
    }
    if ![target_user_userid_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{target_user_userid}"
        }
        on_error => "user_id_not_valid"
      }
    }
    mutate {
      replace => {
        "target_user_title" => "%{eventValue.target.user.title}"
      }
      on_error => "target_user_title_error"
    }
    if ![target_user_title_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.title" => "%{target_user_title}"
        }
        on_error => "target_user_title_not_valid"
      }
    }
    mutate {
      replace => {
        "target_user_department" => "%{eventValue.target.user.department}"
      }
      on_error => "target_department_error"
    }
    if ![target_department_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.department" => "target_user_department"
        }
        on_error => "target_department_merge_error"
      }
    }
    mutate {
      replace => {
        "target_user_email_addresses" => "%{eventValue.target.user.email_addresses}"
      }
      on_error => "email_addresses_error"
    }
    if [target_user_email_addresses] != "" and [target_user_email_addresses] =~ "^.+@.+$" and [target_user_email_addresses] =~ "^(.){1,256}$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.user.email_addresses" => "target_user_email_addresses"
        }
        on_error => "email_addresses_merge_error"
      }
    }
    mutate {
      replace => {
        "observer_application" => "%{eventValue.observer.application}"
      }
      on_error => "observer_application_error"
    }
    if ![observer_application_error] {
      mutate {
        replace => {
          "event.idm.read_only_udm.observer.application" => "%{observer_application}"
        }
        on_error => "observer_application_not_valid"
      }
    }
    mutate {
      replace => {
        "network_email_from" => "%{eventValue.network.email.from}"
      }
      on_error => "network_email_from_error"
    }
    if [network_email_from] != "" and [network_email_from] =~ "^.+@.+$" and [network_email_from] =~ "^(.){1,256}$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.email.from" => "%{network_email_from}"
        }
        on_error => "network_email_from_merge_error"
      }
    }
    mutate {
      replace => {
        "network_email_reply_to" => "%{eventValue.network.email.reply_to}"
      }
      on_error => "network_email_reply_to_error"
    }
    if [network_email_reply_to] != "" and [network_email_reply_to] =~ "^.+@.+$" and [network_email_reply_to] =~ "^(.){1,256}$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.email.reply_to" => "%{network_email_reply_to}"
        }
        on_error => "network_email_reply_to_value_error"
      }
    }
    for index_1,network_email_to in eventValue.network.email.to {
      mutate {
        convert => {
          "index_1" => "string"
        }
        on_error => "index_1_conversion_error"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.network.email.to" => "network_email_to"
        }
        on_error => "email_to_merge_error"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.mail_id" => "%{eventValue.network.email.mail_id}"
      }
      on_error => "email_mail_id_error"
    }
    for index_2,network_email_subject in eventValue.network.email.subject {
      mutate {
        convert => {
          "index_2" => "string"
        }
        on_error => "index_2_conversion_error"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.network.email.subject" => "network_email_subject"
        }
        on_error => "email_subject_merge_error"
      }
    }
    for index_3,sec_res in eventValue.security_result {
      mutate {
        convert => {
          "index_3" => "string"
        }
        on_error => "index_3_conversion_error"
      }
      mutate {
        replace => {
          "sec_res_category" => "%{sec_res.category}"
        }
        on_error => "sec_res_category_error"
      }
      if [sec_res_category] != "" {
        mutate {
          replace => {
            "category_1" => "%{sec_res_category}"
          }
        }
        mutate {
          merge => {
            "security_result.category" => "category_1"
          }
        }
      }
      mutate {
        replace => {
          "sec_res_rule_id" => "%{sec_res.rule_id}"
        }
        on_error => "sec_res_rule_id_error"
      }
      if [sec_res_rule_id] != "" {
        mutate {
          replace => {
            "security_result.rule_id" => "%{sec_res_rule_id}"
          }
          on_error => "sec_res_rule_id_merge_error"
        }
      }
      mutate {
        replace => {
          "sec_res_description" => "%{sec_res.description}"
        }
        on_error => "sec_res_description_error"
      }
      if [sec_res_description] != "" {
        mutate {
          replace => {
            "security_result.description" => "%{sec_res_description}"
          }
        }
      }
      mutate {
        replace => {
          "sec_res_severity" => "%{sec_res.severity}"
        }
        on_error => "sec_res_severity_error"
      }
      if [sec_res_severity] != "" {
        if [sec_res_severity] =~ "LOW" {
          mutate {
            replace => {
              "security_result.severity" => "LOW"
            }
          }
        }
        else {
          mutate {
            replace => {
              "security_result.severity" => "%{sec_res_severity}"
            }
          }
        }
      }
      mutate {
        replace => {
          "sec_res_confidence" => "%{sec_res.confidence}"
        }
        on_error => "sec_res_confidence_error"
      }
      if [sec_res_confidence] == "MEDIUM_CONFIDENCE" {
        mutate {
          replace => {
            "security_result.confidence" => "MEDIUM_CONFIDENCE"
          }
        }
      }
      else if [sec_res_confidence] != "" {
        mutate {
          replace => {
            "security_result.confidence_details" => "%{sec_res_confidence}"
          }
          on_error => "sec_res_confidence_details_error"
        }
      }
      for index_4,sec_res_action in sec_res.action {
        mutate {
          convert => {
            "index_4" => "string"
          }
          on_error => "index_4_conversion_error"
        }
        if [sec_res_action] != "" {
          mutate {
            replace => {
              "sec_action" => "%{sec_res_action}"
            }
          }
        }
        else {
          mutate {
            replace => {
              "sec_action" => "BLOCK"
            }
          }
        }
        mutate {
          merge => {
            "security_result.action" => "sec_action"
          }
        }
      }
    }
    for key, value in eventValue.additional.entityValue map {
      mutate {
        replace => {
          "field_" => ""
          "check_" => ""
        }
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "entityValue_string_conversion_error"
      }
      mutate {
        replace => {
          "check_" => "%{value}"
        }
        on_error => "entityValue_value_not_exists"
      }
      if ![entityValue_value_not_exists] and [check_] != "" {
        mutate {
          replace => {
            "field_.value.string_value" => "%{value}"
          }
          on_error => "entityValue_value_not_valid"
        }
        mutate {
          replace => {
            "field_.key" => "entityValue_%{key}"
          }
          on_error => "entityValue_key_not_exists"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "entityValue_field_merge_error"
        }
      }
    }
    for key, value in eventValue.additional.entityValue.entity_info map {
      mutate {
        replace => {
          "field_" => ""
          "check_" => ""
        }
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "string_conversion_error"
      }
      mutate {
        replace => {
          "check_" => "%{value}"
        }
        on_error => "entity_info_value_not_exists"
      }
      if ![entity_info_value_not_exists] and [check_] != "" {
        mutate {
          replace => {
            "field_.value.string_value" => "%{value}"
          }
          on_error => "entity_info_value_not_valid"
        }
        mutate {
          replace => {
            "field_.key" => "entity_info_%{key}"
          }
          on_error => "entity_info_key_not_exists"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "entity_info_field_merge_error"
        }
      }
    }
    for key, value in  eventValue.additional.entityValue.entity_payload map {
      mutate {
        replace => {
          "field_" => ""
          "check_" => ""
        }
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "entity_payload_value_not_string"
      }
      mutate {
        replace => {
          "check_" => "%{value}"
        }
        on_error => "entity_payload_value_not_exists"
      }
      if ![entity_payload_value_not_exists] and [check_] != "" {
        mutate {
          replace => {
            "field_.value.string_value" => "%{value}"
          }
          on_error => "entity_payload_value_not_valid"
        }
        mutate {
          replace => {
            "field_.key" => "entity_payload_%{key}"
          }
          on_error => "entity_payload_key_not_exists"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "entity_payload_field_merge_error"
        }
      }
    }
    for key, value in  eventValue.additional.entityValue.entity_payload.email_links map {
      mutate {
        replace => {
          "field_" => ""
          "check_" => ""
        }
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "email_links_value_not_string"
      }
      mutate {
        replace => {
          "check_" => "%{value}"
        }
        on_error => "email_links_value_not_exists"
      }
      if ![email_links_value_not_exists] and [check_] != "" {
        mutate {
          replace => {
            "field_.value.string_value" => "%{value}"
          }
          on_error => "email_links_value_not_valid"
        }
        mutate {
          replace => {
            "field_.key" => "email_links_%{key}"
          }
          on_error => "email_links_key_not_exists"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "email_links_field_merge_error"
        }
      }
    }
    for key, value in eventValue.additional.entityValue.entity_payload.email_links_domains map {
      mutate {
        replace => {
          "field_" => ""
          "check_" => ""
        }
      }
      mutate {
        convert => {
          "value" => "string"
        }
        on_error => "email_links_domains_value_not_string"
      }
      mutate {
        replace => {
          "check_" => "%{value}"
        }
        on_error => "email_links_domains_value_not_exists"
      }
      if ![email_links_domains_value_not_exists] and [check_] != "" {
        mutate {
          replace => {
            "field_.value.string_value" => "%{value}"
          }
          on_error => "email_links_domains_value_not_valid"
        }
        mutate {
          replace => {
            "field_.key" => "email_links_domains_%{key}"
          }
          on_error => "email_links_domains_key_not_exists"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "email_links_domains_field_merge_error"
        }
      }
    }
    for index_5,matched_workflows in eventValue.additional.entityValue.entity_payload.matched_workflows {
      mutate {
        convert => {
          "index_5" => "string"
        }
        on_error => "index_5_conversion_error"
      }
      for key, value in  matched_workflows map {
        mutate {
          replace => {
            "field_" => ""
            "check_" => ""
          }
        }
        mutate {
          convert => {
            "value" => "string"
          }
          on_error => "matched_workflows_value_not_string"
        }
        mutate {
          replace => {
            "check_" => "%{value}"
          }
          on_error => "matched_workflows_value_not_exists"
        }
        if ![matched_workflows_value_not_exists] and [check_] != "" {
          mutate {
            replace => {
              "field_.value.string_value" => "%{value}"
            }
            on_error => "matched_workflows_value_not_valid"
          }
          mutate {
            replace => {
              "field_.key" => "matched_workflows_%{key}"
            }
            on_error => "matched_workflows_key_not_exists"
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "field_"
            }
            on_error => "matched_workflows_field_merge_error"
          }
        }
      }
      for key, value in matched_workflows.ap map {
        mutate {
          replace => {
            "field_" => ""
            "check_" => ""
          }
        }
        mutate {
          convert => {
            "value" => "string"
          }
          on_error => "ap_value_not_convertable_to_string"
        }
        mutate {
          replace => {
            "check_" => "%{value}"
          }
          on_error => "ap_value_not_exists"
        }
        if ![ap_value_not_exists] and [check_] != "" {
          mutate {
            replace => {
              "field_.value.string_value" => "%{value}"
            }
            on_error => "ap_value_not_valid"
          }
          mutate {
            replace => {
              "field_.key" => "ap_%{key}"
            }
            on_error => "ap_key_not_exists"
          }
          mutate {
