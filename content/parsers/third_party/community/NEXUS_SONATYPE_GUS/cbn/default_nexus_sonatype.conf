# Product: NEXUS_SONATYPE
# Category: Storage
# Supported Format: JSON+SYSLOG
# Reference: N/A
# Last Updated: 2025-11-18
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "insertId" => ""
      "log_file_path" => ""
      "resource_name" => ""
      "logName" => ""
      "receiveTimestamp" => ""
      "timestamp" => ""
      "resource.labels.instance_id" => ""
      "resource.labels.project_id" => ""
      "resource.labels.zone" => ""
      "resource.type" => ""
      "msg" => ""
      "src_ip" => ""
      "ident" => ""
      "auth" => ""
      "date" => ""
      "http_method" => ""
      "http_url" => ""
      "http_protocol" => ""
      "response_code" => ""
      "nexus_field_1" => ""
      "response_bytes" => ""
      "request_duration_ms" => ""
      "user_agent" => ""
      "thread_id" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_http" => "false"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_error"
  }


  mutate {
    replace => {
      "log_file_path" => "%{labels.agent.googleapis.com/log_file_path}"
      "resource_name" => "%{labels.compute.googleapis.com/resource_name}"
    }
    on_error => "no_labels"
  }
  if [insertId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{insertId}"
      }
      on_error => "no_insertId"
    }
  }
  if [log_file_path] != "" {
    mutate {
      replace => {
        "log_file_path_label.value.string_value" => "%{log_file_path}"
      }
      on_error => "no_log_file_path"
    }
    if ![no_log_file_path] {
      mutate {
        replace => {
          "log_file_path_label.key" => "log_file_path"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "log_file_path_label"
        }
        on_error => "no_file_path_label"
      }
    }
  }
  if [resource_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{resource_name}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{resource_name}"
      }
      on_error => "no_resource_name"
    }
    if ![no_resource_name] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [logName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.log_type" => "%{logName}"
      }
      on_error => "logName_not_found"
    }
  }
  if [receiveTimestamp] != "" {
    date {
      match => ["receiveTimestamp","ISO8601","yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "receive_timestamp_not_found"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp","ISO8601","yyyy-MM-ddTHH:mm:ss.SSSSSSSSSZ", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "timestamp_not_found"
    }
  }
  if [resource][labels][instance_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.product_object_id" => "%{resource.labels.instance_id}"
      }
      on_error => "no_instance_id"
    }
  }
  if [resource][labels][project_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.cloud.project.name" => "%{resource.labels.project_id}"
      }
      on_error => "no_project_name"
    }
  }

  if [resource][labels][zone] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.name" => "%{resource.labels.zone}"
      }
      on_error => "no_location"
    }
  }
  if [resource][type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.type" => "%{resource.type}"
      }
      on_error => "no_resource_type"
    }
  }
  mutate {
    replace => {
      "msg" => "%{jsonPayload.message}"
    }
    on_error => "no_message"
  }
  mutate {
    gsub => ["msg", "\\n", ""]
  }
  if [msg] != "" {
    grok {
      match => {
        "msg" => [
          "%{IPORHOST:src_ip} %{NOTSPACE:ident} %{NOTSPACE:auth} \\[%{DATA:date}\\] \\\"%{WORD:http_method} %{NOTSPACE:http_url} %{NOTSPACE:http_protocol}\\\" %{INT:response_code} %{NOTSPACE:nexus_field_1} %{INT:response_bytes} %{INT:request_duration_ms} \\\"%{GREEDYDATA:user_agent}\\\" \\[%{NOTSPACE:thread_id}\\]"
        ]
      }
      overwrite => ["src_ip", "ident", "auth", "date", "http_method", "http_url", "http_protocol", "response_code", "nexus_field_1", "response_bytes", "request_duration_ms", "user_agent", "thread_id"]
      on_error => "grok_failed"
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
      }
      on_error => "no_src_ip"
    }
    if ![no_src_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [ident] not in ["-", ""] {
    mutate {
      replace => {
        "ident_label.value.string_value" => "%{ident}"
      }
      on_error => "ident_not_found"
    }
    if ![ident_not_found] {
      mutate {
        replace => {
          "ident_label.key" => "ident"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "ident_label"
        }
        on_error => "no_ident_label"
      }
    }
  }
  if [auth] not in ["-", ""] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{auth}"
      }
      on_error => "auth_not_found"
    }
  }
  if [date] != "" {
    date {
      match => ["date", "dd/MMM/yyyy:HH:mm:ss Z", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.ingested_timestamp"
      on_error => "timestamp_not_matched"
    }
  }
  if [http_method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{http_method}"
      }
      on_error => "no_http_method"
    }
    if ![no_http_method] {
      mutate {
        replace => {
          "has_http" => "true"
        }
      }
    }
  }
  if [http_url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{http_url}"
      }
      on_error => "no_http_url"
    }
  }
  if [http_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol_version" => "%{http_protocol}"
      }
      on_error => "no_http_protocol"
    }
  }
  if [response_code] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{response_code}"
      }
      on_error => "no_response_code_int"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "no_response_code_string"
    }
  }
  if [user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{user_agent}"
      }
      on_error => "no_user_agent"
    }
    mutate {
      convert => {
        "user_agent" => "parseduseragent"
      }
      on_error => "no_parsed_user_agent"
    }
    mutate {
      rename => {
        "user_agent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
      }
    }
  }
  if [nexus_field_1] not in ["-", ""] {
    mutate {
      replace => {
        "nexus_field_1_label.value.string_value" => "%{nexus_field_1}"
      }
      on_error => "nexus_field_1_not_found"
    }
    if ![nexus_field_1_not_found] {
      mutate {
        replace => {
          "nexus_field_1_label.key" => "nexus_field_1"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "nexus_field_1_label"
        }
        on_error => "no_nexus_field_1_label"
      }
    }
  }
  if [response_bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{response_bytes}"
      }
      on_error => "no_response_bytes"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "not_valid_response_bytes_uinteger"
    }
  }
  if [request_duration_ms] != "" {
    mutate {
      replace => {
        "request_duration_ms_label.value.string_value" => "%{request_duration_ms}"
      }
      on_error => "request_duration_ms_not_found"
    }
    if ![request_duration_ms_not_found] {
      mutate {
        replace => {
          "request_duration_ms_label.key" => "request_duration_ms"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "request_duration_ms_label"
        }
        on_error => "no_request_duration_ms_label"
      }
    }
  }
  if [thread_id] != "" {
    mutate {
      replace => {
        "thread_id_label.value" => "%{thread_id}"
      }
      on_error => "thread_id_not_found"
    }
    if ![thread_id_not_found] {
      mutate {
        replace => {
          "thread_id_label.key" => "thread_id"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "thread_id_label"
        }
        on_error => "no_thread_id_label"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "NEXUS"
      "event.idm.read_only_udm.metadata.vendor_name" => "NEXUS_SONATYPE"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and [has_http] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
