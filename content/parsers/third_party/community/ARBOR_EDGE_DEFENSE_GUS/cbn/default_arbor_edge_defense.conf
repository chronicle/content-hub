# Product: ARBOR_EDGE_DEFENSE
# Category: NETWORK
# Supported Format: SYSLOG + KV
# Reference: N/A
# Last Updated: 2025-10-16
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "group_name" => ""
      "traffic_level" => ""
      "src" => ""
      "dst" => ""
      "dvc" => ""
      "spt" => "0"
      "dpt" => "0"
      "deviceDirection" => ""
      "eventId" => ""
      "eventid" => ""
      "fileHash" => ""
      "categoryOutcome" => ""
      "event_name" => ""
      "cs2" => ""
      "cs2Label" => ""
      "cs3" => ""
      "cs3Label" => ""
      "cn2" => ""
      "cn2Label" => ""
      "cs7" => ""
      "cs6" => ""
      "rt" => ""
      "security_result" => ""
      "security_rule_name" => ""
      "proto" => ""
      "device_version" => ""
      "severity" => ""
      "event_type" => "GENERIC_EVENT"
      "msg" => ""
      "intermediary_hostname" => ""
      "kv_data" => ""
      "cn1" => ""
      "cn1Label" => ""
    }
  }

  grok {
    match => {
      "message" => [
         "(?:<%{INT}>|%{DATA}) %{HOSTNAME:intermediary_hostname} CEF:%{INT:version}\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:security_rule_name}\\|(?:%{DATA:event_name}\\||)(?P<severity>Medium|MEDIUM|Low|LOW|HIGH|High|Unknown|%{INT})(?:\\||)%{GREEDYDATA:cef_extension}",
         "%{SYSLOGTIMESTAMP} %{HOSTNAME:intermediary_hostname} LEEF:%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA:device_version}\\|%{DATA:event_name}\\|%{GREEDYDATA:kv_data}"
      ]
    }
    overwrite => ["security_rule_name", "event_name","severity","device_version","intermediary_hostname","kv_data"]
    on_error => "not_grok_pattern"
  }

  if [not_grok_pattern] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  mutate {
    gsub => ["cef_extension", "(\\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
  }
  mutate {
    gsub => ["kv_data", "\\t", "$"]
  }

  kv {
    source => "cef_extension"
    field_split => "^"
    value_split => "="
    whitespace => "strict"
    on_error => "not_kv"
  }
  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", "sev", "severity"]
    }
    mutate {
      gsub => ["kv_data", "srcPort", "spt"]
    }
    mutate {
      gsub => ["kv_data", "dstPort", "dpt"]
    }
    kv {
      source => "kv_data"
      field_split => "$"
      value_split => "="
      whitespace => "strict"
      on_error => "not_kv_data"
    }
  }

  date {
    match => ["rt", "yyyy-MM-dd HH:mm:ss","MMM dd yyyy HH:mm:ss", "MMM dd yyyy HH:mm:ss Z", "MMM dd yyyy HH:mm:ss ZZ", "MM/dd/yyyy HH:mm:ss.SSS", "UNIX_MS"]
    on_error => "date_matching_failed"
  }

  if [src] != ""  {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src"
      }
    }
  }
  if [spt] not in ["","0"]  {
    mutate {
      convert => {
        "spt" => "integer"
      }
    }
    mutate {
      rename => {
        "spt" => "event.idm.read_only_udm.principal.port"
      }
    }
  }

  if [dst] != ""  {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dst"
      }
    }
  }
  if [cn1] != "" and [cn1Label] != "" {
    mutate {
      replace => {
        "cn1_label.key" => "%{cn1Label}"
        "cn1_label.value.string_value" => "%{cn1}"
      }
      on_error => "cn1_label_replace_failed"
    }
    if ![cn1_label_replace_failed] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cn1_label"
        }
        on_error => "cn1_label_merge_failed"
      }
    }
  }

  if [dpt] not in ["","0"]  {
    mutate {
      convert => {
        "dpt" => "integer"
      }
    }
    mutate {
      rename => {
        "dpt" => "event.idm.read_only_udm.target.port"
      }
    }
  }

  if [cs2] != "" {
    mutate {
      replace => {
        "attribute_label.key" => "%{cs2Label}"
        "attribute_label.value" => "%{cs2}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.group.attribute.labels" => "attribute_label"
      }
    }
  }

  if [cn2] != "" {
    mutate {
      replace => {
        "protection_group_id_label.key" => "%{cn2Label}"
        "protection_group_id_label.value" => "%{cn2}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.group.attribute.labels" => "protection_group_id_label"
      }
    }
  }

  if [security_rule_name] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{security_rule_name}"
      }
    }
  }

  if [event_name] == "Blocked Host"   {
    mutate {
        replace => {
        "security_action" => "BLOCK"
        "security_result.action_details" => "%{event_name}"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "security_action"
      }
    }
  }

  if [dst] != "" and [src] != "" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [dst] == "" and [src] != "" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [msg] != "" {
    grok {
      match => {
        "msg" => [
          "%{DATA} '%{DATA:group_name}' %{GREEDYDATA}. The traffic level was %{GREEDYDATA:traffic_level}.",
          ".*'%{GREEDYDATA:group_name}'.* %{NOTSPACE:traffic_level} (Mbps|kpps|pps)"
        ]
      }
      overwrite => ["group_name","traffic_level"]
      on_error => "msg_grok_fail"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{msg}"
      }
    }
    if ![msg_grok_fail] {
      if [traffic_level] != "" {
        mutate {
          replace => {
            "traffic_label.key" => "Traffic Level"
            "traffic_label.value" => "%{traffic_level}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.group.attribute.labels" => "traffic_label"
          }
        }
      }
      if [group_name] != "" {
        mutate {
          replace => {
            "group_label.key" => "Protection Group Name"
            "group_label.value" => "%{group_name}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.group.attribute.labels" => "group_label"
          }
        }
      }
    }
  }

  if [intermediary_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_hostname}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  if [cs3] != "" {
    mutate {
      replace => {
        "cs3_detection_field.key" => "%{cs3Label}"
        "cs3_detection_field.value" => "%{cs3}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "cs3_detection_field"
      }
    }
  }

  if [cs7] != "" {
    mutate {
      replace => {
        "sec_category" => "Threat Category: %{cs7}"
      }
    }
    mutate {
      merge => {
        "security_result.category_details" => "sec_category"
      }
    }
  }

  if [event_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_name}"
      }
    }
  }

  mutate {
    uppercase => ["proto"]
  }

  if [proto] in ['TCP', 'UDP'] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{proto}"
      }
    }
  }

  if [device_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{device_version}"
      }
    }
  }

  mutate {
    uppercase => ["severity", "requestMethod"]
  }

  if [severity] in ["0", "1", "2", "3", "LOW"] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] in ["4", "5", "6", "MEDIUM"] {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] in ["7", "8", "HIGH"] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] in ["9", "10", "VERY-HIGH"] {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "NETSCOUT"
      "event.idm.read_only_udm.metadata.product_name" => "ARBOR_EDGE_DEFENSE"
    }
  }

  if [cs6] != "" {
   mutate {
      replace => {
        "security_result.threat_name" => "%{cs6}"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
