# Product: Akamai Cloud Monitor
# Category: Load Balancer, Traffic Shaper, ADC
# Supported Format: JSON
# Reference: https://developer.akamai.com/api/core_features/datastream2_config/v1.html
# Last Updated: 2026-01-16
# Copyright 2026 Google SecOps
#
# meta:
#   description =  "CBN for Akamai DataStream 2"
#
# Field descriptions (List data set fields)
#
# Log information: "Contains fields that can be used to identify or tag a log line"
#   cp         : "The Content Provider code associated with the request.
#   reqId      : "The identifier of the request."
#   reqTimeSec : "The time when the edge server accepted the request from the client."
#
# Message exchange data: "Contains fields representing the exchange of data between Akamai & end user",
#   bytes               : "The content bytes served in the response."
#   cliIP               : "The IP address of the client."
#   statusCode          : "The HTTP status code of the response."
#   proto               : "The protocol of the request-response cycle, either HTTP or HTTPS."
#   reqHost             : "The value of the Host header in the request."
#   reqMethod           : "The HTTP method of the request.",
#   reqPath             : "The path to a resource in the request, excluding query parameters."
#   reqPort             : "The port number of the requested service."
#   rspContentLen       : "The size of the entity-body in bytes returned to the client."
#   rspContentType      : "The type of the content returned to the client."
#   UA                  : "The user agent making the request."
#   tlsOverheadTimeMSec : "The time in milliseconds between when the edge server accepts the connection and the completion of the SSL handshake."
#   tlsVersion          : "The protocol of the SSL handshake, either SSLv2, SSLv3, or TLSv1."
#   objSize             : "The size of the object, excluding HTTP response headers."
#   uncompressedSize    : "The size of the uncompressed object, if zipped before sending to the client. This field will be populated only when the Last mile acceleration is enabled."
#   overheadBytes       : "TCP overhead in bytes for the request and response."
#   totalBytes          : "The bytes served in the response, including the content and all overheads."
#   queryStr            : "The query string in the incoming URI from the client. Returns only when the Cache Key Parameter behavior is set to include all parameters."
#
# Request header data: "Contains fields representing the information sent as part of request headers to Akamai"
#   accLang       : "The list of languages acceptable in the response."
#   cookie        : "A list of HTTP cookies previously sent by the server with the Set-Cookie header."
#   range         : "The part of an entity that the server is requested to return."
#   referer       : "The address of the resource from which the requested URI was followed."
#   xForwardedFor : "The originating IP address of a client connecting to a web server through an HTTP proxy or load balancer."
#   maxAgeSec     : "The time in seconds that the object is valid for positive cache responses."
#
# Network performance data: "Contains fields representing the performance/troubleshooting metrics"
#   reqEndTimeMSec     : "The time it takes the edge server to fully read the request."
#   errorCode          : "A string describing the problem with serving the request."
#   turnAroundTimeMSec : "The time in milliseconds from when the edge server receives the last byte of the request to when it sends the first bytes of the response."
#   transferTimeMSec   : "The time in milliseconds from when the edge server was ready to send the first byte to when it sent the last byte of the response."
#   dnsLookupTimeMSec  : "The time in seconds between the start of the request and the completion of the DNS lookup, if one was required. For cached IP addresses, this value is zero. This field will be populated only # when the instantConfig behavior is enabled."
#
# Other
#   customField : "The data specified in the Custom Log Field of the Log Requests Details that you want to receive in the stream."
#
# Cache data: "Contains fields on statistics about Akamai caching data."
#   cacheStatus : "The value of this field shows if the request was served from Edge cache or peer (1) or forwarded to parent or origin (0)."

filter {

  # initialization
  mutate {
    replace => {
      "country"     => "-"
      "city"        => "-"
      "reqHost"     => "-"
      "customField" => "-"
      "reqTimeSec" => ""
      "reqId" => ""
      "totalBytes" => ""
      "proto" => ""
      "protocol" => ""
      "referer" => ""
      "UA" => ""
      "xForwardedFor" => ""
      "cliIP" => ""
      "reqMethod" => ""
      "reqPort" => ""
      "reqPath" => ""
      "queryStr" => ""
      "errorCode" => ""
      "statusCode" => ""
      "type" => ""
      "version" => ""
      "id" => ""
      "cp" => ""
      "start" => ""
      "msg.proto" => ""
      "msg.status" => ""
      "msg.cliIP" => ""
      "msg.reqPort" => ""
      "msg.reqHost" => ""
      "msg.reqMethod" => ""
      "msg.reqPath" => ""
      "msg.sslVer" => ""
      "msg.UA" => ""
      "msg.fwdHost" => ""
      "msg.reqLen" => ""
      "msg.respLen" => ""
      "geo.country" => ""
      "geo.region" => ""
      "geo.city" => ""
      "geo.lat" => ""
      "geo.long" => ""
      "network.edgeIP" => ""
      "intermediary" => ""
      "network.network" => ""
      "network.networkType" => ""
      "network.asnum" => ""
      "aEn" => ""
      "cEn" => ""
      "rqC" => ""
      "caC" => ""
      "eTg" => ""
      "iMd" => ""
      "iUm" => ""
      "iNm" => ""
      "iMs" => ""
      "iMt" => ""
      "aGe" => ""
      "xRp" => ""
      "xRt" => ""
      "eNv" => ""
      "eIp" => ""
      "pIp" => ""
      "asn" => ""
      "bytes" => ""
      "edgeIP" => ""
      "rspContentType" => ""
      "cipher" => ""
      "securityRules" => ""
      "serverCountry" => ""
      "state" => ""
      "turnAroundTimeMSec" => ""
      "url" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "msg_cliIP" => ""
      "network_edgeIP" => ""
    }
  }

  mutate {
    gsub => ["message", "\"message\"", "\"msg\""]
  }

  json {
    source => "message"
    on_error => "invalid_json"
  }

  if [invalid_json] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  # date parsing
  if [reqTimeSec] != "" {
    date {
      match => [ "reqTimeSec","UNIX", "UNIXMS" ]
    }
  }
  else if [start] != "" {
    date {
      match => [ "start","UNIX", "UNIXMS" ]
    }
  }

  # UDM > Metadata
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Akamai"
      "event.idm.read_only_udm.metadata.product_name" => "DataStream"
    }
  }

  if [version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      }
      on_error => "version_not_set"
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "2"
      }
      on_error => "version_not_set_2"
    }
  }

  if [id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
      }
      on_error => "id_not_set"
    }
  }
  else if [reqId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{reqId}"
      }
      on_error => "reqId_not_set_found"
    }
  }

  if [type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
      }
      on_error => "type_not_set"
    }
  }

  # UDM > Network
  mutate {
    convert => {
      "totalBytes" => "string"
    }
    on_error => "totalBytes_already_string"
  }
  mutate {
    convert => {
      "msg.reqLen" => "string"
    }
    on_error => "msg_reqLen_already_string"
  }
  mutate {
    convert => {
      "msg.respLen" => "string"
    }
    on_error => "msg_respLen_already_string"
  }
  if [totalBytes] != "" and [totalBytes] !~ "[-]" {
    mutate {
      convert => {
        "totalBytes" => "uinteger"
      }
      on_error => "totalBytes_not_uinteger"
    }
    mutate {
      rename => {
        "totalBytes" => "event.idm.read_only_udm.network.sent_bytes"
      }
      on_error => "totalBytes_not_set"
    }
  }
  else if [msg][reqLen] != "" and [msg][reqLen] !~ "[-]" {
    mutate {
      convert => {
        "msg.reqLen" => "uinteger"
      }
      on_error => "msg_reqLen_not_uinteger"
    }
    mutate {
      rename => {
        "msg.reqLen" => "event.idm.read_only_udm.network.sent_bytes"
      }
      on_error => "msg_reqLen_not_set"
    }
  }

  if [msg][respLen] != "" and [msg][respLen] !~ "[-]" {
    mutate {
      convert => {
        "msg.respLen" => "uinteger"
      }
      on_error => "msg_respLen_not_uinteger"
    }
    mutate {
      rename => {
        "msg.respLen" => "event.idm.read_only_udm.network.received_bytes"
      }
      on_error => "msg_respLen_not_set"
    }
  }

  mutate {
    rename => {
      "reqId" => "event.idm.read_only_udm.network.session_id"
      "tlsVersion" => "event.idm.read_only_udm.network.tls.version"
    }
    on_error => "reqId_not_set"
  }

  if [msg][sslVer] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.version" => "%{msg.sslVer}"
      }
      on_error => "msg_sslVer_not_set"
    }
  }

  if [proto] =~ /(?i)HTTPS/ or [msg][proto] =~ "(?i)HTTPS" {
    mutate {
      replace => {
        "protocol" => "HTTPS"
      }
      on_error => "protocol_not_set"
    }
  } else if [proto] =~ /(?i)HTTP[^S]/ or [msg][proto] =~ "(?i)HTTP" {
    mutate {
      replace => {
        "protocol" => "HTTP"
      }
      on_error => "protocol_not_set_2"
    }
  }

  # UDM > Netowrk > HTTP
  mutate {
    convert => {
      "statusCode" => "string"
    }
    on_error => "statusCode_already_string"
  }
  mutate {
    convert => {
      "msg.status" => "string"
    }
    on_error => "msg_status_already_string"
  }
  if [statusCode] != "" and [statusCode] !~ "[-]" {
    mutate {
      convert => { "statusCode" => "integer"}
      on_error => "statusCode_not_integer"
    }
    mutate {
      rename => {
        "statusCode" => "event.idm.read_only_udm.network.http.response_code"
      }
      on_error => "statusCode_not_set"
    }
  }
  else if [msg][status] != "" and [msg][status] !~ "[-]" {
    mutate {
      convert => {
        "msg.status" => "integer"
      }
      on_error => "msg_status_not_integer"
    }
    mutate {
      rename => {
        "msg.status" => "event.idm.read_only_udm.network.http.response_code"
      }
      on_error => "msg_status_not_set_2"
    }
  }

  if [reqMethod] != "" {
    mutate {
      rename => {
        "reqMethod" => "event.idm.read_only_udm.network.http.method"
      }
      on_error => "reqMethod_not_set"
    }
  }
  else if [msg][reqMethod] != "" {
    mutate {
      rename => {
        "msg.reqMethod" => "event.idm.read_only_udm.network.http.method"
      }
      on_error => "msg_reqMethod_not_set_2"
    }
  }

  if [protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "%{protocol}"
      }
      on_error => "protocol_not_set_3"
    }
  }

  if [referer] != "-" {
    grok {
      match => {
        referer => "://(www\\.)?(?P<referer_domain>[^/\\?:%]+)"
      }
      on_error => "_not_valid_referer"
    }
    mutate {
      rename => {
        "referer" => "event.idm.read_only_udm.network.http.referral_url"
      }
      on_error => "referer_not_set"
    }
    if ![_not_valid_referer] {
      mutate {
        rename => {
          "referer_domain" => "about_referer.hostname"
        }
        on_error => "referer_domain_not_set"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.about" => "about_referer"
        }
        on_error => "about_referer_not_set"
      }
    }
  }
  if [UA] not in ["-", ""] {
    mutate {
      rename => { "UA" => "event.idm.read_only_udm.network.http.user_agent" }
      on_error => "UA_not_set"
    }
  }
  else if [msg][UA] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{msg.UA}"
      }
      on_error => "msg_UA_not_set"
    }
  }

  # UDM > Principal
  if [cliIP] != "" {
    grok {
      match => {
        "cliIP" => "%{IP:cliIP}"
      }
      overwrite => ["cliIP"]
      on_error => "_not_valid_cliIP"
    }
    if ![_not_valid_cliIP] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "cliIP"
        }
        on_error => "cliIP_not_set"
      }
      if ![cliIP_not_set] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  else if [msg][cliIP] != "" {
    grok {
      match => {
        "msg.cliIP" => "%{IP:msg_cliIP}"
      }
      on_error => "_not_valid_msg_cliIP"
      overwrite => ["msg_cliIP"]
    }
    if ![_not_valid_msg_cliIP] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "msg_cliIP"
        }
        on_error => "msg_cliIP_not_set"
      }
      if ![msg_cliIP_not_set] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [xForwardedFor] not in ["-", ""] {
    grok {
      match => {
        "xForwardedFor" => "%{IP:xForwardedFor}"
      }
      overwrite => ["xForwardedFor"]
      on_error => "_not_valid_xForwardedFor"
    }
    if ![_not_valid_xForwardedFor] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "xForwardedFor"
        }
        on_error => "xForwardedFor_not_set"
      }
      if ![xForwardedFor_not_set] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [msg][fwdHost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{msg.fwdHost}"
      }
      on_error => "msg_fwdHost_not_set"
    }
    if ![msg_fwdHost_not_set] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [country] not in ["", "-"] {
    mutate {
      rename => { "country" => "event.idm.read_only_udm.principal.location.country_or_region" }
      on_error => "country_not_set"
    }
  }
  else if [geo][country] != "" {
    mutate {
      rename => {
        "geo.country" => "event.idm.read_only_udm.principal.location.country_or_region"
      }
      on_error => "geo_country_not_set"
    }
  }

  if [city] not in ["", "-"] {
    mutate {
      rename => { "city" => "event.idm.read_only_udm.principal.location.city" }
      on_error => "city_not_set"
    }
  }
  else if [geo][city] != "" {
    mutate {
      rename => {
        "geo.city" => "event.idm.read_only_udm.principal.location.city"
      }
      on_error => "geo_city_not_set"
    }
  }

  if [geo][region] != "" {
    mutate {
      rename => {
        "geo.region" => "event.idm.read_only_udm.principal.location.state"
      }
      on_error => "geo_region_not_set"
    }
  }

  if [geo][lat] not in ["", "reserved"] {
    mutate {
      rename => {
        "geo.lat" => "event.idm.read_only_udm.principal.location.region_latitude"
      }
      on_error => "geo_lat_not_set"
    }

    mutate {
      convert => {
        "event.idm.read_only_udm.principal.location.region_latitude" => "float"
      }
      on_error => "geo_lat_not_float"
    }
  }

  if [geo][long]  not in ["", "reserved"] {
    mutate {
      rename => {
        "geo.long" => "event.idm.read_only_udm.principal.location.region_longitude"
      }
      on_error => "geo_long_not_set"
    }

    mutate {
      convert => {
        "event.idm.read_only_udm.principal.location.region_longitude" => "float"
      }
      on_error => "geo_long_not_float"
    }
  }

  # UDM > Target
  if [reqPort] != "" {
    mutate {
      convert => { "reqPort" => "integer"}
      on_error => "reqPort_not_integer"
    }
    mutate {
      rename => {
        "reqPort" => "event.idm.read_only_udm.target.port"
      }
      on_error => "reqPort_not_set_2"
    }
  }
  else if [msg][reqPort] != "" {
    mutate {
      convert => {
        "msg.reqPort" => "integer"
      }
      on_error => "msg_reqPort_not_integer"
    }
    mutate {
      rename => {
        "msg.reqPort" => "event.idm.read_only_udm.target.port"
      }
      on_error => "msg_reqPort_not_set_3"
    }
  }

  mutate {
    lowercase => [ "protocol"]
  }

  if [reqHost] != "-" {
    grok {
      match => {
        reqHost => "(www\\.)?(?P<host_domain>[^/]+)"
      }
      on_error => "_not_valid_reqHost"
    }
    if ![_not_valid_reqHost] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{host_domain}"
        }
        on_error => "host_domain_not_set"
      }
      if ![host_domain_not_set] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{reqHost}"
        }
        on_error => "reqHost_not_set"
      }
      if ![reqHost_not_set] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    mutate {
      replace => { "url" => "%{protocol}://%{reqHost}/"}
    }
  }
  else if [msg][reqHost] != "" {
    mutate {
      replace => {
        "url" => "%{protocol}://%{msg.reqHost}/"
      }
      on_error => "msg_reqHost_not_set"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{msg.reqHost}"
      }
      on_error => "msg_reqHost_not_set1"
    }
    if ![msg_reqHost_not_set1] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [msg][reqPath] != "" {
    mutate {
      replace => {"url" => "%{url}%{msg.reqPath}" }
      on_error => "msg_reqPath_not_set"
    }
  }
  else if [reqPath] != "-" {
    mutate {
      replace => {"url" => "%{url}%{reqPath}" }
      on_error => "reqPath_not_set"
    }
  }
  if [queryStr] not in ["-", ""] {
    mutate {
      replace => {"url" => "%{url}?%{queryStr}"}
      on_error => "queryStr_not_set"
    }
  }

  mutate {
    rename => {
      "url" => "event.idm.read_only_udm.target.url"
    }
    on_error => "url_not_set"
  }

  # UDM > Intermediary
  if [network][edgeIP] != "" {
    grok {
      match => {
        "network.edgeIP" => "%{IP:network_edgeIP}"
      }
      overwrite => ["network_edgeIP"]
      on_error => "_not_valid_network_edgeIP"
    }
    if ![_not_valid_network_edgeIP] {
      mutate {
        merge => {
          "intermediary.ip" => "network_edgeIP"
        }
        on_error => "network_edgeIP_not_set"
      }
    }
  }

  # UDM > Security Result
  if [errorCode] not in ["-", ""] {
    mutate {
      replace => {
        "sr.severity" => "ERROR"
        "sr.summary" => "%{errorCode}"
      }
      on_error => "errorCode_not_set"
    }
  } else {
    mutate {
      replace => { "sr.severity" => "INFORMATIONAL" }
      on_error => "severity_not_set"
    }
  }

  if [securityRules] not in ["-", ""] {
    mutate {
      gsub => ["securityRules", "\\|\\|", ""]
    }
    mutate {
      replace => {
        "sr.rule_name" => "%{securityRules}"
      }
      on_error => "securityRules_not_set"
    }
  }

  mutate {
    merge => { "event.idm.read_only_udm.security_result" => "sr" }
  }

  # ==== Custome Fields =====
  mutate {
    gsub => ["customField" ,"\\^|-",""]
  }
  if [customField] != "" {
    mutate {
      gsub => ["customField", "%20", ""]
    }
    mutate {
      gsub => ["customField", "%7", ""]
    }
    kv {
      source => "customField"
      field_split => ","
      value_split => ":"
    }

    grok {
      match => {
        "customField" => ["aEn:%{DATA:aEn},cEn"]
      }
      overwrite => ["aEn"]
      on_error => "_not_valid_aEn"
    }

    if [aEn] != "" {
      mutate {
        replace => {
          "labels_aEn.key"   => "aEn"
          "labels_aEn.value" => "%{aEn}"
        }
        on_error => "aEn_not_set"
      }
      if ![aEn_not_set] {
        mutate {
          merge => {
            "about.labels" => "labels_aEn"
          }
          on_error => "aEn_not_set_merge_fail"
        }
      }
    }

    if [cEn] != "" {
      mutate {
        replace => {
          "labels_cEn.key"   => "cEn"
          "labels_cEn.value" => "%{cEn}"
        }
        on_error => "cEn_not_set"
      }
      if ![cEn_not_set] {
        mutate {
          merge => {
            "about.labels" => "labels_cEn"
          }
          on_error => "cEn_not_set_merge_fail"
        }
      }
    }

    if [rqC] != "" {
      mutate {
        replace => {
          "labels_rqC.key"   => "rqC"
          "labels_rqC.value" => "%{rqC}"
        }
        on_error => "rqC_not_set"
      }
      if ![rqC_not_set] {
        mutate {
          merge => {
