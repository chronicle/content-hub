# Product: SailPoint
# Category: Identity and Access Management
# Supported Format: SYSLOG, KV+XML, KV
# Reference: N/A
# Last Updated: 2026-02-17
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "left_message_systemd" => ""
      "left_message_data_doctype" => ""
      "left_message_data" => ""
      "product_event_type" => ""
      "no_defined_pattern" => ""
      "event_type" => "GENERIC_EVENT"
      "about" => ""
      "network" => ""
      "principal" => ""
      "intermediary" => ""
      "security_result" => ""
      "target" => ""
      "metadata" => ""
      "desc" => ""
      "kv" => ""
      "json_data" => ""
      "kv_1" => ""
      "_api_module" => ""
      "has_principal" => "false"
      "created" => ""
      "id" => ""
      "lauer" => ""
      "launcher" => ""
      "source" => ""
      "username" => ""
      "host" => ""
      "server_host" => ""
      "server" => ""
      "client_host" => ""
      "application" => ""
      "action" => ""
      "event_level" => ""
      "kv_data" => ""
      "attributes" => ""
      "has_user" => ""
      "has_target" => ""
      "temp_value" => ""
      "action_value" => ""
      "data_key" => ""
      "data_value" => ""
    }
  }

  mutate {
    gsub => ["message" , "<null>" , " "]
  }
  mutate {
    gsub => ["message" , "\\|target\\|" , "|target_data|"]
  }

  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601},%{DATA} %{DATA:product_event_type} %{DATA:data_key}-%{INT:data_value} %{DATA:_api_module} - %{GREEDYDATA:left_message_data}",
        "%{TIMESTAMP_ISO8601},%{DATA}\\s+%{HOSTNAME:log_origin}\\s+%{NOTSPACE:ignore_data}\\s+%{GREEDYDATA:left_message_systemd}",
      ]
    }
    overwrite => ["data_value", "data_key", "left_message_systemd", "left_message_data_doctype", "left_message_data", "product_event_type", "_api_module", "log_origin"]
    on_error => "grok_fail"
  }

  if [grok_fail] {
    grok {
      match => {
        "message" => "\\|%{DATA:product_event_type}\\|%{GREEDYDATA:kv_data}"
      }
      overwrite => ["product_event_type", "kv_data"]
      on_error => "grok_fail_1"
    }
    if ![grok_fail_1] {
      mutate {
        gsub => ["kv_data" , "\\|message\\|" , "|message_data|"]
      }
      mutate {
        gsub => ["kv_data" , "\\|message_data\\|completed" , "|message_data| |completed"]
      }
      mutate {
        gsub => ["kv_data" , "([^|]+)\\|([^|]*)" , "$1=$2"]
      }
      mutate {
        gsub => ["kv_data" , "entkey" , "entry key"]
      }
      kv {
        source => "kv_data"
        field_split => "|"
        value_split => "="
        on_error => "kv_filter_failed"
      }
      if [kv_filter_failed] {
        drop {
          tag => "TAG_MALFORMED_MESSAGE"
        }
      }
    }
  }
  if [created] != "" {
    date {
      match => ["created", "UNIX_MS"]
      target => "metadata.event_timestamp"
      on_error => "created_not_found"
    }
  }
  if [lauer] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{lauer}"
        "has_user" => "true"
      }
      on_error => "lauer_not_found"
    }
  } else if [launcher] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{launcher}"
        "has_user" => "true"
      }
      on_error => "launcher_not_found"
    }
  } else if [source] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{source}"
        "has_user" => "true"
      }
      on_error => "source_not_found"
    }
  } else if [username] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{username}"
        "has_user" => "true"
      }
      on_error => "username_not_found"
    }
  }
  if [host] not in ["", "null"] {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "host_not_found"
    }
  }
  if [server_host] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{server_host}"
        "target.asset.hostname" => "%{server_host}"
        "has_target" => "true"
      }
      on_error => "server_host_not_found"
    }
  }
  else if [server] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{server}"
        "target.asset.hostname" => "%{server}"
        "has_target" => "true"
      }
      on_error => "server_not_found"
    }
  }
  if [client_host] not in ["","null"] {
    grok {
      match => {
        "client_host" => "%{IP:client_ip}"
      }
      overwrite => ["client_ip"]
      on_error => "client_ip_grok_fail"
    }
    if ![client_ip_grok_fail] {
      mutate {
        merge => {
          "principal.ip" => "client_ip"
          "principal.asset.ip" => "client_ip"
        }
        on_error => "client_ip_not_found"
      }
      if ![client_ip_not_found] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "principal.hostname" => "%{client_host}"
          "principal.asset.hostname" => "%{client_host}"
          "has_principal" => "true"
        }
        on_error => "client_host_not_found"
      }
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "action_not_found"
    }
  }
  if [event_level] != "" {
    if [event_level] =~ "(?i)Low" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
    else if [event_level] =~ "(?i)Informational" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [event_level] =~ "(?i)Critical" {
      mutate {
        replace => {
          "security_result.severity" => "CRITICAL"
        }
      }
    } else if [event_level] =~ "(?i)High" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    } else if [event_level] =~ "(?i)Error" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
        }
      }
    }
  }
  mutate {
    rename => {
      "type" => "addition.type"
      "completion_status" => "addition.completion_status"
      "name" => "addition.name"
      "owner" => "addition.owner"
      "assigned_scope" => "addition.assigned_scope"
      "assigned_scope_path" => "addition.assigned_scope_path"
      "stack" => "addition.stack"
      "launched" => "addition.launched"
      "progress" => "addition.progress"
      "percent_complete" => "addition.percent_complete"
      "expiration" => "addition.expiration"
      "verified" => "addition.verified"
      "definition" => "addition.definition"
      "schedule" => "addition.schedule"
      "pending_signoffs" => "addition.pending_signoffs"
      "signoff" => "addition.signoff"
      "report" => "addition.report"
      "target_class" => "addition.target_class"
      "target_id" => "addition.target_id"
      "target_name" => "addition.target_name"
      "task_terminated" => "addition.task_terminated"
      "partitioned" => "addition.partitioned"
      "live" => "addition.live"
      "run_length" => "addition.run_length"
      "run_length_average" => "addition.run_length_average"
      "run_length_deviation" => "addition.run_length_deviation"
      "interface" => "addition.interface"
      "account_name" => "addition.account_name"
      "instance" => "addition.instance"
      "attribute_name" => "addition.attribute_name"
      "attribute_value" => "addition.attribute_value"
      "tracking_id" => "addition.tracking_id"
      "string1" => "addition.string1"
      "string2" => "addition.string2"
      "string3" => "addition.string3"
      "string4" => "addition.string4"
      "quick_key" => "addition.quick_key"
      "classname" => "addition.classname"
      "line_number" => "addition.line_number"
      "thread" => "addition.thread"
      "stacktrace" => "addition.stacktrace"
      "message_data" => "addition.message_data"
      "target_data" => "addition.target_data"
      "modified" => "addition.modified"
      "completed" => "addition.completed"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_convert_failure"
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [value] not in ["", "-", "None", "null"] {
      mutate {
        replace => {
          "field_.key" => "%{key}"
        }
        on_error => "key_not_exists"
      }
      mutate {
        replace => {
          "field_.value" => "%{value}"
        }
        on_error => "value_replace_failure"
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "field_"
        }
        on_error => "field_empty"
      }
    }
  }
  for index, entry in xml(attributes,/Attributes/Map/entry) {
    mutate {
      replace => {
        "temp_key" => ""
        "temp_value" => ""
        "temp_value_label" => ""
      }
    }
    xml {
      source => "attributes"
      xpath => {
        "/Attributes/Map/entry[%{index}]/@key" => "temp_key"
        "/Attributes/Map/entry[%{index}]/value/Integer" => "temp_value"
        "/Attributes/Map/entry[%{index}]/@value" => "temp_value"
      }
    }
    if [temp_key] == "operation" {
      mutate {
        replace => {
          "action_value" => "%{temp_value}"
        }
        on_error => "operation_not_found"
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_convert_failure"
    }
    mutate {
      convert => {
        "temp_value" => "string"
      }
      on_error => "temp_value_convert_failure"
    }
    if [temp_key] != "" and [temp_value] != "" {
      mutate {
        replace => {
          "temp_value_label.key" => "%{temp_key}_%{index}"
          "temp_value_label.value.string_value" => "%{temp_value}"
        }
        on_error => "temp_value_label_not_found"
      }
      if ![temp_value_label_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "temp_value_label"
          }
          on_error => "temp_value_label_merge_failure"
        }
      }
    }
  }
  for index, type in xml(messages,/List/Message) {
    mutate {
      replace => {
        "key_temp" => ""
        "type_temp" => ""
        "type_temp_label" => ""
      }
    }
    xml {
      source => "messages"
      xpath => {
        "/List/Message[%{index}]/@key" => "key_temp"
        "/List/Message[%{index}]/@type" => "type_temp"
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_conversion_failure"
    }
    if [type_temp] != "" and [key_temp] != "" {
      mutate {
        replace => {
          "type_temp_label.key" => "%{type_temp}_%{index}"
          "type_temp_label.value.string_value" => "%{key_temp}"
        }
        on_error => "type_temp_label_not_found"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type_temp_label"
        }
        on_error => "type_temp_label_merge_failure"
      }
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_not_found"
    }
  }

  if [_api_module] != "" {
    mutate {
      replace => {
        "api_module.key" => "api_module"
        "api_module.value" => "%{_api_module}"
      }
      on_error => "api_module_not_found"
    }
    mutate {
      merge => {
        "about.labels" => "api_module"
      }
      on_error => "api_module_not_found"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "SAILPOINT"
      "metadata.product_name" => "IAM"
    }
  }

  if ![grok_fail] {
    if [left_message_data_doctype] != "" {
      mutate {
        rename => {
          "left_message_data_doctype" => "metadata.description"
        }
        on_error => "left_message_data_doctype_not_found"
      }
    }

    if [left_message_data] != "" {
      mutate {
        replace => {
          "id" => ""
          "identity" => ""
          "ref" => ""
          "description" => ""
          "displayName" => ""
          "loop" => ""
        }
      }

      mutate {
        gsub => ["left_message_data" , "privilegedData." , ""]
      }
      mutate {
        gsub => ["left_message_data" , "\\$ref" , "ref"]
      }
      grok {
        match => {
          "left_message_data" => [
            "attrAssignments :\\[%{GREEDYDATA:loop}\\]"
            ".*Arguments => \\{%{GREEDYDATA:kv}\\},%{DATA},%{DATA}, \\[\\{%{GREEDYDATA:kv_1}\\}\\]"
            "roleAssignments :\\[%{GREEDYDATA:loop}\\]"
            "%{GREEDYDATA:desc}\\[%{GREEDYDATA:kv}\\]",
            "%{GREEDYDATA:desc}"
          ]
        }
        overwrite => ["kv" , "desc" , "loop" , "kv_1" , "json_data"]
        on_error => "grok_fail_left_message_data"
      }
      mutate {
        gsub => ["kv" , "identity=CN=", "identity="]
      }

      kv {
        source => "kv"
        field_split => ","
        value_split => "="
        on_error => "kv_not_found"
      }
      mutate {
        replace => {
          "type_label1.key" => "type_val"
          "type_label1.value.string_value" => "%{type}"
        }
        on_error => "no_type1"
      }
      if ![no_type1] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "type_label1"
          }
          on_error => "no_type_label"
        }
      }
      kv {
        source => "kv_1"
        field_split => ","
        value_split => "="
        on_error => "kv1_not_found"
      }
      if [desc] != "" {
        mutate {
          replace => {
            "metadata.description" => "%{desc}"
          }
          on_error => "desc_not_found"
        }
      }


      if [identity] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{identity}"
            "has_principal" => "true"
          }
          on_error => "hostname_not_found"
        }
      }


      if [ref] != "" {
        mutate {
          replace => {
            "principal.url" => "%{ref}"
          }
          on_error => "ref_not_found"
        }
      }
      if [description] != "" {
        mutate {
          replace => {
            "metadata.description" => "%{description}"
          }
          on_error => "description_not_found"
        }
      }
      if [displayName] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{displayName}"
            "has_principal" => "true"
          }
          on_error => "displayName_not_found"
        }
      }
      mutate {
        replace => {
          "type_label.key" => "type"
          "type_label.value.string_value" => "%{type}"
        }
        on_error => "no_type"
      }
      if ![no_type] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "type_label"
          }
          on_error => "no_type_label"
        }
      }

      mutate {
        replace => {
          "principal.user.user_display_name" => "%{display}"
        }
        on_error => "display_not_found"
      }

      mutate {
        replace => {
          "value_label.key" => "value"
          "value_label.value.string_value" => "%{value}"
        }
        on_error => "no_value"
      }
      if ![no_value] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "value_label"
          }
          on_error => "no_value_label"
        }
      }

      if [data_key] != "" and [data_value] != "" {
        mutate {
          replace => {
            "data_label.key" => "%{data_key}"
            "data_label.value.string_value" => "%{data_value}"
          }
          on_error => "data_label_not_found"
        }
        if ![data_label_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "data_label"
            }
            on_error => "data_label_merge_failure"
          }
        }
      }

      if [loop] != "" {
        grok {
          match => {
            "loop" => [
              "%{DATA:ou1}, %{DATA:ou2}, %{DATA:ou3}, %{DATA:ou4}, %{DATA:ou5}, %{DATA:ou6}, %{GREEDYDATA:ou7}"
              "%{DATA:ou1}, %{DATA:ou2}, %{DATA:ou3}, %{DATA:ou4}, %{DATA:ou5}, %{GREEDYDATA:ou6}"
              "%{GREEDYDATA:ou1}"
            ]
          }
            overwrite => ["ou1", "ou2", "ou3", "ou4", "ou5", "ou6","ou7"]
            on_error => "loop_not_found"
        }
      }
      mutate {
        replace => {
          "ou1_label.key" => "ou1"
          "ou1_label.value.string_value" => "%{ou1}"
        }
        on_error => "no_ou1"
      }
      if ![no_ou1] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou1_label"
          }
          on_error => "no_ou1_label"
        }
      }

      mutate {
        replace => {
          "ou2_label.key" => "ou2"
          "ou2_label.value.string_value" => "%{ou2}"
        }
        on_error => "no_ou2"
      }
      if ![no_ou2] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou2_label"
          }
          on_error => "no_ou2_label"
        }
      }

      mutate {
        replace => {
          "ou3_label.key" => "ou3"
          "ou3_label.value.string_value" => "%{ou3}"
        }
        on_error => "no_ou3"
      }
      if ![no_ou3] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou3_label"
          }
          on_error => "no_ou3_label"
        }
      }

      mutate {
        replace => {
          "ou4_label.key" => "ou4"
          "ou4_label.value.string_value" => "%{ou4}"
        }
        on_error => "no_ou4"
      }
      if ![no_ou4] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou4_label"
          }
          on_error => "no_ou4_label"
        }
      }

      mutate {
        replace => {
          "ou5_label.key" => "ou5"
          "ou5_label.value.string_value" => "%{ou5}"
        }
        on_error => "no_ou5"
      }
      if ![no_ou5] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou5_label"
          }
          on_error => "no_ou5_label"
        }
      }

      mutate {
        replace => {
          "ou6_label.key" => "ou6"
          "ou6_label.value.string_value" => "%{ou6}"
        }
        on_error => "no_ou6"
      }
      if ![no_ou6] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou6_label"
          }
          on_error => "no_ou6_label"
        }
      }
      mutate {
        replace => {
          "ou7_label.key" => "ou7"
          "ou7_label.value.string_value" => "%{ou7}"
        }
        on_error => "no_ou7"
      }
      if ![no_ou7] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ou7_label"
          }
          on_error => "no_ou7_label"
        }
      }
    }

    if [left_message_systemd] != "" {
      if [log_origin] != "" {
        mutate {
          replace => {
            "principal.hostname" => "%{log_origin}"
            "has_principal" => "true"
          }
          on_error => "log_origin_not_found"
        }
      }
      if [left_message_systemd] != "" {
        mutate {
          rename => {
            "left_message_systemd" => "metadata.description"
          }
          replace => {
            "metadata.event_type" => "SERVICE_START"
            "target.application" => "SailPointIIQ Web Application"
          }
          on_error => "left_message_systemd_not_found"
        }
      }
    }
  }
  if [application] not in ["", "null"] {
    mutate {
      replace => {
        "principal.application" => "%{application}"
      }
      on_error => "application_not_found"
    }
  }
  if [id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{id}"
      }
      on_error => "id_not_found"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and [action] =~ "login" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [action] =~ "logout" {
    mutate {
      replace => {
        "event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" and [action_value] == "PasswordChange" {
    mutate {
      replace => {
        "event_type" => "USER_CHANGE_PASSWORD"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_not_found"
    }
  }

  mutate {
    rename => {
      "metadata" => "event.idm.read_only_udm.metadata"
    }
    on_error => "metadata_not_found"
  }

  if [about] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.about" => "about"
      }
      on_error => "about_not_found"
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_not_found"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_not_found"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
