# Product: Tanium Discover
# Category: Tanium Specific
# Supported Format: JSON
# Reference: https://docs.tanium.com/discover/discover/discovery.html
# Last Updated: 2022-11-24
# Copyright 2022 Chronicle LLC


filter {

  mutate {
    replace => {
      "MacAddress" => ""
      "MacOrganization" => ""
      "Os"  => ""
      "OsGeneration" => ""
      "Profile" => ""
      "platform" => ""
      "time" => ""
      "Ports" => ""
      "Labels" => ""
      "TaniumComputerId" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_valid_json"
  }

  if [not_valid_json] {
    drop{
      tag => "TAG_UNSUPPORTED"
    }
  } else {
    if [time] != "" {
      date {
        match => ["time", "RFC3339"]
      }
    }

    if [MacAddress] != "" {
      mutate {
        gsub => [ "MacAddress", "[-]", ":"]
        lowercase => [ "MacAddress" ]
        merge => {
          "event.idm.read_only_udm.principal.mac" => "MacAddress"
          "event.idm.read_only_udm.principal.asset.mac" => "MacAddress"
        }
      }
    }

    if [Os] != "" and [OsGeneration] != "" {
      if [Os] == "Windows" {
        mutate {
          replace => {
            "platform" => "WINDOWS"
          }
        }
      }
      else if [Os] == "Linux" {
        mutate {
          replace => {
            "platform" => "LINUX"
          }
        }
      }
      else {
        mutate {
          replace => {
            "platform" => "UNKNOWN_PLATFORM"
          }
        }
      }

      mutate {
        convert => {
          "OsGeneration" => "string"
        }
        on_error => "string_value"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.platform_software.platform" => "%{platform}"
          "event.idm.read_only_udm.principal.asset.platform_software.platform_version" => "%{OsGeneration}"
          # For backwards compatibility...
          "event.idm.read_only_udm.principal.platform" => "%{platform}"
          "event.idm.read_only_udm.principal.platform_version" => "%{OsGeneration}"
        }
      }
    }

    mutate {
      convert => {
        "TaniumComputerId" => "string"
        "CentralizedNmap" => "string"
        "Managed" => "string"
        "Unmanageable" => "string"
      }
    }

    if [Labels] != "" {
      mutate {
        replace => {
          "_about0.key" => "Labels"
          "_about0.value" => "%{Labels}"
        }
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about0"
        }
      }
    }

    if [Profile] != "" {
      mutate {
        replace => {
          "_about1.key" => "Profile"
          "_about1.value" => "%{Profile}"
        }
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about1"
        }
      }
    }

    if [Ports] != "" {
      mutate {
        replace => {
          "_about2.key" => "Ports"
          "_about2.value" => "%{Ports}"
        }
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about2"
        }
      }
    }

    if [TaniumComputerId] != "0" {
      mutate {
        replace => {
          "_about3.key" => "TaniumComputerId"
          "_about3.value" => "%{TaniumComputerId}"
        }
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about3"
        }
      }
    }

    mutate {
      replace => {
        "_about4.key" => "CentralizedNmap"
        "_about4.value" => "%{CentralizedNmap}"
      }
      merge => {
        "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about4"
      }
    }

    mutate {
      replace => {
        "_about5.key" => "Managed"
        "_about5.value" => "%{Managed}"
      }
      merge => {
        "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about5"
      }
    }

    mutate {
      replace => {
        "_about6.key" => "Unmanageable"
        "_about6.value" => "%{Unmanageable}"
      }
      merge => {
        "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about6"
      }
    }

    if [MacOrganization] != "" {
      mutate {
        convert => {
          "MacOrganization" => "string"
        }
        on_error => "mac_organization_already_string"
      }
      mutate {
        replace => {
          "_about7.key" => "MacOrganization"
          "_about7.value" => "%{MacOrganization}"
        }
        merge => {
          "event.idm.read_only_udm.principal.asset.attribute.labels" => "_about7"
        }
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "Tanium"
        "event.idm.read_only_udm.metadata.product_name" => "Discover"
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_NETWORK"
        "event.idm.read_only_udm.principal.hostname" => "%{HostName}"
        "event.idm.read_only_udm.principal.asset.product_object_id" => "TANIUM:%{MacAddress}"
      }
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "IpAddress"
        "event.idm.read_only_udm.principal.asset.ip" => "IpAddress"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
