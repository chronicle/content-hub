        on_error => "email_error"
      }
    }
  }
  else if [user_uid] != ""{
    mutate {
      rename => {
        "user_uid" => "event.idm.read_only_udm.principal.user.userid"
      }
      replace => {
        "has_principal_user" => "true"
      }
      on_error => "invalid_user_uid"
    }
    grok {
      match => {
        "user_uid" => ["%{EMAILADDRESS:email}"]
      }
      on_error => "invalid_email"
    }
    if ![invalid_email] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "user_uid"
        }
        on_error => "invalid_email_address"
      }
      if ![invalid_email_address] {
        mutate {
          replace => {
            "has_principal_user" => "true"
          }
        }
      }
    }
  }

  if [product_data][group] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.group.group_display_name" => "%{product_data.group}"
      }
    }
  }

  if [product_data][logon_error] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{product_data.logon_error}"
      }
    }

    if [product_data][logon_error] == "BlockedByConditionalAccess" {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    }

    if [action] != "" {
      mutate {
        merge => {
          "security_result.action" => "action"
        }
      }
    }

  }

  if [product_data][useragent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{product_data.useragent}"
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge   => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "SYMANTEC_CASB"
      "event.idm.read_only_udm.metadata.vendor_name" => "SYMANTEC"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [product_data][activity_type] == "InvalidLogin"  or [product_data][activity_type] == "Login" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
      }
    }
  }
  else if [product_data][activity_type] == "Update group." or  [product_data][activity_type] == "Create"
  or [product_data][activity_type] == "AddedToGroup" or [product_data][activity_type] =~ "Add member to group."{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GROUP_MODIFICATION"
      }
    }
  }
  else if [product_data][activity_type] == "Add" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GROUP_CREATION"
      }
    }
  }
  else if [product_data][activity_type] == "Add user." {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CREATION"
      }
    }
  }
  else if [product_data][activity_type] == "Share" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_UNCATEGORIZED"
      }
    }
  }
  else if [product_data][activity_type] == "Update"{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [product_data][activity_type] == "Delete"{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_DELETION"
      }
    }
  }
  else if [product_data][activity_type] == "FolderBind"{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [product_data][activity_type] == "Preview"{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_READ"
      }
    }
  }
  else if [product_data][activity_type] == "Undelete" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }
  else if [product_data][activity_type] == "Change user license."{
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [product_data][activity_type] == "Content Inspection Bypass" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_UNCATEGORIZED"
      }
    }
  }
  else if [product_data][_domain] != "" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal_user] == "true" and [has_target] == "true" and [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }

  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
