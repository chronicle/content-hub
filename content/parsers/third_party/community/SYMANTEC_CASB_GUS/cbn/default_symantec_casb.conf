  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:date} %{HOSTNAME:host} icdx: %{GREEDYDATA:json}"
      ],
    }
    on_error => "no_grok_match"
    overwrite => ["json"]
  }

  mutate {
    gsub => ["message","requestId","requestid"]
  }
  mutate {
    gsub => ["message","responseAction","responseaction"]
  }
  mutate {
    gsub => ["message","contentDetails","contentdetails"]
  }

  if [no_grok_match] {
    if [message] =~ "message" {
      mutate {
        gsub => [ "message", "\"message\"", "\"msg\"" ]
      }
    }
    mutate {
      gsub => [ "message", "\'message\'", "\'msg\'" ]
    }
    mutate {
      gsub => ["message","True","true"]
    }
    mutate {
      gsub => ["message","False","false"]
    }
    mutate {
      gsub => ["message","None","\"none\""]
    }

    grok {
      match => {
        "message" => ["{\\'%{GREEDYDATA:single_quote_json}"]
      }
      on_error => "single_quoted_json"
    }
    if ![single_quoted_json] {
      mutate {
        gsub => ["message","\"","\'"]
      }
      grok {
        match => {
          "message" => ["\\'msg\\':\\s+\\'%{DATA:msg}\\',\\s+\\'"]
        }
        on_error => "grok_no_match"
        overwrite => ["msg"]
      }
      mutate {
        gsub => ["message","\\'msg(.*?),\\s\'","\'"]
      }
      mutate {
        gsub => ["message","\\'","\""]
      }
    }
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] {
      mutate {
        drop => {
          tag => "TAG_MALFORMED_JSON"
        }
      }
    }
  }

  if [json] =~ "message" {
    mutate {
      gsub => [ "json", "\"message\"", "\"msg\"" ]
    }
  }

  json {
    source => "json"
    array_function => "split_columns"
    on_error => "not_a_json"
  }

  date {
    match => ["date", "MMM dd HH:mm:ss"]
    rebase => true
    on_error => "date_mismatch"
  }
  if [hosts] != "" {
    mutate {
      gsub => ["hosts",", ",","]
    }
    mutate {
      replace => {
        "hosts" => "{\"hosts\":[\"%{hosts}\"]}"
      }
    }
    mutate {
      gsub => ["hosts",",",",\""]
    }
    mutate {
      gsub => ["hosts",",","\","]
    }
    json {
      source => "hosts"
      array_function => "split_columns"
      on_error => "no_ips"
    }

