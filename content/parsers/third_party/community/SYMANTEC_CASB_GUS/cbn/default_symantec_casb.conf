# Google SecOps Default CBN Parser (SYMANTEC_CASB)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/SYMANTEC_CASB/default/symantec_casb.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "SYMANTEC"
      "event.idm.read_only_udm.metadata.product_name" => "SYMANTEC_CASB"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
