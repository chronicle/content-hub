# Product: Sendmail
# Category: Email Server
# Supported Format: SYSLOG + KV
# Reference: N/A
# Last Updated: 2026-07-24
# Copyright 2026 Google SecOps

filter {

  mutate {
    replace => {
      "src_hostname" => ""
      "src_ip" => ""
      "timestamp" => ""
      "message1" => ""
      "eventid" => ""
      "security_result" => ""
      "syslog_priority" => ""
      "hostname" => ""
      "application" => ""
      "process_id" => ""
      "product_log_id" => ""
      "timezone" => ""
      "delay" => ""
      "xdelay" => ""
      "has_principal" => "false"
      "dsn" => ""
      "mailer" => ""
      "email" => ""
      "target_hostname" => ""
      "action_details" => ""
      "pri" => ""
      "version" => ""
      "verify" => ""
      "bits" => ""
      "STARTTLS" => ""
      "syslog_pri" => ""
      "syslog_version" => ""
      "syslog_prio" => ""
      "mail_id" => ""
      "mail_type" => ""
      "mail_info" => ""
      "from_email" => ""
      "size" => ""
      "nrcpts" => ""
      "class" => ""
      "msgid" => ""
      "proto" => ""
      "daemon" => ""
      "relay_hostname" => ""
      "relay_ip" => ""
      "id" => ""
      "program" => ""
      "pid" => ""
      "msg_id" => ""
      "auth_hostname" => ""
      "sender_name" => ""
      "sender_email" => ""
    }
  }
  mutate {
    gsub => ["message", '\\r\\n', '']
  }
  mutate {
    gsub => ["message", '\\n', '']
  }
  mutate {
    gsub => ["message", '\\"', '']
  }
  grok {
    match => {
      "message" => [
        "%{INT:syslog_prio} <%{INT:syslog_pri}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:src_hostname} %{WORD:program} %{INT:pid} - - \\[ID %{DATA:msg_id}\\] %{NOTSPACE:mail_id}: %{GREEDYDATA:message1}",
        "%{INT:syslog_prio} <%{INT:syslog_pri}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:hostname} %{WORD:program} %{INT:pid} - - \\[ID %{DATA:msg_id}\\] %{NOTSPACE:mail_id}: %{GREEDYDATA:message1}",
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:src_hostname} sendmail(\\[\\d+\\])?: (?P<eventid>([A-Za-z0-9]+: ))?%{GREEDYDATA:message1}",
        "%{SYSLOGTIMESTAMP:timestamp} %{IP:src_ip} sendmail(\\[\\d+\\])?: (?P<eventid>([A-Za-z0-9]+: ))?%{GREEDYDATA:message1}",
        "<%{INT:syslog_priority}>%{TIMESTAMP_ISO8601:timestamp}\\.%{INT}%{ISO8601_TIMEZONE:timezone} %{IPORHOST:src_hostname} %{DATA:application}\\[%{INT:process_id}\\]:\\s+%{DATA:product_log_id}:\\s+to=<%{EMAILADDRESS:email}>%{GREEDYDATA:message1}",
        "<%{INT:syslog_priority}>%{TIMESTAMP_ISO8601:timestamp}\\.%{INT}%{ISO8601_TIMEZONE:timezone} %{IPORHOST:src_hostname} %{DATA:application}\\[%{INT:process_id}\\]: %{GREEDYDATA:message1}",
        "<%{INT:syslog_pri}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:src_hostname} %{WORD:program} %{INT:pid} - - %{NOTSPACE:mail_id}: %{GREEDYDATA:message1}",
        "<%{INT:syslog_pri}>%{INT:syslog_version} %{TIMESTAMP_ISO8601:timestamp} %{HOSTNAME:src_hostname} %{WORD:program} %{INT:pid} - - %{GREEDYDATA:message1}"
      ]
    }
    on_error => "not_sendmail_error"
    overwrite => ["timestamp", "src_hostname", "message1", "src_ip", "eventid", "syslog_priority", "application", "process_id", "product_log_id","timezone", "email", "syslog_pri", "syslog_version", "syslog_prio", "hostname", "program", "mail_id", "pid", "msg_id"]
  }
  if [email] =~ "^.+@.+$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.email" => "%{email}"
      }
      on_error => "invalid_email"
    }
  }

  if [timezone] != "" {
    mutate {
      replace => {
        "timestamp" => "%{timestamp}%{timezone}"
      }
      on_error => "not_timezone_error"
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "MMM d HH:mm:ss"]
      on_error => "not_timestamp_error"
      rebase => true
    }
    if [not_timestamp_error] {
      date {
        match => ["timestamp", "ISO8601","yyyy-MM-ddTHH:mm:ssZZ"]
        on_error => "not_timestamp_error"
      }
    }
  }

  mutate {
    replace => {
      "from" => ""
      "to" => ""
      "relay" => ""
      "stat" => ""
      "msgid" => ""
      "size" => ""
      "cipher" => ""
      "tls_version" => ""
      "tls_verify" => ""
      "bodytype" => ""
    }
  }

  kv {
     source => "message1"
     field_split => ","
     value_split => "="
     unescape_field_split => true
     on_error => "not_kv_error"
  }
  grok {
    match => {
      "message1" => [
        "Authentication-Warning: %{DATA:auth_hostname}: %{DATA:daemon} %{DATA} to %{DATA:sender_name}<%{EMAILADDRESS:sender_email}> %{GREEDYDATA}",
      ]
    }
    on_error => "auth_warning_grok_failed"
    overwrite => ["auth_hostname", "daemon", "sender_name", "sender_email"]
  }

  if ![auth_warning_grok_failed] {
    mutate {
      replace => {
        "security_result.description" => "%{message1}"
      }
      on_error => "invalid_message1"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }

  if [src_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{src_hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{src_hostname}"
        "has_principal" => "true"
      }
      on_error => "invalid_src_hostname"
    }
  }
  if[has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [msgid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.mail_id" => "%{msgid}"
      }
    }
  }

  if [eventid] != "" {
    mutate {
      gsub => ["eventid",": ",""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{eventid}"
      }
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }
  }

  mutate {
    gsub => [
       "from", "<|>", ""
       "to", "<|>", ""
    ]
  }

  if [from] != "" {
    if [from] !~ "^.+@.+$" {
      mutate {
        replace => {
          "from" => "%{from}@local"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
        "event.idm.read_only_udm.network.email.from" => "%{from}"
      }
    }
  }

  if [size] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{size}"
      }
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
    }
  }

  if [to] != "" {
    if [to] !~ "^.+@.+$" {
      mutate {
        replace => {
          "to" => "%{to}@local"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "EMAIL_TRANSACTION"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.network.email.to" => "to"
      }
    }
  }

  if [cipher] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.cipher" => "%{cipher}"
      }
    }
  }

  if [tls_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.version" => "%{tls_version}"
      }
    }
  }
  else if [version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.version" => "%{version}"
      }
      on_error => "invalid_version"
    }
  }

  if [tls_verify] != "" {
    mutate {
      replace => {
        "security_result.description" => "tls_verify - %{tls_verify}"
      }
    }

    if [tls_verify] == "FAIL" {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
        merge => {
          "security_result.action" => "sec_action"
        }
      }
    }
  }
  else if [verify] != "" {
    mutate {
      replace => {
        "security_result.description" => "verify - %{verify}"
      }
      on_error => "invalid_verify"
    }
  }

  if [relay] != "" {

    mutate {
      replace => {
        "_relay_domain" => ""
        "_relay_ip" => ""
      }
    }

    grok {
      match => {
        "relay" => [
          "%{HOSTNAME:_relay_domain}\\.? \\[%{IP:_relay_ip}\\]"
          "%{HOSTNAME:_relay_domain}"
        ]
      }
      overwrite => ["_relay_domain", "_relay_ip"]
      on_error => "invalid_relay_error"
    }

    if [_relay_domain] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{_relay_domain}"
        }
      }
    }

    if [_relay_ip] != "" {
      mutate {
        merge => {
          "intermediary.ip" => "_relay_ip"
        }
      }
    }

    if [_relay_ip] != "" || [_relay_domain] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
      }
    }
  }
  if [stat] != ""{
      grok {
        match => {
          "stat" => [
            "Deferred: Name server: %{HOSTNAME:target_hostname}: %{GREEDYDATA:action_details}"
          ]
        }
        overwrite => ["action_details", "target_hostname"]
        on_error => "invalid_stat_error"
      }
    }

    if [action_details] != "" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action_details}"
        }
        on_error => "action_details_not_found"
      }
    }

    if [target_hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
        }
        on_error => "invalid_target_hostname"
      }
    }

    if [syslog_priority] != "" {
      mutate {
        replace => {
          "syslog_priority_label.key" => "syslog_priority"
          "syslog_priority_label.value.string_value" => "%{syslog_priority}"
        }
        on_error => "syslog_priority_label_error"
      }
      if ![syslog_priority_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "syslog_priority_label"
          }
          on_error => "syslog_priority_label_merge_failed"
        }
      }
    }

    if [pri] != "" {
      mutate {
        replace => {
          "pri_label.key" => "sendmail_pri"
          "pri_label.value.string_value" => "%{pri}"
        }
        on_error => "pri_label_error"
      }
      if ![pri_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "pri_label"
          }
          on_error => "pri_label_merge_failed"
        }
      }
    }

    if [bits] != "" {
      mutate {
        replace => {
          "bits_label.key" => "bits"
          "bits_label.value.string_value" => "%{bits}"
        }
        on_error => "bits_label_error"
      }
      if ![bits_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "bits_label"
          }
          on_error => "bits_label_merge_failed"
        }
      }
    }

    if [STARTTLS] != "" {
      mutate {
        replace => {
          "starttls_label.key" => "STARTTLS"
          "starttls_label.value.string_value" => "%{STARTTLS}"
        }
        on_error => "starttls_label_error"
      }
      if ![starttls_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "starttls_label"
          }
          on_error => "starttls_label_merge_failed"
        }
      }
    }

    if [process_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.pid" => "%{process_id}"
        }
        on_error => "process_id_not_found"
      }
    }

    if [product_log_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{product_log_id}"
        }
        on_error => "records_product_log_id_not_present"
      }
    }

    if [application] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.application" => "%{application}"
        }
        on_error => "app_name_not_found"
      }
    }

    if [dsn] != "" {
      mutate {
        replace => {
          "dsn_label.key" => "dsn"
          "dsn_label.value" => "%{dsn}"
        }
        on_error => "dsn_label_error"
      }
      if ![dsn_label_error] {
        mutate {
          merge => {
            "security_result.detection_fields" => "dsn_label"
          }
          on_error => "dsn_label_merge_failed"
        }
      }
    }

    if [mailer] != "" {
      mutate {
        replace => {
          "mailer_label.key" => "mailer"
          "mailer_label.value" => "%{mailer}"
        }
        on_error => "mailer_label_error"
      }
      if ![mailer_label_error] {
        mutate {
          merge => {
            "security_result.detection_fields" => "mailer_label"
          }
          on_error => "mailer_label_merge_failed"
        }
      }
    }

    if [delay] != "" {
      mutate {
        replace => {
          "delay_label.key" => "delay"
          "delay_label.value.string_value" => "%{delay}"
        }
        on_error => "delay_label_error"
      }
      if ![delay_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "delay_label"
          }
          on_error => "delay_label_merge_failed"
        }
      }
    }

    if [xdelay] != "" {
      mutate {
        replace => {
          "xdelay_label.key" => "xdelay"
          "xdelay_label.value.string_value" => "%{xdelay}"
        }
        on_error => "xdelay_label_error"
      }
      if ![xdelay_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "xdelay_label"
          }
          on_error => "xdelay_label_merge_failed"
        }
      }
    }


  if [stat] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{stat}"
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "invalid_hostname"
    }
  }

  if [program] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{program}"
      }
      on_error => "invalid_program"
    }
  }

  if [pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
      on_error => "invalid_pid"
    }
  }

  if [mail_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{mail_id}"
      }
      on_error => "invalid_mail_id"
    }
  }

  if [syslog_prio] != "" {
    mutate {
      replace => {
        "syslog_prio_label.key" => "syslog_prio"
        "syslog_prio_label.value.string_value" => "%{syslog_prio}"
      }
      on_error => "syslog_prio_label_error"
    }
    if ![syslog_prio_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "syslog_prio_label"
        }
        on_error => "syslog_prio_label_merge_failed"
      }
    }
  }

  if [syslog_pri] != "" {
    mutate {
      replace => {
        "syslog_pri_label.key" => "syslog_pri"
        "syslog_pri_label.value.string_value" => "%{syslog_pri}"
      }
      on_error => "syslog_pri_label_error"
    }
    if ![syslog_pri_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "syslog_pri_label"
        }
        on_error => "syslog_pri_label_merge_failed"
      }
    }
  }

  if [syslog_version] != "" {
    mutate {
      replace => {
        "syslog_version_label.key" => "syslog_version"
        "syslog_version_label.value.string_value" => "%{syslog_version}"
      }
      on_error => "syslog_version_label_error"
    }
    if ![syslog_version_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "syslog_version_label"
        }
        on_error => "syslog_version_label_merge_failed"
      }
    }
  }
  if [bodytype] != "" {
    mutate {
      replace => {
        "bodytype_label.key" => "bodytype"
        "bodytype_label.value.string_value" => "%{bodytype}"
      }
      on_error => "bodytype_label_error"
    }
    if ![bodytype_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "bodytype_label"
        }
        on_error => "bodytype_label_merge_failed"
      }
    }
  }
  if [mail_type] != "" {
    mutate {
      replace => {
        "mail_type_label.key" => "mail_type"
        "mail_type_label.value.string_value" => "%{mail_type}"
      }
      on_error => "mail_type_label_error"
    }
    if ![mail_type_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "mail_type_label"
        }
        on_error => "mail_type_label_merge_failed"
      }
    }
  }

  if [mail_info] != "" {
    mutate {
      replace => {
        "mail_info_label.key" => "mail_info"
        "mail_info_label.value.string_value" => "%{mail_info}"
      }
      on_error => "mail_info_label_error"
    }
    if ![mail_info_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "mail_info_label"
        }
        on_error => "mail_info_label_merge_failed"
      }
    }
  }

  if [class] != "" {
    mutate {
      replace => {
        "class_label.key" => "class"
        "class_label.value.string_value" => "%{class}"
      }
      on_error => "class_label_error"
    }
    if ![class_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "class_label"
        }
        on_error => "class_label_merge_failed"
      }
    }
  }

  if [nrcpts] != "" {
    mutate {
      replace => {
        "nrcpts_label.key" => "nrcpts"
        "nrcpts_label.value.string_value" => "%{nrcpts}"
      }
      on_error => "nrcpts_label_error"
    }
    if ![nrcpts_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "nrcpts_label"
        }
        on_error => "nrcpts_label_merge_failed"
      }
    }
  }

  if [proto] != "" {
    if [proto] == "ESMTP" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "SMTP"
        }
        on_error => "invalid_proto_error"
      }
    }
    else {
      mutate {
        replace => {
          "proto_label.key" => "proto"
          "proto_label.value.string_value" => "%{proto}"
        }
        on_error => "proto_label_error"
      }
      if ![proto_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "proto_label"
          }
          on_error => "proto_label_merge_failed"
        }
      }
    }
  }

  if [msg_id] != "" {
    mutate {
      replace => {
        "msg_id_label.key" => "msg_id"
        "msg_id_label.value.string_value" => "%{msg_id}"
      }
      on_error => "msg_id_label_error"
    }
    if ![msg_id_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "msg_id_label"
        }
        on_error => "msg_id_label_merge_failed"
      }
    }
  }

  if [daemon] != "" {
    mutate {
      replace => {
        "daemon_label.key" => "daemon"
        "daemon_label.value.string_value" => "%{daemon}"
      }
      on_error => "daemon_label_error"
    }
    if ![daemon_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "daemon_label"
        }
        on_error => "daemon_label_merge_failed"
      }
    }
  }
  if [auth_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{auth_hostname}"
      }
      on_error => "invalid_auth_hostname"
    }
    if ![invalid_auth_hostname] {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
        on_error => "invalid_intermediary_merge_failed"
      }
    }
  }
  if [sender_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{sender_name}"
      }
      on_error => "invalid_sender_name"
    }
  }
  if [sender_email] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.email.from" => "%{sender_email}"
      }
      on_error => "invalid_sender_email"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  # Generate output
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
