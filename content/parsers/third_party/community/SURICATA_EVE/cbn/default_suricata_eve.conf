      if ![fileinfo_size_mapping_error] {
        mutate {
          convert => {
            "event1.idm.read_only_udm.target.file.size" => "uinteger"
          }
          on_error => "fileinfo_size_convert_error"
        }
      }
    }
  }
  if [in_iface] != "" {
    mutate {
      replace => {
        "in_iface_label.key" => "in_iface"
        "in_iface_label.value.string_value" => "%{in_iface}"
      }
      on_error => "in_iface_label_error"
    }
    if ![in_iface_label_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "in_iface_label"
        }
        on_error => "in_iface_label_merge_error"
      }
    }
  }
  if [pkt_src] != "" {
    mutate {
      replace => {
        "pkt_src_label.key" => "pkt_src"
        "pkt_src_label.value.string_value" => "%{pkt_src}"
      }
      on_error => "pkt_src_label_error"
    }
    if ![pkt_src_label_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "pkt_src_label"
        }
        on_error => "pkt_src_label_merge_error"
      }
    }
  }
  if [sensor] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.observer.hostname" => "%{sensor}"
      }
      on_error => "sensor_not_found"
    }
  }
  mutate {
    rename => {
      "flow.start" => "addition.flow_start"
      "tx_id" => "addition.tx_id"
      "pcap_cnt" => "addition.pcap_cnt"
      "flow.end" => "addition.flow_end"
      "flow.state" => "addition.flow_state"
      "flow.reason" => "addition.flow_reason"
      "flow.alerted" => "addition.flow_alerted"
      "flow.src_port" => "addition.flow_src_port"
      "flow.dest_port" => "addition.flow_dest_port"
      "anomaly.type" => "addition.anomaly_type"
      "anomaly.layer" => "addition.anomaly_layer"
      "anomaly.app_proto" => "addition.anomaly_app_proto"
      "fileinfo.tx_id" => "addition.fileinfo_tx_id"
      "fileinfo.state" => "addition.fileinfo_state"
      "fileinfo.gaps" => "addition.fileinfo_gaps"
      "fileinfo.stored" => "addition.fileinfo_stored"
      "http.http_port" => "addition.http_port_val"
      "http.http_content_type" => "addition.http_content_type_val"
      "http.hostname" => "addition.http_hostname"
      "tcp.tcp_flags" => "addition.tcp_tcp_flags"
      "tcp.tcp_flags_ts" => "addition.tcp_tcp_flags_ts"
      "tcp.tcp_flags_tc" => "addition.tcp_tcp_flags_tc"
      "tcp.syn" => "addition.tcp_syn"
      "tcp.rst" => "addition.tcp_rst"
      "tcp.psh" => "addition.tcp_psh"
      "tcp.ack" => "addition.tcp_ack"
      "tcp.state" => "addition.tcp_state"
      "tcp.ts_max_regions" => "addition.tcp_ts_max_regions"
      "tcp.tc_max_regions" => "addition.tcp_tc_max_regions"
      "mqtt.publish.topic" => "addition.mqtt_publish_topic"
      "mqtt.publish.message" => "addition.mqtt_publish_message"
      "mqtt.publish.message_id" => "addition.mqtt_publish_message_id"
      "mqtt.publish.qos" => "addition.mqtt_publish_qos"
      "mqtt.publish.retain" => "addition.mqtt_publish_retain"
      "mqtt.publish.dup" => "addition.mqtt_publish_dup"
      "mqtt.pubrec.qos" => "addition.mqtt_pubrec_qos"
      "mqtt.pubrec.retain" => "addition.mqtt_pubrec_retain"
      "mqtt.pubrec.dup" => "addition.mqtt_pubrec_dup"
      "mqtt.pubrec.message_id" => "addition.mqtt_pubrec_message_id"
      "mqtt.pubrel.qos" => "addition.mqtt_pubrel_qos"
      "mqtt.pubrel.retain" => "addition.mqtt_pubrel_retain"
      "mqtt.pubrel.dup" => "addition.mqtt_pubrel_dup"
      "mqtt.pubrel.message_id" => "addition.mqtt_pubrel_message_id"
      "mqtt.pubcomp.qos" => "addition.mqtt_pubcomp_qos"
      "mqtt.pubcomp.retain" => "addition.mqtt_pubcomp_retain"
      "mqtt.pubcomp.dup" => "addition.mqtt_pubcomp_dup"
      "mqtt.pubcomp.message_id" => "addition.mqtt_pubcomp_message_id"
      "pgsql.tx_id" => "addition.pgsql_tx_id"
      "pgsql.request.simple_query" => "addition.pgsql_request_simple_query"
      "pgsql.request.message" => "addition.pgsql_request_message"
      "pgsql.request.secret_key" => "addition.pgsql_request_secret_key"
      "pgsql.request.protocol_version" => "addition.pgsql_protocol_version"
      "pgsql.response.authentication_md5_password" => "addition.pgsql_auth_md5"
      "pgsql.response.command_completed" => "addition.pgsql_response_command_completed"
      "pgsql.response.accepted" => "addition.pgsql_response_accepted"
      "pgsql.response.data_rows" => "addition.pgsql_response_data_rows"
      "pgsql.response.field_count" => "addition.pgsql_response_field_count"
    }
  }
  for key1,value1 in addition map {
    mutate {
      replace => {
        "field1_label_detection" => ""
        "field1_label_additional" => ""
        "check" => ""
      }
    }
    mutate {
      convert => {
        "value1" => "string"
      }
      on_error => "value1_string"
    }
    mutate {
      replace => {
        "check" => "%{value1}"
      }
      on_error => "check_empty"
    }
    if ![check_empty] && [check] != "" {
      if [key1] in ["anomaly_layer", "anomaly_type"] {
        mutate {
          replace => {
            "field1_label_detection.key" => "%{key1}"
            "field1_label_detection.value" => "%{value1}"
          }
          on_error => "field1_error"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "field1_label_detection"
          }
          on_error => "field1_merge_error"
        }
      }
      else {
        mutate {
          replace => {
            "field1_label_additional.key" => "%{key1}"
            "field1_label_additional.value.string_value" => "%{value1}"
          }
          on_error => "value_not_found_additional"
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "field1_label_additional"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }

  if [event_type] =~ "(?i)dns" && [has_question_name] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_DNS"
        "event1.idm.read_only_udm.network.application_protocol" => "DNS"
      }
