  else if [has_principal] == "true" && [is_dhcp] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.application_protocol" => "DHCP"
        "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_DHCP"
      }
    }
  }
  else if [has_principal] == "true" && [has_target] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }

  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
      }
    }
  }
  mutate {
    replace => {
      "event1.idm.read_only_udm.metadata.product_name" => "SURICATA_EVE"
      "event1.idm.read_only_udm.metadata.vendor_name" => "SURICATA"
    }
  }

  mutate {
    merge => {
      "@output" => "event1"
    }
  }
}
