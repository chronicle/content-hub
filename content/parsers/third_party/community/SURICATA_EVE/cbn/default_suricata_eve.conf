      "alert.severity" => ""
      "alert.source.ip" => ""
      "alert.source.port" => ""
      "alert.target.ip" => ""
      "alert.target.port" => ""
      "tls.sni" => ""
      "tls.issuerdn" => ""
      "tls.subject" => ""
      "tls.serial" => ""
      "tls.version" => ""
      "tls.ja3.hash" => ""
      "tls.ja3.string" => ""
      "tls.ja3s.hash" => ""
      "tls.ja3s.string" => ""
      "tls.ja4" => ""
      "tls.fingerprint" => ""
      "tls.notbefore" => ""
      "tls.notafter" => ""
      "event.module" => ""
      "event.dataset" => ""
      "event.duration" => ""
      "service.type" => ""
      "agent.hostname" => ""
      "agent.type" => ""
      "agent.name" => ""
      "agent.id" => ""
      "agent.version" => ""
      "agent.ephemeral_id" => ""
      "about" => ""
      "ecs.version" => ""
      "process.executable" => ""
      "process.pid" => ""
      "process.command_line" => ""
      "category" => ""
      "security_result" => ""
      "is_principal_hostname_present" => "false"
      "direction" => ""
      "dstnetwork" => ""
      "application_port" => ""
      "dns.version" => ""
      "dns.type" => ""
      "dns.opcode" => ""
      "dns.flags" => ""
      "dns.rd" => ""
      "dns.tx_id" => ""
      "dns.rrname" => ""
      "dns.rrtype" => ""
      "dns.id" => ""
      "dns_question" => ""
      "see_id" => ""
      "discovery" => ""
      "alert.metadata.stamus_classification" => ""
      "stamus_data" => ""
      "alert.metadata.sightings_key" => ""
      "sightings_data" => ""
      "alert.metadata.sightings_asset" => ""
      "asset_data" => ""
      "alert.metadata.attack_target" => ""
      "alert.metadata.confidence" => ""
      "alert.metadata.created_at" => ""
      "alert.metadata.deployment" => ""
      "alert.metadata.signature_severity" => ""
      "alert.metadata.tag" => ""
      "alert.metadata.updated_at" => ""
      "tftp.file" => ""
      "tftp.mode" => ""
      "tftp.packet" => ""
      "dhcp.type" => ""
      "dhcp.dhcp_type" => ""
      "dhcp.assigned_ip" => ""
      "dhcp.client_mac" => ""
      "dhcp.id" => ""
      "dhcp.renewal_time" => ""
      "ssh.client.hassh.hash" => ""
      "ssh.client.hassh.string" => ""
      "ssh.client.proto_version" => ""
      "ssh.client.software_version" => ""
      "ssh.server.hassh.hash" => ""
      "ssh.server.hassh.string" => ""
      "ssh.server.proto_version" => ""
      "ssh.server.software_version" => ""
      "ftp.reply" => ""
      "ftp.reply_received" => ""
      "ftp.reply_truncated" => ""
      "ftp.completion_code" => ""
      "smb.id" => ""
      "smb.tree_id" => ""
      "smb.dialect" => ""
      "smb.client_dialects" => ""
      "smb.session_id" => ""
      "smb.server_guid" => ""
      "smb.command" => ""
      "smb.fuid" => ""
      "smb.accessed" => ""
      "smb.status" => ""
      "smb.disposition" => ""
      "smb.filename" => ""
      "smb.created" => ""
      "smb.status_code" => ""
      "smb.access" => ""
      "smb.ext_status.facility" => ""
      "smb.ext_status.text" => ""
      "smb.ext_status.short_code" => ""
      "smb.ext_status.severity" => ""
      "smb.ext_status.customer" => ""
      "smb.size" => ""
      "smb.changed" => ""
      "smb.modified" => ""
      "http_protocol" => ""
      "http_hostname" => ""
      "http_url" => ""
      "alert.gid" => ""
      "files" => ""
      "http_length" => ""
      "pkt_src" => ""
      "sensor" => ""
      "dns.ra" => ""
      "dns.rcode" => ""
      "dns.authorities" => ""
      "dns.answers" => ""
      "soa_serial" => ""
      "dns.qr" => ""
      "alert.signature_id" => ""
      "dhcp_client_ip" => ""
      "dhcp_client_id" => ""
      "has_param_values" => "false"
      "dhcp_hostname" => ""
      "dhcp_vendor_class_identifier" => ""
      "is_dhcp" => "false"
      "has_principal" => "false"
      "has_question_name" => "false"
      "has_target" => "false"
      "ether_src_mac" => ""
      "ether_dest_mac" => ""
      "http_version" => ""
      "fileinfo" => ""
      "flow_exception_target" => ""
      "flow_exception_policy" => ""
      "tcp_flags" => ""
      "tcp_flags_ts" => ""
      "tcp_flags_tc" => ""
      "tcp_syn" => ""
      "tcp_rst" => ""
      "tcp_psh" => ""
      "tcp_ack" => ""
      "tcp_state" => ""
      "tcp_ts_max_regions" => ""
      "tcp_tc_max_regions" => ""
      "tcp" => ""
      "mac_val" => ""
      "policy_entry" => ""
      "index" => ""
      "http_port_val" => ""
      "http_content_type_val" => ""
      "flow_start" => ""
      "anomaly" => ""
      "mqtt" => ""
      "mqtt_publish_topic" => ""
      "mqtt_publish_message" => ""
      "mqtt_publish_message_id" => ""
      "mqtt_publish_qos" => ""
      "mqtt_publish_retain" => ""
      "mqtt_publish_dup" => ""
      "mqtt_pubrec_qos" => ""
      "mqtt_pubrec_retain" => ""
      "mqtt_pubrec_dup" => ""
      "mqtt_pubrec_message_id" => ""
      "mqtt_pubrel_qos" => ""
      "mqtt_pubrel_retain" => ""
      "mqtt_pubrel_dup" => ""
      "mqtt_pubrel_message_id" => ""
      "mqtt_pubcomp_qos" => ""
      "mqtt_pubcomp_retain" => ""
      "mqtt_pubcomp_dup" => ""
      "mqtt_pubcomp_message_id" => ""
      "pgsql" => ""
      "pgsql_tx_id" => ""
      "pgsql_response" => ""
      "pgsql_response_accepted" => ""
      "pgsql_protocol_version" => ""
      "pgsql_user" => ""
      "pgsql_database" => ""
      "pgsql_client_encoding" => ""
      "pgsql_auth_md5" => ""
      "param_app_name" => ""
      "param_client_enc" => ""
      "pgsql_response_data_rows" => ""
      "pgsql_response_command_completed" => ""
      "pgsql_response_data_size" => ""
      "pgsql_response_field_count" => ""
      "pgsql_request_simple_query" => ""
      "pgsql_request_message" => ""
      "pgsql_request_process_id" => ""
      "pgsql_request_secret_key" => ""
      "flow.exception_policy" => ""
      "flow_bytes_toclient" => ""
      "flow_bytes_toserver" => ""
      "anomaly_app_proto" => ""
      "anomaly_layer" => ""
      "anomaly_type" => ""
      "app_protocol_src" => ""
      "app_protocol_output" => ""
      "fileinfo_tx_id" => ""
      "fileinfo_state" => ""
      "fileinfo_gaps" => ""
      "fileinfo_stored" => ""
      "field1_label_detection" => ""
      "field1_label_additional" => ""
      "flow_src_port" => ""
      "flow_dest_port" => ""
    }
  }

  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601} %{WORD} %{WORD} ([- ]+)?%{GREEDYDATA:message}"
    }
    overwrite => ["message"]
    on_error => "no_syslog_header"
  }

  if [message] != "" {
    json {
      on_error => "not_json"
      source => "message"
      array_function => "split_columns"
    }
  }
  if [not_json] {
    drop{
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [alert][metadata][stamus_classification] != "" {
    for stamus in alert.metadata.stamus_classification {
      mutate {
        replace => {
          "value_array" => ""
        }
      }
      mutate {
        replace => {
          "value_array.string_value" => "%{stamus}"
        }
        on_error => "stamus_data_empty"
      }
      mutate {
        merge => {
          "stamus_data.value.list_value.values" => "value_array"
        }
        on_error => "stamus_data_not_found"
      }
      if [value_array] != "" {
        mutate {
          replace => {
            "stamus_data_available" => "true"
          }
        }
      }
    }
    if [stamus_data_available] == "true" {
      mutate {
        replace => {
          "stamus_data.key" => "stamus_classification"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "stamus_data"
        }
        on_error => "stamus_data_field_not_found"
      }
    }
  }

  if [alert][metadata][sightings_key] != "" {
    for sightings in alert.metadata.sightings_key {
      mutate {
        replace => {
          "value_array" => ""
        }
      }
      mutate {
        replace => {
          "value_array.string_value" => "%{sightings}"
        }
        on_error => "sightings_data_empty"
      }
      mutate {
        merge => {
          "sightings_data.value.list_value.values" => "value_array"
        }
        on_error => "sightings_data_not_found"
      }
      if [value_array] != "" {
        mutate {
          replace => {
            "sightings_data_available" => "true"
          }
        }
      }
    }
    if [sightings_data_available] == "true" {
      mutate {
        replace => {
          "sightings_data.key" => "sightings_key"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "sightings_data"
        }
        on_error => "sightings_data_field_not_found"
      }
    }
  }

  if [alert][metadata][sightings_asset] != "" {
    for asset in alert.metadata.sightings_asset {
      mutate {
        replace => {
          "value_array" => ""
        }
      }
      mutate {
        replace => {
          "value_array.string_value" => "%{asset}"
        }
        on_error => "asset_data_empty"
      }
      mutate {
        merge => {
          "asset_data.value.list_value.values" => "value_array"
        }
        on_error => "asset_data_not_found"
      }
      if [value_array] != "" {
        mutate {
          replace => {
            "asset_data_available" => "true"
          }
        }
      }
    }
    if [asset_data_available] == "true" {
      mutate {
        replace => {
          "asset_data.key" => "sightings_asset"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "asset_data"
        }
        on_error => "asset_data_field_not_found"
      }
    }
  }

  if [@timestamp] != "" {
    date {
      match => ["@timestamp", "ISO8601","UNIX","UNIX_MS"]
    }
  }
  else if[timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601","UNIX","UNIX_MS"]
    }
  }

  if [src_ip] != "" {
    grok {
      match => {
        "src_ip" => "%{IP:tmp_src_ip}"
      }
      overwrite => [ "tmp_src_ip" ]
      on_error => "src_ip_grok_error"
    }
    if ![src_ip_grok_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "tmp_src_ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "tmp_src_ip"
        }
        on_error => "ip_merge_error"
      }
      if ![ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [src_port] != "" {
    mutate {
      convert => {
        "src_port" => "integer"
      }
    }
    mutate {
      rename => {
        "src_port" => "event1.idm.read_only_udm.principal.port"
      }
    }
  }
  if [src_FQDN] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.hostname" => "%{src_FQDN}"
        "event1.idm.read_only_udm.principal.asset.hostname" => "%{src_FQDN}"
        "is_principal_hostname_present" => "true"
        "has_principal" => "true"
      }
      on_error => "hostname_error"
    }
  }

  if [dest_port] != "" {
    mutate {
      convert => {
        "dest_port" => "integer"
      }
    }
    mutate {
      rename => {
        "dest_port" => "event1.idm.read_only_udm.target.port"
      }
    }
  }
  mutate {
    replace => {
      "ether_src_mac" => "%{ether.src_mac}"
    }
    on_error => "ether_src_mac_error"
  }
  if [ether_src_mac] != "" {
    grok {
      match => {
        "ether_src_mac" => "%{MAC:tmp_ether_src_mac}"
      }
      overwrite => [ "tmp_ether_src_mac" ]
      on_error => "ether_src_mac_format_error"
    }
    if ![ether_src_mac_format_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.mac" => "tmp_ether_src_mac"
          "event1.idm.read_only_udm.principal.asset.mac" => "tmp_ether_src_mac"
        }
        on_error => "ether_src_mac_merge_error"
      }
    }
  }
  for index, mac_val in ether.src_macs {
    if [mac_val] != "" {
      mutate {
        replace => {
          "tmp_mac_val" => ""
        }
      }
      grok {
        match => {
          "mac_val" => "%{MAC:tmp_mac_val}"
        }
        overwrite => [ "tmp_mac_val" ]
        on_error => "ether_src_mac_val_format_error"
      }
      if ![ether_src_mac_val_format_error] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.principal.mac" => "tmp_mac_val"
            "event1.idm.read_only_udm.principal.asset.mac" => "tmp_mac_val"
          }
          on_error => "ether_src_mac_val_merge_error"
        }
      }
    }
  }
  mutate {
    replace => {
      "ether_dest_mac" => "%{ether.dest_mac}"
    }
    on_error => "ether_dest_mac_error"
  }
  if [ether_dest_mac] != "" {
    grok {
      match => {
        "ether_dest_mac" => "%{MAC:tmp_ether_dest_mac}"
      }
      overwrite => [ "tmp_ether_dest_mac" ]
      on_error => "ether_dest_mac_format_error"
    }
    if ![ether_dest_mac_format_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.mac" => "tmp_ether_dest_mac"
          "event1.idm.read_only_udm.target.asset.mac" => "tmp_ether_dest_mac"
        }
        on_error => "ether_dest_mac_merge_error"
      }
    }
  }
  for index, mac_val in ether.dest_macs {
    if [mac_val] != "" {
      mutate {
        replace => {
          "tmp_dest_mac_val" => ""
        }
      }
      grok {
        match => {
          "mac_val" => "%{MAC:tmp_dest_mac_val}"
        }
        overwrite => [ "tmp_dest_mac_val" ]
        on_error => "ether_dest_mac_val_format_error"
      }
      if ![ether_dest_mac_val_format_error] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.mac" => "tmp_dest_mac_val"
            "event1.idm.read_only_udm.target.asset.mac" => "tmp_dest_mac_val"
          }
          on_error => "ether_dest_mac_val_merge_error"
        }
      }
    }
  }
  if [direction] != "" {
    mutate {
      replace => {
        "direction_label.key" => "direction"
        "direction_label.value.string_value" => "%{direction}"
      }
      on_error => "direction_label_error"
    }
    if ![direction_label_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "direction_label"
        }
        on_error => "direction_label_merge_error"
      }
    }
  }
  if [payload_printable] != "" {
    mutate {
      replace => {
        "payload_printable_label.key" => "payload_printable"
        "payload_printable_label.value.string_value" => "%{payload_printable}"
      }
      on_error => "payload_printable_label_error"
    }
    if ![payload_printable_label_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "payload_printable_label"
        }
        on_error => "payload_printable_label_merge_error"
      }
    }
  }
  if [dest_ip] != "" {
    grok {
      match => {
        "dest_ip" => "%{IP:tmp_dest_ip}"
      }
      overwrite => [ "tmp_dest_ip" ]
      on_error => "dest_ip_grok_error"
    }
    if ![dest_ip_grok_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip" => "tmp_dest_ip"
          "event1.idm.read_only_udm.target.asset.ip" => "tmp_dest_ip"
        }
        on_error => "target_ip_error"
      }
      if ![target_ip_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  if [dest_FQDN] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.hostname" => "%{dest_FQDN}"
        "event1.idm.read_only_udm.target.asset.hostname" => "%{dest_FQDN}"
      }
      on_error => "dest_FQDN_target_host_error"
    }
    if ![dest_FQDN_target_host_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  else if [tls][sni] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.hostname" => "%{tls.sni}"
        "event1.idm.read_only_udm.target.asset.hostname" => "%{tls.sni}"
      }
      on_error => "target_host_error"
    }
    if ![target_host_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [dest_geoip] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.location.city" => "%{dest_geoip.city_name}"
        "event1.idm.read_only_udm.target.location.state" => "%{dest_geoip.region_name}"
        "event1.idm.read_only_udm.target.location.country_or_region" => "%{dest_geoip.country_name}"
        "event1.idm.read_only_udm.target.location.name" => "%{dest_geoip.region_code}"
      }
    }
  }

  if [proto] != "" {
    grok {
      match =>  {
        "proto" => "IPv6-%{WORD:proto}"
      }
      overwrite => ["proto"]
      on_error => "protocol_failure"
    }
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.ip_protocol" => "%{proto}"
      }
    }
  }

  if [community_id] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.community_id" => "%{community_id}"
      }
    }
  }
  if [flow] != "" {
    mutate {
      replace => {
        "flow_src_ip" => "%{flow.src_ip}"
      }
      on_error => "no_flow_src_ip"
    }
    if ![no_flow_src_ip] and [flow_src_ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "flow_src_ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "flow_src_ip"
        }
        on_error => "flow_src_ip_error"
      }
      if ![flow_src_ip_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    mutate {
      replace => {
        "flow_dest_ip" => "%{flow.dest_ip}"
      }
      on_error => "no_flow_dest_ip"
    }
    if ![no_flow_dest_ip] and [flow_dest_ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip" => "flow_dest_ip"
          "event1.idm.read_only_udm.target.asset.ip" => "flow_dest_ip"
        }
        on_error => "flow_dest_ip_error"
      }
      if ![flow_dest_ip_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    mutate {
      convert => {
        "flow.pkts_toserver" => "string"
      }
      on_error => "no_pkts_toserver"
    }
    if ![no_pkts_toserver] {
      mutate {
        replace => {
          "pkts_toserver_label.key" => "pkts_toserver"
