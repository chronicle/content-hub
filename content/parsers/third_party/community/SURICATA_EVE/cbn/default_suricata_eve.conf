      "flow_dest_ip" => ""
      "pkts_toserver_val" => ""
      "pkts_toclient_val" => ""
      "path" => ""
      "proto" => ""
      "host" => ""
      "src_FQDN" => ""
      "dest_port" => ""
      "dest_ip" => ""
      "packet" => ""
      "app_proto" => ""
      "src_port" => ""
      "in_iface" => ""
