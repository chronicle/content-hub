      "details_instance_id_label.key" => "details_server_instance_id"
      "details_instance_id_label.value" => "%{details.server.instance_details.instance_id}"
    }
    on_error => "instance_id_not_found"
  }
  if ![instance_id_not_found] {
    mutate {
      merge => {
          "intermediary_value.resource.attribute.labels" => "details_instance_id_label"
      }
      on_error => "instance_id_merge_error"
    }
  }
  grok {
    match => {
      "details.server.instance_details.internal_ip" => "%{IP:internal_ip}"
    }
    overwrite => ["internal_ip"]
    on_error => "internal_ip_grok_failed"
  }
  if ![internal_ip_grok_failed] {
    mutate {
      merge => {
        "intermediary_value.ip" => "internal_ip"
      }
      on_error => "internal_ip_not_found"
    }
  }
  mutate {
    replace => {
      "details_network_label.key" => "server_network"
      "details_network_label.value" => "%{details.server.instance_details.network}"
    }
    on_error => "network_not_found"
  }
  if ![network_not_found] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_network_label"
      }
      on_error => "network_merge_error"
    }
  }
  mutate {
    replace => {
      "details_project_id_label.key" => "server_project_id"
      "details_project_id_label.value" => "%{details.server.instance_details.project_id}"
    }
    on_error => "project_id_not_found_3"
  }
  if ![project_id_not_found_3] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_project_id_label"
      }
      on_error => "project_id_merge_error"
    }
  }
  mutate {
    replace => {
      "intermediary_value.location.country_or_region" => "%{details.server.instance_details.zone_id}"
    }
    on_error => "zone_id_not_found"
  }
  mutate {
    replace => {
      "details_instance_id_label2.key" => "server_instance_id"
      "details_instance_id_label2.value" => "%{details.server.instance_id}"
    }
    on_error => "instance_id_not_found2"
  }
  if ![instance_id_not_found2] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_instance_id_label2"
      }
      on_error => "instance_id_merge_error2"
    }
  }
  mutate {
    replace => {
      "details_server_os" => "%{details.server.os}"
    }
    on_error => "details_server_os_not_found"
  }
  if ![details_server_os_not_found] {
    if [details_server_os] =~ "(?i)Linux|linux" {
      mutate {
        replace => {
          "intermediary_value.platform" => "LINUX"
        }
      }
    }
    else if [details_server_os] =~ "(?i)windows" {
      mutate {
        replace => {
          "intermediary_value.platform" => "WINDOWS"
        }
      }
    }
    else if [details_server_os] =~ "(?i)mac|ios" {
      mutate {
        replace => {
          "intermediary_value.platform" => "MAC"
        }
      }
    }
  }
  mutate {
    replace => {
      "details_server_os_label.key" => "details_server_os"
      "details_server_os_label.value" => "%{details.server.os}"
    }
    on_error => "details_server_os_not_replaced"
  }
  if ![details_server_os_not_replaced] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_server_os_label"
      }
        on_error => "last_seen_merge_error"
    }
  }
  mutate {
    date => ["last_seen", "ISO8601"]
    on_error => "last_seen_not_found"
  }
  for index, services in details.server.services {
    mutate {
      convert => {
        "index" => "string"
      }
    }
    mutate {
      replace => {
        "services_label" => ""
      }
    }
    mutate {
      replace => {
        "services_label.key" => "server_services %{index}"
        "services_label.value" => "%{services}"
      }
      on_error => "services_not_found"
    }
    if ![services_not_found] {
      mutate {
        merge => {
          "intermediary_value.resource.attribute.labels" => "services_label"
        }
        on_error => "services_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_version" => "%{details.server.sftd_version}"
    }
    on_error => "sftd_version_not_found"
  }
  mutate {
    replace => {
      "details_server_source_label.key" => "server_source"
      "details_server_source_label.value" => "%{details.server.source}"
    }
    on_error => "server_source_not_found"
  }
  if ![server_source_not_found] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_server_source_label"
      }
      on_error => "server_source_merge_error"
    }
  }
  mutate {
    replace => {
      "intermediary_value.resource.name" => "%{details.server.project_name}"
    }
    on_error => "project_name_not_found"
  }
  mutate {
    replace => {
      "details_source_details_cloud_account_label.key" => "server_source_details_cloud_account"
      "details_source_details_cloud_account_label.value" => "%{details.server.source_details.cloud_account}"
    }
    on_error => "source_details_not_found_1"
  }
  if ![source_details_not_found_1] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_source_details_cloud_account_label"
      }
      on_error => "source_details_merge_error"
    }
  }
  mutate {
    replace => {
      "details_source_deails_cloud_provider_label.key" => "server_source_details_cloud_provider"
      "details_source_deails_cloud_provider_label.value" => "%{details.server.source_details.cloud_provider}"
    }
    on_error => "source_details_not_found_2"
  }
  if ![source_details_not_found_2] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_source_deails_cloud_provider_label"
      }
      on_error => "source_details_merge_error"
    }
  }
  mutate {
    replace => {
      "details_source_details_instance_id_label.key" => "server_source_details_instance_id"
      "details_source_details_instance_id_label.value" => "%{details.server.source_details.instance_id}"
    }
    on_error => "source_details_not_found_3"
  }
  if ![source_details_not_found_3] {
    mutate {
      merge => {
        "intermediary_value.resource.attribute.labels" => "details_source_details_instance_id_label"
      }
      on_error => "source_details_merge_error"
    }
  }
  mutate {
    merge => {
      "intermediary_value.user.department" => "details.server.team_name"
    }
    on_error => "team_name_not_found_2"
  }
  mutate {
    date => ["registered_at", "ISO8601"]
    on_error => "registered_at_not_found"
  }
  if [intermediary_value] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary_value"
      }
      on_error => "intermediary_merge_error"
    }
  }

  mutate {
    replace => {
      "details_username" => "%{details.username}"
    }
    on_error => "details_username_not_found"
  }
  if [details_username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.user_display_name" => "%{details_username}"
      }
      on_error => "details_username_not_replaced"
    }
  }
  mutate {
    replace => {
      "fingerprint_label.key" => "ssh_key_fingerprint"
      "fingerprint_label.value" => "%{details.ssh_key_fingerprint}"
    }
    on_error => "fingerprint_label_not_replaced"
  }
  if ![fingerprint_label_not_replaced] {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "fingerprint_label"
      }
      on_error => "fingerprint_label_merge_failed"
    }
  }
  mutate {
    replace => {
      "x509_fingerprint_label.key" => "x509_key_fingerprint"
      "x509_fingerprint_label.value" => "%{details.x509_key_fingerprint}"
    }
    on_error => "x509_fingerprint_label_not_replaced"
  }
  if ![x509_fingerprint_label_not_replaced] {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "x509_fingerprint_label"
      }
      on_error => "x509_fingerprint_label_merge_failed"
    }
  }
  mutate {
    convert => {
      "details.project.next_unix_gid" => "string"
    }
  }
  mutate {
    replace => {
      "gid_label.key" => "next_unix_gid"
      "gid_label.value" => "%{details.project.next_unix_gid}"
    }
    on_error => "gid_label_not_replaced"
  }
  if ![gid_label_not_replaced] {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "gid_label"
      }
      on_error => "gid_label_merge_failed"
    }
  }
  mutate {
    convert => {
      "details.project.next_unix_uid" => "string"
    }
  }
  mutate {
    replace => {
      "uid_label.key" => "next_unix_uid"
      "uid_label.value" => "%{details.project.next_unix_uid}"
    }
    on_error => "uid_label_not_replaced"
  }
  if ![uid_label_not_replaced] {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "uid_label"
      }
      on_error => "uid_label_merge_failed"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.network.tls.cipher" => "%{details.ssh_algorithm}"
    }
    on_error => "ssh_algorithm_not_found"
  }

  for index,alt_name in details.server.alt_names {
    mutate {
      convert => {
        "index" => "string"
      }
    }
    if [index] == "0" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{alt_name}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{alt_name}"
        }
        on_error => "no_alt_names"
      }
    }
    else {
      mutate {
        replace => {
          "alt_name_label.key" => "alt_name"
          "alt_name_label.value" => "%{alt_name}"
        }
        on_error => "alt_name_not_replaced"
      }
      if ![alt_name_not_replaced] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "alt_name_label"
          }
          on_error => "alt_name_merge_failed"
        }
      }
    }
  }

  if [details][project] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.attribute.cloud.project.name" => "%{details.project}"
      }
      on_error => "project_not_found"
    }
  }
  if [details][user_access_method] != "" {
    grok {
      match => {
        "details.user_access_method" => [
          "%{GREEDYDATA:desc} for server %{GREEDYDATA:asset_id}"
        ]
      }
      overwrite => ["asset_id", "desc"]
      on_error => "user_access_method_grok_failed"
    }
    if [desc] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{desc}"
        }
      }
    }
    if [asset_id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.asset.asset_id" => "%{asset_id}"
        }
        on_error => "asset_id_not_found"
      }
    }
  }
  if ([has_principal_user] == "true" and [has_target_user] == "true") or ([has_principal_user] == "true" and [has_target] == "true" and [details_type] =~ "login") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "SSO"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_error"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "OKTA_SCALEFT"
      "event.idm.read_only_udm.metadata.product_name" => "OKTA_SCALEFT"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
