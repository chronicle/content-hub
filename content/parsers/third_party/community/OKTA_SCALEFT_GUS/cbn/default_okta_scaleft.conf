    gsub => ["message","x]",'x"]']
  }
  mutate {
    gsub => ["message",'"":','":']
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "message_json_parse_failure"
  }
  if [id] != "" {
    mutate {
      replace => {
        "id_label.key" => "id"
        "id_label.value.string_value" => "%{id}"
      }
      on_error => "id_value_invalid"
    }
