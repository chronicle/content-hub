# Product: KUBERNETES_AUDIT_AZURE
# Category: Log Aggregator
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-12-11

filter {
  mutate {
    replace => {
      "records" => ""
    }
  }
  mutate {
    gsub => [ "message", "\\\r\\\n", "" ]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [records] == "" {
    mutate {
      replace => {
        "message" => "{\"records\":[%{message}]}"
      }
      on_error => "records_not_found"
    }
    if ![records_not_found] {
      json {
        source => "message"
        array_function => "split_columns"
        on_error => "not_a_json"
      }
    }
  }
  if [records] != "" {
    for record in records {
      mutate {
        replace => {
          "record_time" => ""
          "event" => ""
          "security_action" => ""
          "sec_result" => ""
          "principal_userid" => ""
          "event_type" => ""
        }
      }

      json {
        source => "record.properties.log"
        array_function => "split_columns"
        target => "record.properties.log"
        on_error => "properties_not_json"
      }

      if [message] =~ "properties.*log.*annotations.*authorization.*k8s" {
        mutate {
          replace => {
            "security_action" => "%{record.properties.log.annotations.authorization.k8s.io/decision}"
           }
           on_error => "decision_field_not_prresent"
        }

        if ![decision_field_not_prresent] {
          if [security_action] == "allow"{
            mutate{
              replace =>{
                "security_action" => "ALLOW"
              }
            }
            mutate {
              merge => {
                "sec_result.action" => "security_action"
              }
            }
          }
        }

        mutate {
          replace => {
            "sec_result.description" => "%{record.properties.log.annotations.authorization.k8s.io/reason}"
          }
          on_error => "reason_field_not_present"
        }

        mutate {
          gsub => [ "sec_result.description", '\\"', "" ]
        }
        if [sec_result] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.security_result" => "sec_result"
            }
          }
        }
      }

      mutate {
        replace =>{
          "event.idm.read_only_udm.metadata.product_version" => "%{record.properties.log.apiVersion}"
        }
        on_error => "field_not_present"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{record.properties.log.auditID}"
        }
        on_error => "field_not_present"
      }

      mutate{
        replace => {
          "event.idm.read_only_udm.target.resource.name" => "%{record.properties.log.objectRef.name}"
        }
        on_error => "field_not_present"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.resource_subtype" => "%{record.properties.log.objectRef.resource}"
        }
        on_error => "field_not_present"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{record.properties.log.objectRef.uid}"
        }
        on_error => "field_not_present"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.url" => "%{record.properties.log.requestURI}"
        }
        on_error => "field_not_present"
      }
      mutate {
        replace => {
          "reason_label.key" => "reason"
          "reason_label.value.string_value" => "%{record.properties.log.responseStatus.reason}"
        }
        on_error => "field_not_present"
      }
      if ![field_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "reason_label"
          }
          on_error => "reason_label_field_not_present"
        }
      }
      mutate {
        replace => {
          "pod_label.key" => "pod"
          "pod_label.value.string_value" => "%{record.properties.pod}"
        }
        on_error => "pod_field_not_present"
      }
      if ![pod_field_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "pod_label"
          }
          on_error => "pod_label_field_not_present"
        }
      }
      mutate {
        convert => {
          "record.properties.log.responseStatus.code" => "integer"
        }
        on_error => "already_integer"
      }
      mutate {
        rename => { 
          "record.properties.log.responseStatus.code" => "event.idm.read_only_udm.network.http.response_code"
        }
        on_error => "field_not_present"
      }

      for ip in record.properties.log.sourceIPs {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "ip"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{record.properties.log.stage}"
        }
        on_error => "field_not_present"
      }

      date {
        match => ["record.stageTimestamp", "ISO8601"]
        target => "event.idm.read_only_udm.metadata.collected_timestamp"
        on_error => "stage_time_not_present"
      }

      for groupname in record.properties.log.user.groups {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.group_identifiers" => "groupname"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.user_display_name" => "%{record.properties.log.user.username}"
        }
        on_error => "field_not_present"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{record.properties.log.userAgent}"
        }
        on_error => "field_not_present"
      }

      mutate {
        replace => {
          "principal_userid" => "%{record.properties.log.user.uid}"
        }
        on_error => "user_uid_not_present"
      }

      if [principal_userid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{principal_userid}"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{record.properties.log.responseObject.spec.nonResourceAttributes.path}"
        }
        on_error => "responseObject_path_not_present"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.process.file.full_path" => "%{record.properties.log.requestObject.spec.nonResourceAttributes.path}"
        }
        on_error => "responseObject_path_not_present"
      }

      mutate {
        replace => {
          "log_verb" => "%{record.properties.log.verb}"
        }
        on_error => "verb_not_present"
      }

      if ![verb_not_present] {
        mutate {
          uppercase => ["log_verb"]
        }
        if [log_verb] in ["GET","LIST","WATCH"] {
          mutate {
            replace => {
              "event_type" => "USER_RESOURCE_ACCESS"
            }
          }
        }
        else if [log_verb] == "CREATE" and [principal_userid] != "" {
          mutate {
            replace => {
              "event_type" => "USER_RESOURCE_CREATION"
            }
          }
        }
        else if [log_verb] in ["PATCH","UPDATE"] and [principal_userid] != "" {
          mutate {
            replace => {
              "event_type" => "USER_RESOURCE_UPDATE_CONTENT"
            }
          }
        }
        else if [log_verb] == "DELETE" {
          mutate {
            replace => {
              "event_type" => "USER_RESOURCE_DELETION"
            }
          }
        }
        mutate {
          replace => {
            "sec_result.action_details" => "%{log_verb}"
          }
          on_error => "verb_not_present"
        }
      }

      if [record][resourceId] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.product_object_id" => "%{record.resourceId}"
            "event.idm.read_only_udm.target.resource.resource_type" => "DATABASE"
          }
        }

        grok {
          match => {
            "record.resourceId" => "/SUBSCRIPTIONS/(?P<subscription_id>.*?)/RESOURCEGROUPS/(?P<resource_group>.*?)/PROVIDERS/(?P<target_application>.*?)/SERVERS/(?P<server_name>.*?)/DATABASES/.*"
          }
          on_error => "recource_not_found"
        }

        if ![recource_not_found] {
          mutate {
            rename => {
              "target_application" => "event.idm.read_only_udm.target.application"
            }
          }
        }

        if [event_type] == "" {
          mutate {
            replace => {
              "event_type" => "USER_RESOURCE_ACCESS"
            }
          }
        }
      }
      mutate {
        replace => {
          "record_time" => "%{record.time}"
        }
        on_error => "record_time_not_present"
      }
      date {
        match => ["record_time", "ISO8601","yyyy-MM-ddTHH:mm:ssZ"]
        on_error => "date_error"
      }
      if [date_error] {
        grok {
          match => {
            "record_time" => "%{YEAR:year}-%{MONTHNUM:monthnum}-%{MONTHDAY:monthday}T%{HOUR:hh}:%{MINUTE:mm}:%{SECOND:ss}%{GREEDYDATA:time_zone}"
          }
          on_error => "date_mismatch"
        }
        mutate {
          replace => {
            "time1" => "%{year}-%{monthnum}-%{monthday} %{hh}:%{mm}:%{ss}"
          }
          on_error => "time1_error"
        }
        date {
          match => ["time1", "ISO8601","yyyy-MM-dd HH:mm:ss"]
          on_error => "time_mismatch"
        }
      }

      mutate {
        replace => {
          "operation_name_label.key" => "operationName"
          "operation_name_label.value.string_value" => "%{record.operationName}"
        }
        on_error => "operation_name_not_present"
      }

      if ![operation_name_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "operation_name_label"
          }
        }
      }

      mutate {
        replace => {
          "log_name_label.key" => "log"
          "log_name_label.value.string_value" => "%{record.properties.log}"
        }
        on_error => "log_name_not_present"
      }
      if ![log_name_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "log_name_label"
          }
          on_error => "log_name_label_not_present"
        }
      }

      mutate {
        replace => {
          "stream_name_label.key" => "stream"
          "stream_name_label.value.string_value" => "%{record.properties.stream}"
        }
        on_error => "stream_name_not_present"
      }
      if ![stream_name_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "stream_name_label"
          }
          on_error => "stream_name_label_not_present"
        }
      }

      mutate {
        replace => {
          "containerID_label.key" => "containerID"
          "containerID_label.value.string_value" => "%{record.properties.containerID}"
        }
        on_error => "containerID_not_present"
      }
      if ![containerID_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "containerID_label"
          }
          on_error => "containerID_label_not_present"
        }
      }

      mutate {
        replace => {
          "serviceBuild_label.value.string_value" => "%{record.serviceBuild}"
          "serviceBuild_label.key" => "serviceBuild"
        }
        on_error => "serviceBuild_not_present"
      }
      if ![serviceBuild_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "serviceBuild_label"
          }
          on_error => "serviceBuild_label_not_present"
        }
      }

      if [event_type] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{record.category}"
        }
        on_error => "field_not_found"
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_name" => "KUBERNETES_AUDIT_AZURE"
          "event.idm.read_only_udm.target.cloud.environment" => "MICROSOFT_AZURE"
          "event.idm.read_only_udm.metadata.vendor_name" => "KUBERNETES_AUDIT_AZURE"
        }
      }

      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
}
