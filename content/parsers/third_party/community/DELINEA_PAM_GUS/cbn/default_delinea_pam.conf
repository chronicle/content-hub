# Product: DELINEA_PAM
# Category: Access Management
# Supported Format: SYSLOG + CSV
# References: https://docs.delinea.com/online-help/server-suite/reports-events/events/server-suite/pam.htm
# Last Updated: 2023-11-10
# Copyright 2023 Chronicle LLC

filter{
  mutate {
    replace => {
      "security_result" => ""
      "host" => ""
      "date_time" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:date_time} %{HOSTNAME:host} CEF:%{INT}\\|%{GREEDYDATA:cef_data}",
        "%{TIMESTAMP_ISO8601:date_time} %{HOSTNAME:host} %{GREEDYDATA} CEF:%{INT}\\|%{GREEDYDATA:cef_data}"
      ]
    }
    overwrite => ["date_time", "host"]
    on_error => "grok_fail"
  }
  csv {
    source => "cef_data"
    separator => "|"
    on_error => "csv_failure"
  }

  mutate {
    rename => {
      "column1" => "vendor"
      "column2" => "product"
      "column3" => "version"
      "column5" => "eventtype"
      "column6" => "severity"
      "column7" => "msg"
    }
  }

  if [date_time] != "" {
    date {
      match => ["date_time", "ISO8601"]
      on_error => "match_fail"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
      }
      on_error => "no_host"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor}"
    }
    on_error => "no_vendor"
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "%{product}"
    }
    on_error => "no_product"
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_version" => "%{version}"
    }
    on_error => "no_version"
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_event_type" => "%{eventtype}"
    }
    on_error => "no_event_type"
  }

  mutate {
    gsub => ["msg", "msg=", ""]
  }
  mutate {
    replace => {
      "security_result.description" => "%{msg}"
    }
    on_error => "no_msg"
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
