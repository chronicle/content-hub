# Product: SERVICENOW_AUDIT
# Category: SaaS Application
# Supported Format: JSON, Syslog, kv
# Reference: NA
# Last Updated: 2026-07-17
# Copyright 2026 Google SecOps

filter{
  mutate {
    replace => {
      "host" => ""
      "addition" => ""
      "msg" => ""
      "version" => ""
      "type" => ""
      "intermediary" => ""
      "inter_hostname" => ""
      "application" => ""
      "description" => ""
      "desc" => ""
      "dst_usr" => ""
      "dst_ip" => ""
      "src_usr" => ""
      "kv_data_1" => ""
      "kv_data_2" => ""
      "operation" => ""
      "system_property" => ""
      "Instance" => ""
      "Update_By" => ""
      "User" => ""
      "Operation" => ""
      "security_result" => ""
      "security_result_action" => ""
      "status" => ""
      "json_data" => ""
      "exportByteSize" => ""
      "exportRecordCount" => ""
      "prin_ip" => ""
      "descrip" => ""
      "has_principal" => "false"
      "instance" => ""
      "user_name" => ""
      "sys_id" => ""
      "user_id" => ""
      "parm1" => ""
      "parm2" => ""
      "sys_created_on" => ""
      "claimed_by" => ""
      "claimed_by_data" => ""
      "descriptive_name" => ""
      "process_on" => ""
      "processed" => ""
      "queue" => ""
      "sys_updated_on" => ""
      "table" => ""
      "uri" => ""
      "name" => ""
      "has_user" => ""
      "_logged_in_user" => ""
      "_logger_name" => ""
      "_session_id" => ""
      "_system_id" => ""
      "_timestamp" => ""
      "_user" => ""
      "user" => ""
      "documentkey" => ""
      "tablename" => ""
    }
  }
  mutate {
    gsub => ["message","@timestamp","timestamp"]
  }
  mutate {
    gsub => ["message","@version","version"]
  }
  mutate {
    gsub => ["message","message","msg"]
  }
  if [message] !~ "^{" {
    grok {
      match => {
        "message" => [
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA} %{DATA}: (?P<descrip>Impersonation start: .* by: %{DATA:User} \\(%{DATA}\\))"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA} %{DATA}: (?P<descrip>Login attempt %{WORD:status} for (user|Admin user): (?P<User>%{WORD} %{WORD}))"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA} %{DATA}: (?P<descrip>Login attempt %{WORD:status} for (user|Admin user): (%{NOTSPACE:User}|))"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA} %{DATA}: (?P<descrip>.*(user|Admin user): (%{GREEDYDATA:User}|))"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA} %{DATA}: (?P<descrip>.*(user|Admin user|added to the user|added) - (%{GREEDYDATA:User}|))"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA} %{DATA}: %{DATA:descrip} Export Details: %{GREEDYDATA:json_data}"
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA:inter_hostname} %{DATA}:%{DATA}:%{IP:prin_ip} %{GREEDYDATA:descrip}"
        ]
      }
      on_error => "grok_error"
      overwrite => ["User", "timestamp", "descrip", "status", "json_data","prin_ip","inter_hostname"]
    }
    if [grok_error] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
  else {
    json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
  if [prin_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "prin_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "prin_ip"
      }
      on_error => "prin_ip_error"
    }
    if ![prin_ip_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [json_data] != "" {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "json_error"
    }
  }
  if [exportByteSize] != "" {
    mutate {
      replace => {
        "exportByteSize_label.value.string_value" => "%{exportByteSize}"
      }
      on_error => "exportByteSize_empty"
    }
    if ![exportByteSize_empty] {
      mutate {
        replace => {
          "exportByteSize_label.key" => "exportByteSize"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "exportByteSize_label"
        }
        on_error => "exportByteSize_label_empty"
      }
    }
  }
  if [exportRecordCount] != "" {
    mutate {
      replace => {
        "exportRecordCount_label.value.string_value" => "%{exportRecordCount}"
      }
      on_error => "exportRecordCount_empty"
    }
    if ![exportRecordCount_empty] {
      mutate {
        replace => {
          "exportRecordCount_label.key" => "exportRecordCount"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "exportRecordCount_label"
        }
        on_error => "exportRecordCount_label_empty"
      }
    }
  }
  if [status] == "successful" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }
  else if [status] == "failure" {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
  }
  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
      on_error => "security_result_action_error"
    }
  }
  if [status] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{status}"
      }
      on_error => "status_error"
    }
  }
  date {
    match => ["timestamp", "TIMESTAMP_ISO8601"]
    on_error => "not_date"
  }
  if [version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      }
      on_error => "version_error"
    }
  }
  if [host] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "host"
      }
      on_error => "host_error"
    }
  }
  if [type] != "" {
    mutate {
      replace => {
        "type_label.key" => "type"
        "type_label.value.string_value" => "%{type}"
      }
      on_error => "type_error"
    }
    if ![type_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type_label"
        }
        on_error => "type_label_merge_error"
      }
    }
  }
  if [msg] != "" {
    grok {
      match => {
        "msg" => [
          "<%{INT}>%{SYSLOGTIMESTAMP} %{DATA:inter_hostname} %{DATA:application}: %{GREEDYDATA:description}",
        ]
      }
      on_error => "msg_error"
      overwrite => ["inter_hostname", "application", "description"]
    }
  }
  if [description] != "" {
    grok {
      match => {
        "description" => [
          "%{DATA:desc} for %{DATA:dst_usr} from %{IP:dst_ip} %{GREEDYDATA:kv_data_1}",
          "%{DATA:desc} user %{DATA:src_usr} %{GREEDYDATA:kv_data_1}",
          "%{GREEDYDATA:desc} for %{DATA:src_usr}, %{GREEDYDATA:kv_data_1}",
          "%{DATA} System Property: %{DATA:system_property}, Old Value:%{DATA:old_value}, Current Value:%{DATA:current_value}, Operation: %{DATA} %{GREEDYDATA:kv_data_1}",
          "%{DATA}:%{GREEDYDATA:kv_data_2}"
        ]
      }
      on_error => "description_error"
      overwrite => ["desc", "dst_usr", "dst_ip", "src_usr", "kv_data_1", "kv_data_2", "old_value", "current_value","operation","system_property"]
    }
  }
  kv {
    source => "kv_data_1"
    field_split => ","
    value_split => ":"
    trim_key => " "
    on_error => "kv_data_1_kv_failure"
  }
  kv {
    source => "kv_data_2"
    field_split => ","
    value_split => "="
    trim_key => " "
    on_error => "kv_data_2_kv_failure"
  }
  if [operation] != "" {
    mutate {
      replace => {
        "operation_label.key" => "operation"
        "operation_label.value.string_value" => "%{operation}"
      }
      on_error => "operation_error"
    }
    if ![operation_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "operation_label"
        }
        on_error => "operation_label_merge_error"
      }
    }
  }
  if [Operation] != "" {
    mutate {
      replace => {
        "Operation_label.key" => "Operation"
        "Operation_label.value.string_value" => "%{Operation}"
      }
      on_error => "Operation_error"
    }
    if ![Operation_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Operation_label"
        }
        on_error => "Operation_label_merge_error"
      }
    }
  }
  if [system_property] != "" {
    mutate {
      replace => {
        "system_property_label.key" => "System Property"
        "system_property_label.value.string_value" => "%{system_property}"
      }
      on_error => "system_property_error"
    }
    if ![system_property_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "system_property_label"
        }
        on_error => "system_property_label_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "role_updated" => "%{role updated}"
    }
    on_error => "role_updated_error"
  }
  if ![role_updated_error] && [role_updated] != "" {
    mutate {
      replace => {
        "role.name" => "%{role_updated}"
      }
      on_error => "role_updated_error_found"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.attribute.roles" => "role"
      }
      on_error => "role_updated_merge_error"
    }
  }
  if [Instance] != "" {
    mutate {
      replace => {
        "Instance_label.key" => "Instance"
        "Instance_label.value.string_value" => "%{Instance}"
      }
      on_error => "Instance_error"
    }
    if ![Instance_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Instance_label"
        }
        on_error => "Instance_label_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "Update_By" => "%{Update By}"
    }
    on_error => "Update_By_error"
  }
  if ![Update_By_error] && [Update_By] != "" {
    mutate {
      replace => {
        "Update_By_label.key" => "Update By"
        "Update_By_label.value.string_value" => "%{Update_By}"
      }
      on_error => "Update_By_label_error"
    }
    if ![Update_By_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Update_By_label"
        }
        on_error => "Update_By_label_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "Old_Value" => "%{old_value}"
    }
    on_error => "Old_Value_error"
  }
  if ![Old_Value_error] && [Old_Value] != "" {
    mutate {
      replace => {
        "Old_Value_label.key" => "Old Value"
        "Old_Value_label.value.string_value" => "%{Old_Value}"
      }
      on_error => "Old_Value_label_error"
    }
    if ![Old_Value_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Old_Value_label"
        }
        on_error => "Old_Value_label_merge_error"
      }
    }
  }
  mutate {
    replace => {
      "Current_Value" => "%{current_value}"
    }
    on_error => "Current_Value_error"
  }
  if ![Current_Value_error] && [Current_Value] != "" {
    mutate {
      replace => {
        "Current_Value_label.key" => "Current Value"
        "Current_Value_label.value.string_value" => "%{Current_Value}"
      }
      on_error => "Current_Value_label_error"
    }
    if ![Current_Value_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "Current_Value_label"
        }
        on_error => "Current_Value_label_merge_error"
      }
    }
  }
  if [User] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{User}"
        "has_user" => "true"
      }
      on_error => "User_error"
    }
  }
  if [src_usr] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{src_usr}"
        "has_user" => "true"
      }
      on_error => "src_usr_error"
    }
  }
  if [dst_usr] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{dst_usr}"
        "has_user" => "true"
      }
      on_error => "dst_usr_error"
    }
  }
  if [dst_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dst_ip"
      }
      on_error => "dst_ip_error"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "description_error_found"
    }
  }
  if [descrip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{descrip}"
      }
      on_error => "descrip_empty"
    }
  }
  if [inter_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_hostname}"
      }
      on_error => "inter_hostname_error"
    }
  }
  if [application] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{application}"
      }
      on_error => "application_error"
    }
  }
  if [instance] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{instance}"
      }
      on_error => "instance_error"
    }
  }
  if [user_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_name}"
      }
      on_error => "user_name_error"
    }
  }
  if [sys_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{sys_id}"
      }
      on_error => "sys_id_error"
    }
  }
  if [user_id] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "%{user_id}"
      }
      on_error => "user_email_addresses_error"
    }
  }
  else if [user_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_id}"
        "has_user" => "true"
      }
      on_error => "user_id_error"
    }
  }
  if [parm1] != "user_id" and [parm1] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "parm1"
      }
      on_error => "parm1_error"
    }
  }
  if [parm2] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "parm2"
      }
      on_error => "parm2_error"
    }
  }
  else if [parm2] != "" {
    grok {
      match => {
        "parm2" => [
          "%{IP:parm2_ip}"
        ]
      }
      on_error => "parm2_grok_error"
      overwrite => ["parm2_ip"]
    }
    if ![parm2_grok_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "parm2"
          "event.idm.read_only_udm.principal.asset.ip" => "parm2"
        }
        on_error => "parm2_ip_error"
      }
    }
  }
  if [sys_created_on] != "" {
    date {
      match => ["sys_created_on", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-ddTHH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "sys_created_on_error"
    }
  }
  if [name] != "" {
    mutate {
      replace => {
        "name_label.key" => "name"
        "name_label.value.string_value" => "%{name}"
      }
      on_error => "name_error"
    }
    if ![name_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "name_label"
        }
        on_error => "name_label_merge_error"
      }
    }
  }
  if [claimed_by] != "" {
    grok {
      match => {
        "claimed_by" => [
          "%{DATA:claimed_by}:%{GREEDYDATA:claimed_by_data}"
        ]
      }
      on_error => "claimed_by_error"
      overwrite => ["claimed_by_data","claimed_by"]
    }
    if [claimed_by] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{claimed_by}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{claimed_by}"
        }
        on_error => "claimed_by_data_error"
      }
    }
    if [claimed_by_data] != "" {
      mutate {
        replace => {
          "claimed_by_data_label.key" => "ServiceNow Instance Detail"
          "claimed_by_data_label.value" => "%{claimed_by_data}"
        }
        on_error => "claimed_by_data_label_error"
      }
      if ![claimed_by_data_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "claimed_by_data_label"
          }
          on_error => "claimed_by_data_label_merge_error"
        }
      }
    }
  }
  if [_timestamp] != "" {
    date {
      match => ["_timestamp", "ISO8601", "yyyy-MM-ddTHH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "_timestamp_error"
    }
  }
  if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        "has_user" => "true"
      }
      on_error => "user_error"
    }
  }
  else if [_logged_in_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{_logged_in_user}"
        "has_user" => "true"
      }
      on_error => "_logged_in_user_error"
    }
  }
  else if [_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{_user}"
        "has_user" => "true"
      }
      on_error => "_user_error"
    }
  }
  if [_system_id] != "" {
    mutate {
      replace => {
          "event.idm.read_only_udm.target.hostname" => "%{_system_id}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{_system_id}"
      }
      on_error => "_system_id_hostname_error"
    }
  }
  if [_session_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{_session_id}"
      }
      on_error => "_session_id_error"
    }
  }
  if [_logger_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{_logger_name}"
      }
      on_error => "_logger_name_error"
    }
  }
  if [tablename] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{tablename}"
      }
      on_error => "tablename_error"
    }
  }
  if [documentkey] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{documentkey}"
      }
      on_error => "documentkey_error"
    }
  }
  mutate {
    rename => {
      "derived_priority" => "addition.derived_priority"
      "sys_mod_count" => "addition.sys_mod_count"
      "partition" => "addition.partition"
      "processing_duration" => "addition.processing_duration"
      "state" => "addition.state"
      "descriptive_name" => "addition.descriptive_name"
      "process_on" => "addition.process_on"
      "processed" => "addition.processed"
      "queue" => "addition.queue"
      "sys_updated_on" => "addition.sys_updated_on"
      "sys_updated_by" => "addition.sys_updated_by"
      "sys_created_by" => "addition.sys_created_by"
      "table" => "addition.table"
      "_log_table" => "addition._log_table"
      "fieldname" => "addition.fieldname"
      "_is_impersonating" => "addition._is_impersonating"
      "_log_table_field_name" => "addition._log_table_field_name"
      "_log_table_table_name" => "addition._log_table_table_name"
      "_page_name" => "addition._page_name"
      "_source_type" => "addition._source_type"
      "internal_checkpoint" => "addition.internal_checkpoint"
      "record_checkpoint" => "addition.record_checkpoint"
      "_txid" => "addition._txid"
      "newvalue" => "addition.newvalue"
      "oldvalue" => "addition.oldvalue"
      "_logged_in_user" => "addition._logged_in_user"
      "_user" => "addition._user"
    }
  }
  for key, value in  addition map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [value] not in ["-", "", "Unknown","N/A"] {
      mutate {
        replace => {
          "field_.key" => "%{key}"
          "field_.value.string_value" => "%{value}"
        }
        on_error => "key_not_exists"
      }
      if ![key_not_exists] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "no_additional_fields"
        }
      }
    }
  }
  if [uri] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{uri}"
      }
      on_error => "uri_error"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_error"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_error"
    }
  }
  if ([desc] =~ "login" or [name] == "session.established" or [name] == "login") and [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
      }
    }
  }
  else if [name] == "logout" or [name] == "session.terminated" and [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
