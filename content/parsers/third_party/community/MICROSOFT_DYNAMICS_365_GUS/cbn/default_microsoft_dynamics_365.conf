# Product: Checkpoint Harmony
# Category: Authentication logs
# Supported Format: CSV
# Last Updated: 2024-12-16
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "principal" => ""
      "metadata" => ""
      "additional" => ""
      "target" => ""
      "security_result" => ""
      "network" => ""
      "has_user" => "false"
      "RECORD_IDENTIFIER" => ""
      "LOG_SEQUENCE_NUMBER" => ""
      "LastProcessedChange_DateTime" => ""
      "DataLakeModified_DateTime" => ""
      "BuildNumber" => ""
      "Application_Object_Server_node" => ""
      "ClientType" => ""
      "LogoutDateTime" => ""
      "LOGOUTDATETIMETZID" => ""
      "SessionId" => ""
      "TerminatedOk" => ""
      "Type" => ""
      "UserId" => ""
      "Alive" => ""
      "PARTITION" => ""
      "RECVERSION" => ""
      "timestamp" => ""
    }
  }

  csv {
    source => "message"
    value_separator => ","
    on_error => "no_csv"
  }

  mutate {
    replace => {
      "RECORD_IDENTIFIER" => "%{column1}"
    }
    on_error => "no_record_id"
  }
  mutate {
    replace => {
      "LOG_SEQUENCE_NUMBER" => "%{column2}"
    }
    on_error => "no_LOG_SEQUENCE_NUMBER"
  }
  mutate {
    replace => {
      "LastProcessedChange_DateTime" => "%{column3}"
    }
    on_error => "no_LastProcessedChange_DateTime"
  }
  mutate {
    replace => {
      "DataLakeModified_DateTime" => "%{column4}"
    }
    on_error => "no_DataLakeModified_DateTime"
  }
  mutate {
    replace => {
      "BuildNumber" => "%{column6}"
    }
    on_error => "no_BuildNumber"
  }
  mutate {
    replace => {
      "Application_Object_Server_node" => "%{column8}"
    }
    on_error => "no_Application_Object_Server_node"
  }
  mutate {
    replace => {
      "ClientType" => "%{column7}"
    }
    on_error => "no_ClientType"
  }
  mutate {
    replace => {
      "LogoutDateTime" => "%{column9}"
    }
    on_error => "no_LogoutDateTime"
  }
  mutate {
    replace => {
      "LOGOUTDATETIMETZID" => "%{column10}"
    }
    on_error => "no_LOGOUTDATETIMETZID"
  }
  mutate {
    replace => {
      "SessionId" => "%{column11}"
    }
    on_error => "no_SessionId"
  }
  mutate {
    replace => {
      "TerminatedOk" => "%{column12}"
    }
    on_error => "no_TerminatedOk"
  }
  mutate {
    replace => {
      "Type" => "%{column13}"
    }
    on_error => "no_Type"
  }
  mutate {
    replace => {
      "UserId" => "%{column14}"
    }
    on_error => "no_UserId"
  }
  mutate {
    replace => {
      "Alive" => "%{column15}"
    }
    on_error => "no_Alive"
  }
  mutate {
    replace => {
      "PARTITION" => "%{column16}"
    }
    on_error => "no_PARTITION"
  }
  mutate {
    replace => {
      "RECVERSION" => "%{column17}"
    }
    on_error => "no_RECVERSION"
  }
  mutate {
    replace => {
      "timestamp" => "%{column18}"
    }
    on_error => "no_timestamp"
  }

  mutate {
    replace => {
      "record_id.value.string_value" => "%{RECORD_IDENTIFIER}"
    }
    on_error => "no_record_id"
  }
  if ![no_record_id] and [RECORD_IDENTIFIER] != "" {
    mutate {
      replace => {
        "record_id.key" => "RECORD_IDENTIFIER"
      }
      on_error => "record_id_not_mapped"
    }
    mutate {
      merge => {
        "additional.fields" => "record_id"
      }
      on_error => "record_id_not_mapped"
    }
  }

  mutate {
      replace => {
        "LOG_SEQUENCE_NUMBER_label.value" => "%{LOG_SEQUENCE_NUMBER}"
      }
      on_error => "LOG_SEQUENCE_NUMBER_not_found"
  }

  if ![LOG_SEQUENCE_NUMBER_not_found] and [LOG_SEQUENCE_NUMBER_label][value] != "" {
    mutate {
      replace => {
        "LOG_SEQUENCE_NUMBER_label.key" => "LOG_SEQUENCE_NUMBER"
      }
      on_error => "LOG_SEQUENCE_NUMBER_not_mapped"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "LOG_SEQUENCE_NUMBER_label"
      }
      on_error => "LOG_SEQUENCE_NUMBER_not_mapped"
    }
  }

  mutate {
    replace => {
      "LastProcessedChange_DateTime_label.value.string_value" => "%{LastProcessedChange_DateTime}"
    }
    on_error => "no_LastProcessedChange_DateTime_label"
  }
  if ![no_LastProcessedChange_DateTime_label] and [LastProcessedChange_DateTime] != "" {
    mutate {
      replace => {
        "LastProcessedChange_DateTime_label.key" => "LastProcessedChange_DateTime"
      }
    }
    mutate {
      merge => {
        "additional.fields" => "LastProcessedChange_DateTime_label"
      }
      on_error => "LastProcessedChange_DateTime_label_not_mapped"
    }
  }

  mutate {
    replace => {
      "DataLakeModified_DateTime_label.value.string_value" => "%{DataLakeModified_DateTime}"
    }
    on_error => "no_DataLakeModified_DateTime_label"
  }
  if ![no_DataLakeModified_DateTime_label] and [DataLakeModified_DateTime] != "" {
    mutate {
      replace => {
        "DataLakeModified_DateTime_label.key" => "DataLakeModified_DateTime"
      }
    }
    mutate {
      merge => {
        "additional.fields" => "DataLakeModified_DateTime_label"
      }
      on_error => "DataLakeModified_DateTime_label_not_mapped"
    }
  }

  if [BuildNumber] != "" {
    mutate {
      replace => {
        "about_BuildNumber.key" => "BuildNumber"
        "about_BuildNumber.value" => "%{BuildNumber}"
      }
      on_error => "BuildNumber_not_mapped"
    }

    if ![BuildNumber_not_mapped] {
      mutate {
        merge => {
          "about.labels" => "about_BuildNumber"
        }
        on_error => "BuildNumber_not_mapped"
      }
    }
  }
  if [Application_Object_Server_node] != "" {
    mutate {
      replace => {
        "labels_Application_Object_Server_node.key"   => "Object Server"
        "labels_Application_Object_Server_node.value.string_value" => "%{Application_Object_Server_node}"
      }
      on_error => "Application_Object_Server_node_not_mapped"
    }
    if ![Application_Object_Server_node_not_mapped] {
      mutate {
        merge => {
          "additional.fields" => "labels_Application_Object_Server_node"
        }
        on_error => "Application_Object_Server_node_not_mapped"
      }
    }
  }
  mutate {
    replace => {
      "ClientType_label.key" => "ClientType"
      "ClientType_label.value.string_value" => "%{ClientType}"
    }
    on_error => "ClientType_not_mapped"
  }
  if ![ClientType_not_mapped] and [ClientType] != "" {
    mutate {
      merge => {
        "additional.fields" => "ClientType_label"
      }
      on_error => "ClientType_not_mapped"
    }
  }

  mutate {
    replace => {
      "LogoutDateTime_label.key" => "LogoutDateTime"
      "LogoutDateTime_label.value.string_value" => "%{LogoutDateTime}"
    }
    on_error => "LogoutDateTime_not_mapped"
  }
  if ![LogoutDateTime_not_mapped] and [LogoutDateTime] != "" {
    mutate {
      merge => {
        "additional.fields" => "LogoutDateTime_label"
      }
      on_error => "LogoutDateTime_not_mapped"
    }
  }

  mutate {
    replace => {
      "LOGOUTDATETIMETZID_label.key" => "LOGOUTDATETIMETZID"
      "LOGOUTDATETIMETZID_label.value.string_value" => "%{LOGOUTDATETIMETZID}"
    }
    on_error => "LOGOUTDATETIMETZID_not_mapped"
  }
  if ![LOGOUTDATETIMETZID_not_mapped] and [LOGOUTDATETIMETZID] != "" {
    mutate {
      merge => {
        "additional.fields" => "LOGOUTDATETIMETZID_label"
      }
      on_error => "LOGOUTDATETIMETZID_not_mapped"
    }
  }

  if [SessionId] != "" {
    mutate {
      replace => {
        "network.session_id" => "%{SessionId}"
      }
      on_error => "SessionId_not_mapped"
    }
  }

  mutate {
    replace => {
      "TerminatedOk_label.key" => "TerminatedOk"
      "TerminatedOk_label.value.string_value" => "%{TerminatedOk}"
    }
    on_error => "TerminatedOk_not_mapped"
  }
  if ![TerminatedOk_not_mapped] and [TerminatedOk] != "" {
    mutate {
      merge => {
        "additional.fields" => "TerminatedOk_label"
      }
      on_error => "TerminatedOk_not_mapped"
    }
  }

  mutate {
    replace => {
      "Type_label.key" => "Type"
      "Type_label.value.string_value" => "%{Type}"
    }
    on_error => "Type_not_mapped"
  }
  if ![Type_not_mapped] and [Type] != "" {
    mutate {
      merge => {
        "additional.fields" => "Type_label"
      }
      on_error => "Type_not_mapped"
    }
  }

  if [UserId] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{UserId}"
        "has_user" => "true"
      }
      on_error => "UserId_not_mapped"
    }
  }

  mutate {
    replace => {
      "Alive_label.key" => "Alive"
      "Alive_label.value.string_value" => "%{Alive}"
    }
    on_error => "Alive_not_mapped"
  }
  if ![Alive_not_mapped] and [Alive] != "" {
    mutate {
      merge => {
        "additional.fields" => "Alive_label"
      }
      on_error => "Alive_not_mapped"
    }
  }

  mutate {
    replace => {
      "PARTITION_label.key" => "PARTITION"
      "PARTITION_label.value.string_value" => "%{PARTITION}"
    }
    on_error => "PARTITION_not_mapped"
  }
  if ![PARTITION_not_mapped] and [PARTITION] != "" {
    mutate {
      merge => {
        "additional.fields" => "PARTITION_label"
      }
      on_error => "PARTITION_not_mapped"
    }
  }

  if [RECVERSION] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{RECVERSION}"
      }
    }
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601", "RFC3339"]
      on_error => "ts_match_failed"
    }
  }

  mutate {
    replace => {
      "metadata.event_type" => "GENERIC_EVENT"
      "metadata.vendor_name" => "MICROSOFT_DYNAMICS_365"
      "metadata.product_name" => "MICROSOFT_DYNAMICS_365"
    }
  }

  if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "no_user"
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
      on_error => "no_principal"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_sec_result"
    }
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.about" => "about"
    }
    on_error => "_catch_about_merge_exception"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
