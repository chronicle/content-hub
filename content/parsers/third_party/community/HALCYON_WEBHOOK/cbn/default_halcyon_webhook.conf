# Product: Halcyon Webhook (OCSF Schema)
# Category: AV and endpoint logs
# Supported Format: JSON
# LogType: Halcyon_Webhook
# Purpose: Stopgap Custom Parser for Halcyon Webhook Ingestion (b/546546667 / Case #72379317)
# Reference: google3/googlex/security/malachite/cbn/configs/HALCYON/default/halcyon.conf

filter {
  # 1. Initialize all variables and optional JSON keys to guarantee state data presence
  mutate {
    replace => {
      "event" => ""
      "security_result" => ""
      "clean_json" => ""
      "time_str" => ""
      "cat_details" => ""
      "sec_action" => ""
      "dev_hostname" => ""
      "dev_uid" => ""
      "dev_ip" => ""
      "proc_cmd" => ""
      "proc_path" => ""
      "proc_pid" => ""
      "proc_ppid" => ""
      "actor_sha256" => ""
      "user_name" => ""
      "user_uid" => ""
      "target_file_path" => ""
      "target_sha256" => ""
      "target_app_name" => ""
      "target_app_path" => ""
      "target_proc_cmd" => ""
      "target_proc_path" => ""
      "target_proc_name" => ""
      "target_proc_pid" => ""
      "target_proc_sha256" => ""
      "driver_path" => ""
      "driver_name" => ""
      "driver_sha256" => ""
      "str_class_uid" => ""
      "str_class_name" => ""
      "str_activity_id" => ""
      "str_activity_name" => ""
      "str_type_name" => ""
      "cat_name" => ""
      "raw_sev" => ""
      "raw_sev_id" => ""
      "raw_act" => ""
      "raw_disp" => ""
      "h_event_kind" => ""
      "h_tenant_id" => ""
      "h_exit_code" => ""
      "tag_reason" => ""
      "df_kind" => ""
      "df_tenant" => ""
      "df_exit" => ""
      "df_reason" => ""
    }
    on_error => "init_failed"
  }

  # 2. Clean Batch ID / Rawlog offset prefix if present
  if [message] =~ /^Batch ID:/ or [message] =~ /^Rawlog offset:/ {
    grok {
      match => {
        "message" => "(?s).*?(?<clean_json>\{.*\})"
      }
      on_error => "grok_clean_failed"
    }
    if [clean_json] != "" {
      mutate {
        replace => {
          "message" => "%{clean_json}"
        }
        on_error => "clean_json_replace_failed"
      }
    }
  }

  # 3. Parse JSON Payload
  json {
    source => "message"
    on_error => "json_parse_failed"
  }

  # 4. Base Metadata & Principal Fallback Initialization
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Halcyon"
      "event.idm.read_only_udm.metadata.product_name" => "Halcyon Anti Ransomware"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "event.idm.read_only_udm.principal.hostname" => "unknown-host"
    }
    on_error => "metadata_init_failed"
  }

  if [message] != "" {
    mutate {
      copy => {
        "event.idm.read_only_udm.metadata.description" => "message"
        "security_result.summary" => "message"
      }
      on_error => "desc_failed"
    }
  }

  # 5. Timestamp Parsing
  mutate {
    convert => {
      "time" => "string"
    }
    on_error => "time_convert_failed"
  }
  mutate {
    copy => {
      "time_str" => "time"
    }
    on_error => "time_str_failed"
  }
  if [time_str] != "" {
    date {
      match => [ "time_str", "UNIX_MS" ]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "date_parse_failed"
    }
  }

  # 6. Event Type Extraction & Classification
  mutate {
    convert => {
      "class_uid" => "string"
      "activity_id" => "string"
    }
    on_error => "class_conv_error"
  }
  mutate {
    replace => {
      "str_class_uid" => "%{class_uid}"
      "str_class_name" => "%{class_name}"
      "str_activity_id" => "%{activity_id}"
      "str_activity_name" => "%{activity_name}"
      "str_type_name" => "%{type_name}"
    }
    on_error => "class_extract_error"
  }

  if [str_type_name] != "" and ![class_extract_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{str_type_name}"
      }
      on_error => "pet_set_error"
    }
  }

  if [str_class_uid] == "1001" or [str_class_name] == "File System Activity" {
    if [str_activity_id] == "1" or [str_activity_name] == "Create" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_CREATION"
        }
        on_error => "event_type_error"
      }
    } else if [str_activity_id] == "2" or [str_activity_name] == "Read" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_READ"
        }
        on_error => "event_type_error"
      }
    } else if [str_activity_id] == "3" or [str_activity_name] == "Update" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
        }
        on_error => "event_type_error"
      }
    } else if [str_activity_id] == "4" or [str_activity_name] == "Delete" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_DELETION"
        }
        on_error => "event_type_error"
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
        }
        on_error => "event_type_error"
      }
    }
  } else if [str_class_uid] == "1007" or [str_class_name] == "Process Activity" {
    if [str_activity_id] == "1" or [str_activity_name] == "Launch" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"
        }
        on_error => "event_type_error"
      }
    } else if [str_activity_id] == "2" or [str_activity_name] == "Terminate" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "PROCESS_TERMINATION"
        }
        on_error => "event_type_error"
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"
        }
        on_error => "event_type_error"
      }
    }
  } else if [str_class_uid] == "6002" or [str_class_name] == "Application Lifecycle" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
      on_error => "event_type_error"
    }
  } else if [str_class_uid] == "2001" or [str_class_name] == "Security Finding" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_UNCATEGORIZED"
      }
      on_error => "event_type_error"
    }
  } else if [str_class_uid] == "1002" or [str_class_name] == "Kernel Extension Activity" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
      on_error => "event_type_error"
    }
  }

  # 7. Host & Principal Device Identification
  mutate {
    replace => {
      "dev_hostname" => "%{device.hostname}"
    }
    on_error => "dev_hostname_error"
  }
  if [dev_hostname] != "" and ![dev_hostname_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{dev_hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{dev_hostname}"
        "event.idm.read_only_udm.target.hostname" => "%{dev_hostname}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{dev_hostname}"
      }
      on_error => "dev_hostname_set_error"
    }
  }

  mutate {
    replace => {
      "dev_uid" => "%{device.uid}"
    }
    on_error => "dev_uid_error"
  }
  if [dev_uid] != "" and ![dev_uid_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" => "%{dev_uid}"
        "event.idm.read_only_udm.principal.asset.asset_id" => "%{dev_uid}"
        "event.idm.read_only_udm.target.asset_id" => "%{dev_uid}"
        "event.idm.read_only_udm.target.asset.asset_id" => "%{dev_uid}"
      }
      on_error => "dev_uid_set_error"
    }
  }

  mutate {
    replace => {
      "dev_ip" => "%{device.ip}"
    }
    on_error => "dev_ip_error"
  }
  if [dev_ip] != "" and ![dev_ip_error] {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "dev_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "dev_ip"
      }
      on_error => "dev_ip_set_error"
    }
  }

  # 8. Principal Actor (Process & User)
  mutate {
    replace => {
      "proc_cmd" => "%{actor.process.cmd_line}"
    }
    on_error => "proc_cmd_error"
  }
  if [proc_cmd] != "" and ![proc_cmd_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.command_line" => "%{proc_cmd}"
      }
      on_error => "proc_cmd_set_error"
    }
  }

  mutate {
    replace => {
      "proc_path" => "%{actor.process.file.path}"
    }
    on_error => "proc_path_error"
  }
  if [proc_path] != "" and ![proc_path_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{proc_path}"
      }
      on_error => "proc_path_set_error"
    }
  }

  mutate {
    convert => {
      "actor.process.pid" => "string"
    }
    on_error => "proc_pid_conv_error"
  }
  mutate {
    replace => {
      "proc_pid" => "%{actor.process.pid}"
    }
    on_error => "proc_pid_error"
  }
  if [proc_pid] != "" and [proc_pid] != "0" and ![proc_pid_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{proc_pid}"
      }
      on_error => "proc_pid_set_error"
    }
  }

  mutate {
    convert => {
      "actor.process.parent_process.pid" => "string"
    }
    on_error => "proc_ppid_conv_error"
  }
  mutate {
    replace => {
      "proc_ppid" => "%{actor.process.parent_process.pid}"
    }
    on_error => "proc_ppid_error"
  }
  if [proc_ppid] != "" and [proc_ppid] != "0" and ![proc_ppid_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.parent_process.pid" => "%{proc_ppid}"
      }
      on_error => "proc_ppid_set_error"
    }
  }

  mutate {
    replace => {
      "actor_sha256" => "%{actor.process.file.hashes.0.value}"
    }
    on_error => "actor_sha256_error"
  }
  if [actor_sha256] != "" and ![actor_sha256_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.sha256" => "%{actor_sha256}"
      }
      on_error => "actor_sha256_set_error"
    }
  }

  mutate {
    replace => {
      "user_name" => "%{actor.user.name}"
    }
    on_error => "user_name_error"
  }
  if [user_name] != "" and ![user_name_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_name}"
      }
      on_error => "user_name_set_error"
    }
  }

  mutate {
    replace => {
      "user_uid" => "%{actor.user.uid}"
    }
    on_error => "user_uid_error"
  }
  if [user_uid] != "" and ![user_uid_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_uid}"
      }
      on_error => "user_uid_set_error"
    }
  }

  # 9. Target (File & Application)
  mutate {
    replace => {
      "target_file_path" => "%{file.path}"
    }
    on_error => "target_file_path_error"
  }
  if [target_file_path] != "" and ![target_file_path_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{target_file_path}"
      }
      on_error => "target_file_path_set_error"
    }
  }

  mutate {
    replace => {
      "target_sha256" => "%{file.hashes.0.value}"
    }
    on_error => "target_sha256_error"
  }
  if [target_sha256] != "" and ![target_sha256_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{target_sha256}"
      }
      on_error => "target_sha256_set_error"
    }
  }

  # Driver File Mapping (Kernel Extension Activity / VulnerableDriver)
  mutate {
    replace => {
      "driver_path" => "%{driver.file.path}"
    }
    on_error => "driver_path_error"
  }
  if [driver_path] != "" and ![driver_path_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{driver_path}"
      }
      on_error => "driver_path_set_error"
    }
  }

  mutate {
    replace => {
      "driver_sha256" => "%{driver.file.hashes.0.value}"
    }
    on_error => "driver_sha256_error"
  }
  if [driver_sha256] != "" and ![driver_sha256_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{driver_sha256}"
      }
      on_error => "driver_sha256_set_error"
    }
  }

  mutate {
    replace => {
      "target_app_name" => "%{app.name}"
    }
    on_error => "target_app_name_error"
  }
  if [target_app_name] != "" and ![target_app_name_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{target_app_name}"
      }
      on_error => "target_app_name_set_error"
    }
  }

  mutate {
    replace => {
      "target_app_path" => "%{app.path}"
    }
    on_error => "target_app_path_error"
  }
  if [target_app_path] != "" and ![target_app_path_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{target_app_path}"
      }
      on_error => "target_app_path_set_error"
    }
  }

  # Target Process Mapping (from OCSF process object)
  mutate {
    replace => {
      "target_proc_path" => "%{process.file.path}"
    }
    on_error => "target_proc_path_error"
  }
  if [target_proc_path] != "" and ![target_proc_path_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{target_proc_path}"
      }
      on_error => "target_proc_path_set_error"
    }
  }

  mutate {
    replace => {
      "target_proc_name" => "%{process.file.name}"
    }
    on_error => "target_proc_name_error"
  }
  if [target_proc_path] == "" and [target_proc_name] != "" and ![target_proc_name_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{target_proc_name}"
      }
      on_error => "target_proc_name_set_error"
    }
  }

  mutate {
    replace => {
      "target_proc_cmd" => "%{process.cmd_line}"
    }
    on_error => "target_proc_cmd_error"
  }
  if [target_proc_cmd] != "" and ![target_proc_cmd_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{target_proc_cmd}"
      }
      on_error => "target_proc_cmd_set_error"
    }
  }

  mutate {
    convert => {
      "process.pid" => "string"
    }
    on_error => "target_proc_pid_conv_error"
  }
  mutate {
    replace => {
      "target_proc_pid" => "%{process.pid}"
    }
    on_error => "target_proc_pid_error"
  }
  if [target_proc_pid] != "" and [target_proc_pid] != "0" and ![target_proc_pid_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{target_proc_pid}"
      }
      on_error => "target_proc_pid_set_error"
    }
  }

  mutate {
    replace => {
      "target_proc_sha256" => "%{process.file.hashes.0.value}"
    }
    on_error => "target_proc_sha256_error"
  }
  if [target_proc_sha256] != "" and ![target_proc_sha256_error] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.sha256" => "%{target_proc_sha256}"
      }
      on_error => "target_proc_sha256_set_error"
    }
  }

  # UDM Validation Safeguard: Process Activity requires target.process
  if [str_class_uid] == "1007" or [str_class_name] == "Process Activity" {
    if [target_proc_path] == "" and [target_proc_name] == "" and [target_app_path] == "" {
      if [proc_path] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.full_path" => "%{proc_path}"
          }
          on_error => "proc_fallback_error"
        }
      } else if [target_file_path] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.full_path" => "%{target_file_path}"
          }
          on_error => "proc_fallback_error"
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.process.file.full_path" => "unknown-process"
          }
          on_error => "proc_fallback_error"
        }
      }
    }
  }

  # 10. Security Result (Severity, Action, Details)
  mutate {
    replace => {
      "cat_name" => "%{category_name}"
    }
    on_error => "cat_name_error"
  }
  if [cat_name] != "" and ![cat_name_error] {
    mutate {
      replace => {
        "cat_details" => "%{cat_name}"
      }
      on_error => "cat_details_error"
    }
    if ![cat_details_error] {
      mutate {
        merge => {
          "security_result.category_details" => "cat_details"
        }
        on_error => "cat_details_merge_error"
      }
    }
  }

  mutate {
    convert => {
      "severity_id" => "string"
    }
    on_error => "sev_conv_error"
  }
  mutate {
    replace => {
      "raw_sev" => "%{severity}"
      "raw_sev_id" => "%{severity_id}"
    }
    on_error => "sev_extract_error"
  }
  if [raw_sev] == "Low" or [raw_sev_id] == "2" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
        "security_result.severity_details" => "Low"
      }
      on_error => "sev_set_error"
    }
  } else if [raw_sev] == "Medium" or [raw_sev_id] == "3" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
        "security_result.severity_details" => "Medium"
      }
      on_error => "sev_set_error"
    }
  } else if [raw_sev] == "High" or [raw_sev_id] == "4" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
        "security_result.severity_details" => "High"
      }
      on_error => "sev_set_error"
    }
  } else if [raw_sev] == "Critical" or [raw_sev] == "Fatal" or [raw_sev_id] == "5" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
        "security_result.severity_details" => "Critical"
      }
      on_error => "sev_set_error"
    }
  } else if [raw_sev] == "Informational" or [raw_sev] == "Info" or [raw_sev_id] == "1" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
        "security_result.severity_details" => "Informational"
      }
      on_error => "sev_set_error"
    }
  }

  mutate {
    replace => {
      "raw_act" => "%{action}"
      "raw_disp" => "%{disposition}"
    }
    on_error => "act_extract_error"
  }
  if [raw_act] == "Allowed" or [raw_disp] == "Allowed" {
    mutate {
      replace => {
        "sec_action" => "ALLOW"
        "security_result.action_details" => "Allowed"
      }
      on_error => "act_set_error"
    }
    if ![act_set_error] {
      mutate {
        merge => {
          "security_result.action" => "sec_action"
        }
        on_error => "sec_action_merge_error"
      }
    }
  } else if [raw_act] == "Blocked" or [raw_act] == "Denied" or [raw_disp] == "Blocked" {
    mutate {
      replace => {
        "sec_action" => "BLOCK"
        "security_result.action_details" => "Blocked"
      }
      on_error => "act_set_error"
    }
    if ![act_set_error] {
      mutate {
        merge => {
          "security_result.action" => "sec_action"
        }
        on_error => "sec_action_merge_error"
      }
    }
  } else if [raw_disp] == "Quarantined" {
    mutate {
      replace => {
        "sec_action" => "QUARANTINE"
        "security_result.action_details" => "Quarantined"
      }
      on_error => "act_set_error"
    }
    if ![act_set_error] {
      mutate {
        merge => {
          "security_result.action" => "sec_action"
        }
        on_error => "sec_action_merge_error"
      }
    }
  }

  # 11. Detection Fields & Metadata Labels
  mutate {
    replace => {
      "h_event_kind" => "%{unmapped.halcyon_event_kind}"
      "h_tenant_id" => "%{unmapped.halcyon_tenant_id}"
      "h_exit_code" => "%{unmapped.halcyon_exit_code}"
    }
    on_error => "unmapped_extract_error"
  }

  if [h_event_kind] != "" and ![unmapped_extract_error] {
    mutate {
      replace => {
        "df_kind.key" => "halcyon_event_kind"
        "df_kind.value" => "%{h_event_kind}"
      }
      on_error => "df_kind_error"
    }
    if ![df_kind_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "df_kind"
        }
        on_error => "df_kind_merge_error"
      }
    }
  }

  if [h_tenant_id] != "" and ![unmapped_extract_error] {
    mutate {
      replace => {
        "df_tenant.key" => "halcyon_tenant_id"
        "df_tenant.value" => "%{h_tenant_id}"
      }
      on_error => "df_tenant_error"
    }
    if ![df_tenant_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "df_tenant"
        }
        on_error => "df_tenant_merge_error"
      }
    }
  }

  if [h_exit_code] != "" and ![unmapped_extract_error] {
    mutate {
      replace => {
        "df_exit.key" => "halcyon_exit_code"
        "df_exit.value" => "%{h_exit_code}"
      }
      on_error => "df_exit_error"
    }
    if ![df_exit_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "df_exit"
        }
        on_error => "df_exit_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "tag_reason" => "%{file.tags.0.value}"
    }
    on_error => "tag_reason_error"
  }
  if [tag_reason] != "" and ![tag_reason_error] {
    mutate {
      replace => {
        "df_reason.key" => "monitoring_reason"
        "df_reason.value" => "%{tag_reason}"
      }
      on_error => "df_reason_error"
    }
    if ![df_reason_error] {
      mutate {
        merge => {
          "security_result.detection_fields" => "df_reason"
        }
        on_error => "df_reason_merge_error"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_merge_error"
    }
  }

  # 12. Output Final Event
  mutate {
    merge => {
      "@output" => "event"
    }
    on_error => "output_merge_error"
  }
}
