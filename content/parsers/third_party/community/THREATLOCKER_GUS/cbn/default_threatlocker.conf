# Product:THREATLOCKER
# Category:THREATLOCKER
# Supported Format:JSON
# Reference:N/A
# Last Updated:2026-07-14
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "fp" => ""
      "pyid" => ""
      "u" => ""
      "a" => ""
      "h" => ""
      "pn" => ""
      "sn" => ""
      "dt" => ""
      "at" => ""
      "s" => ""
      "pid" => ""
      "rf" => ""
      "p" => ""
      "ap" => ""
      "e" => ""
      "organizationId" => ""
      "computerId" => ""
      "hostname" => ""
      "mo" => ""
      "n" => ""
      "s256" => ""
      "rp" => ""
      "mid" => ""
      "dan" => ""
      "security_result" => ""
      "action" => ""
      "outcome" => ""
      "src_ip" => ""
      "dest_ip" => ""
      "dest_port" => ""
      "ip_protocol" => ""
      "dest_host" => ""
      "domain" => ""
      "t" => ""
      "fullPath" => ""
      "actionType" => ""
      "username" => ""
      "dateTime" => ""
      "processId" => ""
      "sha256Hash" => ""
      "isMonitorMode" => ""
      "notes" => ""
      "policyName" => ""
      "applicationName" => ""
      "serialNumber" => ""
      "deviceType" => ""
      "eActionLogId" => ""
      "actionLogId" => ""
      "organizationName" => ""
      "policyId" => ""
      "processPath" => ""
      "parentProcessId" => ""
      "parentProcessName" => ""
      "sourceIPAddress" => ""
      "destinationPort" => ""
      "networkDirection" => ""
      "osType" => ""
      "size" => ""
      "encryptionStatus" => ""
      "hasViewComputerPermission" => ""
      "isProtectedProcess" => ""
      "isCloudLog" => ""
      "isCloudActionType" => ""
      "isExtension" => ""
      "createdByProcess" => ""
      "destinationIPAddress" => ""
      "hash" => ""
      "processName" => ""
      "edgeStoreUrl" => ""
      "chromeStoreUrl" => ""
      "firefoxStoreUrl" => ""
      "threatSeverityLevel" => ""
      "sec_action" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_in_json"
  }

  if [u] == "" and [username] != "" {
    mutate {
      replace => {
        "u" => "%{username}"
      }
      on_error => "u_replace_error"
    }
  }
  if [at] == "" and [actionType] != "" {
    mutate {
      replace => {
        "at" => "%{actionType}"
      }
      on_error => "at_replace_error"
    }
  }
  if [s256] == "" and [sha256Hash] != "" {
    mutate {
      replace => {
        "s256" => "%{sha256Hash}"
      }
      on_error => "s256_replace_error"
    }
  }
  mutate {
    convert => {
      "processId" => "string"
    }
    on_error => "processId_convert_error"
  }
  if [pid] == "" and [processId] != "" {
    mutate {
      replace => {
        "pid" => "%{processId}"
      }
      on_error => "pid_replace_error"
    }
  }
  if [fp] == "" and [fullPath] != "" {
    mutate {
      replace => {
        "fp" => "%{fullPath}"
      }
      on_error => "fp_replace_error"
    }
  }
  if [mo] == "" and [isMonitorMode] != "" {
    mutate {
      convert => {
        "isMonitorMode" => "string"
      }
      on_error => "isMonitorMode_convert_error"
    }
    mutate {
      replace => {
        "mo" => "%{isMonitorMode}"
      }
      on_error => "mo_replace_error"
    }
  }
  if [n] == "" and [notes] != "" {
    mutate {
      replace => {
        "n" => "%{notes}"
      }
      on_error => "n_replace_error"
    }
  }
  if [p] == "" and [policyName] != "" {
    mutate {
      replace => {
        "p" => "%{policyName}"
      }
      on_error => "p_replace_error"
    }
  }
  if [ap] == "" and [applicationName] != "" {
    mutate {
      replace => {
        "ap" => "%{applicationName}"
      }
      on_error => "ap_replace_error"
    }
  }
  if [dt] == "" and [deviceType] != "" {
    mutate {
      replace => {
        "dt" => "%{deviceType}"
      }
      on_error => "dt_replace_error"
    }
  }
  if [pn] == "" and [processPath] != "" {
    mutate {
      replace => {
        "pn" => "%{processPath}"
      }
      on_error => "pn_replace_error"
    }
  }
  if [s] == "" and [size] != "" {
    mutate {
      convert => {
        "size" => "string"
      }
      on_error => "size_convert_error"
    }
    mutate {
      replace => {
        "s" => "%{size}"
      }
      on_error => "size_replace_error"
    }
  }
  if [e] == "" and [encryptionStatus] != "" {
    mutate {
      replace => {
        "e" => "%{encryptionStatus}"
      }
      on_error => "encryptionStatus_replace_error"
    }
  }
  if [t] != "" {
    date {
      match => ["t", "yyyy-MM-ddTHH:mm:ss", "RFC3339", "yyyy-MM-ddTHH:mm:ssZ"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "date_error"
    }
  }
  else if [dateTime] != "" {
    date {
      match => ["dateTime", "ISO8601", "yyyy-MM-ddTHH:mm:ssZ", "yyyy-MM-dd HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "date_time_error"
    }
  }
  if [sourceIPAddress] not in ["","null"] {
    grok {
      match => {
        "sourceIPAddress" => [
          "%{IP:src_ip}"
        ]
      }
      overwrite => ["src_ip"]
      on_error => "src_ip_error"
    }
    if ![src_ip_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
        }
        on_error => "src_ip_merge_error"
      }
    }
  }
  if [destinationIPAddress] not in ["","null"] {
    grok {
      match => {
        "destinationIPAddress" => [
          "%{IP:dest_ip}"
        ]
      }
      overwrite => ["dest_ip"]
      on_error => "dest_ip_error"
    }
    if ![dest_ip_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dest_ip"
          "event.idm.read_only_udm.target.asset.ip" => "dest_ip"
        }
        on_error => "dest_ip_merge_error"
      }
    }
  }

  if [at] == "network" {
    grok {
      match => {
        "fp" => [
          "Src: %{IP:src_ip}; Dest: (\\[)?%{IP:dest_ip}(\\])?:%{INT:dest_port}"
          "%{DATA:dest_host}\\(%{IP:dest_ip}\\):%{INT:dest_port}"
          "(\\[)?%{IP:dest_ip}(\\])?:%{INT:dest_port}"
        ]
      }
      overwrite => ["src_ip", "dest_host", "dest_ip", "dest_port"]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [at] in ["execute", "install", "newprocess"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.full_path" => "%{fp}"
      }
    }
  }
  else if [at] in ["write", "read", "delete", "move"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{fp}"
      }
    }
  }
  else if [at] == ["registry"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.registry.registry_key" => "%{fp}"
      }
    }
  }
  else if [at] == "powershell" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{fp}"
      }
      on_error => "fp_replace_failed"
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }
  }

  if [dest_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dest_ip"
      }
    }
  }

  if [dest_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{dest_host}"
      }
    }
  }

  if [dest_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dest_port}"
      }
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
    }
  }

  if [pyid] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{pyid}"
      }
    }
  }

  if [u] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{u}"
      }
    }
    grok {
      match => {
        "u" => [
          "%{DATA:domain}\\\\%{GREEDYDATA:u}"
        ]
      }
      on_error => "not_match"
      overwrite => ["u", "domain"]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{u}"
      }
    }
  }

  if [a] == 1 {
    mutate {
      replace => {
        "sec_action" => "ALLOW"
      }
    }
  }
  else if [a] == 2 {
    mutate {
      replace => {
        "sec_action" => "BLOCK"
      }
    }
  }
  else if [a] == 3 {
    mutate {
      replace => {
        "sec_action" => "CHALLENGE"
      }
    }
  }
  else if [a] == 4 {
    mutate {
      replace => {
        "sec_action" => "ALLOW_WITH_MODIFICATION"
      }
    }
  }
  else if [a] == 5 {
    mutate {
      replace => {
        "sec_action" => "UNKNOWN_ACTION"
      }
    }
  }
  else if [a] == 6 {
    mutate {
      replace => {
        "sec_action" => "QUARANTINE"
      }
    }
  }

  if [action] != "" {
    if [action] =~ "(?i)(Permit|Allow)" {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    }
    else if [action] =~ "(?i)Block" {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }
  }
  if [sec_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sec_action"
      }
      on_error => "no_sec_action"
    }
  }

  if [p] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{p}"
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
      }
    }
  }

  if [pn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{pn}"
      }
    }
  }

  if [n] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{n}"
      }
    }
  }

  if [h] != "" {
    mutate {
      lowercase => ["h"]
    }
  }

  if [h] =~ "^[0-9a-f]+$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha1" => "%{h}"
      }
    }
  }

  if [sn] =~ "Tcp" {
    mutate {
      replace => {
        "ip_protocol" => "TCP"
      }
    }
  }

  if [ip_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{ip_protocol}"
      }
    }
  }

  if [dt] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.category" => "%{dt}"
      }
    }
  }

  if [at] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{at}"
      }
    }
  }

  mutate {
    convert => {
      "mo" => "string"
    }
    on_error => "mo_convert_error"
  }

  if [mo] == "true" {
    mutate {
      replace => {
        "outcome.key" => "Monitor mode status"
        "outcome.value" => "monitor mode on"
      }
    }
  }
  else if [mo] == "false" {
    mutate {
      replace => {
        "outcome.key" => "Monitor mode status"
        "outcome.value" => "monitor mode off"
      }
    }
  }

  if [outcome] != "" {
    mutate {
      merge => {
        "security_result.outcomes" => "outcome"
      }
    }
  }
  mutate {
    convert => {
      "s" => "string"
    }
    on_error => "s_convert_error"
  }
  if [s] not in ["","0"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.size" => "%{s}"
      }
      on_error => "s_replace_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.file.size" => "uinteger"
      }
      on_error => "s_uinteger_convert_error"
    }
  }

  if [pid] != "" {
    mutate {
      convert => {
        "pid" => "string"
      }
      on_error => "pid_convert_error"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
      on_error => "pid_replace_failed"
    }
  }

  if [p] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{p}"
      }
    }
  }

  if [ap] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{ap}"
      }
    }
  }

  if [e] != "" {
    mutate {
      convert => {
        "e" => "string"
      }
      on_error => "e_convert_error"
    }
    mutate {
      replace => {
        "encryption_status_label.key" => "Encryption Status"
        "encryption_status_label.value" => "%{e}"
      }
      on_error => "e_replace_error"
    }
    if ![e_replace_error] {
      mutate {
        merge => {
          "security_result.about.resource.attribute.labels" => "encryption_status_label"
        }
        on_error => "e_merge_error"
      }
    }
  }

  if [mid] != "" {
    mutate {
      replace => {
        "maintenanceId_label.key" => "Maintenance Id"
        "maintenanceId_label.value" => "%{mid}"
      }
    }
    mutate {
      merge => {
        "security_result.about.resource.attribute.labels" => "maintenanceId_label"
      }
    }
  }

 if [rf] != "" {
    mutate {
      convert => {
        "rf" => "string"
      }
    }
    mutate {
      replace => {
        "ringfence_label.key" => "Ring Fence"
        "ringfence_label.value" => "%{rf}"
      }
    }
    mutate {
      merge => {
        "security_result.about.resource.attribute.labels" => "ringfence_label"
      }
    }
  }

  if [organizationId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.product_object_id" => "%{organizationId}"
      }
      on_error => "no_organizationId"
    }
  }

  if [computerId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.asset_id" => "ComputerId: %{computerId}"
      }
    }
  }

  if [s256] != "" {
    mutate {
      lowercase => ["s256"]
    }
  }

  if [s256] =~ "^[0-9a-f]+$" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{s256}"
        "event.idm.read_only_udm.target.process.file.sha256" => "%{s256}"
      }
    }
  }

  if [rp] != "" {
    mutate {
      replace => {
        "_auth_mechanism" => "REMOTE"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.auth.mechanism"  => "_auth_mechanism"
      }
      on_error => "no_rp"
    }
  }

  if [dan] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{dan}"
      }
    }
  }

  if [eActionLogId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{eActionLogId}"
      }
      on_error => "no_eActionLogId"
    }
  }
  if [organizationName] not in ["","null"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{organizationName}"
      }
      on_error => "no_organizationName"
    }
  }
  mutate {
    convert => {
      "networkDirection" => "string"
    }
    on_error => "networkDirection_conversion_error"
  }
  if [networkDirection] =~ "(?i)inbound" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "INBOUND"
      }
    }
  }
  else if [networkDirection] =~ "(?i)outbound" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "OUTBOUND"
      }
    }
  }
  if [policyId] not in ["","null"] {
    mutate {
      replace => {
        "security_result.rule_id" => "%{policyId}"
      }
      on_error => "no_policy_id"
    }
  }
  mutate {
    lowercase => ["hash"]
  }
  if [hash] =~ "^[0-9a-f]+$" {
     mutate {
      replace => {
        "event.idm.read_only_udm.target.process.file.sha256" => "%{hash}"
      }
      on_error => "no_hash"
    }
  }
  mutate {
    convert => {
      "osType" => "string"
    }
    on_error => "osType_conversion_error"
  }
  if [osType] =~ "(?i)iOS" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.platform_software.platform" => "IOS"
      }
    }
  }
  else if [osType] =~ "(?i)Android" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.platform_software.platform" => "ANDROID"
      }
    }
  }
  else if [osType] =~ "(?i)Windows" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.platform_software.platform" => "WINDOWS"
      }
    }
  }
  else if [osType] =~ "(?i)MAC" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.platform_software.platform" => "MAC"
      }
    }
  }
  if [processName] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.process.file.names" => "processName"
      }
      on_error => "no_processName"
    }
  }
  if [parentProcessId] != "" {
    mutate {
      convert => {
        "parentProcessId" => "string"
      }
      on_error => "parentProcessId_conversion_error"
    }
     mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.parent_process.pid" => "%{parentProcessId}"
      }
      on_error => "no_parentProcessId"
    }
  }
  if [parentProcessName] != "" {
     mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.parent_process.file.full_path" => "%{parentProcessName}"
      }
      on_error => "no_parentProcessName"
    }
  }
  if [edgeStoreUrl] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.url" => "edgeStoreUrl"
      }
      on_error => "no_edgeStoreUrl"
    }
  }
  else if [chromeStoreUrl] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.url" => "chromeStoreUrl"
      }
      on_error => "no_chromeStoreUrl"
    }
  }
  else if [firefoxStoreUrl] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.url" => "firefoxStoreUrl"
      }
      on_error => "no_firefoxStoreUrl"
    }
  }
  if [serialNumber] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.server.certificate.serial" => "%{serialNumber}"
      }
      on_error => "no_serialNumber"
    }
  }
  for cert in certificates {
    if [cert][subject] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.tls.server.certificate.subject" => "%{cert.subject}"
        }
        on_error => "no_cert_subject"
      }
    }
    if [cert][validCert] != "" {
      mutate {
        replace => {
          "valid_cert_label.key" => "validCert"
          "valid_cert_label.value" => "%{cert.validCert}"
        }
        on_error => "no_valid_cert"
      }
      if ![no_valid_cert] {
        mutate {
          merge => {
            "security_result.detection_fields" => "valid_cert_label"
          }
          on_error => "no_valid_cert_label"
        }
      }
    }
  }
  if [destinationPort] not in ["","null"] {
    mutate {
      convert => {
        "destinationPort" => "string"
      }
      on_error => "destinationPort_convert_err"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{destinationPort}"
      }
      on_error => "no_destinationPort"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "destinationPort_to_int_err"
    }
  }
  if [policyName] != "" {
     mutate {
      replace => {
        "security_result.rule_name" => "%{policyName}"
      }
      on_error => "no_policyName"
    }
  }
  if [threatSeverityLevel] =~ "(?i)Critical" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }
  else if [threatSeverityLevel] =~ "(?i)High" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [threatSeverityLevel] =~ "(?i)Medium" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [threatSeverityLevel] =~ "(?i)Low" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [src_ip] != "" and [dest_ip] != "" and [ip_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [fp] != "" and [pn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_UNCATEGORIZED"
      }
    }
  }
  if [at] == "network" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  if [at] in ["execute", "install", "powershell"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"
      }
    }
  }
  else if [at] == "newprocess" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_OPEN"
      }
    }
  }
  else if [at] == "write" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
      }
    }
  }
  else if [at] == "read" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_READ"
      }
    }
  }
  else if [at] == "delete" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_DELETION"
      }
    }
  }
  else if [at] == "move" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
      }
    }
  }
  else if [at] == "registry" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_UNCATEGORIZED"
      }
    }
  }
  mutate {
    rename => {
      "remotePresence" => "addition.remotePresence"
      "remotePresenceThreatLockerDetected" => "addition.remotePresenceThreatLockerDetected"
      "remotePresenceText" => "addition.remotePresenceText"
      "certExists" => "addition.certExists"
      "certText" => "addition.certText"
      "applicationOrganizationId" => "addition.applicationOrganizationId"
      "applicationIsBuiltIn" => "addition.applicationIsBuiltIn"
      "policyExists" => "addition.policyExists"
      "policyEnabled" => "addition.policyEnabled"
      "storagePolicyExists" => "addition.storagePolicyExists"
      "nacPolicyExists" => "addition.nacPolicyExists"
      "secureNetworkPolicyExists" => "addition.secureNetworkPolicyExists"
      "twPolicyExists" => "addition.twPolicyExists"
      "webControlPolicyExists" => "addition.webControlPolicyExists"
      "cmPolicyExists" => "addition.cmPolicyExists"
      "optionToRequest" => "addition.optionToRequest"
      "allowPermitVendorButton" => "addition.allowPermitVendorButton"
      "reportMissing" => "addition.reportMissing"
      "isVirusTotalUnavailable" => "addition.isVirusTotalUnavailable"
      "deleteFileRequestSent" => "addition.deleteFileRequestSent"
      "isAccessDevice" => "addition.isAccessDevice"
      "allowFileUpload" => "addition.allowFileUpload"
      "canViewOnSystemLookup" => "addition.canViewOnSystemLookup"
      "hasPolicyData" => "addition.hasPolicyData"
      "monitorMode" => "addition.monitorMode"
      "learningModeEndDate" => "addition.learningModeEndDate"
      "policyLocation" => "addition.policyLocation"
      "policyOrganizationId" => "addition.policyOrganizationId"
      "applicationId" => "addition.applicationId"
      "encryption" => "addition.encryption"
      "effectiveAction" => "addition.effectiveAction"
      "virusTotalCheckName" => "addition.virusTotalCheckName"
      "virusTotalCheckArgument" => "addition.virusTotalCheckArgument"
      "isExtension" => "addition.isExtension"
      "actionLogCreatedByProcesses" => "addition.actionLogCreatedByProcesses"
      "totalCount" => "addition.totalCount"
      "lastSortValue" => "addition.lastSortValue"
      "groupByCount" => "addition.groupByCount"
      "batchId" => "addition.batchId"
      "isProtectedProcess" => "addition.isProtectedProcess"
      "memoryBytes" => "addition.memoryBytes"
      "parentProcessApplicationId" => "addition.parentProcessApplicationId"
      "parentProcessApplicationName" => "addition.parentProcessApplicationName"
      "parentProcessApplicationOrganizationId" => "addition.parentProcessApplicationOrganizationId"
      "hasViewComputerPermission" => "addition.hasViewComputerPermission"
      "systemLookupUrl" => "addition.systemLookupUrl"
      "integrationTypeId" => "addition.integrationTypeId"
      "isCloudLog" => "addition.isCloudLog"
      "isCloudActionType" => "addition.isCloudActionType"
      "engineRatings" => "addition.engineRatings"
      "createdByProcess" => "addition.createdByProcess"
      "actionLogId" => "addition.actionLogId"
      "threatLockerItem.d" => "addition.threatLockerItem_d"
      "threatLockerItem.at" => "addition.threatLockerItem_at"
      "threatLockerItem.aid" => "addition.threatLockerItem_aid"
      "dateTimeImported" => "addition.dateTimeImported"
      "actionTypeId" => "addition.actionTypeId"
      "actionId" => "addition.actionId"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_convert_failure"
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [check_] not in ["", "N/A", "null"] {
      mutate {
        replace => {
          "field_.key" => "%{key}"
          "field_.value.string_value" => "%{check_}"
        }
        on_error => "key_not_exists"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "field_"
        }
        on_error => "additional_fields_error"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "THREATLOCKER"
      "event.idm.read_only_udm.metadata.vendor_name" => "THREATLOCKER"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
