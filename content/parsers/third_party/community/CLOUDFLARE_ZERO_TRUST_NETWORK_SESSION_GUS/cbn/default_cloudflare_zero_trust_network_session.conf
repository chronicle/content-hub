# Product: Cloudflare Zero Trust Network Session
# Category: Authentication log types
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-10-15
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "intermediary" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "AccountID" => ""
      "BytesReceived" => ""
      "BytesSent" => ""
      "ConnectionCloseReason" => ""
      "DeviceID" => ""
      "DeviceName" => ""
      "EgressIP" => ""
      "EgressPort" => ""
      "EgressRuleID" => ""
      "EgressRuleName" => ""
      "Email" => ""
      "OriginIP" => ""
      "OriginPort" => ""
      "Protocol" => ""
      "SessionID" => ""
      "SessionStartTime" => ""
      "SourceIP" => ""
      "SourcePort" => ""
      "VirtualNetworkID" => ""
    }
  }

  mutate {
    gsub => ["message", "\\r\\n", ""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [SessionStartTime] != "" {
    date {
      match => ["SessionStartTime", "ISO8601", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_date_format"
    }
  }

  if [AccountID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" =>
          "%{AccountID}"
      }
      on_error => "no_account_id"
    }
  }

  if [BytesReceived] != "" {
    mutate {
      convert => {
        "BytesReceived" => "string"
      }
      on_error => "bytes_received_not_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{BytesReceived}"
      }
      on_error => "bytes_received_not_found"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.received_bytes" => "uinteger"
      }
      on_error => "bytes_received_not_integer"
    }
  }

  if [BytesSent] != "" {
    mutate {
      convert => {
        "BytesSent" => "string"
      }
      on_error => "bytes_sent_not_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{BytesSent}"
      }
      on_error => "bytes_sent_not_found"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "bytes_sent_not_integer"
    }
  }

  if [ConnectionCloseReason] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{ConnectionCloseReason}"
      }
      on_error => "connection_close_reason_not_found"
    }
  }

  if [EgressRuleID] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{EgressRuleID}"
      }
      on_error => "egress_rule_id_not_found"
    }
  }

  if [EgressRuleName] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{EgressRuleName}"
      }
      on_error => "egress_rule_name_not_found"
    }
  }

  if [DeviceID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset_id" =>
          "Device ID:%{DeviceID}"
        "event.idm.read_only_udm.principal.asset.asset_id" =>
          "Device ID:%{DeviceID}"
        "has_principal" => "true"
      }
      on_error => "no_device_id"
    }
  }

  if [DeviceName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.hostname" => "%{DeviceName}"
        "event.idm.read_only_udm.principal.hostname" => "%{DeviceName}"
        "has_principal" => "true"
      }
      on_error => "invalid_device_name"
    }
  }

  if [SourceIP] != "" {
    grok {
      match => {
        "SourceIP" => "%{IP:SourceIP}"
      }
      overwrite => ["SourceIP"]
      on_error => "not_source_ip"
    }
    if ![not_source_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "SourceIP"
          "event.idm.read_only_udm.principal.asset.ip" => "SourceIP"
        }
        on_error => "source_ip_merge_error"
      }
      if ![source_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  mutate {
    convert => {
      "SourcePort" => "string"
    }
    on_error => "source_port_already_string"
  }

  if [SourcePort] not in ["", "0"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{SourcePort}"
      }
      on_error => "source_port_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "source_port_convert_error"
    }
  }

  if [EgressIP] != "" {
    grok {
      match => {
        "EgressIP" => "%{IP:EgressIP}"
      }
      overwrite => ["EgressIP"]
      on_error => "not_egress_ip"
    }
    if ![not_egress_ip] {
      mutate {
        merge => {
          "intermediary.ip" => "EgressIP"
          "intermediary.asset.ip" => "EgressIP"
        }
        on_error => "egress_ip_merge_error"
      }
    }
  }

  mutate {
    convert => {
      "EgressPort" => "string"
    }
    on_error => "egress_port_already_string"
  }

  if [EgressPort] not in ["", "0"] {
    mutate {
      replace => {
        "intermediary.port" => "%{EgressPort}"
      }
      on_error => "egress_port_empty"
    }
    mutate {
      convert => {
        "intermediary.port" => "integer"
      }
      on_error => "egress_port_convert_error"
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_error"
    }
  }

  if [OriginIP] != "" {
    grok {
      match => {
        "OriginIP" => "%{IP:OriginIP}"
      }
      overwrite => ["OriginIP"]
      on_error => "not_origin_ip"
    }
    if ![not_origin_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "OriginIP"
          "event.idm.read_only_udm.target.asset.ip" => "OriginIP"
        }
        on_error => "target_ip_empty"
      }
      if ![target_ip_empty] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }

  mutate {
    convert => {
      "OriginPort" => "string"
    }
    on_error => "origin_port_already_string"
  }

  if [OriginPort] not in ["", "0"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{OriginPort}"
      }
      on_error => "origin_port_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "target_port_convert_error"
    }
  }

  if [SessionID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{SessionID}"
      }
      on_error => "session_id_empty"
    }
  }

  if [Email] =~ "^.+@.+$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "Email"
      }
      on_error => "no_email_address"
    }
  }

  if [VirtualNetworkID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.product_object_id" =>
          "%{VirtualNetworkID}"
      }
      on_error => "no_virtual_network_id"
    }
  }

  if [Protocol] != "" {
    if [Protocol] =~ "(?i)tcp" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "TCP"
        }
      }
    }
    else if [Protocol] =~ "(?i)udp" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "UDP"
        }
      }
    }
    else if [Protocol] =~ "(?i)icmp" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "ICMP"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" =>
            "UNKNOWN_IP_PROTOCOL"
        }
      }
    }
  }

  if ![not_json] {
    mutate {
      rename => {
        "ClientTCPHandshakeDurationMs" => "log.ClientTCPHandshakeDurationMs"
        "ClientTLSHandshakeDurationMs" => "log.ClientTLSHandshakeDurationMs"
        "ConnectionReuse" => "log.ConnectionReuse"
        "DestinationTunnelID" => "log.DestinationTunnelID"
        "EgressColoName" => "log.EgressColoName"
        "IngressColoName" => "log.IngressColoName"
        "Offramp" => "log.Offramp"
        "OriginTLSCertificateValidationResult" =>
          "log.OriginTLSCertificateValidationResult"
        "OriginTLSHandshakeDurationMs" => "log.OriginTLSHandshakeDurationMs"
        "OriginTLSVersion" => "log.OriginTLSVersion"
        "RuleEvaluationDurationMs" => "log.RuleEvaluationDurationMs"
        "SessionEndTime" => "log.SessionEndTime"
      }
    }
  }

  for key, value in log map {
    mutate {
      replace => {
        "field_" => ""
        "check_" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [check_] != "" {
      mutate {
        replace => {
          "field_.key" => "%{key}"
          "field_.value.string_value" => "%{value}"
        }
        on_error => "field_replace_error"
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "field_"
        }
        on_error => "no_additional_fields"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Cloudflare"
      "event.idm.read_only_udm.metadata.product_name" =>
        "Cloudflare Zero Trust Network Session"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
