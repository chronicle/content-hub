# Product: Elastic Packet Beats
# Category: Log Aggregator
# Supported Format: SYSLOG + JSON , JSON
# Reference: N/A
# Last Updated: 2025-02-13
# Copyright 2025 Google SecOps


filter {

  # ------------ Sentinel fields ------------
  # - initialize empty variables for values that may or may not be present in a log message
  # - these must be created before you import your log source, which will overwrite these with a value, if one exists in log message
  mutate {
    replace => {
      "status"                 => ""
      "user_agent.original"    => "" #http
      "http.request.method"    => "" #http
      "url.full"               => "" #http
      "error.message"          => "" #all
      "dns.answers"            => "" #dns
      "dhcpv4.option.hostname" => "" #dhcpv4
      "dhcpv4.client_ip"       => "" #dhcpv4
      "dhcpv4.option.message_type"                    => "" #dhcpv4
      "tls.next_protocol"                             => "" #tls
      "tls.detailed.server_certificate.version"       => "" #tls
      "tls.detailed.server_certificate.serial_number" => "" #tls
      "tls.server.subject"       => "" #tls
      "tls.server.issuer"        => "" #tls
      "tls.server.hash.sha1"     => "" #tls
      "tls.detailed.server_certificate.not_before"    => "" #tls
      "tls.detailed.server_certificate.not_after"     => "" #tls
      "network.direction"        => "" #all
      "network.community_id"     => "" #all
      "flow.final"               => "" #flow
      "tls.client.server_name"   => ""
      "tls.client.ja3"           => ""
      "destination.ip"           => ""
      "server.domain"            => ""
      "source.ip"                => ""
      "event.dataset" => ""
      "agent.hostname" => ""
      "agent.type" => ""
      "agent.version" => ""
      "level" => ""
      "server_name" => ""
      "kv_data" => ""
      "application" => ""
      "user_id" => ""
      "user_name" => ""
      "msg" => ""
      "client" => ""
      "logger" => ""
      "json_data" => ""
      "audit_category" => ""
      "audit_cluster_name" => ""
      "audit_node_id" => ""
      "audit_node_name" => ""
      "audit_request_effective_user" => ""
      "component" => ""
      "cluster.uuid" => ""
      "type" => ""
      "audit_request_initiating_user" => ""
      "audit_node_host_address" => ""
      "audit_request_remote_address" => ""
      "agent.name" => ""
      "server.ip" => ""
      "headers.accept_encoding" => ""
      "headers.x_forwarded_proto" => ""
      "headers.content_length" => ""
      "headers.content_type" => ""
      "headers.x_envoy_attempt_count" => ""
      "headers.x_request_id" => ""
      "headers.http_host" => ""
      "headers.http_version" => ""
      "headers.x_b3_sampled" => ""
      "headers.http_accept" => ""
      "headers.http_user_agent" => ""
      "headers.request_method" => ""
      "headers.x_forwarded_for" => ""
      "headers.x_b3_parentspanid" => ""
      "headers.x_envoy_original_path" => ""
      "network.protocol" => ""
      "dns.question.type" => ""
      "dns.question.class" => ""
      "dns.flags.recursion_desired" => ""
      "dns.flags.recursion_available" => ""
      "dns.flags.authoritative" => ""
      "dns.flags.truncated_response" => ""
      "dns.response_code" => ""
      "network.dns" => ""
      "method" => ""
      "dns.resolved_ip" => ""
      "client_cert" => ""
      "json_data2"  => ""
      "host" => ""
      "dhcpv4.assigned_ip" => ""
      "dhcpv4.client_mac" => ""
      "dhcpv4.flags" => ""
      "dhcpv4.hardware_type" => ""
      "dhcpv4.hops" => ""
      "dhcpv4.op_code" => ""
      "dhcpv4.relay_ip" => ""
      "dhcpv4.seconds" => ""
      "dhcpv4.transaction_id" => ""
      "dhcpv4.option.dns_servers" => ""
      "dhcpv4.option.domain_name" => ""
      "dhcpv4.option.server_identifier" => ""
      "dhcpv4.option.subnet_mask" => ""
      "dhcpv4.option.rebinding_time_sec" => ""
      "dhcpv4.option.renewal_time_sec" => ""
      "dhcpv4.option.router" => ""
      "dhcpv4.option.parameter_request_list" => ""
      "dhcpv4.option.max_dhcp_message_size" => ""
    }
  }


  # ------------ Input Configuration  --------------
  # - extract fields from the log message
  # - add an on_error handler in case of unexpected input

  # Strip syslog header from PacketBeats via LogStash syslog output
  # - expected format "<13>Feb 16 13:05:14 beats LOGSTASH[-]: {json}"
  grok {
    match => {
      message => ["^.*?]:.*?(?P<message>\{.*\})",
                  "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:server_name} %{DATA:application}\\[%{INT:pid}\\]:\\s+(?P<description>.* session %{WORD:session_status} .* user %{NOTSPACE:user_name} by\\s+\\(uid=%{DATA:user_id}\\))",
                  "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:server_name} %{DATA:application}\\[%{INT:pid}]:%{GREEDYDATA:kv_data}",
                  "<%{INT}>%{SYSLOGTIMESTAMP:time} %{HOST:server_name} %{GREEDYDATA:kv_data}",
                   "(?P<json_data>%{GREEDYDATA})"
                 ]
    }
    overwrite => ["message","kv_data","server_name","application","user_id","user_name","json_data"]
    on_error => "grok_fail"
  }
  if ![grok_fail] {
    grok {
      match => {
        "message" => ["%{GREEDYDATA}x_forwarded_client_cert\\\":%{DATA:client_cert}\\\",%{GREEDYDATA:json_data2}"]
      }
      overwrite => ["client_cert","json_data2"]
      on_error => "grok_error"
    }
    if [json_data2] !=  "" {
      mutate {
        gsub => ["message",",\\\"x_forwarded_client_cert\\\"(?<value>)\\\",",""]
      }
      mutate {
        replace => {
          "json_data2" => "{%{json_data2}}"
        }
        on_error => "replace_error"
      }
      json {
        source => "json_data2"
        array_function => "split_columns"
        on_error => "not_json2"
      }
    }
    else {
      mutate {
        gsub => ["message",",\\\"x_forwarded_client_cert\\\".*","}}"]
      }
    }
  }
  if [json_data] != "" {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "_not_json"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }

  if [kv_data] != "" {
    mutate {
      gsub => [ "kv_data", " ([a-zA-Z0-9]+=)", ";$1"]
    }
    kv {
      source => "kv_data"
      value_split => "="
      field_split => ";"
    }
  }

  if [agent][hostname] == "" and [agent][name] != "" {
    mutate {
      replace => {
        "agent.hostname" => "%{agent.name}"
      }
      on_error => "agent_error"
    }
  }

  # ------------ Date Extract  --------------
  date {
    match => ["@timestamp", "RFC3339", "UNIX", "ISO8601" ]
    on_error => "timestamp_not_found"
  }
  if [timestamp_not_found] {
    date {
      match => ["time", "ISO8601","UNIX","RFC3339"]
      on_error => "timestamp_in_diff_format"
    }
  }

  # ------------ Field Assignment  --------------

  #  >>>>> START METADATA
  mutate {
    replace => {
      "event1.idm.read_only_udm.metadata.vendor_name"  =>  "Elastic"
      "event1.idm.read_only_udm.metadata.product_name"  =>  "PacketBeat"
      "event1.idm.read_only_udm.metadata.event_type"  =>  "GENERIC_EVENT"
    }
  }

  if [server_name] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.tls.client.server_name" => "%{server_name}"
      }
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.application" => "%{application}"
      }
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.user.userid" => "%{user_id}"
      }
    }
  }

  if [user_name] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.user.user_display_name" => "%{user_name}"
      }
    }
  }

  if [level] == "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.description" => "%{kv_data}"
      }
    }
  }

  if [level] != "" {
    mutate {
      uppercase => [ "level" ]
    }
    if [level] =~ "INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [level] =~ "ERROR" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    } else if [level] =~ "WARNING" {
      mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    }
  }

  if [msg] != "" {
    mutate {
      gsub => [ "msg", '\"', ""]

    }
    mutate {
      replace => {
        "event1.idm.read_only_udm.security_result.description" => "%{msg}"
      }
    }
  }

  if [logger] != "" {
    mutate {
      replace => {
        "additional_fields.key" => "logger"
        "additional_fields.value.string_value" => "%{logger}"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_fields"
      }
    }
  }

  if [audit_category] != "" {
    mutate {
      replace => {
        "sec_result_category_details" => "%{audit_category}"
      }
    }
    mutate {
      merge => {
        "security_result.category_details" => "sec_result_category_details"
      }
    }
  }

  if [audit_cluster_name] != "" {
    mutate {
      replace => {
        "additional_audit_cluster_name.key" => "audit_cluster_name"
        "additional_audit_cluster_name.value.string_value" => "%{audit_cluster_name}"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_audit_cluster_name"
      }
    }
  }

  if [audit_node_id] != "" {
    mutate {
      replace => {
        "additional_audit_node_id.key" => "audit_node_id"
        "additional_audit_node_id.value.string_value" => "%{audit_node_id}"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_audit_node_id"
      }
    }
  }

  if [audit_node_name] != "" {
    mutate {
      replace => {
        "additional_audit_node_name.key" => "audit_node_name"
        "additional_audit_node_name.value.string_value" => "%{audit_node_name}"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_audit_node_name"
      }
    }
  }

  if [audit_request_effective_user] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.observer.user.userid" => "%{audit_request_effective_user}"
      }
    }
  }

  if [component] != "" {
    mutate {
      replace => {
        "additional_component.key" => "component"
        "additional_component.value.string_value" => "%{component}"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_component"
      }
    }
  }

  if [audit_node_host_address] != "" {
    mutate {
      merge => {
        "event1.idm.read_only_udm.observer.ip" => "audit_node_host_address"
      }
    }
  }

  if [audit_request_remote_address] != "" and [audit_request_remote_address] != [audit_node_host_address] {
    mutate {
      merge => {
        "event1.idm.read_only_udm.observer.ip" => "audit_request_remote_address"
      }
    }
  }

  if [audit_request_initiating_user] != "" {
    mutate {
      replace => {
        "additional_audit_request_initiating_user.key" => "audit_request_initiating_user"
        "additional_audit_request_initiating_user.value.string_value" => "%{audit_request_initiating_user}"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_audit_request_initiating_user"
      }
    }
  }

  if [cluster][uuid] != "" {
    mutate {
      replace => {
        "additional_uuid.key" => "uuid"
        "additional_uuid.value.string_value" => "%{cluster.uuid}"
      }
    }
    mutate {
      merge => {
        "event1.idm.read_only_udm.additional.fields" => "additional_uuid"
      }
    }
  }

  if [event][dataset] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_event_type" =>  "%{event.dataset}"
      }
    }
  }

  if [status] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.description"        =>  "%{status}"
      }
    }
  }
  # <<<<<

  # >>>>> START OBSERVER
  if [agent][hostname] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.observer.hostname" => "%{agent.hostname}"
      }
    }
  }

  if [agent][type] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.observer.application" => "%{agent.type}"
        "event1.idm.read_only_udm.observer.asset_id" => "%{agent.type}:%{agent.id}"
      }
    }
  }

  if [agent][version] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.observer.platform_version" => "%{agent.version}"
      }
    }
  }
  if [headers][accept_encoding] != "" {
    mutate {
      replace => {
        "additional_accept_encoding.key" => "Accept-Encoding"
        "additional_accept_encoding.value" => "%{headers.accept_encoding}"
      }
      on_error => "accept_encoding_error"
    }
    if ![accept_encoding_error] {
      mutate {
        merge => {
          "security_result.about.labels" => "additional_accept_encoding"
        }
        on_error => "accept_encoding_merge_error"
      }
    }
  }
  if [headers][content_length] != "" {
    mutate {
      replace => {
        "content_length_label.key" => "content_length"
        "content_length_label.value.string_value" => "%{headers.content_length}"
      }
      on_error => "content_length_error"
    }
    if ![content_length_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "content_length_label"
        }
        on_error => "content_length_merge_error"
      }
    }
  }
  if [headers][content_type] != "" {
    mutate {
      replace => {
        "content_type_label.key" => "content_type"
        "content_type_label.value.string_value" => "%{headers.content_type}"
      }
      on_error => "content_type_error"
    }
    if ![content_type_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "content_type_label"
        }
        on_error => "content_type_merge_error"
      }
    }
  }
  if [headers][http_host] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.hostname" => "%{headers.http_host}"
        "event1.idm.read_only_udm.principal.asset.hostname" => "%{headers.http_host}"
      }
      on_error => "http_host_error"
    }
  }
  if [headers][x_forwarded_proto] != "" {
    mutate {
      replace => {
        "x_forwarded_proto_label.key" => "x_forwarded_proto"
        "x_forwarded_proto_label.value.string_value" => "%{headers.x_forwarded_proto}"
      }
      on_error => "x_forwarded_proto_error"
    }
    if ![x_forwarded_proto_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "x_forwarded_proto_label"
        }
        on_error => "x_forwarded_proto_merge_error"
      }
    }
  }
  if [headers][x_envoy_attempt_count] != "" {
    mutate {
      replace => {
        "additional_x_envoy_attempt_count.key" => "x_envoy_attempt_count"
        "additional_x_envoy_attempt_count.value" => "%{headers.x_envoy_attempt_count}"
      }
      on_error => "x_envoy_attempt_count_error"
    }
    if ![x_envoy_attempt_count_error] {
      mutate {
        merge => {
          "security_result.about.labels" => "additional_x_envoy_attempt_count"
        }
        on_error => "x_envoy_attempt_count_merge_error"
      }
    }
  }
  if [headers][x_b3_sampled] != "" {
    mutate {
      replace => {
        "x_b3_sampled_label.key" => "x_b3_sampled"
        "x_b3_sampled_label.value.string_value" => "%{headers.x_b3_sampled}"
      }
      on_error => "x_b3_sampled_error"
    }
    if ![x_b3_sampled_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "x_b3_sampled_label"
        }
        on_error => "x_b3_sampled_merge_error"
      }
    }
  }
  if [headers][http_accept] != "" {
    mutate {
      replace => {
        "http_accept_label.key" => "http_accept"
        "http_accept_label.value.string_value" => "%{headers.http_accept}"
      }
      on_error => "http_accept_error"
    }
    if ![http_accept_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "http_accept_label"
        }
        on_error => "http_accept_merge_error"
      }
    }
  }
  if [headers][x_b3_parentspanid] != "" {
    mutate {
      replace => {
        "x_b3_parentspanid_label.key" => "x_b3_parentspanid"
        "x_b3_parentspanid_label.value.string_value" => "%{headers.x_b3_parentspanid}"
      }
      on_error => "x_b3_parentspanid_error"
    }
    if ![x_b3_parentspanid_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "x_b3_parentspanid_label"
        }
        on_error => "x_b3_parentspanid_merge_error"
      }
    }
  }
  if [headers][x_envoy_original_path] != "" {
    mutate {
      replace => {
        "x_envoy_original_path_label.key" => "x_envoy_original_path"
        "x_envoy_original_path_label.value.string_value" => "%{headers.x_envoy_original_path}"
      }
      on_error => "x_envoy_original_path_error"
    }
    if ![x_envoy_original_path_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "x_envoy_original_path_label"
        }
        on_error => "x_envoy_original_path_merge_error"
      }
    }
  }
  if [headers][request_method] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.http.method" => "%{headers.request_method}"
      }
      on_error => "method_error"
    }
  }
  if [headers][x_forwarded_for] != "" {
    grok {
      match => {
        "headers.x_forwarded_for" => ["%{IP:ips}"]
      }
      on_error => "invalid_ip"
    }
    if ![invalid_ip] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "headers.x_forwarded_for"
          "event1.idm.read_only_udm.principal.asset.ip" => "headers.x_forwarded_for"
        }
        on_error => "ip_merge_error"
      }
    }
  }
  if [host] != "" {
    grok {
      match => {
        "host" => ["%{IP:host_ip}"]
      }
      on_error => "invalid_host_ip"
    }
    if ![invalid_host_ip] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "host"
          "event1.idm.read_only_udm.principal.asset.ip" => "host"
        }
        on_error => "ip_merge_error"
      }
    }
  }
  if [client_cert] != "" {
    mutate {
      replace => {
        "client_cert_label.key" => "client_cert"
        "client_cert_label.value.string_value" => "%{client_cert}"
      }
      on_error => "client_cert_error"
    }
    if ![client_cert_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "client_cert_label"
        }
        on_error => "client_cert_merge_error"
      }
    }
  }

  if [headers][x_request_id] != "" {
    mutate {
      replace => {
        "x_request_id_label.key" => "x_request_id"
        "x_request_id_label.value.string_value" => "%{headers.x_request_id}"
      }
      on_error => "x_request_id_error"
    }
    if ![x_request_id_error] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "x_request_id_label"
        }
        on_error => "x_request_id_merge_error"
      }
    }
  }

  if [headers][http_user_agent] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.http.user_agent" => "%{headers.http_user_agent}"
      }
      on_error => "user_agent_error"
    }
  }
  # <<<<<

  # >>>>> START GENERAL

  if [network][direction] != "" {
    mutate {
      uppercase => [ "network.direction" ]
    }

    if [network][direction] == "INGRESS" or [network][direction] == "INBOUND" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.direction" => "INBOUND"
        }
      }
    } else if [network][direction] == "EGRESS" or [network][direction] == "OUTBOUND" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.direction" => "OUTBOUND"
        }
      }
    }

  }

  # <<<<<

  # >>>>> START FLOW

  if [event][dataset] == "flow" {

    # only capture final completed flows, drop partial flows
    if [flow][final] {
      mutate {
        replace => {
          "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_FLOW"
        }
      }
    } else {
      drop{
        tag => "TAG_NO_SECURITY_VALUE"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.network.community_id" => "%{network.community_id}"
      }
      on_error => "_field_not_set"
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.network.session_id"   => "%{flow.id}"
      }
      on_error => "_field_not_set"
    }

    mutate {
      convert => {
        "source.port"       => "integer"
        "destination.port"  => "integer"
        "source.bytes"      => "uinteger"
        "destination.bytes" => "uinteger"
      }
    }

    mutate {
      rename => {
        "destination.port"  => "event1.idm.read_only_udm.target.port"
        "source.port"       => "event1.idm.read_only_udm.principal.port"
        "source.bytes"      => "event1.idm.read_only_udm.network.received_bytes"
        "destination.bytes" => "event1.idm.read_only_udm.network.sent_bytes"
      }
    }

    mutate {
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "source.ip"
        "event1.idm.read_only_udm.principal.asset.ip" => "source.ip"
      }
      on_error => "_field_not_set"
    }

    mutate {
      merge => {
        "event1.idm.read_only_udm.principal.mac" => "source.mac"
      }
      on_error => "_field_not_set"
    }

    mutate {
      merge => {
        "event1.idm.read_only_udm.target.mac"    => "destination.mac"
      }
      on_error => "_field_not_set"
    }

  }
  # <<<<<

  # >>>>> START DNS
  if [event][dataset] == "dns" or [method] == "QUERY" or [type]  == "dns" {
    mutate {
      convert => {
        "dns.id" => "uinteger"
        "client.port" => "integer"
        "server.port" => "integer"
        "client.bytes" => "uinteger"
        "server.bytes" => "uinteger"
      }
      uppercase => [ "network.direction", "network.protocol" ]
      on_error => "convert_error"
    }

    # dns eventtypes appear consistent with direction, so trust log source values
    mutate {
      rename => {
        "server.port"  => "event1.idm.read_only_udm.target.port"
        "client.port"  => "event1.idm.read_only_udm.principal.port"
        "client.bytes" => "event1.idm.read_only_udm.network.received_bytes"
        "server.bytes" => "event1.idm.read_only_udm.network.sent_bytes"
        "dns.id"       => "event1.idm.read_only_udm.network.dns.id"
      }
      on_error => "rename_error"
    }

    mutate {
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "client.ip"
        "event1.idm.read_only_udm.principal.asset.ip" => "client.ip"
      }
      on_error => "client_ip_errror"
    }

    if[server][ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip" => "server.ip"
          "event1.idm.read_only_udm.target.asset.ip" => "server.ip"
        }
        on_error => "target_ip_error"
      }
    }
    for index,ip in dns.resolved_ip {
      mutate {
        convert => {
          "ip" => "string"
        }
        on_error => "conversion_error"
      }
      mutate {
        replace => {
          "additional_data.data" => "%{ip}"
        }
        on_error => "resolved_ip_error"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.network.dns.additional" => "additional_data"
        }
        on_error => "merge_error"
      }
    }
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.community_id" => "%{network.community_id}"
      }
      on_error => "_field_not_set"
    }

    ##### START - DNS > Questions > Name
    mutate {
      replace => {
        "q.name" => "%{dns.question.name}"
      }
      on_error => "name_error"
    }

    ##### START - DNS > Questions > Type
    if [dns][question][type] == "A"      { mutate { replace => { "q.type" => "1"   } } }
    if [dns][question][type] == "NS"     { mutate { replace => { "q.type" => "2"   } } }
    if [dns][question][type] == "CNAME"  { mutate { replace => { "q.type" => "5"   } } }
    if [dns][question][type] == "SOA"    { mutate { replace => { "q.type" => "6"   } } }
    if [dns][question][type] == "PTR"    { mutate { replace => { "q.type" => "12"  } } }
    if [dns][question][type] == "MX"     { mutate { replace => { "q.type" => "15"  } } }
    if [dns][question][type] == "TXT"    { mutate { replace => { "q.type" => "16"  } } }
    if [dns][question][type] == "AAAA"   { mutate { replace => { "q.type" => "28"  } } }
    if [dns][question][type] == "SRV"    { mutate { replace => { "q.type" => "33"  } } }
    if [dns][question][type] == "NAPTR"  { mutate { replace => { "q.type" => "35"  } } }
    if [dns][question][type] == "DS"     { mutate { replace => { "q.type" => "43"  } } }
    if [dns][question][type] == "DNSKEY" { mutate { replace => { "q.type" => "48"  } } }
    if [dns][question][type] == "IXFR"   { mutate { replace => { "q.type" => "251" } } }
    if [dns][question][type] == "AXFR"   { mutate { replace => { "q.type" => "252" } } }
    if [dns][question][type] == "TYPE99" { mutate { replace => { "q.type" => "99"  } } }
    if [dns][question][type] == "TKEY"   { mutate { replace => { "q.type" => "249" } } }
    if [dns][question][type] == "ANY"    { mutate { replace => { "q.type" => "255" } } }
    if [dns][question][type] == "ALL"    { mutate { replace => { "q.type" => "255" } } }
    if [dns][question][type] == "URI"    { mutate { replace => { "q.type" => "256" } } }
    if [dns][question][type] == "NULL"   { mutate { replace => { "q.type" => "0"   } } }

    mutate {
        convert => {
          "q.type" => "uinteger"
      }
      on_error => "conversion_error"
    }

    ##### START - DNS > Questions > Class
    if [dns][question][class] == "IN"   { mutate { replace => {  "q.class" => "1"    } } }
    if [dns][question][class] == "NONE" { mutate { replace => {  "q.class" => "254"  } } }
    if [dns][question][class] == "ANY"  { mutate { replace => {  "q.class" => "255"  } } }

    mutate {
        convert => {
          "q.class" => "uinteger"
      }
      on_error => "conversion_error"
    }

    mutate {
      merge => {
        "event1.idm.read_only_udm.network.dns.questions" => "q"
      }
      on_error => "question_merge_error"
    }

    ##### START - DNS > Opcode
    if [dns][response_code] == "NOERROR"  { mutate { replace => { "rCode" => "0" } } }
    if [dns][response_code] == "FORMERR"  { mutate { replace => { "rCode" => "1" } } }
    if [dns][response_code] == "SERVFAIL" { mutate { replace => { "rCode" => "2" } } }
    if [dns][response_code] == "NXDOMAIN" { mutate { replace => { "rCode" => "3" } } }
    if [dns][response_code] == "NOTIMP"   { mutate { replace => { "rCode" => "4" } } }
    if [dns][response_code] == "REFUSED"  { mutate { replace => { "rCode" => "5" } } }
    if [dns][response_code] == "YXDOMAIN" { mutate { replace => { "rCode" => "6" } } }
    if [dns][response_code] == "YXRRSET"  { mutate { replace => { "rCode" => "7" } } }
    if [dns][response_code] == "NXRRSET"  { mutate { replace => { "rCode" => "8" } } }
    if [dns][response_code] == "NOTAUTH"  { mutate { replace => { "rCode" => "9" } } }
    if [dns][response_code] == "NOTZONE"  { mutate { replace => { "rCode" => "10" } } }

    if [rCode] == "0" {
      mutate {
        replace => {
          "response_code_label.key" => "dns.response_code"
          "response_code_label.value.string_value" => "0"
        }
        on_error => "response_code_label_error"
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.additional.fields" => "response_code_label"
        }
        on_error => "merge_error"
      }
    }
    if [dns][response_code] != "" {
      mutate {
        replace => {
          "dns_return_message.key" => "dns_return_message"
          "dns_return_message.value.string_value" => "%{dns.response_code}"
        }
        on_error => "dns_return_message_error"
      }
      if ![dns_return_message_error] {
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "dns_return_message"
          }
          on_error => "merge_error"
        }
      }
    }
    mutate {
      convert => {
        "rCode" => "uinteger"
      }
      on_error => "conversion_error"
    }

    mutate {
      rename => {
        "rCode" => "event1.idm.read_only_udm.network.dns.response_code"
      }
      on_error => "response_code_error"
    }

    ##### START - DNS > answers
    for _answer in dns.answers {

      mutate {
        replace => {
          "a.name" => "%{_answer.name}"
          "a.data" => "%{_answer.data}"
        }
        on_error => "_answer_error"
      }

      ##### START - DNS > answers > class
      if [_answer][class] == "IN"   { mutate { replace => {  "a.class" => "1"    } } }
      if [_answer][class] == "NONE" { mutate { replace => {  "a.class" => "254"  } } }
      if [_answer][class] == "ANY"  { mutate { replace => {  "a.class" => "255"  } } }

      mutate {
        convert => {
          "a.class" => "uinteger"
        }
        on_error => "conversion_error"
      }

      ##### START - DNS > answers > type
      if [_answer][type] == "A"      { mutate { replace => { "a.type" => "1"   } } }
      if [_answer][type] == "NS"     { mutate { replace => { "a.type" => "2"   } } }
      if [_answer][type] == "CNAME"  { mutate { replace => { "a.type" => "5"   } } }
      if [_answer][type] == "SOA"    { mutate { replace => { "a.type" => "6"   } } }
      if [_answer][type] == "PTR"    { mutate { replace => { "a.type" => "12"  } } }
      if [_answer][type] == "MX"     { mutate { replace => { "a.type" => "15"  } } }
      if [_answer][type] == "TXT"    { mutate { replace => { "a.type" => "16"  } } }
      if [_answer][type] == "AAAA"   { mutate { replace => { "a.type" => "28"  } } }
      if [_answer][type] == "SRV"    { mutate { replace => { "a.type" => "33"  } } }
      if [_answer][type] == "NAPTR"  { mutate { replace => { "a.type" => "35"  } } }
      if [_answer][type] == "DS"     { mutate { replace => { "a.type" => "43"  } } }
      if [_answer][type] == "DNSKEY" { mutate { replace => { "a.type" => "48"  } } }
      if [_answer][type] == "IXFR"   { mutate { replace => { "a.type" => "251" } } }
      if [_answer][type] == "AXFR"   { mutate { replace => { "a.type" => "252" } } }
      if [_answer][type] == "TYPE99" { mutate { replace => { "a.type" => "99"  } } }
      if [_answer][type] == "TKEY"   { mutate { replace => { "a.type" => "249" } } }
      if [_answer][type] == "ANY"    { mutate { replace => { "a.type" => "255" } } }
      if [_answer][type] == "ALL"    { mutate { replace => { "a.type" => "255" } } }
      if [_answer][type] == "URI"    { mutate { replace => { "a.type" => "256" } } }
      if [_answer][type] == "NULL"   { mutate { replace => { "a.type" => "0"   } } }

      mutate {
        convert => {
          "a.type" => "uinteger"
        }
      on_error => "conversion_error"
      }

      # Answer > TTL
      mutate {
        replace => {
          "a.ttl" => "%{_answer.ttl}"
        }
        on_error => "ttl_error"
      }

      mutate {
        convert => {
          "a.ttl" => "uinteger"
        }
        on_error => "conversion_error"
      }

      mutate {
        merge => {
          "event1.idm.read_only_udm.network.dns.answers" => "a"
        }
        on_error => "answer_merge_error"
      }

      mutate {
        replace => {
          "a" => ""
        }
      }

    }
    ##### END - DNS > answers

    if [dns][flags][recursion_desired] == true  {
      mutate {
        rename => {
          "dns.flags.recursion_desired" => "event1.idm.read_only_udm.network.dns.recursion_desired"
        }
        on_error => "rename_error"
      }
    }

    if [dns][flags][recursion_available] == true  {
      mutate {
        rename => {
          "dns.flags.recursion_available" => "event1.idm.read_only_udm.network.dns.recursion_available"
        }
        on_error => "rename_error"
      }
    }

    if [dns][flags][authoritative] == true  {
      mutate {
        rename => {
          "dns.flags.authoritative" => "event1.idm.read_only_udm.network.dns.authoritative"
        }
        on_error => "rename_error"
      }
    }

    if [dns][flags][truncated_response] == true  {
      mutate {
        rename => {
          "dns.flags.truncated_response" => "event1.idm.read_only_udm.network.dns.truncated"
        }
        on_error => "rename_error"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_DNS"
        "event1.idm.read_only_udm.network.application_protocol" => "DNS"
      }
    }
    if [network][protocol] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.application_protocol" => "%{network.protocol}"
        }
        on_error => "application_protocol_error"
      }
    }

    mutate {
      replace => {
        "security_result.summary" => "%{status}"
      }
      on_error => "status_error"
    }

  }
  # <<<<< END DNS


  # >>>>> START HTTP
  if [event][dataset] == "http" {

    mutate {
      convert => {
        "client.port" => "integer"
        "server.port" => "integer"
        "client.bytes" => "uinteger"
        "server.bytes" => "uinteger"
      }
      uppercase => [ "network.direction", "network.protocol", "http.request.method" ]
    }

    # records can have transposed server or client, use log source direction to adjust
    if [network][direction] == "INBOUND" {
      mutate {
        rename => {
          "server.port"  => "event1.idm.read_only_udm.principal.port"
          "client.port"  => "event1.idm.read_only_udm.target.port"
          "client.bytes" => "event1.idm.read_only_udm.network.sent_bytes"
          "server.bytes" => "event1.idm.read_only_udm.network.received_bytes"
        }
      }
      if [url][full] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.principal.url" => "%{url.full}"
          }
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "server.ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "server.ip"
        }
      }
      if[client][ip] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.ip" => "client.ip"
            "event1.idm.read_only_udm.target.asset.ip" => "client.ip"
          }
        }
      }
    } else if [network][direction] == "OUTBOUND" {
      mutate {
        rename => {
          "server.port" => "event1.idm.read_only_udm.target.port"
          "client.port" => "event1.idm.read_only_udm.principal.port"
          "client.bytes" => "event1.idm.read_only_udm.network.received_bytes"
          "server.bytes" => "event1.idm.read_only_udm.network.sent_bytes"
        }
      }
      if [url][full] != "" {
        mutate {
          replace => {
            "event1.idm.read_only_udm.target.url" => "%{url.full}"
          }
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "client.ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "client.ip"
        }
      }
      if[server][ip] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.ip" => "server.ip"
            "event1.idm.read_only_udm.target.asset.ip" => "server.ip"
          }
        }
      }
    } else if[destination][ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip"    => "destination.ip"
          "event1.idm.read_only_udm.target.asset.ip"    => "destination.ip"
        }
        on_error => "_field_not_set"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        "event1.idm.read_only_udm.network.application_protocol" => "%{network.protocol}"
      }
    }



    mutate {
      replace => {
        "event1.idm.read_only_udm.network.community_id" => "%{network.community_id}"
      }
      on_error => "_field_not_set"
    }

    if [user_agent][original] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.http.user_agent" => "%{user_agent.original}"
        }
      }
    }

    if [http][request][method] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.http.method" => "%{http.request.method}"
        }
      }
    }

    mutate {
      replace => {
        "security_result.summary" => "%{status} %{error.message}"
      }
      on_error => "_field_not_set_or_an_array_or_something_else_I_didnt_account_for"
    }

  }
  # END HTTP <<<<<



  # >>>>> START TLS
  if [event][dataset] == "tls" {

    mutate {
      convert => {
        "client.port" => "integer"
        "server.port" => "integer"
      }
      uppercase => [ "network.direction", "network.transport" ]
    }
    # records can have transposed server or client, use log source direction to adjust
    if [network][direction] == "INBOUND" {
      mutate {
        rename => {
          "server.port" => "event1.idm.read_only_udm.principal.port"
          "client.port" => "event1.idm.read_only_udm.target.port"
        }
      }
      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.hostname" => "%{server.domain}"
          "event1.idm.read_only_udm.principal.asset.hostname" => "%{server.domain}"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "server.ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "server.ip"
        }
      }
      if[client][ip] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.ip" => "client.ip"
            "event1.idm.read_only_udm.target.asset.ip" => "client.ip"
          }
        }
      }
    } else if [network][direction] == "OUTBOUND" {
      mutate {
        rename => {
          "server.port" => "event1.idm.read_only_udm.target.port"
          "client.port" => "event1.idm.read_only_udm.principal.port"
        }
      }
      mutate {
        replace => {
          "event1.idm.read_only_udm.target.hostname" => "%{server.domain}"
          "event1.idm.read_only_udm.target.asset.hostname" => "%{server.domain}"
        }
      }
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "client.ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "client.ip"
        }
      }
      if[server][ip] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.target.ip" => "server.ip"
            "event1.idm.read_only_udm.target.asset.ip" => "server.ip"
          }
        }
      }
    } else if[destination][ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip"    => "destination.ip"
          "event1.idm.read_only_udm.target.asset.ip"    => "destination.ip"
        }
        on_error => "_field_not_set"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        "event1.idm.read_only_udm.network.ip_protocol" => "%{network.transport}"
      }
    }


    mutate {
      replace => {
        "event1.idm.read_only_udm.network.community_id" => "%{network.community_id}"
      }
      on_error => "_field_not_set"
    }

    # UDM > Network > TLS
    mutate {
      rename => {
        "tls.resumed" => "event1.idm.read_only_udm.network.tls.resumed"
      }
    }

    mutate {
      rename => {
        "tls.established" => "event1.idm.read_only_udm.network.tls.established"
      }
    }

    if [tls][next_protocol] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.tls.next_protocol" => "%{tls.next_protocol}"
        }
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.network.tls.version"     => "%{tls.version}"
        "event1.idm.read_only_udm.network.tls.cipher"      => "%{tls.cipher}"
        "event1.idm.read_only_udm.network.tls.version_protocol" => "%{tls.version_protocol}"
      }
    }

    # UDM > Network > TLS > Server
    if [tls][detailed][server_certificate][not_before] != "" {
      grok {
        match => { "tls.detailed.server_certificate.not_before" => [ "(?P<ts1>.*?)T(?P<ts2>.*?)Z" ] }
        on_error => "_grok_not_before"
      }
    }

    if [tls][detailed][server_certificate][not_before] != "" {
      mutate {
        replace => {
          "ts3" => "%{ts1} %{ts2}"
        }
      }
    }

    if [tls][detailed][server_certificate][not_before] != "" {
      date {
        match => [ "ts3", "yyyy-MM-dd HH:mm:ss.SSS"]
        target => "event1.idm.read_only_udm.network.tls.server.certificate.not_before"
      }
    }



    if [tls][detailed][server_certificate][not_after] != "" {
      grok {
        match => { "tls.detailed.server_certificate.not_after" => [ "(?P<ts4>.*?)T(?P<ts5>.*?)Z" ] }
        on_error => "_grok_not_after"
      }
    }

    if [tls][detailed][server_certificate][not_after] != "" {
      mutate {
        replace => {
          "ts6" => "%{ts4} %{ts5}"
        }
      }
    }

    if [tls][detailed][server_certificate][not_after] != "" {
      date {
        match => [ "ts6", "yyyy-MM-dd HH:mm:ss.SSS"]
        target => "event1.idm.read_only_udm.network.tls.server.certificate.not_after"
      }
    }




    if [tls][detailed][server_certificate][version] != "" {
      mutate {
        convert => {
          "tls.detailed.server_certificate.version" => "string"
        }
      }
    }

    if [tls][detailed][server_certificate][version] != "" {
      mutate {
        rename => {
          "tls.detailed.server_certificate.version" => "event1.idm.read_only_udm.network.tls.server.certificate.version"
        }
      }
    }

    if [tls][detailed][server_certificate][serial_number] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.tls.server.certificate.serial" => "%{tls.detailed.server_certificate.serial_number}"
        }
      }
    }

    if [tls][server][subject] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.tls.server.certificate.subject" => "%{tls.server.subject}"
        }
      }
    }

    if [tls][server][issuer] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.tls.server.certificate.issuer" => "%{tls.server.issuer}"
        }
      }
    }

    if [tls][server][hash][sha1] != "" {
      mutate {
        lowercase => [
          "tls.server.hash.sha1"
        ]
      }
    }

    if [tls][server][hash][sha1] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.tls.server.certificate.sha1" => "%{tls.server.hash.sha1}"
        }
      }
    }

    for _cipher in tls.client.supported_ciphers {

      mutate {
        merge => {
          "event1.idm.read_only_udm.network.tls.client.supported_ciphers" => "_cipher"
        }
        on_error => "_tls_cipher_not_set"
      }

    }


    if [tls][client][server_name] != "" and [tls][client][ja3] != ""{
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.tls.client.ja3"                 =>  "%{tls.client.ja3}"
          "event1.idm.read_only_udm.network.tls.client.server_name"         =>  "%{tls.client.server_name}"
        }
      }
    }


    mutate {
      replace => {
        "security_result.summary" => "%{status}"
      }
    }

  }
  # END TLS <<<<<

  # >>>>> START DHCPv4
  # - discover, offer, request, decline, ack, nak, release, inform
  if [event][dataset] == "dhcpv4" {

    if [dhcpv4][flags] != "" {
      mutate {
        replace => {
          "flag_label.key" => "DHCP_FLAG"
          "flag_label.value" => "%{dhcpv4.flags}"
        }
        on_error => "no_dhcpv4_flags"
      }
      if ![no_dhcpv4_flags] {
        mutate {
          merge => {
            "security_result.detection_fields" => "flag_label"
          }
          on_error => "no_dhcpv4_flags_label"
        }
      }
    }

    if [dhcpv4][hardware_type] != "" {
      mutate {
        replace => {
          "hardware_type_label.key" => "DHCP_HARDWARE_TYPE"
          "hardware_type_label.value" => "%{dhcpv4.hardware_type}"
        }
        on_error => "no_dhcpv4_hardware_type"
      }
      if ![no_dhcpv4_hardware_type] {
        mutate {
          merge => {
            "security_result.detection_fields" => "hardware_type_label"
          }
          on_error => "no_dhcpv4_hardware_type_label"
        }
      }
    }

    if [dhcpv4][hops] not in ["", "0"] {
      mutate {
        convert => {
          "dhcpv4.hops" => "uinteger"
        }
        on_error => "no_hops"
      }
      mutate {
        rename => {
          "dhcpv4.hops" => "event1.idm.read_only_udm.network.dhcp.hops"
        }
      }
    }

    if [dhcpv4][relay_ip] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.giaddr" => "%{dhcpv4.relay_ip}"
        }
        on_error => "no_relay_ip"
      }
    }

    if [dhcpv4][seconds] not in ["", "0"] {
      mutate {
        convert => {
          "dhcpv4.seconds" => "uinteger"
        }
        on_error => "no_seconds"
      }
      mutate {
        rename => {
          "dhcpv4.seconds" => "event1.idm.read_only_udm.network.dhcp.seconds"
        }
      }
    }

    if [dhcpv4][transaction_id] not in ["", "0"] {
      mutate {
        convert => {
          "dhcpv4.transaction_id" => "uinteger"
        }
        on_error => "no_transaction_id"
      }
      if ![no_transaction_id] {
        mutate {
          rename => {
            "dhcpv4.transaction_id" => "event1.idm.read_only_udm.network.dhcp.transaction_id"
          }
        }
      }
      else {
        mutate {
          replace => {
            "transaction_id_label.key" => "DHCP_TRANSACTION_ID"
            "transaction_id_label.value" => "%{dhcpv4.transaction_id}"
          }
          on_error => "no_dhcpv4_transaction_id"
        }
        if ![no_dhcpv4_transaction_id] {
          mutate {
            merge => {
              "security_result.detection_fields" => "transaction_id_label"
            }
            on_error => "no_dhcpv4_transaction_id_label"
          }
        }
      }
    }

    if [dhcpv4][option][rebinding_time_sec] != "" {
      mutate {
        convert => {
          "dhcpv4.option.rebinding_time_sec" => "string"
        }
        on_error => "no_rebinding_time_sec"
      }
      mutate {
        replace => {
          "rebinding_time_sec_label.key" => "DHCP_REBINDING_TIME_SEC"
          "rebinding_time_sec_label.value" => "%{dhcpv4.option.rebinding_time_sec}"
        }
        on_error => "no_dhcpv4_rebinding_time_sec"
      }
      if ![no_dhcpv4_rebinding_time_sec] {
        mutate {
          merge => {
            "security_result.detection_fields" => "rebinding_time_sec_label"
          }
          on_error => "no_dhcpv4_rebinding_time_sec_label"
        }
      }
    }

    if [dhcpv4][option][renewal_time_sec] != "" {
      mutate {
        convert => {
          "dhcpv4.option.renewal_time_sec" => "string"
        }
        on_error => "no_renewal_time_sec"
      }
      mutate {
        replace => {
          "renewal_time_sec_label.key" => "DHCP_RENEWAL_TIME_SEC"
          "renewal_time_sec_label.value" => "%{dhcpv4.option.renewal_time_sec}"
        }
        on_error => "no_dhcpv4_renewal_time_sec"
      }
      if ![no_dhcpv4_renewal_time_sec] {
        mutate {
          merge => {
            "security_result.detection_fields" => "renewal_time_sec_label"
          }
          on_error => "no_dhcpv4_renewal_time_sec_label"
        }
      }
    }

    if [dhcpv4][option][router] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.ciaddr" =>
          "%{dhcpv4.option.router}"
        }
        on_error => "no_dhcpv4_router"
      }
    }

    if [dhcpv4][option][subnet_mask] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.yiaddr" =>
          "%{dhcpv4.option.subnet_mask}"
        }
        on_error => "subnet_mask_empty"
      }
    }

    if [dhcpv4][option][dns_servers] != "" {
      mutate {
        replace => {
          "dns_servers_list.value" => ""
        }
      }
      for serverIp in dhcpv4.option.dns_servers {
        mutate {
          replace => {
            "dns_servers_label" => ""
          }
        }
        mutate {
          replace => {
            "dns_servers_label.string_value" => "%{serverIp}"
          }
          on_error => "no_server"
        }
        mutate {
          merge => {
            "dns_servers_list.value.list_value.values" => "dns_servers_label"
          }
          on_error => "no_dns_servers_list"
        }
      }
      if [dns_servers_list][value] != "" {
        mutate {
          replace => {
            "dns_servers_list.key" => "dhcpv4_dns_servers"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "dns_servers_list"
          }
          on_error => "no_dns_servers_list_label"
        }
      }
    }

    if [dhcpv4][option][parameter_request_list] != "" {
      mutate {
        replace => {
          "param_req_list.value" => ""
        }
      }
      for paramRequest in dhcpv4.option.parameter_request_list {
        mutate {
          replace => {
            "param_req_label" => ""
          }
        }
        mutate {
          replace => {
            "param_req_label.string_value" => "%{paramRequest}"
          }
          on_error => "no_param_request"
        }
        mutate {
          merge => {
            "param_req_list.value.list_value.values" => "param_req_label"
          }
          on_error => "no_param_req_list"
        }
      }
      if [param_req_list][value] != "" {
        mutate {
          replace => {
            "param_req_list.key" => "dhcpv4_parameter_request_list"
          }
        }
        mutate {
          merge => {
            "event1.idm.read_only_udm.additional.fields" => "param_req_list"
          }
          on_error => "no_param_req_list_label"
        }
      }
    }

    if [dhcpv4][option][max_dhcp_message_size] != "" {
      mutate {
        convert => {
          "dhcpv4.option.max_dhcp_message_size" => "string"
        }
        on_error => "no_max_dhcp_message_size"
      }
      mutate {
        replace => {
          "max_dhcp_message_size_label.key" => "DHCP_MAX_DHCP_MESSAGE_SIZE"
          "max_dhcp_message_size_label.value" => "%{dhcpv4.option.max_dhcp_message_size}"
        }
        on_error => "no_dhcpv4_max_dhcp_message_size"
      }
      if ![no_dhcpv4_max_dhcp_message_size] {
        mutate {
          merge => {
            "security_result.detection_fields" => "max_dhcp_message_size_label"
          }
          on_error => "no_dhcpv4_max_dhcp_message_size_label"
        }
      }
    }

    mutate {
      convert => {
        "client.port" => "integer"
        "server.port" => "integer"
      }
      uppercase => [ "network.transport", "dhcpv4.op_code" ]
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type"          => "NETWORK_DHCP"
        "event1.idm.read_only_udm.network.ip_protocol"          => "%{network.transport}"
        "event1.idm.read_only_udm.network.application_protocol" => "DHCP"
      }
    }

    mutate {
      replace => {
        "event1.idm.read_only_udm.network.community_id" => "%{network.community_id}"
      }
      on_error => "_field_not_set"
    }



    # records can have transposed server or client, use log source direction to adjust
    mutate {
      rename => {
        "server.port" => "event1.idm.read_only_udm.principal.port"
        "client.port" => "event1.idm.read_only_udm.target.port"
      }
    }

    mutate {
      merge => {
        "event1.idm.read_only_udm.principal.ip" => "server.ip"
        "event1.idm.read_only_udm.principal.asset.ip" => "server.ip"
      }
    }

    if[client][ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.target.ip" => "client.ip"
          "event1.idm.read_only_udm.target.asset.ip" => "client.ip"
        }
      }
    }

    # >>>>> UDM > NETWORK > DHCP > OP CODE
    if [dhcpv4][op_code] == "BOOTREPLY" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.opcode" => "%{dhcpv4.op_code}"
        }
      }
    } else if [dhcpv4][op_code] == "BOOTREQUEST" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.opcode" => "%{dhcpv4.op_code}"
        }
      }
    } else {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.opcode" => "UNKNOWN_OPCODE"
        }
      }
    }

    # >>>>> UDM > Network > DHCP > Lease Time Seconds
    mutate {
        convert => {
          "dhcpv4.option.ip_address_lease_time_sec" => "uinteger"
        }
    }

    mutate {
      rename => {
        "dhcpv4.option.ip_address_lease_time_sec" => "event1.idm.read_only_udm.network.dhcp.lease_time_seconds"
      }
    }

    # >>>>> UDM > Network > DHCP > Client Identifier
    if [dhcpv4][client_mac] != "" {
      mutate {
        replace => {
          "client_mac_string" => "%{dhcpv4.client_mac}"
        }
        on_error => "no_client_mac"
      }
      mutate {
        convert => {
          "dhcpv4.client_mac" => "bytes"
        }
        on_error => "client_mac_conversion_failed"
      }
      if ![client_mac_conversion_failed] {
        mutate {
          rename => {
            "dhcpv4.client_mac" => "event1.idm.read_only_udm.network.dhcp.client_identifier"
          }
        }
        mutate {
          replace => {
            "event1.idm.read_only_udm.network.dhcp.client_identifier_string" => "%{client_mac_string}"
          }
          on_error => "client_mac_string_not_set"
        }
      }
    }

    # >>>> UDM > Network > DHCP > Requested Address
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.dhcp.requested_address" => "%{dhcpv4.assigned_ip}"
      }
      on_error => "_assigned_ip_not_set"
    }

    if [dhcpv4][option][hostname] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.client_hostname" => "%{dhcpv4.option.hostname}"
        }
        on_error => "_hostname_not_set"
      }
    }
    else if [dhcpv4][option][domain_name] != "" {
      mutate {
        replace => {
          "event1.idm.read_only_udm.network.dhcp.client_hostname" =>
          "%{dhcpv4.option.domain_name}"
        }
        on_error => "_domain_name_not_set"
      }
    }

    # >>>>> UDM > Network > DHCP > Server Name
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.dhcp.sname" => "%{dhcpv4.option.server_identifier}"
      }
      on_error => "_server_identifier_not_set"
    }

    # >>>>> UDM > Network > DHCP > Type
    if [dhcpv4][option][message_type] == "ack" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type"   => "ACK" } }
      if [dhcpv4][client_ip] == "" {
        mutate { replace => { "event1.idm.read_only_udm.metadata.event_type" => "NETWORK_UNCATEGORIZED" } }
      } else {
        mutate { replace => { "event1.idm.read_only_udm.network.dhcp.yiaddr" => "%{dhcpv4.client_ip}" } }
      }

    }
    else if [dhcpv4][option][message_type] == "nack" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "NAK" } }
    }
    else if [dhcpv4][option][message_type] == "discover" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "DISCOVER" } }
    }
    else if [dhcpv4][option][message_type] == "offer" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "OFFER" } }
    }
    else if [dhcpv4][option][message_type] == "request" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "REQUEST" } }
      if [dhcpv4][client_ip] == "" {
        mutate { replace => { "event1.idm.read_only_udm.network.dhcp.ciaddr" => "%{source.ip}" } }
      } else {
        mutate { replace => { "event1.idm.read_only_udm.network.dhcp.ciaddr" => "%{dhcpv4.client_ip}" } }
      }
    }
    else if [dhcpv4][option][message_type] == "decline" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "DECLINE" } }
    }
    else if [dhcpv4][option][message_type] == "release" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "RELEASE" } }
    }
    else if [dhcpv4][option][message_type] == "info" {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "INFORM" } }
    }
    else {
      mutate { replace => { "event1.idm.read_only_udm.network.dhcp.type" => "UNKNOWN_MESSAGE_TYPE" } }
    }

    # >>>>> UDM > Network > DHCP > Transaction ID
    #mutate {
    #  rename => {
    #    "dhcpv4.transaction_id" => "event1.idm.read_only_udm.network.dhcp.transaction_id"
    #  }
    #}



  }
  # END DHCPv4 <<<<<



  mutate {
    replace => {
      "sr_action" => "ALLOW"
    }
  }

  mutate {
    merge => { "security_result.action" => "sr_action" }
  }

  mutate {
    merge => { "event1.idm.read_only_udm.security_result" => "security_result" }
  }

  mutate {
    merge => {
      "@output" => "event1"
    }
  }
}
