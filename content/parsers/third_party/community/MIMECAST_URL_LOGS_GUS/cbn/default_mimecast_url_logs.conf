# Product: MIMECAST_URL_LOGS
# Category: Email server log types.
# Supported Format: JSON
# Reference: NA
# Last Updated: 2026-07-13
# Copyright 2026 Google Secops

filter {
  mutate {
    replace => {
      "userEmailAddress" => ""
      "fromUserEmailAddress" => ""
      "url" => ""
      "ttpDefinition" => ""
      "td" => ""
      "subject" => ""
      "actions" => ""
      "scanResult" => ""
      "category" => ""
      "date" => ""
      "result" => ""
      "sec_result_action" => ""
      "adminOverride" => ""
      "adminOverride_label" => ""
      "userOverride_label" => ""
      "userOverride" => ""
      "is_secresult" => "false"
      "sec_result_category_details" => ""
      "route" => ""
      "route_label" => ""
      "creationMethod" => ""
      "creationMethod_label" => ""
      "messageId" => ""
      "tagMap" => ""
      "tagMap.CustomerManagedUrls" => ""
      "tagMap.CustomerManagedUrls.ManagedUrlEntry" => ""
      "tagMap.CustomerManagedUrls.Allowlisted" => ""
      "principal_mid_present" => ""
      "target_ip" => ""
      "event_type" => ""
      # udm noun
      "metadata" => ""
      "target" => ""
      "principal" => ""
      "network" => ""
      "additional" => ""
      "security_result" => ""
      "intermediary" => ""
      "src" => ""
      "action" => ""
      "sendingIp" => ""
      "not_record_json_message" => "false"
      "has_email" => "false"
      "mimecastEventType" => ""
      "mimecastEventType_label" => ""
      "userAwarenessAction" => ""
      "record.userAwarenessAction" => ""
    }
  }

  mutate {
    gsub => ["message", "\\n", ""]
  }
  mutate {
    gsub => ["message", "\\r", ""]
  }
  mutate {
    gsub => ["message", '\\"event\\":', '"event_data":']
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    mutate {
      gsub => ["message", "}{", "},{"]
    }
    if [message] !~ "^[[]" {
      mutate {
        replace => {
          "record_json_message" => "{\"records\":[%{message}]}"
        }
        on_error => "record_json_message_not_present"
      }
    } else {
      mutate {
        replace => {
          "record_json_message" => "{\"records\":%{message}}"
        }
        on_error => "record_json_message_not_present_1"
      }
    }
    json {
      source => "record_json_message"
      array_function => "split_columns"
      on_error => "not_record_json_message"
    }
    if [not_record_json_message] == "true" {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
    for index,record in records {
      mutate {
        replace => {
          "adminOverride_label" => ""
          "userOverride_label" => ""
          "route_label" => ""
          "creationMethod_label" => ""
          "fromUserEmailAddress_label" => ""
          "url_label" => ""
          "record_messageId_label" => ""
          "scanResult_label" => ""
          "tagMap_label" => ""
          "emailPartsDescription_label" => ""
          "mimecastEventType_label" => ""
          "record.mimecastEventType" => ""
          "event1" => ""
          "metadata" => ""
          "target" => ""
          "principal" => ""
          "network" => ""
          "additional" => ""
          "security_result" => ""
          "target_ip" => ""
          "has_email" => ""
          "event_type" => ""
          "actions_label" => ""
          "sec_result_action" => ""
        }
      }
      mutate {
        convert => {
          "index" => "string"
        }
        on_error => "index_conversion_error"
      }
      mutate {
        replace => {
          "record.userEmailAddress" => "%{record.event_data.userEmailAddress}"
        }
        on_error => "record_userEmailAddress_not_present"
      }
      mutate {
        replace => {
          "record.fromUserEmailAddress" => "%{record.event_data.fromUserEmailAddress}"
        }
        on_error => "record_fromUserEmailAddress_not_present"
      }
      mutate {
        replace => {
          "record.url" => "%{record.event_data.url}"
        }
        on_error => "record_url_not_present"
      }
      mutate {
        replace => {
          "record.ttpDefinition" => "%{record.event_data.ttpDefinition}"
        }
        on_error => "record_ttpDefinition_not_present"
      }
      mutate {
        replace => {
          "record.subject" => "%{record.event_data.subject}"
        }
        on_error => "record_subject_err"
      }
      mutate {
        replace => {
          "record.action" => "%{record.event_data.action}"
        }
        on_error => "record_action_not_present"
      }
      mutate {
        replace => {
          "record.adminOverride" => "%{record.event_data.adminOverride}"
        }
        on_error => "record_adminOverride_not_present"
      }
      mutate {
        replace => {
          "record.userOverride" => "%{record.event_data.userOverride}"
        }
        on_error => "record_userOverride_not_present"
      }
      mutate {
        replace => {
          "record.scanResult" => "%{record.event_data.scanResult}"
        }
        on_error => "record_scanResult_not_present"
      }
      mutate {
        replace => {
          "record.category" => "%{record.event_data.category}"
        }
        on_error => "record_category_not_present"
      }
      mutate {
        replace => {
          "record.sendingIp" => "%{record.event_data.sendingIp}"
        }
        on_error => "record_sendingIp_not_present"
      }
      mutate {
        replace => {
          "record.userAwarenessAction" => "%{record.event_data.userAwarenessAction}"
        }
        on_error => "record_userAwarenessAction_not_present"
      }
      mutate {
        replace => {
          "record.date" => "%{record.event_data.date}"
        }
        on_error => "record_date_not_present"
      }
      mutate {
        replace => {
          "record.actions" => "%{record.event_data.actions}"
        }
        on_error => "record_actions_not_present"
      }
      mutate {
        replace => {
          "record.route" => "%{record.event_data.route}"
        }
        on_error => "record_route_not_present"
      }
      mutate {
        replace => {
          "record.creationMethod" => "%{record.event_data.creationMethod}"
        }
        on_error => "record_creationMethod_not_present"
      }
      mutate {
        replace => {
          "record.messageId" => "%{record.event_data.messageId}"
        }
        on_error => "record_messageId_not_present"
      }
      mutate {
        replace => {
          "record.mimecastEventType" => "%{record.event_data.mimecastEventType}"
        }
        on_error => "record_mimecastEventType_not_present"
      }
      mutate {
        replace => {
          "record.tagMap" => "%{record.event_data.tagMap}"
        }
        on_error => "record_tagMap_not_present"
      }
      if [record][action] == "warn" {
        mutate {
          replace => {
            "security_result.action_details" => "%{record.action}"
          }
          on_error => "record_action_details_not_present"
        }
      }
      if [record][action] == "block" {
        mutate {
          merge => {
            "sec_result_action" => "BLOCK"
          }
          on_error => "record_action_not_merged"
        }
      }
      else if [record][action] =~ "(?i)allow" {
        mutate {
          replace => {
            "sec_result_action" => "ALLOW"
          }
          on_error => "action_not_merge"
        }
      }
      if [sec_result_action] != "" {
        mutate {
          merge => {
            "security_result.action" => "sec_result_action"
          }
          on_error => "sec_result_action_not_present"
        }
      }
      if [record][actions] != "" {
        mutate {
          replace => {
            "actions_label.key" => "actions %{index}"
            "actions_label.value.string_value" => "%{record.actions}"
          }
          on_error => "record_actions_label_not_present"
        }
        if ![record_actions_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "actions_label"
            }
            on_error => "record_actions_merge_err"
          }
        }
      }
      if [record][fromUserEmailAddress] != "" {
        mutate {
          gsub => ["record.fromUserEmailAddress", "^<|>$", ""]
        }
        mutate {
          replace => {
            "fromUserEmailAddress_label.value" => "%{record.fromUserEmailAddress}"
            "fromUserEmailAddress_label.key" => "fromUserEmailAddress %{index}"
          }
          on_error => "fromUserEmailAddress_not_present"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "fromUserEmailAddress_label"
          }
          on_error => "fromUserEmailAddress_label_merge_error"
        }
      }
      if [record][url] != "" {
        mutate {
          replace => {
            "url_label.value" => "%{record.url}"
            "url_label.key" => "url %{index}"
          }
          on_error => "url_not_present"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "url_label"
          }
          on_error => "url_label_merge_error"
        }
      }
      if [record][userEmailAddress] != "" {
        mutate {
          gsub => ["record.userEmailAddress", "^<|>$", ""]
        }
        mutate {
          merge => {
            "network.email.to" => "record.userEmailAddress"
          }
          on_error => "userEmailAddress_not_present"
        }
      }
      if [record][ttpDefinition] != "" {
        mutate {
          replace => {
            "security_result.summary" => "%{record.ttpDefinition}"
          }
          on_error => "ttpDefinition_not_present"
        }
      }
      if [record][subject] != "" {
        mutate {
          merge => {
            "network.email.subject" => "record.subject"
          }
          on_error => "record_subject_not_present"
        }
      }
      if [record][messageId] != "" {
        mutate {
          replace => {
            "record_messageId_label.value" => "%{record.messageId}"
            "record_messageId_label.key" => "messageId %{index}"
          }
          on_error => "messageId_is_not_present"
        }
        if ![messageId_is_not_present] {
          mutate {
            merge => {
              "security_result.detection_fields" => "record_messageId_label"
            }
            on_error => "messageId_label_merge_error"
          }
        }
      }
      if [record][scanResult] != "" {
        mutate {
          replace => {
            "scanResult_label.value" => "%{record.scanResult}"
            "scanResult_label.key" => "scanResult %{index}"
          }
          on_error => "record_scanResult_not_merged"
        }
        if ![record_scanResult_not_merged] {
          mutate {
            merge => {
              "security_result.detection_fields" => "scanResult_label"
            }
            on_error => "record_scanResult_label_merge_error"
          }
        }
      }
      if  [record][category] != "" {
        mutate {
          merge => {
            "security_result.category_details" => "record.category"
          }
          on_error => "record_category_not_merged"
        }
      }
      if [record][sendingIp] != "" {
        grok {
          match => {
            "record.sendingIp" => "%{IP:target_ip}"
          }
          overwrite => ["target_ip"]
          on_error => "sendingIp_failure_grok"
        }
        if [target_ip] != "" {
          mutate {
            merge => {
              "target.ip" => "target_ip"
              "target.asset.ip" => "target_ip"
            }
            on_error => "target_ip_error"
          }
        }
      }
      if [record][date] != "" {
        mutate {
          gsub => ["record.date", "T", " "]
        }
        date {
          match => ["record.date", "yyyy-MM-dd HH:mm:ssZ", "ISO8601", "RFC3339"]
          on_error => "record_wrong_date_format"
        }
      }
      if [record][adminOverride] != "" {
        mutate {
          replace => {
            "adminOverride_label.key" => "adminOverride %{index}"
            "adminOverride_label.value.string_value" => "%{record.adminOverride}"
          }
          on_error => "record_adminOverride_invalid"
        }
        if ![record_adminOverride_invalid] {
          mutate {
            merge => {
              "additional.fields" => "adminOverride_label"
            }
            on_error => "record_adminOverride_label_merge_failed"
          }
        }
      }

      if [record][userOverride] != "" {
        mutate {
          replace => {
            "userOverride_label.key" => "userOverride %{index}"
            "userOverride_label.value.string_value" => "%{record.userOverride}"
          }
          on_error => "record_userOverride_invalid"
        }
        if ![record_userOverride_invalid] {
          mutate {
            merge => {
              "additional.fields" => "userOverride_label"
            }
            on_error => "record_userOverride_label_merge_failed"
          }
        }
      }
      if [record][route] != "" {
        mutate {
          replace => {
            "route_label.key" => "route %{index}"
            "route_label.value.string_value" => "%{record.route}"
          }
          on_error => "route_is_not_present"
        }
        if ![route_is_not_present] {
          mutate {
            merge => {
              "additional.fields" => "route_label"
            }
            on_error => "route_label_merge_error"
          }
        }
      }
      if [record][route] =~ "(?i)inbound" {
        mutate {
          replace => {
            "network.direction" => "INBOUND"
          }
        }
      }
      else if [record][route] =~ "(?i)outbound" {
        mutate {
          replace => {
            "network.direction" => "OUTBOUND"
          }
        }
      }
      if [record][creationMethod] != "" {
        mutate {
          replace => {
            "creationMethod_label.key" => "creationMethod %{index}"
            "creationMethod_label.value.string_value" => "%{record.creationMethod}"
          }
          on_error => "record_creationMethod_is_not_present"
        }
        if ![record_creationMethod_is_not_present] {
          mutate {
            merge => {
              "additional.fields" => "creationMethod_label"
            }
            on_error => "record_creationMethod_label_merge_error"
          }
        }
      }
      if [record][userAwarenessAction] != "" {
        mutate {
          replace => {
            "ua_action_label.key" => "userAwarenessAction %{index}"
            "ua_action_label.value.string_value" => "%{record.userAwarenessAction}"
          }
          on_error => "record_ua_action_err"
        }
        if ![record_ua_action_err] {
          mutate {
            merge => {
              "additional.fields" => "ua_action_label"
            }
            on_error => "record_ua_action_merge_error"
          }
        }
      }
      if [record][mimecastEventType] != "" {
        mutate {
          replace => {
            "mimecastEventType_label.key" => "mimecastEventType %{index}"
            "mimecastEventType_label.value.string_value" => "%{record.mimecastEventType}"
          }
          on_error => "record_mimecastEventType_label_not_present"
        }
        if ![record_mimecastEventType_label_not_present] {
          mutate {
            merge => {
              "additional.fields" => "mimecastEventType_label"
            }
            on_error => "record_mimecastEventType_label_merge_error"
          }
        }
      }
      for idx, emailparts in record.emailPartsDescription {
        mutate {
          convert => {
            "idx" => "string"
          }
          on_error => "record_emailParts_convert_fail"
        }
        mutate {
          replace => {
            "emailPart_label" => ""
          }
        }
        mutate {
          replace => {
            "emailPart_label.key" => "emailPartsDescription %{index} %{idx}"
            "emailPart_label.value.string_value" => "%{emailparts}"
          }
          on_error => "record_emailParts_map_err"
        }
        if ![record_emailParts_map_err] {
          mutate {
            merge => {
              "additional.fields" => "emailPart_label"
            }
            on_error => "record_emailParts_label_merge_error"
          }
        }
      }
      for idx, emailparts in record.event_data.emailPartsDescription {
        mutate {
          convert => {
            "idx" => "string"
          }
          on_error => "record_emailParts_event_data_convert_fail"
        }
        mutate {
          replace => {
            "emailPart_label" => ""
          }
        }
        mutate {
          replace => {
            "emailPart_label.key" => "emailPartsDescription %{index} %{idx}"
            "emailPart_label.value.string_value" => "%{emailparts}"
          }
          on_error => "record_emailParts_event_data_map_err"
        }
        if ![record_emailParts_event_data_map_err] {
          mutate {
            merge => {
              "additional.fields" => "emailPart_label"
            }
            on_error => "record_emailParts_event_data_label_merge_error"
          }
        }
      }
      if [record][userEmailAddress] != "" and [record][fromUserEmailAddress] != "" {
        mutate {
          replace => {
            "event_type" => "EMAIL_TRANSACTION"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event_type" => "GENERIC_EVENT"
          }
        }
      }
      if [event_type] != "" {
        mutate {
          replace => {
            "metadata.event_type" => "%{event_type}"
          }
          on_error => "record_event_type_invalid"
        }
      }
      mutate {
        replace => {
          "metadata.vendor_name" => "MIMECAST_URL_LOGS"
          "metadata.product_name" => "Mimecast_Url_Logs"
        }
      }
      if [intermediary] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.intermediary" => "intermediary"
          }
          on_error => "record_intermediary_empty"
        }
      }
      if [metadata] != "" {
        mutate {
          rename => {
            "metadata" => "event1.idm.read_only_udm.metadata"
          }
        }
      }

      if [principal] != "" {
        mutate {
          rename => {
            "principal" => "event1.idm.read_only_udm.principal"
          }
        }
      }
      if [target] != "" {
        mutate {
          rename => {
            "target" => "event1.idm.read_only_udm.target"
          }
        }
      }
      if [network] != "" {
        mutate {
          rename => {
            "network" => "event1.idm.read_only_udm.network"
          }
        }
      }

      if [additional] != "" {
        mutate {
          rename => {
            "additional" => "event1.idm.read_only_udm.additional"
          }
        }
      }

      if [security_result] != "" {
        mutate {
          merge => {
            "event1.idm.read_only_udm.security_result" => "security_result"
          }
          on_error => "record_security_result_invalid"
        }
      }
      mutate {
        merge => {
         "@output" => "event1"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "userEmailAddress" => "%{event_data.userEmailAddress}"
      }
      on_error => "userEmailAddress_error"
    }
    mutate {
      replace => {
        "fromUserEmailAddress" => "%{event_data.fromUserEmailAddress}"
      }
      on_error => "fromUserEmailAddress_error"
    }
    mutate {
      replace => {
        "url" => "%{event_data.url}"
      }
      on_error => "url_err"
    }
    mutate {
      replace => {
        "ttpDefinition" => "%{event_data.ttpDefinition}"
      }
      on_error => "ttpDefinition_err"
    }
    mutate {
      replace => {
        "subject" => "%{event_data.subject}"
      }
      on_error => "subject_err"
    }
    mutate {
      replace => {
        "action" => "%{event_data.action}"
      }
      on_error => "action_not_present"
    }
    mutate {
      replace => {
        "actions" => "%{event_data.actions}"
      }
      on_error => "actions_not_present"
    }
    mutate {
      replace => {
        "scanResult" => "%{event_data.scanResult}"
      }
      on_error => "scanResult_not_present"
    }
    mutate {
      replace => {
        "category" => "%{event_data.category}"
      }
      on_error => "category_not_present"
    }
    mutate {
      replace => {
        "sendingIp" => "%{event_data.sendingIp}"
      }
      on_error => "sendingIp_not_present"
    }
    mutate {
      replace => {
        "date" => "%{event_data.date}"
      }
      on_error => "date_not_present"
    }
    mutate {
      replace => {
        "adminOverride" => "%{event_data.adminOverride}"
      }
      on_error => "adminOverride_not_present"
    }
    mutate {
      replace => {
        "userOverride" => "%{event_data.userOverride}"
      }
      on_error => "userOverride_not_present"
    }
    mutate {
      replace => {
        "route" => "%{event_data.route}"
      }
      on_error => "route_not_present"
    }
    mutate {
      replace => {
        "creationMethod" => "%{event_data.creationMethod}"
      }
      on_error => "creationMethod_not_present"
    }
    mutate {
      replace => {
        "messageId" => "%{event_data.messageId}"
      }
      on_error => "messageId_not_present"
    }
    mutate {
      replace => {
        "userAwarenessAction" => "%{event_data.userAwarenessAction}"
      }
      on_error => "userAwarenessAction_not_present"
    }
    mutate {
      replace => {
        "mimecastEventType" => "%{event_data.mimecastEventType}"
      }
      on_error => "mimecastEventType_not_present"
    }
    mutate {
      replace => {
        "tagMap" => "%{event_data.tagMap}"
      }
      on_error => "tagmap_err"
    }
    if [userEmailAddress] != "" {
      mutate {
        gsub => ["userEmailAddress", "^<|>$", ""]
      }
      mutate {
        merge => {
          "network.email.to" => "userEmailAddress"
        }
        on_error => "userEmailAddress_err"
      }
    }
    if [fromUserEmailAddress] != "" {
      mutate {
        gsub => ["fromUserEmailAddress", "^<|>$", ""]
      }
      mutate {
        replace => {
          "network.email.from" => "%{fromUserEmailAddress}"
        }
        on_error => "fromUserEmailAddress_err"
      }
    }
    if [url] != "" {
      mutate {
        replace => {
          "target.url" => "%{url}"
        }
        on_error => "url_not_merged"
      }
    }
    if [ttpDefinition] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{ttpDefinition}"
        }
        on_error => "ttpDefinition_not_merged"
      }
    }
    if [subject] != "" {
      mutate {
        merge => {
          "network.email.subject" => "subject"
        }
        on_error => "subject_not_present"
      }
    }
    if [action] == "warn" {
      mutate {
        replace => {
          "security_result.action_details" => "%{action}"
        }
        on_error => "action_details_not_present"
      }
    }
    if [action] == "block" {
      mutate {
        replace => {
          "sec_result_action" => "BLOCK"
        }
      }
    } else if [action] =~ "(?i)allow" {
          mutate {
            replace => {
              "sec_result_action" => "ALLOW"
            }
          }
      }
    if [sec_result_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "sec_result_action"
        }
        on_error => "action_not_merged"
      }
    }
    if [actions] != "" {
      mutate {
        replace => {
          "actions_label.key" => "actions"
          "actions_label.value.string_value" => "%{actions}"
        }
        on_error => "actions_invalid"
      }
      if ![actions_invalid] {
        mutate {
          merge => {
            "additional.fields" => "actions_label"
          }
          on_error => "actions_merge_err"
        }
      }
    }
    if [adminOverride] != "" {
      mutate {
        replace => {
          "adminOverride_label.key" => "adminOverride"
          "adminOverride_label.value.string_value" => "%{adminOverride}"
        }
        on_error => "adminOverride_invalid"
      }
      if ![adminOverride_invalid] {
        mutate {
          merge => {
            "additional.fields" => "adminOverride_label"
          }
          on_error => "adminOverride_label_merge_failed"
        }
      }
    }
    if [userOverride] != "" {
      mutate {
        replace => {
          "userOverride_label.key" => "userOverride"
          "userOverride_label.value.string_value" => "%{userOverride}"
        }
        on_error => "userOverride_invalid"
      }
      if ![userOverride_invalid] {
        mutate {
          merge => {
            "additional.fields" => "userOverride_label"
          }
          on_error => "userOverride_label_merge_failed"
        }
      }
    }
    if [scanResult] != "" {
      mutate {
        replace => {
          "security_result.threat_name" => "%{scanResult}"
        }
        on_error => "scanResult_not_merged"
      }
    }
    if [category] != "" {
      mutate {
        merge => {
          "security_result.category_details" => "category"
        }
        on_error => "category_not_merged"
      }
    }
    if [sendingIp] != "" {
      grok {
        match => {
          "sendingIp" => "%{IP:target_ip}"
        }
        overwrite => ["target_ip"]
        on_error => "sendingIp_grok_error"
      }
      if [target_ip] != "" {
        mutate {
          merge => {
            "target.ip" => "target_ip"
            "target.asset.ip" => "target_ip"
          }
          on_error => "target_ip_not_merged"
        }
      }
    }
    if [date] != "" {
      mutate {
        gsub => ["date", "T", " "]
      }
      date {
        match => ["date", "yyyy-MM-dd HH:mm:ssZ", "ISO8601", "RFC3339"]
        on_error => "wrong_matching_date"
      }
    }
    if [route] != "" {
      mutate {
        replace => {
          "route_label.key" => "route"
          "route_label.value.string_value" => "%{route}"
        }
        on_error => "route_label_not_present"
      }
      if ![route_label_not_present] {
        mutate {
          merge => {
            "additional.fields" => "route_label"
          }
        on_error => "route_label_merge_failed"
        }
      }
    }
    if [route] =~ "(?i)inbound" {
      mutate {
        replace => {
          "network.direction" => "INBOUND"
        }
      }
    }
    else if [route] =~ "(?i)outbound" {
      mutate {
        replace => {
          "network.direction" => "OUTBOUND"
        }
      }
    }
    if [creationMethod] != "" {
      mutate {
        replace => {
          "creationMethod_label.key" => "creationMethod"
          "creationMethod_label.value.string_value" => "%{creationMethod}"
        }
        on_error => "creationMethod_label_not_present"
      }
      if ![creationMethod_label_not_present] {
        mutate {
          merge => {
            "additional.fields" => "creationMethod_label"
          }
          on_error => "creationMethod_label_merge_error"
        }
      }
    }
    if [messageId] != "" {
      mutate {
        replace => {
          "network.email.mail_id" => "%{messageId}"
        }
        on_error => "mesaageId_is_not_present"
      }
    }
    if [userAwarenessAction] != "" {
      mutate {
        replace => {
          "ua_action_label.key" => "userAwarenessAction"
          "ua_action_label.value.string_value" => "%{userAwarenessAction}"
        }
        on_error => "ua_action_label_not_present"
      }
      if ![ua_action_label_not_present] {
        mutate {
          merge => {
            "additional.fields" => "ua_action_label"
          }
          on_error => "ua_action_err"
        }
      }
    }
    if [mimecastEventType] != "" {
      mutate {
        replace => {
          "mimecastEventType_label.key" => "mimecastEventType"
          "mimecastEventType_label.value.string_value" => "%{mimecastEventType}"
        }
        on_error => "mimecastEventType_label_not_present"
      }
      if ![mimecastEventType_label_not_present] {
        mutate {
          merge => {
            "additional.fields" => "mimecastEventType_label"
          }
          on_error => "mimecastEventType_label_merge_error"
        }
      }
    }
    for idx,emailpart in emailPartsDescription {
      mutate {
        convert => {
          "idx" => "string"
        }
        on_error => "emailParts_convert_error"
      }
      mutate {
        replace => {
          "emailPart_label" => ""
        }
      }
      mutate {
        replace => {
          "emailPart_label.key" => "emailPartsDescription %{idx}"
          "emailPart_label.value.string_value" => "%{emailpart}"
        }
        on_error => "emailParts_map_error"
      }
      if ![emailParts_map_error] {
        mutate {
          merge => {
            "additional.fields" => "emailPart_label"
          }
          on_error => "emailParts_label_merge_failed"
        }
      }
    }
    for idx, emailpart in event_data.emailPartsDescription {
      mutate {
        convert => {
          "idx" => "string"
        }
        on_error => "emailParts_event_data_convert_error"
      }
      mutate {
        replace => {
          "emailPart_label" => ""
        }
      }
      mutate {
        replace => {
          "emailPart_label.key" => "emailPartsDescription %{idx}"
          "emailPart_label.value.string_value" => "%{emailpart}"
        }
        on_error => "emailParts_event_data_map_error"
      }
      if ![emailParts_event_data_map_error] {
        mutate {
          merge => {
            "additional.fields" => "emailPart_label"
          }
          on_error => "emailParts_event_data_label_merge_failed"
        }
      }
    }
    for entryurl in tagMap.CustomerManagedUrls.ManagedUrlEntry {
      mutate {
        replace => {
          "EntryUrl" => ""
          "EntryUrl_label" => ""
        }
      }
      mutate {
        replace => {
          "EntryUrl" => "%{entryurl}"
        }
        on_error => "no_EntryUrl_val"
      }
      mutate {
        replace => {
          "EntryUrl_label.key" => "EntryUrl"
          "EntryUrl_label.value" => "%{EntryUrl}"
        }
        on_error => "no_EntryUrl_label_key"
      }
      if ![no_EntryUrl_label_key] {
        mutate {
          merge => {
            "security_result.detection_fields" => "EntryUrl_label"
          }
          on_error => "no_EntryUrl_label"
        }
      }
    }
    for allowurl in tagMap.CustomerManagedUrls.Allowlisted {
      mutate {
        replace => {
          "AllowUrl" => ""
          "AllowUrl_label" => ""
        }
      }
      mutate {
        replace => {
          "AllowUrl" => "%{allowurl}"
        }
        on_error => "no_AllowUrl"
      }
      mutate {
        replace => {
          "AllowUrl_label.key" => "AllowUrl"
          "AllowUrl_label.value" => "%{AllowUrl}"
        }
        on_error => "no_AllowUrl_label_key"
      }
      if ![no_AllowUrl_label_key] {
        mutate {
          merge => {
            "security_result.detection_fields" => "AllowUrl_label"
          }
          on_error => "no_AllowUrl_label"
        }
      }
    }
    mutate {
      replace => {
        "metadata.vendor_name" => "MIMECAST_URL_LOGS"
        "metadata.product_name" => "Mimecast_Url_Logs"
      }
    }
    if [userEmailAddress] != "" and [fromUserEmailAddress] != "" {
      mutate{
        replace => {
          "event_type" => "EMAIL_TRANSACTION"
        }
      }
    }
    else if [has_email] == "true" {
      mutate {
        replace => {
          "event_type" => "EMAIL_TRANSACTION"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
    if [event_type] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "%{event_type}"
        }
        on_error => "event_type_invalid"
      }
    }
    if [intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
        on_error => "intermediary_empty"
      }
    }
    if [metadata] != "" {
      mutate {
        rename => {
          "metadata" => "event.idm.read_only_udm.metadata"
        }
      }
    }
    if [principal] != "" {
      mutate {
        rename => {
          "principal" => "event.idm.read_only_udm.principal"
        }
      }
    }
    if [target] != "" {
      mutate {
        rename => {
          "target" => "event.idm.read_only_udm.target"
        }
      }
    }
    if [network] != "" {
      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
      }
    }
    if [additional] != "" {
      mutate {
        rename => {
          "additional" => "event.idm.read_only_udm.additional"
        }
      }
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
        on_error => "security_result_invalid"
      }
    }
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
