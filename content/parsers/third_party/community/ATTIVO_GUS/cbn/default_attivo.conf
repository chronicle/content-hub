        on_error => "hostname_error"
      }
      if ![hostname_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    grok {
      match => {
        "dvc" => "%{IP:dv}"
      }
      overwrite => ["dv"]
      on_error => "not_valid_dvc"
    }
    if [dv] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dv"
        }
        on_error => "dv_error"
      }
      if ![dv_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  else if [dvc] != "" {
    grok {
      match => {
        "dvc" => "%{IP:ips}"
      }
      overwrite => ["ips"]
      on_error => "not_valid_ip"
    }
    if [ips] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ips"
        }
        on_error => "ips_error"
      }
      if ![ips_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [not_valid_ip] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{dvc}"
        }
        on_error => "dvc_error"
      }
      if ![dvc_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [dst] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dst"
      }
      on_error => "dst_error"
    }
    if ![dst_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [smac] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "smac"
      }
    }
  }
  if [shost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{shost}"
      }
      on_error => "shost_error"
    }
    if ![shost_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [descrip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{descrip}"
      }
    }
  }
  if [msg] != "" {
    grok {
      match => {
        "msg" => ".*Protocol\\\\=(?P<protocol>UDP|TCP).*"
      }
      overwrite => ["protocol"]
      on_error => "protocol_grok_failure"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{msg}"
      }
    }
  }
  if [protocol] in ['TCP', 'UDP'] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{protocol}"
      }
    }
  }
  if [src_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
    }
  }
  if [dpt] != "" {
    mutate {
      convert => {
        "dpt" => "string"
      }
      on_error => "dpt_already_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dpt}"
      }
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
    }
  }
  if [service] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{service}"
      }
    }
  }
  if [suser] != "" {
    mutate {
      replace => {
        "suser_label.key" => "suser"
        "suser_label.value.string_value" => "%{suser}"
      }
      on_error => "suser_error"
    }
    if ![suser_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "suser_label"
        }
        on_error => "suser_label_error"
      }
    }
    grok {
      match => {
        "suser" => [
          "%{DATA:domain_name}\\\\%{USERNAME:suser}"
        ]
      }
      overwrite => [ "suser" ,"domain_name"]
      on_error => "suser_failure"
    }
    if [suser] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.user_display_name"
          => "%{suser}"
          "event.idm.read_only_udm.principal.user.userid" => "%{suser}"
        }
      }
    }
    if [domain_name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain"
          => "%{domain_name}"
        }
        on_error => "domain_name_error"
      }
    }
  }
  if [usrname] =~ "^.+@.+$" and [usrname] =~ "^(.){1,256}$" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "usrname"
      }
    }
  }
  #vlan
  if [vlan] != "" {
      mutate {
        replace => {
          "labels.key" => "vlan"
          "labels.value" => "%{vlan}"
        }
        on_error => "vlan_error"
      }
  }
  #threshold
  if [threshold] != "" {
    mutate {
      replace => {
        "arp_threshold_label.key" => "arp-scan-threshold"
        "arp_threshold_label.value.string_value" => "%{threshold}"
      }
      on_error => "threshold_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "arp_threshold_label"
      }
    }
  }
  #cef_version
  if [cef_version] != "" {
    mutate {
      convert => {
        "cef_version" => "string"
      }
      on_error => "string_error"
    }
    mutate {
      replace => {
        "cef_version_label.key" => "CEFVersion"
        "cef_version_label.value.string_value" => "%{cef_version}"
      }
      on_error => "cef_version_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "cef_version_label"
      }
    }
  }

  if [CEFSignatureID] != "" {
    mutate {
      replace => {
        "security_result.rule_id" => "%{CEFSignatureID}"
      }
    }
  }
  if [CEFDeviceVersion] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version"
        => "%{CEFDeviceVersion}"
      }
    }
  }
  if [CEFDeviceVendor] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{CEFDeviceVendor}"
      }
    }
  }
  if [CEFDeviceProduct] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{CEFDeviceProduct}"
      }
    }
  }
  if [module] != "" {
    mutate {
      replace => {
        "module_label.key" => "module"
        "module_label.value.string_value" => "%{module}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "module_label"
      }
    }
  }
  #subscriberName
  if [subscriberName] != "" {
    mutate {
      replace => {
        "subscriber_name.key" => "Subscriber Name"
        "subscriber_name.value.string_value" => "%{subscriberName}"
      }
      on_error => "subscriber_name_error"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "subscriber_name"
      }
    }
  }
  if [operation] != "" {
    mutate {
      replace => {
        "operation_label.key" => "operation"
        "operation_label.value.string_value" => "%{operation}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "operation_label"
      }
    }
  }

  if [mitreTacticName] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{mitreTacticName}"
      }
    }
  }
  if [CEFSeverity] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{CEFSeverity}"
      }
      on_error => "CEFSeverity_error"
    }
  }
  if [CEFSeverity] in [ "error", "warning" , "Very-High", "High" ] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [CEFSeverity] =~ "(?i)critical" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }
  else if [CEFSeverity] =~ "(?i)notice" or [CEFSeverity]  =~ "(?i)MEDIUM" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [CEFSeverity] in [ "information", "info", "Very-Low", "Low" ] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  if [result] =~ "(?i)SUCCESS" or [result] =~ "(?i)ALLOW" {
    mutate {
      replace => {
        "act_result" => "ALLOW"
      }
    }
  }
  else if [result] == "CHALLENGE" {
    mutate {
      replace => {
        "act_result" => "CHALLENGE"
      }
    }
  }
  else if [result] in ["FAILURE", "DENY", "SKIPPED", "RATE_LIMIT"] {
    mutate {
      replace => {
        "act_result" => "BLOCK"
      }
    }
  }

  if [act_result] != "" {
    mutate {
      merge => {
        "security_result.action" => "act_result"
      }
    }
  }
  if [mitreTechniqueName] != "" {
    mutate {
      replace => {
        "mitreTechniqueName_field.key" => "Technique name"
        "mitreTechniqueName_field.value" => "%{mitreTechniqueName}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "mitreTechniqueName_field"
      }
    }
  }

  #dhost
  if [dhost] != "" {
    grok {
      match => {
        "dhost" => [
          "%{IP:dhost_ip}"
        ]
      }
      overwrite => [ "dhost_ip" ]
      on_error => "dhost_error_grok"
    }
    if ![dhost_error_grok] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "dhost_ip"
          "event.idm.read_only_udm.target.asset.ip" => "dhost_ip"
        }
        on_error => "dhost_ip_error"
      }
      if ![dhost_ip_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{dhost}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{dhost}"
        }
        on_error => "dhost_error"
      }
      if ![dhost_error] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
  }
  #action_details
  if [cat] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{cat}"
      }
      on_error => "action_details_error"
    }
  }
  if [mitreTechniqueId] != "" {
    mutate {
      replace => {
        "mitreTechniqueId_field.key" => "Technique name"
        "mitreTechniqueId_field.value" => "%{mitreTechniqueId}"
      }
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "mitreTechniqueId_field"
      }
    }
  }
  if [timezone] != "" {
    mutate {
      replace => {
        "timezone_label.key" => "Timezone"
        "timezone_label.value.string_value" => "%{timezone}"
      }
      on_error => "timezone_error"
    }
    if ![timezone_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "timezone_label"
        }
        on_error => "timezone_label_error"
      }
    }
  }
  if [subscriberId] != "" {
    mutate {
      convert => {
        "subscriberId" => "string"
      }
      on_error => "subscriberId_already_string"
    }
    mutate {
      replace => {
        "subscriberId_label.key" => "Subscriber ID"
        "subscriberId_label.value.string_value" => "%{subscriberId}"
      }
      on_error => "subscriberId_error"
    }
    if ![subscriberId_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "subscriberId_label"
        }
        on_error => "subscriberId_label_error"
      }
    }
  }
  if [referenceId] != "" {
    mutate {
      replace => {
        "referenceId_label.key" => "Reference ID"
        "referenceId_label.value.string_value" => "%{referenceId}"
      }
      on_error => "referenceId_error"
    }
    if ![referenceId_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "referenceId_label"
        }
        on_error => "referenceId_label_error"
      }
    }
  }
  if [adEventIds] != "" {
    mutate {
      replace => {
        "adEventIds_label.key" => "AdEventIds"
        "adEventIds_label.value.string_value" => "%{adEventIds}"
      }
      on_error => "adEventIds_error"
    }
    if ![adEventIds_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "adEventIds_label"
        }
        on_error => "adEventIds_label_error"
      }
    }
  }
  if [shostname] != "" {
    mutate {
      replace => {
        "shostname_label.key" => "shostname"
        "shostname_label.value.string_value" => "%{shostname}"
      }
      on_error => "shostname_error"
    }
    if ![shostname_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "shostname_label"
        }
        on_error => "shostname_label_error"
      }
    }
  }
  if [source_device_name] != "" {
    mutate {
      replace => {
        "source_device_name_label.key" => "source_device_name"
        "source_device_name_label.value.string_value" => "%{source_device_name}"
      }
      on_error => "source_device_name_error"
    }
    if ![source_device_name_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "source_device_name_label"
        }
        on_error => "source_device_name_label_error"
      }
    }
  }
  if [forwarder_ip] != "" {
    mutate {
      replace => {
        "ip_forwarder_ip_label.key" => "forwarder_ip"
        "ip_forwarder_ip_label.value.string_value" => "%{forwarder_ip}"
      }
      on_error => "forwarder_ip_error"
    }
    if ![forwarder_ip_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "ip_forwarder_ip_label"
        }
        on_error => "ip_forwarder_ip_label_error"
      }
    }
  }
  if [spt] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{spt}"
      }
      on_error => "spt_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "spt_int_error"
    }
  }
  if [process] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{process}"
      }
      on_error => "process_error"
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{pid}"
      }
      on_error => "pid_error"
    }
  }
  if ([src]!="" or [smac] != "" or [shost]!="")
  and [service] in ["ARP", "NETBIOS"] {
     mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_NETWORK"
      }
    }
  }
  else if (([smac] != "" or [src] != "") and [dst] != "" and [protocol] != "") or ([has_principal] == "true" and [has_target] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  } else if ([smac] != "" or [sip] != "") and ([dvc] != "" and [service]=="NETWORK") and [has_target] == "true" {
    #Network uncategorized
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_UNCATEGORIZED"
      }
    }
  } else if [smac] != "" or [dvc] != "" or [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  #labels
  if [labels] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.labels" => "labels"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
