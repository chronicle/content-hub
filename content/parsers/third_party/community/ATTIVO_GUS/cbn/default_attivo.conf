filter {
  mutate {
    replace => {
      "ips" => ""
      "descrip" => ""
      "service" => ""
      "msg" => ""
      "alertID" => ""
      "operation" => ""
      "module" => ""
      "dIPDomain" => ""
      "result" => ""
      "act_result" => ""
      "suser" => ""
      "shost" => ""
      "smac" => ""
      "vlan" => ""
      "dst_os" => ""
      "intf" => ""
      "dhost" => ""
      "security_result" => ""
      "CEFName" => ""
      "cef_version" => ""
      "rt" => ""
      "src" => ""
      "source" => ""
      "labels" => ""
      "sip" => ""
      "cat" => ""
      "CEFDeviceVersion" => ""
      "CEFDeviceVendor" => ""
      "CEFDeviceProduct" => ""
      "CEFSignatureID" => ""
      "mitreTacticName" => ""
      "mitreTechniqueName" => ""
      "mitreTechniqueId" => ""
      "usrname" => ""
      "threshold" => ""
      "source_domain" => ""
      "dest_domain" => ""
      "dvc" => ""
      "subscriberName" => ""
      "CEFSeverity" => ""
      "kv_data" => ""
      "protocol" => ""
      "src_port" => ""
      "dst" => ""
      "dpt" => ""
      "intermediary" => ""
      "Alert.app" => ""
      "Alert.severity" => ""
      "Alert.dest_host" => ""
      "Alert.dest_ip" => ""
      "Alert.dest_os" => ""
      "Alert.subject" => ""
      "Alert.body" => ""
      "Alert.src_ip" => ""
      "Alert.src_category" => ""
      "Alert.service" => ""
      "Alert.VLANID" => ""
      "Alert.forwarder" => ""
      "Alert.src_ip_domain" => ""
      "Alert.dest_ip_domain" => ""
      "Alert.type" => ""
      "Alert.dest_ip_list" => ""
      "Alert.dest_port" => ""
      "Alert.dest_ip_port" => ""
      "Alert.botsink_ip" => ""
      "Alert.src_hostname" => ""
      "Alert.src_mac" => ""
      "Alert.dest_username" => ""
      "Alert.id" => ""
      "Alert.source_device_name" => ""
      "Alert.usrname" => ""
      "Alert.subscriberName" => ""
      "Alert.VTSummaryResult" => ""
      "Alert.WEBROOTReputation" => ""
      "Alert.adusers" => ""
      "Alert.timestamp" => ""
      "Alert.mitre technique id" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "username" => ""
      "src_ip" => ""
      "src_hostname" => ""
      "src_mac" => ""
      "source_device_name" => ""
      "forwarder_ip" => ""
      "Alert_src_ip" => ""
      "Alert_dest_ip" => ""
      "timezone" => ""
      "spt" => ""
      "process" => ""
      "pid" => ""
      "valid_log" => "false"
      "forwarder" => ""
      "VLANID" => ""
      "attacker_ip" => ""
      "target_host" => ""
      "target_ip" => ""
      "target_os" => ""
      "description" => ""
      "detail_source_ip" => ""
      "phase" => ""
      "Service" => ""
      "Attacker_HostName" => ""
      "Attacker_MAC" => ""
      "Attacker_UserNames" => ""
      "Source_Device_Name" => ""
      "Attivo_AlertID" => ""
      "MITRE_Technique_ID" => ""
      "MITRE_Technique_Name" => ""
      "MITRE_Tactic_Name" => ""
      "severity" => ""
      "detail_target_ip" => ""
      "Target_IP_Domain" => ""
      "Target_Ports" => ""
      "Target_IP_Ports" => ""
      "TargetIP_List" => ""
      "Forwarder_IP" => ""
      "Dest_UserName" => ""
      "VTSummaryResult" => ""
      "WebRootReputation" => ""
      "Attacker_IP_Domain" => ""
      "Forwarder" => ""
      "subscriberId" => ""
      "referenceId" => ""
      "adEventIds" => ""
      "domain_name" => ""
      "shostname" => ""
      "dhost_ip" => ""
    }
  }
  mutate {
    gsub => ["message", "\\r\\n(\\s+)", "$1"]
  }
  mutate {
    gsub => ["message", "\\r\\n", " "]
  }
  mutate {
    gsub => ["message","\\n", " "]
  }

  grok {
    match => {
      "message" => [
        "<%{INT:code}>%{GREEDYDATA:json_data}"
      ]
    }
    overwrite => ["code", "json_data" ]
    on_error => "failure_grok"
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_valid_json"
  }
  json {
    source => "json_data"
    array_function => "split_columns"
    on_error => "json_parse_failure"
  }

  if [not_valid_json] and [message] =~ "CEF" {
    grok {
      match => {
        "message" => [
          "<%{INT}> CEF:%{INT:cef_version}\\|%{DATA:CEFDeviceVendor}\\|%{DATA:CEFDeviceProduct}\\|%{DATA:CEFDeviceVersion}\\|%{DATA:CEFSignatureID}\\|%{DATA:CEFName}\\|%{DATA:CEFSeverity}\\|%{GREEDYDATA:kv_data}",
          "<%{INT}> %{SYSLOGTIMESTAMP:date_time} UTC %{IP} CEF:%{INT:cef_version}\\|%{DATA:CEFDeviceVendor}\\|%{DATA:CEFDeviceProduct}\\|%{DATA:CEFDeviceVersion}\\|%{DATA:CEFSignatureID}\\|%{DATA:CEFName}\\|%{DATA:CEFSeverity}\\|%{GREEDYDATA:kv_data}",
          "<%{INT}> %{SYSLOGTIMESTAMP:date_time} %{DATA:timezone} %{IP} CEF:%{INT:cef_version}\\|%{DATA:CEFDeviceVendor}\\|%{DATA:CEFDeviceProduct}\\|%{DATA:CEFDeviceVersion}\\|%{DATA:CEFSignatureID}\\|%{DATA:CEFName}\\|%{DATA:CEFSeverity}\\|%{GREEDYDATA:kv_data}",
          "<%{INT}>%{SYSLOGTIMESTAMP:date_time} %{IP} CEF:%{INT:cef_version}\\|%{DATA:CEFDeviceVendor}\\|%{DATA:CEFDeviceProduct}\\|%{DATA:CEFDeviceVersion}\\|%{DATA:CEFSignatureID}\\|%{DATA:CEFName}\\|%{DATA:CEFSeverity}\\|%{GREEDYDATA:kv_data}",
        ]
      }
      overwrite => ["cef_version","CEFDeviceVendor","CEFDeviceProduct", "timezone",
      "CEFDeviceVersion","CEFSignatureID","CEFName","CEFSeverity","kv_data"]
      on_error => "grok_failure"
    }
    if ![grok_failure] {
      mutate {
        replace => {
          "valid_log" => "true"
        }
      }
    }
  }
  if [valid_log] == "false" {
    grok{
      match => {
        message => [
          "<%{INT}>%{SYSLOGTIMESTAMP:date_time} %{IP} %{GREEDYDATA:no_raw_event}",
          "<%{POSINT:syslog_pri}>%{YEAR:year} %{MONTH:month} %{MONTHDAY:day} %{TIME:time} %{WORD:tz} %{IP:botsink_ip} %{WORD:application}: Severity:\\[(?<severity>[^\\]]+)\\] Attacker IP:\\[%{IP:attacker_ip}\\] Target Host:\\[(?<target_host>[^\\]]+)\\] Target IP:\\[%{IP:target_ip}\\] Target OS:\\[(?<target_os>[^\\]]+)\\] Description:\\[(?<description>[^\\]]+)\\] Details:\\[Source-IP:\\[%{IP:details_source_ip}\\] Target-IP:\\[%{IP:details_target_ip}\\] intf:\\[%{NONNEGINT:detail_intf}\\] vlan:\\[%{NONNEGINT:detail_vlan}\\] (?<details_description>[^\\]]+)\\] Phase:\\[(?<phase>[^\\]]+)\\]%{GREEDYDATA:kv_data}",
          "<%{POSINT:syslog_pri}>%{YEAR:year} %{MONTH:month} %{MONTHDAY:day} %{TIME:time} %{WORD:tz} %{IP:botsink_ip} %{WORD:application}: Severity:\\[(?<severity>[^\\]]+)\\] Attacker IP:\\[%{IP:attacker_ip}\\] Target Host:\\[(?<target_host>[^\\]]+)\\] Target IP:\\[%{IP:target_ip}\\] Target OS:\\[(?<target_os>[^\\]]+)\\] Description:\\[(?<description>[^\\]]+)\\] Details:\\[Attivo rule %{WORD:rule_type} \\{%{WORD:protocol}\\} %{IP:src_ip} -> %{IP:dst_ip}\\] Phase:\\[(?<phase>[^\\]]+)\\] %{GREEDYDATA:kv_data}"
        ]
      }
      overwrite => ["syslog_pri", "year", "month", "day", "time", "tz", "botsink_ip", "application", "severity", "attacker_ip", "target_host", "target_ip", "target_os", "description", "details", "phase", "kv_data", "details_source_ip", "rule_type", "protocol", "src_ip", "dst_ip"]
      on_error => "not_supported_event"
    }
    if ![not_supported_event]{
      if [kv_data] != "" {
        mutate {
          gsub => ["kv_data", ":\\[", ":"]
        }
        mutate {
          gsub => ["kv_data", "\\]", "#"]
        }
        mutate {
          gsub => ["kv_data", "Attacker HostName", "Attacker_HostName"]
        }
        mutate {
          gsub => ["kv_data", "Attacker MAC", "Attacker_MAC"]
        }
        mutate {
          gsub => ["kv_data", "Attacker UserNames", "Attacker_UserNames"]
        }
        mutate {
          gsub => ["kv_data", "Source Device Name", "Source_Device_Name"]
        }
        mutate {
          gsub => ["kv_data", "Attivo AlertID", "Attivo_AlertID"]
        }
        mutate {
          gsub => ["kv_data", "MITRE Technique ID", "MITRE_Technique_ID"]
        }
        mutate {
          gsub => ["kv_data", "MITRE Technique Name", "MITRE_Technique_Name"]
        }
        mutate {
          gsub => ["kv_data", "MITRE Tactic Name", "MITRE_Tactic_Name"]
        }
        mutate {
          gsub => ["kv_data", "Target IP Domain", "Target_IP_Domain"]
        }
        mutate {
          gsub => ["kv_data", "Target Ports", "Target_Ports"]
        }
        mutate {
          gsub => ["kv_data", "Target IP Ports", "Target_IP_Ports"]
        }
        mutate {
          gsub => ["kv_data", "TargetIP List", "TargetIP_List"]
        }
        mutate {
          gsub => ["kv_data", "Forwarder IP", "Forwarder_IP"]
        }
        mutate {
          gsub => ["kv_data", "Dest UserName", "Dest_UserName"]
        }
        mutate {
          gsub => ["kv_data", "Attacker IP Domain", "Attacker_IP_Domain"]
        }
        kv {
          source => "kv_data"
          field_split => "#"
          value_split => ":"
          trim_key => " "
          on_error => "not_kv"
        }
        mutate {
          replace => {
            "valid_log" => "true"
          }
        }
      } else {
        drop {
          tag => "TAG_MALFORMED_MESSAGE"
        }
      }
    }
  }
  if [not_valid_json] and [valid_log] == "false" and [json_parse_failure] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [kv_data] != "" {
    mutate {
        gsub => ["kv_data", "(\\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
    }
    kv {
      source => "kv_data"
      field_split => "^"
      value_split => "="
      on_error => "not_kv"
    }
  }
  if [CEFName] != "" {
    grok {
      match => {
        "CEFName" => [
          "Operation:%{DATA:operation}, Result:%{WORD:result}, Module:%{DATA:module}, Description:%{GREEDYDATA:descrip}",
          "Username:%{DATA}, IP:%{IP:src_ip}, Operation:%{DATA:operation}, Result:%{DATA:result}, Module:%{DATA:module}, Description:%{GREEDYDATA:descrip} Enabled : %{DATA:enabled} Name : %{GREEDYDATA:name} IPAddress : %{IP:src_ip} Port : %{INT:src_port} Protocol : (?P<protocol>TCP|UDP)",
          "Username:%{DATA}, IP:%{IP:src_ip}, Operation:%{DATA:operation}, Result:%{DATA:result}, Module:%{DATA:module}, Description:%{GREEDYDATA:descrip}"
        ]
      }
      overwrite => ["result","operation","module","descrip","protocol",
      "src_port"]
      on_error => "CEFName_grok_failure"
    }
    if [CEFName_grok_failure] {
      grok {
        match => {
          "CEFName" =>
          "%{GREEDYDATA:descrip}"
        }
        overwrite => ["descrip"]
      on_error => "descrip_grok_failure"
      }
    }
  }
  if [Alert][subject] != "" {
    grok {
      match => {
        "Alert.subject" => [
          "Username:%{DATA}, IP:%{IP:src_ip}, Operation:%{DATA:operation}, Result:%{DATA:result}, Module:%{DATA:module}, Description:%{GREEDYDATA:descrip} Enabled : %{DATA:enabled} Name : %{GREEDYDATA:name} IPAddress : %{IP:src_ip} Port : %{INT:src_port} Protocol : (?P<protocol>TCP|UDP)",
          "Username:%{DATA}, IP:%{IP:src_ip}, Operation:%{DATA:operation}, Result:%{DATA:result}, Module:%{DATA:module}, Description:%{GREEDYDATA:descrip}"
          "Operation:%{DATA:operation}, Result:%{WORD:result}, Module:%{DATA:module}, Description:%{GREEDYDATA:descrip}"
        ]
      }
      overwrite => ["result","operation","module","descrip","protocol","src_port","src_ip"]
      on_error => "subject_grok_failure"
    }
    if [subject_grok_failure] {
      grok {
        match => {
          "Alert.subject" => "%{GREEDYDATA:descrip}"
        }
        overwrite => ["descrip"]
        on_error => "descrip_grok_failure"
      }
    }
  }
  if [Alert][body] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{Alert.body}"
      }
      on_error => "body_error"
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{descrip}"
      }
      on_error => "body_error1"
    }
  }
  if [Alert][app] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{Alert.app}"
      }
      on_error => "app_error"
    }
  }
  grok {
    match => {
      "Alert.dest_ip" => "%{IP:Alert_dest_ip}"
    }
    overwrite => ["Alert_dest_ip"]
    on_error => dest_failure
  }

  if ![dest_failure] and [Alert_dest_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "Alert_dest_ip"
        "event.idm.read_only_udm.target.asset.ip" => "Alert_dest_ip"
      }
      on_error => "target_ip_error"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }
  else if [Alert][dest_ip] =~ "XX" {
    mutate {
      replace => {
          "Alert.dest_ip" => "1.1.1.2"
      }
      on_error => "dest_ip_error"
    }
    mutate {
      merge => {
          "event.idm.read_only_udm.target.ip" => "Alert.dest_ip"
          "event.idm.read_only_udm.target.asset.ip" => "Alert.dest_ip"
      }
      on_error => "target_ip_error"
    }
    mutate {
      replace => {
        "has_target" => "true"
      }
    }
  }
  if [Alert][dest_host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{Alert.dest_host}"
        "has_target" => "true"
      }
      on_error => "dest_host_error"
    }
  }
  if [Alert][src_hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{Alert.src_hostname}"
        "has_principal" => "true"
      }
      on_error => "src_host_error"
    }
  }
  if [Alert][src_ip_domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.domain.name" => "%{Alert.src_ip_domain}"
      }
      on_error => "src_ip_domain_error"
    }
  }
  if [Alert][dest_ip_domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.domain.name" => "%{Alert.dest_ip_domain}"
      }
      on_error => "dest_ip_domain_error"
    }
  }
  if [Alert][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{Alert.id}"
      }
    }
  }
  if [Alert][dest_os] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.platform_software.platform_version" => "%{Alert.dest_os}"
      }
      on_error => "dest_os_error"
    }
  }
  grok {
    match => {
      "Alert.src_ip" => "%{IP:Alert_src_ip}"
    }
    overwrite => ["Alert_src_ip"]
    on_error => src_failure
  }

  if ![src_failure] and [Alert_src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "Alert_src_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "Alert_src_ip"
      }
      on_error => "principal_ip_error"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  else if [Alert][src_ip] =~ "XX" {
    mutate {
      replace => { 
          "Alert.src_ip" => "1.1.1.1"
      }
    }
    mutate {
      merge => {
          "event.idm.read_only_udm.principal.ip" => "Alert.src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "Alert.src_ip"
      }
      on_error => "principal_ip_error"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [Alert][src_mac] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.mac" => "Alert.src_mac"
        }
        on_error => "principal_mac_not_present"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }

  if [Alert][VLANID] != "" {
    mutate {
      replace => {
        "labels.key" => "vlan"
        "labels.value" => "%{Alert.VLANID}"
      }
      on_error => "vlan_error"
    }
  }
  if [Alert][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{Alert.id}"
      }
      on_error => "alert_id_error"
    }
  }
  if [Alert][botsink_ip] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "Alert.botsink_ip"
      }
      on_error => "botsink_ip_error"
    }
  }
  if [Alert][forwarder] == "" {
    mutate {
      replace => {
        "Alert.forwarder" => "%{forwarder}"
      }
      on_error => "forwarder_error"
    }
  }
  if [Alert][forwarder] != "" {
    mutate {
      replace => {
        "alert_forwarder_field.value.string_value" => "%{Alert.forwarder}"
      }
      on_error => "invalid_alert_forwarder"
    }
    if ![invalid_alert_forwarder] {
      mutate {
        replace => {
          "alert_forwarder_field.key" => "forwarder"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "alert_forwarder_field"
        }
        on_error => "Alert_forwarder_label_merge_failure"
      }
    }
  }
  if [Alert][service] != "" {
    mutate {
      replace => {
        "alert_service_field.value.string_value" => "%{Alert.service}"
      }
      on_error => "invalid_alert_service"
    }
    if ![invalid_alert_service] {
      mutate {
        replace => {
          "alert_service_field.key" => "service"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "alert_service_field"
        }
        on_error => "Alert_service_label_merge_failure"
      }
    }
  }
  mutate {
    rename => {
      "Alert.mitre\ technique\ id" => "Alert.mitretechniqueid"
    }
    on_error => "mitre_technique_id_error"
  }
    # MITRE Technique
  for key, mitre_id in Alert.mitretechniqueid {
    mutate {
      replace => {
      "technique_id" => ""
      "subtechnique_id" => ""
      "technique_name" => ""
      "tactic_id" => ""
      "tactic_name" => ""
      }
    }
    mutate {
      replace => {
      "technique_id" => "%{mitre_id}"
      }
    }
    mutate {
      replace => {
          "technique_data" => ""
          "tactics_data" => ""
      }
    }

    if [technique_id] == "T1548" or [subtechnique_id] =~ "T1548" or [technique_name] == "Abuse Elevation Control Mechanism" {
      mutate {
        replace => {
          "technique_data.id" => "T1548"
          "technique_data.name" => "Abuse Elevation Control Mechanism"
        }
        on_error => "abuse_elevation_control_mechanism_error"
      }
    }
    else if [technique_id] == "T1134" or [subtechnique_id] =~ "T1134" or [technique_name] == "Access Token Manipulation" {
      mutate {
        replace => {
          "technique_data.id" => "T1134"
          "technique_data.name" => "Access Token Manipulation"
        }
        on_error => "access_token_manipulation_error"
      }
    }
    else if [technique_id] == "T1531" or [subtechnique_id] =~ "T1531" or [technique_name] == "Account Access Removal" {
      mutate {
        replace => {
          "technique_data.id" => "T1531"
          "technique_data.name" => "Account Access Removal"
        }
        on_error => "account_access_removal_error"
      }
    }
    else if [technique_id] == "T1087" or [subtechnique_id] =~ "T1087" or [technique_name] == "Account Discovery" {
      mutate {
        replace => {
          "technique_data.id" => "T1087"
          "technique_data.name" => "Account Discovery"
        }
        on_error => "account_discovery_error"
      }
    }
    else if [technique_id] == "T1098" or [subtechnique_id] =~ "T1098" or [technique_name] == "Account Manipulation" {
      mutate {
        replace => {
          "technique_data.id" => "T1098"
          "technique_data.name" => "Account Manipulation"
        }
        on_error => "account_manipulation_error"
      }
    }
    else if [technique_id] == "T1650" or [subtechnique_id] =~ "T1650" or [technique_name] == "Acquire Access" {
      mutate {
        replace => {
          "technique_data.id" => "T1650"
          "technique_data.name" => "Acquire Access"
        }
        on_error => "acquire_access_error"
      }
    }
    else if [technique_id] == "T1583" or [subtechnique_id] =~ "T1583" or [technique_name] == "Acquire Infrastructure" {
      mutate {
        replace => {
          "technique_data.id" => "T1583"
          "technique_data.name" => "Acquire Infrastructure"
        }
        on_error => "acquire_infrastructure_error"
      }
    }
    else if [technique_id] == "T1595" or [subtechnique_id] =~ "T1595" or [technique_name] == "Active Scanning" {
      mutate {
          replace => {
          "technique_data.id" => "T1595"
          "technique_data.name" => "Active Scanning"
        }
        on_error => "active_scanning_error"
