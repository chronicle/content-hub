# Product: PROOFPOINT_TAP_FORENSICS
# Category: Email Server
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-11-06
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "threat_id" => ""
      "generated" => ""
      "report_id" => ""
      "report_name" => ""
      "report_scope" => ""
      "description" => ""
      "engine" => ""
      "malicious" => ""
      "forensics_time" => ""
      "threat_type" => ""
      "url" => ""
      "note" => ""
      "domain" => ""
      "subdomain" => ""
      "platforms" => ""
      "file_hash_sha256" => ""
      "path" => ""
      "rule" => ""
      "threat_action" => ""
      "port" => ""
      "prin_port" => ""
      "protocol" => ""
      "prin_ip" => ""
      "_security_result" => ""
      "_category_details" => ""
      "_principal_security_result" => ""
      "_verdict_info" => ""
      "_software" => ""
      "has_principal" => "false"
      "has_target" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }
  if [_not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [generated] != "" {
    date {
      match => ["generated","ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "_check_date_format_in_generated"
    }
  }

  if [report_name] != "" {
    mutate {
      replace => {
        "_security_result.threat_name" => "%{report_name}"
      }
      on_error => "_no_report_name"
    }
  }

  if [threat_id] != "" {
    mutate {
      replace => {
        "_security_result.threat_id" => "%{threat_id}"
      }
      on_error => "_no_threat_id"
    }
  }

  if [report_scope] != "" {
    mutate {
      replace => {
        "_category_details_scope" => "%{report_scope}"
      }
      on_error => "_no_report_scope"
    }
    mutate {
      merge => {
        "_security_result.category_details" => "_category_details_scope"
      }
      on_error => "_no_category_details_scope"
    }
  }

  if [threat_type] != "" {
    mutate {
      replace => {
        "_security_result.threat_name" => "%{threat_type}"
      }
      on_error => "_no_threat_type"
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "_security_result.summary" => "%{description}"
      }
      on_error => "_no_description"
    }
  }

  if [engine] != "" {
    mutate {
      replace => {
        "engine_labels.value" => "%{engine}"
      }
      on_error => "engine_empty"
    }
    if ![engine_empty] {
      mutate {
        replace => {
          "engine_labels.key" => "engine"
        }
      }
      mutate {
        merge => {
          "_security_result.about.resource.attribute.labels" => "engine_labels"
        }
        on_error => "engine_labels_empty"
      }
    }
  }

  if [threat_type] != "" {
    mutate {
      replace => {
        "threat_type_label.value.string_value" => "%{threat_type}"
      }
      on_error => "_threat_type_not_mapped"
    }
    if ![_threat_type_not_mapped] {
      mutate {
        replace => {
          "threat_type_label.key" => "threat_type"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "threat_type_label"
        }
        on_error => "_threat_type_empty"
      }
    }
  }
  if [malicious] != "" {
    mutate {
      convert => {
        "malicious" => "string"
      }
      on_error => "malicious_already_string"
    }
    mutate {
      replace => {
        "malicious_label.value.string_value" => "%{malicious}"
      }
      on_error => "malicious_empty"
    }
    if ![malicious_empty] {
      mutate {
        replace => {
          "malicious_label.key" => "malicious"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "malicious_label"
        }
        on_error => "malicious_label_empty"
      }
    }
  }

  if [malicious] != "" {
    mutate {
      replace => {
        "_principal_security_result.verdict.verdict.source_provider" => "ProofPoint TAP Forensics"
      }
    }
    if [malicious] == "true" {
      mutate {
        replace => {
            "_verdict_info.verdict_response" => "MALICIOUS"
        }
      }
    }
    else if [malicious] == "false" {
      mutate {
        replace => {
          "_verdict_info.verdict_response" => "BENIGN"
        }
      }
    }
    else {
      mutate {
        replace => {
          "_verdict_info.verdict_response" => "VERDICT_RESPONSE_UNSPECIFIED"
        }
      }
    }
  }

  if [platforms] != "" {
    if [platforms][0] =~ /.*(?i)win.*/ {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.platform_software.platform" => "WINDOWS"
        }
      }
    }
    else if [platforms][0] =~ /.*(?i)mac.*/ {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.platform_software.platform" => "MAC"
        }
      }
    }
    else if [platforms][0] =~ /.*(?i)ios.*/ {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.platform_software.platform" => "IOS"
        }
      }
    }
    else if [platforms][0] =~ /.*(?i)android.*/ {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.platform_software.platform" => "Android"
        }
      }
    }
  }

  if [threat_type] =~ /(?i)file/ {
    if [file_hash_sha256] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.file.sha256" => "%{file_hash_sha256}"
        }
        on_error => "file_hash_sha256_empty"
      }
    }
    if [path] != ""{
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.file.full_path" => "%{path}"
        }
        on_error => "path_empty"
      }
    }
  }

  if [threat_type] =~ /(?i)url/  {
    if [url] != "" {
      mutate {
        replace => {
            "event.idm.read_only_udm.principal.url" => "%{url}"
        }
        on_error => "url_empty"
      }
    }
    if [domain] != "" {
      mutate {
        replace => {
            "event.idm.read_only_udm.principal.domain.name" => "%{domain}"
        }
        on_error => "domain_empty"
      }
    }
  }

  if [threat_type] =~ /(?i)behavior/ {
    if [rule] != "" {
      mutate {
        replace => {
          "_security_result.rule_set" => "%{rule}"
        }
        on_error => "_no_rule"
      }
    }
  }
  if [threat_type] =~ /(?i)dns/ {
    for _cname in cnames {
      mutate {
        replace => {
          "_associations" => ""
          "_alias" => ""
        }
      }
      mutate {
        replace => {
          "_alias.name" => "%{_cname}"
        }
        on_error => "_no_forensic_what_cnames"
      }
      mutate {
        merge => {
          "_associations.alias" => "_alias"
        }
        on_error => "_no_alias"
      }
      mutate {
        merge => {
          "_security_result.associations" => "_associations"
        }
        on_error => "_no_associations"
      }
    }
  }

  if [threat_type] =~ /(?i)network/ {
    if [threat_action] != "" {
      mutate {
        replace => {
          "_security_result.action_details" => "%{threat_action}"
        }
        on_error => "threat_action_empty"
      }
    }
    if [port] != "" {
      mutate {
        convert => {
          "port" => "string"
        }
        on_error => "port_already_string"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{port}"
        }
        on_error => "port_empty"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
        on_error => "port_already_integer"
      }
    }
    if [description] != "" {
      grok {
        match => {
          "description" => "%{WORD:protocol}%{DATA}%{IP:prin_ip}:%{DATA:prin_port}"
        }
        overwrite => ["protocol", "prin_ip", "prin_port"]
        on_error => "description_grok_failed"
      }
    }
  }
  if [prin_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "prin_ip"
        "event.idm.read_only_udm.principal.asset.ip" => "prin_ip"
      }
      on_error => "prin_ip_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{protocol}"
      }
      on_error => "protocol_empty"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Proofpoint"
      "event.idm.read_only_udm.metadata.product_name" => "TAP Forensics"
      "event.idm.read_only_udm.metadata.product_event_type" => "Forensic Reports"
    }
  }

  mutate {
    merge => {
      "_security_result.verdict_info" => "_verdict_info"
    }
    on_error => "_no_verdict_info"
  }

  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "_security_result"
    }
    on_error => "_no_security_result"
  }

  if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
