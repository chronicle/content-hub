    if ![column9_label_not_present] {
      mutate {
        replace => {
          "column9_label.key" => "column9"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column9_label"
        }
        on_error => "column9_label_not_found"
      }
    }
  }
  mutate {
    rename => {
      "column13" => "addition.col13_label"
      "column14" => "addition.col14_label"
      "column17" => "addition.col17_label"
      "column18" => "addition.col18_label"
      "column19" => "addition.col19_label"
      "column25" => "addition.col25_label"
      "column36" => "addition.col36_label"
      "column46" => "addition.col46_label"
      "column47" => "addition.col47_label"
      "column48" => "addition.col48_label"
      "column49" => "addition.col49_label"
      "column50" => "addition.col50_label"
      "column54" => "addition.col54_label"
      "column8" => "addition.col8_label"

    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_failure"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "is_value_empty"
    }
    if ![is_value_empty] and [value] != "" and [value] != "[null]" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "is_key_empty"
      }
      if [key] in ["col13_label", "col14_label", "col17_label", "col18_label", "col19_label", "col25_label", "col36_label", "col46_label", "col47_label", "col48_label", "col49_label", "col50_label", "col54_label", "col8_label"] {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "value_not_string"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }
  if [column23] != "" {
    mutate {
      replace => {
        "column23_label.value.string_value" => "%{column23}"
      }
      on_error => "column23_label_not_present"
    }
    if ![column23_label_not_present] {
      mutate {
        replace => {
          "column23_label.key" => "column23"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column23_label"
        }
        on_error => "column23_label_not_found"
      }
    }
  }

  # Set Event Type
  if [auth_event] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
     mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}