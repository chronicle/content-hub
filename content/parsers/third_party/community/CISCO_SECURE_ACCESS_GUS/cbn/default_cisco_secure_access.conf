# Product: CISCO_SECURE_ACCESS
# Category: Remote Access Tools
# Supported Format: CSV
# Reference: N/A
# Last Updated: 2026-06-10
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Cisco"
      "event.idm.read_only_udm.metadata.product_name" => "Secure Access"
      "has_principal" => "false"
      "has_user" => "false"
      "has_target" => "false"
      "column1" => ""
      "column10" => ""
      "column11" => ""
      "column12" => ""
      "column15" => ""
      "column2" => ""
      "column20" => ""
      "column21" => ""
      "column22" => ""
      "column23" => ""
      "column3" => ""
      "column33" => ""
      "column34" => ""
      "column26" => ""
      "column27" => ""
      "column24" => ""
      "column16" => ""
      "column28" => ""
      "column29" => ""
      "column30" => ""
      "column31" => ""
      "column35" => ""
      "column36" => ""
      "column4" => ""
      "column5" => ""
      "column40" => ""
      "column41" => ""
      "column42" => ""
      "column43" => ""
      "column44" => ""
      "column45" => ""
      "column46" => ""
      "column56" => ""
      "column57" => ""
      "column6" => ""
      "column7" => ""
      "column9" => ""
      "column13" => ""
      "column14" => ""
      "column17" => ""
      "column18" => ""
      "column19" => ""
      "column25" => ""
      "column32" => ""
      "column37" => ""
      "column38" => ""
      "column39" => ""
      "column47" => ""
      "column48" => ""
      "column49" => ""
      "column50" => ""
      "column51" => ""
      "column52" => ""
      "column53" => ""
      "column54" => ""
      "column55" => ""
      "column8" => ""
      "p_hostname" => ""
      "is_dns" => "false"
      "auth_event" => "false"
      "p_bytes" => ""
      "sid" => ""
      "uuid" => ""
      "action_value" => ""
      "security_result_present" => "false"
    }
  }

  csv {
    source => "message"
    separator => ","
    on_error => "csv_failure"
  }

  if [column4] == "DISCONNECTED" {
    if [column7] != "" {
       mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{column7}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{column7}"
          "has_principal" => "true"
        }
        on_error => "column7_hostname_fail"
      }
    }
    if [column15] != "" {
      grok {
        match => {
          "column15" => ["%{IP:p_ip_check}"]
        }
        on_error => "column15_not_ip"
      }
      if ![column15_not_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "column15"
            "event.idm.read_only_udm.principal.asset.ip" => "column15"
          }
          on_error => "column15_ip_fail"
        }
        if ![column15_ip_fail] {
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
    }
    if [column16] != "" {
      grok {
        match => {
          "column16" => ["%{IP:t_ip_check}"]
        }
        on_error => "column16_not_ip"
      }
      if ![column16_not_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "column16"
            "event.idm.read_only_udm.target.asset.ip" => "column16"
          }
          on_error => "column16_ip_fail"
        }
        if ![column16_ip_fail] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
  }

  if [column29] == "[AUTHORIZATION-CHECK]" {
    mutate {
      replace => {
        "auth_event" => "true"
      }
    }
  }

  if [auth_event] == "true" {
    if [column2] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{column2}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{column2}"
          "has_principal" => "true"
        }
        on_error => "column2_hostname_fail"
      }
    }
    if [column7] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{column7}"
          "has_user" => "true"
        }
        on_error => "column7_userid_fail"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }

  if ([column8] == "NOERROR" or [column8] == "NXDOMAIN") and [column9] =~ /\.$/ {
    mutate {
      replace => {
        "is_dns" => "true"
        "event.idm.read_only_udm.network.application_protocol" => "DNS"
        "dns_question.name" => "%{column9}"
      }
      on_error => "dns_question_fail"
    }
    grok {
      match => {
        "column7" => ["%{INT:qtype}\\s+\\(%{WORD}\\)"]
      }
      on_error => "grok_qtype_failed"
    }
    if ![grok_qtype_failed] {
      mutate {
        replace => {
          "dns_question.type" => "%{qtype}"
        }
        convert => {
          "dns_question.type" => "uinteger"
        }
        on_error => "qtype_conversion_failed"
      }
    }
    if [column3] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{column3}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{column3}"
          "has_principal" => "true"
        }
        on_error => "column3_hostname_fail"
      }
    }
    if [column4] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "column4"
          "event.idm.read_only_udm.principal.asset.ip" => "column4"
        }
        on_error => "col4_ip_fail"
      }
      if ![col4_ip_fail] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [column5] != "" {
      grok {
        match => {
          "column5" => ["%{IP:t_ip_check_c5}"]
        }
        on_error => "column5_not_ip"
      }
      if ![column5_not_ip] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "column5"
            "event.idm.read_only_udm.target.asset.ip" => "column5"
          }
          on_error => "col5_ip_fail"
        }
        if ![col5_ip_fail] {
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{column8}"
        "has_target" => "true"
      }
    }
  }
  if [column1] != "" {
    date {
      match => ["column1", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_format"
    }
  }

  if [column3] != ""  {
    grok {
      match => {
        "column3" => [".*,%{GREEDYDATA:p_hostname}$"]
      }
      overwrite => ["p_hostname"]
      on_error => "grok_hostname_fail"
    }
    if ![grok_hostname_fail] and [p_hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{p_hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{p_hostname}"
          "has_principal" => "true"
        }
        on_error => "p_hostname_replace_failed"
      }

      grok {
        match => {
          "p_hostname" => ["^%{IP:p_ip_from_host}$"]
        }
        on_error => "host_is_not_ip_flag"
      }
      if ![host_is_not_ip_flag] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "p_ip_from_host"
            "event.idm.read_only_udm.principal.asset.ip" => "p_ip_from_host"
          }
          on_error => "p_ip_from_host_merge_failed"
        }
      }
    }
  }

  if [column10] =~ "(?i)User-Agent|Mozilla|Chrome|Safari|Firefox|MSIE|Opera|AppleWebKit|VIPM|Microsoft" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{column10}"
      }
      on_error => "failed_to_map_user_agent"
    }
  }
  else if [column10] != "" {
    grok {
      match => {
        "column10" => ["^%{IP:p_ip}$"]
      }
      overwrite => ["p_ip"]
      on_error => "grok_ip_fail"
    }
    if ![grok_ip_fail] and [p_ip] != "" and [p_ip] !~ "^0" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "p_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "p_ip"
        }
        on_error => "invalid_ip"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    } else {
      mutate {
        replace => {
          "column10_label.value.string_value" => "%{column10}"
        }
        on_error => "column10_label_not_present"
      }
      if ![column10_label_not_present] {
        mutate {
          replace => {
            "column10_label.key" => "column10"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "column10_label"
          }
          on_error => "column10_label_not_found"
        }
      }
    }
  }

  if [column25] != "" and [column25] != "[null]" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{column25}"
      }
      on_error => "column25_application_fail"
    }
  }

  if [column29] != "" and [column29] != "[null]" {
    mutate {
      gsub => ["column29", "[\\\[\\\]]", ""]
    }
    mutate {
      replace => {
        "column29_label.value.string_value" => "%{column29}"
      }
      on_error => "column29_label_not_present"
    }
    if ![column29_label_not_present] {
      mutate {
        replace => {
          "column29_label.key" => "column29"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column29_label"
        }
        on_error => "column29_label_not_found"
      }
    }
  }
  if [column11] != "" and [column11] != "[null]" {
    if [column11] =~ "^[0-9]{3}$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" => "%{column11}"
        }
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
        on_error => "column11_response_code_fail"
      }
    }
    else {
      mutate {
        replace => {
          "column11_label.value.string_value" => "%{column11}"
        }
        on_error => "column11_label_not_present"
      }
      if ![column11_label_not_present] {
        mutate {
          replace => {
            "column11_label.key" => "column11"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "column11_label"
          }
          on_error => "column11_label_not_found"
        }
      }
    }
  }

  mutate {
    convert => {
      "column12" => "string"
    }
    on_error => "column12_conversion_failed"
  }
  if [column12] != "" {
    grok {
      match => {
        "column12" => ["-%{INT:p_bytes}", "%{INT:p_bytes}"]
      }
      overwrite => ["p_bytes"]
      on_error => "grok_bytes_fail"
    }
    if ![grok_bytes_fail] and [p_bytes] != "" {
      mutate {
        replace => {
          "security_result_entry.rule_id" => "%{p_bytes}"
          "security_result_present" => "true"
        }
        on_error => "invalid_rule_id"
      }
    }
  }
  if [column15] != "" and [column4] != "DISCONNECTED" {
    if [column15] =~ "^-?[0-9]+$" {
      grok {
        match => {
          "column15" => ["-%{INT:p_bytes}", "%{INT:p_bytes}"]
        }
        overwrite => ["p_bytes"]
        on_error => "grok_received_bytes_fail"
      }
      mutate {
        convert => {
          "p_bytes" => "string"
        }
        on_error => "p_bytes_conversion_failed"
      }
      if ![grok_received_bytes_fail] and [p_bytes] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.product_object_id" => "%{p_bytes}"
          }
          on_error => "invalid_product_object_id"
        }
      }
    }
    else if [column15] != "[null]" {
      mutate {
        replace => {
          "column15_label.value.string_value" => "%{column15}"
        }
        on_error => "column15_label_not_present"
      }
      if ![column15_label_not_present] {
        mutate {
          replace => {
            "column15_label.key" => "column15"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "column15_label"
          }
          on_error => "column15_label_merge_failed"
        }
      }
    }
  }
  if [column16] != "" and [column4] != "DISCONNECTED" and [column16] != "[null]" {
    grok {
      match => {
        "column16" => ["%{INT:column16_int}"]
      }
      overwrite => ["column16_int"]
      on_error => "column16_not_int"
    }
    if ![column16_not_int] {
      mutate {
        replace => {
          "column16_label.value.string_value" => "%{column16_int}"
        }
        on_error => "column16_int_label_not_present"
      }
      if ![column16_int_label_not_present] {
        mutate {
          replace => {
            "column16_label.key" => "column16"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "column16_label"
          }
          on_error => "column16_label_not_found"
        }
      }
    }
    else {
      mutate {
        merge => {
          "security_result_entry.category_details" => "column16"
        }
        on_error => "column16_category_details_failed"
      }
      mutate {
        replace => {
          "security_result_present" => "true"
        }
      }
    }
  }
  if [column51] != "" and [column51] != "[null]" {
    mutate {
      replace => {
        "column51_label.value.string_value" => "%{column51}"
      }
      on_error => "column51_label_not_present"
    }
    if ![column51_label_not_present] {
      mutate {
        replace => {
          "column51_label.key" => "column51"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column51_label"
        }
        on_error => "column51_label_not_found"
      }
    }
  }
  if [column52] != "" and [column52] != "[null]" {
    mutate {
      replace => {
        "column52_label.value.string_value" => "%{column52}"
      }
      on_error => "column52_label_not_present"
    }
    if ![column52_label_not_present] {
      mutate {
        replace => {
          "column52_label.key" => "column52"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column52_label"
        }
        on_error => "column52_label_not_found"
      }
    }
  }
  if [column53] != "" and [column53] != "[null]" {
    mutate {
      replace => {
        "column53_label.value.string_value" => "%{column53}"
      }
      on_error => "column53_label_not_present"
    }
    if ![column53_label_not_present] {
      mutate {
        replace => {
          "column53_label.key" => "column53"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column53_label"
        }
        on_error => "column53_label_not_found"
      }
    }
  }
  if [column2] != "" {
    grok {
      match => {
        "column2" => ["%{GREEDYDATA:user_display_name}\\s+\\(%{GREEDYDATA:email}\\)"]
      }
      on_error => "no_email"
    }

    if ![no_email] {
      mutate {
        strip => ["user_display_name"]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_display_name}"
        }
        on_error => "user_display_name_not_present"
      }
      if [email] =~ "^.+@.+$" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.email_addresses" => "email"
          }
          on_error => "email_not_present"
        }
      }
      mutate {
        replace => {
          "has_user" => "true"
        }
      }
    }
    else if [column2] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "column2"
        }
        on_error => "user_email_not_present"
      }
      if ![user_email_not_present] {
        mutate {
          replace => {
            "has_user" => "true"
          }
        }
      }
    }
  }
  if [column20] != "" and [column20] != "[null]" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{column20}"
      }
      on_error => "invalid_session_id"
    }
  }
  if [column21] != "" and [column21] != "[null]" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{column21}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{column21}"
        "has_target" => "true"
      }
      on_error => "column21_not_present"
    }
  }
  if [column22] != "" {
    grok {
      match => {
        "column22" => ["%{IP:t_ip}"]
      }
      overwrite => ["t_ip"]
      on_error => "grok_target_ip_fail"
    }
    if ![grok_target_ip_fail] and [t_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "t_ip"
          "event.idm.read_only_udm.target.asset.ip" => "t_ip"
        }
        on_error => "t_ip_not_found"
      }
      if ![t_ip_not_found] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    else {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" => "column22"
        }
        on_error => "column22_not_present"
      }
    }
  }
  if [column5] != "" and [is_dns] == "false" and [column5] != "[null]" {
    grok {
      match => {
        "column5" => ["%{IP:column5_ip}"]
      }
      on_error => "column5_is_not_ip"
    }
    if ![column5_is_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "column5"
          }
        on_error => "column5_ip_merge_failed"
      }
      if ![column5_ip_merge_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{column5}"
          "event.idm.read_only_udm.target.asset.hostname" => "%{column5}"
          "has_target" => "true"
        }
        on_error => "column5_hostname_fail"
      }
    }
  }
  if [column33] != "" {
    mutate {
      gsub => ["column33", "[\\\[\\\]]", ""]
    }
    if [column33] != "" {
      grok {
        match => {
          "column33" => ["%{INT}"]
        }
        on_error => "not_an_integer"
      }
      if ![not_an_integer] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.port" => "%{column33}"
          }
          convert => {
            "event.idm.read_only_udm.target.port" => "integer"
          }
          on_error => "column33_not_present"
        }
      }
      else {
        mutate {
          replace => {
            "column33_label.value.string_value" => "%{column33}"
          }
          on_error => "column33_label_not_present"
        }
        if ![column33_label_not_present] {
          mutate {
            replace => {
              "column33_label.key" => "column33"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "column33_label"
            }
            on_error => "column33_label_not_found"
          }
        }
      }
    }
  }
  if [column34] == "TCP" {
    mutate {
      uppercase => ["column34"]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{column34}"
      }
      on_error => "column34_not_present"
    }
  }
  if [column24] != "" {
    mutate {
      replace => {
        "column24_label.value.string_value" => "%{column24}"
      }
      on_error => "column24_label_not_present"
    }
    if ![column24_label_not_present] {
      mutate {
        replace => {
          "column24_label.key" => "column24"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column24_label"
        }
        on_error => "column24_label_not_found"
      }
    }
  }
  if [column26] in ["GET", "POST", "PUT", "DELETE"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{column26}"      }
      on_error => "column26_method_fail"
    }
  }
  else if [column26] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{column26}"
      }
      on_error => "column26_not_present"
    }
  }
  if [column27] != "" {
    mutate {
