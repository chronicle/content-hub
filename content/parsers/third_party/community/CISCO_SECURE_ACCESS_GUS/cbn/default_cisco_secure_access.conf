    }
    if [column43] in ["true", "false"] {
      mutate {
        replace => {
          "column43_label.value.string_value" => "%{column43}"
        }
        on_error => "column43_label_not_present"
      }
      if ![column43_label_not_present] {
        mutate {
          replace => {
            "column43_label.key" => "column43"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "column43_label"
          }
          on_error => "column43_label_not_found"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{column43}"
          "has_user" => "true"
        }
        on_error => "column43_not_present"
      }
    }
  }
  if [column44] != "" {
    if [column44] =~ "\\.com$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{column44}"
          "has_target" => "true"
        }
        on_error => "column44_hostname_fail"
      }
    }
    else {
      mutate {
        replace => {
          "column44_label.value.string_value" => "%{column44}"
        }
        on_error => "column44_label_not_present"
      }
      if ![column44_label_not_present] {
        mutate {
          replace => {
            "column44_label.key" => "column44"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "column44_label"
          }
          on_error => "column44_label_not_found"
        }
      }
    }
  }
  if [column45] not in [ "", "true", "false" ] {
    mutate {
      gsub => ["column45", "[\\\[\\\]]", ""]
    }
    if [column45] =~ "," {
      grok {
        match => {
          "column45" => ["%{DATA:sid},%{GREEDYDATA:uuid}"]
        }
        overwrite => ["sid", "uuid"]
        on_error => "grok_sid_uuid_error"
      }
      if ![grok_sid_uuid_error] {
          grok {
            match => {
              "sid" => ["^(?P<parsed_sid>S-\\d(-\\d+)+)$"]
            }
            on_error => "sid_check_failed"
          }
          if ![sid_check_failed] {
            mutate {
              replace => {
                "event.idm.read_only_udm.principal.user.windows_sid" => "%{sid}"
                "has_user" => "true"
              }
              on_error => "sid_assign_failed"
            }
          }
        mutate {
          replace => {
            "column45_label.value.string_value" => "%{uuid}"
          }
          on_error => "column45_label_not_present"
        }
        if ![column45_label_not_present] {
          mutate {
            replace => {
              "column45_label.key" => "column45_uuid"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "column45_label"
            }
            on_error => "column45_label_not_found"
          }
        }
      }
    }
    else {
      grok {
        match => {
          "column45" => ["^(?P<parsed_sid>S-\\d(-\\d+)+)$"]
        }
        on_error => "sid_check_failed_2"
      }
      if ![sid_check_failed_2] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.windows_sid" => "%{column45}"
            "has_user" => "true"
          }
          on_error => "column45_not_found"
        }
      }
    }
