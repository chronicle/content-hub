    }
  }

  if [column4] != "" and [is_dns] == "false" {
    grok {
      match => {
        "column4" => ["%{IP:column4_ip}"]
      }
      on_error => "column4_is_not_ip"
    }
    if ![column4_is_not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "column4"
        }
        on_error => "column4_ip_merge_failed"
      }
      if ![column4_ip_merge_failed] {
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }
    else {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" => "column4"
        }
        on_error => "column4_not_present"
