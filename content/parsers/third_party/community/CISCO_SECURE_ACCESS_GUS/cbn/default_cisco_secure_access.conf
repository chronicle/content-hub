      replace => {
        "intermediary_entity.hostname" => "%{column57}"
      }
      on_error => "column57_not_present"
    }
    if ![column57_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary_entity"
        }
        on_error => "column57_merge_failed"
      }
    }
  }
  if [column7] != "" and [is_dns] == "false" and [auth_event] == "false" and [column4] != "DISCONNECTED" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform_version" => "%{column7}"
      }
      on_error => "column7_not_present"
    }
  }
  if [column56] != "" {
    mutate {
      replace => {
        "column56_label.key" => "ZTA_PROFILE_ID"
        "column56_label.value.string_value" => "%{column56}"
      }
      on_error => "zta_profile_id_not_present"
    }
    if ![zta_profile_id_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "column56_label"
        }
        on_error => "column56_label_not_found"
      }
    }
  }
  if [auth_event] == "true" and [column4] == "FAILED" {
    mutate {
      replace => {
        "security_result_entry.description" => "AUTHORIZATION-CHECK FAILED"
        "action_value" => "BLOCK"
      }
    }
  }
  if [column6] == "ALLOW" or [column6] == "Allowed" or [column6] =~ "success" {
    mutate {
      replace => {"action_value" => "ALLOW"}
