# Product: Cloudflare Network Analytics
# Category: SaaS Application
# Supported Format: JSON
# Reference: https://developers.cloudflare.com/logs/reference/log-fields/account/network_analytics_logs/
# Last Updated: 2025-09-11
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "ColoCity" => ""
      "ColoCountry" => ""
      "DestinationASN" => ""
      "DestinationASNName" => ""
      "DestinationCountry" => ""
      "DestinationGeoHash" => ""
      "DestinationPort" => ""
      "Direction" => ""
      "IPDestinationAddress" => ""
      "IPDestinationSubnet" => ""
      "IPProtocolName" => ""
      "IPSourceAddress" => ""
      "IPSourceSubnet" => ""
      "Outcome" => ""
      "RuleID" => ""
      "SourceASNName" => ""
      "SourceCountry" => ""
      "SourceGeoHash" => ""
      "sec_result_action" => ""
      "principal" => ""
      "security_result" => ""
      "target" => ""
      "metadata" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_network" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_msg_failed"
  }

  if [json_msg_failed] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  date {
    match => ["Datetime" , "ISO8601"]
    target => "metadata.event_timestamp"
    on_error => "timestamp_invalid"
  }

  if [ColoCity] != "" {
    mutate {
      replace => {
        "principal.location.city" => "%{ColoCity}"
      }
      on_error => "principal_location_city_invalid"
    }
  }

  if [ColoCountry] != "" {
    mutate {
      replace => {
        "principal.location.country_or_region" => "%{ColoCountry}"
      }
      on_error => "principal_location_country_or_region_invalid"
    }
  }

  if [DestinationASNName] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{DestinationASNName}"
        "target.asset.hostname" => "%{DestinationASNName}"
        "has_target" => "true"
      }
      on_error => "target_hostname_invalid"
    }
  }

  if [DestinationCountry] != "" {
    mutate {
      replace => {
        "target.location.country_or_region" => "%{DestinationCountry}"
      }
      on_error => "target_location_country_or_region_invalid"
    }
  }

  if [DestinationGeoHash] != "" {
    mutate {
      replace => {
        "DestinationGeoHash_label.key" => "DestinationGeoHash"
        "DestinationGeoHash_label.value" => "%{DestinationGeoHash}"
      }
      on_error => "DestinationGeoHash_label_invalid"
    }
    if ![DestinationGeoHash_label_invalid] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "DestinationGeoHash_label"
        }
        on_error => "DestinationGeoHash_label_invalid"
      }
    }
  }

  mutate {
    convert => {
      "DestinationPort" => "string"
    }
    on_error => "DestinationPort_invalid"
  }

  if [DestinationPort] != "" and ![DestinationPort_invalid] {
    mutate {
      replace => {
        "target.port" => "%{DestinationPort}"
      }
      convert => {
        "target.port" => "integer"
      }
      on_error => "target_port_invalid"
    }
  }

  mutate {
    uppercase => ["Direction"]
  }
  if [Direction] == "EGRESS" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "OUTBOUND"
      }
    }
  }
  if [Direction] == "INGRESS" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.direction" => "INBOUND"
      }
    }
  }

  if [IPDestinationAddress] != "" {
    mutate {
      merge => {
        "target.ip" => "IPDestinationAddress"
        "target.asset.ip" => "IPDestinationAddress"
      }
      on_error => "target_ip_invalid"
    }
    if ![target_ip_invalid] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [IPDestinationSubnet] != "" {
    mutate {
      replace => {
        "IPDestinationSubnet_label.key" => "IPDestinationSubnet"
        "IPDestinationSubnet_label.value" => "%{IPDestinationSubnet}"
      }
      on_error => "IPDestinationSubnet_label_invalid"
    }
    if ![IPDestinationSubnet_label_invalid] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "IPDestinationSubnet_label"
        }
        on_error => "IPDestinationSubnet_label_invalid"
      }
    }
  }

  if [SourceASNName] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{SourceASNName}"
        "principal.asset.hostname" => "%{SourceASNName}"
        "has_principal" => "true"
      }
      on_error => "principal_hostname_invalid"
    }
  }

  if [SourceCountry] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.src.location.country_or_region" => "%{SourceCountry}"
      }
      on_error => "source_country_invalid"
    }
  }

  if [SourceGeoHash] != "" {
    mutate {
      replace => {
        "SourceGeoHash_label.key" => "SourceGeoHash"
        "SourceGeoHash_label.value" => "%{SourceGeoHash}"
      }
      on_error => "SourceGeoHash_label_invalid"
    }
    if ![SourceGeoHash_label_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "SourceGeoHash_label"
        }
        on_error => "SourceGeoHash_label_invalid"
      }
    }
  }

  if [RuleID] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{RuleID}"
      }
      on_error => "product_log_id_invalid"
    }
  }

  if [IPProtocolName] in ["ICMP", "TCP", "UDP"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "ICMP"
        "has_network" => "true"
      }
      on_error => "IPProtocolName_invalid"
    }
  }

  if [IPSourceAddress] != "" {
    mutate {
      merge => {
        "principal.asset.ip" => "IPSourceAddress"
        "principal.ip" => "IPSourceAddress"
      }
      on_error => "IPSourceAddress_invalid"
    }
    if ![IPSourceAddress_invalid] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [IPSourceSubnet] != "" {
    mutate {
      replace => {
        "IPSourceSubnet_label.key" => "IPSourceSubnet"
        "IPSourceSubnet_label.value" => "%{IPSourceSubnet}"
      }
      on_error => "IPSourceSubnet_label_invalid"
    }
    if ![IPSourceSubnet_label_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "IPSourceSubnet_label"
        }
        on_error => "IPSourceSubnet_label_invalid"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "CLOUDFLARE"
      "metadata.product_name" => "Web Application Firewall"
    }
  }

  if [has_principal] == "true" and [has_target] == "true" and [has_network] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    convert => {
      "IPProtocol" => "string"
    }
    on_error => "IPProtocol_invalid"
  }

  if [IPProtocol] == "1" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "ICMP"
      }
    }
  }
  else if [IPProtocol] == "6" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "TCP"
      }
    }
  }
  else if [IPProtocol] == "17" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "UDP"
      }
    }
  }

  if [Outcome] == "pass" {
    mutate {
      replace => {
        "sec_result_action" => "ALLOW"
      }
    }
  }
  else if [Outcome] == "drop" {
    mutate {
      replace => {
        "sec_result_action" => "BLOCK"
      }
    }
  }
  if [sec_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sec_result_action"
      }
      on_error => "no_action"
    }
  }

  if [Outcome] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{Outcome}"
      }
      on_error => "Outcome_empty"
    }
  }
  mutate {
    convert => {
      "SourceASN" => "string"
    }
    on_error => "SourceASN_invalid"
  }
  if [SourceASN] != "" {
    mutate {
      replace => {
        "principal.network.asn" => "%{SourceASN}"
      }
      on_error => "SourceASN_empty"
    }
  }
  mutate {
    convert => {
      "DestinationASN" => "string"
    }
    on_error => "DestinationASN_conversion_failure"
  }
  if [DestinationASN] != "" {
    mutate {
      replace => {
        "target.network.asn" => "%{DestinationASN}"
      }
      on_error => "DestinationASN_empty"
    }
  }
  mutate {
    rename => {
      "GREChecksum" => "addition.GREChecksum"
      "GREEtherType" => "addition.GREEtherType"
      "GREHeaderLength" => "addition.GREHeaderLength"
      "GREKey" => "addition.GREKey"
      "GRESequenceNumber" => "addition.GRESequenceNumber"
      "GREVersion" => "addition.GREVersion"
      "ICMPChecksum" => "addition.ICMPChecksum"
      "ICMPCode" => "addition.ICMPCode"
      "ICMPType" => "addition.ICMPType"
      "IPFragmentOffset" => "addition.IPFragmentOffset"
      "IPHeaderLength" => "addition.IPHeaderLength"
      "IPMoreFragments" => "addition.IPMoreFragments"
      "IPProtocol" => "addition.IPProtocol"
      "IPTTL" => "addition.IPTTL"
      "IPTTLBuckets" => "addition.IPTTLBuckets"
      "IPTotalLength" => "addition.IPTotalLength"
      "IPTotalLengthBuckets" => "addition.IPTotalLengthBuckets"
      "IPv4Checksum" => "addition.IPv4Checksum"
      "IPv4DSCP" => "addition.IPv4DSCP"
      "IPv4DontFragment" => "addition.IPv4DontFragment"
      "IPv4ECN" => "addition.IPv4ECN"
      "IPv4Identification" => "addition.IPv4Identification"
      "IPv6DSCP" => "addition.IPv6DSCP"
      "IPv6ECN" => "addition.IPv6ECN"
      "IPv6FlowLabel" => "addition.IPv6FlowLabel"
      "IPv6Identification" => "addition.IPv6Identification"
      "SampleInterval" => "addition.SampleInterval"
      "TCPAcknowledgementNumber" => "addition.TCPAcknowledgementNumber"
      "TCPTimestampECR" => "addition.TCPTimestampECR"
      "TCPTimestampValue" => "addition.TCPTimestampValue"
      "TCPUrgentPointer" => "addition.TCPUrgentPointer"
      "TCPWindowScale" => "addition.TCPWindowScale"
      "TCPWindowSize" => "addition.TCPWindowSize"
      "TCPChecksum" => "addition.TCPChecksum"
      "TCPDataOffset" => "addition.TCPDataOffset"
      "TCPFlags" => "addition.TCPFlags"
      "TCPMSS" => "addition.TCPMSS"
      "TCPSACKPermitted" => "addition.TCPSACKPermitted"
      "UDPChecksum" => "addition.UDPChecksum"
      "UDPPayloadLength" => "addition.UDPPayloadLength"
      "Verdict" => "addition.Verdict"

      # security_result
      "ColoCode" => "addition.ColoCode"
      "ColoGeoHash" => "addition.ColoGeoHash"
      "ColoName" => "addition.ColoName"
      "TCPSequenceNumber" => "addition.TCPSequenceNumber"
      "RulesetID" => "addition.RulesetID"
      "MitigationReason" => "addition.MitigationReason"
      "MitigationScope" => "addition.MitigationScope"
      "MitigationSystem" => "addition.MitigationSystem"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_convert_failure"
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [value] not in ["", "-", "None", "N/A"] and [key] in ["GREChecksum", "GREVersion", "GREHeaderLength", "GREKey", "GRESequenceNumber", "ICMPChecksum", "ICMPType", "ICMPCode", "IPFragmentOffset", "IPHeaderLength", "IPMoreFragments", "IPProtocol", "IPTTL", "IPTTLBuckets", "IPTotalLength", "IPTotalLengthBuckets", "IPv4Checksum", "IPv4DSCP", "IPv4DontFragment", "IPv4ECN", "IPv4Identification", "IPv6DSCP", "IPv6ECN", "IPv6FlowLabel", "IPv6Identification", "MitigationSystem", "SampleInterval", "TCPAcknowledgementNumber", "TCPTimestampECR", "TCPTimestampValue", "TCPUrgentPointer", "TCPWindowScale", "TCPWindowSize", "TCPChecksum", "TCPDataOffset", "TCPFlags", "TCPMSS", "TCPSACKPermitted", "UDPChecksum", "UDPPayloadLength", "Verdict", "ColoCode", "ColoGeoHash", "ColoName", "TCPSequenceNumber", "RulesetID", "MitigationReason", "MitigationScope"] {
      mutate {
        replace => {
          "field_.key" => "%{key}"
        }
        on_error => "key_not_exists"
      }
      if [key] in ["ColoCode", "ColoGeoHash", "ColoName", "TCPSequenceNumber", "RulesetID", "MitigationReason", "MitigationScope", "MitigationSystem"] {
        mutate {
          replace => {
            "field_.value" => "%{value}"
          }
          on_error => "value_not_exists"
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "field_"
          }
          on_error => "field_empty"
        }
      }
      else {
        mutate {
          replace => {
            "field_.value.string_value" => "%{value}"
          }
          on_error => "value_not_exists"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "field_"
          }
          on_error => "field_empty"
        }
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_invalid"
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  mutate {
    merge=> {
      "@output" => "event"
    }
  }
}
