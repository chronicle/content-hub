# Product: BITWARDEN_EVENTS
# Category: Password Manager
# Supported Format: JSON
# Reference: https://bitwarden.com/help/event-logs/
# Last Updated: 2023-11-09
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "collectionID" => ""
      "groupId" => ""
      "enriched.type" => ""
      "enriched.actingUser.email" => ""
      "enriched.actingUser.name" => ""
      "enriched.actingUser.resetPasswordEnrolled" => ""
      "enriched.actingUser.id" => ""
      "enriched.actingUser.userId" => ""
      "enriched.actingUser.accessAll" => ""
      "enriched.actingUser.twoFactorEnabled" => ""
      "enriched.actingUser.object" => ""
      "enriched.collection.object" => ""
      "enriched.collection.id" => ""
      "actingUserId" => ""
      "ipAddress" => ""
      "object" => ""
      "principal" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "target" => ""
      "network" => ""
      "metadata" => ""
      "event_type" => ""
      "extensions" => ""
      "security_res_action" => ""
      "security_result" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [collectionID] not in ["","null"] {
    mutate {
      replace => {
        "collectionId_label.key" => "CollectionID"
        "collectionId_label.value" => "%{collectionID}"
      }
      on_error => "invalid_collectionId"
    }
    mutate {
      merge => {
        "security_result.detection_fields" => "collectionId_label"
      }
      on_error => "invalid_collectionId_label"
    }
  }

  if [groupId] not in ["","-","null"] {
    mutate {
      merge => {
        "target.user.group_identifiers" => "groupId"
      }
      on_error => "groupId_not_found"
    }
  }

  if [date] != "" {
    date {
      match => ["date", "yyyy-MM-dd HH:mm:ss", "RFC3339",
                "UNIX", "ISO8601"]
      target => "metadata.event_timestamp"
      on_error => "format_not_match"
    }
  }

  if [enriched][type] not in ["","-","null"] {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{enriched.type}"
      }
      on_error => "enriched_type_error"
    }
  }

  if [enriched][actingUser][email] != "" {
    mutate {
      merge => {
        "target.user.email_addresses" => "enriched.actingUser.email"
      }
      on_error => "email_not_found"
    }
  }

  if [enriched][actingUser][name] != "" {
    mutate {
      replace => {
        "target.user.user_display_name" => "%{enriched.actingUser.name}"
      }
      on_error => "name_not_found"
    }
  }

  if [enriched][actingUser][resetPasswordEnrolled] != "" {
    mutate {
      convert => {
        "enriched.actingUser.resetPasswordEnrolled" => "string"
      }
      on_error => "resetPasswordEnrolled_conversion_error"
    }
    if ![resetPasswordEnrolled_conversion_error] {
      mutate {
        replace => {
          "resetPasswordEnrolled_label.key" => "ResetPasswordEnrolled"
          "resetPasswordEnrolled_label.value" => "%{enriched.actingUser.resetPasswordEnrolled}"
        }
        merge => {
          "target.labels" => "resetPasswordEnrolled_label"
        }
        on_error => "resetPasswordEnrolled_not_found"
      }
    }
  }

  if [enriched][actingUser][id] not in ["","null"] {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{enriched.actingUser.id}"
      }
      on_error => "id_error"
    }
  }

  if [enriched][actingUser][userId] not in ["","null"] {
    mutate {
      replace => {
        "target.user.userid" => "%{enriched.actingUser.userId}"
        "has_target" => "true"
      }
      on_error => "userId_error"
    }
  }

  if [enriched][actingUser][userId] in ["","null"] and [actingUserId] not in ["","null"] {
    mutate {
      replace => {
        "target.user.userid" => "%{actingUserId}"
        "has_target" => "true"
      }
      on_error => "actingUserId_error"
    }
  }

  if  [enriched][actingUser][accessAll] not in ["","null"] {
    mutate {
      convert => {
        "enriched.actingUser.accessAll" => "string"
      }
      on_error => "accessAll_conversion_error"
    }
    if ![accessAll_conversion_error] {
      mutate {
        replace => {
          "access_label.key" => "Access_All"
          "access_label.value" => "%{enriched.actingUser.accessAll}"
        }
        on_error => "access_label_error"
      }
      mutate {
        merge => {
          "security_result.rule_labels" => "access_label"
        }
        on_error => "access_label__merge_error"
      }
    }
  }

  if  [enriched][actingUser][twoFactorEnabled] not in ["","null"] {
    mutate {
      convert => {
        "enriched.actingUser.twoFactorEnabled" => "string"
      }
      on_error => "twoFactorEnabled_conversion_error"
    }
    if ![twoFactorEnabled_conversion_error] {
      mutate {
        replace => {
          "twoFactorEnabled_label.key" => "Two Factor Enabled"
          "twoFactorEnabled_label.value" => "%{enriched.actingUser.twoFactorEnabled}"
        }
        on_error => "twoFactorEnabled_error"
      }
      mutate {
        merge => {
          "security_result.rule_labels" => "twoFactorEnabled_label"
        }
       on_error => "twoFactorEnabled_merge_error"
      }
    }
  }

  if [enriched][actingUser][object] != "" {
    mutate {
      replace => {
        "object_label.key" => "Object"
        "object_label.value" => "%{enriched.actingUser.object}"
      }
      merge => {
        "target.labels" => "object_label"
      }
      on_error => "object_not_found"
    }
  }

  if [enriched][actingUser][id] != "" {
    mutate {
      replace => {
        "Id_label.key" => "ID"
        "Id_label.value" => "%{enriched.actingUser.id}"
      }
      merge => {
        "target.labels" => "Id_label"
      }
      on_error => "id_not_found"
    }
  }

  if [ipAddress] not in ["","null"] {
    grok {
      match => {
        "ipAddress" => ["%{IP:tar_ip}"]
      }
      on_error => "not_ip"
      overwrite => ["tar_ip"]
    }
    if ![not_ip] {
      mutate {
        merge => {
          "principal.ip" => "tar_ip"
        }
        replace => {
          "has_principal" => "true"
        }
        on_error => "ip_error"
      }
    }
  }

  if [enriched][collection][object] not in ["","null"] {
    mutate {
      replace => {
        "collection_object.key" => "Collection Object"
        "collection_object.value.string_value" => "%{enriched.collection.object}"
      }
      on_error => "collection_object_not_present"
    }
    if ![collection_object_not_present] {
      mutate {
        merge => {
          "additional.fields" => "collection_object"
        }
      }
    }
  }
  if [object] not in ["","null"] {
    mutate {
      replace => {
        "object_label.key" => "Object"
        "object_label.value" => "%{object}"
      }
      on_error => "object_not_present"
    }
    if ![object_not_present] {
      mutate {
        merge => {
          "additional.fields" => "object_label"
        }
      }
    }
  }
  if [enriched][collection][id] not in ["","null"] {
    mutate {
      replace => {
        "collection_id.key" => "Collection ID"
        "collection_id.value.string_value" => "%{enriched.collection.id}"
      }
      on_error => "collection_id_not_present"
    }
    if ![collection_id_not_present] {
      mutate {
        merge => {
          "additional.fields" => "collection_id"
        }
      }
    }
  }


  if [enriched][type] =~ "(?i)user-logged-in" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "security_res_action" => "ALLOW"
      }
    }
  }
  else if [enriched][type] =~ "(?i)user-failed-login-incorrect-password" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        "security_res_action" => "BLOCK"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [security_res_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_res_action"
      }
      on_error => "sec_action_action_error"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

