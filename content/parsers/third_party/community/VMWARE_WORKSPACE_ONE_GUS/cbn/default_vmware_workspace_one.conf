# Product: VMWARE_WORKSPACE_ONE
# Category: Logging and Troubleshooting
# Supported Format: SYSLOG
# Reference : https://docs.vmware.com/en/VMware-Workspace-ONE-UEM/services/UEM_Logging/GUID-AWT-LOGGINGKEYSTONE.html
# Last Updated: 2023-08-04
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "hostname" => ""
      "log_type" => ""
      "metadata_description" => ""
      "Thread" => ""
      "Id" => ""
      "product_log_id" => ""
      "stackTop" => ""
      "clientAddress" => ""
      "requestId" => ""
      "target_host" => ""
      "configid" => ""
      "messageId" => ""
      "cmd" => ""
      "url" => ""
      "ip" => ""
      "security_result" => ""
      "status" => ""
      "action" => ""
      "src_ip" => ""
      "protocol" => ""
      "method" => ""
      "user_agent" => ""
      "ts" => ""
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      "userid" => ""
      "airwatch_event_type" => ""
      "log_event_name" => ""
      "airwatch_user" => ""
      "event_source" => ""
      "event_category" => ""
      "event_module" => ""
      "event_data" => ""
     }
  }

  grok {
    match => {
      "message" => ["<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:hostname} %{GREEDYDATA:metadata_description}%{SPACE}- \\[Id: %{DATA:product_log_id}, Origin: Request\\[%{GREEDYDATA:kv_msg}\\] StackTop - %{GREEDYDATA:stackTop}\\]",
                    "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:hostname} %{GREEDYDATA:metadata_description} - \\[ResolvedContext: RequestContext\\[%{GREEDYDATA:kv_msg}\\],%{DATA}]",
                    "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:hostname} %{GREEDYDATA:metadata_description}: %{DATA:userid}( - %{GREEDYDATA:summary})? - %{WORD:status}",
                    "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:hostname} (?:%{DATA:metadata_description} configid %{DATA:configid} for tenant %{DATA:target_host}|%{GREEDYDATA:metadata_description})",
                    "(?:Host: %{IP:src_ip}|User-Agent:%{SPACE}%{GREEDYDATA:user_agent})",
                    "(?:%{GREEDYDATA}class %{DATA:cmd} %{DATA} uri: %{GREEDYDATA:url}|%{WORD:method}%{SPACE}/(%{DATA})?%{GREEDYDATA:protocol})",
                    "(<%{INT}> |)%{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time} AirWatch%{SPACE}AirWatch Syslog Details are as follows Event Type: %{DATA:airwatch_event_type}:%{DATA:log_event_name}User: %{DATA:airwatch_user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{GREEDYDATA:event_data} Event Timestamp: %{MONTH}%{SPACE}%{MONTHDAY} %{TIME}",
                    "(<%{INT}> |)%{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time} AirWatch%{SPACE}AirWatch Syslog Details are as follows Event Type: %{DATA:airwatch_event_type}:%{DATA:log_event_name}User: %{DATA:airwatch_user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{GREEDYDATA:event_data}"
]
    }
    overwrite => ["hostname", "log_type", "metadata_description","ts", "Id", "kv_msg", "stackTop", "hostname", "description", "product_log_id", "configid", "target_host", "cmd", "url", "status", "summary", "status", "src_ip", "method", "protocol", "user_agent", "userid",
                  "airwatch_event_type","log_event_name","airwatch_user","event_source","event_category","event_module","event_data"]
    on_error => "pattern_not_matched"
  }

  mutate {
    gsub => ["event_ts_time", "\\n", ""]
  }
  mutate {
    replace => {
      "ts" => "%{event_ts_month} %{event_ts_day} %{event_ts_time}"
    }
    on_error => "pattern_missing"
  }

  if [ts] != "" {
    date {
      match => [ts, "MMM  d HH:mm:ss","MMM d HH:mm:ss", "MMM dd HH:mm:ss"]
      rebase => true
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
         "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
      }
    }
  }

  if [status] =~ "SUCCESS" {
    mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
  } else if [status] =~ "FAILURE" {
    mutate {
      replace => {
        "action" => "BLOCK"
      }
    }
  }

  if [action] != "" {
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }

  if [cmd] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{cmd}"
      }
    }
  }

  if [protocol] =~ "HTTP" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "HTTP"
      }
    }
  }

  if [userid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{userid}"
      }
    }
  }

  if [url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
    }
  }

  if [target_host] != "" {
    mutate {
      replace => {
         "event.idm.read_only_udm.target.hostname" => "%{target_host}"
      }
    }
  }

  mutate {
    gsub => ["kv_msg", ": ", ":"]
  }

  kv {
    source => "kv_msg"
    field_split => ", "
    value_split => ":"
    on_error => "not_kv"
  }

  if [Id] != "" {
    mutate {
      replace => {
        "additional_Id.key" => "RequestedId"
        "additional_Id.value.string_value" => "%{Id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_Id"
      }
    }
  } else if [requestId] != "" {
    mutate {
      replace => {
        "additional_Id.key" => "requestId"
        "additional_Id.value.string_value" => "%{requestId}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_Id"
      }
    }
  }

  if [configid] != "" {
    mutate {
      replace => {
        "additional_config.key" => "configid"
        "additional_config.value.string_value" => "%{configid}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_config"
      }
    }
  }

  if [method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{method}"
      }
    }
  }

  if [Thread] != "" {
    mutate {
      replace => {
        "additional_thread.key" => "Thread"
        "additional_thread.value.string_value" => "%{Thread}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_thread"
      }
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }
  }

  if [log_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{log_type}"
      }
    }
  }

  if [metadata_description] =~ "messageId" {
    grok {
      match => {
        "metadata_description" => ["%{DATA}messageId: %{DATA:messageId} for %{GREEDYDATA}"]
      }
      overwrite => ["messageId"]
      on_error => "no_messageId"
    }
    mutate {
      replace => {
        "additional_messageId.key" => "messageId"
        "additional_messageId.value.string_value" => "%{messageId}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_messageId"
      }
    }
  } else if [metadata_description] =~ "Hostname" {
    grok {
      match => {
        "metadata_description" => ["Hostname: %{HOSTNAME:intermediary_hostname}"]
      }
      on_error => "no_intermediary_hostname"
    }
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_hostname}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
    }
  } else if [metadata_description] =~ "ClientHost" {
    grok {
      match => {
        "metadata_description" => "ClientHost:%{SPACE}%{IP:src_ip}"
      }
      on_error => "not_ip"
      overwrite => ["src_ip"]
     }
    if ![not_ip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
        }
      }
    }
  }
  if [metadata_description] != "" {
    mutate {
      replace => {
         "event.idm.read_only_udm.metadata.description" => "%{metadata_description}"
      }
    }
  }

  if [user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{user_agent}"
      }
    }
  }

  if [product_log_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{product_log_id}"
      }
    }
  }

  if [stackTop] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{stackTop}"
      }
    }
  }

  if [clientAddress] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "clientAddress"
      }
    }
  }

  if [log_event_name] != "" {
    mutate {
      gsub => ["log_event_name","^\\s+",""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{log_event_name}"
      }
      on_error => "not_found"
    }
  }

  if [airwatch_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{airwatch_user}"
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "not_found"
    }
  }

  if [event_source] != "" {
    mutate {
      replace => {
        "event_source_label.key" => "EventSource"
        "event_source_label.value.string_value" => "%{event_source}"
      }
      on_error => "event_source_not_present"
    }
    if ![event_source_not_present] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_source_label"
        }
      }
    }
  }

  if [event_module] != "" {
    mutate {
      replace => {
        "event_module_labels.key" => "Event Module"
        "event_module_labels.value.string_value" => "%{event_module}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "event_module_labels"
      }
    }
  }

  if [event_category] != "" {
    mutate {
      replace => {
        "additional_event_categories.key" => "Event Category"
        "additional_event_categories.value.string_value" => "%{event_category}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_event_categories"
      }
    }
    mutate {
      replace => {
        "sec_category_details" => "%{event_category}"
      }
    }
    mutate {
      merge => {
        "security_result.category_details" => "sec_category_details"
      }
    }
  }

  if [event_data] != "" {
    mutate {
      gsub => ["event_data","^\\s+",""]
    }
    mutate {
      replace => {
        "bytes_received" => ""
      }
    }
    grok {
      match => {
        "event_data" => [".*BytesReceived=%{NUMBER:bytes_received}.*"]
      }
      on_error => "event_data_grok_fail"
      overwrite => ["bytes_received"]
    }
    if [bytes_received] not in ["0",""] {
      mutate {
        replace => {
          "network.received_bytes" => "%{bytes_received}"
        }

        convert => {
          "network.received_bytes" => "uinteger"
        }
      }

      mutate {
        rename => {
          "network" => "event.idm.read_only_udm.network"
        }
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{event_data}"
      }
      on_error => "not_found"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "VMWARE_WORKSPACE_ONE"
      "event.idm.read_only_udm.metadata.product_name" => "VMWARE_WORKSPACE_ONE"
    }
  }

  if [hostname] != "" or [src_ip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
