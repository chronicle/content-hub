# Product: Netapp_Storagegrid
# Category: Security
# Supported Format: SYSLOG + KV
# Reference: https://docs.netapp.com/us-en/storagegrid-116/audit/idel-ilm-initiated-delete.html
# Last Updated: 2026-05-15
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "RSLT" => ""
      "TIME" => ""
      "TLIP" => ""
      "SAIP" => ""
      "SBAI" => ""
      "SACC" => ""
      "AVER" => ""
      "MTME" => ""
      "S3AI" => ""
      "SBAC" => ""
      "CSIZ" => ""
      "SUSR" => ""
      "CNID" => ""
      "CBID" => ""
      "S3AK" => ""
      "AMID" => ""
      "UUID" => ""
      "S3BK" => ""
      "S3KY" => ""
      "STAT" => ""
      "PATH" => ""
      "RULE" => ""
      "LOCS" => ""
      "ATIM" => ""
      "ATID" => ""
      "ATYP" => ""
      "ANID" => ""
      "command" => ""
      "userid" => ""
      "path" => ""
      "prin_host" => ""
      "kv_data" => ""
      "security_result_action" => ""
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "additional" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "VSID" => ""
      "eventtime_sec" => ""
      "eventtime_micro" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:prin_host} %{DATA}: %{TIMESTAMP_ISO8601:date_time} \\[%{GREEDYDATA:kv_data}\\]",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:prin_host} %{DATA}: PWD=%{DATA:path} ; USER=%{DATA:userid} ; COMMAND=%{NOTSPACE:command}"
      ]
    }
    overwrite => ["kv_data", "userid", "command", "path", "prin_host"]
    on_error => "grok_failure"
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "NETAPP_STORAGEGRID"
      "metadata.product_name" => "NETAPP_STORAGEGRID"
    }
  }

  if [userid] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{userid}"
      }
      on_error => "userid_empty"
    }
  }
  if [path] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{path}"
      }
      on_error => "path_empty"
    }
  }
  if [command] != "" {
    mutate {
      replace => {
        "target.process.command_line" => "%{command}"
      }
      on_error => "command_empty"
    }
  }

  if [kv_data] != "" {
    mutate {
      gsub => ["kv_data", '\\(FC32\\):', ":"]
    }
    mutate {
      gsub => ["kv_data", '\\(UI64\\):', ":"]
    }
    mutate {
      gsub => ["kv_data", '\\(IPAD\\):', ":"]
    }
    mutate {
      gsub => ["kv_data", '\\(CSTR\\):', ":"]
    }
    mutate {
      gsub => ["kv_data", '\\(UI32\\):', ":"]
    }
    mutate {
      gsub => ["kv_data", '\\]\\[', "#"]
    }
    mutate {
      gsub => ["kv_data", 'AUDT:\\[', ""]
    }
    mutate {
      gsub => ["kv_data", '\\]', ""]
    }
    mutate {
      gsub => ["kv_data", '\"', ""]
    }
    kv {
      source => "kv_data"
      field_split => "#"
      value_split => ":"
      on_error => "kv_failure"
    }
  }

  if [ATIM] != "" {
    grok {
      match => {
        "ATIM" => "(?P<eventtime_sec>[0-9]{10})(?P<eventtime_micro>[0-9]+)"
      }
      overwrite => ["eventtime_sec", "eventtime_micro"]
      on_error => "eventtime_grok_error"
    }
    if ![eventtime_grok_error] {
      mutate {
        replace => {
          "ATIM" => "%{eventtime_sec}.%{eventtime_micro}"
        }
        on_error => "eventtime_replace_error"
      }
    }
    date {
      match => ["ATIM", "UNIX"]
      target => "metadata.event_timestamp"
      on_error => "date_error"
    }
  }

  if [SAIP] =~ "^(?:[0-9]{1,3}[.]){3}[0-9]{1,3}$" {
    mutate {
      merge => {
        "principal.ip" => "SAIP"
        "principal.asset.ip" => "SAIP"
      }
      on_error => "SAIP_empty"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [VSID] != "" {
    mutate {
      replace => {
        "vsid_label.key" => "VSID"
        "vsid_label.value" => "%{VSID}"
      }
      on_error => "VSID_empty"
    }
    if ![VSID_empty] {
      mutate {
        merge => {
          "target.resource.attribute.labels" => "vsid_label"
        }
        on_error => "VSID_label_empty"
      }
    }
  }

  # S3 tenant account ID (bucket owner)
  if [SBAI] != "" {
    mutate {
      replace => {
        "principal.user.product_object_id" => "%{SBAI}"
      }
      on_error => "SBAI_Invalid"
    }
  }

  if [PATH] != "" {
    mutate {
      replace = {
        "principal.url" = "%{PATH}"
      }
      on_error => "PATH_empty"
    }
  }

  if [prin_host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{prin_host}"
        "principal.asset.hostname" => "%{prin_host}"
        "has_principal" => "true"
      }
      on_error => "prin_host_empty"
    }
  }

  # Node ID
  if [ANID] != "" {
    mutate {
      replace => {
        "principal.resource.id" => "nodeId:%{ANID}"
      }
      on_error => "ANID_empty"
    }
  }

  # Event Type
  if [ATYP] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{ATYP}"
      }
      on_error => "ATYP_empty"
    }
  }

  # Trace ID
  if [ATID] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{ATID}"
      }
      on_error => "no_traceId"
    }
  }

  # S3 tenant account name (request sender)
  if [SACC] not in ["","-"] {
    mutate {
      replace => {
        "principal.user.userid" => "%{SACC}"
        "has_principal_user" => "true"
      }
      on_error => "SACC_is_not_present"
    }
  }

  # Version
  if [AVER] != "" {
    mutate {
      replace => {
        "metadata.product_version" => "%{AVER}"
      }
      on_error => "AVER_empty"
    }
  }

  if [RULE] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{RULE}"
      }
      on_error => "RULE_empty"
    }
  }

  if [RSLT] == "SUCS" {
    mutate {
      replace => {
        "security_result_action" => "ALLOW"
      }
    }
  }

  if [security_result_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
      on_error => "security_result_action_empty"
    }
  }


  if [LOCS] != "" {
    mutate {
      replace => {
        "LOCS_label.value.string_value" => "%{LOCS}"
      }
      on_error => "LOCS_empty"
    }
    if ![LOCS_empty] {
      mutate {
        replace => {
          "LOCS_label.key" => "Locations"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "LOCS_label"
        }
        on_error => "LOCS_label_empty"
      }
    }
  }

  if [STAT] != "" {
    mutate {
      replace => {
        "STAT_label.value.string_value" => "%{STAT}"
      }
      on_error => "STAT_empty"
    }
    if ![STAT_empty] {
      mutate {
        replace => {
          "STAT_label.key" => "STAT"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "STAT_label"
        }
        on_error => "STAT_label_empty"
      }
    }
  }

  # Trusted Load Balancer IP Address
  if [TLIP] != "" {
    mutate {
      replace => {
        "TLIP_label.value.string_value" => "%{TLIP}"
      }
      on_error => "TLIP_empty"
    }
    if ![TLIP_empty] {
      mutate {
        replace => {
          "TLIP_label.key" => "Trusted Load Balancer IP Address"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "TLIP_label"
        }
        on_error => "TLIP_label_empty"
      }
    }
  }

  # Result
  if [RSLT] != "" {
    mutate {
      replace => {
        "RSLT_label.value.string_value" => "%{RSLT}"
      }
      on_error => "RSLT_empty"
    }
    if ![RSLT_empty] {
      mutate {
        replace => {
          "RSLT_label.key" => "Result"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "RSLT_label"
        }
        on_error => "RSLT_label_empty"
      }
    }
  }

  # Time
  if [TIME] != "" {
    mutate {
      replace => {
        "TIME_label.value.string_value" => "%{TIME}"
      }
      on_error => "TIME_empty"
    }
    if ![TIME_empty] {
      mutate {
        replace => {
          "TIME_label.key" => "Time"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "TIME_label"
        }
        on_error => "TIME_label_empty"
      }
    }
  }

  # Last Modified Time
  if [MTME] != "" {
    mutate {
      replace => {
        "MTME_label.value.string_value" => "%{MTME}"
      }
      on_error => "MTME_empty"
    }
    if ![MTME_empty] {
      mutate {
        replace => {
          "MTME_label.key" => "Last Modified Time"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "MTME_label"
        }
        on_error => "MTME_label_empty"
      }
    }
  }

  # S3 tenant account ID (request sender)
  if [S3AI] != "" {
    mutate {
      replace => {
        "S3AI_label.value" => "%{S3AI}"
      }
      on_error => "S3AI_invalid"
    }
    if ![S3AI_invalid] {
      mutate {
        replace => {
          "S3AI_label.key" => "S3 tenant account ID (request sender)"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "S3AI_label"
        }
        on_error => "S3AI_label_merge_failed"
      }
    }
  }

  # S3 tenant account name (bucket owner)
  if [SBAC] != "" {
    mutate {
      replace => {
        "SBAC_label.value" => "%{SBAC}"
      }
      on_error => "SBAC_invalid"
    }
    if ![SBAC_invalid] {
      mutate {
        replace => {
          "SBAC_label.key" => "S3 tenant account name (bucket owner)"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "SBAC_label"
        }
        on_error => "SBAC_label_merge_failed"
      }
    }
  }

  # Content Size
  if [CSIZ] != "" {
    mutate {
      replace => {
        "CSIZ_label.value.string_value" => "%{CSIZ}"
      }
      on_error => "CSIZ_empty"
    }
    if ![CSIZ_empty] {
      mutate {
        replace => {
          "CSIZ_label.key" => "Content Size"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "CSIZ_label"
        }
        on_error => "CSIZ_label_empty"
      }
    }
  }

  # S3 User URN (request sender)
  if [SUSR] != "" {
    mutate {
      replace => {
        "SUSR_label.value.string_value" => "%{SUSR}"
      }
      on_error => "SUSR_empty"
    }
    if ![SUSR_empty] {
      mutate {
        replace => {
          "SUSR_label.key" => "S3 User URN (request sender)"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "SUSR_label"
        }
        on_error => "SUSR_label_empty"
      }
    }
  }

  # Connection Identifier
  if [CNID] != "" {
    mutate {
      replace => {
        "CNID_label.value.string_value" => "%{CNID}"
      }
      on_error => "CNID_empty"
    }
    if ![CNID_empty] {
      mutate {
        replace => {
          "CNID_label.key" => "Connection Identifier"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "CNID_label"
        }
        on_error => "CNID_label_empty"
      }
    }
  }

  # Content Block Identifier
  if [CBID] != "" {
    mutate {
      replace => {
        "CBID_label.value.string_value" => "%{CBID}"
      }
      on_error => "CBID_empty"
    }
    if ![CBID_empty] {
      mutate {
        replace => {
          "CBID_label.key" => "Content Block Identifier"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "CBID_label"
        }
        on_error => "CBID_label_empty"
      }
    }
  }

  # S3 Access Key ID (request sender)
  if [S3AK] != "" {
    mutate {
      replace => {
        "S3AK_label.value" => "%{S3AK}"
      }
      on_error => "S3AK_invalid"
    }
    if ![S3AK_invalid] {
      mutate {
        replace => {
          "S3AK_label.key" => "S3 Access Key ID (request sender)"
        }
      }
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "S3AK_label"
        }
        on_error => "S3AK_label_merge_failed"
      }
    }
  }

  # Module ID
  if [AMID] != "" {
    mutate {
      replace => {
        "AMID_label.value.string_value" => "%{AMID}"
      }
      on_error => "AMID_empty"
    }
    if ![AMID_empty] {
      mutate {
        replace => {
          "AMID_label.key" => "Module ID"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "AMID_label"
        }
        on_error => "AMID_label_empty"
      }
    }
  }

  # Universally Unique Identifier
  if [UUID] != "" {
    mutate {
      replace => {
        "UUID_label.value.string_value" => "%{UUID}"
      }
      on_error => "UUID_empty"
    }
    if ![UUID_empty] {
      mutate {
        replace => {
          "UUID_label.key" => "Universally Unique Identifier"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "UUID_label"
        }
        on_error => "UUID_label_empty"
      }
    }
  }

  # S3 Bucket
  if [S3BK] != "" {
    mutate {
      replace => {
        "S3BK_label.value.string_value" => "%{S3BK}"
      }
      on_error => "S3BK_empty"
    }
    if ![S3BK_empty] {
      mutate {
        replace => {
          "S3BK_label.key" => "S3 Bucket"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "S3BK_label"
        }
        on_error => "S3BK_label_empty"
      }
    }
  }

  # S3 Key
  if [S3KY] != "" {
    mutate {
      replace => {
        "S3KY_label.value.string_value" => "%{S3KY}"
      }
      on_error => "S3KY_empty"
    }
    if ![S3KY_empty] {
      mutate {
        replace => {
          "S3KY_label.key" => "S3 Key"
        }
      }
      mutate {
        merge => {
          "additional.fields" => "S3KY_label"
        }
        on_error => "S3KY_label_empty"
      }
    }
  }

  if [has_principal] == "true" and [has_principal_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }

  # Generate output
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
