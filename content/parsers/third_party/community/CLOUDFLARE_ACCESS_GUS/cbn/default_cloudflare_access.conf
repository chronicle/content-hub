# Product: Cloudflare Access
# Category: WAF
# Supported Format: JSON
# Last Updated: 2026-10-21
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "Action" => ""
      "Allowed" => ""
      "AppDomain" => ""
      "AppUUID" => ""
      "Connection" => ""
      "Country" => ""
      "CreatedAt" => ""
      "Email" => ""
      "IPAddress" => ""
      "RayID" => ""
      "UserUID" => ""
      "TemporaryAccessDuration" => ""
      "_action" => ""
      "_connection_label" => ""
      "security_result" => ""
      "event" => ""
      "has_principal" => "false"
      "has_principal_user" => "false"
      "has_target_resource" => "false"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_error"
  }
  if [Action] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{Action}"
      }
      on_error => "action_details_failed"
    }
  }
  mutate {
    convert => {
      "Allowed" => "string"
    }
    on_error => "allowed_string_convert_failed"
  }
  if [Allowed] == "true" {
    mutate {
      replace => {
        "_action" => "ALLOW"
      }
      on_error => "allowed_action_failed"
    }
  } else {
    mutate {
      replace => {
        "_action" => "BLOCK"
      }
      on_error => "blocked_action_failed"
    }
  }
  if [_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "_action"
      }
      on_error => "merge_action_failed"
    }
  }
  if [AppDomain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{AppDomain}"
      }
      on_error => "app_domain_failed"
    }
  }
  if [AppUUID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" =>
          "%{AppUUID}"
        "has_target_resource" => "true"
      }
      on_error => "app_uuid_failed"
    }
  }
  if [Connection] != "" {
    mutate {
      replace => {
        "_connection_label.key" => "Connection"
        "_connection_label.value" => "%{Connection}"
      }
      on_error => "connection_label_replace_failed"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" =>
          "_connection_label"
      }
      on_error => "connection_label_merge_failed"
    }
    if ![connection_label_merge_failed] {
      mutate {
        replace => {
          "has_target_resource" => "true"
        }
        on_error => "has_resource_failed"
      }
    }
  }
  if [Country] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.location.country_or_region" =>
          "%{Country}"
      }
      on_error => "country_failed"
    }
  }
  if [CreatedAt] != "" {
    date {
      match => ["CreatedAt", "ISO8601", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "invalid_created_at"
    }
  }
  if [Email] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.email_addresses" => "Email"
      }
      on_error => "email_merge_failed"
    }
    if ![email_merge_failed] {
      mutate {
        replace => {
          "has_principal_user" => "true"
        }
        on_error => "has_principal_user_failed"
      }
    }
  }
  if [IPAddress] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "IPAddress"
        "event.idm.read_only_udm.principal.asset.ip" => "IPAddress"
      }
      on_error => "principal_asset_ip_failed"
    }
    if ![principal_asset_ip_failed] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
        on_error => "has_principal_failed"
      }
    }
  }
  if [RayID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{RayID}"
      }
      on_error => "ray_id_failed"
    }
  }
  if [UserUID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id" =>
          "%{UserUID}"
      }
      on_error => "user_uid_failed"
    }
  }
  mutate {
    convert => {
      "TemporaryAccessDuration" => "string"
    }
    on_error => "duration_string_convert_failed"
  }
  if [TemporaryAccessDuration] not in ["", "0"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_duration.seconds" =>
          "%{TemporaryAccessDuration}"
      }
      on_error => "duration_replace_failed"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.session_duration.seconds" => "integer"
      }
      on_error => "duration_convert_failed"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failed"
    }
  }
  if [has_target_resource] == "true" and ([has_principal] == "true" or [has_principal_user] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Cloudflare"
      "event.idm.read_only_udm.metadata.product_name" => "Cloudflare Access"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
