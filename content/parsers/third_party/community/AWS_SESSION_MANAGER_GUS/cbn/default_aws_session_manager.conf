# Product: AWS_SESSION_MANAGER
# Category: AWS Specific
# Supported Format: SYSLOG/JSON
# Reference: N/A
# Last Updated: 2025-04-30
# Copyright 2023 Chronicle LLC

filter {

  mutate {
    replace => {
      "ts" => ""
      "desc" => ""
      "src_ip" => ""
      "severity" => ""
      "sr" => ""
      "src_port" => ""
      "dest_ip" => ""
      "dst_port" => ""
      "month" => ""
      "month_date" => ""
      "time_stamp" => ""
      "proto" => ""
      "command" => ""
      "process_id" => ""
      "user_id" => ""
      "eventVersion" => ""
      "awsRegion" => ""
      "target.id" => ""
      "userIdentity.arn" => ""
      "runAsUser" => ""
      "sessionId" => ""
      "sessionData" => ""
      "has_user"=> "false"
      "has_principal" => "false"
      "has_target" => "false"

    }
  }
  if [message] !~ "^{" {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:ts} ip-%{DATA:src_ip} %{NOTSPACE}\\[\\d+\\]:( (?P<severity>ERROR):)? %{GREEDYDATA:desc}",
          "%{DATA:user_id}\\s+%{INT:process_id}\\s+%{INT}\\s+%{INT}\\s+%{WORD:month}%{INT:month_date}\\s+%{DATA}\\s+%{DATA:time_stamp}\\s+%{GREEDYDATA:command}"
          "\\s+--%{GREEDYDATA:desc}\\|",
          "%{DATA:user_id}\\s+%{INT:process_id}\\s+%{INT}\\s+%{INT}\\s+%{DATA}\\s+%{DATA}\\s+%{DATA}\\s+%{GREEDYDATA:command}"
        ]
      }
      overwrite => ["src_ip" , "severity", "ts", "desc", "src_port", "dest_ip", "dst_port", "time_stamp", "month", "month_date", "proto","command","process_id","user_id"]
      on_error => "no_match"
    }
    if [no_match] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
  else  {
    json{
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
  if [eventVersion] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{eventVersion}"
      }
      on_error => "no_eventVersion"
    }
  }
  if [awsRegion] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.cloud.availability_zone" => "%{awsRegion}"
      }
      on_error => "no_awsRegion"
    }
  }
  if [target][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{target.id}"
        "event.idm.read_only_udm.target.resource.type" => "instance"
      }
      on_error => "no_target_id"
    }
  }
  if [userIdentity][arn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.product_object_id" => "%{userIdentity.arn}"
        "has_user"=> "true"
      }
      on_error => "no_user_identity_arn"
    }
  }
  if [runAsUser] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{runAsUser}"
        "has_user"=> "true"
      }
      on_error => "no_runasusers"
    }
  }
  if [sessionId] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{sessionId}"
      }
      on_error => "no_session_id"
    }
  }
  for index,data in sessionData {
    mutate {
      replace => {
        "session_data_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "no_index"
    }
    mutate {
      replace => {
        "session_data_label.key" => "%{index} Session Data"
        "session_data_label.value" => "%{data}"
      }
      on_error => "no_session_data"
    }
    if ![no_session_data] {
      mutate {
        merge => {
          "sr.detection_fields" => "session_data_label"
        }
        on_error => "no_session_data_merge"
      }
    }
  }

  if [month] != "" and [month_date] != "" and [time_stamp] != "" {
    mutate {
      replace => {
        "ts" => "%{month} %{month_date} %{time_stamp}"
      }
      on_error => "date_fail"
    }
  }

  if [ts] != "" {
    date {
      match => ["ts", "MMM d HH:mm:ss","MMM  d HH:mm:ss"]
      rebase => true
      on_error => "match_fail"
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Amazon"
      "event.idm.read_only_udm.metadata.product_name" => "AWS Session Manager"
    }
  }

  if [desc] != "" {
     mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{desc}"
      }
      on_error => "no_desc"
    }
  }

  if [src_ip] not in ["","0.0.0.0"] {
    mutate {
      gsub => ["src_ip", "-", "\."]
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
      on_error => "no_src_ip"
    }
    if ![no_src_ip] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [src_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{src_port}"
      }
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "no_src_port"
    }
  }

  if [dest_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dest_ip"
      }
      on_error => "no_dest_ip"
    }
    if ![no_dest_ip] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [dst_port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{dst_port}"
      }
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "no_dst_port"
    }
  }

  if [severity] != "" {
    mutate {
      replace => {
        "sr.severity" => "%{severity}"
      }
      on_error => "no_severity"
    }
  }

  if [sr] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sr"
      }
      on_error => "no_sr"
    }
  }
  if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{process_id}"
      }
      on_error => "no_process_id"
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_id}"
        "has_user"=> "true"
      }
      on_error => "no_user_id"
    }
  }
  if [command] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.command_line" => "%{command}"
      }
      on_error => "no_command"
    }
  }

  if [proto] != "" {
    if [proto] =~ "tcp" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "TCP"
        }
        on_error => "no_proto"
      }
    }
  }
  if [has_principal] == "true"  and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_user]== "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true"  and [has_target] == "false" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
