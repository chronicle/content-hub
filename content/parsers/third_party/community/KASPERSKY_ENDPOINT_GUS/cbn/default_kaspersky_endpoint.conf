# Product: KASPERSKY_ENDPOINT
# Category:Security
# Supported Format: SYSLOG
# Last Updated:2025-09-18
# Copyright 2025 Google SecOps
filter {
  mutate {
    replace => {
      "Description" => ""
      "Reason" => ""
      "initialNumber" => ""
      "capturedNumber" => ""
      "timestamp" => ""
      "Port" => ""
      "ipAddress" => ""
      "ProductEventType" => ""
      "eventDetails" => ""
      "eventID" => ""
      "gn" => ""
      "kv_data1" => ""
      "eventDescription" => ""
      "Name" => ""
      "Applicationpath" => ""
      "ProcessID" => ""
      "User" => ""
      "Component" => ""
      "resultDescription" => ""
      "Objecttype" => ""
      "Pathtoobject" => ""
      "Objectname" => ""
      "hdn" => ""
      "hip" => ""
      "kscfqdn" => ""
      "has_principal" => "false"
      "has_target_file" => "false"
      "tdn" => ""
      "etdn" => ""
      "et" => ""
      "intermediary_hostname" => ""
      "intermediary" => ""
      "security_result" => ""
      "version" => ""
      "Scan_User" => ""
      "has_user" => ""
      "kv_data2" => ""
      "Eventtype" => ""
      "Resultdescription" => ""
      "DevicetypeBustype" => ""
      "ResultOperation" => ""
      "SSID" => ""
      "Authenticationtype" => ""
      "Encryptiontype" => ""
      "Devicecategory" => ""
      "DeviceID" => ""
      "ResultDecision" => ""
    }
  }
  mutate {
    gsub => ["message" , "\\\\r\\\\n" , "#",]
  }
  mutate {
    gsub => ["message" , "□" , "",]
  }
  grok {
    match => {
      "message" => [
        "<%{INT:initialNumber}>%{INT:capturedNumber}\\s+%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:intermediary_hostname}\\s+%{DATA:Port}\\|%{DATA:version}\\s+-\\s+%{DATA:ProductEventType}\\s+\\[%{DATA:eventDetails}\\s+%{DATA:kv_data1}\\]\\s+(?P<kv_data2>Event type:.*)",
        "<%{INT:initialNumber}>%{INT:capturedNumber}\\s+%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA:intermediary_hostname}\\s+%{DATA:Port}\\|%{DATA:version}\\s+-\\s+%{DATA:ProductEventType}\\s+\\[%{DATA:eventDetails}\\s+%{DATA:kv_data1}\\]\\s+%{GREEDYDATA:Description}"
      ]
    }
    overwrite => ["intermediary_hostname", "initialNumber", "capturedNumber" , "timestamp", "Port", "version", "ProductEventType", "eventDetails", "kv_data1", "eventDescription", "FileName", "applicationPath", "processID", "User", "resultDescription", "objectType", "pathToObject", "objectName", "Reason","Description", "kv_data2"]
    on_error => "grok_failure"
  }
  mutate {
    gsub => [
      "kv_data1" , "\\\s+(\\S+)=" , "#$1="
    ]
  }
  kv {
    source => "kv_data1"
    field_split => "#"
    value_split => "="
    value_on_error => ""
    value_if_not_found => ""
    trim_value => '\\\"'
    on_error => "kv_failure"
  }

  if [kv_data2] != "" {
    mutate {
      gsub => ["kv_data2" , "/", ""]
    }
    mutate {
      gsub => [ "kv_data2" , "#(\\\w+?) (\\\w+?): ", "#$1$2:"]
    }
    mutate {
      gsub => [ "kv_data2" , "#(\\\w+?) (\\\w+?) (\\\w+?): ", "#$1$2$3:"]
    }
    mutate {
      gsub => ["kv_data2" , "#(\\\w+?)\\\\(\\\w+?):", "#$1$2:"]
    }
    mutate {
      gsub => [ "kv_data2" , "(\\\w+?) (\\\w+?): ", "$1$2:"]
    }
    mutate {
      gsub => [ "kv_data2" , ": ", ":"]
    }
    kv {
      source => "kv_data2"
      field_split => "#"
      value_split => ":"
      on_error => "kv_failure"
    }
  }
  if [Eventtype] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{Eventtype}"
      }
      on_error => "no_event_type_name"
    }
  }
  else if [ProductEventType] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{ProductEventType}"
      }
      on_error => "no_product_event_type_name"
    }
  }
  if [Description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{Description}"
      }
      on_error => "no_Description"
    }
  }

  if [Port] != "" {
    mutate {
      convert => {
        "Port" => "string"
      }
      on_error => "no_LocalPortSample_conversion"
    }
    mutate {
      rename => {
        "event.idm.read_only_udm.principal.port"  => "%{Port}"
     }
     on_error => "no_LocalPortSample"
    }
  }
  grok {
    match => {
      "Port" => "%{INT:Port}"
    }
    overwrite => ["Port"]
    on_error => "no_Port_grok"
  }

  if [no_Port_grok] {
    mutate {
      replace => {
        "encryption_type" => "%{Port}"
      }
      on_error => "no_encryption_type"
    }
    if [encryption_type] != "" {
      mutate {
        replace => {
          "encryption_type_label.key" => "Encryptiontype"
          "encryption_type_label.value" => "%{encryption_type}"
        }
        on_error => "no_encryption_type_name"
      }
      if ![no_encryption_type_name] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "encryption_type_label"
          }
          on_error => "encryption_type_label_not_found"
        }
      }
    }
  }
  if [User] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{User}"
      }
      on_error => "no_user"
    }
  }
  if [etdn] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{etdn}"
      }
      on_error => "no_etdn"
    }
  }
  if [eventDescription] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{eventDescription}"
      }
      on_error => "no_eventdescription"
    }
  }
  if [hdn] != "" {
   mutate {
      replace => {
        "event.idm.read_only_udm.target.administrative_domain" => "%{hdn}"
      }
      on_error => "no_hdn"
    }
  }
  if [hip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "hip"
        "event.idm.read_only_udm.principal.asset.ip" => "hip"
      }
      on_error => "no_hip"
    }
    if ![no_hip] {
     mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{version}"
      }
      on_error => "no_version"
    }
  }
  if [Objectname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{Objectname}"
      }
      on_error => "no_object_name"
    }
  }
  if [Pathtoobject] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{Pathtoobject}"
      }
      on_error => "no_path_to_object"
    }
    if ![no_path_to_object] {
      mutate {
        replace => {
          "has_target_file" => "true"
        }
      }
    }
  }
  if [Resultdescription] != "" {
    mutate {
      replace => {
        "is_secresult" => "true"
        "security_result.summary" => "%{Resultdescription}"
        "event_type" => "USER_LOGIN"
      }
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "LDAP", "UNIX", "ISO8601"]
      on_error => "not_in_unix_or_iso_format"
    }
  }
  if [ProcessID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{ProcessID}"
      }
      on_error => "no_process_id"
    }
  }
  if [intermediary_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_hostname}"
      }
      on_error => "no_intermediary_hostname"
    }
  }
  if [Component] != "" {
    mutate {
      replace => {
        "component_label.key" => "Component"
        "component_label.value.string_value" => "%{Component}"
      }
      on_error => "component_not_found"
    }
    if ![component_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "component_label"
        }
        on_error => "component_label_not_found"
      }
    }
  }
  if [Name] != "" {
    mutate {
      replace => {
          "filename_label.key" => "FileName"
          "filename_label.value.string_value" => "%{Name}"
        }
        on_error => "filename_not_found"
      }
      if ![filename_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "filename_label"
          }
          on_error => "filename_label_not_found"
      }
    }
  }
  if [Reason] != "" {
    mutate {
      replace => {
        "reason_label.key" => "Reason"
        "reason_label.value.string_value" => "%{Reason}"
      }
      on_error => "reason_not_found"
    }
    if ![reason_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "reason_label"
        }
        on_error => "reason_label_not_found"
      }
    }
    }
  if [Applicationpath] != "" {
    mutate {
      replace => {
        "applicationpath_label.key" => "applicationPath"
        "applicationpath_label.value.string_value" => "%{Applicationpath}"
      }
      on_error => "applicationpath_not_found"
    }
  if ![applicationpath_not_found] {
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "applicationpath_label"
      }
      on_error => "applicationpath_label_not_found"
      }
    }
  }
  if [capturedNumber] != "" {
    mutate {
      replace => {
        "capturednumber_label.key" => "capturedNumber"
        "capturednumber_label.value.string_value" => "%{capturedNumber}"
      }
      on_error => "capturednumber_not_found"
    }
    if ![capturednumber_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "capturednumber_label"
        }
        on_error => "capturednumber_label_not_found"
    }
   }
  }
   if [et] != "" {
      mutate {
        replace => {
          "et_label.key" => "et"
          "et_label.value.string_value" => "%{et}"
        }
        on_error => "et_not_found"
      }
      if ![et_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "et_label"
          }
          on_error => "et_label_not_found"
        }
      }
  }
  if [etdn] != "" {
    mutate {
      replace => {
        "etdn_label.key" => "etdn"
        "etdn_label.value.string_value" => "%{etdn}"
      }
      on_error => "etdn_not_found"
    }
    if ![etdn_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "etdn_label"
        }
        on_error => "etdn_label_not_found"
     }
    }
  }
  if [eventDetails] != "" {
    mutate {
      replace => {
        "eventdetails_label.key" => "eventDetails"
        "eventdetails_label.value.string_value" => "%{eventDetails}"
      }
      on_error => "eventdetails_not_found"
    }
    if ![eventdetails_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "eventdetails_label"
        }
        on_error => "eventdetails_label_not_found"
      }
    }
  }
  if [eventDescription] != "" {
    mutate {
      replace => {
        "eventdecription_label.key" => "eventDescription"
        "eventdescription_label.value.string_value" => "%{eventDescription}"
      }
      on_error => "eventdescription_not_found"
    }
    if ![eventdescription_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "eventdescription_label"
        }
        on_error => "eventdescription_label_not_found"
      }
    }
  }
  if [gn] != "" {
    mutate {
      replace => {
        "gn_label.key" => "gn"
        "gn_label.value.string_value" => "%{gn}"
      }
      on_error => "gn_not_found"
    }
    if ![gn_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "gn_label"
        }
        on_error => "gn_label_not_found"
      }
    }
  }
  if [initialNumber] != "" {
    mutate {
      replace => {
        "initialnumber_label.key" => "initialNumber"
        "initialnumber_label.value.string_value" => "%{initialNumber}"
      }
      on_error => "initialnumber_not_found"
    }
    if ![initialnumber_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "initialnumber_label"
        }
        on_error => "initialnumber_label_not_found"
      }
    }
  }
  if [kscfqdn] != "" {
    mutate {
      replace => {
        "kscfqdn_label.key" => "kscfqdn"
        "kscfqdn_label.value.string_value" => "%{kscfqdn}"
      }
      on_error => "kscfqdn_not_found"
    }
    if ![kscfqdn_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "kscfqdn_label"
        }
        on_error => "kscfqdn_label_not_found"
      }
    }
  }
  if [Objecttype] != "" {
    mutate {
      replace => {
        "objecttype_label.key" => "objectType"
        "objecttype_label.value.string_value" => "%{Objecttype}"
      }
      on_error => "objecttype_not_found"
    }
    if ![objecttype_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "objecttype_label"
        }
        on_error => "objecttype_label_not_found"
      }
    }
  }
  if [Resultdescription] != "" {
    mutate {
      replace => {
        "resultdescription_label.key" => "resultDescription"
        "resultdescription_label.value.string_value" => "%{Resultdescription}"
      }
      on_error => "resultdescription_not_found"
    }
    if ![resultdescription_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "resultdescription_label"
        }
        on_error => "resultdescription_label_not_found"
      }
    }
  }
  if [tdn] != "" {
    mutate {
      replace => {
        "tdn_label.key" => "tdn"
        "tdn_label.value.string_value" => "%{tdn}"
      }
      on_error => "tdn_not_found"
    }
    if ![tdn_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tdn_label"
        }
        on_error => "tdn_label_not_found"
      }
    }
  }
  if [DevicetypeBustype] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{DevicetypeBustype}"
      }
      on_error => "no_devicetype_bustype_name"
    }
  }
  if [ResultOperation] != "" {
    mutate {
      replace => {
        "result_operation_label.key" => "ResultOperation"
        "result_operation_label.value" => "%{ResultOperation}"
      }
      on_error => "no_result_operation_name"
    }
    if ![no_result_operation_name] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "result_operation_label"
        }
        on_error => "result_operation_label_not_found"
      }
    }
  }
  if [SSID] != "" {
    mutate {
      replace => {
        "ssid_label.key" => "SSID"
        "ssid_label.value" => "%{SSID}"
      }
      on_error => "no_ssid_name"
    }
    if ![no_ssid_name] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "ssid_label"
        }
        on_error => "ssid_label_not_found"
      }
    }
  }
  if [Authenticationtype] != "" {
    mutate {
      replace => {
        "authenticationtype_label.key" => "Authenticationtype"
        "authenticationtype_label.value" => "%{Authenticationtype}"
      }
      on_error => "no_authenticationtype_name"
    }
    if ![no_authenticationtype_name] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "authenticationtype_label"
        }
        on_error => "authenticationtype_label_not_found"
      }
    }
  }
  if [Encryptiontype] != "" {
    mutate {
      replace => {
        "encryptiontype_label.key" => "Encryptiontype"
        "encryptiontype_label.value" => "%{Encryptiontype}"
      }
      on_error => "no_encryptiontype_name"
    }
    if ![no_encryptiontype_name] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "encryptiontype_label"
        }
        on_error => "encryptiontype_label_not_found"
      }
    }
  }
  if [Devicecategory] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.type" => "%{Devicecategory}"
      }
      on_error => "no_devicecategory_name"
    }
  }
  if [DeviceID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{DeviceID}"
      }
      on_error => "no_deviceid_name"
    }
  }
  if [ResultDecision] =~ "ALLOW" {
    mutate {
      replace => {
        "security_result.action" => "ALLOW"
      }
      on_error => "no_result_decision_name_allow"
    }
  }
  else if [ResultDecision] =~ "BLOCK" {
    mutate {
      replace => {
        "security_result.action" => "BLOCK"
      }
      on_error => "no_result_decision_name_block"
    }
  }

  if [ResultDecision] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{ResultDecision}"
      }
      on_error => "no_result_decision_name"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_not_found"
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_not_found"
    }
  }
  if [has_principal] == "true" and [has_target_file] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_FILE"
      }
    }
  }
  else if [has_principal] == "true" and [Description] =~ "(?i)scan" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_HOST"
      }
    }
  }
  else if [has_user] == "true"  {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

