      "evnt.rawEventOriginator" => ""
      "rawEventCategory" => ""
      "evnt.rawEventCategory" => ""
      "evnt.sourceDetails.sourceType" => ""
      "evnt.sourceDetails.sourceSubType" => ""
      "evnt.engine" => ""
      "evnt.name" => ""
