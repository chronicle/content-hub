      "pod_resource_ancestors" => ""
      "container_resource_ancestors" => ""
      "deployment_resource_ancestors" => ""
      "cluster_resource_ancestors" => ""
      "labels.cloudProvider.region" => ""
      "userLoginUid" => ""
      "labels.agent.variant" => ""
      "labels.agent.version" => ""
      "labels.kubernetes.cluster.distribution" => ""
      "labels_cluster_resource_ancestors" => ""
      "timestampRFC3339Nano" => ""
      "count" => ""
      "has_target_file" => "false"
      "directory" => ""
      "labels.host.id" => ""
      "content.fields.ka.user.name" => ""
      "content.fields.ka.target.name" => ""
      "originator" => ""
      "sourceDetails.sourceType" => ""
      "sourceDetails.sourceSubType" => ""
      "engine" => ""
      "content.fields.ka.auth.decision" => ""
      "content.fields.ka.response.code" => ""
      "content.falsePositive" => ""
      "content.matchedOnDefault" => ""
      "labels.kubernetes.configmap.name" => ""
      "content.fields.ka.target.namespace" => ""
      "action_details" => ""
      "content_fields_ka_target_subresource" => ""
      "content_fields_ka_uri_param_command" => ""
      "labels_cloudProvider_name" => ""
      "labels_cloudProvider_organization" => ""
    }
  }

  mutate {
    gsub => ["message", '\\"event\\":{', 'eventdata']
  }
  mutate {
    gsub => ["message","\\\\+n",""]
  }
  mutate {
    gsub => ["message","' '",""]
  }
  mutate {
    gsub => ["message", '\\\\n\\s+', '']
  }
  mutate {
    gsub => ["message", "<NA>", ""]
  }
  mutate {
    gsub => ["message", '\\r\\n', '']
  }
  mutate {
    gsub => ["message", 'proc.ppid.ts', 'proc.ppid_ts']
  }
  mutate {
    gsub => ["message", 'proc.pid.ts', 'proc.pid_ts']
  }
  mutate {
    gsub => ["message", 'param\\[command\\]', 'param_command']
  }
  mutate {
    gsub => ["message", "agent\\.tag\\.topology\\.kubernetes\\.io/", "agent_tag_topology_kubernetes_io_"]
  }
  if [message] =~ "eventdata" {
    mutate {
      gsub => ["message", "eventdata", ""]
    }
    mutate {
      gsub => ["message", '\\"}}', '\"}']
    }
  }
  mutate {
    gsub => ["message","event","evnt"]
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_in_json"
  }

  if ![not_in_json] {
    if [content][entityPayload] != "" {
      json {
        source => "content.entityPayload"
        array_function => "split_columns"
        on_error => "not_in_json"
        target => "content_entityPayload"
      }
    }

    if [filePath] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{filePath}"
        }
        on_error => "filepath_empty"
      }
    }
    if [directory] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{directory}"
          "has_target_file" => "true"
        }
        on_error => "directory_empty"
      }
    }
    if [id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{id}"
        }
        on_error => "id_empty_or_not_present"
      }
    }
    if [reference] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.id" => "%{reference}"
        }
        on_error => "reference_empty"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.metadata.id" => "bytes"
        }
        on_error => "reference_conversion_error"
      }
    }

    if [type] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
        }
        on_error => "type_empty_or_not_present"
      }
    }

    if [name] != "" and [type] != "kubernetes" {
      mutate {
        replace => {
          "security_result.summary" => "%{name}"
        }
        on_error => "name_empty_or_not_present"
      }
    }
    mutate {
      convert => {
        "level" => "string"
      }
      on_error => "level_conversion_failure"
    }
    if [level] =~ "(?i)(notice|info)" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [level] =~ "(?i)(warn)" {
      mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
    else if [level] =~ "(?i)(error)" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else if [level] != "" {
      mutate {
        replace => {
          "security_result.severity" => "UNKNOWN_SEVERITY"
          "security_result.severity_details" => "%{level}"
        }
        on_error => "level_Invalid"
      }
    }

    if [direction] == "in" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.direction" => "INBOUND"
        }
      }
    }
    else if [direction] == "out" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.direction" => "OUTBOUND"
        }
      }
    }

    mutate {
      convert => {
        "l4protocol" => "string"
      }
      on_error => "l4protocol_conversion_error"
    }
    if [l4protocol] == "6" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "TCP"
        }
      }
    }
    else if [l4protocol] == "17" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "UDP"
        }
      }
    }
    else if [l4protocol] == "58" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "ICMP"
        }
      }
    }

    if [source] != "" {
      grok {
        match => {
          "source" => "%{IP}:%{INT}"
        }
        overwrite => ["source"]
        on_error => "source_grok_failure"
      }
      if [source_grok_failure] {
        mutate {
          replace => {
            "security_result.description" => "%{source}"
          }
          on_error => "source_empty"
        }
      }
    }

    if [agentId] != "" {
      mutate {
        convert => {
          "agentId" => "string"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_deployment_id" => "%{agentId}"
        }
        on_error => "agentId_empty_or_not_present"
      }
    }

    date {
      match => ["timestampRFC3339Nano", "ISO8601"]
      on_error => "pattern_not_matched"
    }
    mutate {
      gsub => ["description", "evnt", "event"]
    }
    if [description] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{description}"
        }
        on_error => "description_empty"
      }
    }
    else if [msg] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.description" => "%{msg}"
        }
        on_error => "msg_empty"
      }
    }

    mutate {
      convert => {
        "clientPort" => "string"
      }
      on_error => "clientPort_conversion_failure"
    }

    mutate {
      convert => {
        "port" => "string"
      }
      on_error => "port_conversion_failure"
    }
    if [port] == "" {
      mutate {
        replace => {
          "port" => "%{clientPort}"
        }
        on_error => "clientPort_empty"
      }
    }
    if [port] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{port}"
        }
        on_error => "port_empty"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
        on_error => "invalid_port"
      }
    }

    if [serverIpv4Dot] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "serverIpv4Dot"
          "event.idm.read_only_udm.target.asset.ip" => "serverIpv4Dot"
        }
        on_error => "not_host"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }

    mutate {
      convert => {
        "serverPort" => "string"
      }
      on_error => "serverPort_conversion_failure"
    }

    if [serverPort] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.port" => "%{serverPort}"
        }
        on_error => "serverPort_empty"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
        on_error => "invalid_serverPort"
      }
    }
    if [cwd] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.file.full_path" => "%{cwd}"
        }
        on_error => "cwd_empty"
      }
    }

    if [cmdline] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.process.command_line" => "%{cmdline}"
        }
        on_error => "cmdline_empty"
      }
    }

    if [labels][source][ip] != "" {
      if [labels][source][ip] =~ "(?i)ip" {
        mutate {
          gsub => ["labels.source.ip","-","."]
        }
        grok {
          match => {
            "labels.source.ip" => "%{IP:src_ip}"
          }
          on_error => "not_ip"
        }
        if ![not_ip] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "src_ip"
              "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
            }
            on_error => "not_ip1"
          }
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{labels.source.ip}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{labels.source.ip}"
            "has_principal" => "true"
          }
          on_error => "not_hostname1"
        }
      }
    }

    if [labels][host][hostName] != "" {
      if [labels][host][hostName] =~ "(?i)ip" {
        mutate {
          gsub => ["labels.host.hostName","-","."]
        }
        grok {
          match => {
            "labels.host.hostName" => "%{IP:src_ip}"
          }
          on_error => "not_ip_host"
        }
        if ![not_ip_host] {
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.ip" => "src_ip"
              "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
            }
            on_error => "not_ip2"
          }
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{labels.host.hostName}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{labels.host.hostName}"
            "has_principal" => "true"
          }
          on_error => "not_hostname2"
        }
      }
    }
    else if [labels][kubernetes][node][name] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{labels.kubernetes.node.name}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{labels.kubernetes.node.name}"
          "has_principal" => "true"
        }
        on_error => "not_hostname5"
      }
    }
    if [labels][kubernetes][cluster][distribution] != "" {
      mutate {
        replace => {
          "distribution_label.key" => "kubernetes_cluster_distribution"
          "distribution_label.value" => "%{labels.kubernetes.cluster.distribution}"
        }
        on_error => "kubernetes_cluster_distribution_empty"
      }
      if ![kubernetes_cluster_distribution_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" => "distribution_label"
          }
          on_error => "kubernetes_cluster_distribution_label_empty"
        }
      }
    }

    if [hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
          "has_principal" => "true"
        }
        on_error => "not_hostname3"
      }
    }

    if [machineId] != "" {
      grok {
        match => {
          "machineId" => ["%{MAC:MAC}"]
        }
        overwrite => ["MAC"]
        on_error => "not_mac"
      }
      if ![not_mac] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.mac" => "MAC"
          }
          on_error => "not_mac1"
        }
      }
    }
    if [labels][host][mac] != "" {
      grok {
        match => {
          "labels.host.mac" => ["%{MAC:MAC}"]
        }
        overwrite => ["MAC"]
        on_error => "not_mac_labels"
      }
      if ![not_mac_labels] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.mac" => "MAC"
          }
          on_error => "not_mac2"
        }
      }
    }

    if [labels][host][id] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset.asset_id" => "Asset_id:%{labels.host.id}"
        }
        on_error => "labels_host_id_empty"
      }
    }

    if [host] != "" {
      grok {
        match => {
          "host" => ["%{IP:host}"]
        }
        overwrite => ["host"]
        on_error => "ip_failure"
      }
      if ![ip_failure] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "host"
            "event.idm.read_only_udm.principal.asset.ip" => "host"
          }
          on_error => "not_host_found"
        }
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
      else if [host] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{host}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
            "has_principal" => "true"
          }
          on_error => "not_hostname4"
        }
      }
    }

    if [user][username] =~ "^.+@.+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "user.username"
        }
        on_error => "not_email"
      }
    }

    if [clientIpv4Dot] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "clientIpv4Dot"
          "event.idm.read_only_udm.principal.asset.ip" => "clientIpv4Dot"
        }
        on_error => "not_host_present"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }

    mutate {
      convert => {
        "uid" => "string"
      }
      on_error => "uid_conversion_failure"
    }
    mutate {
      convert => {
        "tty" => "string"
      }
      on_error => "tty_conversion_failure"
    }
    if [tty] != "" {
      mutate {
        replace => {
          "tty_value_label.key" => "tty_value"
          "tty_value_label.value.string_value" => "%{tty}"
        }
        on_error => "no_tty_found"
      }
      if ![no_tty_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "tty_value_label"
          }
          on_error => "no_tty_label"
        }
      }
    }
    if [timestampRFC3339Nano] != "" {
      mutate {
        replace => {
          "timestamp_label.key"  => "timestamp RFC3339 Nano"
          "timestamp_label.value.string_value" => "%{timestampRFC3339Nano}"
        }
        on_error => "timestamp_label_empty"
      }
      if ![timestamp_label_empty] {
