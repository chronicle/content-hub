  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    grok {
      match => {
        "message" => ["<%{DATA:syslog_priority}>%{NUMBER:syslog_number}\\s+%{TIMESTAMP_ISO8601:time} %{HOSTNAME:inter_host}\\s+-\\s+-\\s+-\\s+\\|\\|%{GREEDYDATA:kv_data}"]
      }
      overwrite => ["syslog_priority", "syslog_number", "inter_host", "kv_data", "time"]
      on_error => "not_grok"
    }
    if [not_grok] {
      drop { tag => "TAG_MALFORMED_ENCODING" }
    }
  }
  kv {
    source => "kv_data"
    field_split => "||"
    value_split => "="
    on_error => "kv_data_error"
  }
  if [inter_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_host}"
      }
      on_error => "inter_host_replace_failed"
    }
  }
  if [alert_detail] != "" {
    json {
      source => "alert_detail"
      target => "parsed_alert_detail"
      on_error => "alert_detail_json_error"
    }
    if [alert_detail_json_error] {
      mutate {
        merge => {
          "parsed_alert_detail" => "alert_detail"
        }
        on_error => "alert_detail_merge_failed"
      }
    }
    mutate {
      replace => {
        "alert_name_code" => "%{parsed_alert_detail.alert_name_code}"
      }
      on_error => "alert_name_code_replace_failed"
    }
    if [alert_name_code] != "" {
      mutate {
        replace => {
          "sec_result.rule_name" => "%{alert_name_code}"
        }
        on_error => "sec_result_rule_name_from_alert_name_code_replace_failed"
      }
    }
    mutate {
      replace => {
        "alert_title_en" => "%{parsed_alert_detail.alert_title_en}"
      }
      on_error => "alert_title_en_replace_failed"
    }
    mutate {
      replace => {
        "alert_title" => "%{parsed_alert_detail.alert_title}"
      }
      on_error => "alert_title_replace_failed"
    }
    mutate {
      replace => {
        "main_user_id" => "%{parsed_alert_detail.main_user_id}"
      }
      on_error => "main_user_id_replace_failed"
    }
    if [main_user_id] != "" {
      mutate {
        replace => {
          "main_user_id_label.value" => "%{main_user_id}"
          "main_user_id_label.key" => "main_user_id"
        }
        on_error => "main_user_id_label_replace_failed"
      }
      if ![main_user_id_label_replace_failed] {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "main_user_id_label"
          }
          on_error => "main_user_id_label_merge_failed"
        }
      }
    }
    mutate {
      replace => {
        "alert_src_prod_module" => "%{parsed_alert_detail.alert_src_prod_module}"
      }
      on_error => "parsed_alert_detail_alert_src_prod_module_replace_failed"
    }
    mutate {
      replace => {
        "alert_src_prod" => "%{parsed_alert_detail.alert_src_prod}"
      }
      on_error => "parsed_alert_detail_alert_src_prod_replace_failed"
    }
    mutate {
      replace => {
        "log_name" => "%{parsed_alert_detail.log_name}"
      }
      on_error => "parsed_alert_detail_log_name_replace_failed"
    }
    mutate {
      replace => {
        "relate_alert" => "%{parsed_alert_detail.relate_alert}"
      }
      on_error => "parsed_alert_detail_relate_alert_replace_failed"
    }
    mutate {
      replace => {
        "bypass_id" => "%{parsed_alert_detail.bypass_id}"
      }
      on_error => "parsed_alert_detail_bypass_id_replace_failed"
    }
    mutate {
      replace => {
        "occur_time" => "%{parsed_alert_detail.occur_time}"
      }
      on_error => "parsed_alert_detail_occur_time_replace_failed"
    }
    mutate {
      replace => {
        "sub_user_id" => "%{parsed_alert_detail.sub_user_id}"
      }
      on_error => "parsed_alert_detail_sub_user_id_replace_failed"
    }
    mutate {
      replace => {
        "is_defend" => "%{parsed_alert_detail.is_defend}"
      }
      on_error => "parsed_alert_detail_is_defend_replace_failed"
    }
    mutate {
      replace => {
        "data_type" => "%{parsed_alert_detail.data_type}"
      }
      on_error => "parsed_alert_detail_data_type_replace_failed"
    }
    mutate {
      replace => {
        "template_id" => "%{parsed_alert_detail.template_id}"
      }
      on_error => "parsed_alert_detail_template_id_replace_failed"
    }
    mutate {
      replace => {
        "alert_type_code" => "%{parsed_alert_detail.alert_type_code}"
      }
      on_error => "parsed_alert_detail_alert_type_code_replace_failed"
    }
    mutate {
      replace => {
        "is_incident" => "%{parsed_alert_detail.is_incident}"
      }
      on_error => "parsed_alert_detail_is_incident_replace_failed"
    }
    if [is_incident] == "" {
      mutate {
        replace => {
          "is_incident" => "%{parsed_alert_detail.is_inicident}"
        }
        on_error => "parsed_alert_detail_is_inicident_replace_failed"
      }
    }
    mutate {
      replace => {
        "version" => "%{parsed_alert_detail.version}"
      }
      on_error => "parsed_alert_detail_version_replace_failed"
    }
    mutate {
      replace => {
        "parsed_alert_detail_asset_list" => "%{parsed_alert_detail.asset_list}"
      }
      on_error => "parsed_alert_detail_asset_list_replace_failed"
    }
    if [parsed_alert_detail_asset_list] != "" and [parsed_alert_detail_asset_list] != "[]" {
      mutate {
        replace => {
          "asset_list_obj" => "{\"items\": %{parsed_alert_detail.asset_list}}"
        }
        on_error => "asset_list_obj_error"
      }
      if ![asset_list_obj_error] and [asset_list_obj] != "" {
        json {
          source => "asset_list_obj"
          target => "asset_list_parsed"
          array_function => "split_columns"
          on_error => "asset_list_json_error"
        }
        if ![asset_list_json_error] {
          for index, item in asset_list_parsed.items {
            mutate {
              replace => {
                "is_main_asset" => ""
                "dns_record" => ""
                "certificates" => ""
                "whois" => ""
                "root_domain" => ""
                "asset_type" => ""
                "asset_name" => ""
                "asset_id" => ""
                "is_main_asset_label" => ""
                "dns_record_label" => ""
                "certificates_label" => ""
                "whois_label" => ""
                "root_domain_label" => ""
                "asset_type_label" => ""
                "asset_name_label" => ""
                "asset_id_label" => ""
              }
            }
            mutate {
              convert => {
                "index" => "string"
              }
              on_error => "index_convert_failed"
            }
            mutate {
              replace => {
                "is_main_asset" => "%{item.is_main_asset}"
              }
              on_error => "asset_list_is_main_asset_replace_failed"
            }
            if ![asset_list_is_main_asset_replace_failed] and [is_main_asset] not in ["", "N/A"] {
              mutate {
                replace => {
                  "is_main_asset_label.key" => "is_main_asset_%{index}"
                  "is_main_asset_label.value.string_value" => "%{is_main_asset}"
                }
                on_error => "is_main_asset_label_replace_failed"
              }
              if ![is_main_asset_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "is_main_asset_label"
                  }
                  on_error => "is_main_asset_label_merge_failed"
                }
              }
            }
            mutate {
              replace => {
                "dns_record" => "%{item.dns_record}"
              }
              on_error => "asset_list_dns_record_replace_failed"
            }
            if ![asset_list_dns_record_replace_failed] and [dns_record] not in ["", "N/A"] {
              mutate {
                replace => {
                  "dns_record_label.key" => "dns_record_%{index}"
                  "dns_record_label.value.string_value" => "%{dns_record}"
                }
                on_error => "dns_record_label_replace_failed"
              }
              if ![dns_record_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "dns_record_label"
                  }
                  on_error => "dns_record_label_merge_failed"
                }
              }
            }
            mutate {
              replace => {
                "certificates" => "%{item.certificates}"
              }
              on_error => "asset_list_certificates_replace_failed"
            }
            if ![asset_list_certificates_replace_failed] and [certificates] not in ["", "N/A"] {
              mutate {
                replace => {
                  "certificates_label.key" => "certificates_%{index}"
                  "certificates_label.value.string_value" => "%{certificates}"
                }
                on_error => "certificates_label_replace_failed"
              }
              if ![certificates_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "certificates_label"
                  }
                  on_error => "certificates_label_merge_failed"
                }
              }
            }

            mutate {
              replace => {
                "whois" => "%{item.whois}"
              }
              on_error => "asset_list_whois_replace_failed"
            }
            if ![asset_list_whois_replace_failed] and [whois] not in ["", "N/A"] {
              mutate {
                replace => {
                  "whois_label.key" => "whois_%{index}"
                  "whois_label.value.string_value" => "%{whois}"
                }
                on_error => "whois_label_replace_failed"
              }
              if ![whois_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "whois_label"
                  }
                  on_error => "whois_label_merge_failed"
                }
              }
            }

            mutate {
              replace => {
                "root_domain" => "%{item.root_domain}"
              }
              on_error => "asset_list_root_domain_replace_failed"
            }
            if ![asset_list_root_domain_replace_failed] and [root_domain] not in ["", "N/A"] {
              mutate {
                replace => {
                  "root_domain_label.key" => "root_domain_%{index}"
                  "root_domain_label.value.string_value" => "%{root_domain}"
                }
                on_error => "root_domain_label_replace_failed"
              }
              if ![root_domain_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "root_domain_label"
                  }
                  on_error => "root_domain_label_merge_failed"
                }
              }
            }

            mutate {
              replace => {
                "asset_type" => "%{item.asset_type}"
              }
              on_error => "asset_list_asset_type_replace_failed"
            }
            if ![asset_list_asset_type_replace_failed] and [asset_type] not in ["", "N/A"] {
              mutate {
                replace => {
                  "asset_type_label.key" => "asset_type_%{index}"
                  "asset_type_label.value.string_value" => "%{asset_type}"
                }
                on_error => "asset_type_label_replace_failed"
              }
              if ![asset_type_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "asset_type_label"
                  }
                  on_error => "asset_type_label_merge_failed"
                }
              }
            }

            mutate {
              replace => {
                "asset_name" => "%{item.asset_name}"
              }
              on_error => "asset_list_asset_name_replace_failed"
            }
            if ![asset_list_asset_name_replace_failed] and [asset_name] not in ["", "N/A"] {
              mutate {
                replace => {
                  "asset_name_label.key" => "asset_name_%{index}"
                  "asset_name_label.value.string_value" => "%{asset_name}"
                }
                on_error => "asset_name_label_replace_failed"
              }
              if ![asset_name_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "asset_name_label"
                  }
                  on_error => "asset_name_label_merge_failed"
                }
              }
            }

            mutate {
              replace => {
                "asset_id" => "%{item.asset_id}"
              }
              on_error => "asset_list_asset_id_replace_failed"
            }
            if ![asset_list_asset_id_replace_failed] and [asset_id] not in ["", "N/A"] {
              mutate {
                replace => {
                  "asset_id_label.key" => "asset_id_%{index}"
                  "asset_id_label.value.string_value" => "%{asset_id}"
                }
                on_error => "asset_id_label_replace_failed"
              }
              if ![asset_id_label_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "asset_id_label"
                  }
                  on_error => "asset_id_label_merge_failed"
                }
              }
            }
          }
        }
      }
    }
    mutate {
      replace => {
        "parsed_alert_detail_host" => "%{parsed_alert_detail.host}"
      }
      on_error => "parsed_alert_detail_host_error"
    }
    if ![parsed_alert_detail_host_error] and [parsed_alert_detail_host] not in ["", "null"] and [host] == "" {
      mutate {
        replace => {
          "host" => "%{parsed_alert_detail_host}"
        }
        on_error => "parsed_alert_detail_host_replace_failed"
      }
    }
    mutate {
      replace => {
        "parsed_alert_detail_net_connect_dir" => "%{parsed_alert_detail.net_connect_dir}"
      }
      on_error => "parsed_alert_detail_net_connect_dir_error"
    }
    if [net_connect_dir] == "" and [parsed_alert_detail_net_connect_dir] != "" {
      mutate {
        replace => {
          "net_connect_dir" => "%{parsed_alert_detail_net_connect_dir}"
        }
        on_error => "parsed_alert_detail_net_connect_dir_replace_failed"
      }
    }
    if [net_connect_dir] != "" {
      mutate {
        replace => {
          "parsed_alert_detail_net_connect_dir_label.value.string_value" => "%{net_connect_dir}"
          "parsed_alert_detail_net_connect_dir_label.key" => "net_connect_dir"
        }
        on_error => "parsed_alert_detail_net_connect_dir_label_replace_failed"
