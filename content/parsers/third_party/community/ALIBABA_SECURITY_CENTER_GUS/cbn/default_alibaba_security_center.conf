      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "addition_fields_string_value_replace_failed"
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "additional_fields_merge_failed"
        }
      }
    }
  }

  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
      on_error => "udm_security_result_merge_failed"
    }
  }

  if [schema] == "PROCESS_START_ACTIVITY" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "PROCESS_LAUNCH"
      }
    }
  }
  else if [__topic__] == "aegis-log-dns-query" {
    if [domain] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_DNS"
          "event.idm.read_only_udm.network.application_protocol" => "DNS"
        }
      }
    }
  }
  else if [file_path] != "" or [__topic__] == "aegis-log-file-event" {
    if [event_type] =~ "delete" or [event_type] =~ "remove" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_DELETION"
        }
      }
    } else if [event_type] =~ "create" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_CREATION"
        }
      }
    } else if [event_type] =~ "read" or [event_type] =~ "open" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_READ"
        }
      }
    } else if [event_type] =~ "move" or [event_type] =~ "rename" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_MOVE"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "FILE_MODIFICATION"
        }
      }
    }
  }
  else if [registry_key] != "" or [__topic__] == "aegis-log-regedit" {
    if [event_type] =~ "create" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_CREATION"
        }
      }
    } else if [event_type] =~ "delete" or [event_type] =~ "remove" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_DELETION"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "REGISTRY_MODIFICATION"
        }
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    if [request_method] != "" or [request_uri] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
    on_error => "output_merge_failed"
  }
}
