# Product: Genesys Audit
# Category: Audit
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-11-27
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "messageType" => ""
      "owner" => ""
      "logGroup" => ""
      "logStream" => ""
      "source" => ""
      "region" => ""
      "event" => ""
      "addition" => ""
      "security_result" => ""
      "security_result_action" => ""
      "auth_mechanism" => ""
      "sub_filter_f" => ""
      "log_event_message" => ""
      "org_id" => ""
      "audit_id" => ""
      "detail_version" => ""
      "detail_timestamp" => ""
      "event_time" => ""
      "user_id" => ""
      "user_home_org_id" => ""
      "valid_ip" => ""
      "service_name" => ""
      "action" => ""
      "entity_type" => ""
      "entity_id" => ""
      "entity_name" => ""
      "msg_text" => ""
      "msg_code" => ""
      "has_principal" => "false"
      "has_principal_user" => "false"
      "has_target_application" => "false"
      "has_target_user" => "false"
      "has_target_resource" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "outer_json_parse_failed"
  }

  if ![outer_json_parse_failed] {
    if [messageType] == "DATA_MESSAGE" {
      for logevent in logEvents {
        mutate {
          replace => {
            "version" => ""
            "id" => ""
            "detail-type" => ""
            "account" => ""
            "time" => ""
            "detail" => ""
            "source" => ""
            "region" => ""
            "event" => ""
            "addition" => ""
            "security_result" => ""
            "security_result_action" => ""
            "auth_mechanism" => ""
            "sub_filter_f" => ""
            "log_event_message" => ""
            "org_id" => ""
            "audit_id" => ""
            "detail_version" => ""
            "detail_timestamp" => ""
            "event_time" => ""
            "user_id" => ""
            "user_home_org_id" => ""
            "valid_ip" => ""
            "service_name" => ""
            "action" => ""
            "entity_type" => ""
            "entity_id" => ""
            "entity_name" => ""
            "msg_text" => ""
            "msg_code" => ""
            "has_principal" => "false"
            "has_principal_user" => "false"
            "has_target_application" => "false"
            "has_target_user" => "false"
            "has_target_resource" => "false"
          }
        }

        if [logGroup] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.observer.resource.name" => "%{logGroup}"
            }
            on_error => "cw_log_group_set_failed"
          }
        }

        for subfilter in subscriptionFilters {
          mutate {
            replace => {
              "sub_filter_val" => ""
            }
          }
          if [subfilter] != "" {
            mutate {
              replace => {
                "sub_filter_val.string_value" => "%{subfilter}"
              }
              on_error => "cw_sub_filter_val_failed"
            }
            if ![cw_sub_filter_val_failed] {
              mutate {
                merge => {
                  "sub_filter_f.value.list_value.values" => "sub_filter_val"
                }
                on_error => "cw_sub_filter_val_merge_failed"
              }
            }
          }
        }
        if [sub_filter_f] != "" {
          mutate {
            replace => {
              "sub_filter_f.key" => "subscriptionFilters"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "sub_filter_f"
            }
            on_error => "cw_sub_filter_field_merge_failed"
          }
        }

        mutate {
          rename => {
            "logevent.id" => "addition.logEvent_id"
            "logevent.timestamp" => "addition.logEvent_timestamp"
          }
        }

        mutate {
          replace => {
            "addition.messageType" => "%{messageType}"
            "addition.logStream" => "%{logStream}"
            "addition.owner" => "%{owner}"
          }
          on_error => "cw_addition_replace_failed"
        }

        mutate {
          replace => {
            "log_event_message" => "%{logevent.message}"
          }
          on_error => "cw_log_event_message_missing"
        }

        if [log_event_message] != "" {
          json {
            source => "log_event_message"
            array_function => "split_columns"
            on_error => "cw_inner_json_parse_failed"
          }
          if ![cw_inner_json_parse_failed] {
            mutate {
              replace => {
                "audit_id" => "%{detail.eventBody.id}"
              }
              on_error => "cw_audit_id_missing"
            }
          }
        }

        if [audit_id] != "" {
          if [source] != "" {
            grok {
              match => {
                "source" => [
                  "^aws\\.partner/genesys\\.com/cloud/(?P<org_id>[^/]+)/"
                ]
              }
              overwrite => ["org_id"]
              on_error => "cw_org_id_grok_failed"
            }
            if ![cw_org_id_grok_failed] and [org_id] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.metadata.product_deployment_id" => "%{org_id}"
                }
                on_error => "cw_org_id_set_failed"
              }
            }
          }

          if [region] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.observer.location.name" => "%{region}"
              }
              on_error => "cw_region_set_failed"
            }
          }

          mutate {
            replace => {
              "detail_version" => "%{detail.version}"
            }
            on_error => "cw_detail_version_missing"
          }
          if [detail_version] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.product_version" => "%{detail_version}"
              }
              on_error => "cw_detail_version_set_failed"
            }
          }

          mutate {
            replace => {
              "detail_timestamp" => "%{detail.timestamp}"
            }
            on_error => "cw_detail_timestamp_missing"
          }
          if [detail_timestamp] != "" {
            date {
              match => ["detail_timestamp", "ISO8601", "RFC3339"]
              target => "event.idm.read_only_udm.metadata.collected_timestamp"
              on_error => "cw_detail_ts_collected_date_failed"
            }
          }

          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.product_log_id" => "%{audit_id}"
            }
            on_error => "cw_audit_id_set_failed"
          }

          mutate {
            replace => {
              "event_time" => "%{detail.eventBody.eventTime}"
            }
            on_error => "cw_event_time_missing"
          }
          if [event_time] != "" {
            date {
              match => ["event_time", "ISO8601", "RFC3339"]
              target => "event.idm.read_only_udm.metadata.event_timestamp"
              on_error => "cw_event_ts_date_failed"
            }
          }

          mutate {
            replace => {
              "action" => "%{detail.eventBody.action}"
            }
            on_error => "cw_action_missing"
          }
          if [action] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.product_event_type" => "%{action}"
              }
              on_error => "cw_product_event_type_set_failed"
            }
          }

          mutate {
            replace => {
              "user_id" => "%{detail.eventBody.userId}"
            }
            on_error => "cw_user_id_missing"
          }
          if [user_id] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.principal.user.userid" => "%{user_id}"
                "has_principal_user" => "true"
              }
              on_error => "cw_principal_user_id_set_failed"
            }
          }

          mutate {
            replace => {
              "user_home_org_id" => "%{detail.eventBody.userHomeOrgId}"
            }
            on_error => "cw_user_home_org_id_missing"
          }
          if [user_home_org_id] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.principal.administrative_domain" => "%{user_home_org_id}"
              }
              on_error => "cw_principal_home_org_set_failed"
            }
          }

          for ip in detail.eventBody.remoteIp {
            mutate {
              replace => {
                "valid_ip" => ""
              }
            }
            if [ip] != "" {
              grok {
                match => {
                  "ip" => [
                    "^%{IP:valid_ip}$"
                  ]
                }
                overwrite => ["valid_ip"]
                on_error => "cw_principal_ip_grok_failed"
              }
              if ![cw_principal_ip_grok_failed] and [valid_ip] != "" {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.principal.ip" => "valid_ip"
                    "event.idm.read_only_udm.principal.asset.ip" => "valid_ip"
                  }
                  on_error => "cw_principal_ip_merge_failed"
                }
                if ![cw_principal_ip_merge_failed] {
                  mutate {
                    replace => {
                      "has_principal" => "true"
                    }
                  }
                }
              }
            }
          }

          mutate {
            replace => {
              "service_name" => "%{detail.eventBody.serviceName}"
            }
            on_error => "cw_service_name_missing"
          }
          if [service_name] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.application" => "%{service_name}"
                "has_target_application" => "true"
              }
              on_error => "cw_service_name_set_failed"
            }
          }

          mutate {
            replace => {
              "entity_type" => "%{detail.eventBody.entityType}"
            }
            on_error => "cw_entity_type_missing"
          }
          mutate {
            replace => {
              "entity_id" => "%{detail.eventBody.entity.id}"
            }
            on_error => "cw_entity_id_missing"
          }
          mutate {
            replace => {
              "entity_name" => "%{detail.eventBody.entity.name}"
            }
            on_error => "cw_entity_name_missing"
          }
          if [entity_type] in ["User", "AuthUser"] {
            mutate {
              rename => {
                "detail.eventBody.entityType" => "addition.entityType"
              }
            }
            if [entity_id] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.user.userid" => "%{entity_id}"
                  "has_target_user" => "true"
                }
                on_error => "cw_target_user_id_set_failed"
              }
            }
            if [entity_name] != "" and [entity_name] =~ "^[^@ ]+@[^@ ]+[.][^@ ]+$" {
              mutate {
                merge => {
                  "event.idm.read_only_udm.target.user.email_addresses" => "entity_name"
                }
                on_error => "cw_target_user_email_merge_failed"
              }
              if ![cw_target_user_email_merge_failed] {
                mutate {
                  replace => {
                    "has_target_user" => "true"
                  }
                }
              }
            }
          }
          else {
            if [entity_type] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.resource.resource_subtype" => "%{entity_type}"
                  "has_target_resource" => "true"
                }
                on_error => "cw_entity_type_set_failed"
              }
            }
            if [entity_id] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.resource.product_object_id" => "%{entity_id}"
                  "has_target_resource" => "true"
                }
                on_error => "cw_entity_id_set_failed"
              }
            }
            if [entity_name] != "" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.resource.name" => "%{entity_name}"
                  "has_target_resource" => "true"
                }
                on_error => "cw_entity_name_set_failed"
              }
              if [entity_name] =~ "^s3://" {
                mutate {
                  replace => {
                    "event.idm.read_only_udm.target.resource.resource_type" => "STORAGE_OBJECT"
                    "event.idm.read_only_udm.target.resource.attribute.cloud.environment" => "AMAZON_WEB_SERVICES"
                  }
                }
              }
            }
          }

          mutate {
            replace => {
              "msg_text" => "%{detail.eventBody.message.message}"
            }
            on_error => "cw_msg_text_missing"
          }
          if [msg_text] != "" {
            mutate {
              replace => {
                "security_result.description" => "%{msg_text}"
              }
              on_error => "cw_security_result_description_set_failed"
            }
          }

          mutate {
            replace => {
              "msg_code" => "%{detail.eventBody.message.localizableMessageCode}"
            }
            on_error => "cw_msg_code_missing"
          }
          if [msg_code] != "" {
            mutate {
              replace => {
                "security_result.summary" => "%{msg_code}"
              }
              on_error => "cw_security_result_summary_set_failed"
            }
          }

          if [action] =~ "(?i)^AuthenticationFailed$" {
            mutate {
              replace => {
                "security_result_action" => "BLOCK"
              }
            }
            mutate {
              merge => {
                "security_result.action" => "security_result_action"
              }
              on_error => "cw_security_result_action_block_merge_failed"
            }
          }
          else if [msg_code] =~ "(?i)SUCCESS" {
            mutate {
              replace => {
                "security_result_action" => "ALLOW"
              }
            }
            mutate {
              merge => {
                "security_result.action" => "security_result_action"
              }
              on_error => "cw_security_result_action_allow_merge_failed"
            }
          }

          if [security_result] != "" {
            mutate {
              merge => {
                "event.idm.read_only_udm.security_result" => "security_result"
              }
              on_error => "cw_security_result_merge_failed"
            }
          }

          for key, value in detail.eventBody.context map {
            mutate {
              replace => {
                "ctx_lbl" => ""
              }
            }
            mutate {
              convert => {
                "value" => "string"
              }
              on_error => "cw_ctx_value_convert_failed"
            }
            if [key] != "" and [value] != "" {
              if [key] == "loginMethod" and [value] =~ "(?i)^password$" {
                mutate {
                  replace => {
                    "auth_mechanism" => "USERNAME_PASSWORD"
                  }
                }
                mutate {
                  merge => {
                    "event.idm.read_only_udm.extensions.auth.mechanism" => "auth_mechanism"
                  }
                  on_error => "cw_auth_mechanism_merge_failed"
                }
              }
              else {
                mutate {
                  replace => {
                    "ctx_lbl.key" => "%{key}"
                    "ctx_lbl.value" => "%{value}"
                  }
                  on_error => "cw_ctx_lbl_field_failed"
                }
                if ![cw_ctx_lbl_field_failed] {
                  if [entity_type] in ["User", "AuthUser"] {
                    mutate {
                      merge => {
                        "event.idm.read_only_udm.target.user.attribute.labels" => "ctx_lbl"
                      }
                      on_error => "cw_ctx_user_lbl_merge_failed"
                    }
                  }
                  else {
                    mutate {
                      merge => {
                        "event.idm.read_only_udm.target.resource.attribute.labels" => "ctx_lbl"
                      }
                      on_error => "cw_ctx_lbl_merge_failed"
                    }
                  }
                }
              }
            }
          }

          for propchange in detail.eventBody.propertyChanges {
            mutate {
              replace => {
                "pc_prop" => ""
                "pc_old_f" => ""
                "pc_new_f" => ""
              }
            }
            mutate {
              replace => {
                "pc_prop" => "%{propchange.property}"
              }
              on_error => "cw_pc_prop_missing"
            }
            if ![cw_pc_prop_missing] and [pc_prop] != "" {
              for oldval in propchange.oldValues {
                mutate {
                  replace => {
                    "pc_old_item" => ""
                  }
                }
                mutate {
                  convert => {
                    "oldval" => "string"
                  }
                  on_error => "cw_pc_old_convert_failed"
                }
                if [oldval] != "" {
                  mutate {
                    replace => {
                      "pc_old_item.string_value" => "%{oldval}"
                    }
                    on_error => "cw_pc_old_val_failed"
                  }
                  if ![cw_pc_old_val_failed] {
                    mutate {
                      merge => {
                        "pc_old_f.value.list_value.values" => "pc_old_item"
                      }
                      on_error => "cw_pc_old_val_merge_failed"
                    }
                  }
                }
              }
              if [pc_old_f] != "" {
                mutate {
                  replace => {
                    "pc_old_f.key" => "propertyChanges.%{pc_prop}.oldValues"
                  }
                  on_error => "cw_pc_old_key_failed"
                }
                if ![cw_pc_old_key_failed] {
                  mutate {
                    merge => {
                      "event.idm.read_only_udm.additional.fields" => "pc_old_f"
                    }
                    on_error => "cw_pc_old_field_merge_failed"
                  }
                }
              }

              for newval in propchange.newValues {
                mutate {
                  replace => {
                    "pc_new_item" => ""
                  }
                }
                mutate {
                  convert => {
                    "newval" => "string"
                  }
                  on_error => "cw_pc_new_convert_failed"
                }
                if [newval] != "" {
                  mutate {
                    replace => {
                      "pc_new_item.string_value" => "%{newval}"
                    }
                    on_error => "cw_pc_new_val_failed"
                  }
                  if ![cw_pc_new_val_failed] {
                    mutate {
                      merge => {
                        "pc_new_f.value.list_value.values" => "pc_new_item"
                      }
                      on_error => "cw_pc_new_val_merge_failed"
                    }
                  }
                }
              }
              if [pc_new_f] != "" {
                mutate {
                  replace => {
                    "pc_new_f.key" => "propertyChanges.%{pc_prop}.newValues"
                  }
                  on_error => "cw_pc_new_key_failed"
                }
                if ![cw_pc_new_key_failed] {
                  mutate {
                    merge => {
                      "event.idm.read_only_udm.additional.fields" => "pc_new_f"
                    }
                    on_error => "cw_pc_new_field_merge_failed"
                  }
                }
              }
            }
          }

          mutate {
            rename => {
              "version" => "addition.eventbridge_version"
              "id" => "addition.eventbridge_id"
              "detail-type" => "addition.detail-type"
              "source" => "addition.source"
              "account" => "addition.account"
              "time" => "addition.eventbridge_time"
              "detail.topicName" => "addition.topicName"
              "detail.metadata.CorrelationId" => "addition.CorrelationId"
              "detail.eventBody.level" => "addition.level"
              "detail.eventBody.clientId.id" => "addition.clientId"
            }
          }

          for key, value in addition map {
            mutate {
              replace => {
                "map_field" => ""
              }
            }
            mutate {
              convert => {
                "value" => "string"
              }
              on_error => "cw_addition_value_convert_failed"
            }
            if [key] != "" and [value] != "" {
              if [key] in ["logStream", "owner", "source"] {
                mutate {
                  replace => {
                    "map_field.key" => "%{key}"
                    "map_field.value" => "%{value}"
                  }
                  on_error => "cw_obs_label_field_failed"
                }
                if ![cw_obs_label_field_failed] {
                  mutate {
                    merge => {
                      "event.idm.read_only_udm.observer.resource.attribute.labels" => "map_field"
                    }
                    on_error => "cw_obs_label_merge_failed"
                  }
                }
              }
              else {
                mutate {
                  replace => {
                    "map_field.key" => "%{key}"
                    "map_field.value.string_value" => "%{value}"
                  }
                  on_error => "cw_additional_field_replace_failed"
                }
                if ![cw_additional_field_replace_failed] {
                  mutate {
                    merge => {
                      "event.idm.read_only_udm.additional.fields" => "map_field"
                    }
                    on_error => "cw_additional_field_merge_failed"
                  }
                }
              }
            }
          }

          if [action] =~ "(?i)^AuthenticationFailed$" and ([has_target_user] == "true" or ([has_target_application] == "true" and ([has_principal_user] == "true" or [has_principal] == "true"))) {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
                "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
              }
            }
          }
          else if [action] =~ "(?i)^ChangePassword$" and ([has_target_user] == "true" or ([has_principal_user] == "true" and [has_target_application] == "true")) {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PASSWORD"
              }
            }
          }
          else if [action] =~ "(?i)^Create$" and [has_principal_user] == "true" and [has_target_user] == "true" and ([has_target_application] == "true" or [has_principal] == "true") {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "USER_CREATION"
              }
            }
          }
          else if [action] =~ "(?i)^Create$" and [has_principal_user] == "true" and [has_target_resource] == "true" {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
              }
            }
          }
          else if [action] =~ "(?i)^Read$" and [has_principal_user] == "true" and [has_target_resource] == "true" {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
              }
            }
          }
          else if [action] =~ "(?i)^Update$" and [has_principal_user] == "true" and [has_target_resource] == "true" {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
              }
            }
          }
          else if [has_principal_user] == "true" or [has_target_user] == "true" {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
              }
            }
          }
          else {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
              }
            }
          }

          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.vendor_name" => "Genesys"
              "event.idm.read_only_udm.metadata.product_name" => "Genesys Audit"
            }
          }

          mutate {
            merge => {
              "@output" => "event"
            }
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "audit_id" => "%{detail.eventBody.id}"
        }
        on_error => "audit_id_missing"
      }

      if [audit_id] != "" {
        if [source] != "" {
          grok {
            match => {
              "source" => [
                "^aws\\.partner/genesys\\.com/cloud/(?P<org_id>[^/]+)/"
              ]
            }
            overwrite => ["org_id"]
            on_error => "org_id_grok_failed"
          }
          if ![org_id_grok_failed] and [org_id] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.metadata.product_deployment_id" => "%{org_id}"
              }
              on_error => "org_id_set_failed"
            }
          }
        }

        if [region] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.observer.location.name" => "%{region}"
            }
            on_error => "eb_region_set_failed"
          }
        }

        mutate {
          replace => {
            "detail_version" => "%{detail.version}"
          }
          on_error => "detail_version_missing"
        }
        if [detail_version] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.product_version" => "%{detail_version}"
            }
            on_error => "detail_version_set_failed"
          }
        }

        mutate {
          replace => {
            "detail_timestamp" => "%{detail.timestamp}"
          }
          on_error => "detail_timestamp_missing"
        }
        if [detail_timestamp] != "" {
          date {
            match => ["detail_timestamp", "ISO8601", "RFC3339"]
            target => "event.idm.read_only_udm.metadata.collected_timestamp"
            on_error => "detail_ts_collected_date_failed"
          }
        }

        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{audit_id}"
          }
          on_error => "audit_id_set_failed"
        }

        mutate {
          replace => {
            "event_time" => "%{detail.eventBody.eventTime}"
          }
          on_error => "event_time_missing"
        }
        if [event_time] != "" {
          date {
            match => ["event_time", "ISO8601", "RFC3339"]
            target => "event.idm.read_only_udm.metadata.event_timestamp"
            on_error => "event_ts_date_failed"
          }
        }

        mutate {
          replace => {
            "action" => "%{detail.eventBody.action}"
          }
          on_error => "action_missing"
        }
        if [action] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.product_event_type" => "%{action}"
            }
            on_error => "audit_product_event_type_set_failed"
          }
        }

        mutate {
          replace => {
            "user_id" => "%{detail.eventBody.userId}"
          }
          on_error => "user_id_missing"
        }
        if [user_id] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.userid" => "%{user_id}"
              "has_principal_user" => "true"
            }
            on_error => "principal_user_id_set_failed"
          }
        }

        mutate {
          replace => {
            "user_home_org_id" => "%{detail.eventBody.userHomeOrgId}"
          }
          on_error => "user_home_org_id_missing"
        }
        if [user_home_org_id] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.administrative_domain" => "%{user_home_org_id}"
            }
            on_error => "principal_home_org_set_failed"
          }
        }

        for ip in detail.eventBody.remoteIp {
          mutate {
            replace => {
              "valid_ip" => ""
            }
          }
          if [ip] != "" {
            grok {
              match => {
                "ip" => [
                  "^%{IP:valid_ip}$"
                ]
              }
              overwrite => ["valid_ip"]
              on_error => "principal_ip_grok_failed"
            }
            if ![principal_ip_grok_failed] and [valid_ip] != "" {
              mutate {
                merge => {
                  "event.idm.read_only_udm.principal.ip" => "valid_ip"
                  "event.idm.read_only_udm.principal.asset.ip" => "valid_ip"
                }
                on_error => "principal_ip_merge_failed"
              }
              if ![principal_ip_merge_failed] {
                mutate {
                  replace => {
                    "has_principal" => "true"
                  }
                }
              }
            }
          }
        }

        mutate {
          replace => {
            "service_name" => "%{detail.eventBody.serviceName}"
          }
          on_error => "service_name_missing"
        }
        if [service_name] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.target.application" => "%{service_name}"
              "has_target_application" => "true"
            }
            on_error => "audit_service_name_set_failed"
          }
        }

        mutate {
          replace => {
            "entity_type" => "%{detail.eventBody.entityType}"
          }
          on_error => "entity_type_missing"
        }
        mutate {
          replace => {
            "entity_id" => "%{detail.eventBody.entity.id}"
          }
          on_error => "entity_id_missing"
        }
        mutate {
          replace => {
            "entity_name" => "%{detail.eventBody.entity.name}"
          }
          on_error => "entity_name_missing"
        }
        if [entity_type] in ["User", "AuthUser"] {
          mutate {
            rename => {
              "detail.eventBody.entityType" => "addition.entityType"
            }
          }
          if [entity_id] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.user.userid" => "%{entity_id}"
                "has_target_user" => "true"
              }
              on_error => "target_user_id_set_failed"
            }
          }
          if [entity_name] != "" and [entity_name] =~ "^[^@ ]+@[^@ ]+[.][^@ ]+$" {
            mutate {
              merge => {
                "event.idm.read_only_udm.target.user.email_addresses" => "entity_name"
              }
              on_error => "target_user_email_merge_failed"
            }
            if ![target_user_email_merge_failed] {
              mutate {
                replace => {
                  "has_target_user" => "true"
                }
              }
            }
          }
        }
        else {
          if [entity_type] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.resource.resource_subtype" => "%{entity_type}"
                "has_target_resource" => "true"
              }
              on_error => "audit_entity_type_set_failed"
            }
          }
          if [entity_id] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.resource.product_object_id" => "%{entity_id}"
                "has_target_resource" => "true"
              }
              on_error => "audit_entity_id_set_failed"
            }
          }
          if [entity_name] != "" {
            mutate {
              replace => {
                "event.idm.read_only_udm.target.resource.name" => "%{entity_name}"
                "has_target_resource" => "true"
              }
              on_error => "audit_entity_name_set_failed"
            }
            if [entity_name] =~ "^s3://" {
              mutate {
                replace => {
                  "event.idm.read_only_udm.target.resource.resource_type" => "STORAGE_OBJECT"
                  "event.idm.read_only_udm.target.resource.attribute.cloud.environment" => "AMAZON_WEB_SERVICES"
                }
              }
            }
          }
        }

        mutate {
          replace => {
            "msg_text" => "%{detail.eventBody.message.message}"
          }
          on_error => "msg_text_missing"
        }
        if [msg_text] != "" {
          mutate {
            replace => {
              "security_result.description" => "%{msg_text}"
            }
            on_error => "security_result_description_set_failed"
          }
        }

        mutate {
          replace => {
            "msg_code" => "%{detail.eventBody.message.localizableMessageCode}"
          }
          on_error => "msg_code_missing"
        }
        if [msg_code] != "" {
          mutate {
            replace => {
              "security_result.summary" => "%{msg_code}"
            }
            on_error => "security_result_summary_set_failed"
          }
        }

        if [action] =~ "(?i)^AuthenticationFailed$" {
          mutate {
            replace => {
              "security_result_action" => "BLOCK"
            }
          }
          mutate {
            merge => {
              "security_result.action" => "security_result_action"
            }
            on_error => "security_result_action_block_merge_failed"
          }
        }
        else if [msg_code] =~ "(?i)SUCCESS" {
          mutate {
            replace => {
              "security_result_action" => "ALLOW"
            }
          }
          mutate {
            merge => {
              "security_result.action" => "security_result_action"
            }
            on_error => "security_result_action_allow_merge_failed"
          }
        }

        if [security_result] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.security_result" => "security_result"
            }
            on_error => "security_result_merge_failed"
          }
        }

        for key, value in detail.eventBody.context map {
          mutate {
            replace => {
              "ctx_lbl" => ""
            }
          }
          mutate {
            convert => {
              "value" => "string"
            }
            on_error => "ctx_value_convert_failed"
          }
          if [key] != "" and [value] != "" {
            if [key] == "loginMethod" and [value] =~ "(?i)^password$" {
              mutate {
                replace => {
                  "auth_mechanism" => "USERNAME_PASSWORD"
                }
              }
              mutate {
                merge => {
                  "event.idm.read_only_udm.extensions.auth.mechanism" => "auth_mechanism"
                }
                on_error => "auth_mechanism_merge_failed"
              }
            }
            else {
              mutate {
                replace => {
                  "ctx_lbl.key" => "%{key}"
                  "ctx_lbl.value" => "%{value}"
                }
                on_error => "ctx_lbl_field_failed"
              }
              if ![ctx_lbl_field_failed] {
                if [entity_type] in ["User", "AuthUser"] {
                  mutate {
                    merge => {
                      "event.idm.read_only_udm.target.user.attribute.labels" => "ctx_lbl"
                    }
                    on_error => "ctx_user_lbl_merge_failed"
                  }
                }
                else {
                  mutate {
                    merge => {
                      "event.idm.read_only_udm.target.resource.attribute.labels" => "ctx_lbl"
                    }
                    on_error => "ctx_lbl_merge_failed"
                  }
                }
              }
            }
          }
        }

        for propchange in detail.eventBody.propertyChanges {
          mutate {
            replace => {
              "pc_prop" => ""
              "pc_old_f" => ""
              "pc_new_f" => ""
            }
          }
          mutate {
            replace => {
              "pc_prop" => "%{propchange.property}"
            }
            on_error => "pc_prop_missing"
          }
          if ![pc_prop_missing] and [pc_prop] != "" {
            for oldval in propchange.oldValues {
              mutate {
                replace => {
                  "pc_old_item" => ""
                }
              }
              mutate {
                convert => {
                  "oldval" => "string"
                }
                on_error => "pc_old_convert_failed"
              }
              if [oldval] != "" {
                mutate {
                  replace => {
                    "pc_old_item.string_value" => "%{oldval}"
                  }
                  on_error => "pc_old_val_failed"
                }
                if ![pc_old_val_failed] {
                  mutate {
                    merge => {
                      "pc_old_f.value.list_value.values" => "pc_old_item"
                    }
                    on_error => "pc_old_val_merge_failed"
                  }
                }
              }
            }
            if [pc_old_f] != "" {
              mutate {
                replace => {
                  "pc_old_f.key" => "propertyChanges.%{pc_prop}.oldValues"
                }
                on_error => "pc_old_key_failed"
              }
              if ![pc_old_key_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "pc_old_f"
                  }
                  on_error => "pc_old_field_merge_failed"
                }
              }
            }

            for newval in propchange.newValues {
              mutate {
                replace => {
                  "pc_new_item" => ""
                }
              }
              mutate {
                convert => {
                  "newval" => "string"
                }
                on_error => "pc_new_convert_failed"
              }
              if [newval] != "" {
                mutate {
                  replace => {
                    "pc_new_item.string_value" => "%{newval}"
                  }
                  on_error => "pc_new_val_failed"
                }
                if ![pc_new_val_failed] {
                  mutate {
                    merge => {
                      "pc_new_f.value.list_value.values" => "pc_new_item"
                    }
                    on_error => "pc_new_val_merge_failed"
                  }
                }
              }
            }
            if [pc_new_f] != "" {
              mutate {
                replace => {
                  "pc_new_f.key" => "propertyChanges.%{pc_prop}.newValues"
                }
                on_error => "pc_new_key_failed"
              }
              if ![pc_new_key_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "pc_new_f"
                  }
                  on_error => "pc_new_field_merge_failed"
                }
              }
            }
          }
        }

        mutate {
          rename => {
            "version" => "addition.eventbridge_version"
            "id" => "addition.eventbridge_id"
            "detail-type" => "addition.detail-type"
            "source" => "addition.source"
            "account" => "addition.account"
            "time" => "addition.eventbridge_time"
            "detail.topicName" => "addition.topicName"
            "detail.metadata.CorrelationId" => "addition.CorrelationId"
            "detail.eventBody.level" => "addition.level"
            "detail.eventBody.clientId.id" => "addition.clientId"
          }
        }

        for key, value in addition map {
          mutate {
            replace => {
              "map_field" => ""
            }
          }
          mutate {
            convert => {
              "value" => "string"
            }
            on_error => "addition_value_convert_failed"
          }
          if [key] != "" and [value] != "" {
            if [key] == "source" {
              mutate {
                replace => {
                  "map_field.key" => "%{key}"
                  "map_field.value" => "%{value}"
                }
                on_error => "obs_label_field_failed"
              }
              if ![obs_label_field_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.observer.resource.attribute.labels" => "map_field"
                  }
                  on_error => "obs_label_merge_failed"
                }
              }
            }
            else {
              mutate {
                replace => {
                  "map_field.key" => "%{key}"
                  "map_field.value.string_value" => "%{value}"
                }
                on_error => "additional_field_replace_failed"
              }
              if ![additional_field_replace_failed] {
                mutate {
                  merge => {
                    "event.idm.read_only_udm.additional.fields" => "map_field"
                  }
                  on_error => "additional_field_merge_failed"
                }
              }
            }
          }
        }

        if [action] =~ "(?i)^AuthenticationFailed$" and ([has_target_user] == "true" or ([has_target_application] == "true" and ([has_principal_user] == "true" or [has_principal] == "true"))) {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
              "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
            }
          }
        }
        else if [action] =~ "(?i)^ChangePassword$" and ([has_target_user] == "true" or ([has_principal_user] == "true" and [has_target_application] == "true")) {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PASSWORD"
            }
          }
        }
        else if [action] =~ "(?i)^Create$" and [has_principal_user] == "true" and [has_target_user] == "true" and ([has_target_application] == "true" or [has_principal] == "true") {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_CREATION"
            }
          }
        }
        else if [action] =~ "(?i)^Create$" and [has_principal_user] == "true" and [has_target_resource] == "true" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
            }
          }
        }
        else if [action] =~ "(?i)^Read$" and [has_principal_user] == "true" and [has_target_resource] == "true" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
            }
          }
        }
        else if [action] =~ "(?i)^Update$" and [has_principal_user] == "true" and [has_target_resource] == "true" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
            }
          }
        }
        else if [has_principal_user] == "true" or [has_target_user] == "true" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
        else {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
            }
          }
        }

        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.vendor_name" => "Genesys"
            "event.idm.read_only_udm.metadata.product_name" => "Genesys Audit"
          }
        }

        mutate {
          merge => {
            "@output" => "event"
          }
        }
      }
    }
  }
}
