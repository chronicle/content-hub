# Product: VMWare AirWatch
# Category: Wireless
# Supported Format: SYSLOG + KV
# Reference: See below
# Last Updated: 2025-06-05
# Copyright 2025 Google SecOps

# References:
#   - https://docs.mcafee.com/bundle/enterprise-security-manager-data-sources-configuration-reference-guide/page/GUID-8855FE7E-75F4-4DC7-A7D0-E063AF592041.html
#   - https://www.wsouem.com/workspace-one-uem-airwatch-event-logs-overview/
#   - https://www.niap-ccevs.org/MMO/Product/st_vid11026-agd.pdf

filter {
  mutate {
    replace => {
      "user_name" => ""
      "domain" => ""
      "hostname" => ""
      "user" => ""
      "principal_ip" => ""
      "principal_userid" => ""
      "principal_hostname" => ""
      "target_ip" => ""
      "target_userid" => ""
      "target_hostname" => ""
      "event_ts_time" => ""
      "event_ts_month" => ""
      "date1" => ""
      "event_module" => ""
      "event_category" => ""
      "event_source" => ""
      # cef variables
      "event_data" => ""
      "device_name" => ""
      "sys_ip" => ""
      "enrollment_user" => ""
      # kv variables
      "ComplianceStatus" => ""
      "ProfileName" => ""
      "Profile" => ""
      "Device" => ""
      "FriendlyName" => ""
      "SmartGroupName" => ""
      "GroupManagementData" => ""
      "process_id" => ""
      "summary" => ""
      "event_time" => ""
      "src_ip" => ""
      "user_info" => ""
      "description" => ""
      "not_cef_format" => "false"
      "grok_parse_failure" => "false"
      "security_result" => ""
      "intermediary" => ""
      "domain_name" => ""
      "target_port" => ""
      "protocol" => ""
      "http_status" => ""
      "method_url" => ""
      "referral_url" => ""
      "user_agent" => ""
      "LoginSessionID" => ""
      "OriginatingOrganizationGroup" => ""
      "OwnershipType" => ""
      "bytes_received" => ""
      "LogDescription" => ""
      "Application" => ""
      "ApplicationType" => ""
      "ApplicationUUID" => ""
      "MessageText" => ""
      "request_url" => ""
      "event_name" => ""
      "log_event_name" => ""
      "AdminAccount" => ""
      "Tags" => ""
      "event.idm.read_only_udm.metadata.event_type" => ""
      "device_type" => ""
      "application_protocol" => ""
      "method" => ""
      "response_code" => ""
      "url" => ""
      "hash_value" => ""
      "desc" => ""
      "severity" => ""
      "app_name" => ""
      "Hmac"  => ""
      "kvmsg" => ""
      "des" => ""
      "ScriptName" => ""
      "VersionUuid" => ""
      "ScriptUuid" => ""
      "LogId" => ""
      "compromised_status" => ""
      "ApplicationGroup" => ""
      "date3" => ""
      "type" => ""
      "vendor_action" => ""
      "src_user" => ""
      "subtype" => ""
      "vendor_action_class" => ""
      "vendor_action_category" => ""
      "msg1" => ""
      "deviceN" => ""
      "tuser" => ""
      "messagetext" => ""
      "LoginAttemptNumber" => ""
      "kv_data" => ""
      "LocationGroup"=> ""
      "AdminName" => ""
      "ApplicationBundle" => ""
      "UserSecurityType" => ""
      "has_target_user" => "false"
    }
    convert => {
      "not_cef_format" => "boolean"
      "grok_parse_failure" => "boolean"
    }
  }

  grok {
    match => {
      "message" => [ "%{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time} %{DATA}:%{DATA:event_type},Event:%{DATA:event_name},User:%{DATA:user_name},Event Source:%{DATA:event_source},Event Module:%{DATA:event_module},Event Category:%{DATA:event_category},Event Data:%{GREEDYDATA:event_data}",
                     "%{MONTH}\\s+%{MONTHDAY} %{TIME} %{IP:sys_ip} %{MONTHDAY:sys_day} %{TIME:sys_time} AirWatch  AirWatch Syslog Details are as follows Event Type: %{DATA:event_type} Event: %{DATA:event_name} User: (?P<user>\\s|.*?)\\s?Event Source: %{DATA:event_source} Event Module: %{DATA:event_module} Event Category: %{DATA:event_category} Event Data: %{DATA:event_data} Enrollment User: %{DATA:enrollment_user} Device Friendly Name: %{GREEDYDATA:device_name} Event Timestamp: %{MONTH:event_ts_month} %{MONTHDAY:event_ts_day}, %{YEAR:event_ts_year} %{TIME:event_ts_time}",
                     "%{MONTH}\\s+%{MONTHDAY} %{TIME} AirWatch  AirWatch Syslog Details are as follows Event Type:%{DATA:event_type},Event:%{DATA:event_name},User:%{DATA:user},Event Source:%{DATA:event_source},Event Module:%{DATA:event_module},Event Category:%{DATA:event_category},Event Data:%{GREEDYDATA:event_data} Timestamp: %{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day}, %{YEAR:event_ts_year} %{TIME:event_ts_time}",
                     "<%{INT}> %{GREEDYDATA:date1} AirWatch SONJ  AirWatch Syslog Details are as follows Event Type: %{DATA:event_type}: %{DATA:event_name}User: %{DATA:user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{DATA:event_data} Event Timestamp: %{GREEDYDATA:date2}",
                     "(<%{INT}> |)%{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time} AirWatch%{SPACE}AirWatch Syslog Details are as follows Event Type: %{DATA:event_type}:%{DATA:log_event_name}User: %{DATA:user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{GREEDYDATA:event_data} Event Timestamp: %{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time}",
                     "(<%{INT}> |)%{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time} AirWatch%{SPACE}AirWatch Syslog Details are as follows Event Type: %{DATA:event_type}:%{DATA:log_event_name}User: %{DATA:user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{GREEDYDATA:event_data}",
                     "<%{INT}> %{MONTH:event_ts_month} %{MONTHDAY:event_ts_day} %{TIME:event_ts_time} AirWatch SONJ  AirWatch Syslog Details are as follows Event Type: %{DATA:event_type}:%{DATA:event_name}User: %{DATA:user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{DATA:event_data} Event Timestamp: %{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time}",
                     "Request Url: %{GREEDYDATA:request_url} Enrollment User: %{DATA:enrollment_user} Device Friendly Name: %{DATA:FriendlyName} Event Timestamp: %{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day}, %{YEAR:event_ts_year} %{TIME:event_ts_time}",
                     "Request Url: %{GREEDYDATA:request_url} Event Timestamp: %{MONTH:event_ts_month}%{SPACE}%{MONTHDAY:event_ts_day} %{TIME:event_ts_time}",
                     "(<%{INT}> |)%{TIMESTAMP_ISO8601:date1} AIRWATCH  AirWatch Syslog Details are as follows Event Type: %{DATA:event_type}:%{DATA:log_event_name}User: %{DATA:user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{GREEDYDATA:event_data} Event Timestamp: %{TIMESTAMP_ISO8601}",
                     "<%{INT}> %{SYSLOGTIMESTAMP:date1} .*: %{DATA:event_type}: %{DATA:event_name}User: %{DATA:user}Event Source: %{DATA:event_source}Event Module: %{DATA:event_module}Event Category: %{DATA:event_category}Event Data:%{DATA:event_data} Event Timestamp: %{GREEDYDATA:date2}",
                     "<%{INT}> %{TIMESTAMP_ISO8601:date1} %{DATA} %{DATA}: %{DATA}: %{DATA:event_name} %{DATA}: %{DATA:user} %{DATA}: %{DATA:event_source} %{DATA}: %{DATA:event_module} %{DATA}: %{DATA:event_category} %{DATA}:  %{DATA}: %{DATA:enrollment_user} %{DATA}: %{DATA:FriendlyName} Event Timestamp: %{TIMESTAMP_ISO8601:date2}",
                    "<%{INT}> %{TIMESTAMP_ISO8601:date1} %{DATA} %{DATA}: %{DATA}: %{DATA:event_name} %{DATA}: %{DATA:user} %{DATA}: %{DATA:event_source} %{DATA}: %{DATA:event_module} %{DATA}: %{DATA:event_category} %{DATA}:\\s+(%{GREEDYDATA:kv_data})? Enrollment User: %{DATA:enrollment_user} %{DATA}: %{DATA:FriendlyName} Event Timestamp: %{TIMESTAMP_ISO8601:date2}"

                   ]
    }
    overwrite => ["user", "sys_ip", "device_name", "event_data", "enrollment_user","user_name", "event_ts_time","event_ts_day", "event_ts_year","event_ts_month","date1", "event_module","event_category", "event_source","FriendlyName","request_url","event_name","log_event_name", "kv_data"]
    on_error => "not_syslog_format"
  }

  if [not_syslog_format] {
    grok {
      match => {
        "message" => [
        "%{MONTH}\\s+%{MONTHDAY} %{TIME} AirWatch CEF:%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA:event_type}\\|%{DATA:event_name}\\|%{DATA:severity}\\|\\s+msg=%{DATA:event_data}\\s+cat=%{DATA:event_category}\\s+suser=%{DATA:user}\\s+%{GREEDYDATA:cs_labels}Event Timestamp: %{MONTH:event_ts_month} %{MONTHDAY:event_ts_day}, %{YEAR:event_ts_year} %{TIME:event_ts_time}"
        "%{DATA} %{MONTHDAY} %{TIME} AirWatch CEF:%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA:event_type}\\|%{DATA:event_name}\\|%{DATA:severity}\\|msg=%{DATA:event_data}\\s+cat=%{DATA:event_category}\\s+suser=%{DATA:user}\\s+%{GREEDYDATA:cs_labels}Event Timestamp: %{DATA:event_ts_month} %{MONTHDAY:event_ts_day} %{TIME:event_ts_time}"
        "%{DATA} %{MONTHDAY} %{TIME} AirWatch CEF:%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA:event_type}\\|%{DATA:event_name}\\|%{DATA:severity}\\|msg=%{GREEDYDATA:desc}"
        ]
      }
      overwrite => ["user", "event_data","event_category", "event_source","event_ts_month","event_ts_day","event_ts_year","event_ts_time", "event_type", "event_name","cs_labels","desc","severity"]
      on_error => "not_cef_format"
    }
  }

  if [not_cef_format] {
    grok {
      match => {
        "message" => [
          "<%{INT}>\\[%{DATA:event_time}\\],%{DATA:event_data},\\*%{DATA:process_id},%{DATA:protocol},%{DATA:summary},%{IP:sys_ip},%{DATA:rank},%{DATA:hash_value},%{DATA:user_info},::ffff:%{DATA:src_ip},%{DATA:principal_hostname},%{DATA:description},%{HOST:target_hostname},\\[::ffff:%{IP:target_ip}\\]:%{INT:target_port}",
          "<%{INT}>\\[%{DATA:event_time}\\],%{DATA:event_data},\\*%{DATA:process_id},%{DATA:protocol},%{DATA:summary},%{IP:sys_ip},%{DATA:user_info},%{DATA:hash_value},(%{DATA:device_type} %{WORD}|%{DATA:device_type}),%{IP:target_ip},%{DATA:principal_hostname},%{DATA:description},%{DATA:target_hostname},\\[::ffff:%{IP}\\]:%{INT:target_port}",
          "<%{INT}>\\[%{DATA:event_time}\\],%{DATA:event_data},\\*%{DATA:process_id},%{DATA:protocol},%{DATA:summary},%{IP:sys_ip},%{DATA:user_info},%{DATA:hash_value},%{WORD} %{WORD} %{DATA:device_type},::ffff:%{DATA:target_ip},%{GREEDYDATA:description}",
          "<%{INT}>%{DATA:event_data}\\s\\*%{INT:process_id} %{DATA:summary}\\s\\[%{HTTPDATE:event_time}\\] %{DATA:hash_value} %{DATA:user_info} (?:%{IPV6:src_ip}|-)->%{IPV6:target_ip}(?:\\s-\\s|\\s)%{GREEDYDATA:description}",
          "<%{INT}>%{IPV6:src_ip}\\s-\\s%{DATA:event_data}\\s\\[%{HTTPDATE:event_time}\\] \\\"%{DATA:method_url}\\\"\\s%{INT:http_status}\\s%{INT}\\s\\\"%{DATA:referral_url}\\\"\\s\\\"%{DATA:user_agent}\\\"\\s\\\"%{DATA:hash_value}\\\"",
          "<%{INT}>%{DATA:event_data}\\s\\*%{DATA:process_id} (?:%{DATA:protocol}\\s|)\\[%{HTTPDATE:event_time}\\] %{DATA:hash_value} %{GREEDYDATA:user_info} %{DATA:principal_hostname} (?:send to|connected to|disconnected)\\s(?:%{IP}|%{HOST:target_hostname})\\s\\[%{IP:target_ip}\\]:%{INT:target_port}",
          "<%{INT}>\\[%{DATA:event_time}\\],%{DATA:event_data},%{INT:process_id},%{DATA:protocol},%{DATA:summary},%{IP:sys_ip},%{DATA:rank},%{DATA:hash_value},%{DATA:user_info},::ffff:%{DATA:src_ip},%{DATA:security_summary},%{GREEDYDATA:description}",
          "<%{INT}>\\[%{DATA:event_time}\\],\\[::ffff:%{DATA:sys_ip}\\]:%{INT},%{DATA:summary},%{DATA:event_data},\\\"%{DATA:protocol}\\\/%{DATA:hash_value}\\\",%{INT:value},%{INT:value1},\\\"%{DATA:text}\\\",\\\"%{DATA:description}\\\",\\\"%{DATA:key_value}\\\"",
          "<%{INT}>\\[%{DATA:event_time}\\],%{DATA:event_data},\\*%{DATA:process_id},%{DATA:protocol},%{DATA:summary},%{IP:sys_ip},%{DATA:user_info},%{DATA:hash_value},%{DATA:device_type} %{WORD},%{GREEDYDATA:description}",
          "<%{INT}>\\[%{DATA:event_time}\\],\\[%{DATA}:%{IP:sys_ip}\\]:%{DATA},%{DATA},%{DATA:principal_hostname},%{DATA:method} \\/%{DATA:url} %{DATA:application_protocol}\\/%{DATA},%{DATA},%{DATA:response_code},%{DATA:url},%{GREEDYDATA:user_agent},%{GREEDYDATA:hash_value}"
          "%{DATA} %{MONTHDAY} %{TIME} %{IP:sys_ip} Sensor : %{DATA:event_name} %{DATA} : %{GREEDYDATA:desc}"
          "%{DATA} %{MONTHDAY} %{TIME} %{IP:sys_ip} %{GREEDYDATA:kvmsg} Event Timestamp: %{DATA:event_ts_month} %{MONTHDAY:event_ts_day} %{TIME:event_ts_time}"
          "<%{INT}> %{SYSLOGTIMESTAMP:date3} %{DATA:type},%{WORD:vendor_action},%{DATA:src_user},%{DATA:subtype},%{DATA:vendor_action_class},%{DATA:vendor_action_category},%{GREEDYDATA:msg1}"
          "\\s+%{DATA}\\s+:\\s+%{DATA:type}:\\s+%{GREEDYDATA:msg1}"
          "%{DATA}:%{DATA}: %{GREEDYDATA:msg1}"

        ]
      }
      overwrite => ["event_data", "process_id", "target_ip", "src_ip", "summary", "event_time", "user_info", "description", "protocol", "domain_name", "target_port", "principal_hostname", "target_hostname", "method_url", "http_status", "referral_url", "user_agent","sys_ip","hash_value","device_type","application_protocol","method","url","response_code","event_name","desc","kvmsg","event_ts_time","event_ts_month","user","enrollment_user","dev_friendly_name","date3", "type", "vendor_action", "src_user", "subtype", "vendor_action_class", "vendor_action_category", "msg1"]
      on_error => "grok_parse_failure"
    }
  }
  if [not_syslog_format] and [not_cef_format] and [grok_parse_failure] {
    drop {
      tag => "TAG_UNSUPPORTED"
    }
  }
  if [kv_data] != "" {
    kv {
      source => "kv_data"
      field_split => ";"
      value_split => "="
      on_error => "kv_failure"
    }
    if [Application] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{Application}"
        }
        on_error => "Application_not_found"
      }
    }
    if [AdminAccount] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{AdminAccount}"
        }
        on_error => "AdminAccount_not_found"
      }
      if ![AdminAccount_not_found]{
        mutate {
          replace => {
            "has_target_user" => "true"
          }
        }
      }
    }
    if [LocationGroup] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.group.group_display_name" => "%{LocationGroup}"
        }
        on_error => "LocationGroup_not_found"
      }
    }
    if [AdminName] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{AdminName}"
        }
        on_error => "AdminName_not_found"
      }
    }
    if [LoginSessionID] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.session_id" => "%{LoginSessionID}"
        }
        on_error => "LoginSessionID_not_found"
      }
    }
    if [ApplicationType] != "" {
      mutate {
        replace => {
          "ApplicationType_label.value.string_value" => "%{ApplicationType}"
        }
        on_error => "ApplicationType_not_found"
      }
      if ![ApplicationType_not_found] {
        mutate {
          replace => {
            "ApplicationType_label.key" => "ApplicationType"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ApplicationType_label"
          }
          on_error => "ApplicationType_merge_failure"
        }
      }
    }
    if [ApplicationBundle] != "" {
      mutate {
        replace => {
          "ApplicationBundle_label.value.string_value" => "%{ApplicationBundle}"
        }
        on_error => "ApplicationBundle_not_found"
      }
      if ![ApplicationBundle_not_found] {
        mutate {
          replace => {
            "ApplicationBundle_label.key" => "ApplicationBundle"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ApplicationBundle_label"
          }
          on_error => "ApplicationBundle_merge_failure"
        }
      }
    }
    if [UserSecurityType] != "" {
      mutate {
        replace => {
          "UserSecurityType_label.value" => "%{UserSecurityType}"
        }
        on_error => "UserSecurityType_not_found"
      }
      if ![UserSecurityType_not_found] {
        mutate {
          replace => {
            "UserSecurityType_label.key" => "UserSecurityType"
          }
        }
        mutate {
          merge => {
            "security_result.detection_fields" => "UserSecurityType_label"
          }
          on_error => "UserSecurityType_merge_failure"
        }
      }
    }
  }

  if [date1] != "" {
    date {
      match => ["date1", "ISO8601","RFC3339","yyyy-MM-ddTHH:mm:ss.SSSSSSZ","MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
      rebase => true
    }
  }
  if [msg1] != "" {
    grok {
      match => {
        "msg1" => [
          "MessageText=%{GREEDYDATA:messagetext},%{DATA:tuser},%{DATA:deviceN} Event Timestamp"
          "%{GREEDYDATA:messagetext},%{DATA:tuser},%{DATA:deviceN} Event"
        ]
      }
      overwrite => ["messagetext", "tuser", "deviceN"]
      on_error => "msg1_grok_parse_failure"
    }
    if [msg1_grok_parse_failure] {
      mutate {
        replace => {
          "security_result.description" => "%{msg1}"
        }
        on_error => "msg1_not_found"
      }
    }
    else {
      if [messagetext] != "" {
        kv {
          source => "messagetext"
          field_split => ";"
          value_split => "="
          on_error => "messagetext_kv_parse_failure"
        }
        mutate {
          replace => {
            "security_result.description" => "%{messagetext}"
          }
          on_error => "messagetext_not_found"
        }
      }
      if [LoginSessionID] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{LoginSessionID}"
          }
          on_error => "LoginSessionID_not_found"
        }
      }
      if [LoginAttemptNumber] != "" {
        mutate {
          replace => {
            "LoginAttemptNumber_label.key" => "LoginAttemptNumber"
            "LoginAttemptNumber_label.value.string_value" => "%{LoginAttemptNumber}"
          }
          on_error => "LoginAttemptNumber_not_found"
        }
        if ![LoginAttemptNumber_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "LoginAttemptNumber_label"
            }
            on_error => "LoginAttemptNumber_not_found"
          }
        }
      }
      if [tuser] not in ["", "N/A"] {
        grok {
          match => {
            "tuser" => ["%{WORD:tuser}"]
          }
          overwrite => ["tuser"]
          on_error => "tuser_not_found"
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.user.userid" => "%{tuser}"
          }
          on_error => "tuser_not_found"
        }
      }
      if [deviceN] not in ["", "N/A"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{deviceN}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{deviceN}"
          }
          on_error => "device_not_found"
        }
      }
    }
  }
  if [date3] != "" {
    date {
      match => ["date3","MMM  d HH:mm:ss"]
      rebase => true
      on_error => "date_parse_failure"
    }
  }
  if [src_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{src_user}"
      }
      on_error => "src_user_not_found"
    }
  }
  if [type] != "" {
    mutate {
      replace => {
        "type_label.key" => "type"
        "type_label.value.string_value" => "%{type}"
      }
      on_error => "type_not_found"
    }
    if ![type_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "type_label"
        }
        on_error => "type_not_found"
      }
    }
  }
  if [vendor_action] != "" {
    mutate {
      replace => {
        "vendor_action_label.key" => "vendor_action"
        "vendor_action_label.value.string_value" => "%{vendor_action}"
      }
      on_error => "vendor_action_not_found"
    }
    if ![vendor_action_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vendor_action_label"
        }
        on_error => "vendor_action_not_found"
      }
    }
  }
  if [subtype] != "" {
    mutate {
      replace => {
        "subtype_label.key" => "subtype"
        "subtype_label.value.string_value" => "%{subtype}"
      }
      on_error => "subtype_not_found"
    }
    if ![subtype_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "subtype_label"
        }
        on_error => "subtype_not_found"
      }
    }
  }
  if [vendor_action_category] != "" {
    mutate {
      replace => {
        "vendor_action_category_label.key" => "vendor_action_category"
        "vendor_action_category_label.value.string_value" => "%{vendor_action_category}"
      }
      on_error => "vendor_action_category_not_found"
    }
    if ![vendor_action_category_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vendor_action_category_label"
        }
        on_error => "vendor_action_category_not_found"
      }
    }
  }
  if [vendor_action_class] != "" {
    mutate {
      replace => {
        "vendor_action_class_label.key" => "vendor_action_class"
        "vendor_action_class_label.value.string_value" => "%{vendor_action_class}"
      }
      on_error => "vendor_action_class_not_found"
    }
    if ![vendor_action_class_not_found] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vendor_action_class_label"
        }
        on_error => "vendor_action_class_not_found"
      }
    }
  }


  if ![not_syslog_format] or ![not_cef_format] {
    if [event_data] != "" {
      kv {
        source => "event_data"
        field_split => ";"
        value_split => "="
      }
    }

    if [event_ts_time] != "" {
      mutate {
        gsub => ["event_ts_time", "\\n", ""]
      }
    }
    mutate {
      replace => {
        "ts" => "%{event_ts_month} %{event_ts_day} %{event_ts_time}"
      }
      on_error => "pattern_missing"
    }
    if ![pattern_missing] {
      date {
        match => ["ts", "MMMM dd HH:mm:ss", "MMMM d HH:mm:ss","MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
        rebase => true
      }
    }
    if [user] not in [" ", ""] {
      # dealing with domain and user
      mutate {
        gsub => ["user", "\\\\", "###"]
      }

      grok {
        match => {
          "user" => ["%{DATA:domain}###%{GREEDYDATA:user_name}", "%{GREEDYDATA:user_name}"]
        }
        overwrite => ["user_name", "domain"]
        on_error => "user_not_found"
      }
    }
    # Extracting the device name
    if [device_name] != "" and [device_name] != "N/A" {
      # preserving only the device's name
      grok {
        match => {
          "device_name" => ["%{DATA:hostname} running%{GREEDYDATA}"]
        }
        overwrite => ["hostname"]
        on_error => "hostname_not_found"
      }
    } else if [FriendlyName] != "" {
      mutate {
        replace => {
          "hostname" => "%{FriendlyName}"
        }
        on_error => "hostname_not_found"
      }
    } else if [Device] != "" {
      mutate {
        replace => {
          "hostname" => "%{Device}"
        }
        on_error => "hostname_not_found"
      }
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "AirWatch"
        "event.idm.read_only_udm.metadata.vendor_name" => "VMWare"
      }
    }
    if [log_event_name] != "" {
      mutate {
        replace => {
          "event_name" => "%{log_event_name}"
        }
      }
    }
    if [event_name] != "" {
      mutate {
        gsub => ["event_name","^\\s+",""]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_event_type" => "%{event_name}"
        }
      }
    }

    # Most of the events have the same pattern of setting the principal and target fields.
    # The specific edge cases should be implemented separately.

    # dealing with principal fields
    if [event_name] in ["AuthTokenIssued", "AuthTokenRevoked",
                        "BreakMDMRequested", "ComplianceNotificationSent", "DeleteDeviceRequested",
                        "Revoked", "ComplianceStatusChanged", "CompliancePolicyModified", "ProfileModified",
                        "ProfilePublished", "ProfileSetToInactive", "SmartGroupsDeleted", "ApplicationDownload",
                        "EnrollmentComplete", "EULAAccepted", "StartACMRequested", "DeviceEnterpriseWipeRequested",
                        "InstallApplicationRequested", "InstallProfileRequested", "RemoveProfileRequested",
                        "ApplicationInstallOnDeviceRequested", "FindDeviceRequested", "RemoveApplicationRequested",
                        "SendMessageRequested", "AvailableOsUpdatesRequested", "DeviceProfileTypeBlocked",
                        "DeviceProfileTypeUnblocked", "AddMissingUserCompletedEvent", "AddMissingUserFailureEvent",
                        "ApplicationAdded", "ApplicationDeleted", "ApplicationGroupAssignmentModified",
                        "ApplicationGroupCreated", "ApplicationRemoveFromDeviceRequested", "ApplicationModified",
                        "ApplicationPublished", "ApplicationPublishFailed", "ApplicationPublishStarted",
                        "ApplicationVersionAdded", "DeviceWipeRequested", "ProfileVersionAdded",
                        "RestrictionPayloadModified", "SmartGroupsModified", "SyncGroupCompletedEvent",
                        "SyncGroupFailureEvent", "SearchMissingUserCompleteEvent", "SyncAdminFailure",
                        "SyncUserCompletedEvent", "SyncUserFailureEvent", "UserDeleted","HealthAttestationCertificateRequestConfirmed",
                        "WindowsDeviceCheckInMode","SampleResponseListReceived","HealthAttestationCertificateRequested",
                        "WindowsInformationConfirmed","RemoteManagement","HealthAttestationServerToServerSyncReqConfirmed",
                        "ScepThumbprintSampleConfirmed","HealthAttestationSampleRequestConfirmed","HealthAttestationServerToServerSyncRequested",
                        "HealthAttestationServerToServerSyncRequestFailed","WipeRequest", "InstallApplicationFailed","OwnershipChanged",
                        "WipeConfirmed","FreshDeviceCreatedInDeviceState","UserSetToInactive","ExistingDeviceUpdatedInDeviceState",
                        "HealthAttestationCertificateRequestFailed","AppleOsXmdmDeviceTokenUpdate","DeviceUnenrolled","ScheduleOsUpdateResults",
                        "UserRoleAssignmentModified","UserModified","ComplianceActionTaken","AppleTokenUpdateComplete","UserEnrollmentTokenCreated",
                        "ScheduleOsUpdatesConfirmed","OsUpdateStatusRequested"] or [log_event_name] != "" {
      mutate {
        replace => {
          "principal_ip" => "%{sys_ip}"
          "principal_userid" => "%{user_name}"
        }
      }
      if [ApplicationUUID] != "" {
        mutate {
          replace => {
            "application_uuid.key" => "ApplicationUUID"
            "application_uuid.value.string_value" => "%{ApplicationUUID}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "application_uuid"
          }
        }
      }
      if [MessageText] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{MessageText}"
          }
        }
      }

      if [LogDescription] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{LogDescription}"
          }
        }
      }
    } else if [event_name] in ["AppCatalogLaunch", "InstallApplicationConfirmed", "InstallProfileConfirmed",
                               "BreakMDMConfirmed", "DeviceOperatingSystemChanged", "RemoveProfileConfirmed",
                               "CertificateIssued", "CompromisedStatusChanged", "AppListSampleRefused",
                               "CertificateListSampleRefused", "DeviceInformationRefused", "ProfileListRefused",
                               "SecurityInformation", "SecureChannelCheckIn", "SecurityInformationConfirmed",
                               "StartACMConfirmed", "DeviceAttributeDeviceMCCModified", "DeviceAttributePhoneNumberModified",
                               "AvailableOSUpdatesList", "AvailableOsUpdatesConfirmed"]  or [request_url] != ""{

      if [enrollment_user] != "" and [enrollment_user] != "N/A" {
        mutate {
          replace => {
            "principal_userid" => "%{enrollment_user}"
          }
        }
      }

      if [request_url] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.url" => "%{request_url}"
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
          }
        }
      }

      if [hostname] != "" and [hostname] != "N/A" {
        mutate {
          replace => {
            "principal_hostname" => "%{hostname}"
          }
        }
      }
    }

    # dealing with target fields
    if [event_name] in ["CompliancePolicyModified", "CertificateIssued",
                        "CompromisedStatusChanged", "AppListSampleRefused", "CertificateListSampleRefused",
                        "DeviceInformationRefused", "ProfileListRefused", "SecurityInformation",
                        "SecureChannelCheckIn", "SecurityInformationConfirmed", "StartACMConfirmed",
                        "AdminUserLoggedIn", "AdminUserLoggedOut", "AvailableOSUpdatesList",
                        "AvailableOsUpdatesConfirmed"] {
      mutate {
        replace => {
          "target_ip" => "%{sys_ip}"
          "target_userid" => "%{user_name}"
        }
      }
    } else if [event_name] in ["BreakMDMRequested", "ComplianceNotificationSent", "DeleteDeviceRequested",
                               "Revoked", "ComplianceStatusChanged", "ApplicationDownload", "EnrollmentComplete",
                               "EULAAccepted", "StartACMRequested", "DeviceEnterpriseWipeRequested",
                               "InstallApplicationRequested", "InstallProfileRequested", "RemoveProfileRequested",
                               "ApplicationInstallOnDeviceRequested", "FindDeviceRequested", "RemoveApplicationRequested",
                               "SendMessageRequested", "AuthTokenIssued", "AuthTokenRevoked", "InstallApplicationConfirmed",
                               "InstallProfileConfirmed", "BreakMDMConfirmed", "DeviceOperatingSystemChanged",
                               "RemoveProfileConfirmed", "DeviceAttributeDeviceMCCModified", "DeviceAttributePhoneNumberModified",
                               "AvailableOsUpdatesRequested", "DeviceProfileTypeBlocked", "DeviceProfileTypeUnblocked",
                               "ApplicationRemoveFromDeviceRequested", "DeviceClearPasscodeRequested", "DeviceWipeRequested"] {
      if [enrollment_user] != "" and [enrollment_user] != "N/A" {
        mutate {
          replace => {
            "target_userid" => "%{enrollment_user}"
          }
        }
      }

      if [hostname] != "" and [hostname] != "N/A" {
        mutate {
          replace => {
            "target_hostname" => "%{hostname}"
          }
        }
      }
    }

    # setting specific info based on events
    if [event_name] == "AdminUserLoggedIn" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.administrative_domain" => "%{domain}"
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    } else if [event_name] == "SSPUserLoginAttemptFailed" {
      if [sys_ip] != "" {
         mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "sys_ip"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{User}"
        }
      }

      mutate {
        replace => {
          "sec_action" => "BLOCK"
          "category" => "AUTH_VIOLATION"
        }
      }

      mutate {
        merge => {
          "security_result.action" => "sec_action"
        }
      }

      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    } else if [event_name] == "AdminUserLoggedOut" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
          "event.idm.read_only_udm.target.administrative_domain" => "%{domain}"
        }
      }
    } else if [event_name] in ["AuthTokenIssued", "AuthTokenRevoked"] {
      grok {
        match => {
          "event_data" => [
            ".*AuthenticationGroup=%{HOSTNAME:auth_group}",
            ".*AuthenticationGroup=(?P<auth_group>[^;]*) "
            ]
        }
        on_error => "auth_group_not_found"
      }

      if ![auth_group_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.user.group_identifiers" => "auth_group"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGOUT"
        }
      }
    } else if [event_name] in ["SmartGroupsDeleted", "SmartGroupsModified"] {
      if [SmartGroupName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.group.group_display_name" => "%{SmartGroupName}"
          }
        }
      }

      if [domain] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
          }
        }
      }

      if [event_name] =~ "Deleted" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GROUP_DELETION"
          }
        }
      } else if [event_name] =~ "Modified" and [SmartGroupName] not in ["N/A", ""] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GROUP_MODIFICATION"
          }
        }
      }
    } else if [event_name] == "Revoked" and [event_data] =~ "Certificate" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] == "Revoked" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.type" => "SETTING"
          "event.idm.read_only_udm.metadata.event_type" => "SETTING_DELETION"
        }
      }
    } else if [event_name] in ["DeviceAttributeDeviceMCCModified", "DeviceAttributePhoneNumberModified"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.type" => "SETTING"
          "event.idm.read_only_udm.metadata.event_type" => "SETTING_MODIFICATION"
        }
      }
    } else if [event_name] in ["ProfileModified", "ProfilePublished", "ProfileSetToInactive",
                               "ProfileVersionAdded", "RestrictionPayloadModified"] {
      if [ProfileName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.name" => "%{ProfileName}"
          }
        }
      } else if [Profile] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.name" => "%{Profile}"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
        }
      }
      if [Profile] != "" or [ProfileName] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
          }
        }
      }
    } else if [event_name] == "CompliancePolicyModified" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
          "event.idm.read_only_udm.target.administrative_domain" => "%{domain}"
          "event.idm.read_only_udm.target.resource.type" => "SETTING"
          "event.idm.read_only_udm.metadata.event_type" => "SETTING_MODIFICATION"
        }
      }
    } else if [event_name] in ["ComplianceStatusChanged","ComplianceActionTaken"] {
      mutate {
        replace => {
          "compliance_status" => ""
        }
      }

      grok {
        match => {
          "event_data" => [".*ComplianceStatus=%{GREEDYDATA:compliance_status}.*"]
        }
        overwrite => ["compliance_status"]
        on_error => "compliance_status_not_found"
      }

      if [compliance_status] == "NonCompliant" or [ComplianceStatus] == "NonCompliant"{
        mutate {
          replace => {
            "category" => "POLICY_VIOLATION"
          }
        }
        mutate {
          merge => {
            "security_result.category" => "category"
          }
        }
      }
      if [principal_ip] == "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.type" => "SETTING"
            "event.idm.read_only_udm.metadata.event_type" => "SETTING_MODIFICATION"
          }
        }
      }
    } else if [event_name] in ["DeviceProfileTypeBlocked", "DeviceProfileTypeUnblocked"] {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
          "category" => "POLICY_VIOLATION"
        }
      }

      if [event_name] == "DeviceProfileTypeBlocked" {
        mutate {
          replace => {
            "sec_action" => "BLOCK"
          }
        }
      }

      mutate {
        merge => {
          "security_result.action" => "sec_action"
        }
      }

      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
      if [principal_ip] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.resource.type" => "SETTING"
            "event.idm.read_only_udm.metadata.event_type" => "SETTING_MODIFICATION"
          }
        }
      }
    } else if [event_name] == "ComplianceNotificationSent" {
      mutate {
        replace => {
          "category" => "POLICY_VIOLATION"
        }
      }

      mutate {
        merge => {
          "security_result.category" => "category"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] in ["AppListSampleRefused", "CertificateListSampleRefused", "DeviceInformationRefused",
                               "ProfileListRefused", "SecurityInformation"] {
      grok {
        match => {
          "event_data" => [".*BytesReceived=%{NUMBER:bytes_received}.*"]
        }
        overwrite => ["bytes_received"]
        on_error => "bytes_received_not_found"
      }

      if [bytes_received] not in ["0", ""] {
        mutate {
          replace => {
            "_network.received_bytes" => "%{bytes_received}"
          }

          convert => {
            "_network.received_bytes" => "uinteger"
          }
        }

        mutate {
          rename => {
            "_network" => "event.idm.read_only_udm.network"
          }
        }
      }

      if [principal_userid] == "" and [principal_ip] == "" {
        mutate {
          replace => {
            "additional_event_category.key" => "event_category"
            "additional_event_category.value.string_value" => "%{event_category}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "additional_event_category"
          }
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      } else if [principal_ip] != "" or [principal_hostname] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
          }
        }
      }
    } else if [event_name] in ["StartACMRequested", "AvailableOSUpdatesList", "AvailableOsUpdatesConfirmed",
                               "AvailableOsUpdatesRequested"] {
      if [event_name] in  ["AvailableOSUpdatesList","AvailableOsUpdatesConfirmed","AvailableOsUpdatesRequested"] {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
          }
        }
      }
    } else if [event_name] in ["BreakMDMRequested", "CertificateIssued"] {
      if [principal_ip] == "" and [target_userid] == "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      } else if [target_userid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
    } else if [event_name] == "CompromisedStatusChanged" {
      grok {
        match => {
          "event_data" => [".*CompromisedStatus=%{WORD:compromised_status}.*"]
        }
        overwrite => ["compromised_status"]
        on_error => "compromised_status_not_found"
      }

      if [compromised_status] != "NotCompromised" {
        mutate {
          replace => {
            "category" => "POLICY_VIOLATION"
          }
        }
        mutate {
          merge => {
            "security_result.category" => "category"
          }
        }

        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
        }
      }
      if [principal_ip] == ""  and [principal_userid] == "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
    } else if [event_name] == "DeleteDeviceRequested" {
      mutate {
        replace => {
          "device_serial_number" => ""
          "device_udid" => ""
        }
      }

      grok {
        match => {
          "event_data" => [".*DeviceSerialNumber=(?P<device_serial_number>[\\w\\d]*).*DeviceUdid=(?P<device_udid>[\\w\\d]*)"]
        }
        overwrite => ["device_serial_number", "device_udid"]
        on_error => "device_serial_number_and_udid_not_found"
      }

      if [device_serial_number] != "" and [device_udid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.asset_id" => "%{device_serial_number}:%{device_udid}"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] in ["DeviceClearPasscodeRequested", "DeviceWipeRequested"] {
      if [domain] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] in ["DeviceEnterpriseWipeRequested", "InstallProfileRequested", "RemoveProfileRequested",
                               "FindDeviceRequested"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
        }
      }
      # In some cases, there won't be a sys_ip, so make UDM event a USER_UNCATEGORIZED in order to pass UDM validation.
      if [sys_ip] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
    } else if [event_name] in ["InstallApplicationRequested", "ApplicationInstallOnDeviceRequested", "RemoveApplicationRequested",
                               "SendMessageRequested", "ApplicationAdded", "ApplicationDeleted",
                               "ApplicationRemoveFromDeviceRequested", "ApplicationModified", "ApplicationPublished",
                               "ApplicationPublishFailed", "ApplicationPublishStarted", "ApplicationVersionAdded"] {
      grok {
        match => {
          "event_data" => [".*Application=%{DATA:app_name};.*"]
        }
        overwrite => ["app_name"]
        on_error => "app_not_found"
      }

      if ![app_not_found] {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.application" => "%{app_name}"
          }
        }
      }

      if [domain] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] in ["SecureChannelCheckIn", "SecurityInformationConfirmed", "StartACMConfirmed"] {
      if [principal_ip] == "" or [principal_hostname] == "" and [principal_userid] == "" {
        mutate {
          replace => {
            "additional_event_category.key" => "event_category"
            "additional_event_category.value.string_value" => "%{event_category}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "additional_event_category"
          }
        }
        if [target_userid] == "" and [principal_userid] == "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
            }
          }
        } else {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
      } else {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          }
        }
      }
    } else if [event_name] == "AppCatalogLaunch" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.resource.type" => "APP"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
    } else if [event_name] == "ApplicationDownload" {
      mutate {
        replace => {
          "bytes_received" => ""
        }
      }
      grok {
        match => {
          "event_data" => [".*BytesReceived=(?P<bytes_received>(\\d*)?).*Application:\\s?(?P<app_name>.*)\\s+bytes=(?P<bytes_received>(\\d*)?)-",
                           ".*BytesReceived=(?P<bytes_received>(\\d*)?).*Application:\\s?(?P<app_name>[\\s\\w\\d.-]*)\\b.*"]
        }
        overwrite => ["bytes_received", "app_name"]
        on_error => "bytes_received_not_found"
      }

      if [bytes_received] != "" and [bytes_received] != "0" {
        mutate {
          replace => {
            "_network.received_bytes" => "%{bytes_received}"
          }

          convert => {
            "_network.received_bytes" => "uinteger"
          }
        }

        mutate {
          rename => {
            "_network" => "event.idm.read_only_udm.network"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{app_name}"
          "event.idm.read_only_udm.target.resource.type" => "APP"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
        }
      }
    } else if [event_name] == "EnrollmentComplete" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.type" => "DEVICE"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
        }
      }
    } else if [event_name] == "InstallApplicationConfirmed" {
      if [event_data] =~ "BytesReceived" or [event_data] =~ "Application" {
        grok {
          match => {
            "event_data" => [".*Application=\\s?%{DATA:app_name};.*BytesReceived=(?P<bytes_received>(\\d*)?).*",
            ".*Application=\\s?%{DATA:app_name};"]
          }
          overwrite => ["bytes_received", "app_name"]
          on_error => "bytes_received_not_found"
        }
        if [bytes_received] != "" and [bytes_received] != "0" {
          mutate {
            replace => {
              "_network.received_bytes" => "%{bytes_received}"
            }

            convert => {
              "_network.received_bytes" => "uinteger"
            }
          }
          mutate {
            rename => {
              "_network" => "event.idm.read_only_udm.network"
            }
          }
        }
      }

      if [app_name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.application" => "%{app_name}"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.type" => "APP"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
        }
      }
    } else if [event_name] == "InstallProfileConfirmed" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.type" => "PROFILE"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
        }
      }
    } else if [event_name] in ["BreakMDMConfirmed", "RemoveProfileConfirmed"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_DELETION"
        }
      }
    } else if [event_name] == "DeviceOperatingSystemChanged" {
      if [user_name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.type" => "OS"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
        }
      }
    } else if [event_name] == "EULAAccepted" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.resource.type" => "EULA"
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
        }
      }
    } else if [event_name] in ["AddMissingUserCompletedEvent", "AddMissingUserFailureEvent"] {
      grok {
        match => {
          "GroupManagementData" => [".*User:\\s*%{DATA:group_user}\\s.*"]
        }
        on_error => "group_user_not_found"
      }

      if ![group_user_not_found] {
        mutate {
          replace => {
            "target_userid" => "%{group_user}"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] in ["ApplicationGroupAssignmentModified", "ApplicationGroupCreated"] {
      if [event_name] =~ "Created" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GROUP_CREATION"
          }
        }
      } else if [event_name] =~ "Modified" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "GROUP_MODIFICATION"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.target.group.group_display_name" => "%{ApplicationGroup}"
        }
      }
    } else if [event_name] in ["SyncGroupCompletedEvent", "SyncGroupFailureEvent",
                               "SearchMissingUserCompleteEvent", "SyncAdminFailure",
                               "SyncUserCompletedEvent", "SyncUserFailureEvent"] {
      if [event_name] =~ "Failure" {
        mutate {
          replace => {
            "sec_action" => "BLOCK"
          }
        }

        mutate {
          merge => {
            "security_result.action" => "sec_action"
          }
        }

        if [GroupManagementData] != "" {
          mutate {
            replace => {
              "security_result.description" => "%{GroupManagementData}"
            }
          }
        }

        mutate {
          merge => {
            "event.idm.read_only_udm.security_result" => "security_result"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] == "UserDeleted" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{User}"
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    } else if [event_name] == "DeviceLocationGroupChanged" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
          "event.idm.read_only_udm.principal.administrative_domain" => "%{domain}"

          "event.idm.read_only_udm.target.hostname" => "%{Device}"
        }
      }
      if [LoginSessionID] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{LoginSessionID}"
          }
        }
      }
      if [OriginatingOrganizationGroup] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.group_identifiers" => "OriginatingOrganizationGroup"
          }
        }
      }
    } else if [event_name] == "MergeGroupCompletedEvent" {
      mutate {
        replace => {
          "security_result.description" => "%{GroupManagementData}"
        }
        on_error => "group_management_data_not_present"
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }

      mutate {
        replace => {
          "principal_userid" => "%{user_name}"
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }

      mutate {
        gsub => ["cs_labels", "(\\w+)=", "#$1="]
      }
    # Swapping the values of csLabels
      mutate {
        gsub => ["cs_labels", "#cs\\d+Label=([^#]+) #cs(\\d+)=([^#]+)", "#$1=$3"]
      }

      kv {
        source => "cs_labels"
        field_split => "#"
        value_split => "="
      }

      mutate {
        replace => {
          "event_source_label.key" => "EventSource"
          "event_source_label.value.string_value" => "%{EventSource}"
        }
        on_error => "event_source_not_present"
      }
      if ![event_source_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "event_source_label"
          }
        }
      }

      mutate {
        replace => {
          "event_module_label.key" => "EventModule"
          "event_module_label.value.string_value" => "%{EventModule}"
        }
        on_error => "event_module_not_present"
      }
      if ![event_module_not_present] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "event_module_label"
          }
        }
      }
    } else if [event_name] == "HmacAuthenticationFailure" {
      mutate {
        replace => {
          "additional_event_category.key" => "event_category"
          "additional_event_category.value.string_value" => "%{event_category}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_event_category"
        }
      }

      mutate {
        replace => {
          "additional_event_module.key" => "event_module"
          "additional_event_module.value.string_value" => "%{event_module}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_event_module"
        }
      }
      if [Hmac] != "" {
        mutate {
          replace => {
            "additional_Hmac.key" => "Hmac"
            "additional_Hmac.value.string_value" => "%{Hmac}"
          }
          on_error => "hmac_not_present"
        }
        if ![hmac_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "additional_Hmac"
            }
            on_error => "additional_hmac_not_present"
          }
        }
      }
      if [user_name] != "" and [event_source] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          }
        }
      }

      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
          "event.idm.read_only_udm.target.application" => "%{event_source}"
        }
      }
    }
    else if [event_name] == "TagAssignmentChanged" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
        }
      }
      if [Device] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{Device}"
          }
        }
      }
      if [AdminAccount] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{AdminAccount}"
          }
        }
      }

      if [Tags] != "" {
        mutate {
          replace => {
            "tags_value.key" => "Tags"
            "tags_value.value.string_value" => "%{Tags}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "tags_value"
          }
        }
      }
    }
    else if [event_name] == "EditDevice" {
      if [OriginatingOrganizationGroup] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.group_identifiers" => "OriginatingOrganizationGroup"
          }
        }
      }
      if [OwnershipType] != "" {
        mutate {
          replace => {
            "ownership_value.key" => "OwnershipType"
            "ownership_value.value.string_value" => "%{OwnershipType}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "ownership_value"
          }
        }
      }
      mutate {
        replace => {
          "principal_userid" => "%{user_name}"
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
      if [hostname] != "" and [hostname] != "N/A" {
        mutate {
          replace => {
            "principal_hostname" => "%{hostname}"
          }
        }
      }
    }
    else if [event_name] == "DeviceSensorSampleReceived" {
      if [MessageText] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{MessageText}"
          }
          on_error => "message_text_not_present"
        }
      }
    }
    else if [event_name] == "ScriptFailedToExecuteOnDevice" {
      grok {
        match => {
          "MessageText" => "%{DATA:desc} : \\[ %{GREEDYDATA:kvmsg} \\]"
        }
        overwrite => ["desc", "kvmsg"]
        on_error => "script_failed_to_execute_on_device_not_match"
      }
      if [desc] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.description" => "%{desc}"
          }
          on_error => "desc_not_present"
        }
      }
      kv {
        source => "kvmsg"
        field_split => "|"
        value_split => ":"
        on_error => "kvmsg_not_match"
      }
      if [ScriptName] != "" {
        mutate {
          replace => {
            "scriptname_label.key" => "ScriptName"
            "scriptname_label.value.string_value" => "%{ScriptName}"
          }
          on_error => "scriptname_not_present"
        }
        if ![scriptname_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "scriptname_label"
            }
            on_error => "additional_scriptname_not_present"
          }
        }
      }
      if [ScriptUuid] != "" {
        mutate {
          replace => {
            "scriptuuid_label.key" => "ScriptUuid"
            "scriptuuid_label.value.string_value" => "%{ScriptUuid}"
          }
          on_error => "scriptuuid_not_present"
        }
        if ![scriptuuid_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "scriptuuid_label"
            }
            on_error => "additional_scriptuuid_not_present"
          }
        }
      }
      if [LogId] != "" {
        mutate {
          replace => {
            "logid_label.key" => "LogId"
            "logid_label.value.string_value" => "%{LogId}"
          }
          on_error => "logid_not_present"
        }
        if ![logid_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "logid_label"
            }
            on_error => "additional_logid_not_present"
          }
        }
      }
      if [VersionUuid] != "" {
        mutate {
          replace => {
            "versionuuid_label.key" => "VersionUuid"
            "versionuuid_label.value.string_value" => "%{VersionUuid}"
          }
          on_error => "versionuuid_not_present"
        }
        if ![versionuuid_not_present] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "versionuuid_label"
            }
            on_error => "additional_version_uuid_merge_error"
          }
        }
      }
    }
    else {
      if [event_name] in ["CertificateListSampleRefused", "HealthAttestationCertificateRequestConfirmed",
                          "WindowsDeviceCheckInMode","SampleResponseListReceived","HealthAttestationCertificateRequested",
                          "WindowsInformationConfirmed","RemoteManagement","HealthAttestationServerToServerSyncReqConfirmed",
                          "ScepThumbprintSampleConfirmed","HealthAttestationSampleRequestConfirmed","HealthAttestationServerToServerSyncRequested",
                          "HealthAttestationServerToServerSyncRequestFailed","WipeRequest","InstallApplicationFailed","OwnershipChanged","WipeConfirmed",
                          "FreshDeviceCreatedInDeviceState","UserSetToInactive","ExistingDeviceUpdatedInDeviceState","HealthAttestationCertificateRequestFailed",
                          "AppleOsXmdmDeviceTokenUpdate","DeviceUnenrolled","ScheduleOsUpdateResults","UserRoleAssignmentModified","UserModified",
                          "AppleTokenUpdateComplete","UserEnrollmentTokenCreated","ScheduleOsUpdatesConfirmed","OsUpdateStatusRequested"] or [log_event_name] != "" {
        if [user_name] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
            }
          }
        }
      }
    }
    # udm events missing fields validation
    if [event][idm][read_only_udm][metadata][event_type] == "USER_RESOURCE_CREATION" {
      if [principal_userid] == "" and [user_name] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
            "event.idm.read_only_udm.principal.user.userid" => "%{user_name}"
          }
        }
      }
    }
    # all good, converting to principal and target fields
    if [principal_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "principal_ip"
        }
      }
    }

    if [principal_userid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{principal_userid}"
        }
      }
    }

    if [principal_hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{principal_hostname}"
        }
      }
    }

    if [target_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "target_ip"
        }
      }
    }

    if [target_userid] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.user.userid" => "%{target_userid}"
        }
      }
    }

    if [target_hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
        }
      }
    }

    if [event_module] != "" {
      mutate {
        replace => {
          "event_module_labels.key" => "Event Module"
          "event_module_labels.value.string_value" => "%{event_module}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event_module_labels"
        }
      }
    }

    if [event_category] != "" {
      mutate {
        replace => {
          "additional_event_categories.key" => "Event Category"
          "additional_event_categories.value.string_value" => "%{event_category}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_event_categories"
        }
      }
      mutate {
        replace => {
          "sec_category_details" => "%{event_category}"
        }
      }
      mutate {
        merge => {
          "security_result.category_details" => "sec_category_details"
        }
      }
    }
    if [event_source] != "" {
      mutate {
        replace => {
          "additional_event_sources.key" => "Event Source"
          "additional_event_sources.value.string_value" => "%{event_source}"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "additional_event_sources"
        }
      }
    }
    if [desc] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{desc}"
        }
        on_error => "desc_not_present"
      }
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
  }
  else if ![grok_parse_failure] {
    date {
      match => ["event_time", "dd/MMM/yyyy:HH:mm:ss Z"]
      on_error => "event_time_not_match"
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "AirWatch"
        "event.idm.read_only_udm.metadata.vendor_name" => "VMWare"
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_data}"
      }
    }

    if [event_data] =~ "(?i)session" {
      if [hash_value] =~ "org$" {
        mutate {
          rename => {
            "hash_value" => "event.idm.read_only_udm.principal.administrative_domain"
          }
        }
      }
    }


    if [application_protocol] =~ "HTTP" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "HTTP"
        }
        on_error => "application_protocol_not_found"
      }
      if [hash_value] != "" {
        mutate {
          gsub => ["hash_value" , '\\"' , ""]
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.administrative_domain" => "%{hash_value}"
          }
          on_error => "hash_value_not_found"
        }
      }
    }

    if [method] not in ["" , "N/A" , " " , "-"] {
      mutate {
        gsub => ["method" , '\\"' , ""]
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{method}"
        }
        on_error => "method_not_found"
      }
    }

    mutate {
      gsub => ["url" , '\\"' , ""]
    }

    if [url] not in ["" , "N/A" , " " , "-"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{url}"
        }
        on_error => "url_not_found"
      }
    }

    if [response_code] not in ["" , "N/A" , " " , "-"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" => "%{response_code}"
        }
        on_error => "response_code_not_found"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
        on_error => "response_code_not_convert"
      }
    }

    if ([principal_hostname] != "" or [src_ip] != "") and ([target_hostname] != "" or [target_ip] != "") {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
    else if [principal_hostname] != "" or [src_ip] != "" or [sys_ip] != ""{
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
        on_error => "event_type_staus_not_found"
      }
    }
    else if [src_user] != "" and [deviceN] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [deviceN] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }


    if [user_info] not in ["", "-"] {
      mutate {
        rename => {
          "user_info" => "event.idm.read_only_udm.principal.user.user_display_name"
        }
      }
    }

    if [method_url] != "" {
      grok {
        match => {
          "method_url" => "%{DATA:http_method}\\s%{GREEDYDATA:target_url}\\s%{GREEDYDATA:application_protocol}"
        }
        overwrite => ["http_method", "target_url", "application_protocol"]
        on_error => "url_not_match"
      }

      if ![url_not_match] {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.http.method" => "%{http_method}"
            "event.idm.read_only_udm.target.url" => "%{target_url}"
          }
        }

        if [application_protocol] =~ "HTTP" {
          mutate {
            replace => {
              "event.idm.read_only_udm.network.application_protocol" => "HTTP"
            }
          }
        }
      }
    }

    if [referral_url] != "" {
      mutate {
        rename => {
          "referral_url" => "event.idm.read_only_udm.network.http.referral_url"
        }
      }
    }

    if [user_agent] != "" {
      mutate {
        gsub => ["user_agent" , '\\"' , ""]
      }
      mutate {
        rename => {
          "user_agent" => "event.idm.read_only_udm.network.http.user_agent"
        }
      }
    }

    if [http_status] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" => "%{http_status}"
        }
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
      }
    }

    if [process_id] != "" {
      grok {
        match => {
          "process_id" => [ "%{INT:p_id}(?:#%{DATA}|)" ]
        }
        on_error => "process_id_not_match"
      }

      mutate {
        rename => {
          "p_id" => "event.idm.read_only_udm.principal.process.pid"
        }
      }
    }

    if [src_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
        }
      }
    }

    if [principal_hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{principal_hostname}"
        }
      }
    }

    if [target_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "target_ip"
        }
      }
    }

    if [target_hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
        }
      }
    }

    if [protocol] == "UDP" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "UDP"
        }
      }
    } else if [protocol] == "TCP" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.ip_protocol" => "TCP"
        }
      }
    }

     if [device_type] != "" {
      mutate {
        replace => {
          "device_type_label.key" => "device_type"
          "device_type_label.value.string_value" => "%{device_type}"
        }
        on_error => "device_type_not_found"
      }
      if ![device_type_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "device_type_label"
          }
          on_error => "device_type_merge_not_found"
        }
      }
    }

    if [target_port] != "" {
      mutate {
        rename => {
          "target_port" => "event.idm.read_only_udm.target.port"
        }
        convert => {
          "event.idm.read_only_udm.target.port" => "integer"
        }
      }
    }

    if [summary] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{summary}"
        }
      }
    }

    if [description] != "" {
      grok {
        match => {
          "description" => [ "%{IP:intermediary_ip}\\s%{GREEDYDATA:des}" ]
        }
        overwrite => ["intermediary_ip", "des"]
        on_error => "not_contains_ip"
      }

      if ![not_contains_ip] {
        mutate {
          merge => {
            "intermediary.ip" => "intermediary_ip"
          }
        }
        if [des] != "" {
          mutate {
            replace => {
              "security_result.description" => "%{des}"
            }
            on_error => "description_not_found"
          }
        }
      } else if [description] != "" {
        mutate {
          replace => {
            "security_result.description" => "%{description}"
          }
          on_error => "description_not_found"
        }
      }
    }

    if [intermediary] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.intermediary" => "intermediary"
        }
      }
    }
    if [sys_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "sys_ip"
        }
      }
    }
    if [security_result] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
  }

  if [event][idm][read_only_udm][metadata][event_type] == "GENERIC_EVENT" or [log_event_name] != "" {
    if [principal_userid] != ""  or [target_ip] != "" or [src_user] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
  }
  else if [vendor_action_category] =~ "Login" {
    if [tuser] not in ["", "N/A"] || [deviceN] not in ["", "N/A"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
  }
  else if [event][idm][read_only_udm][metadata][event_type] == "" && [user] != "" && [has_target_user] == "true" && [event_name] =~ "UserModified" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PERMISSIONS"
      }
      on_error => "user_not_found"
    }
  }
  else if [event][idm][read_only_udm][metadata][event_type] == "" and [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "user_not_found"
    }
  }
  else if [event][idm][read_only_udm][metadata][event_type] == "GENERIC_EVENT" and [src_user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
      on_error => "user_name_not_found"
    }
  }
  else if [event][idm][read_only_udm][metadata][event_type] == "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
