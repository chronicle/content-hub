# Product: Aqua Security
# Category: IaaS Applications
# Supported Format: JSON
# Reference: https://buganizer.corp.google.com/action/issues/184652123/attachments/32931173?download=true
# Last Updated: 2025-07-03
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "event_type" => ""
      "src_ip" => ""
      "user_id" => ""
      "jsonPayload.adjective" => ""
      "jsonPayload.cfappname" => ""
      "jsonPayload.cfspace" => ""
      "jsonPayload.command" => ""
      "jsonPayload.container" => ""
      "jsonPayload.description" => ""
      "jsonPayload.hostip" => ""
      "jsonPayload.hostgroup" => ""
      "jsonPayload.image" => ""
      "jsonPayload.level" => ""
      "jsonPayload.reason" => ""
      "jsonPayload.rule" => ""
      "jsonPayload.user" => ""
      "jsonPayload.vm_name" => ""
      "jsonPayload.vm_location" => ""
      "jsonPayload.hostid" => ""
      "jsonPayload.category" => ""
      "jsonPayload.action" => ""
      "sec_result" => ""
      "res.labels.instance_id" => ""
      "res.labels.project_id" => ""
      "res.labels.zone" => ""
      "instance_id" => ""
      "project_id" => ""
      "zone" => ""
      "jsonPayload.host" => ""
      "action" => ""
      "category" => ""
      "container" => ""
      "image" => ""
      "imageid" => ""
      "host" => ""
      "vm_name" => ""
      "vm_location" => ""
      "hostgroup" => ""
      "hostid" => ""
      "hostip" => ""
      "level" => ""
      "vm_tags" => ""
      "vm_id" => ""
      "vm_image_id" => ""
      "vm_group" => ""
      "vm_azure_subscription" => ""
      "technique" => ""
      "tactic" => ""
      "rule_type" => ""
      "rule" => ""
      "repository" => ""
      "podtype" => ""
      "podname" => ""
      "podjob" => ""
      "podnamespace" => ""
      "k8s_cluster" => ""
      "reason" => ""
      "vm_tags_label" => ""
      "vm_image_id_label" => ""
      "vm_group_label" => ""
      "vm_azure_subscription_label" => ""
      "technique_label" => ""
      "tactic_label" => ""
      "repository_label" => ""
      "podtype_label" => ""
      "podname_label" => ""
      "podnamespace_label" => ""
      "podjob_label" => ""
      "k8s_cluster_label" => ""
      "description" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "timestamp" => ""
      "time" => ""
    }
  }

  mutate {
    gsub => ["message", "resource", "res"]
  }

  json {
    source => "message"
    on_error => "not_json"
    array_function => "split_columns"
  }

  if [not_json] {
    drop {}
  }
  mutate {
    convert => {
      "timestamp" => "string"
    }
    on_error => "already_string"
  }
  if [timestamp] not in ["", "0"] {
    mutate {
      gsub => ["timestamp","(\\d{10})\\d+" ,"$1" ]
    }
    if ![already_string] {
      date {
        match => ["timestamp", "ISO8601", "UNIX", "UNIX_MS"]
        on_error => "invalid_timestamp"
      }
    }
  }
  else if [time] != "" {
    mutate {
      convert => {
        "time" => "string"
      }
      on_error => "already_string"
    }
    date {
      match => ["time", "ISO8601", "UNIX", "UNIX_MS"]
      on_error => "invalid_time"
    }
  }
  if [jsonPayload][command] != "" {
    grok {
      match => {
        "jsonPayload.command" => "user %{GREEDYDATA:user_id} \\(%{IP:src_ip}\\)"
      }
      overwrite => ["user_id", "src_ip"]
    }
  }
  if [jsonPayload][cfappname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{jsonPayload.cfappname}"
      }
    }
  }

  if [jsonPayload][vm_location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.location.name" => "%{jsonPayload.vm_location}"
      }
    }
  }

   if [vm_location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.location.name" => "%{vm_location}"
      }
      on_error => "vm_location_is_empty"
    }
  }

  if [jsonPayload][container] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.product_object_id" => "%{jsonPayload.container}"
      }
    }
  }

  if [container] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.product_object_id" => "%{container}"
      }
      on_error => "container_is_empty"
    }
  }

  if [jsonPayload][adjective] != "" {
    mutate {
      replace => {
        "jsonPayload.image" => "%{jsonPayload.adjective}"
      }
    }
  }

  if [jsonPayload][image] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{jsonPayload.image}"
      }
    }
  }

  if [image] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{image}"
      }
      on_error => "image_is_empty"
    }
  }

  if [imageid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{imageid}"
      }
      on_error => "imageid_is_empty"
    }
  }

  if [jsonPayload][hostip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "jsonPayload.hostip"
      }
      replace => {
        "has_target" => "true"
      }
    }
  }

  if [hostip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "hostip"
      }
      replace => {
        "has_target" => "true"
      }
      on_error => "hostip_is_empty"
    }
  }

  if [jsonPayload][hostid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset_id" => "host id: %{jsonPayload.hostid}"
      }
    }
  }

  if [hostid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset_id" => "host id: %{hostid}"
      }
      on_error => "hostid_is_empty"
    }
  }


  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
      replace => {
        "has_principal" => "true"
      }
      on_error => "src_ip_is_empty"
    }
  }

  if [jsonPayload][cfspace] != "" {
    mutate {
      replace => {
        "user_id" => "%{jsonPayload.cfspace}"
      }
    }
  }
  else if [jsonPayload][user] != "" {
    mutate {
      replace => {
        "user_id" => "%{jsonPayload.user}"
      }
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user_id}"
      }
    }
  }

  if ([jsonPayload][level] != "" and [jsonPayload][level] == "success") or ([level] != "" and [level] == "success") {
    mutate {
      replace => {
        "security_action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "sec_result.action" => "security_action"
     }
    }
  }

  if [jsonPayload][rule] != "" {
    mutate {
      replace => {
        "sec_result.rule_name" => "%{jsonPayload.rule}"
      }
    }
  }

   if [rule] != "" {
    mutate {
      replace => {
        "sec_result.rule_name" => "%{rule}"
      }
      on_error => "rule_is_empty"
    }
  }

  if [jsonPayload][category] =~ "CVE" {
    kv {
      source => "jsonPayload.data"
      value_split => ":"
      field_split => ","
    }
    mutate {
      replace => {
        "registry1.key" => "Registry"
        "registry1.value" => "%{registry}"
        "start_time1.key" => "Start_Time"
        "start_time1.value" => "%{start_time}"
        "critical1.key" => "Critical"
        "critical1.value" => "%{critical}"
        "high1.key" => "High"
        "high1.value" => "%{high}"
        "medium1.key" => "Medium"
        "medium1.value" => "%{medium}"
        "low1.key" => "Low"
        "low1.value" => "%{low}"
        "malware1.key" => "Malware"
        "malware1.value" => "%{malware}"
      }
    }
    mutate {
      merge => {
        "sec_result.detection_fields" => "registry1"
      }
    }
    mutate {
      merge => {
        "sec_result.detection_fields" => "start_time1"
      }
    }
    mutate {
      merge => {
        "sec_result.detection_fields" => "critical1"
      }
    }
    mutate {
      merge => {
        "sec_result.detection_fields" => "high1"
      }
    }
    mutate {
      merge => {
        "sec_result.detection_fields" => "medium1"
      }
    }
    mutate {
      merge => {
        "sec_result.detection_fields" => "low1"
      }
    }
    mutate {
      merge => {
        "sec_result.detection_fields" => "malware1"
      }
    }

    mutate {
      replace => {
        "sec_cat" => "SOFTWARE_MALICIOUS"
      }
    }
    mutate {
      merge => {
        "sec_result.category" => "sec_cat"
      }
    }
  }

  if [jsonPayload][reason] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{jsonPayload.reason}"
      }
    }
  }
  else if [jsonPayload][description] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{jsonPayload.description}"
      }
    }
  }

  if [reason] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{reason}"
      }
      on_error => "reason_is_empty"
    }
  }


  if [jsonPayload][action] != "" or [action] != ""{
    mutate {
      replace => {
        "sec_result.summary" => "%{jsonPayload.action}"
      }
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{action}"
      }
      on_error => "action_is_empty"
    }
  }
  mutate {
    replace => {
      "instance_id" => "%{res.labels.instance_id}"
    }
    on_error => "instance_id_is_empty"
  }
  mutate {
    replace => {
      "project_id" => "%{res.labels.project_id}"
    }
    on_error => "project_id_is_empty"
  }
  mutate {
    replace => {
      "zone" => "%{res.labels.zone}"
    }
    on_error => "zone_is_empty"
  }

  if [jsonPayload][host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{jsonPayload.host}"
        "has_principal" => "true"
      }
      on_error => "host_is_empyt"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "host_is_empyt"
    }
  }

  if [jsonPayload][vm_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{jsonPayload.vm_name}"
      }
      on_error => "vm_name_is_empty"
    }
  }

  if [vm_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{vm_name}"
      }
      on_error => "vm_name_is_empty"
    }
  }

  if [jsonPayload][category] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.category" => "%{jsonPayload.category}"
      }
      on_error => "category_is_empty"
    }
  }
  if [category] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.category" => "%{category}"
      }
      on_error => "category_is_empty"
    }
  }

  if [instance_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{instance_id}"
      }
      on_error => "instance_id_is_empty"
    }
  }

  if [zone] != "" {
    mutate {
      replace => {
       "event.idm.read_only_udm.target.asset.attribute.cloud.availability_zone" => "%{zone}"
      }
      on_error => "zone_is_empty"
    }
  }

  if [project_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset.attribute.cloud.project.id" => "%{project_id}"
      }
      on_error => "project_id_is_empty"
    }
  }

  if [vm_tags] != "" {
    mutate {
      replace => {
        "vm_tags_label.key" => "VM_Tags"
        "vm_tags_label.value.string_value" => "%{vm_tags}"
      }
      on_error => "vm_tags_is_empty"
    }
    if ![vm_tags_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vm_tags_label"
        }
      }
    }
  }

  if [vm_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{vm_id}"
      }
      on_error => "vm_id_is_empty"
    }
  }

  if [vm_image_id] != "" {
    mutate {
      replace => {
        "vm_image_id_label.key" => "vm_image_id"
        "vm_image_id_label.value.string_value" => "%{vm_image_id}"
      }
      on_error => "vm_image_id_is_empty"
    }
    if ![vm_image_id_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vm_image_id_label"
        }
      }
    }
  }

  if [vm_group] != "" {
    mutate {
      replace => {
        "vm_group_label.key" => "vm_group"
        "vm_group_label.value.string_value" => "%{vm_group}"
      }
      on_error => "vm_group_is_empty"
    }
    if ![vm_group_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vm_group_label"
        }
      }
    }
  }

  if [vm_azure_subscription] != "" {
    mutate {
      replace => {
        "vm_azure_subscription_label.key" => "vm_azure_subscription"
        "vm_azure_subscription_label.value.string_value" => "%{vm_azure_subscription}"
      }
      on_error => "vm_azure_subscription_is_empty"
    }
    if ![vm_azure_subscription_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vm_azure_subscription_label"
        }
      }
    }
  }

  if [technique] != "" {
    mutate {
      replace => {
        "technique_label.key" => "technique"
        "technique_label.value.string_value" => "%{technique}"
      }
      on_error => "technique_is_empty"
    }
    if ![technique_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "technique_label"
        }
      }
    }
  }

  if [tactic] != "" {
    mutate {
      replace => {
        "tactic_label.key" => "tactic"
        "tactic_label.value.string_value" => "%{tactic}"
      }
      on_error => "tactic_is_empty"
    }
    if ![tactic_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tactic_label"
        }
      }
    }
  }

  if [rule_type] != "" {
    mutate {
      replace => {
        "sec_result.rule_type" => "%{rule_type}"
      }
      on_error => "rule_type_is_empty"
    }
  }

  if [rule] != "" {
    mutate {
      replace => {
        "sec_result.rule_name" => "%{rule}"
      }
      on_error => "rule_type_is_empty"
    }
  }

  if [repository] != "" {
    mutate {
      replace => {
        "repository_label.key" => "repository"
        "repository_label.value.string_value" => "%{repository}"
      }
      on_error => "repository_is_empty"
    }
    if ![repository_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "repository_label"
        }
      }
    }
  }

  if [podtype] != "" {
    mutate {
      replace => {
        "podtype_label.key" => "podtype"
        "podtype_label.value.string_value" => "%{podtype}"
      }
      on_error => "podtype_is_empty"
    }
    if ![podtype_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "podtype_label"
        }
      }
    }
  }

  if [podname] != "" {
    mutate {
      replace => {
        "podname_label.key" => "podname"
        "podname_label.value.string_value" => "%{podname}"
      }
      on_error => "podname_is_empty"
    }
    if ![podname_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "podname_label"
        }
      }
    }
  }

  if [podnamespace] != "" {
    mutate {
      replace => {
        "podnamespace_label.key" => "podnamespace"
        "podnamespace_label.value.string_value" => "%{podnamespace}"
      }
      on_error => "podnamespace_is_empty"
    }
    if ![podnamespace_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "podnamespace_label"
        }
      }
    }
  }

  if [podjob] != "" {
    mutate {
      replace => {
        "podjob_label.key" => "podjob"
        "podjob_label.value.string_value" => "%{podjob}"
      }
      on_error => "podjob_is_empty"
    }
    if ![podjob_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "podjob_label"
        }
      }
    }
  }

  if [k8s_cluster] != "" {
    mutate {
      replace => {
        "k8s_cluster_label.key" => "k8s_cluster"
        "k8s_cluster_label.value.string_value" => "%{k8s_cluster}"
      }
      on_error => "k8s_cluster_is_empty"
    }
    if ![k8s_cluster_is_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "k8s_cluster_label"
        }
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }


  if[jsonPayload][action] in ["login", "Login"] or [action] in ["login", "Login"] {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
      }
    }
    if [jsonPayload][description] =~ "SAML" or [description] =~ "SAML" {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "SSO"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
        }
      }
    }
  }
  else if [jsonPayload][action] == "start" or [action] == "start" {
    mutate {
      replace => {
        "event_type" => "STATUS_STARTUP"
      }
    }
  }
  else if [jsonPayload][action] == "stop" or [action] == "stop" {
    mutate {
      replace => {
        "event_type" => "STATUS_SHUTDOWN"
      }
    }
  }
  else if [jsonPayload][action] == ["Hosts cleanup"] or [action] == ["Hosts cleanup"]  and ( [has_principal] == "true"  and [has_target] == "true" ) {
    mutate {
      replace => {
        "event_type" => "RESOURCE_DELETION"
      }
    }
  }
  else if [jsonPayload][action] == ["Create New Repository"] or [action] == ["Create New Repository"]  and ( [has_principal] == "true"  and [has_target] == "true" ) {
    mutate {
      replace => {
        "event_type" => "RESOURCE_CREATION"
      }
    }
  }
  else if [jsonPayload][action] == ["Scan"]  and ([jsonPayload][hostip] != "" or [src_ip] != "" or [jsonPayload][host] != "" or [jsonPayload][hostid] != "" ) or ([action] == ["Scan"]  and ([hostip] != "" or [src_ip] != "" or [host] != "" or [hostid] != "" )){
    mutate {
      replace => {
        "event_type" => "SCAN_HOST"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if  [has_target] == "true" or [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      rename => {
        event_type => "event.idm.read_only_udm.metadata.event_type"
      }
    }
  }

  if [jsonPayload][hostgroup] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.group.group_display_name" => "%{jsonPayload.hostgroup}"
      }
    }
  }

  if [hostgroup] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.group.group_display_name" => "%{hostgroup}"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.target.asset.attribute.cloud.environment" => "GOOGLE_CLOUD_PLATFORM"
      "event.idm.read_only_udm.metadata.product_name" => "AQUA_SECURITY"
      "event.idm.read_only_udm.metadata.vendor_name" => "AQUA_SECURITY"
      "event.idm.read_only_udm.target.resource.type" => "VIRTUAL_MACHINE"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

