# Product: AliCloud ActionTrail
# Category: ActionTrail
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-09-29
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "__time__" => ""
      "event" => ""
      "acsRegion" => ""
      "eventCategory" => ""
      "eventId" => ""
      "eventName" => ""
      "eventSource" => ""
      "eventTime" => ""
      "eventVersion" => ""
      "recipientAccountId" => ""
      "requestParameterJson" => ""
      "resourceName" => ""
      "resourceType" => ""
      "serviceName" => ""
      "sourceIpAddress" => ""
      "userAgent" => ""
      "userIdentity_accountId" => ""
      "userIdentity_principalId" => ""
      "userIdentity_type" => ""
      "userIdentity_userName" => ""
      "userIdentity_sessionContext_attributes_creationDate" => ""
      "req_client_port" => ""
      "req_region_id" => ""
      "resp_message" => ""
      "resp_code" => ""
      "resp_success" => ""
      "principal_ip" => ""
      "sec_action" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_principal_user" => "false"
      "has_resource" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_failure"
  }

  if [json_parse_failure] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  if [event] != "" {
    json {
      source => "event"
      array_function => "split_columns"
      on_error => "event_json_parse_failure"
    }
  }

  if [requestParameterJson] != "" {
    json {
      source => "requestParameterJson"
      target => "requestParameters"
      array_function => "split_columns"
      on_error => "req_param_json_parse_failure"
    }
  }

  mutate {
    convert => {
      "__time__" => "string"
    }
    on_error => "time_convert_failure"
  }

  if [eventTime] != "" {
    date {
      match => ["eventTime", "ISO8601", "yyyy-MM-ddTHH:mm:ssZ", "RFC3339"]
      target => "event1.idm.read_only_udm.metadata.event_timestamp"
      on_error => "event_time_parse_failure"
    }
  }

  if [__time__] != "" {
    date {
      match => ["__time__", "UNIX", "UNIX_MS"]
      target => "event1.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "collected_time_parse_failure"
    }
  }

  if [eventId] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_log_id" => "%{eventId}"
      }
      on_error => "event_id_replace_failure"
    }
  }

  if [eventName] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_event_type" => "%{eventName}"
      }
      on_error => "event_name_replace_failure"
    }
  }

  if [eventCategory] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.description" => "%{eventCategory}"
      }
      on_error => "event_category_replace_failure"
    }
  }

  if [eventVersion] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.product_version" => "%{eventVersion}"
      }
      on_error => "event_version_replace_failure"
    }
  }

  if [acsRegion] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.location.name" => "%{acsRegion}"
      }
      on_error => "acs_region_replace_failure"
    }
  }

  if [serviceName] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.application" => "%{serviceName}"
        "has_target" => "true"
      }
      on_error => "service_name_replace_failure"
    }
  }

  if [eventSource] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.hostname" => "%{eventSource}"
        "event1.idm.read_only_udm.target.asset.hostname" => "%{eventSource}"
        "has_target" => "true"
      }
      on_error => "event_source_replace_failure"
    }
  }

  if [recipientAccountId] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.resource.product_object_id" => "%{recipientAccountId}"
        "has_target" => "true"
        "has_resource" => "true"
      }
      on_error => "recipient_account_id_replace_failure"
    }
  }

  if [resourceName] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.resource.name" => "%{resourceName}"
        "has_target" => "true"
        "has_resource" => "true"
      }
      on_error => "resource_name_replace_failure"
    }
  }

  if [resourceType] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.resource.resource_subtype" => "%{resourceType}"
        "has_target" => "true"
        "has_resource" => "true"
      }
      on_error => "resource_type_replace_failure"
    }
  }

  for ref_key, ref_val in referencedResources map {
    mutate {
      replace => {
        "is_array" => "false"
      }
    }
    for idx, val in ref_val {
      mutate {
        replace => {
          "referenced_resource_label" => ""
          "is_array" => "true"
        }
      }
      mutate {
        convert => {
          "idx" => "string"
          "val" => "string"
        }
        on_error => "ref_val_convert_failure"
      }
      if [val] != "" {
        mutate {
          replace => {
            "referenced_resource_label.key" => "referencedResources_%{ref_key}_%{idx}"
            "referenced_resource_label.value" => "%{val}"
          }
          on_error => "referenced_resource_label_replace_failure"
        }
        if ![referenced_resource_label_replace_failure] {
          mutate {
            merge => {
              "event1.idm.read_only_udm.target.resource.attribute.labels" => "referenced_resource_label"
            }
            on_error => "referenced_resource_label_merge_failure"
          }
        }
      }
    }
    if [is_array] == "false" {
      mutate {
        convert => {
          "ref_val" => "string"
        }
        on_error => "ref_val_str_convert_failure"
      }
      if [ref_val] != "" {
        mutate {
          replace => {
            "referenced_resource_label" => ""
          }
        }
        mutate {
          replace => {
            "referenced_resource_label.key" => "referencedResources_%{ref_key}"
            "referenced_resource_label.value" => "%{ref_val}"
          }
          on_error => "referenced_resource_label_replace_failure"
        }
        if ![referenced_resource_label_replace_failure] {
          mutate {
            merge => {
              "event1.idm.read_only_udm.target.resource.attribute.labels" => "referenced_resource_label"
            }
            on_error => "referenced_resource_label_merge_failure"
          }
        }
      }
    }
  }

  if [sourceIpAddress] != "" {
    grok {
      match => {
        "sourceIpAddress" => "%{IP:principal_ip}"
      }
      overwrite => ["principal_ip"]
      on_error => "not_valid_ip"
    }
    if [principal_ip] != "" {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.ip" => "principal_ip"
          "event1.idm.read_only_udm.principal.asset.ip" => "principal_ip"
        }
        on_error => "principal_ip_merge_failure"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    } else {
      mutate {
        replace => {
          "event1.idm.read_only_udm.principal.hostname" => "%{sourceIpAddress}"
          "event1.idm.read_only_udm.principal.asset.hostname" => "%{sourceIpAddress}"
          "has_principal" => "true"
        }
        on_error => "principal_hostname_replace_failure"
      }
    }
  }

  if [userAgent] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.network.http.user_agent" => "%{userAgent}"
        "event1.idm.read_only_udm.network.http.parsed_user_agent" => "%{userAgent}"
      }
      on_error => "user_agent_replace_failure"
    }
    mutate {
      convert => {
        "event1.idm.read_only_udm.network.http.parsed_user_agent" => "parseduseragent"
      }
      on_error => "parsed_user_agent_convert_failure"
    }
  }

  mutate {
    replace => {
      "userIdentity_accountId" => "%{userIdentity.accountId}"
    }
    on_error => "user_identity_account_id_empty"
  }
  if [userIdentity_accountId] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.user.userid" => "%{userIdentity_accountId}"
        "has_principal_user" => "true"
      }
      on_error => "user_identity_account_id_replace_failure"
    }
  }

  mutate {
    replace => {
      "userIdentity_principalId" => "%{userIdentity.principalId}"
    }
    on_error => "user_identity_principal_id_empty"
  }
  if [userIdentity_principalId] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.user.product_object_id" => "%{userIdentity_principalId}"
        "has_principal_user" => "true"
      }
      on_error => "user_identity_principal_id_replace_failure"
    }
  }

  mutate {
    replace => {
      "userIdentity_userName" => "%{userIdentity.userName}"
    }
    on_error => "user_identity_user_name_empty"
  }
  if [userIdentity_userName] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.user.user_display_name" => "%{userIdentity_userName}"
        "has_principal_user" => "true"
      }
      on_error => "user_identity_user_name_replace_failure"
    }
  }

  mutate {
    replace => {
      "userIdentity_type" => "%{userIdentity.type}"
    }
    on_error => "user_identity_type_empty"
  }
  if [userIdentity_type] != "" {
    mutate {
      replace => {
        "role.name" => "%{userIdentity_type}"
      }
      on_error => "role_name_replace_failure"
    }
    if ![role_name_replace_failure] {
      mutate {
        merge => {
          "event1.idm.read_only_udm.principal.user.attribute.roles" => "role"
        }
        on_error => "role_merge_failure"
      }
    }
  }

  mutate {
    replace => {
      "userIdentity_sessionContext_attributes_creationDate" => "%{userIdentity.sessionContext.attributes.creationDate}"
    }
    on_error => "creation_date_empty"
  }
  if [userIdentity_sessionContext_attributes_creationDate] != "" {
    date {
      match => ["userIdentity_sessionContext_attributes_creationDate", "ISO8601", "yyyy-MM-ddTHH:mm:ssZ", "RFC3339"]
      target => "event1.idm.read_only_udm.principal.user.attribute.creation_time"
      on_error => "creation_date_parse_failure"
    }
  }

  mutate {
    convert => {
      "requestParameters.ClientPort" => "string"
    }
    on_error => "client_port_convert_string_failure"
  }
  mutate {
    replace => {
      "req_client_port" => "%{requestParameters.ClientPort}"
    }
    on_error => "req_client_port_empty"
  }
  if [req_client_port] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.principal.port" => "%{req_client_port}"
      }
      on_error => "principal_port_replace_failure"
    }
    mutate {
      convert => {
        "event1.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "principal_port_convert_failure"
    }
  }

  mutate {
    replace => {
      "req_region_id" => "%{requestParameters.RegionId}"
    }
    on_error => "req_region_id_empty"
  }
  if [req_region_id] != "" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.target.location.name" => "%{req_region_id}"
      }
      on_error => "target_location_name_replace_failure"
    }
  }

  mutate {
    replace => {
      "resp_message" => "%{responseElements.Message}"
    }
    on_error => "resp_message_empty"
  }
  if [resp_message] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{resp_message}"
      }
      on_error => "resp_message_replace_failure"
    }
  }

  mutate {
    convert => {
      "responseElements.Success" => "string"
    }
    on_error => "resp_success_convert_failure"
  }
  mutate {
    replace => {
      "resp_success" => "%{responseElements.Success}"
    }
    on_error => "resp_success_empty"
  }

  mutate {
    replace => {
      "resp_code" => "%{responseElements.Code}"
    }
    on_error => "resp_code_empty"
  }
  if [resp_code] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{resp_code}"
      }
      lowercase => ["resp_code"]
      on_error => "resp_code_replace_failure"
    }

    if [resp_code] in ["success", "allow", "pass"] or [resp_success] == "true" {
      mutate {
        replace => {
          "sec_action" => "ALLOW"
        }
      }
    } else if [resp_code] in ["fail", "failed", "drop", "block", "deny", "reject"] or [resp_success] == "false" {
      mutate {
        replace => {
          "sec_action" => "BLOCK"
        }
      }
    }

    if [sec_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "sec_action"
        }
        on_error => "sec_action_merge_failure"
      }
    }
  }

  mutate {
    rename => {
      "__topic__" => "addition.__topic__"
      "__source__" => "addition.__source__"
      "apiVersion" => "addition.apiVersion"
      "eventRW" => "addition.eventRW"
      "requestId" => "addition.requestId"
      "additionalEventData.CallerBid" => "addition.CallerBid"
      "requestParameters.X-Acs-Client-Request-Host-Region" => "addition.X-Acs-Client-Request-Host-Region"
      "requestParameters.AcsProduct" => "addition.AcsProduct"
      "requestParameters.PageSize" => "addition.PageSize"
      "requestParameters.PageNumber" => "addition.PageNumber"
      "userIdentity.accessKeyId" => "addition.accessKeyId"
      "userIdentity.sessionContext.attributes.mfaAuthenticated" => "addition.mfaAuthenticated"
      "eventType" => "addition.eventType"
      "responseElements.RequestId" => "addition.responseElements_RequestId"
      "responseElements.Success" => "addition.responseElements_Success"
      "responseElements.Result.VerifyCode" => "addition.VerifyCode"
      "responseElements.Result.CertifyId" => "addition.CertifyId"
      "responseElements.Result.VerifyResult" => "addition.VerifyResult"
    }
    on_error => "addition_rename_error"
  }

  for key, value in addition map {
    mutate {
      replace => {
        "additional_label" => ""
        "label_value_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "additional_value_convert_error"
    }
    mutate {
      replace => {
        "label_value_check" => "%{value}"
      }
      on_error => "additional_value_check_error"
    }
    if ![additional_value_check_error] and [label_value_check] != "" {
      if [key] in ["accessKeyId", "mfaAuthenticated"] {
        mutate {
          replace => {
            "additional_label.key" => "%{key}"
            "additional_label.value" => "%{value}"
          }
          on_error => "principal_user_label_replace_error"
        }
        if ![principal_user_label_replace_error] {
          mutate {
            merge => {
              "event1.idm.read_only_udm.principal.user.attribute.labels" => "additional_label"
            }
            on_error => "principal_user_label_merge_error"
          }
        }
      } else if [key] in ["eventType", "responseElements_RequestId", "responseElements_Success", "VerifyCode", "CertifyId", "VerifyResult"] {
        mutate {
          replace => {
            "additional_label.key" => "%{key}"
            "additional_label.value" => "%{value}"
          }
          on_error => "detection_field_replace_error"
        }
        if ![detection_field_replace_error] {
          mutate {
            merge => {
              "security_result.detection_fields" => "additional_label"
            }
            on_error => "detection_field_merge_error"
          }
        }
      } else {
        mutate {
          replace => {
            "additional_label.key" => "%{key}"
            "additional_label.value.string_value" => "%{value}"
          }
          on_error => "additional_label_replace_error"
        }
        if ![additional_label_replace_error] {
          mutate {
            merge => {
              "event1.idm.read_only_udm.additional.fields" => "additional_label"
            }
            on_error => "additional_label_merge_error"
          }
        }
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event1.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_failure"
    }
  }

  mutate {
    replace => {
      "event1.idm.read_only_udm.metadata.vendor_name" => "Alibaba Cloud"
      "event1.idm.read_only_udm.metadata.product_name" => "AliCloud ActionTrail"
    }
  }

  if [has_resource] == "true" and [has_principal_user] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  } else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  } else if [has_principal] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  } else {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event1"
    }
  }
}
