# Product: CISCO UCS
# Category: OS logs
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2022-07-04
# Copyright 2022 Chronicle LLC


filter {

  mutate {
    replace => {
      "filename" => ""
      "prod_evt_type" => ""
      "user" => ""
      "desc" => ""
      "host" => ""
      "sec_result" => ""
      "service" => ""
      "file_size" => ""
      "hostname" => ""
      "severity" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:filename}\\[\\d+\\]: %{DATA:application}:\\d+:%{GREEDYDATA:desc}"
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:application}: %{DATA:filename}:\\d+:%{GREEDYDATA:desc}"
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:application}:%{DATA}:\\d+:%{GREEDYDATA:desc}"
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:application}: %{DATA:prod_evt_type}\\(%{DATA:service}:\\w+\\): Login Failed for user=%{DATA:user}, host=%{IPORHOST:host}"
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:application}: %{DATA:prod_evt_type}\\(%{DATA:service}:\\w+\\):%{GREEDYDATA:desc}"
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:application}: Login failed \\(user:%{DATA:user}, ip:%{IPORHOST:host}, service:%{DATA:service}\\)"
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:application}:file %{NOTSPACE:filename}.* %{INT:file_size} - %{GREEDYDATA:desc}"
        "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{NOTSPACE:application}\\[\\d+\\]: %{GREEDYDATA:desc} %{NOTSPACE:filename} properly"
        "%{YEAR:year} %{SYSLOGTIMESTAMP:timestamp} %{DATA:application}: %{GREEDYDATA:prod_evt_type}: %{GREEDYDATA:desc}, %{WORD:severity}: \\[no class named %{DATA:class_name}\\], Received from host \\[%{IP:host}\\]"
        "%{YEAR:year} %{SYSLOGTIMESTAMP:timestamp} %{DATA:application}: %{GREEDYDATA:desc}"
      ]
    }
    overwrite => ["filename","prod_evt_type","user","desc","host","service","file_size","hostname","severity"]
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "Cisco UCS"
      "event.idm.read_only_udm.metadata.vendor_name" => "Cisco"
      "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
    }
  }

  date {
    match => ["timestamp", "MMM d HH:mm:ss","MMM  d HH:mm:ss"]
    rebase => true
  }

  if [prod_evt_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{prod_evt_type}"
      }
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
      }
    }
  }

  if [host] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "host"
      }
    }
  }

  if [user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user}"
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
      }
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.application" => "%{application}"
      }
    }
  }

  if [filename] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.full_path" => "%{filename}"
      }
    }
  }

  if [file_size] != "" {
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.process.file.size" => "uinteger"
      }
      replace => {
        "event.idm.read_only_udm.principal.process.file.size" => "%{file_size}"
      }
    }
  }

  if [service] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{service}"
      }
    }
  }

  if [desc] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{desc}"
      }
    }
    if [desc] =~ "Warning" {
      mutate {
        replace => {
          "sec_result.severity" => "HIGH"
        }
      }
    }
  }

  if [severity] =~ "(?i)error" {
    mutate {
      replace => {
        "sec_result.severity" => "ERROR"
      }
    }
  }

  if [hostname] == "" and [host] == "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
