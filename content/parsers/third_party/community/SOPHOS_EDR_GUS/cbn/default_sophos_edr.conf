# Product: SOPHOS EDR
# Category: EDR logs
# Supported Format: JSON
# Reference: https://support.sophos.com/support/s/article/KB-000038309?language=en_US
# Last Updated: 2024-06-30

filter {
  mutate {
    replace => {
      "source_info.ip" => ""
      "suser" => ""
      "dhost" => ""
      "endpoint_id" => ""
      "endpoint_type" => ""
      "threat" => ""
      "appSha256" => ""
      "security_result" => ""
      "customer_id" => ""
      "filePath" => ""
      "detection_identity_name" => ""
      "sr_action" => ""
      "core_remedy_items.items" => ""
      "description" => ""
      "javaUUID" => ""
      "actionable" => ""
      "rt" => ""
      "end" => ""
      "event_service_event_id" => ""
      "data.alertType" => ""
      "data.created_at" => ""
      "data.endpoint_id" => ""
      "data.endpoint_java_id" => ""
      "data.endpoint_platform" => ""
      "data.endpoint_type" => ""
      "data.fileName" => ""
      "data.processName" => ""
      "data.source_info.ip" => ""
      "has_principal" => "false"
      "has_principal_user" => "false"
      "has_target" => "false"
      "has_target_user" => "false"
      "duid" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
  }

  date {
    match => ["rt","ISO8601"]
  }

  # Metadata
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "SOPHOS"
      "event.idm.read_only_udm.metadata.product_name" => "Sophos EDR"
      "event.idm.read_only_udm.metadata.product_event_type" => "%{type}"
      "event.idm.read_only_udm.metadata.event_type" => "NETWORK_UNCATEGORIZED"
    }
  }

  # Principal
  mutate {
    replace => {
      "event.idm.read_only_udm.principal.group.group_display_name" => "%{group}"
    }
    on_error => "group_not_found"
  }

  if [data][source_info][ip] != "" {
    mutate {
      replace => {
        "source_info.ip" => "%{data.source_info.ip}"
      }
      on_error => "principal_ip_not_found"
    }
  }

  if [source_info][ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "source_info.ip"
        "event.idm.read_only_udm.principal.asset.ip" => "source_info.ip"
      }
      on_error => "principal_ip_not_found"
    }
    if ![principal_ip_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [duid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{duid}"
        "has_target_user" => "true"
      }
      on_error => "principal_duid_not_found"
    }
  }

  if [suser] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{suser}"
      }
    }
  }

  if [appSha256] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.file.sha256" => "%{appSha256}"
      }
    }
  }

  if [core_remedy_items][items] != "" {
    for item in core_remedy_items.items {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.process.file.names" => "item.descriptor"
        }
      }
    }
  }
  

  # Target
  mutate {
    replace => {
      "event.idm.read_only_udm.target.process.pid" => "%{id}"
    }
  }

  if [dhost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{dhost}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{dhost}"
        "has_target" => "true"
      }
      on_error => "target_hostname_not_found"
    }
  }

  if [customer_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.id" => "%{customer_id}"
      }
    }
  }

  if [filePath] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{filePath}"
      }
    }
  }

  if [data][fileName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{data.fileName}"
      }
      on_error => "no_data_filename"
    }
  }

  if [data][endpoint_id] != "" {
    mutate {
      replace => {
        "endpoint_id" => "%{data.endpoint_id}"
      }
      on_error => "endpoint_id_not_found"
    }
  }

  if [endpoint_id] != "" {
    mutate {
      replace => {
        "endpoint_id_label.key" => "endpoint_id"
        "endpoint_id_label.value" => "%{endpoint_id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "endpoint_id_label"
      }
    }
  }

  if [data][endpoint_type] != "" {
    mutate {
      replace => {
        "endpoint_type" => "%{data.endpoint_type}"
      }
      on_error => "endpoint_type_not_found"
    }
  }

  if [endpoint_type] != "" {
    mutate {
      replace => {
        "endpoint_type_label.key" => "endpoint_type"
        "endpoint_type_label.value" => "%{endpoint_type}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "endpoint_type_label"
      }
    }
  }

  # SecurityResult
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.description" => "%{name}"
    }
  }

  if [severity] != "" {
    mutate {
      uppercase => ["severity"]
    }
    mutate {
      replace => {
        "security_result.severity" => "%{severity}"
      }
    }
  }

  if [threat] != "" {
    mutate {
      replace => {
        "security_result.threat_name" => "%{threat}"
      }
    }
  }

  if [detection_identity_name] != "" {
    mutate {
      replace => {
        "security_result.threat_feed_name" => "%{detection_identity_name}"
      }
    }
  }

  if [type] =~ "(?i)Blocked|(?i)Warn" {
    mutate {
      replace => {
        "sr_action" => "BLOCK"
      }
    }
  }
  else if [type] =~ "(?i)Allow" {
    mutate {
      replace => {
        "sr_action" => "ALLOW"
      }
    }
  }

  if [has_principal] == "true"  and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  # event_type mappings
  if [type] =~ "ADSync" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "FILE_SYNC"
      }
    }
  }
  else if [type] =~ "UpdateRebootRequired|RESTARTING|UpdateRebootUrgentlyRequired" {
    if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_STARTUP"
        }
      }
    }
  }
  else if [type] =~ "SavScanComplete|SavFastScanComplete|SavSmartScanAborted|SavSmartScanComplete|SavSmartScanStarted" {
    if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "SCAN_UNCATEGORIZED"
        }
      }
    }
  }
  else if [type] =~ "ScheduledDataUploadResumed" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_type" => "TASK"
        "event.idm.read_only_udm.metadata.event_type" => "SCHEDULED_TASK_ENABLE"
      }
    }
  }
  else if [type] =~ "ScheduledDailyLimitExceeded" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_type" => "TASK"
        "event.idm.read_only_udm.metadata.event_type" => "SCHEDULED_TASK_DISABLE"
      }
    }
  }
  else if [type] =~ "ServiceNotRunning" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SERVICE_STOP"
      }
    }
  }
  else if [type] =~ "ServiceRestored" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SERVICE_START"
      }
    }
  }
  else if [type] =~ "UpdateSuccess|UpdateFailure" {
    if [has_principal] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }
  else if [type] =~ "UserAutoCreated" {
    if [has_target_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_CREATION"
        }
      }
    }
  }

  # Setting UDM Nouns
  if [sr_action] != "" {
    mutate {
      merge => {
        "security_result.action" => "sr_action"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
