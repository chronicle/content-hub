# Product: Akamai DNS
# Category: DNS
# Supported Format: CSV, JSON
# Reference: N/A
# Last Updated: 2024-11-25
# Copyright 2024 Chronicle LLC

# AKAMAI_DNS
filter {
  mutate {
    replace => {
      "date" => ""
      "time" => ""
      "var_timestamp" => ""
      "questions" => ""
      "ip_list" => ""
      "kv_list" => ""
      "domain_list" => ""
      "record_type" => ""
      "query" => ""
      "class" => ""
      "type" => ""
      "col11" => ""
      "authority" => ""
      "column9" => ""
      "column8" => ""
      "column7" => ""
      "column6" => ""
      "column5" => ""
      "column4" => ""
      "column3" => ""
      "column2" => ""
      "column1" => ""
      "column10" => ""
      "column11" => ""
      "has_principal" => "false"
      "machine_address" => ""
      "src_port" => ""
      "requestPort" => ""
      "requestIP" => ""
      "requestName" => ""
      "requestType" => ""
      "dnsClass" => ""
      "dnssecFlag" => ""
      "edns0Flag" => ""
      "edns0Size" => ""
      "version" => ""
      "answers" => ""
      "ttl_number" => ""
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] {
    mutate {
      gsub => ["message", '\\\"', '']
    }
    csv {
      source => "message"
      on_error => "invalid_csv"
    }

    # Extract the contents
    mutate {
      replace => {
        "col1" => "%{column1}"
        "machine_address" => "%{column2}"
        "src_port" => "%{column3}"
        "query" => "%{column4}"
        "class" => "%{column5}"
        "type" => "%{column6}"
        "col7" => "%{column7}"
        "sent_bytes" => "%{column8}"
        "col9" => "%{column9}"
        "col10" => "%{column10}"
        "col11" => "%{column11}"
      }
    }
  }
  grok {
    match => {
      "col1" => "%{INT} - %{NUMBER} %{GREEDYDATA:date} %{GREEDYDATA:time}"
    }
    overwrite => ["date","time"]
    on_error => "invalid_grok"
  }
  mutate {
    replace => {
      "when" => "%{date} %{time}"
    }
    on_error => "invalid_when"
  }
  # Setting datetime
  date {
    match => ["when", "dd/MM/yyyy HH:mm:ss", "dd/MM/yyyy HH:mm:ss"]
    on_error => "invalid_date"
  }

  if [dnsClass] != "" {
    mutate {
      replace => {
        "class" => "%{dnsClass}"
      }
      on_error => "invalid_class"
    }
  }

  if [requestName] != "" {
    mutate {
      replace => {
        "query" => "%{requestName}"
      }
      on_error => "query_empty"
    }
  }

  # Setting sent_bytes
  mutate {
    convert => { "sent_bytes" => "uinteger" }
    on_error => "sent_not_integer"
  }
  if ![sent_not_integer] {
    mutate {
      rename => { "sent_bytes" => "event.idm.read_only_udm.network.sent_bytes" }
    }
  }
  if [answers] != "" {
    grok {
      match => {
        "answers" => "%{INT:ttl_number}:%{GREEDYDATA:answers}"
      }
      overwrite => ["answers","ttl_number"]
      on_error => "invalid_answers"
    }
    if [ttl_number] != "" {
      mutate {
        convert => {
          "ttl_number" => "uinteger"
        }
        on_error => "ttl_number_not_integer"
      }
      mutate {
        rename => {
          "ttl_number" => "_answers.ttl"
        }
        on_error => "ttl_number_empty"
      }
    }
    mutate {
      replace => {
        "_answers.name" => "%{answers}"
      }
      on_error => "answers_empty"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.network.dns.answers" =>"_answers"
      }
      on_error => "answers_merge_failure"
    }
  }
  # Setting port
  if [src_port] == "" and [requestPort] != "" {
    mutate {
      replace => {
        "src_port" => "%{requestPort}"
      }
      on_error => "src_port_empty"
    }
  }

  if [src_port] != "" {
    grok {
      match => {"src_port" => "%{INT:src_port}"}
      overwrite => ["src_port"]
      on_error => "invalid_grok"
    }
    if ![invalid_grok] {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.port" => "%{src_port}"
        }
        on_error => "port_not_integer"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.principal.port" => "integer"
        }
        on_error => "port_not_integer"
      }
    }
  }
  # Setting query
  if [query] != "" {
    mutate {
      replace => {
        "questions.name" => "%{query}"
      }
    }
  }
  # Setting class
  if [class] == "IN" {
    mutate {
      replace => {
        "questions.class" => "1"
      }
    }
  }
  mutate {
    convert => {
      "questions.class" => "uinteger"
    }
  }

  if [type] == "" and [requestType] != "" {
    mutate {
      replace => {
        "type" => "%{requestType}"
      }
      on_error => "requestType_empty"
    }
  }

  # Setting DNS record type
  if [type] != "" {
    if [type] == "A" {
      mutate {
        replace => { "questions.type" => "1"}
      }
    } else if [type] == "AAAA" {
      mutate {
        replace => { "questions.type" => "28"}
      }
    } else if [type] == "CNAME" {
      mutate {
        replace => { "questions.type" => "5"}
      }
    } else if [type] == "MX" {
      mutate {
        replace => { "questions.type" => "15"}
      }
    } else if [type] == "PTR" {
      mutate {
        replace => { "questions.type" => "12"}
      }
    } else if [type] == "SOA" {
      mutate {
        replace => { "questions.type" => "6"}
      }
    } else if [type] == "SRV" {
      mutate {
        replace => { "questions.type" => "33"}
      }
    } else if [type] == "TXT" {
      mutate {
        replace => { "questions.type" => "16"}
      }
    } else if [type] == "ANY" {
      mutate {
        replace => { "questions.type" => "255"}
      }
    } else if [type] == "DNSKEY" {
      mutate {
        replace => { "questions.type" => "48"}
      }
    } else if [type] == "DS" {
      mutate {
        replace => { "questions.type" => "43"}
      }
    } else if [type] == "HTTPS" {
      mutate {
        replace => { "questions.type" => "65"}
      }
    } else if [type] == "NAPTR" {
      mutate {
        replace => { "questions.type" => "35"}
      }
    } else if [type] == "NS" {
      mutate {
        replace => { "questions.type" => "2"}
      }
    } else if [type] == "SPF" {
      mutate {
        replace => { "questions.type" => "99"}
      }
    } else if [type] == "TYPE65521" {
      mutate {
        replace => { "questions.type" => "65521"}
      }
    }
  }
  mutate {
    convert => {
      "questions.type" => "uinteger"
    }
  }
  if [questions] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.network.dns.questions" => "questions"
      }
    }
  }
  if [machine_address] == "" and [requestIP] != "" {
    mutate {
      replace => {
        "machine_address" => "%{requestIP}"
      }
      on_error => "requestIP_empty"
    }
  }
  if [machine_address] != "" {
    grok {
      match => {"machine_address" => "%{IP:machine_address}"}
      overwrite => ["machine_address"]
      on_error => "invalid_grok1"
    }
    if ![invalid_grok1] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "machine_address"
          "event.idm.read_only_udm.principal.asset.ip" => "machine_address"
        }
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [col11] != "" {
    mutate {
      gsub => ["col11","([0-9]{2,5}:)",""]
    }
    if [col11] =~ "ip4:"{
      grok {
        match => {"col11" => ["%{GREEDYDATA}v=spf1 ip4:%{GREEDYDATA:ip_list} ~all","%{GREEDYDATA}v=spf1 ip4:%{GREEDYDATA:ip_list} "]}
        overwrite => ["ip_list"]
      }
      mutate {
        gsub => ["col11","v=spf1 ",""]
      }
      mutate {
        gsub => ["ip_list","ip4:",""]
      }
      mutate {
        gsub => ["ip_list","(/[0-9]{2})",""]
      }
      mutate {
        gsub => ["ip_list","(.*)","{\"ip_address\":[\"$1\"]}"]
      }
      mutate {
        gsub => ["ip_list"," ","\",\""]
      }
      json {
        source => "ip_list"
        array_function => "split_columns"
      }
      for ip in ip_address {
        mutate {
          merge => {"event.idm.read_only_udm.target.ip" => "ip"}
        }
      }
    }
    if [col11] =~ "=" {
      if [col11] =~ "include:" {
        if [col11] =~ "10 mx0" {
          mutate {
            gsub => ["col11","10 mx0","mx0"]
          }
          mutate {
            gsub => ["col11","(mx0(a|b)-[a-zA-Z0-9]+.pphosted.com)","$1#"]
          }
          grok {
            match => {"col11" => "%{GREEDYDATA:mxhost}# %{GREEDYDATA:kv_list}v=spf1 %{GREEDYDATA:domain_list} -all%{GREEDYDATA:kv_list}"}
            overwrite => ["domain_list","kv_list"]
          }
          mutate {
            gsub => ["mxhost","# "," "]
          }
        } else {
          grok {
            match => {"col11" => "%{GREEDYDATA:kv_list}v=spf1 %{GREEDYDATA:domain_list} -all%{GREEDYDATA:kv_list}"}
            overwrite => ["domain_list","kv_list"]
          }
        }
        # Below code can be avoided if we can able to merge domain_list and mxhost list
        if [mxhost] != "" {
          mutate {
            gsub => ["mxhost","(.*)","{\"domain_address\":[\"$1\"]}"]
          }
          mutate {
            gsub => ["mxhost"," ","\",\""]
          }
          json {
            source => "mxhost"
            array_function => "split_columns"
          }
          for domain in domain_address {
            mutate {
              replace => {
                "authority" => ""
              }
            }
            mutate {
              rename => {
                "domain" => "authority.data"
              }
            }
            mutate {
              merge => {
                "event.idm.read_only_udm.network.dns.authority" => "authority"
              }
            }
          }
        }
        if [domain_list] != "" {
          mutate {
            gsub => ["domain_list","include:",""]
          }
          mutate {
            gsub => ["domain_list","(.*)","{\"domain_address\":[\"$1\"]}"]
          }
          mutate {
            gsub => ["domain_list"," ","\",\""]
          }
          json {
            source => "domain_list"
            array_function => "split_columns"
          }
          for domain in domain_address {
            mutate {
              replace => {
                "authority" => ""
              }
            }
            mutate {
              rename => {
                "domain" => "authority.data"
              }
            }
            mutate {
              merge => {
                "event.idm.read_only_udm.network.dns.authority" => "authority"
              }
            }
          }
        }
      } else if [col11] =~ ";" {
        if [col11] =~ "=mailto" {
          kv {
            source => "col11"
            field_split => "; "
            value_split => "="
          }
          if [rua] != "" and [ruf] != "" {
            mutate {
              gsub => ["rua", "mailto:", ""]
            }
            mutate {
              gsub => ["ruf", "mailto:", ""]
            }
          }
          if [rua] != "" {
            mutate {
              merge => {
                "event.idm.read_only_udm.target.user.email_addresses" => "rua"}
            }
          }
          if [ruf] != "" {
            mutate {
              merge => {
                "event.idm.read_only_udm.target.user.email_addresses" => "ruf"}
            }
          }
        }
      } else {
        mutate {
          rename => {"col11" => "event.idm.read_only_udm.target.hostname"}
        }
      }
    } else if [col11] =~ ".net " or [col11] =~ "10 mx0" {
      if [col11] =~ "10 mx0" {
        mutate {
          gsub => ["col11","10 mx0","mx0"]
        }
      }
      mutate {
        gsub => ["col11","(.*)","{\"domain_address\":[\"$1\"]}"]
      }
      mutate {
        gsub => ["col11"," ","\",\""]
      }
      json {
        source => "col11"
        array_function => "split_columns"
      }
      for domain in domain_address {
        mutate {
          replace => {
            "authority" => ""
          }
        }
        mutate {
          rename => {
            "domain" => "authority.data"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.network.dns.authority" => "authority"
          }
        }
      }
    } else if [col11] =~ "NXDOMAIN"{
      mutate {
        replace => {
          "responseCode" => "3"
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.network.dns.response_code" => "%{responseCode}"
        }
      }
      mutate {
        convert => {"event.idm.read_only_udm.network.dns.response_code" => "uinteger"}
      }
    } else {
      if [col11] =~ "ip4" {

      } else {
        mutate {
          rename => {
            "col11" => "event.idm.read_only_udm.target.hostname"
          }
        }
      }
    }
  }

  if [dnssecFlag] != "" {
    mutate {
      replace => {
        "dnssecFlag_label.value.string_value" => "%{dnssecFlag}"
      }
      on_error => "dnssecFlag_empty"
    }
    if ![dnssecFlag_empty] {
      mutate {
        replace => {
          "dnssecFlag_label.key" => "dnssecFlag"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "dnssecFlag_label"
        }
        on_error => "dnssecFlag_label_empty"
      }
    }
  }

  if [edns0Flag] != "" {
    mutate {
      replace => {
        "edns0Flag_label.value.string_value" => "%{edns0Flag}"
      }
      on_error => "edns0Flag_empty"
    }
    if ![edns0Flag_empty] {
      mutate {
        replace => {
          "edns0Flag_label.key" => "edns0Flag"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "edns0Flag_label"
        }
        on_error => "edns0Flag_label_empty"
      }
    }
  }

  if [edns0Size] != "" {
    mutate {
      replace => {
        "edns0Size_label.value.string_value" => "%{edns0Size}"
      }
      on_error => "edns0Size_empty"
    }
    if ![edns0Size_empty] {
      mutate {
        replace => {
          "edns0Size_label.key" => "edns0Size"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "edns0Size_label"
        }
        on_error => "edns0Size_label_empty"
      }
    }
  }

  if [version] != "" {
    mutate {
      replace => {
        "version_label.value.string_value" => "%{version}"
      }
      on_error => "version_empty"
    }
    if ![version_empty] {
      mutate {
        replace => {
          "version_label.key" => "version"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "version_label"
        }
        on_error => "version_label_empty"
      }
    }
  }
  if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_DNS"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    rename => {
      "event_type" => "event.idm.read_only_udm.metadata.event_type"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "AKAMAI_DNS"
      "event.idm.read_only_udm.metadata.vendor_name" => "AKAMAI_DNS"
      "event.idm.read_only_udm.network.application_protocol" => "DNS"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
