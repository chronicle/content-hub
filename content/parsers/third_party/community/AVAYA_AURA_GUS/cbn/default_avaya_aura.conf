# Google SecOps Default CBN Parser (AVAYA_AURA)
# Depot Path: //depot/google3/googlex/security/malachite/cbn/configs/AVAYA_AURA/default/avaya_aura.conf
filter {
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "AVAYA"
      "event.idm.read_only_udm.metadata.product_name" => "AVAYA_AURA"
      "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_json_error"
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
