# Product: AVAYA AURA
# Category: Telephone software
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2026-07-09
# Copyright 2026 Google SecOps


filter {
  mutate {
    replace => {
      "log_data" => ""
      "product_log_id" => ""
      "host" => ""
      "security_result" => ""
      "severity_details" => ""
      "sec_cat" => ""
      "severity" => ""
      "summary" => ""
      "user_id" => ""
      "event_name" => ""
      "prod_log_id" => ""
      "desc" => ""
      "portal" => ""
      "sec_desc" => ""
      "security_action" => ""
      "has_principal" => "false"
      "event_type" => "GENERIC_EVENT"
      "vendor_name" => "AVAYA AURA"
      "product_name" => "AVAYA AURA"
      "src_ip" => ""
      "src_port" => ""
      "dst_ip" => ""
      "dst_port" => ""
      "network_protocol" => ""
      "application_protocol_version" => ""
      "community_id" => ""
      "security_description" => ""
      "device_uptime" => ""
      "cmg_trap_subsystem" => ""
      "cmg_trap_onboard" => ""
      "cmg_trap_location" => ""
      "time" => ""
      "process_pid" => ""
      "principal_application" => ""
      "syslog_priority" => ""
      "sent_bytes" => ""
      "received_bytes" => ""
      "file_size" => ""
      "target_id" => ""
      "name" => ""
      "has_target" => "false"
      "has_target_file" => "false"
      "UID" => ""
      "has_user" => "false"
      "group_display_name" => ""
      "target_file" => ""
      "home" => ""
      "shell" => ""
      "GID" => ""
    }
  }

  grok {
    match => {
      "message" => [
        "<%{INT}>%{DATA:severity}\\s+-\\s+%{DATA:host}\\|\\|%{DATA:product_log_id}\\|\\|%{DATA}:%{GREEDYDATA:log_data}",
        "<%{INT}>@%{DATA:time},%{DATA}\\|%{DATA:event_name}\\|%{DATA:severity}\\|%{DATA:sec_cat}\\|%{DATA:portal}\\|%{DATA:processer}\\|(U|u)ser=%{DATA:user_id}\\|%{DATA},%{DATA:prod_log_id},\\s+,\\s+,\\s+,\\s+\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|\\|%{DATA:host}\\|%{GREEDYDATA}",
        "<%{INT}>@%{DATA:time},%{DATA}\\|%{DATA:event_name}\\|%{DATA:severity}\\|%{DATA:sec_cat}\\|%{DATA:portal}\\|%{DATA:processer}\\|(U|u)ser=%{DATA:user_id}\\|(v|V)iew\\s+,%{DATA:prod_log_id},\\s+%{DATA:desc},%{DATA},\\s+,\\s+\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|\\|%{DATA:host}\\|%{GREEDYDATA}",
        "<%{INT}>@%{DATA:time},%{DATA}\\|%{DATA:event_name}\\|%{DATA:severity}\\|%{DATA:sec_cat}\\|%{DATA:portal}\\|%{DATA:processer}\\|(U|u)ser=%{DATA:user_id}\\|%{DATA:desc},%{DATA:prod_log_id},%{DATA:protocol},\\s+,\\s+,\\s+\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|\\|%{DATA:host}\\|%{GREEDYDATA}",
        "<%{INT}>@%{DATA:time},%{DATA}\\|%{DATA:event_name}\\|%{DATA:severity}\\|%{DATA:sec_cat}\\|%{DATA:portal}\\|%{DATA:processer}\\|(U|u)ser=%{DATA:user_id}\\|%{DATA},%{DATA:prod_log_id},%{DATA},%{DATA},%{DATA},%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|\\|%{DATA:host}\\|%{GREEDYDATA}",
        "<%{INT}>@%{DATA:time},%{DATA}\\|%{DATA:event_name}\\|%{DATA:severity}\\|%{DATA:sec_cat}\\|%{DATA:portal}\\|%{DATA:processer}\\|\\|%{DATA:summary},%{DATA:prod_log_id},\\s+%{DATA:user_id},%{DATA:sec_desc},\\s+%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|%{DATA}\\|\\|%{DATA:host}\\|%{GREEDYDATA}",
        "<%{INT:syslog_priority}>%{SYSLOGTIMESTAMP:time}\\s+%{DATA:host}\\s+%{DATA:principal_application}\\[%{INT:process_pid}\\]:\\s+%{DATA}\\(via %{DATA:network_protocol}: \\[%{DATA:src_ip}\\]:%{DATA:src_port}->\\[%{DATA:dst_ip}\\]:%{DATA:dst_port}\\)\\s+%{GREEDYDATA:log_data}",
        "<%{INT:syslog_priority}>%{SYSLOGTIMESTAMP:time}\\s+%{DATA:host}\\s+%{DATA:principal_application}\\[%{INT:process_pid}\\]:\\s+\\(%{DATA:user_id}\\)\\s+%{WORD:event_name}\\s+\\(%{GREEDYDATA:desc}\\)",
        "<%{INT:syslog_priority}>%{SYSLOGTIMESTAMP:time}\\s+%{DATA:host}\\s+%{DATA:principal_application}\\[%{INT:process_pid}\\]:\\s+%{GREEDYDATA:desc}",
        "<%{INT:syslog_priority}>%{SYSLOGTIMESTAMP:time}\\s+%{DATA:host}\\s+%{DATA:principal_application}\\[%{INT:process_pid}\\]:\\s*",
        "<%{INT:syslog_priority}>%{SYSLOGTIMESTAMP:time}\\s+%{DATA:host}\\s+%{DATA:user_id}:\\s+%{GREEDYDATA:desc}"
      ]
    }
    overwrite => ["severity","host","product_log_id","log_data","user_id","event_name","prod_log_id","desc","sec_cat","sec_desc","summary","portal","src_ip","src_port","dst_ip","dst_port","network_protocol","time","process_pid","principal_application","syslog_priority"]
   on_error => "grok_fail"
  }

  if [grok_fail] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "has_principal" => "true"
      }
    }
  }
  if [time] != "" {
    date {
      match => ["time", "yyyy-MM-dd HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "time_fail"
    }
    if [time_fail] {
      date {
        match => ["time", "MMM  d HH:mm:ss"]
        rebase => true
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "time_fail_not_found"
      }
    }
  }
  if [user_id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{user_id}"
      }
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "src_ip_fail"
    }
    if ![src_ip_fail] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [src_port] != "" {
    mutate {
      replace => {
        "principal.port" => "%{src_port}"
      }
      on_error => "src_port_fail"
    }
    mutate {
      convert => {
        "principal.port" => "integer"
      }
      on_error => "src_port_convert_fail"
    }
  }
  if [dst_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "dst_ip"
        "target.asset.ip" => "dst_ip"
      }
      on_error => "dst_ip_fail"
    }
    if ![dst_ip_fail] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [dst_port] != "" {
    mutate {
      replace => {
        "target.port" => "%{dst_port}"
      }
      on_error => "dst_port_fail"
    }
    mutate {
      convert => {
        "target.port" => "integer"
      }
      on_error => "dst_port_convert_fail"
    }
  }
  if [process_pid] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{process_pid}"
      }
      on_error => "process_pid_fail"
    }
  }
  if [principal_application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{principal_application}"
      }
      on_error => "principal_application_fail"
    }
  }
  if [network_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.ip_protocol" => "%{network_protocol}"
      }
      on_error => "network_protocol_fail"
    }
  }

  if [log_data] != "" {
    mutate {
      gsub => ["log_data", "#012#011", " "]
    }
    mutate {
      gsub => ["log_data", "#011", " "]
    }
    grok  {
      match => {
        "log_data" => [
          "%{DATA:summary}\\|\\|%{GREEDYDATA:severity_details}",
          "%{WORD:event_name},\\s+%{DATA:application_protocol_version},\\s+%{DATA}\\s+%{DATA:community_id}\\s+%{DATA:security_description}\\s+Uptime:\\s+%{DATA:device_uptime}\\s+cmgTrapSubsystem.%{INT}\\s+%{DATA}\\\"%{WORD:cmg_trap_subsystem}\\\"\\s+%{DATA}.%{INT}\\s+%{DATA}\\\"%{WORD:cmg_trap_onboard}\\\"\\s+%{DATA}.%{INT}\\s+%{DATA}\\\"%{DATA:cmg_trap_location}\\\""
        ]
      }
      overwrite => ["severity_details","summary","event_name","application_protocol_version","community_id","security_description","device_uptime","cmg_trap_subsystem","cmg_trap_onboard","cmg_trap_location"]
      on_error => "grok_fail1"
    }
  }
  if [application_protocol_version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol_version" => "%{application_protocol_version}"
      }
      on_error => "application_protocol_version_fail"
    }
  }
  if [community_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.community_id" => "%{community_id}"
      }
      on_error => "community_id_fail"
    }
  }
  if [security_description] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{security_description}"
      }
      on_error => "security_description_fail"
    }
  }
  if [device_uptime] != "" {
    mutate {
      replace => {
        "device_uptime_label.key" => "device_uptime"
        "device_uptime_label.value.string_value" => "%{device_uptime}"
      }
      on_error => "device_uptime_label_fail"
    }
    if ![device_uptime_label_fail] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "device_uptime_label"
        }
        on_error => "device_uptime_label_merge_fail"
      }
    }
  }
  if [cmg_trap_subsystem] != "" {
    mutate {
      replace => {
        "cmg_trap_subsystem_label.key" => "cmg_trap_subsystem"
        "cmg_trap_subsystem_label.value.string_value" => "%{cmg_trap_subsystem}"
      }
      on_error => "cmg_trap_subsystem_label_fail"
    }
    if ![cmg_trap_subsystem_label_fail] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cmg_trap_subsystem_label"
        }
        on_error => "cmg_trap_subsystem_label_merge_fail"
      }
    }
  }
  if [cmg_trap_onboard] != "" {
    mutate {
      replace => {
        "cmg_trap_onboard_label.key" => "cmg_trap_onboard"
        "cmg_trap_onboard_label.value.string_value" => "%{cmg_trap_onboard}"
      }
      on_error => "cmg_trap_onboard_label_fail"
    }
    if ![cmg_trap_onboard_label_fail] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cmg_trap_onboard_label"
        }
        on_error => "cmg_trap_onboard_label_merge_fail"
      }
    }
  }
  if [cmg_trap_location] != "" {
    mutate {
      replace => {
        "cmg_trap_location_label.key" => "cmg_trap_location"
        "cmg_trap_location_label.value.string_value" => "%{cmg_trap_location}"
      }
      on_error => "cmg_trap_location_label_fail"
    }
    if ![cmg_trap_location_label_fail] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cmg_trap_location_label"
        }
        on_error => "cmg_trap_location_label_merge_fail"
      }
    }
  }
  if [syslog_priority] != "" {
    mutate {
      replace => {
        "syslog_priority_label.key" => "syslog_priority"
        "syslog_priority_label.value.string_value" => "%{syslog_priority}"
      }
      on_error => "syslog_priority_label_fail"
    }
    if ![syslog_priority_label_fail] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "syslog_priority_label"
        }
        on_error => "syslog_priority_label_merge_fail"
      }
    }
  }

  if [severity_details] != "" {
    mutate {
      replace => {
        "security_result.severity_details" => "%{severity_details}"
      }
    }
  }

  if [summary] != "" {
    if [summary] =~ "(?i)(fail|failed)" {
      mutate {
        replace => {
          "security_action" => "BLOCK"
        }
      }
    }
    else if [summary] =~ "(?i)success" {
      mutate {
        replace => {
          "security_action" => "ALLOW"
        }
      }
    }
    if [security_action] != "" {
      mutate {
        merge => {
          "security_result.action" => "security_action"
        }
      }
    }
  }
  if [summary] != "" {
    mutate {
      replace => {
        "security_result.summary" => "%{summary}"
      }
      on_error => "summary_fail"
    }
  }

  if [prod_log_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{prod_log_id}"
      }
    }
  }

  if [sec_cat] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "sec_cat"
      }
    }
  }

  if [sec_desc] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{sec_desc}"
      }
    }
  }

  if [severity] =~ "(?i)(warn|fatal|error)" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] =~ "(?i)info" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }

  if [portal] != "" {
    mutate {
      replace => {
        "Portal_label.key" => "Portal"
        "Portal_label.value" => "%{portal}"
      }
    }

    mutate {
      merge => {
        "security_result.about.resource.attribute.labels" => "Portal_label"
      }
    }
  }

  if [vendor_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.vendor_name" => "%{vendor_name}"
      }
      on_error => "vendor_name_fail"
    }
  }

  if [product_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_name" => "%{product_name}"
      }
      on_error => "product_name_fail"
    }
  }
  if [desc] != "" {
    grok {
      match => {
        "desc" => [
          "sent %{INT:sent_bytes} bytes  received %{INT:received_bytes} bytes  total size %{INT:file_size}",
          "%{DATA:event_name}\\s+'%{DATA:target_id}' password",
          "%{DATA:event_name}:\\s+name=%{DATA:name},\\s+UID=%{INT:UID},\\s+GID=%{INT:GID},\\s+home=%{DATA:home},\\s+shell=%{GREEDYDATA:shell}",
          "delete\\s+'%{DATA:name}'\\s+from group\\s+'%{GREEDYDATA:group_display_name}'",
          "rsync\\s+to\\s+%{DATA:target_file}\\s+from\\s+%{DATA:name}\\s+%{GREEDYDATA}"
        ]
      }
      overwrite => ["sent_bytes", "received_bytes", "file_size", "target_id", "name", "UID", "GID", "home", "shell", "event_name", "group_display_name", "target_file"]
      on_error => "desc_grok_fail"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{desc}"
      }
      on_error => "desc_fail"
    }
  }
  if [name] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{name}"
        "has_user" => "true"
      }
      on_error => "name_fail"
    }
  }
  if [UID] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{UID}"
        "has_target" => "true"
      }
      on_error => "UID_fail"
    }
  }
  if [GID] != "" {
    mutate {
      replace => {
        "GID_label.key" => "GID"
        "GID_label.value" => "%{GID}"
      }
      on_error => "GID_label_fail"
    }
    if ![GID_label_fail] {
      mutate {
        merge => {
          "target.user.attribute.labels" => "GID_label"
        }
        on_error => "GID_label_merge_fail"
      }
    }
  }
  if [home] != "" {
    mutate {
      replace => {
        "home_label.key" => "home"
        "home_label.value" => "%{home}"
      }
      on_error => "home_label_fail"
    }
    if ![home_label_fail] {
      mutate {
        merge => {
          "target.user.attribute.labels" => "home_label"
        }
        on_error => "home_label_merge_fail"
      }
    }
  }
  if [shell] != "" {
    mutate {
      replace => {
        "shell_label.key" => "shell"
        "shell_label.value" => "%{shell}"
      }
      on_error => "shell_label_fail"
    }
    if ![shell_label_fail] {
      mutate {
        merge => {
          "target.user.attribute.labels" => "shell_label"
        }
        on_error => "shell_label_merge_fail"
      }
    }
  }
  if [group_display_name] != "" {
    mutate {
      replace => {
        "target.group.group_display_name" => "%{group_display_name}"
        "has_target" => "true"
      }
      on_error => "group_display_name_fail"
    }
  }
  if [target_file] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{target_file}"
        "has_target_file" => "true"
        "has_target" => "true"
      }
      on_error => "target_file_fail"
    }
  }
  if [sent_bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{sent_bytes}"
      }
      on_error => "sent_bytes_fail"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "sent_bytes_convert_fail"
    }
  }
  if [received_bytes] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{received_bytes}"
      }
      on_error => "received_bytes_fail"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.received_bytes" => "uinteger"
      }
      on_error => "received_bytes_convert_fail"
    }
  }
  if [file_size] != "" {
    mutate {
      replace => {
        "target.file.size" => "%{file_size}"
      }
      on_error => "file_size_fail"
    }
    mutate {
      convert => {
        "target.file.size" => "uinteger"
      }
      on_error => "file_size_convert_fail"
    }
  }
  if [event_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_name}"
      }
      on_error => "event_name_fail"
    }
  }
  if [target_id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{target_id}"
        "has_target" => "true"
      }
      on_error => "target_id_fail"
    }
  }
  if ([event_name] =~ "(?i)log(in|on)" or [summary] =~ "(?i)login") and [user_id] != "" {
    mutate {
      replace => {
        "event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if ([event_name] =~ "(?i)logoff" or [summary] =~ "(?i)logoff") or [user_id] != "" {
    mutate {
      replace => {
        "event_type" => "USER_LOGOUT"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [event_name] =~ "(?i)change user" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_CHANGE_PASSWORD"
      }
    }
  }
  else if [event_name] =~ "new user" and ([has_user] == "true" and [has_target] == "true") and [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "USER_CREATION"
      }
    }
  }
  else if [has_target_file] == "true" and [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "FILE_SYNC"
      }
    }
  }
  else if [has_user] == "true" and ([has_target] == "true" and [has_principal] == "true") {
    mutate {
      replace => {
        "event_type" => "GROUP_MODIFICATION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
