filter {
  mutate {
    replace => {
      "uuid" => ""
      "tenantId" => ""
      "timestamp" => ""
      "username" => ""
      "applicationCode" => ""
      "auditCode" => ""
      "auditType" => ""
      "action" => ""
      "userId" => ""
      "source" => ""
      "actionType" => ""
      "component" => ""
      "serviceName" => ""
      "accessMethod" => ""
      "accountId" => ""
      "target" => ""
      "command" => ""
      "sessionId" => ""
      "log_msg" => ""
      "cloudProvider" => ""
      "safe" => ""
      "accountName" => ""
      "targetPlatform" => ""
      "targetAccount" => ""
      "identityType" => ""
      "correlationId" => ""
      "isDr" => ""
      "originRegion" => ""
      "orgId" => ""
      "customData.account_name" => ""
      "customData.target" => ""
      "customData.new_target" => ""
      "customData.tenant_id" => ""
      "customData.cookie_session" => ""
      "customData.uuid" => ""
      "customData_account_name" => ""
      "customData_target" => ""
      "customData_new_target" => ""
      "customData_tenant_id" => ""
      "customData_uuid" => ""
      "customData_source_ip_address" => ""
      "customData_client_ip_address" => ""
      "customData_hostname" => ""
      "customData_username" => ""
      "customData_user_guid" => ""
      "customData_user_agent" => ""
      "customData_geoip_city_name" => ""
      "customData_geoip_country_name" => ""
      "customData_geoip_country_code" => ""
      "customData_geoip_latitude" => ""
      "customData_geoip_longitude" => ""
      "customData_device_os" => ""
      "customData_browser_name" => ""
      "customData_authentication_method" => ""
      "customData_directory_service_uuid" => ""
      "customData_directory_service_type" => ""
      "customData_session_guid" => ""
      "customData_internal_session_id" => ""
      "customData_application_id" => ""
      "customData_client" => ""
      "customData_scopes" => ""
      "customData_token_type" => ""
      "customData_start_time" => ""
      "customData_end_time" => ""
      "customData_internal_application" => ""
      "customData_roles" => ""
      "customData_identity_provider" => ""
      "customData_thread_type" => ""
      "customData_mobile_device" => ""
      "customData_challenge_redirected" => ""
      "customData_when_occurred" => ""
      "customData_success" => ""
      "address" => ""
      "SrcHost" => ""
      "DstHost" => ""
      "Command" => ""
      "SessionID" => ""
      "User" => ""
      "PSMID" => ""
      "ConnectionComponentId" => ""
      "ApplicationType" => ""
      "Protocol" => ""
      "retriescount" => ""
      "TXTOffset" => ""
      "VIDOffset" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_target_resource" => "false"
      "has_user" => "false"
      "_principal" => ""
      "_target" => ""
      "security_result" => ""
      "sec_action" => ""
      "source_ip" => ""
      "src_host_ip" => ""
      "cd_src_ip" => ""
      "cd_client_ip" => ""
      "cd_hostname_ip" => ""
      "target_ip" => ""
      "addr_ip" => ""
      "dst_host_ip" => ""
    }
  }

  mutate {
    gsub => ["message", "'message'", "'log_msg'"]
  }
  mutate {
    gsub => ["message", '"', '\"']
  }
  mutate {
    gsub => ["message", "'", '"']
  }
  mutate {
    gsub => ["message", "None", "null"]
  }
  mutate {
    gsub => ["message", "False", "false"]
  }
  mutate {
    gsub => ["message", "True", "true"]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_parse_error"
  }

  if [customData][account_name] != "" {
    mutate {
      replace => {
        "customData_account_name" => "%{customData.account_name}"
      }
      on_error => "err_cd_account_name"
    }
  }
  if [customData][target] != "" {
    mutate {
      replace => {
        "customData_target" => "%{customData.target}"
      }
      on_error => "err_cd_target"
    }
  }
  if [customData][new_target] != "" {
    mutate {
      replace => {
        "customData_new_target" => "%{customData.new_target}"
      }
      on_error => "err_cd_new_target"
    }
  }
  if [customData][tenant_id] != "" {
    mutate {
      replace => {
        "customData_tenant_id" => "%{customData.tenant_id}"
      }
      on_error => "err_cd_tenant_id"
    }
  }
  if [customData][uuid] != "" {
    mutate {
      replace => {
        "customData_uuid" => "%{customData.uuid}"
      }
      on_error => "err_cd_uuid"
    }
  }

  for index, item in customData.nested_items {
    if [item][name] != "" and [item][value] not in ["", "null", "None"] {
      if [item][name] == "account_name" {
        mutate {
          replace => {
            "customData_account_name" => "%{item.value}"
          }
          on_error => "err_item_account_name"
        }
      }
      else if [item][name] == "target" {
        mutate {
          replace => {
            "customData_target" => "%{item.value}"
          }
          on_error => "err_item_target"
        }
      }
      else if [item][name] == "new_target" {
        mutate {
          replace => {
            "customData_new_target" => "%{item.value}"
          }
          on_error => "err_item_new_target"
        }
      }
      else if [item][name] == "source_ip_address" {
        mutate {
          replace => {
            "customData_source_ip_address" => "%{item.value}"
          }
          on_error => "err_item_source_ip"
        }
      }
      else if [item][name] == "client_ip_address" {
        mutate {
          replace => {
            "customData_client_ip_address" => "%{item.value}"
          }
          on_error => "err_item_client_ip"
        }
      }
      else if [item][name] == "hostname" {
        mutate {
          replace => {
            "customData_hostname" => "%{item.value}"
          }
          on_error => "err_item_hostname"
        }
      }
      else if [item][name] == "user_guid" {
        mutate {
          replace => {
            "customData_user_guid" => "%{item.value}"
          }
          on_error => "err_item_user_guid"
        }
      }
      else if [item][name] == "user_agent" {
        mutate {
          replace => {
            "customData_user_agent" => "%{item.value}"
          }
          on_error => "err_item_user_agent"
        }
      }
      else if [item][name] == "geoip_city_name" {
        mutate {
          replace => {
            "customData_geoip_city_name" => "%{item.value}"
          }
          on_error => "err_item_geoip_city"
        }
      }
      else if [item][name] == "geoip_country_name" {
        mutate {
          replace => {
            "customData_geoip_country_name" => "%{item.value}"
          }
          on_error => "err_item_geoip_country"
        }
      }
      else if [item][name] == "geoip_country_code" {
        mutate {
          replace => {
            "customData_geoip_country_code" => "%{item.value}"
          }
          on_error => "err_item_geoip_country_code"
        }
      }
      else if [item][name] == "geoip_latitude" {
        mutate {
          replace => {
            "customData_geoip_latitude" => "%{item.value}"
          }
          on_error => "err_item_geoip_lat"
        }
      }
      else if [item][name] == "geoip_longitude" {
        mutate {
          replace => {
            "customData_geoip_longitude" => "%{item.value}"
          }
          on_error => "err_item_geoip_lon"
        }
      }
      else if [item][name] == "device_os" {
        mutate {
          replace => {
            "customData_device_os" => "%{item.value}"
          }
          on_error => "err_item_device_os"
        }
      }
      else if [item][name] == "browser_name" {
        mutate {
          replace => {
            "customData_browser_name" => "%{item.value}"
          }
          on_error => "err_item_browser_name"
        }
      }
      else if [item][name] == "authentication_method" {
        mutate {
          replace => {
            "customData_authentication_method" => "%{item.value}"
          }
          on_error => "err_item_auth_method"
        }
      }
      else if [item][name] == "directory_service_uuid" {
        mutate {
          replace => {
            "customData_directory_service_uuid" => "%{item.value}"
          }
          on_error => "err_item_dir_uuid"
        }
      }
      else if [item][name] == "directory_service_type" {
        mutate {
          replace => {
            "customData_directory_service_type" => "%{item.value}"
          }
          on_error => "err_item_dir_type"
        }
      }
      else if [item][name] == "session_guid" {
        mutate {
          replace => {
            "customData_session_guid" => "%{item.value}"
          }
          on_error => "err_item_session_guid"
        }
      }
      else if [item][name] == "internal_session_id" {
        mutate {
          replace => {
            "customData_internal_session_id" => "%{item.value}"
          }
          on_error => "err_item_internal_session_id"
        }
      }
      else if [item][name] == "application_id" {
        mutate {
          replace => {
            "customData_application_id" => "%{item.value}"
          }
          on_error => "err_item_app_id"
        }
      }
      else if [item][name] == "client" {
        mutate {
          replace => {
            "customData_client" => "%{item.value}"
          }
          on_error => "err_item_client"
        }
      }
      else if [item][name] == "scopes" {
        mutate {
          replace => {
            "customData_scopes" => "%{item.value}"
          }
          on_error => "err_item_scopes"
        }
      }
      else if [item][name] == "token_type" {
        mutate {
          replace => {
            "customData_token_type" => "%{item.value}"
          }
          on_error => "err_item_token_type"
        }
      }
      else if [item][name] == "start_time" {
        mutate {
          replace => {
            "customData_start_time" => "%{item.value}"
          }
          on_error => "err_item_start_time"
        }
      }
      else if [item][name] == "end_time" {
        mutate {
          replace => {
            "customData_end_time" => "%{item.value}"
          }
          on_error => "err_item_end_time"
        }
      }
      else if [item][name] == "internal_application" {
        mutate {
          replace => {
            "customData_internal_application" => "%{item.value}"
          }
          on_error => "err_item_internal_app"
        }
      }
      else if [item][name] == "roles" {
        mutate {
          replace => {
            "customData_roles" => "%{item.value}"
          }
          on_error => "err_item_roles"
        }
      }
      else if [item][name] == "identity_provider" {
        mutate {
          replace => {
            "customData_identity_provider" => "%{item.value}"
          }
          on_error => "err_item_idp"
        }
      }
      else if [item][name] == "thread_type" {
        mutate {
          replace => {
            "customData_thread_type" => "%{item.value}"
          }
          on_error => "err_item_thread_type"
        }
      }
      else if [item][name] == "mobile_device" {
        mutate {
          replace => {
            "customData_mobile_device" => "%{item.value}"
          }
          on_error => "err_item_mobile_device"
        }
      }
      else if [item][name] == "challenge_redirected" {
        mutate {
          replace => {
            "customData_challenge_redirected" => "%{item.value}"
          }
          on_error => "err_item_challenge_redirected"
        }
      }
      else if [item][name] == "when_occurred" {
        mutate {
          replace => {
            "customData_when_occurred" => "%{item.value}"
          }
          on_error => "err_item_when_occurred"
        }
      }
      else if [item][name] == "tenant_id" {
        mutate {
          replace => {
            "customData_tenant_id" => "%{item.value}"
          }
          on_error => "err_item_tenant_id"
        }
      }
      else if [item][name] == "success" {
        mutate {
          replace => {
            "customData_success" => "%{item.value}"
          }
          on_error => "err_item_success"
        }
      }
      else if [item][name] == "uuid" {
        mutate {
          replace => {
            "customData_uuid" => "%{item.value}"
          }
          on_error => "err_item_uuid"
        }
      }
    }
  }

  if [customData_new_target] != "" {
    kv {
      source => "customData_new_target"
      field_split => ";"
      value_split => "="
      on_error => "kv_new_target_error"
    }
  }

  if [uuid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{uuid}"
      }
      on_error => "uuid_empty"
    }
  }

  mutate {
    convert => {
      "timestamp" => "string"
    }
    on_error => "timestamp_convert_error"
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp", "UNIX_MS", "UNIX", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "timestamp_date_error"
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{action}"
      }
      on_error => "action_empty"
    }
  }
  if [log_msg] != "" {
    mutate {
      gsub => ["log_msg", "\\n", ""]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{log_msg}"
      }
      on_error => "log_msg_empty"
    }
  }

  if [userId] != "" {
    mutate {
      replace => {
        "_principal.user.userid" => "%{userId}"
        "has_user" => "true"
      }
      on_error => "userId_empty"
    }
  }

  if [username] != "" {
    mutate {
      replace => {
        "_principal.user.user_display_name" => "%{username}"
      }
      on_error => "username_empty"
    }
  }

  if [customData_user_guid] != "" {
    mutate {
      replace => {
        "_principal.user.product_object_id" => "%{customData_user_guid}"
      }
      on_error => "customData_user_guid_empty"
    }
  }

  if [source] != "" {
    grok {
      match => {
        "source" => ["%{IP:source_ip}"]
      }
      overwrite => ["source_ip"]
      on_error => "source_not_ip"
    }
    if ![source_not_ip] {
      mutate {
        merge => {
          "_principal.ip" => "source_ip"
          "_principal.asset.ip" => "source_ip"
        }
        on_error => "source_ip_merge_error"
      }
      if ![source_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "_principal.application" => "%{source}"
        }
        on_error => "source_app_error"
      }
    }
  }

  if [SrcHost] != "" {
    grok {
      match => {
        "SrcHost" => ["%{IP:src_host_ip}"]
      }
      overwrite => ["src_host_ip"]
      on_error => "src_host_not_ip"
    }
    if ![src_host_not_ip] {
      mutate {
        merge => {
          "_principal.ip" => "src_host_ip"
          "_principal.asset.ip" => "src_host_ip"
        }
        on_error => "src_host_ip_merge_error"
      }
      if ![src_host_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [customData_source_ip_address] != "" {
    grok {
      match => {
        "customData_source_ip_address" => ["%{IP:cd_src_ip}"]
      }
      overwrite => ["cd_src_ip"]
      on_error => "cd_src_not_ip"
    }
    if ![cd_src_not_ip] {
      mutate {
        merge => {
          "_principal.ip" => "cd_src_ip"
          "_principal.asset.ip" => "cd_src_ip"
        }
        on_error => "cd_src_ip_merge_error"
      }
      if ![cd_src_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }
  if [customData_client_ip_address] != "" {
    grok {
      match => {
        "customData_client_ip_address" => ["%{IP:cd_client_ip}"]
      }
      overwrite => ["cd_client_ip"]
      on_error => "cd_client_ip_not_ip"
    }
    if ![cd_client_ip_not_ip] {
      mutate {
        merge => {
          "_principal.ip" => "cd_client_ip"
          "_principal.asset.ip" => "cd_client_ip"
        }
        on_error => "cd_client_ip_merge_error"
      }
      if ![cd_client_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [customData_hostname] != "" {
    grok {
      match => {
        "customData_hostname" => ["%{IP:cd_hostname_ip}"]
      }
      overwrite => ["cd_hostname_ip"]
      on_error => "cd_hostname_not_ip"
    }
    if ![cd_hostname_not_ip] {
      mutate {
        merge => {
          "_principal.ip" => "cd_hostname_ip"
          "_principal.asset.ip" => "cd_hostname_ip"
        }
        on_error => "cd_hostname_ip_merge_error"
      }
      if ![cd_hostname_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    else {
      mutate {
        replace => {
          "_principal.hostname" => "%{customData_hostname}"
          "_principal.asset.hostname" => "%{customData_hostname}"
          "has_principal" => "true"
        }
        on_error => "cd_hostname_error"
      }
    }
  }

  if [originRegion] != "" {
    mutate {
      replace => {
        "_principal.location.name" => "%{originRegion}"
      }
      on_error => "origin_region_error"
    }
  }

  if [customData_geoip_city_name] != "" {
    mutate {
      replace => {
        "_principal.location.city" => "%{customData_geoip_city_name}"
      }
      on_error => "cd_city_error"
    }
  }

  if [customData_geoip_country_name] != "" {
    mutate {
      replace => {
        "_principal.location.country_or_region" => "%{customData_geoip_country_name}"
      }
      on_error => "cd_country_error"
    }
  }

  if [customData_geoip_latitude] != "" {
    mutate {
      replace => {
        "_principal.location.region_coordinates.latitude" => "%{customData_geoip_latitude}"
      }
      on_error => "cd_lat_error"
    }
    mutate {
      convert => {
        "_principal.location.region_coordinates.latitude" => "float"
      }
      on_error => "cd_lat_float_error"
    }
  }

  if [customData_geoip_longitude] != "" {
    mutate {
      replace => {
        "_principal.location.region_coordinates.longitude" => "%{customData_geoip_longitude}"
      }
      on_error => "cd_lon_error"
    }
    mutate {
      convert => {
        "_principal.location.region_coordinates.longitude" => "float"
      }
      on_error => "cd_lon_float_error"
    }
  }

  if [customData_device_os] =~ "Windows" {
    mutate {
      replace => {
        "_principal.asset.platform_software.platform" => "WINDOWS"
      }
      on_error => "cd_os_win_error"
    }
  }
  else if [customData_device_os] =~ "Mac|iOS" {
    mutate {
      replace => {
        "_principal.asset.platform_software.platform" => "MAC"
      }
      on_error => "cd_os_mac_error"
    }
  }
  else if [customData_device_os] =~ "Linux" {
    mutate {
      replace => {
        "_principal.asset.platform_software.platform" => "LINUX"
      }
      on_error => "cd_os_linux_error"
    }
  }

  if [cloudProvider] =~ "(?i)aws" {
    mutate {
      replace => {
        "_principal.asset.attribute.cloud.environment" => "AMAZON_WEB_SERVICES"
      }
    }
  }
  else if [cloudProvider] =~ "(?i)azure" {
    mutate {
      replace => {
        "_principal.asset.attribute.cloud.environment" => "MICROSOFT_AZURE"
      }
    }
  }
  else if [cloudProvider] =~ "(?i)gcp" {
    mutate {
      replace => {
        "_principal.asset.attribute.cloud.environment" => "GOOGLE_CLOUD_PLATFORM"
      }
    }
  }

  if [customData_account_name] != "" {
    mutate {
      replace => {
        "cd_account_name_label.key" => "account_name"
        "cd_account_name_label.value" => "%{customData_account_name}"
      }
      on_error => "cd_acc_name_lbl_error"
    }
    if ![cd_acc_name_lbl_error] {
      mutate {
        merge => {
          "_principal.user.attribute.labels" => "cd_account_name_label"
        }
        on_error => "cd_acc_name_lbl_merge_error"
      }
    }
  }

  if [customData_client] != "" {
    mutate {
      replace => {
        "cd_client_label.key" => "client"
        "cd_client_label.value" => "%{customData_client}"
      }
      on_error => "cd_client_lbl_error"
    }
    if ![cd_client_lbl_error] {
      mutate {
        merge => {
          "_principal.user.attribute.labels" => "cd_client_label"
        }
        on_error => "cd_client_lbl_merge_error"
      }
    }
  }

  if [customData_directory_service_uuid] != "" {
    mutate {
      replace => {
        "cd_dir_uuid_label.key" => "directory_service_uuid"
        "cd_dir_uuid_label.value" => "%{customData_directory_service_uuid}"
      }
      on_error => "cd_dir_uuid_lbl_error"
    }
    if ![cd_dir_uuid_lbl_error] {
      mutate {
        merge => {
          "_principal.user.attribute.labels" => "cd_dir_uuid_label"
        }
        on_error => "cd_dir_uuid_lbl_merge_error"
      }
    }
  }

  if [customData_directory_service_type] != "" {
    mutate {
      replace => {
        "cd_dir_type_label.key" => "directory_service_type"
        "cd_dir_type_label.value" => "%{customData_directory_service_type}"
      }
      on_error => "cd_dir_type_lbl_error"
    }
    if ![cd_dir_type_lbl_error] {
