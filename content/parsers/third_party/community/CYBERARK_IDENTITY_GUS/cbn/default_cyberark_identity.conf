          "event.idm.read_only_udm.additional.fields" => "cd_when_occurred_label"
        }
        on_error => "cd_when_occurred_merge_error"
      }
    }
  }

  if [Protocol] != "" {
    mutate {
      replace => {
        "protocol_label.key" => "Protocol"
        "protocol_label.value.string_value" => "%{Protocol}"
      }
      on_error => "protocol_empty"
    }
    if ![protocol_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "protocol_label"
        }
        on_error => "protocol_merge_error"
      }
    }
  }

  if [action] in ["CPM Change Password", "CPM Change Password Failed", "CPM Reconcile Password", "CPM Disable Password", "Store password"] and [has_user] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_CHANGE_PASSWORD"
      }
    }
  }
  else if [action] == "Delete File" and [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_DELETION"
      }
    }
  }
  else if [has_target_resource] == "true" and ([has_principal] == "true" or [has_user] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [_principal] != "" {
    mutate {
      rename => {
        "_principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [_target] != "" {
    mutate {
      rename => {
        "_target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_merge_error"
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "CYBERARK"
      "event.idm.read_only_udm.metadata.product_name" => "CYBERARK_IDENTITY"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
