# Product: TRENDMICRO_EMAIL_SECURITY
# Category: Email Security
# Supported Format: CEF
# Reference: N/A
# Last Updated: 2026-10-01
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "rt" => ""
      "severity" => ""
      "suser" => ""
      "duser" => ""
      "msg" => ""
      "act" => ""
      "cs1Label" => ""
      "cs1" => ""
      "cs2Label" => ""
      "cs2" => ""
      "cs3Label" => ""
      "cs3" => ""
      "cs4Label" => ""
      "cs4" => ""
      "cs5Label" => ""
      "cs5" => ""
      "cs6Label" => ""
      "cs6" => ""
      "cn1" => ""
      "cn1Label" => ""
      "network_direction" => ""
      "principal_machine_id_present" =>""
      "has_user" => ""
      "security_result" => ""
      "metadata" => ""
      "principal" => ""
      "network" => ""
      "target" => ""
      "suser_name" => ""
      "suser_dept" => ""
      "suser_app" => ""
      "suser_kv" => ""
      "suser_email" => ""
      "link_clicked_val" => ""
      "device_vendor" => ""
      "device_product" => ""
      "intermediary_host" => ""
      "observer_app" => ""
      "observer_pid" => ""
      "intermediary" => ""
      "observer" => ""
      "device_version" => ""
      "device_event_class_id" => ""
      "event_name" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  if [message] =~ "CEF:0" {
    mutate {
      replace => {
        "src" => ""
        "dst" => ""
        "srcip" => ""
        "username" => ""
        "action" => ""
        "resource" => ""
        "rnmsg" => ""
        "dvc" => ""
        "deviceTranslatedAddress" => ""
        "sourceTranslatedAddress" => ""
        "destinationTranslatedAddress" => ""
        "sourceTranslatedPort" => "0"
        "destinationTranslatedPort" => "0"
        "spt" => "0"
        "dpt" => "0"
        "in" => "0"
        "out" => "0"
        "fsize" => "0"
        "fname" => ""
        "fhash" => ""
        "oldFileSize" => "0"
        "deviceDirection" => ""
        "dtz" => ""
        "act" => ""
        "externalId" => ""
        "deviceExternalId" => ""
        "devicePayloadId" => ""
        "device_event_class_id" => ""
        "eventId" => ""
        "eventid" => ""
        "fileHash" => ""
        "categoryOutcome" => ""
        "outcome" => ""
        "event_name" => ""
        "cs2" => ""
        "cs5" => ""
        "cs7" => ""
        "rt" => ""
        "reason" => ""
        "shost" => ""
        "sntdom" => ""
        "sourceServiceName" => ""
        "spid" => ""
        "sproc" => ""
        "smac" => ""
        "suid" => ""
        "suser" => ""
        "dpid" => ""
        "dproc" => ""
        "dmac" => ""
        "dhost" => ""
        "duser" => ""
        "duid" => ""
        "shost_present" => "false"
        "temp_data" => ""
        "version" => ""
        "severity" => ""
        "device_version" => ""
        "cef_extension" => ""
        "timestamp" => ""
        "kv_data" => ""
        "msg_data" => ""
        "about" => ""
        "dvcmac" => ""
        "ihost" => ""
      }
    }

    grok {
      match => {
        "message" => [
          "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:ihost} CEF: (?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:cef_extension}",
          "(?:<%{INT}>|%{DATA:temp_data})CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|(?:%{DATA:event_name}\\||)(?P<severity>Medium|MEDIUM|Low|LOW|HIGH|High|Unknown|Very-High|Informational|INFORMATIONAL|Info|INFO|Critical|CRITICAL|Warning|WARNING|Error|ERROR|Notice|NOTICE|Fatal|FATAL|Alert|ALERT|Emergency|EMERGENCY|Debug|DEBUG|%{INT})(?:\\||)%{GREEDYDATA:cef_extension}",
          "CEF: %{TIMESTAMP_ISO8601:timestamp} \\| %{GREEDYDATA:kv_data}",
          "(?:<%{INT}>|%{DATA})CEF %{DATA} (?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|(?:%{DATA:event_name}\\||)(?P<severity>Medium|MEDIUM|Low|LOW|HIGH|High|Unknown|Very-High|Informational|INFORMATIONAL|Info|INFO|Critical|CRITICAL|Warning|WARNING|Error|ERROR|Notice|NOTICE|Fatal|FATAL|Alert|ALERT|Emergency|EMERGENCY|Debug|DEBUG|%{INT})(?:\\||)%{GREEDYDATA:cef_extension}",
          "CEF: (?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{DATA:event_name}\\|%{INT:severity}\\|%{GREEDYDATA:cef_extension}",
          "CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|(?:%{DATA:event_name}\\||)(?P<severity>Medium|MEDIUM|Low|LOW|HIGH|High|Unknown|Very-High|Informational|INFORMATIONAL|Info|INFO|Critical|CRITICAL|Warning|WARNING|Error|ERROR|Notice|NOTICE|Fatal|FATAL|Alert|ALERT|Emergency|EMERGENCY|Debug|DEBUG|%{INT})(?:\\||)%{GREEDYDATA:cef_extension}",
          "CEF %{DATA} (?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|(?:%{DATA:event_name}\\||)(?P<severity>Medium|MEDIUM|Low|LOW|HIGH|High|Unknown|Very-High|Informational|INFORMATIONAL|Info|INFO|Critical|CRITICAL|Warning|WARNING|Error|ERROR|Notice|NOTICE|Fatal|FATAL|Alert|ALERT|Emergency|EMERGENCY|Debug|DEBUG|%{INT})(?:\\||)%{GREEDYDATA:cef_extension}",
          "CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|%{GREEDYDATA}"
        ]
      }
      overwrite => ["version","device_event_class_id", "event_name","severity", "temp_data","timestamp","kv_data","device_version","cef_extension","device_vendor","device_product", "ihost"]
      on_error => "not_grok_pattern"
    }
    mutate {
      convert => {
        "is_cef_log" => "string"
      }
      on_error => "is_cef_log_already_string"
    }

    mutate {
      replace => {
        "is_cef_log_temp" => "%{is_cef_log}"
      }
      on_error => "is_cef_log_empty"
    }


    if ( ([not_grok_pattern] == true) and ([is_cef_log_empty] == false) and [is_cef_log_temp] == "true") {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    } else if [not_grok_pattern] and (([is_cef_log_empty] == false) and [is_cef_log_temp] == "false") {
      grok {
        match => {
          "message" => [
            "(?:<%{INT}>|%{DATA:temp_data})CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|\\[%{DATA}\\] %{GREEDYDATA:msg}",
            "(?:<%{INT}>|%{DATA:temp_data})CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{GREEDYDATA:msg}",
            "<%{INT}>%{DATA:temp_data}CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{GREEDYDATA:kv_data}",
            "CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{DATA:device_event_class_id}\\|\\[%{DATA}\\] %{GREEDYDATA:msg}",
            "CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{DATA:device_vendor}\\|%{DATA:device_product}\\|%{DATA:device_version}\\|%{GREEDYDATA:msg}",
            "CEF:(?:%{INT:version}|%{NUMBER:version})\\|%{GREEDYDATA:kv_data}",
            "CEF:%{GREEDYDATA:kv_data}"
          ]
        }
        on_error => "is_cef_log"
        overwrite => ["temp_data","version","device_vendor","device_product","device_version","device_event_class_id","msg","kv_data"]
      }
    } else if [not_grok_pattern] and [is_cef_log_empty] == true {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }

    mutate {
      gsub => ["cef_extension", "Customer Name=", "CustomerName="]
    }

    mutate {
      gsub => ["cef_extension", "Virus/Malware_Name", "Virus_Malware_Name"]
    }

    mutate {
      gsub => ["cef_extension", "Spyware/Grayware_Type", "Spyware_Grayware_Type"]
    }

    mutate {
      gsub => ["cef_extension", "img src", "img_src"]
    }

    mutate {
      gsub => ["cef_extension", "(\\\s+)([0-9a-zA-Z_.-]+?)=", "^$2="]
    }

    if [cef_extension] != "" {
      kv {
        source => "cef_extension"
        field_split => "^"
        value_split => "="
        whitespace => "strict"
        on_error => "no_cef_extension"
      }
    }

    if [kv_data] != "" {
      mutate {
        gsub => ["kv_data","version=","device_version="]
      }
      mutate {
        gsub => ["kv_data","srcip=port","src= "]
      }
      mutate {
        gsub => ["kv_data","srcip=","src="]
      }
      mutate {
        gsub => ["kv_data","username=","suid="]
      }
      mutate {
        gsub => ["kv_data","action=","act="]
      }
      kv {
        source => "kv_data"
        field_split => "|"
        value_split => "="
        on_error => "no_kv_data"
      }
      if [kv_data] =~ ";" {
        mutate {
          gsub => ["kv_data","\\\"",""]
        }
        kv {
          source => "kv_data"
          field_split => ";"
          value_split => ":"
          on_error => "no_kv_data"
        }
      }
    }
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
    if [device_vendor] != "" {
    mutate {
      replace => {
      "metadata.vendor_name" => "%{device_vendor}"
    }
    on_error => "vendor_name_not_set"
      }
    }
    if [device_product] != "" {
      mutate {
        replace => {
          "metadata.product_name" => "%{device_product}"
        }
        on_error => "product_name_not_set"
      }
    }
    if [device_version] != "" {
      mutate {
        replace => {
          "metadata.product_version" => "%{device_version}"
        }
        on_error => "product_version_not_set"
      }
    }
    if [device_event_class_id] != "" {
      mutate {
        replace => {
          "metadata.product_log_id" => "%{device_event_class_id}"
        }
        on_error => "product_log_id_not_set"
      }
    }
    if [event_name] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{event_name}"
        }
        on_error => "description_not_set"
      }
    }
    grok {
      match => {
        "message" => [
          "^<%{INT}>\\s*%{TIMESTAMP_ISO8601}\\s+%{NOTSPACE:intermediary_host}\\s+%{DATA:observer_app}(?:\\[%{INT:observer_pid}\\])?:\\s*CEF:"
        ]
      }
      overwrite => ["intermediary_host", "observer_app", "observer_pid"]
      on_error => "syslog_header_grok_failure"
    }
    if ![syslog_header_grok_failure] {
      if [intermediary_host] != "" {
        mutate {
          replace => {
            "intermediary.hostname" => "%{intermediary_host}"
          }
          on_error => "intermediary_host_not_set"
        }
      }
      if [observer_app] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.application" => "%{observer_app}"
          }
          on_error => "observer_app_not_set"
        }
      }
      if [observer_pid] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.observer.process.pid" => "%{observer_pid}"
          }
          on_error => "observer_pid_not_set"
        }
      }
    }
  }

  if [rt] != "" {
    date {
      match => ["rt", "ISO8601"]
      on_error => "no_rt"
    }
  }

  if [src] not in ["", "null", "None"] {
    mutate {
      replace => {
        "principal_ip" => "%{src}"
      }
      on_error => "src_not_set"
    }
    if ![src_not_set] {
      grok {
        match => {
          "principal_ip" => [ "%{IP:principal_ip}" ]
        }
        overwrite => ["principal_ip"]
        on_error => "principal_ip_failure"
      }

      if ![principal_ip_failure] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
        }
        mutate {
          merge => {
            "principal.ip" => "principal_ip"
          }
          on_error => "principal_ip_not_set"
        }
      }
      else {
        mutate {
          replace => {
            "principal.hostname" => "%{principal_ip}"
            "principal_machine_id_present" => "true"
          }
          on_error => "principal_ip_not_set"
        }
      }
    }
  }

  if [suser] != "" {
    grok {
      match => {
        "suser" => ["^(?P<suser_name>[^|]+)\\|(?P<suser_app>[^|]+)\\|(?P<suser_dept>[^?]+)\\?%{GREEDYDATA:suser_kv}$"]
      }
      overwrite => ["suser_name", "suser_app", "suser_dept", "suser_kv"]
      on_error => "suser_grok_failure"
    }
    if ![suser_grok_failure] {
      if [suser_name] != "" {
        mutate {
          replace => {
            "principal.user.user_display_name" => "%{suser_name}"
          }
          on_error => "suser_display_not_set"
        }
      }
      if [suser_app] != "" {
        mutate {
          replace => {
            "principal.application" => "%{suser_app}"
          }
          on_error => "suser_app_not_set"
        }
      }
      if [suser_dept] != "" {
        mutate {
          merge => {
            "principal.user.department" => "suser_dept"
          }
          on_error => "suser_dept_not_set"
        }
      }
      if [suser_kv] != "" {
        mutate {
          gsub => ["suser_kv", "\\\\=", "="]
        }
        kv {
          source => "suser_kv"
          field_split => "&"
          value_split => "="
          on_error => "suser_kv_failure"
        }
        if [euid] != "" {
          mutate {
            replace => {
              "principal.user.userid" => "%{euid}"
              "has_user" => "true"
            }
            on_error => "euid_not_set"
          }
        }
        if [eaid] != "" {
          mutate {
            replace => {
              "principal.user.product_object_id" => "%{eaid}"
              "has_user" => "true"
            }
            on_error => "eaid_not_set"
          }
        }
        if [x_eaid] != "" {
          mutate {
            replace => {
              "principal.user.employee_id" => "%{x_eaid}"
              "has_user" => "true"
            }
            on_error => "x_eaid_not_set"
          }
        }
        if [link_clicked] != "" {
          grok {
            match => {
              "link_clicked" => ["^(?P<link_clicked_val>\\d+)-(?P<suser_email>.+)$"]
            }
            overwrite => ["link_clicked_val", "suser_email"]
            on_error => "link_clicked_grok_failure"
          }
          if [suser_email] != "" {
            mutate {
              merge => {
                "principal.user.email_addresses" => "suser_email"
              }
              replace => {
                "has_user" => "true"
              }
              on_error => "suser_email_not_set"
            }
          }
          if [link_clicked_val] != "" {
            mutate {
              replace => {
                "label_link_clicked.key" => "link_clicked"
                "label_link_clicked.value" => "%{link_clicked_val}"
              }
            }
            mutate {
              merge => {
                "principal.user.attribute.labels" => "label_link_clicked"
              }
              on_error => "label_link_clicked_not_set"
            }
          }
        }
        if [campaign_label] != "" {
          mutate {
            replace => {
              "label_campaign_label.key" => "campaign_label"
              "label_campaign_label.value" => "%{campaign_label}"
            }
          }
          mutate {
            merge => {
              "principal.user.attribute.labels" => "label_campaign_label"
            }
            on_error => "label_campaign_label_not_set"
          }
        }
        if [utm_source] != "" {
          mutate {
            replace => {
              "label_utm_source.key" => "utm_source"
              "label_utm_source.value" => "%{utm_source}"
            }
          }
          mutate {
            merge => {
              "principal.user.attribute.labels" => "label_utm_source"
            }
            on_error => "label_utm_source_not_set"
          }
        }
        if [utm_campaign] != "" {
          mutate {
            replace => {
              "label_utm_campaign.key" => "utm_campaign"
              "label_utm_campaign.value" => "%{utm_campaign}"
            }
          }
          mutate {
            merge => {
              "principal.user.attribute.labels" => "label_utm_campaign"
            }
            on_error => "label_utm_campaign_not_set"
          }
        }
        if [utm_medium] != "" {
          mutate {
            replace => {
              "label_utm_medium.key" => "utm_medium"
              "label_utm_medium.value" => "%{utm_medium}"
            }
          }
          mutate {
            merge => {
              "principal.user.attribute.labels" => "label_utm_medium"
            }
            on_error => "label_utm_medium_not_set"
          }
        }
        if [email_sent] != "" {
          mutate {
            replace => {
              "label_email_sent.key" => "email_sent"
              "label_email_sent.value" => "%{email_sent}"
            }
          }
          mutate {
            merge => {
              "principal.user.attribute.labels" => "label_email_sent"
            }
            on_error => "label_email_sent_not_set"
          }
        }
      }
    }
    else {
      if [suser] =~ "^.{1,256}$" {
        mutate {
          replace => {
            "principal.user.userid" => "%{suser}"
          }
          on_error => "suser_not_set"
        }
      }
      else {
        mutate {
          replace => {
            "principal.user.user_display_name" => "%{suser}"
          }
          on_error => "suser_not_set"
        }
      }
    }
  }

  if [duser] != "" and [duser] !~ ";" {
    mutate {
      replace => {
        "target.user.userid" => "%{duser}"
      }
      on_error => "duser_not_set"
    }
  }
  else if [duser] =~ ";" {
    mutate {
      gsub => ["duser",";",'\",\"']
    }
    mutate {
      replace => {
        "duser" => '{\"duser_array\":[\"%{duser}\"]}'
      }
      on_error => "duser_not_set"
    }
    json {
      source => "duser"
      array_function => "split_columns"
      on_error => "invalid_json"
    }
    for emailId in duser_array {
      mutate {
        merge => {
          "target.user.email_addresses" => "emailId"
        }
        on_error => "duser_array_not_set"
      }
    }
  }

  if [msg] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{msg}"
      }
      on_error => "msg_not_set"
    }
  }

  if [cs1Label] == "eventType" and [cs1] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{cs1}"
      }
      on_error => "cs1_not_set"
    }
  }
  else if [cs1Label] != "" and [cs1] != "" {
    mutate {
      replace => {
        "additional_cs1.key" => "%{cs1Label}"
        "additional_cs1.value.string_value" => "%{cs1}"
      }
      on_error => "additional_cs1_not_set"
    }
    if ![additional_cs1_not_set] {
      mutate {
        merge => {
          "additional.fields" => "additional_cs1"
        }
        on_error => "additional_cs1_not_set"
      }
    }
  }

  if [cs2Label] == "domainName" and [cs2] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{cs2}"
        "principal_machine_id_present" => "true"
      }
      on_error => "cs2_not_set"
    }
  }
  else if [cs2Label] == "direction" and [cs2] != "" {
    mutate {
      replace => {
        "network_direction" => "%{cs2}"
      }
      on_error => "cs2_not_set"
    }
  }
  else if [cs2Label] != "" and [cs2] != "" {
    mutate {
      replace => {
        "additional_cs2.key" => "%{cs2Label}"
        "additional_cs2.value.string_value" => "%{cs2}"
      }
      on_error => "additional_cs2_not_set"
    }
    if ![additional_cs2_not_set] {
      mutate {
        merge => {
          "additional.fields" => "additional_cs2"
        }
        on_error => "additional_cs2_not_set"
      }
    }
  }

  if [cs3Label] == "direction" and [cs3] != "" {
    mutate {
      replace => {
        "network_direction" => "%{cs3}"
      }
      on_error => "cs3_not_set"
    }
  }
  else if [cs3Label] != "" and [cs3] != "" {
    mutate {
      replace => {
        "additional_cs3.key" => "%{cs3Label}"
        "additional_cs3.value.string_value" => "%{cs3}"
      }
      on_error => "additional_cs3_not_set"
    }

    if ![additional_cs3_not_set] {
      mutate {
        merge => {
          "additional.fields" => "additional_cs3"
        }
        on_error => "additional_cs3_not_set"
      }
    }
  }

  if [cs4Label] != "" and [cs4] != "" {
    mutate {
      replace => {
        "additional_cs4.key" => "%{cs4Label}"
        "additional_cs4.value.string_value" => "%{cs4}"
      }
      on_error => "additional_cs4_not_set"
    }
    if ![additional_cs4_not_set] {
      mutate {
        merge => {
          "additional.fields" => "additional_cs4"
        }
        on_error => "additional_cs4_not_set"
      }
    }
  }

  if [cn1Label] != "" and [cn1] != "" {
    mutate {
      replace => {
        "additional_cn1.key" => "%{cn1Label}"
        "additional_cn1.value.string_value" => "%{cn1}"
      }
      on_error => "additional_cn1_not_set"
    }
    if ![additional_cn1_not_set] {
      mutate {
        merge => {
          "additional.fields" => "additional_cn1"
        }
        on_error => "additional_cn1_not_set"
      }
    }
  }

  if [cs5Label] == "policyName" and [cs5] != "" {
    mutate {
      replace => {
        "security_result.rule_name" => "%{cs5}"
      }
    }
  }
  else if [cs5Label] != "" and [cs5] != "" {
    mutate {
      replace => {
        "additional_cs5.key" => "%{cs5Label}"
        "additional_cs5.value.string_value" => "%{cs5}"
      }
      on_error => "additional_cs5_not_set"
    }
    if ![additional_cs5_not_set] {
      mutate {
        merge => {
          "additional.fields" => "additional_cs5"
        }
        on_error => "additional_cs5_not_set"
      }
    }
  }

  if [cs6Label] == "embeddedUrl" and [cs6] != "" {
    mutate {
      gsub => ["cs6", '\\\\\"', ""]
    }
    mutate {
      gsub => ["cs6", '\\[', ""]
    }
    mutate {
      gsub => ["cs6", '\\]', ""]
    }
    mutate {
      replace => {
        "target.url" => "%{cs6}"
      }
      on_error => "cs6_not_set"
    }
  }
    else if [cs6Label] == "details" and [cs6] =~ "urlInfo" {
    mutate {
      gsub => [
        "cs6", "\\\\=", "=",
        "cs6", "\\\\\\\\u0026", "&"
      ]
    }
    json {
      source => "cs6"
      array_function => "split_columns"
      on_error => "cs6_json_failure"
    }
    if ![cs6_json_failure] {
      for item in urlInfo {
        if [item][url] != "" {
          mutate {
            replace => {
              "target.url" => "%{item.url}"
            }
            on_error => "url_not_set"
          }
        }
        if [item][extractType] != "" {
          mutate {
            replace => {
              "extract_type_field.key" => "extractType"
              "extract_type_field.value" => "%{item.extractType}"
            }
            on_error => "extract_type_not_set"
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "extract_type_field"
            }
            on_error => "extract_type_merge_failure"
          }
        }
        if [item][urlType] != "" {
          mutate {
            replace => {
              "url_type_field.key" => "urlType"
              "url_type_field.value" => "%{item.urlType}"
            }
            on_error => "url_type_not_set"
          }
          mutate {
            merge => {
              "security_result.detection_fields" => "url_type_field"
            }
            on_error => "url_type_merge_failure"
          }
        }
      }
    }
  }
  else if [cs6Label] != "" and [cs6] != "" {
    mutate {
      replace => {
        "additional_cs6.key" => "%{cs6Label}"
        "additional_cs6.value.string_value" => "%{cs6}"
      }
      on_error => "additional_cs6_not_set"
    }
    if ![additional_cs6_not_set] {
      mutate {
        merge => {
          "additional.fields" => "additional_cs6"
        }
        on_error => "additional_cs6_not_set"
      }
    }
  }

  mutate {
    uppercase => ["network_direction"]
  }
  if [network_direction] == "INCOMING" {
    mutate {
      replace => {
        "network.direction" => "INBOUND"
      }
    }
  }
  else if [network_direction] == "OUTGOING" {
    mutate {
      replace => {
        "network.direction" => "OUTBOUND"
      }
    }
  }

  mutate {
    uppercase => ["severity", "requestMethod"]
  }

  if [severity] in ["0", "1", "2", "3", "LOW"] {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] in ["4", "5", "6", "MEDIUM", "SUBSTANTIAL", "INFO"] {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] in ["7", "8", "HIGH", "SEVERE"] {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] in ["9", "10", "VERY-HIGH", "CRITICAL"] {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }

  mutate {
    uppercase => ["act"]
  }

  if [act] == "ALLOW" {
    mutate {
      merge => {
        "security_result.action" => "act"
      }
      on_error => "act_not_set"
    }
  }
  else if [act] == "DENY" {
    mutate {
      replace => {
        "security_result_action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "security_result.action" => "security_result_action"
      }
      on_error => "act_not_set"
    }
  }
  else if [act] == "QUARANTINE" {
    mutate {
      merge => {
        "security_result.action" => "act"
      }
      on_error => "act_not_set"
    }
  }

  mutate {
    replace => {
      "security_result.action_details" => "%{act}"
    }
    on_error => "act_not_set"
  }

  if [cs1] == "phishing" and [principal_machine_id_present] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "SCAN_UNCATEGORIZED"
      }
    }
  }
  else if [message] =~ "login" and ([suser] != "" or [duser] != "") {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
    if [duser] == "" {
      mutate {
        rename => {
          "principal.user.userid" => "target.user.userid"
        }
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [principal_machine_id_present] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }

  mutate {
    rename => {
      "additional" => "event.idm.read_only_udm.additional"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_not_set"
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_not_set"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
