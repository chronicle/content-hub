# Product: Opnsense
# Category: Firewall and Routing Platform
# Supported Format: Syslog, Syslog + CSV
# Reference: https://docs.opnsense.org/index.html
# Last Updated: 2025-09-17
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "sec_result" => ""
      "ts" => ""
      "domain" => ""
      "application" => ""
      "message_1" => ""
      "column1" => ""
      "column4" => ""
      "column5" => ""
      "column6" => ""
      "column7" => ""
      "column8" => ""
      "column10" => ""
      "column12" => ""
      "column13" => ""
      "column14" => ""
      "column15" => ""
      "column16" => ""
      "column17" => ""
      "column18" => ""
      "column19" => ""
      "column20" => ""
      "column21" => ""
      "column22" => ""
      "column24" => ""
      "column29" => ""
      "column27" => ""
      "column25" => ""
      "column23" => ""
      "column9" => ""
      "column2" => ""
      "column3" => ""
      "column11" => ""
      "column26" => ""
      "column28" => ""
      "data_length" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "intermediary" => ""
      "inter_host" => ""
      "pid" => ""
    }
  }
  grok {
    match => {
      "message" => [
        "<%{POSINT}>%{SYSLOGTIMESTAMP:ts} %{DATA:inter_host} %{DATA:application}\\[%{INT}\\]: %{GREEDYDATA:message_1}",
        "<%{POSINT}>%{INT} (%{TIMESTAMP_ISO8601:ts}|%{SYSLOGTIMESTAMP:ts}) %{DATA:inter_host} %{DATA:application} %{INT} - \\[%{DATA}\\] %{GREEDYDATA:message_1}",
        "(<%{INT}>|%{INT}>)%{INT} %{TIMESTAMP_ISO8601:ts} %{DATA:inter_host} %{DATA:application} %{INT} - - %{GREEDYDATA:message_1}",
        "<%{INT}>%{TIMESTAMP_ISO8601:ts} %{DATA:inter_host} %{DATA:application}\\[%{INT:pid}\\]: %{GREEDYDATA:message_1}",
        "<%{INT}>%{GREEDYDATA} %{IP} %{INT} %{TIMESTAMP_ISO8601:ts} %{DATA:inter_host} %{DATA:application} %{INT} - \\[%{DATA}] %{GREEDYDATA:message_1}",
        "<%{INT}>%{SYSLOGTIMESTAMP:ts} %{DATA:inter_host} %{DATA:application}: %{GREEDYDATA:message_1}"
      ]
    }
    overwrite => ["ts", "inter_host", "application", "message_1", "pid"]
    on_error => "grok_failed"
  }
  if [grok_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [application] =~ "filterlog" {
    if [message_1] != "" {
      csv {
        source => "message_1"
        on_error => "not_csv_pattern"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.description" => "%{message_1}"
      }
      on_error => "description_absent"
    }
  }
  if [ts] != "" {
    date {
      match => ["ts", "ISO8601", "RFC3339", "yyyy-MM-ddTHH:mm:ss.SSSSSSZ"]
      target => "metadata.event_timestamp"
      on_error => "diff_format"
    }
    if [diff_format] {
      date {
        match => ["ts", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
        rebase => true
        target => "metadata.event_timestamp"
        on_error => "diff_format_no_year"
      }
    }
  }
  if [application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{application}"
      }
      on_error => "application_absent"
    }
  }
  if [inter_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{inter_host}"
      }
      on_error => "domain_absent"
    }
  }
  if [pid] != "" {
    mutate {
      rename => {
        "pid" => "principal.process.pid"
      }
    }
  }
  if [column1] != "" {
    mutate {
      replace => {
        "sec_result.rule_id" => "%{column1}"
      }
      on_error => "rule_id_absent"
    }
  }
  if [column4] != "" {
    mutate {
      replace => {
        "tracker_label.key" => "tracker"
        "tracker_label.value.string_value" => "%{column4}"
      }
      on_error => "tracker_absent"
    }
    if ![tracker_absent] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tracker_label"
        }
        on_error => "tracker_merge_failed"
      }
    }
  }
  if [column5] != "" {
    mutate {
      replace => {
        "intf_label.key" => "interface"
        "intf_label.value.string_value" => "%{column5}"
      }
      on_error => "interface_absent"
    }
    if ![interface_absent] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "intf_label"
        }
        on_error => "interface_merge_failed"
      }
    }
  }
  if [column6] != "" {
    mutate {
      replace => {
        "sec_result.rule_type" => "%{column6}"
      }
      on_error => "rule_type_absent"
    }
  }
  if [column7] == "block" {
    mutate {
      replace => {
        "action" => "BLOCK"
      }
    }
    mutate {
      merge => {
        "sec_result.action" => "action"
      }
      on_error => "rule_action_absent"
    }
  }
  else if [column7] == "pass" {
    mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "sec_result.action" => "action"
      }
      on_error => "rule_action_absent"
    }
  }
  if [column8] != "" {
    if [column8] == "in" {
      mutate {
        replace => {
          "network.direction" => "INBOUND"
        }
        on_error => "no_network_direction"
      }
    }
    else if [column8] == "out" {
      mutate {
        replace => {
          "network.direction" => "OUTBOUND"
        }
        on_error => "no_network_direction"
      }
    }
  }
  if [column10] != "" {
    mutate {
      replace => {
        "tos_label.key" => "tos"
        "tos_label.value.string_value" => "%{column10}"
      }
      on_error => "tos_absent"
    }
    if ![tos_absent] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tos_label"
        }
        on_error => "tos_merge_failed"
      }
    }
  }
  if [column12] != "" {
    mutate {
      replace => {
        "ttl_label.key" => "ttl"
        "ttl_label.value.string_value" => "%{column12}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "ttl_label"
      }
      on_error => "ttl_merge_failed"
    }
  }
  if [column13] not in ["udp", "icmp"] {
    if [column13] != "" {
      mutate {
        replace => {
          "id_label.key" => "Id"
          "id_label.value.string_value" => "%{column13}"
        }
        on_error => "id_not_found"
      }
      if ![id_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "id_label"
          }
          on_error => "id_merge_failed"
        }
      }
    }
    if [column14] != "" {
      mutate {
        replace => {
          "offset_label.key" => "offset"
          "offset_label.value.string_value" => "%{column14}"
        }
        on_error => "offset_not_found"
      }

      if ![offset_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "offset_label"
          }
          on_error => "offset_merge_failed"
        }
      }
    }
    if [column15] != "" {
      mutate {
        replace => {
          "flags_label.key" => "flags"
          "flags_label.value.string_value" => "%{column15}"
        }
        on_error => "key_length_not_found"
      }
      if ![key_length_not_found] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "flags_label"
          }
          on_error => "flags_merge_failed"
        }
      }
    }
    if [column16] =~ "fe" {
      if [column16] != "" {
        grok {
          match => {
            "column16" => "%{IP:column16}"
          }
          overwrite => ["column16"]
          on_error => "ip_failure"
        }
        if ![ip_failure] {
          mutate {
            merge => {
              "principal.ip" => "column16"
              "principal.asset.ip" => "column16"
            }
            on_error => "prin_ip"
          }
          if ![prin_ip] {
            mutate {
              replace => {
                "has_principal" => "true"
              }
            }
          }
        }
      }
      if [column17] != "" {
        grok {
          match => {
            "column17" => "%{IP:column17}"
          }
          overwrite => ["column17"]
          on_error => "ip_failure"
        }
        if ![ip_failure] {
          mutate {
            merge => {
              "target.ip" => "column17"
              "target.asset.ip" => "column17"
            }
            on_error => "taregt_ip"
          }
          if ![taregt_ip] {
            mutate {
              replace => {
                "has_target" => "true"
              }
            }
          }
        }
      }
      if [column18] != "" and [column18] !~ "truncated" {
        grok {
          match => {
            "column18" => "%{INT:column18}"
          }
          overwrite => ["column18"]
          on_error => "principal_port_grok_failed"
        }
        if ![principal_port_grok_failed] {
          mutate {
            replace => {
              "principal.port" => "%{column18}"
            }
            on_error => "principal_port_absent"
          }
          mutate {
            convert => {
              "principal.port" => "integer"
            }
            on_error => "principal_port_conversion_failed"
          }
        }
      }
      if [column19] != "" {
        grok {
          match => {
            "column19" => "%{INT:column19}"
          }
          overwrite => ["column19"]
          on_error => "target_port_grok_failed"
        }
        if ![target_port_grok_failed] {
          mutate {
            replace => {
              "target.port" => "%{column19}"
            }
            on_error => "target_port_absent"
          }
          mutate {
            convert => {
              "target.port" => "integer"
            }
            on_error => "target_port_conversion_failed"
          }
        }
      }
      if [column20] != "" {
        mutate {
          replace => {
            "data_length_label.value.string_value" => "%{column20}"
          }
          on_error => "data_length_not_found"
        }
        if ![data_length_not_found] {
          mutate {
            replace => {
              "data_length_label.key" => "data_length"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "data_length_label"
            }
            on_error => "data_label_merge_failed"
          }
        }
      }
    }
    else {
      if [column18] != "" {
        mutate {
          convert => {
            "column18" => "uinteger"
          }
          on_error => "conversion_failed"
        }
        if ![conversion_failed] {
          mutate {
            rename => {
              "column18" => "network.received_bytes"
            }
          }
        }
      }
      if [column17] != "" and [column17] !~ "fe" {
        mutate {
          uppercase => ["column17"]
        }
        if [column17] =~ "(?i)UDP|(?i)ICMP|(?i)GRE|(?i)TCP|(?i)ESP|(?i)IGMP|(?i)VRRP|(?i)PIM|(?i)IP6IN4|(?i)ETHERIP|(?i)EIGRP" {
          mutate {
            replace => {
              "network.ip_protocol" => "%{column17}"
            }
            on_error => "protocol_absent"
          }
        }
      }
      else if [column17] != "" {
        grok {
          match => {
            "column17" => "%{IP:column17}"
          }
          overwrite => ["column17"]
          on_error => "ip_failure"
        }
        if ![ip_failure] {
          mutate {
            merge => {
              "target.ip" => "column17"
              "target.asset.ip" => "column17"
            }
            on_error => "taregt_ip"
          }
          if ![taregt_ip] {
            mutate {
              replace => {
                "has_target" => "true"
              }
            }
          }
        }
      }
      if [column19] != "" {
        grok {
          match => {
            "column19" => "%{IP:column19}"
          }
          overwrite => ["column19"]
          on_error => "ip_failure"
        }
        if ![ip_failure] {
          mutate {
            merge => {
              "principal.ip" => "column19"
              "principal.asset.ip" => "column19"
            }
            on_error => "principal_ip_absent"
          }
          mutate {
            replace => {
              "has_principal" => "true"
            }
          }
        }
      }
      if [column20] != "" {
         grok {
          match => {
            "column20" => "%{IP:column20}"
          }
          overwrite => ["column20"]
          on_error => "ip_failure"
        }
        if ![ip_failure] {
          mutate {
            merge => {
              "target.ip" => "column20"
              "target.asset.ip" => "column20"
            }
            on_error => "target_ip_absent"
          }
          mutate {
            replace => {
              "has_target" => "true"
            }
          }
        }
      }
    }
    if [column17] in ["UDP", "TCP"] {
      if [column21] != "" {
        grok {
          match => {
            "column21" => "%{INT:column21}"
          }
          overwrite => ["column21"]
          on_error => "principal_port_grok_failed"
        }
        if ![principal_port_grok_failed] {
          mutate {
            replace => {
              "principal.port" => "%{column21}"
            }
            on_error => "principal_port_absent"
          }
          mutate {
            convert => {
              "principal.port" => "integer"
            }
            on_error => "principal_port_conversion_failed"
          }
        }
        else {
          mutate {
            replace => {
              "req_label.key" => "col21"
              "req_label.value.string_value" => "%{column21}"
            }
            on_error => "req_label_absent"
          }
          if ![req_label_absent] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "req_label"
              }
              on_error => "req_label_merge_failed"
            }
          }
        }
      }
      if [column22] != "" {
        mutate {
          replace => {
            "target.port" => "%{column22}"
          }
          on_error => "target_port_absent"
        }
        mutate {
          convert => {
            "target.port" => "integer"
          }
          on_error => "target_port_conversion_failed"
        }
      }
    }
    else if [column17] in ["ICMP", "GRE", "ESP", "IGMP"] {
      grok {
        match => {
          "column21" => [
            "datalength\\=%{GREEDYDATA:data_length}"
          ]
        }
        overwrite => ["data_length"]
        on_error => "datalength_grok_failed"
      }
      if [data_length] != "" {
        mutate {
          replace => {
            "data_length_label.key" => "data_length"
            "data_length_label.value.string_value" => "%{data_length}"
          }
          on_error => "data_length_not_found"
        }
        if ![data_length_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "data_length_label"
            }
            on_error => "data_label_merge_failed"
          }
        }
      }
      else {
        mutate {
          convert => {
            "column21" => "string"
          }
          on_error => "col21_conversion_failed"
        }
        mutate {
          replace => {
            "data_length_label.key" => "col21"
            "data_length_label.value.string_value" => "%{column21}"
          }
          on_error => "data_length_not_found"
        }
        if ![data_length_not_found] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "data_length_label"
            }
            on_error => "data_label_merge_failed"
          }
        }
      }
      if [column22] != "" {
        grok {
          match => {
            "column22" => "%{INT:column22}"
          }
          overwrite => ["column22"]
          on_error => "target_port_grok_failed"
        }
        if ![target_port_grok_failed] {
          mutate {
            replace => {
              "target.port" => "%{column22}"
            }
            on_error => "target_port_absent"
          }
          mutate {
            convert => {
              "target.port" => "integer"
            }
            on_error => "target_port_conversion_failed"
          }
        }
        else {
          mutate {
            replace => {
              "col22_label.key" => "col22"
              "col22_label.value.string_value" => "%{column22}"
            }
            on_error => "col22_label_absent"
          }
          if ![col22_label_absent] {
            mutate {
              merge => {
                "event.idm.read_only_udm.additional.fields" => "col22_label"
              }
              on_error => "col22_label_merge_failed"
            }
          }
        }
      }
    }
    if [column17] == "TCP" {
      if [column29] != "" {
        mutate {
          replace => {
            "tcpOps_label.key" => "tcp_options"
            "tcpOps_label.value.string_value" => "%{column29}"
          }
          on_error => "tcp_options_absent"
        }
        if ![tcp_options_absent] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "tcpOps_label"
            }
            on_error => "tcpOps_merge_failed"
          }
        }
      }
      if [column24] != "" {
        mutate {
          replace => {
            "tcpFlags_label.key" => "tcp_flags"
            "tcpFlags_label.value.string_value" => "%{column24}"
          }
          on_error => "tcp_flags_absent"
        }
        if ![tcp_flags_absent] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "tcpFlags_label"
            }
            on_error => "tcpFlags_merge_failed"
          }
        }
      }
    }
  }
  else {
    mutate {
      uppercase => ["column13"]
    }
    if [column13] =~ "(?i)UDP|(?i)ICMP|(?i)GRE|(?i)TCP|(?i)ESP|(?i)IGMP|(?i)VRRP|(?i)PIM|(?i)IP6IN4|(?i)ETHERIP|(?i)EIGRP" {
      mutate {
        replace => {
          "network.ip_protocol" => "%{column13}"
        }
        on_error => "not_valid_protocol"
      }
    }
    if [column18] != "" and [column18] !~ "truncated" {
      grok {
        match => {
          "column18" => "%{INT:column18}"
        }
        overwrite => ["column18"]
        on_error => "principal_port_grok_failed"
      }
      if ![principal_port_grok_failed] {
        mutate {
          replace => {
            "principal.port" => "%{column18}"
          }
          on_error => "principal_port_absent"
        }
        mutate {
          convert => {
            "principal.port" => "integer"
          }
          on_error => "principal_port_conversion_failed"
        }
      }
    }
    if [column19] != "" {
      grok {
        match => {
          "column19" => "%{INT:column19}"
        }
        overwrite => ["column19"]
        on_error => "target_port_grok_failed"
      }
      if ![target_port_grok_failed] {
        mutate {
          replace => {
            "target.port" => "%{column19}"
          }
          on_error => "target_port_absent"
        }
        mutate {
          convert => {
            "target.port" => "integer"
          }
          on_error => "target_port_conversion_failed"
        }
      }
    }

    if [column20] != "" {
      mutate {
        replace => {
          "data_length_label.value.string_value" => "%{column20}"
        }
        on_error => "data_length_not_found"
      }
      if ![data_length_not_found] {
        mutate {
          replace => {
            "data_length_label.key" => "data_length"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "data_length_label"
          }
          on_error => "data_label_merge_failed"
        }
      }
    }
    if [column16] != "" {
      grok {
        match => {
          "column16" => "%{IP:column16}"
        }
        overwrite => ["column16"]
        on_error => "ip_failure"
      }
      if ![ip_failure] {
        mutate {
          merge => {
            "principal.ip" => "column16"
            "principal.asset.ip" => "column16"
          }
          on_error => "ip_error"
        }
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }

    if [column17] != "" {
      grok {
        match => {
          "column17" => "%{IP:column17}"
        }
        overwrite => ["column17"]
        on_error => "ip_failure"
      }
      if ![ip_failure] {
        mutate {
          merge => {
            "target.ip" => "column17"
            "target.asset.ip" => "column17"
          }
          on_error => "ip_merge_error"
        }
        mutate {
          replace => {
            "has_target" => "true"
          }
        }
      }
    }

    if [column16] != "" and [column17] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "NETWORK_CONNECTION"
        }
      }
    }
  }
  if [column23] != "" {
    mutate {
      convert => {
        "column23" => "string"
      }
      on_error => "col23_conversion_failed"
    }
    mutate {
      replace => {
        "col23_label.value.string_value" => "%{column23}"
      }
      on_error => "col23_not_found"
    }
    if ![col23_not_found] {
      mutate {
        replace => {
          "col23_label.key" => "col23"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "col23_label"
        }
        on_error => "data_label_merge_failed"
      }
    }
  }
  mutate {
    rename => {
      "column27" => "addition.col27_label"
      "column25" => "addition.col25_label"
      "column16" => "addition.col16_label"
      "column9" => "addition.col9_label"
      "column2" => "addition.col2_label"
      "column3" => "addition.col3_label"
      "column11" => "addition.col11_label"
      "column26" => "addition.col26_label"
      "column28" => "addition.col28_label"
    }
  }
  for key, value in addition map {
    mutate {
      remove_field => ["_field", "is_value_empty", "is_key_empty", "value_conversion_failure"]
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_failure"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "is_value_empty"
    }
    if ![is_value_empty] and [value] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
        on_error => "is_key_empty"
      }
      if [key] in ["col16_label", "col25_label", "col27_label", "col9_label", "col2_label", "col3_label", "col11_label", "col26_label", "col28_label"] {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
          on_error => "is_value_empty"
        }
        if ![is_value_empty] {
          mutate {
            merge => {
              "event.idm.read_only_udm.additional.fields" => "_field"
            }
            on_error => "addition_merge_failed"
          }
        }
      }
    }
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "OPNSENSE"
      "metadata.product_name" => "OPNSENSE"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_merge_failed"
    }
  }
  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
