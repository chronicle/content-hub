# Product: Zscaler NSS Feeds
# Category: Alert log types
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2024-10-21
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "principal" => ""
      "target" => ""
      "network" => ""
      "metadata" => ""
      "additional" => ""
      "security_result" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "meta.source.host" => ""
      "meta.source.port" => ""
      "meta.source.type" => ""
      "meta.proxy.host" => ""
      "meta.proxy.port" => ""
      "meta.slt.node" => ""
      "meta.slt.pipeline" => ""
      "meta.customer" => ""
      "meta.timestamp.producer_process" => ""
    }
  }
  mutate {
    gsub => ["message", "metadata", "meta"]
  }
  mutate {
    replace => {
      "metadata.vendor_name" => "Zscaler"
      "metadata.product_name" => "Zscaler NSS Feeds"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [meta][source][host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{meta.source.host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{meta.source.host}"
        "has_principal" => "true"
      }
      on_error => "invalid_host"
    }
  }
  mutate {
    convert => {
      "meta.source.port" => "string"
    }
    on_error => "source_port_conversion_failure"
  }
  if [meta][source][port] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{meta.source.port}"
      }
      on_error => "invalid_port"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "port_conversion_failure"
    }
  }
  if [meta][proxy][port] not in ["", "n/a"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{meta.proxy.host}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{meta.proxy.host}"
      }
      on_error => "invalid_host"
    }
  }
  mutate {
    convert => {
      "meta.proxy.port" => "string"
    }
    on_error => "proxy_port_conversion_failure"
  }
  if [meta][proxy][port] not in ["", "n/a"] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{meta.proxy.port}"
      }
      on_error => "invalid_port"
    }
    mutate {
      convert => {
        "meta.proxy.port" => "integer"
      }
      on_error => "proxy_port_conversion_failure"
    }
  }
  if [meta][slt][node] != "" {
    mutate {
      replace => {
        "meta_slt_node_field.value.string_value" => "%{meta.slt.node}"
      }
      on_error => "invalid_node"
    }
    if ![invalid_node] {
      mutate {
        replace => {
          "meta_slt_node_field.key" => "node"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "meta_slt_node_field"
        }
        on_error => "node_label_merge_failure"
      }
    }
  }
  if [meta][slt][pipeline] != "" {
    mutate {
      replace => {
        "meta_slt_pipeline_field.value.string_value" => "%{meta.slt.pipeline}"
      }
      on_error => "invalid_pipeline"
    }
    if ![invalid_pipeline] {
      mutate {
        replace => {
          "meta_slt_pipeline_field.key" => "pipeline"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "meta_slt_pipeline_field"
        }
        on_error => "pipeline_label_merge_failure"
      }
    }
  }
  if [meta][customer] != "" {
    mutate {
      replace => {
        "meta_customer_field.value.string_value" => "%{meta.customer}"
      }
      on_error => "invalid_customer"
    }
    if ![invalid_customer] {
      mutate {
        replace => {
          "meta_customer_field.key" => "customer"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "meta_customer_field"
        }
        on_error => "customer_label_merge_failure"
      }
    }
  }
  if [meta][source][type] != "" {
    mutate {
      replace => {
        "meta_source_type_field.value.string_value" => "%{meta.source.type}"
      }
      on_error => "invalid_source_type"
    }
    if ![invalid_source_type] {
      mutate {
        replace => {
          "meta_source_type_field.key" => "type"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "meta_source_type_field"
        }
        on_error => "source_type_label_merge_failure"
      }
    }
  }
  date {
    match => ["meta.timestamp.producer_process", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSZ"]
    on_error => "invalid_timestamp"
  }
  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  # Generate output
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
