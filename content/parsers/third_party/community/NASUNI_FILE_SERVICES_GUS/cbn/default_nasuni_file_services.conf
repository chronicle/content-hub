# Product: Nasuni File Services Platform
# Category: Data Transfer
# Supported Format: SYSLOG + JSON , CSV
# Reference: https://www.nasuni.com/product-overview/
# Last Updated: 2025-03-24
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "username" => ""
      "sid" => ""
      "ipaddr" => ""
      "path" => ""
      "newpath" => ""
      "pid" => ""
      "groupname" => ""
      "gid" => ""
      "resource" => ""
      "tid" => ""
      "event_type" => ""
      "proto" => ""
      "sequence" => ""
      "volume" => ""
      "offset" => ""
      "uid" => ""
      "is_dir" => ""
      "host" => ""
      "application" => ""
      "proc_id" => ""
      "structure_data" => ""
      "msg" = ""
      "prin_port" => ""
      "product_log_id" => ""
      "target.hostname" => ""
      "time" => ""
      "event_timestamp" => ""
      "action" => ""
      "group_identifiers" => ""
      "security_result" => ""
      "has_principal" => "false"
    }
  }

  grok {
    match => {
      "message" => [
        "%{INT:version} %{TIMESTAMP_ISO8601:time} %{HOSTNAME:host} %{GREEDYDATA:application} %{INT:proc_id} %{INT:product_log_id} %{DATA:structure_data} %{GREEDYDATA:msg}"
        "<%{INT}>%{INT} %{DATA:time} %{GREEDYDATA} %{INT:product_log_id} - %{GREEDYDATA:msg}",
      ]
    }
    overwrite => ["time", "product_log_id","host","application","proc_id","structure_data","msg"]
    on_error => "pattern_not_matched"
  }
  json {
    source => "msg"
    array_function => "split_columns"
    on_error => "not_json"
  }

  if [not_json] and [pattern_not_matched] {
    csv {
      source => "message"
      separator => ","
      on_error => "csv_not_matched"
    }
    if [csv_not_matched] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
    else {
      mutate {
        replace => {
          "event_timestamp" => "%{column1}"
          "event_type" => "%{column2}"
          "action" => "%{column3}"
          "path" => "%{column4}"
          "username" => "%{column6}"
          "groupname" => "%{column7}"
          "sid" => "%{column8}"
          "group_identifiers" => "%{column9}"
          "application" => "%{column10}"
          "ipaddr" => "%{column11}"
        }
        on_error => "field_not_found"
      }
    }
  }

  if [event_timestamp] != "" {
    date {
      match => ["event_timestamp","ISO8601","yyyy-MM-dd HH:mm:ss.SSSSSS"]
      on_error => "date_not_matched"
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{action}"
      }
      on_error => "field_not_found"
    }
  }

  if [group_identifiers] != "" {
    mutate {
      gsub => ['group_identifiers', ', ', '\",\"']
    }
    mutate {
      replace => {
        "group_identifiers" => "{\"group_identifiers\":[\"%{group_identifiers}\"]}"
      }
      on_error => "field_not_found"
    }
    json {
      source => "group_identifiers"
      array_function => "split_columns"
      on_error => "json_not_matched"
    }
    for grp in group_identifiers {
      mutate {
        merge => {
          "target.user.group_identifiers" => "grp"
        }
        on_error => "field_not_found"
      }
    }
  }

  if [time] != "" {
    grok {
      match => {
        "time" => [
          "(?P<date>\\d+-\\d+-\\d+)T(?P<time_stamp>\\d+:\\d+:\\d+)(\.)?\\S+"
        ]
      }
    }

    mutate {
      replace => {
        "when" => "%{date} %{time_stamp}"
      }
    }
    date {
      match => ["when", "yyyy-MM-dd HH:mm:ss"]
    }
  }

  if [username] != "" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{username}"
      }
    }
  }

  if [sid] != "" and [sid] =~ "^S-\\\\d-(\\\\d+-){1,14}\\\\d+$"  {
    mutate {
      replace => {
        "principal.user.windows_sid" => "%{sid}"
      }
    }
  }

  if [msg] != "" and [not_json] {
    grok {
      match => {
        "msg" => "%{IP:ipaddr}:%{INT:prin_port}"
      }
      overwrite => ["ipaddr","prin_port"]
      on_error => "grok_msg_failure"
    }

    if [msg] != "" {
      mutate {
        replace => {
          "metadata.description" => "%{msg}"
        }
      }
    }

    if [application] != "" {
      mutate {
        replace => {
          "target.application" => "%{application}"
        }
      }
    }

  }

  if [prin_port] != "" {
    mutate {
      replace => {
        "principal.port" => "%{prin_port}"
      }
      convert => {
        "principal.port" => "integer"
      }
    }
  }

  if [ipaddr] != "" {
    grok {
      match => {
        "ipaddr" => "%{IP:ipaddr}"
      }
      overwrite => ["ipaddr"]
      on_error => "grok_ipaddr_failure"
    }
    if ![grok_ipaddr_failure] {
      mutate {
        merge => {
          "principal.ip" => "ipaddr"
          "principal.asset.ip" => "ipaddr"
        }
        on_error => "field_not_found"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [host] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{host}"
        "principal.asset.hostname" => "%{host}"
        "has_principal" => "true"
      }
      on_error => "field_not_found"
    }
  }

  if [proc_id] != "" {
    mutate {
      replace => {
        "principal.process.pid" => "%{proc_id}"
      }
    }
  }

  if [path] != "" {
    mutate {
      replace => {
        "target.file.full_path" => "%{path}"
      }
    }
  }

  if [newpath] != "" {
    mutate {
      replace => {
        "additional_label.key" => "newpath"
        "additional_label.value.string_value" => "%{newpath}"
      }
      on_error => "field_not_found"
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "additional_label"
      }
      on_error => "field_not_found"
    }
  }

  if [pid] != "" {
    mutate{
      convert => {
        "pid" => "string"
      }
    }
    mutate {
      replace => {
        "target.process.pid" => "%{pid}"
      }
    }
  }

  if [groupname] != "" {
    mutate {
      replace => {
        "target.group.group_display_name" => "%{groupname}"
      }
    }
  }

  if [gid] != "" {
    mutate{
      convert => {
        "gid" => "string"
      }
    }
    mutate {
      replace => {
        "target.group.product_object_id" => "%{gid}"
      }
    }
  }

  if [resource] != "" {
    mutate {
      replace => {
        "target.resource.resource_subtype" => "%{resource}"
      }
    }
  }

  if [tid] != "" {
    mutate{
      convert => {
        "tid" => "string"
      }
    }
    mutate {
      replace => {
        "target.resource.product_object_id" => "%{tid}"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{event_type}"
      }
    }
  }

  if [proto] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{proto}"
      }
    }
  }

  if [sequence] != "" {
    mutate{
      convert => {
        "sequence" => "string"
      }
    }
    mutate {
      replace => {
        "sequence_label.key" => "sequence"
        "sequence_label.value.string_value" => "%{sequence}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "sequence_label"
      }
    }
  }

  if [volume] != "" {
    mutate {
      replace => {
        "volume_label.key" => "volume"
        "volume_label.value.string_value" => "%{volume}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "volume_label"
      }
    }
  }

  if [offset] != "" {
    mutate{
      convert => {
        "offset" => "string"
      }
    }
    mutate {
      replace => {
        "offset_label.key" => "offset"
        "offset_label.value.string_value" => "%{offset}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "offset_label"
      }
    }
  }

  if [uid] != "" {
    mutate{
      convert => {
        "uid" => "string"
      }
    }
    mutate {
      replace => {
        "uid_label.key" => "uid"
        "uid_label.value.string_value" => "%{uid}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "uid_label"
      }
    }
  }

  if [is_dir] != "" {
    mutate {
      convert => {
        "is_dir" => "string"
      }
    }
    mutate {
      replace => {
        "is_dir_label.key" => "is_dir"
        "is_dir_label.value.string_value" => "%{is_dir}"
      }
      merge => {
        "event.idm.read_only_udm.additional.fields" => "is_dir_label"
      }
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "Nasuni"
      "metadata.product_name" => "Nasuni File Services Platform"
    }
  }

  if [product_log_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{product_log_id}"
      }
    }
  }

  if [has_principal] == "true" {
    if [event_type] in ["AUDIT_READDIR", "AUDIT_READ","Read"] {
      mutate {
        replace => {
          "metadata.event_type" => "FILE_READ"
        }
      }
    }
    else if [event_type] in ["AUDIT_WRITE","Write"] {
      mutate {
        replace => {
          "metadata.event_type" => "FILE_MODIFICATION"
        }
      }
    }
    else if [ipaddr] != "" and [path] != "" {
      mutate {
        replace => {
          "metadata.event_type" => "FILE_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "metadata.event_type" => "STATUS_UPDATE"
        }
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "metadata" => "event.idm.read_only_udm.metadata"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "field_not_found"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
