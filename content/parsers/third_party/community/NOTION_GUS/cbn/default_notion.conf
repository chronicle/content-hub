            "event1.idm.read_only_udm.target.resource.attribute.labels" => "audience_label"
          }
          on_error => "no_edited_audience_merge"
        }
      }
    }
  }

  if [event][type] == "page.permissions.shared_to_public_role_updated" and [has_user_id] == "true" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
      }
    }
  }
  else if [event][type] == "page.created" and [has_user_id] == "true" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_CREATION"
      }
    }
  }
  else if [event][type] in ["page.content_edited", "page.properties_edited"] and [has_user_id] == "true" and [has_target_resource] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
      }
    }
  }
  else if [has_user_id] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
     mutate {
      replace => {
        "event1.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    merge => {
      "@output" => "event1"
    }
  }
}
