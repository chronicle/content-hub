# Product: THALES_DIS
# Category: Digital Identity & Security
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2022-03-17
# Copyright 2022 Chronicle LLC


filter {
  mutate {
    replace => {
      "hostname" => ""
      "meta_description" => ""
      "severity" => ""
      "src_ip" => ""
      "message_id" => ""
      "product_event_type" => ""
      "summary" => ""
      "description" => ""
      "action" => ""
      "action_detail" => ""
      "sec_result" => ""
      "dst_ip" => ""
      "application_protocol" => ""
      "application" => ""
      "time" => ""
    }
  }

  grok {
    match => {
      "message" => ["<%{INT}>%{SYSLOGTIMESTAMP:time} %{HOSTNAME:hostname} %{DATA:meta_description}: \\[%{DATA}\\] %{WORD:severity} %{IP:src_ip} \\[-\\] %{DATA} %{NUMBER:message_id} %{WORD:product_event_type} %{DATA} \\[(%{DATA} %{WORD:summary} %{DATA:description})?(%{DATA})?\\] - \\[%{DATA:action_detail}\\] \\[-\\]",
                    "<%{INT}>%{SYSLOGTIMESTAMP:time} %{HOSTNAME:hostname} %{DATA:meta_description}: %{DATA} %{HOSTNAME} %{WORD:application}(?: %{DATA}: %{DATA:summary}\\. %{GREEDYDATA:description}|: %{DATA:summary}: %{DATA:description} %{IP:dst_ip})",
                    "<%{INT}>%{SYSLOGTIMESTAMP:time} %{HOSTNAME:hostname} %{DATA:meta_description}: %{DATA} (?:\\[%{USERNAME:username}\\] \\[%{DATA}\\] \\[%{DATA:summary}\\]|%{HOSTNAME} %{DATA:summary}): %{GREEDYDATA:description}"]
    }
    overwrite => ["hostname","meta_description","severity","src_ip","message_id","product_event_type","summary","description","action_detail","dst_ip","application_protocol","application","time"]
  }

  if [time] != "" {
    date {
      match => ["time", "MMM d HH:mm:ss", "MMM  d HH:mm:ss"]
      rebase => true
      on_error => "date_not_present"
    }
  }

  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
      }
    }
  }

  if [meta_description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{meta_description}"
      }
    }
  }

  if [severity] == "INFO" {
    mutate {
      replace => {
        "sec_result.severity" => "INFORMATIONAL"
      }
    }
  }

  if [application] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.application" => "%{application}"
      }
    }
  }

  if [src_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "src_ip"
      }
    }
  }

  if [dst_ip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "dst_ip"
      }
    }
  }

  if [message_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{message_id}"
      }
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
      }
    }
  }

  if [application_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "%{application_protocol}"
      }
    }
  }

  if [summary] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{summary}"
      }
    }
  }

  if [description] != "" {
    mutate {
      replace => {
        "sec_result.description" => "%{description}"
      }
    }
  }

  if [action_detail] != "" {
    mutate {
      replace => {
        "sec_result.action_details" => "%{action_detail}"
      }
    }
    if [action_detail] == "Success" {
      mutate {
        replace => {
          "action" => "ALLOW"
        }
      }
    } else {
      mutate {
        replace => {
          "action" => "BLOCK"
        }
      }
    }

    mutate {
      merge => {
        "sec_result.action" => "action"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      "event.idm.read_only_udm.metadata.product_name" => "THALES_DIS"
      "event.idm.read_only_udm.metadata.vendor_name" => "THALES"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
