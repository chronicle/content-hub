# Product: Tanium Comply
# Category: Tanium Specific
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2023-10-13
# Copyright 2021 Chronicle LLC


filter {

  mutate {
    replace => {
      "ipAddress" => ""
      "ip1" => ""
      "ip2" => ""
      "ip3" => ""
      "ip4" => ""
      "ip5" => ""
      "ip6" => ""
      "ip7" => ""
      "ip8" => ""
      "computerName" => ""
      "_vulnerability" => ""
      "cve" => ""
      "first_found_date" => ""
      "last_found_date" => ""
      "time" => ""
      "title" => ""
      "cvss_score" => ""
      "cvss_vector" => ""
      "cvss_severity" => ""
    }
  }

  mutate {
    gsub => ["message","(IP Address|IP-Address)","ipAddress"]
  }
  mutate {
    gsub => ["message","(Computer Name|Computer-Name)","computerName"]
  }
  mutate {
    gsub => ["message","(CVE)","cve"]
  }
  mutate {
    gsub => ["message","(Title)","title"]
  }
  mutate {
    gsub => ["message","(CVSS v3 Score)","cvss_score"]
  }
  mutate {
    gsub => ["message","(CVSS v3 Vector)","cvss_vector"]
  }
  mutate {
    gsub => ["message","(CVSS v3 Severity)","cvss_severity"]
  }
  mutate {
    gsub => ["message","(First Found Date)","first_found_date"]
  }
  mutate {
    gsub => ["message","(Last Found Date)","last_found_date"]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_valid_json"
  }

  if [not_valid_json] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

    if [ipAddress] != "" {
      grok {
        match => {
          "ipAddress" => "(%{IP:ip1},?)?(%{IP:ip2},?)?(%{IP:ip3},?)?(%{IP:ipv4},?)?(%{IP:ipv5},?)?(%{IP:ipv6},?)?(%{IP:ipv7},?)?(%{IP:ipv8},?)?"
        } overwrite => ["ip1", "ip2", "ip3", "ip4", "ip5", "ip6", "ip7", "ip8"]
        on_error => "_ipAddress_not_string"
      }
      if [ip1] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip1"
          }
        }
      }
      if [ip2] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip2"
          }
        }
      }
      if [ip3] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip3"
          }
        }
      }
      if [ip4] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip4"
          }
        }
      }
      if [ip5] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip5"
          }
        }
      }
      if [ip6] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip6"
          }
        }
      }
      if [ip7] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip7"
          }
        }
      }
      if [ip8] != "" {
        mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip8"
          }
        }
      }
    }

    if [_ipAddress_not_string] {
     for ip in ipAddress {
       mutate {
          merge => {
            "_asset_entity.asset.ip" => "ip"
          }
        }
     }
    }

    if [computerName] != "" {
      mutate {
        replace => {
          "_asset_entity.asset.hostname" => "%{computerName}"
        }
      }
    }

    if [cve] != "" {
      mutate {
        replace => {
          "_vulnerability.cve_id" => "%{cve}"
        }
      }
    }

    if [cvss_vector] != "" {
      mutate {
        replace => {
          "_vulnerability.cvss_vector" => "%{cvss_vector}"
        }
      }
    }

    if [cvss_score] != "" {
      mutate {
        rename => {
          "cvss_score" => "_vulnerability.cvss_base_score"
        }
      }
    }

    if [cvss_severity] != "" {
      mutate {
        replace => {
          "_vulnerability.severity_details" => "%{cvss_severity}"
        }
      }
    }

    if [first_found_date] != "" {
      if [first_found_date] =~ "-" {
        mutate {
          replace => {
            "first_found_date" => "%{first_found_date}T00:00:00Z"
          }
        }
      }
      else {
        grok {
          match => {
            "first_found_date" => ["(?P<first_found_date>\\d+)T.*"]
          }
          overwrite => ["first_found_date"]
          on_error => "grok_fail_dateTime_first"
        }
      }

      date {
        match => ["first_found_date", "RFC3339","yyyyMMdd"]
        target => "vul_first_found"
        on_error => "no_first_found"
      }

      if ![no_first_found] {
        mutate {
          rename => {
            "vul_first_found" => "_vulnerability.first_found"
          }
        }
      }
    }


    if [last_found_date] != "" {
      if [last_found_date] =~ "-" {
        mutate {
          replace => {
            "last_found_date" => "%{last_found_date}T00:00:00Z"
          }
        }
      }
      else {
        grok {
          match => {
            "last_found_date" => ["(?P<last_found_date>\\d+)T.*"]
          }
          overwrite => ["last_found_date"]
          on_error => "grok_fail_dateTime_last"
        }
      }
      date {
        match => ["last_found_date", "RFC3339","yyyyMMdd"]
        target => "vul_last_found"
        on_error => "no_last_found"
      }

      if ![no_last_found] {
        mutate {
          rename => {
            "vul_last_found" => "_vulnerability.last_found"
          }
        }
      }
    }

    if [title] != "" {
      mutate {
        replace => {
          "_vulnerability.name" => "%{title}"
        }
      }
    }

    if [_vulnerability] != "" {
       mutate {
          replace => {
            "_metadata.entity_type" => "ASSET"
            "_metadata.product_name" => "Comply"
            "_metadata.vendor_name" => "Tanium"
            "_metadata.product_entity_id" => "Tanium: %{computerName}"
          }
       }

      mutate {
        merge => {
          "_asset_entity.asset.vulnerabilities" => "_vulnerability"
        }
      }
    }

    if [time] != "" {
      date {
        match => ["time", "ISO8601", "RFC3339", "yyyy-MM-ddTHH:mm:ss.Z"]
        target => "_metadata.interval.start_time"
      }
    }


    if [_metadata] != "" {
      mutate {
        rename => {
          "_metadata" => "event.idm.entity.metadata"
        }
      }
    }

    if [_asset_entity] != "" {
      mutate {
        rename => {
          "_asset_entity" => "event.idm.entity.entity"
        }
      }
    }

  mutate {
    merge => { "@output" => "event" }
  }

}

