# Product:  ALCATEL SWITCH
# Category: Privileged Account Activity
# Supported Format: SYSLOG
# Reference: N/A
# Last Updated: 2024-03-11
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      # fields
      "ts" => ""
      "server_name" => ""
      "principal_ip" => ""
      "principal_app" => ""
      "data" => ""
      "sec_summary" => ""
      "id_protocol" => ""
      "prod_severity" => ""
      "esm_set_rate_limit" => ""
      "kv_data" => ""
      "zslot" => ""
      "limit" => ""
      "trafficType" => ""
      "limitType" => ""
      "mac_add" => ""
      "vlan" => ""
      "trap" => ""
      "kv_data_2" => ""
      "vid" => ""
      "ifIdx" => ""
      "gPort" => ""
      "count" => ""
      "srcOUI" => ""
      "destOUI" => ""
      "mac" => ""
      "principal_port" => ""
      "target_port" => ""
      "user_id" => ""
      "principal_ip_2" => ""
      "cmd" => ""
      "result" => ""
      "target_ip" => ""
      "severity" => ""
      # event type specific
      "event_type" => ""
      "principal_machine_id_present" => "false"
      "target_machine_id_present" => "false"
      "principal_user_present" => "false"
      "target_user_present" => "false"
      "minimal_required_mapping_present" => "false"
      # udm noun
      "additional" => ""
      "metadata" => ""
      "network" => ""
      "principal" => ""
      "security_result" => ""
      "target" => ""
    }
  }

  # extract JSON from syslog message
  grok {
    match => {
       "message" => [
          "%{TIMESTAMP_ISO8601:ts} %{DATA:server_name} %{IPORHOST:principal_ip} %{DATA:principal_app}\\(%{INT}\\) Data: %{GREEDYDATA:data}",
          "<%{INT}>%{SYSLOGTIMESTAMP:ts}%{SPACE}%{IP:principal_ip}%{SPACE}%{DATA}%{SYSLOGTIMESTAMP}%{SPACE}%{DATA:server_name}%{SPACE}%{DATA:principal_app}swlogd:%{SPACE}%{GREEDYDATA:data}",
          "<%{INT}>%{SYSLOGTIMESTAMP:ts}%{SPACE}%{IP:principal_ip}%{SPACE}%{DATA}%{SYSLOGTIMESTAMP}%{SPACE}%{DATA:principal_app} %{DATA:id_protocol} Data: %{GREEDYDATA:data}",
          "<%{INT}>%{SYSLOGTIMESTAMP:ts}%{SPACE}%{IP:principal_ip}%{DATA}%{SYSLOGTIMESTAMP}%{SPACE}sshd%{DATA}:%{GREEDYDATA:data}"
          "<%{INT}>%{SYSLOGTIMESTAMP:ts}\\s+%{IPORHOST:principal_ip} %{DATA} %{SYSLOGTIMESTAMP}\\s+: %{DATA:server_name}\\s+%{DATA:principal_app}\\s+%{DATA:severity} %{GREEDYDATA:data}"
          "<%{INT}>%{SYSLOGTIMESTAMP:ts}\\s+%{IPORHOST:principal_ip}\\s+%{DATA}\\s+%{DATA:server_name}\\s+%{DATA:principal_app}\\s+%{DATA:severity}: %{GREEDYDATA:data}"
          "<%{INT}>%{SYSLOGTIMESTAMP:ts}\\s+%{IPORHOST:principal_ip}\\s+%{DATA:id_protocol}(\\[|\\()%{INT}(\\]|\\)) %{GREEDYDATA:data}"
          "<%{INT}>%{SYSLOGTIMESTAMP:ts}\\s+%{IPORHOST:principal_ip}\\s+%{GREEDYDATA:data}"
        ]
    }
    overwrite => ["ts", "server_name", "principal_ip", "principal_app", "data", "id_protocol","severity"]
    on_error  => "header_grok_match_failed"
  }

  if [header_grok_match_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [ts] != "" {
    date {
      match => ["ts", "ISO8601"]
      on_error => "date_match_failed"
    }
  }

  if  [severity] != "" {
    if [severity] =~ "(?i)INFO" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [severity] =~ "(?i)ERROR" {
      mutate {
        replace => {
          "security_result.severity" => "ERROR"
        }
      }
    }
    else {
      mutate {
        replace => {
          "severity_label.key" => "severity"
          "severity_label.value" => "%{severity}"
        }
        on_error => "severity_label_error"
      }
      if ![severity_label_error] {
        mutate {
          merge => {
            "security_result.detection_fields" => "severity_label"
          }
          on_error => "severity_label_merge_error"
        }
      }
    }
  }

  if [server_name] != "" {
    mutate {
      replace => {
        "target.hostname" => "%{server_name}"
        "target.asset.hostname" => "%{server_name}"
      }
      on_error => "server_name_value_invalid"
    }
    if ![server_name_value_invalid] {
      mutate {
        replace => {
          "target_machine_id_present" => "true"
        }
      }
    }
  }

  if [principal_ip] != "" {
    grok {
      match => {
        "principal_ip" => "%{IP:valid_ip}"
      }
      on_error => "principal_ip_not_ip"
    }
    if ![principal_ip_not_ip] {
      mutate {
        merge => {
          "principal.ip" => "principal_ip"
          "principal.asset.ip" => "principal_ip"
        }
        on_error => "principal_ip_merge_failed"
      }
    }
    else {
      mutate {
        replace => {
          "principal.hostname" => "%{principal_ip}"
          "principal.asset.hostname" => "%{principal_ip}"
        }
        on_error => "principal_ip_value_invalid"
      }
    }
    mutate {
      replace => {
        "principal_machine_id_present" => "true"
      }
    }
  }

  if [principal_app] != "" {
    mutate {
      replace => {
        "principal.application" => "%{principal_app}"
      }
      on_error => "principal_app_value_invalid"
    }
  }
  if [id_protocol] != "" {
    if [id_protocol] =~ "(?i)ssh" {
      mutate {
        replace => {
          "network.application_protocol" => "SSH"
        }
      }
    }
    mutate {
      replace => {
        "id_protocol_label.key" => "id_protocol"
        "id_protocol_label.value.string_value" => "%{id_protocol}"
      }
      on_error => "id_protocol_value_invalid"
    }
    if ![id_protocol_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "id_protocol_label"
        }
        on_error => "id_protocol_label_merge_failed"
      }
    }
  }

  if [data] != "" {
    grok {
      match => {
        "data" => [
          "%{DATA} %{DATA} %{DATA:prod_severity} esmSetRateLimit: %{DATA:esm_set_rate_limit} %{GREEDYDATA:kv_data} to %{DATA}=%{DATA:zslot},",
          "== SM == %{GREEDYDATA:sec_summary}",
          "VLAN %{DATA:vlan} MAC %{GREEDYDATA:mac_add}|MAC %{GREEDYDATA:mac_add}",
          "TRAP:%{DATA:trap} %{GREEDYDATA:kv_data_2}",
          "%{GREEDYDATA:sec_summary}user: %{DATA:user_id} \\(%{IP:principal_ip_2}\\), cmd: %{DATA:cmd}, result: %{GREEDYDATA:result}"
          "%{GREEDYDATA:sec_summary}"
        ]
      }
      overwrite => ["sec_summary", "prod_severity", "esm_set_rate_limit", "kv_data", "zslot", "vlan", "mac_add", "trap", "kv_data_2", "user_id", "principal_ip_2", "cmd", "result"]
      on_error => "data_grok_match_failed"
    }
  }

  if [sec_summary] != "" {
    grok {
      match => {
        "sec_summary" => [
          "%{GREEDYDATA}MacAddr: %{MAC:mac} from port %{INT:principal_port} to port %{INT:target_port}",
          "%{GREEDYDATA}for %{DATA:user_id} from %{IP:target_ip} port %{INT:target_port} %{GREEDYDATA}",
          "%{DATA} from %{IP:target_ip} port %{INT:target_port}"
          "%{GREEDYDATA}from %{IP:target_ip}%{GREEDYDATA}"
          "%{DATA} Address\\s+%{IP:target_ip} %{GREEDYDATA}"
          "%{DATA} by %{IP:principal_ip_2} port %{INT:principal_port}%{GREEDYDATA}"
        ]
      }
      overwrite => ["mac", "principal_port", "target_port", "user_id", "target_ip","principal_ip_2"]
      on_error => "sec_summary_grok_match_failed"
    }

    mutate {
      replace => {
        "security_result.summary" => "%{sec_summary}"
      }
      on_error => "sec_summary_value_invalid"
    }
  }

  if [prod_severity] =~ "info" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
      on_error => "prod_severity_value_invalid"
    }
  }

  if [esm_set_rate_limit] != "" {
    mutate {
      replace => {
        "esm_set_rate_limit_label.key" => "esm_set_rate_limit"
        "esm_set_rate_limit_label.value.string_value" => "%{esm_set_rate_limit}"
      }
      on_error => "esm_set_rate_limit_value_invalid"
    }
    if ![esm_set_rate_limit_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "esm_set_rate_limit_label"
        }
        on_error => "esm_set_rate_limit_label_merge_failed"
      }
    }
  }

  if [vlan] != "" {
    mutate {
      replace => {
        "vlan_label.key" => "vlan"
        "vlan_label.value.string_value" => "%{vlan}"
      }
      on_error => "vlan_value_invalid"
    }
    if ![vlan_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "vlan_label"
        }
        on_error => "vlan_label_merge_failed"
      }
    }
  }

  if [mac_add] != "" {
    grok {
      match => {
        "mac_add" => "%{MAC:valid_mac}"
      }
      on_error => "mac_pattern_invalid"
    }
    if ![mac_pattern_invalid] {
      mutate {
        merge => {
          "principal.mac" => "mac_add"
        }
        on_error => "mac_add_value_invalid"
      }
      if ![mac_add_value_invalid] {
        mutate {
          replace => {
            "principal_machine_id_present" => "true"
          }
        }
      }
    }
  }

  if [trap] != "" {
    mutate {
      replace => {
        "trap_label.key" => "trap"
        "trap_label.value.string_value" => "%{trap}"
      }
      on_error => "trap_value_invalid"
    }
    if ![trap_value_invalid] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "trap_label"
        }
        on_error => "trap_label_merge_failed"
      }
    }
  }

  if [kv_data] != "" {
    kv {
      source => "kv_data"
      field_split => ", "
      value_split => "="
      on_error => "kv_data_invalid"
    }
  }

  if [kv_data_2] != "" {
    kv {
      source => "kv_data_2"
      field_split => " "
      value_split => "="
      on_error => "kv_data_2_invalid"
    }
  }

  if [limit] != "" {
    mutate {
      replace => {
        "limit_label.key" => "limit"
        "limit_label.value" => "%{limit}"
      }
      on_error => "limit_value_invalid"
    }
    if ![limit_value_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "limit_label"
        }
        on_error => "limit_label_merge_failed"
      }
    }
  }

  if [trafficType] != "" {
    mutate {
      replace => {
        "trafficType_label.key" => "trafficType"
        "trafficType_label.value" => "%{trafficType}"
      }
      on_error => "trafficType_value_invalid"
    }
    if ![trafficType_value_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "trafficType_label"
        }
        on_error => "trafficType_label_merge_failed"
      }
    }
  }

  if [limitType] != "" {
    mutate {
      replace => {
        "limitType_label.key" => "limitType"
        "limitType_label.value" => "%{limitType}"
      }
      on_error => "limitType_value_invalid"
    }
    if ![limitType_value_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "limitType_label"
        }
        on_error => "limitType_label_merge_failed"
      }
    }
  }

  if [zslot] != "" {
    mutate {
      replace => {
        "zslot_label.key" => "zslot"
        "zslot_label.value" => "%{zslot}"
      }
      on_error => "zslot_value_invalid"
    }
    if ![zslot_value_invalid] {
      mutate {
        merge => {
          "principal.resource.attribute.labels" => "zslot_label"
        }
        on_error => "zslot_label_merge_failed"
      }
    }
  }

  if [vid] != "" {
    mutate {
      replace => {
        "vid_label.key" => "vid"
        "vid_label.value" => "%{vid}"
      }
      on_error => "vid_value_invalid"
    }
    if ![vid_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "vid_label"
        }
        on_error => "vid_label_merge_failed"
      }
    }
  }

  if [ifIdx] != "" {
    mutate {
      replace => {
        "ifIdx_label.key" => "ifIdx"
        "ifIdx_label.value" => "%{ifIdx}"
      }
      on_error => "ifIdx_value_invalid"
    }
    if ![ifIdx_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "ifIdx_label"
        }
        on_error => "ifIdx_label_merge_failed"
      }
    }
  }

  if [gPort] != "" {
    mutate {
      replace => {
        "gPort_label.key" => "gPort"
        "gPort_label.value" => "%{gPort}"
      }
      on_error => "gPort_value_invalid"
    }
    if ![gPort_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "gPort_label"
        }
        on_error => "gPort_label_merge_failed"
      }
    }
  }

  if [count] != "" {
    mutate {
      replace => {
        "count_label.key" => "count"
        "count_label.value" => "%{count}"
      }
      on_error => "count_value_invalid"
    }
    if ![count_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "count_label"
        }
        on_error => "count_label_merge_failed"
      }
    }
  }

  if [srcOUI] != "" {
    mutate {
      replace => {
        "srcOUI_label.key" => "srcOUI"
        "srcOUI_label.value" => "%{srcOUI}"
      }
      on_error => "srcOUI_value_invalid"
    }
    if ![srcOUI_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "srcOUI_label"
        }
        on_error => "srcOUI_label_merge_failed"
      }
    }
  }

  if [destOUI] != "" {
    mutate {
      replace => {
        "destOUI_label.key" => "destOUI"
        "destOUI_label.value" => "%{destOUI}"
      }
      on_error => "destOUI_value_invalid"
    }
    if ![destOUI_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "destOUI_label"
        }
        on_error => "destOUI_label_merge_failed"
      }
    }
  }

  if [user_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{user_id}"
        "principal_user_present" => "true"
      }
      on_error => "user_id_value_invalid"
    }
  }

  if [principal_ip_2] != "" {
    mutate {
      merge => {
        "principal.ip" => "principal_ip_2"
        "principal.asset.ip" => "principal_ip_2"
      }
      on_error => "principal_ip_2_merge_failed"
    }
    if ![principal_ip_2_merge_failed] {
      mutate {
        replace => {
          "principal_machine_id_present" => "true"
        }
      }
    }
  }

  if [cmd] != "" {
    mutate {
      replace => {
        "cmd_label.key" => "cmd"
        "cmd_label.value" => "%{cmd}"
      }
      on_error => "cmd_value_invalid"
    }
    if ![cmd_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "cmd_label"
        }
        on_error => "cmd_label_merge_failed"
      }
    }
  }

  if [result] != "" {
    mutate {
      replace => {
        "result_label.key" => "result"
        "result_label.value" => "%{result}"
      }
      on_error => "result_value_invalid"
    }
    if ![result_value_invalid] {
      mutate {
        merge => {
          "security_result.detection_fields" => "result_label"
        }
        on_error => "result_label_merge_failed"
      }
    }
  }

  if [mac] != ""{
    mutate {
      merge => {
        "principal.mac" => "mac"
      }
      on_error => "mac_value_invalid"
    }
    if ![mac_value_invalid] {
      mutate {
        replace => {
          "principal_machine_id_present" => "true"
        }
      }
    }
  }
  if [principal_port] != "" {
    mutate {
      convert => {
        "principal_port" => "integer"
      }
      on_error => "principal_port_already_integer"
    }
    mutate {
      rename => {
        "principal_port" => "principal.port"
      }
      on_error => "principal_port_rename_failed"
    }
  }
  if [target_port] != "" {
    mutate {
      convert => {
        "target_port" => "integer"
      }
      on_error => "target_port_already_integer"
    }
    mutate {
      rename => {
        "target_port" => "target.port"
      }
      on_error => "target_port_rename_failed"
    }
  }

  if [target_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "target_ip"
        "target.asset.ip" => "target_ip"
      }
      on_error => "target_ip_merge_failed"
    }
    if ![target_ip_merge_failed] {
      mutate {
        replace => {
          "target_machine_id_present" => "true"
        }
      }
    }
  }

  # metadata info
  mutate {
    replace => {
      "metadata.vendor_name" => "ALCATEL SWITCH"
      "metadata.product_name" => "Alcatel Switch"
      "metadata.product_event_type" => ""
    }
  }

  if [event_type] == "" {
    if [principal_user_present] == "true" {
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else if [principal_machine_id_present] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }

  # merge the data into udm nouns.
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_empty"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
