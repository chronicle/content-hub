# Product: MINERVA
# Category: Minerva AV
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2023-03-28
# Copyright 2023 Chronicle LLC


filter {
  mutate {
    replace => {
      "result.user" => ""
      "result.dest" => ""
      "result.done_training" => ""
      "result.doh_status" => ""
      "result.is_automatic" => ""
      "result.is_cached_justification" => ""
      "result.is_sensitive" => ""
      "result.is_successful" => ""
      "result.action" => ""
      "result.token_id" => ""
      "result.original_token_id" => ""
      "result.linecount" => ""
      "result.request_id" => ""
      "result.user_bunit" => ""
      "result.splunk_server" => ""
      "result.justification_source" => ""
      "result.ssl_client_issuer_dn" => ""
      "result.ssl_client_subject_dn" => ""
      "result.ssl_client_serial_number" => ""
      "result.extracted_index" => ""
      "result.extracted_source" => ""
      "result.extracted_sourcetype" => ""
      "result.index" => ""
      "result.event_name" => ""
      "result.shop_plan" => ""
      "result.browser_os" => ""
      "result.shop_id" => ""
      "result.reason" => ""
      "result.failed_requirements" => ""
      "user_name" => ""
      "result.user_identity_id" => ""
      "result.user_first" => ""
      "result.user_last" => ""
      "result.user_phone" => ""
      "result.user_work_city" => ""
      "result.user_work_country" => ""
      "result.user_identity_tag" => ""
      "result.user_startDate" => ""
      "result.eventtype" => ""
      "event_type" => "GENERIC_EVENT"
      "device_vendor" => "MINERVA"
      "device_product" => "MINERVA"
      "has_principal_user" => "false"
      "has_principal" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [result][user] =~ "(^.*@.*$)" {
    grok {
      match => {
        "result.user" => [
          "%{DATA:user_name}@.*"
        ]
      }
      overwrite => ["user_name"]
    }
    mutate {
      merge => {
        "principal.user.email_addresses" => "result.user"
      }
    }

    if [user_name] != "" {
      mutate {
        replace => {
          "principal.user.user_display_name" => "%{user_name}"
          "has_principal_user" => "true"
        }
      }
    }
  } else if [result][user] =~ ".* .*" {
    mutate {
      replace => {
        "principal.user.user_display_name" => "%{result.user}"
        "has_principal_user" => "true"
      }
    }
  } else if [result][user] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{result.user}"
        "has_principal_user" => "true"
      }
    }
  }

  if [result][user] == "" and [result][user_identity] =~ "(^.*@.*$)" {
    mutate {
      replace => {
        "principal.user.email_addresses" => "%{result.user_identity}"
      }
    }
  }

  if [result][splunk_server] != "" {
    mutate {
      replace => {
        "principal.hostname" => "%{result.splunk_server}"
        "has_principal" => "true"
      }
    }
  }

  if [result][token_id] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{result.token_id}"
      }
    }
  } else if [result][original_token_id] != "" {
    mutate {
      replace => {
        "principal.resource.product_object_id" => "%{result.original_token_id}"
      }
    }
  }

  if [result][user_identity_id] != "" {
    mutate {
      replace => {
        "principal.user.userid" => "%{result.user_identity_id}"
      }
    }
  }

  if [result][user_first] != "" {
    mutate {
      replace => {
        "principal.user.first_name" => "%{result.user_first}"
      }
    }
  }

  if [result][user_last] != "" {
    mutate {
      replace => {
        "principal.user.last_name" => "%{result.user_last}"
      }
    }
  }

  if [result][user_phone] != "" {
    mutate {
      merge => {
        "principal.user.phone_numbers" => "result.user_phone"
      }
    }
  }

  if [result][user_work_city] != "" {
    mutate {
      replace => {
        "principal.user.office_address.city" => "%{result.user_work_city}"
      }
    }
  }

  if [result][user_work_country] != "" {
    mutate {
      replace => {
        "principal.user.office_address.country_or_region" => "%{result.user_work_country}"
      }
    }
  }

  if [result][user_identity_tag] != "" {
    mutate {
      replace => {
        "principal.user.title" => "%{result.user_identity_tag}"
      }
    }
  }

  if [result][user_bunit] != "" {
    mutate {
      replace => {
        "user_bunit_labels.key" => "result user_bunit"
        "user_bunit_labels.value" => "%{result.user_bunit}"
      }
    }
    mutate {
      merge => {
        "principal.resource.attribute.labels" => "user_bunit_labels"
      }
    }
  }

  if [result][shop_id] != "" {
    mutate {
      replace => {
        "shop_id_labels.key" => "result shop_id"
        "shop_id_labels.value" => "%{result.shop_id}"
      }
    }
    mutate {
      merge => {
        "target.resource.attribute.labels" => "shop_id_labels"
      }
    }
  }

  if [result][eventtype] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{result.eventtype}"
      }
    }
  }

  if [device_vendor] != "" {
    mutate {
      replace => {
        "metadata.vendor_name" => "%{device_vendor}"
      }
    }
  }

  if [device_product] != "" {
    mutate {
      replace => {
        "metadata.product_name" => "%{device_product}"
      }
    }
  }

  if [has_principal_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
    }
  }

  if [result][dest] != "" {
    mutate {
      replace => {
        "target.url" => "%{result.dest}"
      }
    }
  }

  if [result][doh_status] != "" {
    mutate {
      replace => {
        "doh_status_field.key" => "result doh_status"
        "doh_status_field.value.string_value" => "%{result.doh_status}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "doh_status_field"
      }
    }
  }

  if [result][done_training] != "" {
    mutate {
      replace => {
        "done_training_field.key" => "result done_training"
        "done_training_field.value.string_value" => "%{result.done_training}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "done_training_field"
      }
    }
  }

  if [result][is_automatic] != "" {
    mutate {
      replace => {
        "is_automatic_field.key" => "result is_automatic"
        "is_automatic_field.value.string_value" => "%{result.is_automatic}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "is_automatic_field"
      }
    }
  }

  if [result][is_cached_justification] != "" {
    mutate {
      replace => {
        "is_cached_justification_field.key" => "result is_cached_justification"
        "is_cached_justification_field.value.string_value" => "%{result.is_cached_justification}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "is_cached_justification_field"
      }
    }
  }

  if [result][is_sensitive] != "" {
    mutate {
      replace => {
        "is_sensitive_field.key" => "result is_sensitive"
        "is_sensitive_field.value.string_value" => "%{result.is_sensitive}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "is_sensitive_field"
      }
    }
  }

  if [result][is_successful] != "" {
    mutate {
      replace => {
        "is_successful_field.key" => "result is_successful"
        "is_successful_field.value.string_value" => "%{result.is_successful}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "is_successful_field"
      }
    }
  }

  if [result][linecount] != "" {
    mutate {
      replace => {
        "linecount_field.key" => "linecount"
        "linecount_field.value.string_value" => "%{result.linecount}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "linecount_field"
      }
    }
  }

  if [result][extracted_source] != "" {
    mutate {
      replace => {
        "extracted_source_field.key" => "extracted_source"
        "extracted_source_field.value.string_value" => "%{result.extracted_source}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "extracted_source_field"
      }
    }
  }
  if [result][extracted_sourcetype] != "" {
    mutate {
      replace => {
        "extracted_sourcetype_field.key" => "extracted_sourcetype"
        "extracted_sourcetype_field.value.string_value" => "%{result.extracted_sourcetype}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "extracted_sourcetype_field"
      }
    }
  }

  if [result][extracted_index] != "" {
    mutate {
      replace => {
        "extracted_index_field.key" => "extracted_index"
        "extracted_index_field.value.string_value" => "%{result.extracted_index}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "extracted_index_field"
      }
    }
  }

  if [result][justification_source] != "" {
    mutate {
      replace => {
        "justification_source_field.key" => "justification_source"
        "justification_source_field.value.string_value" => "%{result.justification_source}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "justification_source_field"
      }
    }
  }

  if [result][index] != "" {
    mutate {
      replace => {
        "index_field.key" => "index"
        "index_field.value.string_value" => "%{result.index}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "index_field"
      }
    }
  }

  if [result][failed_requirements] != "" {
    mutate {
      replace => {
        "failed_requirements_field.key" => "failed_requirements"
        "failed_requirements_field.value.string_value" => "%{result.failed_requirements}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "failed_requirements_field"
      }
    }
  }

   if [result][shop_plan] != "" {
    mutate {
      replace => {
        "shop_plan_field.key" => "shop_plan"
        "shop_plan_field.value.string_value" => "%{result.shop_plan}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.additional.fields" => "shop_plan_field"
      }
    }
  }

  if [result][action] == "success" {
    mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
  }
  else if [result][action]  == "failure" {
    mutate {
      replace => {
        "action" => "BLOCK"
      }
    }
  }

  if [result][action] != "" {
    mutate {
      replace => {
        "security_result.action_details" => "%{result.action}"
      }
    }
  }

  if [action] != "" {
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }

  if [result][event_name] != "" {
    mutate {
      uppercase => ["result.event_name"]
    }

    if [result][event_name] in ["ERROR", "CRITICAL"] {
      mutate {
        replace => {
          "security_result.severity" => "%{severity}"
        }
      }
    } else if [result][event_name] == "INFO" {
        mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    } else if [result][event_name] == "MINOR" {
        mutate {
        replace => {
          "security_result.severity" => "LOW"
        }
      }
    } else if [result][event_name] == "WARNING" {
        mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    } else if [result][event_name] == "MAJOR" {
        mutate {
        replace => {
          "security_result.severity" => "HIGH"
        }
      }
    }
  }

  if [result][browser_os] =~ "Chrome" {
    mutate {
      replace => {
        "principal.platform" => "WINDOWS"
      }
    }
  }
  else if [result][browser_os] =~ "Mac" {
    mutate {
      replace => {
        "principal.platform" => "MAC"
      }
    }
  }

  if [result][request_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{result.request_id}"
      }
    }
  }

  if [result][reason] != "" {
    mutate {
      replace => {
        "metadata.description" => "%{result.reason}"
      }
    }
  }

  if [result][ssl_client_issuer_dn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.client.certificate.issuer" => "%{result.ssl_client_issuer_dn}"
      }
    }
  }

  if [result][ssl_client_subject_dn] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.client.certificate.subject" => "%{result.ssl_client_subject_dn}"
      }
    }
  }

  if [result][ssl_client_serial_number] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.tls.client.certificate.serial" => "%{result.ssl_client_serial_number}"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  mutate {
    rename => {
      "principal" => "event.idm.read_only_udm.principal"
      "target" => "event.idm.read_only_udm.target"
      "metadata" => "event.idm.read_only_udm.metadata"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}

