      "job_id" => "addition.job_id"
      "waiting_job_count" => "addition.waiting_job_count"
      "priority" => "addition.priority"
      "retry_ms" => "addition.retry_ms"
      "fetch_result" => "addition.fetch_result"
      "update_status" => "addition.update_status"
      "log_level" => "addition.log_level"
      "pam_service" => "addition.pam_service"
      "pam_action" => "addition.pam_action"
      "repeated_msg" => "addition.repeated_msg"
      "repeat_count" => "addition.repeat_count"
      "syslog_node" => "addition.syslog_node"
      "pg_session" => "addition.pg_session"
      "sql_statement" => "addition.sql_statement"
      "pg_buffers" => "addition.pg_buffers_written"
      "pg_buffers_pct" => "addition.pg_buffers_pct"
      "pg_wal_added" => "addition.pg_wal_added"
      "pg_wal_removed" => "addition.pg_wal_removed"
      "pg_wal_recycled" => "addition.pg_wal_recycled"
      "pg_write_time" => "addition.pg_write_time"
      "pg_sync_time" => "addition.pg_sync_time"
      "pg_total_time" => "addition.pg_total_time"
      "pg_sync_files" => "addition.pg_sync_files"
      "pg_longest_sync" => "addition.pg_longest_sync"
      "pg_avg_sync" => "addition.pg_avg_sync"
      "pg_distance_kb" => "addition.pg_distance_kb"
      "pg_estimate_kb" => "addition.pg_estimate_kb"
      "report_id" => "addition.report_id"
      "reports_count" => "addition.reports_count"
      "queue_name" => "addition.queue_name"
    }
  }

  for key, value in addition map {
    if [value] not in ["", "None", "none", "null", "NULL", "()", "{}", "[]"] {
      mutate {
        replace => {
          "additional_label" => ""
        }
      }
      mutate {
        replace => {
          "additional_label.key" => "%{key}"
          "additional_label.value.string_value" => "%{value}"
        }
        on_error => "replace_additional_label_error"
      }
      if ![replace_additional_label_error] {
        mutate {
          merge => {
            "additional.fields" => "additional_label"
          }
          on_error => "merge_additional_label_error"
        }
      }
    }
  }

  if [has_principal] == "true" and
    [has_target] == "true" and
    [has_network_http] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal_user] == "true" or [has_target_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  if [product_log_id] != "" {
    mutate {
      replace => {
        "metadata.product_log_id" => "%{product_log_id}"
      }
      on_error => "replace_product_log_id_error"
    }
  }

  mutate {
    replace => {
      "metadata.vendor_name" => "OneIdentity"
      "metadata.product_name" => "Safeguard"
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "merge_udm_security_result_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
