  grok {
    match => {
      "message" => [
        "^<%{POSINT:sev}>%{SYSLOGTIMESTAMP:ts}\\s+%{HOSTNAME:syslog_host}\\s+(?P<process>[^\\[:\\s]+)(?:\\[%{POSINT:pid}\\])?:?\\s+%{GREEDYDATA:msg}$"
      ]
    }
    overwrite => ["sev", "ts", "syslog_host", "process", "pid", "msg"]
    on_error => "syslog_header_grok_failed"
  }

  if [syslog_header_grok_failed] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  if [msg] =~ "^Last message " {
    grok {
      match => {
        "msg" => [
          "^Last message '%{DATA:repeated_msg}' repeated %{INT:repeat_count} times, suppressed by syslog-ng on %{DATA:syslog_node}$"
        ]
      }
      overwrite => ["repeated_msg", "repeat_count", "syslog_node"]
      on_error => "syslog_repeat_grok_failed"
    }
  }

  else if [process] == "uwsgi" {
    grok {
      match => {
        "msg" => [
          "^\\[pid:\\s*%{INT}\\|app:\\s*%{INT:uwsgi_app}\\|req:\\s*(?P<uwsgi_req>[^\\]]+)\\]\\s+%{IP:src_ip}\\s+\\([^\\)]*\\)\\s+\\{%{INT:uwsgi_vars}\\s+vars\\s+in\\s+%{INT:recv_bytes}\\s+bytes\\}\\s+\\[(?P<uwsgi_ts>[^\\]]+)\\]\\s+%{WORD:http_method}\\s+(?P<target_url>\\S+)\\s+=>\\s+generated\\s+%{INT:sent_bytes}\\s+bytes\\s+in\\s+%{INT:duration_ms}\\s+msecs\\s+\\(HTTP/%{DATA:http_version}\\s+%{INT:http_status}\\)\\s+%{INT:headers_count}\\s+headers\\s+in\\s+%{INT:headers_bytes}\\s+bytes\\s+\\(%{INT:core_switches}\\s+switches\\s+on\\s+core\\s+%{INT:core_id}\\)$"
        ]
      }
      overwrite => ["uwsgi_app", "uwsgi_req", "src_ip", "uwsgi_vars", "recv_bytes", "uwsgi_ts", "http_method", "target_url", "sent_bytes", "duration_ms", "http_version", "http_status", "headers_count", "headers_bytes", "core_switches", "core_id"]
      on_error => "uwsgi_grok_failed"
    }
  }

  else if [process] in ["health-status", "authdaemon", "configsync"] {
    grok {
      match => {
        "msg" => [
          "^(?P<service_action>[^;]+);\\s*%{GREEDYDATA:zorp_kv}$"
        ]
      }
      overwrite => ["service_action", "zorp_kv"]
      on_error => "service_kv_grok_failed"
    }
  }

  else if [process] =~ "^zorp/" {
    grok {
      match => {
        "msg" => [
          "^(?P<zorp_module>[a-zA-Z0-9_.]+)\\(%{INT:zorp_level}\\):\\s*\\((?P<session_id>[^\\)]+)\\):\\s*%{GREEDYDATA:zorp_body}$"
        ]
      }
      overwrite => ["zorp_module", "zorp_level", "session_id", "zorp_body"]
      on_error => "zorp_prefix_grok_failed"
    }

    if [zorp_body] =~ "^Plugin[(]" {
      grok {
        match => {
          "zorp_body" => [
            "^Plugin\\((?P<plugin_path>[^\\)]+)\\):\\s*%{GREEDYDATA:plugin_msg}$"
          ]
        }
        overwrite => ["plugin_path", "plugin_msg"]
        on_error => "zorp_plugin_grok_failed"
      }

      grok {
        match => {
          "plugin_msg" => [
            "^\\[ERROR\\]\\s*Denied by password vault;\\s*code=%{INT:http_status},\\s*data=\"%{GREEDYDATA:vault_err_data}\"$",
            "^(?P<http_method>GET|POST|DELETE) request(?: to localrest)?;\\s*url=(?P<target_url>[^,\\s]+)(?:,\\s*parameters=(?P<plugin_params>.*),\\s*auth=(?P<http_auth>\\S+))?$",
            "^Validate vault connection;\\s*url=(?P<target_url>\\S+)$",
            "^Authenticating user (?P<gateway_username>\\S+) with MFA identity of (?P<mfa_user>\\S+)$",
            "^Requesting accounts in scope for asset (?P<asset_id>\\S+) by name (?P<remote_username>\\S+) and domain (?P<domain>\\S+)$",
            "^(?:Fetching|Found) (?:passwords|private_keys) for account=(?P<remote_username>\\S+) asset=(?P<server_hostname>\\S+)$",
            "^Executing check-in (?:after successful authentication|as it was postponed in authentication_completed) account=(?P<remote_username>\\S+) asset=(?P<server_hostname>\\S+)$",
            "^Response to (?P<http_method>GET|POST|DELETE);\\s*data=(?P<resp_data>.*)$",
            "^Access Request state is (?P<access_request_state>\\S+)$",
            "^Logging initialized to level=(?P<log_level>\\S+)$"
          ]
        }
        overwrite => ["http_status", "vault_err_data", "http_method", "target_url", "plugin_params", "http_auth", "gateway_username", "mfa_user", "asset_id", "remote_username", "domain", "server_hostname", "resp_data", "access_request_state", "log_level"]
        on_error => "plugin_subpattern_nomatch"
      }

      if [vault_err_data] != "" {
        mutate {
          replace => {
            "security_result.severity" => "ERROR"
          }
        }
        grok {
          match => {
            "vault_err_data" => [
              "(?:token:\\s*(?P<session_token>[^,\\s]+),\\s*)?sessionId:\\s*(?P<vault_session_id>[^,\\s]+),\\s*Reason:\\s*\\((?P<vault_err_reason>[^\\)]+)\\).*?Code[^0-9]+(?P<vault_err_code>\\d+).*?Message[^a-zA-Z0-9]+(?P<vault_err_msg>[^\\\\\"]+).*?(?P<http_method>GET|POST|DELETE)\\s+(?P<target_url>https?://\\S+)$"
            ]
          }
          overwrite => ["session_token", "vault_session_id", "vault_err_reason", "vault_err_code", "vault_err_msg", "http_method", "target_url"]
          on_error => "vault_err_inner_nomatch"
        }
      }

      if [resp_data] != "" {
        grok {
          match => {
            "resp_data" => [
              "'AccessRequestType':\\s*'(?P<access_request_type>[^']+)'.*'AccountId':\\s*(?P<account_id>\\d+).*'AccountName':\\s*'(?P<remote_username>[^']+)'.*'AccountDomainName':\\s*'(?P<domain>[^']+)'.*'AccountSystemId':\\s*(?P<account_system_id>\\d+).*'AccountSystemName':\\s*'(?P<account_system_name>[^']+)'.*'AccountRequestType':\\s*'(?P<account_request_type>[^']+)'.*'ApprovedByMe':\\s*(?P<approved_by_me>True|False).*'AssetId':\\s*(?P<asset_id>\\d+).*'AssetName':\\s*'(?P<server_hostname>[^']+)'.*'AssetNetworkAddress':\\s*'%{IP:dst_ip}'.*'CreatedOn':\\s*'(?P<created_on>[^']+)'.*'CurrentApprovalCount':\\s*(?P<current_approval_count>\\d+).*'CurrentReviewerCount':\\s*(?P<current_reviewer_count>\\d+).*'DurationInMinutes':\\s*(?P<duration_minutes>\\d+).*'ExpiresOn':\\s*'(?P<expires_on>[^']+)'.*'Id':\\s*'(?P<access_request_id>[^']+)'.*'IsEmergency':\\s*(?P<is_emergency>True|False).*'NeedsAcknowledgement':\\s*(?P<needs_acknowledgement>True|False).*'RequestAvailability':\\s*(?P<request_availability>\\[[^\\]]*\\]).*'RequestedDurationDays':\\s*(?P<requested_duration_days>\\d+).*'RequestedDurationHours':\\s*(?P<requested_duration_hours>\\d+).*'RequestedDurationMinutes':\\s*(?P<requested_duration_minutes>\\d+).*'RequestedFor':\\s*'(?P<requested_for>[^']+)'.*'RequesterDisplayName':\\s*'(?P<principal_user_display>[^']+)'.*'RequesterEmailAddress':\\s*'(?P<principal_user_email>[^']+)'.*'RequesterId':\\s*(?P<requester_id>\\d+).*'RequiredApprovalCount':\\s*(?P<required_approval_count>\\d+).*'RequiredReviewerCount':\\s*(?P<required_reviewer_count>\\d+).*'State':\\s*'(?P<access_request_state>[^']+)'.*'StateChangedOn':\\s*'(?P<state_changed_on>[^']+)'.*'WasCancelled':\\s*(?P<was_cancelled>True|False).*'WasCheckedOut':\\s*(?P<was_checked_out>True|False).*'WasDenied':\\s*(?P<was_denied>True|False).*'WasEvicted':\\s*(?P<was_evicted>True|False).*'WasExpired':\\s*(?P<was_expired>True|False).*'WasRevoked':\\s*(?P<was_revoked>True|False).*'WorkflowActions':\\s*(?P<workflow_actions>\\[.*?)(?:,\\s*'PolicyId':\\s*(?P<policy_id>\\d+),\\s*'PolicyName':\\s*'(?P<policy_name>[^']+)',\\s*'RequireReviewerComment':\\s*(?P<require_reviewer_comment>True|False),\\s*'EnableSessionRecordings':\\s*(?P<enable_session_recordings>True|False),\\s*'AllowClipboard':\\s*(?P<allow_clipboard>True|False),\\s*'AllowSraSessionLaunch':\\s*(?P<allow_sra_session_launch>True|False),\\s*'AllowSftpSessions':\\s*(?P<allow_sftp_sessions>True|False),\\s*'AllowScpSessions':\\s*(?P<allow_scp_sessions>True|False),\\s*'AllowSessionPasswordRelease':\\s*(?P<allow_pw_release>True|False),\\s*'EnableCommandDetection':\\s*(?P<enable_command_detection>True|False),\\s*'Sessions':\\s*(?P<sessions>\\[.*?\\]),\\s*'AllowX11Forwarding':\\s*(?P<allow_x_forwarding>True|False),\\s*'AllowSubsequentAccessRequestsWithoutReview':\\s*(?P<subseq_no_review>True|False),\\s*'SessionModuleConnectionId':\\s*(?P<session_module_connection_id>-?\\d+),\\s*'SessionConnectionPolicyRef':\\s*'(?P<conn_policy_ref>[^']+)',\\s*'RequesterUsername':\\s*'(?P<gateway_username>[^']+)',\\s*'AllowSessionSshKeyRelease':\\s*(?P<allow_ssh_release>True|False),\\s*'AccountDistinguishedName':\\s*'(?P<distinguished_name>[^']+)',\\s*'AssetPlatformId':\\s*(?P<platform_id>\\d+),\\s*'AssetPlatformType':\\s*'(?P<platform_type>[^']+)',\\s*'AssetPlatformDisplayName':\\s*'(?P<platform_display_name>[^']+)'\\})?$",
              "'AllowUserSuppliedServiceAccount':\\s*(?P<user_service_acct>True|False).*'AccountRequestTypes':\\s*(?P<account_request_types>\\[[^\\]]*\\]).*'Id':\\s*(?P<asset_id>\\d+),\\s*'Name':\\s*'(?P<server_hostname>[^']+)'.*'AssetType':\\s*'(?P<asset_type>[^']+)'.*'NetworkAddress':\\s*'%{IP:dst_ip}'.*'AssetPartitionId':\\s*(?P<asset_partition_id>-?\\d+).*'AssetPartitionName':\\s*'(?P<asset_partition>[^']+)'.*'PlatformId':\\s*(?P<platform_id>\\d+).*'PlatformType':\\s*'(?P<platform_type>[^']+)'.*'PlatformDisplayName':\\s*'(?P<platform_display_name>[^']+)'.*'Disabled':\\s*(?P<disabled>True|False).*'SupportsSessionManagement':\\s*(?P<supports_session_management>True|False).*'AllowSessionRequests':\\s*(?P<allow_session_requests>True|False).*'(?:SshSessionPort|RemoteDesktopSessionPort|TelnetSessionPort)':\\s*(?P<dst_port>\\d+)",
              "'Id':\\s*(?P<account_id>\\d+),\\s*'Name':\\s*'(?P<remote_username>[^']+)'.*'Description':\\s*'(?P<account_description>[^']+)'.*'SystemId':\\s*(?P<account_system_id>\\d+).*'AllowPasswordRequest':\\s*(?P<allow_password_request>True|False).*'AllowSessionRequest':\\s*(?P<allow_session_request>True|False).*'AllowSshKeyRequest':\\s*(?P<allow_ssh_key_request>True|False).*'PlatformId':\\s*(?P<platform_id>\\d+).*'PlatformType':\\s*'(?P<platform_type>[^']+)'.*'PlatformFamily':\\s*'(?P<platform_family>[^']+)'.*'PlatformDisplayName':\\s*'(?P<platform_display_name>[^']+)'.*'IsAcctNameCaseSensitive':\\s*(?P<is_acct_name_case_sensitive>True|False).*'HasPassword':\\s*(?P<has_password>True|False).*'HasSshKey':\\s*(?P<has_ssh_key>True|False).*'DomainName':\\s*'(?P<domain>[^']+)'.*'DistinguishedName':\\s*'(?P<distinguished_name>[^']+)'.*'NetBiosName':\\s*'(?P<netbios_name>[^']+)'.*'SystemName':\\s*'(?P<account_system_name>[^']+)'.*'Disabled':\\s*(?P<disabled>True|False).*'IsServiceAccount':\\s*(?P<is_service_account>True|False).*'AccountType':\\s*'(?P<account_type>[^']+)'.*'NotifyOwnersOnly':\\s*(?P<notify_owners_only>True|False).*'SuspendAccountWhenCheckedIn':\\s*(?P<suspend_on_checkin>True|False).*'AccountRequestTypes':\\s*(?P<account_request_types>\\[[^\\]]*\\]).*'AltLoginName':\\s*'(?P<alt_login_name>[^']+)'.*'LinkedUsersCount':\\s*(?P<linked_users_count>\\d+)",
              "'AuthResponse':\\s*'(?P<access_request_id>[^']*)'(?:,\\s*'User':\\s*'(?P<gateway_username>[^']*)')?",
              "^(?P<session_token>[A-Za-z0-9_]+)$"
            ]
          }
          overwrite => ["access_request_type", "account_id", "remote_username", "domain", "account_system_id", "account_system_name", "account_request_type", "approved_by_me", "asset_id", "server_hostname", "dst_ip", "created_on", "current_approval_count", "current_reviewer_count", "duration_minutes", "expires_on", "access_request_id", "is_emergency", "needs_acknowledgement", "request_availability", "requested_duration_days", "requested_duration_hours", "requested_duration_minutes", "requested_for", "principal_user_display", "principal_user_email", "requester_id", "required_approval_count", "required_reviewer_count", "access_request_state", "state_changed_on", "was_cancelled", "was_checked_out", "was_denied", "was_evicted", "was_expired", "was_revoked", "workflow_actions", "policy_id", "policy_name", "require_reviewer_comment", "enable_session_recordings", "allow_clipboard", "allow_sra_session_launch", "allow_sftp_sessions", "allow_scp_sessions", "allow_pw_release", "enable_command_detection", "sessions", "allow_x_forwarding", "subseq_no_review", "session_module_connection_id", "conn_policy_ref", "allow_ssh_release", "user_service_acct", "account_request_types", "asset_type", "asset_partition_id", "asset_partition", "platform_id", "platform_type", "platform_family", "platform_display_name", "disabled", "supports_session_management", "allow_session_requests", "dst_port", "account_description", "allow_password_request", "allow_session_request", "allow_ssh_key_request", "is_acct_name_case_sensitive", "has_password", "has_ssh_key", "distinguished_name", "netbios_name", "is_service_account", "account_type", "notify_owners_only", "suspend_on_checkin", "alt_login_name", "linked_users_count", "gateway_username", "session_token"]
          on_error => "resp_data_struct_nomatch"
        }
        grok {
          match => {
            "resp_data" => [
