        "additional_field3_label.key" => "ConnectionCloseReason"
        "additional_field3_label.value.string_value" => "%{ConnectionCloseReason}"
      }
      on_error => "ConnectionCloseReason_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field3_label"
      }
      on_error => "ConnectionCloseReason_label_merge_failed"
    }
  }
  if [ConnectionReuse] != "" {
    mutate {
      convert => {
        "ConnectionReuse" => "string"
      }
      on_error => "connection_reuse_already_string"
    }
    mutate {
      replace => {
        "additional_field4_label.key" => "ConnectionReuse"
        "additional_field4_label.value.string_value" => "%{ConnectionReuse}"
      }
      on_error => "ConnectionReuse_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field4_label"
      }
      on_error => "ConnectionReuse_label_merge_failed"
    }
  }
  if [DestinationTunnelID] != "" {
    mutate {
      replace => {
        "additional_field5_label.key" => "DestinationTunnelID"
        "additional_field5_label.value.string_value" => "%{DestinationTunnelID}"
      }
      on_error => "DestinationTunnelID_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field5_label"
      }
      on_error => "DestinationTunnelID_label_merge_failed"
    }
  }
  if [EgressColoName] != "" {
    mutate {
      replace => {
        "additional_field6_label.key" => "EgressColoName"
        "additional_field6_label.value.string_value" => "%{EgressColoName}"
      }
      on_error => "EgressColoName_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field6_label"
      }
      on_error => "EgressColoName_label_merge_failed"
    }
  }
  if [EgressRuleID] != "" {
    mutate {
      replace => {
        "additional_field7_label.key" => "EgressRuleID"
        "additional_field7_label.value.string_value" => "%{EgressRuleID}"
      }
      on_error => "EgressRuleID_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field7_label"
      }
      on_error => "EgressRuleID_label_merge_failed"
    }
  }
  if [EgressRuleName] != "" {
    mutate {
      replace => {
        "additional_field8_label.key" => "EgressRuleName"
        "additional_field8_label.value.string_value" => "%{EgressRuleName}"
      }
      on_error => "EgressRuleName_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field8_label"
      }
      on_error => "EgressRuleName_label_merge_failed"
    }
  }
  if [EgressIP] != "" {
    mutate {
      merge => {
        "principal.ip" => "EgressIP"
        "principal.asset.ip" => "EgressIP"
      }
      on_error => "no_egress_ip"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [SrcIP] != "" {
    mutate {
      merge => {
        "principal.ip" => "SrcIP"
        "principal.asset.ip" => "SrcIP"
      }
      on_error => "no_src_ip"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [EgressPort] != "" {
    mutate {
      convert => {
        "EgressPort" => "string"
      }
      on_error => "egress_port_already_string"
    }
    mutate {
      replace => {
        "EgressPort_label.key" => "EgressPort"
        "EgressPort_label.value.string_value" => "%{EgressPort}"
      }
      on_error => "EgressPort_label_not_present"
    }
    if ![EgressPort_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "EgressPort_label"
        }
        on_error => "EgressPort_label_merge_failed"
      }
    }
  }
  mutate {
    convert => {
      "principal.port" => "integer"
    }
    on_error => "principal_port_conversion_failure_1"
  }
  if [IngressColoName] != "" {
    mutate {
      replace => {
        "additional_field9_label.key" => "IngressColoName"
        "additional_field9_label.value.string_value" => "%{IngressColoName}"
      }
      on_error => "IngressColoName_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field9_label"
      }
      on_error => "IngressColoName_label_merge_failed"
    }
  }
  if [Offramp] != "" {
    mutate {
      replace => {
        "additional_field10_label.key" => "Offramp"
        "additional_field10_label.value.string_value" => "%{Offramp}"
      }
      on_error => "Offramp_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field10_label"
      }
      on_error => "Offramp_label_merge_failed"
    }
  }
  if [OriginIP] != "" {
    mutate {
      merge => {
        "intermediary.ip" => "OriginIP"
      }
      on_error => "no_origin_ip"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }
  if [OriginPort] != "" {
    mutate {
      convert => {
        "OriginPort" => "string"
      }
      on_error => "origin_port_already_string"
    }
    mutate {
      replace => {
        "target.port" => "%{OriginPort}"
      }
      on_error => "no_origin_port"
    }
  }
  mutate {
    convert => {
      "target.port" => "integer"
    }
    on_error => "target_port_conversion_failure_1"
  }
  if [OriginTLSCertificateValidationResult] != "" {
    mutate {
      replace => {
        "additional_field12_label.key" => "OriginTLSCertificateValidationResult"
        "additional_field12_label.value.string_value" => "%{OriginTLSCertificateValidationResult}"
      }
      on_error => "OriginTLSCertificateValidationResult_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field12_label"
      }
      on_error => "OriginTLSCertificateValidationResult_label_merge_failed"
    }
  }
  if [OriginTLSVersion] != "" {
    mutate {
      replace => {
        "additional_field15_label.key" => "OriginTLSVersion"
        "additional_field15_label.value.string_value" => "%{OriginTLSVersion}"
      }
      on_error => "OriginTLSVersion_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field15_label"
      }
      on_error => "OriginTLSVersion_label_merge_failed"
    }
  }
  if [Protocol] =~"TCP" {
    mutate {
      replace => {
        "network.ip_protocol" => "TCP"
      }
      on_error => "Protocol_empty"
    }
  }
  mutate {
    uppercase => ["Protocol"]
    on_error => "protocol_already_converted"
  }
  if [RuleEvaluationDurationMs] != "" {
    mutate {
      convert => {
        "RuleEvaluationDurationMs" => "string"
      }
      on_error => "rule_evaluation_duration_ms_already_string"
    }
    mutate {
      replace => {
        "additional_field16_label.key" => "RuleEvaluationDurationMs"
        "additional_field16_label.value.string_value" => "%{RuleEvaluationDurationMs}"
      }
      on_error => "RuleEvaluationDurationMs_label_not_present"
    }
    mutate{
      merge => {
        "additional.fields" => "additional_field16_label"
      }
      on_error => "RuleEvaluationDurationMs_label_merge_failed"
    }
  }
  if [RegistrationID] != "" {
    mutate {
      replace => {
        "RegistrationID_label.key" => "RegistrationID"
        "RegistrationID_label.value.string_value" => "%{RegistrationID}"
      }
      on_error => "RegistrationID_label_not_present"
    }
    if ![RegistrationID_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "RegistrationID_label"
        }
        on_error => "RegistrationID_label_merge_failed"
      }
    }
  }
  if [DownloadedFileNames] != "" {
    mutate {
      replace => {
        "DownloadedFileNames" => "{\"DownloadedFileNames\":\"%{DownloadedFileNames}\"}"
      }
      on_error => "DownloadedFileNames_replace_error"
    }
    json {
      source => "DownloadedFileNames"
      array_function => "split_columns"
      on_error => "DownloadedFileNames_json_parse_error"
    }
    mutate {
      replace => {
        "downloadedfilenames_list_values.value" => ""
      }
    }
    for downloadedfilenames in DownloadedFileNames {
      if [downloadedfilenames] != "" {
        mutate {
          replace => {
            "downloadedfilenames_arr" => ""
          }
        }
        mutate {
          replace => {
            "downloadedfilenames_arr.string_value" => "%{downloadedfilenames}"
          }
          on_error => "no_downloadedfilenames_array"
        }
        if ![no_downloadedfilenames_array] {
          mutate {
            merge => {
              "downloadedfilenames_list_values.value.list_value.values" => "downloadedfilenames_arr"
            }
            on_error => "downloadedfilenames_list_values_empty"
          }
        }
      }
    }
    if [downloadedfilenames_list_values][value] != "" {
      mutate {
        replace => {
          "downloadedfilenames_list_values.key" => "downloadedfilenames"
        }
        on_error => "downloadedfilenames_list_values_key_empty"
      }
      mutate {
        merge => {
          "additional.fields" => "downloadedfilenames_list_values"
        }
        on_error => "downloadedfilenames_list_values_merge_failed"
      }
    }
  }
  if [UploadedFileNames] != "" {
    mutate {
      replace => {
        "UploadedFileNames" => "{\"UploadedFileNames\":\"%{UploadedFileNames}\"}"
      }
      on_error => "UploadedFileNames_replace_error"
    }
    json {
      source => "UploadedFileNames"
      array_function => "split_columns"
      on_error => "UploadedFileNames_json_parse_error"
    }
    mutate {
      replace => {
        "uploadedfilenames_list_values.value" => ""
      }
    }
    for uploadedfilenames in UploadedFileNames {
      if [uploadedfilenames] != "" {
        mutate {
          replace => {
            "uploadedfilenames_arr" => ""
          }
        }
        mutate {
          replace => {
            "uploadedfilenames_arr.string_value" => "%{uploadedfilenames}"
          }
          on_error => "no_uploadedfilenames_array"
        }
        if ![no_uploadedfilenames_array] {
          mutate {
            merge => {
              "uploadedfilenames_list_values.value.list_value.values" => "uploadedfilenames_arr"
            }
            on_error => "uploadedfilenames_list_values_empty"
          }
        }
      }
    }
    if [uploadedfilenames_list_values][value] != "" {
      mutate {
        replace => {
          "uploadedfilenames_list_values.key" => "uploadedfilenames"
        }
        on_error => "uploadedfilenames_list_values_key_empty"
      }
      mutate {
        merge => {
          "additional.fields" => "uploadedfilenames_list_values"
        }
        on_error => "uploadedfilenames_list_values_merge_failed"
      }
    }
  }
  if [SessionEndTime] != "" {
    mutate {
      replace => {
        "additional_field17_label.key" => "SessionEndTime"
        "additional_field17_label.value.string_value" => "%{SessionEndTime}"
      }
      on_error => "SessionEndTime_label_not_present"
    }
    mutate {
      merge => {
        "additional.fields" => "additional_field17_label"
      }
      on_error => "SessionEndTime_label_merge_failed"
    }
  }
  if [SessionStartTime] != "" {
    date {
      match => ["SessionStartTime", "ISO8601"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "session_start_time_invalid_date_format"
    }
  }
  if [BlockedFileName] != "" {
    mutate {
      merge => {
        "principal.file.names" => "BlockedFileName"
      }
      on_error => "BlockedFileName_empty"
    }
  }
  mutate {
    convert => {
      "BlockedFileSize" => "string"
    }
    on_error => "BlockedFileSize_already_string"
  }
  if [BlockedFileSize] not in ["", "0"] {
    mutate {
      replace => {
        "target.file.size" => "%{BlockedFileSize}"
      }
      on_error => "BlockedFileSize_empty"
    }
    mutate {
      convert => {
        "target.file.size" => "uinteger"
      }
      on_error => "BlockedFileSize_conversion_failure"
    }
  }
  for index, dlpProfile in DownloadMatchedDlpProfiles {
    mutate {
      replace => {
        "dlpProfile_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index1_already_string"
    }
    mutate {
      convert => {
        "dlpProfile" => "string"
      }
      on_error => "dlpProfile_already_string"
    }
    mutate {
      replace => {
        "dlpProfile_label.key" => "DownloadMatchedDlpProfiles_%{index}"
        "dlpProfile_label.value.string_value" => "%{dlpProfile}"
      }
      on_error => "dlpProfile_label_not_present"
    }
    if ![dlpProfile_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "dlpProfile_label"
        }
        on_error => "dlpProfile_label_merge_failed"
      }
    }
  }
  for index, uploaddlpProfile in UploadMatchedDlpProfileEntries {
    mutate {
      replace => {
        "upload_dlpProfile_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index2_already_string"
    }
    mutate {
      convert => {
        "uploaddlpProfile" => "string"
      }
      on_error => "uploaddlpProfile_already_string"
    }
    mutate {
      replace => {
        "upload_dlpProfile_label.key" => "UploadMatchedDlpProfileEntries_%{index}"
        "upload_dlpProfile_label.value.string_value" => "%{uploaddlpProfile}"
      }
      on_error => "upload_dlpProfile_label_not_present"
    }
    if ![upload_dlpProfile_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "upload_dlpProfile_label"
        }
        on_error => "upload_dlpProfile_label_merge_failed"
      }
    }
  }
  for index, downloadmatchedDlpProfile in DownloadMatchedDlpProfileEntries {
    mutate {
      replace => {
        "download_dlpProfile_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index3_already_string"
    }
    mutate {
      convert => {
        "downloadmatchedDlpProfile" => "string"
      }
      on_error => "downloadmatchedDlpProfile_already_string"
    }
    mutate {
      replace => {
        "download_dlpProfile_label.key" => "DownloadMatchedDlpProfileEntries_%{index}"
        "download_dlpProfile_label.value.string_value" => "%{downloadmatchedDlpProfile}"
      }
      on_error => "download_dlpProfile_label_not_present"
    }
    if ![download_dlpProfile_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "download_dlpProfile_label"
        }
        on_error => "download_dlpProfile_label_merge_failed"
      }
    }
  }
  for index, uploadMatchedDlpProfile in UploadMatchedDlpProfiles {
    mutate {
      replace => {
        "upload_matched_dlp_profiles_label" => ""
      }
    }
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index4_already_string"
    }
    mutate {
      convert => {
        "uploadMatchedDlpProfile" => "string"
      }
      on_error => "uploadMatchedDlpProfile_already_string"
    }
    mutate {
      replace => {
        "upload_matched_dlp_profiles_label.key" => "UploadMatchedDlpProfiles_%{index}"
        "upload_matched_dlp_profiles_label.value.string_value" => "%{uploadMatchedDlpProfile}"
      }
      on_error => "upload_matched_dlp_profiles_label_not_present"
    }
    if ![upload_matched_dlp_profiles_label_not_present] {
      mutate {
        merge => {
          "additional.fields" => "upload_matched_dlp_profiles_label"
        }
        on_error => "upload_matched_dlp_profiles_label_merge_failed"
      }
    }
  }
  #eventtype mapping
  if [has_principal] == "true" and [has_target] == "true" and [has_network_http] == "true" and [HTTPMethod] != "UNKNOWN" {
    mutate {
      replace => {
        "metadata_event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [event_type] == "" and [SourceIP] != "" and [DestinationIP] != "" {
    mutate {
      replace => {
        "metadata_event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "metadata_event_type" => "NETWORK_DNS"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" and [has_principal_user] == "false" {
    mutate {
      replace => {
        "metadata_event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_principal] == "true" and [event_type] == "" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal_user] == "true" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if ([event_type] =~ "NETWORK_DNS" and [has_principal] == "false" and [has_target] == "false") or [event_type] == "" {
    mutate {
      replace => {
        "metadata_event_type" => "GENERIC_EVENT"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata_event_type" => "GENERIC_EVENT"
      }
      on_error => "event_type_empty"
    }
  }
  if [DeviceID] != "" and [metadata_event_type] != "STATUS_UPDATE" {
    mutate {
      replace => {
        "principal.asset_id" => "CLOUDFLARE_WARP:%{DeviceID}"
      }
      on_error => "no_deviceid"
    }
  }
  if [metadata_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{metadata_event_type}"
      }
    }
  }
  # merge the data into udm nouns.
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }
  if [questions] != "" {
    mutate {
      merge => {
        "network.dns.questions" => "questions"
      }
      on_error => "questions_empty"
    }
  }
  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
