# Product: NETFLOW_OTEL
# Category: OpenTelemetry Netflow Receiver
# Supported Format: JSON
# Last Updated: 2025-04-23
# Copyright 2025 Google SecOps

filter {
  mutate {
    replace => {
      "event_type" => "GENERIC_EVENT"
      "principal" => ""
      "security_result" => ""
      "target" => ""
      "metadata" => ""
      "additional" => ""
      "has_principal" => "false"
      "has_target" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "json_invalid"
  }

  if [json_invalid] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  if [source][address] != "" {
    mutate {
      merge => {
        "principal.ip" => "source.address"
        "principal.asset.ip" => "source.address"
      }
      on_error => "source_address_not_found"
    }
    if ![source_address_not_found] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }

  if [source][port] != "" {
    mutate {
      convert => {
        "source.port" => "integer"
      }
      on_error => "source_port_conversion_failed"
    }
    mutate {
      rename => {
        "source.port" => "principal.port"
      }
      on_error => "source_port_not_found"
    }
  }

  if [destination][address] != "" {
    mutate {
      merge => {
        "target.ip" => "destination.address"
        "target.asset.ip" => "destination.address"
      }
      on_error => "destination_address_not_found"
    }
    if ![destination_address_not_found] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }

  if [destination][port] != "" {
    mutate {
      convert => {
        "destination.port" => "integer"
      }
      on_error => "destination_port_conversion_failed"
    }
    mutate {
      rename => {
        "destination.port" => "target.port"
      }
      on_error => "destination_port_not_found"
    }
  }

  if [network][transport] != "" {
    mutate {
      replace => {
        "network_ip_protocol" => ""
      }
    }
    if [network][transport] == "tcp" {
      mutate {
        replace => {
          "network_ip_protocol" => "TCP"
        }
      }
    }
    else if [network][transport] == "udp" {
      mutate {
        replace => {
          "network_ip_protocol" => "UDP"
        }
      }
    }
    mutate {
      rename => {
        "network_ip_protocol" => "event.idm.read_only_udm.network.ip_protocol"
      }
      on_error => "network_transport_not_found"
    }
  }

  if [network][type] != "" {
    mutate {
      replace => {
        "detection_field.key" => "network_type"
        "detection_field.value" => "%{network.type}"
      }
      on_error => "network_type_not_found"
    }
    if ![network_type_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_field"
        }
        on_error => "detection_field_not_found"
      }
    }
  }

  if [flow][io][bytes] != "" {
    mutate {
      convert => {
        "flow.io.bytes" => "string"
      }
      on_error => "flow_io_bytes_conversion_failed"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{flow.io.bytes}"
      }
      on_error => "flow_io_bytes_not_found"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "flow_io_bytes_conversion_failed"
    }
  }

  if [flow][io][packets] != "" {
    mutate {
      convert => {
        "flow.io.packets" => "string"
      }
      on_error => "flow_io_packets_conversion_failed"
    }
    mutate {
      replace => {
        "detection_field_packets.key" => "flow_packets"
        "detection_field_packets.value" => "%{flow.io.packets}"
      }
      on_error => "flow_io_packets_not_found"
    }
    if ![flow_io_packets_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_field_packets"
        }
        on_error => "detection_field_packets_not_found"
      }
    }
  }

  if [flow][start] != "" {
    mutate {
      convert => {
        "flow.start" => "string"
      }
      on_error => "flow_start_conversion_failed"
    }
    mutate {
      replace => {
        "detection_field_flow_start.key" => "flow_start"
        "detection_field_flow_start.value" => "%{flow.start}"
      }
      on_error => "flow_start_not_found"
    }
    if ![flow_start_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_field_flow_start"
        }
        on_error => "detection_field_flow_start_not_found"
      }
    }
  }

  if [flow][sequence_num] != "" {
    mutate {
      convert => {
        "flow.sequence_num" => "string"
      }
      on_error => "flow_sequence_num_conversion_failed"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{flow.sequence_num}"
      }
      on_error => "flow_sequence_num_not_found"
    }
  }

  if [flow][sampler_address] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.observer.ip" => "flow.sampler_address"
      }
      on_error => "flow_sampler_address_not_found"
    }
  }

  if [flow][type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{flow.type}"
      }
      on_error => "flow_type_not_found"
    }
  }

  if [flow][time_received] != "" {
    mutate {
      convert => {
        "flow.time_received" => "string"
      }
      on_error => "flow_start_conversion_failed"
    }
    mutate {
      replace => {
        "detection_field_flow_time_received.key" => "flow_time_received"
        "detection_field_flow_time_received.value" => "%{flow.time_received}"
      }
      on_error => "flow_time_received_not_found"
    }
    if ![flow_time_received_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_field_flow_time_received"
        }
        on_error => "detection_field_flow_time_received_not_found"
      }
    }
  }

  if [flow][end] != "" {
    mutate {
      convert => {
        "flow.end" => "string"
      }
      on_error => "flow_end_conversion_failed"
    }
    mutate {
      replace => {
        "detection_field_flow_end.key" => "flow_end"
        "detection_field_flow_end.value" => "%{flow.end}"
      }
      on_error => "flow_end_not_found"
    }
    if ![flow_end_not_found] {
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_field_flow_end"
        }
        on_error => "detection_field_flow_end_not_found"
      }
    }
  }

  if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "metadata.product_name" => "NETFLOW_OTEL"
      "metadata.vendor_name" => "NETFLOW_OTEL"
    }
  }

  if [event_type] != "" {
    mutate {
      replace => {
        "metadata.event_type" => "%{event_type}"
      }
      on_error => "event_type_invalid"
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "security_result_invalid"
    }
  }
  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }
  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

# output the built event
  mutate {
    merge=> {
      "@output" => "event"
    }
  }
}
