# Product: VMWARE_TANZU
# Category: IDS/IPS
# Supported Format: JSON + SYSLOG+JSON
# Reference: https://docs.vmware.com/en/VMware-Tanzu/index.html
# Last Updated: 2023-09-08
# Copyright 2023 Chronicle LLC

filter {
  mutate {
    replace => {
      "json_data" => ""
      "kind" => ""
      "apiVersion" => ""
      "auditID" => ""
      "stage" => ""
      "requestURI" => ""
      "user.username" => ""
      "user.groups" => ""
      "user.uid" => ""
      "sourceIPs" => ""
      "userAgent" => ""
      "objectRef.resource" => ""
      "objectRef.name" => ""
      "objectRef.uid" => ""
      "objectRef.namespace" => ""
      "objectRef.resourceVersion" => ""
      "responseStatus.code" => ""
      "requestReceivedTimestamp" => ""
      "stageTimestamp" => ""
      "security_result" => ""
      "verb" => ""
      "event_type" => ""
      "timestamp" => ""
    }
  }

  grok {
    match => {
      "message" => "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{DATA}(?P<json_data>{.*})"
    }
    overwrite => ["json_data", "timestamp"]
    on_error => "pattern_not_matched"
  }
  if [pattern_not_matched] {
   json {
      source => "message"
      array_function => "split_columns"
      on_error => "not_json"
    }
    if [not_json] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
  }
  else {
    json {
      source => "json_data"
      array_function => "split_columns"
      on_error => "not_json_2"
    }
    if [not_json_2] {
      drop {
        tag => "TAG_MALFORMED_ENCODING"
      }
    }
  }

  if [user][uid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{user.uid}"
      }
    }
  }

  if [user][username] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{user.username}"
      }
    }
  }

  if [user][groups] != "" {
    for group in user.groups {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" => "group"
        }
      }
    }
  }

  if [sourceIPs] != "" {
    for ip in sourceIPs {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "ip"
        }
      }
    }
  }

  if [requestURI] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{requestURI}"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.target.resource.resource_type" => "CLUSTER"
    }
  }

  if [objectRef][resource] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" => "%{objectRef.resource}"
      }
    }
  }

  if [objectRef][name] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{objectRef.name}"
      }
    }
  }

  if [objectRef][uid] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" => "%{objectRef.uid}"
      }
    }
  }

  if [objectRef][namespace] != "" {
    mutate{
      replace => {
        "namespace_label.key" => "namespace"
        "namespace_label.value" => "%{objectRef.namespace}"
      }
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "namespace_label"
      }
    }
  }

  if [objectRef][resourceVersion] != "" {
    mutate{
      replace => {
        "resource_version_label.key" => "resourceVersion"
        "resource_version_label.value" => "%{objectRef.resourceVersion}"
      }
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "resource_version_label"
      }
    }
  }

  if [userAgent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{userAgent}"
      }
    }
  }

  if [verb] != "" {
    mutate {
      uppercase => [ "verb" ]
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{verb}"
      }
    }
  }

  if [responseStatus][code] != "" {
    mutate {
      convert => {
        "responseStatus.code" => "integer"
      }
    }

    mutate {
      rename => {
        "responseStatus.code" => "event.idm.read_only_udm.network.http.response_code"
      }
    }
  }

  if [requestReceivedTimestamp] != "" {
    date {
      match => ["requestReceivedTimestamp" , "ISO8601"]
    }
  } else if [timestamp] != "" {
    date {
      match => ["timestamp" , "ISO8601"]
    }
  }

  if [stageTimestamp] != "" {
    date {
      match => ["stageTimestamp" , "ISO8601"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
    }
  }

  if [kind] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{kind}"
      }
    }
  }

  if [apiVersion] != "" {
    mutate {
      replace =>{
        "event.idm.read_only_udm.metadata.product_version" => "%{apiVersion}"
      }
    }
  }

  if [auditID] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{auditID}"
      }
    }
  }

  if [stage] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{stage}"
      }
    }
  }

  if [message] =~ "annotations.*authorization.*k8s" {
    mutate {
      replace => {
        "security_action" => "%{annotations.authorization.k8s.io/decision}"
        "security_result.description" => "%{annotations.authorization.k8s.io/reason}"
      }
    }

    mutate {
      gsub => [ "security_result.description", '\\"', "" ]
    }

    if [security_action] =~ "(?i)allow"{
      mutate{
        replace =>{
          "security_action" => "ALLOW"
        }
      }
    } else {
      mutate{
        replace =>{
          "security_action" => "BLOCK"
        }
      }
    }

    mutate {
      merge => {
        "security_result.action" => "security_action"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [verb] =~ "(?i)CREATE" and [user][uid] != "" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_CREATION"
      }
    }
  } else if [verb] =~ "(?i)(PATCH|UPDATE)" and [user][uid] != "" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_UPDATE_CONTENT"
      }
    }
  } else if [verb] =~ "(?i)DELETE" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_DELETION"
      }
    }
  } else if [verb] != "" {
    mutate {
      replace => {
        "event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  }

  if [event_type] != "" {
    mutate {
      rename => {
        "event_type" => "event.idm.read_only_udm.metadata.event_type"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "VMWARE_TANZU"
      "event.idm.read_only_udm.metadata.product_name" => "VMWARE"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
