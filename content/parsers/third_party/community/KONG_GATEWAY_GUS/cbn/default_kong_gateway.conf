# Product: KONG GATEWAY
# Category: Microservice management
# Supported Format: SYSLOG + JSON
# Reference:  https://docs.konghq.com/gateway/latest/production/logging/
# Last Updated: 2022-09-23
# Copyright 2022 Chronicle LLC



filter {
  mutate {
    replace => {
      "json_message" => ""
      "timestamp" => ""
      "intermediary_host" => ""
      "log_level" => ""
      "message_key" => ""
      "principal_host" => ""
      "principal_port" => ""
      "service.port"  => ""
      "service.host" => ""
      "route.id" => ""
      "request.method" => ""
      "host_and_port" => ""
      "service_host" => ""
      "route.protocols" => ""
      "request.headers.x-consumer-id" => ""
      "request.headers.x-forwarded-proto" => ""
      "application_protocol" => ""
      "service.protocol" => ""
      "request.size" => ""
      "response.size" => ""
      "response.status" => ""
      "request.decoded-headers.authorization.user" => ""
      "request.decoded_headers.authorization.auth_type" => ""
      "request.headers.content-type" => ""
      "request.url" => ""
      "request.headers.host" => ""
      "response.headers.set-cookie" => ""
      "intermediary" => ""
      "request.headers.x-forwarded-for" => ""
      "xff_ips" => ""
      "no_ips" => "false"
      "client_ip" => ""
      "service.id" => ""
    }
  }
  mutate {
    convert => {
      "no_ips" => "boolean"
    }
  }

  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:timestamp} %{HOST:intermediary_host} %{WORD:log_level} MessageKey=\"%{DATA:message_key}\" Message=\"%{GREEDYDATA:json_message}\""
      ]
    }
    overwrite => ["timestamp","intermediary_host","log_level","message_key","json_message"]
    on_error => "pattern_not_implemented"
  }

  # Remove the @ in timestamp and metadata fields as it borks the JSON filter
  mutate { gsub => ["json_message", "@metadata", "metadata"] }
  mutate { gsub => ["json_message", "@timestamp", "timestamp"] }

  # Run the log line thru the JSON filter plugin
  json {
    source => "json_message"
    array_function => "split_columns"
    on_error => "json_error"
  }

  if [json_error] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }

  #metadata
  if [metadata][version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_version" => "%{metadata.version}"
      }
    }
  }
  if [metadata][_id] != "" {
    mutate {
      replace => {
         "event.idm.read_only_udm.metadata.product_log_id" => "%{metadata._id}"
      }
    }
  }
  if [request][headers][x-consumer-id] != "" {
    mutate {
      replace => {
        "label.key" => "x-consumer-id"
        "label.value" => "%{request.headers.x-consumer-id}"
      }
      merge => {
         "event.idm.read_only_udm.metadata.ingestion_labels" => "label"
      }
    }
  }

  #intermediary
  if [intermediary_host] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{intermediary_host}"
      }
    }
  }

  if [request][headers][x-forwarded-for] != "" {
    mutate {
      gsub => ["request.headers.x-forwarded-for",", ", ","]
    }
    mutate {
      gsub => ["request.headers.x-forwarded-for",",","\",\""]
    }



    mutate {
      replace => {
        "test" => "{\"xff_ips\":[\"%{request.headers.x-forwarded-for}\"]}"
      }
    }
    json {
      source => "test"
        array_function => "split_columns"
        on_error => "json_fail"
    }

    if [json_fail] {
      grok {
         match => {
           "request.headers.x-forwarded-for" => "%{IP:xff_ips}"
         }
         overwrite => ["xff_ips"]
         on_error => "no_ips"
      }
    }
    if ![no_ips] {
      for ip in xff_ips {
        mutate {
          merge => {
            "intermediary.ip" => "ip"
          }
        }
      }
    }
  }
  mutate {
    merge => {
      "event.idm.read_only_udm.intermediary" => "intermediary"
    }
  }

  #observer
  if [agent][hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{agent.hostname}"
      }
    }
  }

  if [agent][version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.platform_version" => "%{agent.version}"
      }
    }
  }

  if [agent][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.asset_id" => "%{agent.name}:%{agent.id}"
      }
    }
  }

  if [agent][ephemeral_id] != "" {
    mutate {
      replace => {
        "observer_label1.key" => "ephemeral_id"
        "observer_label1.value" => "%{agent.ephemeral_id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.observer.resource.attribute.labels" => "observer_label1"
      }
    }
  }

  #principal
  for ip in host.ip {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "ip"
      }
    }
  }

  for mac in host.mac {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.mac" => "mac"
      }
    }
  }

  if [host][os][version] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.platform_version" => "%{host.os.version}"
      }
    }
  }
  if [host][os][name] != "" {
    if [host][os][name] =~ "(?i)Linux" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "LINUX"
        }
      }
    }
    else if [host][os][name] =~ "(?i)windows" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "WINDOWS"
        }
      }
    }
    else if [host][os][name] =~ "(?i)mac|ios" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "MAC"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.platform" => "UNKNOWN_PLATFORM"
        }
      }
    }
  }

  if [request][url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.url" => "%{request.url}"
      }
    }
  }

  if [request][headers][host] != "" {
    mutate {
      replace => {
        "host_and_port" => "%{request.headers.host}"
      }
    }
    grok {
      match => {
        "host_and_port" => [
          "%{HOST:principal_host}:%{INT:principal_port}"
          "%{HOST:principal_host}"
        ]
      }
      overwrite => ["principal_host","principal_port"]
    }

    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{principal_host}"
      }
    }
    if [principal_port] != "" {
      mutate {
        convert => {
          "principal_port" => "integer"
        }
      }
      mutate{
        rename => {
          "principal_port" => "event.idm.read_only_udm.principal.port"
        }
      }
    }
  }

  if [principal_host] == "" and [host][fqdn] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host.fqdn}"
      }
    }
  }

  if [request][headers][content-type] != "" {
    mutate {
      replace => {
        "principal_label1.key" => "content-type"
        "principal_label1.value" => "%{request.headers.content-type}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "principal_label1"
      }
    }
  }

  if [request][decoded_headers][authorization][auth_type] != "" {
    mutate {
      replace => {
        "principal_label2.key" => "auth_type"
        "principal_label2.value" => "%{request.decoded_headers.authorization.auth_type}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.resource.attribute.labels" => "principal_label2"
      }
    }
  }

  if [request][decoded-headers][authorization][user] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.user_display_name" => "%{request.decoded-headers.authorization.user}"
      }
    }
  }

  if [cloud][availability_zone] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.principal.cloud.availability_zone" => "%{cloud.availability_zone}"
      }
    }
  }
  if [cloud][instance][id] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.principal.cloud.project.id" => "%{cloud.instance.id}"
      }
    }
  }
  if [cloud][instance][name] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.principal.cloud.project.name" => "%{cloud.instance.name}"
      }
    }
  }
  if [cloud][machine][type] != "" {
    mutate{
      replace => {
        "event.idm.read_only_udm.principal.cloud.project.type" => "VIRTUAL_MACHINE"
      }
    }
  }

  #target
  if [client_ip] != ""{
    mutate {
      merge => {
        "event.idm.read_only_udm.target.ip" => "client_ip"
      }
    }
  }

  if [service][id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.asset_id" => "%{service.host}:%{service.id}"
      }
    }
  }
  if [service][port] != "" {
    mutate {
      convert => {
        "service.port" => "integer"
      }
    }
    mutate {
      rename => {
        "service.port" => "event.idm.read_only_udm.target.port"
      }
    }
  }
 if [service][host] != "" {
     grok {
       match => {
         "service.host" => "%{IP:service_host}"
       }
       overwrite => ["service_host"]
       on_error => "not_ip"
     }
     if [not_ip] {
       mutate {
          replace => {
           "event.idm.read_only_udm.target.hostname" => "%{service.host}"
         }
       }
     }
     else {
       mutate {
         merge => {
           "event.idm.read_only_udm.target.ip" => "service_host"
         }
       }
     }
   }

  if [log][file][path] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{log.file.path}"
      }
    }
  }

  if [response][headers][set-cookie] != "" {
    mutate {
      replace => {
        "target_label1.key" => "set-cookie"
        "target_label1.value" => "%{response.headers.set-cookie}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "target_label1"
      }
    }
  }
  if [route][id] != "" {
    mutate {
      replace => {
        "target_label2.key" => "route.id"
        "target_label2.value" => "%{route.id}"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.target.resource.attribute.labels" => "target_label2"
      }
    }
  }

  #network
  if [request][method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{request.method}"
      }
    }
  }

  if [route][protocols] != "" {
    for protocol in route.protocols {
      if [protocol] == "https" {
        mutate {
          replace => {
            "application_protocol" => "HTTPS"
          }
        }
      }
      else if [protocol] == "http" and [application_protocol] != "HTTPS" {
        mutate {
          replace => {
            "application_protocol" => "HTTP"
          }
        }
      }
    }
  }

  if [service][protocol] != "" and [application_protocol] == "" {
    mutate {
      replace => {
        "application_protocol" => "%{service.protocol}"
      }
    }
  }
  if [application_protocol] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.application_protocol" => "%{application_protocol}"
      }
    }
  }

  if [request][size] != "" {
    mutate {
      convert => {
        "request.size" => "uinteger"
      }
    }
    mutate {
      rename => {
        "request.size" => "event.idm.read_only_udm.network.sent_bytes"
      }
    }
  }
  if [response][size] != "" {
    mutate {
      convert => {
        "response.size" => "uinteger"
      }
    }
    mutate {
      rename => {
        "response.size" => "event.idm.read_only_udm.network.received_bytes"
      }
    }
  }
  if [response][status] != "" {
   mutate {
      convert => {
        "response.status" => "integer"
      }
    }
    mutate {
      rename => {
        "response.status" => "event.idm.read_only_udm.network.http.response_code"
      }
    }
  }


  #security_results
  if [log_level] != "" {
    if [log_level] =~ "(?i)Info" {
      mutate {
        replace => {
          "security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [log_level] =~ "(?i)Error" {
       mutate {
         replace => {
           "security_result.severity" => "ERROR"
         }
       }
    }
    else if [log_level] =~ "(?i)Warning" {
      mutate {
        replace => {
          "security_result.severity" => "MEDIUM"
        }
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [service][host] != "" or [client_ip] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [event][idm][read_only_udm][target] != "" {
     mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "KONG_GATEWAY"
      "event.idm.read_only_udm.metadata.product_name" => "KONG_GATEWAY"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
