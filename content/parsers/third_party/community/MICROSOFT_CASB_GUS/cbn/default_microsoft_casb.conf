# Product: Microsoft CASB
# Category: CASB
# Supported Format: SYSLOG + KV (CEF)
# Reference: https://docs.microsoft.com/en-us/cloud-app-security/siem
# Last Updated: 2025-03-26
# Copyright 2025 Google SecOps


filter {
    mutate {
        # initialising varaibles
        replace => {
            "time" => ""
            "kv_data" => ""
            "ts_event" => ""
            "operationName" => ""
            "category" => ""
            "properties.RawEventData.protoPayload.@type" => ""
            "properties.ActionType" => ""
            "properties.ApplicationId" => ""
            "properties.IPAddress" => ""
            "properties.OSPlatform" => ""
            "properties.DeviceType" => ""
            "properties.CountryCode" => ""
            "properties.AccountDisplayName" => ""
            "properties.City" => ""
            "properties.IsAnonymousProxy" => ""
            "properties.IsImpersonated" => ""
            "properties.IsExternalUser" => ""
            "properties.UserAgent" => ""
            "properties.AccountObjectId" => ""
            "properties.RawEventData.UserId" => ""
            "properties.RawEventData.SiteUrl" => ""
            "properties.RawEventData.SourceRelativeUrl" => ""
            "properties.RawEventData.SourceFileName" => ""
            "properties.RawEventData.SourceFileExtension" => ""
            "properties.RawEventData.OrganizationId" => ""
            "properties.RawEventData.EventSource" => ""
            "properties.RawEventData.UserKey" => ""
            "properties.RawEventData.RecordType" => ""
            "properties.RawEventData.HighPriorityMediaProcessing" => ""
            "properties.RawEventData.FileSyncBytesCommitted" => ""
            "properties.RawEventData.CorrelationId" => ""
            "properties.RawEventData.Operation" => ""
            "properties.RawEventData.DeviceDisplayName" => ""
            "properties.RawEventData.ListServerTemplate" => ""
            "properties.RawEventData.ListId" => ""
            "properties.RawEventData.ListItemUniqueId" => ""
            "properties.RawEventData.FileSizeBytes" => ""
            "properties.RawEventData.IsManagedDevice" => ""
            "properties.RawEventData.WebId" => ""
            "properties.RawEventData.ObjectId" => ""
            "properties.RawEventData.logName" => ""
            "properties.RawEventData.protoPayload.authenticationInfo.principalEmail" => ""
            "properties.RawEventData.protoPayload.requestMetadata.callerSuppliedUserAgent" => ""
            "properties.RawEventData.resource.labels.project_id" => ""
            "properties.RawEventData.protoPayload.serviceName" => ""
            "properties.RawEventData.protoPayload.methodName" => ""
            "properties.RawEventData.protoPayload.resourceName" => ""
            "dlp_param" => ""
            "inter_host" => ""
            "inter_ip" => ""
            "intermediary" => ""
            "product" => ""
            "version" => ""
            "security_result" => ""
            "event_type" => ""
            "event_name" => ""
            "start" => ""
            "end" => ""
            "rt" => ""
            "msg" => ""
            "suser" => ""
            "destinationServiceName" => ""
            "externalId" => ""
            "dvc" => ""
            "dvc_ip" => ""
            "requestClientApplication" => ""
            "c6a1" => ""
            "portalURL" => ""
            "targetObjects" => ""
            "et_sub" => ""
            "source_file" => ""
            "target_file" => ""
            "auth" => ""
            "file_name" => ""
            "user_display_name" => ""
            "run_command_task" => ""
            "unspecified_event" => ""
            "azure_op_event" => ""
            "security_result_action" => "ALLOW"
            "target_folder" => ""
            "src_folder" => ""
            "target_folder1" => ""
            "res_type" => ""
            "is_json" => "false"
            "additional" => ""
            "about" => ""
            "metadata.vendor_name" => "Microsoft"
            "metadata.product_name" => "Microsoft CASB"
            "metadata.event_type" => "GENERIC_EVENT"
            "uniqueServiceAppIds" => ""
            "has_principal_ip" => "false"
            "has_principal_user" => "false"
        }
    }

    # pattern to match each log message and setting variable values
    grok {
        match => {
            "message" => [
                "%{TIMESTAMP_ISO8601:ts_event} %{IPORHOST:inter_host} CEF:0\\|%{WORD:product}\\|%{WORD}\\|(?P<version>[^\|]+)\\|%{DATA:event_type}\\|(?P<event_name>[^\\|]+)\\|%{NUMBER}\\|%{GREEDYDATA:kv_data}",
                "(%{TIMESTAMP_ISO8601:ts_event}|%{SYSLOGTIMESTAMP:ts_event}) CEF:\\d+\\|%{WORD:product}\\|%{WORD}\\|(?P<version>[^\|]+)\\|%{DATA:event_type}\\|(?P<event_name>[^\\|]+)\\|%{NUMBER}\\|%{GREEDYDATA:kv_data}",
                "%{DATA:ts_event} CEF:\\d+\\|%{WORD:product}\\|%{WORD}\\|(?P<version>[^\|]+)\\|%{DATA:event_type}\\|(?P<event_name>[^\\|]+)\\|%{NUMBER}\\|%{GREEDYDATA:kv_data}"
            ]
        }
        overwrite => ["kv_data", "ts_event", "inter_host", "product", "version", "event_type", "event_name"]
        on_error => "grok_failure"
    }

    if [grok_failure] {
        json {
            source => "message"
            array_function => "split_columns"
            on_error => "not_json"
        }
        if ![not_json] {
            mutate {
                replace => {
                    "is_json" => "true"
                }
            }
        }
    }

    if [kv_data] != "" {
        # pre-processing input data before passing to kv filter
        mutate {
            gsub => [
                "kv_data", "cs[\\d]+Label=([\\w]+)", "\$1="
            ]
        }

        # pre-processing input data before passing to kv filter
        mutate {
            gsub => [
                "kv_data", " cs[\\d]+=", ""
            ]
        }

        # pre-processing input data before passing to kv filter
        mutate {
            gsub => [
                "kv_data", "( [\\w]+=)", "&&!\$1"
            ]
        }

        # applying kv filter to the processed input
        kv {
            source => "kv_data"
            field_split => "&&!"
            value_split => "="
        }
    }
    # pre-processing timestamp before passing to date filter
    mutate {
        gsub => [
            "ts_event", "Z", ""
        ]
    }

    # setting timestamp value extracted using kv filter
    if [start] != "" {
        mutate {
            replace => {
                "ts_event" => "%{start}"
            }
            on_error => "start_empty"
        }
    } else if [end] != "" {
        mutate {
            replace => {
                "ts_event" => "%{end}"
            }
            on_error => "end_empty"
        }
    } else if [rt] != "" {
        mutate {
            replace => {
                "ts_event" => "%{rt}"
            }
            on_error => "rt_empty"
        }
    } else if [time] != "" {
        mutate {
            replace => {
                "ts_event" => "%{time}"
            }
            on_error => "time_empty"
        }
    }

    # setting intermediary.hostname / ip value extracted using kv filter
    if [inter_host] != "" {
        mutate {
            replace => {
                "inter_ip" => "%{inter_host}"
            }

            convert => {
                "inter_host" => "ipaddress"
            }

            on_error => "not_inter_ip"
        }

        if [not_inter_ip] {
            mutate {
                replace => {
                    "intermediary.hostname" => "%{inter_host}"
                }
            }
        } else {
            mutate {
                merge => {
                    "intermediary.ip" => "inter_ip"
                }
            }
        }
    }

    # setting metadata.product value extracted using grok filter
    if [product] != "" {
        mutate {
            replace => {
                "metadata.product_name" => "%{product}"
            }
        }
    }

    # extracting user_display_name from targetObjects
    grok {
        match => {
            "targetObjects" => [
                ".*,(?P<user_display_name>.*)"
            ]
        }

        overwrite => [
            "user_display_name"
        ]
        on_error => "no_username"
    }

    # removes leading white spaces from user display name
    mutate {
        gsub => [
            "user_display_name", "^[ \t]+(.*)", "\$1"
        ]
    }

    # setting other values extracted using grok and kv filter
    mutate {
        replace => {
            "metadata.product_version" => "%{version}"
            "metadata.product_event_type" => "%{event_type}"
            "security_result.summary" => "%{event_name}"
            "security_result.description" => "%{msg}"
            "event.idm.read_only_udm.target.application" => "%{destinationServiceName}"
            "intermediary.url" => "%{portalURL}"
        }

        rename => {
            "externalId" => "metadata.product_log_id"
        }
    }
    if [suser] != "" {
        mutate {
            replace => {
                "event.idm.read_only_udm.principal.user.userid" => "%{suser}"
            }
            on_error => "suser_empty"
        }
        if ![suser_empty] {
            mutate {
                replace => {
                    "has_principal_user" => "true"
                }
            }
        }
    }

    if [msg] =~ "Parameters:" {

      grok {
        match => {
          "msg" => [
            "%{GREEDYDATA} DLP Policy (?P<dlp_param>[^,]+)(?:,%{GREEDYDATA}|)",
            "%{GREEDYDATA:dummy}"
          ]
        }
        overwrite => ["dlp_param"]
      }

      if [dlp_param] != "" {
        mutate {
          replace => {
            "security_result.rule_name" => "DLP Policy %{dlp_param}"
          }
        }
      }
    }

    if [user_display_name] != [suser] and [user_display_name] !~ "(^.*@.*$)" {
        mutate {
            replace => {
                "event.idm.read_only_udm.principal.user.user_display_name" => "%{user_display_name}"
            }
        }
    }

    if [suser] =~ "(^.*@.*$)" {
        mutate {
            merge => {
                "event.idm.read_only_udm.principal.user.email_addresses" => "suser"
            }
            on_error => "suser_email_empty"
        }
        if ![suser_email_empty] {
            mutate {
                replace => {
                    "has_principal_user" => "true"
                }
            }
        }
    }

    if [uniqueServiceAppIds] != "" {
        mutate {
            replace => {
                "event.idm.read_only_udm.target.resource.id" => "%{uniqueServiceAppIds}"
            }
            on_error => "uniqueServiceAppIds_empty"
        }
    }


    # setting network.http.user_agent after null check because this field might be empty
    if [requestClientApplication] != "" {
        mutate {
            replace => {
                "event.idm.read_only_udm.network.http.user_agent" => "%{requestClientApplication}"
            }
        }
    }

    # if could not extract IPv4, setting it to extracted IPv6 value
    if [dvc] == "" {
        mutate {
            replace => {
                "dvc" => "%{c6a1}"
            }
        }
    }

    # setting principal.hostname / ip after null check because this field might be empty
    if [dvc] != "" {
        mutate {
            replace => {
                "dvc_ip" => "%{dvc}"
            }

            convert => {
                "dvc" => "ipaddress"
            }

            on_error => "no_dvc_ip"
        }
        if [no_dvc_ip] {
            mutate {
                replace => {
                    "event.idm.read_only_udm.principal.hostname" => "%{dvc}"
                }
            }
        } else {
            mutate {
                merge => {
                    "event.idm.read_only_udm.principal.ip" => "dvc_ip"
                }
                on_error => "dvc_ip_empty"
            }
            if ![dvc_ip_empty] {
                mutate {
                    replace => {
                        "has_principal_ip" => "true"
                    }
                }
            }
        }
    }

    # extracting unique portion of event category to pass to netsed if-else loop
    grok {
        match =>{
            "event_type" => [
                "EVENT_CATEGORY_(?P<et_sub>[\\w]+)"
            ]
        }
        overwrite => [
            "et_sub"
        ]
        on_error => "no_et_sub"
    }

    # extracting source_file name and target_file name from targetObjects
    grok {
        match => {
            "targetObjects" => [
                "(?P<source_file>.*?),(?P<target_file>.*?),"
                "(?P<source_file>[^,]+)"
            ]
        }
        overwrite => [
            "target_file", "source_file"
        ]
        on_error => "no_target_object"
    }

    # security_result.about.application field is only set if both target_file and
    # source_file field is not null.
    if [source_file] != "" and
        [target_file] != "" {
        mutate {
            replace => {
                "security_result.about.application" => "%{targetObjects}"
            }
        }
    }

    # Get resource type from "et_sub"
    if [et_sub] =~ "(FILE|SHARING_POLICY_CHANGED|OWNER_PERMISSION)" {
        mutate {
            replace => {
                "res_type" => "File"
            }
        }
    }
    else if [et_sub] =~ "FOLDER" {
        mutate {
            replace => {
                "res_type" => "Folder"
            }
        }
    }
    else if [et_sub] =~ "(MAIL|IMPERSONATE)" {
        mutate {
            replace => {
                "res_type" => "Email"
            }
        }
    }
    else {
        mutate {
            replace => {
                "res_type" => "Email"
            }
        }
    }
    if [et_sub] != "" {
        # Setting event_type and mandatory properties based on et_sub and extracted
        # file names
        if [et_sub] =~ "(ADD_FILE|CREATE_FILE|CREATE_FOLDER|ADD_FOLDER)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_CREATION"
                    "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
        } else if [et_sub] =~ "(DELETE_FILE|TRASH_FILE|DELETE_FOLDER|TRASH_FOLDER|DELETE)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_DELETION"
                    "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
        } else if [et_sub] =~ "(MODIFY_FILE|MODIFY_FOLDER|MOVE_FOLDER|OWNER_PERMISSION|EDIT_FILE)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
                    "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
        } else if [et_sub] =~ "(RENAME_FILE|RENAME_FOLDER|RESTORE_FILE|COPY_FILE)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
                    "event.idm.read_only_udm.src.file.full_path" => "%{source_file}"
                    "event.idm.read_only_udm.target.file.full_path" => "%{target_file}"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
        } else if [et_sub] == "MOVE_FILE" {
            grok {
                match => {
                    "message" => "msg=%{GREEDYDATA:msg} suser="
                }
                overwrite => ["msg"]
            }
            grok {
                match => {
                    "msg" => [
                        "Move file: file (?P<file_name>.*?) folder %{GREEDYDATA:src_folder} to folder %{GREEDYDATA:target_folder1}",
                        "Move file: file (?P<file_name>.*?) folder %{GREEDYDATA}"
                    ]
                }
                overwrite => ["file_name" , "src_folder", "target_folder1"]
            }

            grok {
                match => {
                    "file_name" => [
                        "%{GREEDYDATA}/(?P<file_name>.*)",
                        "%{GREEDYDATA:file_name}"
                    ]
                }

                overwrite => [
                    "file_name"
                ]
            }

            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
            if [src_folder] != "" {
            mutate {
                    replace => {
                        "event.idm.read_only_udm.src.file.full_path" => "%{src_folder}/%{file_name}"
                    }
                }
            }
            else {
                mutate {
                    replace => {
                        "event.idm.read_only_udm.src.file.full_path" => "/%{file_name}"
                    }
                }
            }
            if [target_folder1] != "" {
            mutate {
                    replace => {
                        "event.idm.read_only_udm.target.file.full_path" => "%{target_folder1}/%{file_name}"
                    }
                }
            }
            else {
                mutate {
                    replace => {
                        "event.idm.read_only_udm.target.file.full_path" => "/%{file_name}"
                    }
                }
            }
        } else if [et_sub] =~ "(ACCESS_FILE|VIEW_FILE|PRINT_ASSET|AWS_IDENTITY_AND_ACCESS_MANAGEMENT)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_ACCESS"
                    "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
        } else if [et_sub] =~ "(SYNC_FILE_UPLOAD|DOWNLOAD_FILE|SYNC_FILE_DOWNLOAD|UPLOAD_FILE|UPLOAD)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
                    "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
        } else if [et_sub] =~ "(ADD_USER_TO_GROUP_IN_SITE|ADD_GROUP_MEMBER|REMOVE_GROUP_MEMBER|UPDATE_USER)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_CHANGE_PERMISSIONS"
                    "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                }
                rename => {
                    "event.idm.read_only_udm.principal.user" => "event.idm.read_only_udm.target.user"
                }
            }
        } else if [et_sub] =~ "(LOGIN|FAILED_LOGIN)" {
            mutate {
                replace => {
                    "result_action" => "ALLOW"
                    "event.idm.read_only_udm.target.application" => "%{source_file}"
                    "event.idm.read_only_udm.extensions.auth.type" => "SSO"    # Because Microsoft Cloud uses a Pass-Through Authentication
                                                                            # mechanism - which is very much similer to SSO
                }
                on_error => "no_source_file"
            }
                if [has_principal_user] == "true" || [has_principal_ip] == "true" {
                    mutate {
                        replace => {
                            "metadata.event_type" => "USER_LOGIN"
                        }
                    }
                    mutate {
                        rename => {
                            "event.idm.read_only_udm.principal.user" => "event.idm.read_only_udm.target.user"
                        }
                    }
            }

            if [event_name] == "Failed log on" {
                mutate {
                    replace => {
                        "result_action" => "BLOCK"
                    }
                }
            }

            mutate {
                merge => {
                    "security_result.action" => "result_action"
                }
            }
        } else if [et_sub] =~ "(SHARE_FILE|ACCEPT_SHARE_FILE|UNSHARE_FILE|SHARING_POLICY_CHANGED|SHARE)" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
                    "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
            }
        } else if [et_sub] in [ "CREATE_MAIL", "IMPERSONATE_CREATE"] {
            mutate {
                replace => {
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
                on_error => "no_res_type"
            }
            if [has_principal_user] == "true" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_CREATION"
                    }
                }
            }
        } else if [et_sub] in ["UPDATE_MAIL", "MOVE_MAIL"] {
            mutate {
                replace => {
                    "event.idm.read_only_udm.target.resource.type" => "%{res_type}"
                }
                on_error => "no_res_type_replace"
            }
            if [has_principal_user] == "true" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
                    }
                }
            }
        } else if [et_sub] == "RUN_COMMAND" {
        # Handling special product event category - RUN_COMMAND - event_type is mapped
        # based on msg field

            grok {
                match => {
                    "msg" => [
                        "Run command: task (?P<run_command_task>[^;]+)"
                        "Run command: (?P<run_command_task>[^;]+)"
                    ]
                }
                overwrite => [
                    "run_command_task"
                ]
            }

            mutate {
                replace => {
                    "security_result.summary" => "task %{run_command_task}"
                }
            }

            if [run_command_task] == "MipLabel" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
                        "event.idm.read_only_udm.target.resource.name" => "Privacy Label"
                    }
                }
            } else if [run_command_task] == "MailItemsAccessed" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_ACCESS"
                        "event.idm.read_only_udm.target.resource.type" => "MailItem"
                    }
                }
            }
        } else if [et_sub] == "UNSPECIFIED" {
        # Handling special product event category - UNSPECIFIED - event_type is mapped
        # based on msg field
            grok {
                match => {
                    "msg" => [
                        "(?P<unspecified_event>[^:]+)"
                    ]
                }

                overwrite => [
                    "unspecified_event"
                ]
            }

            mutate {
                replace => {
                    "security_result.summary" => "%{unspecified_event}"
                }
            }

            if [unspecified_event] == "Broke sharing inheritance" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
                        "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                        "event.idm.read_only_udm.target.resource.type" => "File/Folder"
                    }
                }
            } else if [unspecified_event] == "FileModifiedExtended" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_UPDATE_CONTENT"
                        "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                        "event.idm.read_only_udm.target.resource.type" => "File"
                    }
                }
            } else if [unspecified_event] == "FileAccessedExtended" or
                [unspecified_event] == "FilePreviewed" or
                [unspecified_event] == "PageViewed" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_ACCESS"
                        "event.idm.read_only_udm.target.file.full_path" => "%{source_file}"
                        "event.idm.read_only_udm.target.resource.type" => "File"
                    }
                }
            } else if [unspecified_event] == "SecureLinkUsed" {
                mutate {
                    replace => {
                        "metadata.event_type" => "NETWORK_HTTP"
                        "event.idm.read_only_udm.target.url" => "%{source_file}"
                    }
                }
            }
        } else if [et_sub] == "AZURE_OPERATION" {
        # Handling special product event category - AZURE_OPERATION - event_type is mapped
        # based on msg field
            grok {
                match => {
                    "msg" => [
                        "(?P<azure_op_event>[^:]+).* - %{WORD:azure_op_result}"
                    ]
                }

                overwrite => [
                    "azure_op_event"
                ]
            }

            grok {
                match => {
                    "targetObjects" => [
                        "(?P<dummy1>.*?),(?P<dummy2>.*?),(?P<target_folder>.*?),"
                    ]
