                replace => {
                    "activity_object_label.value.string_value" => "%{activityObject.Type}"
                }
                on_error => "activity_object_type_empty"
            }
            if ![activity_object_type_empty] {
                mutate {
                    replace => {
                        "activity_object_label.key" => "Activity object type %{index}"
                    }
                }
                mutate {
                    merge => {
                       "additional.fields" => "activity_object_label"
                    }
                    on_error => "activity_object_label_empty"
                }
            }

            mutate {
                replace => {
                    "activity_object_role_label.value.string_value" => "%{activityObject.Role}"
                }
                on_error => "activity_object_role_empty"
            }
            if ![activity_object_role_empty] {
                mutate {
                    replace => {
                        "activity_object_role_label.key" => "ActivityObject Role %{index}"
                    }
                }
                mutate {
                    merge => {
                       "additional.fields" => "activity_object_role_label"
                    }
                    on_error => "activity_object_role_label_empty"
                }
            }

            mutate {
                replace => {
                    "activity_object_name_label.value.string_value" => "%{activityObject.Name}"
                }
                on_error => "activity_object_name_empty"
            }
            if ![activity_object_name_empty] {
                mutate {
                    replace => {
                        "activity_object_name_label.key" => "ActivityObject Name %{index}"
                    }
                }
                mutate {
                    merge => {
                        "additional.fields" => "activity_object_name_label"
                    }
                    on_error => "activity_object_name_label_empty"
                }
            }

            mutate {
                replace => {
                    "activity_object_id_label.value.string_value" => "%{activityObject.Id}"
                }
                on_error => "activity_object_id_empty"
            }
            if ![activity_object_id_empty] {
                mutate {
                    replace => {
                        "activity_object_id_label.key" => "ActivityObject Id %{index}"
                    }
                }
                mutate {
                    merge => {
                        "additional.fields" => "activity_object_id_label"
                    }
                    on_error => "activity_object_id_label_empty"
                }
            }

            mutate {
                replace => {
                    "activity_object_ServiceObjectType_label.value.string_value" => "%{activityObject.ServiceObjectType}"
                }
                on_error => "activity_object_ServiceObjectType_empty"
            }
            if ![activity_object_ServiceObjectType_empty] {
                mutate {
                    replace => {
                        "activity_object_ServiceObjectType_label.key" => "ActivityObject ServiceObjectType %{index}"
                    }
                }
                mutate {
                    merge => {
                        "additional.fields" => "activity_object_ServiceObjectType_label"
                    }
                    on_error => "activity_object_ServiceObjectType_label_empty"
                }
            }
        }
        if [properties][RawEventData][HighPriorityMediaProcessing] != "" {
            mutate {
                convert => {
                    "properties.RawEventData.HighPriorityMediaProcessing" => "string"
                }
            }
            mutate {
                replace => {
                    "HighPriorityMediaProcessing_label.value" => "%{properties.RawEventData.HighPriorityMediaProcessing}"
                }
                on_error => "HighPriorityMediaProcessing_empty"
            }
            if ![HighPriorityMediaProcessing_empty] {
                mutate {
                    replace => {
                        "HighPriorityMediaProcessing_label.key" => "HighPriorityMediaProcessing"
                    }
                }
                mutate {
                    merge => {
                       "security_result.about.resource.attribute.labels" => "HighPriorityMediaProcessing_label"
                    }
                    on_error => "HighPriorityMediaProcessing_label_empty"
                }
            }
        }
        if [metadata][event_type] == "GENERIC_EVENT" {
            if [properties][IPAddress] != "" {
                mutate {
                    replace => {
                        "metadata.event_type" => "USER_RESOURCE_ACCESS"
                    }
                }
            }
        }

    }
    #Reset event_type when user id is not available, due to validation errors for USER_RESOURCE when principal.user not present
    if [metadata][event_type] =~ "USER_RESOURCE" and [suser] == "" and [properties][IPAddress] == "" {
        mutate {
            replace => {
                "metadata.event_type" => "GENERIC_EVENT"
            }
        }
    }

    # Setting metadata.description for GENERIC_EVENTs
    if [metadata][event_type] == "GENERIC_EVENT" {
        mutate {
            rename => {
                "security_result.description" => "metadata.description"
            }
        }
        if [suser] != "" and ([dvc] != "" or [dvc_ip] != "") {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_ACCESS"
                }
            }
        }
        else if [suser] != "" {
            mutate {
                replace => {
                    "metadata.event_type" => "USER_RESOURCE_ACCESS"
                }
            }
        }
        else if [dvc] != "" or [dvc_ip] != "" {
            mutate {
                replace => {
                    "metadata.event_type" => "STATUS_UPDATE"
                }
            }
        }
    }

    # merging security_result and intermediary fields.
    mutate {
        merge => {
            "event.idm.read_only_udm.intermediary" => "intermediary"
        }
    }
    if [security_result] != "" {
        mutate {
            merge => {
                "event.idm.read_only_udm.security_result" => "security_result"
            }
        }
    }
    mutate {
        rename => {
            "metadata" => "event.idm.read_only_udm.metadata"
        }
    }
    if [additional] != "" {
        mutate {
            rename => {
                "additional" => "event.idm.read_only_udm.additional"
            }
        }
    }
    # Parsing date
    date {
        match => [
            "ts_event", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSS", "UNIX_MS", "MMM dd yyyy HH:mm:ss"
        ]
        rebase => true
        on_error => "ts_event_not_present"
    }

    mutate {
        merge => {
            "@output" => "event"
        }
    }
}
