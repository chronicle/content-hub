# Product: Cisco AMP
# Category: AV / Endpoint
# Supported Format: JSON
# Reference: https://www.cisco.com/c/en_in/products/security/amp-for-endpoints/index.html
# Last Updated: 2025-10-06
# Copyright 2025 Google SecOps

filter {
  # Initialize values
  mutate {
    replace => {
      "file.parent.process_id" => ""
      "computer.user" => ""
      "file.identity.sha256" => ""
      "file.file_path" => ""
      "computer.hostname" => ""
      "severity" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "event_type_set" => "false"
      "event_type" => ""
      "event_type_id" => ""
      "detection_id" => ""
      "file.disposition" => ""
      "file.file_name" => ""
      "file.parent.disposition" => ""
      "file.parent.file_name" => ""
      "file.parent.identity.md5" => ""
      "file.parent.identity.sha1" => ""
      "file.parent.identity.sha256" => ""
      "error.error_code" => ""
      "error.description" => ""
      "file.identity.md5" => ""
      "file.identity.sha1" => ""
      "jsondata" => ""
      "has_target_file" => "false"
      "Time" => ""
      "host" => ""
      "process" => ""
      "instance_id" => ""
      "log_id" => ""
      "filename" => ""
      "filemime" => ""
      "file_extension" => ""
      "length" => ""
      "scanverdict" => ""
      "malwareverdict" => ""
      "spyname" => ""
      "sha256" => ""
      "from" => ""
      "uploadreason" => ""
      "verdict_str" => ""
      "is_slow" => ""
      "scans_flight" => ""
      "faster_connections" => ""
      "active_connections" => ""
      "security_result" => ""
      "length_file" => ""
      "ssl_bytes" => ""
      "socket_bytes" => ""
      "Compressed_sha256" => ""
      "analysis_action" => ""
      "analysis_score" => ""
      "analysis_status" => ""
      "category" => ""
      "file_name" => ""
      "file_type" => ""
      "upload_reason" => ""
      "verdict_from" => ""
      "verdict_num" => ""
      "kv_data" => ""
      "SourceModuleName" => ""
      "column61" => ""
      "column62" => ""
      "column63" => ""
      "column64" => ""
      "column65" => ""
      "column67" => ""
      "column68" => ""
      "has_user" => ""
      "column142" => ""
      "column175" => ""
      "column71" => ""
      "column176" => ""
      "column177" => ""
      "column180" => ""
      "column203" => ""
      "column206" => ""
      "column207" => ""
      "column208" => ""
      "column143" => ""
      "has_asset" => "false"
      "inter_host" => ""
      "intermediary" => ""
      "app" => ""
      "pid" => ""
      "SourceModuleType" => ""
      "EventReceivedTime" => ""
      "techniques_array" => ""
      "tactics_array" => ""
      "csv_msg" => ""
    }
  }

  # Pull fields out of raw log.
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }
  if [not_json] {
    grok {
      match => {
        "message" => [
         "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:Time}\\s+%{DATA:inter_host} - - - \\[%{DATA:app}@%{INT:pid} %{DATA:kv_data}\\]%{GREEDYDATA:csv_msg}",
         "<%{INT}>%{SYSLOGTIMESTAMP:Time}\\s+%{DATA:host}\\s+%{DATA:process}:\\s+%{DATA:severity}:\\s+%{DATA}\\[%{INT:instance_id}\\]\\s+%{DATA}\\[%{INT:log_id}\\]:\\s+%{DATA}\\[%{DATA:filename}\\]\\s+%{DATA}\\[%{DATA:filemime}\\]\\s+%{DATA}\\[%{DATA:file_extension}\\]\\s+%{DATA}\\[%{DATA:length}\\]\\s+%{DATA}\\]%{DATA}\\[%{INT:scanverdict}\\]\\s+%{DATA}\\[%{INT:malwareverdict}\\]\\s+%{DATA}\\[%{DATA:spyname}\\]%{DATA}\\[%{DATA:sha256}\\]\\s+%{DATA}\\[%{DATA:from}\\]\\s+%{DATA}\\[%{DATA:uploadreason}\\]\\s+%{DATA}\\[%{DATA:verdict_str}\\]\\s+%{DATA}\\[%{INT:is_slow}\\]\\s+%{DATA}\\[%{INT:scans_flight}\\]%{DATA}\\[%{INT:faster_connections}\\]%{DATA}\\[%{INT:active_connections}\\]",
         "<%{INT}>%{SYSLOGTIMESTAMP:Time}\\s+%{DATA:host}\\s+%{DATA:process}:\\s+%{DATA:severity}:\\s+%{DATA}%{TIME}\\s+%{DATA}\\[%{DATA:log_id}\\]:\\s+%{DATA:uploadreason}:\\s+%{INT:ssl_bytes}%{DATA}%{INT:socket_bytes}\\s+%{GREEDYDATA}",
         "<%{INT}>%{SYSLOGTIMESTAMP:Time}\\s+%{DATA:host}\\s+%{DATA:process}:\\s+%{DATA:severity}:\\s+%{DATA}%{TIME}\\s+%{DATA}\\[%{DATA:log_id}\\]:\\s+%{GREEDYDATA:uploadreason}",
         "<%{INT}>%{SYSLOGTIMESTAMP:Time} %{DATA:host} %{DATA:process}:  %{DATA:severity}:%{DATA}= %{DATA:Compressed_sha256}, Extracted File: %{GREEDYDATA:jsondata}",
         "<%{INT}>%{SYSLOGTIMESTAMP:Time} %{DATA:host} %{DATA:process}: %{DATA:severity}: %{GREEDYDATA}",
         "\\'%{GREEDYDATA:jsondata}\\'"
         ]
      }
      overwrite => ["Compressed_sha256","jsondata","Time", "host", "process", "severity", "instance_id", "log_id", "filename", "filemime", "file_extension", "length", "scanverdict", "malwareverdict", "spyname", "sha256", "from", "uploadreason", "verdict_str", "is_slow", "scans_flight", "faster_connections", "active_connections","ssl_bytes", "socket_bytes", "csv_msg", "kv_data", "inter_host", "app", "pid"]
      on_error => "grok_failed"
    }
    if [inter_host] != "" {
      mutate {
        replace => {
          "intermediary.hostname" => "%{inter_host}"
        }
        on_error => "inter_host_empty"
      }
    }
    if [app] != "" {
      mutate {
        replace => {
          "intermediary.application" => "%{app}"
        }
        on_error => "app_empty"
      }
    }
    if [pid] != "" {
      mutate {
        rename => {
          "pid" => "intermediary.process.pid"
        }
      }
    }
    kv {
      source => "kv_data"
      value_split => "="
      field_split => " "
      trim_value => '\"'
      on_error => "kv_failed"
    }
    csv {
      source => "csv_msg"
      on_error => "csv_failed"
    }
    if [SourceModuleName] != "" {
      mutate {
        replace => {
          "SourceModuleName_label.key" => "product_name"
          "SourceModuleName_label.value" => "%{SourceModuleName}"
        }
        on_error => "source_module_name_empty"
      }
      if ![source_module_name_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.observer.resource.attribute.labels" => "SourceModuleName_label"
          }
          on_error => "source_module_name_label_empty"
        }
      }
    }
    if [SourceModuleType] != "" {
      mutate {
        replace => {
          "SourceModuleType_label.key" => "product_type"
          "SourceModuleType_label.value" => "%{SourceModuleType}"
        }
        on_error => "source_module_type_empty"
      }
      if ![source_module_type_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.observer.resource.attribute.labels" => "SourceModuleType_label"
          }
          on_error => "source_module_type_label_empty"
        }
      }
    }
    if [column61] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.asset_id" => "Asset ID: %{column61}"
          "has_asset" => "true"
        }
        on_error => "column61_empty"
      }
    }
    if [column62] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "column62"
        }
        on_error => "column62_empty"
      }
      if ![column62_empty] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
    if [column63] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{column63}"
          "has_principal" => "true"
        }
        on_error => "column63_empty"
      }
    }
    if [column64] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.url" => "%{column64}"
        }
        on_error => "column64_empty"
      }
    }
    if [column65] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.group_identifiers" => "column65"
        }
        on_error => "column65_empty"
      }
    }
    if [column67] != "" {
      mutate {
        gsub => ["column67","'",'"']
      }
      mutate {
        replace => {
          "column67" => "{\"json_array\":[%{column67}]}"
        }
        on_error => "column67_json_empty"
      }
      json {
        source => "column67"
        array_function => "split_columns"
        on_error => "column67_json_error"
      }
      for index, i in json_array {
        mutate {
          remove_field => ["column67_ip_label", "column67_mac_label"]
        }
        mutate {
          convert => {
            "index" => "string"
          }
          on_error => "index_convert_error"
        }
        mutate {
          replace => {
            "column67_ip_label.value" => "%{i.ip}"
          }
          on_error => "column67_ip_empty"
        }
        if ![column67_ip_empty] {
          mutate {
            replace => {
              "column67_ip_label.key" => "ip_%{index}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.asset.attribute.labels" => "column67_ip_label"
            }
            on_error => "column67_ip_label_empty"
          }
        }
        mutate {
          replace => {
            "column67_mac_label.value" => "%{i.mac}"
          }
          on_error => "column67_mac_empty"
        }
        if ![column67_mac_empty] {
          mutate {
            replace => {
              "column67_mac_label.key" => "mac_%{index}"
            }
          }
          mutate {
            merge => {
              "event.idm.read_only_udm.principal.asset.attribute.labels" => "column67_mac_label"
            }
            on_error => "column67_mac_label_empty"
          }
        }
      }
    }
    if [column68] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{column68}"
          "has_user" => "true"
        }
      }
    }
    if [column142] != "" {
      mutate {
        replace => {
          "security_result.summary" => "%{column142}"
        }
        on_error => "column142_empty"
      }
    }
    if [column175] != "" {
      mutate {
        replace => {
          "security_result.description" => "%{column175}"
        }
        on_error => "column175_empty"
      }
    }
    if [column71] != "" {
      mutate {
        replace => {
          "security_result.threat_name" => "%{column71}"
        }
        on_error => "column71_empty"
      }
    }
    if [column176] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.file.names" => "column176"
        }
        on_error => "column176_empty"
      }
    }
    if [column177] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" => "%{column177}"
          "has_target_file" => "true"
        }
        on_error => "column177_empty"
      }
    }
    if [column180] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.sha256" => "%{column180}"
          "has_target_file" => "true"
        }
        on_error => "column180_empty"
      }
    }
    if [column203] != "" and [severity] == "" {
      mutate {
        replace => {
          "severity" => "%{column203}"
        }
        on_error => "column203_empty"
      }
    }
    if [column206] != "" {
      mutate {
        split => {
          source => "column206"
          separator => ", "
          target => "tactics_array"
          on_error => "column206_split_error"
        }
      }
      for tactic in tactics_array {
        mutate {
          replace => {
            "current_tactic" => ""
          }
        }
        mutate {
          replace => {
            "current_tactic.id" => "%{tactic}"
          }
          on_error => "tactic_replace_error"
        }
        if ![tactic_replace_error] {
          mutate {
            merge => {
              "security_result.attack_details.tactics" => "current_tactic"
            }
            on_error => "tactic_merge_error"
          }
        }
      }
    }
    if [column207] != "" {
      mutate {
        split => {
          source => "column207"
          separator => ", "
          target => "techniques_array"
          on_error => "column207_split_error"
        }
      }
      for technique in techniques_array {
        mutate {
          replace => {
            "current_technique" => ""
          }
        }
        mutate {
          replace => {
            "current_technique.id" => "%{technique}"
          }
          on_error => "technique_replace_error"
        }
        if ![technique_replace_error] {
          mutate {
            merge => {
              "security_result.attack_details.techniques" => "current_technique"
            }
            on_error => "technique_merge_error"
          }
        }
      }
    }
    if [column208] != "" {
      date {
        match => ["column208", "UNIX"]
        target => "security_result.first_discovered_time"
        on_error => "column208_empty"
      }
    }
    if [column143] != "" {
      date {
        match => ["column143", "UNIX"]
        target => "security_result.last_discovered_time"
        on_error => "column143_empty"
      }
    }
    if [EventReceivedTime] != "" {
      mutate {
        replace => {
          "EventReceivedTime_label.key" => "EventReceivedTime"
          "EventReceivedTime_label.value.string_value" => "%{EventReceivedTime}"
        }
        on_error => "EventReceivedTime_empty"
      }
      if ![EventReceivedTime_empty] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "EventReceivedTime_label"
          }
          on_error => "EventReceivedTime_label_empty"
        }
      }
    }
    mutate {
      gsub => ["jsondata","'",'"']
    }
    mutate {
      gsub => ["jsondata","False",'\"false\"']
    }
    mutate {
      gsub => ["jsondata","None",'\"None\"']
    }
    json {
      source => "jsondata"
      array_function => "split_columns"
      on_error => "not_a_json"
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{event_type}"
      }
      on_error => "type_empty"
    }
  }
  if [active_connections] != "" {
    mutate {
      replace => {
        "active_connections_label.key" => "Active Connections"
        "active_connections_label.value.string_value" => "%{active_connections}"
      }
      on_error => "active_connections_empty"
    }
    if ![active_connections_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "active_connections_label"
        }
        on_error => "active_connections_label_empty"
      }
    }
  }
  if [Time] != "" {
    date {
      match => ["Time", "MMM dd HH:mm:ss","MMM  d HH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      rebase => true
      on_error => "date_error"
    }
    if [date_error] {
      date {
        match => ["Time", "ISO8601", "RFC3339", "yyyy-MM-ddTHH:mm:ss.SSSSSSZZ"]
        target => "event.idm.read_only_udm.metadata.event_timestamp"
        on_error => "date_error2"
      }
    }
  }
  if [Compressed_sha256] != "" {
    mutate {
      replace => {
        "compressed_sha256_label.key" => "Compressed SHA256"
        "compressed_sha256_label.value.string_value" => "%{Compressed_sha256}"
      }
      on_error => "compressed_sha256_empty"
    }
    if ![compressed_sha256_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "compressed_sha256_label"
        }
        on_error => "compressed_sha256_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "analysis_action" => "string"
    }
    on_error => "analysis_action_convert_error"
  }
  if [analysis_action] != "" {
    mutate {
      replace => {
        "analysis_action_label.key" => "analysis_action"
        "analysis_action_label.value" => "%{analysis_action}"
      }
      on_error => "analysis_action_empty"
    }
    if ![analysis_action_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "analysis_action_label"
        }
        on_error => "analysis_action_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "analysis_score" => "string"
    }
    on_error => "analysis_score_convert_error"
  }
  if [analysis_score] != "" {
    mutate {
      replace => {
        "analysis_score_label.key" => "analysis_score"
        "analysis_score_label.value" => "%{analysis_score}"
      }
      on_error => "analysis_score_empty"
    }
    if ![analysis_score_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "analysis_score_label"
        }
        on_error => "analysis_score_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "analysis_status" => "string"
    }
    on_error => "analysis_status_convert_error"
  }
  if [analysis_status] != "" {
    mutate {
      replace => {
        "analysis_status_label.key" => "analysis_status"
        "analysis_status_label.value" => "%{analysis_status}"
      }
      on_error => "analysis_status_empty"
    }
    if ![analysis_status_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "analysis_status_label"
        }
        on_error => "analysis_status_label_empty"
      }
    }
  }
  mutate {
    convert => {
      "verdict_num" => "string"
    }
    on_error => "verdict_num_convert_error"
  }
  if [verdict_num] != "" {
    mutate {
      replace => {
        "verdict_num_label.key" => "verdict_num"
        "verdict_num_label.value" => "%{verdict_num}"
      }
      on_error => "verdict_num_empty"
    }
    if ![verdict_num_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "verdict_num_label"
        }
        on_error => "verdict_num_label_empty"
      }
    }
  }
  if [verdict_from] != "" {
    mutate {
      replace => {
        "verdict_from_label.key" => "verdict_from"
        "verdict_from_label.value" => "%{verdict_from}"
      }
      on_error => "verdict_from_empty"
    }
    if ![verdict_from_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "verdict_from_label"
        }
        on_error => "verdict_from_label_empty"
      }
    }
  }
  if [category] != "" {
    mutate {
      merge => {
        "security_result.category_details" => "category"
      }
      on_error => "category_empty"
    }
  }
  if [file_name] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.file.names" => "file_name"
      }
      on_error => "file_name_empty"
    }
  }
  if [file_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.mime_type" => "%{file_type}"
      }
      on_error => "file_type_empty"
    }
  }
  if [upload_reason] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{upload_reason}"
      }
      on_error => "upload_reason_empty"
    }
  }
  if [file_extension] not in ["", "NULL", "null", "None"] {
    mutate {
      replace => {
        "file_extension_label.key" => "File Extension"
        "file_extension_label.value" => "%{file_extension}"
      }
      on_error => "file_extension_empty"
    }
    if ![file_extension_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "file_extension_label"
        }
        on_error => "file_extension_label_empty"
      }
    }
  }
  if [filemime] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.mime_type" => "%{filemime}"
      }
      on_error => "filemime_empty"
    }
  }
  if [filename] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{filename}"
      }
      on_error => "filename_empty"
    }
  }
  if [from] != "" {
    mutate {
      replace => {
        "from_label.key" => "From"
        "from_label.value.string_value" => "%{from}"
      }
      on_error => "from_empty"
    }
    if ![from_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "from_label"
        }
        on_error => "from_label_empty"
      }
    }
  }
  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{host}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
      }
      on_error => "host_empty"
    }
    if ![host_empty] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [instance_id] != "" {
    mutate {
      replace => {
        "instance_id_label.key" => "Instance ID"
        "instance_id_label.value.string_value" => "%{instance_id}"
      }
      on_error => "instance_id_empty"
    }
    if ![instance_id_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "instance_id_label"
        }
        on_error => "instance_id_label_empty"
      }
    }
  }
  if [is_slow] != "" {
    mutate {
      replace => {
        "is_slow_label.key" => "Is Slow"
        "is_slow_label.value.string_value" => "%{is_slow}"
      }
      on_error => "is_slow_empty"
    }
    if ![is_slow_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "is_slow_label"
        }
        on_error => "is_slow_label_empty"
      }
    }
  }
  if [length] != "" {
    grok {
      match => {
        "length" => [
          "%{INT:length_file}%{GREEDYDATA}"
        ]
      }
      overwrite => ["length_file"]
      on_error => "length_file_empty"
    }
  }
  if [length_file] != "" {
    mutate {
      replace => {
        "length_file_label.key" => "Length File"
        "length_file_label.value" => "%{length_file}"
      }
      on_error => "length_file_empty"
    }
    if ![length_file_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "length_file_label"
        }
        on_error => "length_file_label_empty"
      }
    }
  }
  if [malwareverdict] != "" {
    mutate {
      replace => {
        "malwareverdict_label.key" => "Malware Verdict"
        "malwareverdict_label.value.string_value" => "%{malwareverdict}"
      }
      on_error => "malwareverdict_empty"
    }
    if ![malwareverdict_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "malwareverdict_label"
        }
        on_error => "malwareverdict_label_empty"
      }
    }
  }
  if [sha256] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{sha256}"
      }
      on_error => "sha256_empty"
    }
  }
  if [uploadreason] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{uploadreason}"
      }
      on_error => "uploadreason_empty"
    }
  }
  if [log_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{log_id}"
      }
      on_error => "log_id_empty"
    }
  }
  if [verdict_str] != "" {
    mutate {
      replace => {
        "verdict_str_label.key" => "Verdict String"
        "verdict_str_label.value.string_value" => "%{verdict_str}"
      }
      on_error => "verdict_str_empty"
    }
    if ![verdict_str_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "verdict_str_label"
        }
        on_error => "verdict_str_label_empty"
      }
    }
  }
  if [ssl_bytes] != "" {
    mutate {
      convert => {
        "ssl_bytes" => "uinteger"
      }
      on_error => "ssl_bytes_error"
    }
    mutate {
      rename => {
        "ssl_bytes" => "event.idm.read_only_udm.network.sent_bytes"
      }
    }
  }
  if [socket_bytes] != "" {
    mutate {
      convert => {
        "socket_bytes" => "uinteger"
      }
      on_error => "socket_bytes_error"
    }
    mutate {
      rename => {
        "socket_bytes" => "event.idm.read_only_udm.network.received_bytes"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "no_security_result"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "no_intermediary"
    }
  }

  # For new logs the JSON parent structure coming as child, in order to extract
  # parent element added the loop i.e. computer data coming as one level below
  grok {
    match => {
      "message" => "\"data\":\\[%{GREEDYDATA:computer_data}\\]"
    }
    on_error => "grok_failed1"
  }
  if ![grok_failed1] {
    json {
      source => "computer_data"
      array_function => "split_columns"
      on_error => "not_a_json"
    }
  }

  mutate {
    overwrite => ["file.parent.process_id", "computer.user", "file.identity.sha256", "file.file_path", "computer.hostname", "severity"]
  }
  date {
    match => ["date", "RFC3339" ]
    on_error => "date_match_failed"
  }

  if [event_type_id] != "" {
    mutate {
      convert => {
        "event_type_id" => "string"
      }
      on_error => "is_string"
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" => "%{event_type_id}"
      }
      on_error => "type_id_empty"
    }
  }
  if [detection_id] != "" {
    mutate {
      convert => {
        "detection_id" => "string"
      }
      on_error => "is_string"
    }
    mutate {
      replace => {
        "detection_ID_label.key" => "Detection ID"
        "detection_ID_label.value" => "%{detection_id}"
      }
      on_error => "detection_id_empty"
    }
    if ![detection_id_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "detection_ID_label"
        }
        on_error => "detection_label_empty"
      }
    }
  }
  if [file][disposition] != "" {
    mutate {
      replace => {
        "security_result.description" => "%{file.disposition}"
      }
      on_error => "disposition_empty"
    }
  }
  if [file][file_name] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.target.file.names" => "file.file_name"
      }
      on_error => "file_name_empty"
    }
    if ![file_name_empty] {
      mutate {
        replace => {
          "has_target_file" => "true"
        }
      }
    }
  }
  if [file][parent][disposition] != "" {
    mutate {
      replace => {
        "parent_disposition_label.key" => "Parent Disposition"
        "parent_disposition_label.value" => "%{file.parent.disposition}"
      }
      on_error => "parent_disposition_empty"
    }
    if ![parent_disposition_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "parent_disposition_label"
        }
        on_error => "parent_disposition_label_empty"
      }
    }
  }
  if [file][parent][file_name] != "" {
    mutate {
      replace => {
        "parent_file_name_label.key" => "Parent File Name"
        "parent_file_name_label.value" => "%{file.parent.file_name}"
      }
      on_error => "parent_file_name_empty"
    }
    if ![parent_file_name_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "parent_file_name_label"
        }
        on_error => "parent_file_name_label_empty"
      }
    }
  }
  if [file][parent][identity][md5] != "" {
    mutate {
      replace => {
        "parent_md5_label.key" => "Parent MD5"
        "parent_md5_label.value" => "%{file.parent.identity.md5}"
      }
      on_error => "parent_md5_empty"
    }
    if ![parent_md5_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "parent_md5_label"
        }
        on_error => "parent_md5_label_empty"
      }
    }
  }
  if [file][parent][identity][sha1] != "" {
    mutate {
      replace => {
        "parent_sha1_label.key" => "Parent SHA1"
        "parent_sha1_label.value" => "%{file.parent.identity.sha1}"
      }
      on_error => "parent_sha1_empty"
    }
    if ![parent_sha1_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "parent_sha1_label"
        }
        on_error => "parent_sha1_label_empty"
      }
    }
  }
  if [file][parent][identity][sha256] != "" {
    mutate {
      replace => {
        "parent_sha256_label.key" => "Parent SHA256"
        "parent_sha256_label.value" => "%{file.parent.identity.sha256}"
      }
      on_error => "parent_sha256_empty"
    }
    if ![parent_sha256_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "parent_sha256_label"
        }
        on_error => "parent_sha256_label_empty"
      }
    }
  }
  if [error][error_code] != "" {
    mutate {
      replace => {
        "error_code_label.key" => "Error Code"
        "error_code_label.value" => "%{error.error_code}"
      }
      on_error => "error_code_empty"
    }
    if ![error_code_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "error_code_label"
        }
        on_error => "error_code_label_empty"
      }
    }
  }
  if [error][description] != "" {
    mutate {
      replace => {
        "error_description_label.key" => "Error Description"
        "error_description_label.value" => "%{error.description}"
      }
      on_error => "error_description_empty"
    }
    if ![error_description_empty] {
      mutate {
        merge => {
          "security_result.detection_fields" => "error_description_label"
        }
        on_error => "error_description_label_empty"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "CISCO_AMP"
      "event.idm.read_only_udm.metadata.product_name" => "AMP"
    }
  }


  # Parent Process
  if [file][parent][process_id] != "" {
    mutate {
      convert => {
        "file.parent.process_id" => "string"
      }
      on_error => "is_string"
    }
    mutate {
      rename => {
        "file.parent.process_id" => "security_result.about.process.parent_process.pid"
      }
      replace => {
        "event.idm.read_only_udm.target.process.parent_process.pid" => "%{security_result.about.process.parent_process.pid}"
      }
    }
  }
  # User Name
  if [computer][user] != "" {
    mutate {
      rename => {
        "computer.user" => "security_result.about.user.user_display_name"
      }
      replace => {
        "event.idm.read_only_udm.target.user.user_display_name" => "%{security_result.about.user.user_display_name}"
      }
    }
  }
  # Hash value
  if [file][identity][sha256] =~ "^[0-9a-f]+$" {
    mutate {
      rename => {
        "file.identity.sha256" => "security_result.about.file.sha256"
      }
      replace => {
        "event.idm.read_only_udm.target.file.sha256" => "%{security_result.about.file.sha256}"
        "has_target_file" => "true"
      }
      on_error => "sha256_error"
    }
  }
  if [file][identity][md5] != "" {
    mutate {
      rename => {
        "file.identity.md5" => "security_result.about.file.md5"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.md5" => "%{security_result.about.file.md5}"
        "has_target_file" => "true"
      }
      on_error => "md5_error"
    }
  }
  if [file][identity][sha1] != "" {
    mutate {
      rename => {
        "file.identity.sha1" => "security_result.about.file.sha1"
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.sha1" => "%{security_result.about.file.sha1}"
        "has_target_file" => "true"
      }
      on_error => "sha1_error"
    }
  }

  # File Path
  if [file][file_path] != "" {
    mutate {
      rename => {
        "file.file_path" => "security_result.about.file.full_path"
      }
      replace => {
        "event.idm.read_only_udm.target.file.full_path" => "%{security_result.about.file.full_path}"
        "has_target_file" => "true"
      }
      on_error => "file_path_error"
    }
  }
  # Hostname
  if [computer][hostname] != "" {
    mutate {
      rename => {
        "computer.hostname" => "security_result.about.hostname"
      }
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{security_result.about.hostname}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{security_result.about.hostname}"
        "has_target" => "true"
      }
    }
  }

  # Assign Severity Value
  if [severity] == "Medium" {
    mutate {
      replace => {
          "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] == "High" or [severity] == "Critical" {
    mutate {
      replace => {
        "security_result.severity" => "HIGH"
      }
    }
  }
  else if [severity] == "Low" {
    mutate {
      replace => {
        "security_result.severity" => "LOW"
      }
    }
  }
  else if [severity] == "Info" {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
      on_error => "severity_empty"
    }
  }
  else {
    mutate {
      replace => {
        "security_result.severity" => "UNKNOWN_SEVERITY"
      }
    }
  }
  # Security Result Details
  mutate {
    rename => {
      "detection" => "security_result.threat_name"
    }
    replace => {
      "category_details" => "%{event_type}"
    }
  }
  # Merge Event Values
  for idx, obj in computer.network_addresses {
    if [obj][ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "obj.ip"
          "event.idm.read_only_udm.principal.asset.ip" => "obj.ip"
          "security_result.about.ip" => "obj.ip"
        }
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    if [obj][mac] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.mac" => "obj.mac"
          "security_result.about.mac" => "obj.mac"
        }
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    if [idx] == 0 {
      mutate {
        merge => {
          "event.idm.read_only_udm.security_result" => "security_result"
        }
      }
    }
  }

  for vul in vulnerabilities {
    mutate {
      remove_field => ["vulns"]
    }

    mutate {
      replace => {
        "vulns.cve_id" => "%{vul.cve}"
        "vulns.vendor_knowledge_base_article_id" => "%{vul.url}"
      }
    }

    mutate {
      replace => {
        "vulns.cvss_base_score" => "%{vul.score}"
      }
      on_error => "no_vul_score"
    }

    mutate {
      convert => {
        "vulns.cvss_base_score" => "float"
      }
    }
    mutate {
      replace => {
        "vulns.cvss_version" => "%{vul.version}"
      }
      on_error => "no_vul_version"
    }

    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.vulns.vulnerabilities" => "vulns"
      }
    }
  }
  # Determine Event Category
  if [event_type] in [ "Executed malware", "Threat Detected", "Potential Dropper Infection", "Cloud Recall Detection", "Malicious Activity Detection", "Exploit Prevention", "Multiple Infected Files", "Cloud IOC", "System Process Protection", "Vulnerable Application Detected", "Threat Quarantined", "Execution Blocked", "Cloud Recall Quarantine Successful", "Cloud Recall Restore from Quarantine Failed", "Cloud Recall Quarantine Attempt Failed", "Quarantine Failure" ] and [has_target_file] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "SCAN_FILE"
        "event_type_set" => "true"
      }
    }
  }
  if [event_type_set] == "false" {
    if [has_principal] == "true" and [has_target] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "SCAN_UNCATEGORIZED"
          "event_type_set" => "true"
        }
      }
    }
    else if [has_user] == "true" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
          "event_type_set" => "true"
        }
      }
    }
    else if [has_principal] == "true" and [has_asset] == "false" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
          "event_type_set" => "true"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
          "event_type_set" => "true"
        }
      }
    }
  }
  # Determine if an alert is generated or not
  if [event_type] in [ "Threat Detected", "Exploit Prevention", "Executed malware", "Potential Dropper Infection", "Multiple Infected Files", "Vulnerable Application Detected"] or ["security_result.severity"] == "HIGH" {
    mutate {
      replace => {
        # Set security result summary and is_alert fields that are needed for generation of an Alert Event
        "security_result.summary" => "%{event_type}"
      }
    }
  }
  # Output final event
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
