# Product: RADWARE_ALTEON
# Category: Load Balancer
# Supported Format: SYSLOG
# Reference: NA
# Last Updated: 2024-06-21
# Copyright 2024 Chronicle LLC

filter {
  mutate {
    replace => {
      "security_result" => ""
      "metadata" => ""
      "principal" => ""
      "additional" => ""
      "has_principal" => "false"
      "has_user" => "false"
      "has_target" => "false"
      "target" => ""
      "network" => ""
      "extensions" => ""
      "user_id" => ""
      "principal_application" => ""
      "src_ip" => ""
      "description" => ""
      "product_event_type" => ""
      "severity" => ""
      "timestamp" => ""
      "dst_ip" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  mutate {
    gsub => ["message","\\r",""]
  }
  mutate {
    gsub => ["message","\\n",""]
  }


  grok {
    match => {
      "message" => ["<%{INT}>%{TIMESTAMP_ISO8601:timestamp}\\s+%{DATA}\\s+%{WORD:severity}\\s+%{DATA}\\s+<%{DATA:product_event_type}>:\\s+%{GREEDYDATA:description}"]
    }
    overwrite => ["timestamp", "severity", "description", "product_event_type"]
    on_error => "grok_error"
  }

  if [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601","RFC3339"]
      target => "metadata.event_timestamp"
      on_error => "date_error"
    }
  }

  if [severity] in ["NOTICE","INFO"] {
    mutate {
      replace => {
        "security_result.severity" => "INFORMATIONAL"
      }
    }
  }
  else if [severity] == "WARNING" {
    mutate {
      replace => {
        "security_result.severity" => "MEDIUM"
      }
    }
  }
  else if [severity] == "ERROR" {
    mutate {
      replace => {
        "security_result.severity" => "ERROR"
      }
    }
  }
  else if [severity] == "CRITICAL" {
    mutate {
      replace => {
        "security_result.severity" => "CRITICAL"
      }
    }
  }
  else {
    mutate {
      replace => {
        "security_result.severity_details" => "%{severity}"
      }
      on_error => "severity_error"
    }
  }

  if [product_event_type] != "" {
    mutate {
      replace => {
        "metadata.product_event_type" => "%{product_event_type}"
      }
      on_error => "product_event_type_error"
    }
  }
  if [description] != "" {
    grok {
      match => {
        "description" => [
          "%{DATA:user_id}(\\(%{DATA}\\))? %{DATA} from host %{IP:src_ip} via %{GREEDYDATA:principal_application}",
          "%{DATA:principal_application} user %{DATA:user_id}\\(%{DATA}\\) %{DATA}from  %{DATA}%{IP:src_ip} %{DATA} to %{DATA}%{IP:dst_ip}%{GREEDYDATA}",
          "%{DATA} via %{DATA:principal_application} from host %{IP:src_ip}",
          "%{DATA} by %{DATA:user_id} from %{DATA:principal_application}:%{IP:src_ip}",
          "%{DATA:user_id} %{DATA} from %{GREEDYDATA:principal_application}",
          "%{DATA:principal_application} user %{DATA:user_id}\\(%{DATA}\\)(%{DATA}to%{DATA}%{IP:dst_ip})?%{GREEDYDATA}"
          "%{DATA}to(%{DATA})?%{IP:dst_ip}"]
      }
      overwrite => ["principal_application","src_ip","user_id","dst_ip"]
      on_error => "description_error"
    }
    mutate {
      replace => {
        "metadata.description" => "%{description}"
      }
      on_error => "description_error"
    }
  }
  if [dst_ip] != "" {
    mutate {
      merge => {
        "target.ip" => "dst_ip"
        "target.asset.ip" => "dst_ip"
      }
      on_error => "target_ip_error"
    }
    if ![target_ip_error] {
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [user_id] != "" {
    mutate {
      replace => {
        "target.user.userid" => "%{user_id}"
        "has_user" => "true"
      }
      on_error => "user_id_error"
    }
  }

  if [principal_application] != "" {
    mutate {
      replace => {
        "principal.application" => "%{principal_application}"
      }
      on_error => "principal_application_error"
    }
  }
  if [src_ip] != "" {
    mutate {
      merge => {
        "principal.ip" => "src_ip"
        "principal.asset.ip" => "src_ip"
      }
      on_error => "principal_ip_error"
    }
    if ![principal_ip_error] {
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
  }
  if [has_principal] == "true" and [has_user] == "true" and [description] =~ "(?i)login" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGIN"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }
  else if [has_principal] == "true" and [has_user] == "true" and [description] =~ "(?i)logout" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_LOGOUT"
        "extensions.auth.type" => "AUTHTYPE_UNSPECIFIED"
      }
    }
  }

  else if [has_principal] == "true" and [description] =~ "(?i)failed login" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else {
    mutate {
      replace => {
        "metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  if [principal] != "" {
    mutate {
      rename => {
        "principal" => "event.idm.read_only_udm.principal"
      }
    }
  }

  if [target] != "" {
    mutate {
      rename => {
        "target" => "event.idm.read_only_udm.target"
      }
    }
  }

  if [network] != "" {
    mutate {
      rename => {
        "network" => "event.idm.read_only_udm.network"
      }
    }
  }

  if [metadata] != "" {
    mutate {
      rename => {
        "metadata" => "event.idm.read_only_udm.metadata"
      }
    }
  }

  if [additional] != "" {
    mutate {
      rename => {
        "additional" => "event.idm.read_only_udm.additional"
      }
    }
  }
  if [extensions] != "" {
    mutate {
      rename => {
        "extensions" => "event.idm.read_only_udm.extensions"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
      on_error => "sec_result_error"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
