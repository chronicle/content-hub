# Product: CISCO WSA
# Category: WSA
# Supported Format: SYSLOG, SYSLOG+CSV, JSON
# Reference: N/A
# Last Updated: 2026-03-12
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "proto" => ""
      "tgtport" => ""
      "username" => ""
      "action" => ""
      "when" => ""
      "url" => ""
      "tgtip" => ""
      "tgthost" => ""
      "returnCode" => ""
      "size" => ""
      "app_proto" => ""
      "method" => ""
      "srcip" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_network" => "false"
      "bytes_sent" => ""
      "total_bytes" => ""
      "request_size" => ""
      "response_size" => ""
      "referer_url" => ""
      "wsa_hostname" => ""
      "description" => ""
      "intermediary" => ""
      "cmf" => ""
      "dcf" => ""
      "err" => ""
      "case_name" => ""
      "transaction_disposition" => ""
      "mime_type" => ""
      "session_id" => ""
      "time" => ""
      "severity" => ""
      "auth_protocol" => ""
      "auth_status_code" => ""
      "auth_mechanism" => ""
      "process_id" => ""
      "domain" => ""
      "auth_module" => ""
      "auth_error_component" => ""
      "auth_error_module" => ""
      "auth_error_description" => ""
      "auth_error_details" => ""
      "auth_status" => ""
      "remaining_message" => ""
      "threat_confidence" => ""
      "threat_attempts" => ""
      "user_agent" => ""
      "latency" => ""
      "tx_wait_times_raw" => ""
      "first_server_byte" => ""
      "first_client_byte" => ""
      "response_header" => ""
      "client_body" => ""
      "first_response_byte" => ""
      "server_response" => ""
      "sec_summary" => ""
      "target_kerberos_realm" => ""
      "kerberos_kvno" => ""
      "kerberos_keytab" => ""
      "kerberos_enctype" => ""
      "tar_region" => ""
      "tar_state" => ""
      "tar_city" => ""
      "server_cert_organization" => ""
      "proxy_session_id" => ""
      "interaction_mode" => ""
      "srcport" => ""
      "logtime" => ""
      "policy" => ""
      "category" => ""
      "has_user" => "false"
      "appname" => ""
      "facility" => ""
      "severity_details" => ""
      "priority" => ""
      "ser_url" => ""
      "ser_msg" => ""
      "ser_data" => ""
      "policy_details" => ""
      "app_description" => ""
      "information" => ""
      "hostname" => ""
      "sha_value" => ""
    }
  }
  mutate {
    gsub => ["message","\\r\\n",""]
  }
  mutate {
    gsub => ["message","\\n",""]
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_json"
  }

  grok {
    match => {
      "message" => [
        '<%{INT}>%{SYSLOGTIMESTAMP} %{IPORHOST:wsa_hostname} %{DATA:description}: %{DATA}: %{NUMBER:when}\\s+%{INT:session_id}\\s%{SYSLOGHOST:srcip} %{DATA:action}\\/%{NUMBER:returnCode} %{NUMBER} %{WORD:method} (?P<url>\\S+) (?P<username>.*?) %{WORD:transaction_disposition}\\/(?P<tgtip>\\S+)\\s+(?P<mime_type>\\S+) CMF:%{INT:cmf} DCF:%{INT:dcf} ERR:%{INT:err} %{DATA:case_name} <%{GREEDYDATA:csv_data}> (-|%{DATA}) (%{INT}|-) (%{INT:bytes_sent}|-) (%{INT:total_bytes}|-) (%{INT:request_size}|-) (%{INT:response_size}|-) (\\"%{URI:referer_url}\\"|-)$',
        '<%{INT}>%{SYSLOGTIMESTAMP} %{IPORHOST:wsa_hostname} %{DATA:description}: %{DATA}: %{NUMBER:when}\\s+%{INT:session_id}\\s%{SYSLOGHOST:srcip} %{DATA:action}\\/%{NUMBER:returnCode} %{NUMBER} %{WORD:method} (?P<url>\\S+) (?P<username>.*?) %{WORD:transaction_disposition}\\/(?P<tgtip>\\S+)\\s+(?P<mime_type>\\S+).*<%{GREEDYDATA:csv_data}> (-|%{DATA}) (%{INT}|-) %{INT:bytes_sent} (%{INT:total_bytes}|-) (%{INT:request_size}|-) (%{INT:response_size}|-) (\\"%{URI:referer_url}\\"|-)$',
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{IPORHOST:wsa_hostname} %{DATA:description}: %{DATA:severity}: %{NUMBER:when}\\s+%{INT:session_id}\\s%{SYSLOGHOST:srcip} %{DATA:action}\\/%{NUMBER:returnCode} %{NUMBER} %{WORD:method} %{DATA:url} %{DATA:username} %{WORD:transaction_disposition}\\/%{DATA:tgtip}\\s+%{DATA:mime_type} %{DATA:case_name} <%{GREEDYDATA:csv_data}>\\s+%{GREEDYDATA:remaining_message}",
        '<%{INT}>%{SYSLOGTIMESTAMP:time} %{IPORHOST:wsa_hostname} %{NOTSPACE:description}: %{WORD:severity}: \\\"%{DATA:logtime}\\\" {INT:session_id} - - %{IP:srcip} %{INT:srcport} \\\"%{GREEDYDATA:user_agent}\\\" - %{INT:tgtport} %{WORD:method} %{URI:url} %{WORD:action} %{INT:returnCode} %{NOTSPACE:ser_msg} - - \\\"%{GREEDYDATA:ser_url}\\\" %{GREEDYDATA}',
        '<%{INT}>%{SYSLOGTIMESTAMP:time} %{IPORHOST:wsa_hostname} %{DATA:description}: %{WORD:severity}: \"%{DATA:logtime}\" %{INT:session_id} - - %{IP:srcip} %{INT:srcport} (?:-|\"(?P<user_agent>.*?)\") (%{IP:tgtip}|-) %{INT:tgtport} %{DATA:method} %{DATA:url} %{WORD:action} %{INT:returnCode} %{DATA:transaction_disposition} - %{DATA:policy} \"(?P<category>.*?)\"',
        "%{NUMBER:when}\\s+\\d+\\s%{SYSLOGHOST:srcip} %{WORD:action}\\/%{NUMBER:returnCode} %{NUMBER:size} %{WORD:method} (?P<url>\\S+) (?P<username>.*?) %{WORD}\\/(?P<tgtip>\\S+).*<%{GREEDYDATA:csv_data}>.*",
        "<%{INT}>%{SYSLOGTIMESTAMP} %{IPORHOST:wsa_hostname} %{DATA:description}: %{DATA}: %{NUMBER:when} %{INT} %{IP:srcip} %{WORD:action}/%{INT:returnCode} %{INT:response_size} %{WORD:method} %{URI:url}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:wsa_hostname} %{WORD:description}: %{WORD:severity}: %{WORD:auth_module} : %{INT:session_id} : %{GREEDYDATA:remaining_message}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:wsa_hostname} %{WORD:description}: %{WORD:severity}: %{WORD:app_proto} : %{DATA} : %{GREEDYDATA:remaining_message}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:wsa_hostname} %{WORD:description}: %{WORD:severity}: %{WORD:auth_module}: %{DATA}, Interaction mode: %{DATA:interaction_mode}, User: %{DATA:username}, Dest IP: %{IP:tgtip}:%{INT:tgtport}, %{GREEDYDATA:sec_summary}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:wsa_hostname} %{WORD:description}: %{WORD:severity}: %{GREEDYDATA:sec_summary}",
        "<%{INT}>%{SYSLOGTIMESTAMP:time} %{NOTSPACE:wsa_hostname} %{WORD:description}: %{WORD:severity}: %{DATA}: %{GREEDYDATA:sec_summary}",
        '%{WORD:severity}: \\"%{DATA:logtime}\\" %{INT:session_id} - - %{IP:srcip} %{INT:srcport} \\"%{DATA:user_agent}\\" %{IP:tgtip} %{INT:tgtport} %{WORD:method} %{URI:url} %{WORD:action} %{INT:returnCode} %{GREEDYDATA:transaction_disposition} .*',
        '<%{INT}>%{SYSLOGTIMESTAMP} %{IPORHOST:wsa_hostname} %{DATA:description}: %{DATA}: %{NUMBER:when}\\s+%{INT:session_id}\\s%{SYSLOGHOST:srcip} %{DATA:action}\\/%{NUMBER:returnCode} %{NUMBER} %{WORD:method} (?P<url>\\S+) (?P<username>.*?) %{WORD:transaction_disposition}\\/(?P<tgtip>\\S+)\\s+(?P<mime_type>\\S+).*<%{GREEDYDATA:csv_data}> (-|%{DATA}) (%{INT}|-) %{INT:bytes_sent} (%{INT:total_bytes}|-) (%{INT:request_size}|-) (%{INT:response_size}|-) (\\"%{URI:referer_url}\\"|-)$',
        '%{WORD:severity}: \\"%{DATA:logtime}\\" %{INT:session_id} \\"%{DATA:username}\\" \\"%{DATA:policy}\\" %{IP:srcip} %{INT:srcport} \\"%{DATA:user_agent}\\" %{IP:tgtip} %{INT:tgtport} %{WORD:method} %{URI:url} %{WORD:action} %{INT:returnCode} %{GREEDYDATA:transaction_disposition}',
        '%{WORD:severity}: \\"%{DATA:logtime}\\" %{INT:session_id} %{NOTSPACE:username} %{NOTSPACE:policy} %{IP:srcip} %{INT:srcport} \"%{GREEDYDATA:user_agent}\" %{NOTSPACE:tgtip} %{INT:tgtport} %{WORD:method} %{NOTSPACE:url} %{WORD:action} %{INT:returnCode} %{GREEDYDATA:transaction_disposition}',
        '%{WORD:severity}: \\\"%{DATA:logtime}\\\" %{INT:session_id} - - %{IP:srcip} %{INT:srcport} - %{IP:tgtip} %{INT:tgtport} %{DATA:method} %{DATA:url}/ %{DATA:action} %{INT:returnCode} %{NOTSPACE:ser_msg} - %{DATA:ser_data} \\\"%{DATA:ser_url}\\\" %{GREEDYDATA}',
        '%{WORD:severity}: \\\"%{DATA:logtime}\\\" %{INT:session_id} - - %{IP:srcip} %{INT:srcport} - - %{INT:tgtport} %{DATA:method} %{DATA:url}/ %{DATA:action} %{INT:returnCode} %{NOTSPACE:ser_msg} - %{DATA:ser_data} \\\"%{DATA:ser_url}\\\" %{GREEDYDATA}',
        '%{WORD:severity}: \\\"%{DATA:logtime}\\\" %{INT:session_id} \\\"%{DATA:user_email}\\\" \\\"%{DATA:access_group}\\\" %{IP:srcip} %{INT:srcport} - %{IP:tgtip} %{INT:tgtport} %{DATA:method} %{DATA:url} %{DATA:action} %{INT:returnCode} %{DATA:ser_msg} - %{DATA:ser_data} \\\"%{DATA:ser_url}\\\" %{GREEDYDATA}',
        '%{WORD:severity}: %{GREEDYDATA:information}'
      ]
    }
    overwrite => ["session_id","username","when","srcip","action","method","url","tgtip","tgtport", "size", "returnCode", "bytes_sent", "total_bytes", "request_size", "response_size", "referer_url", "wsa_hostname", "description","cmf","dcf", "err", "case_name","transaction_disposition","mime_type", "remaining_message", "time", "severity", "auth_module","app_proto","interaction_mode","sec_summary","srcport","logtime","policy","category","user_agent", "ser_msg","ser_url","information", "ser_data", "user_email", "access_group"]
    on_error => "grok_failure"
  }
  if [grok_failure] and [not_json] {
    drop {
      tag => "TAG_MALFORMED_MESSAGE"
    }
  }
  if [remaining_message] != "" {
    grok {
      match => {
        "remaining_message" => [
        '%{DATA:threat_confidence} %{INT:threat_attempts} User Agent = \\"%{DATA:user_agent}\\", Latency = %{INT:latency}, server IP address = %{DATA:tgtip}, \\[ %{GREEDYDATA:tx_wait_times_raw}: 1st byte to server = %{INT:first_server_byte}, 1st byte to client = %{INT:first_client_byte}, Response Header = %{DATA:response_header}, Client Body = %{DATA:client_body} \\] 1st response byte = %{INT:first_response_byte}, Server response = %{INT:server_response};',
        "\\[%{WORD:auth_protocol} : %{INT:auth_status_code} : %{WORD:auth_mechanism}\\] : \\[%{INT:process_id}: %{NOTSPACE:domain}\\]%{NOTSPACE:auth_error_component}: %{NOTSPACE:auth_error_module}: %{DATA:auth_error_description}\\(%{DATA}\\[\\(%{DATA:auth_error_details}\\)\\]\\): %{NOTSPACE:auth_status}",
        "\\[%{WORD:auth_protocol} : %{INT:auth_status_code} : %{WORD:auth_mechanism}\\] : \\[%{INT:process_id}: %{NOTSPACE:domain}\\]%{GREEDYDATA:sec_summary}",
        "\\[%{DATA:proxy_session_id}\\] %{GREEDYDATA:sec_summary}"
        ]
      }
      overwrite => ["threat_confidence", "threat_attempts", "user_agent", "latency", "tgtip", "tx_wait_times_raw", "first_server_byte", "first_client_byte", "response_header", "client_body", "first_response_byte", "server_response", "auth_protocol", "auth_status_code", "auth_mechanism", "process_id", "domain", "auth_error_component", "auth_error_module", "auth_error_description", "auth_error_details", "auth_status", "sec_summary","proxy_session_id"]
      on_error => "remaining_message_grok_failure"
    }
  }
  if [sec_summary] != "" {
    grok {
      match => {
        "sec_summary" => [
          "Failed to find %{DATA:app_proto}\/%{HOSTNAME:tgthost}@%{DATA:target_kerberos_realm}\\(kvno %{INT:kerberos_kvno}\\) in keytab %{DATA:kerberos_keytab} \\(%{DATA:kerberos_enctype}\\)\\]",
          "\\(/C=%{DATA:tar_region}/ST=%{DATA:tar_state}/L=%{DATA:tar_city}/O=%{DATA:server_cert_organization}/CN=%{HOSTNAME:tgthost}\\)",
          `\\\"%{DATA:logtime}\\\" %{INT:session_id} - - %{IP:srcip} %{INT:srcport} \\\"%{GREEDYDATA:user_agent}\\\" - %{INT:tgtport} %{WORD:method} %{URI:url} %{WORD:action} %{INT:returnCode} %{NOTSPACE:src_msg} - - \\\"%{GREEDYDATA:src_url}\\\" %{GREEDYDATA}`,
          '\\\"%{DATA:logtime}\\\" %{INT:session_id} - - %{IP:srcip} %{INT:srcport} \\\"%{GREEDYDATA:user_agent}\\\" %{IP:tgtip} %{INT:tgtport} %{DATA:method} %{DATA:url} %{DATA:action} %{INT:returnCode} %{NOTSPACE:src_msg} - %{DATA:src_data} \\\"%{DATA:src_url}\\\" %{GREEDYDATA}',
          '\\\"%{DATA:timelog}\\\" %{INT:session_id} - - %{IP:srcip} %{INT:srcport} - %{IP:tgtip} %{INT:tgtport} %{DATA:method} %{DATA:url} %{DATA:action} %{INT:returnCode} %{NOTSPACE:src_msg} - %{DATA:src_data} \\\"%{DATA:src_url}\\\" %{GREEDYDATA}'
        ]
      }
      overwrite => ["app_proto", "tgthost", "target_kerberos_realm", "kerberos_kvno", "kerberos_keytab", "kerberos_enctype","tar_region","tar_state","tar_city","server_cert_organization", "logtime", "session_id", "srcip", "srcport", "user_agent", "tgtport", "method", "url", "action", "returnCode", "src_msg", "src_url", "src_data", "tgtip"]
      on_error => "sec_summary_grok_failure"
    }
    mutate {
      replace => {
        "_security_result.description" => "%{sec_summary}"
      }
      on_error => "sec_summary_empty"
    }
  }
  if [information] != "" {
    mutate {
      replace => {
        "information_label.key" => "information"
        "information_label.value.string_value" => "%{information}"
      }
      on_error => "information_label_error"
    }
    if ![information_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "information_label"
        }
        on_error => "information_merge_error"
      }
    }
  }
  if [hostname] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
        "has_principal" => "true"
      }
      on_error => "hostname_empty"
    }
  }
  if [transaction_disposition] != "" {
    mutate {
      gsub => ["transaction_disposition", '\\\\', ""]
    }
    grok {
      match => {
        "transaction_disposition" => [
          '%{NOTSPACE:ser_msg} %{DATA:ser_data} \"%{DATA:ser_url}\" - - %{DATA} %{DATA:sha_value} -%{GREEDYDATA}',
          '%{NOTSPACE:ser_msg} ns %{NOTSPACE:ser_data} \"%{DATA:ser_url}\" %{GREEDYDATA}',
          '%{NOTSPACE:ser_msg} %{NOTSPACE:sep1} %{NOTSPACE:ser_data} \"%{DATA:ser_url}\" %{GREEDYDATA:remaining_details}'
        ]
      }
      overwrite => ["ser_msg", "ser_data", "ser_url", "remaining_details", "sha_value"]
      on_error => "transaction_disposition_grok_failure"
    }
  }
  if [sha_value] not in ["", "-"] {
    if [sha_value] =~ "^[a-fA-F0-9]{64}$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.sha256" => "%{sha_value}"
        }
        on_error => "sha_value_empty"
      }
    } 
    else {
      mutate {
        replace => {
          "sha_value_label.key" => "sha_value"
          "sha_value_label.value.string_value" => "%{sha_value}"
        }
        on_error => "sha_value_label_error"
      }
      if ![sha_value_label_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "sha_value_label"
          }
        }
      }
    }
  }
  if [ser_url] != "" {
    mutate {
      replace => {
        "_security_result.description" => "%{ser_url}"
      }
      on_error => "ser_url_empty"
    }
  }
  if [ser_msg] != "" {
    mutate {
      replace => {
        "_security_result.rule_name" => "%{ser_msg}"
      }
      on_error => "ser_msg_empty"
    }
  }

  if [ser_data] != "" {
    mutate {
      replace => {
        "ser_data_label.key" => "ser_data"
        "ser_data_label.value" => "%{ser_data}"
      }
      on_error => "ser_data_empty"
    }
    if ![ser_data_empty] {
      mutate {
        merge => {
          "_security_result.detection_fields" => "ser_data_label"
        }
        on_error => "ser_data_merge_error"
      }
    }
  }

  if [appname] != "" {
    mutate {
      replace => {
        "appname_label.key" => "appname"
        "appname_label.value.string_value" => "%{appname}"
      }
      on_error => "appname_label_error"
    }
    if ![appname_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "appname_label"
        }
        on_error => "appname_merge_error"
      }
    }
  }

  if [priority] != "" {
    mutate {
      convert => {
        "priority" => "string"
      }
      on_error => "priority_conversion_error"
    }
    mutate {
      replace => {
        "_security_result.severity_details" => "%{priority}"
      }
      on_error => "severity_details_merge_error"
    }
  }

  mutate {
    convert => {
      "facility" => "string"
    }
    on_error => "facility_conversion_error"
  }
  if [facility] != "" {
    mutate {
      replace => {
        "facility_label.key" => "facility"
        "facility_label.value.string_value" => "%{facility}"
      }
      on_error => "facility_label_error"
    }
    if ![facility_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "facility_label"
        }
        on_error => "facility_merge_error"
      }
    }
  }

  if [srcport] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.port" => "%{srcport}"
      }
      on_error => "srcport_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.principal.port" => "integer"
      }
      on_error => "srcport_conversion_error"
    }
  }
  if [policy] not in ["", "-"] {
    mutate {
      replace => {
        "policy_label.key" => "policy"
        "policy_label.value.string_value" => "%{policy}"
      }
      on_error => "policy_label_error"
    }
    if ![policy_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "policy_label"
        }
        on_error => "policy_merge_error"
      }
    }
  }
  if [category] != "" {
    mutate {
      merge => {
        "_security_result.category_details" => "category"
      }
      on_error => "category_empty"
    }
  }
  if [logtime] != "" {
    mutate {
      replace => {
        "logtime_label.key" => "logtime"
        "logtime_label.value.string_value" => "%{logtime}"
      }
      on_error => "logtime_label_error"
    }
    if ![logtime_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "logtime_label"
        }
        on_error => "logtime_merge_error"
      }
    }
  }
  if [tar_region] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.country_or_region" => "%{tar_region}"
      }
      on_error => "tar_region_empty"
    }
  }
  if [interaction_mode] != "" {
    mutate {
      replace => {
        "interaction_mode_label.key" => "interaction_mode"
        "interaction_mode_label.value.string_value" => "%{interaction_mode}"
      }
      on_error => "interaction_mode_label_error"
    }
    if ![interaction_mode_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "interaction_mode_label"
        }
        on_error => "interaction_mode_merge_error"
      }
    }
  }

  if [server_cert_organization] != "" {
    mutate {
      replace => {
        "server_cert_organization_label.key" => "server_cert_organization"
        "server_cert_organization_label.value" => "%{server_cert_organization}"
      }
      on_error => "server_cert_organization_label_error"
    }
    if ![server_cert_organization_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "server_cert_organization_label"
        }
        on_error => "server_cert_organization_merge_error"
      }
    }
  }
  if [tar_state] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.state" => "%{tar_state}"
      }
      on_error => "state_empty"
    }
  }
  if [tar_city] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.city" => "%{tar_city}"
      }
      on_error => "city_empty"
    }
  }

  if [proxy_session_id] != "" {
    mutate {
      replace => {
        "proxy_session_id_label.key" => "proxy_session_id"
        "proxy_session_id_label.value.string_value" => "%{proxy_session_id}"
      }
      on_error => "proxy_session_id_label_error"
    }
    if ![proxy_session_id_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "proxy_session_id_label"
        }
        on_error => "proxy_session_id_merge_error"
      }
    }
  }
  if [target_kerberos_realm] != "" {
    mutate {
      replace => {
        "target_kerberos_realm_label.key" => "target_kerberos_realm"
        "target_kerberos_realm_label.value" => "%{target_kerberos_realm}"
      }
      on_error => "target_kerberos_realm_label_error"
    }
    if ![target_kerberos_realm_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "target_kerberos_realm_label"
        }
        on_error => "target_kerberos_realm_merge_error"
      }
    }
  }
  mutate {
    convert => {
      "kerberos_kvno" => "string"
    }
    on_error => "kerberos_kvno_conversion_error"
  }
  if [kerberos_kvno] != "" {
    mutate {
      replace => {
        "kerberos_kvno_label.key" => "kerberos_kvno"
        "kerberos_kvno_label.value" => "%{kerberos_kvno}"
      }
      on_error => "kerberos_kvno_label_error"
    }
    if ![kerberos_kvno_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "kerberos_kvno_label"
        }
        on_error => "kerberos_kvno_merge_error"
      }
    }
  }
  if [kerberos_keytab] != "" {
    mutate {
      replace => {
        "kerberos_keytab_label.key" => "kerberos_keytab"
        "kerberos_keytab_label.value" => "%{kerberos_keytab}"
      }
      on_error => "kerberos_keytab_label_error"
    }
    if ![kerberos_keytab_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "kerberos_keytab_label"
        }
        on_error => "kerberos_keytab_merge_error"
      }
    }
  }
  if [kerberos_enctype] != "" {
    mutate {
      replace => {
        "kerberos_enctype_label.key" => "kerberos_enctype"
        "kerberos_enctype_label.value" => "%{kerberos_enctype}"
      }
      on_error => "kerberos_enctype_label_error"
    }
    if ![kerberos_enctype_label_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" => "kerberos_enctype_label"
        }
        on_error => "kerberos_enctype_merge_error"
      }
    }
  }

  if [time] != "" {
    date {
      match => ["time", "MMM dd HH:mm:ss", "RFC3339", "ISO8601"]
      rebase => true
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "format_not_match"
    }
  }
  if [severity] != "" {
    if [severity] =~ "(?i)Info" {
      mutate {
        replace => {
          "_security_result.severity" => "INFORMATIONAL"
        }
      }
    }
    else if [severity] =~ "(?i)Error" {
      mutate {
        replace => {
          "_security_result.severity" => "ERROR"
        }
      }
    }
    else if [severity] =~ "(?i)Warning" {
      mutate {
        replace => {
          "_security_result.severity" => "MEDIUM"
        }
      }
    }
    else {
      mutate {
        replace => {
          "_security_result.severity" => "LOW"
        }
      }
    }
  }

  if [user_agent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" => "%{user_agent}"
      }
      on_error => "user_agent_empty"
    }
  }
  if [auth_mechanism] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.extensions.auth.auth_details" => "%{auth_mechanism}"
      }
      on_error => "auth_mechanism_empty"
    }
  }
  if [domain] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.administrative_domain" => "%{domain}"
      }
      on_error => "domain_empty"
    }
  }
  if [process_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.process.pid" => "%{process_id}"
      }
      on_error => "invalid_process_id"
    }
  }
  mutate {
    rename => {
      "threat_confidence" => "addition.threat_confidence"
      "threat_attempts" => "addition.threat_attempts"
      "server_response" => "addition.server_response"
      "latency" => "addition.latency"
      "first_server_byte" => "addition.first_server_byte"
      "first_client_byte" => "addition.first_client_byte"
      "response_header" => "addition.response_header"
      "client_body" => "addition.client_body"
      "first_response_byte" => "addition.first_response_byte"
      "auth_module" => "addition.auth_module"
      "auth_protocol" => "addition.auth_protocol"
      "auth_status_code" => "addition.auth_status_code"
      "auth_error_component" => "addition.auth_error_component"
      "auth_error_module" => "addition.auth_error_module"
      "auth_error_description" => "addition.auth_error_description"
      "auth_error_details" => "addition.auth_error_details"
      "auth_status" => "addition.auth_status"
    }
  }
  for key, value in addition map {
    mutate {
      replace => {
        "_field" => ""
        "_check" => ""
      }
    }
    mutate {
      convert => {
        "value" => "string"
      }
      on_error => "value_conversion_error"
    }
    mutate {
      replace => {
        "_check" => "%{value}"
      }
      on_error => "no_value"
    }
    if ![no_value] and [_check] != "" {
      mutate {
        replace => {
          "_field.key" => "%{key}"
        }
      }
      if [key] in ["threat_attempts", "threat_confidence", "auth_protocol", "auth_status"] {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "_security_result.detection_fields" => "_field"
          }
          on_error => "security_result_merge_failed"
        }
      }
      else if [key] == "server_response" {
        mutate {
          replace => {
            "_field.value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.resource.attribute.labels" => "_field"
          }
          on_error => "resource_merge_failed"
        }
      }
      else {
        mutate {
          replace => {
            "_field.value.string_value" => "%{value}"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.additional.fields" => "_field"
          }
          on_error => "addition_merge_failed"
        }
      }
    }
  }

  if [session_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.session_id" => "%{session_id}"
      }
      on_error => "session_id_empty"
    }
  }
  if [cmf] != "" {
    mutate {
      replace => {
        "cmf_label.value.string_value" => "%{cmf}"
      }
      on_error => "cmf_label_error"
    }
    if ![cmf_label_error] {
      mutate {
        replace => {
          "cmf_label.key" => "cmf"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "cmf_label"
        }
        on_error => "cmf_merge_error"
      }
    }
  }
  if [dcf] != "" {
    mutate {
      replace => {
        "dcf_label.value.string_value" => "%{dcf}"
      }
      on_error => "dcf_label_error"
    }
    if ![dcf_label_error] {
      mutate {
        replace => {
          "dcf_label.key" => "dcf"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "dcf_label"
        }
        on_error => "dcf_merge_error"
      }
    }
  }
  if [err] != "" {
    mutate {
      replace => {
        "err_label.value.string_value" => "%{err}"
      }
      on_error => "err_label_error"
    }
    if ![err_label_error] {
      mutate {
        replace => {
          "err_label.key" => "err"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "err_label"
        }
        on_error => "err_merge_error"
      }
    }
  }
  if [case_name] != "" {
    mutate {
      replace => {
        "case_name_label.value.string_value" => "%{case_name}"
      }
      on_error => "case_name_label_error"
    }
    if ![case_name_label_error] {
      mutate {
        replace => {
          "case_name_label.key" => "case name"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "case_name_label"
        }
        on_error => "case_name_merge_error"
      }
    }
  }
  if [bytes_sent] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{bytes_sent}"
      }
      on_error => "bytes_sent_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "bytes_sent_conversion_failure"
    }
  }
  if [total_bytes] != "" {
    mutate {
      replace => {
        "total_bytes_label.value.string_value" => "%{total_bytes}"
      }
      on_error => "total_bytes_label_error"
    }
    if ![total_bytes_label_error] {
      mutate {
        replace => {
          "total_bytes_label.key" => "total bytes"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "total_bytes_label"
        }
        on_error => "total_bytes_merge_error"
      }
    }
  }
  if [request_size] != "" {
    mutate {
      replace => {
        "request_size_label.value.string_value" => "%{request_size}"
      }
      on_error => "request_size_label_error"
    }
    if ![request_size_label_error] {
      mutate {
        replace => {
          "request_size_label.key" => "request size"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "request_size_label"
        }
        on_error => "request_size_merge_error"
      }
    }
  }
  if [response_size] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.received_bytes" => "%{response_size}"
      }
      on_error => "response_size_error"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.received_bytes" => "uinteger"
      }
      on_error => "response_size_conversion_failure"
    }
  }
  if [description] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.description" => "%{description}"
      }
      on_error => "description_empty"
    }
  }
  if [referer_url] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.referral_url" => "%{referer_url}"
      }
      on_error => "referer_url_empty"
    }
  }
  if [wsa_hostname] != "" {
    mutate {
      replace => {
        "intermediary.hostname" => "%{wsa_hostname}"
        "intermediary.asset.hostname" => "%{wsa_hostname}"
      }
      on_error => "wsa_hostname_empty"
    }
  }
  if [transaction_disposition] != "" {
    mutate {
      replace => {
        "transaction_disposition_label.value.string_value" => "%{transaction_disposition}"
      }
      on_error => "transaction_disposition_label_error"
    }
    if ![transaction_disposition_label_error] {
      mutate {
        replace => {
          "transaction_disposition_label.key" => "transaction disposition"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "transaction_disposition_label"
        }
        on_error => "transaction_disposition_merge_error"
      }
    }
  }
  if [url] not in [ "", "/" ] {
    grok {
      match => {
        "url" => "(%{WORD:app_proto}://)?(?P<tgthost>[^:/]+)(:(?P<tgtport>\\d+))?(?P<param>.*)?"
      }
      overwrite => ["tgtport", "app_proto", "tgthost"]
      on_error => "url_grok_failure"
    }
  }
  csv {
    source => "csv_data"
    separator => ","
    on_error => "csv_failure"
  }

  mutate{
    rename => {
      column1 => "scanning_verdict.url_category",
      column2 => "scanning_verdict.web_reputation_score",
      column3 => "scanning_verdict.webroot_malware_verdict",
      column4 => "scanning_verdict.spyware_name",
      column5 => "scanning_verdict.webroot_threat_risk_ratio",
      column6 => "scanning_verdict.webroot_threat_identifier",
      column7 => "scanning_verdict.webroot_trace_identifier.",
      column8 => "scanning_verdict.mcafee_malware_verdict",
      column9 => "scanning_verdict.mcafee_file_name",
      column10 => "scanning_verdict.mcafee_scan_error",
      column11 => "scanning_verdict.mcafee_detection_type",
      column12 => "scanning_verdict.mcafee_virus_type",
      column13 => "scanning_verdict.mcafee_virus_name",
      column14 => "scanning_verdict.sophos_malware_verdict",
      column15 => "scanning_verdict.sophos_return_code",
      column16 => "scanning_verdict.sophos_file_name",
      column17 => "scanning_verdict.sophos_threat_name",
      column18 => "scanning_verdict.cisco_data_security_malware_verdict",
      column19 => "scanning_verdict.dlp_scan_verdict",
      column20 => "scanning_verdict.predefined URL category verdict",
      column21 => "scanning_verdict.url_category_verdict",
      column22 => "scanning_verdict.Unified response-side anti-malware scanning verdict",
      column23 => "scanning_verdict.threat_type",
      column24 => "scanning_verdict.unknown",
      column25 => "scanning_verdict.application_name",
      column26 => "scanning_verdict.application_type",
      column27 => "scanning_verdict.application_behavior",
      column28 => "scanning_verdict.safe_browsing_malware_verdict.",
      column29 => "scanning_verdict.average_bandwidth_consumed",
      column30 => "scanning_verdict.throttled",
      column31 => "scanning_verdict.type_of_user",
      column32 => "scanning_verdict.Unified_malware_verdict",
      column33 => "scanning_verdict.client_threat_name",
      column34 => "scanning_verdict.Advanced Malware Protection_malware_verdict",
      column35 => "scanning_verdict.Threat_name",
      column36 => "scanning_verdict.Reputation_score",
      column37 => "scanning_verdict.Indicator of upload and analysis request",
      column38 => "scanning_verdict.File_name",
      column39 => "scanning_verdict.SHA-256_identifier",
      column40 => "scanning_verdict.amp_reputation",
      column41 => "scanning_verdict.archive_scan_verdict",
      column42 => "scanning_verdict.archive_scan_verdict_detail"
      column43 => "scanning_verdict.threat_category",
      column44 => "scanning_verdict.threat_severity",
    }
  }

  for key, value in  scanning_verdict map {
    mutate {
      replace => {
        "field_" => ""
      }
    }
    mutate {
      replace => {
        "check_" => "%{value}"
      }
      on_error => "value_not_exists"
    }
    if ![value_not_exists] and [value] != "-" and [value] != "Unknown" {
      mutate {
        replace => {
          "field_.value" => "%{value}"
        }
        on_error => "value_not_exists"
      }
      mutate {
        replace => {
          "field_.key" => "%{key}"
        }
        on_error => "key_not_exists"
      }
      mutate {
        merge => {
          "_security_result.detection_fields" => "field_"
        }
        on_error => "field_empty"
      }
    }
  }
  mutate {
    merge => {
      "event.idm.read_only_udm.security_result" => "_security_result"
    }
    on_error => "security_result_merge_error"
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "WSA"
      "event.idm.read_only_udm.metadata.vendor_name" => "CISCO"
    }
  }
  if [action] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{action}"
      }
      on_error => "action_empty"
    }
  }
  if [tgthost] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{tgthost}"
        "event.idm.read_only_udm.target.asset.hostname" => "%{tgthost}"
        "has_target" => "true"
      }
      on_error => "no_tgthost"
    }
  }
  if [tgtip] not in [ "","-" ] {
    grok {
      match => {
        "tgtip" => [ "%{IP:tgtip}" ]
      }
      overwrite => ["tgtip"]
      on_error => "not_valid_tgtip"
    }
    if ![not_valid_tgtip] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.ip" => "tgtip"
          "event.idm.read_only_udm.target.asset.ip" => "tgtip"
        }
        on_error => "no_tgtip"
      }
      mutate {
        replace => {
          "has_target" => "true"
        }
      }
    }
  }
  if [mime_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.file.mime_type" => "%{mime_type}"
      }
      on_error => "mime_type_label_error"
    }
  }
  if [tgtport] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.port" => "%{tgtport}"
      }
      on_error => "tgtport_conversion_failure"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.target.port" => "integer"
      }
      on_error => "tgtport_already_integer"
    }
  }
  if [url] not in ["-",""] {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.url" => "%{url}"
      }
      on_error => "no_url"
    }
  }
  if [when] != "" {
    date {
      match => [ "when", "UNIX"]
      on_error => "date_error"
    }
  }
  if [srcip] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "srcip"
        "event.idm.read_only_udm.principal.asset.ip" => "srcip"
      }
      on_error => "no_srcip"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  mutate {
    convert => {
      "returnCode" => "string"
    }
    on_error => "returnCode_conversion_failure"
  }
  if [returnCode] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.response_code" => "%{returnCode}"
      }
      on_error => "returnCode_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.http.response_code" => "integer"
      }
      on_error => "returnCode_conversion_failure"
    }
  }
  mutate {
    convert => {
      "size" => "string"
    }
    on_error => "size_conversion_failure"
  }
  if [size] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.sent_bytes" => "%{size}"
      }
      on_error => "size_empty"
    }
    mutate {
      convert => {
        "event.idm.read_only_udm.network.sent_bytes" => "uinteger"
      }
      on_error => "size_conversion_failure"
    }
  }
  if [method] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.method" => "%{method}"
      }
      on_error => "method_empty"
    }
  }
  mutate {
    uppercase => ["app_proto"]
  }
  if [tgtport] == "443" {
    mutate {
      replace => {
        "app_proto" => "HTTPS"
      }
    }
  }
  if [app_proto] not in [ "","FTP","TUNNEL","CACHE_OBJECT"] {
    if [app_proto] in ["AFP", "AMQP", "APPC", "ATOM", "BEEP", "BIT_TORRENT",
      "BITCOIN", "CFDP", "COAP", "DCERPC", "DDS", "DEVICE_NET", "DHCP",
      "DNS", "E_DONKEY", "ENRP", "FAST_TRACK", "FINGER", "FREENET", "FTAM",
      "GOPHER", "H323", "HL7", "HTTP", "HTTPS", "IRCP", "KADEMLIA", "KRB5",
      "LDAP", "LPD", "MIME", "MODBUS", "MQTT", "NETCONF", "NFS", "NIS",
      "NNTP", "NTCIP", "NTP", "OSCAR", "PNRP", "QUIC", "RDP", "RELP", "RIP",
      "RLOGIN", "RPC", "RTMP", "RTP", "RTPS", "RTSP", "SAP", "SDP", "SIP",
      "SLP", "SMB", "SMTP", "SNTP", "SSH", "SSMS", "STYX", "TCAP", "TDS",
      "TOR", "TSP", "VTP", "WEB_DAV", "WHOIS", "X400", "X500", "XMPP"] {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "%{app_proto}"
          "has_network" => "true"
        }
        on_error => "app_proto_empty"
      }
    }
  }
  if [username] not in [ "-" ,"" ] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.user.userid" => "%{username}"
        "has_user" => "true"
      }
      on_error => "username_empty"
    }
  }
  if [intermediary] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.intermediary" => "intermediary"
      }
      on_error => "intermediary_empty"
    }
  }
  if [has_principal] == "true" and [has_target] == "true" and [has_network] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_HTTP"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "NETWORK_CONNECTION"
      }
    }
  }
  else if [has_user] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" and [has_target] == "false" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
