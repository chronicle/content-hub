  for index, explanation in explanations {
    mutate {
      convert => {
        "index" => "string"
      }
      on_error => "index_already_string"
    }
    mutate {
      replace => {
        "explanation_summary_field" => ""
        "explanation_type_field" => ""
      }
    }
    mutate {
      replace => {
        "explanation_summary_field.value" => "%{explanation.summary}"
      }
      on_error => "summary_empty"
    }
    if ![summary_empty] {
      mutate {
        replace => {
          "explanation_summary_field.key" => "%{index} explanation summary"
        }
        on_error => "summary_key_empty"
      }
      mutate {
        merge => {
          "security_result.detection_fields" => "explanation_summary_field"
        }
        on_error => "summary_field_empty"
      }
    }
    mutate {
      replace => {
        "explanation_type_field.value" => "%{explanation.type}"
