      mutate {
        merge => {
          "security_result.detection_fields" => "explanation_type_field"
        }
        on_error => "type_field_empty"
      }
    }
  }
  if [surfaced_auth][access_device][browser] != "" {
    mutate {
      replace => {
        "browser_name.key" => "Browser"
        "browser_name.value" => "%{surfaced_auth.access_device.browser}"
      }
      on_error => "no_browser_name"
    }
    if ![no_browser_name] {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "browser_name"
        }
        on_error => "browser_name"
      }
    }
  }

  if [surfaced_auth][access_device][browser_version] != "" {
    mutate {
      replace => {
        "browser_version_name_field.value" => "%{surfaced_auth.access_device.browser_version}"
      }
      on_error => "no_browser_version_name_field"
    }
    if ![no_browser_version_name_field] {
      mutate {
        replace => {
          "browser_version_name_field.key" => "Browser"
        }
      }
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.resource.attribute.labels" => "browser_version_name_field"
        }
        on_error => "browser_version_name_field_empty"
      }
    }
  }

  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }

  if [isotimestamp] != "" {
    date {
      match => ["isotimestamp", "RFC3339"]
    }
  }
  else if [timestamp] != "" {
    mutate {
      convert => {
        "timestamp" => "string"
      }
      on_error => "timestamp_already_string"
    }

    date {
      match => ["timestamp", "UNIX"]
    }
  }

  if [action] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{action}"
      }
    }
  }

  if [triage_event_uri] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.url_back_to_product" =>
        "%{triage_event_uri}"
      }
      on_error => "triage_event_uri_empty"
    }
  }
  mutate {
    convert => {
      "description.is_temporary_password" => "string"
    }
    on_error => "description_is_temporary_password_already_string"
  }
  mutate {
    replace => {
      "description_is_temporary_password" => "%{description.is_temporary_password}"
    }
    on_error => "description_is_temporary_password_empty"
  }
  if [description_is_temporary_password] != "" {
    mutate {
      replace => {
        "description_is_temporary_password_field.key" => "is_temporary_password"
        "description_is_temporary_password_field.value.string_value" => "%{description_is_temporary_password}"
      }
      on_error => "description_is_temporary_password_field_empty"
    }
    if ![description_is_temporary_password_field_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "description_is_temporary_password_field"
        }
        on_error => "description_is_temporary_password_field_merge_error"
      }
    }
  }
  mutate {
    convert => {
      "description.hardtoken" => "string"
    }
    on_error => "description_hardtoken_already_string"
  }
  mutate {
    replace => {
      "description_hardtoken" => "%{description.hardtoken}"
    }
    on_error => "description_hardtoken_empty"
  }
  if [description_hardtoken] not in ["", "null"] {
    mutate {
      replace => {
        "description_hardtoken_field.key" => "hardtoken"
        "description_hardtoken_field.value.string_value" => "%{description_hardtoken}"
      }
      on_error => "description_hardtoken_field_empty"
    }
    if ![description_hardtoken_field_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "description_hardtoken_field"
        }
        on_error => "description_hardtoken_field_merge_error"
      }
    }
  }
  mutate {
    convert => {
      "description.restricted_by_admin_units" => "string"
    }
    on_error => "description_restricted_by_admin_units_already_string"
  }
  mutate {
    replace => {
      "description_restricted_by_admin_units" => "%{description.restricted_by_admin_units}"
    }
    on_error => "description_restricted_by_admin_units_empty"
  }
  if [description_restricted_by_admin_units] != "" {
    mutate {
      replace => {
        "description_restricted_by_admin_units_field.key" => "restricted_by_admin_units"
        "description_restricted_by_admin_units_field.value.string_value" => "%{description_restricted_by_admin_units}"
      }
      on_error => "description_restricted_by_admin_units_field_empty"
    }
    if ![description_restricted_by_admin_units_field_empty] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "description_restricted_by_admin_units_field"
        }
        on_error => "description_restricted_by_admin_units_field_merge_error"
      }
    }
  }
  if [surfaced_auth][event_type] == "authentication" and ([has_principal_user] == "true" or [has_target_user] == "true") {
    mutate {
      replace => {
        "mechanism" => "USERNAME_PASSWORD"
        "metadata_event_type" => "USER_LOGIN"
        "security_result_action" => "ALLOW"
      }
    }
    mutate {
      merge => {
        "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
      }
      on_error => "mechanism_empty"
    }
  }
  else if [surfaced_auth][event_type] == "enrollment" {
    mutate {
      replace => {
        "metadata_event_type" => "USER_CREATION"
      }
    }
  }

  if [metadata_event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{metadata_event_type}"
      }
    }
  }
  else if [has_principal] == "true" and ([has_principal_user] == "true" or [has_target_user] == "true") {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_UNCATEGORIZED"
      }
    }
  }
  else if [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
      }
    }
  }
  else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "MULTI-FACTOR_AUTHENTICATION"
      "event.idm.read_only_udm.metadata.vendor_name" => "DUO_SECURITY"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
