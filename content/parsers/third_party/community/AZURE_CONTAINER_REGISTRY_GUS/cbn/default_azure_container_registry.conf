# Product: Azure Container Registry
# Category: Alert log types
# Supported Format: JSON
# Reference: N/A
# Last Updated: 2026-11-17
# Copyright 2026 Google SecOps

filter {
  mutate {
    replace => {
      "time" => ""
      "host" => ""
      "tenant" => ""
      "region_stamp" => ""
      "caller_ip_address" => ""
      "category" => ""
      "correlation_id" => ""
      "duration_ms" => ""
      "identity" => ""
      "location" => ""
      "operation_name" => ""
      "resource_id" => ""
      "result_description" => ""
      "result_type" => ""
      "prop_artifact_type" => ""
      "prop_digest" => ""
      "prop_jwtid" => ""
      "prop_login_server" => ""
      "prop_media_type" => ""
      "prop_repository" => ""
      "prop_tag" => ""
      "prop_tenant_id" => ""
      "prop_user_agent" => ""
      "src_ip" => ""
      "subscription_id" => ""
      "resource_group" => ""
      "resource_provider" => ""
      "registry_name" => ""
      "sha256_hash" => ""
      "sec_result" => ""
      "security_action" => ""
      "tenant_field" => ""
      "region_stamp_field" => ""
      "duration_ms_field" => ""
      "tag_label" => ""
      "tenant_id_label" => ""
      "jwtid_field" => ""
      "subscription_id_label" => ""
      "resource_group_label" => ""
      "provider_label" => ""
      "registry_name_label" => ""
      "has_principal" => "false"
      "has_target" => "false"
      "has_user" => "false"
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "invalid_json"
  }

  if [invalid_json] {
    drop {
      tag => "TAG_MALFORMED_ENCODING"
    }
  }

  if [time] != "" {
    if [time] !~ "(?i)(Z|[+-][0-9]{2}:?[0-9]{2})$" {
      mutate {
        replace => {
          "time" => "%{time}Z"
        }
        on_error => "time_append_z_error"
      }
    }
    date {
      match => ["time", "ISO8601", "RFC3339"]
      target => "event.idm.read_only_udm.metadata.event_timestamp"
      on_error => "time_parse_error"
    }
  }

  mutate {
    replace => {
      "host" => "%{Host}"
    }
    on_error => "no_host"
  }

  if [host] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.observer.hostname" => "%{host}"
        "event.idm.read_only_udm.observer.asset.hostname" => "%{host}"
      }
      on_error => "host_replace_error"
    }
  }

  mutate {
    replace => {
      "tenant" => "%{Tenant}"
    }
    on_error => "no_tenant"
  }

  if [tenant] != "" {
    mutate {
      replace => {
        "tenant_field.key" => "Tenant"
        "tenant_field.value.string_value" => "%{tenant}"
      }
      on_error => "tenant_field_replace_error"
    }
    if ![tenant_field_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "tenant_field"
        }
        on_error => "tenant_field_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "region_stamp" => "%{RegionStamp}"
    }
    on_error => "no_region_stamp"
  }

  if [region_stamp] != "" {
    mutate {
      replace => {
        "region_stamp_field.key" => "RegionStamp"
        "region_stamp_field.value.string_value" => "%{region_stamp}"
      }
      on_error => "region_stamp_field_replace_error"
    }
    if ![region_stamp_field_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "region_stamp_field"
        }
        on_error => "region_stamp_field_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "caller_ip_address" => "%{callerIpAddress}"
    }
    on_error => "no_caller_ip_address"
  }

  if [caller_ip_address] != "" {
    grok {
      match => {
        "caller_ip_address" => [
          "%{IP:src_ip}"
        ]
      }
      overwrite => ["src_ip"]
      on_error => "caller_ip_grok_error"
    }
    if [src_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
        }
        on_error => "src_ip_merge_error"
      }
      if ![src_ip_merge_error] {
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
    }
  }

  if [identity] != "" and [identity] != "<nil>" {
    if [identity] =~ "^[^@ ]+@[^@ ]+[.][^@ ]+$" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.user.email_addresses" => "identity"
        }
        on_error => "identity_email_merge_error"
      }
      if ![identity_email_merge_error] {
        mutate {
          replace => {
            "has_user" => "true"
            "has_principal" => "true"
          }
        }
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{identity}"
          "has_user" => "true"
          "has_principal" => "true"
        }
        on_error => "identity_userid_replace_error"
      }
    }
  }

  if [category] != "" {
    mutate {
      merge => {
        "sec_result.category_details" => "category"
      }
      on_error => "category_merge_error"
    }
  }

  mutate {
    replace => {
      "correlation_id" => "%{correlationId}"
    }
    on_error => "no_correlation_id"
  }

  if [correlation_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_log_id" =>
          "%{correlation_id}"
      }
      on_error => "correlation_id_replace_error"
    }
  }

  mutate {
    convert => {
      "durationMs" => "string"
    }
    on_error => "duration_ms_str_convert_error"
  }

  mutate {
    replace => {
      "duration_ms" => "%{durationMs}"
    }
    on_error => "no_duration_ms"
  }

  if [duration_ms] != "" {
    mutate {
      replace => {
        "duration_ms_field.key" => "durationMs"
        "duration_ms_field.value.string_value" => "%{duration_ms}"
      }
      on_error => "duration_ms_field_replace_error"
    }
    if ![duration_ms_field_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "duration_ms_field"
        }
        on_error => "duration_ms_field_merge_error"
      }
    }
  }

  if [location] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.location.name" => "%{location}"
      }
      on_error => "location_replace_error"
    }
  }

  mutate {
    replace => {
      "operation_name" => "%{operationName}"
    }
    on_error => "no_operation_name"
  }

  if [operation_name] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" =>
          "%{operation_name}"
      }
      on_error => "operation_name_replace_error"
    }
  }

  mutate {
    replace => {
      "prop_login_server" => "%{properties.loginServer}"
    }
    on_error => "no_prop_login_server"
  }

  if [prop_login_server] != "" and [prop_login_server] != "<nil>" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.hostname" => "%{prop_login_server}"
        "event.idm.read_only_udm.target.asset.hostname" =>
          "%{prop_login_server}"
        "has_target" => "true"
      }
      on_error => "login_server_replace_error"
    }
  }

  mutate {
    replace => {
      "prop_repository" => "%{properties.repository}"
    }
    on_error => "no_prop_repository"
  }

  if [prop_repository] != "" and [prop_repository] != "<nil>" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.name" => "%{prop_repository}"
      }
      on_error => "repository_replace_error"
    }
  }

  mutate {
    replace => {
      "prop_artifact_type" => "%{properties.artifactType}"
    }
    on_error => "no_prop_artifact_type"
  }

  if [prop_artifact_type] != "" and [prop_artifact_type] != "<nil>" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.resource_subtype" =>
          "%{prop_artifact_type}"
      }
      on_error => "artifact_type_replace_error"
    }
  }

  mutate {
    replace => {
      "prop_digest" => "%{properties.digest}"
    }
    on_error => "no_prop_digest"
  }

  if [prop_digest] != "" and [prop_digest] != "<nil>" {
    grok {
      match => {
        "prop_digest" => [
          "^sha256:(?P<sha256_hash>[0-9a-fA-F]{64})$"
        ]
      }
      overwrite => ["sha256_hash"]
      on_error => "digest_sha256_grok_error"
    }
    if [sha256_hash] != "" {
      mutate {
        lowercase => ["sha256_hash"]
        on_error => "sha256_lowercase_error"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.sha256" => "%{sha256_hash}"
        }
        on_error => "sha256_replace_error"
      }
    }
  }

  mutate {
    replace => {
      "prop_media_type" => "%{properties.mediaType}"
    }
    on_error => "no_prop_media_type"
  }

  if [prop_media_type] != "" and [prop_media_type] != "<nil>" {
    if [prop_media_type] =~ "^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.+-]+$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.mime_type" =>
            "%{prop_media_type}"
        }
        on_error => "media_type_replace_error"
      }
    } else {
      mutate {
        replace => {
          "event.idm.read_only_udm.target.file.full_path" =>
            "%{prop_media_type}"
        }
        on_error => "media_type_full_path_replace_error"
      }
    }
  }

  mutate {
    replace => {
      "prop_tag" => "%{properties.tag}"
    }
    on_error => "no_prop_tag"
  }

  if [prop_tag] != "" and [prop_tag] != "<nil>" {
    mutate {
      replace => {
        "tag_label.key" => "tag"
        "tag_label.value" => "%{prop_tag}"
      }
      on_error => "tag_label_replace_error"
    }
    if ![tag_label_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" =>
            "tag_label"
        }
        on_error => "tag_label_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "prop_tenant_id" => "%{properties.tenantId}"
    }
    on_error => "no_prop_tenant_id"
  }

  if [prop_tenant_id] != "" and [prop_tenant_id] != "<nil>" {
    mutate {
      replace => {
        "tenant_id_label.key" => "tenantId"
        "tenant_id_label.value" => "%{prop_tenant_id}"
      }
      on_error => "tenant_id_label_replace_error"
    }
    if ![tenant_id_label_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.target.resource.attribute.labels" =>
            "tenant_id_label"
        }
        on_error => "tenant_id_label_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "prop_jwtid" => "%{properties.jwtid}"
    }
    on_error => "no_prop_jwtid"
  }

  if [prop_jwtid] != "" and [prop_jwtid] != "<nil>" {
    mutate {
      replace => {
        "jwtid_field.key" => "jwtid"
        "jwtid_field.value.string_value" => "%{prop_jwtid}"
      }
      on_error => "jwtid_field_replace_error"
    }
    if ![jwtid_field_replace_error] {
      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "jwtid_field"
        }
        on_error => "jwtid_field_merge_error"
      }
    }
  }

  mutate {
    replace => {
      "prop_user_agent" => "%{properties.userAgent}"
    }
    on_error => "no_prop_user_agent"
  }

  if [prop_user_agent] != "" and [prop_user_agent] != "<nil>" {
    mutate {
      replace => {
        "event.idm.read_only_udm.network.http.user_agent" =>
          "%{prop_user_agent}"
      }
      on_error => "user_agent_replace_error"
    }
    mutate {
      convert => {
        "prop_user_agent" => "parseduseragent"
      }
      on_error => "parsed_user_agent_convert_error"
    }
    if ![parsed_user_agent_convert_error] {
      mutate {
        rename => {
          "prop_user_agent" =>
            "event.idm.read_only_udm.network.http.parsed_user_agent"
        }
        on_error => "user_agent_rename_error"
      }
    }
  }

  mutate {
    replace => {
      "resource_id" => "%{resourceId}"
    }
    on_error => "no_resource_id"
  }

  if [resource_id] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.resource.product_object_id" =>
          "%{resource_id}"
        "has_target" => "true"
      }
      on_error => "resource_id_replace_error"
    }
    grok {
      match => {
        "resource_id" => [
          "(?i)^/subscriptions/(?P<subscription_id>[^/]+)/resourcegroups/(?P<resource_group>[^/]+)/providers/(?P<resource_provider>[^/]+)/registries/(?P<registry_name>[^/]+)$"
        ]
      }
      overwrite => [
        "subscription_id",
        "resource_group",
        "resource_provider",
        "registry_name"
      ]
      on_error => "resource_id_grok_error"
    }
    if [subscription_id] != "" {
      mutate {
        replace => {
          "subscription_id_label.key" => "subscription_id"
          "subscription_id_label.value" => "%{subscription_id}"
        }
        on_error => "subscription_id_label_replace_error"
      }
      if ![subscription_id_label_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" =>
              "subscription_id_label"
          }
          on_error => "subscription_id_label_merge_error"
        }
      }
    }
    if [resource_group] != "" {
      mutate {
        replace => {
          "resource_group_label.key" => "resource_group"
          "resource_group_label.value" => "%{resource_group}"
        }
        on_error => "resource_group_label_replace_error"
      }
      if ![resource_group_label_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" =>
              "resource_group_label"
          }
          on_error => "resource_group_label_merge_error"
        }
      }
    }
    if [resource_provider] != "" {
      mutate {
        replace => {
          "provider_label.key" => "provider"
          "provider_label.value" => "%{resource_provider}"
        }
        on_error => "provider_label_replace_error"
      }
      if ![provider_label_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" =>
              "provider_label"
          }
          on_error => "provider_label_merge_error"
        }
      }
    }
    if [registry_name] != "" {
      mutate {
        replace => {
          "registry_name_label.key" => "registry_name"
          "registry_name_label.value" => "%{registry_name}"
        }
        on_error => "registry_name_label_replace_error"
      }
      if ![registry_name_label_replace_error] {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.resource.attribute.labels" =>
              "registry_name_label"
          }
          on_error => "registry_name_label_merge_error"
        }
      }
    }
  }

  mutate {
    replace => {
      "result_type" => "%{resultType}"
    }
    on_error => "no_result_type"
  }

  if [result_type] != "" {
    mutate {
      replace => {
        "sec_result.summary" => "%{result_type}"
      }
      on_error => "result_type_replace_error"
    }
  }

  mutate {
    convert => {
      "resultDescription" => "string"
    }
    on_error => "result_description_str_convert_error"
  }

  mutate {
    replace => {
      "result_description" => "%{resultDescription}"
    }
    on_error => "no_result_description"
  }

  if [result_description] != "" {
    if [result_description] =~ "^[0-9]+$" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" =>
            "%{result_description}"
        }
        on_error => "http_response_code_replace_error"
      }
      mutate {
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
        on_error => "http_response_code_convert_error"
      }
    }
    if [result_description] =~ "^2[0-9][0-9]$" {
      mutate {
        replace => {
          "security_action" => "ALLOW"
        }
      }
    } else if [result_description] =~ "^[45][0-9][0-9]$" {
      mutate {
        replace => {
          "security_action" => "BLOCK"
        }
      }
    }
    if [security_action] != "" {
      mutate {
        merge => {
          "sec_result.action" => "security_action"
        }
        on_error => "security_action_merge_error"
      }
    }
  }

  if [sec_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "sec_result"
      }
      on_error => "sec_result_merge_error"
    }
  }

  if [operation_name] =~ "(?i)^Login$" and [has_target] == "true" and
    [has_principal] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_LOGIN"
        "event.idm.read_only_udm.extensions.auth.type" => "MACHINE"
      }
    }
  } else if [operation_name] =~ "(?i)^(Push|importImage)$" and
    [has_user] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_WRITTEN"
      }
    }
  } else if [operation_name] =~ "(?i)^(Delete|Untag|PurgeManifest|DeleteRepository)$" and
    [has_user] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "RESOURCE_DELETION"
      }
    }
  } else if [has_user] == "true" and [has_target] == "true" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_ACCESS"
      }
    }
  } else {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "GENERIC_EVENT"
      }
    }
  }

  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.vendor_name" => "Microsoft"
      "event.idm.read_only_udm.metadata.product_name" =>
        "Azure Container Registry"
      "event.idm.read_only_udm.target.resource.attribute.cloud.environment" =>
        "MICROSOFT_AZURE"
    }
  }

  mutate {
    merge => {
      "@output" => "event"
    }
    on_error => "output_merge_error"
  }
}
