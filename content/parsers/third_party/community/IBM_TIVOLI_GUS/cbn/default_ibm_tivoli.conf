# Product: IBM_TIVOLI
# Category: Monitoring
# Supported Format: JSON, SYSLOG
# Reference : https://www.ibm.com/docs/en/tivoli-monitoring/6.3.0?topic=introduction-overview-tivoli-monitoring
# Last Updated: 2024-03-15
# Copyright 2024 Chronicle LLC

filter{
  mutate {
    replace =>{
      "SourceModuleName" => ""
      "ServerName" => ""
      "SourceAddress" => ""
      "ConnectionID" => ""
      "Outcome" => ""
      "UserCN" => ""
      "Message" => ""
      "action" => ""
      "security_result" => ""
      "Action" => ""
      "uid" => ""
      "target_hostname" => ""
      "target_ip" => ""
      "target_hostorip" => ""
      "process" => ""
      "dvc" => ""
      "pid" => ""
      "hostname" => ""
      "username" => ""
      "method" => ""
      "response_code" => ""
      "protocol" => ""
      "src_ip" => ""
      "EventReceivedTime" => ""
      "url" => ""
      "agent" => ""
      "summary" => ""
      "proto" => ""
      "desc" => ""
      "reason" => ""
      "timestamp" => ""
      "TimeReceipt" => ""
      "datetime" => ""
      "msg1" => ""
      "msg2" => ""
      "srcIp" => ""
      "srcPort" => ""
      "datespace" => ""
      "timespace" => ""
      "action_code" => ""
      "extension" => ""
      "flag_type" => ""
      "role_user" => ""
      "more_info" => ""
      "host" => ""
      "roles" => ""
      "event_type" => ""
      "has_principal" => "false"
    }
  }
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "not_in_json"
  }
  if [not_in_json] {
    mutate {
      gsub => ["message",' \\"-\\" \\"-\\"', ""]
    }
    grok {
      match => {
        "message" => [
          '<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:process}\\[%{NUMBER:pid}\\] %{IPV4:src_ip}( %{IPV4})? - %{DATA:username} %{GREEDYDATA:datetime} \\"%{WORD:method} (%{GREEDYDATA:url})? %{DATA:protocol}\\"( \\-)? %{INT:response_code} %{DATA}( %{DATA})?(?: \\"%{GREEDYDATA:agent}\\"(?: %{DATA} \\"(%{IPORHOST:target_hostorip}\\")?| -\\")|"")'
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} Message forwarded from %{DATA:dvc}: %{DATA:process}(?:\\[%{NUMBER:pid}\\]|)(:)? %{GREEDYDATA:msg1}",
          '<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:process}\\[%{NUMBER:pid}\\] %{IPV4:src_ip}( %{IPV4})? - %{DATA:username} %{GREEDYDATA:datetime} \\"%{WORD:method} (%{DATA:url})? %{DATA:protocol}\\"( \\-)? %{INT:response_code} %{GREEDYDATA}'
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{DATA:dvc} %{DATA:process}\\[%{NUMBER:pid}\\]:%{SPACE}%{GREEDYDATA:msg1}",
          "<%{INT}>%{SYSLOGTIMESTAMP:timestamp} %{HOST:hostname} %{DATA:process}\\[%{NUMBER:pid}\\] %{GREEDYDATA:time}----- %{DATA:rule_name} %{DATA:logclientid} %{DATA:log_level} %{GREEDYDATA} %{DATA:source_file} %{INT} %{DATA} -- %{DATA:product_log_id}  %{GREEDYDATA:msg1}",
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %{DATA:process} %{NUMBER:pid} - - %{GREEDYDATA:msg1}"
          "<%{INT}>%{INT} %{TIMESTAMP_ISO8601:timestamp} %{DATA:hostname} %{DATA:process} - - - %{GREEDYDATA:msg1}"
          "%{DATE_US:datespace}\\s+%{TIME:timespace}\\s+%{DATA:action_code}\\s+%{GREEDYDATA:extension}"
        ]
      }
      overwrite => ["target_hostorip","process","username","hostname","method","response_code","protocol",
                    "agent","url","src_ip","dvc","pid","timestamp","datetime","msg1","datespace",
                    "timespace","action_code","extension"]
      on_error => "grok_failed"
    }
    if [grok_failed] {
      drop {
        tag => "TAG_MALFORMED_MESSAGE"
      }
    }
  }
  mutate {
    replace => {
      "event.idm.read_only_udm.metadata.product_name" => "IBM_TIVOLI"
      "event.idm.read_only_udm.metadata.vendor_name" => "IBM"
    }
  }
  if [timespace] != "" {
    mutate {
      gsub => ["timespace"," ", ""]
    }
  }
  if [datespace] != "" and [timespace] != "" {
    mutate {
      replace => {
        "timestamp" => "%{datespace} %{timespace}"
      }
      on_error => "no_datespace_timespace"
    }
  }
  if [timestamp] != "" {
    date {
      match => ["timestamp","ISO8601" ,"MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
      rebase => true
      on_error => "time_format_not_match"
    }
    if [time_format_not_match] {
      date {
        match => ["timestamp", "RFC3339", "yyyy-MM-ddTHH:mm:ss.SSSSSSZ", "MM/dd/yyyy HH:mm:ss", "UNIX_MS"]
        on_error => "time_format_not_match"
      }
    }
  }
  if [TimeReceipt] != "" {
    date {
      match => ["TimeReceipt", "yyyy-MM-ddTHH:mm:ss"]
      target => "event.idm.read_only_udm.metadata.collected_timestamp"
      on_error => "incorrect_format"
    }
  }
  if [EventReceivedTime] != "" {
    grok {
      match => {
        "EventReceivedTime" => ["%{YEAR:year}-%{MONTHNUM:month}-%{MONTHDAY:day}T%{HOUR:hour}:%{MINUTE:minute}:%{SECOND:second}\\.%{INT}(?P<zone>(?:-|/+))%{GREEDYDATA:timezone}"]
      }
    }
    mutate {
      gsub => ["timezone", ":", ""]
    }
    mutate {
      replace => {
        "EventReceivedTime" => "%{year}-%{month}-%{day}T%{hour}:%{minute}:%{second} %{zone}%{timezone}"
      }
    }
    date {
      match => ["EventReceivedTime", "yyyy-MM-ddTHH:mm:ss Z"]
      on_error => "invalid_date_format"
    }
  }
  if [SourceModuleName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.resource.name" => "%{SourceModuleName}"
      }
    }
  }
  if [ServerName] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.hostname" => "%{ServerName}"
        "event.idm.read_only_udm.principal.asset.hostname" => "%{ServerName}"
        "has_principal" => "true"
      }
      on_error => "no_hostname"
    }
  }
  if [ConnectionID] != "" {
    mutate {
      replace => {
        "connectionID_label.key" => "ConnectionID"
        "connectionID_label.value" => "%{ConnectionID}"
      }
    }
    mutate {
      merge => {
        "security_result.about.labels" => "connectionID_label"
      }
    }
  }
  if [UserCN] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.user.group_identifiers" => "UserCN"
      }
    }
  }
  if [SourceAddress] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.principal.ip" => "SourceAddress"
        "event.idm.read_only_udm.principal.asset.ip" => "SourceAddress"
      }
      on_error => "no_ip"
    }
    mutate {
      replace => {
        "has_principal" => "true"
      }
    }
  }
  if [Outcome] == "Success" {
    mutate {
      replace => {
        "action" => "ALLOW"
      }
    }
  }
  else if [Outcome] == "Invalid credentials" {
    mutate {
      replace => {
        "action" => "BLOCK"
      }
    }
  }

  if [action] != "" {
    mutate {
      merge => {
        "security_result.action" => "action"
      }
    }
  }
  if [Action] != "" {
    grok {
      match => {
        "Action" => ["%{DATA} %{DATA:tls_version}( %{WORD})? %{WORD:product_event_type}"]
      }
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.product_event_type" => "%{product_event_type}"
        "event.idm.read_only_udm.network.tls.version" => "%{tls_version}"
      }
    }
  }
  if [Message] =~ "uid" {
    grok {
      match => {
        "Message" => ["uid=%{WORD:uid}"]
      }
      overwrite => ["uid"]
    }
    mutate {
      replace => {
        "event.idm.read_only_udm.target.user.userid" => "%{uid}"
      }
    }
  }
  if [not_in_json] {
    if [hostname] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.hostname" => "%{hostname}"
          "event.idm.read_only_udm.principal.asset.hostname" => "%{hostname}"
          "has_principal" => "true"
        }
        on_error => "no_hostname"
      }
    }
    if [datetime] != "" {
      mutate {
        gsub => ["datetime", "\\[", ""]
      }
      mutate {
        gsub => ["datetime", "\\]", ""]
      }
      date {
        match => ["datetime", "dd/MMM/yyyy:HH:mm:ss Z"]
      }
    }
    if [username] != "" and [username] != "unauthenticated" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{username}"
        }
      }
    }
    if [method] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.method" => "%{method}"
        }
      }
    }
    if [response_code] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.response_code" => "%{response_code}"
        }
        convert => {
          "event.idm.read_only_udm.network.http.response_code" => "integer"
        }
      }
      if [response_code] =~ "[1-3][0-9]{2}" {
        mutate {
          replace => {
            "action" => "ALLOW"
          }
        }
      }
      else {
        mutate {
          replace => {
            "action" => "BLOCK"
          }
        }
      }
      if [action] != "" {
        mutate {
          merge => {
            "security_result.action" => "action"
          }
        }
      }
    }
    if [protocol] =~ "HTTP" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.application_protocol" => "HTTP"
        }
      }
    }
    if [src_ip] != "" {
      mutate {
        merge => {
          "event.idm.read_only_udm.principal.ip" => "src_ip"
          "event.idm.read_only_udm.principal.asset.ip" => "src_ip"
        }
        on_error => "no_ip"
      }
      mutate {
        replace => {
          "has_principal" => "true"
        }
      }
    }
    if [url] != "" and [url] != "/" {
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.referral_url" => "%{url}"
        }
      }
    }
    if [agent] != "-" and [agent] != ""{
      mutate {
        replace => {
          "event.idm.read_only_udm.network.http.user_agent" => "%{agent}"
        }
      }
      mutate {
        convert => {
          "agent" => "parseduseragent"
        }
      }
      mutate {
        rename => {
          "agent" => "event.idm.read_only_udm.network.http.parsed_user_agent"
        }
      }
    }
    if [target_hostorip] != "" {
      grok {
        match => {
          "target_hostorip" => ["%{IP:target_ip}", "%{HOSTNAME:target_hostname}"]
        }
        overwrite => ["target_ip", "target_hostname"]
      }
      if [target_hostname] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
            "event.idm.read_only_udm.target.asset.hostname" => "%{target_hostname}"
          }
          on_error => "no_hostname"
        }
        mutate {
          replace => {
            "event_type" => "NETWORK_HTTP"
          }
        }
      }
      if [target_ip] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.target.ip" => "target_ip"
            "event.idm.read_only_udm.target.asset.ip" => "target_ip"
          }
          on_error => "no_ip"
        }
        mutate {
          replace => {
            "event_type" => "NETWORK_HTTP"
          }
        }
      }
    }

    if [process] == "sshd" {
      grok {
        match => {
          "msg1" => ["(?P<action>Accepted (publickey|password)) for %{DATA:username} from %{IP:srcIp} port %{INT:srcPort} %{DATA:proto}: %{GREEDYDATA:hashing_algo}:%{GREEDYDATA}"
                      "(?P<action>Accepted (publickey|password)) for %{DATA:username} from %{IP:srcIp} port %{INT:srcPort} %{WORD:proto}",
                      "(?P<action>Received disconnect) from %{IP:srcIp}: %{INT:srcPort}: (?P<reason>.*?)",
                      "(?P<action>Received disconnect) from %{IP:srcIp} %{GREEDYDATA} %{INT:srcPort}:%{INT}: %{GREEDYDATA:reason}",
                      "(?P<action>Disconnected) from user (?P<username>.*?) %{IP:srcIp} port %{INT:srcPort}",
                      "(?P<action>Did not receive identification string) from %{IP:srcIp} port %{INT:srcPort}",
                      "(\\s)?pam_unix\\(sshd:session\\): (?P<action>session opened) for user (?P<username>.*?) %{GREEDYDATA}"
                      "(\\s)?pam_limits\\(sshd:session\\): %{GREEDYDATA:msg2}"
                      "(\\s)?pam_unix\\(sshd:session\\): (?P<action>session closed) for user (?P<username>.*?)\\\\%{GREEDYDATA}"
                      "(\\s)?pam_unix\\(sshd:session\\): (?P<action>session closed) for user %{GREEDYDATA:username}"
                      ]
        }
        overwrite => ["action","username","summary","proto","desc","reason", "msg2", "srcPort", "srcIp"]
      }
      if [dvc] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{dvc}"
            "event.idm.read_only_udm.target.asset.hostname" => "%{dvc}"
          }
          on_error => "no_hostname"
        }
      }
      if [username] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.user.userid" => "%{username}"
            "event_type" => "USER_UNCATEGORIZED"
          }
        }
      }
      if [srcPort] != "" {
        mutate {
          convert => {
            "srcPort" => "integer"
          }
        }
        mutate {
          rename => {
            "srcPort" => "event.idm.read_only_udm.principal.port"
          }
        }
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.target.application" => "%{process}"
        }
      }
      if [srcIp] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.ip" => "srcIp"
            "event.idm.read_only_udm.principal.asset.ip" => "srcIp"
          }
          on_error => "no_ip"
        }
        mutate {
          replace => {
            "has_principal" => "true"
          }
        }
      }
      if [proto] == "ssh" or [proto] == "ssh2" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.application_protocol" => "SSH"
          }
        }
      }
      if [summary] != "" {
        mutate {
          replace => {
            "security_result.summary" => "%{summary}"
          }
        }
      }
      else {
        if [desc] != "" {
          if [reason] != "" {
            mutate {
              replace => {
                "security_result.description" => "%{desc}: %{action} - %{reason}"
              }
            }
          }
          else {
            mutate {
              replace => {
                "security_result.description" => "%{action}"
              }
            }
          }
        }
        else {
          if [reason] != "" {
            mutate {
              replace => {
                "security_result.description" => "%{action} - %{reason}"
              }
            }
          }
          else {
            mutate {
              replace => {
                "security_result.description" => "%{action}"
              }
            }
          }
        }
        if [msg2] != "" {
          mutate {
            replace => {
              "security_result.description" => "%{msg2}"
            }
          }
        }
      }
      if [action] == "Accepted publickey" {
        mutate {
          replace => {
            "event_type" => "USER_UNCATEGORIZED"
            "event.idm.read_only_udm.principal.user.userid" => "%{username}"
          }
        }
        if [hashing_algo] != "" {
          mutate {
            merge => {
              "event.idm.read_only_udm.network.tls.client.supported_ciphers" => "hashing_algo"
            }
          }
        }
      }
      else if [action] == "Accepted password" {
        mutate {
          replace => {
            "event_type" => "USER_LOGIN"
            "event.idm.read_only_udm.target.user.userid" => "%{username}"
            "mechanism" => "USERNAME_PASSWORD"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
          }
        }
      }
      if [action] == "Received disconnect" {
        mutate {
          replace => {
            "event_type" => "NETWORK_CONNECTION"
          }
        }
      }
      else if [action] == "Disconnected" {
        if [username] != "" {
          mutate {
            replace => {
              "event.idm.read_only_udm.principal.user.userid" => "%{username}"
            }
          }
        }
        mutate {
          replace => {
            "event_type" => "USER_LOGOUT"
            "mechanism" => "NETWORK"
          }
        }
        mutate {
          merge => {
            "event.idm.read_only_udm.extensions.auth.mechanism" => "mechanism"
          }
        }
      }
    }
     else if [process] == "console" {
      mutate {
        replace => {
          "security_result.rule_name" => "%{rule_name}"
        }
      }
      if [log_level] == "ERROR" or [log_level] == "WARNING" {
        mutate {
          replace => {
            "sec_result.severity" => "ERROR"
          }
        }
      }
      mutate {
        rename => {
          "source_file" => "event.idm.read_only_udm.principal.process.file.full_path"
        }
      }
      if [product_log_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.metadata.product_log_id" => "%{product_log_id}"
            "event_type" => "NETWORK_CONNECTION"
          }
        }
      }
      if [msg1] =~ "POST" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.http.method" => "POST"
            "event.idm.read_only_udm.network.application_protocol" => "HTTP"
          }
        }
      }
      else if [msg1] =~ "TCP/IP" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.ip_protocol" => "TCP"
          }
        }
        grok {
          match => {
            "msg1" => ["hostname: %{HOST:target_hostname}"]
          }
          overwrite => ["target_hostname"]
        }
        mutate {
          replace => {
            "event.idm.read_only_udm.target.hostname" => "%{target_hostname}"
            "event.idm.read_only_udm.target.asset.hostname" => "%{target_hostname}"
          }
          on_error => "no_hostname"
        }
      }
      mutate {
        replace => {
          "security_result.description" => "%{msg1}"
        }
      }
    }
    else {
      mutate {
        replace => {
          "security_result.description" => "%{msg1}"
        }
      }
    }
  }
  if [action_code] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.product_log_id" => "%{action_code}"
        }
        on_error => "product_log_id_error"
      }
  }
  if [extension] != "" {
    mutate {
      replace => {
        "temp" => ""
        "temp1" => ""
        "temp2" => ""
        "session_id" => ""
      }
    }
    grok {
      match => {
        "extension" =>
          "%{DATA:flag_type}\\s+%{DATA:temp}\\s+%{DATA:temp1}\\s+%{DATA:temp2}\\s+%{DATA:role_user}\\s+%{DATA:username}\\s+%{GREEDYDATA:more_info}"
      }
      on_error => "extension_error"
      overwrite => ["flag_type","role_user","username","more_info","temp","temp1","temp2"]
    }
    mutate {
      replace => {
        "security_result.description" => "%{extension}"
      }
      on_error => "no_extension"
    }
    if [flag_type] != "" and [flag_type] != "Session" {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{flag_type}"
        }
        on_error => "username_failed_login_error"
      }
      mutate {
        replace => {
          "event_type" => "USER_UNCATEGORIZED"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.userid" => "%{username}"
        }
        on_error => "username_successful_login_error"
      }
      mutate {
        replace => {
          "event.idm.read_only_udm.principal.user.role_name" => "%{role_user}"
          "roles.name" => "%{role_user}"
        }
        on_error => "user_role_error"
      }
      if ![user_role_error] and [roles][name] != "" {
        mutate {
          merge => {
            "event.idm.read_only_udm.principal.user.attribute.roles" => "roles"
          }
          on_error => "no_roles"
        }
      }
      grok {
        match => {
          "more_info" => " on (?P<host>[A-Z0-9]{8}\.[a-z]{2}\.[a-z]{10})"
        }
        on_error => "hostname_regex_error"
        overwrite => ["host"]
      }
      if [host] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.principal.hostname" => "%{host}"
            "event.idm.read_only_udm.principal.asset.hostname" => "%{host}"
            "has_principal" => "true"
          }
          on_error => "hostname_error"
        }
      }
    }
    if [more_info] != "" {
      grok {
        match => {
          "more_info" => "\\(SESSION: %{DATA:session_id}\\)"
        }
        on_error => "session_id_regex_error"
        overwrite => ["session_id"]
      }
      if [session_id] != "" {
        mutate {
          replace => {
            "event.idm.read_only_udm.network.session_id" => "%{session_id}"
          }
          on_error => "no_session_id"
        }
      }
    }
  }
  if [pid] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.target.process.pid" => "%{pid}"
      }
    }
  }
  if [security_result] != "" {
    mutate {
      merge => {
        "event.idm.read_only_udm.security_result" => "security_result"
      }
    }
  }
  if [event_type] == "" {
    if [has_principal] == "true" {
      mutate {
        replace => {
          "event_type" => "STATUS_UPDATE"
        }
      }
    }
    else {
      mutate {
        replace => {
          "event_type" => "GENERIC_EVENT"
        }
      }
    }
  }
  if [event_type] != "" {
    mutate {
      replace => {
        "event.idm.read_only_udm.metadata.event_type" => "%{event_type}"
      }
      on_error => "no_event_type"
    }
  }
  mutate {
    merge => {
      "@output" => "event"
    }
  }
}
