Get Trust Monitor Events:
  ai_description: >-
    ### General Description

    Retrieves DUO Trust Monitor events from the specified number of days in the past
    using the DUO Admin API. This action is useful for gathering historical authentication
    telemetry and security events for analysis.


    ### Flow Description

    1. Extracts the `Number Days Back` action parameter to determine the time range.

    2. Calculates the start (`mintime`) and end (`maxtime`) timestamps based on the
    current time and the specified days back.

    3. Authenticates with the DUO Admin API using the configured integration credentials.

    4. Makes an API call (`get_trust_monitor_events_by_offset`) to fetch the Trust
    Monitor events within the calculated time window.

    5. Returns the retrieved events as a structured JSON result.


    ### Additional Notes

    This action requires DUO Admin API keys (Admin Secret Key and Admin Integration
    Key) to be configured in the integration settings.
