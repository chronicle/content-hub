Ping:
  ai_description: >-
    ### General Description

    This action uses the DUO Python SDK to ping the `/check` endpoint, verifying that
    the Auth API integration and secret keys are valid and that the signature is generated
    properly.


    ### Flow Description

    1. Extracts the integration-level configuration parameters: API Hostname, Auth
    Secret Key, and Auth Integration Key.

    2. Initiates a connection to the DUO service using the provided credentials.

    3. Calls the `/check` endpoint to verify the validity of the credentials.

    4. Returns a success message if the connection is successful, or an error message
    if it fails.


    ### Additional Notes

    This action is typically used as a connectivity test or health check for the DUO
    integration and does not process any entities or alerts.
