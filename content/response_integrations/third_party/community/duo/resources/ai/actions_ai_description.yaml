Get Authentication Logs for User:
  ai_description: >-
    ### General Description

    Retrieves user data and authentication logs for a specified user from DUO MFA
    over a specified number of days. It also outputs lists of authentication sources
    that meet a certain threshold of successful authentications, which helps in determining
    if an authentication source is normally seen.


    ### Flow Description

    1. Extracts configuration and action parameters including Username, Number Days
    Back, and Authentication Threshold.

    2. Calculates the timestamp range based on the 'Number Days Back' parameter.

    3. Initializes the DUO Admin API client.

    4. Fetches the user data from DUO using the provided username to obtain the `user_id`
    (API call).

    5. Fetches the authentication logs for the `user_id` within the calculated time
    range (API call).

    6. Parses the authentication logs to count successful authentications by IP, state,
    OS, application, endpoint key, auth device, and factor.

    7. Filters the counted authentication sources against the 'Authentication Threshold'.

    8. Constructs a JSON result containing the user data, raw auth logs, and the filtered
    counts of authentication sources.

    9. Returns the JSON result to the SecOps platform.


    ### Additional Notes

    Requires DUO Admin API keys to be configured in the integration settings.
  ai_short_description: >-
    Retrieves user data and authentication logs for a specified user from DUO MFA,
    and identifies frequently used authentication sources based on a threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches user data and authentication logs from DUO via API calls
      (fetches_data=true). It does not mutate external data, update internal entities,
      create insights, or modify alert data.
