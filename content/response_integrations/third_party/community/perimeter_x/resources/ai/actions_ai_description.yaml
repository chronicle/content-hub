Ping:
  ai_description: >-
    ### General Description

    The Ping action is used to test connectivity to Slack once the PerimeterX connector
    has been configured. It verifies that the provided Slack API key is valid and
    can successfully authenticate with the Slack API.


    ### Flow Description

    1. Extracts the Slack API Key and Slack Channel from the integration configuration.

    2. Initializes the PerimeterXManager with the extracted credentials.

    3. Makes a POST request to the Slack `auth.test` API endpoint to verify the authentication
    token.

    4. Returns a success message if the connection is established, or an error message
    if the authentication fails.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to Slack using the configured API key to ensure the PerimeterX
    integration is set up correctly.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
