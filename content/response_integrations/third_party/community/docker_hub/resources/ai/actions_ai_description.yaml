Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Docker Hub API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Retrieves the integration configuration credentials (Username and Password).

    2. Initializes the Docker Hub client and authenticates.

    3. Makes a GET request to the `_catalog` API endpoint to verify connectivity.

    4. Returns a successful execution status if the API responds without errors.


    ### Additional Notes

    Although the action's metadata description states it invites a user to a team,
    the underlying Python code exclusively performs a connectivity test (Ping).
