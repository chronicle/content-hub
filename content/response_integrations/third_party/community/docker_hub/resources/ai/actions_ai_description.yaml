Invite User:
  ai_description: >-
    ### General Description

    Invites a user to a specific team within a given organization in Docker Hub. This
    action initiates an invitation process for the specified email address to join
    the designated team and organization.


    ### Flow Description

    1. Retrieves the target organization, team, and email address from the action
    parameters.

    2. Authenticates with the Docker Hub API using the integration's credentials.

    3. Makes a POST request to the Docker Hub API (`/v2/orgs/{org}/groups/{team}/members`)
    to send the team invitation to the specified email address.

    4. Returns a success message and completes the action if the API call is successful.


    ### Additional Notes

    Ensure that the integration credentials have the necessary administrative privileges
    to invite users to the specified organization and team.
  ai_short_description: >-
    Invites a user to a specific team within a given organization in Docker Hub.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Sends an invitation to a user to join a specific team within an organization
      in Docker Hub.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Docker Hub API to send an invitation,
      which mutates external data. It does not fetch contextual data, mutate internal
      SOAR data, update entities, or create insights.
