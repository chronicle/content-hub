    external_data_mutation_explanation: >-
      Adds IP addresses to the Allow List for a specific site in Signal Sciences.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action performs a PUT request to the Signal Sciences API to add IP addresses
      to an allowlist, mutating external data. It does not fetch contextual enrichment
      data, update internal entities, create insights, or modify alert data.
