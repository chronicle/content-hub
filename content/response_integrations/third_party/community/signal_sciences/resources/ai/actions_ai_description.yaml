Add IP to Block List:
  ai_description: >-
    ### General Description

    Use the **Add IP to Block List** action to add specific IP addresses to the block
    list of a designated site in Signal Sciences. This action helps in preventing
    malicious or unwanted traffic from interacting with the protected site.


    ### Flow Description

    1. Extracts the `Site Name`, `IP Address`, and `Note` parameters from the action
    configuration.

    2. Collects target IP addresses from the `IP Address` parameter (comma-separated)
    and any associated Address entities in the case.

    3. Makes a GET request to the Signal Sciences API to retrieve the current block
    list for the specified site, ensuring duplicate entries are not processed.

    4. Iterates through the target IPs, validating whether each is a valid IPv4 or
    IPv6 address.

    5. For valid IPs not already on the block list, makes a PUT request to the Signal
    Sciences API to add them to the block list with the provided note.

    6. Compiles a list of successfully added and failed IPs, returning them as a JSON
    result and a summary output message.


    ### Additional Notes

    - The action supports both IPv4 and IPv6 addresses.

    - If an IP address is already present in the block list, it will be skipped and
    marked as successful without making an additional API call to add it.
