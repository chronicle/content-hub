Add IP to Allow List:
  ai_description: >-
    ### General Description

    Adds specified IP addresses to the Allow List for a specific site in Signal Sciences.


    ### Flow Description

    1. Extracts the `Site Name`, `IP Address`, and `Note` parameters.

    2. Collects IP addresses from the provided parameter and any target entities of
    type Address.

    3. Retrieves the current Allow List for the specified site via a GET request to
    the Signal Sciences API to check for existing entries.

    4. Iterates through the target IPs, validating their format (IPv4 or IPv6).

    5. If an IP is not already in the Allow List, it makes a PUT request to the Signal
    Sciences API to add the IP with the provided note.

    6. Returns a JSON result summarizing the successfully added and failed IP addresses.


    ### Additional Notes

    Supports both IPv4 and IPv6 addresses. If an IP address is already present in
    the Allow List, it will be skipped and marked as successful.
  ai_short_description: >-
    Adds specified IP addresses to the Allow List for a specific site in Signal Sciences.
  capabilities:
