    Sciences. This action ensures that the specified IP addresses are no longer trusted
    by default and are subject to standard security monitoring and blocking rules.


    ### Flow Description

    1. Extracts the `Site Name` and `IP Address` parameters.

    2. Combines the provided IP addresses with any target entities of type `Address`.

    3. Fetches the current allow list for the specified site via a GET request to
    the Signal Sciences API.

