Gather Remote Agent Datapoints:
  ai_description: >-
    ### General Description

    This action gathers remote agent datapoints and logs for troubleshooting and support
    purposes. It collects system load information, agent status, and error logs directly
    from the machine where the agent is installed.


    ### Flow Description

    1. Extracts the `IntegrationName` and `ConnectorName` from the action parameters.

    2. Collects agent information by reading the local `agent_status.json` file.

    3. Gathers agent load information by executing system commands such as `lscpu`,
    `uptime`, `free`, and `env`.

    4. Retrieves file information from the agent's working directory.

    5. Parses and collects error logs from the main agent log file and specific connector
    runner logs based on the provided integration and connector names.

    6. Outputs all the collected diagnostic information to the action logs.


    ### Additional Notes

    This action is designed to run locally on the Google SecOps (Chronicle) agent
    machine to gather diagnostic data and does not interact with external APIs or
    mutate any data.
  ai_short_description: >-
    Gathers diagnostic datapoints, system load information, and error logs from the
    local Siemplify agent machine for troubleshooting purposes.
