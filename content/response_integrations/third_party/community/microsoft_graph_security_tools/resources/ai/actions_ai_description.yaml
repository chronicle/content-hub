    external_data_mutation_explanation: >-
      Deletes a specific attachment from an email message in a user's Microsoft 365
      mailbox.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP DELETE request to the Microsoft Graph API to remove
      an attachment from an email message. This mutates external data. It does not
      fetch contextual data, update internal entities, or create insights.
