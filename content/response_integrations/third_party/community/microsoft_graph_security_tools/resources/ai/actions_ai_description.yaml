Delete Message:
  ai_description: >-
    ### General Description

    Deletes a specific email message from one or more user mailboxes using Microsoft
    Graph Security.


    ### Flow Description

    1. Extracts the `User ID` (or comma-separated list of User IDs) and the `Message
    ID` from the action parameters.

    2. Establishes a connection to Microsoft Graph Security using the provided integration
    credentials.

    3. Iterates through the provided User IDs (if multiple are provided) and makes
    a `DELETE` API call to Microsoft Graph (`https://graph.microsoft.com/v1.0/users/{user_id}/messages/{message_id}`)
    for each user to remove the specified message.

    4. Returns the status of the deletion request and attaches the result JSON to
    the action.


    ### Additional Notes

    The `User ID` parameter supports a CSV input to delete the same message ID from
    several mailboxes simultaneously.
