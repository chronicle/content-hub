Get User MFA:
  ai_description: >-
    ### General Description

    Retrieves Multi-Factor Authentication (MFA) statistics for a specified user and
    any valid email entities from Microsoft Graph Security. This action helps analysts
    understand the authentication posture of users involved in an investigation.


    ### Flow Description

    1. Extracts the 'User Email' and 'Create Insight' parameters.

    2. Authenticates and connects to the Microsoft Graph Security API.

    3. Fetches MFA statistics for the explicitly provided 'User Email' via a GET request
    to the Microsoft Graph API.

    4. Iterates through all target entities in the case, checking if their identifier
    contains an '@' symbol (indicating an email address).

    5. Fetches MFA statistics for each valid entity identifier found.

    6. Optionally creates a case insight for each user/entity with their MFA registration
    details (e.g., isRegistered, isEnabled, isMfaRegistered).

    7. Returns the collected MFA statistics as a JSON result.


    ### Additional Notes

    The action requires appropriate Microsoft Graph API permissions to read credential
    user registration details. The JSON result will always return the explicitly provided
    'User Email' input first at index zero.
  ai_short_description: >-
    Retrieves Multi-Factor Authentication (MFA) statistics for a specified user and
    any valid email entities from Microsoft Graph Security, optionally creating case
    insights with the results.
