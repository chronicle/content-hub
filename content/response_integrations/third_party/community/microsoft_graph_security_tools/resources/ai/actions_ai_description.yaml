Delete Attachment:
  ai_description: >-
    ### General Description

    Deletes a specific attachment from a user's mailbox using Microsoft Graph Security.
    This action initiates a state change on the external Microsoft 365 environment
    by removing the specified file from an email message.


    ### Flow Description

    1. Initializes the connection to the Microsoft Graph Security API using the provided
    integration credentials.

    2. Sends an HTTP DELETE request to the Microsoft Graph API targeting the specific
    user, message ID, and attachment ID.

    3. Evaluates the HTTP response code (expecting 204 No Content for success).

    4. Returns the status of the deletion request and outputs the result to the SOAR
    platform.


    ### Additional Notes

    This action requires the User ID (userPrincipalName or email), Message ID, and
    Attachment ID to successfully locate and delete the attachment.
  ai_short_description: >-
    Deletes a specific attachment from a user's mailbox using Microsoft Graph Security.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
