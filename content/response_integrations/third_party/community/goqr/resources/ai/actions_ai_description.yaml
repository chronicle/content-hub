Generate QR Code:
  ai_description: >-
    ### General Description

    Use the Generate QR Code action to create a QR code image from a provided string
    of data. This action doesn't run on Google SecOps entities.


    ### Flow Description

    1. Extracts the provided parameters including the content, size, image format,
    error correction level, margin, and colors.

    2. Calls the external API to generate the QR code based on the provided specifications.

    3. Saves the generated QR code bytes to a temporary file.

    4. Attaches the generated QR code image file to the case wall.

    5. Returns a JSON result containing the base64 encoded image and the generation
    parameters.


    ### Additional Notes

    This action does not run on Google SecOps entities.
  ai_short_description: >-
    Generates a QR code image from a provided string of data and attaches it to the
    case wall.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Attaches the generated QR code image file to the case wall.
    reasoning: >-
      The action calls an external API to generate a QR code, but it does not fetch
      contextual data on alerts/entities (fetches_data=false). It does not mutate
      external data (can_mutate_external_data=false). It mutates internal data by
      adding the generated QR code as an attachment to the case wall (can_mutate_internal_data=true).
      It does not update entities, create insights, modify alert data, or create case
      comments.
