Scan QR Code:
  ai_description: >-
    ### General Description

    The Scan QR Code action extracts and reads data from a QR code image provided
    in Base64 format using the GOQR API. It decodes the image and returns the embedded
    information as structured JSON data.


    ### Flow Description

    1. Retrieves the Base64-encoded QR code image from the action parameters.

    2. Decodes the Base64 string into a byte stream.

    3. Makes an API call to the GOQR service to read and decode the QR code image.

    4. Parses the API response to extract the decoded symbols and data.

    5. Returns the decoded QR code data as a JSON result.


    ### Additional Notes

    Ensure the provided Base64 string is a valid, recognizable QR code image. If the
    API cannot decode the image or no QR code data is found, the action will fail
    and return an error.
  ai_short_description: >-
    Extracts and reads data from a QR code image provided in Base64 format using the
    GOQR API.
