Enrich Actor:
  ai_description: >-
    ### General Description

    Enriches Threat Actor entities using Cybersixgill Darkfeed Enrichment. This action
    retrieves detailed information about a threat actor's activity in the underground,
    including all IOCs they have shared in the last 90 days, their areas of activity,
    choice of targets, and techniques.


    ### Flow Description

    1. Iterates over the target entities and filters for those of type `Threat Actor`.

    2. Makes an API call to the Cybersixgill Darkfeed service to fetch enrichment
    data for each valid threat actor.

    3. Parses the retrieved data and updates the entity's additional properties, marking
    the entity as enriched and suspicious.

    4. Generates a case insight and an entity table containing the enrichment details,
    including external references to VirusTotal and MITRE ATT&CK.

    5. Attaches the raw JSON results to the case.


    ### Additional Notes

    This action relies on the Cybersixgill Darkfeed Enrichment integration configuration
    for authentication. It specifically targets Threat Actor entities and will ignore
    other entity types.
  ai_short_description: >-
    Enriches Threat Actor entities using Cybersixgill Darkfeed Enrichment to retrieve
    underground activity, shared IOCs, and threat intelligence.
