      Updates entity properties, marks them as suspicious and enriched, and creates
      case insights.
    reasoning: >-
      The action fetches data from the Cybersixgill API (fetches_data=true). It does
      not mutate external data. It mutates internal data by updating entities with
      new properties and creating case insights (can_update_entities=true, can_create_insight=true).
