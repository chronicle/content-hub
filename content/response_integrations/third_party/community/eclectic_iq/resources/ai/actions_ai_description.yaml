Send Entities to EclecticIQ:
  ai_description: >-
    ### General Description

    Sends entities to EclecticIQ as sightings. By default, this action creates a sighting
    in the EclecticIQ Intelligence Center based on the case and its associated entities.
    Users also have the option to configure parameters to create an indicator entity
    alongside the sighting.


    ### Flow Description

    1. Extracts the `Group Name` and `Create Indicator` parameters.

    2. Initializes the EclecticIQ manager with the provided API credentials.

    3. Fetches the source ID for the specified group name via a GET request to the
    EclecticIQ API (`/private/groups/`).

    4. Constructs a payload containing a sighting (and optionally an indicator) with
    extracts mapped from the target entities' types and identifiers.

    5. Sends a PUT request to the EclecticIQ API (`/api/v2/entities`) to create the
    entities.

    6. Adds a comment to the case and attaches an entity link to the action results
    pointing to the created indicator in the EclecticIQ platform.


    ### Additional Notes

    The action maps specific Google SecOps entity types (e.g., Address, Hostname,
    FileHash, URL) to their corresponding EclecticIQ kinds (e.g., ipv4, host, hash-sha256,
    uri) before creating the extracts.
  ai_short_description: >-
    Sends case entities to EclecticIQ to create a sighting, with an option to also
    create an indicator entity.
  capabilities:
    can_create_case_comments: true
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a sighting and optionally an indicator in the EclecticIQ platform.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PUT request to the EclecticIQ API to create sightings and
      indicators, mutating external data. It does not fetch contextual data for enrichment,
      update internal entities, or create insights. It does create a case comment
      indicating success.
  entity_usage:
