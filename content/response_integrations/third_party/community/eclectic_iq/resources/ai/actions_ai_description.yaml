Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the EclecticIQ platform. This action verifies that the provided
    integration credentials and network settings are valid and can successfully communicate
    with the EclecticIQ API.


    ### Flow Description

    1. Retrieves the integration configuration parameters (URL, API Token, Verify
    SSL).

    2. Makes an HTTP GET request to the EclecticIQ `/api/v2/sources` endpoint to validate
    the credentials.

    3. Returns a success message if the connection is established and authenticated,
    or an error message if the connection fails.


    ### Additional Notes

    This action is primarily used for integration health checks and troubleshooting.
    It does not process any entities, alerts, or case data.
