Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches entities using EclecticIQ. This action retrieves threat intelligence
    data, such as observables and related entities, from the EclecticIQ platform to
    provide additional context for the target entities within the case.


    ### Flow Description

    1. Iterates through all target entities in the case.

    2. Makes a GET request to the EclecticIQ API to fetch observable information based
    on the entity identifiers.

    3. Makes a subsequent GET request to fetch related entities for the retrieved
    observables.

    4. Parses the retrieved data and updates the entities in Google SecOps with the
    enrichment information.

    5. Attaches entity links and data tables to the case wall for analyst review.


    ### Additional Notes

    Entities that are not found in EclecticIQ will be listed in the output message
    but will not cause the action to fail.
  ai_short_description: >-
    Enriches entities by retrieving observable and threat intelligence data from EclecticIQ.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entities with enrichment data retrieved from EclecticIQ.
    reasoning: >-
      The action fetches data from the EclecticIQ API via GET requests (fetches_data=true).
      It does not mutate external data (can_mutate_external_data=false). It updates
      the entities within Google SecOps with the retrieved enrichment data (can_mutate_internal_data=true,
      can_update_entities=true). It does not create insights, modify alert data, or
      create case comments.
  entity_usage:
