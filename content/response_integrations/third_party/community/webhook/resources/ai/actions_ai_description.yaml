Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Webhook service. This action verifies that the Google
    SecOps platform can successfully communicate with the configured Webhook base
    URL.


    ### Flow Description

    1. Retrieves the Webhook base URL from the integration configuration.

    2. Initializes the WebhookManager.

    3. Makes an HTTP GET request to the base URL to test connectivity.

    4. Returns a success message if the HTTP status code indicates success, or an
    error message if the connection fails.


    ### Additional Notes

    This is a utility action primarily used to verify integration configuration and
    network access. It does not interact with case entities or modify any data.
