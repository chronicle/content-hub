Create Token:
  ai_description: >-
    ### General Description

    Creates a token for a new webhook on the configured webhook service. This action
    generates a unique webhook URL that can be used to receive incoming HTTP requests,
    returning the specified default content and content type.


    ### Flow Description

    1. Extracts the action parameters: `Default Content`, `Default Content Type`,
    and `Timeout`.

    2. Initializes the `WebhookManager` with the integration's base URL.

    3. Makes a POST request to the webhook service's `/token` endpoint to create a
    new token with the specified attributes.

    4. Constructs the full webhook URL using the returned UUID and base URL.

    5. Returns the generated webhook details as a JSON result.


    ### Additional Notes

    The `Timeout` parameter can be used to simulate delayed responses for testing
    purposes.
  ai_short_description: >-
    Creates a new webhook token on the external webhook service and returns the generated
    webhook URL along with its configuration details.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new webhook token on the external webhook service.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the webhook service to create a new token,
      which mutates external data. It does not fetch contextual data, update internal
      entities, or create insights.
