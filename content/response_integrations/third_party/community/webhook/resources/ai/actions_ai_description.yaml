Get Webhook Response:
  ai_description: >-
    ### General Description

    Fetches data of requests made to a specific webhook URL (Base URL/Token ID). The
    action can wait for a specified timeframe or until a first click (request) is
    detected before retrieving the responses.


    ### Flow Description

    1. Initializes the WebhookManager with the base URL.

    2. Evaluates the pending condition (`TimeFrame` or `AwaitClick`).

    3. If `TimeFrame` is selected, the action waits for the specified duration before
    making a GET request to the webhook endpoint to retrieve the requests.

    4. If `AwaitClick` is selected, the action periodically makes a GET request to
    the webhook endpoint until at least one request is detected.

    5. Filters out automated Slackbot requests and returns either all or the latest
    request data based on the configuration.

    6. Outputs the retrieved request data as a JSON result.


    ### Additional Notes

    This is an asynchronous action that will run in the background until the specified
    condition is met.
  ai_short_description: >-
    Fetches request data for a specific webhook URL, optionally waiting for a specified
    timeframe or until a request is detected.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to a webhook service to fetch request data (fetches_data=true).
      It does not perform any state-changing operations on external systems (can_mutate_external_data=false)
