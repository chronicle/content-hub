Delete Token:
  ai_description: >-
    ### General Description

    Deletes a specific Webhook token by its ID using the Webhook service. This action
    initiates a state change on the external service to remove the token, rendering
    the associated webhook URL inaccessible.


    ### Flow Description

    1. Extracts the `Token ID` parameter provided by the user or playbook.

    2. Initializes the WebhookManager with the integration's base URL.

    3. Makes a DELETE API call (`DELETE /token/{token_id}`) to the external Webhook
    service to remove the specified token.

    4. Returns the execution status and a success or failure message based on the
    API response.


    ### Additional Notes

    This action permanently removes the token from the Webhook service. Ensure the
    correct Token ID is provided to avoid unintended deletions.
  ai_short_description: >-
    Deletes a specific Webhook token by its ID on the external Webhook service, rendering
    the associated webhook URL inaccessible.
