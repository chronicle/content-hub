Ping:
  ai_description: >-
    ### General Description

    The Ping action is used to check connectivity to the beSECURE platform. It verifies
    that the provided API key and URL are valid and that the platform is reachable
    by attempting to retrieve network information.


    ### Flow Description

    1. Retrieves the integration configuration parameters, including the API Key,
    URL, and SSL verification settings.

    2. Makes an HTTP GET request to the beSECURE API (`/json.cgi`) with the action
    set to `returnnetworks`.

    3. Evaluates the API response to ensure no errors are returned.

    4. Outputs a success message if connectivity is established, or an error message
    if the connection fails.


    ### Additional Notes

    This action is typically used as a health check or ping test for the integration
    and does not require any action-specific parameters.
  ai_short_description: >-
    Checks connectivity to the beSECURE platform by making a test API call to retrieve
    network information.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the beSECURE API to verify connectivity. It
      does not fetch contextual data for alerts/entities, does not mutate external
      or internal data, does not update entities, and does not create insights or
      case comments.
