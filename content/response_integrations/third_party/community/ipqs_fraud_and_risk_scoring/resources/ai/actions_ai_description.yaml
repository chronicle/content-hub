Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the IPQS Fraud and Risk Scoring server.


    ### Flow Description

    1. Extracts the API key from the integration configuration.

    2. Makes a POST request to the IPQS email endpoint using a test email address
    (`support@ipqualityscore.com`).

    3. Evaluates the response to determine if the connection was successful.

    4. Returns a success or failure status based on the API response.


    ### Additional Notes

    This action is typically used to verify integration credentials and network connectivity.
    It does not process any case entities.
