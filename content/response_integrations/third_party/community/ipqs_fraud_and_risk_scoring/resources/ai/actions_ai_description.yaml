Enrich Domain:
  ai_description: >-
    ### General Description

    Enriches Hostname entities using IPQualityScore (IPQS) Fraud and Risk Scoring.
    It scans domains in real-time to detect suspicious URLs, phishing links, malware,
    and parked domains, providing a risk score and threat classification.


    ### Flow Description

    1. Extracts the `Strictness` and `Fast` parameters from the action configuration.

    2. Iterates over the target entities, filtering specifically for Hostname entities.

    3. For each valid Hostname, makes a POST request to the IPQS API (`https://ipqualityscore.com/api/json/url`)
    to fetch domain and URL intelligence.

    4. Parses the API response to extract risk scores, malware/phishing indicators,
    and domain age.

    5. Creates a case insight with the IPQS verdict and risk criticality.

    6. Enriches the entity with the retrieved data, updates its suspicious status
    if applicable, and saves the changes back to the platform.


    ### Additional Notes

    The action relies on the IPQS API key configured in the integration settings.
    Although the API request uses the POST method, it functions as a data query and
    does not mutate external state.
  ai_short_description: >-
    Enriches Hostname entities using IPQualityScore to detect suspicious domains,
    phishing links, and malware, providing real-time risk scores and threat intelligence.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the IPQS API. It does not mutate external data
      (the POST request is used for querying). It updates internal entities via `siemplify.update_entities`
      and creates insights via `siemplify.create_case_insight`.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: false
      generic: false
      host_name: true
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action iterates over `siemplify.target_entities` and passes `[EntityTypes.HOSTNAME]`
      to the `enrich` method. The `enrich` method filters entities using `if entity.entity_type
      in entity_types`, meaning this action strictly targets Hostname entities and
      filters them by their entity type.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: false
    enrich_ioc: true
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action fetches threat intelligence, risk scores, and reputation data for
      domains (Hostnames) from IPQualityScore. This directly aligns with the 'Enrich
      IOC' expected outcome.
