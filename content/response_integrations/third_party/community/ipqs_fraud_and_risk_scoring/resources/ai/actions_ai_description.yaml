    using lighter checks and analysis. |
Enrich Email:
  ai_description: >-
    ### General Description

    Enriches User entities representing email addresses using the IPQS Fraud and Risk
    Scoring API. It provides real-time reputation scoring, syntax validation, and
    DNS checks to detect disposable emails, fraudulent behavior, and recent abuse.


    ### Flow Description

    1. Extracts action parameters including `Abuse Strictness`, `Fast`, `Timeout in
    seconds`, and `Suggest Domain`.

    2. Iterates through the target entities, filtering specifically for `User` entities
    whose identifiers match a standard email address format.

    3. Sends a POST request to the IPQS API (`https://ipqualityscore.com/api/json/email`)
    to retrieve reputation, validation, and risk data for each valid email address.

    4. Evaluates the returned fraud score and other metrics (e.g., disposable, valid)
    to determine a risk verdict (e.g., CLEAN, SUSPICIOUS, CRITICAL).

    5. Updates the entity's properties with the retrieved data, marks it as enriched,
    and updates its suspicious status if the risk score exceeds safe thresholds.

    6. Generates a case insight and attaches the detailed results as an entity table
    and JSON to the case.


    ### Additional Notes

    Although the IPQSManager class supports multiple entity types (IP, URL, Phone),
    this specific action (`EnrichEmail.py`) is hardcoded to only process `User` entities
    that contain valid email addresses.
  ai_short_description: >-
    Enriches User entities containing email addresses using IPQS to retrieve real-time
    reputation scoring, fraud risk, and validation data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the IPQS API using a POST request (which acts as
      a query in this API design). It does not mutate external data. It updates internal
      entities with the retrieved data (`siemplify.update_entities`) and creates case
      insights (`siemplify.create_case_insight`).
  entity_usage:
