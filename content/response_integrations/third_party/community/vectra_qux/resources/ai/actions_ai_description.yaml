Remove Group:
  ai_description: >-
    ### General Description

    Removes specified members from a given group in VectraQUX. This action modifies
    the membership of an existing group by removing the provided list of members (which
    can be IPs, hosts, accounts, or domains depending on the group type).


    ### Flow Description

    1. Extracts the `Group ID` and `Members` from the action parameters.

    2. Makes a GET request to the VectraQUX API to fetch the current members of the
    specified group.

    3. Makes a PATCH request to the VectraQUX API to remove the specified members
    from the group.

    4. Compares the updated group members with the previous list to determine which
    members were successfully removed and which were not.

    5. Returns the updated group details as a JSON result and renders an HTML table
    displaying the removed members.


    ### Additional Notes

