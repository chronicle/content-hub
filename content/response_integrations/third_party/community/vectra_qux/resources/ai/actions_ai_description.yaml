Search Hosts:
  ai_description: >-
    ### General Description

    The Search Hosts action queries the Vectra API to retrieve a list of hosts based
    on various filtering parameters. It allows users to search for hosts using criteria
    such as tags, state, threat score, certainty score, last detection timestamps,
    privilege levels, and active traffic. The action returns the matching hosts' details
    as a JSON result and a data table.


    ### Flow Description

    1. Extracts configuration parameters (API Root, API Token, Verify SSL) and action
    parameters (Limit, Tags, Name, State, Threat GTE, etc.).

    2. Validates and formats the input parameters, ensuring integer values are correct
    and string values are properly cased.

    3. Initializes the `VectraQUXManager` to handle API communication.

    4. Calls the `search_hosts` method, which sends a paginated `GET` request to the
    Vectra API (`/api/v2.5/hosts`) with the constructed query parameters.

    5. Processes the returned host records, removing API version strings from URLs.

    6. Constructs a JSON result containing the full host data and a CSV-formatted
    data table with mandatory fields.

    7. Returns the results to the Google SecOps platform.


    ### Additional Notes

    - The action uses pagination to retrieve results up to the specified `Limit`.

    - If the `Order` parameter is set to 'Descending', a minus sign is prepended to
    the `Order By` field for the API request.
