Add Tags:
  ai_description: >-
    ### General Description

    Adds tags to specified entities (Account, Host, or Detection) in VectraQUX. This
    action retrieves the existing tags for the provided entity IDs, appends the new
    tags, and updates the entities in the external system.


    ### Flow Description

    1. Extracts the provided tags, entity IDs, and entity type from the action parameters.

    2. Iterates through the provided entity IDs.

    3. For each entity ID, makes a GET request to the VectraQUX API to fetch the currently
    assigned tags.

    4. Combines the existing tags with the new tags, ensuring no duplicates are added.

    5. Makes a PATCH request to the VectraQUX API to update the entity with the combined
    list of tags.

    6. Collects the status of each update and returns a summary table and JSON result.


    ### Additional Notes

    The action requires valid VectraQUX entity IDs and the corresponding entity type
    (Account, Host, or Detection). Multiple tags and entity IDs can be provided as
    comma-separated strings.
  ai_short_description: >-
    Adds tags to specified entities (Account, Host, or Detection) in VectraQUX.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
