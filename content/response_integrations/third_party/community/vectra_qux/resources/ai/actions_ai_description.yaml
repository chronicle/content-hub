Update Assignment:
  ai_description: >-
    ### General Description

    Updates the assigned user for a specific entity's assignment in Vectra QUX.


    ### Flow Description

    1. Retrieves the entity details from Vectra QUX using the provided Entity ID and
    Entity Type via a GET request.

    2. Extracts the assignment ID associated with the entity.

    3. Makes a PUT request to the Vectra QUX API to update the assignment with the
    provided User ID.

    4. Returns the updated assignment details and adds them to the action results.


    ### Additional Notes

