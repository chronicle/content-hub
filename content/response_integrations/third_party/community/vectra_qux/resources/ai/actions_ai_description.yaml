Add Note:
  ai_description: >-
    ### General Description

    Adds a note to a specific entity (Account, Host, or Detection) in VectraQUX.


    ### Flow Description

    1. Extracts the `Note`, `Entity ID`, and `Entity Type` from the action parameters.

    2. Validates the provided `Entity ID` to ensure it is a valid integer.

    3. Makes a POST request to the VectraQUX API to append the note to the specified
    entity.

    4. Retrieves the response and attaches the result as a data table and JSON object
    to the action results.


    ### Additional Notes

    The `Entity Type` parameter must be one of the supported types: Account, Host,
    or Detection.
