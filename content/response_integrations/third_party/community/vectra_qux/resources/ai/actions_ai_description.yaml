    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the tags associated with specific entities (Account, Host, or Detection)
      in VectraQUX.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches existing tags using a GET request and then mutates external
      data by making a PATCH request to update the tags on the VectraQUX entity. It
      does not mutate internal SOAR data, update SOAR entities, or create insights.
