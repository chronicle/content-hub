Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cybersixgill DVE Enrichment service to ensure that the
    integration is configured correctly with valid credentials.


    ### Flow Description

    1. Extracts the `Client Id` and `Client Secret` from the integration configuration.

    2. Initializes the Cybersixgill manager with the provided credentials.

    3. Makes an API call to the Cybersixgill service to request an access token, verifying
    the connection.

    4. Returns a success message if the token is retrieved successfully, or a failure
    message if the connection fails.


    ### Additional Notes

    This is a standard Ping action used primarily for health checks and configuration
    validation. It does not process alerts or entities.
  ai_short_description: >-
    Tests connectivity to the Cybersixgill DVE Enrichment service by attempting to
    authenticate and retrieve an access token.
