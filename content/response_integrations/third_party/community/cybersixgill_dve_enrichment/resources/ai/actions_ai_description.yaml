Enrich CVE:
  ai_description: >-
    ### General Description

    Enriches CVE entities using Cybersixgill's Dynamic Vulnerability Exploit (DVE)
    Score. This action retrieves threat intelligence, dynamic attributes, and NVD
    data to provide deeper visibility into vulnerabilities, allowing analysts to accurately
    understand the real impact of CVEs and effectively prioritize them.


    ### Flow Description

    1. Iterates through the target entities provided in the case and filters for entities
    of type `CVE`.

    2. Makes an API call to Cybersixgill to fetch DVE enrichment data for each valid
    CVE identifier.

    3. Updates the entity's `additional_properties` with the retrieved data and marks
    the entity as enriched.

    4. Generates a case insight containing the DVE score, NVD details, and exploitability
    probability.

    5. Attaches a detailed table and JSON results to the entity within the platform.


    ### Additional Notes

    This action relies on the Cybersixgill integration configuration (Client ID and
    Client Secret) to authenticate and fetch data. It will ignore any entities that
    are not of type `CVE`.
  ai_short_description: >-
    Enriches CVE entities with Cybersixgill's Dynamic Vulnerability Exploit (DVE)
    Score and threat intelligence data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an API request to Cybersixgill to fetch CVE enrichment data
      (fetches_data=true). It does not mutate external data (can_mutate_external_data=false).
      It updates internal entities via `siemplify.update_entities` (can_update_entities=true)
      and creates case insights via `siemplify.create_case_insight` (can_create_insight=true).
