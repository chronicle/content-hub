Spelling Check:
  ai_description: >-
    ### General Description

    Evaluates a provided text string to identify misspelled words and suggests likely
    correct spellings based on word frequency. This action utilizes a local spell-checking
    library to process the text and returns the identified mistakes along with recommended
    corrections.


    ### Flow Description

    1. Retrieves the input text from the action parameters.

    2. Cleans the text using regular expressions to remove special characters, URLs,
    and email addresses.

    3. Processes the cleaned text using a local spell-checking library to identify
    unknown or misspelled words.

    4. Generates a list of candidate corrections for each identified misspelling.

    5. Outputs the results as a JSON object and a data table, returning the total
    count of mistakes found.


    ### Additional Notes

    The action utilizes a predefined allowlist of common tech and cybersecurity terms
    (e.g., "microsoft", "siemplify", "playbook") to prevent false positives. It operates
    entirely locally and does not make external API calls.
  ai_short_description: >-
    Evaluates a provided text string to identify misspelled words and suggests likely
    correct spellings based on word frequency using a local spell-checking library.
