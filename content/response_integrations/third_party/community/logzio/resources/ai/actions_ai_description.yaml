Ping:
  ai_description: >-
    ### General Description

    Pings Logz.io to test and validate connectivity to both the Logz.io security and
    operations accounts.


    ### Flow Description

    1. Extracts integration configuration parameters including the security token,
    operations token, and region.

    2. Validates the format of the provided tokens.

    3. Sends a GET request to the Logz.io API (`v1/account-management/whoami`) using
    the operations token to verify connectivity.

    4. Sends a GET request to the Logz.io API using the security token to verify connectivity.

    5. Returns a successful execution state if both API calls return a 200 status
    code.


    ### Additional Notes

    This action is primarily used for testing integration connectivity and does not
    process entities or modify data.
  ai_short_description: >-
    Pings Logz.io to test and validate connectivity to both the Logz.io security and
    operations accounts.
