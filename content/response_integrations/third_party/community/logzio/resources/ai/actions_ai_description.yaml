logzio-get-logs-by-event-id:
  ai_description: >-
    ### General Description

    Fetches the logs that triggered a specific security event from Logz.io. The logs
    are returned as a paginated list in JSON format and attached to the case as insights.


    ### Flow Description

    1. Extracts the `alert_event_id` and `page_size` parameters.

    2. Constructs a request body to search for logs matching the event ID.

    3. Makes a POST request to the Logz.io API (`v2/security/rules/events/logs/search`)
    to fetch the logs.

    4. Paginates through the results concurrently if there are multiple pages.

    5. Aggregates the retrieved logs into a JSON result and adds it to the action's
    results.

    6. Creates case insights in Google SecOps containing the retrieved logs.


    ### Additional Notes

    The action uses concurrent threads to fetch multiple pages of logs efficiently.
