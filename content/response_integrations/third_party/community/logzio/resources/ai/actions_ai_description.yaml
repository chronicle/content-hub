json-adapter:
  ai_description: >-
    ### General Description

    Converts raw JSON logs (specifically designed for Logz.io logs) into a standardized
    JSON format compatible with Google SecOps (Siemplify) playbooks by extracting
    specific fields. It acts as a data parsing utility to map arbitrary JSON fields
    into structured entity types and identifiers.


    ### Flow Description

    1. Extracts the raw JSON data and the comma-separated list of fields to search
    from the action parameters.

    2. Parses the raw JSON string into a Python dictionary object.

    3. Iterates through the `results` array within the parsed JSON object.

    4. For each result, checks if any of the specified fields exist.

    5. If a field is found, it maps the data to a standardized format containing `entityType`
    (the field name) and `entityIdentifier` (the field value).

    6. Aggregates all mapped results and outputs them as a JSON result to the playbook.


    ### Additional Notes

    This action operates entirely locally within the SOAR platform and does not make
    any external API calls. It strictly expects the input JSON to contain a `results`
    array (e.g., `{"results": [{...}]}`).
  ai_short_description: >-
    Parses raw JSON logs to extract specified fields and converts them into a standardized
    JSON format containing entity types and identifiers for use in playbooks.
