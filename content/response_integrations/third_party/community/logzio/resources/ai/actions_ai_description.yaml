logzio-search-logs:
  ai_description: >-
    ### General Description

    Searches logs in a Logz.io operations account using a specified Lucene query and
    time range. It retrieves the matching log entries and returns them as a JSON object
    for further analysis or processing within the playbook.


    ### Flow Description

    1. Extracts configuration parameters (API token, region, custom endpoint) and
    action parameters (query, size, from_time, to_time).

    2. Validates and formats the time parameters into Unix timestamps using the `dateparser`
    library.

    3. Constructs a search request body using the provided Lucene query and time filters.

    4. Makes an HTTP POST request to the Logz.io Search API (`/v1/search`) to retrieve
    matching logs.

    5. Parses the API response and extracts the log values from the hits.

    6. Returns the retrieved logs as a JSON result and completes the action execution.


    ### Additional Notes

    The maximum number of logs that can be retrieved per query is 1000. If no size
    is provided, it defaults to 1000. Time parameters accept Unix timestamps, relative
    time, or specific date formats supported by the `dateparser` library.
  ai_short_description: >-
    Searches logs in a Logz.io operations account using a specified Lucene query and
    time range, returning the results as a JSON object.
