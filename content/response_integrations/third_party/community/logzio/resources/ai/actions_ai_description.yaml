    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes GET requests to the Logz.io API to validate connectivity and
      tokens. It does not fetch contextual data for alerts or entities, nor does it
      mutate any external or internal data.
