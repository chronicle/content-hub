Ping:
  ai_description: >-
    ### General Description

    The Ping action tests connectivity to the Country Flags API. It verifies that
    the integration can successfully communicate with the external service by attempting
    to retrieve a sample country flag.


    ### Flow Description

    1. Initializes the action and attempts to load a local cache file (`flags.json`).

    2. Checks if the base64 encoded flag for the hardcoded country code ("us") exists
    in the cache.

    3. If the flag is not cached, makes an HTTP GET request to `https://www.countryflags.io/{country_code}/flat/64.png`.

    4. Base64 encodes the retrieved image content.

    5. Returns a successful execution state if the flag data is successfully retrieved,
    otherwise fails.


    ### Additional Notes

    This action does not require any parameters and is primarily used to validate
    the integration's network connectivity and configuration.
