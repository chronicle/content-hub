Get Country Flag:
  ai_description: >-
    ### General Description

    Retrieves the national flag of a specified country as a base64-encoded string.
    It can fetch flags based on a direct two-digit country code input or by extracting
    country codes from the additional properties of target entities. The action queries
    `countryflags.io` to download the flag image and caches the results locally to
    optimize future requests.


    ### Flow Description

    1. Reads the local cache file to check for previously downloaded flags.

    2. Retrieves the `Country Code Two Digit` and `Country Code From Entity Field`
    parameters.

    3. Iterates through target entities. If a specified field exists in an entity's
    additional properties, it extracts the country code.

    4. For each identified country code (from entities or direct input), checks if
    the flag is already in the local cache.

    5. If not cached, makes an HTTP GET request to `https://www.countryflags.io/{}/flat/64.png`
    to fetch the flag image.

    6. Encodes the retrieved image into a base64 string and updates the cache.

    7. Returns the base64 strings as a JSON result.


    ### Additional Notes

    The action relies on `countryflags.io` for fetching images. It uses a local JSON
    file within the run folder to cache base64 strings of previously fetched flags,
    reducing redundant API calls.
  ai_short_description: >-
    Retrieves a country's flag as a base64-encoded string from countryflags.io using
    a direct country code or by extracting it from entity properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
