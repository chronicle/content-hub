Indicators Custom Query:
  ai_description: >-
    ### General Description

    Executes a custom query in Flashpoint to retrieve specific indicators of compromise
    (IOCs), such as events and attributes, based on user-defined criteria.


    ### Flow Description

    1. Extracts action parameters including Limit, Start Date, End Date, Search Tags,
    Query, Sort By Time, Entity Types, and Indicator Type.

    2. Initializes the FlashpointManager using the integration's API key.

    3. Makes a GET request to the Flashpoint API (`/indicators/{basetypes_path}`)
    to fetch the custom query results based on the provided parameters.

    4. Returns the fetched data as a JSON result to the SecOps platform.


    ### Additional Notes

    This action does not operate on SecOps entities directly; it relies entirely on
    the provided input parameters to query Flashpoint and returns the raw JSON response.
