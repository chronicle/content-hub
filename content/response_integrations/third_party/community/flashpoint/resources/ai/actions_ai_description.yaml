Custom Query:
  ai_description: >-
    ### General Description

    Executes a custom query against the Flashpoint API. This action allows users to
    send a custom JSON payload to a specified Flashpoint API endpoint, enabling flexible
    interactions with the platform's search and data retrieval capabilities.


    ### Flow Description

    1. Extracts the `Query Content` (JSON payload) and `New Query URL` (API path)
    from the action parameters.

    2. Initializes the Flashpoint API client with the provided API key.

    3. Constructs the full request URL and sends an HTTP POST request containing the
    parsed JSON payload to the Flashpoint API.

    4. Retrieves the JSON response from the API and attaches it to the action's results.


    ### Additional Notes

    While the default configuration targets the `/all/search` endpoint for querying
    data, the action uses an HTTP POST request and can technically interact with any
    Flashpoint API endpoint that accepts a JSON body.
  ai_short_description: >-
    Executes a custom HTTP POST query against a specified Flashpoint API endpoint
    and returns the JSON results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Executes an HTTP POST request to a user-defined Flashpoint API endpoint, which
      could potentially be used to mutate data depending on the provided URL path
      and payload.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by returning the JSON response of the custom query.
      Because it executes an HTTP POST request to a user-defined endpoint, it technically
      has the capability to mutate external data if the user provides a mutation endpoint.
      It does not mutate internal SecOps data, update entities, create insights, or
      add case comments.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
