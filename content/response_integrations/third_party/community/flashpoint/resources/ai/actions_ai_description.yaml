Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Flashpoint API to ensure the integration is configured
    correctly and the provided credentials are valid.


    ### Flow Description

    1. Extracts the API key from the integration configuration.

    2. Initializes the FlashpointManager.

    3. Makes a GET request to the Flashpoint `/all/search` API endpoint with a basic
    query to verify authentication and network connectivity.

    4. Returns a success message if the connection is established, or fails otherwise.


    ### Additional Notes

    This action is typically used for setup, health checks, and debugging purposes.
    It does not interact with case entities or alerts.
