IOC_Enrichment:
  ai_description: >-
    ### General Description

    Enriches indicator entities using Flashpoint. This action retrieves threat intelligence
    attributes for the target entities from Flashpoint to provide additional context
    and risk evaluation.


    ### Flow Description

    1. Extracts the `Limit` parameter to determine the maximum number of results to
    retrieve.

    2. Iterates through all target entities provided to the action.

    3. Makes a GET request to the Flashpoint API (`/indicators/attribute`) to fetch
    enrichment data for each entity identifier.

    4. If data is found, it flattens the JSON report, prefixes keys with "FlashPoint",
    and updates the entity's additional properties.

    5. Marks the entity as enriched and suspicious in memory.

    6. Generates an insight indicating the entity was marked as suspicious by Flashpoint.

    7. Returns the enrichment report as JSON results.


    ### Additional Notes

    The action modifies entity properties (e.g., `is_suspicious`, `is_enriched`, `additional_properties`)
    in memory but does not explicitly call the `update_entities` method to save these
    changes back to the platform.
  ai_short_description: >-
    Enriches indicator entities by retrieving threat intelligence attributes from
    Flashpoint and generates insights for suspicious entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Flashpoint API via a GET request. It does not
      mutate external or internal data. It creates insights using `add_entity_insight`.
      Although it modifies entity properties in memory, it does not explicitly call
      `update_entities` to save them, so `can_update_entities` is false.
