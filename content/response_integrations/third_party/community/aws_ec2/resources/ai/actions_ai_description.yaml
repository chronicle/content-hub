Create Instance:
  ai_description: >-
    ### General Description

    Creates a new EC2 instance in AWS for a specific Amazon Machine Image (AMI).


    ### Flow Description

    1. Extracts action parameters including Image ID, Instance Type, Max Count, Min
    Count, and Security Group IDs.

    2. Initializes the EC2Manager to connect to AWS EC2.

    3. If it is the first run, calls the AWS API (`run_instances`) to create the instance(s).

    4. Checks the state of the created instances. If they are 'pending', the action
    suspends and waits.

    5. If it is a subsequent run, checks the state of the pending instances via the
    AWS API (`describe_instances`).

    6. Once instances are 'running', returns the instance details as a JSON result.


    ### Additional Notes

    This is an asynchronous action that will continue to check the instance state
    until it is running.
  ai_short_description: >-
    Creates a new EC2 instance in AWS for a specific Amazon Machine Image (AMI) and
    waits for it to reach the running state.
