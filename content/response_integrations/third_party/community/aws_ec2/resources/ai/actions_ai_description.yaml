Authorize Security Group Egress:
  ai_description: >-
    ### General Description

    This action adds or updates outbound IP permissions (egress rules) for a specific
    security group within an AWS Virtual Private Cloud (VPC). It interacts with the
    AWS EC2 service to apply the specified network traffic rules, allowing for automated
    infrastructure configuration and network access management.


    ### Flow Description

    1. Extracts the target Security Group ID and the desired IP Permissions (in JSON
    format) from the action parameters.

    2. Initializes the AWS EC2 Manager using the integration's configured credentials
    and region.

    3. Makes an API call to AWS EC2 (`authorize_security_group_egress`) to apply the
    new egress rules to the specified security group.

    4. Outputs a success or failure message and attaches the AWS API response as a
    JSON result to the action.


    ### Additional Notes

    The `IP Permissions` parameter must be a valid JSON string representing the egress
    rules (e.g., specifying `FromPort`, `ToPort`, `IpProtocol`, and `IpRanges`).
  ai_short_description: >-
    Adds or updates outbound IP permissions (egress rules) for a specific security
    group in an AWS VPC.
