Authorize Security Group Ingress:
  ai_description: >-
    ### General Description

    This action adds or updates inbound IP permissions (ingress rules) for a specific
    security group within an AWS Virtual Private Cloud (VPC). It allows users to programmatically
    define and apply network access rules to their AWS infrastructure.


    ### Flow Description

    1. Extracts the AWS EC2 configuration and action parameters, including the target
    Group ID and the IP Permissions.

    2. Parses the provided IP Permissions from a JSON string into a Python dictionary.

    3. Initializes the AWS EC2 Manager to establish a connection with the AWS API.

    4. Makes an API call to AWS EC2 to authorize the security group ingress using
    the provided group ID and permissions.

    5. Appends the API response to the action's JSON results and returns a success
    or failure message based on the outcome.


    ### Additional Notes

    The IP Permissions parameter must be provided in a valid JSON format that complies
    with the AWS boto3 EC2 client specifications.
