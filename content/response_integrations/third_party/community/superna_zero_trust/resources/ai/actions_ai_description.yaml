Superna Zero Trust User Lockout:
  ai_description: >-
    ### General Description

    Locks out a suspected user from all Superna protected NAS storage. This action
    resolves user permissions to data and applies a deny read permission to SMB shares,
    effectively revoking the user's access to the storage environment.


    ### Flow Description

    1. Extracts the target username from the action parameters.

    2. URL-encodes the provided username to ensure safe API transmission.

    3. Constructs the API endpoint URL using the configured Eyeglass IP.

    4. Makes an HTTP POST request to the Superna Zero Trust API (`/sera/v2/ransomware/lockout/{user}`)
    to initiate the lockout process.

    5. Returns the API response text as the result value and updates the execution
    status based on the success or failure of the request.


    ### Additional Notes

    Requires a valid API token and Eyeglass IP configured in the integration settings.
    Ensure the user format matches the expected `domain\username` or `user@domain`
    format.
  ai_short_description: >-
    Locks out a suspected user from all Superna protected NAS storage by applying
    a deny read permission to SMB shares via the Superna Zero Trust API.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
