Ping:
  ai_description: >-
    ### General Description

    Pings the Superna Zero Trust API to perform a health check and verify connectivity.
    This action is primarily used to ensure that the integration is configured correctly
    and that the external service is reachable.


    ### Flow Description

    1. Extracts integration-level configuration parameters (API token, Eyeglass IP,
    and Verify SSL).

    2. Constructs the API endpoint URL for the health check (`/sera/v1/healthcheck`).

    3. Makes an HTTP GET request to the Superna Zero Trust API.

    4. Returns the response text if the connection is successful, or an appropriate
    error message if the request fails or times out.


    ### Additional Notes

    This action does not interact with case entities or modify any data. It serves
    strictly as a diagnostic tool for the integration.
  ai_short_description: >-
    Performs a health check by pinging the Superna Zero Trust API to verify connectivity
    and configuration settings.
