    2. URL-encodes the username to ensure it is safely formatted for the API request.

    3. Constructs the API endpoint URL (`/sera/v2/ransomware/unlock/{user}`) using
    the configured Eyeglass IP.

    4. Sends an HTTP POST request to the Superna Zero Trust API to unlock the specified
    user.

    5. Returns the API response text as the result value and updates the execution
    status based on the success or failure of the HTTP request.


