Create Task:
  ai_description: >-
    ### General Description

    Creates a new task within a specific project in Asana. This action allows users
    to programmatically generate work items, assign them to specific users, and set
    due dates directly from the SOAR platform.


    ### Flow Description

    1. Extracts the provided task details including the subject, description, project
    name, assignee, and due date.

    2. Makes a GET request to the Asana API to retrieve the project ID associated
    with the provided `Project Name`.

    3. If an `Assignee` is provided, makes a GET request to the Asana API to resolve
    the user's email to their internal Asana User ID.

    4. Makes a POST request to the Asana API to create the new task using the resolved
    IDs and task details.

    5. Returns the created task details as a JSON result and attaches a direct URL
    link to the task in the SecOps platform.


    ### Additional Notes

    The `Project Name` and `Assignee` parameters are case-sensitive and must exactly
    match the records in Asana to successfully resolve their respective IDs.
  ai_short_description: >-
    Creates a new task in a specified Asana project, optionally assigning it to a
    user and setting a due date.
