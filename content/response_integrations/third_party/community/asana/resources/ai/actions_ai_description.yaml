List My Tasks:
  ai_description: >-
    ### General Description

    Retrieves a list of tasks associated with a specific user in Asana. This action
    fetches task details based on the user's email and workspace, and can optionally
    filter the results to show only completed tasks.


    ### Flow Description

    1. Extracts the workspace name, user's email, and completed status filter from
    the action parameters.

    2. Makes an API call to Asana to retrieve the user ID associated with the provided
    email address.

    3. Makes an API call to Asana to retrieve the workspace ID matching the provided
    workspace name.

    4. Makes an API call to Asana to fetch the user's task list ID using the user
    ID and workspace ID.

    5. Makes an API call to Asana to retrieve all tasks from the user's task list.

    6. Iterates through the retrieved tasks and makes an API call for each to fetch
    detailed task information.

    7. Filters the detailed tasks based on the requested completed status.

    8. Appends the matching task details to the JSON result and adds direct links
    to the tasks in the action results.


    ### Additional Notes

    The "Workspace Name" parameter is case-sensitive. Ensure the exact name is provided
    to successfully retrieve the workspace ID.
