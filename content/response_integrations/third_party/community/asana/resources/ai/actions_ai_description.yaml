Update Task:
  ai_description: >-
    ### General Description

    Updates an existing task in Asana. This action modifies task details such as the
    assignee, due date, and description based on the provided input parameters.


    ### Flow Description

    1. Extracts the target `Task ID`, `Assignee` (email), `Due Date`, and `Description`
    from the action parameters.

    2. If an `Assignee` is provided, makes a GET request to the Asana API (`/users/{user_email}`)
    to resolve the user's email address into an Asana User ID.

    3. Makes a PUT request to the Asana API (`/tasks/{task_id}`) to update the task
    with the new assignee ID, due date, and description.

    4. Retrieves the updated task information and attaches it to the action's JSON
    result.


