Add User To Workspace:
  ai_description: >-
    ### General Description

    Adds a specific user to a designated workspace in Asana. This action modifies
    the workspace membership by inviting or adding the user via their email address.


    ### Flow Description

    1. Extracts the workspace name and the user's email address from the action parameters.

    2. Retrieves the workspace ID by querying the Asana API (`GET /workspaces`) and
    matching the provided workspace name.

    3. Adds the user to the workspace by making a POST request to the Asana API (`POST
    /workspaces/{workspace_id}/addUser`).

    4. Returns the added user details as a JSON result and outputs a success or failure
    message.


    ### Additional Notes

    - The workspace name is case-sensitive.

    - The action requires a valid Asana Personal Access Token (PAT) configured in
    the integration.
  ai_short_description: >-
    Adds a specific user to a designated workspace in Asana.
