    1. Extracts the `Job ID` and `Event ID` from the action parameters.

    2. Initializes the Arcanna API client with the integration configuration.

    3. Makes an HTTP GET request to the Arcanna API (`/api/v1/events/{job_id}/{event_id}/export`)
