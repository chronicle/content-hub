Get Arcanna decision:
  ai_description: >-
    ### General Description

    Retrieves the decision status of a specific event from Arcanna AI. This action
    polls the Arcanna API to get the AI's decision for a given event and job, returning
    the result as a JSON object.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the Job
    ID and Event ID.

    2. Initializes the Arcanna API client.

    3. Enters a retry loop to poll the event status by making a GET request to the
    Arcanna API (`/api/v1/events/{job_id}/{event_id}`).

    4. If the decision status is `pending_inference`, the action waits for the configured
    interval and retries.

    5. If the status is `OK`, the action retrieves the decision and attaches it to
    the action's JSON result.

    6. If the status is `ERROR` or the retry limit is reached without a decision,
    the action fails.


    ### Additional Notes

    Ensure that the retry count and seconds per retry are configured appropriately
    to allow enough time for the Arcanna AI model to process the event and generate
    a decision.
  ai_short_description: >-
    Retrieves the AI decision status for a specific event and job from Arcanna AI,
    utilizing a retry mechanism to wait for pending inferences.
