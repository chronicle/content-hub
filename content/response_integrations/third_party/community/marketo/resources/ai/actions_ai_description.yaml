Get Lead By Entity Email:
  ai_description: >-
    ### General Description

    Retrieves lead data from Marketo for User entities containing valid email addresses.
    The action queries Marketo for lead details, extracts information such as first
    name, last name, email, and lead ID, and enriches the corresponding entities within
    the platform.


    ### Flow Description

    1. Iterates through the target entities provided to the action.

    2. Validates if the entity identifier is a properly formatted email address and
    if the entity type is `USER`.

    3. Makes an API call to Marketo (`get_multiple_leads_by_filter_type`) to fetch
    lead details using the email address.

    4. Extracts lead information (first name, last name, email, lead ID) from the
    response.

    5. Enriches the entity by updating its additional properties with the extracted
    data and setting its `is_enriched` flag to true.

    6. Updates the entities in the SecOps platform and returns a JSON result containing
    the enriched data and lead count.


    ### Additional Notes

    Only User entities with valid email identifiers will be processed. Entities that
    do not match the email regex or are not of type `USER` will be skipped.
