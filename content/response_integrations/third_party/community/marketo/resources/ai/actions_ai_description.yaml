Get Lead By Email Param:
  ai_description: >-
    ### General Description

    Retrieves lead data from Marketo for a specified email address. This action queries
    the Marketo API to fetch details about a user based on their email, returning
    the lead ID and associated information if the user exists.


    ### Flow Description

    1. Extracts the Marketo integration configuration parameters (Client ID, Client
    Secret, Munchkin ID).

    2. Extracts the target `Email` address from the action parameters.

    3. Initializes the MarketoClient and makes an API call (`get_multiple_leads_by_filter_type`)
    to search for the lead by email.

    4. Evaluates the response to determine if the lead exists.

    5. Appends the retrieved lead details to the action's JSON results.

    6. Returns a success or failure message along with a boolean result value.


    ### Additional Notes

    The action returns `True` if the lead exists in Marketo and `False` otherwise.
