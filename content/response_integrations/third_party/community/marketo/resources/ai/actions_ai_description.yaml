Create lead:
  ai_description: >-
    ### General Description

    Creates a new lead in Marketo using the provided user details such as email, first
    name, last name, and country. This action initiates a state change in the external
    Marketo system by adding a new lead record.


    ### Flow Description

    1. Extracts the action parameters: Email, First Name, Last Name, and Country.

    2. Initializes the Marketo API client using the integration's configured credentials.

    3. Makes an API call to Marketo using the `create_update_leads` method with the
    `createOnly` action to generate the new lead.

    4. Evaluates the API response to determine if the lead was successfully created
    or if an error occurred.

    5. Returns the JSON result of the API call and outputs a success or failure message
    to the SecOps platform.


    ### Additional Notes

    The action will fail and return an error if the Marketo API response contains
    a 'reasons' field indicating that the lead could not be created.
  ai_short_description: >-
    Creates a new lead in Marketo using the provided user details such as email, first
    name, last name, and country.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
