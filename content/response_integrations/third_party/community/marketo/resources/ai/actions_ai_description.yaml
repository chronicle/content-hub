Request Campaign:
  ai_description: >-
    ### General Description

    Requests a specific campaign for a lead in Marketo using the Marketo REST API.
    This action triggers a designated Marketo campaign for a specific lead, optionally
    passing dynamic tokens to customize the campaign execution.


    ### Flow Description

    1. Extracts the necessary integration credentials and action parameters, including
    `Campaign Id`, `Lead Id`, and `Tokens Json`.

    2. Parses the `Tokens Json` string into a dictionary, automatically lowercasing
    values unless the key contains the word 'password'.

    3. Initializes the `MarketoClient` to establish a connection with the Marketo
    API.

    4. Executes the `request_campaign` API call to Marketo, passing the campaign ID,
    lead ID, and parsed tokens.

    5. Returns a success message if the campaign is triggered successfully, or raises
    an error if the API call fails.


    ### Additional Notes

    Ensure that the provided `Lead Id` and `Campaign Id` are valid within your Marketo
    instance. The `Tokens Json` parameter must be a valid JSON string if provided.
