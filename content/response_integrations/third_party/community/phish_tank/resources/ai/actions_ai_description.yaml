Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the PhishTank service to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Extracts the Service URL from the integration configuration.

    2. Sends a test POST request to the PhishTank API with a sample URL payload (`google.com`).

    3. Verifies the HTTP response status to confirm connectivity.

    4. Returns a success message if the connection is established.


    ### Additional Notes

    This action is typically used during the initial setup of the integration to validate
    credentials and network access.
  ai_short_description: >-
