Check Url:
  ai_description: >-
    ### General Description

    Checks if specific URL entities are marked as suspicious by the PhishTank Community.
    It retrieves threat intelligence data and evaluates the risk of the URLs, updating
    their status and providing insights based on the findings.


    ### Flow Description

    1. Iterates through the target entities and filters for URL entities.

    2. Extracts the original URL identifier from the entity's additional properties
    or falls back to the standard identifier.

    3. Makes an HTTP POST request to the PhishTank API to check if the URL exists
    in their database.

    4. Parses the response to determine if the URL is in the database and if it is
    verified as a phishing link.

    5. If verified as a phishing URL, marks the entity as suspicious and updates it
    in the platform.

    6. Adds an insight to the entity with the PhishTank details (e.g., verification
    status, valid status, and detail page link) or a note that it wasn't found.

    7. Returns a JSON result containing the parsed response data for further playbook
    use.


    ### Additional Notes

    The action relies on the PhishTank service URL configured at the integration level.
  ai_short_description: >-
    Checks if specific URL entities are marked as suspicious by the PhishTank Community,
    enriching them with threat intelligence and updating their suspicious status if
    verified as phishing.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP POST request to the PhishTank API to fetch threat intelligence
      data about URLs (fetches_data=true). It does not mutate external data or internal
      system data outside of entities. It updates entities by setting `is_suspicious
      = True` and calling `siemplify.update_entities` (can_update_entities=true).
      It also creates insights by calling `siemplify.add_entity_insight` (can_create_insight=true).
  entity_usage:
