GetAlerts:
  ai_description: >-
    ### General Description

    Fetches Cyble Vision alerts for specified services within a defined time window.
    This action is useful for ad-hoc analyst queries or playbook enrichment steps
    to retrieve recent alerts from Cyble without waiting for a scheduled job cycle.


    ### Flow Description

    1. Extracts the action parameters including the target services, time window (hours
    back), maximum results, and alert statuses.

    2. Calculates the start and end times for the query based on the current time
    and the `Hours Back` parameter.

    3. Makes an API call to Cyble Vision (`manager.iter_alerts`) to fetch alerts matching
    the specified criteria.

    4. Maps the retrieved Cyble alerts into a standardized SecOps format using the
    `CybleAlertMapper`.

    5. Returns the fetched alerts as a JSON object attached to the action result.


    ### Additional Notes

    The action handles pagination automatically up to the specified maximum results
    limit. If unknown service names are provided, the action will log a warning but
    attempt to fetch them anyway.
  ai_short_description: >-
    Fetches Cyble Vision alerts for specified services within a defined time window
    and returns the results as a JSON object.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Cyble Vision API (fetches_data=true). It does
      not perform any state-changing operations on external systems (can_mutate_external_data=false).
      It also does not mutate internal SecOps data, update entities, create insights,
      modify alert data, or create case comments (all internal mutation flags are
      false).
