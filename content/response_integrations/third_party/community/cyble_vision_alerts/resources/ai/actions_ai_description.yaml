UpdateAlertStatus:
  ai_description: >-
    ### General Description

    Updates the status of a specific alert in Cyble Vision and synchronizes the change
    back to the Google SecOps alert.


    ### Flow Description

    1. Retrieves the `Cyble Alert ID` and `Cyble Service` from the action parameters
    or falls back to the current alert's custom fields.

    2. Validates the provided inputs and maps the new status to a Cyble-compatible
    status.

    3. Makes a PUT request to the Cyble Vision API to update the alert's status.

    4. Upon successful update in Cyble, updates the `Status` and `LastSyncAt` custom
    fields on the corresponding Google SecOps alert.

    5. Adds an audit comment to the Google SecOps case wall detailing the successful
    update.


    ### Additional Notes

    If the `Cyble Alert ID` or `Cyble Service` parameters are left empty, the action
    will automatically attempt to populate them from the `AlertId` and `Service` custom
    fields of the current alert.
  ai_short_description: >-
    Updates the status of an alert in Cyble Vision and synchronizes the updated status
    and sync time to the corresponding Google SecOps alert.
  capabilities:
    can_create_case_comments: true
    can_create_insight: false
