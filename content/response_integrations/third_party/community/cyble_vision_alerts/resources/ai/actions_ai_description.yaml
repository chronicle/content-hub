UpdateAlertSeverity:
  ai_description: >-
    ### General Description

    Updates the severity of a specific alert in Cyble Vision and synchronizes the
    change to the local SecOps alert.


    ### Flow Description

    1. Extracts the Cyble Alert ID, Cyble Service, and New Severity from the action
    parameters or the current alert's additional properties.

    2. Validates the inputs and normalizes the severity value (handling both string
    and integer inputs).

    3. Makes a PUT request to the Cyble Vision API to update the alert's severity.

    4. Updates the local SecOps alert's additional data with the new severity and
    sync timestamp.

    5. Adds a comment to the case indicating the successful update.


    ### Additional Notes

    Accepts both string and integer severity values (e.g., "-1" for CRITICAL, "2"
    for HIGH) to support playbook mappings without requiring string conversion blocks.
  ai_short_description: >-
    Updates the severity of a specific alert in Cyble Vision and synchronizes the
    change to the local SecOps alert.
