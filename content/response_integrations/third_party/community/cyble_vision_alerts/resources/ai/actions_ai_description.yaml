Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cyble Vision API and validates the provided API key.
    This action serves as a mandatory SecOps integration health check, used to mark
    the integration as Healthy or Unhealthy in the platform's UI.


    ### Flow Description

    1. Extracts the integration-level configuration parameters, including the API
    key, Base URL, Verify SSL, and Timeout settings.

    2. Initializes the Cyble API client (`CybleManager`) with the provided credentials.

    3. Executes a lightweight GET request to the Cyble Vision services endpoint to
    verify network connectivity and authentication validity.

    4. Returns a successful result if the connection is established, or an error message
    if authentication or connectivity fails.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
