GetServicesList:
  ai_description: >-
    ### General Description

    Retrieves all active Cyble Vision threat intelligence services. This action connects
    to the Cyble API to fetch a list of available services, which can be used for
    validating connector configurations or dynamically populating service filter inputs
    in playbooks.


    ### Flow Description

    1. Initializes the Cyble API client using the provided integration configuration.

    2. Makes an HTTP GET request to the Cyble API to fetch the list of available services.

    3. Parses the response to extract the service name, display name, and alert allowance
    status for each service.

    4. Outputs the total count and the list of active services as a JSON result.


    ### Additional Notes

    This action does not require any specific input parameters and operates independently
    of case entities.
