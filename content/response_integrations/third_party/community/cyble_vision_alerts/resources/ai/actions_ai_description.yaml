    external_data_mutation_explanation: >-
      Updates the status of an alert in Cyble Vision.
    fetches_data: false
    internal_data_mutation_explanation: >-
      Updates the SecOps alert's custom fields (Status, LastSyncAt) and adds an audit
      comment to the case.
    reasoning: >-
      The action makes a PUT request to Cyble Vision to update an alert's status (can_mutate_external_data=true).
      It also updates the custom fields of the alert in Google SecOps and adds a case
