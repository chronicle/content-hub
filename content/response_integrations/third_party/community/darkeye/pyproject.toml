[project]
name = "DarkEye"
version = "1.0"
description = "DarkEye enriches domain and email entities with ransomware, data breach, leak and stealer listings from HaveIBeenRansom and Breach House. Each product uses its own API key, and either one can be used alone."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.32.4",
    "tipcommon",
]

[dependency-groups]
dev = [
    "environmentcommon",
    "integration-testing",
    "pytest>=8.3.5",
    "pytest-json-report>=1.5.0",
    "soar-sdk",
]

[tool.uv.sources]
soar-sdk = { git = "https://github.com/chronicle/soar-sdk.git", rev = "5c563da488afa729eeba2195d3569de1370ab106" }
tipcommon = { path = "../../../../../packages/tipcommon/whls/TIPCommon-2.4.8-py3-none-any.whl" }
environmentcommon = { path = "../../../../../packages/envcommon/whls/EnvironmentCommon-1.0.3-py3-none-any.whl" }
integration-testing = { path = "../../../../../packages/integration_testing_whls/integration_testing-2.4.8-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
