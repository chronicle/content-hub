identifier: DarkEye
name: DarkEye
parameters:
-   name: HaveIBeenRansom API Key
    default_value: ''
    type: password
    description: API key for HaveIBeenRansom. Leave empty to skip HaveIBeenRansom. Configure at least one of the two API keys.
    is_mandatory: false
    integration_identifier: DarkEye
-   name: Breach House API Key
    default_value: ''
    type: password
    description: API token for Breach House. Leave empty to skip Breach House. Configure at least one of the two API keys.
    is_mandatory: false
    integration_identifier: DarkEye
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the integration validates the SSL certificates of HaveIBeenRansom and Breach House. Selected by default.
    is_mandatory: false
    integration_identifier: DarkEye
documentation_link: https://haveibeenransom.com/howapi
categories:
- Threat Intelligence
- Data Enrichment
svg_logo_path: resources/logo.svg
image_path: resources/image.png
