creator: admin
description: 'Enrich Domain entities, and User entities that are email addresses, with listings from HaveIBeenRansom and Breach House: ransomware leaks, data breaches, access leads and stealer logs. Every record says which product found it and its category. Results contain only listing metadata, without passwords, leaked files or download links. Each configured product is queried; if one fails, the results of the other are kept and the failure is reported. Supported entities: Domain, User (email address only).'
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
integration_identifier: DarkEye
name: Enrich Entities
parameters:
-   default_value: '5'
    description: Maximum number of HaveIBeenRansom result pages to read per entity. Each page holds 20 sources and takes one request. The maximum is 20.
    is_mandatory: false
    name: Max Pages
    type: string
-   default_value: '25'
    description: Maximum number of Breach House results per source (ransomware, breaches, leads, stealers) per entity. The maximum is 200.
    is_mandatory: false
    name: Limit
    type: string
-   default_value: '100'
    description: Maximum number of records kept per product per entity. The maximum is 500.
    is_mandatory: false
    name: Max Records
    type: string
script_result_name: is_success
