    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a simple GET request to test connectivity. It does not fetch
      contextual data for alerts/entities, does not mutate external data, and does
      not interact with internal SecOps data such as entities, insights, or case comments.
