Turn On Light and Color:
  ai_description: >-
    ### General Description

    Turns on a specific Philips HUE light by its ID, applying a chosen color and alert
    effect.


    ### Flow Description

    1. Extracts the `Light ID`, `Color`, and `Alert effect` parameters provided by
    the user.

    2. Checks if the specified light ID exists on the Philips HUE bridge via a GET
    request to the `/lights/` API endpoint.

    3. If the light exists, verifies its reachability via a GET request to the `/lights/{light_id}`
    API endpoint.

    4. If reachable, adjusts the light's state (turns it on, sets the color, and applies
    the effect) via a PUT request to the `/lights/{light_id}/state` API endpoint.

    5. Returns the execution status and a JSON result containing the light's state
    details.


    ### Additional Notes

    This action requires a valid Bridge IP and Authorized Username configured at the
    integration level to successfully authenticate and communicate with the Philips
    HUE bridge.
  ai_short_description: >-
    Turns on a specific Philips HUE light by its ID, applying a chosen color and alert
    effect.
