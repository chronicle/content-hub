Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Philips HUE Bridge using the configured integration
    parameters. This action verifies that the provided Bridge IP and Authorized Username
    are valid and that the SecOps platform can successfully communicate with the device.


    ### Flow Description

    1. Extracts the `Bridge IP` and `Authorized Username` from the integration configuration.

    2. Initializes the `PhilipsManager` with the extracted credentials.

    3. Makes an HTTP GET request to the Philips HUE Bridge API base URL to verify
    network reachability and authentication.

    4. Returns a successful result if the connection is established, or an error message
    if the connection fails.


    ### Additional Notes

    This is a standard utility action primarily used during integration setup or troubleshooting
    to ensure the platform can reach the Philips HUE Bridge.
  ai_short_description: >-
    Tests connectivity to the Philips HUE Bridge to verify integration configuration
    and network reachability.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
