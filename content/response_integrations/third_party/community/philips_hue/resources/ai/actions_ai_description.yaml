Turn Off Light:
  ai_description: >-
    ### General Description

    Turns off a specific Philips HUE light using its Light ID.


    ### Flow Description

    1. Extracts the `Light ID` parameter provided by the user.

    2. Makes a GET request to the Philips HUE bridge to verify if the specified light
    ID exists.

    3. If the light exists, checks its reachability.

    4. If reachable, makes a PUT request to the bridge to change the light's state
    to off.

    5. Returns the execution status and a JSON result containing the light's reachability
    and state adjustment details.


    ### Additional Notes

    Requires network connectivity to the Philips HUE bridge and an authorized username
    configured in the integration settings.
  ai_short_description: >-
    Turns off a specific Philips HUE light by its ID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
