Create Document:
  ai_description: >-
    ### General Description

    Creates a new Google Document with a specified title and assigns sharing permissions
    to a list of email addresses.


    ### Flow Description

    1. Extracts the document title, role, and target email addresses from the action
    parameters.

    2. Makes an API call to the Google Docs API (`docs.v1.documents.create`) to create
    a new document with the provided title.

    3. Iterates through the provided email addresses and makes API calls to the Google
    Drive API (`drive.v3.permissions.create`) to assign the specified role (owner,
    writer, or reader) to each user.

    4. Makes a final API call to the Google Drive API (`drive.v3.files.get`) to retrieve
    the newly created document's metadata.

    5. Returns the document metadata as a JSON result and the document ID as the script
    result.


    ### Additional Notes

    The action requires valid Google service account credentials with the `https://www.googleapis.com/auth/drive.file`
    scope configured in the integration.
  ai_short_description: >-
    Creates a new Google Document and assigns specified sharing permissions to a list
    of email addresses.
