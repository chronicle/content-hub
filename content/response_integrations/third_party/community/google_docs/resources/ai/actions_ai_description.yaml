Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Google Docs API to ensure the integration is configured
    correctly and can authenticate successfully.


    ### Flow Description

    1. Extracts the Google Docs credentials from the integration configuration.

    2. Initializes the Google Docs manager with the provided credentials.

    3. Executes a test query (`drive_service.files().list`) to verify authentication
    and network connectivity.

    4. Returns a success message if the connection is established without errors.


    ### Additional Notes

    This is a standard ping action used primarily during integration setup or troubleshooting
    to verify that the provided service account credentials are valid and have the
    necessary scopes.
