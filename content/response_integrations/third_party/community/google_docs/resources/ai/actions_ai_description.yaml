Replace Content:
  ai_description: >-
    ### General Description

    Replaces specific text within a Google Document using the Google Docs API. The
    action takes a Document ID and a JSON payload specifying the text to search for,
    the replacement text, and case-matching preferences, and applies these changes
    directly to the document.


    ### Flow Description

    1. Extracts the `Document Id` and the `Json` payload containing the replacement
    rules from the action parameters.

    2. Parses the JSON payload to construct a list of `replaceAllText` requests.

    3. Authenticates with the Google Docs API using the integration's service account
    credentials.

    4. Executes a `batchUpdate` API call to the Google Docs API to apply the text
    replacements to the specified document.

    5. Returns the API response as a JSON result and completes the action.


    ### Additional Notes

    The `Json` parameter must follow a specific schema containing an `items` array.
    Each item in the array must include `text_to_search`, `text_to_replace`, and `match_case`
    keys.
