    external_data_mutation_explanation: >-
      Creates a new document and assigns sharing permissions in Google Docs/Drive.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by creating a new document and adding permissions
      in Google Workspace via the Google Docs and Drive APIs. It does not fetch contextual
      data for alerts/entities, nor does it mutate internal SecOps data (no entity
      updates, no insights, no case comments).
