Create Content:
  ai_description: >-
    ### General Description

    Creates new text content within a specific Google Document using the Google Docs
    API. This action allows users to programmatically insert text at specific indices
    within an existing document.


    ### Flow Description

    1. Extracts the target `Document Id` and the `Json` payload containing the text
    and insertion indices.

    2. Parses the JSON payload to construct a list of `insertText` requests.

    3. Authenticates with the Google Docs API using the provided integration credentials.

    4. Executes a `batchUpdate` API call to the Google Docs API to insert the text
    into the document.

    5. Returns the API response as a JSON result and completes the action.


    ### Additional Notes

    The `Json` parameter must follow a specific schema containing an array of items
    with `index` and `text` keys (e.g., `{"items": [{"index": 1, "text": "Hello "}]}`).
  ai_short_description: >-
    Inserts new text content into a specified Google Document at designated indices
    using the Google Docs API.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates a Google Document by inserting new text content at specified indices
      via the Google Docs API.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a 'batchUpdate' request to the Google Docs API to insert
      text into a document, which mutates external data. It does not fetch contextual
      data, mutate internal SecOps data, update entities, create insights, modify
      alerts, or create case comments.
