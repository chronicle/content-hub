    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action parses a JSON string provided via the `Series` parameter to calculate
      statistics. It initializes the DataDogManager but does not use it to fetch or
      mutate any external data. It also does not update internal entities, create
      insights, modify alert data, or create case comments.
