Get Logs:
  ai_description: >-
    ### General Description

    Retrieves logs from DataDog for specified Kubernetes namespaces within a given
    time range. This action queries the DataDog platform to fetch historical log data
    associated with the provided namespaces and returns the results as a structured
    JSON object.


    ### Flow Description

    1. Extracts the provided Kubernetes namespaces, start time, and end time from
    the action parameters.

    2. Splits the namespace parameter into a list if multiple comma-separated namespaces
    are provided.

    3. Iterates through each namespace and makes an API call to DataDog (`POST /api/v1/logs-queries/list`)
    to fetch logs matching the `kube_namespace` query and the specified time range.

    4. Aggregates the successfully retrieved logs for each namespace into a single
    JSON object.

    5. Returns the aggregated logs as the action's JSON result.


    ### Additional Notes

    The `Namespace` parameter can accept a single namespace or a comma-separated list
    of multiple namespaces.
