Get Beautiful Metric:
  ai_description: >-
    ### General Description

    Analyzes and calculates statistics for a given DataDog metric timeseries points
    JSON object.


    ### Flow Description

    1. Extracts the `Series` parameter containing the timeseries points JSON.

    2. Parses the JSON to extract the `pointlist`, `start`, and `end` times.

    3. Iterates through the `pointlist` to collect raw metric values.

    4. Calculates the sum, average, minimum, and maximum of the metric values.

    5. Constructs a comprehensive JSON result containing the calculated statistics,
    unit, aggregation method, and the full timeseries points list.

    6. Returns the constructed JSON as the action's result.


    ### Additional Notes

    Although the action initializes the DataDog manager, it does not actively fetch
    data from the DataDog API; it solely processes the provided JSON string in the
    `Series` parameter.
  ai_short_description: >-
    Analyzes a provided JSON string of DataDog metric timeseries points to calculate
    and return statistics such as sum, average, minimum, and maximum values.
