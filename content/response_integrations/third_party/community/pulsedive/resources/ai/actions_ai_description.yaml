Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Pulsedive server to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, API Key, Verify SSL).

    2. Initializes the PulsediveManager.

    3. Calls the `test_connectivity` method which makes a GET request to the `/api/search.php`
    endpoint.

    4. Returns a success or failure message based on the response.


    ### Additional Notes

    This action is used to verify that the integration is configured correctly and
    does not perform any operations on alerts or entities.
