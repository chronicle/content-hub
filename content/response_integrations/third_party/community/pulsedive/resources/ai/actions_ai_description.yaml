    Name or Threat ID. This action fetches threat intelligence, risk summaries, and
    related news to provide context on specific threats.


    ### Flow Description

    1. Extracts the `Threat Name` or `Threat ID` from the action parameters.

    2. Makes a GET request to the Pulsedive API (`/api/info.php`) to fetch threat
    details, optionally including comments and splitting risk.

    3. Parses the returned threat data, including risk summaries and news.

    4. If configured, creates a case insight with the threat details and adds a data
    table containing threat comments to the action results.

    5. Returns the threat data as a JSON result.


