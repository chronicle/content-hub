Scan Indicator:
  ai_description: >-
    ### General Description

    Submits indicators to Pulsedive for active or passive scanning and retrieves the
    analysis results to enrich the entities. This action evaluates the risk of the
    indicators based on a specified threshold, updates their suspicious status, and
    provides detailed threat intelligence insights and comments.


    ### Flow Description

    1. Iterates through all target entities provided in the case.

    2. Submits each entity's identifier to Pulsedive for scanning via a POST request
    to the `/api/analyze.php` endpoint, using either an active or passive scan type.

    3. Periodically queries the scan status using the returned scan ID until the analysis
    is complete.

    4. Retrieves the final scan report, including risk scores, threat intelligence,
    and user comments.

    5. Evaluates the risk score against the configured threshold to determine if the
    entity should be marked as suspicious.

    6. Enriches the entity with the scan data, creates an insight with the analysis
    results, and attaches a data table containing any retrieved comments.

    7. Updates the entities in the Google SecOps platform with the new enrichment
    data and status.


    ### Additional Notes

    This action operates asynchronously to accommodate the time required for scanning.
    Active scans interact directly with the indicator and may be noisy, while passive
    scans rely on existing data without reaching out to the target.
  ai_short_description: >-
    Submits indicators to Pulsedive for active or passive scanning, retrieves the
    analysis results, and enriches the entities with threat intelligence, risk scores,
    and comments.
