Enrich IP:
  ai_description: >-
    ### General Description

    Enriches IP Address entities using information from Pulsedive. This action retrieves
    threat intelligence, risk levels, and optionally user comments associated with
    the IP address to provide context and evaluate risk.


    ### Flow Description

    1. Filters the target entities to include only IP Addresses (ADDRESS).

    2. Iterates over the filtered entities and makes a GET request to the Pulsedive
    API (`/api/info.php`) to fetch indicator data.

    3. Evaluates the retrieved risk score against the provided `Threshold` parameter
    to determine if the entity should be marked as suspicious.

    4. Enriches the entity's additional properties with the retrieved threat data.

    5. Optionally retrieves user comments and adds them as a data table to the case
    wall.

    6. Creates an insight for the entity containing the analysis results (can be configured
    to only create insights for suspicious entities).

    7. Updates the entities in the platform and returns a JSON result with the raw
    data.


    ### Additional Notes

    The action can be configured to only create insights for entities that meet or
    exceed the specified risk threshold, reducing noise for benign indicators.
  ai_short_description: >-
    Enriches IP Address entities by retrieving threat intelligence, risk levels, and
    user comments from Pulsedive.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Pulsedive API to fetch indicator data
      (fetches_data=true). It does not mutate external data. It updates internal entities
      with the retrieved data (can_update_entities=true) and creates insights (can_create_insight=true).
