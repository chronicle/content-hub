Enrich URL:
  ai_description: >-
    ### General Description

    Enriches URL entities using threat intelligence data from Pulsedive. This action
    retrieves risk levels, threat factors, and community comments for URLs, evaluates
    their risk against a configured threshold, and updates the entities with the enrichment
    data and insights.


    ### Flow Description

    1. Iterates over all target entities and filters for those of type URL.

    2. For each URL, makes a GET request to the Pulsedive API (`/api/info.php`) to
    fetch indicator data, including risk scores and optionally comments.

    3. Evaluates the retrieved risk score against the provided `Threshold` parameter.

    4. If the risk score meets or exceeds the threshold, marks the entity as suspicious.

    5. Enriches the entity's `additional_properties` with the retrieved threat intelligence
    data.

    6. If comments are retrieved, creates a data table on the case wall displaying
    the comments.

    7. Generates an insight for the entity containing risk details and threat factors
    (conditionally based on the `Only Suspicious Entity Insight` parameter).

    8. Updates the enriched entities within Google SecOps and attaches a JSON result
    containing the raw data.


    ### Additional Notes

    The action relies on the Pulsedive API and requires a valid API key configured
    in the integration settings.
