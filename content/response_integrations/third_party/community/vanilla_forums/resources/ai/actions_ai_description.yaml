Add User:
  ai_description: >-
    ### General Description

    Creates a new user account in Vanilla Forums with specified details such as name,
    email, role, and password.


    ### Flow Description

    1. Extracts user details and configuration parameters.

    2. Validates the provided password to ensure it meets complexity requirements
    (at least 6 characters, including letters and digits).

    3. Checks if the generated username already exists in Vanilla Forums by making
    a GET request to the API.

    4. If the username exists and duplicates are allowed, appends specified special
    characters to create a unique username.

    5. Makes a POST request to the Vanilla Forums API to create the new user account.

    6. Returns the created user details as a JSON result.


    ### Additional Notes

    If the username already exists and `Override Name Duplicity` is false, or if all
    provided `Additional Identifiers` are exhausted, the action will fail.
  ai_short_description: >-
    Creates a new user account in Vanilla Forums with the provided details and handles
    username duplicity if configured.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new user account in Vanilla Forums.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Vanilla Forums API to create a new user,
      which mutates external data. It does not fetch contextual data for enrichment,
      nor does it mutate internal SecOps data, update entities, or create insights.
