Get User Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a specific user from Vanilla Forums using
    their User ID. This action fetches the user's profile and metadata from the Vanilla
    Forums platform and returns it as a JSON object.


    ### Flow Description

    1. Extracts the `User ID` parameter provided in the action configuration.

    2. Initializes the Vanilla Forums API client using the integration's API token
    and base URL.

    3. Makes an HTTP GET request to the Vanilla Forums API (`/v2/users/{user_id}`)
    to fetch the user's details.

    4. Outputs the retrieved user details as a JSON result and completes the action.


    ### Additional Notes

