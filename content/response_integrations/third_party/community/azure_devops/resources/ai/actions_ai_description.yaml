Wait Until Web Resource Is Up:
  ai_description: >-
    ### General Description

    This action checks if a specified web resource is accessible and up by sending
    an HTTP GET request. It is designed to run asynchronously, waiting and retrying
    until the resource returns a successful response.


    ### Flow Description

    1. Extracts the target URL from the action parameters.

    2. Sends an HTTP GET request to the specified URL with a 5-second timeout.

    3. Evaluates the HTTP response status code.

    4. If the response is successful (HTTP OK), the action completes successfully.

    5. If the response fails or times out, the action remains in an "In Progress"
    state, allowing the SOAR platform to retry the execution later.


    ### Additional Notes

    This action is asynchronous and will continue to execute until the web resource
    is reachable or the action times out based on platform settings.
