Trigger Azure Build:
  ai_description: >-
    ### General Description

    Triggers a new build pipeline in Azure DevOps for a specified build definition
    ID and variables. This action initiates the build process and asynchronously monitors
    its execution status until completion.


    ### Flow Description

    1. Extracts the provided build definition ID and build variables from the action
    parameters.

    2. Sends a POST request to the Azure DevOps API to trigger the specified build
    pipeline.

    3. Retrieves the generated build ID from the API response.

    4. Asynchronously polls the Azure DevOps API using a GET request to monitor the
    status of the triggered build.

    5. Completes the action once the build finishes, returning the final build status
    and result as JSON.


    ### Additional Notes

    This is an asynchronous action that will continue to run in the background until
    the triggered build completes or fails.
