Ping:
  ai_description: >-
    ### General Description

    This action tests connectivity with the Azure DevOps platform to ensure that the
    integration is configured correctly.


    ### Flow Description

    1. Retrieves the integration configuration parameters including the Personal Access
    Token, Organization, and Base URL.

    2. Establishes a connection to the Azure DevOps API using Basic Authentication.

    3. Makes an API call (`get_projects`) to retrieve the first page of projects to
    verify that the credentials and network connectivity are valid.

    4. Returns a success message if the connection is established, or an error message
    if the connection fails.


    ### Additional Notes

    This action is typically used during the initial setup of the integration to validate
    credentials and network access.
  ai_short_description: >-
    Tests connectivity with Azure DevOps by attempting to retrieve the first page
    of projects.
