Ping:
  ai_description: >-
    ### General Description

    Tests the connection to the Cybersixgill Darkfeed API using the provided client
    credentials.


    ### Flow Description

    1. Extracts the Client ID and Client Secret from the integration configuration.

    2. Initializes the Cybersixgill manager.

    3. Makes an API call (`get_access_token`) to the Cybersixgill API to verify authentication
    and connectivity.

    4. Returns a success message and status if the connection is successfully established.


    ### Additional Notes

    This is a standard Ping action used to verify integration configuration and connectivity.
    It does not interact with alerts or entities.
  ai_short_description: >-
    Tests the connection to the Cybersixgill Darkfeed API by attempting to retrieve
    an access token using the configured client credentials.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an API call to fetch an access token to verify connectivity,
      but it does not fetch contextual data for alerts/entities. It does not mutate
      external data (no POST/PUT/DELETE of business data, just an auth token request).
      It does not mutate internal data, update entities, create insights, modify alert
      data, or create case comments.
