Ping:
  ai_description: "### General Description\nTests connectivity and authentication\
    \ to the NucleonCyber API by making a request to the active threats feed endpoint.\
    \ \n\n### Flow Description\n1. Extracts the action parameter (`limit`) along with\
    \ integration-level configuration credentials.\n2. Sends a POST request to the\
    \ NucleonCyber `activethreats` API endpoint using the provided credentials and\
    \ payload.\n3. Evaluates the HTTP response status code.\n4. Returns a successful\
    \ connection message if the status code is 200; otherwise, raises an exception\
    \ indicating bad credentials.\n\n### Additional Notes\nThis action is primarily\
    \ used as a \"Ping\" utility to verify that the integration is configured correctly\
    \ and can successfully authenticate with the NucleonCyber service. It does not\
    \ process or return the actual threat data."
