GetIPs:
  ai_description: >-
    ### General Description

    Retrieves a list of active threats (IPs) from the Nucleon Cyber Active Threats
    API. This action fetches recent cyber intelligence data and returns it as a JSON
    object for use in subsequent playbook steps.


    ### Flow Description

    1. Extracts the `limit` parameter to determine the maximum number of results to
    fetch.

    2. Makes an HTTP POST request to the Nucleon Cyber Active Threats API (`https://api.nucleoncyber.com/feed/activethreats`)
    using the configured integration credentials and the provided limit.

    3. Validates the API response to ensure successful authentication and data retrieval.

    4. Extracts the threat data from the response and attaches it to the action's
    JSON result for playbook consumption.


    ### Additional Notes

    Although the action uses an HTTP POST request to interact with the API, it functions
    purely as a data retrieval operation (fetching a feed) and does not mutate any
    external state.
  ai_short_description: >-
    Retrieves a list of active threats from the Nucleon Cyber Active Threats API and
    returns the recent cyber intelligence data as a JSON object.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP POST request to fetch threat intelligence data from
      the Nucleon Cyber API (fetches_data=true). Although it uses a POST method, it
      is querying a feed and does not mutate external data. It does not update entities,
      create insights, modify alerts, or create case comments.
