Check IP Reputation:
  ai_description: >-
    ### General Description

    Checks the reputation of IP address entities associated with an alert using AbuseIPDB.
    It retrieves threat intelligence data, updates the entity's suspicious status
    based on a threshold, and optionally creates an insight. It can exclude internal
    addresses to save API allowance.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Filters target entities to find ADDRESS entities, optionally excluding internal
    ones.

    3. Iterates over the filtered entities and makes a GET request to the AbuseIPDB
    API to fetch IP reputation data.

    4. Enriches the entity's `additional_properties` with the retrieved data.

    5. Evaluates the `abuseConfidenceScore` against the `Suspicious Threshold` and
    marks the entity as suspicious if it meets or exceeds it.

    6. Optionally creates an insight for the entity with the AbuseIPDB report details.

    7. Marks the entity as enriched and updates it in the platform.

    8. Adds the JSON results to the action's output.


    ### Additional Notes

    Ensure that the AbuseIPDB API key is configured correctly in the integration settings.
  ai_short_description: >-
    Checks the reputation of IP address entities associated with an alert using AbuseIPDB,
    enriches the entities, and optionally creates insights.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the AbuseIPDB API to fetch IP reputation data
      (fetches_data=true). It does not mutate external data or internal system data
      outside of entities. It updates entities with the fetched data (can_update_entities=true)
      and creates insights (can_create_insight=true).
