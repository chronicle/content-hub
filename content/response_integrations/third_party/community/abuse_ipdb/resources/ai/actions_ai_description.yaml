    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Exclude Internal Addresses | Boolean | No | If true, excludes any address entities
    that you've marked as internal, saving your API allowance on wasted IP checks
    against your own infrastructure. |

    | Suspicious Threshold | String | Yes | An abuse confidence score equal to, or
    above this threshold will mark the entity as supicious. Set to 0 to disable. |

    | Create Insight | Boolean | No | Create an insight for each IP |

    | Max Age in Days | String | Yes | Max report age to check |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the AbuseIPDB API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Initializes the AbuseIPDB manager with the provided API key.

    2. Makes a GET request to the AbuseIPDB API (`https://api.abuseipdb.com/api/v2/check`)
    using a dummy IP address (1.1.1.1) to verify authentication and connectivity.

    3. Returns a success message if the connection is established, or an error if
    the API key is invalid or unreachable.


    ### Additional Notes

    This action is typically used for diagnostic purposes and does not process any
    case entities or alerts.
  ai_short_description: >-
    Tests connectivity to the AbuseIPDB API to verify that the integration is configured
    correctly and the API key is valid.
