    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Updates entities with sample enrichment data and attaches insights.
    reasoning: >-
      The action does not fetch data from an external API; it generates sample data
      internally. It does not mutate external data. It mutates internal data by updating
      entities and creating insights (handled by the underlying EnrichAction base
