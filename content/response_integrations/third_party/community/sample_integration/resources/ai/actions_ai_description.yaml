    if 'Custom' is selected for the 'Time Frame' parameter. Format: ISO 8601. Action
    will only extract the dates from the timestamp. The delta between 'Start Time'
    and 'End Time' can't be greater than 7 days. |

    | End Time | String | No | End time for the results. Format: ISO 8601. If nothing
    is provided and 'Custom' is selected for the 'Time Frame' parameter then this
    parameter will use current time. Action will only extract the dates from the timestamp.
    The delta between 'Start Time' and 'End Time' can't be greater than 7 days. |

    | Return JSON Result | Boolean | Yes | Example of input via boolean. If enabled,
    action will return a JSON Result. |
