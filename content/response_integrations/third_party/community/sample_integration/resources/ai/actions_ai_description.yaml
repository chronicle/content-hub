    the provided tag. |
Enrich Entity Action Example:
  ai_description: >-
    ### General Description

    Enriches selected entities with sample data. This action serves as an example
    of how to process and enrich entities within Google SecOps without interacting
    with external APIs.


    ### Flow Description

    1. Extracts the target entity type from the action parameters.

    2. Iterates over the eligible entities in the alert scope based on the selected
    entity type.

    3. Generates sample enrichment data (timestamp and enriched status) for each entity.

    4. Attaches the generated data as an entity insight and updates the entity within
    the platform.


    ### Additional Notes

    This is a sample action intended for demonstration purposes and does not fetch
    data from any external services.
  ai_short_description: >-
    Enriches selected entities with sample data and attaches the results as entity
    insights.
