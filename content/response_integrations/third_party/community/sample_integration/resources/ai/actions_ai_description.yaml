Simple Action Example:
  ai_description: >-
    ### General Description

    Retrieves exchange rate data from the api.vatcomply.com service based on specified
    currencies and time frames. This action fetches financial data and attaches the
    results to the case wall.


    ### Flow Description

    1. Extracts and validates the provided currency and time frame parameters.

    2. Makes an API call (GET request) to the api.vatcomply.com service to fetch the
    exchange rates for the specified dates and currencies.

    3. Generates data tables and case wall links for the retrieved rates.

    4. Optionally attaches the raw JSON results to the current case as a file attachment.


    ### Additional Notes

    This action does not operate on Google SecOps entities and does not mutate any
    external or internal state.
