Async Action Example:
  ai_description: >-
    ### General Description

    This action is an asynchronous utility that pauses execution until specified cases
    in Google SecOps are assigned a specific tag. It is designed to wait for a condition
    to be met (the presence of a tag) before completing successfully, making it useful
    for coordinating workflows that depend on manual analyst input or other automated
    processes.


    ### Flow Description

    1. Extracts the provided `Case IDs` and the `Case Tag To Wait For`. If no Case
    IDs are provided, it defaults to the current case ID.

    2. Fetches the case overview details for each specified case using the internal
    SOAR API (`get_case_overview_details`).

    3. Evaluates whether the target tag is present in the retrieved case tags.

    4. If all specified cases have the required tag, the action completes successfully
    and outputs a success message.

    5. If any cases are missing the tag, the action suspends itself (returns an `IN_PROGRESS`
    state) and will re-check the missing cases in the next asynchronous iteration
    until the timeout is reached.


    ### Additional Notes

    This is an asynchronous action. It does not interact with external third-party
    systems but relies entirely on internal Google SecOps case data.
  ai_short_description: >-
    Asynchronously waits until specified cases in Google SecOps are assigned a specific
    tag, suspending execution and re-checking periodically until the condition is
    met or a timeout occurs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches internal case data using `get_case_overview_details` but
      does not fetch contextual data from an external tool (fetches_data=false). It
      does not mutate external data, nor does it mutate internal data (it only reads
      case tags). It does not update entities, create insights, modify alert data,
      or create case comments.
  entity_usage:
