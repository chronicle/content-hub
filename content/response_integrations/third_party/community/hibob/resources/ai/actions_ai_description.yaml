Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Hibob API to ensure the integration is configured correctly
    and the provided credentials are valid.


    ### Flow Description

    1. Extracts the API token from the integration configuration.

    2. Initializes the HibobManager with the provided credentials.

    3. Makes an HTTP GET request to the `/api/user` endpoint to verify authentication
    and connectivity.

    4. Returns a success message if the connection is established, or a failure message
    if the connection fails.


    ### Additional Notes

    This action is typically used as a diagnostic tool to verify integration settings
    and does not interact with alerts, entities, or case data.
