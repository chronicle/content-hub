Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches User entities with details from Hibob. This action retrieves user information
    from the Hibob API using the entity identifier, flattens the data, and appends
    it to the entity's additional properties within Google SecOps.


    ### Flow Description

    1. Iterates through the target entities in the case.

    2. Filters entities to process only those of type `USER`.

    3. Makes a GET request to the Hibob API (`/v1/people/{employee_identifier}`) to
    fetch user details.

    4. Flattens the retrieved JSON data and adds a "Hibob" prefix to the keys.

    5. Updates the entity's additional properties with the flattened data and marks
    the entity as enriched.

    6. Saves the updated entities back to the platform and outputs a JSON result containing
    the raw user data.


    ### Additional Notes

    The script extracts an action parameter named "Get User Image", but this parameter
    is not utilized in the subsequent logic to fetch or attach the image.
  ai_short_description: >-
    Enriches User entities by retrieving and appending user details from Hibob to
    the entity's additional properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the additional properties of User entities with data retrieved from
      Hibob.
    reasoning: >-
      The action makes a GET request to the Hibob API to fetch user details (fetches_data=true).
      It does not mutate external data (can_mutate_external_data=false). It updates
      the internal entity's additional properties and marks it as enriched (can_update_entities=true,
      can_mutate_internal_data=true). It does not create insights, modify alert data,
      or create case comments.
  entity_usage:
