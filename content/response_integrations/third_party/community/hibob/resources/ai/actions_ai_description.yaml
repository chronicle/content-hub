Upload User Image:
  ai_description: >-
    ### General Description

    Uploads a profile image for a specific employee in Hibob using an image URL. This
    action updates the user's avatar in the external Hibob system.


    ### Flow Description

    1. Extracts the `Employee's Email` and `Url Image` from the action parameters.

    2. Makes a GET request to the Hibob API (`/v1/people/{email}`) to retrieve the
    employee's details and extract their unique internal identifier.

    3. If the employee exists, makes a PUT request to the Hibob API (`/v1/avatars/{id}`)
    to upload the new avatar image using the provided URL.

    4. Returns a success or failure message based on the API response.


    ### Additional Notes

    Requires a valid Hibob API token configured in the integration settings.
