Send Invitation:
  ai_description: >-
    ### General Description

    Sends an invitation to an employee to log into the Hibob system for the first
    time or reinvites a previously disabled user. The action verifies the employee's
    existence and current invitation status before dispatching the invitation using
    a specified welcome wizard.


    ### Flow Description

    1. Retrieves the employee's email and welcome wizard name from the action parameters.

    2. Makes a GET request to the Hibob API to fetch the employee's details and verify
    their existence.

    3. Checks the employee's current invitation status. If they are already invited,
    the action halts.

    4. If not invited, makes a GET request to retrieve all available welcome wizards
    and matches the provided wizard name to its ID.

    5. Makes a POST request to the Hibob API to send the invitation to the employee
    using the matched wizard ID.

    6. Returns a JSON result containing the execution status and details.


    ### Additional Notes

    The "Welcome Wizard Name" parameter is case-sensitive and must exactly match the
    name configured in Hibob (Settings -> Flows).
