Get User Image:
  ai_description: >-
    ### General Description

    Retrieves the profile image of a specific employee from Hibob using their email
    address. It fetches the image content and returns it as a base64 encoded string
    along with the image URL.


    ### Flow Description

    1. Extracts the employee's email from the action parameters.

    2. Makes a GET request to the Hibob API (`/v1/people/{email}`) to retrieve the
    employee's details and extract their unique identifier.

    3. If the user exists, makes a subsequent GET request to the Hibob API (`/v1/avatars/{id}`)
    to fetch the user's avatar image.

    4. Converts the retrieved image content into a base64 encoded string.

    5. Returns the base64 string and image URL as a JSON result.


    ### Additional Notes

    If the user or the user's image is not found, the action will return a JSON result
    indicating that the image does not exist.
