Revoke Access:
  ai_description: >-
    ### General Description

    Disables and revokes access for a specific employee in Hibob based on their email
    address.


    ### Flow Description

    1. Extracts the target employee's email from the action parameters.

    2. Makes a GET request to the Hibob API to retrieve the employee's current details
    and status.

    3. Evaluates if the employee exists and checks if their invite status is already
    set to "uninvited".

    4. If the employee is active, makes a POST request to the Hibob API to revoke
    their access (uninvite).

    5. Returns a JSON result indicating whether the employee exists and if the revocation
    was successfully executed.


    ### Additional Notes

    If the employee does not exist in Hibob or their access has already been revoked,
    the action will gracefully exit without making changes and indicate the status
    in the output message.
