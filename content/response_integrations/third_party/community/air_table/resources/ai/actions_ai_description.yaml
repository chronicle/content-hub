Delete All Records:
  ai_description: >-
    ### General Description

    Deletes all records within a specified table in an Airtable base. This action
    connects to the Airtable API, retrieves all existing records for the given table,
    and performs a batch deletion to remove them entirely.


    ### Flow Description

    1. Extracts the Airtable API key from the integration configuration.

    2. Retrieves the `Base Id` and `Table name` from the action parameters.

    3. Initializes the Airtable client and makes an API call (`get_all`) to fetch
    all existing records in the specified table.

    4. Extracts the record IDs from the fetched results.

    5. Makes an API call (`batch_delete`) to delete all the identified records from
    the Airtable base.

    6. Returns a success message containing the total number of deleted records.


    ### Additional Notes

    This action performs a destructive operation by permanently deleting data from
    the external Airtable database. Ensure that the correct Base ID and Table Name
    are provided to avoid unintended data loss.
  ai_short_description: >-
    Deletes all records within a specified table in an Airtable base.
