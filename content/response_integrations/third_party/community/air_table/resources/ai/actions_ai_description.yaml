Update:
  ai_description: >-
    ### General Description

    Updates specific fields in an Airtable table based on a search query. The action
    searches for records matching a specified field name and value, and then updates
    the matched records with the provided JSON fields.


    ### Flow Description

    1. Extracts the Airtable API key from the integration configuration.

    2. Retrieves action parameters including Base ID, Table Name, Field Name, Field
    Value, JSON Fields, and Max Records.

    3. Parses the JSON fields parameter into a dictionary.

    4. Initializes the Airtable client and performs a search query (`airtable.search`)
    using the provided field name and value to find matching records.

    5. Iterates through the search results and makes an API call (`airtable.update`)
    to update each matched record with the new JSON fields.

    6. Returns the count of successfully updated records as the action result.


    ### Additional Notes

    The `Max records` parameter limits the number of records affected. If the `Max
    records` parameter is not a valid integer, the action defaults to updating a maximum
    of 5 records.
