Ping:
  ai_description: >-
    ### General Description

    Tests the connection to the AirTable product to ensure the integration is configured
    correctly and can communicate with the AirTable API.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Key, Base ID,
    and Table Name).

    2. Initializes the AirTable client using the provided credentials.

    3. Makes an API call (`get_all` with `maxRecords=1`) to the AirTable service to
    verify connectivity.

    4. Returns a success message if the connection is successfully established.


    ### Additional Notes

    This is a standard ping action used primarily for health checks and connectivity
    verification. It does not process any entities, mutate any data, or return contextual
    enrichment data.
