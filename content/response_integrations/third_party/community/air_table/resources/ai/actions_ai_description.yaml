Get All Records:
  ai_description: >-
    ### General Description

    Retrieves all records from a specified table within an Airtable base. This action
    connects to the Airtable API to fetch rows based on a maximum record limit and
    optional sorting criteria, returning the data as a JSON object for further use
    in the playbook.


    ### Flow Description

    1. Extracts the Airtable API key from the integration configuration.

    2. Retrieves action parameters including the Base ID, Table Name, Max Records,
    and sorting preferences.

    3. Initializes the Airtable client with the provided credentials and base/table
    details.

    4. Makes an API call to Airtable (`get_all`) to fetch the records, applying the
    specified maximum limit and sorting direction if a sort column is provided.

    5. Outputs the retrieved records as a JSON result and completes the action with
    a summary message.


    ### Additional Notes

    The action requires a valid Airtable Base ID and Table Name. Sorting is optional
    but requires specifying a column name and direction (Ascending or Descending).
  ai_short_description: >-
    Retrieves all records from a specified table within an Airtable base, returning
    the data as a JSON object.
  capabilities:
    can_create_case_comments: false
