Enrich Entities From Table:
  ai_description: >-
    ### General Description

    Searches an AirTable database for records matching entity identifiers or specific
    entity properties, and enriches the target entities with the retrieved data. This
    action allows analysts to dynamically query custom tables in AirTable and append
    the resulting structured data directly to the entities within the SecOps platform.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the AirTable
    Base ID, Table name, Field name, and the specific entity field to use for the
    search.

    2. Iterates through all target entities provided to the action.

    3. Determines the search value for each entity. If an `Entity Field` is specified,
    it extracts the value from the entity's additional properties; otherwise, it defaults
    to the entity's identifier.

    4. Makes an API call to AirTable (`airtable.search`) to find records in the specified
    table where the column matches the search value.

    5. If a matching record is found, the action flattens the JSON response, applies
    the specified `Enrichment Prefix`, and appends the data to the entity's additional
    properties.

    6. Updates the successfully enriched entities within the SecOps platform.

    7. Returns a JSON result containing the matched records and any errors encountered
    during the process.


    ### Additional Notes

    - If multiple records match the search criteria in AirTable, only the first returned
    record is used to enrich the entity.

    - If an `Entity Field` is specified but the entity does not possess that field
    in its additional properties, the entity will be skipped and logged as a failure.
  ai_short_description: >-
    Searches an AirTable database for records matching entity identifiers or properties
    and enriches the entities with the retrieved data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the additional properties of target entities with data retrieved from
      AirTable.
    reasoning: >-
      The action fetches data by making a search request to the AirTable API. It does
      not mutate external data in AirTable (read-only search). It mutates internal
      data by updating the entities' additional properties with the retrieved AirTable
      records and calling `siemplify.update_entities`. It does not create insights,
      modify alert data, or create case comments.
