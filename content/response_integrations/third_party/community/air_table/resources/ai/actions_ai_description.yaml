AddOrUpdate:
  ai_description: >-
    ### General Description

    Adds or updates records in a specified AirTable base and table. The action searches
    for existing records based on a specified field and either updates them if they
    exist or inserts new records if they do not.


    ### Flow Description

    1. Extracts the AirTable API key from the integration configuration.

    2. Retrieves the Base ID, Table Name, Field Name, and JSON fields from the action
    parameters.

    3. Parses the provided JSON fields string into a list of record dictionaries.

    4. Iterates through each record and performs a search API call to AirTable using
    the specified field name and its corresponding value.

    5. If matching records are found, performs an update API call to modify the existing
    records in AirTable.

    6. If no matching records are found, performs an insert API call to create a new
    record in AirTable.

    7. Returns a summary message detailing the total count of inserted and updated
    records.


    ### Additional Notes

    The `Json fields` parameter must be a valid JSON string representing a list of
    dictionaries, where each dictionary contains the fields and values to be added
    or updated. The `Field name` parameter must correspond to a key present in the
    JSON dictionaries to successfully search for existing records.
  ai_short_description: >-
    Adds or updates records in a specified AirTable base and table by searching for
    existing entries and performing either an insert or update operation.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Inserts new records or updates existing records in the specified AirTable base
      and table.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by searching AirTable for existing records. It mutates
      external data by inserting or updating records in the AirTable base. It does
      not mutate internal SecOps data, update entities, create insights, modify alerts,
      or create case comments.
  entity_usage:
