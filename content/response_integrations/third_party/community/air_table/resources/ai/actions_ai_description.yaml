Create:
  ai_description: >-
    ### General Description

    Creates new records in a specified Airtable base and table. This action allows
    users to insert one or multiple rows of structured data into an Airtable database
    by providing the data in JSON format.


    ### Flow Description

    1. Retrieves the Airtable API key from the integration configuration.

    2. Extracts the `Base id`, `Table name`, and `Json fields` from the action parameters.

    3. Parses the `Json fields` parameter into a list of dictionaries representing
    the rows to be inserted.

    4. Iterates through the parsed rows and makes an API call (`airtable.insert`)
    to the Airtable service for each row to create the new records.

    5. Collects the resulting record IDs and fields, outputting them as a JSON result
    and returning a summary message of the total records added.


    ### Additional Notes

    The `Json fields` parameter must be formatted as a valid JSON array of objects
    (e.g., `[{"Column1": "Value1"}, {"Column1": "Value2"}]`).
