Approval Response:
  ai_description: >-
    ### General Description

    Allows a designated user to respond to an approval request within a workflow,
    either approving or denying it. It verifies the user's authorization, logs the
    decision, and optionally adds comments to the case while notifying a Slack channel.


    ### Flow Description

    1. Extracts configuration and action parameters, including the Slack webhook URL
    and the reviewer's decision.

    2. Verifies if the requesting user matches the designated Approval Manager or
    Secondary Approval Manager (or their respective roles) by querying the Siemplify
    API (`/api/external/v1/settings/GetUserProfiles`).

    3. If authorized, processes the approval or denial decision.

    4. If comments are provided, appends them to the case using `siemplify.add_comment`.

    5. Sends a notification message containing the decision and comments to Slack
    via an HTTP POST request to the configured webhook URL.

    6. Returns a JSON result with the approval status and reviewer details.


    ### Additional Notes

    If the user is unauthorized, the action will fail and raise an error, halting
    the workflow.
  ai_short_description: >-
    Allows an authorized user to approve or deny a workflow request, appending any
    provided comments to the case and sending a notification to a configured Slack
    webhook.
  capabilities:
    can_create_case_comments: true
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: >-
      Sends an approval or denial notification message to a configured Slack webhook.
    fetches_data: false
    internal_data_mutation_explanation: >-
      Adds the reviewer's response comments to the case within Google SecOps.
    reasoning: >-
      The action does not fetch external contextual data. It mutates external data
      by sending a POST request to a Slack webhook. It mutates internal data by adding
      a comment to the case. It does not update entities or create insights.
