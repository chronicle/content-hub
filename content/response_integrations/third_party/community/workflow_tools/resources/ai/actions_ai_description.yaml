Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity and configuration of the Workflow Tools integration.


    ### Flow Description

    1. Extracts integration configuration parameters including API details, Slack
    webhook URL, and approval managers.

    2. Initializes the WorkflowToolsManager.

    3. Queries the Siemplify API to verify the configured approval managers' roles.

    4. Sends a test message to the configured Slack webhook URL to verify connectivity.

    5. Returns a successful execution status if all checks pass.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can communicate with both the Siemplify API and the Slack webhook.
