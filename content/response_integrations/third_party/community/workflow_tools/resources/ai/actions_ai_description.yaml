Approval Request:
  ai_description: >-
    ### General Description

    Assigns a case or alert to a reviewer for approval and optionally sends a notification
    to Slack.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Checks if the alert should be moved to a new case if grouped with other alerts.

    3. If not moving, assigns the current case to the reviewer and sends a Slack message
    via a POST request to the configured webhook.

    4. If moving and there are multiple alerts, calls the Siemplify API (`/api/external/v1/cases/MoveAlertToNewCase`)
    to move the alert to a new case, assigns the new case to the reviewer, and sends
    a Slack message.

    5. If moving but there is only one alert, assigns the current case to the reviewer
    and sends a Slack message.

    6. Returns a JSON result containing the original case ID, new case ID, and reviewer
    information.


    ### Additional Notes

    Requires Siemplify API credentials and optionally a Slack Webhook URL configured
    in the integration settings.
  ai_short_description: >-
    Assigns a case or alert to a reviewer for approval, optionally moving grouped
    alerts to a new case, and sends a notification to Slack.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: true
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: >-
      Sends a notification message to a Slack channel via a Webhook.
    fetches_data: false
    internal_data_mutation_explanation: >-
      Assigns the case to a reviewer and optionally moves the alert to a new case.
    reasoning: >-
      The action does not fetch external data. It mutates external data by sending
      a message to a Slack webhook. It mutates internal data by assigning a case to
      a user and potentially moving an alert to a new case via the Siemplify API.
      It does not update entities, create insights, or create case comments. It modifies
      alert data by changing the assignee and potentially the parent case.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
