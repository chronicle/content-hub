name: Vectra RUX - Expire Inactive Detections Job
parameters:
-   name: API Root
    default_value: https://<address>:<port>
    type: string
    description: The base URL of the API, used as the entry point for all API requests.
    is_mandatory: true
-   name: Client ID
    default_value: ''
    type: string
    description: A unique identifier assigned to each client to authenticate and authorize
        API requests.
    is_mandatory: true
-   name: Client Secret
    default_value: ''
    type: password
    description: A confidential key associated with the client ID, used to authenticate
        and securely authorize API requests.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: '24'
    type: string
    description: 'Maximum backwards hours to fetch open cases (Default value: 24 hours
        if value not provided). Must be greater than 0.'
    is_mandatory: false
-   name: Environments
    default_value: Default Environment
    type: string
    description: 'Environments (Comma-separated allowed, Default: Default Environment)'
    is_mandatory: true
-   name: Products
    default_value: Vectra RUX
    type: string
    description: 'Product Field Name (Comma-separated allowed, Default: Vectra RUX)'
    is_mandatory: true
-   name: Max Cases To Process
    default_value: '2000'
    type: string
    description: 'Maximum number of open cases to fetch and process per run (Default:
        2000, hard ceiling: 10000). Lower this if runs are timing out due to high
        case volume.'
    is_mandatory: false
-   name: Max Detections To Fetch
    default_value: ''
    type: string
    description: Number of events after which the connector stops making further API
        calls. If kept empty all available detection events will be fetched
    is_mandatory: false
description: Job to query Vectra for inactive detections and close the corresponding
    alerts in Google SecOps
documentation_link: null
integration: VectraRUX
creator: 27ce8f36-cdfe-4aac-8d76-05958a92556b
