name: Vectra RUX - Clean Up Previous Alerts For Expired Detections Job
parameters:
-   name: Max Hours Backwards
    default_value: '24'
    type: string
    description: 'Maximum backwards hours to fetch open cases (Default value: 24 hours
        if value not provided). Must be greater than 0.'
    is_mandatory: false
-   name: Environments
    default_value: Default Environment
    type: string
    description: 'Environments (Comma-separated allowed, Default: Default Environment)'
    is_mandatory: true
-   name: Products
    default_value: Vectra RUX
    type: string
    description: 'Product Field Name (Comma-separated allowed, Default: Vectra RUX)'
    is_mandatory: true
-   name: Max Cases To Process
    default_value: '2000'
    type: string
    description: 'Maximum number of open cases to fetch and process per run (Default:
        2000, hard ceiling: 10000). Lower this if runs are timing out due to high
        case volume.'
    is_mandatory: false
description: Job to fetch the latest alert in each SecOps case and, if it has an investigation_status
    of closed or expired, close all previous alerts in that case.
documentation_link: null
integration: VectraRUX
creator: 27ce8f36-cdfe-4aac-8d76-05958a92556b
