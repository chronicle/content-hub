    4. Makes a GET request to the Vectra RUX API (`describe_entity`) to retrieve the
    entity's details, specifically its associated detection IDs.

    5. If detections are found, makes a subsequent GET request (`list_entity_detections`)
    to fetch the detailed information for those detection IDs, applying the specified
    `Limit` and `State` filters.

    6. Returns the retrieved detections as a JSON array and constructs a CSV data
    table for the case wall.


    ### Additional Notes

    - The `Entity Type` must be either 'Account' or 'Host'.

    - If no detections are found for the given entity, the action will return an empty
    JSON array and a corresponding output message.
