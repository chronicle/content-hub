Add Tags:
  ai_description: >-
    ### General Description

    Adds specified tags to given entity IDs (Account, Host, or Detection) in Vectra
    RUX.


    ### Flow Description

    1. Extracts the provided tags, entity IDs, and entity type from the action parameters.

    2. Deduplicates the provided tags and entity IDs.

    3. Iterates through each entity ID.

    4. Makes a GET request to the Vectra RUX API to fetch the existing tags for the
    entity.

    5. Merges the new tags with the existing tags.

    6. Makes a PATCH request to the Vectra RUX API to update the entity with the combined
    list of tags.

    7. Returns a JSON result and a data table summarizing the status of the tag updates
    for each entity ID.


    ### Additional Notes

    None.
