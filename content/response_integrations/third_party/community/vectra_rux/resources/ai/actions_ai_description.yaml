Add Note:
  ai_description: >-
    ### General Description

    Adds a note to a specific entity (Account, Host, or Detection) in Vectra RUX.
    This action initiates a state change on the external system by appending the provided
    text note to the specified entity's record.


    ### Flow Description

    1. Extracts the `Note`, `Entity ID`, and `Entity Type` from the action parameters.

    2. Validates the `Entity ID` to ensure it is a valid integer.

    3. Makes a POST request to the Vectra RUX API (`/api/v3.4/entities/{entity_id}/notes`)
    to add the note to the specified entity.

    4. Retrieves the created note details and populates them into a data table and
    JSON result.


    ### Additional Notes

    Ensure that the provided `Entity ID` corresponds to an existing entity of the
    selected `Entity Type` in Vectra RUX.
  ai_short_description: >-
    Adds a note to a specific entity (Account, Host, or Detection) in Vectra RUX.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
