Update Assignment:
  ai_description: >-
    ### General Description

    Updates the assigned user for a specific assignment associated with a given entity
    in VectraRUX.


    ### Flow Description

    1. Retrieves the `Entity ID`, `Entity Type`, and `User ID` from the action parameters.

    2. Validates the `Entity ID` and `User ID` to ensure they are valid integers.

    3. Makes a GET request to the VectraRUX API to fetch the specific entity information
    and retrieve its associated assignment ID.

    4. Makes a PUT request to the VectraRUX API to update the assignment with the
    provided `User ID`.

    5. Returns the updated assignment details as a JSON result and a data table.


    ### Additional Notes

