    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a note to a specific entity (Account, Host, or Detection) in Vectra RUX.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Vectra RUX API to add a note to a specific
      entity, which mutates external data. It does not fetch contextual data, mutate
      internal SOAR data, update entities, create insights, modify alert data, or
      create case comments.
