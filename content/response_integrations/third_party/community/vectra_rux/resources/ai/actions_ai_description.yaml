    Removes specified members from a group in VectraRUX.


    ### General Description

    This action removes a list of members from a specified group in VectraRUX. It
    first retrieves the current members of the group, then sends a request to remove
    the specified members, and finally reports on which members were successfully
    removed and which were not found in the group.


