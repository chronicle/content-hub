name: Set Entity Ticket
description: Set external refernce id to provided entity.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Unique ID value of the entity for which the external reference ID
        will be set.
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Host
    - Account
    description: Type of the entity for which the external reference ID will be set.
    is_mandatory: true
-   name: External Reference ID
    default_value: ' '
    type: string
    description: External reference ID (ticket ID) to be set on the provided entity.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/set_entity_ticket_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
