name: Close Detections
description: Close all the provided detections.
integration_identifier: VectraRUX
parameters:
-   name: Detection IDs
    default_value: 101, 102
    type: string
    description: Comma-separated list of detection IDs to be closed.
    is_mandatory: true
-   name: Reason
    default_value: Remediated
    type: ddl
    optional_values:
    - Remediated
    - Benign
    description: Reason for closing the provided detection ID(s).
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/close_detections_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
