name: Update Assignment
description: Updates the assigned user in the assignment for the given entity.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Entity ID of assignment to update
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Account
    - Host
    description: Entity Type of entity
    is_mandatory: true
-   name: User ID
    default_value: ' '
    type: string
    description: User ID to assign assignment to that user
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/update_assignment_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
