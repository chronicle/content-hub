name: Set Detection Ticket
description: Set external refernce id to provided detecions.
integration_identifier: VectraRUX
parameters:
-   name: Detection IDs
    default_value: 101,102
    type: string
    description: Comma-separated list of detection IDs for which the external reference
        ID will be set.
    is_mandatory: true
-   name: External Reference ID
    default_value: ' '
    type: string
    description: External reference ID (ticket ID) to be set on the provided detection
        ID(s).
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/set_detection_ticket_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
