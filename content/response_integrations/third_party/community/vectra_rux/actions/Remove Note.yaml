name: Remove Note
description: Remove a note from the given entity ID.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: ID of the Entity from which user wants to remove note.
    is_mandatory: true
-   name: Note ID
    default_value: '0'
    type: string
    description: ID of the specific note which user wants to remove from the provided
        entity ID
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Account
    - Host
    - Detection
    description: Type of the entity from user wants to remove note
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
