name: Update Entity Note
description: Update the note of the provided entity.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Unique ID value of the entity in which the note will be updated.
    is_mandatory: true
-   name: Entity Type
    default_value: Host
    type: ddl
    optional_values:
    - Host
    - Account
    description: Type of the entity in which the note will be updated.
    is_mandatory: true
-   name: Note ID
    default_value: '0'
    type: string
    description: Unique ID of the note to be updated.
    is_mandatory: true
-   name: Note
    default_value: ' '
    type: string
    description: Updated note content to be set on the provided entity.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/update_entity_note_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
