name: Set Entity Unresolved Priority
description: Set unresolved priority of the given entity.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Unique ID value of the entity for which unresolved priority will
        be set.
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Host
    - Account
    description: Type of the entity for which unresolved priority will be set.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/set_entity_unresolved_priority_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
