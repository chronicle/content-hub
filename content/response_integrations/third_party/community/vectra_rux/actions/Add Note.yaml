name: Add Note
description: Add a note to the given entity ID.
integration_identifier: VectraRUX
parameters:
-   name: Note
    default_value: ' '
    type: string
    description: Note to be added to provided entity id and entity type
    is_mandatory: true
-   name: Entity ID
    default_value: '0'
    type: string
    description: Entity ID in which the note will be added
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Account
    - Host
    - Detection
    description: Type of the entity in which the note will be added
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_note_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
