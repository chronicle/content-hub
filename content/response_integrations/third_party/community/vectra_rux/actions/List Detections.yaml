name: List Detections
description: List all the detections for the given entity ID.
integration_identifier: VectraRUX
parameters:
-   name: Detection Category
    default_value: None
    type: ddl
    optional_values:
    - Info
    - Exfiltration
    - Lateral Movement
    - Reconnaissance
    - Botnet
    - Command and Control
    - None
    description: Filter detections by Detection Category
    is_mandatory: false
-   name: Threat GTE
    default_value: ''
    type: string
    description: Filter detections whose threat is greater then given value
    is_mandatory: false
-   name: Certainty GTE
    default_value: ''
    type: string
    description: Filter detections if the certainty is greater or equal to given value
    is_mandatory: false
-   name: Last Timestamp GTE
    default_value: ''
    type: string
    description: Filter detections based on timestamp
    is_mandatory: false
-   name: Last Timestamp LTE
    default_value: ''
    type: string
    description: Filter detections based on last time stamp
    is_mandatory: false
-   name: Tags
    default_value: ''
    type: string
    description: Provide tags with coma separated values to filter detections
    is_mandatory: false
-   name: Entity Type
    default_value: None
    type: ddl
    optional_values:
    - Host
    - Account
    - None
    description: Type of Entity
    is_mandatory: false
-   name: Entity ID
    default_value: ''
    type: string
    description: ID of entity
    is_mandatory: false
-   name: Is Targeting Key Asset
    default_value: None
    type: ddl
    optional_values:
    - 'True'
    - 'False'
    - None
    description: Filter detections based on if it's targeting key asset or not
    is_mandatory: false
-   name: Note Modified Timestamp GTE
    default_value: ''
    type: string
    description: Filter detections based on note modified timestamp
    is_mandatory: false
-   name: Limit
    default_value: ''
    type: string
    description: Number of records to fetch
    is_mandatory: false
-   name: Order
    default_value: ''
    type: ddl
    optional_values:
    - Ascending
    - Descending
    description: Order records by ascending or descending
    is_mandatory: false
-   name: Order By
    default_value: None
    type: ddl
    optional_values:
    - last_timestamp
    - threat_score
    - certainty_score
    - None
    description: Order records by  last_timestamp, threat_score, and certainty_score
    is_mandatory: false
-   name: State
    default_value: None
    type: ddl
    optional_values:
    - Active
    - Inactive
    - Fixed
    - None
    description: Filter detections by State
    is_mandatory: false
-   name: Detection Type
    default_value: ''
    type: string
    description: Filter detections by detection type
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_detections_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
