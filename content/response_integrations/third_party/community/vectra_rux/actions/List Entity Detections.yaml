name: List Entity Detections
description: List all the detections for the given entity ID.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Unique ID value of an entity
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Account
    - Host
    description: Type of an entity, It could be either Account or Host.
    is_mandatory: true
-   name: Limit
    default_value: ''
    type: string
    description: Limit for page size.
    is_mandatory: false
-   name: State
    default_value: None
    type: ddl
    optional_values:
    - Active
    - Inactive
    - Fixed
    - None
    description: State of detections to filter.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_entity_detections_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
