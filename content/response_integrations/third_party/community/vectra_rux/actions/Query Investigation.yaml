name: Query Investigation
description: Start the query investigation provided by user.
integration_identifier: VectraRUX
parameters:
-   name: Query
    default_value: hosts()
    type: string
    description: The investigation query to be executed.
    is_mandatory: true
-   name: Version
    default_value: ''
    type: string
    description: The version of the query to be executed.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/query_investigation_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
