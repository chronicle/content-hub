name: List Tags
description: List all tags in given entity.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Unique ID value of an entity for which tags will be listed.
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Host
    - Account
    - Detection
    description: Type of the entity for which tags will be listed.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/list_tags_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
