name: Set Detection Status
description: Set status of detection provided by user.
integration_identifier: VectraRUX
parameters:
-   name: Detection IDs
    default_value: 101,102
    type: string
    description: Comma-separated list of detection IDs for which the investigation
        status will be updated.
    is_mandatory: true
-   name: Investigation Status
    default_value: Escalated
    type: ddl
    optional_values:
    - Open
    - Acknowledged
    - Escalated
    - Paused
    - Closed
    - Expired
    description: Investigation status to be set for the provided detection ID(s).
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/set_detection_status_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
