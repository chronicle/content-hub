name: Describe Entity
description: Show all the details of an entity for the given ID.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Unique id for Entity to get entity
    is_mandatory: true
-   name: Entity Type
    default_value: Account
    type: ddl
    optional_values:
    - Account
    - Host
    description: Type of entity either Account or Host
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/describe_entity_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
