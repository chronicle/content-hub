name: Close Entity Detections
description: Close all the detections present in given entity.
integration_identifier: VectraRUX
parameters:
-   name: Entity ID
    default_value: '0'
    type: string
    description: Unique ID value of the entity whose detections will be closed.
    is_mandatory: true
-   name: Entity Type
    default_value: Host
    type: ddl
    optional_values:
    - Host
    - Account
    description: Type of the entity whose detections will be closed.
    is_mandatory: true
-   name: Reason
    default_value: Remediated
    type: ddl
    optional_values:
    - Remediated
    - Benign
    description: Reason for closing the detections present in the provided entity.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/close_entity_detections_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
