    description: The request ID of the investigation for which results will be retrieved.
    is_mandatory: true
-   name: Limit
    default_value: ''
    type: string
    description: The maximum number of investigation results to return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_investigation_results_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
