name: Vectra RUX - Detection Events Connector
parameters:
-   name: API Root
    default_value: https://<address>:<port>
    type: string
    description: The base URL of the API, used as the entry point for all API requests.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client ID
    default_value: '12345'
    type: string
    description: A unique identifier assigned to each client to authenticate and authorize
        API requests.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client Secret
    default_value: 'null'
    type: password
    description: A confidential key associated with the client ID, used to authenticate
        and securely authorize API requests.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Entity Type
    default_value: Host,Account
    type: string
    description: "Type of the Entity\n (Account, Host)"
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Include Triaged
    default_value: 'false'
    type: boolean
    description: If it is set, include the triaged events.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Limit
    default_value: ''
    type: integer
    description: Number of events after which the connector stops making further API
        calls. If kept empty all available detection events will be fetched
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Hours Backwards
    default_value: '0'
    type: integer
    description: 'Number of hours before the first connector iteration to retrieve
        alerts from for the first time. Default: 0'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Unresolved Priority
    default_value: 'true'
    type: boolean
    description: Indicates whether the related entity was recently prioritized and
        has not yet been reset (e.g., score has not reached 0 or been manually cleared).
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: DeviceProductField
    default_value: Vectra RUX
    type: string
    description: The field name used to determine the device product
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: detection_type
    type: string
    description: The field name used to determine the event name (sub-type)
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '1200'
    type: string
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: false
    mode: regular
description: The connector retrieves detection events from the Vectra RUX platform.
    Each detection event is mapped to an alert, and the raw event data is available
    in the alert extensions and events. The alert grouping rule should be set with
    the Source Grouping Identifier to attach updates for the same detection to the
    same case, and the grouping limit should be set to the maximum possible value.
integration: VectraRUX
documentation_link: null
rules: []
is_connector_rules_supported: false
creator: 322ce0cd-9b16-4871-8c2d-134b55f8317f
