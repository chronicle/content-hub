Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and URL entities using the WHOIS XML API. This action retrieves
    WHOIS registration details for the specified indicators and updates the entities'
    additional properties within the SecOps platform with the extracted data.


    ### Flow Description

    1. Extracts the API key from the integration configuration.

    2. Iterates through the target entities, filtering specifically for external Hostnames
    (`is_internal` is false) and URLs.

    3. Makes an HTTP GET request to the WHOIS XML API (`https://www.whoisxmlapi.com/whoisserver/WhoisService`)
    for each valid entity to retrieve WHOIS records.

    4. Parses the JSON response to extract the `registrant` details from the `WhoisRecord`.

    5. Updates the entity's `additional_properties` with the extracted registrant
    data.

    6. Returns the raw JSON results and calls `siemplify.update_entities` to save
    the enriched data back to the platform.


    ### Additional Notes

    Internal Hostnames are explicitly skipped during execution. Ensure the WHOIS XML
    API integration is properly configured with a valid API key.
  ai_short_description: >-
    Enriches external Hostname and URL entities by retrieving WHOIS registration details
    from the WHOIS XML API and updating the entities' additional properties in the
    platform.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP GET request to the WHOIS XML API to fetch WHOIS data,
      meaning it fetches data. It does not perform any state-changing operations on
      external systems (no external mutation). It updates internal entities by calling
      `siemplify.update_entities` with the enriched data. It does not create insights,
      modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: false
      generic: false
      host_name: true
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: true
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: true
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The script iterates over `siemplify.target_entities` and applies the filter
      `(entity.entity_type == EntityTypes.HOSTNAME and not entity.is_internal) or
      entity.entity_type == EntityTypes.URL`. This indicates it explicitly targets
      HOSTNAME and URL entity types, and filters them based on their `entity_type`
      and `is_internal` attributes.
  outcome_categories:
