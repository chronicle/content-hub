Ping:
  ai_description: >-
    ### General Description

    Checks connectivity to the WHOIS XML API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Extracts the API key from the integration configuration.

    2. Makes an HTTP GET request to the WHOIS XML API endpoint using a hardcoded test
    domain (`google.com`).

    3. Evaluates the response to verify that the API key authenticated successfully.

    4. Returns a successful connection message if no authentication errors are found.


    ### Additional Notes

    This is a utility action used primarily for testing integration credentials and
    network connectivity. It does not process alerts or entities.
