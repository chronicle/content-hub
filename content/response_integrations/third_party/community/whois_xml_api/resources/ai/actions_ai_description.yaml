Get Domain Details:
  ai_description: >-
    ### General Description

    Retrieves WHOIS details for a specified domain using the WHOIS XML API and returns
    the data as a JSON result. This action provides contextual intelligence about
    domain registration and availability.


    ### Flow Description

    1. Extracts the `Domain Name` and `Check availability` parameters from the action
    configuration.

    2. Constructs the API request URL for the WHOIS XML API, appending the necessary
    query parameters.

    3. Executes an HTTP GET request to fetch the domain details.

    4. Parses the response and attaches the JSON output to the action results (`siemplify.result.add_result_json`
    and `siemplify.result.add_json`) for use in subsequent playbook steps.


    ### Additional Notes

    This action does not operate directly on case entities; instead, it relies on
    the provided domain parameter to perform the lookup.
