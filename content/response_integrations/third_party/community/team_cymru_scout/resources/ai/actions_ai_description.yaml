Account Usage:
  ai_description: >-
    ### General Description

    Retrieves the current account usage metrics from the Team Cymru Scout API. This
    action provides visibility into the remaining queries and limits associated with
    the configured account.


    ### Flow Description

    1. Initializes the API client using the provided integration credentials.

    2. Makes a GET request to the `/usage` endpoint of the Team Cymru Scout API.

    3. Retrieves the account usage details, including used queries, remaining queries,
    and query limits.

    4. Formats the retrieved data into a table and attaches the raw JSON response
    to the action results.


    ### Additional Notes

    This action does not require any specific parameters and operates independently
    of case entities.
