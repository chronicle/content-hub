Advanced Query:
  ai_description: >-
    ### General Description

    The Advanced Query action executes a search query using the Scout query language
    against the Team Cymru Scout platform to retrieve summary information, telemetry,
    and threat intelligence data.


    ### Flow Description

    1. Extracts the provided query and optional time/size parameters (Start Date,
    End Date, Days, Size).

    2. Validates the input parameters to ensure correct date formats and limits.

    3. Makes an HTTP GET request to the Team Cymru Scout `/search` endpoint to execute
    the query.

    4. Parses the response to extract IP summaries, PDNS, open ports, top peers, service
    counts, fingerprints, and certificates.

    5. Generates data tables for the retrieved information, creates an account usage
    table, and attaches the raw JSON response to the action results.


    ### Additional Notes

    The action does not operate on specific entities but rather accepts a raw Scout
    query string. The 'Days' parameter takes priority over 'Start Date' and 'End Date'
    if all three are provided.
