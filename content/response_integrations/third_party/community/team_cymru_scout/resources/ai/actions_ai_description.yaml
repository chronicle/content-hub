Extract Tags:
  ai_description: >-
    ### General Description

    Extracts tags from a specified IP address and its peers using Team Cymru Scout,
    and checks if any of the provided search tags are associated with them.


    ### Flow Description

    1. Extracts the 'IP Address' and 'Tags to Search' parameters.

    2. Validates the provided IP address format.

    3. Makes a GET request to the Team Cymru Scout API to retrieve details for the
    specified IP address.

    4. Parses the response to extract tags associated with the IP address and its
    communicating peers.

    5. Compares the extracted tags against the provided list of tags to search.

    6. If matches are found, adds the matching IPs and their tags to the JSON result
    and outputs a success message.

    7. Renders an account usage data table.


    ### Additional Notes

    This action does not automatically update entities or create insights; it primarily
    returns the matching tags and IPs as a JSON result.
