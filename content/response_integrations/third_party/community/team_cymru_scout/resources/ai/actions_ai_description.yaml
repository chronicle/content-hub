Enrich IPs:
  ai_description: >-
    ### General Description

    Enriches IP Address entities using the Team Cymru Scout platform. This action
    retrieves threat intelligence and summary information for IP addresses to determine
    their risk level and provide additional context.


    ### Flow Description

    1. Collects all IP Address entities from the target entities.

    2. Checks if each entity has already been enriched within the last 24 hours by
    evaluating the `TCS_last_enriched` key in its `additional_properties`.

    3. Makes a GET request to the Team Cymru Scout API (`/ip/foundation`) to fetch
    summary data for the valid IP addresses.

    4. Evaluates the returned rating; if the rating is 'malicious' or 'suspicious',
    the entity's `is_suspicious` flag is set to True.

    5. Updates the entity's `additional_properties` with the retrieved enrichment
    data (prefixed with 'TCS') and sets `is_enriched` to True.

    6. Saves the updated entities back to the platform.

    7. Returns the summary data as a JSON result.


    ### Additional Notes

    Entities that have been enriched within the last 24 hours are skipped to optimize
    API usage.
  ai_short_description: >-
    Enriches IP Address entities with threat intelligence and summary data from the
    Team Cymru Scout platform.
