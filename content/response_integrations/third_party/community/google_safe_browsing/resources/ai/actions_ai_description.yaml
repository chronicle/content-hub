Lookup:
  ai_description: >-
    ### General Description

    Checks if a specific URL is safe for browsing using Google Safe Browsing.


    ### Flow Description

    1. Extracts the target URL from the action parameters.

    2. Makes an API call to Google Safe Browsing (`lookup_urls`) to retrieve the reputation
    and safety status of the URL.

    3. Parses the API response to determine if the URL is flagged as malicious.

    4. Appends the raw API response to the action's JSON results.

    5. Completes the action execution, returning a boolean value and a message indicating
    whether the URL was found to be malicious.


    ### Additional Notes

    This action relies on the `pysafebrowsing` library to interact with the Google
    Safe Browsing API.
  ai_short_description: >-
    Checks if a specific URL is safe for browsing by querying the Google Safe Browsing
    API and returning its malicious status.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches URL reputation data from Google Safe Browsing via an API
      lookup. It does not mutate external data, update internal entities, create insights,
      modify alerts, or create case comments.
