Ping:
  ai_description: >-
    ### General Description

    Tests connectivity with the Google Safe Browsing service. This action verifies
    that the provided API key and network configurations are correct by attempting
    a test query against the service.


    ### Flow Description

    1. Extracts the API key from the integration configuration.

    2. Initializes the Google Safe Browsing client.

    3. Performs a test URL lookup (`http://malware.testing.google.test/testing/malware/`)
    via the API to verify connectivity.

    4. Returns a successful connection message if the API call succeeds.


    ### Additional Notes

    This is a standard ping action used solely to verify integration credentials and
    network connectivity. It does not process any case entities or return actionable
    threat intelligence for the case.
  ai_short_description: >-
    Tests connectivity with the Google Safe Browsing service by performing a test
