Upload Image From File Path:
  ai_description: >-
    **General Description**

    Uploads an image from a specified local file path to Imgbb and retrieves the resulting
    image URL.


    **Flow Description**

    1. Extracts the image file path from the action parameters.

    2. Opens the local file and converts the image content to a base64 encoded string.

    3. Makes a POST request to the Imgbb API (`https://api.imgbb.com/1/upload`) with
    the base64 image data.

    4. Parses the API response to extract the uploaded image's URL.

    5. Attaches the image URL as a link and a JSON result to the action's output.


    **Additional Notes**

    The Imgbb API key must be configured in the integration settings. The uploaded
    image is set to expire in 600 seconds (10 minutes) based on the hardcoded URL
    parameter.
