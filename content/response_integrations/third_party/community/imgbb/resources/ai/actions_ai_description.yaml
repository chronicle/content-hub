Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Imgbb service by verifying the provided API credentials.


    ### Flow Description

    1. Retrieves the API key from the integration configuration.

    2. Sends a POST request to the Imgbb API (`https://api.imgbb.com/1/upload`) containing
    a hardcoded base64 test image.

    3. Evaluates the HTTP response to determine if the connection and authentication
    were successful.

    4. Returns a success message if the request completes without errors.


    ### Additional Notes

    This action is typically used as a diagnostic tool to verify that the integration
    is configured correctly with valid credentials.
  ai_short_description: >-
    Tests connectivity to the Imgbb service by uploading a hardcoded test image to
    verify API credentials.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
