    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads a hardcoded test image to the Imgbb service to verify API connectivity.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Imgbb API to upload a test image, which
      mutates external data. It does not fetch contextual data, mutate internal data,
      update entities, create insights, modify alerts, or create case comments.
