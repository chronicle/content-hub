Upload Image From Base64:
  ai_description: >-
    ### General Description

    Uploads a base64 encoded image to the Imgbb service and retrieves the resulting
    hosted image URL.


    ### Flow Description

    1. Extracts the base64 image string from the action parameters.

    2. Makes an HTTP POST request to the Imgbb API (`https://api.imgbb.com/1/upload`)
    with the base64 data.

    3. Parses the JSON response to extract the uploaded image's URL.

    4. Adds the image URL to the action's JSON result and attaches it as a clickable
    link in the SecOps platform.


    ### Additional Notes

    - The uploaded image is configured to expire in 600 seconds (10 minutes) based
    on the hardcoded API URL parameter.

    - If the upload fails or the response is not valid JSON, the action will raise
    an exception or return an error message in the JSON result.
  ai_short_description: >-
    Uploads a base64 encoded image to the Imgbb service and returns the generated
    image URL.
