Add Domain to Allowed Lists:
  ai_description: >-
    ### General Description

    This action adds URL entities to a specified Domain Allowed List in Bandura Cyber.
    It extracts the domain from the URL entity and registers it in the external system
    to prevent it from being blocked or generating false positives.


    ### Flow Description

    1. Initializes the Bandura Cyber integration with the provided credentials.

    2. Filters the target entities to include only URL entities.

    3. Iterates through the filtered URL entities and extracts the domain using the
    original identifier.

    4. Makes an API call to Bandura Cyber to add the extracted domain to the specified
    allowed list, optionally including a description and expiration date.

    5. Aggregates the results and attaches them as JSON to the action result.


    ### Additional Notes

    The 'List Name' parameter is case-sensitive.
