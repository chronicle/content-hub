Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Bandura Cyber platform by attempting to authenticate
    using the provided integration credentials.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the `BanduraCyberManager`, which makes a POST request to the `/auth/login`
    endpoint to obtain an access token.

    3. Makes a POST request to the `/auth/logout` endpoint to close the session.

    4. Evaluates if the access token was successfully retrieved to determine the connection
    status and returns a success or failure message.


    ### Additional Notes

