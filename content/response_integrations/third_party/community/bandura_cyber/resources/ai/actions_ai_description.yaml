Add Domain to Denied Lists:
  ai_description: >-
    ### General Description

    This action processes URL entities and adds their extracted domains to a specified
    Domain Denied List in Bandura Cyber. This effectively updates security controls
    to block network traffic associated with the domains.


    ### Flow Description

    1. Initializes the connection to the Bandura Cyber API using the provided integration
    credentials.

    2. Filters the case target entities to isolate only URL entities.

    3. For each URL entity, extracts the original identifier and parses the domain
    (netloc) from the URL.

    4. Makes a POST request to the Bandura Cyber API to add the parsed domain to the
    specified denied list, optionally applying a description and expiration date.

    5. Aggregates the successful additions and attaches them to the action's JSON
    result.


    ### Additional Notes

    The 'List Name' parameter is case-sensitive and must exactly match an existing
    Domain Denied List in Bandura Cyber.
