    ### General Description

    Enriches Observable (SCO) entities using OpenCTI. This action retrieves metadata
    such as score, labels, description, and relationships for the observable. It evaluates
    the retrieved score against a configured threshold to determine if the entity
    should be marked as suspicious, and optionally generates an insight with the gathered
    intelligence.


