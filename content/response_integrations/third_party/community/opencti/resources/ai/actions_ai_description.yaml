Enrich Indicator:
  ai_description: >-
    ### General Description

    Enriches Indicator entities (Address, File Hash, URL, Hostname, and Domain) by
    retrieving metadata and relationships from OpenCTI. The action fetches threat
    intelligence such as score, confidence, kill chain phases, and related entities,
    updating the target entities in Google SecOps and optionally generating a detailed
    insight.


    ### Flow Description

    1. Iterates over the supported target entities provided to the action.

    2. Makes an API call to OpenCTI (`enrich_indicator`) to fetch indicator enrichment
    data.

    3. Evaluates the retrieved OpenCTI score against the configured `Threshold`; if
    the score meets or exceeds the threshold, the entity is marked as suspicious.

    4. Updates the entity's `additional_properties` with the retrieved metadata (e.g.,
    score, confidence, validity window, labels, kill chain).

    5. Attaches a link to the OpenCTI indicator and a data table of relationships
    to the action's results.

    6. If `Create Insight` is enabled, generates a rich HTML insight on the entity
    containing the retrieved information and relationship mappings.


    ### Additional Notes

    - Supported entity types: Address, File Hash, URL, Hostname, and Domain.

    - If an indicator is not found in OpenCTI, the action will gracefully skip it
    and report it as not found in the final output message.
  ai_short_description: >-
    Enriches Indicator entities by retrieving metadata and relationships from OpenCTI,
    updating entity properties, and optionally creating an insight and marking the
    entity as suspicious based on a score threshold.
