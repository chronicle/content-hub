Add Object to Container:
  ai_description: >-
    ### General Description

    Adds a specified object to an existing container in OpenCTI. This action allows
    users to link objects (such as indicators, observables, or other entities) to
    specific containers like Reports, Incident Response Cases, or Groupings within
    the OpenCTI platform.


    ### Flow Description

    1. Validates the input parameters provided by the user.

    2. Maps the selected `Container Type` to the corresponding OpenCTI entity type.

    3. Makes an API call to OpenCTI (`api_client.add_object_to_container`) to add
    the specified object to the target container.

    4. Returns the JSON result of the operation and sets a success message.


    ### Additional Notes

    Ensure that both the `Container Id` and `Object Id` are valid and exist within
    the OpenCTI instance before executing this action.
  ai_short_description: >-
    Adds a specified object to an existing container in OpenCTI.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a specified object to an existing container in the OpenCTI platform.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an API call to OpenCTI to add an object to a container, which
      mutates external data. It does not fetch contextual data for enrichment, nor
      does it update internal entities, create insights, modify alert data, or create
      case comments.
