Create Campaign:
  ai_description: >-
    ### General Description

    Creates a new campaign in OpenCTI. This action allows users to define a threat
    campaign by specifying its name, description, timestamps, labels, and markings,
    and then pushes this record to the OpenCTI platform.


    ### Flow Description

    1. Extracts and validates the input parameters, including normalizing datetime
    strings to ISO 8601 UTC format and parsing comma-separated labels.

    2. Constructs a Campaign data model with the provided details.

    3. Makes an API call to OpenCTI to create the campaign record.

    4. Outputs the newly created campaign ID and the raw JSON response from the API.


    ### Additional Notes

    - The `First Seen` and `Last Seen` parameters support various datetime formats
    and will be automatically converted to ISO 8601 UTC.

    - The `Labels` parameter should be provided as a comma-separated list of strings.
