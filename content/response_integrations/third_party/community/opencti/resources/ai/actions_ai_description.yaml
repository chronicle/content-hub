    1. Iterates over supported target entities (Address, File Hash, URL, Hostname,
    Domain).

    2. Makes an API call to OpenCTI to fetch observable enrichment data for each entity.

    3. Evaluates the retrieved score against the configured `Threshold` parameter;
    if the score meets or exceeds the threshold, the entity is marked as suspicious.

    4. Updates the entity's additional properties with the retrieved metadata (score,
    labels, created_by, type, description).

    5. Creates an entity link to the observable in OpenCTI and a data table detailing
    its relationships.

    6. Generates an insight containing the observable details and relationships if
    the `Create Insight` parameter is enabled.


