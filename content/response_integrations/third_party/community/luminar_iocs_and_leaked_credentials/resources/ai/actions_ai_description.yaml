Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Luminar API using the configured integration credentials.


    ### Flow Description

    1. Extracts the Luminar API credentials and base URL from the integration configuration.

    2. Makes a POST request to the Luminar API token endpoint (`/externalApi/realm/{account_id}/token`)
    to verify the credentials.

    3. Returns a success status if the connection is established and authenticated,
    or a failure status otherwise.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the Luminar service. It does not perform any operations
    on entities or alerts.
  ai_short_description: >-
    Tests connectivity to the Luminar API using the configured integration credentials.
  capabilities:
