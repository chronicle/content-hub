Get Messages:
  ai_description: >-
    ### General Description

    Retrieves messages from a specific Telegram chat using the Telegram Bot API.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters.

    2. Initializes the Telegram API client.

    3. Makes a GET request to the `/getUpdates` endpoint to fetch messages based on
    the provided offset and allowed message types.

    4. Outputs the retrieved messages as a JSON result.


