Wait for poll results:
  ai_description: >-
    ### General Description

    This action waits for and retrieves the results of a specific Telegram poll. It
    continuously monitors the poll's answers asynchronously until a specified vote
    threshold is met or a custom timeframe expires.


    ### Flow Description

    1. Initializes the Telegram manager using the provided API token.

    2. Calculates the elapsed time since the action started and checks if the custom
    timeframe has been reached.

    3. Makes an API call to Telegram (`getUpdates`) to fetch recent updates and filters
    them for the specified Poll ID.

    4. Evaluates the poll options to determine if any answer has reached the required
    vote threshold.

    5. If the threshold is met, the action completes successfully. If the timeframe
    expires without meeting the threshold, it completes with a failure status. Otherwise,
    it remains in progress and waits for the next execution cycle.

    6. Outputs the raw poll results and the answers as JSON data.


    ### Additional Notes

    This is an asynchronous action that will run repeatedly until the conditions are
    met or the timeout is reached. It relies on the bot having access to the chat
    where the poll was sent.
