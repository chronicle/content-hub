Get Chat Details:
  ai_description: >-
    ### General Description

    Retrieves the details of a specific chat from Telegram using the provided Chat
    ID. This action fetches metadata about the chat, including its invite link, and
    returns the information for further use in the playbook.


    ### Flow Description

    1. Extracts the `Chat ID` parameter provided by the user.

    2. Makes an HTTP GET request to the Telegram API (`getChat` endpoint) to fetch
    the details of the specified chat.

    3. Extracts the invite link from the API response.

    4. Attaches the invite link and the full chat details JSON to the action results.


    ### Additional Notes

    Ensure that the Telegram bot has the necessary permissions to access the chat
    details.
