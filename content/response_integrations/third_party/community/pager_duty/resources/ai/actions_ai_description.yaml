Filtered Incident List:
  ai_description: >-
    ### General Description

    Retrieves a filtered list of incidents from PagerDuty based on specified criteria
    such as urgencies, statuses, date ranges, and associated IDs. This action allows
    analysts to query PagerDuty for specific incidents and returns the matching records
    as a JSON object for further use in the playbook.


    ### Flow Description

    1. Extracts filtering parameters including urgencies, service IDs, team IDs, user
    IDs, statuses, and date ranges.

    2. Parses and formats the provided parameters into a query dictionary, removing
    any empty or invalid values.

    3. Makes a GET request to the PagerDuty API (`/incidents` endpoint) to retrieve
    incidents matching the constructed criteria.

    4. Returns the retrieved incidents as a JSON result attached to the action execution.


    ### Additional Notes

    Multiple IDs (like User_IDS, Team_IDS, Service_IDS) can be provided as JSON-formatted
    string lists. If no incidents match the criteria, the action will complete successfully
    but return an empty list.
