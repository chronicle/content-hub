Get User By Email:
  ai_description: >-
    ### General Description

    Retrieves detailed user information from PagerDuty based on a provided email address.
    This action queries the PagerDuty API to find a specific user and returns their
    profile details as a JSON object for use in subsequent playbook steps.


    ### Flow Description

    1. Initializes the PagerDuty integration and retrieves configuration settings
    (API token).

    2. Extracts the target `Email` from the action parameters.

    3. Makes an HTTP GET request to the PagerDuty `/users` API endpoint, passing the
    email as a query parameter.

    4. Parses the API response to find an exact email match.

    5. Returns the matched user's details as a JSON result and completes the action
    successfully. If no user is found, the action fails.


    ### Additional Notes

    - The action requires a valid PagerDuty API token configured in the integration
    settings.

