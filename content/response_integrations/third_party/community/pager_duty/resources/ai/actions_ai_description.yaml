Create Incident:
  ai_description: >-
    ### General Description

    Creates a new incident in PagerDuty using the provided details, title, email,
    and urgency parameters. This action initiates a state change on the external PagerDuty
    service to track and manage a new issue.


    ### Flow Description

    1. Retrieves the action parameters including Title, Email, Urgency, and Details.

    2. Initializes the PagerDuty API client using the configured API token and service
    ID.

    3. Makes a POST request to the PagerDuty API (`/incidents`) to create a new incident.

    4. Returns the created incident details as a JSON result.


    ### Additional Notes

    The action requires the PagerDuty service ID to be configured in the integration
    settings.
  ai_short_description: >-
    Creates a new incident in PagerDuty using the provided details, title, email,
    and urgency parameters.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
