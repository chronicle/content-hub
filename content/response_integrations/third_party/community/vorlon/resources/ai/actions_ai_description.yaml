Update Alert:
  ai_description: >-
    ### General Description

    Updates an alert in the Vorlon platform based on a provided JSON payload. This
    action allows users to modify alert properties, such as its status, directly within
    the external system.


    ### Flow Description

    1. Retrieves the integration configuration and action parameters.

    2. Initializes the Vorlon API client with the provided credentials.

    3. Parses the `Alert Object` parameter, ensuring it is a valid JSON string.

    4. Sends a PUT request to the Vorlon API (`/rest/v1/alerts/update`) to update
    the specified alert.

    5. Returns the updated alert details as a JSON result to the SecOps platform.


