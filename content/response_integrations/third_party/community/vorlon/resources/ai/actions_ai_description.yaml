Get All Services:
  ai_description: >-
    ### General Description

    Retrieves a list of all detected and observed services from the Vorlon platform.
    This action provides visibility into the services monitored by Vorlon and returns
    the data in a structured JSON format.


    ### Flow Description

    1. Initializes the Vorlon API client using the provided integration credentials.

    2. Makes an HTTP GET request to the `/rest/v1/services` endpoint to fetch all
    available services.

    3. Parses the response and attaches the retrieved services as a JSON object to
    the action's results.

    4. Returns a success message upon completion or an error message if the request
    fails.


    ### Additional Notes

    This action does not require any specific input parameters and operates globally
    across the Vorlon environment. It does not interact with or modify any entities
    within the case.
