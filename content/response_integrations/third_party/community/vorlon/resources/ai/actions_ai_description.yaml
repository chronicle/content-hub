Get Alerts:
  ai_description: >-
    ### General Description

    Retrieves alerts from the Vorlon platform based on specified filtering criteria
    such as service IDs, alert IDs, time ranges, and status. The action returns the
    matching alerts as a JSON object for further use in the playbook.


    ### Flow Description

    1. Extracts filtering parameters including requesting service, responding service,
    alert IDs, time range, status, and limit.

    2. Initializes the Vorlon API client with the provided credentials.

    3. Makes a GET request to the Vorlon API (`/rest/v1/alerts`) to fetch alerts matching
    the provided criteria.

    4. Returns the retrieved alerts as a JSON result attached to the action execution.


    ### Additional Notes

    This action does not operate on Google SecOps entities. It is used to query the
    external Vorlon system for alert data.
  ai_short_description: >-
    Retrieves alerts from the Vorlon platform based on specified filtering criteria
    and returns them as a JSON result.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Vorlon API via a GET request. It does not mutate
      external data, update internal entities, create insights, modify alert data,
      or create case comments.
