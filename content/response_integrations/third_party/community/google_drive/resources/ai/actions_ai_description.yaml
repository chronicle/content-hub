Add Permission:
  ai_description: >-
    ### General Description

    Adds specific permissions (Owner, Reader, Writer) to a file stored in Google Drive
    for one or more users.


    ### Flow Description

    1. Extracts the file ID, role, target emails, and notification preference from
    the action parameters.

    2. Initializes the Google Drive API client using the provided credentials.

    3. Splits the provided email string into individual email addresses.

    4. Iterates through the emails and makes a POST request to the Google Drive API
    (`permissions().create`) to grant the specified role to each user for the given
    file.

    5. Returns a success message indicating the permissions were granted.


    ### Additional Notes

    The action can send an email notification to the users being granted access if
    the corresponding parameter is enabled.
  ai_short_description: >-
    Grants specific access permissions (such as Owner, Reader, or Writer) to a specified
    file in Google Drive for one or more user email addresses.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds user permissions (Owner, Reader, or Writer) to a specific file in Google
      Drive.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Google Drive API to create a new permission
      for a file, which mutates external data. It does not fetch contextual data,
      mutate internal SOAR data, update entities, create insights, or add case comments.
