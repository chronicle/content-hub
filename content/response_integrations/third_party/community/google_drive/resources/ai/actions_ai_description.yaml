Download File To Base64:
  ai_description: >-
    ### General Description

    Downloads a specific file from Google Drive and converts its content into a Base64
    encoded string. This action is useful for retrieving files stored in Google Drive
    for further processing or analysis within the SecOps platform.


    ### Flow Description

    1. Extracts the `File Id` parameter provided by the user.

    2. Initializes the Google Drive Manager using the integration's credentials.

    3. Makes an API call to Google Drive to retrieve the file's metadata (such as
    name, mimeType, and size) and its binary content.

    4. Converts the downloaded binary stream into a Base64 encoded string.

    5. Appends the file metadata and the Base64 string to the action's JSON result.


    ### Additional Notes

    The file ID can typically be found in the Google Drive file URL (e.g., `https://drive.google.com/drive/u/0/folders/{file-id}`).
