Delete File:
  ai_description: >-
    ### General Description

    Deletes a specific file stored in Google Drive using its unique File ID. This
    action permanently removes the file from the external system.


    ### Flow Description

    1. Extracts the `File Id` parameter provided by the user or playbook.

    2. Initializes the Google Drive API client using the integration credentials.

    3. Makes an HTTP DELETE request to the Google Drive API (`files().delete`) to
    permanently remove the specified file.

    4. Returns a success message indicating the file was deleted.


    ### Additional Notes

    The deletion is permanent and skips the Google Drive trash. Ensure the correct
    File ID is provided to avoid accidental data loss.
