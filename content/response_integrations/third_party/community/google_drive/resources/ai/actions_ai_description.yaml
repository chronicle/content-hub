Download File To Path:
  ai_description: >-
    ### General Description

    Downloads a specific file from Google Drive and saves it to a designated local
    folder path. This action is useful for retrieving documents, spreadsheets, or
    other files stored in Google Drive for local processing or analysis.


    ### Flow Description

    1. Extracts the `File Id` and target `Folder Path` from the action parameters.

    2. Initializes the Google Drive API client using the integration's service account
    credentials.

    3. Makes an API call (`GET https://www.googleapis.com/drive/v3/files/{fileId}`)
    to retrieve the file's metadata and determine its MIME type.

    4. Makes an API call to download the file's binary content. If the file is a Google
    Workspace document (e.g., Google Docs, Sheets, Slides), it exports the file to
    a corresponding Microsoft Office format.

    5. Writes the downloaded binary stream to the specified local folder path.

    6. Attaches the file details and the local saved path to the action's JSON result.


    ### Additional Notes

    Google Workspace documents (Docs, Presentations, Spreadsheets) are automatically
    exported and saved as `.docx`, `.pptx`, and `.xlsx` files respectively.
  ai_short_description: >-
    Downloads a specified file from Google Drive to a local folder path.
