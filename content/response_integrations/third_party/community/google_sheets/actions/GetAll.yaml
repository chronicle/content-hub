creator: alon
default_result_value: ''
description: Retrieves all records or raw row values from a worksheet.
dynamic_results_metadata:
-   result_example_path: resources/GetAll_JsonResult_example.json
    result_name: JsonResult
    show_result: true
integration_identifier: Google Sheets
name: Get All
parameters:
-   default_value: <Sheet-Id>
    description: 'The sheet id can be found in the sheet url.

        https://docs.google.com/spreadsheets/d/{YourSpreadSheetId}/edit#gid=0'
    is_mandatory: true
    name: Sheet Id
    type: string
-   default_value: <Sheet-Name>
    description: 'The worksheet name is the Sheet tab name. The default Sheet name
        is "Sheet1". Note: it is case sensitive. '
    is_mandatory: false
    name: Worksheet Name
    type: string
-   default_value: 'false'
    description: Return rows as lists of raw cell values instead of records keyed by
        the header row. Enable this for worksheets with blank or duplicate headers.
    is_mandatory: false
    name: Return Raw Values
    type: boolean
script_result_name: ScriptResult
