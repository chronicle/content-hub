Add or Update Rows:
  ai_description: >-
    ### General Description

    Adds or updates rows in a specified Google Sheet based on a given column name
    and JSON input. The action searches for a specific field value within a designated
    column; if a match is found, it updates the existing row, and if not, it appends
    a new row with the provided JSON values.


    ### Flow Description

    1. Authenticates with the Google Sheets API using the provided integration credentials.

    2. Opens the specified Google Sheet and worksheet via the Google Sheets API.

    3. Parses the input JSON parameter to extract the rows to be added or updated.

    4. Iterates through each row in the JSON, searching for the specified field value
    in the target column.

    5. If the value is found, updates the corresponding row in the sheet via a Google
    Sheets API update request.

    6. If the value is not found, appends a new row to the sheet via a Google Sheets
    API append request.

    7. Returns the total number of rows updated or added and attaches the results
    as JSON to the action.


    ### Additional Notes

    The JSON input must be formatted as a list of dictionaries, where each dictionary
    represents a row. Each value used for searching must be unique to ensure the correct
    row is updated.
  ai_short_description: >-
    Adds or updates rows in a Google Sheet by searching for a specific field value
    in a designated column and either updating the existing row or appending a new
    one.
