    parameters.

    2. Authenticates with the Google Sheets API using the provided service account
    credentials.

    3. Makes an API call to create a new Google Sheet with the specified name.

    4. If email addresses are provided, makes additional API calls to share the newly
    created sheet with those users, granting them 'writer' permissions.

    5. Returns the ID of the newly created sheet to the SOAR platform.


    ### Additional Notes

