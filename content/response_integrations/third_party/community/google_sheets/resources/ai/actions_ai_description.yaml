Add  Permission:
  ai_description: >-
    ### General Description

    Adds permissions to a specified Google Sheet for one or more users. This action
    allows an analyst to programmatically grant 'Owner', 'Writer', or 'Reader' access
    to a spreadsheet by providing the target email addresses.


    ### Flow Description

    1. Extracts the target Google Sheet ID, the desired role, and the list of email
    addresses from the action parameters.

    2. Authenticates with the Google Sheets API using the integration's service account
    credentials.

    3. Makes an API call to insert the specified permissions (`perm_type="user"`)
    for the provided email addresses on the target spreadsheet.

    4. Returns a success message if the permissions are successfully granted, or an
    error message if the API request fails.


    ### Additional Notes

    Multiple email addresses can be provided in the 'Emails' parameter by separating
    them with a semicolon (`;`).
  ai_short_description: >-
    Adds user permissions (Owner, Writer, or Reader) to a specified Google Sheet for
    one or more email addresses.
