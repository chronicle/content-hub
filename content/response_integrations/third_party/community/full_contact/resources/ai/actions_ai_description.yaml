Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches User entities with person and company data extracted from the Full Contact
    product. This action retrieves contextual metadata such as company name, industry,
    location, and person details (e.g., title, LinkedIn profile) to provide deeper
    insights into the user identities involved in an alert.


    ### Flow Description

    1. Iterates through the target entities and filters for User entities.

    2. Extracts the email address and domain from the User entity's identifier.

    3. Makes a POST request to the Full Contact API (`/v3/company.enrich`) to retrieve
    company details based on the extracted domain.

    4. Makes a POST request to the Full Contact API (`/v3/person.enrich`) to retrieve
    person details based on the email address.

    5. Updates the entity's additional properties with the retrieved enrichment data.

    6. Updates the entities within Google SecOps and attaches the enrichment data
    as a JSON result.


    ### Additional Notes

    The action expects User entities to be formatted as valid email addresses to successfully
    extract the domain and email for enrichment.
  ai_short_description: >-
    Enriches User entities with person and company data using the Full Contact API.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes POST requests to the Full Contact API to fetch enrichment data
      for domains and persons. It does not mutate external data (the POST requests
      are for querying the API). It updates the internal entities with the fetched
      data by calling `siemplify.update_entities`. It does not create insights, modify
      alert data, or create case comments.
