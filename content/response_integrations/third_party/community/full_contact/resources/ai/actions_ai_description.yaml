Ping:
  ai_description: >-
    ### General Description

    Tests connectivity with the Full Contact product to ensure the integration is
    configured correctly.


    ### Flow Description

    1. Retrieves the API key from the integration configuration.

    2. Makes a POST request to the Full Contact API (`https://api.fullcontact.com/v3/company.enrich`)
    using a hardcoded domain (`google.com`).

    3. Evaluates the API response to verify authentication, raising an exception if
    a 401 Unauthorized status is returned.

    4. Outputs a success message if the connection is validated.


    ### Additional Notes

    This action does not require any parameters and does not process any entities.
    It is intended solely for testing the integration's connection to the Full Contact
    service.
  ai_short_description: >-
    Tests connectivity with the Full Contact product by making a test API call to
