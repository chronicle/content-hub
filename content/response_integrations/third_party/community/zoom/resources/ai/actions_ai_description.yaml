Create User:
  ai_description: >-
    ### General Description

    Creates a new user account in Zoom.


    ### Flow Description

    1. Extracts the action parameters: First Name, Last Name, Email, and User Type.

    2. Checks if a user with the provided email already exists in Zoom via a GET request
    to the Zoom API.

    3. If the user does not exist, makes a POST request to the Zoom API to create
    the new user with the specified details.

    4. Returns the created user details as a JSON result and completes the action.


    ### Additional Notes

    The user license type can be 'Basic', 'Licensed', or 'On-prem'. If the user already
    exists, the action will fail.
