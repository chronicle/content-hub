Delete User:
  ai_description: >-
    ### General Description

    Deletes a user permanently from Zoom and optionally transfers their associated
    data (meetings, recordings, and webinars) to another specified user.


    ### Flow Description

    1. Extracts the target user's email and transfer preferences from the action parameters.

    2. Checks if the user has any recordings, webinars, or meetings to transfer by
    making GET requests to the Zoom API (if the respective transfer options are enabled).

    3. Initiates a DELETE request to the Zoom API to permanently delete the user and
    transfer their data to the specified transfer email.

    4. Returns a JSON result indicating whether the deletion was successful.


    ### Additional Notes

    If transfer options are enabled but the user has no corresponding data, the transfer
    for that specific data type is automatically skipped.
