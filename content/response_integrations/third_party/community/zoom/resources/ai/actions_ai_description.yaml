    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the additional properties of User entities with data retrieved from
      Zoom.
    reasoning: >-
      The action fetches data from the Zoom API using a GET request to retrieve user
      details. It does not mutate any external data. It mutates internal data by updating
      the 'additional_properties' of the entities and calling 'siemplify.update_entities()'.
