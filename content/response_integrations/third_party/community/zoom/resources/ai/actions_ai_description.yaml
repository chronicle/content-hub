Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches User entities with Zoom properties. This action retrieves user details
    from Zoom and appends the information to the entity's additional properties within
    the Google SecOps platform.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only those of type `USER`.

    3. For each valid user entity, makes an API call to Zoom (`GET /users/{user_email}`)
    to fetch the user's details.

    4. Flattens the retrieved JSON data and prefixes the keys with "Zoom".

    5. Updates the entity's `additional_properties` with the flattened data and marks
    the entity as enriched.

    6. Saves the updated entities back to the platform using `siemplify.update_entities`
    and adds the raw user information to the action's JSON result.


    ### Additional Notes

    - The action requires valid Zoom API credentials configured at the integration
    level.
  ai_short_description: >-
    Enriches User entities by retrieving user details from Zoom and appending the
    data to the entity's additional properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
