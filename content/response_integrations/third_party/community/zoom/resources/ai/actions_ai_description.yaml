Create Meeting:
  ai_description: >-
    ### General Description

    Creates a scheduled or instant meeting in Zoom. This action interacts with the
    Zoom API to schedule a new meeting based on the provided topic, start time, duration,
    and host email address.


    ### Flow Description

    1. Extracts the meeting configuration parameters, including topic, type, start
    time, duration, time zone, recording type, and host email address.

    2. Initializes the Zoom API client with the integration credentials.

    3. Makes a POST request to the Zoom API (`/users/{host_email}/meetings`) to create
    the meeting.

    4. If successful, attaches the meeting join URL as a link to the action results
    and adds the meeting details as a JSON result.


    ### Additional Notes

    - The meeting start time should only be used for scheduled meetings and must be
    in the format `YYYY-MM-DD HH:mm:ss`.

    - The time zone must be provided in the `Continent/Country` format.
  ai_short_description: >-
    Creates a scheduled or instant meeting in Zoom for a specified host email address,
    returning the meeting details and join URL.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new scheduled or instant meeting in Zoom.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Zoom API to create a new meeting, which
      mutates external data. It does not fetch contextual data for enrichment, nor
      does it mutate internal data, update entities, create insights, modify alert
      data, or create case comments.
