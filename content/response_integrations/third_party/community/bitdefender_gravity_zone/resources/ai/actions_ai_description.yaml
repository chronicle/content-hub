Blocklist - Add Hashes:
  ai_description: >-
    ### General Description

    Adds one or more file hashes (SHA256 or MD5) to the blocklist in Bitdefender GravityZone.
    This action initiates a state change on the external platform to prevent execution
    or access to the specified malicious files.


    ### Flow Description

    1. Extracts the provided hash list and source information from the action parameters.

    2. Connects to the Bitdefender GravityZone Control Center API.

    3. Separates the provided hashes into SHA256 and MD5 categories.

    4. Makes an API call to add the categorized hashes to the blocklist.

    5. Returns the results of the operation, including successful and failed hashes.


    ### Additional Notes

    Unsupported hashes will not be submitted. At this time, Bitdefender only accepts
    SHA256 or MD5 hashes.
  ai_short_description: >-
    Adds one or more file hashes (SHA256 or MD5) to the blocklist in Bitdefender GravityZone.
