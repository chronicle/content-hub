    external_data_mutation_explanation: >-
      Adds the specified file hashes to the blocklist in Bitdefender GravityZone.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PUT request to the Bitdefender GravityZone API to add hashes
      to the blocklist, mutating external data. It does not fetch data, update internal
      entities, or create insights.
