    the action parameters.

    2. Connects to the Bitdefender GravityZone Control Center API.

    3. Sends a POST request to the `/v1.0/jsonrpc/network` endpoint to create a scan
    task with the specified configuration on the target endpoints.

    4. Returns a success or failure message based on the API response.


