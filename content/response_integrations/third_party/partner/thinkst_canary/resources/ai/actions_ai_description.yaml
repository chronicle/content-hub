Ping:
  ai_description: >-
    ### General Description

    Verifies the connection to the Thinkst Canary Console by pinging the API endpoint.
    This action ensures that the provided API key and console hash are correct and
    that the integration can successfully communicate with the Thinkst Canary service.


    ### Flow Description

    1. Extracts the API Key, Console Hash, and Verify SSL settings from the integration
    configuration.

    2. Initializes the ThinkstActionManager with the provided credentials.

    3. Makes a GET request to the `/ping` endpoint of the Canary Console API.

    4. Evaluates the response and returns a success message if the connection is established,
    or a failure message otherwise.


    ### Additional Notes

    This action is primarily used for testing and validating the integration configuration.
  ai_short_description: >-
    Verifies the connection to the Thinkst Canary Console by pinging the API endpoint
    to ensure credentials are correct.
