Acknowledge Console Alert:
  ai_description: >-
    ### General Description

    This action acknowledges an alert on the Thinkst Canary console. It retrieves
    the external incident ID associated with the current alert and updates its status
    to acknowledged on the Canary platform.


    ### Flow Description

    1. Retrieves the `AlertId` from the additional properties of the first security
    event within the current SecOps alert.

    2. Initiates a POST request to the Thinkst Canary API (`/incident/acknowledge`)
    using the retrieved incident ID.

    3. Evaluates the API response and completes the action if the incident is successfully
    acknowledged.


    ### Additional Notes

    This action requires the alert to have been ingested by the Thinkst Canary connector,
    as it relies on the `AlertId` being present in the security event's additional
    properties.
  ai_short_description: >-
    Acknowledges an alert on the Thinkst Canary console by extracting the incident
    ID from the current alert's security events and sending a POST request to the
    Canary API.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Acknowledges an incident on the external Thinkst Canary console.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Thinkst Canary API to acknowledge an
      incident, which mutates external data. It does not fetch data, mutate internal
      SecOps data, update entities, create insights, modify alert data, or create
      case comments.
