name: Sync Alerts
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: The SecOps environment whose Vega cases this job maintains.
    is_mandatory: true
-   name: API Root
    default_value: https://api.vega.io
    type: string
    description: The Base URL of the Vega API, for example https://api.vega.io.
    is_mandatory: true
-   name: Access Key
    default_value: ''
    type: password
    description: Vega Access Key used with login_machine.
    is_mandatory: true
-   name: Access Key ID
    default_value: ''
    type: password
    description: Vega Access Key ID (X-Vega-Key-Id header).
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate of the Vega API server.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: Hours of case activity to consider on the first run. Default is 24.
    is_mandatory: true
-   name: Sync Direction
    default_value: "{\n  \"Status\": \"Bidirectional\",\n  \"Comments\": \"Bidirectional\"\
        \n}"
    type: string
    description: 'JSON mapping to control sync direction per feature. Options: Bidirectional,
        toVega, toSecOps, None. Supported keys: Status, Comments.'
    is_mandatory: false
description: 'Maintains SecOps cases tagged Vega from the Alerts and Incidents Connector.
    Writes case title, description (incidentSummary), priority, insight (other incident
    fields as JSON key/value plus signals overflow summary), tags, comments, close,
    and reopen. The connector only creates signal alerts; this job keeps the case in
    sync with Vega. Schedule every minute by default. Existing cases need the Vega
    tag once (or re-ingest) before this job will pick them up.'
documentation_link: https://vega.io/
integration: Vega
creator: admin
