name: Sync Alerts
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: The SecOps environment whose Vega cases this job maintains.
    is_mandatory: true
-   name: API Root
    default_value: https://api.vega.io
    type: string
    description: The Base URL of the Vega API, for example https://api.vega.io.
    is_mandatory: true
-   name: Access Key
    default_value: ''
    type: password
    description: Vega Access Key used with login_machine.
    is_mandatory: true
-   name: Access Key ID
    default_value: ''
    type: password
    description: Vega Access Key ID (X-Vega-Key-Id header).
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate of the Vega API server.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: Hours of case activity to consider on the first run. Default is 24.
    is_mandatory: true
-   name: Max Alerts in Case
    default_value: '30'
    type: integer
    description: 'Must match the connector Max Alerts in Case. Duplicate Vega-tagged
        cases for the same incident are merged only when the combined alert count
        stays at or under this limit. No comment or tag is written on merge.'
    is_mandatory: true
description: 'First merges open Vega-tagged cases in the job time range that share
    the same incident id (when under Max Alerts in Case, no merge comment/tag). Then
    sets case description, writes the Vega incident insight, and applies Vega incident
    plus alert label names as SecOps case tags. The case must have the "Vega" tag.
    Prefer a Vega-dedicated Environment Name so non-Vega cases do not consume the
    sync limit.'
documentation_link: https://vega.io/
integration: Vega
creator: admin
