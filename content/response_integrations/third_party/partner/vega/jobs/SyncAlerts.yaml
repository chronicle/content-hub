name: Sync Alerts
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: The SecOps environment whose Vega cases this job maintains.
    is_mandatory: true
-   name: API Root
    default_value: https://api.vega.io
    type: string
    description: The Base URL of the Vega API, for example https://api.vega.io.
    is_mandatory: true
-   name: Access Key
    default_value: ''
    type: password
    description: Vega Access Key used with login_machine.
    is_mandatory: true
-   name: Access Key ID
    default_value: ''
    type: password
    description: Vega Access Key ID (X-Vega-Key-Id header).
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate of the Vega API server.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: Hours of case activity to consider on the first run. Default is 24.
    is_mandatory: true
description: 'Sets the SecOps case description from incidentSummary and writes Vega
    incident fields as a JSON case insight. The case must have the "Vega" tag. Resolves
    the incident UUID from alert source grouping (Vega:incident:<uuid>). Prefer a
    Vega-dedicated Environment Name so non-Vega cases do not consume the sync limit.'
documentation_link: https://vega.io/
integration: Vega
creator: admin
