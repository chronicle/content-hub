[project]
name = "Vega"
version = "1.0"
description = "Connect Vega alerts and incidents to Google SecOps. This integration is owned by the \"Vega\". Support Contact: support@vega.io."
requires-python = ">=3.11,<3.12"
dependencies = [ "requests>=2.32.4",]

[dependency-groups]
dev = [ "environmentcommon", "integration-testing", "pytest>=8.3.5", "pytest-json-report>=1.5.0", "soar-sdk", "tipcommon",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.environmentcommon]
path = "../../../../../packages/envcommon/whls/EnvironmentCommon-1.0.3-py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../../packages/tipcommon/whls/TIPCommon-2.4.1-py3-none-any.whl"

[tool.uv.sources.integration-testing]
path = "../../../../../packages/integration_testing_whls/integration_testing-2.4.1-py3-none-any.whl"
