name: Vega Alerts and Incidents Connector
parameters:
-   name: API Root
    default_value: https://api.vega.io
    type: url
    description: The Base URL of the Vega API, for example https://api.vega.io. Invalid
        values cause a configuration error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Access Key
    default_value: ''
    type: password
    description: Vega Access Key used with login_machine. Invalid values cause a configuration
        error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Access Key ID
    default_value: ''
    type: password
    description: Vega Access Key ID (X-Vega-Key-Id header). Invalid values cause a
        configuration error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate of the Vega API server.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Fetch Lookback Minutes
    default_value: '5'
    type: string
    description: Minutes to shift the query window backwards to catch late-indexed
        records. Enter an integer from 1 to 60. Invalid values cause a configuration
        error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Backfill Days
    default_value: '30'
    type: string
    description: Days to backfill on the first run only. Enter an integer from 0 to
        365 (0 starts from today). Invalid values cause a configuration error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Alerts in Case
    default_value: '30'
    type: string
    description: 'Maximum number of Vega signals (alerts) packaged into one SecOps
        case per incident. Enter an integer from 1 to 90. Default is 30. Ranking:
        ESCALATED first, then severity (CRITICAL to LOW), then oldest createdAt.
        Signals past this cap are not sent as alerts; the Sync Alerts job records
        the overflow in case insight (for example "312 signals, 30 in case") and
        links to Vega. Please keep this value the same as the value in the Alerts
        Grouping setting (max alerts grouped into a case) so SecOps does not open
        multiple cases for the same Vega incident. Invalid values cause a configuration
        error.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Events in Alert
    default_value: '50'
    type: string
    description: Maximum number of Vega alert-events attached as SecOps events on
        each signal alert. The Vega alert itself is not written as a SecOps event.
        Enter an integer from 0 to 200. Default is 50. 0 attaches no events. Invalid
        values cause a configuration error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Alert Severities to Fetch
    default_value: LOW,MEDIUM,HIGH,CRITICAL
    type: string
    description: 'Possible Values: LOW, MEDIUM, HIGH, CRITICAL. Empty = all. Unsupported
        values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Statuses to Fetch
    default_value: OPEN, IN PROGRESS, PEER REVIEW, RESOLVED
    type: string
    description: 'Possible Values: OPEN, IN PROGRESS, PEER REVIEW, RESOLVED. Empty
        = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Verdicts to Fetch
    default_value: MALICIOUS,SUSPICIOUS,BENIGN,INCONCLUSIVE,NA
    type: string
    description: 'Possible Values: MALICIOUS, SUSPICIOUS, BENIGN, INCONCLUSIVE, NA.
        Empty = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident Severities to Fetch
    default_value: LOW,MEDIUM,HIGH,CRITICAL
    type: string
    description: 'Possible Values: LOW, MEDIUM, HIGH, CRITICAL. Empty = all. Unsupported
        values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident User Statuses to Fetch
    default_value: OPEN,IN REVIEW,ON HOLD,RESOLVED
    type: string
    description: 'Possible Values: OPEN, IN REVIEW, ON HOLD, RESOLVED. Empty
        = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident Investigation Statuses to Fetch
    default_value: NEW,INVESTIGATING,COMPLETED,FAILED
    type: string
    description: 'Possible Values: NEW, INVESTIGATING, COMPLETED, FAILED. Empty
        = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident Verdicts to Fetch
    default_value: MALICIOUS, SUSPICIOUS, BENIGN, INCONCLUSIVE, NA
    type: string
    description: 'Possible Values: MALICIOUS, SUSPICIOUS, BENIGN, INCONCLUSIVE, NA.
        Empty = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: DeviceProductField
    default_value: product
    type: string
    description: Platform Product Field Name (required by SecOps).
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: event_type
    type: string
    description: Platform Event Field Name (required by SecOps). Use event_type
        so the Events TYPE column shows Alert / Incident / Alert Event instead of
        the Vega id UUID from event_class_id.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '930'
    type: string
    description: Max seconds for one connector run before SecOps kills the Python
        process. This is not the schedule. Use Run Every to control how often a run
        starts. The connector stops before this limit, packages what it fetched,
        and saves the last packaged record timestamp as the watermark. The next
        run continues from that watermark so remaining incidents and signals are
        not skipped.
    is_mandatory: true
    is_advanced: false
    mode: regular
description: 'Ingests Vega incidents as one SecOps case each. Creates signal alerts
    only (no incident alert). All signals share source grouping identifier
    Vega:incident:<incident id>. Add an Alerts Grouping rule for Product Vega,
    Group By Source Grouping Identifier, above All alerts, and set Case Name to
    Rule Generator. Keep Max Alerts in Case equal to the grouping max so the case
    never splits. Use the Sync Alerts job for case description (incidentSummary)
    and JSON case insight (incident fields + signals overflow).'
integration: Vega
documentation_link: https://vega.io/
rules: []
is_connector_rules_supported: false
creator: admin
