name: Add Case Comment
description: Add a comment on the current Google SecOps case. Use this instead of
    Siemplify Case Comment so the step can run on the Vega instance automatically.
integration_identifier: Vega
parameters:
-   name: Comment
    default_value: ''
    type: playbook_name
    description: Comment text to add on the case.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_case_comment_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
