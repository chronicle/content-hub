name: Generate Random Password
description: Generate a random temporary password that meets typical Okta complexity
    rules (uppercase, lowercase, digit, and symbol). Use the result as Okta Set
    Password New Password and in the notification email.
integration_identifier: Vega
parameters:
-   name: Length
    default_value: '16'
    type: playbook_name
    description: Password length. Must be at least 12 characters.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/Generate Random Password_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
