name: Update Alert
description: Update Vega alert status, severity, verdict, verdict reasoning, assignees,
    and/or comment.
integration_identifier: Vega
parameters:
-   name: Alert IDs
    default_value: ''
    type: playbook_name
    description: Comma-separated Vega alert IDs. Optional when running on a Vega alert.
    is_mandatory: false
-   name: Status
    default_value: ''
    type: playbook_name
    description: 'Possible Values: OPEN, IN PROGRESS, PEER REVIEW, RESOLVED.'
    is_mandatory: false
-   name: Verdict
    default_value: ''
    type: playbook_name
    description: 'Possible Values: MALICIOUS, SUSPICIOUS, BENIGN, INCONCLUSIVE, NA.'
    is_mandatory: false
-   name: Severity
    default_value: ''
    type: playbook_name
    description: 'Possible Values: LOW, MEDIUM, HIGH, CRITICAL.'
    is_mandatory: false
-   name: Verdict Reasoning
    default_value: ''
    type: playbook_name
    description: Verdict reasoning text.
    is_mandatory: false
-   name: Comment
    default_value: ''
    type: playbook_name
    description: Comment to add on the Vega alert.
    is_mandatory: false
-   name: Assignees
    default_value: ''
    type: playbook_name
    description: Comma-separated Vega user IDs.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
