name: Get Incident Timeline
description: Fetch the Vega incident timeline for an incident ID, paging until all
    events are returned. When Incident ID is omitted, uses vega_id from the current
    alert.
integration_identifier: Vega
parameters:
-   name: Incident ID
    default_value: ''
    type: playbook_name
    description: Vega incident UUID. Optional when running on a Vega incident.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_incident_timeline_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
