name: Update Incident
description: Update Vega incident user status, severity, verdict, assignee emails,
    and/or comment.
integration_identifier: Vega
parameters:
-   name: Incident IDs
    default_value: ''
    type: playbook_name
    description: Comma-separated Vega incident IDs. Optional when running on a Vega
        incident.
    is_mandatory: false
-   name: User Status
    default_value: ''
    type: playbook_name
    description: 'Possible Values: OPEN, IN REVIEW, ON HOLD, RESOLVED.'
    is_mandatory: false
-   name: Severity
    default_value: ''
    type: playbook_name
    description: 'Possible Values: LOW, MEDIUM, HIGH, CRITICAL.'
    is_mandatory: false
-   name: Verdict
    default_value: ''
    type: playbook_name
    description: 'Possible Values: MALICIOUS, SUSPICIOUS, BENIGN, INCONCLUSIVE, NA.'
    is_mandatory: false
-   name: Verdict Reasoning
    default_value: ''
    type: playbook_name
    description: Verdict reasoning text.
    is_mandatory: false
-   name: Comment
    default_value: ''
    type: playbook_name
    description: Comment to add on the Vega incident.
    is_mandatory: false
-   name: Assignee Emails
    default_value: ''
    type: playbook_name
    description: Comma-separated assignee email addresses.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
