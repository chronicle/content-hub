name: Get Alert Events
description: Fetch aggregated alert events for a Vega alert, paging until all
    events are returned when Vega reports additional rows. When Alert ID is omitted,
    uses vega_id from the current alert.
integration_identifier: Vega
parameters:
-   name: Alert ID
    default_value: ''
    type: playbook_name
    description: Vega alert UUID (preferred) or vegaAlertId. Optional when running
        on a Vega alert case.
    is_mandatory: false
-   name: Limit
    default_value: '100'
    type: playbook_name
    description: API page size used while fetching every alert event.
    is_mandatory: false
-   name: Offset
    default_value: '0'
    type: playbook_name
    description: Unused for fetch; all pages are returned in JsonResult.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_alert_events_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
