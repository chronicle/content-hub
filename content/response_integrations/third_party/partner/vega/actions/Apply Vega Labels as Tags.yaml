name: Apply Vega Labels as Tags
description: Create Google SecOps case tags from Vega incident and alert label names
    on the current case, and assign them to the case. Connectors cannot create tags;
    this action uses add_tag, which does. Attach it to a playbook that runs on Vega
    cases.
integration_identifier: Vega
parameters: []
dynamic_results_metadata:
-   result_example_path: resources/Apply Vega Labels as Tags_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
