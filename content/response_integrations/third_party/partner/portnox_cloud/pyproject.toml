[project]
name = "PortnoxCloud"
version = "1.0"
description = "Portnox Cloud is a cloud-native Zero Trust Network Access Control (NAC) platform. This integration lets playbooks enrich MAC address, hostname and IP entities with Portnox Cloud device context, block devices and accounts, and move accounts between groups.\n\nIn case of any queries, please reach out to support@portnox.com."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.32.4",
    "tipcommon",
]

[dependency-groups]
dev = [
    "integration-testing",
    "pytest>=8.3.5",
    "pytest-json-report>=1.5.0",
    "soar-sdk",
]

[tool.uv.sources]
soar-sdk = { git = "https://github.com/chronicle/soar-sdk.git" }
integration-testing = { path = "../../../../../packages/integration_testing_whls/integration_testing-2.4.8-py3-none-any.whl" }
tipcommon = { path = "../../../../../packages/tipcommon/whls/TIPCommon-2.4.8-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
