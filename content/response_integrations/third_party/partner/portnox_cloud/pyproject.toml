[project]
name = "PortnoxCloud"
version = "1.0"
description = "Portnox Cloud NAC integration for Google SecOps.\n\nIn case of any queries, please reach out to support@portnox.com."
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = [ "uv_build>=0.13.9,<0.14.0",]
build-backend = "uv_build"

[project.scripts]
portnox-cloud = "portnox_cloud:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "soar-sdk",
    "pytest-json-report>=1.5.0",
]

[tool.uv.sources]
soar-sdk = { git = "https://github.com/chronicle/soar-sdk" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true