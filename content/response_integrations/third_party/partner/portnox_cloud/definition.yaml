documentation_link: https://docs.portnox.com/topics/integrate_gso_soar.html
identifier: PortnoxCloud
name: Portnox Cloud
parameters:
-   name: API Root
    default_value: https://clear.portnox.com:8081/CloudPortalBackEnd/
    type: string
    description: The Portnox Cloud API root URL.
    is_mandatory: true
    integration_identifier: PortnoxCloud
-   name: API Token
    default_value: null
    type: password
    description: A Portnox Cloud API token. Required unless Username and Password are provided.
    is_mandatory: false
    integration_identifier: PortnoxCloud
-   name: Username
    default_value: null
    type: string
    description: A local Portnox Cloud admin username, used when no API Token is provided. Admin accounts federated
        through Entra ID or Google Workspace cannot use the API.
    is_mandatory: false
    integration_identifier: PortnoxCloud
-   name: Password
    default_value: null
    type: password
    description: The password of the local Portnox Cloud admin account.
    is_mandatory: false
    integration_identifier: PortnoxCloud
-   name: Verify SSL
    default_value: 'true'
    type: boolean
    description: If enabled, the integration verifies the SSL certificate of the Portnox Cloud server.
    is_mandatory: false
    integration_identifier: PortnoxCloud
categories: []
is_available_for_community: false
