name: Move Account To Group
description: Move one or more accounts to another Portnox Cloud group, for example a quarantine group with a
    restrictive policy. The accounts are taken from the Account ID parameter or, when it is empty, from User
    entities. Accounts synchronized from LDAP cannot be moved. Supported entities - User.
integration_identifier: PortnoxCloud
parameters:
-   name: Group Name
    default_value: Default
    type: string
    description: The name of the Portnox Cloud group to move the accounts to.
    is_mandatory: true
-   name: Account ID
    default_value: ''
    type: string
    description: The Portnox Cloud account to move, usually the user's e-mail address. Accepts a comma-separated list.
        When empty, the action moves the User entities in the alert.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: false
default_result_value: ''
creator: Portnox
script_result_name: is_success
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
