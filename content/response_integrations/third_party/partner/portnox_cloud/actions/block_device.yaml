name: Block Device
description: Block devices in Portnox Cloud so that they lose network access. The device is taken from the Device ID
    parameter or, when it is empty, resolved from MAC address, IP address and hostname entities. An IP address or
    hostname that matches more than one device is skipped. Supported entities - MAC Address, IP Address, Hostname.
integration_identifier: PortnoxCloud
parameters:
-   name: Reason
    default_value: Blocked by Google SecOps SOAR
    type: string
    description: The reason for the block, shown in Portnox Cloud.
    is_mandatory: false
-   name: Device ID
    default_value: ''
    type: string
    description: The unique identifier (GUID) of the Portnox Cloud device to block. When empty, the action resolves
        devices from the entities in the alert.
    is_mandatory: false
-   name: Max Pages To Scan
    default_value: '10'
    type: string
    description: The maximum number of device list pages (30 devices each) to search per entity. Higher values find
        devices in large tenants but make the action slower.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: false
default_result_value: ''
creator: Portnox
script_result_name: is_success
simulation_data_json: '{"Entities": ["MacAddress", "ADDRESS", "HOSTNAME"]}'
