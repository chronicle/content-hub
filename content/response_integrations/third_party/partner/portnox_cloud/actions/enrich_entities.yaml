name: Enrich Entities
description: Enrich MAC address, IP address and hostname entities with device information from Portnox Cloud,
    including the owning account, group, IP and MAC addresses, operating system, last authentication result and
    risk score. Entities whose account is blocked are marked as suspicious. Supported entities - MAC Address,
    IP Address, Hostname.
integration_identifier: PortnoxCloud
parameters:
-   name: Max Pages To Scan
    default_value: '10'
    type: string
    description: The maximum number of device list pages (30 devices each) to search per entity. Higher values find
        devices in large tenants but make the action slower.
    is_mandatory: false
-   name: Create Insight
    default_value: 'true'
    type: boolean
    description: If enabled, the action adds an insight with the device summary to each enriched entity.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Portnox
script_result_name: is_success
simulation_data_json: '{"Entities": ["MacAddress", "ADDRESS", "HOSTNAME"]}'
