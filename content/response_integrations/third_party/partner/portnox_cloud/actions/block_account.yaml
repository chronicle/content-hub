name: Block Account
description: Block one or more accounts in Portnox Cloud so that their devices lose network access. The accounts
    are taken from the Account ID parameter or, when it is empty, from User entities. Supported entities - User.
integration_identifier: PortnoxCloud
parameters:
-   name: Account ID
    default_value: ''
    type: string
    description: 'The Portnox Cloud account to block, usually the user''s e-mail address. Accepts a comma-separated
        list or a bracketed list from a playbook placeholder, for example ["user@example.com"]. When empty, the action
        blocks the User entities in the alert.'
    is_mandatory: false
-   name: Reason
    default_value: Blocked by Google SecOps SOAR
    type: string
    description: The reason for the block, shown in Portnox Cloud.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/block_account_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Portnox
script_result_name: is_success
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
