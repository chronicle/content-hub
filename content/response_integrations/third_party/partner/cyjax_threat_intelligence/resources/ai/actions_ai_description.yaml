Domain monitor:
  ai_description: >-
    ### General Description

    Retrieves information for the Domain Monitor feature from Cyjax. This feature
    tracks brands against newly registered global domains and certificate transparency
    logs (CTL).


    ### Flow Description

    1. Extracts the `Query`, `Since`, and `Until` parameters.

    2. Validates the date formats and ensures `Since` is not greater than `Until`.

    3. Makes a GET request to the Cyjax API (`/domain-monitor/potential-malicious-domain`)
    to fetch domain monitor results, handling pagination automatically up to 1000
    records.

    4. Formats the retrieved data into a CSV table and JSON results.

    5. Returns the results to the Siemplify platform.


    ### Additional Notes

    The action automatically paginates results up to a maximum of 1000 records.
  ai_short_description: >-
    Retrieves information for the Domain Monitor feature from Cyjax, tracking brands
    against newly registered global domains and certificate transparency logs based
    on a query and time range.
