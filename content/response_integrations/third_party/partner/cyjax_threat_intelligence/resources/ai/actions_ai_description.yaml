Enrich IOCs:
  ai_description: >-
    ### General Description

    This action enriches Indicators of Compromise (IOCs) using Cyjax threat intelligence.
    It retrieves threat intelligence data including GeoIP, ASN, and sightings information
    for the target entities attached to the case.


    ### Flow Description

    1. Retrieves all target entities from the case.

    2. Initializes the Cyjax API client using integration configuration parameters.

    3. Iterates through the entities and makes a GET request to the Cyjax API (`/indicator-of-compromise/enrichment`)
    for each entity identifier.

    4. Parses the response to extract GeoIP, ASN, and sightings data.

    5. Clears any previous Cyjax enrichment data from the entity's additional properties.

    6. Updates the entity's additional properties with the new enrichment data and
    marks the entity as enriched.

    7. Returns the results as JSON and a CSV data table.


    ### Additional Notes

    The action processes all target entities without specific type filtering in the
    code, though it is designed for standard IOC types like domains, emails, IPs,
    and hashes.
  ai_short_description: >-
    Enriches Indicators of Compromise (IOCs) with threat intelligence data such as
    GeoIP, ASN, and sightings using the Cyjax API.
