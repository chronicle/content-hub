List Data Breaches:
  ai_description: >-
    ### General Description

    Lists all data breaches from Cyjax based on search queries. It retrieves breach
    information including ID, name, data classes, and discovery date.


    ### Flow Description

    1. Extracts the action parameters: Query, Since, and Until.

    2. Validates the date formats and ensures the 'Since' date is not greater than
    the 'Until' date.

    3. Initializes the Cyjax API client.

    4. Calls the Cyjax API to fetch data breaches matching the search criteria, utilizing
    automatic pagination to retrieve up to 1000 records.

    5. Formats the retrieved data into a CSV table and JSON output.

    6. Returns the results to the Google SecOps platform.


    ### Additional Notes

    Pagination automatically stops at 1000 records or if an error occurs during the
    pagination process. If an error occurs during pagination, a partial result may
    be returned.
