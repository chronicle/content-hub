Ping:
  ai_description: >-
    ### General Description

    This action tests the connectivity between Google SecOps SOAR and the Cyjax instance
    by making an authenticated API call. It validates the provided asset configuration
    parameters and verifies that the credentials have the necessary permissions to
    interact with the Cyjax API.


    ### Flow Description

    1. Retrieves the API token and SSL verification settings from the integration
    configuration.

    2. Makes an authenticated HTTP GET request to the Cyjax `/indicator-of-compromise`
    endpoint.

    3. Evaluates the HTTP response to confirm successful authentication and connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action does not require any action-specific parameters and does not interact
    with case entities. It is primarily used for diagnostic purposes to ensure the
    integration is configured correctly.
