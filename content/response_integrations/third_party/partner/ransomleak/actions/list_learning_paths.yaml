name: List Learning Paths
description: List the published RansomLeak learning paths that users can be enrolled in, with their IDs, names and descriptions. Use it to find the Learning Path value for the Assign Training action.
integration_identifier: RansomLeak
parameters:
-   name: Filter Value
    default_value: ''
    type: string
    description: Optional text to filter learning paths by name (case-insensitive substring match).
    is_mandatory: false
-   name: Max Results To Return
    default_value: '50'
    type: string
    description: Maximum number of learning paths to return. Default is 50.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_learning_paths_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: RansomLeak
simulation_data_json: '{"Entities": []}'
script_result_name: is_success
default_result_value: 'false'
