name: Get Training Status
description: 'Get RansomLeak training progress for users and remediation assignments. For each user (User entities with email identifiers and the Email Addresses parameter) the action returns exercises completed, campaign completion, in-progress and overdue counts, average quiz score, recent completions and the Human Risk Score (score, level, confidence, sub-scores) when available. For each assignment ID returned by Assign Training it returns the assignment status (pending, in_progress, completed, expired or revoked). Supported entities: User.'
integration_identifier: RansomLeak
parameters:
-   name: Email Addresses
    default_value: ''
    type: string
    description: Optional comma-separated email addresses of users to check, in addition to the User entities in scope.
    is_mandatory: false
-   name: Assignment IDs
    default_value: ''
    type: string
    description: Optional comma-separated RansomLeak assignment IDs, as returned by the Assign Training action, to check.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_training_status_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: RansomLeak
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
script_result_name: is_success
default_result_value: 'false'
