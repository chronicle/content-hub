name: Enrich Users
description: 'Enrich User entities with RansomLeak security awareness training data: exercises completed, learning time, campaign completion, in-progress and overdue counts, average quiz score, the most recent completion, and the Human Risk Score and risk level (when risk scoring is enabled and a score has been calculated). Users are matched by email address; entities whose identifier is not an email address are skipped. Enrichment fields are prefixed with RansomLeak_. Supported entities: User.'
integration_identifier: RansomLeak
parameters:
-   name: Create Insight
    default_value: false
    type: boolean
    description: If enabled, the action creates an insight with the training summary for every enriched user.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_users_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: RansomLeak
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
script_result_name: is_success
default_result_value: 'false'
