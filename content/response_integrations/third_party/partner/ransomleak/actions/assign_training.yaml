name: Assign Training
description: 'Assign RansomLeak training to users involved in a case. Provide either a learning path (ID or exact name) to enroll users in, or an exercise slug to create a one-off remediation assignment that emails the user a direct link. Users are taken from User entities with email identifiers and from the Email Addresses parameter, and must already exist in RansomLeak. Users are matched by email address; the JSON result reports the enrollment status (enrolled, already_enrolled, skipped_unlicensed or not_found). Supported entities: User.'
integration_identifier: RansomLeak
parameters:
-   name: Learning Path
    default_value: ''
    type: string
    description: ID or exact name of the RansomLeak learning path to enroll users in. Use the List Learning Paths action to find it. Provide this or Exercise Slug, not both.
    is_mandatory: false
-   name: Exercise Slug
    default_value: ''
    type: string
    description: Slug of a single RansomLeak exercise to assign as a remediation assignment, for example phishing-introduction. Provide this or Learning Path, not both.
    is_mandatory: false
-   name: Email Addresses
    default_value: ''
    type: string
    description: Optional comma-separated email addresses of users to assign, in addition to the User entities in scope.
    is_mandatory: false
-   name: Due In Days
    default_value: ''
    type: string
    description: Optional deadline for learning path enrollment, in days from now (1-365). Not used for exercise assignments.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/assign_training_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: RansomLeak
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
script_result_name: is_success
default_result_value: 'false'
