[project]
name = "RansomLeak"
version = "1.0"
description = "RansomLeak is a security awareness training and human risk platform. Enrich user entities with training status, assign learning paths or exercises to users involved in an incident, and track remediation training progress from Google SecOps. This integration is owned by the \"RansomLeak\". Support Contact: support@ransomleak.com."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.32.4",
    "tipcommon",
]

[dependency-groups]
dev = [
    "integration-testing",
    "pytest>=8.3.5",
    "pytest-json-report>=1.5.0",
    "soar-sdk",
]

[tool.uv.sources]
soar-sdk = { git = "https://github.com/chronicle/soar-sdk.git" }
integration-testing = { path = "../../../../../packages/integration_testing_whls/integration_testing-2.4.8-py3-none-any.whl" }
tipcommon = { path = "../../../../../packages/tipcommon/whls/TIPCommon-2.4.8-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
