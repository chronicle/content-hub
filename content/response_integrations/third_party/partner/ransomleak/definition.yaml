identifier: RansomLeak
name: RansomLeak
parameters:
-   name: API Root
    default_value: https://app.ransomleak.com
    type: url
    description: 'Your RansomLeak tenant URL, for example https://<tenant>.ransomleak.com (use https://<tenant>.eu.ransomleak.com for EU-hosted tenants).'
    is_mandatory: true
    integration_identifier: RansomLeak
-   name: API Key
    default_value: ''
    type: password
    description: RansomLeak API token with the Integration API scope. Generate it in the RansomLeak admin console under Integrations > API.
    is_mandatory: true
    integration_identifier: RansomLeak
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate of the RansomLeak server.
    is_mandatory: false
    integration_identifier: RansomLeak
categories:
- Security
- Data Enrichment
documentation_link: https://docs.ransomleak.com/integrations/security-tools/#google-secops
svg_logo_path: resources/logo.svg
image_path: resources/image.png
