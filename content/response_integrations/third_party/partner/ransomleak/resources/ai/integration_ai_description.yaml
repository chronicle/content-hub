product_categories:
    reasoning: >-
        RansomLeak is a security awareness training and human risk platform. The
        integration enriches User entities with each person's training status and
        assigns remediation training (learning paths or single exercises) to users
        involved in an incident. It manages training for identities but does not
        authenticate, provision or disable them, and it is not a SIEM, EDR, email
        gateway, threat-intelligence or ticketing product.
    siem: false
    edr: false
    network_security: false
    threat_intelligence: false
    email_security: false
    iam_and_identity_management: false
    cloud_security: false
    itsm: false
    vulnerability_management: false
    asset_inventory: false
    collaboration: false
