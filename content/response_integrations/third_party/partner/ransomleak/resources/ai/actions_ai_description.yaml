Enrich Users:
  ai_description: >-
    ### General Description


    Enriches User entities with RansomLeak security awareness training data, including exercises
    completed, learning time, campaign completion, in-progress and overdue counts, average
    quiz score and the most recent completion, plus the user's Human Risk Score
    (`RansomLeak_risk_score`) and risk level (`RansomLeak_risk_level`).



    ### Flow Description


    1. Reads the Create Insight parameter.


    2. Iterates over User entities whose identifier is an email address.


    3. Looks up each user by email (`GET /api/integration/users?email=`) and fetches training
    analytics (`GET /api/integration/users/{id}/analytics`) and the Human Risk Score
    (`GET /api/integration/users/{id}/risk`).


    4. Adds `RansomLeak_`-prefixed properties to the entity, marks it as enriched and optionally
    creates an insight.


    5. Updates the entities and returns a JSON result per entity.



    ### Additional Notes


    Users that do not exist in RansomLeak are reported as not found without failing the action.
    Risk fields are omitted when risk scoring is disabled, no score has been calculated yet, or
    the RansomLeak version does not expose risk scores.
  ai_short_description: Enriches User entities with RansomLeak training status.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates User entity additional properties and the is_enriched flag, and optionally creates
      insights.
    reasoning: >-
      The action only reads from RansomLeak (GET requests) and updates entity properties and
