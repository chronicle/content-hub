Assign Training:
  ai_description: >-
    ### General Description


    Assigns RansomLeak security awareness training to users involved in a case. Either enrolls
    the users in a RansomLeak learning path (selected by ID or exact name, with an optional
    deadline) or creates a one-off remediation assignment for a single exercise, which emails
    the user a signed link to the exercise.



    ### Flow Description


    1. Reads the Learning Path, Exercise Slug, Email Addresses and Due In Days parameters
    and validates that exactly one of Learning Path or Exercise Slug is set.


    2. Collects email addresses from User entities in scope and the Email Addresses parameter,
    skipping values that are not email addresses.


    3. For a learning path: resolves the learning path (`GET /api/integration/learning-paths`)
    and enrolls users by email (`POST /api/integration/learning-paths/{id}/enrollments`),
    mapping the per-user results (enrolled, already_enrolled, skipped_unlicensed, not_found).


    4. For an exercise: creates an assignment per user (`POST /api/integration/assignments`)
    with an idempotency key derived from the case, exercise and email, so re-runs return the
    same assignment.


    5. Returns a JSON result with per-user outcomes and assignment IDs.



    ### Additional Notes


    Users must already exist in RansomLeak; they are matched by email address
    (case-insensitive).
  ai_short_description: >-
    Enrolls users in a RansomLeak learning path or assigns them a remediation exercise.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Enrolls users in a RansomLeak learning path or creates exercise assignments in RansomLeak,
      which may email the user.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action sends POST requests that create enrollments or assignments in RansomLeak,
      mutating external data. It reads users and learning paths but does not update entities,
      insights or alert data.
