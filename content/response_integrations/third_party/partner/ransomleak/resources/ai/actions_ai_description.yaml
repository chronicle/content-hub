Get Training Status:
  ai_description: >-
    ### General Description


    Retrieves RansomLeak training progress for users and remediation assignments.



    ### Flow Description


    1. Collects email addresses from User entities and the Email Addresses parameter, and
    assignment IDs from the Assignment IDs parameter.


    2. For each email, looks up the user (`GET /api/integration/users?email=`), their analytics
    (`GET /api/integration/users/{id}/analytics`) and Human Risk Score
    (`GET /api/integration/users/{id}/risk`; skipped when unavailable).


    3. For each assignment ID, fetches its status (`GET /api/integration/assignments/{id}`).


    4. Returns a JSON result and data tables with the training status.



    ### Additional Notes


    Entities are not updated; use Enrich Users for entity enrichment.
