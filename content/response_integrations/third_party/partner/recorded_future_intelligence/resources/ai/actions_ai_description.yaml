    Creates a new Auto Sigma rule job in Recorded Future based on a provided query.
    This action initiates a job to generate a Sigma rule, waits for its completion,
    and retrieves the final rule details.


    ### Flow Description

    1. Initializes the Recorded Future client configuration using the provided API
    key.

    2. Makes an API call to Recorded Future to create a new Auto Sigma rule job using
    the provided `Job Name`, `Query`, `Start Date`, and `End Date`.

    3. Makes a subsequent API call to fetch the job result, waiting until the job
    is finished.

    4. Returns the job result data as a JSON object to the case.


    ### Additional Notes

