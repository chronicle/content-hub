Lookup Credentials:
  ai_description: >-
    ### General Description

    This action queries Recorded Future's Identity Intelligence to look up leaked
    credential data for a given set of subjects (such as email addresses). It allows
    filtering the search by various parameters including breach names, dates, malware
    families, and authorization technologies.


    ### Flow Description

    1. Extracts the action parameters and configuration settings.

    2. If the `Filter on Target Entities` parameter is enabled, it extracts the identifiers
    of target entities that have the type `Email Message`. Otherwise, it uses the
    comma-separated list provided in the `Subjects` parameter.

    3. Initializes the Recorded Future Identity Manager.

    4. Makes an API call to Recorded Future to look up credentials matching the subjects
    and the specified filter criteria.

    5. Collects the returned credential records and attaches them to the action's
    JSON result.


    ### Additional Notes

    This action only retrieves data and outputs it as a JSON result. It does not update
    the entities, create insights, or mutate any external data.
