Add Analyst Note:
  ai_description: >-
    ### General Description

    Publishes a new Analyst Note to Recorded Future. The action collects all entities
    associated with the current case and appends their identifiers to the provided
    note text before publishing it to the Recorded Future platform.


    ### Flow Description

    1. Extracts the `Note Title`, `Note Text`, and `Topic` parameters.

    2. Iterates through all target entities in the case and collects their identifiers.

    3. Appends the collected entity identifiers to the `Note Text`.

    4. Makes an API call to Recorded Future to publish the Analyst Note.

    5. Returns the published note details as a JSON result.


    ### Additional Notes

    The action operates on all entities in the case without filtering by entity type.
  ai_short_description: >-
    Publishes a new Analyst Note to Recorded Future, appending all case entity identifiers
    to the note text.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Publishes a new Analyst Note to the Recorded Future platform.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to Recorded Future to publish an Analyst Note,
      which mutates external data. It does not fetch data for enrichment, nor does
      it mutate internal SecOps data, update entities, or create insights.
  entity_usage:
    entity_types:
      address: true
      alert: true
      application: true
      child_hash: true
      child_process: true
      cluster: true
      container: true
      credit_card: true
