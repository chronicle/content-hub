Lookup Hostname Credentials:
  ai_description: >-
    ### General Description

    Finds compromised credentials associated with a specific hostname using Recorded
    Future Identity Intelligence. This action queries the Recorded Future API to retrieve
    credential records that have been exposed or exfiltrated, allowing analysts to
    identify potential identity risks related to a specific machine or domain.


    ### Flow Description

    1. Extracts configuration parameters (API Key, Verify SSL) and action parameters
    (Hostname, filters, etc.).

    2. Determines the target hostname. If `Filter on Target Entities` is true, it
    extracts the identifier from the first entity in the target entities list; otherwise,
    it uses the provided `Hostname` parameter.

    3. Initializes the Recorded Future Identity Manager.

    4. Makes a GET request to the Recorded Future API to look up compromised credentials
    for the hostname, applying any provided filters such as dates, breach names, or
    malware families.

    5. Parses the response and adds the credential records to the action's JSON result.


