    and an optional query. This action submits the hashes to Recorded Future's malware
    intelligence engine to automatically generate a YARA rule, waits for the job to
    complete, and returns the result.


    ### Flow Description

    1. Extracts the `Job Name` and `Query` parameters.

    2. Iterates through the target entities and filters for `File Hash` entities.

    3. Initializes the Recorded Future `AutoYaraMgr`.

    4. Makes an API call to Recorded Future to create a new Auto YARA rule job using
    the extracted hashes and query.

    5. Makes an API call to fetch the job result, waiting until the job is completed.

    6. Adds the job result data to the action's JSON result.


    ### Additional Notes

    The action requires File Hash entities to be present in the case to include them
    in the YARA rule generation. If no hashes are provided, it will rely solely on
    the provided query if supported by the API.
