Add List Entities:
  ai_description: >-
    ### General Description

    Adds specified entities or SecOps case target entities to a Recorded Future list.
    This action allows analysts to dynamically populate Recorded Future lists with
    indicators of compromise or other relevant entities directly from a case.


    ### Flow Description

    1. Extracts the `List ID` and optional entity parameters (`Entity ID`, `Entity
    Name`, `Entity Type`).

    2. Determines the target entities: if specific entity parameters are provided,
    it uses them; otherwise, it maps the case's target entities to Recorded Future
    formats.

    3. Makes an API call to Recorded Future to fetch the specified list object.

    4. Makes an API call to bulk add the mapped entities to the Recorded Future list.

    5. Returns a summary of added, unchanged, and failed entities.


    ### Additional Notes

    If no specific entity parameters are provided, the action will process all supported
    target entities attached to the case (Address, Domain, Hostname, URL, FileHash,
    EmailMessage).
  ai_short_description: >-
    Adds specified entities or SecOps case target entities to a Recorded Future list.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds entities to a specified Recorded Future list.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by making a POST/PUT request to Recorded Future
      to bulk add entities to a list. It does not fetch contextual data for enrichment,
      nor does it mutate internal SecOps data, update entities, or create insights.
  entity_usage:
