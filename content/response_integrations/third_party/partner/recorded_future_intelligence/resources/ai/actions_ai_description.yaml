Detonate File:
  ai_description: >-
    ### General Description

    Submits a file to the Recorded Future Sandbox (Hatching Triage) for detonation
    and analysis. The action retrieves the file from a specified source, uploads it
    to the sandbox, and polls for the analysis report, ultimately generating a case
    insight with the detonation details.


    ### Flow Description

    1. Extracts the file from the specified source (GCP Bucket or Local File System)
    using the provided file path.

    2. Submits the file to the Recorded Future Sandbox API for detonation.

    3. Polls the sandbox asynchronously to check the status of the analysis.

    4. Once the analysis is complete, retrieves the overview report.

    5. Generates a case insight containing the detonation results, scores, and signatures.


    ### Additional Notes

    This is an asynchronous action. It will continue to run in the background and
    poll the Recorded Future Sandbox until the analysis is complete or the timeout
    is reached.
