Get CVE Details:
  ai_description: >-
    ### General Description

    Enriches CVE entities using GreyNoise intelligence. This action retrieves detailed
    threat intelligence for CVEs, including CVSS scores, EPSS scores, and active exploitation
    data.


    ### Flow Description

    1. Retrieves the GreyNoise API key from the integration configuration.

    2. Filters the target entities to identify those of type CVE.

    3. Iterates over each CVE entity and validates its format (CVE-YYYY-NNNN).

    4. Makes an API call to GreyNoise to fetch detailed information for the CVE.

    5. Updates the entity's additional properties with the retrieved enrichment data
    (e.g., CVSS score, EPSS score, threat IP counts).

    6. Marks the entity as enriched and generates an HTML insight containing the threat
    assessment and exploitation intelligence.

    7. Updates the entities in the platform and returns the results in JSON format.


    ### Additional Notes

    The action handles rate limits and invalid CVE formats gracefully, skipping invalid
    entities and reporting errors in the output message.
