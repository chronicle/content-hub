    ### General Description

    Retrieves the activity timeline for IP address entities showing changes over time
    with configurable granularity using GreyNoise.


    ### Flow Description

    1. Validates the provided integer parameters (e.g., Days).

    2. Initializes the GreyNoise API manager.

    3. Retrieves IP address entities from the target entities.

    4. Iterates over each IP entity.

    5. Makes an API call to GreyNoise (`greynoise_manager.ip_timeline`) to fetch the
    timeline data for the IP address based on the specified days, field, and granularity.

    6. If timeline data is found, updates the entity's additional properties with
    the enrichment data and marks it as enriched.

    7. Generates an HTML insight containing the timeline overview and adds it to the
    entity.

    8. Updates the entities in the platform.

    9. Returns the JSON results.


