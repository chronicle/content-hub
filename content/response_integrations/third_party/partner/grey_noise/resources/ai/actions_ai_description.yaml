Quick IP Lookup:
  ai_description: >-
    ### General Description

    Performs a lightweight IP classification lookup using GreyNoise to retrieve trust
    level, internet scanner status, and business service status for IP Address entities.


    ### Flow Description

    1. Retrieves all target entities from the case and filters for IP Address entities.

    2. Makes a GET request to the GreyNoise API (`quick_lookup`) to fetch noise data
    for the extracted IP addresses.

    3. Evaluates the API response to determine if each IP is found in the GreyNoise
    dataset and whether its classification is suspicious or malicious.

    4. Enriches the matching entities with the retrieved data (e.g., business service
    status, internet scanner status) and updates their suspicious status.

    5. Generates an HTML insight with the intelligence overview and attaches it to
    the enriched entities.

    6. Saves the updated entities and returns the raw data as a JSON result.


    ### Additional Notes

    This action only processes entities of type Address. Entities of other types will
    be ignored.
