Execute GNQL Query:
  ai_description: >-
    ### General Description

    Executes custom GreyNoise Query Language (GNQL) queries to search GreyNoise threat
    intelligence data. This action allows users to retrieve telemetry data about internet
    scanners and threat actors based on specific search criteria, with built-in support
    for pagination.


    ### Flow Description

    1. Extracts the GNQL query, maximum results limit, and formatting preferences
    (Quick, Exclude Raw) from the action parameters.

    2. Establishes a connection to the GreyNoise API.

    3. Executes the GNQL query via a GET request to the GreyNoise API.

    4. Paginates through the API responses automatically until the specified maximum
    number of results is reached or all available data is retrieved.

    5. Aggregates the fetched records and attaches them to the action's JSON result.


    ### Additional Notes

    If the 'Quick' parameter is enabled, the response will be minimized to only include
    the IP address and its classification or trust level. The 'Exclude Raw' parameter
    can be used to omit raw scan data, reducing the payload size.
  ai_short_description: >-
    Executes custom GNQL queries to search GreyNoise threat intelligence data and
    returns the matching telemetry records.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the GreyNoise API using a GNQL query. It does not
      mutate external data, update internal entities, create insights, or modify alert
      data.
