    update_ticket: false
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Lookup Depth | String | Yes | Specify the number of days from the current date
    for which you want to lookup. |

    | Query | String | No | Raw query with necessary filters. Supports condition concatenation
    with AND, OR, NOT and Parentheses (). |

    | Identifiers | String | Yes | The target case entity identifiers. |

    | Types | String | Yes | The target case entity types. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity and authorization with the ANY.RUN TI Lookup service.


    ### Flow Description

    1. Extracts integration configuration parameters including the API key, proxy
    settings, and SSL verification preferences.

    2. If a proxy is enabled, tests the proxy connection by calling the `check_proxy`
    method on the connector.

    3. Initializes the `LookupConnector` and makes an API call via `check_authorization`
    to verify the API key and connectivity to the ANY.RUN TI Lookup service.

    4. Returns a successful execution state if the connection is established and authorized,
    otherwise catches the exception and returns a failure state with the error message.


    ### Additional Notes

    This action is typically used to verify integration settings during setup or troubleshooting
    and does not process entities or return specific threat intelligence data.
  ai_short_description: >-
    Tests connectivity and authorization with the ANY.RUN TI Lookup service.
