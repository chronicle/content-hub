    enable_identity: false
    enrich_asset: false
    enrich_ioc: true
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action fetches threat intelligence data for indicators (IPs, Domains, URLs,
      Hashes) from ANY.RUN, which aligns with 'Enrich IOC'. It also adds comments
      to the case with lookup URLs and verdict summaries, which aligns with 'Add Alert
      Comment'.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
