ANYRUN TI Lookup:
  ai_description: >-
    ### General Description

    Performs threat intelligence lookups using ANY.RUN TI Lookup. This action queries
    ANY.RUN for specific entities (such as IP addresses, URLs, Domains, Processes,
    and File Hashes) or executes a raw query to retrieve a summary report. It attaches
    the resulting JSON summary to the case wall and adds comments containing the lookup
    URLs and a summary of the verdicts.


    ### Flow Description

    1. Extracts the action parameters including Lookup Depth, Query, Identifiers,
    and Types.

    2. If a raw `Query` is provided, it performs a threat intelligence lookup using
    the query string via the ANY.RUN API.

    3. If no `Query` is provided, it iterates over the provided entity `Identifiers`
    and `Types`.

    4. For each supported entity type, it queries the ANY.RUN TI Lookup API to retrieve
    intelligence data.

    5. Attaches the JSON summary of the report to the case wall as an attachment.

    6. Adds a comment to the case with the specific lookup URL for the entity.

    7. Adds a final comment to the case summarizing the verdicts (e.g., Suspicious,
    Malicious) for all queried entities.


    ### Additional Notes

    Supported entity types include Address, IP Set, URL, Domain, Process, and File
    Hash. If an unsupported entity type is provided, it will be skipped and noted
    in the final summary.
  ai_short_description: >-
    Performs threat intelligence lookups using ANY.RUN TI Lookup for specific entities
    or raw queries, attaching the results to the case wall and adding summary comments.
  capabilities:
    can_create_case_comments: true
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Saves JSON summary reports as attachments to the case wall.
    reasoning: >-
      The action fetches intelligence data from the ANY.RUN API (fetches_data=true).
      It does not mutate external data. It mutates internal data by saving JSON summary
      attachments to the case wall (can_mutate_internal_data=true). It also creates
      case comments with lookup URLs and verdicts (can_create_case_comments=true).
      It does not update entities or create insights.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: true
      email_message: false
      event: false
      file_hash: true
      file_name: false
      generic: false
      host_name: false
      ip_set: true
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: true
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: true
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action accepts 'Identifiers' and 'Types' as input parameters, which represent
      case entities. It maps the provided types to ANY.RUN supported entities using
      a configuration dictionary. The supported types are Address, IP Set, URL (DestinationURL),
      Domain, Process, and File Hash. It filters the execution by checking if the
      provided entity type is in the supported configuration dictionary.
