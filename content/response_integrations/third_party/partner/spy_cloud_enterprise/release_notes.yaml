- description: Fixed the connector silently skipping breach records. The publish-date
    window now ends 15 minutes behind the current time so records that SpyCloud has
    published but not yet indexed are no longer checkpointed past and lost, and the
    checkpoint now advances on cycles that return no records so the window stops
    growing until it exceeds the connector timeout. The once-daily modification drain
    now recovers from an expired pagination cursor by restarting the affected 2-hour
    chunk, and abandons a window that fails three cycles in a row, instead of
    re-sending a rejected cursor on every cycle indefinitely. Connector test runs
    return to a connectivity-only check.
  version: 3.2
  item_name: SpyCloud Enterprise Connector
  item_type: Connector
  publish_time: '2026-08-17'
  ticket_number: ''
  new: false
  regressive: false
  deprecated: false
  removed: false
- description: Fixed the connector creating no cases while logging that it had built
    thousands of alerts. A failure while committing progress after delivery caused a
    second connector package to be written to stdout, which corrupted the whole
    payload and made the platform discard every alert in the cycle; one execution now
    writes exactly one package and a post-delivery commit failure only leaves the
    checkpoint unmoved so the slice replays. The per-cycle volume is also bounded so a
    single package can no longer reach tens of megabytes. The publish-date pull now
    takes one 2-hour chunk per cycle and only checkpoints the boundary it reached, and
    the once-daily modification drain fetches at most 400 records per cycle.
  version: 3.3
  item_name: SpyCloud Enterprise Connector
  item_type: Connector
  publish_time: '2026-08-19'
  ticket_number: ''
  new: false
  regressive: false
  deprecated: false
  removed: false
- description: Added new action "Check Password Rotation" so a password response
    playbook can skip a reset the user already performed. The action compares the
    identity provider's last password change time against the publish date of the
    case's SpyCloud password exposures and reports 1 when the exposed credential may
    still be live, 0 when the account was rotated after the newest exposure. A missing
    or unusable timestamp reports 1, so an exposure that cannot be proven stale is
    still remediated. The connector now also flattens the record's publish date onto
    case events so the comparison has a first-class field to read.
  version: 3.4
  item_name: Check Password Rotation
  item_type: Action
  publish_time: '2026-08-25'
  ticket_number: ''
  new: true
  regressive: false
  deprecated: false
  removed: false
