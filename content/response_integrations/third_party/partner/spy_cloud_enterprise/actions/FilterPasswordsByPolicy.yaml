name: Filter Passwords By Policy
description: Evaluate the plaintext passwords exposed on the current case against a
    configurable password policy (minimum length and optional symbol requirement) and
    report how many still match. Passwords that do not satisfy the policy are dropped;
    the script result value is the number of policy-conforming exposed passwords that
    remain, which the Entra ID response playbook uses to decide whether to reset the
    user's password. The action reads the exposures already attached to the case and
    does not call the SpyCloud API. Plaintext passwords are never surfaced; only counts,
    the configured policy, and length-only masked placeholders are returned.
integration_identifier: SpyCloudEnterprise
parameters:
-   name: Minimum Password Length
    default_value: '8'
    type: string
    description: Minimum length a password must have to satisfy the policy. Exposed
        passwords shorter than this are dropped.
    is_mandatory: false
    integration_identifier: SpyCloudEnterprise
-   name: Require Symbol
    default_value: 'true'
    type: boolean
    description: When enabled, an exposed password must contain at least one punctuation
        symbol to satisfy the policy.
    is_mandatory: false
    integration_identifier: SpyCloudEnterprise
dynamic_results_metadata:
-   result_example_path: resources/FilterPasswordsByPolicy_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: '0'
creator: ad378bcf-9119-4260-9daa-98ba26ece318
script_result_name: ScriptResult
