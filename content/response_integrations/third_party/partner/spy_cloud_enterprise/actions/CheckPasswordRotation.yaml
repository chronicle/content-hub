name: Check Password Rotation
description: Compare the identity provider's last password change time against the
    publish date of the SpyCloud exposures on the current case, so a password response
    playbook can skip a reset the user has already performed. The script result value
    is 1 when a reset is still warranted and 0 when the password was changed after the
    most recent exposure was published, meaning the leaked credential is already dead.
    When the last reset time is missing or unusable, or no exposure on the case carries
    a publish date, the action reports 1 - an exposure that cannot be proven stale is
    treated as live. The action reads the exposures already attached to the case and
    does not call the SpyCloud API. No password value is read or surfaced.
integration_identifier: SpyCloudEnterprise
parameters:
-   name: Last Password Reset Time
    default_value: ''
    type: string
    description: The identity provider's last password change timestamp for the
        affected user, supplied by the preceding get-user step (Okta "passwordChanged",
        Entra ID "lastPasswordChangeDateTime"). Accepts ISO-8601 with or without
        fractional seconds and timezone, a bare date, or epoch seconds/milliseconds.
        Leave empty to always report that a reset is required.
    is_mandatory: false
    integration_identifier: SpyCloudEnterprise
-   name: Email
    default_value: ''
    type: string
    description: Restrict the comparison to exposures for this email address. Leave
        empty to consider every SpyCloud exposure on the case, which is only correct
        when the case concerns a single identity.
    is_mandatory: false
    integration_identifier: SpyCloudEnterprise
-   name: Password Exposures Only
    default_value: 'true'
    type: boolean
    description: When enabled, only exposures that involve a password are considered.
        Disable to compare against the publish date of every SpyCloud exposure on the
        case, including cookie-only or malware records that no password reset can
        remediate.
    is_mandatory: false
    integration_identifier: SpyCloudEnterprise
dynamic_results_metadata:
-   result_example_path: resources/CheckPasswordRotation_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: '1'
creator: ad378bcf-9119-4260-9daa-98ba26ece318
script_result_name: ScriptResult
