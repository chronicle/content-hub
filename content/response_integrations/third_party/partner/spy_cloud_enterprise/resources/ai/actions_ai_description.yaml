Get Watchlist Exposures:
  ai_description: >-
    ### General Description

    The Get Watchlist Exposures action presents SpyCloud Enterprise Watchlist exposures
    that are already attached to the current case as a single case-wall data table
    and insight. It reads the SpyCloud fields that the connector flattened onto each
    alert's security events across every alert in the case.


    ### Flow Description

    1. Retrieves all alerts associated with the current case.

    2. Iterates through the security events of each alert to identify SpyCloud events.

    3. Extracts relevant exposure properties and formats them into table rows and
    JSON objects.

    4. Generates a case insight containing an HTML summary of the exposures.

    5. Attaches a detailed data table and JSON result to the action's output.


    ### Additional Notes

    This action does not make any external API calls to SpyCloud. It relies entirely
    on data already fetched, normalized, and de-duplicated by the connector. The display
    of sensitive data (like plaintext passwords or cookies) is controlled by the connector's
    configuration.
  ai_short_description: >-
    Presents SpyCloud Enterprise Watchlist exposures already attached to the current
    case as a single case-wall data table and insight, without making external API
    calls.
