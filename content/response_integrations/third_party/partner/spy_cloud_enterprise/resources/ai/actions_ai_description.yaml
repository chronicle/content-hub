Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the SpyCloud Enterprise API. This action performs a lightweight
    authenticated request to the breach catalog endpoint to verify that the provided
    integration credentials and network settings are correct.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Key, API Root,
    and Verify SSL).

    2. Initializes the SpyCloud SDK with the provided credentials.

    3. Makes an authenticated GET request to the SpyCloud breach catalog ping endpoint
    (`/enterprise-v2/breach/catalog/1`).

    4. Returns a success status and attaches a JSON result if the connection is successful,
    or fails the action with an error message if the connection fails.


    ### Additional Notes

    This action is intended for manual connectivity validation and does not fetch
    breach, Watchlist, or Compass records. It is not typically used within automated
    playbooks.
  ai_short_description: >-
    Tests connectivity to the SpyCloud Enterprise API by performing a lightweight
    authenticated request to the breach catalog endpoint.
  capabilities:
