name: Enrich Host - Get Host Enrichment API
description: This action retrieves focused enrichment data for a host (IP address)
    using the Censys get host enrichment API. This API is purpose-built to help
    security teams operationalize external internet data and assess risk for an
    IP by providing a curated, fixed subset of host data designed specifically
    for high-volume, automated lookups in SOC environments. This action differs
    from the Enrich Host - Get Host API action in that it uses the get host
    enrichment API instead of the get host API. Learn more at
    https://docs.censys.com/docs/host-enrichment.
integration_identifier: Censys
parameters: []
dynamic_results_metadata:
-   result_example_path: resources/enrich_host_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: ScriptResult
