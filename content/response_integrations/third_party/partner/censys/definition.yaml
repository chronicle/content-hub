identifier: Censys
name: Censys
parameters:
-   name: API Key
    default_value: null
    type: password
    description: Censys API Key.
    is_mandatory: true
    integration_identifier: Censys
-   name: Organization Id
    default_value: ''
    type: string
    description: Censys Organization ID.
    is_mandatory: true
    integration_identifier: Censys
-   name: Verify SSL
    default_value: 'false'
    type: boolean
    description: Verify SSL
    is_mandatory: false
    integration_identifier: Censys
-   name: Enable Get Host Enrichment API
    default_value: 'false'
    type: boolean
    description: Enable the Censys get host enrichment API for this instance. When
        enabled, the integration will enrich a host (IP address) using the Censys
        get host enrichment API instead of the Censys get host API. When disabled,
        Enrich Host - Get Host Enrichment API completes immediately with a false
        result so playbooks can fall back to Enrich Host - Get Host API. Enable
        per instance once the get host enrichment API's output has been validated
        for your use case.
    is_mandatory: false
    integration_identifier: Censys
documentation_link: https://github.com/censys/censys-googlesecops-dashboard/blob/main/docs/Censys%20-%20Google%20SecOps%20SOAR%20Integration%20-%20User%20Guide.pdf
categories:
- Security
- Data Enrichment
- Threat Intelligence
svg_logo_path: resources/logo.svg
image_path: resources/image.png
is_available_for_community: false
