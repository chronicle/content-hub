Enrich IPs:
  ai_description: >-
    ### General Description

    This action retrieves comprehensive information about multiple hosts (IP addresses)
    using the Censys Platform API. It provides detailed intelligence about internet-facing
    infrastructure including services, ports, protocols, certificates, vulnerabilities,
    and location data to help security teams understand their attack surface exposure.


    ### Flow Description

    1. Retrieves the target entities and filters for valid IP addresses (ADDRESS entity
    type).

    2. Validates the provided `At Time` parameter if specified.

    3. Makes a POST request to the Censys API (`/v3/global/asset/host`) to fetch enrichment
    data for the valid IP addresses.

    4. Iterates through the IP entities, matching the API response to each entity.

    5. Removes any previous Censys IP enrichment data from the entity.

    6. Updates the entity's additional properties with the newly retrieved enrichment
    data (e.g., services, vulnerabilities, location) and marks the entity as enriched.

    7. Updates the entities in the Google SecOps platform and attaches the raw JSON
    results to the action.


    ### Additional Notes

    - The action skips invalid IP addresses and logs them.

    - If the `At Time` parameter is provided, it fetches historical data for the specified
    timestamp.
