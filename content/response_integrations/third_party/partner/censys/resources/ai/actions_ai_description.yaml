Get Rescan Status:
  ai_description: >-
    ### General Description

    This action retrieves the current status of a scan by its ID from Censys. It allows
    users to monitor the progress of previously initiated scans and determine when
    scan results are available.


    ### Flow Description

    1. Extracts the `Scan ID` parameter.

    2. Validates the provided `Scan ID`.

    3. Makes a GET request to the Censys API (`/v3/global/scans/{scan_id}`) to retrieve
    the scan status.

    4. Evaluates the response to determine if the scan is completed, in progress,
    or failed.

    5. Returns the scan status and adds the raw response as a JSON result.


    ### Additional Notes

