Get Host History:
  ai_description: >-
    ### General Description

    Retrieves the event history for a specific host (IP address) using Censys. This
    action allows users to view historical scan data, track infrastructure changes
    over time, and identify when services were added, removed, or modified.


    ### Flow Description

    1. Extracts the `Host ID`, `Start Time`, and `End Time` parameters.

    2. Validates the provided IP address and ensures the timestamps are in valid RFC3339
    format.

    3. Makes a GET request to the Censys API (`/v3/global/asset/host/{host_id}/timeline`)
    to retrieve the host's event history within the specified time range.

    4. Handles pagination to fetch up to a maximum threshold of records, managing
    partial data if limits are reached.

    5. Formats the retrieved events into a JSON result and constructs a data table
    for display.

    6. Returns the results and execution status to the SOAR platform.


    ### Additional Notes

    - The API uses reversed time semantics, so the action automatically handles mapping
    the chronological user input to the API's expected reverse chronological order.

    - A maximum of 1000 records are displayed in the table view, with full results
    available in the JSON output.
