Enrich Certificates:
  ai_description: >-
    ### General Description

    Enriches FileHash entities representing SSL/TLS certificates using the Censys
    Platform API. It retrieves comprehensive certificate intelligence, including issuer,
    subject, validity periods, and signature details.


    ### Flow Description

    1. Retrieves FileHash entities from the case.

    2. Validates the entity identifiers to ensure they are valid SHA-256 fingerprints.

    3. Makes a POST request to the Censys API (`/v3/global/asset/certificate`) to
    fetch certificate data for the valid fingerprints.

    4. Parses the API response and extracts enrichment data for each certificate.

    5. Updates the entities with the retrieved enrichment data and marks them as enriched.

    6. Returns the results as JSON.


    ### Additional Notes

    Only FileHash entities with valid 64-character hexadecimal SHA-256 fingerprints
    are processed.
