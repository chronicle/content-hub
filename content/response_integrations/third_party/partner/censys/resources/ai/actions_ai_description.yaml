Create Related Infrastructure Job:
  ai_description: >-
    ### General Description

    Initiates a CensEye job in Censys to discover related infrastructure for a given
    target, such as a host, web property, or certificate. This action triggers an
    asynchronous threat hunting job on the Censys platform and returns a job ID that
    can be used to track its progress and retrieve results.


    ### Flow Description

    1. Extracts the `Target Type` and `Target Value` from the action parameters.

    2. Validates the format of the `Target Value` based on the selected `Target Type`
    (e.g., ensuring a valid IP address for a Host, or a valid SHA-256 hash for a Certificate).

    3. Makes a POST request to the Censys API (`/v3/threat-hunting/censeye/jobs`)
    to create the related infrastructure job.

    4. Parses the API response to extract the job ID, current state, and creation
    time.

    5. Outputs the job details and attaches the raw API response to the action's JSON
    results.


    ### Additional Notes

    Since the CensEye job runs asynchronously, this action only initiates the process.
    You must use the returned Job ID with other actions (like 'Get Related Infrastructure
    Job Status' and 'Get Related Infrastructure Results') to monitor the job and retrieve
    the final pivot data.
  ai_short_description: >-
    Initiates an asynchronous CensEye job in Censys to discover related infrastructure
    for a specified host, web property, or certificate.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new CensEye threat hunting job in the Censys platform.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Censys API to create a new CensEye job,
      which mutates external data by creating a job record on the external platform.
      It does not fetch contextual data for immediate enrichment, mutate internal
      SOAR data, update entities, or create insights/comments.
