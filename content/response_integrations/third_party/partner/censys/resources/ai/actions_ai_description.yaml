Initiate Rescan:
  ai_description: >-
    ### General Description

    Initiates a live rescan for a known host service at a specific IP and port or
    hostname and port on the Censys platform.


    ### Flow Description

    1. Extracts the `IOC Type`, `IOC Value`, `Port`, `Protocol`, and `Transport Protocol`
    parameters.

    2. Validates the provided parameters, ensuring the port is valid and required
    fields are present based on the selected `IOC Type`.

    3. Makes a POST request to the Censys API (`/v3/global/scans/rescan`) to initiate
    the rescan.

    4. Retrieves the scan ID, tasks, and creation time from the API response.

    5. Adds the raw API response to the action's JSON results.

    6. Returns a success message containing the scan ID.


    ### Additional Notes

    The scan may take several minutes to complete. The returned scan ID can be used
    to monitor the scan's status using the 'Get Rescan Status' action.
