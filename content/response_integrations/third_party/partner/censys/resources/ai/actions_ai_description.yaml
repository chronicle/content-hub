Get Related Infrastructure Job Status:
  ai_description: >-
    ### General Description

    Retrieves the current status of a CensEye job by its ID. This action supports
    asynchronous execution and will return an IN_PROGRESS status if the job is still
    running, allowing playbooks to poll until completion.


    ### Flow Description

    1. Extracts the provided `Job ID` parameter.

    2. Makes a GET request to the Censys API (`/v3/threat-hunting/censeye/jobs/{job_id}`)
    to fetch the current status of the job.

    3. Evaluates the returned job state.

    4. Sets the action execution state to COMPLETED, FAILED, or INPROGRESS based on
    the job state, and returns the raw JSON response.


    ### Additional Notes

    This action is designed to be used in conjunction with the 'Create Related Infrastructure
    Job' action to monitor the progress of long-running threat hunting queries.
