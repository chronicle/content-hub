    ### General Description

    Enriches Hostname entities using threat intelligence data from Stairwell. This
    action retrieves detailed information about hostnames, evaluates their risk based
    on verdicts, updates entity properties, and generates insights for suspicious
    entities.


    ### Flow Description

    1. Filters the target entities to identify those of type Hostname.

    2. Iterates through the suitable entities and retrieves their original identifiers.

    3. Makes a GET request to the Stairwell API (`/labs/appapi/enrichment/v1/hostname_event/{hostname}`)
    to fetch enrichment data for each hostname.

    4. Updates the entity's additional properties with the retrieved data and marks
    the entity as enriched.

    5. Evaluates the enrichment data to determine if the hostname is suspicious based
    on the returned verdict.

    6. If the hostname is deemed suspicious, generates an entity insight with the
    analysis results.

    7. Attaches a data table and JSON results to the action output.

    8. Updates the entities in the Google SecOps platform.


