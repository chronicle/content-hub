Enrich IP:
  ai_description: >-
    ### General Description

    Enriches IP address entities using threat intelligence data from Stairwell. This
    action retrieves detailed information about the IP, updates the entity's properties,
    and evaluates its risk level to provide actionable insights for analysts.


    ### Flow Description

    1. Iterates through the case's target entities to identify those of type ADDRESS.

    2. For each suitable IP address, makes a GET request to the Stairwell API (`/labs/appapi/enrichment/v1/ip_event/{ip}`)
    to retrieve enrichment data.

    3. Updates the entity's `additional_properties` with the retrieved data and marks
    the entity as enriched.

    4. Evaluates the entity's suspicious status based on the returned verdict from
    Stairwell.

    5. If the entity is deemed suspicious, generates an insight containing the analysis
    results and attaches it to the entity.

    6. Attaches a data table and JSON results to the action output for further review.

    7. Saves the updated entities back to the platform.


    ### Additional Notes

    This action relies on the Stairwell integration configuration for authentication
    and API routing.
