Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Stairwell API. This action verifies that the integration
    is configured correctly and can successfully communicate with the Stairwell service.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, API Key, Organization
    ID, User ID).

    2. Initializes the StairwellManager with the provided credentials.

    3. Makes a GET request to the Stairwell API to test connectivity by attempting
    to fetch data for a hardcoded dummy hostname (`www.google.com`).

    4. Returns a success message if the connection is established and the API responds
    successfully, or an error message if the connection fails.


    ### Additional Notes

    This action is typically used during the initial setup or troubleshooting of the
    Stairwell integration to ensure network reachability and valid authentication.
