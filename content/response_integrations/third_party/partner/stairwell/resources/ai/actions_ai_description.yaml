Enrich Hash:
  ai_description: >-
    ### General Description

    Enriches file hash entities with threat intelligence data from Stairwell. This
    action retrieves detailed file information, including malicious probability, detection
    labels, and file metadata, to evaluate the risk associated with the hash.


    ### Flow Description

    1. Filters the target entities to include only File Hash entities.

    2. Iterates over the suitable entities and makes a GET request to the Stairwell
    API (`/labs/appapi/enrichment/v1/object_event/{file_hash}`) for each hash.

    3. Retrieves the file enrichment report and updates the entity's additional properties.

    4. Evaluates the file's suspiciousness based on the verdict and malicious probability
    returned by Stairwell.

    5. If the file is deemed suspicious, generates an entity insight with the analysis
    results.

    6. Attaches a data table with the enrichment details to the action results.

    7. Updates the enriched entities within the Google SecOps platform.

    8. Returns the raw JSON results of the enrichment.


    ### Additional Notes

    None.
  ai_short_description: >-
    Enriches file hash entities with threat intelligence data from Stairwell, evaluating
    their malicious probability and updating the entities with insights and metadata.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Stairwell API to fetch file hash data
      (fetches_data=true). It does not mutate external data. It updates the entities
      in the platform (can_update_entities=true) and creates insights if the file
      is suspicious (can_create_insight=true).
