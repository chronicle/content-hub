Create Task for IOCs:
  ai_description: >-
    ### General Description

    Creates a task for threat data objects (indicators) in Cyware Intel Exchange based
    on the target entities attached to the case.


    ### Flow Description

    1. Retrieves all target entities attached to the case.

    2. If an `Assignee Email ID` is provided, queries Cyware Intel Exchange to retrieve
    the corresponding user ID.

    3. Performs a bulk lookup in Cyware Intel Exchange to find the indicator IDs for
    the provided entities.

    4. For each valid indicator found, makes a POST request to the Cyware API to create
    a task with the specified text, priority, status, and deadline.

    5. Returns the created task details as JSON results.


    ### Additional Notes

    - The deadline is calculated in days from the current time (maximum 365 days).

    - The text description has a maximum limit of 2000 characters.

    - Indicators not found in Cyware Intel Exchange will be skipped.
