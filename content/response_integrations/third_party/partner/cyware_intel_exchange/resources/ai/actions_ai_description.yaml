Get IOC Details:
  ai_description: >-
    ### General Description

    This action performs a lookup for threat data objects in Cyware Intel Exchange
    and retrieves the details of the objects, such as basic details, enriched data,
    and relations. It then enriches the target entities in Google SecOps with the
    retrieved data.


    ### Flow Description

    1. Retrieves target entities from the case.

    2. Calls the Cyware Intel Exchange API (`/ingestion/openapi/bulk-lookup/{object_type}/`)
    to fetch details for the entities.

    3. Parses the results and creates a CSV table for display.

    4. Matches the retrieved IOC details with the target entities.

    5. Enriches the matched entities with the retrieved data (e.g., analyst score,
    confidence score, tags) and sets `is_enriched` to True.

    6. Updates the entities in Google SecOps.

    7. Returns the JSON results and a success message.


    ### Additional Notes

    The action can optionally include enrichment data and relation data in the results
    based on the input parameters.
