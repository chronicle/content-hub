Add IOCs to Allowed list:
  ai_description: >-
    ### General Description

    Adds specified indicators (IOCs) to the allowed list (whitelist) in Cyware Intel
    Exchange. This action helps in marking known good indicators to prevent false
    positives.


    ### Flow Description

    1. Extracts the target entities attached to the current case.

    2. Retrieves the 'IOC Type' and 'Reason' parameters provided by the user.

    3. Makes a POST request to the Cyware Intel Exchange API (`/conversion/allowed_indicators/`)
    to add the extracted entity identifiers to the allowed list.

    4. Returns a summary of the processed indicators, detailing how many were newly
    created, already existed, or were invalid.


    ### Additional Notes

    The action processes all target entities attached to the case regardless of their
    specific SecOps entity type, but they are submitted to Cyware under the single
    specified 'IOC Type' parameter.
  ai_short_description: >-
    Adds specified indicators (IOCs) from the case entities to the allowed list (whitelist)
    in Cyware Intel Exchange.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the specified indicators to the allowed list (whitelist) in Cyware Intel
      Exchange.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by making a POST request to Cyware Intel Exchange
      to add IOCs to an allowlist. It does not fetch contextual data, update internal
      entities, create insights, modify alerts, or create case comments.
