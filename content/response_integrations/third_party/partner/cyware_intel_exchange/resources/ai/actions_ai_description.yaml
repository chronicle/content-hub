    action allows users to add or remove specific tags from IOCs associated with the
    target entities in the case.


    ### Flow Description

    1. Retrieves the target entities from the case.

    2. Fetches the available tags from Cyware Intel Exchange to resolve tag IDs.

    3. Looks up the IOCs in Cyware Intel Exchange to resolve their object IDs.

    4. If the operation is "Add Tag", it creates any missing tags and adds the specified
    tags to the resolved IOCs via the Cyware API.

    5. If the operation is "Remove Tag", it removes the specified tags from the resolved
    IOCs via the Cyware API.

    6. Returns a JSON result with the operation status.


    ### Additional Notes

