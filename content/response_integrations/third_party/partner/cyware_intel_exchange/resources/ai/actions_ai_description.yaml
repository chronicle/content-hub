Add Note to IOCs:
  ai_description: >-
    ### General Description

    Adds a note to existing threat data objects (indicators) in Cyware Intel Exchange
    based on the target entities in the case. This action allows analysts to append
    contextual information or analysis notes directly to indicators within the threat
    intelligence platform.


    ### Flow Description

    1. Extracts all target entities attached to the current case.

    2. Performs a bulk lookup API call to Cyware Intel Exchange to retrieve the internal
    indicator IDs for the provided entities.

    3. Iterates through the successfully resolved indicators and makes a POST request
    to the `/ingestion/notes/` endpoint to add the specified note.

    4. Collects the responses and returns a JSON result containing the note IDs and
    status for each processed indicator.


    ### Additional Notes

    Entities that are not found in Cyware Intel Exchange during the bulk lookup phase
    will be skipped. If the note is specified as JSON format, it will be parsed and
    validated before being sent to the API.
