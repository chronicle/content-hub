    ### General Description

    This action tests the connectivity to the Cyware Intel Exchange server. It verifies
    that the provided integration credentials and network configurations are valid
    by sending a ping request to the API.


    ### Flow Description

    1. Retrieves the integration configuration parameters (Base URL, Access ID, Secret
    Key).

    2. Initiates a GET request to the `/ping/` endpoint of the Cyware Intel Exchange
    API.

    3. Evaluates the HTTP response to determine if the connection was successful.

    4. Returns a boolean result indicating the connectivity status.


