Create Intel in Cyware Intel Exchange:
  ai_description: >-
    ### General Description

    Creates a new intelligence record in Cyware Intel Exchange (CTIX) for the provided
    entities.


    ### Flow Description

    1. Retrieves integration parameters and action parameters (such as Title, TLP,
    Tags, and IOC Type).

    2. Iterates over the target entities attached to the case.

    3. Prepares a payload for each entity to create intel in CTIX.

    4. Makes a POST request to the `/conversion/quick-intel/create-stix/` endpoint
    to create the intelligence record.

    5. Polls the `/conversion/quick-intel/receive-report/` endpoint to check the status
    of the quick intel creation.

    6. Returns the results and adds them to the JSON result.


    ### Additional Notes

    None.
