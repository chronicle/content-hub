Mark IOCs False Positive:
  ai_description: >-
    ### General Description

    Marks multiple Indicator of Compromise (IOC) entities as false positives within
    Cyware Intel Exchange (CTIX). This action initiates a state change on the external
    threat intelligence platform to prevent future false positive alerts for the specified
    indicators.


    ### Flow Description

    1. Retrieves all target entities attached to the current case.

    2. Makes a POST request to the Cyware Intel Exchange API to look up the entities
    and resolve their corresponding indicator IDs.

    3. Makes a POST request to the Cyware API bulk action endpoint to mark the resolved
    indicator IDs as false positives.

    4. Returns a summary of the successfully marked indicators and outputs the results
    as JSON.


    ### Additional Notes

    Indicators that are not found in Cyware Intel Exchange during the lookup phase
    will be skipped and will not cause the action to fail.
