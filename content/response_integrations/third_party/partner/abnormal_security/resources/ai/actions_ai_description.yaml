Delete Messages:
  ai_description: >-
    ### General Description

    Deletes specified email messages from recipient mailboxes using Abnormal Security.
    This action serves as a convenience wrapper for the Remediate Messages action
    with the remediation action hard-coded to 'delete'.


    ### Flow Description

    1. Extracts the necessary integration configuration and action parameters, including
    the source, messages JSON, remediation reason, and optional tenant IDs.

    2. Parses the provided `Messages JSON` string into a list of message objects.

    3. Initiates a POST request to the Abnormal Security API (`/v1/search/remediate`)
    to submit a delete request for the specified messages.

    4. Retrieves the activity log ID from the API response and attaches the full response
    as a JSON result to the action.

    5. Returns a success status if the request is submitted successfully, or fails
    with an error message if validation or API errors occur.


    ### Additional Notes

    The `Messages JSON` parameter must contain full message objects (typically obtained
    from a prior 'Search Messages' action), including fields like `tenant_id`, `raw_message_id`,
    `mailbox_name`, `native_user_id`, `subject`, `sender`, and `received_time`. A
    single message ID is insufficient for this action.
  ai_short_description: >-
    Deletes specified email messages from recipient mailboxes via the Abnormal Security
    API.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Submits a request to the Abnormal Security API to delete specified email messages
      from recipient mailboxes.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Abnormal Security API to delete email
      messages, which mutates external data. It does not fetch contextual data, mutate
      internal SOAR data, update entities, create insights, modify alerts, or create
      case comments.
