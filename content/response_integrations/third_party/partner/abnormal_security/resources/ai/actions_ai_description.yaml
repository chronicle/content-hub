Get Activity Status:
  ai_description: >-
    ### General Description

    Checks the status of a remediation operation in Abnormal Security using the Activity
    Log ID. This action is designed to monitor the progress of remediation tasks initiated
    by other actions, such as 'Remediate Messages'.


    ### Flow Description

    1. Extracts the `Activity Log ID` and optional `Tenant IDs` from the action parameters.

    2. Makes a GET request to the Abnormal Security API (`/v1/search/activities/{activity_log_id}/status`)
    to retrieve the current status of the remediation activity.

    3. Evaluates whether the activity has reached a terminal state (`success`, `partial_success`,
    or `error`).

    4. Outputs the status and attaches the full API response as a JSON result.


    ### Additional Notes

    This action is typically used in a polling loop within a playbook to wait until
    a remediation operation completes. The `Tenant IDs` parameter is optional and
    generally ignored by the API since the tenant scope is resolved from the API key.
  ai_short_description: >-
    Checks the status of a remediation operation in Abnormal Security using the Activity
    Log ID.
