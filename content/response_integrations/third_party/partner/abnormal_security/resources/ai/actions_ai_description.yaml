Unremediate Threat:
  ai_description: >-
    ### General Description

    Reverses a remediation action on an Abnormal Security threat. This action serves
    as a convenience wrapper for the `Post Threat Action` with the action parameter
    hard-coded to `unremediate`.


    ### Flow Description

    1. Extracts the `Threat ID` and `Message IDs` parameters from the action configuration.

    2. Determines the target threat IDs either from the provided `Threat ID` parameter
    or by iterating over the case's `THREATSIGNATURE` entities.

    3. Makes a POST request to the Abnormal Security API (`/v1/threats/{threat_id}`)
    to execute the `unremediate` action, optionally scoped to specific message IDs.

    4. Aggregates the API responses and returns them as a JSON object attached to
    the action result.


    ### Additional Notes

    If no `Threat ID` is provided and no `THREATSIGNATURE` entities are found in the
    scope, the action will fail. When scoped to entities, it can process multiple
    threats in a single batch execution.
