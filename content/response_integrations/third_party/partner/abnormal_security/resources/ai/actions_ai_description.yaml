Submit Messages To D360:
  ai_description: >-
    ### General Description

    Submits messages to Abnormal Security's Detection 360 service for re-analysis.
    This action serves as a convenience wrapper for the `Remediate Messages` action
    with the action parameter hard-coded to `submit_to_d360`.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the source,
    messages JSON, remediation reason, and optional tenant IDs.

    2. Parses the provided `Messages JSON` string into a list of message objects.

    3. Initializes the `AbnormalManager` to handle API communication.

    4. Calls the `remediate_messages` method, which sends a POST request to the `/v1/search/remediate`
    endpoint with the action set to `submit_to_d360`.

    5. Retrieves the activity log ID from the response and adds the full JSON response
    to the action results.

    6. Outputs a success message containing the number of submitted messages and the
    activity log ID.


    ### Additional Notes

    The `Messages JSON` parameter expects a JSON array of message objects, typically
    obtained from the JsonResult of a prior `Search Messages` action. Each object
    must include specific fields like `tenant_id`, `raw_message_id`, `mailbox_name`,
    `native_user_id`, `subject`, `sender`, and `received_time`.
