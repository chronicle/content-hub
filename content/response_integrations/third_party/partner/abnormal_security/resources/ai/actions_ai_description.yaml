  ai_description: >-
    ### General Description

    Submits a remediation or unremediation action for a specific threat in Abnormal
    Security. This action can be executed on a specific Threat ID provided as a parameter
    or dynamically on Threat Signature entities associated with the case. It allows
    security analysts to quickly respond to identified threats by modifying the state
    of the associated messages.


    ### Flow Description

    1. Extracts the `Threat ID`, `Action` (remediate or unremediate), and optional
    `Message IDs` from the action parameters.

    2. Checks if the action is scoped to entities. If so, it iterates over the target
    entities and filters for those with the `THREATSIGNATURE` entity type, extracting
    their identifiers to use as Threat IDs.

    3. If no Threat Signature entities are found, it falls back to using the `Threat
    ID` provided in the parameters.

    4. Iterates over the collected Threat IDs and makes a POST request to the Abnormal
    Security API (`/v1/threats/{threat_id}`) to apply the specified action (optionally
    scoped to specific message IDs).

    5. Aggregates the API responses and attaches them to the case as a JSON result,
    updating the action's success or failure status accordingly.


    ### Additional Notes

    This action supports batch execution when multiple Threat Signature entities are
    selected from the case view. If specific `Message IDs` are not provided, the remediation
    action will apply to all messages associated with the threat.
