[project]
name = "Huntbase"
version = "1.0"
description = "Huntbase is the open threat-hunting platform for lean SOC, threat hunting and IR teams. Scout, its investigation partner, hunts across your data, cites its evidence and waits for approval. This integration enriches case entities with Huntbase intelligence and entity data, starts and follows hunts from a case, asks Scout questions, adds indicators to Huntbase watch lists, lists Scout proposals waiting for approval and brings confirmed Huntbase findings and high-severity insights into Google SecOps as alerts. In case of any queries, please reach out to support@huntbase.io."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.32.4",
    "tipcommon",
]

[dependency-groups]
dev = [
    "integration-testing",
    "pytest>=8.3.5",
    "pytest-json-report>=1.5.0",
    "soar-sdk",
    "tipcommon",
]

[tool.uv.sources]
soar-sdk = { git = "https://github.com/chronicle/soar-sdk.git" }
tipcommon = { path = "../../../../../packages/tipcommon/whls/TIPCommon-2.4.8-py3-none-any.whl" }
integration-testing = { path = "../../../../../packages/integration_testing_whls/integration_testing-2.4.8-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
