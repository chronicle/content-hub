name: Huntbase - Findings Connector
description: Pull confirmed Huntbase findings and, optionally, high-severity Huntbase
    insights into Google SecOps as alerts. Each alert carries the finding or insight
    entities as events and a link back to Huntbase. The connector keeps a watermark
    and the ids it already ingested, so every item becomes one alert.
integration: Huntbase
documentation_link: https://docs.huntbase.io/docs/integrations/google-secops#soar-response-integration
parameters:
-   name: API Root
    default_value: https://app.huntbase.io/api/v1
    type: string
    description: The API root of your Huntbase instance, for example https://app.huntbase.io/api/v1.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Key
    default_value: ''
    type: password
    description: A personal Huntbase API key (hb_pat_...) with read access to findings
        and insights.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, the connector verifies the TLS certificate of the Huntbase
        server.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Source
    default_value: Findings
    type: string
    description: 'What to ingest: Findings, Insights, or Findings and Insights.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Finding Dispositions
    default_value: confirmed
    type: string
    description: Comma-separated finding dispositions to ingest, for example confirmed.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Lowest Insight Severity
    default_value: high
    type: string
    description: Lowest insight severity to ingest when Source includes Insights (informational,
        low, medium, high or critical).
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Hours Backwards
    default_value: '24'
    type: integer
    description: How many hours back to fetch on the first run, and the oldest point
        any run goes back to.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Alerts Per Cycle
    default_value: '50'
    type: integer
    description: Maximum number of alerts to create in one connector run.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Name of the event field that holds the environment name. If empty,
        alerts go to the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regular expression run on the Environment Field Name value to get
        the environment name.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: DeviceProductField
    default_value: device_product
    type: string
    description: The field name used to determine the device product.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: event_type
    type: string
    description: The field name used to determine the event name (sub-type).
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '180'
    type: integer
    description: The timeout limit (in seconds) for the python process running the
        current script.
    is_mandatory: true
    is_advanced: false
    mode: regular
rules: []
is_connector_rules_supported: true
creator: Huntbase
