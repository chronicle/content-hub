name: Ask Scout
description: Ask Scout, the Huntbase investigation partner, a question about the case.
    The action runs asynchronously; it submits the question with the case entities
    as context and polls until Scout answers. Returns the answer and a link to it in
    Huntbase.
integration_identifier: Huntbase
is_async: true
parameters:
-   name: Question
    default_value: ''
    type: string
    description: The question for Scout, for example "Have we seen this IP anywhere
        else in the last 30 days?".
    is_mandatory: true
-   name: Hunt ID
    default_value: ''
    type: string
    description: Optional Huntbase hunt ID to ask the question inside an existing hunt.
    is_mandatory: false
-   name: Include Case Context
    default_value: 'true'
    type: boolean
    description: If enabled, the case ID and the case entities are sent with the
        question.
    is_mandatory: false
-   name: Initiative
    default_value: medium
    type: ddl
    optional_values:
    - low
    - medium
    description: How much Scout may explore on its own while answering. Scout only proposes
        actions; approvals stay in Huntbase.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ask_scout_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Huntbase
script_result_name: is_success
