name: Start Hunt
description: Start a Huntbase hunt seeded with the case's IP, domain, URL, hash, hostname
    and user entities. The case ID and link are stored on the hunt so it
    points back to Google SecOps. Returns the hunt ID and a link to the hunt in Huntbase.
integration_identifier: Huntbase
parameters:
-   name: Title
    default_value: ''
    type: string
    description: Title for the hunt. Defaults to the case ID and first entity.
    is_mandatory: false
-   name: Hypothesis
    default_value: ''
    type: string
    description: What Scout should test, for example "The host beaconed to the domain
        after the phishing email".
    is_mandatory: false
-   name: Session Mode
    default_value: supervised
    type: ddl
    optional_values:
    - guided
    - supervised
    - autonomous
    description: How much Scout may do on its own. Supervised asks before acting. Autonomous
        follows your organization's autonomy rules and needs a plan that includes it.
    is_mandatory: false
-   name: Severity
    default_value: ''
    type: string
    description: Optional hunt severity (low, medium, high or critical).
    is_mandatory: false
-   name: Additional Seed Values
    default_value: ''
    type: string
    description: Comma-separated extra seed values (IPs, domains, URLs, hashes, emails
        or hostnames) to add to the case entities. A hunt takes up to 20 seed values.
    is_mandatory: false
-   name: Reuse Open Hunt
    default_value: 'true'
    type: boolean
    description: If enabled and a hunt for this case is still open in Huntbase, the action
        returns that hunt instead of starting a new one. Needs Case Link, which Huntbase
        uses to recognise the case.
    is_mandatory: false
-   name: Case Link
    default_value: ''
    type: string
    description: Optional absolute link to the case in Google SecOps. Huntbase stores it
        on the hunt so analysts can jump back, and uses it to find an open hunt for the
        case.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/start_hunt_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Huntbase
script_result_name: is_success
