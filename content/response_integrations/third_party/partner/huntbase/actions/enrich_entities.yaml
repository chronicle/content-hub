name: Enrich Entities
description: Enrich IP, domain, URL, file hash, hostname and user entities with Huntbase
    intelligence and entity data. Indicators are looked up in Huntbase intelligence
    (confidence, TLP, source, first and last seen, sightings in your organization);
    hosts and users are matched against Huntbase entities. Enrichment fields are added
    to the entity with the HB_ prefix, an insight is added for known values and the
    result links back to Huntbase.
integration_identifier: Huntbase
parameters:
-   name: Create Insight
    default_value: 'true'
    type: boolean
    description: If enabled, the action adds an entity insight for every value Huntbase
        knows.
    is_mandatory: false
-   name: Suspicious Threshold
    default_value: '70'
    type: string
    description: Mark an indicator entity as suspicious when its Huntbase confidence
        is at or above this value (0 to 100).
    is_mandatory: false
-   name: Only Enrich Known Values
    default_value: 'false'
    type: boolean
    description: If enabled, values that Huntbase has no record of are left unchanged
        instead of being marked HB_status unknown.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Huntbase
script_result_name: is_success
