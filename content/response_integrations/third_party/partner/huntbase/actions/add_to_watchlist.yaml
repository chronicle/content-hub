name: Add To Watchlist
description: Add the IP, domain, URL and file hash entities in scope to a Huntbase
    watch list, so Huntbase watches for them across your data.
integration_identifier: Huntbase
parameters:
-   name: Watchlist
    default_value: ''
    type: string
    description: Name or ID of the Huntbase watch list.
    is_mandatory: true
-   name: Additional Values
    default_value: ''
    type: string
    description: Comma-separated extra values to add along with the entities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/add_to_watchlist_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Huntbase
script_result_name: is_success
