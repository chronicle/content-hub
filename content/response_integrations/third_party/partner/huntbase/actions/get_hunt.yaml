name: Get Hunt
description: Get the status, verdict, summary and findings of a Huntbase hunt. With
    Wait For Completion enabled the action runs asynchronously and polls until the
    hunt is concluded or a verdict is recorded.
integration_identifier: Huntbase
is_async: true
parameters:
-   name: Hunt ID
    default_value: ''
    type: string
    description: The Huntbase hunt ID, for example the hunt_id returned by Start Hunt.
    is_mandatory: true
-   name: Include Findings
    default_value: 'true'
    type: boolean
    description: If enabled, the hunt's findings are added to the JSON result.
    is_mandatory: false
-   name: Wait For Completion
    default_value: 'false'
    type: boolean
    description: If enabled, the action keeps polling until the hunt is concluded or
        a verdict is recorded.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_hunt_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Huntbase
script_result_name: is_success
