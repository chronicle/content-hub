name: List Pending Approvals
description: List Scout proposals in Huntbase that are waiting for a person to approve
    them, with links to the approvals queue.
integration_identifier: Huntbase
parameters:
-   name: Max Results
    default_value: '20'
    type: string
    description: Maximum number of pending approvals to return (1 to 100).
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_pending_approvals_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Huntbase
script_result_name: is_success
