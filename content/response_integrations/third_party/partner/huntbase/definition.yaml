identifier: Huntbase
name: Huntbase
parameters:
-   name: API Root
    default_value: https://app.huntbase.io/api/v1
    type: string
    description: The API root of your Huntbase instance, for example https://app.huntbase.io/api/v1.
    is_mandatory: true
    integration_identifier: Huntbase
-   name: API Key
    type: password
    description: A personal Huntbase API key (hb_pat_...). Create one in Huntbase under Settings, API keys. The key fixes the Huntbase organization the integration works in.
    is_mandatory: true
    integration_identifier: Huntbase
-   name: Verify SSL
    type: boolean
    default_value: true
    description: If enabled, the integration verifies the TLS certificate of the Huntbase server.
    is_mandatory: false
    integration_identifier: Huntbase
categories:
- Security
- Threat Intelligence
documentation_link: https://docs.huntbase.io/docs/integrations/google-secops#soar-response-integration
svg_logo_path: resources/logo.svg
image_path: resources/image.png
