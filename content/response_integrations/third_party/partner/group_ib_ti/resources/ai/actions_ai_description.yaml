  ai_description: >-
    ### General Description

    Pings the Group-IB Threat Intelligence API to test the connection and retrieves
    a JSON output of available collections based on the current subscription.


    ### Flow Description

    1. Initializes the connection to the Group-IB Threat Intelligence API.

    2. Sends a GET request to the `user/granted_collections` endpoint.

    3. Retrieves the available collections and adds them to the action's JSON result.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

