Get-Collection-Info-Async:
  ai_description: >-
    ### General Description

    This action extracts threat intelligence data from the Group-IB TI database based
    on a specified collection. It is designed to retrieve fresh updates and can be
    run on a daily basis. The action ignores any input entities and relies solely
    on the provided parameters to fetch the relevant collection data.


    ### Flow Description

    1. Retrieves the action parameters including the collection name, start date,
    portion limit, and whether to enable the mapping parser.

    2. Initializes a connection to the Group-IB TI API using the provided credentials.

    3. Determines the sequence update number either from the previously stored timestamp
    or by making an API call to the Group-IB TI API to get the sequence update dictionary
    for the provided start date.

    4. Creates an update generator which makes subsequent API calls to fetch the data
    in portions up to the specified limit.

    5. Iterates through the fetched portions, optionally parsing the data using mapping
    keys if the mapping parser is enabled.

    6. Aggregates the parsed or raw data into a JSON object.

    7. Returns the aggregated data as a JSON result to the playbook.


    ### Additional Notes

    This action does not operate on entities. It is typically used to download bulk
    threat intelligence data for further processing or ingestion.
  ai_short_description: >-
    Extracts threat intelligence data from a specified Group-IB TI collection, retrieving
    fresh updates based on a start date and portion limit, and returns the data as
    a JSON object.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Group-IB TI API (fetches_data=true). It does
      not mutate external data, mutate internal data, update entities, create insights,
      modify alert data, or create case comments.
