Get-Graph-Info:
  ai_description: >-
    ### General Description

    Retrieves WHOIS and graph information for Domain or IP Address entities using
    Group-IB Threat Intelligence. This action analyzes the provided entities, identifies
    valid IP addresses and domains, and fetches their associated graph data to provide
    additional context.


    ### Flow Description

    1. Iterates over the target entities provided to the action.

    2. Validates the format of each entity's identifier to determine if it is an IP
    address, domain, or URL (which is parsed into a domain or IP).

    3. Filters the entities, proceeding only with those identified as IPs or domains.

    4. Makes a GET request to the Group-IB TI API (`utils/graph/{type}`) for each
    valid entity to retrieve graph and WHOIS information.

    5. Aggregates the retrieved data and attaches it to the action's JSON result.


    ### Additional Notes

    Entities that do not match the format of an IP address or domain (e.g., file hashes,
    usernames) will be skipped during execution.
