    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the ELLIO API to fetch CBS data for IP addresses.
      It does not mutate external data. It updates the entities in the platform with
      the retrieved data and creates insight cards for them.
