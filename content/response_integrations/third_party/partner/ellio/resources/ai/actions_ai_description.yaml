    | Rule Name | String | No | Optional override for the rule name. If empty, the
    rule is auto-named as parsable key=value pairs, e.g. "secops_case=4711 \| alert=Suspicious
    Inbound Connection \| ellio=malicious". |

    | Expires In Days | String | No | Number of days after which the blocklist rule
    expires. Set to 0 for a permanent rule. |

    | Conflict Resolution | String | No | How to resolve a conflict with an existing
    rule for the same IP/CIDR. extend = extend the existing rule; override = replace
    it; skip = leave it; fail = error. |
CBS Lookup:
  ai_description: >-
    ### General Description

    This action classifies IP Address entities against ELLIO Common Business Services
    to determine if they belong to known cloud, CDN, SaaS, ISP, security, or crawler
    providers. It enriches the matched entities with provider context and generates
    an insight card to help analysts separate legitimate provider infrastructure from
    attacker-controlled hosts.


    ### Flow Description

    1. Extracts target IP addresses from the action parameters and the case's `ADDRESS`
    entities, filtering out any private, reserved, or internal IP addresses.

    2. Iterates over the collected public IP addresses and makes a GET request to
    the ELLIO API (`/v1/cbs/lookup`) for each IP.

    3. Retrieves the Common Business Services classification data, including provider,
    type, service, region, and matched CIDR.

    4. Enriches the corresponding IP entities in the SecOps platform with the retrieved
    data.

    5. Optionally creates and attaches an insight card to the enriched entities displaying
    the provider hierarchy and alert flow context.

    6. Updates the entities in the platform and returns a JSON result containing the
    lookup details.


    ### Additional Notes

    Only public (external) IPs are checked; private, reserved, loopback, and SOAR-internal
    addresses are automatically skipped.
  ai_short_description: >-
    Classifies IP Address entities against ELLIO Common Business Services to identify
    known provider infrastructure, enriching the entities with provider context and
    generating insight cards.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
