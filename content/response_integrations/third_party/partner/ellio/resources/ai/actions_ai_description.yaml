Enrich IP:
  ai_description: >-
    ### General Description

    Enriches IP Address entities with ELLIO threat-intelligence context. This action
    retrieves detailed information such as classification, detection tags, exploited
    CVEs, fingerprints (MuonFP/JA3/JA4), ports, rDNS, country, and first/last seen
    dates. It helps analysts differentiate between malicious, scanner, and benign
    IPs to prioritize cases accordingly.


    ### Flow Description

    1. Extracts the action parameters, including optional comma-separated IPs and
    the option to create an insight.

    2. Collects target IP addresses from the case's Address entities and the provided
    parameters, skipping any private, reserved, or internal IPs.

    3. Iterates over the collected public IPs and makes a GET request to the ELLIO
    API (`/v1/cti/extended_lookup/{ip}`) to fetch threat intelligence data.

    4. Enriches the corresponding entities with the retrieved data, marking them as
    enriched.

    5. If an IP is classified as "malicious" or "promiscuous", the entity is marked
    as suspicious.

    6. If the `Create Insight` parameter is enabled, generates and attaches an ELLIO
    threat-intelligence insight card to the entity.

    7. Updates the entities within the SecOps platform.

    8. Returns a recommended case priority (e.g., "High" for malicious IPs) as a script
    result and provides the raw lookup data as a JSON result.


    ### Additional Notes

    The action only recommends a case priority and does not change the case priority
    itself. A playbook can use the recommended priority to apply changes via a built-in
    action.
  ai_short_description: >-
    Enriches IP Address entities with ELLIO threat-intelligence context, retrieving
    classification, detection tags, CVEs, and fingerprints to help analysts prioritize
    cases.
