Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the ELLIO API to ensure the integration is configured correctly.


    ### Flow Description

    1. Retrieves the API Root and API Key from the integration configuration.

    2. Initializes the ELLIO API client.

    3. Makes a GET request to the ELLIO API (`/v1/cti/lookup/192.0.2.1`) to verify
    authentication and connectivity.

    4. Returns a successful result if the connection is established, or fails the
    action if an error occurs.


    ### Additional Notes

    This is a mandatory action used to validate the integration configuration.
