Add IP to Blocklist:
  ai_description: >-
    ### General Description

    Adds IP addresses to the ELLIO Blocklist Automation ruleset. It processes IP Address
    entities from the case and optional comma-separated IPs provided as input. It
    skips private, reserved, and SOAR-internal addresses. The action makes a POST
    request to the ELLIO API to distribute the IPs to enforcement points for blocking.


    ### Flow Description

    1. Retrieves configuration and action parameters.

    2. Collects target IPs from the case's IP Address entities and the `IP Addresses`
    parameter, filtering out internal and non-public IPs.

    3. Constructs a rule name based on the case context or the provided `Rule Name`
    parameter.

    4. Iterates over the target IPs and makes a POST request to the ELLIO API (`/v1/edl/ip-rulesets/{ruleset_id}/rules`)
    to add each IP to the blocklist.

    5. Returns a JSON result containing the status of each IP (added, failed, or skipped).


    ### Additional Notes

    Requires a read-write ELLIO API key and a configured Blocklist Ruleset ID.
  ai_short_description: >-
    Adds specified IP addresses and IP Address entities to the ELLIO Blocklist Automation
    ruleset to block them across enforcement points.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds IP addresses to the ELLIO Blocklist Automation ruleset via a POST request.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the ELLIO API to add IP addresses to a blocklist,
      mutating external data. It does not fetch enrichment data, update internal entities,
      create insights, or modify alert data.
