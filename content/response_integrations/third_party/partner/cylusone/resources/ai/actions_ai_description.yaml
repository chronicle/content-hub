EnrichAssetInformation:
  ai_description: >-
    ### General Description

    Enriches IP address entities by retrieving associated asset information from the
    Cylus API. This action fetches contextual metadata for the specified IP addresses
    and appends it to the entity's properties within the SecOps platform.


    ### Flow Description

    1. Initializes the Cylus API client using the provided integration configuration.

    2. Iterates through the target entities, filtering for those of type IP Address.

    3. Validates the format of each IP address to ensure it is a valid IPv4 address.

    4. Makes a GET request to the Cylus API (`/rest/v1/assets/by-ip?ip={ip}`) to fetch
    asset details for the IP.

    5. Parses the returned asset data, flattening properties and formatting lists.

    6. Updates the entity's `additional_properties` with the enriched data and marks
    the entity as enriched.

    7. Calls the SecOps platform to save the updated entities.

    8. Returns a summary message and a JSON object containing the enrichment results
    or errors for each processed entity.


    ### Additional Notes

    - The action only processes valid IPv4 addresses.

    - Entities that are not of type IP Address are skipped.
  ai_short_description: >-
    Enriches IP address entities by retrieving associated asset information from the
    Cylus API and updating the entity properties in the SecOps platform.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Cylus API to fetch asset data (fetches_data=true).
      It does not mutate external data. It updates the entities in the SecOps platform
      with the fetched data using `siemplify.update_entities` (can_update_entities=true).
      It does not create insights, modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: false
      generic: false
      host_name: false
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action iterates over `siemplify.target_entities` and explicitly checks `if
      entity.entity_type != EntityTypes.ADDRESS:` to filter out non-IP address entities.
      Therefore, it targets Address entities and filters by entity type.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: true
    enrich_ioc: false
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action fetches asset information (contextual metadata) for an IP address
      from the Cylus API. This aligns with the 'Enrich Asset' expected outcome. It
      does not fetch threat intelligence, so it is not 'Enrich IOC'. It does not mutate
      external state or perform other actions.
