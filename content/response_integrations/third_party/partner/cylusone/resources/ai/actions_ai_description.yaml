Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the CylusOne platform to ensure the integration is configured
    correctly and credentials are valid.


    ### Flow Description

    1. Extracts integration configuration parameters (Base URL, API Key, Verify SSL).

    2. Initializes the API manager with the provided credentials.

    3. Makes a test GET request to the `/rest/v1/assets/by-ip` endpoint using a dummy
    IP address (`10.0.0.5`).

    4. Evaluates the HTTP response status code to determine if the connection and
    authentication were successful.

    5. Returns a success or failure message based on the result.


    ### Additional Notes

    This is a standard ping action used primarily during integration setup and troubleshooting.
    It does not process alerts, entities, or modify any data.
  ai_short_description: >-
    Tests connectivity to the CylusOne platform by making a test API request to verify
