Create Custom List:
  ai_description: >-
    ### General Description

    Creates a new custom list in the Infoblox Threat Defense platform. This action
    allows users to define a named collection of indicators (such as IPv4 addresses,
    IPv6 addresses, or domain names) that can be utilized within security policies
    for filtering or threat management.


    ### Flow Description

    1. Extracts the action parameters: Name, Type, Items, Description, Confidence
    Level, Threat Level, and Tags.

    2. Validates the provided parameters and indicators to ensure they match expected
    network patterns.

    3. Constructs a JSON payload with the provided list metadata and items.

    4. Makes a POST request to the Infoblox API (`/api/atcfw/v1/named_lists`) to create
    the custom list.

    5. Returns the raw JSON response and populates a 'Custom List Details' data table
    in the Google SecOps interface.


    ### Additional Notes

    - The Items parameter must contain valid IPv4, IPv6, or domain name formats; otherwise,
    the action will fail during validation.

    - The Tags parameter must be a valid JSON object string (e.g., `{"key": "value"}`).
  ai_short_description: >-
    Creates a new custom list in the Infoblox Threat Defense platform for use in security
    policies.
