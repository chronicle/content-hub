Ping:
  ai_description: >-
    ### General Description

    Verifies connectivity to the Infoblox Threat Defense with DDI server by performing
    a test API call. This action is primarily used to validate that the integration's
    configuration parameters, such as the API Root and API Key, are correct and that
    the Google SecOps environment can successfully communicate with the Infoblox API.


    ### Flow Description

    1. **Parameter Initialization**: The action retrieves the global configuration
    parameters: API Root, API Key, and SSL verification status.

    2. **API Manager Setup**: It initializes the API manager with the provided credentials
    and connection settings.

    3. **Connectivity Test**: The action executes a connectivity test, which sends
    a GET request to the `/api/authn/v1/account` endpoint.

    4. **Status Evaluation**: If the API call is successful, the action returns a
    success message and sets the execution state to completed. If an exception occurs
    (e.g., authentication failure or connection timeout), the action logs the error,
    returns a failure message, and sets the execution state to failed.


    ### Additional Notes

    As a standard 'Ping' action, it does not process entities or modify any data within
    the SOAR platform or the external Infoblox system.
