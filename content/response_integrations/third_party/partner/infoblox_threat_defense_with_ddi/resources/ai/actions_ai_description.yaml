  ai_description: >-
    ### General Description

    Tests connectivity to the Infoblox Threat Defense with DDI server. This action
    verifies that the integration is configured correctly and can successfully authenticate
    and communicate with the Infoblox API.


    ### Flow Description

    1. Retrieves the integration-level configuration parameters (API Root, API Key,
    Verify SSL).

    2. Initializes the API manager with the provided credentials.

    3. Executes a connectivity test by making a GET request to the `/api/authn/v1/account`
    endpoint.

    4. Returns a success message and a boolean `True` if the connection is established,
    or an error message and `False` if it fails.


