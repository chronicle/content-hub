"Initiate Indicator Intel Lookup With Dossier":
  ai_description: >-
    ### General Description

    Initiates an indicator investigation using Infoblox Dossier for various indicator
    types including IP, Host, URL, Email, and Hash. The action queries the Infoblox
    Threat Defense API to retrieve threat intelligence and reputation data, and can
    either wait for the lookup to complete or return a job ID for asynchronous tracking.


    ### Flow Description

    1. Extracts the `Indicator Type`, `Indicator Value`, `Source`, and `Wait for Results`
    parameters.

    2. Makes a GET request to the Infoblox Dossier API (`/tide/api/services/intel/lookup/indicator/{type}`)
    to initiate the lookup for the specified indicator.

    3. If `Wait for Results` is true, the action waits for the API to return the completed
    dossier results and formats them into a summary table.

    4. If `Wait for Results` is false, the action immediately returns the generated
    Job ID and its current status.

    5. Attaches the raw JSON response and the constructed data table to the action
    results.


    ### Additional Notes

    When `Wait for Results` is set to false, the returned Job ID can be used in subsequent
    actions to retrieve the final lookup results.
