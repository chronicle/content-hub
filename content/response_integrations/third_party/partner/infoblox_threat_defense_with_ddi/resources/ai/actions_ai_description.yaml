DNS Record Lookup:
  ai_description: >-
    ### General Description

    Performs a DNS record query in Infoblox Threat Defense with DDI to retrieve associated
    IPs or domains based on specified criteria. This action allows analysts to search
    for specific DNS configurations or records using custom filters and tags.


    ### Flow Description

    1. Extracts the provided action parameters including `DNS Record Filter`, `Tag
    Filter`, `Offset`, `Limit`, and `Order By`.

    2. Validates the pagination parameters (`Offset` and `Limit`) to ensure they are
    valid integers.

    3. Makes a GET request to the Infoblox API (`/api/ddi/v1/dns/record`) using the
    provided filters and pagination settings.

    4. Parses the API response to extract the matching DNS records.

    5. Constructs a CSV-formatted data table containing up to the maximum allowed
    records for display.

    6. Returns the raw JSON response and attaches the data table to the action result.


    ### Additional Notes

    - The action supports pagination through the `Offset` and `Limit` parameters.

    - Sorting can be applied using the `Order By` parameter, which supports dot notation
    for nested fields and direction indicators (asc/desc).
