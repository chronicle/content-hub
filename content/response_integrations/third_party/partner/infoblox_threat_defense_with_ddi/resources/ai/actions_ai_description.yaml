Create Custom List:
  ai_description: >-
    ### General Description

    Creates a new custom list in Infoblox Threat Defense with DDI for use in security
    policies.


    ### Flow Description

    1. Extracts action parameters including Name, Type, Items, Description, Confidence
    Level, Threat Level, and Tags.

    2. Validates the required parameters and the format of the provided items (ensuring
    they are valid IPv4, IPv6, or domain names).

    3. Makes a POST request to the Infoblox API (`/api/atcfw/v1/named_lists`) to create
    the custom list with the specified details.

    4. Returns the created custom list details as a JSON result and populates a data
    table with the results.


    ### Additional Notes

    The items provided in the 'Items' parameter must be valid IPv4, IPv6, or domain
    names. Tags must be provided as a valid JSON object string.
