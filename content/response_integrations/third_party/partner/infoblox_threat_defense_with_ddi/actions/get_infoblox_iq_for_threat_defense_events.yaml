name: Get Infoblox IQ for Threat Defense Events
description: ''
integration_identifier: InfobloxThreatDefenseWithDDI
parameters:
-   name: Insight ID
    default_value: ''
    type: string
    description: ID of the Infoblox IQ for Threat Defense insight to retrieve events
        from.
    is_mandatory: true
-   name: Query
    default_value: ''
    type: string
    description: Filter by query string.
    is_mandatory: false
-   name: Indicator
    default_value: ''
    type: string
    description: Filter events by a specific threat indicator such as a domain, IP,
        or hash (e.g., hmdns.top).
    is_mandatory: false
-   name: Threat Level
    default_value: ''
    type: ddl
    optional_values:
    - Low
    - Medium
    - High
    description: Filter by Threat Level.
    is_mandatory: false
-   name: Threat Confidence
    default_value: ''
    type: ddl
    optional_values:
    - Low
    - Medium
    - High
    description: ' Filter by confidence level.'
    is_mandatory: false
-   name: tClass
    default_value: ''
    type: string
    description: Filter by threat class category (e.g., Malware, Phishing, C2, Data
        Exfiltration).
    is_mandatory: false
-   name: Detected From
    default_value: ''
    type: string
    description: Start of the detection time range filter (inclusive). Use RFC 3339
        format, e.g., 2025-12-01T00:00:00Z.
    is_mandatory: false
-   name: Detected To
    default_value: ''
    type: string
    description: End of the detection time range filter (inclusive). Use RFC 3339
        format, e.g., 2025-12-31T23:59:59Z.
    is_mandatory: false
-   name: Device IP
    default_value: ''
    type: string
    description: Device IP address(es) to filter by. Multiple IP addresses may be  queried
        by specifying comma-separated values.
    is_mandatory: false
-   name: Device Name
    default_value: ''
    type: string
    description: Filter by the name of the device that generated the event.
    is_mandatory: false
-   name: User
    default_value: ''
    type: string
    description: User(s) to filter by. Multiple users may be queried by specifying
        comma-separated values.
    is_mandatory: false
-   name: Source
    default_value: ''
    type: string
    description: Filter by the network source identifier where the DNS query originated.
    is_mandatory: false
-   name: Limit
    default_value: '100'
    type: string
    description: Specify the maximum number of results to return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_infoblox_iq_for_threat_defense_events_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: 04eb5437-47a9-4ad4-a1af-0ab16d4d3bc2
script_result_name: ScriptResult
