name: Get Infoblox IQ for Threat Defense Indicators
description: ''
integration_identifier: InfobloxThreatDefenseWithDDI
parameters:
-   name: Insight ID
    default_value: ''
    type: string
    description: ID of the Infoblox IQ for Threat Defense insight to retrieve indicators
        from.
    is_mandatory: true
-   name: Threat Level
    default_value: ''
    type: string
    description: Filter indicators by threat level (numeric value indicating severity).
    is_mandatory: false
-   name: Indicator
    default_value: ''
    type: string
    description: Filter by specific indicator value.
    is_mandatory: false
-   name: Status
    default_value: ''
    type: string
    description: Filter by indicator blocking status. Multiple values may be specified
        as comma-separated (e.g., "Blocked,Not Blocked").
    is_mandatory: false
-   name: Users
    default_value: ''
    type: string
    description: User(s) to filter by. Multiple users may be specified as comma-separated
        values (e.g., "user1,user2,user3").
    is_mandatory: false
-   name: Detected At
    default_value: ''
    type: string
    description: Filter indicators by detection timestamp. Provide an RFC 3339 date-time
        value to return only indicators detected on or after this time.
    is_mandatory: false
-   name: Limit
    default_value: '100'
    type: string
    description: Specify the maximum number of results to return
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_infoblox_iq_for_threat_defense_indicators_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: 04eb5437-47a9-4ad4-a1af-0ab16d4d3bc2
script_result_name: ScriptResult
