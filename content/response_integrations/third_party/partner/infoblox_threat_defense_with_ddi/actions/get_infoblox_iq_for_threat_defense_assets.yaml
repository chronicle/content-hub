name: Get Infoblox IQ for Threat Defense Assets
description: ''
integration_identifier: InfobloxThreatDefenseWithDDI
parameters:
-   name: Insight ID
    default_value: ''
    type: string
    description: Specify the ID of the Infoblox IQ for Threat Defense insight to  retrieve
        assets from.
    is_mandatory: true
-   name: IP Address
    default_value: ''
    type: string
    description: IP address(es) to filter by. Multiple IP addresses may be queried
        by specifying comma-separated values.
    is_mandatory: false
-   name: Users
    default_value: ''
    type: string
    description: Filter assets by associated user.
    is_mandatory: false
-   name: Is Verified
    default_value: All
    type: ddl
    optional_values:
    - All
    - 'Yes'
    - 'No'
    description: Filter by asset verification state. Set to true to return only verified
        assets, or false for unverified assets only. Omit to return both.
    is_mandatory: false
-   name: Limit
    default_value: '100'
    type: string
    description: Specify the maximum number of results to return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_infoblox_iq_for_threat_defense_assets_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: 04eb5437-47a9-4ad4-a1af-0ab16d4d3bc2
script_result_name: ScriptResult
