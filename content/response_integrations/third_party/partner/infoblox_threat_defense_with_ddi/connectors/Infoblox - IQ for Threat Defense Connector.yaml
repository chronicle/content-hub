name: Infoblox - IQ for Threat Defense Connector
parameters:
-   name: API Root
    default_value: https://csp.infoblox.com/
    type: string
    description: The base URL of the API, used as the entry point for all API requests.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Key
    default_value: ''
    type: password
    description: A unique identifier used to authenticate and authorize access to
        the API.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Verify SSL
    default_value: 'true'
    type: boolean
    description: Enable/disable SSL certificate verification for API requests.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Status
    type: string
    description: Filter Insights by their current status (Needs Review, In Progress,
        Resolved, Reopened, Accepted Risk, False Positive).
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Threat Property
    default_value: ''
    type: string
    description: Multiple properties may be queried by specifying comma-separated
        values.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Severity
    type: string
    description: Filter Insights by severity level (Critical, High, Medium, Low).
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Start Date
    type: string
    description: Filter by the insight creation timestamp. Provide an RFC 3339 date-time
        value (e.g., 2025-12-19T07:01:56Z).
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: DeviceProductField
    default_value: Infoblox Threat Defense with DDI
    type: string
    description: The field name used to determine the device product
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: name
    type: string
    description: The field name used to determine the event name (sub-type)
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '30'
    type: string
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: false
    mode: regular
description: ' Retrieve all Infoblox IQ for TD insights from the Infoblox platform
    for investigation, enrichment, or further automated response.'
integration: InfobloxThreatDefenseWithDDI
documentation_link: https://docs.infoblox.com/space/DeploymentGuideTDDDI4GoogleSecOpsSOAR/1570111546/Introduction
rules: []
is_connector_rules_supported: false
creator: 04eb5437-47a9-4ad4-a1af-0ab16d4d3bc2
