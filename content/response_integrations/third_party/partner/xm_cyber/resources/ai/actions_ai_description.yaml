Calculate Risk Score:
  ai_description: >-
    ### General Description

    Calculates risk scores for User and Hostname entities based on XM Cyber enrichment
    fields present in the alert's events and entities. It generates a structured JSON
    object containing the aggregated risk scores, which can be used by playbooks for
    filtering and decision-making.


    ### Flow Description

    1. Retrieves the current alert's security events and target entities.

    2. Filters the target entities to include only User and Hostname types.

    3. Extracts action parameters that define the weights for various risk factors
    (e.g., AD Risk to Domain, Is Critical Asset, User without MFA).

    4. Iterates through the security events and entities, extracting XM Cyber labels
    and identifiers from their `additional_properties`.

    5. Calculates a risk score for each valid entity based on the configured parameter
    weights and the extracted labels.

    6. Aggregates the calculated scores and properties into a structured JSON object.

    7. Attaches the final JSON object to the action's result (`siemplify.result.add_result_json`)
    for downstream playbook use.


    ### Additional Notes

    This action does not make any external API calls. It relies entirely on XM Cyber
    enrichment data that has already been fetched and stored in the `additional_properties`
    of the alert's events and entities.
  ai_short_description: >-
    Calculates risk scores for User and Hostname entities based on existing XM Cyber
    enrichment data and outputs a structured JSON object for playbook filtering.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
