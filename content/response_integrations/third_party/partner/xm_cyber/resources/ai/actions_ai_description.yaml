Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and User entities using the XM Cyber platform. It retrieves
    contextual metadata and labels associated with the entities to provide better
    visibility into their security posture.


    ### Flow Description

    1. Filters the target entities to include only Hostname and User types.

    2. Checks if the entities have already been enriched within the last 24 hours
    (via `additional_properties`) or are already present in the event data to avoid
    redundant API calls.

    3. Makes a GET request to the XM Cyber API (`/api/secopsPublisher/entities`) to
    fetch enrichment data for the filtered entities.

    4. Processes the API response to extract relevant labels and metadata.

    5. Updates the entities in Google SecOps with the retrieved data (prefixed with
    `XMC_`) and marks them as enriched.


    ### Additional Notes

    The action skips entities that were enriched in the last 24 hours to optimize
    API usage.
