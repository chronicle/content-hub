Push Breach Point Data:
  ai_description: >-
    ### General Description

    This action evaluates User and Hostname entities against specified criteria and
    pushes a breach point label to the matching entities in XM Cyber.


    ### Flow Description

    1. Extracts the action parameters, including the attribute name, parameter to
    check, operator, and target value.

    2. Iterates through the alert's security events and target entities (specifically
    filtering for User and Hostname types).

    3. Evaluates each entity's additional properties (such as `XMC_product_object_id`)
    against the defined criteria.

    4. Makes a POST request to the XM Cyber API (`/api/entityInventory/applyImportedLabelsOnEntities`)
    to apply the specified breach point label to all matching entities.

    5. Returns a success message listing the entity IDs that were successfully updated
    in XM Cyber.


    ### Additional Notes

    This action relies on entities having specific additional properties populated
    (e.g., `XMC_product_object_id`), which are typically added by a preceding enrichment
    action. If the 'Parameter' input is set to 'All', the criteria check is bypassed
    and the label is pushed to all valid entities.
