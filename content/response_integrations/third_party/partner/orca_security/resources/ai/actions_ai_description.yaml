Get Asset Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about specific assets from Orca Security using
    their Asset IDs. The action can optionally fetch related vulnerabilities for each
    asset and create case insights with the retrieved data.


    ### Flow Description

    1. Parses the provided comma-separated list of Asset IDs.

    2. Iterates through each Asset ID and queries the Orca Security API to fetch the
    asset's details.

    3. If the `Return Vulnerabilities Information` parameter is enabled, it fetches
    vulnerabilities related to the asset, filtered by the specified lowest severity
    and maximum limit.

    4. Aggregates the retrieved asset and vulnerability data into JSON and CSV formats.

    5. If the `Create Insight` parameter is enabled, generates a case insight for
    each successfully enriched asset.

    6. Returns the aggregated data to the SOAR platform.


    ### Additional Notes

    Ensure that the provided Asset IDs are valid within the Orca Security environment.
    The action will report any assets that failed to be enriched.
