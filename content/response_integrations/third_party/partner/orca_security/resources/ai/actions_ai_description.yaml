      Security.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by making PUT requests to Orca Security to
      update the alert's status, snooze state, or verification status. It also fetches
      data by retrieving the updated alert details. It does not mutate internal SecOps
      data, update entities, create insights, modify SecOps alert data, or create
      case comments.
