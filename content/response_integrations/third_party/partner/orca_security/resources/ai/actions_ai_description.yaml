  ai_description: >-
    ### General Description

    Initiates a security scan for specified assets in Orca Security and asynchronously
    monitors the scan status until completion.


    ### Flow Description

    1. Extracts the provided Asset IDs from the action parameters.

    2. Initiates a scan for each asset by making a POST request to the Orca Security
    API (`/api/scan/asset/{asset_id}`).

    3. Asynchronously polls the scan status for each asset by making GET requests
    to the Orca Security API (`/api/scan/status/{scan_id}`).

    4. Once scans are completed, retrieves the scan results and adds them to the action's
    JSON result.


    ### Additional Notes

    The action runs asynchronously. Ensure the script timeout value in the IDE is
    adjusted as needed to accommodate long-running scans.
