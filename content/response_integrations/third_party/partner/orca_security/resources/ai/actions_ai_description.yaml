Update Alert:
  ai_description: >-
    ### General Description

    Updates an alert in Orca Security. It can initiate the verification process, change
    the snooze state (snooze or unsnooze), and update the status of the alert.


    ### Flow Description

    1. Extracts the `Alert ID` and other configuration parameters.

    2. Validates that at least one update action (Verify, Snooze, or Status change)
    is requested.

    3. If requested, initiates the verification process for the alert via the Orca
    Security API.

    4. If requested, snoozes or unsnoozes the alert for the specified number of days.

    5. If requested, updates the status of the alert (e.g., Open, In Progress, Close,
    Dismiss).

    6. Retrieves the updated alert data from Orca Security and attaches it to the
    action results as JSON.


    ### Additional Notes

    The action requires at least one of the following parameters to be provided: "Status",
    "Verify Alert", or "Snooze State". If "Snooze State" is set to "Snooze", "Snooze
    Days" must be provided.
  ai_short_description: >-
    Updates the status, snooze state, or verification status of a specific alert in
    Orca Security and retrieves the updated alert details.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
