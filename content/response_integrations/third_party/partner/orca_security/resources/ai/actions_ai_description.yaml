  ai_description: >-
    ### General Description

    Retrieves compliance information based on selected frameworks from Orca Security.


    ### Flow Description

    1. Initializes the Orca Security API client.

    2. Makes a POST request to the `/api/serving-layer/compliance/frameworks/overview`
    endpoint to fetch compliance framework data.

    3. Filters the retrieved frameworks based on the provided `Framework Names` and
    limits the results to `Max Frameworks To Return`.

    4. If `Create Insight` is enabled, generates a case insight containing the compliance
    information.

    5. Attaches the compliance details as a data table and JSON result to the action
    output.


