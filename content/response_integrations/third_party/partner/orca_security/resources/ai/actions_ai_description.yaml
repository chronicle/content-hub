Add Comment To Alert:
  ai_description: >-
    ### General Description

    Adds a comment to a specific alert in Orca Security.


    ### Flow Description

    1. Extracts the `Alert ID` and `Comment` from the action parameters.

    2. Initializes the Orca Security API client using the provided integration configuration.

    3. Makes a PUT request to the Orca Security API (`/api/alerts/{alert_id}/comment`)
    to append the specified comment to the alert.

    4. Returns the JSON response of the created comment and outputs a success message.


    ### Additional Notes

    Ensure that the provided Alert ID is valid and accessible by the configured API
    credentials in Orca Security.
  ai_short_description: >-
    Adds a comment to a specific alert in Orca Security.
