URL-Approve:
  ai_description: >-
    ### General Description

    Approves Digital Risk Protection (DRP) violation URLs in Group-IB that match the
    target entities of the action. This action initiates a state change on the external
    Group-IB platform to confirm or approve a violation associated with specific URLs.


    ### Flow Description

    1. Retrieves the target entities provided to the action.

    2. Iterates over the security events of the current alert to build a mapping of
    URLs to their corresponding violation UIDs (extracted from `additional_properties`).

    3. Filters the target entities to process only those of type `DestinationURL`.

    4. For each matching URL entity, retrieves its violation UID from the previously
    built mapping.

    5. Sends a POST request to the Group-IB DRP API (`violation/change-approve`) with
    the violation UID to approve the violation.

    6. Aggregates the results (approved, failed, unmapped) and outputs a summary message.


    ### Additional Notes

    Failures of individual entities do not immediately abort the action; they are
    aggregated into the final output message. The action exits with a failed state
    only if at least one entity could not be approved.
  ai_short_description: >-
    Approves Digital Risk Protection (DRP) violation URLs in Group-IB by sending an
    approval request to the DRP API for matching DestinationURL entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Sends a POST request to the Group-IB DRP API to approve a violation associated
      with the URL entity.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action sends a POST request to the Group-IB DRP API to approve a violation,
