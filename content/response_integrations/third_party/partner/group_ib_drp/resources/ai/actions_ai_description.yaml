Ping:
  ai_description: >-
    ### General Description

    Verifies connectivity to the Group-IB DRP API.


    ### Flow Description

    1. Initializes the Siemplify action.

    2. Retrieves integration configuration parameters (API login, API key, API URL,
    Verify SSL).

    3. Initializes the Group-IB DRP poller.

    4. Sends a test GET request to the `violation/list` endpoint to verify API access.

    5. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is typically used to test the integration configuration and does not
    process any entities or alerts.
