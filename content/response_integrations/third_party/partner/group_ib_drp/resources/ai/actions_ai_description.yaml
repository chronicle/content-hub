Get Violation Details:
  ai_description: >-
    ### General Description

    Fetches Group-IB DRP violation details for DestinationURL entities and creates
    case insights with the retrieved information.


    ### Flow Description

    1. Builds a mapping of URLs to violation UIDs from the current alert's security
    events.

    2. Iterates over target entities of type `DestinationURL`.

    3. Looks up the violation UID for each URL.

    4. Calls the Group-IB DRP API (`search_feed_by_id`) to fetch violation details.

    5. Creates a case insight with the fetched details.

    6. Returns the collected details as a JSON result.


    ### Additional Notes

    The action fails if an exception occurs during the fetch. If no UIDs are found
    or no results are fetched, it completes with `result_value=False`.
  ai_short_description: >-
    Fetches Group-IB DRP violation details for DestinationURL entities and creates
    case insights with the retrieved information.
