URL-Reject:
  ai_description: >-
    ### General Description

    Rejects Group-IB DRP violation URLs that match the target entities of the action.
    This action interacts with the Group-IB DRP API to update the approval state of
    specific violations associated with the alert.


    ### Flow Description

    1. Gathers target entities and filters them for the `DestinationURL` entity type.

    2. Parses the current alert's security events to build a mapping of URLs to their
    corresponding violation UIDs.

    3. Iterates over the filtered entities and matches their identifiers with the
    violation UIDs.

    4. Sends a POST request to the Group-IB DRP API (`violation/change-approve`) with
    `approve: False` to reject the violation for each matched entity.

    5. Aggregates the results (rejected, failed, or unmapped) and outputs a summary
    message.


    ### Additional Notes

    The action will exit with a failed execution state if at least one entity could
    not be successfully rejected via the API.
