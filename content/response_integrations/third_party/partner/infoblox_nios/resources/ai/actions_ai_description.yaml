Create RPZ CNAME Rule:
  ai_description: >-
    ### General Description

    Adds a CNAME rule to an existing Response Policy Zone (RPZ) in Infoblox NIOS to
    override DNS behavior. This action allows administrators to manage DNS resolution
    by creating rules that can block, passthru, or substitute domain names.


    ### Flow Description

    1. Extracts the provided parameters including the rule name, RP zone, rule type,
    and object type.

    2. Validates the required parameters and parses any provided additional JSON parameters.

    3. Determines the appropriate API endpoint and canonical name based on the selected
    rule type and object type.

    4. Makes a POST request to the Infoblox API to create the RPZ CNAME rule.

    5. Returns the created rule details as a JSON result and populates a data table
    with the rule information.


    ### Additional Notes

    The rule type can be configured to 'Block (No data)', 'Block (No such domain)',
    'Passthru', or 'Substitute (Domain name)'. If 'Substitute (Domain name)' is selected,
    the 'Substitute Name' parameter must be provided.
  ai_short_description: >-
