Create RPZ NAPTR Rule:
  ai_description: >-
    ### General Description

    Creates a new Response Policy Zone (RPZ) NAPTR rule in Infoblox NIOS to control
    DNS-based service discovery. This action initiates a state change on the external
    Infoblox server by adding a new NAPTR override record to the specified RP Zone.


    ### Flow Description

    1. Extracts and validates the action parameters, including the rule name, RP zone,
    order, preference, and replacement values.

    2. Makes a POST request to the Infoblox NIOS API (`/wapi/v2.13.1/record:rpz:naptr`)
    to create the new RPZ NAPTR rule.

    3. Retrieves the newly created rule data and attaches it to the action's JSON
    result.

    4. Constructs a CSV table with the rule details and adds it to the case wall.


    ### Additional Notes

    The 'Additional Parameters' input must be a valid JSON object if provided.
  ai_short_description: >-
    Creates a new Response Policy Zone (RPZ) NAPTR rule in Infoblox NIOS to control
    DNS-based service discovery.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
