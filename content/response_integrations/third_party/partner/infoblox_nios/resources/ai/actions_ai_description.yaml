Create Host Record:
  ai_description: >-
    ### General Description

    Creates a new host record in Infoblox with associated IPv4 and IPv6 addresses.
    When configured, it also creates corresponding A/AAAA and PTR DNS records. This
    action is useful for IPAM and DNS inventory management.


    ### Flow Description

    1. Extracts the provided parameters including the host name, IP addresses, view,
    and DNS configuration flag.

    2. Validates the required string and IP address object parameters.

    3. Makes a POST request to the Infoblox API to create the host record.

    4. Returns the created host record details as a JSON result and populates a data
    table.


    ### Additional Notes

    Ensure that the provided host name is in FQDN format and belongs to an existing
    DNS zone.
  ai_short_description: >-
    Creates a new host record in Infoblox with associated IP addresses and optional
    DNS records.
  capabilities:
