Create RPZ A Rule:
  ai_description: >-
    ### General Description

    Creates a Response Policy Zone (RPZ) A rule in Infoblox NIOS. This rule maps a
    domain name (A record) or an IPv4 address to a substitute IPv4 address, which
    is typically used for DNS redirection or blocking purposes.


    ### Flow Description

    1. Extracts the provided parameters including the object type, rule name, RP zone,
    and substitute IPv4 address.

    2. Validates the required parameters and ensures the format of the provided IPv4
    address is correct.

    3. Makes a POST request to the Infoblox API (`/wapi/v2.13.1/record:rpz:a` or `/wapi/v2.13.1/record:rpz:a:ipaddress`
    depending on the object type) to create the RPZ A rule.

    4. Returns the created rule details as a JSON result and populates a data table
    with the rule information.


    ### Additional Notes

    The action supports creating rules for both Domain Names and IP Addresses by specifying
    the `Object Type` parameter. Additional configuration can be passed via the `Additional
    Parameters` JSON object.
