Get Domain Information:
  ai_description: >-
    ### General Description

    Fetches domain information for Hostname entities using IPInfo. This action retrieves
    domain details from the IPInfo API, enriches the targeted entities with this data,
    and provides the results in both JSON format and entity tables.


    ### Flow Description

    1. Filters the target entities to include only Hostname entities.

    2. Iterates through the filtered entities and extracts the domain name from the
    entity identifier.

    3. Makes a GET request to the IPInfo API (`/domains/{domain_name}`) to fetch domain
    information.

    4. Enriches the entity's additional properties with the retrieved data and marks
    the entity as enriched.

    5. Attaches the domain information as an entity table and updates the entities
    in Google SecOps.

    6. Returns a JSON object containing the domain information for all successfully
    processed entities.


    ### Additional Notes

    - The action specifically targets Hostname entities.

    - Ensure that the IPInfo integration is properly configured with a valid API token.
  ai_short_description: >-
    Fetches domain information for Hostname entities using IPInfo and enriches the
    entities with the retrieved data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the IPInfo API to fetch domain information
      (fetches_data=true). It does not perform any state-changing operations on external
      systems (can_mutate_external_data=false). It updates the entities within Google
      SecOps by appending additional properties and marking them as enriched via `siemplify.update_entities`
      (can_update_entities=true). It does not create insights, modify alert data,
      or create case comments.
