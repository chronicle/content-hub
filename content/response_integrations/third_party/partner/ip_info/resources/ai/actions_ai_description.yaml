Get IP Information:
  ai_description: >-
    ### General Description

    Enriches IP Address entities by fetching detailed IP information from IPInfo.
    This action retrieves contextual data for IP addresses and updates the entities
    within the platform.


    ### Flow Description

    1. Extracts target entities from the case that are of type `ADDRESS`.

    2. Retrieves the configured `IPinfo Bundle` parameter to determine the API endpoint
    and response shape.

    3. Depending on the bundle, makes either individual GET requests (Legacy) or chunked
    POST requests (Batch) to the IPInfo API to retrieve IP data.

    4. Normalizes the response data and updates each successful entity's `additional_properties`.

    5. Marks the successfully processed entities as enriched (`is_enriched = True`).

    6. Attaches the results as entity tables and JSON results to the action.

    7. Calls `siemplify.update_entities` to save the changes to the entities within
    the Google SecOps platform.


    ### Additional Notes

    The batch endpoint allows querying up to 1000 IPs at once, improving performance
    for large sets of entities. Even though the batch endpoint uses a POST request,
    it is strictly used for querying data and does not mutate external state.
  ai_short_description: >-
    Enriches IP Address entities by fetching detailed IP information from IPInfo and
    updating the entities with the retrieved data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the additional_properties of Address entities and sets their is_enriched
      flag to True.
    reasoning: >-
      The action fetches IP data from the IPInfo API (either via GET for legacy or
      POST for batch, but both are for data retrieval). It does not mutate external
      data. It mutates internal data by updating entities with the fetched data via
      `siemplify.update_entities`.
