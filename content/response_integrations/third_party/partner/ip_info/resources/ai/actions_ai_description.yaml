Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity and validates the API token for the IPInfo integration.


    ### Flow Description

    1. Initializes the IPInfo integration using the configured API root and token.

    2. Makes a test API call (GET request) to a known IP address (8.8.8.8) to verify
    that the credentials are valid and the service is reachable.

    3. Returns a success message if the connection is established.


    ### Additional Notes

    This action is typically used for diagnostic purposes to ensure the integration
    is configured correctly.
