Does Path Exists:
  ai_description: >-
    ### General Description

    Checks if an attack path exists between multiple combinations of principals (start
    and end nodes) in BloodHound Enterprise. It extracts principal pairs from the
    provided event details JSON and queries the BloodHound Enterprise API for the
    shortest path between them.


    ### Flow Description

    1. Extracts the 'Event Details' parameter containing JSON pairs of 'FromPrincipal'
    and 'ToPrincipal'.

    2. Parses the event details to extract the valid principal pairs.

    3. Iterates through each pair and queries the BloodHound Enterprise API to check
    if a path exists between the start and end nodes.

    4. Consolidates the results and returns a JSON object containing the path information
    for each pair.


    ### Additional Notes

    The 'Event Details' parameter should be a string representation of a JSON array
    containing dictionaries with 'FromPrincipal' and 'ToPrincipal' keys.
  ai_short_description: >-
    Checks if an attack path exists between multiple combinations of principals in
    BloodHound Enterprise based on provided event details.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
