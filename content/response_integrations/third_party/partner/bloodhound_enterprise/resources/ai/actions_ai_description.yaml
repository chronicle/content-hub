Get Object Id:
  ai_description: >-
    ### General Description

    Fetches object IDs from BloodHound Enterprise based on a provided list of object
    names. This action queries the BloodHound Enterprise search API to retrieve the
    unique identifiers for the specified objects.


    ### Flow Description

    1. Extracts the 'Object Names' parameter, which is a comma-separated list of entity
    names.

    2. Initializes the BloodHound Enterprise manager with the provided integration
    credentials.

    3. Iterates through each provided object name, URL-encodes it, and makes a GET
    request to the BloodHound Enterprise search API (`/api/v2/search`).

    4. Collects the object IDs returned by the API.

    5. Consolidates the results and adds them to the action's JSON result.


    ### Additional Notes

    - The action will fail if the 'Object Names' parameter is empty or not provided.
