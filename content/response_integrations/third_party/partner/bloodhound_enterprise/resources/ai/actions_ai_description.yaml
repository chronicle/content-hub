Ping:
  ai_description: >-
    ### General Description

    Tests the connection to the BloodHound Enterprise server to ensure that the integration
    is configured correctly with valid credentials.


    ### Flow Description

    1. Extracts the integration configuration parameters: BloodHound Enterprise Server,
    Token ID, and Token Key.

    2. Initializes the BloodhoundManager with the provided credentials.

    3. Makes an API call to the BloodHound Enterprise test connection endpoint (`/api/v2/available-domains`)
    to verify connectivity and authentication.

    4. Returns a successful execution state if the connection is established, or a
    failed state if an error occurs or credentials are missing.


    ### Additional Notes

    This action does not require any input parameters and is primarily used for diagnostic
    purposes to validate the integration setup.
