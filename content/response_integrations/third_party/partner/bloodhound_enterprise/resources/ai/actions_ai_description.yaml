Fetch Assets:
  ai_description: >-
    ### General Description

    Fetches detailed asset information from BloodHound Enterprise based on provided
    object IDs. This action retrieves primary asset details and, for Azure object
    types, additional related entity counts.


    ### Flow Description

    1. Extracts the `Object IDs` parameter provided by the user.

    2. Initializes the BloodHoundManager to authenticate and communicate with the
    BloodHound Enterprise API.

    3. Iterates through the provided object IDs, processing one per execution cycle
    using asynchronous state management to prevent timeouts.

    4. Makes an API call to BloodHound Enterprise to search for the object ID and
    retrieve its primary asset details.

    5. If the object is identified as an Azure type, makes additional API calls to
    fetch related entity counts (e.g., descendents, inbound control).

    6. Aggregates the fetched asset information and attaches it to the action's JSON
    result.


    ### Additional Notes

    This action runs asynchronously to handle multiple object IDs efficiently. It
    does not operate on standard SOAR entities but relies strictly on the provided
    BloodHound Object IDs (SIDs or Azure object IDs).
