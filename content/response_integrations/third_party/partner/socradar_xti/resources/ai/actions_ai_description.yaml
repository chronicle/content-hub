    1. Extracts the target `Alarm ID` and the provided `User Emails` or `User IDs`
    from the action parameters.

    2. Parses the comma-separated user identifiers into lists.

    3. Makes a POST request to the SOCRadar API (`alarm/{alarm_id}/assignee`) with
    the provided user IDs and emails to update the alarm's assignees.

    4. Returns the JSON response from the API and completes the action.


