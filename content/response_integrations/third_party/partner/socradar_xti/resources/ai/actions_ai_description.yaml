Add Tag:
  ai_description: >-
    ### General Description

    Adds a specific tag to an existing alarm in SOCRadar. This action initiates a
    state change on the external SOCRadar platform by appending the provided tag to
    the specified alarm.


    ### Flow Description

    1. Extracts the `Alarm ID` and `Tag` from the action parameters.

    2. Initializes the SOCRadar API client with the provided integration configuration.

    3. Makes a GET request to the SOCRadar API to retrieve the current details of
    the alarm and checks if the tag already exists.

    4. If the tag is not present, makes a POST request to the SOCRadar API (`/alarm/tag`)
    to add the tag to the alarm.

    5. Returns the API response as a JSON result and completes the action.


    ### Additional Notes

    The action is idempotent; it will check the existing tags on the alarm and will
    not attempt to add the tag if it is already present.
