Change Alarm Status:
  ai_description: >-
    ### General Description

    Changes the status of a specific alarm in the SOCRadar platform. This action allows
    analysts to transition an alarm through its lifecycle (e.g., OPEN, RESOLVED, FALSE_POSITIVE)
    directly from the SOAR platform.


    ### Flow Description

    1. Extracts the target `Alarm ID`, the new `Status`, and optional parameters (`Comments`,
    `Email`, `Update Related Findings`) from the action inputs.

    2. Evaluates if `Update Related Findings` is requested; if so, it verifies that
    an `Email` is provided, as required by the SOCRadar API.

    3. Makes a POST request to the SOCRadar API (`alarms/status/change`) to update
    the status of the specified alarm.

    4. Attaches the API response to the action's JSON results and outputs a success
    or failure message.


    ### Additional Notes

    If the `Update Related Findings` parameter is set to true but no `Email` is provided,
    the action will automatically disable the related findings update to prevent an
    API error, and will log this adjustment.
