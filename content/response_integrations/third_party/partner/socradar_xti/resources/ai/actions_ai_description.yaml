Add Comment:
  ai_description: >-
    ### General Description

    Adds a comment to a specific alarm in SOCRadar. This action interacts with the
    SOCRadar API to append a user-provided comment to an existing alarm's timeline.


    ### Flow Description

    1. Extracts the `Alarm ID`, `Comment`, and `User Email` from the action parameters.

    2. Validates that the `User Email` is provided, as it is a strict requirement
    for the SOCRadar API.

    3. Makes a POST request to the SOCRadar API (`alarm/add/comment/v2`) to append
    the comment to the specified alarm.

    4. Returns the JSON response from the API and completes the action.


    ### Additional Notes

    The SOCRadar API explicitly requires a valid company user email to post a comment.
    If the email is missing or invalid, the action will fail.
  ai_short_description: >-
    Adds a comment to a specific alarm in SOCRadar using the provided user email.
