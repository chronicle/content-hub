Rapid Reputation:
  ai_description: >-
    ### General Description

    Performs a quick reputation lookup for a specific entity (IP, hostname, URL, or
    hash) using the SOCRadar Rapid Reputation API. It returns a risk score, severity
    level, whitelisting status, and threat intelligence sources associated with the
    entity.


    ### Flow Description

    1. Extracts the `Entity Value` and `Entity Type` from the action parameters.

    2. Validates that the provided `Entity Type` is one of the supported types (ip,
    hostname, url, hash).

    3. Makes a GET request to the SOCRadar `/threatfeed/rapid/reputation` API endpoint
    to fetch the reputation data for the entity.

    4. Calculates a severity label (CRITICAL, HIGH, MEDIUM, LOW) based on the returned
    risk score.

    5. Appends the reputation results, including the score and severity, to the action's
    JSON output.

    6. Completes the action with a summary message detailing the score, severity,
    whitelisting status, and the number of finding sources.


    ### Additional Notes

    Requires the Rapid Reputation API Key to be configured in the integration settings.
