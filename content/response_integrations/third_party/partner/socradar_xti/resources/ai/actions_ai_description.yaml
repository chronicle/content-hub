Remove Tag:
  ai_description: >-
    ### General Description

    Removes a specific tag from an existing alarm in SOCRadar.


    ### Flow Description

    1. Retrieves the `Alarm ID` and `Tag` from the action parameters.

    2. Fetches the current details of the specified SOCRadar alarm via a GET request
    to check existing tags.

    3. If the tag is present, sends a POST request to the SOCRadar API (`alarm/tag`)
    to remove the tag.

    4. Returns the success status of the operation to the SecOps platform.


    ### Additional Notes

    The action ensures idempotency by checking if the tag is actually present on the
    alarm before attempting to remove it. If the tag is not present, it will return
    a success message without making the modification request.
