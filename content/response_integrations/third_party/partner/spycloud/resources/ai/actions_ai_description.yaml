List Catalogs:
  ai_description: >-
    ### General Description

    Lists available breach catalogs in SpyCloud based on specified filter criteria
    and timeframes.


    ### Flow Description

    1. Extracts configuration and action parameters including filter logic, timeframes,
    and limits.

    2. Calculates the start and end timestamps based on the provided timeframe.

    3. Makes a GET request to the SpyCloud API to retrieve available catalogs.

    4. Applies exact match filtering if 'Equal' logic is selected.

    5. Limits the number of returned catalogs.

    6. Outputs the results as a JSON object and a data table in Google SecOps.


    ### Additional Notes

    The action does not operate on entities.
  ai_short_description: >-
    Lists available breach catalogs in SpyCloud based on specified filter criteria
    and timeframes.
  capabilities:
