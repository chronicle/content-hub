Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the SpyCloud platform using the provided integration configuration
    parameters.


    ### Flow Description

    1. Extracts the API Root, API Key, and Verify SSL settings from the integration
    configuration.

    2. Initializes the SpyCloudManager.

    3. Makes a GET request to the `/enterprise-v1/breach/catalog/1` endpoint to verify
    connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the SpyCloud API.
