    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the SpyCloud API to fetch catalog data (fetches_data=true).
      It does not mutate external data, nor does it update internal entities, create
      insights, modify alerts, or create case comments.
