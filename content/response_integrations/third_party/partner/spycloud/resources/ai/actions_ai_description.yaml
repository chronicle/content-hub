    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Filter Logic | Dropdown | No | Specify what filter logic should be applied.
    |

    | Filter Value | String | No | Specify what value should be used in the filter.
    If "Equal" is selected, action will try to find the exact match among results
    and if "Contains" is selected, action will try to find results that contain that
    substring. "Equal" works with "title" parameter, while "Contains" works with all
    values in response. If nothing is provided in this parameter, the filter will
    not be applied. |

    | Time Frame | Dropdown | Yes | Specify a time frame for the search. If "Custom"
    is selected, you also need to provide "Start Time". |

    | Start Time | String | No | Specify the start time for the search. This parameter
    is mandatory, if "Custom" is selected for the "Time Frame" parameter. Format:
    ISO 8601 |

    | End Time | String | No | Specify the end time for the search. Format: ISO 8601.
    If nothing is provided and "Custom" is selected for the "Time Frame" parameter
    then this parameter will use current time. |

    | Max Catalogs To Return | String | No | Specify how many catalogs to return.
    Default: 50. |
List Entity Breaches:
  ai_description: >-
    ### General Description

    Retrieves information about breaches related to specific entities (IP Address,
    Username, Email Address, Domain/URL) using SpyCloud. The action searches for breaches
    within a specified timeframe and optional catalog, enriches the entities with
    the findings, and returns the breach data as JSON results.


    ### Flow Description

    1. Extracts action parameters including Catalog Filter, Time Frame, and Max Breaches
    To Return.

    2. Filters target entities to include only Address, User, and URL types.

    3. If a Catalog Filter is provided, fetches catalogs from SpyCloud via a GET request
    to resolve the catalog ID.

    4. Iterates over the filtered entities, determining the appropriate breach type
    (ips, emails, usernames, domains).

    5. Makes a GET request to the SpyCloud API to fetch breaches for each entity.

    6. Enriches successful entities with breach indicators and updates them in the
    SecOps platform.

    7. Returns the breach data as JSON results.


    ### Additional Notes

    The action strips the domain part from URL entities for domain breach searches.
    If the 'Custom' time frame is selected, the 'Start Time' parameter must be provided.
  ai_short_description: >-
    Retrieves breach information for IP Address, User, and URL entities from SpyCloud
    and enriches the entities with the findings.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from SpyCloud via GET requests (fetches_data=true).
      It does not mutate external data. It updates internal entities with enrichment
      data (can_update_entities=true) but does not mutate other internal data. It
      does not create insights, modify alert data, or create case comments.
