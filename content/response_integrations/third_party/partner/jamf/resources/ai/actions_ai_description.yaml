Wipe Mobile Device:
  ai_description: >-
    ### General Description

    Remotely erases or wipes a managed mobile device using the Jamf Pro ERASE_DEVICE
    MDM command. This action initiates a state change on the external device to completely
    wipe its data, with support for various options including data plan preservation,
    proximity setup preferences, and return to service settings.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the Mobile
    Device ID and wipe options.

    2. Initializes the Jamf API client.

    3. Makes a GET request to the Jamf Pro API to retrieve the mobile device details
    and obtain its management ID.

    4. Makes a POST request to the Jamf Pro API (`/api/v2/mdm/commands`) to send the
    `ERASE_DEVICE` MDM command to the specified device.

    5. Returns a JSON result containing the command execution details and status.


    ### Additional Notes

    - If 'Return to Service' is enabled, at least one of 'MDM Profile Data' or 'WiFi
    Profile Data' must be provided.

    - The action requires Jamf Pro API credentials with permissions to read mobile
    device details and send MDM commands.
  ai_short_description: >-
    Remotely erases or wipes a managed mobile device using the Jamf Pro ERASE_DEVICE
    MDM command.
