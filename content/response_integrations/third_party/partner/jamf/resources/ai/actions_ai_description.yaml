Assign to Group:
  ai_description: >-
    ### General Description

    Assigns computers to a specific computer group in Jamf Pro. This action allows
    administrators to add devices to a group using various identifiers such as computer
    IDs, names, or serial numbers, supporting bulk operations via comma-separated
    lists.


    ### Flow Description

    1. Extracts the provided `Group ID` and computer identifiers (`Computer IDs`,
    `Computer Names`, or `Computer Serial Numbers`).

    2. Validates that at least one identifier type is provided and parses the comma-separated
    lists into individual items.

    3. Initializes the `JamfManager` to interact with the Jamf Pro API.

    4. Makes a PUT request to the Jamf Pro Classic API (`/JSSResource/computergroups/id/{id}`)
    with an XML payload to add the specified computers to the group.

    5. Returns a summary message detailing the number of computers processed and attaches
    the API response as a JSON result.


    ### Additional Notes

    Computer names are not required to be unique in Jamf; the API will act on the
    first matching record found. Using Computer IDs or Serial Numbers is highly recommended
    for reliable identification. At least one type of identifier must be provided
    for the action to execute successfully.
  ai_short_description: >-
    Assigns computers to a specific computer group in Jamf Pro using computer IDs,
    names, or serial numbers.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds specified computers to a computer group in Jamf Pro.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PUT request to the Jamf Pro API to add computers to a computer
      group, which mutates external data. It does not fetch contextual data, update
      internal entities, create insights, or modify alert data.
