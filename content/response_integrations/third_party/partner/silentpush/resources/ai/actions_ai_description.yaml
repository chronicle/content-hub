Add Feed:
  ai_description: >-
    ### General Description

    Adds a new feed to the Silent Push platform. This action initiates a state change
    on the external service by creating a new feed entry with the provided details.


    ### Flow Description

    1. Extracts the action parameters including Name, Type, Category, Vendor, Feed
    Description, and Tags.

    2. Initializes the `SilentPushManager` with the integration configuration.

    3. Makes a POST request to the Silent Push API (`/api/v1/feeds/`) to create the
    new feed.

    4. Iterates over the target entities in the case and prints their identifiers
    to the standard output.

    5. Returns the result of the feed creation operation.


    ### Additional Notes

    Although the action iterates over all target entities in the case, it only prints
    their identifiers and does not use them as inputs for the API request.
  ai_short_description: >-
    Adds a new feed to the Silent Push platform.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a new feed to the Silent Push platform.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Silent Push API to add a new feed, which
      mutates external data. It does not fetch contextual data, mutate internal data,
      update entities, create insights, modify alert data, or create case comments.
