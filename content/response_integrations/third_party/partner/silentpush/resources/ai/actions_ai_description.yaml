Density Lookup:
  ai_description: >-
    ### General Description

    This action queries granular DNS/IP parameters (e.g., NS servers, MX servers,
    IP addresses, ASNs) for density information using Silent Push.


    ### Flow Description

    1. Extracts the `Qtype`, `Query`, and `Scope` parameters provided by the user.

    2. Initiates a GET request to the Silent Push API (`explore/padns/lookup/density`)
    to retrieve density records for the specified query.

    3. Evaluates the API response to determine if any density records were found.

    4. Returns the retrieved records in the output message and completes the action
    execution.


    ### Additional Notes

