Forward Padns Lookup:
  ai_description: >-
    ### General Description

    Performs a forward Passive DNS (PADNS) lookup using the Silent Push integration
    to retrieve DNS records based on a specified query type and name. This action
    allows users to filter the lookup results using various parameters such as date
    ranges, regex, and netmasks.


    ### Flow Description

    1. Extracts the integration configuration and action parameters, including the
    query type (`Qtype`), query name (`Qname`), and optional filters.

    2. Initiates a GET request to the Silent Push API (`explore/padns/lookup/query/{qtype}/{qname}`)
    to fetch the forward PADNS records.

    3. Evaluates the API response for errors and extracts the retrieved DNS records.

    4. Returns the records as a JSON result and completes the action execution.


    ### Additional Notes

    The action iterates over the target entities in the case to print their identifiers
    to the log, but it does not utilize the entities for the actual API request or
    apply any entity-based filtering.
