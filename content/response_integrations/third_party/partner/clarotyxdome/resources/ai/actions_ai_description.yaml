EnrichAlerts:
  ai_description: >-
    ### General Description

    Retrieves detailed information for a specific Claroty xDome alert and enriches
    the corresponding Google SecOps alert with this data, including MITRE ATT&CK tactics
    and techniques.


    ### Flow Description

    1. Extracts the Claroty xDome alert ID from the action parameters.

    2. Makes an HTTP POST request to the Claroty xDome API (`/api/v1/alerts/`) to
    query the specific alert details.

    3. Parses the returned alert data.

    4. Enriches the current Google SecOps alert's additional properties with the Claroty
    alert fields.

    5. Extracts MITRE ATT&CK information (tactics and techniques) and appends it to
    the alert's security results.

    6. Returns the raw Claroty alert data as a JSON result.


    ### Additional Notes

    The action relies on the `clarotyAlertId` parameter to fetch the correct alert.
    It modifies the current alert in memory to append the enriched data.
  ai_short_description: >-
    Retrieves detailed information for a specific Claroty xDome alert and enriches
    the corresponding Google SecOps alert with this data, including MITRE ATT&CK tactics
    and techniques.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: true
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the current Google SecOps alert's additional properties and security
      results with Claroty alert data and MITRE information.
    reasoning: >-
      The action fetches alert data from the Claroty xDome API (fetches_data=true).
      It does not mutate external data, as the POST request is used purely for querying/filtering
      alerts. It mutates internal data by modifying the 'additional_properties' and
      'security_result' of the current Google SecOps alert (can_mutate_internal_data=true,
      can_modify_alert_data=true). It does not interact with entities, create insights,
