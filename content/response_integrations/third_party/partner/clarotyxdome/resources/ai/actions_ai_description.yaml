Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Claroty xDome platform to ensure the integration is
    configured correctly and the API is reachable.


    ### Flow Description

    1. Extracts integration-level configuration parameters, including the API Host,
    API Token, and SSL verification settings.

    2. Makes an HTTP POST request to the Claroty xDome `/api/v1/alerts/` endpoint
    with a minimal payload (`limit: 1`) to verify authentication and network reachability.

    3. Evaluates the HTTP response.

    4. Returns a success message if the connection is established and authenticated
    successfully, or an error message if the request fails.


    ### Additional Notes

    This action is primarily used for diagnostic and setup purposes. It does not process
    entities, modify alerts, or return actionable security data to the case.
