EnrichXDomeAssetInformation:
  ai_description: >-
    ### General Description

    Enriches IP and MAC Address entities by querying Claroty xDome for asset information.
    It retrieves device details such as manufacturer, device category, risk score,
    and associated vulnerabilities to provide comprehensive context for the asset,
    updating the entity's properties within Google SecOps.


    ### Flow Description

    1. Iterates through target entities, filtering for IP Address and MAC Address
    types.

    2. Validates the entity identifier against IP and MAC regex patterns.

    3. Makes a POST request to the Claroty xDome `/api/v1/devices/` endpoint to fetch
    device details matching the identifier.

    4. If a device is found, makes a POST request to the `/api/v1/device_vulnerability_relations/`
    endpoint to retrieve associated vulnerabilities.

    5. Compiles the device and vulnerability data, updating the entity's additional
    properties and marking it as enriched.

    6. Updates the entities in Google SecOps and returns a JSON result containing
    the enrichment data.


    ### Additional Notes

    Only entities that match valid IP or MAC address formats will be processed. Entities
    that do not match or are not found in Claroty xDome will be skipped and reported
    as failed.
