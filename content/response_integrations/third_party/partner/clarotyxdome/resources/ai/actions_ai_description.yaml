AddVulnerabilities:
  ai_description: >-
    ### General Description

    This action enriches entities by retrieving vulnerability information from Claroty
    xDome. It identifies devices based on their IP address, MAC address, or UID, and
    fetches associated vulnerabilities to update the entity's properties.


    ### Flow Description

    1. Iterates through all target entities provided in the case.

    2. Evaluates the entity identifier to determine if it matches a UID, IP address,
    or MAC address format.

    3. If the identifier is an IP or MAC, makes a POST request to the Claroty xDome
    `/api/v1/devices/` endpoint to retrieve the corresponding device UID.

    4. Makes a POST request to the Claroty xDome `/api/v1/device_vulnerability_relations/`
    endpoint using the device UID to fetch vulnerability details.

    5. Updates the entity's additional properties with the retrieved vulnerability
    data and marks the entity as enriched.

    6. Saves the updated entities back to the platform and outputs the results as
    JSON.


    ### Additional Notes

    The action relies on Claroty xDome API access and uses POST requests for querying
    data.
  ai_short_description: >-
    Enriches entities by retrieving and appending device vulnerability information
    from Claroty xDome based on IP address, MAC address, or UID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches device and vulnerability data from the Claroty xDome API
      (fetches_data=true). It does not mutate external data, as the POST requests
      are used strictly for querying. It updates the entities with the retrieved vulnerability
      data (can_update_entities=true) but does not create insights, modify alert data,
      or create case comments.
  entity_usage:
