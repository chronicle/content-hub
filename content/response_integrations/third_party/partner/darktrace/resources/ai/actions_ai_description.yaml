Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP, Hostname, MacAddress, and URL entities using Darktrace. The action
    retrieves device and endpoint details, optionally fetching connection data and
    creating endpoint insights to provide additional context for the entities.


    ### Flow Description

    1. Extracts action parameters and filters target entities for supported types
    (Address, Hostname, MacAddress, URL).

    2. Iterates over each suitable entity and queries the Darktrace API (`/devices`,
    `/endpointdetails`, or `/devicesearch`) based on the entity type.

    3. If the `Fetch Connection Data` parameter is enabled and a device ID is found,
    fetches connection data for the device via the `/deviceinfo` endpoint.

    4. Enriches the entity with the retrieved data, updates its additional properties,
    and marks it as enriched.

    5. Optionally creates an insight for the entity if it is identified as a device
    and the `Create Endpoint Insight` parameter is enabled.

    6. Adds data tables and JSON results to the action output.

    7. Updates the successfully processed entities in the platform.


    ### Additional Notes

    - For URL entities, the action extracts the domain part before querying Darktrace.

    - If `Max Hours Backwards` is set to less than 1, it defaults to 24 hours.
  ai_short_description: >-
    Enriches IP, Hostname, MacAddress, and URL entities by retrieving device, endpoint,
    and connection details from Darktrace.
