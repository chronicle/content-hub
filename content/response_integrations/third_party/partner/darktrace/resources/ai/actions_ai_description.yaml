    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes GET requests to the Darktrace API to fetch device, endpoint,
      and connection data (fetches_data=true). It does not mutate external data or
      internal platform data. It updates the entities with the retrieved information
      (can_update_entities=true) and optionally creates insights for them (can_create_insight=true).
