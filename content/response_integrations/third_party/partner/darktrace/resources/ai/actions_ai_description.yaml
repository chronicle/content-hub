Add Comment To Model Breach:
  ai_description: >-
    ### General Description

    Adds a comment to a specific model breach in Darktrace. This action initiates
    a state change on the external Darktrace system by appending the provided text
    as a comment to the specified model breach.


    ### Flow Description

    1. Extracts the `Model Breach ID` and `Comment` from the action parameters.

    2. Initializes the Darktrace API client with the provided configuration credentials.

    3. Makes an HTTP POST request to the Darktrace API (`/modelbreaches/{model_breach_id}/comments`)
    with the comment payload.

    4. Retrieves the JSON response from the API and attaches it to the action results.

    5. Completes the action execution and returns a success or failure message based
    on the API response.


    ### Additional Notes

    Ensure that the provided Model Breach ID exists in Darktrace, otherwise the action
    will fail with a 'not found' error.
  ai_short_description: >-
    Adds a comment to a specific model breach in Darktrace.
