Execute Custom Search:
  ai_description: >-
    ### General Description

    Executes a custom search query in Darktrace to retrieve specific events or telemetry
    data based on the provided parameters.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the search
    query, time frame, and result limits.

    2. Calculates the exact start and end times for the search based on the selected
    time frame and the current alert's timestamps.

    3. Initializes the DarktraceManager to interact with the Darktrace API.

    4. Executes the custom search query via an HTTP GET request to the Darktrace advanced
    search endpoint.

    5. Retrieves the search results and appends them to the action's JSON result.


    ### Additional Notes

    The action requires a valid Darktrace API token and private token. The results
    are returned in JSON format and can be used for further analysis or investigation.
