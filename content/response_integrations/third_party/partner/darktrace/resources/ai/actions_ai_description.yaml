List Similar Devices:
  ai_description: >-
    ### General Description

    Lists similar devices to a specified endpoint (IP, Hostname, or MAC Address) in
    Darktrace. This action helps analysts identify related or similar assets within
    the network based on Darktrace's behavioral analysis and device profiling.


    ### Flow Description

    1. Iterates over the target entities, filtering for supported types (Address,
    Hostname, MAC Address).

    2. For each valid entity, makes a GET request to the Darktrace API (`/devices`
    or `/devicesearch`) to retrieve the internal device ID (`did`).

    3. If the device is found, makes a subsequent GET request to the Darktrace API
    (`/similardevices`) to fetch a list of similar devices up to the specified limit.

    4. Formats the retrieved similar devices into a CSV table and attaches it to the
    entity in the action results.

    5. Aggregates all findings and returns them as a comprehensive JSON result.


    ### Additional Notes

    - The action will fail for a specific entity if the initial device lookup does
    not return a valid device ID.

    - The 'Max Devices To Return' parameter must be greater than 0.
