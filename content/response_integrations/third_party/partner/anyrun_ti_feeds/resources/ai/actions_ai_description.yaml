Ping:
  ai_description: >-
    ### General Description

    Tests connectivity with the ANYRUN TI Feeds service.


    ### Flow Description

    1. Extracts integration configuration parameters including the API key, SSL verification,
    and proxy settings.

    2. Initializes the `FeedsConnector` with the provided credentials.

    3. Makes an API call to check authorization and verify connectivity to the ANYRUN
    TI Feeds service.

    4. Returns a success or failure message based on the connection result.


    ### Additional Notes

    This is a utility action typically used to verify that the integration is configured
    correctly.
  ai_short_description: >-
    Tests connectivity and verifies authorization with the ANYRUN TI Feeds service.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
