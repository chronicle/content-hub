name: Rubrik Security Cloud - Close Duplicate Violation Alerts Job
parameters:
-   name: Close Reason
    default_value: NotMalicious
    type: string
    description: "Reason applied when auto-closing a case whose violation(s) reached\n\
        \ a terminal status in RSC."
    is_mandatory: true
-   name: Comment Prefix
    default_value: '[Rubrik Dedup]'
    type: string
    description: "Prefix used on the case comment and close comment this job adds,\
        \ for\n traceability in the case activity feed."
    is_mandatory: false
-   name: Rule Generator
    default_value: ''
    type: string
    description: "Optional comma-separated list of rule_generator values to scope\
        \ this\n job to Rubrik-originated cases only."
    is_mandatory: false
-   name: Max Cases To Process
    default_value: '2000'
    type: integer
    description: Max open cases to fetch and inspect per run.
    is_mandatory: true
-   name: Lookback Days
    default_value: '7'
    type: integer
    description: Number of days to look back when fetching open cases.
    is_mandatory: true
-   name: Dry Run
    default_value: 'true'
    type: boolean
    description: "Set true for test run purposes only -- logs intended comments/closures\n\
        \ without calling add_comment or close_case. Otherwise false."
    is_mandatory: false
-   name: Close Root Cause
    default_value: Normal behavior
    type: string
    description: Root cause applied when auto-closing a case whose violation(s) reached
        a terminal status in RSC.
    is_mandatory: true
description: Closes duplicate Rubrik violation alerts/cases caused by RSC's webhook
    echoing status-change events back into SecOps as new alerts. Groups open cases'
    Rubrik alerts by violation series_id, and if the latest status for a series_id
    is terminal (Remediated/Closed/Dismissed), closes every case touched by that series_id
    -- unless the case also holds a different, still-open violation.
integration: RubrikSecurityCloud
creator: 322ce0cd-9b16-4871-8c2d-134b55f8317f
