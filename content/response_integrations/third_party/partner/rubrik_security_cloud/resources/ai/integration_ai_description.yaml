product_categories:
  asset_inventory: false
  cloud_security: false
  collaboration: false
  edr: false
  email_security: false
  iam_and_identity_management: true
  itsm: false
  network_security: false
  reasoning: >-
    Rubrik Security Cloud is a data security and backup platform. Its actions run
    Turbo and Advanced IOC scans against backup snapshots, list snapshots, events and
    Sonar sensitive-data hits, search and retrieve DSPM (data security posture) and
    Identity Resilience (IR) violations, update violation status, and download remediation
    logs and snapshot results. A connector ingests classification events and DSPM and
    IR violations, and a job closes duplicate violation cases. IAM & Identity Management
    matches: the IR actions and connector surface identity-related violations such
    as unprivileged identities holding admin rights, returning the affected identity
    and its policy and privilege details, and the violation status can be updated
    from SecOps. EDR does not match: IOC scans run against backup snapshots, not live
    endpoints, and there is no process tree or host isolation. Threat Intelligence
    does not match: the integration scans for indicators the analyst supplies but
    returns no reputation or risk scores for them. Cloud Security does not match:
    findings concern data exposure on protected workloads (for example SharePoint,
    OneDrive and file shares), not GCP/AWS/Azure resource configuration. SIEM, Network
    Security, Email Security, Vulnerability Management, Asset Inventory, ITSM and Collaboration
    do not match, since the integration provides no log search, firewall control, email
    management, CVE or patch data, asset ownership records, ticketing or messaging.
  siem: false
  threat_intelligence: false
  vulnerability_management: false
