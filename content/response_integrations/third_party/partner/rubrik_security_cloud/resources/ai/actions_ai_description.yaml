    | Paths To Exclude | String | No | Paths to exclude from the scan. Supports comma
    separated values. |

    | Max Matches Per Snapshot | String | No | Snapshot terminates once this number
    of matches have been detected. |

    | Paths To Exempt | String | No | Paths to exempt from exclusion. Supports comma
    separated values. |

    | Object ID | String | Yes | Object ID of the system on which to perform the scan.
    Supports comma separated values. |

    | IOC Type | String | No | The type of the indicator to scan for. |

    | IOC Value | String | No | Value of the indicator to scan for. |

    | Scan Name | String | No | Name of the new advanced threat hunt scan. |

    | Advanced IOC | String | No | Json encoded Indicators Of Compromise to scan.
    Json keys signify the type of IOC and the corresponding list of values are the
    values of the IOC's. |

    | Start Date | String | No | Filter the snapshots from the provided date.\nFormat
    supported:  yyyy-mm-dd, yyyy-mm-ddTHH:MM:SSZ |

    | End Date | String | No | Filter the snapshots until the provided date.\nFormat
    supported:  yyyy-mm-dd, yyyy-mm-ddTHH:MM:SSZ |

    | Max Snapshots Per Object | String | No | Maximum number of snapshots to scan
    per object. |

    | Min File Size | String | No | Minimum size of the file in bytes that will be
    included in the scan. |

    | Max File Size | String | No | Maximum size of the file in bytes that will be
    included in the scan. |

    | Paths To Include | String | No | Paths to include in the scan. Supports comma
    separated values. |


    *Parameter Notes:* At least one of the following is required: the 'Advanced IOC'
    parameter, or the combination of 'IOC Type' and 'IOC Value' parameters.
Get CDM Cluster Connection State:
  ai_description: >-
    ### General Description

    Retrieves the connection state of a specific Cloud Data Management (CDM) cluster
    from Rubrik Security Cloud. This action provides visibility into the connectivity
    status of the cluster's nodes.


    ### Flow Description

    1. Extracts the `Cluster ID` from the action parameters.

    2. Initializes the Rubrik Security Cloud API client using the provided integration
    credentials.

    3. Executes a GraphQL query (`CDMClusterConnectionStateQuery`) via an HTTP POST
    request to the Rubrik API to fetch the connection state of the specified CDM cluster.

    4. Parses the API response to extract the connection state for all nodes within
    the cluster.

    5. Attaches the raw response as a JSON result and constructs a CSV data table
    containing the cluster ID and connection state to be displayed in the case wall.


    ### Additional Notes

    This action is strictly for data retrieval and does not perform any modifications
    to the Rubrik Security Cloud environment or internal Google SecOps entities.
