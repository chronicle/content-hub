Turbo IOC Scan:
  ai_description: >-
    ### General Description

    Initiates a Turbo IOC (Indicator of Compromise) scan across Rubrik infrastructure.
    Turbo scans are optimized for speed and can scan multiple IOCs across clusters
    with configurable time ranges and snapshot limits.


    ### Flow Description

    1. Extracts the provided IOCs, scan name, cluster IDs, time range, and snapshot
    limits from the action parameters.

    2. Validates the input parameters (e.g., date formats, integer limits).

    3. Makes a GraphQL POST request to Rubrik Security Cloud to execute the `startTurboThreatHunt`
    mutation.

    4. Retrieves the `huntId` from the response.

    5. Outputs the results to the case wall and attaches a data table with the Hunt
    ID.


    ### Additional Notes

    The action does not wait for the scan to complete; it only initiates it and returns
    the Hunt ID. To get the results of the scan, a separate action must be used with
    the returned Hunt ID.
