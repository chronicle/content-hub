Advanced IOC Scan:
  ai_description: >-
    ### General Description

    Starts a new advanced threat hunt scan on the Rubrik Security Cloud. This action
    initiates an advanced Indicator of Compromise (IOC) scan on specified Rubrik objects,
    supporting various scan configurations including IOC types, date ranges, file
    size filters, and path inclusions/exclusions.


    ### Flow Description

    1. Extracts and validates the provided parameters, including Object ID, IOC details,
    date ranges, and file filters.

    2. Initializes the Rubrik Security Cloud API client.

    3. Executes a GraphQL mutation (`startBulkThreatHunt`) to initiate the advanced
    threat hunt scan with the specified configurations.

    4. Retrieves the hunt details from the response and formats them into a data table.

    5. Returns the execution status and the scan results.


    ### Additional Notes

    - At least one of the following is required: the `Advanced IOC` parameter, or
    the combination of `IOC Type` and `IOC Value` parameters.

    - `Start Date` must be before `End Date` if both are provided.
  ai_short_description: >-
    Starts a new advanced threat hunt scan on the Rubrik Security Cloud based on specified
    IOCs and configurations.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Starts a new advanced threat hunt scan on the Rubrik Security Cloud.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Rubrik Security Cloud GraphQL API to
      execute a `startBulkThreatHunt` mutation. This initiates a new threat hunt scan,
      which is a state-changing operation on the external system. It does not fetch
      contextual data for enrichment, nor does it mutate internal SOAR data like entities
      or insights.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
