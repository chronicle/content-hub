  ai_description: >-
    ### General Description

    Generates and downloads a CSV file containing all files at risk for a DSPM violation
    from Rubrik Security Cloud. This action triggers the asynchronous generation of
    the CSV file, polls the platform until the file is ready, and then downloads and
    attaches it to the SOAR case.


    ### Flow Description

    1. Fetches violation details using the provided Violation ID to validate the input
    parameters (Object ID, Snapshot ID, and Object Name).

    2. Triggers the generation of the snapshot results CSV file on the Rubrik platform
    via a GraphQL mutation (`DownloadFullSnapshotResultsCsvMutation`).

    3. Locates the triggered file in the user's downloads and stores its external
    ID for polling.

    4. On subsequent asynchronous runs, checks the readiness of the file using the
    stored external ID.

    5. Once the file state is ready, downloads the binary content and attaches it
    to the SOAR case.


