IOC Scan Results:
  ai_description: >-
    ### General Description

    Retrieves the results and metrics of a Turbo or Advanced Threat Hunt (IOC scan)
    from Rubrik Security Cloud using a specific Hunt ID. It returns detailed information
    about the scan status, matches found, and metrics.


    ### Flow Description

    1. Extracts the `Hunt ID` parameter provided by the user or playbook.

    2. Initializes the Rubrik Security Cloud API client.

    3. Executes a GraphQL query (`THREAT_HUNT_DETAILS_V2_QUERY`) to Rubrik Security
    Cloud to fetch the threat hunt details and object metrics.

    4. Parses the returned data and attaches the raw JSON response to the action results.

    5. Constructs a CSV data table containing the scan results (e.g., Hunt Name, Status,
    IOC Details, Scan Metrics) and adds it to the action output.

    6. Evaluates the status of the threat hunt; if it is still pending or in progress,
    the action execution state is set to in-progress for asynchronous polling.


    ### Additional Notes

    This action supports asynchronous execution and will return an IN_PROGRESS status
    if the hunt is still running on the Rubrik Security Cloud side.
