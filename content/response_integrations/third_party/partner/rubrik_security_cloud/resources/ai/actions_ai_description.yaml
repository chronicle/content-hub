List Object Snapshots:
  ai_description: >-
    ### General Description

    Retrieves a list of snapshots for a specified object from Rubrik Security Cloud.
    This action allows users to view available snapshots for a given object, with
    support for filtering by date range and snapshot type, as well as pagination and
    sorting.


    ### Flow Description

    1. Extracts the provided parameters including Object ID, Start Date, End Date,
    Snapshot Type, Limit, Next Page Token, and Sort Order.

    2. Validates the input parameters, ensuring dates are in the correct format and
    the limit is within allowed bounds.

    3. Initializes the Rubrik Security Cloud client.

    4. Makes a GraphQL POST request to the Rubrik API to retrieve the object snapshots
    based on the provided filters.

    5. Parses the response and constructs a data table containing the snapshot details
    (Snapshot ID, Creation Date, Cluster Name, SLA Domain Name).

    6. Returns the raw JSON response and the constructed data table to the SOAR platform.


    ### Additional Notes

    - The action supports pagination. If there are more results than the specified
    limit, a Next Page Token will be provided in the output message, which can be
    used in subsequent runs to retrieve the next set of results.

    - The maximum number of snapshots that can be retrieved in a single request is
    1000.
