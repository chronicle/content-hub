  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Paths To Exclude | String | No | Paths to exclude from the scan. Supports comma
    separated values. |

    | Max Matches Per Snapshot | String | No | Snapshot terminates once this number
    of matches have been detected. |

    | Paths To Exempt | String | No | Paths to exempt from exclusion. Supports comma
    separated values. |

    | Object ID | String | Yes | Object ID of the system on which to perform the scan.
    Supports comma separated values. |

    | IOC Type | String | No | The type of the indicator to scan for. |

    | IOC Value | String | No | Value of the indicator to scan for. |

    | Scan Name | String | No | Name of the new advanced threat hunt scan. |

    | Advanced IOC | String | No | Json encoded Indicators Of Compromise to scan.
    Json keys signify the type of IOC and the corresponding list of values are the
    values of the IOC's. |

    | Start Date | String | No | Filter the snapshots from the provided date. Format
    supported:  yyyy-mm-dd, yyyy-mm-ddTHH:MM:SSZ |

    | End Date | String | No | Filter the snapshots until the provided date. Format
    supported:  yyyy-mm-dd, yyyy-mm-ddTHH:MM:SSZ |

    | Max Snapshots Per Object | String | No | Maximum number of snapshots to scan
    per object. |

    | Min File Size | String | No | Minimum size of the file in bytes that will be
    included in the scan. |

    | Max File Size | String | No | Maximum size of the file in bytes that will be
    included in the scan. |

    | Paths To Include | String | No | Paths to include in the scan. Supports comma
    separated values. |


    ### Parameter Notes

    Either the `Advanced IOC` parameter or the combination of `IOC Type` and `IOC
    Value` parameters must be configured.
Download Remediation Log:
  ai_description: >-
    ### General Description

    Triggers the generation of a remediation log CSV for a DSPM or IR violation in
    Rubrik Security Cloud, polls until it is ready, downloads it, and attaches it
    to the case.


    ### Flow Description

    1. Fetches violation details to validate the provided Object ID and Object Name
    against the Violation ID using the Rubrik GraphQL API.

    2. Triggers the creation of a violation remediation log via a GraphQL mutation.

    3. Locates the triggered remediation log file and stores its external ID.

    4. Polls the Rubrik API on subsequent runs to check the file's readiness.

    5. Downloads the file once ready and attaches it to the Google SecOps case.


    ### Additional Notes

    This is an asynchronous action that will poll until the file is generated or fails.
