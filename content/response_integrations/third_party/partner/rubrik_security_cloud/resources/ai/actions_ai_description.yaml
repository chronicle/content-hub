Advanced IOC Scan:
  ai_description: >-
    ### General Description

    Initiates an advanced Indicator of Compromise (IOC) scan (threat hunt) on specified
    Rubrik Security Cloud objects. This action allows users to search for specific
    IOCs across backups and snapshots using various filters and configurations.


    ### Flow Description

    1. Extracts configuration and action parameters, including Object IDs, IOC details,
    and scan filters (e.g., date ranges, file sizes, paths).

    2. Validates the input parameters, ensuring dates, integers, and JSON structures
    are correctly formatted.

    3. Calls the Rubrik Security Cloud GraphQL API (`startBulkThreatHunt` mutation)
    to initiate the advanced IOC scan.

    4. Parses the API response and outputs the hunt details (such as Hunt ID, Name,
    and Status) as a JSON result and a data table.


    ### Additional Notes

    The action supports various scan configurations, including different IOC types
    (Hash, Yara, Path/Filename), date ranges, file size filters, and path inclusions/exclusions.
    Either the 'Advanced IOC' parameter or the combination of 'IOC Type' and 'IOC
    Value' must be provided.
  ai_short_description: >-
    Initiates an advanced Indicator of Compromise (IOC) scan on specified Rubrik Security
    Cloud objects.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a new advanced threat hunt scan on specified Rubrik Security Cloud
      objects.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request (GraphQL mutation) to Rubrik Security Cloud
      to start a new advanced threat hunt scan, which mutates external data. It does
      not mutate internal SOAR data, update entities, or create insights.
  entity_usage:
