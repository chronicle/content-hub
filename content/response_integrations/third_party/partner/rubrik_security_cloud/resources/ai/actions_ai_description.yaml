    reasoning: >-
      The action initiates a threat hunt scan on an external system. This does not
      align with any of the predefined outcome categories such as enriching IOCs/assets,
      updating alerts, managing blocklists/allowlists, or containing hosts. Therefore,
      all outcome category flags are set to false.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
