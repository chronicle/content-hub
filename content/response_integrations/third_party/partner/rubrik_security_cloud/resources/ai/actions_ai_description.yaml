Get Sonar Sensitive Hits:
  ai_description: >-
    ### General Description

    Retrieves sensitive data hits detected by Rubrik Sonar for a specific object within
    a configurable lookback period from Rubrik Security Cloud. Sonar is Rubrik's data
    classification and sensitive data discovery engine.


    ### Flow Description

    1. Extracts the `Object Name` and `Lookback Days` parameters.

    2. Validates the parameters and calculates the search date based on the lookback
    period.

    3. Initializes the Rubrik Security Cloud API client.

    4. Executes a GraphQL query (`GoogleSecOpsSonarSensitiveHitsObjectList`) to find
    the object by name and retrieve its snapshot IDs.

    5. Executes a second GraphQL query (`GoogleSecOpsObjectDetailQuery`) to fetch
    the detailed sensitive hits for the identified object and snapshot.

    6. Parses the response and formats the sensitive hits data into a table.

    7. Returns the raw JSON response and the formatted table to the SOAR platform.


    ### Additional Notes

    None.
