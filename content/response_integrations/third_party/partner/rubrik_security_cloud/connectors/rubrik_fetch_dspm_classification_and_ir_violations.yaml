name: Rubrik - Fetch DSPM Classification and IR Violations
parameters:
-   name: Service Account JSON
    default_value: ''
    type: string
    description: Rubrik Security Cloud service account JSON. Must be a JSON object
        containing client_id, client_secret and access_token_uri; validated before
        the run starts.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: 'true'
    type: boolean
    description: Whether to verify the SSL certificate when connecting to Rubrik Security
        Cloud.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Search Time Period In Days
    default_value: '1'
    type: integer
    description: Number of past days to fetch classification events, DSPM violations
        and IR violations from, used only on the first run before a checkpoint exists.
        Must be a whole number between 0 and 1. Default is 1 day.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: RSC Fetch Types
    default_value: ''
    type: string
    description: 'Select RSC types to fetch as incidents. Accepts one or more comma-separated
        values from: Classification, DSPM, IR. Values are matched case-insensitively;
        any other value fails the run. At least one value is required. Classification,
        DSPM and IR share a single checkpoint timestamp: deselecting one and re-selecting
        it later resumes from the timestamp of the run where it was re-selected, not
        from where it was deselected -- anything updated in RSC in between is never
        fetched for that type. Intended to be set once and left alone; the run log
        warns explicitly if this happens.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: DeviceProductField
    default_value: Rubrik Security Cloud
    type: string
    description: ''
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: eventName
    type: string
    description: ''
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '1200'
    type: string
    description: ''
    is_mandatory: true
    is_advanced: false
    mode: regular
description: 'Fetch Rubrik Security Cloud classification events, DSPM violations and
    Identity Resilience (IR) violations, and generate a SOAR alert for each finding.
    All three are polled from activitySeriesConnection in a single sweep per run and
    routed by lastActivityType: CLASSIFICATION, SECURITY_VIOLATION (DSPM), and IDENTITY_VIOLATION
    / IDENTITY_ALERTS (IR). Each alert is built from the latest activityConnection
    entry of its series, deduplicated on that entry''s id and grouped into a case
    by activitySeriesId. Classification additionally resolves the closest snapshot
    and reads policyObj, alerting only when violations are found.'
integration: RubrikSecurityCloud
documentation_link: https://github.com/rubrikinc/google-secops-content/blob/main/SOAR/user_guide_rubrik_security_cloud_google_secops_integration.pdf
rules: []
is_connector_rules_supported: true
creator: 1c7ad462-51d3-4802-85ec-6bc5bbf18af7
