name: Generate Alert from Rubrik Classification Events
parameters:
-   name: Search Time Period In Days
    default_value: '1'
    type: integer
    description: Number of past days to fetch classification events from. Default
        is 1 day.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Service Account JSON
    default_value: json
    type: string
    description: Rubrik Security Cloud service account JSON (contains client_id, client_secret,
        access_token_uri).
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: 'false'
    type: boolean
    description: Whether to verify SSL certificates when connecting to Rubrik Security
        Cloud.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: DeviceProductField
    default_value: Rubrik Security Cloud
    type: string
    description: ''
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: eventName
    type: string
    description: ''
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '1200'
    type: string
    description: ''
    is_mandatory: true
    is_advanced: false
    mode: regular
description: Automatically fetch Rubrik Sonar classification events and generate SOAR
    alerts. Queries activitySeriesConnection for CLASSIFICATION/SUCCESS events, resolves
    the closest snapshot, retrieves policyObj violation details, and creates an alert
    for each object with violations above the configured threshold.
integration: RubrikSecurityCloud
documentation_link: https://github.com/rubrikinc/google-secops-content/blob/main/SOAR/user_guide_rubrik_security_cloud_google_secops_integration.pdf
rules: []
is_connector_rules_supported: true
creator: 1c7ad462-51d3-4802-85ec-6bc5bbf18af7
