name: Update Violation Status
description: Update the status of a DSPM or IR policy violation in RSC.
integration_identifier: RubrikSecurityCloud
parameters:
-   name: Violation ID
    default_value: ''
    type: string
    description: 'RSC DSPM or IR policy violation ID. Must be a valid UUID. Example:
        1fa1bd94-0512-495c-a992-107c6f4e64aa'
    is_mandatory: true
-   name: New Status
    default_value: ''
    type: ddl
    optional_values:
    - Open
    - In Progress
    - Remediated
    - Dismissed
    - Closed
    description: 'Target status for the violation. Example: In Progress'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: false
default_result_value: ''
creator: ''
