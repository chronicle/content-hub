name: Search IR Violations
description: Retrieve a paginated list of Identity Resilience policy violations from
    RSC with optional filters.
integration_identifier: RubrikSecurityCloud
parameters:
-   name: Policy Types
    default_value: Identity,IDP
    type: multi_choice_parameter
    optional_values:
    - Identity
    - IDP
    - Identity Event
    description: IR policy type(s) to query. Accepts one or more comma-separated values
        from the dropdown (e.g. Identity, IDP). At least one value is required.
    is_mandatory: true
-   name: Status
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Open
    - In Progress
    - Remediated
    - Dismissed
    - Closed
    description: Filter by violation status. Accepts one or more comma-separated values
        from the dropdown (e.g. Open, In Progress). Leave empty to include all statuses.
    is_mandatory: false
-   name: Severity
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Low
    - Medium
    - High
    - Critical
    description: Filter by violation severity. Accepts one or more comma-separated
        values from the dropdown (e.g. High, Critical). Leave empty to include all
        severities.
    is_mandatory: false
-   name: Category
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Identity Hygiene
    - Authentication and Secret Management
    - Identity Provider Security
    - Excessive Identity Rights
    description: Filter by IR category. Accepts one or more comma-separated values
        from the dropdown (e.g. Identity Hygiene, Excessive Identity Rights). Leave
        empty to include all categories.
    is_mandatory: false
-   name: Detection Start Date
    default_value: ''
    type: string
    description: 'Start of the detection date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Detection End Date. Example: 2026-04-01T00:00:00Z'
    is_mandatory: false
-   name: Detection End Date
    default_value: ''
    type: string
    description: 'End of the detection date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Detection Start Date, and must be later than
        it. Example: 2026-07-01T00:00:00Z'
    is_mandatory: false
-   name: Sort By
    default_value: Detection Time
    type: ddl
    optional_values:
    - Detection Time
    - Update Time
    - Severity
    - Name
    - Status
    - Identity Type
    description: 'Field to sort results by. Example: Detection Time'
    is_mandatory: false
-   name: Sort Order
    default_value: Descending
    type: ddl
    optional_values:
    - Ascending
    - Descending
    description: 'Sort direction. Example: Descending'
    is_mandatory: false
-   name: Max Results
    default_value: '50'
    type: string
    description: 'Maximum number of violations to return. Must be an integer between
        1 and 1000; values above 1000 are rejected. Example: 50'
    is_mandatory: false
-   name: Next Page Token
    default_value: ''
    type: string
    description: 'Pagination cursor for retrieving the next page of results. Use the
        token returned in the previous run''s output message. Example: Y3Vyc29yOmludDo0OQ=='
    is_mandatory: false
-   name: Update Start Date
    default_value: ''
    type: string
    description: 'Start of the update date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Update End Date. Example: 2026-06-01T00:00:00Z'
    is_mandatory: false
-   name: Update End Date
    default_value: ''
    type: string
    description: 'End of the update date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Update Start Date, and must be later than it.
        Example: 2026-07-01T00:00:00Z'
    is_mandatory: false
-   name: Identity Provider
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Unspecified
    - On-Prem AD
    - Entra ID
    - AWS
    - Local AD
    - SharePoint
    - System
    - Okta
    description: Filter by identity provider. Accepts one or more comma-separated
        values from the dropdown (e.g. Entra ID, Okta). Leave empty to include all
        providers.
    is_mandatory: false
-   name: Identity Tag
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Unspecified
    - Privileged
    - At Risk
    - Sensitive
    description: Filter violations by identity tag. Accepts one or more comma-separated
        values from the dropdown (e.g. Privileged, At Risk). Leave empty to include
        all tags.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/search_ir_violations_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: ''
