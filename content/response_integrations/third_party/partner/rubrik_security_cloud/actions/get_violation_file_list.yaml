name: Get Violation File List
description: Retrieve a paginated list of files involved in a DSPM violation, including
    file paths, hit counts, and sensitivity breakdown.
integration_identifier: RubrikSecurityCloud
parameters:
-   name: Object ID
    default_value: ''
    type: string
    description: 'RSC snappable FID of the protected object. Must be a valid UUID.
        Example: 196b397a-aa42-571e-819f-625761428e4d'
    is_mandatory: true
-   name: Violation ID
    default_value: ''
    type: string
    description: 'RSC DSPM policy violation ID. Must be a valid UUID. Example: 1fa1bd94-0512-495c-a992-107c6f4e64aa'
    is_mandatory: false
-   name: Snapshot ID
    default_value: ''
    type: string
    description: 'RSC snapshot FID (from Get DSPM Violation Details details.snapshotId).
        Must be a valid UUID. Example: 17eab632-3e7d-5244-b2c4-eaf9c63b66f8'
    is_mandatory: true
-   name: File Name Filter
    default_value: ''
    type: string
    description: 'Substring search on filename. Example: social_media_matrix_template.xlsx'
    is_mandatory: false
-   name: Risk Level
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Unknown Risk
    - High Risk
    - Medium Risk
    - Low Risk
    - No Risk
    description: Filter by risk level. Accepts one or more comma-separated values
        from the dropdown (e.g. High Risk, Medium Risk). Leave empty to include all
        risk levels.
    is_mandatory: false
-   name: Exposure
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Explicit
    - Inherited
    - Not Open
    - Unknown Access
    - Public
    description: Filter by file exposure type. Accepts one or more comma-separated
        values from the dropdown (e.g. Explicit, Public). Leave empty to include all
        exposure types.
    is_mandatory: false
-   name: Sort By
    default_value: Hits
    type: ddl
    optional_values:
    - Hits
    - Name
    - Last Access Time
    - Last Modified
    - Creation Time
    - Last Scan Time
    description: 'Field to sort results by. Example: Hits'
    is_mandatory: false
-   name: Sort Order
    default_value: Descending
    type: ddl
    optional_values:
    - Ascending
    - Descending
    description: 'Sort direction. Example: Descending'
    is_mandatory: false
-   name: Max Results
    default_value: '25'
    type: string
    description: 'Maximum number of files to return per page. Must be an integer between
        1 and 1000; values above 1000 are rejected. Example: 25'
    is_mandatory: false
-   name: Next Page Token
    default_value: ''
    type: string
    description: 'Cursor for paginating to the next page of results. Use the token
        returned in the previous run''s output message. Example: Y3Vyc29yOmludDow'
    is_mandatory: false
-   name: Access Via
    default_value: Unspecified
    type: ddl
    optional_values:
    - Unspecified
    - Direct
    - Group
    - Role
    description: 'Filter files by access type. Example: Direct'
    is_mandatory: false
-   name: Last Access Start Date
    default_value: ''
    type: string
    description: 'Start of last access date range, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Last Access End Date, and must be earlier than
        it. Example: 2001-04-24T03:29:54Z'
    is_mandatory: false
-   name: Last Access End Date
    default_value: ''
    type: string
    description: 'End of last access date range, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Last Access Start Date, and must be later than
        it. Example: 2026-04-24T03:29:54Z'
    is_mandatory: false
-   name: Last Updated Start Date
    default_value: ''
    type: string
    description: 'Start of last updated (last modified) date range, in the format
        YYYY-MM-DDTHH:MM:SSZ. Must be provided together with Last Updated End Date,
        and must be earlier than it. Example: 2001-04-24T03:29:54Z'
    is_mandatory: false
-   name: Last Updated End Date
    default_value: ''
    type: string
    description: 'End of last updated (last modified) date range, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Last Updated Start Date, and must be later
        than it. Example: 2026-04-24T03:29:54Z'
    is_mandatory: false
-   name: Creation Start Date
    default_value: ''
    type: string
    description: 'Start of creation date range, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Creation End Date, and must be earlier than
        it. Example: 2001-04-24T03:29:54Z'
    is_mandatory: false
-   name: Creation End Date
    default_value: ''
    type: string
    description: 'End of creation date range, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Creation Start Date, and must be later than
        it. Example: 2026-04-24T03:29:54Z'
    is_mandatory: false
-   name: Last Scan Start Date
    default_value: ''
    type: string
    description: 'Start of last scan date range, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Last Scan End Date, and must be earlier than
        it. Example: 2001-04-24T03:29:54Z'
    is_mandatory: false
-   name: Last Scan End Date
    default_value: ''
    type: string
    description: 'End of last scan date range, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Last Scan Start Date, and must be later than
        it. Example: 2026-04-24T03:29:54Z'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_violation_file_list_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: ''
