name: Get IR Violation Details
description: Retrieve the full details of a single Identity Resilience violation including
    identity metadata and remediation guidance.
integration_identifier: RubrikSecurityCloud
parameters:
-   name: Violation ID
    default_value: ''
    type: string
    description: 'RSC IR policy violation ID. Must be a valid UUID. Example: 0fd58e91-f211-4551-80fd-d04e96fbf3f4'
    is_mandatory: true
-   name: Policy Types
    default_value: Identity,IDP
    type: multi_choice_parameter
    optional_values:
    - Identity
    - IDP
    - Identity Event
    description: Policy type(s) the violation belongs to. Accepts one or more comma-separated
        values from the dropdown (e.g. Identity, IDP). At least one value is required.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_ir_violation_details_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: ''
