name: Download Remediation Log
description: Trigger generation of a remediation log CSV for a DSPM or IR violation,
    poll until ready, then download and attach it to the case.
integration_identifier: RubrikSecurityCloud
parameters:
-   name: Object ID
    default_value: ''
    type: string
    description: 'RSC snappable ID of the protected object (resourceId). Must be a
        valid UUID. Example: 246c952b-faf7-44ad-9ac2-d32296369f1d'
    is_mandatory: true
-   name: Violation ID
    default_value: ''
    type: string
    description: 'RSC DSPM policy violation ID (targetIds). Must be a valid UUID.
        Example: 91d77832-6d18-48ed-adcb-f4e3375835ff'
    is_mandatory: true
-   name: Object Name
    default_value: ''
    type: string
    description: 'RSC DSPM Object Name. If omitted, it is automatically resolved via
        Get DSPM Violation Details using the Violation ID. Example: rubrik-tme-s3-protection-test1'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: 322ce0cd-9b16-4871-8c2d-134b55f8317f
is_async: true
script_result_name: ScriptResult
