name: Download Snapshot Results CSV
description: Generate and download a CSV file containing all files at risk for a DSPM
    violation. Triggers async CSV generation, polls until ready, then downloads and
    attaches the file to the case.
integration_identifier: RubrikSecurityCloud
parameters:
-   name: Object ID
    default_value: ''
    type: string
    description: 'RSC snappable FID of the protected object. Must be a valid UUID.
        Example: 594db947-1fa2-5af2-9af0-bc354b032732'
    is_mandatory: true
-   name: Violation ID
    default_value: ' '
    type: string
    description: 'RSC DSPM policy violation ID. Must be a valid UUID. Example: 91d77832-6d18-48ed-adcb-f4e3375835ff'
    is_mandatory: true
-   name: Snapshot ID
    default_value: ''
    type: string
    description: 'RSC snapshot FID (details.snapshotId from Get DSPM Violation Details).
        Must be a valid UUID. Example: 2a8a3b81-c699-5814-a944-be701e9d4c96'
    is_mandatory: true
-   name: Object Name
    default_value: ''
    type: string
    description: 'RSC DSPM Object Name. If omitted, it is automatically resolved via
        Get DSPM Violation Details using the Violation ID. Example: rubrik-tme-s3-protection-test1'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: ''
is_async: true
