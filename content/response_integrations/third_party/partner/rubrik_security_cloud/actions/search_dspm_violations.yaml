name: Search DSPM Violations
description: Retrieve a paginated list of DSPM policy violations from RSC with optional
    filters.
integration_identifier: RubrikSecurityCloud
parameters:
-   name: Object Type
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - VSPHERE_VIRTUAL_MACHINE
    - LINUX_FILESET
    - SHARE_FILESET
    - NUTANIX_VIRTUAL_MACHINE
    - WINDOWS_FILESET
    - HYPERV_VIRTUAL_MACHINE
    - VOLUME_GROUP
    - NAS_FILESET
    - AZURE_VIRTUAL_MACHINE
    - AZURE_MANAGED_DISK
    - AZURE_STORAGE_ACCOUNT
    - AZURE_SQL_DATABASE_DB
    - AZURE_SQL_MANAGED_INSTANCE_DB
    - O365_ONEDRIVE
    - O365_SITE
    - AWS_NATIVE_S3_BUCKET
    - AWS_NATIVE_EBS_VOLUME
    - AWS_NATIVE_RDS_INSTANCE
    - AWS_NATIVE_DYNAMODB_TABLE
    - ORACLE_DATABASE
    - ORACLE_DATA_GUARD_GROUP
    - K8S_VIRTUAL_MACHINE
    - GCP_NATIVE_DISK
    - GCP_NATIVE_GCE_INSTANCE
    - K8S_PROTECTION_SET
    description: Filter by resource Object Type. Accepts one or more comma-separated
        values from the dropdown (e.g. AWS_NATIVE_S3_BUCKET, O365_ONEDRIVE). Leave
        empty to include all object types.
    is_mandatory: false
-   name: Update Start Date
    default_value: ''
    type: string
    description: 'Start of the update date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Update End Date. Example: 2026-01-01T00:00:00Z'
    is_mandatory: false
-   name: Update End Date
    default_value: ''
    type: string
    description: 'End of the update date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Update Start Date, and must be later than it.
        Example: 2026-07-08T23:59:59Z'
    is_mandatory: false
-   name: Status
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Open
    - In Progress
    - Remediated
    - Dismissed
    - Closed
    description: Filter by violation status. Accepts one or more comma-separated values
        from the dropdown (e.g. Open, In Progress). Leave empty to include all statuses.
    is_mandatory: false
-   name: Severity
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Low
    - Medium
    - High
    - Critical
    description: Filter by violation severity. Accepts one or more comma-separated
        values from the dropdown (e.g. High, Critical). Leave empty to include all
        severities.
    is_mandatory: false
-   name: Category
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Misplaced
    - Redundant
    - Overexposed
    - Unprotected
    description: Filter by DSPM policy category. Accepts one or more comma-separated
        values from the dropdown (e.g. Misplaced, Overexposed). Leave empty to include
        all categories.
    is_mandatory: false
-   name: Sensitivity Level
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - High Sensitivity
    - Medium Sensitivity
    - Low Sensitivity
    - No Sensitivity
    description: Filter by data sensitivity level. Accepts one or more comma-separated
        values from the dropdown (e.g. High Sensitivity, Medium Sensitivity). Leave
        empty to include all sensitivity levels.
    is_mandatory: false
-   name: Detection Start Date
    default_value: ''
    type: string
    description: 'Start of the detection date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Detection End Date. Example: 2026-01-01T00:00:00Z'
    is_mandatory: false
-   name: Detection End Date
    default_value: ''
    type: string
    description: 'End of the detection date range filter, in the format YYYY-MM-DDTHH:MM:SSZ.
        Must be provided together with Detection Start Date, and must be later than
        it. Example: 2026-07-08T23:59:59Z'
    is_mandatory: false
-   name: Sort By
    default_value: Detection Time
    type: ddl
    optional_values:
    - Detection Time
    - Update Time
    - Severity
    - Hits
    - Files At Risk
    - Name
    - Status
    description: 'Field to sort results by. Example: Detection Time'
    is_mandatory: false
-   name: Sort Order
    default_value: Descending
    type: ddl
    optional_values:
    - Ascending
    - Descending
    description: 'Sort direction. Example: Descending'
    is_mandatory: false
-   name: Max Results
    default_value: '50'
    type: string
    description: 'Maximum number of violations to return per page. Must be an integer
        between 1 and 1000, values above 1000 are rejected. Example: 50'
    is_mandatory: false
-   name: Next Page Token
    default_value: ''
    type: string
    description: 'Pagination cursor for retrieving the next page of results. Use the
        token returned in the previous run''s output message (sourced from pageInfo.endCursor).
        Example: Y3Vyc29yOmludDo0OQ=='
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/search_dspm_violations_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: ''
