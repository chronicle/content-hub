Ping:
  ai_description: >-
    ### General Description

    Pings the Resolution Intelligence Cloud API to verify connectivity and ensure
    the configured webhook is reachable.


    ### Flow Description

    1. Extracts the webhook URL, token, and SSL verification settings from the integration
    configuration.

    2. Sends an empty HTTP POST request to the configured webhook URL.

    3. Evaluates the HTTP response status code to determine if the API is reachable
    (considers 200 or 400 as successful connectivity).

    4. Outputs a success or failure message along with the status code or error details
    in the JSON result.


    ### Additional Notes

    This action is primarily used as a diagnostic tool to test integration connectivity.
    It does not require any action-specific parameters and relies entirely on integration-level
    configurations.
  ai_short_description: >-
    Pings the Resolution Intelligence Cloud API to verify connectivity and ensure
    the webhook is reachable.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action sends an empty POST request to a webhook URL to verify connectivity.
      It does not fetch contextual data for enrichment, mutate external data (it's
      just a ping), mutate internal data, update entities, create insights, modify
      alert data, or create case comments.
