Ping:
  ai_description: >-
    ### General Description

    The Ping action is used to test connectivity to the Silverfort API. It validates
    that the External API Key is working and tests connectivity for each configured
    API (Risk, Service Accounts, Policies) using their respective credentials.


    ### Flow Description

    1. Retrieves the configured API credentials from the integration settings.

    2. Determines which APIs (Risk, Service Accounts, Policies) have been configured.

    3. Iterates through the configured APIs and calls their respective `test_connectivity`
    endpoints (e.g., making a GET request to `/v1/public/getEntityRisk` for Risk,
    a POST request to `/v1/public/serviceAccounts/index` for Service Accounts, and
    a GET request to `/v1/public/getRulesNamesAndIds` for Policies).

