Change Policy State:
  ai_description: >-
    ### General Description

    Enables or disables an authentication policy in Silverfort. This action provides
    a quick way to toggle a policy's active state without modifying its underlying
    configuration.


    ### Flow Description

    1. Extracts the `Policy ID` and the desired state (`Enable Policy`) from the action
    parameters.

    2. Initializes the Silverfort Policy API client.

    3. Makes a POST request to the `/v1/public/changePolicyState` endpoint in the
    Silverfort API to update the policy's state.

    4. Returns a success message and the updated status in the JSON results.


    ### Additional Notes

    Ensure that the provided Policy ID is valid and exists within the Silverfort environment.
