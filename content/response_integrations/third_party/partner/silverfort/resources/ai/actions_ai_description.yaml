Update SA Policy:
  ai_description: >-
    ### General Description

    Updates the protection policy for a service account in Silverfort. This action
    allows configuring various security controls such as blocking, SIEM logging, risk
    level thresholds, allowed protocols, and specific source/destination allowlists.


    ### Flow Description

    1. Extracts the Service Account GUID and policy configuration parameters from
    the action inputs.

    2. Validates the provided risk level and protocols against supported values.

    3. Parses the JSON strings for adding or removing allowed sources and destinations.

    4. Makes a POST request to the Silverfort API to update the service account policy.

    5. Returns a success message and the updated status in the JSON results.


    ### Additional Notes

    - The allowed sources and destinations must be provided as valid JSON arrays of
    objects containing `key` and `key_type` fields.

