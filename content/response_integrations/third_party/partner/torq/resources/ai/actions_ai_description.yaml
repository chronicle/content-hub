Run a Workflow:
  ai_description: >-
    ### General Description

    Triggers a generic Torq workflow by posting a JSON payload to a Torq webhook.
    It can optionally include the current alert payload and poll the Torq Public API
    for the final execution output.


    ### Flow Description

    1. Retrieves integration configurations and action parameters.

    2. Collects minimal case and environment context.

    3. Optionally collects the current alert payload, including its entities.

    4. Constructs a JSON payload containing the workflow input, context, and alert
    data.

    5. Sends a POST request to the Torq webhook URL to trigger the workflow.

    6. If an execution ID is returned, polls the Torq Public API via GET requests
    to retrieve the final execution status and output.

    7. Returns the execution results and output as a JSON result.


    ### Additional Notes

    Polling for the final result requires appropriate API credentials or a bearer
    token to be configured in the integration instance.
