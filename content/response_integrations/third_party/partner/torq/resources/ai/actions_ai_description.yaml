Create a Case:
  ai_description: >-
    ### General Description

    Creates a case in Torq by invoking a workflow via a Webhook. It sends the current
    alert payload and optional deduplication or correlation keys to Torq. If Torq
    API credentials are provided, it can also poll the Torq Public API for the final
    execution output.


    ### Flow Description

    1. Retrieves integration and action configuration parameters.

    2. Collects the current alert data and minimal case context from Google SecOps.

    3. Constructs a JSON payload containing the alert details, context, and optional
    keys.

    4. Sends a POST request to the Torq Webhook URL to trigger the case creation workflow.

    5. If configured with API credentials, polls the Torq Public API via GET requests
    to retrieve the final execution status and output.

    6. Returns the execution results and output as a JSON result in Google SecOps.


    ### Additional Notes

    The action requires a Torq Webhook URL and Secret to function. Polling for results
    requires additional API credentials or a Bearer token.
  ai_short_description: >-
    Creates a case in Torq by triggering a workflow via Webhook with the current alert
    payload, and optionally polls for the execution result.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Triggers a Torq workflow via webhook to create a case.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to a Torq webhook to trigger a workflow that
      creates a case, mutating external data. It does not fetch contextual enrichment
      data, nor does it mutate internal SecOps data, update entities, or create insights.
