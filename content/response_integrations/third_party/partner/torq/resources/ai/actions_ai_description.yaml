Ping:
  ai_description: >-
    ### General Description

    Sends a ping payload to a Torq workflow via a Webhook and optionally polls the
    Torq Public API for the execution result. This action is primarily used to test
    connectivity or trigger a simple workflow in Torq from Google SecOps.


    ### Flow Description

    1. Initializes the Torq manager with the provided integration configuration (URL,
    secret, etc.).

    2. Constructs a JSON payload containing the source, action, label, and case context
    (such as case ID, case name, and environment).

    3. Makes a POST request to the configured Torq webhook URL to trigger the workflow.

    4. If polling parameters are provided, polls the Torq Public API to retrieve the
    final execution status and output.

    5. Outputs the execution details, status code, and final result as a JSON object
    to the SecOps platform.


    ### Additional Notes

    Ensure that the Torq URL and Webhook Secret are correctly configured in the integration
    settings for the action to successfully authenticate and trigger the workflow.
