<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>DomainTools - Domain Profile</title>
  <style>
    :root {
      --widget-bg: #212c44;
      --widget-font-family: 'Source Sans Pro', sans-serif;
      --widget-text-color: #ffffff;
      --scrollbar-bg-color: #6275a3;
      --widget-row-highlight-bg: #2f3d5c;
      --divider-border-color: #3a4a6c;
      --divider-border-width: 1px;
      --sidebar-width: 160px;
      --sidebar-item-active-bg: #3a4a6c;
      --sev-low: #78d9ec;
      --sev-medium: #fff371;
      --sev-high: #fa903e;
      --sev-critical: #ec453b;
      --sev-unspec: #b2b6bd;
    }
    html.light-theme {
      --widget-bg: #ffffff;
      --widget-text-color: #0f1029;
      --scrollbar-bg-color: #d3d8ea;
      --widget-row-highlight-bg: #e5e8f2;
      --divider-border-color: #d3d8ea;
      --sidebar-item-active-bg: #d3d8ea;
      --sev-low: #0088a5;
      --sev-medium: #d6a000;
      --sev-high: #d35400;
      --sev-critical: #c0392b;
      --sev-unspec: #95a5a6;
    }
    html.dark-theme {
      --widget-bg: #232330;
      --widget-text-color: #ffffff;
      --widget-row-highlight-bg: #5f6368;
      --divider-border-color: #303045;
      --sidebar-item-active-bg: #5f6368;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scrollbar-bg-color) transparent; }
    body { font-family: var(--widget-font-family), sans-serif; color: var(--widget-text-color); background: var(--widget-bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: var(--divider-border-width) solid var(--divider-border-color); flex-shrink: 0; }
    .header-title { font: 600 16px/22px var(--widget-font-family); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-logo { font: 700 13px/18px var(--widget-font-family); opacity: 0.7; letter-spacing: 1px; flex-shrink: 0; margin-left: 12px; }

    .wrapper { display: flex; flex: 1; overflow: hidden; }

    .sidebar { width: var(--sidebar-width); min-width: var(--sidebar-width); overflow-y: auto; border-right: var(--divider-border-width) solid var(--divider-border-color); }
    .sidebar-item { padding: 10px 12px; font: 400 13px/18px var(--widget-font-family); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-item:hover { background: var(--widget-row-highlight-bg); }
    .sidebar-item.active { background: var(--sidebar-item-active-bg); font-weight: 600; }

    .main { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }

    .section { display: flex; flex-direction: column; gap: 6px; }
    .section-title { font: 600 11px/16px var(--widget-font-family); text-transform: uppercase; opacity: 0.6; padding-bottom: 4px; border-bottom: var(--divider-border-width) solid var(--divider-border-color); }
    .row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
    .row:hover { background: var(--widget-row-highlight-bg); padding-left: 4px; border-radius: 3px; }
    .key { font: 600 12px/18px var(--widget-font-family); text-transform: uppercase; opacity: 0.7; min-width: 150px; flex-shrink: 0; }
    .val { font: 400 13px/18px var(--widget-font-family); word-break: break-word; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font: 600 11px/16px var(--widget-font-family); text-transform: uppercase; }
    .badge.high_risk { background: rgba(236,69,59,0.2); color: var(--sev-critical); }
    .badge.medium_risk { background: rgba(250,144,62,0.2); color: var(--sev-high); }
    .badge.suspicious { background: rgba(255,243,113,0.2); color: var(--sev-medium); }
    .badge.young_domain { background: rgba(120,217,236,0.2); color: var(--sev-low); }
    .badge.low_risk { background: rgba(178,182,189,0.2); color: var(--sev-unspec); }

    .risk-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .risk-bar { height: 7px; border-radius: 3px; min-width: 4px; }

    a { color: var(--sev-low); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .no-data { opacity: 0.5; font-size: 13px; padding: 20px 0; }
  </style>
</head>
<body>
<div class="header">
  <span class="header-title" id="headerTitle">DomainTools — Domain Profile</span>
  <span class="header-logo">DOMAINTOOLS</span>
</div>
<div class="wrapper">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"><div class="no-data">Loading...</div></div>
</div>
<script>
  const LIGHT_THEME_HEX = "#bdc1c6";
  const DARK_THEME_HEX = "#282837";
  function handleThemeUpdate(event) {
    if (event.source !== window.parent) return;
    const styles = event.data;
    if (typeof styles !== 'object' || styles === null) return;
    const bg = (styles.background || styles.backgroundColor || '').toLowerCase().trim();
    const html = document.documentElement;
    if (bg === LIGHT_THEME_HEX) { html.classList.add('light-theme'); html.classList.remove('dark-theme'); }
    else if (bg === DARK_THEME_HEX) { html.classList.add('dark-theme'); html.classList.remove('light-theme'); }
    else { html.classList.remove('light-theme', 'dark-theme'); }
  }
  window.addEventListener('message', handleThemeUpdate);

  const rawData = [{stepInstanceName}.JsonResult];

  const records = (rawData || []).filter(r => r && r.Entity && r.EntityResult && Object.keys(r.EntityResult).length > 0);

  function riskColor(score) {
    if (score >= 70) return 'var(--sev-critical)';
    if (score >= 40) return 'var(--sev-high)';
    if (score >= 20) return 'var(--sev-medium)';
    return 'var(--sev-unspec)';
  }

  function row(key, val) {
    if (val === undefined || val === null || val === '') return '';
    return `<div class="row"><span class="key">${key}</span><span class="val">${val}</span></div>`;
  }

  function scoreRow(key, score) {
    if (score === undefined || score === null) return '';
    const w = Math.max(4, Math.min(100, score));
    return `<div class="row"><span class="key">${key}</span><span class="val">
      <div class="risk-bar-wrap">
        <div class="risk-bar" style="width:${w}px;background:${riskColor(score)}"></div>${score}
      </div></span></div>`;
  }

  function renderProfile(entity, result) {
    document.getElementById('headerTitle').textContent = `DomainTools — ${entity}`;
    const main = document.getElementById('main');

    const risk = result.risk || {};
    const identity = result.identity || {};
    const registration = result.registration || {};
    const hosting = result.hosting || {};
    const meta = result.metadata || {};
    const history = result.history || {};

    const cat = meta.risk_category || '';
    const irisLink = meta.iris_investigate_link || '';
    const domainLabel = irisLink ? `<a href="${irisLink}" target="_blank">${entity}</a>` : entity;

    const ips = (hosting.ip_addresses || []).map(ip => {
      const addr = (ip.address || {}).value || '';
      return addr;
    }).filter(Boolean).join(', ') || '—';

    const ns = (hosting.name_servers || []).map(n => (n.host || {}).value || '').filter(Boolean).join(', ') || '—';
    const mx = (hosting.mx_servers || []).map(m => (m.host || {}).value || '').filter(Boolean).join(', ') || '—';

    let html = '';

    // Risk section
    html += `<div class="section">
      <div class="section-title">Risk</div>
      ${row('Domain', domainLabel)}
      ${cat ? `<div class="row"><span class="key">Risk Category</span><span class="val"><span class="badge ${cat}">${cat.replace('_',' ')}</span></span></div>` : ''}
      ${scoreRow('Overall Risk Score', risk.overall_risk_score)}
      ${scoreRow('Proximity Score', risk.proximity_risk_score)}
      ${scoreRow('Threat Profile', risk.threat_profile_risk_score)}
      ${scoreRow('Malware Score', risk.malware_risk_score)}
      ${scoreRow('Phishing Score', risk.phishing_risk_score)}
      ${scoreRow('Spam Score', risk.spam_risk_score)}
      ${row('Threats', (risk.threats || []).join(', ') || null)}
      ${row('Evidence', (risk.evidence || []).join(', ') || null)}
      ${row('Domain Age', meta.domain_age_days !== undefined ? meta.domain_age_days + ' days' : null)}
      ${row('Last Enriched', meta.last_enriched)}
    </div>`;

    // Identity section
    html += `<div class="section">
      <div class="section-title">Identity</div>
      ${row('Registrant Name', identity.registrant_name)}
      ${row('Registrant Org', identity.registrant_org)}
      ${row('Registrar', identity.registrar)}
      ${row('SOA Email', (identity.soa_email || []).join(', ') || null)}
      ${row('Email Domains', (identity.email_domains || []).join(', ') || null)}
    </div>`;

    // Registration section
    html += `<div class="section">
      <div class="section-title">Registration</div>
      ${row('Created', registration.create_date)}
      ${row('Expires', registration.expiration_date)}
      ${row('Domain Active', registration.domain_status !== undefined ? (registration.domain_status ? 'Yes' : 'No') : null)}
      ${row('Registrar Status', (registration.registrar_status || []).join(', ') || null)}
    </div>`;

    // Hosting section
    html += `<div class="section">
      <div class="section-title">Hosting</div>
      ${row('IP Addresses', ips)}
      ${row('IP Country', (hosting.ip_country_code || '').toUpperCase() || null)}
      ${row('Name Servers', ns)}
      ${row('MX Servers', mx)}
    </div>`;

    // History section
    if (history.record_count) {
      html += `<div class="section">
        <div class="section-title">WHOIS History</div>
        ${row('Record Count', history.record_count)}
      </div>`;
    }

    main.innerHTML = html;
  }

  function buildSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (records.length <= 1) {
      sidebar.style.display = 'none';
      document.querySelector('.wrapper').style.display = 'block';
    }
    records.forEach((rec, i) => {
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (i === 0 ? ' active' : '');
      item.textContent = rec.Entity;
      item.title = rec.Entity;
      item.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        renderProfile(rec.Entity, rec.EntityResult);
      });
      sidebar.appendChild(item);
    });
  }

  if (records.length === 0) {
    document.getElementById('main').innerHTML = '<div class="no-data">No domain profile data available.</div>';
  } else {
    buildSidebar();
    renderProfile(records[0].Entity, records[0].EntityResult);
  }
</script>
</body>
</html>
