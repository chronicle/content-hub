title: DomainTools - Bulk Enrich Domains
type: html
scope: alert
action_identifier: Bulk Enrich Domains
description: Risk summary with category counts and top domains, plus a searchable/filterable/sortable explorer table for bulk domain enrichment results.
data_definition:
    html_height: 500
    safe_rendering: false
    widget_definition_scope: both
    type: html
condition_group:
    conditions:
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: '['
        match_type: starts_with
        custom_operator_name: null
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: EntityResult
        match_type: contains
        custom_operator_name: null
    logical_operator: and
default_size: full_width
