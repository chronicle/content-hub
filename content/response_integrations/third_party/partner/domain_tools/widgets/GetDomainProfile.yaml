title: DomainTools - Get Domain Profile
type: html
scope: alert
action_identifier: Get Domain Profile
description: Sectioned domain dossier showing risk scores, identity, registration, hosting, and history for enriched domain entities.
data_definition:
    html_height: 500
    safe_rendering: false
    widget_definition_scope: both
    type: html
condition_group:
    conditions:
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: '{stepInstanceName}'
        match_type: not_contains
        custom_operator_name: null
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: ''
        match_type: is_not_empty
        custom_operator_name: null
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: '{}'
        match_type: not_equal
        custom_operator_name: null
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: '[]'
        match_type: not_equal
        custom_operator_name: null
    logical_operator: and
default_size: full_width
