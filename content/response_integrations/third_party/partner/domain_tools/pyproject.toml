[project]
name = "DomainTools"
version = "14.0"
description = "DomainTools turns threat data into threat intelligence. Assess risk of domains and augment malware intel with domain data. In case of any queries, please reach out to memberservices@domaintools.com"
requires-python = ">=3.11,<3.12"
dependencies = [
    "environmentcommon",
    "domaintools-api==2.9.0",
    "tipcommon",
]

[dependency-groups]
dev = [
    "integration-testing",
    "pytest>=9.0.2",
    "pytest-json-report>=1.5.0",
    "soar-sdk",
]

[tool.uv.sources]
environmentcommon = { path = "../../../../../packages/envcommon/whls/EnvironmentCommon-1.0.3-py3-none-any.whl" }
integration-testing = { path = "../../../../../packages/integration_testing_whls/integration_testing-2.2.22-py3-none-any.whl" }
soar-sdk = { git = "https://github.com/chronicle/soar-sdk.git" }
tipcommon = { path = "../../../../../packages/tipcommon/whls/TIPCommon-2.3.0-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
