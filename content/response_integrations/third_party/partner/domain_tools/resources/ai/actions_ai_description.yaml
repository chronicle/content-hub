Bulk Enrich Domains:
  ai_description: >-
    ### General Description

    Batch-enriches up to 100 domains with DomainTools risk scores using the iris_enrich
    API. Returns aggregate statistics by risk category plus per-domain enrichment
    details. Domains can be supplied via action parameter or taken from in-scope case
    entities.


    ### Flow Description

    1. Reads the Domains parameter (comma-separated list) or falls back to in-scope
    URL, HOSTNAME, and DOMAIN entities.

    2. Truncates to BULK_ENRICH_MAX_DOMAINS (100) if exceeded.

    3. Calls DomainTools iris_enrich API in batches of 20.

    4. Counts results by risk category (high_risk, medium_risk, suspicious, young_domain,
    low_risk).

    5. Optionally filters out young_domain entries from the output based on the Include
    Young Domains parameter.

    6. Attaches a JSON result with summary and per-domain details, plus a CSV data table.


    ### Additional Notes

    - Requires the iris-enrich product license.

    - Does not enrich case entities — operates as a standalone lookup.
  ai_short_description: >-
    Batch-enriches up to 100 domains with DomainTools risk scores and returns aggregate
    statistics by risk category.
