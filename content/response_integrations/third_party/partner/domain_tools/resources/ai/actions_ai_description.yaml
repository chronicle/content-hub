Enrich Domain Risk:
  ai_description: >-
    ### General Description

    Enriches Domain, Hostname, and URL entities with DomainTools risk scores using
    the iris_enrich API. Each domain is classified into a risk category (high_risk,
    medium_risk, suspicious, young_domain, or low_risk) and optionally marked as
    suspicious in Google SecOps based on a configurable threshold.


    ### Flow Description

    1. Filters target entities to URL, HOSTNAME, and DOMAIN types.

    2. Extracts the root domain from each entity identifier.

    3. Calls the DomainTools iris_enrich API in batches to retrieve risk scores.

    4. Classifies each domain by risk category based on score and domain age.

    5. Updates entity additional_properties with DT-prefixed enrichment data.

    6. Marks entities as enriched; marks as suspicious if score >= threshold or domain is young.

    7. Attaches a CSV data table and JSON results to the case output.


    ### Additional Notes

    - Requires the iris-enrich product license on the DomainTools account.

    - Young domains (< 30 days old) are always marked suspicious regardless of score.
  ai_short_description: >-
    Enriches Domain, Hostname, and URL entities with DomainTools risk scores and
    classifies them into risk categories using the iris_enrich API.
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Risk Threshold | String | No | Numeric score (0-100). Entities with an overall
    risk score at or above this value are marked as suspicious. Defaults to 70. |
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
