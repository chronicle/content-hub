Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the DomainTools API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Retrieves the integration configuration parameters (Username, API Token, Verify
    SSL).

    2. Initializes the DomainToolsManager, which automatically makes an API call to
    retrieve account information to verify the credentials.

    3. Returns a success message if the connection is established, or a failure message
    otherwise.


    ### Additional Notes

    This action is typically used during the initial setup of the integration to verify
    that the provided credentials are valid and the API is reachable.
