Investigate Domain:
  ai_description: >-
    ### General Description

    Enriches Domain, Hostname, and URL entities using DomainTools Iris Investigate.
    This action retrieves comprehensive threat intelligence, including risk scores,
    analytics, identity, registration, and hosting details.


    ### Flow Description

    1. Extracts the target domain from the `Domain` input parameter. If not provided,
    it iterates over the target entities.

    2. Makes a GET request to the DomainTools Iris Investigate API to fetch threat
    intelligence data for the extracted domains.

    3. Parses the API response to extract detailed domain information.

    4. Updates the target entities with the enriched data as additional properties
    and marks them as enriched.

    5. Attaches JSON results, entity-specific CSV tables, and a summary data table
    to the action results.


    ### Additional Notes

    The action batches domains into chunks of 100 to optimize API calls.
