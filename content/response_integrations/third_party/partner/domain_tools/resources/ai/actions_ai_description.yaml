Get Domain Rdap:
  ai_description: >-
    ### General Description

    Enriches external domain entities with DomainTools threat intelligence data by
    retrieving parsed domain RDAP information. This action fetches registration, contact,
    and DNSSEC details for the specified domains and updates the entities with the
    retrieved data.


    ### Flow Description

    1. Retrieves the `Domain` parameter if provided, creating a temporary domain entity
    for processing.

    2. If the parameter is not provided, iterates over the case's target entities,
    filtering for URL, Hostname, and Domain types.

    3. Extracts the domain string from the entity identifier.

    4. Makes an API call to the DomainTools `parsed_domain_rdap` endpoint to fetch
    RDAP data.

    5. If data is found, updates the entity's `additional_properties` with the flattened
    RDAP information.

    6. Attaches the results as JSON and creates a CSV data table for the enriched
    entities.

    7. Updates the entities in the Google SecOps platform.


    ### Additional Notes

    - Supported entity types: URL, Hostname, Domain.

    - If the `Domain` parameter is provided, the action will only process that specific
    domain and ignore the case entities.
  ai_short_description: >-
    Enriches external domain entities with DomainTools threat intelligence data by
    retrieving parsed domain RDAP information and updating entity properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the DomainTools API to fetch parsed domain
      RDAP data. It does not mutate external data but updates internal entities with
      the retrieved information.
