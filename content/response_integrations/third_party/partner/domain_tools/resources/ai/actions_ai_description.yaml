Get WhoIs History:
  ai_description: >-
    ### General Description

    Enriches Domain, URL, and Hostname entities by retrieving Whois History data from
    DomainTools. This action provides historical context about domain registrations,
    which can be useful for threat intelligence and investigations.


    ### Flow Description

    1. The action checks if a specific `Domain` parameter is provided. If so, it creates
    a temporary domain entity for processing. Otherwise, it iterates over the case's
    target entities, filtering for URL, Hostname, and Domain types.

    2. For each valid entity, it extracts the domain name and makes an API request
    to the DomainTools `whois_history` endpoint.

    3. The retrieved Whois History data is parsed and flattened.

    4. The action updates the entity's `additional_properties` with the flattened
    Whois data.

    5. It attaches the raw results as JSON, creates an entity-specific data table,
    and compiles a summary data table for all enriched entities.

    6. Finally, it updates the enriched entities within the Google SecOps platform.


    ### Additional Notes

    If the `Domain` parameter is provided, the action will only process that specific
    domain and ignore the target entities in the case.
