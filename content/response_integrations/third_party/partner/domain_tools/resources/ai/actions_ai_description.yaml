Get Domain Profile:
  ai_description: >-
    ### General Description

    Builds a comprehensive dossier for each in-scope domain by combining data from
    three DomainTools sources: Iris Investigate (risk scores, identity, registration,
    hosting), Parsed Domain RDAP (registration contacts and statuses), and WHOIS History
    (historical ownership records).


    ### Flow Description

    1. Filters target entities to URL, HOSTNAME, and DOMAIN types.

    2. For each entity, calls iris_investigate, parsed_domain_rdap, and whois_history
    APIs.

    3. Calculates domain age from the create_date and classifies risk category.

    4. Assembles a profile dict with risk, identity, registration, hosting, history,
    and metadata sections.

    5. Marks entities as enriched and updates them in the platform.

    6. Attaches a JSON result and CSV summary table to the case output.


    ### Additional Notes

    - Requires iris-investigate and parsed-domain-rdap product licenses.

    - If RDAP data is not found (has_found=false), that section is omitted from the
    profile but the action still succeeds.
  ai_short_description: >-
    Builds a comprehensive domain profile by combining DomainTools Iris Investigate,
    RDAP, and WHOIS history data for each in-scope domain entity.
