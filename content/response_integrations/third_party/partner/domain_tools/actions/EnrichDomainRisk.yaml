name: Enrich Domain Risk
description: Enrich domain entities with DomainTools risk scores and classify them into risk categories (high_risk, medium_risk, suspicious, young_domain, low_risk). Marks entities as suspicious if their score exceeds the threshold or if the domain is newly registered.
integration_identifier: DomainTools
parameters:
-   name: Risk Threshold
    default_value: '70'
    type: string
    description: Risk score above which a domain entity is marked as suspicious. Defaults to 70.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_domain_risk_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "URL", "DOMAIN"]}'
script_result_name: is_succeed
