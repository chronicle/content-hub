name: Enrich Domain Risk
description: Enrich domain entities with DomainTools risk scores and classify them into risk categories (high_risk, medium_risk, suspicious, young_domain, low_risk). Marks entities as suspicious if their overall risk score meets or exceeds the threshold, or if the domain is newly registered (young_domain).
integration_identifier: DomainTools
parameters:
-   name: Risk Threshold
    default_value: '70'
    type: string
    description: Minimum risk score (0-100) to mark an entity as suspicious. Newly registered domains (young_domain) are always marked suspicious regardless of this value.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/EnrichDomainRisk_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "URL", "DOMAIN"]}'
script_result_name: is_succeed
