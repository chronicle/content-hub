Create Abuse Alert:
  ai_description: >-
    ### General Description

    Creates an abuse alert for a specified entity in the Doppel system. This action
    initiates a state change in the external Doppel environment by submitting the
    provided entity value to their abuse box.


    ### Flow Description

    1. Extracts the target entity value from the action parameters.

    2. Initializes the DoppelManager with the provided API credentials.

    3. Makes a POST request to the Doppel API (`/alert/abuse`) to create the abuse
    alert for the specified entity.

    4. Returns the created alert details as a JSON result attached to the action.


    ### Additional Notes

    The action will fail if the provided entity value is invalid or is protected (e.g.,
    google.com) within Doppel's system.
  ai_short_description: >-
    Creates an abuse alert for a specified entity in the Doppel system and returns
    the alert details.
