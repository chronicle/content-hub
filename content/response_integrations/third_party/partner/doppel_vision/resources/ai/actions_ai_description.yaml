    update_email: false
    update_identity: false
    update_ticket: false
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Alert_ID | String | No | Unique identity for each specific alert in Doppel tenant.
    Note: Either 'Alert_ID' or 'Entity' must be provided. |

    | Entity | String | No | Entity to be alerted. Note: Either 'Entity' or 'Alert_ID'
    must be provided. |

    | Queue_State | Choice | Yes | Queue state value of the Alerts. Values: "doppel_review",
    "needs_confirmation", "monitoring", "taken_down", "actioned", "archived". |

    | Entity_State | Choice | Yes | Entity state of Alerts. Values: "active", "down",
    "parked". |
