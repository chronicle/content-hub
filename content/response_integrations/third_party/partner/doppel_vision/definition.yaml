identifier: DoppelVision
name: DoppelVision
description: This integration connects Doppel's threat intelligence capabilities with Google SecOps to enhance SIEM/SOAR workflows. \n\n Doppel provides real-time threat intelligence, enabling security teams to proactively identify and mitigate cyber threats. By integrating Doppel with Google SecOps, organizations can leverage advanced threat data to improve incident response and overall security posture. \n\nIn case of any queries, please reach out to support@doppel.com.
parameters:
- name: API Version
  default_value: v1
  type: string
  description: Doppel API version to use. Enter v1 or v2. Existing instances keep working
    on v1. v1 uses API Key. v2 uses Client ID and Client Secret (OAuth).
  is_mandatory: false
  integration_identifier: DoppelVision
- name: API Key
  display_name: API Key (V1)
  type: password
  description: Organization API key for Doppel API v1. Required when API Version is
    v1. Leave empty when using v2.
  is_mandatory: false
  integration_identifier: DoppelVision
- name: User API Key
  display_name: User API Key (V1)
  type: password
  description: Optional user API key for Doppel API v1 user-specific authentication.
    Not used for v2.
  is_mandatory: false
  integration_identifier: DoppelVision
- name: Organization Code
  display_name: Organization Code (V1)
  type: string
  description: Optional organization code for Doppel API v1 multi-tenant setups. Not
    used for v2; v2 scopes requests from the OAuth token.
  is_mandatory: false
  integration_identifier: DoppelVision
- name: Client ID
  display_name: Client ID (V2)
  type: string
  description: OAuth Client ID for Doppel API v2. Create it on the Version 2 tab of
    API Settings in Doppel Vision. Required when API Version is v2.
  is_mandatory: false
  integration_identifier: DoppelVision
- name: Client Secret
  display_name: Client Secret (V2)
  type: password
  description: OAuth Client Secret for Doppel API v2. Shown only once when the client
    is created. Required when API Version is v2.
  is_mandatory: false
  integration_identifier: DoppelVision
categories: []
svg_logo_path: resources/logo.svg
image_path: resources/image.png
