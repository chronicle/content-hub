- description: 'Security Fix: The Ping action no longer writes the configured Doppel
    API key to the action log. Customers who ran Ping on an earlier version should
    rotate the API key configured in the DoppelVision integration instance. Removed
    the Create Abuse Alert action: the Doppel API endpoint it called no longer exists,
    so the action failed on every execution. Playbooks that still reference Create
    Abuse Alert must be updated to remove that step. Bug Fix: Get Alerts now completes
    successfully and returns an empty list when no alerts match the provided filters,
    instead of failing the action. Doppel API errors now surface the HTTP status and
    response body in the action error message instead of a generic empty-response
    message. Removed placeholder example values from the Entity and Alert_ID action
    parameters. Added a request timeout so a stalled API call can no longer hold an
    action open indefinitely.'
  version: 7.0
  item_name: DoppelVision
  item_type: Integration
  publish_time: '2026-09-09'
