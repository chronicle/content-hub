creator: Doppel
default_result_value: ''
description: Updates an alert in Doppel. Provide exactly one of Alert_ID or Entity.
    Provide at least one of Queue_State, Entity_State, or Comment.
dynamic_results_metadata:
-   result_example_path: resources/UpdateAlert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
integration_identifier: DoppelVision
name: Update Alert
parameters:
-   default_value: null
    description: Unique identity for each specific alert in Doppel tenant
    is_mandatory: false
    name: Alert_ID
    type: string
-   default_value: https://dummyurl.com
    description: Entity to be alerted
    is_mandatory: false
    name: Entity
    type: string
-   default_value: ''
    description: "Queue state value of the Alerts \nValues : \"doppel_review\",\"\
        needs_confirmation\",\"monitoring\",\"taken_down\",\"actioned\", \"archived\""
    is_mandatory: false
    name: Queue_State
    optional_values:
    - doppel_review
    - needs_confirmation
    - monitoring
    - taken_down
    - actioned
    - archived
    type: ddl
-   default_value: ''
    description: "Entity state of Alerts \nValues : \"active\", \"down\", \"\
        parked\""
    is_mandatory: false
    name: Entity_State
    optional_values:
    - active
    - down
    - parked
    type: ddl
-   default_value: ''
    description: Optional comment to add to the Doppel alert. Sent as the API comment
        field. The latest comment is returned on the alert as notes.
    is_mandatory: false
    name: Comment
    type: string
script_result_name: ScriptResult
