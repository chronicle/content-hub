name: Flare Connector
parameters:
-   name: Flare API Key
    default_value: ''
    type: password
    description: Flare API key
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Flare Tenant ID
    default_value: ''
    type: string
    description: Numeric Flare tenant ID
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Google Service Account JSON
    default_value: ''
    type: password
    description: Service account JSON with Chronicle API ingestion permissions.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Google SecOps Customer ID
    default_value: ''
    type: string
    description: Google SecOps Chronicle customer/instance ID.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Google Cloud Project ID
    default_value: ''
    type: string
    description: Google Cloud project containing the SecOps instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Google SecOps Region
    default_value: us
    type: string
    description: Chronicle API region, for example us or europe.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Severity Filter
    default_value: ''
    type: string
    description: Optional Flare severities (comma-separated or multi-select). Case-insensitive.
        Empty = all severities from Flare /events/filters/severities. Invalid values
        fail the connector test/logs.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Source Types Filter
    default_value: ''
    type: string
    description: Optional Flare source types (comma-separated keys or display names).
        Case-insensitive. Empty = all types from Flare /events/filters/types. Invalid
        values fail the connector test/logs.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Ingest Full Event
    default_value: 'true'
    type: boolean
    description: Enrich each finding with full Flare event detail.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Backfill Range (Days)
    default_value: '0'
    type: string
    description: Days to backfill on first run, or when this value changes (allowed
        0-180; 0 starts from now). Changing Backfill Range resets the checkpoint and
        re-fetches that window with the current filters. Severity/source-type changes
        do not re-fetch history.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Auto Remediate
    default_value: 'false'
    type: boolean
    description: After ingest, remediate Flare events for closed SOAR Flare cases.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: 'true'
    type: boolean
    description: If enabled, the SSL certificate of the Flare API is verified.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: DeviceProductField
    default_value: Flare-IO
    type: string
    description: Device product field for mapping (matches PRODUCT_NAME).
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: flare_uid
    type: string
    description: Event class id for mapping.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '930'
    type: string
    description: Python process timeout seconds.
    is_mandatory: true
    is_advanced: false
    mode: regular
description: 'Flare Connector: poll Flare findings into SOAR alerts. Optional Auto
    Remediate syncs closed SOAR Flare cases using a timestamp checkpoint.'
integration: flare_secops
documentation_link: null
rules: []
is_connector_rules_supported: false
creator: Admin
