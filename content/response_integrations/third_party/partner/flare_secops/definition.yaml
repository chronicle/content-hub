identifier: flare_secops
name: Flare
description: Flare integration for Google SecOps. Polls Flare findings, converts matched_at to native UDM event_timestamp, ingests searchable events through Chronicle events:import, and creates SOAR alerts. Checkpoint, filters, backfill, and optional closed-case remediation are supported.
parameters:
-   name: Flare API Key
    default_value: null
    type: password
    description: API key from the Flare platform.
    is_mandatory: true
    integration_identifier: flare_secops
-   name: Flare Tenant ID
    default_value: null
    type: string
    description: Numeric Flare tenant identifier.
    is_mandatory: true
    integration_identifier: flare_secops
-   name: Google Service Account JSON
    default_value: null
    type: password
    description: Service account JSON with Chronicle API ingestion permissions.
    is_mandatory: true
    integration_identifier: flare_secops
-   name: Google SecOps Customer ID
    default_value: null
    type: string
    description: Google SecOps Chronicle customer/instance ID.
    is_mandatory: true
    integration_identifier: flare_secops
-   name: Google Cloud Project ID
    default_value: null
    type: string
    description: Google Cloud project containing the SecOps instance.
    is_mandatory: true
    integration_identifier: flare_secops
-   name: Google SecOps Region
    default_value: us
    type: string
    description: Chronicle API region, for example us or europe.
    is_mandatory: true
    integration_identifier: flare_secops
-   name: Verify SSL
    default_value: 'true'
    type: boolean
    description: If enabled, the SSL certificate of the Flare API is verified.
    is_mandatory: true
    integration_identifier: flare_secops
categories:
- SOAR
- Security
- Threat Intelligence
svg_logo_path: resources/logo.svg
image_path: resources/image.png
is_available_for_community: false
