[project]
name = "flare_secops"
version = "1.0"
description = "Flare integration for Google SecOps. Polls Flare findings, converts matched_at to native UDM event_timestamp, ingests searchable events through Chronicle events:import, and creates SOAR alerts. Checkpoint, filters, backfill, and optional closed-case remediation are supported.\n\nIn case of any queries, please reach out to ankush.yadav@metronlabs.com."
requires-python = ">=3.11,<3.12"
dependencies = [
    "flareio==2.4.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "environmentcommon",
    "integration-testing",
    "pytest-json-report>=1.5.0",
    "pytest>=8.3.5",
    "soar-sdk",
    "tipcommon",
]

[tool.uv.sources]
soar-sdk = { git = "https://github.com/chronicle/soar-sdk.git" }
integration-testing = { path = "../../../../../packages/integration_testing_whls/integration_testing-2.2.10-py3-none-any.whl" }
tipcommon = { path = "../../../../../packages/tipcommon/whls/TIPCommon-2.2.10-py2.py3-none-any.whl" }
environmentcommon = { path = "../../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
