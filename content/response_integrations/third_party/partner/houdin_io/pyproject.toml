[project]
name = "Houdin-io"
version = "5.0"
description = "Houdin scans an indicator (IP, domain, URL or file hash) against threat intelligence sources in parallel and hands the evidence to MesmerAI, which returns a threat score, a confidence level, tags and a written verdict.\n\nThis integration launches Houdin scans from Google SecOps: enrich the entities of an alert with the verdict, or scan one artifact and read the full scan document. Documentation: https://app.houdin.io/docs/api/google-secops\n\nSupport Contact: support@houdin.io"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "environmentcommon",
    "integration-testing",
    "pytest>=8.4.1",
    "pytest-json-report>=1.5.0",
    "ruff>=0.12.5",
    "soar-sdk",
    "tipcommon",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.tipcommon]
path = "../../../../../packages/tipcommon/whls/TIPCommon-2.4.8-py3-none-any.whl"

[tool.uv.sources.environmentcommon]
path = "../../../../../packages/envcommon/whls/EnvironmentCommon-1.0.3-py3-none-any.whl"

[tool.uv.sources.integration-testing]
path = "../../../../../packages/integration_testing_whls/integration_testing-2.4.8-py3-none-any.whl"
