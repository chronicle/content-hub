Scan Artifact:
  ai_description: >-
    ### General Description

    Launches a scan on a specified artifact using the Houdin.io platform and retrieves
    the analysis results. The action supports various artifact types such as IPv4,
    IPv6, URL, Domain, MD5, SHA1, and SHA256, and allows users to specify particular
    scanners (e.g., VirusTotal, URLScan, AlienVault) to perform the analysis.


    ### Flow Description

    1. Extracts the `artifact` and optional `scanOn` parameters from the action configuration.

    2. Makes a POST request to the Houdin.io API (`/scan/launch`) to initiate a new
    scan job on the provided artifact.

    3. Polls the Houdin.io API (`/scan/result`) using a GET request to retrieve the
    scan results once the job is completed.

    4. Attaches the retrieved scan results to the action's JSON output in Google SecOps.


    ### Additional Notes

    The action runs asynchronously; adjust the script timeout value in the Google
    SecOps IDE as needed to accommodate longer scan times.
  ai_short_description: >-
    Launches a scan on a specified artifact using the Houdin.io platform and retrieves
    the analysis results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a new scan job on the Houdin.io platform via a POST request.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to Houdin.io to initiate a new scan job (mutating
      external state by creating a job record), and then polls via a GET request to
      fetch the resulting threat data. It does not mutate internal SecOps data, update
      entities, create insights, modify alerts, or add case comments.
