  parameters_description: '| Parameter | Type | Mandatory | Description |


    | --- | --- | --- | --- |


    | Scanners | String | No | Houdin scanner shortnames. Empty for the plan''s default set per
    entity type. MesmerAI verdict and summary always included. |


    | Force Rescan | Boolean | No | Skip Houdin''s scan cache and query every source again. |


    | Suspicious Threshold | String | No | Score (0 to 10) at or above which the entity is marked suspicious.
    Default 7; "off" disables. |


    | Create Insight | Boolean | No | Add an entity insight with the verdict, summary and scan link. Default
    true. |'
Ping:
  ai_description: '### General Description


    Tests the connectivity to the Houdin.io API with the configured API key.


    ### Flow Description


    1. Reads the API Root, API Key, and Verify SSL settings from the integration configuration.


    2. Sends `POST /api/v1/ping` to app.houdin.io.


    3. Succeeds when the key is accepted; fails with Houdin''s own error message otherwise (rejected key,
    spent monthly quota).


    ### Additional Notes


    No parameters, no entities. Used to verify the integration setup.'
  ai_short_description: Checks that the configured Houdin.io API key is accepted.
