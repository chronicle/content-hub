Scan Artifact:
  ai_description: '### General Description


    Launches a Houdin scan on one artifact (public IP, domain, URL or file hash) and returns the full
    scan document: the raw answer of every source and the MesmerAI verdict (threat score 0 to 10, confidence,
    tags, summary, related indicators).


    ### Flow Description


    1. First run: sends `POST /api/v1/scan/launch` with the artifact, the optional scanner list (MesmerAI
    modules always appended) and `forceRescan`.


    2. Stores the returned `scanID` in `additional_data`, reads the result once and ends in the IN_PROGRESS
    state when the scan is still running; a cached scan completes in the first run.


    3. Each following run reads the scan once with `POST /api/v1/scan/result` (`scanIDs`): a scan still
    running is left out of the answer (IN_PROGRESS again), otherwise the document is returned.


    4. Attaches the document as the JSON result, adds a link to the scan in the Houdin app and completes
    with a message carrying the verdict line.


    ### Additional Notes


    - Asynchronous: the platform re-runs the action until the scan is done. Set the action timeout to
    three minutes or more when URLScan is in the set.

    - A refusal from Houdin (invalid key, quota, scanner above the plan, no compatible scanner for the
    type) fails the action with Houdin''s message.'
  ai_short_description: Scans one artifact on Houdin.io and returns the scan document with the MesmerAI
    verdict.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
