Enrich Entities:
  ai_description: '### General Description


    Scans every supported entity of the alert on Houdin.io and enriches it with the MesmerAI verdict.
    Supported: public IPv4/IPv6 addresses, URLs, domains and hostnames, MD5, SHA1 and SHA256 hashes.


    ### Flow Description


    1. First run: filters `siemplify.target_entities` by type (ADDRESS only when public, DestinationURL,
    DOMAIN, HOSTNAME with a dot, FILEHASH) and sends one `POST /api/v1/scan/launch` per entity. A refusal
    for one artifact is recorded; a refusal that concerns the account (rejected key, quota, daily cap)
    fails the action.


    2. Keeps `scanID -> entity` in `additional_data` and ends IN_PROGRESS.


    3. Each run reads all pending scans once, in one `POST /api/v1/scan/result` call with `scanIDs`; finished
    scans enrich their entity at once (`Houdin-io_Threat_Score`, `Houdin-io_Confidence`, `Houdin-io_Confidence_Reason`,
    `Houdin-io_AI_Analysis`, `Houdin-io_Tags`, `Houdin-io_Related_IOCs`, `Houdin-io_Sources`, `Houdin-io_Scan_ID`,
    `Houdin-io_Scan_Link`, `Houdin-io_Scan_Time`, `Houdin-io_Unrecorded`), mark the entity suspicious
    when the score reaches the threshold, and add an entity insight when enabled. `siemplify.update_entities`
    saves them.


    4. Once every scan is done, fetches the full documents and attaches `[{Entity, EntityResult}]` as
    the JSON result, then completes; the result value is true, or false when no entity could be scanned.


    ### Additional Notes


    - Asynchronous: the platform re-runs the action until every scan is done, one poll per run at the step''s
    Async Polling Interval. Set the action timeout to three minutes or more when URLScan is in the set.

    - Private IP addresses and hostnames without a dot are skipped.'
  ai_short_description: Scans the alert's IPs, URLs, domains and hashes on Houdin.io and enriches them
    with the MesmerAI threat score, confidence, tags and summary.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: The action fetches scan results from Houdin.io (`fetches_data`), writes enrichment properties
      and the suspicious flag on entities via `siemplify.update_entities` (`can_update_entities`) and
      adds an entity insight via `siemplify.add_entity_insight` when Create Insight is on (`can_create_insight`).
      It does not change external systems, alert data or case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: true
      email_message: false
      event: false
      file_hash: true
      file_name: false
      generic: false
      host_name: true
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: true
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: true
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: The action iterates over `siemplify.target_entities` and keeps URLs (DestinationURL), DOMAIN,
      HOSTNAME containing a dot, FILEHASH, and ADDRESS entities whose identifier is a public IP address.
