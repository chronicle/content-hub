    get_alert_information: false
    reasoning: The action launches a scan on Houdin.io for IOCs (IPs, URLs, Domains, Hashes) and retrieves
      threat intelligence, including a threat score and AI analysis. This aligns with the 'Enrich IOC'
      category.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
