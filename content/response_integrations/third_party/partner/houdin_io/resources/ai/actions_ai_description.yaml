Enrich Entities:
  ai_description: >-
    ### General Description

    Scans compatible entities (Public IPv4/IPv6, URL, Domain, MD5, SHA1, SHA256) using
    Houdin.io and enriches them with the scan results.


    ### Flow Description

    1. Extracts the `scanOn` parameter to determine which scanners to use.

    2. Iterates through target entities and filters for compatible types (URL, external
    IP Address, Domain, File Hash, Destination URL).

    3. Launches a scan for each compatible entity via a POST request to the Houdin.io
    API (`/api/v1/scan/launch`).

    4. Polls the Houdin.io API (`/api/v1/scan/result`) via GET requests to retrieve
    the scan results for all launched scans.

    5. Updates the entities' additional properties with the threat score, AI analysis,
    and analysis sources.

    6. Saves the updated entities back to the platform and adds the raw scan results
    to the action's JSON result.


    ### Additional Notes

    The action runs asynchronously. Ensure the script timeout value in the Google
    SecOps IDE is adjusted as needed.
  ai_short_description: >-
    Scans compatible entities (Public IPs, URLs, Domains, and File Hashes) using Houdin.io
    and enriches them with threat scores and analysis results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by polling scan results from Houdin.io (fetches_data=true).
      While it makes a POST request to launch a scan, this is an analysis request
      and does not mutate external business data like tickets or blocklists (can_mutate_external_data=false).
      It updates the internal entities with the scan results using `siemplify.update_entities`
      (can_update_entities=true). It does not create insights, modify alert data,
      or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: true
      email_message: false
      event: false
      file_hash: true
      file_name: false
      generic: false
      host_name: false
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: true
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: true
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The script iterates over `siemplify.target_entities` and filters them based
      on `entity.entity_type`. It specifically checks for `EntityTypes.URL`, `EntityTypes.ADDRESS`,
      `EntityTypes.DOMAIN`, `EntityTypes.FILEHASH`, and `"DestinationURL"`. For `ADDRESS`
      entities, it also filters by the identifier to ensure the IP is external using
      the `isIPExternal` function. Therefore, it targets Address, Domain, File Hash,
      and URL entities, filtering by entity type and identifier.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: false
    enrich_ioc: true
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action launches a scan on IOCs (IPs, URLs, Domains, Hashes) and retrieves
      threat intelligence (threat score, AI analysis) from Houdin.io. This directly
      aligns with the 'Enrich IOC' expected outcome. It does not perform any containment,
      ticketing, or other external state mutations.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
    search_events: false
    send_email: false
    send_message: false
    submit_file: true
    uncontain_host: false
    update_alert: false
    update_email: false
    update_identity: false
    update_ticket: false
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | scanOn | Multi-Choice | No | (Optional) An array of scanners you want Houdin
    to use. |
Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the Houdin.io API to ensure the integration is configured
    correctly and can communicate with the external service.


    ### Flow Description

    1. Extracts the API Key and Verify SSL settings from the integration configuration.

    2. Initializes the HoudinManager with the provided credentials.

    3. Makes a POST request to the Houdin.io `/ping` API endpoint to verify connectivity.

    4. Returns a success message if the connection is established, or an error message
    if the connection fails.


    ### Additional Notes

    This action is typically used for diagnostic purposes during integration setup
    and does not interact with alerts, entities, or case data.
  ai_short_description: >-
