File Android Analysis:
  ai_description: >-
    ### General Description

    Submits a case attachment to the ANY.RUN Sandbox for analysis using an Android
    Virtual Machine. The action uploads the file, waits for the analysis to complete,
    and retrieves the resulting HTML report and Indicators of Compromise (IOCs). It
    then attaches the HTML report to the case wall and adds a summary of the findings
    as case comments.


    ### Flow Description

    1. Retrieves the first available attachment from the current case.

    2. Submits the attachment to the ANY.RUN Sandbox API (`run_file_analysis`) for
    execution in an Android VM.

    3. Adds a case comment containing a link to the interactive ANY.RUN analysis session.

    4. Polls the ANY.RUN API for the task status until the analysis is completed.

    5. Retrieves the HTML analysis report from the API and saves it as an attachment
    to the case wall.

    6. Retrieves the IOC report from the API and adds a summary of suspicious or malicious
    indicators as a case comment.

    7. Retrieves the final analysis verdict and completes the action.


    ### Additional Notes

    This action requires a valid ANY.RUN Sandbox API Key configured in the integration
    settings. It operates strictly on case attachments and does not process standard
    entity types.
  ai_short_description: >-
    Submits a case attachment to the ANY.RUN Sandbox for analysis using an Android
    VM, retrieves the resulting HTML report, and extracts IOCs to the case wall.
  capabilities:
    can_create_case_comments: true
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads a file to the ANY.RUN sandbox to initiate a new analysis task.
    fetches_data: true
    internal_data_mutation_explanation: >-
      Adds case comments with analysis links and IOC summaries, and attaches the HTML
      analysis report to the case wall.
    reasoning: >-
      The action fetches data by retrieving the analysis report and IOCs from ANY.RUN.
      It mutates external data by submitting a file to the sandbox, which creates
      a new analysis task on the ANY.RUN platform. It mutates internal data by adding
      case comments and saving the HTML report to the case wall. It does not update
      entities or create insights.
