URL Android Analysis:
  ai_description: >-
    ### General Description

    Submits one or more URLs to the ANY.RUN Sandbox for analysis using an Android
    Virtual Machine. It retrieves the analysis report, extracts Indicators of Compromise
    (IOCs), determines the final verdict, and attaches the findings to the case.


    ### Flow Description

    1. Extracts the target URLs and analysis configuration parameters (e.g., timeout,
    network settings, privacy type).

    2. Iterates through the provided URLs and submits each to the ANY.RUN Sandbox
    via the `run_url_analysis` API call.

    3. Adds a case comment containing a link to the interactive analysis session.

    4. Polls the ANY.RUN API (`get_task_status`) until the analysis task completes.

    5. Retrieves the HTML analysis report (`get_analysis_report`) and attaches it
    to the case wall.

    6. Retrieves the IOC report (`get_analysis_report`), parses it for suspicious
    or malicious indicators, and adds the summary as a case comment.

    7. Retrieves the final analysis verdict (`get_analysis_verdict`) and adds it as
    a case comment.


    ### Additional Notes

    The action supports various network and privacy configurations, such as Tor, FakeNet,
    MITM proxy, and residential proxies, allowing for highly customized sandbox execution
    environments.
