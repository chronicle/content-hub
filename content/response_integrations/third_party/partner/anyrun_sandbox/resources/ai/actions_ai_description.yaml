    ### General Description

    Tests connectivity with the ANYRUN Sandbox service to ensure that the integration
    is configured correctly.


    ### Flow Description

    1. Extracts the ANYRUN Sandbox API Key, SSL verification, and proxy settings from
    the integration configuration.

    2. If a proxy is configured, it verifies the proxy connection.

    3. Makes an API call to the ANYRUN Sandbox to check authorization.

    4. Outputs a success message if the connection is valid, otherwise returns an
    error.


    ### Additional Notes

    This action does not process entities or alerts; it is solely for verifying integration
    connectivity.
