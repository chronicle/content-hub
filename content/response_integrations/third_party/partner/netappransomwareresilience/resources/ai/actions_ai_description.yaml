Block User:
  ai_description: >-
    ### General Description

    Blocks a user from accessing resources protected by NetApp Ransomware Resilience.
    This action initiates a state change on the external service to prevent the specified
    user and/or client IPs from accessing resources for a specified duration.


    ### Flow Description

    1. Extracts the `User ID`, `User IPs`, and `Duration` parameters from the action
    configuration.

    2. Calls the NetApp Ransomware Resilience API (`users/block-user`) via a POST
    request to block the user and/or IPs.

    3. Returns the JSON response from the API and updates the action result.


    ### Additional Notes

    - The `User IPs` parameter is required for NFS and optional for CIFS.

    - The `Duration` can be set to permanent or a specific number of hours.
  ai_short_description: >-
    Blocks a user and/or client IPs from accessing resources protected by NetApp Ransomware
    Resilience.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Blocks a user and/or client IPs in NetApp Ransomware Resilience.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a POST request to the NetApp Ransomware Resilience API to
      block a user and/or IPs, mutating external data. It does not fetch contextual
      data, mutate internal data, update entities, or create insights.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
