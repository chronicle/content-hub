Unblock User:
  ai_description: >-
    ### General Description

    Unblocks a user and their associated IP addresses via the NetApp Ransomware Resilience
    Service. This action serves as a remediation step to restore access for a previously
    blocked user.


    ### Flow Description

    1. Extracts the `User ID` and `User IPs` from the action parameters.

    2. Initializes the API manager and handles OAuth authentication.

    3. Makes a POST request to the NetApp RRS API (`users/unblock-user`) to unblock
    the specified user and IPs.

    4. Returns the API response and updates the action result in the SOAR platform.


    ### Additional Notes

    The `User IPs` parameter is required for NFS but optional for CIFS.
  ai_short_description: >-
    Unblocks a user and their associated IP addresses in NetApp Ransomware Resilience.
  capabilities:
    can_create_case_comments: false
