Add Ips to group:
  ai_description: >-
    ### General Description

    Adds IP address entities to a specified address group in Palo Alto Panorama. This
    action modifies the configuration of the firewall management system by appending
    the targeted IP addresses to an existing address group, which can then be used
    in various security policies.


    ### Flow Description

    1. Iterates through the target entities provided in the case and filters for those
    of type `ADDRESS`.

    2. Initiates a connection to the Palo Alto Panorama API.

    3. For each valid IP address, sends a request to add the IP to the specified address
    group within the given device and device group.

    4. Retrieves the updated list of addresses currently residing in the target address
    group.

    5. Returns the updated list as a JSON result and outputs a summary message detailing
    successful and failed additions.


    ### Additional Notes

    Ensure that the specified Device Name, Device Group Name, and Address Group Name
    exist in the Panorama configuration before executing this action. The default
    device name is typically `localhost.localdomain`.
  ai_short_description: >-
    Adds IP address entities to a specified address group in Palo Alto Panorama.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds IP addresses to a specified address group in the Palo Alto Panorama configuration.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by adding IP addresses to an address group
      in Palo Alto Panorama via the API. It does not fetch additional contextual enrichment
      data, nor does it mutate internal SecOps data such as entities, insights, or
      case comments.
