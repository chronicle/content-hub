Commit Changes:
  ai_description: >-
    ### General Description

    Commits pending configuration changes in Palo Alto Panorama. This action applies
    modifications made to the configuration, with an option to restrict the commit
    to only those changes made by the current user.


    ### Flow Description

    1. Initializes the connection to the Palo Alto Panorama instance.

    2. Initiates a commit operation via the Panorama API, applying the `Only My Changes`
    parameter if specified.

    3. Retrieves the job ID for the commit operation.

    4. Asynchronously monitors the commit job status until it finishes successfully
    or fails.

    5. Returns the final status of the commit operation to the playbook.


    ### Additional Notes

    In order to use the "Only My Changes" option, the user authenticated in the integration
    configuration must have admin privileges.
