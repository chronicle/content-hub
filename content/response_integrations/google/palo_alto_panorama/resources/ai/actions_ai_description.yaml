Unblock ips in policy:
  ai_description: >-
    ### General Description

    Unblocks specific IP address entities from a given policy in Palo Alto Panorama.


    ### Flow Description

    1. Extracts the action parameters: Device Name, Device Group Name, Policy Name,
    and Target.

    2. Iterates over the target entities and filters for IP Address entities.

    3. For each IP address, it calls the Palo Alto Panorama API to remove the IP from
    the specified policy's blocklist (either source or destination).

    4. Retrieves the updated list of blocked IPs for the policy and attaches it as
    a JSON result.

    5. Returns a summary message indicating which IPs were successfully unblocked
    and which failed.


    ### Additional Notes

    The `Target` parameter must be strictly set to either "source" or "destination".
