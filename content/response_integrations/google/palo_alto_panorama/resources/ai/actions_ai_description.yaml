Edit Blocked Applications:
  ai_description: >-
    ### General Description

    Blocks or unblocks specified applications on a Palo Alto Panorama device by adding
    or removing them from a given policy.


    ### Flow Description

    1. Extracts the device name, device group name, policy name, and the lists of
    applications to block and unblock from the action parameters.

    2. Calls the Palo Alto Panorama API to retrieve the current candidate configuration
    and the list of currently blocked applications for the specified rule.

    3. Calculates the differences and sends an API request to update the policy with
    the new list of blocked applications.

    4. Retrieves the updated list of blocked applications to verify the changes.

    5. Returns a JSON result containing the affected applications and an output message
    summarizing the blocked and unblocked applications.


    ### Additional Notes

    The action requires the exact device name, device group name, and policy name
    as configured in Palo Alto Panorama. Either 'Applications To Block' or 'Applications
    To UnBlock' should be provided for the action to have an effect.
