    Enriches entities (IP Address, Hostname, Mac Address, User, Email Addresses) using
    information from Axonius. This action retrieves detailed user and device information
    from Axonius and uses it to enrich the corresponding entities within Google SecOps,
    optionally creating insights and data tables.


    ### Flow Description

    1. Initializes the Axonius manager with the provided API credentials.

    2. Iterates through the target entities and groups them into users and devices
    based on their entity type.

    3. Queries Axonius to find matching users and devices based on the entity identifiers.

    4. Retrieves detailed information for each matched entity using its internal Axonius
    ID.

    5. Updates the entities with the retrieved enrichment data.

    6. Creates insights, entity links, and data tables based on the action parameters.

    7. Returns a JSON result containing the detailed information.


    ### Additional Notes

    Supported entities include IP Address, Hostname, Mac Address, and User. User entities
    that match an email regex are treated as email addresses for querying Axonius.
