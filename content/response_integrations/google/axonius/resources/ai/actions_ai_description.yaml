Add Note:
  ai_description: >-
    ### General Description

    Adds a specified note to user and device entities within Axonius.


    ### Flow Description

    1. Iterates through the target entities and filters for supported types (Hostname,
    IP Address, MAC Address, User).

    2. Categorizes the entities into users (differentiating between usernames and
    emails via regex) and devices (IPs, hostnames, MACs).

    3. Makes a POST request to the Axonius API (`/api/V4.0/users` and `/api/V4.0/devices`)
    to search for the corresponding Axonius internal IDs for the provided entities.

    4. Makes a POST request to the Axonius API (`/api/V4.0/users/{id}/notes` and `/api/V4.0/devices/{id}/notes`)
    to append the specified note to each matched user and device.

    5. Returns the note details as JSON results for the successful entities.


    ### Additional Notes

    User entities are evaluated using a regular expression to determine if they should
    be treated as email addresses or usernames during the Axonius search.
  ai_short_description: >-
    Adds a specified note to user and device entities (Hostname, IP, MAC Address,
    User) in Axonius.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a note to the corresponding user or device records in Axonius.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making POST requests to Axonius to search for users
      and devices to retrieve their internal IDs (fetches_data=true). It then mutates
      external data by making POST requests to add notes to those users and devices
      in Axonius (can_mutate_external_data=true). It does not mutate internal SOAR
      data, update entities, or create insights.
  entity_usage:
