Add Tags:
  ai_description: >-
    ### General Description

    Adds specified tags to user and device entities within Axonius. This action allows
    analysts to categorize and label assets (Hostnames, IP Addresses, MAC Addresses)
    and users (Usernames, Email Addresses) directly in the Axonius platform for better
    asset management and tracking.


    ### Flow Description

    1. Extracts the comma-separated list of tags from the action parameters.

    2. Iterates through the target entities and filters for supported types (Hostname,
    IP Address, MAC Address, and User).

    3. Evaluates User entities to determine if they are email addresses or usernames
    based on regex matching.

    4. Queries Axonius via the `get_users` and `get_devices` API endpoints to retrieve
    the internal Axonius IDs for the matching entities.

    5. Calls the `add_tags_to_users` and `add_tags_to_devices` API endpoints (via
    PUT requests) to apply the specified tags to the resolved entities.

    6. Returns a summary of successful and failed tagging operations to the SOAR platform.


    ### Additional Notes

    User entities are automatically categorized as either emails or usernames based
    on a regex check, ensuring the correct Axonius search fields are used during the
    ID resolution phase.
