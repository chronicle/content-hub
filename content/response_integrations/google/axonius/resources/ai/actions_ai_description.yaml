Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Axonius platform using the provided integration configuration
    parameters.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, API Key, API Secret,
    Verify SSL).

    2. Initializes the AxoniusManager with the extracted parameters.

    3. Calls the `test_connectivity` method, which makes a GET request to the `/api/V4.0/settings/meta/about`
    endpoint on the Axonius server.

    4. Returns a success message if the connection is established, otherwise returns
    an error message and fails the action.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can successfully authenticate and communicate with the Axonius API.
