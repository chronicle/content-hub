Ping:
  ai_description: >-
    ### General Description

    Validates connectivity to the Certly API by performing a test lookup on a known
    URL. This action ensures that the integration is correctly configured with valid
    credentials and network access.


    ### Flow Description

    1. Retrieves the API token and root URL from the integration configuration.

    2. Makes a GET request to the Certly API (`/v1/lookup`) using a hardcoded test
    URL (`http://gumblar.cn`).

    3. Evaluates the HTTP response to confirm successful authentication and connectivity.

    4. Returns a success message and the JSON response from the API.


    ### Additional Notes

    This is typically used as a ping or test action to verify integration health and
    does not affect case data.
  ai_short_description: >-
    Validates connectivity to the Certly API by performing a test lookup on a known
    URL.
