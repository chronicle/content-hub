Get Url Status:
  ai_description: >-
    ### General Description

    Queries the Certly service to retrieve reputation and status information for URL
    entities. It evaluates the risk of the URLs, updates the entities with the retrieved
    status, marks them as enriched, and generates insights for any URLs identified
    as malicious.


    ### Flow Description

    1. Iterates through the target entities provided to the action.

    2. Filters the entities to process only those of type URL.

    3. Makes an HTTP GET request to the Certly API (`/v1/lookup`) to fetch the status
    of each URL.

    4. Updates the entity's additional properties with the Certly status and marks
    the entity as enriched.

    5. If the URL is deemed malicious, marks the entity as suspicious and adds an
    insight to the entity.

    6. Updates the enriched entities within the Google SecOps platform.


    ### Additional Notes

    This action relies on integration-level configurations (API Token and API Root)
    to authenticate and communicate with the Certly service.
  ai_short_description: >-
    Queries the Certly service to retrieve reputation and status information for URL
    entities, updating entity properties and generating insights for malicious findings.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Certly API to fetch URL status data (fetches_data=true).
      It does not mutate external data (can_mutate_external_data=false). It updates
      internal entities via `siemplify.update_entities` (can_update_entities=true)
      and creates insights via `siemplify.add_entity_insight` (can_create_insight=true).
