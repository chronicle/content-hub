Update Alert:
  ai_description: >-
    ### General Description

    Updates the status of a specific alert in Cyberint.


    ### Flow Description

    1. Extracts the `Alert ID`, `Status`, and `Closure Reason` parameters.

    2. Validates that if the status is set to 'Closed', a `Closure Reason` is provided.

    3. Makes a PUT request to the Cyberint API (`/alert/api/v1/alerts/status`) to
    update the alert's status and closure reason.

    4. Returns a success message if the update is successful, or an error message
    if it fails.


    ### Additional Notes

    Ensure that the provided Alert ID is valid and exists in Cyberint.
  ai_short_description: >-
    Updates the status and optionally the closure reason of a specific alert in Cyberint.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the status and optionally the closure reason of an alert in Cyberint.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PUT request to the Cyberint API to update the status of an
      alert, which mutates external data. It does not fetch data, mutate internal
      data, update entities, or create insights.
