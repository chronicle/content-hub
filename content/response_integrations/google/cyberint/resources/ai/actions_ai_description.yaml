Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cyberint platform using the provided integration configuration
    parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, API Key, Verify
    SSL).

    2. Initializes the Cyberint API client.

    3. Sends a test request to the Cyberint API to verify connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the Cyberint server. It does not perform any operations
    on alerts or entities.
  ai_short_description: >-
    Tests connectivity to the Cyberint platform to ensure the integration is configured
    correctly.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action only performs a test request to the Cyberint API to verify connectivity.
      It does not fetch contextual data, mutate external or internal data, update
      entities, create insights, modify alerts, or create case comments.
