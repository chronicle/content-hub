name: Enable User
description: Enables the specified user
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/okta#enable_user
integration_identifier: Okta
parameters:
-   name: User IDs Or Logins
    default_value: ''
    type: string
    description: Ids or logins of users in Okta
    is_mandatory: false
-   name: Is Activate
    default_value: 'false'
    type: boolean
    description: Whether to activate the user or just unsuspend
    is_mandatory: false
-   name: Send Email If Activate
    default_value: 'false'
    type: boolean
    description: Whether to send an email after activating or not
    is_mandatory: false
-   name: Also Run On Scope
    default_value: 'false'
    type: boolean
    description: Whether to run on entities as well as the input
    is_mandatory: false
dynamic_results_metadata: []
creator: System
simulation_data_json: '{"Entities": ["HOSTNAME", "USERUNIQNAME"]}'
script_result_name: ScriptResult
