name: Reset Password
description: Generate a one-time token that can be used to reset a user's password
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/okta#reset_password
integration_identifier: Okta
parameters:
-   name: User IDs Or Logins
    default_value: ''
    type: string
    description: Ids or logins of users in Okta
    is_mandatory: false
-   name: Send Email
    default_value: 'false'
    type: boolean
    description: Whether to send an email for the password reset or return the token
        for every user
    is_mandatory: false
-   name: Also Run On Scope
    default_value: 'false'
    type: boolean
    description: Whether to run on entities as well as the input
    is_mandatory: false
dynamic_results_metadata: []
creator: System
simulation_data_json: '{"Entities": ["HOSTNAME", "USERUNIQNAME"]}'
script_result_name: ScriptResult
