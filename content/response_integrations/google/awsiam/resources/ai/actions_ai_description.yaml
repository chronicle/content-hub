Create a User:
  ai_description: >-
    ### General Description

    Creates one or more new IAM users in the specified AWS account. This action allows
    for bulk user creation by accepting comma-separated values but does not apply
    any policies or permissions to the newly created users.


    ### Flow Description

    1. Extracts the `User Name` parameter, which can contain multiple comma-separated
    usernames.

    2. Establishes a connection to the AWS IAM service using the provided integration
    credentials.

    3. Iterates through each provided username and validates that it contains only
    allowed characters (alphanumeric and `+=.@_-`).

    4. Makes an API call to AWS IAM (`create_user`) for each valid username to create
    the new user.

    5. Aggregates the results, handling exceptions for existing users, invalid names,
    or exceeded limits.

    6. Returns a JSON object containing the details of the successfully created users.


    ### Additional Notes

    Usernames must be unique within the AWS account and cannot include spaces. No
    policies are applied at this stage, so the created users will have no permissions
    by default.
