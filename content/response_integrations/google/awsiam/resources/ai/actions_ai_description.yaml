Disable User Access:
  ai_description: >-
    ### General Description

    Disables user access in AWS Identity and Access Management (IAM) by adding an
    explicit deny inline policy. This action effectively revokes the user's permissions
    to interact with AWS resources.


    ### Flow Description

    1. The action filters the target entities to include only those of type User.

    2. For each valid User entity, it extracts the AWS username from the entity's
    original identifier (which is expected to be the user's ARN).

    3. It makes an API call (`put_user_policy`) to AWS IAM to attach an inline policy
    named `DisableUserAccessPolicy` containing a "Deny All" statement.

    4. The action collects the results and outputs a summary of successfully disabled
    users and any failures.


    ### Additional Notes

    - This action specifically targets SOAR User entities.

    - The entity's original identifier should be the full ARN of the AWS IAM user.
