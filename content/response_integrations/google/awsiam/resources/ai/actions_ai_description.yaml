Add a User to a Group:
  ai_description: >-
    ### General Description

    Adds one or more specified users to a specified AWS IAM group. Use groups to apply
    the same permissions policies across multiple users at once.


    ### Flow Description

    1. Extracts the AWS IAM credentials and action parameters (Group Name, User Name).

    2. Connects to the AWS IAM service.

    3. Iterates through the provided list of user names.

    4. For each user, makes an API call (`add_user_to_group`) to AWS IAM to add the
    user to the specified group.

    5. Collects the results and outputs a summary message indicating successful additions
    and any errors encountered.


    ### Additional Notes

    The `User Name` parameter accepts a comma-separated list of users.
  ai_short_description: >-
    Adds one or more specified users to a specified AWS IAM group.
