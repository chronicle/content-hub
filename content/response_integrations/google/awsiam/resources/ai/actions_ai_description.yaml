    from the action parameters.

    2. Establishes a connection to the AWS IAM service using the provided credentials.

    3. Validates the JSON structure of the policy document and ensures the policy
    name contains only allowed characters.

    4. Makes an API call to AWS IAM to create the new policy.

    5. Returns the created policy details as a JSON result and completes the action.


    ### Additional Notes

