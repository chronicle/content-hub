Create a Group:
  ai_description: >-
    ### General Description

    Creates a new IAM group in the AWS account. This action allows administrators
    to programmatically provision new groups within AWS Identity and Access Management
    (IAM).


    ### Flow Description

    1. Extracts the AWS credentials and the target group names from the action parameters.

    2. Establishes a connection to the AWS IAM service.

    3. Iterates over the provided comma-separated group names, validating each name
    against AWS IAM naming constraints.

    4. Makes an API call to AWS IAM (`create_group`) to create each valid group.

    5. Collects the results and returns a JSON object containing the details of the
    successfully created groups.


    ### Additional Notes

    Group names must be unique within the AWS account and can only contain alphanumeric
    characters and/or the following special characters: `+=.@_-`. Spaces are not allowed.
