Attach a Policy:
  ai_description: >-
    ### General Description

    Attaches a specified managed policy to an AWS IAM identity (User, Group, or Role).
    This action modifies the permissions associated with the target identity in AWS.


    ### Flow Description

    1. Initializes the AWS IAM manager with the provided integration credentials.

    2. Validates the provided identity name and policy name to ensure they contain
    valid characters.

    3. Retrieves the Amazon Resource Name (ARN) for the specified policy by querying
    AWS IAM.

    4. Attaches the policy to the specified identity type (User, Group, or Role) via
    the AWS IAM API.

    5. Returns a success message if the policy is attached successfully, or an error
    message if the entity is not found or validation fails.


    ### Additional Notes

    Ensure that the provided identity and policy names are friendly names and not
    ARNs.
