Get Incident Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a specific incident from RSA Archer based
    on the provided Content ID and Application Name.


    ### Flow Description

    1. Authenticates with the RSA Archer API using the provided integration credentials.

    2. Retrieves the application details based on the provided `Application Name`.

    3. Makes a GET request to the RSA Archer API to fetch the incident details using
    the `Content ID` and application alias.

    4. Returns the incident details as a JSON object attached to the action's results.


    ### Additional Notes

    The action requires a valid Content ID. If the application name is not provided,
    it defaults to "Incidents".
