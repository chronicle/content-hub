Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the RSA Archer instance.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, Username, Password,
    Instance Name).

    2. Initializes the `RSAArcherManager`, which attempts to authenticate and retrieve
    a session token via a POST request to the `/api/core/security/login` endpoint.

    3. If the authentication is successful, the action completes and returns a success
    message.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the RSA Archer API.
