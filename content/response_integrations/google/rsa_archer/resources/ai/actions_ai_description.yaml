Add Incident Journal Entry:
  ai_description: >-
    ### General Description

    Adds a new journal entry to a specific Security Incident in RSA Archer.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the Destination
    Content ID and the Text for the journal entry.

    2. Initializes the RSA Archer manager to handle API communications.

    3. Retrieves the necessary internal application IDs, security incident IDs, and
    level IDs from RSA Archer.

    4. Verifies that the specified Security Incident (Destination Content ID) exists.

    5. Makes an API call to RSA Archer to append the provided text as a new journal
    entry to the incident.

    6. Returns the API response as a JSON result and outputs a success or error message
    based on the execution status.


    ### Additional Notes

    Ensure that the provided Destination Content ID corresponds to a valid and existing
    Security Incident in RSA Archer.
  ai_short_description: >-
    Adds a new journal entry to a specific Security Incident in RSA Archer.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a new journal entry to a specific Security Incident in RSA Archer.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to RSA Archer to add a journal entry to a Security
      Incident, which mutates external data. It does not fetch contextual data for
      enrichment, nor does it mutate internal SecOps data, update entities, or create
      insights.
