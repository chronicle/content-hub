    ### General Description

    Creates a new incident in RSA Archer based on the provided details such as summary,
    description, owner, status, priority, and category.


    ### Flow Description

    1. Initializes the RSA Archer manager with the provided credentials.

    2. Parses custom fields and mapping files if provided.

    3. Makes a POST request to the RSA Archer API to create a new incident.

    4. Makes a GET request to retrieve the details of the newly created incident.

    5. Returns the incident ID and adds the incident details to the JSON result.


    ### Additional Notes

    Custom fields can be provided as a JSON object. A custom mapping file can be used
    to map fields. If 'Remote File' is enabled, the mapping file path is treated as
    a URL.
