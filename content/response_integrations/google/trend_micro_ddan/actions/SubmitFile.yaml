name: Submit File
description: 'Submit files in Trend Micro DDAN. Note: Action is running as async,
    adjust the script timeout value in Chronicle SOAR IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/trend-micro-ddan#submit_file
integration_identifier: TrendMicroDDAN
parameters:
-   name: File Paths
    default_value: ''
    type: string
    description: Specify a comma-separated list of the absolute file paths that point
        to the file that needs to be analyzed.
    is_mandatory: true
-   name: Fetch Event Log
    default_value: true
    type: boolean
    description: If enabled, action will fetch event logs related to the files.
    is_mandatory: false
-   name: Fetch Suspicious Objects
    default_value: true
    type: boolean
    description: If enabled, action will fetch suspicious objects.
    is_mandatory: false
-   name: Fetch Sandbox Screenshot
    default_value: false
    type: boolean
    description: If enabled, action will try to fetch a sandbox screenshot related
        to the files.
    is_mandatory: false
-   name: Resubmit File
    default_value: true
    type: boolean
    description: If enabled, action will not check if there was a submission for this
        file previously.
    is_mandatory: false
-   name: Max Event Logs To Return
    default_value: 50
    type: string
    description: 'Specify how many event logs to return. Default: 50. Max: 200.'
    is_mandatory: false
-   name: Max Suspicious Objects To Return
    default_value: 50
    type: string
    description: 'Specify how many suspicious objects to return. Default: 50. Max:
        200.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/submit_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
