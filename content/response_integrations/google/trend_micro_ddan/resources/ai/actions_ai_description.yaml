Submit File URL:
  ai_description: >-
    ### General Description

    Submits a list of URLs to Trend Micro Deep Discovery Analyzer (DDAN) for sandbox
    analysis. This action is designed to handle file analysis by providing the URL
    where the file is hosted. It operates asynchronously, meaning it first submits
    the URLs and then periodically polls the DDAN service until the analysis is complete.
    Once finished, it retrieves a comprehensive report, which can optionally include
    event logs, suspicious objects, and sandbox screenshots.


    ### Flow Description

    1. **Initialization**: Validates that the limit parameters for logs and objects
    are within the allowed range (1-200) and initializes the Trend Micro DDAN manager.

    2. **Registration**: Authenticates and registers the client with the DDAN web
    service.

    3. **Submission (First Run)**: Iterates through the provided URLs. If `Resubmit
    File` is false, it checks the DDAN system for existing analysis results for the
    URL's SHA1 hash. If no duplicate is found or if resubmission is forced, it submits
    the URL to the sandbox for analysis via a POST request.

    4. **Status Polling (Subsequent Runs)**: Checks the status of the analysis for
    each submitted URL. If the analysis is still ongoing, the action remains in the
    'In Progress' state.

    5. **Data Enrichment**: Once the analysis is complete, the action fetches the
    main report. Based on the configuration, it also retrieves event logs, suspicious
    objects, and screenshots.

    6. **Finalization**: Aggregates all retrieved data into a JSON result, unregisters
    the client from the DDAN service, and completes the action.


    ### Additional Notes

    - This action is **asynchronous**. It will transition to an 'In Progress' state
    after submission and will require multiple execution cycles to complete as it
    waits for the sandbox analysis to finish.

    - The action performs a registration and unregistration step with the DDAN web
    service for every execution cycle.
