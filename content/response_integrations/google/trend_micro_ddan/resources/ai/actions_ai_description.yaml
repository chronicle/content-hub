Submit File:
  ai_description: >-
    ### General Description

    Submits local files to Trend Micro Deep Discovery Analyzer (DDAN) for sandbox
    analysis. This action operates asynchronously, uploading files and polling the
    DDAN service until analysis reports are ready. It can optionally retrieve supplemental
    data such as event logs, suspicious objects, and sandbox screenshots.


    ### Flow Description

    1. Validates input limits and registers the client with the DDAN manager.

    2. For each file path, calculates the SHA1 hash.

    3. If `Resubmit File` is false, checks if a report already exists. If not, uploads
    the file to the DDAN sandbox via a POST request.

    4. In subsequent asynchronous runs, checks the status of the analysis.

    5. Once analysis is complete, fetches the main report, event logs, suspicious
    objects, and screenshots via GET requests.

    6. Aggregates all retrieved data into a JSON result and completes the execution.


    ### Additional Notes

    This action is asynchronous and does not run on SecOps entities; it processes
    file paths provided directly as a parameter.
  ai_short_description: >-
    Submits local files to Trend Micro Deep Discovery Analyzer (DDAN) for sandbox
    analysis and retrieves the resulting reports.
