Ping:
  ai_description: >-
    ### General Description

    The Ping action is designed to verify the connectivity between Google SecOps and
    the Trend Micro Deep Discovery Analyzer (DDAN) server. It ensures that the provided
    configuration parameters are correct and that the network path is open.


    ### Flow Description

    1. Retrieves the integration configuration parameters.

    2. Initializes the Trend Micro DDAN Manager.

    3. Makes an API call to the registration endpoint (`/web_service/sample_upload/register`)
    to establish a session context with the DDAN server.

    4. Makes an API call to the test connection endpoint (`/web_service/sample_upload/test_connection`)
    to verify end-to-end communication.

    5. Makes an API call to the unregister endpoint (`/web_service/sample_upload/unregister`)
    to automatically unregister the session from the DDAN server and ensure no stale
    registrations remain.


    ### Additional Notes

    This action does not process any entities and is strictly used for integration
    health checks.
  ai_short_description: >-
    Verifies the connectivity between Google SecOps and the Trend Micro Deep Discovery
    Analyzer (DDAN) server.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
