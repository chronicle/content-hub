Get All Recipients By Sender:
  ai_description: >-
    ### General Description

    Retrieves a list of recipients who received emails from a specified sender using
    Cisco IronPort. This action queries the IronPort message tracking API to find
    all messages originating from the given sender within a defined time frame and
    extracts the recipient addresses.


    ### Flow Description

    1. Initializes the connection to the Cisco IronPort API using the provided credentials.

    2. Calculates the search time window based on the `Search Emails for Last X` and
    `Set Search Email Period in` parameters.

    3. Iteratively sends GET requests to the IronPort `message-tracking/messages`
    endpoint to fetch pages of messages matching the specified sender.

    4. Extracts and aggregates the recipient email addresses from the retrieved messages,
    respecting the `Max Recipients to Return` limit.

    5. Returns the aggregated list of recipients as a JSON object and completes the
    action.


    ### Additional Notes

    This action runs asynchronously to handle large volumes of messages and prevent
    timeouts. Ensure that message tracking and the AsyncOS API are enabled in IronPort
    for this action to function correctly.
  ai_short_description: >-
    Retrieves a list of recipients who received emails from a specific sender within
    a given time frame using Cisco IronPort.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches message data from the IronPort API using a GET request. It
      does not mutate external data, update internal entities, create insights, or
      modify alert data.
  entity_usage:
    entity_types:
