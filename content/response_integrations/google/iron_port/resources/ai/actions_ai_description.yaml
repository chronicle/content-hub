    of emails processed by Ironport, if big enough value will be provided action can
    time out. |

    | Set Search Email Period in | Dropdown | Yes | Specify if search emails should
    be done with the period of days or hours. |

    | Max Recipients to Return | String | No | Specify how many recipients action
    should return. |

    | Page Size | String | No | Specify the page size for the action to use when searching
    for emails. |
Get All Recipients By Subject:
  ai_description: >-
    ### General Description

    Retrieves a list of all recipients who received an email with a specific subject
    from Cisco IronPort.


    ### Flow Description

    1. Initializes the connection to the Cisco IronPort AsyncOS API using the provided
    credentials.

    2. Calculates the search time frame based on the 'Search Emails for Last X' and
    'Set Search Email Period in' parameters.

    3. Iteratively fetches pages of messages matching the specified subject within
    the calculated time frame.

    4. Extracts the recipients from the fetched messages and aggregates them into
    a list.

    5. Handles pagination and script timeouts, saving the current state if necessary
    to continue fetching in subsequent asynchronous runs.

    6. Returns the aggregated list of recipients as a JSON result.


    ### Additional Notes

    For this action to work, message tracking must be enabled in IronPort, along with
    the AsyncOS API.
