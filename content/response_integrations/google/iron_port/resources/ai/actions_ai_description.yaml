Get Report:
  ai_description: >-
    ### General Description

    Fetches specific Ironport report information from Cisco IronPort. Depending on
    the selected report type, it can run on User, Address, or Hostname entities to
    enrich them with report data, or it can run without entities to retrieve general
    report data.


    ### Flow Description

    1. Initializes the IronPort API client with the provided credentials.

    2. Determines the applicable entity types based on the selected report type.

    3. Fetches the report data from IronPort for the specified time frame and limit
    via a GET request.

    4. If entities are applicable, filters the retrieved reports by entity identifier,
    enriches the entities with the report data, and attaches an entity-specific data
    table.

    5. If no entities are applicable, attaches a general data table containing the
    report results.


    ### Additional Notes

    Supported entity types include User, Address, and Hostname. The `mail_sender_ip_hostname_detail`
    and `mail_incoming_ip_hostname_detail` reports work based on Address or Hostname
    entities, while `mail_users_detail` works on User entities. Other reports work
    without entities.
  ai_short_description: >-
    Fetches specific Ironport report information from Cisco IronPort and enriches
    applicable entities with the retrieved data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches report data from the IronPort API using a GET request (fetches_data=true).
      It does not mutate any external data. It updates the internal entities by adding
      the report data to their additional_properties and setting is_enriched to True
      (can_update_entities=true). It does not create insights, modify alert data,
      or create case comments.
  entity_usage:
