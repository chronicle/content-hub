    reasoning: >-
      The action queries the mail server (IronPort) to identify emails based on a
      specific sender and extracts the recipients. This aligns with the 'Search Email'
      expected outcome.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
