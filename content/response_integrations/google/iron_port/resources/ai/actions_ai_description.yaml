Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cisco IronPort server to ensure the integration is configured
    correctly and authentication is successful.


    ### Flow Description

    1. Extracts the integration configuration parameters (Server Address, Port, Username,
    Password, SSL settings, etc.).

    2. Initializes the IronPort API manager.

    3. Attempts to authenticate and retrieve a JWT token from the IronPort server
    via a POST request to the login endpoint.

    4. Returns a success message if the connection and authentication are successful,
    or an error message if they fail.


    ### Additional Notes

    This action is typically used for troubleshooting and verifying integration settings.
    It does not require any action-specific parameters as it relies entirely on the
    integration's configuration.
