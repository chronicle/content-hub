Add Tag To Device:
  ai_description: >-
    ### General Description

    Adds a specified tag to a device in McAfee Mvision ePO V2 based on the provided
    entity identifiers.


    ### Flow Description

    1. Initializes the connection to the McAfee Mvision ePO V2 API using the provided
    credentials.

    2. Queries the API to verify the existence of the specified tag and retrieves
    its details.

    3. Iterates through the target entities (Address and Hostname).

    4. For each entity, queries the McAfee API to find the corresponding device.

    5. Makes a POST request to the McAfee API to assign the tag to the identified
    device.

    6. Compiles and returns a summary message detailing successful tag additions,
    missing devices, and any errors encountered.


    ### Additional Notes

    Ensure that the tag specified in the 'Tag Name' parameter already exists in McAfee
    Mvision ePO V2. If the tag does not exist, the action will fail.
  ai_short_description: >-
    Adds a specified tag to a device in McAfee Mvision ePO V2.
