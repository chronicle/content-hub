Enrich Endpoint:
  ai_description: >-
    ### General Description

    Enriches Endpoint entities (IP Addresses and Hostnames) by fetching device system
    information from McAfee Mvision ePO V2. This action retrieves contextual metadata
    about the endpoint, such as the operating system, agent version, and associated
    username, to aid in investigations.


    ### Flow Description

    1. Iterates over the target entities, filtering for Address and Hostname entity
    types.

    2. For each suitable entity, makes an API call (GET request) to McAfee Mvision
    ePO V2 to search for the device by its IP address or hostname.

    3. If a matching device is found, extracts system information (e.g., OS type,
    agent version, tags, username).

    4. Updates the entity's additional properties with the retrieved data and marks
    the entity as enriched.

    5. Creates an insight for the entity containing key device details.

    6. Adds a data table and JSON results to the action output.


    ### Additional Notes

    - The action will fail to enrich entities if the device cannot be found in McAfee
    Mvision ePO V2.
