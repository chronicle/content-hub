Remove Tag From Device:
  ai_description: >-
    ### General Description

    Removes a specified tag from a device (endpoint) in McAfee Mvision ePO V2. This
    action allows analysts to dynamically update the classification or grouping of
    an endpoint by removing a tag based on its IP address or hostname.


    ### Flow Description

    1. Establishes a connection to the McAfee Mvision ePO V2 API using the provided
    credentials.

    2. Queries the API to find the tag ID associated with the provided `Tag Name`
    parameter.

    3. Iterates through the target entities, specifically filtering for `Address`
    (IP) and `Hostname` entity types.

    4. For each suitable entity, searches for the corresponding device in McAfee Mvision
    ePO V2 using the entity's identifier.

    5. Makes a DELETE request to the McAfee Mvision ePO V2 API to remove the tag from
    the matched device.

    6. Aggregates the results and returns a summary message detailing which entities
    were successfully processed and which failed.


    ### Additional Notes

    If the specified tag does not exist in McAfee Mvision ePO V2, the action will
    fail and prompt the user to verify the tag name.
