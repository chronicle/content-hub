Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the McAfee Mvision ePO V2 server to ensure that the integration
    is configured correctly and can successfully communicate with the API.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Root, IAM Root,
    Client ID, Client Secret, API Key, Scopes, etc.).

    2. Initializes the `McAfeeMvisionEPOV2Manager` which automatically attempts to
    authenticate and retrieve an access token.

    3. Makes a test API call (GET request to `/epo/v2/devices` with a limit of 1)
    to verify that data can be successfully fetched.

    4. Returns a success message if the connection and test API call succeed, or a
    failure message if an error occurs.


    ### Additional Notes

    This action does not process any entities or alerts and is solely used for diagnostic
    and configuration verification purposes.
