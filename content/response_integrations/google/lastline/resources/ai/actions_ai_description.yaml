Submit File:
  ai_description: >-
    ### General Description

    Submits a file to Lastline for analysis. The action takes a local file path as
    input, uploads the file to the Lastline sandbox, and optionally waits for the
    analysis report to be generated.


    ### Flow Description

    1. Initializes the Lastline manager with the provided API credentials.

    2. Submits the file located at the specified `File Path` to Lastline via a POST
    request to the `/papi/analysis/submit_file` endpoint.

    3. If `Wait for the report?` is set to True, the action enters an asynchronous
    loop, periodically checking the task status via a GET request to the `/papi/analysis/get_progress`
    endpoint.

    4. Once the analysis is complete, it retrieves the results via a GET request to
    the `/papi/analysis/get_result` endpoint.

    5. Outputs the analysis results as JSON and optionally as a data table.


    ### Additional Notes

    This action does not operate on Google SecOps entities. The full path to the file
    must be provided as an input parameter.
  ai_short_description: >-
    Submits a file to the Lastline sandbox for analysis and optionally waits to retrieve
    the analysis report.
