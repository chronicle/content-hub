Get Analysis Results:
  ai_description: >-
    ### General Description

    Enriches FileHash and URL entities with previously completed analysis task results
    from Lastline. This action retrieves the latest available analysis report for
    the provided entities, evaluates their risk score against a threshold, and updates
    the entities with the enrichment data.


    ### Flow Description

    1. Iterates over the target entities and filters for `URL` and `FILEHASH` entity
    types.

    2. Validates the URL format or extracts the MD5/SHA1 hash from the entity identifier.

    3. Makes an API call (GET request) to Lastline to search the analysis history
    for the specific entity.

    4. If a successful analysis is found, extracts the task UUID of the latest scan.

    5. Makes an API call (GET request) to Lastline to fetch the detailed analysis
    report using the task UUID.

    6. Optionally creates an insight for the entity based on the report data.

    7. Evaluates the analysis score against the provided `Threshold`; if the score
    exceeds the threshold, the entity is marked as suspicious.

    8. Enriches the entity's additional properties with the analysis data and updates
    the entity in the SecOps platform.


    ### Additional Notes

    - The action supports file hashes in MD5 and SHA1 formats.

    - It always fetches the latest analysis available for the provided entity in Lastline.
  ai_short_description: >-
    Enriches FileHash and URL entities by retrieving previously completed analysis
    task results from Lastline.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from Lastline using GET requests (`search_analysis_history`
      and `get_result`). It does not mutate external data. It updates internal entities
      (`siemplify.update_entities`) and creates insights (`siemplify.add_entity_insight`).
      It does not modify alert data or create case comments.
