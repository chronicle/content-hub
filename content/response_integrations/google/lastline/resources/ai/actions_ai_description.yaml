Submit URL:
  ai_description: >-
    ### General Description

    Submits a URL to the Lastline service for analysis. This action creates a new
    analysis task in Lastline and can optionally wait for the analysis to complete
    to retrieve the final report.


    ### Flow Description

    1. Extracts the Lastline configuration and action parameters, including the URL
    to analyze and whether to wait for the report.

    2. Initializes the `LastlineManager` to interact with the Lastline API.

    3. If it is the first run, it calls the Lastline API to submit the URL and create
    an analysis task.

    4. If `Wait for the report?` is set to true, the action enters an asynchronous
    loop, periodically checking the progress of the analysis task.

    5. Once the task is completed, it fetches the analysis results and attaches them
    to the action as a JSON result and a CSV data table.

    6. If `Wait for the report?` is false, the action completes immediately after
    successfully submitting the URL.


    ### Additional Notes

    This action does not operate on Siemplify entities directly from the case. The
    URL to be analyzed must be provided explicitly via the 'URL For Analysis' input
    parameter.
