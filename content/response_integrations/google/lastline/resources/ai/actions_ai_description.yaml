    parameters such as submission name, type, and time frame. This action retrieves
    historical analysis data without operating on specific case entities.


    ### Flow Description

    1. Extracts action parameters including submission name, submission type, and
    time frame.

    2. Validates and formats the submission type (URL or FileHash) and calculates
    the time frame.

    3. Makes a GET request to the Lastline API (`/papi/analysis/get_history`) to search
    for analysis history matching the criteria.

    4. Parses the response and returns the analysis history as a JSON result and a
    CSV data table.


