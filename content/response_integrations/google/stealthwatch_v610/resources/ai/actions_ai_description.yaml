Search Flows:
  ai_description: >-
    ### General Description

    Retrieves network flow data associated with specific IP addresses from Cisco Secure
    Network Analytics (Stealthwatch) within a specified timeframe. This action queries
    the Stealthwatch API to find flows where the target IP address acts as either
    the source or the destination, returning the combined telemetry data.


    ### Flow Description

    1. Iterates through the target entities provided in the case, filtering specifically
    for IP addresses (ADDRESS).

    2. For each IP address, queries Stealthwatch to determine its associated domain
    ID.

    3. Initiates a flow search via the Stealthwatch API for network flows where the
    IP address is the source.

    4. Retrieves the search results for the source flows.

    5. Initiates a second flow search for network flows where the IP address is the
    destination.

    6. Retrieves the search results for the destination flows and combines them with
    the source flows.

    7. Attaches the combined flow data to the entity as a JSON result and a CSV table
    in the case wall.


    ### Additional Notes

    The action requires a timeframe (in hours) to look back and a limit for the maximum
    number of flows to retrieve per search.
