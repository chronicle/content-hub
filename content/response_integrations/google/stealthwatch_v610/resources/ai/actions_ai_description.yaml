Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Stealthwatch server to verify that the integration is
    configured correctly.


    ### Flow Description

    1. Retrieves the integration configurations (API Root, Username, Password).

    2. Initializes the StealthwatchManager.

    3. Makes an API call to the Stealthwatch server to fetch domains, verifying the
    connection and authentication.

    4. Returns a success message if the connection is established.


    ### Additional Notes

    This action is typically used during the initial setup of the integration to ensure
    that the provided credentials and API root are valid.
  ai_short_description: >-
    Tests connectivity to the Stealthwatch server to verify that the integration is
    configured correctly.
