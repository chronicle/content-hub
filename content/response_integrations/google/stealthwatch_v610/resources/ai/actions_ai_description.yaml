Search Events:
  ai_description: >-
    ### General Description

    Retrieves security events for specific IP address entities within a given timeframe
    from Cisco Secure Network Analytics (Stealthwatch). The action queries the Stealthwatch
    API to find events where the target IP address acts as either the source or destination,
    and attaches the findings to the case.


    ### Flow Description

    1. Initializes the Stealthwatch manager with the provided integration credentials.

    2. Calculates the start and end times for the search based on the provided `Timeframe`
    parameter.

    3. Iterates through the target entities, filtering specifically for IP addresses
    (ADDRESS).

    4. For each IP address, retrieves its associated domain ID via a GET request to
    the Stealthwatch API.

    5. Initiates an event search (POST request) where the IP is the source, and retrieves
    the results (GET request).

    6. Initiates a second event search (POST request) where the IP is the destination,
    and retrieves the results (GET request).

    7. Aggregates the results and attaches them to the action's results as JSON and
    a CSV-formatted entity table.


    ### Additional Notes

    This action only processes entities of type ADDRESS. Other entity types will be
    ignored.
  ai_short_description: >-
    Retrieves security events for specific IP address entities within a given timeframe
    from Cisco Secure Network Analytics (Stealthwatch).
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by querying the Stealthwatch API for domain IDs and
      security events. It does not mutate external data (the POST requests are for
      initiating search queries, not changing system state). It does not mutate internal
      data, update entities, create insights, modify alert data, or create case comments;
      it only attaches JSON and table results to the action output.
