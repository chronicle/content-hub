Unisolate Machine:
  ai_description: >-
    ### General Description

    Unisolates a machine in Cisco AMP based on IP Address or Hostname entities. This
    action restores network communication capabilities for previously isolated endpoints.


    ### Flow Description

    1. Iterates over the target entities provided in the case.

    2. Filters entities to process only IP Addresses and Hostnames.

    3. For each valid entity, makes a GET request to the Cisco AMP API to fetch the
    computer information and retrieve its connector GUID.

    4. Makes a DELETE request to the Cisco AMP API to unisolate the machine using
    the retrieved connector GUID.

    5. Updates the successfully processed entities in the platform.

    6. Attaches the unisolation details as JSON results to the action.


    ### Additional Notes

    The action uses the `is_internal` property of IP Address entities to determine
    whether to query for an internal or external IP in Cisco AMP.
  ai_short_description: >-
    Unisolates a machine in Cisco AMP based on IP Address or Hostname entities, restoring
    its network communication capabilities.
