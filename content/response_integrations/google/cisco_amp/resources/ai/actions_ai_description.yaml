Get Computer Info:
  ai_description: >-
    ### General Description

    Retrieves detailed computer information from Cisco AMP for specified Hostname
    and IP Address entities. This action fetches contextual metadata about the asset
    and enriches the entities within the SecOps platform.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Evaluates each entity to determine if it is an IP Address or a Hostname.

    3. For IP Address entities, makes a GET request to the Cisco AMP API (`/v1/computers`)
    to fetch computer details, passing the entity's `is_internal` flag to specify
    the search scope.

    4. For Hostname entities, makes a GET request to the Cisco AMP API (`/v1/computers`)
    to fetch computer details by hostname.

    5. If a matching computer is found, enriches the entity's `additional_properties`
    with the retrieved data (e.g., Operating System, Install Date, Connector Version).

    6. Attaches a CSV table containing the computer details to the entity.

    7. Updates the enriched entities in the Google SecOps platform.

    8. Returns the raw JSON results of the fetched computer information.


    ### Additional Notes

    If multiple computers match the IP or Hostname, the action retrieves the first
    one returned by the API.
