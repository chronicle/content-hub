      The action makes a POST request to the Cisco AMP API to add a file hash to a
      file list, which mutates external data. It does not fetch contextual data for
      enrichment. It calls `siemplify.update_entities` to update the entities in the
      platform, but does not create insights, modify alert data, or create case comments.
