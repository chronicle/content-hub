Add File To File List:
  ai_description: >-
    ### General Description

    Adds SHA-256 file hash entities to a specified file list in Cisco AMP. This action
    is typically used to add malicious file hashes to a custom detection or application
    blocking list to prevent execution.


    ### Flow Description

    1. Retrieves the file list GUID from Cisco AMP using the provided 'File List Name'
    parameter.

    2. Iterates through the target entities and filters for File Hash entities that
    are valid SHA-256 hashes (64 characters in length).

    3. Makes a POST request to the Cisco AMP API to add each valid SHA-256 hash to
    the specified file list along with the provided description.

    4. Updates the successfully processed entities in the SecOps platform.


    ### Additional Notes

    Only SHA-256 file hashes are supported by this action. Hashes of other types or
    lengths will be skipped.
  ai_short_description: >-
    Adds SHA-256 file hash entities to a specified file list in Cisco AMP.
