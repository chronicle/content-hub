Get Computers By Network Activity (URL):
  ai_description: >-
    ### General Description

    This action queries Cisco AMP to fetch a list of computers that have connected
    to a specific hostname or URL. It enriches the target entities with this prevalence
    data, providing visibility into which internal assets have interacted with the
    indicator.


    ### Flow Description

    1. Iterates through the target entities, filtering specifically for Hostname and
    URL entity types.

    2. For each valid entity, makes a GET request to the Cisco AMP API (`/v1/computers/activity`)
    to retrieve computer activity associated with the hostname or URL.

