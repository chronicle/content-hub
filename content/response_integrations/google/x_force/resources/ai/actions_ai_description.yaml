Get Hash Info:
  ai_description: >-
    ### General Description

    Queries IBM X-Force to retrieve threat intelligence and reputation information
    for File Hash entities. It retrieves details such as risk score, malware families,
    and creation date to enrich the entities and evaluate their risk level.


    ### Flow Description

    1. Iterates over target entities and filters for File Hash entities.

    2. Makes a GET request to the IBM X-Force API (`/malware/{file_hash}`) to fetch
    hash information.

    3. Extracts the risk score and malware families from the API response.

    4. Enriches the entity with the extracted data and marks it as enriched.

    5. Evaluates the risk score against the provided threshold parameter. If the risk
    score exceeds the threshold, marks the entity as suspicious and creates an insight.

    6. Updates the entities in the SecOps platform.

    7. Attaches the raw JSON results and a summary data table to the action results.


    ### Additional Notes

    Entities that are not found in IBM X-Force or encounter access denied errors are
    skipped and logged in the output message.
