Get IP Malware:
  ai_description: >-
    ### General Description

    Queries IBM X-Force to retrieve malware information associated with external IP
    address entities. This action helps analysts understand the threat landscape of
    an IP by identifying any known malware families or hashes linked to it.


    ### Flow Description

    1. Iterates through the target entities, filtering for those of type `ADDRESS`
    that are not marked as internal.

    2. For each valid entity, makes a GET request to the IBM X-Force API (`/ipr/malware/{ip_address}`)
    to fetch associated malware reports.

    3. If malware data is found, constructs a CSV table containing details such as
    MD5, Domain, First Seen, Last Seen, and Families, and attaches it to the entity.

    4. Enriches the entity's additional properties with the total malware count.

    5. If the malware count is greater than zero, marks the entity as suspicious and
    generates an insight indicating the malware association.

    6. Updates the enriched entities within the Google SecOps platform and returns
    the raw JSON results.


    ### Additional Notes

    - This action only processes external IP addresses. Internal IP addresses are
    skipped.
