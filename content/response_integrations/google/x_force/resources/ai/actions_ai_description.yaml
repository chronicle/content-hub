Get IP Info:
  ai_description: >-
    ### General Description

    Queries IBM X-Force to retrieve threat intelligence and reputation information
    for IP address entities. This action fetches contextual data such as risk scores,
    categorization, and geographic location to enrich the entities and evaluate their
    potential threat level.


    ### Flow Description

    1. Iterates over the target entities provided in the case, filtering for entities
    of type `ADDRESS` that are not marked as internal.

    2. For each valid entity, makes a GET request to the IBM X-Force API (`/ipr/{ip_address}`)
    to fetch the IP reputation report.

    3. Extracts the risk score, category descriptions, and country from the API response.

    4. Enriches the entity's additional properties with the extracted data and marks
    the entity as enriched.

    5. Evaluates the risk score against the provided `Threshold` parameter. If the
    score exceeds the threshold, the entity is marked as suspicious and an insight
    is created.

    6. Attaches the raw JSON report, an entity-specific history table, and a summary
    data table to the action results.

    7. Updates the modified entities within the Google SecOps platform.


    ### Additional Notes

    - Internal IP addresses are automatically skipped and will not be queried against
    the IBM X-Force API.

    - If the `Threshold` parameter is not provided, it defaults to 1.
