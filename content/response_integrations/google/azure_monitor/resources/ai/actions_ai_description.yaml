Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is designed to verify the connectivity between Google SecOps
    and the Azure Monitor service. It ensures that the provided credentials (Tenant
    ID, Client ID, Client Secret) and the Workspace ID are valid and that the network
    path to the Azure Log Analytics API is open.


    ### Flow Description

    1. **Authentication**: The action retrieves the integration configuration and
    performs an OAuth2 Client Credentials flow to obtain an access token from the
    Microsoft identity platform.

    2. **Connectivity Test**: It sends a POST request to the Azure Monitor Query API
    endpoint (`/v1/workspaces/{workspace_id}/query`).

    3. **Validation**: The request includes a simple query (`AzureActivity`) limited
    to a single row and a one-hour time window to verify the API is responsive.

    4. **Result**: If the API returns a successful response, the action reports a
    successful connection. Otherwise, it parses the error message from the response
    and reports a failure.


    ### Additional Notes

    This action is typically used during the initial setup of the integration or for
    troubleshooting connection issues. It performs a minimal query against the AzureActivity
    table to confirm end-to-end communication.
  ai_short_description: >-
    Verifies connectivity between Google SecOps and the Azure Monitor service by authenticating
    and executing a minimal test query.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Azure Monitor API to test connectivity.
      It does not fetch contextual data for alerts/entities, mutate external data
      (it only runs a read-only query), mutate internal data, update entities, create
      insights, modify alert data, or create case comments.
