Get Ip Info:
  ai_description: >-
    ### General Description

    Queries DShield to retrieve threat intelligence and information about external
    IP addresses. This action fetches data such as block counts and attack targets,
    enriching the corresponding entities within the platform.


    ### Flow Description

    1. Iterates through the target entities, filtering for external IP addresses (entities
    where `entity_type` is ADDRESS and `is_internal` is false).

    2. Makes a GET request to the DShield API (`/ip/{ip}`) for each valid IP address
    to fetch threat data.

    3. Enriches the entity's `additional_properties` with the retrieved DShield data.

    4. Attaches a CSV table containing the IP information to the entity.

    5. Updates the entity's `is_enriched` status to true and saves the updated entities
    back to the platform.

    6. Returns a JSON result containing the raw data for all successfully enriched
    IPs.


    ### Additional Notes

    Internal IP addresses are explicitly skipped by this action.
  ai_short_description: >-
    Queries DShield to retrieve threat intelligence and information about external
    IP addresses, enriching the entities with the retrieved data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the DShield API using a GET request (fetches_data=true).
      It does not mutate any external data (can_mutate_external_data=false). It updates
      internal entities by modifying their additional_properties and is_enriched flags,
      and calls siemplify.update_entities (can_update_entities=true). It does not
      create insights, modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
