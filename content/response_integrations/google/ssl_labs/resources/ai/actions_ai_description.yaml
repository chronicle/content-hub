Analyse Entity:
  ai_description: >-
    ### General Description

    Analyzes Hostname and URL entities using SSL Labs to retrieve SSL/TLS configuration
    grades and endpoint details. It evaluates the lowest grade against a configured
    warning threshold, updates the entity's suspicious status if the threshold is
    exceeded, and enriches the entity's additional properties with the analysis results.


    ### Flow Description

    1. Iterates through the target entities in the case.

    2. Filters entities to process only those of type Hostname and URL.

    3. Makes a GET request to the SSL Labs API (`/analyze`) to initiate and fetch
    the analysis report for each entity.

    4. Extracts the SSL grades for each endpoint and updates the entity's additional
    properties.

    5. Evaluates the lowest grade against the configured warning threshold and marks
    the entity as suspicious if the threshold is exceeded.

    6. Updates the entities in the Google SecOps platform and attaches the raw JSON
    results to the action output.


    ### Additional Notes

    The action relies on integration-level configurations (Warning Threshold, Verify
    SSL) and does not require action-specific parameters.
  ai_short_description: >-
    Analyzes Hostname and URL entities using SSL Labs to retrieve SSL/TLS configuration
    grades and updates the entity's suspicious status based on a configured warning
    threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes GET requests to the SSL Labs API to fetch analysis data for
      URLs and Hostnames (fetches_data=true). It does not mutate external data or
      internal case data other than entities. It updates the entities with the fetched
      grades and suspicious status (can_update_entities=true). It does not create
      insights, modify alert data, or create case comments.
