Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the SSL Labs API. This action verifies that the integration
    is properly configured and can successfully communicate with the SSL Labs service.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (such as Verify SSL).

    2. Initializes the SSL Labs manager with the provided configuration.

    3. Makes an HTTP GET request to the SSL Labs `/info` API endpoint to verify connectivity.

    4. Returns a success message to the SOAR platform if the connection is established
    without errors.


    ### Additional Notes

    This is a standard ping action used primarily for validating integration health,
    network access, and credentials. It does not process alerts or entities.
  ai_short_description: >-
