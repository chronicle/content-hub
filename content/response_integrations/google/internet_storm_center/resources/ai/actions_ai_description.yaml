Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP Address entities using information from the Internet Storm Center.
    This action retrieves threat intelligence data such as attack counts, first and
    last seen dates, and associated threat feeds to provide context on potentially
    malicious IP addresses.


    ### Flow Description

    1. Filters the target entities to include only IP Addresses.

    2. For each IP address, makes a GET request to the Internet Storm Center API (`/api/ip/{address}`)
    to fetch device information.

    3. Updates the entity's `additional_properties` with the retrieved data and marks
    the entity as enriched.

    4. If the `Create Insight` parameter is enabled, generates an insight containing
    the retrieved information and attaches it to the entity.

    5. Attaches the retrieved data as JSON and table results to the action.


    ### Additional Notes

    This action runs asynchronously to accommodate potential API rate limiting and
    long execution times.
  ai_short_description: >-
    Enriches IP Address entities by retrieving threat intelligence data from the Internet
    Storm Center.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Internet Storm Center API to fetch device
      information for IP addresses. It does not mutate external data. It updates internal
      entities with the fetched data and creates insights if configured to do so.
