Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Internet Storm Center API to verify that the integration
    is configured correctly.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (Email Address, Verify
    SSL).

    2. Initializes the Internet Storm Center manager.

    3. Sends a GET request to the Internet Storm Center ping endpoint (`/api/handler?json=null`).

    4. Validates the HTTP response and returns a success or failure message based
    on the connectivity test.


    ### Additional Notes

    This action does not require any action-specific parameters and does not process
    any entities. It is primarily used for troubleshooting and verifying the integration
    setup.
  ai_short_description: >-
    Tests connectivity to the Internet Storm Center API to verify integration configuration.
