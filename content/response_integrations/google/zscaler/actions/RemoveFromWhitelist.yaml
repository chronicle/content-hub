name: Remove From Whitelist
description: Removes a URL/Domain/IP from the white-listed URLs
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/zscaler#remove_from_whitelist
integration_identifier: Zscaler
parameters:
-   name: IOCs
    default_value: ''
    type: string
    description: 'A comma-separated list of IOCs (IP Addresses, URLs, or Domains)
        to remove from the whitelist. Example: "10.1.1.1, google.com, http://badsite.net"'
    is_mandatory: false
dynamic_results_metadata: []
creator: Admin
simulation_data_json: '{"Entities": ["HOSTNAME", "DestinationURL", "ADDRESS", "DOMAIN"]}'
