name: Add To Whitelist
description: 'Adds a URL/Domain/IP to the white-listed URLs. '
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/zscaler#add_to_whitelist
integration_identifier: Zscaler
parameters:
-   name: IOCs
    default_value: ''
    type: string
    description: 'A comma-separated list of IOCs (IP Addresses, URLs, or Domains)
        to add to the whitelist. Example: "10.1.1.1, google.com, http://badsite.net"'
    is_mandatory: false
dynamic_results_metadata: []
creator: Admin
simulation_data_json: '{"Entities": ["HOSTNAME", "DestinationURL", "ADDRESS", "DOMAIN"]}'
