Get Whitelist:
  ai_description: "### General Description\nThis action retrieves a list of whitelisted\
    \ (unblocked) URLs from the Zscaler security configuration. It is used to audit\
    \ or verify which URLs are currently permitted within the Zscaler environment,\
    \ providing visibility into the organization's web security policy.\n\n### Flow\
    \ Description\n1. **Authentication**: The action authenticates with the Zscaler\
    \ API using the provided integration credentials.\n2. **Data Retrieval**: It makes\
    \ a GET request to the Zscaler `/security` endpoint to fetch the current configuration,\
    \ specifically extracting the `whitelistUrls` key.\n3. **Processing**: If whitelisted\
    \ URLs are found, the action calculates the total count and prepares the list\
    \ for output.\n4. **Output Generation**: \n    * A CSV table named \"Whitelist\
    \ Urls\" is created containing each unblocked URL.\n    * The full JSON response\
    \ from Zscaler is attached to the action results.\n    * A summary message indicating\
    \ the number of URLs found is returned to the SOAR case wall.\n\n### Additional\
    \ Notes\nThis action operates globally on the Zscaler configuration and does not\
    \ require any specific entities to execute."
  ai_short_description: >-
    Retrieves a list of whitelisted (unblocked) URLs from the Zscaler security configuration
    to provide visibility into permitted web traffic.
  capabilities:
