Add Comment To Entity:
  ai_description: >-
    ### General Description

    The **Add Comment To Entity** action allows security analysts to programmatically
    add custom text comments to entities within the Google Threat Intelligence (GTI)
    platform. This action is designed to facilitate collaboration and documentation
    by attaching investigative notes directly to the threat intelligence records of
    specific indicators. It supports a variety of entity types, including IP Addresses,
    File Hashes (MD5, SHA-1, SHA-256), URLs, Hostnames, and Domains.


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves the mandatory `Comment` string
    from the user input.

    2. **Connectivity Verification:** It performs a connectivity test to ensure the
    integration can communicate with the Google Threat Intelligence API.

    3. **Entity Processing:** The action iterates through all entities provided in
    the current Google SecOps context.

    4. **Type Validation:** It filters the entities to ensure they match the supported
    types: `ADDRESS`, `FILEHASH`, `URL`, `HOSTNAME`, or `DOMAIN`.

    5. **External API Call:** For each valid entity, the action sends a POST request
    to the corresponding GTI endpoint (e.g., `/api/v3/ip_addresses/{identifier}/comments`)
    to attach the user-provided comment.

    6. **Status Reporting:** The action tracks the success or failure of each comment
    submission and provides a summary message to the analyst, along with a detailed
    JSON result mapping each entity to its completion status ("Done" or "Not done").


    ### Additional Notes

    - If a duplicate comment is submitted, the API returns a 409 status code, which
    the action handles gracefully and considers a successful operation.
