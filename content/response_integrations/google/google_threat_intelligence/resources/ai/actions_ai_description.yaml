Enrich Entities:
  ai_description: >-
    ### General Description

    The **Enrich Entities** action leverages Google Threat Intelligence (GTI) to provide
    comprehensive enrichment for various security entities within Google SecOps. It
    retrieves reputation data, threat scores, engine analysis, and metadata for IP
    addresses, URLs, Hostnames, Domains, Hashes, Threat Actors, and CVEs. The action
    can also perform risk assessments based on user-defined thresholds, update entity
    suspicious status, and provide augmented UI widgets for analysts.


    ### Flow Description

    1. **Filter Entities:** Identifies supported entities (IP, URL, Hostname, Domain,
    Hash, Threat Actor, CVE) from the current context.

    2. **Submission Check:** For submittable types (URL/Hash), determines if a new
    scan is required based on the 'Resubmit' parameters and the age of the last analysis.

    3. **Analysis Submission:** If required, submits entities to GTI for analysis
    via POST requests and enters an 'In Progress' state to wait for results.

    4. **Data Retrieval:** Fetches core threat intelligence, including the GTI threat
