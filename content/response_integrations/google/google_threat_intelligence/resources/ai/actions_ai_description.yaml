Submit File:
  ai_description: >-
    ### General Description

    Submits files or URLs to Google Threat Intelligence (GTI) for analysis and retrieves
    detailed threat reports. This action supports multiple submission methods, including
    local file paths, remote Linux server paths (via SFTP), and public URLs. It can
    operate in public or private submission modes and includes an optional 'Check
    Hash First' feature to avoid redundant uploads if a recent analysis already exists.
    The action retrieves comprehensive enrichment data, including MITRE ATT&CK techniques
    and community comments. It also performs an automated risk assessment based on
    user-defined GTI scores and antivirus engine detection thresholds.


    ### Flow Description

    1. **Validation**: Checks that either file paths or URLs are provided and validates
    threshold parameters.

    2. **File Collection**: Downloads files from provided URLs or retrieves them from
    local/remote file systems.

    3. **Pre-Submission Check**: If 'Check Hash First' is active, it generates a SHA-256
    hash and queries GTI. If a recent report exists, it skips the upload.

    4. **Submission**: Obtains an upload URL from GTI and submits the file content
    or URL for analysis via API.

    5. **Asynchronous Polling**: The action enters a polling state, checking the analysis
    status until completion.

    6. **Result Retrieval**: Once finished, it fetches the full report, including
    optional MITRE data and comments.

    7. **Risk Assessment**: Applies user-defined logic to determine if the file is
    considered risky.

    8. **Output**: Populates data tables with analysis results and comments, and attaches
    report links to the case.


    ### Additional Notes

    - **Mandatory Input**: At least one of the "File Paths" or "External URLs" parameters
    must be configured for the action to run.

    - **Remote Retrieval**: If "Linux Server Address" is provided, the action will
    attempt to fetch files from that server using SFTP.

    - **Risk Assessment**: The `is_risky` flag in the output is determined by evaluating
    the GTI Score, Engine Threshold, or Engine Percentage Threshold against the retrieved
    results.
  ai_short_description: >-
    Submits files or URLs to Google Threat Intelligence (GTI) for analysis and retrieves
    detailed threat reports.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
