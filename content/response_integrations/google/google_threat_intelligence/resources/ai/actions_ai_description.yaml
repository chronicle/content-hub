Download File:
  ai_description: >-
    ### General Description

    The **Download File** action retrieves the binary content of a file associated
    with a specific hash (MD5, SHA-1, or SHA-256) from Google Threat Intelligence
    and saves it to a local directory on the Google SecOps SOAR execution environment.


    ### Flow Description

    1. **Entity Filtering**: The action identifies all `FILEHASH` entities in the
    current context.

    2. **Hash Validation**: It validates that each hash identifier matches the expected
    length for MD5, SHA-1, or SHA-256.

    3. **Path Preparation**: For each valid hash, it constructs the target file path
    using the provided **Download Folder Path**. It checks for existing files and
    respects the **Overwrite** setting.

    4. **API Interaction**: The action performs a GET request to the Google Threat
    Intelligence API (`api/v3/files/{entity_hash}/download`) to retrieve the file's
    binary content.

    5. **File Persistence**: The retrieved content is written to the local filesystem
    of the SOAR runner.

    6. **Result Aggregation**: The action returns a JSON object containing the absolute
    paths of all successfully downloaded files and updates the execution message with
    success/failure details per entity.


    ### Additional Notes

    - The execution environment (worker/runner) must have the necessary filesystem
    permissions to write to the provided **Download Folder Path**.

    - This action does not modify any data within the Google Threat Intelligence platform
    or the SecOps case data model.
