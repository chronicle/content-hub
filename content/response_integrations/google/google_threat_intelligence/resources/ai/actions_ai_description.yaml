Add ASM Issue Note:
  ai_description: >-
    ### General Description

    The **Add ASM Issue Note** action allows users to append a text-based note or
    analysis to a specific Attack Surface Management (ASM) issue within Google Threat
    Intelligence. This is primarily used for documentation, collaboration, and tracking
    the progress of security investigations related to external attack surface findings.
    This action does not process or interact with Google SecOps entities; instead,
    it targets a specific alert ID provided as an input parameter.


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves the 'Alert ID' and the 'Text'
    of the note from the user input.

    2. **Connectivity & Context Setup:** The action verifies connectivity to the Google
    Threat Intelligence API and resolves the internal Project ID associated with the
    configured ASM project name.

    3. **API Interaction:** It sends a POST request to the Google Threat Intelligence
    ASM notes endpoint (`api/v3/asm/notes/issue/{item_id}`), passing the provided
    text in the request body.

    4. **Outcome Reporting:** If the API returns a success status, the action provides
    a confirmation message indicating that the alert was successfully updated.


    ### Additional Notes

    This action does not run on entities and relies entirely on the provided Alert
    ID to target the correct ASM issue.
  ai_short_description: >-
    Appends a text-based note or analysis to a specific Attack Surface Management
    (ASM) issue within Google Threat Intelligence.
