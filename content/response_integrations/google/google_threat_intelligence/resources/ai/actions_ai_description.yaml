    ### General Description

    Adds a reputation vote (verdict) to supported entities in Google Threat Intelligence
    (GTI). This action allows security analysts to contribute to threat intelligence
    by marking entities as 'Malicious' or 'Harmless' directly from Google SecOps.
    It supports IP Addresses, File Hashes (MD5, SHA-1, SHA-256), URLs, Hostnames,
    and Domains.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the 'Vote' parameter and validates
    it against the allowed options ('Malicious', 'Harmless').

    2. **Connectivity Check**: It verifies the connection to the Google Threat Intelligence
    API.

    3. **Entity Filtering**: The action iterates through the target entities and filters
    for supported types: ADDRESS, FILEHASH, URL, HOSTNAME, and DOMAIN.

    4. **API Interaction**: For each supported entity, it sends a POST request to
    the corresponding GTI endpoint (e.g., `/ip_addresses/{id}/votes` or `/files/{id}/votes`)
