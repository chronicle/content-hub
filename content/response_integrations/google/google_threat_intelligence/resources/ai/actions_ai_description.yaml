Search ASM Entities:
  ai_description: >-
    ### General Description

    The **Search ASM Entities** action allows users to search for Attack Surface Management
    (ASM) entities within Google Threat Intelligence. It is designed as a discovery
    and search tool to identify assets based on specific security criteria such as
    vulnerability counts, issue counts, and severity levels. Unlike enrichment actions,
    this action does not process or modify existing entities within a Google SecOps
    case; instead, it queries the external ASM database and returns the results as
    structured JSON for use in playbooks.


    ### Flow Description

    1. **Initialization**: The action extracts and validates input parameters, ensuring
    that counts are positive and the result limit is within the allowed range (1-200).

    2. **Project Resolution**: It identifies the correct ASM Project ID based on the
    provided 'Project Name' or the integration default.

    3. **Query Building**: A search query string is constructed by combining the provided
    filters (names, tags, vulnerability/issue thresholds, and severity requirements).

    4. **API Request**: The action sends a GET request to the Google Threat Intelligence
    ASM search endpoint using the constructed query.

    5. **Pagination**: If the number of results exceeds the internal page size, the
    action paginates through the API responses until the 'Max Entities To Return'
    limit is reached.

    6. **Completion**: The raw data for all found entities is compiled into a JSON
    array and returned as the action's result.


    ### Additional Notes

    - **No Entity Context**: This action does not run on the entities currently present
    in the Google SecOps alert/case. It is a standalone search utility.

    - **Output**: The results are provided in the `JsonResult` for downstream playbook
    logic.
