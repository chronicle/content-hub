    (ASM) issues within Google Threat Intelligence. It provides a comprehensive set
    of filters to narrow down results based on project names, specific issue or entity
    identifiers, severity levels, statuses, and time ranges. This action is designed
    as a data retrieval utility and does not operate on Google SecOps entities directly.


