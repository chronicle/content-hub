Get Related IOCs:
  ai_description: >-
    ### General Description

    The **Get Related IOCs** action retrieves information about Indicators of Compromise
    (IOCs) that are related to existing Google SecOps entities using threat intelligence
    from Google Threat Intelligence (GTI). It allows analysts to pivot from a known
    entity (like an IP or File Hash) to discover associated infrastructure, such as
    communicating files, resolving domains, or redirecting URLs.


    ### Flow Description

    1. **Validation**: The action validates that the `Max IOCs To Return` is a positive
    integer and that the requested `IOC Types` are supported by the integration.

    2. **Entity Filtering**: It identifies suitable entities within the current context
    that match the supported types (IP, URL, Hostname, Domain, Hash, or Threat Actor).

    3. **Threat Actor Resolution**: If the entity is a Threat Actor, the action first
    queries GTI to resolve the actor's unique identifier based on its name.

    4. **Relationship Querying**: For each entity and requested IOC type, the action
    looks up the appropriate relationship (e.g., 'contacted_ips' for a File) and queries
    the GTI API.

    5. **Pagination**: The action iterates through relationship levels (e.g., primary
    and secondary associations) until the specified `Max IOCs To Return` limit is
    reached or no more data is available.

    6. **Result Aggregation**: The retrieved IOCs are compiled into a structured JSON
    object, mapped back to the original entity identifier, and returned to the Google
    SecOps platform.


    ### Additional Notes

    - **Supported Entities**: This action runs on IP Address, URL, Hostname, Domain,
    Hash, and Threat Actor entities.

    - **Hash Support**: For file entities, the action supports MD5, SHA-1, and SHA-256
    formats.

    - **Relationship Logic**: The action uses a predefined relationship map to determine
    how entities are linked (e.g., an IP address might have 'resolutions' to Domains
    or 'communicating_files' to Hashes).
