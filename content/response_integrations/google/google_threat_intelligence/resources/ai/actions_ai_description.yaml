Execute IOC Search:
  ai_description: >-
    ### General Description

    The **Execute IOC Search** action enables users to perform complex queries against
    the Google Threat Intelligence (GTI) database to identify Indicators of Compromise
    (IOCs). It supports GTI's advanced search syntax, allowing for granular filtering
    based on attributes like YARA rules, file properties, and network indicators.


    ### Flow Description

    1. **Initialization:** The action extracts the `Search Query` and `Max Results
    To Return` parameters.

    2. **Validation:** It validates that the result limit is a positive integer and
    does not exceed the maximum allowed value of 200.

    3. **Connectivity Check:** Verifies that the integration can successfully communicate
    with the Google Threat Intelligence API.

    4. **API Request:** Executes a GET request to the GTI intelligence search endpoint
    (`api/v3/intelligence/search`) with the provided query and limit.

    5. **Data Processing:** Parses the returned IOC data and formats it into a shortened
    JSON structure.

    6. **Output:** Returns the search results to the SOAR platform for use in playbooks
    or manual investigation.


    ### Additional Notes

    This action is a global search utility and does not automatically process or filter
    entities associated with the current case. It is primarily used to gather broad
    threat intelligence based on specific search criteria.
