Private Submit URL:
  ai_description: >-
    ### General Description

    The **Private Submit URL** action submits specific URLs for private analysis within
    Google Threat Intelligence (GTI). It supports both manual URL inputs and URL entities
    found within the case context. The action triggers a new scan request for URLs
    that have not been previously analyzed or require a fresh assessment, and then
    enriches the entities with the resulting threat intelligence.


    ### Flow Description

    1. **Input Collection:** The action gathers URLs from the `URL` parameter and
    identifies all URL entities within the current SOAR case scope.

    2. **Pre-check (Optional):** If `Check Existing Submissions First` is enabled,
    the action queries GTI for existing public or private reports for each URL.

    3. **Submission:** If no report is found, or if the existing report exceeds the
    `Resubmit After (Days)` age threshold, the action performs a POST request to GTI
    to initiate a private analysis scan.

    4. **Asynchronous Polling:** The action transitions to an asynchronous state,
    periodically polling the GTI API to check the status of the analysis.

    5. **Data Retrieval & Enrichment:** Once the analysis is complete, the action
    fetches the full report via a GET request. It then updates the URL entities in
    Google SecOps with enrichment data (such as threat scores, categories, and verdicts)
    and marks entities as suspicious if GTI returns a malicious verdict.

    6. **Reporting:** The action adds direct links to the GTI reports on the Case
    Wall for easy access by analysts.


    ### Additional Notes

    - This action is specifically designed for private submissions. For general reputation
    lookups without triggering new scans, the 'Enrich Entities' action is recommended.

    - The action is asynchronous and will continue to run in the background until
    all URLs are processed or a timeout occurs.
