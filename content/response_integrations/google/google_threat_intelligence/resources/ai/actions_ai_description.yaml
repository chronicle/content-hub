    ### General Description

    Retrieves information about associations (reports, campaigns, IOC collections,
    malware families, vulnerabilities, threat actors) related to specific entities
    using Google Threat Intelligence.


    ### Flow Description

    1. Extracts and validates action parameters.

    2. Filters target entities to include only supported types (IP, URL, Filehash,
    Hostname, Domain).

    3. Queries the Google Threat Intelligence API (`get_related_associations`) to
    fetch related associations for each supported entity based on the specified association
    types and limits.

    4. If 'Report' is requested, makes an additional API call to fetch related threat
    reports.

    5. If the 'Create Entity' parameter is enabled, creates new entities in the case
    for discovered Threat Actors, Campaigns, or CVEs and establishes a visual relationship
    link to the original entity via the `ExtendCaseGraph` endpoint.

    6. Compiles the retrieved data into a JSON result and provides a summary message.


    ### Additional Notes

    Only MD5, SHA-1, and SHA-256 hashes are supported.
