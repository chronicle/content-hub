Enrich IOCs:
  ai_description: >-
    ### General Description

    Enriches a provided list of Indicators of Compromise (IOCs) using Google Threat
    Intelligence (GTI). Unlike standard enrichment actions, this action does not process
    existing Google SecOps entities. Instead, it takes a manual list of IOC strings
    as input and retrieves comprehensive threat intelligence, including reputation
    scores, analysis results, and visual widgets.


    ### Flow Description

    1. **Validation**: The action validates the provided IOC list, the selected IOC
    type, and the widget theme.

    2. **Connectivity Check**: Verifies the connection to the Google Threat Intelligence
    API.

    3. **Data Retrieval**: For each IOC in the input list, the action calls the GTI
    API (`get_ioc_details`) to fetch detailed metadata and reputation data.

    4. **Widget Generation**: Requests a visual report widget (`get_widget`) from
    GTI based on the selected theme.

    5. **Internal Updates**: For every successful retrieval, the action adds a data
    table to the case and creates an external entity link pointing to the GTI report.

    6. **Output**: Consolidates all retrieved data into a JSON result and provides
    a summary message of successful and failed enrichments.


    ### Additional Notes

    This action is useful for ad-hoc enrichment of IOCs that are not necessarily extracted
    as entities within the case.
