Update ASM Issue:
  ai_description: >-
    ### General Description

    Updates the status of an Attack Surface Management (ASM) issue within the Google
    Threat Intelligence platform. This action allows users to programmatically manage
    the lifecycle of security issues by transitioning them between various states
    such as 'New', 'In Progress', 'Resolved', or 'False Positive'. It is designed
    to work as a standalone management task and does not require Google SecOps entities
    to execute.


    ### Flow Description

    1. Extracts the 'Issue ID' and 'Status' parameters from the action configuration.

    2. Maps the selected human-readable status to the corresponding internal API status
    code.

    3. Validates that a valid status has been provided.

    4. Tests connectivity to the Google Threat Intelligence API.

    5. Sends a POST request to the Google Threat Intelligence API to update the status
    of the specified ASM issue.

    6. Returns a success message and the updated issue data as a JSON result.


    ### Additional Notes

    - The 'Status' parameter defaults to 'Select One'. If the action is executed with
    this default value, it will fail with a validation error.
