  ai_description: >-
    ### General Description

    The **Get Graph Details** action retrieves comprehensive information about specific
    graphs within Google Threat Intelligence (GTI). It allows users to input a list
    of Graph IDs and receive detailed metadata, including node information and connection
    links. This action is primarily used for investigative purposes to understand
    the relationships and context captured within a GTI graph.


    ### Flow Description

    1. **Parameter Extraction & Validation**: The action parses the provided Graph
    IDs and ensures the maximum links parameter is a positive integer.

    2. **Connectivity Check**: Verifies that the integration can successfully communicate
    with the Google Threat Intelligence API.

    3. **Data Retrieval**: Iterates through each Graph ID, making a request to the
    GTI API to fetch the graph's attributes and link data.

    4. **Result Processing**: Aggregates the raw JSON data for all successfully retrieved
    graphs and constructs CSV-formatted data tables for each graph, detailing the
    source, target, and connection type of the links.

    5. **Output**: Updates the action results with the JSON data and appends the link
    tables to the case wall for visibility.


    ### Additional Notes

    * This action does **not** operate on Google SecOps entities (like IPs or Domains).
    It relies entirely on the provided Graph IDs.

    * If a Graph ID is not found, the action will report the failure for that specific
    ID while continuing to process others.
