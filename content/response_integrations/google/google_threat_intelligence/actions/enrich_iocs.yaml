name: Enrich IOCs
description: Use the Enrich IOCs action to enrich IOCs with information from Google
    Threat Intelligence. This action doesn’t run on Google SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#enrich_iocs
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: IOC Type
    default_value: Filehash
    type: ddl
    optional_values:
    - Filehash
    - URL
    - Domain
    - IP Address
    description: The type of the IOC to enrich.
    is_mandatory: false
-   name: IOCs
    default_value: ''
    type: string
    description: A comma-separated list of IOCs for which to ingest data.
    is_mandatory: true
-   name: Widget Theme
    default_value: Chronicle
    type: ddl
    optional_values:
    - Light
    - Dark
    - Chronicle
    description: The theme of the augmented widget.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_iocs_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
