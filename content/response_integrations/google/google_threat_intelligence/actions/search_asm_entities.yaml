name: Search ASM Entities
description: Use the Search ASM Entities action to search for Attack Surface Management
    (ASM) entities in Google Threat Intelligence. This action doesn’t run on Google
    SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#search-asm-entities
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Project Name
    default_value: ''
    type: string
    description: The name of the ASM project. If you don’t set a value, the action
        uses the value that you configured for the "ASM Project Name" integration
        parameter.
    is_mandatory: false
-   name: Entity Name
    default_value: ''
    type: string
    description: A comma-separated list of entity names for which to find related
        entities. The action treats entity names that contain forward slashes (/)
        as invalid names.
    is_mandatory: false
-   name: Minimum Vulnerabilities Count
    default_value: ''
    type: string
    description: The minimum number of vulnerabilities that the entity has for the
        action to return the entity.
    is_mandatory: false
-   name: Minimum Issues Count
    default_value: ''
    type: string
    description: The minimum number of issues that are related to the entity for the
        action to return the entity.
    is_mandatory: false
-   name: Tags
    default_value: ''
    type: string
    description: A comma-separated list of tag names to use when searching for entities.
    is_mandatory: false
-   name: Max Entities To Return
    default_value: 50
    type: string
    description: The maximum number of entities to return for every action run. The
        default value is 50. The maximum value is 200.
    is_mandatory: true
-   name: Critical or High Issue
    default_value: false
    type: boolean
    description: If selected, the action only returns issues with High and Critical
        severity.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/search_asm_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
