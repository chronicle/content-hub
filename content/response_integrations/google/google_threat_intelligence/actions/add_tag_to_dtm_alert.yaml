name: Add Tag To DTM Alert
description: Use the “Add Tag To DTM” to add tags to a Digital Threat Monitoring (DTM)
    alert in Google Threat Intelligence. This action doesn’t run on Google SecOps
    entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#add_tag_to_dtm_alert
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: The ID of the alert to update.
    is_mandatory: true
-   name: Mode
    default_value: Append
    type: ddl
    optional_values:
    - Append
    - Set
    description: Mode for the action execution. If “Append” is selected, action will
        add a new tag to the alert. If “Set” is selected, action will overwrite existing
        tags with the provided one in “Tags” parameter.
    is_mandatory: true
-   name: Tags
    default_value: ''
    type: string
    description: Comma-separated list of tags that should be added to Alert.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
