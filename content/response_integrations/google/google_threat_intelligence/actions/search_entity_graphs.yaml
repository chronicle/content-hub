name: Search Entity Graphs
description: 'Use the Search Entity Graphs action to search graphs that are based
    on Google SecOps entities in Google Threat Intelligence. This action runs on the
    following Google SecOps entities: IP, URL, Filehash, Hostname, Domain, Threat
    Actor, User. This action only supports the MD5, SHA-1, and SHA-256 hashes.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#search_entity_graphs
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Sort Field
    default_value: Owner
    type: ddl
    optional_values:
    - Owner
    - Creation Date
    - Last Modified Date
    - Views Count
    - Comments Count
    description: The value to sort the results. By default, the action sorts the results
        by owner.
    is_mandatory: false
-   name: Max Graphs To Return
    default_value: 10
    type: string
    description: The maximum number of graphs to return for a specified query. The
        default value is 10.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/search_entity_graphs_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["FILEHASH", "DestinationURL", "ADDRESS", "THREATACTOR",
    "USERUNIQNAME", "HOSTNAME"]}'
