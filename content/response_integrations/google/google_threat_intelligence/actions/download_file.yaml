name: Download File
description: Use the Download File action to download a file from Google Threat Intelligence.
    This action runs on the Google SecOps Hash entity. This action supports the MD5,
    SHA-1, and SHA-256 hashes.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#download_file
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Download Folder Path
    default_value: ''
    type: string
    description: The path to a folder to store the downloaded files, such as "/tmp/".
    is_mandatory: true
-   name: Overwrite
    default_value: true
    type: boolean
    description: If selected, the action overwrites the file with the same name.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/download_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["FILEHASH"]}'
