name: Search ASM Issues
description: Use the Search ASM Issues action to search for Attack Surface Management
    (ASM) issues in Google Threat Intelligence. This action doesn’t run on Google
    SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#search-asm-issues
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Project Name
    default_value: ''
    type: string
    description: The name of the ASM project. If you don’t set a value, the action
        uses the value that you configured for the "ASM Project Name" integration
        parameter.
    is_mandatory: false
-   name: Issue ID
    default_value: ''
    type: string
    description: A comma-separated list of issue IDs for which to obtain details.
    is_mandatory: false
-   name: Entity ID
    default_value: ''
    type: string
    description: A comma-separated list of entity IDs for which to find related issues.
    is_mandatory: false
-   name: Entity Name
    default_value: ''
    type: string
    description: A comma-separated list of entity names for which to find related
        issues. The action treats entity names that contain forward slashes (/) as
        invalid names.
    is_mandatory: false
-   name: Time Parameter
    default_value: First Seen
    type: ddl
    optional_values:
    - First Seen
    - Last Seen
    description: The time parameter to filter the results.
    is_mandatory: false
-   name: Time Frame
    default_value: Last Hour
    type: ddl
    optional_values:
    - Last Hour
    - Last 6 Hours
    - Last 24 Hours
    - Last Week
    - Last Month
    - Custom
    description: A period to search for issues. If you select the "Custom" value,
        set the "Start Time" parameter. The default value is Last Hour.
    is_mandatory: false
-   name: Start Time
    default_value: ''
    type: string
    description: The start time to search for results. If you select "Custom" for
        the "Time Frame" parameter,  this parameter is required. To configure this
        parameter, set the start time in the ISO 8601 format.
    is_mandatory: false
-   name: End Time
    default_value: ''
    type: string
    description: The end time to search for results. If you don’t set a value and
        select "Custom" for the "Time Frame" parameter, this parameter uses the current
        time as end time value. To configure this parameter, set the end time in the
        ISO 8601 format.
    is_mandatory: false
-   name: Lowest Severity To Return
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Critical
    - High
    - Medium
    - Low
    - Informational
    description: The lowest severity of the issues to return. The default value is
        Select One. If you use the default parameter value, this filter doesn’t apply
        to search.
    is_mandatory: false
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Open
    - Closed
    description: The status of the issues to return. The default value is Select One.
        If you use the default parameter value, this filter doesn’t apply to search.
    is_mandatory: false
-   name: Tags
    default_value: ''
    type: string
    description: A comma-separated list of tag names to use when searching for issues.
    is_mandatory: false
-   name: Max Issues To Return
    default_value: 50
    type: string
    description: The maximum number of issues to return for every action run. The
        default value is 50. The maximum value is 200.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/search_asm_issues_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
