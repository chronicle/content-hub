name: Add Vote To Entity
description: 'Use the Add Vote To Entity action to add votes to the Google SecOps
    entities in Google Threat Intelligence. This action supports the following Google
    SecOps entities: File Hash, URL, Hostname, Domain, IP Address. This action supports
    the MD5, SHA-1, and SHA-256 hashes.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#add_vote_to_entity
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Vote
    default_value: Malicious
    type: ddl
    optional_values:
    - Malicious
    - Harmless
    description: A vote to add to all supported entities.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_vote_to_entity_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "DestinationURL", "FILEHASH", "ADDRESS"]}'
