name: Submit File
description: Use the Submit File action to submit a file and return results from Google
    Threat Intelligence. This action doesn’t run on Google SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#submit_file
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: External URLs
    default_value: ''
    type: string
    description: A comma-separated list of public URLs for the files to submit. If
        both “External URL” and “File Paths” are provided, action will collect files
        from both inputs.
    is_mandatory: false
-   name: File Paths
    default_value: ''
    type: string
    description: A comma-separated list of absolute file paths. If you configure the
        “Linux Server Address” parameter, the action attempts to retrieve the file
        from a remote server. If both “External URL” and “File Paths” are provided,
        action will collect files from both inputs.
    is_mandatory: false
-   name: Check Hash First
    default_value: false
    type: boolean
    description: If enabled, action will first calculate the hashes for the files
        and search, if there is any available information for it. If it’s available,
        it will return the information without the submission flow.
    is_mandatory: false
-   name: GTI Score
    default_value: 60
    type: string
    description: GTI Score that is used to set is_risky property in JSON result to
        true. This condition is validated together with GTI verdict information. If
        nothing is provided, action will ignore the GTI score values.
    is_mandatory: false
-   name: Engine Threshold
    type: string
    description: The count of how many engines should mark the file as malicious or
        suspicious, for is_risky property in JSON result to be set to true. If “Engine
        Allowlist” contains values, action will only count results from those engines.
        This condition is validated together with GTI verdict information. If nothing
        is provided, action will ignore the Engines calculations.
    is_mandatory: false
-   name: Engine Percentage Threshold
    type: string
    description: 'The percentage of engines should mark the entity as malicious or
        suspicious, for is_risky property in JSON result to be set to true. If “Engine
        Allowlist” contains values, action will only count the percentage from those
        engines. If both “Engine Threshold” and “Engine Percentage Threshold” are
        provided, “Engine Threshold” will be used. Maximum value: 100. Minimum: 0.
        If nothing is provided, action will ignore the Engines calculations.'
    is_mandatory: false
-   name: Engine Allowlist
    default_value: ''
    type: string
    description: 'Comma-separated list of engines that should be used to retrieve
        information, whether a file is malicious or not. Example: AlienVault,Kaspersky.

        If nothing is specified in this parameter, action will take results from every
        available engine. If the engine didn’t return any information about the file
        it’s not going to be counted for the parameters “Engine Threshold” and “Engine
        Percentage Threshold”.'
    is_mandatory: false
-   name: Resubmit After (Days)
    default_value: 30
    type: string
    description: The number of days for the action to wait before resubmitting the
        file even if the hash is available for the file in the GTI database. To use
        this parameter, enable the “Check Hash First” parameter. The default value
        is 30 days.
    is_mandatory: false
-   name: Fetch MITRE Details
    default_value: false
    type: boolean
    description: If selected, the action returns the information about the related
        MITRE techniques and tactics. This parameter only supports the Hash entity.
        Not selected by default.
    is_mandatory: false
-   name: Lowest MITRE Technique Severity
    default_value: Medium
    type: ddl
    optional_values:
    - High
    - Medium
    - Low
    - Info
    description: The lowest MITRE technique severity to return. The action treats
        the "Unknown" severity as “Info”. This parameter only supports the Hash entity.
        The default value is Medium.
    is_mandatory: false
-   name: Private Submission
    default_value: false
    type: boolean
    description: If selected, the action submits the file in a private mode.
    is_mandatory: false
-   name: Retrieve Comments
    default_value: true
    type: boolean
    description: 'If selected, the action retrieves comments about the entity. This
        parameter supports the following entities: URL, Domain, Hostname, Hash, and
        IP Address.'
    is_mandatory: false
-   name: Max Comments To Return
    default_value: '10'
    type: string
    description: The maximum number of comments to return in every action run. The
        default value is 10.
    is_mandatory: false
-   name: Linux Server Address
    default_value: ''
    type: string
    description: Specify the IP address of the remote linux server, where the file
        is located.
    is_mandatory: false
-   name: Linux Username
    default_value: ''
    type: string
    description: Specify the username of the remote linux server, where the file is
        located.
    is_mandatory: false
-   name: Linux Password
    default_value: ''
    type: password
    description: Specify the password of the remote linux server, where the file is
        located.
    is_mandatory: false
-   name: ZIP Password
    default_value: ''
    type: password
    description: A password for the zipped folder that contains the files to submit.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/submit_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
