name: Get Related Associations
description: 'Use the Get Related Associations action to get information about associations
    (reports, campaigns, IOC collections, malware families, software toolkits, vulnerabilities,
    threat actors) related to the provided entities in Google Threat Intelligence.
    Supported entities: IP, URL, Filehash, Hostname, Domain. Note: only MD5, SHA-1
    and SHA-256 hashes are supported.'
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Association Types
    default_value: Report, Campaign, Collection, Malware Family, Vulnerability, Threat
        Actor
    type: string
    description: 'A comma-separated list of associations to return. Possible values:
        Report, Campaign, Collections, Malware Family, Vulnerability, Threat Actor.
        If no value is provided, the action returns all associations. Note: Reports
        are processed after all other associations are complete.'
    is_mandatory: false
-   name: Create Entity
    default_value: false
    type: boolean
    description: 'If selected, the action creates an entity for related Threat Actors,
        CVEs and Campaigns, linking it to the original entity. Note: Only CVE, Threat
        Actor and Campaign entities are created.'
    is_mandatory: false
-   name: Max Associations To Return
    default_value: 50
    type: string
    description: 'The maximum number of IOCs to return for every entity. Max: 1000.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_related_associations_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["IP", "URL", "FILEHASH", "HOSTNAME", "DOMAIN"]}'
