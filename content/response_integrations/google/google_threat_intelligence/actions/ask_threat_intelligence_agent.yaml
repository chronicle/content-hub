name: Ask Threat Intelligence Agent
description: Use the Ask Threat Intelligence Agent action to execute natural language
    queries and converse with the Google Threat Intelligence Agent to retrieve AI-driven
    threat analysis, actor context, malware triage, and detection recommendations.
    This action does not run on Google SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Prompt
    default_value: ''
    type: string
    description: The prompt or investigation query to execute using the Google Threat
        Intelligence Agent.
    is_mandatory: true
-   name: Session ID
    default_value: ''
    type: string
    description: An existing session ID to continue an ongoing conversation thread.
        If no value is provided, a new session is created.
    is_mandatory: false
-   name: File Paths
    default_value: ''
    type: string
    description: A comma-separated list of local file paths to attach to the message
        as binary artifacts.
    is_mandatory: false
-   name: Delete Session After Completion
    default_value: 'false'
    type: boolean
    description: If selected, the action automatically deletes the session after retrieving
        the response.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ask_threat_intelligence_agent_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
