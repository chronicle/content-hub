name: Enrich Entities
description: 'Use the Enrich Entities action to enrich the Google SecOps entities
    using information from Google Threat Intelligence. This action runs on the following
    Google Secops entities: IP address, URL, Hostname, Domain, Hash, Threat Actor,
    CVE. This action supports only MD5, SHA-1, and SHA-256 hashes.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#enrich_entities
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: GTI Score
    default_value: 60
    type: string
    description: GTI Score that is used to set Google SecOps entities as suspicious.
        This condition is validated together with GTI verdict information. If nothing
        is provided, action will ignore the GTI score values. This parameter only
        supports IP address, URL, Hostname, Domain, Hash entities.
    is_mandatory: false
-   name: Engine Threshold
    type: string
    description: The count of how many engines should mark the entity as malicious
        or suspicious, for Google SecOps to label it as suspicious. If “Engine Allowlist”
        contains values, action will only count results from those engines. This condition
        is validated together with GTI verdict information. If nothing is provided,
        action will ignore the Engines calculations. This parameter only supports
        IP address, URL, Hostname, Domain, Hash entities.
    is_mandatory: false
-   name: Engine Percentage Threshold
    type: string
    description: 'The percentage of engines should mark the entity as malicious or
        suspicious, for Google SecOps to label it as suspicious. If “Engine Allowlist”
        contains values, action will only count the percentage from those engines.
        If both “Engine Threshold” and “Engine Percentage Threshold” are provided,
        “Engine Threshold” will be used. Maximum value: 100. Minimum: 0. If nothing
        is provided, action will ignore the Engines calculations. This parameter only
        supports IP address, URL, Hostname, Domain, Hash entities.'
    is_mandatory: false
-   name: Engine Allowlist
    default_value: ''
    type: string
    description: 'Comma-separated list of engines that should be used to retrieve
        information, whether an entity is malicious or not. Example: AlienVault,Kaspersky.

        If nothing is specified in this parameter, action will take results from every
        available engine. If the engine didn’t return any information about the entity
        it’s not going to be counted for the parameters “Engine Threshold” and “Engine
        Percentage Threshold”.'
    is_mandatory: false
-   name: Resubmit Entity
    default_value: false
    type: boolean
    description: If selected, the action resubmits entities for analysis instead of
        using the information from the previous action run. This parameter only supports
        the URL and Hash entities. Not selected by default.
    is_mandatory: false
-   name: Resubmit After (Days)
    default_value: 30
    type: string
    description: The number of days for the action to wait before resubmitting the
        entity. To use this parameter, enable the "Resubmit Entity" parameter. The
        default value is 30 days. This parameter only supports the URL and Hash entities.
    is_mandatory: false
-   name: Sandbox
    default_value: VirusTotal Jujubox
    type: string
    description: A comma-separated list of sandbox names to analyze, such as VirusTotal
        Jujubox, VirusTotal ZenBox, Microsoft Sysinternals, Tencent HABO. This parameter
        only supports the Hash entity.If you don’t set this parameter, the action
        uses the default sandbox, VirusTotal Jujubox.
    is_mandatory: false
-   name: Retrieve Sandbox Analysis
    default_value: false
    type: boolean
    description: If selected, the action retrieves the sandbox analysis for the entity
        and creates a separate section for every sandbox in the JSON result. The action
        returns data for sandboxes that you configured in the "Sandbox" parameter.
        This parameter only supports the Hash entity. Not selected by default.
    is_mandatory: false
-   name: Fetch MITRE Details
    default_value: false
    type: boolean
    description: If selected, the action returns the information about the related
        MITRE techniques and tactics. This parameter only supports the Hash entity.
        Not selected by default.
    is_mandatory: false
-   name: Lowest MITRE Technique Severity
    default_value: Medium
    type: ddl
    optional_values:
    - High
    - Medium
    - Low
    - Info
    description: The lowest MITRE technique severity to return. The action treats
        the "Unknown" severity as “Info”. This parameter only supports the Hash entity.
        The default value is Medium.
    is_mandatory: false
-   name: Retrieve Comments
    default_value: true
    type: boolean
    description: 'If selected, the action retrieves comments about the entity. This
        parameter supports the following entities: URL, Domain, Hostname, Hash, and
        IP Address.'
    is_mandatory: false
-   name: Max Comments To Return
    default_value: 10
    type: string
    description: The maximum number of comments to return in every action run. The
        default value is 10.
    is_mandatory: false
-   name: Widget Theme
    default_value: Chronicle
    type: ddl
    optional_values:
    - Light
    - Dark
    - Chronicle
    description: The theme of the augmented widget.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["FILEHASH", "DestinationURL", "ADDRESS", "THREATACTOR",
    "HOSTNAME", "CVE"]}'
