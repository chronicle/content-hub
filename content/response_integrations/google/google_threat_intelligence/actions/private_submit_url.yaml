name: Private Submit URL
description: 'Use the Private Submit URL action to submit a URL for private scan in
    Google Threat Intelligence. For regular scan and enrichment use the action “Enrich
    Entities”. Supported Entities: URL.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#private_submit_url
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: URL
    default_value: ''
    type: string
    description: Comma-separated list of URLs that need to be scanned. Values from
        this parameter and entities will be processed together.
    is_mandatory: false
-   name: Check Existing Submissions First
    default_value: false
    type: boolean
    description: If enabled, action will first check if there is any available information
        about the URL in public or private submissions. If it’s available, it will
        return the information without the submission flow.
    is_mandatory: false
-   name: Resubmit After (Days)
    default_value: '30'
    type: string
    description: 'The number of days that must elapse from the last public analysis
        for the URL to be eligible for resubmission.

        To use this parameter, “Check Existing Submissions First” must be enabled.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/private_submit_url_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
