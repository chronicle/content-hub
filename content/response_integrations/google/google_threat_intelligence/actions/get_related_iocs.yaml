name: Get Related IOCs
description: 'Use the Get Related IOCs action to obtain information about IOCs that
    are related to Google SecOps entities using information from Google Threat Intelligence.
    This action runs on the following Google SecOps entities: IP address, URL, Hostname,
    Domain, Hash, Threat Actor. This action only supports the MD5, SHA-1, and SHA-256.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#get_related_iocs
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: IOC Types
    default_value: IP, Hash, URL, Domain
    type: string
    description: 'A comma-separated list of IOCs to extract. The possible values are
        as follows: IP, Hash, URL, Domain, Threat Actors, Malware, Campaigns.'
    is_mandatory: true
-   name: Max IOCs To Return
    default_value: 40
    type: string
    description: The maximum number of IOCs to return for selected IOC types  for
        every entity. The default value is 40.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_related_iocs_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["FILEHASH", "DestinationURL", "ADDRESS", "THREATACTOR",
    "HOSTNAME"]}'
