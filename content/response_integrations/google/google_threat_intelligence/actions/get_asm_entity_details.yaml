name: Get ASM Entity Details
description: Use the Get ASM Entity Details action to obtain information about an
    Attack Surface Management (ASM) entity in Google Threat Intelligence. This action
    doesn’t run on Google SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#get_asm_entity_details
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Entity ID
    default_value: ''
    type: string
    description: A comma-separated list of entity IDs for which to obtain details.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_asm_entity_details_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
