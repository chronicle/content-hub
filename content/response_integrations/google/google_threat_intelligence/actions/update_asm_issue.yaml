name: Update ASM Issue
description: Use the Update ASM Issue to update an Attack Surface Management (ASM)
    issue in Google Threat Intelligence. This action doesn’t run on Google SecOps
    entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#update-asm-issue
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Issue ID
    default_value: ''
    type: string
    description: The ID of the issue to update.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - New
    - Triaged
    - In Progress
    - Resolved
    - Duplicate
    - Out Of Scope
    - Not A Security Issue (Benign)
    - Risk Accepted
    - False Positive
    - Unable To Reproduce
    - Tracked Externally
    - Mitigated
    description: The new status to set for the issue. The default value is Select
        One. If you use the default value, the action fails.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/update_asm_issue_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
