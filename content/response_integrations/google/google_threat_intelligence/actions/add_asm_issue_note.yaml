name: Add ASM Issue Note
description: Use the Add ASM Issue Note action to add a note for the Attack Surface
    Management (ASM) issue in Google Threat Intelligence. This action doesn’t run
    on Google SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#add_asm_issue_note
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: The ID of the alert to update.
    is_mandatory: true
-   name: Text
    default_value: ''
    type: string
    description: Text of the analysis.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
