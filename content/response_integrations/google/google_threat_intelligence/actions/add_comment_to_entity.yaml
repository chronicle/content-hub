name: Add Comment To Entity
description: 'Use the Add Comment To Entity action to add comments to the Google SecOps
    entities in Google Threat Intelligence. This action runs on the following Google
    SecOps entities: File Hash, URL, Hostname, Domain, IP Address. This action supports
    the MD5, SHA-1, and SHA-256 hashes.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#add_comment_to_entity
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Comment
    default_value: ''
    type: string
    description: A comment to add to all supported entities.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_comment_to_entity_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "DestinationURL", "FILEHASH", "ADDRESS"]}'
