name: Get Graph Details
description: Use the Get Graph Details action to obtain detailed information about
    graphs in Google Threat Intelligence. This action doesn't run on Google SecOps
    entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#get_graph_details
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Graph ID
    default_value: ''
    type: string
    description: A comma-separated list of graph IDs for which to retrieve information.
    is_mandatory: true
-   name: Max Links To Return
    default_value: 50
    type: string
    description: The maximum number of links to return. The default value is 50.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_graph_details_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
