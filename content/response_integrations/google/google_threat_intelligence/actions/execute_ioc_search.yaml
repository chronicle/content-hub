name: Execute IOC Search
description: Use the Execute IOC Search action to run the IOC search in Google Threat
    Intelligence.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#execute_ioc_search
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Search Query
    default_value: ''
    type: string
    description: A search query to execute, such as "crowdsourced_yara_rule:*apt*
        and p:3+ and fs:2d+".
    is_mandatory: true
-   name: Max Results To Return
    default_value: 50
    type: string
    description: The maximum number of results to return for every action run. The
        default value is 50. The maximum value is 200.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/execute_ioc_search_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
