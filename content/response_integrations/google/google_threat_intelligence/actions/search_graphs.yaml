name: Search Graphs
description: Use the Search Graphs action to search for graphs that are based on custom
    filters in Google Threat Intelligence.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#search_graphs
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Query
    default_value: ''
    type: string
    description: 'A query filter for the graph. For example, to search for graphs
        in the selected period, format the query as follows: "creation_date:2018-11-1+creation_date:2018-11-12"'
    is_mandatory: true
-   name: Sort Field
    default_value: Last Modified Date
    type: ddl
    optional_values:
    - Owner
    - Creation Date
    - Last Modified Date
    - Views Count
    - Comments Count
    description: The value to sort the results. By default, the action sorts the results
        by last modified date.
    is_mandatory: false
-   name: Max Graphs To Return
    default_value: 10
    type: string
    description: The maximum number of graphs to return for a specified query. The
        default value is 10.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/search_graphs_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
