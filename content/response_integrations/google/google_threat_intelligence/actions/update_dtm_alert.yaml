name: Update DTM Alert
description: Use the Update DTM Alert to update a Digital Threat Monitoring (DTM)
    alert in Google Threat Intelligence. This action doesn’t run on Google SecOps
    entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#update_dtm_alert
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: The ID of the alert to update.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - New
    - Read
    - Resolved
    - Escalated
    - In Progress
    - No Action Required
    - Duplicate
    - Not Relevant
    - Tracked Externally
    description: The new status to set for the alert. The default value is Select
        One. If you use the default value, the action fails.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_dtm_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
