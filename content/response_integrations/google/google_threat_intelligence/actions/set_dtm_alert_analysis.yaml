name: Set DTM Alert Analysis
description: Use the Set DTM Alert Analysis action to set an analysis for a Digital
    Threat Monitoring (DTM) alert in Google Threat Intelligence. This action doesn’t
    run on Google SecOps entities.
integration_identifier: GoogleThreatIntelligence
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: The ID of the alert to update.
    is_mandatory: true
-   name: Text
    default_value: ''
    type: string
    description: Text of the analysis.
    is_mandatory: true
-   name: Attachment File Paths
    default_value: ''
    type: string
    description: 'Comma-separated list of attachment file paths. Note: only 10 files
        can be attached to the alert.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
