identifier: GoogleThreatIntelligence
name: Google Threat Intelligence
parameters:
-   name: API Root
    default_value: https://www.virustotal.com
    type: string
    description: The API root of the Google Threat Intelligence instance.
    is_mandatory: true
    integration_identifier: GoogleThreatIntelligence
-   name: API Key
    default_value: ''
    type: password
    description: The Google Threat Intelligence API key.
    is_mandatory: true
    integration_identifier: GoogleThreatIntelligence
-   name: ASM Project Name
    default_value: ''
    type: string
    description: The Attack Surface Management (ASM) project name to use in the Google
        Threat Intelligence integration. This parameter is required to execute the
        ASM actions.
    is_mandatory: false
    integration_identifier: GoogleThreatIntelligence
-   name: Active Group
    default_value: ''
    type: string
    description: The Active Group (Organization Context) identifier for multi-tenant
        environments. This is required if your ASM projects reside in a different
        organization than your primary one.
    is_mandatory: false
    integration_identifier: GoogleThreatIntelligence
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the integration verifies that the SSL certificate for
        connecting to the Google Threat Intelligence server is valid.
    is_mandatory: true
    integration_identifier: GoogleThreatIntelligence
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence
categories:
- Threat Intelligence
- Google
svg_logo_path: resources/logo.svg
image_path: resources/image.png
google_secops_product: true
