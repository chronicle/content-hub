[project]
name = "google_threat_intelligence"
version = "24.0"
description = "Google Threat Intelligence (GTI) delivers comprehensive threat insights by combining Mandiant's expertise, Google's vast data resources, and VirusTotal's crowdsourced intelligence. By defending billions of users, seeing millions of phishing attacks, and spending hundreds of thousands of hours investigating incidents it has the visibility to see across the threat landscape to keep the most important organizations protected."
requires-python = ">=3.11,<3.12"
dependencies = [ "bs4>=0.0.2", "environmentcommon", "paramiko==3.5.0", "pyzipper==0.3.6", "requests==2.32.4", "tipcommon",]

[dependency-groups]
dev = [ "integration-testing", "pytest>=9.2.0", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.2.2-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.2.6-py3-none-any.whl"
