<!-- Custom Widget / Integration Version when it was updated 9.0 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700,700i"
        rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css?family=Source Sans Pro"
        rel="stylesheet"/>
  <title>
    Google Threat Intelligence - Get Related IOCs
  </title>
  <style>
    /* Root Variables */
    :root {
      /* Layout & Colors */
      --widget-bg: #212c44;
      --widget-font-family: 'Source Sans Pro', sans-serif;
      --widget-text-color: #ffffff;
      --scrollbar-bg-color: #6275a3;

      /* Components */
      --widget-row-highlight-bg: #2f3d5c;
      --divider-border-colcor: #3a4a6c;
      --divider-border-width: 1px;

      /* Sidebar */
      --sidebar-width: 167px;
      --sidebar-item-active-bg: #3a4a6c;
      --sidebar-toggle-bg: rgba(38, 51, 79, 1); /* Custom Widget specific */

      /* Table */
      --table-color-even-row: #26334f;

      /* Logo */
      --logo-size: 48px;
      --logo-color: #ffffff;

      /* UI Elements */
      --input-border: #6275a3;
      --dropdown-shadow: rgba(0, 0, 0, 0.6);
      --modal-overlay: rgba(0, 0, 0, 0.5);

      /* Status & Tags */
      --tag-bg: #6a7180;
      --status-text: #b5b5b5;
      --tooltip-bg: #ccccda;
      --tooltip-text: #161625;
      
      /* Content Gradients (Custom Widget specific) */
      --content-list-gradient: linear-gradient(to left, rgb(34 43 62), rgba(33, 44, 68, 0));
      --collapsing-gradient: linear-gradient(transparent, rgb(35 44 66));

      /* Severity Colors (Dark Theme Default) */
      --sev-unspec: #b2b6bd;
      --sev-low: #78d9ec;
      --sev-medium: #fff371;
      --sev-high: #fa903e;
      --sev-critical: #ec453b;
      
      /* Legacy Mappings */
      --content-bg: var(--table-color-even-row);
      --content-button-bg: var(--widget-row-highlight-bg);
      --details-button-bg: var(--divider-border-colcor);
      --modal-list-title-bg: var(--sidebar-item-active-bg);
      
      /* Font settings (Legacy) */
      --widget-scrollbar-size: 12px;
      --list-item-key-font: 600 14px/18px var(--widget-font-family);
      --list-item-value-font: 400 14px/18px var(--widget-font-family);
      --table-title-size: 600 14px/18px var(--widget-font-family);
      --table-th-size: 600 14px/18px var(--widget-font-family);
      --table-td-size: 400 14px/18px var(--widget-font-family);
      --header-title-font: 600 16px/22px var(--widget-font-family);
      --sidebar-item-text-style: 400 14px/18px var(--widget-font-family);
      --sidebar-item-text-style-active: 600 14px/16px var(--widget-font-family);
      --sidebar-item-padding: 10px;
      --risk-score-text: var(--tooltip-text); 

    }

    /*Normalize CSS */
    * {
      margin: 0;
      padding: 0;
      outline: none;
      box-sizing: border-box;
    }

    *:hover, *:focus, *:active {
      outline: none;
    }

    ol, ul {
      list-style: none;
    }

    button,
    input,
    textarea {
      font-family: inherit;
      background: transparent;
      border: 0;
      color: inherit;
      text-align: left;
    }

    button, a[href] {
      cursor: pointer;
    }

    /*Normalize CSS */


    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 18px;
      height: 18px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(137, 151, 180, 1);
      border: 6px solid var(--widget-bg);
      border-radius: 63px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border: 4px solid transparent;
      border-radius: 44px;
    }

    ::-webkit-scrollbar-corner {
      background-color: transparent;
      border-color: transparent;
    }

    body {
      font-family: var(--widget-font-family), serif;
      color: var(--widget-text-color);
      background-color: var(--widget-bg);
      overflow: hidden;
    }

    /*Global styles*/
    .text-ellipsis {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .divider-border-style {
      border: 0;
      border-color: var(--divider-border-colcor);
      border-style: solid;
    }

    .tooltip {
      max-width: 100%;
      position: absolute;
      padding: 8px 16px 8px 16px;
      border-radius: 4px;
      background-color: var(--tooltip-bg);
      color: var(--tooltip-text);
      font: 400 14px/18px var(--widget-font-family);
      z-index: 9;
      word-wrap: break-word;
    }

    .tooltip-triangle {
      position: absolute;
      top: 100%;
      border-top: solid 8px rgb(195, 210, 232);
      border-left: solid 8px transparent;
      border-right: solid 8px transparent;
    }

    .link, a {
      color: #669DF6;
      text-decoration-line: underline;
    }

    .link-icon {
      min-width: 14px;
      max-height: 14px
    }

    /*Global styles*/

    .wrapper {
      display: flex;
      height: 100vh;
    }

    /*left sidebar*/
    .left-side {
      min-width: var(--sidebar-width);
      max-width: var(--sidebar-width);
      padding-right: 6px;
      border-right-width: var(--divider-border-width);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .left-side.collapsed {
      min-width: 0;
      max-width: 0;
    }

    .left-side-list {
      overflow-y: auto;
      flex: 1 auto;
    }

    .left-side-item {
      width: 100%;
      padding: var(--sidebar-item-padding);
      font: var(--sidebar-item-text-style);
    }

    .left-side-item.active {
      background-color: var(--sidebar-item-active-bg);
      font: var(--sidebar-item-text-style-active);
    }

    .right-side {
      display: flex;
      flex-direction: column;
      flex: 1 auto;
      width: calc(100% - 168px);
    }

    .left-side-toggle {
      width: 18px;
      height: 70px;
      position: absolute;
      right: -19px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--sidebar-toggle-bg);
      border-radius: 0 12px 12px 0;
    }

    .left-side-toggle-icon {
      width: 12px;
      height: 12px;
    }

    .left-side-toggle-icon.collapsed {
      transform: rotate(180deg);
    }

    /*left sidebar*/

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-left: 6px;
      border-bottom-width: var(--divider-border-width);
    }

    .header-title {
      font: var(--header-title-font);
      word-break: break-word;
      flex: 1 auto;
    }

    .logo {
      min-width: var(--logo-size);
      min-height: var(--logo-size);
      max-width: var(--logo-size);
      max-height: var(--logo-size);
      color: var(--logo-color);
    }

    .main-content {
      flex: 1;
      overflow: auto;
    }

    .list {
      display: flex;
      flex-direction: column;
    }

    .list-item + .list-item {
      margin-top: 16px;
    }

    .list-item-button {
      padding: 0 6px;
      margin-top: 6px
    }

    .list-item-text-key {
      padding: 6px;
      margin-bottom: 8px;
      font: var(--list-item-key-font);
      background-color: var(--widget-row-highlight-bg);
      position: sticky;
      top: 0;
      z-index: 9;
      text-transform: uppercase;
    }

    .list-item-text.collapsing {
      max-height: 40px;
      position: relative;
      overflow: hidden;
    }

    .list-item-text.collapsing::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 20px;
      background: var(--collapsing-gradient);
    }

    .list-item-text-value {
      padding: 0 6px;
      font: var(--list-item-value-font);
    }

    .list-item-text-value ul {
      list-style: disc;
      padding-left: 16px
    }

    .tag {
      display: grid;
      gap: 8px;
    }

    .tag-item {
      display: flex;
      align-items: center;
      overflow: hidden;
    }
  

    html.light-theme {
      --widget-bg: #ffffff !important;
      --widget-text-color: #0f1029;
      --scrollbar-bg-color: #d3d8ea;
      --widget-row-highlight-bg: #e5e8f2;
      --divider-border-colcor: #d3d8ea;
      --sidebar-item-active-bg: #d3d8ea;
      --sidebar-toggle-bg: #d3d8ea;
      --table-color-even-row: #f4f5fa;
      --logo-color: #4e4f63;
      --input-border: #d3d8ea;
      --tag-bg: #7a8294;
      --status-text: #6b6d7a;
      --tooltip-bg: #4e4f63;
      --tooltip-text: #ffffff;
      --dropdown-shadow: rgba(0, 0, 0, 0.1);
      --modal-overlay: rgba(0, 0, 0, 0.2);
      
      --content-list-gradient: linear-gradient(to left, #ffffff, rgba(255, 255, 255, 0));
      --collapsing-gradient: linear-gradient(transparent, #ffffff);
      
      /* Severity Colors (Light) */
      --sev-unspec: #95a5a6;
      --sev-low: #0088a5; 
      --sev-medium: #d6a000; 
      --sev-high: #d35400; 
      --sev-critical: #c0392b; 
    }

    html.light-theme body {
      background-color: #ffffff !important;
      color: var(--widget-text-color);
    }

    html.dark-theme {
      --widget-bg: #232330 !important;
      --widget-text-color: #ffffff;
      --scrollbar-bg-color: #303045;
      --widget-row-highlight-bg: #5f6368;
      --divider-border-colcor: #303045;
      --sidebar-item-active-bg: #5f6368;
      --sidebar-toggle-bg: #303045;
      --table-color-even-row: #3c4043;
      --logo-color: #ffffff;
      --input-border: #80808b;
      --tooltip-bg: #e8eaed;
      --tooltip-text: #131314;
      
      --content-list-gradient: linear-gradient(to left, #232330, rgba(35, 35, 48, 0));
      --collapsing-gradient: linear-gradient(transparent, #232330);
    }
    
    html.dark-theme body {
       background-color: var(--widget-bg) !important;
       color: var(--widget-text-color);
    }
    
    /* --- CUSTOM WIDGET SPECIFIC FIXES --- */
    
    html.light-theme span[class*="risk-score-value-text"],
    html.light-theme span[class*="risk-score-text"] {
        color: var(--logo-color) !important;
    }
    
    html.light-theme .additional-tooltip {
        background-color: var(--widget-row-highlight-bg) !important;
        color: var(--widget-text-color) !important;
    }
    
    html.light-theme .level-cell[style*="120, 217, 236"] { background-color: #4ebede !important; }
    html.light-theme .level-cell[style*="255, 243, 113"] { background-color: #f1c40f !important; }
    html.light-theme .level-cell[style*="250, 144, 62"] { background-color: #e67e22 !important; }
    html.light-theme .level-cell[style*="236, 69, 59"] { background-color: #e74c3c !important; }

    html.light-theme .indicator-icon {
        background-color: var(--logo-color) !important;
    }
    html.light-theme .indicator-icon::after {
        border-top-color: var(--logo-color) !important;
    }
    
    html.light-theme .list-item-screenshot {
        color: var(--logo-color) !important; 
        background-color: var(--table-color-even-row) !important;
        border: 1px solid var(--input-border) !important;
    }
    
    html.light-theme .tag-item {
        background-color: transparent !important;
        color: inherit !important;
        border: none !important;
    }
    
    /* --- SCROLLBAR IMPROVEMENTS --- */
    * {
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-bg-color) transparent;
    }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: var(--scrollbar-bg-color); border-radius: 4px; border: none; }
    ::-webkit-scrollbar-corner { background: transparent; }
    
    /* --- GLOBAL ELEMENT FIXES --- */
    body {
        font-family: var(--widget-font-family), serif;
        color: var(--widget-text-color);
        background-color: var(--widget-bg);
    }
    
    span.container-list-item {
        color: var(--widget-text-color) !important;
    }
    
    /* FIX: More comprehensive table header selector */
    .table th, .table thead th, .main-table th, .main-table thead th {
        background-color: var(--widget-row-highlight-bg) !important;
        color: var(--widget-text-color) !important;
    }
    
    .left-side-item.active { background-color: var(--sidebar-item-active-bg); }
    .left-side { border-right-color: var(--divider-border-colcor); }
    .header { border-bottom-color: var(--divider-border-colcor); }
    
    /* MitreAttck Specific Fixes */
    .fieldName, .descriptionText, .leftMenu, .chainName {
        color: var(--status-text) !important;
    }
    .leftMenu.active {
        color: var(--widget-text-color) !important;
    }
    .chainCircle {
        border-color: var(--status-text) !important;
    }
    .separator {
        background-color: var(--status-text) !important;
    }

</style>
</head>
<body>
<div class="wrapper">
  <div class="left-side divider-border-style" id="leftSide">
    <div class="left-side-list" id="leftSideList"></div>
    <button class="left-side-toggle" id="leftSideToggle">
      <svg class="left-side-toggle-icon" id="leftSideToggleIcon" width="12" height="12"
           viewBox="0 0 12 12" fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <rect width="12" height="12" fill="var(--sidebar-toggle-bg)"/>
        <path d="M8.205 2.705L7.5 2L3.5 6L7.5 10L8.205 9.295L4.915 6" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <div class="right-side" id="rightSide">
    <div class="header divider-border-style">
      <h1 class="header-title" id="headerTitle"></h1>
      <svg class="logo" fill="currentColor" height="28" viewbox="0 0 28 28" width="28"
           xmlns="http://www.w3.org/2000/svg">
        <path
          d="M15.12 4.007c-.6-.07-1.12.401-1.12 1.003 0 .501.37.932.87.982 4.01.432 7.13 3.841 7.13 7.973h2c0-5.135-3.89-9.386-8.88-9.958Zm5.64 14.25a.976.976 0 0 0 .15 1.223c.45.452 1.21.381 1.55-.16A9.94 9.94 0 0 0 24 13.975h-2a8.03 8.03 0 0 1-1.24 4.282Z">
        </path>
        <path
          d="M15.15 8.078c-.6-.12-1.15.381-1.15.993 0 .492.35.883.83.983a4.009 4.009 0 0 1 3.17 3.92h2a6.03 6.03 0 0 0-4.85-5.906v.01Zm4.44 8.083c.27-.672.41-1.414.41-2.186h-2c0 .511-.1.993-.28 1.444a.99.99 0 0 0 .22 1.083c.51.511 1.39.33 1.65-.341Zm-1.32 4.593a7.886 7.886 0 0 1-5.55 1.143c-3.37-.531-6.09-3.26-6.62-6.638-.07-.432-.1-.863-.1-1.284H4c0 .441.03.892.09 1.354.58 4.422 4.15 8.002 8.56 8.584 2.46.32 4.79-.261 6.68-1.454.54-.341.61-1.103.16-1.555a.984.984 0 0 0-1.22-.15Z">
        </path>
        <path
          d="M8.15 15.319c.49 2.236 2.29 4.041 4.52 4.532 1.26.281 2.47.15 3.54-.28.66-.261.83-1.144.32-1.645a.986.986 0 0 0-1.07-.22c-.76.31-1.63.39-2.55.13a4.058 4.058 0 0 1-2.74-2.748 3.926 3.926 0 0 1-.16-1.103h-2c0 .441.05.882.15 1.344l-.01-.01Z">
        </path>
        <path
          d="m14.71 13.273-8-8.023a.994.994 0 0 0-1.41 0 1 1 0 0 0 0 1.414l.97.973A9.953 9.953 0 0 0 4 13.975h2c0-1.845.63-3.55 1.69-4.914l1.43 1.434a5.982 5.982 0 0 0-1.11 3.48h2c0-.742.22-1.434.57-2.026l2.73 2.738c.2.2.45.29.71.29.26 0 .51-.1.71-.29a1 1 0 0 0 0-1.414h-.02Z">
        </path>
      </svg>
    </div>
    <section class="main-content" id="mainContent"></section>
  </div>
</div>
<script>

    const ThemeSettings = {
        LIGHT_THEME_CLASS: 'light-theme',
        DARK_THEME_CLASS: 'dark-theme',
    };
    
    const LIGHT_THEME_HEX = "#e5e8f2";
    const DARK_THEME_HEX = "#282837";
    const GRAY_THEME_HEX = "#2f3d5c";

    function handleThemeUpdate(event) {
        if (event.source !== window.parent) {
            return;
        }
        const styles = event.data;
        if (typeof styles !== 'object' || styles === null) return;
        const bg = styles.background || styles.backgroundColor || '';
        let isLight = false;
        let isDark = false;
        let isGray = false;
        const colorString = bg.toLowerCase();
        if (colorString === LIGHT_THEME_HEX) isLight = true;
        else if (colorString === DARK_THEME_HEX) isDark = true;
        else if (colorString === GRAY_THEME_HEX) isGray = true;
        else {
            let r, g, b;
            const rgbMatch = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (rgbMatch) { r = parseInt(rgbMatch[1]); g = parseInt(rgbMatch[2]); b = parseInt(rgbMatch[3]); }
            else if (bg.startsWith('#')) {
                const hex = bg.replace('#', '');
                const fH = hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex;
                if (fH.length === 6) { r = parseInt(fH.substring(0, 2), 16); g = parseInt(fH.substring(2, 4), 16); b = parseInt(fH.substring(4, 6), 16); }
            }
            if (r !== undefined) {
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                if (brightness > 128) isLight = true;
            }
        }
        const html = document.documentElement;
        if (isLight) {
            html.classList.add(ThemeSettings.LIGHT_THEME_CLASS); html.classList.remove(ThemeSettings.DARK_THEME_CLASS);
        } else if (isDark) {
            html.classList.add(ThemeSettings.DARK_THEME_CLASS); html.classList.remove(ThemeSettings.LIGHT_THEME_CLASS);
        } else {
            html.classList.remove(ThemeSettings.LIGHT_THEME_CLASS); html.classList.remove(ThemeSettings.DARK_THEME_CLASS);
        }

        const prismLink = document.querySelector('link[href*="/themes/prism"]');
        if (prismLink) {
            if (isLight && prismLink.href.includes('prism-tomorrow')) {
                prismLink.href = prismLink.href.replace('prism-tomorrow.min.css', 'prism.min.css').replace('prism-tomorrow.css', 'prism.css');
            } else if (!isLight && !prismLink.href.includes('prism-tomorrow')) {
                prismLink.href = prismLink.href.replace('prism.min.css', 'prism-tomorrow.min.css').replace('prism.css', 'prism-tomorrow.css');
            }
        }
    }
    window.addEventListener('message', handleThemeUpdate);
    window.onmessage = handleThemeUpdate;
    document.addEventListener("DOMContentLoaded", function() {
        var paths = document.querySelectorAll('svg path');
        paths.forEach(function(path) {
            var fill = path.getAttribute('fill');
            if (fill === 'white' || fill === '#fff' || fill === '#ffffff' || fill === 'rgb(255, 255, 255)') {
                path.setAttribute('fill', 'currentColor');
            }
        });
    });


  const actionListData = [{stepInstanceName}.JsonResult];

  // Constant for fields that are allowed to be modified
  const allowlistedFields = [];

  // Constants for tooltip positioning
  const tooltipGap = 25;
  const tooltipTriangleHeight = 8;
  const tooltipTriangleMinGap = 5;
  const triangleWidth = 16;
  let tooltipTimeout = undefined;

  const tooltipDetectResizeObserver = new ResizeObserver((entries) => {
    for (const entry of entries) {
      const target = entry.target;
      if (target) {
        const {offsetWidth, scrollWidth} = target;
        if (scrollWidth > offsetWidth) {
          target.addEventListener("mouseover", createTooltipListener);
          target.addEventListener("mouseout", removeTooltipListener);
        } else {
          target.removeEventListener("mouseover", createTooltipListener);
          target.removeEventListener("mouseout", removeTooltipListener);
        }
      }
    }
  });

  // Filter actionListData based on allowlistedFields
  const filteredActionListData = actionListData
    .filter(el => el.Entity.trim() !== "" && Object.keys(el.EntityResult).length > 0)
    .map(el => {
      const filteredEntityResult = filterKeys(el.EntityResult, allowlistedFields);
      return {...el, EntityResult: filteredEntityResult};
    })
    .filter(el => Object.keys(el.EntityResult).length > 0);

  if (leftSide) {
    leftSideToggle.addEventListener("click", () => {
      leftSide.classList.toggle("collapsed");
      if (leftSide.classList.contains("collapsed")) {
        leftSideToggleIcon.classList.add("collapsed");
      } else {
        leftSideToggleIcon.classList.remove("collapsed");
      }
    });
  }

  // Update the UI with filtered data
  if (filteredActionListData.length > 0) {
    renderKeysInUI(flattenKeys(filteredActionListData[0].EntityResult));

    headerTitle.textContent = filteredActionListData[0].Entity;

    filteredActionListData.forEach((el, index) => {
      const displayValue = el.Entity;
      const cleanDisplayValue = removeSpecialSymbols(displayValue);
      const button = document.createElement("button");
      button.id = cleanDisplayValue;
      button.classList.add("left-side-item");
      button.setAttribute("data-menu", "item");
      if (index === 0) {
        button.classList.add("active");
      }
      renderWithTooltip(button, displayValue);
      leftSideList.append(button);
    });

    if (filteredActionListData.length === 1) {
      leftSide.remove();
    } else {
      mainContent.style.paddingLeft = "22px";
      leftSide.addEventListener("click", event => {
        const target = event.target.closest("[data-menu='item']");
        if (!target) return;

        const id = target.id;
        const object = filteredActionListData.find(el => removeSpecialSymbols(el.Entity) === id);

        if (object) {
          mainContent.innerHTML = "";
          renderKeysInUI(flattenKeys(object.EntityResult));
          headerTitle.textContent = object.Entity;
        }
        document.querySelectorAll("[data-menu='item']").forEach(item => item.classList.remove("active"));
        target.classList.add("active");

        mainContent.scrollTop = 0;
      });
    }
  }

  /**
   * Recursively flattens a nested object into an array of { key, value } pairs.
   */
  function flattenKeys(obj, parentKey = "", sep = " ") {
    let keys = [];
    for (let key in obj) {
      if (obj.hasOwnProperty(key)) {
        let combinedKey = parentKey ? `${parentKey}${sep}${key}` : key;

        if (Array.isArray(obj[key])) {
          keys.push({key: combinedKey, value: obj[key]});
        } else if (typeof obj[key] === "object" && obj[key] !== null) {
          let nestedKeys = flattenKeys(obj[key], combinedKey, sep);
          keys = [...keys, ...nestedKeys];
        } else {
          keys.push({key: combinedKey, value: obj[key]});
        }
      }
    }

    return keys;
  }

  /**
   * Renders keys and their corresponding values in the UI.
   */
  function renderKeysInUI(keys) {
    const container = document.getElementById("mainContent");
    const listContainer = document.createElement("div");
    listContainer.classList.add("list");

    keys.forEach(({key, value}) => {

      const listItem = document.createElement("div");
      listItem.classList.add("list-item");
      const listItemButton = document.createElement("button");
      listItemButton.textContent = `Show more`;
      listItemButton.classList.add("link", "list-item-button");

      const keyElement = document.createElement("div");
      keyElement.classList.add("list-item-text", "list-item-text-key");
      renderWithTooltip(keyElement, convertCamelCaseToTitleCase(key));

      const valueElement = document.createElement("div");

      if (Array.isArray(value)) {
        valueElement.classList.add("list-item-text", "tag");
        value.forEach(item => {
          const arrayItem = document.createElement("div");
          const arrayItemName = document.createElement("span");
          arrayItem.classList.add("tag-item");
          arrayItemName.classList.add("list-item-text-value");
          renderWithTooltip(arrayItemName, item);
          arrayItem.appendChild(arrayItemName);
          valueElement.appendChild(arrayItem);
        });
      }

      listItemButton.addEventListener("click", function () {
        if (valueElement.classList.contains("collapsing")) {
          valueElement.classList.remove("collapsing");
          listItemButton.textContent = `Show less`;
        } else {
          valueElement.classList.add("collapsing");
          listItemButton.textContent = `Show more`;
        }
      });

      if (valueElement.textContent || valueElement.innerHTML) {
        listItem.appendChild(keyElement);
        listItem.appendChild(valueElement);

        function checkHeight() {
          if (valueElement.scrollHeight > 40) {
            listItem.appendChild(listItemButton);
            valueElement.classList.add("collapsing");
          }
        }

        setTimeout(checkHeight, 0);
        listContainer.appendChild(listItem);
      }
    });

    container.appendChild(listContainer);
  }

  /**
   * Utility function to filter keys based on allowlistedFields
   */
  function filterKeys(obj, allowedKeys) {
    if (allowedKeys.length === 0) {
      return obj;
    }
    const filtered = {};
    allowedKeys.forEach(key => {
      if (obj.hasOwnProperty(key)) {
        filtered[key] = obj[key];
      }
    });
    return filtered;
  }

  /**
   * Removes special symbols from a string.
   */
  function removeSpecialSymbols(str) {
    return str.replace(/[^\w\s]/gi, "");
  }

  /**
   * Converts camelCaseName to Title Case.
   */
  function convertCamelCaseToTitleCase(str) {
    let result = str.replace(/_/g, " ");
    result = result.replace(/([a-z])([A-Z])/g, "$1 $2");
    result = result.replace(/\b\w/g, char => char.toUpperCase());
    return result;
  }

  /**
   * Creates a tooltip with given text and position.
   */
  function createTooltip(text, x, y, trianglePointX, placeAtBottom, contentOverflowWindow) {
    removeTooltip();
    const tooltip = document.createElement("div");
    tooltip.classList.add("tooltip");
    tooltip.textContent = text;
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
    if (contentOverflowWindow) {
      tooltip.style.right = `${tooltipGap}px`;
    }
    const tooltipTriangle = document.createElement("span");
    tooltipTriangle.classList.add("tooltip-triangle");
    tooltipTriangle.style.left = `${trianglePointX}px`;
    if (placeAtBottom) {
      tooltipTriangle.style.top = "-8px";
      tooltipTriangle.style.borderTop = "0";
      tooltipTriangle.style.borderBottom = "solid 8px rgb(195, 210, 232)";
    }
    tooltip.append(tooltipTriangle);
    document.body.append(tooltip);
  }

  /**
   * Removes any existing tooltip from the DOM.
   */
  function removeTooltip() {
    const tooltip = document.querySelectorAll(".tooltip");
    tooltip.forEach((item) => {
      if (item) {
        item.remove();
      }
    });
  }

  /**
   * Sets a timeout to calculate and show tooltip position after a delay.
   */
  function createTooltipListener(event) {
    tooltipTimeout = setTimeout(() => calculateTooltipPosition(event), 1000);
  }

  /**
   * Clears any existing tooltip timeout and removes the tooltip.
   */
  function removeTooltipListener() {
    if (tooltipTimeout) {
      clearTimeout(tooltipTimeout);
    }
    removeTooltip();
  }

  /**
   * Calculates and positions the tooltip relative to the event target.
   */
  function calculateTooltipPosition(event) {
    const target = event.target;
    if (!target) {
      return;
    }
    const viewportWidth = window.innerWidth;
    const rect = target.getBoundingClientRect();
    const tooltipContent = document.createElement("div");
    tooltipContent.classList.add("tooltip");
    tooltipContent.style.top = "0";
    tooltipContent.textContent = target.textContent;
    document.body.appendChild(tooltipContent);
    let contentOverflowWindow = false;
    // Determine if window width would not be enough for content of tooltip
    if (tooltipGap * 2 + tooltipContent.offsetWidth >= viewportWidth) {
      // setting left, right positions to get correct tooltipContentWidth and tooltipContentHeight
      tooltipContent.style.left = `${tooltipGap}px`;
      tooltipContent.style.right = `${tooltipGap}px`;
      contentOverflowWindow = true;
    }
    const tooltipContentWidth = tooltipContent.offsetWidth;
    const tooltipContentHeight = tooltipContent.offsetHeight;
    tooltipContent.remove();
    const elementMidX = rect.left + (rect.width / 2);
    const placeOnRight = elementMidX + tooltipContentWidth / 2 + tooltipGap > viewportWidth;
    const x = Math.max(tooltipGap, placeOnRight ? viewportWidth - tooltipContentWidth - tooltipGap : elementMidX - tooltipContentWidth / 2);
    const placeAtBottom = rect.top < tooltipContentHeight;
    const y = placeAtBottom ? rect.bottom + tooltipTriangleHeight : rect.top - tooltipContentHeight;
    // Calculating trianglePointX relative to window width, to guarantee that it is not out of window
    const trianglePointX = Math.min(Math.max(elementMidX - x, tooltipTriangleMinGap), tooltipContentWidth - tooltipTriangleMinGap - triangleWidth);
    createTooltip(target.textContent, x, y, trianglePointX, placeAtBottom, contentOverflowWindow);
  }

  /**
   * Renders an item with text and sets up tooltip behavior.
   */
  function renderWithTooltip(item, text) {
    item.innerText = text;
    item.classList.add("text-ellipsis");
    tooltipDetectResizeObserver.observe(item);
  }
</script>
</body>
