name: Google Threat Intelligence - DTM Alerts Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: The name of the field where the product name is stored
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: event_type
    type: string
    description: The name of the field where the event name (subtype) is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: The name of the field where the environment name is stored. If the
        environment field isn't found, the environment is set to the default environment.
        The default value is "".
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regular expression pattern to run on the value found in the "Environment
        Field Name" field. This parameter lets you manipulate the environment field
        using the regular expression logic.Use the default value ".*" to retrieve
        the
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://www.virustotal.com
    type: string
    description: The API root of the Google Threat Intelligence instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Key
    default_value: ''
    type: password
    description: The Google Threat Intelligence API key.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the connector verifies that the SSL certificate for
        connecting to Google Threat Intelligence is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity To Fetch
    default_value: ''
    type: string
    description: 'The lowest severity of the alerts to fetch. If you don’t set a value,
        the connector ingests alerts with all severity levels. The possible values
        are as follows: Low, Medium, High.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Monitor ID Filter
    default_value: ''
    type: string
    description: A comma-separated list of monitor IDs from which to retrieve alerts.
        This parameter is applied alongside side Monitor Name values as OR filter.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Monitor Name Filter
    default_value: ''
    type: string
    description: 'A comma-separated list of monitor names from which to retrieve alerts.
        Note: if there are several monitors with the same name, connector will ingest
        from all of them. This parameter is applied alongside side Monitor ID values
        as OR filter.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Event Type Filter
    default_value: ''
    type: string
    description: A comma-separated list of event types that needs to be returned.
        If input is provided in format “!event_type”, then action will return all
        events except for the provided one. If nothing is provided, the connector
        will process all event types. Input is case sensitive.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If selected, the connector ignores the Google SecOps overflow mechanism
        during alert creation. Selected by default.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: The number of hours before the first connector iteration to retrieve
        responses from. This parameter applies either to the initial connector iteration
        after you enable the connector for the first time or the fallback value for
        an expired connector timestamp. The default value is 1 hour.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Alerts To Fetch
    default_value: 25
    type: integer
    description: The maximum number of alerts to process for every connector iteration.
        The default value is 25. The maximum value is 25.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If selected, the connector uses th dynamic list as a blocklist. Not
        selected by default.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Anonymize Passwords
    default_value: false
    type: boolean
    description: If selected, the connector will anonymize passwords in the alerts.
    is_mandatory: false
    is_advanced: false
    mode: script
description: Use the Google Threat Intelligence - DTM Alerts Connector to retrieve
    alerts from Google Threat Intelligence. The dynamic listworks with the "alert_type"
    parameter.
integration: GoogleThreatIntelligence
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#dtm-alerts-connector
rules: []
is_connector_rules_supported: false
creator: admin
