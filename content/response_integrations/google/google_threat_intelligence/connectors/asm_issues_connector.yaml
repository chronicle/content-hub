name: Google Threat Intelligence - ASM Issues Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: The name of the field where the product name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: entity_type
    type: string
    description: The name of the field where the event name (subtype) is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: The timeout limit in seconds for the Python process running the current
        script. The default value is 180 seconds.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: The name of the field where the environment name is stored. If the
        environment field isn't found, the environment is set to the default environment.
        The default value is "".
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regular expression pattern to run on the value found in the "Environment
        Field Name" field. This parameter lets you manipulate the environment field
        using the regular expression logic. Use the default value ".*" to retrieve
        the required raw Environment Field Name value. If the regular expression pattern
        is null or empty, or the environment value is null, the final environment
        result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://www.virustotal.com
    type: string
    description: The API root of the Google Threat Intelligence instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Key
    default_value: ''
    type: password
    description: The Google Threat Intelligence API key.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Project Name
    default_value: ''
    type: string
    description: The name of the ASM project.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Active Group
    default_value: ''
    type: string
    description: The Active Group (Organization Context) identifier for multi-tenant
        environments. This is required if your ASM projects reside in a different
        organization than your primary one.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the connector verifies that the SSL certificate for
        connecting to Google Threat Intelligence is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity To Fetch
    default_value: ''
    type: string
    description: 'The lowest severity of the alerts to fetch. If you don’t set a value,
        the connector ingests alerts with all severity levels. The possible values
        are as follows: Informational, Low, Medium, High, Critical.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If selected, the connector ignores the Google SecOps overflow mechanism
        during alert creation. Selected by default.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Issue Name Filter
    default_value: ''
    type: string
    description: Comma-separated list of names of issues that need to be ingested.
        If the input is provided as “!issue_name”, connector will ingest everything
        except for the provided issue. If nothing is provided, the connector will
        not apply this filter. Input is case sensitive.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Status Filter
    default_value: Open
    type: string
    description: 'Comma-separated list of issue statuses that need to be ingested.
        If nothing is provided, the connector will process only opened issues. Possible
        Values: Open, Closed.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: The number of hours before the first connector iteration to retrieve
        issues from. This parameter applies either to the initial connector iteration
        after you enable the connector for the first time or the fallback value for
        an expired connector timestamp. The default value is 1 hour.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Issues To Fetch
    default_value: 10
    type: integer
    description: The maximum number of issues to process for every connector iteration.
        The default value is 10. The maximum value is 100.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If selected, the connector uses th dynamic list as a blocklist. Not
        selected by default.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Use the Google Threat Intelligence - ASM Issues Connector to retrieve
    information about the Attack Surface Management (ASM) issues from Google Threat
    Intelligence. The dynamic list filter works with the "category" parameter.
integration: GoogleThreatIntelligence
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#gti-asm-issues-connector
rules: []
is_connector_rules_supported: false
creator: admin
