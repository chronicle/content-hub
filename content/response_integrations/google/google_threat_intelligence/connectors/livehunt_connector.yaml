name: Google Threat Intelligence - Livehunt Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: The name of the field where the product name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: type
    type: string
    description: The name of the field where the event name (subtype) is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: The timeout limit in seconds for the Python process running the current
        script. The default value is 180 seconds.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: The name of the field where the environment name is stored. If the
        environment field isn't found, the environment is set to the default environment.
        The default value is "".
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regular expression pattern to run on the value found in the "Environment
        Field Name" field. This parameter lets you manipulate the environment field
        using the regular expression logic. Use the default value ".*" to retrieve
        the required raw Environment Field Name value. If the regular expression pattern
        is null or empty, or the environment value is null, the final environment
        result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://www.virustotal.com
    type: string
    description: The API root of the Google Threat Intelligence instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Key
    default_value: ''
    type: password
    description: The Google Threat Intelligence API key.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the connector verifies that the SSL certificate for
        connecting to Google Threat Intelligence is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: The number of hours before the first connector iteration to retrieve
        notifications from. This parameter applies either to the initial connector
        iteration after you enable the connector for the first time or the fallback
        value for an expired connector timestamp. The default value is 1 hour.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Notifications To Fetch
    default_value: 40
    type: integer
    description: The maximum number of notifications to process for every connector
        iteration. The default value is 40.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If selected, the connector ignores the Google SecOps overflow mechanism
        during alert creation. Selected by default.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If selected, the connector uses th dynamic list as a blocklist. Not
        selected by default.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Entity Type Filter
    default_value: file
    type: string
    description: A comma-separated list of entity types to filter notifications by
        (e.g. file, url, domain, ip_address). If left empty, all entity types will
        be ingested.
    is_mandatory: false
    is_advanced: false
    mode: script
description: Use the Google Threat Intelligence - Livehunt Connector to retrieve information
    about the Livehunt notifications and their related files from Google Threat Intelligence.
    The dynamic list works with the "rule_name" parameter.
integration: GoogleThreatIntelligence
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#livehunt-connector
rules: []
is_connector_rules_supported: false
creator: admin
