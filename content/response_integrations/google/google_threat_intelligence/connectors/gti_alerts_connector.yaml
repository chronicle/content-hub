name: Google Threat Intelligence - GTI Alerts Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: The name of the field where the product name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: eventType
    type: string
    description: The name of the field where the event name (subtype) is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: The name of the field where the environment name is stored. If the
        environment field isn't found, the environment is set to the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regular expression pattern to run on the value found in the Environment
        Field Name field.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://threatintelligence.googleapis.com
    type: string
    description: The API root of the Google Threat Intelligence instance, including
        the project path (e.g., https://threatintelligence.googleapis.com/v1beta/projects/YOUR_PROJECT_ID).
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Key
    default_value: ''
    type: password
    description: The Google Threat Intelligence API key.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the connector verifies that the SSL certificate for
        connecting to Google Threat Intelligence is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity To Fetch
    default_value: ''
    type: string
    description: 'The lowest severity of the alerts to fetch. Possible values: Informational,
        Low, Medium, High, Critical.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Alert Type Filter
    default_value: ''
    type: string
    description: A comma-separated list of dark web alert detailTypes to fetch (e.g.,
        data_leak, insider_threat, initial_access_broker, target_technology).
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If selected, the connector ignores the Google SecOps overflow mechanism
        during alert creation.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: The number of hours before the initial connector iteration to retrieve
        alerts from.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Alerts To Fetch
    default_value: 25
    type: integer
    description: The maximum number of alerts to process per connector iteration.
        Maximum value is 100.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If selected, the connector uses the dynamic list as a blocklist.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Use the Google Threat Intelligence - GTI Alerts Connector to retrieve
    Google Threat Intelligence (GTI) alerts from Google Threat Intelligence. The dynamic
    list works with the "detailType" parameter. The connector retrieves alerts across
    supported Dark Web Intelligence categories, enriches them with associated findings
    and document metadata, and structures multi-element threat indicators into discrete
    SecOps events for comprehensive visual ontology mapping.
integration: GoogleThreatIntelligence
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-threat-intelligence#gti-alerts-connector
rules: []
is_connector_rules_supported: false
creator: admin
