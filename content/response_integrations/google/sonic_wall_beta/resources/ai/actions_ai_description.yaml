Add URL to URI List:
  ai_description: >-
    ### General Description

    Adds URL entities to a specific URI List in SonicWall. This action updates the
    content filter configuration on the SonicWall device by appending the specified
    URLs to a designated URI list.


    ### Flow Description

    1. Extracts the target URI List Name from the action parameters.

    2. Filters the target entities to include only those of type URL.

    3. Iterates through the filtered URL entities and sends a PUT request to the SonicWall
    API (`/api/sonicos/content-filter/uri-list-objects/name/{uri_list}`) to add each
    URL to the specified URI list.

    4. Sends a POST request to confirm and commit the pending changes on the SonicWall
    device.

    5. Returns a summary message detailing which URLs were successfully added and
    which failed.


    ### Additional Notes

    Caution: Successful action execution commits all uncommitted changes on the device.
    This is a SonicWall limitation. The action requires SonicOS 6.5.3 or higher. URI
    lists that contain unicode characters are not supported.
