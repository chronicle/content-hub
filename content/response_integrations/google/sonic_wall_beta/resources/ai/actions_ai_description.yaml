List Address Groups:
  ai_description: >-
    ### General Description

    Lists address groups from SonicWall based on the specified address type. This
    action retrieves the configured address groups from the firewall to provide visibility
    into network objects.


    ### Flow Description

    1. Extracts the integration configuration and action parameters.

    2. Initializes the `SonicWallManager` to handle API communication.

    3. Makes a GET request to the SonicWall API (`/api/sonicos/address-groups/{ip_type}`)
    to retrieve address groups for the specified address type (IPv4, IPv6, or both).

    4. Limits the results based on the `Max Address Groups To Return` parameter.

    5. Formats the retrieved address groups into a data table and JSON results.

    6. Returns the results to the Google SecOps platform.


    ### Additional Notes

    If the `Address Type` is set to 'All', the action will make separate API calls
    to retrieve both IPv4 and IPv6 address groups and combine the results.
