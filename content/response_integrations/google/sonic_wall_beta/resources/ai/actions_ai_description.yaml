Remove IP from Address Group:
  ai_description: >-
    ### General Description

    Removes a specific IP address from a designated SonicWall Address Group. This
    action initiates a state change on the external firewall device to remove the
    specified entity from a group, which can be used to manage blocklists or allowlists.


    ### Flow Description

    1. Iterates over target entities and filters for those of type ADDRESS.

    2. Validates whether each IP address is IPv4 or IPv6.

    3. Makes a GET request to the SonicWall API to verify the existence of the specified
    Address Group.

    4. Makes a GET request to retrieve all address objects and identify the specific
    object name associated with the IP.

    5. Makes a DELETE request to the SonicWall API to remove the identified IP object
    from the Address Group.

    6. Makes a POST request to confirm and commit the pending changes on the firewall.


    ### Additional Notes

    Caution: Successful action execution commits all uncommitted changes on the firewall.
    This is a SonicWall limitation. Groups that contain unicode characters are not
    supported.
