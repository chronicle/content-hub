Submit File:
  ai_description: >-
    ### General Description

    Submits one or more files to McAfee ATD for analysis using a specified analyzer
    profile. This action initiates a new analysis task on the external sandbox and
    returns the corresponding Task IDs for tracking.


    ### Flow Description

    1. Extracts the provided file paths and analyzer profile ID from the action parameters.

    2. Initializes an authenticated session with the McAfee ATD API.

    3. Iterates through the provided file paths and makes a POST request to the McAfee
    ATD API (`fileupload.php`) to submit each file.

    4. Collects the resulting Task IDs from the API response.

    5. Logs out of the McAfee ATD session to close the connection.

    6. Returns the Task IDs as a JSON result and populates a data table with the submission
    details.


    ### Additional Notes

    The action requires the file paths to be accessible by the script execution environment.
    Some file types (e.g., CSV) may not be supported by McAfee ATD.
