Check Hash:
  ai_description: >-
    ### General Description

    Checks if File Hash entities are blacklisted in McAfee Advanced Threat Defense
    (ATD).


    ### Flow Description

    1. Initializes the McAfee ATD manager using the provided integration configuration
    credentials.

    2. Filters the target entities to include only File Hash entities.

    3. Iterates through the filtered entities and makes a POST request to the McAfee
    ATD API (`atdHashLookup.php`) to determine if each hash is blacklisted.

    4. Updates the entity's additional properties in memory with the blacklist status.

    5. Outputs a data table and JSON results containing the blacklist status for each
    processed hash.


    ### Additional Notes

    While the script updates the entity's additional properties in memory, a bug in
    the script (failing to append the entity to the `entities_to_update` list) prevents
    these changes from being saved back to the platform.
  ai_short_description: >-
    Checks if File Hash entities are blacklisted in McAfee Advanced Threat Defense
    (ATD) and returns the status.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from McAfee ATD to check the blacklist status of hashes.
      It does not mutate external data (the POST request is a lookup). Although it
      modifies entity properties in memory, it fails to append them to the update
      list, so it does not successfully update entities in the platform. It does not
      create insights, modify alert data, or create case comments.
