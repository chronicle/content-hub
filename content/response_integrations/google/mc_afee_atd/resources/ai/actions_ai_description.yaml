Get Report:
  ai_description: >-
    ### General Description

    Retrieves analysis reports for specified task IDs from McAfee Advanced Threat
    Defense (ATD). This action fetches the JSON, PDF, and optionally TXT reports for
    tasks that have completed their analysis.


    ### Flow Description

    1. Accepts a comma-separated list of task IDs provided via the action parameters.

    2. Queries the McAfee ATD API to check the analysis status of each task ID.

    3. If any task is still processing, the action reschedules itself (asynchronous
    execution) until all tasks are completed.

    4. Once all tasks are ready, fetches the JSON and PDF reports for each task ID.

    5. Attaches the PDF report to the case and adds the JSON report to the action's
    JSON results.

    6. If the `Create Insight` parameter is enabled, fetches the TXT report and creates
    a case insight with the report summary.


    ### Additional Notes

    This is an asynchronous action that will continue to poll the McAfee ATD server
    until the analysis for all provided task IDs is complete or the action times out.
  ai_short_description: >-
    Retrieves analysis reports (JSON, PDF, TXT) for specified task IDs from McAfee
    ATD, attaching the results to the case and optionally creating a case insight.
