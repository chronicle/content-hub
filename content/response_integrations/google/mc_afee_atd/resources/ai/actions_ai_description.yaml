    ### General Description

    Tests connectivity to the McAfee ATD server to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Initializes the connection to the McAfee ATD server using the provided integration
    configuration parameters.

    2. Authenticates and obtains a session token via a GET request to the `session.php`
    endpoint.

    3. Immediately terminates the session via a DELETE request to the `session.php`
    endpoint.

    4. Outputs a success message if the connection and authentication were successful,
    or an error message if it fails.


