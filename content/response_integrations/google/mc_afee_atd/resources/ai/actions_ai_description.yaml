Get Analyzer Profiles:
  ai_description: >-
    ### General Description

    Retrieves a list of available analyzer profiles from McAfee Advanced Threat Defense
    (ATD). This action is useful for identifying the available virtual machine profiles
    that can be used for file or URL submission analysis.


    ### Flow Description

    1. Initializes the connection to the McAfee ATD API using the provided integration
    credentials.

    2. Makes a GET request to the `/vmprofiles.php` endpoint to fetch the available
    analyzer profiles.

    3. Formats the retrieved profiles by mapping the `vmProfileid` to a `Profile ID`
    key.

    4. Attaches the profile data to the action's JSON result and creates a data table
    named "Analyzer Profiles".

    5. Logs out of the McAfee ATD session.


    ### Additional Notes

    This action does not require any specific entities or action-level parameters
    to execute.
