name: Get IOC Details
description: Enrich Siemplify Entities with information about IOCs from RSA Netwitness
    EDR.
integration_identifier: RSANetWitnessEDR
parameters:
-   name: IOC Level Threshold
    default_value: Medium
    type: ddl
    optional_values:
    - Critical
    - High
    - Medium
    - Low
    description: Specify IOC level threshold for the entity. If the entity exceeds
        the threshold, the related entity will be marked as suspicious.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/GetIOCDetails_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["ADDRESS","URL","MacAddress","FILENAME", "FILEHASH",
    "HOSTNAME", "USERUNIQNAME"]}'
