name: Enrich Endpoint
description: Fetch endpoint's system information by its hostname or IP address.
integration_identifier: RSANetWitnessEDR
parameters:
-   name: IIOC Score Threshold
    default_value: 50
    type: string
    description: Specify IIOC score threshold for the endpoint. If the endpoint exceeds
        the threshold, the related entity will be marked as suspicious. If nothing
        is specified, action won’t check the IIOC score.
    is_mandatory: false
-   name: Include IOC Information
    default_value: 'False'
    type: boolean
    description: If enabled, action will fetch information about the IOCs that are
        associated with the endpoint
    is_mandatory: false
-   name: Max IOCs To Return
    default_value: 50
    type: string
    description: Specify how many IOCs to return. Maximum is 50. This is RSA Netwitness
        EDR limitation.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/EnrichEndpoint_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["ADDRESS"]}'
