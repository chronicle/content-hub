    ### General Description

    Adds URL entities to the domain blocklist in RSA Netwitness EDR. This action is
    used to prevent access to malicious URLs or to flag them within the EDR environment
    by submitting them to the platform's domain blocklist.


    ### Flow Description

    1. **Identify URL Entities**: The action scans the target entities in the current
    context and filters for those of type URL.

    2. **Initialize Manager**: It initializes the RSA Netwitness EDR manager using
    the provided integration configuration credentials.

    3. **Submit Blocklist Request**: The action sends a POST request to the RSA Netwitness
    EDR API (`api/v2/blacklist/domain`) containing the list of identified URLs to
    be added to the blocklist.

    4. **Process Response**: It parses the API response to determine which URLs were
    successfully added and which failed.

    5. **Finalize Action**: The action attaches the raw JSON response to the action
    results and outputs a summary message detailing the success or failure for each
    entity.


