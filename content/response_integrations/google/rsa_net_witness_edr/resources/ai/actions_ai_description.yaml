Ping:
  ai_description: >-
    ### General Description

    The Ping action is a diagnostic tool designed to verify the connectivity between
    Google SecOps and the RSA NetWitness EDR server. It validates the integration
    configuration by attempting a basic API call to the service's health endpoint.


    ### Flow Description

    1. **Initialization**: The action retrieves the integration's configuration parameters,
    including the API Root, credentials, and SSL verification settings.

    2. **Connectivity Test**: It initializes the `RSAManager` and calls the `test_connectivity`
    method, which performs a GET request to the `api/v2/health` endpoint.

    3. **Validation**: The response is validated to ensure the server is reachable
    and the credentials are correct.

    4. **Completion**: The action returns a success message ('Connection Established')
    if the health check succeeds, or an error message if the connection fails.


    ### Additional Notes

    This action does not require any input entities and is typically used during the
    initial setup or troubleshooting of the RSA NetWitness EDR integration.
