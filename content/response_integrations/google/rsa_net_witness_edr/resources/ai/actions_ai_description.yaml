Enrich Endpoint:
  ai_description: >-
    ### General Description

    Enriches Endpoint entities (IP addresses or Hostnames) using RSA NetWitness EDR.
    This action retrieves comprehensive system information, including operating system
    details, network configuration, and hardware specifications.


    ### Flow Description

    1. The action identifies `ADDRESS` and `HOSTNAME` entities in the current scope.

    2. It queries the RSA NetWitness EDR API (via GET request) to find the corresponding
    machine GUID for each entity.

    3. It fetches detailed machine information and optionally associated IOCs from
    the API.

    4. It updates the entity's additional properties with the retrieved data and marks
    it as enriched.

    5. If the machine's IIOC score exceeds the provided threshold, the entity is marked
    as suspicious.


    ### Additional Notes

    The action uses the `RSA_EDR` prefix for enrichment fields added to the entity's
    additional properties.
