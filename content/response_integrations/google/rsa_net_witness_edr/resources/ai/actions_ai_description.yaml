Get IOC Details:
  ai_description: >-
    ### General Description

    The **Get IOC Details** action enriches entities within Google SecOps by retrieving
    threat intelligence from RSA Netwitness EDR. It specifically queries for Indicators
    of Compromise (IOC) details associated with an entity's identifier. The action
    retrieves metadata such as the IOC's priority, description, active status, and
    execution history, which is then used to update the entity's profile and assess
    its risk level.


    ### Flow Description

    1. **Connection**: The action establishes a connection to the RSA Netwitness EDR
    API using the configured credentials.

    2. **Entity Processing**: The action iterates through all target entities provided
    in the context.

    3. **Data Retrieval**: For each entity, it calls the RSA EDR API (`api/v2/instantiocs/{}`)
    to fetch specific IOC details based on the entity's identifier.

    4. **Enrichment**: If data is found, the action flattens the IOC details and adds
    them to the entity's `additional_properties` using the prefix `RSA_EDR`. The entity
    is also flagged as 'enriched'.

    5. **Risk Assessment**: The action compares the retrieved `ioc_level` against
    the user-defined **IOC Level Threshold**. If the level indicates a high enough
    risk (numerical value <= threshold), the entity's `is_suspicious` attribute is
    set to `True`.

    6. **Finalization**: The action updates all successfully processed entities in
    Google SecOps and returns a JSON object containing the raw results.


    ### Additional Notes

    This action does not filter by specific entity types in the code, meaning it will
    attempt to query RSA Netwitness EDR for any entity passed to it. Ensure that the
    entities provided are relevant for IOC lookups in the EDR platform.
  ai_short_description: >-
    Enriches entities within Google SecOps by retrieving Indicator of Compromise (IOC)
    details from RSA Netwitness EDR and evaluating their risk level.
  capabilities:
    can_create_case_comments: false
