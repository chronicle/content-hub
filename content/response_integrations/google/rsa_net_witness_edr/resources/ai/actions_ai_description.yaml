Add IP To Blacklist:
  ai_description: >-
    ### General Description

    Adds IP addresses to the blocklist in RSA Netwitness EDR. This action is primarily
    used for containment purposes, allowing security analysts to programmatically
    block communication with malicious or suspicious IP addresses directly from the
    Google SecOps interface.


    ### Flow Description

    1. **Initialization**: The action retrieves the RSA Netwitness EDR connection
    details (API Root, credentials, SSL settings) from the integration configuration.

    2. **Entity Filtering**: It identifies all entities in the current alert/case
    context that match the `ADDRESS` type.

    3. **External Request**: The action calls the `add_ip_to_blocklist` method in
    the RSA Manager, which sends a `POST` request to the `/api/v2/blacklist/ip` endpoint
    with the list of IP addresses.

    4. **Response Processing**: It parses the response from RSA Netwitness EDR to
    determine which IP addresses were successfully blocklisted and which failed.

    5. **Result Reporting**: The action generates a summary message detailing the
    success or failure for each entity and attaches the raw JSON response to the action
    results for further inspection.


    ### Additional Notes

    This action performs a state-changing operation on the external RSA Netwitness
    EDR system. It specifically targets entities of type `ADDRESS` and will ignore
    other entity types.
  ai_short_description: >-
    Adds specific IP addresses to the blocklist in RSA Netwitness EDR to prevent network
    communication.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
