    label, description, impact scope, urgency, and service ID.


    ### Flow Description

    1. Retrieves the incident ID and optional update parameters (display label, description,
    impact scope, urgency, service ID) from the action inputs.

    2. Initiates a POST request to the Micro Focus ITSMA API to update the specified
    incident with the provided values.

    3. Returns a success message indicating the incident was updated, along with a
