Create Incident:
  ai_description: >-
    ### General Description

    Creates a new incident in Micro Focus ITSMA. This action takes incident details
    such as label, description, urgency, and scope, and generates a new record in
    the external ITSM system.


    ### Flow Description

    1. Retrieves the incident configuration parameters (Display Label, Description,
    Impact Scope, Urgency, Service ID) from the action inputs.

    2. Authenticates with the Micro Focus ITSMA API using the integration configuration.

    3. Makes a POST request to the Micro Focus ITSMA `/rest/{tenant_id}/ces` endpoint
    with the provided incident details to create the record.

    4. Extracts the newly created incident ID from the API response.

    5. Returns the incident ID to the SOAR platform and outputs a success message.


    ### Additional Notes

    Ensure that the provided Service ID corresponds to a valid category ID within
    your Micro Focus ITSMA environment.
  ai_short_description: >-
    Creates a new incident in Micro Focus ITSMA based on the provided parameters and
    returns the newly generated incident ID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new incident record in the external Micro Focus ITSMA system.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a POST request to an external API (Micro Focus ITSMA) to
      create a new incident, meaning it mutates external data. It does not fetch contextual
      data, update internal entities, create insights, or modify alert data.
