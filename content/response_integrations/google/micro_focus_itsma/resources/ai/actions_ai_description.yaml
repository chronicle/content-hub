Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Micro Focus ITSMA instance by attempting to authenticate
    and retrieve a token.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, Username, Password,
    Tenant ID, etc.).

    2. Initializes the Micro Focus ITSMA manager.

    3. Makes a POST request to the Micro Focus ITSMA authentication endpoint (`/auth/authentication-endpoint/authenticate/login`)
    to retrieve an access token.

    4. Evaluates the response and returns a success message if the connection is established,
    or a failure message otherwise.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can successfully communicate with the Micro Focus ITSMA API.
