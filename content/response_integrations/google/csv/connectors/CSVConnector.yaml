name: CSV Connector
parameters:
-   name: DeviceProductField
    default_value: device_product
    type: string
    description: The field name used to determine the device product
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: name
    type: string
    description: The field name used to determine the event name (sub-type)
    is_mandatory: false
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '60'
    type: string
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Csv Folder Path
    default_value: ''
    type: string
    description: Folder path that contains all of the csv files that need to be ingested.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: CSV Limit
    default_value: ''
    type: integer
    description: How many CSV files to process per one iteration.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Time Field Name
    default_value: ''
    type: string
    description: Name of the field that contains information about the event time.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Time Field Timezone
    default_value: UTC
    type: string
    description: Timezone of the column stated in the 'Time Field Name' param.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Rule Generator Field Name
    default_value: ''
    type: string
    description: Name of the field that contains information about the rule generator.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: CSV Has Header
    default_value: true
    type: boolean
    description: Indicates whether the csv file has header
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: File Encoding Types
    default_value: utf-8, latin-1, iso-8859-1
    type: string
    description: 'A comma separated list CSV encoding types used for decoding your
        CSV files, e.g. utf-8, latin-1, iso-8859-1, utf-16... Order in which the encoding
        types are given sets the order in which they are used for decoding files,
        e.g.(from example above) the utf-8 has the highest priority and will be used
        primarily for decoding all the files, if there is a CSV file that uses some
        other encoding then the next in the order: latin-1 encoding will be used,
        and so on, until the last encoding is used.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Alert Field Name
    default_value: ''
    type: string
    description: Name of the field that contains information about alert name.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Severity Field Name
    default_value: ''
    type: string
    description: 'Name of the field that contains information about severity. Note:
        you can map severity based on the values in the response. For that you need
        to go to the connector execution folder and modify severity_mapping_config.json.
        Check documentation for reference.'
    is_mandatory: false
    is_advanced: false
    mode: script
description: Fetch data from csv files located in a specific folder, convert this
    data to alerts in siemplify system
integration: CSV
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/csv#connectors
rules: []
is_connector_rules_supported: false
creator: admin
