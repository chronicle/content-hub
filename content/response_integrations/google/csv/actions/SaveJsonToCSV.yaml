name: Save Json To CSV
description: Save JSON object  to CSV.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/csv#save_json_to_csv
integration_identifier: CSV
parameters:
-   name: JSON Object
    default_value: ''
    type: string
    description: Specify the JSON object that needs to be saved as CSV.
    is_mandatory: true
-   name: Overwrite
    default_value: 'False'
    type: boolean
    description: If enabled, action will overwrite existing file.
    is_mandatory: false
-   name: File Path
    default_value: ''
    type: string
    description: Specify the absolute file path for the newly created CSV file. If
        only the file name is provided, action will store the file in /tmp/ folder.
    is_mandatory: true
-   name: Advanced Nested JSON Handling
    default_value: 'False'
    type: boolean
    description: If enabled, action will create a CSV, where nested JSONs keys will
        be in separate columns and lists of JSON objects will be converted into rows.
        Data in CSV will be filled.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/save_json_to_csv_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
