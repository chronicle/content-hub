Logoff User:
  ai_description: >-
    ### General Description

    Logs off a specified user from a remote server via SSH. It connects to the target
    server using the provided credentials and executes a command to terminate all
    processes owned by the specified user, effectively revoking their active sessions.


    ### Flow Description

    1. Extracts connection details (server, port, credentials) and the target username
    from the action parameters.

    2. Establishes an SSH connection to the remote server using the `paramiko` library.

    3. Executes the `pkill -KILL -u <username>` command on the remote server to forcefully
    terminate all processes associated with the target user.

    4. Evaluates the command's exit status code to determine success or failure.

    5. Returns a success or failure message to the SOAR platform based on the execution
    result.


    ### Additional Notes

    The provided SSH credentials must have sufficient privileges (e.g., root or appropriate
    sudo access) to terminate processes owned by the target user. If the credentials
    lack these permissions, the action will fail to log the user off.
