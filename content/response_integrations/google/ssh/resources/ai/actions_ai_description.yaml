    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a DROP rule to the INPUT chain of iptables on the remote server for the
      specified IP address.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a command on a remote server via SSH to modify its iptables
      configuration (mutating external data). It does not fetch data, update internal
      entities, or create insights.
