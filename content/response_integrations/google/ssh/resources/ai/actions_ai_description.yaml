Execute Program:
  ai_description: >-
    ### General Description

    Executes a specified program or script on a remote machine via SSH. This action
    allows analysts to remotely trigger executables or scripts on a target server
    and retrieve the resulting output or error messages directly within the SecOps
    platform.


    ### Flow Description

    1. Retrieves the connection parameters (Remote Server, Username, Password, Port)
    and the target program path from the action inputs.

    2. Establishes an authenticated SSH connection to the specified remote server.

    3. Executes the program at the provided path on the remote host.

    4. Captures the standard output (STDOUT) if successful, or standard error (STDERR)
    if the execution fails.

    5. Returns the captured output to the SecOps platform and marks the action as
    successful or failed based on the exit status code.


    ### Additional Notes

    Ensure that the provided credentials have the necessary permissions to execute
    the specified program on the remote host. The remote server must be accessible
    over the network via the specified SSH port (default is 22).
