Delete Firewall Rule:
  ai_description: >-
    ### General Description

    Deletes a specified iptables firewall rule on a remote Linux server via SSH. This
    action allows analysts to remotely modify firewall configurations by removing
    existing rules.


    ### Flow Description

    1. Establishes an SSH connection to the target remote server using the provided
    credentials (username, password, and port).

    2. Executes the `iptables -D` command along with the provided rule string to delete
    the specific firewall rule.

    3. Evaluates the exit status of the command to determine success or failure.

    4. Returns a boolean result indicating whether the rule was successfully deleted.


    ### Additional Notes

    The `IPtables Rule` parameter must match the exact rule specification as it appears
    in the iptables configuration (e.g., `INPUT -s 10.0.0.10 -j DROP`). Ensure the
    provided credentials have sufficient privileges (e.g., root) to modify iptables
    rules.
