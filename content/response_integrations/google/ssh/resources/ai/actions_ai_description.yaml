Block IP Address in iptables:
  ai_description: >-
    ### General Description

    This action connects to a remote server via SSH and adds a rule to iptables to
    block a specified IP address.


    ### Flow Description

    1. Establishes an SSH connection to the remote server using the provided credentials
    (server, username, password, and port).

    2. Checks if a block rule for the specified IP address already exists in the remote
    server's iptables.

    3. If the rule does not exist, executes the command `iptables -I INPUT -s <IP>
    -j DROP` to block the IP address.

    4. Returns the execution status and an output message indicating whether the IP
    was successfully blocked or if it was already blocked.


    ### Additional Notes

    The action requires valid SSH credentials and appropriate permissions (e.g., root
    access) on the remote server to modify iptables.
  ai_short_description: >-
    Connects to a remote server via SSH and adds a DROP rule to iptables to block
    a specified IP address.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
