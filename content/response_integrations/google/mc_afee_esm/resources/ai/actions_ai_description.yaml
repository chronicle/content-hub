Remove Values From Watchlist:
  ai_description: >-
    ### General Description

    Removes specified values from a watchlist in McAfee ESM.


    ### Flow Description

    1. Extracts the watchlist name and the values to remove from the action parameters.

    2. Retrieves the watchlist details from McAfee ESM via a POST request to `/rs/esm/v2/sysGetWatchlists`
    to obtain the internal watchlist ID.

    3. Makes a POST request to `/rs/esm/v2/sysRemoveWatchlistValues` in McAfee ESM
    to remove the specified values from the watchlist.

    4. Returns a success message if the operation completes successfully.


    ### Additional Notes

    The values to remove should be provided as a comma-separated list.
