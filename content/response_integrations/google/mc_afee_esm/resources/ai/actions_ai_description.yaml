Send Query To ESM:
  ai_description: >-
    ### General Description

    Executes a custom query in McAfee ESM based on specified filters, time ranges,
    and query types (Event, Flow, Asset). It retrieves the matching records and attaches
    them to the action results as a data table and JSON.


    ### Flow Description

    1. Validates input parameters and constructs the query payload.

    2. Initiates the query execution asynchronously via the McAfee ESM API (`/rs/esm/v2/qryExecuteDetail`).

    3. Polls the API (`/rs/esm/v2/qryGetStatus`) to check the query execution status.

    4. Once complete, retrieves the query results (`/rs/esm/v2/qryGetResults`).

    5. Formats the results and attaches them to the case as a data table and JSON
    result.


    ### Additional Notes

    This action runs asynchronously. Ensure the script timeout value in the IDE is
    adjusted as needed to accommodate long-running queries.
  ai_short_description: >-
    Executes a custom query in McAfee ESM and retrieves the results.
