Add Values To Watchlist:
  ai_description: >-
    ### General Description

    Adds specified values to a watchlist in McAfee ESM.


    ### Flow Description

    1. Retrieves the watchlist ID by querying McAfee ESM for the provided watchlist
    name.

    2. Makes an API call to McAfee ESM to add the provided list of values to the identified
    watchlist.


    ### Additional Notes

    McAfee ESM allows values of invalid types to be passed (e.g., adding a hash to
    an IP watchlist without raising an error), so input validation should be considered
    before executing this action.
