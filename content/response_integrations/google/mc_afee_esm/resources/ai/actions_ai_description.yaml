Get Similar Events:
  ai_description: >-
    ### General Description

    The `Get Similar Events` action queries McAfee ESM to retrieve historical events
    related to specific entities (Hostname, IP Address, User). It allows analysts
    to find related activity within a specified timeframe.


    ### Flow Description

    1. The action extracts the provided parameters, including the timeframe (`Hours
    Back`), `IPS ID`, and `Result Limit`.

    2. It filters the target entities to include only supported types: Hostname, IP
    Address, and User.

    3. For each suitable entity, it constructs an event search query based on the
    entity type.

    4. It initiates the query asynchronously on the McAfee ESM platform.

    5. The action periodically checks the status of the query.

    6. Once the query completes, it retrieves the event results up to the specified
    limit.

    7. The retrieved events are attached to the case as JSON results and entity-specific
    tables.


    ### Additional Notes

    - This action runs asynchronously. Ensure the script timeout value in the Chronicle
    SOAR IDE is adjusted as needed.

    - The maximum number of results returned per entity is 200.
  ai_short_description: >-
    Queries McAfee ESM to retrieve historical events related to specific Hostname,
    IP Address, and User entities, attaching the results to the case.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
