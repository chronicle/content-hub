Send Advanced Query To ESM:
  ai_description: >-
    ### General Description

    Sends an advanced query to McAfee ESM and retrieves the results. This action allows
    users to execute custom JSON-formatted queries against the ESM database to fetch
    specific event data or telemetry.


    ### Flow Description

    1. Extracts the `Query Payload` provided by the user.

    2. Initiates the query on McAfee ESM via a POST request to the `v1/runningQuery`
    endpoint.

    3. Monitors the query execution status asynchronously via a GET request to the
    `v1/runningQuery/queue/{query_id}` endpoint.

    4. Once the query is complete, retrieves the results via a GET request to the
    `v1/runningQuery/{query_id}` endpoint.

    5. Parses the results and attaches them to the action's output as a JSON object
    and a data table.


    ### Additional Notes

    This action runs asynchronously. The maximum number of results returned is limited
    to 200. If the query specifies a limit greater than 200, it will be automatically
    capped at 200.
