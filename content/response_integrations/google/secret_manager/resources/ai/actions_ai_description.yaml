Ping:
  ai_description: >-
    ### General Description

    The Ping action is used to test the connectivity to the Google Cloud Secret Manager
    API. It ensures that the provided authentication credentials and project ID are
    valid and have the necessary permissions to interact with the service.


    ### Flow Description

    1. Initializes the Secret Manager client using the integration's authentication
    parameters (Service Account JSON or Workload Identity).

    2. Makes an authenticated HTTP GET request to the Secret Manager API (`projects/{project_id}/secrets`)
    to list secrets with a page size of 1.

    3. Evaluates the response to confirm successful connectivity.

    4. Returns a boolean result indicating success or failure, along with a corresponding
    output message.


    ### Additional Notes

    This action does not run on Google SecOps entities and does not require any action-specific
    parameters. It is primarily used for troubleshooting and verifying the integration
    setup.
  ai_short_description: >-
    Tests connectivity to the Google Cloud Secret Manager API to verify that the integration's
    authentication credentials and configuration are valid.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Secret Manager API solely to test connectivity.
      It does not fetch contextual data for alerts/entities, mutate external data,
      mutate internal data, update entities, create insights, modify alert data, or
      create case comments.
