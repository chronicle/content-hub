Download File From Bucket:
  ai_description: >-
    ### General Description

    Downloads a specific file from an AWS S3 bucket to a local directory on the host
    executing the action.


    ### Flow Description

    1. Extracts the target bucket file path and the local download path from the action
    parameters.

    2. Connects to the AWS S3 service using the `boto3` client and validates connectivity.

    3. Downloads the specified file from the S3 bucket to the local file system.

    4. Returns a JSON object containing the bucket file path and the local download
    path.


    ### Additional Notes

    The action requires valid AWS credentials with `s3:GetObject` permissions for
    the target bucket. The local download path must be accessible and not already
    contain a file with the same name.
  ai_short_description: >-
    Downloads a specified file from an AWS S3 bucket to a local path on the executing
    host.
