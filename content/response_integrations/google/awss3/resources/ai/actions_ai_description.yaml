Upload File To Bucket:
  ai_description: >-
    ### General Description

    Uploads a specified local file to a target AWS S3 bucket. This action takes a
    local file path from the SOAR environment and pushes it to a designated path within
    an S3 bucket.


    ### Flow Description

    1. Extracts the AWS S3 credentials and region from the integration configuration.

    2. Extracts the local `File Path` and the target `Bucket Upload Path` from the
    action parameters.

    3. Parses the target bucket path to identify the bucket name and destination filename.

    4. Authenticates and connects to the AWS S3 service using the `boto3` client.

    5. Uploads the local file to the specified AWS S3 bucket using the `upload_file`
    API call.

    6. Returns the upload details (bucket path and file path) as a JSON result.


    ### Additional Notes

    Requires valid AWS credentials with `s3:PutObject` permissions for the target
    bucket. The local file must exist and be accessible by the SOAR agent executing
    the action.
  ai_short_description: >-
    Uploads a specified local file to a target AWS S3 bucket.
  capabilities:
