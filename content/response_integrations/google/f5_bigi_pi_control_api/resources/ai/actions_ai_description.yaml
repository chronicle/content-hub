      Adds IP addresses to a specified firewall address list in F5 BIG-IP.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PATCH request to F5 BIG-IP to update an address list with
      new IP addresses, which mutates external data. It does not fetch data for enrichment
      purposes, nor does it update internal entities, create insights, or add case
