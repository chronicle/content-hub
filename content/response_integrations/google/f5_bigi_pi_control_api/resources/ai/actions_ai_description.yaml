Add IP To Data Group:
  ai_description: >-
    ### General Description

    Adds IP address entities to a specified internal data group in F5 BIG-IP. This
    action modifies the configuration of the F5 BIG-IP device by appending the target
    IP addresses to the records of an existing data group.


    ### Flow Description

    1. Filters the target entities to include only IP addresses (Address entities).

    2. Makes a GET request to the F5 BIG-IP API to retrieve the current records of
    the specified data group.

    3. Verifies that the retrieved data group is of the 'ip' type.

    4. Appends the target IP addresses to the data group's records list.

    5. Makes a PATCH request to the F5 BIG-IP API to update the data group with the
    new list of records.

    6. Returns the updated data group details as a JSON result and provides a summary
    message of successful and failed entities.


    ### Additional Notes

    This action only supports internal data groups in F5 BIG-IP. Ensure the specified
    data group exists and is configured as an IP group type before executing the action.
