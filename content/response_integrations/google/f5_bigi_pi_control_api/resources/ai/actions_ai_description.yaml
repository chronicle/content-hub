Add IP To Address List:
  ai_description: >-
    ### General Description

    Adds IP address entities to a specified address list in F5 BIG-IP. This action
    modifies the configuration of the firewall by appending new IP addresses to an
    existing address list, which can be used in firewall rules for blocking or allowing
    traffic.


    ### Flow Description

    1. Extracts the target address list name from the action parameters.

    2. Filters the target entities to include only IP addresses (ADDRESS).

    3. Retrieves the current addresses in the specified address list from F5 BIG-IP
    via a GET request.

    4. Appends the target IP addresses to the retrieved list.

    5. Updates the address list in F5 BIG-IP with the new addresses via a PATCH request.

    6. Returns a summary message and JSON results containing the updated address list.


    ### Additional Notes

    Ensure that the specified address list already exists in F5 BIG-IP before executing
    this action.
  ai_short_description: >-
    Adds IP address entities to a specified firewall address list in F5 BIG-IP.
