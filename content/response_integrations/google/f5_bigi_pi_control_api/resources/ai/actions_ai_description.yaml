Remove Port From Port List:
  ai_description: >-
    ### General Description

    Removes specified ports from a port list in F5 BIG-IP. This action modifies the
    configuration of an existing port list by deleting the provided ports from it.


    ### Flow Description

    1. Extracts the `Port List Name` and the `Ports` to remove from the action parameters.

    2. Makes a GET request to the F5 BIG-IP API to fetch the current configuration
    of the specified port list.

    3. Filters out the specified ports from the retrieved port list data.

    4. Makes a PATCH request to the F5 BIG-IP API to update the port list with the
    remaining ports.

    5. Returns the updated port list data as a JSON result and provides a summary
    message of the successfully removed ports and any ports that did not exist in
    the list.


    ### Additional Notes

    The action will fail if attempting to remove all ports from the port list, as
    F5 BIG-IP requires port lists to contain at least one port.
