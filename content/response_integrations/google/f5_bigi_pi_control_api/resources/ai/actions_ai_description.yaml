    is removed from the local records list.

    7. If there are remaining records, makes a PATCH request to update the data group
    on F5 BIG-IP with the modified records list.

    8. Returns a JSON result containing the updated data group details and outputs
    a summary message of successful and failed removals.


    ### Additional Notes

    - The action only supports internal data groups with the IP type.

