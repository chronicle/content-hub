"Get Events Associated With Process by Process Guid":
  ai_description: >-
    ### General Description

    Retrieves events associated with specific processes from VMware Carbon Black Enterprise
    EDR based on provided Process GUIDs. This action provides detailed results on
    specific process activity.


    ### Flow Description

    1. Extracts action parameters including Process GUIDs, search criteria, query,
    timeframe, and record limit.

    2. Initializes the CB Enterprise EDR manager with integration credentials.

    3. Iterates over the provided Process GUIDs.

    4. Makes a POST request to the CB Enterprise EDR API (`/api/investigate/v2/orgs/{org_key}/events/{process_guid}/_search`)
    to search for events matching the criteria.

    5. Parses the returned events and adds them to a CSV data table and JSON result.


    ### Additional Notes

    The action requires a valid Process GUID to function correctly. Multiple GUIDs
    can be provided as a comma-separated string.
