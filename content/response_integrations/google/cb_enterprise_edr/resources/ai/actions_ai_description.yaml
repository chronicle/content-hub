Process Search:
  ai_description: >-
    ### General Description

    Searches for process activity on a host with a Carbon Black (CB) sensor based
    on provided search parameters. It interacts with the CB Enterprise EDR API to
    initiate a search job and retrieve process observations for Hostname entities.
    The results are attached as a data table and JSON result to the action.


    ### Flow Description

    1. Initializes the CB Enterprise EDR manager with the provided API credentials.

    2. Iterates through the target Hostname entities.

    3. For each entity, initiates a process search job via the CB Enterprise EDR API
    (`POST /api/investigate/v2/orgs/{org_key}/observations/search_jobs`).

    4. Polls and retrieves the search results from the API (`GET /api/investigate/v2/orgs/{org_key}/observations/search_jobs/{job_id}/results`).

    5. Attaches the process information as a data table and JSON result to the action.

    6. Updates the successful entities in the platform.


    ### Additional Notes

    The action requires Hostname entities to execute successfully. The POST request
    made to the API is strictly for initiating an asynchronous search job and does
    not mutate external state.
  ai_short_description: >-
    Searches for process activity on a host with a Carbon Black sensor based on provided
    search parameters.
