Enrich Hash:
  ai_description: >-
    ### General Description

    Enriches File Hash entities using VMware Carbon Black Enterprise EDR. This action
    retrieves metadata and summary information for SHA256 file hashes, updating the
    entity's additional properties with the fetched threat intelligence and device
    summary data.


    ### Flow Description

    1. Iterates through the target entities in the case.

    2. Filters for File Hash entities that are exactly 64 characters long (SHA256).

    3. Makes a GET request to the VMware Carbon Black Enterprise EDR API to fetch
    file hash metadata.

    4. Makes a GET request to the VMware Carbon Black Enterprise EDR API to fetch
    file hash summary data (device sightings).

    5. Updates the entity's additional properties with the retrieved enrichment data
    and marks it as enriched.

    6. Returns the raw data as a JSON result.


    ### Additional Notes

    The action only accepts file hashes in SHA256 format. Hashes of other formats
    (e.g., MD5, SHA1) will be skipped.
  ai_short_description: >-
    Enriches SHA256 File Hash entities with metadata and device summary information
    using VMware Carbon Black Enterprise EDR.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes GET requests to the VMware Carbon Black Enterprise EDR API
      to fetch file hash metadata and summary data (fetches_data=true). It does not
      mutate external data or internal SecOps data outside of entities. It updates
      the entities with the fetched enrichment data (can_update_entities=true). It
      does not create insights, modify alert data, or create case comments.
