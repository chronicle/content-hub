Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the VMware Carbon Black Enterprise EDR server.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, Organization Key,
    API ID, API Secret Key, Verify SSL).

    2. Initializes the `CBEnterpriseEDRManager`.

    3. Executes the `test_connectivity` method, which makes a GET request to the `/threathunter/watchlistmgr/v3/orgs/{org_key}/watchlists`
    API endpoint to verify access.

    4. Returns a success message and a result value of "true" if the connection is
    established, or an error message and "false" if it fails.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can successfully communicate with the Carbon Black Enterprise EDR API.
