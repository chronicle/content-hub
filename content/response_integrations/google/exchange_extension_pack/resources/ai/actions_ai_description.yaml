"Add Domains to Exchange-Siemplify Mail Flow Rules":
  ai_description: >-
    ### General Description

    Adds a list of domains to a specified mail flow rule in Microsoft Exchange (On-Premises
    or Office 365). If the specified rule does not exist, the action will create it
    to filter the provided domains.


    ### Flow Description

    1. Extracts the list of domains and the target rule name from the action parameters.

    2. Validates the provided domains to ensure they are properly formatted.

    3. Establishes a PowerShell session to connect to the Exchange server.

    4. Retrieves existing mail flow rules to check if the target rule already exists.

    5. If the rule exists, updates it by appending the new valid domains. If it does
    not exist, creates a new rule with the specified domains.

    6. Returns a JSON result detailing the successfully added domains, domains that
    were already present in the rule, and any invalid domains.


    ### Additional Notes

    To use this action, the configured account must have Organization Management permissions
    in Exchange.
