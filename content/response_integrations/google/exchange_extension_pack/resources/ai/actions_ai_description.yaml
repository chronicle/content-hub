    clean up the search task from the server once completed.


    ### Flow Description

    1. Initiates a compliance search preview action on the Exchange server using the
    provided search name.

    2. Periodically polls the Exchange server to check the status of the preview action.

    3. Once the preview action is completed, retrieves the search results (up to the
    specified maximum limit).

    4. If configured, removes the compliance search and any related fetch or purge
    tasks from the Exchange server.

