"Add Senders to Exchange-Siemplify Mail Flow Rule":
  ai_description: >-
    ### General Description

    Adds specified email addresses (and optionally their domains) to a mail flow rule
    in Microsoft Exchange (On-Premises or Office 365). If no email addresses are provided
    in the parameters, the action will process User entities from the case that have
    valid email addresses as their identifiers. This is typically used to block or
    permanently delete emails from specific senders.


    ### Flow Description

    1. Extracts the provided email addresses from the action parameters or falls back
    to User entities with valid email identifiers.

    2. Connects to the Exchange server (On-Premises or Office 365) using PowerShell.

    3. Retrieves the existing mail flow rules to check if the specified rule already
    exists.

    4. If the rule exists, updates it by adding the new senders. If it does not exist,
    creates a new mail flow rule with the specified senders.

    5. If configured, extracts the domains from the email addresses and adds them
    to the corresponding domain-based mail flow rule.

    6. Returns a JSON result containing the successfully added items, items that were
    already present, and invalid items.


    ### Additional Notes

    - Requires Organization Management permissions on the Exchange server.

    - The action executes asynchronously and may retry in case of network errors.
