"Remove Domains from Exchange-Siemplify Mail Flow Rules":
  ai_description: >-
    ### General Description

    Removes a specified list of domains from an existing mail flow rule in Microsoft
    Exchange (On-Premises or Office 365). This action is typically used to remove
    domains from a restriction or deletion rule, effectively restoring normal mail
    flow for those domains.


    ### Flow Description

    1. Extracts the list of domains and the target rule name from the action parameters.

    2. Validates the provided domains to ensure they are properly formatted.

    3. Connects to the Microsoft Exchange server using PowerShell.

    4. Retrieves the existing mail flow rule to identify the currently configured
    domains.

    5. Removes the specified valid domains from the rule's conditions. If the rule
    becomes empty as a result, it deletes the rule entirely.

    6. Returns a JSON result containing the successfully removed domains, domains
    that didn't exist in the rule, and any invalid domains.


