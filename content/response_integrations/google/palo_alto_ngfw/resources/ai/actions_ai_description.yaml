  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Device Name | String | Yes | The device name in which the group is located.
    The default device name of NGFW is localhost.localdomain. In case configured differently,
    please refer to https://<NGFWIP>/php/rest/browse.php/config::devices for the list
    of all the device names and select the relevant device. |

    | Vsys Name | String | Yes | The vsys in which the group is located. The default
    vsys name of NGFW is vsys1. In case configured differently, please refer to https://<NGFW
    IP>/php/rest/browse.php/config::devices::entry[@name='<DEVICE NAME>']::vsys for
    the list of all the vsys names of the device and select the relevant vsys. |

    | Policy Name | String | Yes | Policy name value. |

    | Target | String | Yes | Has to be source or destination. |
