Edit Blocked Applications:
  ai_description: >-
    ### General Description

    This action manages application-based blocking on a Palo Alto Networks Next-Generation
    Firewall (NGFW). It enables the addition or removal of specific applications from
    a designated security policy, allowing for dynamic adjustment of access controls
    based on application signatures.


    ### Flow Description

    1. Retrieves connection details and target policy identifiers (Device, Vsys, Policy
    Name).

    2. Parses the comma-separated strings of applications to block and unblock into
    unique sets.

    3. Fetches the current candidate configuration from the Palo Alto NGFW via API
    to identify the existing applications assigned to the policy.

    4. Calculates the new set of applications by adding the requested 'Block' applications
    and removing the 'Unblock' applications.

    5. Sends a request to the NGFW API to update the application list for the specified
    policy if changes are detected.

    6. Retrieves the updated list of applications from the firewall to confirm the
    current state.

    7. Returns a JSON result containing the final list of applications in the policy.


    ### Additional Notes

    - If neither 'Applications To Block' nor 'Applications To UnBlock' are provided,
    the action will complete without making any changes to the firewall configuration.

    - This action modifies the 'candidate configuration'. A separate 'Commit' action
    is typically required to make these changes active on the device.
