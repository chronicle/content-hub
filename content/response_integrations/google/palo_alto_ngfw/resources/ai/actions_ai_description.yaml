Commit Changes:
  ai_description: "### General Description\nThis action commits pending configuration\
    \ changes on a Palo Alto Networks Next-Generation Firewall (NGFW). In Palo Alto\
    \ NGFW, configuration changes are first made to a 'candidate configuration' and\
    \ must be explicitly committed to become part of the 'running configuration'.\
    \ This action allows security analysts to finalize changes made by other automated\
    \ actions (like blocking IPs or URLs) or manual edits.\n\n### Flow Description\n\
    1. **Authentication:** The action authenticates with the Palo Alto NGFW using\
    \ the configured API credentials to obtain an API key.\n2. **Parameter Extraction:**\
    \ It retrieves the `Only My Changes` boolean flag from the action parameters.\n\
    3. **Commit Execution:** \n    - If `Only My Changes` is enabled, it makes an\
    \ API call to send a partial commit command targeting only the changes associated\
    \ with the current user.\n    - If `Only My Changes` is disabled, it makes an\
    \ API call to send a force commit command for all pending changes.\n4. **Finalization:**\
    \ The action validates the API response and reports a successful commit to the\
    \ Google SecOps case wall.\n\n### Additional Notes\n- **Permissions:** To use\
    \ the `Only My Changes` option, the configured user must have administrative privileges\
    \ on the Palo Alto device.\n- **Scope:** This action does not target specific\
    \ entities; it operates on the global configuration state of the firewall."
  ai_short_description: >-
    Commits pending configuration changes on a Palo Alto Networks Next-Generation
    Firewall (NGFW) to apply them to the active running configuration.
