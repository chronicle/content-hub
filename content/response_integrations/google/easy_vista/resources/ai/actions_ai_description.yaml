Close EasyVista Ticket:
  ai_description: >-
    ### General Description

    Closes a specific ticket in EasyVista based on the provided ticket identifier.
    This action allows analysts to resolve or close tickets directly from the SOAR
    platform, optionally adding a closing comment and specifying whether to delete
    ongoing actions.


    ### Flow Description

    1. Extracts the target ticket identifier, comment, close date, and deletion preferences
    from the action parameters.

    2. Validates the provided `Actions Close Date` format (MM/DD/YYYY HH:MM:SS). If
    invalid, it defaults to the current time.

    3. Makes a PUT request to the EasyVista API (`/requests/{ticket_id}`) to update
    the ticket status to closed, appending the provided comment and applying the deletion
    preference for ongoing actions.

    4. Returns a success or failure message based on the API response.


    ### Additional Notes

    This action does not operate on Google SecOps entities; it requires a specific
    EasyVista ticket identifier (rfc_number) to function.
