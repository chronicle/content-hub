Get EasyVista Ticket:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a specific ticket from EasyVista. This action
    fetches general ticket details, descriptions, comments, actions, and attachments
    based on the provided ticket identifier.


    ### Flow Description

    1. Extracts the `Ticket Identifier` parameter.

    2. Initializes the EasyVista API client with the provided integration credentials.

    3. Makes multiple GET requests to the EasyVista API to fetch general info, description,
    comments, actions, and attachments for the specified ticket.

    4. Aggregates the retrieved data into a comprehensive JSON object.

    5. Returns the aggregated ticket information as a JSON result and populates a
    data table with the ticket details.


    ### Additional Notes

    This action does not operate on Google SecOps entities; it requires a specific
    ticket identifier (e.g., rfc_number) to function.
