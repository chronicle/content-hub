Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the EasyVista instance using the parameters provided at
    the integration configuration page.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Account ID, Username,
    Password, Verify SSL).

    2. Initializes the EasyVistaManager.

    3. Makes an HTTP GET request to the EasyVista API endpoint (`/requests?max_rows=1`)
    to verify connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action does not require any action-specific parameters and is primarily used
    for integration setup and troubleshooting.
