Add Comment to Ticket:
  ai_description: >-
    ### General Description

    Adds a comment to a specific ticket in EasyVista.


    ### Flow Description

    1. Extracts the `Ticket Identifier` and `Comment` from the action parameters.

    2. Initializes the EasyVista API client with the provided integration credentials.

    3. Makes a PUT request to the EasyVista API to append the provided comment to
    the specified ticket.

    4. Returns a success message if the comment is added successfully, or an error
    message if the operation fails.


    ### Additional Notes

    This action does not operate on Google SecOps entities; it relies entirely on
    the provided input parameters.
