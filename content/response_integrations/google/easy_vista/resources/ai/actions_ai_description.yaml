Wait for the Ticket Update:
  ai_description: >-
    ### General Description

    Pauses the playbook execution and periodically connects to EasyVista to check
    if a specified ticket has been updated. The action can monitor a specific field
    (Status, Comment, or Actions) for changes. Once the monitored field is updated,
    the action completes and returns the updated ticket information.


    ### Flow Description

    1. The action initiates by fetching the initial state of the specified ticket
    from EasyVista using a GET request.

    2. It stores the initial state and returns an `INPROGRESS` status to pause the
    playbook.

    3. On subsequent runs, it fetches the current state of the ticket from EasyVista.

    4. It compares the current state with the initial state.

    5. If the state has changed, the action completes and returns the updated ticket
    information as a JSON result. If not, it remains in an `INPROGRESS` state.


    ### Additional Notes

    This is an asynchronous action that will continue to run periodically until the
    ticket is updated or the action times out.
  ai_short_description: >-
    Pauses playbook execution and periodically checks EasyVista for updates to a specified
    ticket, completing and returning the updated information once a change is detected.
