Delete Threat Intelligence Set:
  ai_description: >-
    ### General Description

    Deletes one or more threat intelligence sets in AWS GuardDuty. This action initiates
    a state change on the external AWS environment by removing the specified threat
    intelligence configurations from a given detector.


    ### Flow Description

    1. Extracts the `Detector ID` and `Threat Intelligence Set IDs` from the action
    parameters.

    2. Establishes a connection to the AWS GuardDuty service using the provided integration
    credentials.

    3. Validates the existence of the specified detector by calling the AWS GuardDuty
    API.

    4. Iterates through the provided list of Threat Intelligence Set IDs and calls
    the AWS GuardDuty API (`delete_threat_intel_set`) to delete each set.

    5. Aggregates the results and returns a summary message indicating which threat
    intelligence sets were successfully deleted and which failed.


    ### Additional Notes

    Ensure that the provided AWS credentials have the necessary permissions (`guardduty:DeleteThreatIntelSet`)
    to perform the deletion.
