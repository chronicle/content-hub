Create a Trusted IP List:
  ai_description: >-
    ### General Description

    Creates a new list of trusted IP addresses (IPSet) in AWS GuardDuty. These trusted
    IP lists are used to whitelist IP addresses for secure communication with AWS
    infrastructure and applications, preventing GuardDuty from generating findings
    for them.


    ### Flow Description

    1. Extracts the provided parameters including Detector ID, Name, File Format,
    File Location, Activate status, and AWS Region.

    2. Initializes the connection to the AWS GuardDuty service using the provided
    credentials and region.

    3. Calls the AWS GuardDuty API to create a new IP Set (Trusted IP List) using
    the specified file location and format.

    4. Returns the ID of the newly created Trusted IP List in the JSON results and
    outputs a success message.


    ### Additional Notes

    Only 1 Trusted IP set can be created and activated at a time. GuardDuty does not
    generate findings for IP addresses that are included in active IPSets. Only users
    from the master account can use this operation.
