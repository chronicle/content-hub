Archive Findings:
  ai_description: >-
    ### General Description

    Archives specific Amazon GuardDuty findings based on their finding IDs. This action
    initiates a state change in the external AWS GuardDuty service to mark the specified
    findings as archived.


    ### Flow Description

    1. Extracts the `Detector ID`, `Finding IDs`, and `AWS Region` from the action
    parameters.

    2. Establishes a connection to the AWS GuardDuty service.

    3. Calls the AWS GuardDuty `get_findings` API to fetch the specified findings
    and verify their existence.

    4. Iterates through the verified findings and calls the AWS GuardDuty `archive_findings`
    API to archive them.

    5. Returns a summary message detailing which findings were successfully archived
    and which could not be archived.


    ### Additional Notes

    Ensure that the provided Finding IDs are valid and exist within the specified
    Detector ID.
  ai_short_description: >-
    Archives specific Amazon GuardDuty findings based on their finding IDs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Archives specific findings in the external AWS GuardDuty service.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by calling the 'get_findings' API to verify the existence
      of the findings. It mutates external data by calling the 'archive_findings'
      API to archive the findings in AWS GuardDuty. It does not mutate internal data,
      update entities, create insights, modify alert data, or create case comments.
  entity_usage:
