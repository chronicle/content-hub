Force Password Update:
  ai_description: >-
    ### General Description

    Forces a password update for specified Azure Active Directory users. This action
    modifies the user's password profile in Azure AD to require them to change their
    password during their next login attempt. It is primarily used as a containment
    or remediation step when a user account is suspected of being compromised.


    ### Flow Description

    1. **Initialization:** The action retrieves Azure AD credentials and configuration
    parameters from the integration settings.

    2. **Authentication:** It initializes the `AzureADManager`, which generates an
    OAuth2 access token using the provided Client ID and Secret.

    3. **Entity Selection:** The action filters the target entities to identify those
    of type `USER`.

    4. **API Interaction:** For each valid user entity, it calls the Microsoft Graph
    API via a `PATCH` request to the `/users/{user}` endpoint. The request payload
    sets `forceChangePasswordNextSignIn` to `true` within the `passwordProfile` object.

    5. **Completion:** The action tracks successful and failed updates, returning
    a summary message to the Google SecOps case wall and setting the final execution
    status.


    ### Additional Notes

    - The action expects User entities to be in the `username@domain` format (User
    Principal Name).

    - This action performs a state change in the external Azure AD environment and
    is not considered an enrichment action.
