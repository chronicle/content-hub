Disable Account:
  ai_description: >-
    ### General Description

    Disables a user account in Azure Active Directory (Azure AD). It is primarily
    used for containment and remediation during security incidents to prevent unauthorized
    access by a compromised or suspicious user account. The action targets User entities
    and updates their status in the external Azure AD environment.


    ### Flow Description

    1. Retrieves necessary configuration parameters and initializes the Azure AD Manager.

    2. Filters the target entities to identify all `USER` entities.

    3. Iterates through the suitable entities and sends a `PATCH` request to the Microsoft
    Graph API endpoint (`v1.0/users/{user}`) with the payload `{"accountEnabled":
    "false"}` to disable the account.

    4. Tracks successful and failed operations.

    5. Returns a summary message indicating the success or failure of the operation
    for each entity.


    ### Additional Notes

    The action expects User entities to be in the format `username@domain` (User Principal
    Name). This action performs a state change in Azure AD and is not considered an
    enrichment action.
