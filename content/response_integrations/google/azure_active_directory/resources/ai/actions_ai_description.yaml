Remove User from a Group:
  ai_description: >-
    ### General Description

    Removes one or more users from a specified Azure Active Directory (Azure AD) group.
    This action allows for group membership management by targeting users either through
    Siemplify entities or manual input parameters. It supports identifying groups
    by their Display Name or unique Group ID.


    ### Flow Description

    1. **Initialization**: Retrieves Azure AD connection details and action parameters.

    2. **Group Resolution**: If a `Group ID` is provided, it is used directly. Otherwise,
    the action queries Azure AD to find the ID associated with the provided `Group
    Name`.

    3. **User Identification**: Collects usernames from the `User Name` parameter.
    If not provided, it falls back to extracting identifiers from `USER` entities
    in the action scope.

    4. **Processing**: For each username:
        - Retrieves the internal Azure User ID using the principal name via a GET
    request to the Microsoft Graph API.
        - Sends a DELETE request to the Microsoft Graph API to remove the user's reference
    from the specified group's members list.
    5. **Reporting**: Aggregates results, identifying which users were successfully
    removed, which were not found in the group, and which were not found in the directory
    at all.


    ### Additional Notes

    - Either **Group Name** or **Group ID** must be provided for the action to execute.

    - Usernames must be in the `username@domain` format.

    - If no **User Name** parameter is supplied, the action will attempt to process
    all `USER` entities currently in the action scope.
