Enable Account:
  ai_description: >-
    ### General Description

    Enables a user account in Azure Active Directory (Azure AD). This action is used
    as a remediation or containment step to restore access to a previously disabled
    user account. It interacts with the Microsoft Graph API to update the account
    status.


    ### Flow Description

    1. Filters the target entities to identify those of type `USER`.

    2. Authenticates with the Azure AD Login API using the client credentials grant
    type to retrieve an OAuth2 access token.

    3. For each identified user entity, the action sends a `PATCH` request to the
    `/users/{user_principal_name}` endpoint with the payload `{"accountEnabled": "true"}`
    to enable the account.

    4. Collects the results for all processed entities and returns a summary message
    indicating which accounts were successfully enabled and which failed.


    ### Additional Notes

    The action expects the user entity identifier to be in the `username@domain` format
    (User Principal Name).
