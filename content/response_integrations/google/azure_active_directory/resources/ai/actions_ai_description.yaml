    \ designed to verify the connectivity between Google SecOps and the Azure Active\
    \ Directory (Azure AD) service. It ensures that the integration configuration\
    \ parameters\u2014such as credentials and API endpoints\u2014are correct and that\
    \ the network path to the Microsoft Graph API is open.\n\n### Flow Description\n\
