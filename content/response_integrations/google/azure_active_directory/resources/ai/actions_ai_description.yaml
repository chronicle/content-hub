Add User To a Group:
  ai_description: >-
    ### General Description

    Adds specific User entities to a designated Azure Active Directory (Azure AD)
    group. This action is primarily used for access management and containment workflows,
    such as moving a compromised user to a restricted security group. The action requires
    the user's identifier to be in the User Principal Name (UPN) format and the target
    group to be identified by its unique GUID.


    ### Flow Description

    1. **Initialization**: Retrieves the target Group ID from the action parameters.

    2. **Entity Filtering**: Filters the target entities to identify those of type
    `USER`.

    3. **User Identification**: For each user entity, makes a GET request to the Azure
    AD API to retrieve the internal Object ID associated with the user's Principal
    Name.

    4. **Membership Update**: Executes a POST request to the Azure AD API to add the
    user's directory object to the specified group.

    5. **Completion**: Returns a summary message indicating successful and failed
    additions.


    ### Additional Notes

    - The action specifically targets entities of type `USER`.

    - If a user is already a member of the group, the API may return an error which
    the action will log as a failure for that specific entity.
  ai_short_description: >-
    Adds specific User entities to a designated Azure Active Directory (Azure AD)
    group for access management or containment purposes.
