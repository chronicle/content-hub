Reset User Password:
  ai_description: >-
    ### General Description

    Resets the password for specified users in Azure Active Directory. This action
    allows an analyst to set a new password for a user and automatically forces them
    to change it upon their next login. It is primarily used for account recovery
    or as a containment measure during a security incident.


    ### Flow Description

    1. **Initialization:** The action retrieves integration configuration (Client
    ID, Secret, Tenant ID) and action parameters (`Username`, `Password`).

    2. **Target Identification:** It determines the list of target users. It first
    checks the `Username` parameter; if empty, it collects all `USERUNIQNAME` (User)
    entities from the current SecOps context.

    3. **Connectivity Check:** It initializes the `AzureADManager`, which authenticates
    with Microsoft Graph and verifies connectivity.

    4. **Password Reset Execution:** For each identified user, the action sends a
    `PATCH` request to the Microsoft Graph API (`v1.0/users/{user}`) to update the
    user's `passwordProfile`. This update sets the new password and enables the `forceChangePasswordNextSignIn`
    flag.

    5. **Error Handling:** The action monitors for password complexity errors, timeouts,
    and general API failures, tracking successful and failed attempts separately.

    6. **Final Reporting:** It concludes by providing a summary message of which users
    were successfully updated and which failed.


    ### Additional Notes

    - **Precedence:** If the `Username` parameter is populated, the action will prioritize
    those values over any `USERUNIQNAME` entities present in the case.

    - **Complexity Requirements:** The action will fail for a specific user if the
    provided password does not meet the Azure AD password complexity policies.

    - **Format:** Usernames must be in the User Principal Name (UPN) format (e.g.,
    user@company.com).
