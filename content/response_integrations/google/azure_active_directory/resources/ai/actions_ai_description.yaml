Enrich Host:
  ai_description: >-
    ### General Description

    Enriches Hostname entities with device information from Azure Active Directory
    (Azure AD). The action searches for a device in Azure AD where the `displayName`
    matches the entity's identifier. If a match is found, it retrieves metadata such
    as operating system, version, compliance status, and last sign-in time.


    ### Flow Description

    1. Identifies all Hostname entities within the current context.

    2. For each Hostname, queries the Microsoft Graph `/devices` endpoint using a
    filter on the `displayName` attribute.

    3. If multiple devices are returned, it selects the one that is currently enabled
    and has the most recent sign-in timestamp.

    4. Updates the entity's additional properties with the retrieved data (prefixed
    with 'AAD') and marks the entity as enriched.

    5. Adds a detailed CSV-formatted data table to the case wall for each successfully
    enriched host.

    6. Attaches the raw JSON results to the action's output.


    ### Additional Notes

    None.
