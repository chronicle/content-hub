Enrich User:
  ai_description: >-
    ### General Description

    Enriches User entities by retrieving comprehensive profile information from Azure
    Active Directory (Microsoft Graph API). It provides context regarding a user's
    organizational role, contact information, account status, and optionally, their
    Multi-Factor Authentication (MFA) registration status and sign-in activity.


    ### Flow Description

    1. **Initialization**: Extracts action parameters such as `Fields To Return`,
    `Include MFA Details`, and `Include Last Sign In Details`.

    2. **Entity Filtering**: Filters the target entities to include only those of
    type `USER`.

    3. **Data Retrieval**: For each suitable user entity, performs a GET request to
    the Microsoft Graph API to fetch the user's profile based on the specified fields.

    4. **MFA Enrichment**: If `Include MFA Details` is enabled, performs an additional
    API call to retrieve authentication method registration details.

    5. **Sign-In Activity Enrichment**: If `Include Last Sign In Details` is enabled,
    performs an additional API call to retrieve the user's sign-in activity.

    6. **Internal Updates**: Updates the entity's `additional_properties` with the
    retrieved data, marks the entity as enriched, and adds a data table to the case
    wall.

    7. **Completion**: Updates the entities in the Google SecOps environment and returns
    a JSON result containing the raw data.


    ### Additional Notes

    - The action expects the User entity identifier to be in a format compatible with
    Azure AD User Principal Names (UPN), typically `username@domain.com`.

    - Fetching MFA details or sign-in activity requires specific permissions (e.g.,
    `AuditLog.Read.All`) in Azure AD.
