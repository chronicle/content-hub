Revoke User Session:
  ai_description: >-
    ### General Description

    The **Revoke User Session** action is a containment capability for Azure Active
    Directory (Azure AD) that immediately invalidates all active sessions and refresh
    tokens for a specified user. This action is primarily used during security incidents
    to prevent further unauthorized access by a compromised account by forcing the
    user to re-authenticate across all devices and browser sessions.


    ### Flow Description

    1. **Entity Identification**: The action filters the target entities to identify
    those of type `USER`.

    2. **User Lookup**: For each identified user, the action determines if the identifier
    is an email address or a display name. It then queries the Microsoft Graph API
    (`GET /users`) to retrieve the unique Azure User ID.

    3. **Session Revocation**: Using the retrieved User ID, the action executes a
    POST request to the `revokeSignInSessions` endpoint (`POST /users/{user_id}/revokeSignInSessions`).
    This invalidates all refresh tokens and session cookies issued to the user.

    4. **Result Processing**: The action collects the API responses and reports success
    or failure for each entity. If a user is not found in Azure AD, it is flagged
    as a failure.


    ### Additional Notes

    - **Permissions**: The Azure AD application must have the `User.ReadWrite.All`
    or `Directory.ReadWrite.All` Microsoft Graph API permissions.

    - **Propagation**: Session revocation can take up to 5 minutes to propagate across
    all Microsoft 365 services and applications.
  ai_short_description: >-
    Immediately invalidates all active sessions and refresh tokens for a specified
    user in Azure Active Directory to prevent unauthorized access.
