List Users:
  ai_description: >-
    ### General Description

    The **List Users** action retrieves a list of users from Azure Active Directory
    (Microsoft Graph API) based on user-defined search and filtering criteria. It
    allows for field selection, sorting, and advanced filtering specifically on the
    `userPrincipalName` (Username) field. This action is a utility task and does not
    operate on specific Google SecOps entities.


    ### Flow Description

    1. **Initialization**: Extracts configuration and action parameters.

    2. **Connectivity**: Initializes the `AzureADManager` to establish a session with
    the Microsoft Graph API.

    3. **Validation**: Validates if the advanced filter can be applied based on the
    selected output fields.

    4. **Data Retrieval**: Sends a GET request to the `/users` endpoint, applying
    OData `$select` and `$orderby` parameters.

    5. **Pagination & Filtering**: Iterates through paginated results and applies
    manual filtering if an `Advanced Filter Value` is provided.

    6. **Output**: Constructs a CSV-formatted data table and a JSON result containing
    the user details, attaching them to the action output.


    ### Additional Notes

    - If an `Advanced Filter Value` is provided, the `Filter` parameter must either
    be set to "All Fields" or include `userPrincipalName` in the selection; otherwise,
    the action will fail.
