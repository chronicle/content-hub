name: List Members in the Group
description: List members in the specified Azure AD group.
integration_identifier: AzureActiveDirectory
parameters:
-   name: Max Records To Return
    default_value: '50'
    type: string
    description: Specify how many records to return. If nothing is provided, action
        will return 50 records.
    is_mandatory: false
-   name: Group Name
    default_value: ''
    type: string
    description: Specify group name to return user list for.
    is_mandatory: false
-   name: Group ID
    default_value: ''
    type: string
    description: 'Specify the ID of the group in which you want to list the members.
        If both "Group Name" and "Group ID" are provided, then "Group ID" will have
        priority. Example of the id: 00e40000-1971-439d-80fc-d0e000001dbd.'
    is_mandatory: false
-   name: Filter Key
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - User Display Name
    - User Principal Name
    - User Mail Name
    description: Specify the key that needs to be used to filter group members.
    is_mandatory: false
-   name: Filter Logic
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - Equal
    - Contains
    description: Specify what filter logic should be applied. Filtering logic is working
        based on the value  provided in the "Filter Key" parameter.
    is_mandatory: false
-   name: Filter Value
    default_value: ''
    type: string
    description: Specify what value should be used in the filter. If “Equal“ is selected,
        action will try to find the exact match among results and if "Contains" is
        selected, action will try to find results that contain that substring. If
        nothing is provided in this parameter, the filter will not be applied. Filtering
        logic is working based on the value  provided in the "Filter Key" parameter.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_members_in_group_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities":[]}'
