name: List Users
description: List Azure Active Directory users based on the specified search criteria.
    Note that action is not working on Siemplify entities. Additionally, advanced
    filtering is working on the Username (userPrincipalName) field.
integration_identifier: AzureActiveDirectory
parameters:
-   name: Filter
    default_value: All Fields
    type: ddl
    optional_values:
    - All Fields
    - displayName
    - userPrincipalName
    - id
    - jobTitle
    - mail
    - mobilePhone
    - preferredLanguage
    - surname
    - givenName
    description: Specifies which fields will be included in the results. By default,
        we will return all the fields.
    is_mandatory: false
-   name: Order By Field
    default_value: displayName
    type: ddl
    optional_values:
    - displayName
    - userPrincipalName
    description: Specifies the field based on which the results are ordered.
    is_mandatory: false
-   name: Order By
    default_value: DESC
    type: ddl
    optional_values:
    - DESC
    - ASC
    description: Specifies the result order.
    is_mandatory: false
-   name: Results Limit
    default_value: ''
    type: string
    description: Specify max number of users to return.
    is_mandatory: false
-   name: Advanced Filter Logic
    default_value: Equal
    type: ddl
    optional_values:
    - Equal
    - Contains
    description: Specify what filter logic should be applied. Advanced filtering is
        working on the Username (userPrincipalName) field.
    is_mandatory: false
-   name: Advanced Filter Value
    default_value: ''
    type: string
    description: Specify what value should be used in the filter. If “Equal“ is selected,
        action will try to find the exact match among results and if “Contains“ is
        selected, action will try to find results that contain that substring. If
        nothing is provided in this parameter, the filter will not be applied.  Advanced
        filtering is working on the Username (userPrincipalName) field.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_users_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities":[]}'
