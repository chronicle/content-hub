name: List User's Groups Membership
description: 'List Azure AD groups user is a member of. Note: The user name can be
    provided either as a Siemplify entity or as an action input parameter. If the
    user name is passed to action both as an entity and input parameter - action will
    be executed on the input parameter. User name should be specified in username@domain
    format.'
integration_identifier: AzureActiveDirectory
parameters:
-   name: User Name
    default_value: ''
    type: string
    description: Specify user name to return groups membership for. User name should
        be specified in username@domain format. Parameter accepts multiple values
        as a comma separated string.
    is_mandatory: false
-   name: Return Only Security Enabled Groups
    default_value: false
    type: boolean
    description: If enabled, only security groups that the user is a member of will
        be returned.
    is_mandatory: false
-   name: Return Detailed Groups Information
    default_value: false
    type: boolean
    description: If enabled, detailed information on the AD groups will be returned.
    is_mandatory: false
-   name: Filter Key
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Group Display Name
    - Group Description
    description: Specify the key that needs to be used to filter groups.
    is_mandatory: false
-   name: Filter Logic
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - Equal
    - Contains
    description: Specify what filter logic should be applied. Filtering logic is working
        based on the value  provided in the "Filter Key" parameter.
    is_mandatory: false
-   name: Filter Value
    default_value: ''
    type: string
    description: Specify what value should be used in the filter. If "Equal" is selected,
        action will try to find the exact match among results and if "Contains" is
        selected, action will try to find results that contain that substring. If
        nothing is provided in this parameter, the filter will not be applied. Filtering
        logic is working based on the value  provided in the "Filter Key" parameter.
    is_mandatory: false
-   name: Max Records To Return
    default_value: 50
    type: string
    description: Specify how many records to return. If nothing is provided, action
        will return 50 records.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_users_groups_membership_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
