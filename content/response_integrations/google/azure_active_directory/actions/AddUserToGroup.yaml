name: Add User To a Group
description: Add user to a specific Azure AD group. Action expects Siemplify user
    entity in username@domain format and group id in 00e40000-1971-439d-80fc-d0e000001dbd
    format.
integration_identifier: AzureActiveDirectory
parameters:
-   name: Group ID
    default_value: ''
    type: string
    description: Azure AD group id in 00e40000-1971-439d-80fc-d0e000001dbd format.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
