name: Reset User Password
description: Change user password to the password specified in the action. User will
    have to change their password on next login. Action expects User to change password
    for as  SecOps User entity in username@domain format or as an action input parameter.
    If the User name is passed to action both as a SecOps entity and input parameter
    - action will be executed on the input parameter.
integration_identifier: AzureActiveDirectory
parameters:
-   name: Username
    default_value: ''
    type: string
    description: User name to change password for. Parameter expects value in a username@domain
        format and accepts multiple values as a comma separated string.
    is_mandatory: false
-   name: Password
    default_value: ''
    type: password
    description: User Authentication password.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
