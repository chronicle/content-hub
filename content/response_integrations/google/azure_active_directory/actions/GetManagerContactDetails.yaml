name: Get Manager Contact Details
description: Get manager contact details for user. Action expects Siemplify user entity
    in username@domain format.
integration_identifier: AzureActiveDirectory
parameters:
-   name: Fields To Return
    default_value: accountEnabled,ageGroup,assignedLicenses,businessPhones,city,companyName,consentProvidedForMinor,country,createdDateTime,creationType,department,displayName,mail,employeeId,employeeHireDate,employeeOrgData,employeeType,onPremisesExtensionAttributes,externalUserStateChangeDateTime,faxNumber,givenName,imAddresses,identities,externalUserState,jobTitle,surname,lastPasswordChangeDateTime,legalAgeGroupClassification,mailNickname,mobilePhone,id,officeLocation,onPremisesSamAccountName,onPremisesDistinguishedName,onPremisesDomainName,onPremisesImmutableId,onPremisesLastSyncDateTime,onPremisesProvisioningErrors,onPremisesSecurityIdentifier,onPremisesSyncEnabled,onPremisesUserPrincipalName,otherMails,passwordPolicies,passwordProfile,preferredDataLocation,preferredLanguage,proxyAddresses,signInSessionsValidFromDateTime,sponsors,state,streetAddress,usageLocation,userPrincipalName,userType,postalCode,authorizationInfo,deletedDateTime,showInAddressList,isResourceAccount,refreshTokensValidFromDateTime
    type: string
    description: A comma-separated list of fields that you want to return. If nothing
        is provided, the action will return the Display Name, Mobile Phone, and Mail.
    is_mandatory: false
-   name: Include MFA Details
    default_value: false
    type: boolean
    description: If enabled, action will return MFA details about the user.
    is_mandatory: false
-   name: Include Last Sign In Details
    default_value: true
    type: boolean
    description: If selected, the action retrieves the user's sign-in activity, including
        both interactive and non-interactive sign-in timestamps.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_manager_contact_details_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
