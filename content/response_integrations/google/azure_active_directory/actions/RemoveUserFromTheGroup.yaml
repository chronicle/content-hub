name: Remove User from a Group
description: 'Remove User from the specified group. Note: The user name can be provided
    either as a Siemplify entity or as an action input parameter. If the user name
    is passed to action both as an entity and input parameter - action will be executed
    on the input parameter. User name should be specified in username@domain format.'
integration_identifier: AzureActiveDirectory
parameters:
-   name: User Name
    default_value: ''
    type: string
    description: Specify user name to remove from the target group. User name should
        be specified in username@domain format. Parameter accepts multiple values
        as a comma separated string.
    is_mandatory: false
-   name: Group Name
    default_value: ''
    type: string
    description: Specify group name to remove user from.
    is_mandatory: false
-   name: Group ID
    default_value: ''
    type: string
    description: 'Specify the ID of the group from which you want to remove the user.
        If both "Group Name" and "Group ID" are provided, then "Group ID" will have
        priority. Example of the id: 00e40000-1971-439d-80fc-d0e000001dbd.'
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
