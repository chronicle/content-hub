    using MXToolBox. This action retrieves HTTPS configuration details and SSL certificate
    authorities for the provided URL entities.


    ### Flow Description

    1. Filters the provided target entities to identify those of type URL.

    2. Iterates through the valid URL entities and extracts the domain name.

    3. Makes a GET request to the MXToolBox API (`api/v1/lookup/https/{domain}`) to
    retrieve HTTPS and SSL certificate information.

    4. Parses the API response to extract the list of certificate authorities.

    5. Aggregates the findings and attaches them to the action's results as a data
    table and JSON object.


    ### Additional Notes

    This is a read-only enrichment action that does not mutate any external state
    or update internal entity properties.
