A Record Lookup:
  ai_description: >-
    ### General Description

    Performs an A record lookup using MXToolBox to retrieve the resolved IP addresses
    for specific domain names, URLs, or users. This action enriches the targeted entities
    by attaching the resolved IP addresses to their properties.


    ### Flow Description

    1. Filters the target entities to include only Hostname, URL, and User entity
    types.

    2. Iterates through the filtered entities and extracts the domain name from each
    entity.

    3. Makes an API call to the MXToolBox API (`api/v1/lookup/a/{domain}`) to perform
    an A record lookup.

    4. If the lookup is successful, updates the entity's additional properties with
    the resolved IP addresses and marks the entity as enriched.

    5. Aggregates the results into a data table and a JSON result object.

    6. Updates the entities within the Google SecOps platform.


    ### Additional Notes

    The action skips entities that encounter errors during the lookup process, logs
    the errors, and continues processing the remaining entities.
  ai_short_description: >-
    Performs an A record lookup using MXToolBox to retrieve and attach resolved IP
    addresses to Hostname, URL, and User entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
