SPF Lookup:
  ai_description: >-
    ### General Description

    Performs a Sender Policy Framework (SPF) lookup using MXToolBox to verify if a
    specified IP address is authorized to send emails on behalf of the target domain
    entities (Hostname, User, URL).


    ### Flow Description

    1. Filters the target entities to include only Hostname, User, and URL types.

    2. Extracts the domain from each valid entity.

    3. Makes a GET request to the MXToolBox API (`api/v1/lookup/spf/{domain}`) to
    fetch the SPF records and authorized IP ranges for each domain.

    4. Evaluates whether the provided `IP Address` parameter falls within the authorized
    IP ranges retrieved from the SPF records.

    5. If the IP is authorized, updates the entity's `additional_properties` with
    the success result and marks the entity as enriched.

    6. If the IP is not authorized, updates the entity's `additional_properties` with
    the failure result, marks the entity as suspicious, and marks it as enriched.

    7. Updates the entities in the Google SecOps platform and attaches the SPF ranges
    as JSON and data tables to the action results.


    ### Additional Notes

    This action is useful for investigating potential email spoofing or phishing attempts
    by validating the sender's IP against the domain's published SPF records.
