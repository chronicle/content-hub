      The action makes a GET request to the MXToolBox API to fetch A record data (fetches_data=true).
      It does not mutate external data or internal system data. It updates the entities
      with the resolved IP addresses (can_update_entities=true). It does not create
      insights, modify alert data, or create case comments.
