Reverse DNS Lookup:
  ai_description: >-
    ### General Description

    Performs a reverse DNS (PTR) lookup on IP Address entities using MXToolBox to
    retrieve associated domain names. This action helps analysts identify the domains
    hosted on or associated with specific IP addresses, providing valuable context
    for investigations.


    ### Flow Description

    1. Filters the provided target entities to include only those of type IP Address.

    2. Iterates over the filtered entities and makes a GET request to the MXToolBox
    API (`api/v1/lookup/ptr/{ip_address}`) for each IP address.

    3. Parses the API response to extract the associated domain names.

    4. Enriches the entity's additional properties with the retrieved domain names
    and marks the entity as enriched.

    5. Updates the entities in the platform and attaches the lookup results as an
    entity table and a JSON object.


