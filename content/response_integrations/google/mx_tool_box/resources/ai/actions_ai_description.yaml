Blacklist Check:
  ai_description: >-
    ### General Description

    Checks if Hostname or IP Address entities are blacklisted using MXToolBox. This
    action retrieves reputation data to determine if the specified indicators appear
    on known blacklists, evaluates the results against a configured threshold, and
    updates the entities' suspicious status accordingly.


    ### Flow Description

    1. Iterates over the target entities, filtering for Hostname and IP Address types.

    2. For each valid entity, makes a GET request to the MXToolBox API (`api/v1/lookup/blacklist/{domain}`)
    to retrieve blacklist status.

    3. If the entity is found on any blacklists, it records the failed engines and
    reasons, attaching them as a CSV table to the entity.

    4. Compares the number of blacklists the entity appears on against the `Blacklist
    Threshold` parameter. If the threshold is met or exceeded, the entity is marked
    as suspicious (`is_suspicious = True`).

    5. Updates the entities in the SecOps platform, attaches an insight detailing
    the blacklist count, and provides a comprehensive JSON result.


    ### Additional Notes

    - Only processes `HOSTNAME` and `ADDRESS` entities; all other entity types are
    ignored.

    - The action will gracefully skip entities that cause errors during the API lookup
    and continue processing the rest.
  ai_short_description: >-
    Checks if Hostname or IP Address entities are blacklisted using MXToolBox, marking
    them as suspicious if they exceed a specified threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a GET request to the MXToolBox API to retrieve
      blacklist information for domains/IPs. It does not mutate external data as it
      only performs read operations. It does not mutate internal data outside of standard
      entity updates. It updates entities by setting `is_suspicious = True` if the
      blacklist threshold is met and calling `siemplify.update_entities`. It creates
      insights by calling `siemplify.add_entity_insight`. It does not modify alert
      data or create case comments.
