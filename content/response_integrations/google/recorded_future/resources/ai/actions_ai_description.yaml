Enrich IOC:
  ai_description: >-
    ### General Description

    Enriches multiple Indicator of Compromise (IOC) entities (Hostname, CVE, FileHash,
    Address, URL) using Recorded Future. It retrieves threat intelligence and risk
    scores for the provided entities in a single bulk request, updating the entities
    with the gathered context and evaluating their risk.


    ### Flow Description

    1. Filters the target entities to include only supported types (Hostname, CVE,
    FileHash, Address, URL).

    2. Constructs a payload grouping the entities by their respective types.

    3. Makes a POST request to the Recorded Future `/v2/soar/enrichment` API endpoint
    to fetch bulk enrichment data.

    4. Iterates through the results and updates each entity's additional properties
    with the retrieved threat intelligence.

    5. Evaluates the risk score against the provided `Risk Score Threshold` parameter;
    if the score exceeds the threshold, the entity is marked as suspicious.

    6. Marks the entities as enriched and saves the updates to the platform.

    7. Returns the enrichment data as a JSON result.


    ### Additional Notes

    This action is recommended as a first step for bulk enrichment before using specific
    entity enrichment actions for deeper context.
