Enrich URL:
  ai_description: >-
    ### General Description

    Enriches URL entities using Recorded Future. This action retrieves threat intelligence,
    including risk scores, triggered rules, and optionally related entities for the
    specified URL. It evaluates the risk score against a provided threshold to determine
    if the entity is suspicious.


    ### Flow Description

    1. Iterates over the target entities and filters for URL entities.

    2. Makes a GET request to the Recorded Future API (`v2/url/{entity}`) to fetch
    reputation and threat intelligence data for each URL.

    3. Evaluates the retrieved risk score against the configured `Risk Score Threshold`.

    4. If the score exceeds the threshold, marks the entity as suspicious and creates
    a case insight with the analysis results.

    5. Updates the entity's additional properties with the enrichment data and marks
    the entity as enriched.


