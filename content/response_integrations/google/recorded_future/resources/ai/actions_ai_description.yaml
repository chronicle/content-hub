Enrich CVE:
  ai_description: >-
    ### General Description

    Enriches CVE entities using Recorded Future. This action retrieves threat intelligence
    including risk scores, triggered rules, and related entities for the specified
    CVEs. It evaluates the risk based on a configured threshold, updates the entity's
    suspicious status, and generates an insight with the analysis results.


    ### Flow Description

    1. Iterates over the target entities and filters for CVE entities.

    2. Makes a GET request to the Recorded Future API (`v2/vulnerability/{entity}`)
    to fetch reputation and optionally related entity data.

    3. Evaluates the retrieved risk score against the configured `Risk Score Threshold`.

    4. If the score exceeds the threshold, marks the entity as suspicious and creates
    a case insight.

    5. Updates the entity with the enrichment data and marks it as enriched.


    ### Additional Notes

    The action can optionally include related entities in the enrichment data if the
    `Include Related Entities` parameter is enabled.
