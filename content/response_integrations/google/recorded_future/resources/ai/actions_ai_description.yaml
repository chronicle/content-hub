Add Analyst Note:
  ai_description: >-
    ### General Description

    Adds an analyst note to previously enriched entities in Recorded Future. If an
    entity does not contain a Recorded Future ID, the action will first perform an
    enrichment operation to retrieve the necessary ID and optionally update the entity
    with the enrichment data before publishing the note.


    ### Flow Description

    1. Filters target entities to include only Hostname, CVE, FileHash, Address, and
    URL types.

    2. Checks if the entities already have a Recorded Future ID in their additional
    properties.

    3. For entities missing the ID, makes a POST request to the Recorded Future API
    (`/v2/soar/enrichment`) to fetch IOC related entity objects and optionally enriches
    the entities.

    4. Makes a POST request to the Recorded Future API (`/v2/analystnote/publish`)
    to publish the analyst note for the successful entities.

    5. Updates the entities in Google SecOps with the document ID and any retrieved
    enrichment data.


    ### Additional Notes

    The action requires a Note Title, Note Text, and Note Source. The Note Source
    must be a valid Recorded Future ID accessible to the user whose API token is enabled.
  ai_short_description: >-
    Adds an analyst note to entities in Recorded Future, optionally enriching them
    first if they lack a Recorded Future ID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: >-
      Publishes an analyst note to Recorded Future for the specified entities.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches IOC related entity objects from Recorded Future if the entity
      lacks an ID (fetches_data=true). It makes a POST request to publish an analyst
      note in Recorded Future (can_mutate_external_data=true). It updates the entities
      in Google SecOps with the document ID and enrichment data (can_update_entities=true).
      It does not create insights, modify alert data, or create case comments.
