    ### General Description

    Tests connectivity to the Recorded Future API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Extracts the integration configuration parameters (API URL, API Key, Verify
    SSL).

    2. Initializes the Recorded Future manager.

