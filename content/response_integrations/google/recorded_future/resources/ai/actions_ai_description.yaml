Update Alert:
  ai_description: >-
    ### General Description

    Updates an existing alert in Recorded Future by modifying its status, assignee,
    or appending a note. This action initiates a state change on the external Recorded
    Future platform to keep alert management synchronized.


    ### Flow Description

    1. Extracts the `Alert ID` and the optional update parameters (`Assign To`, `Note`,
    `Status`).

    2. Validates that at least one of the optional update parameters is provided;
    otherwise, the action fails.

    3. Maps the provided status to the corresponding Recorded Future API value.

    4. Makes a POST request to the Recorded Future API (`/v2/alert/update`) with the
    specified changes.

    5. Retrieves the response and attaches the updated alert details as a JSON result
    to the action.


    ### Additional Notes

    While `Assign To`, `Note`, and `Status` are individually marked as optional, at
    least one of them must be populated for the action to execute successfully.
