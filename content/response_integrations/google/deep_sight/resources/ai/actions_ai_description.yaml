    information about the URL, updates the entity's properties, and attaches the results
    as a JSON object and an entity table.


    ### Flow Description

    1. Iterates through the target entities in the case.

    2. Filters entities to process only those of type URL.

    3. Makes a GET request to the Symantec DeepSight API (`/v1/urls/{url}`) to fetch
    threat intelligence data for each URL.

    4. Flattens the retrieved data and updates the entity's additional properties.

    5. Marks the entity as enriched and saves the updated entities back to the case.

    6. Attaches the scan results as an entity table and a JSON result.


    ### Additional Notes

    None.
