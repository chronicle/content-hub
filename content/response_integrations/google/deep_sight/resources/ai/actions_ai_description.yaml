    ### General Description

    Enriches User, Hostname, and URL entities using Symantec DeepSight. This action
    extracts the domain from the target entities and retrieves threat intelligence
    and reputation data from DeepSight to provide additional context.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters entities to process only those of type User, Hostname, or URL.

    3. Extracts the domain from the entity's identifier.

    4. Makes an API call (GET request) to the Symantec DeepSight API to scan the extracted
    domain.

    5. If data is found, flattens the JSON response and appends it to the entity's
    additional properties.

    6. Attaches a CSV table containing the scan results to the entity and marks the
    entity as enriched.

    7. Updates the entities within the Google SecOps platform with the new data.


    ### Additional Notes

    For User entities, the action attempts to extract the domain portion (e.g., from
    an email address) to perform the DeepSight domain scan.
