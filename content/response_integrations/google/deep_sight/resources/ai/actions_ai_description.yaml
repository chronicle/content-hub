Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Symantec DeepSight API to ensure the integration is
    configured correctly.


    ### Flow Description

    1. Retrieves the API Key and SSL settings from the integration configuration.

    2. Initializes the DeepSight API client.

    3. Executes a test API call (GET request) to the DeepSight IP scan endpoint using
    a hardcoded test IP address (8.8.8.8).

    4. Validates the HTTP response to confirm successful authentication and network
    reachability.

    5. Returns a success message to the SOAR platform.


    ### Additional Notes

    This action does not interact with case entities or alerts. It is strictly used
    for administrative verification of the integration setup.
