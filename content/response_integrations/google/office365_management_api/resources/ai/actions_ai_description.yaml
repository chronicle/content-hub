Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Office 365 Management API service using the provided
    integration configuration parameters.


    ### Flow Description

    1. Extracts integration configuration parameters such as API Root, Azure Active
    Directory ID, Client ID, and authentication credentials.

    2. Initializes the `Office365ManagementAPIManager`.

    3. Makes an API call to the OAuth2 login endpoint to request an authentication
    token.

    4. Returns a success message if the connection and authentication are successful,
    or a failure message if an error occurs.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to the Office 365 Management API service to verify integration
    configuration.
