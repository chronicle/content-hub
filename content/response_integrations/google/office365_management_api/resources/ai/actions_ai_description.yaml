Start Subscription:
  ai_description: >-
    ### General Description

    Starts a subscription to a chosen Office 365 Management API content type.


    ### Flow Description

    1. Extracts the target content type from the action parameters.

    2. Authenticates with the Office 365 Management API using the provided credentials.

    3. Sends a POST request to the `/activity/feed/subscriptions/start` endpoint to
    initiate the subscription for the specified content type.

    4. Returns a success message upon completion.


    ### Additional Notes

    This action is typically used to enable the flow of audit or DLP events from Office
    365 to the management API.
