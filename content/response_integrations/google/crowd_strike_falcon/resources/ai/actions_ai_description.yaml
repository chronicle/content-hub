    ### General Description

    Deletes custom Indicators of Compromise (IOCs) from the CrowdStrike Falcon platform.
    This action removes previously uploaded threat intelligence markers such as IP
    addresses, hostnames, domains (extracted from URLs), and file hashes (MD5 or SHA-256)
    from the environment's watch list.


    ### Flow Description

    1. **Initialization**: Initializes the CrowdStrike manager using the provided
    integration configuration.

    2. **Entity Filtering**: Filters the target entities to identify suitable types
    (Hostnames, URLs, IP Addresses, and File Hashes).

    3. **IOC Identification**: For each valid entity, queries the CrowdStrike API
    (`manager.get_ioc_id`) to retrieve the internal unique identifier (IOC ID) associated
    with the indicator value.

    4. **Deletion**: Sends a delete request to the CrowdStrike API (`manager.delete_ioc`)
    to remove the indicator from the platform.

    5. **Result Reporting**: Returns a summary message detailing which entities were
    successfully deleted and which failed.


