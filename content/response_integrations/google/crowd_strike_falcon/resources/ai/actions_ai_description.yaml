  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | Platform | String | Yes | Specify a comma-separated list of the platforms related
    to the IOC. Possible values: Windows, Linux, Mac. |

    | Severity | String | Yes | Specify the severity for the IOC. Possible values:
    Informational, Low, Medium, High, Critical. |

    | Comment | String | No | Specify a comment with more context related to IOC.
    |

    | Host Group Name | String | No | Specify the name of the host group. |

    | Action | String | No | Specify the action for the uploaded IOCs. Note: "Block"
    action can only be applied to hashes. Action will always apply "Detect" policy
    to all other IOC types. |

