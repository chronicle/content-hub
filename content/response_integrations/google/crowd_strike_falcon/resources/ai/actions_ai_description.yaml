      The action iterates over `siemplify.target_entities` and filters them using
      `entity.entity_type in TYPES_IOC_MAPPER.keys()`. The keys in `TYPES_IOC_MAPPER`
      are `EntityTypes.HOSTNAME`, `EntityTypes.ADDRESS`, `EntityTypes.URL`, and `EntityTypes.FILEHASH`.
