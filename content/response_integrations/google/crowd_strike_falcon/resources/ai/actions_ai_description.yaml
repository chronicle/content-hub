Search Events:
  ai_description: >-
    ### General Description

    Searches for events within CrowdStrike Falcon repositories using custom queries.
    This action is designed to retrieve historical event data for investigation and
    threat hunting purposes. It operates asynchronously, first initiating a search
    job in a specified repository and then polling for the results until completion
    or timeout.


    ### Flow Description

    1. Extracts and validates input parameters, ensuring that custom time frames have
    the required start times.

    2. Sends a POST request to CrowdStrike to initiate a search job in the selected
    repository with the formatted query and time range.

    3. Enters an asynchronous polling state, storing the `job_id`.

    4. In subsequent cycles, sends a GET request to check the status of the job and
    fetch the resulting events once completed.

    5. Attaches the retrieved events to the action's JSON results and completes successfully.


    ### Additional Notes

