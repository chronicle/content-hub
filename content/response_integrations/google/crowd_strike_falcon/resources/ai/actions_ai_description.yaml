Submit File:
  ai_description: >-
    ### General Description

    Submits files to the CrowdStrike Falcon Sandbox for automated malware analysis
    and retrieves the resulting threat intelligence. This action supports both direct
    file uploads and archives, allowing users to specify the sandbox environment (OS)
    and network routing. It can optionally check for duplicate submissions to reuse
    existing reports and supports password-protected documents or archives. As an
    asynchronous action, it handles the end-to-end process of uploading, initiating
    analysis, polling for completion, and retrieving the final verdict and report
    details.


    ### Flow Description

    1. Uploads the specified files or archives to the CrowdStrike Falcon Sandbox using
    the provided credentials and passwords.

    2. If 'Check Duplicate' is true, queries CrowdStrike for existing analysis reports
    matching the file's SHA256 hash.

    3. For new files, initiates a sandbox analysis job with the configured environment
    and network settings.

    4. Periodically checks the status of the analysis jobs until they reach a terminal
    state.

    5. Retrieves the summary report, including the verdict and threat score.

    6. Populates the JSON results and creates data tables containing the analysis
    summary for each submitted file.


    ### Additional Notes

    - This action requires a valid CrowdStrike Falcon Sandbox license.

    - The action is asynchronous; it will enter an 'In Progress' state while waiting
    for the sandbox analysis to complete.

    - Supported archive formats include .zip and .7z.
