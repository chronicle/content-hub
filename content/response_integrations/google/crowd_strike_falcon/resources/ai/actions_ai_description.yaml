Upload IOCs:
  ai_description: >-
    Uploads Indicators of Compromise (IOCs) to the CrowdStrike Falcon platform to
    enable detection or prevention across managed endpoints. This action supports
    Hostname, URL, IP Address, and File Hash entities. For URL entities, the action
    automatically extracts the domain component. For File Hash entities, it supports
    MD5 and SHA-256 formats.


    ### Flow Description

    1. **Parameter Validation**: Validates the provided 'Platform' values and ensures
    'Days To Expire' is a positive integer.

    2. **Host Group Resolution**: If a 'Host Group Name' is provided, the action makes
    a GET request to CrowdStrike to retrieve the corresponding internal ID.

    3. **Entity Filtering**: Identifies supported entities (IP, Hostname, URL, Hash)
    from the current context.

    4. **IOC Preparation**: For each entity, it determines the specific IOC type (e.g.,
    ipv4, domain, md5). It also validates the 'Action' parameter; while 'Detect' is
    universal, the 'Block' action is strictly enforced only for File Hash entities.

    5. **API Interaction**: Submits the IOC data to CrowdStrike's indicators API via
    a POST request, applying the specified severity, platforms, and expiration date.


    ### Additional Notes

    - Hostname entities are treated as domain IOCs.

    - If the 'Action' is set to 'Block' for a non-hash entity (like an IP or Domain),
    the action will automatically downgrade the policy to 'Detect' for that specific
    entity to ensure successful upload.
  ai_short_description: >-
    Uploads Indicators of Compromise (IOCs) to the CrowdStrike Falcon platform to
    enable detection or prevention across managed endpoints.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
