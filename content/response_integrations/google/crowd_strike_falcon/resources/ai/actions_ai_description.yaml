      enable detection or prevention.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data if a 'Host Group Name' is provided by making a GET request
      to retrieve the host group ID (`manager.get_host_group_by_name`). It mutates
      external data by making a POST request to upload IOCs to CrowdStrike (`manager.upload_ioc`).
      It does not mutate internal data, update entities, create insights, modify alert
      data, or create case comments.
