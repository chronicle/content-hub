Add Comment to Detection:
  ai_description: >-
    ### General Description

    Adds a comment to a specific detection in CrowdStrike Falcon. This action is used
    to provide additional context or updates to an existing security detection within
    the CrowdStrike platform. It first retrieves the current status of the detection
    to ensure the comment is applied correctly without unintentionally changing the
    detection's state.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters (Detection ID, Comment).

    2. Calls the CrowdStrike API to fetch the current status of the specified Detection
    ID.

    3. Sends a PATCH request to the CrowdStrike `detections` endpoint, providing the
    Detection ID, the comment text, and the previously retrieved status to append
    the comment.

    4. Returns success if the comment is successfully added or failure if an error
    occurs.


    ### Additional Notes

    - This action is marked as deprecated in the integration metadata.

    - It modifies data in the CrowdStrike Falcon platform by adding a comment to a
    detection record.
