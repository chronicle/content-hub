Add Alert Comment:
  ai_description: >-
    Adds a comment to a specific alert in CrowdStrike Falcon. This action allows security
    analysts to append notes or context to an existing alert within the CrowdStrike
    platform directly from Google SecOps. It first validates the existence of the
    alert in CrowdStrike and ensures the comment meets the platform's character length
    requirements before performing the update.


    ### Flow Description

    1. **Parameter Extraction:** Retrieves the API configuration and action parameters
    (Alert ID, Comment).

    2. **Validation:** Checks if the comment length is within the 1024-character limit.

    3. **Alert Verification:** Calls the CrowdStrike API to verify that the specified
    Alert ID exists.

    4. **Comment Submission:** Sends a PATCH request to the CrowdStrike API to append
    the comment to the alert.


    ### Additional Notes

    - The action will fail if the provided Alert ID does not exist in the CrowdStrike
    environment.

    - The comment length is strictly enforced to a maximum of 1024 characters as per
    CrowdStrike API limitations.
  ai_short_description: >-
    Adds a comment to a specific alert in CrowdStrike Falcon.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a comment to a specific alert in CrowdStrike Falcon.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data to validate the alert ID (fetches_data=true) and then
      sends a PATCH request to CrowdStrike to add a comment to the alert (can_mutate_external_data=true).
      It does not mutate internal SecOps data, update entities, or create insights.
