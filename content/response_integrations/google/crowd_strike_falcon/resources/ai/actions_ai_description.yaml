Contain Endpoint:
  ai_description: >-
    ### General Description

    Contains (quarantines) endpoint entities in CrowdStrike Falcon. This action isolates
    potentially compromised hosts from the network to prevent the spread of threats.
    It supports both Hostname and IP Address entities and operates asynchronously
    to monitor the containment status until completion.


    ### Flow Description

    1. Extracts action parameters (Customer ID, Fail If Timeout).

    2. Filters target entities for supported types (Hostname, IP Address).

    3. Queries the CrowdStrike Falcon API (`search_devices`) to find the corresponding
    device ID for each entity.

    4. Checks the current containment status of the device. If already contained,
    it skips the containment request.

    5. If not contained, initiates a containment request via the CrowdStrike API (`contain_host_by_device_id`).

    6. Enters an asynchronous polling loop to monitor the containment status until
    it transitions to 'contained' or the timeout is reached.

    7. Returns the results and detailed JSON data for each processed device.


    ### Additional Notes

    This is an asynchronous action that will continue to run in the background, polling
    the external system until the containment is confirmed or the execution deadline
    is reached.
  ai_short_description: >-
    Contains (quarantines) specific endpoint entities (Hostname, IP Address) in CrowdStrike
    Falcon to isolate them from the network.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a containment (quarantine) action on the specified endpoint in CrowdStrike
      Falcon.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches device data using `search_devices` (fetches_data=true) and
      mutates external data by calling `contain_host_by_device_id` which sends a POST
      request to the CrowdStrike API to contain the host (can_mutate_external_data=true).
      It does not mutate internal data, update entities, or create insights.
