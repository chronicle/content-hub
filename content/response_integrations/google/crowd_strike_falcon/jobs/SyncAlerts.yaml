name: Sync Alerts
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: Name of the environment, where to search for alerts.
    is_mandatory: true
-   name: API Root
    default_value: https://api.crowdstrike.com
    type: string
    description: API root of the Crowdstrike instance.
    is_mandatory: true
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID  of the Crowdstrike account.
    is_mandatory: true
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret  of the Crowdstrike account.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: 'Specify how many hours backwards to synchronize alerts. Default:
        24 hours.'
    is_mandatory: false
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Crowdstrike server is valid.
    is_mandatory: true
description: 'This job will synchronize Google SecOps Alerts and Crowdstrike alerts.
    The job synchronizes comments and status. Requires “Crowdstrike Alert” tag on
    the case. Note: If the alert didn’t originate from “Alerts Connector” or “Identity
    Protections Detection Connector” you will need to add an “Alert_ID” context value
    for the job to be able to find the correct information.'
documentation_link: null
integration: CrowdStrikeFalcon
creator: Admin
