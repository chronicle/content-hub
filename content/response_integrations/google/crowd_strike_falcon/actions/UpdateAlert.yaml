name: Update Alert
description: Update an alert in Crowdstrike.
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: Specify the ID of the alert that needs to be updated.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Closed
    - In Progress
    - New
    - Reopened
    description: Specify the status for the alert.
    is_mandatory: false
-   name: Verdict
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - True Positive
    - False Positive
    description: Specify the verdict for the alert.
    is_mandatory: false
-   name: Assign To
    default_value: ''
    type: string
    description: 'Specify the name of the analyst to whom the alert needs to be assigned.
        If "Unassign" is provided, action will remove assignment from the alert. Note:
        API will accept any value that is provided, even if the underlying user doesn’t
        exist.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
