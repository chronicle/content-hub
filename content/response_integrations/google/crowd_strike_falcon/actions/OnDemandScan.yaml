name: On-Demand Scan
description: 'Scan the endpoint on demand in Crowdstrike. Note: only Windows hosts
    are supported. Supported entities: IP Address, Hostname. Note: Action is running
    as async, please adjust script timeout value in Chronicle SecOps IDE for action,
    as needed.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: Specify the ID of the customer for which you want to execute the
        action.
    is_mandatory: false
-   name: File Paths To Scan
    default_value: C:\Windows
    type: string
    description: Comma-separated list of paths to scan.
    is_mandatory: true
-   name: File Paths To Exclude From Scan
    default_value: ''
    type: string
    description: Comma-separated list of paths to exclude from scanning.
    is_mandatory: false
-   name: Host Group Name
    default_value: ''
    type: string
    description: 'Comma-separated list of host group names to initiate scanning for.
        Note: Separate scanning process is created for each host group.'
    is_mandatory: false
-   name: Scan Description
    default_value: ''
    type: string
    description: 'Description for the scan. If no value is provided, the action sets
        the description to the following: "Scan initialized by Chronicle SecOps."'
    is_mandatory: false
-   name: CPU Priority
    default_value: Up to 25% CPU utilization
    type: ddl
    optional_values:
    - Up to 1% CPU utilization
    - Up to 25% CPU utilization
    - Up to 50% CPU utilization
    - Up to 75% CPU utilization
    - Up to 100% CPU utilization
    description: The amount of CPU to  use for the underlying host during scanning.
    is_mandatory: false
-   name: Sensor Anti-malware Detection Level
    default_value: Moderate
    type: ddl
    optional_values:
    - Cautious
    - Moderate
    - Aggressive
    - Extra Aggressive
    description: 'Specify the sensor anti-malware detection level. Note: Detection
        level must be equal to or higher than the Prevention level.'
    is_mandatory: false
-   name: Sensor Anti-malware Prevention Level
    default_value: Moderate
    type: ddl
    optional_values:
    - Cautious
    - Moderate
    - Aggressive
    - Extra Aggressive
    - Disabled
    description: 'Specify the sensor anti-malware prevention level. Note: Detection
        level must be equal to or higher than the Prevention level.'
    is_mandatory: false
-   name: Cloud Anti-malware Detection Level
    default_value: Moderate
    type: ddl
    optional_values:
    - Cautious
    - Moderate
    - Aggressive
    - Extra Aggressive
    description: 'Specify the cloud anti-malware detection level. Note: Detection
        level must be equal to or higher than the Prevention level.'
    is_mandatory: false
-   name: Cloud Anti-malware Prevention Level
    default_value: Moderate
    type: ddl
    optional_values:
    - Cautious
    - Moderate
    - Aggressive
    - Extra Aggressive
    - Disabled
    description: 'Specify the cloud anti-malware prevention level. Note: Detection
        level must be equal to or higher than the Prevention level.'
    is_mandatory: false
-   name: Quarantine Hosts
    default_value: false
    type: boolean
    description: If enabled, underlying hosts are quarantined as part of scanning.
    is_mandatory: false
-   name: Create Endpoint Notification
    default_value: true
    type: boolean
    description: If enabled, the scanning process creates an endpoint notification.
    is_mandatory: false
-   name: Max Scan Duration
    default_value: '1'
    type: string
    description: Number of hours for a scan to run. If no value is provided, the scan
        runs continuously.
    is_mandatory: false
-   name: Hostname
    default_value: ''
    type: string
    description: 'Comma-separated list of hostnames on which you want to execute the
        action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Device ID
    default_value: ''
    type: string
    description: 'Comma-separated list of device ids on which you want to execute
        the action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/on_demand_scan_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
