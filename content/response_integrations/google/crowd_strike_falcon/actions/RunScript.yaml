name: Run Script
description: 'Execute a powershell script on the endpoints in Crowdstrike. Supported
    entities: IP Address, Hostname. Note: Action is running as async, please adjust
    script timeout value in Google SecOps IDE for the action, as needed.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: Specify the ID of the customer for which you want to execute the
        action.
    is_mandatory: false
-   name: Script Name
    default_value: ''
    type: string
    description: 'The name of the script file that needs to be executed. Note: either
        “Script Name” or “Raw Script” should be provided. If both “Script Name” and
        “Raw Script” are provided, then “Raw Script” will have the priority.'
    is_mandatory: false
-   name: Raw Script
    default_value: ''
    type: string
    description: 'Raw powershell script payload that needs to be executed on the endpoints.
        Note: either “Script Name” or “Raw Script” should be provided. If both “Script
        Name” and “Raw Script” are provided, then “Raw Script” will have the priority.'
    is_mandatory: false
-   name: Hostname
    default_value: ''
    type: string
    description: 'Comma-separated list of hostnames on which you want to execute the
        action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Device ID
    default_value: ''
    type: string
    description: 'Comma-separated list of device ids on which you want to execute
        the action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Queue Offline
    default_value: false
    type: boolean
    description: If enabled, commands targeting offline hosts are queued and executed
        once the host reconnects to the network.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/run_script_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
