name: Update IOC Information
description: 'Update information about custom IOCs in Crowdstrike Falcon. Supported
    entities: Hostname, URL, IP address and Hash. Note: Hostname entities are treated
    as domain IOCs and action will extract domain part out of URLs. Only MD5 and SHA-256
    hashes are supported.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Description
    default_value: ''
    type: content
    description: Specify a new description for custom IOCs.
    is_mandatory: false
-   name: Source
    default_value: ''
    type: content
    description: Specify the source for custom IOCs.
    is_mandatory: false
-   name: Expiration days
    default_value: ''
    type: string
    description: Specify the amount of days till expiration.
    is_mandatory: false
-   name: Detect policy
    default_value: true
    type: boolean
    description: If enabled, IOCs that have been identifed, will send a notification.
        In other case, no action will be taken
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_ioc_information_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "DestinationURL", "FILEHASH", "ADDRESS"]}'
