name: Update Identity Protection Detection
description: 'Update an identity protection detection in Crowdstrike. Note: this action
    requires an Identity Protection license.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Detection ID
    default_value: ''
    type: string
    description: Specify the ID of the detection that needs to be updated.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Closed
    - In Progress
    - New
    - Reopened
    description: Specify the status for the detection.
    is_mandatory: false
-   name: Assign To
    default_value: ''
    type: string
    description: 'Specify the name of the analyst to whom the detection needs to be
        assigned. If "Unassign" is provided, action will remove assignment from the
        detection. Note: API will accept any value that is provided, even if the underlying
        user doesn''t exist.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_identity_protection_detection_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
