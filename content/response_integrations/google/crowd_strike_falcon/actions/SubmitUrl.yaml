name: Submit URL
description: 'Submit urls to a sandbox in Crowdstrike. Note: This action requires
    a Falcon Sandbox license.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: URLs
    default_value: ''
    type: string
    description: Specify the URLs that need to be submitted.
    is_mandatory: true
-   name: Sandbox Environment
    default_value: Windows 10, 64-bit
    type: ddl
    optional_values:
    - Linux Ubuntu 16.04, 64-bit
    - Android (static analysis)
    - Windows 10, 64-bit
    - Windows 7, 64-bit
    - Windows 7, 32-bit
    description: Specify the sandbox environment for the analysis.
    is_mandatory: false
-   name: Network Environment
    default_value: Default
    type: ddl
    optional_values:
    - Default
    - TOR
    - Offline
    - Simulated
    description: Specify the network environment for the analysis.
    is_mandatory: false
-   name: Check Duplicate
    default_value: true
    type: boolean
    description: 'If enabled, the action checks if the file was already submitted
        previously and returns an available report. Note: during the validation “Network
        Environment” and “Sandbox Environment” are not taken into consideration.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/submit_url_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
