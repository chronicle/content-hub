name: Update Detection
description: Deprecated. Update detection in Crowdstrike Falcon.
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Detection ID
    default_value: ''
    type: string
    description: Specify the ID of the detection that needs to be updated.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - new
    - in_progress
    - true_positive
    - false_positive
    - ignored
    - closed
    - Select One
    description: Specify the new status for the detection.
    is_mandatory: true
-   name: Assign Detection to
    default_value: ''
    type: string
    description: Specify the email address of the Crowdstrike Falcon user, who needs
        to be assigned to this detection
    is_mandatory: false
dynamic_results_metadata: []
default_result_value: ''
creator: Admin
