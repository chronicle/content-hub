name: List Uploaded IOCs
description: List available custom IOCs in CrowdStrike Falcon.
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: IOC Type Filter
    default_value: ipv4,ipv6,md5,sha256,domain
    type: string
    description: 'Specify a comma-separated list of IOC types that should be returned.
        If nothing is provided, action will return IOCs from all types. Possible values:
        ipv4,ipv6,md5,sha256,domain.'
    is_mandatory: false
-   name: Value Filter Logic
    default_value: Equal
    type: ddl
    optional_values:
    - Equal
    - Contains
    description: Specify the value filter logic. If "Equal" is selected, action will
        try to find the exact match among IOCs and if "Contains" is selected, action
        will try to find IOCs that contain that substring.
    is_mandatory: false
-   name: Value Filter String
    default_value: ''
    type: string
    description: Specify the string that should be searched among IOCs.
    is_mandatory: false
-   name: Max IOCs To Return
    default_value: '50'
    type: string
    description: 'Specify how many IOCs to return. Default: 50. Maximum: 500.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_uploaded_io_cs_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
script_result_name: iocs_count
