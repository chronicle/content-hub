name: Download File
description: 'Download files from the hosts in Crowdstrike Falcon. Supported entities:
    File Name, IP Address and Hostname. Note: action requires both File Name and IP
    Address/Hostname entity to be in the scope of the Siemplify alert. The downloaded
    file will be in password-protected zip. Password is "infected".'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: Specify the ID of the customer for which you want to execute the
        action.
    is_mandatory: false
-   name: Device ID
    default_value: ''
    type: string
    description: 'Comma-separated list of device ids on which you want to execute
        the action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Download Folder Path
    default_value: ''
    type: string
    description: Specify the path to the folder, where you want to store the threat
        file.
    is_mandatory: true
-   name: Overwrite
    default_value: false
    type: boolean
    description: If enabled, action will overwrite the file with the same name.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/download_files_from_hosts_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "FILENAME", "ADDRESS"]}'
