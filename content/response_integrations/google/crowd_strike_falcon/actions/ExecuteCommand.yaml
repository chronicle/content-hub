name: Execute Command
description: 'Execute commands on the hosts in Crowdstrike Falcon. Supported entities:
    IP Address and Hostname.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: Specify the ID of the customer for which you want to execute the
        action.
    is_mandatory: false
-   name: Command
    default_value: ''
    type: string
    description: Specify what command to execute on the hosts.
    is_mandatory: true
-   name: Admin Command
    default_value: false
    type: boolean
    description: If enabled, action will execute commands with the admin level permissions.
        This is necessary for certain commands like "put".
    is_mandatory: false
-   name: Hostname
    default_value: ''
    type: string
    description: 'Comma-separated list of hostnames on which you want to execute the
        action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Device ID
    default_value: ''
    type: string
    description: 'Comma-separated list of device ids on which you want to execute
        the action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Queue Offline
    default_value: false
    type: boolean
    description: If enabled, commands targeting offline hosts are queued and executed
        once the host reconnects to the network.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/execute_command_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
