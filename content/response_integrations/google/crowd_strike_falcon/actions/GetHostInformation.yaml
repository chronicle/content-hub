name: Get Host Information
description: 'Retrieve information about the hostname from Crowdstrike Falcon. Supported
    entities: Hostname, IP Address.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: Specify the ID of the customer for which you want to execute the
        action.
    is_mandatory: false
-   name: Device ID
    default_value: ''
    type: string
    description: 'Comma-separated list of device ids on which you want to execute
        the action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Create Insight
    default_value: true
    type: boolean
    description: If enabled, action will create insights containing information regarding
        entities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_host_information_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
