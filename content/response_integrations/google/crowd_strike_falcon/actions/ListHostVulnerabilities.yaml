name: List Host Vulnerabilities
description: 'List vulnerabilities found on the host in Crowdstrike Falcon. Supported
    entities: IP Address and Hostname. Note: requires Falcon Spotlight license and
    permissions. '
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: Specify the ID of the customer for which you want to execute the
        action.
    is_mandatory: false
-   name: Device ID
    default_value: ''
    type: string
    description: 'Comma-separated list of device ids on which you want to execute
        the action. Note: action will run the action on both entities + this parameter
        values.'
    is_mandatory: false
-   name: Severity Filter
    default_value: ''
    type: string
    description: 'Specify the comma-separated list of severities for vulnerabilities.If
        nothing is provided, action will ingest all related vulnerabilities. Possible
        values: Critical, High, Medium, Low, Unknown.'
    is_mandatory: false
-   name: Create Insight
    default_value: true
    type: boolean
    description: If enabled, action will create an insight per entity containing statistical
        information about related vulnerabilities.
    is_mandatory: false
-   name: Max Vulnerabilities To Return
    default_value: '100'
    type: string
    description: Specify how many vulnerabilities to return per host. If nothing is
        provided action will process all of the related vulnerabilities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_host_vulnerabilities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
