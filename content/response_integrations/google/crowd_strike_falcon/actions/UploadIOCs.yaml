name: Upload IOCs
description: 'Add custom IOCs in Crowdstrike Falcon. Supported entities: Hostname,
    URL, IP address and Hash. Note: Hostname entities are treated as domain IOCs and
    action will extract domain part out of URLs. Only MD5 and SHA-256 hashes are supported.'
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Platform
    default_value: Windows,Linux,Mac
    type: string
    description: 'Specify a comma-separated list of the platforms related to the IOC.
        Possible values: Windows, Linux, Mac.'
    is_mandatory: true
-   name: Severity
    default_value: Medium
    type: ddl
    optional_values:
    - Informational
    - Low
    - Medium
    - High
    - Critical
    description: Specify the severity for the IOC.
    is_mandatory: true
-   name: Comment
    default_value: ''
    type: string
    description: Specify a comment with more context related to IOC.
    is_mandatory: false
-   name: Host Group Name
    default_value: ''
    type: string
    description: Specify the name of the host group.
    is_mandatory: false
-   name: Action
    default_value: Detect
    type: ddl
    optional_values:
    - Detect
    - Block
    description: 'Specify the action for the uploaded IOCs. Note: "Block" action can
        only be applied to hashes. Action will always apply "Detect" policy to all
        other IOC types.'
    is_mandatory: false
-   name: Days To Expire
    default_value: ''
    type: string
    description: The number of days before the IOC expires.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "DestinationURL", "FILEHASH", "ADDRESS"]}'
