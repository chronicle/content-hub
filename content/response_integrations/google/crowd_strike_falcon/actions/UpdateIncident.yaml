name: Update Incident
description: Deprecated. Update incident in Crowdstrike.
integration_identifier: CrowdStrikeFalcon
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: Specify the ID of the customer for which you want to execute the
        action.
    is_mandatory: false
-   name: Incident ID
    default_value: ''
    type: string
    description: Specify the ID of the incident that needs to be updated.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Closed
    - In Progress
    - New
    - Reopened
    description: Specify the status for the incident.
    is_mandatory: false
-   name: Assign to
    default_value: ''
    type: string
    description: 'Specify the name or email of the analyst to whom the incident needs
        to be assigned. If "Unassign" is provided, action will remove assignment from
        the incident. Note: for name you need to provide first and last name of the
        analyst in the following format "{first name} {last name}"'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_incident_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
