name: Crowdstrike - Detections Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: behaviors_technique
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: '180'
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://api.crowdstrike.com
    type: string
    description: API root of the Crowdstrike instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID  of the Crowdstrike account.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret of the Crowdstrike account.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity Score To Fetch
    default_value: '50'
    type: string
    description: 'Lowest severity score of the detections to fetch. If nothing is
        provided, the connector won''t apply this filter. Maximum is 100. Note: action
        also supports the following values: Low, Medium, High, Critical.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Lowest Confidence Score To Fetch
    default_value: '0'
    type: integer
    description: Lowest confidence score of the detections to fetch. If nothing is
        provided, the connector won't apply this filter. Maximum is 100.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Hours Backwards
    default_value: '1'
    type: integer
    description: Number of hours before the first connector iteration to retrieve
        detections from. This parameter applies to the initial connector iteration
        after you enable the connector for the first time, or used as a fallback value
        in cases where connector's last run timestamp expires.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Detections To Fetch
    default_value: '10'
    type: integer
    description: 'How many detections to process per one connector iteration. Default:
        10.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Padding Period
    default_value: '1'
    type: integer
    description: 'The number of hours that connector will use for padding. Maximum:
        6.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Disable Overflow
    default_value: false
    type: boolean
    description: If enabled, connector will ignore the overflow mechanism.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: 'false'
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Crowdstrike server is valid.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Case Name Template
    default_value: ''
    type: string
    description: 'When provided, connector will add a new key called "custom_case_name"
        to the Google Secops Event. It can used to have a customer case name. Please
        refer to the documentation portal for more details. You can provide placeholders
        in the following format: [name of the field]. Example: Phishing - [event_mailbox].
        Note: connector will use first Google Secops Event for placeholders. Only
        keys that have string value will be handled.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Name Template
    default_value: ''
    type: string
    description: 'If provided, connector will use this value for Google Secops Alert
        Name. Please refer to the documentation portal for more details. You can provide
        placeholders in the following format: [name of the field]. Example: Phishing
        - [event_mailbox]. Note: connector will use first Google Secops Event for
        placeholders. Only keys that have string value will be handled. If nothing
        is provided or user provides an invalid template, connector will use the default
        alert name.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Customer ID
    default_value: ''
    type: string
    description: The customer ID of the tenant in which to execute the integration.
        For use in multi-tenant (MSSP) environments.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Deprecated. Pull detections from Crowdstrike. Whitelist works with filters
    that are supported by the API of Crowdstrike. For the details, please refer to
    the documentation portal.
integration: CrowdStrikeFalcon
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/crowdstrike-falcon#crowdstrike-detections-connector
rules: []
is_connector_rules_supported: false
creator: admin
