name: Crowdstrike Falcon Streaming Events Connector
parameters:
-   name: DeviceProductField
    default_value: device_product
    type: string
    description: Describes the name of the field where the product name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: Name
    type: string
    description: Describes the name of the field where the event name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: 600
    type: integer
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If environment field isn't found, environment is ""
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: ''
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://api.crowdstrike.com
    type: string
    description: API root of the Crowdstrike instance
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID for Crowdstrike API
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret for Crowdstrike API
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Event types
    default_value: DetectionSummaryEvent, IncidentSummaryEvent, UserActivityAuditEvent,
        RemoteResponseSessionStartEvent, RemoteResponseSessionEndEvent, EppDetectionSummaryEvent
    type: string
    description: 'Specify a comma-separated list of event types. Examples of the event
        types: DetectionSummaryEvent, IncidentSummaryEvent, UserActivityAuditEvent,
        RemoteResponseSessionStartEvent, RemoteResponseSessionEndEvent, EppDetectionSummaryEvent.
        For more information visit documentation portal.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Events per Cycle
    default_value: 100
    type: integer
    description: Max events to process per connector run.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Day Backwards
    default_value: 3
    type: integer
    description: Number of days before the first connector iteration to retrieve events
        from. This parameter applies to the initial connector iteration after you
        enable the connector for the first time, or used as a fallback value in cases
        where connector's last run timestamp expires.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Min Severity
    default_value: 0
    type: integer
    description: Specify the events that should be ingested based on the events severity
        (detections events). The value ranges from 0-5. If other event types besides
        detections are ingested by the connector, connector sets a severity for them
        as -1 and this filter is not applied to those types of events
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Alert Name Template
    default_value: ''
    type: string
    description: 'If provided, connector will use this value for Siemplify Alert Name.
        Please refer to the documentation portal for more details. You can provide
        placeholders in the following format: [name of the field]. Example: Phishing
        - [event_mailbox]. Note: connector will use first Siemplify Event for placeholders.
        Only keys that have string value will be handled. If nothing is provided or
        user provides an invalid template, connector will use the default alert name.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Rule Generator Template
    default_value: ''
    type: string
    description: "\t\n\nIf provided, the connector will use this value for Siemplify\
        \ Rule Generator. Please refer to the documentation portal for more details.\
        \ You can provide placeholders in the following format: [name of the field].\
        \ Example: Phishing - [event_mailbox]. Note: connector will use the first\
        \ Siemplify event for placeholders. Only keys that have string value will\
        \ be handled. If nothing is provided or the user provides an invalid template,\
        \ the connector will use the default rule generator."
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: Proxy server address.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: Proxy username.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: Proxy password.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Disable Overflow
    default_value: false
    type: boolean
    description: If enabled, connector will ignore the overflow mechanism.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: 'false'
    type: boolean
    description: Indicate whether to use SSL in the session or not
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Customer ID
    default_value: ''
    type: string
    description: The customer ID of the tenant in which to execute the integration.
        For use in multi-tenant (MSSP) environments.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Crowdstrike Falcon Streaming Events Connector
integration: CrowdStrikeFalcon
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/crowdstrike-falcon#crowdstrike-falcon-streaming-events-connector
rules: []
is_connector_rules_supported: false
creator: klim.lyapin@siemplify.co
