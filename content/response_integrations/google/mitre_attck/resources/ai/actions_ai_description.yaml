Ping:
  ai_description: >-
    ### General Description

    The Ping action is a diagnostic tool used to verify connectivity between Google
    SecOps and the Mitre ATT&CK framework data source. It ensures that the configured
    API Root is accessible and that the integration can successfully retrieve the
    required JSON data.


    ### Flow Description

    1. Initializes the Siemplify context and retrieves integration-level configurations
    (API Root and Verify SSL).

    2. Instantiates the `MitreAttckManager`.

    3. Calls the `test_connectivity` method, which performs an HTTP GET request to
    the API Root to fetch the raw attack data.

    4. Returns a success status if the data is retrieved, or a failure status if unreachable.


    ### Additional Notes

    - This action is used primarily during initial setup or troubleshooting of the
    Mitre ATT&CK integration.
