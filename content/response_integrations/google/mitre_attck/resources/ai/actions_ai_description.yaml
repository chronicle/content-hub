Get Technique Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about specific MITRE ATT&CK techniques from the
    MITRE ATT&CK framework. This action allows security analysts to quickly pull context,
    detection strategies, and platform information for techniques identified during
    an investigation.


    ### Flow Description

    1. Initializes the connection to the configured MITRE ATT&CK API root.

    2. Parses the comma-separated list of technique identifiers provided in the parameters.

    3. Iterates through each identifier and queries the MITRE dataset based on the
    selected identifier type (Name, ID, or External ID) via an HTTP GET request.

    4. Extracts key metadata including the technique's description, detection logic,
    and affected operating systems.

    5. Outputs a data table and a direct link to the MITRE ATT&CK website for each
    technique.

    6. Optionally creates a Case Insight containing the technique's description if
    configured.


    ### Additional Notes

    This action does not run on specific entities; it is a utility action that fetches
    reference data based on user-provided strings.
