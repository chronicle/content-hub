Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the UnshortenMe service.


    ### Flow Description

    1. Initializes the UnshortenMe manager using the integration's configuration.

    2. Sends a test GET request to the UnshortenMe API (`https://unshorten.me/json/goo.gl/IGL1lE`)
    to verify network connectivity and API access.

    3. Returns a success message if the connection is established and the API responds
    correctly.


    ### Additional Notes

    This action is typically used to verify integration settings and network access.
    It does not process alerts or entities.
  ai_short_description: >-
    Tests connectivity to the UnshortenMe service to ensure the integration is configured
    correctly and the API is reachable.
