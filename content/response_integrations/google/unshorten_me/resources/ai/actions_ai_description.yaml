Unshorten URL:
  ai_description: >-
    ### General Description

    Resolves short URL entities to their original long URLs using the Unshorten.me
    service. This action enriches URL entities by providing the actual destination
    URL, which is crucial for threat analysis and investigation.


    ### Flow Description

    1. Iterates through the target entities provided to the action.

    2. Filters the entities to process only those of type URL.

    3. Makes an HTTP GET request to the Unshorten.me API (`https://unshorten.me/json/{short_url}`)
    for each URL entity.

    4. Retrieves the resolved long URL from the API response.

    5. Updates the entity's additional properties with the `long_url` and marks the
    entity as enriched.

    6. Updates the entities within the Google SecOps platform and returns the resolved
    URLs as a JSON result.


    ### Additional Notes

    The action will skip entities that are not URLs. It handles API rate limits by
    raising an exception if the maximum requests per hour (10 requests) are exceeded.
  ai_short_description: >-
    Resolves short URL entities to their original long URLs using the Unshorten.me
    API and enriches the entities with the resolved destination URLs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Unshorten.me API via GET requests (fetches_data=true).
      It does not mutate external data (can_mutate_external_data=false). It does not
      mutate internal data outside of entities (can_mutate_internal_data=false). It
      updates entities with the resolved URL using `siemplify.update_entities` (can_update_entities=true).
      It does not create insights, modify alert data, or create case comments.
