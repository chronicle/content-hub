Add Rule To Web ACL:
  ai_description: >-
    ### General Description

    Adds a rule based on an existing IP Set or Rule Group to specified Web ACLs in
    AWS WAF. This action modifies the configuration of the target Web ACLs to include
    the specified rule source, applying the defined priority and action (e.g., Allow,
    Block, Count).


    ### Flow Description

    1. Connects to the AWS WAF service using the provided credentials.

    2. Retrieves the list of existing Web ACLs in the specified scope (CloudFront,
    Regional, or Both) via the AWS WAF API.

    3. Searches for the specified Rule Source (IP Set or Rule Group) by name to obtain
    its ARN.

    4. Iterates through the target Web ACLs and retrieves their current rules.

    5. Checks if the rule already exists in the Web ACL to prevent duplicates.

    6. Calls the AWS WAF API to update the Web ACL, appending the new rule with the
    specified priority and action.


    ### Additional Notes

    At maximum, a Web ACL can contain 1500 rules. Priorities in a Web ACL must be
    unique.
