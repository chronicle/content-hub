Add Entity To Regex Pattern Set:
  ai_description: >-
    ### General Description

    Adds string patterns based on URL and IP Address entities to Regex Pattern Sets
    in AWS WAF.


    ### Flow Description

    1. Connects to the AWS WAF service using the provided integration credentials.

    2. Retrieves the existing Regex Pattern Sets based on the specified scope (CloudFront,
    Regional, or Both) using the `list_regex_pattern_sets` API call.

    3. Iterates through the target entities, filtering for URL and Address types.

    4. Converts the entity identifiers into regex patterns, optionally wrapping them
    with HTTP/HTTPS protocol regex if the `Domain Pattern` or `IP Pattern` parameters
    are enabled.

    5. Retrieves the current regex list for each target set using the `get_regex_pattern_set`
    API call to avoid duplicates.

    6. Updates the target Regex Pattern Sets in AWS WAF with the new regex patterns
    via the `update_regex_pattern_set` API call.


    ### Additional Notes

    AWS WAF Regex Pattern Sets have a hard limit and can only contain a maximum of
    10 patterns per set. The action will not add patterns that exceed this limit.
  ai_short_description: >-
    Adds string patterns based on URL and IP Address entities to Regex Pattern Sets
    in AWS WAF.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates Regex Pattern Sets in AWS WAF by adding new regex patterns based on
      entities.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by updating Regex Pattern Sets in AWS WAF via
      the `update_regex_pattern_set` API call. It does not fetch contextual data for
      enrichment, nor does it mutate internal data, update entities, or create insights.
