Remove IP From IP Set:
  ai_description: >-
    ### General Description

    Removes specified IP address entities from one or more IP Sets in AWS WAF. This
    action modifies the external AWS WAF configuration to delete the provided IPs
    from the target sets, which can effectively remove them from blocklists or allowlists
    depending on how the IP Sets are used in Web ACL rules.


    ### Flow Description

    1. Connects to the AWS WAF service using the provided integration credentials.

    2. Retrieves the list of existing IP Sets based on the specified `Scope` (CloudFront,
    Regional, or Both) and `IP Set Names`.

    3. Filters the target entities to include only IP Address entities.

    4. For each valid IP address entity, checks its IP version and masks it if necessary
    (e.g., appending `/32` for IPv4 or `/128` for IPv6).

    5. Calls the AWS WAF API (`update_ip_set`) to remove the matching IP addresses
    from the target IP Sets.

    6. Returns a summary of successfully removed IPs, missing IPs, and any failures.


    ### Additional Notes

    The action automatically handles IP masking before attempting removal. If an IP
    address is not found in the specified IP Set, it will be skipped and noted in
    the output message.
