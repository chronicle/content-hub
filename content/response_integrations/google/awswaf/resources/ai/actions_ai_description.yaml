Add Pattern To Regex Pattern Set:
  ai_description: >-
    ### General Description

    Adds string patterns to specified Regex Pattern Sets in AWS WAF. This action allows
    users to update existing Regex Pattern Sets with new regular expressions, which
    can then be used in WAF rules to inspect web requests.


    ### Flow Description

    1. Connects to the AWS WAF service using the provided integration credentials.

    2. Retrieves the list of existing Regex Pattern Sets for the specified scope (CloudFront,
    Regional, or Both) via the `list_regex_pattern_sets` API call.

    3. Filters the retrieved sets to find those matching the provided `Regex Pattern
    Set Names`.

    4. For each matching set, retrieves the current list of patterns using the `get_regex_pattern_set`
    API call.

    5. Checks for duplicate patterns and verifies available capacity (AWS WAF limits
    Regex Pattern Sets to a maximum of 10 patterns).

    6. Updates the Regex Pattern Set in AWS WAF with the new, non-duplicate patterns
    using the `update_regex_pattern_set` API call.


    ### Additional Notes

    The action automatically handles capacity limits by only adding patterns up to
    the maximum allowed (10). It also prevents adding duplicate patterns that already
    exist in the target Regex Pattern Set.
