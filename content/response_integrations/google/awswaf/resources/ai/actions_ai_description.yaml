Create Regex Pattern Set:
  ai_description: >-
    ### General Description

    Creates a Regex Pattern Set in AWS WAF based on URL and IP Address entities. The
    action can create the set in Regional, CloudFront, or both scopes, and allows
    for automatic conversion of URLs to domain patterns and IP addresses to regex
    patterns.


    ### Flow Description

    1. Extracts the action parameters including the desired name, scope, description,
    and tags for the Regex Pattern Set.

    2. Connects to the AWS WAF service using the provided integration credentials.

    3. Iterates over the target URL and IP Address entities.

    4. If `Domain Pattern` is enabled, extracts the domain from URL entities and wraps
    it in a regex pattern.

    5. If `IP Pattern` is enabled, wraps IP Address entities in a regex pattern.

    6. Validates that the number of generated regex patterns does not exceed the AWS
    WAF limit of 10 per set.

    7. Calls the AWS WAF API to create the Regex Pattern Set in the specified scope(s).

    8. Returns a JSON result containing the names of the successfully created Regex
    Pattern Sets per scope.


    ### Additional Notes

    - A Regex Pattern Set can only contain a maximum of 10 patterns per set.

    - There can only be a maximum of 10 Regex Pattern Sets in AWS WAF.

    - If the number of entities exceeds the limit, the action will fail or skip the
    excess entities.
