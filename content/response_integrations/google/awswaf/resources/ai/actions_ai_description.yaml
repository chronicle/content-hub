Add IP To IP Set:
  ai_description: >-
    ### General Description

    Adds IP address entities to specified IP Sets in AWS WAF. This action allows security
    teams to dynamically update AWS WAF IP Sets with new IP addresses, which can then
    be used in Web ACL rules to block or allow traffic.


    ### Flow Description

    1. Extracts the provided IP Set Names and Scope (CloudFront, Regional, or Both)
    from the action parameters.

    2. Connects to the AWS WAF service using the provided integration credentials.

    3. Retrieves the existing IP Sets from AWS WAF based on the specified scope.

    4. Filters the target entities to process only IP Address entities.

    5. Iterates over the matching IP Sets and validates that the entity's IP version
    matches the IP Set's version.

    6. Masks the IP addresses if they are not already masked (e.g., appending `/32`
    for IPv4 or `/128` for IPv6).

    7. Calls the AWS WAF API to update the IP Sets with the new IP addresses.

    8. Returns a summary of the successfully added IPs and any failures.


    ### Additional Notes

    - The action automatically handles IP masking if a raw IP address is provided.

    - IP addresses that do not match the IP version of the target IP Set will be skipped
    and reported as failed.
  ai_short_description: >-
    Adds IP address entities to specified IP Sets in AWS WAF.
