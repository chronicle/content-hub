Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP Address and Hostname entities using information from Outpost24. This
    action retrieves device details and vulnerability findings associated with the
    target entities to provide security context.


    ### Flow Description

    1. Extracts action parameters including risk level filters, finding types, and
    limits.

    2. Iterates through the target entities, filtering specifically for IP Addresses
    and Hostnames.

    3. Makes a GET request to the Outpost24 API (`/opi/rest/outscan/targets`) to fetch
    device information for each valid entity.

    4. If 'Return Finding Information' is enabled, makes a subsequent GET request
    to the Outpost24 API (`/opi/rest/outscan/findings`) to retrieve associated vulnerability
    and information findings based on the provided risk level and type filters.

    5. Updates the entity's additional properties with the retrieved data and marks
    the entity as enriched.

    6. Creates an insight for the entity containing the device and findings summary
    if the 'Create Insight' parameter is enabled.

    7. Updates the entities in the SecOps platform and returns the structured JSON
    results.


    ### Additional Notes

    The action supports filtering findings by risk level (e.g., Low, Medium, High,
    Critical) and type (Vulnerability, Information), and allows limiting the maximum
    number of findings returned per entity to prevent data overload.
  ai_short_description: >-
    Enriches IP Address and Hostname entities by retrieving device information and
    vulnerability findings from Outpost24.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Outpost24 API (GET requests to targets and
      findings endpoints). It does not mutate external data. It updates internal entities
      (`siemplify.update_entities`) and creates insights (`siemplify.add_entity_insight`).
      It does not modify alert data or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: false
      generic: false
      host_name: true
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action iterates over `siemplify.target_entities` and filters them using
      `entity.entity_type in SUPPORTED_ENTITY_TYPES`, where SUPPORTED_ENTITY_TYPES
      includes EntityTypes.ADDRESS and EntityTypes.HOSTNAME. Therefore, it targets
      Address and Hostname entities and filters by entity_type.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: true
    enrich_ioc: true
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action fetches device information and vulnerability findings for IP addresses
      and hostnames. This aligns with 'Enrich Asset' (fetching contextual metadata
      and vulnerabilities for a resource) and 'Enrich IOC' (fetching threat intelligence/vulnerabilities
      for an IP address). It does not mutate external state or perform containment.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
    search_events: false
    send_email: false
    send_message: false
    submit_file: false
    uncontain_host: false
    update_alert: false
    update_email: false
    update_identity: false
    update_ticket: false
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Finding Risk Level Filter | String | No | Specify a comma-separated list of
    risk level findings that will be used during filtering. Possible values: Initial,
    Recommendation, Low, Medium, High, Critical. If nothing is provided, action will
    fetch findings with all risk levels. |

    | Max Findings To Return | String | No | Specify how many findings to process
    per entity. If nothing is provided, action will return 100 findings. |

    | Return Finding Information | Boolean | No | If enabled, action will also retrieve
    information about findings that were found on the endpoint. |

    | Finding Type | Dropdown | No | Specify what kind of findings should be returned.
    |

    | Create Insight | Boolean | No | If enabled, action will create an insight containing
    all of the retrieved information about the entity. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Outpost24 server using the provided integration configuration
    parameters.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the Outpost24Manager.

    3. Sends a GET request to the Outpost24 API (`/opi/rest/outscan/findings?limit=1`)
    to verify connectivity.

    4. Returns a success or failure message based on the HTTP response.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to the Outpost24 server using the provided integration configuration
    parameters.
