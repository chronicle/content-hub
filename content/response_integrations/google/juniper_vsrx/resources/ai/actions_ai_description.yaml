Remove IP From Address Set:
  ai_description: >-
    ### General Description

    Removes specified IP address entities from a designated address set on a Juniper
    VSRX device. This action modifies the firewall's configuration to remove the IP
    address from the specified group, which can be used to remove an IP from a blocklist
    or allowlist.


    ### Flow Description

    1. Initializes a connection to the Juniper VSRX device using the provided credentials.

    2. Iterates through the target entities, filtering specifically for `ADDRESS`
    entity types.

    3. For each valid IP address, executes a command on the Juniper VSRX device to
    remove the IP from the specified address set (and optionally, a specific zone).

    4. Commits the configuration changes to the device.

    5. Closes the session and returns a summary message detailing the successfully
    removed IP addresses.


    ### Additional Notes

    Ensure that the specified Address Set Name exists on the Juniper VSRX device.
    If a Zone Name is provided, the action will attempt to remove the IP from the
    address set within that specific zone.
