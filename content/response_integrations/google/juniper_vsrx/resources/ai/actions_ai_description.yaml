Add IP To Address Set:
  ai_description: >-
    ### General Description

    Adds specific IP address entities to a designated address set on a Juniper VSRX
    device. This action modifies the firewall's configuration by creating an address
    record for the IP and associating it with the specified address set, optionally
    within a specific security zone.


    ### Flow Description

    1. Establishes a connection to the Juniper VSRX device using the provided credentials.

    2. Iterates through the target entities, filtering for those of type `ADDRESS`.

    3. For each valid IP address entity, executes configuration commands on the Juniper
    VSRX device to create an address record and add it to the specified `Address Set
    Name` (and optionally `Zone Name`).

    4. Commits the configuration changes to the device.

    5. Closes the connection session and returns a summary message indicating which
    entities were successfully added.


    ### Additional Notes

    Depending on the firewall policies associated with the target address set, this
    action can be used to either block or allow network traffic for the specified
    IP addresses.
  ai_short_description: >-
    Adds IP address entities to a specified address set on a Juniper VSRX device.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Modifies the configuration of the Juniper VSRX device by adding an IP address
      to a specified address set.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes configuration commands on the Juniper VSRX device to add
      an IP address to an address set, which mutates external data. It does not fetch
      data, mutate internal data, update entities, or create insights.
