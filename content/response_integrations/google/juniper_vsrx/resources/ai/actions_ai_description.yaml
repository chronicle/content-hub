    ### General Description

    Tests connectivity to the JuniperVSRX integration to ensure the provided credentials
    and network settings are valid.


    ### Flow Description

    1. Retrieves the integration configuration parameters (Address, Port, Username,
    Password).

    2. Initializes the JuniperVSRXManager.

    3. Executes a probe command to the JuniperVSRX device to verify connectivity.

    4. Returns a success or failure message based on the probe result.


