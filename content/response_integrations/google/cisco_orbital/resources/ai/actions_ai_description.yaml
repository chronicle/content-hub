Execute Query:
  ai_description: >-
    ### General Description

    Executes custom osquery SQL queries on endpoints associated with IP Address and
    Hostname entities using Cisco Orbital. This action allows analysts to retrieve
    specific system state or telemetry data directly from the endpoints.


    ### Flow Description

    1. Extracts the provided query, job name, context fields, and result limits from
    the action parameters.

    2. Filters the target entities to include only IP Addresses and Hostnames.

    3. Submits an asynchronous query job to Cisco Orbital for the targeted endpoints.

    4. Polls Cisco Orbital for the job status and retrieves the query results once
    completed.

    5. Attaches the query results to the action's JSON output and optionally creates
    a case wall table with the retrieved data.


    ### Additional Notes

    This is an asynchronous action. The maximum timeout is 24 hours, and it should
    be adjusted in the IDE as needed.
  ai_short_description: >-
    Executes custom osquery SQL queries on endpoints associated with IP Address and
    Hostname entities using Cisco Orbital and retrieves the results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by submitting a query job and retrieving the results
      from Cisco Orbital. It does not mutate external data (as it performs a read-only
      query on the endpoint), nor does it mutate internal data, update entities, create
      insights, modify alerts, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: false
      generic: false
      host_name: true
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: true
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action iterates over `siemplify.target_entities` and filters them using
      `entity.entity_type in SUPPORTED_ENTITY_TYPES`, where supported types are ADDRESS
      and HOSTNAME. During the asynchronous polling phase and result matching, it
      also filters entities by their `identifier`.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: false
    enrich_ioc: false
    execute_command_on_the_host: true
    get_alert_information: false
    reasoning: >-
      The action submits an osquery SQL query to be executed on remote endpoints and
      retrieves the results. This aligns with the 'Execute Command on the Host' category,
      as it runs a system query on a remote endpoint and returns the output.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
    search_events: false
    send_email: false
