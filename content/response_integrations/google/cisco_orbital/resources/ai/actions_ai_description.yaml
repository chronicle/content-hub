    update_email: false
    update_identity: false
    update_ticket: false
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Query | String | Yes | Specify the query that needs to be executed. |

    | Name | String | No | Specify the name for the query job. If nothing is specified,
    action will use a name in the following format: Siemplify-{guid} |

    | Custom Context Fields | String | No | Specify additional custom context fields
    that should be added to the job. Format: key_1:value_1,key_2:value_1. |

    | Max Results To Return | String | No | Specify how many results should be returned.
    |

    | Hide Case Wall Table | Boolean | No | If enabled, action will not prepare a
    case wall table. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cisco Orbital server to ensure the integration is configured
    correctly and can communicate with the API.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, Client ID, Client
    Secret, Verify SSL).

    2. Initializes the Cisco Orbital manager and authenticates to retrieve a token.

    3. Makes a GET request to the `v0/ok` endpoint to verify connectivity.

    4. Returns a success or failure message based on the HTTP response.


    ### Additional Notes

    This action is typically used as a diagnostic tool to verify that the integration's
    credentials and network settings are valid. It does not interact with cases or
    entities.
  ai_short_description: >-
    Tests connectivity to the Cisco Orbital server to ensure the integration is configured
    correctly.
