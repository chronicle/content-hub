WhoIs:
  ai_description: >-
    ### General Description

    Queries the IPVoid Whois database to retrieve information about a particular domain
    name or IP address.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only those of type IP Address or Hostname.

    3. For each matching entity, makes an HTTP POST request to the IPVoid Whois service
    to fetch the WhoIs HTML report.

    4. Attaches the retrieved HTML report to the entity's results within the SecOps
    platform.


    ### Additional Notes

    This action does not update entity properties or create insights; it solely retrieves
    and attaches a visual HTML report to the entity for analyst review.
  ai_short_description: >-
