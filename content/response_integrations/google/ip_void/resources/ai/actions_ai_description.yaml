Get Ip Reputation:
  ai_description: >-
    ### General Description

    Enriches IP Address entities by scanning them through multiple DNS-based blacklists
    (DNSBL) and IP reputation services using IPVoid. This action retrieves threat
    intelligence, evaluates risk based on a configured threshold, updates the entity's
    properties, and generates insights with the analysis results.


    ### Flow Description

    1. Iterates over the target entities and filters for IP Address entities.

    2. For each IP address, makes an API call to IPVoid (`POST /iprep/v1/pay-as-you-go/`)
    to fetch reputation data.

    3. Parses the reputation data, including blacklist reports, detection rates, and
    anonymity information.

    4. Adds an entity table to the case wall containing the blacklist report.

    5. Creates an insight with the country code if available in the enrichment data.

    6. Updates the entity's additional properties with the retrieved enrichment data.

    7. If the number of detections exceeds the configured `Threshold` parameter, marks
    the entity as suspicious.

    8. Marks the entity as enriched and updates it within the platform.


    ### Additional Notes

    The action requires an IPVoid API key and root URL configured in the integration
    settings. Although the API call uses a POST method, it functions purely as a data
    retrieval (enrichment) operation and does not mutate external state.
  ai_short_description: >-
    Enriches IP Address entities by retrieving reputation data and blacklist reports
    from IPVoid, updating entity properties, and generating insights based on the
    findings.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches IP reputation data from the IPVoid API (fetches_data=true).
      It does not mutate external data (the POST request is used for querying, not
      state change). It updates internal entities with enrichment data and suspicious
      flags (can_update_entities=true) and creates insights (can_create_insight=true).
      It does not modify alert data or create case comments.
