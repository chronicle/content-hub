Get Scan Results:
  ai_description: >-
    ### General Description

    Retrieves the results of a specific scan from Rapid7 InsightVM using the provided
    Scan ID. The action waits for the scan to finish before fetching and returning
    the final scan details.


    ### Flow Description

    1. Initializes the Rapid7 InsightVM manager with the provided integration credentials.

    2. Retrieves the `Scan ID` from the action parameters.

    3. Polls the Rapid7 API (`GET /scans/{scan_id}`) every 2 seconds to check if the
    scan status is marked as completed.

    4. Once completed, fetches the full scan details via the Rapid7 API (`GET /scans/{scan_id}`).

    5. Formats the scan information into a CSV data table and attaches the raw JSON
    results to the action output.


    ### Additional Notes

    This action is synchronous and will block execution (polling every 2 seconds)
    until the specified scan is completed. Ensure the scan is expected to finish within
    the action's timeout window.
  ai_short_description: >-
    Retrieves the results of a specific scan from Rapid7 InsightVM by its Scan ID,
    waiting until the scan is completed before returning the data.
