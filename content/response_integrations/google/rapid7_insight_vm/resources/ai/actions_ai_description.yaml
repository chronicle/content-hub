    ### General Description

    Retrieves a list of scans from Rapid7 InsightVM. This action allows users to fetch
    all scans or filter them based on a specified number of days backwards.


    ### Flow Description

    1. Retrieves the `Days Backwards` parameter to determine the time range for fetching
    scans.

    2. If a time range is specified, calculates the start time.

    3. Makes an API call (GET request) to the Rapid7 InsightVM API to list scans,
    optionally filtering by the calculated start time.

    4. Formats the retrieved scan data into CSV and JSON formats.

    5. Attaches the CSV data as a data table and the JSON data as a result to the
    action output.


