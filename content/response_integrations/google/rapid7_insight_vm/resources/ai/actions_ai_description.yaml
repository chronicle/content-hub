Launch Scan:
  ai_description: >-
    ### General Description

    Starts a vulnerability scan for a specific site in Rapid7 InsightVM targeting
    Hostname and IP Address entities. The action can optionally run asynchronously
    to wait for the scan to complete and retrieve its results.


    ### Flow Description

    1. Retrieves action parameters including Scan Name, Site Name, Scan Engine, Scan
    Template, and Fetch Results.

    2. Iterates over the target entities, filtering for `ADDRESS` (IP Address) and
    `HOSTNAME` entity types, and extracts their identifiers to build a list of target
    hosts.

    3. Makes a POST request to the Rapid7 InsightVM API (`/sites/{site_id}/scans`)
    to launch a new scan on the specified site with the extracted hosts.

    4. If the "Fetch Results" parameter is enabled, the action suspends and runs asynchronously,
    periodically making GET requests to check the scan status.

    5. Once the scan is completed, it retrieves the scan information and attaches
    it to the action's JSON results and data tables.


    ### Additional Notes

    - The action operates asynchronously if "Fetch Results" is set to true.

    - If a "Scan Name" is not provided, the action automatically generates one using
    the current timestamp.
  ai_short_description: >-
    Starts a vulnerability scan for a specific site in Rapid7 InsightVM targeting
    Hostname and IP Address entities, optionally waiting to fetch the scan results.
  capabilities:
    can_create_case_comments: false
