Enrich Asset:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities using Rapid7 InsightVm to retrieve asset
    details such as OS, MAC address, and risk score.


    ### Flow Description

    1. Iterates through the target entities in the case.

    2. Checks if the entity type is an IP Address or Hostname.

    3. Makes an API call to Rapid7 InsightVm to search for the asset by its IP or
    hostname.

    4. If found, extracts the asset details and updates the entity's additional properties.

    5. Marks the entity as enriched and attaches a data table to the entity.

    6. Returns a JSON result containing the details of all enriched assets.

    7. Updates the entities within the platform.


    ### Additional Notes

    None.
