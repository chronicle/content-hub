QuarantineEndpoint:
  ai_description: >-
    ### General Description

    Quarantines an endpoint in Symantec Endpoint Protection (SEP). This action isolates
    the specified host from the network to prevent further communication or potential
    lateral movement during a security incident.


    ### Flow Description

    1. Iterates over the provided target entities.

    2. Filters entities to process only IP Addresses (`ADDRESS`) and Hostnames (`HOSTNAME`).

    3. For IP addresses, makes a SOAP API call (`getComputersByIP`) to retrieve the
    corresponding computer ID from SEP.

    4. For hostnames, makes a REST API call (`getComputerInfo`) and a SOAP API call
    (`getComputersByHostName`) to retrieve the computer ID.

    5. If a computer ID is found, makes a SOAP API call (`runClientCommandQuarantine`)
    to quarantine the endpoint in SEP.

    6. Updates the entity's additional properties within Google SecOps with the returned
    command ID.


    ### Additional Notes

    This action requires the endpoint to be actively managed by Symantec Endpoint
    Protection.
