    ### Flow Description

    1. Establishes a connection to the Symantec Endpoint Protection manager.

    2. Iterates over the provided list of Command IDs.

    3. For each target entity, evaluates if its `additional_properties` contain a
    `_command_id` key that matches the current Command ID.

    4. If a match is found, makes a SOAP API call (`getCommandStatusDetails`) to SEP
    to fetch the command status report.

    5. Flattens the retrieved report data and appends it to the entity's `additional_properties`
    with a specific prefix.

    6. Updates the enriched entities within Google SecOps and returns the reports
    as JSON results.


