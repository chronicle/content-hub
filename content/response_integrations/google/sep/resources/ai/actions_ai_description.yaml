BlockHash:
  ai_description: >-
    ### General Description

    Blocks specific MD5 file hashes on endpoints by adding them to a designated blacklist
    in Symantec Endpoint Protection (SEP).


    ### Flow Description

    1. Retrieves the current list of blacklisted hashes from SEP using the provided
    `Black List Name`.

    2. Iterates through the target entities, filtering for File Hash entities that
    are exactly 32 characters long (MD5) and not already present in the blacklist.

    3. Appends the valid MD5 hashes to the retrieved blacklist array.

    4. Sends a POST request to the SEP API to update the blacklist with the newly
    added hashes.

    5. Updates the successfully blocked entities in Google SecOps with the additional
    property `SEP_IsBlocked: True`.


    ### Additional Notes

    Only MD5 hashes (32 characters in length) are supported by this action. Hashes
    that are already blacklisted will be skipped.
  ai_short_description: >-
    Blocks specific MD5 file hashes on endpoints by adding them to a designated blacklist
    in Symantec Endpoint Protection.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: >-
      Adds the MD5 file hash to the specified blacklist in Symantec Endpoint Protection.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action retrieves the current blacklist and then makes a POST request to
      Symantec Endpoint Protection to update the blacklist with new MD5 hashes, which
      mutates external data. It also updates the internal entities with a 'SEP_IsBlocked'
      property.
