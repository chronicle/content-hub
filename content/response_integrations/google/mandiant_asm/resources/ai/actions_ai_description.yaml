Search Issues:
  ai_description: >-
    ### General Description

    Searches for issues in Mandiant Attack Surface Management (ASM) that match specified
    criteria such as issue IDs, entity names, severity, status, and time frames. The
    action retrieves the matching issues and returns them as a JSON array for further
    use in the playbook.


    ### Flow Description

    1. Extracts search criteria from the action parameters, including issue IDs, entity
    names, time frames, severity, and status.

    2. Constructs a query string based on the provided filters.

    3. Makes a GET request to the Mandiant ASM API (`/api/v1/search/issues` or `/api/v3/asm/search/issues`)
    to search for issues.

    4. Iterates through paginated results until the maximum limit is reached or all
    matching issues are retrieved.

    5. Returns the matching issues as a JSON array in the action results.


    ### Additional Notes

    The action does not operate on SOAR entities but uses the provided parameters
    to query the external system. If 'Custom' is selected for the 'Time Frame' parameter,
    the 'Start Time' parameter becomes mandatory.
