Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Mandiant ASM platform using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts integration configuration parameters including API Root, Access Key,
    Secret Key, GTI API Key, and Project Name.

    2. Initializes the Mandiant ASM Manager, which attempts to authenticate and fetch
    the project ID from the Mandiant ASM API via a GET request.

    3. Returns a successful execution state if the connection is established and the
    project is found, otherwise returns a failure state with the error details.


    ### Additional Notes

    This action is primarily used for verifying the integration setup and does not
    perform any operational tasks on alerts or entities.
