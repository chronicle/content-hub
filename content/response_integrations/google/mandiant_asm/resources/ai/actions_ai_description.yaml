Search ASM Entities:
  ai_description: >-
    ### General Description

    Searches for entities in Mandiant Attack Surface Management (ASM) based on specified
    criteria such as entity names, tags, issue severity, and vulnerability counts.
    The action retrieves the matching entities and returns them as a JSON result.


    ### Flow Description

    1. Extracts the integration configuration and action parameters.

    2. Initializes the Mandiant ASM API client with the provided credentials.

    3. Constructs a search query based on the provided criteria (Entity Name, Tags,
    Critical or High Issue, Minimum Vulnerabilities Count, Minimum Issues Count).

    4. Makes a GET request to the Mandiant ASM API (`/api/v1/search/entities/{query_string}`
    or `/api/v3/asm/search/entities/{query_string}`) to search for entities matching
    the query.

    5. Parses the response and returns the matching entities as a JSON result attached
    to the action.


    ### Additional Notes

    The action returns up to the specified maximum number of entities (default 50,
    max 200). If no entities match the criteria, the action will complete successfully
    but return an empty result.
