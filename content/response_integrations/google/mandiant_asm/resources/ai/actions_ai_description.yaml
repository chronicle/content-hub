Get ASM Entity Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about specific Mandiant ASM entities using their
    unique entity IDs.


    ### Flow Description

    1. Extracts the provided comma-separated list of Entity IDs.

    2. Iterates through each Entity ID.

    3. Makes a GET request to the Mandiant ASM API (`api/v1/entities/{entity_id}/raw`
    or `api/v3/asm/entities/{entity_id}/raw`) to fetch the entity's details.

    4. Collects the successful responses and appends them to the action's JSON result.

    5. Returns a summary message indicating which entities were successfully retrieved
    and which failed.


    ### Additional Notes

    This action does not operate on standard SOAR entities but relies on Mandiant
    ASM-specific entity IDs provided as input.
  ai_short_description: >-
    Retrieves detailed information about specific Mandiant ASM entities using their
    unique entity IDs.
