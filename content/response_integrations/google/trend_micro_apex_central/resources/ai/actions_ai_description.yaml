Unisolate Endpoints:
  ai_description: >-
    ### General Description

    Unisolates specific endpoints in Trend Micro Apex Central to restore their network
    connectivity. Supported entities include IP Address, Hostname, and MAC Address.


    ### Flow Description

    1. The action iterates over the provided target entities and filters them to include
    only supported types (IP Address, Hostname, MAC Address).

    2. For each supported entity, it initiates an unisolation request to Trend Micro
    Apex Central via a POST API call (`/WebApp/API/AgentResource/ProductAgents`).

    3. Because unisolation can take time, the action runs asynchronously. It periodically
    queries the endpoint's isolation status via a GET API call to check if the unisolation
    is complete.

    4. The action completes when the endpoints are successfully unisolated or if an
    error/timeout occurs.


    ### Additional Notes

    This action can take several minutes to finish, so consider increasing the timeout
    in the IDE.
