Isolate Endpoints:
  ai_description: >-
    ### General Description

    Isolates endpoints in Trend Micro Apex Central to prevent them from connecting
    to the network.


    ### Flow Description

    1. Filters target entities for supported types (IP Address, Hostname, MAC Address).

    2. Initiates an isolation request for each supported entity by making a POST request
    to the Trend Micro Apex Central API (`/WebApp/API/AgentResource/ProductAgents`).

    3. Periodically checks the isolation status of the endpoints by making GET requests
    to the API.

    4. Completes the action once the endpoints are successfully isolated or if the
    action times out.


    ### Additional Notes

    This is an asynchronous action that may take several minutes to finish. Consider
    increasing the timeout in the IDE if necessary.
