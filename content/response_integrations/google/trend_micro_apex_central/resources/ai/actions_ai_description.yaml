Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP Address, MAC Address, Hostname, URL, and File Hash entities using
    Trend Micro Apex Central. It retrieves User-Defined Suspicious Objects (UDSO)
    details and endpoint security agent information to provide context and threat
    intelligence.


    ### Flow Description

    1. Iterates over supported target entities (IP Address, MAC Address, Hostname,
    URL, File Hash).

    2. For URL, File Hash, and IP Address entities, it fetches UDSO details from Trend
    Micro Apex Central via API.

    3. For Hostname, MAC Address, and IP Address entities, it fetches endpoint security
    agent details via API.

    4. If UDSO details are found, it enriches the entity, optionally marks it as suspicious,
    and optionally creates a UDSO insight.

    5. If endpoint details are found, it enriches the entity and optionally creates
    an endpoint insight.

    6. Updates the entities in the SecOps platform and attaches JSON results and data
    tables to the action result.


    ### Additional Notes

    Only SHA-1 hashes are supported for File Hash entities.
