Create File UDSO:
  ai_description: >-
    ### General Description

    Creates a User-Defined Suspicious Object (UDSO) based on a file in Trend Micro
    Apex Central. This action initiates a state change on the external device to apply
    a specific scan action (Block, Log, or Quarantine) to the provided files.


    ### Flow Description

    1. Retrieves the list of existing UDSO files from Trend Micro Apex Central.

    2. Iterates through the provided file paths, calculating the SHA-1 hash and base64
    encoding for each file.

    3. Checks if the file's SHA-1 hash already exists in the UDSO list.

    4. If it does not exist, makes a PUT request to the Trend Micro Apex Central API
    to upload the file content and create a new UDSO entry with the specified scan
    action and optional note.

    5. Retrieves and returns the JSON results for the successfully added files.


    ### Additional Notes

    The action requires valid local file paths accessible by the integration.
