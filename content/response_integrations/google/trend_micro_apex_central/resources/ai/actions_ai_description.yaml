Create Entity UDSO:
  ai_description: >-
    ### General Description

    Creates a User-Defined Suspicious Object (UDSO) in Trend Micro Apex Central based
    on the target entities. Supported entity types are IP addresses, URLs, and SHA-1
    file hashes.


    ### Flow Description

    1. Retrieves the list of existing UDSO entries from Trend Micro Apex Central.

    2. Iterates through the target entities and filters them by supported types (Address,
    URL, FileHash).

    3. Validates the entity identifiers (e.g., checks for valid IPv4, valid URL, and
    SHA-1 hash length).

    4. Checks if the entity already exists in the UDSO list.

    5. If the entity is valid and does not exist, makes an API call to add the entity
    as a UDSO with the specified scan action (e.g., Block or Log), note, and expiration.

    6. Retrieves the JSON results for the successfully added entities and attaches
    them to the action result.


    ### Additional Notes

    Only SHA-1 hashes are supported for FileHash entities. The note parameter cannot
    exceed 256 characters.
  ai_short_description: >-
    Creates a User-Defined Suspicious Object (UDSO) in Trend Micro Apex Central for
    supported entities (IP, URL, SHA-1 Hash) to apply specific scan actions like blocking
    or logging.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a User-Defined Suspicious Object (UDSO) to Trend Micro Apex Central.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PUT request to Trend Micro Apex Central to add a new User-Defined
      Suspicious Object (UDSO), which mutates external data. It does not fetch contextual
      enrichment data, update internal entities, create insights, or modify alert
      data.
  entity_usage:
