    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Adds links to the Web Report and DOM Tree, and attaches screenshots to the case.
    reasoning: >-
      The action fetches data from the UrlScan.io API using a GET request. It does
      not mutate external data. It mutates internal data by adding links and file
      attachments (screenshots) to the case. It does not update entities, create insights,
      modify alert data, or create case comments.
