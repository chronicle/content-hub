Search for Scans:
  ai_description: "### General Description\nSearches for existing scans on urlscan.io\
    \ using various entity attributes such as domains, IPs, hostnames, file hashes,\
    \ and filenames. This action identifies public scans performed by the community\
    \ as well as unlisted and private scans associated with the user's account. It\
    \ retrieves scan metadata, generates a summary table on the case wall, attaches\
    \ screenshots of the scanned pages, and provides direct links to the urlscan.io\
    \ reports.\n\n### Flow Description\n1. **Initialization**: Retrieves the API key\
    \ and SSL verification settings from the integration configuration.\n2. **Entity\
    \ Filtering**: Identifies supported entities (URL, Hostname, IP Address, File\
    \ Hash, Filename, Domain) within the current scope.\n3. **Search Execution**:\
    \ For each valid entity, it queries the urlscan.io API (`api/v1/search`) for historical\
    \ scan records.\n4. **Data Processing**: If scans are found, it parses the results\
    \ to extract scan IDs, dates, and page statistics.\n5. **Internal Updates**: \n\
    \    * Creates a data table on the Case Wall for each entity summarizing the found\
    \ scans.\n    * Adds external links to the entities pointing to the urlscan.io\
    \ web reports.\n    * Fetches and attaches screenshots of the scanned pages to\
    \ the case.\n6. **Finalization**: Aggregates all results into a JSON output and\
    \ provides a summary message of successful and failed lookups.\n\n### Additional\
    \ Notes\n- The action relies on the `api/v1/search` endpoint of the urlscan.io\
    \ API to retrieve historical scan data."
  ai_short_description: >-
    Searches for existing scans on urlscan.io using various entity attributes such
    as domains, IPs, hostnames, file hashes, and filenames, returning scan metadata,
    screenshots, and report links.
