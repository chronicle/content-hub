Get Scan Full Details:
  ai_description: >-
    Retrieves comprehensive scan reports from UrlScan.io using specific Scan IDs.
    This action is used to fetch detailed forensic data about a previously performed
    URL scan, including network requests, security verdicts, and page metadata.


    ### Flow Description

    1. Extracts the API Key and SSL verification settings from the integration configuration
    and a comma-separated list of Scan IDs from the action parameters.

    2. For each Scan ID provided, queries the UrlScan.io API to fetch the full scan
    report.

    3. Attempts to download the screenshot associated with the scan results.

    4. Adds direct links to the UrlScan.io Web Report and the DOM Tree to the Google
    SecOps case. It also attaches the retrieved screenshot as a file attachment.

    5. Returns the full JSON response for all successful scans as the action result.


    ### Additional Notes

    - This action does not run on entities; it relies entirely on the provided Scan
    ID parameters.

    - Because this action downloads and attaches files (screenshots) to the case,
    it is not categorized as a standard enrichment action according to strict definitions.
  ai_short_description: >-
    Retrieves comprehensive scan reports from UrlScan.io using specific Scan IDs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
