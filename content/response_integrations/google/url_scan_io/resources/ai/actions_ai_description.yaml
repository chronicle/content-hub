Url Check:
  ai_description: >-
    ### General Description

    Submits URL, Domain, and IP Address entities to UrlScan.io for a deep security
    scan and retrieves comprehensive analysis reports. It enriches entities with detailed
    metadata (such as ASN, country, server info, and certificates), evaluates risk
    based on a configurable threshold, and can optionally attach website screenshots
    and create detailed case insights.


    ### Flow Description

    1. **Submission Stage:** The action identifies suitable entities (URL, Domain,
    Address) and submits them to UrlScan.io using the specified visibility level via
    a POST request.

    2. **Polling Stage:** The action enters an asynchronous loop, periodically checking
    the status of the submitted scans via GET requests until they are completed or
    fail.

    3. **Retrieval & Analysis:** Once a scan is finished, the action retrieves the
    full report, including security scores, network transactions, and screenshot URLs.

    4. **Enrichment & Reporting:** The action updates the entities in Google SecOps
    with enrichment data, marks them as suspicious if the score exceeds the threshold,
    attaches screenshots to the case, and generates insights based on the user's configuration.


    ### Additional Notes

    This action operates asynchronously to accommodate the time required for UrlScan.io
    to complete the security scans.
  ai_short_description: >-
    Submits URL, Domain, and IP Address entities to UrlScan.io for a deep security
    scan and retrieves comprehensive analysis reports to enrich the entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: >-
      Submits a URL to UrlScan.io to initiate a new security scan, creating a scan
      record on the external service.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to UrlScan.io to submit a URL for scanning,
      which mutates external data by initiating a new scan task. It then makes GET
      requests to fetch the scan report (fetches data). It updates internal entities
      with the scan results and creates insights.
