Ping:
  ai_description: >-
    ### General Description

    The Ping action is used to verify the connectivity between Google SecOps and the
    UrlScan.io service. It ensures that the provided API Key is valid and that the
    network configuration allows communication with the UrlScan.io API endpoints.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the 'Api Key' and 'Verify SSL'
    settings from the integration configuration.

    2. **Manager Initialization**: It initializes the `UrlScanManager` with the provided
    credentials.

    3. **Connectivity Test**: The manager executes a GET request to the `user/quotas`
    endpoint of the UrlScan.io API.

    4. **Result Handling**: If the request is successful, the action returns a 'Connection
    Established' message. If the request fails (e.g., due to invalid credentials or
    network issues), it catches the exception and returns a 'Connection Failed' message
    with the specific error details.


    ### Additional Notes

    - This action does not process any entities.

    - It is primarily used for troubleshooting integration setup and credentials.
  ai_short_description: >-
    Verifies connectivity between Google SecOps and the UrlScan.io service by testing
    the provided API credentials.
