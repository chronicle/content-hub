[project]
name = "url_scan_io"
version = "32.0"
description = "urlscan.io is a service to scan and analyse websites."
requires-python = ">=3.11,<3.12"
dependencies = [ "requests==2.32.4", "tipcommon", "tldextract==5.1.2",]

[dependency-groups]
dev = [ "pytest>=9.1.1", "pytest-json-report>=1.5.0", "soar-sdk", "pytest-mock",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.0.10-py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.3-py3-none-any.whl"
