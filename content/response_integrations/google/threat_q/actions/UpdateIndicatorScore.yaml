name: Update Indicator Score
description: Action updates indicator score in ThreatQ
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#update_indicator_score
integration_identifier: ThreatQ
parameters:
-   name: Score
    default_value: 7 - Medium
    type: ddl
    optional_values:
    - 0 - Very Low
    - 1 - Very Low
    - 2 - Very Low
    - 3 - Very Low
    - 4 - Very Low
    - 5 - Low
    - 6 - Low
    - 7 - Medium
    - 8 - Medium
    - 9 - High
    - 10 - Very High
    description: Specify the new score of the indicator.
    is_mandatory: true
-   name: Score Validation
    default_value: Highest Score
    type: ddl
    optional_values:
    - Highest Score
    - Force Update
    description: Specify what kind of score validation should be used. If “ Highest
        Score” is specified, action will compare current values and update the indicator’s
        score only, if the specified score is higher than current generated and manual
        score. If “Force Update” is specified, action will update the indicator's
        score without comparing current values.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/update_indicator_score_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
