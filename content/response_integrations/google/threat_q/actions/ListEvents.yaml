name: List Events
description: List events from ThreatQ.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#list_events
integration_identifier: ThreatQ
parameters:
-   name: Additional Fields
    default_value: adversaries, attachments, attributes, comments, events, indicators,
        signatures, sources, spearphish, tags, type, watchlist
    type: string
    description: 'Specify what additional fields should be included in the response.
        Possible values: adversaries, attachments, attributes, comments, events, indicators,
        signatures, sources, spearphish, tags, type, watchlist.'
    is_mandatory: false
-   name: Sort Field
    default_value: ID
    type: ddl
    optional_values:
    - ID
    - Title
    - Created_At
    - Updated_At
    - Happened_At
    description: Specify what field should be used for sorting events.
    is_mandatory: false
-   name: Sort Direction
    default_value: Ascending
    type: ddl
    optional_values:
    - Ascending
    - Descending
    description: Specify the sorting direction.
    is_mandatory: false
-   name: Max Events To Return
    default_value: 50
    type: string
    description: Specify how many events to return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_events_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
