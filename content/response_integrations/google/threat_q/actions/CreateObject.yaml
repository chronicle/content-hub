name: Create Object
description: Create an object in ThreatQ.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#create_object
integration_identifier: ThreatQ
parameters:
-   name: Object Type
    default_value: Attack Pattern
    type: ddl
    optional_values:
    - Attack Pattern
    - Campaign
    - Course of Action
    - Exploit Target
    - Identity
    - Incident
    - Intrusion Set
    - Malware
    - Report
    - Tool
    - TTP
    - Vulnerability
    description: Specify to which object type attribute should be added.
    is_mandatory: true
-   name: Value
    default_value: ''
    type: string
    description: Specify the value of the new object.
    is_mandatory: true
-   name: Description
    default_value: ''
    type: string
    description: Specify description of the new object.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_object_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
