name: Create Event
description: Create an event in ThreatQ.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#create_event
integration_identifier: ThreatQ
parameters:
-   name: Event Type
    default_value: Spearphish
    type: ddl
    optional_values:
    - Spearphish
    - Watering Hole
    - SQL Injection Attack
    - DoS Attack
    - Malware
    - Watchlist
    - Command and Control
    - Anonymization
    - Exfiltration
    - Host Characteristics
    - Compromised PKI Certificate
    - Login Compromise
    - Incident
    - Sighting
    description: Specify the type of the event.
    is_mandatory: true
-   name: Title
    default_value: ''
    type: string
    description: Specify the title of the event.
    is_mandatory: true
-   name: Happened At
    default_value: ''
    type: string
    description: 'Specify when the event happened. If nothing is entered in this field,
        action will use current time. Format: YYYY-MM-DD hh:mm:ss'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_event_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
