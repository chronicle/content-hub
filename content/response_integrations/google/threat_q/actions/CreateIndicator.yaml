name: Create Indicator
description: Create an indicator in ThreatQ.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#create_indicator
integration_identifier: ThreatQ
parameters:
-   name: Indicator Type
    default_value: ASN
    type: ddl
    optional_values:
    - ASN
    - Binary String
    - CIDR Block
    - CVE
    - Email Address
    - Email Attachment
    - Email Subject
    - File Mapping
    - File Path
    - File Hash
    - File name
    - FQDN
    - Fuzzy Hash
    - GOST Hash
    - Hash ION
    - IPv4 Address
    - IPv6 Address
    - MAC Address
    - MD5
    - Mutex
    - Password
    - Registry Key
    - Service Name
    - SHA-1
    - SHA-256
    - SHA-384
    - SHA-512
    - String
    - x509 Serial
    - x509 Subject
    - URL
    - URL Path
    - User-agent
    - Username
    - X-Mailer
    description: Specify the type of the new indicator.
    is_mandatory: true
-   name: Status
    default_value: Active
    type: ddl
    optional_values:
    - Active
    - Expired
    - Indirect
    - Review
    - Whitelisted
    description: Specify the status of the new indicator.
    is_mandatory: true
-   name: Description
    default_value: ''
    type: string
    description: Specify description of the new indicator.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_indicator_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
