name: List Entity Related Objects
description: Action lists related objects for entities in ThreatQ.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#list_entity_related_objects
integration_identifier: ThreatQ
parameters:
-   name: Related Object Type
    default_value: Adversary
    type: ddl
    optional_values:
    - Adversary
    - Attack Pattern
    - Campaign
    - Course of Action
    - Event
    - Exploit Target
    - File
    - Identity
    - Incident
    - Indicator
    - Intrusion Set
    - Malware
    - Report
    - Signature
    - Task
    - Tool
    - TTP
    - Vulnerability
    description: Specify the type of the related object that needs to be returned.
    is_mandatory: true
-   name: Max Related Objects To Return
    default_value: 50
    type: string
    description: Specify how many related objects to return. Maximum is 1000. This
        is a ThreatQ limitation.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_entity_related_objects_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
