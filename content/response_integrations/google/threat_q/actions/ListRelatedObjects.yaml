name: List Related Objects
description: Action lists related objects in ThreatQ.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#list_related_objects
integration_identifier: ThreatQ
parameters:
-   name: Source Object Type
    default_value: Adversary
    type: ddl
    optional_values:
    - Adversary
    - Attack Pattern
    - Campaign
    - Course of Action
    - Event
    - Exploit Target
    - File
    - Identity
    - Incident
    - Indicator
    - Intrusion Set
    - Malware
    - Report
    - Signature
    - Task
    - Tool
    - TTP
    - Vulnerability
    description: Specify the type of the source object.
    is_mandatory: true
-   name: Source Object Identifier
    default_value: ''
    type: string
    description: Specify identifier of the source object. For example, it can be an
        MD5 hash, title of the event, name of the adversary etc.
    is_mandatory: true
-   name: Source Indicator Type
    default_value: ''
    type: ddl
    optional_values:
    - ASN
    - Binary String
    - CIDR Block
    - CVE
    - Email Address
    - Email Attachment
    - Email Subject
    - File Mapping
    - File Path
    - File name
    - FQDN
    - Fuzzy Hash
    - GOST Hash
    - Hash ION
    - IPv4 Address
    - IPv6 Address
    - MAC Address
    - MD5
    - Mutex
    - Password
    - Registry Key
    - Service Name
    - SHA-1
    - SHA-256
    - SHA-384
    - SHA-512
    - String
    - x509 Serial
    - x509 Subject
    - URL
    - URL Path
    - User-agent
    - Username
    - X-Mailer
    description: Specify the type of the source indicator. This parameter is only
        used, if Source Object Type is Indicator.
    is_mandatory: false
-   name: Related Object Type
    default_value: Adversary
    type: ddl
    optional_values:
    - Adversary
    - Attack Pattern
    - Campaign
    - Course of Action
    - Event
    - Exploit Target
    - File
    - Identity
    - Incident
    - Indicator
    - Intrusion Set
    - Malware
    - Report
    - Signature
    - Task
    - Tool
    - TTP
    - Vulnerability
    description: Specify the type of the related object that needs to be returned.
    is_mandatory: true
-   name: Max Related Objects To Return
    default_value: 50
    type: string
    description: Specify how many related objects to return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_related_objects_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
