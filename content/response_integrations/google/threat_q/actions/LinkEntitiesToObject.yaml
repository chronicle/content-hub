name: Link Entities To Object
description: Action links all of the entities in ThreatQ.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/threatq#link_entities_to_object
integration_identifier: ThreatQ
parameters:
-   name: Object Type
    default_value: Adversary
    type: ddl
    optional_values:
    - Adversary
    - Attack Pattern
    - Campaign
    - Course of Action
    - Event
    - Exploit Target
    - File
    - Identity
    - Incident
    - Indicator
    - Intrusion Set
    - Malware
    - Report
    - Signature
    - Task
    - Tool
    - TTP
    - Vulnerability
    description: Specify the type of the object to which you want to link entities.
    is_mandatory: true
-   name: Object Identifier
    default_value: ''
    type: string
    description: Specify identifier of the object to which you want to link entities.
        For example, it can be an MD5 hash, title of the event, name of the adversary
        etc.
    is_mandatory: true
-   name: Indicator Type
    default_value: ASN
    type: ddl
    optional_values:
    - ASN
    - Binary String
    - CIDR Block
    - CVE
    - Email Address
    - Email Attachment
    - Email Subject
    - File Mapping
    - File Path
    - File name
    - FQDN
    - Fuzzy Hash
    - GOST Hash
    - Hash ION
    - IPv4 Address
    - IPv6 Address
    - MAC Address
    - MD5
    - Mutex
    - Password
    - Registry Key
    - Service Name
    - SHA-1
    - SHA-256
    - SHA-384
    - SHA-512
    - String
    - x509 Serial
    - x509 Subject
    - URL
    - URL Path
    - User-agent
    - Username
    - X-Mailer
    description: Specify the type of the  indicator to which you want to link entities.
        This parameter is only used, if Source Object Type is “Indicator”.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/link_entities_to_object_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["USERUNIQNAME", "CVE", "DestinationURL", "FILEHASH",
    "ADDRESS"]}'
