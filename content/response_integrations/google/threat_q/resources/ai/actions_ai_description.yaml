    1. **Initialization:** The action extracts the integration configuration and the
    user-provided parameters for filtering and sorting.

    2. **Validation:** It validates the `Additional Fields` parameter against a predefined
    list of supported ThreatQ fields to ensure API compatibility.

    3. **API Request:** The action connects to the ThreatQ API and performs a GET
    request to the `/events` endpoint, passing the sorting, limit, and field inclusion
    parameters.

    4. **Data Parsing:** The raw JSON response is parsed into `Event` data models,
    which extract key attributes like ID, Title, and timestamps.

    5. **Output Generation:** The action populates a data table named "ThreatQ Events"
    for the case wall and attaches the full raw JSON results to the action output
    for use in subsequent playbook steps.


