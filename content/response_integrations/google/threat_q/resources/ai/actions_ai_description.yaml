Link Objects:
  ai_description: >-
    ### General Description

    This action links two existing objects within the ThreatQ platform. It allows
    users to establish relationships between various object types such as Adversaries,
    Indicators, Incidents, and Events. By specifying the type and identifier for both
    a source and a destination object, the action creates a pivot/link between them
    in the ThreatQ database.


    ### Flow Description

    1. Extracts the source and destination object details from the action parameters.

    2. Connects to the ThreatQ API to authenticate and obtain an access token.

    3. Queries ThreatQ via a GET request to find the internal ID of the source object
    based on the provided type and identifier.

    4. Queries ThreatQ via a GET request to find the internal ID of the destination
    object based on the provided type and identifier.

    5. Executes a POST request to the ThreatQ linking endpoint to create the relationship
    between the two resolved IDs.

    6. Returns the JSON representation of the newly created link and completes the
    action.


    ### Additional Notes

    - If either the source or destination object is not found, the action will report
    a failure for that specific link attempt.

    - This action does not process entities from the Google SecOps case; it relies
    entirely on the provided manual parameters.
  ai_short_description: >-
    Links two existing objects within the ThreatQ platform by establishing a relationship
    between them based on their types and identifiers.
  capabilities:
    can_create_case_comments: false
