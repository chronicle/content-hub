Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic utility designed to verify the connectivity
    and authentication configuration between Google SecOps and the ThreatQ platform.
    Its primary purpose is to ensure that the integration can successfully communicate
    with the ThreatQ API using the provided credentials.


    ### Flow Description

    1. **Configuration Extraction**: The action retrieves the server address, client
    ID, username, and password from the ThreatQ integration settings.

    2. **Manager Initialization**: It attempts to instantiate the `ThreatQManager`
    class.

    3. **Authentication Attempt**: Upon instantiation, the manager automatically attempts
    to acquire an OAuth2 access token by sending a POST request to the ThreatQ `/api/token`
    endpoint.

    4. **Execution Outcome**: If the token is successfully retrieved, the action completes
    with a 'Connection Established' message. If any error occurs during the connection
    or authentication process, the action fails with a 'Connection Failed' message.


    ### Additional Notes

    - This action does not process any entities and does not have action-specific
    input parameters; it relies entirely on the integration's global configuration.

    - It is typically used during the initial setup or troubleshooting of the ThreatQ
    integration.
