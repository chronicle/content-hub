Link Entities:
  ai_description: "### General Description\nLinks multiple entities together within\
    \ the ThreatQ platform to establish relationships between them. This action identifies\
    \ the corresponding objects in ThreatQ (categorized as indicators, malware, or\
    \ adversaries) and creates a link between every possible pair of the provided\
    \ entities. It is useful for correlating different pieces of evidence or threat\
    \ actors within a single investigation context in ThreatQ.\n\n### Flow Description\n\
    1.  **Initialization**: Connects to the ThreatQ API using the provided integration\
    \ credentials.\n2.  **Entity Identification**: Iterates through all target entities\
    \ in the scope and queries ThreatQ to find their internal IDs. It checks for matches\
    \ in the Indicators, Malware, and Adversaries modules based on the entity type.\n\
    3.  **Pairing**: Generates all unique combinations of pairs (combinations of 2)\
    \ from the collected ThreatQ object IDs.\n4.  **Linking**: For each pair, sends\
    \ a POST request to the ThreatQ API to create a relationship link between the\
    \ two objects.\n5.  **Result Reporting**: Compiles a list of successfully linked\
    \ entities and returns a summary message along with the raw JSON results of the\
    \ linking operations.\n\n### Additional Notes\n*   The action requires at least\
    \ two valid entities to perform any linking operations.\n*   Entities are matched\
    \ against ThreatQ objects based on their type: \n    *   `ADDRESS`, `CVE`, `URL`,\
    \ `FILEHASH`, and `USER` (or email patterns) are checked as **Indicators**.\n\
    \    *   `FILEHASH` entities are also checked as **Malware**.\n    *   `USER`\
    \ entities are also checked as **Adversaries**.\n*   If an entity exists in ThreatQ\
    \ under multiple categories (e.g., both as an indicator and malware), all corresponding\
    \ IDs are collected for linking."
