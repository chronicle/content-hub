Create Event:
  ai_description: >-
    ### General Description

    The **Create Event** action enables the creation of a new event record within
    the ThreatQ platform. This action is used to log specific security occurrences,
    such as spearphishing attempts or malware sightings, directly into the threat
    intelligence repository for further analysis and tracking.


    ### Flow Description

    1. **Initialization**: The action extracts the necessary configuration and user-provided
    parameters (Event Type, Title, Happened At).

    2. **Time Formatting**: If the **Happened At** parameter is empty, the current
    UTC time is generated. If provided, the format is validated.

    3. **API Request**: The action establishes a session with ThreatQ and sends a
    POST request to the `/events` endpoint containing the event details.

    4. **Output**: Upon success, the action returns the full JSON object of the created
    event and marks the execution as completed.


    ### Additional Notes

    - The action performs a strict format validation on the **Happened At** parameter
    to ensure compatibility with the ThreatQ API.

    - This action does not operate on entities within the Google SecOps environment;
    it relies entirely on the provided input parameters.
