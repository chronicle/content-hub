Update Indicator Status:
  ai_description: >-
    ### General Description

    The **Update Indicator Status** action allows users to modify the lifecycle status
    of indicators within the ThreatQ platform. This action is essential for operationalizing
    threat intelligence, enabling security teams to transition indicators through
    various stages such as 'Active', 'Review', or 'Whitelisted' based on their investigation
    findings.


    ### Flow Description

    1. **Initialization**: The action initializes the ThreatQ manager using the provided
    server address and credentials.

    2. **Indicator Identification**: For each entity in the current scope, the action
    first queries the ThreatQ API (via a GET request) to retrieve the unique internal
    ID associated with that indicator's value.

    3. **Status Update**: Once the ID is retrieved, the action sends a `PUT` request
    to the ThreatQ `/indicators/{id}` endpoint, passing the mapped status ID corresponding
    to the user's selection.

    4. **Result Aggregation**: The action collects the updated indicator metadata
    returned by the API and stores it as a JSON result, then generates a summary message
    detailing which indicators were successfully updated and which failed.


    ### Additional Notes

    - This action requires the indicator to already exist in ThreatQ. It does not
    create new indicators; it only updates existing ones.

    - The mapping between the status name (e.g., 'Active') and the internal ThreatQ
    status ID is handled automatically by the integration logic.
  ai_short_description: >-
    Updates the lifecycle status of an indicator within the ThreatQ platform.
