List Entity Related Objects:
  ai_description: >-
    ### General Description

    This action retrieves and lists objects related to specific entities within the
    ThreatQ platform. It allows security analysts to pivot from a known indicator
    to discover associated threat intelligence such as Adversaries, Campaigns, Malware,
    or TTPs. The retrieved data is used to enrich the entities in Google SecOps, providing
    deeper context for investigations.


    ### Flow Description

    1. **Authentication**: The action establishes a session with the ThreatQ API using
    the configured integration parameters.

    2. **Entity Processing**: It iterates through all target entities provided in
    the current context.

    3. **ID Retrieval**: For each entity, it queries ThreatQ to find the internal
    indicator ID associated with the entity's identifier.

    4. **Relationship Query**: Using the indicator ID, it fetches a list of related
    objects filtered by the user-defined 'Related Object Type' and 'Max Related Objects
    To Return' limit via a GET request to the ThreatQ API.

    5. **Data Enrichment**: If related objects are found, the action adds the related
    object details to the entity's `additional_properties` (prefixed with 'TQ'), sets
    the entity's `is_enriched` flag to true, and creates an entity-specific data table
    containing the related object details.

    6. **Final Update**: Updates all successfully enriched entities in Google SecOps
    and provides a summary message of the results.


    ### Additional Notes

    - The action performs a 'Read-Only' operation against ThreatQ; it does not create
    or modify any data in the external platform.

    - If no related objects are found for an entity, the action will report it as
    failed for that specific entity but continue processing others.
  ai_short_description: >-
    Retrieves and lists objects related to specific entities within the ThreatQ platform
