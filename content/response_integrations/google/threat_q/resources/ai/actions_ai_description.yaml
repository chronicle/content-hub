Link Entities To Object:
  ai_description: >-
    ### General Description

    Links entities within the Google SecOps context to a specific target object in
    the ThreatQ platform. This action is used to establish relationships between indicators
    (IPs, Hashes, URLs, etc.) and higher-level objects like Adversaries, Campaigns,
    or Incidents, facilitating better threat intelligence mapping.


    ### Flow Description

    1. **Authentication**: Connects to the ThreatQ API using provided credentials.

    2. **Target Identification**: Retrieves the internal ThreatQ ID for the target
    object specified by the 'Object Type' and 'Object Identifier'.

    3. **Entity Resolution**: Iterates through the target entities in the case. For
    each suitable entity, it queries ThreatQ to find its corresponding internal ID
    (as an indicator, malware, or adversary).

    4. **Relationship Creation**: For every successfully resolved entity ID, the action
    sends a POST request to ThreatQ to create a link between the target object and
    the entity.

    5. **Reporting**: Aggregates the results, listing which entities were successfully
    linked and which could not be found or linked, and returns the data as a JSON
    result.


    ### Additional Notes

    - The action supports linking entities as 'indicators', 'malware', or 'adversaries'
    depending on the entity type and whether a corresponding record exists in ThreatQ.

    - If an entity is a File Hash, the action attempts to link it both as an indicator
    and as a malware object.

    - If an entity is a User, the action attempts to link it both as an indicator
    and as an adversary.
