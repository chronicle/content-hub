Enrich URL:
  ai_description: >-
    ### General Description

    Enriches URL entities by retrieving threat intelligence data from ThreatQ. This
    action provides deep context for URLs, including indicator scores, status, attributes,
    comments, and sources, helping analysts determine the risk level of a specific
    web address.


    ### Flow Description

    1. **Filter Entities:** The action identifies all URL entities in the current
    scope.

    2. **ThreatQ Query:** For each URL, it performs a query against the ThreatQ `indicators/query`
    API endpoint to retrieve matching indicator data.

    3. **Risk Evaluation:** It compares the retrieved indicator score against the
    `Score Threshold`. It also checks the indicator's status (e.g., Whitelisted).

    4. **Entity Update:** If the score exceeds the threshold (and considering the
    whitelist logic), the entity is marked as `suspicious`. The entity is also marked
    as `enriched`.

    5. **Property Mapping:** ThreatQ indicator details are flattened and added to
    the entity's `additional_properties`.

    6. **Table Generation:** If requested via parameters, the action constructs CSV
    tables for Comments, Attributes, and Sources and attaches them to the entity results.

    7. **Commit Changes:** The action updates the entities in Google SecOps with the
    new metadata and status.


    ### Additional Notes

    - The `Score Threshold` parameter is automatically clamped to a range between
