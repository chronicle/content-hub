  ai_description: >-
    ### General Description

    Enriches email address entities using Threat Intelligence from ThreatQ. This action
    retrieves comprehensive metadata about an email indicator, including its reputation
    score, status, associated attributes, sources, and comments. It helps analysts
    determine the risk level of an email address by comparing its ThreatQ score against
    a configurable threshold and updating the entity's status within Google SecOps.


    ### Flow Description

    1. **Initialization**: Retrieves integration configuration and action parameters
    (Thresholds, Display toggles).

    2. **Entity Filtering**: Iterates through all target entities in the scope and
    filters for those matching the email address format using a regex check on the
    identifier.

    3. **Data Retrieval**: For each valid email entity, queries the ThreatQ API via
    the `ThreatQManager` (`indicators/query` endpoint) to fetch the corresponding
    indicator object and its related metadata.

    4. **Risk Assessment**: Compares the indicator's score from ThreatQ against the
    user-defined `Score Threshold`.

    5. **Suspicion Logic**: Marks the entity as suspicious if the score is above the
    threshold, while also respecting the `Mark Whitelisted Entities As Suspicious`
    override logic.

    6. **Enrichment**: Updates the entity's `additional_properties` with flattened
    ThreatQ data (prefixed with 'TQ') and sets the `is_enriched` flag to true.

    7. **Reporting**: Constructs and adds data tables for Comments, Attributes, and
    Sources to the entity's result set if the respective parameters are enabled.

    8. **Finalization**: Updates all processed entities in Google SecOps and returns
    a JSON result containing the raw data from ThreatQ.


