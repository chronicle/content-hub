Get Indicator Details:
  ai_description: >-
    ### General Description

    This action searches for entities in ThreatQ and retrieves detailed indicator
    information. It is designed to provide security analysts with comprehensive context
    about indicators of compromise (IOCs) stored within the ThreatQ threat intelligence
    platform. The action fetches data such as indicator scores, status, attributes,
    sources, and comments, and then enriches the corresponding entities within Google
    SecOps.


    ### Flow Description

    1. **Authentication**: The action initializes the ThreatQ manager using the integration's
    configuration parameters to obtain an API token.

    2. **Entity Iteration**: It iterates through all target entities provided in the
    Google SecOps context.

    3. **ID Retrieval**: For each entity, it queries the ThreatQ `/indicators` endpoint
    using the entity's identifier to find its internal ThreatQ ID.

    4. **Detail Fetching**: Using the retrieved ID, it makes a GET request to the
    `/indicators/{id}/details` endpoint to fetch comprehensive metadata.

    5. **Data Processing**: The retrieved JSON data is parsed into an internal data
    model.

    6. **Enrichment**: The action updates the entity in Google SecOps, attaches a
    detailed CSV-formatted data table to the entity, and adds the raw JSON result
    to the action output.


    ### Additional Notes

    * The action processes all entities in the current scope without filtering by
    type.

    * It performs a two-step lookup: first, it retrieves the internal ThreatQ ID for
    the entity identifier, and then it fetches the full details using that ID.

    * If an entity is not found in ThreatQ, the action will report a failure for that
    specific entity but continue processing others.
