Update Indicator Score:
  ai_description: >-
    ### General Description

    Updates the manual score of indicators in the ThreatQ platform for the provided
    entities. This action allows security analysts to adjust the threat level of specific
    indicators based on new intelligence or internal policies, with optional validation
    logic to ensure scores are only increased.


    ### Flow Description

    1. **Authentication**: Establishes a connection to the ThreatQ instance using
    provided credentials.

    2. **Entity Processing**: Iterates through each target entity provided in the
    Google SecOps context.

    3. **ID Retrieval**: Queries ThreatQ to find the unique internal ID associated
    with the entity's identifier.

    4. **Score Comparison**: Fetches the current manual and generated scores for the
    indicator from ThreatQ.

    5. **Validation**: Evaluates the 'Score Validation' logic. If 'Highest Score'
    is chosen, it compares the input score against existing values.

    6. **Update**: Executes a PUT request to the ThreatQ API to update the indicator's
    manual score.

    7. **Result Aggregation**: Collects the updated indicator data and returns it
    as a JSON result for each successful entity.


    ### Additional Notes

    - The action interacts with the ThreatQ API to retrieve current indicator metadata
    before applying updates when 'Highest Score' validation is selected.

    - If 'Highest Score' is selected and the provided score is lower than or equal
    to the existing score, the action will report a failure for that specific entity.
  ai_short_description: >-
    Updates the manual score of indicators in the ThreatQ platform for the provided
    entities.
