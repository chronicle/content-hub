Create Adversary:
  ai_description: >-
    ### General Description

    Creates an adversary record in ThreatQ for each provided User entity. This action
    uses the entity's identifier as the name for the new adversary in the ThreatQ
    platform. Upon successful creation, the action retrieves the adversary's metadata
    (such as ID and timestamps) and enriches the entity in Google SecOps by updating
    its additional properties with this information.


    ### Flow Description

    1. **Initialization**: Extracts connection details from the integration configuration
    and identifies all `USER` entities in the current scope.

    2. **Authentication**: Establishes a session with the ThreatQ server and retrieves
    an access token.

    3. **Adversary Creation**: Iterates through the identified User entities and sends
    a POST request to the ThreatQ `/adversaries` endpoint to create a new record.

    4. **Internal Enrichment**: For every successfully created adversary, the action
    parses the response data and updates the corresponding SecOps entity's additional
    properties with prefixed ThreatQ metadata.

    5. **Finalization**: Updates the entities in the SecOps case and provides a summary
    message of successful and failed creations.


    ### Additional Notes

    * This action requires valid integration configuration (Server Address, Client
    ID, Username, and Password) to authenticate with the ThreatQ API.

    * It specifically targets entities of type `USER`.
