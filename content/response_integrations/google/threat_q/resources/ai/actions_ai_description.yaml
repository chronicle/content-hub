Create Indicator:
  ai_description: >-
    ### General Description

    The **Create Indicator** action allows users to create new threat indicators within
    the ThreatQ platform based on entities identified in Google SecOps. This action
    is primarily used for operationalizing threat intelligence by pushing local observations
    into a centralized Threat Intelligence Platform (TIP).


    ### Flow Description

    1. **Initialization**: The action retrieves connection details and action parameters
    (Indicator Type, Status, Description).

    2. **Manager Setup**: It establishes a session with the ThreatQ API and obtains
    an authentication token.

    3. **Entity Processing**: The action iterates through all target entities provided
    in the scope.

    4. **Type Resolution**: For each entity, it maps the provided 'Indicator Type'
    to the corresponding ThreatQ ID. If 'File Hash' is used, it performs length-based
    validation to identify the specific hash type.

    5. **API Interaction**: It sends a POST request to the ThreatQ `/api/indicators`
    endpoint to create the record.

    6. **Internal Enrichment**: Upon successful creation, the action retrieves the
    indicator details from the API response and updates the entity's `additional_properties`
    in Google SecOps with the new data (prefixed with 'TQ').

    7. **Finalization**: The action reports the list of successfully created indicators
    and any failures, returning a boolean success status and the raw JSON data of
    the created objects.


    ### Additional Notes

    - If 'File Hash' is selected as the Indicator Type, the action automatically detects
    the specific hash algorithm (MD5, SHA-1, SHA-256, etc.) based on the string length.
  ai_short_description: >-
    Creates new threat indicators within the ThreatQ platform based on entities identified
    in Google SecOps.
