Add Attribute:
  ai_description: >-
    ### General Description

    Adds a specific attribute to an existing object in ThreatQ. This action allows
    users to enrich ThreatQ objects (such as Adversaries, Indicators, Malware, or
    Events) with custom metadata, tags, or properties directly from Google SecOps.


    ### Flow Description

    1. **Authentication**: Connects to the ThreatQ instance using the provided credentials.

    2. **Object Resolution**: Searches for the target object in ThreatQ using the
    'Object Type' and 'Object Identifier' to retrieve its internal ThreatQ ID.

    3. **Attribute Creation**: Sends a POST request to the ThreatQ API to create and
    attach the specified attribute (name, value, and optional source) to the identified
    object.

    4. **Result Handling**: Returns the JSON representation of the newly created attribute
    and confirms success in the action output.


    ### Additional Notes

    If the 'Object Type' is set to 'Indicator', the 'Indicator Type' parameter must
    be provided to accurately resolve the object.
  ai_short_description: >-
    Adds a specific attribute to an existing object in ThreatQ.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a new attribute to a specified object in ThreatQ.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the ThreatQ API to add an attribute to a
      specific object, which mutates external data. It does not fetch contextual data
      for enrichment, nor does it mutate internal SecOps data, update entities, or
      create insights.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
