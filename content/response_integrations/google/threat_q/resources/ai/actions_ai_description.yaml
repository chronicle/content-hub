Add Source:
  ai_description: >-
    ### General Description

    Adds a source to a specific object within the ThreatQ platform. This action allows
    users to associate a source name with various ThreatQ object types, such as Adversaries,
    Indicators, Events, Campaigns, and more, to track the origin of threat intelligence
    data.


    ### Flow Description

    1. Extracts the object type, identifier, indicator type (if applicable), and the
    source name from the action parameters.

    2. Initializes the `ThreatQManager` to handle API communication with the ThreatQ
    server.

    3. Calls the ThreatQ API to resolve the internal unique ID of the object based
    on the provided Object Type and Object Identifier.

    4. Executes a POST request to the ThreatQ endpoint `/{object_type}/{object_id}/sources`
    to add the specified Source Name.

    5. Returns the updated object data in JSON format and reports the success or failure
    of the operation.


    ### Additional Notes

    - If the Object Type is 'Indicator', the Indicator Type parameter should be provided
    to ensure the correct object is identified in ThreatQ.

    - The action first attempts to find the internal ID of the object before performing
    the update.
