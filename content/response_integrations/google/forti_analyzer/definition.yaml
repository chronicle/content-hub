identifier: FortiAnalyzer
name: FortiAnalyzer
parameters:
-   name: API Root
    default_value: https://{ip_address}
    type: string
    description: API root of the FortiAnalyzer instance.
    is_mandatory: true
    integration_identifier: FortiAnalyzer
-   name: Username
    default_value: ''
    type: string
    description: Username of the FortiAnalyzer account.
    is_mandatory: true
    integration_identifier: FortiAnalyzer
-   name: Password
    default_value: ''
    type: password
    description: Password of the FortiAnalyzer account.
    is_mandatory: true
    integration_identifier: FortiAnalyzer
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        FortiAnalyzer is valid.
    is_mandatory: true
    integration_identifier: FortiAnalyzer
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/fortianalyzer
categories:
- Network Security
svg_logo_path: resources/logo.svg
image_path: resources/image.png
