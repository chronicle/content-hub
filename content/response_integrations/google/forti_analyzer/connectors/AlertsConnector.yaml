name: FortiAnalyzer - Alerts Connector
parameters:
-   name: DeviceProductField
    default_value: siemplify_type
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: eventtype
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field through regex logic.
        If the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://{ip address}
    type: string
    description: API root of the FortiAnalyzer instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Username
    default_value: ''
    type: string
    description: Username of the FortiAnalyzer account.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Password
    default_value: ''
    type: password
    description: Password of the FortiAnalyzer account.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verifies that the SSL certificate for the connection
        to the FortiAnalyzer server is valid.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Lowest Severity To Fetch
    default_value: Medium
    type: string
    description: 'The lowest severity that needs to be used to fetch alerts. Possible
        values: low, medium, high, critical. If nothing is specified, the connector
        ingests alerts with all severities.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: Number of hours before the first connector iteration to retrieve
        alerts from. This parameter applies to the initial connector iteration after
        you enable the connector for the first time, or used as a fallback value in
        cases where connector's last run timestamp expires.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Alerts To Fetch
    default_value: 20
    type: integer
    description: 'Number of alerts to process per one connector iteration. Default:
        20.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Use dynamic list as a blacklist
    default_value: false
    type: boolean
    description: If enabled, the dynamic list is used as a blacklist.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: 'Pull information about alerts from FortiAnalyzer. Note: Dynamic list
    filter works with the "subject" parameter.'
integration: FortiAnalyzer
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/fortianalyzer#alerts-connector
rules: []
is_connector_rules_supported: false
creator: admin
