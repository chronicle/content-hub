name: Search Logs
description: 'Search logs in FortiAnalyzer. Note: Action is running as async, adjust
    the script timeout value in Siemplify IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/fortianalyzer#search_logs
integration_identifier: FortiAnalyzer
parameters:
-   name: Log Type
    default_value: Traffic
    type: ddl
    optional_values:
    - Traffic
    - App Control
    - Attack
    - Content
    - DLP
    - Email Filter
    - Event
    - History
    - Virus
    - VOIP
    - Web Filter
    - Netscan
    - FCT Event
    - FCT Traffic
    - WAF
    - GTP
    description: Specify the log type that needs to be searched.
    is_mandatory: false
-   name: Case Sensitive Filter
    default_value: false
    type: boolean
    description: If enabled, the filter is case sensitive.
    is_mandatory: false
-   name: Query Filter
    default_value: ''
    type: string
    description: Specify the query filter for the search.
    is_mandatory: false
-   name: Device ID
    default_value: All_Fortigate
    type: string
    description: 'Specify the ID of the device that needs to be searched. If nothing
        is provided, the action searches in All_Fortigate. Examples of values: All_FortiGate,
        All_FortiMail, All_FortiWeb, All_FortiManager, All_Syslog, All_FortiClient,
        All_FortiCache, All_FortiProxy, All_FortiAnalyzer, All_FortiSandbox, All_FortiAuthenticator,
        All_FortiDDoS.'
    is_mandatory: false
-   name: Time Frame
    default_value: Last Month
    type: ddl
    optional_values:
    - Last Hour
    - Last 6 Hours
    - Last 24 Hours
    - Last Week
    - Last Month
    - Custom
    description: Specify a time frame for the results. If "Custom" is selected, you
        also need to provide the "Start Time" parameter.
    is_mandatory: false
-   name: Start Time
    default_value: ''
    type: string
    description: 'Specify the start time for the results. This parameter is mandatory,
        if "Custom" is selected for the "Time Frame" parameter. Format: ISO 8601'
    is_mandatory: false
-   name: End Time
    default_value: ''
    type: string
    description: 'Specify the end time for the results. Format: ISO 8601. If nothing
        is provided and "Custom" is selected for the "Time Frame" parameter then this
        parameter uses current time.'
    is_mandatory: false
-   name: Time Order
    default_value: DESC
    type: ddl
    optional_values:
    - DESC
    - ASC
    description: Specify the time ordering in the search.
    is_mandatory: false
-   name: Max Logs To Return
    default_value: 20
    type: string
    description: 'Specify the number of logs you want to return. Default: 20. Maximum:
        1000.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/search_logs_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
