name: Update Alert
description: Update an alert in FortiAnalyzer.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/fortianalyzer#update_alert
integration_identifier: FortiAnalyzer
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: Specify the ID of the alert that needs to be updated.
    is_mandatory: true
-   name: Acknowledge Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Acknowledge
    - Unacknowledge
    description: Specify the acknowledgment status for alert.
    is_mandatory: false
-   name: Mark As Read
    default_value: false
    type: boolean
    description: If enabled, the action marks the alert as read.
    is_mandatory: false
-   name: Assign To
    default_value: ''
    type: string
    description: Specify to whom the alert needs to be assigned.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
