Add Comment To Alert:
  ai_description: >-
    ### General Description

    The **Add Comment To Alert** action allows users to append a comment to a specific
    alert within a FortiAnalyzer instance. This is useful for documenting investigation
    steps, providing context, or updating the status of an alert directly from Google
    SecOps.


    ### Flow Description

    1. **Initialization**: The action extracts the necessary configuration and action
    parameters (Alert ID and Comment).

    2. **Authentication**: Establishes a session with the FortiAnalyzer API.

    3. **Alert Lookup**: The action searches for the alert using the provided `Alert
    ID` via an API request to retrieve its metadata, specifically the Administrative
    Domain (ADOM) it belongs to.

    4. **Comment Submission**: Once the ADOM is identified, the action sends an update
    request (POST) to the FortiAnalyzer API to add the specified comment to the alert.

    5. **Result Handling**: The action returns the API response as a JSON result and
    provides a success message upon completion.


    ### Additional Notes

    - This action requires the `Alert ID` to exist in FortiAnalyzer. If the alert
    is not found, the action will fail.

    - The comment is added to the external FortiAnalyzer system and does not automatically
    create a comment within the Google SecOps case wall unless explicitly configured
    in a playbook.
  ai_short_description: >-
    Appends a comment to a specific alert within a FortiAnalyzer instance.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a comment to a specific alert in the external FortiAnalyzer system.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to FortiAnalyzer to add a comment to an alert,
      which mutates external data (can_mutate_external_data=true). It does not fetch
      contextual data for enrichment, nor does it mutate internal SecOps data, update
      entities, create insights, modify internal alert data, or create case comments.
