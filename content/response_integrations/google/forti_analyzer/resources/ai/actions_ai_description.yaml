Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic utility designed to verify the connectivity
    between Google SecOps and the FortiAnalyzer server. It ensures that the provided
    integration configuration parameters (API Root, Username, Password, and SSL settings)
    are correct and that the network path is open.


    ### Flow Description

    1. **Configuration Retrieval**: The action extracts the integration configuration
    settings.

    2. **Authentication**: It attempts to log in to the FortiAnalyzer server via the
    `/jsonrpc` endpoint to obtain a session ID.

    3. **Connectivity Test**: Once authenticated, it executes a lightweight API call
    (requesting a single alert from `/eventmgmt/alerts`) to confirm that the session
    is valid and the user has sufficient permissions.

    4. **Session Termination**: Regardless of the test result, the action attempts
    to log out and close the session to prevent resource leakage on the FortiAnalyzer
    server.

    5. **Result Reporting**: The action returns a success message if all steps complete
    without error, or a failure message detailing the exception encountered.


    ### Additional Notes

    * This action is typically used during the initial setup of the integration or
    for troubleshooting connection issues.

    * It performs a full authentication cycle (login, test request, and logout) to
    ensure the session management is functioning correctly.
  ai_short_description: >-
    Verifies connectivity between Google SecOps and the FortiAnalyzer server using
    the provided integration configuration parameters.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
