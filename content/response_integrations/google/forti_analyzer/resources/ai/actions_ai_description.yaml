Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities with device information retrieved from
    FortiAnalyzer. This action connects to a FortiAnalyzer instance to fetch metadata
    such as OS version, platform type, serial number, and connection status for the
    target entities. The retrieved data is then mapped to the entity's additional
    properties and displayed in a structured data table within the case.


    ### Flow Description

    1. **Initialization**: The action extracts connection parameters and filters the
    target entities to identify supported types (ADDRESS and HOSTNAME).

    2. **Authentication**: It establishes a session with FortiAnalyzer using the provided
    credentials.

    3. **Data Retrieval**: For each supported entity, the action queries the FortiAnalyzer
    device database (`/dvmdb/device`) using the IP address or Hostname as a filter
    via a POST request.

    4. **Enrichment**: If a matching device is found, the action updates the entity's
    additional properties with a prefix 'FortiAn', marks the entity as enriched, and
    adds a detailed CSV-formatted data table to the entity in the SOAR interface.

    5. **Finalization**: The action updates the modified entities in the system, logs
    out of the FortiAnalyzer session, and returns a summary of successful and failed
    enrichments.


    ### Additional Notes

    - Supported entity types are Hostname and IP Address.
  ai_short_description: >-
    Enriches Hostname and IP Address entities with device information retrieved from
    FortiAnalyzer, mapping metadata such as OS version and platform type to the entity's
    additional properties.
