Search Logs:
  ai_description: >-
    ### General Description

    Searches for logs in FortiAnalyzer based on specified criteria such as log type,
    time frame, and custom query filters. This action operates asynchronously, meaning
    it initiates a search task and polls for completion before retrieving the results.
    It is designed for broad log discovery and does not target specific entities within
    a case.


    ### Flow Description

    1. **Initialization**: The action extracts configuration details and user-provided
    search parameters.

    2. **Task Creation (First Run)**: On the initial execution, the action calculates
    the required timestamps and sends a POST request to the FortiAnalyzer API (`/logview/adom/root/logsearch`)
    to create a new log search task.

    3. **Async Polling**: The action enters an asynchronous state, storing the task
    ID. In subsequent runs, it polls the FortiAnalyzer API (`/logview/adom/root/logsearch/{task_id}`)
    to check the progress of the search task.

    4. **Data Retrieval**: Once the search task progress reaches 100%, the action
    retrieves the resulting logs up to the specified 'Max Logs To Return' limit.

    5. **Output**: The retrieved logs are formatted as a JSON result and the action
    execution is completed.


    ### Additional Notes

    * **Asynchronous Execution**: This action is marked as async. It will return an
    'In Progress' status while the FortiAnalyzer server processes the search task.
    Ensure the script timeout in the IDE is adjusted if searching large volumes of
    data.

    * **Custom Time Frame**: Either a predefined 'Time Frame' must be selected, or
    'Custom' must be selected with a valid 'Start Time'.
  ai_short_description: >-
    Searches for logs in FortiAnalyzer based on specified criteria such as log type,
    time frame, and custom query filters, returning the results as JSON.
