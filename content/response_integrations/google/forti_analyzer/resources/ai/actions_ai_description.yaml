Update Alert:
  ai_description: >-
    ### General Description

    Updates the status and metadata of a specific alert within FortiAnalyzer. This
    action allows for acknowledging or unacknowledging alerts, marking them as read,
    and assigning them to specific users. It requires the Alert ID and at least one
    modification parameter to be configured.


    ### Flow Description

    1. Extracts the Alert ID and the desired update values (Acknowledge Status, Mark
    As Read, Assign To) from the action parameters.

    2. Validates that at least one update parameter is provided; otherwise, the action
    fails early.

    3. Queries FortiAnalyzer to find the alert by ID. This step is necessary to retrieve
    the alert's ADOM, which is required for the update endpoints.

    4. Executes the requested updates:
       - If 'Acknowledge Status' is provided, it calls the acknowledgment endpoint.
       - If 'Mark As Read' is true, it calls the read-status endpoint.
       - If 'Assign To' is provided, it calls the assignment endpoint.
    5. Fetches the updated alert object from FortiAnalyzer to provide the most current
    state in the action's JSON result.


    ### Additional Notes

    - At least one of the following parameters must be provided/changed for the action
    to execute: 'Acknowledge Status', 'Mark As Read', or 'Assign To'.

    - The action automatically identifies the Administrative Domain (ADOM) associated
    with the alert before applying updates.
