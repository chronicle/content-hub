    internal_data_mutation_explanation: null
    reasoning: >-
      The action performs a test scan against a hardcoded IP address (8.8.8.8) to
      verify connectivity to the BulkWhoIs API. It does not fetch contextual data
      for case entities, mutate external or internal data, update entities, or create
      insights.
