WhoIs Details:
  ai_description: >-
    ### General Description

    Enriches URL, Hostname, and IP Address entities by retrieving Whois information
    from BulkWhoIs.


    ### Flow Description

    1. Iterates through the target entities associated with the case.

    2. Filters the entities to process only URLs, external Hostnames, and IP Addresses.

    3. Extracts the relevant domain or IP address to scan from the entity identifier.

    4. Makes an API call (POST request) to the BulkWhoIs service (`http://api.bulk-whois-api.com/api/query`)
    to retrieve Whois details for the extracted indicator.

    5. If the query is successful, enriches the entity with the retrieved Whois data,
    marks it as enriched, and attaches an entity table with the parsed results.

    6. Updates the entities in the Google SecOps platform and returns a JSON result
    containing the enrichment data.


    ### Additional Notes

    Internal hostnames are explicitly skipped during the filtering process.
  ai_short_description: >-
    Enriches URL, Hostname, and IP Address entities by retrieving Whois information
    from BulkWhoIs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the BulkWhoIs API via a POST request (which acts
      as a query in this context). It does not mutate external data. It updates the
      entities in Google SecOps with the retrieved enrichment data using `siemplify.update_entities`.
      It does not create insights, modify alert data, or create case comments.
