Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the BulkWhoIs service by performing a test scan on a known
    IP address.


    ### Flow Description

    1. Initializes the BulkWhoIs manager with the provided API key and secret key.

    2. Executes a test scan against the IP address 8.8.8.8 via a POST request to the
    BulkWhoIs API (`http://api.bulk-whois-api.com/api/query`).

    3. Evaluates the response to determine if the connection was successful.

    4. Returns a success or failure message based on the connectivity test.


    ### Additional Notes

    This action is typically used to verify integration configuration and credentials.
  ai_short_description: >-
    Tests connectivity to the BulkWhoIs service by performing a test scan on a known
    IP address.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
