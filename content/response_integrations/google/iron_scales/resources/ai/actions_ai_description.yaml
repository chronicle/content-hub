Classify Incident:
  ai_description: >-
    ### General Description

    Changes the classification of specified incidents in IronScales.


    ### Flow Description

    1. Extracts the provided incident IDs, new classification, and classifying user
    email.

    2. Iterates over the list of incident IDs.

    3. Makes a GET request to the IronScales API to fetch the current details of each
    incident in order to retrieve its previous classification.

    4. Makes a POST request to the IronScales API to update the incident with the
    new classification.

    5. Compiles and returns a summary message detailing which incidents were successfully
    classified and which failed.


    ### Additional Notes

    The email address provided in the 'Classifying User Email' parameter must be recognized
    by IronScales for the classification to succeed.
  ai_short_description: >-
    Changes the classification of specified incidents in IronScales.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the classification of specified incidents in the IronScales platform.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to fetch incident details (fetches_data=true)
      to obtain the previous classification, and then makes a POST request to update
      the classification in IronScales (can_mutate_external_data=true). It does not
      mutate internal SecOps data, update entities, or create insights/comments.
