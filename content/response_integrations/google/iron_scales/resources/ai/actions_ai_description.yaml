Get Incident Details:
  ai_description: >-
    ### General Description

    Retrieves full incident details from IronScales for a specified list of incident
    IDs. This action is useful for gathering additional context about specific incidents
    directly from the IronScales platform.


    ### Flow Description

    1. Extracts the comma-separated list of incident IDs provided in the input parameters.

    2. Iterates through each incident ID.

    3. Makes a GET request to the IronScales API (`appapi/incident/{company_id}/details/{incident_id}`)
    to fetch the details for each incident.

    4. Aggregates the successfully retrieved incident details and attaches them to
    the action's JSON result.


    ### Additional Notes

    If an incident ID is not found or an error occurs during retrieval, the action
    logs the error and continues processing the remaining IDs.
