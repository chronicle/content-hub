Get Url Status:
  ai_description: >-
    ### General Description

    Retrieves the current status of URL entities using the Phishing Initiative API
    to determine if they are associated with phishing campaigns.


    ### Flow Description

    1. Iterates through the target entities and filters for URL entities.

    2. For each URL, makes a GET request to the Phishing Initiative API (`/api/v1/urls/lookup/`)
    to fetch its status.

    3. Evaluates the returned status tag. If the URL has been submitted and analyzed,
    it updates the entity's additional properties with the status and marks it as
    enriched.

    4. If the status specifically indicates "phishing", the entity is marked as suspicious.

    5. Updates the enriched entities within the Google SecOps platform and attaches
    the raw API response as a JSON result.


    ### Additional Notes

    The action returns a result value of "true" if at least one URL is identified
    as phishing, otherwise it returns "false".
  ai_short_description: >-
    Retrieves the current status of URL entities using the Phishing Initiative API
    to determine if they are associated with phishing campaigns, updating the entities'
    suspicious status and additional properties accordingly.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a GET request to the Phishing Initiative API
      to retrieve URL information. It does not mutate external data or internal system
      data. It updates entities by calling `siemplify.update_entities` to save the
      enrichment status and suspicious flags. It does not create insights, modify
      alert data, or create case comments.
