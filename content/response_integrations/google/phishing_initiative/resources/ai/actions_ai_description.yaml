Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Phishing Initiative API to ensure the integration is
    configured correctly.


    ### Flow Description

    1. Retrieves the API Root and API Token from the integration configuration.

    2. Initializes the Phishing Initiative manager.

    3. Makes an HTTP GET request to the Phishing Initiative API (`/api/v1/urls/lookup/`)
    using a dummy URL (`http://www.antiphishing.org/`).

    4. Evaluates the response and outputs a success message if the connection is established.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to verify credentials and
    network access to the Phishing Initiative service.
  ai_short_description: >-
    Tests connectivity to the Phishing Initiative API by attempting to retrieve information
    for a dummy URL.
