Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the HaveIBeenPwned API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Retrieves the API key and SSL verification settings from the integration configuration.

    2. Initializes the HaveIBeenPwnedManager with the provided credentials.

    3. Executes a test connectivity request to the HaveIBeenPwned API by querying
    breaches for a hardcoded test email address (`test@gmail.com`).

    4. Returns a success message and a true result if the connection is successfully
    established.


    ### Additional Notes

    This action does not process any alerts or entities. It is strictly used for diagnostic
    purposes to verify network connectivity and API key validity.
