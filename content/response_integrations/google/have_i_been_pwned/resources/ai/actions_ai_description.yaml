Check Account:
  ai_description: >-
    ### General Description

    Retrieves all known data breaches and public pastes associated with a specific
    user account using the HaveIBeenPwned service.


    ### Flow Description

    1. Iterates through the target entities and filters for User entities.

    2. Validates if the user identifier is a properly formatted email address.

    3. Makes a GET request to the HaveIBeenPwned API to fetch all breaches for the
    account.

    4. Makes a GET request to the HaveIBeenPwned API to fetch all pastes for the account.

    5. If breaches or pastes are found, generates an insight indicating the account
    has been pwned.

    6. Attaches the breach and paste details as data tables and JSON results to the
    action output.


    ### Additional Notes

    The action requires a valid HaveIBeenPwned API key configured in the integration
    settings.
  ai_short_description: >-
    Retrieves all known data breaches and public pastes associated with a specific
    user account using the HaveIBeenPwned service.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the HaveIBeenPwned API (fetches_data=true). It
      does not perform any state-changing operations on external systems (can_mutate_external_data=false)
      or internal systems (can_mutate_internal_data=false). It does not update entities,
      but it does create insights for entities that have been pwned (can_create_insight=true).
      It does not modify alert data or create case comments.
