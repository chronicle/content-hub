name: Get Related Entities
description: 'Get information about ioc related to entities using information from
    Mandiant. Supported entities: Hostname, IP Address, URL, File Hash, Threat Actor.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mandiant#get_related_entities
integration_identifier: Mandiant
parameters:
-   name: Lowest Severity Score
    default_value: '50'
    type: string
    description: 'Specify the lowest severity score that will be used to return related
        indicators. Maximum: 100.'
    is_mandatory: true
-   name: Max IOCs To Return
    default_value: '100'
    type: string
    description: 'Specify how many indicators action needs to process per entity.
        Default: 100.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_related_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS", "DestinationURL", "FILEHASH",
    "THREATACTOR"]}'
