Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic tool designed to verify the connectivity between
    Google SecOps and the Mandiant threat intelligence platform. It ensures that the
    provided API credentials and network settings are correct and that the service
    is reachable.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the API Root, Client ID, Client
    Secret, and SSL verification preference from the integration's global configuration.

    2. **Manager Initialization**: It initializes the `MandiantManager` with the `force_check_connectivity`
    flag set to true.

    3. **Authentication**: During initialization, the manager performs an OAuth2 flow
    by sending a POST request to the `/token` endpoint to obtain a Bearer token.

    4. **Connectivity Test**: The manager executes a test GET request to the `/v4/indicator`
    endpoint using a hardcoded IP address to verify that the API is functional and
    the token is valid.

    5. **Result Reporting**: If the API call succeeds, the action returns a success
    message. If an error occurs during authentication or the test call, the action
    fails and provides the error details.


    ### Additional Notes

    This action relies on configuration parameters defined at the integration level
    rather than action-specific parameters.
