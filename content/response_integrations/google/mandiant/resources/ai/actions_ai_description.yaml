Get Related Entities:
  ai_description: >-
    ### General Description

    Retrieves indicators of compromise (IOCs) related to specific entities using Mandiant
    Threat Intelligence. This action identifies associations between the target entities
    and known threat actors or malware families, then fetches additional indicators
    (IPs, domains, hashes, etc.) linked to those associations. It is useful for expanding
    the scope of an investigation by identifying other infrastructure or files related
    to the observed threats.


    ### Flow Description

    1. **Parameter Validation**: Validates that the 'Lowest Severity Score' and 'Max
    IOCs To Return' are positive integers and that the score does not exceed 100.

    2. **Entity Filtering**: Filters the target entities to include only supported
    types: IP Addresses, Hostnames, URLs, File Hashes, and Threat Actors.

    3. **Threat Actor Processing**: For Threat Actor entities, the action fetches
    the actor's details and retrieves all indicators associated with that actor ID
    via the Mandiant API.

    4. **Indicator Processing**: For other entity types, the action fetches Mandiant
    indicator details and identifies 'attributed associations' such as Malware or
    Threat Actors linked to that indicator.

    5. **Related Data Retrieval**: For each identified association, the action fetches
    their respective related indicators from Mandiant.

    6. **Filtering and Aggregation**: Filters all discovered indicators by the 'Lowest
    Severity Score' and limits the count based on 'Max IOCs To Return'.

    7. **Result Generation**: Aggregates the related IOCs into categories (hash, url,
    fqdn, ip, email) and attaches the data as a JSON result to the action.


    ### Additional Notes

    This action does not update the entities or create insights directly; it outputs
    the related indicators as a JSON result for use in subsequent playbook steps.
  ai_short_description: >-
    Retrieves indicators of compromise (IOCs) related to specific entities using Mandiant
    Threat Intelligence by identifying associations with known threat actors or malware
    families.
  capabilities:
