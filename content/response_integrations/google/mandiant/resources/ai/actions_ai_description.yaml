Enrich IOCs:
  ai_description: >-
    ### General Description

    The **Enrich IOCs** action retrieves comprehensive threat intelligence from Mandiant
    for a user-specified list of Indicators of Compromise (IOCs). Unlike standard
    enrichment actions that target entities within a case, this action processes a
    manual list of identifiers provided as an input parameter. It is designed to fetch
    details for various types of indicators, including vulnerabilities (CVEs), malware,
    threat actors, and general network/file indicators (IPs, URLs, FQDNs, and Hashes).


    ### Flow Description

    1. **Initialization**: The action initializes the Mandiant Manager using the provided
    API credentials and configuration settings.

    2. **Input Parsing**: The `IOC Identifiers` string is split into individual values
    for processing.

    3. **Sequential Lookup**: For each identifier, the action attempts to find a match
    by querying Mandiant endpoints in a specific priority order:
        * **Vulnerability**: Checks if the identifier is a CVE ID.
        * **Malware**: Checks if the identifier matches a known malware family name
    or ID.
        * **Threat Actor**: Checks if the identifier matches a known threat actor
    name or ID.
        * **General Indicator**: If no specific type matches, it searches the general
    indicator database for IPs, URLs, FQDNs, or Hashes.
    4. **Data Aggregation**: The first successful match found for each identifier
    is captured and formatted into a JSON structure.

    5. **Output**: The collected intelligence is returned as a JSON result, mapped
    by the original identifier, and a summary message is provided to the user.


    ### Additional Notes

    * This action does **not** automatically process entities associated with the
    Google SecOps case; it only processes the values explicitly provided in the `IOC
    Identifiers` parameter.

    * The action does not update entity attributes or create insights; it provides
    the raw intelligence data in the action's JSON result for use in downstream playbook
    logic.
  ai_short_description: >-
    Retrieves comprehensive threat intelligence from Mandiant for a user-specified
    list of Indicators of Compromise (IOCs), returning the data as a JSON result.
