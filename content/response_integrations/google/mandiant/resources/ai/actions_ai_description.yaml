Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches multiple entity types (IP Address, Hostname, URL, File Hash, Threat Actor,
    and CVE) using Mandiant Threat Intelligence. It retrieves detailed reputation
    data, risk scores, and contextual information, allowing analysts to automatically
    identify suspicious entities based on a configurable severity threshold and providing
    deep-dive insights directly within the Google SecOps platform.


    ### Flow Description

    1. Initializes the Mandiant API client and validates the severity score threshold.

    2. Filters the target entities to process only supported types (ADDRESS, HOSTNAME,
    FILEHASH, URL, CVE, THREATACTOR).

    3. Iterates over the filtered entities and fetches relevant details from Mandiant
    based on the entity type (Indicator, Threat Actor, or Vulnerability).

    4. Evaluates the retrieved 'mscore' against the severity threshold for indicators;
    if it meets or exceeds the threshold, the entity is marked as suspicious.

    5. Enriches the entity's additional properties with the retrieved data and marks
    it as enriched.

    6. Generates an HTML insight for the entity if configured, adhering to the 'Only
    Suspicious Entity Insight' parameter.

    7. Updates the entities in the Google SecOps platform and attaches a JSON result
    containing the raw data.


    ### Additional Notes

    - Skips invalid entities such as '::1'.

    - Supports MD5, SHA-1, and SHA-256 file hashes.
  ai_short_description: >-
    Enriches IP Address, Hostname, URL, File Hash, Threat Actor, and CVE entities
    using Mandiant Threat Intelligence to retrieve reputation data, risk scores, and
    contextual information.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entity properties, marks entities as suspicious, and creates insights.
    reasoning: >-
      The action fetches data from the Mandiant API to enrich entities. It does not
      mutate external data. It mutates internal data by updating entity properties,
      marking entities as suspicious, and creating insights.
