Create IP List Asset:
  ai_description: >-
    ### General Description

    Creates a new IP list asset in Tenable Security Center (Tenable.sc) using the
    provided IP address entities.


    ### Flow Description

    1. Extracts the action parameters (Name, Description, Tag).

    2. Filters the target entities to include only IP Address entities.

    3. If at least one IP Address entity is found, initializes the Tenable Security
    Center manager.

    4. Joins the IP addresses into a comma-separated list.

    5. Makes a POST request to the Tenable.sc API to create a new static IP list asset
    with the specified name, description, tags, and IP addresses.

    6. Attaches the JSON response of the created asset to the action results.


    ### Additional Notes

