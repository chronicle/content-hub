Add IP To IP List Asset:
  ai_description: >-
    ### General Description

    Adds specified IP address entities to an existing IP List Asset in Tenable.sc.
    This action modifies the target asset in the Tenable Security Center by appending
    the IP addresses from the case to the asset's defined IP list.


    ### Flow Description

    1. Extracts the target IP list asset name from the action parameters.

    2. Filters the target entities to include only IP addresses.

    3. Retrieves the asset ID from Tenable.sc using the provided asset name via a
    GET request.

    4. Fetches the existing defined IPs for the asset via a GET request.

    5. Appends the target IP addresses to the existing list of IPs.

    6. Updates the IP List Asset in Tenable.sc with the new combined list of IPs via
    a PATCH request.

    7. Retrieves the modified asset details and attaches them to the action's JSON
    result.


    ### Additional Notes

    The action requires the exact name of the IP List Asset in Tenable.sc. If the
    asset is not found, the action will fail.
  ai_short_description: >-
    Adds specified IP address entities to an existing IP List Asset in Tenable.sc.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates an IP List Asset in Tenable.sc by appending new IP addresses to its
      defined IPs list.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by making a PATCH request to Tenable.sc to
      update the defined IPs of an IP List Asset. It does not fetch contextual data
      for enrichment, nor does it mutate internal SecOps data, update entities, or
      create insights.
