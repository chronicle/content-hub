Enrich IP:
  ai_description: >-
    ### General Description

    Enriches IP Address entities using Tenable Security Center. This action retrieves
    device information for the specified IP addresses from a given repository and
    updates the entities with the enriched data.


    ### Flow Description

    1. Initializes the Tenable Security Center manager with the provided credentials.

    2. Iterates through the target entities and filters for IP Address entities.

    3. For each IP address, makes an API call to Tenable Security Center to fetch
    device information.

    4. Flattens the retrieved data and updates the entity's additional properties.

    5. Marks the entity as enriched and updates it in the Google SecOps platform.

    6. Adds the raw JSON results to the action's output.


    ### Additional Notes

    Requires a valid Repository Name to fetch the IP information.
