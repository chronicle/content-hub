Get Vulnerabilities for IP:
  ai_description: >-
    ### General Description

    Retrieves vulnerabilities and a severity summary for IP address entities from
    Tenable Security Center. This action helps analysts understand the security posture
    of an IP by identifying known vulnerabilities and their severity levels.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

