    ### General Description

    Retrieves the results of a specific scan from Tenable Security Center. The action
    waits for the scan to complete before fetching the detailed scan results and severity
    summary.


    ### Flow Description

    1. Retrieves the `Scan Result ID` from the action parameters.

    2. Initiates a polling loop to check the scan status via the Tenable Security
    Center API, waiting until the scan is marked as complete.

    3. Once complete, fetches the detailed scan results and severity summary using
    the API.

    4. Formats the retrieved data into CSV format and attaches it as data tables ("Tenable
    Scan Results" and "Tenable Severity Summary") to the action output.

    5. Appends the raw JSON results to the action's JSON output.


    ### Additional Notes

    The action will block execution while waiting for the scan to complete, which
    may take some time depending on the scan size and duration.
