Update Incident Resolution:
  ai_description: >-
    ### General Description

    Updates the resolution status of a specific incident in Symantec ATP. This action
    initiates a state change on the external Symantec ATP platform to close the incident
    and assign it a specific resolution reason.


    ### Flow Description

    1. Extracts the `Incident UUID` and `Resolution Status` from the action parameters.

    2. Maps the provided resolution status string to its corresponding integer value
    required by the Symantec ATP API.

    3. Makes a PATCH request to the Symantec ATP API (`/v2/incidents`) to update the
    incident's state to closed (value 4) and set the specified resolution.

    4. Returns a success message if the update is successful, or an error message
    if the incident is not found or permissions are insufficient.


    ### Additional Notes

    This action effectively closes the incident in Symantec ATP by hardcoding the
    state update to 4 (closed) alongside the resolution update.
  ai_short_description: >-
    Updates the resolution status and closes a specific incident in Symantec ATP.
  capabilities:
