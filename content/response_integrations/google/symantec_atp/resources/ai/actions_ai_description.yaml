Add Comment To Incident:
  ai_description: >-
    ### General Description

    Adds a comment to a specific incident in Symantec ATP.


    ### Flow Description

    1. Retrieves the `Incident UUID` and `Comment` from the action parameters.

    2. Makes a PATCH request to the Symantec ATP API incidents endpoint to append
    the provided comment to the specified incident.

    3. Returns a success message if the comment was attached successfully, or an error
    message if the operation fails.


    ### Additional Notes

    The comment length is limited to 512 characters due to Symantec ATP limitations.
