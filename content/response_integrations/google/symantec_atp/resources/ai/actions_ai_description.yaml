    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PATCH request to the Symantec ATP API to update the resolution
      and state of an incident. This mutates external data. It does not fetch data,
      mutate internal SecOps data, update entities, create insights, or create case
      comments.
