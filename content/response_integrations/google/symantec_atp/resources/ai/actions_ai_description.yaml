Delete Blacklist Policy:
  ai_description: >-
    ### General Description

    Deletes a blacklist policy for specific entities (URL, FileHash, Address) in Symantec
    ATP.


    ### Flow Description

    1. Initializes the Symantec ATP manager with the provided API credentials.

    2. Filters the target entities to include only URL, FileHash, and Address types.

    3. Iterates through the filtered entities.

    4. For each entity, makes an API call to Symantec ATP to retrieve its corresponding
    blacklist policy ID.

    5. Makes an HTTP DELETE request to Symantec ATP to remove the blacklist policy
    associated with the entity.

    6. Aggregates the results and returns a success message with the list of successfully
    deleted entities.


