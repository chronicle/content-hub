Add To WhiteList:
  ai_description: >-
    ### General Description

    Adds specified entities to the whitelist policy in Symantec ATP. This action prevents
    the specified indicators from triggering future security alerts or being blocked
    by Symantec ATP.


    ### Flow Description

    1. Iterates through the target entities provided in the action.

    2. Checks if the entity type is a File Hash (specifically SHA256), Hostname, IP
    Address, or URL.

    3. Makes a POST request to the Symantec ATP API (`atpapi/v2/policies/whitelist`)
    to create a whitelist policy for each valid entity.

    4. If the API call is successful, creates an insight for the entity in the Google
    SecOps platform indicating it was whitelisted.


    ### Additional Notes

    MD5 hashes cannot be added to the whitelist due to a Symantec ATP limitation.
    Only SHA256 hashes are supported for file hash whitelisting.
