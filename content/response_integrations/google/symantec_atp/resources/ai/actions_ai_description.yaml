Add To Blacklist:
  ai_description: >-
    ### General Description

    Creates a blacklist policy for specific entities (File Hash, Hostname, IP Address,
    URL) in Symantec ATP. This action initiates a state change on the external device
    to prevent network traffic or execution related to the specified entities.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only those of type File Hash, Hostname, IP
    Address, or URL.

    3. For each supported entity, makes a POST request to the Symantec ATP API (`/v2/policies/blacklist`)
    to create a new blacklist policy.

    4. If the policy is successfully created, an insight is added to the entity in
    Google SecOps indicating it was blacklisted.


    ### Additional Notes

    - For File Hash entities, the action automatically determines if the hash is SHA256
    or MD5 and sends the appropriate target type to the Symantec ATP API.
