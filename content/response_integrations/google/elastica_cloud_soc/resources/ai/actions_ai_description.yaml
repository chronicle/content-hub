Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Elastica CloudSOC platform.


    ### Flow Description

    1. Initializes the Elastica CloudSOC manager using the provided integration configurations.

    2. Sends an HTTP GET request to the `/audit/v2/datasources/` endpoint to verify
    API access.

    3. Returns a success message if the connection is established.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and the API credentials are valid.
