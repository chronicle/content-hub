Get User Activities:
  ai_description: >-
    ### General Description

    Fetches user activities and investigation logs from Elastica Cloud SOC for specified
    User entities. This action retrieves historical event data for users within a
    specified timeframe and attaches the results to the case.


    ### Flow Description

    1. Filters the target entities to include only those of type `User`.

    2. Calculates the start time for the log search based on the `Minutes Back` parameter.

    3. Iterates through the filtered User entities, extracting the `OriginalIdentifier`
    from each entity's additional properties to use as the case-sensitive username.

    4. Makes a GET request to the Elastica Cloud SOC API to retrieve investigation
    logs for each user since the calculated start time.

    5. If logs are found, attaches them as an entity table to the respective user
    and aggregates the data into a JSON result.


    ### Additional Notes

    The action relies on the `OriginalIdentifier` from the entity's additional properties
    to perform a case-sensitive search in Elastica Cloud SOC. If this property is
    missing or incorrect, the search may not return the expected logs.
  ai_short_description: >-
    Fetches user activities and investigation logs from Elastica Cloud SOC for specified
    User entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Elastica Cloud SOC API to fetch user investigation
      logs (fetches_data=true). It does not perform any state-changing operations
      on external systems (can_mutate_external_data=false). It does not mutate internal
      case data, update entities, create insights, modify alert data, or create case
      comments.
