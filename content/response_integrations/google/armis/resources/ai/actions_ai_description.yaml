Update Alert Status:
  ai_description: >-
    ### General Description

    Updates the status of a specific alert in the Armis platform. This action allows
    analysts to change the state of an Armis alert to Unhandled, Suppressed, or Resolved
    directly from Google SecOps.


    ### Flow Description

    1. Extracts the `Alert ID` and the desired `Status` from the action parameters.

    2. Initializes the Armis API client with the provided integration configuration.

    3. Makes a PATCH request to the Armis API (`/api/v1/alerts/{alert_id}/`) with
    the new status payload.

    4. Handles the response, returning a success message if the alert is updated or
    if it already has the requested status.


    ### Additional Notes

    If the alert is not found in Armis, the action will fail and return an error message.
