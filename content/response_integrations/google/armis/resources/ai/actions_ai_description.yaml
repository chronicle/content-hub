Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Armis service using the provided integration configuration
    parameters. This action ensures that the integration is correctly configured and
    can successfully authenticate and communicate with the Armis API.


    ### Flow Description

    1. Extracts the API Root, API Secret, and Verify SSL parameters from the integration
    configuration.

    2. Initializes the Armis API client with the extracted credentials.

    3. Sends a GET request to the Armis API (`/api/v1/search/`) with a basic query
    (`in:devices`) to verify authentication and network connectivity.

    4. Returns a success message if the connection is established and the API responds
    correctly, or an error message if the connection fails.


    ### Additional Notes

    This action is primarily used for diagnostic purposes and does not interact with
    or modify any case data or entities.
