List Alert Connections:
  ai_description: >-
    ### General Description

    Lists connections related to a specific alert in Armis based on the provided alert
    ID and severity criteria.


    ### Flow Description

    1. Extracts the 'Alert ID', 'Lowest Severity To Fetch', and 'Max Connections To
    Return' parameters.

    2. Validates that 'Max Connections To Return' is greater than or equal to 1.

    3. Initializes the Armis API client with the provided integration credentials.

    4. Constructs an AQL query to fetch connections related to the alert ID and filtered
    by the specified severity.

    5. Calls the Armis API (via `get_alert_connections`) to retrieve the alert connections.

    6. If connections are found, processes them into JSON and CSV formats.

    7. Adds the JSON result and a data table ('Available Communications') to the action
    result.


    ### Additional Notes

    The action returns a JSON result and a CSV table containing the connections data.
  ai_short_description: >-
    Lists connections related to a specific alert in Armis based on the provided alert
    ID and severity criteria.
