Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP and MAC Address entities using information from Armis.


    ### Flow Description

    1. Iterates over the target entities provided in the case.

    2. Filters the entities to process only IP Addresses and MAC Addresses.

    3. For each supported entity, makes an API call to Armis (`/api/v1/devices/`)
    to fetch device information based on the IP or MAC address.

    4. If device information is found, enriches the entity's additional properties
    with the retrieved data and marks it as enriched.

    5. Optionally creates an endpoint insight containing the device information.

    6. Updates the entities in the SecOps platform with the new enrichment data.


    ### Additional Notes

    There are no additional notes for this action.
  ai_short_description: >-
    Enriches IP and MAC Address entities by fetching device information from Armis
    and optionally creating endpoint insights.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes GET requests to the Armis API to fetch device information,
      meaning it fetches data. It does not perform any state-changing operations on
      external systems. Internally, it updates the processed entities with the fetched
      data and creates case insights.
