Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the TruSTAR service using the parameters provided in the
    integration configuration.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, API Key, API Secret,
    Verify SSL).

    2. Initializes the `TruSTARManager` with the extracted credentials.

    3. Calls the `test_connectivity` method to ping the TruSTAR API.

    4. Returns a success message if the connection is established, otherwise returns
    a failure message.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the TruSTAR platform.
