Get Related IOCs:
  ai_description: >-
    ### General Description

    Retrieves information about Indicators of Compromise (IOCs) that are related to
    the provided entities using TruSTAR. This action queries the TruSTAR platform
    to find associated threat intelligence indicators based on the identifiers of
    the target entities.


    ### Flow Description

    1. Extracts action parameters, including the maximum number of IOCs to return
    and any specific enclave filters.

    2. Retrieves a list of available enclaves from TruSTAR to validate the provided
    enclave filters.

    3. Makes a GET request to the TruSTAR API to fetch related IOCs for the identifiers
    of the target entities, applying the enclave filters and limit.

    4. Aggregates the retrieved IOCs by their indicator type.

    5. Attaches the related IOCs as a JSON result and creates a statistical data table
    summarizing the counts of each indicator type.


    ### Additional Notes

    This action supports all entity types. If an invalid enclave name is provided
    in the filter, the action will fail and list the missing enclaves.
