List Enclaves:
  ai_description: >-
    ### General Description

    Lists available enclaves in TruSTAR. This action retrieves the enclaves configured
    in the TruSTAR platform and allows filtering the results based on the enclave
    name.


    ### Flow Description

    1. Extracts the action parameters: `Filter Logic`, `Filter Value`, and `Max Enclaves
    To Return`.

    2. Makes a GET request to the TruSTAR API (`api/1.3/enclaves`) to retrieve the
    list of available enclaves.

    3. Limits the initial results based on the `Max Enclaves To Return` parameter.

    4. If a `Filter Value` is provided, filters the enclaves by name using the specified
    `Filter Logic` (either 'Equal' or 'Contains').

    5. Outputs the resulting enclaves as a JSON result and a CSV data table.


    ### Additional Notes

    If no `Filter Value` is provided, all retrieved enclaves up to the maximum limit
    are returned.
