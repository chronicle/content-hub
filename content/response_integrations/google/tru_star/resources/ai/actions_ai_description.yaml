Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches entities using threat intelligence information from TruSTAR. It retrieves
    metadata and indicator summaries for the target entities to determine their severity,
    context, and related enclaves.


    ### Flow Description

    1. Retrieves the list of available enclaves from TruSTAR and validates the provided
    `Enclave Filter`.

    2. Extracts identifiers from all target entities in the case.

    3. Makes an API call to TruSTAR (`api/1.3/indicators/metadata`) to fetch metadata
    information for the entities.

    4. Makes an API call to TruSTAR (`api/1.3/indicators/summaries`) to fetch indicator
    summary information.

    5. Evaluates the maximum severity of each entity against the configured `Security
    Level Threshold`.

    6. Updates the entity's additional properties, marks it as enriched, and sets
    it as suspicious if the severity threshold is met or exceeded.

    7. Attaches an insight, a web link to the TruSTAR report, and a data table to
    the entity.

    8. Updates the entities in the Google SecOps platform and returns the JSON results.


    ### Additional Notes

    This action supports all entity types. If specific enclaves are provided in the
    filter, only indicators related to those enclaves will be returned.
  ai_short_description: >-
    Enriches entities by retrieving threat intelligence metadata and indicator summaries
    from TruSTAR, updating entity properties, and marking them as suspicious if their
    severity exceeds a specified threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from TruSTAR via GET/POST requests to retrieve metadata
      and summaries (fetches_data=true). It does not mutate external data. It updates
      internal entities using `siemplify.update_entities` (can_update_entities=true)
      and creates insights using `siemplify.add_entity_insight` (can_create_insight=true).
  entity_usage:
