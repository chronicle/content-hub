Get Related Reports:
  ai_description: >-
    ### General Description

    Retrieves information about reports related to the provided entities from TruSTAR.
    This action fetches correlated reports, their details, and associated tags to
    provide threat intelligence context for the target entities.


    ### Flow Description

    1. Extracts action parameters including `Enclave Filter` and `Max Reports To Return`.

    2. Iterates over the target entities, extracting domains for URL entities and
    identifiers for all other entity types.

    3. Validates the provided enclaves against the available enclaves in TruSTAR via
    the `list_enclaves` API.

    4. Fetches correlated reports for the entities using the `get_correlated_reports`
    API.

    5. For each report found, retrieves detailed information and tags using the `get_report_details`
    and `get_report_tags` APIs.

    6. Aggregates the results, creates a JSON result, populates a data table, and
    optionally creates a case insight with the report details.


    ### Additional Notes

    Supports all entity types. If the `Include Report Body In Insight` parameter is
    enabled, the insight may be very large depending on the report content.
  ai_short_description: >-
    Retrieves information about reports related to the provided entities from TruSTAR,
    optionally filtering by enclaves and creating case insights with the findings.
