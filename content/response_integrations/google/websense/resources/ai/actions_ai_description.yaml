Get Category Urls API:
  ai_description: >-
    ### General Description

    Retrieves a list of all URLs associated with a specific API-managed category in
    Websense. The retrieved URLs are then presented as a data table within the action
    results.


    ### Flow Description

    1. Initializes the Websense API manager using the provided integration credentials.

    2. Retrieves the target category name from the `CategoryName` parameter.

    3. Makes an HTTP GET request to the Websense API to fetch the list of URLs associated
    with the specified category.

    4. Formats the retrieved list of URLs and attaches it to the action's result data
    table.


    ### Additional Notes

    This action only retrieves data and does not modify any categories or URLs in
    Websense.
