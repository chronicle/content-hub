Unblock Url API:
  ai_description: >-
    ### General Description

    Unblocks a URL by removing it from a specified API-managed category in Websense.
    This action restores access to the URL by modifying the category configuration
    on the Websense content gateway.


    ### Flow Description

    1. Retrieves the `CategoryName` and optional `URL` from the action parameters.

    2. If a specific URL is not provided in the parameters, the action extracts all
    entities of type `URL` from the case's target entities.

    3. Iterates through the identified URLs and makes a POST request to the Websense
    API (`categories/delete/urls`) to remove each URL from the specified category.

    4. Commits the transaction to apply the changes on the Websense gateway.

    5. Returns a success message listing the URLs that were successfully unblocked.


    ### Additional Notes

    Only API-created categories can be manipulated using this action. Ensure the provided
    category name corresponds to an existing API-managed category in Websense.
