Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Websense API to ensure the integration is configured
    correctly and the service is reachable.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the Websense API Manager.

    3. Makes an API call to obtain a transaction ID and immediately commits it to
    verify connectivity.

    4. Returns a success message if the connection is established, or an error message
    otherwise.


    ### Additional Notes

    This action is typically used for diagnostic purposes and does not interact with
    alerts or entities.
