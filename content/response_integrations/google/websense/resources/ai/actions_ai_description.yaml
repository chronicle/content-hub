Block Url API:
  ai_description: >-
    ### General Description

    Blocks specified URLs by adding them to a designated API-managed category in Websense.
    This action initiates a state change on the external Websense gateway to prevent
    network traffic to the specified URLs.


    ### Flow Description

    1. Retrieves the target category name and a list of URLs from the action parameters.

    2. If no URLs are provided in the parameters, the action falls back to extracting
    URL entities from the case's target entities.

    3. Iterates through the list of URLs and makes a POST request to the Websense
    API (`categories/urls` endpoint) to add each URL to the specified category.

    4. Commits the transaction in Websense and returns a summary of the successfully
    blocked URLs.


    ### Additional Notes

    The category specified in the `CategoryName` parameter must be an API-managed
    category in Websense, as only API-created categories can be manipulated via this
    action.
  ai_short_description: >-
    Blocks specified URLs by adding them to a designated API-managed category in Websense.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds specified URLs to a designated API-managed category in Websense, effectively
      blocking or categorizing them.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Websense API to add URLs to a category,
      mutating external data. It does not fetch contextual data, mutate internal SecOps
      data, update entities, or create insights/comments.
