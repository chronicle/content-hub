    \ HTML insight in the case.\n    - If 'Create Threat Campaign Entity' is active,\
    \ adds the campaign as a new THREATACTOR entity to the case.\n5. **Finalization**:\
    \ Returns the aggregated JSON results and updates the action status based on the\
