    \ specific campaigns from Proofpoint TAP based on provided Campaign IDs. This\
    \ action is designed to provide security analysts with deep context regarding\
    \ threat campaigns, including descriptions, start dates, and associated threat\
    \ actors or malware families. It can also retrieve forensic evidence and automatically\
    \ populate the Google SecOps case with new entities and insights.\n\n### Flow\
    \ Description\n1. **Initialization**: Validates the 'Max Forensics Evidence To\
    \ Return' parameter and establishes a connection to the Proofpoint TAP API.\n\
    2. **Data Retrieval**: Iterates through each provided Campaign ID and makes a\
    \ GET request to the Proofpoint TAP API to fetch core campaign metadata.\n3. **Forensics\
    \ (Optional)**: If requested, makes an additional GET request to fetch forensic\
    \ data for each campaign, applying the specified type filters and limits.\n4.\
    \ **Internal Enrichment**: \n    - Generates a data table for campaign details.\n\
    \    - If 'Fetch Forensics' is active, generates a specific evidence data table\
