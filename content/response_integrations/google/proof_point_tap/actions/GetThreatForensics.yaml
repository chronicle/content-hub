name: Get Threat Forensics
description: Use the Get Threat Forensics action to return forensics associated with
    a threat in Proofpoint TAP.
integration_identifier: ProofPointTAP
parameters:
-   name: Threat ID
    default_value: ''
    type: string
    description: Comma-separated list of threat IDs for which forensics need to be
        returned.
    is_mandatory: true
-   name: Include Campaign Forensics
    default_value: false
    type: boolean
    description: If enabled, action will also return campaign forensics related to
        the provided threat.
    is_mandatory: false
-   name: Max Results To Return
    default_value: 50
    type: string
    description: 'How many results to return per threat id. Default: 50. Maximum:
        1000.'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_threat_forensics_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
