DNS Resolve:
  ai_description: >-
    ### General Description

    Resolves IP addresses for a provided list of hostname entities using the Shodan
    API. This action queries Shodan's DNS resolution endpoint to find the corresponding
    IP addresses for the targeted hostnames and returns the results as a data table
    and JSON object.


    ### Flow Description

    1. Iterates through the target entities provided to the action and filters for
    entities of type `HOSTNAME`.

    2. Aggregates the identifiers of the filtered hostnames into a comma-separated
    string.

    3. Makes a GET request to the Shodan API (`/dns/resolve`) to fetch the corresponding
    IP addresses for the hostnames.

    4. Formats the returned resolution data into a CSV table and attaches it to the
    action's results.

    5. Appends the raw JSON response to the action results for further playbook usage.


    ### Additional Notes

    This action only processes entities of type `HOSTNAME`. Other entity types will
    be ignored.
  ai_short_description: >-
    Resolves IP addresses for a provided list of hostname entities using the Shodan
    API.
