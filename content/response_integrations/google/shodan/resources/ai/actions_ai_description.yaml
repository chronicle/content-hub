SearchForExploits:
  ai_description: >-
    ### General Description

    Searches across a variety of data sources for known exploits using the Shodan
    API. It allows users to query the Shodan exploits database and optionally use
    facets to get summary information.


    ### Flow Description

    1. Retrieves the search query, facets, and page number from the action parameters.

    2. Makes a GET request to the Shodan Exploits API (`https://exploits.shodan.io/api/search`)
    with the provided query and parameters.

    3. Parses the JSON response containing the exploit search results.

    4. Outputs the results as a JSON object and attaches a CSV data table to the action
    results.


    ### Additional Notes

    Requires a valid Shodan API key configured in the integration settings.
