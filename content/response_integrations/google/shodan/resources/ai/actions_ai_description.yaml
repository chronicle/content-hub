  ai_description: >-
    ### General Description

    Initiates a network scan using Shodan for the provided IP address entities. This
    action triggers Shodan's external scanning infrastructure and returns a unique
    scan ID to track the progress of the scan.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to include only those of type `ADDRESS`.

    3. Aggregates the valid IP addresses into a comma-separated list.

    4. Makes a POST request to the Shodan API (`/shodan/scan`) to initiate the network
    scan.

    5. Retrieves the scan ID from the response and outputs it as the result.


    ### Additional Notes

    This action uses Shodan API scan credits. One IP consumes one scan credit. A paid
    API plan (either one-time payment or subscription) is required to use this method.
