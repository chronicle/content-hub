Get domain reputation:
  ai_description: >-
    ### General Description

    Retrieves domain reputation and blacklist information from URLVoid for Hostname
    and URL entities. It evaluates the domain's risk based on a specified threshold
    and enriches the entity with threat intelligence data.


    ### Flow Description

    1. Iterates through the target entities, filtering specifically for Hostname and
    URL entity types.

    2. Extracts the domain name from the entity identifier.

    3. Makes a GET request to the URLVoid API (`/domainbl/v1/pay-as-you-go/`) to fetch
    the domain's reputation and blacklist report.

    4. Parses the response to extract server information and blacklist engine detections.

    5. Attaches the blacklist report as a table to the entity and creates an insight
    displaying the domain's country code.

    6. Updates the entity's additional properties with the flattened enrichment data.

    7. Compares the number of blacklist detections against the provided `Threshold`
    parameter; if the detections exceed the threshold, the entity is marked as suspicious.

    8. Marks the entity as enriched and saves the updates to the platform.


    ### Additional Notes

    Returns a JSON result containing the raw reputation data for each successfully
    processed entity. Entities that fail processing or have no reputation data are
    skipped and reported in the output message.
  ai_short_description: >-
    Retrieves domain reputation and blacklist information from URLVoid for Hostname
    and URL entities, enriching them with threat intelligence and updating their suspicious
    status based on a defined threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the URLVoid API to fetch reputation data (fetches_data=true).
      It does not mutate external data (can_mutate_external_data=false). It updates
      entities with enrichment data and suspicious status (can_update_entities=true)
      and creates insights with country code information (can_create_insight=true).
      It does not modify alert data or create case comments.
