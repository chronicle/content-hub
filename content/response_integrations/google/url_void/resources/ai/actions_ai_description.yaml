Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the URLVoid service to ensure that the integration is configured
    correctly and can communicate with the API.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API URL, API Key, and SSL
    verification settings).

    2. Initializes the URLVoid manager.

    3. Makes a GET request to the URLVoid `/domainbl/v1/pay-as-you-go/?stats` endpoint
    to verify authentication and network connectivity.

    4. Returns a success message if the connection is established and the API responds
    without errors.


    ### Additional Notes

    This action is typically used during the initial setup of the URLVoid integration
    to validate credentials and network access. It does not interact with cases or
    entities.
  ai_short_description: >-
    Tests connectivity to the URLVoid service to verify integration credentials and
