Kill Hash In Hosts:
  ai_description: >-
    ### General Description

    Kills processes associated with specific file hashes on hosts using Cynet. This
    action identifies where a malicious file hash is running and terminates the associated
    process on those endpoints.


    ### Flow Description

    1. Iterates over the target entities provided in the case.

    2. Filters the entities to process only File Hash entities.

    3. Verifies if the file hash is a valid SHA256 hash.

    4. Makes a GET request to the Cynet API to retrieve details about the hash and
    identify the hosts where it has occurred.

    5. For each identified host, makes a POST request to the Cynet API to initiate
    a kill process remediation action.

    6. Makes a GET request to retrieve the status of the remediation action.

    7. Aggregates the remediation IDs and returns them as a JSON result.


    ### Additional Notes

    This action only processes SHA256 file hashes. Hashes of other types will be ignored.
