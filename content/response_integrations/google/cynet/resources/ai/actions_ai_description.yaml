    ### General Description

    This action retrieves detailed information about specific file hashes from Cynet.
    It is used to enrich file hash entities with additional context and threat intelligence
    provided by the Cynet platform.


    ### Flow Description

    1. The action iterates over all target entities provided in the case.

    2. It filters the entities, selecting only those identified as File Hash (`FILEHASH`).

    3. For each file hash, it verifies if the hash format is SHA256.

    4. If valid, it makes an API call (`GET /full/file?sha256={hash_identifier}`)
    to the Cynet API to retrieve the hash details.

    5. The retrieved data is formatted and attached to the case as an entity table
    and a JSON result.


    ### Additional Notes

    This action only processes SHA256 file hashes. Other hash types will be ignored.
