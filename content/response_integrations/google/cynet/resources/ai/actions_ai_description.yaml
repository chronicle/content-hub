Delete Hash In Hosts:
  ai_description: >-
    ### General Description

    Deletes a specific file hash across identified hosts using Cynet. This action
    acts as an endpoint remediation measure, locating where a malicious SHA256 file
    hash exists and issuing a command to the Cynet platform to delete the file from
    those specific endpoints.


    ### Flow Description

    1. Iterates through the target entities and filters for `File Hash` entities.

    2. Verifies if the provided file hash is a valid SHA256 hash.

    3. Retrieves detailed information about the hash from Cynet via a GET request
    to `/full/file`.

    4. Extracts the hostnames where the file hash has been observed from the hash
    details.

    5. Initiates a delete file remediation action on each identified host via a POST
    request to `/file/remediation/delete`.

    6. Retrieves the status of the remediation action via a GET request to `/file/remediation/{id}`.

    7. Returns the remediation IDs and statuses as a JSON result attached to the action.


    ### Additional Notes

    This action only processes SHA256 file hashes. Other hash types (e.g., MD5, SHA1)
    will be ignored.
  ai_short_description: >-
    Deletes a specific file hash across identified hosts using Cynet as an endpoint
    remediation action.
