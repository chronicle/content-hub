identifier: AzureApi
name: Azure API
parameters:
-   name: Test URL
    default_value: ''
    type: string
    description: Test URL that will be used to validate the authentication to Azure
        API. Uses a GET request.
    is_mandatory: true
    integration_identifier: AzureApi
-   name: Microsoft Login API Root
    default_value: https://login.microsoftonline.com
    type: string
    description: The API root of the Microsoft identity platform login service used
        for Azure API authentication.
    is_mandatory: true
    integration_identifier: AzureApi
-   name: Microsoft Graph API Root
    default_value: https://graph.microsoft.com
    type: string
    description: The API root of the Microsoft Graph service used for Azure API operations.
    is_mandatory: true
    integration_identifier: AzureApi
-   name: Client ID
    default_value: ''
    type: string
    description: The Client ID for the Azure API account.
    is_mandatory: true
    integration_identifier: AzureApi
-   name: Client Secret
    default_value: null
    type: password
    description: The Client Secret for the Azure API account.
    is_mandatory: true
    integration_identifier: AzureApi
-   name: Tenant ID
    default_value: ''
    type: string
    description: The Tenant ID for the Azure API account.
    is_mandatory: true
    integration_identifier: AzureApi
-   name: Refresh Token
    default_value: null
    type: password
    description: The Refresh Token for the Azure API account.
    is_mandatory: false
    integration_identifier: AzureApi
-   name: Scopes
    default_value: https://graph.microsoft.com/.default
    type: string
    description: The scopes for the Azure API authentication.
    is_mandatory: true
    integration_identifier: AzureApi
-   name: Verify SSL
    default_value: 'true'
    type: boolean
    description: If selected, the integration validates the SSL certificate when connecting
        to the Azure API server. Disabled by default.
    is_mandatory: false
    integration_identifier: AzureApi
-   name: Redirect URL
    default_value: http://localhost
    type: string
    description: The Redirect URL associated with the Microsoft Entra ID application.
    is_mandatory: false
    integration_identifier: AzureApi
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/AzureApi
categories:
- IT & Infrastructure
- Azure
- Cloud
svg_logo_path: resources/logo.svg
image_path: resources/image.png
