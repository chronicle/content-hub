Execute HTTP Request:
  ai_description: >-
    ### General Description

    The **Execute HTTP Request** action allows users to construct and execute customized
    HTTP API requests against a target URL. It is a versatile tool for interacting
    with any RESTful API, supporting various HTTP methods, headers, query parameters,
    and body payloads. It can operate in an asynchronous mode when polling an endpoint
    is necessary to wait for a specific success condition in the response body.


    ### Flow Description

    1. **Parameter Extraction**: The action extracts and validates all input parameters,
    ensuring JSON strings are correctly formatted.

    2. **Request Construction**: It builds an HTTP request using the specified method,
    URL, headers, cookies, and payload.

    3. **Execution**: The request is sent to the target URL using the authenticated
    session.

    4. **Response Parsing**: The action parses the response, extracts the fields specified
    in 'Fields To Return', and optionally encodes the body in Base64.

    5. **Async Check**: If 'Expected Response Values' are provided, the action compares
    the response data against the criteria. If they don't match, the action enters
    an 'In Progress' state for polling.

    6. **Internal Mutation**: If 'Save To Case Wall' is enabled, the response content
    is compressed into a ZIP file (optionally password-protected) and attached to
    the case wall.

    7. **Completion**: The action returns the filtered response data as JSON results.


    ### Additional Notes

    - This action does not run on specific entities; it is a global utility action.

    - Providing **Expected Response Values** will trigger asynchronous execution (polling).
  ai_short_description: >-
    Constructs and executes a customized HTTP API request against a target URL, supporting
    various HTTP methods, headers, and payloads, with optional asynchronous polling
    and case wall attachment capabilities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: >-
      The action can execute HTTP methods such as POST, PUT, PATCH, and DELETE, which
      are designed to create, modify, or delete data on the target external API.
    fetches_data: true
    internal_data_mutation_explanation: >-
      If the 'Save To Case Wall' parameter is enabled, the action compresses the HTTP
      response into a ZIP file and attaches it to the case wall.
    reasoning: >-
      The action fetches data by making HTTP requests to external APIs. It can mutate
      external data because it supports HTTP methods like POST, PUT, PATCH, and DELETE.
      It can mutate internal data by saving the HTTP response as an attachment to
      the case wall. It does not update entities, create insights, modify alert data,
      or create case comments.
