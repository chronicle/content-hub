Ping:
  ai_description: >-
    ### General Description

    The Ping action is a diagnostic tool designed to verify connectivity between Google
    SecOps and the configured Azure API endpoint. It ensures that the integration's
    authentication and network configuration are correct by performing a test request
    to a target URL.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the test URL from the integration's
    configuration parameters.

    2. **Client Initialization**: It initializes the Azure API client using the provided
    credentials and establishes an authenticated session.

    3. **Connectivity Test**: The action executes an HTTP `GET` request to the test
    URL via the `test_connectivity` method to validate network access.

    4. **Result Reporting**: If the request is successful, the action returns a success
    message and populates the JSON results with the tested endpoint URL.


    ### Additional Notes

    - This action relies entirely on integration-level configuration and does not
    require any action-specific parameters.

    - It is primarily used for troubleshooting and validating the initial setup of
    the integration.
  ai_short_description: >-
    A diagnostic action that verifies connectivity between Google SecOps and the configured
    Azure API endpoint by performing a test HTTP GET request.
