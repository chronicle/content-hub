Get Authorization:
  ai_description: >-
    ### General Description

    The **Get Authorization** action initiates the OAuth 2.0 delegated authentication
    flow for the Azure API integration. It generates a specific authorization URL
    that allows a user to grant the integration permissions to access Azure resources
    on their behalf. This is a prerequisite step for integrations requiring user-level
    access tokens.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the requested OAuth scopes from
    the user input and fetches the integration's configuration (Tenant ID, Client
    ID, and Redirect URL) from the Google SecOps environment.

    2. **URL Generation**: It constructs the Microsoft identity platform authorization
    URL by combining the login API root with the authorization endpoint and appending
    query parameters including the `client_id`, `redirect_uri`, `response_type=code`,
    and the requested `scopes`.

    3. **Output**: The action logs the generated URL and adds it as a clickable link
    in the Google SecOps action results interface.


    ### Additional Notes

    * This action does not interact with or process any Google SecOps entities.

    * **Manual Step Required**: After the action completes, a user must manually click
    the generated link, authenticate with Azure, and then capture the 'code' parameter
    from the resulting redirect URL to use in subsequent token generation actions.
  ai_short_description: >-
    Generates an OAuth 2.0 authorization URL for the Azure API integration to initiate
    delegated authentication.
