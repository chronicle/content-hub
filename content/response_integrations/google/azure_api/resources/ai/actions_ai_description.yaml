  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Method | String | Yes | The HTTP method (verb) used for the request (e.g., GET,
    POST, PUT, PATCH, DELETE, HEAD, OPTIONS). |

    | URL Path | String | Yes | The API endpoint where the request executes. This
    path can optionally include query parameters. |

    | URL Params | String | No | The query parameters (GET parameters) for the URL,
    provided as a JSON object where each key-value pair is a parameter. |

    | Headers | String | No | The headers for the HTTP request, specified as a JSON
    object. |

    | Cookie | String | No | The cookies constructed into the HTTP Cookie header,
    specified as a JSON object. This parameter overrides any cookie values provided
    in Headers. |

    | Body Payload | String | No | The content payload for the HTTP request, specified
    as a JSON object. |

    | Expected Response Values | String | No | The JSON object containing the field-value
    pairs that define the required successful state of the response. If provided,
    the action runs in asynchronous mode. |

    | Follow Redirects | Boolean | No | If selected, the action automatically follows
    any HTTP redirect responses (such as 301 or 302 status codes) to the final destination
    URL. |

    | Fail on 4xx/5xx | Boolean | No | If selected, the action explicitly fails the
    step when the HTTP response returns a Client Error (4xx) or Server Error (5xx)
    status code. |

    | Base64 Output | Boolean | No | If selected, the action converts the entire HTTP
    response body to a Base64 encoded string. |

    | Fields To Return | String | Yes | A comma-separated list of fields that the
    action returns in the output. Possible values: response_data, redirects, response_code,
    response_cookies, response_headers, apparent_encoding. |

    | Request Timeout | String | Yes | The maximum time, in seconds, the action waits
    for the server to send data before the request is aborted. |

    | Save To Case Wall | Boolean | No | If selected, the action saves the file and
    attaches it to the case wall. The file is archived with a ".zip" extension. |

    | Password Protect Zip | Boolean | No | If selected, the action encrypts the downloaded
    ZIP archive (created using Save To Case Wall) with a password (such as infected).
    |
Generate Token:
  ai_description: >-
    ### General Description

    The **Generate Token** action is a utility designed to facilitate the OAuth2 delegated
    authentication flow for the Azure API integration. Its primary purpose is to exchange
    an authorization code (obtained from a previous step like 'Get Authorization')
    for a persistent refresh token. This refresh token is then used by other actions
    in the integration to maintain authenticated access to Microsoft Graph or other
    Azure services without requiring manual re-authentication.


    ### Flow Description

    1. **Extraction**: The action retrieves the `Authorization URL` from the input
    parameters.

    2. **Parsing**: It parses the provided URL to extract the `code` value from the
    query string.

    3. **Token Exchange**: It performs a POST request to the Microsoft identity platform's
    token endpoint (`/oauth2/v2.0/token`) using the `authorization_code` grant type.

    4. **Output**: Upon a successful response, it extracts the `refresh_token` and
    provides it in the action's output message for the user to configure in the integration
    settings.


    ### Additional Notes

    - This action does not interact with Google SecOps entities (IPs, Hosts, etc.).

    - It is a one-time setup action used during the initial configuration of delegated
    permissions.
  ai_short_description: >-
    Exchanges an authorization code extracted from a provided URL for a persistent
    refresh token to facilitate OAuth2 delegated authentication for the Azure API
    integration.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
