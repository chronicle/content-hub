name: Generate Token
description: Use the Generate Token action to obtain a persistent refresh token required
    for delegated authentication. This token is generated using the authorization
    URL received from the Get Authorization action. This action doesn't run on Google
    SecOps entities.
integration_identifier: AzureApi
parameters:
-   name: Authorization URL
    default_value: ''
    type: string
    description: The full authorization URL, containing the access code, received
        from the Get Authorization action. This URL is required to request and generate
        the refresh token.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
