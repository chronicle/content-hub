name: Execute HTTP Request
description: 'Use the Execute HTTP Request action to construct and execute a customized
    HTTP API request against a target URL. Note: This action operates in an asynchronous
    mode when polling an endpoint is necessary to wait until a specific success or
    failure condition is met in the response body.'
integration_identifier: AzureApi
parameters:
-   name: Method
    default_value: GET
    type: ddl
    optional_values:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - HEAD
    - OPTIONS
    description: The HTTP method (verb) used for the request.
    is_mandatory: true
-   name: URL Path
    default_value: https://
    type: string
    description: The API endpoint where the request executes. This path can optionally
        include query parameters.
    is_mandatory: true
-   name: URL Params
    default_value: '{"URL Field Name": "URL Field Value"}'
    type: string
    description: The query parameters (GET parameters) for the URL, provided as a
        JSON object where each key-value pair is a parameter. This is the recommended
        input method. These values are used in addition to any query parameters included
        in the URL Path.
    is_mandatory: false
-   name: Headers
    default_value: '{"Content-Type": "application/json; charset=utf-8", "Accept":
        "application/json", "User-Agent" : "AzureApi"}'
    type: string
    description: The headers for the HTTP request, specified as a JSON object. Headers
        control aspects such as authentication and define the format of the Body Payload
        (using Content-Type).
    is_mandatory: false
-   name: Cookie
    default_value: '{"Cookie_1": "value_1"}'
    type: string
    description: The cookies constructed into the HTTP Cookie header, specified as
        a JSON object. This parameter overrides any cookie values provided in Headers.
    is_mandatory: false
-   name: Body Payload
    default_value: '{"Body Field Name": "Body Field Value"}'
    type: string
    description: The content payload for the HTTP request, specified as a JSON object.
        The request's format (JSON or form-urlencoded) is determined by the Content-Type
        set in Headers.
    is_mandatory: false
-   name: Expected Response Values
    default_value: ''
    type: string
    description: 'The JSON object containing the field-value pairs that define the
        required successful state of the response. If provided, the action runs in
        asynchronous  mode and repeatedly executes the request until the expected
        values appear in the response or until the action times out. Example input:
        {"key": "expected value"}'
    is_mandatory: false
-   name: Follow Redirects
    default_value: 'true'
    type: boolean
    description: If selected, the action automatically follows any HTTP redirect responses
        (such as 301 or 302 status codes) to the final destination URL.
    is_mandatory: false
-   name: Fail on 4xx/5xx
    default_value: 'true'
    type: boolean
    description: If selected, the action explicitly fails the step when the HTTP response
        returns a Client Error (4xx) or Server Error (5xx) status code.
    is_mandatory: false
-   name: Base64 Output
    default_value: 'false'
    type: boolean
    description: 'If selected, the action converts the entire HTTP response body to
        a Base64 encoded string. This is useful when you download files that need
        to be processed or stored. Note: The resulting Base64 string cannot exceed
        15 MB.'
    is_mandatory: false
-   name: Fields To Return
    default_value: response_data, redirects, response_code,response_cookies,response_headers,apparent_encoding
    type: string
    description: 'A comma-separated list of fields that the action returns in the
        output. Possible values: response_data, redirects, response_code, response_cookies,
        response_headers, apparent_encoding.'
    is_mandatory: true
-   name: Request Timeout
    default_value: '120'
    type: string
    description: The maximum time, in seconds, the action waits for the server to
        send data before the request is aborted.
    is_mandatory: true
-   name: Save To Case Wall
    default_value: 'false'
    type: boolean
    description: 'If selected, the action saves the file and attaches it to the case
        wall. Note: The file is archived with “.zip” extension. This zip isn''t password
        protected.'
    is_mandatory: false
-   name: Password Protect Zip
    default_value: 'true'
    type: boolean
    description: If selected, the action encrypts the downloaded ZIP archive (created
        using Save To Case Wall) with a password (such as infected). Use this option
        when dealing with suspicious or potentially malicious files to prevent accidental
        execution.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/execute_http_request_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities":[]}'
