name: Get Authorization
description: Use the Get Authorization action to initiate the OAuth flow and obtain
    a link that contains the required access code for delegated authentication. This
    action doesn't run on Google SecOps entities.
integration_identifier: AzureApi
parameters:
-   name: Oauth Scopes
    default_value: user.read, offline_access
    type: string
    description: A comma-separated list of permissions requested for the access and
        refresh tokens. These scopes define the level of access the integration has
        to the user's data and resources.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
