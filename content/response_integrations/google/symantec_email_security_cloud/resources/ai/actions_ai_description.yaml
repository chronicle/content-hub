Block Entities:
  ai_description: >-
    ### General Description

    Blocks specific entities in Symantec Email Security.Cloud. Supported entities
    include Hostname, IP address, URL, Filehash, Email Subject, and Email Address
    (user entity that matches email regex).


    ### Flow Description

    1. Extracts the integration configuration and action parameters.

    2. Iterates through the target entities provided in the case.

    3. Filters entities to ensure they match the supported types (Address, Hostname,
    User, URL, Filehash, Email Message).

    4. Validates the format of Filehash (MD5 or SHA256) and User (valid email address)
    entities.

    5. Maps the supported entities to their corresponding Symantec Email Security.Cloud
    IOC types.

    6. Makes a POST request to the Symantec Email Security.Cloud API (`/domains/global/iocs/upload`)
    to block the mapped IOCs with the specified remediation action and description.

    7. Evaluates the API response and returns a JSON result indicating the success
    or failure of the block action for each entity.


    ### Additional Notes

    - Only MD5 and SHA256 hashes are supported.

    - All of the entities are treated as "sender IOCs" during blocking.
  ai_short_description: >-
    Blocks specific entities (Hostname, IP address, URL, Filehash, Email Subject,
    Email Address) in Symantec Email Security.Cloud by adding them to the blocklist
    with a specified remediation action.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the provided entities to the blocklist in Symantec Email Security.Cloud
      with the specified remediation action.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a POST request to the Symantec Email Security.Cloud API
      to block entities, which mutates external data. It does not fetch enrichment
      data, mutate internal data, update entities, or create insights.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
