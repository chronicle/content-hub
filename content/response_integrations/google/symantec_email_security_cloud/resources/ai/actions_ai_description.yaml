    | Remediation Action | Dropdown | No | Specify the remediation action for the
    entities. Supported values: Block and Delete, Quarantine, Redirect, Tag Subject,
    Append Header. |

    | Description | String | Yes | Specify a description that should be added to the
    blocked entities. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Symantec Email Security.Cloud platform to ensure that
    the integration is configured correctly and can communicate with the API.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Root, Username,
    Password, Verify SSL).

    2. Initializes the Symantec Email Security.Cloud manager.

    3. Makes an HTTP GET request to the `/domains/global/iocs/download` endpoint to
    verify API access and credentials.

    4. Returns a success message if the connection is established, otherwise returns
    an error.


    ### Additional Notes

    This action is typically used to verify integration settings and does not process
    any entities or alerts.
