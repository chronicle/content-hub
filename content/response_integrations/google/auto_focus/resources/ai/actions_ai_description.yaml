Hunt Domain:
  ai_description: >-
    ### General Description

    Initiates an asynchronous hunt for Domain (Hostname) entities in Palo Alto AutoFocus
    to retrieve associated intelligence and tags.


    ### Flow Description

    1. Iterates over target entities of type Hostname.

    2. Initiates a hunt query in AutoFocus for each domain using the AutoFocus API
    (`samples_search`).

    3. Asynchronously polls the AutoFocus API (`samples_results`) to check the status
    of the hunt using the returned cookie.

    4. Once completed, retrieves the hunt results (hits).

    5. Enriches the entity with the retrieved data, marks it as suspicious, and attaches
    a CSV table and JSON report.

    6. Creates an insight for the entity with the number of hits found and updates
    the entity in the platform.


    ### Additional Notes

    This action runs asynchronously. It relies on integration-level parameters for
    API keys and result limits.
  ai_short_description: >-
    Initiates an asynchronous hunt for Domain (Hostname) entities in Palo Alto AutoFocus
    to retrieve associated intelligence and tags, enriching the entities with the
    results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entity properties, adds insights, tables, and attachments based on hunt
      results.
    reasoning: >-
      The action fetches data from AutoFocus by initiating a hunt and retrieving results
      (fetches_data=True). It does not mutate external data. It mutates internal data
      by updating entities, adding insights, tables, and attachments (can_mutate_internal_data=True,
      can_update_entities=True, can_create_insight=True). It does not modify alert
      data or create case comments.
