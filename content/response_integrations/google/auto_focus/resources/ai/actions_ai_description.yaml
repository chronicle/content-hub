    ### General Description

    Hunts an IP address in Palo Alto AutoFocus to retrieve a list of associated tags
    and threat intelligence. This action initiates an asynchronous search for the
    IP address and retrieves detailed information about associated samples and hits.


    ### Flow Description

    1. Iterates over the target entities and filters for IP Address entities.

    2. Initiates an asynchronous hunt query in AutoFocus for each valid IP address
    using the `samples_search` API.

    3. Periodically checks the status of the hunt queries using the `samples_results`
    API.

    4. Once a query is completed, retrieves the hunt results (hits).

    5. Enriches the entity with the retrieved data, attaches a CSV table of the hits,
    and attaches a JSON report.

    6. Marks the entity as enriched and suspicious, creates an insight with the number
    of hits found, and updates the entity in the platform.


