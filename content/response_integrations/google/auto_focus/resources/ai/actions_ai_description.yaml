Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the AutoFocus API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Extracts the API key from the integration configuration.

    2. Initializes the `AutoFocusManager` with the provided credentials.

    3. Executes the `test_connectivity` method, which performs a sample search query
    for the IP address "8.8.8.8" via the AutoFocus API.

    4. Evaluates the response; if the API call completes without exceptions, it returns
    a success message. Otherwise, it catches the exception and returns a failure message.


    ### Additional Notes

    This action does not process any alerts or entities and is solely intended for
    verifying credential validity and network connectivity to the AutoFocus service.
