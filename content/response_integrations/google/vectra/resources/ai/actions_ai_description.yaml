Update Note:
  ai_description: >-
    ### General Description

    Updates a note for a specific endpoint or detection in Vectra.


    ### Flow Description

    1. Validates the existence of the specified endpoint or detection in Vectra by
    making a GET request to the Vectra API.

    2. If the item exists, makes a PATCH request to the Vectra API to update the note
    field with the provided text.

    3. Returns a success message if the note is updated successfully, or an error
    message if the item is not found or the update fails.


    ### Additional Notes

    There are no additional notes for this action.
