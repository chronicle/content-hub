Enrich Endpoint:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities by fetching endpoint system information
    and threat details from Vectra. This action retrieves contextual metadata about
    internal assets to aid in investigation and response.


    ### Flow Description

    1. Iterates over the target entities and filters for those of type `ADDRESS` (IP
    Address) or `HOSTNAME`.

    2. For each suitable entity, makes a GET request to the Vectra API (`api/v2.1/hosts`)
    to retrieve endpoint details based on the entity's identifier.

    3. Filters the returned endpoints to find an exact match for the entity's identifier
    (matching either the name or IP).

    4. If a match is found, extracts enrichment data (including state, threat score,
    certainty, tags, and privilege level) and updates the entity's `additional_properties`.

    5. Marks the entity as enriched and calls the SecOps platform to save the updated
    entities.

    6. Attaches the raw JSON and a CSV table of the endpoint details to the action
    results.


    ### Additional Notes

    - If multiple matching endpoints are found in Vectra for a single entity, the
    action will only use the first match for enrichment.

    - Entities that do not return any matching endpoints from Vectra will be skipped
    and reported as failed in the output message.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by retrieving endpoint system information
    and threat details from Vectra.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the target entities' additional properties with enrichment data retrieved
      from Vectra.
    reasoning: >-
      The action fetches data from the Vectra API via a GET request to retrieve endpoint
      details. It does not mutate external data. It mutates internal data by updating
      the entities' additional properties with the fetched enrichment data and calling
      `siemplify.update_entities`. It does not create insights, modify alert data,
      or create case comments.
