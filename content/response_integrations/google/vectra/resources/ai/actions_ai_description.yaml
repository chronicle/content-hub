Add Tags:
  ai_description: >-
    ### General Description

    Adds tags to a specific endpoint or detection in Vectra. This action modifies
    the external item by appending new tags to its existing tag list.


    ### Flow Description

    1. Retrieves the current information of the specified endpoint or detection from
    Vectra via an HTTP GET request to obtain its existing tags.

    2. Parses the provided comma-separated tags and appends them to the existing tags
    list.

    3. Makes an HTTP PATCH request to the Vectra API to update the tags for the specified
    item.

    4. Returns a success message if the tags are successfully added, or an error message
    if the item is not found or the update fails.


    ### Additional Notes

    - The tags should be provided as a comma-separated string (e.g., `tag1, tag2`).

    - The action requires the specific Vectra Item ID for the endpoint or detection.
  ai_short_description: >-
    Adds tags to a specific endpoint or detection in Vectra.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the tags of a specific endpoint or detection in Vectra.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches the current state of the item to append tags, and then mutates
      external data by making a PATCH request to Vectra to update the tags. It does
      not fetch contextual data for enrichment purposes, nor does it mutate internal
      SecOps data, update entities, or create insights.
