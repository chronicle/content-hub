Remove Tags:
  ai_description: >-
    ### General Description

    Removes specified tags from an endpoint or detection in Vectra. This action modifies
    the metadata of an existing item in the Vectra platform by removing one or more
    tags.


    ### Flow Description

    1. The action receives the `Item Type` (Endpoint or Detection), `Item ID`, and
    a comma-separated list of `Tags` to remove.

    2. It makes a GET request to the Vectra API to retrieve the current information
    and existing tags for the specified item.

    3. It calculates the new list of tags by removing the specified tags from the
    existing ones.

    4. It makes a PATCH request to the Vectra API (`/api/v2.1/tagging/host/{item_id}`
    or `/api/v2.1/tagging/detection/{item_id}`) to update the item with the new tag
    list.

    5. The action returns a success message if the tags were successfully removed.


    ### Additional Notes

    If the specified tags do not exist on the item, the action will fail and report
    that the tags were not found.
