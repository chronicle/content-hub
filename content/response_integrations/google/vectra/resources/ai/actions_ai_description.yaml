Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Vectra API using the provided integration configuration
    parameters. This action ensures that the Google SecOps platform can successfully
    authenticate and communicate with the Vectra server.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Root, API Token,
    Verify SSL).

    2. Initializes the Vectra API client.

    3. Makes an HTTP GET request to the Vectra `api/v2.1/hosts` endpoint to verify
    connectivity.

    4. Returns a successful execution status if the API responds without errors, otherwise
    returns a failure status.


    ### Additional Notes

    This action does not require any action-specific parameters and does not interact
    with case entities. It is primarily used for initial setup and troubleshooting
    of the Vectra integration.
