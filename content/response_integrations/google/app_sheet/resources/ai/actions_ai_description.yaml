Delete Record:
  ai_description: >-
    ### General Description

    Deletes a specific record from a designated table in AppSheet. This action initiates
    a state change on the external AppSheet application by removing the specified
    row based on the provided JSON query.


    ### Flow Description

    1. Extracts the `Table Name` and `Record JSON Object` parameters provided by the
    user.

    2. Initializes the AppSheet API client with the configured integration credentials.

    3. Sends an HTTP POST request to the AppSheet API (`/api/v2/apps/{app_id}/tables/{table_name}/Action`)
    with the action set to 'Delete' and the provided JSON object as the target row.

    4. Evaluates the API response to confirm the deletion and attaches the deleted
    record details to the action's JSON results.


    ### Additional Notes

    The `Record JSON Object` parameter must be a valid JSON string containing the
    unique identifier (e.g., the "ID" key) of the record to be deleted.
