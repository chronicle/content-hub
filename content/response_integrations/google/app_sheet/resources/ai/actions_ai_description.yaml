    Adds a record to a table in AppSheet.


    ### Flow Description

    1. Extracts the integration configuration and action parameters.

    2. Initializes the AppSheet API client.

    3. Sends a POST request to the AppSheet API to add a new record to the specified
    table using the provided JSON object.

    4. Returns the added record details as a JSON result to the playbook.


