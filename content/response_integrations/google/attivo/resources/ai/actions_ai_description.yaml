Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Attivo server using the provided integration configuration
    parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the `AttivoManager` and generates an access token by making a POST
    request to the `/api/auth/login` endpoint.

    3. Makes a POST request to the `/api/eventsquery/alerts` endpoint to verify connectivity.

    4. Returns a success message if the connection is established, otherwise returns
    an error.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can communicate with the Attivo instance.
