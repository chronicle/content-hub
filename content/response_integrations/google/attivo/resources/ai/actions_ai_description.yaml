    enrich_ioc: true
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action fetches endpoint details, threat paths, vulnerabilities, and credential
      information for Hostname and IP Address entities from Attivo. This aligns with
      the 'Enrich Asset' category for Hostnames (returning contextual metadata like
      OS and MAC address) and the 'Enrich IOC' category for IP Addresses (returning
      threat intelligence).
