List Service ThreatPaths:
  ai_description: >-
    ### General Description

    Retrieves a list of ThreatPaths related to specified services from Attivo. This
    action queries the Attivo platform to find potential attack paths associated with
    the provided services and returns the data for further analysis.


    ### Flow Description

    1. Extracts the list of services and the maximum number of ThreatPaths to return
    from the action parameters.

    2. Initializes the Attivo API client using the provided integration configuration.

    3. Iterates through the provided services and makes a POST request to the Attivo
    API (`/api/threatpath/getallpathsforservice`) to fetch the ThreatPaths for each
    service.

    4. Formats the retrieved ThreatPaths into a CSV table and JSON results for each
    successful service.

    5. Returns the aggregated results and status to the Google SecOps platform.


    ### Additional Notes

    The action accepts a comma-separated list of services. If no limit is provided,
    it defaults to returning a maximum of 50 ThreatPaths per service.
