Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities using information from Attivo. This
    action retrieves detailed endpoint information, including OS details, MAC addresses,
    and user information, as well as associated threat paths, vulnerabilities, and
    deceptive credentials.


    ### Flow Description

    1. Iterates over the target entities, filtering for Hostname and IP Address types.

    2. Makes a POST request to the Attivo API to fetch endpoint information for each
    valid entity.

    3. If configured, makes additional POST requests to retrieve related ThreatPaths,
    vulnerabilities, and credential information.

    4. Updates the entity's additional properties with the retrieved data and marks
    it as enriched.

    5. Creates an insight for the entity if the `Create Insights` parameter is enabled.

    6. Attaches the retrieved data as entity tables and JSON results to the case.

    7. Updates the entities within the Google SecOps platform.


    ### Additional Notes

    None.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by retrieving endpoint details, threat
    paths, vulnerabilities, and credential information from Attivo.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes POST requests to the Attivo API to fetch endpoint information,
      threat paths, vulnerabilities, and credentials. It does not mutate external
      data. It updates the entities in Google SecOps with the fetched data and creates
      insights.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
