List Critical ThreatPath:
  ai_description: >-
    ### General Description

    Retrieves a list of available critical ThreatPaths from Attivo based on specified
    filtering criteria.


    ### Flow Description

    1. Initializes connection with the Attivo API using the provided integration configuration.

    2. Makes a POST request to the `/api/threatpath/getallcriticalpaths` endpoint
    to fetch all critical ThreatPaths.

    3. Applies filtering to the retrieved ThreatPaths based on the `Filter Key`, `Filter
    Logic`, and `Filter Value` parameters.

    4. Truncates the results to the specified `Max Records To Return` limit.

    5. Outputs the final list of ThreatPaths as a JSON result and attaches a data
    table to the action results.


    ### Additional Notes

    If the `Filter Key` is set to 'Select One' but a `Filter Logic` of 'Equal' or
    'Contains' is provided, the action will fail and prompt the user to select a valid
    field.
  ai_short_description: >-
    Retrieves a list of available critical ThreatPaths from Attivo based on specified
    filtering criteria.
