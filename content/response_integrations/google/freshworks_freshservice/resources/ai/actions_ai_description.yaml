Add Ticket Time Entry:
  ai_description: >-
    ### General Description

    Adds a time entry to a specific ticket in Freshworks Freshservice.


    ### Flow Description

    1. Retrieves the list of agents from Freshservice to resolve the provided Agent
    Email to an Agent ID.

    2. Makes a POST request to the Freshservice API to add a time entry to the specified
    ticket using the resolved Agent ID, time spent, and other provided details.

    3. Returns the created time entry details as a JSON result.


    ### Additional Notes

    This action does not operate on Google SecOps entities.
