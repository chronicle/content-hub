Create Ticket:
  ai_description: >-
    ### General Description

    Creates a new incident ticket in Freshservice. The action allows specifying various
    ticket details including subject, description, requester email, assignment details
    (agent, group, department), priority, urgency, impact, tags, custom fields, and
    file attachments.


    ### Flow Description

    1. Extracts the provided action parameters and integration configuration.

    2. Validates the existence and total size (must not exceed 15MB) of any provided
    file attachments.

    3. Parses the provided tags and custom fields into appropriate formats.

    4. If specified, queries Freshservice to resolve the Agent Email, Group Name,
    and Department Name to their respective internal IDs.

    5. Sends a POST request to the Freshservice API to create the new ticket with
    the mapped parameters and attachments.

    6. Returns the created ticket details as a JSON object in the action results.


    ### Additional Notes

    As of now, the Freshservice API supports only the creation of tickets with the
    type "Incident". The ticket's priority is dynamically calculated according to
    the "Urgency" and "Impact" values in the Freshservice UI, but can be explicitly
    set here.
