Add a Ticket Note:
  ai_description: >-
    ### General Description

    Adds a note to a specific ticket in Freshservice. This action allows analysts
    to append private or public notes to an existing ticket directly from the SOAR
    platform.


    ### Flow Description

    1. Extracts the Ticket ID, Note Type, and Note Text from the action parameters.

    2. Validates that the Ticket ID is a positive number.

    3. Makes a POST request to the Freshservice API (`/api/v2/tickets/{ticket_id}/notes`)
    to add the note to the specified ticket.

    4. Returns the conversation details as a JSON result and outputs a success message.


