Update Ticket:
  ai_description: >-
    ### General Description

    Updates an existing ticket in Freshservice with new properties such as status,
    priority, assignee, and attachments.


    ### Flow Description

    1. Extracts the provided action parameters including the Ticket ID and fields
    to update.

    2. Validates the Ticket ID and checks the existence and size of any provided file
    attachments (total size must not exceed 15MB).

    3. If an agent email or group name is provided, makes API calls to Freshservice
    to resolve them to their respective IDs.

    4. Constructs the update payload with the provided fields.

    5. Makes a PUT request to the Freshservice API (`/api/v2/tickets/{ticket_id}`)
    to update the ticket.

    6. Returns the updated ticket details as a JSON result.


    ### Additional Notes

    Due to Freshservice API limitations, providing new tags will replace the existing
