Update Ticket Time Entry:
  ai_description: >-
    ### General Description

    Updates an existing time entry for a specific ticket in Freshservice. This action
    allows users to modify details such as the time spent, billable status, notes,
    and custom fields associated with a ticket's time entry.


    ### Flow Description

    1. Extracts and validates the provided parameters, ensuring the Ticket ID and
    Time Entry ID are positive integers.

    2. If an `Agent Email` is provided, makes a GET request to the Freshservice API
    to retrieve the list of agents and resolves the email to an Agent ID.

    3. Makes a PUT request to the Freshservice API (`/api/v2/tickets/{ticket_id}/time_entries/{time_entry_id}`)
    to update the time entry with the specified parameters.

    4. Outputs the updated time entry details as a JSON result and completes the action.


    ### Additional Notes

    This action does not operate on Google SecOps entities.
