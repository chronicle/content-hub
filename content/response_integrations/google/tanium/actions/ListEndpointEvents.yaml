name: List Endpoint Events
description: 'List events related to the endpoints from Tanium. Action works with
    Tanium Threat Response API. Supported Entities: Hostname, IP Address.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#list_endpoint_events
integration_identifier: Tanium
parameters:
-   name: Event Type
    default_value: Combined
    type: ddl
    optional_values:
    - File
    - Network
    - Process
    - Registry
    - Driver
    - Combined
    - DNS
    - Image
    description: Specify the type of the event that needs to be returned.
    is_mandatory: false
-   name: Time Frame
    default_value: Last Hour
    type: ddl
    optional_values:
    - Last Hour
    - Last 6 Hours
    - Last 24 Hours
    - Last Week
    - Last Month
    - Alert Time Till Now
    - 5 Minutes Around Alert Time
    - 30 Minutes Around Alert Time
    - 1 Hour Around Alert Time
    - Custom
    description: Specify a time frame for the results. If "Alert Time Till Now" is
        selected, action will use start time of the alert as start time for the search
        and end time will be current time. If "30 Minutes Around Alert Time" is selected,
        action will search the alerts 30 minutes before the alert happened till the
        30 minutes after the alert has happened.  Same idea applies to "1 Hour Around
        Alert Time" and "5 Minutes Around Alert Time". If "Custom" is selected, you
        also need to provide "Start Time".
    is_mandatory: false
-   name: Start Time
    default_value: ''
    type: string
    description: 'Specify the start time for the results. This parameter is mandatory,
        if "Custom" is selected for the "Time Frame" parameter. Format: ISO 8601'
    is_mandatory: false
-   name: End Time
    default_value: ''
    type: string
    description: 'Specify the end time for the results. Format: ISO 8601. If nothing
        is provided and "Custom" is selected for the "Time Frame" parameter then this
        parameter will use current time.'
    is_mandatory: false
-   name: Sort Field
    default_value: timestamp
    type: string
    description: Specify what parameter should be used for sorting.
    is_mandatory: false
-   name: Sort Order
    default_value: ASC
    type: ddl
    optional_values:
    - ASC
    - DESC
    description: Specify the order of sorting.
    is_mandatory: false
-   name: Max Events To Return
    default_value: 50
    type: string
    description: 'Specify how many events to return per entity. Default: 50. Maximum:
        500.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_endpoint_events_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
