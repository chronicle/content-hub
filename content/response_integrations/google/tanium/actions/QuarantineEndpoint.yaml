name: Quarantine Endpoint
description: 'Quarantine the endpoints in Tanium. Action works with Tanium Threat
    Response API. Supported Entities: Hostname, IP Address. Note: Action is running
    as async, if "Only Initiate" is set to false, please adjust script timeout value
    in Siemplify IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#quarantine_endpoint
integration_identifier: Tanium
parameters:
-   name: Only Initiate
    default_value: false
    type: boolean
    description: If enabled, action will only initiate the task execution without
        waiting for results.
    is_mandatory: false
-   name: Package Names
    default_value: '{"Linux":"Apply Linux IPTables Quarantine","Mac":"Apply Mac PF
        Quarantine","Windows":"Apply Windows IPsec Quarantine"}'
    type: string
    description: Specify a JSON object containing all of the package names for each
        OS.
    is_mandatory: true
-   name: Package Parameters
    default_value: ''
    type: string
    description: 'Specify a JSON object containing all of the parameters for the package
        being deployed. If nothing is provided, action will use the following payload:
        [{"key":"$1","value":null},

        {"key":"$2","value":null},

        {"key":"$3","value":null},

        {"key":"$4","value":null},

        {"key":"$5","value":null},

        {"key":"$6","value":null},

        {"key":"$7","value":null},

        {"key":"$8","value":null},

        {"key":"$9","value":null}]'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/quarantine_endpoint_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
