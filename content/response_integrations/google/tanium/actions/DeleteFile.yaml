name: Delete File
description: 'Download a file from endpoints in Tanium. Action works with Tanium Threat
    Response API. Supported Entities: Hostname, IP Address.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#delete_file
integration_identifier: Tanium
parameters:
-   name: File Paths
    default_value: ''
    type: string
    description: Specify the absolute path of the files on the endpoint that needs
        to be deleted.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/delete_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
