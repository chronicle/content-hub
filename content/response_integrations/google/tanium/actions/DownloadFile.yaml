name: Download File
description: 'Download a file from endpoints in Tanium. Action works with Tanium Threat
    Response API. Supported Entities: Hostname, IP Address. Note: Action is running
    as async, please adjust script timeout value in Siemplify IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#download_file
integration_identifier: Tanium
parameters:
-   name: File Paths
    default_value: ''
    type: string
    description: Specify the absolute path of the files on the endpoint that needs
        to be downloaded.
    is_mandatory: true
-   name: Download Folder Path
    default_value: ''
    type: string
    description: Specify the path to the folder, where you want to store the files.
    is_mandatory: true
-   name: Overwrite
    default_value: false
    type: boolean
    description: If enabled, action will overwrite the file with the same name.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/download_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
