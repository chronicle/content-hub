name: Enrich Entities
description: 'Enrich entities using information from Tanium. Supported entities: Hostname,
    IP Address.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#enrich_entities
integration_identifier: Tanium
parameters:
-   name: Additional Fields
    default_value: ''
    type: string
    description: Specify additional fields to fetch from Tanium for entity enrichment.
        Parameter accepts multiple values as a comma separated string.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
