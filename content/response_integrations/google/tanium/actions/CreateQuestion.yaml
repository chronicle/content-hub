name: Create Question
description: Create a new Tanium question based on the specified parameters, and the
    question is immediately asked. Action returns question id that can be passed to
    “Get Question Results” action to get question results. Note that the action is
    not working with Siemplify entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#create_question
integration_identifier: Tanium
parameters:
-   name: Question Text
    default_value: ''
    type: string
    description: 'Specify the contents of Tanium question. Example: Get Operating
        System from all machines'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/create_question_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
