name: Get Question Results
description: Fetch results for the Tanium question. Action is a Siemplify async action.
    Note that the action is not working with Siemplify entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#get_question_results
integration_identifier: Tanium
parameters:
-   name: Question ID
    default_value: ''
    type: string
    description: Specify Tanium question id to get results for.
    is_mandatory: true
-   name: Create Case Wall Table
    default_value: true
    type: boolean
    description: If enabled, action will create a case wall table as part of action
        results.
    is_mandatory: false
-   name: Max Rows to Return
    default_value: '50'
    type: string
    description: Specify the max number of rows action should return for the question.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_question_results_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
