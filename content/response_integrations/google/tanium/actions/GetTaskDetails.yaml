name: Get Task Details
description: 'Retrieve details about a task in Tanium. Action works with Tanium Threat
    Response API. Note: Action is running as async, if "Wait For Completion" is enabled,
    please adjust script timeout value in Siemplify IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tanium#get_task_details
integration_identifier: Tanium
parameters:
-   name: Task IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of task ids for which you want to
        fetch details.
    is_mandatory: true
-   name: Wait For Completion
    default_value: true
    type: boolean
    description: If enabled, action will wait for the task to have status "Completed",
        "Incomplete", "Error".
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_task_details_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
