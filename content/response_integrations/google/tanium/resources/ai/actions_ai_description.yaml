Delete File:
  ai_description: >-
    ### General Description

    Deletes specified files from remote endpoints using the Tanium Threat Response
    API. This action targets Hostname and IP Address entities to remove potentially
    malicious or unwanted files based on their absolute file paths.


    ### Flow Description

    1. **Connection Retrieval:** The action fetches all currently open connections
    from the Tanium server.

    2. **Entity Matching:** It iterates through the target entities (Hostname or IP
    Address) and matches their identifiers against the retrieved Tanium connections.

    3. **Connection Management:** If a matching connection is found but is not active,
    the action attempts to create or enable the connection and waits for it to reach
    a 'connected' status.

    4. **File Deletion:** For each active connection, the action iterates through
    the provided list of file paths and issues a DELETE request to the Tanium API
    (`/plugin/products/threat-response/api/v1/conns/{connection_id}/file/delete/{file_path}`)
    for each file.

    5. **Result Aggregation:** The action tracks the success or failure of each file
    deletion per entity and returns a detailed JSON result summarizing the outcome.


    ### Additional Notes

    Tanium may return a status code 500 if the file is not found or if there are other
    challenges during deletion. Ensure that the Tanium Threat Response agent is connected
    properly and the hostname/IP address is correct.
  ai_short_description: >-
    Deletes specified files from remote endpoints using the Tanium Threat Response
    API based on provided absolute file paths.
