Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches **Hostname** and **IP Address** entities by retrieving comprehensive
    system information from Tanium. This action helps analysts understand the state
    of an endpoint by providing data such as Operating System details, system uptime,
    domain membership, and current user sessions.


    ### Flow Description

    1. **Initialization**: Filters the target entities to identify supported Hostnames
    and IP Addresses.

    2. **Question Creation**: For each entity, it constructs and submits a Tanium
    "Question" (a query) requesting standard system fields plus any user-specified
    "Additional Fields".

    3. **Asynchronous Polling**: Since Tanium queries can take time, the action enters
    an asynchronous state, periodically checking the status of the submitted questions.

    4. **Data Retrieval**: Once the results are ready, the action fetches the raw
    data from Tanium.

    5. **Enrichment**: The retrieved data is parsed and mapped to the entity's additional
    properties in Google SecOps.

    6. **Output**: Updates the entities, attaches a CSV-formatted data table to each
    entity, and provides a JSON result for further playbook logic.


    ### Additional Notes

    This is an asynchronous action. It will remain in an "In Progress" state until
    Tanium returns the results or a timeout occurs.
