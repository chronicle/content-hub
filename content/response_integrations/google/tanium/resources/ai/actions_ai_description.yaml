List Endpoint Events:
  ai_description: >-
    ### General Description

    The **List Endpoint Events** action retrieves historical event data from endpoints
    managed by the Tanium Threat Response module. It allows security analysts to query
    specific types of telemetry (such as process executions, network connections,
    or file changes) for Hostname and IP Address entities within a defined timeframe.
    This action is particularly useful for forensic investigations and incident response
    to understand activity on a compromised host.


    ### Flow Description

    1. **Initialization:** The action parses the Tanium API configuration and user-provided
    parameters, including event filters and sorting preferences.

    2. **Time Calculation:** It determines the precise start and end timestamps based
    on the selected 'Time Frame' or 'Custom' inputs.

    3. **Connection Discovery:** It retrieves a list of all open connections from
    the Tanium Threat Response module.

    4. **Entity Processing:** For each supported entity (IP or Hostname):
        - It matches the entity to an existing Tanium connection.
        - If a connection exists but is not active, it sends a request to Tanium to
    establish/enable the connection and waits for it to become ready.
    5. **Data Retrieval:** Once a connection is active, it queries the Tanium API
    for events matching the specified type and time range.

    6. **Result Aggregation:** The retrieved events are formatted into a JSON object
    and returned to the Google SecOps case.


    ### Additional Notes

    - **Connection Management:** If an endpoint is known to Tanium but the connection
    is currently inactive, the action will attempt to initiate a connection to the
    endpoint before fetching events.

    - **Timeframe Logic:** If 'Alert Time Till Now' or 'Around Alert Time' options
    are selected, the action uses the start and end times associated with the Google
    SecOps alert context.
