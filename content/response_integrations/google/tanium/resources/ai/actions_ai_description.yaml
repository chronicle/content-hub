    ### General Description

    Quarantines endpoints in Tanium using the Threat Response API. This action supports
    Hostname and IP Address entities and allows for platform-specific quarantine packages
    to be applied. It can operate in a synchronous mode (waiting for completion) or
    an asynchronous mode (initiating and exiting).


    ### Flow Description

    1. **Entity Filtering**: Identifies supported entities (Hostname and IP Address)
    from the target list.

    2. **Connection Check**: Retrieves current open connections from Tanium to find
    a match for each entity.

    3. **Connection Management**: If a connection exists but is disabled, the action
    attempts to create/enable it and waits for it to become active.

    4. **Task Initiation**: Initiates a quarantine task on the endpoint using the
    OS-specific package name provided in the parameters.

    5. **Status Polling**: If `Only Initiate` is false, the action enters an asynchronous
    polling loop to monitor the task's status (COMPLETED, INCOMPLETE, or ERROR).

    6. **Result Reporting**: Aggregates the results, provides a summary message, and
    attaches detailed JSON data for each entity.


    ### Additional Notes

    - This action is asynchronous. If `Only Initiate` is set to false, ensure the
    script timeout in the Siemplify IDE is adjusted to allow for task completion.

    - The action may attempt to create or enable a connection in Tanium if the target
    endpoint is not currently connected.

    - `Package Names` and `Package Parameters` must be valid JSON strings.
