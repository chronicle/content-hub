      The action fetches endpoint details from Tanium using a GET request (fetches_data=true).
      It then mutates external data by sending a POST request to create a live response
      connection on the Tanium server (can_mutate_external_data=true). It does not
      mutate internal data, update entities, create insights, modify alerts, or create
      case comments.
