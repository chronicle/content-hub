Get Task Details:
  ai_description: >-
    ### General Description

    Retrieves comprehensive details and current status for a specified list of task
    IDs from Tanium Threat Response. This action is primarily used to monitor the
    progress of asynchronous operations initiated in Tanium, such as deployments,
    intel updates, or data collections. It can operate in a synchronous mode or an
    asynchronous polling mode to wait for task completion.


    ### Flow Description

    1. **Initialization**: The action parses the comma-separated `Task IDs` and retrieves
    the `Wait For Completion` setting.

    2. **API Request**: It connects to the Tanium Threat Response API and performs
    a GET request for each task ID to retrieve its metadata, status, and results.

    3. **Async Polling Logic**: If `Wait For Completion` is enabled, the action checks
    if the tasks are in a terminal state (COMPLETED, INCOMPLETE, or ERROR). If any
    tasks are still pending, the action returns an 'In Progress' status to the SOAR,
    allowing it to resume and poll again later.

    4. **Timeout Management**: During polling, the script monitors the global execution
    deadline and process timeout. If a timeout is approaching, it gracefully exits
    or raises an exception to prevent abrupt termination.

    5. **Data Aggregation**: Once tasks are finished (or if polling is disabled),
    the action aggregates the JSON metadata for all successfully retrieved tasks.

    6. **Final Output**: It produces a summary message indicating which tasks were
    found or failed and attaches the full task details as a JSON result.


    ### Additional Notes

    - This action is specifically designed for the Tanium Threat Response module.

    - When `Wait For Completion` is enabled, ensure that the action's timeout in the
    Google SecOps IDE is set high enough to accommodate the expected duration of the
    tasks being monitored.
  ai_short_description: >-
    Retrieves comprehensive details and current status for a specified list of task
