Create Connection:
  ai_description: >-
    ### General Description

    This action establishes a live response connection to a remote endpoint within
    the Tanium Threat Response module. Creating a connection is a prerequisite for
    performing live response tasks, such as file collection or process management,
    on a target host. The action supports both Hostname and IP Address entities.


    ### Flow Description

    1. **Initialization**: Initializes the Tanium Manager using the integration's
    API credentials.

    2. **Entity Filtering**: Filters the target entities to process only Hostname
    and IP Address entities.

    3. **Endpoint Resolution**: For each suitable entity, queries the Tanium Asset/DEC
    API (via GET request) to retrieve specific endpoint details, including the `clientId`,
    `platform`, and canonical IP/Hostname.

    4. **Connection Creation**: If endpoint details are found, sends a POST request
    to the Tanium Threat Response API to initiate a connection to that specific endpoint.

    5. **Result Processing**: Collects the connection status for each entity and returns
    a summary message along with the raw JSON response from Tanium.


    ### Additional Notes

    - The action first attempts to resolve the entity (IP or Hostname) to a Tanium-specific
    `clientId` and `platform` before initiating the connection request.

    - If no matching endpoint is found in Tanium for a given entity, the connection
    attempt for that entity will fail.
  ai_short_description: >-
    Establishes a live response connection to a remote endpoint within the Tanium
    Threat Response module using Hostname or IP Address entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a new live response connection to a specific endpoint within the Tanium
      Threat Response module.
    fetches_data: true
