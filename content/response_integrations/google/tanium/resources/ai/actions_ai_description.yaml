Get Question Results:
  ai_description: >-
    ### General Description

    Fetches results for a specific Tanium question using its unique ID. This action
    operates asynchronously, polling the Tanium API for results until they are ready
    or the execution times out. It retrieves data from previously asked questions
    in Tanium without requiring specific entities as input.


    ### Flow Description

    1. Extracts the `Question ID`, `Max Rows to Return`, and `Create Case Wall Table`
    parameters.

    2. Makes a GET request to the Tanium API to fetch the results for the specified
    Question ID.

    3. If results are available, parses the data up to the specified row limit and
    adds it to the action's JSON results.

    4. If `Create Case Wall Table` is enabled, creates a formatted data table in the
    case wall containing the retrieved results.

    5. If results are not yet available, the action sets its status to in-progress
    and retries in the next cycle until a timeout is reached.


    ### Additional Notes

    - This action does not process or require Google SecOps entities.

    - It uses an asynchronous execution model to handle Tanium's question-answering
    lifecycle.
  ai_short_description: >-
    Fetches results for a specific Tanium question using its unique ID asynchronously,
    returning the data as JSON and optionally as a case wall table.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a GET request to the Tanium API to retrieve
