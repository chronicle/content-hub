Create Question:
  ai_description: >-
    ### General Description

    Creates a new Tanium question based on the provided text. The question is immediately
    asked in the Tanium environment, and the action returns a unique question ID.
    This ID can be used in subsequent actions, such as 'Get Question Results', to
    retrieve the data collected from endpoints.


    ### Flow Description

    1. Extracts the 'Question Text' parameter from the action configuration.

    2. Initializes the TaniumManager to connect to the Tanium API.

    3. Sends a POST request to the Tanium `/api/v2/questions` endpoint to create the
    question.

    4. Returns the newly created question ID as a JSON result.


    ### Additional Notes

    This action does not interact with or process any Google SecOps entities. It is
    a standalone command execution against the Tanium API.
