Download File:
  ai_description: >-
    ### General Description

    This action downloads files from remote endpoints managed by Tanium Threat Response.
    It supports Hostname and IP Address entities and operates asynchronously to handle
    the time required for Tanium to collect and prepare files for download. The action
    ensures a connection exists to the target endpoint, initiates a file evidence
    collection task, and then retrieves the file content to save it locally on the
    Google SecOps runner.


    ### Flow Description

    1. **Initialization**: Validates the local `Download Folder Path` and filters
    the target entities to include only Hostnames and IP Addresses.

    2. **Connection Check**: Verifies if an active connection exists for the target
    endpoint in Tanium. If no connection is active, it attempts to create one and
    waits for it to become 'connected'.

    3. **Task Creation**: For each specified file path, the action sends a request
    to Tanium to create a 'file evidence' task.

    4. **Status Polling (Async)**: The action enters an asynchronous loop, periodically
    checking the status of the created tasks using the Tanium Task ID.

    5. **File Retrieval**: Once a task reaches the 'COMPLETED' status, the action
    retrieves the file content from Tanium.

    6. **Local Storage**: The retrieved content is saved as a file in the specified
    `Download Folder Path` on the runner's filesystem.

    7. **Finalization**: Aggregates the results, providing a summary of successfully
    downloaded files and any failures encountered during the process.


    ### Additional Notes

    - This is an **asynchronous** action. It will trigger the collection task in Tanium
    and then poll for completion in subsequent check-ins.

    - The action requires the Tanium Threat Response module to be active and the target
    endpoints to have the Tanium agent installed.

    - Ensure the `Download Folder Path` exists and is accessible by the SOAR runner
    process.
  ai_short_description: >-
    Downloads specific files from remote endpoints managed by Tanium Threat Response
    and saves them locally on the Google SecOps runner.
