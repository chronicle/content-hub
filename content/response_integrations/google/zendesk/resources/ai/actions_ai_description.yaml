Add Comment To Ticket:
  ai_description: >-
    ### General Description

    Adds a comment to an existing ticket in Zendesk.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the Ticket
    ID and Comment Body.

    2. Initializes the Zendesk API client with the provided credentials.

    3. Makes a GET request to the Zendesk API to retrieve the current details of the
    specified ticket.

    4. Makes a PUT request to the Zendesk API to update the ticket, appending the
    new comment.

    5. Returns a success message if the comment was added successfully, or an error
    message if the operation fails.


    ### Additional Notes

    The comment can be configured to be public or internal based on the 'Internal
    Note' parameter. If an 'Author Name' is provided, it must exist in Zendesk for
    the action to succeed.
  ai_short_description: >-
    Adds a comment to an existing ticket in Zendesk.
