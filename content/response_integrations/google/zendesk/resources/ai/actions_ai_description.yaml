      Adds a comment to an existing ticket in Zendesk.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PUT request to the Zendesk API to update a ticket with a
      new comment, which means it mutates external data (`can_mutate_external_data`
      is true). It does not fetch contextual data for alerts/entities, nor does it
      mutate internal SecOps data, update entities, create insights, modify alert
      data, or create case comments.
