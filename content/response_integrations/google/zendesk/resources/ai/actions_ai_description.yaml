Update Ticket:
  ai_description: >-
    ### General Description

    Updates an existing ticket in Zendesk with new details such as subject, assignee,
    priority, status, and tags. It can also append an additional comment (public or
    internal) to the ticket.


    ### Flow Description

    1. Extracts the Zendesk configuration and action parameters (Ticket ID, Subject,
    Status, etc.).

    2. Initializes the Zendesk API client.

    3. Calls the Zendesk API (`GET /api/v2/tickets/{ticket_id}.json`) to retrieve
    the current ticket details.

    4. Modifies the ticket payload with the provided updates and sends a `PUT` request
    to `/api/v2/tickets/{ticket_id}.json` to update the ticket.

    5. If an additional comment is provided, sends another `PUT` request to append
    the comment to the ticket.

    6. Returns a success or failure message based on the API response.


    ### Additional Notes

    The action requires a valid Ticket ID. If specific fields like Assigned User or
    Assignment Group are provided, the action will first resolve their respective
    IDs via additional API calls before updating the ticket.
