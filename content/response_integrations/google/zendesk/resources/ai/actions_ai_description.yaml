Create Ticket:
  ai_description: >-
    ### General Description

    Creates a new ticket in Zendesk with specific properties such as subject, description,
    assignee, priority, and tags. It allows for adding email CCs and optionally validating
    their existence in Zendesk before ticket creation.


    ### Flow Description

    1. Extracts the provided parameters including subject, description, and optional
    fields like assigned user, priority, and email CCs.

    2. Validates the format of the provided email CCs using a regular expression.

    3. If the `Validate Email CCs` parameter is enabled, makes a GET request to the
    Zendesk API to fetch existing users and ensures the provided email CCs exist in
    the system.

    4. Makes a POST request to the Zendesk API (`/api/v2/tickets.json`) to create
    the ticket with the specified properties.

    5. Returns the newly created ticket ID upon successful execution.


    ### Additional Notes

    The action will fail if invalid email formats are provided in the `Email CCs`
    parameter, or if email validation is enabled and the provided emails do not exist
    in Zendesk.
