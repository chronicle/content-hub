Apply Macros On Ticket:
  ai_description: >-
    ### General Description

    Applies a specified macro to an existing ticket in Zendesk. This action modifies
    the ticket's properties based on the predefined actions configured within the
    Zendesk macro.


    ### Flow Description

    1. Retrieves the `Ticket ID` and `Macro Title` from the action parameters.

    2. Queries the Zendesk API to resolve the macro ID corresponding to the provided
    `Macro Title`.

    3. Makes a GET request to the Zendesk API (`/tickets/{ticket_id}/macros/{macro_id}/apply.json`)
    to retrieve the resulting ticket state after applying the macro.

    4. Makes a PUT request to the Zendesk API (`/tickets/{ticket_id}.json`) to update
    the ticket with the new state, effectively applying the macro.

    5. Returns a success or failure message based on the API response.


    ### Additional Notes

    The action requires a valid Zendesk Ticket ID and an existing Macro Title. The
    macro must be accessible to the user account configured in the integration.
