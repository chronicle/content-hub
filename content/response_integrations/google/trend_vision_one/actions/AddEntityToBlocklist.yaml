name: Add Entity To Blocklist
description: 'Add entities to the suspicious objects list (blocklist) in Trend Vision
    One. Supported entities: Domain, Hostname, URL, Email (User entity with email regex),
    IP, File hash. Note: only SHA1, SHA256 hashes are supported. Action is running
    as async, please adjust script timeout value in Chronicle SOAR IDE for action
    as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/trend-vision-one#add_entity_to_blocklist
integration_identifier: TrendVisionOne
parameters:
-   name: File Hashes
    default_value: ''
    type: string
    description: 'Comma-separated list of file hashes that need to be blocked. Note:
        only SHA1 and SHA256 hashes are supported. Input from this field will be executed
        together with entities.'
    is_mandatory: false
-   name: URLs
    default_value: ''
    type: string
    description: Comma-separated list of URLs that need to be blocked. Input
        from this field will be executed together with entities.
    is_mandatory: false
-   name: Domains
    default_value: ''
    type: string
    description: Comma-separated list of domains that need to be blocked. Input
        from this field will be executed together with entities.
    is_mandatory: false
-   name: Email Addresses
    default_value: ''
    type: string
    description: Comma-separated list of email addresses that need to be blocked.
        Input from this field will be executed together with entities.
    is_mandatory: false
-   name: IPs
    default_value: ''
    type: string
    description: Comma-separated list of IPs that need to be blocked. Input from this
        field will be executed together with entities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/AddEntityToBlocklist_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS", "FILEHASH", "USER", "URL"]}'
