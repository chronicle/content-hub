name: Acquire File
description: 'Use the "Acquire File" action to collect a file from an endpoint and
    download it as a password-protected archive from Trend Vision One. This action
    runs on the following Google SecOps entities: Hostname, IP Address. Note: Action
    is running as async, please adjust script timeout value in Google SecOps IDE for
    action, as needed. The API key role needs the following permissions: Response
    Management > Collect remote file, Response Management > Download task result,
    Response Management > View, filter, and search (Task List tab), and Endpoint Inventory
    View.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/trend-vision-one#acquire_file
integration_identifier: TrendVisionOne
parameters:
-   name: File Path
    default_value: ''
    type: string
    description: 'Specify the absolute path of the file to collect from the endpoint,
        for example C:\Windows\System32\calc.exe or /etc/hosts.'
    is_mandatory: true
-   name: Agent UUID
    default_value: ''
    type: string
    description: A comma-separated list of UUIDs. The action processes these UUIDs
        along with their related entities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/acquire_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
