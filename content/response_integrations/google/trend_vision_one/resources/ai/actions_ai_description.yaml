Execute Custom Script:
  ai_description: >-
    ### General Description

    Executes a custom script on specified endpoints in Trend Vision One. The action
    targets Hostname and IP Address entities, as well as explicitly provided Agent
    UUIDs, to run predefined scripts and retrieve their execution status.


    ### Flow Description

    1. Iterates over target entities (Hostname, IP Address) and searches for the corresponding
    endpoint in Trend Vision One using the `search_endpoint` API.

    2. For each found endpoint and any provided Agent UUIDs, initiates the execution
    of the specified custom script using the `run_script` API.

    3. Asynchronously monitors the execution status of the script tasks using the
    `get_task` API.

    4. Returns the execution results and task details as JSON.


    ### Additional Notes

    This is an asynchronous action. Ensure the script timeout value in the Chronicle
    SOAR IDE is adjusted as needed to allow the script execution to complete.
