Submit File:
  ai_description: >-
    ### General Description

    Submits files to the Trend Vision One sandbox for analysis and retrieves the analysis
    results. This action allows analysts to upload local files (including password-protected
    archives or documents) to the external sandbox to determine their behavior and
    threat level.


    ### Flow Description

    1. Extracts the provided file paths, optional passwords, and arguments from the
    action parameters.

    2. Verifies that the specified files exist and are accessible on the local filesystem.

    3. Makes a POST request to the Trend Vision One API (`/v3.0/sandbox/files/analyze`)
    to submit each file for analysis.

    4. Since the action is asynchronous, it periodically queries the task status via
    a GET request to `/v3.0/sandbox/tasks/{task_id}`.

    5. Once a task completes successfully, it fetches the analysis results via a GET
    request to `/v3.0/sandbox/analysisResults/{task_id}`.

    6. Attaches the retrieved analysis results as JSON to the action output.


    ### Additional Notes

    This action runs asynchronously. Ensure that the script timeout value in the Chronicle
    SOAR IDE is adjusted appropriately to allow sufficient time for the sandbox analysis
    to complete.
