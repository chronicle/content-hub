    ### General Description

    Unisolates endpoints in Trend Vision One, restoring their network connectivity.
    The action can target endpoints based on IP Address and Hostname entities, as
    well as explicitly provided Agent UUIDs.


    ### Flow Description

    1. Iterates over the provided target entities, filtering for supported types (IP
    Address and Hostname).

    2. Queries the Trend Vision One API to find the corresponding endpoint GUID for
    each valid entity.

    3. Processes any explicitly provided Agent UUIDs from the action parameters.

    4. Initiates an unisolation request (POST `/v3.0/response/endpoints/restore`)
    for each identified endpoint GUID.

    5. Asynchronously monitors the status of the unisolation tasks until they succeed,
    fail, or time out.


