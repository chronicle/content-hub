    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a GET request to the Trend Vision One API
      to search for endpoints. It does not mutate external data. It updates internal
      entities with the fetched enrichment data using `siemplify.update_entities`.
      It does not create insights or case comments.
