Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities using information from Trend Vision
    One. This action retrieves endpoint details such as OS description, login accounts,
    and installed products to provide additional context for the targeted assets.


    ### Flow Description

    1. Extracts the provided `Agent UUID` parameter and filters the target entities
    for supported types (Hostname and IP Address).

    2. Iterates through the suitable entities and makes a GET request to the Trend
    Vision One API to search for the corresponding endpoint.

    3. If an endpoint is found, it extracts the endpoint details, updates the entity's
    additional properties, and marks the entity as enriched.

    4. Processes any provided Agent UUIDs by searching for them in the API and retrieving
    their endpoint details.

    5. Updates the enriched entities in the Google SecOps platform and attaches the
    results as JSON and entity tables.


    ### Additional Notes

    The action requires valid API credentials and network access to the Trend Vision
    One instance. Entities that cannot be found in Trend Vision One will be skipped.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by retrieving endpoint details from
    Trend Vision One.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
