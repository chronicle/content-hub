Submit URL:
  ai_description: >-
    ### General Description

    Submits URL entities to Trend Vision One for sandbox analysis. This action initiates
    an asynchronous analysis of the provided URLs and retrieves the resulting behavior
    reports or threat scores once the analysis is complete.


    ### Flow Description

    1. Filters the target entities to include only URL entities.

    2. Submits the URLs to Trend Vision One for analysis via a POST request to the
    `/v3.0/sandbox/urls/analyze` API endpoint.

    3. Monitors the status of the analysis tasks asynchronously by making GET requests
    to the `/v3.0/sandbox/tasks/{task_id}` API endpoint.

    4. Once a task is completed, retrieves the analysis results via a GET request
    to the `/v3.0/sandbox/analysisResults/{task_id}` API endpoint.

    5. Attaches the retrieved analysis results as JSON to the action's output.


