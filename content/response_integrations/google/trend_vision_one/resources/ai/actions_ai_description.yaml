Execute Email:
  ai_description: >-
    ### General Description

    Executes an action (Delete, Quarantine, or Restore) on a specific email message
    in Trend Vision One.


    ### Flow Description

    1. The action retrieves the provided Message ID, Mailbox, and the desired Action
    (Delete, Quarantine, Restore).

    2. It initiates an asynchronous POST request to the Trend Vision One API (`/v3.0/response/emails/{email_action}`)
    to perform the specified action on the email.

    3. The action polls the task status using a GET request to the API until the task
    completes, fails, or times out.

    4. Upon completion, it returns the execution results and attaches the JSON response
    to the case.


    ### Additional Notes

    This is an asynchronous action. Ensure the script timeout value in the IDE is
    adjusted as needed.
