Isolate Endpoint:
  ai_description: >-
    ### General Description

    Isolates endpoints in Trend Vision One based on IP Address, Hostname, or Agent
    UUIDs. This action initiates a state change on the external device to prevent
    network traffic to or from the specified entities.


    ### Flow Description

    1. Extracts the provided parameters and filters the target entities for IP Addresses
    and Hostnames.

    2. For each suitable entity, searches for the corresponding endpoint in Trend
    Vision One using the `search_endpoint` API.

    3. If an endpoint is found, initiates an isolation task using the `isolate_endpoint`
    API.

    4. Processes any explicitly provided Agent UUIDs, searching for them and initiating
    isolation tasks.

    5. Monitors the status of the isolation tasks asynchronously using the `get_task`
    API.

    6. Returns the task IDs and statuses as JSON results.


    ### Additional Notes

    The action runs asynchronously. Ensure the script timeout value in the Chronicle
    SOAR IDE is adjusted as needed.
