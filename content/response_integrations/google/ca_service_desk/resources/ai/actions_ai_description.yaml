Search Tickets:
  ai_description: >-
    ### General Description

    Searches for tickets in CA Service Desk Manager based on specified criteria such
    as Incident ID, Summary, Description, Status, and a timeframe. It retrieves the
    matching ticket details and returns them to the platform.


    ### Flow Description

    1. Retrieves configuration and action parameters.

    2. Calculates the timestamp to fetch tickets from based on the 'Days Backwards'
    parameter.

    3. If an 'Incident ID' is provided, it directly targets that specific incident.

    4. Otherwise, it queries the CA Service Desk API using the provided filters (Summary,
    Description, Status, and time) via the `get_incident_ids_by_filter` method.

    5. Iterates through the retrieved incident IDs and fetches detailed information
    for each ticket using the `get_incident_by_id` method.

    6. Outputs the results as a JSON object and a data table.


    ### Additional Notes

    If no incidents are found matching the criteria, the action will output a message
    indicating so. Errors encountered during the fetching of individual incidents
    are logged and appended to the final output message.
  ai_short_description: >-
    Searches for tickets in CA Service Desk Manager based on specified criteria such
    as Incident ID, Summary, Description, Status, and a timeframe, returning the matching
    ticket details.
