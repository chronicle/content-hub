Wait For Status Change:
  ai_description: >-
    ### General Description

    This action checks the status of a specific ticket in CA Service Desk and waits
    asynchronously until the ticket reaches the expected status. Once the expected
    status is reached, it retrieves the ticket details and completes the execution.


    ### Flow Description

    1. Connects to CA Service Desk using the provided integration configuration.

    2. Makes a SOAP API call to retrieve the current status of the specified ticket.

    3. Compares the current status with the expected status.

    4. If the status matches, makes another API call to retrieve the ticket details,
    adds them to the JSON result, and completes the action.

    5. If the status does not match, the action suspends and will re-run later to
    check again.


    ### Additional Notes

    This is an asynchronous action that will continue to run in the background until
    the expected status is met or the action times out.
