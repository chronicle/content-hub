Sync Ticket History:
  ai_description: >-
    ### General Description

    Fetches the entire ticket history (comments) from CA Service Desk for the ticket
    associated with the current alert and attaches them as comments to the case in
    Google SecOps.


    ### Flow Description

    1. Retrieves the external ticket ID from the current alert's metadata.

    2. Makes a SOAP API call to CA Service Desk to fetch all incident comments since
    the beginning of time.

    3. Iterates through the retrieved comments, extracting the content, type, analyst
    name, and timestamp.

    4. Formats each comment into a readable string.

    5. Adds each formatted string as a comment to the Google SecOps case.


    ### Additional Notes

    The action relies on the alert having a valid external ID that corresponds to
    a CA Service Desk ticket.
