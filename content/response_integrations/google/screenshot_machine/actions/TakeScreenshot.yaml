name: Take URL Screenshot
description: 'Take a screenshot of URL. Supported entities: IP, Hostname and URL.'
integration_identifier: ScreenshotMachine
parameters:
-   name: Image Format
    default_value: jpg
    type: string
    description: 'Format of the image, e.g: jpg'
    is_mandatory: false
-   name: Delay
    default_value: 2000
    type: string
    description: Using delay parameter, you can manage how long capturing engine should
        wait before the screenshot is created. This parameter must be an integer.
        Default value is 2000.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/take_screenshot_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["DestinationURL","ADDRESS","HOSTNAME"]}'
