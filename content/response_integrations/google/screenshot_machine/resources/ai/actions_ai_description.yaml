Take URL Screenshot:
  ai_description: >-
    ### General Description

    Takes a screenshot of a specified URL, IP Address, or Hostname entity using the
    ScreenshotMachine service. This action is designed to provide visual context for
    web-based entities during an investigation, allowing analysts to see the content
    of a site without visiting it directly. The resulting screenshot is attached to
    the entity within the Google SecOps platform.


    ### Flow Description

    1. Initializes the action and retrieves the Image Format and Delay parameters.

    2. Iterates through all entities in the current context, filtering for supported
    types: URL, ADDRESS, and HOSTNAME.

    3. For each supported entity, sends a GET request to the ScreenshotMachine API
    to capture the screenshot based on the entity's identifier.

    4. Upon a successful API response, the raw image data is base64 encoded and attached
    to the entity using the `add_entity_attachment` method.

    5. Collects the base64 encoded strings for all successful captures into a JSON
    result and provides a summary message of successful and failed entities.


    ### Additional Notes

    The action will fail if the API limit is reached or if the API key is invalid.
  ai_short_description: >-
    Takes a screenshot of a specified URL, IP Address, or Hostname entity using the
    ScreenshotMachine service and attaches it to the entity.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Attaches the downloaded screenshot image to the target entity within the SecOps
      platform.
    reasoning: >-
      The action makes a GET request to the ScreenshotMachine API to fetch screenshot
      data (fetches_data=true). It does not mutate external data. It mutates internal
      data by attaching the downloaded screenshot to the target entity within the
      SecOps platform (can_mutate_internal_data=true). It does not update entities,
      create insights, modify alert data, or create case comments.
