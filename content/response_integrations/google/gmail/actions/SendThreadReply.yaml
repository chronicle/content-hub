name: Send Thread Reply
description: Use the Send Thread Reply action to send a message as a reply to the
    email thread. This action doesn’t run on Google SecOps entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gmail#send_thread_reply
integration_identifier: Gmail
parameters:
-   name: Mailbox
    default_value: Default Mailbox
    type: string
    description: A mailbox to search the email in, such as user@example.com. By default,
        the action uses the default mailbox that you configured for the integration.
    is_mandatory: true
-   name: Internet Message ID
    default_value: ''
    type: string
    description: An internet message ID of the email to search for.
    is_mandatory: true
-   name: Reply To
    default_value: ''
    type: string
    description: A comma-separated list of emails to send the reply to. If you don’t
        provide any value and the Reply All checkbox is clear, the action only sends
        a reply to the original email sender. If you select the Reply All parameter,
        the action ignores this parameter.
    is_mandatory: false
-   name: Reply All
    default_value: 'false'
    type: boolean
    description: If selected, the action sends a reply to all recipients related to
        the original email. Not selected by default. This parameter has a priority
        over the Reply To parameter.
    is_mandatory: false
-   name: Attachments Paths
    default_value: ''
    type: string
    description: A comma-separated string of paths for file attachments stored on
        the Google SecOps server.
    is_mandatory: false
-   name: Mail Content
    default_value: ''
    type: email_content
    description: The body of an email.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/send_thread_reply_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
