Transfer File Linux To Linux:
  ai_description: >-
    ### General Description

    Transfers a file from one remote Linux host to another remote Linux host via SFTP.
    This action connects to both the source and destination servers, securely copies
    the file across, and can optionally delete the original file from the source server.


    ### Flow Description

    1. Extracts the source and destination connection details (IP, username, password)
    and file paths from the action parameters.

    2. Establishes an SFTP connection to the source Linux host and downloads the specified
    file to a temporary local location.

    3. Establishes an SFTP connection to the destination Linux host and uploads the
    temporary file to the specified destination path.

    4. Evaluates the `keep_file` parameter; if set to false, it deletes the original
    file from the source host.

    5. Cleans up the temporary local file and closes both SFTP connections.


    ### Additional Notes

    Requires valid SSH/SFTP credentials and network access for both the source and
    destination Linux hosts.
