    ### Flow Description

    1. Establishes an SSH connection to the specified remote Linux server using the
    provided IP address, username, and password.

    2. Executes a system command (`find` piped to `tar`) on the remote host to compress
    files matching the specified filter within the source folder.

    3. Saves the resulting `.tar.gz` archive to the specified output folder on the
