Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Microsoft SCCM instance using the provided integration
    configuration parameters. This action verifies that the credentials and network
    settings are correct and that the SOAR platform can successfully communicate with
    the SCCM server.


    ### Flow Description

    1. Extracts the Server Address, Domain, Username, and Password from the integration-level
    configuration.

    2. Attempts to establish a connection to the Microsoft SCCM instance via WMI (Windows
    Management Instrumentation).

    3. Returns a success message if the connection is established, or an error message
    if the connection fails.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to ensure the integration
    is configured correctly and does not perform any operational tasks or data retrieval.
