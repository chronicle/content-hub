Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches User, Hostname, and IP Address entities using Microsoft SCCM. It retrieves
    contextual information from SCCM and updates the entities within the SecOps platform
    with the fetched data.


    ### Flow Description

    1. Connects to the Microsoft SCCM instance using the provided integration credentials.

    2. Iterates through the target entities, filtering specifically for User, Hostname,
    and IP Address entity types.

    3. For each valid entity, executes a WMI query against SCCM to retrieve enrichment
    data based on the entity's identifier.

    4. Updates the entity's `additional_properties` with the retrieved data and marks
    the entity as enriched.

    5. Attaches the enrichment results as JSON and CSV tables to the action results.

    6. Saves the updated entities back to the platform.


    ### Additional Notes

    This action requires WMI access to the SCCM server (ports 135, 445, 443, and RPC
    service).
  ai_short_description: >-
    Enriches User, Hostname, and IP Address entities by retrieving contextual information
    from Microsoft SCCM and updating the entities' properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes WMI queries to SCCM to fetch enrichment data. It does not mutate
      external data. It updates internal entities with the fetched data by calling
      `siemplify.update_entities`. It does not create insights, modify alert data,
      or create case comments.
