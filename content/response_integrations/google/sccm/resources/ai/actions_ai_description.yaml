Get Computer Properties:
  ai_description: >-
    ### General Description

    This action is deprecated (users are advised to use the "Enrich Entities" action
    instead). It retrieves computer properties from a Microsoft SCCM instance to enrich
    Hostname entities within Google SecOps.


    ### Flow Description

    1. The action iterates through the provided target entities, filtering specifically
    for those of type Hostname.

    2. It sanitizes the hostname by removing any domain suffixes (e.g., `@domain`
    or `.domain`).

    3. It queries the SCCM instance via WMI to fetch detailed computer information
    for the sanitized hostname.

    4. If computer properties are found, the action updates the entity's `additional_properties`
    with the retrieved data, attaches a CSV table to the entity, and marks the entity
    as enriched.

    5. Finally, it saves the updated entities back to the platform and returns the
    raw SCCM data as a JSON result.


    ### Additional Notes

    This action relies on WMI queries to communicate with the SCCM server. Ensure
    that the necessary ports (135, 445, 443) and RPC services are accessible on the
    SCCM instance.
