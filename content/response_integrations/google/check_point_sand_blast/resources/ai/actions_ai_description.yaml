Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Check Point SandBlast server using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the API Root, API Key, and Verify SSL parameters from the integration
    configuration.

    2. Initializes the SandBlastManager.

    3. Makes a test query API call (POST request to `/query`) to the Check Point SandBlast
    server using a hardcoded hash to verify connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to ensure the integration
    is correctly configured and can communicate with the Check Point SandBlast service.
  ai_short_description: >-
    Tests connectivity to the Check Point SandBlast server to verify integration configuration.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
