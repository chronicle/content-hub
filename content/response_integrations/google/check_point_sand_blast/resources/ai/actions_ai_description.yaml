Upload File:
  ai_description: >-
    ### General Description

    Uploads one or more files to CheckPoint SandBlast for analysis. This action allows
    users to submit files for Threat Emulation, AntiVirus scanning, and Threat Extraction.


    ### Flow Description

    1. Extracts the provided file paths and selected analysis features (Threat Emulation,
    AntiVirus, Threat Extraction).

    2. Validates each file path to ensure it exists and does not exceed the maximum
    allowed size (100MB).

    3. Makes a POST request to the CheckPoint SandBlast API to upload each valid file
    for analysis.

    4. Collects the upload status and raw response data for each file.

    5. Returns a JSON result containing the upload details and a summary message of
    successful and failed uploads.


    ### Additional Notes

    A maximum of 5 files can be uploaded at a time. If no features are explicitly
    selected, Threat Emulation is enabled by default.
