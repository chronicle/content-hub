Query:
  ai_description: >-
    ### General Description

    Retrieves threat reputation information about FILEHASH entities from Check Point
    SandBlast. The action queries the SandBlast service for Threat Emulation and Anti-Virus
    data, enriches the entities with the findings, and updates their suspicious status
    based on the results.


    ### Flow Description

    1. Initializes a connection to the Check Point SandBlast API.

    2. Iterates over the target entities, filtering for those of type `FILEHASH`.

    3. Validates the hash format (MD5, SHA1, or SHA256) for each entity.

    4. Makes a POST request to the SandBlast `/query` API endpoint to fetch Threat
    Emulation and Anti-Virus information for the hash.

    5. If the scan is still running on the SandBlast side, the action suspends and
    waits for completion (asynchronous execution).

    6. Once the scan is completed, enriches the entity with the retrieved threat intelligence
    data.

    7. Marks the entity as suspicious if the Threat Emulation verdict is malicious
    or if the Anti-Virus severity meets or exceeds the configured `Threshold`.

    8. Updates the entities in the SecOps platform with the new enrichment data and
    status.


    ### Additional Notes

    This action operates asynchronously. If a scan is in progress, it will return
    an 'In Progress' state and re-execute until the scan reaches a terminal state.
  ai_short_description: >-
    Queries Check Point SandBlast to retrieve threat reputation, Threat Emulation,
    and Anti-Virus information for FILEHASH entities, enriching them and updating
    their suspicious status based on the results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Check Point SandBlast API (`/query`)
      to fetch threat intelligence data for file hashes. It does not mutate external
      data. It updates internal entities with the fetched enrichment data and suspicious
      status using `siemplify.update_entities`. It does not create insights or case
      comments.
