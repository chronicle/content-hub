[project]
name = "g_suite"
version = "28.0"
description = "G Suite is a brand of cloud computing, productivity and collaboration tools, software and products developed by Google."
requires-python = ">=3.11,<3.12"
dependencies = [ "environmentcommon", "google-api-core==2.22.0", "google-auth>=2.35.0", "googleapis-common-protos==1.65.0", "requests==2.32.4", "tipcommon",]

[dependency-groups]
dev = [ "integration-testing", "pytest>=9.2.0", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.0.1-py2.py3-none-any.whl"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.0.1-py3-none-any.whl"
