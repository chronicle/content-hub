identifier: GSuite
name: GSuite
parameters:
-   name: Verify SSL
    default_value: ''
    type: boolean
    description: If enabled, the server-side certificate used for connection is validated.
    is_mandatory: true
    integration_identifier: GSuite
-   name: Service Account JSON
    default_value: ''
    type: password
    description: 'For the service account based authentication, specify the Service
        Account JSON. Parameter accepts two ways to provide the service account: First
        (recommended), the full JSON content of the service account can be provided.
        The second way (legacy, will be deprecated) is to provide the path to the
        stored service account JSON file on the CSOAR server.'
    is_mandatory: false
    integration_identifier: GSuite
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: For the service account based authentication, specify the Workload
        Identity email.
    is_mandatory: false
    integration_identifier: GSuite
-   name: Delegated Email
    default_value: ''
    type: string
    description: Specify the email that integration should use.
    is_mandatory: false
    integration_identifier: GSuite
