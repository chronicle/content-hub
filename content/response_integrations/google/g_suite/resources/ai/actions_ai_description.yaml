List Users:
  ai_description: >-
    ### General Description

    Retrieves a list of users from a Google Workspace (GSuite) account based on various
    filtering criteria such as administrative privileges, suspension status, organizational
    unit, and 2FA enrollment. The action queries the Google Workspace Directory API
    and returns the matching user records as a JSON object and a formatted data table
    within the Google SecOps environment.


    ### Flow Description

    1. **Parameter Extraction**: The action extracts input parameters including filters
    (e.g., Admin status, Suspended status, Org Unit) and the record limit.

    2. **API Client Initialization**: Initializes the GSuite API client using the
    configured service account credentials.

    3. **Query Construction**: Builds a search query string based on the provided
    filtering parameters.

    4. **Data Retrieval**: Makes a GET request to the Google Workspace Directory API
    (`/admin/directory/v1/users`) to fetch the list of users. If specific email addresses
    are provided, it iterates through them to perform targeted searches.

    5. **Output Generation**: Processes the retrieved user data, returning it as a
    JSON result and populating a data table named 'Google Gsuite Users'.


    ### Additional Notes

    - If the 'Email Addresses' parameter is used, the 'Record Limit' parameter is
    ignored as the action will attempt to find all specified addresses.

    - Either 'Customer ID' or 'Domain' is typically required by the underlying API,
    though the action defaults to 'my_customer' if neither is provided.
