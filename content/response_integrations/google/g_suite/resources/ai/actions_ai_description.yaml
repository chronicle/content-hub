Get Group Details:
  ai_description: >-
    ### General Description

    The **Get Group Details** action retrieves comprehensive configuration and permission
    settings for specified Google Workspace groups. It allows security analysts to
    audit group visibility, membership policies, and posting permissions directly
    from Google Workspace. This action is particularly useful for investigating group-based
    access controls or verifying the security posture of specific communication channels.


    ### Flow Description

    1. **Parameter Extraction**: The action parses the comma-separated list of group
    email addresses provided in the input parameter.

    2. **API Initialization**: Establishes an authenticated session with the Google
    Workspace API using the configured service account credentials.

    3. **Data Retrieval**: For each provided group email, the action sends a GET request
