    password, etc.) from the input parameters.

    2. **API Initialization:** It establishes a connection to the GSuite Directory
    API using the configured credentials.

    3. **User Creation:** A POST request is sent to the GSuite `/admin/directory/v1/users`
    endpoint to create the account with the provided organizational and personal details.

    4. **Result Handling:** The action captures the API response, adds the created
