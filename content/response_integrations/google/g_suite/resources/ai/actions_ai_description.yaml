Remove Extension:
  ai_description: >-
    ### General Description

    The `Remove Extension` action allows administrators to uninstall a specific Chrome
    extension from all browsers registered within a designated Organizational Unit
    (OU) in Google Workspace. Unlike simply blocking an extension, this action explicitly
    sets the installation policy to `REMOVE`, which triggers the actual uninstallation
    of the extension from the users' Chrome browsers.


    ### Flow Description

    1. **Validation**: The action validates the provided `Extension ID` against a
    specific regex to ensure it is a valid 32-character Chrome extension identifier.

    2. **OU Lookup**: It retrieves a list of all Organizational Units from Google
    Workspace via a GET request to find the one matching the provided `Organization
    Unit Name` and obtains its unique ID.

    3. **Policy Update**: It sends a POST request to the Google Chrome Policy API
    (`batchModify`) to modify the `appInstallType` for the specified extension within
    the target OU, setting it to `REMOVE`.

    4. **Verification**: The action resolves the effective policy for that extension
    and OU via a POST request to the `resolve` endpoint to verify that the change
    was successfully applied.

    5. **Result Reporting**: If the verification succeeds, it returns a success status
    and populates the action results with the ID of the removed extension.


    ### Additional Notes

    - The `Extension ID` must consist of exactly 32 characters using letters 'a' through
    'p'.

    - This action requires appropriate Google Workspace administrative privileges
    to modify Chrome policies for the target Organizational Unit.
  ai_short_description: >-
    Removes a specified Chrome extension from an organizational unit's registered
    Chrome browsers in Google Workspace by setting its installation policy to 'REMOVE'.
