Block Extension:
  ai_description: >-
    ### General Description

    The Block Extension action allows administrators to block a specific Chrome extension
    within a designated Google Workspace Organizational Unit (OU). This action is
    primarily used for security containment, preventing the installation or execution
    of potentially malicious or unauthorized browser extensions across a subset of
    the organization.


    ### Flow Description

    1. Initializes the GSuite API client.

    2. Extracts and validates the Organization Unit Name and Extension ID parameters.

    3. Fetches all organizational units from the GSuite environment to find the ID
    of the target OU.

    4. Sends a POST request to the Google Chrome Policy API (`batchModify`) to set
    the `appInstallType` of the specified extension to `BLOCKED` for the target OU.

    5. Calls the `resolve` policy endpoint to verify that the effective policy for
    that extension in the target OU is set to `BLOCKED`.

    6. Returns a success message and the resolved policy details as JSON.


    ### Additional Notes

    A Chrome Enterprise license is required to use this action.
  ai_short_description: >-
    Blocks a specific Chrome extension within a designated Google Workspace Organizational
    Unit (OU) by modifying the Chrome extension policy.
