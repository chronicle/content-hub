    ### General Description

    Retrieves and lists the roles and unique privileges associated with specific Google
    Workspace groups. It allows security analysts to audit group permissions by fetching
    role assignments and expanding them into granular privileges. The action supports
    filtering by specific roles or privileges and provides a structured JSON output
    of the findings.


    ### Flow Description

    1. **Validation**: The action validates input parameters, ensuring 'Max Roles
    To Return' and 'Max Privileges To Return' are positive integers, and 'Expand Privileges'
    is enabled if 'Check Privileges' is used.

