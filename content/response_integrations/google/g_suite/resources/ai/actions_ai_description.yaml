    group ID via a GET request.

    4. **Role Detail Fetching**: Fetches the full role definition, including associated
    privileges, for each assigned role via a GET request.

    5. **Filtering**: Filters the discovered roles and privileges based on the 'Check
    Roles' and 'Check Privileges' parameters.

    6. **Result Generation**: Compiles the filtered roles and unique privileges into
    a JSON result for each group and adds it to the execution output.


