    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Modifies the Chrome extension policy for a specific Organizational Unit to block
      the installation of the specified extension.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches organizational units to resolve the OU ID and fetches the
      resolved policy to verify the change. It mutates external data by sending a
      POST request to the Chrome Policy API to block the specified extension. It does
      not mutate internal data, update entities, or create insights.
