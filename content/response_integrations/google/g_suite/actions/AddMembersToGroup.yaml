name: Add Members To Group
description: Add members to a group. Action runs on Google SecOps User entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#add_members_to_group
integration_identifier: GSuite
parameters:
-   name: Group Email Address
    default_value: ''
    type: string
    description: Email of the group to add the members to.
    is_mandatory: true
-   name: User Email Addresses
    default_value: ''
    type: string
    description: 'A comma-separated list of users that you want to remove from the
        group. Note: values from this parameter will be executed alongside User Entities.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/add_members_to_group_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
