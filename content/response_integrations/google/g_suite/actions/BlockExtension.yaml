name: Block Extension
description: 'Use the Block Extension action to block a specified Chrome extension
    in an organizational unit.

    Note: A Chrome Enterprise license is required to use this action.'
integration_identifier: GSuite
parameters:
-   name: Organization Unit Name
    default_value: ''
    type: string
    description: The name of the organizational unit in which to block the extension.
    is_mandatory: true
-   name: Extension ID
    default_value: ''
    type: string
    description: The ID of the extension to block.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/block_extension_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
