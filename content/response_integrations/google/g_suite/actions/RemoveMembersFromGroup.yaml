name: Remove Members From Group
description: Remove members from a group. Action runs on Google SecOps User entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#remove_members_from_group
integration_identifier: GSuite
parameters:
-   name: Group Email Address
    default_value: ''
    type: string
    description: Email of the group to remove the members from.
    is_mandatory: true
-   name: User Email Addresses
    default_value: ''
    type: string
    description: 'A comma-separated list of users that you want to remove from the
        group. Note: values from this parameter will be executed alongside User Entities.'
    is_mandatory: false
dynamic_results_metadata: []
creator: Admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
