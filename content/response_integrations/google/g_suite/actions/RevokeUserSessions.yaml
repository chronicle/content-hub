name: Revoke User Session
description: Use the Revoke User Sessions action to revoke the user web and device
    sessions and reset their sign-in cookies using Google Workspace. This action runs
    on the Google SecOps User entity.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#revoke_user_sessions
integration_identifier: GSuite
parameters:
-   name: User Email Addresses
    default_value: ''
    type: string
    description: A comma-separated list of users to sign out. The action runs the
        values from this parameter with User entities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/revoke_user_sessions_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
