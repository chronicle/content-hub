name: List OU Of Account
description: List the organizational units of an account
integration_identifier: GSuite
parameters:
-   name: Customer ID
    default_value: my_customer
    type: string
    description: The unique ID for the customer's G Suite account, 'my_customer' alias
        can also be used to represent your account's customerId.
    is_mandatory: true
-   name: Organization Unit Path
    default_value: /
    type: string
    description: The path of the organizational unit that needs to be returned.
    is_mandatory: false
-   name: Max Organization Units
    default_value: '50'
    type: string
    description: Number of organizational units to return. Maximum is 100.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/list_ou_of_account_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
script_result_name: organizational_units
