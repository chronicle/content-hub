name: Update User
description: 'Update a Google Workspace Directory user. Note: action is not working
    on Google SecOps entities'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#update_user
integration_identifier: GSuite
parameters:
-   name: Email Address
    default_value: ''
    type: string
    description: A comma-separated list of primary email addresses that will be used
        to identify users that need to be updated.
    is_mandatory: true
-   name: Given Name
    default_value: ''
    type: string
    description: The user's first name
    is_mandatory: false
-   name: Family Name
    default_value: ''
    type: string
    description: The user's last name
    is_mandatory: false
-   name: Password
    default_value: ''
    type: password
    description: The password of the user.
    is_mandatory: false
-   name: Phone
    default_value: ''
    type: string
    description: The phone number of the user.
    is_mandatory: false
-   name: Gender
    default_value: ''
    type: string
    description: 'The gender of the user. Valid values: female, male, other, unknown.'
    is_mandatory: false
-   name: Department
    default_value: ''
    type: string
    description: The name of the department of the user.
    is_mandatory: false
-   name: Organization
    default_value: ''
    type: string
    description: The name of the organization of the user.
    is_mandatory: false
-   name: Change Password At Next Login
    default_value: false
    type: boolean
    description: Whether to force the user to change his password on next login.
    is_mandatory: true
-   name: User Status
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Blocked
    - Unblocked
    description: Specify if user status should be updated to blocked or unblocked.
        By default action is no changing the user status.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_user_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
