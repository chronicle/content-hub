name: Search User Activity Events
description: Use the User Activity Events action to retrieve activity events from
    an application for a specified Google SecOps User entity.
integration_identifier: GSuite
parameters:
-   name: User Email Addresses
    default_value: ''
    type: string
    description: 'A comma-separated list of additional user email addresses to process.

        The action processes all users in this list in addition to a User entity (if
        one is provided).'
    is_mandatory: false
-   name: Application Names
    default_value: ALL
    type: multi_choice_parameter
    optional_values:
    - ALL
    - Access Transparency
    - Admin
    - Chrome Browser & OS
    - Context-aware Access
    - Data Studio
    - Enterprise Groups
    - Google Calendar
    - Google Chat
    - Google Cloud
    - Google Drive
    - Google Groups
    - Google Jamboard
    - Google Keep
    - Google Meet
    - Google Vault
    - Google+
    - Login
    - Mobile Devices
    - Rules
    - SAML
    - Token
    - User Accounts
    description: 'A list of applications to query for activity events.

        For a full list of supported applications, see the [ApplicationName documentation](https://developers.google.com/workspace/admin/reports/reference/rest/v1/activities/list#applicationname).'
    is_mandatory: true
-   name: Event Type Filter
    default_value: ''
    type: string
    description: A comma-separated list of event types to retrieve.
    is_mandatory: false
-   name: Time Frame
    default_value: Last Hour
    type: ddl
    optional_values:
    - Last Hour
    - Last 6 Hours
    - Last 24 Hours
    - Last Week
    - Last Month
    - Custom
    description: "The time frame for the activity search. If Custom is selected, the\
        \ Start Time parameter is required.\nThe possible values are as follows: \n\
        \    • Last Hour\n    • Last 6 Hours\n    • Last 24 Hours\n    • Last Week\n\
        \    • Last Month\n    • Custom"
    is_mandatory: false
-   name: Start Time
    default_value: ''
    type: string
    description: 'The start of the time range for the activity search.

        This parameter is required if Custom is selected for the Time Frame parameter.

        Configure the value in ISO 8601 format.'
    is_mandatory: false
-   name: End Time
    default_value: ''
    type: string
    description: 'The end of the time range for the activity search.

        This parameter is optional when Custom is selected for the Time Frame parameter
        and defaults to the current time if not provided.

        Configure the value in ISO 8601 format.'
    is_mandatory: false
-   name: Max Events To Return
    default_value: '200'
    type: string
    description: "The maximum number of events to return per user. \nThe default value\
        \ is 200.\nThe maximum value is 1000.\nThe action processes a maximum of 1000\
        \ events per user, per application."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/search_user_activity_events_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
