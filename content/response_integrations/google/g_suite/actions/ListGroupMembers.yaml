name: List Group Members
description: List the members of a group
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#list_group_members
integration_identifier: GSuite
parameters:
-   name: Group Email Address
    default_value: ''
    type: string
    description: Email address of the group.
    is_mandatory: true
-   name: Include Derived Membership
    default_value: 'true'
    type: boolean
    description: Whether to list indirect memberships.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/list_group_members_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
script_result_name: members
