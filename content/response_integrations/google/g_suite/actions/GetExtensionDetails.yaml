name: Get Extension Details
description: "Use the Get Extension Details action to retrieve information about a\
    \ specified Chrome Extension. \nNote: A Chrome Enterprise license is required\
    \ to use this action."
integration_identifier: GSuite
parameters:
-   name: Extension ID
    default_value: ''
    type: string
    description: A comma-separated list of extension IDs to enrich.
    is_mandatory: true
-   name: Max Requesting Users To Return
    default_value: 100
    type: string
    description: 'The maximum number of users to return who requested the extension
        installation.

        The maximum value is `1000`.'
    is_mandatory: true
-   name: Max Requesting Devices To Return
    default_value: 100
    type: string
    description: 'The maximum number of devices to return where the extension installation
        was requested.

        The maximum value is `1000`.'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_extension_details_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
