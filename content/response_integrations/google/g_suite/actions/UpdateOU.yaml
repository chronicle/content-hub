name: Update OU
description: Update an organizational unit.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#update_ou
integration_identifier: GSuite
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: The unique ID for the customer's G Suite account, 'my_customer' alias
        can also be used to represent your account's customerId.
    is_mandatory: true
-   name: Name
    default_value: ''
    type: string
    description: Display name of the OU.
    is_mandatory: false
-   name: Description
    default_value: ''
    type: string
    description: Description of the OU.
    is_mandatory: false
-   name: OU Path
    default_value: ''
    type: string
    description: The full path to the organizational unit. If organizational unit
        is located under root (/) path, provide just organizational unit name, without
        path.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/update_ou_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
