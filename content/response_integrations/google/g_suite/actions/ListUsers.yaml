name: List Users
description: List users present in account.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#list_users
integration_identifier: GSuite
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: The unique ID for the customer's G Suite account, 'my_customer' alias
        can also be used to represent your account's customerId.
    is_mandatory: false
-   name: Domain
    default_value: ''
    type: string
    description: Specify a domain to search for users in.
    is_mandatory: false
-   name: Manager Email
    default_value: ''
    type: string
    description: The email address of a user's direct manager
    is_mandatory: false
-   name: Return only Admin Accounts?
    default_value: 'false'
    type: boolean
    description: Specify whether to return only admin accounts.
    is_mandatory: false
-   name: Return only Delegated Admin Accounts?
    default_value: 'false'
    type: boolean
    description: Specify whether to return only delegated admin accounts.
    is_mandatory: false
-   name: Return only Suspended Users?
    default_value: 'false'
    type: boolean
    description: Specify whether to return only suspended accounts.
    is_mandatory: false
-   name: Org Unit Path
    default_value: ''
    type: string
    description: The full path of an org unit to retrieve users from. This matches
        all org unit chains under the target.
    is_mandatory: false
-   name: Department
    default_value: ''
    type: string
    description: The department within the organization to retrieve users from.
    is_mandatory: false
-   name: Record Limit
    default_value: '20'
    type: string
    description: Specify how many records can be returned by the action.
    is_mandatory: false
-   name: Custom Query Parameter
    default_value: ''
    type: string
    description: 'Optional. Specify custom query parameter you want to add to the
        list users search call. For example, orgName=''Human Resources'' For reference
        on which fields can be used see https://developers.google.com/admin-sdk/directory/v1/guides/search-users#fields.
        Note: when providing the ''Custom Query Parameter'', make sure that you are
        not providing ''email'' field alongside ''Email Addresses'' parameter as the
        generated query will not work.'
    is_mandatory: false
-   name: Return only users without 2fa?
    default_value: 'false'
    type: boolean
    description: If enabled, action will only return users that don't have 2fa enabled.
    is_mandatory: false
-   name: Email Addresses
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of email addresses that need to be
        searched for. Note: if ''Email Addresses'' parameter is used, then ''Record
        Limit'' parameter is ignored.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_users_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
