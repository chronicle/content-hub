name: Create OU
description: Create a new organizational unit.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#create_ou
integration_identifier: GSuite
parameters:
-   name: Customer ID
    default_value: ''
    type: string
    description: The unique ID for the customer's G Suite account, 'my_customer' alias
        can also be used to represent your account's customerId.
    is_mandatory: true
-   name: Name
    default_value: ''
    type: string
    description: Display name of the new OU.
    is_mandatory: false
-   name: Description
    default_value: ''
    type: string
    description: Description of the new OU.
    is_mandatory: false
-   name: Parent OU Path
    default_value: ''
    type: string
    description: The full path to the organizational unit's parent OU.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/create_ou_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
