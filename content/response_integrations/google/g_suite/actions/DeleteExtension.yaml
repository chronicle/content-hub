name: Delete Extension
description: "Preview. Use the Delete Extension action to delete a specified Chrome\
    \ extension from an organizational unit blocklist. \nNote: A Chrome Enterprise\
    \ license is required to use this action."
integration_identifier: GSuite
parameters:
-   name: Organization Unit Name
    default_value: ''
    type: string
    description: The name of the organizational unit from which to delete the extension.
    is_mandatory: true
-   name: Extension ID
    default_value: ''
    type: string
    description: The ID of the extension to delete.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/delete_extension_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
