name: Remove Extension
description: Use the Remove Extension action to remove a specified Chrome extension
    from an organizational unit registered Chrome browsers.
integration_identifier: GSuite
parameters:
-   name: Organization Unit Name
    default_value: ''
    type: string
    description: The name of the organizational unit from which to remove the extension.
    is_mandatory: true
-   name: Extension ID
    default_value: ''
    type: string
    description: The ID of the extension to remove.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/remove_extension_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
