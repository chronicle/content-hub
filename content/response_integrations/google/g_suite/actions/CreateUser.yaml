name: Create User
description: Create a new user.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#create_user
integration_identifier: GSuite
parameters:
-   name: Given Name
    default_value: ''
    type: string
    description: The user's first name
    is_mandatory: true
-   name: Family Name
    default_value: ''
    type: string
    description: The user's last name
    is_mandatory: true
-   name: Password
    default_value: ''
    type: password
    description: The password of the new user.
    is_mandatory: true
-   name: Email Address
    default_value: ''
    type: string
    description: The user's primary email address
    is_mandatory: true
-   name: Phone
    default_value: ''
    type: string
    description: The phone number of the user.
    is_mandatory: false
-   name: Gender
    default_value: ''
    type: string
    description: 'The gender of the user. Valid values: female, male, other, unknown.'
    is_mandatory: false
-   name: Department
    default_value: ''
    type: string
    description: The name of the department of the user.
    is_mandatory: false
-   name: Organization
    default_value: ''
    type: string
    description: The name of the organization of the user.
    is_mandatory: false
-   name: Change Password At Next Login
    default_value: false
    type: boolean
    description: Whether to force the user to change his password on next login.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/create_user_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
