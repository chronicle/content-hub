name: List User Privileges
description: 'List roles and privileges related to the user using Google Workspace.
    Supported entities: User.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/gsuite#list_user_privileges
integration_identifier: GSuite
parameters:
-   name: User Email Addresses
    default_value: ''
    type: string
    description: 'A comma-separated list of users that you want to remove from the
        group. Note: values from this parameter will be executed alongside User Entities.'
    is_mandatory: false
-   name: Check Roles
    default_value: ''
    type: string
    description: Specify a comma-separated list of roles that you want to check in
        relation to the user.
    is_mandatory: false
-   name: Check Privileges
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of permission that you want to check
        in relation to the user. Note: "Expand Privileges" needs to be enabled for
        this parameter to work. If there are values inside the "Check Roles" parameter,
        action will check the privileges only among those roles.'
    is_mandatory: false
-   name: Include Inherited Roles
    default_value: true
    type: boolean
    description: If enabled, action will additionally return user roles that were
        inherited from groups.
    is_mandatory: false
-   name: Expand Privileges
    default_value: false
    type: boolean
    description: If enabled, action will return information about all of the unique
        privileges related to the user.
    is_mandatory: false
-   name: Max Roles To Return
    default_value: 100
    type: string
    description: Specify how many roles related to the user to return.
    is_mandatory: true
-   name: Max Privileges To Return
    default_value: 100
    type: string
    description: Specify how many privileges related to the user to return.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/list_user_privileges_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
