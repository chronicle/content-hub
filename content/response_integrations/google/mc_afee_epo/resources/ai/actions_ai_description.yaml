Add Tag:
  ai_description: >-
    ### General Description

    Adds a specified tag to an endpoint in McAfee ePO.


    ### Flow Description

    1. Initializes the McAfee ePO manager with the provided integration configuration.

    2. Filters the target entities to include only IP Addresses and Hostnames.

    3. Iterates over the suitable entities and retrieves system information for each
    entity via the McAfee ePO API.

    4. Applies the specified tag to the endpoint using the host ID or host name.

    5. Collects the results and returns a summary message indicating successful, failed,
    and ignored entities.


    ### Additional Notes

    The tag must already exist in the McAfee ePO system before it can be applied to
    an endpoint.
  ai_short_description: >-
    Adds a specified tag to an endpoint in McAfee ePO.
