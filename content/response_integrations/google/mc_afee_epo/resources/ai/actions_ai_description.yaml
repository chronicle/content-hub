Update Mcafee Agent:
  ai_description: >-
    ### General Description

    Updates the McAfee Agent on specified endpoints (Hostname, IP Address) in McAfee
    ePO by executing a designated client task.


    ### Flow Description

    1. Makes an API call to `clienttask.find` to retrieve the specified task by name
    from McAfee ePO.

    2. If a group is configured, makes an API call to `epogroup.findSystems` to fetch
    system information and validate the endpoints.

    3. Iterates through the target Hostname and IP Address entities.

    4. Makes an API call to `clienttask.run` on McAfee ePO for each valid endpoint
    to execute the task and update the agent.

    5. Collects the task execution status and returns it as a JSON result.


    ### Additional Notes

    The default task for Windows is `DAT_Update_Windows_CWS` and for Linux is `DAT_Update_Linux_CWS`.
