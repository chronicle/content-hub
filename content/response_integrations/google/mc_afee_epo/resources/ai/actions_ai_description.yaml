Compare Server and Agent DAT:
  ai_description: >-
    ### General Description

    Retrieves and compares the agent DAT version and the server DAT version for specified
    Hostname and IP Address entities from McAfee ePO.


    ### Flow Description

    1. Initializes the McAfee ePO API client.

    2. Filters target entities to include only internal Hostname and IP Address entities.

    3. Iterates through the filtered entities and queries McAfee ePO for the agent
    DAT version using the `get_dat_version` API method.

    4. Queries McAfee ePO for the server DAT version using the `get_server_dat` API
    method.

    5. Compares the agent and server DAT versions to check if they are equal.

    6. Attaches a CSV table to each successfully processed entity with the version
    details.

    7. Returns a JSON result containing the comparison status for all processed entities.


    ### Additional Notes

    This action only processes entities that are marked as internal.
