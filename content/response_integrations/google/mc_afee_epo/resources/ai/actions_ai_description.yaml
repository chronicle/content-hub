Execute Entity Query:
  ai_description: >-
    ### General Description

    Executes an entity-based query in McAfee ePO to fetch results from a specified
    table. The action dynamically builds the query's "Where" clause based on the provided
    target entities and their corresponding entity keys.


    ### Flow Description

    1. Extracts action parameters including the target table name, fields to return,
    sorting preferences, time frame, and specific entity keys.

    2. Iterates over the case's target entities and filters them to include only supported
    types (Address, Hostname, User, File Hash, URL).

    3. Extracts valid email addresses from the User entities to be used with the Email
    Address Entity Key.

    4. Validates if the required entity types are present in the scope based on the
    "Stop If Not Enough Entities" parameter.

    5. Makes an API call to McAfee ePO to execute the database query using the constructed
    conditions.

    6. Returns the query results as JSON and attaches them to a case data table.


    ### Additional Notes

    Supported entities include IP, Hostname, User, File Hash, and URL. If "Custom"
    is selected for the Time Frame, a Start Time must be provided.
