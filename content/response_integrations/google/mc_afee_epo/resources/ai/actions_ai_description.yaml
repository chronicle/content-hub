Get Agent Information:
  ai_description: >-
    ### General Description

    Retrieves detailed agent and system information about endpoint agents from McAfee
    ePO for specified Hostname and IP Address entities.


    ### Flow Description

    1. Initializes the connection to the McAfee ePO API using integration configurations.

    2. Iterates through the target entities, filtering for supported types (Hostname
    and IP Address).

    3. Fetches system information for each entity from McAfee ePO.

    4. Extracts agent-specific information from the retrieved system data.

    5. Enriches the entities with the agent data and marks them as enriched.

    6. Attaches the agent information as an entity table and JSON result to the action
    output.

    7. Updates the enriched entities within the platform.


    ### Additional Notes

    Supported entity types are Hostname and IP Address.
