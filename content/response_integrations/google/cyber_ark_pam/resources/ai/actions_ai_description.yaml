Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the CyberArk PAM installation using the parameters provided
    in the integration configuration.


    ### Flow Description

    1. Extracts integration configuration parameters such as API Root, Username, Password,
    and SSL settings.

    2. Initializes the `CyberArkPamManager` which attempts to authenticate and retrieve
    an access token from the CyberArk PAM server.

    3. If the connection and authentication are successful, the action completes and
    returns a success message. If it fails, it catches the exception and returns a
    failure status.


    ### Additional Notes

    This action is typically used as a diagnostic tool to verify that the integration
    is configured correctly and can successfully communicate with the CyberArk PAM
    API.
  ai_short_description: >-
    Tests connectivity to the CyberArk PAM installation to verify integration configuration
