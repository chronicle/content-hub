      Queues an immediate password change task for the specified accounts in CyberArk
      PAM.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a POST request to the CyberArk PAM API to queue a password
      change task, which mutates external data. It does not fetch contextual data,
      mutate internal data, update entities, create insights, modify alert data, or
      create case comments.
