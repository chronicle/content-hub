List Accounts:
  ai_description: >-
    ### General Description

    Lists accounts available in CyberArk PAM based on provided search and filter criteria.
    This action queries the CyberArk PAM instance to retrieve account details and
    returns them as structured data.


    ### Flow Description

    1. Extracts configuration and action parameters, including search queries, filters,
    and pagination settings.

    2. Validates the provided `Max Records To Return` and `Records Offset` parameters
    to ensure they are positive/non-negative integers.

    3. Initializes the CyberArk PAM API client and authenticates.

    4. Makes an HTTP GET request to the `PasswordVault/API/Accounts` endpoint with
    the specified search and filter parameters.

    5. Parses the returned accounts and outputs the results as a JSON array and a
    CSV-formatted data table.


    ### Additional Notes

    This action does not run on Chronicle SOAR entities. If both `Filter Query` and
    `Saved Filter` are provided, the `Saved Filter` takes priority.
