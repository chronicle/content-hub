Change Account Password:
  ai_description: >-
    ### General Description

    Queues an immediate password change task for specified accounts in CyberArk PAM.
    This action initiates a state change in the external system to rotate the credentials
    of the provided accounts.


    ### Flow Description

    1. Extracts the provided comma-separated list of Account IDs.

    2. Iterates through each Account ID.

    3. Makes a POST request to the CyberArk PAM API (`/PasswordVault/API/Accounts/{account_id}/Change`)
    to queue a password change task for the account.

    4. Collects successful and failed account operations.

    5. Returns a summary message and JSON results containing the status of each account.


    ### Additional Notes

    There is a delay between the task being queued and it being executed in CyberArk
    PAM.
  ai_short_description: >-
    Queues an immediate password change task for specified accounts in CyberArk PAM.
  capabilities:
