Get Account Password Value:
  ai_description: >-
    ### General Description

    Retrieves an account password or SSH key value from CyberArk PAM based on a specified
    account ID. This action is used to securely fetch credentials required for automated
    tasks or integrations within a playbook.


    ### Flow Description

    1. Extracts the provided account ID, access reason, and optional ticketing details
    (Ticketing System Name, Ticket ID, Version).

    2. Authenticates with the CyberArk PAM API using the configured integration credentials.

    3. Makes a POST request to the CyberArk PAM retrieve password endpoint (`PasswordVault/API/Accounts/{account_id}/Password/Retrieve/`)
    to fetch the secret value.

    4. Returns the retrieved password or SSH key as a JSON result for use in subsequent
    playbook steps.


    ### Additional Notes

    This action does not operate on Chronicle SOAR entities. It requires a valid account
    ID, which can be obtained using the 'List Accounts' action.
