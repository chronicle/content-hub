[project]
name = "proofpoint_cloud_threat_response"
version = "6.0"
description = "Proofpoint Threat Response includes a cloud-based security solution that runs in Proofpoint's cloud infrastructure as part of Threat Response's suite of products. It acts on email messages with identified malicious URLs, attachments and BEC (Business Email Compromise) threats. Threat Response removes such emails from the user's mailboxes, and subsequently from any mailboxes to which they were forwarded."
requires-python = ">=3.11,<3.12"
dependencies = [ "environmentcommon", "requests==2.32.5", "tipcommon",]

[dependency-groups]
dev = [ "integration-testing", "pytest>=9.2.0", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.2.19-py2.py3-none-any.whl"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.2.19-py3-none-any.whl"
