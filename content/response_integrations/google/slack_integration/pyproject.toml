[project]
name = "Slack-Integration"
version = "32.0"
description = "Slack is where work flows. It's where the people you need, the information you share, and the tools you use come together to get things done."
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp==3.10.5",
    "chardet==5.2.0",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.4",
    "setuptools==74.1.1",
    "six==1.16.0",
    "slackblocks==1.0.10",
    "slackclient==2.9.4",
    "tipcommon",
    "websocket-client==1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-mock>=3.14.1",
    "soar-sdk",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.0.12-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"
