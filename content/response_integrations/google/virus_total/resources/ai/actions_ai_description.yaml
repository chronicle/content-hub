Upload And Scan Files:
  ai_description: >-
    ### General Description

    Uploads and scans files using VirusTotal. The files can be provided via local
    paths or fetched from a remote Linux server. It retrieves the analysis report
    and evaluates the risk based on a specified threshold.


    ### Flow Description

    1. Parses the provided file paths from the action parameters.

    2. If Linux server credentials are provided, connects to the remote server via
    SSH/SFTP to retrieve the file content.

    3. Uploads the file to VirusTotal via a POST request to the `/file/scan` endpoint.

    4. Periodically checks the scan status using the returned scan ID (asynchronous
    execution).

    5. Once the scan is complete, retrieves the analysis report via a GET request.

    6. Adds the scan results, comments, and web links to the case as data tables and
    links.

    7. If the number of positive detections exceeds the specified threshold, creates
    a case insight.


    ### Additional Notes

    This is an asynchronous action that will continue to run in the background until
    the file scan is completed by VirusTotal.
