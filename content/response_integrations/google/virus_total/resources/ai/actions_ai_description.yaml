Scan Hash:
  ai_description: >-
    ### General Description

    Scans File Hash entities using VirusTotal to retrieve threat intelligence and
    reputation scores. It evaluates the risk based on a specified threshold and enriches
    the entities with the analysis results.


    ### Flow Description

    1. Iterates through the target entities and filters for File Hash entities.

    2. Checks VirusTotal for existing scan reports for each hash. If a report is older
    than the `Rescan after days` parameter, it initiates a rescan via the VirusTotal
    API.

    3. Asynchronously polls VirusTotal until the scan analysis is complete.

    4. Retrieves the final scan report and any associated comments from VirusTotal.

    5. Enriches the entity with the retrieved data, adds data tables, and attaches
    a web link to the report.

    6. Compares the number of positive detections against the `Threshold`. If the
    threshold is met or exceeded, the entity is marked as suspicious and an insight
    is created.

    7. Updates the entities in the platform with the new enrichment data and status.


    ### Additional Notes

    This is an asynchronous action that may pause execution while waiting for VirusTotal
    to complete the scan.
  ai_short_description: >-
    Scans File Hash entities using VirusTotal to retrieve threat intelligence, optionally
    triggering a rescan, and marks entities as suspicious if detections exceed a specified
    threshold.
