Scan URL:
  ai_description: >-
    ### General Description

    Scans URL entities using VirusTotal to retrieve threat intelligence and reputation
    scores. It evaluates the risk based on a specified threshold, updates the entity's
    suspicious status, and generates insights with the analysis results.


    ### Flow Description

    1. Filters target entities to identify URL entities.

    2. Checks if the URL has been scanned recently or needs a rescan based on the
    `Rescan after days` parameter.

    3. If a rescan is needed or the URL is missing, it submits the URL to VirusTotal
    for scanning via the API.

    4. Periodically queries the VirusTotal API to check the status of the queued scan
    tasks.

    5. Once the scan is complete, it retrieves the URL report and associated comments.

    6. Evaluates the number of positive detections against the provided `Threshold`.

    7. If the threshold is met or exceeded, marks the entity as suspicious and creates
    an insight.

    8. Enriches the entity with the scan results and updates it in the platform.


    ### Additional Notes

    The action runs asynchronously, meaning it will suspend and re-awaken to check
    the status of queued scans until they are completed.
