Get Domain Report:
  ai_description: >-
    ### General Description

    Retrieves a domain report from VirusTotal for Hostname, URL, and User entities.
    This action fetches threat intelligence, categorization, and resolution data to
    enrich the entities within the SecOps platform.


    ### Flow Description

    1. Iterates over target entities, filtering for Hostname, URL, and User entity
    types.

    2. Extracts the domain from each valid entity.

    3. Makes a GET request to the VirusTotal API to fetch the domain report.

    4. Enriches the entity's additional properties with the retrieved domain information.

    5. Attaches a CSV table containing the scan report and a web link to the full
    report to the entity.

    6. Updates the entities in the platform and returns the raw JSON results.


    ### Additional Notes

    This action relies on the integration-level API key and does not require any action-specific
    parameters.
  ai_short_description: >-
    Retrieves domain threat intelligence and categorization reports from VirusTotal
    for Hostname, URL, and User entities, enriching them with the results.
