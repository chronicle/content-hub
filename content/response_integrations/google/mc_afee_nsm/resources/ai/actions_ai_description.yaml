Block IP:
  ai_description: >-
    ### General Description

    Blocks specific IP address entities on the McAfee NSM firewall. This action initiates
    a state change on the external device to prevent network traffic to or from the
    specified IP addresses by adding them to a blocklist rule object.


    ### Flow Description

    1. Initializes the McAfee NSM manager using the provided integration configurations.

    2. Filters the target entities to identify IP addresses (ADDRESS entity type).

    3. Iterates through the identified IP addresses and makes API calls to McAfee
    NSM to check if the IP is already blocked.

    4. If not blocked, it makes API calls to either update an existing available rule
    object or create a new rule object and add it to the firewall policy.

    5. Makes an API call to deploy the configuration changes to the configured sensors.

    6. Makes an API call to log out of the McAfee NSM session.


    ### Additional Notes

    This action requires a dedicated firewall policy and a list of sensor names to
    be configured in the integration settings.
  ai_short_description: >-
    Blocks specific IP address entities on the McAfee NSM firewall by adding them
    to a blocklist rule object and deploying the changes to sensors.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the IP address to a blocklist rule object in the McAfee NSM firewall policy
      and deploys the changes to the sensors.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by making POST and PUT requests to McAfee NSM
      to create or update rule objects and deploy changes to sensors. It does not
      fetch enrichment data, update internal entities, or create insights.
