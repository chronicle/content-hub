Get Alert Info Data:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a specific alert from McAfee Network Security
    Manager (NSM). This action fetches the alert data based on the provided alert
    ID and sensor name, returning the raw JSON response for further analysis or playbook
    usage.


    ### Flow Description

    1. Extracts the `Alert ID` and `Sensor Name` from the action parameters.

    2. Resolves the provided sensor name to a sensor ID by querying the McAfee NSM
    API.

    3. Makes an HTTP GET request to the McAfee NSM API (`alerts/{alert_id}?sensorId={sensor_id}`)
    to fetch the alert details.

    4. Parses the response and attaches the alert data as a JSON result to the action's
    output.


