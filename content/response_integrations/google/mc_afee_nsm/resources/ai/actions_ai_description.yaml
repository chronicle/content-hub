Is IP Blocked:
  ai_description: >-
    ### General Description

    Checks if specific IP Address entities are currently blocked within McAfee Network
    Security Manager (NSM). This action queries the firewall policy to determine the
    block status of the provided IP addresses without making any modifications to
    the external system.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only those of type `ADDRESS` (IP Addresses).

    3. For each valid IP address, makes an API call (GET request) to McAfee NSM to
    retrieve the firewall policy and associated rule objects.

    4. Evaluates whether the IP address is present in the blocklist rule objects associated
    with the configured Siemplify policy.

    5. Categorizes the entities into 'blocked' and 'unblocked' lists and returns this
    summary in the action's output message.


    ### Additional Notes

    This action is strictly read-only. It does not add or remove IP addresses from
    the blocklist, nor does it update the internal entity records or create insights
