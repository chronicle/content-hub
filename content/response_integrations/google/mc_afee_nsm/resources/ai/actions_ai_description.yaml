Quarantine IP:
  ai_description: >-
    ### General Description

    Quarantines specific IP address entities on configured McAfee NSM sensors. This
    action initiates a state change on the external network security manager to block
    network traffic associated with the specified IP addresses until they are explicitly
    released.


    ### Flow Description

    1. Initializes the connection to the McAfee NSM API using integration configuration
    parameters.

    2. Iterates through the target entities provided in the case and filters for IP
    Address entities.

    3. For each valid IP address, iterates through the configured list of sensor names.

    4. Retrieves the corresponding sensor ID for each sensor name via the McAfee NSM
    API.

    5. Makes a POST request to the McAfee NSM API (`sensor/{sensor_id}/action/quarantinehost`)
    to quarantine the IP address on the specific sensor.

    6. Logs out of the McAfee NSM session.

    7. Returns a summary message indicating which IP addresses were successfully quarantined.


    ### Additional Notes

    - The quarantine duration is hardcoded to 'until explicitly released'.

    - The action relies on the 'Sensors Names List Comma Separated' integration configuration
    parameter to determine which sensors to apply the quarantine to.
  ai_short_description: >-
    Quarantines specific IP address entities on configured McAfee NSM sensors to block
