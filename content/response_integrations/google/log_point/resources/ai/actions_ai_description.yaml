Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the LogPoint server using the provided integration configuration
    parameters. This action ensures that the credentials and network settings are
    correct and that the SOAR platform can successfully communicate with the LogPoint
    instance.


    ### Flow Description

    1. Extracts integration-level configuration parameters including IP Address, Username,
    Secret, CA Certificate File, and Verify SSL.

    2. Initializes the `LogPointManager` with the extracted parameters.

    3. Executes the `test_connectivity` method, which sends a POST request to the
    LogPoint `/getalloweddata` API endpoint to verify authentication and network access.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
