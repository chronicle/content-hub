Execute Entity Query:
  ai_description: >-
    ### General Description

    Executes a dynamic search query in LogPoint based on the identifiers of supported
    entities (User, IP, URL, File Hash, Hostname). The action constructs a query using
    the provided base query and entity-specific keys, retrieves the matching logs,
    and attaches them to the case.


    ### Flow Description

    1. Extracts action parameters including the base query, time frame, and entity-specific
    keys.

    2. Iterates through the target entities and filters them by supported types (Address,
    Hostname, User, URL, File Hash).

    3. Dynamically constructs a LogPoint search query by appending the entity identifiers
    to the base query using the specified entity keys and logical operators.

    4. Initiates an asynchronous query job in LogPoint via the `/getsearchlogs` API
    endpoint.

    5. Periodically checks the status of the query job.

    6. Once completed, retrieves the query results and attaches them to the case as
    a data table and JSON result.


    ### Additional Notes

    The action can be configured to stop execution if not all specified entity types
    are found in the scope. Email addresses are processed as User entities that match
    an email format.
  ai_short_description: >-
    Executes a dynamic search query in LogPoint based on the identifiers of supported
    entities (User, IP, URL, File Hash, Hostname) and returns the matching logs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by executing a search query in LogPoint and retrieving
      the results. It does not mutate external data, nor does it mutate internal data
      (no entity updates, insights, or case comments are created).
  entity_usage:
