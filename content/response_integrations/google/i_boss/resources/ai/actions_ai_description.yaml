Add IP to Policy Block List:
  ai_description: >-
    ### General Description

    Adds an IP address to a specific policy block list category in iBoss.


    ### Flow Description

    1. Initializes the iBoss manager with the provided integration credentials.

    2. Validates if the specified Category ID corresponds to a valid block list in
    iBoss.

    3. Iterates through the target entities, filtering for those of type `ADDRESS`.

    4. For each valid IP address, makes a PUT request to the iBoss API to add the
    IP to the block list with the specified priority, direction, ports, and notes.

    5. If the API call is successful, enriches the entity with a `policy_blocked`
    property and marks it as enriched.

    6. Updates the successfully processed entities within the Google SecOps platform.


    ### Additional Notes

    This action modifies external state by updating the iBoss policy block list to
    prevent network traffic to or from the specified IP addresses.
  ai_short_description: >-
    Adds an IP address to a specific policy block list category in iBoss to prevent
    network traffic.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: >-
      Adds the IP address to a policy block list category in iBoss.
    fetches_data: false
    internal_data_mutation_explanation: >-
      Updates the target entities with a 'policy_blocked' enrichment flag.
    reasoning: >-
      The action does not fetch contextual data for enrichment. It mutates external
      data by making a PUT request to iBoss to block an IP address. It mutates internal
      data by updating the target entities with a 'policy_blocked' enrichment flag
      via `siemplify.update_entities`. It does not create insights, modify alert data,
      or create case comments.
