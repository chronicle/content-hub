URL Lookup:
  ai_description: >-
    ### General Description

    Enriches URL and Hostname entities by performing a URL lookup in IBoss to retrieve
    categorization and action details.


    ### Flow Description

    1. Retrieves the `Group ID` action parameter.

    2. Filters the target entities to include only URL and Hostname types.

    3. Iterates through the filtered entities and makes a POST request to the IBoss
    API (`json/controls/urlLookup`) to fetch lookup data.

    4. If successful, enriches the entity's additional properties with the retrieved
    categorization and action data.

    5. Marks the entity as enriched and updates it within the Google SecOps platform.

    6. Returns the lookup results as JSON.


    ### Additional Notes

    Although the action uses a POST request to perform the lookup, it acts as an enrichment
    step and does not mutate external state.
