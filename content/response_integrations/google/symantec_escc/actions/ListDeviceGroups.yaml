-   name: Max Groups To Return
    default_value: 50
    type: string
    description: 'Specify how many groups to return. Default: 50.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_device_groups_JsonResult_example.json
    result_name: JsonResult
    show_result: true
