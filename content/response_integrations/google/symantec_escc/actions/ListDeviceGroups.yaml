name: List Device Groups
description: List available device groups in Symantec Endpoint Security Complete.
integration_identifier: SymantecESCC
parameters:
-   name: Filter Logic
    default_value: Equal
    type: ddl
    optional_values:
    - Equal
    - Contains
    description: Specify what filter logic should be applied.
    is_mandatory: false
-   name: Filter Value
    default_value: ''
