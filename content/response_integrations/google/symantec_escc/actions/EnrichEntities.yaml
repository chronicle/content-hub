name: Enrich Entities
description: 'Enrich entities using information from Symantec Endpoint Security Complete.
    Supported entities: Hostname, Hash, URL and IP Address. Only SHA256 hashes are
    supported.'
integration_identifier: SymantecESCC
parameters:
-   name: Device Group
    default_value: Default
    type: string
    description: Specify the name of the device group that should be used to retrieve
        information about endpoints.
    is_mandatory: true
-   name: Create Endpoint Insight
    default_value: true
    type: boolean
    description: If enabled, action will create an insight containing information
        about the endpoints.
    is_mandatory: false
-   name: Create IOC Insight
    default_value: true
    type: boolean
    description: If enabled, action will create an insight containing information
        about enriched IOCs.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "FILEHASH", "DestinationURL", "ADDRESS"]}'
