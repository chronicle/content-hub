name: Get Related IOCs
description: 'Get IOCs related to the entities from Symantec Endpoint Security Complete.
    Supported entities: Hash, URL and IP Address. Only SHA256 hashes are supported.'
integration_identifier: SymantecESCC
parameters:
-   name: Source Filter
    default_value: byThreatActor,byProcessChain,bySignature,bySampleTraits,byNetworkingTrait,bySimilarIncidents
    type: string
    description: 'Specify the source filter. If nothing is provided, action will return
        related entities, based on all sources. Possible Values: byThreatActor, byProcessChain,
        bySignature, bySampleTraits, byNetworkingTrait, bySimilarIncidents.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_related_io_cs_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["FILEHASH", "DestinationURL", "ADDRESS"]}'
