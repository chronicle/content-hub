Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic tool designed to verify the connectivity between
    the Google SecOps platform and the Symantec Endpoint Security Complete Cloud (SESCC)
    instance. It ensures that the integration is correctly configured and that the
    platform can successfully authenticate and communicate with the Symantec API.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the global configuration parameters,
    including the API Root, Client ID, Client Secret, and SSL verification settings.

    2. **Manager Initialization**: It initializes the `SymantecESCCManager`, which
    automatically attempts to generate an OAuth2 access token using the provided Client
    ID and Client Secret.

    3. **Connectivity Test**: The action calls the `test_connectivity` method, which
    performs a POST request to the `/v1/incidents` endpoint with a minimal limit (1)
    to verify that the API responds correctly.

    4. **Result Reporting**: If the API call is successful, the action completes with
    a success message. If any step fails (e.g., authentication error, network timeout),
    it catches the exception and reports a failure.


    ### Additional Notes

    - This action is typically used during the initial setup of the integration or
    for troubleshooting connection issues.

    - It relies on the integration's global configuration for authentication and endpoint
    details.
  ai_short_description: >-
    Verifies connectivity between the Google SecOps platform and the Symantec Endpoint
    Security Complete Cloud (SESCC) instance.
