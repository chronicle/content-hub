List Device Groups:
  ai_description: >-
    ### General Description

    The **List Device Groups** action retrieves a list of available device groups
    from Symantec Endpoint Security Complete Cloud (SESCC). This utility action allows
    users to discover group IDs and names, which can be used for filtering or targeting
    in other security operations within the platform.


    ### Flow Description

    1. **Authentication**: The action authenticates with the Symantec ESCC API using
    the provided Client ID and Client Secret to obtain a bearer access token.

    2. **Data Retrieval**: It fetches the complete list of device groups by making
    a GET request to the Symantec `/v1/device-groups` endpoint.

    3. **Filtering**: If a `Filter Value` is provided, the action iterates through
    the retrieved groups and filters them based on the selected `Filter Logic` (Equal
    or Contains) against the group's name attribute.

    4. **Limiting**: The resulting list is truncated to the number specified in the
    `Max Groups To Return` parameter.

    5. **Output**: The action generates a data table titled "Available Device Groups"
    and populates the action's JSON result with the details (ID and Name) of the identified
    groups.


    ### Additional Notes

    - This action does not require or process any entities from the SecOps environment.

    - If no groups match the provided criteria, the action will complete successfully
    but indicate that no groups were found.
  ai_short_description: >-
    Retrieves a list of available device groups from Symantec Endpoint Security Complete
    Cloud (SESCC) based on specified filtering criteria.
  capabilities:
