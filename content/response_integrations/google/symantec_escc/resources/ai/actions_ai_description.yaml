Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname, FileHash, URL, and IP Address entities using threat intelligence
    and device telemetry from Symantec Endpoint Security Complete Cloud (SESCC). The
    action retrieves detailed information about endpoints (OS, user, status) and IOCs
    (reputation, prevalence, geographic distribution).


    ### Flow Description

    1. Validates the connection to Symantec ESCC and verifies that the specified 'Device
    Group' exists in the external system via API.

    2. Iterates through Hostname entities, matching them against devices within the
    specified group. For matches, it retrieves full device details including OS version,
    logged-in user, and security status via API.

    3. Iterates through IOC entities (IP, URL, Hash). Fetches threat intelligence
    including reputation scores, first/last seen dates, and industry/country prevalence
    via API. For FileHashes, it also retrieves process chain information.

    4. Updates the Google SecOps entities with enrichment attributes, adds data tables
    for visibility, and sets the 'suspicious' flag based on reputation results.

    5. Generates consolidated case insights for endpoints and IOCs if configured.


    ### Additional Notes

    - Only SHA256 hashes are supported for enrichment. Other hash types will be skipped.

    - Entities are marked as 'enriched' upon success. If an IOC has a 'BAD' reputation,
    the entity is also marked as 'suspicious'.
  ai_short_description: >-
    Enriches Hostname, FileHash, URL, and IP Address entities using threat intelligence
    and device telemetry from Symantec Endpoint Security Complete Cloud (SESCC).
