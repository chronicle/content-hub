Get Related IOCs:
  ai_description: >-
    ### General Description

    The **Get Related IOCs** action retrieves Indicators of Compromise (IOCs) associated
    with specific entities from Symantec Endpoint Security Complete Cloud (SESCC).
    It supports IP Addresses, URLs, and SHA256 File Hashes. This action is primarily
    used for threat hunting and expanding the scope of an investigation by identifying
    other potentially malicious artifacts linked to the initial indicators.


    ### Flow Description

    1. **Filter Entities**: The action identifies supported entities (IP, URL, FileHash)
    from the target list.

    2. **Validate Hashes**: For FileHash entities, it verifies that the identifier
    is a valid SHA256 string (exactly 64 characters).

    3. **Fetch Data**: For each valid entity, it queries the Symantec SESCC API to
    find related threat intelligence.

    4. **Apply Filters**: The retrieved IOCs are filtered based on the user-defined
    `Source Filter` parameter.

    5. **Aggregate Results**: The action collects all unique related IOCs and categorizes
    them by type (File, Domain, or IP).

    6. **Output**: The final list of related IOCs is returned as a JSON object for
    use in subsequent playbook steps.


    ### Additional Notes

    - Only **SHA256** hashes are supported for FileHash entities. Other hash types
    (like MD5 or SHA1) will be skipped by the logic.

    - The action aggregates results into three categories: File IOCs, Domain IOCs,
    and IP IOCs, returning them as a unified JSON result.
  ai_short_description: >-
    Retrieves Indicators of Compromise (IOCs) associated with specific entities (IP
    Addresses, URLs, and SHA256 File Hashes) from Symantec Endpoint Security Complete
    Cloud (SESCC).
