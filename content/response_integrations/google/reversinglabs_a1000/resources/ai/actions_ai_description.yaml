Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the ReversingLabs A1000 Malware Analysis Appliance. This
    action verifies that the integration is configured correctly and can successfully
    communicate with the ReversingLabs A1000 server.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, Username, Password).

    2. Initializes the A1000 Malware Analysis client and generates an authorization
    token.

    3. Makes a POST request to the `api/samples/status/` endpoint using a constant
    test hash to verify API connectivity.

    4. Returns a success message if the connection is established and the API responds
    correctly.


    ### Additional Notes

    This action does not process any entities or alerts and is solely intended for
    integration health checks.
