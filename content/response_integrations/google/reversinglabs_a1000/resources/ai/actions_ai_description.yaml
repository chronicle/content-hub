Delete Sample:
  ai_description: >-
    ### General Description

    Deletes a set of file samples from the ReversingLabs A1000 appliance. This action
    removes the sample and all related data, including extracted samples and metadata,
    from the external system based on the provided File Hash entities.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to include only those of type File Hash.

    3. For each valid File Hash entity, makes an API call (DELETE request) to the
    ReversingLabs A1000 appliance to delete the sample and its associated metadata.

    4. Collects the successfully deleted hashes and returns a summary message indicating
    which entities were removed.


    ### Additional Notes

    This action permanently deletes data from the ReversingLabs A1000 appliance. Ensure
    that the hashes provided are intended for deletion, as this operation cannot be
    undone.
  ai_short_description: >-
    Deletes file samples and their associated metadata from the ReversingLabs A1000
    appliance based on File Hash entities.
