    Retrieves a summary classification report and detailed analysis for file hash
    entities from ReversingLabs A1000.


    ### Flow Description

    1. Initializes the ReversingLabs A1000 client using the provided integration configurations.

    2. Iterates through the target entities, filtering specifically for File Hash
    entities.

    3. Makes an API call (`POST api/samples/list/`) to ReversingLabs A1000 to fetch
    the summary classification report for the collected hashes.

    4. Parses the retrieved reports and attaches them to the action results as CSV
    data tables and JSON objects.


    ### Additional Notes

    This action only processes File Hash entities. If no File Hash entities are provided,
