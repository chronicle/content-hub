Upload File:
  ai_description: >-
    ### General Description

    Uploads a file to the ReversingLabs A1000 appliance for malware analysis and retrieves
    the analysis report.


    ### Flow Description

    1. Initializes the ReversingLabs A1000 client using the provided integration configuration.

    2. Uploads the file specified by the `File Path` parameter to the A1000 appliance
    via a POST request to the `/api/uploads/` endpoint.

    3. Polls the processing status of the uploaded file's SHA1 hash via a POST request
    to `/api/samples/status/` until the status is marked as "processed".

    4. Retrieves the summary classification report for the uploaded file via a POST
    request to `/api/samples/list/`.

    5. Adds the report details as a data table and JSON result to the case.


    ### Additional Notes

    The action blocks execution while waiting for the file to be processed by the
    appliance. Ensure the file path provided is accessible by the SOAR platform.
