    for entity is above a given threshold. |

    | Create Insight? | Boolean | No | Specify whether the Siemplify Insight should
    be created based on the action result. |
Get Host Reputation:
  ai_description: >-
    ### General Description

    Enriches Hostname entities using the CheckPoint Threat Reputation service. This
    action retrieves threat intelligence and reputation data, evaluates the risk based
    on a specified threshold, updates the entity's suspicious status, and optionally
    generates an insight with the analysis results.


    ### Flow Description

    1. Initializes a connection to the CheckPoint Threat Reputation service.

    2. Iterates through the provided target entities, filtering for Hostname entities.

    3. Makes an API call (`POST /url-rep/service/v2.0/query`) to fetch reputation
    data for each valid entity.

    4. Evaluates the returned risk score against the provided `Threshold` and checks
    if the classification is not in the whitelist.

    5. Marks the entity as suspicious if the risk exceeds the threshold and the classification
    is not whitelisted.

    6. Optionally creates an insight with the reputation details if `Create Insight?`
    is enabled.

    7. Enriches the entity's additional properties with the fetched reputation data.

    8. Adds a data table with the results and updates the entities in the platform.


    ### Additional Notes

    Entities with unsupported types are skipped during execution.
  ai_short_description: >-
    Enriches Hostname entities by retrieving threat intelligence and reputation data
    from the CheckPoint Threat Reputation service, updating their suspicious status
    based on risk thresholds.
