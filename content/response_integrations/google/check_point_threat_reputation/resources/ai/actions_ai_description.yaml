    enrich_ioc: true
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action fetches reputation data for file hashes from the CheckPoint Threat
      Reputation service, returning threat intelligence such as malware family, classification,
      and risk score. This directly aligns with the 'Enrich IOC' expected outcome.
      It does not perform any state-changing operations on external systems or match
