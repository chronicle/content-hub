Get File Hash Reputation:
  ai_description: >-
    ### General Description

    Enriches File Hash entities using the CheckPoint Threat Reputation service. This
    action retrieves threat intelligence and reputation data for MD5, SHA1, and SHA256
    file hashes to provide additional context for security investigations.


    ### Flow Description

    1. Establishes a connection to the CheckPoint Threat Reputation service.

    2. Iterates through the target entities, filtering for File Hash entities.

    3. Makes an API call to fetch reputation data for each supported file hash.

    4. Evaluates the returned risk score against the provided `Threshold` parameter;
    if the risk exceeds the threshold and is not classified as benign, the entity
    is marked as suspicious.

    5. Optionally creates an insight for the entity if the `Create Insight?` parameter
    is enabled.

    6. Enriches the entity's additional properties with the retrieved reputation data.

    7. Updates the entities in the platform, attaching a CSV data table and JSON results
    containing the raw response.


    ### Additional Notes

    The action specifically targets File Hash entities and will skip other entity
    types. It supports MD5, SHA1, and SHA256 hash formats.
  ai_short_description: >-
    Enriches File Hash entities by retrieving threat intelligence and reputation data
    from the CheckPoint Threat Reputation service.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP POST request to the CheckPoint Threat Reputation API
      to fetch reputation data for file hashes (fetches_data=true). It does not mutate
      any data in external systems (can_mutate_external_data=false) or internal SecOps
      systems outside of entities and insights (can_mutate_internal_data=false). It
      updates the entities with the enriched data (can_update_entities=true) and optionally
      creates insights based on the action parameters (can_create_insight=true). It
      does not modify alert data or create case comments.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: true
      file_name: false
      generic: false
      host_name: false
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The code iterates over `siemplify.target_entities` and filters them using `if
      entity.entity_type not in SUPPORTED_ENTITIES:`, where `SUPPORTED_ENTITIES` is
      `EntityTypes.FILEHASH`. This means the action strictly targets File Hash entities
      and filters them by their `entity_type` attribute.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
