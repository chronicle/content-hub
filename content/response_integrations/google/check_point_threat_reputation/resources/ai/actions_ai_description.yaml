Get IP Reputation:
  ai_description: >-
    ### General Description

    Enriches IP Address entities using the CheckPoint Threat Reputation service. It
    retrieves threat intelligence including risk scores, classifications, and contextual
    data to evaluate the risk associated with the IP address.


    ### Flow Description

    1. Connects to the CheckPoint Threat Reputation service.

    2. Iterates over target entities, filtering for IP Address entities.

    3. Makes a POST request to the `/ip-rep/service/v2.0/query` endpoint to fetch
    reputation data for each IP.

    4. Evaluates the risk score against the provided threshold and classification
    to determine if the entity is suspicious.

    5. Optionally creates an insight with the reputation details if requested.

    6. Updates the entity's additional properties with the flattened reputation data.

    7. Attaches a CSV data table and JSON results to the action.

    8. Updates the enriched entities in the platform.


