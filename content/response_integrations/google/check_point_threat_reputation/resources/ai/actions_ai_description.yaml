Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the CheckPoint Threat Reputation service using the provided
    integration configuration parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, API Key, Verify
    SSL).

    2. Initializes the CheckPoint Threat Reputation manager.

    3. Makes an API call (GET request) to the CheckPoint Threat Reputation service
    to test connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is used to verify that the integration is configured correctly and
    can communicate with the CheckPoint Threat Reputation API.
