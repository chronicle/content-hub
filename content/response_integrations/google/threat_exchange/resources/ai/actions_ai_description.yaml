Get Reputations:
  ai_description: >-
    ### General Description

    Retrieves reputation data for File Hash, Hostname, IP Address, and URL entities
    using the ThreatExchange API. This action evaluates the threat intelligence associated
    with these indicators and updates their suspicious status within the platform
    if malicious indicators are found.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters entities to process only those of type File Hash, Hostname, IP Address,
    or URL.

    3. Makes a GET request to the ThreatExchange API (`/malware_analyses` for hashes,
    `/threat_descriptors` for others) to fetch reputation data for each valid entity.

    4. If reputation data is found, it is formatted and attached to the entity as
    a data table.

    5. Evaluates the reputation's status and severity; if it matches predefined suspicious
    or malicious criteria, the entity's `is_suspicious` flag is set to True.

    6. Updates the modified entities in the Google SecOps platform.


    ### Additional Notes

    This action relies on the ThreatExchange integration configurations for authentication
    and API routing.
  ai_short_description: >-
    Retrieves reputation data for File Hash, Hostname, IP Address, and URL entities
    using the ThreatExchange API, attaching the results as entity tables and updating
    the entity's suspicious status if malicious indicators are found.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the ThreatExchange API via GET requests (fetches_data=true).
      It does not mutate external data or internal data outside of entities. It updates
      entities using `siemplify.update_entities` (can_update_entities=true). It attaches
      data as entity tables but does not create insights or case comments.
