Download Alert CSV:
  ai_description: >-
    ### General Description

    Downloads a CSV file containing information related to a specific alert from IntSights
    and saves it to a local directory.


    ### Flow Description

    1. Extracts the `Alert ID`, `Download Folder Path`, and `Overwrite` parameters.

    2. Validates that the specified download folder path exists on the local system.

    3. Makes a GET request to the IntSights API (`public/v1/data/alerts/csv-file/{alert_id}`)
    to retrieve the CSV file content associated with the alert.

    4. Saves the retrieved content as a CSV file in the specified folder, overwriting
    an existing file if the `Overwrite` parameter is enabled.

    5. Returns the absolute path of the downloaded file in the JSON result.


    ### Additional Notes

    Ensure the provided download folder path exists and is accessible by the integration
    environment.
