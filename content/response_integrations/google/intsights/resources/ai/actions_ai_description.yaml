Get Alert Image:
  ai_description: >-
    ### General Description

    Retrieves alert images from IntSights based on provided Alert Image IDs. The action
    fetches the raw image content, encodes it in base64, and attaches it to the case
    as an insight, while also returning the base64 data in the JSON results.


    ### Flow Description

    1. Parses the provided comma-separated list of Alert Image IDs.

    2. Iterates through each ID and makes a GET request to the IntSights API (`public/v1/data/alerts/alert-image/{alert_image_id}`)
    to retrieve the raw image content.

    3. Encodes the retrieved image content into base64 format.

    4. Creates a case insight containing the retrieved images rendered as HTML `<img>`
    tags.

    5. Returns a JSON result containing the image IDs and their corresponding base64
    content.


    ### Additional Notes

    If multiple IDs are provided and some fail, the action will still process the
    successful ones and report the failures in the output message.
  ai_short_description: >-
    Retrieves alert images from IntSights based on provided Alert Image IDs and attaches
    them to the case as an insight.
