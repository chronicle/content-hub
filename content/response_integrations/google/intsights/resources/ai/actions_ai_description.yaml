Search IOCs:
  ai_description: >-
    ### General Description

    Searches for Indicators of Compromise (IOCs) in Intsights based on the provided
    target entities. It retrieves threat intelligence data, enriches the entities,
    and evaluates their risk based on severity.


    ### Flow Description

    1. Initializes the IntsightsManager with API credentials.

    2. Iterates over the target entities.

    3. For each entity, calls the Intsights API (`GET public/v3/iocs/ioc-by-value`)
    to search for the IOC using the entity's original identifier.

    4. If IOC data is found, it adds the JSON result, enriches the entity's additional
    properties, and marks it as enriched.

    5. If the severity of the IOC is "Medium" or "High", it marks the entity as suspicious
    and adds an insight.

    6. Updates the enriched entities in the platform.


    ### Additional Notes

    None.
