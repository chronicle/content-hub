Assign Alert:
  ai_description: >-
    ### General Description

    Assigns an alert to a specific analyst in IntSights.


    ### Flow Description

    1. Extracts the Alert ID, Assignee ID, and Assignee Email Address from the action
    parameters.

    2. Validates that either an Assignee ID or an Assignee Email Address is provided.

    3. If only an Assignee Email Address is provided, makes an API call to IntSights
    to fetch the corresponding user details and retrieve the Assignee ID.

    4. Makes a PATCH API call to IntSights to assign the alert to the resolved Assignee
    ID.

    5. Returns a success message if the assignment is successful, or an error message
    if the user or alert is not found.


    ### Additional Notes

    If both Assignee ID and Assignee Email Address are specified, the action will
    prioritize the Assignee ID.
