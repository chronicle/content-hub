    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Intsights API to fetch alert images. It
      does not mutate external data. It creates a case insight with the retrieved
