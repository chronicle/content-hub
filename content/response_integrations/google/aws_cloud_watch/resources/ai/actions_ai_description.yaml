Search Log Events:
  ai_description: >-
    ### General Description

    Searches for log events in AWS CloudWatch based on specified criteria such as
    log group, log streams, time frame, and custom filters. The action retrieves the
    matching log events and attaches them to the case as JSON results and a data table.


    ### Flow Description

    1. Extracts configuration parameters (AWS credentials and region).

    2. Extracts action parameters including Log Group, Log Streams, Time Frame, Start
    Time, End Time, Custom Filter, and Max Events To Return.

    3. Validates the 'Max Events To Return' parameter.

    4. Calculates the start and end times based on the provided time frame or custom
    start/end times.

    5. Initializes the `AWSCloudWatchManager`.

    6. Calls the AWS CloudWatch API (`filter_log_events` via `manager.search_log_events`)
    to fetch log events.

    7. If events are found, adds them as JSON results and creates a data table.

    8. Returns a success or failure message based on the execution outcome.


    ### Additional Notes

    The action requires AWS credentials and region to be configured. The 'Time Frame'
    parameter can be set to predefined values or 'Custom', which requires 'Start Time'
    and 'End Time' to be provided.
