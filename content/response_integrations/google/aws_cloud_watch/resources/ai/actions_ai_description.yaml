    Lists available log groups in AWS CloudWatch and returns the results as a JSON
    object and a data table.


    ### Flow Description

    1. Initializes the AWS CloudWatch manager with the provided integration credentials.

    2. Retrieves the `Max Groups To Return` parameter to determine the limit of log
    groups to fetch.

    3. Makes an API call to AWS CloudWatch (`describe_log_groups`) to retrieve the
    available log groups.

    4. Formats the retrieved log groups into JSON and CSV formats.

    5. Returns the results to the SecOps platform, attaching the JSON result and creating
    a data table named 'Log Groups'.


    ### Additional Notes

    If no log groups are found, the action will complete successfully but return a
