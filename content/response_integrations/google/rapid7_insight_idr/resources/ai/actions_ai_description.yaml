Delete Saved Query:
  ai_description: >-
    ### General Description

    Deletes a specific saved query in Rapid7 InsightIDR.


    ### Flow Description

    1. Extracts the `Saved Query ID` from the action parameters.

    2. Initializes the Rapid7 InsightIDR API client.

    3. Sends an HTTP DELETE request to the `/log_search/query/saved_queries/{saved_query_id}`
    endpoint to remove the specified saved query.

    4. Returns a success message if the deletion is successful, or an error message
    if it fails (e.g., if the query is not found).


