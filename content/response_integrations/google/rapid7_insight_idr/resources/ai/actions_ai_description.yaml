  ai_description: >-
    ### General Description

    Sets the assignee for a specific investigation in Rapid7 InsightIDR. This action
    initiates a state change on the external Rapid7 InsightIDR platform to assign
    an investigation to a specified user.


    ### Flow Description

    1. Extracts the `Investigation ID` and `Assignee email` from the action parameters.

    2. Initializes the Rapid7 InsightIDR manager with the provided API credentials.

    3. Sends a PUT request to the Rapid7 InsightIDR API (`/idr/v1/investigations/{investigation_id}/assignee`)
    to update the assignee of the specified investigation.

    4. Retrieves the updated investigation details and attaches them to the action's
    JSON result.


    ### Additional Notes

    This action does not operate on Google SecOps entities.
