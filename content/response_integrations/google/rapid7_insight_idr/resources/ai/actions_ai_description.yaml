    1. Extracts the integration configuration parameters (API Root, API Key, Verify
    SSL).

    2. Initializes the Rapid7 InsightIDR manager with the provided credentials.

    3. Makes a GET request to the `/validate` endpoint to test the API key and connection.

    4. Returns a success message if the connection is established, otherwise returns
    an error.


