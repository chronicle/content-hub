Create Saved Query:
  ai_description: >-
    ### General Description

    Creates a new saved query in Rapid7 InsightIDR based on the provided LEQL statement
    and time frame.


    ### Flow Description

    1. Extracts the action parameters including the query name, LEQL statement, time
    frame, and target logs.

    2. If log names are provided, makes a GET request to the Rapid7 InsightIDR API
    to retrieve their corresponding IDs.

    3. Sends a POST request to the Rapid7 InsightIDR API to create the saved query
    with the specified parameters.

    4. Returns the created saved query details as a JSON result.


    ### Additional Notes

    This action does not operate on Siemplify entities.
  ai_short_description: >-
    Creates a new saved query in Rapid7 InsightIDR using a specified LEQL statement
    and time frame.
