Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Digital Shadows platform.


    ### Flow Description

    1. Extracts the API Key and API Secret from the integration configuration.

    2. Initializes the Digital Shadows manager, which automatically triggers a connectivity
    test.

    3. Makes a test search request (querying for "www.google.com") to the Digital
    Shadows API (`/api/search/find`) to verify the connection.

    4. Returns a success message if the connection is established, or an error message
    if the request fails.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can successfully communicate with the Digital Shadows service.
