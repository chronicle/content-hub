EnrichURL:
  ai_description: >-
    ### General Description

    Enriches URL entities using Digital Shadows. This action retrieves threat intelligence
    and domain information for the specified URLs to provide additional context for
    investigation.


    ### Flow Description

    1. Initializes the Digital Shadows API client using the provided integration credentials.

    2. Iterates through the target entities, filtering specifically for URL entities.

    3. For each URL, makes a POST request to the Digital Shadows `/api/search/find`
    endpoint to fetch `DOMAIN_WHOIS` information.

    4. If data is found, enriches the entity by adding a data table, a link to the
    Digital Shadows portal, and updating the entity's additional properties with the
    retrieved data.

    5. Marks the entity as enriched and updates it within the platform.

    6. Returns a JSON object containing the raw enrichment data for all successfully
    processed URLs.


    ### Additional Notes

    Entities that do not return any content from Digital Shadows will be marked as
    failed and will not be updated.
