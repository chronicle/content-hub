EnrichHash:
  ai_description: >-
    ### General Description

    This action enriches File Hash entities using threat intelligence from Digital
    Shadows. Note: This action is marked as deprecated.


    ### Flow Description

    1. Initializes the Digital Shadows API client using the provided integration credentials.

    2. Filters the target entities to include only File Hash entities.

    3. Iterates through the filtered entities and queries the Digital Shadows API
    for threat intelligence related to each hash (specifically retrieving Cylance
    and Webroot file hash data).

    4. If data is found, it enriches the entity by updating its additional properties,
    setting its status to enriched, and attaching a data table and link to the action
    results.

    5. Updates the enriched entities within the Google SecOps platform.

    6. Returns a JSON object containing the enrichment results for all successfully
    processed hashes.


