EnrichCVE:
  ai_description: >-
    ### General Description

    Enriches CVE entities using Digital Shadows. It retrieves vulnerability and exploit
    information from the Digital Shadows platform to provide additional threat intelligence
    context.


    ### Flow Description

    1. Iterates over the target entities provided in the case.

    2. Filters the entities to process only those of type `CVE`.

    3. For each suitable CVE entity, makes an API call to Digital Shadows to search
    for exploit and vulnerability data.

    4. Updates the entity's additional properties with the retrieved enrichment data.

    5. Attaches an entity table and relevant links to the entity.

    6. Marks the entity as enriched and saves the updates to the platform.


    ### Additional Notes

    This action requires a valid Digital Shadows API Key and Secret configured at
    the integration level.
  ai_short_description: >-
    Enriches CVE entities by retrieving vulnerability and exploit information from
    Digital Shadows.
