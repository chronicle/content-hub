Execute Simple Query:
  ai_description: >-
    ### General Description

    Executes a simple SQL query in Snowflake based on provided parameters such as
    database, table, schema, and filters. This action allows analysts to retrieve
    specific records from Snowflake tables without writing the full SQL statement
    manually.


    ### Flow Description

    1. Initializes the Snowflake manager with the provided integration credentials.

    2. Constructs a SQL `SELECT` query string using the provided action parameters
    (Fields To Return, Table, Where Filter, Sort Field, Sort Order).

    3. Submits the query to Snowflake asynchronously via a POST request to the `/api/v2/statements`
    endpoint.

    4. Checks the execution status of the query.

    5. If the query is still in progress, the action pauses and waits for the next
    asynchronous execution cycle.

    6. Once the query finishes, retrieves the results and attaches them to the case
    as a JSON result and a data table.


    ### Additional Notes

    This action runs asynchronously. Ensure the script timeout value in the Siemplify
    IDE is adjusted as needed.
  ai_short_description: >-
    Executes a simple SQL query in Snowflake based on provided parameters and returns
    the results.
