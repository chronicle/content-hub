Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Snowflake instance using the provided integration configuration
    parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters including API Root, Account,
    Username, Private Key, and Verify SSL.

    2. Initializes the SnowflakeManager with the extracted parameters to generate
    a JWT token for authentication.

    3. Calls the `test_connectivity` method which sends a POST request with a `SHOW
    TABLES LIMIT 1` query to the Snowflake API.

    4. Returns a success message if the connection is established and the query succeeds,
    or an error message if it fails.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can successfully authenticate with the Snowflake service.
  ai_short_description: >-
    Tests connectivity to the Snowflake instance using the provided integration configuration
    parameters.
