Execute Custom Query:
  ai_description: >-
    ### General Description

    Executes a custom SQL query in Snowflake to retrieve data. This action allows
    analysts to query Snowflake databases directly from the SOAR platform and returns
    the results as a data table and JSON.


    ### Flow Description

    1. Initializes the Snowflake manager with the provided integration credentials.

    2. Submits the custom query to Snowflake via a POST request to the `/api/v2/statements`
    endpoint, automatically appending a LIMIT clause based on the `Max Results To
    Return` parameter.

    3. Checks the execution status of the query via a GET request to the `/api/v2/statements/{query_id}`
    endpoint.

    4. If the query is still running, the action suspends (runs asynchronously) and
    waits for completion.

    5. Once completed, retrieves the results, formats them, and attaches them to the
    case as a JSON result and a data table.


    ### Additional Notes

    The action automatically appends a LIMIT keyword to the query, so the provided
    query string should not contain one. Only single quotes are supported within the
    query string.
  ai_short_description: >-
    Executes a custom SQL query in Snowflake and returns the results as a data table
    and JSON.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by submitting a query to Snowflake and retrieving the
      results. It does not mutate external data (the appended LIMIT clause restricts
      it to SELECT queries), nor does it update internal entities, create insights,
      modify alerts, or create case comments.
