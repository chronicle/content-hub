Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic tool designed to verify the connectivity between
    Google SecOps and the Google Cloud Policy Intelligence service. It ensures that
    the provided configuration parameters, such as API credentials, project IDs, and
    network settings, are valid and that the service is reachable.


    ### Flow Description

    1. **Parameter Extraction:** Retrieves integration-level configuration settings
    including API Root, Project ID, and authentication details.

    2. **Validation:** Validates the format of the Service Account JSON and the Workload
    Identity Email address.

    3. **Manager Initialization:** Sets up the Google Cloud Policy Intelligence Manager,
    which handles credential building (including support for Workload Identity and
    Service Account impersonation).

    4. **Connectivity Test:** Executes a `GET` request to a specific Policy Intelligence
    endpoint (`serviceAccountLastAuthentication/activities:query`) using a test filter
    to confirm the API is responsive and credentials have sufficient permissions.

    5. **Result Reporting:** Returns a success message if the connection is established
    or an error message if the request fails.


    ### Additional Notes

    - This action does not process any entities and is strictly used for configuration
    validation.

    - Either a Service Account JSON or appropriate Workload Identity configuration
    must be present for successful authentication.
  ai_short_description: >-
    A diagnostic tool designed to verify the connectivity between Google SecOps and
    the Google Cloud Policy Intelligence service.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
