Search Service Account Activity:
  ai_description: >-
    ### General Description

    Searches for activity logs related to specific Google Cloud service accounts using
    the Policy Intelligence API. This action helps identify the last authentication
    events for service accounts within a specified GCP project, providing visibility
    into account usage and potential dormancy.


    ### Flow Description

    1. Extracts the target Project ID, Service Account Resource Names, and Max Activities
    To Return from the action parameters.

    2. Validates the input parameters, ensuring the resource names are in a valid
    CSV format and the max activities limit is within the allowed range (1-1000).

    3. Iterates through the provided service account resource names and sends a GET
    request to the Google Cloud Policy Intelligence `activities:query` API endpoint
    for each.

    4. Parses the API responses to extract structured activity data.

    5. Categorizes the results to identify which service accounts had activity data
    found and which did not.

    6. Returns the activity data as a JSON result and outputs a summary message detailing
    the findings.


    ### Additional Notes

    This action does not run on SecOps entities automatically; it requires the user
    to provide the specific resource names as an action parameter.
  ai_short_description: >-
    Searches for activity logs related to specific Google Cloud service accounts using
    the Policy Intelligence API.
