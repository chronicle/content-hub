    reasoning: >-
      The action makes a GET request to test connectivity to the Google Cloud Policy
      Intelligence API. It does not fetch contextual data for alerts/entities, mutate
      external data, mutate internal data, update entities, create insights, modify
      alert data, or create case comments.
