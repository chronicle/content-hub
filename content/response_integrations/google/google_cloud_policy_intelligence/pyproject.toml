[project]
name = "GoogleCloudPolicyIntelligence"
version = "9.0"
description = "Google Cloud Policy Intelligence is a service that helps you understand and manage your Google Cloud IAM policies. Policy Intelligence provides a comprehensive view of your policies, including their configuration, relationships, and usage. This information can be used to improve your security posture, optimize your costs, and make better decisions about your cloud resources."
requires-python = ">=3.11,<3.12"
dependencies = [
    "bs4>=0.0.2",
    "environmentcommon",
    "google-api-core==2.19.1",
    "google-api-python-client==2.142.0",
    "google-auth>=2.34.0",
    "google-auth-httplib2==0.2.0",
    "googleapis-common-protos==1.63.2",
    "requests==2.32.4",
    "tipcommon",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-mock>=3.14.1",
    "soar-sdk",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.1-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.1.6.1-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"
