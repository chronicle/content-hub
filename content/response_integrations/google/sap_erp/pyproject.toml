[project]
name = "SapErp"
description = "Integration for SAP ERP, an enterprise resource planning system that manages core business processes."
version = "1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests",
    "environmentcommon",
    "tipcommon",
    "google-auth",
]

[tool.uv.sources]
tipcommon = { path = "../../../../packages/tipcommon/whls/TIPCommon-2.4.1-py3-none-any.whl" }

[dependency-groups]
dev = [ "pytest>=8.0.0", "pytest-json-report>=1.5.0", "soar-sdk"]

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"
