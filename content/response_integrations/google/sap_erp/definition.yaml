name: "SAP ERP"
description: "Integration for SAP ERP, an enterprise resource planning system that manages core business processes."
categories:
  - "IT & Infrastructure"
identifier: "SapErp"

parameters:
  - name: "Cloud Run Service URL"
    type: string
    description: "The Cloud Run gateway proxy URL to the SAP ERP instance."
    is_mandatory: true
    integration_identifier: "SapErp"
  - name: "Verify SSL"
    type: boolean
    default_value: true
    description: "If enabled, verify that the SSL certificate of the Cloud Run gateway is valid."
    is_mandatory: false
    integration_identifier: "SapErp"

documentation_link: "https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sap-erp"
svg_logo_path: resources/logo.svg
image_path: resources/image.png
