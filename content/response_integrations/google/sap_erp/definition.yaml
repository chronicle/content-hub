name: "SAP ERP"
description: "Integration for SAP ERP, an enterprise resource planning system that manages core business processes."
categories:
  - "IT & Infrastructure"
identifier: "SapErp"

parameters:
  # Named "Cloud Run Service URL" instead of "API Root" because this integration
  # communicates with a customer-deployed Cloud Run SAP RFC Gateway rather than
  # connecting directly to an SAP ERP API endpoint.
  - name: "Cloud Run Service URL"
    type: string
    description: "The Cloud Run gateway proxy URL to the SAP ERP instance."
    is_mandatory: true
    integration_identifier: "SapErp"
  - name: "Service Account JSON"
    default_value: null
    type: password
    description: "The Google Cloud Service Account JSON key used to mint an ID token for the Cloud Run gateway. Use this on hosted SecOps SOAR tenants or when Workload Identity is not available."
    is_mandatory: false
    integration_identifier: "SapErp"
  - name: "Workload Identity Email"
    default_value: null
    type: string
    description: "The Google Cloud service account email to impersonate when minting an ID token via Workload Identity (Application Default Credentials). Use this instead of Service Account JSON when the SOAR platform or remote agent runs in Google Cloud with Workload Identity enabled."
    is_mandatory: false
    integration_identifier: "SapErp"
  - name: "Verify SSL"
    type: boolean
    default_value: true
    description: "If enabled, verify that the SSL certificate of the Cloud Run gateway is valid."
    is_mandatory: false
    integration_identifier: "SapErp"

documentation_link: "https://docs.cloud.google.com/sap/docs/secops/overview"
svg_logo_path: resources/logo.svg
image_path: resources/image.png
