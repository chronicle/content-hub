Enrich Entities:
  ai_description: "### General Description\nEnriches Hostname and IP Address entities\
    \ using endpoint data retrieved from the Endgame platform. This action identifies\
    \ matching endpoints in Endgame and retrieves comprehensive metadata, including\
    \ operating system details, MAC addresses, monitoring status, sensor information,\
    \ and group memberships. The retrieved data is used to update entity attributes\
    \ and provide a detailed data table within the case for better context during\
    \ investigations.\n\n### Flow Description\n1. **Authentication**: Connects to\
    \ the Endgame API using the integration's credentials.\n2. **Entity Processing**:\
    \ Iterates through the target entities in the current Google SecOps scope.\n3.\
    \ **Type Validation**: Filters entities to ensure they are either Hostnames or\
    \ IP Addresses.\n4. **Endgame Query**: \n    - For **HOSTNAME** entities: Makes\
    \ a GET request to the Endgame API (`/endpoints`) to find endpoints matching the\
    \ hostname.\n    - For **ADDRESS** entities: Makes a GET request to the Endgame\
    \ API (`/endpoints`) to find endpoints matching the IP address.\n5. **Data Extraction**:\
    \ Retrieves endpoint details such as OS, MAC address, status, and associated sensors/groups\
    \ from the first matching result.\n6. **Internal Enrichment**: \n    - Updates\
    \ the entity's additional properties with the retrieved metadata.\n    - Adds\
    \ a detailed CSV table to the entity's results in the case.\n    - Sets the entity's\
    \ enrichment status to true.\n7. **Finalization**: Updates the modified entities\
    \ in Google SecOps and logs out of the Endgame session.\n\n### Additional Notes\n\
