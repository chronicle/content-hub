Add IP Subnet to Host Isolation Config:
  ai_description: >-
    ### General Description

    Adds a specific IPv4 subnet to the Host Isolation configuration whitelist in Endgame.
    This action is used to ensure that specific network ranges are excluded from host
    isolation operations, preventing accidental network disconnection for critical
    infrastructure or known safe subnets.


    ### Flow Description

    1. **Initialization**: Retrieves Endgame API credentials and action parameters
    (Subnet, Description, and Insight preference).

    2. **Configuration Check**: Connects to the Endgame manager and retrieves the
    current Host Isolation whitelist via a GET request to check if the subnet already
    exists.

    3. **External Mutation**: If the subnet is not already present, it performs a
    PUT request to the Endgame API to add the specified IPv4 subnet to the whitelist.

    4. **Internal Mutation**: If the 'Create Insight' parameter is enabled, it generates
    a General Insight in the current SecOps case detailing the added subnet.

    5. **Cleanup**: Logs out of the Endgame session and reports the execution status.


    ### Additional Notes

    This action operates independently of case entities and relies entirely on the
    explicitly provided IP Subnet parameter.
  ai_short_description: >-
    Adds a specific IPv4 subnet to the Host Isolation configuration whitelist in Endgame
    to prevent it from being isolated.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a specified IPv4 subnet to the Host Isolation whitelist configuration in
      Endgame via a PUT request.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
