    This action is used to manage the whitelist of network segments that hosts are
    permitted to communicate with while in an isolated state. By removing a subnet,
    you restrict the network access available to isolated endpoints.


    ### Flow Description

    1. **Authentication**: The action authenticates with the Endgame API using the
    provided credentials.

