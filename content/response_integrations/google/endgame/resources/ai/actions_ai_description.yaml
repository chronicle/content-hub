Drivers Survey (Windows only):
  ai_description: >-
    ### General Description

    The **Drivers Survey (Windows only)** action initiates a kernel module (driver)
    survey on specific Windows endpoints managed by Endgame. It is an asynchronous
    action that first triggers an investigation task on the target host and then polls
    for the results. Once the survey is complete, it retrieves details about the loaded
    drivers, including file paths, descriptions, and modification dates, providing
    visibility into the drivers currently active on the system.


    ### Flow Description

    1. **Initialization**: The action validates the input entities (Hostname or IP
    Address) and checks if the corresponding Endgame endpoint is running a Windows
    operating system.

    2. **Task Creation**: For each valid endpoint, it creates a new investigation
    in Endgame using the `kernelModulesSurveyRequest` task via a POST request to the
    Endgame API. This initiates the collection process on the remote host.

    3. **Asynchronous Polling**: The action enters an "In Progress" state, periodically
    checking the status of the created investigations until they are marked as complete.

    4. **Data Retrieval**: Once the investigations are finished, the action fetches
    the driver data (kernel modules) from the Endgame collection via a GET request.

    5. **Output**: The results are formatted into data tables (one per entity) and
    attached as a JSON result to the action for further analysis.


    ### Additional Notes

    - This action only supports Windows endpoints. Non-Windows endpoints will be skipped.

    - The action requires the endpoint to be in a "monitored" status within Endgame
    to successfully initiate the survey.
