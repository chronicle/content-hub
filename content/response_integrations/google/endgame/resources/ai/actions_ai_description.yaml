    Searches for specific files on endpoints managed by Endgame. This action allows
    users to hunt for files by name (supporting regex) or by MD5, SHA1, and SHA256
    hashes within a designated directory. It targets Hostname and IP Address entities,
    identifies corresponding endpoints in Endgame, and initiates an asynchronous investigation
    to retrieve the search results.


    ### Flow Description

    1. Extracts action parameters including the target OS, hashes, directory, and
    filename.

    2. Iterates through the provided Hostname and IP Address entities, querying Endgame
    via API to find matching managed endpoints.

