Download File:
  ai_description: >-
    ### General Description

    This action downloads a specific file from a remote endpoint managed by Endgame.
    It supports Hostname and IP Address entities. The action operates asynchronously:
    it first initiates a download task on the Endgame platform and then periodically
    checks for completion. Once the task is finished, the action retrieves the file
    content, saves it to a specified local directory on the SOAR runner, and attaches
    the file to the corresponding entity within the Google SecOps case. It also provides
    a data table containing metadata about the downloaded file, such as size, hashes
    (MD5/SHA-256), and endpoint details.


    ### Flow Description

    1. **Endpoint Identification**: The action searches for a matching endpoint in
    Endgame using the entity's Hostname or IP Address.

    2. **Task Initiation**: If an active endpoint is found, it creates a 'downloadFileRequest'
    task in Endgame for the specified file path via a POST request.

    3. **Asynchronous Wait**: The action enters an 'In Progress' state, waiting for
    the Endgame task to reach a 'success' or 'failure' status.

    4. **Data Retrieval**: Upon successful task completion, the action fetches the
    file content (UUID-based) from Endgame.

    5. **Internal Mutation**: The file is saved to the local filesystem, attached
    to the SOAR entity, and a summary data table is added to the case wall.


    ### Additional Notes

    This is an asynchronous action. Ensure that the SOAR execution environment has
    the necessary permissions and disk space to save the downloaded files to the specified
    local folder path.
