Unisolate Host:
  ai_description: >-
    ### General Description

    The **Unisolate Host** action initiates the process of releasing a previously
    isolated endpoint within the Endgame platform. This action is critical for restoring
    network connectivity to hosts after a security incident has been resolved. It
    is designed to work specifically with Windows and MacOS endpoints.


    ### Flow Description

    1. **Authentication**: Connects to the Endgame API using provided credentials.

    2. **Endpoint Identification**: For each provided Hostname or IP Address entity,
    the action searches for a matching endpoint in the Endgame environment.

    3. **OS Validation**: Checks if the identified endpoint is running a supported
    operating system (Windows or MacOS).

    4. **Task Initialization**: Retrieves the specific task ID for a `hostIsolationReleaseRequest`
    and identifies the active sensors on the endpoint.

    5. **Execution**: Sends a request to Endgame to initialize the unisolation task
    for the identified sensors.

