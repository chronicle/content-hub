    ### General Description

    The **Hunt Registry** action allows users to search for specific registry keys
    or value names across endpoints managed by the Endgame EDR platform. It is designed
    to identify persistence mechanisms, configuration changes, or indicators of compromise
    (IOCs) stored within the Windows Registry. The action operates asynchronously,
    first initiating an investigation and a search task in Endgame, and then periodically
    checking for completion to retrieve the final results.


    ### Flow Description

    1. **Endpoint Identification**: The action iterates through the provided Hostname
    and IP Address entities, querying the Endgame API to find matching managed endpoints.

    2. **OS Validation**: It filters the discovered endpoints to ensure their operating
    system matches the 'Endpoints Core OS' parameter.

    3. **Task Creation**: If suitable endpoints are found, the action generates a
    registry search task (IOC Search) based on the provided Hive, Keys, and size constraints.

    4. **Investigation Initiation**: A new investigation is created in Endgame, grouping
    the identified sensors and the search task. The action then saves the investigation
    ID and transitions to an 'In Progress' state.

    5. **Asynchronous Monitoring**: In the background, the action checks the status
    of the investigation. Once Endgame reports that all tasks are finished, the action
    retrieves the collection of registry events.

    6. **Result Reporting**: The retrieved registry data is attached to the case as
    a JSON result, and the action completes.


    ### Additional Notes

    - This action is **Async**, meaning it will run in the background until the Endgame
    investigation is finished.

    - It specifically targets **HOSTNAME** and **ADDRESS** (IP) entities to identify
    the corresponding sensors in the Endgame environment.

