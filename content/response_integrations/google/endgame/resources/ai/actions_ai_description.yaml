Collect Autoruns:
  ai_description: >-
    ### General Description

    Collects autorun information from Windows endpoints managed by Endgame. This action
    is designed to identify persistence mechanisms on target systems by querying the
    Endgame API for various autorun categories such as services, drivers, scheduled
    tasks, and registry keys.


    ### Flow Description

    1. **Endpoint Identification**: The action iterates through the provided Hostname
    and IP Address entities to find matching monitored endpoints in the Endgame environment.

    2. **OS Verification**: It filters the identified endpoints to ensure they are
    running a Windows operating system, as autorun collection is specific to Windows.

    3. **Task Initiation**: For all valid endpoints, it creates an asynchronous 'Autorun
    Collection' task and a corresponding investigation in Endgame, using the specified
    category and metadata filters.

    4. **Status Monitoring (Async)**: The action enters an asynchronous state, periodically
    checking the Endgame API to determine if the investigation has completed.

    5. **Data Retrieval and Mapping**: Once the investigation is finished, the action
    retrieves the results, maps the findings back to the original SecOps entities
    using machine IDs, and attaches the data to the case.


    ### Additional Notes

    - This action only supports Windows endpoints. Non-Windows endpoints identified
    from entities will be skipped.

    - The action runs asynchronously; it initiates the collection and then waits for
    Endgame to process the request before fetching results.
