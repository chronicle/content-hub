Kill Process:
  ai_description: >-
    ### General Description

    The **Kill Process** action enables security responders to terminate a specific
    running process on remote endpoints managed by the Endgame platform. This action
    is designed to stop malicious execution or unauthorized software across systems
    by initiating a kill task via the Endgame API.


    ### Flow Description

    1. **Endpoint Lookup**: The action iterates through the provided Hostname and
    IP Address entities, querying the Endgame API to find matching managed endpoints.

    2. **Activity Verification**: It checks the status of each discovered endpoint;
    only endpoints in a 'Monitored' (active) state are processed.

    3. **Task Creation**: For each active endpoint, the action generates a `killProcessRequest`
    task containing the process name and optional PID.

    4. **Asynchronous Execution**: The action initiates the task and transitions into
    an asynchronous state, returning a set of task IDs to the Google SecOps platform.

    5. **Status Polling**: In the async phase, the script periodically polls the Endgame
    API to check if the process termination tasks have succeeded or failed.

    6. **Reporting**: Once tasks are complete, the action provides a summary of successful
    terminations, failed attempts, and any entities that were skipped.


    ### Additional Notes

    - This action is asynchronous and may take time to complete depending on endpoint
    connectivity.

    - If multiple endpoints match a single entity identifier, the action will target
    the first one returned by the Endgame API.
