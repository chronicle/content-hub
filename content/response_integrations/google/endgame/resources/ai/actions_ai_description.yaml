    - This action is **asynchronous**. It first creates an investigation in Endgame
    and then enters an 'In Progress' state, polling until results are ready.

    - Only entities of type **HOSTNAME** and **ADDRESS** are supported. Entities that
    do not match an active endpoint in Endgame or do not match the specified 'Endpoints
    Core OS' will be skipped.
