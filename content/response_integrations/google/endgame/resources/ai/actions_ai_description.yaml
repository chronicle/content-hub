Isolate Host:
  ai_description: >-
    ### General Description

    Initiates endpoint isolation for Windows and MacOS hosts using Endgame. This action
    is designed to contain compromised endpoints by disconnecting them from the network
    while maintaining a connection to the Endgame sensor for management and remediation
    purposes.


    ### Flow Description

    1. Connects to the Endgame API.

    2. Iterates through the target entities (Hostname or IP Address).

    3. Queries Endgame to find matching endpoints based on the entity identifier.

    4. Checks if the endpoint's operating system is supported (Windows or MacOS).

    5. Retrieves the specific `task_id` for host isolation corresponding to the endpoint's
    OS.

    6. Sends a POST request to the Endgame API to initialize the isolation task for
    the identified sensors.

    7. Confirms that the isolation status has changed to `isolation_requested`.

    8. If the `Create Insight` parameter is enabled and the isolation is successful,
    adds an insight to the entity in Google SecOps.


    ### Additional Notes

    - This action strictly supports only Windows and MacOS endpoints.

    - If multiple endpoints match a single entity identifier, the action will only
    attempt to isolate the first matching endpoint found.
