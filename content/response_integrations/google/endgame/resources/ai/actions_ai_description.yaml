Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic tool designed to verify the connectivity between
    Google SecOps and the Endgame platform. It ensures that the provided API Root,
    Username, and Password are correct and that the network path is open. The action
    works by attempting a full authentication cycle (login followed by logout).


    ### Flow Description

    1. **Configuration Retrieval**: The action fetches the integration's global configuration,
    including the API Root, Username, Password, and SSL verification settings.

    2. **Authentication**: It initializes the `EndgameManager`, which automatically
    performs a login request to the Endgame API to obtain a JWT token.

    3. **Session Termination**: Once authenticated, the action immediately calls the
    logout method to invalidate the session token and clean up resources.

    4. **Result Reporting**: If both the login and logout processes succeed, the action
    returns a success message ('Connection Established') and a result value of `true`.


    ### Additional Notes

    - This action is typically used during the initial setup of the Endgame integration
    or for troubleshooting connectivity issues.

    - It does not process any entities or modify any data within Endgame or Google
    SecOps.
