    from Endgame via a GET request to verify the existence of the specified subnet.

    3. **Subnet Removal**: If the subnet is found within the configuration, the action
    sends a DELETE request to the Endgame API (`/host-isolation-whitelist/ipv4/{subnet}`)
    to remove that specific subnet from the whitelist.

