User Sessions Survey:
  ai_description: >-
    ### General Description

    Retrieves detailed information about active user sessions from specific Endgame
    endpoints. This action is designed to provide visibility into who is currently
    logged into a system, their logon type, and session duration. It supports Windows,
    Linux, and Solaris operating systems. The action operates asynchronously: it first
    initiates an investigation (survey) on the target endpoints and then polls for
    the results until completion.


    ### Flow Description

    1. **Credential Initialization**: The action extracts API credentials and SSL
    settings from the integration configuration.

    2. **Endpoint Identification**: For each provided Hostname or IP Address entity,
    the action queries the Endgame manager to find a matching managed endpoint.

    3. **Compatibility Check**: The action verifies that the endpoint's operating
    system is supported (Windows, Linux, or Solaris).

    4. **Investigation Initiation**: It triggers a `userSessionsSurveyRequest` investigation
    in Endgame for all compatible endpoints. The action then transitions to an 'In
    Progress' state, storing the investigation IDs.

    5. **Asynchronous Polling**: In the async phase, the action periodically checks
    the status of the investigations in Endgame to determine if they have finished.

    6. **Data Collection**: Once an investigation is complete, the action retrieves
    the session data. For Windows, it collects fields like Username, Domain, and Logon
    Type. For Unix-based systems, it collects UID, GID, Shell, and Terminal information.

    7. **Output Generation**: The retrieved data is formatted into CSV tables and
    attached to the case for each entity. A full JSON result is also provided for
    further automation steps.


    ### Additional Notes

    - This action requires the Endgame sensor to be active and communicating with
    the management console.

    - If multiple endpoints match a single entity (e.g., an IP shared by multiple
    records), the action will process the first matching endpoint found.
