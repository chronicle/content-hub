Hunt IP:
  ai_description: >-
    ### General Description

    Searches for network connections on endpoints associated with Hostname or IP Address
    entities using Elastic Endgame. This action initiates an 'IOC Hunt' by creating
    a network search task within a new investigation in the Endgame platform. It is
    an asynchronous action that polls for the investigation's completion and retrieves
    detailed connection data, including local/remote addresses, ports, protocols,
    and associated process information (names, PIDs, and file hashes).


    ### Flow Description

    1. **Initialization**: The action initializes the Endgame manager and extracts
    user-defined filters such as IP addresses, protocols, and ports.

    2. **Endpoint Identification**: It iterates through the target entities, querying
    Endgame to find matching endpoints by Hostname or IP Address.

    3. **OS Filtering**: It filters the identified endpoints to ensure their operating
    system matches the 'Endpoints Core OS' parameter.

    4. **Investigation Creation**: If matching endpoints are found, it creates a 'Network
    Search' task and wraps it in a new Endgame investigation via a POST request.

    5. **Asynchronous Polling**: The action enters an asynchronous loop, periodically
    checking the status of the investigation in Endgame.

    6. **Data Retrieval**: Once the investigation is complete, it retrieves the network
    connection results and returns them as a JSON object for use in the playbook.


