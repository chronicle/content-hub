Delete File:
  ai_description: >-
    ### General Description

    Deletes a specified file from a remote endpoint managed by the Endgame platform.
    This action is designed for remediation, allowing security analysts to remove
    malicious or unauthorized files directly from hosts identified by their Hostname
    or IP Address.


    ### Flow Description

    1. Extracts the target file path from the input parameters.

    2. Iterates over the provided Hostname and IP Address entities.

    3. Queries the Endgame API to locate the corresponding managed endpoint for each
    entity.

    4. Initiates a `deleteFileRequest` task via the Endgame API for the specified
    file path on the active endpoints.

    5. Periodically polls the Endgame API asynchronously to check the completion status
    of the deletion tasks.

    6. Returns a summary of successful deletions, failed attempts, and skipped entities.


    ### Additional Notes

    - The action only operates on endpoints that are in a 'monitored' (active) state
    within Endgame.

    - If multiple endpoints match a single entity, the first matching endpoint is
    used.
