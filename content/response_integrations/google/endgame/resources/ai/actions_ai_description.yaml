Process Survey:
  ai_description: >-
    ### General Description

    This action retrieves detailed information about running processes from specific
    endpoints managed by Endgame. It allows security analysts to perform a remote
    'Process Survey' to identify potentially malicious activity, fileless attacks,
    or suspicious unbacked executables. The action is asynchronous, meaning it initiates
    an investigation in Endgame and waits for the results to be collected before completing.


    ### Flow Description

    1. **Endpoint Identification**: The action iterates through the provided Hostname
    or IP Address entities and searches for matching managed endpoints in the Endgame
    environment.

    2. **Task Configuration**: Based on the endpoint's operating system and the action
    parameters, a specific 'Process Survey' task is configured (e.g., enabling thread
    collection or suspicious process filtering).

    3. **Investigation Initiation**: The action creates a new investigation in Endgame
    via API and assigns the survey task to the endpoint's sensors.

    4. **Asynchronous Wait**: The action enters an 'In Progress' state, periodically
    checking the Endgame API to see if the investigation tasks have finished.

