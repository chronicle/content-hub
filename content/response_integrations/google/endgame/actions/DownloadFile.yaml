name: Download File
description: Download a file from a specific Endgame endpoint.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#download_file
integration_identifier: Endgame
parameters:
-   name: Full File Path
    default_value: ''
    type: string
    description: Enter the path to the file
    is_mandatory: true
-   name: Full Download Folder Path
    default_value: ''
    type: string
    description: Enter the path to the folder, where you want to store this file.
    is_mandatory: true
-   name: Expected SHA-256 Hash
    default_value: ''
    type: string
    description: Enter the expected SHA-256 hash
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
