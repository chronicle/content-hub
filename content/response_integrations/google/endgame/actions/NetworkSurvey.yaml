name: Network Survey
description: Get information about connections, DNS cache, Net Bios, ARP, and Route
    tables from a specific Endgame endpoint.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#network_survey
integration_identifier: Endgame
parameters:
-   name: Max Items to Return
    default_value: '50'
    type: string
    description: Specify how many items to return.
    is_mandatory: false
-   name: Include Route Entries Information
    default_value: 'true'
    type: boolean
    description: Specify to get information about the Route Entries.
    is_mandatory: false
-   name: Include Net Bios Information
    default_value: 'true'
    type: boolean
    description: Specify to get information about Net Bios.
    is_mandatory: false
-   name: Include DNS Cache Information
    default_value: 'true'
    type: boolean
    description: Specify to get information about the DNS Cache.
    is_mandatory: false
-   name: Include ARP Table Information
    default_value: 'true'
    type: boolean
    description: Specify to get information about the ARP table.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/network_survey_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
