name: Hunt Registry
description: Searches for a registry key or value name.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#hunt_registry
integration_identifier: Endgame
parameters:
-   name: Hive
    default_value: ALL
    type: string
    description: 'One of the following: HKEY_CLASSES_ROOT, HKEY_CURRENT_CONFIG, HKEY_USERS,
        HKEY_LOCAL_MACHINE, ALL'
    is_mandatory: false
-   name: Keys
    type: string
    description: Registry Key or Value Name
    is_mandatory: false
-   name: Min Size
    type: string
    description: Min byte size
    is_mandatory: false
-   name: Max Size
    type: string
    description: Max byte size
    is_mandatory: false
-   name: Endpoints Core OS
    default_value: windows
    type: string
    description: 'Select an operating system (i.e., Windows, Linux, or Mac) to filter
        the Endpoints list. Note: You can only create a single investigation for endpoints
        that run on the same operating system.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/hunt_registry_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
