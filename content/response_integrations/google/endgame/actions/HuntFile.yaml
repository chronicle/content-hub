name: Hunt File
description: Searches for running files.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#hunt_file
integration_identifier: Endgame
parameters:
-   name: Endpoints Core OS
    default_value: windows
    type: string
    description: 'Select an operating system (i.e., Windows, Linux, or Mac) to filter
        the Endpoints list. Note: You can only create a single investigation for endpoints
        that run on the same operating system.'
    is_mandatory: false
-   name: MD5 Hashes
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter MD5 Hashes, separated
        by comma
    is_mandatory: false
-   name: SHA1 Hashes
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter SHA1 Hashes, separated
        by comma
    is_mandatory: false
-   name: SHA256 Hashes
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter SHA256 Hashes, separated
        by comma
    is_mandatory: false
-   name: Directory
    type: string
    description: The starting directory path e.g. C:\windows\system32
    is_mandatory: false
-   name: Find File
    type: string
    description: 'Enter the filename(s) to search. TIP: Enter a regex to narrow search
        results.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/hunt_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
