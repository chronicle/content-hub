name: Process Survey
description: Get information about running processes on a specific Endgame endpoint.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#process_survey
integration_identifier: Endgame
parameters:
-   name: Max Items to Return
    default_value: '50'
    type: string
    description: Specify how many items to return.
    is_mandatory: false
-   name: Detect Fileless Attacks (Windows Only)
    default_value: 'false'
    type: boolean
    description: Specify to detect fileless attacks. Windows Only.
    is_mandatory: false
-   name: Detect Malware With MalwareScore (Windows Only)
    default_value: 'false'
    type: boolean
    description: Specify to detect malware processes with MalwareScore. Windows Only.
    is_mandatory: false
-   name: Collect Process Threads
    default_value: 'false'
    type: boolean
    description: Specify to include information about the amount of process threads
        in the response.
    is_mandatory: false
-   name: Return Only Suspicious Processes
    default_value: 'true'
    type: boolean
    description: 'Specify to return only suspicious processes from the endpoint. By
        the Endgame definition: Suspicious processes are unbacked executable processes.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/process_survey_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
