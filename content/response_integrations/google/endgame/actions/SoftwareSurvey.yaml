name: Software Survey (Windows only)
description: Get information about an installed software on a specific Endgame endpoint.
integration_identifier: Endgame
parameters:
-   name: Max Items to Return
    default_value: '50'
    type: string
    description: Specify how many items to return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/software_survey_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
