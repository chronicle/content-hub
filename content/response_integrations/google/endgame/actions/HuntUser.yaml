name: Hunt User
description: Searches the network for logged in users.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#hunt_user
integration_identifier: Endgame
parameters:
-   name: Endpoints Core OS
    default_value: windows
    type: string
    description: 'Select an operating system (i.e., Windows, Linux, or Mac) to filter
        the Endpoints list. Note: You can only create a single investigation for endpoints
        that run on the same operating system.'
    is_mandatory: false
-   name: Find Username
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter username(s), separate
        multiple entries with a semicolon.
    is_mandatory: false
-   name: Domain Name
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter Domain Name
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/hunt_user_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
