name: System Survey
description: Get system information on a single endgame endpoint, such as memory use,
    dns, and OS.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#system_survey
integration_identifier: Endgame
parameters:
-   name: Max Items to Return
    default_value: '50'
    type: string
    description: Specify how many items to return.
    is_mandatory: false
-   name: Include Security Product Information (Windows only)
    default_value: 'true'
    type: boolean
    description: Specify to get information about the security products installed
        on the endpoint (Windows only).
    is_mandatory: false
-   name: Include Patch Information (Windows only)
    default_value: 'true'
    type: boolean
    description: Specify to get information about patches (Windows only).
    is_mandatory: false
-   name: Include Disk Information
    default_value: 'true'
    type: boolean
    description: Specify to get information about Disks.
    is_mandatory: false
-   name: Include Network Interface Information
    default_value: 'true'
    type: boolean
    description: Specify to get information about network interfaces.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/system_survey_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
