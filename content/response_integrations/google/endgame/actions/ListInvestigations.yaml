name: List Investigations
description: List Endgame Investigations.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#list_investigations
integration_identifier: Endgame
parameters:
-   name: OS
    default_value: Solaris, Windows, MacOs, Linux
    type: string
    description: Specify for which OS you want to list investigations. Parameter can
        take multiple values as a comma separated string.
    is_mandatory: false
-   name: Fetch investigations for the last X hours
    default_value: ''
    type: string
    description: Return investigations created for the specified time frame in hours.
    is_mandatory: false
-   name: Max Investigation to Return
    default_value: ''
    type: string
    description: Specify how many investigation you want to query.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_investigations_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
