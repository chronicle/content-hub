name: Hunt IP
description: Searches for network connections.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#hunt_ip
integration_identifier: Endgame
parameters:
-   name: Endpoints Core OS
    default_value: windows
    type: string
    description: 'Select an operating system (i.e., Windows, Linux, or Mac) to filter
        the Endpoints list. Note: You can only create a single investigation for endpoints
        that run on the same operating system.'
    is_mandatory: false
-   name: Remote IP Address
    type: string
    description: remote IP address - separated by comma
    is_mandatory: false
-   name: Local IP Address
    type: string
    description: separated by comma
    is_mandatory: false
-   name: State
    type: string
    description: Enter state to return. Ex. ANY
    is_mandatory: false
-   name: Protocol
    type: string
    description: Ex. ANY, UDP, TCP
    is_mandatory: false
-   name: Network Port
    type: string
    description: Network Port
    is_mandatory: false
-   name: Network Remote
    type: string
    description: Network Remote or Local
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/hunt_ip_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
