name: Hunt Process
description: Searches for running processes.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#hunt_process
integration_identifier: Endgame
parameters:
-   name: Endpoints Core OS
    default_value: windows
    type: string
    description: 'Select an operating system (i.e., Windows, Linux, or Mac) to filter
        the Endpoints list. Note: You can only create a single investigation for endpoints
        that run on the same operating system.'
    is_mandatory: false
-   name: MD5 Hashes
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter MD5 Hashes, separated
        by comma
    is_mandatory: false
-   name: SHA1 Hashes
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter SHA1 Hashes, separated
        by comma
    is_mandatory: false
-   name: SHA256 Hashes
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter SHA256 Hashes, separated
        by comma
    is_mandatory: false
-   name: Process Name
    type: string
    description: ADVANCED CONFIGURATION for this hunt. Enter Process Name ex. iss.exe
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/hunt_process_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
