name: Endgame Connector
parameters:
- name: DeviceProductField
  default_value: device_product
  type: string
  description: The field name used to determine the device product
  is_mandatory: true
  is_advanced: false
  mode: regular
- name: EventClassId
  default_value: event_name
  type: string
  description: The field name used to determine the event name (sub-type)
  is_mandatory: false
  is_advanced: false
  mode: regular
- name: PythonProcessTimeout
  default_value: '30'
  type: string
  description: The timeout limit (in seconds) for the python process running current
    script
  is_mandatory: true
  is_advanced: false
  mode: regular
- name: API Root
  default_value: ''
  type: string
  description: API Root
  is_mandatory: true
  is_advanced: false
  mode: script
- name: Username
  default_value: ''
  type: string
  description: Username
  is_mandatory: true
  is_advanced: false
  mode: script
- name: Password
  default_value: ''
  type: password
  description: Password
  is_mandatory: true
  is_advanced: false
  mode: script
- name: Verify SSL
  default_value: 'false'
  type: boolean
  description: Verify SSL
  is_mandatory: false
  is_advanced: false
  mode: script
- name: Max Days Backwards
  default_value: ''
  type: string
  description: Max Days Backwards
  is_mandatory: false
  is_advanced: false
  mode: script
- name: Environment Field Name
  default_value: ''
  type: string
  description: If defined - connector will extract the environment from the specified
    event field. You can manipulate the field data using the Regex pattern field to
    extract specific string. In case the the extracted environment field and Siemplify
    environment name are not equal - you can map them in the map.json that is auto-generated
    on the first run, inside the <run-folder>.<run-folder> = C:\Siemplify_Server\Scripting\SiemplifyConnectorExecution<Connector_Folder>
  is_mandatory: false
  is_advanced: false
  mode: script
- name: Environment Regex Pattern
  default_value: ''
  type: integer
  description: 'If defined - the connector will implement the specific RegEx pattern
    on the data from "envirnment field" to extract specific string. For example -
    extract domain from sender''s address: "(?<=@)(\S+$)"'
  is_mandatory: false
  is_advanced: false
  mode: script
- name: Alerts Count Limit
  default_value: ''
  type: string
  description: Alerts Count Limit
  is_mandatory: false
  is_advanced: false
  mode: script
- name: Proxy Server Address
  default_value: ''
  type: string
  description: The address of the proxy server to use.
  is_mandatory: false
  is_advanced: false
  mode: script
- name: Proxy Username
  default_value: ''
  type: string
  description: The proxy username to authenticate with.
  is_mandatory: false
  is_advanced: false
  mode: script
- name: Proxy Password
  default_value: ''
  type: password
  description: The proxy password to authenticate with.
  is_mandatory: false
  is_advanced: false
  mode: script
description: ''
integration: Endgame
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/endgame#endgame_connector
rules: []
is_connector_rules_supported: true
creator: Admin
