[project]
name = "Endgame"
version = "17.0"
description = "Endpoint protection built to stop advanced attacks before damage and loss occurs"
requires-python = ">=3.11,<3.12"
dependencies = [ "arrow==1.3.0", "requests>=2.32.4", "tipcommon", "environmentcommon",]

[dependency-groups]
dev = [ "pytest>=9.1.1", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint]
ignore = [ "ALL",]

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.0.11-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.3-py3-none-any.whl"
