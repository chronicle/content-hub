name: Get Child Pages
description: 'Get child pages for the Atlassian Confluence Server page. Note: This
    action doesn’t run on Chronicle SOAR entities.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/atlassian-confluence-server#get_child_pages
integration_identifier: AtlassianConfluenceServer
parameters:
-   name: Page ID
    default_value: ''
    type: string
    description: Specify the page id to return.
    is_mandatory: true
-   name: Max Records to Return
    default_value: '10'
    type: string
    description: Specify the limit of child pages to return.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/GetChildPages_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
