Get Child Pages:
  ai_description: >-
    ### General Description

    The **Get Child Pages** action retrieves a list of child pages for a specific
    Atlassian Confluence Server page. It is designed to help users explore the page
    hierarchy within a Confluence space by providing metadata for all pages nested
    directly under a given parent ID.


    ### Flow Description

    1. **Initialization:** The action initializes the connection using the provided
    Atlassian Confluence Server credentials.

    2. **Parameter Validation:** It extracts the 'Page ID' and 'Max Records to Return'
    parameters, ensuring the limit is a positive integer.

    3. **API Request:** The action calls the Confluence REST API endpoint `/rest/api/content/{page_id}/child/page`
    with the specified limit.

    4. **Response Parsing:** The manager parses the API response into a structured
    data model, applying sensitive data masking to internal links.

    5. **Result Handling:** If child pages are found, they are added to the action's
    JSON result and the action completes successfully. If no children exist for the
    provided ID, it returns a 'No child pages were found' message.


    ### Additional Notes

    - **No Entity Support:** This action does not run on Google SecOps entities (e.g.,
    Hostname, IP). It requires a manual input of a Page ID.

    - **Data Masking:** The action automatically masks sensitive URL components (like
    'base' and 'self' links) in the returned JSON to ensure security.

    - **Output:** The results are provided as a JSON object containing the list of
    child pages and their basic metadata (ID, type, status, title).
  ai_short_description: >-
    Retrieves a list of child pages for a specific Atlassian Confluence Server page.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
