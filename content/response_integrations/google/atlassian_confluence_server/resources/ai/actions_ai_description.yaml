Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity between Google SecOps and the Atlassian Confluence Server
    instance. This action validates the provided credentials (either Username/Password
    or Personal Access Token) and the API Root URL by performing a lightweight API
    call to retrieve a single content item. It ensures that the integration is correctly
    configured and the server is reachable.


    ### Flow Description

    1. **Parameter Initialization**: Retrieves the API Root, authentication credentials
    (Username/Password or API Token), and SSL verification settings from the integration
    configuration.

    2. **Manager Setup**: Initializes the Confluence Manager which sets up the authentication
    headers or basic auth session.

    3. **Connectivity Test**: Executes a GET request to the `/rest/api/content` endpoint
    with a limit of 1 result.

    4. **Response Validation**: Checks the HTTP response status. If a Personal Access
    Token is used, it specifically verifies that the response contains results to
    ensure the token has sufficient permissions.

    5. **Execution Completion**: Returns a success message if the connection is established,
    or an error message if authentication fails or the server is unreachable.


    ### Additional Notes

    Either a combination of Username and Password or a Personal Access Token (API
    Token) must be provided in the integration configuration for the action to succeed.
