Get Page Comments:
  ai_description: >-
    ### General Description

    Retrieves comments associated with a specific page in Atlassian Confluence Server.
    This action allows security analysts to gather context from documentation or collaboration
    threads related to an investigation. It fetches comment data including the body
    content and metadata, supporting pagination and field expansion for detailed results.


    ### Flow Description

    1. Initializes the Confluence Manager using the integration's configuration (API
    Root, credentials, and SSL settings).

    2. Extracts the 'Page ID', 'Expand', and 'Max Records to Return' parameters from
    the action input.

    3. Validates that 'Max Records to Return' is a positive integer.

    4. Sends a GET request to the Confluence Server's child comment endpoint (`/rest/api/content/{page_id}/child/comment`)
    for the specified Page ID.

    5. Parses the retrieved comments into a structured JSON format.

    6. Adds the retrieved comments to the action's JSON results and returns a success
    message. If no comments are found, it reports the absence of data.


    ### Additional Notes

    - This action does not run on Google SecOps entities; it is a standalone utility
    that requires a specific Page ID as input.
