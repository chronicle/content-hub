List Pages:
  ai_description: >-
    ### General Description

    The **List Pages** action retrieves a list of pages from an Atlassian Confluence
    Server instance based on user-defined filtering criteria. It is designed for content
    discovery and metadata retrieval, allowing users to search for pages by title,
    space name, or status. This action does not interact with specific entities but
    provides a broad overview of available content within the Confluence environment.


    ### Flow Description

    1. **Initialization:** Retrieves configuration parameters (API Root, credentials)
    and action-specific filters.

    2. **Validation:** Checks if the `Max Records to Return` is a positive integer
    and ensures that if a filter logic is selected, a filter key is also provided.

    3. **Data Retrieval:** Executes a GET request to the Confluence API (`/rest/api/content`)
    with expansions for `space` and `history` data.

    4. **Local Filtering:** Iterates through the paginated results and applies the
    specified filtering logic (Equal/Contains) against the retrieved page attributes.

    5. **Output:** Constructs a CSV data table for the Case Wall and populates the
    JSON result with the detailed page metadata.


    ### Additional Notes

    - **Entity Support:** This action does not run on Chronicle SOAR entities.

    - **Filter Dependency:** If `Filter Key` and `Filter Logic` are set but `Filter
    Value` is empty, the action will return results without applying the filter.

    - **Pagination:** The action automatically handles API pagination to retrieve
    the requested number of records.
