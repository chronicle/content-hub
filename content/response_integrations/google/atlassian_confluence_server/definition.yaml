identifier: AtlassianConfluenceServer
name: Atlassian Confluence Server
parameters:
-   name: Api Root
    default_value: https://{confluence_server_ip}:{port}
    type: string
    description: Specify Confluence Server Api Root to connect to.
    is_mandatory: true
    integration_identifier: AtlassianConfluenceServer
-   name: Username
    default_value: null
    type: string
    description: Specify a username to use for connection. Integration supports authentication
        on either username+password or personal access token (PAT). Please refer to
        the documentation for instructions.
    is_mandatory: false
    integration_identifier: AtlassianConfluenceServer
-   name: Password
    default_value: null
    type: password
    description: Specify a password to use for connection. Integration supports authentication
        on either username+password or personal access token (PAT). Please refer to
        the documentation for instructions.
    is_mandatory: false
    integration_identifier: AtlassianConfluenceServer
-   name: Api Token
    default_value: null
    type: password
    description: Specify a token to use for connection. Integration supports authentication
        on either username+password or personal access token (PAT). Please refer to
        the documentation for instructions.
    is_mandatory: false
    integration_identifier: AtlassianConfluenceServer
    display_name: Personal Access Token
-   name: Verify SSL
    default_value: 'true'
    type: boolean
    description: If enabled, the certificate configured for the API root is validated.
    is_mandatory: false
    integration_identifier: AtlassianConfluenceServer
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/atlassian-confluence-server
categories:
- IT & Infrastructure
svg_logo_path: resources/logo.svg
image_path: resources/image.png
