    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a hard reset task on a specified Virtual Machine in the vSphere environment.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action connects to vSphere and executes a state-changing API call (`ResetVM_Task`)
