    1. Establishes a connection to the VSphere server using the configured credentials.

    2. Searches for and retrieves the Virtual Machine object matching the provided
    `Vm Name` parameter.

    3. Executes a power-off command on the retrieved Virtual Machine via the VSphere
    API.

    4. Returns a success message once the power-off task is completed.


