Get Vm By Ip:
  ai_description: >-
    ### General Description

    Retrieves Virtual Machine (VM) information from VMware vSphere based on IP address
    entities. This action helps analysts identify the specific virtual infrastructure
    associated with an IP address.


    ### Flow Description

    1. Initializes the connection to the vSphere server using the integration configuration.

    2. Iterates through the target entities provided in the case.

    3. Filters the entities to process only those of type `ADDRESS` (IP addresses).

    4. For each valid IP address, makes an API call to vSphere to search for the corresponding
    VM (`FindAllByIp`).

    5. If a VM is found, retrieves detailed information about it, including Name,
    Template, Path, Guest OS, UUIDs, Power State, and VMware Tools status.

    6. Aggregates the retrieved VM information and attaches it to the action's JSON
    result.


    ### Additional Notes

    If multiple VMs are found with the same IP address, the action will return information
    for the first VM returned by vSphere.
