Get System Info:
  ai_description: >-
    ### General Description

    Retrieves detailed configuration and runtime information about a specific Virtual
    Machine (VM) from VMware vSphere.


    ### Flow Description

    1. Connects to the VMware vSphere server using the provided integration credentials.

    2. Searches for the target Virtual Machine by its name via the vSphere API.

    3. Retrieves detailed configuration and runtime information for the specified
    VM, including its IP address, power state, guest OS, and UUIDs.

    4. Formats the retrieved data into a CSV table and a JSON object.

    5. Returns the information to the SecOps platform as action results.


    ### Additional Notes

    The action requires the exact VM name as it appears in vCenter to successfully
    locate and retrieve the VM's information.
