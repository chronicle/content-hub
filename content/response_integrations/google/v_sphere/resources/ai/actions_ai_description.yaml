Reset:
  ai_description: >-
    ### General Description

    Performs a hard reset on a specified Virtual Machine (VM) within VMware vSphere.
    This action directly interacts with the vCenter server to initiate a reset task
    for the target VM.


    ### Flow Description

    1. Establishes a connection to the vSphere server using the provided integration
    credentials.

    2. Queries the vSphere environment to retrieve the Virtual Machine object that
    matches the provided `Vm Name`.

    3. Executes the `ResetVM_Task` API call to perform a hard reset on the identified
    Virtual Machine.

    4. Waits for the task to complete and returns a success message.


    ### Additional Notes

    This action directly affects the power state of the VM in the hypervisor. It does
    not operate on Google SecOps entities and relies entirely on the provided VM name
    parameter.
