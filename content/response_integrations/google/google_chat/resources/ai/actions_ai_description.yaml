List Spaces:
  ai_description: >-
    ### General Description

    Lists spaces that the currently configured Google Chat bot has been added to.
    It allows filtering the spaces based on specific keys and logic, and can optionally
    retrieve user memberships for each space.


    ### Flow Description

    1. Extracts configuration and action parameters, including filtering criteria
    and limits.

    2. Validates the provided limit parameter to ensure it is a positive integer.

    3. Initializes the `GoogleChatManager` to handle API interactions.

    4. Makes a GET request to the Google Chat API (`/v1/spaces`) to retrieve the list
    of spaces.

    5. Filters the retrieved spaces based on the provided `Filter Key`, `Filter Logic`,
    and `Filter Value`.

    6. If `Include User Memberships` is enabled, makes additional GET requests (`/v1/{space}/members`)
    to fetch membership details for each filtered space.

    7. Formats the results and adds them to the case wall as a data table and as JSON
    results.


    ### Additional Notes

    This action does not run on Siemplify entities. It operates independently to query
    the Google Chat environment.
  ai_short_description: >-
    Lists spaces that the currently configured Google Chat bot was added to, optionally
    filtering the results and including user memberships.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data (spaces and memberships) from Google Chat via GET requests.
      It does not mutate external data, mutate internal data, update entities, create
      insights, modify alert data, or create case comments.
  entity_usage:
