  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Filter Key | String | No | Specify the key that needs to be used to filter Google
    Chat spaces. |

    | Filter Logic | String | No | Specify what filter logic should be applied. Filtering
    logic is working based on the value provided in the "Filter Key" parameter. |

    | Filter Value | String | No | Specify what value should be used in the filter.
    If "Equal" is selected, action will try to find the exact match among results
    and if "Contains" is selected, action will try to find results that contain that
    substring. If nothing is provided in this parameter, the filter will not be applied.
    Filtering logic is working based on the value provided in the "Filter Key" parameter.
    |

    | Max Records To Return | String | No | Specify how many records to return. If
    nothing is provided, action will return 50 records. |

    | Include User Memberships | Boolean | No | If enabled, user memberships information
    will be added to the action Case Wall table and JSON result. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Google Chat service using the parameters provided in
    the integration configuration. This action ensures that the API Root URL, Service
    Account credentials, and network settings are correctly configured and functional.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Root URL, Service
    Account, Verify SSL).

    2. Initializes the Google Chat Manager with the provided credentials.

    3. Makes a GET request to the Google Chat API (`/v1/spaces`) to verify connectivity
    and authentication.

    4. Returns a successful execution state if the connection is established, or fails
    with an error message if the connection or authentication fails.


    ### Additional Notes

    This action is strictly used for diagnostic purposes to verify the integration
    setup and does not interact with cases, alerts, or entities.
