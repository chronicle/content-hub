Send Advanced Message:
  ai_description: >-
    ### General Description

    Sends an advanced message to a Google Chat space based on a provided JSON payload.
    This action allows for rich formatting and interactive elements (like cards and
    buttons) to be sent to a specified Google Chat space.


    ### Flow Description

    1. Extracts the `Space Name` and `Message JSON Payload` parameters.

    2. Parses the provided string payload into a valid JSON object.

    3. Initializes the Google Chat API client with the provided service account credentials.

    4. Makes a POST request to the Google Chat API (`/v1/spaces/{space_name}/messages`)
    to create the advanced message in the specified space.

    5. Returns the JSON representation of the created message as the action result.


    ### Additional Notes

    This action does not operate on or interact with SecOps entities.
