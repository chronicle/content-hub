Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Qualys EDR server using the provided integration configuration
    parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Instantiates the `QualysEDRManager` which attempts to authenticate and retrieve
    a JWT token via a POST request to the `auth` endpoint.

    3. Returns a success message if the connection and authentication are successful,
    or an error message if they fail.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to ensure the integration
    is correctly configured and can communicate with the Qualys EDR API.
  ai_short_description: >-
    Tests connectivity to the Qualys EDR server using the provided integration configuration
    parameters.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
