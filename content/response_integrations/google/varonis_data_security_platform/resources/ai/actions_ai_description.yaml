    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action only authenticates to the Varonis Data Security Platform to verify
      connectivity. It does not fetch contextual data, mutate external data, mutate
      internal data, update entities, create insights, modify alert data, or create
      case comments.
