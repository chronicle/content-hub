Update Alert:
  ai_description: >-
    ### General Description

    Updates the status and closing reason of alerts in the Varonis Data Security Platform.


    ### Flow Description

    1. Establishes a connection to the Varonis Data Security Platform API using the
    provided credentials.

    2. Retrieves the `Alert GUID`, `Alert Status`, and `Closing Reason` parameters
    from the action configuration.

    3. Validates the input parameters, ensuring that a closing reason is provided
    if the alert status is set to 'Closed'.

    4. Sends a POST request to the Varonis API to update the status and closing reason
    of the specified alerts.

    5. Returns a success message if the update is successful, or an error message
    if the operation fails.


    ### Additional Notes

    Multiple alerts can be updated simultaneously by providing a comma-separated list
    of Alert GUIDs in the `Alert GUID` parameter.
  ai_short_description: >-
    Updates the status and closing reason of alerts in the Varonis Data Security Platform.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the status and closing reason of alerts in the Varonis Data Security
      Platform.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Varonis API to update the status of alerts,
      which mutates external data. It does not fetch contextual data, mutate internal
      SecOps data, update entities, or create insights.
