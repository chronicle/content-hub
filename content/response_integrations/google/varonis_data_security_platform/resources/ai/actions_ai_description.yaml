Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Varonis Data Security Platform using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the Varonis Data Security Platform manager.

    3. Attempts to authenticate by making a POST request to the `datadvantage/api/authentication/win`
    endpoint to retrieve an access token.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is used to verify that the integration is configured correctly and
    can communicate with the Varonis Data Security Platform. It does not perform any
    operational tasks on alerts or entities.
  ai_short_description: >-
    Tests connectivity to the Varonis Data Security Platform using the provided integration
    configuration parameters.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
