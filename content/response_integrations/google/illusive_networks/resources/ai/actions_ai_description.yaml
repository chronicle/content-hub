Run Forensic Scan:
  ai_description: >-
    ### General Description

    Initiates a forensic scan on endpoint entities (Hostname and IP Address) using
    Illusive Networks and retrieves the scan results. The action can fetch various
    forensic details such as system information, prefetch files, installed programs,
    startup processes, running processes, user-assist programs, and PowerShell history.


    ### Flow Description

    1. Filters target entities to include only Hostname and IP Address entities.

    2. Initiates a forensic scan request for each valid entity via the Illusive Networks
    API.

    3. Periodically checks the status of the forensic scan (asynchronous execution).

    4. Once the scan is ready, fetches the requested forensic data based on the action's
    input parameters.

    5. Enriches the entities with the retrieved host information and updates them
    in the platform.

    6. Attaches the forensic data as data tables and JSON results to the action output.


    ### Additional Notes

    This is an asynchronous action. It will continue to run in the background until
    the forensic scan is completed on the Illusive Networks side or until it times
    out.
  ai_short_description: >-
    Initiates a forensic scan on Hostname and IP Address entities using Illusive Networks,
    retrieves the requested forensic data, and enriches the entities with the results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches forensic data from Illusive Networks via GET requests (after
      initiating a scan via POST). It does not mutate external data in a way that
      changes system state (like blocking or containing), it just triggers a read-only
      scan. It updates internal entities with the fetched data (`siemplify.update_entities`).
      It does not create insights or case comments.
