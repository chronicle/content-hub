Add Deceptive Server:
  ai_description: >-
    ### General Description

    Adds a new deceptive server in Illusive Networks.


    ### Flow Description

    1. Initializes the Illusive Networks manager with the provided API credentials.

    2. Checks if a deceptive server with the specified name already exists via an
    API GET request.

    3. If the server already exists, the action halts and raises an error.

    4. If the server does not exist, makes an API POST request to create the new deceptive
    server with the specified service types and policies.

    5. Returns a success message upon successful creation.


    ### Additional Notes

    None.
  ai_short_description: >-
    Adds a new deceptive server in Illusive Networks.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new deceptive server in Illusive Networks.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to Illusive Networks to create a new deceptive
      server, which mutates external data. It does not fetch contextual data for enrichment,
      nor does it mutate internal SecOps data, update entities, create insights, modify
      alerts, or create case comments.
