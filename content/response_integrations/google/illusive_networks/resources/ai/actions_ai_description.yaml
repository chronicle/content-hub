Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname entities using Illusive Networks. This action retrieves detailed
    host information such as machine name, health status, OS details, and logged-in
    user, and attaches this data to the entity within the platform.


    ### Flow Description

    1. Filters the target entities to include only those of type Hostname.

    2. Iterates through the filtered entities and makes a GET request to the Illusive
    Networks API (`/api/v2/monitoring/hosts`) to fetch host details.

    3. If host data is found, updates the entity's `additional_properties` with the
    retrieved information and marks the entity as enriched.

    4. Attaches a CSV table containing the host details to the action results for
    each successfully enriched entity.

    5. Updates the modified entities in the Google SecOps platform.


    ### Additional Notes

    Entities that do not return data from Illusive Networks will be skipped and reported
    as failed in the action output.
