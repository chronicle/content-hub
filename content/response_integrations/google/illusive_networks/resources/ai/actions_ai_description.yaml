Add Deceptive User:
  ai_description: >-
    ### General Description

    Adds a new deceptive user in Illusive Networks. This action creates a new deceptive
    user entity in the external system with the specified credentials, domain, and
    policies.


    ### Flow Description

    1. Initializes the Illusive Networks manager with API credentials.

    2. Checks if the specified deceptive user already exists via a GET request to
    the Illusive Networks API.

