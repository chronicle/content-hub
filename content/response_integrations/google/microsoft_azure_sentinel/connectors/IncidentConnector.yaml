name: Microsoft Azure Sentinel Incident Connector
parameters:
-   name: DeviceProductField
    default_value: ProductName
    type: string
    description: The field name used to determine the device product
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: AlertName
    type: string
    description: The field name used to determine the event name (sub-type)
    is_mandatory: false
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: '180'
    type: string
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: ''
    type: integer
    description: 'If defined - the connector will implement the specific RegEx pattern
        on the data from "environment field" to extract specific string. For example
        - extract domain from sender''s address: "(?<=@)(\S+$)"'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://management.azure.com
    type: string
    description: The API Root of Microsoft Azure Sentinel REST API root.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: OAUTH2 Login Endpoint Url
    default_value: https://login.microsoftonline.com
    type: string
    description: Specify the url, that connector should use for OAUTH2 Login.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client ID
    default_value: ''
    type: string
    description: Client (Application) ID that was added for the app registration in
        Azure Active Directory for this integration.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client Secret
    default_value: ''
    type: password
    description: Secret that was entered for Azure AD app registration
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Active Directory ID
    default_value: ''
    type: string
    description: Azure Active Directory Tenant ID, can be viewed in Active Directory
        > App Registration > <Application you configured for your integration> > Directory
        (tenant) ID.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Sentinel Workspace Name
    default_value: ''
    type: string
    description: Name of the Azure Sentinel workspace to work with, can be viewed
        in Azure portal > Azure Sentinel > Azure Sentinel Workspaces.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Subscription ID
    default_value: ''
    type: string
    description: 'Microsoft Azure Subscription ID, can be viewed in Azure Portal >
        Subscriptions > <Your Subscription> > Subscription ID. '
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Resource Group
    default_value: ''
    type: string
    description: Name of Azure Resource Group where Azure Sentinel is located.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: false
    type: boolean
    description: Verify SSL certificates for HTTPS requests to Microsoft Azure.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Incidents per Cycle
    default_value: '10'
    type: integer
    description: How many incidents should be processed during one connector run
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Offset Time In Hours
    default_value: '24'
    type: integer
    description: 'Number of hours before the first connector iteration to retrieve
        alerts from. This parameter applies to the initial connector iteration after
        you enable the connector for the first time, or used as a fallback value in
        cases where connector''s last run timestamp expires. Default value: 24 hours.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Incident Statuses to Fetch
    default_value: Draft, New, InProgress, Closed
    type: string
    description: Specify the statuses of the incidents that should be fetched by the
        Siemplify server. Comma-separated string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Incident Severities to Fetch
    default_value: Informational, Low, Medium, High, Critical
    type: string
    description: Specify the severities of the incidents that should be fetched by
        the Siemplify server. Comma-separated string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: ip
    description: Proxy server to use for connection.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Username
    default_value: ''
    type: string
    description: Proxy server username
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Password
    default_value: ''
    type: password
    description: Proxy server password
    is_mandatory: false
    is_advanced: true
    mode: script
description: DEPRECATED! Fetches Incidents from Azure Sentinel.
integration: MicrosoftAzureSentinel
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-azure-sentinel#microsoft-azure-sentinel-incidents-connector
rules: []
is_connector_rules_supported: false
creator: admin
