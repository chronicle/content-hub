name: Microsoft Azure Sentinel Incident Connector v2
parameters:
-   name: DeviceProductField
    default_value: product_type
    type: string
    description: Describes the name of the field where the product name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: event_type
    type: string
    description: Describes the name of the field where the event name is stored.
    is_mandatory: false
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: 480
    type: integer
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If environment field isn't found, environment is "".
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return value unchanged. Used to
        allow the user to manipulate the environment field via regex logic. If regex
        pattern is null or empty, or the environment value is null, the final environment
        result is "".
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Azure Subscription ID
    default_value: ''
    type: string
    description: 'Microsoft Azure Subscription ID, can be viewed in Azure Portal >
        Subscriptions > <Your Subscription> > Subscription ID. '
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Active Directory ID
    default_value: ''
    type: string
    description: Azure Active Directory Tenant ID, can be viewed in Active Directory
        > App Registration > <Application you configured for your integration> > Directory
        (tenant) ID.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Root
    default_value: https://management.azure.com
    type: string
    description: The API Root of Microsoft Azure Sentinel REST API root.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: OAUTH2 Login Endpoint Url
    default_value: https://login.microsoftonline.com
    type: string
    description: Specify the url, that connector should use for OAUTH2 Login.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Resource Group
    default_value: ''
    type: string
    description: Name of Azure Resource Group where Azure Sentinel is located.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Sentinel Workspace Name
    default_value: ''
    type: string
    description: Name of the Azure Sentinel workspace to work with, can be viewed
        in Azure portal > Azure Sentinel > Azure Sentinel Workspaces.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client ID
    default_value: ''
    type: string
    description: Client (Application) ID that was added for the app registration in
        Azure Active Directory for this integration.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client Secret
    default_value: ''
    type: password
    description: Secret that was entered for Azure AD app registration
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: false
    type: boolean
    description: Verify SSL certificates for HTTPS requests to Microsoft Azure.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max New Incidents Per Cycle
    default_value: 10
    type: integer
    description: How many incidents should be processed during one connector run
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Backlog Incidents per cycle
    default_value: 10
    type: integer
    description: How many incidents  connector should try to fetch from the backlog
        during one connector run.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Offset Time In Hours
    default_value: 24
    type: integer
    description: 'Number of hours before the first connector iteration to retrieve
        incidents alerts. This parameter applies to the initial connector iteration
        after you enable the connector for the first time, or used as a fallback value
        in cases where connector''s last run timestamp expires. Default value: 24
        hours.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Incident Statuses to Fetch
    default_value: New, Closed
    type: string
    description: Specify the statuses of the incidents that should be fetched by the
        Chronicle SOAR server. Parameter can take multiple values as a comma separated
        string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Incident Severities to Fetch
    default_value: Informational, Low, Medium, High
    type: string
    description: Specify the severities of the incidents that should be fetched by
        the Chronicle SOAR server. Parameter can take multiple values as a comma separated
        string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Use the same approach with event creation for all alert types?
    default_value: false
    type: boolean
    description: By default connector uses a different approach with Scheduled Alert
        or NRT types of alerts - it tries to fetch events that caused the alert by
        running the query specified in alert details. Specify whether to change this
        behavior and use the same approach for the scheduled and NRT alerts as for
        other alert types.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If enabled, dynamic list will be used as a blocklist.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Backlog Expiration Timer
    default_value: 60
    type: integer
    description: Time frame in minutes for connector to keep incidents in backlog
        for.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: EventFieldFallback
    default_value: kind
    type: string
    description: Specify a comma separated list of alert attributes that should be
        used as a fallback for the "Event Field Name" parameter in descending order.
        First attribute will have the highest priority, next if its not present or
        empty in the event - fallback to the next value from the list and so on.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: ProductFieldFallback
    default_value: ProductName,properties_providerName
    type: string
    description: Specify a comma separated list of incident or alert attributes that
        should be used as a fallback for the "Product Field Name" parameter and "DeviceProduct"
        field in descending order. First attribute will have the highest priority,
        next if its not present or empty in the event - fallback to the next value
        from the list and so on.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: VendorFieldFallback
    default_value: vendorName
    type: string
    description: Specify a comma separated list of incident attributes that should
        be used as a fallback for the "DeviceVendor" field in descending order. First
        attribute will have the highest priority, next if its not present or empty
        in the event - fallback to the next value from the list and so on.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: StartTimeFallback
    default_value: properties_firstActivityTimeGenerated,properties_startTimeUtc,properties_createdTimeUtc,properties_firstAlertTimeGenerated
    type: string
    description: Specify a comma separated list of incident or alert attributes that
        should be used as a fallback for the “Start Time” alert field in descending
        order. Additionally, new “Siemplify_Start_Time“ attribute will be added to
        created events. First attribute will have the highest priority, next if its
        not present or empty in the event - fallback to the next value from the list
        and so on. If none of the fallback fields are found, connector will use createdTimeUTC,
        and if that's also non existent - alert ingestion time to Chronicle SOAR.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: EndTimeFallback
    default_value: properties_lastActivityTimeGenerated,properties_endTimeUtc,properties_createdTimeUtc,properties_lastAlertTimeGenerated
    type: string
    description: Specify a comma separated list of incident or alert attributes that
        should be used as a fallback for the “End Time” alert field in descending
        order. Additionally, new “Siemplify_End_Time“ attribute will be added to created
        events. First attribute will have the highest priority, next if its not present
        or empty in the event - fallback to the next value from the list and so on.
        If none of the fallback fields are found, connector will use createdTimeUTC,
        and if that's also non existent - alert ingestion time to Chronicle SOAR.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Incidents Tags To Ingest
    default_value: ''
    type: string
    description: 'Specify a comma separated list of tags Sentinel incident should
        have to be ingested. Incidents that will not have tags from this list will
        be ignored. Example of how Sentinel tags can be provided: tag1, tag2'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Disable Overflow
    default_value: false
    type: boolean
    description: If enabled, the connector will disable the overflow mechanism.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Enable Fallback Logic Debug?
    default_value: false
    type: boolean
    description: Specify if connector should add to the created events a “debug“ fields
        that will contain the values it used for fallback.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Scheduled Alerts Events Limit to Ingest
    default_value: 100
    type: integer
    description: Specify the maximum number of events the connector should ingest
        per a single Azure Sentinel Scheduled or NRT Alert.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Create Chronicle SOAR Alerts for Sentinel incidents that do not have entities?
    default_value: false
    type: boolean
    description: If enabled, connector will create Chronicle SOAR alerts from Microsoft
        Sentinel incidents that dont have entities. Otherwise, such incidents will
        be skipped for all Sentinel incidents types except Sentinel Scheduled and
        NRT alerts.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident's Alerts Limit to Ingest
    default_value: 10
    type: integer
    description: Specify the maximum number of  alerts the connector should ingest
        per a single Azure Sentinel incident.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: Proxy server to use for connection.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: Proxy server username
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: Proxy server password
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incidents Padding Period (minutes)
    default_value: 60
    type: integer
    description: If specified, to get incidents returned not in chronological order,
        connector will fetch Sentinel incidents from this value backwards in time.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Name Template
    default_value: ''
    type: string
    description: 'If specified, connector will use this value from the Microsoft Azure
        Sentinel API response for incident data for Chronicle SOAR Alert Name. You
        can provide placeholders in the following format: [name of the field]. Example:
        Sentinel incident - [title]. Note: the maximum length for the field is 256
        characters. If nothing is provided or user provides an invalid template, connector
        will use the default alert name.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Rule Generator Template
    default_value: ''
    type: string
    description: 'If specified, connector will use this value from the Microsoft Azure
        Sentinel API response for incident data for Chronicle SOAR Rule Generator.
        You can provide placeholders in the following format: [name of the field].
        Example: Sentinel incident - [severity]. Note: the maximum length for the
        field is 256 characters. If nothing is provided or user provides an invalid
        template, connector will use the default rule generator value.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Create extra events for all entities
    default_value: false
    type: boolean
    description: If enabled, when creating entities from the Sentinel API, connector
        will create extra SecOps events for all Sentinel incident's entities, not
        only Account, Mailbox, Host or Ip.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Azure API Timeout In Seconds
    default_value: 60
    type: integer
    description: If specified, the value will be applied as the maximum waiting time
        in seconds for any request made to Azure API. Defaults to 60.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Wait For Scheduled/NRT Alert Object
    default_value: 'false'
    type: boolean
    description: If enabled, the connector will wait until a Scheduled/NRT alert object
        will be available.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Deprecation Notice! This connector is planned to be deprecated on 30th
    March 2027. Visit documentation for more information. Connector works with Microsoft
    Azure Sentinel incidents. Connector's Dynamic List can be used to specify the
    incidents names that needs to be fetched. See connector documentation for more
    information.
integration: MicrosoftAzureSentinel
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-azure-sentinel#microsoft-azure-sentinel-incidents-connector-v2
rules: []
is_connector_rules_supported: false
creator: admin
