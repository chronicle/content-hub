name: List Alert Rules
description: Get Azure Sentinel Scheduled Rules list
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-azure-sentinel#list_alert_rules
integration_identifier: MicrosoftAzureSentinel
parameters:
-   name: Alert Rule Severity
    default_value: Informational, Low, Medium, High
    type: string
    description: Severities of the alert rules to look for. Comma-separated string
    is_mandatory: false
-   name: Fetch Specific Alert Rule Types
    default_value: ''
    type: string
    description: What alert rule types action should return. Comma-separated string
    is_mandatory: false
-   name: Fetch Specific Alert Rule Tactics
    default_value: ''
    type: string
    description: What alert rule tactics action should return. Comma-separated string
    is_mandatory: false
-   name: Fetch only Enabled Alert Rules
    default_value: false
    type: boolean
    description: If action should return only enabled alert rules
    is_mandatory: false
-   name: Max rules to return
    default_value: ''
    type: string
    description: How many scheduled alert rules the action should return, for example,
        50.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_alert_rules_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
