name: Update Incident Labels v2
description: Update Incident Labels v2. Action is a Chronicle SOAR async action and
    can be configured for a retry for a longer period of time.
integration_identifier: MicrosoftAzureSentinel
parameters:
-   name: Incident Case Number
    default_value: ''
    type: string
    description: Specify Azure Sentinel incident number to update with new labels.
    is_mandatory: true
-   name: Labels
    default_value: ''
    type: string
    description: Specify new labels that should be appended to the Incident. Parameter
        accepts multiple values as a comma-separated string.
    is_mandatory: true
-   name: Number of retries
    default_value: 1
    type: string
    description: Specify the number of retry attempts the action should make if the
        incident update was unsuccessful.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_incident_labels_v2_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
