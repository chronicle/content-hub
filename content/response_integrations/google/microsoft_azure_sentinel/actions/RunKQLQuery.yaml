name: Run KQL Query
description: Run Azure Sentinel KQL Query based on the provided action input parameters.
integration_identifier: MicrosoftAzureSentinel
parameters:
-   name: KQL Query
    default_value: ''
    type: string
    description: A KQL Query to execute in Azure Sentinel. For example, to get security
        alerts available in Sentinel, query will be "SecurityAlert". Use other action
        input parameters (time span, limit) to filter the query results. For the examples
        of KQL queries consider Sentinel "Logs" Web page
    is_mandatory: true
-   name: Time Span
    default_value: ''
    type: string
    description: "Time span to look for, use the following format: \nPT + number +\
        \ (M, H), where M - minutes, H - hours. \nUse P + number + D to specify a\
        \ number of days. \nCan be combined as P1DT1H1M - 1 day, 1 hour and 1 minute."
    is_mandatory: false
-   name: Query Timeout
    default_value: '180'
    type: string
    description: Timeout value for the Azure Sentinel hunting rule API call. Note
        that Siemplify action python process timeout should be adjusted accordingly
        for this parameter, to not timeout action sooner than specified value because
        of the python process timeout.
    is_mandatory: false
-   name: Record Limit
    default_value: '100'
    type: string
    description: How many records should be fetched. Optional parameter, if set, adds
        a "| limit x" to the kql query where x is the value set for the record limit.
        Can be removed if "limit" is already set in kql query or not needed.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/run_kql_query_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
