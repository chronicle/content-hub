name: Update Alert Rule
description: Update Azure Sentinel Scheduled Alert Rule
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-azure-sentinel#update_alert_rule
integration_identifier: MicrosoftAzureSentinel
parameters:
-   name: Alert Rule ID
    default_value: ''
    type: string
    description: Alert Rule ID
    is_mandatory: true
-   name: Enable Alert Rule
    default_value: true
    type: boolean
    description: Enable or disable new alert rule
    is_mandatory: false
-   name: Name
    default_value: ''
    type: string
    description: Display name of the new alert rule
    is_mandatory: false
-   name: Severity
    default_value: Informational
    type: ddl
    optional_values:
    - Informational
    - Low
    - Medium
    - High
    description: Severity of the new alert rule
    is_mandatory: false
-   name: Query
    default_value: ''
    type: string
    description: Query of the new alert rule
    is_mandatory: false
-   name: Frequency
    default_value: ''
    type: string
    description: "How frequently to run the query, use the following format: \nPT\
        \ + number + (M, H), where M - minutes, H - hours. \nUse P + number + D to\
        \ specify a number of days. \nCan be combined as P1DT1H1M - 1 day, 1 hour\
        \ and 1 minute. \nMinimum is 5 minutes, maximum is 14 days."
    is_mandatory: false
-   name: Period of Lookup Data
    default_value: ''
    type: string
    description: "Time of the last lookup data, use the following format: \nPT + number\
        \ + (M, H), where M - minutes, H - hours. \nUse P + number + D to specify\
        \ a number of days. \nCan be combined as P1DT1H1M - 1 day, 1 hour and 1 minute.\
        \ \nMinimum is 5 minutes, maximum is 14 days."
    is_mandatory: false
-   name: Trigger Operator
    default_value: GreaterThan
    type: ddl
    optional_values:
    - GreaterThan
    - LessThan
    - Equal
    - NotEqual
    description: 'Trigger operator for this alert rule.

        Possible values are: GreaterThan, LessThan, Equal, NotEqual'
    is_mandatory: false
-   name: Trigger Threshold
    default_value: ''
    type: string
    description: Trigger threshold for this alert rule
    is_mandatory: false
-   name: Enable Suppression
    default_value: true
    type: boolean
    description: Whether you want to stop running query after alert is generated
    is_mandatory: false
-   name: Suppression Duration
    default_value: ''
    type: string
    description: "How long you want to stop running query after alert is generated,\
        \ use the following format: \nPT + number + (M, H), where M - minutes, H -\
        \ hours. \nUse P + number + D to specify a number of days. \nCan be combined\
        \ as P1DT1H1M - 1 day, 1 hour and 1 minute. \nMinimum is 5 minutes, maximum\
        \ is 14 days."
    is_mandatory: false
-   name: Description
    default_value: ''
    type: string
    description: Description of the new alert rule
    is_mandatory: false
-   name: Tactics
    default_value: ''
    type: string
    description: Tactics of the new alert rule. Comma-separated values.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_alert_rule_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
