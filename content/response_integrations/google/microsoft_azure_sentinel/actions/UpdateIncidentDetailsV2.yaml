name: Update Incident Details v2
description: Update Incident Details v2. Action is a Chronicle SOAR async action and
    can be configured for a retry for a longer period of time.
integration_identifier: MicrosoftAzureSentinel
parameters:
-   name: Incident Case Number
    default_value: ''
    type: string
    description: Specify Azure Sentinel incident number to update.
    is_mandatory: true
-   name: Title
    default_value: ''
    type: string
    description: Specify new title for the Azure Sentinel incident.
    is_mandatory: false
-   name: Status
    default_value: Not Updated
    type: ddl
    optional_values:
    - Not Updated
    - New
    - Active
    - Closed
    description: Specify new status for the Azure Sentinel incident.
    is_mandatory: false
-   name: Severity
    default_value: Not Updated
    type: ddl
    optional_values:
    - Not Updated
    - Informational
    - Low
    - Medium
    - High
    description: Specify new severity for the Azure Sentinel incident.
    is_mandatory: false
-   name: Description
    default_value: ''
    type: string
    description: Specify new description for the Azure Sentinel incident.
    is_mandatory: false
-   name: Assigned To
    default_value: ''
    type: string
    description: Specify the user to assign the incident to.
    is_mandatory: false
-   name: Closed Reason
    default_value: Not Updated
    type: ddl
    optional_values:
    - Not Updated
    - True Positive - suspicious activity
    - Benign Positive - suspicious but expected
    - False Positive - incorrect alert logic
    - False Positive - inaccurate data
    - Undetermined
    description: If status of the incident is set to Closed, provide a Closed Reason
        for the incident.
    is_mandatory: false
-   name: Closing Comment
    default_value: ''
    type: string
    description: Optional closing comment to provide for the closed Azure Sentinel
        Incident.
    is_mandatory: false
-   name: Number of retries
    default_value: 1
    type: string
    description: Specify the number of retry attempts the action should make if the
        incident update was unsuccessful.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_incident_details_v2_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
