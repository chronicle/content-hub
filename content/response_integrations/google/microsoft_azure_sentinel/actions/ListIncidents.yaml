name: List Incidents
description: List Microsoft Azure Sentinel Incidents based on the provided search
    criteria.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-azure-sentinel#list_incidents
integration_identifier: MicrosoftAzureSentinel
parameters:
-   name: Time Frame
    default_value: '3'
    type: string
    description: Time frame in hours for which to fetch Incidents
    is_mandatory: false
-   name: Status
    default_value: New, Active, Closed
    type: string
    description: Statuses of the incidents to look for. Comma-separated string
    is_mandatory: false
-   name: Severity
    default_value: Informational, Low, Medium, High
    type: string
    description: Severities of the incidents to look for. Comma-separated string.
    is_mandatory: false
-   name: How Many Incidents to Fetch
    default_value: '200'
    type: string
    description: How many incidents to fetch
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_incidents_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
