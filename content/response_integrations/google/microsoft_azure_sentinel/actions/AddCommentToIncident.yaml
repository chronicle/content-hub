name: Add Comment to Incident
description: Add a comment to Azure Sentinel Incident.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-azure-sentinel#add_comment_to_incident
integration_identifier: MicrosoftAzureSentinel
parameters:
-   name: Incident Number
    default_value: ''
    type: string
    description: Specify Incident number to add comment to.
    is_mandatory: true
-   name: Comment to Add
    default_value: ''
    type: string
    description: Specify comment to add to Incident
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_comment_to_incident_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
