    ### General Description

    The **Run Custom Hunting Rule Query** action executes a specific predefined hunting
    rule in Microsoft Azure Sentinel. It retrieves the KQL (Kusto Query Language)
    query associated with a provided Hunting Rule ID and runs it against the Sentinel
    workspace. This action is used to programmatically trigger hunting rule logic
    and retrieve the resulting data for further analysis within Google SecOps.


