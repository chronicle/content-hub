    | Query | String | Yes | Query of the new alert rule |

    | Frequency | String | Yes | How frequently to run the query, use the following
    format: PT + number + (M, H), where M - minutes, H - hours. Use P + number + D
    to specify a number of days. Can be combined as P1DT1H1M - 1 day, 1 hour and 1
    minute. Minimum is 5 minutes, maximum is 14 days. |

    | Period of Lookup Data | String | Yes | Time of the last lookup data, use the
    following format: PT + number + (M, H), where M - minutes, H - hours. Use P +
    number + D to specify a number of days. Can be combined as P1DT1H1M - 1 day, 1
    hour and 1 minute. Minimum is 5 minutes, maximum is 14 days. |

    | Trigger Operator | String | Yes | Trigger operator for this alert rule. Possible
    values are: GreaterThan, LessThan, Equal, NotEqual |

    | Trigger Threshold | Integer | Yes | Trigger threshold for this alert rule |

    | Enable Suppression | Boolean | Yes | Whether you want to stop running query
    after alert is generated |

    | Suppression Duration | String | Yes | How long you want to stop running query
    after alert is generated, use the following format: PT + number + (M, H), where
    M - minutes, H - hours. Use P + number + D to specify a number of days. Can be
    combined as P1DT1H1M - 1 day, 1 hour and 1 minute. Minimum is 5 minutes, maximum
    is 14 days. |

    | Description | String | No | Description of the new alert rule |

    | Tactics | String | No | Tactics of the new alert rule. Comma-separated values.
    |
Create Custom Hunting Rule:
  ai_description: >-
    ### General Description

    Creates a new custom hunting rule in Microsoft Azure Sentinel. This action allows
    security teams to programmatically define and deploy KQL-based hunting queries
    to their Sentinel workspace, facilitating proactive threat detection. The rule
    can be tagged with specific MITRE ATT&CK tactics and a detailed description for
    better categorization and context.


    ### Flow Description

    1. Extracts the action parameters (Display Name, Query, Description, Tactics).

    2. Validates the provided tactics against a list of supported Azure Sentinel tactics
    to ensure API compatibility.

    3. Constructs a hunting rule request object, encapsulating the query, display
    name, and metadata (description and tactics) as tags.

    4. Performs a PUT request to the Azure Sentinel `savedSearches` endpoint to create
    the rule.

    5. Upon success, the details of the newly created hunting rule are returned as
    JSON and the action completes successfully.


    ### Additional Notes

    Ensure that the provided KQL query is valid and that the tactics match the supported
    MITRE ATT&CK tactics in Azure Sentinel.
