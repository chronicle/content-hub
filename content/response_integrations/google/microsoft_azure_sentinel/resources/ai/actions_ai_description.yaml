Create Alert Rule:
  ai_description: >-
    ### General Description

    Creates a new scheduled alert rule in Microsoft Azure Sentinel. This action allows
    security teams to programmatically define detection logic, severities, and query
    frequencies directly from Google SecOps. It supports full configuration of the
    rule, including KQL queries, trigger thresholds, and suppression settings.


    ### Flow Description

    1. Extracts the provided parameters including the KQL query, severity, frequency,
    and trigger conditions.

    2. Validates the provided tactics, severities, trigger operators, and ISO8601
    durations.

    3. Makes a PUT request to the Azure Sentinel API to create the new scheduled alert
    rule with a generated UUID.

    4. Returns the JSON representation of the newly created alert rule.


    ### Additional Notes

    - Durations must follow the ISO8601 format (e.g., "PT5M" for 5 minutes, "P1D"
    for 1 day).

    - The minimum allowed duration is 5 minutes, and the maximum is 14 days.
  ai_short_description: >-
    Creates a new scheduled alert rule in Microsoft Azure Sentinel based on the provided
    KQL query and configuration parameters.
