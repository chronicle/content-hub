Delete Alert Rule:
  ai_description: >-
    ### General Description

    Deletes a scheduled alert rule in Microsoft Azure Sentinel. This action interacts
    with the Azure Sentinel API to permanently remove a specific alert rule based
    on its unique identifier.


    ### Flow Description

    1. **Initialization**: The action initializes the Microsoft Azure Sentinel manager
    using the provided configuration parameters.

    2. **Validation**: The action first attempts to retrieve the alert rule using
    the provided 'Alert Rule ID' via a GET request to verify its existence before
    deletion.

    3. **Execution**: If the rule is found, the action sends a DELETE request to the
    Azure Sentinel API endpoint associated with that specific rule ID.

    4. **Completion**: The action returns a success message if the rule is deleted
    or an error message if the operation fails.


    ### Additional Notes

    Ensure that the provided Alert Rule ID is correct, as this action permanently
    deletes the rule from the Azure Sentinel workspace.
