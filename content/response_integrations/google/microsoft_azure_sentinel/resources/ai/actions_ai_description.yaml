Update Incident Details v2:
  ai_description: >-
    ### General Description

    Updates the details of a specific incident in Microsoft Azure Sentinel. This action
    allows for the modification of various incident attributes including its title,
    status, severity, description, and ownership. It is particularly useful for synchronizing
    case management states between Google SecOps and Azure Sentinel or for automated
    incident remediation flows.


    ### Flow Description

    1. **Initialization**: Extracts integration configuration and action parameters.

    2. **Validation**: Validates that the provided `Status`, `Severity`, and `Closed
    Reason` are compatible with Azure Sentinel's expected values.

    3. **Authentication**: Connects to the Microsoft Azure Sentinel API using OAuth2
    credentials.

    4. **Incident Retrieval**: Fetches the existing incident from Sentinel using the
    `Incident Case Number` to obtain the internal system name required for the update.

    5. **Update Execution**: Constructs a payload with the new details and sends a
    `PUT` request to the Azure Sentinel API.

    6. **Conflict Handling**: If the API returns a 409 Conflict error, the action
    increments the retry counter and yields execution to retry later.

    7. **Completion**: Upon a successful update, the action returns the updated incident
    object as JSON and completes the execution.


    ### Additional Notes

    - This is an **asynchronous action**. If a conflict occurs during the update (e.g.,
    another process is updating the incident simultaneously), the action will enter
    an `IN_PROGRESS` state and retry based on the `Number of retries` parameter.

    - If the `Status` is changed from `Closed` to another state, the classification
    and closing comments in Azure Sentinel will be cleared.
