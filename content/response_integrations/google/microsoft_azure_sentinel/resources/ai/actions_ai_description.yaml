    for a specific scheduled alert rule within Microsoft Azure Sentinel. This action
    is designed to provide visibility into the logic, frequency, and metadata of detection
    rules.


    ### Flow Description

    1. **Authentication**: Initializes a connection to the Microsoft Azure Sentinel
    API using the configured credentials.

    2. **Data Retrieval**: Executes a GET request to the Azure Sentinel workspace
    to fetch the specific alert rule details associated with the provided `Alert Rule
    ID`.

    3. **Data Processing**: Parses the retrieved raw JSON data into a structured data
    model.

    4. **Output Generation**: Populates the result JSON with the full rule configuration
    and generates a data table summarizing the rule's operational parameters.


    ### Additional Notes

