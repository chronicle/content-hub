Update Incident Labels:
  ai_description: >-
    Updates labels for a specific Microsoft Azure Sentinel incident. This action allows
    users to append new labels to an existing incident in the Azure Sentinel workspace.
    It includes a built-in retry mechanism to handle potential concurrency conflicts
    during the update process.


    ### Flow Description


    1.  **Initialization**: The action initializes the Microsoft Azure Sentinel manager
    using provided credentials.

    2.  **Parameter Extraction**: It retrieves the incident number and the list of
    labels to be added from the action parameters.

    3.  **Incident Retrieval**: The action fetches the current state of the incident
    from Azure Sentinel via a GET request to identify existing labels.

    4.  **Label Comparison**: It determines which of the provided labels are new and
    which already exist on the incident to prevent redundant updates.

    5.  **Update Execution**: It performs a PUT request to the Azure Sentinel API
    to update the incident with the new labels.

    6.  **Retry Logic**: If a conflict error occurs (indicating the incident was modified
    by another process simultaneously), the action waits for the specified 'Retry
    Every' period and attempts the update again, up to the 'Number of retries' limit.

    7.  **Result Reporting**: The action returns the updated incident data as a JSON
    result and provides a summary message of the added labels.


    ### Additional Notes


    *   **Note**: Users are encouraged to use the v2 version of this action for more
    consistent results as it is implemented as an asynchronous SOAR action.

    *   **Entity Support**: This action does not run on specific entities; it targets
    a specific incident via its case number.
