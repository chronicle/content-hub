Add Comment to Incident:
  ai_description: >-
    ### General Description

    Adds a comment to a specific Microsoft Azure Sentinel incident. This action allows
    users to append notes or updates directly to an incident within the Azure Sentinel
    platform by providing the incident's unique number and the desired comment text.


    ### Flow Description

    1. **Initialization**: Initializes the Microsoft Azure Sentinel manager with the
    provided integration configuration.

    2. **Incident Retrieval**: Retrieves the specific incident in Azure Sentinel using
    the provided `Incident Number` to obtain its internal identifier.

    3. **Comment Addition**: Sends a PUT request to the Azure Sentinel API to add
    the specified `Comment to Add` to the retrieved incident.

    4. **Result Reporting**: Returns the details of the created comment in JSON format
    and provides a success message upon completion.


    ### Additional Notes

    This action requires the incident to exist in Azure Sentinel; otherwise, it will
    fail to find the incident and return an error.
  ai_short_description: >-
    Adds a comment to a specific Microsoft Azure Sentinel incident.
  capabilities:
    can_create_case_comments: false
