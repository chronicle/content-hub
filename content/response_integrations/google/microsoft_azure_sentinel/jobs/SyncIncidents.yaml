name: Sync Incidents
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: The name of the environment from which to sync incidents.
    is_mandatory: true
-   name: Azure Active Directory ID
    default_value: ''
    type: string
    description: Your unique directory ID in Azure, also known as your tenant ID.
    is_mandatory: true
-   name: OAUTH2 Login Endpoint Url
    default_value: https://login.microsoftonline.com
    type: string
    description: The URL for the OAuth 2.0 endpoint where the job will request an
        authentication token.
    is_mandatory: true
-   name: API Root
    default_value: https://graph.microsoft.com
    type: string
    description: The base URL for the Graph API. The job will append specific API
        calls to this root URL to retrieve data.
    is_mandatory: true
-   name: Client ID
    default_value: ''
    type: string
    description: The unique ID of the application registered in Azure Active Directory
        that is granted permissions to access Microsoft Sentinel.
    is_mandatory: true
-   name: Client Secret
    default_value: ''
    type: password
    description: The confidential key for the application, used in conjunction with
        the Client ID to authenticate and authorize the job.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: The number of hours to synchronize incidents prior to the current
        time. The default value is `24`.
    is_mandatory: false
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the integration validates the SSL certificate when connecting
        to the Microsoft Sentinel server. Enabled by default.
    is_mandatory: true
description: Deprecated. This job synchronizes Google SecOps Alerts and Microsoft
    Sentinel Incidents. It ensures that comments, status, and tags are kept in sync
    between the two systems. For the job to identify the correct information, the
    Google SecOps case must have the “Microsoft Sentinel Incident” tag. If the alert
    didn’t originate from “Microsoft Azure Sentinel Incident Connector v2”,  you will
    need to add an “Incident_ID” context value to the case for the job to be able
    to find the correct information.
documentation_link: null
integration: MicrosoftAzureSentinel
creator: Admin
