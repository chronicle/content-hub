name: Sync Incidents V2
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: The name of the environment from which to sync incidents.
    is_mandatory: true
-   name: Azure Subscription ID
    default_value: ''
    type: string
    description: ''
    is_mandatory: true
-   name: Azure Active Directory ID
    default_value: ''
    type: string
    description: 'Your unique directory ID in Azure, also known as your tenant ID. '
    is_mandatory: true
-   name: OAUTH2 Login Endpoint Url
    default_value: https://login.microsoftonline.com
    type: string
    description: The URL for the OAuth 2.0 endpoint where the job will request an
        authentication token.
    is_mandatory: true
-   name: Management API Root
    default_value: https://management.azure.com
    type: string
    description: The base URL for the Management API. The job will append specific
        API calls to this root URL to retrieve data.
    is_mandatory: true
-   name: Azure Resource Group
    default_value: ''
    type: string
    description: ''
    is_mandatory: true
-   name: Azure Sentinel Workspace Name
    default_value: ''
    type: string
    description: ''
    is_mandatory: true
-   name: Client ID
    default_value: ''
    type: string
    description: The unique ID of the application registered in Azure Active Directory
        that is granted permissions to access Microsoft Sentinel.
    is_mandatory: true
-   name: Client Secret
    default_value: ''
    type: password
    description: The confidential key for the application, used in conjunction with
        the Client ID to authenticate and authorize the job.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: The number of hours to synchronize incidents prior to the current
        time. The default value is `24`.
    is_mandatory: false
-   name: Sync Assignee
    default_value: false
    type: boolean
    description: If enabled, job will sync assignee from Microsoft Sentinel to Google
        SecOps.
    is_mandatory: false
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the integration validates the SSL certificate when connecting
        to the Microsoft Sentinel server. Enabled by default.
    is_mandatory: true
description: 'Use the Sync Incidents V2 job to synchronize Google SecOps alerts with
    Microsoft Sentinel incidents. This job ensures that comments, statuses, and tags
    are synchronized bi-directionally between both systems. Note: Assignee and severity
    synchronization occurs exclusively from Microsoft Sentinel to Google SecOps. For
    the job to identify the correct information, the Google SecOps case must have
    the Microsoft Sentinel Incident tag. This job only works on alerts from the Microsoft
    Azure Sentinel Incident Connector v2.'
documentation_link: null
integration: MicrosoftAzureSentinel
creator: Admin
