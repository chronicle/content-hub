Get Ticket:
  ai_description: "### General Description\nThe **Get Ticket** action retrieves comprehensive\
    \ details for a specific ticket from the ConnectWise Manage platform using its\
    \ unique Ticket ID. This action is designed to fetch external ticketing context\
    \ and make it available within the Google SecOps environment for investigation\
    \ and auditing purposes.\n\n### Flow Description\n1. **Initialization:** The action\
    \ initializes the ConnectWise manager using the integration's configuration settings.\n\
    2. **Parameter Extraction:** It retrieves the `Ticket Id` provided as an input\
    \ parameter.\n3. **Data Retrieval:** The action performs a GET request to the\
    \ ConnectWise API (`service/tickets/{id}`) to fetch the ticket's metadata and\
    \ current status.\n4. **Result Processing:** \n    * If the ticket is found, the\
    \ data is formatted as a JSON string.\n    * The JSON data is added to the action's\
    \ execution results.\n    * A `.json` file containing the ticket details is attached\
    \ to the action result for easy download and review.\n5. **Completion:** The action\
    \ concludes by providing a success message and the raw JSON data as the output\
    \ value.\n\n### Additional Notes\nThis action does not operate on entities (such\
    \ as IPs or Hostnames) found in the alert; it relies strictly on the provided\
    \ `Ticket Id` parameter."
