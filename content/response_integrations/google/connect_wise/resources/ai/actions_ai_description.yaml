Ping:
  ai_description: >-
    ### General Description

    The Ping action is a diagnostic tool used to verify the connectivity between Google
    SecOps and the ConnectWise instance. It ensures that the integration's configuration
    parameters are correct and that the ConnectWise API is reachable and responding
    to requests.


    ### Flow Description

    1. Retrieves the necessary API credentials from the ConnectWise integration settings.

    2. Initializes the `ConnectWiseManager` using the retrieved credentials.

    3. Calls the `test_connectivity` method, which performs a `GET` request to the
    `service/boards/count` endpoint of the ConnectWise API.

    4. Validates the HTTP response. If the request is successful (status code 200),
    the connection is considered established.

    5. Ends by providing a success message and a boolean result (`True`) if successful,
    or a failure message and `False` otherwise.


    ### Additional Notes

    This action is primarily used during the initial setup of the integration or for
    troubleshooting communication issues. It does not interact with any entities or
    modify any data within ConnectWise or Google SecOps.
