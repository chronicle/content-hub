Add Attachment To Ticket:
  ai_description: >-
    ### General Description

    This action allows users to upload and attach a file to a specific ticket within
    the ConnectWise platform. It is primarily used for documentation, evidence sharing,
    or providing additional context to support tickets. The action handles base64-encoded
    file content, decodes it, and transmits it to the ConnectWise API.


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves the user-provided parameters
    including Ticket ID, Base64 Encoded File, Filename, and visibility/permission
    flags.

    2. **Filename Validation:** It checks if the provided filename contains a period
    followed by an extension.

    3. **Manager Initialization:** It initializes the `ConnectWiseManager` using the
    provided API credentials.

    4. **File Processing:** The base64 string is decoded into binary data and temporarily
    written to a local file.

    5. **API Interaction:** The manager sends a POST request to the ConnectWise API
    (`system/documents` endpoint), uploading the file and associating it with the
    specified `Ticket ID` while applying the visibility and permission flags.

    6. **Result Handling:** Upon success, the action returns the metadata of the created
    attachment in JSON format and completes the execution.


    ### Additional Notes

    - The `Filename` parameter must include a file extension (e.g., .txt, .pdf, .jpg);
    otherwise, the action will fail during the validation stage.
  ai_short_description: >-
    Uploads and attaches a base64-encoded file to a specific ticket in ConnectWise.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads a file and attaches it to a specific ticket in the ConnectWise platform.
    fetches_data: false
    internal_data_mutation_explanation: null
