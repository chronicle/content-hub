Update Ticket:
  ai_description: "### General Description\nUpdates the details of an existing ticket\
    \ in ConnectWise. This action allows for modifying various ticket attributes such\
    \ as the summary, status, priority, owner, and categorization (Type, SubType,\
    \ Item). It interacts with the ConnectWise Manage API to apply these changes via\
    \ PATCH requests.\n\n### Flow Description\n1. **Initialization**: The action initializes\
    \ the `ConnectWiseManager` using the integration's configuration.\n2. **Parameter\
    \ Parsing**: It retrieves the `Ticket Id` and all optional update parameters from\
    \ the input.\n3. **Summary Truncation**: If a `Summary` is provided and exceeds\
    \ 100 characters, the script truncates it to 98 characters and appends \"..\"\
    \ to comply with API limits.\n4. **Update Execution**: \n    - If only the `Status`\
    \ parameter is provided among the updateable fields, the script calls `update_ticket_status`\
    \ which sends a PATCH request to the ConnectWise API to update the status.\n \
    \   - If any other fields (Summary, Type, etc.) are provided, it calls the comprehensive\
    \ `update_ticket` method which sends a PATCH request to the ConnectWise API to\
    \ update the specified fields.\n5. **ID Resolution**: During the update process,\
    \ the manager makes internal API calls to resolve names (like `Owner Name` or\
    \ `Board`) into the IDs required by the ConnectWise PATCH operations.\n6. **Completion**:\
    \ The action returns a success message and the Ticket ID if the operation succeeds,\
    \ or an error message if it fails.\n\n### Additional Notes\n- The action logic\
    \ distinguishes between a status-only update and a multi-field update to optimize\
    \ the API calls.\n- Human-readable names for Board, Owner, Priority, and Status\
    \ are automatically resolved to their respective internal ConnectWise IDs before\
    \ the update is performed."
