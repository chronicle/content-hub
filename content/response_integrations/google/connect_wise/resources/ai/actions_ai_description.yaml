Close Ticket:
  ai_description: "### General Description\nCloses a specific ticket in ConnectWise.\
    \ This action allows for either a standard closure by setting the 'closedFlag'\
    \ or a custom closure by specifying a particular status name (e.g., 'Completed'\
    \ or 'Resolved').\n\n### Flow Description\n1. **Initialization**: The action initializes\
    \ the ConnectWise manager using the integration configuration.\n2. **Data Retrieval**:\
    \ It fetches the current ticket details from ConnectWise via a GET request to\
    \ identify the board the ticket belongs to (required for status lookups).\n3.\
    \ **Status Update**: \n    * If a **Custom Close Status** is provided, the action\
    \ retrieves the corresponding status ID for that board and sends a PATCH request\
    \ to update the ticket's status.\n    * If no custom status is provided, the action\
    \ sends a PATCH request to set the ticket's `closedFlag` to `true`.\n4. **Verification**:\
    \ The action validates the API response to ensure the ticket was successfully\
    \ updated and returns the ticket ID as the result.\n\n### Additional Notes\nEnsure\
    \ that the provided Custom Close Status exists on the board the ticket belongs\
    \ to, otherwise the action will fail."
