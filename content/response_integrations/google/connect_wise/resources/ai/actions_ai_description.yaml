Create Alerts Ticket:
  ai_description: >-
    ### General Description

    This action creates a new service ticket in ConnectWise Manage for each alert
    in the current scope (Alert or Case). It maps alert details to specific ConnectWise
    boards, statuses, and priorities, and automatically associates the created ticket
    ID back to the SecOps alert for tracking purposes.


    ### Flow Description

    1. Initializes the ConnectWise manager using integration configuration settings.

    2. Iterates over the target alerts based on the execution scope.

    3. Sends a POST request to the ConnectWise API to create a ticket for each alert
    using the provided parameters.

    4. If the ticket is created successfully, sends another POST request to add the
    'Initial Description' as a new note/comment to that ticket.

    5. Updates the Google SecOps alert metadata by adding the new ConnectWise ticket
    ID to the alert's additional data.

    6. Returns the ticket ID or a comma-separated list of ticket IDs as the result
    value.


    ### Additional Notes

    The action automatically uses the SecOps Alert External ID as the summary for
    the ConnectWise ticket.
