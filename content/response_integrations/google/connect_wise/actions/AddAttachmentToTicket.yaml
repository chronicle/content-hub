name: Add Attachment To Ticket
description: Add an attachment to the ticket in ConnectWise.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/connectwise#add_attachment_to_ticket
integration_identifier: ConnectWise
parameters:
-   name: Allow Only Owner Update
    default_value: true
    type: boolean
    description: If enabled, action will only allow the owner to update the attachment.
    is_mandatory: false
-   name: Display In Customer Portal
    default_value: true
    type: boolean
    description: If enabled, attachment will be shown in the customer portal.
    is_mandatory: false
-   name: Filename
    default_value: '{filename}.{extension}'
    type: string
    description: 'Specify the filename behind the attachment. This value will be also
        used as a title. Note: action needs to provide the correct extension for the
        file.'
    is_mandatory: true
-   name: Base64 Encoded File
    default_value: ''
    type: string
    description: Specify the base64 encoded file that needs to be added as an attachment.
    is_mandatory: true
-   name: Ticket ID
    default_value: ''
    type: string
    description: Specify the ID of the ticket to which the document would need to
        be added.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_attachment_to_ticket_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
