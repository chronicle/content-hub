name: Close Ticket
description: Close ConnectWise ticket
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/connectwise#close_ticket
integration_identifier: ConnectWise
parameters:
-   name: Ticket Id
    default_value: ''
    type: string
    description: ConnectWise ticket id. e.g. 608718
    is_mandatory: true
-   name: Custom Close Status
    default_value: ''
    type: string
    description: If the specific system use a custom closed status (e.g. Completed)
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
script_result_name: ticket_id
