name: Add Comment To Ticket
description: Add new comment to a ticket in ConnectWise
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/connectwise#add_comment_to_ticket
integration_identifier: ConnectWise
parameters:
-   name: Ticket Id
    default_value: ''
    type: string
    description: ConnectWise ticket id. e.g. 608718
    is_mandatory: true
-   name: Comment
    default_value: ''
    type: content
    description: Comment content to attach to a ticket
    is_mandatory: true
-   name: Internal
    default_value: 'False'
    type: boolean
    description: If checked, put comment in internal section
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
script_result_name: ticket_id
