name: Update Ticket
description: Update ticket details in ConnectWIse
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/connectwise#update_ticket
integration_identifier: ConnectWise
parameters:
-   name: Ticket Id
    default_value: ''
    type: string
    description: Ticket ID to be updated. e.g. 609620
    is_mandatory: true
-   name: Summary
    default_value: ''
    type: content
    description: 'Specify the summary for the updated ticket. Note: if the summary
        is more than 100 characters, it will be truncated.'
    is_mandatory: false
-   name: Type Name
    default_value: ''
    type: string
    description: e.g. Application
    is_mandatory: false
-   name: SubType Name
    default_value: ''
    type: string
    description: e.g. Adobe
    is_mandatory: false
-   name: Item Name
    default_value: ''
    type: string
    description: e.g. Development
    is_mandatory: false
-   name: Owner Name
    default_value: ''
    type: string
    description: ConnectWise member name to assign this ticket to, e.g. connectwise_user_1.
    is_mandatory: false
-   name: Board
    default_value: ''
    type: string
    description: Board name.
    is_mandatory: false
-   name: Priority
    default_value: ''
    type: string
    description: e.g. Priority 3 - Normal Response.
    is_mandatory: false
-   name: Status
    default_value: ''
    type: string
    description: New ticket status, e.g. In Progress (plan of action)
    is_mandatory: false
-   name: Email Note CC
    default_value: ''
    type: string
    description: Specify a comma-separated list of email addresses that should receive
        all of the notes via email.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
script_result_name: ticket_id
