name: Create Ticket
description: Create a ConnectWise ticket
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/connectwise#create_ticket
integration_identifier: ConnectWise
parameters:
-   name: Company
    default_value: ''
    type: string
    description: Company identifier
    is_mandatory: true
-   name: Owner Name
    default_value: ''
    type: string
    description: ConnectWise member name to assign this ticket to, e.g. connectwise_user_1.
    is_mandatory: false
-   name: Board
    default_value: ''
    type: string
    description: Board name
    is_mandatory: true
-   name: Summary
    default_value: ''
    type: content
    description: 'Specify the summary for the new ticket. Note: if the summary is
        more than 100 characters, it will be truncated.'
    is_mandatory: true
-   name: Status
    default_value: ''
    type: string
    description: e.g. Unassigned
    is_mandatory: true
-   name: Priority
    default_value: ''
    type: string
    description: e.g. Priority 3 - Normal Response
    is_mandatory: true
-   name: Email Note CC
    default_value: ''
    type: string
    description: Specify a comma-separated list of email addresses that should receive
        all of the notes via email.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
script_result_name: ticket_id
