<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,700,700i"
        rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css?family=Source Sans Pro"
        rel="stylesheet"/>
  <title>Enrich Entities</title>
  <style>
    /* Root Variables */
    :root {
      /* Layout & Colors */
      --widget-bg: #212c44;
      --widget-font-family: 'Source Sans Pro', sans-serif;
      --widget-text-color: #ffffff;
      --scrollbar-bg-color: #6275a3;

      /* Components */
      --widget-row-highlight-bg: #2f3d5c;
      --divider-border-colcor: #3a4a6c;
      --divider-border-width: 1px;

      /* Sidebar */
      --sidebar-width: 167px;
      --sidebar-item-active-bg: #3a4a6c;
      --sidebar-toggle-bg: rgba(38, 51, 79, 1); /* Custom Widget specific */

      /* Table */
      --table-color-even-row: #26334f;

      /* Logo */
      --logo-size: 48px;
      --logo-color: #ffffff;

      /* UI Elements */
      --input-border: #6275a3;
      --dropdown-shadow: rgba(0, 0, 0, 0.6);
      --modal-overlay: rgba(0, 0, 0, 0.5);

      /* Status & Tags */
      --tag-bg: #6a7180;
      --status-text: #b5b5b5;
      --tooltip-bg: #ccccda;
      --tooltip-text: #161625;
      
      /* Content Gradients (Custom Widget specific) */
      --content-list-gradient: linear-gradient(to left, rgb(34 43 62), rgba(33, 44, 68, 0));
      --collapsing-gradient: linear-gradient(transparent, rgb(35 44 66));

      /* Severity Colors (Dark Theme Default) */
      --sev-unspec: #b2b6bd;
      --sev-low: #78d9ec;
      --sev-medium: #fff371;
      --sev-high: #fa903e;
      --sev-critical: #ec453b;
      
      /* Legacy Mappings */
      --content-bg: var(--table-color-even-row);
      --content-button-bg: var(--widget-row-highlight-bg);
      --details-button-bg: var(--divider-border-colcor);
      --modal-list-title-bg: var(--sidebar-item-active-bg);
      
      /* Font settings (Legacy) */
      --widget-scrollbar-size: 12px;
      --list-item-key-font: 600 14px/18px var(--widget-font-family);
      --list-item-value-font: 400 14px/18px var(--widget-font-family);
      --table-title-size: 600 14px/18px var(--widget-font-family);
      --table-th-size: 600 14px/18px var(--widget-font-family);
      --table-td-size: 400 14px/18px var(--widget-font-family);
      --header-title-font: 600 16px/22px var(--widget-font-family);
      --sidebar-item-text-style: 400 14px/18px var(--widget-font-family);
      --sidebar-item-text-style-active: 600 14px/16px var(--widget-font-family);

    /*Normalize CSS */
    * {
      margin: 0;
      padding: 0;

      box-sizing: border-box;
    }

    *:hover, *:focus, *:active {

    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
    }

    ol, ul {
      list-style: none;
    }

    button,
    input,
    textarea {

      background: transparent;

      color: inherit;
      text-align: left;
    }

    button, a[href] {
      cursor: pointer;
    }

    /*Normalize CSS */


    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 18px;

    }

    ::-webkit-scrollbar-thumb {
      background: rgba(137, 151, 180, 1);
      border: 6px solid var(--widget-bg);
      border-radius: 63px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border: 4px solid transparent;
      border-radius: 44px;
    }

    ::-webkit-scrollbar-corner {

    body {
      font-family: var(--widget-font-family), serif;

      overflow: hidden;

    /*Global styles*/
    .text-ellipsis {
      overflow: hidden;

    .tooltip {

      padding: 8px 16px 8px 16px;

    /*Global styles*/

    .wrapper {

    }

    /*left sidebar*/
    .left-side {

    .left-side-item {

    .left-side-item.active {
      background-color: var(--sidebar-item-active-bg);

    }

    /*left sidebar*/

    .right-side {
      width: calc(100% - 168px);
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom-width: var(--divider-border-width);
    }

    .header-title {
      font: var(--header-title-font);
      word-break: break-word;
      padding: 0 6px;
    }

    .logo {
      min-width: var(--logo-size);
      min-height: var(--logo-size);
      max-width: var(--logo-size);
      max-height: var(--logo-size);

    .main-content {
      flex: 1;

    .list-item {
      display: flex;
      align-items: flex-start;

    .list-item:hover {
      background-color: var(--widget-row-highlight-bg);
    }

    .list-item + .list-item {

    }

    .list-item-text {

    .list-item-text-key {

    .list-item-text-value {

    }

    html.light-theme {

    html.dark-theme {

    html.dark-theme body {
       background-color: var(--widget-bg) !important;

    /* --- CUSTOM WIDGET SPECIFIC FIXES --- */
    
    html.light-theme span[class*="risk-score-value-text"],

    html.light-theme .additional-tooltip {

    html.light-theme .level-cell[style*="120, 217, 236"] { background-color: #4ebede !important; }
    html.light-theme .level-cell[style*="255, 243, 113"] { background-color: #f1c40f !important; }
    html.light-theme .level-cell[style*="250, 144, 62"] { background-color: #e67e22 !important; }

    html.light-theme .list-item-screenshot {

    /* --- SCROLLBAR IMPROVEMENTS --- */
    * {

    /* --- GLOBAL ELEMENT FIXES --- */

    /* FIX: More comprehensive table header selector */

    .fieldName, .descriptionText, .leftMenu, .chainName {

    .leftMenu.active {

        border-color: var(--status-text) !important;
    }

<body>
<div class="wrapper">
  <div class="left-side divider-border-style" id="leftSide">
  </div>
  <div class="right-side" id="rightSide">
    <div class="header divider-border-style">
      <h1 class="header-title" id="headerTitle">
      </h1>
      <svg class="logo" fill="currentColor" id="Layer_1"
           viewbox="0 0 25 25"
           x="0px" xml:space="preserve" xmlns="http://www.w3.org/2000/svg" y="0px">
      <path
        d="M3.8,8.8c-0.3-0.6-1-0.9-1.6-0.6c-0.7,0.3-0.9,1-0.6,1.6l2.7,5.8c0.4,0.9,0.9,1.4,1.7,1.4c0.9,0,1.3-0.5,1.7-1.4 c0,0,2.3-5.1,2.4-5.1c0,0,0.1-0.2,0.3-0.2c0.2,0,0.3,0.2,0.3,0.4v4.9c0,0.7,0.4,1.4,1.2,1.4c0.8,0,1.3-0.6,1.3-1.4v-4.1 c0-0.8,0.6-1.3,1.3-1.3c0.7,0,1.3,0.5,1.3,1.3v4.1c0,0.7,0.4,1.4,1.2,1.4c0.8,0,1.3-0.6,1.3-1.4v-4.1c0-0.8,0.6-1.3,1.3-1.3 s1.3,0.5,1.3,1.3v4.1c0,0.7,0.4,1.4,1.2,1.4c0.8,0,1.3-0.6,1.3-1.4V11c0-1.7-1.4-2.9-3-2.9s-2.7,1.1-2.7,1.1 c-0.6-0.7-1.3-1.1-2.6-1.1c-1.4,0-2.5,1.1-2.5,1.1c-0.5-0.7-1.5-1.1-2.2-1.1c-1.2,0-2.1,0.5-2.7,1.8l-1.7,4L3.8,8.8">
      </path>
     </svg>
    </div>
    <section class="main-content" id="mainContent">
    </section>
  </div>
</div>
<script>

    const ThemeSettings = {
        LIGHT_THEME_CLASS: 'light-theme',
        DARK_THEME_CLASS: 'dark-theme',
    };
    
    const LIGHT_THEME_HEX = "#e5e8f2";
    const DARK_THEME_HEX = "#282837";
    const GRAY_THEME_HEX = "#2f3d5c";

    function handleThemeUpdate(event) {
        if (event.source !== window.parent) {
            return;
        }
        const styles = event.data;
        if (typeof styles !== 'object' || styles === null) return;
        const bg = styles.background || styles.backgroundColor || '';
        let isLight = false;
        let isDark = false;
        let isGray = false;
        const colorString = bg.toLowerCase();
        if (colorString === LIGHT_THEME_HEX) isLight = true;
        else if (colorString === DARK_THEME_HEX) isDark = true;
        else if (colorString === GRAY_THEME_HEX) isGray = true;
        else {
            let r, g, b;
            const rgbMatch = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (rgbMatch) { r = parseInt(rgbMatch[1]); g = parseInt(rgbMatch[2]); b = parseInt(rgbMatch[3]); }
            else if (bg.startsWith('#')) {
                const hex = bg.replace('#', '');
                const fH = hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex;
                if (fH.length === 6) { r = parseInt(fH.substring(0, 2), 16); g = parseInt(fH.substring(2, 4), 16); b = parseInt(fH.substring(4, 6), 16); }
            }
            if (r !== undefined) {
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                if (brightness > 128) isLight = true;
            }
        }
        const html = document.documentElement;
        if (isLight) {
            html.classList.add(ThemeSettings.LIGHT_THEME_CLASS); html.classList.remove(ThemeSettings.DARK_THEME_CLASS);
        } else if (isDark) {
            html.classList.add(ThemeSettings.DARK_THEME_CLASS); html.classList.remove(ThemeSettings.LIGHT_THEME_CLASS);
        } else {
            html.classList.remove(ThemeSettings.LIGHT_THEME_CLASS); html.classList.remove(ThemeSettings.DARK_THEME_CLASS);
        }

        const prismLink = document.querySelector('link[href*="/themes/prism"]');
        if (prismLink) {
            if (isLight && prismLink.href.includes('prism-tomorrow')) {
                prismLink.href = prismLink.href.replace('prism-tomorrow.min.css', 'prism.min.css').replace('prism-tomorrow.css', 'prism.css');
            } else if (!isLight && !prismLink.href.includes('prism-tomorrow')) {
                prismLink.href = prismLink.href.replace('prism.min.css', 'prism-tomorrow.min.css').replace('prism.css', 'prism-tomorrow.css');
            }
        }
    }
    window.addEventListener('message', handleThemeUpdate);
    window.onmessage = handleThemeUpdate;
    document.addEventListener("DOMContentLoaded", function() {
        var paths = document.querySelectorAll('svg path');
        paths.forEach(function(path) {
            var fill = path.getAttribute('fill');
            if (fill === 'white' || fill === '#fff' || fill === '#ffffff' || fill === 'rgb(255, 255, 255)') {
                path.setAttribute('fill', 'currentColor');
            }
        });
    });


  const enrichEntitiesData = [{stepInstanceName}.JsonResult];

  // Constant for fields that are allowed to be modified
  const allowlistedFields = ["name", "last_internal_ip_address", "mac_address", "os_version", "sensor_version", "quarantined", "status", "passive_mode", "login_user_name", "last_contact_time", "target_priority"];

  // Constants for tooltip positioning
  const tooltipGap = 25;
  const tooltipTriangleHeight = 8;
  const tooltipTriangleMinGap = 5;
  const triangleWidth = 16;
  let tooltipTimeout = undefined;

  // Get all elements "table"
  const tables = document.getElementsByClassName("table");

  const tooltipDetectResizeObserver = new ResizeObserver((entries) => {
    for (const entry of entries) {
      const target = entry.target;
      if (target) {
        const {offsetWidth, scrollWidth} = target;
        if (scrollWidth > offsetWidth) {
          target.addEventListener("mouseover", createTooltipListener);
          target.addEventListener("mouseout", removeTooltipListener);
        } else {
          target.removeEventListener("mouseover", createTooltipListener);
          target.removeEventListener("mouseout", removeTooltipListener);
        }
      }
    }
  });

  // Filter actionListData based on allowlistedFields
  const filteredActionListData = enrichEntitiesData
    .filter(el => el.Entity.trim() !== "" && Object.keys(el.EntityResult).length > 0)
    .map(el => {
      const filteredEntityResult = filterKeys(el.EntityResult, allowlistedFields);
      return {...el, EntityResult: filteredEntityResult};
    })
    .filter(el => Object.keys(el.EntityResult).length > 0);

  // Update the UI with filtered data
  if (filteredActionListData.length > 0) {
    renderKeysInUI(flattenKeys(filteredActionListData[0].EntityResult));

    headerTitle.textContent = filteredActionListData[0].Entity;

    filteredActionListData.forEach((el, index) => {
      const displayValue = el.Entity;
      const cleanDisplayValue = removeSpecialSymbols(displayValue);
      const button = document.createElement("button");
      button.id = cleanDisplayValue;
      button.classList.add("left-side-item");
      button.setAttribute("data-menu", "item");
      if (index === 0) {
        button.classList.add("active");
      }
      renderWithTooltip(button, displayValue);
      leftSide.append(button);
    });


    if (filteredActionListData.length === 1) {
      leftSide.remove();
      rightSide.style.width = "100%";
    } else {
      leftSide.addEventListener("click", event => {
        const target = event.target.closest("[data-menu='item']");
        if (!target) return;

        const id = target.id;
        const object = filteredActionListData.find(el => removeSpecialSymbols(el.Entity) === id);

        if (object) {
          mainContent.innerHTML = "";
          renderKeysInUI(flattenKeys(object.EntityResult));
          headerTitle.textContent = object.Entity;
        }
        document.querySelectorAll("[data-menu='item']").forEach(item => item.classList.remove("active"));
        target.classList.add("active");

        mainContent.scrollTop = 0;
      });
    }
  }

  /**
   * Recursively flattens a nested object into an array of { key, value } pairs.
   */
  function flattenKeys(obj, parentKey = "", sep = " ") {
    let keys = [];
    for (let key in obj) {
      if (obj.hasOwnProperty(key)) {
        let combinedKey = parentKey ? `${parentKey}${sep}${key}` : key;

        if (Array.isArray(obj[key])) {
          keys.push({key: combinedKey, value: obj[key]});
        } else if (typeof obj[key] === "object" && obj[key] !== null) {
          let nestedKeys = flattenKeys(obj[key], combinedKey, sep);
          keys = [...keys, ...nestedKeys];
        } else {
          keys.push({key: combinedKey, value: obj[key]});
        }
      }
    }

    return keys;
  }

  /**
   * Renders keys and their corresponding values in the UI.
   */
  function renderKeysInUI(keys) {
    const mainContent = document.getElementById("mainContent");
    const ul = document.createElement("ul");
    ul.classList.add("list");

    keys.forEach(({key, value}) => {
      if (value === "" || value === null || value === undefined) {
        value = "N/A"; // Replace empty strings or null/undefined with "N/A"
      }
      if (!value && value !== false && typeof value !== "number") return;
      const li = document.createElement("li");
      li.classList.add("list-item");

      const spanElement = document.createElement("span");
      const spanKey = document.createElement("span");
      spanKey.classList.add("list-item-text", "list-item-text-key");
      renderWithTooltip(spanKey, convertCamelCaseToTitleCase(key));

      if (Array.isArray(value)) {
        spanElement.classList.add("list-item-text", "list-item-text-value", "tag");
        value.forEach(item => {
          if (typeof item === "object") return;
          const label = document.createElement("label");
          label.classList.add("tag-item");
          renderWithTooltip(label, item);
          spanElement.appendChild(label);
        });

        li.appendChild(spanKey);
        li.appendChild(spanElement);

      } else {
        spanElement.classList.add("list-item-text", "list-item-text-value");
        renderWithTooltip(spanElement, value);
        const lowerCaseValue = String(value).toLowerCase();

          spanElement.classList.add("list-item-warning-value", "list-item-specific-value");
          spanElement.innerHTML = `${icon} Warning`;
        } else if (lowerCaseValue === "error") {
          const icon = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.00065 1.33325C4.32065 1.33325 1.33398 4.31992 1.33398 7.99992C1.33398 11.6799 4.32065 14.6666 8.00065 14.6666C11.6807 14.6666 14.6673 11.6799 14.6673 7.99992C14.6673 4.31992 11.6807 1.33325 8.00065 1.33325ZM8.66732 11.3333H7.33398V9.99992H8.66732V11.3333ZM8.66732 8.66659H7.33398V4.66659H8.66732V8.66659Z" fill="#FF5A50"/></svg>`;

        } else if (lowerCaseValue === "informational") {
          const icon = `<svg width="27" height="6" viewBox="0 0 27 6" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="3" fill="var(--sev-unspec)"/><circle cx="10" cy="3" r="3" fill="var(--sev-unspec)"/><circle cx="17" cy="3" r="3" fill="var(--sev-unspec)"/><circle cx="24" cy="3" r="3" fill="var(--sev-unspec)"/></svg>`;

          const icon = `<svg width="27" height="6" viewBox="0 0 27 6" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="3" fill="var(--sev-high)"/><circle cx="10" cy="3" r="3" fill="var(--sev-high)"/><circle cx="17" cy="3" r="3" fill="var(--sev-high)"/><circle cx="24" cy="3" r="3" fill="var(--sev-unspec)"/></svg>`;

        } else if (lowerCaseValue === "critical") {
          const icon = `<svg width="27" height="6" viewBox="0 0 27 6" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="3" cy="3" r="3" fill="var(--sev-critical)"/><circle cx="10" cy="3" r="3" fill="var(--sev-critical)"/><circle cx="17" cy="3" r="3" fill="var(--sev-critical)"/><circle cx="24" cy="3" r="3" fill="var(--sev-critical)"/></svg>`;
          spanElement.classList.add("list-item-specific-value");
          spanElement.innerHTML = `${icon} Critical`;
        } else if (/\.(png|jpg|jpeg|gif|bmp|webp)$/.test(lowerCaseValue)) {
          const icon = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12.6284 11.4587L10.0829 5.94357C10.0201 5.80781 9.89075 5.71533 9.74227 5.69963C9.59209 5.68393 9.44827 5.74714 9.35833 5.86678L7.06745 8.92129L5.70989 7.90312C5.60892 7.82761 5.47995 7.80046 5.35777 7.8293C5.23517 7.85815 5.13208 7.94003 5.07565 8.05245L3.3787 11.4464C3.31295 11.5779 3.32016 11.734 3.39737 11.8591C3.47458 11.9843 3.61119 12.0607 3.7584 12.0607H12.2432C12.3878 12.0607 12.5227 11.9868 12.6004 11.8651C12.6784 11.7433 12.689 11.5902 12.6284 11.4587Z" fill="currentColor"/><path d="M6.30396 6.1216C7.00686 6.1216 7.57668 5.55179 7.57668 4.84889C7.57668 4.14599 7.00686 3.57617 6.30396 3.57617C5.60106 3.57617 5.03125 4.14599 5.03125 4.84889C5.03125 5.55179 5.60106 6.1216 6.30396 6.1216Z" fill="currentColor"/></svg>`;
          spanElement.classList.add("list-item-specific-value");
          spanElement.innerHTML = `<button class="list-item-screenshot tag tag-item" data-modal="${value}" data-modal-button="item" data-modal-img="true">${icon} <span class="list-item-screenshot-text text-ellipsis">Screenshot</span></button>`;
        }
        li.appendChild(spanElement);
      }

      if (!spanElement.textContent) {
        return;
      }

      li.insertBefore(spanKey, li.firstChild);
      ul.appendChild(li);
    });

    mainContent.appendChild(ul);
  }

  /**
   * Utility function to filter keys based on allowlistedFields
   */
  function filterKeys(obj, allowedKeys) {
    if (allowedKeys.length === 0) {
      return obj;
    }
    const filtered = {};
    allowedKeys.forEach(key => {
      if (obj.hasOwnProperty(key)) {
        filtered[key] = obj[key];
      }
    });
    return filtered;
  }

  /**
   * Removes special symbols from a string.
   */
  function removeSpecialSymbols(str) {
    return str.replace(/[^\w\s]/gi, "");
  }

  /**
   * Converts camelCaseName to Title Case.
   */
  function convertCamelCaseToTitleCase(str) {
    let result = str.replace(/_/g, " ");
    result = result.replace(/([a-z])([A-Z])/g, "$1 $2");
    result = result.replace(/\b\w/g, char => char.toUpperCase());
    return result;
  }

  /**
   * Creates a tooltip with given text and position.
   */
  function createTooltip(text, x, y, trianglePointX, placeAtBottom, contentOverflowWindow) {
    removeTooltip();
    const tooltip = document.createElement("div");
    tooltip.classList.add("tooltip");
    tooltip.textContent = text;
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
    if (contentOverflowWindow) {
      tooltip.style.right = `${tooltipGap}px`;
    }
    const tooltipTriangle = document.createElement("span");
    tooltipTriangle.classList.add("tooltip-triangle");
    tooltipTriangle.style.left = `${trianglePointX}px`;
    if (placeAtBottom) {
      tooltipTriangle.style.top = "-8px";
      tooltipTriangle.style.borderTop = "0";
      tooltipTriangle.style.borderBottom = "solid 8px rgb(195, 210, 232)";
    }
    tooltip.append(tooltipTriangle);
    document.body.append(tooltip);
  }

  /**
   * Removes any existing tooltip from the DOM.
   */
  function removeTooltip() {
    const tooltip = document.querySelectorAll(".tooltip");
    tooltip.forEach((item) => {
      if (item) {
        item.remove();
      }
    });
  }

  /**
   * Sets a timeout to calculate and show tooltip position after a delay.
   */
  function createTooltipListener(event) {
    tooltipTimeout = setTimeout(() => calculateTooltipPosition(event), 1000);
  }

  /**
   * Clears any existing tooltip timeout and removes the tooltip.
   */
  function removeTooltipListener() {
    if (tooltipTimeout) {
      clearTimeout(tooltipTimeout);
    }
    removeTooltip();
  }

  /**
   * Calculates and positions the tooltip relative to the event target.
   */
  function calculateTooltipPosition(event) {
    const target = event.target;
    if (!target) {
      return;
    }
    const viewportWidth = window.innerWidth;
    const rect = target.getBoundingClientRect();
    const tooltipContent = document.createElement("div");
    tooltipContent.classList.add("tooltip");
    tooltipContent.style.top = "0";
    tooltipContent.textContent = target.textContent;
    document.body.appendChild(tooltipContent);
    let contentOverflowWindow = false;
    // Determine if window width would not be enough for content of tooltip
    if (tooltipGap * 2 + tooltipContent.offsetWidth >= viewportWidth) {
      // setting left, right positions to get correct tooltipContentWidth and tooltipContentHeight
      tooltipContent.style.left = `${tooltipGap}px`;
      tooltipContent.style.right = `${tooltipGap}px`;
      contentOverflowWindow = true;
    }
    const tooltipContentWidth = tooltipContent.offsetWidth;
    const tooltipContentHeight = tooltipContent.offsetHeight;
    tooltipContent.remove();
    const elementMidX = rect.left + (rect.width / 2);
    const placeOnRight = elementMidX + tooltipContentWidth / 2 + tooltipGap > viewportWidth;
    const x = Math.max(tooltipGap, placeOnRight ? viewportWidth - tooltipContentWidth - tooltipGap : elementMidX - tooltipContentWidth / 2);
    const placeAtBottom = rect.top < tooltipContentHeight;
    const y = placeAtBottom ? rect.bottom + tooltipTriangleHeight : rect.top - tooltipContentHeight;
    // Calculating trianglePointX relative to window width, to guarantee that it is not out of window
    const trianglePointX = Math.min(Math.max(elementMidX - x, tooltipTriangleMinGap), tooltipContentWidth - tooltipTriangleMinGap - triangleWidth);
    createTooltip(target.textContent, x, y, trianglePointX, placeAtBottom, contentOverflowWindow);
  }

  /**
   * Renders an item with text and sets up tooltip behavior.
   */
  function renderWithTooltip(item, text) {
    item.innerText = text;
    item.classList.add("text-ellipsis");
    tooltipDetectResizeObserver.observe(item);
  }
</script>
