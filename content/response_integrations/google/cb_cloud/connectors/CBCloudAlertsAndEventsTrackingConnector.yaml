name: VMware Carbon Black Cloud Alerts and Events Tracking Connector
parameters:
-   name: DeviceProductField
    default_value: ProductName
    type: string
    description: The field name used to determine the device product
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: event_type
    type: string
    description: The field name used to determine the event name (sub-type)
    is_mandatory: false
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: '180'
    type: string
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is ""
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: integer
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is ""
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: ''
    type: string
    description: Vmware Carbon Black Cloud API Root URL
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Organization Key
    default_value: ''
    type: string
    description: Vmware Carbon Black Cloud Organization Key, Eg. 7DDDD9DD
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API ID
    default_value: ''
    type: password
    description: Vmware Carbon Black Cloud API ID (Custom API Key ID)
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Secret Key
    default_value: ''
    type: password
    description: Vmware Carbon Black Cloud API Secret Key (Custom API Secret Key)
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: Verify SSL certificates for HTTPS requests to Microsoft Azure.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Alerts Per Cycle
    default_value: '100'
    type: integer
    description: How many alerts should be processed during one connector run.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Offset Time In Hours
    default_value: '24'
    type: integer
    description: Number of hours before the first connector iteration to retrieve
        alerts from. This parameter applies to the initial connector iteration after
        you enable the connector for the first time, or used as a fallback value in
        cases where connector's last run timestamp expires.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Minimum Severity to Fetch
    default_value: ''
    type: integer
    description: Minimum severity of Carbon Black Cloud alert to be ingested to Siemplify,
        for example, 4 or 7
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: What Alert Field to use for Name field
    default_value: type
    type: string
    description: 'What Carbon Black Cloud alert field should be used for the Siemplify
        Alert Name field. Possible values are: type, policy_name'
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: What Alert Field to use for Rule Generator
    default_value: type
    type: string
    description: 'What Carbon Black Cloud alert field should be used for the Siemplify
        Alert Rule Generator field. Possible values are: type, policy_name'
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Alert Reputation to Ingest
    default_value: ''
    type: string
    description: What Carbon Black Cloud alert reputation alert can have to be ingested.
        Parameter accepts multiple values as a comma separated string. If "N/A" is
        provided, connector will ingest alerts without reputation.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Events Padding Period (hours)
    default_value: '24'
    type: integer
    description: Specify how many hours connector should track new events for already
        ingested alert.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Events Limit to Ingest per Alert
    default_value: '25'
    type: integer
    description: Specify how many events can be ingested per single CB Cloud alert
        per Connector iteration.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Total Limit of Events per Alert
    default_value: '100'
    type: integer
    description: Specify a total number of events connector should get per single
        CB Cloud alert. If this limit is reached, no new events will be fetched for
        alert. In order to not limit the total number of events, please leave this
        parameter empty.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Backlog Alerts per Cycle
    default_value: '10'
    type: integer
    description: How many alerts connector should try to fetch from the backlog during
        one connector run.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Alerts Backlog Timer
    default_value: 60
    type: integer
    description: Time frame in minutes for which connector should try to fetch again
        the alerts from backlog it previously failed to process.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: ip
    description: Proxy server to use for connection.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Username
    default_value: ''
    type: string
    description: Proxy server username
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Password
    default_value: ''
    type: password
    description: Proxy server password
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Watchlist Name Filter
    default_value: ''
    type: string
    description: If provided, for CB Cloud alerts with the type “Watchlist“ ingest
        only that were triggered by the respective whatchlist. Parameter accepts multiple
        values as a comma separated string. If nothing is specified - ingest everything
        regardless of watchlist name.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Alert Name Template
    default_value: ''
    type: string
    description: 'If specified, connector will use this value from the CB Cloud API
        response for alert data for Siemplify Alert Name. You can provide placeholders
        in the following format: [name of the field]. Example: CBCLOUD Alert - [reason].
        Note: the maximum length for the field is 256 characters. If nothing is provided
        or user provides an invalid template, connector will use the default alert
        name.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Rule Generator Template
    default_value: ''
    type: string
    description: 'If specified, connector will use this value from the CB Cloud API
        response for alert data for Siemplify Rule Generator. You can provide placeholders
        in the following format: [name of the field]. Example: CBCLOUD - [reason].
        Note: the maximum length for the field is 256 characters. If nothing is provided
        or user provides an invalid template, connector will use the default rule
        generator value.'
    is_mandatory: false
    is_advanced: true
    mode: script
description: Fetch Carbon Black Cloud Alerts and Events as Events are added to Carbon
    Black Cloud Alerts. Connector can create multiple Siemplify alerts for single
    Carbon Black Cloud Alert, if Cloud Alert was updated with new events after initial
    ingestion by Siemplify.
integration: CBCloud
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/vmware-carbon-black-cloud#vmware-carbon-black-cloud-alerts-and-events-tracking-connector
rules: []
is_connector_rules_supported: false
creator: admin
