"Create a Reputation Override for SHA-256 Hash":
  ai_description: >-
    ### General Description

    The **Create a Reputation Override for SHA-256 Hash** action allows users to define
    a specific reputation (either `WHITE_LIST` or `BLACK_LIST`) for a file hash in
    the VMware Carbon Black Cloud environment. This is a containment and policy management
    action used to explicitly allow or block files based on their SHA-256 signature.
    The action can target a hash provided as a direct input parameter or process multiple
    `FILEHASH` entities present in the current context.


    ### Flow Description

    1. **Initialization:** Retrieves integration configuration and action parameters.

    2. **Target Identification:** Determines the list of hashes to process. It checks
    the `SHA-256 Hash` parameter first; if empty, it collects all `FILEHASH` entities
    from the Siemplify context.

    3. **Format Validation:** Validates each hash against a SHA-256 regular expression
    to ensure API compatibility.

    4. **API Interaction:** For each valid hash, it sends a POST request to the VMware
    Carbon Black Cloud API (`/appservices/v6/orgs/{org_key}/reputations/overrides`)
    to create the reputation override with the specified list, filename, and description.

    5. **Result Processing:** Collects the API response for each hash, including the
    unique override ID and creation metadata.

    6. **Finalization:** Updates the action results with JSON data and provides a
    summary message of successful and failed overrides.


    ### Additional Notes

    - **Precedence Logic:** If a hash is provided in the `SHA-256 Hash` parameter,
    the action will execute only for that specific hash, ignoring any `FILEHASH` entities
    in the scope.

    - **Validation:** The action strictly validates that the input is a valid 64-character
    SHA-256 string. If an invalid format is detected, the action will fail.
