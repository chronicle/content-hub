List Host Vulnerabilities:
  ai_description: >-
    ### General Description

    Retrieves and lists vulnerabilities for Hostname and IP Address entities from
    VMware Carbon Black Cloud. This action identifies the corresponding device in
    the Carbon Black environment and fetches associated vulnerability data, including
    CVE IDs, risk scores, and descriptions. It provides a summary of vulnerability
    counts by severity and attaches detailed reports to the entities.


    ### Flow Description

    1. Extracts action parameters (Severity Filter and Max Vulnerabilities To Return).

    2. Filters valid IP Address and Hostname entities from the case.

    3. For each entity, searches Carbon Black Cloud for the matching device via the
    `search_devices` API.

    4. Fetches vulnerability details for the identified device via the `get_vulnerability_details`
    API, applying the specified severity filters and result limits.

    5. Calculates statistics for the found vulnerabilities (counts of Critical, Important,
    Moderate, and Low severity issues).

    6. Attaches a detailed data table (CVE ID, Risk Score, Severity, Description)
    and raw JSON results to the entity.

    7. Updates the entities within Google SecOps to reflect the enrichment status.


    ### Additional Notes

    If multiple devices match the entity identifier, the action prioritizes the most
    recently contacted device.
