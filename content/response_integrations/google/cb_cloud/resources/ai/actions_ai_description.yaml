    ### General Description

    This action creates an unquarantine device task on the VMware Carbon Black Cloud
    server for specific IP Address or Hostname entities. It is used to programmatically
    restore network connectivity and normal operations to a device that was previously
    isolated or quarantined by the Carbon Black sensor.


    ### Flow Description

    1. **Entity Filtering**: The action filters the target entities to include only
    IP Address and Hostname entities.

    2. **Device Search**: For each suitable entity, it queries the VMware Carbon Black
    Cloud API (`search_devices`) to find matching devices based on the entity's original
    identifier.

    3. **Selection Logic**: If multiple devices match, the action selects the one
    that checked in most recently.

    4. **Task Creation**: The action sends a POST request to the Carbon Black Cloud
    `device_actions` endpoint to create an unquarantine task for the identified device
    ID.

    5. **Reporting**: The action provides a summary of successful task creations,
    missing devices, and any failures encountered during the process.


    ### Additional Notes

    - The action supports **ADDRESS** (IP) and **HOSTNAME** entities.

    - If no device is found for an entity, it is skipped.

    - The action performs a state-changing operation in an external system and is
    therefore not classified as an enrichment action.
