Create a Reputation Override for IT Tool:
  ai_description: >-
    ### General Description

    Creates a reputation override for a specific IT tool in VMware Carbon Black Cloud.
    This action allows users to define whether a specific file path should be treated
    as part of a 'WHITE_LIST' or 'BLACK_LIST'. The action can target specific FILENAME
    entities or use a manually provided file name and path.


    ### Flow Description

    1. Retrieves action parameters and integration configuration.

    2. Determines the list of filenames to process. It uses the 'File Name' parameter
    if provided; otherwise, it collects the identifiers of all 'FILENAME' entities
    in the scope.

    3. Validates that a 'Reputation Override List' is selected and that at least one
    filename is available to process.

    4. For each filename, constructs the full file path and calls the VMware Carbon
    Black Cloud API (POST `/appservices/v6/orgs/{org_key}/reputations/overrides`)
    to create the reputation override.

    5. Captures the API response for each successful override and attaches the details
    as JSON results.


    ### Additional Notes

    - If the 'File Name' parameter is empty, the action will attempt to process all
    'FILENAME' entities present in the current context.

    - The final path sent to VMware Carbon Black Cloud is a concatenation of 'File
    Path' and 'File Name'.
