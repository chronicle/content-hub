"Create a Reputation Override for Certificate":
  ai_description: >-
    ### General Description

    Creates a reputation override for a certificate in VMware Carbon Black Cloud.
    This action allows security analysts to programmatically define the reputation
    (e.g., whitelisting or blacklisting) of applications based on their digital certificate's
    signer and/or the issuing Certificate Authority.


    ### Flow Description

    1. Extracts the action parameters (Signer, CA, List Type, Description).

    2. Validates that a valid reputation list (WHITE_LIST or BLACK_LIST) has been
    selected.

    3. Initializes the CBCloudManager to establish a connection with the VMware Carbon
    Black Cloud instance.

    4. Sends a POST request to the Carbon Black API to create a certificate-type (`CERT`)
    reputation override with the specified details.

    5. Captures the API response, which includes the unique ID of the new override,
    and attaches it as a JSON result to the action output.


    ### Additional Notes

    - This action does not run on Google SecOps entities. It uses the provided manual
    input parameters to interact with the VMware Carbon Black Cloud API.

    - The action will fail if the 'Reputation Override List' is left as 'Not Specified'.
  ai_short_description: >-
    Creates a reputation override (whitelist or blacklist) for a certificate in VMware
    Carbon Black Cloud based on its signer and/or Certificate Authority.
  capabilities:
    can_create_case_comments: false
