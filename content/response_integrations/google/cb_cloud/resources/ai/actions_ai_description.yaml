Device Background Scan:
  ai_description: >-
    ### General Description

    The **Device Background Scan** action triggers a background scan task on VMware
    Carbon Black Cloud for devices associated with the provided IP Address or Hostname
    entities. This action is used to initiate a remote security scan on endpoints
    to identify potential threats or verify the security posture of a device during
    an incident response workflow.


    ### Flow Description

    1. **Connection Setup**: The action initializes the `CBCloudManager` using the
    integration's API credentials and organization key.

    2. **Entity Filtering**: It identifies all `ADDRESS` and `HOSTNAME` entities from
    the target entities list provided by the SOAR platform.

    3. **Device Search**: For each valid entity, the action queries the VMware Carbon
    Black Cloud API to find matching devices based on the IP address or hostname.

    4. **Scan Initiation**: If a matching device is found, the action sends a POST
    request to the external system to create a `BACKGROUND_SCAN` task for that specific
    device ID.

    5. **Result Aggregation**: The action tracks successful task creations, missing
    devices, and any failures, providing a comprehensive summary message and a boolean
    success result.


    ### Additional Notes

    - The action relies on the integration's global configuration to authenticate
    with VMware Carbon Black Cloud.

    - It supports both `ADDRESS` (IP) and `HOSTNAME` entity types.

    - If multiple devices match a single entity identifier in Carbon Black Cloud,
    the action will select the first match to perform the scan.
