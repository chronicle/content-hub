    ### General Description

    This action lists reputation overrides configured in VMware Carbon Black Cloud.
    It allows security analysts to audit and review existing whitelist or blacklist
    entries for file hashes (SHA256), certificates, and IT tools. The action supports
    filtering by override list type and specific reputation types, as well as pagination
    and sorting of results.


