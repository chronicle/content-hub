    3. **API Request**: The action calls the VMware Carbon Black Cloud API to search
    for reputation overrides based on the provided filters (List, Type, Sort Order).

    4. **Data Processing**: The retrieved overrides are parsed into specific data
    models (SHA256, Certificate, or IT Tool) and grouped by their override type.

    5. **Output Generation**: The action populates the Google SecOps case with data
