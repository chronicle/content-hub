    3. **Device Search**: For each entity, the action queries the Carbon Black Cloud
    API using the `search_devices` method. IP addresses are searched using a query
    parameter, while Hostnames are matched using a 'starts with' logic.

    4. **Data Processing**: If matching devices are found, the action retrieves the
    most recently active device record.

    5. **Internal Mutation**: The action updates the entity's `additional_properties`
    with device metadata (OS, AV status, policy ID, etc.), sets the `is_enriched`
    flag to true, and generates a data table for the case wall.

    6. **Completion**: Finally, it updates the entities within Google SecOps and returns
    a comprehensive JSON result of all enriched data.


