name: Create a Reputation Override for IT Tool
description: 'Create a Reputation Override for the specific IT Tool based on a file
    name and path. Note: The file name can be provided either as a Siemplify File
    (artifact) or as an action input parameter. If the file name is passed to action
    both as an entity and input parameter - action will be executed on the input parameter.
    File name will be appended to the File Path parameter to get the resulting path
    to add to the override.'
integration_identifier: CBCloud
parameters:
-   name: File Name
    default_value: ''
    type: string
    description: Specify a corresponding file name to add to reputation override.
    is_mandatory: false
-   name: File Path
    default_value: ''
    type: string
    description: 'Specify a file path where corresponding IT Tool is stored on disk
        to add to reputation override. Example format: C:\TMP\ '
    is_mandatory: true
-   name: Description
    default_value: ''
    type: string
    description: Specify a description for the created reputation to override.
    is_mandatory: false
-   name: Reputation Override List
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - WHITE_LIST
    - BLACK_LIST
    description: Specify override list to create.
    is_mandatory: true
-   name: Include Child Processes
    default_value: 'False'
    type: boolean
    description: If enabled, include IT Tool's child processes on approved list
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_reputation_override_for_it_tool_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
simulation_data_json: '{"Entities": ["FILENAME"]}'
