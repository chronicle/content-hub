name: Create a Reputation Override for Certificate
description: Create a Reputation Override for the certificate. Note that action is
    not working on Siemplify entities.
integration_identifier: CBCloud
parameters:
-   name: Certificate Authority
    default_value: ''
    type: string
    description: Specify the Certificate Authority that authorizes the validity of
        the certificate to add to reputation override.
    is_mandatory: false
-   name: Signed By
    default_value: ''
    type: string
    description: Specify the name of the signer to add to reputation override.
    is_mandatory: true
-   name: Description
    default_value: ''
    type: string
    description: Specify a description for the created reputation override.
    is_mandatory: false
-   name: Reputation Override List
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - WHITE_LIST
    - BLACK_LIST
    description: Specify override list to create.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/CreateReputationOverrideForCertificate_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
