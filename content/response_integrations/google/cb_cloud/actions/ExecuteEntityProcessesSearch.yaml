name: Execute Entity Processes Search
description: 'Execute Carbon Black Cloud Process Search based on the Siemplify Entity.
    Action can be used to search information about processes stored in Carbon Black
    Cloud with action input parameters and following Siemplify entities: IP, Host,
    User, Hash, Process.'
integration_identifier: CBCloud
parameters:
-   name: Start from Row
    default_value: '0'
    type: string
    description: Specify from which row action should fetch data.
    is_mandatory: false
-   name: Max Rows to Return
    default_value: '50'
    type: string
    description: Specify how many rows action should return.
    is_mandatory: false
-   name: Create Insight
    default_value: false
    type: boolean
    description: If enabled, action will create a Siemplify insight based on process
        info from Carbon Black Cloud.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ExecuteEntityProcessesSearch_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
simulation_data_json: '{"Entities": ["USER", "FILEHASH", "PROCESS", "HOSTNAME", "ADDRESS"]}'
