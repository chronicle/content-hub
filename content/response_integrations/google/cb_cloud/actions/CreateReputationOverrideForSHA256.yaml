name: Create a Reputation Override for SHA-256 Hash
description: 'Create a Reputation Override for the provided hash in SHA-256 format.
    Note: The SHA-256 hash can be provided either as a Siemplify FileHash (artifact)
    or as an action input parameter. If the hash is passed to action both as an entity
    and input parameter - action will be executed on the input parameter.'
integration_identifier: CBCloud
parameters:
-   name: SHA-256 Hash
    default_value: ''
    type: string
    description: Specify a SHA-256 hash value to create override for.
    is_mandatory: false
-   name: Filename
    default_value: ''
    type: string
    description: Specify a corresponding file name to add to reputation override.
    is_mandatory: true
-   name: Description
    default_value: ''
    type: string
    description: Specify a description for the created reputation override.
    is_mandatory: false
-   name: Reputation Override List
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - WHITE_LIST
    - BLACK_LIST
    description: Specify override list to create.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/CreateReputationOverrideForSHA256_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["FILEHASH"]}'
