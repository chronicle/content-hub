name: List Reputation Overrides
description: List reputation overrides configured in VMware Carbon Black Cloud. Note
    that action is not working on Siemplify entities.
integration_identifier: CBCloud
parameters:
-   name: Reputation Override List
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - WHITE_LIST
    - BLACK_LIST
    description: Specify override list action should return.
    is_mandatory: false
-   name: Reputation Override Type
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - CERT
    - SHA256
    - IT_TOOL
    description: Specify override type action should return.
    is_mandatory: false
-   name: Start from Row
    default_value: 0
    type: string
    description: Specify from which row action should fetch data.
    is_mandatory: false
-   name: Max Rows to Return
    default_value: 50
    type: string
    description: Specify how many rows action should return.
    is_mandatory: false
-   name: Rows Sort Order
    default_value: ASC
    type: ddl
    optional_values:
    - ASC
    - DESC
    description: Specify sort order for the returned rows. Rows are sorted based on
        "create_time" value.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_reputation_overrides_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
