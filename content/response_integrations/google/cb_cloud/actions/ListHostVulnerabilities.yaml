name: List Host Vulnerabilities
description: 'List vulnerabilities found on the host in Сarbon Black Cloud. Supported
    entities: IP Address and Hostname.'
integration_identifier: CBCloud
parameters:
-   name: Severity Filter
    default_value: ''
    type: string
    description: 'Specify the comma-separated list of severities for vulnerabilities.
        If nothing is provided, action will ingest all related vulnerabilities. Possible
        values: Critical, Important, Moderate, Low.'
    is_mandatory: false
-   name: Max Vulnerabilities To Return
    default_value: 100
    type: string
    description: Specify how many vulnerabilities to return per host. If nothing is
        provided, action will process all of the related vulnerabilities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ListHostVulnerabilities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
