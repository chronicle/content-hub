name: Dismiss VMware Carbon Black Cloud Alert
description: 'Dismiss VMware Carbon Black Cloud alert. Note: action accepts alert
    id in format 27162661199ea9a043c11ea9a29a93652bc09fd, not in format that is shown
    in UI as DONAELUN.'
integration_identifier: CBCloud
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: Alert ID to dismiss on VMware Carbon Black Cloud server.
    is_mandatory: true
-   name: Reason for dismissal
    default_value: No dismissal reason
    type: ddl
    optional_values:
    - No dismissal reason
    - Resolved
    - Resolved - Benign/Known good
    - Duplicate/Cleanup
    - Other
    description: VMware Carbon Black Cloud reason for alert dismissal.
    is_mandatory: true
-   name: Determination
    default_value: None
    type: ddl
    optional_values:
    - None
    - True positive
    - False positive
    description: Specify the determination to set for an alert.
    is_mandatory: true
-   name: Message for alert dismissal
    default_value: The alert has been dismissed by Siemplify
    type: string
    description: Message to add to alert dismissal.
    is_mandatory: false
dynamic_results_metadata: []
default_result_value: ''
creator: Admin
