Add Entities To Address Group:
  ai_description: >-
    ### General Description

    Adds specified IP Address and URL entities to a designated address group in Fortigate.
    If the entities do not already exist in Fortigate, the action will create them
    before adding them to the group.


    ### Flow Description

    1. Extracts the target address group name from the action parameters.

    2. Queries the Fortigate API (GET request) to verify the existence of the specified
    address group.

    3. Iterates through the supported target entities (IP Addresses and URLs). For
    URLs, the domain part is extracted.

    4. For each entity, queries Fortigate (GET request) to check if it already exists.
    If it does not exist, the action creates the entity in Fortigate (POST request).

    5. Checks if the entity is already a member of the target address group. If not,
    it updates the address group to include the new entity (PUT request).

    6. Returns a summary message detailing the successfully added, already existing,
    and failed entities.


    ### Additional Notes

    The action will automatically extract the domain part of URL entities before processing
    them.
  ai_short_description: >-
    Adds IP Address and URL entities to a specified address group in Fortigate, creating
    the entities in the firewall if they do not already exist.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates new address entities and updates address group memberships in Fortigate.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes GET requests to check the existence of address groups and entities,
      but this is for internal logic rather than fetching contextual enrichment data.
      It makes POST and PUT requests to Fortigate to create entities and update address
      group memberships, meaning it mutates external data. It does not mutate internal
      SecOps data, update entities, or create insights.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
