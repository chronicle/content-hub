Remove Entities From Policy:
  ai_description: >-
    ### General Description

    Removes specified IP Address and URL entities from a designated policy in Fortigate.
    This action modifies the firewall policy by removing the entities from either
    the source or destination items list.


    ### Flow Description

    1. Extracts the `Policy Name` and `Location` (Source or Destination) from the
    action parameters.

    2. Iterates over the target entities, filtering for IP Addresses and URLs.

    3. Queries the Fortigate API to verify that the specified policy exists.

    4. For each suitable entity, checks if the entity exists in Fortigate and if it
    is currently a part of the specified policy.

    5. If the entity is part of the policy, sends a PUT request to the Fortigate API
    to remove the entity from the policy's source or destination items.

    6. Compiles and returns a summary message detailing which entities were successfully
    removed, which were not part of the policy, and which failed processing.


    ### Additional Notes

    - The action automatically extracts the domain part of URL entities before processing
    them.

    - If the specified policy does not exist, the action will fail and raise an exception.
  ai_short_description: >-
    Removes specified IP Address and URL entities from a designated policy's source
    or destination items in Fortigate.
