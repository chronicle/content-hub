Add Entities To Policy:
  ai_description: >-
    ### General Description

    Adds specified IP Address and URL entities to a designated policy in Fortigate.
    The action extracts the domain part of URL entities before processing and ensures
    the corresponding address objects exist in the firewall before associating them
    with the policy.


    ### Flow Description

    1. Extracts the provided policy name and location (Destination or Source) from
    the action parameters.

    2. Queries Fortigate via API to verify the existence of the specified policy.

    3. Iterates through the supported target entities (IP Address and URL).

    4. For each entity, queries Fortigate to check if it already exists as an address
    object.

    5. If the entity does not exist, makes an API call to create a new address object
    for it.

    6. Checks if the entity is already part of the specified policy's source or destination
    items.

    7. If not, makes an API call to update the policy, adding the entity to the specified
    location.

    8. Returns a summary message detailing successfully added, already existing, and
    failed entities.


    ### Additional Notes

    The action only supports IP Address and URL entities. For URL entities, it automatically
    extracts and uses the domain part for the address object.
