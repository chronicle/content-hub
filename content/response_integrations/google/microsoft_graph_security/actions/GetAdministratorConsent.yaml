integration_identifier: MicrosoftGraphSecurity
parameters:
-   name: Redirect URL
    default_value: ''
    type: string
    description: Use the redirect url you registered to request an authorization.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
script_result_name: is_connected
