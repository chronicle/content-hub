Get Reputation:
  ai_description: >-
    ### General Description

    Enriches IP Address, Hostname, and URL entities using information from the Talos
    ThreatSource. It retrieves reputation, category information, and blocklist status
    for the supported entities to provide threat intelligence context.


    ### Flow Description

    1. Iterates over the target entities and filters for supported types (IP Address,
    Hostname, URL).

    2. For each supported entity, makes GET requests to the Talos API to fetch reputation,
    category info, and blocked info.

    3. Aggregates the retrieved data and updates the entity's additional properties
    with the enrichment data.

    4. Marks the entity as enriched and saves the updates to the platform.

    5. Attaches the raw JSON results and entity tables to the action result.


    ### Additional Notes

    The action runs asynchronously. For URL entities, it extracts and uses the domain
    part for the query.
  ai_short_description: >-
    Enriches IP Address, Hostname, and URL entities by retrieving reputation, category,
    and blocklist information from the Talos ThreatSource.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Talos API via GET requests. It does not mutate
      external data. It updates internal entities with the fetched enrichment data
      but does not create insights, modify alert data, or create case comments.
  entity_usage:
