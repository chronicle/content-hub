Whois:
  ai_description: >-
    ### General Description

    Retrieves Whois information for IP Address, Hostname, and URL entities using Talos
    ThreatSource.


    ### Flow Description

    1. Filters the target entities to include only IP Addresses, Hostnames, and URLs.

    2. For URL entities, extracts the domain part to be used for the query.

    3. Makes a GET request to the Talos ThreatSource API (`/cloud_intel/whois`) for
    each valid entity to fetch its Whois report.

    4. Collects the retrieved Whois reports and attaches them as JSON results to the
    action execution.


    ### Additional Notes

    This action runs asynchronously. Between each submission, the action waits to
    ensure access is not blocked by the API rate limits.
