Update Firewall Rule:
  ai_description: >-
    ### General Description

    Updates an existing firewall rule in a specific Cloudflare zone. This action allows
    modifying the rule's action, expression, products, priority, and reference tag.


    ### Flow Description

    1. Extracts the provided parameters including Rule Name, Zone Name, Action, Expression,
    Products, Priority, and Reference Tag.

    2. Validates the input parameters, ensuring correct product values for the "Bypass"
    action and valid lengths/values for tags and priority.

    3. Makes an API call to Cloudflare to retrieve the zone ID based on the provided
    Zone Name.

    4. Makes an API call to list firewall rules in the zone and finds the rule matching
    the provided Rule Name.

    5. Makes an API call (PUT) to update the firewall rule with the new action, products,
    priority, and reference tag.

    6. If an expression is provided, makes an API call (PUT) to update the firewall
    filter associated with the rule.

    7. Makes an API call to retrieve the updated firewall rule data.

    8. Returns the updated rule data as a JSON result.


    ### Additional Notes

    The "Products" parameter is mandatory if the "Bypass" action is selected. The
    "Reference Tag" can only be up to 50 characters long.
  ai_short_description: >-
    Updates an existing firewall rule and its associated filter in a specific Cloudflare
    zone.
