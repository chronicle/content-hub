Create Firewall Rule:
  ai_description: >-
    ### General Description

    Creates a new firewall rule in a specified Cloudflare zone. This action allows
    users to define custom firewall rules using expressions and specific actions (e.g.,
    Block, Allow, Bypass) to manage traffic to their Cloudflare-protected resources.


    ### Flow Description

    1. Retrieves the zone ID for the provided `Zone Name` by making a GET request
    to the Cloudflare API.

    2. Validates the provided input parameters, ensuring that `Products` are specified
    if the `Action` is set to 'Bypass', and checks character limits for the `Reference
    Tag`.

    3. Makes a POST request to the Cloudflare API (`/client/v4/zones/{zone_id}/firewall/rules`)
    to create the firewall rule with the specified expression, action, and other configurations.

    4. Returns the JSON representation of the newly created firewall rule as the action
    result.


    ### Additional Notes

    - If "Bypass" is selected for the `Action` parameter, the `Products` parameter
    must be provided.

    - The `Reference Tag` can only be up to 50 characters long.

    - The `Priority` must be a positive number.
  ai_short_description: >-
    Creates a new firewall rule in a specified Cloudflare zone using a defined expression
    and action.
