Add URL To Rule List:
  ai_description: >-
    ### General Description

    Adds URL entities to a specified rule list in Cloudflare. The action specifically
    targets rule lists of type "redirect" and configures how the source URL (represented
    by the URL entity) should be redirected to a target URL.


    ### Flow Description

    1. Retrieves configuration and action parameters.

    2. Validates that if "Preserve Path Suffix" is enabled, "Subpath Matching" is
    also enabled.

    3. Fetches the specified rule list from Cloudflare and verifies it is of type
    "redirect".

    4. Iterates through the target entities, filtering for URL entities.

    5. For each URL entity, makes a POST request to the Cloudflare API to add the
    URL as a source URL to the rule list, along with the specified target URL and
    redirect configurations.

    6. Returns a JSON result containing the details of the added rule list items.


    ### Additional Notes

    Only URL entities are supported. The URL entities are treated as "Source URLs"
    for the redirect rule.
