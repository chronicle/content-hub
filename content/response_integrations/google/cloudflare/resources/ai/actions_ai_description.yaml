Add IP To Rule List:
  ai_description: >-
    ### General Description

    Adds IP address entities to a specified rule list in Cloudflare. This action modifies
    the configuration of a Cloudflare account by appending new IP items to an existing
    rule list, which can then be referenced by firewall rules to control network traffic.


    ### Flow Description

    1. Retrieves the specified rule list from Cloudflare using a GET request to verify
    it exists and is of type 'ip', and to obtain its internal ID.

    2. Iterates through the target entities, filtering specifically for IP Address
    entities.

    3. For each suitable entity, makes a POST request to the Cloudflare API (`/client/v4/accounts/{account_id}/rules/lists/{rule_id}/items`)
    to add the IP address and an optional description to the rule list.

    4. Collects the results and returns a JSON object containing the details of the
    added items.


    ### Additional Notes

    The target rule list must already exist in Cloudflare and must be configured as
    an 'ip' list type. The action's effect on traffic (e.g., blocking or allowing)
    depends on the firewall rules that reference the specified rule list.
  ai_short_description: >-
    Adds IP address entities to a specified rule list in Cloudflare.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the specified IP address entities to a rule list in Cloudflare.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Cloudflare API to add an IP address to
      a rule list, which mutates external data. It does not fetch contextual enrichment
      data, update internal entities, or create insights.
