Enrich Endpoints:
  ai_description: >-
    ### General Description

    Enriches Address and Hostname entities by fetching endpoint device information
    from CyberX. This action retrieves details about the devices associated with the
    target entities and attaches the information as an entity table.


    ### Flow Description

    1. Filters the target entities to include only those of type Address or Hostname.

    2. Iterates through the filtered entities.

    3. For Address entities, makes a GET request to the CyberX API (`/api/v1/devices`)
    to retrieve device information by IP address.

    4. For Hostname entities, makes a GET request to the CyberX API (`/api/v1/devices`)
    to retrieve device information by hostname.

    5. If device information is successfully retrieved, it formats the data and adds
    it as an entity table to the respective entity in the SecOps platform.

    6. Updates the entity's additional properties in memory with the fetched data.


    ### Additional Notes

    The action relies on the CyberX integration configuration (API Root and Access
    Token) to authenticate and communicate with the CyberX API.
  ai_short_description: >-
    Enriches Address and Hostname entities by retrieving endpoint device information
    from CyberX and adding it as an entity table.
