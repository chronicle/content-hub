Get Connections for Endpoint:
  ai_description: >-
    ### General Description

    Retrieves a list of network connections for specific endpoint devices from CyberX.
    This action helps analysts understand the network activity and communication patterns
    of a given asset.


    ### Flow Description

    1. Iterates through the target entities, specifically filtering for IP Address
    and Hostname entity types.

    2. For each valid entity, queries the CyberX API (`/api/v1/devices`) to retrieve
    the corresponding device ID based on the IP address or hostname.

    3. Uses the retrieved device ID to fetch the list of connections for that device
    via the CyberX API (`/api/v1/devices/{device_id}/connections`).

    4. Attaches the retrieved connection data as an entity table to the respective
    entity within the SecOps platform.


    ### Additional Notes

    If a device ID cannot be found for a given entity, the action will log an error
    and proceed to the next entity.
