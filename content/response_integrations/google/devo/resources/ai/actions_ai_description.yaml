Simple Query:
  ai_description: >-
    ### General Description

    Executes a simple query in Devo based on the provided parameters such as table
    name, fields to return, and where filter. The action retrieves the matching records
    and attaches them to the case as JSON and CSV data.


    ### Flow Description

    1. Extracts the action parameters including table name, fields to return, where
    filter, time frame, and max rows to return.

    2. Validates the provided time frame and constructs the Devo query string.

    3. Makes an API call (POST request) to the Devo `/search/query` endpoint to execute
    the query.

    4. Retrieves the query results and adds them to the action's JSON result and as
    a CSV data table.


    ### Additional Notes

    This action does not operate on Google SecOps entities. If it is planned to query
    a table other than `siem.logtrust.alert.info`, an additional token for that table
    must be created and specified on the integration configuration page.
