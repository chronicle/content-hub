Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Devo instance using the parameters provided in the integration
    configuration.


    ### Flow Description

    1. Extracts the integration configuration parameters including API URL, API Token,
    API Key, API Secret, and Verify SSL.

    2. Initializes the Devo API client and triggers a connectivity test.

    3. Makes an API call to the Devo query endpoint (`/search/query`) with a basic
    test query (`from siem.logtrust.alert.info`).

    4. Evaluates the response and returns a successful result if the connection is
    established, or fails the action with an error message if the connection cannot
    be made.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
