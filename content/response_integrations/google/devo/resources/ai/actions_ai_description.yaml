Advanced Query:
  ai_description: >-
    ### General Description

    Executes an advanced query against a Devo instance based on the provided parameters
    and returns the results.


    ### Flow Description

    1. Extracts the provided query, time frame, and row limit parameters.

    2. Validates the time frame and calculates the start and end timestamps.

    3. Initializes the Devo API client.

    4. Executes the advanced query against the Devo instance.

    5. If results are found, attaches them to the action result as JSON and a CSV
    data table.


    ### Additional Notes

    This action does not operate on Google SecOps entities. If it is planned to query
    a table other than `siem.logtrust.alert.info`, an additional token must be created
    following the Devo documentation and specified on the integration configuration
    page.
  ai_short_description: >-
    Executes an advanced query against a Devo instance based on the provided parameters
    and returns the results as JSON and a data table.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by executing a query against the Devo API. It does not
      mutate external data, update internal entities, create insights, modify alerts,
      or create case comments.
