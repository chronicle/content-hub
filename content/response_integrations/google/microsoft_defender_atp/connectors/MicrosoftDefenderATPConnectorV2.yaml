name: Microsoft Defender ATP Connector V2
parameters:
-   name: DeviceProductField
    default_value: ProductName
    type: string
    description: Describes the name of the field where the product name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: EventName
    type: string
    description: Describes the name of the field where the event name is stored.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: '300'
    type: string
    description: Specify the timeout for connector to run.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If environment field isn't found, environment is "".
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: integer
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return value unchanged. Used to
        allow the user to manipulate the environment field via regex logic. If regex
        pattern is null or empty, or the environment value is null, the final environment
        result is "".
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Login API Root
    default_value: https://login.microsoftonline.com
    type: string
    description: Login API root of the Microsoft 365 Defender instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Defender ATP API Root
    default_value: https://api.securitycenter.windows.com
    type: string
    description: 'Api root url to use with integration. For better performance, you
        can use server closer to your geo location: api-us.securitycenter.windows.com
        api-eu.securitycenter.windows.com api-uk.securitycenter.windows.com'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: 365 Defender API Root
    default_value: https://api.security.microsoft.com
    type: string
    description: API root of the Microsoft 365 Defender instance used to get Siemplify
        events data.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Graph API Root
    default_value: ''
    type: string
    description: The base URL for the Microsoft Graph API (e.g., https://graph.microsoft.com).
        If provided, V2 API endpoints will be used.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Azure Active Directory ID
    default_value: ''
    type: string
    description: Azure Active Directory Tenant ID, can be viewed in Active Directory
        > App Registration > <Application you configured for your integration> > Directory
        (tenant) ID.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Integration Client ID
    default_value: ''
    type: string
    description: Client (Application) ID that was added for app registration in Azure
        Active Directory for the integration.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Integration Client Secret
    default_value: ''
    type: password
    description: Secret that was entered for Azure AD app registration for the integration.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Microsoft 365 Defender server is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Offset Time In Hours
    default_value: '24'
    type: integer
    description: Fetch alerts from X hours backwards.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Alerts per Cycle
    default_value: '10'
    type: integer
    description: How many alerts should be processed during one connector run.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Alert Statuses to Fetch
    default_value: Unknown, New, InProgress, Resolved
    type: string
    description: Specify the statuses of the Defender ATP alerts that should be fetched
        by the Siemplify server. Parameter can take multiple values as a comma separated
        string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Alert Severities to Fetch
    default_value: UnSpecified, Informational, Low, Medium, High
    type: string
    description: Specify the severities of the Defender ATP alerts that should be
        fetched by the Siemplify server. Parameter can take multiple values as a comma
        separated string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: false
    type: boolean
    description: If enabled, the connector will ignore the overflow mechanism.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Use whitelist as a blacklist
    default_value: false
    type: boolean
    description: If enabled, whitelist will be used as a blacklist.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: ip
    description: Proxy server to use for connection.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Username
    default_value: ''
    type: string
    description: Proxy server username
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Password
    default_value: ''
    type: password
    description: Proxy server password
    is_mandatory: false
    is_advanced: true
    mode: script
description: Deprecation Notice! This connector is planned to be deprecated on 30th
    March 2027. Visit documentation for more information. Connector can be used to
    fetch Defender ATP alerts with events information from 365 Defender, as Defender
    ATP SIEM API used in v1 connector for events is deprecated starting March 1st
    2022. Connector whitelist can be used to ingest only specific types of alerts
    based on alert's "detectionSource" attribute value. SourceGroupIdentifier of the
    connector can be used to group Siemplify alerts based on Defender ATP incident
    id.
integration: MicrosoftDefenderATP
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#microsoft-defender-atp-connector-v2
rules: []
is_connector_rules_supported: false
creator: admin
