name: Microsoft Defender ATP Connector
parameters:
-   name: DeviceProductField
    default_value: ProductName
    type: string
    description: The field name used to determine the device product
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: category
    type: string
    description: The field name used to determine the event name (sub-type)
    is_mandatory: false
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: '180'
    type: string
    description: The timeout limit (in seconds) for the python process running current
        script
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: ''
    type: integer
    description: 'If defined - the connector will implement the specific RegEx pattern
        on the data from "environment field" to extract specific string. For example
        - extract domain from sender''s address: "(?<=@)(\S+$)"'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Login API Root
    default_value: https://login.microsoftonline.com
    type: string
    description: Login API root of the Microsoft 365 Defender instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Root
    default_value: https://api.securitycenter.windows.com
    type: string
    description: The API Root of Microsoft Defender ATP
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Azure Active Directory ID
    default_value: ''
    type: string
    description: Azure Active Directory Tenant ID, can be viewed in Active Directory
        > App Registration > <Application you configured for your integration> > Directory
        (tenant) ID.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Integration Client ID
    default_value: ''
    type: string
    description: Client (Application) ID that was added for the app registration in
        Azure Active Directory for this integration.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Integration Client Secret
    default_value: ''
    type: password
    description: Secret that was entered for Azure AD app registration
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: SIEM Client ID
    default_value: ''
    type: string
    description: Client (Application) ID for the enabled SIEM integration in Microsoft
        Defender ATP
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: SIEM Client Secret
    default_value: ''
    type: password
    description: Secret that for the enabled SIEM integration in Microsoft Defender
        ATP
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Alerts per Cycle
    default_value: '100'
    type: integer
    description: How many alerts should be processed during one connector run
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Offset Time In Hours
    default_value: '24'
    type: integer
    description: 'Fetch alerts from X hours backwards. Default value: 24 hours.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Alert Statuses to Fetch
    default_value: Unknown, New, InProgress, Resolved
    type: string
    description: Specify the statuses of the incidents that should be fetched by the
        Siemplify server. Comma-separated string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Alert Severities to Fetch
    default_value: UnSpecified, Informational, Low, Medium, High
    type: string
    description: Specify the severities of the incidents that should be fetched by
        the Siemplify server. Comma-separated string.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: ip
    description: Proxy server to use for connection.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Username
    default_value: ''
    type: string
    description: Proxy server username
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Password
    default_value: ''
    type: password
    description: Proxy server password
    is_mandatory: false
    is_advanced: true
    mode: script
description: Deprecation Notice! This connector is planned to be deprecated on 30th
    March 2027. Visit documentation for more information. Fetch alerts and events
    from MS Defender ATP
integration: MicrosoftDefenderATP
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#microsoft-defender-atp-connector
rules: []
is_connector_rules_supported: false
creator: admin
