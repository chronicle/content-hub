name: Enrich Entities
description: 'This action allows a user to enrich Microsoft Defender ATP hosts, ips
    and file hashes. Note: File hash can be in sha1 or sha256 format.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#enrich_entities
integration_identifier: MicrosoftDefenderATP
parameters: []
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "FILEHASH", "ADDRESS"]}'
