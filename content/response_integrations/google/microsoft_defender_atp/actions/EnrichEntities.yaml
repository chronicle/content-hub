name: Enrich Entities
description: 'Use the "Enrich Entities" action to enrich hosts, IP addresses, and
    file hashes using information from Microsoft Defender for Endpoint. This action
    returns the isolation status of machines. Possible isolation_status values: contained,
    uncontained, containment_requested, uncontainment_requested, contain_failed, uncontain_failed,
    unknown. Note: File hash can be in SHA1 or SHA256 format. This action runs on
    the following Google SecOps entities: Hostname, IP Address, File Hash.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#enrich_entities
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Machine ID
    default_value: ''
    type: string
    description: Specify the ID of the Microsoft Defender for Endpoint machine to
        enrich. If provided, it overrides target entities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/EnrichEntities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "FILEHASH", "ADDRESS"]}'
