name: Create Isolate Machine Task
description: 'Use the "Create Isolate Machine Task" action to create a task that isolates
    an endpoint from the network in Microsoft Defender for Endpoint. This action runs
    on the following Google SecOps entities: IP Address, Hostname.'
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Isolation Type
    default_value: Full
    type: ddl
    optional_values:
    - Full
    - Selective
    description: Isolation type
    is_mandatory: true
-   name: Comment
    default_value: ''
    type: string
    description: Comment why the machine needs to be isolated
    is_mandatory: true
-   name: Machine ID
    default_value: ''
    type: string
    description: Specify the ID of the Microsoft Defender for Endpoint machine to
        isolate. If provided, it overrides target entities.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/CreateIsolateMachineTask_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
