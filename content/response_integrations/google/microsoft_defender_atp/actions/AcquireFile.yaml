name: Acquire File
description: 'Use the "Acquire File" action to acquire a file from an endpoint in
    Microsoft Defender for Endpoint. This action runs on the following Google SecOps
    entities: IP Address, Hostname. Note: Action is running as async, please adjust
    script timeout value in Google SecOps IDE for action, as needed.'
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: File Path
    default_value: ''
    type: string
    description: Specify the absolute path of the file to acquire, for example C:\Windows\win.ini,
        %systemroot%\win.ini or /etc/hostname.
    is_mandatory: true
-   name: Machine ID
    default_value: ''
    type: string
    description: Specify the ID of the Microsoft Defender for Endpoint machine to
        acquire the file from. If provided, it overrides target entities.
    is_mandatory: false
-   name: Comment
    default_value: Acquire File via Google SecOps
    type: string
    description: Specify the comment for the Live Response action.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/AcquireFile_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
