name: Get Machine Vulnerabilities
description: 'Use the Get Machine Vulnerabilities action to list vulnerabilities associated
    with specific machines in Microsoft Defender for Endpoint. Supported Entities:
    IP Address, Hostname.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#get_machine_vulnerabilities
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Severity Filter
    default_value: Critical
    type: multi_choice_parameter
    optional_values:
    - Critical
    - High
    - Medium
    - Low
    description: The severity levels used to filter the returned vulnerabilities.
    is_mandatory: false
-   name: Threat Filter
    default_value: ''
    type: multi_choice_parameter
    optional_values:
    - Associated Active Alert
    - Exploit is available
    - Exploit is verified
    - This exploit is part of an exploit kit
    description: The threat intelligence criteria used to filter the returned vulnerabilities.
    is_mandatory: false
-   name: Sort By
    default_value: Severity
    type: ddl
    optional_values:
    - First Detection Time
    - Severity
    - Update Time
    description: The field used to sort the returned vulnerabilities.
    is_mandatory: false
-   name: Sort Order
    default_value: ASC
    type: ddl
    optional_values:
    - ASC
    - DESC
    description: The order in which the sorted results are displayed.
    is_mandatory: false
-   name: Max Vulnerabilities To Return
    default_value: '100'
    type: string
    description: 'The maximum number of vulnerabilities to return for each entity.
        Maximum: 100.'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_machine_vulnerabilities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: user@google.com
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
