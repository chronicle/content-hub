name: Execute Live Response Command
description: 'Use "Execute Live Response Command" action to execute a live response
    command in Microsoft Defender for Endpoint. Supported Entities: IP Address, Hostname.
    Note: Action is running as async, please adjust script timeout value in Google
    SecOps IDE for action, as needed.'
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Command
    default_value: "{\n     \"type\": \"Command\",\n     \"params\": [\n         \
        \ {\n               \"key\": \"string\",\n               \"value\": \"string\"\
        \n          }\n     ]\n}"
    type: string
    description: 'JSON object that represents the command that needs to be executed.
        More information is available on this page: https://learn.microsoft.com/en-us/defender-endpoint/api/run-live-response'
    is_mandatory: true
-   name: Comment
    default_value: ''
    type: string
    description: Comment that describes the executed command.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/execute_live_response_command_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
