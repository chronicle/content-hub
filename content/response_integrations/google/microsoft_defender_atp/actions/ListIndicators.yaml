name: List Indicators
description: List indicators in Microsoft Defender ATP.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#list_indicators
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Indicators
    default_value: ''
    type: string
    description: Specify a comma-separated list of indicators that you would like
        to retrieve.
    is_mandatory: false
-   name: Indicator Types
    default_value: FileSha1,FileSha256,FileMd5,CertificateThumbprint,IpAddress,DomainName,Url
    type: string
    description: 'Specify a comma-separated list of indicator types that you want
        to retrieve. Possible values: FileSha1, FileSha256, FileMd5, CertificateThumbprint,
        IpAddress, DomainName, Url.'
    is_mandatory: false
-   name: Actions
    default_value: Warn,Block,Audit,Alert,AlertAndBlock,BlockAndRemediate,Allowed
    type: string
    description: 'Specify a comma-separated list of indicator actions that you want
        to use for filtering. Possible values: Warn,Block,Audit,Alert,AlertAndBlock,BlockAndRemediate,Allowed.'
    is_mandatory: false
-   name: Severity
    default_value: Informational,Low,Medium,High
    type: string
    description: 'Specify a comma-separated list of severities that you want to use
        for filtering. Possible values: Informational,Low,Medium,High.'
    is_mandatory: false
-   name: Max Results To Return
    default_value: 50
    type: string
    description: 'Specify how many indicators to return. Default: 50.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_indicators_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
