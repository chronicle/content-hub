name: Update Alert
description: Update Alerts
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#update_alert
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: Microsoft Defender ATP Alert ID to update.
    is_mandatory: true
-   name: Status
    default_value: New
    type: ddl
    optional_values:
    - New
    - InProgress
    - Resolved
    description: Status of the alert
    is_mandatory: false
-   name: Assigned To
    default_value: ''
    type: string
    description: User who is assigned to this alert
    is_mandatory: false
-   name: Classification
    default_value: Unknown
    type: ddl
    optional_values:
    - Unknown
    - FalsePositive
    - TruePositive
    description: Classification to update alert with
    is_mandatory: false
-   name: Determination
    default_value: NotAvailable
    type: ddl
    optional_values:
    - NotAvailable
    - MultiStagedAttack
    - MaliciousUserActivity
    - Malware
    - CompromisedAccount
    - Phishing
    - UnwantedSoftware
    - SecurityTesting
    - LineOfBusinessApplication
    - ConfirmedActivity
    - NotMalicious
    - Other
    description: Determination to update alert with
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
