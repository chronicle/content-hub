name: Submit Entity Indicators
description: 'Submit entities as indicators in Microsoft Defender ATP. Supported entities:
    Filehash, URL, IP Address. Note: only MD5, SHA1 and SHA256 hashes are supported.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#submit_entity_indicators
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Action
    default_value: Block
    type: ddl
    optional_values:
    - Block
    - Audit
    - Block And Remediate
    - Allow
    description: 'Specify the action that needs to be applied to the entities. Note:
        "Block And Remediate" is supported only for filehash entities.'
    is_mandatory: true
-   name: Severity
    default_value: High
    type: ddl
    optional_values:
    - High
    - Medium
    - Low
    - Informational
    description: Specify the severity for the found entities.
    is_mandatory: true
-   name: Application
    default_value: ''
    type: string
    description: Specify an application that is related to the entities.
    is_mandatory: false
-   name: Indicator Alert Title
    default_value: ''
    type: string
    description: Specify what should be the title for the alert, if they are identified
        in the environment.
    is_mandatory: true
-   name: Description
    default_value: Siemplify Remediation
    type: string
    description: Specify the description for the entities.
    is_mandatory: true
-   name: Recommended Action
    default_value: ''
    type: string
    description: Specify what should be the recommended actions for the handling of
        the entities.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["FILEHASH", "ADDRESS", "DestinationURL"]}'
