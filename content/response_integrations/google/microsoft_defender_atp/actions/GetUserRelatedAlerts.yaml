name: Get User Related Alerts
description: 'Use the Get User Related Alerts action to list alerts associated with
    specific users in Microsoft Defender for Endpoint. Supported Entities: User.'
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Max Alerts To Return
    default_value: '100'
    type: string
    description: 'The maximum number of alerts to retrieve for each user. Maximum:
        100.'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_user_related_alerts_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: user@example.com
simulation_data_json: '{"Entities": ["User"]}'
