name: List Alerts
description: Get Alerts
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#list_alerts
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Time Frame
    default_value: '3'
    type: string
    description: Time frame in hours for which to fetch Alerts
    is_mandatory: false
-   name: Status
    default_value: Unknown, New, InProgress, Resolved
    type: string
    description: Statuses of the alert to look for. Comma-separated string
    is_mandatory: false
-   name: Severity
    default_value: ''
    type: string
    description: Severities of the alert to look for. Comma-separated string.
    is_mandatory: false
-   name: Category
    default_value: ''
    type: string
    description: Categories of the alert to look for. Comma-separated string.
    is_mandatory: false
-   name: Incident ID
    default_value: ''
    type: string
    description: Microsoft Defender Incident ID for which you want to find related
        alerts.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_alerts_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
