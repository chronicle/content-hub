name: Get File Related Machines
description: 'Get File Related Machines. Note: For this action only SHA1 is supported'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-defender-atp#get_file_related_machines
integration_identifier: MicrosoftDefenderATP
parameters:
-   name: Machine Name
    default_value: ''
    type: string
    description: Full Machine Name to look for
    is_mandatory: false
-   name: Machine IP Address
    default_value: ''
    type: string
    description: Machine IP Address to look for
    is_mandatory: false
-   name: Machine Risk Score
    default_value: None, Low, Medium, High
    type: string
    description: Machine risk score to look for. Comma-separated string.
    is_mandatory: false
-   name: Machine Health Status
    default_value: Active, Inactive, ImpairedCommunication, NoSensorData, NoSensorDataImpairedCommunication
    type: string
    description: Machine health status to look for. Comma-separated string
    is_mandatory: false
-   name: Machine OS Platform
    default_value: ''
    type: string
    description: Machine OS platform to look for.
    is_mandatory: false
-   name: RBAC Group ID
    default_value: ''
    type: string
    description: RBAC Group ID to look for.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_file_related_machines_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: klim.lyapin@siemplify.co
simulation_data_json: '{"Entities": ["FILEHASH"]}'
