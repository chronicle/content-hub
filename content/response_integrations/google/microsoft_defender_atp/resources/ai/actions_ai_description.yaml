Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname, IP Address, and File Hash entities using Microsoft Defender
    ATP. This action retrieves detailed machine information (for hosts and IPs) or
    file metadata and prevalence (for hashes) to provide security context within the
    SOAR platform.


    ### Flow Description

    1. Connects to the Microsoft Defender ATP API using the provided integration credentials.

    2. Iterates through the target entities in the case.

    3. For Hostname and IP Address entities, queries the Defender API (`/api/machines`)
    for matching machine records.

    4. For File Hash entities, queries the Defender API (`/api/files/{file_hash}`)
    for file information.

    5. If data is found, updates the entities' additional properties with the retrieved
    data, marks them as enriched, and attaches raw JSON and formatted data tables
    to the action results.

    6. Updates the enriched entities in the SOAR platform.


    ### Additional Notes

    File hash can be in SHA1 or SHA256 format.
  ai_short_description: >-
    Enriches Hostname, IP Address, and File Hash entities using Microsoft Defender
    ATP by retrieving detailed machine information or file metadata and prevalence.
