Execute Live Response Command:
  ai_description: >-
    ### General Description

    Executes a live response command on remote endpoints using Microsoft Defender
    for Endpoint. This action allows security analysts to perform real-time investigations
    and remediation tasks directly on a host, such as running scripts, collecting
    files, or listing processes. It operates asynchronously, polling the Microsoft
    Defender API until the command completes or times out.


    ### Flow Description

    1. **Entity Filtering:** The action identifies suitable `ADDRESS` (IP) and `HOSTNAME`
    entities from the input.

    2. **Machine Resolution:** For each entity, the action queries Microsoft Defender
    for Endpoint to find the corresponding Machine ID.

    3. **Command Initiation:** It sends the specified JSON command to the Microsoft
    Defender API for each resolved machine.

    4. **Asynchronous Polling:** The action enters an 'In Progress' state, periodically
    checking the status of the command execution on the remote endpoints.

    5. **Result Processing:** Once a command finishes:
        * If the command was `GetFile` and successful, the action downloads the file
    content and attaches it directly to the Google SecOps action results.
        * For other commands, it captures the execution output and status.
    6. **Finalization:** The action summarizes the success, failure, or 'not found'
    status for all processed entities and returns the raw JSON results.


    ### Additional Notes

    * This action is **asynchronous**. Ensure the script timeout in the Google SecOps
    IDE is configured to allow enough time for remote command execution and polling.

    * If multiple machines are found for a single entity (e.g., a hostname that has
    changed IPs), the action targets the most recently seen machine.
  ai_short_description: >-
    Executes a live response command on remote endpoints using Microsoft Defender
    for Endpoint, allowing for real-time investigation and remediation tasks.
