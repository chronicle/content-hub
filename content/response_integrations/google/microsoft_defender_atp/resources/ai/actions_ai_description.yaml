    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes GET requests to the Microsoft Defender ATP API to fetch machine
      and file data (fetches_data=true). It does not mutate external data. It updates
      the entities with the retrieved data using `siemplify.update_entities` (can_update_entities=true).
      It does not create insights, modify alert data, or create case comments.
  entity_usage:
