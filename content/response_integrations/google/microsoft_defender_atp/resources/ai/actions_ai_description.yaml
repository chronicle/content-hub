"Create Stop And Quarantine File Specific Machine Task":
  ai_description: >-
    ### General Description

    This action creates a 'Stop and Quarantine File' task in Microsoft Defender ATP
    for specific machines identified by Hostname or IP Address entities. It is used
    to remediate threats by stopping a malicious process and isolating the associated
    file based on its SHA1 hash.


    ### Flow Description

    1. **Initialization**: The action extracts integration configuration (API credentials)
    and action parameters (SHA1 hash and comment).

    2. **Machine Lookup**: For each Hostname or IP Address entity, the action queries
    Microsoft Defender ATP to find the matching machine ID.

    3. **Task Creation**: Once a machine is identified, the action sends a POST request
    to the Microsoft Defender ATP API to initiate the 'StopAndQuarantineFile' task.

    4. **Result Processing**: The action collects the task IDs and statuses for all
    successful requests.

    5. **Output**: It generates a data table and a JSON result containing the details
    of the created tasks in Google SecOps.


    ### Additional Notes

    * The action specifically requires a **SHA1** hash; other hash types (MD5, SHA256)
    are not supported by this specific API endpoint.

    * If multiple machines are found for a single entity (e.g., an IP address shared
    by multiple devices over time), the action targets the most recently seen machine.
  ai_short_description: >-
    Creates a 'Stop and Quarantine File' task in Microsoft Defender ATP for specific
    machines identified by Hostname or IP Address entities.
  capabilities:
    can_create_case_comments: false
