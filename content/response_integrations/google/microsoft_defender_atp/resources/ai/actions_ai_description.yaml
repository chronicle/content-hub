Get Machine Logon Users:
  ai_description: "### General Description\nThe **Get Machine Logon Users** action\
    \ retrieves a list of users who have logged onto a specific machine (identified\
    \ by Hostname or IP Address) using Microsoft Defender ATP. This action provides\
    \ critical visibility for forensic investigations by identifying which accounts\
    \ have accessed a specific endpoint, including details on logon types and timestamps.\n\
    \n### Flow Description\n1. **Entity Identification**: The action iterates through\
    \ the target entities in the current context, specifically looking for Hostnames\
    \ and IP Addresses.\n2. **Machine Lookup**: \n    - For **Hostname** entities,\
    \ it makes a GET request to the Microsoft Defender ATP API to search for machines\
    \ whose DNS name matches or starts with the entity identifier.\n    - For **IP\
    \ Address** entities, it makes a GET request to search for machines associated\
    \ with that specific IP address.\n3. **User Retrieval**: For the identified machine\
    \ (selecting the most recently seen if multiple exist), the action calls the Microsoft\
    \ Defender ATP API to fetch all recorded logon users.\n4. **Data Enrichment**:\
    \ The retrieved user data (including account name, domain, logon types, and first/last\
    \ seen timestamps) is attached to the entity as a JSON object and a formatted\
    \ data table for display in the SOAR interface.\n\n### Additional Notes\n- If\
    \ multiple machines are found for a single entity, the action processes the one\
    \ with the most recent 'last seen' timestamp.\n- Unsupported entity types are\
    \ logged and skipped without failing the entire action."
