Create Isolate Machine Task:
  ai_description: >-
    ### General Description

    Initiates a network isolation task for machines in Microsoft Defender ATP based
    on Hostname or IP Address entities. This action is used to contain potentially
    compromised assets by restricting their network communication through the Defender
    security agent.


    ### Flow Description

    1. Iterates over the target entities provided in the action.

    2. Checks if the entity is a Hostname or IP Address.

    3. Queries Microsoft Defender ATP to find the corresponding machine ID using the
    entity identifier.

    4. If a machine is found, sends a POST request to the Defender ATP API to initiate
    the isolation task with the specified 'Isolation Type' and 'Comment'.

    5. Captures the Task ID and status, providing a summary table and JSON result
    of all successfully created isolation tasks.


    ### Additional Notes

    The action requires valid Microsoft Defender ATP credentials and appropriate permissions
    to isolate machines.
  ai_short_description: >-
    Initiates a network isolation task for machines in Microsoft Defender ATP based
    on Hostname or IP Address entities to contain potentially compromised assets.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a network isolation task on the target machine in Microsoft Defender
      ATP.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Microsoft Defender ATP API to isolate
      a machine, which mutates external data. It does not fetch data for enrichment
      purposes, mutate internal data, update entities, create insights, modify alert
      data, or create case comments.
