Ping:
  ai_description: >-
    ### General Description

    Verifies connectivity to the Microsoft Defender ATP instance. This action validates
    the provided credentials and configuration by attempting to authenticate and perform
    a basic API call to retrieve a single alert. It is primarily used during the initial
    setup or troubleshooting of the integration to ensure that the Google SecOps environment
    can communicate with the Microsoft Defender ATP API.


    ### Flow Description

    1. **Manager Initialization:** The action initializes the `MicrosoftDefenderATPManager`
    using the integration's configuration parameters (e.g., Client ID, Secret, Tenant
    ID).

    2. **Connectivity Test:** It calls the `test_connectivity` method, which performs
    a GET request to the `/api/alerts` or `/v1.0/security/alerts_v2` endpoint with
    a limit of 1 result.

    3. **Result Handling:** If the request is successful, it returns a completion
    status indicating successful connectivity. If an error occurs (e.g., authentication
    failure or network timeout), it catches the exception and returns a failure status
    with the error details.


    ### Additional Notes

    This action does not require any specific entities or alerts to run and is intended
    solely for diagnostic purposes.
