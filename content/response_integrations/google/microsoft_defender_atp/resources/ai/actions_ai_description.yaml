Run Advanced Hunting Query:
  ai_description: >-
    ### General Description

    Executes an Advanced Hunting query using Kusto Query Language (KQL) against the
    Microsoft Defender ATP (Endpoint) API. This action allows security analysts to
    proactively search for threats across various telemetry data types such as process
    creations, network connections, and file modifications stored in the Defender
    platform.


    ### Flow Description

    1. Initializes the Microsoft Defender ATP Manager using the provided credentials
    to obtain an OAuth2 access token.

    2. Sanitizes the input query string by replacing carriage returns and newlines
    with spaces to ensure API compatibility.

    3. Sends the sanitized query via a POST request to the `/api/advancedqueries/run`
    endpoint.

    4. If results are found, they are converted into a JSON format and attached to
    the action's result.

    5. Generates a CSV-formatted data table titled "Advanced Hunting Query Results:"
    and adds it to the case for visibility.


    ### Additional Notes

    The action returns a success status if the query executes without errors, even
    if no rows are returned by the query itself.
