Delete Entity Indicators:
  ai_description: >-
    ### General Description

    Deletes entity indicators from Microsoft Defender ATP. This action allows security
    analysts to remove threat intelligence indicators (IOCs) previously submitted
    to the Microsoft Defender for Endpoint platform. It supports IP Address, URL,
    and File Hash entities.


    ### Flow Description

    1. Retrieves integration configuration and identifies supported entities (ADDRESS,
    FILEHASH, URL) from the target entities list.

    2. Queries the Microsoft Defender ATP API (`/api/indicators`) to fetch all existing
    indicators associated with the identifiers of the suitable entities.

    3. Validates File Hash entities to ensure the hash length corresponds to MD5,
    SHA1, or SHA256.

    4. Iterates through the suitable entities and matches them against the retrieved
    indicators.

    5. Sends a DELETE request to the Microsoft Defender ATP API (`/api/indicators/{indicator_id}`)
    for every match found.

    6. Returns a summary of successfully deleted, failed, and not found entities.


    ### Additional Notes

    - Only MD5, SHA1, and SHA256 hashes are supported for deletion. Other hash types
    will be skipped.
