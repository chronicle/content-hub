Submit Entity Indicators:
  ai_description: >-
    ### General Description

    Submits entities (IP Addresses, URLs, and File Hashes) as indicators to Microsoft
    Defender ATP. This allows security teams to automate the blocking, auditing, or
    remediation of specific threats across their managed endpoints.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Filters the target entities to identify supported types: IP Addresses, File
    Hashes, and URLs.

    3. Queries the Microsoft Defender ATP API to retrieve existing indicators for
    the target entities to prevent duplicate submissions.

    4. Iterates through each supported entity and determines its specific indicator
    type (e.g., FileSha256, IpAddress, DomainName, or Url).

    5. For entities not already present as indicators, submits them to Microsoft Defender
    ATP with the configured action, severity, and metadata.

    6. Aggregates the results and provides a summary message indicating which entities
    were successfully submitted, which already existed, and any errors encountered.


    ### Additional Notes

    - Only MD5, SHA1, and SHA256 hashes are supported for FileHash entities.

    - The 'Block And Remediate' action is exclusively supported for FileHash entities.

    - The action requires appropriate permissions in Microsoft Defender ATP to create
    indicators.
