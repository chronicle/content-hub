Wait Task Status:
  ai_description: "### General Description\nMonitors the status of one or more machine\
    \ tasks in Microsoft Defender ATP. This action is designed to work asynchronously,\
    \ polling the external API until all specified tasks reach a terminal state (e.g.,\
    \ Succeeded, Failed, or Cancelled). It is typically used in playbooks following\
    \ actions that initiate machine tasks (like isolation or AV scans) to ensure those\
    \ tasks complete before proceeding.\n\n### Flow Description\n1. **Initialization**:\
    \ Retrieves integration credentials and the list of Task IDs from the action parameters.\n\
    2. **Task Retrieval**: Iterates through the provided Task IDs and queries the\
    \ Microsoft Defender ATP API for the current status of each.\n3. **Status Evaluation**:\
    \ \n    - If a task is still 'Pending' or 'InProgress', it is added to a list\
    \ of active tasks.\n    - If a task has 'Succeeded', it is added to a list of\
    \ completed tasks.\n    - If a task reaches a terminal state that is not 'Succeeded'\
    \ (e.g., 'Failed', 'TimeOut'), the action immediately ends with a failure status.\n\
    4. **Execution State Management**: \n    - If there are still active tasks, the\
    \ action returns `EXECUTION_STATE_INPROGRESS`.\n    - If all tasks have finished\
    \ successfully, the action returns `EXECUTION_STATE_COMPLETED` with a success\
    \ result.\n5. **Output**: Upon completion, it generates a data table and JSON\
    \ result containing the final status details for the monitored tasks.\n\n### Additional\
    \ Notes\n- This is an **Async** action. If any tasks are still in 'Pending' or\
    \ 'InProgress' status, the action will return an 'In Progress' state, signaling\
    \ the SOAR platform to re-run the check after a delay.\n- If any single task fails,\
    \ times out, or is cancelled, the action will terminate and report a failure result\
    \ for the overall check."
  ai_short_description: >-
    Monitors the status of one or more machine tasks in Microsoft Defender ATP until
    they reach a terminal state.
