Create Run Antivirus Scan Task:
  ai_description: >-
    ### General Description

    Initiates an antivirus scan on machines associated with Hostname or IP Address
    entities using Microsoft Defender ATP. This action allows security analysts to
    remotely trigger either a 'Full' or 'Quick' scan on a target endpoint to identify
    and remediate potential threats.


    ### Flow Description

    1. Retrieves the scan type (Full/Quick) and the mandatory justification comment
    from the action parameters.

    2. Validates that the provided scan type is supported by the Microsoft Defender
    ATP API.

    3. Searches for the machine in the external system using the entity's identifier
    via a GET request to the Defender ATP API.

    4. If a machine is found, sends a POST request to the Defender ATP API to create
    a 'RunAntiVirusScan' task for that specific machine.

    5. Captures the created task details, updates the action results, and generates
    a data table on the case wall for visibility.


    ### Additional Notes

    The action requires the machine to be actively managed by Microsoft Defender ATP.
    If multiple machines match the entity identifier, the action will trigger the
    scan on the most recently seen machine.
