Search Hash:
  ai_description: >-
    ### General Description

    Searches for a file hash in JoeSandbox records to retrieve existing analysis information.
    This action enriches the entity with the analysis data, attaches the PDF report,
    and generates an insight if the hash is found to be suspicious.


    ### Flow Description

    1. Iterates over the target entities and filters for `FILEHASH` entity types.

    2. Makes an API call to JoeSandbox (`api/v2/analysis/search`) to search for the
    hash.

    3. If a match is found, makes an API call (`api/v2/analysis/info`) to retrieve
    the analysis information.

    4. Makes an API call (`api/v2/analysis/download`) to download the full analysis
    report in PDF format.

    5. Attaches the PDF report and a web link to the entity within Google SecOps.

    6. Enriches the entity's additional properties with the flattened analysis data.

    7. Evaluates the analysis results; if the detection is suspicious, marks the entity
    as suspicious and creates an insight.

    8. Updates the entities in the platform and returns the analysis data as a JSON
    result.


    ### Additional Notes

    - The action will skip an entity and log an error if an exception occurs during
    processing.

    - If the daily API submission limit (20 per day) is reached, the action will raise
    a `JoeSandboxLimitManagerError` and halt execution.

    - The PDF attachment cannot exceed 3 MB; if it does, the attachment process will
    fail gracefully and log an error.
  ai_short_description: >-
    Searches for a file hash in JoeSandbox to retrieve existing analysis reports,
    enrich the entity, and attach the PDF report and insights if the hash is deemed
    suspicious.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
