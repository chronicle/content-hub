Detonate File:
  ai_description: >-
    ### General Description

    Submits one or more files to Joe Sandbox for detonation and analysis. The action
    uploads the files, waits for the analysis to complete asynchronously, and retrieves
    the resulting scan reports.


    ### Flow Description

    1. Parses the provided file paths and comments from the action parameters.

    2. Iterates through the file paths and uploads each file to Joe Sandbox via the
    `api/v2/analysis/submit` API endpoint.

    3. Enters an asynchronous loop, periodically checking the analysis status using
    the `api/v2/analysis/info` API endpoint.

    4. Once the analysis is complete, downloads the report in the specified format
    using the `api/v2/analysis/download` API endpoint and attaches it to the case.

    5. Evaluates the analysis results; if a file is detected as suspicious or malicious,
    it creates a case insight.

    6. Returns the analysis information as JSON results and provides a web link to
    the full report.


    ### Additional Notes

    This action requires a Pro level account for Joe Sandbox. It operates asynchronously
    to accommodate the time required for sandbox detonation.
  ai_short_description: >-
    Submits files to Joe Sandbox for detonation, waits for the analysis to complete,
    and retrieves the resulting threat reports and insights.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads files to Joe Sandbox to initiate a new detonation and analysis task.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action uploads a file to an external sandbox (mutating external data by
      creating an analysis task) and fetches the resulting analysis data. It creates
      case insights if the file is found to be suspicious, but does not update entities
      or modify alert data.
