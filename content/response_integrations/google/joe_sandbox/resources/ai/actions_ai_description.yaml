Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Joe Sandbox API to ensure the service is reachable and
    operational.


    ### Flow Description

    1. Initializes the Joe Sandbox manager using the provided integration configuration
    credentials.

    2. Makes an API call to the `/api/v2/server/online` endpoint to check the server
    status.

    3. Evaluates the response and returns a success message if the server is online,
    or a failure message if it is in maintenance mode.


    ### Additional Notes

    This action is typically used to verify the integration configuration and ensure
    the Joe Sandbox service is available before running other actions.
