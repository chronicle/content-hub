Search Url:
  ai_description: >-
    ### General Description

    Searches for URL entities in JoeSandbox records to retrieve existing analysis
    information. It downloads the analysis report, enriches the entity, and flags
    it if suspicious.


    ### Flow Description

    1. Iterates over the target entities and filters for URL entities.

    2. Calls the JoeSandbox API (`api/v2/analysis/search`) to search for existing
    analysis records matching the URL.

    3. If a record is found, retrieves the detailed analysis information (`api/v2/analysis/info`).

    4. Downloads the analysis report as a PDF (`api/v2/analysis/download`) and attaches
    it to the entity in the SecOps platform.

    5. Adds a web link to the JoeSandbox report to the entity.

    6. Enriches the entity's additional properties with the flattened analysis data
    and marks it as enriched.

    7. Evaluates the detection status; if found to be suspicious or malicious, marks
    the entity as suspicious and creates an insight.

    8. Updates the modified entities in the platform and returns the JSON results.


    ### Additional Notes

    - The action only searches for existing analyses and does not submit new URLs
    for analysis.

    - Attachments larger than 3 MB may fail to attach to the entity.
