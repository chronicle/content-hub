    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entity properties, adds a PDF report attachment, adds a web link, and
      creates an insight if the hash is found to be suspicious.
    reasoning: >-
      The action fetches data by making API requests to JoeSandbox to search for a
      hash and retrieve analysis info. It does not mutate external data. It mutates
      internal data by updating entities, adding attachments, adding web links, and
