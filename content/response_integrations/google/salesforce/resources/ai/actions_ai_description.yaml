Update Case:
  ai_description: >-
    ### General Description

    Updates an existing case in Salesforce with new details such as subject, status,
    description, origin, priority, and type. This action modifies the state of a record
    in the external Salesforce system.


    ### Flow Description

    1. Initializes the Salesforce integration using the provided credentials.

    2. Retrieves the action parameters including the Case Number and the fields to
    update.

    3. Makes an API call to Salesforce to retrieve the internal Case ID associated
    with the provided Case Number.

    4. Makes an API call to Salesforce to update the case with the new field values.

    5. Returns a success message upon completion.


    ### Additional Notes

    Ensure that the provided Case Number exists in Salesforce before running this
    action.
