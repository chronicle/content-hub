Add Comment:
  ai_description: >-
    ### General Description

    Adds a comment to a specific case in Salesforce. This action allows analysts to
    append notes or updates to an existing Salesforce case directly from the SOAR
    platform.


    ### Flow Description

    1. Retrieves the Case Number, Title, and Body from the action parameters.

    2. Queries Salesforce via API to retrieve the internal Case ID associated with
    the provided Case Number.

    3. Makes a POST API call to Salesforce to create a new `CaseComment` linked to
    the retrieved Case ID, combining the title and body.

    4. Returns a success message upon completion.


    ### Additional Notes

    Requires valid Salesforce credentials and permissions to read cases and create
    case comments.
  ai_short_description: >-
    Adds a comment to a specific case in Salesforce.
