    Retrieves a list of all existing cases from Salesforce. This action connects to
    the Salesforce instance and fetches case records along with their standard properties,
    returning the information for use within the SOAR platform.


    ### Flow Description

    1. Initializes the connection to the Salesforce API using the provided integration
    configuration credentials.

    2. Executes a SOQL query to fetch all available cases and their associated properties
    (e.g., ID, CaseNumber, Subject, Description, Status, Priority).

    3. Formats the retrieved case data into a CSV structure and attaches it to the
    action's results as a data table.

    4. Returns the raw case data as a JSON object and completes the action execution.


    ### Additional Notes

