Create Case:
  ai_description: >-
    ### General Description

    Creates a new case in Salesforce using the provided details such as subject, status,
    description, origin, priority, and type. This action initiates a state change
    on the external Salesforce platform by generating a new record and returns the
    resulting case number.


    ### Flow Description

    1. Retrieves integration configuration parameters (API Root, Username, Password,
    Token, Verify SSL) to initialize the `SalesforceManager`.

    2. Extracts action-specific parameters including Subject, Status, Description,
    Origin, Priority, and Type.

    3. Makes an API call to Salesforce to create a new case with the specified attributes.

    4. Retrieves the newly created case details from Salesforce using its ID.

    5. Returns the `CaseNumber` as the result and outputs a success message.


    ### Additional Notes

    Ensure that the provided values for Status, Origin, Priority, and Type match the
    valid picklist values configured in your Salesforce instance to avoid API errors.
