    ### Flow Description

    1. Retrieves the search query from the action parameters.

    2. Connects to the Salesforce API using the provided integration credentials.

    3. Executes a SOSL search query to find records matching the specified pattern.

    4. Retrieves detailed information for the matched records using SOQL queries.

    5. Groups the results by record type (e.g., Cases, Contacts) and constructs CSV
    data tables for each group.

    6. Attaches the data tables and the raw JSON results to the action output.


    ### Additional Notes

    The action requires a valid Salesforce API connection and appropriate permissions
    to search across the targeted objects.
