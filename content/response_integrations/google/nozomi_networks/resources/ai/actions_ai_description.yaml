    reasoning: >-
      The action fetches contextual metadata (such as OS, MAC address, vendor, firmware
      version) for IP and Hostname entities from Nozomi Networks. This aligns with
      the 'Enrich Asset' expected outcome. It does not return threat intelligence
      or reputation, so it is not 'Enrich IOC'. It does not perform any containment,
