Run a CLI Command:
  ai_description: >-
    ### General Description

    Executes a specified CLI command on a Nozomi Networks device. This action allows
    users to run arbitrary commands directly on the appliance via its API.


    ### Flow Description

    1. Extracts the provided CLI command from the action parameters.

    2. Initiates an HTTP POST request to the Nozomi Networks API (`/api/open/cli`)
    containing the command payload.

    3. Validates the API response to ensure the command was accepted and executed
    successfully.

    4. Returns a success message indicating the command execution status.


    ### Additional Notes

    The Nozomi API does not provide validation for executed CLI commands; it is up
    to the user to ensure that the provided CLI command is correct and safe to run.
    This action does not interact with or process any SecOps entities.
