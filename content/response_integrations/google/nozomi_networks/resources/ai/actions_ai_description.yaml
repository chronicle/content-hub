Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Nozomi Networks instance using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API URL, Username,
    Password, Verify SSL, CA Certificate File).

    2. Initializes the Nozomi Networks manager to establish a session.

    3. Makes a GET request to the test connectivity endpoint (`/api/open/query/do?query=node_cpes
    | head 5`) to verify the connection.

    4. Returns a successful execution state if the connection is established, or fails
    if an error occurs.


    ### Additional Notes

    This action relies entirely on integration-level configuration parameters and
    does not require any action-specific inputs.
