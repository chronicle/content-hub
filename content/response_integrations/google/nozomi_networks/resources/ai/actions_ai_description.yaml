List Vulnerabilities:
  ai_description: >-
    ### General Description

    Lists vulnerabilities discovered by a Nozomi Networks device based on provided
    input parameters such as IP address, CVE score, and CVE ID.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Validates the provided CVE score to ensure it falls within the 0-10 range.

    3. Initializes the Nozomi Networks manager with the provided credentials and API
    URL.

    4. Makes a GET request to the Nozomi Networks API to fetch vulnerabilities matching
    the specified criteria (IP addresses, CVE score, vulnerability name, CVE IDs,
    record limit, and resolution status).

    5. If vulnerabilities are found, they are formatted and added to the action's
    JSON result and a data table.

    6. Returns the execution status and a summary message.


    ### Additional Notes

    This action does not process Google SecOps entities directly; it relies entirely
    on the provided action input parameters.
