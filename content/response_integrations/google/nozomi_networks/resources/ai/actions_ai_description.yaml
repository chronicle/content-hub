Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities using information from Nozomi Networks
    Guardian. This action retrieves contextual metadata about the asset, such as OS
    version, MAC address, vendor, and firmware version, and attaches it to the entity's
    additional properties.


    ### Flow Description

    1. Initializes the connection to the Nozomi Networks API.

    2. Iterates through the provided Hostname and IP Address entities.

    3. For each entity, makes an API call (`GET /api/open/query/do?query=nodes`) to
    fetch node information from Nozomi Networks.

    4. If multiple matches are found, selects the most recent match based on the last
    activity time.

    5. Extracts the enrichment data, including any additional fields specified in
    the parameters.

    6. Updates the entity's additional properties and marks it as enriched.

    7. Returns the raw node data as a JSON result.


    ### Additional Notes

    If no information is found for an entity in Nozomi Networks, the entity is skipped
    and a message is added to the output.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by retrieving contextual asset metadata
    from Nozomi Networks Guardian.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from Nozomi Networks using a GET request to retrieve
      node information. It does not mutate external data. It updates the entities
      in Google SecOps with the fetched enrichment data by calling `siemplify.update_entities`.
      It does not create insights, modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
