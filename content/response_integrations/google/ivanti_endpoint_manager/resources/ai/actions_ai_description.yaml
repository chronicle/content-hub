Execute Task:
  ai_description: >-
    ### General Description

    Executes a specified task or package on target endpoints using Ivanti Endpoint
    Manager. This action allows analysts to deploy packages or run tasks on machines
    associated with the provided entities (Hostname, IP Address, or MAC Address).


    ### Flow Description

    1. Extracts action parameters including the task name, delivery method, package,
    and execution preferences.

    2. Filters the target entities to include only supported types (Hostname, IP Address,
    MAC Address).

    3. Queries Ivanti Endpoint Manager via the `/MBSDKService/MsgSDK.asmx/ListMachines`
    endpoint to find matching machines for the provided entities.

    4. Creates a new task in Ivanti Endpoint Manager by calling the `/MBSDKService/MsgSDK.asmx/CreateTask`
    endpoint with the specified delivery method and package.

    5. Adds the identified devices to the newly created task using the `/MBSDKService/MsgSDK.asmx/AddDeviceToScheduledTask`
    endpoint.

    6. Starts the task execution by calling the `/MBSDKService/MsgSDK.asmx/StartTaskNow`
    endpoint.

    7. If the "Only Initiate" parameter is false, the action runs asynchronously,
    periodically checking the task status via the `/MBSDKService/MsgSDK.asmx/GetTaskMachineStatus`
    endpoint until completion or timeout.

    8. Returns the execution results and task status as JSON data.


    ### Additional Notes

    This action can run asynchronously. If "Only Initiate" is set to false, ensure
    that the script timeout value in the IDE is adjusted appropriately to allow the
    task enough time to complete on the endpoints.
  ai_short_description: >-
    Executes a specified task or package on target endpoints using Ivanti Endpoint
    Manager.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new task, adds devices to it, and starts the task execution in Ivanti
      Endpoint Manager.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes API calls to Ivanti Endpoint Manager to create a task, add
      devices to it, and start the task, which mutates external data. It does not
      fetch contextual enrichment data, update internal entities, or create insights.
