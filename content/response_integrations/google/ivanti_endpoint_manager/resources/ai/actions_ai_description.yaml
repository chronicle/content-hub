Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP Address, Hostname, and MAC Address entities using information from
    Ivanti Endpoint Manager. This action retrieves contextual metadata about endpoints,
    such as OS version, IP, MAC address, and last login details, to provide better
    visibility into the assets involved in an alert.


    ### Flow Description

    1. Extracts configuration and action parameters, including the optional custom
    column set and insight creation flag.

    2. Filters the target entities to include only supported types (Address, Hostname,
    and MAC Address).

    3. Validates the provided custom column set against Ivanti Endpoint Manager, if
    specified.

    4. Queries Ivanti Endpoint Manager to retrieve machine records matching the identifiers
    of the filtered entities.

    5. If a custom column set is provided, fetches additional detailed machine data
    for each matched endpoint.

    6. Maps the retrieved machine data back to the corresponding entities.

    7. Enriches the entities with the retrieved data, marks them as enriched, and
    updates them in the platform.

    8. Optionally creates a case insight containing the general information of the
    successfully enriched endpoints.

    9. Returns a JSON result containing the enriched data and a summary message.


    ### Additional Notes

    Supported entities are IP Address, Hostname, and MAC Address. If a custom column
    set is specified but invalid, the action will fail.
  ai_short_description: >-
    Enriches IP Address, Hostname, and MAC Address entities by retrieving machine
    details and contextual metadata from Ivanti Endpoint Manager.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches machine data from Ivanti Endpoint Manager via HTTP GET requests.
      It does not mutate external data. It updates internal entities with the fetched
      data using `siemplify.update_entities` and creates case insights using `siemplify.create_case_insight`.
