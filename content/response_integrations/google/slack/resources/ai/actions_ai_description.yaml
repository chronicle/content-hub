Get User Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a Slack user based on provided search criteria.
    This action allows searching for users by their Email, Real Name, or Slack User
    ID. It is a standalone utility that does not operate on Google SecOps entities
    but instead uses direct input parameters to query the Slack API.


    ### Flow Description

    1. **Initialization**: The action initializes the Slack manager using the provided
    API token from the integration configuration.

    2. **Search Execution**:
        * **Email**: Performs a lookup by email via the Slack API (`users.lookupByEmail`)
    to find the User ID, then fetches the full user profile (`users.info`).
        * **Real Name**: Retrieves the full user list from the Slack workspace (`users.list`)
    and filters for matches locally. If multiple matches are found, it returns a list
    of all matching users; if exactly one is found, it returns specific details.
        * **User ID**: Directly fetches the user profile using the provided Slack
    User ID (`users.info`).
    3. **Output**: The action populates the execution results with raw JSON data and
    creates a data table containing detailed user attributes such as ID, Team ID,
    Name, Real Name, Timezone, and Admin status.


    ### Additional Notes

    * This action does not interact with or enrich existing Google SecOps entities.

    * If 'Real Name' is used and multiple users share the same name, the action will
    return a list of all matches in the JSON result.
  ai_short_description: >-
