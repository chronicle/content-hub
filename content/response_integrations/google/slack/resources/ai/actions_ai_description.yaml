Wait For Reply With Webhook:
  ai_description: >-
    ### General Description

    This action asynchronously waits for and retrieves a user's reply to a message
    sent via a webhook. It is typically used in an asynchronous workflow following
    a message-sending action. The action periodically polls a specified webhook endpoint
    to check if the user has provided a response. Because it is an asynchronous action,
    it will remain in an 'In Progress' state until either a response is detected or
    the defined timeout threshold is reached.


    ### Flow Description

    1. **Initialization:** The action retrieves the mandatory Webhook Token UUID parameter
    and integration configurations.

    2. **Connectivity Check:** It validates connectivity to the Slack service.

    3. **Data Retrieval:** The action performs a GET request to the webhook service
    using the provided UUID to check for any submitted data or replies.

    4. **Status Evaluation:**
        - If a reply is found, the action completes successfully and returns the response
    content as JSON.
        - If no reply is found and the global timeout has not been reached, the action
    sets its state to 'In Progress' to be retried in the next cycle.
        - If the global timeout is reached without a response, the action completes
    with a message indicating the timeout occurred.

    ### Additional Notes

    - **Asynchronous Execution:** This action is designed to run asynchronously. Ensure
    that the action timeout in the Google SecOps IDE is adjusted to allow sufficient
    time for a user to respond.

    - **Entity Support:** This action does not run on Google SecOps entities.
  ai_short_description: >-
    Asynchronously waits for and retrieves a user's reply to a message sent via a
    webhook by periodically polling the specified webhook endpoint.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
