Ask Question:
  ai_description: >-
    ### General Description

    Sends an interactive question to a specified Slack channel or user. This action
    posts a message containing the provided question along with 'Yes' and 'No' buttons
    to facilitate quick responses from Slack users. Note that this action is marked
    for deprecation in future versions of the integration in favor of actions providing
    enhanced functionality.


    ### Flow Description

    1. **Initialization**: The action initializes the Slack manager using the provided
    API token from the integration configuration.

    2. **Parameter Extraction**: It retrieves the `Channel` and `Question` parameters
    provided by the user.

    3. **API Interaction**: The action calls the Slack API's `chat.postMessage` method,
    passing the channel, question text, and predefined interactive button attachments.

    4. **Result Handling**: If the message is sent successfully, the action completes
    with a success status. If an error occurs, it catches the exception and reports
    a failure.


    ### Additional Notes

    - This action is deprecated and should be replaced with newer Slack actions when
    available.

    - The message sent includes predefined interactive attachments (buttons for 'Yes'
    and 'No').
  ai_short_description: >-
    Sends an interactive question with 'Yes' and 'No' buttons to a specified Slack
    channel or user.
