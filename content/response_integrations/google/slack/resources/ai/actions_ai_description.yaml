Upload File:
  ai_description: >-
    ### General Description


    The **Upload File** action allows users to upload files directly from the Google
    SecOps server to a Slack workspace. This is useful for sharing reports, logs,
    or evidence with team members during an investigation. This action does not interact
    with Google SecOps entities.


    ### Flow Description


    1. **Parameter Initialization**: The action retrieves the file name, path, and
    destination channel from the action parameters.

    2. **File Validation**: The script verifies that the file exists at the provided
    path on the SecOps server and that the system has sufficient permissions to read
    it.

    3. **File Upload**: The action calls the Slack API (`files_upload` method) to
    transmit the file to the specified Slack channel or user.

    4. **Result Processing**: If successful, the action retrieves the private download
    URL for the file and adds it as a link in the action results for easy access within
    the SOAR platform.


    ### Additional Notes


    - This action does not process or filter Google SecOps entities.

    - Ensure the Slack bot has the `files:write` permission and is invited to the
    target channel if it is private.
