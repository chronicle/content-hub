Send Message:
  ai_description: >-
    ### General Description

    Sends a message to a Slack channel or a specific user. This action facilitates
    communication with Slack workspaces directly from a playbook. It is designed as
    a utility action and does not operate on Google SecOps entities.


    ### Flow Description

    1. **Initialization**: The action initializes the Slack API client using the provided
    API token.

    2. **Parameter Extraction**: Retrieves the message content and target channels/users
    from the action parameters.

    3. **Target Processing**: Splits the comma-separated 'Channel' input into individual
    targets.

    4. **User Resolution**: For each target, checks if it matches an email format.
    If so, it makes a GET request (`users_lookupByEmail`) to fetch the corresponding
    Slack User ID.

    5. **Message Dispatch**: Sends the message to the resolved User ID or the provided
    channel name using a POST request (`chat_postMessage`).

    6. **Result Reporting**: Aggregates the responses from Slack for each target into
    a JSON result and provides a summary message indicating success or failure.


    ### Additional Notes

    This action does not interact with or update any Google SecOps entities. If an
    email is provided but no matching Slack user is found, the action will attempt
    to treat the email string as a channel ID.
