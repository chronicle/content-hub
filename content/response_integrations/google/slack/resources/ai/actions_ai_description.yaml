Send Interactive Message:
  ai_description: >-
    ### General Description

    Sends an interactive message (using Slack's Block Kit format) to a specified recipient
    and monitors a webhook for the user's response. This action is asynchronous, meaning
    it will send the message and then enter a polling state to check for incoming
    data at a provided Webhook Token UUID. It is particularly useful for workflows
    requiring human-in-the-loop interaction, such as approval processes or data confirmation.


    ### Flow Description

    1. **Initialization:** Extracts integration configuration and action parameters.

    2. **Message Dispatch (Initial Run):** On the first execution, the action resolves
    the recipient's identity (if provided as a Name or Email) and sends the interactive
    'block' message to Slack via the Slack API.

    3. **Response Monitoring (Polling):** The action enters an asynchronous state,
    checking the Webhook service for any incoming requests associated with the specified
    `Webhook Token UUID`.

    4. **Completion:** If a response is detected at the webhook, the action retrieves
    the response content, adds it to the result JSON, and completes successfully.

    5. **Timeout:** If no response is found before the global timeout threshold is
    reached, the action terminates.


    ### Additional Notes

    - **Asynchronous Execution:** This action is designed to run asynchronously. Ensure
    the action timeout in the IDE is adjusted to allow sufficient time for a user
    to respond.

    - **Slack App Setup:** The Slack application used for this integration must be
    configured to allow interactive messages.

    - **Entity Support:** This action does not operate on Google SecOps entities.
  ai_short_description: >-
    Sends an interactive message to a specified Slack recipient and asynchronously
    monitors a webhook for the user's response.
