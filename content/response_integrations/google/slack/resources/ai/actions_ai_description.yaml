Create Channel:
  ai_description: >-
    ### General Description

    Creates a new channel in Slack and optionally invites users to it. This action
    does not operate on Google SecOps entities but instead uses provided parameters
    to define the channel's properties and membership.


    ### Flow Description

    1. **Initialization**: Extracts the Slack API token from the integration configuration
    and the channel details from the action parameters.

    2. **Channel Creation**: Calls the Slack API to create a channel with the specified
    name and privacy setting (public or private).

    3. **User Resolution**: If user emails are provided and user IDs are not, attempts
    to resolve each email to a Slack User ID via the Slack API.

    4. **Invitation**: If user identifiers (IDs or resolved emails) are available,
    invites those users to the newly created channel via the Slack API.

    5. **Result Reporting**: Returns the raw JSON data of the created channel and
    provides a success message indicating the channel name and the number of users
    added.


    ### Additional Notes

    - This action is independent of the entities present in the Google SecOps case.

    - If the 'User IDs' parameter is populated, the 'User Emails' parameter is ignored.
