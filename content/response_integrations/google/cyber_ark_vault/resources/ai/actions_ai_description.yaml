Disable User:
  ai_description: >-
    ### General Description

    Disables a specific user account in CyberArk Vault. This action initiates a state
    change on the external system to prevent the specified user from authenticating
    or accessing resources.


    ### Flow Description

    1. Retrieves the target user's current details from CyberArk Vault via an HTTP
    GET request.

    2. Modifies the user's active status attribute to `False`.

    3. Sends an HTTP PUT request to CyberArk Vault to apply the disabled status.

    4. Returns a success or failure message to the SOAR platform based on the API
    response.


    ### Additional Notes

    The action requires the exact full user name as it exists in CyberArk Vault to
    successfully locate and disable the account.
  ai_short_description: >-
    Disables a specific user account in CyberArk Vault by updating their active status.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the user's active status to False in CyberArk Vault via an HTTP PUT
      request.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PUT request to CyberArk Vault to disable a user, which mutates
      external data. Although it fetches user details initially, it does so strictly
      to facilitate the mutation and does not return contextual enrichment data to
      the SOAR platform. It does not update internal entities, create insights, modify
      alerts, or create case comments.
