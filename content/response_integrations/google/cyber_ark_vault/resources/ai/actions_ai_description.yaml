Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the CyberArk Vault and Password Vault services.


    ### Flow Description

    1. Retrieves integration configuration parameters (such as API roots, credentials,
    and application ID).

    2. Initializes the CyberArk Manager and tests connectivity by attempting to fetch
    the users list via the CyberArk API.

    3. Initializes the Password Vault Manager and tests connectivity by attempting
    to fetch an account from a mock safe and folder via the AIM Web Service API.

    4. Returns a success message if both connections are established without errors.


    ### Additional Notes

    This is a utility action used to verify that the integration is configured correctly
    and can successfully communicate with the CyberArk APIs.
