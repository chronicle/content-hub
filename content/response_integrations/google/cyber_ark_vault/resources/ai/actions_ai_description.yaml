Get Group Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a specific group from CyberArk Vault. This
    action fetches the group's metadata and attaches it to the action results as a
    data table for further analysis or review.


    ### Flow Description

    1. Initializes the connection to CyberArk Vault using the provided integration
    credentials.

    2. Retrieves the `Group Name` parameter provided by the user or playbook.

    3. Makes an HTTP GET request to the CyberArk Vault API to fetch the details of
    the specified group.

    4. If the group is found, the action flattens the JSON response and attaches it
    as a data table to the action results.

    5. If the group is not found, the action returns a failure message.


    ### Additional Notes

    Ensure that the provided group name exactly matches the name as it exists in CyberArk
    Vault.
