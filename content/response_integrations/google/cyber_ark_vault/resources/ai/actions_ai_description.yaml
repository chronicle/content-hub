Enable User:
  ai_description: >-
    ### General Description

    Enables a specific user account in CyberArk Vault. This action interacts with
    the CyberArk Vault API to update the active status of a specified user, restoring
    their access.


    ### Flow Description

    1. Retrieves the target user's current details from CyberArk Vault using the provided
    `User Name` via an HTTP GET request.

    2. Evaluates the user's current active status.

    3. If the user is currently disabled, sends an HTTP PUT request to the CyberArk
    Vault API to update the user's status to active (enabled).

    4. Returns a success or failure message to the SOAR platform based on the API
    response.


    ### Additional Notes

    This action directly modifies the user's status in the external CyberArk Vault
    system. It requires the exact username as it exists in the vault.
