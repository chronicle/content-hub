[project]
name = "GoogleCloudRecommender"
version = "12.0"
description = "Google Cloud Recommender is a service that provides recommendations and insights for using resources on Google Cloud. These recommendations and insights are per-product or per-service, and are generated based on heuristic methods, machine learning, and current resource usage. Currently integration supports insights only from google.iam.policy.Recommender recommender."
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.12.3",
    "environmentcommon",
    "google-api-core==2.19.1",
    "google-api-python-client==2.142.0",
    "google-auth>=2.34.0",
    "google-auth-httplib2==0.2.0",
    "googleapis-common-protos==1.63.2",
    "httplib2==0.22.0",
    "requests==2.32.4",
    "soupsieve==2.6",
    "tipcommon",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-mock>=3.14.1",
    "soar-sdk",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.1.6.1-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"
