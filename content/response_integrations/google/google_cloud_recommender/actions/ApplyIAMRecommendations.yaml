name: Apply IAM Recommendations
description: Apply IAM Recommendations based on provided input. Action works only
    with google.iam.policy.Recommender recommendations.
integration_identifier: GoogleCloudRecommender
parameters:
-   name: IAM Recommendations JSON
    default_value: ''
    type: string
    description: 'Specify the JSON of the recommendation to apply to. JSON can be
        provided as a placeholder from “List Recommendations” or “Get Recommendation”
        actions.


        '
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/apply_iam_recommendations_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities":[]}'
