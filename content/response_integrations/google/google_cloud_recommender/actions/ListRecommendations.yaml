name: List Recommendations
description: 'List available recommendations in the Google Cloud Recommender service.
    Note 1: This action doesn’t run on Chronicle SOAR entities. Note 2: Currently
    action returns insights only from google.iam.policy.Recommender recommender.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-recommender#list_recommendations
integration_identifier: GoogleCloudRecommender
parameters:
-   name: Recommendation Filter
    default_value: ''
    type: string
    description: Specify the filter to fetch the recommendations for. Parameter expects
        a string of a format "<projects or organizations>/<project or organization
        name or id>" or "//cloudresourcemanager.googleapis.com/<projects or organizations>/<project
        or organization name or id>" for which to fetch the recommendations for. If
        nothing is provided - action will take the project id from the service account
        configured.
    is_mandatory: false
-   name: Recommendation Location
    default_value: global
    type: string
    description: Specify the GCP location to fetch recommendations for.
    is_mandatory: true
-   name: Recommendation State
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - Active
    - Dismissed
    description: Specify the recommendation state to return.
    is_mandatory: false
-   name: Recommendation Priority
    default_value: ''
    type: string
    description: Specify the recommender priority to return, multiple values can be
        specified as a comma separated string.
    is_mandatory: false
-   name: Recommender Subtype
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - REMOVE_ROLE
    - REPLACE_ROLE
    description: Specify the recommender subtype to return.
    is_mandatory: false
-   name: Max Records To Return
    default_value: '50'
    type: string
    description: Specify how many records to return. If nothing is provided, action
        will return 50 records.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ListRecommendations_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities":[]}'
