name: Update Recommendation
description: 'Update recommendation in the Google Cloud Recommender service. Note
    1: This action doesn’t run on Chronicle SOAR entities.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-recommender#update_recommendation
integration_identifier: GoogleCloudRecommender
parameters:
-   name: Recommendation Name
    default_value: ''
    type: string
    description: 'Specify the recommendation name to update. Action accepts multiple
        values as a comma separated string. Example of expected input: projects/projectname/locations/global/recommenders/google.iam.policy.Recommender/recommendations/0f262740-bf4a-4c3d-9573-0da3345cf3f7'
    is_mandatory: true
-   name: Recommendation State
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - Claimed
    - Dismissed
    description: Specify the state for the recommendation to change to.
    is_mandatory: false
-   name: Recommendation Result
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - Failed
    - Succeeded
    description: Specify the result for the recommendation to change to.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_recommendation_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities":[]}'
