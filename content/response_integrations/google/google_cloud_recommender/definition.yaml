identifier: GoogleCloudRecommender
name: Google Cloud Recommender
parameters:
-   name: API Root
    default_value: https://recommender.googleapis.com/v1/
    type: string
    description: API root of the Google Recommender service.
    is_mandatory: true
    integration_identifier: GoogleCloudRecommender
-   name: Resource Manager API Root
    default_value: https://cloudresourcemanager.googleapis.com/v3/
    type: string
    description: API root of the Google Cloud Resource Manager service.
    is_mandatory: true
    integration_identifier: GoogleCloudRecommender
-   name: Organization ID
    default_value: ''
    type: string
    description: ID of the organization that can be used with the Cloud Recommender
        integration.
    is_mandatory: false
    integration_identifier: GoogleCloudRecommender
-   name: Project ID
    default_value: ''
    type: string
    description: ID of the project that should be used in the integration. Takes priority
        over Organization ID, if both are provided.
    is_mandatory: false
    integration_identifier: GoogleCloudRecommender
-   name: Quota Project ID
    default_value: ''
    type: string
    description: ID of your Google Cloud project for Google Cloud API usage and billing.
        If no value is provided, the project ID defined in your Google Cloud service
        account is used. For this parameter to work, make sure to grant the “Service
        Usage Consumer” IAM role to your Google Cloud service account.
    is_mandatory: false
    integration_identifier: GoogleCloudRecommender
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: A Service Account Client Email to replace the usage of "User's Service
        Account", which will be used for Impersonation. Note that the SOAR Service
        Account must be granted the "Service Account Token Creator" IAM role on the
        User Service Account.
    is_mandatory: false
    integration_identifier: GoogleCloudRecommender
-   name: User Service Account
    default_value: ''
    type: password
    description: Service account of the Google Recommender service. A full content
        of the service account JSON file should be provided. This or "Workload Identity
        Email" must be provided.
    is_mandatory: false
    integration_identifier: GoogleCloudRecommender
    display_name: User's Service Account
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Google Recommender service is valid.
    is_mandatory: false
    integration_identifier: GoogleCloudRecommender
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-recommender
categories:
- IAM
- Access Management
svg_logo_path: resources/logo.svg
image_path: resources/image.png
