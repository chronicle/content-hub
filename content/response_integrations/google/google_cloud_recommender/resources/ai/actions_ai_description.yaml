    reasoning: >-
      The action fetches the current IAM policy (fetches_data=true) and then performs
      POST requests to update the IAM policy and the recommendation status in Google
      Cloud (can_mutate_external_data=true). It does not modify internal SOAR data,
      entities, or alerts.
