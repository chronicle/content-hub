Update Recommendation:
  ai_description: >-
    ### General Description

    Updates the state or result of one or more recommendations in the Google Cloud
    Recommender service. This action allows security analysts to manage the lifecycle
    of GCP recommendations (such as IAM policy changes or security hardening suggestions)
    directly from Google SecOps. It can mark recommendations as claimed, dismissed,
    succeeded, or failed.


    ### Flow Description

    1. Extracts the recommendation names, target state, and target result from the
    action parameters.

    2. Validates connectivity to the Google Cloud Recommender and Resource Manager
    services.

    3. For each provided recommendation name, performs a GET request to retrieve the
    current object and its `etag` (required by GCP to ensure concurrency control during
    updates).

    4. If a new state or result is specified, sends a POST request to the GCP Recommender
    API to update the recommendation.

    5. Collects the updated recommendation objects and formats them into a JSON result
    for the case wall, providing a summary of successful and failed updates.


    ### Additional Notes

    - This action does not run on Google SecOps entities. It operates strictly based
    on the provided `Recommendation Name` parameter.

    - At least one of `Recommendation State` or `Recommendation Result` must be set
    to a value other than `Not Specified` for the action to perform an update.
  ai_short_description: >-
    Updates the state or result of one or more recommendations in the Google Cloud
    Recommender service.
