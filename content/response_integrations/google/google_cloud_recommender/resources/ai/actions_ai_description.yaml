Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is designed to verify the connectivity and authentication
    configuration between Google SecOps and the Google Cloud Recommender and Resource
    Manager services. It ensures that the provided credentials have the necessary
    permissions to interact with the specified Google Cloud projects or organizations.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves connection details and authentication
    parameters from the integration configuration.

    2. **Manager Initialization**: It initializes two managers: one for the Recommender
    service and one for the Resource Manager service, using the provided credentials.

    3. **Connectivity Test (Recommender)**: It attempts to list a single recommendation
    from the Google Cloud Recommender service via a GET request to verify access.

    4. **Connectivity Test (Resource Manager)**: It attempts to fetch the current
    IAM policy from the Google Cloud Resource Manager service via a POST request to
    verify access.

    5. **Result Reporting**: If both tests pass, it returns a success message; otherwise,
    it raises an error detailing which service failed.


    ### Additional Notes

    - This action does not process any entities.

    - It requires either a User Service Account or a Workload Identity Email to be
    configured at the integration level for successful authentication.
