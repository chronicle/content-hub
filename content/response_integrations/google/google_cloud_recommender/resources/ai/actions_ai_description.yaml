List Recommendations:
  ai_description: >-
    ### General Description

    Lists available recommendations from the Google Cloud Recommender service. This
    action specifically retrieves recommendations related to IAM policies (`google.iam.policy.Recommender`),
    helping administrators identify security improvements such as removing unused
    roles or replacing over-privileged ones.


    ### Flow Description

    1. **Parameter Validation:** Validates that `Max Records To Return` is a positive
    integer and that dropdown values are correct.

    2. **Manager Initialization:** Initializes the Google Cloud Recommender and Resource
    Manager using the provided credentials (Service Account or Workload Identity).

    3. **Connectivity Check:** Performs a connectivity test for both GCP services
    to ensure the environment is correctly configured.

    4. **Resource Identification:** Parses the `Recommendation Filter` to identify
    the target project or organization.

    5. **Data Retrieval:** Executes a GET request to the GCP Recommender API with
    the specified filters (state, priority, subtype).

    6. **Result Processing:** Filters the API response to ensure only IAM policy recommendations
    are included and formats them into JSON results and a Data Table.


    ### Additional Notes

    - This action does not run on Chronicle SOAR entities.

    - Currently, the action only returns recommendations from the `google.iam.policy.Recommender`
    type.
