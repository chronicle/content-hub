Get Recommendation:
  ai_description: >-
    ### General Description

    The **Get Recommendation** action retrieves detailed information for specific
    recommendations from the Google Cloud Recommender service. It allows users to
    fetch metadata, impact categories, and state information for one or more recommendations
    by providing their full resource names. This action is primarily used for visibility
    and auditing of cloud optimization or security suggestions provided by Google
    Cloud.


    ### Flow Description

    1. **Initialization**: The action extracts configuration parameters (API roots,
    authentication) and the list of recommendation names from the input.

    2. **Connectivity Validation**: It performs a connectivity test for both the Recommender
    and Resource Manager services to ensure the environment is reachable.

    3. **Processing**: The action splits the comma-separated `Recommendation Name`
    input into individual identifiers.

    4. **API Interaction**: For each identifier, it executes a `GET` request to the
    Google Cloud Recommender API to retrieve the specific recommendation object.

    5. **Data Parsing**: The raw API response is parsed into a structured data model,
    capturing fields like `state`, `priority`, `category`, and `description`.

    6. **Output**: Successfully retrieved recommendations are aggregated into the
    action's JSON results, and a summary message is generated indicating which recommendations
    were found or missed.


    ### Additional Notes

    - **Entity Support**: This action does **not** run on Google SecOps entities (e.g.,
    IP, Hostname). It operates strictly based on the provided recommendation names.

    - **Authentication**: Requires a valid Service Account JSON or Workload Identity
    Email configured in the integration settings.

    - **API Scope**: Interacts with the `recommender.googleapis.com` endpoint.
  ai_short_description: >-
    Retrieves detailed information for specific recommendations from the Google Cloud
    Recommender service using their full resource names.
