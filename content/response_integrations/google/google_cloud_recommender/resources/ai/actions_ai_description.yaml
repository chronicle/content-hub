Apply IAM Recommendations:
  ai_description: >-
    ### General Description

    The **Apply IAM Recommendations** action automates the implementation of security
    recommendations generated by the Google Cloud Recommender service, specifically
    for `google.iam.policy.Recommender`. It modifies Identity and Access Management
    (IAM) policies on target Google Cloud resources (such as Projects or Organizations)
    to enforce least-privilege access by adding or removing roles for specific principals
    as suggested by the Recommender.


    ### Flow Description

    1. **Input Parsing**: The action extracts and validates the provided JSON input,
    ensuring the recommendations are of the correct type (`google.iam.policy.Recommender`).

    2. **Resource Grouping**: Recommendations are grouped based on the target GCP
    resource (Project or Organization) they affect.

    3. **Policy Retrieval**: For each unique resource, the action fetches the current
    IAM policy using the Google Cloud Resource Manager API.

    4. **Policy Transformation**: The action calculates a new IAM policy by applying
    the 'add' and 'remove' operations specified in the recommendations to the current
    policy bindings.

    5. **External Mutation (Policy)**: The action updates the IAM policy on the Google
    Cloud resource with the newly calculated configuration.

    6. **External Mutation (Status)**: After successfully updating the policy, the
    action updates the state of the recommendations to 'SUCCEEDED' within the Google
    Cloud Recommender service.

    7. **Result Reporting**: The action returns a summary of successfully applied
    and failed recommendations.


    ### Additional Notes

    - This action requires the integration to be configured with a service account
    or workload identity that has permissions to both manage IAM policies (`resourcemanager.projects.setIamPolicy`
    or equivalent) and update recommender states.
  ai_short_description: >-
    Automates the implementation of security recommendations generated by the Google
    Cloud Recommender service by modifying IAM policies on target Google Cloud resources
    to enforce least-privilege access.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
