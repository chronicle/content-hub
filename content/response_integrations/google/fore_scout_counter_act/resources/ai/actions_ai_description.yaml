Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the ForeScout CounterACT server using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts integration configuration parameters including API Root, Username,
    Password, CA Certificate File, and Verify SSL.

    2. Initializes the `ForeScoutCounterACTManager` with the extracted parameters.

    3. The manager attempts to authenticate by making a POST request to the `/api/login`
    endpoint to retrieve a JWT token.

    4. If the authentication is successful, the action completes and returns a success
    message. Otherwise, it fails and logs the error.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can communicate with the ForeScout CounterACT API.
  ai_short_description: >-
    Tests connectivity to the ForeScout CounterACT server by attempting to authenticate
    and retrieve a JWT token.
  capabilities:
