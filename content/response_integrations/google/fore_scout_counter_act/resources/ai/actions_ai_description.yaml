Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP and MAC Address entities using ForeScout CounterACT to retrieve detailed
    endpoint information. This action fetches contextual metadata such as vendor,
    classification, agent version, and online status to provide better visibility
    into internal resources.


    ### Flow Description

    1. Initializes the ForeScout CounterACT manager with the provided credentials.

    2. Filters the target entities to process only supported types (IP Address and
    MAC Address).

    3. Iterates over the filtered entities and makes an API call (GET request to `/api/hosts/mac/{mac_address}`
    or `/api/hosts/ip/{ip_address}`) to ForeScout CounterACT to fetch endpoint details.

    4. If the 'Create Insight' parameter is enabled, generates a case insight with
    the retrieved endpoint data.

    5. Enriches the entity's additional properties with the fetched information and
    marks it as enriched.

    6. Updates the entities within the SecOps platform and attaches JSON results.


    ### Additional Notes

    Supported entities are IP Address and MAC Address. The action will skip any other
    entity types provided in the target entities list.
  ai_short_description: >-
    Enriches IP and MAC Address entities by retrieving endpoint contextual metadata
    from ForeScout CounterACT.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entity additional properties with enrichment data and creates case insights.
    reasoning: >-
      The action fetches endpoint data from ForeScout CounterACT via GET requests.
      It does not mutate external data. It updates internal entities with the fetched
      data and creates case insights.
  entity_usage:
