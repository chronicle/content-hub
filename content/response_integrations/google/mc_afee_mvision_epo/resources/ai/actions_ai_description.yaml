Enrich Endpoint:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities by fetching endpoint system information
    from McAfee Mvision ePO.


    ### Flow Description

    1. Filters the target entities to include only Hostname and IP Address types.

    2. Iterates through the filtered entities and queries McAfee Mvision ePO via the
    `GET /epo/v1/devices` API endpoint to find matching devices.

    3. If a matching device is found, extracts system information (e.g., OS, managed
    state, last communicated time, installed products).

    4. Updates the entity's additional properties with the retrieved data and marks
    it as enriched.

    5. Attaches a data table containing the installed products to the action results.

    6. Returns the raw JSON data of the device.


    ### Additional Notes

    This action relies on integration-level configuration parameters to authenticate
    and connect to McAfee Mvision ePO.
