Remove Tag:
  ai_description: >-
    ### General Description

    Removes a specified tag from endpoint devices (IP Addresses and Hostnames) in
    McAfee Mvision ePO.


    ### Flow Description

    1. Extracts the tag name to be removed from the action parameters.

    2. Retrieves the tag details from McAfee Mvision ePO to obtain its internal ID.

    3. Iterates through the target entities, specifically filtering for Address and
    Hostname entity types.

    4. For each suitable entity, searches for the corresponding device in McAfee Mvision
    ePO.

    5. Makes a POST request to the McAfee Mvision ePO API to remove the tag from the
    identified device.


    ### Additional Notes

    If the specified tag or the endpoint is not found in McAfee Mvision ePO, the action
    will log an error and skip the entity. Ensure that the tag exists and is spelled
    correctly.
