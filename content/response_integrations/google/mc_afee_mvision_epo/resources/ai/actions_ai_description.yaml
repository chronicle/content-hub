Add Tag:
  ai_description: >-
    ### General Description

    Adds a specific tag to endpoint devices in McAfee Mvision ePO based on Hostname
    or IP Address entities. This action allows analysts to categorize, group, or trigger
    policy assignments on endpoints directly from the SOAR platform.


    ### Flow Description

    1. Initializes the McAfee Mvision ePO manager with the provided API credentials.

    2. Retrieves the tag details from McAfee Mvision ePO using the provided 'Tag Name'
    parameter.

    3. Iterates through the target entities, specifically filtering for Hostname and
    IP Address entity types.

    4. Searches for the corresponding device in McAfee Mvision ePO using the entity's
    identifier.

    5. Makes a POST request to the McAfee Mvision ePO API (`/epo/v1/devices/add_tag`)
    to attach the tag to the identified device.

    6. Returns a summary message detailing the successful and failed tagging operations.


    ### Additional Notes

    The action will fail for a specific entity if the endpoint cannot be found in
    McAfee Mvision ePO. It will also fail entirely if the specified tag does not exist
    in the McAfee Mvision ePO environment.
  ai_short_description: >-
    Adds a specified tag to endpoint devices in McAfee Mvision ePO based on Hostname
    or IP Address entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Makes a POST request to the McAfee Mvision ePO API to attach a specified tag
      to an endpoint device.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the McAfee Mvision ePO API to add a tag to
      a device, which mutates external data. It does not fetch contextual data to
      enrich the entities within the SOAR platform, nor does it update internal entities,
      create insights, modify alert data, or create case comments.
