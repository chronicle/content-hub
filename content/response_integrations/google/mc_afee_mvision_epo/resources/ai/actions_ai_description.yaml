List Endpoints In Group:
  ai_description: >-
    ### General Description

    Lists endpoints that belong to a specific group in McAfee Mvision ePO. This action
    retrieves a list of devices associated with a given group name and returns the
    data for further analysis or reporting.


    ### Flow Description

    1. Initializes the McAfee Mvision ePO manager using the provided API credentials.

    2. Makes a GET request to the `/epo/v1/groups` endpoint to resolve the provided
    `Group Name` to its corresponding Group ID.

    3. Makes a GET request to the `/epo/v1/devices` endpoint, filtering by the retrieved
    Group ID and limiting the results based on the `Max Endpoints to Return` parameter.

    4. Parses the returned devices and constructs a JSON object and a CSV data table
    containing the endpoint details (UUID, IP Address, Hostname, Username).

    5. Attaches the JSON results and data table to the action's output.


    ### Additional Notes

    If the specified group name is not found in McAfee Mvision ePO, the action will
    fail gracefully and suggest verifying the spelling or using the "List Groups"
    action to find available groups.
