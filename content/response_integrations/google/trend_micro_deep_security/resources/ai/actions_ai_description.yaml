Get Host Info:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a specific host (computer) from Trend Micro
    Deep Security. It queries the platform using the hostname to find the corresponding
    computer ID, fetches the computer's details, and attaches the results as a JSON
    object to the entity in Google SecOps.


    ### Flow Description

    1. Initializes the Trend Micro Deep Security manager with integration credentials.

    2. Iterates through the target entities, specifically filtering for `Hostname`
    entities.

    3. For each valid entity, makes an API call to retrieve the computer ID associated
    with the hostname.

    4. Makes a subsequent API call to fetch the detailed computer information using
    the retrieved ID.

    5. Attaches the retrieved computer details as a JSON result to the entity in Google
    SecOps.


    ### Additional Notes

    The action relies on the hostname entity identifier matching the computer name
