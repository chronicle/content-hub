Assign Security Profile To Host:
  ai_description: >-
    ### General Description

    Assigns a specified security profile (policy) to Hostname entities in Trend Micro
    Deep Security. This action modifies the configuration of the target computers
    by applying the designated security policy.


    ### Flow Description

    1. Connects to the Trend Micro Deep Security API.

    2. Retrieves the internal policy ID for the provided 'Security Profile Name' via
    a GET request.

    3. Iterates through the target entities, filtering specifically for Hostname entities.

    4. For each matching Hostname, retrieves its corresponding computer ID via a GET
    request.

    5. Assigns the policy to the computer by making a POST request to modify the computer's
    configuration.

    6. Returns a summary message indicating which entities were successfully assigned
    the policy.


    ### Additional Notes

    If an entity cannot be found or an error occurs during the assignment process
    for a specific entity, the action logs the error and continues processing the
    remaining entities.
  ai_short_description: >-
    Assigns a specified security profile (policy) to Hostname entities in Trend Micro
    Deep Security.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Modifies the configuration of a computer in Trend Micro Deep Security by assigning
      a new security policy.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to Trend Micro Deep Security to modify a computer's
      policy ID, which mutates external data. It does not fetch contextual data for
      enrichment, nor does it update internal entities, create insights, or modify
      alert data within Google SecOps.
