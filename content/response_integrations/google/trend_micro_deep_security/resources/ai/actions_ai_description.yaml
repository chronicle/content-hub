Scan Host:
  ai_description: >-
    ### General Description

    Requests a malware scan on specified Hostname entities using Trend Micro Deep
    Security. This action modifies the computer's configuration in the external system
    to enable the anti-malware state, effectively triggering a scan.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only those of type Hostname.

    3. For each valid Hostname, makes a GET request to the Trend Micro Deep Security
    API to retrieve the corresponding computer ID.

    4. Makes a POST request to the API to modify the computer's configuration, setting
    the anti-malware state to 'on'.

    5. Collects the results and outputs a summary message indicating which hosts were
    successfully requested for a scan.


    ### Additional Notes

    - Entities that are not Hostnames will be skipped.

    - If a computer cannot be found by its hostname in Trend Micro Deep Security,
    an error will be logged and the action will continue to the next entity.
