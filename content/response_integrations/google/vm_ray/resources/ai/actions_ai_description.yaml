Upload File And Get Report:
  ai_description: >-
    ### General Description

    Submits files for analysis in VMRay and retrieves the resulting analysis reports,
    IOCs, and threat indicators.


    ### Flow Description

    1. Extracts the provided file paths, tags, and comments from the action parameters.

    2. Validates that the specified files are accessible on the local system.

    3. Submits each file to VMRay via a POST request to the `/rest/sample/submit`
    endpoint.

    4. Asynchronously polls the VMRay API to check the submission status.

    5. Once the analysis is complete, retrieves the sample details, IOCs, threat indicators,
    and analysis archives (JSON and ZIP) via GET requests.

    6. Attaches the reports, IOC tables, and threat indicators to the action results
    in the SecOps platform.


    ### Additional Notes

    The action runs asynchronously. Ensure the script timeout value in the IDE is
    adjusted as needed to allow sufficient time for the sandbox analysis to complete.
