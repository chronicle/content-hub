    results, including related IOCs and threat indicators. It enriches the entities
    with the retrieved threat intelligence and optionally creates insights.


    ### Flow Description

    1. Iterates over target URL entities.

    2. Submits each URL to VMRay for analysis via the VMRay API.

    3. Waits asynchronously for the analysis jobs to complete.

    4. Retrieves the sample analysis, IOCs, and threat indicators for each successfully
    analyzed URL.

    5. Enriches the URL entities with the retrieved data, updates their suspicious
    status if applicable, and optionally creates insights.


