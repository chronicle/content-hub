Add Tag to Submission:
  ai_description: >-
    ### General Description

    This action adds a specified tag to an existing submission in VMRay using the
    submission's ID.


    ### Flow Description

    1. Extracts the `Submission ID` and `Tag Name` from the action parameters.

    2. Initializes the VMRay API client with the provided integration configuration.

    3. Makes a POST request to the VMRay API endpoint (`/rest/submission/{submission_id}/tag/{tag_name}`)
    to append the tag to the submission.

    4. Returns a success message if the tag is added successfully, or an error message
    if the operation fails.


    ### Additional Notes

    - Ensure that the provided Submission ID is valid and exists in VMRay.
