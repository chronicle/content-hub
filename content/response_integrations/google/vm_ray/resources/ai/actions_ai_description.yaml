Scan Hash:
  ai_description: >-
    ### General Description

    Enriches File Hash entities by querying VMRay for sample analysis, associated
    IOCs, and threat indicators. The action retrieves detailed threat intelligence,
    updates the entity's suspicious status if applicable, and attaches relevant tables,
    web links, and insights to the case.


    ### Flow Description

    1. Iterates over the target entities and filters for File Hash entities.

    2. For each valid hash, makes a GET request to the VMRay API to retrieve sample
    analysis details.

    3. If a sample is found, makes additional GET requests to retrieve associated
    IOCs and threat indicators based on configured filters and limits.

    4. Enriches the entity with the retrieved data, updates its suspicious status
    if the sample verdict is malicious or suspicious, and attaches tables and web
    links.

    5. Optionally creates an insight for the entity based on the action parameters.

    6. Updates the entities in the Google SecOps platform and returns the results
    in JSON format.


    ### Additional Notes

    The action allows filtering of IOCs by type and verdict, and threat indicators
    by a minimum score threshold. It also supports limiting the number of returned
    IOCs and threat indicators to prevent overwhelming the case data.
