Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the VMRay API to ensure the integration is configured correctly
    and the provided credentials are valid.


    ### Flow Description

    1. Extracts integration configuration parameters including the API Root, API Key,
    and Verify SSL settings.

    2. Initializes the VMRay client with the provided configuration.

    3. Makes a GET request to the `/rest/analysis?_limit=1` endpoint to verify authentication
    and network connectivity.

    4. Returns a success message if the connection is established, or an error message
    if the request fails.


    ### Additional Notes

    This action is typically used for troubleshooting and verifying integration settings.
    It does not process any entities or alerts.
