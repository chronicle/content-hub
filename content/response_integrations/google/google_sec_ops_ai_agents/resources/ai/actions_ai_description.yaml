Remediation Agent:
  ai_description: >-
    ### General Description

    Executes automated remediation for security alerts using AI remediation agents.
    This action checks for an existing remediation job or triggers a new one for
    a Google SecOps alert. It is an asynchronous action that polls for the remediation
    job's completion state to return the final status, summary, and action items.


    ### Flow Description

    1. Validates if the current alert originated from Google's SIEM detection engine
    by checking for a `SiemAlertId` in the alert's additional properties.

    2. On the first run, checks for any existing remediation job associated with the
    alert ID.

    3. If no existing remediation job is found, triggers a new remediation execution.

    4. Stores the remediation job ID in the alert context for tracking across polling
    cycles.

    5. In subsequent runs, retrieves the job ID from the context and queries its status.

    6. Once the job completes, formats findings into Markdown summaries and populates
    JSON results.
