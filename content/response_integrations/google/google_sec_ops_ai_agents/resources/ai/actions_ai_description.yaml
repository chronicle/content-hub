    fetches_data: true
    internal_data_mutation_explanation: >-
      Triggers a new AI-driven investigation for the alert within Google SecOps.
    reasoning: >-
      The action fetches data by making GET requests to list investigations and retrieve
      investigation status. It mutates internal data by making a POST request to trigger
      a new investigation within Google SecOps. It does not mutate external data,
