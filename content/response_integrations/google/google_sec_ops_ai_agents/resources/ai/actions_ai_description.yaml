Triage and Investigation Agent:
  ai_description: >-
    ### General Description

    Performs automated triage and investigation of Google SIEM alerts using AI agents.
    This action identifies if an alert originated from the Google SIEM detection engine
    and either retrieves an existing investigation or triggers a new one. It is an
    asynchronous action that polls for the investigation's completion to provide a
    final verdict, confidence score, and detailed summaries.


    ### Flow Description

    1. Validates if the current alert originated from Google's SIEM detection engine
    by checking for a `SiemAlertId` in the alert's additional properties.

    2. On the first run, searches for any existing investigations associated with
    the alert ID via a GET request to the Google SecOps API.

    3. If no existing investigation is found, triggers a new investigation via a POST
    request to the Google SecOps API.

    4. Stores the investigation name in the alert context for tracking across polling
    cycles.

    5. In subsequent runs, retrieves the investigation name from the context and checks
    its status via a GET request.

    6. Once the investigation completes successfully, retrieves the verdict, confidence
    level, and detailed summaries.

    7. Formats the findings into Markdown reports (Alert Summary, Investigation Summary,
    Suggested Next Steps) and populates the action's JSON results.


    ### Additional Notes

    * This action is asynchronous and will poll the Google SecOps API until the investigation
    reaches a terminal state.

    * The action requires the alert to have a `SiemAlertId` in its additional properties
    to execute.
  ai_short_description: >-
    Performs automated triage and investigation of Google SIEM alerts by triggering
    or retrieving an AI-driven investigation and polling for its final verdict, confidence
    score, and summary.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
