Add Entity To Detector URL List:
  ai_description: >-
    ### General Description

    This action adds specified URLs and domains, as well as URL and Hostname entities
    from the case, to an existing Cloud Identity URL list detector policy.


    ### Flow Description

    1. Extracts the 'Detector Policy ID', 'URL', and 'Domain' parameters.

    2. Combines the provided URLs and domains with the identifiers of any URL or Hostname
    entities in the case.

    3. If no URLs or domains are provided or found, the action finishes without making
    changes.

    4. Calls the Google Cloud Identity API to fetch the specified policy.

    5. Verifies the policy is of type `URL_LIST_DETECTOR` and appends the new URLs
    to the existing list.

    6. Makes a PATCH request to the Google Cloud Identity API to update the policy.

    7. Returns the updated policy as JSON results.


    ### Additional Notes

    Supported entities are URL and Hostname.
  ai_short_description: >-
    Adds specified URLs, domains, and relevant case entities to an existing Cloud
    Identity URL list detector policy to track or block URL navigation.
