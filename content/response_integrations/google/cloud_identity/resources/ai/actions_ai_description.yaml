    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates a Cloud Identity URL list detector policy by appending new URLs and
      domains.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PATCH request to the Google Cloud Identity API to update
      a URL list detector policy, which mutates external data. It does not fetch contextual
