List Policies:
  ai_description: >-
    ### General Description

    The "List Policies" action retrieves a list of Cloud Identity policies based on
    specified criteria such as Organization Unit Name, Policy Type, Setting Type,
    and Settings Display Name.


    ### Flow Description

    1. Extracts the provided parameters including Organization Unit Name, Policy Type
    Filter, Setting Type Filter, Settings Display Name Filter, and Max Results To
    Return.

    2. Validates that the Max Results To Return parameter is within the allowed range
    (1-100).

    3. Makes an API call to Google Cloud Identity to fetch the Organization Unit ID
    corresponding to the provided Organization Unit Name.

    4. Makes an API call to Google Cloud Identity to list policies matching the Organization
    Unit ID and the provided filters.

    5. Returns the retrieved policies as JSON results.


    ### Additional Notes

    This action requires appropriate permissions to read organizational units and
    policies within Google Cloud Identity.
