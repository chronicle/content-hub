Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the Google Cloud Identity API. This action verifies
    that the integration is configured correctly and can successfully communicate
    with the external service.


    ### Flow Description

    1. Initializes the Google Cloud Identity API client using the provided integration
    configuration.

    2. Makes a GET request to the Google Cloud Identity Policies API to fetch a single
    policy.

    3. Validates the response to ensure successful authentication and connectivity.


    ### Additional Notes

    This action is typically used during the initial setup or troubleshooting of the
    integration to verify that the credentials and network settings are valid.
