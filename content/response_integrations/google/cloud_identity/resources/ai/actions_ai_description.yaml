Create Policy:
  ai_description: >-
    ### General Description

    The "Create Policy" action creates a new policy entry within Google Cloud Identity.
    It allows administrators to programmatically define and enforce policies, such
    as Data Loss Prevention (DLP) rules or detector lists, across their organization.


    ### Flow Description

    1. Extracts the `Policy Entry` parameter, which contains the JSON configuration
    for the new policy.

    2. Validates that the provided input is a valid JSON dictionary.

    3. Makes a POST request to the Google Cloud Identity API (`/v1beta1/policies`)
    to create the policy.

    4. Retrieves the created policy details and outputs them as JSON results.


    ### Additional Notes

    - The `Policy Entry` parameter must strictly follow the Google Cloud Identity
    Policy JSON schema.
