ListServices:
  ai_description: >-
    ### General Description

    Retrieves a list of installed services from a specified Windows system using Windows
    Management Instrumentation (WMI).


    ### Flow Description

    1. Initializes a WMI connection to the target system using the provided `Server
    Address`, `Username`, and `Password`.

    2. Executes a WMI query (`Win32_Service`) to fetch all configured services on
    the remote system.

    3. Parses the retrieved services and formats them into JSON and CSV structures.

    4. Attaches the JSON results to the action's output and creates a data table named
    "WMI Services" containing the service details.


    ### Additional Notes

    - The action requires appropriate WMI access and valid credentials on the target
    server.

    - The action automatically determines if the SOAR SDK is running on Linux and
    uses a POSIX WMI client wrapper if necessary.
