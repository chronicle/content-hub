GetSystemInfo:
  ai_description: >-
    ### General Description

    Retrieves detailed system and operating system information from a remote server
    using Windows Management Instrumentation (WMI).


    ### Flow Description

    1. Initializes the WMI manager using the provided server address and credentials.

    2. Executes WMI queries to fetch data from `Win32_ComputerSystem` and `Win32_OperatingSystem`.

    3. Formats the retrieved information into a flat dictionary and converts it to
    CSV format.

    4. Attaches the CSV data as a data table ("WMI System Info") and the raw JSON
    to the action results.


    ### Additional Notes

    Requires WMI access to the target server. The action can be used to enrich asset
    entities by mapping the entity identifier to the 'Server Address' parameter.
  ai_short_description: >-
    Retrieves detailed system and operating system information from a remote server
    using WMI.
