ListUsers:
  ai_description: >-
    ### General Description

    Lists all users configured on a specified system using Windows Management Instrumentation
    (WMI).


    ### Flow Description

    1. Retrieves the `Server Address`, `Username`, and `Password` from the action
    parameters.

    2. Establishes a WMI connection to the target server using the provided credentials.

    3. Executes a WMI query (`Win32_UserAccount`) to fetch all configured users on
    the system.

    4. Formats the retrieved user data into a JSON structure and a CSV data table.

    5. Returns the results to the SOAR platform.


