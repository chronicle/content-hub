    1. Connects to the target WMI server using the provided Server Address, Username,
    and Password.

    2. Executes the specified WQL query on the remote system via the WMI protocol.

    3. Retrieves the query results and formats them into a JSON structure.

    4. If results are found, constructs a CSV and attaches it as a data table to the
    action results.


