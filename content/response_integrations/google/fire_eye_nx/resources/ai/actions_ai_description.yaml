Download Alert Artifacts:
  ai_description: >-
    ### General Description

    Downloads alert artifacts from FireEye NX based on a provided alert UUID and saves
    them to a specified local path.


    ### Flow Description

    1. Extracts the `Alert UUID` and `Download Path` parameters.

    2. Initializes the FireEye NX manager with the provided credentials.

    3. Makes a GET request to the FireEye NX API (`wsapis/v2.0.0/artifacts/{alert_uuid}`)
    to download the artifacts.

    4. Saves the downloaded artifacts as a ZIP file to the specified local path.

    5. Returns the absolute file path in the action's JSON result.


    ### Additional Notes

    Ensure the download path exists and is accessible by the execution environment.
    If a file with the same name already exists at the destination, the action will
    fail to overwrite it.
  ai_short_description: >-
    Downloads alert artifacts from FireEye NX for a specific alert UUID and saves
    them as a ZIP file to a specified local path.
