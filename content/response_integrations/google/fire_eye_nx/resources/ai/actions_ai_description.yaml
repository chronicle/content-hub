    reasoning: >-
      The action performs a POST request to FireEye NX to create an IPS policy exception
      for an IP address. Depending on the selected mode (Block, Unblock, etc.), this
      updates security controls to either prevent interaction with the IOC or restore
      connectivity. This aligns with the 'Add IOC To Blocklist' and 'Remove IOC From
      Blocklist' expected outcomes.
