Add IPS Policy Exception:
  ai_description: >-
    ### General Description

    Creates an IPS policy exception in FireEye NX for specified IP address entities.
    The target IP entities are treated as the "Attacker IP Address" in the policy
    configuration.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the victim
    IP subnet, interface, and policy mode.

    2. Filters the target entities to include only IP Addresses.

    3. Iterates over the filtered entities and masks the IP address (e.g., appending
    `/32` for IPv4 addresses).

    4. Makes a POST request to the FireEye NX API (`wsapis/v2.0.0/ips/policy_exceptions`)
    to create the policy exception with the specified mode, interface, victim IP subnet,
    and attacker IP.

    5. Returns a summary message detailing which entities successfully had policy
    exceptions created and which failed.


    ### Additional Notes

    The action supports different modes such as Block, Unblock, Suppress, and Suppress-unblock,
    allowing it to be used for both blocking and unblocking operations.
  ai_short_description: >-
    Creates an IPS policy exception in FireEye NX for specified IP address entities,
    treating them as attacker IPs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new IPS policy exception in FireEye NX for the specified attacker
      IP and victim IP subnet.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the FireEye NX API to create an IPS policy
      exception. It mutates external data by adding a new policy exception configuration.
      It does not fetch contextual data, mutate internal data, update entities, or
      create insights.
  entity_usage:
