Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the FireEye NX server using the provided integration configuration
    parameters. This action is used to verify that the integration is configured correctly
    and can successfully communicate with the FireEye NX API.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the FireEye NX manager with the provided credentials.

    3. Makes a GET request to the `wsapis/v2.0.0/health/system` API endpoint to test
    connectivity.

    4. Returns a success message if the connection is established, or a failure message
    if an error occurs.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
