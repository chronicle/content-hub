[project]
name = "CSV-Integration"
version = "43.0"
description = "Integration designed around working with CSV files. CSV is a simple file format used to store tabular data, such as a spreadsheet or database."
requires-python = ">=3.11,<3.12"
dependencies = [ "chardet==5.2.0", "environmentcommon", "numpy==2.1.0", "pandas==2.2.2", "tipcommon",]

[dependency-groups]
dev = [ "integration-testing", "pytest>=9.1.1", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.2.14-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.2.15-py3-none-any.whl"
