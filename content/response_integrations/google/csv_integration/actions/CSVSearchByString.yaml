name: CSV Search by String
description: Search for strings in CSV files.
integration_identifier: CSV
parameters:
-   name: CSV Path
    default_value: ''
    type: string
    description: Specify the file path to the CSV file or a folder path that contains
        all of the CSV files. If folder is provide, action will iterate over all CSV
        files in the folder.
    is_mandatory: true
-   name: CSV Column
    default_value: ''
    type: string
    description: Specify a comma-separated list of columns that can contain entity
        information. If nothing is provided, action will search in all of the columns.
    is_mandatory: false
-   name: Days Back
    default_value: ''
    type: string
    description: Specify how many days backwards to process the CSV files.
    is_mandatory: false
-   name: Search Value
    default_value: ''
    type: string
    description: Specify a string that needs to be searched. If 'Search Multiple Strings'
        is enabled, this parameter is treated as a comma-separated list of strings
        that need to be searched.
    is_mandatory: true
-   name: Return the first row only
    default_value: ''
    type: boolean
    description: If enabled, action will only return 1 row in the first file that
        matched the entity.
    is_mandatory: false
-   name: File Encoding Types
    default_value: utf-8, latin-1, iso-8859-1
    type: string
    description: 'A comma separated list CSV encoding types used for decoding your
        CSV files, e.g. utf-8, latin-1, iso-8859-1, utf-16... Order in which the encoding
        types are given sets the order in which they are used for decoding files,
        e.g.(from example above) the utf-8 has the highest priority and will be used
        primarily for decoding all the files, if there is a CSV file that uses some
        other encoding then the next in the order: latin-1 encoding will be used,
        and so on, until the last encoding is used.'
    is_mandatory: true
-   name: Fields To Return
    default_value: ''
    type: string
    description: Specify a comma-separated list of values that need to be returned.
    is_mandatory: false
-   name: Search Multiple Strings
    default_value: false
    type: boolean
    description: If enabled, 'Search Value' will work as a comma-separated list of
        values, instead of a single string.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/csv_search_by_string_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
script_result_name: count_rows_csv
