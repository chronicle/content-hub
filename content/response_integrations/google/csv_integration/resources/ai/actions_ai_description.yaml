Save Json To CSV:
  ai_description: >-
    ### General Description

    Converts a JSON-formatted string into a CSV file and saves it to a specified location
    on the local filesystem. It is primarily used for data transformation and reporting
    within a playbook flow, allowing users to export structured JSON data into a tabular
    format for further processing or manual review.


    ### Flow Description

    1. Extracts the JSON string, file path, and configuration flags (Overwrite, Advanced
    Handling).

    2. Validates the provided file path, ensuring it is an absolute path and checking
    for existing files or directory name conflicts.

    3. Parses the input string into a Python dictionary or list.

    4. Flattens the data using either standard wide-format flattening or vertical
    unpacking based on the Advanced Nested JSON Handling parameter.

    5. Converts the flattened data into a CSV-formatted string.

    6. Writes the CSV content to the target file path on the disk.

    7. Returns the final file path as a JSON result.


    ### Additional Notes

    - The action requires absolute paths for the File Path parameter unless a simple
    filename is used (which defaults to `/tmp/`).

    - If the input JSON is empty or malformed, the action will raise an error or produce
    an empty CSV depending on the structure.
  ai_short_description: >-
    Converts a JSON-formatted string into a CSV file and saves it to a specified location
    on the local filesystem.
  capabilities:
