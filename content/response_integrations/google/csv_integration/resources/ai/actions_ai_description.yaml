CSV Search by Entity:
  ai_description: >-
    ### General Description

    This action searches for all entities present in the current Google SecOps scope
    within local or mounted CSV files. It identifies rows where the entity's identifier
    matches data in specified (or all) columns. When a match is found, the action
    can enrich the entity with the row's data, mark the entity as suspicious, and
    create case insights. This is particularly useful for cross-referencing internal
    assets or threat intelligence stored in flat files.


    ### Flow Description

    1. **Initialization**: The action retrieves and validates input parameters, including
    file paths and encoding types.

    2. **File Discovery**: It identifies all relevant CSV files at the specified path,
    applying the 'Days Back' time filter if provided.

    3. **Entity Processing**: It iterates through every entity in the current scope.

    4. **Search Execution**: For each entity, the action reads the CSV files and searches
    for the entity's identifier in the target columns using the `pandas` library.

    5. **Data Extraction**: If matches are found, the action extracts the row data,
    applying the 'Fields To Return' filter and 'Return the first row only' logic.

    6. **Internal Mutation**: Based on configuration, it creates insights for found
    entities and updates entity objects with enrichment data and suspicious flags.

    7. **Result Finalization**: The action generates data tables for the case wall,
    populates the JSON result with the raw matches, and returns a summary message
    of found vs. not found entities.


    ### Additional Notes

    - The action supports directory traversal; if a folder is provided in 'CSV Path',
    it will iterate through all `.csv` files within that folder.

    - Multiple encodings can be provided to handle files with different character
    sets; the action will try them in the order provided.
  ai_short_description: >-
    Searches for entities within local or mounted CSV files to enrich them, mark them
    as suspicious, and generate case insights based on matched data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entity properties (enrichment data, suspicious flag) and creates case
      insights based on CSV matches.
    reasoning: >-
      The action fetches data by reading local or mounted CSV files to find contextual
      information about entities. It does not mutate any external systems or APIs.
      It mutates internal data by updating entities (setting `is_enriched`, `is_suspicious`,
      and adding `additional_properties`) and creating insights via `siemplify.add_entity_insight`
      and `siemplify.update_entities`.
  entity_usage:
    entity_types:
      address: true
      alert: true
      application: true
      child_hash: true
      child_process: true
      cluster: true
      container: true
      credit_card: true
      cve: true
      cve_id: true
      database: true
      deployment: true
      destination_domain: true
      domain: true
      email_message: true
      event: true
      file_hash: true
      file_name: true
      generic: true
      host_name: true
      ip_set: true
      mac_address: true
      parent_hash: true
      parent_process: true
      phone_number: true
      pod: true
      process: true
      service: true
      source_domain: true
      threat_actor: true
      threat_campaign: true
      threat_signature: true
      url: true
      usb: true
      user: true
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: false
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The code iterates over `siemplify.target_entities` and maps them by identifier
      (`suitable_entities = {entity.identifier: entity for entity in siemplify.target_entities}`).
      It does not apply any filtering based on `entity_type` or other entity attributes
      before processing. Therefore, it runs on all supported entity types.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: true
    enrich_ioc: true
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action searches for entity identifiers in CSV files and uses the matched
      rows to enrich the entities. Since it operates on all entity types, it can enrich
      both IOCs (hashes, IPs, domains) and Assets (hostnames, users) with contextual
      metadata found in the CSV files. It does not interact with external ticketing
      systems, blocklists, or identity providers.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
    search_events: false
    send_email: false
    send_message: false
    submit_file: false
    uncontain_host: false
    update_alert: false
    update_email: false
    update_identity: false
    update_ticket: false
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | :--- | :--- | :--- | :--- |

    | CSV Path | String | Yes | Specify the file path to the CSV file or a folder
    path that contains all of the CSV files. If folder is provide, action will iterate
    over all CSV files in the folder. |

    | CSV Column | String | No | Specify a comma-separated list of columns that can
    contain entity information. If nothing is provided, action will search in all
    of the columns. |

    | Days Back | String | No | Specify how many days backwards to process the CSV
    files. |

    | Mark As Suspicious | Boolean | No | If enabled, action will mark entity as suspicious,
    if it was found in file. |

    | Return the first row only | Boolean | No | If enabled, action will only return
    1 row in the first file that matched the entity. |

    | File Encoding Types | String | Yes | A comma separated list CSV encoding types
    used for decoding your CSV files, e.g. utf-8, latin-1, iso-8859-1, utf-16... Order
    in which the encoding types are given sets the order in which they are used for
    decoding files. |

    | Enrich Entities | Boolean | No | If enabled, action will add information from
    CSV file and add it to the enrichment table of entity. |

    | Create Insight | Boolean | No | If enabled, action will create an insight, if
    entity was found in the file. |

    | Fields To Return | String | No | Specify a comma-separated list of values that
    need to be returned. |
CSV Search by String:
  ai_description: >-
    ### General Description

    The **CSV Search by String** action allows users to search for specific strings
    within one or more CSV files. It is designed to retrieve matching rows from files
    located on the local file system or a network share accessible to the runner.
    This is useful for looking up threat intelligence, asset lists, or historical
    logs stored in CSV format.


    ### Flow Description

    1. **Initialization**: The action parses input parameters and validates the provided
    file encodings.

    2. **File Discovery**: It identifies relevant CSV files at the specified path,
    applying the `Days Back` filter if provided.

    3. **Data Retrieval**: For each file, it attempts to read the content using the
    provided encodings via the `pandas` library.

    4. **Search Logic**: It searches for the `Search Value`(s) within the specified
    columns (or all columns).

    5. **Data Processing**: Matching rows are processed to include the source file
    path and filtered to include only requested fields.

    6. **Output Generation**: Results are returned as a JSON object and individual
    Data Tables for each search term found.


    ### Additional Notes

    - This action does not run on SOAR entities; it uses the `Search Value` parameter
    as the primary input.

    - If a folder is provided in `CSV Path`, the action iterates through all `.csv`
    files in that folder.
  ai_short_description: >-
    Searches for specific strings within one or more CSV files located on the local
    file system or a network share, returning matching rows as JSON and Data Tables.
