    | Return TTPs | Boolean | No | If enabled, action will fetch related TTPs and
    details about them. |

    | Return Vulnerabilities | Boolean | No | If enabled, action will fetch related
    vulnerabilities and details about them. |

    | Create Campaign Entity | Boolean | No | If enabled, action will create an entity
    out of available "Campaign" associations. |

    | Create Actors Entity | Boolean | No | If enabled, action will create an entity
    out of available "Actor" associations. |

    | Create Signature Entity | Boolean | No | If enabled, action will create an entity
    out of available "Signature" associations. |

    | Create Vulnerability Entity | Boolean | No | If enabled, action will create
    an entity out of available "Vulnerability" associations. |

    | Max Associations To Return | String | No | Specify how many associations to
    return per type. Default: 5 |
GetThreatInfo:
  ai_description: >-
    ### General Description

    Enriches IP, URL, File Hash, and User (Email) entities using threat intelligence
    from Anomali ThreatStream. This action retrieves threat records, evaluates them
    against user-defined severity and confidence thresholds, and updates the entities'
    suspicious status and enrichment properties accordingly.


    ### Flow Description

    1. Filters the target entities to include only supported types: Address (IP),
    URL, File Hash, and User (specifically those matching an email format).

    2. Iterates through the filtered entities and makes a GET request to the Anomali
    ThreatStream API (`v2/intelligence`) to fetch threat information for each entity
    identifier.

    3. Processes the retrieved threat records. If multiple records exist, it prioritizes
    active threats, calculating the highest severity and average confidence.

    4. Evaluates the aggregated threat data against the provided `Severity Threshold`
    and `Confidence Threshold`.

    5. If the thresholds are met (and depending on the `Ignore False Positive Status`
    parameter), marks the entity as suspicious (`is_suspicious = True`).

    6. Enriches the entity's additional properties with the threat data and marks
    it as enriched (`is_enriched = True`).

    7. Updates the entities within the Google SecOps platform and attaches the results
    as CSV tables and JSON.


    ### Additional Notes

    If multiple records are found for the same entity, the action takes the highest
    severity and average confidence of active records. If no active records exist,
    it uses the newest threat record.
  ai_short_description: >-
    Enriches IP, URL, File Hash, and User (Email) entities using threat intelligence
    from Anomali ThreatStream, updating their suspicious status and enrichment properties
    based on configurable thresholds.
  capabilities:
    can_create_case_comments: false
