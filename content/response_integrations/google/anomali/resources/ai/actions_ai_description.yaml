Get Related Associations:
  ai_description: >-
    ### General Description

    Retrieves entity related associations from Anomali ThreatStream. This action fetches
    threat intelligence details such as campaigns, actors, malware, and vulnerabilities
    associated with specific indicators.


    ### Flow Description

    1. Extracts action parameters to determine which association types to fetch and
    whether to create new entities.

    2. Filters target entities to supported types (File Hash, Address, URL, and User/Email).

    3. Makes an API call to Anomali ThreatStream to fetch indicators for the target
    entities.

    4. For each requested association type, makes an API call to fetch related associations
    for the retrieved indicators.

    5. Asynchronously queries the operation status and makes API calls to retrieve
    detailed information for each association.

    6. Adds the retrieved association details as JSON results and a data table to
    the case.

    7. Optionally creates new entities (Campaign, Actor, Signature, Vulnerability)
    in the case based on the retrieved associations.


    ### Additional Notes

    This is an asynchronous action. It will run in the background and periodically
    check for completion.
  ai_short_description: >-
    Retrieves entity related associations from Anomali ThreatStream, fetching threat
    intelligence details such as campaigns, actors, malware, and vulnerabilities associated
    with specific indicators, and optionally creates new entities based on the findings.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Creates new entities (Campaign, Actor, Signature, Vulnerability) in the case
      based on the retrieved associations.
    reasoning: >-
      The action fetches data from Anomali ThreatStream via GET requests. It does
      not mutate external data. It mutates internal data by creating new entities
      (Campaign, Actor, Signature, Vulnerability) in the case using `siemplify.add_entity_to_case`.
      It does not update existing entities, create insights, modify alert data, or
      create case comments.
