Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities using information from HCL BigFix Inventory.
    This action retrieves contextual metadata about devices, such as OS version, scan
    status, and disk space, to provide better visibility into internal assets.


    ### Flow Description

    1. Extracts configuration and action parameters, including any custom fields to
    retrieve.

    2. Filters the target entities to include only Hostname and IP Address types.

    3. Iterates through the suitable entities and makes a GET request to the HCL BigFix
    Inventory API (`/api/sam/v2/computers`) to fetch device information based on the
    entity's identifier.

    4. If device data is found, enriches the entity's additional properties with the
    retrieved data and marks the entity as enriched.

    5. Optionally creates an insight for the entity containing the device details,
    based on the `Create Insight` parameter.

    6. Updates the entities in the Google SecOps platform and returns the results
    in JSON and table formats.


    ### Additional Notes

    Custom fields can be specified to retrieve additional data points from the API
    beyond the default set.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by retrieving contextual device metadata
    from HCL BigFix Inventory.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the HCL BigFix Inventory API to fetch device
      data (fetches_data=True). It does not mutate external data or internal data
      outside of entities. It updates the entities with the fetched data (can_update_entities=True)
      and optionally creates insights (can_create_insight=True). It does not modify
      alert data or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
