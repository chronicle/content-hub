    | Create Insight | Boolean | No | If enabled, action will create an insight containing
    all of the retrieved information about the entity. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the HCL BigFix Inventory server using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Root, API Token,
    and Verify SSL).

    2. Initiates an HTTP GET request to the `/api/sam/about` endpoint on the HCL BigFix
    Inventory server.

    3. Validates the HTTP response to ensure successful authentication and connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to verify that the integration
    is configured correctly and can communicate with the external service.
  ai_short_description: >-
    Tests connectivity to the HCL BigFix Inventory server to ensure the integration
    is configured correctly.
