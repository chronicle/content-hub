Execute Simple Search:
  ai_description: >-
    ### General Description

    Searches for events in Humio based on a specified query and parameters.


    ### Flow Description

    1. Extracts the repository name, query filter, timeframe, and sorting parameters
    from the action inputs.

    2. Validates the provided timeframe and limit.

    3. Constructs a Humio query string by appending selection, limit, and sorting
    functions to the base query.

    4. Executes a POST request to the Humio API (`/api/v1/repositories/{repository_name}/query`)
    to fetch the matching events.

    5. Returns the retrieved events as JSON results and attaches a data table to the
    case.


    ### Additional Notes

    If "Custom" is selected for the "Time Frame" parameter, the "Start Time" parameter
    becomes mandatory.
  ai_short_description: >-
    Searches for events in Humio based on a specified query, timeframe, and sorting
    parameters, returning the results as JSON and a data table.
