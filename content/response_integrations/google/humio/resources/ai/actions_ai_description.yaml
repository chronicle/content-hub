    | Query Filter | String | No | Specify the query that should be executed during
    the search. Note: functions "head()" and "select()" shouldn't be provided. |

    | Time Frame | DropDown | No | Specify a time frame for the results. If "Custom"
    is selected, you also need to provide "Start Time". |

    | Start Time | String | No | Specify the start time for the results. This parameter
    is mandatory, if "Custom" is selected for the "Time Frame" parameter. Format:
    ISO 8601 |

    | End Time | String | No | Specify the end time for the results. Format: ISO 8601.
    If nothing is provided and "Custom" is selected for the "Time Frame" parameter
    then this parameter will use current time. |

    | Fields To Return | String | No | Specify what fields to return. If nothing is
    provided, action will return all fields. |

    | Sort Field | String | No | Specify what parameter should be used for sorting.
    By default the query sorts data by timestamp in the ascending order. |

    | Sort Field Type | DropDown | No | Specify the type of the field that will be
    used for sorting. This parameter is needed to ensure that the correct results
    are returned. |

    | Sort Order | DropDown | No | Specify the order of sorting. |

    | Max Results To Return | String | No | Specify how many results to return. Default:
    50. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Humio server using the integration configuration parameters.


    ### Flow Description

    1. Extracts the API Root, API Token, and Verify SSL settings from the integration
    configuration.

    2. Initializes the HumioManager.

    3. Makes a POST request to the `/api/v1/repositories/humio-fleet/query` endpoint
    with a simple query (`|select([@id]) | head(1)`) to verify connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is primarily used for verifying integration settings and does not
    perform any operational tasks on alerts or entities.
