Execute Custom Search:
  ai_description: >-
    ### General Description

    Executes a custom search query in Humio to retrieve events from a specified repository.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the repository
    name, query, and the maximum number of results to return.

    2. Initializes the Humio API client with the provided credentials.

    3. Executes the custom search query against the specified Humio repository via
    an API POST request.

    4. Parses the returned events and appends them to the action's JSON result.

    5. Constructs a data table from the results and attaches it to the action output.


    ### Additional Notes

    The `head()` function should not be included in the query string parameter, as
    the action automatically appends it based on the "Max Results To Return" parameter.
  ai_short_description: >-
    Executes a custom search query in Humio to retrieve events from a specified repository.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a POST request to the Humio API to query events.
      It does not mutate external data (the POST is for querying, not state change),
      mutate internal data, update entities, create insights, modify alert data, or
      create case comments.
  entity_usage:
