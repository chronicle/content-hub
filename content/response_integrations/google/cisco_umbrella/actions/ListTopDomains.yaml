name: List Top Domains
description: Use the “List Top Domains” action to return information about top domains
    from Cisco Popularity List.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/cisco-umbrella#list_top_domains
integration_identifier: CiscoUmbrella
parameters:
-   name: Max Domains To Return
    default_value: 100
    type: string
    description: 'Max number of domains to return from the list. Maximum: 100000.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_top_domains_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
