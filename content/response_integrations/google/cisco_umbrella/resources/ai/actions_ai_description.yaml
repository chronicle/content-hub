Get Domain Status:
  ai_description: "### General Description\nThe **Get Domain Status** action enriches\
    \ Hostname and URL entities by retrieving their status, content categories, and\
    \ security categories from the Cisco Umbrella Investigate API. This action helps\
    \ security analysts determine if a domain is malicious, unknown, or safe, and\
    \ provides context regarding the type of content hosted on the domain.\n\n###\
    \ Flow Description\n1. **Configuration Retrieval**: The action retrieves the `InvestigateApiToken`\
    \ from the Cisco Umbrella integration settings.\n2. **Entity Filtering**: It identifies\
    \ all Hostname and URL entities within the current alert context.\n3. **External\
    \ API Query**: For each valid entity, it makes a GET request to the Cisco Umbrella\
    \ Investigate API's categorization endpoint (`/domains/categorization/{domain}`)\
    \ to fetch security and content data.\n4. **Data Transformation**: The raw API\
    \ response is processed into both a dictionary format for JSON results and a CSV-like\
    \ format for UI tables.\n5. **Internal Enrichment**: \n    - Updates the entity's\
    \ additional properties with the retrieved metadata (prefixed with `CU_`).\n \
    \   - Attaches a data table to the entity in the Google SecOps UI for quick reference.\n\
    \    - Updates the entity objects within the case to persist the enrichment.\n\
    6. **Finalization**: The action returns a success status if at least one entity\
    \ was successfully enriched and provides a summary message of the results.\n\n\
    ### Additional Notes\n- If a URL entity is processed, the action automatically\
    \ extracts the domain (netloc) to perform the lookup.\n- Enrichment data is added\
    \ to the entity's additional properties with the prefix `CU` (e.g., `CU_status`,\
