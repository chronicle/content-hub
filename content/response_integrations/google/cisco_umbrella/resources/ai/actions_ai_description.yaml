Is Domain In Cisco Popularity List:
  ai_description: >-
    ### General Description

    The **Is Domain In Cisco Popularity List** action verifies whether Domain, Hostname,
    or URL entities are present in the Cisco Umbrella Top 1 Million popularity list.
    This enrichment action helps security analysts distinguish between common, high-traffic
    domains and potentially suspicious, low-reputation domains by checking their presence
    in a known global popularity dataset.


    ### Flow Description

    1. **Entity Identification**: The action filters the target entities to identify
    supported types: Hostnames, Domains, and URLs.

    2. **Normalization**: It normalizes the entity identifiers by lowercasing and
    trimming them. For URL entities, it specifically extracts the hostname for comparison.

    3. **Data Retrieval**: The action connects to a Cisco-managed S3 bucket to fetch
    and unzip the latest 'Top 1M' static CSV asset.

    4. **Popularity Lookup**: It iterates through the normalized entities and checks
    if they exist within the retrieved popularity list.

    5. **Internal Enrichment**: For every processed entity, it updates the entity's
    additional properties with the field `CU_is_found_in_cisco_popular_list` (boolean)
    and marks the entity as enriched.

    6. **Result Reporting**: The action returns a JSON object for each entity detailing
    the 'found' status and the specific entry (rank) from the list, while providing
    a summary message of successful lookups.


    ### Additional Notes

    This action performs a 'Read-Only' operation against external Cisco resources
    and only modifies internal entity metadata within Google SecOps.
