Get Domain Security Info:
  ai_description: >-
    ### General Description

    Retrieves detailed security intelligence for domain names (HOSTNAME entities)
    from Cisco Umbrella Investigate. This action provides deep context on a domain's
    reputation, including popularity scores, geodiversity, DGA (Domain Generation
    Algorithm) scores, and associated threat types. The retrieved data is attached
    to the entity as a JSON file for further analysis.


    ### Flow Description

    1. **Initialization**: Initializes the Cisco Umbrella Investigate manager using
    the integration's API token.

    2. **Entity Filtering**: Identifies HOSTNAME entities in the current scope that
    are not marked as internal.

    3. **Data Retrieval**: For each identified entity, queries the Cisco Umbrella
    `/security/name/{domain}` endpoint to fetch security metrics.

    4. **Attachment Creation**: Encodes the API response and attaches it as a file
    named 'SecurityInfo.json' to the corresponding entity.

    5. **Entity Update**: Updates the entity objects within the case to reflect the
    processing status.

    6. **Finalization**: Provides a summary message detailing which entities were
    successfully processed and which lookups failed.


    ### Additional Notes

    * This action specifically targets external (non-internal) HOSTNAME entities.

    * The security information is provided as a JSON attachment named 'SecurityInfo.json'
    to the entity within the Google SecOps case.
