Get Whois:
  ai_description: >-
    ### General Description

    The **Get Whois** action enriches Hostname entities with comprehensive Whois registration
    details retrieved from Cisco Umbrella Investigate. This action helps analysts
    understand the ownership, registration dates, and contact information associated
    with a domain.


    ### Flow Description

    1. **Entity Filtering:** Identifies all `HOSTNAME` entities within the current
    scope that are marked as external (not internal).

    2. **Data Retrieval:** For each valid entity, the action makes a GET request to
    the Cisco Umbrella Investigate API to fetch Whois data in both CSV and dictionary
    formats.

    3. **Internal Enrichment:**
        * Adds a data table to the entity containing the Whois key-value pairs.
        * Flattens the Whois dictionary and adds the attributes to the entity's additional
    properties with a `CU` prefix.
        * Specifically extracts and maps the registrant, technical, or administrative
    country to a standard `Country` property.
    4. **Entity Update:** Commits the enriched data back to the Google SecOps platform.

    5. **Result Reporting:** Provides a summary message and a JSON object containing
    the raw Whois data for all processed entities.


    ### Additional Notes

    * This action is strictly for enrichment and does not modify any data within Cisco
    Umbrella.

    * Entities that are not found in the Cisco Umbrella database are reported in the
    final output message.
  ai_short_description: >-
    Enriches external Hostname entities with Whois registration details retrieved
    from Cisco Umbrella Investigate.
