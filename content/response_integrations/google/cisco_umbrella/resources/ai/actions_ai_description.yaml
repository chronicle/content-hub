Get Associated Domains:
  ai_description: >-
    ### General Description

    The **Get Associated Domains** action retrieves a list of domain names that have
    been frequently seen requested around the same time (within a 60-second window)
    as a specified Hostname entity. This information is sourced from the Cisco Umbrella
    Investigate API and helps analysts identify related infrastructure or potential
    lateral movement patterns.


    ### Flow Description

    1. **Configuration Retrieval**: The action fetches the `InvestigateApiToken` from
    the Cisco Umbrella integration settings.

    2. **Entity Filtering**: It identifies all `HOSTNAME` entities in the current
    scope that are not internal.

    3. **API Interaction**: For each valid entity, it queries the Cisco Umbrella Investigate
    `/links/name/{domain}.json` endpoint.

    4. **Data Processing**: It extracts the list of associated domains from the response.

    5. **Result Reporting**:
        - Adds a data table to each entity containing the found domains.
        - Updates the entities in Google SecOps.
        - Provides a comprehensive JSON result for downstream playbooks.

    ### Additional Notes

    - This action only processes Hostname entities that are marked as **external**
    (`is_internal` is false).

    - The action requires a valid `InvestigateApiToken` to be configured in the Cisco
    Umbrella integration settings.
