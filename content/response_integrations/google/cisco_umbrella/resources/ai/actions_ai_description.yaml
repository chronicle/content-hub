Ping:
  ai_description: >-
    Tests the connectivity between Google SecOps and the Cisco Umbrella Investigate
    API to ensure the integration is properly configured and the API token is valid.


    ### Flow Description

    1. **Configuration Retrieval**: The action retrieves the `InvestigateApiToken`
    from the Cisco Umbrella integration settings.

    2. **Connectivity Check**: It attempts to make a GET request to the Cisco Umbrella
    Investigate API endpoint for a known domain (`google.com`) to verify the token's
    validity and network access.

    3. **Result Reporting**: If the API responds successfully, the action reports
    'Connection Established' and returns a success status. Otherwise, it reports 'Connection
    Failed'.


    ### Additional Notes

    This action is used primarily for troubleshooting and verifying integration health.
    Per standard SOAR conventions, Ping actions are not categorized as enrichment
    actions.
