Add Domain:
  ai_description: >-
    ### General Description

    Adds Hostname entities to the Cisco Umbrella (OpenDNS) blocklist using the Enforcement
    API. This action is primarily used for containment by preventing access to malicious
    domains across the network protected by Cisco Umbrella. It processes external
    hostname entities and registers them as security events in the Umbrella platform.


    ### Flow Description

    1. Extracts the `EnforcementApiToken` from the integration settings.

    2. Filters the target entities to identify `HOSTNAME` entities that are marked
    as external (`is_internal` is False).

    3. For each valid entity, constructs a security event object containing the domain,
    device ID, and timestamps.

    4. Sends a POST request to the Cisco Umbrella Enforcement API (`/1.0/events`)
    to register the domain in the blocklist.

    5. Updates the successfully processed entities within Google SecOps and provides
    a summary message.


    ### Additional Notes

    This action relies on the Enforcement API token configured at the integration
    level.
