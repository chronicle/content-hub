    malicious domains associated with that IP.

    4. **Data Enrichment:** The retrieved domains are formatted into a table and attached
    to the specific entity within the SOAR platform.

    5. **Finalization:** The action updates the entities, provides a JSON result containing
    the raw data, and outputs a summary message of the successful and failed enrichments.


    ### Additional Notes:

    - This action only processes external IP addresses. Internal IP addresses are
    skipped to avoid unnecessary API calls and potential false positives.
