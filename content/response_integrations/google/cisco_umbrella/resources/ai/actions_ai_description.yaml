Delete Domain:
  ai_description: >-
    ### General Description

    The **Delete Domain** action removes specific domain names from the Cisco Umbrella
    (OpenDNS) Enforcement block list. It is primarily used to manage and clean up
    custom block lists by removing domains that are no longer considered threats or
    were added for temporary containment.


    ### Flow Description

    1. **Initialization**: Retrieves the integration configuration token and initializes
    the Cisco Umbrella Enforcement manager.

    2. **Entity Filtering**: Scans the target entities in the current context and
    selects only those that are of type `HOSTNAME` and are marked as non-internal
    (`is_internal` is false).

    3. **Execution**: For each identified domain, the action sends a `DELETE` request
    to the Cisco Umbrella API (`/1.0/domains/{domain}`) to remove it from the organizational
    block list.

    4. **Internal Update**: Updates the successfully processed entities within Google
    SecOps to reflect the processing status.

    5. **Result Tracking**: Returns a summary message to the user detailing which
    domains were successfully deleted and which failed.


    ### Additional Notes

    * This action only processes entities of type **HOSTNAME**.

    * It explicitly filters out internal entities; only external domains will be processed.
