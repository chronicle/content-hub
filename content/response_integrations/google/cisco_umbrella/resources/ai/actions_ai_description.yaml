List Top Domains:
  ai_description: >-
    ### General Description

    The **List Top Domains** action retrieves a list of the most popular domains globally
    based on the Cisco Umbrella (formerly OpenDNS) Popularity List. This list is derived
    from Cisco Umbrella's global recursive DNS traffic and provides a ranking of domains
    by their request volume. It is useful for identifying highly reputable domains
    or for baseline comparisons in security analysis.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the `Max Domains To Return`
    input and validates that it falls within the allowed range (0 - 100,000).

    2. **Resource Retrieval**: It connects to the Cisco Umbrella static assets repository
    to fetch the `top-1m.csv.zip` file.

    3. **Data Processing**: The action unzips the file in memory, parses the CSV content,
    and maps the data into structured objects containing the domain name and its popularity
    rank (order).

    4. **Result Generation**: It slices the list to the requested size and outputs
    the data as a JSON array for use in subsequent playbook steps.


    ### Additional Notes

    - This action does not require API credentials as it accesses publicly available
    static resources provided by Cisco Umbrella.

    - It does not operate on specific entities within a case; it provides a global
    reference list.
