Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname, IP Address, and User entities using information from Sumo Logic
    Cloud SIEM. This action retrieves contextual data, such as activity scores, criticality,
    and tags, to provide better visibility into the entities involved in an alert.


    ### Flow Description

    1. Iterates through the target entities and filters for supported types (Hostname,
    Address, User).

    2. For each supported entity, makes a GET request to the Sumo Logic Cloud SIEM
    API (`/entities`) to fetch entity information.

    3. If information is found, updates the entity's additional properties with the
    enrichment data and marks the entity as enriched.

    4. If the `Create Insight` parameter is enabled, generates an insight for the
    entity containing the retrieved information.

    5. Updates the entities in the SecOps platform and returns the results in JSON
    format.


    ### Additional Notes

    Ensure that the Sumo Logic Cloud SIEM integration is properly configured with
    valid API credentials.
