Add Tags To Insight:
  ai_description: >-
    ### General Description

    Adds one or more tags to a specific insight in Sumo Logic Cloud SIEM. This action
    modifies the external insight record by appending the provided tags.


    ### Flow Description

    1. Extracts the `Insight ID` and `Tags` from the action parameters.

    2. Parses the comma-separated `Tags` string into a list of individual tags.

    3. Iterates through the list of tags and makes a POST request to the Sumo Logic
    Cloud SIEM API (`/insights/{insight_id}/tags`) for each tag to add it to the specified
    insight.

    4. Returns the JSON response from the API and outputs a success message.


    ### Additional Notes

    Ensure that the provided Insight ID is valid and exists within the Sumo Logic
    Cloud SIEM environment.
