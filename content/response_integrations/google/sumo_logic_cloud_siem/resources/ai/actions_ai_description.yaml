Search Entity Signals:
  ai_description: >-
    ### General Description

    Searches for signals related to specific entities (IP Address, Hostname, Username)
    in Sumo Logic Cloud SIEM. The action retrieves historical signal data based on
    severity and time frame parameters, returning the findings as JSON results.


    ### Flow Description

    1. Extracts action parameters including the time frame, start/end times, lowest
    severity, and maximum signals to return.

    2. Iterates over the target entities provided in the case.

    3. Filters the entities to process only supported types: Address, Hostname, and
    User.

    4. Makes a GET request to the Sumo Logic Cloud SIEM API (`/signals` endpoint)
    for each valid entity to fetch related signals.

    5. Aggregates the retrieved signals and attaches them to the action's JSON results.


    ### Additional Notes

    - If the "Custom" time frame is selected, the "Start Time" parameter becomes mandatory.

    - The action does not enrich the entities or create insights; it solely retrieves
    and outputs the signal data.
