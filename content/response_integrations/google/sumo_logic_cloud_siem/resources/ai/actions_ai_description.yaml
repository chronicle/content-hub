Update Insight:
  ai_description: >-
    ### General Description

    Updates the status and/or assignee of a specific insight in Sumo Logic Cloud SIEM.


    ### Flow Description

    1. Extracts the Insight ID, Status, Assignee Type, and Assignee from the action
    parameters.

    2. Validates that either a valid status or an assignee is provided.

    3. If an assignee is provided, makes a PUT request to the Sumo Logic Cloud SIEM
    API to update the assignee of the insight.

    4. If a valid status is provided, makes a PUT request to the Sumo Logic Cloud
    SIEM API to update the status of the insight.

    5. Makes a GET request to retrieve the updated insight details.

    6. Returns the updated insight data as a JSON result.


    ### Additional Notes

    Although the Status parameter is marked as mandatory, its default value 'Select
    One' maps to an empty string. The action requires either a valid Status or an
    Assignee to be provided to execute successfully.
