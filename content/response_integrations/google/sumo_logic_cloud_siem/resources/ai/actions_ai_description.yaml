Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Sumo Logic Cloud SIEM using the provided integration
    configuration parameters. This action ensures that the API credentials and network
    settings are correctly configured to communicate with the Sumo Logic Cloud SIEM
    platform.


    ### Flow Description

    1. Extracts integration configuration parameters including API Root, API Key,
    Access ID, Access Key, and Verify SSL.

    2. Initializes the Sumo Logic Cloud SIEM manager with the provided credentials.

    3. Makes an HTTP GET request to the `/insights?limit=1` endpoint to verify authentication
    and network connectivity.

    4. Returns a success message if the connection is successfully established, or
    an error message if the connection fails.


    ### Additional Notes

    This action does not require any action-specific parameters and does not interact
    with entities, alerts, or cases within the SecOps platform.
