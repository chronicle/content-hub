identifier: Wildfire
name: Palo Alto Wildfire
parameters:
-   name: Api Key
    default_value: ''
    type: password
    description: 'Legacy WildFire API key (for standalone Wildfire portal).'
    is_mandatory: false
    integration_identifier: Wildfire
-   name: Client ID
    default_value: ''
    type: string
    description: 'Service Account Client ID from Strata Cloud Manager (SCM).'
    is_mandatory: false
    integration_identifier: Wildfire
-   name: Client Secret
    default_value: ''
    type: password
    description: 'Service Account Client Secret from Strata Cloud Manager (SCM).'
    is_mandatory: false
    integration_identifier: Wildfire
-   name: TSG ID
    default_value: ''
    type: string
    description: 'Tenant Service Group ID (TSG ID) from Strata Cloud Manager (SCM).'
    is_mandatory: false
    integration_identifier: Wildfire
-   name: API Root
    default_value: https://wildfire.paloaltonetworks.com
    type: string
    description: 'WildFire API Root URL. Default is https://wildfire.paloaltonetworks.com (US/Global). Use https://eu.wildfire.paloaltonetworks.com for EU cloud.'
    is_mandatory: false
    integration_identifier: Wildfire
-   name: Verify SSL
    default_value: true
    type: boolean
    description: 'If checked, verifies that the SSL certificate for the connection is valid.'
    is_mandatory: false
    integration_identifier: Wildfire
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/wildfire
categories:
- Malware Analysis
- Security
svg_logo_path: resources/logo.svg
image_path: resources/image.png
