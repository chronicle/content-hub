GetReport:
  ai_description: >-
    ### General Description

    Retrieves a detonation report from Palo Alto WildFire for File Hash entities.
    This action fetches both the structured report data and the PDF summary, enriching
    the entities with threat intelligence and attaching the reports to the case.


    ### Flow Description

    1. Connects to the WildFire API using the provided integration configuration.

    2. Iterates through the target entities, filtering for File Hash entities with
    a length of 32 (MD5) or 64 (SHA256) characters.

    3. Makes an API call to WildFire (`report` endpoint) to retrieve the XML report
    for each valid hash.

    4. Enriches the entity's additional properties with file information extracted
    from the report.

    5. If the file is identified as malware in the report, marks the entity as suspicious
    and creates an insight.

    6. Attaches the task information from the report as a CSV table to the entity.

    7. Makes another API call to WildFire to retrieve the PDF version of the report.

    8. Attaches the PDF report to the entity in the SecOps platform.

    9. Updates the entities with the enriched data and saves the changes.


    ### Additional Notes

    Only MD5 (32 characters) and SHA256 (64 characters) hashes are supported by this
    action.
  ai_short_description: >-
    Retrieves a detonation report and PDF summary from Palo Alto WildFire for File
