GetPcap:
  ai_description: >-
    ### General Description

    Downloads and saves the PCAP file of a sample from Palo Alto WildFire. This action
    retrieves network traffic captures associated with a previously analyzed file
    hash and attaches them to the corresponding entity for further forensic analysis.


    ### Flow Description

    1. Initializes the connection to the WildFire API using the provided integration
    configuration.

    2. Iterates through the target entities provided in the case.

    3. Filters for File Hash entities, specifically checking if the identifier length
    matches MD5 (32 characters) or SHA256 (64 characters).

    4. Makes an API call to WildFire (`wfapi.pcap`) to retrieve the PCAP file associated
    with the hash.

    5. Attaches the downloaded PCAP file to the corresponding entity in the Google
    SecOps platform using base64 encoding.


    ### Additional Notes

    Only MD5 and SHA256 hashes are supported by this action. If a PCAP is not available
    for a specific hash, the action will capture the error and continue processing
    other entities.
