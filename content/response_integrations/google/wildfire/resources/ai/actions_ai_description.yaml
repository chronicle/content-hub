DetonateFile:
  ai_description: >-
    ### General Description

    Uploads specified files to Palo Alto WildFire for detonation and retrieves the
    resulting analysis reports. This action allows analysts to automatically submit
    suspicious files to the WildFire sandbox and receive detailed threat intelligence
    and behavioral reports directly within the case.


    ### Flow Description

    1. Parses the provided comma-separated file paths from the action parameters.

    2. Connects to the WildFire API and submits each file for analysis using the `submit`
    API call.

    3. Enters a polling loop, periodically checking the WildFire service using the
    `report` API call to see if the analysis tasks are complete.

    4. Once the analysis is complete, retrieves the detailed XML and PDF reports for
    each file.

    5. Evaluates the report; if a file is identified as malware, it creates a case
    insight with a warning severity.

    6. Attaches the parsed report data as a CSV table and the downloaded PDF report
    as an attachment to the case results.


    ### Additional Notes

    The action requires local file paths accessible to the environment where the script
    is executing. It will block execution while polling for the WildFire analysis
    to complete.
  ai_short_description: >-
    Uploads specified files to Palo Alto WildFire for detonation, retrieves the analysis
    reports, and attaches the results and insights to the case.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads files to the external WildFire sandbox for detonation.
    fetches_data: true
    internal_data_mutation_explanation: >-
      Creates case insights if malware is detected and attaches analysis reports (CSV
      and PDF) to the case.
    reasoning: >-
      The action fetches data by polling WildFire for analysis reports. It mutates
      external data by uploading a file to the WildFire sandbox. It mutates internal
      data by creating case insights and attaching reports/tables to the case results.
      It does not update entities or modify alert data.
  entity_usage:
