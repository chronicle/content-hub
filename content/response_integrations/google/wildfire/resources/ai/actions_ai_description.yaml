GetFile:
  ai_description: >-
    ### General Description

    Downloads and saves a malware sample from Palo Alto WildFire based on a file hash
    entity. This action retrieves the actual file content associated with a known
    hash and attaches it directly to the entity within Google SecOps for further analysis.


    ### Flow Description

    1. Initializes the connection to the WildFire API using the provided integration
    API key.

    2. Iterates through the target entities associated with the case.

    3. Filters the entities to process only `File Hash` types.

    4. Validates the hash length to ensure it is either an MD5 (32 characters) or
    SHA256 (64 characters).

    5. Makes an API call to WildFire (`wfapi.sample`) to retrieve the sample file
    associated with the hash.

    6. Base64 encodes the downloaded file content and attaches it to the corresponding
    entity in Google SecOps.

    7. Returns a summary message listing the entities for which files were successfully
    downloaded.


    ### Additional Notes

    Only MD5 and SHA256 file hashes are supported by this action. Hashes of other
    lengths will be ignored.
  ai_short_description: >-
    Downloads a malware sample from Palo Alto WildFire for specific file hash entities
    and attaches the file to the entity within Google SecOps.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Adds the downloaded sample as an attachment to the file hash entity within Google
      SecOps.
    reasoning: >-
      The action fetches data (a file sample) from the WildFire API. It does not mutate
      external data. It mutates internal data by adding the downloaded file as an
      attachment to the entity in Google SecOps using `siemplify.result.add_entity_attachment`.
      It does not update entities, create insights, modify alert data, or create case
      comments.
