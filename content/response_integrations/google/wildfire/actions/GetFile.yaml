name: GetFile
description: 'Use the "Get File" action to download and save a file sample from Palo Alto Wildfire. This action runs on the following Google SecOps entities: File Hash. This action supports only MD5 and SHA-256 hashes.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/wildfire#get_file
integration_identifier: Wildfire
parameters:
-   name: File Hash
    default_value: ''
    type: string
    description: 'MD5 or SHA-256 hash of the file sample to download. If not specified, the action downloads samples for case entities of type FILEHASH.'
    is_mandatory: false
    integration_identifier: Wildfire
dynamic_results_metadata:
-   result_example_path: resources/GetFile_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["FILEHASH"]}'
script_result_name: success
