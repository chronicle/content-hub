Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the AlienVault TI service to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Retrieves the API key from the integration configuration.

    2. Initializes the `AlienVaultTIManager`.

    3. Calls the `test_connectivity` method, which makes a dummy GET request to the
    `user/me` endpoint of the AlienVault TI API.

    4. Returns a success or failure message based on the response.


    ### Additional Notes

    This action is typically used to verify integration configuration and does not
    process any entities or alerts.
