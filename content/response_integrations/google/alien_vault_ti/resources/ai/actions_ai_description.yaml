Enriches Entities:
  ai_description: >-
    ### General Description

    Enriches external IP addresses, hostnames, URLs, and file hashes using AlienVault
    Threat Intelligence (OTX). It retrieves threat intelligence data and updates the
    entities within the SecOps platform.


    ### Flow Description

    1. Initializes the AlienVault TI manager with the provided API key.

    2. Iterates through the target entities in the case.

    3. Checks if the entity is a supported type (Address, FileHash, URL, Hostname)
    and, for Address and Hostname, ensures it is not an internal entity.

    4. Makes a GET request to the AlienVault OTX API (`https://otx.alienvault.com/api/v1/indicators/...`)
    to fetch threat intelligence data for the specific indicator.

    5. If data is found, it adds a CSV table to the entity, updates the entity's additional
    properties with the retrieved data, and marks the entity as enriched.

    6. Updates the entities in the SecOps platform and attaches the raw JSON results
    to the action output.


    ### Additional Notes

    The action skips internal IP addresses and hostnames.
  ai_short_description: >-
    Enriches external IP addresses, hostnames, URLs, and file hashes with threat intelligence
    data from AlienVault OTX.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the AlienVault OTX API via GET requests. It does
      not mutate external data. It updates the internal entities with the fetched
      data by calling `siemplify.update_entities` and adds entity tables, but does
      not create insights, modify alert data, or create case comments.
  entity_usage:
