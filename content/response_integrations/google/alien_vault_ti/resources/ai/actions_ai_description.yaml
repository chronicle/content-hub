    filters_by_is_enriched: false
    filters_by_is_internal: true
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action iterates over `siemplify.target_entities` and filters them based
      on `entity.entity_type` matching `ADDRESS`, `FILEHASH`, `URL`, or `HOSTNAME`.
      For `ADDRESS` and `HOSTNAME`, it also checks that `entity.is_internal` is false.
