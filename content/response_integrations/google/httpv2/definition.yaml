identifier: HTTPV2
name: HTTP V2
parameters:
-   name: Test URL
    default_value: ''
    type: string
    description: Test URL that can be used to validate the "Basic Auth" authentication
        or "API Key" authentication. Uses a GET request.
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Basic Auth Username
    default_value: ''
    type: string
    description: 'If you provide "Basic Auth Username" and "Basic Auth Password" parameters
        then these parameters will be added as Basic Authentication headers to every
        action run. Note: you need to provide both "Basic Auth Password" and "Basic
        Auth Username".'
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Basic Auth Password
    default_value: ''
    type: password
    description: 'If you provide "Basic Auth Username" and "Basic Auth Password" parameters
        then these parameters will be added as Basic Authentication headers to every
        action run. Note: you need to provide both "Basic Auth Password”" and "Basic
        Auth Username".'
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: API Key Field Name
    default_value: ''
    type: string
    description: 'Name of the header that will contain the API key. If you provide
        "API Key Field Name" and "API Key Secret" parameters then these parameters
        will be added to every action run. Note: you need to provide both "API Key
        Field Name" and "API Key Secret".'
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: API Key Secret
    default_value: ''
    type: password
    description: 'API key secret. If you provide "API Key Field Name" and "API Key
        Secret" parameters then these parameters will be added to every action run.
        Note: you need to provide both "API Key Field Name" and "API Key Secret".'
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Dedicated Auth API Request Method
    default_value: Post
    type: string
    description: Method that will be used in the Dedicated Auth API flow to generate
        the access token.
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Dedicated Auth API Request URL
    default_value: ''
    type: string
    description: API request that will be used in the Dedicated Auth API flow to generate
        the access token.
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Dedicated Auth API Request Headers
    default_value: ''
    type: password
    description: Headers that will be used in the Dedicated Auth API flow to generate
        the access token.
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Dedicated Auth API Request Body
    default_value: ''
    type: password
    description: Request Body that will be used in the Dedicated Auth API flow to
        generate the access token.
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Dedicated Auth API Request Token Field Name
    default_value: ''
    type: string
    description: 'Name of the field that contains the generated access token. This
        access token can be used inside the actions with {{integration.token}} placeholder.
        Note: that the response for token generation will be flattened with "_" as
        delimiter.'
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for all of the connections
        done by integration.
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: CA Certificate
    default_value: ''
    type: string
    description: CA certificate to use to validate the secure connection. Parameter
        accepts the CA certificate in a form of base64 encoded string.
    is_mandatory: false
    integration_identifier: HTTPV2
-   name: Restrict Domain
    default_value: false
    type: boolean
    description: If selected, integration will only allow API requests with the same
        domain as in "Test URL" parameter.
    is_mandatory: false
    integration_identifier: HTTPV2
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/http-v2
categories:
- IT & Infrastructure
- Free to use
svg_logo_path: resources/logo.svg
image_path: resources/image.png
