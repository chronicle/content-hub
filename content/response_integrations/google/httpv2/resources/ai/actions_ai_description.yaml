Execute HTTP Request:
  ai_description: >-
    ### General Description

    This action executes a highly customizable HTTP request against a specified URL.
    It supports all standard HTTP methods (GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS)
    and allows for detailed configuration of headers, query parameters, cookies, and
    body payloads. It is designed to interact with any external API or web service,
    providing flexibility for custom integrations, data retrieval, or state-changing
    operations. The action also supports asynchronous polling based on expected response
    values and can save response data directly to the case wall as a zip file.


    ### Flow Description

    1. **Initialization**: The action extracts all input parameters and validates
    JSON strings for headers, parameters, and body payloads.

    2. **Authentication**: It retrieves an authenticated session based on the integration's
    configuration (Basic Auth, API Key, or OAuth2 token generation).

    3. **Request Construction**: The HTTP request is built using the specified method,
    URL, headers, cookies, and body. If a Bearer token was generated, it is injected
    into the headers.

    4. **Execution**: The request is sent to the target server with the defined timeout
    and redirect settings.

    5. **Response Handling**: The action parses the response, extracts the requested
    fields, and optionally encodes the data in Base64.

    6. **Condition Validation**: If 'Expected Response Values' are provided, the action
    checks the response against these values. If they do not match, the action enters
    an 'In Progress' state for polling.

    7. **Internal Mutation**: If 'Save To Case Wall' is enabled, the response content
    is compressed into a zip file (optionally password-protected) and uploaded to
    the Google SecOps case wall.

    8. **Completion**: The action returns the filtered response data and a success
    status.


    ### Additional Notes

    - **Asynchronous Mode**: The action automatically switches to asynchronous mode
    if the 'Expected Response Values' parameter is populated. It will continue to
    poll the endpoint until the specified conditions are met.

    - **Authentication**: The action utilizes the authentication configuration defined
    at the integration level (Basic, API Key, or Bearer Token).

    - **Domain Restriction**: If 'Restrict Domain' is enabled in the integration settings,
    the 'URL Path' must match the domain specified in the 'Test URL'.
  ai_short_description: >-
    Executes a highly customizable HTTP request against a specified URL, supporting
    all standard HTTP methods, custom headers, and payloads, with options for asynchronous
    polling and saving responses to the case wall.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: >-
      The action can execute POST, PUT, PATCH, or DELETE HTTP requests, which can
      create, modify, or delete data on external systems.
    fetches_data: true
    internal_data_mutation_explanation: >-
      The action can save the HTTP response content as a zip file and attach it to
      the case wall.
    reasoning: >-
      The action can fetch data via GET requests and mutate external data via POST/PUT/PATCH/DELETE
      requests. It can also mutate internal data by saving the HTTP response as a
      zip file attachment to the case wall. It does not update entities, create insights,
      modify alert data, or create case comments.
