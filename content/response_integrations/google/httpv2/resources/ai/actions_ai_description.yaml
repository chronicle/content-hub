    reasoning: >-
      The action is a generic HTTP request utility. It does not inherently match any
      specific outcome category like enriching an IOC, creating a ticket, or blocking
      an IP, as its behavior depends entirely on the user-provided URL and payload.
    remove_ioc_from_allowlist: false
