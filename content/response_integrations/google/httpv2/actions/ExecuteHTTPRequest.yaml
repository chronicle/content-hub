name: Execute HTTP Request
description: Execute HTTP request.
integration_identifier: HTTPV2
parameters:
-   name: Method
    default_value: GET
    type: ddl
    optional_values:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - HEAD
    - OPTIONS
    description: Specify the method for the request.
    is_mandatory: true
-   name: URL Path
    default_value: https://
    type: string
    description: Specify the URL that needs to be executed.
    is_mandatory: true
-   name: URL Params
    default_value: '{"URL Field Name": "URL Field Value"}'
    type: string
    description: Specify the parameters for the URL. Any value provided in this parameter
        will be used alongside the values that are directly provided in the URL path
        parameters.
    is_mandatory: false
-   name: Headers
    default_value: '{"Content-Type": "application/json; charset=utf-8", "Accept":
        "application/json", "User-Agent" : "GoogleSecOps"}'
    type: string
    description: Specify headers for the HTTP request.
    is_mandatory: false
-   name: Cookie
    default_value: '{"Cookie_1": "value_1"}'
    type: string
    description: Specify the parameters that should be constructed into the "Cookie"
        header. This parameter will overwrite the cookie provided in the "Headers"
        parameter.
    is_mandatory: false
-   name: Body Payload
    default_value: '{"Body Field Name": "Body Field Value"}'
    type: string
    description: Specify body for the HTTP request.
    is_mandatory: false
-   name: Expected Response Values
    default_value: ''
    type: string
    description: 'Specify the expected response values. If this parameter is not empty,
        then action will work in ASYNC mode and action will execute until the expected
        values will be seen or until timeout. Example input: {"key": "expected value"}'
    is_mandatory: false
-   name: Follow Redirects
    default_value: 'true'
    type: boolean
    description: If enabled, action will follow the redirects.
    is_mandatory: false
-   name: Fail on 4xx/5xx
    default_value: 'true'
    type: boolean
    description: If enabled, action will fail, if the status code of the response
        is 4xx or 5xx.
    is_mandatory: false
-   name: Base64 Output
    default_value: 'false'
    type: boolean
    description: 'If enabled, action will convert the response to base64. This is
        useful when downloading files. Note: JSON result can''t be bigger than 15
        mb.'
    is_mandatory: false
-   name: Fields To Return
    default_value: response_data, redirects, response_code,response_cookies,response_headers,apparent_encoding
    type: string
    description: 'Specify what fields to return. Possible values: response_data, redirects,
        response_code,response_cookies,response_headers,apparent_encoding'
    is_mandatory: true
-   name: Request Timeout
    default_value: '120'
    type: string
    description: How long to wait for the server to send data before giving up
    is_mandatory: true
-   name: Save To Case Wall
    default_value: 'false'
    type: boolean
    description: 'If enabled, action will save the file and attach it to the case
        wall. Note: the file will be archived with ".zip" extension. This zip will
        not be password protected.'
    is_mandatory: false
-   name: Password Protect Zip
    default_value: 'true'
    type: boolean
    description: If enabled, action will add an "infected" password to the zip created
        with "Save To Case Wall" parameter. Use this, when you are dealing with suspicious
        files.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/execute_http_request_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities":[]}'
