identifier: MandiantThreatIntelligence
name: Mandiant Threat Intelligence
parameters:
-   name: UI Root
    default_value: https://advantage.mandiant.com
    type: string
    description: ''
    is_mandatory: true
    integration_identifier: MandiantThreatIntelligence
-   name: API Root
    default_value: https://api.intelligence.mandiant.com
    type: string
    description: 'API root of the Mandiant instance. Note: If you want to authenticate
        with GTI credentials provide "https://www.virustotal.com" as API Root.'
    is_mandatory: true
    integration_identifier: MandiantThreatIntelligence
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID of the Mandiant Digital Threat Monitoring account.
    is_mandatory: false
    integration_identifier: MandiantThreatIntelligence
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret of the Mandiant Digital Threat Monitoring account.
    is_mandatory: false
    integration_identifier: MandiantThreatIntelligence
-   name: GTI API Key
    default_value: ''
    type: password
    description: 'Google Threat Intelligence API Key. Note: API Root should be "https://www.virustotal.com"
        to use this authentication. GTI API Key authentication has priority over other
        authentication.'
    is_mandatory: false
    integration_identifier: MandiantThreatIntelligence
-   name: Verify SSL
    default_value: 'True'
    type: boolean
    description: ''
    is_mandatory: true
    integration_identifier: MandiantThreatIntelligence
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mandiant-threat-intelligence
categories:
- Threat Intelligence
svg_logo_path: resources/logo.svg
image_path: resources/image.png
google_secops_product: true
