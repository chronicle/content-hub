name: Enrich Entities
description: 'Enrich entities using information from Mandiant. Supported entities:
    Hostname, IP Address, URL, Domain, File Hash, Threat Actor, Vulnerability. Note:
    only MD5, SHA-1 and SHA-256 are supported.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mandiant-threat-intelligence#enrich_entities
integration_identifier: MandiantThreatIntelligence
parameters:
-   name: Severity Score Threshold
    default_value: '50'
    type: string
    description: 'Specify the lowest severity score that will be used to mark the
        entity as suspicious. Note: only indicators (hostname, IP address, file hash,
        url) can be marked as suspicious. Maximum: 100.'
    is_mandatory: true
-   name: Create Insight
    default_value: true
    type: boolean
    description: If enabled, action will create an insight containing all of the retrieved
        information about the entity.
    is_mandatory: false
-   name: Only Suspicious Entity Insight
    default_value: false
    type: boolean
    description: 'If enabled, action will only create an insight for suspicious entities.
        Note: parameter "Create Insight" should be enabled. Insights for "Threat Actor"
        and "Vulnerability" entities will also be created even though they are not
        marked as suspicious.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/EnrichEntities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS", "DestinationURL", "FILEHASH",
    "THREATACTOR", "CVE"]}'
