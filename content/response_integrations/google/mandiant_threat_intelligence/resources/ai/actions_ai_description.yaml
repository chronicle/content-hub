Get Related Entities:
  ai_description: >-
    ### General Description

    Retrieves indicators of compromise (IOCs) related to specific entities using Mandiant
    Threat Intelligence. This action identifies associations between the target entity
    and known malware or threat actors, then fetches the indicators linked to those
    associations. It is designed to expand the scope of an investigation by uncovering
    related infrastructure, files, or network identifiers associated with a known
    threat.


    ### Flow Description

    1. **Parameter Validation**: The action validates that the `Lowest Severity Score`
    is a positive integer no greater than 100 and that `Max IOCs To Return` is a positive
    integer.

    2. **Entity Filtering**: It identifies supported entities from the case, including
    IP Addresses, Hostnames, Domains, URLs, File Hashes, and Threat Actors.

    3. **Data Retrieval**:
        - **For Threat Actor entities**: The action fetches the actor's details and
    then retrieves all indicators (IOCs) associated with that specific actor via the
    Mandiant API.
        - **For Indicator entities (IP, Host, etc.)**: The action fetches the indicator's
    details to find 'attributed associations' (specifically related Malware or Threat
    Actors). It then fetches indicators associated with those related malware families
    or actors.
    4. **Filtering & Aggregation**: All retrieved related indicators are filtered
    based on the `Lowest Severity Score` and limited by the `Max IOCs To Return` value.

    5. **Result Categorization**: The found IOCs are grouped by type (e.g., hashes,
    IPs, URLs, FQDNs) and returned as a structured JSON result for each processed
    entity.


    ### Additional Notes

    - This action performs deep enrichment by pivoting from a single indicator to
    its broader threat context (malware families and actors) to find related IOCs.
  ai_short_description: >-
    Retrieves indicators of compromise (IOCs) related to specific entities using Mandiant
    Threat Intelligence by identifying associations with known malware or threat actors.
