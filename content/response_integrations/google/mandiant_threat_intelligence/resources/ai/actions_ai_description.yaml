Enrich IOCs:
  ai_description: >-
    ### General Description

    Retrieves comprehensive threat intelligence from Mandiant for a user-provided
    list of Indicators of Compromise (IOCs). This action allows users to manually
    input a variety of identifier types, including IP addresses, domains, URLs, file
    hashes, CVE IDs, malware names, and threat actor names, to fetch detailed context
    from Mandiant's intelligence database.


    ### Flow Description

    1. **Initialization**: The action extracts the list of IOC identifiers from the
    action parameters.

    2. **Manager Setup**: Initializes the Mandiant API manager, handling authentication
    via either OAuth2 (Client ID/Secret) or a Google Threat Intelligence (GTI) API
    key.

    3. **Sequential Lookup**: For each provided IOC identifier, the script attempts
    to find a match in Mandiant using a prioritized fallback logic:
        *   First, it checks if the identifier is a **Vulnerability** (CVE) via a
    GET request to the vulnerability endpoint.
        *   If not found, it checks if it is a **Malware** name or ID via a GET request
    to the malware endpoint.
        *   If still not found, it checks if it is a **Threat Actor** name or ID via
    a GET request to the actor endpoint.
        *   Finally, it attempts to retrieve general **Indicator** details (for IPs,
    Hashes, Domains, and URLs) via a GET request to the indicator endpoint.
    4. **Data Aggregation**: Successfully retrieved data is converted into a structured
    JSON format, including report links back to the Mandiant Advantage UI.

    5. **Result Delivery**: The aggregated intelligence is returned as a JSON result
    to the SOAR platform for use in downstream playbooks.


    ### Additional Notes

    * This action does not automatically process entities associated with the current
    Google SecOps case; it only processes the strings explicitly provided in the 'IOC
    Identifiers' parameter.

    * The action is read-only regarding external systems and does not modify existing
    case entities or create insights automatically.
  ai_short_description: >-
    Retrieves comprehensive threat intelligence from Mandiant for a user-provided
    list of Indicators of Compromise (IOCs) and returns the aggregated data as a JSON
    result.
