Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches multiple entity types (Hostname, IP Address, URL, Domain, File Hash,
    Threat Actor, and Vulnerability) using Mandiant Threat Intelligence. This action
    provides deep context including reputation scores, associated malware, actor motivations,
    and vulnerability details to help analysts assess risk and impact.


    ### Flow Description

    1. **Validation**: Validates that the `Severity Score Threshold` is a positive
    integer within the allowed range (0-100).

    2. **Authentication**: Establishes a session with Mandiant using either Client
    Credentials or a GTI API Key.

    3. **Entity Processing**: Iterates through all supported entities in the current
    context.

    4. **Data Retrieval**:
       - For **Indicators** (IP, Host, Domain, URL, Hash): Fetches reputation data
    and scores via the Mandiant indicator details API endpoint.
       - For **Threat Actors**: Fetches actor profiles, motivations, and associated
    malware via the Mandiant actor details API endpoint.
       - For **Vulnerabilities**: Fetches CVE details, risk ratings, and executive
    summaries via the Mandiant vulnerability details API endpoint.
    5. **Enrichment & Scoring**: Updates entity attributes with retrieved data. If
    an indicator's score meets the threshold, the entity is marked as suspicious.

    6. **Output Generation**: Populates entity tables, creates insights (based on
    configuration), and attaches the full JSON response to the action results.


    ### Additional Notes

    - Supported hash types: MD5, SHA-1, and SHA-256.

    - Threat Actor and Vulnerability entities are always considered for insights if
    `Create Insight` is enabled, as they do not use the standard severity score threshold
    logic.
  ai_short_description: >-
    Enriches multiple entity types (Hostname, IP Address, URL, Domain, File Hash,
    Threat Actor, and Vulnerability) using Mandiant Threat Intelligence to provide
    deep context, reputation scores, and vulnerability details.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from Mandiant Threat Intelligence using GET requests
      (fetches_data=true). It does not perform any state-changing operations on external
      systems (can_mutate_external_data=false). It updates internal entities with
      the retrieved enrichment data using `siemplify.update_entities` (can_update_entities=true)
      and creates insights using `siemplify.add_entity_insight` (can_create_insight=true).
      It does not modify alert data or create case comments.
  entity_usage:
