Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Mandiant Threat Intelligence API using the provided
    integration configuration parameters. It validates credentials and network paths
    by performing a sample indicator lookup.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, Client ID, Client
    Secret, GTI API Key, Verify SSL).

    2. Initializes the MandiantManager to handle authentication.

    3. Executes a GET request to the indicator endpoint using a hardcoded test IP
    address (192.0.2.1) to verify the connection.

    4. Returns a success message if the API responds correctly, or an error message
    detailing the failure.


    ### Additional Notes

    This action does not process any entities from the current context. It is purely
    a diagnostic tool to verify integration settings.
