Get Malware Details:
  ai_description: >-
    ### General Description

    The **Get Malware Details** action retrieves comprehensive intelligence about
    specific malware families or samples from Mandiant Threat Intelligence. It provides
    details such as malware descriptions, aliases, associated capabilities (e.g.,
    'Allocates memory', 'Encrypts data'), and targeted industries. This action is
    useful for security analysts to understand the nature and impact of malware identified
    during an investigation.


    ### Flow Description

    1. **Parameter Initialization**: The action extracts action parameters including
    malware names, insight toggle, IOC toggle, and limits.

    2. **Validation**: It validates that the `Max Related IOCs To Return` is a positive
    integer.

    3. **Manager Setup**: Initializes the `MandiantManager` to handle API communication.

    4. **Malware Processing**: For each malware name provided in the input:
        - Fetches core malware details from Mandiant via a GET request to `/v4/malware/{malware_identifier}`.
        - If `Fetch Related IOCs` is enabled, it retrieves associated indicators (hashes,
    IPs, etc.) up to the specified limit via a GET request to `/v4/malware/{malware_identifier}/indicators`.
        - If `Create Insight` is enabled, it generates a formatted HTML insight and
    adds it to the case using `siemplify.create_case_insight`.
    5. **Result Aggregation**: The action compiles the retrieved data into a JSON
    result and a data table named 'Malware Results'.

    6. **Completion**: Returns a summary message indicating which malware names were
    successfully enriched.


    ### Additional Notes

    - This action does not automatically process entities from the case; it relies
    entirely on the names provided in the **Malware Names** parameter.
