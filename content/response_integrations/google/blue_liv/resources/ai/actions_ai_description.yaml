List Entity Threats:
  ai_description: >-
    ### General Description

    Lists threats related to entities in Blueliv. This action queries the Blueliv
    API to retrieve threat intelligence associated with the provided entities, allowing
    users to filter the results by specific labels or modules.


    ### Flow Description

    1. Extracts the integration configuration and action parameters (Label Filter,
    Module Filter, Max Threats To Return).

    2. Iterates over all target entities provided in the case.

    3. Makes a GET request to the Blueliv API to fetch threats related to each entity's
    identifier, applying the optional label and module filters.

    4. If threats are found, formats the data and attaches it to the entity as a table
    and as a JSON result.

    5. Updates the successful entities within the platform.


    ### Additional Notes

    - The label filter works with "OR" logic.

    - If no limit is specified, the action defaults to returning a maximum of 50 threats
    per entity.
