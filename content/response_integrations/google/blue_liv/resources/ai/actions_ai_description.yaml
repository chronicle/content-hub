Remove Labels From Threats:
  ai_description: >-
    ### General Description

    This action removes specified labels from specified threat IDs within BlueLiv.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Initializes the BlueLiv API client.

    3. Fetches all existing labels from BlueLiv via a GET request to map the provided
    label names to their corresponding IDs.

    4. Verifies the existence of the provided threat IDs in BlueLiv and retrieves
    their current labels via GET requests.

    5. Iterates through the threats and removes the specified labels by making a PUT
    request to the BlueLiv API.

    6. Returns a summary message detailing the successfully removed labels and those
    that were already absent.


    ### Additional Notes

    Ensure that the label names provided match exactly with those in BlueLiv, paying
    attention to case sensitivity.
