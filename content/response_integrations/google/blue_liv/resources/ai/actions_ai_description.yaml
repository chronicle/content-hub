Add Labels to Threats:
  ai_description: >-
    ### General Description

    Adds specified labels to specified threat IDs in BlueLiv.


    ### Flow Description

    1. Retrieves existing labels from BlueLiv using a GET request to `/api/v2/label/organization/{organization_id}`.

    2. Validates the provided label names against the retrieved labels.

    3. Checks if the provided threat IDs exist in BlueLiv using a GET request to `/api/v2/organization/{organization_id}/module/{module_id}/{module_type}/resource/{threat_id}`.

    4. Adds the validated labels to the existing threats using a PUT request to `/api/v2/organization/{organization_id}/module/{module_id}/{module_type}/resource/label`.


    ### Additional Notes

    None.
