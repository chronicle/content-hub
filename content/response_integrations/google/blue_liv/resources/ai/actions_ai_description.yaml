Add Comment to a Threat:
  ai_description: >-
    ### General Description

    Adds a desired text comment to a specific threat resource in BlueLiv.


    ### Flow Description

    1. Extracts action parameters including Module ID, Module Type, Resource ID, and
    Comment Text.

    2. Initializes the BlueLivManager with API credentials.

    3. Makes a PUT request to the BlueLiv API (`/api/v2/organization/{org_id}/module/{module_id}/{module_type}/resource/{threat_id}/comment`)
    to add the comment to the specified threat resource.

    4. Returns the created comment details as JSON and a table.


    ### Additional Notes

    None.
