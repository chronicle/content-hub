Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches entities using information from the Threat Context module of Blueliv.
    Supported entities include IP, Hash, URL, Threat Actor, Threat Campaign, Threat
    Signature, and CVE. It retrieves threat intelligence and risk scores to provide
    context and evaluate the suspiciousness of the indicators.


    ### Flow Description

    1. Retrieves the Blueliv context information to obtain the required module ID.

    2. Iterates over the target entities and filters them by supported entity types
    (Address, FileHash, URL, ThreatActor, ThreatCampaign, ThreatSignature, CVE).

    3. For each supported entity, makes an API call to Blueliv to fetch enrichment
    details based on the specific entity type (e.g., `enrich_ip_address`, `enrich_hash`,
    `enrich_cve`, `enrich_url`, `enrich_threatactor`, `enrich_threatcampaign`, `enrich_threatsignature`).

    4. Updates the entity's additional properties with the retrieved data and marks
    it as enriched.

    5. If the entity is an IP, Hash, or URL and its risk score is greater than or
    equal to the `Lowest Score To Mark as Suspicious` parameter, marks the entity
    as suspicious.

    6. Creates an insight with the enrichment results if the `Create Insight` parameter
    is enabled.

    7. Updates the entities in the platform.


    ### Additional Notes

    Only MD5, SHA1, SHA256, and SHA512 hashes are supported for FileHash entities.
  ai_short_description: >-
    Enriches entities (IP, Hash, URL, Threat Actor, Threat Campaign, Threat Signature,
    CVE) using information from the Threat Context module of Blueliv.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entities with enrichment data and suspicious status, and creates case
      insights.
    reasoning: >-
      The action fetches data from Blueliv via GET requests. It does not mutate external
      data. It mutates internal data by updating entities (adding enrichment data,
      marking as suspicious) and creating insights.
