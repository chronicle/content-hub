name: List Company Highlights
description: List highlights related to the company in BitSight.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/bitsight#list_company_highlights
integration_identifier: BitSight
parameters:
-   name: Company Name
    default_value: ''
    type: string
    description: Specify the name of the company for which you want to return highlights.
    is_mandatory: true
-   name: Time Frame
    default_value: Last Month
    type: ddl
    optional_values:
    - Last Week
    - Last Month
    - Custom
    description: Specify a time frame for the results. If "Custom" is selected, you
        also need to provide the "Start Time" parameter.
    is_mandatory: false
-   name: Start Time
    default_value: ''
    type: string
    description: 'Specify the start time for the results. This parameter is mandatory,
        if "Custom" is selected for the "Time Frame" parameter. Format: ISO 8601'
    is_mandatory: false
-   name: End Time
    default_value: ''
    type: string
    description: 'Specify the end time for the results. Format: ISO 8601. If nothing
        is provided and "Custom" is selected for the "Time Frame" parameter then this
        parameter uses current time.'
    is_mandatory: false
-   name: Max Highlights To Return
    default_value: 20
    type: string
    description: 'Specify the number of  highlights you want to return. Default: 20.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_company_highlights_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
