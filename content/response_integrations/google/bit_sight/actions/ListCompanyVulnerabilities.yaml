name: List Company Vulnerabilities
description: List vulnerabilities related to the company in BitSight.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/bitsight#list_company_vulnerabilities
integration_identifier: BitSight
parameters:
-   name: Company Name
    default_value: ''
    type: string
    description: Specify the name of the company for which you want to return vulnerabilities.
    is_mandatory: true
-   name: Only High Confidence
    default_value: true
    type: boolean
    description: If enabled, action will only return vulnerabilities with high confidence.
    is_mandatory: false
-   name: Max Vulnerabilities To Return
    default_value: 50
    type: string
    description: 'Specify how many vulnerabilities you want to return. Default: 50.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_company_vulnerabilities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
