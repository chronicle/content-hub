Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is designed to verify the connectivity between the Google
    SecOps platform and the BitSight service. It ensures that the provided API credentials
    and network configurations are correct and that the BitSight API is reachable.


    ### Flow Description

    1. **Initialization**: The action retrieves the integration configuration parameters.

    2. **Manager Setup**: A `BitSightManager` instance is created using these parameters.

    3. **Connectivity Test**: The manager executes a GET request to the BitSight API
    root endpoint (`/`).

    4. **Validation**: The response is validated. If the status code is successful,
    the action completes with a success message.

    5. **Error Handling**: If the request fails, an exception is caught, and a failure
    message is returned.


    ### Additional Notes

    - This action does not interact with any entities or alert data.

    - It is primarily used during the initial setup of the BitSight integration to
    confirm the environment is correctly configured.
  ai_short_description: >-
    Verifies connectivity between the Google SecOps platform and the BitSight service
    to ensure that the provided API credentials and network configurations are correct.
