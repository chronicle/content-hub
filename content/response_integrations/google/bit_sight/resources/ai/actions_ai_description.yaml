Get Company Details:
  ai_description: >-
    ### General Description

    The **Get Company Details** action retrieves comprehensive information about a
    specific company from the BitSight platform. It is used to gather business context,
    industry classifications, security ratings, and compliance certifications for
    a target organization. This action is useful for third-party risk management and
    gathering organizational context during an investigation.


    ### Flow Description

    1. **Initialization**: The action initializes the BitSight manager using the provided
    API credentials.

    2. **Company Lookup**: It retrieves the list of all companies associated with
    the BitSight account via a GET request to the BitSight API.

    3. **Filtering**: It searches the retrieved list to find the company matching
    the provided **Company Name**.

    4. **Detail Retrieval**: Upon finding a match, the action uses the company's unique
    GUID to fetch detailed metrics via a subsequent GET request to the BitSight API.

    5. **Output Generation**: The retrieved information is formatted into a structured
    data model. The action generates a data table for the case wall, provides the
    full raw JSON response for downstream logic, and adds a direct URL link to the
    company's profile in the BitSight portal.


    ### Additional Notes

    This action does not process entities from the SecOps environment; it relies entirely
    on the manually provided **Company Name** parameter.
  ai_short_description: >-
    Retrieves comprehensive information, including security ratings and compliance
    certifications, about a specific company from the BitSight platform using the
    provided company name.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
