List Company Highlights:
  ai_description: >-
    ### General Description

    Retrieves a list of highlights (insights) for a specific company from BitSight
    within a specified timeframe. This action is useful for monitoring changes in
    a company's security posture, such as rating changes or specific risk vector updates.


    ### Flow Description

    1. Extracts action parameters including Company Name, Time Frame, and limits.

    2. Queries the BitSight API (`/v1/companies`) to find the company matching the
    provided 'Company Name' and retrieves its GUID.

    3. Calculates the start and end timestamps based on the 'Time Frame' and 'Start/End
    Time' parameters.

    4. Fetches the highlights for the specific company GUID within the calculated
    time range from the BitSight API (`/ratings/v1/insights`).

    5. Returns the highlights as a JSON result.


    ### Additional Notes

    - If 'Custom' is selected for the 'Time Frame' parameter, the 'Start Time' parameter
    must be provided.

    - The action first performs a lookup to find the company's unique identifier (GUID)
    using the provided 'Company Name'.
  ai_short_description: >-
    Retrieves a list of highlights for a specific company from BitSight within a specified
    timeframe.
