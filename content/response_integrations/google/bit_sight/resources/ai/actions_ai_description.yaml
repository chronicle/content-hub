List Company Vulnerabilities:
  ai_description: >-
    ### General Description

    This action retrieves a list of vulnerabilities associated with a specific company
    from BitSight. It is used to gain visibility into the security posture and potential
    exposures of a target organization by querying BitSight's vulnerability database.
    The action returns details such as CVE IDs, first seen dates, event counts, and
    confidence levels.


    ### Flow Description

    1. **Initialization**: The action initializes the BitSight manager using the provided
    API credentials and configuration.

    2. **Company Lookup**: It first fetches the list of companies associated with
    the account to find the unique identifier (GUID) for the provided 'Company Name'.

    3. **Vulnerability Retrieval**: Using the company GUID, it queries the BitSight
    API for vulnerability statistics, applying the confidence filter if specified.

    4. **Data Processing**: The results are limited to the user-defined maximum and
    sorted by date.

    5. **Output Generation**: The action populates a data table on the case wall with
    the vulnerability details and attaches the raw data as a JSON result for further
    automation steps.


    ### Additional Notes

    This action does not operate on specific SecOps entities but rather queries based
    on the provided company name parameter.
