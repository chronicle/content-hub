Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Symantec Blue Coat ProxySG server.


    ### Flow Description

    1. Extracts integration configuration parameters (SSH Root, Username, Password).

    2. Establishes an SSH connection to the Symantec Blue Coat ProxySG server.

    3. Executes a basic 'help' command to verify connectivity.

    4. Returns a success message if the connection is established and the command
    executes successfully, otherwise returns an error.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to ensure the integration
    is configured correctly.
