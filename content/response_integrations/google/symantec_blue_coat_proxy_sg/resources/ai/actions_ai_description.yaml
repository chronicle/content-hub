Block Entities:
  ai_description: >-
    ### General Description

    Blocks specific IP address entities on Symantec Blue Coat ProxySG. This action
    initiates a state change on the external proxy device to prevent network traffic
    to or from the specified IP addresses.


    ### Flow Description

    1. Iterates over the target entities provided in the case, filtering for IP Address
    entities.

    2. Establishes an SSH connection to the Symantec Blue Coat ProxySG using integration-level
    credentials.

    3. For each valid entity, executes a sequence of interactive shell commands (`conf
    t`, `attack-detection`, `client`, `block <ip>`) to add the IP to the blocklist.

    4. Evaluates the command output to determine if the block was successful.

    5. Returns the execution status and raw output as JSON results for each processed
    entity.


    ### Additional Notes

    - This action only supports IP Address entities.

    - The action relies on SSH connectivity to the ProxySG device.
  ai_short_description: >-
    Blocks specific IP address entities on Symantec Blue Coat ProxySG by executing
    interactive shell commands via SSH to add them to the proxy's blocklist.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Executes interactive shell commands on the Symantec Blue Coat ProxySG to add
      the specified IP address to the blocklist.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action connects to the Symantec Blue Coat ProxySG via SSH and executes state-changing
      commands (`block <ip>`) to add the IP to the blocklist, which mutates external
      data. It does not fetch enrichment data, mutate internal SecOps data, update
      entities, create insights, modify alert data, or create case comments.
