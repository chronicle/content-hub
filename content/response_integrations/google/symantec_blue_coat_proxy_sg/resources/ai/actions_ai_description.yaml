Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname, IP Address, and URL entities using information from Symantec
    Blue Coat ProxySG. The action connects to the ProxySG appliance via SSH and retrieves
    DNS, geolocation, threat risk, and content filter data for the supported entities.


    ### Flow Description

    1. Connects to the Symantec Blue Coat ProxySG appliance via SSH.

    2. Iterates through the target entities, filtering for Hostname, IP Address, and
    URL types.

    3. For each entity, executes specific test commands (`test dns`, `test geolocation`,
    `test threat-risk`, `test content-filter`) based on the entity type.

    4. Parses the command output to extract relevant information.

    5. Enriches the entity with the retrieved data (e.g., country, risk level, categories,
    resolved addresses).

    6. Optionally creates an insight for the entity containing the retrieved information.

    7. Updates the enriched entities in the Google SecOps platform.


    ### Additional Notes

    This action requires SSH access to the Symantec Blue Coat ProxySG appliance.
  ai_short_description: >-
    Enriches Hostname, IP Address, and URL entities by retrieving DNS, geolocation,
    threat risk, and content filter data from Symantec Blue Coat ProxySG via SSH.
