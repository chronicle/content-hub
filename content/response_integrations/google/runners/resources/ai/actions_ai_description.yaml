Ping:
  ai_description: >-
    ### General Description

    Tests connectivity for the Runners integration. This action serves as a basic
    health check to ensure the integration is functioning and can execute scripts
    successfully.


    ### Flow Description

    1. Initializes the Siemplify action.

    2. Immediately completes execution and returns a success message.


    ### Additional Notes

    This is a utility action primarily used to verify that the integration is configured
    correctly and the environment is responsive.
