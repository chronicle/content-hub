Run Command As User:
  ai_description: >-
    ### General Description

    Executes a specified command as a designated user on the host system where the
    integration is running. It supports both Windows and Linux environments, allowing
    for commands to be run interactively or in the background as a daemon.


    ### Flow Description

    1. Retrieves the command, username, domain, password, and daemon flag from the
    action parameters.

    2. Determines the operating system (Windows or Linux) and initializes the appropriate
    runner manager.

    3. Executes the command using the provided user credentials via system-level process
    creation (e.g., `CreateProcessAsUser` on Windows or `su` on Linux).

    4. Captures and returns the standard output (STDOUT) if successful, or standard
    error (STDERR) if the command execution fails.


    ### Additional Notes

    On Windows, the user running the SOAR agent must have the 'Replace a process level
    token' permission in the Local Security Policy to successfully execute commands
    as another user.
  ai_short_description: >-
    Executes a specified command as a designated user on the host system and returns
    the output.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Executes arbitrary commands on the host system, which may modify system state,
      files, or configurations depending on the command provided.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes arbitrary commands on the host system, which can mutate
      external data or system state depending on the command provided. It does not
      fetch contextual data from an API, nor does it mutate internal SecOps data like
      entities, insights, or alerts.
