Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities by retrieving device information from
    the Fortinet FortiSIEM CMDB.


    ### Flow Description

    1. Extracts configuration and action parameters, including the optional Target
    Organization.

    2. Filters the target entities to include only Address and Hostname types.

    3. Iterates over the suitable entities and makes an API call (`GET /phoenix/rest/cmdbDeviceInfo/device`)
    to FortiSIEM to fetch device information.

    4. Updates the entity's additional properties with the retrieved device information
    and marks the entity as enriched.

    5. Adds an entity table with the device information for each successful entity.

    6. Adds a JSON result containing the device information for all successfully enriched
    entities.

    7. Updates the entities within the Google SecOps platform.


    ### Additional Notes

    - The Hostname entity should contain the "name" of the device to be successfully
    enriched.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by retrieving device information from
    the Fortinet FortiSIEM CMDB.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the FortiSIEM API to fetch device information,
      meaning it fetches data. It does not perform any state-changing operations on
      external systems. It updates the entities within Google SecOps with the fetched
      data using `siemplify.update_entities`, but does not create insights, modify
      alert data, or create case comments.
