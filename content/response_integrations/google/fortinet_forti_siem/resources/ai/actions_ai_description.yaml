Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the FortiSIEM installation using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the FortiSIEM manager.

    3. Sends a GET request to the `/phoenix/rest/deviceInfo/monitoredDevices` endpoint
    to verify connectivity.

    4. Returns a success message if the connection is established, or a failure message
    if an error occurs.


    ### Additional Notes

    This action is primarily used for troubleshooting and verifying that the integration
    is configured correctly.
