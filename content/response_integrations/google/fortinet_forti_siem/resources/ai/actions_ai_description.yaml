Execute Custom Query:
  ai_description: >-
    ### General Description

    Executes a custom query in Fortinet FortiSIEM to retrieve historical events and
    telemetry data based on specified conditions and timeframes.


    ### Flow Description

    1. Validates the provided limit and time frame parameters, calculating the exact
    start and end timestamps.

    2. Builds an XML payload for the custom query using the provided fields, sort
    options, time range, and query conditions.

    3. Initiates the query asynchronously via a POST request to the FortiSIEM API
    (`/phoenix/rest/query/eventQuery`).

    4. Polls the API to check the query progress (`/phoenix/rest/query/progress/{query_id}`).

    5. Once the query is completed, retrieves the query results up to the specified
    limit via a GET request (`/phoenix/rest/query/events/{query_id}/0/{limit}`).

    6. Returns the retrieved events as JSON and attaches them to a data table.


    ### Additional Notes

    This is an asynchronous action that will run in the background and periodically
    check for query completion. Ensure that the query syntax matches FortiSIEM's expected
    format.
  ai_short_description: >-
    Executes a custom query in Fortinet FortiSIEM to retrieve historical events and
    telemetry data based on specified conditions and timeframes.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
