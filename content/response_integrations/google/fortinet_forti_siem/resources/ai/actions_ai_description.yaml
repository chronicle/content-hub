Execute Simple Query:
  ai_description: >-
    ### General Description

    Executes a simple event query in Fortinet FortiSIEM based on provided parameters
    such as event types, categories, severity, and time frame, returning the matching
    events.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Validates the provided limits and severity parameters.

    3. Calculates the start and end timestamps based on the specified time frame.

    4. Constructs an XML query payload using the provided filtering criteria.

    5. Initiates the event query asynchronously by making a POST request to the FortiSIEM
    API (`/phoenix/rest/query/eventQuery`).

    6. Checks the query progress by making a GET request to the FortiSIEM API (`/phoenix/rest/query/progress/{query_id}`).

    7. Once the query is completed, retrieves the results by making a GET request
    to the FortiSIEM API (`/phoenix/rest/query/events/{query_id}/0/{limit}`).

    8. Outputs the retrieved events as a JSON result and populates a data table.


    ### Additional Notes

    This action operates asynchronously to handle potentially long-running queries.
