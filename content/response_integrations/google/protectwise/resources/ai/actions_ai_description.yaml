Get Pcap:
  ai_description: >-
    ### General Description

    The **Get Pcap** action retrieves and downloads packet capture (PCAP) files from
    Protectwise for events associated with a specific alert in Google SecOps. It identifies
    relevant network traffic by matching the timeframe of security events within the
    alert to events stored in Protectwise, then attaches the resulting PCAP files
    directly to the case for forensic analysis.


    ### Flow Description

    1. Validates the execution scope (Alert or Case) to determine the target alerts.

    2. Iterates over the security events associated with the target alerts.

    3. Queries the Protectwise API (`/events`) to find matching events based on the
    start and end timestamps of each security event.

    4. For every matching event found in Protectwise, requests the raw PCAP content
    via the Protectwise API (`/pcaps/events/{event_id}`).

    5. Base64 encodes the downloaded PCAP data and attaches it to the Google SecOps
    case as a `.pcap` file.

    6. Returns a summary message of the events for which PCAPs were successfully downloaded.


    ### Additional Notes

    * This action supports both Alert and Case scopes. When running in Case scope,
    it iterates over all alerts associated with the case.

    * It specifically targets the `security_events` collection within the Google SecOps
    alert to determine the search window for Protectwise.
  ai_short_description: >-
    Retrieves and downloads packet capture (PCAP) files from Protectwise based on
    the timeframe of security events within an alert, attaching them to the case.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Attaches downloaded PCAP files to the case.
    reasoning: >-
      The action fetches event data and PCAP files from Protectwise via GET requests
      (`fetches_data` = true). It does not mutate external data. It mutates internal
      data by attaching the downloaded PCAP files to the case (`can_mutate_internal_data`
      = true). It does not update entities, create insights, modify alert data, or
      create case comments.
