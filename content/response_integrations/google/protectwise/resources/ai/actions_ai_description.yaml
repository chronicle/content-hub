Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a utility designed to verify the connectivity between Google
    SecOps and the Protectwise platform. Its primary purpose is to ensure that the
    provided credentials (Email and Password) are valid and that the Protectwise API
    is reachable.


    ### Flow Description

    1. **Retrieve Configuration**: The action fetches the 'Email' and 'Password' from
    the Protectwise integration settings.

    2. **Initialize Manager**: It initializes the `ProtectwiseManager` using the retrieved
    credentials.

    3. **Authentication Check**: During initialization, the manager performs a POST
    request to the Protectwise `/token` endpoint to authenticate.

    4. **Finalize**: If the authentication is successful and no exceptions are raised,
    the action returns a success message indicating a successful connection.


    ### Additional Notes

    - This action is typically used during the initial setup of the Protectwise integration
    or for troubleshooting connection issues.

    - It relies on the integration's global configuration for authentication.
  ai_short_description: >-
    Verifies connectivity between Google SecOps and the Protectwise platform using
    the configured credentials.
