Get Events:
  ai_description: >-
    ### General Description

    Retrieves historical event data for IP Address entities from Protectwise. This
    action queries the Protectwise API to find events associated with specific IP
    addresses within a user-defined timeframe. It is primarily used to gather context
    about network activity related to an IP during an investigation.


    ### Flow Description

    1. Calculates the start and end timestamps in Unix time based on the current UTC
    time and the provided `Timeframe (hours)` parameter.

    2. Iterates through the target entities in the case and filters for those of type
    `ADDRESS` (IP addresses).

    3. For each valid IP address, calls the Protectwise API's reputation endpoint
    (`GET /reputations/ips/{ip}`), specifically requesting threat and event details
    for the calculated timeframe.

    4. If events are found, flattens the nested event data and converts it into a
    CSV-formatted string.

    5. Attaches the CSV data as an entity table to the corresponding IP address entity
    within the Google SecOps case.

    6. Returns a summary message listing the entities for which events were found
    and provides a JSON blob containing the raw event data for further processing.


    ### Additional Notes

    None.
  ai_short_description: >-
    Retrieves historical event data for IP Address entities from Protectwise within
    a specified timeframe and attaches the results as an entity table.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Adds an entity table containing the event data to the case.
    reasoning: >-
      The action fetches data from the Protectwise API using a GET request. It does
      not mutate external data. It mutates internal data by adding an entity table
      (`siemplify.result.add_entity_table`). It does not update entities (`siemplify.update_entities`
      is not called), nor does it create insights (`siemplify.add_entity_insight`
      is not called). It does not modify alert data or create case comments.
  entity_usage:
