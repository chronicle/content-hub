Rotate Service Account Keys:
  ai_description: >-
    ### General Description

    Rotates user-managed keys associated with a service account in Google Cloud IAM.
    During the rotation, all existing keys are deleted and a new key is created.


    ### Flow Description

    1. Extracts the service accounts from the action parameters and the target entities
    (User, Deployment).

    2. For each service account, fetches the existing user-managed keys via the Google
    Cloud IAM API.

    3. Creates a new service account key via the Google Cloud IAM API. If the maximum
    key limit (10) is reached, it deletes the oldest key first to make room.

    4. Deletes all remaining old keys via the Google Cloud IAM API.

    5. Returns the newly created key details as JSON results.


    ### Additional Notes

    Supported entities are User and Deployment. The supported formats for entities
    are IAM service account email and resource name.
