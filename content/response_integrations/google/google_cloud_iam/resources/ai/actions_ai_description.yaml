Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic utility designed to verify the connectivity
    and authentication configuration between Google SecOps and the Google Cloud IAM
    service. It ensures that the provided credentials (via Service Account JSON, Workload
    Identity, or individual parameters) have the necessary permissions to interact
    with the GCP IAM API.


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves all authentication and connection
    settings from the integration configuration.

    2. **Validation:** It validates the format of the `Workload Identity Email` and
    the `Service Account Json File Content` if they are provided.

    3. **Manager Initialization:** It initializes the `GoogleCloudIAMManager`, which
    handles the construction of an authorized session using the provided credentials.

    4. **Connectivity Test:** The manager executes a lightweight `GET` request to
    the Google Cloud IAM roles endpoint (`v1/{resource}/roles`) with a `pageSize`
    of 1 to verify that the API is reachable and the credentials are valid.

    5. **Result Reporting:** If the request is successful, the action completes with
    a success message. If any step fails (authentication, network error, or API error),
    the action reports a failure with the specific error details.


    ### Additional Notes

    While the action has no input parameters, it performs validation on the integration's
    configuration. For the action to succeed, the integration must be configured with
    valid credentials.
