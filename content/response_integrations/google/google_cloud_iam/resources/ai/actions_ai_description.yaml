    ### General Description

    Lists Google Cloud IAM roles based on specified search criteria. This action allows
    users to retrieve a list of predefined and custom roles from a Google Cloud project
    or organization. It supports filtering for custom roles only, including deleted
    roles, and choosing between a basic or full view of the role details. The results
    are presented as a JSON object and a data table for easy review within the SOAR
    platform.


    ### Flow Description

    1. **Initialization**: The action extracts configuration parameters (API credentials,
    project IDs) and action-specific parameters (filters, view, limits).

    2. **Manager Setup**: A `GoogleCloudIAMManager` is initialized using the provided
    credentials and configuration.

