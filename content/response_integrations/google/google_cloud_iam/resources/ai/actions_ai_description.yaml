Delete Role:
  ai_description: >-
    ### General Description

    Deletes a custom IAM role within a Google Cloud project or organization. This
    action first retrieves the role's metadata to obtain the required 'etag' for concurrency
    control and then executes the deletion request.


    ### Flow Description

    1. **Initialization**: The action initializes the Google Cloud IAM manager using
    provided credentials and configuration.

    2. **Role Retrieval**: It fetches the current state of the specified role via
    a GET request to retrieve its `etag`, which is necessary for the deletion process
    to ensure data consistency.

    3. **Deletion**: It sends a DELETE request to the Google Cloud IAM API for the
    specific role identifier, including the `etag` as a parameter.

    4. **Result Processing**: Upon successful deletion, the action returns the deleted
    role's metadata as a JSON result and provides a success message.


    ### Additional Notes

    The action requires appropriate permissions to delete IAM roles in the target
    Google Cloud project or organization.
