Disable Service Account:
  ai_description: >-
    ### General Description

    This action disables Google Cloud IAM service accounts associated with the provided
    entities. It is used to immediately revoke access for a service account, preventing
    it from being used for authentication or authorization within Google Cloud Platform.
    The action supports entities provided as either IAM service account emails or
    full resource names (e.g., `projects/project-id/serviceAccounts/service-account-email`).


    ### Flow Description

    1. **Initialization**: The action initializes the Google Cloud IAM manager using
    the integration's configuration credentials.

    2. **Entity Filtering**: It iterates through the target entities in the current
    context, filtering for supported types: `USER` (Username) and `DEPLOYMENT`.

    3. **Resource Parsing**: For each valid entity, it attempts to parse the identifier
    to determine if it is a full resource path or a simple email address, extracting
    the project ID if available.

    4. **API Execution**: It sends a POST request to the Google Cloud IAM `:disable`
    endpoint for the identified service account.

    5. **Result Tracking**: The action tracks which service accounts were successfully
    disabled and which failed.

    6. **Final Output**: It returns a summary message to the Google SecOps case wall
    indicating the success or failure of the operation for all processed entities.


    ### Additional Notes

    - The action specifically targets `USER` (Username) and `DEPLOYMENT` entity types.

    - It can handle identifiers in the format of a plain email address or a full GCP
    resource path.

    - If a resource path is provided, the action extracts the specific project ID
    from the path; otherwise, it uses the default project ID from the integration
    configuration.
