    \ including their unique identifiers, display names, associated projects, and\
    \ descriptions. It supports entities formatted as either a service account email\
    \ or a full Google Cloud resource name.\n\n### Parameters Description\nThis action\
    \ does not have any action-specific parameters. It relies entirely on the global\
    \ integration configuration parameters (such as API Root, Project ID, and Service\
    \ Account credentials) to authenticate and interact with the Google Cloud IAM\
    \ API.\n\n### Additional Notes\n* The action specifically targets entities of\
    \ type `USERUNIQNAME` (User) and `DEPLOYMENT`.\n* It can handle identifiers in\
    \ the format of an email (e.g., `account@project.iam.gserviceaccount.com`) or\
    \ a resource path (e.g., `projects/project-id/serviceAccounts/account@project.iam.gserviceaccount.com`).\n\
    * If an entity identifier matches the resource path pattern, the action extracts\
    \ the specific project ID from the path to perform a more targeted lookup.\n\n\
    ### Flow Description\n1. **Initialization**: The action initializes the Google\
    \ Cloud IAM manager using the integration's configuration credentials and connection\
    \ settings.\n2. **Entity Filtering**: It identifies all `User` and `Deployment`\
    \ entities within the current alert or case context.\n3. **Identifier Parsing**:\
    \ For each entity, it attempts to parse the identifier to determine if it contains\
    \ a Google Cloud project reference or is a standard service account email.\n4.\
    \ **Data Retrieval**: The action calls the Google Cloud IAM API (`get_service_account`)\
    \ to fetch the detailed metadata for the service account.\n5. **Internal Enrichment**:\
