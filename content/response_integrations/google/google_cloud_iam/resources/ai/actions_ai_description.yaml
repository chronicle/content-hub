Enable Service Account:
  ai_description: >-
    ### General Description

    Enables a previously disabled Google Cloud IAM service account. This action is
    used to restore functionality to service accounts that have been deactivated,
    allowing them to once again authenticate and access Google Cloud resources. It
    supports entities provided as either a full IAM resource name or a service account
    email.


    ### Flow Description

    1. **Initialization**: The action retrieves global integration settings, including
    authentication credentials and the API root URL.

    2. **Manager Setup**: It initializes the `GoogleCloudIAMManager` which handles
    the authenticated session with Google Cloud APIs.

    3. **Entity Filtering**: The action iterates through the target entities and filters
    for supported types: `USER` and `DEPLOYMENT`.

    4. **Identifier Parsing**: For each valid entity, it attempts to extract the project
    ID and service account email from the identifier using regex patterns.

    5. **API Execution**: It sends a POST request to the Google Cloud IAM `:enable`
    endpoint for the specific service account.

    6. **Result Aggregation**: The action tracks which service accounts were successfully
    enabled and which failed, providing a summary message and a boolean success status
    at the end of execution.


    ### Additional Notes

    * The action supports **User** and **Deployment** entity types.

    * Entity identifiers should follow the format of an IAM service account email
    (e.g., `name@project-id.iam.gserviceaccount.com`) or a resource name (e.g., `projects/project-id/serviceAccounts/name@project-id.iam.gserviceaccount.com`).

    * If an entity identifier does not match the expected service account pattern,
    the action will attempt to process it using the default Project ID configured
    in the integration.
