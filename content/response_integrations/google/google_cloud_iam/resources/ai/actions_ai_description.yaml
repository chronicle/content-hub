  ai_description: >-
    ### General Description

    The **Get Service Account IAM Policy** action retrieves the access control policy
    for a specified Google Cloud Service Account. This action is used to audit permissions
    and identify which identities (users, groups, or domains) have specific roles
    assigned to a service account. It is a read-only operation that fetches the current
    IAM policy bindings from Google Cloud.


    ### Flow Description

    1. Initializes the Google Cloud IAM manager using the integration's configuration
    parameters.

    2. Iterates through the target entities in the current context, processing only
    those of type `USERUNIQNAME` (representing the Service Account email) or `DEPLOYMENT`.

    3. For each entity, attempts to extract the service account email and the associated
    project ID from the identifier using a regex pattern.

    4. Calls the Google Cloud IAM API's `getIamPolicy` endpoint for the identified
    service account.

    5. Aggregates the retrieved policy data (including version, etag, and role bindings)
    into a JSON result and attaches it to the action output.


    ### Additional Notes

    - The action supports entities provided as either a full IAM service account resource
    name (e.g., `projects/project-id/serviceAccounts/sa-email`) or just the service
    account email.

    - If the entity identifier is a simple email, the action uses the default Project
    ID configured in the integration settings.
