Create Service Account:
  ai_description: >-
    ### General Description

    This action creates a new Google Cloud IAM Service Account within a specified
    Google Cloud project. It allows users to define the account's unique identifier,
    a human-readable display name, and a detailed description. This is typically used
    for automated provisioning of identities for applications or services requiring
    specific access within the GCP environment.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves action-specific parameters including
    the target Project ID, Service Account ID, Display Name, and Description.

    2. **Validation**: It validates that a target Project ID can be resolved (either
    from the action parameter or falling back to the integration configuration).

    3. **Manager Initialization**: Initializes the `GoogleCloudIAMManager` using the
    provided authentication credentials.

    4. **API Call**: Executes a POST request to the Google Cloud IAM API's `createServiceAccount`
    endpoint (`v1/projects/{project_id}/serviceAccounts`) for the resolved project.

    5. **Result Handling**: If successful, the details of the newly created service
    account are returned and added to the action's JSON result. If the account already
    exists, it handles the specific error gracefully.


    ### Additional Notes

    - If the service account already exists, the action will complete successfully
    but will log that the account already exists and will not create a duplicate.
