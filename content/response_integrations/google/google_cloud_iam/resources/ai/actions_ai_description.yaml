Set Service Account IAM Policy:
  ai_description: >-
    ### General Description

    The **Set Service Account IAM Policy** action updates the access control policy
    for a specified Google Cloud Service Account. This action allows security teams
    to programmatically manage permissions by applying a JSON-formatted policy document
    to service account entities. It ensures consistency by automatically handling
    the policy's etag during the update process.


    ### Flow Description

    1. Validates that the provided `Policy` parameter is a valid JSON string.

    2. Iterates over the target entities, filtering for `User` and `Deployment` entity
    types.

    3. Parses the entity identifier to determine the service account email and the
    associated Google Cloud project.

    4. Performs a `getIamPolicy` API request to fetch the current policy of the service
    account and extract the latest `etag` value.

    5. Updates the user-provided JSON policy with the retrieved `etag` to ensure the
    update is applied to the correct version of the resource.

    6. Executes a `setIamPolicy` API request to overwrite the service account's policy
    with the new configuration.

    7. Returns the updated policy details as JSON results and provides a summary message.


    ### Additional Notes

    - The action supports **User** (Service Account Email) and **Deployment** (Resource
    Name) entities.

    - The entity identifier must follow the format of a Google Cloud service account
    email or a full resource path.
