Create Role:
  ai_description: >-
    ### General Description

    Creates a new custom IAM Role within a Google Cloud project or organization. This
    action allows security administrators to programmatically define and deploy specific
    permission sets as reusable roles.


    ### Flow Description

    1. **Parameter Extraction:** Retrieves the target Project ID, Role ID, and the
    Role Definition JSON from the action inputs.

    2. **Validation:** Validates that the Role Definition is a valid JSON document.

    3. **API Interaction:** Authenticates with Google Cloud IAM and sends a POST request
    to the roles creation endpoint for the specified resource (project or organization).

    4. **Result Processing:** If successful, the action returns the details of the
    newly created role in JSON format and marks the execution as completed.


    ### Additional Notes

    Ensure that the provided Role Definition is a properly formatted JSON string that
    adheres to Google Cloud IAM role specifications.
