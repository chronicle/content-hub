    script calls either `list_resource_roles` (for custom roles) or `list_roles` (for
    all roles) via the GCP IAM API.

    4. **Pagination**: The script iterates through API response pages until the requested
    number of roles is reached or no more roles are available.

    5. **Output**: The retrieved roles are processed into a JSON result and a CSV-formatted
    data table, which are then attached to the action output.


