name: Create Service Account
description: Create a Google Cloud IAM Service Account.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-iam#create_service_account
integration_identifier: GoogleCloudIAM
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project to create service accounts in. If
        nothing is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Service Account ID
    default_value: ''
    type: string
    description: Specify service account id to create.
    is_mandatory: true
-   name: Service Account Display Name
    default_value: ''
    type: string
    description: Specify service account display name to create.
    is_mandatory: false
-   name: Service Account Description
    default_value: ''
    type: string
    description: Specify service account description to create.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_service_account_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
