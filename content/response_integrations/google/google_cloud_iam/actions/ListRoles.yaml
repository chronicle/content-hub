name: List Roles
description: List Google Cloud IAM roles based on the specified search criteria. Note
    that action is not working on Siemplify entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-iam#list_roles
integration_identifier: GoogleCloudIAM
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project, where you want to list the roles.
        If nothing is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: View
    default_value: Basic
    type: ddl
    optional_values:
    - Basic
    - Full
    description: Specify which view should be used to return role information.
    is_mandatory: false
-   name: Max Rows To Return
    default_value: '50'
    type: string
    description: Specify how many roles the action should return.
    is_mandatory: false
-   name: List Custom Roles Only?
    default_value: false
    type: boolean
    description: If enabled, action will return only custom roles defined for the
        current project or orgranization.
    is_mandatory: false
-   name: Show Deleted
    default_value: false
    type: boolean
    description: If enabled, action will also return deleted roles.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_roles_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
