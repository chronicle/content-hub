name: Rotate Service Account Keys
description: 'Rotate user-managed keys associated with a service account. During the
    rotation all existing keys will be deleted and a new key will be created. Supported
    entities: Username, Deployment. Note: the supported formats for entities are IAM
    service account email and resource name.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-iam#rotate_service_account_keys
integration_identifier: GoogleCloudIAM
parameters:
-   name: Service Account
    default_value: ''
    type: string
    description: A comma-separated list of service accounts for which to rotate keys.
        This parameter works alongside entities. If provided, the action rotates keys
        for these specific accounts in addition to any service account entities identified
        in the action scope.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/rotate_service_account_keys_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":["USERUNIQNAME","DEPLOYMENT"]}'
