name: Set Service Account IAM Policy
description: 'Sets the access control policy on the specified service account. Supported
    entities: Username, Deployment. Note: the supported formats for entities are IAM
    service account email and resource name.'
integration_identifier: GoogleCloudIAM
parameters:
-   name: Policy
    default_value: ''
    type: string
    description: Specify JSON policy document to set for service account.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/set_service_account_iam_policy_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":["USERUNIQNAME","DEPLOYMENT"]}'
