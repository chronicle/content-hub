name: Create Role
description: Create a Google Cloud IAM Role.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-iam#create_role
integration_identifier: GoogleCloudIAM
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project, where you want to create the role.
        If nothing is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Role ID
    default_value: ''
    type: string
    description: Specify role id for newly created IAM role.
    is_mandatory: true
-   name: Role Definition
    default_value: ''
    type: string
    description: Specify JSON policy document to use as the role definition.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/create_role_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
