name: List Service Accounts
description: List service accounts available in Google Cloud IAM.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-iam#list_service_accounts
integration_identifier: GoogleCloudIAM
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project to list service accounts in. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Service Account Display Name
    default_value: ''
    type: string
    description: Specify service account display name to return. Parameter accepts
        multiple values as a comma separated string.
    is_mandatory: false
-   name: Service Account Email
    default_value: ''
    type: string
    description: Specify service account email to return. Parameter accepts multiple
        values as a comma separated string.
    is_mandatory: false
-   name: Max Rows To Return
    default_value: '50'
    type: string
    description: Specify how many service accounts the action should return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_service_accounts_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
