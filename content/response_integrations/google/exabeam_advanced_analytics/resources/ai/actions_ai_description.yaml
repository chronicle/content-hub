Ping:
  ai_description: >-
    ### General Description

    The Ping action is a diagnostic tool designed to verify the connectivity between
    Google SecOps and the Exabeam Advanced Analytics server. It ensures that the provided
    configuration parameters are correct and that the external service is reachable.


    ### Flow Description

    1. **Initialization**: The action initializes the Siemplify context and logs the
    start of the process.

    2. **Parameter Extraction**: It retrieves the integration-level configuration
    settings (API Root, API Token, and Verify SSL).

    3. **Manager Setup**: An instance of the `ExabeamAdvancedAnalyticsManager` is
    created using the extracted credentials.

    4. **Connectivity Test**: The manager executes a `test_connectivity` call, which
    sends an HTTP GET request to the `uba/api/ping` endpoint of the Exabeam server.

    5. **Result Handling**: If the request is successful (HTTP 200), the action returns
    a success message and sets the execution state to completed. If an exception occurs,
    the action logs the error and returns a failure status.


    ### Additional Notes

    - This action does not process any entities.

    - It is primarily used during the initial setup or troubleshooting of the Exabeam
    Advanced Analytics integration.
