Add Comments To Entity:
  ai_description: >-
    ### General Description

    Adds comments to specific entities within the Exabeam Advanced Analytics platform.
    This action allows security analysts to document findings or provide context directly
    on entity profiles (Users or Assets) in Exabeam from within Google SecOps. It
    supports IP addresses, Hostnames, and User entities.


    ### Flow Description

    1. **Initialization**: Retrieves the mandatory 'Comment' parameter.

    2. **Entity Filtering**: Iterates through the target entities in the current context,
    filtering for supported types: `USER`, `ADDRESS` (IP), and `HOSTNAME`.

    3. **Existence Check**: For each supported entity, the action queries Exabeam
    Advanced Analytics via a GET request to verify the entity exists in their system.

    4. **Mutation**: If the entity is found, the action performs a POST request to
    the Exabeam API to attach the provided comment to that specific entity.

    5. **Result Reporting**: Tracks successful and failed comment additions, providing
    a summary message and detailed JSON results for each processed entity.


    ### Additional Notes

    - The action maps SecOps entity types to Exabeam's 'user' or 'asset' categories.
  ai_short_description: >-
    Adds a comment to specific user or asset entities in Exabeam Advanced Analytics.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a comment to a user or asset entity profile in Exabeam Advanced Analytics.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to check if the entity exists, and then a POST
      request to Exabeam Advanced Analytics to add a comment to the entity. This mutates
      external data. It does not update internal entities, create insights, or modify
      alert data.
