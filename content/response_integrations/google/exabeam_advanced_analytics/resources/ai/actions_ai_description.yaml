Create Watchlist:
  ai_description: >-
    ### General Description

    Creates a new watchlist in Exabeam Advanced Analytics. This action allows users
    to define a new collection of entities (Users or Assets) with specific access
    controls and descriptions within the Exabeam platform.


    ### Flow Description

    1. Extracts the action parameters (Title, Category, Access Control, Description).

    2. Initializes the Exabeam Advanced Analytics manager.

    3. Maps the user-friendly parameter values for 'Category' and 'Access Control'
    into the specific strings required by the Exabeam API.

    4. Sends a POST request to the Exabeam `uba/api/watchlist` endpoint to create
    the watchlist.

    5. Captures the API response containing the new watchlist's details and adds it
    to the action's JSON results.


