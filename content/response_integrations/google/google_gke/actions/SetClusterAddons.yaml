name: Set Cluster Addons
description: Create an operation to set addons for the Google Kubernetes Engine cluster.
    Action is async. Note that action is not working on Siemplify entities. Additionally,
    if the target cluster is already going under configuration change, new configuration
    changes will not be accepted until current configuration changes finish.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-gke#set_cluster_addons
integration_identifier: GoogleGKE
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project in which to search for clusters in.
        If nothing is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Cluster Location
    default_value: ''
    type: string
    description: 'Specify Google Compute Engine location in which to search for clusters
        in. Example: europe-central2-a'
    is_mandatory: true
-   name: Cluster Name
    default_value: ''
    type: string
    description: Specify Google Kubernetes Engine cluster name.
    is_mandatory: true
-   name: HTTP Load Balancing
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled
    description: Specify the value for the HTTP Load Balancing addon configuration.
    is_mandatory: false
-   name: Horizontal Pod Autoscaling
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled
    description: Specify the value for the Horizontal Pod Autoscaling addon configuration.
    is_mandatory: false
-   name: Network Policy Config
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled
    description: Specify the value for the Network Policy Config addon configuration.
    is_mandatory: false
-   name: Cloud Run Config
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled, Load Balancer Type Unspecified
    - Enabled, Load Balancer Type External
    - Enabled, Load Balancer Type Internal
    description: Specify the value for the Cloud Run Config addon configuration.
    is_mandatory: false
-   name: DNS Cache Config
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled
    description: Specify the value for the DNS Cache Config addon configuration.
    is_mandatory: false
-   name: Config Connector Config
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled
    description: Specify the value for the Config Connector Config addon.
    is_mandatory: false
-   name: GCE Persistent Disk Csi Driver Config
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled
    description: Specify the value for the GCE Persistent Disk Csi Driver Config addon.
    is_mandatory: false
-   name: Wait for cluster configuration change operation to finish
    default_value: false
    type: boolean
    description: If enabled, action will wait for the results of the cluster configuration
        change operation.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/set_cluster_addons_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
