name: Set Cluster Labels
description: Create an operation to set labels for the Google Kubernetes Engine cluster.
    Action is async. Action appends new labels to any existing cluster labels. Note
    that action is not working on Siemplify entities. Additionally, if the target
    cluster is already going under configuration change, new configuration changes
    will not be accepted until current configuration changes finish.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-gke#set_cluster_labels
integration_identifier: GoogleGKE
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project in which to search for clusters in.
        If nothing is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Cluster Location
    default_value: ''
    type: string
    description: 'Specify Google Compute Engine location in which to search for clusters
        in. Example: europe-central2-a'
    is_mandatory: true
-   name: Cluster Name
    default_value: ''
    type: string
    description: Specify Google Kubernetes Engine cluster name.
    is_mandatory: true
-   name: Cluster Labels
    default_value: '{"key1":"value1","key2":"value2"}'
    type: string
    description: Specify a JSON object that contains labels to add to the cluster.
        Please consider default value for the format reference. Action appends new
        labels to any existing cluster labels.
    is_mandatory: true
-   name: Wait for cluster configuration change operation to finish
    default_value: false
    type: boolean
    description: If enabled, action will wait for the results of the cluster configuration
        change operation.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/set_cluster_labels_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
