name: Set Node Autoscaling
description: Create an operation to set node pool autoscaling configuration for the
    Google Kubernetes Engine cluster. Action is async. Note that action is not working
    on Siemplify entities. Additionally, if the target cluster is already going under
    configuration change, new configuration changes will not be accepted until current
    configuration changes finish.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-gke#set_node_autoscaling
integration_identifier: GoogleGKE
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project in which to search for clusters in.
        If nothing is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Cluster Location
    default_value: ''
    type: string
    description: 'Specify Google Compute Engine location in which to search for clusters
        in. Example: europe-central2-a'
    is_mandatory: true
-   name: Cluster Name
    default_value: ''
    type: string
    description: Specify Google Kubernetes Engine cluster name.
    is_mandatory: true
-   name: Node Pool Name
    default_value: ''
    type: string
    description: Specify node pool name for the Google Kubernetes Engine cluster.
    is_mandatory: true
-   name: Autoscaling Mode
    default_value: Not Changed
    type: ddl
    optional_values:
    - Not Changed
    - Disabled
    - Enabled
    description: Specify autoscaling mode status for the node pool.
    is_mandatory: false
-   name: Minimum Node Count
    default_value: ''
    type: string
    description: Specify minimum node count for the node pool configuration.
    is_mandatory: false
-   name: Maximum Node Count
    default_value: ''
    type: string
    description: Specify maximum node count for the node pool configuration.
    is_mandatory: false
-   name: Wait for cluster configuration change operation to finish
    default_value: false
    type: boolean
    description: If enabled, action will wait for the results of the cluster configuration
        change operation.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/set_node_autoscaling_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
