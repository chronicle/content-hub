name: Get Operation Status
description: Get the Google Kubernetes Engine operation status. Action is async. Note
    that action is not working on Siemplify entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-gke#get_operation_status
integration_identifier: GoogleGKE
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project for which to fetch operation status
        for. If nothing is provided, the project will be extracted from integration
        configuration.
    is_mandatory: false
-   name: Location
    default_value: ''
    type: string
    description: 'Specify Google Compute Engine location for which to fetch operation
        status for. Example: europe-central2-a'
    is_mandatory: true
-   name: Operation Name
    default_value: ''
    type: string
    description: Specify Google Compute Engine operation to fetch.
    is_mandatory: true
-   name: Wait for cluster configuration change operation to finish
    default_value: false
    type: boolean
    description: If enabled, action will wait for the results of the cluster configuration
        change operation.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_operation_status_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
