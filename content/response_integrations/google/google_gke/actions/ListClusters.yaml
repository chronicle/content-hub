name: List Clusters
description: List Google Kubernetes Engine clusters based on the specified search
    criteria. Note that action is not working on Siemplify entities. Additionally,
    filtering logic is working based on the cluster name field.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-gke#list_clusters
integration_identifier: GoogleGKE
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project in which to search for clusters in.
        If nothing is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Cluster Location
    default_value: ''
    type: string
    description: 'Specify Google Compute Engine location in which to search for clusters
        in. Example: europe-central2-a'
    is_mandatory: true
-   name: Filter Logic
    default_value: Not Specified
    type: ddl
    optional_values:
    - Not Specified
    - Equal
    - Contains
    description: Specify what filter logic should be applied. Filtering logic is working
        based on the cluster name field.
    is_mandatory: false
-   name: Filter Value
    default_value: ''
    type: string
    description: Specify what value should be used in the filter. If "Equal" is selected,
        action should will try to find the exact match among results and if "Contains"
        is selected, action will try to find results that contain the substring. If
        nothing is provided in this parameter, the filter will not be applied. Filtering
        logic is working based on the cluster name field.
    is_mandatory: false
-   name: Max Records To Return
    default_value: 50
    type: string
    description: Specify how many records to return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_clusters_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
