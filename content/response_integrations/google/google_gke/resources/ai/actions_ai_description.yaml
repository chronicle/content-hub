Set Node Pool Management:
  ai_description: >-
    ### General Description

    Sets the node pool management configuration for a specific Google Kubernetes Engine
    (GKE) cluster. This action allows administrators to enable or disable the Auto
    Upgrade and Auto Repair features for a designated node pool. It is an asynchronous
    action that initiates a configuration change operation in GKE and can optionally
    wait for the operation to complete.


    ### Flow Description

    1. Extracts action parameters and initializes the GKE API, Node, and Operation
    managers using the provided credentials.

    2. Validates that at least one management setting (Auto Upgrade or Auto Repair)
    is scheduled for a change.

    3. If only one setting is being modified, the action fetches the current node
    pool configuration to preserve the existing state of the other setting.

    4. Sends a POST request to the GKE API to update the node pool management settings,
    which creates a GKE operation.

    5. If the user opted to wait for the operation, the action enters an asynchronous
    state, periodically checking the operation's status until it is completed, fails,
    or the action times out.

    6. Returns the operation details as a JSON object and provides a success or failure
    message based on the API response.


    ### Additional Notes

    - At least one of the parameters, Auto Upgrade or Auto Repair, must be set to
    a value other than `Not Changed` for the action to proceed.

    - If only one management feature is being changed, the action automatically retrieves
    the current state of the other feature from the GKE API to ensure it remains unchanged
    during the update.

    - If the target cluster is already undergoing a configuration change, new changes
    may be rejected by GKE until the current operation finishes.
