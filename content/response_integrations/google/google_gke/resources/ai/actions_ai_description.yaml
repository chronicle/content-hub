Set Cluster Addons:
  ai_description: "### General Description\nUpdates the configuration of various addons\
    \ for a Google Kubernetes Engine (GKE) cluster. This action allows administrators\
    \ to enable or disable features like HTTP Load Balancing, Horizontal Pod Autoscaling,\
