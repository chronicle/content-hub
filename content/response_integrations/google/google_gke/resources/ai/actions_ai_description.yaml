List Clusters:
  ai_description: >-
    ### General Description

    Lists Google Kubernetes Engine (GKE) clusters within a specific Google Cloud project
    and location based on search and filtering criteria. This action is designed for
    administrative visibility and does not operate on specific Google SecOps entities.
    It retrieves detailed cluster metadata, including status, versions, and network
    configurations.


    ### Flow Description

    1. **Parameter Extraction and Validation**: The action extracts input parameters
    and ensures that `Max Records To Return` is a positive integer.

    2. **API Interaction**: It initializes the GKE service and performs a GET request
    to the Google Kubernetes Engine API to list clusters for the specified project
    and location.

    3. **Filtering Logic**: If `Filter Logic` (Equal or Contains) and a `Filter Value`
    are provided, the action filters the list of clusters by comparing the `name`
    attribute of each cluster against the filter value.

    4. **Result Limitation**: The resulting list is truncated to match the `Max Records
    To Return` limit.

    5. **Data Presentation**: The action generates a Data Table named "Found Clusters"
    containing flattened cluster details and populates the JSON results with the raw
    cluster data.


    ### Additional Notes

    - This action does not require or process any entities from the Google SecOps
    environment.

    - Filtering is applied locally to the results returned by the GKE API based on
    the cluster's name attribute.
