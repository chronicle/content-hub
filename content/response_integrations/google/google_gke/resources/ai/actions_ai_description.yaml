Set Cluster Labels:
  ai_description: >-
    ### General Description

    Sets or updates labels for a specific Google Kubernetes Engine (GKE) cluster.
    This action is asynchronous and works by appending the provided JSON labels to
    the cluster's existing label set. It first retrieves the current cluster configuration
    to obtain the required label fingerprint and existing labels, merges them with
    the new input, and then submits an update request to the GKE API.


    ### Flow Description

    1. Extracts the Project ID, Cluster Location, Cluster Name, and the JSON-formatted
    labels from the action parameters.

    2. Makes a GET request to the GKE API to fetch the existing cluster details, retrieving
    the current labels and the `labelFingerprint` required for updates.

    3. Merges the provided labels into the existing label dictionary to ensure no
    existing data is overwritten unless explicitly specified in the input.

    4. Makes a POST request to the GKE API to update the cluster labels using the
    merged set and the fingerprint.

    5. If 'Wait for cluster configuration change operation to finish' is disabled,
    returns the operation details immediately.

    6. If 'Wait for cluster configuration change operation to finish' is enabled,
    enters an asynchronous loop, checking the operation status until it reaches a
    'DONE' state or the SOAR execution deadline is reached.

    7. Provides the final operation status and details in the JSON result.


    ### Additional Notes

    This action does not operate on Siemplify entities. If the target cluster is already
    undergoing a configuration change, new configuration changes will not be accepted
    until the current configuration changes finish.
