Set Node Autoscaling:
  ai_description: >-
    ### General Description

    Sets the node pool autoscaling configuration for a specific Google Kubernetes
    Engine (GKE) cluster. This action allows users to enable or disable autoscaling
    and define the minimum and maximum node counts for a designated node pool. It
    operates asynchronously, meaning it creates a configuration change operation in
    GKE and can optionally wait for that operation to complete.


    ### Flow Description

    1. Extracts the cluster identifiers and desired autoscaling settings from the
    input parameters.

    2. Validates that at least one autoscaling parameter is being modified.

    3. Sends a POST request to the GKE API's `setAutoscaling` endpoint for the specified
    node pool to apply the new configuration.

    4. If the wait parameter is disabled, returns success immediately after the operation
    is created.

    5. If the wait parameter is enabled, enters an asynchronous loop, periodically
    checking the operation status via GET requests until it reaches a 'DONE' state
    or the execution deadline is reached.

    6. Returns the final operation details as a JSON result.


    ### Additional Notes

    At least one configuration change (Autoscaling Mode, Minimum Node Count, or Maximum
    Node Count) must be provided for the action to execute. This action does not run
    on SOAR entities; it relies entirely on the provided input parameters. If the
    cluster is already undergoing a configuration change, new changes may be rejected
    until the current one finishes.
