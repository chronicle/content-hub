Get Operation Status:
  ai_description: "### General Description\nRetrieves the status and details of a\
    \ specific Google Kubernetes Engine (GKE) operation. This action is designed to\
    \ track the progress of long-running tasks such as cluster updates, node pool\
    \ modifications, or deletions. It operates asynchronously, meaning it can be configured\
    \ to poll the GKE API until the operation reaches a terminal state (DONE) or the\
    \ action times out.\n\n### Flow Description\n1. **Initialization**: The action\
    \ extracts the Project ID, Location, and Operation Name from the input parameters\
    \ and initializes the GKE API manager.\n2. **Status Retrieval**: It performs a\
    \ GET request to the GKE API to fetch the current details of the specified operation.\n\
    3. **Execution Mode Check**: \n    - If 'Wait for cluster configuration change\
    \ operation to finish' is **False**, the action completes immediately, returning\
    \ the current operation details.\n    - If 'Wait...' is **True**, the action checks\
    \ if the operation status is terminal (e.g., 'DONE').\n4. **Async Polling**: If\
    \ the operation is still 'PENDING' or 'RUNNING' and the wait flag is set, the\
    \ action enters an 'In Progress' state, saving the operation name to be checked\
    \ again in subsequent runs.\n5. **Completion**: Once the operation is finished\
    \ or the polling stops, the full JSON response of the operation is attached to\
    \ the action results.\n\n### Additional Notes\n- This action does **not** run\
    \ on entities. It is a utility action used to monitor the state of the infrastructure.\n\
    - When 'Wait for cluster configuration change operation to finish' is enabled,\
    \ the action utilizes the SOAR's async mechanism to check the status periodically."
  ai_short_description: >-
    Retrieves the status and details of a specific Google Kubernetes Engine (GKE)
    operation, optionally polling asynchronously until completion.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the GKE API to fetch the status of a specific
      operation. It does not mutate external data, update internal entities, or create
      insights.
