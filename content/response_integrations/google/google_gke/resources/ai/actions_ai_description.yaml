    The **Ping** action is designed to verify the connectivity between Google SecOps
    and the Google Kubernetes Engine (GKE) service. It ensures that the integration
    configuration parameters, such as API credentials, Project ID, and Location ID,
    are correctly configured and that the environment has the necessary network access
    to reach the GKE API endpoints.


    ### Flow Description

    1. **Initialization**: The action initializes the GKE API manager using the authentication
    credentials and configuration details provided in the integration settings.

    2. **Connectivity Test**: It executes a `GET` request to the GKE API's `clusters`
    endpoint for the specified project and location.

    3. **Validation**: The action validates the HTTP response from the GKE service.
    If the request is successful, it confirms that the connection is established.
    If it fails, it raises a descriptive error based on the API response.


    ### Additional Notes

    - This action is typically used during the initial setup of the integration or
    for troubleshooting connectivity issues.

