Simple ES Search:
  ai_description: >-
    ### General Description

    This action performs a search across Elasticsearch indices using Lucene query
    syntax. It is designed for general data retrieval where a time range is not required.
    The action retrieves raw documents, flattens them for readability, and presents
    the results both as a structured data table and raw JSON.


    ### Flow Description

    1. Connects to the Elasticsearch server using the provided integration credentials
    and SSL configuration.

    2. Executes a `query_string` search against the specified `Index` using the provided
    `Query` and `Limit` parameters.

    3. If hits are returned, iterates through the results and flattens the dictionary
    structures.

    4. Creates a CSV-formatted data table from the flattened results and adds it to
    the case wall.

    5. Attaches the raw search results as a JSON object to the action result.


    ### Additional Notes

    - This action does not support time-range filtering. For time-sensitive queries,
    use the 'Advanced ES Search' action.

    - The action flattens nested JSON structures from Elasticsearch to ensure they
    are compatible with the SOAR data table view.
