Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the Akamai server using the provided connection parameters.
    This action is used to verify that the SOAR platform can successfully authenticate
    and communicate with the Akamai API.


    ### Flow Description

    1. **Initialize API Client**: The action initializes the Akamai API client using
    the integration's configuration parameters.

    2. **Test Connectivity**: It executes a GET request to the Akamai contracts endpoint
    (`/network-list/v2/network-lists?limit=1`) to verify the validity of the credentials
    and network access.

    3. **Validate Response**: The action validates the HTTP response. If the request
    is successful, it returns a success message. If the request fails, it raises an
    exception and returns an error message.


    ### Additional Notes

    This action is primarily used for diagnostic purposes during integration setup
    or troubleshooting to ensure network reachability and credential validity.
