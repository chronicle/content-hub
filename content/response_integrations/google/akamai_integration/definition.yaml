identifier: Akamai
name: Akamai
parameters:
-   name: Host
    default_value: https://{host}
    type: string
    description: The hostname of Akamai instance.
    is_mandatory: true
    integration_identifier: Akamai
-   name: Client Token
    default_value: ''
    type: password
    description: The Akamai Client token.
    is_mandatory: true
    integration_identifier: Akamai
-   name: Client Secret
    default_value: ''
    type: password
    description: The Akamai Client Secret.
    is_mandatory: true
    integration_identifier: Akamai
-   name: Access Token
    default_value: ''
    type: password
    description: The Akamai Access token.
    is_mandatory: true
    integration_identifier: Akamai
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the integration validates the SSL certificate when connecting
        to Akamai. Selected by default.
    is_mandatory: true
    integration_identifier: Akamai
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/akamai
categories:
- Cloud
- WAF
