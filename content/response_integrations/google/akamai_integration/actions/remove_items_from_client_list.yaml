name: Remove Items From Client List
description: Use the Remove Items From Client List action to remove items from the
    client list in Akamai.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/akamai#remove_items_from_client_list
integration_identifier: Akamai
parameters:
-   name: Client List Name
    default_value: ''
    type: string
    description: Name of the client list that needs to be updated. If both "Client
        List Name" and "Client List ID" are provided, action will work with ID.
    is_mandatory: false
-   name: Client List ID
    default_value: ''
    type: string
    description: ID of the client list that needs to be updated. If both "Client List
        Name" and "Client List ID" are provided, action will work with ID.
    is_mandatory: false
-   name: Item Value
    default_value: ''
    type: string
    description: Comma-separated list of items that need to be removed from the network
        list.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/remove_items_from_client_list_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
