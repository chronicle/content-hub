name: TenableIO - Vulnerabilities Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: event_type
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: PythonProcessTimeout
    default_value: 300
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Root
    default_value: https://cloud.tenable.com
    type: string
    description: API Root of the Tenable.io instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Access Key
    default_value: ''
    type: password
    description: Access Key of the Tenable.io instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Secret Key
    default_value: ''
    type: password
    description: Secret Key of the Tenable.io instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Tenable.io server is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity To Fetch
    default_value: Medium
    type: integer
    description: 'Lowest severity that will be used to fetch vulnerabilities. If nothing
        is provided, the connector will fetch all vulnerabilities. Possible values:
        Info, Low, Medium, High, Critical'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Status Filter
    default_value: open, reopened
    type: string
    description: 'Status filter for the connector. It works with comma-separated values.
        If nothing is provided, the connector will ingest vulnerabilities with "open",
        "reopened" statuses. Possible values: open, reopened, fixed.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Days Backwards
    default_value: 30
    type: integer
    description: 'Number of days before the first connector iteration to retrieve
        vulnerabilities from. This parameter applies to the initial connector iteration
        after you enable the connector for the first time, or used as a fallback value
        in cases where connector''s last run timestamp expires. Default: 30 days.
        Note: this parameter will return vulnerabilities that were opened/reopened/fixed
        in the timeframe that is specified in "Max Days Backwards".'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Grouping Mechanism
    default_value: Host
    type: string
    description: 'Grouping mechanism that will be used to create Siemplify Alerts.
        Possible values: Host, Vulnerability, None. If Host is provided, the connector
        will create 1 Siemplify alert containing all of the vulnerabilities per chunk
        related to the host. If Vulnerability is provided, the connector will create
        1 Siemplify Alert containing information about all of the hosts that have
        that vulnerability in the scope of 1 chunk. If None or invalid value is provided,
        the connector will create a new Siemplify alert for each separate vulnerability
        per host.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Use whitelist as a blacklist
    default_value: false
    type: boolean
    description: If enabled, whitelist will be used as a blacklist.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: false
    mode: script
description: 'Pull vulnerabilities from Tenable.io. Note: connector works with plugin
    families in whitelist.'
integration: TenableIO
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tenableio#tenable-io-vulnerabilities-connector
rules: []
is_connector_rules_supported: false
creator: admin
