name: Scan Endpoints
description: 'Initiate a scan on endpoints in Tenable.io. Supported entities: IP Address,
    Hostname. Note: Action is running as async, please adjust script timeout value
    in Siemplify IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tenableio#scan_endpoints
integration_identifier: TenableIO
parameters:
-   name: Scan Name
    default_value: ''
    type: string
    description: Specify the name of the scan.
    is_mandatory: true
-   name: Policy Name
    default_value: ''
    type: string
    description: Specify the name of the policy that needs to be used for scanning.
    is_mandatory: true
-   name: Scanner Name
    default_value: ''
    type: string
    description: Specify the name of the scanner that should be used. If nothing is
        provided, action will use the default scanner from configuration.
    is_mandatory: false
-   name: Send Report To
    default_value: ''
    type: string
    description: Specify a comma-separated list of email addresses that need to receive
        the scan report.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/scan_endpoints_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
simulation_data_json: '{"Entities": ["ADDRESS", "HOSTNAME"]}'
