name: List Endpoint Vulnerabilities
description: 'List endpoint vulnerabilities in Tenable.io. Supported entities: IP
    Address, Hostname.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/tenableio#list_endpoint_vulnerabilities
integration_identifier: TenableIO
parameters:
-   name: Lowest Severity To Fetch
    default_value: Info
    type: ddl
    optional_values:
    - Info
    - Low
    - Medium
    - High
    - Critical
    description: Specify the lowest severity that will be used to fetch vulnerabilities.
    is_mandatory: false
-   name: Max Vulnerabilities To Return
    default_value: 50
    type: string
    description: 'Specify how many vulnerabilities to return per entity. Default:
        50. Maximum: 200.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_endpoint_vulnerabilities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities": ["ADDRESS", "HOSTNAME"]}'
