List Policies:
  ai_description: >-
    ### General Description

    The **List Policies** action retrieves a list of available scan policies from
    the Tenable.io platform. This action is primarily used for information gathering
    and configuration discovery, allowing users to see which security policies are
    defined and available for use in automated scanning workflows.


    ### Flow Description

    1. **Initialization**: The action initializes the Tenable.io manager using the
    provided integration configuration credentials.

    2. **Data Retrieval**: It executes a GET request to the Tenable.io API (`/policies`)
    to fetch the complete list of available scan policies.

    3. **Filtering**: If a `Filter Value` is provided, the action iterates through
    the retrieved policies and applies the selected `Filter Logic` (Equal or Contains)
    against the policy names.

    4. **Limiting**: The resulting list is truncated to match the `Max Policies To
    Return` parameter (capping at 100 if the input exceeds the maximum).

    5. **Output**: The filtered list of policies is presented as a data table named
    "Available Policies" and also returned as a JSON object for use in subsequent
    playbook steps.


    ### Additional Notes

    - This action does not operate on specific entities and retrieves global configuration
    data from the Tenable.io instance.

    - If no policies match the provided criteria, the action will complete successfully
