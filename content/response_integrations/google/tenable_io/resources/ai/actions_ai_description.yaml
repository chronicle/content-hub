Scan Endpoints:
  ai_description: >-
    ### General Description

    Initiates a vulnerability scan on specific endpoints (IP Addresses or Hostnames)
    using Tenable.io. This action is asynchronous, meaning it triggers the scan and
    then periodically checks for completion before retrieving the final results. It
    is useful for on-demand security assessments of suspicious hosts identified during
    an investigation.


    ### Flow Description

    1. **Validation**: The action first validates the provided `Policy Name` and `Scanner
    Name` (if provided) by querying the Tenable.io API to ensure they exist.

    2. **Entity Resolution**: If Hostname entities are present, the action fetches
    all assets from Tenable.io to map these hostnames to their corresponding IP addresses.

    3. **Scan Creation**: A new scan is created in Tenable.io using the specified
    policy, target IPs, and optional scanner/email settings.

    4. **Scan Launch**: The action triggers the execution of the created scan.

    5. **Status Monitoring (Async)**: The action enters an asynchronous loop, checking
    the scan status at intervals. It waits for the status to reach 'completed'.

    6. **Data Retrieval**: Once completed, the action retrieves the scan results,
    including vulnerability counts and severity levels.

    7. **Output**: The results are attached to the case as a JSON object and a 'Scan
    Results' data table.


    ### Additional Notes

    - This action is **asynchronous**. It will remain in an 'In Progress' state until
    the scan completes in Tenable.io or the timeout is reached.

    - Hostname entities are resolved to IP addresses by fetching the asset list from
    Tenable.io. If a hostname cannot be mapped to an IP, it will be skipped.
  ai_short_description: >-
    Initiates an asynchronous vulnerability scan on specific endpoints (IP Addresses
    or Hostnames) using Tenable.io and retrieves the results upon completion.
