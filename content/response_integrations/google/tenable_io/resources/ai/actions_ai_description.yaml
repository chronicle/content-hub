    \ details from Tenable.io for a specified list of plugin IDs. This action is used\
    \ to gather deep context about specific vulnerabilities, including their synopsis,\
    \ solution, severity, and plugin family. The retrieved data is presented as a\
    \ JSON result, a data table, and optionally as a case insight for better visibility\
    \ within the investigation.\n\n### Flow Description\n1. **Parameter Extraction:**\
    \ The action retrieves the user-provided list of Plugin IDs and the 'Create Insight'\
    \ flag.\n2. **API Interaction:** For each provided Plugin ID, the action sends\
    \ a GET request to the Tenable.io Workbenches API (`/workbenches/vulnerabilities/{plugin_id}/info`)\
    \ to fetch vulnerability information.\n3. **Data Processing:** The response for\
    \ each plugin is parsed into a structured data model, capturing fields like synopsis,\
    \ solution, and severity.\n4. **Output Generation:** \n    * A JSON result containing\
    \ the raw details is attached to the action output.\n    * A data table named\
    \ 'Vulnerability Details' is created for quick reference in the case wall.\n \
    \   * If 'Create Insight' is enabled, a Case Insight is created, formatted with\
    \ HTML and color-coded by severity.\n\n### Additional Notes\n* This action does\
    \ not process entities from the case; it relies entirely on the 'Plugin IDs' input\
