List Endpoint Vulnerabilities:
  ai_description: >-
    ### General Description

    This action retrieves a list of vulnerabilities for specific endpoint entities
    (IP Addresses and Hostnames) by querying the Tenable.io platform. It maps Google
    SecOps entities to Tenable assets and fetches associated vulnerability data based
    on user-defined severity filters and result limits. The retrieved information
    is presented as entity-specific tables and raw JSON for further analysis.


    ### Flow Description

    1. **Initialization**: The action extracts configuration parameters (API Root,
    Keys) and action parameters (Severity, Limit).

    2. **Asset Mapping**: It initiates an asset export from Tenable.io (via a POST
    request to `assets/v2/export`) to build a local map of all assets, allowing it
    to correlate SecOps entities with Tenable's internal asset identifiers.

    3. **Entity Processing**: For each provided IP or Hostname entity, the action
    attempts to find a matching asset in the Tenable map using identifiers like IP,
    Hostname, FQDN, or NetBIOS name.

    4. **Vulnerability Retrieval**: For every matched asset, the action queries the
    Tenable.io API (via a GET request to `/workbenches/assets/{asset_id}/vulnerabilities`)
    to fetch vulnerabilities that meet the 'Lowest Severity To Fetch' criteria.

    5. **Data Enrichment**: The retrieved vulnerabilities (up to the specified limit)
    are formatted into a table and attached to the entity. The raw data is also added
    to the action's JSON results.

    6. **Final Reporting**: The action concludes by providing a summary message indicating
    which entities were successfully enriched, which were not found, and which had
    no vulnerabilities.


    ### Additional Notes

    - The action performs a comprehensive asset export from Tenable.io at the start
    to ensure accurate mapping between SecOps entities and Tenable asset IDs.

    - If an entity is not found in the Tenable.io asset database, it will be reported
    as 'not found' in the final output message.

    - The action supports both IP Address and Hostname entity types.
  ai_short_description: >-
    Retrieves a list of vulnerabilities for specific endpoint entities (IP Addresses
    and Hostnames) by querying the Tenable.io platform and attaching the results as
    entity tables.
