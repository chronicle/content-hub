List Plugin Families:
  ai_description: >-
    ### General Description

    The **List Plugin Families** action retrieves a list of available plugin families
    from the Tenable.io platform. This utility action allows users to explore the
    categories of vulnerability checks available in their Tenable environment. It
    supports filtering results by name and limiting the total number of records returned.


    ### Flow Description

    1. **Initialization**: The action initializes the Tenable.io manager using the
    provided API credentials.

    2. **API Request**: It performs a GET request to the Tenable.io `/plugins/families`
    endpoint to retrieve all available plugin families.

    3. **Filtering**: If a `Filter Value` is provided, the script filters the retrieved
    list based on the selected `Filter Logic` (checking for an exact match or if the
    name contains the substring).

    4. **Limiting**: The resulting list is truncated to match the `Max Plugin Families
    To Return` parameter.

    5. **Output Generation**: The filtered list is converted into a data table named
    "Available Plugin Families" and also attached as a JSON result for downstream
    use in the playbook.


    ### Additional Notes

    - This action is a read-only operation and does not interact with or require any
    entities (IPs, Hostnames, etc.) from the Google SecOps case context.

    - If no results match the filter, the action will return a successful status but
    indicate that no families were found.
