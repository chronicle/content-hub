Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is designed to verify the connectivity between Google SecOps
    and the Tenable.io platform. It ensures that the provided credentials (Access
    Key and Secret Key) and the API Root URL are correct and that the network path
    is open.


    ### Flow Description

    1. **Initialization**: The action retrieves the global configuration parameters
    (API Root, Keys, and SSL settings) from the integration settings.

    2. **Manager Setup**: It initializes the `TenableIOManager` with the provided
    credentials and session headers.

    3. **Connectivity Test**: It executes the `test_connectivity` method, which sends
    a GET request to the `/plugins/families` endpoint of the Tenable.io API to verify
    the API keys and network access.

    4. **Validation**: The response is validated. If the status code is successful
    (2xx), the action completes with a success message.

    5. **Error Handling**: If the request fails or an exception occurs, the action
    reports a failure with the corresponding error details.


    ### Additional Notes

    This action is typically used during the initial setup or troubleshooting of the
    Tenable.io integration to confirm that the environment is correctly configured.
    It does not process any entities.
