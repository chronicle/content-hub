Enrich Entities:
  ai_description: >-
    ### General Description

    The **Enrich Entities** action retrieves comprehensive asset information from
    Tenable.io to enrich IP Address and Hostname entities within Google SecOps. It
    leverages Tenable's asset export API to match local entities against Tenable's
    managed assets using various identifiers such as IPv4/IPv6 addresses, FQDNs, Hostnames,
    NetBIOS names, and Agent names. The action provides deep visibility into the asset's
    operating system, network interfaces, tags, and last seen timestamps.


    ### Flow Description

    1. **Initialization**: Authenticates with Tenable.io using the provided API keys
    and configuration.

    2. **Data Retrieval**: Initiates a bulk asset export job in Tenable.io, polls
    for completion, and downloads all asset data chunks.

    3. **Mapping**: Processes the downloaded assets to create a lookup map indexed
    by all possible identifiers (IPs, Hostnames, etc.).

    4. **Entity Matching**: Iterates through the target entities in the case, attempting
    to find a match in the Tenable asset map.

    5. **Enrichment**: For matched entities, it updates additional properties, marks
    the entity as enriched, and adds a data table to the entity.

    6. **Insight Creation**: If configured, generates a formatted insight for each
    successfully matched entity.

    7. **Finalization**: Updates the entities in the Google SecOps platform and returns
    a summary of successful and failed enrichments.


    ### Additional Notes

    - The action performs a bulk export of assets from Tenable.io and builds an internal
    map for efficient matching.

    - It supports 'short name' matching for Hostnames (e.g., matching 'host' if the
    entity is 'host.domain.com').

    - Enrichment data is added to the entity's additional properties with the prefix
    `TenableIO`.
  ai_short_description: >-
    Enriches IP Address and Hostname entities using asset information from Tenable.io,
    providing details such as operating system, network interfaces, and tags.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
