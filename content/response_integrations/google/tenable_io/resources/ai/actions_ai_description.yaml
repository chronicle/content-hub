List Scanners:
  ai_description: >-
    ### General Description

    Lists available scanners from the Tenable.io platform. This utility action allows
    users to retrieve a list of scanners configured in their Tenable.io instance,
    providing details such as scanner name, type, and current status. It supports
    optional filtering to narrow down results based on the scanner's name.


    ### Flow Description

    1. **Initialization**: The action initializes the Tenable.io manager using the
    provided API credentials.

    2. **Data Retrieval**: It performs a GET request to the Tenable.io `/scanners`
    endpoint to fetch all available scanners.

    3. **Filtering**: If a 'Filter Value' is provided, the action iterates through
    the retrieved scanners and applies the selected 'Filter Logic' (Equal or Contains)
    against the scanner names.

    4. **Limiting**: The resulting list is truncated to match the 'Max Scanners To
    Return' parameter.

    5. **Output**: The filtered list of scanners is formatted into a data table named
    'Available Scanners' and also returned as a JSON result for downstream use.


    ### Additional Notes

    - This action does not require or process any Google SecOps entities.

    - If the 'Max Scanners To Return' exceeds 100, the action automatically caps the
    result set at 100.
