[project]
name = "Intezer"
version = "16.0"
description = "Intezer Integration for Google SecOps SOAR enables security teams to automate the analysis, detection, and response of threats by integrating Intezer's technology into their Google SecOps workflows"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.12.3",
    "environmentcommon",
    "google-auth>=2.35.0",
    "requests==2.32.4",
    "soupsieve==2.6",
    "tipcommon",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-mock>=3.14.1",
    "soar-sdk",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.1.3.2-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"
