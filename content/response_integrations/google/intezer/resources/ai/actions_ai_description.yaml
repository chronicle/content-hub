Unset Index File:
  ai_description: >-
    ### General Description

    Unsets the indexing for specific file hashes in Intezer. This action allows users
    to remove the classification (trusted or malicious) previously assigned to a file
    within the Intezer platform. It is useful for correcting false positives or updating
    the status of a file as new intelligence becomes available.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves the API configuration and the optional
    `SHA256` hash list from the action parameters.

    2. **Entity Collection**: Identifies all `FILEHASH` entities in the current context
    and combines their identifiers with any hashes provided in the `SHA256` input
    parameter.

    3. **Deduplication**: Creates a unique set of hashes to ensure each is processed
    only once.

    4. **API Interaction**: For each hash, the action sends a `DELETE` request to
    the Intezer API endpoint (`/files/{sha256}/index`) to remove its indexing.

    5. **Result Tracking**: Tracks which hashes were successfully unset and which
    encountered errors (such as the hash not being found in Intezer).

    6. **Final Reporting**: Updates the action output message with a summary of successful
    and failed operations and sets the action result to true if at least one hash
    was successfully processed.


    ### Additional Notes

    If no `SHA256` parameter is provided, the action will solely process `FILEHASH`
    entities found in the case context.
