Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic tool designed to verify the connectivity between
    Google SecOps and the Intezer service. It ensures that the provided API credentials
    and connection settings are correct and that the Intezer API is reachable.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the integration-level settings
    (API Root, API key, and Verify SSL).

    2. **Manager Initialization**: It initializes the `IntezerManager`, which performs
    an authentication flow by sending a POST request to the `get-access-token` endpoint
    to obtain a Bearer token.

    3. **Connectivity Test**: The action calls the `test_connectivity` method, which
    sends a GET request to the `is-available` endpoint of the Intezer API.

    4. **Validation**: If the API responds with a success status code, the action
    confirms a successful connection. Otherwise, it raises an error indicating a connection
    failure.


