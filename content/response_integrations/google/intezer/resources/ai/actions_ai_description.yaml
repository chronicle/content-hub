Detonate File:
  ai_description: >-
    ### General Description

    Submits local files to Intezer for detonation and analysis. This action uploads
    the specified files to the Intezer platform and returns unique analysis identifiers
    for tracking the analysis status.


    ### Flow Description

    1. Extracts the `File Path` and `Related Alert ID` parameters.

    2. Validates that the provided file paths exist on the local system.

    3. Iterates over each file path and performs a multipart POST request to the Intezer
    API (`/analyze`) to upload the file.

    4. Collects the `analysis_id`, `analysis_status`, and `analysis_type` from the
    API response.

    5. Returns a summary message and the JSON results containing the analysis details.


    ### Additional Notes

    The action requires the files to be accessible locally on the system where the
    action is executed.
  ai_short_description: >-
    Submits local files to the Intezer platform for detonation and analysis, returning
    the analysis identifiers.
