Detonate URL:
  ai_description: >-
    ### General Description

    The **Detonate URL** action submits suspicious URLs to the Intezer platform for
    deep analysis and detonation. It is designed to initiate the analysis process
    for URLs identified within a security case or provided manually as input parameters.
    This action is a critical step in the triage process, allowing security analysts
    to determine the nature of a URL by leveraging Intezer's analysis engine.


    ### Flow Description

    1. **Initialization**: The action extracts the necessary API configuration and
    the optional `Url` parameter.

    2. **Entity Collection**: It scans the target entities in the Google SecOps context
    for entities of type `URL` or `DestinationURL`.

    3. **Target Consolidation**: The action combines the identifiers from the discovered
    entities with the URLs provided in the `Url` parameter, ensuring a unique list
    of URLs for analysis.

    4. **API Interaction**: For each unique URL, the action performs a POST request
    to the Intezer API to trigger the detonation and analysis process.

    5. **Result Handling**: The action captures the `analysis_id`, `analysis_status`,
    and `analysis_type` for each submitted URL. It then populates the JSON results
    and provides a summary message indicating which URLs were successfully submitted
    and which failed.


    ### Additional Notes

    This action only initiates the analysis (detonation). It does not wait for the
    analysis to complete. To retrieve the final analysis results, users should use
    the 'Get URL Report' action once the analysis status reaches a terminal state
    (e.g., 'succeeded').
