Get File Report:
  ai_description: >-
    ### General Description

    Retrieves a comprehensive file analysis report from Intezer based on a provided
    Analysis ID or File Hash. This action is designed to fetch detailed threat intelligence,
    including the analysis verdict, associated IOCs (network and file), dynamic TTPs,
    and code reuse metadata. It supports asynchronous execution, allowing the action
    to poll for results if the analysis is still in progress.


    ### Flow Description

    1. **Initialization**: Extracts API configuration and action parameters.

    2. **Target Identification**: Identifies the target items for analysis. It prioritizes
    file hashes (from parameters and FILEHASH entities) over Analysis IDs.

    3. **API Request**: For each target, it calls the Intezer API to retrieve the
    main analysis report.

    4. **Data Enrichment**: If a report is found, the action performs supplemental
    API calls to fetch associated IOCs, dynamic TTPs, and sub-analysis details (including
    root code reuse and metadata).

    5. **Async Handling**: If 'Wait For Completion' is true and any analysis is still
    pending, the action saves its state and enters an 'In Progress' execution state
    to poll in the next interval.

    6. **Result Aggregation**: Once data is retrieved or the polling finishes, it
    aggregates all analysis components into a single JSON result and provides a summary
    message.


    ### Additional Notes

    * Either **Analysis ID** or **File Hash** (or the presence of **FILEHASH** entities)
    must be provided for the action to execute.

    * The action uses an asynchronous polling mechanism if 'Wait For Completion' is
    enabled and the analysis status is 'in_progress' or 'queued'.
  ai_short_description: >-
    Retrieves a comprehensive file analysis report from Intezer based on a provided
