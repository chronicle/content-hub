Submit Hash:
  ai_description: >-
    ### General Description

    Submits file hashes to the Intezer Analyze platform for threat analysis and enriches
    the corresponding entities with the results. This action operates asynchronously,
    first checking if a hash has already been analyzed. If not, it submits the hash
    to trigger a new analysis. Once the analysis is complete, it retrieves the report,
    updates the entity's metadata, and marks the entity as suspicious if the verdict
    is malicious or suspicious.


    ### Flow Description

    1. **Initial Check:** The action iterates through all FILEHASH entities and checks
    the Intezer API to see if an analysis report already exists for each hash.

    2. **Submission:** If a report exists, it is queued for retrieval. If no report
    exists, the action submits the hash to Intezer to initiate a new analysis.

    3. **Async Monitoring:** Because analysis takes time, the action enters an asynchronous
    state, periodically polling the Intezer API to check if the pending analyses are
    finished.

    4. **Data Retrieval:** Once all analyses are complete, the action fetches the
    full reports (including verdicts and family names).

    5. **Enrichment:** For each entity, the action flattens the report data and adds
    it to the entity's additional properties. It also sets the `is_enriched` flag
    to true.

    6. **Risk Assessment:** If the Intezer verdict is `malicious` or `suspicious`,
    the action updates the entity's status to `is_suspicious = True`.

    7. **Output:** The action adds a CSV-formatted data table to each entity and provides
    a final JSON result containing the full analysis details.


    ### Additional Notes

    - This action operates asynchronously.
  ai_short_description: >-
    Submits file hashes to the Intezer Analyze platform for threat analysis and enriches
    the corresponding entities with the results.
