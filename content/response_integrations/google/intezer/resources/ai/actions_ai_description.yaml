Index File:
  ai_description: >-
    ### General Description

    The **Index File** action allows users to index file hashes into their Intezer
    organizational database. This process classifies file hashes as either **trusted**
    or **malicious**, helping to refine future analysis results and organizational
    intelligence within the Intezer platform.


    ### Flow Description

    1. **Initialization**: The action retrieves the API configuration and action parameters.

    2. **Entity Collection**: It identifies all `FILEHASH` entities in the current
    context and combines them with any hashes provided in the `SHA256` parameter.

    3. **Indexing Initiation**: For each unique hash, the action sends a POST request
    to the Intezer API (`files/{sha256}/index`) to begin the indexing process based
    on the specified classification.

    4. **Asynchronous Polling**: The action enters a polling state, checking the status
    of each indexing task at regular intervals via GET requests to the Intezer API
    (`files/index/{index_id}`).

    5. **Completion**: Once all tasks are finished (succeeded or failed), the action
    provides a summary of the results and attaches the raw JSON response to the action
    output.


    ### Additional Notes

    - If the **Index As** parameter is set to `malicious`, the **Family Name** parameter
    becomes mandatory.

    - This is an asynchronous action that will poll Intezer until the indexing process
    is complete or the timeout is reached.
