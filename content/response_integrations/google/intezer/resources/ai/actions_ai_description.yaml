Submit Suspicious Email:
  ai_description: >-
    ### General Description

    Submits a suspicious phishing email in a raw format (.MSG or .EML) to Intezer
    for processing. This action allows users to upload email files directly from a
    specified file path to the Intezer platform to initiate a security analysis and
    generate an alert.


    ### Flow Description

    1. Retrieves the local path for the email file from the action parameters.

    2. Authenticates with the Intezer API to obtain an access token.

    3. Performs a POST request to the Intezer binary ingestion endpoint (`alerts/ingest/binary`),
    uploading the email file with the source set to 'phishing_emails'.

    4. Captures the `alert_id` from the API response and returns it as the action's
    JSON result.


    ### Additional Notes

    * This action does not run on entities; it requires a direct file path to be provided
    as an input parameter.

    * The action returns an `alert_id` which can be used in subsequent actions to
    track the analysis status or retrieve results.
