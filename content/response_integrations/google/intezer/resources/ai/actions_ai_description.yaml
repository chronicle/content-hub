Get URL Report:
  ai_description: >-
    ### General Description

    Retrieves detailed URL analysis reports from Intezer based on provided Analysis
    IDs. This action is used to fetch the results of previously submitted URL scans
    to understand the verdict, risk scores, and associated indicators.


    ### Flow Description

    1. **Initialization**: The action extracts the list of Analysis IDs and the 'Wait
    For Completion' flag from the input parameters.

    2. **Status Query**: It iterates through the provided IDs and requests the current
    status and report for each from the Intezer API via a GET request.

    3. **Result Processing**: For completed analyses, the action retrieves the full
    report content and adds it to the result set. It handles various statuses including
    success, in-progress, queued, failed, and expired.

    4. **Asynchronous Polling**: If 'Wait For Completion' is enabled and some analyses
    are still pending, the action enters an asynchronous state to continue polling
    in subsequent iterations.

    5. **Finalization**: Once all items are processed (or if polling is not requested),
    the action outputs the collected reports as JSON and provides a summary message
    of the results.


    ### Additional Notes

