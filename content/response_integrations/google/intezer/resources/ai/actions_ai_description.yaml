Get Alert:
  ai_description: >-
    ### General Description

    Retrieves comprehensive triage and response information for a specific alert from
    Intezer using its unique Alert ID. This action allows users to fetch detailed
    analysis results, including raw alert data, device information, behavior analysis,
    and recommended response actions. It is particularly useful for automated workflows
    that need to ingest Intezer's analysis results for further processing or decision-making
    within Google SecOps.


    ### Flow Description

    1. **Initialization**: Authenticates with the Intezer API using the provided API
    credentials.

    2. **Alert Retrieval**: Sends a request to the Intezer API (`alerts/get-by-id`)
    to fetch the alert details associated with the provided `Alert ID`.

    3. **Status Check**: Evaluates the current status of the alert (e.g., succeeded,
    in_progress, queued).

    4. **Execution Path Selection**:
        - If `Wait For Completion` is `false`, the action saves the current response
    and finishes immediately.
        - If `Wait For Completion` is `true` and the status is "in_progress" or "queued",
    the action transitions to an asynchronous polling state.
    5. **Polling (Async)**: In subsequent runs, the action continues to check the
    alert status until it reaches a terminal state ("succeeded" or "failed").

    6. **Output**: Once finished, the action attaches the full alert data as a JSON
    result and provides a success message to the UI.


    ### Additional Notes

    - This action does not process entities from the current context; it relies solely
    on the provided `Alert ID` parameter.

    - If `Wait For Completion` is set to `false`, the action may return partial results
    if the analysis is still ongoing in Intezer.

    - The action supports asynchronous execution when polling for completion is requested.
  ai_short_description: >-
    Retrieves comprehensive triage and response information for a specific alert from
    Intezer using its unique Alert ID.
