Detonate Hash:
  ai_description: >-
    ### General Description

    The **Detonate Hash** action submits file hashes (MD5, SHA1, or SHA256) to the
    Intezer Analyze platform to initiate a deep file analysis. This action is primarily
    used to trigger the detonation process for specific file identifiers to determine
    their nature, such as whether they are malicious or trusted, and to identify their
    code origins.


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves the 'File Hash' action parameter.

    2. **Entity Identification:** It identifies all entities of type `FILEHASH` within
    the current Google SecOps context.

    3. **Data Consolidation:** It combines the hashes from the action parameters and
    the identified entities into a unique set to avoid redundant processing.

    4. **Validation:** Each hash is validated against standard length requirements
    for MD5 (32), SHA1 (40), and SHA256 (64) characters.

    5. **External API Interaction:** For each valid hash, the action performs a POST
    request to the Intezer `analyze-by-hash` endpoint. This initiates a new analysis
    task or retrieves the status of an existing one.

    6. **Result Processing:** The action collects the analysis ID, status, and type
    for each submitted hash, providing a summary in the output message and detailed
    JSON results.


    ### Additional Notes

    - This action is considered a mutation of external data because it triggers the
    creation of analysis tasks on the Intezer platform.

    - If no hashes are provided in the parameters and no `FILEHASH` entities are present
    in the context, the action will not have any data to process.
  ai_short_description: >-
    Submits file hashes to the Intezer Analyze platform to initiate a deep file analysis
    and retrieve the analysis ID and status.
