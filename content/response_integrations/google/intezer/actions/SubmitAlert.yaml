name: Submit Alert
description: Submit a new alert including the raw alert information to Intezer for
    processing.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer#submit_alert
integration_identifier: Intezer
parameters:
-   name: Source
    default_value: alert source
    type: string
    description: The source of the alert
    is_mandatory: true
-   name: Raw Alert
    default_value: JSON format
    type: string
    description: Alert raw data in JSON format
    is_mandatory: true
-   name: Alert Mapping
    default_value: JSON format
    type: string
    description: Mapping to use for the alert in JSON format
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/submit_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
