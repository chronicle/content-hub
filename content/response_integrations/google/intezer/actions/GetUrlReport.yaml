name: Get URL Report
description: Get a URL analysis report based on a URL analysis ID.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer#get_url_report
integration_identifier: Intezer
parameters:
-   name: Analysis ID
    default_value: ''
    type: string
    description: Specify a comma-separated list of URL Analysis IDs to run the action
        on. Analysis ID is case sensitive. The analysis ID is returned when submitting
        a URL for analysis. Multiple values can be provided as a comma-separated string.
    is_mandatory: true
-   name: Wait For Completion
    default_value: false
    type: boolean
    description: Whether to wait for the analysis to finish.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_url_report_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
