name: Index File
description: Index the file's genes into the organizational database.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer#index_file
integration_identifier: Intezer
parameters:
-   name: Index As
    default_value: trusted
    type: ddl
    optional_values:
    - trusted
    - malicious
    description: Index as trusted or malicious
    is_mandatory: true
-   name: SHA256
    default_value: ''
    type: string
    description: Sha256 to index. Multiple values can be provided as a comma-separated
        string.
    is_mandatory: false
-   name: Family Name
    default_value: ''
    type: string
    description: Family name to index as
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/index_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
