name: Get Alert
description: Get an ingested alert triage and response information using alert ID.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer#get_alert
integration_identifier: Intezer
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: The alert id to query.
    is_mandatory: true
-   name: Wait For Completion
    default_value: false
    type: boolean
    description: Whether to wait for the analysis to finish.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
