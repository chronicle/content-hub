name: Submit Suspicious Email
description: Submit a suspicious phishing email in a raw format (.MSG or .EML) to
    Intezer for processing
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer#submit_suspicious_email
integration_identifier: Intezer
parameters:
-   name: Email File Path
    type: string
    description: Path to the email file
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/submit_suspicious_email_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
