name: Detonate File
description: Analyze a file from Splunk vault with Intezer.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer#detonate_file
integration_identifier: Intezer
parameters:
-   name: File Path
    default_value: ''
    type: string
    description: Path to file for analyzing. Multiple values can be provided as a
        comma-separated string.
    is_mandatory: true
-   name: Related Alert ID
    default_value: ''
    type: string
    description: The alert id related to the file.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/detonate_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
