name: Get File Report
description: Get a file analysis report based on an analysis ID or a file hash.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer#get_file_report
integration_identifier: Intezer
parameters:
-   name: Analysis ID
    type: string
    description: 'Specify a comma-separated list of File Analysis IDs to run the action
        on. Analysis ID is case sensitive. Note: if both "Analysis ID" and "File Hash"
        are provided, then "File Hash" value will have priority. Multiple values can
        be provided as a comma-separated string.'
    is_mandatory: false
-   name: File Hash
    type: string
    description: 'Specify a comma-separated list of file hashes to run the action
        on. File Hash is case sensitive. Note: if both "Analysis ID" and "File Hash"
        are provided, then "File Hash" value will have priority. Multiple values can
        be provided as a comma-separated string.'
    is_mandatory: false
-   name: Private Only
    default_value: false
    type: boolean
    description: Whether to show only private reports (relevant only for hashes).
    is_mandatory: false
-   name: Wait For Completion
    default_value: false
    type: boolean
    description: Whether to wait for the analysis to complete before returning the
        report.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_file_report_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
