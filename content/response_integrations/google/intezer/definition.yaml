identifier: Intezer
name: Intezer
parameters:
-   name: API Root
    default_value: https://analyze.intezer.com/api/v2-0/
    type: string
    description: API root of the Intezer service.
    is_mandatory: true
    integration_identifier: Intezer
-   name: API key
    default_value: ''
    type: password
    description: Intezer API key
    is_mandatory: true
    integration_identifier: Intezer
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Intezer service is valid.
    is_mandatory: false
    integration_identifier: Intezer
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/intezer
categories:
- Security
- Threat Intelligence
svg_logo_path: resources/logo.svg
image_path: resources/image.png
