    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an API call to Vertex AI to generate content based on the provided
      EML files (fetches_data=true). It does not mutate any external data, nor does
      it update internal SecOps data such as entities, insights, or case comments.
      It only returns a JSON result.
