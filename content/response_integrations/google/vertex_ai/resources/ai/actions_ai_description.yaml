Ping:
  ai_description: "### General Description\nThe **Ping** action is a diagnostic utility\
    \ designed to verify the connectivity between Google SecOps and the Vertex AI\
    \ service. It validates that the integration's configuration parameters\u2014\
    such as the API Root, Project ID, and authentication credentials\u2014are correctly\
    \ set up and that the Vertex AI API is reachable.\n\n### Flow Description\n1.\
    \ **Authentication**: The action initializes the `AuthManager` to prepare an authorized\
    \ session using the provided GCP credentials.\n2. **Parameter Extraction**: It\
    \ retrieves the `Default Model` and `Publisher Name` from the integration's configuration.\n\
    3. **Connectivity Test**: The action calls the `test_connectivity` method in the\
    \ `ApiManager`, which executes a `GET` request to the Vertex AI `publishers.models.get`\
    \ endpoint.\n4. **Result Handling**: If the API call is successful, the action\
    \ returns a success message. If the request fails (e.g., due to authentication\
    \ errors or network issues), it raises a `VertexAIManagerException` with the relevant\
    \ error details.\n\n### Additional Notes\n* This action is strictly for connectivity\
    \ testing and does not process any alert or entity data.\n* It requires valid\
    \ Google Cloud credentials (Service Account JSON or Workload Identity) configured\
    \ at the integration level."
