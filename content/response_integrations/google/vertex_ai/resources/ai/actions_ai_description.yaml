Analyze EML:
  ai_description: >-
    ### General Description

    The **Analyze EML** action leverages Google Vertex AI to perform deep security
    analysis on EML (Email) files. It is designed to identify potential threats such
    as phishing links, malicious attachments, and social engineering tactics by processing
    the raw email content through a generative AI model. The action returns a structured
    analysis including threat levels, specific findings, and recommended verification
    steps.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the model configuration and
    the list of files to be analyzed from the action parameters.

    2. **Validation**: It validates the file list format and ensures numerical parameters
    (Temperature, Max Tokens) are within valid ranges.

    3. **File Processing**: The action iterates through each provided file path, reads
    the file from the local system, and Base64 encodes the content.

    4. **AI Analysis**: For each file, a specialized security analyst prompt is constructed
    and sent to the Vertex AI API along with the encoded EML data. The prompt instructs
    the AI to identify phishing, malware, and social engineering risks.

    5. **Result Aggregation**: The AI's response (containing a threat level, identified
    threats, and protection measures) is parsed and aggregated into a structured JSON
    result for the SOAR platform.


    ### Additional Notes

    This action does not automatically process entities from the case; it requires
    explicit file paths provided in the 'Files To Analyze' parameter. If a file is
    not found at the specified path, the action logs an error for that specific file
    but continues processing others.
  ai_short_description: >-
    Leverages Google Vertex AI to perform deep security analysis on EML files, identifying
    potential threats like phishing and malicious attachments, and returning a structured
    threat analysis report.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
