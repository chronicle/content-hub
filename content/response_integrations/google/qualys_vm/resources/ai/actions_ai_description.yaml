Launch VM Scan And Fetch Results:
  ai_description: >-
    ### General Description

    Launches a vulnerability scan on specified IP Address entities using Qualys VM
    and fetches the scan results. This action automatically adds new hosts to Qualys
    as assets before initiating the scan and retrieves the generated vulnerability
    reports once the scan is complete.


    ### Flow Description

    1. Filters the target entities to include only IP Addresses.

    2. Iterates through the valid entities and adds each IP to Qualys as an asset
    using the `add_ip` API endpoint.

    3. Initiates a VM scan for the collected IPs using the `launch_vm_scan` API endpoint.

    4. Updates the entities in the SecOps platform with the scan reference ID (`qualys_last_scan_id`)
    and marks them as enriched.

    5. The action suspends and waits asynchronously for the scan to complete.

    6. Once the scan finishes, it retrieves the scan results and triggers the generation
    of a scan report via the `launch_scan_report` API endpoint.

    7. Fetches the completed report and attaches it to the case, along with summary
    data tables and JSON results.


    ### Additional Notes

    This action runs asynchronously. Note that automatically adding new hosts to Qualys
    as assets may impact your license limit depending on your subscription.
