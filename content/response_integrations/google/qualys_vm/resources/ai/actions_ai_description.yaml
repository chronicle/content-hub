Download Report:
  ai_description: >-
    ### General Description

    Downloads a specific vulnerability or compliance report from Qualys VM using its
    Report ID. The action retrieves the report content and attaches it to the case
    for further review.


    ### Flow Description

    1. Extracts the `Report ID` from the action parameters.

    2. Polls the Qualys VM API (`/api/3.0/fo/report/`) to check the current status
    of the specified report.

    3. Once the report status is confirmed as 'Finished', makes a subsequent API call
    to fetch the actual report content.

    4. Attaches the downloaded report file to the case and returns the report metadata
    as a JSON result.


    ### Additional Notes

    If the report is still processing or has not yet been initiated in the database,
    the action will wait and retry until it is finished or encounters an error state.
  ai_short_description: >-
    Downloads a specific report from Qualys VM by its Report ID and attaches it to
    the case.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches report data from Qualys VM using GET requests. It does not
      mutate external data, update entities, create insights, modify alert data, or
      create case comments. It only adds an attachment and JSON results to the action
      output.
  entity_usage:
