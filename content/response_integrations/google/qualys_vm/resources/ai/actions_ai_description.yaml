List Endpoint Detections:
  ai_description: >-
    ### General Description

    Lists endpoint detections (vulnerabilities) from Qualys VM for specified IP Address
    and Hostname entities. This action retrieves detailed vulnerability information
    based on severity and status filters, and enriches the entities with the findings.


    ### Flow Description

    1. Iterates over the target entities, filtering for IP Address and Hostname entity
    types.

    2. For Hostname entities, resolves the corresponding IP address by making a GET
    request to the Qualys VM API (`/api/5.0/fo/asset/host/`).

    3. Fetches detection QUIDs for the IP address by making a POST request to the
    Qualys VM API (`/api/4.0/fo/asset/host/vm/detection/`), applying filters for status,
    severity, ignored, and disabled detections.

    4. Retrieves detailed information for the found detection QUIDs by making a POST
    request to the Qualys VM API (`/api/4.0/fo/knowledge_base/vuln/`).

    5. Creates a data table with the detection details for each successful entity.

    6. Optionally creates an insight with the vulnerability information if the `Create
    Insight` parameter is enabled.

    7. Updates the entities in the SecOps platform and attaches the JSON results.


    ### Additional Notes

    Ensure that the Qualys VM integration is properly configured with the necessary
    API credentials. The maximum number of detections that can be fetched per entity
    is 200.
