Launch Compliance Report:
  ai_description: >-
    ### General Description

    Launches a compliance report in QualysVM based on the provided template and target
    parameters. This action initiates a report generation task on the external QualysVM
    platform and returns the resulting Report ID.


    ### Flow Description

    1. Extracts the provided parameters including Report Title, Report Type, Output
    Format, IPs/Ranges, Asset Groups, and Scan Reference.

    2. Resolves the provided Asset Group names to their corresponding IDs by querying
    the QualysVM API.

    3. Resolves the provided Report Type (template name) to its corresponding Template
    ID.

    4. Makes a POST request to the QualysVM API to launch the compliance report with
    the resolved IDs and target parameters.

    5. Returns the generated Report ID to the SOAR platform.


    ### Additional Notes

    Ensure that the provided Report Type matches an existing template name in QualysVM.
    For PCI compliance reports, the report title is provided by Qualys and cannot
    be changed.
