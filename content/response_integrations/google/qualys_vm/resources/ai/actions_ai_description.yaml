Download Vm Scan Results:
  ai_description: >-
    ### General Description

    Fetches vulnerability scan results and generates a corresponding scan report from
    Qualys VM using a specific Scan ID. The action retrieves the scan data, initiates
    a report generation job on the Qualys platform, and downloads the resulting PDF
    report.


    ### Flow Description

    1. Extracts the provided Scan ID from the action parameters.

    2. Retrieves the raw vulnerability scan results from Qualys VM via API.

    3. Initiates a new scan report generation job on the Qualys VM platform for the
    specified Scan ID.

    4. Polls the Qualys VM API until the report generation is completed.

    5. Downloads the generated PDF report and attaches it to the case.

    6. Parses the scan results and adds them as data tables and JSON results to the
    action output.


    ### Additional Notes

    None.
