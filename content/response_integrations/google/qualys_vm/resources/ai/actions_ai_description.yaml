Enrich Host:
  ai_description: >-
    ### General Description

    Enriches IP Address and Hostname entities with host information from Qualys VM.
    This action retrieves contextual metadata such as OS, NetBIOS name, DNS details,
    and tags for the specified assets.


    ### Flow Description

    1. Iterates over the target entities, filtering for IP Addresses and Hostnames.

    2. Makes an API call to Qualys VM to fetch host details using the entity identifier.

    3. If details are found, enriches the entity's additional properties with the
    retrieved data.

    4. Creates a data table for the entity containing the host details.

    5. If the `Create Insight` parameter is enabled, generates an insight with the
    host information.

    6. Updates the entities in the platform and returns the JSON results.


    ### Additional Notes

    The AssetView module is required in Qualys VM for this action to function properly.
  ai_short_description: >-
    Enriches IP Address and Hostname entities with host information from Qualys VM,
    optionally creating an insight with the retrieved details.
