    group or list within McAfee Web Gateway. This action is typically used to manage
    blocklists or allowlists by removing previously added items.


    ### Flow Description

    1. Initializes the connection to the McAfee Web Gateway using the provided integration
    credentials.

    2. Retrieves the target `Group Name` and the `Item To Delete` from the action
    parameters.

    3. Makes an HTTP DELETE API call to McAfee Web Gateway to remove the specified
    item from the target group.

    4. Makes an HTTP POST API call to commit the changes to the gateway.

    5. Logs out of the gateway and returns a success or failure message based on the
    API response.


    ### Additional Notes

    Each group in McAfee Web Gateway is type-restricted. Ensure that the item being
    removed matches the expected format of the target group (e.g., an IP address with
    a subnet mask like `x.x.x.x/32`).
