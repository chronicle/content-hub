Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the McAfee Web Gateway server by attempting to authenticate
    using the provided integration credentials.


    ### Flow Description

    1. Retrieves the integration configuration parameters (Server Address, Username,
    Password).

    2. Initializes the McAfee Web Gateway manager, which automatically sends a POST
    request to the `/login` endpoint to authenticate.

    3. Sends a POST request to the `/logout` endpoint to terminate the session.

    4. If no exceptions are raised during the login and logout process, the action
    completes successfully and returns a success message.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the McAfee Web Gateway API.
