Block IP:
  ai_description: >-
    ### General Description

    Blocks specific IP address entities by adding them to an "IP range"-type group
    on McAfee Web Gateway.


    ### Flow Description

    1. Connects to the McAfee Web Gateway using the provided credentials.

    2. Iterates through the target entities and filters for IP Address entities.

    3. For each IP address, makes a POST request to the McAfee Web Gateway API to
    insert the IP (with a /32 subnet mask) into the specified group list.

    4. Commits the changes to the gateway.

    5. Returns a summary of successfully and unsuccessfully blocked IPs.


    ### Additional Notes

    The target group must already exist and should be part of a rule used to block
    IP addresses on the gateway.
  ai_short_description: >-
    Blocks specific IP address entities by adding them to a designated group list
    on McAfee Web Gateway.
