Unblock IP:
  ai_description: >-
    ### General Description

    Unblocks IP addresses by removing them from a specified "IP range"-type group
    on McAfee Web Gateway. This action initiates a state change on the external device
    to restore network traffic capabilities for the specified entities.


    ### Flow Description

    1. Initializes the McAfee Web Gateway manager with the provided server address
    and credentials.

    2. Iterates through the target entities, filtering specifically for Address entities.

    3. For each valid Address entity, makes an API call to delete the IP address (formatted
    with a `/32` subnet mask) from the specified group list.

    4. Commits the changes to the McAfee Web Gateway.

    5. Collects successful and failed unblock operations to generate a summary message.

    6. Returns the summary message and a boolean result indicating if any IPs were
    successfully unblocked.


    ### Additional Notes

    The specified group should be part of a rule used to block IP addresses on the
    McAfee Web Gateway.
