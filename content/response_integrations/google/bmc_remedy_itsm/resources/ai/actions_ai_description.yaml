Add Work Note To Incident:
  ai_description: >-
    ### General Description

    Adds a work note to a specific incident in BMC Remedy ITSM.


    ### Flow Description

    1. Extracts the `Incident ID` and `Work Note Text` parameters.

    2. Authenticates with the BMC Remedy ITSM API.

    3. Retrieves the incident details via a GET request to verify its existence.

    4. If the incident exists, adds the specified work note to the incident via a
    POST request.

    5. Logs out of the BMC Remedy ITSM session.


    ### Additional Notes

    None.
