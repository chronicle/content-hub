Wait For Record Fields Update:
  ai_description: >-
    ### General Description

    Waits for specific fields of a record to be updated to expected values in BMC
    Remedy ITSM.


    ### Flow Description

    1. Extracts the provided Record Type, Record ID, and Fields To Check.

    2. Checks if the action is approaching its timeout limit.

    3. Retrieves the current details of the specified record from BMC Remedy ITSM.

    4. Compares the current field values with the expected values provided in the
    JSON payload.

    5. If all fields match the expected values, the action completes successfully
    and returns the record details.

    6. If not all fields match, the action remains in progress and waits for the next
    iteration.

    7. If the timeout is reached, the action either fails or completes based on the
    'Fail If Timeout' parameter.


