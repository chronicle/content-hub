  ai_description: >-
    ### General Description

    Retrieves detailed information about specific incidents from BMC Remedy ITSM based
    on provided incident IDs. It can optionally fetch specific fields and associated
    work notes, returning the data for further analysis or case context.


    ### Flow Description

    1. Initializes a connection to the BMC Remedy ITSM API.

    2. Makes a GET request to the `/api/arsys/v1/entry/HPD:IncidentInterface` endpoint
    to fetch incident details for the provided Incident IDs.

    3. If the `Fetch Work Notes` parameter is enabled, makes additional GET requests
    to the `/api/arsys/v1/entry/HPD:WorkLog` endpoint to fetch work notes for each
    retrieved incident up to the specified limit.

    4. Formats the retrieved incident details and work notes, outputting them as JSON
    results and data tables.


    ### Additional Notes

    If invalid fields are provided in the `Fields To Return` parameter, the action
    will fail. If no fields are specified, all available fields will be returned.
