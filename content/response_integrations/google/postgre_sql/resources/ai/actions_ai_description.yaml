    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action establishes a connection to a PostgreSQL database and immediately
      closes it to verify connectivity. It does not fetch contextual data, mutate
      external data, mutate internal data, update entities, create insights, modify
      alert data, or create case comments.
