Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the PostgreSQL database using the provided integration configuration.
    This action verifies that the credentials and network settings are correct.


    ### Flow Description

    1. Retrieves the PostgreSQL integration configuration parameters (Server Address,
    Username, Password, Port, Database Name For Testing).

    2. Attempts to establish a connection to the PostgreSQL database using the `psycopg2`
    library.

    3. Closes the connection immediately upon success.

    4. Returns a success message if the connection was established without errors.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can communicate with the PostgreSQL server. It does not perform any queries
    or data manipulation.
  ai_short_description: >-
    Tests connectivity to the PostgreSQL database to verify integration configuration.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
