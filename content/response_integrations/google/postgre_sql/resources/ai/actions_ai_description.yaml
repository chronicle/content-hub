Run SQL Query:
  ai_description: >-
    ### General Description

    Executes a custom SQL query against a specified PostgreSQL database. This action
    allows analysts to interact directly with a PostgreSQL instance to retrieve data
    or perform database operations.


    ### Flow Description

    1. Retrieves configuration and action parameters, including the target database
    name and the SQL query to be executed.

    2. Establishes a connection to the PostgreSQL database using the provided credentials
    and server details.

    3. Executes the provided SQL query via the `psycopg2` library and commits the
    transaction.

    4. If the query returns data (e.g., a `SELECT` statement), it fetches the column
    names and rows.

    5. Formats the retrieved data into a JSON structure and constructs a CSV-formatted
    data table.

    6. Attaches the data table and JSON results to the action execution in the SecOps
    platform.


    ### Additional Notes

    Because the action commits the transaction after executing the query, it can be
    used to run data manipulation language (DML) statements such as `INSERT`, `UPDATE`,
    or `DELETE`, in addition to standard `SELECT` queries.
  ai_short_description: >-
    Executes a custom SQL query against a specified PostgreSQL database and returns
    the results as JSON and a data table.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Executes arbitrary SQL queries which can include data manipulation statements
      (INSERT, UPDATE, DELETE) that modify the PostgreSQL database.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by executing SQL queries (like SELECT) and can mutate
      external data because it executes arbitrary SQL queries and commits the transaction,
      allowing for INSERT, UPDATE, or DELETE operations on the PostgreSQL database.
      It does not mutate internal SecOps data, update entities, or create insights.
