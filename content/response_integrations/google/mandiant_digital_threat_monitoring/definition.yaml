identifier: MandiantDigitalThreatMonitoring
name: Mandiant Digital Threat Monitoring
parameters:
-   name: API Root
    default_value: https://api.intelligence.mandiant.com
    type: string
    description: 'API root of the Mandiant instance. Note: If you want to authenticate
        with GTI credentials provide "https://www.virustotal.com" as API Root.'
    is_mandatory: true
    integration_identifier: MandiantDigitalThreatMonitoring
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID of the Mandiant Digital Threat Monitoring account.
    is_mandatory: false
    integration_identifier: MandiantDigitalThreatMonitoring
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret of the Mandiant Digital Threat Monitoring account.
    is_mandatory: false
    integration_identifier: MandiantDigitalThreatMonitoring
-   name: GTI API Key
    default_value: ''
    type: password
    description: 'Google Threat Intelligence API Key. Note: API Root should be "https://www.virustotal.com"to
        use this authentication. GTI API Key authentication has priority over other
        authentication.'
    is_mandatory: false
    integration_identifier: MandiantDigitalThreatMonitoring
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Mandiant server is valid.
    is_mandatory: true
    integration_identifier: MandiantDigitalThreatMonitoring
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mandiant-dtm
categories:
- Threat Intelligence
svg_logo_path: resources/logo.svg
image_path: resources/image.png
