name: Mandiant Digital Threat Monitoring - Alerts Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: event_type
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://api.intelligence.mandiant.com
    type: string
    description: 'API root of the Mandiant Digital Threat Monitoring instance. Note:
        If you want to authenticate with GTI credentials provide “https://www.virustotal.com”
        as API Root.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID of the Mandiant Digital Threat Monitoring account.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret of the Mandiant Digital Threat Monitoring account.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: GTI API Key
    default_value: ''
    type: password
    description: 'Google Threat Intelligence API Key. Note: API Root should be “https://www.virustotal.com”
        to use this authentication.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Mandiant Digital Threat Monitoring server is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity To Fetch
    default_value: ''
    type: string
    description: 'Lowest severity of the alerts to fetch. If nothing is provided,
        the connector will ingest alerts with all severities. Supported values: Low,
        Medium, High.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Monitor ID Filter
    default_value: ''
    type: string
    description: A comma-separated list of monitor ids from which the alerts should
        be fetched.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If enabled, the connector will disable the overflow mechanism.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: Amount of hours from where to fetch alerts.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Alerts To Fetch
    default_value: 25
    type: integer
    description: 'How many alerts to process per one connector iteration. Maximum:
        25'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If enabled, the dynamic list will be used as a blocklist.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Pull alerts from Mandiant Digital Threat Monitoring. Dynamic List works
    with the "alert_type" parameter.
integration: MandiantDigitalThreatMonitoring
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mandiant-dtm#mandiant-dtm-alerts-connector
rules: []
is_connector_rules_supported: false
creator: admin
