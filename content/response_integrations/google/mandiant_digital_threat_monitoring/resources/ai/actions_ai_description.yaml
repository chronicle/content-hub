Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the Mandiant Digital Threat Monitoring service using
    the provided integration configuration parameters. This action ensures that the
    Google SecOps platform can successfully communicate with the Mandiant API.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves the integration-level configuration parameters
    required for authentication and API access.

    2. **Authentication**: Establishes an authenticated session. If a GTI API Key
    is provided, it uses header-based authentication. Otherwise, it performs an OAuth2
    flow to generate an access token using the Client ID and Client Secret.

    3. **Connectivity Test**: Sends a GET request to the Mandiant DTM alerts endpoint
    (requesting a single result) to verify that the credentials and network path are
    valid.

    4. **Result Reporting**: Returns a success message if the API responds correctly,
    or raises an exception if the connection fails.


    ### Additional Notes

    This action is primarily used for setup and troubleshooting to confirm integration
    health. It does not interact with case entities or modify any data.
  ai_short_description: >-
    Tests the connectivity to the Mandiant Digital Threat Monitoring service to ensure
    successful communication and authentication with the Mandiant API.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Mandiant API to test connectivity. It
      does not fetch contextual data for alerts/entities, nor does it mutate any external
      or internal data, update entities, or create insights/comments.
