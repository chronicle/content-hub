Update Alert:
  ai_description: >-
    ### General Description

    The **Update Alert** action allows users to modify the status of an existing alert
    within the Mandiant Digital Threat Monitoring (DTM) platform. This action initiates
    a state change on the external Mandiant service to synchronize alert states or
    manage the threat lifecycle.


    ### Flow Description

    1. Extracts the `Alert ID` and `Status` parameters from the action configuration.

    2. Maps the provided human-readable status to the machine-readable format required
    by the Mandiant API.

    3. Validates that a valid status has been provided.

    4. Sends an authenticated `PATCH` request to the Mandiant DTM API (`/v4/dtm/alerts/{alert_id}`)
    to update the alert's status.

    5. Returns the updated alert object in JSON format and a success message.


    ### Additional Notes

    While the `Status` parameter is marked as optional in the configuration, the action
    logic requires a valid value to be selected. Selecting "Select One" will result
    in a validation error.
  ai_short_description: >-
    Updates the status of an existing alert in the Mandiant Digital Threat Monitoring
    (DTM) platform.
  capabilities:
