Submit Event:
  ai_description: >-
    ### General Description

    Submits a raw event string to a designated Splunk index. This action allows for
    the manual or automated injection of log data into Splunk for indexing and subsequent
    searching. It is useful for logging custom events or forwarding specific data
    points from a SOAR workflow into a centralized logging system.


    ### Flow Description

    1. **Authentication**: Establishes a connection with the Splunk API using the
    configured credentials.

    2. **Parameter Extraction**: Retrieves the target index, raw event content, and
    optional metadata (host, source, sourcetype) from the action inputs.

    3. **Event Submission**: Executes an HTTP POST request to the Splunk `receivers/simple`
    endpoint, transmitting the raw event data to the specified index.

    4. **Result Processing**: Captures the response from Splunk and returns it as
    a JSON result for use in subsequent playbook steps.


    ### Additional Notes

    This action is primarily used for pushing data into Splunk rather than querying
    it. Ensure the specified index exists and the provided credentials have the necessary
    permissions to write to it.
  ai_short_description: >-
    Submits a raw event string to a designated Splunk index for indexing and searching.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Submits a new raw event/log entry to a specified Splunk index.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP POST request to Splunk's `receivers/simple` endpoint
