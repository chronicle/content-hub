    1. Iterates through the target entities provided in the case.

    2. Filters entities to process only those of type File Hash (specifically MD5
    hashes with a length of 32 characters).

    3. Queries Carbon Black Protection to retrieve file instances associated with
    each valid MD5 hash.

    4. Formats the retrieved file instances into a CSV table and attaches it to the
    respective entity.

    5. Aggregates the results into a JSON object and returns a summary message indicating
    which files were found.


    ### Additional Notes

    Only MD5 hashes (length of 32 characters) are processed by this action. Other
    hash types will be ignored.
