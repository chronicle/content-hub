Unblock Hash:
  ai_description: >-
    ### General Description

    Unblocks specified file hash entities on specific policies or globally within
    Carbon Black Protection. This action removes existing ban rules for the hashes,
    allowing them to execute or be accessed again according to the specified policies.


    ### Flow Description

    1. Retrieves the list of policy names provided in the action parameters.

    2. Makes API calls to Carbon Black Protection to resolve the provided policy names
    into their corresponding policy IDs.

    3. Iterates through the target entities provided in the case, filtering specifically
    for `FILEHASH` entities.

    4. For each valid file hash, calls the Carbon Black Protection API to retrieve
    the existing file rule and removes the specified policy IDs from the ban rule.
    If no policies remain on the rule, the rule is deleted entirely.

    5. Updates the successfully unblocked entities within the SecOps platform.

    6. Returns a summary message detailing the unblocked hashes and any errors encountered.


    ### Additional Notes

    - If the `Policy Names` parameter is left empty or if the removal of the specified
    policies leaves the file rule with no associated policies, the ban rule for that
    hash is completely deleted from Carbon Black Protection.
