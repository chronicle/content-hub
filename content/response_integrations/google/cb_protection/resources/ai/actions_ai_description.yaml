Change Computer Policy:
  ai_description: >-
    ### General Description

    Moves a specified computer to a new policy within Carbon Black Protection. This
    action targets Hostname and IP Address entities to identify the corresponding
    computer in the external system and updates its assigned policy.


    ### Flow Description

    1. Retrieves the target policy name from the action parameters.

    2. Iterates through the target entities, specifically filtering for Hostname and
    IP Address entity types.

    3. For each valid entity, makes a GET request to the Carbon Black Protection API
    to fetch the corresponding computer details and retrieve its unique ID.

    4. Makes a PUT request to the Carbon Black Protection API to update the computer's
    policy to the specified policy ID.

    5. Updates the successfully processed entities within the Google SecOps platform.


    ### Additional Notes

    Only Hostname and IP Address entities are processed by this action. If a computer
    cannot be found or the policy change fails, the action will continue processing
    the remaining entities and report the errors in the final output message.
