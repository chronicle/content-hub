Analyze File:
  ai_description: >-
    ### General Description

    Analyzes file hash entities using a specified connector in Carbon Black Protection.
    This action triggers a file analysis job on the external platform to determine
    if the file is malicious or suspicious, and updates the entity's status in Google
    SecOps based on the results.


    ### Flow Description

    1. Retrieves the internal connector ID from Carbon Black Protection using the
    provided `Connector Name`.

    2. Iterates over the target entities, filtering for `FILEHASH` entities where
    the identifier is exactly 32 characters long (MD5).

    3. Submits a file analysis request to the Carbon Black Protection API (`POST /api/bit9platform/v1/fileAnalysis`)
    for each valid hash.

    4. Waits for the analysis job to complete up to the specified `Timeout`.

    5. Retrieves the analysis results and checks if the file is flagged as malicious
    or suspicious.

    6. Updates the entity's `is_suspicious` property to `True` if a threat is detected.

    7. Aggregates the analysis data and attaches it to the action's JSON result, then
    saves the updated entities back to the platform.


    ### Additional Notes

    - The file hash must already exist in the Carbon Black Protection file catalog
    and be present on at least one computer for the analysis to successfully trigger.

    - The action specifically expects MD5 hashes (32 characters).
  ai_short_description: >-
    Triggers a file analysis job in Carbon Black Protection for MD5 file hashes and
    updates the entity's suspicious status based on the threat results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: >-
      Submits a new file analysis job to the Carbon Black Protection platform.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by retrieving the analysis results from Carbon Black
      Protection. It mutates external data by POSTing a new file analysis job to the
      Carbon Black API. It updates internal entities by setting `is_suspicious = True`
      and calling `siemplify.update_entities`. It does not create insights, modify
      alert data, or create case comments.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
