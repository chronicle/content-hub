Add a Rule to a Security Policy:
  ai_description: >-
    ### General Description

    Adds a new security rule to an existing security policy in Google Cloud Armor.
    This action allows for the programmatic modification of Web Application Firewall
    (WAF) or security policy configurations by injecting a rule defined in JSON format.
    It automatically handles the retrieval of the required policy fingerprint to ensure
    the update is synchronized with the current state of the external resource.


    ### Flow Description

    1. Extracts the Policy Name, Region, and Rule JSON parameters.

    2. Validates the provided Rule JSON to ensure it is properly formatted.

    3. Initializes the Google Cloud Armor API manager with the necessary authentication
    credentials.

    4. Retrieves the current security policy from Google Cloud Armor to extract its
    `fingerprint`.

    5. Injects the retrieved fingerprint into the Rule JSON payload to satisfy API
    concurrency requirements.

    6. Sends a POST request to the Google Cloud Armor API to add the new rule to the
    specified security policy.

    7. Retrieves and returns the updated security policy to confirm the rule addition.


    ### Additional Notes

    - This action does not operate on Google SecOps entities; it is a management action
    for Google Cloud Armor infrastructure.

    - The action automatically retrieves the latest `fingerprint` from the target
    policy and injects it into the Rule JSON before submission to prevent version
    conflicts.
  ai_short_description: >-
    Adds a new security rule to an existing security policy in Google Cloud Armor.
