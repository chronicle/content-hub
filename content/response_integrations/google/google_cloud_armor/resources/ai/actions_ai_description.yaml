Create a Security Policy:
  ai_description: >-
    ### General Description

    Creates a new security policy in the Google Cloud Armor service. This action allows
    users to define complex security configurations, including rules, WAF exclusions,
    and DDoS protection settings, by providing a raw JSON definition. It supports
    both global and regional security policies.


    ### Flow Description

    1. **Parameter Extraction & Validation**: The action retrieves the 'Region' and
    'Policy JSON' parameters. It validates that the 'Policy JSON' is a valid JSON
    string.

    2. **Region Validation**: It performs a pre-check by listing policies in the specified
    region to ensure the region name is valid for the authenticated project.

    3. **Policy Creation**: The action sends a POST request to the Google Cloud Armor
    API with the provided JSON payload to initiate the creation of the security policy.

    4. **Verification & Retrieval**: After the creation request, the action enters
    a polling loop (with retries) to fetch the details of the newly created policy
    using a GET request. This ensures the policy was successfully committed.

    5. **Result Processing**: The final policy data is returned as a JSON result,
    and the action status is set to success.


    ### Additional Notes

    * This action does not operate on Google SecOps entities (IPs, Domains, etc.);
    it is a management action for infrastructure configuration.

    * The 'Policy JSON' must include the 'name' field as it is used to verify the
    creation during the retrieval phase.
  ai_short_description: >-
    Creates a new security policy in the Google Cloud Armor service using a provided
    JSON definition.
