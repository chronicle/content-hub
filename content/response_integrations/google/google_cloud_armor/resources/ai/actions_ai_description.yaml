Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the Google Cloud Armor service using the credentials
    and configuration provided in the integration settings. This action ensures that
    the SOAR platform can successfully authenticate and communicate with the Google
    Cloud Compute API to manage security policies.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves integration-level configuration including
    API root and authentication details.

    2. **Validation**: Validates that the provided authentication JSON or email is
    in the correct format.

    3. **Manager Initialization**: Authenticates with GCP and initializes the Google
    Cloud Armor API manager.

    4. **Connectivity Test**: Executes a 'List Security Policies' API call with a
    result limit of 1 to verify that the service is reachable and credentials have
    sufficient permissions.

    5. **Result Reporting**: Returns a success message if the API call completes without
    error.


    ### Additional Notes

    * Either 'User Service Account' or 'Workload Identity Email' must be configured
    at the integration level for this action to succeed.

    * This action is primarily used for troubleshooting and verifying setup.
