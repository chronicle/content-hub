Update a Security Policy:
  ai_description: >-
    ### General Description

    Updates an existing security policy in the Google Cloud Armor service. This action
    modifies the configuration of a security policy (such as its description, adaptive
    protection settings, or advanced options) using a provided JSON definition. Note
    that this action is designed to update the policy itself and cannot be used to
    update individual rules within the policy. This action does not operate on Google
    SecOps SOAR entities.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves the policy name, region, and the new policy
    JSON from the action input parameters.

    2. **Validation**: Validates that the provided Policy JSON is a valid JSON structure.

    3. **Fingerprint Retrieval**: Makes a GET request to the Google Cloud Armor API
    to fetch the current state of the specified policy and extracts its unique `fingerprint`.

    4. **JSON Preparation**: Injects the retrieved fingerprint into the user-provided
    Policy JSON to ensure the update request is authorized for the current version
    of the resource.

    5. **Policy Update**: Sends a PATCH request to the Google Cloud Armor API with
    the updated policy configuration.

    6. **Verification**: Makes a final GET request to retrieve the updated policy
    details from the API to confirm the changes and returns the raw JSON result to
    the SOAR platform.


    ### Additional Notes

    * The action automatically retrieves the current policy's 'fingerprint' from Google
    Cloud Armor before performing the update. This fingerprint is required by the
    Google Cloud API to prevent concurrent modification conflicts.

    * This action uses the `PATCH` method, meaning it updates the fields provided
    in the JSON while preserving others where applicable.
  ai_short_description: >-
    Updates an existing security policy configuration in the Google Cloud Armor service
    using a provided JSON definition.
