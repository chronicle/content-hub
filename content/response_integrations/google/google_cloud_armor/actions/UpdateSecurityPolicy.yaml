name: Update a Security Policy
description: Update the existing security policy in the Google Cloud Armor service.
    The action cannot update rules in a policy. To add a rule to the related policy,
    use the Add a Rule to a Security Policy action. This action doesn't run on Google
    SecOps SOAR entities.
integration_identifier: GoogleCloudArmor
parameters:
-   name: Policy Name
    default_value: ''
    type: string
    description: Security policy name to update.
    is_mandatory: true
-   name: Region
    default_value: ''
    type: string
    description: Region for the updated policy. If no value is provided, the global-level
        security policy is created.
    is_mandatory: false
-   name: Policy JSON
