name: Add a Rule to a Security Policy
description: Add a new rule to the security policy in the Google Cloud Armor service.
    This action doesn't run on Google SecOps SOAR entities.
integration_identifier: GoogleCloudArmor
parameters:
-   name: Policy Name
    default_value: ''
    type: string
    description: Security policy name to add a new rule to.
    is_mandatory: true
-   name: Region
    default_value: ''
    type: string
    description: Region for the policy to add the rule in. If no value is provided,
        the rule is added to the global-level security policy.
    is_mandatory: false
-   name: Rule JSON
    default_value: "{\n  \"kind\": string,\n  \"description\": string,\n  \"priority\"\
        : integer,\n  \"match\": {\n    \"expr\": {\n    \"expression\": string,\n\
        \    \"title\": string,\n    \"description\": string,\n    \"location\": string\n\
        \    },\n    \"exprOptions\": {\n    \"recaptchaOptions\": {\n      \"actionTokenSiteKeys\"\
        : [\n      string\n      ],\n      \"sessionTokenSiteKeys\": [\n      string\n\
        \      ]\n    }\n    },\n    \"versionedExpr\": enum,\n    \"config\": {\n\
        \    \"srcIpRanges\": [\n      string\n    ]\n    }\n  },\n  \"networkMatch\"\
        : {\n    \"userDefinedFields\": [\n    {\n      \"name\": string,\n      \"\
        values\": [\n      string\n      ]\n    }\n    ],\n    \"srcIpRanges\": [\n\
        \    string\n    ],\n    \"destIpRanges\": [\n    string\n    ],\n    \"ipProtocols\"\
        : [\n    string\n    ],\n    \"srcPorts\": [\n    string\n    ],\n    \"destPorts\"\
        : [\n    string\n    ],\n    \"srcRegionCodes\": [\n    string\n    ],\n \
        \   \"srcAsns\": [\n    integer\n    ]\n  },\n  \"action\": string,\n  \"\
        preview\": boolean,\n  \"rateLimitOptions\": {\n    \"rateLimitThreshold\"\
        : {\n    \"count\": integer,\n    \"intervalSec\": integer\n    },\n    \"\
        conformAction\": string,\n    \"exceedAction\": string,\n    \"exceedRedirectOptions\"\
        : {\n    \"type\": enum,\n    \"target\": string\n    },\n    \"enforceOnKey\"\
        : enum,\n    \"enforceOnKeyName\": string,\n    \"enforceOnKeyConfigs\": [\n\
        \    {\n      \"enforceOnKeyType\": enum,\n      \"enforceOnKeyName\": string\n\
        \    }\n    ],\n    \"banThreshold\": {\n    \"count\": integer,\n    \"intervalSec\"\
        : integer\n    },\n    \"banDurationSec\": integer\n  },\n  \"headerAction\"\
        : {\n    \"requestHeadersToAdds\": [\n    {\n      \"headerName\": string,\n\
        \      \"headerValue\": string\n    }\n    ]\n  },\n  \"redirectOptions\"\
        : {\n    \"type\": enum,\n    \"target\": string\n  },\n  \"preconfiguredWafConfig\"\
        : {\n    \"exclusions\": [\n    {\n      \"targetRuleSet\": string,\n    \
        \  \"targetRuleIds\": [\n      string\n      ],\n      \"requestHeadersToExclude\"\
        : [\n      {\n        \"val\": string,\n        \"op\": enum\n      }\n  \
        \    ],\n      \"requestCookiesToExclude\": [\n      {\n        \"val\": string,\n\
        \        \"op\": enum\n      }\n      ],\n      \"requestQueryParamsToExclude\"\
        : [\n      {\n        \"val\": string,\n        \"op\": enum\n      }\n  \
        \    ],\n      \"requestUrisToExclude\": [\n      {\n        \"val\": string,\n\
        \        \"op\": enum\n      }\n      ]\n    }\n    ]\n  }\n}"
    type: content
    description: 'JSON definition of the rule to add. For more information about adding
        a rule to a policy, see Method: securityPolicies.addRule (https://cloud.google.com/compute/docs/reference/rest/v1/securityPolicies/addRule).'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_rule_to_security_policy_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
simulation_data_json: '{"Entities":[]}'
