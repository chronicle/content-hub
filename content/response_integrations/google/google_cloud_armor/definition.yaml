identifier: GoogleCloudArmor
name: Google Cloud Armor
parameters:
-   name: API Root
    default_value: https://compute.googleapis.com/compute/v1/
    type: string
    description: API root of the Google Cloud Armor service.
    is_mandatory: true
    integration_identifier: GoogleCloudArmor
-   name: Project ID
    default_value: ''
    type: string
    description: Project ID to use for the Cloud Armor integration. If no value is
        provided, the Project ID is extracted from the JSON file content provided
        in the User Service Account parameter.
    is_mandatory: false
    integration_identifier: GoogleCloudArmor
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: 'Client email of your service account. You can configure either this
        parameter or the User Service Account parameter. Note: To impersonate service
        accounts with the Workload Identity Email, grant the Service Account Token
        Creator role to your service account. For more details about workload identities
        and how to work with them, see Identities for workloads (https://cloud.google.com/iam/docs/workload-identities).'
    is_mandatory: false
    integration_identifier: GoogleCloudArmor
-   name: User Service Account
    default_value: ''
    type: password
    description: Content of the service account JSON file that you use for the Google
        Cloud Armor service. Provide a full content of the service account JSON file.
        You can configure either this parameter or the Workload Identity Email parameter.
    is_mandatory: false
    integration_identifier: GoogleCloudArmor
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the parameter verifies that the SSL certificate for
        the connection to the Google Cloud Armor service is valid.
    is_mandatory: false
    integration_identifier: GoogleCloudArmor
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-armor
categories:
- Network Security
- WAF
svg_logo_path: resources/logo.svg
image_path: resources/image.png
