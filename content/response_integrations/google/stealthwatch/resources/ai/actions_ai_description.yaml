Search Events:
  ai_description: >-
    ### General Description

    Retrieves security events for a specific host (IP address) within a given time
    frame using Cisco Secure Network Analytics (Stealthwatch). This action queries
    the Stealthwatch API to find alerts and their associated security events for the
    targeted IP addresses.


    ### Flow Description

    1. Iterates over target entities, filtering for those of type `ADDRESS`.

    2. For each valid entity, retrieves the domain ID associated with the IP address
    via the Stealthwatch API.

    3. Searches for alerts linked to the domain ID and IP address within the specified
    time frame.

    4. For each alert found, performs a subsequent search to retrieve the related
    security events.

    5. Attaches the raw event data as JSON and a filtered summary as a CSV table to
    the action's results for the entity.


    ### Additional Notes

    The action requires the `Timeframe` parameter to determine the search window (in
    hours) looking back from the current time.
  ai_short_description: >-
    Retrieves security events for a specific host (IP address) within a given time
    frame using Cisco Secure Network Analytics (Stealthwatch).
