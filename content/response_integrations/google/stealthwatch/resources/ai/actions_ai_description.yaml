Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Stealthwatch instance to ensure that the integration
    is configured correctly and can communicate with the external service.


    ### Flow Description

    1. Initializes the connection to the Stealthwatch instance using the provided
    integration configurations (API Root, Username, Password).

    2. Executes an API call to the `/smc/rest/product/info` endpoint to verify connectivity.

    3. Returns a success message if the connection is established successfully.


    ### Additional Notes

    This action does not require any specific parameters and is primarily used for
    troubleshooting and verifying integration settings.
  ai_short_description: >-
    Tests connectivity to the Stealthwatch instance to ensure that the integration
    is configured correctly.
