Search Flows:
  ai_description: >-
    ### General Description

    Retrieves network flow data associated with IP address entities from Cisco Secure
    Network Analytics (Stealthwatch) within a specified timeframe.


    ### Flow Description

    1. Initializes the Stealthwatch API client.

    2. Iterates through target entities, filtering for IP addresses.

    3. For each IP address, retrieves the associated domain ID via the Stealthwatch
    API.

    4. Executes a flow search API call to find flows where the IP is the source.

    5. Executes a flow search API call to find flows where the IP is the destination.

    6. Aggregates the flow results.

    7. Attaches the raw JSON results and a formatted CSV table to the entity in the
    SecOps platform.


    ### Additional Notes

    The action requires a timeframe (in hours) and a limit for the number of flows
    to retrieve.
