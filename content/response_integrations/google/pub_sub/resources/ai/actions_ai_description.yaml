Ping:
  ai_description: "### General Description\nThe **Ping** action is a diagnostic tool\
    \ designed to verify the connectivity between Google SecOps and the Google Cloud\
    \ Pub/Sub service. Its primary purpose is to ensure that the integration's configuration\u2014\
    including the Service Account JSON, Project ID, and network settings\u2014is correct\
    \ and that the environment has the necessary permissions to authenticate and interact\
    \ with the Pub/Sub API.\n\n### Flow Description\n1. **Initialization**: The action\
    \ initializes the authentication manager using the global integration configuration\
    \ (Service Account JSON, Project ID, etc.).\n2. **Client Preparation**: It prepares\
    \ a Google Cloud Pub/Sub API client with an authorized session.\n3. **Connectivity\
    \ Test**: The action attempts to refresh the OAuth2 credentials by making a request\
    \ to the authentication server. This step validates the service account's validity\
    \ and the ability to reach Google Cloud's authentication servers.\n4. **Result\
    \ Reporting**: If the credential refresh is successful, the action returns a success\
    \ message; otherwise, it raises an exception with details about the failure.\n\
    \n### Additional Notes\nThis action is typically used during the initial setup\
    \ of the Pub/Sub integration or for troubleshooting authentication and network\
    \ issues. It does not interact with any specific entities or fetch message data."
  ai_short_description: >-
    A diagnostic tool designed to verify the connectivity between Google SecOps and
    the Google Cloud Pub/Sub service by testing authentication and network settings.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
