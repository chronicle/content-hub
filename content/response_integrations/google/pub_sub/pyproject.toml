[project]
name = "pub_sub"
version = "5.0"
description = "Pub/Sub is a service that allows applications to send and receive messages asynchronously, making it easier to build scalable and reliable systems."
requires-python = ">=3.11,<3.12"
dependencies = [ "environmentcommon", "google-auth>=2.47.0", "requests==2.32.5", "tipcommon",]

[dependency-groups]
dev = [ "integration-testing", "pytest>=9.2.0", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.3-py3-none-any.whl"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.4.8-py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.4.8-py3-none-any.whl"
