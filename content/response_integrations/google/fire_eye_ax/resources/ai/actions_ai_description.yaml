Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the FireEye AX server to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the FireEye AX API manager.

    3. Makes a GET request to the `/wsapis/v2.0.0/config` endpoint to verify authentication
    and network connectivity.

    4. Returns a success message if the connection is established, otherwise returns
    an error.


    ### Additional Notes

    This action does not require any action-specific parameters and does not interact
    with any entities or case data.
