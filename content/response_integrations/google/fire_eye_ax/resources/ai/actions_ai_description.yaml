Submit File:
  ai_description: >-
    ### General Description

    Submits one or more files from the local SOAR environment to FireEye AX for malware
    analysis.


    ### Flow Description

    1. Extracts the provided file paths and analysis configuration parameters (e.g.,
    VM Profile, Priority, Analysis Type).

    2. Iterates through the list of file paths and submits each file to FireEye AX
    via a POST request to the `/wsapis/v2.0.0/submissions` endpoint.

    3. Operates asynchronously, periodically checking the status of the submissions.

    4. Once a submission is complete, retrieves the detailed analysis results via
    a GET request to the `/wsapis/v2.0.0/submissions/results/{result_id}` endpoint.

    5. If the `Create Insight` parameter is enabled, generates a case insight containing
    the analysis summary for each successfully processed file.

    6. Attaches the raw JSON results to the action's output.


    ### Additional Notes

    The action runs asynchronously. Ensure the script timeout value in the IDE is
    adjusted as needed to allow sufficient time for the analysis to complete.
  ai_short_description: >-
    Submits one or more files to FireEye AX for malware analysis and retrieves the
    results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads a file to FireEye AX to initiate a malware analysis job.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to upload a file to FireEye AX, which mutates
      external data by creating an analysis job. It also fetches the analysis results.
      It does not update entities, but it can create case insights based on the 'Create
      Insight' parameter.
