Get Appliance Details:
  ai_description: >-
    ### General Description

    Retrieves configuration and status details about the connected FireEye AX appliance.
    This action is useful for verifying the health, configuration, or general information
    of the FireEye AX instance integrated with Google SecOps.


    ### Flow Description

    1. Initializes the FireEye AX manager using the provided integration-level credentials
    and settings.

    2. Makes an HTTP GET request to the FireEye AX API (`wsapis/v2.0.0/config`) to
    fetch the appliance details.

    3. Parses the response and attaches the retrieved details to the action's JSON
    result.


    ### Additional Notes

    This action does not operate on entities and does not require any action-specific
    parameters.
  ai_short_description: >-
    Retrieves configuration and status details about the connected FireEye AX appliance.
