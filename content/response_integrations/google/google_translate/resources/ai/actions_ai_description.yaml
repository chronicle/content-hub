    Filtering logic is working based on the value provided in the "Filter Key" parameter.
    |

    | Max Records To Return | string | No | Specify how many records to return. If
    nothing is provided, action will return 50 records. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Google Translate API using the integration configuration
    parameters.


    ### Flow Description

    1. Extracts the API Root, API Key, and Verify SSL settings from the integration
    configuration.

    2. Initializes the Google Translate manager.

    3. Makes an HTTP GET request to the `/language/translate/v2/languages` endpoint
    to verify the API key and connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to ensure the integration
    is configured correctly.
  ai_short_description: >-
