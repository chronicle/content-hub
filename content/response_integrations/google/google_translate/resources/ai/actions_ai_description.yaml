Translate Text:
  ai_description: >-
    ### General Description

    Translates a given text from a source language to a target language using the
    Google Translate API.


    ### Flow Description

    1. Extracts the configuration and action parameters, including the text to translate
    and the target language.

    2. Initializes the Google Translate manager with the provided API credentials.

    3. Makes a POST request to the Google Translate API to translate the provided
    text.

    4. Returns the translation result as a JSON object and attaches it to the action
    result.


    ### Additional Notes

    If the source language is not provided, the Google Translate API will attempt
    to detect it automatically.
