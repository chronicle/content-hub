List Languages:
  ai_description: >-
    ### General Description

    Lists available languages in Google Translate based on specified filtering criteria.


    ### Flow Description

    1. Extracts action parameters including `Filter Key`, `Filter Logic`, `Filter
    Value`, and `Max Records To Return`.

    2. Validates the provided filter parameters and the record limit.

    3. Makes a GET request to the Google Translate API to retrieve the list of available
    languages.

    4. Filters the retrieved languages locally based on the provided criteria (e.g.,
    matching the language name).

    5. Outputs the filtered list of languages as a data table and as a JSON result.


    ### Additional Notes

    If no filter value is provided but a filter key and logic are selected, the filter
    will not be applied.
  ai_short_description: >-
    Lists available languages in Google Translate based on specified filtering criteria.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
