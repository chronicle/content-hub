name: Create SCC Enterprise Cloud Posture Ticket Type SNOW
description: This action will create a new ticket type called "SCC Enterprise Cloud
    Posture Ticket" in ServiceNow. It’s a mandatory requirement for the "Sync SCC-ServiceNow
    Tickets" job and "Posture Findings with SNOW" playbook to work.
integration_identifier: SCCEnterprise
parameters:
-   name: API Root
    default_value: https://{dev-instance}.service-now.com/api/now/v1/
    type: string
    description: API root of the ServiceNow instance.
    is_mandatory: true
-   name: Username
    type: string
    description: Username of the ServiceNow account.
    is_mandatory: true
-   name: Password
    type: password
    description: Password of the ServiceNow account.
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        ServiceNow is valid.
    is_mandatory: false
-   name: Table Role
    default_value: u_scc_enterprise_cloud_posture_ticket_user
    type: string
    description: Specify the role that should be set to access the newly created table.
        If nothing is provided, action will create a new role "u_scc_enterprise_cloud_posture_ticket_user".
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_scc_enterprise_cloud_posture_ticket_type_snow_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
