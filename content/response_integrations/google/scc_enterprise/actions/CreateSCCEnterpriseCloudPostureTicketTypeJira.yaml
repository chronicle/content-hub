name: Create SCC Enterprise Cloud Posture Ticket Type Jira
description: 'This action will create a new ticket type called SCC Enterprise Cloud
    Posture Ticket” in Jira. It’s a mandatory requirement for the “Sync SCC-Jira Tickets”
    job and “Posture Findings with Jira” playbook to work. Note: as a part of the
    process, action will create a new project SCC Enterprise Project” dedicated to
    SCC Enterprise.'
integration_identifier: SCCEnterprise
parameters:
-   name: API Root
    default_value: ''
    type: string
    description: API root of the Jira instance.
    is_mandatory: true
-   name: Username
    default_value: ''
    type: string
    description: Username of the Jira account.
    is_mandatory: true
-   name: API Token
    default_value: ''
    type: password
    description: Password of the Jira account.
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to Jira
        is valid.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_scc_enterprise_cloud_posture_ticket_type_jira_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
