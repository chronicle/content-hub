name: SCC Enterprise - Urgent Posture Findings Connector
parameters:
-   name: DeviceProductField
    default_value: findingClass
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: category
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: 'Describes the name of the field where the environment name is stored.

        If the environment field isn''t found, the environment is the default environment.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: 'A regex pattern to run on the value found in the "Environment Field
        Name" field.

        Default is .* to catch all and return the value unchanged.

        Used to allow the user to manipulate the environment field via regex logic.

        If the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: PythonProcessTimeout
    default_value: 60
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://securitycenter.googleapis.com
    type: string
    description: API root of the Google Security Command Center instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Organization ID
    default_value: ''
    type: string
    description: ID of the organization that should be used in Google Security Command
        Center integration.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Location ID
    default_value: global
    type: string
    description: ID of the location that should be used in Google Security Command
        Center integration. Defaults to ‘global’
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: PubSub Project ID
    default_value: ''
    type: string
    description: ID of the project that will be used in the integration to host the
        Pub/Sub Topic and Subscription connection.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Quota Project ID
    default_value: ''
    type: string
    description: ID of your Google Cloud project for Google Cloud API usage and billing.
        If no value is provided, the project ID defined in your Google Cloud service
        account is used. For this parameter to work, make sure to grant the “Service
        Usage Consumer” IAM role to your Google Cloud service account.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: User Service Account
    default_value: ''
    type: password
    description: Service Account that is used for authentication. If both this and
        "Workload Identity Email" not provided, the default Service Account of the
        SecOps Instance will be used to authenticate.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: A Service Account Client Email to replace the usage of "User's Service
        Account", which will be used for Impersonation. Note that the SOAR Service
        Account must be granted the "Service Account Token Creator" IAM role on the
        User Service Account. If both this and "User's Service Account" not provided,
        the default Service Account of the SecOps Instance will be used to authenticate.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Owner Tag Name
    default_value: Owner Name
    type: string
    description: Name of the tag that contains information about the owner of the
        finding.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Fallback Owner
    default_value: ''
    type: string
    description: Email address of the owner of the alerts created by this connector.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Group By GCP Project
    default_value: true
    type: boolean
    description: If enabled, the connector will group findings by project.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Group By AWS Account
    default_value: true
    type: boolean
    description: If enabled, the connector will group findings by AWS account.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Group By Azure Subscription
    default_value: true
    type: boolean
    description: If enabled, the connector will group findings by Azure subscription.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Group By Severity
    default_value: true
    type: boolean
    description: If enabled, the connector will group findings by severity.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Group By Asset Type
    default_value: true
    type: boolean
    description: If enabled, the connector will group findings by asset type.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Google Security Command Center server is valid.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If enabled, the connector will disable the overflow mechanism.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Pull information about urgent posture findings in Google Security Command
    Center.
integration: SCCEnterprise
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-security-command-center#findings-connector
rules: []
is_connector_rules_supported: false
creator: admin
