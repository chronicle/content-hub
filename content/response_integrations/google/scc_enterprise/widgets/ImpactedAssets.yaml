title: Impacted Assets
type: html
scope: case
action_identifier: Impacted Assets
description: This widget highlights the most important attributes regarding the resource,
    coming from Cloud Asset Inventory
data_definition:
    html_height: 350
    safe_rendering: false
    widget_definition_scope: both
    type: html
condition_group:
    conditions:
    -   field_name: '[Case.CASI_Enrichment]'
        value: '{'
        match_type: contains
        custom_operator_name: null
    -   field_name: '[Case.Tags]'
        value: Toxic Combination
        match_type: not_contains
        custom_operator_name: null
    logical_operator: and
default_size: full_width
