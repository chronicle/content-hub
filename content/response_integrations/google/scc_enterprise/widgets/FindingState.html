<!DOCTYPE html>

  <style>
    :root {
      --background-color: #212c44;
      --text-color: #fff;
      --heading-text-size: 1rem;
      --font-family: Source Sans Pro;
      --font-style: normal;
      --font-weight: 600;
      --link-color: #8ab4f8;
      --thead-color: #26334f;
      --widget-text-font: "Source Sans Pro", sans-serif;
      --widget-number-font: "Open Sans", sans-serif;
      --font-size-medium: 14px;

      --dark-gray-100: hsl(0, 0%, 1000%);
      --dark-gray-200: hsl(216, 45%, 84%);
      --dark-gray-300: hsl(220, 22%, 62%);
      --dark-gray-400: hsl(221, 26%, 46%);
      --dark-gray-500: hsl(221, 30%, 33%);
      --dark-gray-600: hsl(221, 32%, 27%);
      --dark-gray-700: hsl(221, 35%, 23%);
      --dark-gray-800: hsl(221, 35%, 20%);
      --dark-gray-900: hsl(240, 25%, 12%);

      --color-table-even-row: hsl(226, 32%, 15%);
      --color-link: hsl(217, 89%, 76%);

      --widget-width-in-screen: 100%;
      --widget-height-in-screen: 100%;

      --widget-font-style: normal;

      --widget-text-font: "Source Sans Pro", sans-serif;
      --widget-number-font: "Open Sans", sans-serif;

      --font-weight-bold: 700;
      --font-weight-semibold: 600;
      --font-weight-regular: 400;

      --font-size-big: 16px;
      --font-size-medium: 14px;

      --default-line-height: 16px;

      --scrollbar-size: 12px;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    /* Track */
    ::-webkit-scrollbar-track {
      background: #212c44;
    }

    /* Handle */
    ::-webkit-scrollbar-thumb {
      border-radius: 10px;
      border: 3px solid transparent;
      background: hsl(221, 26%, 46%) !important;
      background-clip: content-box;
    }

    .logo {
      display: flex;
      align-items: center;
    }
    .logo svg {
      padding-right: 5px;
    }
    body {
      overflow: hidden;
      background-color: var(--background-color);
      color: var(--text-color);
    }
    .main {
    }
    .fixed-width {
      word-wrap: break-word;
    }
    .graph_div {
    }
    .data_container {
      padding: 0 1vw 1vh 1vw;
    }
    .data {
      padding: 0 0.4em 0 0;
      font-size: var(--heading-text-size);
      font-family: var(--font-family);
      font-style: var(--font-style);
    }
    .table_side {
      padding: 5px 1vw 0 1vw;
      height: 300px;
      overflow-y: scroll;
      overflow-x: auto;
    }

    .table_side table {
      font-size: var(--font-size-medium);

      width: 100%;

      border-collapse: collapse;

    }

    .table_side tr {

    }

    .table_side tr:nth-child(even) {

    }

    .table_side td {

      max-width:60vw;

      font-family: var(--widget-text-font);
    }

    .table_side th {
      font-family: var(--widget-text-font);
      font-weight: var(--font-weight-semibold);
      line-height: var(--default-line-height);

      background-color: var(--dark-gray-600);

      text-transform: uppercase;

    }

    thead {

    .box {

    }

      display: flex;
      align-items: center;

    }

      width: 90px;

    }
    @media screen and (min-height: 450px) {
      .table_side {
        padding: 5px 1vw 0 1vw;

        overflow-y: scroll;
        overflow-x: auto;

  </style>
  <body>
    <div class="main">
      <!-- defines main body of widget -->
      <div class="graph_div">
        <!-- left side is dedicated to graph section -->
        <div class="data_container">
          <div class="box">
            <div class="active data" id="active">Active - </div>
            <div class="muted data" id="muted">Muted - </div>
            <div class="resolved data" id="resolved">Closed - </div>
          </div>
        </div>
      </div>
      <div class="table_side">
        <!-- side dedicated to table section -->
        <table id="main-table">
          <thead id="main-table-header">
            <th class="fixed-width">IMPACTED RESOURCE</th>
            <th>STATUS</th>
            <th>SEVERITY</th>
            <th>RELATED TCs</th>
            <th>SOURCE</th>
          </thead>
          <tbody id="table_body"></tbody>
        </table>
      </div>
    </div>
  </body>
  <script>
    var json = [Case.SCC-FINDINGS-STATE]; //getting json data from placeholder
        //getting json data from placeholder

    var context_json = json.finding_context_list;

    $(document).ready(function () {
      build_table(context_json); //build the table based on context_json
      get_values(context_json);
      //render_chart(); //build chart on the basis of context_json
    });

       19 -23 42 -10 42 4 0 16 -9 28 -20z"/>
       </g>
       </svg>`,
      };
    }

    function severity_icons(severity) {
      var icon = "";
      switch (fieldExists(severity.toUpperCase())) {
        case "LOW":
          icon = `<svg xmlns="http://www.w3.org/2000/svg" width="27" height="6" viewBox="0 0 27 6" fill="none" class="severity_icons">
            <path d="M6 3C6 4.65685 4.65685 6 3 6C1.34315 6 0 4.65685 0 3C0 1.34315 1.34315 0 3 0C4.65685 0 6 1.34315 6 3Z" fill="#42c3d0"/>
            <path d="M13 3C13 4.65685 11.6569 6 10 6C8.34315 6 7 4.65685 7 3C7 1.34315 8.34315 0 10 0C11.6569 0 13 1.34315 13 3Z" fill="#B2B6BD"/>
            <path d="M20 3C20 4.65685 18.6569 6 17 6C15.3431 6 14 4.65685 14 3C14 1.34315 15.3431 0 17 0C18.6569 0 20 1.34315 20 3Z" fill="#B2B6BD"/>
            <path d="M27 3C27 4.65685 25.6569 6 24 6C22.3431 6 21 4.65685 21 3C21 1.34315 22.3431 0 24 0C25.6569 0 27 1.34315 27 3Z" fill="#B2B6BD"/>
          </svg> Low`;
          break;
        case "HIGH":
          icon = `<svg xmlns="http://www.w3.org/2000/svg" width="27" height="6" viewBox="0 0 27 6" fill="none" class="severity_icons">
            <path d="M6 3C6 4.65685 4.65685 6 3 6C1.34315 6 0 4.65685 0 3C0 1.34315 1.34315 0 3 0C4.65685 0 6 1.34315 6 3Z" fill="#fa903e"/>
            <path d="M13 3C13 4.65685 11.6569 6 10 6C8.34315 6 7 4.65685 7 3C7 1.34315 8.34315 0 10 0C11.6569 0 13 1.34315 13 3Z" fill="#fa903e"/>
            <path d="M20 3C20 4.65685 18.6569 6 17 6C15.3431 6 14 4.65685 14 3C14 1.34315 15.3431 0 17 0C18.6569 0 20 1.34315 20 3Z" fill="#fa903e"/>
            <path d="M27 3C27 4.65685 25.6569 6 24 6C22.3431 6 21 4.65685 21 3C21 1.34315 22.3431 0 24 0C25.6569 0 27 1.34315 27 3Z" fill="#B2B6BD"/>
          </svg> High`;
          break;
        case "MEDIUM":
          icon = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="27" height="6" viewBox="0 0 27 6" fill="none" class="severity_icons">
            <path d="M6 3C6 4.65685 4.65685 6 3 6C1.34315 6 0 4.65685 0 3C0 1.34315 1.34315 0 3 0C4.65685 0 6 1.34315 6 3Z" fill="#fcc934"/>
            <path d="M13 3C13 4.65685 11.6569 6 10 6C8.34315 6 7 4.65685 7 3C7 1.34315 8.34315 0 10 0C11.6569 0 13 1.34315 13 3Z" fill="#fcc934"/>
            <path d="M20 3C20 4.65685 18.6569 6 17 6C15.3431 6 14 4.65685 14 3C14 1.34315 15.3431 0 17 0C18.6569 0 20 1.34315 20 3Z" fill="#B2B6BD"/>
            <path d="M27 3C27 4.65685 25.6569 6 24 6C22.3431 6 21 4.65685 21 3C21 1.34315 22.3431 0 24 0C25.6569 0 27 1.34315 27 3Z" fill="#B2B6BD"/>
          </svg> Medium
                    `;
          break;
        case "TIME CRITICAL":
          icon = `<svg xmlns="http://www.w3.org/2000/svg" width="27" height="6" viewBox="0 0 27 6" fill="none" class="severity_icons">
            <path d="M6 3C6 4.65685 4.65685 6 3 6C1.34315 6 0 4.65685 0 3C0 1.34315 1.34315 0 3 0C4.65685 0 6 1.34315 6 3Z" fill="#ff5a50"/>
            <path d="M13 3C13 4.65685 11.6569 6 10 6C8.34315 6 7 4.65685 7 3C7 1.34315 8.34315 0 10 0C11.6569 0 13 1.34315 13 3Z" fill="#ff5a50"/>
            <path d="M20 3C20 4.65685 18.6569 6 17 6C15.3431 6 14 4.65685 14 3C14 1.34315 15.3431 0 17 0C18.6569 0 20 1.34315 20 3Z" fill="#ff5a50"/>
            <path d="M27 3C27 4.65685 25.6569 6 24 6C22.3431 6 21 4.65685 21 3C21 1.34315 22.3431 0 24 0C25.6569 0 27 1.34315 27 3Z" fill="#ff5a50"/>
          </svg> Critical`;
          break;
        case "CRITICAL":
          icon = `<svg xmlns="http://www.w3.org/2000/svg" width="27" height="6" viewBox="0 0 27 6" fill="none" class="severity_icons">
            <path d="M6 3C6 4.65685 4.65685 6 3 6C1.34315 6 0 4.65685 0 3C0 1.34315 1.34315 0 3 0C4.65685 0 6 1.34315 6 3Z" fill="#ff5a50"/>
            <path d="M13 3C13 4.65685 11.6569 6 10 6C8.34315 6 7 4.65685 7 3C7 1.34315 8.34315 0 10 0C11.6569 0 13 1.34315 13 3Z" fill="#ff5a50"/>
            <path d="M20 3C20 4.65685 18.6569 6 17 6C15.3431 6 14 4.65685 14 3C14 1.34315 15.3431 0 17 0C18.6569 0 20 1.34315 20 3Z" fill="#ff5a50"/>
            <path d="M27 3C27 4.65685 25.6569 6 24 6C22.3431 6 21 4.65685 21 3C21 1.34315 22.3431 0 24 0C25.6569 0 27 1.34315 27 3Z" fill="#ff5a50"/>
          </svg> Critical`;
          break;
        default:
          icon = 'N/A'
          break;
      }

      return icon;
    }

    function calculate_percentage(resolved, total) {
      /* utility method to calculate percentage */
      let percentage = (resolved / total) * 100;
      return percentage.toFixed(0);
    }

    function fieldExists(str){
      return ['', null, undefined].includes(str) ? "N/A" : str;
    }

    function get_values(json_input) {
      /* utility method to calculate the resolved and active fieldExists
            json_input: Arr[Object]
          */
      let resolved = 0;
      let active = 0;
      let inactive = 0;
      let muted = 0;
      for (i = 0; i < json_input.length; i++) {
        let item = json_input[i];
        if(!item.status) continue;
        else if (fieldExists(item.status) === "RESOLVED") resolved++;
        else if (fieldExists(item.status) === "ACTIVE" ){
            if(item.mute === 'MUTED') muted++;
            else active++;
        }
        else if (item.status === "INACTIVE") resolved++;
        else muted++;
      }
      $("#completion").html(
        calculate_percentage(resolved, json_input.length) + "% completion"
      );
      render_fields(active, resolved, muted); // to change resolved labels
    }

    function resolve_status(state, mute) {
      let new_state = "";
      if (state === "ACTIVE") {
        switch (mute) {
          case "UNMUTED":
            return "ACTIVE";
          case "MUTED":
            return "MUTED";
          default:
            return "ACTIVE";
        }
      }
      if (state === "INACTIVE") {
        return "CLOSED";
      } else {
        return fieldExists(state);
      }
    }

    function render_fields(active, resolved, muted) {
      /* utility method to populate the resolved and active icons and value
            active: int; no of active findings,
            resolved: int; no of resolved findings
          */
      let resolved_html = `<div class="resolved_html">${
        get_icons().inactive
      }<div>${$(".resolved").html()}</div>&nbsp${resolved}</div>`;
      let active_html = `<div class="resolved_html">${get_icons().active}
          <div style="">${$(
            ".active"
          ).html()}</div style="margin-left:4px;">&nbsp${active}</div>`;
      let muted_html = `<div class="resolved_html">${
        get_icons().muted
      }  <div style="">${$(
        ".muted"
      ).html()}</div>&nbsp${muted}</div>`;

      $("#resolved").html(' '+resolved_html);
      $("#active").html(' '+active_html);
      $("#muted").html('  '+muted_html);
    }

    function get_status_icon(status){
      if(status.toUpperCase() === 'ACTIVE') return get_icons().active;
      if(status.toUpperCase() === 'INACTIVE') return get_icons().inactive;
      if(status.toUpperCase() === 'CLOSED') return get_icons().inactive;
      if(status.toUpperCase() === 'MUTED') return get_icons().muted;
      else return '';
    }

    function capitalize(string) {
      /* utility method to capitalize the uppercase string
            string: string
          */
      let str = string.toLowerCase();
      return str[0].toUpperCase() + str.slice(1);
    }

    function build_table(json_input) {
      /* The method to build the Html of the table requires
            json_input: Array of finding objects
          */
      let tHtml = "";
      for (i = 0; i < json_input.length; i++) {
        let item = json_input[i];
        const tc_count = fieldExists(item.tc_count);
        let state = fieldExists(item.status);
        let mute = fieldExists(item.mute);
        let resource_name = fieldExists(item.resource_name);
        let severity = fieldExists(item.severity);

        let icon = get_status_icon(resolve_status(state, mute))
        tHtml += "<tr>";
        tHtml += "<td class='fixed-width'>" + resource_name + "</td>";
        tHtml +=
          "<td> <div class='logo'>" +
          icon +
          "<div>" +
          (resolve_status(state, mute) == "INACTIVE"
            ? "Resolved"
            : capitalize(resolve_status(state, mute))) +
          "</div>" +
          "</div></td>";
        tHtml += `<td>${fieldExists(severity_icons(severity))}</td>`;
        tHtml += `<td>${tc_count}</td>`;

        tHtml +=
          "<td><div class='explore_icon'>" +
          `<a href=${build_explore_link(
            item.finding_id,
          )} class='link' target="_blank">Explore </a>` +
          explore_icon();
        ("</div></td>");
        tHtml += "</tr>";
        icon = "";
      }
      $("#table_body").html(tHtml);
    }

    function explore_icon() {
      /* utility method to return the explore icon svg*/
      return `<svg xmlns="http://www.w3.org/2000/svg" width="19" height="18" viewBox="0 0 19 18" fill="none">
                <path
                  d="M14.8746 14.25H4.37494V3.75H9.62475V2.25H4.37494C3.54247 2.25 2.875 2.925 2.875 3.75V14.25C2.875 15.075 3.54247 15.75 4.37494 15.75H14.8746C15.6995 15.75 16.3745 15.075 16.3745 14.25V9H14.8746V14.25Z"
                  fill="#8AB4F8" />
                <path d="M11.1252 2.25V3.75H13.8176L6.44537 11.1225L7.50283 12.18L14.8751 4.8075V7.5H16.375V2.25H11.1252Z"
                  fill="#8AB4F8" />
              </svg>`;
    }

    function build_explore_link(findingName, projectDisplayName) {
      /* method to build the explore link addLongTextClickLogic
          findingName: str
          projectDisplayName: str
          */
      const instance_url = json.instance_url;
      if (findingName) {
        return instance_url + "/posture/findings?name=" + findingName;
      }
    }

    function render_chart() {
      /* A method to build Pie chart to visualize the findings status using the d3.js lib  */
      jsonData = {
        titles: ["title 1", "title 2", "title 3"],
        colors: ["#56AA97", "#FF4141"],
        values: get_values(context_json),
      };

      var data = jsonData.values;
      var colors = jsonData.colors;

      var svg = d3.select(".graph"),
        width = svg.attr("width"),
        height = svg.attr("height"),
        radius = Math.min(width, height) / 2,
        g = svg
          .append("g")
          .attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");
      var color = d3.scaleOrdinal(colors);

      var pie = d3.pie();

      var arc = d3.arc().innerRadius(45).outerRadius(radius);

      var arcs = g
        .selectAll("arc")
        .data(pie(data))
        .enter()
        .append("g")
        .attr("class", "arc");

      arcs
        .append("path")
        .attr("fill", function (d, i) {
          return color(i);
        })
        .attr("d", arc);
    }
  </script>
</html>
