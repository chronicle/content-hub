    function fieldExists(property){
        return ['', null, undefined].includes(property) ? 'N/A' : property;
    }
    function build_reassign_button(link){
            if(link == 'N/A') return;
            $('.assignee_and_button').append('<button class="btn">Reassign</button>');
            const logic = (link)=>{
                $('.btn').click(()=>{
                    window.open(link, "_blank");
                })
            }
            logic(link);
    }

    function isValidHttpUrl(string) {
        let url;
        try {
            url = new URL(string);
        } catch (_) {
            return false;
        }
        return url.protocol === "http:" || url.protocol === "https:";
    }

    productInfo == 'SNOW'?

    $(".priorty").html(`<div> ${severity_icons_jira(outputJSON.ticket.priority)}</div>`)
    $(".desc_text").html(description);
    $(".assignee").html(outputJSON.ticket.assignee);
    $(".time").html(outputJSON.ticket.update_time);
    const isUrl = isValidHttpUrl(outputJSON.ticket.uri);
    if (isUrl) {
        $(".ticket_id").html(outputJSON.ticket.id + svg_text);
        $(".link_jira").css({
            cursor: "pointer",
            color: "#8ab4f8",
            "text-decoration": "none",
        });
    } else {
        $(".ticket_heading").html(
            `<div class="ticket_id text">` + outputJSON.ticket.id + `</div>`
        );
    }
    const url = outputJSON.ticket.uri;
    $(".link_jira").attr("href", url);
    if (outputJSON.ticket.status == "In Progress") {
        const inprogress = '<div class="">In Progress</div>';
        $(".status").html(inprogress);
        $(".statusbox").css("color", "#FFFFFF");
        $(".inprogress_icon").hide();

        $(".failed_icon").hide();
    } else {
        const inprogress =
            '<div class="">' + outputJSON.ticket.status + "</div>";
        $(".status").html(inprogress);
        $(".statusbox").css("color", "#FFFFFF");
        $(".inprogress_icon").hide();
        $(".failed_icon").hide();
    }

    $(".jira").hide();
    $(".servicenow").show();

    function fieldExists(field) {
        return [undefined, ""].includes(field) ? "N/A" : field;
    }
