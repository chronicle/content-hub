<script>
    $(document).ready(function () {
        const placeholders = new Placeholders(); // instansiation of Placeholders
        const utils = new Utils(); // instansiation of Utils
        const nextSteps = utils.validatePlaceholder(placeholders.nextSteps);
        utils.prepareDescription(nextSteps, "nextsteps_content");
        const description = utils.validatePlaceholder(placeholders.summary);
        utils.prepareDescription(description, "description_content");
        utils.openLinksInNewTab();
    });

    function Placeholders() {
        /**
              this part will contain the placeholder in an object
              where fallback: is the fallback msg in case the placehoder
              is failed to get data.
              response: the data inside the placeholder
          */
        this.summary = {
            fallback: "N/A",
            response: `[Case.TC_Description]`,
        }; // placeholder for summary

        this.nextSteps = {
            fallback: "N/A",
            response: `[Case.TC_nextSteps]`,
        };
    }

    function Utils() {
        /**
            common utility methods
          */

        this.openLinksInNewTab = () => {
            // Get all <a> elements in the document
            var links = document.getElementsByTagName('a');

            // Loop through each <a> element
            for (var i = 0; i < links.length; i++) {
                links[i].setAttribute('target', '_blank'); // Add target="_blank" attribute
            }
        }

        this.validatePlaceholder = (placeholder) => {
            /**
                    this method will validate the response of the placeholder
                */
            return !this.placeholderHasData(placeholder.response)
                ? placeholder.response
                : placeholder.fallback; // description fallback handling
        };

        this.placeholderHasData = (placeholder) => {
            /**
                check where the placeholder has some data or not
                */
            return placeholder[1] == "C";
        };

        this.prepareDescription = (description, selector) => {
            /**
                apply markdown and append to the description and nextSteps.
                */
            description = this.formatDescription2(description);
            $("." + selector).append(description);
        };

        this.fieldExists = (field) => {
            /**
                classic methods to check if the field is there or not
                */
            return ["", null, undefined].includes(filed) ? "N/A" : field;
        };

        this.formatDescription2 = (recommendations) => {
            /**
                this method will format the description and return the formatted html.
                */
            const converter = new showdown.Converter();
            return converter.makeHtml(
                this.makeLinksClickable(this.addSpacesToBullets(recommendations, 3))
            );
        };

        this.addSpacesToBullets = (markdown, spacesCount) => {
            /**
                this method is used to add extra spaced in the markdown list.
                */
            // Create a string with the required number of spaces
            const spaces = " ".repeat(spacesCount);

            // Use a regular expression to match the bullet points and add spaces
            const updatedMarkdown = markdown.replace(/^(\s*)- /gm, `$1${spaces}- `);
            return updatedMarkdown;
        };

        this.makeLinksClickable = (inputString) => {
            /**
                this method will make links clickable using a particular regex
                and add anchor tags to keep the links clickable.
                */
            const regex = /\[([^\]]+)\]\(([^)]+)\)/g;
            let match;
            while ((match = regex.exec(inputString)) !== null) {
                return inputString;
            }
            const urlPattern =
                /(\bhttps?:\/\/[^\s<]+\b(?!(?:(?:"[^"]*")|(?:'[^']*')|(?:\([^)]*\))*[^>]*>)))/g;

            // Replace matched URLs with anchor tags
            const clickableString = inputString.replace(
                urlPattern,
                '<a href="$1" target="_blank">$1</a>'
            );

            return clickableString;
        };
    }
</script>
