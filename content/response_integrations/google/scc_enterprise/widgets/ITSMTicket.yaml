title: Ticket Information
type: html
scope: case
action_identifier: '2'
description: This widget presents the details about the related ticket opened in the
    Ticketing system for this case.
data_definition:
    html_height: 350
    safe_rendering: false
    widget_definition_scope: both
    type: html
condition_group:
    conditions:
    -   field_name: '[Case.EXTERNAL-SCC-TICKET-INFO]'
        value: '{'
        match_type: contains
        custom_operator_name: null
    -   field_name: '[Case.Tags]'
        value: Toxic Combination
        match_type: not_contains
        custom_operator_name: null
    logical_operator: and
default_size: full_width
