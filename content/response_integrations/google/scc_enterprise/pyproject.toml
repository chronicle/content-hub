[project]
name = "scc_enterprise"
version = "24.0"
description = "SCC Enterprise integration to set up the SCC Enterprise env"
requires-python = ">=3.11,<3.12"
dependencies = [ "bs4>=0.0.2", "environmentcommon", "google-api-core==2.28.1", "google-auth>=2.47.0", "googleapis-common-protos==1.72.0", "jinja2==3.1.2", "jira==3.2.0", "markdown==3.7", "requests==2.32.5", "tipcommon",]

[dependency-groups]
dev = [ "integration-testing", "pytest>=9.2.0", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.4.2-py3-none-any.whl"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.4.2-py3-none-any.whl"
