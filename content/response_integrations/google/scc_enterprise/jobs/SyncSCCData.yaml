name: Sync SCC Data
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: Name of the environment for the cases.
    is_mandatory: true
-   name: API Root
    default_value: https://securitycenter.googleapis.com
    type: string
    description: API root of the Google Security Command Center instance.
    is_mandatory: true
-   name: Organization ID
    default_value: ''
    type: string
    description: ID of the organization that should be used in Google Security Command
        Center integration.
    is_mandatory: true
-   name: Location ID
    default_value: global
    type: string
    description: ID of the location that should be used in Google Security Command
        Center integration. Defaults to ‘global’
    is_mandatory: false
-   name: PubSub Project ID
    default_value: ''
    type: string
    description: ID of the project that will be used in the integration to host the
        Pub/Sub Topic and Subscription connection.
    is_mandatory: false
-   name: Quota Project ID
    default_value: ''
    type: string
    description: ID of your Google Cloud project for Google Cloud API usage and billing.
        If no value is provided, the project ID defined in your Google Cloud service
        account is used. For this parameter to work, make sure to grant the “Service
        Usage Consumer” IAM role to your Google Cloud service account.
    is_mandatory: false
-   name: User Service Account
    default_value: ''
    type: password
    description: Service Account that is used for authentication. If both this and
        "Workload Identity Email" not provided, the default Service Account of the
        SecOps Instance will be used to authenticate.
    is_mandatory: false
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: A Service Account Client Email to replace the usage of "User's Service
        Account", which will be used for Impersonation. Note that the SOAR Service
        Account must be granted the "Service Account Token Creator" IAM role on the
        User Service Account. If both this and "User's Service Account" not provided,
        the default Service Account of the SecOps Instance will be used to authenticate.
    is_mandatory: false
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: 'Specify how many hours backwards to synchronize data. Default: 24
        hours.'
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Google Security Command server is valid.
    is_mandatory: true
description: This job will synchronize Google Security Command Center based cases
    created by the "Urgent Posture Findings Connector".
documentation_link: null
integration: SCCEnterprise
creator: Admin
