name: Sync SCC-Jira Tickets
parameters:
-   name: Environment
    default_value: Default Environment
    type: string
    description: Environment in which we need to search for the cases.
    is_mandatory: true
-   name: API Root
    default_value: https://{jira_address}
    type: string
    description: API root of the Jira instance.
    is_mandatory: true
-   name: Username
    default_value: ''
    type: string
    description: Username of the Jira account.
    is_mandatory: true
-   name: API Token
    default_value: ''
    type: password
    description: API Token of the Jira account.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: 'Specify how many hours backwards to synchronize statuses. Default:
        24 hours.'
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Jira server is valid.
    is_mandatory: true
description: This job will synchronize tickets in the Jira and Chronicle SOAR case.
    As a part of synchronization the job will work with comments and status of Chronicle
    SOAR cases.
documentation_link: null
integration: SCCEnterprise
creator: Admin
