Prepare Description:
  ai_description: >-
    ### General Description

    This action prepares a formatted description for an ITSM ticket (such as Jira
    or ServiceNow) based on Google Security Command Center (SCC) finding data. It
    dynamically generates content by combining alert-level metadata with a summary
    table of all findings associated with the current case. The output can be formatted
    as either HTML or Jira Wiki Markup.


    ### Flow Description

    1. Retrieves the 'Output' format preference from the action configuration.

    2. Determines the cloud provider (GCP, AWS, or Azure) by analyzing the current
    alert's source grouping identifier.

    3. Pulls finding details such as descriptions, recommendations, next steps, and
    CVSS/CVE information from the alert's event data.

    4. Fetches the finding state context (a list of all findings in the case) from
    the internal case context property `SCC-FINDINGS-STATE`.

    5. Creates a summary table (HTML or JWM) listing impacted resources, their status,
    severity, and links to the SCC console.

    6. Uses Jinja2 templates to render the final description, merging the extracted
    finding details with the generated summary table.

    7. Returns the final formatted string in the action's JSON results.


    ### Additional Notes

    - This action relies on the `SCC-FINDINGS-STATE` case context property. It is
    expected that the 'Set SCC-FINDINGS-STATE Context Value' action has been executed
    earlier in the playbook.

    - If no description can be generated (e.g., missing context), the action will
    return a failure status.
  ai_short_description: >-
