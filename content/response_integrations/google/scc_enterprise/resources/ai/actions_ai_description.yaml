CloudEntityParser:
  ai_description: >-
    ### General Description

    The CloudEntityParser action automatically identifies and extracts cloud-related
    resource identifiers from the raw security events associated with a Google SecOps
    alert. It supports resources from Google Cloud Platform (GCP), Amazon Web Services
    (AWS), and Microsoft Azure. Once identified, these resources are added to the
    case as formal entities, and relationships are established between them (e.g.,
    linking a User to a Host) to provide a clearer picture of the cloud infrastructure
    involved in the alert.


    ### Flow Description

    1. Scans all security events attached to the current alert.

    2. Looks for specific keys (such as `event_principal_user_emailAddresses` or `event_target_resource_name`)
    and applies regex patterns to find GCP Service Accounts, AWS ARNs, EC2 instance
    IDs, S3 buckets, and Azure resource paths.

    3. Maps extracted values to SecOps entity types such as `USER`, `HOSTNAME`, `DATABASE`,
    `DEPLOYMENT`, `CONTAINER`, or `PROCESS` based on the resource format.

    4. Upserts entities: If an entity with the same identifier already exists in the
    case, its additional properties are updated with cloud-specific metadata. If the
    entity is new, it is created and added to the case.

    5. Identifies links between users and resources (e.g., an AWS IAM user accessing
    an EC2 instance or S3 bucket) and creates directional relationships within the
    SecOps case.


    ### Additional Notes

    This action is purely internal and does not communicate with external cloud provider
    APIs; it relies entirely on the data already present in the alert's security events.
  ai_short_description: >-
    Automatically identifies and extracts cloud-related resource identifiers from
    the raw security events associated with a Google SecOps alert, adding them to
    the case as formal entities and establishing relationships between them.
