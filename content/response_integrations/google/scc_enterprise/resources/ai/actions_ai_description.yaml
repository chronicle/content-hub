Add SCCE Tags:
  ai_description: >-
    ### General Description

    Adds metadata tags to a Google SecOps case based on the properties of the security
    events within the alert. This action helps in categorizing and organizing cases
    by extracting key information such as cloud provider, finding class, and project
    identifiers from the event data and applying them as searchable tags.


    ### Flow Description

    1. **Event Iteration**: The action iterates through all security events associated
    with the current alert.

    2. **Property Analysis**: For each event, it examines the `additional_properties`
    dictionary.

    3. **Pattern Matching**: It compares the property keys against a predefined set
    of regex patterns (defined in `TAG_MAPPING`).

    4. **Tag Transformation**: When a match is found, the corresponding value is transformed
    into a standardized tag format (e.g., mapping 'GOOGLE_CLOUD_PLATFORM' to 'Google
    Cloud').

    5. **Tag Application**: The action applies all identified tags to the case using
    the internal SOAR tagging mechanism.

    6. **Result Reporting**: It returns a success message if tags were added, or a
    failure message if no matching properties were found.


    ### Additional Notes

    This action operates entirely on internal case data and does not interact with
    external systems.
  ai_short_description: >-
    Adds metadata tags to a Google SecOps case based on the properties of the security
    events within the alert.
