Set SCC-FINDINGS-STATE Context Value:
  ai_description: >-
    ### General Description

    The **Set SCC-FINDINGS-STATE Context Value** action is a utility task designed
    to maintain a structured state of Google Security Command Center (SCC) findings
    within a Google SecOps case. It populates or updates a specific case context property
    named `SCC-FINDINGS-STATE`. This context serves as a central data store for other
    automated processes, such as the 'Sync SCC Data' job and ITSM (ServiceNow/Jira)
    synchronization tasks, allowing them to track finding statuses, Attack Exposure
    (APS) scores, and resource associations across multiple alerts in a single case.


    ### Flow Description

    1. **Read Existing Context**: The action retrieves the current value of the `SCC-FINDINGS-STATE`
    property from the case context.

    2. **Extract Finding Data**: It parses the first event of the current alert to
    extract finding-specific details, including the finding ID, state (Active/Inactive),
    APS score, and resource name.

    3. **Deduplication Check**: It compares the current alert's finding data against
    the existing context. If the finding is already recorded and the instance URL
    is set, the action terminates to avoid redundant updates.

    4. **Update Context**: If the finding is new, the action identifies the cloud
    provider (GCP, AWS, or Azure) from the alert's source grouping identifier, adds
    the new finding metadata to the collection, and sorts the list based on state
    and severity.

    5. **Commit Changes**: The updated finding state is serialized to JSON and saved
    back to the `SCC-FINDINGS-STATE` case context property.


    ### Additional Notes

    This action is typically used as a building block in playbooks to ensure that
    finding metadata is consistently available for downstream reporting and synchronization
    logic.
