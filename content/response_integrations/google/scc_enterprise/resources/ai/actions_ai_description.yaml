"Create SCC Enterprise Cloud Posture Ticket Type Jira":
  ai_description: >-
    ### General Description

    This action bootstraps the Jira environment required for the SCC Enterprise integration.
    It ensures that a dedicated project, a specific issue type, and all necessary
    custom fields and screens are correctly configured in the target Jira instance.
    This setup is a prerequisite for the 'Sync SCC-Jira Tickets' job and 'Posture
    Findings with Jira' playbook.


    ### Flow Description

    1. Initializes the Jira client using the provided credentials and API root.

    2. Makes an API call to check if the 'SCC Enterprise Project' exists. If not,
    it makes API calls to create the project along with a default workflow and status
    mapping.

    3. Makes an API call to verify the existence of the 'SCC Enterprise Cloud Posture
    Ticket' issue type within the project. If missing, it makes API calls to create
    and assign this custom issue type.

    4. Iterates through a predefined list of custom fields and makes API calls to
    ensure they are created and correctly associated with the project and issue type.

    5. Makes API calls to set up custom screens and screen schemes to ensure the Jira
    UI correctly displays the relevant SCC fields for the new issue type.

    6. Makes an API call to create a 'Posture Test Ticket' in the newly configured
    project to verify that the entire setup is functional. The details of this test
    ticket are returned as the action's output.


    ### Additional Notes

    None.
  ai_short_description: >-
    Bootstraps the Jira environment for the SCC Enterprise integration by creating
