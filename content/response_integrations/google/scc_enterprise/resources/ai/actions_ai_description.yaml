Lock Playbook:
  ai_description: >-
    ### General Description

    Enforces sequential playbook execution for Google Security Command Center (SCC)
    Posture cases. This action acts as a software mutex (lock), ensuring that only
    one playbook instance processes a case at any given time. It utilizes a 'Smart
    Lock' mechanism stored within the case context to track which alert currently
    holds execution priority. If another alert's playbook is already running, this
    action will pause and wait (entering an IN_PROGRESS state) until the lock becomes
    available.


    ### Flow Description

    1. **Check Lock Status**: Retrieve the `SCC-SMART-LOCK` property from the case
    context.

    2. **Initial Acquisition**: If no lock exists, the current alert acquires the
    lock by writing its identifiers to the case context and the action completes.

    3. **Self-Verification**: If a lock exists and is already held by the current
    alert, the action completes successfully.

    4. **Conflict Resolution**: If the lock is held by a different alert, the action
    checks the status of that alert's workflow instances.

    5. **Wait State**: If the previous alert's playbook is still running, the action
    sets its state to `IN_PROGRESS` to trigger an asynchronous retry.

    6. **Lock Handover**: If the previous alert's playbook has finished, the current
    alert takes over the lock and the action completes.


    ### Additional Notes

    - This action is designed for use in asynchronous environments. It will automatically
    transition to an 'In Progress' state if the lock is held by an active playbook,
    allowing the SOAR engine to retry the action until the lock is released.

    - The lock is stored in the case context property `SCC-SMART-LOCK`.
  ai_short_description: >-
    Enforces sequential playbook execution for Google Security Command Center (SCC)
    Posture cases by acting as a software mutex (lock) stored within the case context.
