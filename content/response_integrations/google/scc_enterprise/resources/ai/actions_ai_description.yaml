    Bootstraps the ServiceNow environment to support SCC Enterprise Cloud Posture
    ticket synchronization. This action is a prerequisite for the 'Sync SCC-ServiceNow
    Tickets' job and associated playbooks. It automates the creation of the necessary
    schema and UI components in ServiceNow to ensure the integration functions correctly.


    ### Flow Description

    1. Validates connection details and extracts configuration parameters from the
    SOAR environment.

    2. Checks for the existence of the specified 'Table Role' in ServiceNow and creates
    it if it is the default value and currently missing.

    3. Creates the custom ServiceNow table `u_scc_enterprise_cloud_posture_ticket`
    and populates it with a predefined set of fields including severity, status, cloud
    environment, and finding details.

    4. Sets up business rules in ServiceNow, such as logic to automatically set the
    'Closed' timestamp when a ticket status changes to Resolved.

    5. Creates a ServiceNow Application Menu and Module to allow users to navigate
    to the new table within the ServiceNow user interface.

    6. Configures the default Form and List views for the new table to ensure data
    is displayed in a structured and readable format.

    7. Inserts a dummy test ticket into the newly created table to confirm the entire
    setup is functional and returns the result as JSON.
