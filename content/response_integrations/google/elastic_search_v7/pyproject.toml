[project]
name = "elastic_search_v7"
version = "23.0"
description = "Search engine based on Lucene. It provides a distributed, multitenant-capable full-text search engine."
requires-python = ">=3.11,<3.12"
dependencies = [
    "elasticsearch==7.17.12",
    "elasticsearch-dsl==7.4.1",
    "environmentcommon",
    "tipcommon",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-json-report>=1.5.0",
    "soar-sdk",
    "requests>=2.32.4",
]

[tool.uv]
index = [
    { url = "https://pypi.org/simple", default = true },
]

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.1-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.0.11-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint]
ignore = [
    "ALL",
]
