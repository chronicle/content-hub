Advanced ES Search:
  ai_description: >-
    ### General Description

    The **Advanced ES Search** action executes a time-bounded search query against
    an Elasticsearch cluster using Lucene syntax. It allows users to specify indices,
    search fields, and time ranges to retrieve specific log data or documents. This
    action is ideal for log analysis, forensic investigations, and threat hunting
    within a defined temporal window.


    ### Flow Description

    1. **Initialization**: Establishes a connection to the Elasticsearch server using
    the provided integration credentials and SSL settings.

    2. **Parameter Extraction**: Retrieves search parameters including the index pattern,
    Lucene query, and time-range constraints from the action configuration.

    3. **Query Construction**: Builds a search request using the `elasticsearch-dsl`
    library, incorporating the Lucene query string and specifying the target fields.

    4. **Time Range Application**: If provided, applies a range filter to the specified
    `Timestamp Field` using the `Oldest Date` and `Earliest Date` values.

    5. **Execution**: Executes the search against the Elasticsearch instance via the
    `advanced_es_search` method and retrieves the hits up to the defined `Limit`.

    6. **Data Processing**: Flattens the nested JSON results and formats them into
    a CSV-compatible structure.

    7. **Output**: Adds a Data Table to the case results and provides the raw JSON
    data for downstream playbook tasks.


    ### Additional Notes

    - This action does not operate on specific entities within a case; it performs
    a global search based on the provided parameters.

    - If both **Oldest Date** and **Earliest Date** are left empty, no time-based
    filtering will be applied to the query.
  ai_short_description: >-
    Executes a time-bounded search query against an Elasticsearch cluster using Lucene
    syntax, returning the results as a data table and raw JSON.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by executing a search query against Elasticsearch. It
      does not mutate external data, mutate internal data, update entities, create
      insights, modify alert data, or create case comments.
