  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Index | String | No | Search pattern for a elastic index. In elastic, index
    is like a DatabaseName, and data is stored across various indexes. This param
    defines in what index(es) to search. It can be an exact name ie: "smp_playbooks-2019.06.13"
    or you can use a (*) wildcard to search by a pattern. e: "smp_playbooks-2019.06*"
    or "smp*". |

    | Query | String | No | The search query to perform. It is in Lucene syntax. IE1:
    "*" (this is a wildcard that will return all record) IE1: "level:error" IE2: "level:information"
    IE3: "level:error OR level:warning" |

    | Limit | String | No | Limits the document return count, ie: 10. 0 = No limit
    |

    | Display Field | String | No | Limits the returned fields. Default "*" = Return
    all fields. You can state a single field. ie: "level" |

    | Search Field | String | No | Search field for free text queries (When query
    doesn't specify a field name). Default is "_all", which means all fields are searched.
    It is best to use proper lucene syntanx on "_all" fields, or textual search on
    a specific field. |

    | Timestamp Field | String | No | The name of the field to run time-based filtering
    against. Default is @timestamp. If both Earliest Date and Oldest Date are empty,
    no time-based filtering will occur. |

    | Oldest Date | String | No | Start date of the search. Search will return only
    records equal or after this point in time. Input may be in exact UTC or relative
    form (using date-math). |

    | Earliest Date | String | No | End date of the search. Search will return only
    records equal or before this point in time. Input may be in exact UTC or relative
    form (using date-math). |
DSL Search:
  ai_description: >-
    ### General Description

    The **DSL Search** action allows users to execute complex queries against an ElasticSearch
    cluster using the ElasticSearch Domain Specific Language (DSL). It is primarily
    used for threat hunting, log retrieval, or data correlation within a SOAR workflow.
    The action retrieves documents based on the provided query and index pattern.


    ### Flow Description

    1. **Initialization**: The action extracts search parameters (Index, Query, Limit).

    2. **Query Execution**: The action makes an API call to the ElasticSearch server
    to execute the DSL query against the specified index. If the query is `*`, it
    applies a default 24-hour lookback. It handles pagination to ensure the requested
    `Limit` of results is reached.

    3. **Data Processing**: Retrieved documents are parsed and flattened into a simplified
    dictionary format.

    4. **Output Generation**: The action constructs a CSV-formatted data table from
    the results and attaches it to the action results. It also returns the raw JSON
    results for use in subsequent playbook steps.


    ### Additional Notes

    - The action defaults to a 24-hour search window only when the `Query` parameter
    is exactly `*`.
  ai_short_description: >-
    Executes a Domain Specific Language (DSL) query against an ElasticSearch cluster
    to retrieve logs and documents for threat hunting and data correlation.
