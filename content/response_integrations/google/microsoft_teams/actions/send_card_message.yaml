name: Send Card Message
description: 'Send an Adaptive Card to a channel or a chat in Microsoft Teams. Note:
    The card is posted on behalf of the user that authorized the integration. The
    Microsoft Graph API only supports cards with "Action.OpenUrl" actions, cards
    cannot collect input or call back to Google SecOps. Requires the "ChannelMessage.Send"
    permission for channels and "ChatMessage.Send" for chats.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#send_card_message
integration_identifier: MicrosoftTeams
parameters:
-   name: Destination Type
    default_value: Channel
    type: ddl
    optional_values:
    - Channel
    - Chat
    description: Specify where the message is located. If "Channel" is selected, "Team
        Name" and "Channel Name" are required. If "Chat" is selected, "Chat ID" is
        required.
    is_mandatory: false
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the name of the team that contains the channel. Required if
        "Destination Type" is "Channel".
    is_mandatory: false
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify the name of the channel. Required if "Destination Type" is
        "Channel".
    is_mandatory: false
-   name: Chat ID
    default_value: ''
    type: string
    description: Specify the ID of the chat. Required if "Destination Type" is "Chat".
    is_mandatory: false
-   name: Card JSON
    default_value: ''
    type: string
    description: Specify the Adaptive Card as a JSON string. Both a bare Adaptive Card
        and a Bot Framework message that wraps the card in "attachments[].content"
        are supported. Only "Action.OpenUrl" actions are supported by the Microsoft
        Graph API, "Action.Submit", "Action.Execute" and "Action.ShowCard" are rejected.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/send_card_message_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
