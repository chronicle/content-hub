name: Add Users To Channel
description: 'Add users to the private channel in Microsoft Teams. Supported entities:
    Username, Email Address (username that matches email regex). Note: only users
    that are a part of the same team can be added to the channel.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#add_users_to_channel
integration_identifier: MicrosoftTeams
parameters:
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the name of the team in which you want to search for the
        channel.
    is_mandatory: true
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify the name of the channel to which you want to add users.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
