name: Update Case Card
description: 'Refresh a case card that was sent to Microsoft Teams with the current
    state of the case. The message must contain an Adaptive Card, for example one
    sent by the "Send Case Card" action. Note: The message should have been sent by
    the user that authorized the integration. Requires the "ChannelMessage.ReadWrite"
    permission for channels and "Chat.ReadWrite" for chats.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#update_case_card
integration_identifier: MicrosoftTeams
parameters:
-   name: Destination Type
    default_value: Channel
    type: ddl
    optional_values:
    - Channel
    - Chat
    description: Specify where the message is located. If "Channel" is selected, "Team
        Name" and "Channel Name" are required. If "Chat" is selected, "Chat ID" is
        required.
    is_mandatory: false
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the name of the team that contains the channel. Required if
        "Destination Type" is "Channel".
    is_mandatory: false
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify the name of the channel. Required if "Destination Type" is
        "Channel".
    is_mandatory: false
-   name: Chat ID
    default_value: ''
    type: string
    description: Specify the ID of the chat. Required if "Destination Type" is "Chat".
    is_mandatory: false
-   name: Message ID
    default_value: ''
    type: string
    description: Specify the ID of the message whose card you want to refresh.
    is_mandatory: true
-   name: Case ID
    default_value: ''
    type: string
    description: Specify the ID of the case to summarize. If nothing is provided, the
        case the action runs in is used.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_case_card_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
