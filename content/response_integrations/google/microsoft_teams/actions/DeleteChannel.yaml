name: Delete Channel
description: Delete a channel in Microsoft Teams.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#delete_channel
integration_identifier: MicrosoftTeams
parameters:
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the name of the team in which you need to delete the channel.
    is_mandatory: true
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify a name of the channel that needs to be deleted.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
