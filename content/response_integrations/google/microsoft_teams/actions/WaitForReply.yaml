name: Wait For Reply
description: 'Action waits for the reply to a specified message. Note: You need to
    be a part of the desired team and channel. Note: Action is running as async, please
    adjust script timeout value in Chronicle SOAR IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#wait_for_reply
integration_identifier: MicrosoftTeams
parameters:
-   name: Team Name
    default_value: ''
    type: string
    description: Specify name of the team.
    is_mandatory: true
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify name of the channel.
    is_mandatory: true
-   name: Message ID
    default_value: ''
    type: string
    description: Specify ID of the message that is expected to have a reply.
    is_mandatory: true
-   name: Expected Reply
    default_value: ''
    type: string
    description: Specify text of the expected reply. If this value is not provided,
        then action will stop execution on any reply.
    is_mandatory: false
-   name: Wait Method
    default_value: Check First Reply
    type: ddl
    optional_values:
    - Check First Reply
    - Wait Till Timeout
    description: Specify the wait method for the action. If "Check First Reply" is
        selected, action will either return the first reply or compare the first reply
        with expected value. If "Wait Till Timeout" is selected, action will either
        wait for the expected value until timeout is reached or return all of the
        messages that were sent during the timeout period.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/wait_for_reply_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
