name: Send User Message
description: 'Send a chat message to the user in Microsoft Teams. Supported entities:
    Username, Email Address (username that matches email regex). Note: Action is running
    as async if “Wait For Reply” is enabled, please adjust script timeout value in
    Siemplify IDE for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#send_user_message
integration_identifier: MicrosoftTeams
parameters:
-   name: User Identifiers
    default_value: ''
    type: string
    description: Specify a comma-separated list of user identifiers to whom you want
        to send a message.
    is_mandatory: false
-   name: Text
    default_value: ''
    type: string
    description: Specify the content of the message.
    is_mandatory: true
-   name: Wait For Reply
    default_value: true
    type: boolean
    description: If enabled, action will wait until replies from all entities are
        available.
    is_mandatory: false
-   name: Content Type
    default_value: Text
    type: ddl
    optional_values:
    - Text
    - HTML
    description: Specify the content type for the message.
    is_mandatory: false
-   name: User Selection
    default_value: From Entities & User Identifiers
    type: ddl
    optional_values:
    - From Entities & User Identifiers
    - From Entities
    - From User Identifiers
    description: Specify what selection should be used for users. If "From Entities
        & User Identifiers" is selected, then action will search in both relevant
        entities and values provided in the "User Identifiers" parameters. If "From
        Entities" is provided, action will only work with relevant entities and ignore
        values provided in the "User Identifiers". If "From User Identifiers" is selected,
        then action will only work with values from "User Identifiers" and "User Identifiers"
        parameter becomes mandatory.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/send_user_message_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
