name: Send Case Card
description: 'Send an Adaptive Card that summarizes a Google SecOps case to a channel
    or a chat in Microsoft Teams. The card shows the case title, priority, stage, status,
    environment, alerts, tags and recent activity. Note: The
    card is posted on behalf of the user that authorized the integration. Requires
    the "ChannelMessage.Send" permission for channels and "ChatMessage.Send" for chats.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#send_case_card
integration_identifier: MicrosoftTeams
parameters:
-   name: Destination Type
    default_value: Channel
    type: ddl
    optional_values:
    - Channel
    - Chat
    description: Specify where the message is located. If "Channel" is selected, "Team
        Name" and "Channel Name" are required. If "Chat" is selected, "Chat ID" is
        required.
    is_mandatory: false
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the name of the team that contains the channel. Required if
        "Destination Type" is "Channel".
    is_mandatory: false
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify the name of the channel. Required if "Destination Type" is
        "Channel".
    is_mandatory: false
-   name: Chat ID
    default_value: ''
    type: string
    description: Specify the ID of the chat. Required if "Destination Type" is "Chat".
    is_mandatory: false
-   name: Case ID
    default_value: ''
    type: string
    description: Specify the ID of the case to summarize. If nothing is provided, the
        case the action runs in is used.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/send_case_card_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
