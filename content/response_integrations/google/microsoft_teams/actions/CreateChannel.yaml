name: Create Channel
description: Create a channel in Microsoft Teams.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#create_channel
integration_identifier: MicrosoftTeams
parameters:
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the name of the team in which you need to create the channel.
    is_mandatory: true
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify a unique name of the channel.
    is_mandatory: true
-   name: Channel Type
    default_value: Standard
    type: ddl
    optional_values:
    - Standard
    - Private
    description: Specify the type of the channel that needs to be created. Standard
        channel is accessible to all members of the team, while private channel will
        require users to be added to it.
    is_mandatory: true
-   name: Description
    default_value: ''
    type: string
    description: Specify a description for the channel.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_channel_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
