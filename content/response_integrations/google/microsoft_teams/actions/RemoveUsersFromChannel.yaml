name: Remove Users From Channel
description: 'Remove users from the private channel in Microsoft Teams. Supported
    entities: Username, Email Address (username that matches email regex).'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#remove_users_from_channel
integration_identifier: MicrosoftTeams
parameters:
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the name of the team in which you want to search for the
        channel.
    is_mandatory: true
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify a name of the channel in which you want to remove users.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
