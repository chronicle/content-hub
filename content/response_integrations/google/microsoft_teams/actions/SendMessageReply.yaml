name: Send Message Reply
description: Send a reply to the channel message in Microsoft Teams.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-teams#send_message_reply
integration_identifier: MicrosoftTeams
parameters:
-   name: Team Name
    default_value: ''
    type: string
    description: Specify the team to which you want to send the reply.
    is_mandatory: true
-   name: Channel Name
    default_value: ''
    type: string
    description: Specify the channel to which you want to send the reply.
    is_mandatory: true
-   name: Message ID
    default_value: ''
    type: string
    description: Specify the ID of the message to which you want to send the reply.
    is_mandatory: true
-   name: Content Type
    default_value: Text
    type: ddl
    optional_values:
    - Text
    - HTML
    description: Specify the content type for the message.
    is_mandatory: false
-   name: Text
    default_value: ''
    type: string
    description: Specify the content of the message.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/send_message_reply_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
