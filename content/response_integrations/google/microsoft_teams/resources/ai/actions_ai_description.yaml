Create Chat:
  ai_description: >-
    ### General Description

    Creates a one-on-one chat conversation in Microsoft Teams between the authenticated
    service account and specified User entities. This action is useful for initiating
    direct communication with users during an incident response process, such as for
    verification or notification purposes.


    ### Flow Description

    1. Initializes the Microsoft Teams Manager and authenticates using the provided
    integration credentials.

    2. Retrieves a list of users from the Microsoft Teams tenant matching the target
    entities' identifiers.

    3. Identifies the unique ID of the authenticated service account.

    4. Iterates over the target User entities.

    5. For each entity, checks if a matching user was found in the tenant.

    6. If a match is found, sends a POST request to the Microsoft Graph API to create
    a new one-on-one chat.

    7. Aggregates the chat details and returns them as JSON results.


    ### Additional Notes

    Requires Microsoft Teams integration to be configured with appropriate permissions.
    Matches entities against display names and email addresses.
