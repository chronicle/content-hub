    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action locally constructs an OAuth 2.0 authorization URL using string manipulation.
      It does not make any HTTP requests to fetch data, does not mutate external data,
      and does not mutate internal case data (such as updating entities or creating
      insights). It only adds a link to the action's result.
  entity_usage:
