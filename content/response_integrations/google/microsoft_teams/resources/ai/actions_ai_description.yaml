    ### General Description

    Removes users from a specific private channel within a Microsoft Team. This action
    manages channel membership by identifying users based on their display names or
    email addresses and removing them from the target private channel.


    ### Flow Description

    1. Connects to the Microsoft Graph API using the provided integration credentials.

    2. Retrieves the unique ID for the specified Team Name.

    3. Fetches the details for the specified Channel Name and verifies that the channel's
    membership type is 'private'. If it is not, the action terminates with an error.

    4. Fetches the current list of members in the channel to create a mapping of display
    names and emails to internal Microsoft User IDs.

    5. Iterates through the provided User entities. If a user is found in the channel's
    member list, the action sends a DELETE request to the Microsoft Graph API to remove
    that user.

    6. Aggregates the results and provides a summary of users successfully removed,
    users not found in the channel, and any users that failed to be removed due to
    API errors.


    ### Additional Notes

    - **Private Channels Only**: This action explicitly checks if the channel's membership
    type is 'private'. It will fail if the specified channel is a standard (public)
    channel.

