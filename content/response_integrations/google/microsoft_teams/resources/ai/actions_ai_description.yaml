Generate Token:
  ai_description: >-
    ### General Description

    The 'Generate Token' action is a utility task for the Microsoft Teams integration
    designed to complete the OAuth 2.0 authorization flow. It extracts an authorization
    code from a provided URL and exchanges it for a long-lived refresh token. This
    refresh token is then used by the integration to maintain persistent access to
    the Microsoft Graph API.


    ### Flow Description

    1. Retrieves the user-provided `Authorization URL` parameter.

    2. Parses the URL to locate and extract the `code` query parameter.

    3. Performs a POST request to the Microsoft identity platform's token endpoint
    using the extracted code and the `authorization_code` grant type.

    4. Extracts the `refresh_token` from the successful API response.

    5. Returns the refresh token in the output message, instructing the user to copy
    it into the integration settings.


    ### Additional Notes

    * This action does not run on entities.

    * The generated refresh token is typically valid for 90 days.

    * This is a setup/configuration action rather than a security investigation or
    response action.
  ai_short_description: >-
    The 'Generate Token' action is a utility task designed to complete the OAuth 2.0
    authorization flow by extracting an authorization code from a provided URL and
