      The action makes a GET request to the MobileIron API to fetch device information
      (fetches_data=true). It does not perform any POST/PUT/DELETE requests to mutate
      external data. Internally, it adds an entity table to the action results but
      does not update the entities themselves, create insights, modify alerts, or
