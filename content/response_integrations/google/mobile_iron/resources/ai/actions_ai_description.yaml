Unlock Device:
  ai_description: >-
    ### General Description

    Unlocks a mobile device managed by MobileIron using its associated IP address.
    This action interacts with the MobileIron API to find the device UUID corresponding
    to the IP address and then issues an unlock command to the device.


    ### Flow Description

    1. Iterates through the target entities, specifically filtering for IP Address
    entities.

    2. For each IP address, makes a GET request to the MobileIron API (`api/v2/devices`)
    to fetch the device information and extract its UUID.

    3. Makes a POST request to the MobileIron API (`api/v2/devices/action`) to execute
    the `UNLOCK_DEVICE_ONLY` action on the retrieved device UUID.

    4. Returns a summary message indicating which devices were successfully unlocked
    and lists any errors encountered.


    ### Additional Notes

    The action relies on the IP address being currently associated with the device
    in MobileIron to successfully resolve the device UUID.
