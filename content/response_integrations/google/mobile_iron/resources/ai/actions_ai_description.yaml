Fetch System Information:
  ai_description: >-
    ### General Description

    Fetches system information for device entities based on their IP addresses using
    the MobileIron integration. This action retrieves contextual metadata about the
    device, such as OS version, owner, and compliance status, and attaches it to the
    action results.


    ### Flow Description

    1. The action iterates over all target entities provided to the script, filtering
    specifically for entities of type `ADDRESS`.

    2. For each valid IP address entity, it makes a GET request to the MobileIron
    API (`api/v2/devices`) to query for devices matching the IP address.

    3. If device information is successfully retrieved, the action formats the data
    and attaches it as an entity table to the specific entity within the SecOps platform.

    4. The action completes by returning a summary message indicating which entities
    were successfully queried and any errors encountered.


    ### Additional Notes

    Users can specify exactly which fields to retrieve from MobileIron by providing
    a comma-separated list in the 'Fields To Fetch' parameter. If left blank, a default
    set of fields will be fetched.
  ai_short_description: >-
    Fetches system information for device entities based on their IP addresses using
    MobileIron, returning contextual metadata such as OS version and owner.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
