Add IP To IP Address Range:
  ai_description: >-
    ### General Description

    Adds IP address entities to a specified IP address range in Microsoft Cloud App
    Security.


    ### Flow Description

    1. Retrieves the list of IP address ranges from Microsoft Cloud App Security.

    2. Finds the specified IP address range by its name.

    3. Iterates through the target entities of type IP Address.

    4. Checks if the entity's IP address is already present in the IP address range.

    5. If not present, makes an API call to update the IP address range in Microsoft
    Cloud App Security, adding the new IP address to the subnets list.

    6. Returns the updated IP address range data as a JSON result.


    ### Additional Notes

    The action uses the entity's original identifier if available, otherwise it falls
    back to the entity identifier.
  ai_short_description: >-
    Adds IP address entities to a specified IP address range in Microsoft Cloud App
    Security.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates an IP address range in Microsoft Cloud App Security to include the target
      IP addresses.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches the existing IP address ranges to find the target range by
      name (fetches_data=true). It then mutates external data by updating the IP address
      range in Microsoft Cloud App Security to include the new IP addresses (can_mutate_external_data=true).
      It does not mutate internal data, update entities, create insights, modify alert
      data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
