Remove IP From IP Address Range:
  ai_description: >-
    ### General Description

    Removes specific IP address entities from a designated IP address range in Microsoft
    Cloud App Security. This action modifies the configuration of an existing IP address
    range by removing the exact IP addresses provided as entities.


    ### Flow Description

    1. Retrieves the specified IP address range by name from Microsoft Cloud App Security.

    2. Iterates through the target IP address entities.

    3. Checks if the entity's IP address exists within the subnets of the retrieved
    IP address range.

    4. Removes the IP address from the range's subnets if it exists and is not the
    last IP in the range.

    5. Updates the IP address range in Microsoft Cloud App Security with the modified
    subnets list via an API request.

    6. Returns a JSON result containing the updated IP address range details.


    ### Additional Notes

    The action requires an exact match to remove an IP address (e.g., it cannot remove
    `192.168.1.30` if the range contains `192.168.1.1/24`). It will not remove an
    IP if it is the last remaining IP in the address range, as Microsoft Cloud App
    Security requires at least one IP in a range.
