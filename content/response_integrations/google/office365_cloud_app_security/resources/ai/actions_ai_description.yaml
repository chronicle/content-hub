Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches User entities using information from Microsoft Cloud App Security. This
    action retrieves contextual metadata for users to provide better visibility into
    their cloud app activities and attributes.


    ### Flow Description

    1. Iterates through the target entities provided to the action.

    2. Filters the entities to process only those of type User.

    3. For each valid User entity, makes a GET request to the Microsoft Cloud App
    Security API (`/api/v1/entities/`) to fetch entity details.

    4. Enriches the entity's additional properties with the retrieved data and sets
    the `is_enriched` flag to true.

    5. Generates a data table containing the entity's information and attaches it
    to the action results.

    6. Updates the enriched entities within the Google SecOps platform.

    7. Returns a JSON object containing the raw data of all successfully processed
    entities.


    ### Additional Notes

    - This action only supports User entities. Other entity types will be skipped.
