    types of the entity from all records as tags to the case. Example: apt |

    | Create Insight | Boolean | No | If enabled, action will add an insight per processed
    entity. |

    | Only Suspicious Entity Insight | Boolean | No | If enabled, action will create
    insight only for entities that exceeded the "Severity Threshold" and "Confidence
    Threshold". |
Get Related Associations:
  ai_description: >-
    ### General Description

    Retrieves entity related associations from Siemplify ThreatFuse. This action fetches
    details about various association types (such as Campaigns, Threat Bulletins,
    Actors, Attack Patterns, Courses Of Action, Identities, Incidents, Infrastructure,
    Intrusion Sets, Malware, Signatures, Tools, TTPs, and Vulnerabilities) related
    to the target entities. It can also optionally create new entities, case tags,
    and insights based on the retrieved associations.


    ### Flow Description

    1. Iterates over the target entities and filters them by supported types (FileHash,
    Address, URL, User) and valid identifiers.

    2. Makes an API call to ThreatFuse (`/api/v2/intelligence/`) to retrieve indicators
    associated with the supported entities.

    3. For each retrieved indicator, makes API calls to ThreatFuse (`/api/v1/{association_type}/associated_with_intelligence/`)
    to fetch related associations based on the selected association types.

    4. Retrieves detailed information for each found association by making specific
    API calls (e.g., `/api/v1/campaign/{campaign_id}/`).

    5. Optionally fetches statistics for the associations if configured.

    6. Creates new entities, case tags, and insights in the SecOps platform based
    on the retrieved data and action parameters.

    7. Adds a data table and JSON result to the action output.


    ### Additional Notes

    This action is asynchronous and processes associations in batches to avoid timeouts.
    It will continue fetching details in subsequent runs until all associations are
    processed.
  ai_short_description: >-
    Retrieves entity related associations from Siemplify ThreatFuse and optionally
    creates entities, case tags, and insights based on the results.
