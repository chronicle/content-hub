Get Related Domains:
  ai_description: >-
    ### General Description

    Retrieves related domains for specific entities (Hash, URL, IP Address, User,
    Threat Actor, CVE) based on associations in Siemplify ThreatFuse.


    ### Flow Description

    1. Iterates through target entities and filters them by supported types (Hash,
    URL, IP Address, User, Threat Actor, CVE) and ensures the identifier does not
    contain spaces.

    2. Separates entities into standard observables and actors/vulnerabilities.

    3. For standard observables, queries ThreatFuse via `manager.get_indicators` to
    get indicators, then fetches related associations based on the selected search
    parameters (e.g., Threat Bulletins, Actors, Campaigns) using `manager.get_related_indicator_associations`.

    4. For actors and vulnerabilities, queries ThreatFuse directly for related associations
    by name using `manager.get_related_associations_by_name`.

    5. For each found association, retrieves the associated domain indicators up to
    the specified maximum limit using `manager.get_association_type_indicators`.

    6. Aggregates the retrieved domains and adds them to the action's JSON result.


    ### Additional Notes

    The action relies on the Siemplify ThreatFuse integration configuration for API
    access and does not update the entities or create insights directly.
