    Date, and others.

    2. Iterates over the target entities and filters for supported types (FILEHASH,
    ADDRESS, URL, USER).

    3. Submits each valid entity as an observable to ThreatFuse via a POST request
    to the `/api/v1/intelligence/import/` endpoint.

