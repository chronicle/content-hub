    ### General Description

    Retrieves related hashes for specific entities based on associations in Siemplify
    ThreatFuse. The action supports File Hash, URL, IP Address, User (matching email
    regex), Threat Actor, and CVE entities. It queries ThreatFuse for various association
    types (e.g., Threat Bulletins, Actors, Campaigns, Malware) and returns the associated
    MD5 hashes as a JSON result.


