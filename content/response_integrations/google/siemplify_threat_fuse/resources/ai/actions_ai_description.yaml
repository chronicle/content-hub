Enrich Entities:
  ai_description: >-
    ### General Description

    Retrieves information about IPs, URLs, hashes, or User entities (with Email regexes)
    from Siemplify ThreatFuse. The action enriches entities with the latest threat
    intelligence records, evaluates severity and confidence thresholds to mark entities
    as suspicious, and can optionally add threat types as tags to the case and create
    insights.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Filters target entities to supported types (FileHash, Address, URL, User) and
    excludes those with spaces in their identifiers.

    3. Fetches indicators for the supported entities from the ThreatFuse API (`manager.get_indicators`).

    4. Matches retrieved indicators to the corresponding entities.

    5. Enriches entities with indicator data (adds to `additional_properties`, sets
    `is_enriched = True`, and adds an entity table).

    6. Evaluates the `Severity Threshold` and `Confidence Threshold`. If thresholds
    are met (and not ignored as a false positive), marks the entity as suspicious
    (`is_suspicious = True`).

    7. Fetches analysis links for the entity (`manager.get_analysis_links`) and adds
    them as a data table.

    8. Optionally adds threat types as case tags (`siemplify.add_tag`).

    9. Optionally creates insights for the entities (`siemplify.create_case_insight`),
    fetching additional intel details (`manager.get_intel_details`) for IPs and URLs.

    10. Updates the enriched entities in the platform (`siemplify.update_entities`).

    11. Returns a JSON result with the indicator data.


    ### Additional Notes

    If multiple records are found for the same entity, the action will enrich using
    the latest record.
  ai_short_description: >-
    Retrieves threat intelligence for IPs, URLs, hashes, and User entities from Siemplify
    ThreatFuse, enriches the entities, and evaluates thresholds to mark them as suspicious.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entities with enrichment data, adds case tags, and creates case insights.
    reasoning: >-
      The action fetches data from the ThreatFuse API (indicators, analysis links,
      intel details). It does not mutate external data. It mutates internal data by
      updating entities, adding tags to the case, and creating insights.
  entity_usage:
