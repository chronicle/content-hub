Add IOC Feed:
  ai_description: >-
    ### General Description

    Adds a new custom IOC feed to FireEye CM based on the provided Address, URL, and
    File Hash entities. This action allows analysts to quickly update FireEye CM with
    new indicators of compromise, configuring them to either trigger alerts or block
    traffic.


    ### Flow Description

    1. Iterates over the target entities and filters for Address, URL, and File Hash
    entity types.

    2. If the entity is a URL and the 'Extract Domain' parameter is enabled, extracts
    the domain portion from the URL.

    3. Creates a temporary file containing the entity identifier.

    4. Makes a POST request to the FireEye CM API (`wsapis/v2.0.0/customioc/feed/add`)
    to upload the file and create the custom IOC feed with the specified action (Alert
    or Block).

    5. Returns a JSON result containing the names of the newly created IOC feeds.


    ### Additional Notes

    Only MD5 and SHA256 hashes are supported for File Hash entities. If an unsupported
    hash type is provided, the action will fail for that specific entity.
  ai_short_description: >-
    Adds a new custom IOC feed to FireEye CM based on Address, URL, and File Hash
    entities, configuring the system to either alert on or block the indicators.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a new custom IOC feed to FireEye CM.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to FireEye CM to add a new custom IOC feed,
      which mutates external data. It does not fetch contextual data, update internal
      entities, create insights, modify alert data, or create case comments.
