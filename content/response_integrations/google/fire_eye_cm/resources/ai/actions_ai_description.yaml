Add Rule To Custom Rules File:
  ai_description: >-
    ### General Description

    Adds a new rule to a custom rules file in FireEye CM. Note that the custom rules
    file must already exist on the target sensor for this action to succeed.


    ### Flow Description

    1. Initializes the FireEye CM manager with the provided API credentials.

    2. Extracts the `Rule` and `Sensor Name` parameters.

    3. If `Sensor Name` is not provided, the action attempts to auto-discover a suitable
    FireEye NX appliance.

    4. Creates a temporary custom Snort rules file locally and writes the new rule
    to it.

    5. Downloads the existing custom Snort rules file from the specified sensor via
    the FireEye CM API.

    6. Appends the downloaded existing rules to the temporary file containing the
    new rule.

    7. Uploads the updated custom rules file back to the sensor via the FireEye CM
    API.

    8. Cleans up the temporary files created during the process.


    ### Additional Notes

    The custom rules file should exist already on the target sensor.
