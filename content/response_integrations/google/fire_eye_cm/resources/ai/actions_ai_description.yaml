Download Alert Artifacts:
  ai_description: >-
    ### General Description

    Downloads alert artifacts from FireEye CM and saves them to a specified local
    folder. This action retrieves forensic files or evidence associated with a specific
    alert in FireEye CM and stores them locally for further analysis.


    ### Flow Description

    1. Initializes the FireEye CM manager with the provided integration credentials.

    2. Validates the provided local download folder path and checks if a file already
    exists (handling the overwrite flag).

    3. Makes an HTTP GET request to the FireEye CM API (`wsapis/v2.0.0/artifacts/{alert_uuid}`)
    to download the artifacts zip file for the specified Alert UUID.

    4. Saves the downloaded zip file to the local folder.

    5. Returns the absolute local file path in the JSON result.


    ### Additional Notes

    The action requires a valid Alert UUID from FireEye CM and a valid local folder
    path with write permissions on the SOAR execution environment.
