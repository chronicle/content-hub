Search:
  ai_description: >-
    ### General Description

    Searches McAfee Active Response using specified collectors and optional filters
    to retrieve telemetry or historical data.


    ### Flow Description

    1. Initializes the connection to the McAfee Active Response DXL broker using the
    provided certificates.

    2. Constructs a search query based on the provided `Collectors` and optional filter
    parameters (`Filter Collector`, `Filter By`, `Filter Operator`, `Filter Value`).

    3. Executes the search query via the MAR client API.

    4. Parses the returned items and attaches the results as a JSON object and a CSV
    data table to the action result.


    ### Additional Notes

    If a filter is used, `Filter Collector`, `Filter By`, `Filter Operator`, and `Filter
    Value` must all be provided together.
  ai_short_description: >-
    Searches McAfee Active Response using specified collectors and optional filters
    to retrieve telemetry data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from McAfee Active Response by executing a search query.
      It does not mutate external data, update internal entities, create insights,
      or modify alert data.
