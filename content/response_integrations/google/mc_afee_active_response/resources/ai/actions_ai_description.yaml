Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the McAfee Active Response broker to ensure the integration
    is configured correctly.


    ### Flow Description

    1. Retrieves the integration configuration parameters (Broker URLs, CA Bundle,
    Certificate, and Private Key).

    2. Initializes the McAfee Active Response manager, which attempts to establish
    a connection to the DXL fabric.

    3. Returns a success message if the connection is successfully established.


    ### Additional Notes

    This is a standard ping action used primarily for verifying integration settings
    and network connectivity.
  ai_short_description: >-
    Tests connectivity to the McAfee Active Response broker to ensure the integration
    is configured correctly.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
