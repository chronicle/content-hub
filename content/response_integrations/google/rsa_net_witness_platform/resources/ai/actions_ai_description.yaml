Add Note to Incident:
  ai_description: >-
    ### General Description

    Adds a note to a specific incident in RSA Netwitness.


    ### Flow Description

    1. Extracts the `Incident ID`, `Note`, and `Author` from the action parameters.

    2. Initializes the RSA Netwitness API client with the provided credentials.

    3. Makes a POST request to the RSA Netwitness API (`incidents/{incident_id}/journal`)
    to append the note to the specified incident.

    4. Returns a success message if the note is added successfully, or an error message
    if the operation fails.


    ### Additional Notes

    Requires an RSA Netwitness Respond license and configured Web Username and Web
    Password in the integration configuration.
  ai_short_description: >-
    Adds a note to a specific incident in RSA Netwitness.
  capabilities:
    can_create_case_comments: false
