Isolate Endpoint:
  ai_description: >-
    ### General Description

    Requests endpoint isolation in RSA Netwitness for specified IP Address and Hostname
    entities. This action initiates a state change on the external device to prevent
    network traffic to or from the specified endpoint.


    ### Flow Description

    1. Retrieves the required service ID from RSA Netwitness.

    2. Iterates through the target entities, filtering for IP Addresses and Hostnames.

    3. Searches for each endpoint in RSA Netwitness using the entity identifier to
    retrieve its agent ID via a GET request.

    4. Initiates an isolation request for the endpoint using the retrieved agent ID
    and the provided comment via a POST request.

    5. Returns a summary of successfully isolated and failed endpoints.


    ### Additional Notes

    Requires RSA Netwitness Respond license, endpoint server service running in the
    background, and configured Web Username and Web Password in the integration configuration.
