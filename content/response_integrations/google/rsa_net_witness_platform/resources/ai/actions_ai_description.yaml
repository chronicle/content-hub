Unisolate Endpoint:
  ai_description: >-
    ### General Description

    Requests unisolation of an endpoint (IP address or hostname) in RSA Netwitness.
    This action removes network isolation restrictions previously placed on the endpoint,
    restoring its normal communication capabilities.


    ### Flow Description

    1. Retrieves the required endpoint server service ID from RSA Netwitness.

    2. Iterates through the target entities, specifically filtering for Address and
    Hostname entity types.

    3. For each entity, searches RSA Netwitness to retrieve the corresponding endpoint's
    `agent_id`.

    4. Makes a DELETE request to the RSA Netwitness API (`host/{agent_id}/isolation`)
    to unisolate the endpoint, passing the provided comment.

    5. Collects the results and outputs a summary message detailing which endpoints
    were successfully unisolated and which failed.


    ### Additional Notes

    Requires an RSA Netwitness Respond license, an endpoint server service running
    in the background, and properly configured Web Username and Web Password in the
    integration configuration.
