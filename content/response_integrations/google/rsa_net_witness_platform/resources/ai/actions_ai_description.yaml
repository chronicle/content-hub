Enrich File:
  ai_description: >-
    ### General Description

    Enriches File Name and File Hash entities using RSA NetWitness Platform. This
    action retrieves file information such as reputation status, global risk score,
    machine OS type, size, checksums, entropy, format, file status, and remediation
    action.


    ### Flow Description

    1. Filters target entities to include only File Name and File Hash entities.

    2. Initializes the RSA NetWitness Platform API client.

    3. Retrieves the required service ID for the endpoint server.

    4. Iterates over the filtered entities and queries the RSA NetWitness Platform
    API for file information using either the file name or file hash (MD5 or SHA256).

    5. If file data is found, enriches the entity's additional properties with the
    retrieved data and marks it as enriched.

    6. If the file's global risk score exceeds the configured 'Risk Score Threshold',
    marks the entity as suspicious.

    7. Updates the entities in the platform and attaches the raw JSON results.


    ### Additional Notes

    Only MD5 and SHA256 hashes are supported. Requires RSA NetWitness Respond license
    and endpoint server service running in the background.
