  ai_description: >-
    ### General Description

    Tests connectivity to the RSA NetWitness Platform. This action verifies that the
    integration is configured correctly and can successfully communicate with the
    RSA NetWitness API.


    ### Flow Description

    1. Extracts integration configuration parameters (e.g., API roots, usernames,
    passwords).

    2. Initializes the RSA Manager with the provided credentials.

    3. Sends a GET request to the RSA NetWitness Platform API (`/sdk?msg=query&query=select
    sessionid&size=1`) to verify connectivity.

    4. Returns a success message if the connection is established, or an error if
    it fails.


    ### Additional Notes

    This action does not require any input parameters and does not interact with any
