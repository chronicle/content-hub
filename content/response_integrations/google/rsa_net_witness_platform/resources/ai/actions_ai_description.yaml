Query NetWitness For Events Around Host:
  ai_description: >-
    ### General Description

    Retrieves the latest events and associated PCAP files related to Hostname entities
    from RSA NetWitness. This action queries the RSA NetWitness platform to find network
    sessions where the specified hostname acts as either the source or destination
    domain, returning the event metadata and raw packet captures.


    ### Flow Description

    1. Initializes the RSA NetWitness manager with the provided API credentials (Broker
    or Concentrator).

    2. Iterates over the provided Hostname entities in the case.

    3. For each entity, queries RSA NetWitness for events where the hostname is the
    source or destination domain within the specified timeframe (`Max Hours Backwards`).

    4. If events are found, retrieves the corresponding PCAP file for the identified
    sessions.

    5. Attaches the events as a CSV table and the PCAP file as an entity attachment
    to the case.

    6. Returns the events in a JSON result.


    ### Additional Notes

    Requires configuration of the Broker API or Concentrator API in the integration
    settings.
