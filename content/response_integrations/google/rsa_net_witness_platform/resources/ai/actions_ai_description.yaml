Enrich Endpoint:
  ai_description: >-
    ### General Description

    Enriches IP Address and Hostname entities by fetching endpoint system information
    from RSA NetWitness Platform.


    ### Flow Description

    1. Initializes the RSA NetWitness API client.

    2. Retrieves the required endpoint server service ID via an API call.

    3. Iterates through the target IP Address and Hostname entities.

    4. Makes an API call to search for the IP or Hostname in RSA NetWitness.

    5. If found, extracts the endpoint's system information (e.g., network interfaces,
    risk score, last seen time).

    6. Updates the entity's additional properties with the retrieved data and marks
    it as enriched.

    7. If the endpoint's risk score exceeds the configured 'Risk Score Threshold',
    marks the entity as suspicious.

    8. Saves the updated entities and attaches the raw data as JSON results.


    ### Additional Notes

    Requires RSA Netwitness Respond license and endpoint server service running in
    the background.
