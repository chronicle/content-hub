Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the FireEye EX server using the provided integration configuration
    parameters.


    ### Flow Description

    1. Retrieves integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the FireEye EX Manager, which authenticates and retrieves an API
    token via a POST request to `/auth/login`.

    3. Calls the logout API endpoint via a POST request to `/auth/logout` to invalidate
    the session and verify successful communication.

    4. Returns a success or failure message based on the execution result.


    ### Additional Notes

    This action is used to verify that the integration is configured correctly and
    can communicate with the FireEye EX server.
