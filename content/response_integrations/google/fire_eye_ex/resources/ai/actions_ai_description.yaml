List Quarantined Emails:
  ai_description: >-
    ### General Description

    The "List Quarantined Emails" action retrieves a list of quarantined emails from
    FireEye EX based on specified filtering criteria such as time range, sender, and
    subject.


    ### Flow Description

    1. The action initializes the FireEye EX API client using the provided integration
    configuration.

    2. It extracts the action parameters: Start Time, End Time, Sender Filter, Subject
    Filter, and Max Email to Return.

    3. A GET request is made to the FireEye EX API (`/emailmgmt/quarantine`) to fetch
    the quarantined emails matching the provided filters.

    4. The retrieved emails are parsed and formatted into a CSV table and JSON results.

    5. The action returns the results to the Google SecOps platform.


    ### Additional Notes

    - If Start Time and End Time are not specified, the action defaults to returning
    quarantined emails from the last 24 hours.

    - The maximum number of emails that can be returned is limited to 10,000 due to
    FireEye EX limitations.
