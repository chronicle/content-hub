Delete Quarantined Email:
  ai_description: >-
    ### General Description

    Deletes a specific quarantined email from FireEye EX.


    ### Flow Description

    1. Initializes the FireEye EX API client with the provided credentials.

    2. Makes a POST request to the FireEye EX API (`/emailmgmt/quarantine/delete`)
    to delete the quarantined email associated with the provided Queue ID.

    3. Logs out of the FireEye EX session.

    4. Returns a success or failure message based on the API response.


