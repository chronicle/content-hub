    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP GET request to the Tor Project to fetch the list of
      exit nodes, so it fetches data. It does not perform any POST/PUT/DELETE requests
      to mutate external data. It also does not call any Siemplify SDK methods to
      update entities, create insights, or add case comments, meaning it does not
      mutate internal data.
