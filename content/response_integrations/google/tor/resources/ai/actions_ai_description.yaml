Is Exit Node:
  ai_description: >-
    ### General Description

    Checks whether IP address entities are used as Tor exit nodes. This action retrieves
    the current list of Tor exit nodes and compares the target IP addresses against
    it to identify potential anonymized traffic sources.


    ### Flow Description

    1. Iterates over the target entities and filters for IP addresses (`ADDRESS`).

    2. For each IP address, makes an HTTP GET request to `https://check.torproject.org/exit-addresses`
    to fetch the list of today's Tor exit nodes.

    3. Checks if the IP address entity's identifier is present in the fetched list.

    4. Collects all identified exit node IPs and returns them as a JSON result.


    ### Additional Notes

    The action relies on the Tor Project's public exit addresses list. Note that the
    list is fetched individually for each IP address entity processed.
  ai_short_description: >-
    Checks whether IP address entities are used as Tor exit nodes by querying the
    Tor Project's exit addresses list.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
