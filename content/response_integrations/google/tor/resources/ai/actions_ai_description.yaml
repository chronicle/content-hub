Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Tor project's exit nodes list. This action verifies
    that the integration is configured correctly and can successfully reach the external
    service.


    ### Flow Description

    1. Initializes the `TorManager` using the integration configuration (e.g., SSL
    verification settings).

    2. Makes an HTTP GET request to the Tor exit nodes list URL (`https://check.torproject.org/exit-addresses`).

    3. Validates the HTTP response to ensure successful connectivity.

    4. Returns a success message if the connection is established without errors.


    ### Additional Notes

    This is a standard ping action used for diagnostic purposes and does not interact
    with case entities or alerts.
