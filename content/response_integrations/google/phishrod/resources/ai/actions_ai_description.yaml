Mark Incident:
  ai_description: >-
    ### General Description

    Marks a specific incident in Phishrod with a designated status and provides a
    justification comment. This action is used to transition incidents through the
    analysis workflow, such as escalating for secondary analysis or closing them as
    safe or spam.


    ### Flow Description

    1. **Parameter Extraction:** Retrieves the Incident ID, Status, and Comment from
    the action inputs.

    2. **Status Mapping:** Maps the human-readable status (e.g., 'Mark As Safe') to
    the internal API value (e.g., 'safe', 'suspicious', or 'spam').

    3. **API Interaction:** Calls the Phishrod API's `initiate-primary-analysis` endpoint
    using the provided incident ID, mapped status, and comment.

    4. **Response Handling:** Parses the API response to determine if the update was
    successful or if the incident had already been updated previously.

    5. **Result Reporting:** Outputs the execution status and the raw JSON response
    from Phishrod to the action results.


    ### Additional Notes

    This action performs a state change on the external Phishrod system by updating
    the incident's status.
  ai_short_description: >-
    Marks a specific incident in Phishrod with a designated status and provides a
    justification comment to transition incidents through the analysis workflow.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the status of a specific incident in the external Phishrod system and
      adds a justification comment.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an API call to Phishrod to update (mark) an incident's status
      and add a comment. This mutates external data (can_mutate_external_data=true).
      It does not fetch enrichment data, update internal entities, create insights,
      or modify internal SecOps alerts.
