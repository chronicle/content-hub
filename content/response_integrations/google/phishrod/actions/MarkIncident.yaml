name: Mark Incident
description: ''
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/phishrod#mark_incident
integration_identifier: Phishrod
parameters:
-   name: Incident ID
    default_value: ''
    type: string
    description: Specify the ID of the incident that needs to be marked.
    is_mandatory: true
-   name: Status
    default_value: Mark For Secondary Analysis
    type: ddl
    optional_values:
    - Mark For Secondary Analysis
    - Mark As Safe
    - Mark As Spam
    description: Specify how the incidents need to be marked.
    is_mandatory: false
-   name: Comment
    default_value: ''
    type: string
    description: Specify the comment describing the reasons for the incident to be
        marked.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
