Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Harmony Mobile server using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the API Root, Client ID, Client Secret, and Verify SSL settings from
    the integration configuration.

    2. Initializes the Harmony Mobile manager and generates an authentication token.

    3. Makes a GET request to the device status endpoint to verify connectivity.

    4. Returns a successful execution state if the connection is established, otherwise
    returns a failure.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can communicate with the Harmony Mobile API.
  ai_short_description: >-
    Tests connectivity to the Harmony Mobile server to ensure the integration is configured
    correctly.
