Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname entities using device information retrieved from Harmony Mobile.
    This action fetches contextual metadata about devices and updates the corresponding
    entities within the platform.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Filters target entities to include only Hostname entities.

    3. Makes an API call (GET) to Harmony Mobile to fetch a list of devices.

    4. Matches the fetched devices with the target entities based on the device name
    and entity identifier.

    5. Enriches the matched entities with device details (e.g., OS version, risk,
    status) and updates them in the platform.

    6. Optionally creates an insight for each successfully enriched entity.


    ### Additional Notes

    The Hostname entity identifier must exactly match the "name" of the device in
    Harmony Mobile for the enrichment to be successful.
  ai_short_description: >-
    Enriches Hostname entities with device information retrieved from Harmony Mobile.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to Harmony Mobile to fetch device data (fetches_data=true).
      It does not mutate external data (can_mutate_external_data=false) or internal
      data (can_mutate_internal_data=false). It updates the entities with the fetched
      data (can_update_entities=true) and optionally creates insights (can_create_insight=true).
      It does not modify alert data or create case comments.
