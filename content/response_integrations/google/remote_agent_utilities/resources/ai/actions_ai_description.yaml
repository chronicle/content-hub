Serialize A File:
  ai_description: >-
    ### General Description

    Serializes a specified local file into a base64 encoded string. This utility action
    is designed to read a file from the local filesystem where the agent is running
    and output its base64 representation along with the file name.


    ### Flow Description

    1. Validates that the provided file path exists and is accessible.

    2. Checks if the file size is within the allowed limit (5MB).

    3. Reads the binary content of the file.

    4. Encodes the file content into a base64 string.

    5. Returns the base64 string and the file name as a JSON result.


    ### Additional Notes

    - The maximum allowed file size for serialization is 5MB.

    - This action operates locally on the host/agent where it is executed and does
    not make any external API calls.
  ai_short_description: >-
    Reads a local file from the provided path and serializes its content into a base64
    encoded string.
