Deserialize A File:
  ai_description: >-
    ### General Description

    Deserializes a base64 encoded string into a file and saves it to the local disk
    of the Remote Agent.


    ### Flow Description

    1. Extracts the base64 string and target file name from the action parameters.

    2. Verifies if the target directory (`/opt/SiemplifyAgent/Files/`) exists on the
    host system, creating it if necessary.

    3. Decodes the base64 string and writes the binary content to the specified file
    path.

    4. Returns the absolute path of the newly created file as the result value.


    ### Additional Notes

    This action executes locally on the environment where the agent is running and
    does not make external API calls.
  ai_short_description: >-
    Deserializes a base64 encoded string and saves it as a file to the local disk
    of the Remote Agent.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Writes a new file to the local file system of the host running the Remote Agent.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action decodes a base64 string and writes it to the local file system of
      the agent executing the script. It does not fetch data from an API, nor does
      it update internal SecOps data like entities, alerts, or insights. It mutates
      external data by creating a new file on the host OS.
