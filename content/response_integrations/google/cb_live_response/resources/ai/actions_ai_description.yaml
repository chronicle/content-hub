Delete File from Cloud Storage:
  ai_description: >-
    ### General Description

    Deletes a specified file from the VMware Carbon Black Cloud file storage associated
    with an active Live Response session for a given Hostname or IP Address entity.


    ### Flow Description

    1. Extracts the file name to delete from the action parameters. If not provided,
    it extracts the file name from target File Name entities.

    2. Retrieves the corresponding Carbon Black Cloud device ID for each target Hostname
    or IP Address entity.

    3. Initiates a Live Response session for the identified devices.

    4. Polls the session status up to a configured number of times until the session
    becomes active.

    5. Retrieves the list of files currently in the cloud storage for the active session.

    6. Makes a DELETE request to the Carbon Black Cloud API to remove the specified
    file from the cloud storage.

    7. Returns a JSON result containing the execution details and status for each
    processed entity.


    ### Additional Notes

    This action requires Carbon Black Live Response API v6 and will fail if v3 is
    used. If the file name is provided both as an input parameter and as an entity,
    the input parameter takes precedence. The file name matching is case-insensitive.
