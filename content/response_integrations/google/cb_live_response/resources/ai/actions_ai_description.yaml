Create Memdump:
  ai_description: >-
    ### General Description

    Creates a memory dump on a host running the VMware Carbon Black Cloud Agent based
    on Hostname or IP Address entities.


    ### Flow Description

    1. Filters target entities to identify valid Hostname and IP Address entities,
    as well as File Name entities if the file name parameter is not provided.

    2. Queries the VMware Carbon Black Cloud API to retrieve the device ID associated
    with each endpoint.

    3. Initiates a Live Response session for each identified device via the API.

    4. Polls the API to verify the Live Response session is active.

    5. Sends a command via the API to create a memory dump on the remote host at the
    specified directory path.

    6. Polls the API to check the command status and collects the JSON results upon
    completion.


    ### Additional Notes

    The file name for the memdump can be provided as a File Name entity or as an input
    parameter. If both are provided, the input parameter takes precedence.
  ai_short_description: >-
    Creates a memory dump on a remote host running the VMware Carbon Black Cloud Agent
    using Live Response.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a Live Response session and executes a command to create a memory
      dump on the remote host.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action does not fetch contextual data for enrichment. It mutates external
      data by initiating a Live Response session and executing a command to create
      a memory dump on the remote host. It does not mutate internal data, update entities,
      create insights, modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: true
      generic: false
      host_name: true
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: false
