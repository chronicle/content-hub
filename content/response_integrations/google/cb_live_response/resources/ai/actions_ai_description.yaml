Kill Process:
  ai_description: >-
    ### General Description

    Kills a specific process on a host based on the Siemplify Hostname or IP Address
    entity using VMware Carbon Black Cloud Live Response. The process name can be
    provided either as a Siemplify Process entity or as an action input parameter.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Identifies the process name to kill, either from the `Process Name` parameter
