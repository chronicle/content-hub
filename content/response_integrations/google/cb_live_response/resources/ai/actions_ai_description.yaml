Delete File:
  ai_description: >-
    ### General Description

    Deletes a specified file from a remote host running the VMware Carbon Black Cloud
    Agent. The action targets Hostname or IP Address entities to identify the endpoint
    and can accept the file name either as an action parameter or from a File Name
    entity.


    ### Flow Description

    1. Retrieves the target device ID from VMware Carbon Black Cloud using the provided
    Hostname or IP Address entity.

    2. Initiates a Live Response session on the target device.

    3. Checks the session status periodically until it becomes active.

    4. Executes a 'delete file' command via the Live Response session for the specified
    file path.

    5. Monitors the command status until completion and returns the execution results.


    ### Additional Notes

    The file name is case-insensitive and will be appended to the Remote Directory
    Path to form the full path. If the file name is provided as a full path, the Remote
    Directory Path parameter is ignored.
