Download File:
  ai_description: >-
    ### General Description

    Downloads a specified file from a host running VMware Carbon Black Cloud Agent
    based on the provided Hostname or IP Address entities.


    ### Flow Description

    1. Retrieves configuration and action parameters, including the file name, remote
    directory path, and local directory path.

    2. Identifies target Hostname and IP Address entities, as well as File Name entities
    if the file name parameter is not explicitly provided.

    3. Queries the VMware Carbon Black Cloud API to find the corresponding device
    ID for each target entity.

    4. Initiates a Live Response session on the identified devices.

    5. Polls the session status until it becomes active.

    6. If a remote directory path is provided without a specific file name, it executes
    a command to list the directory contents.

    7. Initiates a command to retrieve the specified file from the remote host.

    8. Polls the command status until completion.

    9. Downloads the file content and saves it to the specified local directory path.

    10. Returns the execution results and file details in JSON format.


    ### Additional Notes

    The file name can be provided as an action parameter or as a File entity. If both
    are present, the action parameter takes precedence. If executed against multiple
    entities, the downloaded file name is prefixed with the hostname or IP address
    to prevent overwriting.
