    and Authentication credentials.

    2. Constructs the HTTP POST request, applying basic authentication and custom
    JSON headers if provided.

    3. Formats the payload based on the specified Content Type (e.g., parsing as JSON
    if `application/json` is selected).

    4. Executes the POST request to the target URL.

    5. Captures the response data and any redirect history, returning them as a JSON
    result to the SOAR platform.


