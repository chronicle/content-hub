    | Headers JSON | String | No | JSON object of HTTP headers to be sent with the
    request. |
Get URL Data:
  ai_description: >-
    ### General Description

    Sends an HTTP GET request to URL entities to retrieve their raw response content
    and redirect history. This action is useful for safely inspecting the destination
    and content of a URL without interacting with it via a standard browser.


    ### Flow Description

    1. Iterates through the target entities provided to the action.

    2. Filters the entities to process only those of type `URL`.

    3. Validates the URL schema, automatically prepending `http://` if a schema is
    missing.

    4. Executes an HTTP GET request to the URL using the `requests` library. If provided,
    it applies basic authentication (`Username` and `Password`) and respects the `SSL
    Verification` setting.

    5. Collects the raw response text and the history of any HTTP redirects encountered.

    6. Aggregates the results for all processed URLs and outputs them as a JSON object.


    ### Additional Notes

    This action only retrieves data and does not modify the entities, create insights,
    or alter any external systems.
  ai_short_description: >-
    Sends an HTTP GET request to URL entities to retrieve their raw response content
    and redirect history, optionally using basic authentication.
