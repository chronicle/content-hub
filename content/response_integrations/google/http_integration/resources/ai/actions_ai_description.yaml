Get Data:
  ai_description: >-
    ### General Description

    Sends an HTTP GET request to a specified URL and retrieves the response. This
    action is a generic utility for interacting with REST APIs or fetching web content
    directly from a playbook.


    ### Flow Description

    1. Extracts the target URL, authentication credentials (username/password), SSL
    verification preference, and custom JSON headers from the action parameters.

    2. Constructs the HTTP GET request with the provided attributes.

    3. Executes the GET request using the `requests` library.

    4. Evaluates the HTTP response code, raising an error for 4xx or 5xx status codes
    unless the 'Ignore HTTP Error Codes' parameter is enabled.

    5. Parses the response body as JSON (or plain text if JSON parsing fails) and
    returns the data, response code, and redirect history as a JSON result.


    ### Additional Notes

    This action does not operate on specific entities and relies entirely on the provided
    URL parameter. It is useful for custom API integrations where a dedicated integration
    might not exist.
  ai_short_description: >-
    Sends an HTTP GET request to a specified URL and returns the response data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making an HTTP GET request to an external URL. It
      does not mutate external data (GET is idempotent), nor does it mutate internal
      data, update entities, create insights, modify alerts, or create case comments.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
