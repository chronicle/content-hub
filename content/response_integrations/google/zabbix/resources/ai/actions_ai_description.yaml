    execute_command_on_the_host: true
    get_alert_information: false
    reasoning: >-
      The action executes a predefined script on a remote host via Zabbix and retrieves
      the execution output. This directly aligns with the 'Execute Command on the
      Host' category.
    remove_ioc_from_allowlist: false
