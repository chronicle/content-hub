Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Zabbix instance by attempting to authenticate using
    the provided integration configuration credentials.


    ### Flow Description

    1. Retrieves the Zabbix integration configuration parameters (API Root, Username,
    Password, Verify SSL).

    2. Initializes the `ZabbixManager`, which makes an API call to the Zabbix server
    to establish a session and log in (`zabbix.login`).

    3. If the connection and authentication are successful, the action completes and
    returns a success message.


    ### Additional Notes

    This action is typically used as a diagnostic tool to verify that the integration
    is configured correctly and can successfully communicate with the Zabbix server.
  ai_short_description: >-
    Tests connectivity to the Zabbix instance by attempting to authenticate using
    the provided integration credentials.
  capabilities:
