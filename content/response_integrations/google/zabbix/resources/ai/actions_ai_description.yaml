Execute Script:
  ai_description: >-
    ### General Description

    Executes a specific script on Zabbix hosts associated with the provided IP address
    entities. This action allows analysts to run predefined Zabbix scripts on remote
    hosts directly from the SOAR platform.


    ### Flow Description

    1. Retrieves the script details from Zabbix using the provided script name.

    2. Iterates through the target entities, filtering for IP Address entities.

    3. For each IP address, queries Zabbix to find associated hosts.

    4. Executes the specified script on each identified host via the Zabbix API (`script.execute`).

    5. Collects the execution results and attaches them to the action's JSON results.


    ### Additional Notes

    The action requires the script to be predefined in Zabbix.
  ai_short_description: >-
    Executes a specific script on Zabbix hosts associated with the provided IP address
    entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Executes a script on a remote host via Zabbix, which can change the state of
      the host depending on the script's logic.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches script and host details from Zabbix (fetches_data=true).
      It then executes a script on the remote host via Zabbix, which mutates external
      state (can_mutate_external_data=true). It does not update internal entities,
      create insights, or modify alert data.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: false
      generic: false
      host_name: false
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: false
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The code iterates over `siemplify.target_entities` and explicitly filters for
      entities where `entity.entity_type == EntityTypes.ADDRESS`. Therefore, it targets
      Address entities and filters by the `entity_type` attribute.
  outcome_categories:
