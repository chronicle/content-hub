name: Remove Entry From Allow List
description: Use the "Remove Entry From Allow List" action to remove entry from the
    allow list.
integration_identifier: ProofpointThreatProtection
parameters:
-   name: Cluster ID
    default_value: ''
    type: string
    description: The cluster ID of the allow list. If no value is provided, the action
        uses the cluster ID from the integration configuration.
    is_mandatory: false
-   name: IOC Type To Search
    default_value: All
    type: ddl
    optional_values:
    - All
    - Recipient Email Address
    - Sender Email Address
    - Sender IP Address
    - Sender Hostname
    - Sender HELO Domain Name
    - Message Header From (Address Only)
    description: The types of IOCs to search for. If All is selected, the action removes
        all entries matching the value.
    is_mandatory: false
-   name: Value
    default_value: ''
    type: string
    description: The value to remove from the allow list.
    is_mandatory: true
-   name: Case Insensitive Search
    default_value: 'True'
    type: ddl
    optional_values:
    - 'True'
    - 'False'
    description: If selected, the action performs a case-insensitive search to identify
        and remove all matching entries.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
