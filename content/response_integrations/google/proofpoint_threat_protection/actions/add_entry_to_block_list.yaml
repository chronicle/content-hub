name: Add Entry To Block List
description: Use the "Add Entry To Block List" action to add a new entry to the block
    list.
integration_identifier: ProofpointThreatProtection
parameters:
-   name: Cluster ID
    default_value: ''
    type: string
    description: The cluster ID of the block list. If no value is provided, the action
        uses the cluster ID from the integration configuration.
    is_mandatory: false
-   name: Blocklist Item
    default_value: "{\n    \"action\": \"add\",\n    \"attribute\": \"\",\n    \"\
        operator\": \"\",\n    \"value\": \"\",\n    \"comment\": \"\"\n}"
    type: string
    description: The JSON object representing the block list item to add.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
