name: Get Block List Entries
description: Use the "Get Block List Entries" action to get entries from the block
    list.
integration_identifier: ProofpointThreatProtection
parameters:
-   name: Cluster ID
    default_value: ''
    type: string
    description: The cluster ID of the block list. If no value is provided, the action
        uses the Cluster ID from the integration configuration.
    is_mandatory: false
-   name: IOC Type To Return
    default_value: All
    type: ddl
    optional_values:
    - All
    - Recipient Email Address
    - Sender Email Address
    - Sender IP Address
    - Sender Hostname
    - Sender HELO Domain Name
    - Message Header From (Address Only)
    description: The types of IOCs to return. If All is selected, the action returns
        all entries.
    is_mandatory: false
-   name: Max IOCs To Return
    default_value: '100'
    type: string
    description: 'The number of IOCs to return. Maximum: 1000.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_block_list_entries_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
