name: Add IOC To Block List
description: Use the "Add IOC To Block List" action to add specific IOCs to the Proofpoint
    Threat Protection block list.
integration_identifier: ProofpointThreatProtection
parameters:
-   name: Cluster ID
    default_value: ''
    type: string
    description: The cluster ID of the block list. If no value is provided, the action
        uses the cluster ID from the integration configuration.
    is_mandatory: false
-   name: Recipient Email Address
    default_value: ''
    type: string
    description: A comma-separated list of recipient email addresses to add to the
        block list.
    is_mandatory: false
-   name: Sender Email Address
    default_value: ''
    type: string
    description: A comma-separated list of sender email addresses to add to the block
        list.
    is_mandatory: false
-   name: Sender IP Address
    default_value: ''
    type: string
    description: A comma-separated list of sender IP addresses to add to the block
        list.
    is_mandatory: false
-   name: Sender Hostname
    default_value: ''
    type: string
    description: A comma-separated list of sender hostnames to add to the block list.
    is_mandatory: false
-   name: Sender HELO Domain Name
    default_value: ''
    type: string
    description: A comma-separated list of HELO domain names to add to the block list.
    is_mandatory: false
-   name: Message Header From (Address Only)
    default_value: ''
    type: string
    description: A comma-separated list of "Message Header From" entries to add to
        the block list.
    is_mandatory: false
-   name: Comment
    default_value: ''
    type: string
    description: A description or justification associated with the block list entries.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
