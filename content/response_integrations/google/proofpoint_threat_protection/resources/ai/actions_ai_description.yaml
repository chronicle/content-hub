Remove Entry From Allow List:
  ai_description: >-
    ### General Description

    Removes specific entries from the Proofpoint Threat Protection allow list. This
    action allows administrators to manage the allow list by targeting specific IOC
    types (such as IP addresses, email addresses, or hostnames) and values. It supports
    both case-sensitive and case-insensitive searches to identify and delete matching
    entries within a specified cluster.


    ### Flow Description

    1. Extracts the Cluster ID, IOC Type To Search, Value, and Case Insensitive Search
    parameters.

    2. Resolves the target Cluster ID, defaulting to the integration's global configuration
    if not provided.

    3. Resolves the attributes to remove. If 'Case Insensitive Search' is enabled,
    it maps the IOC type directly to Proofpoint attributes. If disabled, it makes
    an API call to fetch the current allow list and finds an exact case-sensitive
    match.

    4. Iterates through the identified attributes and sends a deletion request (POST
    with 'delete' action) to the Proofpoint API for the specified value.

    5. Sets the action status to success if at least one entry is successfully removed.


    ### Additional Notes

    - If 'Case Insensitive Search' is set to 'False', the action will perform an additional
    API call to fetch the current allow list entries to ensure an exact match exists
    before attempting deletion.
