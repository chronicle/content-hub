Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is a diagnostic tool designed to verify the connectivity between
    Google SecOps and the Proofpoint Threat Protection service. It ensures that the
    provided credentials (Client ID, Client Secret) and configuration parameters (API
    Root, Cluster ID) are valid and that the network path to the Proofpoint API is
    open.


    ### Flow Description

    1. **Initialization**: The action retrieves the integration configuration, including
    the API Root, Client ID, Client Secret, and Cluster ID.

    2. **Authentication**: It initiates an OAuth2 authentication flow by sending a
    POST request to the Proofpoint authentication URL to obtain a bearer token.

    3. **Connectivity Test**: Using the authenticated session, it performs a GET request
    to the `orgSafeList` endpoint (Allow List) for the configured Cluster ID.

    4. **Validation**: The action validates the API response. A successful response
    confirms connectivity, while failures are caught and reported as connection errors.


    ### Additional Notes

    - This action is typically used during the initial setup of the integration or
    for troubleshooting communication issues.

    - It specifically checks for a 403 Forbidden error to provide a more descriptive
    error message regarding invalid Cluster IDs or credentials.
