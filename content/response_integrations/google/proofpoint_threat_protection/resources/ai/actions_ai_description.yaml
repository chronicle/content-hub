Add Entry To Allow List:
  ai_description: >-
    ### General Description

    The **Add Entry To Allow List** action allows users to programmatically add new
    entries to the Proofpoint Threat Protection allow list (Safe List). This action
    is used to ensure that specific senders, IPs, or domains are not incorrectly flagged
    as threats by the Proofpoint email protection modules.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the Cluster ID and the Allowlist
    Item JSON from the input parameters.

    2. **Validation**: It validates that the Allowlist Item is a valid JSON structure
    and checks if email values match the required format for specific attributes.

    3. **Payload Preparation**: It ensures the payload is correctly formatted for
    the Proofpoint API, defaulting the operation to 'add' if not specified.

    4. **API Execution**: It sends a POST request to the Proofpoint Threat Protection
    API endpoint associated with the organizational safe list.

    5. **Error Handling**: The action handles specific API responses, such as duplicate
    entries or invalid credentials/cluster IDs, providing descriptive feedback in
    the SOAR interface.


    ### Additional Notes

    - The action performs validation on email-related attributes to ensure the provided
    value is a valid email format before sending the request to Proofpoint.

    - If the entry already exists in the allow list, the action will complete successfully
    but notify the user that the entry was a duplicate.
  ai_short_description: >-
    Adds a new entry to the Proofpoint Threat Protection allow list (Safe List) to
    prevent specific senders, IPs, or domains from being incorrectly flagged as threats.
