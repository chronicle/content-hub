Get Allow List Entries:
  ai_description: >-
    ### General Description

    Retrieves entries from the Proofpoint Threat Protection allow list. This action
    allows users to fetch and filter specific Indicators of Compromise (IOCs) that
    have been whitelisted within a specific cluster. It is useful for auditing allow
    lists or verifying if specific attributes are already permitted in the environment.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the `Cluster ID`, `IOC Type
    To Return`, and `Max IOCs To Return` from the input parameters.

    2. **Validation**: It validates that the `Max IOCs To Return` value is within
    the allowed range (1 to 1000).

    3. **Cluster Identification**: It determines the target Cluster ID, prioritizing
    the action parameter over the integration configuration.

    4. **Data Retrieval**: It performs a GET request to the Proofpoint API to fetch
    all allow list entries for the identified cluster.

    5. **Filtering**: The retrieved entries are filtered based on the selected `IOC
    Type To Return` and truncated to the `Max IOCs To Return` limit.

    6. **Output**: The filtered list is returned as a JSON result, and a success message
    is generated.


    ### Additional Notes

    - This action does not run on entities; it performs a global lookup for the specified
    cluster.

    - If no entries match the criteria, the action will complete successfully with
    an informative message.
