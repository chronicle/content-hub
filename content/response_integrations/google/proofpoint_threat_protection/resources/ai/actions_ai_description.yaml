Add IOC To Allow List:
  ai_description: >-
    ### General Description

    The **Add IOC To Allow List** action allows security analysts to programmatically
    add various types of Indicators of Compromise (IOCs) to the Proofpoint Threat
    Protection allow list (specifically the `orgSafeList`). This action is useful
    for whitelisting known-good senders, recipients, or infrastructure to prevent
    false positives in email filtering. It supports multiple IOC types including email
    addresses, IP addresses, hostnames, and HELO domains.


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves the Cluster ID, all IOC lists
    (CSV format), and the comment from the input parameters.

    2. **Cluster Identification:** It determines the target Cluster ID, using the
    provided parameter or falling back to the integration's global configuration.

    3. **Payload Preparation:** The action parses the CSV strings into individual
    values and maps them to Proofpoint-specific attributes (e.g., `$rcpt`, `$from`,
    `$ip`).

    4. **Validation:** It validates the syntax of email-based IOCs.

    5. **API Interaction:** For each valid IOC, the action sends a POST request to
    the Proofpoint `orgSafeList` endpoint (`api/v1/emailProtection/modules/spam/orgSafeList`).

    6. **Error Handling:** It identifies duplicate entries (which are ignored) and
    captures any API errors for reporting.

    7. **Final Status:** The action provides a summary of successfully added entries
    or raises an error if specific entries failed to be added.


    ### Additional Notes

    * **Validation:** The action performs basic email format validation for 'Recipient
    Email Address' and 'Message Header From' fields. Invalid formats will result in
    those specific entries being skipped and reported as failures.

    * **Duplicates:** If an entry already exists in the Proofpoint allow list, the
    action will log an information message and skip that entry without failing the
    entire action.

    * **Input Requirement:** At least one IOC parameter must be populated for the
    action to execute successfully.
