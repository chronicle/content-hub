Add IOC To Block List:
  ai_description: >-
    ### General Description

    Adds specific Indicators of Compromise (IOCs) to the Proofpoint Threat Protection
    block list. This action allows security analysts to block various types of identifiers,
    including recipient/sender emails, IP addresses, hostnames, and HELO domains,
    to prevent malicious traffic or emails from reaching the organization. It supports
    bulk processing via comma-separated values and allows for a justification comment
    to be attached to the block entries.


    ### Flow Description

    1. Extracts the Cluster ID and all IOC-related strings from the input parameters.

    2. Determines the target Cluster ID, defaulting to the integration's global setting
    if the parameter is empty.

    3. Parses comma-separated strings into individual values and maps them to their
    respective Proofpoint attribute types (e.g., `$ip`, `$from`, `$rcpt`).

    4. Validates email-based IOCs for correct syntax.

    5. Sends a POST request to the Proofpoint API (`api/v1/emailProtection/modules/spam/orgBlockList`)
    for each valid IOC to add the entry to the organizational block list.

    6. Tracks failed entries and raises an error at the end if any entries failed
    to be added.


    ### Additional Notes

    - At least one IOC parameter must be provided.

    - Performs basic email format validation.

    - Skips duplicate entries without failing the entire process.
