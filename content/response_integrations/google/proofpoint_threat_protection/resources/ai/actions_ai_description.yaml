Add Entry To Block List:
  ai_description: >-
    ### General Description

    The **Add Entry To Block List** action allows users to programmatically add new
    entries to the Proofpoint Threat Protection block list. This action is typically
    used to block malicious senders, IP addresses, or hostnames identified during
    an investigation. It interacts with the Proofpoint Email Protection API to update
    the organizational block list for a specific cluster.


    ### Flow Description

    1. Retrieves the Cluster ID and the Blocklist Item JSON from the action input.

    2. Parses the Blocklist Item JSON and validates that email addresses are correctly
    formatted if the attribute type requires it.

    3. Ensures the payload contains the required `action: "add"` key-value pair.

    4. Sends a POST request to the Proofpoint Threat Protection API (`/api/v1/emailProtection/modules/spam/orgBlockList`)
    for the specified cluster.

    5. Processes API responses, specifically handling duplicate entry errors and invalid
    cluster/credential errors.

    6. Returns a success message upon successful addition of the entry.


    ### Additional Notes

    - The action performs validation on email-related attributes (e.g., `Recipient
    Email Address` or `Message Header From`) to ensure the provided value is a valid
    email format before sending the request to Proofpoint.

    - If the entry already exists in the block list, the action will complete successfully
    with a message indicating the duplicate status rather than failing.
