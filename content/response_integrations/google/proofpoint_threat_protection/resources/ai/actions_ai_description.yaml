Get Block List Entries:
  ai_description: >-
    ### General Description

    Retrieves a list of blocked Indicators of Compromise (IOCs) from the Proofpoint
    Threat Protection block list. This action allows security analysts to audit or
    verify existing block list entries within a specific cluster, providing visibility
    into currently restricted senders, IPs, and hostnames.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the `Cluster ID`, `IOC Type
    To Return`, and `Max IOCs To Return` parameters from the input.

    2. **Validation**: It ensures the `Max IOCs To Return` value falls within the
    allowed range (1-1000).

    3. **API Connection**: Authenticates with Proofpoint and connects to the block
    list endpoint for the target cluster.

    4. **Data Retrieval**: Fetches the raw list of block entries from the external
    system via a GET request to the `api/v1/emailProtection/modules/spam/orgBlockList`
    endpoint.

    5. **Filtering**: If a specific IOC Type was requested, the action filters the
    list to include only matching attributes (e.g., only IP addresses).

    6. **Result Limiting**: Truncates the list to match the `Max IOCs To Return` parameter.

    7. **Output**: Returns the filtered list as a JSON object and provides a summary
    message in the SOAR interface.


    ### Additional Notes

    - This action does not require entities to run; it performs a global lookup against
    the Proofpoint block list.

    - If the provided Cluster ID is invalid, the action will return an error indicating
    a configuration or parameter issue.
