name: Report Message
description: 'Deprecated. Report message in Mimecast. Note: only messages with status
    "Held", "Archived", "Bounced" can be reported.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mimecast#report_message
integration_identifier: Mimecast
parameters:
-   name: Message ID
    default_value: ''
    type: string
    description: Specify the ID of the message that needs to be reported.
    is_mandatory: true
-   name: Comment
    default_value: ''
    type: string
    description: Specify the comment for the report.
    is_mandatory: false
-   name: Report As
    default_value: Spam
    type: ddl
    optional_values:
    - Spam
    - Malware
    - Phishing
    description: Specify the report type for the message.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
