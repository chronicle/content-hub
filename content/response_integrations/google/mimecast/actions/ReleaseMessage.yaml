name: Release Message
description: 'Release message in Mimecast. Note: only messages with status "Held"
    can be released.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mimecast#release_message
integration_identifier: Mimecast
parameters:
-   name: Message ID
    default_value: ''
    type: string
    description: Specify the ID of the message that needs to be released.
    is_mandatory: true
-   name: Release To Sandbox
    default_value: 'false'
    type: boolean
    description: If enabled, action will release the message to the sandbox.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
