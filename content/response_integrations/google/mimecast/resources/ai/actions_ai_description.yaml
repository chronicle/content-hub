    Permits a specific sender for a specific recipient within the Mimecast platform.
    This action modifies the 'Managed Senders' list in Mimecast to ensure that emails
    from the specified sender are allowed through to the designated recipient, bypassing
    certain security filters.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the `Sender` and `Recipient`
    email addresses from the input parameters.

    2. **Manager Initialization**: It initializes the Mimecast Manager using the integration's
    configuration (API keys, secrets, and root URL).

    3. **API Interaction**: The action makes a POST request to the Mimecast API endpoint
    `/api/managedsender/permit-or-block-sender` with the 'permit' action, targeting
    the specific sender-recipient pair.

    4. **Execution Result**: The action returns a success message if the Mimecast
    platform confirms the sender has been permitted, or an error message if the API
    request fails.


