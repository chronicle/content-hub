Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to a MongoDB instance to ensure the integration is configured
    correctly and the server is reachable.


    ### Flow Description

    1. Retrieves MongoDB connection details (Server Address, Username, Password, Port,
    Use Authentication) from the integration configuration.

    2. Initializes the `MongoDBManager` with the retrieved credentials.

    3. Executes the `test_connectivity` method, which makes an API call (`server_info()`)
    to the MongoDB client to verify the connection.

    4. Outputs a success message if the connection is established without errors.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to a MongoDB instance to verify integration configuration settings
    and ensure the server is reachable.
  capabilities:
