Free Query:
  ai_description: >-
    ### General Description

    Executes a custom JSON query against a specified MongoDB database and collection
    to retrieve matching documents.


    ### Flow Description

    1. Parses the provided JSON query string.

    2. Establishes a connection to the MongoDB server.

    3. Validates the existence of the specified database and collection.

    4. Executes the `find` query on the collection via the MongoDB API.

    5. Retrieves and formats the matching documents.

    6. Returns the results as JSON objects attached to the action's output.


    ### Additional Notes

    The action can return results as individual JSON documents or as a single combined
    JSON array based on the 'Return a single JSON result' parameter.
  ai_short_description: >-
    Executes a custom JSON query against a specified MongoDB database and collection
    to retrieve matching documents.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action connects to a MongoDB instance and executes a `find` query to fetch
      data based on the provided parameters. It does not mutate external data (only
      reads), nor does it mutate internal SecOps data, update entities, or create
      insights.
