Send Query:
  ai_description: >-
    ### General Description

    Sends a query to ArcSight Logger to retrieve information about related events.
    This action allows analysts to search for historical logs and telemetry data directly
    from the SOAR platform.


    ### Flow Description

    1. Authenticates with the ArcSight Logger instance using the provided credentials.

    2. Initiates an asynchronous search query via the ArcSight Logger API (`/server/search`)
    using the specified query string, time frame, and search options.

    3. Periodically polls the query status via the API (`/server/search/status`) until
    the search is complete.

    4. Once completed, retrieves the matching events via the API (`/server/search/events`),
    applying any specified field filters, sorting, and event limits.

    5. Formats the retrieved events and attaches them to the action results as a JSON
    object and a CSV data table.


    ### Additional Notes

    This action runs asynchronously. The maximum number of events that can be returned
    is limited to 10,000 by ArcSight Logger.
  ai_short_description: >-
    Sends a search query to ArcSight Logger and retrieves the matching events.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches event data from ArcSight Logger using HTTP POST and GET requests.
      It does not mutate external data, mutate internal data, update entities, create
      insights, modify alert data, or create case comments.
