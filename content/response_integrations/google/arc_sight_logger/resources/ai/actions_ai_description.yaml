      The action executes a search query against ArcSight Logger to retrieve historical
      logs and events. This directly aligns with the 'Search Events' expected outcome.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
