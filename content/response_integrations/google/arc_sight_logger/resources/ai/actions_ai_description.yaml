Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the ArcSight Logger instance using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts integration configuration parameters (Server Address, Username, Password,
    Verify SSL).

    2. Initializes the ArcSight Logger manager.

    3. Authenticates to the ArcSight Logger API (`/core-service/rest/LoginService/login`)
    to retrieve an authorization token.

    4. Executes a test search query (`/server/search`) to verify connectivity.

    5. Logs out (`/core-service/rest/LoginService/logout`) to close the session.

    6. Returns a success or failure message based on the connectivity test.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to the ArcSight Logger instance using the provided integration
    configuration parameters.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action only performs a connectivity test by logging in, sending a dummy
      search query, and logging out. It does not fetch contextual data for alerts,
      mutate external data, mutate internal data, update entities, create insights,
      modify alert data, or create case comments.
