name: Enrich Assets
description: Enrich information about a resource using Palo Alto Prisma Cloud.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/palo-alto-prisma-cloud#enrich-assets
integration_identifier: PaloAltoPrismaCloud
parameters:
-   name: Asset Identifiers
    default_value: ''
    type: string
    description: Comma-separated list of asset identifiers  which you want to fetch
        the details for. An asset identifier is either an Asset ID or Asset RRN.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/enrich_assets_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
