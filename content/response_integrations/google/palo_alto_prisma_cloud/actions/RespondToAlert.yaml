name: Respond To Alert
description: Respond to an alert in Palo Alto Prisma Cloud.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/palo-alto-prisma-cloud#respond-to-alert
integration_identifier: PaloAltoPrismaCloud
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: ID of the response alert.
    is_mandatory: true
-   name: Response Type
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Dismiss
    - Snooze
    - Reopen
    - Remediate
    description: 'Alert status. If the Snooze value is selected, the Snooze Time parameter
        is required. Possible values: Dismiss Snooze Reopen Remediate'
    is_mandatory: false
-   name: Snooze Time
    default_value: ''
    type: string
    description: Snooze time in hours.
    is_mandatory: false
-   name: Dismiss Note
    default_value: ''
    type: string
    description: Note for a dismissal.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: null
    result_name: JsonResult
    show_result: true
creator: admin
