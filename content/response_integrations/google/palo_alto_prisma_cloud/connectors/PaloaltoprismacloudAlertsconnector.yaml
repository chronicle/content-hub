name: Palo Alto Prisma Cloud - Alerts Connector
parameters:
-   name: DeviceProductField
    default_value: policy_policyType
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: EventClassId
    default_value: resource_cloudType
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.If
        the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field.Default is .* to catch all and return the value unchanged.Used
        to allow the user to manipulate the environment field via regex logic.If the
        regex pattern is null or empty, or the environment value is null, the final
        environment result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: API Root
    default_value: https://api3.prismacloud.io
    type: string
    description: API root of the Palo Alto Prisma Cloud instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Access Key ID
    default_value: ''
    type: string
    description: Access key ID of the Palo Alto Prisma Cloud account.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Secret Access Key
    default_value: ''
    type: password
    description: Secret access key of the Palo Alto Prisma Cloud account.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity To Fetch
    default_value: ''
    type: string
    description: 'Lowest severity of the alerts to fetch. If no value is provided,
        the connector ingests alerts with all severities.Possible values: Critical,
        High, Medium, Low, Informational'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: Number of hours before the first connector iteration to retrieve
        incidents from. This parameter applies to the initial connector iteration
        after you enable the connector for the first time, or used as a fallback value
        in cases where connector's last run timestamp expires.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Alerts To Fetch
    default_value: 100
    type: integer
    description: Number of alerts to process per one connector iteration. Max value
        is 1000. Default value is 100.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If checked, the dynamic list is used as a blocklist.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Verify SSL
    default_value: false
    type: boolean
    description: If checked, verifies that the SSL certificate for the connection
        to the Palo Alto Prisma Cloud server is valid.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Pull alerts from Palo Alto Prisma Cloud. Dynamic List works with the
    “policy.name” parameter.
integration: PaloAltoPrismaCloud
documentation_link: null
rules: []
is_connector_rules_supported: true
creator: admin
