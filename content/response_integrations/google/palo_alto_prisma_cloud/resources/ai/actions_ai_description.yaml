Enrich Assets:
  ai_description: >-
    ### General Description

    Enriches information about specific resources using Palo Alto Prisma Cloud. This
    action allows users to retrieve detailed metadata, risk grades, and cloud-specific
    attributes for assets by providing their unique identifiers (Asset ID or Asset
    RRN). It is primarily used to gather context on cloud resources during an investigation.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves the list of asset identifiers from the
    action input and validates the CSV format.

    2. **Authentication**: Establishes a secure session with the Palo Alto Prisma
    Cloud API using the configured credentials.

    3. **Data Retrieval**: Iterates through each provided identifier and performs
    a lookup via the Prisma Cloud asset enrichment endpoint (`uai/v1/asset`) using
    an HTTP POST request.

    4. **Result Processing**: Collects the raw data for all successfully found assets
    into a JSON result set and identifies any identifiers that could not be resolved.

    5. **Output**: Returns the enriched asset data as a JSON result and provides a
    summary message in the action output indicating which assets were successfully
    enriched.


    ### Additional Notes

    This action relies on the `Asset Identifiers` parameter and does not automatically
    process case entities.
  ai_short_description: >-
    Enriches information about specific cloud resources using Palo Alto Prisma Cloud
    by retrieving detailed metadata and attributes based on provided Asset IDs or
    RRNs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP POST request to the Prisma Cloud API (`uai/v1/asset`)
      to fetch asset enrichment data. It does not mutate external data (the POST is
      used for querying), nor does it mutate internal data, update entities, create
      insights, modify alert data, or create case comments.
