Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the Palo Alto Prisma Cloud instance using the credentials
    provided in the integration configuration. This action ensures that the API Root,
    Access Key ID, and Secret Access Key are valid and that the SOAR engine can successfully
    communicate with the Prisma Cloud environment.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves the API Root, Access Key ID, Secret Access
    Key, and SSL verification settings from the integration configuration.

    2. **Authentication**: Initiates a login request to the Prisma Cloud `login` endpoint
    to obtain a temporary Bearer token.

    3. **Connectivity Test**: Executes a POST request to the `v2/alert` endpoint with
    a minimal query (limit 1) to verify that the authenticated session has the necessary
    permissions to retrieve data.

    4. **Validation**: Checks the HTTP response status; if successful, it confirms
    the connection is active.


    ### Additional Notes

    - This action is primarily used for troubleshooting and verifying setup during
    the initial configuration of the Palo Alto Prisma Cloud integration.

    - It performs a real authentication flow and a lightweight API call to verify
    permissions.
  ai_short_description: >-
    Tests the connectivity to the Palo Alto Prisma Cloud instance using the credentials
    provided in the integration configuration to ensure successful communication.
