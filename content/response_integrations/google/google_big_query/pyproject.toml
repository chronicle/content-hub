[project]
name = "GoogleBigQuery"
version = "19.0"
description = "BigQuery is a fully-managed, serverless data warehouse that enables scalable analysis over petabytes of data. It is a Software as a Service that supports querying using ANSI SQL. It also has built-in machine learning capabilities."
requires-python = ">=3.11,<3.12"
dependencies = [
    "db-dtypes==1.2.0",
    "environmentcommon",
    "google-api-core==2.19.1",
    "google-api-python-client==2.142.0",
    "google-auth==2.34.0",
    "google-auth-httplib2==0.2.0",
    "google-cloud-bigquery==3.25.0",
    "google-crc32c==1.5.0",
    "googleapis-common-protos==1.65.0",
    "grpcio==1.66.0",
    "grpcio-status==1.66.0",
    "numpy==2.1.2",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "pycryptodome==3.20.0",
    "requests==2.32.4",
    "tipcommon",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-json-report>=1.5.0",
    "pytest-mock>=3.14.1",
    "soar-sdk",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.1-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.1.8.4-py2.py3-none-any.whl"
