identifier: GoogleBigQuery
name: Google BigQuery
parameters:
-   name: API Root
    default_value: https://bigquery.googleapis.com
    type: string
    description: API root of the Google BigQuery instance.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Account Type
    default_value: service_account
    type: string
    description: Type of the Google BigQuery account. Located at the “type” parameter
        in the authentication JSON file. You need to copy the value and put it in
        this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Project ID
    default_value: ''
    type: string
    description: Project ID of the Google BigQuery account. Located at the “project_id”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Private Key ID
    default_value: ''
    type: password
    description: Private Key ID of the Google BigQuery account. Located at the “private_key_id”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Private Key
    default_value: ''
    type: password
    description: Private Key of the Google BigQuery account. Located at the “private_key”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Client Email
    default_value: ''
    type: string
    description: Client Email of the Google BigQuery account. Located at the “client_email”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID of the Google BigQuery account. Located at the “client_id”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Auth URI
    default_value: https://accounts.google.com/o/oauth2/auth
    type: string
    description: Auth URI of the Google BigQuery account. Located at the “auth_uri”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Token URI
    default_value: https://oauth2.googleapis.com/token
    type: string
    description: Token URI of the Google BigQuery account. Located at the “token_uri”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Auth Provider X509 URL
    default_value: https://www.googleapis.com/oauth2/v1/certs
    type: string
    description: Auth Provider X509 URL of the Google BigQuery account. Located at
        the “auth_provider_x509_cert_url” parameter in the authentication JSON file.
        You need to copy the value and put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Client X509 URL
    default_value: ''
    type: string
    description: Client X509 URL of the Google BigQuery account. Located at the “client_x509_cert_url”
        parameter in the authentication JSON file. You need to copy the value and
        put it in this integration configuration parameter.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Service Account Json File Content
    default_value: ''
    type: password
    description: 'Optional: Instead of specifying private key id, private key and
        other parameters, specify here the full JSON content of the service account
        file. Other connection parameters will be ignored if this parameter is provided.'
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: A Service Account Client Email to replace the usage of "User's Service
        Account", which will be used for Impersonation. Note that the SOAR Service
        Account must be granted the "Service Account Token Creator" IAM role on the
        User Service Account.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Quota Project ID
    default_value: ''
    type: string
    description: ID of your Google Cloud project for Google Cloud API usage and billing.
        If no value is provided, the project ID defined in your Google Cloud service
        account is used. For this parameter to work, make sure to grant the “Service
        Usage Consumer” IAM role to your Google Cloud service account.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Google Big Query service is valid.
    is_mandatory: false
    integration_identifier: GoogleBigQuery
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-big-query
categories:
- Database
- Cloud
- Operational
- Google
svg_logo_path: resources/logo.svg
image_path: resources/image.png
