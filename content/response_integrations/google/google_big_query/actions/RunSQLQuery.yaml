name: Run SQL Query
description: Execute queries in Google BigQuery.
integration_identifier: GoogleBigQuery
parameters:
-   name: Dataset Name
    default_value: ''
    type: string
    description: Specify the name of the dataset, which will be used, when executing
        queries.
    is_mandatory: true
-   name: Query
    default_value: ''
    type: string
    description: Specify the SQL query that needs to be executed.
    is_mandatory: true
-   name: Max Results To Return
    default_value: '50'
    type: string
    description: Specify how many results to return in the response.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/run_sql_query_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
