Run SQL Query:
  ai_description: >-
    ### General Description

    Executes a specified SQL query in Google BigQuery to retrieve data from a specific
    dataset. This action allows analysts to fetch logs, telemetry, or other stored
    information to provide additional context during investigations.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the dataset name, SQL query,
    and the maximum results limit from the input parameters.

    2. **Validation**: It validates that the 'Max Results To Return' parameter is
    a positive integer.

    3. **Authentication**: It initializes the Google BigQuery API client using the
    configured credentials.

    4. **Execution**: The SQL query is executed against the specified dataset via
    the BigQuery API.

    5. **Result Processing**: The resulting rows are fetched (up to the specified
    limit) and converted into a CSV-formatted data table and a JSON object for use
    in subsequent playbook steps.


    ### Additional Notes

    Ensure the configured service account has the necessary BigQuery roles (e.g.,
    'BigQuery Data Viewer' and 'BigQuery Job User') for the target project and dataset.
