Run Custom Query:
  ai_description: "### General Description\nThe **Run Custom Query** action allows\
    \ users to execute arbitrary SQL queries directly against Google BigQuery datasets.\
    \ This action serves as a flexible utility for retrieving specific data, performing\
    \ data analysis, or managing BigQuery resources directly from a Google SecOps\
    \ playbook. It returns the query results in both a structured JSON format and\
    \ a CSV-formatted Data Table for easy visualization.\n\n### Flow Description\n\
    1. **Parameter Extraction:** The action retrieves the SQL query and the maximum\
    \ number of results to return from the user input.\n2. **Validation:** It validates\
    \ that the 'Max Results To Return' parameter is a positive integer.\n3. **Authentication:**\
    \ It initializes the Google BigQuery API Manager using the configured integration\
    \ credentials (e.g., Service Account or Workload Identity).\n4. **Query Execution:**\
    \ The SQL query is sent to the BigQuery engine for execution via the Google Cloud\
    \ BigQuery API.\n5. **Data Processing:** The resulting rows are converted into\
    \ a structured dictionary format.\n6. **Output Generation:** \n    * A CSV-formatted\
    \ Data Table named \"Results\" is added to the case wall if data is returned.\n\
    \    * The raw JSON results are attached to the action output.\n    * The action\
    \ completes with a success message or an error report if the SQL execution fails.\n\
    \n### Additional Notes\n* **Permissions:** The service account used by the integration\
    \ must have the appropriate BigQuery IAM roles (e.g., `BigQuery Data Viewer` for\
    \ SELECT queries or `BigQuery Data Editor` for mutations) to execute the provided\
    \ SQL.\n* **Data Mutation:** Because this action accepts raw SQL, it is capable\
    \ of performing data mutations (INSERT, UPDATE, DELETE) or schema changes (DROP,\
    \ CREATE) if the query contains such commands."
  ai_short_description: >-
    Executes arbitrary SQL queries against Google BigQuery datasets to retrieve data
    or perform data manipulation, returning the results as a Data Table and JSON output.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Executes arbitrary SQL queries which can include DML/DDL statements (e.g., INSERT,
      UPDATE, DELETE) that modify data or schemas in Google BigQuery.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a SQL query against Google BigQuery via the API. This fetches
      data (the query results). Because the query is arbitrary SQL, it can also mutate
      external data (e.g., INSERT, UPDATE, DELETE). It does not mutate internal SecOps
      data, update entities, create insights, modify alert data, or create case comments.
