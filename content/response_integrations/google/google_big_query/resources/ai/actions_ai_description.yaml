Ping:
  ai_description: >-
    ### General Description

    The Ping action is designed to verify connectivity between Google SecOps and the
    Google BigQuery service. It ensures that the credentials and configuration parameters
    provided in the integration settings are valid and that the environment has the
    necessary permissions to interact with the BigQuery API.


    ### Flow Description

    1. **Configuration Extraction**: The action retrieves the global configuration
    parameters from the integration settings.

    2. **Manager Initialization**: It initializes the `GoogleBigQueryApiManager`,
    which handles authentication and session creation using the Google Cloud SDK.

    3. **Connectivity Test**: The action attempts to call the `list_datasets` API
    method, requesting a maximum of one result. This serves as a lightweight check
    to confirm the API client can successfully authenticate and reach the service.

    4. **Result Reporting**: If the API call succeeds, the action returns a success
    message. If an exception occurs (e.g., authentication failure, network error),
    it logs the error and reports a failure.


    ### Additional Notes

    This action does not process any entities and is intended purely for setup, configuration
    validation, and troubleshooting purposes.
  ai_short_description: >-
    Verifies connectivity between Google SecOps and the Google BigQuery service by
    attempting to authenticate and list datasets using the provided integration credentials.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a lightweight API call (`list_datasets`) to test connectivity,
      but it does not fetch contextual data for alerts or entities. It does not perform
      any state-changing operations (mutations) on external systems, nor does it mutate
      internal data, update entities, create insights, modify alert data, or create
      case comments.
