Acknowledge Alert Groups:
  ai_description: >-
    ### General Description

    Acknowledges or un-acknowledges specified alert groups in FireEye HX. This action
    allows analysts to synchronize the handling of alert groups between the SecOps
    platform and the FireEye HX platform.


    ### Flow Description

    1. Initializes the FireEye HX manager with the provided API credentials.

    2. Parses the provided comma-separated list of Alert Group IDs.

    3. Sends a PATCH request to the FireEye HX API to update the acknowledgement status
    (and optionally add a comment) for the specified alert groups.

    4. Returns the updated alert group details as a JSON result and outputs a summary
    message indicating success or failure for each group.


    ### Additional Notes

    Note that you can acknowledge alert groups only, not individual alerts, via the
    FireEye HX API.
  ai_short_description: >-
    Acknowledges or un-acknowledges specified alert groups in FireEye HX.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the acknowledgement status of specified alert groups in FireEye HX.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a PATCH request to the FireEye HX API to update the acknowledgement
      status of alert groups, which mutates external data. It does not fetch contextual
      data, update internal entities, create insights, modify SecOps alerts, or create
      case comments.
