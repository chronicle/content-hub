Cancel Host Contain:
  ai_description: >-
    ### General Description

    Cancels the containment of a host on the FireEye HX server based on IP Address
    or Hostname entities. This action restores the endpoint's network communication
    capabilities. Note: This action is not supported for Linux hosts by FireEye HX.


    ### Flow Description

    1. Iterates over the provided target entities, filtering for IP Address and Hostname
    entity types.

    2. Queries the FireEye HX API to find the matching host agent ID for each entity.

    3. If multiple matching hosts are found, selects the agent with the most recent
    poll timestamp.

    4. Sends a DELETE request to the FireEye HX API (`/hosts/{agent_id}/containment`)
    to cancel the containment of the identified host.

    5. Returns a summary message indicating which entities were successfully uncontained
    and which failed.


    ### Additional Notes

    Ensure that the FireEye HX integration is properly configured with the necessary
    API credentials and that the target hosts are currently contained before running
    this action.
