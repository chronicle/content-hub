    host agent information.

    3. If multiple hosts match the entity, selects the agent with the most recent
    poll timestamp.

    4. Makes a subsequent API call to FireEye HX to fetch alerts for the identified
    agent, applying any provided filters such as limit, share mode, resolution status,
    time range, alert source, or specific alert ID.

