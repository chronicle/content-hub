Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the FireEye HX server using the provided integration configuration
    parameters. This action verifies that the credentials and network settings are
    correct by attempting to authenticate with the external service.


    ### Flow Description

    1. Extracts integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the FireEye HX Manager, which makes an HTTP GET request to the
    `/token` endpoint to authenticate and obtain an API token.

    3. Makes an HTTP DELETE request to the `/token` endpoint to invalidate the token
    and close the session.

    4. Returns a successful result if the connection and authentication succeed, or
    an error message if they fail.


    ### Additional Notes

    This action is primarily used for verifying the integration setup and does not
    perform any operational tasks on alerts or entities.
