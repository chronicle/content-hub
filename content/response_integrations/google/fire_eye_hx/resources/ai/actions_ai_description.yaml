Contain Host:
  ai_description: >-
    ### General Description

    Creates a contain host task on the FireEye HX server for the specified IP Address
    or Hostname entities. This action isolates the endpoint from the network. Note
    that this action is not supported for Linux hosts by FireEye HX.


    ### Flow Description

    1. Iterates over the target entities provided in the case.

    2. Filters for entities of type IP Address or Hostname.

    3. Queries the FireEye HX API to fetch the matching host details using the entity
    identifier.

    4. If multiple hosts match the identifier, selects the host with the most recent
    last poll timestamp.

    5. Initiates a containment task for the selected host via the FireEye HX API (`POST
    /hosts/{agent_id}/containment`).


    ### Additional Notes

    The containment request can be automatically approved based on the `Approve Containment`
    action parameter. If not approved automatically, the containment request can be
    approved manually in the FireEye HX web console.
