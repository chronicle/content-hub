name: Get File
description: Create a file acquisition on a FireEye HX host.
integration_identifier: FireEyeHX
parameters:
-   name: Agent Id
    default_value: ''
    type: string
    description: Agent Id of host
    is_mandatory: false
-   name: File Path
    default_value: ''
    type: string
    description: Full path of file to acquire (e.g. C:\windows\system32\notepad.exe or /tmp/malware.sh)
    is_mandatory: true
-   name: Use API Mode
    default_value: 'false'
    type: boolean
    description: Use API Mode
    is_mandatory: false
-   name: External Id
    default_value: ''
    type: string
    description: External id of file acquisition
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/GetFile_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
