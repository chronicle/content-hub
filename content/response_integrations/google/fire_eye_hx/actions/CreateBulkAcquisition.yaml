name: Create Bulk Acquisition
description: Create a bulk acquisition task across targeted endpoints or host sets in FireEye HX.
integration_identifier: FireEyeHX
parameters:
-   name: Script Content
    default_value: ''
    type: string
    description: XML script content to execute across targeted endpoints.
    is_mandatory: true
-   name: Host Set Name
    default_value: 'all_hosts'
    type: string
    description: Name of the host set to target. Defaults to 'all_hosts'.
    is_mandatory: false
-   name: Host Set ID
    default_value: ''
    type: string
    description: Numeric ID of the host set (e.g. 9 for all_hosts). Overrides Host Set Name if provided.
    is_mandatory: false
-   name: Agent IDs
    default_value: ''
    type: string
    description: Comma-separated list of specific Agent IDs to target instead of a host set.
    is_mandatory: false
-   name: Comment
    default_value: 'Created by Google SecOps'
    type: string
    description: Audit comment attached to the bulk acquisition.
    is_mandatory: false
-   name: Timeframe Start
    default_value: ''
    type: string
    description: Optional ISO start timestamp (e.g. 2026-10-25T00:00:00) to replace __INTERVAL_START__ in script.
    is_mandatory: false
-   name: Timeframe Stop
    default_value: ''
    type: string
    description: Optional ISO stop timestamp (e.g. 2026-10-25T23:59:59) to replace __INTERVAL_STOP__ in script.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_bulk_acquisition_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: false
simulation_data_json: '{}'
