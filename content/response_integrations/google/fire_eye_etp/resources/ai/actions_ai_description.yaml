Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the FireEye ETP API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Extracts integration configuration parameters such as API Root, Client ID,
    Client Secret, and API Key.

    2. Initializes the FireEye ETP Manager with the provided credentials.

    3. Makes a POST request to the `/api/v2/public/alerts/search` endpoint with a
    minimal payload to verify authentication and network connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to the FireEye ETP API to ensure the integration is configured
    correctly.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
