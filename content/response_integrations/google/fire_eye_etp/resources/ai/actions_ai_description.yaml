    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the alerts search endpoint with a minimal
      payload solely to test connectivity and authentication. It does not fetch contextual
      data for entities, mutate external data, update internal entities, or create
      insights.
