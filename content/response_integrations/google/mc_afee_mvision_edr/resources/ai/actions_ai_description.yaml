    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a task in McAfee Mvision EDR to dismiss a specific threat.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to McAfee Mvision EDR to create a task that
      dismisses a threat, which mutates external data. It does not fetch contextual
      enrichment data, mutate internal SecOps data, update entities, or create insights.
