Enrich Endpoint:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities by fetching endpoint system information
    from McAfee Mvision EDR. This action retrieves contextual metadata about the endpoints,
    such as the operating system, last boot time, and network interfaces, to provide
    analysts with better visibility into the assets involved in an alert.


    ### Flow Description

    1. Initializes the McAfee Mvision EDR API client using the provided integration
    configuration.

    2. Filters the target entities to include only Hostname and IP Address types.

    3. Makes a GET request to the McAfee Mvision EDR API to retrieve a list of all
    available hosts.

    4. Iterates through the filtered entities and attempts to match each entity's
    identifier against the hostnames or IP addresses of the retrieved hosts.

    5. If a match is found, the entity is enriched with the host's system information,
    and its `is_enriched` flag is set to true.

    6. Updates the enriched entities within the Google SecOps platform and attaches
    the host data as JSON and CSV results.


    ### Additional Notes

    - The action fetches all hosts from the external system and performs the matching
    logic locally.

    - Entities that cannot be matched against the retrieved hosts will be reported
    as failed in the output message.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by fetching endpoint system information,
    such as operating system and network interfaces, from McAfee Mvision EDR.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
