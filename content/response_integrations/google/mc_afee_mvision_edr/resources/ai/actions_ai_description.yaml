Quarantine Endpoint:
  ai_description: >-
    ### General Description

    Creates a quarantine endpoint task on the McAfee Mvision EDR server for specified
    IP Address or Hostname entities. This action isolates the endpoint from the network
    to prevent further communication during an incident.


    ### Flow Description

    1. Initializes the connection to the McAfee Mvision EDR API.

    2. Filters the target entities to include only IP Addresses and Hostnames.

    3. Retrieves a list of all hosts from the McAfee Mvision EDR server.

    4. Iterates through the filtered entities and attempts to match their identifiers
    against the hostnames or IP addresses of the retrieved hosts.

    5. If a match is found, sends a request to create a quarantine task for the corresponding
    endpoint.

    6. Aggregates the results and outputs a summary of successful, failed, and duplicate
    entity matches.


    ### Additional Notes

    If multiple matches are found in McAfee Mvision EDR for a single entity, the action
    will take the first match and log the duplicate.
