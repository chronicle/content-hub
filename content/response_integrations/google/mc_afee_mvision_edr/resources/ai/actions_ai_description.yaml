Dismiss Threat:
  ai_description: >-
    ### General Description

    Dismisses a specific threat in McAfee Mvision EDR. This action initiates a state
    change on the external EDR platform to mark the specified threat as dismissed.


    ### Flow Description

    1. Initializes the McAfee Mvision EDR client using the provided credentials.

    2. Retrieves the case associated with the provided Threat ID.

    3. Makes a POST request to the McAfee Mvision EDR API (`/remediation/api/v1/actions/global-threat-actions`)
    to create a task that dismisses the threat.

    4. Monitors the task status asynchronously in subsequent runs until the task completes
    or fails.


    ### Additional Notes

    This is an asynchronous action. It will run multiple times until the threat dismissal
    task is reported as completed or failed by the McAfee Mvision EDR API.
  ai_short_description: >-
    Dismisses a specific threat in McAfee Mvision EDR by creating and monitoring a
    dismissal task.
