Kill Process:
  ai_description: >-
    ### General Description

    Stops a running process and removes its file on a managed endpoint using McAfee
    Mvision EDR. If the process is not running, its file is removed from the endpoint.
    The action supports identifying the process by PID, SHA256, Name, or Full Path.


    ### Flow Description

    1. Retrieves the list of hosts from McAfee Mvision EDR.

    2. Matches the target Address and Hostname entities to the retrieved hosts based
    on their identifiers (IP or hostname).

    3. Initiates an asynchronous task on the matched endpoints to kill the specified
    process using the provided process identifier type and value.

    4. Periodically queries the status of the task until it completes, fails, or encounters
    an error.

    5. Returns the final execution status and a summary of the processed entities.


    ### Additional Notes

    This action executes asynchronously. It will continue to run in the background
    and periodically check the task status on the McAfee Mvision EDR platform until
    completion.
