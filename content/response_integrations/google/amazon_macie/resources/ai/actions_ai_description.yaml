Create Custom Data Identifier:
  ai_description: >-
    ### General Description

    Creates a new custom data identifier in Amazon Macie based on provided regular
    expressions, keywords, and ignore words. This action allows security teams to
    define custom patterns for sensitive data discovery within AWS.


    ### Flow Description

    1. Extracts the provided parameters including the identifier name, regular expression,
    keywords, ignore words, and match distance.

    2. Connects to the Amazon Macie service using the provided AWS credentials.

    3. Makes an API call (`create_custom_data_identifier`) to Amazon Macie to create
    the custom data identifier with the specified criteria.

    4. Returns the ID of the newly created custom data identifier as a JSON result
    and completes the action.


    ### Additional Notes

    This action does not operate on or interact with SecOps entities.
  ai_short_description: >-
    Creates a new custom data identifier in Amazon Macie using specified regular expressions,
    keywords, and ignore words.
