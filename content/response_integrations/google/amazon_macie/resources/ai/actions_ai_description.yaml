  ai_description: >-
    ### General Description

    Tests connectivity to the Amazon Macie service to ensure that the provided integration
    credentials and network access are valid.


    ### Flow Description

    1. Extracts the AWS Access Key ID, AWS Secret Key, and AWS Default Region from
    the integration-level configuration.

    2. Initializes the Amazon Macie client.

    3. Makes an API call to the `list_findings` endpoint with a maximum result limit
    of 1 to verify authentication and connectivity.

    4. Returns a success message if the API call succeeds, or a failure message if
    an error occurs.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to the Amazon Macie service to ensure valid credentials and
    network access.
