    ### General Description

    Retrieves detailed information for specific Amazon Macie findings based on their
    Finding IDs. This action allows analysts to fetch the full context and raw data
    of Macie findings directly into the case.


    ### Flow Description

    1. Extracts the provided `Finding ID` parameter, splitting it into a list if multiple
    comma-separated IDs are provided.

    2. Initializes a connection to the Amazon Macie service using the configured AWS
    credentials.

    3. Makes an API call (`get_findings`) to Amazon Macie to fetch the details for
    the specified Finding IDs.

    4. Parses the retrieved findings and constructs a CSV table with the finding details.

    5. Returns the raw JSON data of the findings as the action's JSON result.


