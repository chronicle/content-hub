Update Alert:
  ai_description: >-
    ### General Description

    Updates the status, analyst verdict, and/or assignee of a specific alert in SentinelOne
    Singularity Operations Center. This action initiates a state change on the external
    platform to reflect the latest investigation findings or assignment.


    ### Flow Description

    1. Extracts the `Alert ID`, `Status`, `Verdict`, and `Assignee` parameters from
    the action configuration.

    2. Validates that at least one of the optional update parameters (`Status`, `Verdict`,
    or `Assignee`) is provided.

    3. If an `Assignee` is provided, resolves the input (email address, numerical
    User ID, or "Unassign") to a valid SentinelOne User ID via the SentinelOne API.

    4. Calls the SentinelOne API to update the specified alert with the new status,
    verdict, and/or assignee.

    5. Returns a success message detailing the updated fields or indicating if the
    update was scheduled for background execution.


    ### Additional Notes

    - The `Assignee` parameter accepts an email address, a numerical User ID, or the
    exact string "Unassign" to remove the current assignment.

    - If an email address is provided for the `Assignee`, the action will make an
    additional API call to resolve the email to a SentinelOne User ID.
  ai_short_description: >-
    Updates the status, analyst verdict, and/or assignee of a specific alert in SentinelOne
    Singularity Operations Center.
