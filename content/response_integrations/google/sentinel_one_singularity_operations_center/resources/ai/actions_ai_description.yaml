Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the SentinelOne Singularity Operations Center server.
    This action verifies that the provided integration configuration and credentials
    are valid and that the external service is reachable.


    ### Flow Description

    1. Initializes the SentinelOne API client using the configured API Root and API
    Token.

    2. Executes a connectivity test via an API call to the SentinelOne Singularity
    Operations Center.

    3. Returns a success message if the connection is successfully established.

    4. Catches any exceptions and returns an error message if the connection fails.


    ### Additional Notes

    This action does not require any entities or action-specific parameters to run.
    It relies solely on the integration-level configuration.
