Add Alert Comment:
  ai_description: >-
    ### General Description

    Adds a comment or note to a specific alert in SentinelOne Singularity Operations
    Center.


    ### Flow Description

    1. Extracts the `Alert ID`, `Comment`, and `Comment Type` parameters.

    2. Maps the `Comment Type` to the corresponding SentinelOne API enum value.

    3. Makes an API call to SentinelOne to add the comment to the specified alert.

    4. Returns a success message if the comment is added successfully.


    ### Additional Notes

    If the alert ID is invalid or not found, an error is raised.
