Delete Quarantined Email:
  ai_description: >-
    ### General Description

    Deletes quarantined email messages from a specified folder in Proofpoint Protection
    Server.


    ### Flow Description

    1. Extracts the provided Message GUIDs, Folder Name, and optional Deleted Folder
    Name parameters.

    2. Validates that the specified folder exists and retrieves the message records
    by making a GET request to the Proofpoint API.

    3. Iterates through the validated GUIDs and executes a POST request to the Proofpoint
    API to delete the messages (or move them to the deleted folder).

    4. Returns the successful deletion records as JSON and outputs a summary message
    indicating success or failure for each GUID.


    ### Additional Notes

    This action only works on messages that were created within the last 30 days.
