Move Quarantined Email:
  ai_description: >-
    **General Description**

    The "Move Quarantined Email" action moves specified quarantined messages from
    their current folder to a designated target folder within ProofPoint Protection
    Server.


    **Flow Description**

    1. Extracts the provided Message GUIDs, source Folder Name, and Target Folder
    Name parameters.

    2. Validates that the source folder and target folder are not identical.

    3. Searches ProofPoint for the specified GUIDs within the source folder over the
    last 30 days to validate their existence.

    4. Iterates through the validated GUIDs and makes a POST request to the ProofPoint
    API to move each message to the target folder.

    5. Returns a success message and a JSON result containing the details of the successfully
    moved messages.


    **Additional Notes**

