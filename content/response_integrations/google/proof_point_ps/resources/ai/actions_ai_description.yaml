    ### General Description

    The Ping action is used to test and verify connectivity to the Proofpoint Email
    Protection server using the configured integration parameters.


    ### Flow Description

    1. Initializes the ProofPointPS API client using the provided integration configuration
    (API Root, Username, Password, Verify SSL).

    2. Executes a test API call (`test_connectivity`) which performs a basic search
    query to validate authentication and network access.

    3. Returns a success message if the connection is established and authenticated
    successfully.

    4. Returns a failure message along with the specific error details if the connection
    or authentication fails.


