Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and User entities by querying Proofpoint Email Protection for
    associated quarantined emails. The action searches the 'Quarantine', 'Spam', and
    'Virus' folders for messages where the entity acts as either the sender or recipient,
    and appends the retrieved email records to the entity's properties.


    ### Flow Description

    1. Iterates over the provided target entities, filtering for Hostname and User
    types.

    2. For Hostname entities, extracts the domain and searches Proofpoint via the
    `/rest/v1/quarantine` API for emails where the sender or recipient matches `@domain`.

    3. For User entities, validates the identifier as an email address and searches
    Proofpoint for emails where the sender or recipient matches the email address.

    4. Retrieves matching quarantine records from the 'Quarantine', 'Spam', and 'Virus'
    folders.

    5. Flattens the retrieved records, adds a 'ProofPointPS' prefix, and updates the
    entity's `additional_properties`.

    6. Attaches the raw JSON results of the found records to the action's output.


    ### Additional Notes

    - User entities must have a valid email address format as their identifier to
    be processed.

    - The action automatically searches across three specific folders: Quarantine,
    Spam, and Virus.
