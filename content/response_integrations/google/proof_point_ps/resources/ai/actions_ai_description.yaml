Download Quarantined Email:
  ai_description: >-
    ### General Description

    Downloads the raw data of quarantined email messages from Proofpoint Protection
    Server. This action retrieves the full `.eml` content of specified messages and
    saves them to a local directory, with an option to attach them directly to the
    case wall.


    ### Flow Description

    1. Validates the provided destination folder path on the local system.

    2. Makes an API call to Proofpoint to search for records within the specified
    folder from the last 30 days.

    3. Iterates through the provided Message GUIDs and verifies their existence in
    the retrieved folder records.

    4. Makes an API call to Proofpoint (`download_message`) to download the raw message
    content for each valid GUID.

    5. Parses the raw email bytes to extract a safe subject line and saves the content
    as an `.eml` file to the specified local directory.

    6. If the 'Save To Case Wall' parameter is enabled, attaches the downloaded `.eml`
    file to the SOAR case wall.


    ### Additional Notes

    - The action only works on messages that were created in the last 30 days.

    - If the 'Overwrite' parameter is set to false and a file with the same name already
    exists in the destination folder, the download for that specific GUID will fail.
  ai_short_description: >-
    Downloads the raw `.eml` content of quarantined email messages from Proofpoint
    Protection Server using their Message GUIDs, saving them locally and optionally
    attaching them to the case wall.
