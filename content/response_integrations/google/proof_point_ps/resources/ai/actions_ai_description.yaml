Search Quarantined Emails:
  ai_description: >-
    ### General Description

    Searches for quarantined emails in ProofPoint Protection Server based on specified
    criteria such as sender, recipient, subject, and time frame. This action retrieves
    detailed information about quarantined messages for analysis and tracing.


    ### Flow Description

    1. Extracts search parameters including Message GUID, Message ID, Sender, Recipient,
    Subject, and Time Frame.

    2. Calculates the start and end time for the search query based on the provided
    time frame.

    3. Makes a GET request to the ProofPoint API (`/rest/v1/quarantine`) to retrieve
    matching quarantined records.

    4. Filters the retrieved records locally based on Message GUID, Message ID, and
    DLP violation settings.

    5. Limits the final result set to the specified maximum number of results.

    6. Returns the matching quarantined emails as JSON results.


    ### Additional Notes

    This action is read-only and does not modify any data on the ProofPoint server.
    If "Custom" is selected for the Time Frame, the "Start Time" parameter becomes
    mandatory.
  ai_short_description: >-
    Searches for quarantined emails in ProofPoint Protection Server based on specified
    criteria such as sender, recipient, subject, and time frame, returning the matching
    records as JSON data.
