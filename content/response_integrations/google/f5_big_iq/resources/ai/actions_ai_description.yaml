Get Event Logs By Blocking ID:
  ai_description: >-
    ### General Description

    Retrieves event logs from F5 BigIQ based on a specific blocking ID. This action
    queries the F5 BigIQ system to find logs associated with a blocked event and returns
    the data for further analysis.


    ### Flow Description

    1. Initializes the connection to the F5 BigIQ server using the provided integration
    configuration.

    2. Retrieves the `Blocking ID` parameter provided by the user or playbook.

    3. Makes an API call (POST request to `mgmt/cm/shared/es/logiq/asmindex/_search`)
    to the F5 BigIQ server to search for event logs matching the specified blocking
    ID.

    4. If event logs are found, they are attached to the action's result as a JSON
    object.

    5. Returns a success or failure message based on whether the logs were found.


    ### Additional Notes

    This action does not operate on SecOps entities and relies solely on the provided
    Blocking ID parameter.
