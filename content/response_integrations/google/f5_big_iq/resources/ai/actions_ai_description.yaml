Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the F5 Big-IQ server to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Retrieves the integration configuration parameters, including the Server Address,
    Username, Password, and SSL verification settings.

    2. Initializes the F5 Big-IQ manager, which triggers an authentication attempt.

    3. Makes a POST request to the F5 Big-IQ login API endpoint to obtain an authentication
    token.

    4. If the authentication is successful, the action completes and returns a "Connection
    Established" message. If it fails, it returns a "Connection Failed" message.


    ### Additional Notes

    This action is strictly used for diagnostic purposes to verify network connectivity
    and credential validity. It does not interact with alerts or entities.
