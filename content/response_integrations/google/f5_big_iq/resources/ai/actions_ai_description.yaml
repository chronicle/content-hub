Change Policy Enforcement Mode:
  ai_description: >-
    ### General Description

    Changes the enforcement mode of a specific policy in F5 BigIQ using its Policy
    ID. This action initiates a state change on the external F5 BigIQ appliance to
    update how a policy is enforced (e.g., changing it to blocking mode).


    ### Flow Description

    1. Extracts the `Policy ID` and `Enforcement Mode` from the action parameters.

    2. Authenticates with the F5 BigIQ API to obtain an authorization token.

    3. Sends an HTTP PATCH request to the F5 BigIQ API (`/mgmt/cm/asm/working-config/policies/{policy_id}`)
    with the new enforcement mode payload.

    4. Returns a success message to the SecOps platform upon successful modification.


    ### Additional Notes

    Ensure that the provided Policy ID exists on the F5 BigIQ appliance and that the
    specified Enforcement Mode is a valid configuration state (e.g., 'blocking').
  ai_short_description: >-
    Changes the enforcement mode of a specific policy in F5 BigIQ using its Policy
    ID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the enforcement mode of a specific policy on the F5 BigIQ appliance.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an HTTP PATCH request to the F5 BigIQ API to modify the enforcement
      mode of a policy, which mutates external data. It does not fetch contextual
      data, mutate internal SecOps data, update entities, or create insights.
