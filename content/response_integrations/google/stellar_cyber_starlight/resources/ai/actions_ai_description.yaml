Update Security Event:
  ai_description: >-
    ### General Description

    Updates a specific security event in Stellar Cyber Starlight by modifying its
    status or appending a comment. This action allows analysts to synchronize event
    states and add contextual notes directly from the SOAR platform to the Stellar
    Cyber Starlight instance.


    ### Flow Description

    1. Validates the input parameters to ensure that at least a new status (other
    than 'Select One') or a comment is provided.

    2. Initializes the Stellar Cyber Starlight manager using the provided API credentials.

    3. Sends a POST request to the Stellar Cyber Starlight API (`update_ser` endpoint)
    with the event ID, index, and the specified status and/or comment.

    4. Returns a success message upon successful update, or an error message if the
    API request fails.


    ### Additional Notes

    - The action requires the exact `Index` and `ID` of the security event to be updated.

    - If the `Status` parameter is left as 'Select One', the `Comment` parameter becomes
    mandatory for the action to execute successfully.
  ai_short_description: >-
    Updates a specific security event in Stellar Cyber Starlight by modifying its
    status or appending a comment.
