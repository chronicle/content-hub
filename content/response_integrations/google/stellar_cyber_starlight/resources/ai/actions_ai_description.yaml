Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Stellar Cyber Starlight server using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the integration-level configuration parameters (API Root, Username,
    API Key, API Token, Verify SSL).

    2. Initializes the Stellar Cyber Starlight manager with the provided credentials.

    3. Executes a test connectivity API call (`GET data/*/_search`) to verify the
    connection.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
