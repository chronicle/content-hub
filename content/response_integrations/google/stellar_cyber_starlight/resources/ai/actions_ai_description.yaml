Advanced Search:
  ai_description: >-
    ### General Description

    Executes an advanced search query within a specified index in Stellar Cyber Starlight
    using a Domain Specific Language (DSL) JSON query. This action allows users to
    retrieve specific telemetry data, logs, or events based on complex search criteria.


    ### Flow Description

    1. Initializes the connection to the Stellar Cyber Starlight API using the provided
    integration configuration.

    2. Retrieves the target `Index` and the `DSL Query` from the action parameters.

    3. Sends a GET request to the Stellar Cyber Starlight search endpoint (`data/{index}/_search`)
    with the provided DSL query as the JSON payload.

    4. Parses the search hits from the response.

    5. Attaches the search results as a JSON object to the action's output.


    ### Additional Notes

    The `DSL Query` parameter must be a valid JSON object formatted according to Stellar
    Cyber Starlight's search syntax (which is based on Elasticsearch DSL).
  ai_short_description: >-
    Executes an advanced search query within a specified index in Stellar Cyber Starlight
    using a Domain Specific Language (DSL) JSON query and returns the matching results.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a GET request to the Stellar Cyber Starlight
      search API. It does not mutate external data, mutate internal data, update entities,
      create insights, modify alert data, or create case comments.
