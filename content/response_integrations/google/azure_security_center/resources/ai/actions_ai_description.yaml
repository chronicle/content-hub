Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Azure Security Center using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts integration configuration parameters (Client ID, Client Secret, Username,
    Password, Tenant ID, Refresh Token, Verify SSL).

    2. Initializes the AzureSecurityCenterManager.

    3. Makes a GET request to the Azure Security Center operations endpoint (`https://management.azure.com/providers/Microsoft.Security/operations`)
    to verify connectivity.

    4. Returns a success or failure message based on the HTTP response.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the Azure Security Center API.
