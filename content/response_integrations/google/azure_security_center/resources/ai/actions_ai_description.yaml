List Regulatory Standard Controls:
  ai_description: >-
    ### General Description

    Lists available controls related to specific regulatory standards in Microsoft
    Azure Security Center.


    ### Flow Description

    1. Extracts action parameters including Subscription ID, Standard Names, State
    Filter, and Max Standards To Return.

    2. Validates the provided State Filter against allowed values (Passed, Failed,
    Unsupported, Skipped).

    3. Initializes the Azure Security Center Manager with the provided credentials.

    4. Iterates over the provided Standard Names and fetches the regulatory standard
    controls for each, applying the state filter and limit.

    5. Aggregates the successful, missing, and failed standards.

    6. Outputs a data table with the retrieved regulatory controls and returns the
    raw data as a JSON result.


    ### Additional Notes

    If the Subscription ID is provided at both the integration level and action level,
    priority will be given to the action configuration.
