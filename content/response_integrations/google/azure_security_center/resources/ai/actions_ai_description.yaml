Get OAuth Authorization Code:
  ai_description: >-
    ### General Description

    Generates an OAuth authorization code URL for Azure Security Center. This action
    constructs the necessary URL required to initiate the OAuth 2.0 authorization
    flow for Microsoft Azure.


    ### Flow Description

    1. Extracts the Tenant ID and Client ID from the integration configuration.

    2. Extracts the Redirect URL from the action parameters.

    3. Constructs the Microsoft OAuth 2.0 authorization URL using the provided parameters.

    4. Attaches the generated URL as a link to the action's results.


    ### Additional Notes

    No API calls are made during the execution of this action. The user must manually
    navigate to the generated URL in a web browser, authenticate, and copy the resulting
    authorization code from the redirect URL to use in subsequent token generation
    actions.
  ai_short_description: >-
    Generates an OAuth authorization code URL for Azure Security Center to facilitate
    manual authentication and token retrieval.
