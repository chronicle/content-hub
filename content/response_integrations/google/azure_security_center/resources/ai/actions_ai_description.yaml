    ### General Description

    Generates an OAuth refresh token required for the Azure Security Center integration
    configuration.


    ### Flow Description

    1. Extracts the `Redirect URL` and `Authorization Code` from the action parameters.

    2. Makes an HTTP POST request to the Microsoft OAuth API to exchange the authorization
    code for a refresh token.

    3. Returns the generated refresh token and adds it to the action's JSON results.


    ### Additional Notes

    The authorization code must be generated prior to running this action using the
    "Get OAuth Authorization Code" action.
