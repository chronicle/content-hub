List Regulatory Standards:
  ai_description: >-
    ### General Description

    Retrieves a list of available regulatory standards from Microsoft Azure Security
    Center based on a specified subscription ID and state filters. This action allows
    analysts to query the compliance posture of their Azure environment directly from
    the SOAR platform.


    ### Flow Description

    1. Extracts the subscription ID, state filter, and maximum number of standards
    to return from the action parameters.

    2. Validates the provided state filters against supported states (Passed, Failed,
    Unsupported, Skipped).

    3. Authenticates with Microsoft Azure Security Center and makes a GET request
    to the regulatory compliance standards endpoint (`/providers/Microsoft.Security/regulatoryComplianceStandards`).

    4. Filters the retrieved standards based on the requested states and limits the
    results to the specified maximum.

    5. Returns the data as a JSON object and constructs a CSV table containing the
    regulatory standards.


    ### Additional Notes

    If the subscription ID is provided at both the integration and action levels,
    the action-level configuration takes precedence.
