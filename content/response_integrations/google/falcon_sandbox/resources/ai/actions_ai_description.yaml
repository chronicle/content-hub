    Tests connectivity to the Falcon Sandbox API. This action verifies that the integration
    is configured correctly and can successfully authenticate with the external service.


    ### Flow Description

    1. Retrieves the API Root and API Key from the integration configuration.

    2. Makes a GET request to the `/key/current` endpoint of the Falcon Sandbox API
    to validate the credentials and network connectivity.

    3. Returns a success message if the connection is established and the credentials
    are valid.


    ### Additional Notes

    This action does not interact with any entities or case data. It is strictly used
    for diagnostic and configuration verification purposes.
