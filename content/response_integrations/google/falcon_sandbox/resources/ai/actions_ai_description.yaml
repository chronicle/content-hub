Analyze File:
  ai_description: >-
    ### General Description

    Submits a file to Falcon Sandbox for analysis and retrieves the resulting threat
    report.


    ### Flow Description

    1. Initializes the Falcon Sandbox manager with API credentials.

    2. Submits the file specified by the `File Path` parameter to the specified `Environment`
    via a POST request to the Falcon Sandbox API.

    3. Monitors the analysis job status asynchronously.

    4. Once completed, retrieves the scan information and threat score.

    5. Attaches the JSON report to the action results.

    6. If `Include Report` is enabled, fetches and attaches the MISP report.


    ### Additional Notes

    The action runs asynchronously. Fetching the MISP report requires a premium API
    key.
  ai_short_description: >-
    Submits a file to Falcon Sandbox for analysis and retrieves the resulting threat
    report and score.
