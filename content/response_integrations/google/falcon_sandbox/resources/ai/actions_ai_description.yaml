Submit File:
  ai_description: >-
    ### General Description

    Submits one or more files to Falcon Sandbox for malware analysis.


    ### Flow Description

    1. Extracts the file paths and the target environment from the action parameters.

    2. Iterates over the provided file paths.

    3. Makes a POST request to the Falcon Sandbox API (`/submit/file`) for each file
    to initiate the analysis.

    4. Collects the resulting Job ID and SHA256 hash for each successfully submitted
    file.

    5. Returns the results as a JSON object and outputs a summary message.


    ### Additional Notes

    The action requires a valid API key and server address configured in the integration
    settings.
