Wait For Job and Fetch Report:
  ai_description: >-
    ### General Description

    Waits for a previously submitted scan job to complete in CrowdStrike Falcon Sandbox
    and fetches the corresponding analysis report.


    ### Flow Description

    1. Retrieves the provided Job IDs from the action parameters.

    2. Queries the Falcon Sandbox API to check the execution status of each job and
    any related child jobs.

    3. If any job is still in progress or in the queue, the action returns an in-progress
    status to be retried later (asynchronous execution).

    4. Once all jobs are completed, it fetches the scan summary reports for the successful
    jobs via the Falcon Sandbox API.

    5. It also attempts to download the MISP format report for each completed job
    and attaches it to the case.

    6. Returns the fetched reports as JSON results.


    ### Additional Notes

    This action is designed to run asynchronously. It will suspend and re-execute
    until the specified jobs have either completed successfully or failed.
