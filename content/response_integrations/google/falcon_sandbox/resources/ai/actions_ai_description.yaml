Get Hash Scan Report:
  ai_description: >-
    ### General Description

    Fetches hybrid analysis reports from Falcon Sandbox to enrich File Hash entities.
    This action retrieves threat intelligence, including threat scores, malware families,
    and other scan details, and updates the entity's properties. It also evaluates
    the threat score against a configured threshold to determine if the entity should
    be marked as suspicious.


    ### Flow Description

    1. Connects to the Falcon Sandbox API using the provided integration credentials.

    2. Iterates through the target entities, filtering for those of type `FILEHASH`.

    3. For each file hash, makes a GET request to the Falcon Sandbox API to fetch
    scan reports across multiple environments.

    4. Extracts relevant threat intelligence data (e.g., threat score, vx_family,
    verdict) from the reports.

    5. Updates the entity's additional properties with the extracted enrichment data.

    6. Attaches the JSON report and MISP report to the entity.

    7. Evaluates the maximum threat score against the configured threshold; if it
    exceeds or equals the threshold, marks the entity as suspicious.

    8. Marks the entity as enriched and updates it within the Google SecOps platform.


    ### Additional Notes

    The action relies on integration-level configurations for the API key, server
    address, and threat score threshold.
