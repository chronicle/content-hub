Scan URL:
  ai_description: >-
    ### General Description

    Submits URL and Hostname entities to CrowdStrike Falcon Sandbox for dynamic analysis
    and retrieves the resulting threat reports.


    ### Flow Description

    1. Iterates through the target entities and filters for URL and Hostname types.

    2. Submits each valid entity to Falcon Sandbox for analysis via a POST request
    to the `/submit/url` endpoint.

    3. Asynchronously polls the sandbox for job completion status using a GET request
    to the `/report/{job_id}/state` endpoint.

    4. Once the analysis is complete, fetches the scan summary and MISP report for
    each job.

    5. Evaluates the AV detection rate against the provided `Threshold`; if the score
    meets or exceeds the threshold, the entity is marked as suspicious and enriched,
    and an insight is created.

    6. Attaches the MISP report to the case and updates the entities in the platform.


    ### Additional Notes

    This is an asynchronous action that will continue to run in the background until
    all submitted jobs have completed or failed.
