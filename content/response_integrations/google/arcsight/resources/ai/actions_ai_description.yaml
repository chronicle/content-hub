Get Report:
  ai_description: >-
    ### General Description

    Retrieves and downloads a specific report from ArcSight based on its URI and dynamic
    parameters.


    ### Flow Description

    1. Extracts the report URI and any dynamic fields provided as parameters.

    2. Calls the ArcSight API (`/www/manager-service/rest/ReportService/getResourcesByNameSafely`)
    to get the report information by its URI.

    3. Generates a download token for the report using the report ID and dynamic parameters
    via the ArcSight API (`/www/manager-service/rest/ArchiveReportService/initDefaultArchiveReportDownloadWithOverwrite`).

    4. Downloads the report content from ArcSight via the API (`/www/manager-service/fileservlet`).

    5. If the report is in CSV format, it parses the content into a JSON object and
    a data table.

    6. Attaches the downloaded report to the action results.


    ### Additional Notes

    The action supports up to 9 dynamic fields (Field 2 to Field 10) to be passed
    to the report generation query.
  ai_short_description: >-
    Retrieves and downloads a specific report from ArcSight based on its URI, attaching
    the results to the case.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes requests to the ArcSight API to fetch report information, generate
      a download token, and download the report content. It does not mutate external
      data, update internal entities, or create insights.
  entity_usage:
    entity_types:
      address: false
