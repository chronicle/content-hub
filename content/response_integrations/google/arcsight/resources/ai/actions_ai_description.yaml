Add Entries To Activelist:
  ai_description: >-
    ### General Description

    Adds new entries to a specified active list in ArcSight. This action allows users
    to insert data into ArcSight active lists either by specifying columns and delimited
    values or by providing a JSON array of entries.


    ### Flow Description

    1. Extracts the provided parameters, including the active list UUID or name, and
    the entries to add.

    2. Parses the entries into a structured format based on whether they were provided
    as columns/values or as JSON.

    3. If an active list name is provided instead of a UUID, makes an API call to
    ArcSight to retrieve the corresponding UUID.

    4. Makes a POST request to the ArcSight API to add the parsed entries to the specified
    active list.

    5. Returns a success message if the entries were added successfully.


    ### Additional Notes

    The action requires either the 'Active List UUID' or 'Active list name' to identify
    the target list. Entries can be provided using the 'Columns' and 'Entries' parameters
    or as a JSON string in the 'Entries JSON' parameter.
