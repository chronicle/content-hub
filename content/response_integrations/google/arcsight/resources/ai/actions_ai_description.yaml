List Resources:
  ai_description: >-
    ### General Description

    Retrieves a list of available resources from ArcSight, including queries, active
    lists, cases, and reports. This action allows users to discover what resources
    are configured and available within the ArcSight environment for further use in
    playbooks or investigations.


    ### Flow Description

    1. Connects to the ArcSight API using the provided integration credentials.

    2. Evaluates the input parameters to determine which resource types (Active Lists,
    Queries, Cases, Reports) have been requested.

    3. If 'Return Queries' is enabled, makes API calls to fetch query resource IDs
    and their details.

    4. If 'Return Active Lists' is enabled, makes API calls to fetch active list resource
    IDs and their details.

    5. If 'Return Cases' is enabled, makes API calls to fetch case resource IDs and
    their details.

    6. If 'Return Reports' is enabled, makes API calls to fetch report resource IDs
    and their details, filtering out unsupported report UUID prefixes.

    7. Aggregates the retrieved data and outputs it as JSON results and CSV-formatted
    data tables.


    ### Additional Notes

    At least one of the 'Return ...' parameters must be enabled for the action to
    execute successfully. The 'Max Resources To Return' parameter limits the number
    of items fetched per resource type.
