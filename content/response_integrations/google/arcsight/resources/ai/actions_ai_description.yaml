    1. Initializes the connection to the ArcSight API using the provided credentials.

    2. If an `Active list name` is provided instead of an `Active list UUID`, makes
    an API call to resolve the name to its corresponding UUID.

    3. Makes an API call to retrieve the entries of the active list using its UUID,
    up to the specified `Max Entries To Return`.

    4. Formats the retrieved entries and attaches them to the action's results as
    a JSON object and a data table.


