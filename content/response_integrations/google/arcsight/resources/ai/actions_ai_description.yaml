  ai_description: >-
    ### General Description

    Tests connectivity to the Arcsight server to ensure the integration is configured
    correctly and can communicate with the target instance.


    ### Flow Description

    1. Retrieves integration configuration parameters such as API Root, Username,
    and Password.

    2. Initializes the ArcsightManager with the provided credentials.

    3. Attempts to authenticate to the Arcsight server by making an API call to the
    login endpoint.

    4. Makes an API call to log out of the Arcsight server.

    5. Returns a success message if the connection and authentication are successful,
    or an error message if they fail.


    ### Additional Notes

