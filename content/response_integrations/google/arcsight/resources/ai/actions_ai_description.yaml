Add Entities To Active List:
  ai_description: >-
    ### General Description

    Adds target entities to a specified active list in ArcSight. This action allows
    analysts to dynamically populate ArcSight active lists with entities from the
    current case, optionally including additional contextual fields.


    ### Flow Description

    1. Extracts the action parameters, including the target active list name, the
    column name for the entity, and any additional fields provided as a JSON string.

    2. Iterates over all target entities associated with the case.

    3. Makes an API call to ArcSight (`www/manager-service/rest/ActiveListService/getResourceByName`)
    to retrieve the UUID of the specified active list.

    4. Constructs a payload containing the entities and their corresponding additional
    fields.

    5. Makes a POST API call to ArcSight (`www/manager-service/rest/ActiveListService/addEntries`)
    to append the constructed entries to the active list.


    ### Additional Notes

    This action processes all target entities without filtering by specific entity
    types. Ensure that the 'Additional Fields' parameter is formatted as a valid JSON
    object if used.
  ai_short_description: >-
    Adds target entities to a specified active list in ArcSight.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the target entities to a specified active list in ArcSight.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to ArcSight to add entries to an active list,
      which mutates external data. It does not fetch contextual data, update internal
      entities, create insights, or modify alert data.
  entity_usage:
    entity_types:
      address: true
      alert: true
      application: true
      child_hash: true
      child_process: true
      cluster: true
      container: true
      credit_card: true
