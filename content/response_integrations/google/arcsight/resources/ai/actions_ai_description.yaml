Is Value In Activelist Column:
  ai_description: >-
    ### General Description

    Checks if the target entities exist within a specified column of an ArcSight Active
    List. If an entity is found in the list, it is enriched with a property indicating
    its presence, and the corresponding row data from the active list is returned
    as a JSON result.


    ### Flow Description

    1. Validates input parameters to ensure either an Active List UUID or Active List
    Name is provided.

    2. Authenticates with the ArcSight API.

    3. Retrieves the Active List UUID via an API call if only the Active List Name
    was provided.

    4. Fetches the entries of the specified Active List from ArcSight.

    5. Iterates through the target entities and checks if their original identifier
    matches any value in the specified column of the active list.

    6. Updates matching entities with an `IsInActivelist` property set to true.

    7. Returns the matching rows from the active list as JSON results.


    ### Additional Notes

    The action requires either the Active List UUID or the Active List Name to function.
    If both are provided, the UUID takes precedence.
