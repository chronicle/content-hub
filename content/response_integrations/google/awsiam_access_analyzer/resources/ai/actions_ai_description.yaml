Archive Finding:
  ai_description: >-
    ### General Description

    Archives a specific finding in AWS IAM Access Analyzer. This action changes the
    status of the specified finding to 'ARCHIVED' in the AWS environment, effectively
    removing it from active finding lists.


    ### Flow Description

    1. Initializes the AWS IAM Access Analyzer client using the provided AWS credentials
    and region.

    2. Makes an API call to AWS to retrieve the specified Analyzer's ARN.

    3. Makes an API call (`update_findings`) to AWS IAM Access Analyzer to update
    the status of the provided Finding ID to 'ARCHIVED'.

    4. Returns a success message if the finding is successfully archived, or an error
    message if the analyzer or finding is not found.


    ### Additional Notes

    Requires valid AWS credentials with permissions to access IAM Access Analyzer
    and update findings.
  ai_short_description: >-
    Archives a specific finding in AWS IAM Access Analyzer by changing its status
    to 'ARCHIVED'.
  capabilities:
    can_create_case_comments: false
