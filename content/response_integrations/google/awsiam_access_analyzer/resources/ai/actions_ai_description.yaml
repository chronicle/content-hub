Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the AWS IAM Access Analyzer service. This action verifies
    that the integration is configured correctly and can successfully authenticate
    and communicate with the AWS API.


    ### Flow Description

    1. Extracts the AWS Access Key ID, AWS Secret Key, AWS Default Region, and Analyzer
    Name from the integration configuration.

    2. Initializes the AWS IAM Access Analyzer manager with the provided credentials.

    3. Attempts to connect to the AWS IAM Access Analyzer service by retrieving the
    specified analyzer's details via the API.

    4. Returns a successful execution state if the connection is established, or a
    failed state if an error occurs.


    ### Additional Notes

    This action is primarily used for troubleshooting and verifying integration setup.
    It does not process alerts or entities.
