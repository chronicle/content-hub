    external_data_mutation_explanation: >-
      Updates the status of a specific finding to 'ARCHIVED' in AWS IAM Access Analyzer.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an API call to AWS IAM Access Analyzer to update the status
      of a finding to 'ARCHIVED'. This mutates external data. It does not fetch contextual
      data for enrichment, nor does it mutate internal SecOps data, update entities,
      or create insights.
