Scan Resources:
  ai_description: >-
    ### General Description

    Initiates a scan of specified AWS resources using AWS IAM Access Analyzer to analyze
    the policies applied to them and retrieves the analyzed details.


    ### Flow Description

    1. The action receives a comma-separated list of AWS Resource ARNs.

    2. It establishes a connection to the AWS IAM Access Analyzer service.

    3. It submits each resource for a scan using the `start_resource_scan` API.

    4. The action runs asynchronously, periodically checking the scan status of each
    resource using the `get_analyzed_resource` API.

    5. Once a resource scan is complete (indicated by the `analyzedAt` timestamp),
    it retrieves the analyzed resource details.

    6. The action completes when all resources are scanned or the maximum number of
    retries is reached, returning the analyzed details as JSON.


    ### Additional Notes

    This is an asynchronous action that will continue to run in the background until
    the scans are completed or the retry limit is reached.
  ai_short_description: >-
    Initiates a scan of specified AWS resources using AWS IAM Access Analyzer and
    retrieves the analyzed policy details.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
