Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Symantec Endpoint Protection 14 instance by attempting
    to authenticate and refresh the access token.


    ### Flow Description

    1. Retrieves integration configuration credentials (API Root, Client ID, Client
    Secret, Refresh Token).

    2. Initializes the Symantec Endpoint Protection manager.

    3. Makes an API call to the Symantec Endpoint Protection server to refresh the
    access token, verifying connectivity and authentication.

    4. Returns a success message if the connection and authentication are successful.


    ### Additional Notes

    This action is typically used as a diagnostic tool to verify that the integration
    is configured correctly and can successfully communicate with the Symantec Endpoint
    Protection API.
