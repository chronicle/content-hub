GetReport:
  ai_description: >-
    ### General Description

    Retrieves the status report of a previously executed command from Symantec Endpoint
    Protection (SEP) 12. This action allows analysts to check the progress or result
    of asynchronous operations, such as scans or quarantine commands, by providing
    the unique Command ID.


    ### Flow Description

    1. Extracts the `Command ID` parameter provided by the user or a previous playbook
    step.

    2. Authenticates and establishes a connection to the Symantec Endpoint Protection
    12 API.

    3. Makes a SOAP API call (`getCommandStatusDetails`) to the SEP Command Service
    to fetch the status details of the specified command.

    4. Parses the XML response from the server into a structured JSON format.

    5. Attaches the parsed report to the action's JSON result and completes the execution.


    ### Additional Notes

    This action does not operate on entities. It is typically used in conjunction
    with other SEP 12 actions that initiate commands (like running a scan or quarantining
    an endpoint) and return a Command ID.
  ai_short_description: >-
    Retrieves the status report of a previously executed command from Symantec Endpoint
    Protection (SEP) 12 using a specific Command ID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a SOAP API request (`getCommandStatusDetails`)
      to retrieve the status of a command. It does not mutate external data (it only
      reads status), nor does it mutate internal data, update entities, create insights,
      modify alert data, or create case comments.
