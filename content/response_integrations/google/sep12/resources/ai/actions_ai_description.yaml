UpdateEndpoint:
  ai_description: >-
    ### General Description

    Triggers a content update command on Symantec Endpoint Protection (SEP) clients
    associated with the target Hostname and IP Address entities. This action initiates
    a state change on the external SEP Manager to force the endpoints to update their
    definitions.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only IP Addresses and Hostnames.

    3. Queries the SEP Manager API to retrieve the unique Computer ID for each valid
    entity.

    4. If a Computer ID is found, sends a POST request to the SEP Manager API to execute
    the `runClientCommandUpdateContent` command on the endpoint.

    5. Updates the entity's additional properties within the SecOps platform with
    the returned command ID.


    ### Additional Notes

    The action updates the entities in the platform with the command ID for tracking
    purposes. If an entity cannot be found in the SEP Manager, it is skipped and an
    error is logged.
