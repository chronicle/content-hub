UpdateAndScanEndpoint:
  ai_description: >-
    ### General Description

    Triggers a full update and scan command on Symantec Endpoint Protection (SEP)
    12 clients associated with Hostname and IP Address entities. This action initiates
    a state change on the external endpoint to ensure its antivirus definitions are
    up-to-date and a full system scan is performed.


    ### Flow Description

    1. Iterates through the provided target entities.

    2. Checks if the entity type is an IP Address or Hostname.

    3. Makes a POST request to the SEP12 API (`getComputersByIP` or `getComputersByHostName`)
    to retrieve the internal computer ID for the entity.

    4. Makes a POST request to the SEP12 API (`runClientCommandUpdateContentAndScan`)
    to execute the 'Update_ScanNow_Full' command on the identified computer.

    5. Updates the entity's additional properties with the resulting command ID.


    ### Additional Notes

    The scan type is hardcoded to perform a full update and scan (`Update_ScanNow_Full`).
