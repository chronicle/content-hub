ScanEndpoint:
  ai_description: >-
    ### General Description

    Initiates a full malware scan on specified endpoint entities (IP Addresses and
    Hostnames) using Symantec Endpoint Protection 12 (SEP12). This action identifies
    the corresponding computer in SEP12 and triggers a scan command, storing the resulting
    command ID in the entity's additional properties.


    ### Flow Description

    1. Establishes a connection to the Symantec Endpoint Protection 12 API.

    2. Iterates through the target entities, filtering for `ADDRESS` and `HOSTNAME`
    entity types.

    3. For each suitable entity, queries the SEP12 API to retrieve the corresponding
    Computer ID based on the IP address or hostname.

    4. Triggers a `ScanNow_Full` command on the identified endpoint via a POST request
    to the SEP12 Command Service.

    5. Updates the entity's `additional_properties` with the returned command ID.

    6. Saves the updated entities back to the case.


    ### Additional Notes

    - The scan type is hardcoded to perform a full scan (`ScanNow_Full`).

    - If a hostname entity is not found initially, the action attempts to split the
    domain from the identifier and search again.
  ai_short_description: >-
    Initiates a full malware scan on specified IP Address and Hostname entities using
    Symantec Endpoint Protection 12.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: >-
      Triggers a malware scan command on the target endpoint via Symantec Endpoint
      Protection.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches the computer ID from SEP12 (fetches_data=true). It then makes
      a POST request to trigger a scan on the endpoint, which mutates external state
      by initiating a job on the endpoint (can_mutate_external_data=true). Finally,
      it updates the entities with the command ID (can_update_entities=true). It does
      not create insights, modify alert data, or create case comments.
