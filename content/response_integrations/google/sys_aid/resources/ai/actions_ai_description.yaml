    ### General Description

    Tests connectivity to the SysAid platform by attempting to authenticate using
    the configured credentials.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the SysAidManager, which automatically triggers an authentication
    attempt.

