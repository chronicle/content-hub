Close Service Request:
  ai_description: >-
    ### General Description

    Closes a specific service request in SysAid and provides a solution for it. This
    action initiates a state change on the external ITSM system to mark the ticket
    as closed.


    ### Flow Description

    1. Initializes the SysAid API client using the provided integration configuration.

    2. Retrieves the `Service Request ID` and `Solution` from the action parameters.

    3. Makes a PUT request to the SysAid API (`/sr/{sr_id}/close`) to close the specified
    service request and append the provided solution.

    4. Returns a success message to the SecOps platform indicating the service request
    was successfully closed.


    ### Additional Notes

    Ensure that the provided Service Request ID exists in SysAid before executing
    this action.
  ai_short_description: >-
    Closes a specific service request in SysAid and provides a solution.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Closes a service request in the external SysAid ITSM system and appends a solution.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action performs a PUT request to the SysAid API to close a service request,
      which mutates external data. It does not fetch contextual data, mutate internal
      SecOps data, update entities, create insights, modify alert data, or create
      case comments.
