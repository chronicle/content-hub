Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Opswat Metadefender API to ensure the integration is
    configured correctly and can communicate with the service.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, API Key, Verify
    SSL).

    2. Makes an HTTP GET request to the Opswat Metadefender API key info endpoint
    (`/apikey`).

    3. Evaluates the HTTP response to determine if the connection was successful.

    4. Returns a success or failure message based on the response.


    ### Additional Notes

    This action does not require any action-specific parameters and does not operate
    on entities.
  ai_short_description: >-
    Tests connectivity to the Opswat Metadefender API to verify integration configuration.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
