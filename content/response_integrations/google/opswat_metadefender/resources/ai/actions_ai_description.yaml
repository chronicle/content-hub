    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the suspicious status of file hash entities and adds insights if they
      are found to be infected.
    reasoning: >-
      The action makes a GET request to the Opswat Metadefender API to fetch hash
      reputation data (fetches_data=true). It does not mutate external data. It updates
      internal entities and creates insights if the hash is found to be infected (can_mutate_internal_data=true,
      can_update_entities=true, can_create_insight=true).
