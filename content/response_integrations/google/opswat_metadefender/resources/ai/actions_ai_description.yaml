Scan Hash:
  ai_description: >-
    ### General Description

    Scans file hash entities in Opswat Metadefender to retrieve reputation and threat
    intelligence data.


    ### Flow Description

    1. Filters the target entities to include only File Hash entities.

    2. Iterates through the filtered entities and makes a GET request to the Opswat
    Metadefender API to fetch the hash reputation report.

    3. If the report indicates the hash is "Infected", the action marks the entity
    as suspicious, updates the entity in Google SecOps, and attaches an insight.

    4. Converts the scan results into a CSV format and attaches it as a data table
    to the action results.


    ### Additional Notes

    This action relies on the Opswat Metadefender integration configuration for API
    access.
  ai_short_description: >-
    Scans file hash entities in Opswat Metadefender to retrieve reputation data, updating
    entity status and attaching insights for infected hashes.
  capabilities:
