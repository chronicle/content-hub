    Executes a custom SOQL query in BMC Helix Remedyforce to retrieve specific records
    or data.


    ### Flow Description

    1. Extracts the provided SOQL query from the action parameters.

    2. Initializes the BMC Helix Remedyforce API client using the configured credentials.

    3. Sends an HTTP GET request to the BMC Helix Remedyforce API (`/services/data/v51.0/query/`)
    to execute the query.

    4. Parses the returned records and attaches them to the action result as a JSON
    object and a CSV-formatted data table.


