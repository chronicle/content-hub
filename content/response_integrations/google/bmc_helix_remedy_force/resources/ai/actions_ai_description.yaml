Wait For Fields Update:
  ai_description: >-
    ### General Description

    Waits for specific fields of a record in BMC Helix Remedyforce to be updated to
    expected values. This is an asynchronous action that periodically checks the record's
    state until the specified fields match the provided JSON payload or the action
    times out.


    ### Flow Description

    1. On the first run, the action fetches the specified record from BMC Helix Remedyforce
    to verify its existence and ensures that the fields provided in the `Fields To
    Check` parameter exist on the record.

    2. The action then enters an asynchronous loop, periodically fetching the record
    details via a GET request to the BMC Helix Remedyforce API.

    3. During each check, it compares the current values of the specified fields against
    the expected values.

    4. If all fields match the expected values, the action completes successfully
    and returns the record details as a JSON result.

    5. If the timeout approaches and the fields have not been updated, the action
    will fail if `Fail If Timeout` is enabled, or complete with a failure status.


    ### Additional Notes

    The `Fields To Check` parameter must be a valid JSON object where keys are field
    names and values are the expected values.
