Create Record:
  ai_description: >-
    ### General Description

    Creates a new record of a specified type in BMC Helix Remedyforce.


    ### Flow Description

    1. Validates the provided `Record Payload` to ensure it is a valid JSON string.

    2. Authenticates with the BMC Helix Remedyforce API.

    3. Makes a POST request to the `/services/data/v51.0/sobjects/{record_type}` endpoint
    to create the record with the provided payload.

    4. Returns the created record details as a JSON result.


    ### Additional Notes

    The `Record Payload` must be a valid JSON string containing the required fields
    for the specified record type. If you are unsure of the available record types,
    use the "List Record Types" action.
  ai_short_description: >-
    Creates a new record of a specified type in BMC Helix Remedyforce.
