    code. This token is required for configuring the integration's authentication
    and ensuring continuous access to the API.


    ### Flow Description

    1. Retrieves the Redirect URL and Authorization Code from the action parameters.

    2. Makes a POST request to the BMC Helix Remedyforce OAuth endpoint (`/services/oauth2/token`)
    to exchange the authorization code for a refresh token.

    3. Returns the generated token and associated authentication details in the action's
    JSON result.


    ### Additional Notes

    The authorization code must be generated prior to running this action, typically
    by using the "Get OAuth Authorization Code" action or manually via the BMC Helix
