Delete Record:
  ai_description: >-
    ### General Description

    Deletes a specific record in BMC Helix Remedyforce based on the provided record
    type and record ID. This action initiates a state change on the external system
    to permanently remove the specified record.


    ### Flow Description

    1. Extracts the `Record Type` and `Record ID` parameters from the action configuration.

    2. Initializes the BMC Helix Remedyforce API client using the provided integration
    credentials.

    3. Makes an HTTP DELETE request to the `/services/data/v51.0/sobjects/{record_type}/{record_id}`
    endpoint to delete the specified record.

    4. Returns a success message if the deletion is successful, or an error message
    if the record or record type is not found.


    ### Additional Notes

    Ensure that the provided credentials have the necessary permissions to delete
    records of the specified type in BMC Helix Remedyforce.
