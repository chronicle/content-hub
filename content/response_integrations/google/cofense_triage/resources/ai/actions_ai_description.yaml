Categorize Report:
  ai_description: >-
    ### General Description

    Categorizes a specific report in Cofense Triage by applying a specified category
    name.


    ### Flow Description

    1. Retrieves the category ID for the provided category name from Cofense Triage
    via a GET request.

    2. If the category is found, sends a POST request to categorize the report with
    the specified ID.

    3. Fetches the updated report details via a GET request.

    4. Returns the updated report as a JSON result.


    ### Additional Notes

    If the category name is not found in Cofense Triage, the action will fail.
