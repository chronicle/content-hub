Add Tags To Report:
  ai_description: >-
    ### General Description

    Adds specified tags to a report in Cofense Triage.


    ### Flow Description

    1. Retrieves the current tags of the specified report from Cofense Triage via
    an API request.

    2. Merges the existing tags with the new tags provided in the input parameters.

    3. Sends a PUT request to Cofense Triage to update the report with the combined
    list of tags.

    4. Retrieves the updated report details and returns them as a JSON result.


    ### Additional Notes

    None.
  ai_short_description: >-
    Adds specified tags to a report in Cofense Triage.
