EnrichURL:
  ai_description: >-
    ### General Description

    Enriches URL entities using Cofense Triage. This action retrieves information
    about the URL, including its risk score and related attributes, to provide additional
    context for investigation.


    ### Flow Description

    1. Filters the target entities to include only those of type URL.

    2. Iterates over the filtered entities and makes a GET request to the Cofense
    Triage API (`/api/public/v2/urls`) to fetch details for each URL.

    3. Evaluates the retrieved risk score against the provided `Risk Score Threshold`.
    If the score exceeds the threshold, the entity is marked as suspicious.

    4. Marks the entity as enriched and updates its additional properties with the
    retrieved data.

    5. Updates the entities in the Google SecOps platform and attaches the results
    as JSON and a table.


    ### Additional Notes

    The `Risk Score Threshold` must be between 0 and 100. If an invalid threshold
    is provided, a default value of 50 is used.
  ai_short_description: >-
    Enriches URL entities by retrieving risk scores and related details from Cofense
    Triage, updating the entities' properties and suspicious status based on a configurable
    threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Cofense Triage API to fetch URL details
      (fetches_data=true). It does not mutate external data. It updates the internal
      entities with the fetched data and marks them as suspicious if the risk score
      exceeds the threshold (can_update_entities=true). It does not create insights,
      modify alert data, or create case comments.
