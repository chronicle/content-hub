Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cofense Triage instance using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts the integration configuration parameters (API Root, Client ID, Client
    Secret, Verify SSL).

    2. Initializes the Cofense Triage manager.

    3. Makes an API call (GET request) to the system status endpoint (`/api/public/v2/system/status`)
    to verify connectivity.

    4. Returns a success message if the connection is established, otherwise returns
    an error.


    ### Additional Notes

