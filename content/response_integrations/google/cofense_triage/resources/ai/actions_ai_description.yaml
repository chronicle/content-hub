"List Reports Related To Threat Indicators":
  ai_description: >-
    ### General Description

    Lists reports related to threat indicators in Cofense Triage based on the provided
    entities.


    ### Flow Description

    1. Extracts the identifiers from all target entities in the case.

    2. Makes a GET request to the Cofense Triage API to retrieve threat indicator
    IDs that match the entity identifiers.

    3. For each retrieved threat indicator ID, makes additional GET requests to fetch
    the associated reports.

    4. Aggregates the related reports and returns them as JSON results.

    5. Optionally creates a case wall table containing the report details if configured
    to do so.


