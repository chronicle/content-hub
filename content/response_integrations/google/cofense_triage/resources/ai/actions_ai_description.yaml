    external_data_mutation_explanation: >-
      Updates the tags of a specific report in Cofense Triage.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches the current tags of a report, mutates external data by sending
      a PUT request to update the report's tags in Cofense Triage, and fetches the
      updated report. It does not mutate internal SecOps data, update entities, create
      insights, modify alert data, or create case comments.
