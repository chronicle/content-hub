Download Report Email:
  ai_description: >-
    ### General Description

    Downloads the raw email associated with a specific report from Cofense Triage
    and saves it to a specified local folder. It can also optionally create a case
    insight containing the raw email content.


    ### Flow Description

    1. Retrieves the `Report ID` and `Download Folder` parameters.

    2. Checks if the target file already exists in the specified folder and whether
    overwriting is permitted.

    3. Makes a GET request to the Cofense Triage API (`/api/public/v2/reports/{report_id}/download`)
    to retrieve the raw email content.

    4. Saves the downloaded email content as an `.eml` file in the specified local
    folder.

    5. If the `Create Insight` parameter is enabled, creates a case insight containing
    the transformed HTML content of the raw email.

    6. Returns the absolute file path of the downloaded file in the JSON results.


    ### Additional Notes

    - The downloaded file name is automatically constructed using the Report ID (e.g.,
    `{report_id}.eml`).

    - Ensure the specified download folder path exists and is accessible by the execution
    environment.
  ai_short_description: >-
    Downloads the raw email associated with a specific report from Cofense Triage
    and saves it to a specified local folder, optionally creating a case insight with
    the email content.
