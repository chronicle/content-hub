Update an ACL entry on Bucket:
  ai_description: >-
    ### General Description

    Updates an Access Control List (ACL) entry for a specified entity on a Google
    Cloud Storage bucket. This action modifies the permissions of a user, group, or
    special identifier (like allUsers) on the target bucket.


    ### Flow Description

    1. Initializes the Google Cloud Storage client using the provided integration
    configuration.

    2. Makes an API call to fetch the current Access Control List (ACL) for the specified
    bucket.

    3. Evaluates the current roles assigned to the specified entity to determine if
    an update is necessary (e.g., if the requested role is different or provides higher
    privileges).

    4. If an update is needed, revokes the existing roles for the entity within the
    ACL object.

    5. Grants the new requested role to the entity within the ACL object.

    6. Makes an API call to save the updated ACL back to the Google Cloud Storage
    bucket.


    ### Additional Notes

    The `Entity` parameter must follow specific Google Cloud Storage formatting conventions,
    such as `user-userId`, `user-emailAddress`, `group-groupId`, `group-emailAddress`,
    `allUsers`, or `allAuthenticatedUsers`.
