Download an Object From a Bucket:
  ai_description: >-
    ### General Description

    Downloads a specific object (file) from a Google Cloud Storage bucket to a specified
    local directory on the SOAR host.


    ### Flow Description

    1. Initializes the Google Cloud Storage client using the provided integration
    credentials.

    2. Fetches the specified bucket using the `Bucket Name` parameter via the Google
    Cloud Storage API.

    3. Retrieves the blob (object) metadata from the bucket using the `Object Name`
    parameter.

    4. Validates that the local `Download Path` exists and is a valid directory.

    5. Downloads the object to the local path using the `download_blob_to_file` API
    method.

    6. Returns the downloaded file details (object name and local path) as a JSON
    result.


    ### Additional Notes

    Ensure the SOAR host has write permissions to the specified download path. If
    the object is stored inside folders in the bucket, the `Object Name` should include
    the inner folder path (e.g., `folder/object_name`).
  ai_short_description: >-
    Downloads a specific object from a Google Cloud Storage bucket to a local directory
    on the SOAR host.
