  ai_description: >-
    ### General Description

    Removes public access from a specified Google Cloud Storage bucket. This action
    modifies the bucket's IAM policy to remove public access principals (such as `allUsers`
    and `allAuthenticatedUsers`) and can optionally enforce public access prevention
    on the bucket configuration.


    ### Flow Description

    1. Extracts and validates the provided parameters, including the bucket's resource
    name and the option to prevent public access.

    2. Initializes the Google Cloud Storage manager with the provided credentials.

    3. Retrieves the specified bucket object from Google Cloud Storage via an API
    call.

    4. Modifies the bucket's IAM policy to remove public access principals.

    5. If the 'Prevent Public Access From Bucket' parameter is enabled, makes an API
    call to update the bucket's configuration to enforce public access prevention.

    6. Returns a success message upon completion.


    ### Additional Notes

    Ensure the provided service account or workload identity has the necessary permissions
    to modify IAM policies and bucket configurations in Google Cloud Storage.
