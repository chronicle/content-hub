"Get a Bucket\u2019s Access Control List":
  ai_description: >-
    ### General Description

    Retrieves the access control list (ACL) for specified Google Cloud Storage buckets.
    This action connects to Google Cloud Storage to fetch the permissions and roles
    assigned to the requested buckets, returning the data as a structured JSON result.


    ### Flow Description

    1. Extracts the comma-separated list of bucket names provided in the input parameters.

    2. Iterates through each bucket name and makes an API call to Google Cloud Storage
    (`client.get_bucket`) to fetch the bucket's details and ACLs.

    3. Parses the retrieved ACL data into a structured format.

    4. Aggregates the results and attaches them to the action's JSON result.

    5. Outputs a summary message detailing which buckets were successfully queried,
    which were not found, and which failed due to uniform bucket-level access restrictions.


    ### Additional Notes

    - If a bucket has uniform bucket-level access enabled, legacy ACLs cannot be retrieved.
    The action will catch this error and report it in the output message without failing
    the entire execution.

    - Ensure the provided Service Account or Workload Identity has the necessary permissions
    (`roles/storage.admin` or equivalent) to read bucket ACLs.
  ai_short_description: >-
    Retrieves the access control list (ACL) for specified Google Cloud Storage buckets
    and returns the permissions data as a JSON result.
