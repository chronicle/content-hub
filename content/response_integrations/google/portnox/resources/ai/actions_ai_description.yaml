Get User History:
  ai_description: >-
    ### General Description

    Retrieves the user authentication history for specific devices from Portnox. This
    action queries Portnox for devices matching the provided IP or MAC addresses and
    fetches their authentication logs, attaching the results as a table to the respective
    entities.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters entities to process only those of type IP Address or MAC Address.

    3. Makes an API call to Portnox (`POST /devices`) to search for the device using
    the entity's identifier (IP or MAC).

    4. If a matching device is found, makes another API call (`GET /devices/{device_id}/details/userHistory`)
    to retrieve the user authentication history for that device.

    5. Constructs a CSV table containing the user history and attaches it to the entity
    in the SecOps platform.

    6. Updates the successfully processed entities to save the attached tables.


