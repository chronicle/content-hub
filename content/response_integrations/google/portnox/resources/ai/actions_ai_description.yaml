Revalidate Device:
  ai_description: >-
    ### General Description

    Triggers a device policy revalidation process on the Portnox NAC for a specific
    device. This action forces the network access control system to re-evaluate the
    device's compliance and authorization status.


    ### Flow Description

    1. Retrieves the `DeviceId` from the action parameters.

    2. Sends a POST request to the Portnox API (`/devices/actions/revalidation`) to
    initiate the revalidation process for the specified device.

    3. Polls the Portnox API using GET requests (`/devices/{deviceId}`) to monitor
    the device's security status.

    4. Waits until the device's status changes to `AuthorizationPassed` or until the
    timeout is reached.

    5. Returns a success message and a boolean result indicating the revalidation
    completed.


    ### Additional Notes

    This action is synchronous and will block execution while polling the Portnox
    API until the revalidation process completes or times out.
