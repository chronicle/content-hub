Enrich Device:
  ai_description: >-
    ### General Description

    Enriches IP Address and MAC Address entities by retrieving associated device information
    from Portnox. This action queries the Portnox network access control (NAC) system
    to find matching devices and appends the retrieved contextual metadata to the
    entities within the Google SecOps platform.


    ### Flow Description

    1. Iterates over all target entities provided in the case.

    2. Filters the entities to process only those of type `ADDRESS` (IP) or `MACADDRESS`.

    3. Makes an API call (POST request to `/devices` with a search query payload)
    to Portnox to search for the device using the entity's identifier.

    4. If a matching device is found, the action flattens the device dictionary, prefixes
    the keys with "Portnox", and appends this data to the entity's `additional_properties`.

    5. Marks the successfully processed entities as enriched (`is_enriched = True`).

    6. Updates the modified entities in the Google SecOps platform via the `update_entities`
    method.


    ### Additional Notes

    - If multiple devices match the search query in Portnox, only the first returned
    device is used for enrichment.

    - Entities that are not IP addresses or MAC addresses are ignored.
  ai_short_description: >-
    Enriches IP Address and MAC Address entities by retrieving associated device information
    from Portnox and appending it to the entities' additional properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by querying Portnox for device information. It does
      not mutate external data (the POST request is a search query, not a state change).
      It updates internal entities by appending the retrieved data to the entities'
      additional properties and calling `siemplify.update_entities`. It does not create
      insights, modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
