Get Device History:
  ai_description: >-
    ### General Description

    Retrieves the device history for specific IP and MAC address entities from Portnox.
    This action helps analysts understand the historical activity and authentication
    events of a device over a specified period.


    ### Flow Description

    1. Calculates the time range based on the provided `Days Backwards` parameter.

    2. Iterates through the target entities, filtering specifically for IP Address
    and MAC Address types.

    3. Makes an API call to Portnox to search for the device associated with the entity's
    identifier.

    4. If a device is found, makes another API call to retrieve its history within
    the calculated time range.

    5. Constructs a CSV table of the retrieved history and attaches it to the entity
    in the SecOps platform.

    6. Updates the enriched entities in the case.


    ### Additional Notes

    Only entities of type Address (IP) and MacAddress are processed by this action.
