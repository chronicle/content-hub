Get Device Locations:
  ai_description: >-
    ### General Description

    Retrieves the locations of a device from Portnox based on its IP or MAC address.
    This action queries Portnox for device details and extracts location information,
    attaching the results to the corresponding entity in Google SecOps.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters entities to process only IP Addresses (`ADDRESS`) and MAC Addresses
    (`MACADDRESS`).

    3. For each valid entity, makes a POST request to the Portnox `/devices` endpoint
    to search for the device by its IP or MAC address.

    4. If a device is found, extracts its ID and makes a GET request to the Portnox
    `/locations` endpoint to retrieve the device's locations.

    5. Formats the retrieved location data into a CSV table and attaches it to the
    entity as an entity table.

    6. Updates the enriched entities within the Google SecOps platform.


    ### Additional Notes

    Entities that are not IP or MAC addresses, or devices that cannot be found in
    Portnox, will be skipped.
