WhoIs Address Reputation:
  ai_description: >-
    ### General Description

    Requests address reputation and DNS reports from RiskIQ (PassiveTotal) to enrich
    external IP address entities. This action retrieves passive DNS data and updates
    the entities within Google SecOps with the resolution history.


    ### Flow Description

    1. Filters the target entities to include only external IP addresses (`ADDRESS`
    entity type where `is_internal` is false).

    2. Iterates through the filtered entities and makes an API call to RiskIQ (PassiveTotal)
    to fetch the DNS report for each IP address.

    3. Parses the retrieved DNS report into dictionary and CSV formats.

    4. Enriches the entity's `additional_properties` with the parsed dictionary data.

    5. Attaches the CSV data as an entity table in the action results.

    6. Updates the entities within Google SecOps with the new properties.

    7. Returns the raw JSON results and a summary message indicating which entities
    were enriched.


    ### Additional Notes

    - This action requires valid RiskIQ (PassiveTotal) credentials configured in the
    integration settings.
