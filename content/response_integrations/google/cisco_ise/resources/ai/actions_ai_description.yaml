Add Endpoint To Endpoint Identity Group:
  ai_description: >-
    ### General Description

    Adds a specified endpoint (IP Address or MAC Address) to an endpoint identity
    group in Cisco ISE. This action modifies the endpoint's group membership within
    the Cisco ISE platform.


    ### Flow Description

    1. Connects to the Cisco ISE API using the provided credentials.

    2. Retrieves the endpoint identity group ID based on the provided `Endpoint Identity
    Group Name`.

    3. Iterates through the target entities (IP Address and MAC Address).

    4. If the entity is an IP address, it resolves the corresponding MAC address via
    the Cisco ISE UI API.

    5. Retrieves the endpoint ID from Cisco ISE by matching the MAC address against
    the list of endpoints.

    6. Makes a PUT request to the Cisco ISE API to update the endpoint's group ID,
    effectively adding it to the target identity group.

    7. Returns the JSON results of the successfully updated endpoints.


    ### Additional Notes

    Supported entity types are IP Address and MAC Address.
  ai_short_description: >-
    Adds a specified endpoint (IP Address or MAC Address) to an endpoint identity
    group in Cisco ISE by updating the endpoint's group ID via the Cisco ISE API.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the endpoint's group ID in Cisco ISE to add it to the specified endpoint
      identity group.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data (endpoint groups, MAC addresses, and endpoints) to resolve
      the necessary IDs. It then mutates external data by making a PUT request to
      Cisco ISE to update the endpoint's group ID. It does not mutate internal SecOps
      data, update entities, or create insights.
