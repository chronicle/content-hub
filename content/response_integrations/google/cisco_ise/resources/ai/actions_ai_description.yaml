Quarantine Address:
  ai_description: >-
    ### General Description

    Quarantines an endpoint by its IP address using Cisco ISE. This action retrieves
    the MAC address associated with the IP address and applies a specified quarantine
    policy to restrict the endpoint's network access.


    ### Flow Description

    1. Iterates over all target entities of type Address.

    2. For each IP address, makes an HTTP GET request to the Cisco ISE UI API to resolve
    the corresponding MAC address.

    3. Makes an HTTP PUT request to the Cisco ISE API to apply the specified quarantine
    policy to the endpoint using its MAC address.

    4. Aggregates the results and returns a summary message indicating which IP addresses
    were successfully quarantined.


