  ai_description: >-
    ### General Description

    Enriches IP Address entities using Cisco ISE. This action retrieves endpoint contextual
    metadata, such as the MAC address and other endpoint details, from Cisco ISE to
    provide better visibility into the asset associated with the IP address.


    ### Flow Description

    1. Filters the target entities to include only IP Address entities.

    2. For each IP address, makes an API call to Cisco ISE to retrieve the associated
    MAC address.

    3. Makes a subsequent API call to fetch the endpoint data using the retrieved
    MAC address.

    4. Makes a third API call to fetch additional endpoint enrichment data.

    5. Flattens the retrieved data, attaches it to the entity as a table, and updates
    the entity's additional properties.

