    Changes the Organizational Unit (OU) of a Hostname entity within Active Directory.
    This action modifies the distinguished name (DN) of the host object to move it
    to the specified OU.


    ### Flow Description

    1. Extracts the target OU name from the action parameters.

    2. Iterates over target Hostname entities provided in the case.

    3. Queries Active Directory to locate the host object and the target OU object.

    4. Modifies the distinguished name (DN) of the host via an LDAP `modify_dn` request
    to move it under the new OU.

    5. Returns a success message listing the successfully processed entities.


