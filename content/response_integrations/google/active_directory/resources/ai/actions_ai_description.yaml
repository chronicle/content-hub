Add User To Group:
  ai_description: >-
    ### General Description

    Adds specified user entities to one or more Active Directory groups. This action
    modifies the group membership of the target users within the Active Directory
    environment.


    ### Flow Description

    1. Initializes the Active Directory manager with the provided credentials and
    server details.

    2. Parses the comma-separated list of target group names provided in the parameters.

    3. Iterates through the target entities, filtering specifically for `User` entities.

    4. For each user, queries Active Directory to locate the user and the target groups.

    5. Modifies the Active Directory group by adding the user's distinguished name
    (DN) to the group's `member` attribute via an LDAP modify operation.

    6. Collects the results and outputs a summary message indicating successful additions,
    users already in the group, and any failures.


    ### Additional Notes

    The action requires sufficient access rights in Active Directory to modify group
    memberships. If a user or group is not found, or if permissions are insufficient,
    the action will log the error and continue processing other entities or groups.
  ai_short_description: >-
    Adds specified user entities to one or more Active Directory groups by modifying
    the group's member attribute.
