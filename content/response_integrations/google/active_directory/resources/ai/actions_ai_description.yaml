    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the specified user entities to the provided Active Directory groups.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action modifies external data by adding users to groups in Active Directory
      via LDAP modify operations. It does not fetch data for enrichment, update internal
