Release Locked Account:
  ai_description: >-
    ### General Description

    Releases a locked user account in Active Directory. This action restores authentication
    capabilities for users who have been locked out due to too many failed login attempts
    or other policies.


    ### Flow Description

    1. Iterates over the target User entities provided in the case or alert.

    2. For each User entity, queries Active Directory to retrieve the user's Distinguished
    Name (DN).

    3. Sends an LDAP modify request to Active Directory to reset the `lockoutTime`
    attribute to `0`, effectively unlocking the account.

    4. Collects the results and returns a summary message detailing which accounts
    were successfully unlocked and which failed.


    ### Additional Notes

    - The integration account must have sufficient privileges in Active Directory
    to modify user attributes, specifically the `lockoutTime` attribute.

    - This action only processes entities of type `USER`.
