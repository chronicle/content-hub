    ### General Description

    Enriches Hostname and User entities with Active Directory properties. This action
    retrieves detailed attributes for users and hosts from an Active Directory server
    and updates the corresponding entities within the platform.


    ### Flow Description

    1. Iterates over the target entities and filters for those of type `USER` or `HOSTNAME`.

    2. For each valid entity, makes an LDAP query to the Active Directory server to
    fetch the user or host attributes.

    3. If specific attribute names are provided in the parameters, filters the retrieved
    data to include only those attributes.

