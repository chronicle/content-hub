[project]
name = "mandiant_managed_defense"
version = "6.0"
description = "Mandiant Managed Defense provides 24/7 managed detection and response (MDR) with access to frontline experts who monitor your security technology to help find and investigate threats, proactively hunt for ongoing or past breaches, and respond before attacks impact your business."
requires-python = ">=3.11,<3.12"
dependencies = [ "environmentcommon", "requests==2.32.4", "tipcommon",]

[dependency-groups]
dev = [ "pytest>=9.1.1", "pytest-json-report>=1.5.0", "pytest-mock", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.1.9.0-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"
