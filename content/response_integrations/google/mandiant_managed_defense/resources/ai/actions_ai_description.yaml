Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the Mandiant Managed Defense (MD) platform using the
    provided integration configuration parameters. This action ensures that the API
    Root, Client ID, and Client Secret are valid and that the Google SecOps environment
    can successfully communicate with Mandiant's API.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves the integration-level configuration parameters
    required for authentication and API communication.

    2. **Authentication**: Generates an OAuth2 access token by sending a POST request
    to the Mandiant token endpoint (`/token`) using the provided Client ID and Client
    Secret.

    3. **Connectivity Test**: Executes a GET request to the investigations endpoint
    (`/investigations`) to verify that the authenticated session can successfully
    retrieve data from the platform.

    4. **Result Reporting**: Returns a success message if the request is successful,
    or raises an exception with an error message if authentication or the API call
    fails.


    ### Additional Notes

    This action does not require any action-specific parameters and does not operate
    on entities. It is strictly used as a diagnostic tool to verify integration health.
  ai_short_description: >-
    Tests the connectivity to the Mandiant Managed Defense (MD) platform to ensure
    valid configuration and successful API communication.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Mandiant MD API to verify connectivity.
      It does not fetch contextual data for alerts/entities, does not mutate external
      data, and does not update internal SecOps data such as entities, insights, or
      case comments.
