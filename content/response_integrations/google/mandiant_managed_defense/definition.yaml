identifier: MandiantManagedDefense
name: Mandiant Managed Defense
parameters:
-   name: API Root
    default_value: https://api.services.mandiant.com
    type: string
    description: API root of the Mandiant instance.
    is_mandatory: true
    integration_identifier: MandiantManagedDefense
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID of the Mandiant Managed Defense account.
    is_mandatory: true
    integration_identifier: MandiantManagedDefense
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret of the Mandiant Managed Defense account.
    is_mandatory: true
    integration_identifier: MandiantManagedDefense
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Mandiant server is valid.
    is_mandatory: true
    integration_identifier: MandiantManagedDefense
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/mandiant-managed-defense
categories:
- MDR
svg_logo_path: resources/logo.svg
image_path: resources/image.png
