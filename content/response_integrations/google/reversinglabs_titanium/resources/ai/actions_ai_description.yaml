Ping:
  ai_description: >-
    ### General Description

    The Ping action is a diagnostic tool used to verify the connectivity between Google
    SecOps and the ReversingLabs TitaniumCloud API. Its primary purpose is to ensure
    that the integration's configuration is valid and that the environment can successfully
    communicate with the ReversingLabs service.


    ### Flow Description

    1. Retrieves the connection details (API Root, Username, and Password) from the
    ReversingLabs TitaniumCloud integration settings.

    2. Initializes the `TitaniumCloudClient` using the retrieved credentials.

    3. Executes a test query by performing a single hash lookup (using a hardcoded
    MD5 hash) against the ReversingLabs `malware_presence` endpoint via an HTTP GET
    request.

    4. If the API call returns a successful response, the action reports a successful
    connection. If the call fails or the credentials are invalid, an exception is
    raised.


    ### Additional Notes

    This action does not require any input parameters and does not interact with case
    entities.
  ai_short_description: >-
    Verifies the connectivity between Google SecOps and the ReversingLabs TitaniumCloud
    API by performing a test query.
  capabilities:
