    1. Connects to the Redis server using the provided integration configuration (Server
    Address and Port).

    2. Retrieves the target list name from the action parameters.

    3. Executes a command (`llen` and `lindex` via the Redis client) to fetch all
    elements from the specified Redis list.

    4. Returns the retrieved list values as a JSON result and outputs the total number
