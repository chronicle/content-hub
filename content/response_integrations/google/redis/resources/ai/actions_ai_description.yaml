Add To List:
  ai_description: >-
    ### General Description

    Adds a specified value to the head of a Redis list. If the target list does not
    exist, it creates a new list. The action then retrieves and returns the updated
    list as a JSON result.


    ### Flow Description

    1. Connects to the Redis server using the provided integration configuration.

    2. Retrieves the target `List Name` and the `Value` to be added from the action
    parameters.

    3. Executes an `lpush` command via the Redis client to add the value to the head
    of the list.

    4. Retrieves all elements of the updated list using `llen` and `lindex` commands.

    5. Returns the updated list as a JSON result and completes the action.


    ### Additional Notes

    The value can be of various types (string, integer, dictionary, list, etc.), but
    it is stored and processed as a string in Redis.
  ai_short_description: >-
    Adds a specified value to the head of a Redis list, creating the list if it does
    not exist, and returns the updated list.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a new value to a specified list in the external Redis database.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by executing an `lpush` command to add a value
      to a Redis list. It does not fetch contextual enrichment data, nor does it mutate
