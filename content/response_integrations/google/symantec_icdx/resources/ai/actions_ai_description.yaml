Get Events Minutes Back:
  ai_description: >-
    ### General Description

    Searches for and retrieves events from Symantec ICDX based on a specified query
    and a time range defined in minutes back from the current time. The action allows
    filtering by specific fields and limiting the number of returned events.


    ### Flow Description

    1. Initializes the connection to Symantec ICDX using the provided API credentials.

    2. Retrieves the search query, limit, minutes back, and specific fields to return
    from the action parameters.

    3. Calculates the start time in milliseconds based on the 'Minutes Back' parameter.

    4. Makes a POST request to the Symantec ICDX search API endpoint (`/r3_epmp_i/dx/archives/search`)
    to find matching events.

    5. If events are found, they are added to the action's JSON result and formatted
    into a data table.


    ### Additional Notes

    If no fields are specified, all available fields for the events will be returned.
    The default limit is 10 events, and the default time range is 60 minutes back
    if not explicitly provided in the parameters.
  ai_short_description: >-
    Searches for and retrieves events from Symantec ICDX based on a specified query
    and a time range defined in minutes back from the current time.
