Get Event:
  ai_description: >-
    ### General Description

    Retrieves specific event data from Symantec ICDX based on a provided Event UUID.
    This action queries the Symantec ICDX archive to fetch the full details of a single
    event.


    ### Flow Description

    1. Retrieves the `Event UUID` parameter provided by the user or playbook.

    2. Initiates a POST request to the Symantec ICDX API (`/r3_epmp_i/dx/archives/search`)
    to query for the specific event ID.

    3. If the event is found, the action attaches the event data as a JSON result
    and creates a flat data table for the event.

    4. Returns a success message and a true result value if the event is found, or
    a failure message and a false result value if it is not found.


    ### Additional Notes

    Ensure that the provided Event UUID is valid and exists within the Symantec ICDX
    archives.
  ai_short_description: >-
    Retrieves specific event data from Symantec ICDX based on a provided Event UUID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
