    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes an API request to Symantec ICDX to fetch event data (fetches_data=true).
      It does not perform any state-changing operations on external systems (can_mutate_external_data=false)
      or internal systems (can_mutate_internal_data=false). It does not update entities,
      create insights, modify alert data, or create case comments.
