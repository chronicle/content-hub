Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Symantec ICDX platform.


    ### Flow Description

    1. Retrieves integration configuration parameters (API Root, API Token, Verify
    SSL).

    2. Initializes the Symantec ICDX manager.

    3. Sends a test request to the Symantec ICDX API to fetch a hardcoded event UUID.

    4. Validates the response to ensure successful authentication and connectivity.

    5. Returns a success message if the connection is established.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the Symantec ICDX API.
  ai_short_description: >-
    Tests connectivity to the Symantec ICDX platform by attempting to fetch a hardcoded
