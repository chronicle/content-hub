Change Zone:
  ai_description: >-
    ### General Description

    Modifies the zone assignments for endpoint devices in Cylance based on Hostname
    and IP Address entities. This action allows analysts to dynamically add or remove
    devices from specific Cylance zones for management or policy enforcement purposes.


    ### Flow Description

    1. Retrieves the 'Zones to Add' and 'Zones to Remove' parameters and parses them
    into lists.

    2. Iterates through the target entities, specifically filtering for Hostname and
    IP Address (ADDRESS) entities.

    3. For each matching entity, queries the Cylance API (via GET requests) to resolve
    the entity identifier to a Cylance device ID.

    4. Makes a PUT request to the Cylance API to update the device's zone configuration,
    applying the specified additions and removals.

    5. Compiles a list of successfully affected entities and returns a summary message
    detailing the applied zone changes.


    ### Additional Notes

    If an entity cannot be found in Cylance or if an error occurs during the zone
    update process, the action logs the error and continues processing the remaining
    entities.
