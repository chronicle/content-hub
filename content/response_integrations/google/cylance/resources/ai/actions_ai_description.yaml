    1. Iterates through the target entities provided in the case.

    2. Checks if the entity type is an IP Address or Hostname.

    3. Makes a GET request to the Cylance API to fetch device details by name or IP
    address.

    4. If device data is found, it flattens the data, adds a 'Cylance' prefix, and
    updates the entity's `additional_properties`.

    5. Marks the entity as enriched and updates it in the Google SecOps platform.

    6. Adds the raw device data to the action's JSON results.


