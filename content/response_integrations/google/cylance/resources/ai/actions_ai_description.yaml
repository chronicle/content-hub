Get Threat:
  ai_description: >-
    ### General Description

    Enriches File Hash entities using Cylance. This action retrieves threat intelligence
    data for the specified file hashes, evaluates the threat score against a provided
    threshold, and updates the entity's suspicious status and enrichment properties
    accordingly.


    ### Flow Description

    1. Iterates over the target entities and filters for File Hash entities.

    2. For each File Hash, makes a GET request to the Cylance API to retrieve threat
    details (using `/threats/v2/{hash}` for SHA256 or `/threats/v2` for MD5).

    3. If the threat's Cylance score exceeds the configured `Threshold`, marks the
    entity as suspicious.

    4. Enriches the entity's additional properties with the retrieved threat data.

    5. Updates the entities in the SecOps platform and returns the threat data as
    JSON results.


    ### Additional Notes

    Supports both SHA256 and MD5 hashes. For MD5 hashes, the action retrieves a list
    of threats and searches for a match, which may take longer than a direct SHA256
    lookup.
