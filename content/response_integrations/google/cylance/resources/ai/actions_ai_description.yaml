Add To Global List:
  ai_description: >-
    ### General Description

    Adds a file hash entity to a specified global list (GlobalSafe or GlobalQuarantine)
    in Cylance. This action allows analysts to classify a file hash as either known
    good or malicious across the Cylance environment.


    ### Flow Description

    1. Retrieves the target list type, category, and reason from the action parameters.

    2. Iterates over the target entities and filters for File Hash entities.

    3. For each valid file hash, makes a POST request to the Cylance API (`/globallists/v2`)
    to add the hash to the specified global list.

    4. Collects the results and outputs a summary message detailing which hashes were
    successfully added, which already existed in the list, and which failed.


    ### Additional Notes

    The action can be used to either allowlist (GlobalSafe) or blocklist (GlobalQuarantine)
    a file hash depending on the 'List Type' parameter provided.
  ai_short_description: >-
    Adds a file hash entity to a specified global list (GlobalSafe or GlobalQuarantine)
    in Cylance.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the specified file hash to a global list (GlobalSafe or GlobalQuarantine)
      in Cylance.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Cylance API to add a file hash to a global
      list, which mutates external data. It does not fetch enrichment data, update
      internal entities, create insights, modify alert data, or create case comments.
