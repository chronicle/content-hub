    Changes the policy of an endpoint (device) in Cylance to a specified existing
    policy based on Hostname or IP Address entities.


    ### Flow Description

    1. Iterates over the target entities provided in the case.

    2. Filters for entities of type `HOSTNAME` and `ADDRESS`.

    3. For each matching entity, queries the Cylance API to resolve the entity identifier
    to a Cylance device ID.

    4. Retrieves the policy ID corresponding to the provided `Policy Name` parameter.

    5. Sends a PUT request to the Cylance API to update the device's assigned policy.

    6. Outputs a summary message listing the entities that were successfully updated.


