    and Hostname entity types.

    3. For each valid entity, makes a GET request to the `/integrationServices/v3/device`
    API endpoint using the entity's identifier.

    4. If device data is found, extracts the information and enriches the entity's
    additional properties.

    5. Marks the entity as enriched and attaches the raw device data as a JSON result
    and an entity table.

    6. Updates the enriched entities within the Google SecOps platform.


