Create Policy:
  ai_description: >-
    ### General Description

    Creates a new policy in Carbon Black Defense using the provided policy details,
    name, description, and priority level. This action initiates a state change on
    the external Carbon Black Defense platform by configuring a new security policy.


    ### Flow Description

    1. Extracts the necessary configuration and action parameters, including the policy
    name, description, priority level, and details.

    2. Parses the 'Policy Details' parameter from a string into a valid JSON object.

    3. Establishes a connection to the Carbon Black Defense API.

    4. Makes a POST request to the `/integrationServices/v3/policy/` endpoint to create
    the new policy with the specified configuration.

    5. Retrieves the newly created Policy ID and returns it as the action's result.


    ### Additional Notes

    The 'Policy Details' parameter must be provided as a valid JSON string, otherwise
    the action will fail during the parsing stage.
