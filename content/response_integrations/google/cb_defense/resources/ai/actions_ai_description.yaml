    ### General Description

    Tests connectivity to the Carbon Black Defense API to ensure the integration is
    configured correctly and the service is reachable.


    ### Flow Description

    1. Extracts the API Root and API Key from the integration configuration.

    2. Initializes the Carbon Black Defense Manager.

    3. Makes a GET request to the `/integrationServices/v3/device` endpoint to verify
    authentication and network connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


