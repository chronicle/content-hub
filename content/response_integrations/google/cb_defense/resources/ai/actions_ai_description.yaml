Get Processes:
  ai_description: >-
    ### General Description

    Retrieves a list of processes running on a specific device (identified by IP address
    or hostname) within a given timeframe using Carbon Black Defense.


    ### Flow Description

    1. Initializes the connection to the Carbon Black Defense API using the provided
    integration configuration.

    2. Iterates over the target entities, specifically looking for IP Address and
    Hostname entity types.

    3. For each valid entity, makes a GET request to the Carbon Black Defense API
    (`/integrationServices/v3/process`) to fetch process telemetry associated with
    the entity's identifier and the specified timeframe.

    4. If processes are found, the raw data is added to the action's JSON results,
    and a CSV table containing the process details is attached to the entity in the
    action results.

    5. Skips unsupported entity types and reports on successful, missing, and failed
    entities.


