Change Policy:
  ai_description: >-
    ### General Description

    Changes the policy assigned to a device in Carbon Black Defense based on IP address
    or hostname entities. This action allows analysts to dynamically reassign endpoints
    to different security policies for remediation or management purposes.


    ### Flow Description

    1. Iterates over the target entities provided in the case.

    2. Filters the entities to process only IP Addresses (`ADDRESS`) and Hostnames
    (`HOSTNAME`).

    3. For each valid entity, makes a GET request to the Carbon Black Defense API
    to fetch the associated device data and retrieve the internal device ID.

    4. If a device is found, makes a state-changing API call to update the device's
    assigned policy to the one specified in the `Policy Name` parameter.

    5. Aggregates the results and returns a summary of successful, missing, and failed
    entity updates.


    ### Additional Notes

    The `Policy Name` provided must exactly match an existing policy in Carbon Black
    Defense. If no device is found for a given IP or hostname, the action will skip
    the entity and report it as missing.
  ai_short_description: >-
    Changes the policy assigned to a device in Carbon Black Defense based on IP address
    or hostname entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Updates the policy assigned to a specific device in Carbon Black Defense.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches device data from Carbon Black Defense to resolve the device
      ID (fetches_data=true). It then uses the device ID to update the device's policy
      in Carbon Black Defense (can_mutate_external_data=true). It does not modify
      internal SecOps data, update entities, create insights, modify alerts, or create
      case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
