Get Hash Report:
  ai_description: >-
    ### General Description

    Retrieves sample reports for File Hash entities (MD5 and SHA256) using Symantec
    Content Analysis. This action fetches threat intelligence data related to the
    hashes and enriches the entities within the platform.


    ### Flow Description

    1. Filters the target entities to include only those of type File Hash.

    2. Iterates through the filtered entities and makes a GET request to the Symantec
    Content Analysis API (`rapi/samples/basic`) to fetch sample reports for each hash.

    3. If a report is successfully retrieved, it attaches the report data as an entity
    table to the respective entity.

    4. Enriches the entity by updating its `additional_properties` with the retrieved
    report data.

    5. Updates the enriched entities in the Google SecOps platform.


    ### Additional Notes

    - The action supports both MD5 (32 characters) and SHA256 (64 characters) hash
    lengths. Hashes of other lengths will result in an error.
  ai_short_description: >-
    Retrieves sample reports for File Hash entities (MD5 and SHA256) using Symantec
    Content Analysis and enriches the entities with the results.
  capabilities:
