Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Symantec Content Analysis service to verify integration
    credentials and network access.


    ### Flow Description

    1. Initializes the Symantec Content Analysis manager using the provided integration
    configuration.

    2. Makes a GET request to the `/rapi/pattern_groups` endpoint to verify API access.

    3. Returns a success message if the connection is established, or a failure message
    otherwise.


    ### Additional Notes

    This action is typically used as a diagnostic tool to ensure the SOAR platform
    can successfully communicate with the Symantec Content Analysis API.
