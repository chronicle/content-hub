    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a GET request to the Symantec Content Analysis
      API to retrieve file samples. It does not mutate external data or internal platform
      data (other than entities). It updates entities by modifying their `additional_properties`
      and calling `siemplify.update_entities`. It does not create insights, modify
      alert data, or create case comments.
