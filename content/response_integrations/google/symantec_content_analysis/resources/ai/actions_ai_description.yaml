Submit File:
  ai_description: >-
    ### General Description

    Uploads a specified file to Symantec Content Analysis for scanning and retrieves
    its reputation score.


    ### Flow Description

    1. Retrieves the file path from the action parameters.

    2. Reads the file from the local file system.

    3. Makes a POST request to the Symantec Content Analysis API (`rapi/cas/scan`)
    to submit the file for analysis.

    4. Parses the API response to extract the file reputation score.

    5. Evaluates the score: if it is between 2 and 6, creates a "Suspicious" case
    insight; if between 7 and 10, creates a "Malicious" case insight.

    6. Returns the reputation score as the action result.


    ### Additional Notes

    The action requires a valid file path accessible by the SOAR platform.
  ai_short_description: >-
    Uploads a file to Symantec Content Analysis for scanning and retrieves its reputation
    score, creating case insights based on the severity of the result.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
