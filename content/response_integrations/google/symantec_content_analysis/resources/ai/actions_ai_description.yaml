    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads a file to the Symantec Content Analysis system for scanning.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to upload a file to Symantec Content Analysis
      (mutates external data by submitting a sample). It retrieves the reputation
      score (fetches data). It does not update entities, but it creates case insights
      based on the reputation score.
