    insight only for entities that exceeded the "Severity Threshold" and "Confidence
    Threshold". |
Get Related Associations:
  ai_description: >-
    ### General Description

    Retrieves related threat intelligence associations from Anomali ThreatStream for
    specific entities within a case. This action allows analysts to pivot from basic
    observables (IPs, URLs, Hashes, Emails) to higher-level threat constructs such
    as Campaigns, Actors, Malware, and TTPs. It provides a comprehensive view of the
    threat landscape associated with the indicators, including detailed metadata and
    top-level statistics for related IOCs.


    ### Flow Description

    1. Filters the case entities to find supported types: IP Addresses, URLs, File
    Hashes, and Emails.

    2. Queries Anomali ThreatStream to find the internal indicator IDs corresponding
    to the identified entities.

    3. For each enabled association type (e.g., Actors, Campaigns), fetches the IDs
    of related associations linked to the indicators.

    4. Enters an asynchronous loop to retrieve detailed metadata and IOC statistics
    (countries, types, sources, severities) for every discovered association.

    5. Adds a summary data table and raw JSON results to the case. If configured,
    creates new entities, adds case tags based on association names, and generates
    a detailed case insight.


    ### Additional Notes

    - This action runs asynchronously, meaning it will continue to process in the
    background until all association details are retrieved or the execution deadline
    is reached.

    - Email addresses are supported when provided as USER entities that match a standard
    email regex.

    - The action processes a maximum of 1000 IOCs related to an association to generate
    statistics.
  ai_short_description: >-
    Retrieves related threat intelligence associations (such as Campaigns, Actors,
    Malware, and TTPs) from Anomali ThreatStream for specific entities within a case.
