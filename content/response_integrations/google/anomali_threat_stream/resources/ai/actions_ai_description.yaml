Submit Observables:
  ai_description: >-
    ### General Description

    This action submits observables (IP addresses, URLs, File Hashes, and Email Addresses)
    to the Anomali ThreatStream platform. It allows security analysts to contribute
    intelligence to their organization's private repository or the public community.
    The action supports detailed configuration of the intelligence metadata, including
    classification, threat types, TLP levels, and sharing with specific Trusted Circles.
    After submission, the action polls the Anomali API to ensure the import session
    is approved and provides a direct link to the review page for each submitted entity.


    ### Flow Description

    1. Extracts integration configuration and action parameters.

    2. Filters the target entities to identify supported types (IP, URL, Hash, Email).

    3. For each valid entity, sends a POST request to Anomali's `/api/v2/intelligence/import/`
    endpoint with the specified metadata.

    4. Retrieves the import session ID and polls the `/api/v1/importsession/` endpoint
    until the job is approved or the action times out.

    5. Adds an entity-specific table containing a direct link to the Anomali review
    page and outputs a summary JSON of approved and excluded jobs.


    ### Additional Notes

    - Requires "Org admin", "Create Anomali Community Intel", and "Approve Intel"
    permissions in Anomali ThreatStream.

    - User entities are processed as email observables only if their identifier matches
    a standard email regex.
