Add IP To Group:
  ai_description: >-
    ### General Description

    Adds IP Address entities to a specified address group in FortiManager. This action
    creates a firewall address object for the IP if it does not already exist, and
    then appends it to the target address group to update security policies.


    ### Flow Description

    1. Initializes the FortiManager client and establishes a session.

    2. Filters the target entities to include only those of type `ADDRESS`.

    3. Locks the specified ADOM and starts a workflow session if workflow mode is
    enabled.

    4. Iterates over the filtered IP addresses.

    5. For each IP, checks if a corresponding firewall address object already exists
    in FortiManager via the API.

    6. If the address object does not exist, makes an API call to create a new address
    object for the IP.

    7. Makes an API call to add the address object to the specified address group.

    8. Submits, approves, and commits the workflow session changes, then unlocks the
    ADOM.


    ### Additional Notes

    This action runs asynchronously. Ensure the script timeout value in the IDE is
    adjusted as needed to accommodate the workflow session locks and commits.
  ai_short_description: >-
    Creates a firewall address object for IP Address entities and adds them to a specified
    address group in FortiManager.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a firewall address object for the IP and adds it to a specified address
      group in FortiManager.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes POST requests to FortiManager to create address objects and
      update address groups, which mutates external data. It does not fetch contextual
      enrichment data, update internal entities, or create insights.
