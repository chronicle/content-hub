Get Task Information:
  ai_description: >-
    ### General Description

    Retrieves detailed information about a specific task from FortiManager using its
    Task ID. This action is useful for checking the status, progress, or results of
    previously executed operations or scripts within the FortiManager environment.


    ### Flow Description

    1. Initializes the FortiManager client using the provided integration configuration.

    2. Retrieves the `Task ID` parameter provided by the user or previous playbook
    steps.

    3. Makes an HTTP GET request to the FortiManager API (`/task/task/{Task ID}`)
    to fetch the task details.

    4. If the task is found, the action flattens the returned JSON object, converts
    it to a CSV format, and attaches it as a data table to the action results.

    5. Returns a success message if the task information is found, or a failure message
    if it is not.


    ### Additional Notes

    - This action does not operate on entities.

    - The output data table provides a flattened view of the task object for easier
    parsing in subsequent playbook steps.
