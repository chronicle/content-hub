Remove URL From Url Filter:
  ai_description: >-
    ### General Description

    Removes a specific URL from a URL filter in FortiManager, effectively unblocking
    it. This action initiates a state change on the external device to restore network
    traffic to the specified URL entity.


    ### Flow Description

    1. Establishes a connection to the FortiManager API and locks the ADOM if workflow
    mode is enabled.

    2. Retrieves the URL filter ID based on the provided `Url Filter Name` and `ADOM
    Name`.

    3. Iterates through the target URL entities.

    4. Strips the 'http' or 'https' prefix from the URL identifier.

    5. Makes an API call to delete the URL record from the specified URL filter.

    6. Commits the changes and unlocks the ADOM.


    ### Additional Notes

    This action runs asynchronously. Ensure the script timeout value in the Chronicle
    SOAR IDE is adjusted as needed.
