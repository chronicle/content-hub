Add URL To Url Filter:
  ai_description: >-
    ### General Description

    Adds a new block record to a specified URL filter in FortiManager for URL entities.
    This action modifies the URL filter configuration to prevent access to the specified
    URLs.


    ### Flow Description

    1. Retrieves the `ADOM Name` and `Url Filter Name` from the action parameters.

    2. Iterates over the target entities, filtering for those of type URL.

    3. For each URL entity, fetches the URL filter ID using the provided URL filter
    name via a GET request to the FortiManager API.

    4. Adds the URL entity's identifier as a block record to the URL filter via a
    POST request to the FortiManager API.

    5. Returns a success message with the list of URLs successfully added to the filter.


    ### Additional Notes

    This action runs asynchronously. Ensure the script timeout value in the Chronicle
    SOAR IDE is adjusted as needed.
