Execute Script:
  ai_description: >-
    ### General Description

    Executes an existing script on a device or device group within Fortinet FortiManager.
    This action allows analysts to trigger predefined scripts on network devices directly
    from the SecOps platform.


    ### Flow Description

    1. Initializes the FortiManager client with the provided API credentials.

    2. Retrieves the ADOM Name, Policy Package Name, Script Name, Device Name, and
    VDOM parameters.

    3. Makes an API call to FortiManager to execute the specified script on the target
    device or device group.

    4. Returns the resulting task ID to the SecOps platform.


    ### Additional Notes

    The script can be executed on a single device if the VDOM parameter is provided.
    Otherwise, it can be executed on a device group.
