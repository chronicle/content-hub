identifier: Wiz
name: Wiz
parameters:
- name: API Root
  default_value: https://api.<Tenant Data Center>.app.wiz.io
  type: string
  description: The API Root of the Wiz instance.
  is_mandatory: true
  integration_identifier: Wiz
- name: Authentication URL
  default_value: https://auth.app.wiz.io
  type: string
  description: The authentication URL used to generate OAuth access tokens. For Commercial
    environments, use https://auth.app.wiz.io. For Wiz for Gov (FedRAMP) environments,
    use https://auth.app.wiz.us.
  is_mandatory: false
  integration_identifier: Wiz

- name: Client ID
  default_value: ''
  type: string
  description: The client ID associated with your Wiz API credentials.
  is_mandatory: true
  integration_identifier: Wiz
- name: Client Secret
  default_value: ''
  type: password
  description: The client secret associated with your Wiz API credentials.
  is_mandatory: true
  integration_identifier: Wiz
- name: Verify SSL
  default_value: true
  type: boolean
  description: If selected, the integration validates the SSL certificate when connecting
    to the Wiz server. Enabled by default.
  is_mandatory: true
  integration_identifier: Wiz
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/wiz
categories:
- GUS Recommended
- Cloud
- Cloud Security
image_path: resources/image.png
svg_logo_path: resources/logo.svg
