Get Blue Agent Analysis:
  ai_description: >-
    ### General Description

    Retrieves analysis details from the Wiz Blue Agent for a specified threat ID.
    This action queries the Wiz platform to obtain AI-driven threat analysis, including
    verdicts, severity, and conclusions.


    ### Flow Description

    1. Extracts the `Threat ID` parameter provided by the user or playbook.

    2. Executes a GraphQL query (`get_threat_ai_analysis`) to the Wiz API to fetch
    the Threat AI Analysis for the given issue/threat ID.

    3. Evaluates the status of the analysis. If the status is `COMPLETED`, the action
    finishes and returns the analysis details as JSON.

    4. If the status is `IN_PROGRESS` or `QUEUED`, the action enters an asynchronous
    waiting state and will retry until completion or timeout.

    5. If the analysis fails or is unavailable, the action exits with a failure status.


    ### Additional Notes

    This is an asynchronous action that will periodically poll the Wiz API until the
    Blue Agent analysis is completed or the action's timeout is reached.
