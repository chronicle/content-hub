Reopen Issue:
  ai_description: >-
    ### General Description

    The Reopen Issue action is used to reopen a specified issue in Wiz by updating
    its status to 'OPEN'.


    ### Flow Description

    1. Extracts the `Issue ID` parameter provided in the action configuration.

    2. Initializes the Wiz API client with the integration credentials.

    3. Sends a GraphQL mutation request to the Wiz API to update the status of the
    specified issue to 'OPEN'.

