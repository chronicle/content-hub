Ignore Issue:
  ai_description: >-
    ### General Description

    The "Ignore Issue" action is used to ignore a specified issue in Wiz by updating
    its status to "REJECTED". It allows the user to provide a resolution reason and
    an accompanying note for context. Note: This action only works on Graph Control
    or Cloud Configuration issues.


    ### Flow Description

    1. Extracts the `Issue ID`, `Resolution Reason`, and `Resolution Note` from the
    action parameters.

    2. Validates the `Resolution Reason` against the allowed values (False Positive,
    Exception, Won't Fix).

    3. Initializes the Wiz API client.

    4. Calls the Wiz GraphQL API with a mutation to update the specified issue's status
    to "REJECTED", applying the provided resolution reason and note.

    5. Returns the updated issue details as a JSON result and outputs a success message.


    ### Additional Notes

    This action only works on Graph Control or Cloud Configuration issues in Wiz.
