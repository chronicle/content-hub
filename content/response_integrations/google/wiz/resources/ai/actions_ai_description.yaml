List Resource Vulnerability Findings:
  ai_description: >-
    ### General Description

    The "List Resource Vulnerability Findings" action retrieves a list of vulnerability
    findings associated with specific resources in Wiz. It allows users to filter
    the findings based on severity, availability of a fix, existence of a public exploit,
    and specific CVE IDs.


    ### Flow Description

    1. Extracts the provided resource names and filtering criteria (Severity, Has
    Fix, Has Public Exploit, CVE IDs, and Max Findings To Return).

    2. Iterates through the list of provided resource names.

    3. For each resource, makes a GraphQL API query to Wiz to fetch the vulnerability
    findings that match the specified filters.

    4. Aggregates the findings and returns them as a JSON result.


    ### Additional Notes

    The action will only return findings associated with projects to which the API
    key has access. The maximum number of findings that can be returned per resource
    is 500.
