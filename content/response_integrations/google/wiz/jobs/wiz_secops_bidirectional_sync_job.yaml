name: Wiz & Google SecOps Bi-directional Sync Job
parameters:
- name: Environment Name
  type: string
  description: Name of the environment in which to sync cases.
  is_mandatory: true
  default_value: "Default Environment"
- name: Max Hours Backwards
  type: integer
  description: Number of hours from when to fetch updated cases on first run.
  is_mandatory: false
  default_value: 24
- name: Fields to sync
  type: string
  description: "A comma-separated list of items determining which fields should be synchronized. Possible values are: Status, Comments, Product Link, Severity."
  is_mandatory: true
  default_value: "Status, Comments, Product Link, Severity"
description: Synchronizes Wiz Threats with Google SecOps Cases.
integration: Wiz
creator: admin
