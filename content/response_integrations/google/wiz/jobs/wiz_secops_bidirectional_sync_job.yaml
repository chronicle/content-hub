name: Wiz and Google SecOps Bi-directional Sync Job
parameters:
- name: Environment Name
  type: string
  description: Name of the environment in which to sync cases.
  is_mandatory: true
  default_value: "Default Environment"
- name: Wiz API Root
  type: string
  description: Wiz GraphQL API endpoint.
  is_mandatory: true
  default_value: "https://api.us.wiz.io/graphql"
- name: Wiz Client ID
  type: string
  description: Client ID for the Wiz API Service Account.
  is_mandatory: true
  default_value: ""
- name: Wiz Client Secret
  type: password
  description: Client Secret for the Wiz API Service Account.
  is_mandatory: true
  default_value: ""
- name: Max Hours Backwards
  type: integer
  description: Number of hours from when to fetch updated cases on first run.
  is_mandatory: false
  default_value: 24
- name: Verify SSL
  type: boolean
  description: If selected, the integration validates the SSL certificate when connecting to the Wiz server. Enabled by default.
  is_mandatory: true
  default_value: true
- name: Fields to sync
  type: string
  description: "A comma-separated list of items determining which fields should be synchronized. Possible values are: Status, Comments, Product Link, Severity."
  is_mandatory: true
  default_value: "Status, Comments, Product Link, Severity"
description: Synchronizes Wiz Threats with Google SecOps Cases.
integration: Wiz
creator: admin
