identifier: GoogleCloudApi
name: Google Cloud API
parameters:
-   name: Test URL
    default_value: ''
    type: string
    description: Test URL that will be used to validate the authentication to Google
        Cloud API. Uses a GET request.
    is_mandatory: false
    integration_identifier: GoogleCloudApi
-   name: Service Account Json File Content
    default_value: ''
    type: password
    description: 'Service Account JSON Key that will be used for authentication. Either
        this parameter or "Workload Identity Email" should be provided. Note: "Service
        Account JSON Key" authentication has priority.'
    is_mandatory: false
    integration_identifier: GoogleCloudApi
-   name: Organization ID
    default_value: ''
    type: string
    description: ID of the organization that you want to use inside the integration.
        You can provide {{org_id}} inside your actions to take the value from this
        parameter.
    is_mandatory: false
    integration_identifier: GoogleCloudApi
-   name: Project ID
    default_value: ''
    type: string
    description: ID of the project that you want to use inside the integration. You
        can provide {{project_id}} inside your actions to take the value from this
        parameter.
    is_mandatory: false
    integration_identifier: GoogleCloudApi
-   name: Quota Project ID
    default_value: ''
    type: string
    description: ID of the quota project that will be attached to all of the API requests
        done by the integration.
    is_mandatory: false
    integration_identifier: GoogleCloudApi
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: 'Workload identity email that should be used for authentication.
        Either this parameter or "Service Account JSON Key" should be provided. Note:
        "Service Account JSON Key" authentication has priority.'
    is_mandatory: false
    integration_identifier: GoogleCloudApi
-   name: OAuth Scopes
    default_value: https://www.googleapis.com/auth/cloud-platform
    type: string
    description: Comma-separated list of OAuth scopes necessary to execute Google
        Cloud API requests.
    is_mandatory: false
    integration_identifier: GoogleCloudApi
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for all of the connections
        done by integration.
    is_mandatory: false
    integration_identifier: GoogleCloudApi
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-api
categories:
- IT & Infrastructure
svg_logo_path: resources/logo.svg
image_path: resources/image.png
