Execute HTTP Request:
  ai_description: >-
    ### General Description

    This action executes a customizable HTTP request against a specified URL using
    the Google Cloud API integration's authenticated session. It is a versatile utility
    designed to interact with any reachable REST API, supporting various HTTP methods,
    custom headers, query parameters, and body payloads. It can handle asynchronous
    polling for specific response values and can optionally download and attach response
    data to the Google SecOps Case Wall.


    ### Flow Description

    1. **Initialization:** Extracts and validates all input parameters, ensuring JSON
    strings are properly formatted.

    2. **Placeholder Application:** Replaces dynamic placeholders in the URL and payload
    with configuration-specific values.

    3. **Request Execution:** Sends the HTTP request using the integration's authorized
    session (handling OAuth2 or Service Account authentication).

    4. **Response Processing:** Parses the response based on the `Fields To Return`
    parameter and optionally encodes the data to Base64.

    5. **Condition Checking:** If `Expected Response Values` are defined, the action
    checks the response. If the conditions aren't met, it remains 'In Progress' for
    the next polling cycle.

    6. **Attachment Handling:** If `Save To Case Wall` is enabled, the response content
    is compressed into a zip file (optionally password-protected) and uploaded to
    the case.


    ### Additional Notes

    - **Placeholders:** You can use `{{project_id}}` and `{{org_id}}` in the URL Path
    and Body Payload; these will be automatically replaced with values from the integration
    configuration.

    - **Async Mode:** The action automatically switches to asynchronous execution
    if the `Expected Response Values` parameter is populated.
  ai_short_description: >-
    Executes a customizable HTTP request against a specified URL using the Google
    Cloud API integration's authenticated session, supporting various HTTP methods,
    custom headers, query parameters, and body payloads.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: >-
      The action can execute HTTP methods such as POST, PUT, PATCH, and DELETE, which
      can create, modify, or delete data on the target external API.
    fetches_data: true
    internal_data_mutation_explanation: >-
      The action can save the HTTP response content as a zip file attachment to the
      case wall.
    reasoning: >-
      The action fetches data by executing HTTP requests (GET, POST, etc.). It can
      mutate external data because it supports state-changing HTTP methods like POST,
      PUT, PATCH, and DELETE. It mutates internal data by optionally saving the HTTP
      response as a zip file attachment to the case wall. It does not update entities,
      create insights, modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
