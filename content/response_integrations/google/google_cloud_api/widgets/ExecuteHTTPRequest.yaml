title: GoogleCloudApi - Execute HTTP Request
type: html
scope: alert
action_identifier: Execute HTTP Request
description: This widget highlights the most important items in Execute HTTP Request
    - GoogleCloudApi.
data_definition:
    html_height: 400
    safe_rendering: false
    widget_definition_scope: both
    type: html
condition_group:
    conditions:
    -   field_name: '[{stepInstanceName}.is_success]'
        value: 'true'
        match_type: equal
        custom_operator_name: null
    -   field_name: '[{stepInstanceName}.JsonResult]'
        value: response_data
        match_type: contains
        custom_operator_name: null
    -   field_name: '[{stepInstanceName}.JsonResult| "response_data"]'
        value: ''
        match_type: is_not_empty
        custom_operator_name: null
    -   field_name: '[{stepInstanceName}.JsonResult| "response_data"]'
        value: '{}'
        match_type: not_equal
        custom_operator_name: null
    logical_operator: and
default_size: half_width
