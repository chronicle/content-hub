name: Get Secret Value
description: Fetches a secret value from Akeyless and displays it on the Google SecOps SOAR platform.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/akeyless-security#get_secret_value
integration_identifier: AkeylessSecurity
parameters:
-   name: Secret Name
    default_value: ''
    type: string
    description: "Provide the name or path of the secret to retrieve from Akeyless (supports 'secret_name' or 'secret_name:version', defaulting to 'latest')."
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_secret_value_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
