Get PCAP Files For Events:
  ai_description: >-
    ### General Description

    Retrieves PCAP (Packet Capture) files associated with security events within an
    alert or case from AlienVault. The action downloads the PCAP files and attaches
    them to the case in Google SecOps for further analysis.


    ### Flow Description

    1. Determines the execution scope (either the current Alert or the entire Case).

    2. Iterates through the target alerts and their associated security events.

    3. Extracts the event ID from the event's additional properties.

    4. Makes an HTTP GET request to AlienVault to fetch the event details page and
    locate the PCAP file link.

    5. If a PCAP file is found, makes another HTTP GET request to download the file
    content.

    6. Base64 encodes the PCAP content and attaches it to the case in Google SecOps.

    7. Returns the base64 encoded content in a JSON result.


    ### Additional Notes

    The action relies on the event having an "Id" field in its additional properties
    to successfully query AlienVault for the corresponding PCAP file.
