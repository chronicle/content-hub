Fetch Last PCAP Files:
  ai_description: >-
    ### General Description

    Fetches the most recent PCAP (Packet Capture) files from AlienVault and attaches
    them to the action's results for further analysis.


    ### Flow Description

    1. Initializes the connection to the AlienVault appliance using the provided integration
    configurations.

    2. Retrieves the list of the latest PCAP file records by making an HTTP GET request
    to the AlienVault API.

    3. Limits the retrieved records based on the `Number Of Files To Fetch` parameter.

    4. Iterates through the filtered records and downloads the content of each PCAP
    file via an HTTP GET request.

    5. Encodes the downloaded file content in base64 and attaches it to the action's
    results.

    6. Constructs a data table and a JSON result containing the metadata of the fetched
    PCAP files.


    ### Additional Notes

    The action will return a message indicating how many PCAP files were successfully
    found and attached.
