Enrich Assets:
  ai_description: >-
    ### General Description

    Enriches Address and Hostname entities by retrieving asset information from AlienVault
    USM Appliance.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters entities to process only those of type Address or Hostname.

    3. For each valid entity, makes an API call to AlienVault to retrieve the corresponding
    asset ID based on the IP address or hostname.

    4. If an asset ID is found, makes another API call to fetch detailed asset information.

    5. Flattens the retrieved asset data and appends it to the entity's additional
    properties with an "AlientVault" prefix.

    6. Updates the entities in the SecOps platform and returns the asset details as
    a JSON result.


    ### Additional Notes

    This action requires the AlienVault USM Appliance integration to be properly configured
    with the API Root, Username, and Password.
  ai_short_description: >-
    Enriches Address and Hostname entities by retrieving detailed asset information
    from AlienVault USM Appliance and appending it to the entities' additional properties.
