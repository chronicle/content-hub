Get File References:
  ai_description: >-
    ### General Description

    Retrieves references for file hash entities from McAfee Threat Intelligence Exchange
    (TIE) via DXL. This action identifies the agents or endpoints where a specific
    file was used or observed, providing valuable prevalence and contextual data for
    investigations.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only those of type `FILEHASH`.

    3. For each valid file hash, queries McAfee TIE via the DXL broker to retrieve
    file references (including Agent GUIDs and first contact dates).

    4. If references are found, formats the data into a CSV table and attaches it
    to the corresponding entity in the SecOps platform.

    5. Updates the enriched entities to reflect the new data.


    ### Additional Notes

    - The action automatically identifies the hash type (MD5, SHA1, or SHA256) based
    on the length of the entity identifier.

    - Entities that are not file hashes or for which no references are found will
    be skipped without causing the action to fail.
  ai_short_description: >-
    Retrieves references for file hash entities from McAfee Threat Intelligence Exchange
    (TIE) to identify the agents or endpoints where a specific file was observed.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates entities and attaches a CSV table containing file references to the
      entities.
    reasoning: >-
      The action fetches file references from McAfee TIE (fetches_data=true). It does
      not mutate external data. It updates internal entities and adds entity tables
      (can_mutate_internal_data=true, can_update_entities=true). It does not create
      insights (uses add_entity_table instead), modify alert data, or create case
      comments.
  entity_usage:
