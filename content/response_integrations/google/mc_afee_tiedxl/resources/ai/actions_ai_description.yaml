Get File Reputation:
  ai_description: >-
    ### General Description

    Retrieves file reputation data for FileHash entities using McAfee Threat Intelligence
    Exchange (TIE) over the Data Exchange Layer (DXL). The action fetches reputation
    scores from various providers, evaluates the trust level, and enriches the entities
    with the results.


    ### Flow Description

    1. Iterates through all target entities and filters for FileHash entities.

    2. Makes a request to McAfee TIE via the DXL client to fetch reputation data for
    each file hash.

    3. Parsed the returned reputation data from various providers (e.g., GTI, ATD,
    MWG).

    4. Depending on the 'Enrich with all services' parameter, enriches the entity's
    additional properties with either all returned reputations or only the one with
    the worst trust level.

    5. Attaches the reputation data as an entity table and updates the entity's enrichment
    status.

    6. Returns the raw reputation data as a JSON result.


    ### Additional Notes

    - The action supports MD5, SHA1, and SHA256 hashes.

    - If 'Enrich with all services' is false, the action calculates the worst trust
    level among all providers and uses that for enrichment.
  ai_short_description: >-
    Retrieves file reputation data for FileHash entities using McAfee Threat Intelligence
    Exchange (TIE) and enriches the entities with the results.
