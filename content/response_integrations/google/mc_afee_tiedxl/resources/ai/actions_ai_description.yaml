Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the McAfee TIE DXL server to verify that the integration
    is configured correctly and can successfully communicate with the external service.


    ### Flow Description

    1. Retrieves the integration configuration parameters, including the Server Address,
    Broker CA Bundle Path, Client Cert File Path, and Client Key File Path.

    2. Initializes the McAfee TIE DXL Manager, which attempts to establish a connection
    to the DXL fabric.

    3. If the connection is successful without any exceptions, the action completes
    and returns a success message.


    ### Additional Notes

    This action is typically used during the initial setup or troubleshooting of the
    integration to ensure that network connectivity and authentication credentials
    are valid.
