Set File Reputation:
  ai_description: >-
    ### General Description

    Sets the enterprise reputation (trust level) for File Hash entities in McAfee
    Threat Intelligence Exchange (TIE) via DXL. This action allows analysts to manually
    classify files as malicious, trusted, or unknown within the McAfee ecosystem.


    ### Flow Description

    1. Iterates through the target entities in the case.

    2. Filters entities to include only those of type File Hash.

    3. For each File Hash, makes a request to McAfee TIE via the DXL client to set
    its reputation to the specified trust level, optionally including a file name
    and comment.

    4. Updates the entities in Google SecOps if the reputation was successfully set.


    ### Additional Notes

    Supports MD5, SHA1, and SHA256 hashes. The trust level must be one of the supported
    McAfee TIE trust levels (e.g., KNOWN_MALICIOUS, KNOWN_TRUSTED, UNKNOWN).
  ai_short_description: >-
    Sets the enterprise reputation (trust level) for File Hash entities in McAfee
    Threat Intelligence Exchange (TIE).
