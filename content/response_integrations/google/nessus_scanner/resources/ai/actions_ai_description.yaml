      generate an HTML report file.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches scan details and downloads a report (fetches_data=true).
      To download the report, it must first export it by making a POST request to
      the Nessus API, which creates an export file on the server (can_mutate_external_data=true).
      It does not mutate internal SecOps data, update entities, create insights, modify
      alerts, or create case comments.
