Get Scan Templates:
  ai_description: >-
    ### General Description

    The **Get Scan Templates** action retrieves a comprehensive list of all available
    scan templates from the Nessus Scanner server. This action is primarily used for
    discovery, allowing users to identify the specific policies and templates (such
    as 'WannaCry Ransomware' or 'Advanced Scan') available on the Nessus instance.
    The retrieved information includes template titles, names, and unique identifiers
    (UUIDs), which are often required as inputs for creating or launching new scans.


    ### Flow Description

    1. **Authentication**: The action establishes a session with the Nessus Scanner
    API using the integration configuration credentials.

    2. **Data Retrieval**: It executes a GET request to the Nessus endpoint `/editor/policy/templates`
    to fetch the complete list of scan templates.

    3. **Data Formatting**: The action processes the raw API response into a structured
    JSON object and a CSV-formatted list containing the Title, Name, and UUID for
    each template.

    4. **Output Generation**: If templates are found, a data table titled 'Nessus
    Scan Templates' is added to the action output, and the JSON result is populated
    with the template data.


    ### Additional Notes

    This action does not operate on specific entities and is generally used as a prerequisite
    step to gather template UUIDs for subsequent scan creation actions.
