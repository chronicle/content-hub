Get Scan Report:
  ai_description: >-
    ### General Description

    Retrieves a comprehensive scan report from Nessus Scanner for a specified scan
    name. This action checks the current status of a scan and, if finished, triggers
    the generation of an HTML report, downloads it, and attaches it to the action
    results. If the scan is still running, the action remains in an 'In Progress'
    state to allow for asynchronous polling.


    ### Flow Description

    1. Initializes the Nessus client using the provided API keys and root URL.

    2. Retrieves the list of all scans to find the unique identifier (ID) associated
    with the provided 'Scan Name'.

    3. Fetches the specific details of the scan to check its status.

    4. If the status is 'completed', sends a POST request to Nessus to export the
    scan results into an HTML format.

    5. Monitors the export status until the file is marked as 'ready'.

    6. Downloads the generated HTML file, encodes it in base64, and attaches it to
    the action results as 'ScanReport.html'.

    7. If the status is not 'completed', the action returns an 'In Progress' state
    for later re-execution.


    ### Additional Notes

    This action is marked as asynchronous. It will continue to poll the Nessus API
    until the scan is completed or an error occurs. Note that the export process itself
    involves a POST request to the external system to create the report file.
  ai_short_description: >-
    Retrieves a comprehensive scan report from Nessus Scanner for a specified scan
    name, exporting and attaching the results as an HTML file once the scan is completed.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
