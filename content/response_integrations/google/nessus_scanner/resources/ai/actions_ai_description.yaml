Create Scan:
  ai_description: >-
    ### General Description

    Creates a new vulnerability scan in Nessus using a specified template and target
    entities (IP Addresses and Hostnames). This action automates the setup of scans
    by resolving template titles to UUIDs and submitting the scan configuration to
    the Nessus API.


    ### Flow Description

    1. **Initialization**: Connects to the Nessus API using provided credentials.

    2. **Target Identification**: Collects all IP Address and Hostname entities from
    the current context to serve as scan targets.

    3. **Template Resolution**: Queries Nessus to find the unique identifier (UUID)
    associated with the provided 'Scan Template Title'.

    4. **Scan Creation**: Sends a POST request to the Nessus `/scans` endpoint with
    the scan name, targets, description, and template UUID.

    5. **Result Handling**: Returns the details of the newly created scan as a JSON
    result.


    ### Additional Notes

    The action requires a valid scan template title that exists in the Nessus instance.
  ai_short_description: >-
    Creates a new vulnerability scan in Nessus using a specified template and target
    entities (IP Addresses and Hostnames).
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new vulnerability scan configuration in the Nessus scanner.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Nessus API to create a new scan configuration.
      It does not fetch data for enrichment, nor does it mutate internal SecOps data.
