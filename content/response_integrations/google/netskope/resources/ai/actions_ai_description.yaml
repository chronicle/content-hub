Ping:
  ai_description: >-
    ### General Description

    Verifies connectivity to the Netskope platform using the configured API credentials.
    This action ensures that the SOAR platform can successfully communicate with the
    Netskope API endpoints by performing a lightweight request to the service.


    ### Flow Description

    1. Retrieves the API Root, API Keys, and SSL verification settings from the integration
    configuration.

    2. Checks if at least one API key (V1 or V2) is provided. If both are missing,
    the action fails immediately.

    3. Attempts to fetch a single client record from the `/api/v1/clients` endpoint
    (if V1 API Key is provided) or a single alert record from the `/api/v2/events/data/alert`
    endpoint (if V2 API Key is provided) to test connectivity.

    4. Reports a successful connection if the API call succeeds, or captures the exception
    and returns a failure status with error details.


    ### Additional Notes

    At least one API key (either V1 or V2) must be configured in the integration settings
    for this action to execute successfully.
