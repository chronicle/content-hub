Add Entities to URL List:
  ai_description: >-
    ### General Description

    Appends new URLs, domains, or IP addresses to an existing Netskope URL list. This
    action can process both manually provided entries and supported entities attached
    to the case, and it provides an option to deploy the pending changes across the
    Netskope environment.


    ### Flow Description

    1. Extracts the target URL list name, manual entries, and deployment preference
    from the action parameters.

    2. Collects the entities to add by combining the manual entries and the identifiers
    of supported target entities (URL, Address, Domain).

    3. Makes a GET request to the Netskope API to retrieve the specified URL list
    and obtain its internal ID and type.

    4. Iterates over the collected entities and makes PATCH requests to the Netskope
    API to append them to the URL list.

    5. If the deployment parameter is enabled, makes a POST request to deploy all
    pending URL list changes in Netskope.

    6. Returns a summary message and attaches a JSON result containing the successfully
    added entities, failed entities, and modification details.


    ### Additional Notes

    - Supported entity types for automatic processing are URL, Domain, and IP Address.

    - Deploying changes will apply all pending modifications across all URL lists
    in Netskope, not just the one modified by this action.
  ai_short_description: >-
    Appends new URLs, domains, or IP addresses to an existing Netskope URL list, processing
    both manually provided entries and supported case entities, with an option to
    deploy the changes.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds URLs, domains, or IP addresses to a specified Netskope URL list and optionally
      deploys the changes.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by making PATCH requests to append entities
      to a Netskope URL list and optionally making a POST request to deploy the changes.
      It does not fetch contextual data for enrichment, nor does it mutate internal
      SecOps data, update entities, or create insights.
