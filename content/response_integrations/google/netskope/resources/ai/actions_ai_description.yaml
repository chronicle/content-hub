    range filters (Start Time and End Time), and the maximum number of items to return.

    2. **API Initialization**: It initializes the Netskope API client (V1 or V2) based
    on the configuration.

    3. **API Request**: It makes a GET request to the Netskope quarantine endpoint
    (`/api/v1/quarantine` or `/api/v2/casbapi/incidents/quarantine`) to fetch the
    list of quarantined files.

    4. **Data Processing**: The response is parsed to extract individual file details,
    and the data is formatted into a CSV table.

