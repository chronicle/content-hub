Block File:
  ai_description: >-
    ### General Description

    This action blocks a quarantined file within the Netskope platform. It is used
    to transition a file from a quarantined state to a blocked state, preventing further
    access or interaction with the file based on the specified quarantine profile.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the specific action parameters
    (`File ID`, `Quarantine Profile ID`, and `Use V2 API`).

    2. **Manager Initialization**: It initializes the `NetskopeManager` (V1 or V2)
    using the provided credentials.

    3. **API Interaction**: The action calls the Netskope API's quarantine endpoint
    to block the specified file. For V1, it sends a GET request with the operation
    `take-action` and action `block`. For V2, it sends a POST request to the specific
    file's block endpoint.

    4. **Status Reporting**: If the API call is successful or if the file was already
    processed, the action completes with a success message. If an error occurs, it
    logs the exception and fails.


    ### Additional Notes

    - The `Quarantine Profile ID` parameter is mandatory when using the V1 API.
