Allow File:
  ai_description: >-
    ### General Description

    Allows a quarantined file within the Netskope platform. This action interacts
    with the Netskope API to change the status of a specific file from quarantined
    to allowed, effectively releasing it based on the provided identifiers.


    ### Flow Description

    1. **Initialization**: The action initializes the Netskope manager using the provided
    API credentials and version preference.

    2. **Parameter Extraction**: It retrieves the 'File ID', 'Quarantine Profile ID',
    and 'Use V2 API' parameters.

    3. **Execution**: It calls the Netskope API (V1 or V2) to restore or allow the
    specified quarantined file.

    4. **Finalization**: Returns a success message if the file is successfully allowed
    or if it was already processed.


    ### Additional Notes

    If using the V1 API, the 'Quarantine Profile ID' parameter is mandatory.
