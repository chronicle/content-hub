List Alerts:
  ai_description: >-
    ### General Description

    This action retrieves a list of alerts from the Netskope platform based on user-defined
    filters such as query, alert type, time period, and acknowledgment status. The
    retrieved alerts are returned as a JSON result and formatted into a data table
    within the Google SecOps case for analyst review.


    ### Flow Description

    1. **Parameter Validation**: The action validates the provided 'Type' parameter
    against a list of supported Netskope alert types and ensures the 'Limit' is a
    positive integer.

    2. **API Connection**: It initializes the Netskope V2 API manager using the integration
    configuration.

    3. **Data Retrieval**: The action sends a GET request to the Netskope `api/v2/events/data/alert`
    endpoint, applying the specified filters (query, type, time range, and acknowledgment
    status).

    4. **Pagination**: If the requested limit exceeds the single-page response size,
    the action handles pagination to fetch the required number of alerts.

    5. **Output Generation**: The retrieved alerts are processed into a flat format
    to create a CSV data table and are also attached as a raw JSON result to the action
    execution.


    ### Additional Notes

    - Either the 'Time Period' parameter or the 'Start Time'/'End Time' pair should
    be configured to define the search window effectively.

    - The action utilizes the Netskope V2 API.
  ai_short_description: >-
    Retrieves a list of alerts from the Netskope platform based on specified filters
    and time ranges, returning the results as a data table and JSON.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches alert data from the Netskope API using a GET request (fetches_data
      is true). It does not perform any state-changing operations on external systems
      (can_mutate_external_data is false). It also does not update internal entities,
      create insights, or modify case data (can_mutate_internal_data, can_update_entities,
      can_create_insight, can_modify_alert_data, can_create_case_comments are all
      false).
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
