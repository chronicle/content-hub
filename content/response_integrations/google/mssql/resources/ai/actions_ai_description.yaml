RunSQLQuery:
  ai_description: >-
    ### General Description

    Executes a custom SQL query on a specified Microsoft SQL Server database. This
    action allows users to run arbitrary SQL commands, retrieve the results, and optionally
    commit changes to the database.


    ### Flow Description

    1. Extracts the database name, SQL query, and commit flag from the action parameters.

    2. Establishes a connection to the MSSQL server using the configured credentials
    and authentication method.

    3. Executes the provided SQL query against the specified database.

    4. If the `Commit` parameter is set to true, commits the transaction to the database.

    5. Retrieves the query results, formats them as a CSV table, and attaches them
    to the action's output.

    6. Returns the query results as a JSON object.


    ### Additional Notes

    - Ensure that the provided credentials have the necessary permissions to execute
    the query and commit changes on the target database.

    - The action supports both standard SQL authentication and Windows/Kerberos authentication.
  ai_short_description: >-
    Executes a custom SQL query on a specified Microsoft SQL Server database and optionally
    commits the changes.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Executes a SQL query and commits changes to the MSSQL database if the Commit
      parameter is set to true.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action executes a SQL query which can fetch data (fetches_data=true). It
      also has a commit parameter that allows it to commit changes to the database,
      mutating external data (can_mutate_external_data=true). It does not mutate internal
      data, update entities, create insights, modify alert data, or create case comments.
