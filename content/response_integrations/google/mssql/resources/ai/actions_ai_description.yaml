Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to a Microsoft SQL Server database.


    ### Flow Description

    1. Extracts the necessary connection parameters.

    2. Initializes the MSSQLManager with the provided credentials and connection details.

    3. Attempts to establish a connection to the SQL Server instance.

    4. Returns a successful result if the connection is established, or fails with
    an error message if it cannot connect.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can reach the target database.
  ai_short_description: >-
    Tests connectivity to a Microsoft SQL Server database to verify configuration
    and network access.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action only attempts to establish a connection to the SQL server to test
      connectivity. It does not fetch contextual data, mutate external or internal
      data, update entities, create insights, modify alerts, or create case comments.
