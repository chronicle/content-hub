Allow IP:
  ai_description: >-
    ### General Description

    Creates a traffic change request in AlgoSec FireFlow to allow traffic to specified
    IP address entities. The action treats the target IP addresses as destinations
    and allows specifying sources, services, and other request details.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Filters target entities to identify supported IP addresses (`ADDRESS`).

    3. Makes a POST request to the AlgoSec API (`/FireFlow/api/change-requests/traffic`)
    to create a traffic change request with the action set to "Allow".

    4. Waits for a brief period and makes a GET request to retrieve the newly created
    request details.

    5. Attaches the request details as a JSON result and provides a link to the change
    request in the SecOps platform.


    ### Additional Notes

    IP address entities are treated as destinations in the change request.
  ai_short_description: >-
    Creates a traffic change request in AlgoSec FireFlow to allow traffic to specified
    IP address entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new traffic change request in AlgoSec FireFlow.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the AlgoSec API to create a traffic change
      request, which mutates external data. It does not fetch enrichment data, update
      internal entities, create insights, modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
