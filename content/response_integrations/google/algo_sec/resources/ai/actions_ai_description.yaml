Wait for Change Request Status Update:
  ai_description: >-
    ### General Description

    Waits for a specific change request status update in AlgoSec. This action runs
    asynchronously and continuously checks the status of a given traffic change request
    until it matches one of the specified target statuses or times out.


    ### Flow Description

    1. Extracts the `Request ID` and target `Status` parameters.

    2. Validates the provided statuses against the allowed list of possible statuses.

    3. Makes an API call to AlgoSec (`GET /FireFlow/api/change-requests/traffic/{request_id}`)
    to retrieve the current details and status of the change request.

    4. Evaluates if the current status matches any of the target statuses.

    5. If a match is found, the action completes successfully and returns the request
    details as a JSON result.

    6. If a match is not found and the timeout is not approaching, the action suspends
    itself (InProgress) to be re-executed later.


    ### Additional Notes

    - This action is designed to run asynchronously. Ensure the script timeout value
    in the IDE is adjusted as needed.

    - Only traffic change requests are supported.
  ai_short_description: >-
    Waits asynchronously for a specific traffic change request in AlgoSec to reach
    a desired status, periodically polling the API until the condition is met or a
    timeout occurs.
  capabilities:
