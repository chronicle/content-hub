    | Template | String | Yes | Specify the template for the change request. |

    | Source | String | Yes | Specify a comma-separated list of sources for the allow
    rule. It can be an IP address, IP Set or special keyword like (all). |

    | Service | String | Yes | Specify a comma-separated list of services that needs
    to be allowed. Values can have a look of {TCP/UDP}/{port} (tcp/80) or special
    reserved keyword (all). |

    | Subject | String | No | Specify the subject for the change request. If nothing
    is provided action will put "Siemplify Allow IP request" in the subject. |

    | Owner | String | No | Specify who should be the owner of the change request.
    If nothing is provided, the user that created the ticket will be the owner. |

    | Due Date | String | No | Specify the due date for the change request. Format:
    ISO 8601. Example: 2021-08-13T08:16:10Z. |

    | Expiration Date | String | No | Specify the expiration date for the change request.
    Format: ISO 8601. Example: 2021-08-13T08:16:10Z. |

    | Custom Fields | String | No | Specify a JSON object containing information about
    all of the fields that need to be added to the change request. Note: this parameter
    has a priority over other fields |
Block IP:
  ai_description: >-
    ### General Description

    Creates a traffic change request in AlgoSec to block traffic to specified IP address
    entities. This action initiates a state change on the external device to prevent
    network traffic to the specified destinations.


    ### Flow Description

    1. Extracts action parameters including Template, Source, Service, Subject, Owner,
    Due Date, Expiration Date, and Custom Fields.

    2. Iterates over the target entities and filters for IP addresses (`ADDRESS`).

    3. Makes a POST request to the AlgoSec API to create a traffic change request
    with a "Drop" action, using the provided parameters and the IP addresses as destinations.

    4. Waits for a brief period and makes a GET request to retrieve the details of
    the newly created change request.

    5. Attaches the request details as JSON results and adds a link to the change
    request in the case wall.


    ### Additional Notes

    IP address entities are treated as destinations in the change request.
