Execute Query:
  ai_description: >-
    ### General Description

    Executes a custom SolarWinds Query Language (SWQL) query in SolarWinds Orion and
    retrieves the results. This action allows analysts to fetch specific telemetry,
    node information, or other data directly from the SolarWinds Orion platform.


    ### Flow Description

    1. Initializes the connection to the SolarWinds Orion API using the provided integration
    credentials.

    2. Sends a POST request to the `/SolarWinds/InformationService/v3/Json/Query`
    endpoint with the specified SWQL query.

    3. Parses the response and limits the number of returned records based on the
    `Max Results To Return` parameter.

    4. Outputs the retrieved data as a JSON result and constructs a CSV-formatted
    data table for the case wall.


    ### Additional Notes

    - SolarWinds queries do not support the `*` (wildcard) notation for selecting
    all columns; you must explicitly define the columns to return in your SELECT statement.
