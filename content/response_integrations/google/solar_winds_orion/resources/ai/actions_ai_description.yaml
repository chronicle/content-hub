    ### General Description

    Executes a custom query in SolarWinds Orion based on the provided IP Address and
    Hostname entities.


    ### Flow Description

    1. Filters the target entities to include only IP Addresses and Hostnames.

    2. Constructs a query by appending a `WHERE` clause to the provided base query,
    using the specified entity keys.

    3. Makes a POST request to the SolarWinds Orion API to execute the constructed
    query.

    4. Retrieves the query results up to the specified maximum limit.

    5. Returns the results as JSON and attaches a data table to the action result.


    ### Additional Notes

    The base query should not contain a `WHERE` clause, as it is dynamically added
    by the action. SolarWinds queries do not support the `*` notation.
