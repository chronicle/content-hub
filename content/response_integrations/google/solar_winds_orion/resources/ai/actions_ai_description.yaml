Enrich Endpoint:
  ai_description: >-
    ### General Description

    This action fetches system information for endpoint entities (Hostnames and IP
    Addresses) from SolarWinds Orion to enrich them with contextual metadata.


    ### Flow Description

    1. The action filters the target entities to include only Hostname and IP Address
    types.

    2. It constructs a SWQL (SolarWinds Query Language) query to fetch system information
    for all valid entities.

    3. An API call (POST request) is made to the SolarWinds Orion Information Service
    to execute the query.

    4. The action parses the query results and matches them to the corresponding entities
    based on IP address or display name.

    5. Successfully matched entities are enriched with the retrieved data, updating
    their additional properties.

    6. The enriched entities are updated within the Google SecOps platform, and the
    raw JSON results are attached to the action's output.


    ### Additional Notes

    This action relies on integration-level configurations for authentication and
    does not require any action-specific parameters.
  ai_short_description: >-
    Fetches system information for Hostname and IP Address entities from SolarWinds
    Orion to enrich them with contextual metadata.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
