Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the SolarWinds Orion server using the provided integration
    configuration parameters.


    ### Flow Description

    1. Extracts integration configuration parameters including IP Address, Username,
    Password, and Verify SSL.

    2. Initializes the SolarWinds Orion API manager with the provided credentials.

    3. Executes a lightweight test query (`SELECT DisplayName FROM Orion.Nodes ORDER
    BY DisplayName WITH ROWS 1 TO 1`) via a POST request to the SolarWinds Orion API
    to verify communication.

    4. Validates the response and returns a success message if the connection is established,
    or an error message if it fails.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can successfully authenticate and communicate with the SolarWinds Orion instance.
