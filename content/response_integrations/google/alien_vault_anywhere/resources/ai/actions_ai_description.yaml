    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making an HTTP GET request to the AlienVault Anywhere
      API to retrieve alarm details. It does not mutate external data, mutate internal
      data, update entities, create insights, modify alert data, or create case comments.
