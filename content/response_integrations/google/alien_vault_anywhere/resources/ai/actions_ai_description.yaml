Get Alarm Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information for a specific alarm from AlienVault Anywhere using
    the alarm's ID. This action fetches the alarm's metadata and raw data from the
    external system and attaches it to the action's results.


    ### Flow Description

    1. Extracts the `Alarm ID` parameter provided by the user or a previous action.

    2. Validates that the integration is configured to use API V2 (the action will
    fail if V1 is used).

    3. Makes an HTTP GET request to the AlienVault Anywhere API (`/api/2.0/alarms/{alarm_id}`)
    to fetch the alarm details.

    4. Parses the response and adds the alarm details to the action's JSON results
    and a formatted data table.


    ### Additional Notes

    This action only supports the AlienVault Anywhere V2 integration. Attempting to
    run it with V1 will result in an immediate failure.
  ai_short_description: >-
    Retrieves detailed information for a specific alarm from AlienVault Anywhere using
    the alarm's ID.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
