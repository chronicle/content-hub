List Events:
  ai_description: >-
    ### General Description

    Searches for and retrieves events from AlienVault Anywhere based on specified
    filtering criteria such as account name, event name, source name, and time range.


    ### Flow Description

    1. Extracts action parameters including account name, event name, source name,
    time ranges, and limits.

    2. Validates that the integration version is V2, as V1 is unsupported for this
    action.

    3. Parses the provided `Start Time` and `End Time` strings into Unix timestamps.

    4. Makes a paginated GET request to the AlienVault Anywhere API (`/api/2.0/events`)
    to fetch events matching the provided filters.

    5. Formats the retrieved events into a CSV table and attaches the raw JSON data
    to the action results.


    ### Additional Notes

    This action is only supported for AlienVault Anywhere V2. If V1 is configured,
    the action will fail immediately.
  ai_short_description: >-
