    \ action will return history information. |\n| Include HAR | Boolean | No | If\
    \ enabled, action will return HAR information. |"
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Splash server using the parameters provided in the integration
    configuration.


    ### Flow Description

    1. Retrieves the API Root and Verify SSL parameters from the integration configuration.

    2. Initializes the SplashManager with the provided connection parameters.

    3. Executes a GET request to the `/_ping` endpoint to test connectivity.

    4. Validates the response and returns a success message if the connection is established,
    or an error message if it fails.


    ### Additional Notes

    This action is typically used to verify that the integration is configured correctly
    and can communicate with the Splash server.
