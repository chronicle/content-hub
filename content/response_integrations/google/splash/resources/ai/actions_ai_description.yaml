    get_alert_information: false
    reasoning: >-
      The action fetches rendering data, history, and screenshots for URL and IP Address
      entities from Splash. This aligns with the 'Enrich IOC' expected outcome as
      it provides contextual intelligence for the indicators. It does not mutate external
