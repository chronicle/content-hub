Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches URL and IP Address entities using information from Splash. This action
    retrieves rendering details such as the original URL, final URL, page title, history,
    HAR data, and a PNG screenshot of the rendered page.


    ### Flow Description

    1. Extracts action parameters and filters the target entities to include only
    URL and IP Address types.

    2. Iterates over the suitable entities, formatting the identifier to ensure it
    includes an HTTP/HTTPS schema.

    3. Makes a GET request to the Splash API (`/render.json`) for each entity to retrieve
    rendering data.

    4. Parses the response and updates the entity's additional properties with the
    retrieved information.

    5. Attaches a CSV table and a PNG screenshot to the entity in the SecOps platform.

    6. If configured, generates a case insight containing the general information
    and the screenshot.

    7. Updates the enriched entities within the SecOps platform.


    ### Additional Notes

    URLs need to have a schema. For IP addresses, the action will automatically add
    the "https://" schema if missing.
  ai_short_description: >-
    Enriches URL and IP Address entities by retrieving rendering information, history,
    HAR data, and screenshots from Splash.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Splash API via a GET request (fetches_data=true).
      It does not mutate external data. It updates internal entities using `siemplify.update_entities`
      (can_update_entities=true) and creates insights using `siemplify.create_case_insight`
      (can_create_insight=true).
  entity_usage:
    entity_types:
