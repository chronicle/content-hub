name: Remove Network Tags
description: Remove network tags from the Compute Engine instance. This action is
    asynchronous. Adjust the sript timeout value in the Google SecOps IDE for the
    action as needed.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-compute#remove_network_tags
integration_identifier: GoogleCloudCompute
parameters:
-   name: Resource Name
    default_value: ''
    type: string
    description: The full resource name for the Compute Engine instance, such as /projects/{project_id}/zones/{zone
        id}/instances/{instance id}. This parameter has a priority over the “Project
        ID”, “Instance Zone”, and “Instance ID” parameters.
    is_mandatory: false
-   name: Project ID
    default_value: ''
    type: string
    description: The project name of your Compute Engine instance. If you don’t set
        a value, the action retrieves the project name from the integration configuration.
    is_mandatory: false
-   name: Instance Zone
    default_value: ''
    type: string
    description: The zone name of the Compute Engine instance. This parameter is required
        if you configure the Compute Engine instance using the “Instance Zone” and
        “Instance ID” parameters.
    is_mandatory: false
-   name: Instance ID
    default_value: ''
    type: string
    description: The Compute Engine instance ID. This parameter is required if you
        configure the Compute Engine instance using the “Instance Zone” and “Instance
        ID” parameters.
    is_mandatory: false
-   name: Network Tags
    default_value: ''
    type: string
    description: A comma-separated list of network tags to remove from the Compute
        Engine instance. This parameter only accepts tags that contain lowercase letters,
        numbers, and hyphens.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/remove_network_tags_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
