name: Stop Instance
description: Stops a running instance, shutting it down cleanly, and allows you to
    restart the instance at a later time. Stopped instances do not incur VM usage
    charges while they are stopped. However, resources that the VM is using, such
    as persistent disks and static IP addresses, will continue to be charged until
    they are deleted.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-compute#stop-instance
integration_identifier: GoogleCloudCompute
parameters:
-   name: Resource Name
    default_value: ''
    type: string
    description: 'Specify the full resource name for the compute instance. Format:
        /projects/{project_id}/zones/{zone id}/instances/{instance id}. This parameter
        has higher priority over the combination of "Project ID", "Instance Zone"
        and "Instance ID".'
    is_mandatory: false
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project of your compute instance. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Instance Zone
    default_value: ''
    type: string
    description: Specify instance zone name to search for instances in.
    is_mandatory: false
-   name: Instance ID
    default_value: ''
    type: string
    description: Specify instance id to stop. Instance id can be found in "List Instances"
        action.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/stop_instance_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
