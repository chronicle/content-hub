name: Set Instance IAM Policy
description: Sets the access control policy on the specified resource. Note that policy
    provided in action replaces any existing policy.
integration_identifier: GoogleCloudCompute
parameters:
-   name: Resource Name
    default_value: ''
    type: string
    description: 'Specify the full resource name for the compute instance. Format:
        /projects/{project_id}/zones/{zone id}/instances/{instance id}. This parameter
        has higher priority over the combination of "Project ID", "Instance Zone"
        and "Instance ID".'
    is_mandatory: false
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project of your compute instance. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Instance Zone
    default_value: ''
    type: string
    description: Specify instance zone name to search for instances in.
    is_mandatory: false
-   name: Instance ID
    default_value: ''
    type: string
    description: Specify instance id to set policy for. Intsance id can be found in
        "List Instances" action.
    is_mandatory: false
-   name: Policy
    default_value: ''
    type: string
    description: Specify JSON policy document to set for instance.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/set_instance_iam_policy_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
