name: Remove External IP Addresses
description: 'Remove external IP addresses on a Google Cloud Compute instance. Note:
    Action is running as async, please adjust script timeout value in Google SecOps
    IDE for action, as needed.'
integration_identifier: GoogleCloudCompute
parameters:
-   name: Resource Name
    default_value: ''
    type: string
    description: 'Specify the full resource name for the compute instance. Format:
        projects/{project_id}/zones/{zone_id}/instances/{instance_id}. This parameter
        has higher priority over the combination of "Project ID", "Instance Zone"
        and "Instance ID".'
    is_mandatory: false
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project of your compute instance. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Instance Zone
    default_value: ''
    type: string
    description: Specify instance zone name to search for instances in.
    is_mandatory: false
-   name: Instance ID
    default_value: ''
    type: string
    description: Specify instance id to modify. Instance id can be found in "List
        Instances" action.
    is_mandatory: false
-   name: Network Interfaces
    default_value: '*'
    type: string
    description: Specify a comma-separated list of network interfaces to modify. If
        this parameter is left empty or  “*” is provided then all of the network interfaces
        will be updated.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/remove_external_ip_addresses_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
