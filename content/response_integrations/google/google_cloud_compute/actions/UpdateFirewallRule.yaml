name: Update Firewall Rule
description: 'Update a firewall rule with given parameters in Google Cloud Compute.
    Note: Action is running as async, please adjust script timeout value in Google
    SecOps IDE for action, as needed.'
integration_identifier: GoogleCloudCompute
parameters:
-   name: Resource Name
    default_value: ''
    type: string
    description: 'Specify the full resource name for the firewall rule. Format: projects/{project_id}/global/firewalls/{firewall}.
        This parameter has higher priority over the combination of "Project ID", and
        "Firewall Rule".'
    is_mandatory: false
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project of your firewall rule. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Firewall Rule
    default_value: ''
    type: string
    description: Specify firewall rule name to update.
    is_mandatory: false
-   name: Source IP ranges
    default_value: ''
    type: string
    description: Specify a comma-separated list of source IP ranges. Parameter supports
        'none' value. If "none" value is provided, then the action will delete existing
        values for the firewall rule. If nothing is provided for the parameter, action
        will not update the existing value.
    is_mandatory: false
-   name: Source Tags
    default_value: ''
    type: string
    description: Specify a comma-separated list of source tags. Parameter supports
        'none' value. If "none" value is provided, then the action will delete existing
        values for the firewall rule. If nothing is provided for the parameter, action
        will not update the existing value.
    is_mandatory: false
-   name: Source Service Accounts
    default_value: ''
    type: string
    description: Specify a comma-separated list of source service accounts. Parameter
        supports 'none' value. If "none" value is provided, then the action will delete
        existing values for the firewall rule. If nothing is provided for the parameter,
        action will not update the existing value.
    is_mandatory: false
-   name: TCP Ports
    default_value: ''
    type: string
    description: Specify a comma-separated list of TCP ports. If specified, action
        will use it to update determine allow / deny lists. Parameter supports 'all'
        and 'none' values.
    is_mandatory: false
-   name: UDP Ports
    default_value: ''
    type: string
    description: Specify a comma-separated list of UDP ports. If specified, action
        will use it to update determine allow / deny lists. Parameter supports 'all'
        and 'none' values.
    is_mandatory: false
-   name: Other Protocols
    default_value: ''
    type: string
    description: Specify a comma-separated list of other protocols. Parameter supports
        'none' value. If 'all' specified, the action will allow all protocols including
        tcp and udp.
    is_mandatory: false
-   name: Destination IP Ranges
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of destination IP ranges. Parameter
        supports ''none'' value. If "none" value is provided, then the action will
        delete existing values for the firewall rule. If nothing is provided for the
        parameter, action will not update the existing value. '
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/UpdateFirewallRule_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
