name: Add IP To Firewall Rule
description: 'Add IP range to firewall rule in Google Cloud Compute instance. Note:
    Action is running as async, please adjust script timeout value in Google SecOps
    IDE for action, as needed.'
integration_identifier: GoogleCloudCompute
parameters:
-   name: Resource Name
    default_value: ''
    type: string
    description: 'Specify the full resource name for the firewall rule. Format: projects/{project_id}/global/firewalls/{firewall}.
        This parameter has higher priority over the combination of "Project ID", and
        "Firewall Rule".'
    is_mandatory: false
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project of your firewall rule. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Firewall Rule
    default_value: ''
    type: string
    description: Specify firewall rule name to update.
    is_mandatory: false
-   name: Type
    default_value: Source
    type: ddl
    optional_values:
    - Source
    - Destination
    description: Type of the IP range that will be added.
    is_mandatory: true
-   name: IP Ranges
    default_value: ''
    type: string
    description: List of IP ranges that needs to be added to the Firewall Rule.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/add_ip_to_firewall_rule_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
