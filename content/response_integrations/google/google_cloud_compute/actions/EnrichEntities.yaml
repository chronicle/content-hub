name: Enrich Entities
description: Enrich Siemplify IP entities with instance information from Google Cloud
    Compute.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-compute#enrich-entities
integration_identifier: GoogleCloudCompute
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project of your compute instance. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Instance Zone
    default_value: ''
    type: string
    description: Specify instance zone name to search for instances in.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["ADDRESS"]}'
