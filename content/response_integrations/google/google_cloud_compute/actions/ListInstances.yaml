name: List Instances
description: List Google Cloud Compute instances based on the specified search criteria.
    Note that action is not working on Siemplify entities.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-compute#list-instances
integration_identifier: GoogleCloudCompute
parameters:
-   name: Project ID
    default_value: ''
    type: string
    description: Specify the name of the project of your compute instance. If nothing
        is provided, the project will be extracted from integration configuration.
    is_mandatory: false
-   name: Instance Zone
    default_value: ''
    type: string
    description: Specify instance zone name to search for instances in.
    is_mandatory: false
-   name: Instance Name
    default_value: ''
    type: string
    description: Specify instance name to search for. Parameter accepts multiple values
        as a comma separated string.
    is_mandatory: false
-   name: Instance Status
    default_value: ''
    type: string
    description: Specify instance status to search for. Parameter accepts multiple
        values as a comma separated string.
    is_mandatory: false
-   name: Instance Labels
    default_value: ''
    type: string
    description: Specify instance labels to search for in the format label_key_name:label_value,
        for example vm_label_key:label1. Parameter accepts multiple values as a comma
        separated string.
    is_mandatory: false
-   name: Max Rows to Return
    default_value: 50
    type: string
    description: Specify how many instances action should return.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ListInstances_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
