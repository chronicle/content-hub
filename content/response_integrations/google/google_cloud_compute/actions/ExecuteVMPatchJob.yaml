name: Execute VM Patch Job
description: Execute a VM patch job on Compute Engine instances. This action is asynchronous.
    Adjust the script timeout value in the Google SecOps IDE for the action as needed.
    This action requires you to enable the OS Config API.
integration_identifier: GoogleCloudCompute
parameters:
-   name: Instance Filter Object
    default_value: '{

        "all": "true"

        }'
    type: string
    description: A JSON object to set an instance filter.
    is_mandatory: true
-   name: Name
    default_value: ''
    type: string
    description: The name for the patching job.
    is_mandatory: true
-   name: Description
    default_value: ''
    type: string
    description: The description for the patching job.
    is_mandatory: false
-   name: Patching Config Object
    default_value: "{\n    \"rebootConfig\": \"DEFAULT\",\n    \"apt\": {\n      \"\
        type\": \"DIST\"\n    },\n    \"yum\": {\n      \"security\": true\n    },\n\
        \    \"zypper\": {\n      \"withUpdate\": true\n    },\n    \"windowsUpdate\"\
        : {\n      \"classifications\": [\"CRITICAL\", \"SECURITY\"]\n    }\n  }"
    type: string
    description: 'A JSON object that specifies the steps for the patching job to execute.
        If you don’t set a value, the action patches Compute Engine instances using
        the default value. To configure this parameter, use the following format:
        {"key": "value"}.'
    is_mandatory: false
-   name: Patch Duration Timeout
    default_value: '60'
    type: string
    description: The timeout value in minutes for a patching job.
    is_mandatory: true
-   name: Rollout Strategy
    default_value: Zone By Zone
    type: ddl
    optional_values:
    - Zone By Zone
    - Concurrent Zones
    description: The rollout strategy for a patching job.
    is_mandatory: false
-   name: Disruption Budget
    default_value: 10%
    type: string
    description: The disruption budget for a patching job. You can use a specific
        number or a percentage like 10%.
    is_mandatory: true
-   name: Wait For Completion
    default_value: 'true'
    type: boolean
    description: If selected, the action waits for the patching job to complete.
    is_mandatory: false
-   name: Fail If Completed With Errors
    default_value: 'true'
    type: boolean
    description: 'If selected and the patching job status is “Completed with errors”
        or the action reaches a timeout, the action fails. If you didn’t select the
        “Wait For Completion” parameter, the action ignores this parameter. '
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/execute_vm_patch_job_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities":[]}'
