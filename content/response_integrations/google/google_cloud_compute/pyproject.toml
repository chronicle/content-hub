[project]
name = "GoogleCloudCompute"
version = "21.0"
description = "Google Cloud Compute is the Infrastructure as a Service (IaaS) component of Google Cloud Platform which is built on the global infrastructure that runs Google's search engine, Gmail, YouTube and other services. Google Cloud Compute enables users to launch virtual machines (VMs) on demand. VMs can be launched from the standard images or custom images created by users. Google Cloud Compute users must authenticate based on OAuth 2.0 before launching the VMs."
requires-python = ">=3.11,<3.12"
dependencies = [ "google-auth==2.47.0", "requests==2.32.5", "tipcommon",]

[dependency-groups]
dev = [ "cryptography", "integration-testing", "pytest>=9.2.0", "pytest-factoryboy>=2.7.0", "pytest-json-report>=1.5.0", "pytest-mock>=3.14.1", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.3.8-py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.3.8-py3-none-any.whl"
