Execute VM Patch Job:
  ai_description: >-
    ### General Description

    Executes an asynchronous VM patch job on Google Compute Engine instances using
    the OS Config API. This action allows users to define specific patching configurations,
    rollout strategies, and disruption budgets to manage software updates across a
    fleet of virtual machines. It can either trigger the job and finish immediately
    or poll for the job's completion status.


    ### Flow Description

    1. **Initialization**: Extracts and validates parameters, ensuring JSON objects
    are correctly formatted and numeric values are positive.

    2. **Job Initiation**: On the first execution, it sends a POST request to the
    Google Cloud OS Config API (`v1/projects/{project_id}/patchJobs:execute`) to start
    the patch job using the provided filter and configuration.

    3. **Immediate Return**: If 'Wait For Completion' is set to false, the action
    returns the job details and finishes successfully.

    4. **Asynchronous Polling**: If 'Wait For Completion' is true, the action enters
    an 'In Progress' state. In subsequent runs, it polls the status of the patch job
    using a GET request to the OS Config API.

    5. **Terminal State Check**: The action monitors the job state (STARTED, PATCHING,
    SUCCEEDED, etc.). It completes successfully when the job succeeds, or fails if
    the job is cancelled, times out, or completes with errors (depending on user configuration).


    ### Additional Notes

    - This action requires the OS Config API to be enabled in the target Google Cloud
    project.

    - The action is asynchronous; if 'Wait For Completion' is enabled, it will poll
    the Google Cloud API until the job succeeds, fails, or times out.
  ai_short_description: >-
    Executes an asynchronous VM patch job on Google Compute Engine instances using
    the OS Config API to manage software updates across a fleet of virtual machines.
