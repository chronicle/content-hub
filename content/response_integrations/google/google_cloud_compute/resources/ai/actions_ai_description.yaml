Add IP To Firewall Rule:
  ai_description: >-
    ### General Description

    This action adds specified IP ranges to an existing firewall rule in a Google
    Cloud Compute (GCP) project. It supports updating either the source ranges or
    destination ranges of the rule. The action operates asynchronously, initiating
    a patch operation and then monitoring its status until completion.


    ### Flow Description

    1. **Validation**: The action validates that either a 'Resource Name' or 'Firewall
    Rule' is provided. It also parses the 'IP Ranges' CSV and validates the 'Type'
    selection.

    2. **Fetch Current State**: It retrieves the current configuration of the specified
    firewall rule from Google Cloud Compute via a GET request.

    3. **Modify Configuration**: The action appends the new IP ranges to the existing
    list (source or destination) within the rule's data model.

    4. **Initiate Update**: It sends a PATCH request to the GCP API to update the
    firewall rule with the modified configuration.

    5. **Async Monitoring**: The action enters an asynchronous loop, periodically
    checking the status of the GCP operation until it is finished or times out.

    6. **Finalization**: Upon successful completion, it fetches the final state of
    the firewall rule and returns it as the action result.


    ### Additional Notes

    - Either the **Resource Name** or the **Firewall Rule** name must be provided
    for the action to identify the target rule.

    - The action is asynchronous; it will wait for the GCP operation to reach a 'DONE'
    status before finishing.
  ai_short_description: >-
    Adds specified IP ranges to the source or destination ranges of an existing firewall
    rule in Google Cloud Compute.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
