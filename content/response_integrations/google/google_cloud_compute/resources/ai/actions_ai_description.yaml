Remove IP From Firewall Rule:
  ai_description: >-
    ### General Description

    This action removes specific IP ranges from an existing firewall rule in Google
    Cloud Compute. It allows users to modify either the source or destination IP ranges
    of a rule by providing a list of IPs to be excluded. The action operates asynchronously,
    meaning it initiates the change and then monitors the Google Cloud operation until
    it reaches a 'DONE' status.


    ### Flow Description

    1. Extracts the target firewall rule identifiers and the list of IP ranges to
    remove from the action parameters.

    2. Validates the IP ranges and the range type (Source or Destination).

    3. Fetches the current configuration of the specified firewall rule from Google
    Cloud Compute via an HTTP GET request.

    4. Identifies the specified IP ranges within the rule's existing configuration
    and removes them from the local data model.

    5. Sends an HTTP PATCH request to the Google Cloud Compute API to update the firewall
    rule with the modified IP list.

    6. Enters an asynchronous loop, polling the status of the Google Cloud operation
    until the update is finalized.


