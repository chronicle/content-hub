Remove Network Tags:
  ai_description: >-
    ### General Description

    Removes specific network tags from a Google Cloud Compute Engine instance. This
    action is asynchronous and modifies the instance's configuration in Google Cloud
    Platform (GCP). It automatically handles the instance's 'fingerprint' to ensure
    configuration consistency during the update process.


    ### Flow Description

    1. **Parameter Validation**: The action verifies that the target instance is correctly
    identified via the provided parameters and that the tags to remove are specified.

    2. **Current State Retrieval**: It fetches the current instance details from GCP
    via the `get_instance` API to retrieve the existing network tags and the current
    'fingerprint' required for the update.

    3. **Tag Processing**: The action calculates the new set of tags by removing the
    user-specified tags from the existing list of tags on the instance.

    4. **Update Execution**: It sends a request to GCP via the `set_instance_tags`
    API to update the instance's tags with the new list and the retrieved fingerprint.

    5. **Asynchronous Monitoring**: The action monitors the status of the GCP operation.
    If the operation is still in progress, the action remains in an 'IN_PROGRESS'
    state.

    6. **Completion**: Once the operation is finished, the action retrieves the final
    instance configuration and returns it as the result.


    ### Additional Notes

    Either the 'Resource Name' parameter OR both the 'Instance Zone' and 'Instance
    ID' parameters must be configured for the action to identify the target instance.
