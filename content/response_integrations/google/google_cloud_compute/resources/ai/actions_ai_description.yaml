Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is designed to verify the connectivity between Google SecOps
    and the Google Cloud Compute service. It ensures that the provided integration
    configuration parameters (such as API Root, Project ID, and Service Account credentials)
    are correct and that the environment can successfully communicate with the Google
    Cloud API.


    ### Flow Description

    1. **Parameter Extraction:** The action retrieves all necessary configuration
    parameters from the integration settings, including API URLs, Project ID, and
    authentication credentials.

    2. **Validation:** It performs basic validation on the provided Service Account
    JSON and Workload Identity Email formats to ensure they are syntactically correct.

    3. **Manager Initialization:** It initializes the `GoogleCloudComputeManager`
    with the `force_test_connectivity` flag enabled.

    4. **Connectivity Test:** The manager executes a GET request to the Google Cloud
    Compute API (specifically the zones endpoint with a limit of 1 result) to test
    the connection.

    5. **Result Reporting:** If the API call is successful, the action completes with
    a success message. If an error occurs, it catches the exception and reports a
    failure with the specific error details.


    ### Additional Notes

    This action is typically used during the initial setup or troubleshooting of the
    Google Cloud Compute integration to confirm that the authentication and network
    settings are valid. It does not process any entities.
