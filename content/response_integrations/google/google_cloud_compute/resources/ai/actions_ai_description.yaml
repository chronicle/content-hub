Delete Instance:
  ai_description: >-
    ### General Description

    Deletes a specified Google Cloud Compute instance. This action is a destructive
    operation that permanently removes a virtual machine resource from a Google Cloud
    Platform (GCP) project. It can identify the target instance either through a full
    resource name or a combination of Project ID, Zone, and Instance ID.


    ### Flow Description

    1. Extracts the GCP connection details from the integration configuration and
    the instance identifiers from the action parameters.

    2. Validates that either a full 'Resource Name' or the 'Instance Zone' and 'Instance
    ID' pair is provided.

    3. Establishes a connection to the Google Cloud Compute API using the provided
    credentials.

    4. Constructs the exact API path for the instance based on the provided parameters.

    5. Sends a DELETE request to the GCP Compute API to initiate the instance removal.

    6. Captures the GCP operation response, formats the zone information, and returns
    the operation details as a JSON result to the SOAR platform.


    ### Additional Notes

    - Either the **Resource Name** must be provided, OR both the **Instance Zone**
    and **Instance ID** must be configured for the action to execute successfully.

    - This action returns the raw operation data from GCP, which can be used to track
    the deletion progress.
