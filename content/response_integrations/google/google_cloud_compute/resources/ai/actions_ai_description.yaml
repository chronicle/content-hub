Remove External IP Addresses:
  ai_description: >-
    ### General Description

    Removes external IP addresses from a Google Cloud Compute instance by deleting
    its access configurations. This action is designed to reduce the attack surface
    of a VM by ensuring it is only accessible via internal networking. It can target
    specific network interfaces or all interfaces on a given instance. The action
    operates asynchronously, initiating the removal process and then polling Google
    Cloud for the operation's completion status.


    ### Flow Description

    1. Validates that either a full Resource Name or the Zone/ID pair is provided.

    2. Fetches the current configuration of the target instance to identify existing
    network interfaces and their access configurations.

    3. Filters the instance's network interfaces based on the 'Network Interfaces'
    parameter.

    4. For each matching interface, updates the stack type to `IPV4_ONLY` if it is
    currently different, and deletes all associated `accessConfigs` (which effectively
    removes the external/NAT IP addresses) via the Google Cloud Compute API.

    5. Initiates the deletion operations and transitions to an asynchronous state,
    periodically checking the status of the operations until they are marked as `DONE`
    or a timeout occurs.


    ### Additional Notes

    - **Mandatory Inputs**: You must provide either the 'Resource Name' OR both the
    'Instance Zone' and 'Instance ID'.

    - **Async Execution**: This action is asynchronous. It will return an 'In Progress'
    status while waiting for Google Cloud to complete the network configuration changes.
    Ensure the script timeout in the IDE is sufficient for long-running operations.
