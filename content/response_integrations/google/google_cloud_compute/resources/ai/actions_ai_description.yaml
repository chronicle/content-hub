Update Firewall Rule:
  ai_description: >-
    ### General Description

    Updates an existing firewall rule in Google Cloud Compute with specified parameters.
    This action allows for granular modification of firewall configurations, including
    source/destination IP ranges, network tags, service accounts, and protocol/port
    specifications (TCP, UDP, and others). It operates asynchronously, initiating
    a patch operation and monitoring its progress until completion.


    ### Flow Description

    1. Validates the provided parameters, ensuring that the target rule is identified
    and at least one update field is specified.

    2. Retrieves the current state of the specified firewall rule from Google Cloud
    Compute.

    3. Updates the local firewall rule object with the new values provided in the
    parameters, handling special keywords like 'all' and 'none'.

    4. Sends a PATCH request to the Google Cloud Compute API to apply the changes.

    5. Monitors the asynchronous operation status until it completes.

    6. Retrieves the final updated firewall rule and returns the result JSON.


    ### Additional Notes

    - Either **Resource Name** or **Firewall Rule** must be configured for the action
    to identify the target rule.

    - At least one update parameter (e.g., Source IP ranges, TCP Ports, etc.) must
    be provided for the action to execute.

    - The action is asynchronous; ensure the script timeout in the Google SecOps IDE
    is sufficient for the GCP operation to complete.
