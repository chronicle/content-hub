Add Labels To Instance:
  ai_description: >-
    Adds labels to a Google Cloud Compute instance. This action allows users to tag
    GCP instances with metadata in the form of key-value pairs, which is useful for
    organization, billing, and automation.


    ### Flow Description

    1. **Parameter Extraction**: Retrieves the instance identifiers and the list of
    labels to be added.

    2. **Validation**: Validates the format of the labels and ensures sufficient identification
    parameters (Resource Name or Zone/ID) are provided.

    3. **Data Retrieval**: Fetches the current state of the instance from Google Cloud
    to obtain the existing labels and the `labelFingerprint` required for atomic updates.

    4. **Label Filtering**: Compares the provided labels against existing ones to
    identify which keys are new.

    5. **External Mutation**: If new labels are identified, it sends a POST request
    to the Google Cloud Compute API to update the instance labels.

    6. **Result Processing**: Returns the operation details and a summary of the labels
    successfully added.


    ### Additional Notes

    - The action requires either the 'Resource Name' OR both 'Instance Zone' and 'Instance
    ID' to identify the target instance.

    - Labels with keys that already exist on the instance will not be updated to prevent
    accidental overwrites; only new keys are added.
