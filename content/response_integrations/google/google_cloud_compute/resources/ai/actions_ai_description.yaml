Add Network Tags:
  ai_description: >-
    ### General Description

    Adds network tags to a Google Cloud Compute Engine instance. This action allows
    for the dynamic modification of instance tags, which are often used for network
    filtering and firewall rule application within GCP. The action is asynchronous,
    meaning it initiates the change and then polls for completion.


    ### Flow Description

    1. **Validation:** The action validates that the target instance is correctly
    identified via parameters and that the provided network tags are valid.

    2. **Data Retrieval (First Run):** It fetches the current state of the instance
    from GCP via a GET request to obtain the existing network tags and the resource
    'fingerprint' (required for optimistic locking during updates).

    3. **Tag Merging:** It combines the existing tags with the new tags provided in
    the input.

    4. **Initiate Update:** It sends a POST request to GCP to update the instance
    tags using the calculated list and the fingerprint.

    5. **Async Polling:** The action enters an asynchronous state, periodically checking
    the status of the GCP operation.

    6. **Completion:** Once the operation is finished, it retrieves the updated instance
    details and returns them as the action result.


    ### Additional Notes

    - **Asynchronous Execution:** This action initiates an operation in GCP and waits
    for it to reach a 'DONE' status. You may need to adjust the script timeout in
    the Google SecOps IDE.

    - **Parameter Priority:** Either the 'Resource Name' must be provided, or both
    'Instance Zone' and 'Instance ID' must be provided for the action to identify
    the target instance.

    - **Tag Merging:** This action retrieves existing tags and performs a union with
    the new tags provided, ensuring no existing tags are lost.
  ai_short_description: >-
    Adds network tags to a Google Cloud Compute Engine instance, merging them with
    existing tags.
