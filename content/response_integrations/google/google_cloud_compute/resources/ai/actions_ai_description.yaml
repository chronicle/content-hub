Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches IP Address entities with metadata from Google Cloud Compute (GCP) instances.
    This action identifies which GCP instances are associated with the provided IP
    addresses and retrieves detailed information such as instance ID, status, zone,
    machine type, labels, network interfaces, and service accounts.


    ### Flow Description

    1. Initializes the Google Cloud Compute manager using integration credentials.

    2. Fetches a list of VM instances from GCP via a GET request to the Compute API
    (either aggregated or zone-specific based on parameters).

    3. Iterates over the target IP Address entities.

    4. Checks the network interfaces of the retrieved instances to find a match for
    the entity's IP address.

    5. Updates the entity's additional properties with the matched instance metadata
    and marks the entity as enriched.

    6. Generates a data table for each enriched entity and attaches the raw JSON result
    to the action output.


    ### Additional Notes

    If multiple instances match a single IP address, the action prioritizes 'RUNNING'
    instances and selects the most recently created one.
