    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data (a password) from an external system (CyberArk) via
      an SSH command execution. It does not mutate external data (it only reads the
      password), nor does it mutate internal data, update entities, create insights,
      or add case comments.
