Add Entities To Blocklist:
  ai_description: >-
    ### General Description

    Adds specific entities to a blocklist in Trend Micro Cloud App Security. Supported
    entity types include URL, FileHash (SHA-1 only), and User (must match an email
    address pattern).


    ### Flow Description

    1. Initializes the connection to the Trend Micro Cloud App Security API using
    the provided integration credentials.

    2. Retrieves the list of currently blocked entities from the external system via
    a GET request.

    3. Iterates through the target entities in the case, filtering for URL, User,
    and FileHash types.

    4. Validates the format of each entity (e.g., valid URL, email regex for User,
    40-character length for SHA-1 hashes).

    5. Checks if the validated entity is already present in the retrieved blocklist.

    6. If the entity is not already blocked, makes a POST request to the Trend Micro
    Cloud App Security API to add the entity to the blocklist.

    7. Aggregates the results (successful, failed, and already blocked) and returns
    a summary message.


    ### Additional Notes

    - Only SHA-1 hashes are supported for FileHash entities.

    - User entities must match a valid email address pattern to be processed.
  ai_short_description: >-
    Adds URL, FileHash (SHA-1), and User (email) entities to a blocklist in Trend
    Micro Cloud App Security to prevent future interactions.
