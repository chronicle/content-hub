Entity Email Search:
  ai_description: >-
    ### General Description

    Searches for emails related to specific entities (URL, File Hash, File Name, User,
    Address, Email Message) in Trend Micro Cloud App Security. This action retrieves
    email details associated with the provided indicators and returns them as a JSON
    result for further analysis.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters entities based on supported types: URL, User (must match an email pattern),
    File Hash (must be SHA-1 or SHA-256), Email Message, File Name, and Address.

    3. Makes a GET request to the Trend Micro Cloud App Security API (`/v1/sweeping/mails`)
    for each valid entity to search for associated emails within the specified timeframe.

    4. Aggregates unique email results up to the specified maximum limit.

    5. Returns the collected email details as a JSON object attached to the action
    result.


    ### Additional Notes

    - Only SHA-1 and SHA-256 hashes are supported for File Hash entities.

    - User entities are only processed if their identifier matches a valid email address
    pattern.
