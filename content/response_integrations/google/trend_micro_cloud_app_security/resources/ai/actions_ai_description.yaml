Mitigate Accounts:
  ai_description: >-
    ### General Description

    Performs mitigation actions on user accounts via Trend Micro Cloud App Security.
    Supported actions include disabling the account, enabling Multi-Factor Authentication
    (MFA), resetting the password, and revoking sign-in sessions. Note that only Exchange
    accounts are supported by this action.


    ### Flow Description

    1. Parses the provided comma-separated list of email addresses and validates their
    format.

    2. Initiates the specified mitigation action (e.g., Disable Account, Reset Password)
    for the valid email addresses by making a POST request to the Trend Micro Cloud
    App Security API.

    3. Since the action is asynchronous, it periodically queries the API using a GET
    request to check the status of the mitigation process.

    4. Once the mitigation is complete, it returns the final status (success, skipped,
    or failed) for each account and completes the execution.


    ### Additional Notes

    Only Exchange accounts are supported. Invalid email formats will be skipped and
    reported in the output.
