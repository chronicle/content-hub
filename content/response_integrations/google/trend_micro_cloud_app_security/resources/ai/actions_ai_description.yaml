    ID, and delivery time.

    6. Executes the mitigation action (Delete or Quarantine) via a POST request to
    the Trend Micro Cloud App Security API.

    7. Returns a summary of successfully and unsuccessfully mitigated emails.


    ### Additional Notes

    Currently, the action only initiates a mitigation but doesn't check the status
    of the mitigation execution. For Gmail, only the Delete action is supported.
