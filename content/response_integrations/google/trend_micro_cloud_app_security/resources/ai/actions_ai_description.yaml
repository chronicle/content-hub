Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches URL, File Hash, and User (Email) entities by checking their presence
    in the Trend Micro Cloud App Security blocklist.


    ### Flow Description

    1. Initializes the Trend Micro Cloud App Security manager.

    2. Retrieves the list of currently blocked entities (URLs, senders, and hashes)
    from Trend Micro Cloud App Security via an API call (`GET /v1/remediation/mails`).

    3. Iterates through the target entities in the case.

    4. For URL entities, extracts the hostname and checks if it exists in the blocked
    URLs list.

    5. For User entities, validates if the identifier matches an email pattern and
    checks if it exists in the blocked senders list.

    6. For File Hash entities, validates if it is a SHA-1 hash and checks if it exists
    in the blocked hashes list.

    7. If an entity is found in the blocklist, it is marked as suspicious, and its
    additional properties are updated to indicate it is blocked (`TMCAS_blocked: True`).

    8. If an entity is not found, its additional properties are updated to indicate
    it is not blocked (`TMCAS_blocked: False`).

    9. Updates the entities in the Google SecOps platform and attaches a JSON result
    containing the blocked entities.


    ### Additional Notes

    The action only supports SHA-1 hashes for File Hash entities and uses the domain
    part of the URL during enrichment.
  ai_short_description: >-
    Enriches URL, File Hash, and User (Email) entities by checking if they are present
    in the Trend Micro Cloud App Security blocklist, updating their suspicious status
    and additional properties accordingly.
