name: Sync Alerts
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: The name of the environment from which to sync alerts.
    is_mandatory: true
-   name: Login API Root
    default_value: https://login.microsoftonline.com
    type: string
    description: Login API root of the Microsoft Defender XDR instance.
    is_mandatory: true
-   name: Graph API Root
    default_value: https://graph.microsoft.com
    type: string
    description: API root of the Microsoft Graph service.
    is_mandatory: true
-   name: API Root
    default_value: https://api.security.microsoft.com
    type: string
    description: API root of the Microsoft Defender XDR instance.
    is_mandatory: true
-   name: Tenant ID
    default_value: ''
    type: string
    description: Microsoft Defender XDR account tenant ID.
    is_mandatory: true
-   name: Client ID
    default_value: ''
    type: string
    description: Microsoft Defender XDR account client ID.
    is_mandatory: true
-   name: Client Secret
    default_value: ''
    type: password
    description: Microsoft Defender XDR account client secret.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: The number of hours to synchronize alerts prior to the current time.
        The default value is `24`.
    is_mandatory: true
-   name: Sync Assignee
    default_value: false
    type: boolean
    description: If enabled, job will sync assignee from Microsoft Defender XDR to
        Google SecOps.
    is_mandatory: false
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If selected, the integration validates the SSL certificate when connecting
        to the Microsoft Defender XDR server. Enabled by default.
    is_mandatory: true
-   name: Sync Direction
    default_value: "{\n  \"Status\": \"Bidirectional\",\n  \"Comments\": \"Bidirectional\"\
        \n}"
    type: string
    description: 'JSON mapping to control sync direction per feature. Options: ''Bidirectional'',
        ''toXDR'', ''toSecOps'', ''None''. Supported keys: ''Status'', ''Comments''.'
    is_mandatory: false
-   name: Closed Reason Mapping
    default_value: "{\n  \"{reason} | {root cause}\": {\n    \"classification\": \"\
        unknownFutureValue\",\n    \"determination\": \"other\"\n  },\n  \"Malicious\"\
        : {\n    \"classification\": \"truePositive\",\n    \"determination\": \"\
        maliciousUserActivity\"\n  },\n  \"NotMalicious\": {\n    \"classification\"\
        : \"falsePositive\",\n    \"determination\": \"notMalicious\"\n  },\n  \"\
        Fallback\": {\n    \"classification\": \"unknownFutureValue\",\n    \"determination\"\
        : \"other\"\n  }\n}"
    type: string
    description: JSON mapping of SecOps Closure Reason|RootCause pairs to Defender
        XDR classification and determination. Must include a 'Fallback' entry.
    is_mandatory: false
description: 'This job synchronizes Google SecOps Alerts and Microsoft Defender XDR
    Alerts. It ensures that comments and status are synchronized bi-directionally
    between both systems. Note: Assignee synchronization occurs exclusively from Microsoft
    Defender to Google SecOps. For the job to identify the correct information, the
    Google SecOps case must have the "Microsoft Defender XDR Alert" tag. If the alert
    didn’t originate from "Microsoft 365 Defender - Incidents Connector",  you will
    need to add an "Alert_ID" context value to the alert for the job to be able to
    find the correct information.'
documentation_link: null
integration: Microsoft365Defender
creator: Admin
