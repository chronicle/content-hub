Execute Custom Query:
  ai_description: >-
    ### General Description

    Executes a custom Kusto Query Language (KQL) hunting query against Microsoft 365
    Defender's advanced hunting data. This action allows security analysts to perform
    flexible, ad-hoc searches across various data tables (like DeviceProcessEvents,
    EmailEvents, etc.) within the Microsoft 365 Defender environment. The results
    are returned as a structured data table and a JSON object for further automation
    steps.


    ### Flow Description

    1. **Initialization**: The action retrieves connection settings and action parameters
    (`Query`, `Time Frame`, `Start Time`, `End Time`, and `Max Results To Return`).

    2. **Query Preparation**: It appends a time filter (if selected) and a `| limit`
    clause to the user-provided query to ensure the result set size is controlled.

    3. **API Execution**: It first attempts to execute the query using the Microsoft
    Graph API (`/beta/security/runHuntingQuery`). If the Graph API call fails due
    to a permission error (403), it automatically falls back to the Legacy Microsoft
    365 Defender API (`/api/advancedhunting/run`).

    4. **Data Processing**: The raw response is parsed into a list of results.

    5. **Output Generation**: If data is found, it populates a SOAR data table named
    'Results' and adds the raw JSON to the action's result object. If no data is found,
    it reports a successful execution with a 'No data found' message.


    ### Additional Notes

    The action automatically appends a limit clause, so the 'top' or 'limit' keywords
    are not required in the input string. If "Custom" is selected for the time frame,
    the start time must be provided.
  ai_short_description: >-
    Executes a custom Kusto Query Language (KQL) hunting query against Microsoft 365
    Defender's advanced hunting data.
