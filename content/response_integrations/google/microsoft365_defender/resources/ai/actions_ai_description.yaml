Execute Entity Query:
  ai_description: >-
    ### General Description

    Executes advanced hunting queries in Microsoft 365 Defender based on the entities
    present in the current Google SecOps context. This action automatically constructs
    a Kusto Query Language (KQL) 'where' clause by mapping entity identifiers (IPs,
    Hostnames, Users, Hashes, and URLs) to specific table columns defined in the action
    parameters. It allows for complex cross-entity logic (AND/OR) and supports custom
    timeframes and result sorting. The retrieved data is returned as a structured
    data table and a JSON result for downstream automation.


    ### Flow Description

    1. **Initialization:** Retrieves integration credentials and action parameters,
    including table names and entity-to-column mappings.

    2. **Entity Categorization:** Scans the scope for supported entities (IP, Hostname,
    User, File Hash, URL) and groups them by type. It also checks the user entity's
    additional properties to determine if it is an email address.

    3. **Query Construction:** Builds a KQL query string. It creates `where` filters
    for each entity type using the provided keys and joins them using the `Cross Entity
    Operator`.

    4. **Execution:** Sends the generated query to Microsoft 365 Defender's hunting
    endpoint.

    5. **Result Processing:** Parses the response into a CSV-formatted data table
    and a JSON object, which are then attached to the action output.


    ### Additional Notes

    - **Entity Mapping:** You must provide the correct column names (keys) for the
    tables you are querying. For example, if querying `DeviceLogonEvents`, the `User
    Entity Key` should likely be `AccountName`.

    - **API Fallback:** The action attempts to use the Microsoft Graph API first and
    falls back to the legacy Defender Advanced Hunting API if permission issues occur.
