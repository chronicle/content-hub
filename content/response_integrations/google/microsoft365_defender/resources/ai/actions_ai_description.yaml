Add Comment To Incident:
  ai_description: >-
    ### General Description

    Adds a comment to a specific incident in Microsoft 365 Defender. This action is
    used to document findings, provide updates, or add context to an existing incident
    within the Microsoft 365 Defender portal directly from Google SecOps.


    ### Flow Description

    1. **Initialization**: The action initializes the Microsoft 365 Defender manager
    using the provided integration configuration.

    2. **Parameter Validation**: It extracts and validates the `Incident ID` and `Comment`
    parameters. The `Incident ID` is converted to an integer format required by the
    API.

    3. **API Interaction**: The action sends a POST request to the Microsoft Graph
    API endpoint (`/v1.0/security/incidents/{incident_id}/comments`) containing the
    comment text.

    4. **Error Handling**: If the incident is not found (404 error), it raises a specific
    `NotFoundItemException`. Other API errors are caught and reported as execution
    failures.

    5. **Completion**: Upon a successful API response, the action returns a success
    status and an informative output message.


    ### Additional Notes

    None.
  ai_short_description: >-
    Adds a comment to a specific incident in Microsoft 365 Defender.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
