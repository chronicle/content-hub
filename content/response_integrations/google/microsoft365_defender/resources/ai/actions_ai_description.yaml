Update Incident:
  ai_description: >-
    ### General Description

    Updates the details of a specific incident in Microsoft 365 Defender. This action
    allows security analysts to programmatically modify an incident's status, classification,
    determination, and assignee directly from Google SecOps.


    ### Flow Description

    1. Extracts the integration configuration and action parameters (Incident ID,
    Status, Classification, Determination, Assign To).

    2. Validates that at least one of the optional update parameters is provided.

    3. Maps the provided dropdown values for Classification and Determination to the
    corresponding Microsoft 365 Defender API values.

    4. Initializes the `Microsoft365DefenderManager` and sends a `PATCH` request to
    the Microsoft Graph API (`/v1.0/security/incidents/{incident_id}`) with the update
    payload.

    5. Returns a success message if the incident is updated successfully, or an error
    message if the request fails.


    ### Additional Notes

    - At least one of the optional parameters (`Status`, `Classification`, `Determination`,
    or `Assign To`) must be provided for the action to execute successfully.

    - The `Determination` parameter can only be set if the `Classification` is set
    to `True Positive`.
  ai_short_description: >-
    Updates the status, classification, determination, or assignee of a specific incident
    in Microsoft 365 Defender.
