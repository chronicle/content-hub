name: Microsoft 365 Defender - Incidents Connector
parameters:
-   name: DeviceProductField
    default_value: event_type
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: '@odata.type'
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Login API Root
    default_value: https://login.microsoftonline.com
    type: string
    description: Login API root of the Microsoft 365 Defender instance.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Graph API Root
    default_value: https://graph.microsoft.com
    type: string
    description: API root of the Microsoft Graph service.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Root
    default_value: https://api.security.microsoft.com
    type: string
    description: API root of the Microsoft 365 Defender service.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Tenant ID
    default_value: ''
    type: string
    description: Microsoft 365 Defender account tenant ID.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client ID
    default_value: ''
    type: string
    description: Microsoft 365 Defender account client ID.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Client Secret
    default_value: ''
    type: password
    description: Microsoft 365 Defender account client secret.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Microsoft 365 Defender server is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Lowest Severity To Fetch
    default_value: ''
    type: string
    description: 'Lowest severity that will be used to fetch incidents. Possible values:
        Informational, Low, Medium, High.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Hours Backwards
    default_value: 1
    type: integer
    description: Number of hours before the first connector iteration to retrieve
        incidents from. This parameter applies to the initial connector iteration
        after you enable the connector for the first time, or used as a fallback value
        in cases where connector's last run timestamp expires.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Incidents To Fetch
    default_value: 10
    type: integer
    description: How many incidents  to process per one connector iteration. Maximum
        is 20.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Dynamic List Field
    default_value: Incident Name
    type: string
    description: 'Field that can be used in the dynamic list for filtering. Possible
        values: Incident Name, Alert Name. If nothing is provided, connector will
        work with the incident name.'
    is_mandatory: false
    is_advanced: true
    mode: regular
-   name: Incident Status Filter
    default_value: Active, In Progress
    type: string
    description: 'A comma-separated list of incident statuses that need to be ingested.
        If nothing is provided, the connector will ingest incidents with status “Active”
        and “In Progress”. Possible values:

        Active, In Progress, Resolved, Redirected.

        Note: it’s not recommended to ingest redirected incidents, because in most
        situations they will be empty.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Alert Detection Source Filter
    default_value: ''
    type: string
    description: 'A comma-separated list of detection sources of alerts that need
        to be ingested. Note: this is a case sensitive parameter. Example of the values:

        antivirus, microsoftDefenderForEndpoint'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Service Source Filter
    default_value: ''
    type: string
    description: 'A comma-separated list of service sources of alerts that need to
        be ingested. Note: this is a case sensitive parameter. Example of the values:

        antivirus, microsoftDefenderForEndpoint'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident Assignee Filter
    default_value: ''
    type: string
    description: A comma-separated list of assignees of incidents that need to be
        ingested.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Incident Tags Filter
    default_value: ''
    type: string
    description: A comma-separated list of tags of incidents that need to be ingested.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Use whitelist as a blacklist
    default_value: false
    type: boolean
    description: If enabled, whitelist will be used as a blacklist.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If enabled, connector will ignore the overflow mechanism.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Lowest Alert Severity To Fetch
    default_value: ''
    type: string
    description: 'Lowest severity that will be used to fetch alerts. Possible values:
        Informational, Low, Medium, High.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Disable Alert Tracking
    default_value: false
    type: boolean
    description: If enabled, the connector will stop tracking updates associated with
        alerts.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: 'Pull information about incidents and related alerts from Microsoft 365
    Defender. Note: whitelist works with an incident name.'
integration: Microsoft365Defender
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-365-defender#microsoft-365-defender-incidents-connector
rules: []
is_connector_rules_supported: false
creator: admin
