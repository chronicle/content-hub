name: Update Incident
description: Update incident in Microsoft 365 Defender.
integration_identifier: Microsoft365Defender
parameters:
-   name: Incident ID
    default_value: ''
    type: string
    description: Specify the id of the incident that needs to be updated.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Active
    - Resolved
    description: Specify what status to set for the incident.
    is_mandatory: false
-   name: Classification
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - False Positive
    - True Positive
    description: Specify what classification to set for the incident..
    is_mandatory: false
-   name: Determination
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Not Available
    - Apt
    - Malware
    - Security Personnel
    - Security Testing
    - Unwanted Software
    - Other
    description: 'Specify what determination to set for the incident. Note: determination
        can only be set, when classification is true positive.'
    is_mandatory: false
-   name: Assign To
    default_value: ''
    type: string
    description: Specify to whom to assign this incident.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
