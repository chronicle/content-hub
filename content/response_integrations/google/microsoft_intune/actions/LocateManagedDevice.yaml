name: Locate Managed Device
description: Locate managed device with the Microsoft Intune service. The action starts
    the task, to check the current task status, run "Get Managed Device" action and
    see "deviceActionResults" section for task status.  The host name to run the action
    on can be provided either as a Siemplify entity or as an action input parameter.
    If the host name is passed to action both as an entity and input parameter - action
    will be executed on the input parameter. Host name is case insensitive. Action
    also can be provided with the host id to run on. If both host id and hostname
    are provided, action will run on the host id as a priority.  Please refer to our
    doc portal for more details.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-intune#locate_managed_device
integration_identifier: MicrosoftIntune
parameters:
-   name: Host Name
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of host names to run the action on.
        Host name is case insensitive. If the action does not run on a hostname entity,
        it can run either on Host Name or Host ID. Note: if both "Host Name" and "Host
        Id" are provided, then "Host Id" value will have priority. Multiple values
        can be as a comma-separated string.'
    is_mandatory: false
-   name: Host Id
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of host ids to run the action on.
        If the action does not run on a hostname entity, it can run either on Host
        Name or Host ID. Note: if both "Host Name" and "Host Id" are provided, then
        "Host Id" value will have priority. Multiple values can be as a comma-separated
        string.'
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
