identifier: MicrosoftIntune
name: Microsoft Intune
parameters:
-   name: Azure AD endpoint
    default_value: https://login.microsoftonline.com
    type: string
    description: Azure AD endpoint to connect to. Can be different for different tenant
        types.
    is_mandatory: true
    integration_identifier: MicrosoftIntune
-   name: Microsoft Graph Endpoint
    default_value: https://graph.microsoft.com
    type: string
    description: Microsoft Graph endpoint to connect to. Can be different for different
        tenant types.
    is_mandatory: true
    integration_identifier: MicrosoftIntune
-   name: Client ID
    default_value: ''
    type: string
    description: Specify the client (Application) ID of the Azure AD app to use for
        the integration.
    is_mandatory: true
    integration_identifier: MicrosoftIntune
-   name: Client Secret Value
    default_value: ''
    type: password
    description: Specify the client secret value (not secret ID!) of the Azure AD
        app to use for the integration.
    is_mandatory: true
    integration_identifier: MicrosoftIntune
-   name: Azure Active Directory ID
    default_value: ''
    type: string
    description: Specify the Azure Active Directory ID (Tenant ID). It can be found
        on Azure Active Directory page > App Registration > <Application you configured
        for your integration> > Directory (tenant) ID.
    is_mandatory: true
    integration_identifier: MicrosoftIntune
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Microsoft Intune server is valid.
    is_mandatory: true
    integration_identifier: MicrosoftIntune
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/microsoft-intune
categories:
- Endpoint Security
svg_logo_path: resources/logo.svg
image_path: resources/image.png
