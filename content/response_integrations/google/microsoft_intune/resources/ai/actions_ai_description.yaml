Sync Managed Device:
  ai_description: >-
    ### General Description

    This action initiates a synchronization task for managed devices within the Microsoft
    Intune service. It allows security analysts to force a device to check in with
    the Intune service to receive pending policies, updates, or configurations. The
    action can target devices based on their Host Name or a specific Host ID. It supports
    processing multiple devices in a single execution.


    ### Flow Description

    1. **Initialization**: The action retrieves configuration details for Azure AD
    and Microsoft Graph, including authentication credentials.

    2. **Target Resolution**: It identifies the target hosts by checking the `Host
    Id` parameter, then the `Host Name` parameter, and finally any `HOSTNAME` entities
    present in the case context.

    3. **Device Discovery**: The action fetches a list of managed devices from Microsoft
    Intune to validate the existence of the provided host identifiers.

    4. **Sync Execution**: For every validated device, the action sends a POST request
    to the Microsoft Graph API's `syncDevice` endpoint to trigger the remote synchronization.

    5. **Outcome Summary**: It compiles a report detailing which devices successfully
    started the sync process and which identifiers were not found in the Intune environment.


    ### Additional Notes

    * **Priority Logic**: The action follows a specific hierarchy to determine the
    target: `Host Id` (highest priority) > `Host Name` > `HOSTNAME Entities`.

    * **Requirement**: At least one Host Name, Host ID, or HOSTNAME entity must be
    available for the action to proceed.

    * **Multiple Agents**: If a Host Name is provided and multiple Intune agents are
    found for that name, the action will automatically select the device with the
    most recent `lastSyncDateTime`.
