Remote Lock Managed Device:
  ai_description: >-
    ### General Description

    The **Remote Lock Managed Device** action allows security administrators to remotely
    lock devices managed by Microsoft Intune. This action is used to secure potentially
    compromised or lost devices by triggering the native remote lock functionality
    of the operating system via the Microsoft Graph API. The action can target devices
    using Host IDs, Host Names, or Hostname entities.


    ### Flow Description

    1. **Parameter Initialization**: The action retrieves integration configuration
    (API endpoints, credentials) and user-provided parameters (Host Name and Host
    Id).

    2. **Device Discovery**: It fetches the list of managed devices from Microsoft
    Intune via a GET request to validate the existence of the targets and resolve
    names to IDs.

    3. **Target Identification**:
        - If **Host IDs** are provided, it validates them against the fetched list.
        - If **Host Names** are provided (or derived from `HOSTNAME` entities), it
    resolves them to the corresponding Intune Device IDs.
    4. **Execution**: For every successfully identified device, the action sends a
    POST request to the Microsoft Graph `remoteLock` endpoint to initiate the lock
    command.

    5. **Result Aggregation**: The action tracks successes and failures (e.g., device
    not found, API errors) and provides a consolidated status message to the user.


    ### Additional Notes

    - The action requires at least one identifier (Host Name parameter, Host ID parameter,
    or Hostname entity) to execute. If none are provided, the action will fail.

    - If a Host Name matches multiple devices in Intune, the action automatically
    selects the device with the most recent `lastSyncDateTime` to ensure the most
    active agent is targeted.

    - Host name matching is case-insensitive.
  ai_short_description: >-
    Remotely locks devices managed by Microsoft Intune using Host IDs, Host Names,
    or Hostname entities.
