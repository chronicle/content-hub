Get Managed Device:
  ai_description: >-
    ### General Description

    This action retrieves detailed managed device information from the Microsoft Intune
    service. It allows security analysts to gather context about a device's compliance
    state, operating system version, enrollment details, and recent management actions.
    The action can target devices using specific Host IDs, Host Names, or by processing
    Hostname entities within the Google SecOps environment.


    ### Flow Description

    1. **Authentication:** The action authenticates with the Microsoft Graph API using
    the provided Azure AD credentials.

    2. **Target Identification:** It determines the list of target devices based on
    the priority of input parameters (Host Id, then Host Name) and available Hostname
    entities.

    3. **Inventory Retrieval:** It fetches the current list of all managed devices
    from Intune to verify the existence of the requested targets.

    4. **Detail Enrichment:** For every validated device, the action performs a GET
    request to the Microsoft Graph API (`/v1.0/deviceManagement/managedDevices/{host_id}`)
    to retrieve comprehensive metadata.

    5. **Result Processing:** The retrieved data is formatted into a JSON result and
    attached to the action output.


    ### Additional Notes

    - **Priority Logic:** The action follows a specific hierarchy for identifying
    targets: Host Id (Parameter) > Host Name (Parameter) > Hostname (Entities).

    - **Conflict Resolution:** If multiple managed devices are found in Intune for
    a single hostname, the action automatically selects the record with the most recent
    `lastSyncDateTime`.

    - **Validation:** The action validates that the provided identifiers exist within
    the Intune environment before attempting to fetch full details.
  ai_short_description: >-
    Retrieves detailed managed device information from the Microsoft Intune service
    based on Host IDs, Host Names, or Hostname entities.
