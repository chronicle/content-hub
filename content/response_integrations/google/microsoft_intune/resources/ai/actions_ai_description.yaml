List Managed Devices:
  ai_description: >-
    ### General Description

    The **List Managed Devices** action retrieves a list of devices managed within
    a Microsoft Intune instance based on specified filter criteria. It allows users
    to query the Intune environment for device details such as names, operating systems,
    compliance status, and enrollment dates. This action is designed for broad visibility
    and does not target specific entities within the SOAR case.


    ### Flow Description

    1. **Authentication**: The action authenticates with the Microsoft Graph API using
    the configured integration credentials.

    2. **Data Retrieval**: It sends a GET request to the `/v1.0/deviceManagement/managedDevices`
    endpoint to fetch managed devices.

    3. **Pagination and Filtering**: The action handles API pagination and applies
    the specified filter criteria (Filter Key, Filter Logic, Filter Value) locally
    to the retrieved device list until the `Max Records To Return` limit is reached.

    4. **Output Generation**: The filtered results are formatted into a data table
    named "Available Managed Devices" and attached to the case as a JSON result.


    ### Additional Notes

    - This action does not run on SOAR entities. It performs a general query against
    the Microsoft Intune API.

    - If a **Filter Key** is selected, the **Filter Logic** must be set to `Equal`
    or `Contains` for the filter to be effective.

    - If **Filter Value** is empty, the filtering logic is skipped entirely, even
    if a key and logic are provided.
  ai_short_description: >-
    Retrieves a list of managed devices from Microsoft Intune based on specified filter
    criteria, returning the results as a data table and JSON object.
