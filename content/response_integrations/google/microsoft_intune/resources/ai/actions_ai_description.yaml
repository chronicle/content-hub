Reset Managed Device Passcode:
  ai_description: >-
    ### General Description

    The **Reset Managed Device Passcode** action initiates a remote task in Microsoft
    Intune to reset the passcode of one or more managed devices. This action is typically
    used when a device's security is compromised or a user is locked out of their
    device.


    ### Flow Description

    1. Extracts the target identifiers from the action parameters (Host Name, Host
    Id) or from HOSTNAME entities.

    2. Fetches the full list of managed devices from Microsoft Intune to verify the
    existence of the targets and retrieve the internal device IDs for name-based targets.

    3. Sends a POST request to the Microsoft Graph API endpoint `/resetPasscode` for
    each valid target device to trigger the remote command.

    4. Aggregates the results for all targets and provides a summary of successful
    task initiations and any failures.


