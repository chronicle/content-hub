Wipe Managed Device:
  ai_description: >-
    ### General Description

    The **Wipe Managed Device** action initiates a remote wipe command for devices
    managed within Microsoft Intune. This is a critical response action used to secure
    data on lost, stolen, or compromised devices. The action can target devices using
    Hostname entities or specific Host Names/IDs provided as input parameters.


    ### Flow Description

    1. **Parameter Extraction:** Retrieves integration configuration and action-specific
    parameters.

    2. **Target Identification:** Determines the list of target devices from input
    parameters or Hostname entities found in the current context.

    3. **Device Validation:** Queries Microsoft Intune to verify the existence of
    the devices and retrieve their unique internal Intune IDs.

    4. **Wipe Execution:** Sends a POST request to the Microsoft Graph API's `wipe`
    endpoint for each validated device, applying the specified data retention flags
    (Enrollment, User Data, eSIM).

    5. **Result Reporting:** Summarizes which devices were successfully queued for
    wiping and which could not be found or processed.


    ### Additional Notes

    - Either a Hostname entity or one of the manual input parameters (**Host Name**
    or **Host Id**) must be provided for the action to run.

    - If both **Host Id** and **Host Name** are provided, **Host Id** takes precedence.

    - If multiple devices are found for a single Host Name, the action selects the
    one with the most recent `lastSyncDateTime` to perform the wipe.
