Locate Managed Device:
  ai_description: >-
    ### General Description

    The **Locate Managed Device** action triggers a remote 'Locate Device' task within
    Microsoft Intune for specified managed devices. This action is used to initiate
    a request for a device's current location. It is important to note that this action
    only starts the task; to check the status or results of the location request,
    users should subsequently run the 'Get Managed Device' action and inspect the
    'deviceActionResults' section.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves action parameters (Host Name,
    Host Id) and configuration settings.

    2. **Target Identification**: It identifies target hosts by checking the 'Host
    Id' parameter first, then the 'Host Name' parameter, and finally falling back
    to `HOSTNAME` entities if no parameters are supplied.

    3. **Device Verification**: The action fetches a list of managed devices from
    Microsoft Intune via the Microsoft Graph API to verify that the provided identifiers
    correspond to existing managed assets.

    4. **Task Initiation**: For each valid device found, the action sends a POST request
    to the Microsoft Graph API's `locateDevice` endpoint to trigger the remote location
    task.

    5. **Result Aggregation**: The action tracks successful initiations, missing hosts,
    and API errors, providing a summary message of the execution status for all targeted
    devices.


    ### Additional Notes

    - **Priority Logic**: If both 'Host Id' and 'Host Name' are provided, 'Host Id'
    takes priority.

    - **Conflict Resolution**: If a hostname matches multiple Intune agents, the action
    automatically selects the device with the most recent `lastSyncDateTime`.

    - **Entity Support**: This action specifically targets `HOSTNAME` entities when
    parameters are not explicitly defined.
  ai_short_description: >-
    Triggers a remote 'Locate Device' task within Microsoft Intune for specified managed
    devices to initiate a request for a device's current location.
