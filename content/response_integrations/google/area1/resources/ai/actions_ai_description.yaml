    reasoning: >-
      The action makes a GET request to the Area1 API to fetch recent indicators (`fetches_data`
      is true). It does not perform any state-changing operations on external systems
      (`can_mutate_external_data` is false). It does not update entities, create insights,
      modify alert data, or create case comments.
