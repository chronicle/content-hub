Search Indicator:
  ai_description: >-
    ### General Description

    Searches for indicators (such as hash, URL, domain, IP, email) in Area 1 to retrieve
    threat intelligence data and enriches the target entities with the findings.


    ### Flow Description

    1. Initializes the Area 1 manager using the provided integration configurations.

    2. Iterates through all target entities in the case.

    3. Makes a GET request to the Area 1 API (`/search`) to fetch indicator data using
    the entity's identifier as the query.

    4. If indicator data is found, it adds an entity table with the flattened data,
    updates the entity's `additional_properties` with the retrieved information, and
    marks the entity as enriched.

    5. Updates the modified entities within the Google SecOps platform.

    6. Returns the aggregated indicator data as a JSON result.


    ### Additional Notes

    The action processes all target entities without filtering by specific entity
    types.
  ai_short_description: >-
    Searches for indicators in Area 1 to retrieve threat intelligence data and enriches
    the target entities with the findings.
