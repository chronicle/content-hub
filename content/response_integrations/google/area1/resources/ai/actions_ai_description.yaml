Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Area1 service to ensure that the integration is configured
    correctly and can communicate with the API.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, Username, Password,
    Verify SSL).

    2. Initializes the Area1 API client.

    3. Makes a GET request to the `/indicators` endpoint to fetch recent indicators
    from the last second.

    4. Returns a success message if the connection is established and the API responds
    successfully.


    ### Additional Notes

    This is a standard ping action used to verify credentials and network connectivity.
    It does not process entities or modify any data.
