Get Recent Indicators:
  ai_description: >-
    ### General Description

    Retrieves recent malicious indicators from Area1 based on a specified time frame.


    ### Flow Description

    1. Initializes the Area1 manager with the provided integration configurations.

    2. Retrieves the `Seconds Back` parameter to determine the time frame for fetching
    indicators.

    3. Makes an API call to Area1 to fetch indicators that were added or updated within
    the specified time frame.

    4. If indicators are found, they are formatted into a CSV and added as a data
    table to the action results.

    5. The raw JSON response containing the indicators is also attached to the action
    results.


    ### Additional Notes

    None.
  ai_short_description: >-
    Retrieves recent malicious indicators from Area1 based on a specified time frame.
