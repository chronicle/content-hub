Send SMS:
  ai_description: >-
    ### General Description

    Sends an SMS message to a specified phone number using Twilio. This action initiates
    an outbound communication to deliver a custom text message to a target recipient.


    ### Flow Description

    1. Extracts the target phone number and message content from the action parameters.

    2. Initializes the Twilio client using the integration's configured credentials
    (Account SID, Authentication Token, and Source Phone Number).

    3. Makes an API call to Twilio (`messages.create`) to send the SMS message to
    the target phone number.

    4. Returns a success or failure message based on the API response.


    ### Additional Notes

    The target phone number provided in the parameters must include a valid dial code.
