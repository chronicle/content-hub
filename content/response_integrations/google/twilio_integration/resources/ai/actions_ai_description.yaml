Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Twilio service to ensure the integration is configured
    correctly and credentials are valid.


    ### Flow Description

    1. Extracts the Account SID and Authentication Token from the integration configuration.

    2. Initializes the Twilio client using the provided credentials.

    3. Makes an API call to Twilio to list messages (with a limit of 1) to verify
    that the credentials are authorized.

    4. Returns a success message if the connection is established, or an error message
    if the connection fails.


    ### Additional Notes

    This action is typically used for diagnostic purposes to verify integration settings
    and does not affect any case data or external state.
  ai_short_description: >-
    Tests connectivity to the Twilio service by verifying the configured credentials.
  capabilities:
