Send SMS And Wait:
  ai_description: >-
    ### General Description

    Sends an SMS message to a specified phone number using Twilio and asynchronously
    waits for a reply.


    ### Flow Description

    1. Generates a unique tracking ID and appends it to the provided message content.

    2. Makes an API call to Twilio (`twilio_manager.send_message`) to send the SMS
    to the target phone number.

    3. Enters an asynchronous waiting state, saving the generated ID and the timestamp
    of the sent message.

    4. During the query phase, makes an API call to Twilio (`twilio_manager.list_messages`)
    to fetch incoming messages from the target phone number received after the saved
    timestamp.

    5. Evaluates the fetched messages to find a reply that ends with the generated
    unique ID.

    6. Completes the action and returns the reply content once the matching response
    is found, or continues waiting if no match is found.


    ### Additional Notes

    This action runs asynchronously and requires the Twilio integration to be properly
    configured with an Account SID, Authentication Token, and a valid sender phone
    number.
  ai_short_description: >-
    Sends an SMS message to a specified phone number using Twilio and asynchronously
    waits for a reply containing a generated unique ID.
