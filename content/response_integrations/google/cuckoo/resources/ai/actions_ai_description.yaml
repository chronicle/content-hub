Detonate Url:
  ai_description: >-
    ### General Description

    Submits a URL to the Cuckoo sandbox for asynchronous analysis and retrieves the
    resulting threat report. The action detonates the URL, waits for the analysis
    to complete, and enriches the URL entity with the analysis score and report details.


    ### Flow Description

    1. The action iterates over all target entities and filters for URL entities.

    2. For each URL, it makes a POST request to the Cuckoo API (`/tasks/create/url`)
    to submit the URL for analysis.

    3. The action saves the resulting task ID to the entity's additional properties
    and suspends execution (async).

    4. In subsequent async polls, it checks the status of the tasks via a GET request
    to the Cuckoo API (`/tasks/view/{task_id}`).

    5. Once all tasks are reported, it fetches the analysis reports via a GET request
    to the Cuckoo API (`/tasks/report/{task_id}/json`).

    6. The action updates the URL entities with the Cuckoo score, marks them as enriched,
    and sets them as suspicious if the score exceeds the configured threshold.

    7. Finally, it attaches the report data as a JSON result, adds a data table, and
    provides a link to the Cuckoo web interface.


    ### Additional Notes

    This is an asynchronous action. It relies on integration-level configurations
    for connection details and the warning threshold.
  ai_short_description: >-
    Submits a URL to the Cuckoo sandbox for analysis and enriches the URL entity with
    the resulting threat score and report.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
