Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cuckoo server to ensure the integration is configured
    correctly and can communicate with the API.


    ### Flow Description

    1. Extracts integration configuration parameters (such as API Root, API Token,
    and SSL settings).

    2. Initializes the CuckooManager with the provided credentials.

    3. Sends an HTTP GET request to the `/cuckoo/status` endpoint.

    4. Returns a success message if the connection is established and a valid response
    is received.


    ### Additional Notes

    This action is primarily used for diagnostic purposes to verify that the Google
    SecOps platform can successfully authenticate and connect to the Cuckoo instance.
