Get Report:
  ai_description: >-
    ### General Description

    Retrieves the analysis report for a specific task ID from Cuckoo Sandbox.


    ### Flow Description

    1. Extracts the `Task ID` from the action parameters.

    2. Queries the Cuckoo API to check if the task has been reported.

    3. If the task is reported, makes a GET request to the Cuckoo API to fetch the
    JSON report for the task.

    4. Parses the report to extract the score and other relevant details.

    5. Attaches the report as a JSON result, creates a data table with the findings,
    and provides a link to the report in the Cuckoo web interface.

    6. If the task is not yet reported, the action returns an in-progress state to
    be retried later (asynchronous execution).


    ### Additional Notes

    This is an asynchronous action that will continue to poll the Cuckoo Sandbox until
    the task is completed and the report is available.
