Detonate File:
  ai_description: >-
    ### General Description

    Submits one or more files to the Cuckoo sandbox for detonation and analysis. This
    action operates asynchronously, first uploading the files to the sandbox and then
    periodically checking the task status until the analysis is complete and a report
    is generated.


    ### Flow Description

    1. Extracts the provided file paths from the action parameters and splits them
    into a list.

    2. Initiates a POST request to the Cuckoo API (`/tasks/create/file`) to submit
    each file for analysis, generating a unique task ID for each.

    3. Enters an asynchronous loop, periodically checking the status of the submitted
    tasks to see if they are completed.

    4. Once all tasks are reported as complete, retrieves the JSON analysis reports
    via a GET request to the Cuckoo API (`/tasks/report/{task_id}/json`).

    5. Parses the reports to extract the maximum threat score and constructs data
    tables and JSON results.

    6. Attaches the analysis results, including report links and data tables, to the
    action results.


    ### Additional Notes

    The action requires valid file paths that are accessible to the execution environment.
    Multiple file paths can be provided as a comma-separated string.
  ai_short_description: >-
    Submits files to the Cuckoo sandbox for analysis and asynchronously retrieves
    the resulting threat reports and scores.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Submits a file to the Cuckoo sandbox, creating a new analysis task on the external
      system.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to Cuckoo to submit a file, which mutates external
      data by creating a new analysis task. It also makes GET requests to fetch the
      analysis report, which fetches data. It does not update internal entities, create
      insights, or modify internal SecOps data.
