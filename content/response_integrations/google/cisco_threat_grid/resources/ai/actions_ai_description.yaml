    ### General Description

    Tests connectivity to the Cisco Threat Grid API to ensure the integration is configured
    correctly.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, API Key, Use
    SSL).

    2. Initializes the Cisco Threat Grid Manager.

    3. Makes a GET request to the `/api/v2/samples` endpoint to verify the connection
    and authentication.

    4. Returns a success message if the connection is established without errors.


