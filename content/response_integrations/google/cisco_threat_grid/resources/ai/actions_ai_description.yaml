Get Submissions:
  ai_description: >-
    ### General Description

    Retrieves submission details from Cisco Threat Grid for specific entities (Address,
    FileHash, Hostname, Process, URL, FileName). It fetches submission states, waits
    for them to process if necessary, and then retrieves the submissions, including
    reports, pcaps, screenshots, and threat tables. It enriches the entities with
    the max threat score and marks them as suspicious if the score exceeds a threshold.


    ### Flow Description

    1. Iterates over target entities and checks their submission state in Cisco Threat
    Grid via API.

    2. If submissions are in a waiting state, the action pauses and waits for them
    to process (asynchronous execution).

    3. Once processed, it retrieves the submissions for each entity.

    4. Downloads the most recent analysis report (HTML), network PCAP, screenshot,
    and threat report, attaching them to the entity in the SecOps platform.

    5. Calculates the maximum threat score across submissions and updates the entity's
    additional properties.

    6. Marks the entity as enriched, and if the max score exceeds the configured threshold,
    marks it as suspicious.

    7. Updates the entities and adds JSON results to the action output.


    ### Additional Notes

    The action is asynchronous and will wait for submissions to finish processing
    before returning the final results. Attachments larger than 3 MB may fail to attach
    due to platform limitations.
  ai_short_description: >-
    Retrieves submission details, reports, and threat scores from Cisco Threat Grid
    for specific entities, enriching them and marking them as suspicious based on
    a threat score threshold.
