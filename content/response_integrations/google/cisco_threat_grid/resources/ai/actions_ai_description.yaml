Get Hash Associated Domains:
  ai_description: >-
    ### General Description

    Retrieves domains associated with a given file hash using Cisco Threat Grid. This
    action queries the Cisco Threat Grid API to find network streams related to the
    file hash and extracts the domains from DNS queries.


    ### Flow Description

    1. Iterates through the target entities provided in the case.

    2. Filters the entities to process only those of type `FILEHASH`.

    3. For each valid file hash, makes an API call to Cisco Threat Grid (`/api/v2/search/submissions`
    and `/api/v2/samples/{sample_id}/analysis/network_streams`) to retrieve associated
    network streams.

    4. Extracts DNS queries from the network streams to identify associated domains.

    5. Attaches the found domains to the case as an entity table and includes them
    in the action's JSON results.


    ### Additional Notes

    This action only retrieves data and attaches it as tables and JSON results. It
    does not update the entity's properties or create entity insights.
  ai_short_description: >-
    Retrieves domains associated with a given file hash using Cisco Threat Grid by
    analyzing network streams from sample submissions.
