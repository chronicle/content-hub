Upload Sample:
  ai_description: >-
    ### General Description

    Uploads a file sample to Cisco Threat Grid for malware analysis and sandbox execution.
    This action can retrieve the file locally or from a remote Linux server via SFTP,
    submits it for analysis, and retrieves the resulting threat score and report links.


    ### Flow Description

    1. Retrieves the file content either from a local path or by connecting to a remote
    Linux server via SFTP using the provided credentials.

    2. Submits the file to Cisco Threat Grid via a POST request to the `/api/v2/samples`
    endpoint.

    3. Runs asynchronously, periodically checking the analysis status.

    4. Once the analysis is complete, retrieves the threat report, calculates a threat
    score, and attaches links to the HTML report, PCAP file, and screenshot.

    5. Outputs the threat score and adds the threat details as a JSON result.


    ### Additional Notes

    The action runs asynchronously. Ensure the script timeout value in the IDE is
    adjusted accordingly.
