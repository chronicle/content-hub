Download Log Attachment:
  ai_description: >-
    ### General Description

    Downloads log attachments from CheckPoint Firewall based on provided Log IDs.
    This action retrieves the files associated with specific logs and saves them to
    a designated local folder, with an option to attach them directly to the case
    wall.


    ### Flow Description

    1. Initializes the CheckPoint Firewall manager with the provided integration credentials.

    2. Iterates over the provided `Log IDs` and initiates a task to retrieve the attachment
    for each log ID using the `get-attachment` API endpoint.

    3. Monitors the progress of the initiated tasks using the `show-task` API endpoint
    until they are completed.

    4. Retrieves the task details and extracts the base64 encoded attachments.

    5. Decodes the attachments and saves them to the specified `Download Folder Path`.

    6. If `Create Case Wall Attachment` is enabled, attaches the downloaded files
    (under 3MB) to the case wall.

    7. Returns the task details as JSON results.


    ### Additional Notes

    - Attachments added to the case wall are limited to a maximum size of 3 MB.
  ai_short_description: >-
    Downloads log attachments from CheckPoint Firewall based on provided Log IDs and
    saves them to a specified local folder.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
