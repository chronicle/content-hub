Add Ip To Group:
  ai_description: >-
    ### General Description

    Adds IP address entities to a specified Checkpoint Firewall Group. This action
    is typically used to block malicious IP addresses by adding them to a blocklist
    group on the firewall.


    ### Flow Description

    1. Initializes the Checkpoint Firewall manager with provided credentials.

    2. Filters target entities to include only IP Address entities.

    3. For each IP address, checks if the specified group exists and is editable.

    4. Checks if the IP address object already exists; if not, creates it.

    5. Adds the IP address object to the specified firewall group.

    6. Publishes the changes and installs the specified policy on the firewall.


    ### Additional Notes

    The action requires a valid policy name (configured at the integration level)
    to install the changes after adding the IPs to the group.
  ai_short_description: >-
    Adds IP address entities to a specified Checkpoint Firewall Group and installs
    the policy to enforce the changes.
