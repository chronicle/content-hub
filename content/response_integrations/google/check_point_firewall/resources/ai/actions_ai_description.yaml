    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the IP address to a specified Checkpoint Firewall Group and installs the
      policy.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes POST requests to the Checkpoint Firewall API to add an IP address
      to a group and install a policy, mutating external data. It does not fetch enrichment
      data, update internal entities, create insights, modify alerts, or create case
      comments.
