Add Url To Group:
  ai_description: >-
    ### General Description

    Adds URL entities to a specified Checkpoint Firewall group. This action initiates
    a state change on the external firewall device to block or manage network traffic
    associated with the specified URLs, and then installs the policy to apply the
    changes.


    ### Flow Description

    1. Extracts the target group name from the action parameters and the policy name
    from the integration configuration.

    2. Filters the target entities to include only URL entities.

    3. For each URL entity, calls the Checkpoint API to add the URL to the specified
    application site group (creating the application site if it does not already exist).

    4. Publishes the changes to the Checkpoint Firewall.

    5. Installs the specified policy to make the changes effective.


    ### Additional Notes

    The action requires a valid policy name configured in the integration settings
    and a valid group name provided in the action parameters. Changes will only be
    effective after the policy is successfully installed.
