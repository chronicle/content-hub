Add a SAM Rule:
  ai_description: >-
    ### General Description

    Adds a Suspicious Activity Monitoring (SAM) rule to a Checkpoint Firewall. This
    action allows analysts to block or monitor specific network traffic based on source/destination
    IPs, netmasks, ports, and protocols.


    ### Flow Description

    1. Extracts the integration configuration and action parameters.

    2. Establishes a connection to the Checkpoint Firewall API.

    3. Constructs the SAM rule criteria based on the provided IP, netmask, port, and
    protocol parameters.

    4. Constructs the command to add the SAM rule with the specified action (e.g.,
    Drop, Reject), tracking method, and expiration.

    5. Executes the `run-script` command on the specified Security Gateway.

    6. Polls the task status until completion.

    7. Publishes the changes to the firewall to apply the new rule.

    8. Returns the task execution details as JSON results.


    ### Additional Notes

    The action supports various combinations of criteria. Refer to the Checkpoint
    `fw_sam` command documentation for valid combinations.
  ai_short_description: >-
    Adds a Suspicious Activity Monitoring (SAM) rule to a specified Checkpoint Firewall
    Security Gateway to drop, reject, or notify on matching connections.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds a Suspicious Activity Monitoring (SAM) rule to the Checkpoint Firewall
      and publishes the changes.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the Checkpoint Firewall API to execute a
