Create Insight:
  ai_description: >-
    ### General Description

    Creates a new insight in AWS Security Hub based on specified filters and grouping
    attributes.


    ### Flow Description

    1. Validates the provided filter JSON object and group-by attribute.

    2. Establishes a connection to the AWS Security Hub service.

    3. Makes an API call to AWS Security Hub to create the insight using the provided
    name, filter, and group-by attribute.

    4. Returns the newly created Insight ARN as a JSON result.


    ### Additional Notes

    The filter must be a valid JSON object.
  ai_short_description: >-
    Creates a new insight in AWS Security Hub based on specified filters and grouping
    attributes.
