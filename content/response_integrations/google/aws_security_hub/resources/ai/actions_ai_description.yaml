Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the AWS Security Hub service using the provided integration
    configuration parameters. This action ensures that the credentials and region
    settings are valid and that the SecOps platform can successfully communicate with
    the AWS Security Hub API.


    ### Flow Description

    1. Extracts the AWS Access Key ID, AWS Secret Key, and AWS Default Region from
    the integration-level configuration.

    2. Initializes the `AWSSecurityHubManager` client with the extracted credentials.

    3. Makes an API call to the AWS Security Hub `get_master_account` endpoint to
    verify connectivity.

    4. Returns a success message if the connection is established, or a failure message
    if an error occurs.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
