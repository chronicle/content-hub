Update Finding:
  ai_description: >-
    ### General Description

    Updates the properties of a specific finding in AWS Security Hub. This action
    allows users to modify various attributes of an existing finding, such as its
    severity, workflow status, verification state, and custom fields, directly from
    the SecOps platform.


    ### Flow Description

    1. Extracts the target finding's ID and Product ARN, along with the desired updated
    properties (e.g., severity, workflow status, notes, custom fields).

    2. Validates the input parameters, ensuring that confidence and criticality values
    fall within the valid range (0-100) and that both 'Note' and 'Note Author' are
    provided together if a note is being added.

    3. Establishes a connection to the AWS Security Hub service using the provided
    integration credentials.

    4. Makes an API call (`batch_update_findings`) to AWS Security Hub to apply the
    specified updates to the finding.

    5. Evaluates the API response to determine if the finding was successfully processed
    or if it was returned as unprocessed, outputting the appropriate success or error
    message.


    ### Additional Notes

    Due to AWS Security Hub limitations, if you wish to add or update a note on a
    finding, you must provide both the 'Note' and 'Note Author' parameters. Providing
    only one will result in a validation error.
  ai_short_description: >-
    Updates the properties of a specific finding in AWS Security Hub, such as its
    severity, workflow status, verification state, and custom fields.
  capabilities:
    can_create_case_comments: false
