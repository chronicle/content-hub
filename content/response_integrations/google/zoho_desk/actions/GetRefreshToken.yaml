name: Get Refresh Token
description: Get a refresh token for the configuration.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/zoho-desk#get_refresh_token
integration_identifier: ZohoDesk
parameters:
-   name: Authorization Link
    default_value: https://accounts.zoho.{region}/oauth/v2/token
    type: string
    description: Specify the authorization link for the integration.
    is_mandatory: true
-   name: Authorization Code
    default_value: ''
    type: password
    description: Specify the authorization code that was generated in the dev console
        of Zoho.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
