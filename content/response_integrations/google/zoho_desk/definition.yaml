identifier: ZohoDesk
name: Zoho Desk
parameters:
-   name: API Root
    default_value: https://desk.zoho.{region}
    type: string
    description: API root of the Zoho Desk instance.
    is_mandatory: true
    integration_identifier: ZohoDesk
-   name: Client ID
    default_value: ''
    type: string
    description: Client ID of the Zoho Desk account.
    is_mandatory: true
    integration_identifier: ZohoDesk
-   name: Client Secret
    default_value: ''
    type: password
    description: Client Secret of the Zoho Desk account.
    is_mandatory: true
    integration_identifier: ZohoDesk
-   name: Refresh Token
    default_value: ''
    type: password
    description: Refresh Token of the Zoho Desk account. You need to run the action
        "Get Refresh Token" to generate it.
    is_mandatory: false
    integration_identifier: ZohoDesk
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Zoho Desk server is valid.
    is_mandatory: true
    integration_identifier: ZohoDesk
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/zoho-desk
categories:
- ITSM
svg_logo_path: resources/logo.svg
image_path: resources/image.png
