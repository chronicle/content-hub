Get Hunt Details:
  ai_description: >-
    ### General Description

    Fetches detailed information for specified hunt IDs from Google GRR.


    ### Flow Description

    1. Extracts the provided Hunt IDs from the action parameters.

    2. Initializes the Google GRR manager with the provided credentials.

    3. Iterates through the list of Hunt IDs.

    4. Makes a GET request to the Google GRR API (`api/hunts/{hunt_id}`) to retrieve
    the details for each hunt.

    5. Aggregates the retrieved hunt details into a JSON result and generates a direct
    link to each hunt.

    6. Returns the JSON results and a summary message indicating successful and failed
    fetches.


    ### Additional Notes

    This action does not operate on entities. Multiple Hunt IDs can be provided as
    a comma-separated string.
