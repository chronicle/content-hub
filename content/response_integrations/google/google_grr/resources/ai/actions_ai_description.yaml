List Launched Flows:
  ai_description: >-
    ### General Description

    Lists flows launched on a specified client in Google GRR based on Hostname or
    IP Address entities. This action retrieves the execution history of flows (tasks)
    for the targeted endpoints.


    ### Flow Description

    1. Iterates over the target entities, filtering for supported types (Hostname
    and Address).

    2. For each valid entity, makes an API call to Google GRR to fetch the corresponding
    Client ID using the entity's identifier or `OriginalIdentifier`.

    3. Makes a subsequent API call to Google GRR to list the launched flows for the
    retrieved Client ID, applying the specified offset and maximum results limits.

    4. Aggregates the flow data and attaches it to the action's results as JSON and
    a CSV data table.


    ### Additional Notes

    Entities that are not of type Hostname or Address will be skipped.
  ai_short_description: >-
    Lists flows launched on a specified client in Google GRR based on Hostname or
    IP Address entities.
  capabilities:
