Get Client Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about specific clients from Google GRR using their
    Client IDs. This action fetches contextual metadata such as OS information, hardware
    details, and agent versions for the specified clients.


    ### Flow Description

    1. Parses the provided comma-separated list of Client IDs from the action parameters.

    2. Iterates through each Client ID.

    3. Makes a GET request to the Google GRR API (`/api/clients/{client_id}`) to fetch
    the full details of the client.

    4. Aggregates the retrieved data and outputs it as a JSON result and a data table
    within the Google SecOps platform.


    ### Additional Notes

    If multiple Client IDs are provided, the action will attempt to fetch details
    for all of them and report any failures in the output message.
  ai_short_description: >-
    Retrieves detailed information about specific clients from Google GRR using their
    Client IDs.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Google GRR API to fetch client details
      (fetches_data=true). It does not perform any state-changing operations on external
      systems, nor does it mutate internal data, update entities, or create insights.
