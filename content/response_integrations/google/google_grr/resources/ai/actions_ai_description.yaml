Start a Hunt:
  ai_description: >-
    ### General Description

    Starts one or more specified hunts in Google GRR. Hunts are typically created
    in a PAUSED state or enter a PAUSED state when reaching their client limit; this
    action resumes or starts them.


    ### Flow Description

    1. Extracts the provided comma-separated list of Hunt IDs.

    2. Iterates through each Hunt ID.

    3. Makes a PATCH request to the Google GRR API (`api/hunts/{hunt_id}`) to change
    the hunt's state to STARTED.

    4. Collects the results and outputs a JSON object containing the Hunt IDs and
    their new states.


    ### Additional Notes

    Hunts that cannot be found or are not in a PAUSED state will be reported in the
    output message.
  ai_short_description: >-
    Starts one or more specified hunts in Google GRR by changing their state to STARTED.
  capabilities:
    can_create_case_comments: false
