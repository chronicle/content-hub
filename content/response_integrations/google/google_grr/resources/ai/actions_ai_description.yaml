    1. Extracts the action parameters: Creator, Offset, and Max Results To Return.

    2. Initializes the Google GRR manager with the provided API credentials.

    3. Makes an HTTP GET request to the Google GRR API (`api/hunts`) to fetch the
    list of hunts based on the provided filters.

