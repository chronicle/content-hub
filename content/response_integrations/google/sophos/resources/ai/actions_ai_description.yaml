Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Sophos server using the parameters provided at the integration
    configuration page. This action ensures that the credentials and network settings
    are correct and that the SOAR platform can successfully communicate with the Sophos
    APIs.


    ### Flow Description

    1. Extracts integration configuration parameters such as API Root, Client ID,
    Client Secret, SIEM API Root, API Key, and Base 64 Auth Payload.

    2. Initializes the `SophosManager` with the `test_connectivity` flag set to `True`.

    3. The manager authenticates and makes a test GET request to the Sophos endpoints
    API (`/endpoint/v1/endpoints`).

    4. If SIEM-specific credentials are provided, it makes an additional test GET
    request to the SIEM events API (`/siem/v1/events`).

    5. Returns a success message if the connections are established, otherwise catches
    the exception and returns a failure message.


    ### Additional Notes

    This action is typically used during the initial setup or troubleshooting of the
    Sophos integration to verify connectivity.
