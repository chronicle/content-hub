  ai_description: >-
    ### General Description

    Initiates the execution of a specified action on an alert within Sophos.


    ### Flow Description

    1. Extracts the Alert ID, Action, and an optional Message from the action parameters.

    2. Maps the selected action to the corresponding Sophos API action type.

    3. Makes a POST request to the Sophos API (`/common/v1/alerts/{alert_id}/actions`)
    to execute the action on the specified alert.

    4. Returns a success message if the action is initiated successfully, or an error
    message if it fails.


    ### Additional Notes

    Use the "List Alert Actions" action to retrieve a list of available actions for
    a specific alert before executing this action.
