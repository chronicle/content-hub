Add Entities To Blocklist:
  ai_description: >-
    ### General Description

    Adds file hash entities to the blocklist in Sophos. This action initiates a state
    change on the external Sophos platform to prevent execution or interaction with
    the specified file hashes.


    ### Flow Description

    1. Extracts the action parameter `Comment`.

    2. Filters the target entities to include only `FILEHASH` entities.

    3. Initializes the Sophos API client.

    4. Iterates over the filtered entities and verifies that the hash is a valid SHA-256
    hash (length of 64 characters).

    5. Makes a POST request to the Sophos API to add each valid hash to the blocklist
    with the provided comment.

    6. Handles cases where the hash is already on the blocklist.

    7. Returns a summary message detailing which entities were successfully added,
    which failed, and which were already on the blocklist.


    ### Additional Notes

    Only SHA-256 hashes are supported by this action.
