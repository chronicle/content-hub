Get Events Log:
  ai_description: >-
    ### General Description

    Retrieves events and logs related to specific endpoints (IP Address, Hostname)
    from Sophos.


    ### Flow Description

    1. Initializes the Sophos API client with the provided configuration credentials.

    2. Iterates through the target entities, filtering for supported types (IP Address
    and Hostname).

    3. For each valid entity, makes an API call to Sophos to find the corresponding
    endpoint using the entity's identifier.

    4. If the endpoint is found, makes another API call to retrieve the events associated
    with that endpoint within the specified timeframe.

    5. Formats the retrieved events into a CSV table and attaches it to the entity
    in the SecOps platform.

    6. Aggregates the raw event data and returns it as a JSON result.


    ### Additional Notes

    Events are accessible from the Sophos API only for the last 24 hours. If a timeframe
    greater than 24 hours is provided, the action will automatically cap it at 24
    hours.
