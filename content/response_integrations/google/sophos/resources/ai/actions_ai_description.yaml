Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname, IP Address, and File Hash entities using Sophos. This action
    retrieves endpoint details, isolation status, and blocked items information to
    provide additional context for the entities.


    ### Flow Description

    1. Initializes the connection to the Sophos API.

    2. Iterates over the target entities, filtering for Hostname, IP Address, and
    File Hash types.

    3. For Hostname and IP Address entities, makes a GET request to the Sophos API
    to find endpoint details and another GET request to check the endpoint's isolation
    status.

    4. For File Hash entities, makes a GET request to the Sophos API to retrieve blocked
    items information.

    5. Updates the entities' additional properties with the retrieved data and marks
    them as enriched. File Hash entities are also marked as suspicious if found.

    6. Optionally creates an insight for each successfully enriched entity.

    7. Updates the entities in the Google SecOps platform and returns the results.


    ### Additional Notes

    None.
  ai_short_description: >-
    Enriches Hostname, IP Address, and File Hash entities using Sophos to retrieve
    endpoint details, isolation status, and blocked items information.
