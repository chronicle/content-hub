Add Entities To Allowlist:
  ai_description: >-
    ### General Description

    Adds specified SHA-256 file hash entities to the allowlist in Sophos.


    ### Flow Description

    1. Iterates over the target entities and filters for `FileHash` entities.

    2. Validates that the entity identifier is a valid SHA-256 hash by checking its
    length (64 characters).

    3. Makes a POST request to the Sophos API (`/endpoint/v1/settings/allowed-items`)
    to add the valid hashes to the allowlist, including the provided comment.

    4. Collects the results and outputs a summary message detailing which entities
    were successfully added, which failed, and which were already on the allowlist.


    ### Additional Notes

    Only SHA-256 hashes are supported by this action. Other hash types will be skipped.
  ai_short_description: >-
    Adds specified SHA-256 file hash entities to the allowlist in Sophos.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds the specified SHA-256 file hash entities to the allowlist in Sophos.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action mutates external data by making a POST request to Sophos to add a
      hash to the allowlist. It does not fetch contextual data, update internal entities,
      create insights, modify alert data, or create case comments.
