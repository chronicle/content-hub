Isolate Endpoint:
  ai_description: >-
    ### General Description

    Isolates specific endpoints (IP Address or Hostname) in Sophos. This action initiates
    a state change on the external device to prevent network traffic to or from the
    specified entity.


    ### Flow Description

    1. Iterates over the target entities and filters for supported types (IP Address,
    Hostname).

    2. For each suitable entity, queries Sophos via the `find_entities` API to retrieve
    the corresponding endpoint details.

    3. Checks the current isolation status of the endpoint using the `check_isolation_status`
    API.

    4. If the endpoint is not already isolated, sends a request to Sophos via the
    `isolate_endpoint` API to isolate the endpoint, including the provided comment.

    5. Periodically queries the isolation status until the operation completes or
    times out, as this is an asynchronous action.


