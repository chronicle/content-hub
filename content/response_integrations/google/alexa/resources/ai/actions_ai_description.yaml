Get URL Rank:
  ai_description: >-
    ### General Description

    Queries Alexa to retrieve rank information for URL entities. This action fetches
    the global rank of the specified URLs, enriches the entities with this data, and
    evaluates the rank against a provided threshold to determine if the URL should
    be marked as suspicious.


    ### Flow Description

    1. Iterates over the target entities and filters for those of type URL.

    2. Makes an HTTP GET request to the Alexa Web Information Service (AWIS) API to
    fetch the rank information for each URL.

    3. Extracts the rank from the API response and adds it to the entity's `additional_properties`
    as `Alexa_Rank`.

    4. Marks the entity as enriched.

    5. Compares the retrieved rank against the provided `Threshold` parameter. If
    the rank is greater than the threshold, the entity is marked as suspicious and
    an insight is added to the entity.

    6. Updates the entities within the Google SecOps platform and attaches the raw
    JSON results to the action.


    ### Additional Notes

    Ensure that the Alexa integration is properly configured with the necessary Access
    Key ID and Secret Access Key to authenticate with the AWS API.
  ai_short_description: >-
    Queries Alexa to retrieve rank information for URL entities, enriches the entities
    with the rank data, and optionally marks them as suspicious based on a provided
    threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Alexa API (fetches_data=true). It does not
      mutate any external data or internal platform data outside of entities and insights.
      It updates the entities with the retrieved rank (can_update_entities=true) and
      creates an insight if the rank exceeds the threshold (can_create_insight=true).
