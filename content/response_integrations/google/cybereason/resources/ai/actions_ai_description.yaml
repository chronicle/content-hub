Set Reputation:
  ai_description: >-
    ### General Description

    Sets a custom reputation (Whitelist or Blacklist) for specific entities in Cybereason.
    Supported entities include File Hash (MD5, SHA1), IP Address, and URL (extracts
    the domain). This action initiates a state change in the Cybereason platform to
    classify the provided indicators according to the selected reputation list.


    ### Flow Description

    1. Retrieves the specified reputation list type (Whitelist or Blacklist) from
    the action parameters.

    2. Iterates over the target entities, filtering for supported types (File Hash,
    IP Address, URL).

    3. Extracts the domain from URL entities and validates that File Hash entities
    are either MD5 or SHA1.

    4. Calls the Cybereason API (`/rest/classification/update`) to set the custom
    reputation for each valid entity.

    5. Returns a summary of successfully updated entities and any that failed.


    ### Additional Notes

    Only MD5 and SHA1 hashes are supported. For URLs, the action will extract and
    use the domain part for the reputation update.
