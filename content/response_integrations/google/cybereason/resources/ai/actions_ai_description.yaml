Remediate Malop:
  ai_description: >-
    ### General Description

    Executes specific remediation actions on a malop in Cybereason based on provided
    remediation unique IDs. This action allows analysts to trigger predefined remediation
    tasks (such as killing a process or quarantining a file) directly from the SOAR
    platform.


    ### Flow Description

    1. Retrieves the suspicious details and available remediation actions for the
    specified Malop ID from Cybereason.

    2. Matches the provided Remediation Unique IDs against the available remediations
    for the malop.

    3. Initiates the remediation actions via a POST request to the Cybereason API
    (`/rest/detection/remediate-custom-actions`).

    4. For asynchronous actions, it periodically polls the Cybereason API to check
    the status of the remediation tasks until they complete or fail.

    5. Returns the final status and results of the remediation tasks to the SOAR platform.


    ### Additional Notes

    This is an asynchronous action. The script timeout in the IDE may need to be adjusted
    depending on the expected duration of the remediation tasks. To get a list of
    valid remediation unique IDs, use the "List Malop Remediations" action.
