Execute Custom Investigation Search:
  ai_description: >-
    ### General Description

    Executes a custom investigation search in Cybereason based on provided JSON query
    parameters. This action supports nested queries for different item types and allows
    specifying the exact fields to return.


    ### Flow Description

    1. Extracts the query filters, fields to return, and maximum results limit from
    the action parameters.

    2. Parses the query filters JSON string.

    3. Initializes the CybereasonManager with the integration configuration.

    4. Calls the Cybereason API (`/rest/visualsearch/query/simple`) to execute the
    custom query.

    5. Formats the retrieved results into a data table and JSON output.

    6. Returns the results to the Google SecOps platform.


    ### Additional Notes

    The query should follow a strict pattern of '{API field } {Operator} {Value}'.
    For multiple values you need to provide an 'OR' key. Each new filter needs to
    be a separate item in the list.
