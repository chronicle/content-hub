Isolate Machine:
  ai_description: >-
    ### General Description

    Isolates a specific machine in Cybereason based on Hostname entities. This action
    initiates a state change on the external EDR to prevent network traffic to or
    from the specified endpoint.


    ### Flow Description

    1. Iterates over target entities of type Hostname.

    2. For each entity, fetches sensor details from Cybereason using the `get_sensor_details`
    API call.

    3. If the machine is found and not already isolated, initiates an isolation request
    via the `isolate_machine` API call.

    4. Periodically checks the isolation status asynchronously until the machine is
    confirmed isolated or a timeout occurs.


    ### Additional Notes

    This is an asynchronous action that will continue to run in the background until
