Clear Reputation:
  ai_description: >-
    ### General Description

    Clears the custom reputation (whitelist or blacklist) of specified entities (File
    Hash, IP Address, URL) in Cybereason. This action removes any manual classification
    previously applied to the indicator, restoring it to its default security posture.


    ### Flow Description

    1. Iterates over the target entities provided in the case, filtering for supported
    types (File Hash, IP Address, URL).

    2. Extracts the appropriate identifier for the API (e.g., extracts the domain
    from a URL entity, and validates that File Hashes are either MD5 or SHA1).

    3. Checks if the entity currently has a custom classification in Cybereason by
    fetching the classifications list.

    4. If the entity is found, makes a POST request to the Cybereason API to remove
    its custom reputation.

    5. Aggregates the results and returns a summary message detailing which entities
    were successfully cleared, failed, or not found.


    ### Additional Notes

    Only MD5 and SHA1 hashes are supported for File Hash entities. For URL entities,
    the action will automatically strip the domain part to use as the identifier.
