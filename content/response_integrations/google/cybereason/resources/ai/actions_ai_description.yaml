Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches entities using information from Cybereason. Supported entities include
    Hostname, IP Address, File Hash, and URL. The action retrieves contextual metadata
    for hostnames and threat intelligence for IOCs, updating the entities with the
    retrieved data, setting their suspicious status if malicious, and optionally creating
    insights.


    ### Flow Description

    1. Initializes the CybereasonManager with the provided API credentials.

    2. Iterates over the target entities, filtering for supported types (Hostname,
    IP Address, File Hash, URL).

    3. For Hostname entities, it fetches the machine GUID by name or FQDN, then retrieves
    the machine's contextual information.

    4. For IP Address, URL, and File Hash entities, it fetches the entity details.
    For File Hashes, it additionally retrieves associated files.

    5. Updates the entities' additional properties with the enrichment data and sets
    `is_enriched` to True.

    6. If the entity is determined to be malicious, sets `is_suspicious` to True.

    7. Creates insights for the enriched entities based on the action parameters.

    8. Attaches the enrichment data as a CSV table and JSON result to the action's
    output.

    9. Updates the entities in the SecOps platform.


    ### Additional Notes

    - IP Address for this action refers to external IP addresses.

    - Only MD5 and SHA-1 hashes are supported for File Hash entities.

    - The action strips the domain part from URL entities before querying the API.
  ai_short_description: >-
    Enriches Hostname, IP Address, File Hash, and URL entities using information from
    Cybereason, updating entity properties and optionally creating insights.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
