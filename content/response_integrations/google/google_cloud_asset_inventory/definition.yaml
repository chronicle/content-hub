identifier: GoogleCloudAssetInventory
name: Google Cloud Asset Inventory
parameters:
-   name: API Root
    default_value: https://cloudasset.googleapis.com
    type: string
    description: API root of the Google Cloud Asset Inventory instance.
    is_mandatory: true
    integration_identifier: GoogleCloudAssetInventory
-   name: Organization ID
    default_value: ''
    type: string
    description: ID of the organization that should be used in Google Cloud Asset
        Inventory integration.
    is_mandatory: false
    integration_identifier: GoogleCloudAssetInventory
-   name: Project ID
    default_value: ''
    type: string
    description: ID of the Project that should be used in Google Cloud Asset Inventory
        integration. Takes precedence over "Organization ID".
    is_mandatory: false
    integration_identifier: GoogleCloudAssetInventory
-   name: User Service Account
    default_value: ''
    type: password
    description: Service account of the Google Cloud Asset Inventory instance. A full
        content of the service account JSON file should be provided. This or "Workload
        Identity Email" must be provided.
    is_mandatory: false
    integration_identifier: GoogleCloudAssetInventory
    display_name: User's Service Account
-   name: Quota Project ID
    default_value: ''
    type: string
    description: ID of your Google Cloud project for Google Cloud API usage and billing.
        If no value is provided, the project ID defined in your Google Cloud service
        account is used. For this parameter to work, make sure to grant the "Service
        Usage Consumer" IAM role to your Google Cloud service account.
    is_mandatory: false
    integration_identifier: GoogleCloudAssetInventory
-   name: Workload Identity Email
    default_value: ''
    type: string
    description: A Service Account Client Email to replace the usage of "User's Service
        Account", which will be used for Impersonation. Note that the SOAR Service
        Account must be granted the "Service Account Token Creator" IAM role on the
        User Service Account.
    is_mandatory: false
    integration_identifier: GoogleCloudAssetInventory
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Google Cloud Asset Inventory server is valid.
    is_mandatory: true
    integration_identifier: GoogleCloudAssetInventory
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-asset-inventory
categories:
- Endpoint Security
svg_logo_path: resources/logo.svg
image_path: resources/image.png
