[project]
name = "google_cloud_asset_inventory"
version = "16.0"
description = "Cloud Asset Inventory is a fully-managed service that helps you discover, monitor, and analyze your Google Cloud and Anthos assets across projects and services. Cloud Asset Inventory provides a comprehensive view of your assets, including their configuration, relationships, and usage. This information can be used to improve your security posture, optimize your costs, and make better decisions about your cloud resources."
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.12.3",
    "environmentcommon",
    "google-api-core==2.19.1",
    "google-api-python-client==2.142.0",
    "google-auth>=2.34.0",
    "google-auth-httplib2==0.2.0",
    "googleapis-common-protos==1.63.2",
    "httplib2==0.22.0",
    "regex==2024.7.24",
    "requests==2.32.4",
    "tipcommon",
    "tldextract==5.1.2",
]

[dependency-groups]
dev = [ "pytest>=9.1.1", "pytest-json-report>=1.5.0", "pytest-mock", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.1-py2.py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-1.1.6.1-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"
