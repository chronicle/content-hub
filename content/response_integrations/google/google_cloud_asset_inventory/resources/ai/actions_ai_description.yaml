Enrich Resource:
  ai_description: >-
    ### General Description

    Enriches information about Google Cloud resources using the Google Cloud Asset
    Inventory service. This action allows users to retrieve detailed metadata for
    a specific list of GCP resources by querying the Asset Inventory API. It supports
    granular control over the returned data through field inclusion and exclusion
    masks.


    ### Flow Description

    1. **Parameter Extraction & Validation**: The action retrieves configuration settings
    and validates the input CSVs for resource names and field masks.

    2. **Field Mask Logic**: It parses the `Fields To Return` parameter to build internal
    lists of fields to be requested from the API and fields to be filtered out of
    the final JSON result.

    3. **Connectivity Verification**: It performs a connectivity test to ensure the
    service account has the necessary permissions to access the Google Cloud Asset
    Inventory.

    4. **Resource Querying**: It sends a GET request to the `searchAllResources` endpoint,
    batching resource names into a single query where possible to optimize API usage.

    5. **Data Pruning**: The raw API response is processed through a transformation
    layer that applies the inclusion/exclusion logic defined by the user.

    6. **Final Output**: The action populates the JSON results with the enriched resource
    data and generates a summary message indicating which resources were successfully
    found.


    ### Additional Notes

    - This action does not automatically process entities from the SOAR scope; it
    relies entirely on the `Resource Names` parameter.

    - The `name` field is always returned in the results, even if excluded in the
    parameters.
  ai_short_description: >-
    Enriches information about Google Cloud resources using the Google Cloud Asset
    Inventory service by querying the Asset Inventory API for specific resource names.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to the Google Cloud Asset Inventory API to fetch
      resource details (`fetches_data` = true). It does not perform any state-changing
      operations on external systems (`can_mutate_external_data` = false). It also
      does not update entities, create insights, or modify internal case data (`can_mutate_internal_data`
      = false).
  entity_usage:
