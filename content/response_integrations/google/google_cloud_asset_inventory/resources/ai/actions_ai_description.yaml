List Service Account Roles:
  ai_description: >-
    ### General Description

    This action lists the IAM roles and unique permissions associated with specific
    Google Cloud service accounts using the Google Cloud Asset Inventory API. It allows
    security analysts to audit the privileges of service accounts within a project
    or organization, providing visibility into what actions those accounts are authorized
    to perform.


    ### Flow Description

    1. Extracts configuration parameters and action-specific parameters (Service Accounts,
    filters, and limits).

    2. Verifies the connection to the Google Cloud Asset Inventory service.

    3. For each service account provided in the input list, the action executes an
    `analyzeIamPolicy` request via the Google Cloud Asset Inventory API. This request
    can be filtered by specific roles or permissions if the optional parameters are
    provided.

    4. Parses the API response to extract the list of roles and, if requested, the
    unique permissions granted to the service account.

    5. Aggregates the results into a JSON object mapping each service account to its
    discovered roles and permissions, which is then returned as the action output.


    ### Additional Notes

    - The action performs a read-only analysis and does not modify any IAM policies
    or service account settings.
