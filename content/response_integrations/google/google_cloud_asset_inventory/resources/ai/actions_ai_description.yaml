Get Resource Snapshot:
  ai_description: >-
    ### General Description

    Retrieves detailed configuration snapshots for specific Google Cloud resources
    using the Google Cloud Asset Inventory API. This action allows security analysts
    to fetch the state of resources (such as Compute Engine instances, IAM service
    accounts, or Cloud Storage buckets) at the current point in time. It is primarily
    used to gather deep technical metadata about cloud assets for investigation and
    compliance auditing.


    ### Flow Description

    1. **Authentication**: The action initializes a connection to the Google Cloud
    Asset Inventory service using the configured API Root and credentials.

    2. **Connectivity Test**: It performs a connectivity check to ensure the project
    or organization ID is accessible.

    3. **Parameter Validation**: The action parses the input CSV of resource names
    and validates the field mask provided in the parameters.

    4. **Data Retrieval**: It calls the `batchGetAssetsHistory` endpoint, requesting
    the `RESOURCE` content type for the specified asset names.

    5. **Result Processing**: The action identifies which resources were successfully
    retrieved and which were not found. It then formats the raw API response into
    a structured JSON result for use in the playbook.


    ### Additional Notes

    - This action does not automatically process entities from the Google SecOps case;
    it requires explicit resource names to be provided via the action parameters.

    - The action supports batching and can handle up to 100 resource names per request.
  ai_short_description: >-
    Retrieves detailed configuration snapshots for specific Google Cloud resources
    using the Google Cloud Asset Inventory API.
