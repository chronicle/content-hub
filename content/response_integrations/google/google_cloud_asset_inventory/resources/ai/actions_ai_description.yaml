Ping:
  ai_description: >-
    ### General Description

    The Ping action is designed to verify the connectivity between Google SecOps and
    the Google Cloud Asset Inventory service. It ensures that the provided integration
    configuration parameters, such as API Root and authentication credentials, are
    correct and that the service is reachable.


    ### Flow Description

    1. Extracts connection details and authentication parameters from the integration
    configuration.

    2. Validates the format of the Service Account JSON and the Workload Identity
    Email.

    3. Initializes the Google Cloud Asset Inventory Manager with the provided credentials
    and settings.

    4. Executes a `GET` request to the `searchAllResources` endpoint with a minimal
    page size (`pageSize=1`) to verify access to the specified Project or Organization.

    5. Logs the success or failure of the connection attempt.


    ### Additional Notes

    - Either a Project ID or an Organization ID must be provided (or discoverable
    via the service account) for the connectivity test to proceed.

    - This action does not process any entities.
