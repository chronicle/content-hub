name: Enrich Resource
description: Enrich information about a Google Cloud resource using Google Cloud Asset
    Inventory.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-asset-inventory#enrich_resource
integration_identifier: GoogleCloudAssetInventory
parameters:
-   name: Resource Names
    default_value: ''
    type: string
    description: Specify a comma-separated list of resources for which you want to
        fetch details.
    is_mandatory: true
-   name: Fields To Return
    default_value: '*'
    type: string
    description: 'Specify a comma-separated list of fields to return. Example of values:assetType,project,folders,organization,displayName,description,location,labels,networkTags,kmsKeys,createTime,updateTime,state,additionalAttributes,
        parentFullResourceName, parentAssetType. Note: name will always be returned.
        There is also an option to provide more advanced filters. For example, if
        you want to return a specific key from the "additionalAttributes" you can
        provide "additionalAttributes.{key}". Also, if you want to exclude a specific
        key from "additionalAttributes",then you can provide "-additionalAttributes.{key}".'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_resource_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
