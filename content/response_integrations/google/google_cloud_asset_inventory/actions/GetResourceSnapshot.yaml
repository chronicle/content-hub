name: Get Resource Snapshot
description: Get information about the resource using Google Cloud Asset Inventory.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-asset-inventory#get_resource_snapshot
integration_identifier: GoogleCloudAssetInventory
parameters:
-   name: Resource Names
    default_value: ''
    type: string
    description: Specify a comma-separated list of resources for which you want to
        fetch details.
    is_mandatory: true
-   name: Fields To Return
    default_value: '*'
    type: string
    description: 'Specify a comma-separated list of fields to return. Note: every
        field should be in format with "assets.{field}" Example of values:

        assets.asset.name, assets.asset.assetType,assets.asset.resource.data.

        Note: assets.asset.name will always be returned.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_resource_snapshot_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
