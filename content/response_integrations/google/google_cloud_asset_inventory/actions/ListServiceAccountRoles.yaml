name: List Service Account Roles
description: List roles related to the Google Cloud service account using Google Cloud
    Asset Inventory.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/google-cloud-asset-inventory#list_service_account_roles
integration_identifier: GoogleCloudAssetInventory
parameters:
-   name: Service Accounts
    default_value: ''
    type: string
    description: Specify a comma-separated list of service accounts for which you
        want to fetch details.
    is_mandatory: true
-   name: Check Roles
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of roles that you want to check in
        relation to the service account. Example: roles/cloudasset.owner'
    is_mandatory: false
-   name: Check Permissions
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of permission that you want to check
        in relation to the service account. Example: cloudasset.assets.listResource.'
    is_mandatory: false
-   name: Expand Permissions
    default_value: false
    type: boolean
    description: If enabled, action will return information about all of the unique
        permissions related to the resource.
    is_mandatory: false
-   name: Max Roles To Return
    default_value: 100
    type: string
    description: Specify how many roles related to the service account to return.
    is_mandatory: true
-   name: Max Permissions To Return
    default_value: 100
    type: string
    description: Specify how many permissions related to the service account to return.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/list_service_account_roles_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
