[project]
name = "sentinel_one_v2"
version = "53.0"
description = "Endpoint security software that defends every endpoint against every type of attack, at every stage in the threat lifecycle."
requires-python = ">=3.11,<3.12"
dependencies = [ "arrow==1.3.0", "environmentcommon", "requests==2.32.5", "setuptools>=84.2.1", "tipcommon",]

[dependency-groups]
dev = [ "integration-testing", "pytest>=9.2.0", "pytest-json-report>=1.5.0", "soar-sdk",]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources.tipcommon]
path = "../../../../packages/tipcommon/whls/TIPCommon-2.3.4-py3-none-any.whl"

[tool.uv.sources.environmentcommon]
path = "../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"

[tool.uv.sources.soar-sdk]
git = "https://github.com/chronicle/soar-sdk.git"

[tool.uv.sources.integration-testing]
path = "../../../../packages/integration_testing_whls/integration_testing-2.3.4-py3-none-any.whl"
