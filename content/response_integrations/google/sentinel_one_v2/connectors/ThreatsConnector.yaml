name: SentinelOne - Threats Connector
parameters:
-   name: DeviceProductField
    default_value: siemplify_event
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: true
    mode: regular
-   name: EventClassId
    default_value: threatinfo_classification
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: false
    is_advanced: true
    mode: regular
-   name: PythonProcessTimeout
    default_value: '180'
    type: string
    description: Timeout limit for the python process running the current script.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: API Root
    default_value: https://usea1-partners.sentinelone.net/
    type: string
    description: Address of SentinelOne API root.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Token
    default_value: ''
    type: password
    description: SentinelOne API token.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Verify SSL
    default_value: 'TRUE'
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Sentinel public cloud server is valid.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Fetch Max Days Backwards
    default_value: '1'
    type: integer
    description: Number of days before the first connector iteration to retrieve threats
        from. This parameter applies to the initial connector iteration after you
        enable the connector for the first time, or used as a fallback value in cases
        where connector's last run timestamp expires.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Disable Overflow
    default_value: false
    type: boolean
    description: If enabled, connector will ignore the overflow mechanism.
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Alerts Per Cycle
    default_value: 25
    type: integer
    description: How many alerts should be processed during one connector run.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Event Object Type Filter
    default_value: ''
    type: string
    description: 'A comma-separated list of event objects that need to be returned
        alongside threat info. This parameter is used as a filter to only return certain
        objects. Examples: process,ip,indicators. If nothing is provided, the connector
        will ingest all event object types.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Event Type Filter
    default_value: ''
    type: string
    description: 'A comma-separated list of event types that need to be returned alongside
        threat info. This parameter is used as a filter to only return certain event
        types. Examples: Process Creation, Behavioral Indicators.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Max Events To Return
    default_value: 199
    type: integer
    description: 'How many events to return per threat. Maximum: 199.'
    is_mandatory: false
    is_advanced: false
    mode: script
-   name: Use whitelist as a blacklist
    default_value: 'FALSE'
    type: boolean
    description: If enabled, whitelist will be used as a blacklist.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: API Version
    default_value: '2.0'
    type: string
    description: 'Specify what version of api to use in the connector. If nothing
        is provided connector will use version 2.1. Note: Siemplify Event structure
        is different between API versions. It is recommended to use the latest one.
        Possible values: 2.0, 2.1.'
    is_mandatory: false
    is_advanced: false
    mode: script
description: Pull threats from SentinelOne.
integration: SentinelOneV2
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#sentinelone_-_threats_connector
rules: []
is_connector_rules_supported: false
creator: Admin
