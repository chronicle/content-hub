name: SentinelOne - Alerts Connector
parameters:
-   name: DeviceProductField
    default_value: Product Name
    type: string
    description: Enter the source field name in order to retrieve the Product Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: ruleInfo_name
    type: string
    description: Enter the source field name in order to retrieve the Event Field
        name.
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: Environment Field Name
    default_value: ''
    type: string
    description: Describes the name of the field where the environment name is stored.
        If the environment field isn't found, the environment is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Environment Regex Pattern
    default_value: .*
    type: string
    description: A regex pattern to run on the value found in the "Environment Field
        Name" field. Default is .* to catch all and return the value unchanged. Used
        to allow the user to manipulate the environment field via regex logic. If
        the regex pattern is null or empty, or the environment value is null, the
        final environment result is the default environment.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: PythonProcessTimeout
    default_value: 180
    type: integer
    description: The timeout limit in seconds for the python process running the current
        script.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: API Root
    default_value: ''
    type: string
    description: Address of SentinelOne API root.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: API Token
    default_value: ''
    type: password
    description: SentinelOne API token.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Status Filter
    default_value: Unresolved, In Progress
    type: string
    description: 'Comma-separated list of status that should be ingested. Possible
        values: Unresolved, In Progress, Resolved. If nothing is provided, the connector
        will fetch alerts with statuses Unresolved and InProgress.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Case Name Template
    default_value: ''
    type: string
    description: 'When provided, connector will add a new key called "custom_case_name"
        to the Event. It can used to have a customer case name. Please refer to the
        documentation portal for more details. You can provide placeholders in the
        following format: [name of the field]. Example: Phishing - [event_mailbox].
        Note: connector will use first Siemplify Event for placeholders. Only keys
        that have string value will be handled.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Name Template
    default_value: ''
    type: string
    description: 'If provided, connector will use this value for Alert Name. Please
        refer to the documentation portal for more details. You can provide placeholders
        in the following format: [name of the field]. Example: Phishing - [event_mailbox].
        Note: connector will use first Siemplify Event for placeholders. Only keys
        that have string value will be handled. If nothing is provided or user provides
        an invalid template, connector will use the default alert name.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Lowest Severity To Fetch
    default_value: ''
    type: string
    description: 'Lowest severity of the alerts to fetch. If nothing is provided,
        the connector will ingest alerts with all severities. Possible Values: Info,
        Low, Medium, High, Critical.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: Amount of hours from where to fetch alerts.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Alerts To Fetch
    default_value: 10
    type: integer
    description: 'How many alerts to process per one connector iteration. Maximum:
        100.'
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Use dynamic list as a blocklist
    default_value: false
    type: boolean
    description: If enabled, the dynamic list will be used as a blocklist.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Disable Overflow
    default_value: true
    type: boolean
    description: If enabled, connector will ignore the overflow mechanism.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        SentinelOne server is valid.
    is_mandatory: true
    is_advanced: true
    mode: script
-   name: Proxy Server Address
    default_value: ''
    type: string
    description: The address of the proxy server to use.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Username
    default_value: ''
    type: string
    description: The proxy username to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Proxy Password
    default_value: ''
    type: password
    description: The proxy password to authenticate with.
    is_mandatory: false
    is_advanced: true
    mode: script
description: Pull alerts from SentinelOne. Dynamic List works with the “ruleInfo.name”
    parameter.
integration: SentinelOneV2
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#sentinelone_-_alerts_connector
rules: []
is_connector_rules_supported: false
creator: admin
