name: Delete Device Control Rule
description: Delete a Device Control Rule in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#delete_device_control_rule
integration_identifier: SentinelOneV2
parameters:
-   name: Rule ID
    default_value: ''
    type: string
    description: ID of the rule that needs to be deleted.
    is_mandatory: true
-   name: Scope Type
    default_value: Account
    type: ddl
    optional_values:
    - Account
    - Site
    - Group
    description: Scope type in which the alert is available.
    is_mandatory: false
-   name: Scope ID
    default_value: ''
    type: string
    description: ID of the scope.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
