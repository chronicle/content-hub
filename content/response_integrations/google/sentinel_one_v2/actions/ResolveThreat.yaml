name: Resolve Threat
description: Resolve threats in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#resolve_threat
integration_identifier: SentinelOneV2
parameters:
-   name: Threat IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of threat IDs that need to be resolved.
    is_mandatory: true
-   name: Annotation
    default_value: ''
    type: string
    description: Specify an annotation describing, why the threat can be resolved.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/resolve_threat_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
