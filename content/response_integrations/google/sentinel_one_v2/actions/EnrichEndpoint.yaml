name: Enrich Endpoint
description: Enrich information about the endpoint by IP address or Hostname.
integration_identifier: SentinelOneV2
parameters:
-   name: Create Insight
    default_value: true
    type: boolean
    description: If enabled, action will create an insight with information about
        endpoints.
    is_mandatory: false
-   name: Only Infected Endpoints Insights
    default_value: true
    type: boolean
    description: If enabled, action will only create insights for the infected endpoints.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_endpoint_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
