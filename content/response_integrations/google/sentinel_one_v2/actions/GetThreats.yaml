name: Get Threats
description: Retrieve information about threats in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#get_threats
integration_identifier: SentinelOneV2
parameters:
-   name: Mitigation Status
    default_value: ''
    type: string
    description: 'Specify the comma-separated list of threat statuses. Only threats
        that match the statuses will be returned. Possible values: mitigated, active,
        blocked, suspicious, suspicious_resolved'
    is_mandatory: false
-   name: Created until
    default_value: ''
    type: string
    description: 'Specify the end time for the threats. Example: 2020-03-02T21:30:13.014874Z'
    is_mandatory: false
-   name: Created from
    default_value: ''
    type: string
    description: 'Specify the start time for the threats. Example: 2020-03-02T21:30:13.014874Z'
    is_mandatory: false
-   name: Resolved Threats
    default_value: false
    type: boolean
    description: If enabled, action will only return resolved threats.
    is_mandatory: false
-   name: Threat Display Name
    default_value: ''
    type: string
    description: Specify a display name of the threat that you want to return. Partial
        name will also work.
    is_mandatory: false
-   name: Limit
    default_value: '10'
    type: string
    description: 'Specify how many threats to return. Default: 10.'
    is_mandatory: false
-   name: API Version
    default_value: '2.0'
    type: ddl
    optional_values:
    - '2.0'
    - '2.1'
    description: 'Specify what version of API to use in the action. If nothing is
        provided connector will use version 2.1. Note: JSON result structure is different
        between API versions. It is recommended to use the latest one.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_threats_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
