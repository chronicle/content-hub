name: Create Device Control Rule
description: Create a Device Control Rule in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#create_device_control_rule
integration_identifier: SentinelOneV2
parameters:
-   name: Rule JSON
    default_value: '{"ruleName": "String","interface": "String","ruleType": "String","action":
        "String","accessPermission": "String","deviceClass": "String","status": "String"}'
    type: string
    description: JSON object of the device control rule.
    is_mandatory: true
-   name: Scope JSON
    default_value: '{"accountIds": "String","groupIds": "String","siteIds": "String"}'
    type: string
    description: JSON object of the scope rule.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/CreateDeviceControlRule_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
