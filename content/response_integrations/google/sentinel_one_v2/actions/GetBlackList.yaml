name: Get Blacklist
description: Get a list of all the items available in the blacklist in SentinelOne.
integration_identifier: SentinelOneV2
parameters:
-   name: Hash
    default_value: ''
    type: string
    description: 'Specify a comma-separated list of hashes that need to be checked
        in blacklist. Only hashes that were found will be returned. If nothing is
        specified here action will return all hashes. Note: if "Hash" parameter is
        provided then "Limit" parameter is ignored.'
    is_mandatory: false
-   name: Site IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of site ids, which should be used
        to return blacklist items.
    is_mandatory: false
-   name: Group IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of group ids, which should be used
        to return blacklist items.
    is_mandatory: false
-   name: Account IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of account ids, which should be used
        to return blacklist items.
    is_mandatory: false
-   name: Limit
    default_value: 50
    type: string
    description: 'Specify how many blacklist items should be returned. Note: if "Hash"
        parameter has values, then this parameter is ignored. Maximum is 1000.'
    is_mandatory: false
-   name: Query
    default_value: ''
    type: string
    description: Specify the query that needs to be used in order to filter the results.
    is_mandatory: false
-   name: Use Global Blacklist
    default_value: 'False'
    type: boolean
    description: If enabled, action will also return hashes from the global blacklist.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_black_list_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
