name: Initiate Deep Visibility Query
description: Initiate a Deep Visibility Query search. Returns query id, which should
    be used in the action "Get Deep Visibility Query Result".
integration_identifier: SentinelOneV2
parameters:
-   name: Query
    default_value: ''
    type: string
    description: Specify the query for the search.
    is_mandatory: true
-   name: Start Date
    default_value: ''
    type: string
    description: Specify the start date for the search. If nothing is specified, action
        will fetch events from 30 days ago.
    is_mandatory: false
-   name: End Date
    default_value: ''
    type: string
    description: Specify the end date for the search. If nothing is specified, action
        will use current time.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/initiate_deep_visibility_query_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
