name: Delete Hash Blacklist Record
description: 'Delete hashes from a blacklist in SentinelOne. Note: Only SHA1 hashes
    are supported.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#delete_hash_blacklist_record
integration_identifier: SentinelOneV2
parameters:
-   name: Site IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of site ids, from where the hash needs
        to be removed.
    is_mandatory: false
-   name: Group IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of group ids, from where the hash
        needs to be removed.
    is_mandatory: false
-   name: Account IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of account ids, from where the hash
        needs to be removed.
    is_mandatory: false
-   name: Remove from global black list
    default_value: false
    type: boolean
    description: 'If enabled, action will remove the hash from the global black list.
        Note: when this parameter is enabled, parameters "Site IDs", "Group IDs" and
        "Account IDs" are ignored.'
    is_mandatory: false
dynamic_results_metadata: []
creator: Admin
simulation_data_json: '{"Entities": ["FILEHASH"]}'
