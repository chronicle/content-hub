name: Create Path Exclusion Record
description: Add path to the exclusion list in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#create_path_exclusion_record
integration_identifier: SentinelOneV2
parameters:
-   name: Path
    default_value: ''
    type: string
    description: Specify the path that needs to be added to the exclusion list.
    is_mandatory: true
-   name: Operation System
    default_value: windows
    type: string
    description: 'Specify the OS for the path. Possible values: windows, windows_legacy,
        macos, linux.'
    is_mandatory: true
-   name: Site IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of site ids, where path needs to be
        sent to the exclusion list.
    is_mandatory: false
-   name: Group IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of group ids, where path needs to
        be sent to the exclusion list.
    is_mandatory: false
-   name: Account IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of account ids, where path needs to
        be sent to the exclusion list.
    is_mandatory: false
-   name: Description
    default_value: ''
    type: string
    description: Specify additional information related to the path.
    is_mandatory: false
-   name: Add to global exclusion list
    default_value: 'False'
    type: boolean
    description: 'If enabled, action will add the path to the global exclusion list.
        Note: when this parameter is enabled, parameters “Site IDs“, “Group IDs“ and
        “Account IDs“ are ignored.'
    is_mandatory: false
-   name: Include Subfolders
    default_value: ''
    type: boolean
    description: If enabled, action will include subfolders for the provided path.
        This feature only works, if user provides folder path and not file path.
    is_mandatory: false
-   name: Mode
    default_value: Suppress Alerts
    type: ddl
    optional_values:
    - Suppress Alerts
    - Interoperability
    - Interoperability - Extended
    - Performance Focus
    - Performance Focus - Extended
    description: Specify what mode should be used for the excluded path.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_path_exclusion_record_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
