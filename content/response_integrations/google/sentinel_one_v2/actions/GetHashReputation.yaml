name: Get Hash Reputation
description: Deprecated! Retrieve information about the hashes from SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#get_hash_reputation
integration_identifier: SentinelOneV2
parameters:
-   name: Reputation Threshold
    default_value: '5'
    type: string
    description: 'Specify what should be the reputation threshold in order it to be
        marked as suspicious. If nothing is provided, action will not mark entites
        as suspicious. Maximum: 10.'
    is_mandatory: false
-   name: Create Insight
    default_value: true
    type: boolean
    description: If enabled, action will create an insight containing information
        about the reputation.
    is_mandatory: false
-   name: Only Suspicious Hashes Insight
    default_value: true
    type: boolean
    description: If enabled, action will only create insight for hashes that have
        higher or equal reputation to “Reputation Threshold“ value.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_hash_reputation_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["FILEHASH"]}'
