name: Download Threat File
description: 'Download file related to threat in SentinelOne. Note: Your user role
    must have permissions to Fetch Threat File - Admin, IR Team, SOC.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#download_threat_file
integration_identifier: SentinelOneV2
parameters:
-   name: Threat ID
    default_value: ''
    type: string
    description: Specify the id of the threat for which you want to download the file.
    is_mandatory: true
-   name: Password
    default_value: ''
    type: password
    description: 'Specify the password for the zip that contains the threat file.
        Password requirements: At least 10 characters. Three of these: uppercase,
        lowercase, digits, special symbols. Maximum length is 256 characters.'
    is_mandatory: true
-   name: Download Folder Path
    default_value: ''
    type: string
    description: Specify the path to the folder, where you want to store the threat
        file.
    is_mandatory: true
-   name: Overwrite
    default_value: false
    type: boolean
    description: If enabled, action will overwrite the file with the same name.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/download_threat_file_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
