name: Get Events For Endpoint Hours Back
description: 'Retrieve information about the latest events on the endpoint. Works
    with IP and Hostname entities.Note: this action uses an endpoint that has rate
    limiting. Only one endpoint can be processed per minute․'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#get_events_for_endpoint_hours_back
integration_identifier: SentinelOneV2
parameters:
-   name: Hours Back
    default_value: ''
    type: string
    description: Specify how many hours backwards to fetch events.
    is_mandatory: true
-   name: Events Amount Limit
    default_value: '50'
    type: string
    description: 'Specify how many events to return per event type. Default: 50.'
    is_mandatory: false
-   name: Include File Events Information
    default_value: false
    type: boolean
    description: If enabled, action will also query information about file events.
    is_mandatory: false
-   name: Include Indicator Events Information
    default_value: false
    type: boolean
    description: If enabled, action will also query information about indicator events.
    is_mandatory: false
-   name: Include DNS Events Information
    default_value: false
    type: boolean
    description: If enabled, action will also query information about DNS events.
    is_mandatory: false
-   name: Include Network Actions Events Information
    default_value: false
    type: boolean
    description: If enabled, action will also query information about “network actions”
        events.
    is_mandatory: false
-   name: Include URL Events Information
    default_value: false
    type: boolean
    description: If enabled, action will also query information about URL events.
    is_mandatory: false
-   name: Include Registry Events Information
    default_value: false
    type: boolean
    description: If enabled, action will also query information about registry events.
    is_mandatory: false
-   name: Include Scheduled Task Events Information
    default_value: false
    type: boolean
    description: If enabled, action will also query information about scheduled task
        events.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_events_for_endpoint_hours_back_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
