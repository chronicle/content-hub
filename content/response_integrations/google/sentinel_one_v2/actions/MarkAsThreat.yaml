name: Mark as Threat
description: Marks suspicious threats as a true positive threat in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#mark_as_threat
integration_identifier: SentinelOneV2
parameters:
-   name: Threat IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of threat IDs that should be marked.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/MarkAsThreat_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities":[]}'
