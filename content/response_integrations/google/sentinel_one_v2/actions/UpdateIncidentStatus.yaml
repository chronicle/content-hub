name: Update Incident Status
description: Update threat incident status in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#update_incident_status
integration_identifier: SentinelOneV2
parameters:
-   name: Threat ID
    default_value: ''
    type: string
    description: Specify a comma-separated list of threat ids for which you want to
        update the incident status.
    is_mandatory: true
-   name: Status
    default_value: Resolved
    type: ddl
    optional_values:
    - Resolved
    - Unresolved
    - In Progress
    description: Specify the incident status.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
