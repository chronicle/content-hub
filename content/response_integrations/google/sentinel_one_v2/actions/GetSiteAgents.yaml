name: Get Site Agents
description: Get information about agents related to a Site in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#get_site_agents
integration_identifier: SentinelOneV2
parameters:
-   name: Site Name
    default_value: ''
    type: string
    description: The name of the site to return.
    is_mandatory: true
-   name: Max Agents To Return
    default_value: 100
    type: string
    description: 'The maximum number of agents to return. Maximum: 1000.'
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/get_site_agents_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
