name: Update Alert
description: Update an alert in SentinelOne.
integration_identifier: SentinelOneV2
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: Specify the ID of the alert that needs to be updated.
    is_mandatory: true
-   name: Status
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - Unresolved
    - In Progress
    - Resolved
    description: Specify the status for the alert.
    is_mandatory: false
-   name: Verdict
    default_value: Select One
    type: ddl
    optional_values:
    - Select One
    - True Positive
    - False Positive
    - Suspicious
    description: Specify the verdict for the alert.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/update_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
