name: Move Agents
description: 'Move agents to the provided group. This action works with Hostname and
    IP address entities. Note: the group should be from the same site.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#move_agents
integration_identifier: SentinelOneV2
parameters:
-   name: Group ID
    default_value: ''
    type: string
    description: Specify the ID of the group, where to move the agents.
    is_mandatory: false
-   name: Group Name
    default_value: ''
    type: string
    description: 'Specify the name of the group, where to move the agents. Note: if
        both Group ID and Group Name are provided, action will put “Group ID“ in the
        priority.'
    is_mandatory: false
dynamic_results_metadata: []
creator: Admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
