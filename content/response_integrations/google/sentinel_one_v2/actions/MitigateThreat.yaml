name: Mitigate Threat
description: Executes mitigation actions on the threats in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#mitigate_threat
integration_identifier: SentinelOneV2
parameters:
-   name: Mitigation action
    default_value: quarantine
    type: ddl
    optional_values:
    - kill
    - quarantine
    - un-quarantine
    - remediate
    - rollback-remediation
    description: Specify the mitigation actions for the provided threats.
    is_mandatory: true
-   name: Threat IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of threat IDs that should be mitigated.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/mitigate_threat_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
