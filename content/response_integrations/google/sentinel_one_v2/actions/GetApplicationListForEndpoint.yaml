name: Get Application List For Endpoint
description: Retrieve information about available applications on the endpoint by
    IP or Hostname.
integration_identifier: SentinelOneV2
parameters:
-   name: Max Applications To Return
    default_value: ''
    type: string
    description: Specify how many applications to return. If nothing is specified
        action will return all of the applications.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_application_list_for_endpoint_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["HOSTNAME", "ADDRESS"]}'
