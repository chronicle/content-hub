name: Create Hash Exclusion Record
description: 'Add hash to the exclusion list in SentinelOne. Note: Only SHA1 hashes
    are supported.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#create_hash_exclusion_record
integration_identifier: SentinelOneV2
parameters:
-   name: Operation System
    default_value: windows
    type: string
    description: 'Specify the OS for the hash. Possible values: windows, windows_legacy,
        macos, linux.'
    is_mandatory: true
-   name: Site IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of site ids, where hash needs to be
        sent to the exclusion list.
    is_mandatory: false
-   name: Group IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of group ids, where hash needs to
        be sent to the exclusion list.
    is_mandatory: false
-   name: Account IDs
    default_value: ''
    type: string
    description: Specify a comma-separated list of account ids, where hash needs to
        be sent to the exclusion list.
    is_mandatory: false
-   name: Description
    default_value: ''
    type: string
    description: Specify additional information related to the hash.
    is_mandatory: false
-   name: Add to global exclusion list
    default_value: ''
    type: boolean
    description: 'If enabled, action will add the hash to the global exclusion list.
        Note: when this parameter is enabled, parameters “Site IDs“, “Group IDs“ and
        “Account IDs“ are ignored.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/create_hash_exclusion_record_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
simulation_data_json: '{"Entities": ["FILEHASH"]}'
