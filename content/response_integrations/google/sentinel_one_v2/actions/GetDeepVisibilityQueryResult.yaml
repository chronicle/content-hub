name: Get Deep Visibility Query Result
description: 'Retrieve information about deep visibility query results. Note: this
    action should be used in combination with “Initiate Deep Visibility Query“.'
integration_identifier: SentinelOneV2
parameters:
-   name: Query ID
    default_value: ''
    type: string
    description: Specify the ID of the query for which you want to return results.
        This ID is available in the JSON result of the action “Initiate Deep Visibility
        Query“ as “query_id“ parameter.
    is_mandatory: true
-   name: Limit
    default_value: '50'
    type: string
    description: 'Specify how many events to return. Default: 50. Maximum is 100.'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_deep_visibility_query_result_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
is_async: true
