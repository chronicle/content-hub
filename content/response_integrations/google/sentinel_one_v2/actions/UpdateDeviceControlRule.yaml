name: Update Device Control Rule
description: Update a Device Control Rule in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#update_device_control_rule
integration_identifier: SentinelOneV2
parameters:
-   name: Rule ID
    default_value: ''
    type: string
    description: ID of the rule that needs to be updated
    is_mandatory: true
-   name: Rule JSON
    default_value: '{"ruleName": "String","interface": "String","ruleType": "String","action":
        "String","accessPermission": "String","deviceClass": "String","status": "String"}'
    type: string
    description: JSON object of the device control rule.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/update_device_control_rule_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: Admin
