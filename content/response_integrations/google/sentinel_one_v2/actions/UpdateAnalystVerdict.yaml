name: Update Analyst Verdict
description: Update analyst verdict of the threat in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelonev2#update_analyst_verdict
integration_identifier: SentinelOneV2
parameters:
-   name: Threat ID
    default_value: ''
    type: string
    description: Specify a comma-separated list of threat ids for which you want to
        update the analyst verdict.
    is_mandatory: true
-   name: Analyst Verdict
    default_value: Undefined
    type: ddl
    optional_values:
    - False Positive
    - True Positive
    - Suspicious
    - Undefined
    description: Specify the analyst verdict.
    is_mandatory: true
dynamic_results_metadata: []
creator: Admin
