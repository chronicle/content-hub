    3. Determines if the provided path is a file or a folder to set the correct exclusion
    type.

    4. Makes a POST request to the SentinelOne API (`/web/api/v2.1/exclusions`) to
    create the path exclusion record.

    5. Returns the JSON representation of the created exclusion record(s) and attaches
    it to the action result.


    ### Additional Notes

