Update Incident Status:
  ai_description: >-
    ### General Description

    Updates the incident status for one or more threats in SentinelOne. This action
    allows security analysts to programmatically manage the lifecycle of threats by
    transitioning them between statuses such as Resolved, Unresolved, or In Progress.


    ### Flow Description

    1. Extracts the provided Threat IDs and target Status.

    2. Initializes the SentinelOne API client.

    3. Iterates through each Threat ID and fetches its current state using a GET request
    to verify its existence and current status.

    4. If the current status differs from the target status, sends a POST request
    to the SentinelOne API to update the incident status.

    5. Aggregates the results and returns a summary of successful and failed updates.


    ### Additional Notes

    If a threat already has the target status, the action skips the update and marks
    it as successful.
