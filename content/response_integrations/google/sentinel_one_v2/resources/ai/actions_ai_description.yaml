Create Hash Blacklist Record:
  ai_description: >-
    ### General Description

    Adds file hashes to the SentinelOne blacklist (restrictions). This action is used
    to prevent the execution of specific files identified by their SHA1 hash across
    the SentinelOne protected environment. It supports scoping the blacklist to specific
    Accounts, Sites, or Groups, or applying it globally across the entire tenant.


    ### Flow Description

    1. Extracts parameters including the target Operating System and the scope of
    the blacklist.

    2. Filters target entities to identify all `FILEHASH` entities.

    3. Validates that at least one scope is defined: either the 'Add to global black
    list' flag must be true, or at least one Site, Group, or Account ID must be provided.

    4. Iterates over the filtered entities and sends a POST request to the SentinelOne
    API (`/web/api/v{api_version}/restrictions`) to create a new restriction record
    for each hash.

    5. Handles 'Already Exists' errors to inform the user if a hash was already blacklisted
    and catches permission errors.

    6. Compiles a summary of successful, already existing, and failed operations,
    providing the raw JSON results for successful additions.


    ### Additional Notes

    - Only SHA1 hashes are supported by SentinelOne for this operation.

    - At least one scope must be configured: either 'Add to global black list' must
    be set to True, or at least one of 'Site IDs', 'Group IDs', or 'Account IDs' must
    be populated for the action to execute.
  ai_short_description: >-
    Adds file hashes to the SentinelOne blacklist to prevent the execution of specific
