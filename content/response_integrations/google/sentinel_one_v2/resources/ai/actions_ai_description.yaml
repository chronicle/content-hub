Get Events For Endpoint Hours Back:
  ai_description: >-
    ### General Description

    Retrieves information about the latest events on a specified endpoint from SentinelOne.
    This action supports IP Address and Hostname entities. It utilizes SentinelOne's
    Deep Visibility capabilities to fetch various event types, including process creations,
    file modifications, DNS queries, network actions, and more. Due to SentinelOne
    API rate limits for Deep Visibility queries, this action is designed to process
    one endpoint per minute and operates asynchronously to wait for query completion.


    ### Flow Description

    1. Iterates through the provided IP and Hostname entities.

    2. Attempts to find a matching SentinelOne Agent UUID using the SentinelOne API
    for each entity.

    3. Initializes a Deep Visibility query targeting the specific Agent UUID within
    the timeframe defined by the `Hours Back` parameter.

    4. Enters an asynchronous wait state, allowing the SentinelOne backend time to
    process the query.

    5. Checks the status of the initialized queries in subsequent runs.

    6. Once a query is marked as completed, fetches the results for all enabled event
    categories (Process events are fetched by default; others depend on the parameters).

    7. Formats the retrieved events into data tables and attaches them to the case,
    providing the raw data in the action's JSON result.


    ### Additional Notes

    - SentinelOne imposes strict rate limits on Deep Visibility query initialization.
    This action is optimized to handle these limits, but users should avoid running
    it on a large number of entities simultaneously.

    - Process events are always included if found, regardless of the optional boolean
    parameters.
