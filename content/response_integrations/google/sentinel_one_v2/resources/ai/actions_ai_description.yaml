    1. Extracts the target group ID or Name from the action parameters.

    2. If only a Group Name is provided, queries the SentinelOne API to resolve the
    corresponding Group ID.

    3. Iterates through the provided Hostname and IP Address entities.

    4. Queries SentinelOne to find the corresponding agent for each entity identifier.

    5. Sends a PUT request to the SentinelOne API to move the identified agents to
    the target group.

