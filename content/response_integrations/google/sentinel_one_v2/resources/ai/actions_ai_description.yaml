Disconnect Agent From Network:
  ai_description: >-
    ### General Description

    Disconnects SentinelOne agents from the network based on Hostname or IP Address
    entities. This action is primarily used for host isolation during incident response
    to prevent the spread of threats, effectively containing the endpoint via the
    EDR.


    ### Flow Description

    1. **Entity Filtering**: Iterates over the target entities and filters them to
    identify supported types (Hostnames and IP Addresses).

    2. **Agent Lookup**: For each suitable entity, queries the SentinelOne API (via
    GET request) to retrieve the unique Agent ID associated with that hostname or
    IP address.

    3. **Network Disconnection**: If an agent is found, issues a POST request to the
    SentinelOne API to disconnect that specific agent from the network.

    4. **Result Processing**: Tracks successful disconnections and captures any errors
    encountered during the process, outputting them to the action results and a data
    table if necessary.


