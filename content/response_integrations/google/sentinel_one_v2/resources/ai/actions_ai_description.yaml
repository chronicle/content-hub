    3. **Entity Filtering**: Filters entities to include only `FILEHASH` entities.

    4. **Hash Verification**: Verifies if the entity identifier is a valid SHA1 hash
    (40 characters).

    5. **Lookup**: Queries the SentinelOne API (`GET /web/api/v{api_version}/restrictions`)
    to find the internal restriction ID associated with the hash in the specified
    scope.

    6. **Deletion**: Executes a `DELETE` request to the SentinelOne API (`/web/api/v{api_version}/restrictions`)
    to remove the specific hash from the blacklist.

    7. **Reporting**: Returns a summary of successfully removed hashes, hashes not
    found, and failed hashes.


