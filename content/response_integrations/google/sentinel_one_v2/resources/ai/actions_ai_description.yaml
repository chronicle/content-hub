    1. **Initialization**: The action extracts API credentials and connection settings
    to initialize the SentinelOne manager.

    2. **Parameter Validation**: It validates that the filtering logic is consistent
    (e.g., ensuring a key is selected if logic is provided) and that the record limit
    is a positive integer.

    3. **Data Retrieval**: The action performs a paginated GET request to the SentinelOne
    `/web/api/v2.1/sites` endpoint to fetch the raw list of sites.

    4. **Filtering**: It applies the user-defined filter (Equal or Contains) against
    the retrieved site objects based on the selected Filter Key.

    5. **Output Generation**: The filtered results are formatted into a data table
    named "Available Sites" and attached as a JSON result to the action output.


    ### Additional Notes

