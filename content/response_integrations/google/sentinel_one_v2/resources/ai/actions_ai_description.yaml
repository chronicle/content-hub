  ai_description: >-
    ### General Description

    The **List Sites** action retrieves a list of available sites from the SentinelOne
    console. This utility action is primarily used for discovery and administrative
    purposes, allowing users to identify site IDs, names, and statuses within their
    SentinelOne environment. It supports client-side filtering to narrow down results
    based on specific criteria.


