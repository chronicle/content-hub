Delete Hash Blacklist Record:
  ai_description: >-
    Deletes SHA1 file hashes from the SentinelOne blacklist (restrictions). This action
    allows security analysts to unblock specific file hashes across different scopes,
    including specific sites, groups, accounts, or the entire global tenant.


    ### Flow Description

    1. **Initialization**: Retrieves connection details and scope parameters (Site,
    Group, Account IDs, or Global flag).

