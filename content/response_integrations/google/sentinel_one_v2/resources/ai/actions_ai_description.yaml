Get Hash Reputation:
  ai_description: >-
    ### General Description

    Retrieves reputation information for File Hash entities from SentinelOne. This
    action queries the SentinelOne API to obtain a reputation rank (0-10) for each
    hash and uses a configurable threshold to determine if the entity should be marked
    as suspicious within the SOAR platform. It enriches the entity with reputation
    data and can optionally generate insights based on the findings.


    ### Flow Description

    1. Retrieves action parameters, including the reputation threshold and insight
    preferences.

    2. Filters the target entities to identify all `FILEHASH` entities.

    3. For each hash, calls the SentinelOne API to fetch its reputation rank.

    4. Compares the retrieved rank against the `Reputation Threshold`. If the rank
    is higher or equal, the entity is flagged as suspicious.

    5. Updates the entity's additional properties with the reputation data.

    6. If configured, generates a SOAR insight for the entity.

    7. Commits the changes (suspicious status and enrichment data) to the SOAR entities.


    ### Additional Notes

    The maximum allowed value for the Reputation Threshold is 10. If a value higher
    than 10 is provided, it will default to 10.
