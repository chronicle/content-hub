name: Sync Threats
parameters:
-   name: Environment Name
    default_value: Default Environment
    type: string
    description: Name of the environment, where to search for threats.
    is_mandatory: true
-   name: API Root
    default_value: ''
    type: string
    description: Address of SentinelOne API root.
    is_mandatory: true
-   name: API Token
    default_value: ''
    type: password
    description: SentinelOne API token.
    is_mandatory: true
-   name: Max Hours Backwards
    default_value: 24
    type: integer
    description: 'Specify how many hours backwards to synchronize alerts. Default:
        24 hours.'
    is_mandatory: true
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        SentinelOne server is valid.
    is_mandatory: true
description: 'This job will synchronize Google SecOps Alerts and SentinelOne threats.
    The job synchronizes comments and status. Requires “SentinelOne Threat” tag on
    the case. Note: If the alert didn’t originate from “Threats Connector” you will
    need to add an “Threat_ID” Alert Context Value for the job to be able to find
    the correct information. '
documentation_link: null
integration: SentinelOneV2
creator: Admin
