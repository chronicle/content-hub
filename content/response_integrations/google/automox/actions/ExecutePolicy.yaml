name: Execute Policy
description: 'Execute a policy in Automox. Supported entities: Hostname, IP Address.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/automox#execute_policy
integration_identifier: Automox
parameters:
-   name: Remediation Scope
    default_value: All Devices
    type: ddl
    optional_values:
    - Only Entities
    - All Devices
    description: Specify the remediation scope for the action. If “Only Entities”
        is selected, then action will execute policies only on the valid entities
        in the scope. If “All Devices” is selected, then action will execute the policy
        on all devices in the organization.
    is_mandatory: true
-   name: Policy Name
    default_value: ''
    type: string
    description: Specify the name of the policy that needs to be executed.
    is_mandatory: true
dynamic_results_metadata:
-   result_example_path: resources/execute_policy_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
