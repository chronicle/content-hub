name: Execute Device Command
description: 'Execute a command on the endpoint in Automox. Supported entities: Hostname,
    IP Address. Note: Action is running as async, please adjust script timeout value
    in Chronicle SOAR for action as needed.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/automox#execute_device_command
integration_identifier: Automox
parameters:
-   name: Command
    default_value: Scan Device
    type: ddl
    optional_values:
    - Scan Device
    - Install Specific Patches
    - Install All Available Patches
    - Restart Device
    description: 'Specify a command that needs to be executed on the device. Note:
        if "Install Specific Patches" is provided, parameter "Patch Names" is mandatory.'
    is_mandatory: false
-   name: Patch Names
    default_value: ''
    type: string
    description: Specify a comma-separated list of patches that need to be installed.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/execute_device_command_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
is_async: true
