name: Enrich Entities
description: 'Enrich entities using information from Automox. Supported entities:
    Hostname, IP Address.'
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/automox#enrich_entities
integration_identifier: Automox
parameters:
-   name: Return Patches
    default_value: true
    type: boolean
    description: 'If enabled, action will return a list of patches that need to be
        updated on the machine. Note: action will not return patches that were installed
        or the ones that are currently ignored.'
    is_mandatory: false
-   name: Max Patches To Return
    default_value: 50
    type: string
    description: Specify how many patches to return. If nothing is provided, action
        will return 50 patches.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/enrich_entities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
