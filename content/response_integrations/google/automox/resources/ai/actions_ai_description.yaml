Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities using device information from Automox.
    This action retrieves comprehensive device metadata, including operating system
    details, agent version, compliance status, and connection state. It helps security
    analysts understand the patch posture and configuration of endpoints within their
    environment.


    ### Flow Description

    1. **Parameter Validation**: Validates that 'Max Patches To Return' is a positive
    integer if 'Return Patches' is set to true.

    2. **Entity Filtering**: Identifies supported entities (Hostname and IP Address)
    from the target list.

    3. **Device Retrieval**: For each supported entity, queries the Automox API (`GET
    api/servers`) to find a matching device based on the entity's identifier.

    4. **Data Enrichment**: If a device is found, extracts metadata (OS, compliance,
    agent status, etc.) and updates the entity's additional properties.

    5. **Table Creation**: Generates and attaches a data table to the entity containing
    the flattened device information.

    6. **Patch Retrieval (Optional)**: If requested, fetches the list of pending patches
    (`GET api/servers/{device_id}/packages`) for the specific device ID and appends
    them to the JSON results.

    7. **Final Update**: Updates the enriched entities in Google SecOps and returns
    a summary message of the operation.


    ### Additional Notes

    - The action maps Hostname entities to the `display_name` field and IP Address
    entities to the `ip_addrs_private` field in Automox.

    - If 'Return Patches' is enabled, 'Max Patches To Return' must be greater than
    0, otherwise the action will fail.

    - Enrichment data added to entities is prefixed with 'Automox'.
  ai_short_description: >-
    Enriches Hostname and IP Address entities by retrieving comprehensive device metadata
    and pending patch information from Automox.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
