Execute Device Command:
  ai_description: >-
    ### General Description

    The **Execute Device Command** action allows users to remotely trigger administrative
    operations on endpoints managed by Automox. It supports operations such as scanning
    for vulnerabilities, installing specific or all available patches, and rebooting
    the device. This action operates asynchronously, meaning it initiates the command
    and then periodically checks the Automox queue until the task is completed or
    a timeout occurs.


    ### Flow Description

    1. **Entity Filtering**: The action filters the target entities to include only
    `HOSTNAME` and `ADDRESS` (IP) entities.

    2. **Device Resolution**: For each suitable entity, it queries the Automox API
    to find a matching device using the entity's original identifier.

    3. **Connectivity Check**: It verifies that the resolved device is currently online
    and connected to Automox.

    4. **Queue Check**: It checks the device's command queue to prevent duplicate
    execution of the same command.

    5. **Command Execution**: It sends a POST request to Automox to queue the requested
    command (and specific patches if provided).

    6. **Asynchronous Polling**: The action enters a query state where it periodically
    checks the status of the queued command until a response is received or the execution
    deadline is reached.

    7. **Result Reporting**: Once finished, it returns the execution details and response
    from the endpoint in a JSON format.


    ### Additional Notes

    - The action is asynchronous. It will poll the Automox API for the status of the
    command.

    - Ensure the script timeout in Google SecOps is configured appropriately for long-running
    tasks like patch installations.

    - The action only proceeds if the device is reported as "connected" in Automox.
  ai_short_description: >-
    Executes a specified administrative command (such as scanning, installing patches,
    or restarting) on endpoints managed by Automox.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
