Ping:
  ai_description: >-
    ### General Description

    The Ping action is a diagnostic tool used to verify the connectivity between Google
    SecOps and the Automox server. It ensures that the provided API credentials and
    the API Root URL are correct and that the network path is open.


    ### Flow Description

    1. The action retrieves the integration configuration parameters (API Root, API
    Key, Verify SSL).

    2. It initializes the AutomoxManager with the retrieved credentials.

    3. The manager executes a GET request to the `api/orgs` endpoint of the Automox
    API.

    4. The action validates the HTTP response. A status code of 200 or 201 indicates
    a successful connection.

    5. If the request is successful, it returns a success message; otherwise, it catches
    the exception and reports a failure with the error details.


    ### Additional Notes

    * This action is typically used during the initial setup of the integration or
    for troubleshooting connection issues.

    * As per standard SOAR practices, Ping actions are not categorized as enrichment
    actions.
  ai_short_description: >-
