List Policies:
  ai_description: >-
    ### General Description

    The **List Policies** action retrieves a list of available policies from the Automox
    platform. This utility action allows security analysts to audit existing policies
    or identify specific policy IDs required for other automated tasks, such as executing
    a policy on a specific device. The results are presented as both a raw JSON object
    and a formatted data table.


    ### Flow Description

    1. Extracts the action parameters: Filter Key, Filter Logic, Filter Value, and
    Max Records To Return.

    2. Initializes the Automox API client.

    3. Makes a GET request to the `/api/policies` endpoint to fetch the list of policies.

    4. Applies client-side filtering to the retrieved policies based on the provided
    filter criteria (Equal or Contains).

    5. Returns the filtered list of policies as a JSON result and renders an "Available
    Policies" data table.


    ### Additional Notes

    - If the Filter Value is left empty or Filter Logic is set to "Not Specified",
    the action will retrieve all policies up to the limit without applying any filters.

    - If a filter value and logic are provided, a Filter Key must also be selected,
    otherwise the action will fail.
  ai_short_description: >-
    Retrieves a list of available policies from the Automox platform, optionally filtering
    by specific attributes.
