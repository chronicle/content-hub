    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from the Automox API (GET requests to retrieve devices
      and patches). It does not mutate external data (no POST/PUT/DELETE requests
      are made in this script). It updates internal entities by calling `siemplify.update_entities`
      and adding entity tables, but it does not create insights, modify alert data,
      or create case comments.
  entity_usage:
