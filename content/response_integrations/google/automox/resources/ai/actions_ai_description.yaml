Execute Policy:
  ai_description: "### General Description\nExecutes a specified remediation policy\
    \ in Automox. This action allows users to trigger policy enforcement either across\
    \ all devices in the organization or specifically for entities (Hostnames and\
    \ IP Addresses) identified within the current case context. It first validates\
    \ the existence of the policy by name and then initiates the execution via the\
    \ Automox API.\n\n### Flow Description\n1. **Policy Retrieval**: The action searches\
    \ for the policy ID in Automox that matches the provided `Policy Name`.\n2. **Scope\
    \ Evaluation**: \n    * If `Remediation Scope` is set to **All Devices**, the\
    \ action sends a request to Automox to execute the policy on all managed devices.\n\
    \    * If `Remediation Scope` is set to **Only Entities**, the action proceeds\
    \ to map entities to Automox devices.\n3. **Device Mapping (Entity Scope only)**:\
    \ For each supported entity (Hostname or IP Address), the action queries Automox\
    \ to find the corresponding device ID using the entity's identifier or its 'OriginalIdentifier'\
    \ attribute.\n4. **Policy Execution**: \n    * For 'All Devices', a single organization-wide\
    \ command is sent.\n    * For 'Only Entities', the action iterates through the\
    \ mapped device IDs and triggers the policy for each device individually.\n5.\
    \ **Result Reporting**: The action tracks the success or failure of the execution\
    \ for each entity and provides a summary message and a JSON result mapping.\n\n\
    ### Additional Notes\n- Supported entities are Hostname and IP Address.\n- The\
    \ action uses the `OriginalIdentifier` property of the entity if available to\
    \ find the corresponding device in Automox."
  ai_short_description: >-
    Executes a specified remediation policy in Automox, targeting either all devices
