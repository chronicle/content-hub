identifier: Automox
name: Automox
parameters:
-   name: API Root
    default_value: https://{{api_root}}
    type: string
    description: API root of the Automox instance.
    is_mandatory: true
    integration_identifier: Automox
-   name: API Key
    default_value: ''
    type: password
    description: API key of the Automox instance.
    is_mandatory: true
    integration_identifier: Automox
-   name: Verify SSL
    default_value: true
    type: boolean
    description: If enabled, verify the SSL certificate for the connection to the
        Automox is valid.
    is_mandatory: true
    integration_identifier: Automox
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/automox
categories:
- IT & Infrastructure
svg_logo_path: resources/logo.svg
image_path: resources/image.png
