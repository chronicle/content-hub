name: Add Evidence To Alert
description: Use the Add Evidence To Alert action to add evidence to alert in Zerofox.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/zerofox#add_evidence_to_alert
integration_identifier: Zerofox
parameters:
-   name: Alert ID
    default_value: ''
    type: string
    description: ID of the Zerofox Alert.
    is_mandatory: true
-   name: Filepath
    default_value: ''
    type: string
    description: Absolute file path for the evidence that needs to be submitted to
        the alert.
    is_mandatory: true
dynamic_results_metadata: []
creator: admin
