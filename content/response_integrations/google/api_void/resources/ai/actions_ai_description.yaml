Get Ip Reputation:
  ai_description: >-
    ### General Description

    Retrieves reputation data for IP address entities using APIVoid to detect potentially
    malicious IPs commonly used for spam, attacks, or fraudulent activities.


    ### Flow Description

    1. Iterates through the target entities, filtering for external IP addresses (ADDRESS
    type).

    2. Makes an API request to the APIVoid `/iprep/v1/pay-as-you-go/` endpoint to
    fetch reputation data for each valid IP.

    3. If the 'Create Insights' parameter is enabled and a country code is found,
    generates an insight for the entity.

    4. Enriches the entity's additional properties with the retrieved threat intelligence
    data.

    5. If the number of detections exceeds the specified 'Threshold', marks the entity
    as suspicious.

    6. Attaches a blacklist report as an entity table if available.

    7. Updates the entities in the Google SecOps platform with the new enrichment
    data and status.


    ### Additional Notes

    Internal IP addresses are automatically skipped and will not be processed by this
    action.
  ai_short_description: >-
    Retrieves reputation data for external IP address entities using APIVoid to detect
    potentially malicious activity, enriching the entities and optionally marking
    them as suspicious based on a detection threshold.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data from APIVoid via HTTP POST (fetches_data=true). It does
      not mutate external data (can_mutate_external_data=false). It updates internal
      entities with enrichment data and suspicious status (can_update_entities=true).
      It creates insights if configured (can_create_insight=true). It does not modify
      alert data or create case comments.
  entity_usage:
