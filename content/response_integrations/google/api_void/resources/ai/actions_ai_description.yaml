Get URL Reputation:
  ai_description: >-
    ### General Description

    Retrieves the safety reputation and risk score for URL entities using APIVoid.
    This action enriches the entities with threat intelligence data and evaluates
    their risk against a specified threshold.


    ### Flow Description

    1. Filters the target entities to include only URL entities.

    2. Iterates through the filtered entities, checking for a valid schema (e.g.,
    `http://` or `https://`) and prepending `http://` if missing.

    3. Makes a POST request to the APIVoid API (`/urlrep/v1/pay-as-you-go/`) to fetch
    the reputation and risk score for each URL.

    4. Enriches the entity's additional properties with the retrieved reputation data.

    5. If a blacklist report is available, attaches it as a data table to the action
    results.

    6. Compares the URL's risk score against the provided `Threshold` parameter; if
    the score exceeds the threshold, the entity is marked as suspicious.

    7. Updates the enriched entities within the Google SecOps platform and attaches
    the raw JSON results.


    ### Additional Notes

    Ensure that the APIVoid integration is properly configured with a valid API key
    and API root URL.
