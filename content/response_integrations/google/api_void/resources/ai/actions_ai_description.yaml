Verify Email:
  ai_description: >-
    ### General Description

    Verifies and enriches User entities (specifically email addresses) using APIVoid.
    This action checks if the email address is disposable, verifies the presence of
    MX and SPF records, and retrieves a risk score to determine if the email is suspicious.


    ### Flow Description

    1. Iterates through the target entities, filtering for `USER` entity types.

    2. Validates each entity's identifier against a regular expression to ensure it
    is a properly formatted email address. Non-matching entities are skipped.

    3. Makes a POST request to the APIVoid `/emailverify/v1/pay-as-you-go/` API endpoint
    to fetch information about the email address.

    4. Enriches the entity's `additional_properties` with the retrieved data (e.g.,
    suspicious domain, disposable status, MX/SPF records).

    5. Evaluates the email's risk score against the provided `Threshold` parameter.
    If the score exceeds the threshold, the entity is marked as suspicious.

    6. Attaches a data table with the email information to the action results.

    7. Updates the enriched entities within the Google SecOps platform.


    ### Additional Notes

    - Entities that do not match a standard email format are automatically skipped
    and logged.

    - The action will fail or skip entities if the APIVoid credit limit is exceeded
    or if the API key is invalid.
  ai_short_description: >-
    Verifies and enriches User entities representing email addresses using APIVoid
