Get Screenshot:
  ai_description: >-
    ### General Description

    Captures a high-quality screenshot of a specified URL using the APIVoid service.
    This action retrieves a visual representation of a website and attaches it directly
    to the case for analyst review.


    ### Flow Description

    1. Iterates over the provided target entities and filters for those of type URL.

    2. Validates the URL format, prepending 'http://' if the schema is missing.

    3. Makes a POST request to the APIVoid screenshot API endpoint (`/screenshot/v1/pay-as-you-go/`)
    to capture the image.

    4. Evaluates the size of the returned screenshot; if it is under the 3MB limit,
    the image is added as an attachment to the case.

    5. Records the MD5 hash of the screenshot file in the JSON results and updates
    the successful entities.


    ### Additional Notes

    Entities that are not of type URL are skipped. If the captured screenshot exceeds
    3MB, it will not be attached to the case, and the entity will be marked as failed
    for that specific operation.
