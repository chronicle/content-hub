    ### General Description

    Tests connectivity to the APIVoid service to ensure the integration is configured
    correctly and the API key is valid.


    ### Flow Description

    1. Extracts the integration configuration parameters, including the API Root and
    API Key.

    2. Initializes the APIVoid manager with the provided credentials.

    3. Makes an HTTP GET request to the APIVoid stats endpoint (`/iprep/v1/pay-as-you-go/?stats`)
    to verify connectivity.

    4. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action does not interact with any entities or modify any data. It is solely
    used for diagnostic and setup verification purposes.
