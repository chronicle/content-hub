Get domain reputation:
  ai_description: >-
    ### General Description

    Retrieves domain reputation information from APIVoid for Hostname and URL entities.
    This action checks if a domain is blacklisted by popular and trusted domain blacklist
    services, enriches the entities with the findings, and can optionally mark them
    as suspicious based on a defined threshold.


    ### Flow Description

    1. Iterates through the target entities, filtering for Hostname and URL entity
    types.

    2. Extracts the domain from the entity identifier.

    3. Makes a GET request to the APIVoid `/domainbl/v1/pay-as-you-go/` endpoint to
    fetch domain reputation data.

    4. Evaluates the number of blacklist detections against the provided `Threshold`;
    if the detections exceed the threshold, the entity is marked as suspicious.

    5. Enriches the entity's additional properties with the retrieved reputation data
    and updates the entity in the platform.

    6. Optionally creates an insight containing the country code if the `Create Insights`
    parameter is enabled.

    7. Attaches a blacklist report as an entity table and saves the raw JSON results.


    ### Additional Notes

    - The `Threshold` parameter must be a numeric value.

    - The action will skip entities that are not Hostnames or URLs, or if no domain
    can be extracted.
