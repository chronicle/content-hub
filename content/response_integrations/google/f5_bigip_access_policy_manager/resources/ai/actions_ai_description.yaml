Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the F5 BIG-IP Access Policy Manager instance. This action
    verifies that the integration is configured correctly and can successfully communicate
    with the F5 BIG-IP server.


    ### Flow Description

    1. Extracts integration configuration parameters (such as API Root, Username,
    and Password).

    2. Initializes the F5 BIG-IP Access Policy Manager client.

    3. Authenticates and retrieves an access token, handling token generation and
    caching.

    4. Makes an API GET request to the `/mgmt/shared/authz/tokens` endpoint to verify
    connectivity.

    5. Returns a success message if the connection is established, or an error message
    if it fails.


    ### Additional Notes

    This action is primarily used as a diagnostic tool to ensure the integration's
    credentials and network settings are valid.
