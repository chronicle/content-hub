Disconnect Sessions:
  ai_description: >-
    ### General Description

    The action disconnects specified active sessions from the F5 BIG-IP instance.
    It can operate using entities from the case (Address and User) or using explicitly
    provided parameters (Session IDs, Logon User Names, Client IPs). The action uses
    an OR logic, meaning any session matching at least one of the provided criteria
    will be disconnected.


    ### Flow Description

    1. Extracts configuration parameters and action parameters.

    2. Initializes the F5 BIG-IP Access Policy Manager with the provided credentials.

    3. If `Use Case Entities` is enabled, it iterates over the target entities, extracting
    identifiers from `ADDRESS` entities as Client IPs and `USER` entities as Logon
    User Names.

    4. If `Use Case Entities` is disabled, it parses the provided `Session IDs`, `Logon
    User Names`, and `Client IPs` parameters into lists.

    5. Makes an API call to fetch all active sessions from the F5 BIG-IP instance.

    6. Matches the fetched active sessions against the provided IPs, usernames, or
    session IDs.

    7. Iterates over the matched session IDs and makes a DELETE API call to disconnect
    each session.

    8. Makes another API call to fetch the remaining active sessions to verify successful
    disconnections.

    9. Returns a summary message detailing successful disconnections, failed disconnections,
    and any inputs that were not found in the active sessions list.


    ### Additional Notes

    - Filters are applied using an OR logic. A session matching any single parameter
    or entity will be disconnected.

    - The action verifies the disconnection by fetching the active sessions list again,
    as the F5 API may return a success response even if the disconnect action fails
    internally.
  ai_short_description: >-
    Disconnects specified active sessions from the F5 BIG-IP instance based on provided
    parameters or case entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Disconnects active sessions on the F5 BIG-IP instance.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches active sessions from the F5 BIG-IP instance (fetches_data=true)
      and then sends DELETE requests to disconnect specific sessions (can_mutate_external_data=true).
      It does not mutate internal data, update entities, create insights, modify alert
      data, or create case comments.
