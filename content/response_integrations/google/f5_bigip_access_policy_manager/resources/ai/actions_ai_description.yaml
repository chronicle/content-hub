List Active Sessions:
  ai_description: >-
    ### General Description

    Lists all currently active sessions in the F5 BIG-IP Access Policy Manager. This
    action retrieves session details, including session IDs, client IPs, and logon
    users, to provide visibility into active connections.


    ### Flow Description

    1. Extracts the `Limit` parameter to determine the maximum number of sessions
    to retrieve.

    2. Authenticates with the F5 BIG-IP Access Policy Manager API.

    3. Makes a GET request to the `/mgmt/tm/apm/access-info` endpoint to fetch active
    sessions.

    4. Parses the response and returns the session details as a JSON result.


    ### Additional Notes

    If no active sessions are found, the action will return a false result value and
    indicate that no sessions were found in the output message.
