    reasoning: >-
      The action fetches data from the MalShare API (fetches_data=true). It does not
      mutate external data (can_mutate_external_data=false). It updates internal entities
      by adding tables, updating properties, and setting flags (can_update_entities=true).
      It does not create insights, modify alert data, or create case comments.
