Enrich Hash:
  ai_description: >-
    ### General Description

    Enriches file hash entities by searching for them in MalShare. It retrieves detailed
    threat intelligence information about the hash and updates the entity within Google
    SecOps with the findings.


    ### Flow Description

    1. Iterates through the target entities provided to the action.

    2. Filters the entities to process only those of type `FILEHASH`.

    3. For each valid file hash, makes a GET request to the MalShare API (`/api.php?action=details&hash={hash}`)
    to retrieve hash details.

    4. If information is found, it adds a CSV table with the results to the entity,
    updates the entity's additional properties with the retrieved data, and marks
    the entity as enriched and suspicious.

    5. Updates the modified entities in the Google SecOps platform.

    6. Returns a JSON object containing the retrieved hash information.


    ### Additional Notes

    Entities that are not found in MalShare or encounter errors during the search
    are skipped, and the action continues processing the remaining entities.
  ai_short_description: >-
    Enriches file hash entities by querying the MalShare API for hash details, updating
    the entities with the retrieved information, and marking them as enriched and
    suspicious.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
