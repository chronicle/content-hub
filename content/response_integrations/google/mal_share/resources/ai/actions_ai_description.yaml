Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the MalShare service to ensure that the integration is configured
    correctly.


    ### Flow Description

    1. Retrieves the integration configuration parameters, including the API Key and
    SSL verification settings.

    2. Initializes the MalShare API manager.

    3. Makes a GET request to the MalShare API using the `getlist` action to validate
    the provided credentials and network connectivity.

    4. Outputs a success message if the API responds without errors.


    ### Additional Notes

    This action does not process any entities or alerts and is solely used for diagnostic
    purposes.
