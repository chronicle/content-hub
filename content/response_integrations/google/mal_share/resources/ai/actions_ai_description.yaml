Upload File:
  ai_description: >-
    ### General Description

    Uploads a specified file to MalShare for malware scanning and retrieves the analysis
    results.


    ### Flow Description

    1. Retrieves the `File Path` from the action parameters.

    2. Makes a POST request to the MalShare API to upload the file for analysis.

    3. Extracts the file hash from the upload response and makes a GET request to
    the MalShare API to retrieve the analysis details.

    4. Formats the retrieved hash information into a CSV table and attaches it to
    the action results.

    5. Returns the analysis details as a JSON object.


    ### Additional Notes

    The action immediately fetches the hash details after uploading. If the file requires
    extensive analysis, the returned results may indicate a pending status.
  ai_short_description: >-
    Uploads a file to MalShare for malware analysis and retrieves the resulting scan
    details.
  capabilities:
