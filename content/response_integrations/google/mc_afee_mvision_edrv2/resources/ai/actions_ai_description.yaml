    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action creates a new investigation in McAfee Mvision EDR. This does not
      align with any of the predefined outcome categories such as creating an ITSM
      ticket, enriching an IOC, or containing a host. Therefore, no outcome categories
      are matched.
    remove_ioc_from_allowlist: false
