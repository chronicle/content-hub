  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Case Type | String | Yes | Defines the type of alert. |

    | Priority | String | Yes | Assigns a priority to the investigation. |

    | Hint | String | No | Automatically links related investigations and avoids creating
    many cases from multiple alerts related to the same incident. If the same hint
    is used, the evidences will be added to the already existing investigation. |

    | Name | String | No | Gives the investigation a meaningful name. If the name
    is missing, a default case name is assigned. |
Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the McAfee Mvision EDR V2 server.


    ### Flow Description

    1. Extracts integration configuration parameters.

    2. Initializes the McAfee Mvision EDR V2 manager.

    3. Attempts to authenticate and retrieve an authorization token via the `/iam/v1.0/token`
    endpoint.

    4. Returns a success message if the connection and authentication are successful.


    ### Additional Notes

    This action is primarily used to verify that the integration is configured correctly
    and can communicate with the McAfee Mvision EDR V2 API.
