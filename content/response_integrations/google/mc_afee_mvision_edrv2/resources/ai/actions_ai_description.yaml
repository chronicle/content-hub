Create Investigation:
  ai_description: >-
    ### General Description

    Creates a new investigation in McAfee Mvision EDR V2 for specified IP address
    and hostname entities. The action allows users to define the case type, priority,
    name, and a hint to link related investigations. It interacts with the McAfee
    Mvision EDR API to generate these investigations and returns the investigation
    details as JSON and a data table.


    ### Flow Description

    1. Connects to the McAfee Mvision EDR V2 API using the provided credentials.

    2. Iterates through the target entities in the case.

    3. For each IP Address entity, makes a POST request to the `/edr/v2/investigations`
    endpoint to create an IP-based investigation.

    4. For each Hostname entity, makes a POST request to the `/edr/v2/investigations`
    endpoint to create a device-based investigation.

    5. Collects the created investigation details and outputs them as a data table
    and JSON result.


    ### Additional Notes

    If a 'Hint' parameter is provided, the action pauses for 10 seconds between requests
    to avoid rate limiting (429 errors) when adding evidence to existing investigations.
  ai_short_description: >-
    Creates a new investigation in McAfee Mvision EDR V2 for specified IP address
    and hostname entities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Creates a new investigation in McAfee Mvision EDR V2.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the McAfee Mvision EDR API to create a new
      investigation, which mutates external data. It does not fetch data for enrichment,
      nor does it update internal entities, create insights, or modify alert data.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
