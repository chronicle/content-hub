Enrich Binary:
  ai_description: >-
    ### General Description

    Enriches File Hash (MD5) entities by retrieving binary summary information from
    Carbon Black (CB) Response. This action fetches contextual data about the binary
    associated with the hash and appends it to the entity's properties within the
    SecOps platform.


    ### Flow Description

    1. Initializes the CB Response manager using integration-level credentials.

    2. Filters the provided target entities to include only `FILEHASH` entities that
    have an identifier length of exactly 32 characters (representing an MD5 hash).

    3. Iterates over the filtered entities and makes an HTTP GET request to the CB
    Response API (`/api/v1/binary/{md5}/summary`) to fetch the binary summary.

    4. Updates the entity's `additional_properties` with the retrieved binary data
    formatted as CSV and sets the `is_enriched` flag to true.

    5. Saves the updated entities back to the platform and attaches the raw binary
    data as a JSON result.


    ### Additional Notes

    This action strictly processes MD5 hashes. File hashes of other formats (like
    SHA-1 or SHA-256) will be ignored due to the 32-character length filter.
