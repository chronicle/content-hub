Binary Free Query:
  ai_description: >-
    ### General Description

    Executes a free-text query in Carbon Black Response to search for and list binaries
    matching the specified criteria. This action allows analysts to retrieve detailed
    information about binaries observed in the environment based on custom search
    parameters.


    ### Flow Description

    1. Initializes the Carbon Black Response manager with the provided API credentials.

    2. Executes a GET request to the `/api/v1/binary` endpoint using the provided
    search query.

    3. Retrieves the matching binaries and formats them into a CSV table.

    4. Adds the results as a table and JSON to the action's output.


    ### Additional Notes

    The query syntax should follow Carbon Black Response's search query language (e.g.,
    `md5:* AND original_filename:<file-name>`).
  ai_short_description: >-
    Executes a free-text query in Carbon Black Response to search for and list binaries
    matching the specified criteria.
