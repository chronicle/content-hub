  ai_description: >-
    ### General Description

    Isolates an endpoint from the network using Carbon Black Response. This action
    initiates a state change on the external device to prevent network traffic to
    or from the specified entity, effectively containing the host.


    ### Flow Description

    1. Iterates over the target entities, filtering for `Address` and `Hostname` entity
    types.

    2. For each valid entity, makes a GET request to the Carbon Black Response API
    (`/api/v1/sensor`) to fetch the corresponding sensor ID based on the IP address
    or hostname.

    3. If a sensor is found, makes a PUT request to the Carbon Black Response API
    (`/api/v1/sensor/{sensor_id}`) with the payload `{"network_isolation_enabled":
    true}` to isolate the host.

    4. Returns a summary message indicating which entities were successfully isolated
    and which failed.


