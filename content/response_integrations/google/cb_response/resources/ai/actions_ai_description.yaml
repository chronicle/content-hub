Create Watchlist:
  ai_description: >-
    ### General Description

    Creates a new watchlist in Carbon Black Response for processes (events) or binaries
    (modules) based on a provided query. This action also automatically configures
    an alert action for the newly created watchlist.


    ### Flow Description

    1. Extracts the watchlist name, query, and watchlist type from the action parameters.

    2. Initializes the Carbon Black Response API client.

    3. Makes a POST request to the Carbon Black Response API to create the watchlist
    with the specified query and type.

    4. Makes a subsequent API request (POST or PUT, depending on the Carbon Black
    version) to create an alert action for the newly created watchlist.

    5. Returns a success message if the watchlist and alert action are created successfully.


    ### Additional Notes

    The watchlist type should be set to "events" for process watchlists or "modules"
    for binary watchlists.
