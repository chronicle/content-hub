    retrieves process details and execution context from the Carbon Black platform
    and updates the entities with the gathered information. It also correlates the
    found processes with Hostname entities present in the case.


    ### Flow Description

    1. Initializes the Carbon Black Response manager with the provided API credentials.

    2. Iterates over the target entities, filtering for `Process` and `Hostname` entity
    types.

    3. For each `Process` entity, queries Carbon Black Response for process details
    matching the entity's identifier.

    4. If processes are found, updates the `Process` entity's additional properties
    with the retrieved data and marks it as enriched.

    5. Correlates the retrieved processes with any `Hostname` entities present in
    the case, adding an entity table to the `Hostname` entity if a match is found.

    6. Updates the successful entities in the Google SecOps platform and returns the
    JSON results.


