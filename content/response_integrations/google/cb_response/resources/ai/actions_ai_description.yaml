  ai_description: >-
    ### General Description

    Unisolates a host (endpoint) on Carbon Black Response to restore its network connectivity.


    ### Flow Description

    1. Iterates over target entities of type Address and Hostname.

    2. Fetches the corresponding sensor data from Carbon Black Response using the
    entity's identifier via a GET request.

    3. If a sensor is found, sends a PUT request to the Carbon Black Response API
    to disable network isolation for the sensor.

    4. Updates the successful entities in Google SecOps.


    ### Additional Notes

    None.
  ai_short_description: >-
    Unisolates a host on Carbon Black Response to restore its network connectivity.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: >-
      Sends a PUT request to Carbon Black Response to disable network isolation for
      the specified host.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches sensor data to find the sensor ID, then mutates external
      data by sending a PUT request to unisolate the host. It also updates the processed
      entities internally in Google SecOps.
