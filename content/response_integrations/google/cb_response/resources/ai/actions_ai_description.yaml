Block Hash:
  ai_description: >-
    ### General Description

    Blocks a specific file hash (MD5) on Carbon Black Response. This action initiates
    a state change on the external EDR device to prevent the execution of the specified
    file hash.


    ### Flow Description

    1. Initializes the Carbon Black Response manager using the provided integration
    configuration.

    2. Iterates through the target entities, filtering for `FILEHASH` entities that
    have an identifier length of exactly 32 characters (MD5).

    3. For each suitable entity, makes a POST request to the Carbon Black Response
    API (`/api/v1/banning/blacklist`) to add the hash to the banned list.

    4. Collects the results and returns a summary message indicating which hashes
    were successfully blocked and which failed.


    ### Additional Notes

    This action only supports MD5 hashes, as it explicitly filters for identifiers
    that are 32 characters long.
