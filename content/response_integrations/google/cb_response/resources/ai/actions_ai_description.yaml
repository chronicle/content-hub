Kill Process:
  ai_description: >-
    ### General Description

    Kills a specific process on a target host using Carbon Black Response. This action
    leverages Carbon Black's Live Response capabilities to identify and terminate
    processes matching the provided process entities on the specified host entities.


    ### Flow Description

    1. Extracts `PROCESS` and `HOSTNAME` entities from the target entities provided
    in the case.

    2. Generates combinations of the extracted hostnames and processes to process
    them in pairs.

    3. For each combination, queries the Carbon Black Response API to retrieve the
    sensor information associated with the hostname.

    4. Initiates a Live Response session on the target sensor.

    5. Executes a `process list` command via the Live Response session to identify
    the Process IDs (PIDs) matching the target process name.

    6. Executes a `kill` command for each identified PID.

    7. Closes the Live Response session and appends the result to the output message.


    ### Additional Notes

    The action requires both Process and Hostname entities to be present in the case
    to function correctly. It will attempt to kill the process on every hostname provided
    in the entity combinations.
