Download Binary:
  ai_description: >-
    ### General Description

    Downloads a binary file from Carbon Black Response associated with a specific
    file hash (MD5). The action retrieves the file content, encodes it in base64,
    and attaches it to the corresponding entity within the SecOps platform.


    ### Flow Description

    1. Initializes the Carbon Black Response client using the provided integration
    configuration.

    2. Filters the target entities to include only File Hash entities with a length
    of 32 characters (MD5).

    3. Iterates through the filtered entities and makes an HTTP GET request to the
    Carbon Black Response API to download the binary content for each hash.

    4. Encodes the downloaded binary content in base64 format.

    5. Attaches the base64 encoded binary as a zip file to the corresponding entity
    in the SecOps platform.

    6. Updates the successful entities and returns the base64 content in the JSON
    results.


    ### Additional Notes

    This action strictly supports MD5 hashes (32 characters in length). Other hash
    types (e.g., SHA-1, SHA-256) will be ignored during the entity filtering phase.
