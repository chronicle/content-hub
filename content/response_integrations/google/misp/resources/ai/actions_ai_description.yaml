Get Related Events:
  ai_description: >-
    ### General Description

    Retrieves information about events that are related to specific entities in MISP.
    This action searches the MISP threat intelligence platform for events associated
    with the provided indicators and can optionally mark the entities as suspicious
    if any related events are found.


    ### Flow Description

    1. Filters the target entities to include only Address, Hostname, FileHash, and
    URL types.

    2. Iterates over the suitable entities and maps their entity type to the corresponding
    MISP attribute type (e.g., `ip-src`, `ip-dst`, `domain`, `md5`, etc.).

    3. Makes an API call to the MISP search endpoint (`/events/restSearch/download/`)
    to fetch related events for each entity identifier.

    4. If related events are found, creates a case wall table containing the event
    details (Event ID, Threat Level, Analysis, etc.) and adds the data to the JSON
    result.

    5. If the `Mark As Suspicious` parameter is enabled and events were found, updates
    the entity's `is_suspicious` property to `True`.

    6. Calls `siemplify.update_entities` to save any modifications to the entities.


    ### Additional Notes

    - The action uses a POST request to the MISP search API, but it functions purely
    as a data retrieval (enrichment) operation.

    - FileHash entities are dynamically mapped to their specific hash type (e.g.,
    MD5, SHA1, SHA256) based on the length of the hash string.
  ai_short_description: >-
    Retrieves threat intelligence events related to URL, Hostname, FileHash, and Address
    entities from MISP, optionally marking the entities as suspicious if matches are
    found.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
