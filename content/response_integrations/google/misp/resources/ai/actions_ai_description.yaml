Get Event Details:
  ai_description: >-
    ### General Description

    Retrieves detailed information about specific events from MISP using their IDs
    or UUIDs.


    ### Flow Description

    1. Initializes the MISP API client with the provided integration configuration.

    2. Parses the provided comma-separated list of Event IDs.

    3. For each Event ID, makes a GET request to the MISP API (`/events/{event_id}`)
    to fetch the event details.

    4. Optionally retrieves and formats the attributes associated with each event
    if `Return Attributes Info` is enabled.

    5. Outputs the event details and attributes as case wall data tables and returns
    the raw data as a JSON result.


    ### Additional Notes

    The action can process multiple event IDs in a single run. If an invalid ID is
    provided, the action will log an error for that specific ID and continue processing
    the rest.
