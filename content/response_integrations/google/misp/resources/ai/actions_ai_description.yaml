Add Attribute:
  ai_description: >-
    ### General Description

    Adds attributes based on entities to a specific event in MISP. Supported hashes
    include MD5, SHA1, SHA224, SHA256, SHA384, SHA512, and SSDeep.


    ### Flow Description

    1. Initializes the MISP API client using the provided integration configuration.

    2. Validates the provided Event ID by querying the MISP API.

    3. Iterates over the target entities and filters them by supported types (Hostname,
    URL, FileHash, Address, User, FileName, EmailMessage, ThreatCampaign, ThreatActor,
    PhoneNumber).

    4. Determines the appropriate MISP attribute type for each entity, applying fallback
    types or domain extraction if configured.

    5. Makes a POST request to the MISP API to add the attribute to the specified
    event.

    6. Returns the JSON results of the successfully added attributes.


    ### Additional Notes

    Supports fallback types for IP and Email entities. Can extract domains from URL
    entities if the 'Extract Domain' parameter is enabled.
  ai_short_description: >-
    Adds attributes based on entities to a specific event in MISP.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds attributes to a specific event in MISP.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the MISP API to add attributes to an event,
      which mutates external data. It does not fetch data for enrichment, update internal
      entities, or create insights.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
