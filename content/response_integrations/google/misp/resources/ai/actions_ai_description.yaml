Get Related Events:
  ai_description: >-
    ### General Description

    Retrieves information about events that are related to specific entities in MISP.
    This action queries the MISP threat intelligence platform to find any events associated
    with the provided indicators and can optionally mark them as suspicious based
    on the findings.


    ### Flow Description

    1. Iterates over the target entities, filtering for supported types: URL, Hostname,
    FileHash, and Address.

    2. For each suitable entity, determines the specific MISP indicator type to search
    for (e.g., mapping Address to source/destination IP, or determining the hash type).

    3. Makes an API call to MISP (`/events/restSearch/download/`) to fetch related
    events for the entity.

    4. If related events are found, they are formatted and attached to the entity
    as a case wall table.

    5. If the `Mark As Suspicious` parameter is enabled and events are found, the
    entity's suspicious flag is set to true.

    6. Updates the modified entities within Google SecOps and returns the results
    as JSON.


    ### Additional Notes

    - Supported entity types: URL, Hostname, FileHash, and Address.

    - The action relies on the MISP `restSearch` endpoint to find events containing
    the entity's identifier.
