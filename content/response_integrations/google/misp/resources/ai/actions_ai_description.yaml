    attributes. If "Provided Event" is selected, action will only search for attributes
    or attribute UUIDs in event with ID/UUID provided in "Event ID" parameter. If
    "All Events", action will search for attributes among all events and add sighting
    for all attributes that match our criteria. Default value is "Provided Event".
    Possible values: Provided Event, All Events. |

    | Attribute UUID | String | False | Specify a comma-separated list of attribute
    UUIDs to which you want to add a new sighting. Note: If both "Attribute Name"
    and "Attribute UUID" are specified, action will work with "Attribute UUID" values.
    |
Add Tag to an Attribute:
  ai_description: >-
    ### General Description

    Adds specified tags to attributes in MISP. This action allows users to tag attributes
    based on various search criteria such as Event ID, Object UUID, Attribute Name,
    or Attribute UUID.


    ### Flow Description

    1. Validates the provided input parameters, ensuring required dependencies (like
    Event ID when searching within a provided event) are met.

    2. Queries the MISP API to verify the existence of the provided tags.

    3. Searches for the target attributes in MISP using the provided criteria (Event
    ID, Object UUID, Attribute Name, Attribute UUID, Category, and Type).

    4. Iterates through the found attributes and makes a POST request to the MISP
    API to attach the specified tags to each attribute.

    5. Returns a summary of successful and failed tag additions, along with the JSON
    response from the API.


    ### Additional Notes

    - If both `Attribute Name` and `Attribute UUID` are specified, the action will
    prioritize and work with the `Attribute UUID` values.

    - If `Attribute Search` is set to `Provided Event` or if an `Object UUID` is provided,
    the `Event ID` parameter becomes mandatory.
