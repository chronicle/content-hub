    ### General Description

    Creates a File Object in MISP for a specified event. This action allows users
    to add file-related threat intelligence (such as file names and various hashes)
    to an existing MISP event, either by explicitly providing the values as parameters
    or by extracting them from the case's target entities.


    ### Flow Description

    1. Validates the provided parameters, ensuring that either specific file attributes
    are provided or the 'Use Entities' flag is enabled.

