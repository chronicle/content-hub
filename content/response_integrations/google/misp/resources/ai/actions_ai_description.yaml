Enrich Entities:
  ai_description: >-
    ### General Description

    Enriches entities using MISP by retrieving associated attributes and event data.
    It updates the entity's properties, evaluates threat levels to mark entities as
    suspicious, and generates insights based on the retrieved intelligence.


    ### Flow Description

    1. Filters target entities to include only supported types (URL, Hostname, FileHash,
    Address, Domain, User).

    2. Iterates through each entity and queries the MISP API (`get_attributes`) to
    fetch attributes matching the entity's identifier.

    3. Sorts the retrieved attributes by timestamp and selects the oldest or newest
    based on the `Filtering condition` parameter.

    4. Retrieves the associated event data from MISP using the API (`get_event_by_id`).

    5. Enriches the entity's additional properties with the retrieved event and attribute
    data.

    6. If the `Create Insights` parameter is enabled and the attribute has a comment,
    generates an insight for the entity.

    7. Adds a case wall table containing the attribute details.

    8. Evaluates the event's threat level against the `Threat Level Threshold` parameter;
    if the threat level is less than or equal to the threshold (meaning higher or
    equal severity in MISP's numeric scale), marks the entity as suspicious.

    9. Updates the enriched entities within the Google SecOps platform.


    ### Additional Notes

    Supported entity types include URL, Hostname, FileHash, Address, Domain, and User.
    The action relies on MISP's numeric threat level scale where lower numbers indicate
    higher severity (e.g., 1 = High, 4 = Undefined).
