Add Sighting to an Attribute:
  ai_description: >-
    ### General Description

    Adds a sighting to specified attributes in MISP. This action allows users to report
    sightings, false positives, or expirations for specific attributes, optionally
    filtering by event ID, object UUID, category, or type.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Validates the provided categories and ensures the Event ID is provided if required
    by the search criteria.

    3. Searches for the specified attributes in MISP using the provided Event ID,
    Object UUID, Attribute UUIDs, Attribute Names, Categories, and Types via the MISP
    API.

    4. Iterates over the found attributes and makes a POST request to the MISP API
    (`/sightings/add`) to add a sighting to each attribute.

    5. Returns the sighting details as JSON results and outputs a summary message
    indicating successful and failed sighting additions.


    ### Additional Notes

    If both "Attribute Name" and "Attribute UUID" are specified, the action prioritizes
    "Attribute UUID".
