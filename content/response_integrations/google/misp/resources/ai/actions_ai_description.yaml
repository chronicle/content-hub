Remove Tag from an Event:
  ai_description: >-
    ### General Description

    Removes specified tags from an event in MISP. This action initiates a state change
    on the external MISP instance by detaching the provided tags from the target event.


    ### Flow Description

    1. Extracts the `Event ID` and `Tag Name` parameters.

    2. Queries the MISP API to validate the existence of the specified event.

    3. Queries the MISP API to resolve the provided tag names to their corresponding
    tag IDs.

    4. Iterates over the resolved tags and makes a POST request to the MISP API (`/events/removeTag/`)
    to remove each tag from the event.

    5. Returns a summary message indicating which tags were successfully removed and
    which were not found.


    ### Additional Notes

    If a provided tag name does not exist in MISP, the action will skip it and report
    it in the output message.
