Add Tag to an Event:
  ai_description: >-
    ### General Description

    Adds one or more tags to a specific event in MISP. This action modifies the external
    threat intelligence event by attaching the provided tags.


    ### Flow Description

    1. Extracts the `Event ID` and `Tag Name` from the action parameters.

    2. Validates the existence of the event in MISP by making a GET request.

    3. Searches for the specified tags in MISP to ensure they exist.

    4. Iterates through the valid tags and makes a POST request to the MISP API (`/events/addTag/`)
    to attach each tag to the event.

    5. Returns a summary message and the JSON response of the added tags.


    ### Additional Notes

    The action accepts either an ID or UUID for the event. Multiple tags can be provided
    as a comma-separated list.
