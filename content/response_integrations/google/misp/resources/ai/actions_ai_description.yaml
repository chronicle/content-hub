    exists.

    3. If 'Use Entities' is enabled, iterates over the target entities, filtering
    for `FileHash` and `FileName` types. It determines the hash type (MD5, SHA1, SHA256,
    SSDEEP) based on the entity identifier.

    4. If 'Use Entities' is disabled, collects the file attributes from the action
    parameters.

