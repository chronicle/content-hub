Upload File:
  ai_description: >-
    ### General Description

    Uploads one or more files to a specific MISP event. This action allows users to
    attach file samples to an existing event in the MISP threat intelligence platform.


    ### Flow Description

    1. Extracts the provided Event ID, File Paths, Category, Distribution, IDS flag,
    and Comment parameters.

    2. Validates the distribution parameter and checks if the provided file paths
    exist and are accessible.

    3. Initializes the MISP manager and retrieves the event details to ensure the
    event exists.

    4. Iterates over the provided file paths and uploads each file to the MISP event
    via the MISP API.

    5. Retrieves the updated event details and returns them as a JSON result, outputting
    the event ID as the result value.


    ### Additional Notes

    - The `File Path` parameter accepts a comma-separated list of absolute file paths.

    - If any of the provided file paths are invalid or inaccessible, the action will
    fail before attempting any uploads.
  ai_short_description: >-
    Uploads one or more files to a specific MISP event.
  capabilities:
