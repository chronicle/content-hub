    of URL entity. Default value is true. |
Add Sighting to an Attribute:
  ai_description: >-
    ### General Description

    Adds a sighting to specific attributes in MISP. This action allows users to report
    that an attribute (indicator) has been sighted, updating its threat intelligence
    context within the MISP platform.


    ### Flow Description

    1. Extracts the provided parameters including Event ID, Attribute Name, Attribute
    UUID, Object UUID, Category, Type, and Sightings Type.

    2. Validates the input parameters, ensuring that an Event ID is provided if 'Attribute
    Search' is set to 'Provided Event' or if an 'Object UUID' is specified.

    3. Fetches the target attributes from MISP based on the provided search criteria
    (either from a specific object, a specific event, or across all events).

    4. Iterates through the retrieved attributes and makes a POST request to the MISP
    API to add a sighting to each attribute.

    5. Returns a JSON result containing the details of the successfully added sightings.


    ### Additional Notes

    If both 'Attribute Name' and 'Attribute UUID' are specified, the action will prioritize
    and work with the 'Attribute UUID' values.
