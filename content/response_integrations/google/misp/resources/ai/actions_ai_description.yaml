Add Attribute:
  ai_description: >-
    ### General Description

    Adds attributes based on entities to a specific event in MISP. This action maps
    supported entity types to their corresponding MISP attribute types and pushes
    them to the specified MISP event.


    ### Flow Description

    1. Extracts the provided parameters, including the target Event ID, Category,
    Distribution, and fallback types.

    2. Iterates over the target entities that match the supported entity types (Hostname,
    URL, FileHash, Address, User, FileName, EmailMessage, ThreatCampaign, ThreatActor,
    PhoneNumber).

    3. Determines the appropriate MISP entity type for each entity, utilizing fallback
    types for IP and Email addresses if necessary.

    4. Makes a POST request to the MISP API (`/attributes/add/{event_id}`) to add
    the attribute to the event.

    5. Collects the results and returns a JSON object containing the successfully
    added attributes.


    ### Additional Notes

    - Supported hashes include MD5, SHA1, SHA224, SHA256, SHA384, SHA512, and SSDeep.

    - If an entity's type cannot be mapped or the API request fails, the entity will
    be added to the failed entities list in the output message.
  ai_short_description: >-
    Adds attributes based on supported entities to a specific event in MISP.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Adds attributes based on entities to a specific event in MISP.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to the MISP API to add attributes to an event,
      which mutates external data. It does not fetch contextual data for enrichment,
      nor does it update internal entities, create insights, or modify alert data
      within Google SecOps.
