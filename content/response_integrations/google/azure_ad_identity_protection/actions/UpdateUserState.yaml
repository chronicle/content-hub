name: Update User State
description: 'Update state of the user in Azure AD Identity Protection. Supported
    entities: Username, Email Address (user entity that matches email regex pattern).'
integration_identifier: AzureADIdentityProtection
parameters:
-   name: State
    default_value: Compromised
    type: ddl
    optional_values:
    - Compromised
    - Dismissed
    description: Specify the state for the users.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["USERUNIQNAME"]}'
