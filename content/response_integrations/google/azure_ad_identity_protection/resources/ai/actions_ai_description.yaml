Enrich Entities:
  ai_description: >-
    ### General Description

    The **Enrich Entities** action retrieves detailed risk information for User entities
    from Azure AD Identity Protection. It identifies whether a user is considered
    "at risk" by Microsoft's identity protection services, providing context such
    as risk level, risk state, and the reason for the risk. This information is used
    to enrich the entity's profile within Google SecOps, helping analysts prioritize
    investigations involving potentially compromised accounts.


    ### Flow Description

    1. **Initialization**: The action initializes the Azure AD Identity Protection
    manager using provided credentials and authenticates with the Microsoft Graph
    API.

    2. **Entity Filtering**: It identifies all `USER` entities within the current
    context.

    3. **Data Retrieval**: For each user, it determines if the identifier is an email
    (Principal Name) or a Display Name and queries the Azure AD Graph API endpoint
    for risky users (`/v1.0/identityProtection/riskyUsers/`).

    4. **Enrichment**: If a matching risky user is found, the action:
        * Updates the entity's `additional_properties` with risk details (prefixed
    with `AzureADIP`).
        * Marks the entity as enriched (`is_enriched = True`).
        * Adds a data table to the entity containing risk status and a link to the
    Azure Portal.
        * Optionally creates a formatted Insight if the `Create Insights` parameter
    is enabled.
    5. **Finalization**: Updates all processed entities in the system and returns
    a JSON summary of the results.


    ### Additional Notes

    - The action uses the entity's original identifier to determine if it's an email
    address. If it matches an email regex, it queries by `userPrincipalName`; otherwise,
    it queries by `userDisplayName`.
  ai_short_description: >-
    Retrieves detailed risk information for User entities from Azure AD Identity Protection,
    updating the entity's profile with risk level, state, and details to help analysts
    prioritize investigations.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a GET request to Azure AD Graph API to fetch user risk data
      (fetches_data=true). It does not mutate external data. It updates internal entities
      with the retrieved data and can create insights if configured to do so.
