Update User State:
  ai_description: >-
    ### General Description

    Updates the risk state of user entities in Azure AD Identity Protection. This
    action allows security analysts to programmatically confirm a user as compromised
    or dismiss their risk state based on investigation results.


    ### Flow Description

    1. **Initialization**: Retrieves Azure AD configuration and the target 'State'
    parameter.

    2. **Entity Filtering**: Identifies all User entities within the current context.

    3. **User Identification**: For each entity, the action determines if the identifier
    is an email or a display name. It then queries Azure AD's 'riskyUsers' endpoint
    via a GET request to find the matching user object.

    4. **State Update**: If a matching risky user is found, the action sends a POST
    request to either the `confirmCompromised` or `dismiss` endpoint in Azure AD,
    passing the user's ID.

    5. **Reporting**: Tracks successful and failed updates and provides a summary
    message to the Google SecOps case wall.
  ai_short_description: >-
    Updates the risk state of user entities in Azure AD Identity Protection to either
    confirmed compromised or dismissed.
