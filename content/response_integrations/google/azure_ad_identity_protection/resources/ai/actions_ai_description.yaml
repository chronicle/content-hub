Ping:
  ai_description: >-
    ### General Description

    The **Ping** action is designed to verify the connectivity between Google SecOps
    and the Azure AD Identity Protection instance. It ensures that the provided credentials
    and API endpoints are correct and that the system can successfully authenticate
    and communicate with the external service.


    ### Flow Description

    1. **Parameter Extraction**: The action retrieves the connection details (such
    as Client ID, Client Secret, and Tenant ID) from the integration configuration.

    2. **Authentication**: The action attempts to obtain an OAuth2 Bearer token by
    sending a POST request to the Azure AD login endpoint.

    3. **Connectivity Test**: Upon successful authentication, the action performs
    a GET request to the `riskDetections` endpoint (limited to 1 result) to verify
    that the API is reachable and responding correctly.

    4. **Result Reporting**: If the request is successful, the action completes with
    a success message. Otherwise, it catches the exception and reports a failure.


    ### Additional Notes

    - This action does not process any entities.

    - It is used primarily for troubleshooting and initial setup of the integration.
  ai_short_description: >-
    Verifies connectivity between Google SecOps and the Azure AD Identity Protection
    instance.
