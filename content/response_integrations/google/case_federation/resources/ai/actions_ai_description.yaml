Ping:
  ai_description: >-
    ### General Description

    Tests connectivity for the **Case Federation** integration by retrieving and
    refreshing short-lived Google SecOps SIEM tenant service account credentials via
    P4SA impersonation.


    ### Flow Description

    1. **Parameter Extraction**: Reads the integration-level **Verify SSL**
    configuration parameter.

    2. **Credential Retrieval**: Retrieves short-lived SIEM tenant service account
    credentials from the SOAR context using P4SA impersonation.

    3. **Connectivity Check**: Refreshes the impersonated credentials over an HTTP
    session configured with **Verify SSL** to confirm that the runtime identity can
    impersonate the SIEM service account.

    4. **Result Reporting**: Returns a success message when credential refresh
    succeeds, or fails with an error message if credential retrieval or refresh fails.


    ### Additional Notes

    Requires the runtime identity to have permission to impersonate the Google SecOps
    SIEM service account configured in the platform context.
  ai_short_description: >-
    Verifies Case Federation connectivity by retrieving and refreshing Google SecOps
    SIEM service account credentials via P4SA.
  capabilities:
