    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action does not iterate over `siemplify.target_entities` or process any
      entity-specific data. It executes a standalone query against Google Cloud Logging
