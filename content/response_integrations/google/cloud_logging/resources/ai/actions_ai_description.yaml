    enrich_ioc: false
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action executes a query to retrieve historical logs and telemetry data from
      Google Cloud Logging. This directly aligns with the 'Search Events' expected
      outcome. It does not enrich specific IOCs/assets, mutate external state, or
      interact with tickets/emails.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
