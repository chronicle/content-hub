EnrichEntities:
  ai_description: >-
    ### General Description

    Enriches IP Address and Hostname entities using ThreatCrowd to quickly identify
    related infrastructure and malware. This action retrieves threat intelligence
    reports and updates the entities with the findings, including marking them as
    suspicious if malicious votes are detected.


    ### Flow Description

    1. Iterates through the target entities associated with the case.

    2. Filters the entities to process only those of type IP Address or Hostname.

    3. Makes a GET request to the ThreatCrowd API (`http://www.threatcrowd.org/searchApi/v2/{type}/report/`)
    to fetch a threat report for each valid entity.

    4. If a report is successfully retrieved, it flattens the report data and adds
    it to the entity's `additional_properties`.

    5. Attaches an entity table and a web link with full details to the entity.

    6. Checks the `votes` field in the report; if it equals the malicious vote threshold
    (-1), the entity is marked as suspicious.

    7. Marks the entity as enriched and saves the updates back to the Google SecOps
    platform.

    8. Returns the raw report data as a JSON result.


    ### Additional Notes

    Entities that do not return a valid report or encounter an error during the API
    request are skipped.
  ai_short_description: >-
    Enriches IP Address and Hostname entities by retrieving threat intelligence reports
    from ThreatCrowd and updating the entities with the findings.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches data by making a GET request to the ThreatCrowd API. It does
      not mutate external data or internal system data outside of entities. It updates
      entities by calling `siemplify.update_entities`. It does not create insights,
      modify alert data, or create case comments.
  entity_usage:
    entity_types:
      address: true
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
