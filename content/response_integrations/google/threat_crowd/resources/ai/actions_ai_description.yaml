Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the ThreatCrowd API to ensure the integration is configured
    correctly and can communicate with the service.


    ### Flow Description

    1. Retrieves the integration configuration, specifically the SSL verification
    setting.

    2. Initializes the `ThreatCrowdManager` with the provided configuration.

    3. Executes a test connectivity function which makes a GET request to the ThreatCrowd
    API (`http://www.threatcrowd.org/searchApi/v2/ip/report/`) using a dummy IP address
    (`8.8.8.8`).

    4. Evaluates the response and returns a success message if the connection is established,
    or a failure message if it fails.


    ### Additional Notes

    This action does not process any case entities or alerts. It is strictly used
    for diagnostic and configuration verification purposes.
  ai_short_description: >-
    Tests connectivity to the ThreatCrowd API by making a test request with a dummy
    IP address.
