name: Contain Endpoint
description: Asynchronously disconnect and isolate an endpoint from the network in SentinelOne.
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/sentinelone#contain_endpoint
integration_identifier: SentinelOne
is_async: true
parameters:
-   name: Agent ID
    type: string
    description: The ID or UUID of the agent to contain.
    is_mandatory: false
-   name: Fail If Timeout
    default_value: false
    type: boolean
    description: If enabled, action will fail if the containment request times out.
    is_mandatory: false
dynamic_results_metadata: []
creator: admin
simulation_data_json: '{"Entities": ["HOSTNAME"]}'
