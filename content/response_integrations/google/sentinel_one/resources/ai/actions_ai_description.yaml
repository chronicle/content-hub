Enrich Endpoint:
  ai_description: >-
    ### General Description

    Enriches Hostname and IP Address entities by retrieving endpoint system information
    from SentinelOne. This action queries the SentinelOne API to find the corresponding
    agent for each entity and fetches its system details, which are then appended
    to the entity's properties.


    ### Flow Description

    1. Filters the target entities to include only Hostname and IP Address entity
    types.

    2. For each valid entity, queries the SentinelOne API to resolve the endpoint
    agent ID (using the IP address or hostname).

    3. Makes a GET request to the SentinelOne API to retrieve detailed system information
    for the identified agent.

    4. Flattens the retrieved system information and updates the entity's additional
    properties with these details, prefixing the keys with `SENO_`.

    5. Attaches a data table to the entity containing the system information in CSV
    format.

    6. Updates the enriched entities within the Google SecOps platform.


    ### Additional Notes

    If the action fails to find an agent or retrieve information for specific entities,
    it logs the unsuccessful attempts in a separate "Unsuccessful Attempts" data table
    attached to the action results.
