Get Agent Status:
  ai_description: >-
    ### General Description

    Retrieves the current status (active or inactive) of SentinelOne agents associated
    with specific Hostname or IP Address entities. This action helps analysts determine
    if an endpoint is actively monitored and protected by SentinelOne.


    ### Flow Description

    1. Iterates through the target entities and filters for Hostname and IP Address
    entity types.

    2. For each valid entity, queries the SentinelOne API (`GET web/api/v1.6/agents`)
    to resolve the endpoint's agent ID based on the entity's identifier.

    3. Makes a subsequent API call (`GET web/api/v1.6/agents/{agent_id}`) to retrieve
    the agent's active status.

    4. Compiles the results into an "Agents Statuses" data table and an "Unsuccessful
    Attempts" data table for any errors.

    5. Updates the successful entities within the SecOps platform.


    ### Additional Notes

    This is a read-only enrichment action and does not modify any configuration or
    state within SentinelOne.
