Disconnect Agent From Network:
  ai_description: >-
    ### General Description

    Disconnects a specific agent (endpoint) from the network using SentinelOne. This
    action isolates the endpoint to prevent further network communication, typically
    used during incident response to contain a threat.


    ### Flow Description

    1. Filters the target entities to include only IP Addresses and Hostnames.

    2. For each valid entity, queries the SentinelOne API to find the corresponding
    endpoint agent ID.

    3. Initiates a POST request to the SentinelOne API (`web/api/v1.6/agents/{agent_id}/disconnect`)
    to disconnect the identified agent from the network.

    4. Collects the results and generates an output message, including a data table
    for any unsuccessful attempts.


    ### Additional Notes

    This action effectively isolates the host. Ensure that disconnecting the agent
    does not disrupt critical business operations.
  ai_short_description: >-
    Disconnects a specific agent (endpoint) from the network using SentinelOne to
    isolate it from further communication.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Initiates a network disconnect command on the SentinelOne agent, isolating the
      endpoint from the network.
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action makes a POST request to SentinelOne to disconnect an agent, which
      mutates external data. It does not fetch enrichment data, update internal entities,
      create insights, or modify alert data.
