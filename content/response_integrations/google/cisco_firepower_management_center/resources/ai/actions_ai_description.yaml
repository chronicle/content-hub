Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the Cisco Firepower Management Center API. This action verifies
    that the integration is configured correctly and can successfully authenticate
    with the target instance.


    ### Flow Description

    1. Retrieves the integration configuration parameters (API Root, Username, Password,
