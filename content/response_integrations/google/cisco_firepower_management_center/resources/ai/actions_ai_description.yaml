Block Address:
  ai_description: >-
    ### General Description

    Blocks IP address entities by assigning them to a specified network group attached
    to a policy in Cisco Firepower Management Center.


    ### Flow Description

    1. Retrieves the network group object from Cisco Firepower Management Center using
    the provided 'Network Group Name'.

    2. Iterates through the target entities, filtering for 'ADDRESS' entity types.

    3. For each valid address entity, makes a PUT request to the Cisco Firepower Management
    Center API to add the IP address to the network group object.

    4. Returns a summary message indicating which entities were successfully blocked
    and any errors encountered.


    ### Additional Notes

    Requires a valid network group name that already exists in the Cisco Firepower
    Management Center.
  ai_short_description: >-
    Blocks specific IP address entities by assigning them to a designated network
    group in Cisco Firepower Management Center.
