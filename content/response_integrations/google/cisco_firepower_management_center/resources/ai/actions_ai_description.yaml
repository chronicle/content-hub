Block Port:
  ai_description: >-
    ### General Description

    Blocks a specific port on Cisco Firepower Management Center by assigning it to
    a designated port group attached to a policy. This action modifies the firewall
    configuration to prevent traffic on the specified port and protocol.


    ### Flow Description

    1. Initializes the connection to the Cisco Firepower Management Center API.

    2. Retrieves the port group object using the provided `Port Group Name`.

    3. Checks if the specified port is already present in the port group.

    4. If not present, creates a new port object for the specified `Port` and `Port
    Protocol` via the API.

    5. Updates the port group object to include the newly created port object, effectively
    blocking the port.

    6. Returns a success message indicating whether the port was successfully blocked.


    ### Additional Notes

    Ensure that the specified port group is already attached to an active access policy
    in Cisco Firepower Management Center for the block to take effect.
