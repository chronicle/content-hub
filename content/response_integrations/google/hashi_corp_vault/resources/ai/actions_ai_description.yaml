List Key-Value Secret Keys:
  ai_description: >-
    ### General Description

    This action lists secret keys available in a HashiCorp Vault Key-Value (KV) Secret
    Engine (Version 2) based on a provided path. It retrieves the names of the keys
    stored within a specific folder or path but does not retrieve the actual secret
    values. This is primarily used for discovery and auditing of stored secrets within
    the Vault.


    ### Flow Description

    1. **Authentication**: The action initializes the HashiCorp Vault manager using
    either a Token or Username/Password credentials provided in the configuration.

    2. **Path Resolution**: It determines the target KV Secret Engine path, prioritizing
    the action-level parameter over the global configuration.

    3. **API Request**: It sends a `LIST` request to the Vault API endpoint `/v1/{key_value}/metadata/{secret_path}`.

    4. **Data Processing**: If keys are found, the list is truncated according to
    the 'Max Records To Return' limit.

    5. **Result Output**: The list of keys is returned as a JSON object, and the action
    completes successfully if keys are found or fails with a 'Not Found' message if
    the path is invalid or empty.


    ### Additional Notes

    - This action does not run on entities. It is a utility action that interacts
    with the Vault system directly.

    - The action specifically targets the metadata endpoint of the KV engine to list
    keys without accessing sensitive data.
  ai_short_description: >-
    Lists secret keys available in a HashiCorp Vault Key-Value (KV) Secret Engine
    based on a provided path without retrieving the actual secret values.
