Generate AWS Credentials:
  ai_description: >-
    ### General Description

    Generates temporary AWS credentials (Access Key, Secret Key, and Security Token)
    using a specified AWS role configured in HashiCorp Vault. This action interacts
    with the HashiCorp Vault AWS Secret Engine to provide dynamic, short-lived credentials
    for AWS operations without requiring hardcoded secrets.


    ### Flow Description

    1. **Initialization**: Authenticates with HashiCorp Vault using the provided API
    token or username/password credentials.

    2. **Validation**: Validates the TTL parameter to ensure it is a positive integer
    and parses the JSON Expression Builder string.

    3. **Credential Generation**: Sends a GET request to the Vault AWS Secret Engine
    endpoint (`/v1/{path}/creds/{role}`) with the specified role and optional parameters
    (ARN, session name, TTL).

    4. **Data Processing**: Receives the dynamic credentials from Vault. If an Expression
    Builder is provided, it traverses the JSON response to extract specific fields.

    5. **Output**: Returns the generated credentials (or the filtered subset) as a
    JSON result for use in subsequent playbook steps.


    ### Additional Notes

    - This action does not process or enrich Google SecOps entities.

    - The 'AWS Secret Engine Path' parameter will override the global 'Key-Value Secret
    Engine Path' configuration if provided.
  ai_short_description: >-
    Generates temporary AWS credentials (Access Key, Secret Key, and Security Token)
    using a specified AWS role configured in HashiCorp Vault.
