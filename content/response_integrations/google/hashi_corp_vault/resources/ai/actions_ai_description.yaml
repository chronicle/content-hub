Read Key-Value Secret:
  ai_description: >-
    ### General Description

    Retrieves a specific secret from a HashiCorp Vault Key-Value (KV) version 2 engine.
    This action allows users to fetch sensitive data stored in Vault and optionally
    filter the returned JSON structure to extract specific values using a pipe-delimited
    expression builder. It does not operate on entities and is primarily used for
    utility or orchestration tasks within a playbook.


    ### Flow Description

    1. **Initialization**: The action initializes the HashiCorp Vault manager using
    the provided API root and authentication credentials.

    2. **Path Resolution**: It determines the target Key-Value engine path, prioritizing
    the action-level parameter over the global configuration.

    3. **Data Retrieval**: It performs a GET request to the Vault API to fetch the
    secret data from the specified path and version.

    4. **Filtering (Optional)**: If a JSON Expression Builder is provided, the action
    splits the expression by the '|' delimiter and traverses the JSON response to
    extract the requested nested value.

    5. **Output**: The retrieved secret (or filtered subset) is added to the action's
    JSON results, and the execution status is updated based on success or failure
    (e.g., secret not found).


    ### Additional Notes

    - This action specifically supports HashiCorp Vault KV Secrets Engine - Version
    2.

    - Authentication can be performed using either a Vault Token or a Username/Password
    combination configured in the integration settings.
