List AWS Roles:
  ai_description: >-
    ### General Description

    The **List AWS Roles** action retrieves a list of available AWS roles configured
    within a specific AWS Secret Engine in HashiCorp Vault. This action is used for
    discovery and administrative purposes, allowing users to see which roles are available
    for credential generation without targeting specific SOAR entities.


    ### Flow Description

    1. **Parameter Initialization**: The action extracts integration configuration
    and action parameters.

    2. **Validation**: It validates that the `Max Records To Return` parameter is
    a positive integer.

    3. **API Interaction**: The action sends a `LIST` HTTP request to the HashiCorp
    Vault API endpoint `/v1/{key_value}/roles/` using the provided secret engine path.

    4. **Data Truncation**: The resulting list of role keys is truncated based on
    the `Max Records To Return` limit.

    5. **Output**: The list of roles is returned as a JSON result, and a success message
    is displayed in the action output.


    ### Additional Notes

    - This action does **not** run on entities; it is a global discovery action.

    - If the specified path does not exist or contains no roles, the action will return
    a 'Not Found' status.
