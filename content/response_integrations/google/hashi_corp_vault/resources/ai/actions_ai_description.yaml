Ping:
  ai_description: >-
    ### General Description

    Tests the connectivity to the HashiCorp Vault instance using the provided configuration
    parameters. This action is primarily used to verify that the integration can successfully
    authenticate and communicate with the Vault API by performing a health check against
    the host information endpoint.


    ### Flow Description

    1. Retrieves connection details and authentication credentials from the integration
    configuration.

    2. Initializes the HashiCorpVaultManager, which configures the request session
    and handles authentication. If credentials are provided instead of a token, it
    performs a login request to retrieve a client token.

    3. Executes a GET request to the `/v1/sys/host-info` endpoint to verify the service
    is reachable and the credentials are valid.

    4. Returns a success message if the connection is established, or a failure message
    with error details if the connection or authentication fails.


    ### Additional Notes

    * The action requires either a valid Token or a combination of Username and Password
    for authentication. If neither is provided, the action will fail during initialization.

    * This action does not process any entities and is intended for configuration
    validation.
