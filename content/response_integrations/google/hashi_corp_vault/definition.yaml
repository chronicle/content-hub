identifier: HashiCorpVault
name: HashiCorp Vault
parameters:
-   name: API Root
    default_value: https://x.x.x.x:8200
    type: string
    description: Specify api root to connect to.
    is_mandatory: true
    integration_identifier: HashiCorpVault
-   name: Token
    default_value: ''
    type: password
    description: Specify a token to use for connection. Authentication can be done
        either via token, or username/password combination.
    is_mandatory: false
    integration_identifier: HashiCorpVault
-   name: Username
    default_value: ''
    type: string
    description: Specify a username to use for connection. Authentication can be done
        either via token, or username/password combination.
    is_mandatory: false
    integration_identifier: HashiCorpVault
-   name: Password
    default_value: ''
    type: password
    description: Specify a password to use for connection. Authentication can be done
        either via token, or username/password combination.
    is_mandatory: false
    integration_identifier: HashiCorpVault
-   name: Verify SSL
    default_value: false
    type: boolean
    description: If enabled, the certificate configured for the API root is validated.
    is_mandatory: false
    integration_identifier: HashiCorpVault
-   name: Key-Value Secret Engine Path
    default_value: secret
    type: string
    description: Specify the path used for the key-value secret storage. Currently
        only version 2 is supported. Parameter is used to interact with secrets stored
        in storage, it is used to construct the urls like https://x.x.x.x:8200/v1/secret/data/<secret
        to fetch from kv store>
    is_mandatory: true
    integration_identifier: HashiCorpVault
documentation_link: https://cloud.google.com/chronicle/docs/soar/marketplace-integrations/hashicorp-vault
categories:
- Identity and Access Management
svg_logo_path: resources/logo.svg
image_path: resources/image.png
