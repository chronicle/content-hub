name: Generate AWS Credentials
description: 'Generate credentials based on AWS role stored in HashiCorp Vault. Note:
    This action doesn’t run on Chronicle SOAR entities.'
integration_identifier: HashiCorpVault
parameters:
-   name: AWS Secret Engine Path
    default_value: aws
    type: string
    description: Specify the path used for the aws secret storage. Parameter is used
        to interact with secrets stored in storage, it is used to construct the urls
        like https://x.x.x.x:8200/v1/aws/roles/
    is_mandatory: false
-   name: AWS Role Name
    default_value: ''
    type: string
    description: Specify the role name to generate credentials for.
    is_mandatory: true
-   name: AWS Role ARN
    default_value: ''
    type: string
    description: Specify the ARN of the role to assume if credential_type on the Vault
        role is assumed_role. Must match one of the allowed role ARNs in the Vault
        role.
    is_mandatory: false
-   name: AWS Role Session Name
    default_value: ''
    type: string
    description: Specify the role session name to attach to the assumed role ARN.
        If not provided it will be generated dynamically by default.
    is_mandatory: false
-   name: TTL (seconds)
    default_value: 3600
    type: string
    description: Specifies the TTL in seconds for the use of the STS token. This is
        specified as a string with a duration suffix. Valid only when AWS role credential_type
        in Vault is assumed_role or federation_token. When not specified, the default_sts_ttl
        set for the role will be used. If that is also not set, then the default value
        of 3600 seconds will be used.
    is_mandatory: false
-   name: JSON Expression Builder
    default_value: ''
    type: string
    description: 'Specify a JSON Expression Builder expression to filter a specific
        subset of data from secret, for example:  | “data” | “data” | “key0”'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/generate_aws_credentials_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
