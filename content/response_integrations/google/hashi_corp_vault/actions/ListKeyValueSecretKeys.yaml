name: List Key-Value Secret Keys
description: 'List secrets keys available in the HashiCorp Vault based on provided
    criteria. Action returns key names stored in secret path without values. Folder
    names should be specified for secret path, action does not work if secret key
    is provided. Note: This action doesn''t run on Chronicle SOAR entities.'
integration_identifier: HashiCorpVault
parameters:
-   name: Key-Value Secret Engine Path
    default_value: secret
    type: string
    description: Specify the path used for the key-value secret storage. Currently
        only version 2 is supported. Parameter is used to interact with secrets stored
        in storage, it is used to construct the urls like https://x.x.x.x:8200/v1/secret/data/<secret
        to fetch from kv store>
    is_mandatory: false
-   name: Secret Path
    default_value: ''
    type: string
    description: Specify secret path to fetch, action accept folder names, example
        secret path folder name is my-secret, key-value store path is secret, so full
        path to fetch would be "https://x.x.x.x:8200/v1/secret/data/my-secret". If
        not provided, action will return all secret keys stored in the secret engine.
    is_mandatory: false
-   name: Max Records To Return
    default_value: 50
    type: string
    description: Specify how many records to return. If nothing is provided, action
        will return 50 records.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_key_value_secret_keys_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
