name: Read Key-Value Secret
description: 'Read Key-Value secret stored in HashiCorp Vault based on provided criteria.
    Note: This action doesn''t run on Chronicle SOAR entities.'
integration_identifier: HashiCorpVault
parameters:
-   name: Key-Value Secret Engine Path
    default_value: secret
    type: string
    description: Specify the path used for the key-value secret storage. Currently
        only version 2 is supported. Parameter is used to interact with secrets stored
        in storage, it is used to construct the urls like https://x.x.x.x:8200/v1/secret/data/<secret
        to fetch from kv store>
    is_mandatory: false
-   name: Secret Path
    default_value: ''
    type: string
    description: Specify secret path to fetch, example secret path is my-secret, key-value
        store path is secret, so full path to fetch would be "https://x.x.x.x:8200/v1/secret/data/my-secret".
    is_mandatory: true
-   name: Secret Version
    default_value: ''
    type: string
    description: Specify a secret version to fetch.
    is_mandatory: false
-   name: JSON Expression Builder
    default_value: ''
    type: string
    description: 'Specify a JSON Expression Builder expression to filter a specific
        subset of data from secret, for example: data | data | key0'
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/read_key_value_secret_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
