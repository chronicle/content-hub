name: List AWS Roles
description: 'List AWS roles available in the HashiCorp Vault based on provided criteria.
    Note: This action doesn’t run on Chronicle SOAR entities.'
integration_identifier: HashiCorpVault
parameters:
-   name: AWS Secret Engine Path
    default_value: aws
    type: string
    description: Specify the path used for the aws secret storage. Parameter is used
        to interact with secrets stored in storage, it is used to construct the urls
        like https://x.x.x.x:8200/v1/aws/roles/
    is_mandatory: false
-   name: Max Records To Return
    default_value: 50
    type: string
    description: Specify how many records to return. If nothing is provided, action
        will return 50 records.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/list_aws_roles_JsonResult_example.json
    result_name: JsonResult
    show_result: true
creator: admin
