    current case or alert in Google SecOps. This utility action allows analysts to
    dynamically generate entities of any specified type and optionally attach custom
    JSON enrichment data to them.


    ### Flow Description

    1. Retrieves the list of entity identifiers, the target entity type, and the separator
    character from the action parameters.

    2. Splits the identifiers string using the provided separator to process them
    individually.

    3. Iterates through the extracted identifiers and checks if they already exist
    within the current case's alerts.

    4. If an identifier does not exist, it validates the format (e.g., verifying it
    is a valid IP address if the selected type is `ADDRESS`).

    5. Calls the internal SecOps API (`add_entity_to_case`) to create and attach the
    new entity to the case with the specified type, internal status, and optional
    enrichment properties.

    6. Returns a JSON result summarizing the successfully created entities and any
    that failed or already existed.


