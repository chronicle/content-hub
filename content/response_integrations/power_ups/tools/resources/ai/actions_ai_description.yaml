Add Alert Scoring Information:
  ai_description: >-
    ### General Description

    This action adds an entry to the alert scoring database by calculating and updating
    the alert's score based on predefined severity ratios. It evaluates the provided
    scoring information and adjusts the overall alert severity accordingly.


    ### Flow Description

    1. Extracts the scoring parameters including Name, Description, Category, Severity,
    and Source.

    2. Retrieves the current alert scoring information from the alert's context properties
    (`ALERT_SCORE_INFO`).

    3. Calculates the new score and updates the category scores based on the provided
    severity and predefined thresholds (e.g., 5 Low = 1 Medium).

    4. Updates the alert context properties (`ALERT_SCORE_INFO`, `ALERT_SCORE`, `ALERT_SEVERITY`)
    with the newly computed scores.

    5. Returns the updated scoring data as a JSON result.


    ### Additional Notes

    The scoring thresholds are hardcoded within the action: 5 Low = 1 Medium, 3 Medium
    = 1 High, and 2 High = 1 Critical.
  ai_short_description: >-
    Calculates and updates the alert's score and severity in the alert context properties
    based on predefined severity ratios and provided scoring information.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: true
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Updates the alert's context properties (ALERT_SCORE_INFO, ALERT_SCORE, ALERT_SEVERITY)
      with newly calculated scoring data.
    reasoning: >-
      The action does not fetch data from or mutate data in external systems. It mutates
      internal data by updating the alert's context properties (`ALERT_SCORE_INFO`,
      `ALERT_SCORE`, `ALERT_SEVERITY`) using `siemplify.set_alert_context_property`.
      It does not update entities, create insights, or add case comments.
