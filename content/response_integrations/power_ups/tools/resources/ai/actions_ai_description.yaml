Get Case SLA:
  ai_description: >-
    ### General Description

    Retrieves the Service Level Agreement (SLA) and critical SLA expiration times
    for the current case within Google SecOps. It formats these timestamps based on
    a user-defined datetime format and outputs the results for use in subsequent playbook
    steps.


    ### Flow Description

    1. Extracts the `DateTime Format` parameter provided by the user.

    2. Makes an internal API call (`get_case_overview_details`) to the Google SecOps
    platform to fetch the overview details for the current case.

    3. Parses the standard SLA and critical SLA expiration times (in UNIX timestamp
    format) from the retrieved case data.

    4. Converts the UNIX timestamps into human-readable strings using the specified
    datetime format.

    5. Appends the formatted SLA strings and original UNIX timestamps to the action's
    JSON result.


    ### Additional Notes

    This action is strictly for internal case management and does not interact with
    external third-party systems. It is useful for tracking case deadlines and triggering
    conditional logic in playbooks based on remaining SLA time.
  ai_short_description: >-
    Retrieves the standard and critical Service Level Agreement (SLA) expiration times
    for the current case and formats them according to a specified datetime format.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
