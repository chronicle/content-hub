DNS Lookup:
  ai_description: >-
    ### General Description

    Performs a DNS lookup on Address and Hostname entities. For Address entities,
    the action executes a reverse DNS lookup to find PTR records. For Hostname entities,
    it executes a forward DNS query based on the specified data type (e.g., A, AAAA,
    MX, ANY). The results are aggregated and returned as a JSON object containing
    the discovered DNS records.


    ### Flow Description

    1. Retrieves the list of target entities and the specified DNS servers from the
    action parameters.

    2. Iterates through each target entity.

    3. If the entity is an Address (IP), performs a reverse DNS lookup (PTR) against
    the provided DNS servers.

    4. If the entity is a Hostname, performs a DNS query using the specified 'Data
    Type' against the provided DNS servers.

    5. Aggregates the discovered DNS records into a JSON result object.

    6. Attaches the JSON results to the action output and completes the execution.


    ### Additional Notes

    The action relies on standard UDP DNS queries and requires network access to the
    specified DNS servers from the execution environment.
