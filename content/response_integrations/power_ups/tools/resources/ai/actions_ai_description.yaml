Convert Into Simulated Case:
  ai_description: >-
    ### General Description

    Converts an alert's source file content into a simulated case format. This action
    extracts the raw case JSON from the first entity's additional properties, modifies
    specific fields to align with the custom case import endpoints, and can either
    push the result directly to the SecOps simulator or save it as a JSON file attachment
    on the case wall.


    ### Flow Description

    1. Retrieves the `SourceFileContent` from the `additional_properties` of the first
    entity in the current alert.

    2. Parses the content as JSON and modifies event fields such as `DeviceEventClassId`
    and `Name`.

    3. Optionally overrides or formats the overall case name based on input parameters.

    4. Aligns the case data format (e.g., converting enum fields and property names)
    for compatibility with the simulator.

    5. If configured, pushes the aligned case data to the SecOps simulator via the
    internal SOAR API (`import_simulator_custom_case`).

    6. If configured, saves the aligned case data as a base64-encoded file attachment
    to the case wall.

    7. Returns the aligned JSON data as the action result.


    ### Additional Notes

    This action only supports the Alert execution scope and will fail if executed
    at the Case level. It relies on the presence of the `SourceFileContent` key in
    the first entity's additional properties.
  ai_short_description: >-
    Converts an alert's source file content into a simulated case format, optionally
    pushing it to the SecOps simulator or saving it as a case wall attachment.
