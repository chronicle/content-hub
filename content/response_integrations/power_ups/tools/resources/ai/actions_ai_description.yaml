Delay Playbook V2:
  ai_description: >-
    ### General Description

    This action temporarily pauses the execution of a playbook for a specified duration
    or until a specific time defined by a cron expression.


    ### Flow Description

    1. Retrieves the delay parameters (Seconds, Minutes, Hours, Days) or a Cron Expression.

    2. Calculates the target date and time for the playbook to resume.

    3. If a cron expression is provided, it calculates the next matching timestamp,
    prioritizing it over the time offset parameters.

    4. Compares the target date with the current time.

    5. If the target date has not been reached, the action suspends itself and returns
    an in-progress state.

    6. Once the target date is reached, the action completes successfully, allowing
    the playbook to proceed.


    ### Additional Notes

    The action runs asynchronously. The cron expression takes precedence over the
    time offset parameters.
