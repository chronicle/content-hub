Attach Playbook to Alert:
  ai_description: >-
    ### General Description

    Attaches one or more specified playbooks (workflows) to an alert or case within
    Google SecOps. This action allows analysts to dynamically trigger additional automation
    or response processes on specific alerts, with an option to prevent duplicate
    playbook executions.


    ### Flow Description

    1. Extracts the target playbooks and the "Allow Duplicates" preference from the
    action parameters.

    2. Determines the execution scope (Alert or Case) to identify the target alerts.

    3. Retrieves the currently attached workflows for each target alert using the
    internal SOAR API (`get_workflow_instance_card`).

    4. Iterates through the provided playbooks and attaches them to the target alerts
    using the internal `Siemplify.attach_workflow_to_case` method, skipping duplicates
    if configured to do so.

    5. Returns a summary message detailing which playbooks were successfully attached,
    skipped as duplicates, or failed to attach.


    ### Additional Notes

    This action operates entirely within the Google SecOps platform and does not interact
    with external third-party systems.
