Add Or Update Alert Additional Data:
  ai_description: >-
    ### General Description

    Adds or updates fields in the additional data payload of the target alert(s) within
    Google SecOps. This action allows users to append new information or modify existing
    data attached to an alert.


    ### Flow Description

    1. Retrieves the incoming data from the `Json Fields` parameter.

    2. Parses the input as JSON, falling back to a raw string if parsing fails.

    3. Determines the execution scope (Alert or Case) to identify the target alerts.

    4. Iterates through the target alerts, merging the incoming data with the alert's
    existing `additional_data` payload.

    5. Updates the alerts in Google SecOps via the `update_alerts_additional_data`
    method.

    6. Attaches the last processed alert's updated data as a JSON result to the action.


    ### Additional Notes

    The input can be a free text string (for a single variable) or a valid JSON string
    (dictionary or list, which can be nested).
