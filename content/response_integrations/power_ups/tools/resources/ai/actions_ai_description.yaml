Delay Playbook Synchronous:
  ai_description: >-
    ### General Description

    This action temporarily pauses the execution of a playbook for a specified duration,
    up to a maximum of 30 seconds. It is used to introduce a synchronous delay before
    the playbook proceeds to the next step.


    ### Flow Description

    1. Extracts the `Seconds` parameter provided by the user.

    2. Validates that the provided value is a positive integer and falls within the
    allowed range (0 to 30 seconds).

    3. Calculates the target completion time and enters a sleep loop, pausing execution
    until the specified time has elapsed.

    4. Outputs a success message indicating that the configured delay has been reached.


    ### Additional Notes

    This action is strictly for short, synchronous delays (up to 30 seconds). If a
    playbook requires a delay longer than 30 seconds, the "Delay Playbook V2" action
    should be used instead to avoid blocking system resources.
  ai_short_description: >-
