Wait for Playbook to Complete:
  ai_description: >-
    ### General Description

    This action causes a playbook to wait until another specified playbook or block,
    running on the same alert or case, completes its execution. It acts as a synchronization
    mechanism for concurrent playbooks.


    ### Flow Description

    1. Retrieves the target playbook name from the action parameters.

    2. Determines the execution scope (Alert or Case).

    3. Fetches the workflow instance cards for the relevant alerts using the internal
    SOAR API.

    4. Evaluates the execution status of the specified playbook.

    5. If the target playbook is in progress or pending, the action returns an 'In
    Progress' status, keeping the current playbook locked and waiting.

    6. If the target playbook is completed, failed, terminated, or not found, the
    action returns a 'Completed' status, releasing the lock and allowing the current
    playbook to proceed.


    ### Additional Notes

    This action is essential for orchestrating complex response workflows where certain
    steps must not execute until a prerequisite playbook has finished processing.
  ai_short_description: >-
    Pauses the current playbook execution until a specified playbook or block running
    on the same alert or case completes.
