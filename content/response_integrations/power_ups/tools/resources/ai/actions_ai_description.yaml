    1. Retrieves the `Normalization Data` parameter containing the JSON mapping configuration.

    2. Iterates through all target entities associated with the case or alert.

    3. For each entity, checks its `additional_properties` for the specified original
    field names.

    4. If an original field is found, its value is copied to the new field name. If
    it is not found, the new field name is initialized with an empty string.

