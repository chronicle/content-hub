  ai_description: >-
    ### General Description

    Evaluates whether a provided subset list of items is entirely contained within
    an original list of items. It accepts both JSON-formatted lists and comma-separated
    strings as inputs, converting them into sets to perform a mathematical subset
    comparison.


    ### Flow Description

    1. Retrieves the 'Original' list and 'Subset' list from the action parameters.

    2. Parses both inputs into sets, handling either JSON arrays or comma-separated
    strings (stripping whitespace and converting digits to integers where applicable).

    3. Performs a subset comparison (`subset <= original`) to determine if all elements
    in the subset exist in the original list.

    4. Returns a boolean result and a descriptive message detailing any missing items
    if the subset condition is not met.


