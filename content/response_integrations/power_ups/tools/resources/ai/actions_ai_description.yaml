Get Certificate Details:
  ai_description: >-
    ### General Description

    Retrieves and analyzes the SSL/TLS certificate of a specified URL. This action
    connects to the target URL, extracts its X.509 certificate, and parses it to provide
    detailed information such as the Common Name, Issuer, Subject Alternative Names
    (SAN), and expiration status.


    ### Flow Description

    1. Extracts the target URL from the action parameters.

    2. Establishes a socket connection to the specified URL on port 443.

    3. Retrieves the X.509 certificate using the `ssl` and `cryptography` libraries.

    4. Parses the certificate to extract details including Common Name, Issuer, SAN,
    expiration dates, and whether it is self-signed.

    5. Returns the parsed certificate details as a JSON result to the playbook.


    ### Additional Notes

    This action is useful for verifying certificate validity, checking expiration
    dates, and identifying potential security risks associated with self-signed or
    expired certificates on suspicious URLs.
