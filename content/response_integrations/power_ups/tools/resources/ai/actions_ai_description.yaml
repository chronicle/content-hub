Search Text:
  ai_description: >-
    ### General Description

    The "Search Text" action is a utility function designed to search for specific
    substrings or regular expression patterns within a provided input text. It evaluates
    the input and returns a boolean result indicating whether any matches were found,
    along with a JSON object detailing the specific matches.


    ### Flow Description

    1. Extracts the input text, search string, regex patterns, and case sensitivity
    preference from the action parameters.

    2. Validates that at least one search criteria (either a search string or a regex
    pattern) is provided.

    3. If a search string is provided, checks for its presence in the input text,
    respecting the case sensitivity flag.

    4. If regex patterns are provided, iterates through the list and applies each
    pattern to the input text using Python's `re` module.

    5. Compiles any successful matches into a JSON object.

    6. Returns "true" if at least one match is found, otherwise "false", and attaches
    the JSON result to the action output.


