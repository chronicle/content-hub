    ### General Description

    The Spell Check String action evaluates the spelling of an input string using
    a local spellchecking library. It calculates the accuracy percentage, identifies
    misspelled words, provides suggested corrections, and generates a fully corrected
    version of the original string.


    ### Flow Description

    1. Extracts the input string from the action parameters.

    2. Removes punctuation and splits the string into individual words.

    3. Evaluates the words against a local dictionary to identify misspelled words.

