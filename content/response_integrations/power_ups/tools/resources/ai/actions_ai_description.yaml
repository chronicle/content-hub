Extract URL Domain:
  ai_description: >-
    ### General Description

    This action extracts the domain (and optionally the subdomain) from entity identifiers
    and a list of URLs provided as a parameter. It enriches the entities with a new
    field `siemplifytools_extracted_domain` containing the extracted domain. If the
    entity has no domain (e.g., a file hash), it will simply not return anything for
    that entity.


    ### Flow Description

    1. Retrieves the list of URLs, the separator, and the `Extract subdomain` parameter.

    2. Iterates over the provided URLs, extracts the domain using a local parsing
    library, and adds the result to the JSON output.

    3. Iterates over the target entities and attempts to extract the domain from their
    identifiers.

    4. If successful, enriches the entity by adding `siemplifytools_extracted_domain`
    to its `additional_properties`.

    5. Updates the successful entities in the platform.

    6. Adds the extracted domains to the JSON result.


    ### Additional Notes

    This action does not make any external API calls; it relies on local string parsing.
