Lock Playbook:
  ai_description: >-
    ### General Description

    This action pauses the execution of the current playbook until all playbooks associated
    with the previous alert (or all alerts in the case, depending on the execution
    scope) have completed. It is used to enforce sequential execution of playbooks
    across multiple alerts within a single case.


    ### Flow Description

    1. Determines the execution scope (Alert or Case).

    2. If the scope is Alert, it identifies the current alert's position in the case
    based on its creation time.

    3. If it is the first alert, the playbook continues execution immediately.

    4. If it is not the first alert, it checks the workflow status of the previous
    alert using the internal SOAR API.

    5. If the previous alert's playbooks are still running, the action returns an
    'In Progress' state, effectively locking and pausing the current playbook.

    6. If the scope is Case, it checks the workflow status of all alerts in the case
    and waits until all playbooks are completed before releasing the lock.


    ### Additional Notes

    This action relies on the internal SOAR API to fetch workflow instance cards and
    does not interact with any external third-party systems.
