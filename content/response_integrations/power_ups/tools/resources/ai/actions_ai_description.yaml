Append to Context Value:
  ai_description: >-
    ### General Description

    Appends a specified value to an existing context property or creates a new context
    property with the value within Google SecOps. This action allows playbooks to
    dynamically build and store accumulated data (such as lists of tags, IDs, or notes)
    at the Alert, Case, or Global scope.


    ### Flow Description

    1. Extracts the target `Scope` (Alert, Case, or Global), the property `Key`, the
    `Value` to append, and the `Delimiter`.

    2. Retrieves the existing context property based on the specified scope and key.

    3. If the property already exists, appends the new value to the existing data
    using the provided delimiter.

    4. If the property does not exist, creates a new context property and sets it
    to the provided value.

    5. Saves the updated context property back to the platform.


    ### Additional Notes

    This action does not interact with any external systems. It is strictly used for
    internal data manipulation and state management during playbook execution.
