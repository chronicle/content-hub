Delay Playbook:
  ai_description: >-
    ### General Description

    Temporarily stops a playbook from completing for a specified period of time. This
    action is useful for introducing deliberate pauses in automated workflows, allowing
    time for external processes to complete or for manual review before proceeding.


    ### Flow Description

    1. Retrieves the delay duration from the input parameters (Seconds, Minutes, Hours,
    Days).

    2. Calculates the target date and time for the playbook to resume execution.

    3. Checks if the current time has reached or passed the target date.

    4. If the target date is reached, the action completes successfully.

    5. If the target date is not reached, the action suspends itself (returns an in-progress
    state) and will be re-evaluated asynchronously until the time elapses.


    ### Additional Notes

    This action runs asynchronously. It will periodically wake up to check if the
    delay period has elapsed without consuming active execution threads during the
    wait time.
