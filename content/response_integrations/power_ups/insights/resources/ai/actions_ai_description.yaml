"Create Entity Insight From Multiple JSONs":
  ai_description: >-
    ### General Description

    The action creates an entity insight by parsing and extracting specific fields
    from multiple provided JSON strings. It allows users to consolidate data from
    various JSON sources into a single, formatted HTML table attached to the relevant
    entities.


    ### Flow Description

    1. Retrieves up to seven sets of Title, Fields, and JSON string parameters (though
    the configuration defines up to five).

    2. Parses the field definitions to determine the display names and JSON key paths,
    using the specified placeholder separator.

    3. Iterates through all target entities in the case.

    4. For each entity, searches the provided JSON strings for data matching the entity's
    identifier.

    5. Extracts the specified values from the JSON data using the provided key paths.

    6. Formats the extracted data into an HTML table and attaches it as an insight
    to the respective entity.


    ### Additional Notes

    - The action expects the JSON data to contain an "Entity" field to match against
    the target entity's identifier, and an "EntityResult" field containing the actual
    data to be parsed.

    - If a field definition lacks a display name, it will not be included in the table
    but will be appended as text.
  ai_short_description: >-
    Creates an entity insight by parsing and extracting specific fields from multiple
    provided JSON strings.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
