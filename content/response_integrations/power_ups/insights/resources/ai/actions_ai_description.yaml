Create Entity Insight From Enrichment:
  ai_description: >-
    ### General Description

    Creates an entity insight based on a formatted message string that incorporates
    data from the entity's additional properties (usually populated by a previous
    enrichment action).


    ### Flow Description

    1. Iterates through all target entities in the case.

    2. Parses the provided message template, replacing placeholders with corresponding
    values from the entity's `additional_properties`.

    3. If a valid message is generated, attaches it as an insight to the entity within
    the SecOps platform.


    ### Additional Notes

    This action does not interact with external APIs. It relies on data already present
    in the entity's additional properties.
  ai_short_description: >-
    Creates an entity insight by formatting a provided message template with data
    extracted from the entity's additional properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
