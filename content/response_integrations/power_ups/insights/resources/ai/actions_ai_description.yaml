Create Entity Insight From JSON:
  ai_description: >-
    ### General Description

    Creates an entity insight by parsing a provided JSON string and matching its contents
    with target entities. The action extracts data from the JSON based on a specified
    key path, formats a custom message using placeholders, and attaches the resulting
    message as an insight to the corresponding entities.


    ### Flow Description

    1. Parses the provided JSON string from the action parameters.

    2. Iterates through all target entities within the case.

    3. For each entity, searches the JSON data for a matching identifier using the
    provided `Identifier KeyPath`.

    4. If a match is found, formats the `Message` string by replacing placeholders
    with corresponding values from the matched JSON object.

    5. Attaches the formatted message as an insight to the entity using the specified
    `Triggered By` integration name.


    ### Additional Notes

    - The action supports custom pipe functions within the message placeholders (e.g.,
    `default`, `str`, `join`, `count`, `to_str`) to manipulate the JSON data before
    inserting it into the message.

    - Entities that do not have a matching identifier in the provided JSON will be
    skipped without generating an insight.
  ai_short_description: >-
    Creates an entity insight by matching target entities with data from a provided
    JSON string and formatting a custom message.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
