    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Creates entity insights based on the parsed JSON data.
    reasoning: >-
      The action does not fetch data from external sources or mutate external data.
      It mutates internal data by creating entity insights (`siemplify.add_entity_insight`)
      based on the parsed JSON strings. It does not update entities, modify alert
      data, or create case comments.
