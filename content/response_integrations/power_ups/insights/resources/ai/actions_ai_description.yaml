    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action parses a provided JSON string and does not fetch data from external
      sources. It does not mutate external data. It calls `siemplify.add_entity_insight`
      to attach the formatted message to the entities, which creates insights.
