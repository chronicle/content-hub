    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Creates and attaches insights to entities within Google SecOps.
    reasoning: >-
      The action does not fetch data from or mutate data in external systems. It mutates
      internal data by creating insights and attaching them to entities using `siemplify.add_entity_insight`.
