Ping:
  ai_description: >-
    ### General Description

    Tests connectivity to the GitSync repository and the Chronicle SOAR server. This
    action verifies that the integration is configured correctly and can establish
    a connection with both the Git repository and the SOAR platform.


    ### Flow Description

    1. Extracts integration configuration parameters (e.g., Repo URL, Branch, credentials).

    2. Initializes the `GitSyncManager` with the provided configuration.

    3. Tests connectivity to the Chronicle SOAR server via the API client.

    4. If a Git server fingerprint is provided, connects to the Git server to verify
    the fingerprint.

    5. Returns a success message if all connections are established successfully.


    ### Additional Notes

    This action does not require any action-specific parameters as it relies entirely
    on the integration-level configuration.
  ai_short_description: >-
    Tests connectivity to the GitSync repository and the Chronicle SOAR server to
    verify integration configuration.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
