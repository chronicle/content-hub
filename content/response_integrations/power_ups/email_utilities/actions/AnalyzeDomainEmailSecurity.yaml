creator: Sean Whalen
default_result_value: ''
description: Analyzes the email-security posture of a domain's published DNS records
    using checkdmarc, reporting the presence and validity of its SPF and DMARC records
    (with warnings), its MX hosts, and whether its DNS is DNSSEC-signed. These fields
    describe what the domain publishes and enforces - they say nothing about whether
    any individual email passed authentication; use Analyze Headers or Analyze EML
    Headers for per-message verdicts. Returns the same SPF, DMARC, MX, DNSSec, and
    StrongSPF structures that Analyze Headers provided before integration version
    53.0, so playbooks that referenced those fields can migrate to this action.
dynamic_results_metadata:
-   result_example_path: resources/AnalyzeDomainEmailSecurity_JsonResult_example.json
    result_name: JsonResult
    show_result: true
integration_identifier: EmailUtilities
name: Analyze Domain Email Security
parameters:
-   default_value: ''
    description: The domain whose published DNS records to check, e.g. the FromDomain
        reported by Analyze Headers.
    is_mandatory: true
    name: Domain
    type: string
-   default_value: 'false'
    description: Connect to each of the domain's resolved MX hosts over SMTP to test
        STARTTLS/TLS support. Disabled by default because environments that block
        outbound SMTP (for example, Google Cloud blocks destination TCP port 25)
        make each probe time out and then report a misleading "STARTTLS is not supported"
        warning for every MX host.
    is_mandatory: false
    name: Test MX Hosts For STARTTLS/TLS
    type: boolean
-   default_value: 'true'
    description: Include a human-readable name and description for each parsed DMARC
        tag in the results, as Analyze Headers did before integration version 53.0.
    is_mandatory: false
    name: Include Tag Descriptions
    type: boolean
script_result_name: ScriptResult
