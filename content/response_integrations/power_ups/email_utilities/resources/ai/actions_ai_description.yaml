Analyze Headers:
  ai_description: >-
    ### General Description

    Analyzes a provided JSON object containing email headers to validate SPF, DMARC,
    ARC, and DKIM records. It also checks relay servers against multiple RBLs (Real-time
    Blackhole Lists) and enriches them with geo-location and IP WHOIS information.


    ### Flow Description

    1. Parses the input JSON string containing the email headers.

    2. Extracts key header fields such as From, To, Subject, MessageID, Date, and
    domains.

    3. Validates SPF, DMARC, MX, and DNSSec records for the extracted domains using
    external DNS queries.

    4. Verifies DKIM and ARC signatures present in the headers.

    5. Parses the 'Received' headers (hops) to identify relay servers and routing
    paths.

    6. Queries RBLs (via `pydnsbl`), IP WHOIS, and `DbIpCity` to check if relay IPs
    or domains are blacklisted and to retrieve geo-location data.

    7. Aggregates the findings and returns the comprehensive analysis as a JSON result.


    ### Additional Notes

    This action does not operate on SOAR entities directly but processes raw header
    data provided as input. It relies on external DNS and WHOIS lookups to perform
    its validation and enrichment.
  ai_short_description: >-
    Analyzes email headers provided in JSON format to validate SPF, DMARC, ARC, and
    DKIM records, checks relay servers against RBLs, and retrieves geo-location and
    WHOIS data.
