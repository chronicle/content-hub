Parse Case Wall Email:
  ai_description: >-
    ### General Description

    This action parses an EML or MSG file that has been attached to the case wall.
    It extracts email metadata, body content, and attachments, and can automatically
    create entities from the observed data.


    ### Flow Description

    1. Retrieves attachments from the case wall and identifies EML or MSG files.

    2. Parses the email content, extracting headers, body, and attachments.

    3. Optionally creates entities (such as URLs, Emails, IPs, and Hashes) from the
    parsed data and links them appropriately.

    4. Optionally saves extracted attachments back to the case wall.

    5. Updates file entities with their corresponding attachment IDs if applicable.


    ### Additional Notes

    The action supports custom regular expressions for entity extraction and can automatically
    fang or defang entities based on the configuration.
