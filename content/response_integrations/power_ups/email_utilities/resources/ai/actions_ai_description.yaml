Parse Base64 Email:
  ai_description: >-
    ### General Description

    Parses a base64 encoded EML or MSG file and extracts its contents, including headers,
    body, attachments, and nested emails. It also identifies and extracts observed
    indicators such as URLs, domains, IP addresses, and email addresses from the email
    content.


    ### Flow Description

    1. Retrieves the base64 encoded email string and parsing configuration parameters
    (e.g., blacklisted headers).

    2. Decodes the base64 string into binary content.

    3. Determines if the content is an OLE file (MSG) or a standard EML file.

    4. Parses the email structure to extract headers, body text, HTML content, attachments,
    and any nested emails.

    5. Extracts observed indicators (URLs, domains, IPs, emails) from the body and
    headers.

    6. Returns the parsed email data and extracted indicators as a structured JSON
    object.


    ### Additional Notes

    This action operates entirely locally within the SOAR platform and does not make
    any external API calls.
