Analyze EML Headers:
  ai_description: >-
    ### General Description

    Analyzes a provided Base64 encoded EML file or a JSON list of headers to extract
    and evaluate email headers for suspicious indicators.


    ### Flow Description

    1. Receives either a Base64 encoded EML string or a JSON list of headers.

    2. Parses the input to extract email headers.

    3. Extracts domains and addresses from 'Received' headers.

    4. Evaluates headers for suspicious indicators (e.g., mismatches between 'Return-Path'
    and 'From', presence of 'Bcc', missing 'Message-ID').

    5. Generates an HTML table of all headers and a list of recommendations/findings.

    6. Returns the analysis results as a JSON object.


    ### Additional Notes

    This action performs local analysis and does not interact with external APIs.
  ai_short_description: >-
    Analyzes a provided Base64 encoded EML file or a JSON list of headers to extract
    and evaluate email headers for suspicious indicators.
