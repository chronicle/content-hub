    1. Retrieves the base64 encoded EML string from the action parameters.

    2. Decodes the base64 string into a UTF-8 string.

    3. Parses the string into an email message object.

    4. Extracts metadata such as sender, recipient, subject, and date.

    5. Extracts the text and HTML bodies.

    6. Iterates through the email parts to extract attachments and their metadata.

    7. Returns the parsed information as a JSON object.


    ### Additional Notes

    The action handles multipart emails and extracts attachments as base64 encoded
    strings within the JSON result.
