Entity Insight:
  ai_description: >-
    ### General Description

    This action utilizes a Jinja2 template engine to generate Entity Insights from
    a provided JSON object. The input JSON must follow the EntityResult format and
    is used to populate the template with dynamic data.


    ### Flow Description

    1. Extracts the input JSON object, Jinja2 template, and other configuration parameters.

    2. Iterates through the target entities to build a dictionary of entity properties,
    explicitly excluding entities where the additional property 'Type' is 'ALERT'.

    3. Initializes a Jinja2 environment, loading custom filters for data manipulation.

    4. Iterates through the target entities again, matching each entity's identifier
    with the corresponding entry in the input JSON.

    5. Renders the Jinja2 template using the matched JSON data and entity properties.

    6. If the 'Create Insight' parameter is enabled, creates an entity insight with
    the rendered template content.

    7. Returns the rendered results as a JSON object.


    ### Additional Notes

    The action supports custom Jinja2 filters for advanced data formatting. Ensure
    the input JSON object is properly formatted to match the expected structure in
    the template.
  ai_short_description: >-
    Generates Entity Insights by rendering a Jinja2 template with data from a provided
    JSON object.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Creates entity insights based on the rendered Jinja2 template.
    reasoning: >-
      The action processes an input JSON object and renders a Jinja2 template. It
      does not fetch data from external sources or mutate external data. It mutates
      internal data by creating entity insights using `siemplify.add_entity_insight`.
  entity_usage:
    entity_types:
      address: true
      alert: true
      application: true
      child_hash: true
      child_process: true
      cluster: true
      container: true
      credit_card: true
      cve: true
      cve_id: true
      database: true
      deployment: true
      destination_domain: true
      domain: true
      email_message: true
      event: true
      file_hash: true
      file_name: true
      generic: true
      host_name: true
      ip_set: true
      mac_address: true
      parent_hash: true
      parent_process: true
      phone_number: true
      pod: true
      process: true
      service: true
      source_domain: true
      threat_actor: true
      threat_campaign: true
      threat_signature: true
      url: true
      usb: true
      user: true
    filters_by_additional_properties: true
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: false
    filters_by_identifier: true
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The action iterates over all `siemplify.target_entities` without filtering by
      specific entity types, meaning it can run on any entity type. It filters entities
      by checking `entity.additional_properties["Type"] != "ALERT"` and matches data
      by checking `entry["Entity"].lower() == entity.identifier.lower()`.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: false
    enrich_ioc: false
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action renders a Jinja2 template using a provided JSON object to create
      entity insights. It does not fetch external data, mutate external systems, or
      perform any of the specific expected outcomes defined in the categories.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
