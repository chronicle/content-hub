Render Template from Array:
  ai_description: >-
    ### General Description

    Renders a Jinja template for each item in a provided JSON array. This action is
    a utility function designed to transform lists of data into formatted strings
    or HTML by applying a specified template to every element in the list.


    ### Flow Description

    1. Extracts the input JSON array, Jinja template, join character, prefix, and
    suffix from the action parameters.

    2. Parses the input array into a JSON object. If the input is a single object
    instead of a list, it wraps it in a list.

    3. Initializes a Jinja environment, loading standard and custom filters.

    4. Iterates through each item in the input array.

    5. Renders the Jinja template for each item, passing the item as the context (accessible
    via the `row` variable).

    6. Joins the rendered strings together using the specified join character.

    7. Prepends the prefix and appends the suffix to the joined string.

    8. Returns the final rendered string as a JSON result under the `html_output`
    key.


    ### Additional Notes

    The action supports custom Jinja filters defined within the integration. Ensure
    the input provided to `Array input` is valid JSON.
  ai_short_description: >-
    Renders a Jinja template for each item in a provided JSON array and joins the
    results into a single formatted string.
