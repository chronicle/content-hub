Render Template:
  ai_description: >-
    ### General Description

    Renders a Jinja2 template using a provided JSON input. It can optionally include
    case data, such as security events and entities, to be used as variables within
    the template.


    ### Flow Description

    1. Determines the execution scope (Alert or Case).

    2. If the 'Include Case Data' parameter is enabled, retrieves security events
    and entities from the current alert or case context.

    3. Parses the provided 'JSON Object' parameter into a Python dictionary or list.

    4. Initializes the Jinja2 environment, loading standard and custom filters.

    5. Renders the template (provided via the 'Jinja' or 'Template' parameters) using
    the parsed JSON and optional case data.

    6. Returns the rendered HTML output as a JSON result.


    ### Additional Notes

    The rendered output is available in the action's JSON result under the `html_output`
    key. Custom Jinja filters are supported and can be used within the template code.
  ai_short_description: >-
    Renders a Jinja2 template using a provided JSON input and optional case data,
    returning the rendered output.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action processes internal data (JSON and case data) to render a Jinja template.
      It does not fetch data from external sources, mutate external systems, update
      entities, create insights, modify alert data, or create case comments.
