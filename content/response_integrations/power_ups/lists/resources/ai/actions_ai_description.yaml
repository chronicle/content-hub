Add String to Custom List:
  ai_description: >-
    ### General Description

    Adds a specified string to a custom list category within Google SecOps. This action
    is useful for dynamically updating internal lists (such as allowlists or blocklists)
    directly from a playbook.


    ### Flow Description

    1. Retrieves the `Category` and `ListItem` parameters provided by the user or
    playbook.

    2. Constructs a custom list item object using the provided string, category, and
    the current environment.

    3. Calls the internal `add_entities_to_custom_list` method to append the item
    to the specified custom list.

    4. Returns a success message indicating the item was successfully added to the
    category.


    ### Additional Notes

    This action modifies internal Google SecOps custom lists and does not interact
    with external APIs or third-party systems.
  ai_short_description: >-
    Adds a specified string to a custom list category within Google SecOps.
