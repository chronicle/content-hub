Is String In Custom List:
  ai_description: >-
    ### General Description

    Checks if a specific string or a list of strings exists within a specified custom
    list category in the current Google SecOps environment. This action is useful
    for verifying whether certain indicators, users, or other string values are present
    in predefined internal lists (e.g., allowlists or blocklists managed within the
    SOAR platform).


    ### Flow Description

    1. Retrieves the `Category` and `IdentifierList` parameters from the action configuration.

    2. Parses the `IdentifierList` into a Python list of strings (handling both JSON
    array and comma-separated string formats).

    3. Iterates through each string identifier and queries the internal SOAR custom
    list using the SDK (`siemplify.any_entity_in_custom_list`).

    4. Compiles a JSON result mapping each string identifier to a boolean value (`True`
    if found in the custom list, `False` otherwise).

    5. Returns the total count of found items as the result value and attaches the
    JSON mapping to the action results.


    ### Additional Notes

    The `IdentifierList` parameter is flexible and can accept either a valid JSON
    array of strings or a simple comma-separated string.
