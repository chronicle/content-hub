    It retrieves the custom list records and filters them based on the provided categories
    and search string, returning the matching records as a JSON result.


    ### Flow Description

    1. Extracts the `Categories` and `String to Search` parameters.

    2. Makes an internal API call (`get_traking_list_record`) to retrieve custom list
    records from the SOAR platform.

    3. Filters the retrieved records to include only those matching the specified
    categories (if provided).

    4. Further filters the records to find matches where the `entityIdentifier` contains
    the specified search string (if provided).

    5. Outputs the matching records as a JSON result and completes the action.


    ### Additional Notes

    If no values are provided for the parameters, the action will return all custom
    list records available in the platform.
