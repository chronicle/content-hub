Convert File:
  ai_description: >-
    ### General Description

    Use the Convert File action to change the format of a specified file between PNG
    and PDF. Important: This action requires a Remote Agent to function correctly.


    ### Flow Description

    1. Validates that the action is being executed on a Remote Agent.

    2. Validates the input parameters and ensures the source file exists at the specified
    path.

    3. Converts the file from PDF to PNG using `pdf2image` or from PNG to PDF using
    `PIL` (Pillow).

    4. Saves the newly converted file to a temporary directory on the Remote Agent.

    5. Returns the output format and the new file path in the JSON results.


    ### Additional Notes

    - Converting from PDF to PNG requires the `pdftoppm` dependency (installable via
    `poppler-utils`).

    - The input and output file formats cannot be the same.
  ai_short_description: >-
    Converts a specified file between PNG and PDF formats on a Remote Agent.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
