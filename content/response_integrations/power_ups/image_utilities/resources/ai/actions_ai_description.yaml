    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Attaches the generated rasterized image (PNG) or PDF document to the current
      case.
    reasoning: >-
      The action fetches data by navigating to URLs (if provided) to render their
      content. It does not mutate external data (no state-changing API calls to external
      systems). It mutates internal data by attaching the generated PNG/PDF files
      to the current case. It does not update entities, create insights, modify alert
      data, or create case comments.
