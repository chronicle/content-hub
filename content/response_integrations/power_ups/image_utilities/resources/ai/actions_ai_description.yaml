    internal_data_mutation_explanation: null
    reasoning: >-
      The action reads a local file, converts its format, and writes a new file to
      the local temporary directory on the Remote Agent. It does not fetch external
      data, mutate external systems, mutate internal SecOps data, update entities,
      or create insights.
