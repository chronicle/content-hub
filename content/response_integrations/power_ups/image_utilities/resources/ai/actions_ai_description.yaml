Rasterize Content:
  ai_description: >-
    ### General Description

    The Rasterize Content action converts vector or complex content (such as URLs,
    HTML, or Email bodies) into a fixed, bitmap image format (PNG) or a PDF document.
    It utilizes a headless browser (Playwright) to render the content accurately and
    can attach the resulting files directly to the current case or return their file
    paths.


    ### Flow Description

    1. The action extracts and validates the input parameters, including the input
    type (URL, HTML, Email), the content itself, and the desired output format (PNG,
    PDF, or Both).

    2. It verifies that the action is being executed on a Remote Agent, which is required
    for the headless browser to function.

    3. A Playwright browser session is initialized with the specified viewport dimensions
    (Width and Height).

    4. Depending on the `Input Type`, the action either navigates to the provided
    URLs or loads the provided HTML/Email content directly into the browser.

    5. The action waits for the specified page state (e.g., `NETWORK_IDLE`) or a specific
    CSS selector to ensure the content is fully loaded.

    6. It captures a screenshot (PNG) and/or generates a PDF of the rendered content.

    7. The generated files are either attached to the current case or their file paths
    are returned as JSON results, based on the `Export Method` parameter.


    ### Additional Notes

    - **Important:** This action requires a Remote Agent to function correctly.

    - Playwright and its browser dependencies must be installed on the Debian-based
    Remote Agent container for the action to execute successfully.

    - If `Full Screen` is enabled, the `Height` and `Width` parameters are ignored
    for the screenshot, and the viewport is adjusted to the full scrollable height
    of the page.
  ai_short_description: >-
    Converts URLs, HTML, or Email content into a fixed bitmap image (PNG) or PDF document
    using a headless browser, and attaches the output to the case.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
