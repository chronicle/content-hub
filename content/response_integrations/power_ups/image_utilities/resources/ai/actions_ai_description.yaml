OCR Image:
  ai_description: >-
    ### General Description

    Performs optical character recognition (OCR) to extract text from an image file.
    This action requires a Remote Agent with the `tesseract-ocr` package installed
    to function correctly.


    ### Flow Description

    1. Validates that either a Base64 encoded image or a file path is provided.

    2. Ensures the action is being executed on a Remote Agent.

    3. If a Base64 encoded image is provided, decodes it and saves it to a temporary
    file.

    4. Uses the Tesseract OCR engine to extract text from the image file.

    5. Returns the extracted text as a JSON result.


    ### Additional Notes

    If both "Base64 Encoded Image" and "File Path" are provided, "Base64 Encoded Image"
    takes precedence.
