Create Hash From Base64:
  ai_description: >-
    ### General Description

    Calculates cryptographic hashes for one or more provided base64 encoded strings
    using a specified hashing algorithm.


    ### Flow Description

    1. Retrieves the base64 encoded strings, names, and separators from the action
    parameters.

    2. Splits the base64 strings and names using their respective separators.

    3. Iterates through the base64 strings, decodes them, and calculates the hash
    using the specified algorithm (e.g., MD5, SHA1, SHA256).

    4. Constructs a JSON object containing the calculated hash, the algorithm used,
    the associated name (if provided), and optionally the original base64 string.

    5. Returns the list of JSON objects as the action result.


    ### Additional Notes

    Supported hashing algorithms include blake2b, blake2s, md5, sha1, sha224, sha256,
    sha384, sha3_224, sha3_256, sha3_384, sha3_512, and sha512.
