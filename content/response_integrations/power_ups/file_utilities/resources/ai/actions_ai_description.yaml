Add Entity to File:
  ai_description: >-
    ### General Description

    Adds the identifier of target entities to a specified local file on the SOAR execution
    environment. It ensures that each entity identifier is only added once, preventing
    duplicates.


    ### Flow Description

    1. Extracts the target filename from the action parameters.

    2. Opens and locks the specified local file (located in `/tmp/`) to prevent concurrent
    write issues.

    3. Iterates through all target entities in the case.

    4. Checks if the entity's identifier already exists in the file.

    5. If the identifier is not present, it appends it to the file.

    6. If the identifier is already present, it skips the addition and flags the result.


    ### Additional Notes

    The action returns False if any of the processed entities already existed in the
    file.
