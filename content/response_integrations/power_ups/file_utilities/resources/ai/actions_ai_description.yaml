Count Files:
  ai_description: >-
    ### General Description

    Counts the number of files in a specified local folder path that match a given
    file extension.


    ### Flow Description

    1. Extracts the `Folder`, `Is Recursive`, and `File Extension` parameters.

    2. Constructs the search path using the folder and file extension. If no file
    extension is provided, it defaults to `*.*`.

    3. Uses the Python `glob` library to search for matching files in the specified
    directory, optionally searching recursively based on the parameter.

    4. Returns the total count of matching files as the action result.


    ### Additional Notes

    This action executes locally on the SOAR runner and does not interact with external
    APIs or process case entities.
