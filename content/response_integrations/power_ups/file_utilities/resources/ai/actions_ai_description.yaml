Save Base64 to File:
  ai_description: >-
    ### General Description

    This action decodes one or more base64 encoded strings and saves them as files
    on the local system or the remote agent executing the action. It supports processing
    multiple files simultaneously by accepting comma-separated lists for inputs.


    ### Flow Description

    1. Retrieves the `Base64 Input`, `Filename`, and optional `File Extension` parameters,
    splitting them by commas to support multiple files.

    2. Determines the target directory path (`downloads` folder) and creates it if
    it does not already exist.

    3. Iterates through the provided filenames and base64 strings, appending the file
    extension if provided.

    4. Decodes each base64 string and writes the binary data to the corresponding
    file path.

    5. Collects metadata for each saved file, including the file name, path, and extension.

    6. Returns a JSON object containing the file details and completes the action
    with a summary message.


    ### Additional Notes

    - The action supports comma-separated lists for `Base64 Input`, `Filename`, and
    `File Extension` to process multiple files in a single execution.

    - If the number of file extensions provided is less than the number of filenames,
    the last provided extension is repeated for the remaining files.
  ai_short_description: >-
    Decodes base64 encoded strings and saves them as files on the local system or
    remote agent.
