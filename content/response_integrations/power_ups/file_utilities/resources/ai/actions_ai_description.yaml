Add Attachment:
  ai_description: >-
    ### General Description

    Adds a new file attachment to the Google SecOps case wall using a provided Base64
    encoded string. This action allows analysts or automated playbooks to attach evidence,
    logs, or other files directly to the case for investigation.


    ### Flow Description

    1. Retrieves the attachment details (Name, Type, Base64 Blob, Description, IsFavorite)
    from the action parameters.

    2. Constructs a `CaseWallAttachment` object with the provided details and the
    current case identifier.

    3. Makes an internal API call (`save_attachment_to_case_wall`) to upload and attach
    the file to the case wall.

    4. Formats the response and returns the attachment metadata as a JSON result.


    ### Additional Notes

    The action operates entirely within the Google SecOps platform and does not interact
    with external third-party services. Ensure the Base64 string is properly encoded
    to prevent file corruption upon upload.
  ai_short_description: >-
    Adds a new file attachment to the Google SecOps case wall using a provided Base64
    encoded string.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
