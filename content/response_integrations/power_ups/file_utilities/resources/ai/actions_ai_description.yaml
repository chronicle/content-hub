Create Archive:
  ai_description: >-
    ### General Description

    Creates an archive file (such as zip, tar, gztar, bztar, or xztar) from a provided
    list of files or a directory path on the local SOAR server.


    ### Flow Description

    1. Extracts the archive type, base name, and input path(s) from the action parameters.

    2. Checks if the destination directory exists on the local filesystem, creating
    it if necessary.

    3. If the input is a directory, it archives the entire directory.

    4. If the input is a list of files, it copies them to a temporary directory and
    archives that directory.

    5. Returns the path to the newly created archive file and adds it to the JSON
    result.


    ### Additional Notes

    The archive is stored locally on the SOAR server at `/opt/siemplify/siemplify_server/Scripting/FileUtilities/Archives`.
