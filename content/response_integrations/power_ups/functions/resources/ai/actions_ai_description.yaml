Create Thumbnail:
  ai_description: >-
    ### General Description

    Creates a base64-encoded thumbnail of an image provided either directly as a base64
    string or extracted from a JSON input. The action resizes the image to the specified
    dimensions and returns the new base64 string.


    ### Flow Description

    1. Extracts action parameters including the base64 image string, thumbnail size,
    input JSON, and image key path.

    2. If an `Input JSON` is provided, the action parses the JSON, iterates through
    the objects, extracts the base64 image using the specified `Image Key Path`, and
    generates a thumbnail for each.

    3. If no `Input JSON` is provided, it directly generates a thumbnail from the
    provided `Base64 Image` string.

    4. Resizes the image(s) to the specified X and Y pixel dimensions using the Python
    Imaging Library (PIL).

    5. Returns the resulting base64-encoded thumbnail(s) as a JSON result.


    ### Additional Notes

    This action operates entirely locally within the script environment as a utility
    function and does not make any external API calls.
