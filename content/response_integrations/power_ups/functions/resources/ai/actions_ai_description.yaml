    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: null
    reasoning: >-
      The action performs local time calculations using the `arrow` library. It does
      not fetch data from external sources, mutate external systems, or modify internal
      case data (entities, insights, alerts, or comments). It only returns a JSON
      result.
