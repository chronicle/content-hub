Time Duration Calculator:
  ai_description: >-
    ### General Description

    The Time Duration Calculator action calculates the time elapsed or the difference
    between two specified datetime values. It returns the duration broken down into
    years, days, hours, minutes, and seconds, as well as the total duration in seconds.


    ### Flow Description

    1. Extracts the two input datetime strings and their respective strftime formats
    from the action parameters.

    2. Parses the inputs into datetime objects. If an input is set to "now", it substitutes
    the current UTC time.

    3. Checks the timezone awareness of the parsed datetime objects and localizes
    them to UTC if no timezone information is present.

    4. Calculates the mathematical difference between the two datetime objects.

    5. Outputs the calculated duration as a JSON object containing the difference
    in years, days, hours, minutes, and seconds, and sets the total seconds as the
    primary script result.


    ### Additional Notes

    This is a local utility action that performs mathematical calculations on timestamps.
    It does not interact with any external APIs, nor does it modify case data or entities
    within Google SecOps.
  ai_short_description: >-
    Calculates the time elapsed or the difference between two specified datetime values,
