Convert Time Format:
  ai_description: >-
    ### General Description

    Converts a provided datetime value from one specified format to another using
    the Arrow library. It allows for time shifting (adding or subtracting seconds)
    and timezone conversions, returning the newly formatted datetime string as the
    action's result.


    ### Flow Description

    1. Retrieves the input datetime string, its current format, the desired output
    format, any time delta, and the target timezone from the action parameters.

    2. Parses the input string into a datetime object, handling specific UTC/GMT offsets
    and epoch timestamps (10 or 13 digits).

    3. Applies the specified time delta shift in seconds to the parsed datetime object,
    if provided.

    4. Converts the datetime object to the target timezone, if specified.

    5. Formats the resulting datetime object into the desired output format and returns
    it as the action's result.


    ### Additional Notes

    This is a utility action that operates entirely locally within the SOAR platform
    and does not make any external API calls or modify case entities.
