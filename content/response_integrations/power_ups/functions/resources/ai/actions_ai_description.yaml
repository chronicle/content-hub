    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Updates the additional properties of target ADDRESS entities with their detected
      IP type (IPv4 or IPv6).
    reasoning: >-
      The action does not fetch data from external sources or mutate external data.
      It mutates internal data by updating the `additional_properties` of target entities
      and calling `siemplify.update_entities()`. It does not create insights, modify
