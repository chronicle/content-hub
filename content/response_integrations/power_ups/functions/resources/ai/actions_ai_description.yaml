Defang Text:
  ai_description: >-
    ### General Description

    Defangs input text by modifying URLs, IP addresses, and email addresses to prevent
    accidental execution or clicking of potentially malicious indicators.


    ### Flow Description

    1. Extracts the input text provided in the action parameters.

    2. Checks if the input text is empty; if so, returns an empty result.

    3. Applies regular expressions to replace 'http/https' with 'hxxp', dots with
    '[.]' in URLs and IPs, and '@' with '[at]' in emails.

    4. Returns the defanged text as a JSON result.


    ### Additional Notes

    This is a local utility action that performs text manipulation using regular expressions.
    It does not make any external API calls, nor does it modify case entities or internal
    SecOps data.
