Detect Hash Type:
  ai_description: >-
    ### General Description

    Detects the most likely hash type for provided hashes and FILEHASH entities. Supported
    hash types include SHA-256, MD5, SHA-1, and SHA-512.


    ### Flow Description

    1. Retrieves the comma-separated list of hashes from the `Hashes` parameter.

    2. Analyzes each provided hash using the local `hashid` library to determine its
    type.

    3. Iterates through the target entities, specifically filtering for `FILEHASH`
    entities.

    4. Analyzes the identifier of each `FILEHASH` entity to determine its hash type.

    5. Updates the `additional_properties` of the analyzed entities with the detected
    `HashType`.

    6. Saves the updated entities back to the platform.

    7. Outputs the results as a JSON object containing the hashes and their detected
    types.


    ### Additional Notes

    If a hash type cannot be determined or is not among the supported types, it will
    be marked as "UNDETECTED".
  ai_short_description: >-
