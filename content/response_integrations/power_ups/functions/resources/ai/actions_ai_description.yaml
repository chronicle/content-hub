Detect IP Type:
  ai_description: >-
    ### General Description

    Detects whether provided IP addresses or target IP Address entities are IPv4 or
    IPv6. It enriches the entities with an `IPType` field in their additional properties
    and returns a JSON result mapping each address to its detected type.


    ### Flow Description

    1. Retrieves the comma-separated list of IP addresses from the action parameters.

    2. Evaluates each provided IP address against IPv4 and IPv6 regular expressions.

    3. Iterates through the target entities, filtering for those with the type `ADDRESS`.

    4. Evaluates each entity's identifier against the IP regular expressions.

    5. Updates the `additional_properties` of the matched entities with the detected
    `IPType` (IPV4, IPV6, or UNDETECTED).

    6. Saves the updated entities back to the platform and outputs a JSON result containing
    the classifications.


    ### Additional Notes

    This action operates entirely locally using regular expressions and does not make
    any external API calls.
  ai_short_description: >-
    Evaluates provided IP addresses and target IP Address entities to determine if
    they are IPv4 or IPv6, enriching the entities with the detected type and returning
    the classifications as a JSON object.
