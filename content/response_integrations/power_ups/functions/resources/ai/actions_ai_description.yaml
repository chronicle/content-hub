SanitizeHTML:
  ai_description: >-
    ### General Description

    Sanitizes a provided HTML fragment by parsing it according to the HTML5 parsing
    algorithm and removing disallowed tags, attributes, and styles. This action utilizes
    the `bleach` library to safely clean HTML content, handling unclosed or misnested
    tags while neutralizing potentially malicious elements.


    ### Flow Description

    1. Extracts the `Input HTML` string and configuration parameters, including allowed
    tags, attributes, and styles.

    2. Initializes the HTML sanitizer and CSS sanitizer based on the provided allowlists
    and boolean flags (e.g., `Allow All Attributes`).

    3. Processes the input HTML fragment to strip or escape any elements, attributes,
    or CSS properties that are not explicitly permitted.

    4. Returns the sanitized HTML string as the action's result.


    ### Additional Notes

    This is a local utility action that does not make any external API calls. It is
    highly useful for neutralizing potentially malicious HTML content (such as XSS
    payloads) before displaying it in a UI or processing it further in a playbook.
