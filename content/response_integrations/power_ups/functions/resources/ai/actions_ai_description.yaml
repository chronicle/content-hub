Calculate Timestamp:
  ai_description: >-
    ### General Description

    Calculates a new timestamp by applying a specified time delta (forward or backward)
    to a baseline starting time. The baseline can be the current time, alert creation
    time, case creation time, or a custom provided timestamp.


    ### Flow Description

    1. Extracts the baseline timestamp based on the selected `Input Type` (Current
    Time, Alert Creation Time, Case Creation Time, or Custom Timestamp).

    2. Parses the provided `Timestamp Delta` string (e.g., +30M, -1d) to determine
    the offset value and direction.

    3. Applies the calculated offset to the baseline timestamp using local time manipulation
    libraries.

    4. Formats the resulting timestamp according to the specified `Output Timestamp
    Format` (defaulting to epoch time).

    5. Returns the original and calculated timestamps as a JSON result for use in
    subsequent playbook steps.


    ### Additional Notes

    This is a local utility action that does not interact with external services,
    APIs, or modify case data.
  ai_short_description: >-
    Calculates a new timestamp by applying a specified time delta to a baseline starting
    time.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
