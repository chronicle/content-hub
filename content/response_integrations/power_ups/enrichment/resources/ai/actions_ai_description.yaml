Whois:
  ai_description: >-
    ### General Description

    The Whois action queries WHOIS and RDAP servers to retrieve domain and IP registration
    information. It supports enriching IP Addresses, URLs, Email addresses, and Domains.
    Additionally, the action can create new DOMAIN entities linked to the target entity
    and evaluate the domain's age against a specified threshold to automatically mark
    newly registered domains as suspicious.


    ### Flow Description

    1. The action iterates through all target entities provided in the case.

    2. If the entity is an IP Address, it performs an RDAP lookup and a geolocation
    lookup using the db-ip.com API and OpenStreetMap.

    3. For all other entity types, it attempts to extract a valid domain from the
    entity identifier.

    4. If a domain is found, it performs a WHOIS lookup to retrieve registration details
    and calculates the domain's age in days.

    5. If the `Create Entities` parameter is enabled, it creates a new DOMAIN entity
    in the case and links it to the original entity.

    6. The retrieved WHOIS/RDAP data is appended to the entity's `additional_properties`.

    7. If the calculated domain age is less than the `Domain Age Threshold`, the entity
    is marked as suspicious.

    8. The entity is marked as enriched, and the updates are saved back to the platform.

    9. The raw WHOIS and geolocation data is added to the action's JSON result.


    ### Additional Notes

    This action relies on external services such as `api.db-ip.com` and OpenStreetMap
    (via the `geocoder` library) for IP geolocation, as well as standard WHOIS/RDAP
    protocols. Ensure that the environment allows outbound connections to these services.
  ai_short_description: >-
    Queries WHOIS and RDAP servers to retrieve domain and IP registration information,
    enriches entities, and optionally creates linked domain entities or marks them
    as suspicious based on domain age.
