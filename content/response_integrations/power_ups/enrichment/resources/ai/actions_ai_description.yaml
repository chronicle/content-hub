Enrich Entities from List with Field:
  ai_description: >-
    ### General Description

    This action enriches a specified list of entities within a case by adding a custom
    field and value to their additional properties. It allows analysts to dynamically
    tag or append information to entities of a specific type based on a delimited
    input list.


    ### Flow Description

    1. Retrieves the list of target entities, entity type, delimiter, enrichment field,
    and enrichment value from the action parameters.

    2. Parses the delimited list of entities into individual identifiers.

    3. Retrieves all entities associated with the alerts in the current case.

    4. Matches the parsed identifiers against the case entities, filtering by the
    specified entity type.

    5. Appends the provided enrichment field and value to the `additional_properties`
    dictionary of each matched entity.

    6. Updates the modified entities within the Google SecOps platform.


    ### Additional Notes

    This is a utility action that modifies internal case data and does not interact
    with external third-party services.
  ai_short_description: >-
    Enriches a specified list of entities within a case by adding a custom field and
    value to their additional properties.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: false
    internal_data_mutation_explanation: >-
      Updates the additional_properties dictionary of matched entities within the
      case.
    reasoning: >-
      The action does not fetch data from external sources or mutate external data.
      It mutates internal data by updating the 'additional_properties' of entities
      and saves these changes using 'siemplify.update_entities'. It does not create
      insights, modify alert data, or create case comments.
