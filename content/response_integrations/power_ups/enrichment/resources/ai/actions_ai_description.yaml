Enrich Entity From Event Field:
  ai_description: >-
    ### General Description

    Enriches entities by extracting specific fields from their associated security
    events and adding them to the entities' properties. This action operates entirely
    within the Google SecOps platform, utilizing existing event data to provide additional
    context to entities without requiring external API calls.


    ### Flow Description

    1. Determines the execution scope (Alert or Case).

    2. Iterates through the target alerts based on the execution scope.

    3. For each alert, retrieves the first associated security event.

    4. Extracts the requested fields from the event's additional properties.

    5. Identifies the entities associated with the alert.

    6. Updates the `additional_properties` of these entities with the extracted fields.

    7. Saves the updated entities back to the platform using `siemplify.update_entities`.

    8. Returns a JSON result containing the enriched fields.


    ### Additional Notes

    This action does not interact with external services. It relies on the data already
    present in the security events attached to the alerts.
