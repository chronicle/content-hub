Enrich Entity from Explorer Attributes:
  ai_description: >-
    ### General Description

    Enriches entities with historic enrichment data using the Google SecOps Entity
    Explorer. This action retrieves previously recorded fields for the target entities
    and updates their current properties or additional properties based on a specified
    allowlist or denylist.


    ### Flow Description

    1. Retrieves the list of target entities from the case.

    2. For each entity, makes an API call to the Google SecOps API (`get_entity_data`)
    to fetch its historic data from the Entity Explorer.

    3. Filters the retrieved fields based on the `Field Name` and `Use Field Name
    as Whitelist` parameters.

    4. Updates the entity's properties or `additional_properties` with the filtered
    fields, excluding predefined system fields.

    5. Saves the updated entities back to the platform using `siemplify.update_entities`.

    6. Returns a JSON result containing the updated fields for each entity.


    ### Additional Notes

    - System fields (e.g., `Type`, `Environment`, `IsInternalAsset`) are automatically
    excluded from being updated to prevent overwriting critical entity metadata.
