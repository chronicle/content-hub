Enrich Entity From JSON:
  ai_description: >-
    ### General Description

    Enriches entities by extracting fields from a provided JSON string and adding
    them to the entities' additional properties.


    ### Flow Description

    1. Parses the provided JSON string (expected to be a list of JSON objects).

    2. Iterates through all target entities in the case.

    3. For each entity, it searches the JSON objects for a specific key path.

    4. If the key path is found, it extracts the JSON data (optionally using a JSONPath
    expression), flattens the dictionary, and optionally adds a prefix.

    5. Updates the entity's additional properties with the extracted data.

    6. Saves the updated entities back to the case.


    ### Additional Notes

    The action processes all entity types. Note that the current implementation does
    not explicitly match the extracted JSON identifier with the entity's identifier;
    it enriches the entity as long as the key path exists in the JSON.
