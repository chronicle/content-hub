have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  # Was -1 (unlimited). The agent posted the same finding up to 9x per PR; cap it and let
  # the styleguide's "one comment per distinct issue" rule do the rest.
  max_review_comments: 15
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true
ignore_patterns:
- "content/playbooks/**"
# Generated / binary files that only produce noise when reviewed.
- "**/uv.lock"
- "**/*.whl"
- "**/resources/*.svg"
- "**/resources/*.png"
