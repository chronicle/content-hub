    internal_data_mutation_explanation: null
    reasoning: >-
      The action queries internal SOAR custom lists using the SOAR API (`get_traking_list_record`).
      It does not fetch data from external sources, mutate external or internal data,
      update entities, create insights, modify alerts, or create case comments.
