SearchCustomLists:
  ai_description: >-
    ### General Description

    Searches for a specified string within the records of Google SecOps custom lists.
    This action retrieves custom list data from the platform and filters it based
    on the provided search criteria, returning the matched records for further use
    in the playbook.


    ### Flow Description

    1. Extracts the `Categories` and `String to Search` input parameters.

    2. Calls the internal SOAR API to retrieve custom list records, optionally filtering
    by the provided categories.

    3. Iterates through the retrieved records to find matches where the `String to
    Search` is present in the record's entity identifier.

    4. Outputs the matching records as a JSON result and completes the action.


    ### Additional Notes

    If no categories or search strings are provided, the action will return all available
    custom list records. This action only reads data from the platform and does not
    modify any custom lists.
  ai_short_description: >-
    Searches for a specified string within the records of Google SecOps custom lists
    and returns the matching records.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
