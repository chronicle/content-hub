EnrichEntities:
  ai_description: >-
    ### General Description

    Enriches Hostname and User entities with Active Directory properties. This action
    retrieves detailed information about users and hosts from Active Directory, updates
    the entities with the fetched attributes, and optionally marks them as internal.


    ### Flow Description

    1. Extracts configuration and action parameters.

    2. Initializes the Active Directory manager to establish a connection.

    3. Iterates over the target entities, filtering for supported types (User and
    Hostname).

    4. Queries Active Directory for each entity to retrieve its properties.

    5. Filters the retrieved attributes based on the provided specific attribute names,
    if any.

    6. Updates the entity's additional properties with the enrichment data and optionally
    marks it as internal.

    7. Saves the updated entities back to the platform.

    8. Generates JSON results and case wall tables with the enrichment data.


    ### Additional Notes

    - The action supports asynchronous execution to handle long-running queries or
    large numbers of entities.

    - If specific attributes are provided, the enrichment data, JSON results, and
    case wall tables can be filtered to include only those attributes.
  ai_short_description: >-
    Enriches Hostname and User entities with Active Directory properties by querying
    the Active Directory server and updating the entities with the retrieved data.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: true
    can_update_entities: true
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: >-
      Updates the target entities' additional properties with Active Directory data
      and modifies their is_enriched and is_internal flags.
    reasoning: >-
      The action fetches data from Active Directory using LDAP queries (fetches_data=true).
      It does not mutate external data (can_mutate_external_data=false). It mutates internal data by updating
      the entities' additional properties and flags (can_mutate_internal_data=true,
      can_update_entities=true). It does not create insights, modify alert data, or
      create case comments.
  entity_usage:
    entity_types:
      address: false
      alert: false
      application: false
      child_hash: false
      child_process: false
      cluster: false
      container: false
      credit_card: false
      cve: false
      cve_id: false
      database: false
      deployment: false
      destination_domain: false
      domain: false
      email_message: false
      event: false
      file_hash: false
      file_name: false
      generic: false
      host_name: true
      ip_set: false
      mac_address: false
      parent_hash: false
      parent_process: false
      phone_number: false
      pod: false
      process: false
      service: false
      source_domain: false
      threat_actor: false
      threat_campaign: false
      threat_signature: false
      url: false
      usb: false
      user: true
    filters_by_additional_properties: false
    filters_by_alert_identifier: false
    filters_by_case_identifier: false
    filters_by_creation_time: false
    filters_by_entity_type: true
    filters_by_identifier: false
    filters_by_is_artifact: false
    filters_by_is_enriched: false
    filters_by_is_internal: false
    filters_by_is_pivot: false
    filters_by_is_suspicious: false
    filters_by_is_vulnerable: false
    filters_by_modification_time: false
    reasoning: >-
      The code iterates over `siemplify.target_entities` and filters them using `entity.entity_type
      in SUPPORTED_ENTITY_TYPES`, where `SUPPORTED_ENTITY_TYPES = [EntityTypes.USER,
      EntityTypes.HOSTNAME]`. Therefore, it targets User and Hostname entities, filtering
      by `entity_type`.
  outcome_categories:
    add_alert_comment: false
    add_ioc_to_allowlist: false
    add_ioc_to_blocklist: false
    contain_host: false
    create_ticket: false
    delete_email: false
    disable_identity: false
    download_file: false
    enable_identity: false
    enrich_asset: true
    enrich_ioc: false
    execute_command_on_the_host: false
    get_alert_information: false
    reasoning: >-
      The action fetches contextual metadata for users and hosts from Active Directory,
      which aligns with the 'Enrich Asset' category. It does not perform any other
      operations like updating alerts, mutating external systems, or managing tickets.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
    search_events: false
    send_email: false
    send_message: false
    submit_file: false
    uncontain_host: false
    update_alert: false
    update_email: false
    update_identity: false
    update_ticket: false
  parameters_description: "| Parameter | Type | Mandatory | Description |\n| --- |\
    \ --- | --- | --- |\n| Mark entities as internal | Boolean | No | Specify whether\
    \ successfully enriched entities should be automatically marked as \u201CInternal\
    \ Entity\u201D |\n| Specific Attribute Names To Enrich With | String | No | Provide\
    \ a comma separated list of attribute names to enrich the entities with. If nothing\
    \ is provided - action will enrich with all available attributes. If an attribute\
    \ contains a few values - it will be enriched with all of the available values.\
    \ Parameter is case sensitive. |\n| Should Case Wall Table be filtered by the\
    \ specified Attributes? | Boolean | No | If checked, the Case Wall Table for this\
    \ action will only present the specified attributes, found in the \u201CSpecific\
    \ Attribute Names To Enrich With\u201D parameter. |\n| Should JSON result be filtered\
    \ by the specified Attributes? | Boolean | No | If checked, the JSON result for\
    \ this action will only return the specified attributes, found in the \u201CSpecific\
    \ Attribute Names To Enrich With\u201D parameter. |"
