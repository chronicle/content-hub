    reasoning: >-
      The action uploads files to VirusTotal for scanning and retrieves the behavior
      report/threat score. This directly aligns with the 'Submit File' outcome category.
    remove_ioc_from_allowlist: false
    remove_ioc_from_blocklist: false
    reset_identity_password: false
    search_asset: false
    search_email: false
    search_events: false
    send_email: false
    send_message: false
    submit_file: true
    uncontain_host: false
    update_alert: false
    update_email: false
    update_identity: false
    update_ticket: false
  parameters_description: >-
    | Parameter | Type | Mandatory | Description |

    | --- | --- | --- | --- |

    | Threshold | String | Yes | Entity risk threshold. If the number of positive
    detections exceeds this value, an insight is created. |

    | File Paths | String | Yes | Target file paths to be scanned. Multiple paths
    can be provided as a comma-separated list. |

    | Linux Server Address | String | No | Linux server address (e.g., x.x.x.x) if
    the files are located on a remote server. |

    | Linux User | String | No | Username for the remote Linux server. |

    | Linux Password | Password | No | Password for the remote Linux server. |
