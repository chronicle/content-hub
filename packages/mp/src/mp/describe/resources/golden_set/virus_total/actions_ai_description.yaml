UploadAndScanFile:
  ai_description: >-
    ### General Description

    Uploads and scans files using VirusTotal. The files can be provided via local
    paths or retrieved from a remote Linux server using SSH/SFTP credentials. It then
    retrieves the analysis reports and evaluates the risk based on a specified threshold.


    ### Flow Description

    1. Retrieves the specified files either locally or from a remote Linux server
    (if Linux credentials and address are provided).

    2. Submits the files to VirusTotal for scanning via a POST request.

    3. Asynchronously polls VirusTotal to check the status of the submitted scans.

    4. Once the scans are complete, retrieves the analysis reports and associated
    comments.

    5. Evaluates the number of positive detections against the provided threshold.

    6. Creates a case insight if the threshold is exceeded and attaches the results
    as JSON, data tables, and web links to the action results.


    ### Additional Notes

    This action runs asynchronously. Ensure that the provided file paths are accessible
    either locally on the SOAR platform or on the specified remote Linux server.
  ai_short_description: >-
    Uploads files from local paths or a remote Linux server to VirusTotal for scanning,
    retrieves the analysis reports, and creates case insights if the detection threshold
    is exceeded.
  capabilities:
    can_create_case_comments: false
    can_create_insight: true
    can_modify_alert_data: false
    can_mutate_external_data: true
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: >-
      Uploads files to the VirusTotal analysis engine for scanning.
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action fetches scan reports from VirusTotal (fetches_data=true). It uploads
      files to VirusTotal, which changes the state of the external analysis engine
      (can_mutate_external_data=true). It creates case insights if the detection threshold
      is met (can_create_insight=true). It does not update entities, modify alert
      data, or create case comments.
