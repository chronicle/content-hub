default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: content-hub-secret-scan-staged
        name: Scan staged changes for secrets, tenant URLs, and internal refs
        entry: python3 tools/security/scan_secrets.py --mode staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: content-hub-secret-scan-pre-push
        name: Scan all unpushed commits and blobs (including deleted secrets) before push
        entry: bash .githooks/pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: Gitleaks staged secret check
        args: ["--config=.gitleaks.toml", "--redact"]
        stages: [pre-commit]
